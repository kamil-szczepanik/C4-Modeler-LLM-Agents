level: component
scope: "Component diagram for the Reporting & Analytics Service container"
parentContainer:
  name: "Reporting & Analytics Service"
elements:
  - type: "component"
    name: "Data Ingestion Processor"
    technology: "Python, Celery"
    description: "ETL service responsible for processing and ingesting data."
  - type: "component"
    name: "Analytics Engine"
    technology: "Pandas, NumPy"
    description: "Processing engine for clinical and operational insights."
  - type: "component"
    name: "Semantic Layer"
    technology: "dbt"
    description: "Abstraction layer for defining business metrics-as-code."
  - type: "component"
    name: "Query Orchestrator"
    technology: "Custom Routing Logic"
    description: "Dynamic routing between real-time PostgreSQL data and historical S3 data."
  - type: "component"
    name: "Visualization API"
    technology: "FastAPI"
    description: "Interface for serving dashboard data."
  - type: "component"
    name: "Storage Layer"
    technology: "PostgreSQL, S3 (Parquet)"
    description: "Hybrid storage for analytical reads and immutable data lake storage."
relationships:
  - source: "Data Ingestion Processor"
    destination: "Storage Layer"
    description: "Writes processed data to PostgreSQL and S3"
  - source: "Query Orchestrator"
    destination: "Storage Layer"
    description: "Reads data based on age and type"
  - source: "Visualization API"
    destination: "Query Orchestrator"
    description: "Requests data for dashboards"
  - source: "Analytics Engine"
    destination: "Semantic Layer"
    description: "Applies business metrics definitions"
  - source: "Analytics Engine"
    destination: "Storage Layer"
    description: "Processes raw data from storage"