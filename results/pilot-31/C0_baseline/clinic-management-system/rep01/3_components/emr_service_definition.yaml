level: component
scope: "Component diagram for the EMR Service container"
parentContainer:
  name: "EMR Service"
elements:
  - type: "component"
    name: "Clinical Record Manager"
    technology: "ACID-compliant Transaction Engine"
    description: "Handles primary clinical data write operations and event sourcing."
  - type: "component"
    name: "Clinical Read Model"
    technology: "Optimized Projection Engine"
    description: "Provides low-latency data retrieval for clinical history."
  - type: "component"
    name: "Access Control Provider"
    technology: "Open Policy Agent (OPA)"
    description: "Enforces authorization policies for clinical data access."
  - type: "component"
    name: "Emergency Access Controller"
    technology: "Break-glass Authorization Module"
    description: "Manages clinical emergency overrides for restricted records."
relationships:
  - source: "Clinical Record Manager"
    destination: "Clinical Read Model"
    description: "Synchronizes via event sourcing (CQRS pattern)"
  - source: "EMR Service"
    destination: "Audit Log Service"
    description: "Asynchronous event streaming via sidecar"
  - source: "EMR Service"
    destination: "FHIR Integration Service"
    description: "FHIR RESTful APIs for external data exchange"
  - source: "Clinical API Gateway"
    destination: "EMR Service"
    description: "gRPC internal routing"