level: component
scope: "Component diagram for the Patient Portal container"
parentContainer:
  name: "Patient Portal"
elements:
  - type: "component"
    name: "Patient Dashboard Controller"
    technology: "Express.js/GraphQL Federation"
    description: "Aggregates backend data from EMR and Billing services for the frontend."
  - type: "component"
    name: "Relationship Management Component"
    technology: "Node.js"
    description: "Manages delegated access permissions for caregivers and patients."
  - type: "component"
    name: "Real-time Messaging Gateway"
    technology: "Socket.io"
    description: "Enables secure, low-latency clinical communication between patients and caregivers."
  - type: "component"
    name: "Identity Provider Interface"
    technology: "Auth0/OIDC"
    description: "Handles authentication, MFA, and token introspection."
relationships:
  - source: "Patient Dashboard Controller"
    destination: "EMR Service"
    description: "Executes GraphQL queries with field-level authorization via Istio mTLS"
  - source: "Patient Dashboard Controller"
    destination: "Billing Service"
    description: "Executes GraphQL queries via Istio mTLS"
  - source: "Patient Dashboard Controller"
    destination: "Identity Provider Interface"
    description: "Validates tokens via OIDC introspection"
  - source: "Relationship Management Component"
    destination: "Patient Dashboard Controller"
    description: "Provides authorization context for data aggregation"
  - source: "Real-time Messaging Gateway"
    destination: "Patient Dashboard Controller"
    description: "Synchronizes session state and clinical alerts"