level: component
scope: "Component diagram for the Clinical API Gateway container"
parentContainer:
  name: "Clinical API Gateway"
elements:
  - type: "component"
    name: "Request Router"
    technology: "Envoy Proxy"
    description: "Handles high-performance routing, mTLS termination, and QoS traffic prioritization."
  - type: "component"
    name: "Authentication Manager"
    technology: "Keycloak OIDC Client"
    description: "Validates identity tokens and enforces Token Binding (RFC 8471)."
  - type: "component"
    name: "gRPC-Web Adapter"
    technology: "gRPC-web"
    description: "Minimizes serialization overhead for frontend-to-gateway communication."
  - type: "component"
    name: "Service Orchestrator"
    technology: "Go"
    description: "Manages gRPC communication with downstream services using circuit-breaker patterns."
  - type: "component"
    name: "Telemetry Collector"
    technology: "OpenTelemetry"
    description: "Instruments distributed tracing for observability and latency monitoring."
relationships:
  - source: "Request Router"
    destination: "Authentication Manager"
    description: "Validates incoming requests"
  - source: "Request Router"
    destination: "gRPC-Web Adapter"
    description: "Routes frontend traffic"
  - source: "Service Orchestrator"
    destination: "EMR Service"
    description: "Invokes via gRPC with circuit-breaker"
  - source: "Service Orchestrator"
    destination: "Billing Service"
    description: "Invokes via gRPC with circuit-breaker"
  - source: "Service Orchestrator"
    destination: "FHIR Integration Service"
    description: "Invokes via REST/FHIR"
  - source: "Service Orchestrator"
    destination: "Audit Log Service"
    description: "Streams events asynchronously via NATS/Kafka"