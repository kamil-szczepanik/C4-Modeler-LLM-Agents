level: component
scope: "Component diagram for the Billing Service container"
parentContainer:
  name: "Billing Service"
elements:
  - type: "component"
    name: "Invoice Manager"
    technology: "FastAPI"
    description: "Handles RESTful CRUD operations and patient-facing billing logic."
  - type: "component"
    name: "Claim Processor"
    technology: "Celery/RabbitMQ"
    description: "Asynchronous worker for Clearinghouse Gateway interactions."
  - type: "component"
    name: "Payment Orchestrator"
    technology: "Python/State Machine"
    description: "Manages state machines for installment plans and PCI-DSS compliant payment processing."
  - type: "component"
    name: "Statement Generator"
    technology: "Jinja2"
    description: "Produces itemized patient statements and PDFs."
  - type: "component"
    name: "PostgreSQL"
    technology: "PostgreSQL"
    description: "Primary database with row-level security (RLS) and TDE."
  - type: "component"
    name: "S3 Glacier"
    technology: "AWS S3 Glacier"
    description: "Long-term immutable storage for 10-year data retention."
  - type: "container"
    name: "Clinical API Gateway"
    technology: "gRPC"
    description: "Entry point for service-to-service communication."
  - type: "container"
    name: "Clearinghouse Gateway"
    technology: "REST/HTTPS"
    description: "External gateway for insurance claim processing."
  - type: "container"
    name: "Payment Gateway"
    technology: "REST/HTTPS"
    description: "External PCI-DSS compliant payment processing service."
  - type: "container"
    name: "Audit Log Service"
    technology: "Event Streaming"
    description: "Service for real-time, cryptographically signed event logging."
relationships:
  - source: "Clinical API Gateway"
    destination: "Billing Service"
    description: "Invokes via gRPC with mTLS"
  - source: "Billing Service"
    destination: "Clearinghouse Gateway"
    description: "Outbound calls protected by Resilience4j circuit breakers"
  - source: "Billing Service"
    destination: "Payment Gateway"
    description: "Tokenized API communication via PCI-DSS compliant trust zone"
  - source: "Billing Service"
    destination: "Audit Log Service"
    description: "Streams cryptographically signed events"
  - source: "Invoice Manager"
    destination: "PostgreSQL"
    description: "Reads and writes billing data"
  - source: "Claim Processor"
    destination: "Clearinghouse Gateway"
    description: "Processes insurance claims asynchronously"
  - source: "Payment Orchestrator"
    destination: "Payment Gateway"
    description: "Executes payment transactions"
  - source: "Statement Generator"
    destination: "S3 Glacier"
    description: "Archives patient statements"