level: component
scope: "Component diagram for the FHIR Integration Service container"
parentContainer:
  name: "FHIR Integration Service"
elements:
  - type: "component"
    name: "FHIR Facade Controller"
    technology: "REST Controller"
    description: "Handles request validation and routing for incoming FHIR API calls."
  - type: "component"
    name: "Transformation Engine"
    technology: "Java/HAPI FHIR"
    description: "Maps internal schemas to FHIR resources and performs data transformation."
  - type: "component"
    name: "Outbox/Message Queue"
    technology: "Kafka"
    description: "Decouples processing and ensures asynchronous delivery of messages."
  - type: "component"
    name: "Integration Configuration Manager"
    technology: "HashiCorp Consul"
    description: "Manages vendor-specific metadata and dynamic connection secrets."
  - type: "component"
    name: "Schema Registry"
    technology: "FHIR Profile Validator"
    description: "Enforces versioned FHIR profile validation for R4/R5 resources."
  - type: "component"
    name: "Sidecar Proxies"
    technology: "Istio"
    description: "Manages mTLS, logging, and HIPAA audit trails for the service."
relationships:
  - source: "FHIR Facade Controller"
    destination: "Transformation Engine"
    description: "Routes validated requests for mapping"
  - source: "Transformation Engine"
    destination: "Schema Registry"
    description: "Validates payloads against versioned HL7 FHIR profiles"
  - source: "Transformation Engine"
    destination: "Outbox/Message Queue"
    description: "Publishes transformed resources for asynchronous delivery"
  - source: "Integration Configuration Manager"
    destination: "Transformation Engine"
    description: "Provides dynamic routing and vendor-specific connection secrets"
  - source: "Sidecar Proxies"
    destination: "FHIR Facade Controller"
    description: "Secures traffic via mTLS and logs audit trails"