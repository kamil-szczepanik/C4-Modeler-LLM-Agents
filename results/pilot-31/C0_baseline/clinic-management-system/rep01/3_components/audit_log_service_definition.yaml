level: component
scope: "Component diagram for the Audit Log Service container"
parentContainer:
  name: "Audit Log Service"
elements:
  - type: "component"
    name: "Ingestion Controller"
    technology: "Go"
    description: "Handles asynchronous event processing and implements circuit breaking for incoming logs."
  - type: "component"
    name: "Log Processor"
    technology: "Go"
    description: "Performs schema validation and cryptographic hashing of events."
  - type: "component"
    name: "Search Indexer"
    technology: "OpenSearch"
    description: "Facilitates rapid retrieval and query performance for compliance monitoring."
  - type: "component"
    name: "Storage Controller"
    technology: "Go"
    description: "Interface for S3 Glacier with WORM Object Lock for immutable storage."
  - type: "component"
    name: "Event Orchestrator"
    technology: "Go"
    description: "Manages DSAR workflows, log redaction, and health scoring."
  - type: "component"
    name: "Query API"
    technology: "Go/gRPC"
    description: "Provides a read-only interface for auditors, secured via an Identity Proxy."
  - type: "component"
    name: "Sidecar"
    technology: "EMR"
    description: "Handles local event buffering and mTLS-secured transmission."
relationships:
  - source: "Sidecar"
    destination: "Ingestion Controller"
    description: "Asynchronous event shipment via mTLS"
  - source: "Query API"
    destination: "Compliance Dashboard"
    description: "HTTPS/gRPC for secure, ABAC-restricted auditing"
  - source: "Storage Controller"
    destination: "S3 Glacier"
    description: "WORM-compliant archival with quarterly checksum verification"
  - source: "Identity Proxy"
    destination: "IAM Provider"
    description: "Validates claims for non-repudiable auditor access"