level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Clinical Staff"
    description: "Medical professionals managing patient workflows."
  - type: "person"
    name: "Patients"
    description: "Individuals accessing health records and billing."
  - type: "person"
    name: "Compliance Officers"
    description: "Staff responsible for auditing and regulatory oversight."
  - type: "externalSystem"
    name: "Lab/Imaging Systems"
    description: "External diagnostic systems providing medical data."
  - type: "container"
    name: "Clinical API Gateway"
    technology: "Go"
    description: "Entry point for all clinical traffic, enforcing mTLS and routing."
  - type: "container"
    name: "EMR Service"
    technology: "Java/Spring Boot"
    description: "Manages patient electronic medical records and clinical data."
  - type: "container"
    name: "Billing Service"
    technology: "Python/FastAPI"
    description: "Handles financial transactions and billing workflows."
  - type: "container"
    name: "Patient Portal"
    technology: "Node.js/React"
    description: "Interface for patients to view records and billing."
  - type: "container"
    name: "Audit Log Service"
    technology: "Go/S3 Glacier"
    description: "Immutable service for tracking system events and compliance logs."
  - type: "container"
    name: "Reporting & Analytics Service"
    technology: "Python"
    description: "Aggregates data for clinical and operational insights."
  - type: "container"
    name: "FHIR Integration Service"
    technology: "Java/FHIR"
    description: "Facilitates interoperability with external lab and imaging systems."
  - type: "component"
    name: "Service Mesh"
    technology: "Istio/Linkerd"
    description: "Manages traffic, circuit breaking, and service-to-service mTLS."
  - type: "component"
    name: "Identity Provider"
    technology: "OIDC/MFA"
    description: "Centralized authentication and authorization service."
relationships:
  - source: "Clinical Staff"
    destination: "Clinical API Gateway"
    description: "Accesses clinical workflows"
    technology: "HTTPS/mTLS"
  - source: "Patients"
    destination: "Patient Portal"
    description: "Accesses personal health records"
    technology: "HTTPS"
  - source: "Clinical API Gateway"
    destination: "EMR Service"
    description: "Routes clinical requests"
    technology: "gRPC"
  - source: "Clinical API Gateway"
    destination: "Billing Service"
    description: "Routes billing requests"
    technology: "gRPC"
  - source: "EMR Service"
    destination: "FHIR Integration Service"
    description: "Exchanges data with external systems"
    technology: "FHIR RESTful APIs"
  - source: "FHIR Integration Service"
    destination: "Lab/Imaging Systems"
    description: "Interoperability interface"
    technology: "RESTful APIs"
  - source: "EMR Service"
    destination: "Audit Log Service"
    description: "Ships audit events asynchronously"
    technology: "Sidecar Pattern"
  - source: "Compliance Officers"
    destination: "Audit Log Service"
    description: "Reviews immutable logs"
    technology: "HTTPS"