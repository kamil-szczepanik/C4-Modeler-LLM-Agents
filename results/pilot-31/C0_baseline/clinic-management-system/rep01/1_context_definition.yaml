level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid-cloud platform for patient records, billing, and clinical scheduling, ensuring 99.99% availability and HIPAA/GDPR compliance."
elements:
  - type: "person"
    name: "Clinical Staff"
    description: "Medical professionals accessing patient records and imaging archives."
  - type: "person"
    name: "Patients"
    description: "Individuals accessing their personal health records and billing information."
  - type: "externalSystem"
    name: "Lab and Imaging Services"
    description: "External providers exchanging standardized health data."
  - type: "externalSystem"
    name: "Clearinghouse Gateway"
    description: "External financial entity for processing billing transactions."
  - type: "container"
    name: "EMR Core"
    description: "On-premise system for patient records and imaging archives."
    technology: "On-premise K8s"
  - type: "container"
    name: "Patient Portal & Billing Services"
    description: "Cloud-hosted services for elastic scaling."
    technology: "AWS eu-central-1"
  - type: "container"
    name: "FHIR Integration Broker"
    description: "Gateway for standardized data exchange."
    technology: "HL7 FHIR APIs"
  - type: "container"
    name: "Audit & Compliance Engine"
    description: "Asynchronous system for immutable log ingestion."
    technology: "WORM storage, OPA/Gatekeeper"
  - type: "container"
    name: "Identity Provider (IdP)"
    description: "Centralized service for authentication and authorization."
    technology: "MFA, RBAC, ABAC"
  - type: "component"
    name: "Service Mesh"
    description: "Manages cross-environment traffic."
    technology: "mTLS"
  - type: "component"
    name: "Event Bus"
    description: "Streams logs to the Audit Engine."
    technology: "Asynchronous Messaging"
relationships:
  - source: "Clinical Staff"
    destination: "Clinic Management System"
    description: "Accesses patient records and clinical scheduling"
    technology: "HTTPS"
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Accesses portal for records and billing"
    technology: "HTTPS"
  - source: "Clinic Management System"
    destination: "Lab and Imaging Services"
    description: "Exchanges standardized lab and imaging data"
    technology: "FHIR APIs"
  - source: "Clinic Management System"
    destination: "Clearinghouse Gateway"
    description: "Processes billing transactions"
    technology: "HTTPS/TLS 1.3"