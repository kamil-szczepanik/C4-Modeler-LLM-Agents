level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid, high-availability platform for electronic medical records (EMR), billing, and scheduling, ensuring secure, compliant healthcare data access."
elements:
  - type: "person"
    name: "Clinical Staff"
    description: "Doctors and nurses accessing patient records and clinical tools."
  - type: "person"
    name: "Administrative Staff"
    description: "Staff managing scheduling and office operations."
  - type: "person"
    name: "Patients"
    description: "Individuals accessing their personal health records and appointments."
  - type: "person"
    name: "Hospital Management"
    description: "Management staff overseeing hospital operations and analytics."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Centralized authentication service for OIDC/SAML MFA."
  - type: "externalSystem"
    name: "External Billing Gateway"
    description: "Third-party service for processing financial transactions."
  - type: "externalSystem"
    name: "Lab/Imaging Systems"
    description: "Diagnostic systems providing medical data via HL7 FHIR."
  - type: "externalSystem"
    name: "Analytics/BI Suite"
    description: "Platform for reporting and business intelligence using de-identified data."
relationships:
  - source: "Clinical Staff"
    destination: "Clinic Management System"
    description: "Accesses EMR and clinical tools"
    technology: "HTTPS/TLS 1.3"
  - source: "Administrative Staff"
    destination: "Clinic Management System"
    description: "Manages scheduling and billing tasks"
    technology: "HTTPS/TLS 1.3"
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Views medical records and appointments"
    technology: "HTTPS/TLS 1.3"
  - source: "Hospital Management"
    destination: "Clinic Management System"
    description: "Accesses management dashboards and reports"
    technology: "HTTPS/TLS 1.3"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Validates user credentials and MFA"
    technology: "OIDC/SAML"
  - source: "Clinic Management System"
    destination: "External Billing Gateway"
    description: "Processes payments and financial records"
    technology: "REST/TLS 1.3"
  - source: "Clinic Management System"
    destination: "Lab/Imaging Systems"
    description: "Retrieves diagnostic data"
    technology: "HL7 FHIR"
  - source: "Clinic Management System"
    destination: "Analytics/BI Suite"
    description: "Exports de-identified data for reporting"
    technology: "Read-only replication"