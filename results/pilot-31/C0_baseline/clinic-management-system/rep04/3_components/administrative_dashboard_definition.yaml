level: component
scope: "Component diagram for the Administrative Dashboard container"
parentContainer:
  name: "Administrative Dashboard"
elements:
  - type: "component"
    name: "Auth Guard"
    technology: "Angular Guard"
    description: "Handles route protection and session validation using OIDC/JWT."
  - type: "component"
    name: "NgRx State Management"
    technology: "NgRx/RxJS"
    description: "Manages global application state and synchronization via an event bus."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios/gRPC-Web"
    description: "Handles service communication, interceptors for audit logging, and real-time streaming."
  - type: "component"
    name: "UI Policy Engine"
    technology: "Angular Service"
    description: "Enforces ABAC-based UI rendering rules and clinical/administrative workflow separation."
  - type: "component"
    name: "Context Orchestrator"
    technology: "Angular Service"
    description: "Manages cross-module context and state synchronization for patient and clinical data."
relationships:
  - source: "Auth Guard"
    destination: "Identity Provider (IdP)"
    description: "Validates OIDC/JWT and ABAC claims"
  - source: "API Client Layer"
    destination: "Spring Cloud Gateway"
    description: "Communicates via REST and gRPC-Web"
  - source: "NgRx State Management"
    destination: "Context Orchestrator"
    description: "Synchronizes application state via RxJS event bus"
  - source: "UI Policy Engine"
    destination: "Auth Guard"
    description: "Queries ABAC claims to restrict UI access"