level: component
scope: "Component diagram for the Patient Portal container"
parentContainer:
  name: "Patient Portal"
elements:
  - type: "component"
    name: "Authentication Component"
    technology: "OIDC/OAuth2"
    description: "Handles secure user authentication and identity provider integration."
  - type: "component"
    name: "Appointment Manager"
    technology: "gRPC Client"
    description: "Manages patient appointment scheduling via gRPC service calls."
  - type: "component"
    name: "Records Viewer"
    technology: "FHIR-compliant API"
    description: "Fetches and displays EMR data in a FHIR-compliant format."
  - type: "component"
    name: "Relationship Manager"
    technology: "Logic Controller"
    description: "Manages delegation and proxy access permissions for patients."
  - type: "component"
    name: "Messaging Gateway"
    technology: "WebSocket"
    description: "Facilitates real-time, secure communication between patients and care teams."
  - type: "component"
    name: "Audit Logging Interceptor"
    technology: "Asynchronous Sidecar"
    description: "Performs forensic tracking and logging of portal activities."
  - type: "container"
    name: "Spring Cloud Gateway"
    technology: "REST/gRPC"
    description: "Handles routing and request mediation for the portal."
  - type: "container"
    name: "HashiCorp Vault"
    technology: "Secret Management"
    description: "Provides keys for application-level and message-level encryption."
  - type: "container"
    name: "IdP"
    technology: "OIDC/OAuth2"
    description: "Identity provider for claims-based access control validation."
relationships:
  - source: "Patient Portal"
    destination: "Spring Cloud Gateway"
    description: "Routes requests via REST/gRPC"
  - source: "Messaging Gateway"
    destination: "HashiCorp Vault"
    description: "Retrieves keys for message-level encryption"
  - source: "Authentication Component"
    destination: "IdP"
    description: "Validates credentials and performs CBAC validation"
  - source: "Appointment Manager"
    destination: "Spring Cloud Gateway"
    description: "Invokes scheduling services"
  - source: "Records Viewer"
    destination: "Spring Cloud Gateway"
    description: "Fetches EMR data"