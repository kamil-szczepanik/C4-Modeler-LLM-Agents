level: component
scope: "Component diagram for the Audit Visualization Service container"
parentContainer:
  name: "Audit Visualization Service"
elements:
  - type: "component"
    name: "Audit Event Ingestor"
    technology: "Spring Integration"
    description: "Handles real-time stream processing of audit events."
  - type: "component"
    name: "Audit Query Engine"
    technology: "Spring Data JPA"
    description: "Executes analytical queries against ClickHouse."
  - type: "component"
    name: "Visualization API Controller"
    technology: "Spring WebFlux"
    description: "Reactive gateway for audit visualization requests."
  - type: "component"
    name: "Report Generation Engine"
    technology: "Apache PDFBox/OpenPDF"
    description: "Asynchronous worker pool for generating compliance reports."
  - type: "component"
    name: "Analytics Aggregator"
    technology: "Spring Batch"
    description: "Performs heatmap pre-computation for analytical dashboards."
  - type: "container"
    name: "Debezium"
    technology: "Kafka Connect"
    description: "Provides event streaming for audit normalization."
  - type: "container"
    name: "ClickHouse"
    technology: "Columnar Database"
    description: "High-performance storage for time-series audit data."
  - type: "container"
    name: "HashiCorp Vault"
    technology: "Secret Management"
    description: "Centralized secret management, encryption, and digital signature service."
  - type: "container"
    name: "Redis"
    technology: "In-memory Cache"
    description: "Caches pre-computed heatmap data for dashboard performance."
relationships:
  - source: "Debezium"
    destination: "Audit Event Ingestor"
    description: "Streams normalized audit events"
  - source: "Audit Event Ingestor"
    destination: "ClickHouse"
    description: "Persists time-series audit data"
  - source: "Visualization API Controller"
    destination: "HashiCorp Vault"
    description: "Requests JIT access for field-level decryption via mTLS"
  - source: "Report Generation Engine"
    destination: "HashiCorp Vault"
    description: "Applies digital signatures via Transit Engine"
  - source: "Analytics Aggregator"
    destination: "Redis"
    description: "Stores pre-computed heatmap data"
  - source: "Audit Query Engine"
    destination: "ClickHouse"
    description: "Executes analytical queries"