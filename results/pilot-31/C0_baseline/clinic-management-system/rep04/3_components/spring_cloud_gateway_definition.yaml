level: component
scope: "Component diagram for the Spring Cloud Gateway container"
parentContainer:
  name: "Spring Cloud Gateway"
elements:
  - type: "component"
    name: "Request Router"
    technology: "Project Reactor"
    description: "Handles non-blocking traffic routing and ingress management for clinical portals."
  - type: "component"
    name: "Security Filter"
    technology: "Spring Security / OIDC"
    description: "Manages authentication via OIDC/OAuth2 and interacts with Redis for token introspection."
  - type: "component"
    name: "OPA Sidecar Client"
    technology: "Open Policy Agent"
    description: "Acts as a Policy Enforcement Point (PEP) communicating with the OPA sidecar for ABAC decisions."
  - type: "component"
    name: "Telemetry Interceptor"
    technology: "OpenTelemetry"
    description: "Injects correlation IDs and traces for distributed monitoring."
relationships:
  - source: "Request Router"
    destination: "Security Filter"
    description: "Validates incoming requests"
  - source: "Security Filter"
    destination: "Redis"
    description: "Performs JWT validation and token introspection"
  - source: "Security Filter"
    destination: "OPA Sidecar Client"
    description: "Requests ABAC policy decisions"
  - source: "Request Router"
    destination: "Core EMR Service"
    description: "Routes mTLS-encrypted traffic"
  - source: "Request Router"
    destination: "Billing Service"
    description: "Routes mTLS-encrypted traffic"
  - source: "Request Router"
    destination: "Audit Visualization Service"
    description: "Routes mTLS-encrypted traffic"
  - source: "Telemetry Interceptor"
    destination: "Core EMR Service"
    description: "Propagates X-Correlation-ID"