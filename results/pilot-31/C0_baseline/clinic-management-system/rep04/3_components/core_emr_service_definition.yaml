level: component
scope: "Component diagram for the Core EMR Service container"
parentContainer:
  name: "Core EMR Service"
elements:
  - type: "component"
    name: "Patient Record Controller"
    technology: "Spring Boot"
    description: "Primary entry point for managing patient medical records and transactional requests."
  - type: "component"
    name: "Clinical Encounter Manager"
    technology: "Spring Boot"
    description: "Orchestrates clinical encounter workflows and business logic."
  - type: "component"
    name: "Audit Trail Interceptor"
    technology: "Spring Boot"
    description: "Intercepts requests to ensure all actions are logged for compliance."
  - type: "component"
    name: "FHIR Integration Gateway"
    technology: "HAPI FHIR"
    description: "Handles interoperability and normalization of external lab and imaging data."
  - type: "component"
    name: "Emergency Access Manager"
    technology: "Spring Boot"
    description: "Manages break-glass access protocols and high-priority audit logging."
  - type: "component"
    name: "Clinical Normalization Engine"
    technology: "Spring Boot"
    description: "Transforms clinical data into a canonical internal model."
  - type: "component"
    name: "OPA Sidecar"
    technology: "Open Policy Agent"
    description: "Enforces Attribute-Based Access Control (ABAC) for clinical data."
relationships:
  - source: "Spring Cloud Gateway"
    destination: "Core EMR Service"
    description: "Forwards mTLS-secured requests"
  - source: "Core EMR Service"
    destination: "PostgreSQL"
    description: "Executes SQL transactions with Field-Level Encryption"
  - source: "Core EMR Service"
    destination: "HashiCorp Vault"
    description: "Retrieves Data Encryption Keys (DEKs)"
  - source: "FHIR Integration Gateway"
    destination: "Lab/Imaging Systems"
    description: "Communicates via HL7 FHIR with Resilience4j circuit breaking"
  - source: "Emergency Access Manager"
    destination: "Compliance/Audit Log Aggregator"
    description: "Performs synchronous, high-priority immutable event logging"
  - source: "Core EMR Service"
    destination: "Redis"
    description: "Caches FHIR resources to optimize latency"
  - source: "Core EMR Service"
    destination: "OPA Sidecar"
    description: "Queries for authorization decisions"