level: component
scope: "Component diagram for the Billing Service container"
parentContainer:
  name: "Billing Service"
elements:
  - type: "component"
    name: "Invoice Manager"
    technology: "Go"
    description: "Handles billing cycle state transitions."
  - type: "component"
    name: "Payment Processor"
    technology: "Go"
    description: "Manages external gateway interactions."
  - type: "component"
    name: "Clearinghouse Integration Gateway"
    technology: "Go"
    description: "Handles asynchronous claim submissions."
  - type: "component"
    name: "Dispute & Reconciliation Engine"
    technology: "Go"
    description: "Manages collection pauses and audits."
  - type: "component"
    name: "Event-Driven Reporting Projection"
    technology: "Go (CQRS)"
    description: "CQRS-based read-optimized aggregator."
  - type: "container"
    name: "Spring Cloud Gateway"
    technology: "Java/Spring"
    description: "Request forwarding via mTLS."
  - type: "container"
    name: "NATS"
    technology: "Message Queue"
    description: "Asynchronous claim submission and event streaming."
  - type: "container"
    name: "External Billing Gateway"
    technology: "REST API"
    description: "Third-party financial transaction provider."
  - type: "container"
    name: "PostgreSQL"
    technology: "CloudNativePG"
    description: "Data persistence with field-level encryption and RLS."
  - type: "container"
    name: "Service Mesh Sidecar"
    technology: "Envoy/Istio"
    description: "Handles mTLS termination, retries, and rate-limiting."
relationships:
  - source: "Spring Cloud Gateway"
    destination: "Billing Service"
    description: "Forwards requests via mTLS"
  - source: "Billing Service"
    destination: "NATS"
    description: "Publishes claim submission events"
  - source: "Billing Service"
    destination: "External Billing Gateway"
    description: "Outbound API calls via Egress Proxy with circuit breakers"
  - source: "Billing Service"
    destination: "PostgreSQL"
    description: "Persists transaction data with RLS"
  - source: "Service Mesh Sidecar"
    destination: "Billing Service"
    description: "Manages mTLS, retries, and rate-limiting"