level: component
scope: "Component diagram for the Read-Only Analytics Service container"
parentContainer:
  name: "Read-Only Analytics Service"
elements:
  - type: "component"
    name: "Aggregation Controller"
    technology: "Spring Boot"
    description: "Handles RESTful reporting requests from clients."
  - type: "component"
    name: "Query Orchestrator"
    technology: "Spring Integration"
    description: "Manages asynchronous data fetching from ClickHouse."
  - type: "component"
    name: "Privacy Proxy"
    technology: "Spring Security / Sidecar"
    description: "Enforces ABAC, dynamic data masking, and egress filtering."
  - type: "component"
    name: "Audit Interceptor"
    technology: "Custom Interceptor"
    description: "Logs query context and access metadata to an immutable store."
  - type: "component"
    name: "Metadata Service"
    technology: "Java"
    description: "Monitors Debezium replication lag for data freshness transparency."
  - type: "container"
    name: "ClickHouse"
    technology: "Analytical Database"
    description: "Analytical data store for historical trends."
  - type: "container"
    name: "HashiCorp Vault"
    technology: "Secret Management"
    description: "Manages secrets and field-level encryption keys."
  - type: "container"
    name: "Debezium"
    technology: "CDC Tool"
    description: "Streams transactional data from PostgreSQL to ClickHouse."
  - type: "container"
    name: "Istio Service Mesh"
    technology: "Service Mesh"
    description: "Manages mTLS, traffic routing, and policy enforcement."
relationships:
  - source: "Aggregation Controller"
    destination: "Query Orchestrator"
    description: "Forwards reporting requests"
  - source: "Query Orchestrator"
    destination: "ClickHouse"
    description: "Fetches analytical data"
  - source: "Privacy Proxy"
    destination: "Aggregation Controller"
    description: "Intercepts and filters traffic"
  - source: "Aggregation Controller"
    destination: "Audit Interceptor"
    description: "Logs request metadata"
  - source: "Query Orchestrator"
    destination: "HashiCorp Vault"
    description: "Retrieves encryption keys"
  - source: "Metadata Service"
    destination: "Debezium"
    description: "Monitors replication lag"
  - source: "Read-Only Analytics Service"
    destination: "Istio Service Mesh"
    description: "Uses for mTLS and traffic routing"