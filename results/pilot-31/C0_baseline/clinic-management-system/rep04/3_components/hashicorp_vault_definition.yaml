level: component
scope: "Component diagram for the HashiCorp Vault container"
parentContainer:
  name: "HashiCorp Vault"
elements:
  - type: "component"
    name: "Vault Cluster"
    technology: "Multi-node Raft-integrated cluster"
    description: "Primary storage and orchestration engine for secrets and replication."
  - type: "component"
    name: "Vault Agent Sidecar"
    technology: "Vault Agent"
    description: "Local cache and secret injector for microservices."
