    name: "Vault Secret Operator"
    technology: "Kubernetes CRD"
    description: "Manages secret lifecycle and developer workflows within Kubernetes."
  - type: "component"
    name: "Transit Secret Engine"
    technology: "Vault Engine"
    description: "Centralized cryptographic offloading for PHI encryption."
  - type: "component"
    name: "Vault Audit Device"
    technology: "Audit Logger"
    description: "Generates immutable audit logs for compliance."
relationships:
  - source: "Vault Cluster"
    destination: "Vault Cluster"
    description: "Performance Replication via Raft protocol"
  - source: "Core EMR Service"
    destination: "Vault Agent Sidecar"
    description: "Accesses secrets via local shared memory volume"
  - source: "Vault Audit Device"
    destination: "WORM Storage"
    description: "Streams logs via FluentBit sidecar"
  - source: "Workloads"
    destination: "Vault Cluster"
    description: "mTLS-encrypted communication using SPIFFE IDs"
  - source: "Vault Cluster"
    destination: "KMS/HSM"
    description: "Seal Wrapping for master key protection"