level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "CloudNativePG Operator"
    technology: "Kubernetes Operator"
    description: "Manages high-availability, synchronous replication, and declarative partitioning."
  - type: "component"
    name: "pgaudit"
    technology: "PostgreSQL Extension"
    description: "Provides tamper-resistant logging for HIPAA/GDPR audit compliance."
  - type: "component"
    name: "Row-Level Security (RLS) Engine"
    technology: "PostgreSQL Native"
    description: "Enforces data access policies and supports cryptographic shredding for GDPR compliance."
  - type: "component"
    name: "Declarative Partitioning Module"
    technology: "PostgreSQL Native"
    description: "Maintains P95 latency for EMR records over a 10-year retention period."
  - type: "component"
    name: "Prometheus Exporter"
    technology: "Sidecar"
    description: "Exports database metrics for observability in Grafana."
relationships:
  - source: "CloudNativePG Operator"
    destination: "Row-Level Security (RLS) Engine"
    description: "Configures access control policies"
  - source: "Row-Level Security (RLS) Engine"
    destination: "pgaudit"
    description: "Logs access violations and modifications"
  - source: "Declarative Partitioning Module"
    destination: "Row-Level Security (RLS) Engine"
    description: "Applies policies to partitioned data segments"
  - source: "Prometheus Exporter"
    destination: "CloudNativePG Operator"
    description: "Scrapes operational metrics"