level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Clinical Staff"
    description: "Doctors and nurses accessing patient records and clinical tools."
  - type: "person"
    name: "Administrative Staff"
    description: "Staff managing scheduling and office operations."
  - type: "person"
    name: "Patients"
    description: "Individuals accessing their personal health records and appointments."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Centralized authentication service for OIDC/SAML MFA."
  - type: "externalSystem"
    name: "Lab/Imaging Systems"
    description: "Diagnostic systems providing medical data via HL7 FHIR."
  - type: "container"
    name: "Patient Portal"
    technology: "React, Next.js"
    description: "Web interface for patients to manage appointments and view records."
  - type: "container"
    name: "Administrative Dashboard"
    technology: "Angular"
    description: "Web interface for clinical and admin staff to manage operations."
  - type: "container"
    name: "Spring Cloud Gateway"
    technology: "Spring Cloud Gateway"
    description: "Entry point for traffic routing, security, and OIDC/OAuth2 enforcement."
  - type: "container"
    name: "Core EMR Service"
    technology: "Spring Boot"
    description: "Handles primary electronic medical record transactional logic."
  - type: "container"
    name: "Billing Service"
    technology: "Go"
    description: "Manages financial transactions and billing cycles."
  - type: "container"
    name: "Audit Visualization Service"
    technology: "Java/Spring"
    description: "Provides visual audit trails for compliance."
  - type: "container"
    name: "Read-Only Analytics Service"
    technology: "Java/Spring"
    description: "Provides analytical reporting capabilities."
  - type: "container"
    name: "PostgreSQL"
    technology: "CloudNativePG"
    description: "Primary transactional data store."
  - type: "container"
    name: "ClickHouse"
    technology: "ClickHouse"
    description: "High-performance analytical database."
  - type: "container"
    name: "Debezium"
    technology: "Debezium"
    description: "CDC connector for real-time data streaming."
  - type: "container"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Centralized management of dynamic secrets."
relationships:
  - source: "Patients"
    destination: "Patient Portal"
    description: "Accesses health records"
    technology: "HTTPS"
  - source: "Clinical Staff"
    destination: "Administrative Dashboard"
    description: "Accesses clinical tools"
    technology: "HTTPS"
  - source: "Administrative Staff"
    destination: "Administrative Dashboard"
    description: "Manages scheduling and billing"
    technology: "HTTPS"
  - source: "Patient Portal"
    destination: "Spring Cloud Gateway"
    description: "Routes requests"
    technology: "REST/gRPC"
  - source: "Administrative Dashboard"
    destination: "Spring Cloud Gateway"
    description: "Routes requests"
    technology: "REST/gRPC"
  - source: "Spring Cloud Gateway"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OIDC/OAuth2"
  - source: "Spring Cloud Gateway"
    destination: "Core EMR Service"
    description: "Forwards requests"
    technology: "mTLS"
  - source: "Spring Cloud Gateway"
    destination: "Billing Service"
    description: "Forwards requests"
    technology: "mTLS"
  - source: "Core EMR Service"
    destination: "PostgreSQL"
    description: "Reads/Writes transactions"
    technology: "SQL"
  - source: "PostgreSQL"
    destination: "Debezium"
    description: "Streams transactional changes"
    technology: "CDC"
  - source: "Debezium"
    destination: "ClickHouse"
    description: "Populates analytics store"
    technology: "Streaming"
  - source: "Core EMR Service"
    destination: "Lab/Imaging Systems"
    description: "Retrieves diagnostic data"
    technology: "HL7 FHIR"
  - source: "Core EMR Service"
    destination: "HashiCorp Vault"
    description: "Retrieves secrets"
    technology: "API"