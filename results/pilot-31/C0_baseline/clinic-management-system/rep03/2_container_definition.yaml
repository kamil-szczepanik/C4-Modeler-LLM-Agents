level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Clinical Staff"
    description: "Healthcare professionals managing patient records and clinical workflows."
  - type: "person"
    name: "Patients"
    description: "Individuals accessing their health records and portal services."
  - type: "person"
    name: "Hospital Administrators"
    description: "Administrative staff overseeing operations and analytics."
  - type: "externalSystem"
    name: "External Diagnostic Systems"
    description: "Lab and imaging systems providing clinical data via HL7 FHIR."
  - type: "container"
    name: "Patient Service"
    technology: "Java, Spring Boot"
    description: "Manages core patient information and EMR data."
  - type: "container"
    name: "EMR Service"
    technology: "Node.js, Fastify"
    description: "Handles electronic medical record processing and session states."
  - type: "container"
    name: "Billing Service"
    technology: "Go"
    description: "Processes clinical billing and financial transactions."
  - type: "container"
    name: "Patient Portal Service"
    technology: "Next.js"
    description: "Provides a web interface for patient engagement."
  - type: "container"
    name: "API Gateway"
    technology: "Kong"
    description: "Centralized ingress management for OAuth2/OIDC and mTLS."
  - type: "container"
    name: "FHIR Integration Gateway"
    technology: "HAPI FHIR"
    description: "Maps internal models to HL7 FHIR R4 for external systems."
  - type: "container"
    name: "NATS JetStream"
    technology: "NATS"
    description: "Event bus for asynchronous audit logging and data ingestion."
  - type: "container"
    name: "PostgreSQL"
    technology: "PostgreSQL"
    description: "Relational database for billing and clinical records."
  - type: "container"
    name: "Redis"
    technology: "Redis"
    description: "Caching layer for EMR session states."
  - type: "component"
    name: "Istio Service Mesh"
    technology: "Istio"
    description: "Enforces mTLS, circuit breaking, and traffic management."
  - type: "component"
    name: "ArgoCD"
    technology: "GitOps"
    description: "Orchestrates hybrid-cloud deployments."
  - type: "component"
    name: "Falco"
    technology: "Security Scanning"
    description: "Runtime security scanning for anomalous process detection."
relationships:
  - source: "Clinical Staff"
    destination: "API Gateway"
    description: "Accesses clinical workflows"
    technology: "mTLS"
  - source: "Patients"
    destination: "API Gateway"
    description: "Accesses patient portal"
    technology: "mTLS"
  - source: "API Gateway"
    destination: "Patient Service"
    description: "Routes requests"
    technology: "Istio"
  - source: "API Gateway"
    destination: "Patient Portal Service"
    description: "Routes requests"
    technology: "Istio"
  - source: "Patient Service"
    destination: "EMR Service"
    description: "Retrieves medical records"
    technology: "gRPC/REST"
  - source: "EMR Service"
    destination: "Redis"
    description: "Caches session states"
    technology: "Redis Protocol"
  - source: "Billing Service"
    destination: "PostgreSQL"
    description: "Persists billing data"
    technology: "SQL"
  - source: "FHIR Integration Gateway"
    destination: "External Diagnostic Systems"
    description: "Exchanges clinical data"
    technology: "HL7 FHIR R4, mTLS"
  - source: "Patient Service"
    destination: "NATS JetStream"
    description: "Publishes audit logs"
    technology: "NATS"