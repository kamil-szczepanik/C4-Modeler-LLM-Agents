level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid-cloud platform managing clinical workflows, patient records, and billing, ensuring high availability and HIPAA/GDPR compliance."
elements:
  - type: "person"
    name: "Clinical Staff"
    description: "Healthcare professionals managing patient records and clinical workflows."
  - type: "person"
    name: "Patients"
    description: "Individuals accessing their health records and portal services."
  - type: "person"
    name: "Hospital Administrators"
    description: "Administrative staff overseeing operations and analytics."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Centralized authentication and authorization service."
  - type: "externalSystem"
    name: "Secure Payment Gateway"
    description: "Third-party service for processing billing and payments."
  - type: "externalSystem"
    name: "External Diagnostic Systems"
    description: "Lab and imaging systems providing clinical data via HL7 FHIR."
  - type: "container"
    name: "EMR Core"
    description: "On-premise core system for clinical data management."
    technology: "On-premise Server"
  - type: "container"
    name: "Patient Portal"
    description: "Interface for patient engagement."
    technology: "Web/Mobile App"
  - type: "container"
    name: "Admin Analytics Dashboard"
    description: "Interface for administrative reporting and analytics."
    technology: "Web App"
  - type: "container"
    name: "API Gateway"
    description: "Centralized ingress management for all actors."
    technology: "mTLS, ABAC"
  - type: "container"
    name: "Data Synchronization Service"
    description: "Service for hybrid-cloud data replication."
    technology: "Circuit Breakers, mTLS"
  - type: "container"
    name: "Asynchronous Data Warehouse"
    description: "Data store for reporting and analytics."
    technology: "ETL, Data Masking"
  - type: "component"
    name: "Security Components"
    description: "WAF, KMS/HSM, and Immutable Storage for compliance."
    technology: "AES-256, WAF, KMS/HSM"
relationships:
  - source: "Clinical Staff"
    destination: "API Gateway"
    description: "Accesses clinical workflows and records"
    technology: "mTLS"
  - source: "Patients"
    destination: "API Gateway"
    description: "Accesses health records and portal"
    technology: "mTLS"
  - source: "Hospital Administrators"
    destination: "API Gateway"
    description: "Accesses administrative reports"
    technology: "mTLS"
  - source: "EMR Core"
    destination: "External Diagnostic Systems"
    description: "Exchanges clinical data"
    technology: "HL7 FHIR"
  - source: "EMR Core"
    destination: "Data Synchronization Service"
    description: "Synchronizes data between on-prem and cloud"
    technology: "mTLS"
  - source: "Data Synchronization Service"
    destination: "Asynchronous Data Warehouse"
    description: "Populates reporting data"
    technology: "ETL"
  - source: "API Gateway"
    destination: "Identity Provider (IdP)"
    description: "Validates user identities"
    technology: "OAuth/OIDC"
  - source: "API Gateway"
    destination: "Secure Payment Gateway"
    description: "Processes billing transactions"
    technology: "HTTPS"