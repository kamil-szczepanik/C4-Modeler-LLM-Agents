level: component
scope: "Component diagram for the Patient Service container"
parentContainer:
  name: "Patient Service"
elements:
  - type: "component"
    name: "Registration Controller"
    technology: "Spring WebFlux"
    description: "Handles high-concurrency patient intake requests and routing."
  - type: "component"
    name: "Demographics Manager"
    technology: "Java"
    description: "Manages patient demographic business logic and data integrity."
  - type: "component"
    name: "Identity Validator"
    technology: "Java"
    description: "Validates patient and staff identities against internal security protocols."
  - type: "component"
    name: "Audit Logger"
    technology: "Java"
    description: "Publishes immutable audit events to NATS JetStream."
  - type: "component"
    name: "Patient Profile Projection"
    technology: "Java"
    description: "Maintains read-optimized views of patient data for CQRS patterns."
relationships:
  - source: "Registration Controller"
    destination: "Demographics Manager"
    description: "Delegates intake processing"
  - source: "Demographics Manager"
    destination: "Identity Validator"
    description: "Verifies user authorization"
  - source: "Demographics Manager"
    destination: "Audit Logger"
    description: "Logs demographic changes"
  - source: "Audit Logger"
    destination: "NATS JetStream"
    description: "Publishes audit events"
  - source: "Demographics Manager"
    destination: "PostgreSQL"
    description: "Persists patient data"
  - source: "Registration Controller"
    destination: "OPA Sidecar"
    description: "Requests ABAC policy enforcement"