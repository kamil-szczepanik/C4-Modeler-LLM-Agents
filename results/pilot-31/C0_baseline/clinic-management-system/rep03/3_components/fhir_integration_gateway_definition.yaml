level: component
scope: "Component diagram for the FHIR Integration Gateway container"
parentContainer:
  name: "FHIR Integration Gateway"
elements:
  - type: "component"
    name: "Transformation Engine"
    technology: "JOLT/Liquid"
    description: "Rule-based engine for mapping internal models to HL7 FHIR R4."
  - type: "component"
    name: "Metadata Registry"
    technology: "Centralized Store"
    description: "Centralized store for versioned, cryptographically signed FHIR profiles and templates."
  - type: "component"
    name: "Audit & Reconciliation Service"
    technology: "Custom Service"
    description: "Monitors clinical data integrity and manages soft failure exceptions."
  - type: "component"
    name: "Partner Configuration Portal"
    technology: "Web UI"
    description: "UI for non-technical staff to manage diagnostic partner connections."
  - type: "component"
    name: "Queue Manager"
    technology: "NATS JetStream"
    description: "High-throughput messaging for asynchronous data flow."
  - type: "component"
    name: "Sidecar Proxy"
    technology: "Envoy/Custom Proxy"
    description: "Handles mTLS termination and circuit breaking for network resilience."
relationships:
  - source: "External Diagnostic Systems"
    destination: "FHIR Integration Gateway"
    description: "Bi-directional exchange via HL7 FHIR R4 over mTLS."
  - source: "FHIR Integration Gateway"
    destination: "Metadata Registry"
    description: "Runtime retrieval of signed transformation templates."
  - source: "FHIR Integration Gateway"
    destination: "Audit & Reconciliation Service"
    description: "Event-based ingestion of payloads for clinical integrity monitoring."
  - source: "Partner Configuration Portal"
    destination: "Metadata Registry"
    description: "Management of partner-specific onboarding configurations."