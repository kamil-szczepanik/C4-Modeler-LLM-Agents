level: component
scope: "Component diagram for the Patient Portal Service container"
parentContainer:
  name: "Patient Portal Service"
elements:
  - type: "component"
    name: "UI Orchestrator"
    technology: "Next.js (SSR)"
    description: "Provides an accessible, responsive web interface for patient engagement and care plan management."
  - type: "component"
    name: "Patient Context Provider (BFF)"
    technology: "Node.js"
    description: "Aggregates EMR and Billing data to provide a unified patient context."
  - type: "component"
    name: "Consent Manager"
    technology: "Go"
    description: "Enforces ABAC policies for family access and granular data permissions."
  - type: "component"
    name: "Security Proxy Layer"
    technology: "Middleware"
    description: "Enforces OIDC, MFA, and Content Security Policies."
  - type: "container"
    name: "API Gateway"
    technology: "Kong via Istio"
    description: "Manages traffic routing, mTLS termination, and security for the Clinic Management System."
  - type: "container"
    name: "Redis"
    technology: "Redis"
    description: "Distributed cache for session data and UI state."
relationships:
  - source: "UI Orchestrator"
    destination: "Patient Context Provider (BFF)"
    description: "Communicates via gRPC for low-latency data retrieval."
  - source: "Patient Context Provider (BFF)"
    destination: "Consent Manager"
    description: "Validates access rights via gRPC with mandatory ACL validation."
  - source: "UI Orchestrator"
    destination: "Security Proxy Layer"
    description: "Enforces authentication and security policies."
  - source: "Patient Portal Service"
    destination: "API Gateway"
    description: "Routes PHI requests via mTLS-encrypted communication."
  - source: "UI Orchestrator"
    destination: "Redis"
    description: "Stores and retrieves session data and UI state."