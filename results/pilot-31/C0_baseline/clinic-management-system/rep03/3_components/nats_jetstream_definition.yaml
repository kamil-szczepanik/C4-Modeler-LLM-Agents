level: component
scope: "Component diagram for the NATS JetStream container"
parentContainer:
  name: "NATS JetStream"
elements:
  - type: "component"
    name: "RAFT Consensus Engine"
    technology: "NATS JetStream RAFT"
    description: "Ensures distributed consistency and 99.99% availability across 3-5 nodes."
  - type: "component"
    name: "Leaf Node Bridge"
    technology: "NATS Leaf Nodes"
    description: "Bridges on-prem and cloud sites to mitigate WAN latency."
  - type: "component"
    name: "Account/JWT Auth Service"
    technology: "NATS Auth/JWT"
    description: "Enforces granular, cryptographically verifiable multi-tenancy."
  - type: "component"
    name: "Envelope Encryption Manager"
    technology: "KMS/HSM Integration"
    description: "Handles AES-256 field-level protection for PHI."
  - type: "component"
    name: "Archival Sidecar"
    technology: "Sidecar Pattern"
    description: "Asynchronously moves data to S3/GCS cold storage with Object Lock."
relationships:
  - source: "Leaf Node Bridge"
    destination: "RAFT Consensus Engine"
    description: "Synchronizes cross-site data streams."
  - source: "RAFT Consensus Engine"
    destination: "Envelope Encryption Manager"
    description: "Encrypts messages before persistence."
  - source: "RAFT Consensus Engine"
    destination: "Archival Sidecar"
    description: "Streams persistent data for archival."
  - source: "Account/JWT Auth Service"
    destination: "RAFT Consensus Engine"
    description: "Validates client access to event streams."