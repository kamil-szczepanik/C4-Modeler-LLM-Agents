level: component
scope: "Component diagram for the Billing Service container"
parentContainer:
  name: "Billing Service"
elements:
  - type: "component"
    name: "Invoice Orchestrator"
    technology: "Go"
    description: "Manages the lifecycle of clinical financial invoices and coordinates distributed transactions."
  - type: "component"
    name: "Claim Processor"
    technology: "Go"
    description: "Handles asynchronous insurance claim processing and validation logic."
  - type: "component"
    name: "Payment Gateway Adapter"
    technology: "Go"
    description: "Interfaces with external payment gateways using circuit breakers and egress proxies."
  - type: "container"
    name: "Reporting & Reconciliation Engine"
    technology: "Go"
    description: "Dedicated component for analytical queries and financial snapshots."
  - type: "container"
    name: "Audit Log Aggregator"
    technology: "Go"
    description: "Captures, signs, and streams immutable financial audit trails."
  - type: "container"
    name: "PostgreSQL"
    technology: "PostgreSQL"
    description: "Primary transactional database with read-replicas and TDE encryption."
  - type: "container"
    name: "NATS JetStream"
    technology: "NATS"
    description: "Message broker for asynchronous claim processing."
  - type: "container"
    name: "Immutable Event Store"
    technology: "S3 Glacier"
    description: "Encrypted, long-term storage for audit logs."
  - type: "system"
    name: "EMR Service"
    technology: "gRPC"
    description: "External system for electronic medical records."
relationships:
  - source: "Invoice Orchestrator"
    destination: "Claim Processor"
    description: "Orchestrates claim flow"
  - source: "Claim Processor"
    destination: "NATS JetStream"
    description: "Publishes claim events"
  - source: "Payment Gateway Adapter"
    destination: "Payment Gateway"
    description: "Sends outbound traffic via egress proxy"
  - source: "Billing Service"
    destination: "EMR Service"
    description: "Communicates via Saga pattern and mTLS/gRPC"
  - source: "Billing Service"
    destination: "PostgreSQL"
    description: "Executes parameterized SQL queries"
  - source: "Billing Service"
    destination: "Audit Log Aggregator"
    description: "Streams logs via gRPC with cryptographic signing"
  - source: "Reporting & Reconciliation Engine"
    destination: "PostgreSQL"
    description: "Reads from read-replica via database proxies"
  - source: "Audit Log Aggregator"
    destination: "Immutable Event Store"
    description: "Archives immutable audit trails"