level: component
scope: "Component diagram for the EMR Service container"
parentContainer:
  name: "EMR Service"
elements:
  - type: "component"
    name: "Record Processor"
    technology: "Node.js/Fastify"
    description: "Handles primary clinical record processing and transactional logic."
  - type: "component"
    name: "Audit Manager"
    technology: "Node.js/Fastify"
    description: "Manages immutable audit logs for compliance reporting."
  - type: "component"
    name: "FHIR Facade"
    technology: "HAPI FHIR"
    description: "Provides protocol-translated access to clinical data via HL7 FHIR."
  - type: "component"
    name: "Compliance Reporter"
    technology: "Node.js/Fastify"
    description: "Generates reports to ensure HIPAA/GDPR compliance."
relationships:
  - source: "Record Processor"
    destination: "NATS JetStream"
    description: "Asynchronous event streaming for audit and analytical updates via NATS Protocol."
  - source: "FHIR Facade"
    destination: "Patient Portal"
    description: "Secure, protocol-translated access via HL7 FHIR REST/HTTPS."
  - source: "Record Processor"
    destination: "PostgreSQL"
    description: "Executes transactional data operations with automated failover."
  - source: "EMR Service"
    destination: "Inter-service"
    description: "mTLS-encrypted communication for all internal traffic via gRPC/REST."