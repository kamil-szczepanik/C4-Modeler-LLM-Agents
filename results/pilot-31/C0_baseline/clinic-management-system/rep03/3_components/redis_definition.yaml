level: component
scope: "Component diagram for the Redis container"
parentContainer:
  name: "Redis"
elements:
  - type: "component"
    name: "Redis Sentinel"
    technology: "Redis Sentinel"
    description: "Manages high-availability, automated failover, and cross-site synchronization for the Redis cluster."
  - type: "component"
    name: "Volatile-LRU/TTL Policy Engine"
    technology: "Redis Configuration"
    description: "Enforces eviction policies to ensure Redis remains a transient cache and prevents persistent storage of PII."
  - type: "component"
    name: "Prometheus Exporter"
    technology: "Prometheus"
    description: "Monitors cache health and performance metrics for the SIEM integration."
relationships:
  - source: "Redis Sentinel"
    destination: "Redis Cluster"
    description: "Orchestrates failover and synchronization"
  - source: "Prometheus Exporter"
    destination: "Redis Sentinel"
    description: "Collects health metrics"