level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "PostgreSQL Engine"
    technology: "PostgreSQL 15+"
    description: "Relational database engine providing ACID compliance for patient records and billing data."
  - type: "component"
    name: "Connection Pooler"
    technology: "pgBouncer"
    description: "Manages connection pooling for EMR and Billing services."
  - type: "component"
    name: "HA Orchestrator"
    technology: "Patroni"
    description: "Manages high-availability cluster state, failover, and quorum-based witness nodes."
  - type: "component"
    name: "Partition Manager"
    technology: "pg_partman"
    description: "Automates time-based table partitioning for performance and archival."
  - type: "component"
    name: "Audit Logger"
    technology: "pgaudit"
    description: "Provides detailed session and object auditing for HIPAA compliance."
  - type: "component"
    name: "Encryption Engine"
    technology: "pgcrypto"
    description: "Enables field-level encryption for PHI and PII data."
  - type: "component"
    name: "Metrics Exporter"
    technology: "pg_exporter"
    description: "Exposes database metrics for monitoring and alerting."
relationships:
  - source: "EMR/Billing Services"
    destination: "Connection Pooler"
    description: "Connects via TCP for connection pooling"
  - source: "Application Services"
    destination: "PostgreSQL Engine"
    description: "Connects via mTLS-encrypted SCRAM-SHA-256"
  - source: "PostgreSQL Engine"
    destination: "HA Orchestrator"
    description: "Managed by"
  - source: "PostgreSQL Engine"
    destination: "Audit Logger"
    description: "Logs session/object activity to"
  - source: "PostgreSQL Engine"
    destination: "AWS S3"
    description: "Archives WAL files and logical decoding logs"
  - source: "Reporting/Billing Services"
    destination: "PostgreSQL Engine"
    description: "Accesses via Foreign Data Wrapper (FDW) on read-only replica"