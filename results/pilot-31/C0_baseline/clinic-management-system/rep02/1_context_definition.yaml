level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid, high-availability platform designed to manage clinical workflows, patient records, and billing with HIPAA/GDPR compliance."
elements:
  - type: "person"
    name: "Clinical Staff"
    description: "Medical professionals managing patient care and clinical workflows."
  - type: "person"
    name: "Patients"
    description: "Individuals accessing their health records and portal services."
  - type: "person"
    name: "Auditors/Compliance Officers"
    description: "Personnel responsible for ensuring system compliance and audit trail integrity."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system providing OIDC/SAML authentication, MFA, and RBAC."
  - type: "externalSystem"
    name: "Clearinghouse Gateway"
    description: "External system for processing financial transactions."
  - type: "externalSystem"
    name: "HL7 FHIR Integration Engine"
    description: "External system for standardized clinical data exchange."
  - type: "container"
    name: "API Gateway"
    description: "Entry point for all incoming traffic."
    technology: "HTTPS/TLS 1.3"
  - type: "container"
    name: "EMR Module"
    description: "Core clinical record management."
    technology: "Kubernetes"
  - type: "container"
    name: "Billing Service"
    description: "Handles financial transactions and billing logic."
    technology: "Kubernetes"
  - type: "container"
    name: "Patient Portal"
    description: "Interface for patient interaction."
    technology: "Web/Mobile"
  - type: "container"
    name: "Local EMR Cache"
    description: "Local data storage for performance."
    technology: "On-premise Storage"
relationships:
  - source: "Clinical Staff"
    destination: "Clinic Management System"
    description: "Accesses clinical workflows and patient records via API Gateway"
    technology: "HTTPS/TLS 1.3"
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Accesses portal and records via API Gateway"
    technology: "HTTPS/TLS 1.3"
  - source: "Auditors/Compliance Officers"
    destination: "Clinic Management System"
    description: "Accesses audit logs and compliance reports"
    technology: "HTTPS/TLS 1.3"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users and authorizes access"
    technology: "OIDC/SAML"
  - source: "Clinic Management System"
    destination: "Clearinghouse Gateway"
    description: "Processes financial transactions"
    technology: "REST/SOAP"
  - source: "Clinic Management System"
    destination: "HL7 FHIR Integration Engine"
    description: "Exchanges clinical data"
    technology: "HL7 FHIR"