level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Clinical Staff"
    description: "Medical professionals managing patient care and clinical workflows."
  - type: "person"
    name: "Patients"
    description: "Individuals accessing their health records and portal services."
  - type: "person"
    name: "Auditors"
    description: "Personnel responsible for ensuring system compliance and audit trail integrity."
  - type: "container"
    name: "Clinical API Gateway"
    technology: "Go"
    description: "Entry point for clinical staff and internal services."
  - type: "container"
    name: "Patient-Facing API Gateway"
    technology: "Node.js/TypeScript"
    description: "Entry point for patient portal traffic."
  - type: "container"
    name: "EMR/Scheduling Services"
    technology: "Java/Spring Boot"
    description: "Core logic for electronic medical records and appointment scheduling."
  - type: "container"
    name: "Reporting & Compliance Service"
    technology: "Java/Spring Boot"
    description: "Handles data analytics and compliance reporting with dynamic masking."
  - type: "container"
    name: "Audit Logging Sidecar"
    technology: "Sidecar Pattern"
    description: "Captures and streams audit trails to secure storage."
  - type: "container"
    name: "Message Broker"
    technology: "NATS/Kafka"
    description: "Facilitates asynchronous event-driven communication between services."
  - type: "container"
    name: "PostgreSQL Cluster"
    technology: "PostgreSQL/Patroni"
    description: "Primary ACID-compliant data store for clinical and billing data."
  - type: "container"
    name: "Redis Cache"
    technology: "Redis"
    description: "In-memory store for sub-second EMR retrieval."
  - type: "container"
    name: "WORM Storage"
    technology: "Write-Once-Read-Many"
    description: "Immutable storage for audit logs and compliance records."
relationships:
  - source: "Clinical Staff"
    destination: "Clinical API Gateway"
    description: "Accesses clinical workflows"
    technology: "HTTPS/mTLS"
  - source: "Patients"
    destination: "Patient-Facing API Gateway"
    description: "Accesses health records"
    technology: "HTTPS/mTLS"
  - source: "Clinical API Gateway"
    destination: "EMR/Scheduling Services"
    description: "Routes clinical requests"
    technology: "Istio Service Mesh"
  - source: "EMR/Scheduling Services"
    destination: "PostgreSQL Cluster"
    description: "Persists patient data"
    technology: "SQL"
  - source: "EMR/Scheduling Services"
    destination: "Redis Cache"
    description: "Retrieves EMR data"
    technology: "TCP"
  - source: "EMR/Scheduling Services"
    destination: "Message Broker"
    description: "Publishes events"
    technology: "Asynchronous Messaging"
  - source: "Reporting & Compliance Service"
    destination: "PostgreSQL Cluster"
    description: "Reads from replicas"
    technology: "SQL"
  - source: "Audit Logging Sidecar"
    destination: "WORM Storage"
    description: "Streams audit logs"
    technology: "Encrypted Stream"
  - source: "Auditors"
    destination: "Reporting & Compliance Service"
    description: "Accesses compliance reports"
    technology: "HTTPS"