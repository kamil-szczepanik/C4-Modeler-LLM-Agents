level: component
scope: "Component diagram for the Clinical API Gateway container"
parentContainer:
  name: "Clinical API Gateway"
elements:
  - type: "component"
    name: "Ingress Controller"
    technology: "Go"
    description: "High-performance request router utilizing weighted fair queuing for clinical traffic."
  - type: "component"
    name: "Contextual Policy Engine"
    technology: "Sidecar PDP"
    description: "Enforces ABAC and emergency break-glass logic for clinical access control."
  - type: "component"
    name: "FHIR Transformation Component"
    technology: "Edge-based Middleware"
    description: "Performs schema validation and PII/PHI masking for HL7 FHIR data."
  - type: "component"
    name: "WAF Module"
    technology: "Edge Protection"
    description: "Provides security filtering against XML and JSON injection attacks."
  - type: "container"
    name: "Audit Logging Sidecar"
    technology: "Asynchronous Pipeline"
    description: "Handles non-blocking, cryptographically signed log-shipping."
  - type: "container"
    name: "Redis Cache"
    technology: "Redis"
    description: "Offloads OIDC/JWT introspection for identity validation."
  - type: "container"
    name: "EMR/Scheduling Services"
    technology: "Istio-managed Microservices"
    description: "Downstream clinical services receiving processed requests."
  - type: "container"
    name: "Identity Provider"
    technology: "OIDC/JWT"
    description: "External system for user authentication and token issuance."
  - type: "component"
    name: "Global Traffic Manager"
    technology: "Istio"
    description: "Manages hybrid-cloud load balancing and mTLS service communication."
relationships:
  - source: "Clinical Staff"
    destination: "Ingress Controller"
    description: "Sends HTTPS/mTLS encrypted clinical requests."
  - source: "External FHIR Integrators"
    destination: "WAF Module"
    description: "Accesses HL7 FHIR API through filtered traffic."
  - source: "Ingress Controller"
    destination: "Contextual Policy Engine"
    description: "Queries for authorization decisions."
  - source: "Ingress Controller"
    destination: "FHIR Transformation Component"
    description: "Routes requests for schema validation and masking."
  - source: "Ingress Controller"
    destination: "Redis Cache"
    description: "Validates OIDC/JWT tokens."
  - source: "Ingress Controller"
    destination: "EMR/Scheduling Services"
    description: "Forwards requests via Istio service mesh."
  - source: "Ingress Controller"
    destination: "Audit Logging Sidecar"
    description: "Delivers cryptographically signed audit tokens asynchronously."
  - source: "Ingress Controller"
    destination: "Identity Provider"
    description: "Performs OIDC/JWT introspection."