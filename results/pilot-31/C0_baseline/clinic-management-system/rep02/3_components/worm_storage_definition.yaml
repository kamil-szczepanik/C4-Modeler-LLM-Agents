level: component
scope: "Component diagram for the WORM Storage container"
parentContainer:
  name: "WORM Storage"
elements:
  - type: "component"
    name: "Ingestion Gateway"
    technology: "Go/Custom"
    description: "Handles incoming data streams and initial validation for WORM storage."
  - type: "component"
    name: "Verification Engine"
    technology: "Go/Custom"
    description: "Performs cryptographic verification and ensures data integrity of records."
  - type: "component"
    name: "Retention Manager"
    technology: "Go/AWS SDK"
    description: "Orchestrates lifecycle policies, Legal Hold states, and S3 Object Lock API interactions."
  - type: "component"
    name: "Digital Signature Service"
    technology: "HSM/PKI"
    description: "Generates cryptographic manifests and performs background drift detection."
relationships:
  - source: "Ingestion Gateway"
    destination: "Verification Engine"
    description: "Sends data for asynchronous processing via local disk-backed queue"
  - source: "Retention Manager"
    destination: "S3 Object Lock API"
    description: "Orchestrates lifecycle policies and Legal Hold states"
  - source: "Audit Logging Sidecar"
    destination: "Ingestion Gateway"
    description: "Streams mTLS-encrypted logs via cryptographic manifests"
  - source: "Verification Engine"
    destination: "Digital Signature Service"
    description: "Requests cryptographic manifest generation for verification"