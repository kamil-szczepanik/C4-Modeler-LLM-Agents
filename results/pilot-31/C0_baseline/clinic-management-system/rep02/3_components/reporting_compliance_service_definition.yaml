level: component
scope: "Component diagram for the Reporting & Compliance Service container"
parentContainer:
  name: "Reporting & Compliance Service"
elements:
  - type: "component"
    name: "Query Orchestrator"
    technology: "Java/Spring Boot"
    description: "Manages read-only data retrieval from PostgreSQL replicas."
  - type: "component"
    name: "Data Masking Engine"
    technology: "ABAC/Java"
    description: "Applies dynamic ABAC-based PII/PHI obfuscation."
  - type: "component"
    name: "Report Generator"
    technology: "Java/Spring Boot"
    description: "Creates digitally signed, immutable compliance documents."
  - type: "component"
    name: "Query Builder/DSL Engine"
    technology: "Java/Spring Boot"
    description: "Facilitates self-service KPI generation with whitelist validation."
  - type: "component"
    name: "Anomaly Detection Service"
    technology: "Java/Spring Boot"
    description: "Monitors audit logs for regulatory gaps and security threats."
  - type: "component"
    name: "Query Governor"
    technology: "Java/Spring Boot"
    description: "Enforces resource quotas, timeouts, and rate-limiting."
  - type: "container"
    name: "PostgreSQL Cluster"
    technology: "PostgreSQL (Patroni-managed)"
    description: "Read-heavy data storage for clinical operations."
  - type: "container"
    name: "WORM Storage"
    technology: "S3-compatible Object Storage"
    description: "Provides immutable, long-term document retention."
  - type: "container"
    name: "Message Broker"
    technology: "NATS/Kafka"
    description: "Asynchronous log stream for anomaly detection."
  - type: "container"
    name: "KMS/HSM"
    technology: "Hardware Security Module"
    description: "Provides digital signature generation for non-repudiation."
  - type: "person"
    name: "Auditors/Managers"
    technology: "N/A"
    description: "External users requesting dashboard and report data."
relationships:
  - source: "Auditors/Managers"
    destination: "Query Builder/DSL Engine"
    description: "Requests dashboard and reports via HTTPS"
  - source: "Query Orchestrator"
    destination: "PostgreSQL Cluster"
    description: "Executes read-only SQL queries via mTLS"
  - source: "Report Generator"
    destination: "WORM Storage"
    description: "Stores immutable documents via S3-compatible API"
  - source: "Anomaly Detection Service"
    destination: "Message Broker"
    description: "Consumes asynchronous audit log streams"
  - source: "Reporting & Compliance Service"
    destination: "KMS/HSM"
    description: "Requests digital signatures for non-repudiation"