level: component
scope: "Component diagram for the EMR/Scheduling Services container"
parentContainer:
  name: "EMR/Scheduling Services"
elements:
  - type: "component"
    name: "Patient Record Manager"
    technology: "Java/Spring Boot"
    description: "Manages the lifecycle and retrieval of Electronic Medical Records."
  - type: "component"
    name: "Scheduling Engine"
    technology: "Temporal.io"
    description: "Orchestrates complex, fault-tolerant clinical scheduling workflows."
  - type: "component"
    name: "Resource Orchestrator"
    technology: "Java/Spring Boot"
    description: "Coordinates clinical resource allocation and availability."
  - type: "component"
    name: "FHIR Facade"
    technology: "Java/Spring Boot"
    description: "Provides interoperability via HL7 FHIR standards."
  - type: "component"
    name: "Audit Logging Sidecar"
    technology: "Sidecar Pattern"
    description: "Captures and streams tamper-proof logs to WORM storage."
relationships:
  - source: "Patient Record Manager"
    destination: "PostgreSQL Cluster"
    description: "Persists patient data using optimistic locking."
  - source: "Patient Record Manager"
    destination: "Redis Cache"
    description: "Reads P95 latency-sensitive data from cache."
  - source: "Scheduling Engine"
    destination: "Message Broker"
    description: "Publishes asynchronous events for scheduling updates."
  - source: "FHIR Facade"
    destination: "Patient Record Manager"
    description: "Queries patient records for FHIR-compliant responses."
  - source: "Audit Logging Sidecar"
    destination: "WORM Storage"
    description: "Streams tamper-proof logs for regulatory compliance."