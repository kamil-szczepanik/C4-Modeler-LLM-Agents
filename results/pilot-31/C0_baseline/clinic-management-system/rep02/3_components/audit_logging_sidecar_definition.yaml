level: component
scope: "Component diagram for the Audit Logging Sidecar container"
parentContainer:
  name: "Audit Logging Sidecar"
elements:
  - type: "component"
    name: "Local Rule Engine"
    technology: "Rust"
    description: "Policy Enforcement Point (PEP) for operation classification and security policy evaluation."
  - type: "component"
    name: "RocksDB"
    technology: "RocksDB"
    description: "Local buffer providing transient network partition resilience for audit logs."
  - type: "component"
    name: "Fluent Bit Forwarder"
    technology: "Fluent Bit"
    description: "Handles structured log transformation, PII masking, and log streaming."
  - type: "component"
    name: "Cryptographic Signer"
    technology: "HSM/Nitro Enclave (Ed25519)"
    description: "Provides cryptographic signing for non-repudiation of audit records."
relationships:
  - source: "Local Rule Engine"
    destination: "RocksDB"
    description: "Buffers intercepted requests during network partitions"
  - source: "Local Rule Engine"
    destination: "Cryptographic Signer"
    description: "Requests digital signatures for audit trails"
  - source: "RocksDB"
    destination: "Fluent Bit Forwarder"
    description: "Streams buffered logs for transformation and transmission"
  - source: "Fluent Bit Forwarder"
    destination: "WORM Storage"
    description: "Streams signed audit logs via TLS 1.3/mTLS"
  - source: "Fluent Bit Forwarder"
    destination: "Prometheus"
    description: "Exports metrics for observability"
  - source: "Fluent Bit Forwarder"
    destination: "SIEM"
    description: "Sends real-time alerts for emergency overrides"