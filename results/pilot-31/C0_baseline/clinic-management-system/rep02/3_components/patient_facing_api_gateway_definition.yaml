level: component
scope: "Component diagram for the Patient-Facing API Gateway container"
parentContainer:
  name: "Patient-Facing API Gateway"
elements:
  - type: "component"
    name: "Authentication Interceptor"
    technology: "Passport.js"
    description: "Handles identity validation and token binding using OIDC/DPoP."
  - type: "component"
    name: "Request Orchestrator"
    technology: "Fastify"
    description: "Manages incoming requests and coordinates communication between backend services."
  - type: "component"
    name: "ReBAC Resolver"
    technology: "Custom Logic"
    description: "Resolves Relationship-Based Access Control for secure patient data access."
  - type: "component"
    name: "Circuit-Breaker Fallback Handler"
    technology: "Opossum"
    description: "Provides fault tolerance and fallback logic for downstream service outages."
  - type: "component"
    name: "Audit Logging Sidecar"
    technology: "OpenTelemetry"
    description: "Handles non-blocking audit logging for compliance and observability."
relationships:
  - source: "Authentication Interceptor"
    destination: "Request Orchestrator"
    description: "Validates identity before allowing request processing."
  - source: "Request Orchestrator"
    destination: "ReBAC Resolver"
    description: "Queries for access permissions on resources."
  - source: "Request Orchestrator"
    destination: "Circuit-Breaker Fallback Handler"
    description: "Wraps downstream gRPC/REST calls for resilience."
  - source: "Request Orchestrator"
    destination: "Audit Logging Sidecar"
    description: "Sends event data for secure audit trails."