level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Kafka Broker Cluster"
    technology: "Apache Kafka"
    description: "Federated event streaming cluster with replication factor 3 and acks=all for high durability."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry"
    description: "Enforces HL7 FHIR-compliant message structures for all incoming event payloads."
  - type: "component"
    name: "Reconciliation Controller"
    technology: "Custom Go Service"
    description: "Monitors DLQ and performs state correlation to ensure data integrity."
  - type: "component"
    name: "Security Controller"
    technology: "mTLS / ABAC"
    description: "Manages encryption-in-transit and granular topic-level access control."
relationships:
  - source: "Clinical Services"
    destination: "Kafka Broker Cluster"
    description: "Publishes events via mTLS-secured asynchronous messaging."
  - source: "Kafka Broker Cluster"
    destination: "WORM Storage"
    description: "Streams administrative and audit logs for compliance."
  - source: "Reconciliation Controller"
    destination: "DLQ"
    description: "Monitors failed events and triggers notifications for clinical administrators."
  - source: "Clinical Services"
    destination: "Schema Registry"
    description: "Validates all event payloads against FHIR standards before production."