level: component
scope: "Component diagram for the PostgreSQL Cluster container"
parentContainer:
  name: "PostgreSQL Cluster"
elements:
  - type: "component"
    name: "PostgreSQL Instance"
    technology: "PostgreSQL"
    description: "Primary database engine for EMR, scheduling, and billing data."
  - type: "component"
    name: "Patroni"
    technology: "Patroni"
    description: "Manages high availability, automated failover, and cluster state."
  - type: "component"
    name: "etcd"
    technology: "etcd"
    description: "Consensus store for cluster leader election and configuration."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Connection pooler for managing high-concurrency database requests."
  - type: "component"
    name: "pgBackRest"
    technology: "pgBackRest"
    description: "Handles continuous WAL archiving and point-in-time recovery to WORM storage."
  - type: "component"
    name: "Audit Logging Sidecar"
    technology: "Logical Decoding"
    description: "Captures real-time DML/DDL events for immutable audit trails."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Provides dynamic, short-lived credential rotation for database access."
relationships:
  - source: "Patroni"
    destination: "etcd"
    description: "Synchronizes cluster state and leader election."
  - source: "App Services"
    destination: "PgBouncer"
    description: "Establishes mTLS-encrypted SQL connections."
  - source: "PgBouncer"
    destination: "PostgreSQL Instance"
    description: "Proxies session-based RLS context-propagated queries."
  - source: "PostgreSQL Instance"
    destination: "pgBackRest"
    description: "Streams WAL logs for continuous archival."
  - source: "pgBackRest"
    destination: "WORM Storage"
    description: "Writes immutable backups for long-term retention."
  - source: "PostgreSQL Instance"
    destination: "Audit Logging Sidecar"
    description: "Streams DML/DDL events via logical decoding."
  - source: "HashiCorp Vault"
    destination: "PostgreSQL Instance"
    description: "Injects dynamic credentials for service authentication."