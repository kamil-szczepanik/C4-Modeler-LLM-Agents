level: component
scope: "Component diagram for the Redis Cache container"
parentContainer:
  name: "Redis Cache"
elements:
  - type: "component"
    name: "Redis Cluster"
    technology: "In-memory Data Store"
    description: "High-availability active-active cross-zone replication store for sub-second EMR retrieval."
  - type: "component"
    name: "Redis ACLs"
    technology: "Security Policy"
    description: "Enforces granular control to restrict key access and disable dangerous administrative commands."
  - type: "component"
    name: "Envoy Sidecar Proxy"
    technology: "Envoy Proxy"
    description: "Manages mTLS termination, connection pooling, and circuit breaking for Redis access."
  - type: "component"
    name: "Debezium CDC"
    technology: "Change Data Capture"
    description: "Captures PostgreSQL changes to trigger real-time cache invalidation."
relationships:
  - source: "EMR/Scheduling Services"
    destination: "Redis Cluster"
    description: "Retrieves and updates EMR data via TCP with TLS 1.3"
  - source: "Envoy Sidecar Proxy"
    destination: "Redis Cluster"
    description: "Manages mTLS-authenticated connections and circuit breaking"
  - source: "PostgreSQL Cluster"
    destination: "Debezium CDC"
    description: "Streams data changes for cache synchronization"
  - source: "Debezium CDC"
    destination: "Redis Cluster"
    description: "Pub/Sub mechanism for real-time cache invalidation"