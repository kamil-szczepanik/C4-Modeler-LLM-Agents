level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Self-Service Portal users interacting for registration and scheduling."
  - type: "person"
    name: "Clinical Staff"
    description: "Front Desk Receptionists, Clinicians, and Billing Specialists managing clinical workflows."
  - type: "person"
    name: "Hospital Administrators"
    description: "Dashboard and Audit users overseeing system management and compliance."
  - type: "externalSystem"
    name: "External Lab and Imaging Systems"
    description: "External systems providing laboratory and imaging data."
  - type: "externalSystem"
    name: "Third-Party Insurance Clearinghouses"
    description: "External clearinghouses for submitting and processing insurance claims."
  - type: "container"
    name: "Global Anycast Load Balancer and API Gateways"
    technology: "Kong"
    description: "Entry points for routing global traffic to the core infrastructure with secure high-performance ingress routing."
  - type: "container"
    name: "Patient Portal"
    technology: "Node.js, React"
    description: "Isolated, decoupled frontend administration for patients."
  - type: "container"
    name: "EMR & Scheduling Service"
    technology: "Java Spring Boot"
    description: "Core EMR and scheduling for robust transactional integrity."
  - type: "container"
    name: "Billing & Insurance Claim Service"
    technology: "Python FastAPI"
    description: "Dedicated billing service for optimized insurance workflows."
  - type: "container"
    name: "HL7 FHIR Interoperability Engine"
    technology: "Apache Camel"
    description: "Engine connecting to external lab and imaging systems using HL7 FHIR APIs over persistent TCP connections."
  - type: "container"
    name: "Database Tier"
    technology: "PostgreSQL with PgBouncer, AES-256"
    description: "Primary data store with row-level security and pooling."
  - type: "container"
    name: "Messaging & Audit Layer"
    technology: "Apache Kafka, FluentBit, S3"
    description: "Asynchronous event streaming ensuring fault tolerance and audit trails."
  - type: "container"
    name: "Infrastructure & Mesh"
    technology: "Kubernetes, AWS eu-central-1, on-prem-k8s, Envoy sidecar"
    description: "Hybrid deployment orchestration, GitOps synchronization, and service mesh for mTLS and distributed tracing."
relationships:
  - source: "Patients"
    destination: "Global Anycast Load Balancer and API Gateways"
    description: "Accesses the system via HTTPS"
    technology: "HTTPS"
  - source: "Clinical Staff"
    destination: "Global Anycast Load Balancer and API Gateways"
    description: "Accesses the system via HTTPS"
    technology: "HTTPS"
  - source: "Hospital Administrators"
    destination: "Global Anycast Load Balancer and API Gateways"
    description: "Accesses the system via HTTPS"
    technology: "HTTPS"
  - source: "Global Anycast Load Balancer and API Gateways"
    destination: "Patient Portal"
    description: "Routes ingress traffic to Patient Portal"
    technology: "HTTPS"
  - source: "Global Anycast Load Balancer and API Gateways"
    destination: "EMR & Scheduling Service"
    description: "Routes ingress traffic to EMR and scheduling"
    technology: "HTTPS"
  - source: "Global Anycast Load Balancer and API Gateways"
    destination: "Billing & Insurance Claim Service"
    description: "Routes ingress traffic to billing service"
    technology: "HTTPS"
  - source: "Patient Portal"
    destination: "EMR & Scheduling Service"
    description: "Communicates with backend services via gRPC"
    technology: "gRPC over mutual TLS (mTLS)"
  - source: "Patient Portal"
    destination: "Billing & Insurance Claim Service"
    description: "Communicates with backend services via gRPC"
    technology: "gRPC over mutual TLS (mTLS)"
  - source: "EMR & Scheduling Service"
    destination: "Messaging & Audit Layer"
    description: "Interacts asynchronously via events"
    technology: "Apache Kafka"
  - source: "Billing & Insurance Claim Service"
    destination: "Messaging & Audit Layer"
    description: "Interacts asynchronously via events"
    technology: "Apache Kafka"
  - source: "HL7 FHIR Interoperability Engine"
    destination: "External Lab and Imaging Systems"
    description: "Connects to external lab and imaging systems"
    technology: "HL7 FHIR APIs over persistent TCP connections"
  - source: "EMR & Scheduling Service"
    destination: "Database Tier"
    description: "Persists state to PostgreSQL clusters"
    technology: "Encrypted TCP connections"
  - source: "Billing & Insurance Claim Service"
    destination: "Database Tier"
    description: "Persists state to PostgreSQL clusters"
    technology: "Encrypted TCP connections"