level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed to manage patient admissions, electronic medical records, scheduling, and billing for medium-sized hospitals and clinics."
elements:
  - type: "person"
    name: "Patients"
    description: "Self-Service Portal users interacting for registration and scheduling."
  - type: "person"
    name: "Clinical Staff"
    description: "Front Desk Receptionists, Clinicians, and Billing Specialists managing clinical workflows."
  - type: "person"
    name: "Hospital Administrators"
    description: "Dashboard and Audit users overseeing system management and compliance."
  - type: "externalSystem"
    name: "External Lab and Imaging Systems"
    description: "External systems providing laboratory and imaging data."
  - type: "externalSystem"
    name: "Third-Party Insurance Clearinghouses"
    description: "External clearinghouses for submitting and processing insurance claims."
  - type: "externalSystem"
    name: "Global Anycast Load Balancer and API Gateways"
    description: "Entry points for routing global traffic to the core infrastructure."
relationships:
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Interacts via Patient Portal for registration and scheduling"
    technology: "HTTPS, OpenID Connect"
  - source: "Clinical Staff"
    destination: "Clinic Management System"
    description: "Accesses the system for clinical and billing operations"
    technology: "HTTPS, OAuth 2.0 with MFA"
  - source: "Hospital Administrators"
    destination: "Clinic Management System"
    description: "Accesses the system via dashboard and audit tools"
    technology: "HTTPS, OAuth 2.0 with MFA"
  - source: "Clinic Management System"
    destination: "External Lab and Imaging Systems"
    description: "Exchanges clinical data using standardized interoperability protocols"
    technology: "HL7 FHIR over mutual TLS (mTLS)"
  - source: "Clinic Management System"
    destination: "Third-Party Insurance Clearinghouses"
    description: "Submits insurance claims"
    technology: "Secure REST APIs over TLS 1.3"