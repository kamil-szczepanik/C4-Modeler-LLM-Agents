level: component
scope: "Component diagram for the HL7 FHIR Interoperability Engine container"
parentContainer:
  name: "HL7 FHIR Interoperability Engine"
elements:
  - type: "component"
    name: "FHIR API Router"
    technology: "Apache Camel REST DSL"
    description: "Routes incoming requests from the patient portal and external systems to the appropriate processing routes."
  - type: "component"
    name: "HL7 Transformation Engine"
    technology: "Apache Camel DataFormat"
    description: "Transforms incoming legacy HL7 messages into standardized FHIR resources."
  - type: "component"
    name: "TCP Integration Connector"
    technology: "Apache Camel Netty"
    description: "Manages persistent TCP connections to external lab and imaging systems."
  - type: "component"
    name: "Audit Event Publisher"
    technology: "Apache Camel Kafka Producer"
    description: "Publishes interoperability audit logs and integration events to the messaging layer."
relationships:
  - source: "FHIR API Router"
    destination: "HL7 Transformation Engine"
    description: "Forwards payloads for transformation"
  - source: "HL7 Transformation Engine"
    destination: "TCP Integration Connector"
    description: "Sends processed messages over persistent TCP"
  - source: "FHIR API Router"
    destination: "Audit Event Publisher"
    description: "Sends transaction logs"
  - source: "Audit Event Publisher"
    destination: "Messaging & Audit Layer"
    description: "Kafka Protocol over TCP"