level: component
scope: "Component diagram for the Patient Portal container"
parentContainer:
  name: "Patient Portal"
elements:
  - type: "component"
    name: "React, Next.js SSR Engine"
    technology: "React, Next.js"
    description: "Delivers server-side rendered, mobile-responsive frontend views with sub-second performance."
  - type: "component"
    name: "Node.js Express Portal Gateway"
    technology: "Node.js, Express"
    description: "Powers the API gateway proxy and routes ingress traffic."
  - type: "component"
    name: "Auth Manager"
    technology: "OAuth2/OIDC, HTTPS"
    description: "Handles session issuance and authentication."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Node.js, Apache Kafka"
    description: "Dispatches async alerts and handles event streaming."
relationships:
  - source: "Node.js Express Portal Gateway"
    destination: "Auth Manager"
    description: "Handles session issuance [HTTPS / OAuth2/OIDC]"
  - source: "React, Next.js SSR Engine"
    destination: "Node.js Express Portal Gateway"
    description: "Routes API requests"
  - source: "Node.js Express Portal Gateway"
    destination: "Notification Dispatcher"
    description: "Dispatches async alerts [Apache Kafka]"