level: component
scope: "Component diagram for the Messaging & Audit Layer container"
parentContainer:
  name: "Messaging & Audit Layer"
elements:
  - type: "component"
    name: "Event Streaming Broker"
    technology: "Apache Kafka (KRaft mode)"
    description: "Delivers resilient, ZooKeeper-free asynchronous event streaming and active-active cross-site replication."
  - type: "component"
    name: "Log Collection Agent"
    technology: "FluentBit"
    description: "Collects application logs and forwards them to long-term storage for auditing."
  - type: "component"
    name: "Immutable Object Storage"
    technology: "AWS S3 / on-prem S3-compatible object storage"
    description: "Enforces 10-year WORM-compliant audit retention and immutable archiving."
relationships:
  - source: "Event Streaming Broker"
    destination: "Immutable Object Storage"
    description: "Asynchronous event publishing and immutable archiving via TLS and Parquet"
  - type: "component"
    name: "Log Collection Agent"
    destination: "Immutable Object Storage"
    description: "Archives collected logs for compliance via HTTPS"