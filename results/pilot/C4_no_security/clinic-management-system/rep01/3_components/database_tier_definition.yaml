level: component
scope: "Component diagram for the Database Tier container"
parentContainer:
  name: "Database Tier"
elements:
  - type: "component"
    name: "PostgreSQL Database Engine"
    technology: "PostgreSQL with Patroni, AES-256"
    description: "Provides active-active high availability and stores encrypted clinical, financial, and lab data."
  - type: "component"
    name: "PgBouncer Connection Pooler"
    technology: "PgBouncer"
    description: "Manages and optimizes database connections for high-throughput clinical workflows."
  - type: "component"
    name: "Encryption Key Manager"
    technology: "HashiCorp Vault"
    description: "Manages AES-256 encryption keys for Transparent Data Encryption (TDE)."
relationships:
  - source: "PgBouncer Connection Pooler"
    destination: "PostgreSQL Database Engine"
    description: "Routes and pools database queries [Encrypted TCP, TLS 1.3]"
  - type: "component"
    name: "Encryption Key Manager"
    destination: "PostgreSQL Database Engine"
    description: "Supplies encryption keys for TDE [Secure API]"