level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients using the self-service portal for booking and real-time updates."
  - type: "person"
    name: "Receptionists"
    description: "Staff managing front-desk operations, admissions, and scheduling."
  - type: "person"
    name: "Clinical Staff"
    description: "Medical professionals accessing electronic medical records and clinical workflows."
  - type: "person"
    name: "Billing Specialists"
    description: "Personnel managing patient billing, payments, and insurance claims."
  - type: "externalSystem"
    name: "External Labs/Imaging"
    description: "External laboratory and imaging systems for diagnostic data exchange."
  - type: "externalSystem"
    name: "Insurance Clearinghouses"
    description: "External systems for processing insurance claims via X12/EDI."
  - type: "externalSystem"
    name: "Payment Gateways"
    description: "External payment processing services."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External or internal IDP for multi-factor authentication via OIDC/SAML 2.0."
  - type: "container"
    name: "API Gateway"
    technology: "Envoy / Kong"
    description: "Handles ingress routing, JWT validation, and rate limiting."
  - type: "container"
    name: "Patient Portal Service"
    technology: "Microservice / Kubernetes"
    description: "Manages patient interactions and self-service portal functionality."
  - type: "container"
    name: "Scheduling Service"
    technology: "Microservice / Kubernetes"
    description: "Manages appointments, scheduling, and calendar operations."
  - type: "container"
    name: "EMR Service"
    technology: "Microservice / Kubernetes"
    description: "Manages electronic medical records and clinical documentation."
  - type: "container"
    name: "Billing Service"
    technology: "Microservice / Kubernetes"
    description: "Manages patient billing, invoices, and insurance claims."
  - type: "container"
    name: "HL7 FHIR Integration Service"
    technology: "Microservice / Kubernetes"
    description: "Handles interoperability and data exchange with external labs and imaging systems."
  - type: "container"
    name: "Analytics Service"
    technology: "Microservice / AWS eu-central-1"
    description: "Processes platform analytics with PHI stripped for reporting and insights."
  - type: "container"
    name: "PostgreSQL Database"
    technology: "PostgreSQL with AES-256"
    description: "Core transactional database for EMR and scheduling with streaming replication."
  - type: "container"
    name: "Apache Kafka Message Broker"
    technology: "Apache Kafka"
    description: "Event broker for decoupled, asynchronous workflow triggers."
  - type: "container"
    name: "External Vault/HSM"
    technology: "Hardware Security Module / Vault"
    description: "Secures encryption keys and sensitive secrets."
relationships:
  - source: "Patients"
    destination: "API Gateway"
    description: "Accesses patient portal and services"
    technology: "HTTPS (OAuth2/OIDC, Multi-Factor Auth)"
  - source: "Receptionists"
    destination: "API Gateway"
    description: "Manages front-desk and scheduling operations"
    technology: "HTTPS (OAuth2/OIDC, Multi-Factor Auth)"
  - source: "Clinical Staff"
    destination: "API Gateway"
    description: "Accesses electronic medical records and clinical workflows"
    technology: "HTTPS (OAuth2/OIDC, Multi-Factor Auth)"
  - source: "Billing Specialists"
    destination: "API Gateway"
    description: "Manages billing and financial workflows"
    technology: "HTTPS (OAuth2/OIDC, Multi-Factor Auth)"
  - source: "API Gateway"
    destination: "Patient Portal Service"
    description: "Routes patient portal requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Scheduling Service"
    description: "Routes scheduling requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "EMR Service"
    description: "Routes EMR requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Billing Service"
    description: "Routes billing requests"
    technology: "gRPC over mTLS"
  - source: "Patient Portal Service"
    destination: "PostgreSQL Database"
    description: "Reads and writes patient data"
    technology: "TLS with AES-256 at rest"
  - source: "Scheduling Service"
    destination: "PostgreSQL Database"
    description: "Reads and writes scheduling data"
    technology: "TLS with AES-256 at rest"
  - source: "EMR Service"
    destination: "PostgreSQL Database"
    description: "Reads and writes medical records"
    technology: "TLS with AES-256 at rest"
  - source: "Billing Service"
    destination: "PostgreSQL Database"
    description: "Reads and writes billing data"
    technology: "TLS with AES-256 at rest"
  - source: "Patient Portal Service"
    destination: "Apache Kafka Message Broker"
    description: "Publishes asynchronous events"
    technology: "Internal TLS"
  - source: "Scheduling Service"
    destination: "Apache Kafka Message Broker"
    description: "Publishes asynchronous events"
    technology: "Internal TLS"
  - source: "EMR Service"
    destination: "Apache Kafka Message Broker"
    description: "Publishes asynchronous events"
    technology: "Internal TLS"
  - source: "Billing Service"
    destination: "Apache Kafka Message Broker"
    description: "Publishes asynchronous events"
    technology: "Internal TLS"
  - source: "HL7 FHIR Integration Service"
    destination: "External Labs/Imaging"
    description: "Exchanges clinical data and lab results"
    technology: "HL7 FHIR REST APIs"
  - source: "Billing Service"
    destination: "Insurance Clearinghouses"
    description: "Submits insurance claims"
    technology: "Secure REST/HTTPS"
  - source: "Billing Service"
    destination: "Payment Gateways"
    description: "Processes payment transactions"
    technology: "Secure REST/HTTPS"
  - source: "API Gateway"
    destination: "Identity Provider"
    description: "Validates user identities and tokens"
    technology: "OIDC/OAuth2"
  - source: "EMR Service"
    destination: "Analytics Service"
    description: "Streams telemetry and usage data with PHI stripped"
    technology: "Secure TLS tunnels"
  - source: "Billing Service"
    destination: "Analytics Service"
    description: "Streams telemetry and usage data with PHI stripped"
    technology: "Secure TLS tunnels"