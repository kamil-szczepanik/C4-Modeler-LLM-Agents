level: component
scope: "Component diagram for the Analytics Service container"
parentContainer:
  name: "Analytics Service"
elements:
  - type: "component"
    name: "Ingestion Consumer"
    technology: "Python / FastAPI"
    description: "Subscribes and consumes streams from the Apache Kafka Message Broker for high-throughput stream processing."
  - type: "component"
    name: "Anonymization Engine"
    technology: "Python component"
    description: "Passes raw event data and enforces rigorous anonymization to ensure HIPAA and GDPR compliance."
  - type: "component"
    name: "Metric Aggregation Engine"
    technology: "Apache Spark component"
    description: "Executes distributed metric pre-aggregation to reduce storage costs and query latency."
  - type: "component"
    name: "Data Warehouse Loader"
    technology: "Apache Airflow component"
    description: "Orchestrates data warehouse loading tasks and pipeline schedules."
  - type: "component"
    name: "OLAP Storage Layer"
    technology: "AWS Redshift columnar store"
    description: "Serves as the OLAP storage layer optimized for analytical aggregations."
  - type: "component"
    name: "Reporting API & Dashboard Backend"
    technology: "Node.js / Express component"
    description: "Powers the Reporting API and dashboard backend serving GraphQL queries for hospital administrators."
  - type: "component"
    name: "Apache Kafka Message Broker"
    technology: "External dependency"
    description: "Acts as the core message broker utilizing mutual TLS and SCRAM-SHA-512."
  - type: "component"
    name: "External Vault/HSM"
    technology: "External security dependency"
    description: "Secures data at rest using Customer-Managed Keys for GDPR compliance."
  - type: "component"
    name: "Hospital Administrators & Clinical Directors"
    technology: "User"
    description: "Accesses executive dashboards to track efficiency and revenue."
relationships:
  - source: "EMR Service & Billing Service"
    destination: "Apache Kafka Message Broker"
    description: "Streams telemetry and usage data [Secure TLS tunnels]"
  - source: "Apache Kafka Message Broker"
    destination: "Ingestion Consumer"
    description: "Subscribes and consumes streams [Native TCP/TLS with mTLS and SCRAM-SHA-512]"
  - source: "Ingestion Consumer"
    destination: "Anonymization Engine"
    description: "Passes raw event data [In-memory function calls]"
  - source: "Anonymization Engine"
    destination: "Metric Aggregation Engine"
    description: "Forwards anonymized records [Internal API]"
  - source: "Metric Aggregation Engine"
    destination: "Data Warehouse Loader"
    description: "Passes pre-aggregated rollups [Optimized TCP binary protocols]"
  - source: "Data Warehouse Loader"
    destination: "OLAP Storage Layer"
    description: "Writes analytical data [Encrypted SQL/HTTPS]"
  - source: "External Vault/HSM"
    destination: "OLAP Storage Layer"
    description: "Provides Customer-Managed Keys (CMK) for encryption at rest [Secure KMS protocol]"
  - source: "Reporting API & Dashboard Backend"
    destination: "OLAP Storage Layer"
    description: "Queries aggregated metrics [HTTPS/SQL with row-level security]"
  - source: "Hospital Administrators & Clinical Directors"
    destination: "Reporting API & Dashboard Backend"
    description: "Accesses executive dashboards [HTTPS/GraphQL with ABAC]"