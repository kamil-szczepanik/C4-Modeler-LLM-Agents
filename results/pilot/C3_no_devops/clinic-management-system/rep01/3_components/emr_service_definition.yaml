level: component
scope: "Component diagram for the EMR Service container"
parentContainer:
  name: "EMR Service"
elements:
  - type: "component"
    name: "ClinicalChartController"
    technology: "Spring REST Controller"
    description: "Handles HTTP/gRPC requests for patient clinical charts."
  - type: "component"
    name: "EncounterManagementEngine"
    technology: "Business Logic Service"
    description: "Manages clinical encounters, diagnoses, and treatment workflows."
  - type: "component"
    name: "AuditTrailLogger"
    technology: "Logging Service"
    description: "Generates immutable audit logs for regulatory compliance."
  - type: "component"
    name: "DataAccessException"
    technology: "Exception Handling Module"
    description: "Manages database access exceptions and error translations."
  - type: "component"
    name: "InteroperabilityAdapter"
    technology: "Integration Adapter"
    description: "Adapts internal data structures to HL7 FHIR standards."
  - type: "component"
    name: "CacheInvalidationManager"
    technology: "Caching Component"
    description: "Manages Redis cache synchronization and invalidation for charts."
relationships:
  - source: "ClinicalChartController"
    destination: "EncounterManagementEngine"
    description: "Delegates encounter and chart requests"
  - source: "EncounterManagementEngine"
    destination: "DataAccessException"
    description: "Handles data access errors during database operations"
  - source: "EncounterManagementEngine"
    destination: "AuditTrailLogger"
    description: "Publishes audit events for clinical record access"
  - source: "ClinicalChartController"
    destination: "CacheInvalidationManager"
    description: "Triggers cache updates and invalidation"
  - source: "EncounterManagementEngine"
    destination: "InteroperabilityAdapter"
    description: "Transforms clinical data for external interoperability"