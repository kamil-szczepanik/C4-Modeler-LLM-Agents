level: component
scope: "Component diagram for the Billing Service container"
parentContainer:
  name: "Billing Service"
elements:
  - type: "component"
    name: "Invoice Engine"
    technology: "Spring Boot / Java"
    description: "Manages financial transactions and itemized invoicing."
  - type: "component"
    name: "Claim Processor"
    technology: "Spring Boot / Java"
    description: "Handles insurance claim submissions and communicates with external clearinghouses."
  - type: "component"
    name: "Payment Orchestrator"
    technology: "Spring Boot / Java with Resilience4j"
    description: "Processes payment transactions and interacts with external payment gateways."
  - type: "component"
    name: "Billing Data Access Repository"
    technology: "Spring Data JPA & JDBC"
    description: "Persists ledger records and transactional data to the PostgreSQL Database."
relationships:
  - source: "Invoice Engine"
    destination: "Billing Data Access Repository"
    description: "Persists ledger records [TLS with AES-256 at rest]"
  - source: "Claim Processor"
    destination: "Insurance Clearinghouses"
    description: "Submits X12 EDI / HL7 FHIR claims [Secure REST/HTTPS]"
  - source: "Payment Orchestrator"
    destination: "Payment Gateways"
    description: "Processes transactions with tokenized PANs [Secure REST/HTTPS]"
  - source: "Billing Service"
    destination: "PostgreSQL Database"
    description: "Persists transactional data [TLS with AES-256 at rest]"
  - source: "Billing Service"
    destination: "Apache Kafka"
    description: "Publishes asynchronous domain events [Internal TLS]"
  - source: "Billing Service"
    destination: "External Vault / HSM"
    description: "Retrieves API keys and PCI-DSS credentials [Encrypted channels]"