level: component
scope: "Component diagram for the Apache Kafka Message Broker container"
parentContainer:
  name: "Apache Kafka Message Broker"
elements:
  - type: "component"
    name: "Kafka Broker"
    technology: "JVM-based stateful process"
    description: "Handles core messaging, event distribution, and cluster state management."
  - type: "component"
    name: "KRaft Controller Nodes"
    technology: "KRaft consensus mechanism"
    description: "Manages metadata and quorum coordination without ZooKeeper."
  - type: "component"
    name: "Local Log Segment Storage Volumes"
    technology: "Persistent Storage Volumes"
    description: "Stores append-only event logs for the message broker."
  - type: "component"
    name: "Kafka Streams PII-masking Processor"
    technology: "Kafka Streams"
    description: "Processes and masks personally identifiable information from event streams."
  - type: "component"
    name: "Schema Registry"
    technology: "Avro Schema Registry"
    description: "Enforces strict schema rules for event streams using Avro serialization."
relationships:
  - source: "Kafka Broker"
    destination: "Local Log Segment Storage Volumes"
    description: "Persists event logs"
  - source: "Kafka Broker"
    destination: "KRaft Controller Nodes"
    description: "Coordinates cluster metadata"
  - source: "Kafka Streams PII-masking Processor"
    destination: "Kafka Broker"
    description: "Consumes and produces sanitized events"
  - source: "Schema Registry"
    destination: "Kafka Broker"
    description: "Validates event schemas"