level: component
scope: "Component diagram for the PostgreSQL Database container"
parentContainer:
  name: "PostgreSQL Database"
elements:
  - type: "component"
    name: "patient_schema"
    technology: "PostgreSQL Schema"
    description: "Stores patient demographics and core identity data."
  - type: "component"
    name: "scheduling_schema"
    technology: "PostgreSQL Schema"
    description: "Manages appointment scheduling and clash check logic."
  - type: "component"
    name: "emr_schema"
    technology: "PostgreSQL Schema"
    description: "Stores electronic medical records and audit trails."
  - type: "component"
    name: "billing_schema"
    technology: "PostgreSQL Schema"
    description: "Handles insurance claims and billing data."
  - type: "component"
    name: "Patroni Cluster with etcd"
    technology: "Patroni, etcd, PostgreSQL"
    description: "Provides high availability consensus, automated failover, and management."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Provides connection pooling to maintain sub-second P95 EMR performance."
  - type: "component"
    name: "Analytics Service Read Replica"
    technology: "PostgreSQL Read Replica"
    description: "Offloads reporting workloads via logical replication."
  - type: "component"
    name: "External HSM / Vault"
    technology: "External HSM / Vault"
    description: "Manages AES-256 encryption keys with 90-day rotation."
relationships:
  - source: "PgBouncer"
    destination: "patient_schema"
    description: "Pools connections for reading and writing patient demographics [mTLS with AES-256 at rest]"
  - source: "PgBouncer"
    destination: "scheduling_schema"
    description: "Pools connections for reading and writing scheduling data [mTLS with AES-256 at rest]"
  - source: "PgBouncer"
    destination: "emr_schema"
    description: "Pools connections for reading and writing electronic medical records [mTLS with AES-256 at rest]"
  - source: "PgBouncer"
    destination: "billing_schema"
    description: "Pools connections for reading and writing billing data [mTLS with AES-256 at rest]"
  - source: "Patroni Cluster with etcd"
    destination: "Analytics Service Read Replica"
    description: "Streams logical replication data [TLS]"