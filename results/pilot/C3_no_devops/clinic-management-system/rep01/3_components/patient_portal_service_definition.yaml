level: component
scope: "Component diagram for the Patient Portal Service container"
parentContainer:
  name: "Patient Portal Service"
elements:
  - type: "component"
    name: "Authentication Controller"
    technology: "Node.js / TypeScript"
    description: "Manages OAuth2/MFA flows via Identity Provider."
  - type: "component"
    name: "Demographics Manager"
    technology: "Prisma ORM / TypeScript"
    description: "Handles patient profile updates and demographic data."
  - type: "component"
    name: "EMR Viewer"
    technology: "Prisma ORM / TypeScript"
    description: "Handles record rendering and EMR viewing for patients and proxies."
  - type: "component"
    name: "Proxy Access Controller"
    technology: "Node.js / TypeScript"
    description: "Supports delegated access management for proxies."
  - type: "component"
    name: "Localization Manager"
    technology: "Node.js / TypeScript"
    description: "Supports multilingual rendering for the portal."
relationships:
  - source: "Authentication Controller"
    destination: "Identity Provider"
    description: "Validates JWT tokens and multi-factor authentication [OAuth2 / OIDC]"
  - source: "Demographics Manager"
    destination: "PostgreSQL Database"
    description: "Persists patient data and audit logs [TLS 1.3 with AES-256 at rest]"
  - source: "EMR Viewer"
    destination: "PostgreSQL Database"
    description: "Queries patient records [TLS 1.3 with AES-256 at rest]"
  - source: "Demographics Manager"
    destination: "Apache Kafka Message Broker"
    description: "Publishes domain events [Internal TLS]"
  - source: "EMR Viewer"
    destination: "Scheduling Service"
    description: "Checks appointment resource clashes [gRPC over mTLS]"