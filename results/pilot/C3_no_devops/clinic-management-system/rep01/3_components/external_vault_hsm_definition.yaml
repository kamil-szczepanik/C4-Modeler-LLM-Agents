level: component
scope: "Component diagram for the External Vault/HSM container"
parentContainer:
  name: "External Vault/HSM"
elements:
  - type: "component"
    name: "Transit Secrets Engine"
    technology: "HashiCorp Vault Enterprise"
    description: "Provides envelope encryption for the Clinic Management System via the /v1/transit API."
  - type: "component"
    name: "KV Secret Engine"
    technology: "HashiCorp Vault Enterprise"
    description: "Manages dynamic credential rotation via the /v1/secret API."
  - type: "component"
    name: "Hardware Security Root of Trust"
    technology: "Thales Luna and AWS CloudHSM (FIPS 140-2 Level 3 validated)"
    description: "Delivers hardware-backed cryptographic operations via PKCS#11 interfaces."
  - type: "component"
    name: "Vault Raft Storage Backend"
    technology: "HashiCorp Vault Enterprise Storage"
    description: "Ensures encrypted state replication across hybrid nodes with automated multi-party unsealing."
relationships:
  - source: "EMR Service"
    destination: "Transit Secrets Engine"
    description: "Invokes envelope encryption via gRPC over mutual TLS (mTLS) using Vault Go SDK and AppRole authentication"
  - source: "EMR Service"
    destination: "KV Secret Engine"
    description: "Fetches and rotates dynamic credentials via gRPC over mutual TLS (mTLS) using Vault Go SDK and AppRole authentication"
  - source: "Billing Service"
    destination: "Transit Secrets Engine"
    description: "Invokes envelope encryption via gRPC over mutual TLS (mTLS) using Vault Go SDK and AppRole authentication"
  - source: "Billing Service"
    destination: "KV Secret Engine"
    description: "Fetches and rotates dynamic credentials via gRPC over mutual TLS (mTLS) using Vault Go SDK and AppRole authentication"
  - source: "Transit Secrets Engine"
    destination: "Hardware Security Root of Trust"
    description: "Executes cryptographic hardware operations via PKCS#11 interfaces"