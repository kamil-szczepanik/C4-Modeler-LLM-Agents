level: component
scope: "Component diagram for the HL7 FHIR Integration Service container"
parentContainer:
  name: "HL7 FHIR Integration Service"
elements:
  - type: "component"
    name: "FHIR Parser and Transformer"
    technology: "Java, Spring Boot, HAPI FHIR, Apache Camel"
    description: "Parses FHIR R4 payloads and transforms data formats for internal and external systems."
  - type: "component"
    name: "Integration Event Producer"
    technology: "gRPC, Transactional Outbox Pattern"
    description: "Streams asynchronous integration events securely to the Apache Kafka message broker."
relationships:
  - source: "FHIR Parser and Transformer"
    destination: "Integration Event Producer"
    description: "Sends transformed integration events [gRPC, Transactional Outbox Pattern]"