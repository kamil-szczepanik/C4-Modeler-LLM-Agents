level: component
scope: "Component diagram for the Scheduling Service container"
parentContainer:
  name: "Scheduling Service"
elements:
  - type: "component"
    name: "Appointment API Controller"
    technology: "Spring Boot"
    description: "Exposes endpoints for managing patient appointments and routes scheduling requests."
  - type: "component"
    name: "Conflict Resolution Engine"
    technology: "Java 17"
    description: "Validates and resolves scheduling conflicts in real-time."
  - type: "component"
    name: "Calendar Management Service"
    technology: "Java 17"
    description: "Manages calendar availability and time slots."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Spring Boot"
    description: "Dispatches appointment notifications and reminders to users."
  - type: "component"
    name: "Waitlist Orchestrator"
    technology: "Java 17"
    description: "Orchestrates patient waitlists and manages slot reallocation."
relationships:
  - source: "Appointment API Controller"
    destination: "Conflict Resolution Engine"
    description: "Invokes slot validation and conflict checks"
  - source: "Conflict Resolution Engine"
    destination: "Calendar Management Service"
    description: "Queries and updates calendar data"
  - source: "Appointment API Controller"
    destination: "Notification Dispatcher"
    description: "Triggers notifications upon appointment changes"
  - source: "Appointment API Controller"
    destination: "Waitlist Orchestrator"
    description: "Manages waitlist entries when slots are unavailable"