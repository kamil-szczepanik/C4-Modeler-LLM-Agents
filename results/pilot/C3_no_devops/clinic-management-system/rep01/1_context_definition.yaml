level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed to manage patient admissions, electronic medical records, scheduling, and billing for clinics while maintaining strict HIPAA and GDPR compliance."
elements:
  - type: "person"
    name: "Patients"
    description: "Patients using the self-service portal for booking and real-time updates."
  - type: "person"
    name: "Receptionists"
    description: "Staff managing front-desk operations, admissions, and scheduling."
  - type: "person"
    name: "Clinical Staff"
    description: "Medical professionals accessing electronic medical records and clinical workflows."
  - type: "person"
    name: "Billing Specialists"
    description: "Personnel managing patient billing, payments, and insurance claims."
  - type: "externalSystem"
    name: "External Labs/Imaging"
    description: "External laboratory and imaging systems for diagnostic data exchange."
  - type: "externalSystem"
    name: "Insurance Clearinghouses"
    description: "External systems for processing insurance claims via X12/EDI."
  - type: "externalSystem"
    name: "Payment Gateways"
    description: "External payment processing services."
  - type: "externalSystem"
    name: "Product Analytics"
    description: "Analytics platforms like Mixpanel and Segment for tracking usage metrics."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External or internal IDP for multi-factor authentication via OIDC/SAML 2.0."
relationships:
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Self-service booking and real-time updates"
    technology: "HTTPS/WebSockets"
  - source: "Receptionists"
    destination: "Clinic Management System"
    description: "Manage patient admissions and scheduling"
    technology: "HTTPS"
  - source: "Clinical Staff"
    destination: "Clinic Management System"
    description: "Manage electronic medical records and clinical operations"
    technology: "HTTPS"
  - source: "Billing Specialists"
    destination: "Clinic Management System"
    description: "Process billing and insurance claims"
    technology: "HTTPS"
  - source: "Clinic Management System"
    destination: "External Labs/Imaging"
    description: "Exchange healthcare data and lab results"
    technology: "HL7 FHIR over HTTPS"
  - source: "Clinic Management System"
    destination: "Insurance Clearinghouses"
    description: "Submit and process insurance claims"
    technology: "X12/EDI protocols"
  - source: "Clinic Management System"
    destination: "Payment Gateways"
    description: "Process financial transactions"
    technology: "REST APIs using TLS 1.3"
  - source: "Clinic Management System"
    destination: "Identity Provider"
    description: "Authenticate users with multi-factor authentication"
    technology: "OIDC/SAML 2.0"