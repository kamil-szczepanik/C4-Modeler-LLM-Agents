level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients who interact with the clinic for admissions, scheduling, and records."
  - type: "person"
    name: "Clinical Staff"
    description: "Medical professionals who manage electronic medical records and patient care."
  - type: "person"
    name: "Hospital Administrators"
    description: "Administrators who oversee operations, billing, and system management."
  - type: "externalSystem"
    name: "External Lab, Imaging, and HIE Systems"
    description: "External medical systems providing lab and imaging data."
  - type: "externalSystem"
    name: "Compliance Archival Gateway & WORM Object Storage"
    description: "Manages cold storage writes and 10-year data retention mandates."
  - type: "container"
    name: "PWA Client Container"
    technology: "Nginx, IndexedDB, Progressive Web App"
    description: "Client-side container running the progressive web application."
  - type: "container"
    name: "API Gateway Container"
    technology: "Kong/Envoy"
    description: "Handles ingress, routing, and OAuth2/OIDC authentication."
  - type: "container"
    name: "Hybrid VPN Gateway Container"
    technology: "WireGuard"
    description: "Provides secure hybrid VPN connectivity across on-premise and AWS environments."
  - type: "container"
    name: "Patient & EMR Service"
    technology: "Node.js, Docker, Kubernetes"
    description: "Core microservice for managing patient data and electronic medical records."
  - type: "container"
    name: "Scheduling Service"
    technology: "Node.js, Docker, Kubernetes"
    description: "Core microservice for handling appointment and clinical scheduling."
  - type: "container"
    name: "Billing Service"
    technology: "Node.js, Docker, Kubernetes"
    description: "Core microservice for processing medical billing and financial operations."
  - type: "container"
    name: "HL7 FHIR Adapter Container"
    technology: "Node.js, Docker, Kubernetes"
    description: "Exchanges lab and imaging payloads with external health systems."
  - type: "container"
    name: "DICOM & Document Processing Container"
    technology: "Node.js, Docker, Kubernetes"
    description: "Processes medical imaging and documents."
  - type: "container"
    name: "Secure File Transfer Container"
    technology: "SFTP/FTPS, PGP"
    description: "Handles secure file transfers with external partners."
  - type: "container"
    name: "Tenant Context & Authorization Proxy Container"
    technology: "Open Policy Agent"
    description: "Enforces fine-grained authorization and tenant context isolation."
  - type: "container"
    name: "Data Encryption & Key Management Container"
    technology: "PKCS#11, HSM"
    description: "Manages data encryption keys and hardware security module integrations."
  - type: "container"
    name: "Audit & Compliance Sidecar Container"
    technology: "Kubernetes Sidecar"
    description: "Streams cryptographic audit logs to WORM storage."
  - type: "container"
    name: "PostgreSQL Container cluster"
    technology: "CloudNativePG"
    description: "Multi-master transactional database cluster."
  - type: "container"
    name: "Redis Container tier"
    technology: "Redis Enterprise"
    description: "Active-active caching and distributed locking tier."
  - type: "container"
    name: "Apache Kafka StatefulSet"
    technology: "Apache Kafka"
    description: "Event sourcing and message streaming platform."
  - type: "container"
    name: "RabbitMQ Container cluster"
    technology: "RabbitMQ"
    description: "Messaging broker for transient domain events."
  - type: "container"
    name: "Elasticsearch Containers"
    technology: "Elasticsearch"
    description: "Search and CQRS read model storage."
  - type: "container"
    name: "ClickHouse Analytics Engine"
    technology: "ClickHouse"
    description: "Analytics engine for reporting and operational insights."
  - type: "container"
    name: "MinIO Object Storage Gateway Container"
    technology: "MinIO"
    description: "Object storage gateway for unstructured clinical data."
  - type: "container"
    name: "Envoy Service Mesh Container"
    technology: "Envoy"
    description: "Manages service-to-service mTLS 1.3 communication."
  - type: "container"
    name: "Observability Collector Container"
    technology: "OpenTelemetry, Prometheus"
    description: "Collects system metrics, traces, and logs."
relationships:
  - source: "Patients"
    destination: "API Gateway Container"
    description: "Routes user actions and demographic payloads"
    technology: "HTTPS"
  - source: "Clinical Staff"
    destination: "API Gateway Container"
    description: "Routes user actions and demographic payloads"
    technology: "HTTPS"
  - source: "Hospital Administrators"
    destination: "API Gateway Container"
    description: "Routes user actions and demographic payloads"
    technology: "HTTPS"
  - source: "PWA Client Container"
    destination: "API Gateway Container"
    description: "Routes user actions and demographic payloads via HTTPS"
    technology: "HTTPS"
  - source: "API Gateway Container"
    destination: "Patient & EMR Service"
    description: "Dispatches routing and authenticates requests"
    technology: "OAuth2/OIDC, gRPC"
  - source: "API Gateway Container"
    destination: "Scheduling Service"
    description: "Dispatches routing and authenticates requests"
    technology: "OAuth2/OIDC, gRPC"
  - source: "API Gateway Container"
    destination: "Billing Service"
    description: "Dispatches routing and authenticates requests"
    technology: "OAuth2/OIDC, gRPC"
  - source: "Patient & EMR Service"
    destination: "PostgreSQL Container cluster"
    description: "Executes transactional queries and EMR search"
    technology: "SQL / gRPC"
  - source: "Patient & EMR Service"
    destination: "Redis Container tier"
    description: "Executes distributed locking and caching"
    technology: "gRPC"
  - source: "Patient & EMR Service"
    destination: "Elasticsearch Containers"
    description: "Executes EMR search and read model queries"
    technology: "gRPC"
  - source: "Scheduling Service"
    destination: "PostgreSQL Container cluster"
    description: "Executes transactional queries"
    technology: "SQL / gRPC"
  - source: "Billing Service"
    destination: "PostgreSQL Container cluster"
    description: "Executes transactional queries"
    technology: "SQL / gRPC"
  - source: "Patient & EMR Service"
    destination: "Apache Kafka StatefulSet"
    description: "Publishes and consumes domain events"
    technology: "Asynchronous Messaging"
  - source: "Patient & EMR Service"
    destination: "RabbitMQ Container cluster"
    description: "Publishes and consumes transient events"
    technology: "Asynchronous Messaging"
  - source: "Patient & EMR Service"
    destination: "HL7 FHIR Adapter Container"
    description: "Exchanges lab and imaging payloads with external health systems"
    technology: "HTTPS/REST"
  - source: "HL7 FHIR Adapter Container"
    destination: "External Lab, Imaging, and HIE Systems"
    description: "Exchanges health data interoperability payloads"
    technology: "HTTPS/REST"
  - source: "Audit & Compliance Sidecar Container"
    destination: "Compliance Archival Gateway & WORM Object Storage"
    description: "Streams cryptographic audit logs"
    technology: "TLS 1.3"