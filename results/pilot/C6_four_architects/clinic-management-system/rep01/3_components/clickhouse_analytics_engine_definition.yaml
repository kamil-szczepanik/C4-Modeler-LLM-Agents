level: component
scope: "Component diagram for the ClickHouse Analytics Engine container"
parentContainer:
  name: "ClickHouse Analytics Engine"
elements:
  - type: "component"
    name: "Columnar Storage Engine & MergeTree Table Family"
    technology: "ClickHouse Core & MergeTree"
    description: "Provides high-throughput analytical reporting, billing insights, and clinical data aggregation using columnar storage."
  - type: "component"
    name: "Vectorized Query Execution Engine"
    technology: "ClickHouse Vectorized Engine"
    description: "Executes analytical queries with sub-second performance using vectorized processing."
  - type: "component"
    name: "ClickHouse Keeper Cluster"
    technology: "ClickHouse Keeper"
    description: "Handles metadata coordination across hybrid Kubernetes nodes for active-active replication."
  - type: "component"
    name: "Kafka Table Engine & Data Ingestion Coordinator"
    technology: "Kafka Table Engine (Engine = Kafka)"
    description: "Consumes clinical and billing event streams in real-time from Apache Kafka."
  - type: "component"
    name: "Mutation Execution Controller & Schema Evolution Manager"
    technology: "ClickHouse Mutation Controller"
    description: "Manages data mutations and schema evolution while adhering to 10-year data retention compliance."
  - type: "component"
    name: "Native Disk Encryption Manager"
    technology: "LUKS & PKCS#11 / HSM (AES-256)"
    description: "Ensures encrypted block storage and native disk encryption at rest."
  - type: "component"
    name: "Audit Logging Interceptor & Resource Governance Governor"
    technology: "ClickHouse Interceptor & Governor"
    description: "Intercepts operations for audit logging and governs resource usage for strict compliance."
  - type: "component"
    name: "Prometheus Metrics Exporter"
    technology: "Prometheus Exporter (Port 9363)"
    description: "Exposes telemetry and performance metrics over HTTP."
  - type: "system"
    name: "Clinic Management System"
    technology: "Hybrid Enterprise Architecture"
    description: "The overarching system providing healthcare and administrative workflows."
  - type: "container"
    name: "Apache Kafka StatefulSet"
    technology: "Apache Kafka"
    description: "Streaming platform supplying clinical and billing event streams."
  - type: "container"
    name: "MinIO Object Storage Gateway Container"
    technology: "MinIO Object Storage"
    description: "Object storage receiving encrypted historical partitions and snapshots."
  - type: "container"
    name: "Compliance Archival Gateway"
    technology: "HTTPS Gateway"
    description: "Gateway receiving encrypted historical partitions and snapshots for compliance."
  - type: "container"
    name: "Audit & Compliance Sidecar Container"
    technology: "gRPC Service"
    description: "Sidecar container receiving security events and query audits."
  - type: "container"
    name: "API Gateway Container"
    technology: "HTTP/TCP"
    description: "Gateway accessing analytical query endpoints."
  - type: "container"
    name: "Reporting Services"
    technology: "HTTP/TCP"
    description: "Services consuming analytical query endpoints."
  - type: "container"
    name: "Observability Collector Container"
    technology: "Prometheus / HTTP"
    description: "Collector scraping telemetry metrics from the analytics engine."
relationships:
  - source: "Kafka Table Engine & Data Ingestion Coordinator"
    destination: "Apache Kafka StatefulSet"
    description: "Consumes clinical and billing event streams via Native Binary TCP protocol."
  - type: "source"
    source: "Columnar Storage Engine & MergeTree Table Family"
    destination: "MinIO Object Storage Gateway Container"
    description: "Exports encrypted historical partitions and snapshots via HTTPS."
  - type: "source"
    source: "Columnar Storage Engine & MergeTree Table Family"
    destination: "Compliance Archival Gateway"
    description: "Exports encrypted historical partitions and snapshots via HTTPS."
  - type: "source"
    source: "Audit Logging Interceptor & Resource Governance Governor"
    destination: "Audit & Compliance Sidecar Container"
    description: "Forwards security events and query audits via gRPC."
  - type: "source"
    source: "Vectorized Query Execution Engine"
    destination: "API Gateway Container"
    description: "Exposes analytical query endpoints over HTTP/TCP protocols."
  - type: "source"
    source: "Vectorized Query Execution Engine"
    destination: "Reporting Services"
    description: "Exposes analytical query endpoints over HTTP/TCP protocols."
  - type: "source"
    source: "Prometheus Metrics Exporter"
    destination: "Observability Collector Container"
    description: "Scrapes telemetry metrics using Prometheus over HTTP on Port 9363."