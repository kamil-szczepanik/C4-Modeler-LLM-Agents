level: component
scope: "Component diagram for the Secure File Transfer Container container"
parentContainer:
  name: "Secure File Transfer Container"
elements:
  - type: "component"
    name: "SFTP/FTPS Server Handler"
    technology: "Go, SSH/TLS"
    description: "Manages inbound and outbound protocol connections via SSH/TLS."
  - type: "component"
    name: "PGP Cryptographic Engine"
    technology: "Go, OpenPGP, PKCS#11"
    description: "Handles mandatory file-level encryption, decryption, and key-rotation."
  - type: "component"
    name: "Transfer Orchestration Worker"
    technology: "Go, RabbitMQ"
    description: "Manages asynchronous batch queues, rate-limiting, and dead-letter queue routing."
  - type: "component"
    name: "Audit Logging Interceptor"
    technology: "Go, gRPC"
    description: "Emits compliance events via gRPC."
  - type: "component"
    name: "Virus & Malware Scanning Component"
    technology: "Go, ClamAV, UNIX Domain Sockets"
    description: "Inspects files using ClamAV via UNIX domain sockets."
  - type: "component"
    name: "Transfer State Store Component"
    technology: "Go, BoltDB"
    description: "Tracks resume pointers and session states using BoltDB."
  - type: "component"
    name: "Metadata Sanitization Component"
    technology: "Go"
    description: "Strips sensitive EXIF/file-header metadata."
  - type: "component"
    name: "Chunked Stream Assembler Component"
    technology: "Go"
    description: "Processes large imaging payloads via constant-memory sliding windows."
  - type: "component"
    name: "Bandwidth Throttling Component"
    technology: "Go"
    description: "Controls network utilization via rate-limiting primitives."
relationships:
  - source: "External Partners"
    destination: "SFTP/FTPS Server Handler"
    description: "Connects via SSH/TLS protocols through the Hybrid VPN Gateway Container."
  - source: "PGP Cryptographic Engine"
    destination: "Data Encryption & Key Management Container"
    description: "Fetches keys dynamically using PKCS#11."
  - source: "SFTP/FTPS Server Handler"
    destination: "MinIO Object Storage Gateway"
    description: "Streams decrypted payloads via HTTPS/S3."
  - source: "Transfer Orchestration Worker"
    destination: "RabbitMQ"
    description: "Coordinates state transitions and dead-letter routing."
  - source: "Audit Logging Interceptor"
    destination: "Audit Sidecar Container"
    description: "Forwards structured JSON logs via gRPC."