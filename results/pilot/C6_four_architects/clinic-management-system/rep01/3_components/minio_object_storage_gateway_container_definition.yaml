level: component
scope: "Component diagram for the MinIO Object Storage Gateway Container container"
parentContainer:
  name: "MinIO Object Storage Gateway Container"
elements:
  - type: "component"
    name: "S3 API Handler"
    technology: "Go-based routing, HTTPS/REST"
    description: "Handles S3-compatible API requests using Go-based routing and HTTPS/REST."
  - type: "component"
    name: "Erasure Coding & Tiering Engine"
    technology: "POSIX, NVMe-oF, AES-256"
    description: "Manages distributed erasure coding, tiering, and storage optimization."
  - type: "component"
    name: "IAM & KMS Policy Enforcer"
    technology: "PKCS#11, gRPC"
    description: "Enforces IAM and KMS policies, integrating with key management systems."
  - type: "component"
    name: "Object Lifecycle Management Component & Object Lock/Legal Hold Manager"
    technology: "MinIO Object Lifecycle"
    description: "Manages object lifecycle rules, data retention, object lock, and legal holds."
  - type: "component"
    name: "Multipart Upload Manager & Caching/Read-Ahead Proxy"
    technology: "Redis"
    description: "Manages multipart uploads and provides caching/read-ahead proxy capabilities using Redis."
  - type: "component"
    name: "Event Notification Dispatcher"
    technology: "Apache Kafka"
    description: "Dispatches bucket events to Apache Kafka."
  - type: "component"
    name: "Health Probe and Self-Repair Component"
    technology: "HTTP"
    description: "Provides health checks and self-repair capabilities over HTTP."
  - type: "component"
    name: "Compression, Malware Scanning, and Quota Isolation Components"
    technology: "MinIO Native"
    description: "Handles data compression, malware scanning, and quota isolation."
  - type: "component"
    name: "Bucket Replication Engine & Storage Metrics Aggregator"
    technology: "Prometheus"
    description: "Handles bucket replication across regions and aggregates storage metrics for Prometheus."
relationships:
  - source: "S3 API Handler"
    destination: "DICOM & Document Processing Container"
    description: "Receives HTTPS/REST traffic from DICOM & Document Processing via Envoy mTLS."
  - source: "S3 API Handler"
    destination: "Patient & EMR Service"
    description: "Receives HTTPS/REST traffic from EMR services via Envoy mTLS."
  - source: "IAM & KMS Policy Enforcer"
    destination: "Data Encryption & Key Management Container"
    description: "Integrates synchronously using PKCS#11 over gRPC."
  - source: "Event Notification Dispatcher"
    destination: "Apache Kafka StatefulSet"
    description: "Publishes bucket events using Kafka protocol."
  - source: "Bucket Replication Engine & Storage Metrics Aggregator"
    destination: "Observability Collector Container"
    description: "Exports Prometheus-formatted metrics over HTTP."