level: component
scope: "Component diagram for the Envoy Service Mesh Container container"
parentContainer:
  name: "Envoy Service Mesh Container"
elements:
  - type: "component"
    name: "Envoy Listener Subsystem"
    technology: "Envoy C++, BoringSSL"
    description: "Establishes bi-directional mTLS 1.3 tunnels over TCP with upstream and downstream microservices."
  - type: "component"
    name: "xDS Dynamic Configuration Client"
    technology: "Envoy C++, gRPC"
    description: "Manages dynamic configuration synchronization."
  - type: "component"
    name: "RBAC & Authorization Filter Engine"
    technology: "Envoy C++"
    description: "Communicates locally with the Tenant Context & Authorization Proxy via Unix domain sockets."
  - type: "component"
    name: "Rate Limit Filter Component"
    technology: "Envoy C++, gRPC"
    description: "Connects asynchronously via gRPC with a Redis caching tier."
  - type: "component"
    name: "Health Checking & Outlier Detection Component"
    technology: "Envoy C++"
    description: "Ensures fault tolerance and service availability."
  - type: "component"
    name: "Access Logging Service (ALS)"
    technology: "Envoy C++, gRPC"
    description: "Streams JSON audit telemetry via gRPC to the Observability Collector Container."
  - type: "component"
    name: "Envoy Tracing Filter Component"
    technology: "Envoy C++, OpenTelemetry, gRPC"
    description: "Exports OpenTelemetry data via gRPC over Unix domain sockets to the Observability Collector."
  - type: "component"
    name: "Envoy WASM Extension Host"
    technology: "WasmEdge, Rust"
    description: "Executes lightweight WebAssembly plugins for HIPAA payload inspection."
  - type: "component"
    name: "Envoy Cluster Manager Component"
    technology: "Envoy C++"
    description: "Manages upstream clusters and interacts with the DNS Resolver."
  - type: "component"
    name: "Envoy Circuit Breaker Component"
    technology: "Envoy C++"
    description: "Maintains high availability and fault tolerance across clinical workflows."
  - type: "component"
    name: "Envoy Ext_Authz Filter Component"
    technology: "Envoy C++, gRPC"
    description: "Maintains persistent HTTP/2 gRPC connections with the Authorization Proxy."
  - type: "component"
    name: "Envoy DNS Resolver Component"
    technology: "c-ares DNS"
    description: "Handles asynchronous DNS resolution and TTL caching, interacting with the Cluster Manager."
relationships:
  - source: "Envoy Listener Subsystem"
    destination: "Upstream and Downstream Microservices"
    description: "Establishes bi-directional mTLS 1.3 tunnels over TCP"
  - source: "RBAC & Authorization Filter Engine"
    destination: "Tenant Context & Authorization Proxy Container"
    description: "Communicates locally via Unix domain sockets"
  - source: "Rate Limit Filter Component"
    destination: "Redis Container tier"
    description: "Connects asynchronously via gRPC"
  - source: "Access Logging Service (ALS)"
    destination: "Observability Collector Container"
    description: "Streams JSON audit telemetry via gRPC"
  - source: "Envoy Tracing Filter Component"
    destination: "Observability Collector Container"
    description: "Exports OpenTelemetry data via gRPC over Unix domain sockets"
  - source: "Envoy Ext_Authz Filter Component"
    destination: "Tenant Context & Authorization Proxy Container"
    description: "Maintains persistent HTTP/2 gRPC connections"
  - source: "Envoy DNS Resolver Component"
    destination: "Envoy Cluster Manager Component"
    description: "Interacts for endpoint resolution"