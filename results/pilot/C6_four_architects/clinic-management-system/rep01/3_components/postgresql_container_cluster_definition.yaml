level: component
scope: "Component diagram for the PostgreSQL Container cluster container"
parentContainer:
  name: "PostgreSQL Container cluster"
elements:
  - type: "component"
    name: "Primary PostgreSQL Instance"
    technology: "PostgreSQL 15+"
    description: "Core relational database engine providing robust ACID compliance."
  - type: "component"
    name: "Synchronous Read-Only Replicas"
    technology: "PostgreSQL 15+"
    description: "Provides read scaling and high availability via streaming replication."
  - type: "component"
    name: "PgBouncer Connection Pooling Sidecars"
    technology: "PgBouncer"
    description: "Manages thousands of concurrent microservice connections efficiently."
  - type: "component"
    name: "Continuous Backup & PITR Daemon (pgBackRest/Barman)"
    technology: "pgBackRest"
    description: "Facilitates continuous backups and point-in-time recovery for data retention mandates."
  - type: "component"
    name: "Distributed Consensus Manager (Raft / CloudNativePG)"
    technology: "CloudNativePG Operator"
    description: "Orchestrates PostgreSQL lifecycle on Kubernetes for 99.99% uptime."
  - type: "component"
    name: "Database Policy Enforcement Component (PostgreSQL RLS)"
    technology: "PostgreSQL RLS"
    description: "Enforces data access policies at the row level."
  - type: "component"
    name: "PostgreSQL Audit Extension (pgaudit)"
    technology: "pgaudit"
    description: "Emits structured audit logs for compliance."
  - type: "component"
    name: "Declarative Partition Management Component"
    technology: "PostgreSQL Partitioning"
    description: "Manages table partitioning for optimized data retention and performance."
  - type: "component"
    name: "Automated Index Maintenance Daemon"
    technology: "PostgreSQL Extension / Cron"
    description: "Performs automated index maintenance to sustain sub-second P95 performance."
  - type: "component"
    name: "Health Probe and Liveness Sidecar"
    technology: "Kubernetes Liveness Probe"
    description: "Monitors container health and facilitates automated failover."
  - type: "component"
    name: "Patient, Scheduling, and Billing Services"
    technology: "Microservices"
    description: "External services executing transactional queries and EMR searches."
  - type: "component"
    name: "Compliance Archival Gateway & WORM Object Storage"
    technology: "Storage Gateway / WORM Storage"
    description: "Stores immutable WAL backups for regulatory compliance."
  - type: "component"
    name: "Observability Collector Container"
    technology: "Observability Collector"
    description: "Collects structured audit logs and metrics."
relationships:
  - source: "Patient, Scheduling, and Billing Services"
    destination: "PgBouncer Connection Pooling Sidecars"
    description: "Executes transactional queries and EMR searches [SQL / gRPC over mTLS]"
  - source: "Primary PostgreSQL Instance"
    destination: "Synchronous Read-Only Replicas"
    description: "Replicates transaction logs [Streaming Replication / TCP]"
  - source: "Continuous Backup & PITR Daemon (pgBackRest/Barman)"
    destination: "Compliance Archival Gateway & WORM Object Storage"
    description: "Streams WAL backups [TLS]"
  - source: "PostgreSQL Audit Extension (pgaudit)"
    destination: "Observability Collector Container"
    description: "Emits structured audit logs [syslog / TCP]"