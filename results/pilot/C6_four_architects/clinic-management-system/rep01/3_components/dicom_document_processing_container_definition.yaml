level: component
scope: "Component diagram for the DICOM & Document Processing Container container"
parentContainer:
  name: "DICOM & Document Processing Container"
elements:
  - type: "component"
    name: "DICOM Ingestion Engine"
    technology: "Node.js, dcmjs, DICOMweb, WADO-RS, QIDO-RS, DIMSE C-STORE SCP"
    description: "Receives imaging streams and handles DICOM ingestion."
  - type: "component"
    name: "Document Parser Service"
    technology: "Node.js, MuPDF, Tesseract.js OCR"
    description: "Parses clinical documents and performs OCR text extraction."
  - type: "component"
    name: "Image Transcoder"
    technology: "Node.js, dcmtk, C++ bindings, WebP/JPEG 2000 tile pyramids"
    description: "Handles ingestion, parsing, transcoding, and indexing of medical imaging."
  - type: "component"
    name: "Metadata Extractor"
    technology: "Node.js, FHIR DiagnosticReport and DocumentReference mapping"
    description: "Maps and extracts metadata into FHIR resources."
  - type: "component"
    name: "Job Orchestrator & Compliance Audit Interceptor"
    technology: "BullMQ, Unix domain sockets"
    description: "Orchestrates processing jobs and dispatches signed event hashes for compliance."
  - type: "container"
    name: "Hybrid VPN Gateway Container"
    technology: "VPN / Network Gateway"
    description: "External system providing imaging streams via TLS-secured TCP/DIMSE."
  - type: "container"
    name: "Apache Kafka StatefulSet"
    technology: "Apache Kafka"
    description: "External messaging system for raw imaging events."
  - type: "container"
    name: "MinIO Object Storage Gateway"
    technology: "MinIO"
    description: "External storage system for binary asset persistence."
  - type: "container"
    name: "PostgreSQL Container cluster"
    technology: "PostgreSQL"
    description: "External relational database for clinical indices."
  - type: "container"
    name: "Elasticsearch Containers"
    technology: "Elasticsearch"
    description: "External search engine for full-text search."
  - type: "container"
    name: "HL7 FHIR Adapter Container"
    technology: "HL7 FHIR Adapter"
    description: "External adapter container for routing FHIR resources."
  - type: "container"
    name: "RabbitMQ Container cluster"
    technology: "RabbitMQ"
    description: "External message queuing system for processing backlogs."
  - type: "container"
    name: "Redis Container tier"
    technology: "Redis"
    description: "External caching tier for image pyramids."
  - type: "container"
    name: "Audit & Compliance Sidecar Container"
    technology: "Sidecar Container"
    description: "External container receiving signed event hashes."
relationships:
  - source: "Hybrid VPN Gateway Container"
    destination: "DICOM Ingestion Engine"
    description: "Receives imaging streams via TLS-secured TCP/DIMSE."
  - source: "DICOM Ingestion Engine"
    destination: "Apache Kafka StatefulSet"
    description: "Publishes raw imaging events via TCP/Kafka."
  - source: "Image Transcoder"
    destination: "MinIO Object Storage Gateway"
    description: "Uses for binary persistence via HTTPS/S3."
  - source: "Document Parser Service"
    destination: "MinIO Object Storage Gateway"
    description: "Uses for binary persistence via HTTPS/S3."
  - source: "Metadata Extractor"
    destination: "PostgreSQL Container cluster"
    description: "Queries clinical indices via TLS/PostgreSQL wire protocol."
  - source: "Document Parser Service"
    destination: "Elasticsearch Containers"
    description: "Streams OCR text via HTTPS for full-text search."
  - source: "Metadata Extractor"
    destination: "HL7 FHIR Adapter Container"
    description: "Routes FHIR resources via internal gRPC."
  - source: "Job Orchestrator & Compliance Audit Interceptor"
    destination: "RabbitMQ Container cluster"
    description: "Consumes processing backlogs via AMQPS."
  - source: "Image Transcoder"
    destination: "Redis Container tier"
    description: "Caches image pyramids via Redis protocol."
  - source: "Job Orchestrator & Compliance Audit Interceptor"
    destination: "Audit & Compliance Sidecar Container"
    description: "Dispatches signed event hashes via Unix domain sockets."