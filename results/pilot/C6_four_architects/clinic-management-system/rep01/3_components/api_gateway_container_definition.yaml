level: component
scope: "Component diagram for the API Gateway Container container"
parentContainer:
  name: "API Gateway Container"
elements:
  - type: "component"
    name: "Ingress Router"
    technology: "Kong/Envoy"
    description: "Handles incoming HTTPS/TLS 1.3 traffic from patients, staff, administrators, and the PWA client."
  - type: "component"
    name: "Security and Rate Limiting Proxy"
    technology: "Kong/Envoy, Wasm/ModSecurity WAF"
    description: "Enforces security policies, rate limiting, and mTLS termination."
  - type: "component"
    name: "Routing and Dispatcher"
    technology: "Kong/Envoy"
    description: "Routes traffic via gRPC over mTLS to backend services and the HL7 FHIR Adapter."
relationships:
  - source: "Ingress Router"
    destination: "Security and Rate Limiting Proxy"
    description: "Inspects and secures incoming requests"
  - source: "Security and Rate Limiting Proxy"
    destination: "Routing and Dispatcher"
    description: "Forwards validated requests"
  - source: "Routing and Dispatcher"
    destination: "Tenant Context & Authorization Proxy Container"
    description: "Performs authorization via local gRPC loopback"