level: component
scope: "Component diagram for the Observability Collector Container container"
parentContainer:
  name: "Observability Collector Container"
elements:
  - type: "component"
    name: "OpenTelemetry Collector"
    technology: "OpenTelemetry Collector Engine"
    description: "Primary internal telemetry ingestion, processing, and export engine."
  - type: "component"
    name: "Receivers Layer"
    technology: "OTLP, Prometheus scraping, fluent-bit, Kafka Consumer Receiver"
    description: "Ingests data via OTLP (gRPC/HTTP), Prometheus scraping, fluent-bit logs, and Apache Kafka StatefulSet."
  - type: "component"
    name: "Processing Layer"
    technology: "OTel Processor Framework"
    description: "Includes batching, memory limiters, data scrubbing, Geo-Routing, Dynamic Sampling, Schema Validation, and Tenant Isolation Tagging."
  - type: "component"
    name: "Exporters Layer"
    technology: "gRPC / HTTP Exporters"
    description: "Routes telemetry to Prometheus TSDB, Elasticsearch, ClickHouse, and remote SIEM backends."
  - type: "component"
    name: "Prometheus Alertmanager"
    technology: "Prometheus Alertmanager"
    description: "Internal Alerting and Rule Evaluation Engine."
  - type: "component"
    name: "Persistent Queue (File Storage Extension)"
    technology: "File Storage Extension"
    description: "Guarantees data durability during network partitions."
  - type: "component"
    name: "mTLS Credential Manager"
    technology: "mTLS & W3C Trace Context"
    description: "Manages automated certificate rotation for outbound gRPC exporters."
  - type: "component"
    name: "Configuration Hot-Reload Controller"
    technology: "Kubernetes ConfigMap Controller"
    description: "Enables zero-downtime updates via Kubernetes ConfigMap."
relationships:
  - source: "Application Pods"
    destination: "Receivers Layer"
    description: "Forwards logs and metrics via fluent-bit and OTLP (gRPC/HTTP)"
  - source: "Apache Kafka StatefulSet"
    destination: "Receivers Layer"
    description: "Pulls raw telemetry events during peak loads"
  - source: "Exporters Layer"
    destination: "Prometheus TSDB"
    description: "Routes processed performance metrics locally via secure gRPC"
  - source: "Exporters Layer"
    destination: "eu-central-1 Backend"
    description: "Forwards compliance audit traces via gRPC over the Hybrid VPN Gateway Container"
  - source: "Prometheus Alertmanager"
    destination: "External SIEM System"
    description: "Triggers immediate alerts via webhook over mTLS"