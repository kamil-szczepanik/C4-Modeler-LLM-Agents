level: component
scope: "Component diagram for the Patient & EMR Service container"
parentContainer:
  name: "Patient & EMR Service"
elements:
  - type: "component"
    name: "EMR Management Engine"
    technology: "Node.js / TypeScript"
    description: "Manages electronic medical records and clinical workflows."
  - type: "component"
    name: "Patient Demographics Controller"
    technology: "Fastify"
    description: "Handles patient admissions and demographic routing."
  - type: "component"
    name: "Validation & Sanitization Middleware"
    technology: "ajv"
    description: "Enforces fast schema validation for clinical payloads."
  - type: "component"
    name: "Audit Logging Component"
    technology: "Node.js"
    description: "Dispatches immutable audit logs."
  - type: "component"
    name: "Crypto Interceptor Component"
    technology: "Node.js"
    description: "Handles field-level AES-256 encryption."
  - type: "component"
    name: "Caching & Distributed Locking Component"
    technology: "ioredis"
    description: "Executes caching and distributed locking."
  - type: "component"
    name: "HL7 FHIR Transformation Component"
    technology: "Node.js"
    description: "Transforms clinical data into HL7 FHIR standards."
  - type: "component"
    name: "Search Index Sync Component"
    technology: "Node.js"
    description: "Synchronizes data for search indexes."
  - type: "component"
    name: "FHIR Resource Validation Component"
    technology: "ajv"
    description: "Validates FHIR resources."
  - type: "component"
    name: "Tenant Context Manager Component"
    technology: "Node.js"
    description: "Manages multi-tenant context and isolation."
  - type: "component"
    name: "DLQ Handler Component"
    technology: "Node.js"
    description: "Handles dead-letter queue messages."
  - type: "component"
    name: "Offline Sync & Conflict Resolution Component"
    technology: "Node.js"
    description: "Manages offline synchronization and conflict resolution."
  - type: "component"
    name: "Access Policy Enforcer Component"
    technology: "Node.js"
    description: "Enforces access policies for compliance."
  - type: "component"
    name: "Bulk Export & Retention Component"
    technology: "Node.js"
    description: "Handles bulk data export and retention policies."
  - type: "component"
    name: "CDS Hook Engine"
    technology: "Node.js"
    description: "Executes clinical decision support hooks."
  - type: "component"
    name: "Consent Management Component"
    technology: "Node.js"
    description: "Manages explicit patient consent for compliance."
  - type: "component"
    name: "Diagnostic Telemetry Interceptor Component"
    technology: "OpenTelemetry SDK"
    description: "Exports metrics and traces for observability."
relationships:
  - source: "Patient Demographics Controller"
    destination: "Validation & Sanitization Middleware"
    description: "Validates incoming request payloads"
  - source: "EMR Management Engine"
    destination: "Crypto Interceptor Component"
    description: "Encrypts and decrypts sensitive clinical data"
  - source: "EMR Management Engine"
    destination: "Caching & Distributed Locking Component"
    description: "Uses distributed locks and cache"
  - source: "EMR Management Engine"
    destination: "HL7 FHIR Transformation Component"
    description: "Transforms clinical payloads"
  - source: "EMR Management Engine"
    destination: "Audit Logging Component"
    description: "Sends audit events"
  - source: "Diagnostic Telemetry Interceptor Component"
    destination: "Observability Collector Container"
    description: "Exports metrics and traces via OpenTelemetry SDK"