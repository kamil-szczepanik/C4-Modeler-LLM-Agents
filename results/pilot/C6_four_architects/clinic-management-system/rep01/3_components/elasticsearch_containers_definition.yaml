level: component
scope: "Component diagram for the Elasticsearch Containers container"
parentContainer:
  name: "Elasticsearch Containers"
elements:
  - type: "component"
    name: "Lucene Index Searcher and Document Routing/Parsing engine"
    technology: "Elasticsearch 3-node cluster, Kubernetes StatefulSets, Lucene"
    description: "Provides high-performance text-search indexing, document routing, and parsing for sub-second EMR search latencies."
  - type: "component"
    name: "Master, Data, and Ingest node tiers"
    technology: "Kubernetes StatefulSets, POSIX Filesystem, bootstrap.memory_lock: true"
    description: "Separates cluster management, data storage, and ingestion across separate failure domains with locked JVM heap."
  - type: "component"
    name: "Index Lifecycle Management (ILM) and Snapshot Lifecycle Management (SLM) execution engines"
    technology: "Elasticsearch ILM/SLM"
    description: "Manages index retention, transitions, and automated backups for long-term audit trail and clinical data."
  - type: "component"
    name: "Security Plugin module"
    technology: "Role-based access control, mTLS, REST API (port 9200), Transport Protocol (port 9300)"
    description: "Ensures secure internal service communication and access control meeting HIPAA/GDPR compliance."
  - type: "component"
    name: "Internal monitoring and Prometheus metrics exporter component"
    technology: "Prometheus scrape endpoints over HTTP"
    description: "Exports JVM and cluster metrics for observability."
  - type: "container"
    name: "Patient & EMR Service"
    technology: "gRPC over Envoy sidecar"
    description: "Retrieves indexed clinical records and patient demographics."
  - type: "container"
    name: "Apache Kafka"
    technology: "Debezium & Apache Kafka CDC pipeline"
    description: "Ingests change data capture streams for real-time synchronization over HTTPS."
  - type: "container"
    name: "Minio Object Storage Gateway Container"
    technology: "Snapshot and Restore engine"
    description: "Backs up indices for 10-year retention."
  - type: "container"
    name: "Observability Collector Container"
    technology: "HTTP Prometheus scrape endpoints"
    description: "Collects JVM and cluster metrics."
relationships:
  - source: "Patient & EMR Service"
    destination: "Lucene Index Searcher and Document Routing/Parsing engine"
    description: "Retrieves indexed clinical records and patient demographics via gRPC over Envoy sidecar (port 9200/HTTPS)"
  - source: "Apache Kafka"
    destination: "Lucene Index Searcher and Document Routing/Parsing engine"
    description: "Ingests change data capture (CDC) streams for real-time synchronization over HTTPS"
  - type: "component"
    source: "Index Lifecycle Management (ILM) and Snapshot Lifecycle Management (SLM) execution engines"
    destination: "Minio Object Storage Gateway Container"
    description: "Backs up indices via Snapshot and Restore engine for 10-year retention"
  - type: "component"
    source: "Internal monitoring and Prometheus metrics exporter component"
    destination: "Observability Collector Container"
    description: "Exports JVM and cluster metrics via Prometheus scrape endpoints over HTTP"