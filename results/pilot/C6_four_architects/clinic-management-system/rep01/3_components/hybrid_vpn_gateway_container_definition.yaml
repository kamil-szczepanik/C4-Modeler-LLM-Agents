level: component
scope: "Component diagram for the Hybrid VPN Gateway Container container"
parentContainer:
  name: "Hybrid VPN Gateway Container"
elements:
  - type: "component"
    name: "WireGuard Core Tunneling Daemon"
    technology: "BoringTun, Memory-safe user-space tunneling daemon"
    description: "Establishes secure, high-availability hybrid connectivity via bidirectional UDP encrypted tunnels over port 51820."
  - type: "component"
    name: "Route Agent"
    technology: "Bird BGP"
    description: "Handles dynamic BGP route propagation and failover."
  - type: "component"
    name: "Configuration Synchronizer"
    technology: "gRPC"
    description: "Performs encrypted inter-container configuration synchronization and secret retrieval."
  - type: "component"
    name: "IPsec/IKEv2 Fallback Manager"
    technology: "IPsec/IKEv2"
    description: "Manages redundant fallback connections to ensure sub-second failover."
  - type: "component"
    name: "Traffic Policer"
    technology: "Linux tc (Traffic Control)"
    description: "Enforces QoS queues for traffic prioritization."
  - type: "component"
    name: "Network Flow Auditing Component"
    technology: "NetFlow/IPFIX"
    description: "Exports network flow telemetry for compliance and auditing."
  - type: "component"
    name: "Tunnel Termination Proxy"
    technology: "Proxy Daemon"
    description: "Terminates incoming and outgoing hybrid tunnels securely."
  - type: "component"
    name: "State Synchronization Daemon"
    technology: "State Sync"
    description: "Maintains high-availability state across gateway instances."
  - type: "component"
    name: "Cryptographic Hardware Acceleration Module"
    technology: "Hardware Acceleration"
    description: "Accelerates cryptographic operations to protect sensitive patient information without performance degradation."
  - type: "component"
    name: "MTU Discovery and Fragmentation Manager"
    technology: "Network Stack"
    description: "Manages packet sizes and fragmentation across the hybrid link."
  - type: "component"
    name: "Kernel Metrics Exporter"
    technology: "eBPF"
    description: "Gathers low-level transport telemetry and metric scraping via eBPF."
  - type: "component"
    name: "Split-Tunnel Policy Enforcer"
    technology: "nftables"
    description: "Enforces kernel-level packet filtering and policy routing for compliance."
  - type: "component"
    name: "Dead Peer Detection (DPD) Watchdog"
    technology: "DPD"
    description: "Monitors tunnel health and triggers automated failover mechanisms."
  - type: "component"
    name: "Packet Inspection and Anti-Replay Filter"
    technology: "nftables / Security Filter"
    description: "Inspects packets and prevents replay attacks for HIPAA/GDPR compliance."
  - type: "component"
    name: "DNS Forwarding and Split-Resolver"
    technology: "DNS Resolver"
    description: "Handles encrypted DNS query resolution to on-premise DNS servers."
relationships:
  - source: "WireGuard Core Tunneling Daemon"
    destination: "AWS VPC"
    description: "Establishes bidirectional UDP encrypted tunnels over port 51820."
  - source: "Configuration Synchronizer"
    destination: "Data Encryption & Key Management Container"
    description: "Requests encrypted gRPC secret retrieval."
  - source: "Network Flow Auditing Component"
    destination: "Audit & Compliance Sidecar Container"
    description: "Exports NetFlow/IPFIX telemetry."
  - source: "Kernel Metrics Exporter"
    destination: "Observability Collector Container"
    description: "Exports eBPF transport telemetry."
  - source: "DNS Forwarding and Split-Resolver"
    destination: "On-Premise DNS Servers"
    description: "Resolves encrypted DNS queries."