level: component
scope: "Component diagram for the HL7 FHIR Adapter Container container"
parentContainer:
  name: "HL7 FHIR Adapter Container"
elements:
  - type: "component"
    name: "API Router & Validator"
    technology: "Express.js, Node.js"
    description: "Manages HTTP routing, REST API endpoints, and initial payload validation."
  - type: "component"
    name: "FHIR Resource Mapper"
    technology: "TypeScript classes"
    description: "Transforms clinical payloads into standardized FHIR resources."
  - type: "component"
    name: "Outbound TLS Client"
    technology: "Axios, HTTPS/mTLS"
    description: "Transmits transformed FHIR resources securely to external health systems."
  - type: "component"
    name: "Audit Logger Interceptor"
    technology: "gRPC"
    description: "Dispatches audit events for compliance tracking."
  - type: "component"
    name: "HL7 Validation Engine"
    technology: "fhir validator-wrapper"
    description: "Validates HL7 payloads against defined healthcare standards."
  - type: "component"
    name: "Retry & Dead-Letter Queue Manager"
    technology: "BullMQ, Redis"
    description: "Handles resilient message queuing, caching, and retry management."
  - type: "component"
    name: "mTLS Ingress Terminating Proxy"
    technology: "Envoy sidecar"
    description: "Provides edge cryptographic termination."
  - type: "component"
    name: "Payload Sanitization & PII Redaction"
    technology: "Regex-based"
    description: "Sanitizes payloads and redacts personally identifiable information."
  - type: "component"
    name: "FHIR Subscription Manager"
    technology: "WebSockets, gRPC, RabbitMQ"
    description: "Distributes real-time events and subscriptions."
  - type: "component"
    name: "Bulk Data Import/Export Processor"
    technology: "JSONStream, KafkaJS, Apache Kafka"
    description: "Streams and processes large bulk FHIR data bundles."
  - type: "component"
    name: "Rate Limiting & Throttling Interceptor"
    technology: "Bottleneck"
    description: "Regulates incoming traffic and prevents service overload."
  - type: "component"
    name: "Schema Version Negotiation Middleware"
    technology: "Semantic versioning"
    description: "Manages schema versioning for compatibility across integrations."
  - type: "component"
    name: "Circuit Breaker Pattern Manager"
    technology: "Opossum"
    description: "Provides fault tolerance and graceful degradation during network anomalies."
  - type: "component"
    name: "Token Exchange & Claims Verifier"
    technology: "OAuth2/JWT, ABAC"
    description: "Verifies security tokens and handles attribute-based access control."
  - type: "component"
    name: "Terminology Mapping Engine"
    technology: "Redis, LOINC, SNOMED-CT"
    description: "Maps clinical terminologies to standard coding systems."
  - type: "component"
    name: "Metrics & Tracing Interceptor"
    technology: "OpenTelemetry SDK"
    description: "Collects metrics and provides end-to-end distributed tracing."
  - type: "component"
    name: "Asynchronous Webhook Dispatcher"
    technology: "Express.js, HMAC-SHA256, AMQP/RabbitMQ"
    description: "Offloads and dispatches webhook payloads asynchronously."
  - type: "component"
    name: "Payload Compression & Decompression Middleware"
    technology: "Node.js zlib"
    description: "Compresses and decompresses payloads for efficient transmission."
  - type: "component"
    name: "DLQ Purge & Replay Worker"
    technology: "Cron, Notification Service"
    description: "Purges and replays messages from the dead-letter queue."
  - type: "component"
    name: "FHIR Bundle Splitting Processor"
    technology: "Node.js"
    description: "Splits large FHIR bundles into manageable parts."
relationships:
  - source: "Patient & EMR Service"
    destination: "API Router & Validator"
    description: "Exchanges clinical payloads [HTTPS/REST]"
  - source: "API Router & Validator"
    destination: "FHIR Resource Mapper"
    description: "Forwards validated payloads [In-memory]"
  - source: "FHIR Resource Mapper"
    destination: "Outbound TLS Client"
    description: "Transmits transformed FHIR resources [HTTPS/mTLS]"
  - source: "Outbound TLS Client"
    destination: "External Lab, Imaging, and HIE Systems"
    description: "Exchanges health data [HTTPS/REST]"
  - source: "Audit Logger Interceptor"
    destination: "Audit & Compliance Sidecar Container"
    description: "Dispatches audit events [gRPC]"
  - source: "FHIR Subscription Manager"
    destination: "RabbitMQ Cluster"
    description: "Distributes real-time events [gRPC/AMQP]"
  - source: "Bulk Data Import/Export Processor"
    destination: "Apache Kafka StatefulSet"
    description: "Streams large bundles [KafkaJS]"
  - source: "Asynchronous Webhook Dispatcher"
    destination: "RabbitMQ Cluster"
    description: "Offloads webhook payloads [AMQP]"