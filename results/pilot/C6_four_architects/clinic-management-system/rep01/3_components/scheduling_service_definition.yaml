level: component
scope: "Component diagram for the Scheduling Service container"
parentContainer:
  name: "Scheduling Service"
elements:
  - type: "component"
    name: "Scheduling API Controller"
    technology: "Node.js & Express"
    description: "Exposes REST and gRPC endpoints for managing appointments and schedules."
  - type: "component"
    name: "Appointment Domain Logic"
    technology: "Node.js Domain Model"
    description: "Handles business rules and validation for patient admissions and appointment scheduling."
  - type: "component"
    name: "Database Repository"
    technology: "PostgreSQL Client Driver"
    description: "Manages persistence and ACID-compliant queries for schedules over TLS."
  - type: "component"
    name: "Cache Manager"
    technology: "Redis Client / Redlock"
    description: "Handles sub-millisecond slot availability checks and distributed locking."
  - type: "component"
    name: "Event Publisher"
    technology: "Apache Kafka Client"
    description: "Streams asynchronous domain events for scheduling updates."
relationships:
  - source: "Scheduling API Controller"
    destination: "Appointment Domain Logic"
    description: "Delegates request processing"
  - source: "Appointment Domain Logic"
    destination: "Database Repository"
    description: "Persists schedule data using SQL over TLS"
  - source: "Appointment Domain Logic"
    destination: "Cache Manager"
    description: "Performs slot availability checks via RESP protocol"
  - source: "Appointment Domain Logic"
    destination: "Event Publisher"
    description: "Publishes domain events via Kafka binary protocol"