level: component
scope: "Component diagram for the Apache Kafka StatefulSet container"
parentContainer:
  name: "Apache Kafka StatefulSet"
elements:
  - type: "component"
    name: "KRaft Controller Component"
    technology: "KRaft Consensus Protocol"
    description: "Replaces ZooKeeper for streamlined, decentralized metadata quorum management."
  - type: "component"
    name: "Kafka Broker Engine"
    technology: "Apache Kafka"
    description: "Event streaming platform providing partition fault tolerance and replication for high-throughput event sourcing."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry"
    description: "Enforces strict Avro payload validation and backward compatibility."
  - type: "component"
    name: "Kafka Connect Components"
    technology: "Apache Kafka Connect"
    description: "Integrates external data sources and sinks with the Kafka event streaming platform."
  - type: "component"
    name: "Authorizer Component"
    technology: "Native ACL / Apache Ranger"
    description: "Manages authorization and access control rules for Kafka resources."
  - type: "component"
    name: "Cruise Control Component"
    technology: "LinkedIn Cruise Control"
    description: "Automates cluster workload balancing, anomaly detection, and self-healing operations."
  - type: "component"
    name: "Metrics Exporter"
    technology: "Prometheus JMX Exporter"
    description: "Scrapes JVM and broker performance metrics for observability."
  - type: "component"
    name: "Tiered Storage Plugin"
    technology: "Kafka Tiered Storage"
    description: "Offloads cold logs and streams to object storage for cost-effective 10-year retention."
  - type: "component"
    name: "MirrorMaker 2 Component"
    technology: "Apache Kafka MirrorMaker 2"
    description: "Replicates transaction streams across on-prem and cloud regions."
  - type: "component"
    name: "Data Governance and Masking Interceptor"
    technology: "Custom Interceptor Plugin"
    description: "Masks and governs sensitive data payloads to satisfy HIPAA and GDPR requirements."
  - type: "component"
    name: "Dead Letter Queue (DLQ) Management Engine"
    technology: "Kafka DLQ Pattern"
    description: "Manages failed message routing and reprocessing workflows."
  - type: "component"
    name: "Client Connection Multiplexer"
    technology: "Envoy proxy sidecars"
    description: "Secures and multiplexes client connections using TLS 1.3 & SASL/SCRAM-SHA-512."
  - type: "component"
    name: "Log Compaction and Segment Manager"
    technology: "Kafka Core Log Manager"
    description: "Manages log segments, retention policies, and log compaction routines."
  - type: "component"
    name: "Backup and Snapshot Controller"
    technology: "Kafka Backup Controller"
    description: "Orchestrates cluster backups and state snapshots for disaster recovery."
  - type: "component"
    name: "Health Check and Cluster Operator"
    technology: "Strimzi-based Operator"
    description: "Automates cluster operations, provisioning, and failover handling on Kubernetes."
  - type: "component"
    name: "Audit Logging Interceptor"
    technology: "Custom Interceptor Plugin"
    description: "Streams compliance and audit logs to security monitoring sidecars."
  - type: "system"
    name: "Patient & EMR Service"
    technology: "Microservice"
    description: "Publishes and consumes domain events."
  - type: "system"
    name: "Microservices"
    technology: "System"
    description: "Consumes schema definitions and enforces Avro payload validation."
  - type: "container"
    name: "MinIO Object Storage Gateway"
    technology: "MinIO Object Storage Gateway Container"
    description: "Stores offloaded cold logs and data streams."
  - type: "container"
    name: "Hybrid VPN Gateway"
    technology: "Hybrid VPN Gateway Container"
    description: "Connects on-premises infrastructure with cloud environments."
  - type: "container"
    name: "Observability Collector"
    technology: "Observability Collector Container"
    description: "Collects telemetry data and metrics from exporters."
  - type: "container"
    name: "Audit & Compliance Sidecar"
    technology: "Audit & Compliance Sidecar Container"
    description: "Receives compliance and audit logs."
relationships:
  - source: "Patient & EMR Service"
    destination: "Kafka Broker Engine"
    description: "Publishes and consumes domain events [Asynchronous Messaging / Kafka Protocol]"
  - source: "Schema Registry"
    destination: "Microservices"
    description: "Enforces Avro payload validation [HTTP/REST]"
  - source: "Kafka Connect Components"
    destination: "MinIO Object Storage Gateway"
    description: "Offloads cold logs and streams [S3/HTTPS]"
  - source: "Tiered Storage Plugin"
    destination: "MinIO Object Storage Gateway"
    description: "Offloads cold logs and streams [S3/HTTPS]"
  - source: "MirrorMaker 2 Component"
    destination: "Hybrid VPN Gateway"
    description: "Replicates transaction streams across on-prem and cloud [Encrypted TCP]"
  - source: "Metrics Exporter"
    destination: "Observability Collector"
    description: "Bridges telemetry data [OpenTelemetry / Prometheus]"
  - source: "Audit Logging Interceptor"
    destination: "Audit & Compliance Sidecar"
    description: "Streams compliance logs [Internal IPC]"