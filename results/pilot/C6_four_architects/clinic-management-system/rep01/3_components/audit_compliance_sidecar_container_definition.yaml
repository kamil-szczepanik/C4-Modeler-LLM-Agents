level: component
scope: "Component diagram for the Audit & Compliance Sidecar Container container"
parentContainer:
  name: "Audit & Compliance Sidecar Container"
elements:
  - type: "component"
    name: "Log Interceptor Component"
    technology: "FluentBit/Vector, Unix Domain Sockets, mmap"
    description: "Consumes stdout/stderr logs via AF_UNIX and shared emptyDir volumes [Shared Memory]."
  - type: "component"
    name: "Policy Validation Component"
    technology: "Go, WebAssembly, Rego rules"
    description: "Evaluates data sanitization policies and compiled Rego rules."
  - type: "component"
    name: "Cryptographic Signer & Formatter Component"
    technology: "Go, Canonical JSON RFC 8785, HMAC-SHA256"
    description: "Formats and cryptographically signs audit records."
  - type: "component"
    name: "HSM Key Provider Component"
    technology: "PKCS#11, Hardware Security Module"
    description: "Performs hardware-backed digital signatures and key rotations."
  - type: "component"
    name: "Resilient Forwarder Component"
    technology: "RocksDB persistent buffering, token-bucket rate limiter"
    description: "Manages persistent buffering and dispatches logs and alerts."
  - type: "component"
    name: "Compliance Archival Gateway & WORM Object Storage"
    technology: "WORM Object Storage"
    description: "Stores long-term encrypted audit logs."
  - type: "component"
    name: "Elasticsearch Containers cluster"
    technology: "Elasticsearch"
    description: "Dispatches log batches for real-time analytics."
  - type: "component"
    name: "RabbitMQ Container cluster"
    technology: "AMQP 0.9.1"
    description: "Publishes security alerts and tamper notifications."
  - type: "component"
    name: "Observability Collector Container"
    technology: "OpenTelemetry, Prometheus"
    description: "Emits operational metrics."
  - type: "component"
    name: "Tenant Context & Authorization Proxy Container"
    technology: "Proxy"
    description: "Provides context-aware masking policies and authorization context."
relationships:
  - source: "Log Interceptor Component"
    destination: "Audit & Compliance Sidecar Container"
    description: "Consumes stdout/stderr logs via AF_UNIX and shared emptyDir volumes [Shared Memory]"
  - source: "Policy Validation Component"
    destination: "Tenant Context & Authorization Proxy Container"
    description: "Fetches context-aware masking policies and compiled Rego rules [gRPC/Wasm]"
  - source: "Cryptographic Signer & Formatter Component"
    destination: "HSM Key Provider Component"
    description: "Performs hardware-backed digital signatures and key rotations [PKCS#11]"
  - source: "Resilient Forwarder Component"
    destination: "Compliance Archival Gateway & WORM Object Storage"
    description: "Streams encrypted audit logs [mTLS 1.3, gRPC]"
  - source: "Resilient Forwarder Component"
    destination: "Elasticsearch Containers cluster"
    description: "Dispatches log batches for real-time analytics [TLS]"
  - source: "Resilient Forwarder Component"
    destination: "RabbitMQ Container cluster"
    description: "Publishes security alerts and tamper notifications [AMQP 0.9.1, TLS 1.3]"
  - source: "Resilient Forwarder Component"
    destination: "Observability Collector Container"
    description: "Emits operational metrics [HTTP, OpenTelemetry]"