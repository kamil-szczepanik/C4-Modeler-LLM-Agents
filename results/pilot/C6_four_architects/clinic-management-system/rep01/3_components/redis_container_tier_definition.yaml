level: component
scope: "Component diagram for the Redis Container tier container"
parentContainer:
  name: "Redis Container tier"
elements:
  - type: "component"
    name: "In-Memory Data Store & Key-Space Partitioning Router"
    technology: "Redis Enterprise Container Tier"
    description: "Delivers high-availability caching, distributed locking, and sub-second performance."
  - type: "component"
    name: "Distributed Lock Manager & Redlock Algorithms"
    technology: "Redis Enterprise"
    description: "Manages distributed locks for patient admissions and scheduling."
  - type: "component"
    name: "Session State Engine & RBAC Enforcer"
    technology: "Redis Enterprise"
    description: "Handles session states and role-based access control enforcement."
  - type: "component"
    name: "Active-Active Conflict Resolution Engine (CRDTs)"
    technology: "Conflict-Free Replicated Data Types (CRDTs)"
    description: "Ensures active-active multi-region state convergence."
  - type: "component"
    name: "Persistence & Backup Coordinator (RDB/AOF)"
    technology: "Redis Enterprise"
    description: "Coordinates RDB and AOF persistence and backups."
  - type: "component"
    name: "Encryption-At-Rest Manager (AES-256, PKCS#11)"
    technology: "PKCS#11 & AES-256"
    description: "Manages encryption at rest to satisfy HIPAA and GDPR compliance."
  - type: "component"
    name: "Pub/Sub Event Broker & Bulk Ingestion Pipeline"
    technology: "Redis Enterprise"
    description: "Facilitates pub/sub events and bulk data ingestion."
  - type: "component"
    name: "Geo-Replication Tunnel Manager & Cluster Topology Manager"
    technology: "Redis Enterprise"
    description: "Manages hybrid geo-replication and cluster topologies."
  - type: "component"
    name: "Memory Eviction, TTL Policy Controller & Resource Quota Enforcer"
    technology: "Redis Enterprise"
    description: "Controls memory eviction, TTL policies, and resource quotas."
  - type: "component"
    name: "Telemetry Exporter & Audit Log Interceptor"
    technology: "Prometheus & OpenTelemetry"
    description: "Exports metrics and intercepts audit logs."
  - type: "component"
    name: "Dead Letter & Fallback Handler"
    technology: "Redis Enterprise"
    description: "Handles dead letters and fallbacks."
relationships:
  - source: "Patient & EMR Service"
    destination: "In-Memory Data Store & Key-Space Partitioning Router"
    description: "Executes distributed locking and caching [RESP3 over TLS]"
  - source: "Scheduling Service"
    destination: "Distributed Lock Manager & Redlock Algorithms"
    description: "Validates appointment resource clashes [RESP3 over TLS]"
  - source: "In-Memory Data Store & Key-Space Partitioning Router"
    destination: "PostgreSQL Container cluster"
    description: "Fallback read/write operations during partitions [gRPC/SQL]"
  - source: "Telemetry Exporter & Audit Log Interceptor"
    destination: "Observability Collector Container"
    description: "Exports metrics [Prometheus scrapers]"
  - source: "Telemetry Exporter & Audit Log Interceptor"
    destination: "Audit & Compliance Sidecar Container"
    description: "Streams administrative audit logs [Structured Logs]"