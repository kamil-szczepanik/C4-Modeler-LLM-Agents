level: component
scope: "Component diagram for the Billing Service container"
parentContainer:
  name: "Billing Service"
elements:
  - type: "component"
    name: "Invoice Engine & Pricing Cache"
    technology: "Node.js, Redis"
    description: "Manages invoice generation and in-memory pricing cache."
  - type: "component"
    name: "Claim Submitter & X12 EDI Formatter"
    technology: "Node.js, XState, ANSI X12 837/835"
    description: "Handles claim submission and X12 EDI formatting using state machines."
  - type: "component"
    name: "Payment Gateway Integrator & PCI-DSS Tokenizer"
    technology: "Node.js, HTTPS/TLS 1.3, Resilience4J"
    description: "Integrates with payment gateways and provides PCI-DSS tokenization."
  - type: "component"
    name: "Webhook Receiver & Signature Verifier"
    technology: "Express.js, Node.js Crypto"
    description: "Receives webhooks and verifies cryptographic signatures."
  - type: "component"
    name: "Batch Settlement Processor & Statement Generator"
    technology: "Node.js Worker Threads, PDFKit"
    description: "Processes batch settlements and generates PDF statements."
  - type: "component"
    name: "Ledger Auditor & Analytics Emitter"
    technology: "gRPC, Unix Domain Sockets, ClickHouse"
    description: "Audits ledgers and emits analytics data."
relationships:
  - source: "Billing Service"
    destination: "PostgreSQL Container cluster"
    description: "Executes transactional queries and connection pooling [SQL / gRPC]"
  - source: "Claim Submitter & X12 EDI Formatter"
    destination: "Apache Kafka StatefulSet"
    description: "Streams financial events [TLS / KafkaJS]"
  - source: "Claim Submitter & X12 EDI Formatter"
    destination: "RabbitMQ Container cluster"
    description: "Dispatches clearinghouse payloads [AMQP 0-9-1]"
  - source: "Batch Settlement Processor & Statement Generator"
    destination: "MinIO Object Storage Gateway Container"
    description: "Uploads PDF statements [HTTPS / S3 API]"
  - source: "Ledger Auditor & Analytics Emitter"
    destination: "Audit & Compliance Sidecar Container"
    description: "Streams audit events [Local gRPC]"