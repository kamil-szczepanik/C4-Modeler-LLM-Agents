level: component
scope: "Component diagram for the RabbitMQ Container cluster container"
parentContainer:
  name: "RabbitMQ Container cluster"
elements:
  - type: "component"
    name: "Quorum Queues"
    technology: "RabbitMQ 3.12+ with Raft consensus"
    description: "Provides active-active fault-tolerant message routing and storage for transient clinical events."
  - type: "component"
    name: "Federation and Shovel Plugins"
    technology: "RabbitMQ Plugins"
    description: "Guarantees seamless cross-region transient event replication between on-premise and AWS eu-central-1."
  - type: "component"
    name: "Dead Letter Exchanges"
    technology: "RabbitMQ AMQP"
    description: "Forwards unacknowledged or expired payloads to the Audit & Compliance Sidecar Container."
  - type: "component"
    name: "Prometheus Plugin"
    technology: "HTTP/Prometheus scrape"
    description: "Exposes broker runtime metrics to the Observability Collector Container."
  - type: "component"
    name: "Cluster Operator"
    technology: "Kubernetes Operator / HashiCorp Vault"
    description: "Automates TLS certificate and credential rotation."
relationships:
  - source: "Scheduling Service & Billing Service"
    destination: "Quorum Queues"
    description: "Publishes/consumes transient clinical events [AMQP 0-9-1, MQTT over TLS 1.3]"
  - source: "Dead Letter Exchanges"
    destination: "Audit & Compliance Sidecar Container"
    description: "Forwards unacknowledged or expired payloads [AMQP]"
  - source: "Cluster Operator"
    destination: "HashiCorp Vault"
    description: "Automates TLS certificate and credential rotation [HTTPS]"
  - source: "Prometheus Plugin"
    destination: "Observability Collector Container"
    description: "Exposes broker runtime metrics [HTTP/Prometheus scrape]"