level: component
scope: "Component diagram for the Tenant Context & Authorization Proxy Container container"
parentContainer:
  name: "Tenant Context & Authorization Proxy Container"
elements:
  - type: "component"
    name: "Open Policy Agent (OPA)"
    technology: "Rego"
    description: "Evaluates security policies for sub-millisecond, attribute-based policy enforcement."
  - type: "component"
    name: "Go-based Custom Policy Enforcement Daemon"
    technology: "Go"
    description: "Powers the custom policy enforcement daemon for high performance and low memory overhead."
  - type: "component"
    name: "In-Memory Policy Cache Component"
    technology: "In-Memory Storage"
    description: "Caches policies locally for rapid retrieval and low latency."
  - type: "component"
    name: "Tenant Context Resolver Component"
    technology: "Go"
    description: "Resolves and evaluates tenant context for incoming requests."
  - type: "component"
    name: "Dynamic Role Mapping Component"
    technology: "Go"
    description: "Dynamically maps roles and permissions for fine-grained authorization."
  - type: "component"
    name: "Embedded SQLite Database"
    technology: "SQLite"
    description: "Used for localized offline fallback role-cache storage during network partitions."
  - type: "component"
    name: "Context Propagation & Header Sanitization Component"
    technology: "Go"
    description: "Sanitizes headers and propagates security contexts downstream."
  - type: "component"
    name: "Metrics & Telemetry Emitter Component"
    technology: "OpenTelemetry"
    description: "Enables real-time tracing and metrics collection."
  - type: "component"
    name: "Policy Bundle Synchronizer Component"
    technology: "HTTPS / OCI"
    description: "Polls OCI-compliant secure registries over HTTPS to synchronize policy bundles."
  - type: "component"
    name: "Rate Limiting & Token Bucket Component"
    technology: "Go / Redis Enterprise"
    description: "Enforces rate limiting and token bucket algorithms for traffic management."
  - type: "component"
    name: "Denial-of-Wallet & Threat Mitigation Component"
    technology: "Go"
    description: "Mitigates denial-of-wallet attacks and ensures threat protection."
  - type: "component"
    name: "Tenant Metadata Lookup Component"
    technology: "Go"
    description: "Performs tenant metadata lookups to support isolation and compliance."
