level: component
scope: "Component diagram for the PWA Client Container container"
parentContainer:
  name: "PWA Client Container"
elements:
  - type: "component"
    name: "UI Component Layer"
    technology: "React, TypeScript"
    description: "Handles user interface components and interactions for clinical workflows."
  - type: "component"
    name: "Local Persistence Manager"
    technology: "IndexedDB"
    description: "Provides local storage for patient records with zero plaintext leakage."
  - type: "component"
    name: "State Management & Sync Engine"
    technology: "Service Workers"
    description: "Manages state and synchronization across offline and online modes."
  - type: "component"
    name: "Client-Side Cryptography Provider"
    technology: "Web Crypto API"
    description: "Enforces AES-compatible client-side payload encryption for HIPAA compliance."
  - type: "component"
    name: "Authentication & Session Manager"
    technology: "OpenID Connect, JWT"
    description: "Manages user authentication and session states securely."
  - type: "component"
    name: "Client Telemetry & Error Boundary Component"
    technology: "OpenTelemetry JavaScript SDK"
    description: "Captures performance traces and error logs for P95 latency monitoring."
  - type: "component"
    name: "API Client & Request Interceptor"
    technology: "Axios"
    description: "Handles outbound HTTP requests with interceptors and retry logic."
  - type: "component"
    name: "Client-Side Routing & View Manager"
    technology: "React Router"
    description: "Manages client-side routing and view transitions."
  - type: "component"
    name: "Offline Transaction Queue Manager"
    technology: "Transactional Outbox"
    description: "Manages transactions when offline for later synchronization."
  - type: "component"
    name: "Client-Side Push Notification & Real-Time Sync Coordinator"
    technology: "Web Push API, SSE"
    description: "Coordinates push notifications and real-time synchronization."
  - type: "component"
    name: "Client-Side Audit & Integrity Logger"
    technology: "Cryptographic Hashing"
    description: "Logs audit and integrity events client-side."
  - type: "container"
    name: "API Gateway Container"
    technology: "Envoy / API Gateway"
    description: "External API gateway handling inbound and outbound traffic."
  - type: "container"
    name: "Observability Collector Container"
    technology: "OpenTelemetry Collector"
    description: "Collects system metrics, traces, and error logs."
relationships:
  - source: "UI Component Layer"
    destination: "State Management & Sync Engine"
    description: "Interacts via reactive state streams"
  - source: "State Management & Sync Engine"
    destination: "Local Persistence Manager"
    description: "Communicates via asynchronous storage APIs"
  - source: "State Management & Sync Engine"
    destination: "API Gateway Container"
    description: "Service Worker intercepts requests and routes traffic via HTTPS"
  - source: "API Client & Request Interceptor"
    destination: "API Gateway Container"
    description: "Communicates via HTTPS"
  - source: "Client Telemetry & Error Boundary Component"
    destination: "Observability Collector Container"
    description: "Transmits metrics via HTTPS"