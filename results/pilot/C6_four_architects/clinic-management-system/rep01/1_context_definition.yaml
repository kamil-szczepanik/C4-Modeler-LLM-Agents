level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform that securely manages patient admissions, electronic medical records, scheduling, and billing for medium-sized hospitals and clinics with 99.99% high availability and compliance with HIPAA, GDPR, and 10-year data retention mandates."
elements:
  - type: "person"
    name: "Patients"
    description: "Patients who interact with the clinic for admissions, scheduling, and records."
  - type: "person"
    name: "Clinical Staff"
    description: "Medical professionals who manage electronic medical records and patient care."
  - type: "person"
    name: "Hospital Administrators"
    description: "Administrators who oversee operations, billing, and system management."
  - type: "externalSystem"
    name: "Global Traffic Manager (GTM)"
    description: "Manages global traffic routing across hybrid cloud environments."
  - type: "externalSystem"
    name: "API Gateway"
    description: "Handles incoming requests using OpenID Connect / OAuth 2.0 and MFA."
  - type: "externalSystem"
    name: "Compliance Archival Gateway & WORM Object Storage"
    description: "Manages cold storage writes and 10-year data retention mandates."
  - type: "externalSystem"
    name: "External Lab, Imaging, and HIE Systems"
    description: "External medical systems providing lab and imaging data."
  - type: "externalSystem"
    name: "Insurance Claim Processors & Payment Gateways"
    description: "External processors handling insurance claims and payments."
  - type: "externalSystem"
    name: "Notification Service & SIEM"
    description: "Handles notifications and security event monitoring."
relationships:
  - source: "Patients"
    destination: "API Gateway"
    description: "Interact with the system with MFA"
    technology: "HTTPS/TLS 1.3"
  - source: "Clinical Staff"
    destination: "API Gateway"
    description: "Interact with the system with MFA"
    technology: "HTTPS/TLS 1.3"
  - source: "Hospital Administrators"
    destination: "API Gateway"
    description: "Interact with the system with MFA"
    technology: "HTTPS/TLS 1.3"
  - source: "External Lab, Imaging, and HIE Systems"
    destination: "Clinic Management System"
    description: "Connect via RESTful APIs and webhook subscriptions"
    technology: "HL7 FHIR RESTful APIs over HTTPS"
  - source: "Insurance Claim Processors & Payment Gateways"
    destination: "Clinic Management System"
    description: "Integrate for claims and payments"
    technology: "TLS 1.3 tunnels and X12 EDI/HTTPS"
  - source: "Clinic Management System"
    destination: "Notification Service & SIEM"
    description: "Streams security telemetry"
    technology: "TLS-encrypted Syslog"
  - source: "Clinic Management System"
    destination: "Compliance Archival Gateway & WORM Object Storage"
    description: "Offloads cold storage writes"
    technology: "gRPC"