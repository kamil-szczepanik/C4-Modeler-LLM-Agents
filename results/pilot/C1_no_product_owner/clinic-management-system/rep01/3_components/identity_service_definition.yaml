level: component
scope: "Component diagram for the Identity Service container"
parentContainer:
  name: "Identity Service"
elements:
  - type: "component"
    name: "Authentication Engine"
    technology: "Keycloak"
    description: "Manages authentication, identity federation, and credential verification."
  - type: "component"
    name: "Authorization & Token Management Module"
    technology: "Keycloak, Redis & Infinispan"
    description: "Handles authorization, OAuth2/OIDC token issuance, and sub-millisecond token validation."
  - type: "component"
    name: "User Federation Provider"
    technology: "Keycloak"
    description: "Interoperates for staff credentials over LDAPS with enterprise LDAP directories."
relationships:
  - source: "Authentication Engine"
    destination: "Authorization & Token Management Module"
    description: "Passes authenticated identity context for token generation"
  - source: "User Federation Provider"
    destination: "Authentication Engine"
    description: "Validates staff credentials against external directories"