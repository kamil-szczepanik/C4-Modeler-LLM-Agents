level: component
scope: "Component diagram for the Primary Database & Tiered Storage container"
parentContainer:
  name: "Primary Database & Tiered Storage"
elements:
  - type: "component"
    name: "Patroni PostgreSQL Cluster"
    technology: "PostgreSQL, Patroni, PgBouncer"
    description: "Manages hot transactional data with synchronous replication and dynamic connection pooling for 99.99% uptime."
  - type: "component"
    name: "MinIO S3-compatible WORM storage"
    technology: "MinIO S3-Compatible Storage"
    description: "Provides Write-Once-Read-Many (WORM) object locking for 10-year compliance retention."
  - type: "component"
    name: "Data Proxy Component"
    technology: "Java / Custom Proxy"
    description: "Routes data access requests and enforces security policies between microservices and storage."
  - type: "component"
    name: "Data Lifecycle Service"
    technology: "Java / Spring Boot"
    description: "Manages data retention policies and moves data between hot storage and tiered cold storage."
relationships:
  - source: "Data Proxy Component"
    destination: "Patroni PostgreSQL Cluster"
    description: "Routes relational queries and transactions [TLS 1.3]"
  - source: "Data Lifecycle Service"
    destination: "MinIO S3-compatible WORM storage"
    description: "Archives compliance and long-term retention data [HTTPS / S3 API]"
  - source: "Patroni PostgreSQL Cluster"
    destination: "MinIO S3-compatible WORM storage"
    description: "Offloads historical data and backups"