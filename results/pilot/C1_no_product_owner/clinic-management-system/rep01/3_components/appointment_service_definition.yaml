level: component
scope: "Component diagram for the Appointment Service container"
parentContainer:
  name: "Appointment Service"
elements:
  - type: "component"
    name: "AppointmentController"
    technology: "HTTPS/mTLS REST endpoints, Spring Boot"
    description: "Handles incoming HTTPS/mTLS REST endpoints and JWT-based authorization."
  - type: "component"
    name: "SchedulingEngine"
    technology: "Spring Boot, Java"
    description: "Enforces business logic, resource clash checks, and conflict-free slot allocation."
  - type: "component"
    name: "CalendarIntegration"
    technology: "resilience4j circuit breakers"
    description: "Synchronizes with external provider calendars using resilience4j circuit breakers."
  - type: "component"
    name: "AppointmentRepository"
    technology: "Spring Data JPA, Hibernate Envers, PostgreSQL"
    description: "Manages data persistence, PostgreSQL interactions, and Hibernate Envers audit trails."
  - type: "component"
    name: "Redis Cluster"
    technology: "Redis, Redlock, TLS, AES-256"
    description: "Provides distributed locking with TLS encryption and AES-256 at rest."
  - type: "component"
    name: "Apache Kafka"
    technology: "Apache Kafka, JWE, Spring Cloud Stream"
    description: "Publishes encrypted AppointmentScheduled events using JWE and tokenized patient references."
relationships:
  - source: "API Gateway"
    destination: "AppointmentController"
    description: "Routes scheduling requests [HTTPS / mTLS (Istio)]"
  - source: "AppointmentController"
    destination: "Identity Service"
    description: "Validates JSON Web Tokens (JWT) locally"
  - source: "SchedulingEngine"
    destination: "Redis Cluster"
    description: "Executes distributed lock checks before writes [TLS]"
  - source: "SchedulingEngine"
    destination: "AppointmentRepository"
    description: "Queries and persists slot availability [JDBC / Spring Data JPA]"
  - source: "SchedulingEngine"
    destination: "Apache Kafka"
    description: "Publishes asynchronous domain events [Spring Cloud Stream]"