level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "WAF & Rate Limiting Engine"
    technology: "NGINX/Kong"
    description: "Protects against web attacks and enforces traffic limits."
  - type: "component"
    name: "JWT/OAuth2 Filters"
    technology: "NGINX/Kong Plugin / OAuth2"
    description: "Validates incoming tokens and handles authentication filters."
  - type: "component"
    name: "Routing Engine"
    technology: "NGINX/Kong Routing"
    description: "Routes external HTTPS/TLS 1.3 requests to internal microservices via mTLS."
relationships:
  - source: "WAF & Rate Limiting Engine"
    destination: "JWT/OAuth2 Filters"
    description: "Inspects and passes requests"
  - source: "JWT/OAuth2 Filters"
    destination: "Routing Engine"
    description: "Authorizes and forwards requests"