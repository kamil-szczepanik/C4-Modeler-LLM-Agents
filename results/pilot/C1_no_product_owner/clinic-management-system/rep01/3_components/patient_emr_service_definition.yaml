level: component
scope: "Component diagram for the Patient & EMR Service container"
parentContainer:
  name: "Patient & EMR Service"
elements:
  - type: "component"
    name: "Demographics Controller"
    technology: "Java / Spring Boot"
    description: "Manages patient registration and attribute-based access control."
  - type: "component"
    name: "EMR Document Manager"
    technology: "Java / Spring Boot"
    description: "Handles clinical data persistence, structured records, and blob storage."
  - type: "component"
    name: "Audit Interceptor"
    technology: "AspectJ and HSM"
    description: "Generates cryptographic, tamper-evident audit trails."
  - type: "component"
    name: "FHIR Resource Mapper"
    technology: "HAPI FHIR libraries"
    description: "Transforms domain models using HAPI FHIR libraries for interoperability."
  - type: "component"
    name: "Patroni PostgreSQL Cluster"
    technology: "PostgreSQL with Patroni"
    description: "Provides high-availability relational data storage."
  - type: "component"
    name: "S3-compatible Tiered Storage"
    technology: "AWS SDK v2 / S3"
    description: "Enforces 10-year WORM compliance for unstructured records."
relationships:
  - source: "API Gateway"
    destination: "Demographics Controller"
    description: "Routes client requests via HTTPS / mTLS (Istio)."
  - source: "API Gateway"
    destination: "EMR Document Manager"
    description: "Routes client requests via HTTPS / mTLS (Istio)."
  - source: "Demographics Controller"
    destination: "Keycloak"
    description: "Validates OAuth2/OIDC tokens and attribute-based access control."
  - source: "EMR Document Manager"
    destination: "PostgreSQL"
    description: "Executes transactional persistence via JDBC / HikariCP."
  - source: "EMR Document Manager"
    destination: "S3 Storage"
    description: "Streams unstructured clinical objects using AWS SDK v2 over HTTPS."
  - source: "Service"
    destination: "Apache Kafka"
    description: "Publishes asynchronous clinical events using transactional outbox patterns with SASL/SCRAM and JWE."