level: component
scope: "Component diagram for the Audit Logging Service container"
parentContainer:
  name: "Audit Logging Service"
elements:
  - type: "component"
    name: "Audit Log Ingestor"
    technology: "Spring WebFlux"
    description: "Reactive endpoint for capturing high-throughput security and compliance events."
  - type: "component"
    name: "Event Normalization Engine"
    technology: "Jackson"
    description: "Payload sanitizer and PII masker for normalizing event data."
  - type: "component"
    name: "Immutable Writer Component"
    technology: "Spring Data JDBC"
    description: "Append-only writer with cryptographic hash chaining for secure persistence."
  - type: "component"
    name: "Retention Policy Manager"
    technology: "Quartz Scheduler"
    description: "Job scheduling component for cold S3-compatible WORM storage tiering."
  - type: "component"
    name: "Compliance Export Facade"
    technology: "REST API"
    description: "Service providing authenticated and rate-limited endpoints for external regulatory auditors."
  - type: "component"
    name: "Apache Kafka"
    technology: "Apache Kafka"
    description: "Event broker for asynchronous log streams."
  - type: "component"
    name: "PostgreSQL & S3-compatible WORM Storage"
    technology: "PostgreSQL & S3 Storage"
    description: "Primary and cold tier storage backend."
relationships:
  - source: "Apache Kafka"
    destination: "Audit Log Ingestor"
    description: "Streams events via TCP using consumer groups with mutual TLS (mTLS)."
  - source: "Audit Log Ingestor"
    destination: "Event Normalization Engine"
    description: "Invokes via internal function calls."
  - source: "Event Normalization Engine"
    destination: "Immutable Writer Component"
    description: "Sends normalized payloads for secure persistence."
  - source: "Immutable Writer Component"
    destination: "PostgreSQL & S3-compatible WORM Storage"
    description: "Persists records to PostgreSQL via TLS with driver-level AES-256 encryption."
  - source: "Retention Policy Manager"
    destination: "PostgreSQL & S3-compatible WORM Storage"
    description: "Moves aged logs to S3-compatible WORM storage utilizing Object Lock in compliance mode."
  - source: "Compliance Export Facade"
    destination: "PostgreSQL & S3-compatible WORM Storage"
    description: "Queries archived records to serve external auditors."