level: component
scope: "Component diagram for the Billing Service container"
parentContainer:
  name: "Billing Service"
elements:
  - type: "component"
    name: "Spring MVC REST Controllers"
    technology: "Spring MVC REST Controllers"
    description: "Exposes REST endpoints for managing patient admissions, EMR, scheduling, and billing."
  - type: "component"
    name: "Claim Processing Engine"
    technology: "Spring Boot / Java"
    description: "Evaluates business rules and processes financial and insurance claims."
  - type: "component"
    name: "Payment Gateway Adapter"
    technology: "Spring Boot / Java"
    description: "Adapts and communicates with external payment gateways."
  - type: "component"
    name: "Apache Camel"
    technology: "Embedded X12 EDI Mapping Component"
    description: "Performs X12 EDI formatting, schema validation, and maps claims for insurance gateways."
  - type: "component"
    name: "Spring Data JPA"
    technology: "Spring Data JPA with PostgreSQL and Flyway"
    description: "Persists financial data and manages database migrations securely."
  - type: "component"
    name: "Spring Cloud Stream & Apache Kafka"
    technology: "Spring Cloud Stream & Apache Kafka"
    description: "Publishes and consumes asynchronous events for decoupled invoice workflows."
  - type: "component"
    name: "Resilience4j"
    technology: "Resilience4j Circuit Breakers"
    description: "Provides circuit breakers for fault-tolerant external gateway communication."
  - type: "component"
    name: "Spring Security Filter Chain"
    technology: "Spring Security (OAuth2/RBAC)"
    description: "Enforces token-based RBAC and filter-chain input sanitization."
relationships:
  - source: "Spring MVC REST Controllers"
    destination: "Claim Processing Engine"
    description: "Invokes business rule evaluation via internal application events"
  - source: "Claim Processing Engine"
    destination: "Spring Cloud Stream & Apache Kafka"
    description: "Publishes and consumes asynchronous events via Spring Cloud Stream"
  - source: "Claim Processing Engine"
    destination: "Spring Data JPA"
    description: "Persists financial data using Spring Data JPA with column-level AES-256 encryption"
  - source: "Apache Camel"
    destination: "Payment Gateway Adapter"
    description: "Submits X12 EDI claims over HTTPS with mTLS and certificate pinning"
  - source: "Spring Security Filter Chain"
    destination: "Spring MVC REST Controllers"
    description: "Secures and sanitizes incoming HTTP requests"