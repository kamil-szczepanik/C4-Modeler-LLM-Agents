level: component
scope: "Component diagram for the HL7 FHIR Integration Engine container"
parentContainer:
  name: "HL7 FHIR Integration Engine"
elements:
  - type: "component"
    name: "FHIR Route Orchestrator"
    technology: "Apache Camel"
    description: "Orchestrates routes and message flows for clinical data within the integration engine."
  - type: "component"
    name: "Data Transformation Processor"
    technology: "HAPI FHIR"
    description: "Parses and transforms clinical data structures using HAPI FHIR libraries."
  - type: "component"
    name: "Validation & Compliance Interceptor"
    technology: "Java / Apache Camel Interceptor"
    description: "Validates messages against strict healthcare compliance and regulatory standards."
  - type: "component"
    name: "External Protocol Adapter"
    technology: "Apache Camel"
    description: "Adapts external protocols for secure communication with external healthcare systems."
relationships:
  - source: "FHIR Route Orchestrator"
    destination: "Data Transformation Processor"
    description: "Delegates parsing and transformation via [Java method invocation]"
  - source: "FHIR Route Orchestrator"
    destination: "Validation & Compliance Interceptor"
    description: "Passes messages for compliance checks via [Interceptor chain]"
  - source: "External Protocol Adapter"
    destination: "FHIR Route Orchestrator"
    description: "Forwards ingested messages via [Internal Camel routing]"