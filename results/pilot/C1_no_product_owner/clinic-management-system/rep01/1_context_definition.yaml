level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "Manages patient admissions, EMRs, scheduling, and billing for clinical IT environments with HIPAA/GDPR compliance, 99.99% availability, and 10-year data retention."
elements:
  - type: "person"
    name: "Patients & Clinic Staff"
    description: "Users who interact with the clinic management system for admissions, EMRs, scheduling, and clinical operations."
  - type: "externalSystem"
    name: "External Labs & Imaging Systems"
    description: "External systems that integrate with the CMS to provide laboratory and medical imaging data."
  - type: "externalSystem"
    name: "Third-Party Insurance Gateways"
    description: "External systems used for processing billing and claim submissions via messaging."
  - type: "container"
    name: "API Gateway with NGINX Ingress"
    description: "Edge routing, rate-limiting, and TLS termination for incoming requests."
    technology: "NGINX Ingress"
  - type: "container"
    name: "Internal Microservices"
    description: "Core business logic communicating via gRPC."
    technology: "gRPC"
  - type: "container"
    name: "PostgreSQL Databases & Apache Kafka"
    description: "Primary persistence layer and asynchronous message queuing for resilient billing and claims."
    technology: "PostgreSQL, Apache Kafka"
  - type: "container"
    name: "Local-First Envoy Sidecars & Caching Layers"
    description: "Local-first caching and resilience during WAN outages."
    technology: "Envoy"
relationships:
  - source: "Patients & Clinic Staff"
    destination: "Clinic Management System"
    description: "Interact with API Gateway via HTTPS using OAuth 2.0 / OIDC"
    technology: "HTTPS (OAuth 2.0 / OIDC)"
  - source: "External Labs & Imaging Systems"
    destination: "Clinic Management System"
    description: "Interact with CMS via HL7 FHIR over mutual TLS"
    technology: "HL7 FHIR over mTLS"
  - source: "Third-Party Insurance Gateways"
    destination: "Clinic Management System"
    description: "Interact via Apache Kafka over TLS 1.3"
    technology: "Apache Kafka over TLS 1.3"
  - source: "Internal Microservices"
    destination: "Internal Microservices"
    description: "Communicate via gRPC over mTLS protected by service mesh"
    technology: "gRPC over mTLS"