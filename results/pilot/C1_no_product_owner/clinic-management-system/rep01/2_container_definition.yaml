level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients & Clinic Staff"
    description: "Users who interact with the clinic management system for admissions, EMRs, scheduling, and clinical operations."
  - type: "externalSystem"
    name: "External Labs, Imaging Systems, & Third-Party Insurance Gateways"
    description: "External systems that integrate with the CMS to provide laboratory and medical imaging data, as well as process billing and claim submissions."
  - type: "container"
    name: "API Gateway"
    technology: "NGINX/Kong"
    description: "Edge routing, rate-limiting, and TLS termination for incoming requests."
  - type: "container"
    name: "Identity Service"
    technology: "Keycloak"
    description: "Manages user authentication, authorization, OAuth2/OIDC, and identity federation."
  - type: "container"
    name: "Patient & EMR Service"
    technology: "Spring Boot container"
    description: "Manages patient records, admissions, and electronic medical records."
  - type: "container"
    name: "Appointment Service"
    technology: "Spring Boot container"
    description: "Handles scheduling and management of clinical appointments."
  - type: "container"
    name: "Billing Service"
    technology: "Spring Boot container"
    description: "Manages billing, invoicing, and interactions with insurance gateways."
  - type: "container"
    name: "HL7 FHIR Integration Engine"
    technology: "Apache Camel"
    description: "Integrates with external labs and imaging systems using HL7 FHIR APIs."
  - type: "container"
    name: "Event Broker"
    technology: "Apache Kafka"
    description: "Facilitates asynchronous event-driven messaging across microservices."
  - type: "container"
    name: "Primary Database & Tiered Storage"
    technology: "PostgreSQL & S3-compatible WORM storage"
    description: "Provides primary data persistence and secure, compliant long-term storage."
  - type: "container"
    name: "Audit Logging Service"
    technology: "Java / Spring Boot"
    description: "Captures and stores audit logs for compliance and security monitoring."
relationships:
  - source: "Patients & Clinic Staff"
    destination: "API Gateway"
    description: "Accesses system features and application endpoints"
    technology: "HTTPS/TLS 1.3"
  - source: "API Gateway"
    destination: "Patient & EMR Service"
    description: "Routes client requests to microservices"
    technology: "HTTPS / mTLS (Istio)"
  - source: "API Gateway"
    destination: "Appointment Service"
    description: "Routes scheduling requests"
    technology: "HTTPS / mTLS (Istio)"
  - source: "API Gateway"
    destination: "Billing Service"
    description: "Routes billing requests"
    technology: "HTTPS / mTLS (Istio)"
  - source: "Patient & EMR Service"
    destination: "Identity Service"
    description: "Authenticates and authorizes requests"
    technology: "OAuth2/OIDC and mTLS (Istio)"
  - source: "Appointment Service"
    destination: "Identity Service"
    description: "Authenticates and authorizes requests"
    technology: "OAuth2/OIDC and mTLS (Istio)"
  - source: "Billing Service"
    destination: "Identity Service"
    description: "Authenticates and authorizes requests"
    technology: "OAuth2/OIDC and mTLS (Istio)"
  - source: "Patient & EMR Service"
    destination: "Event Broker"
    description: "Publishes and consumes asynchronous clinical events"
    technology: "SASL/SCRAM"
  - source: "HL7 FHIR Integration Engine"
    destination: "External Labs, Imaging Systems, & Third-Party Insurance Gateways"
    description: "Exchanges clinical data with external systems"
    technology: "HL7 FHIR APIs"
  - source: "Billing Service"
    destination: "External Labs, Imaging Systems, & Third-Party Insurance Gateways"
    description: "Submits billing claims and insurance transactions"
    technology: "HTTPS"
  - source: "Patient & EMR Service"
    destination: "Primary Database & Tiered Storage"
    description: "Reads and writes clinical data"
    technology: "PostgreSQL / Patroni / S3"
  - source: "Billing Service"
    destination: "Primary Database & Tiered Storage"
    description: "Reads and writes billing data"
    technology: "PostgreSQL / S3"