level: component
scope: "Component diagram for the Background Worker Pools container"
parentContainer:
  name: "Background Worker Pools"
elements:
  - type: "component"
    name: "Background Worker Nodes"
    technology: "Kubernetes, Pluggable Job Handler Architecture"
    description: "Manages asynchronous tasks, decoupling heavy administrative and clinical processes from user-facing paths while executing workloads reliably."
  - type: "component"
    name: "Message Brokers"
    technology: "Persistent Message Queues with Dead-Letter Routing"
    description: "Provides persistent message queues with dead-letter routing for asynchronous task processing."
  - type: "component"
    name: "External Third-Party Billing Gateways & Lab Systems"
    technology: "HTTPS with Circuit Breakers"
    description: "External systems for third-party billing and lab integrations."
  - type: "component"
    name: "Core Microservices"
    technology: "Transactional Outbox Patterns, Strongly Typed Payload Contracts"
    description: "Core services including EMR, Billing, Scheduling, and Registration interacting via transactional outbox patterns."
  - type: "component"
    name: "Centralized Job Monitoring Dashboard"
    technology: "Dashboard and Metrics Reporting"
    description: "Monitors job execution and reports metrics for asynchronous workloads."
relationships:
  - source: "Background Worker Nodes"
    destination: "Message Brokers"
    description: "Consumes tasks from Message Brokers via persistent message queues"
  - source: "Background Worker Nodes"
    destination: "External Third-Party Billing Gateways & Lab Systems"
    description: "Communicates with External Third-Party Billing Gateways & Lab Systems via HTTPS with circuit breakers"
  - source: "Background Worker Nodes"
    destination: "Core Microservices"
    description: "Interacts with Core Microservices using transactional outbox patterns and strongly typed payload contracts"
  - source: "Background Worker Nodes"
    destination: "Centralized Job Monitoring Dashboard"
    description: "Reports metrics to the Centralized Job Monitoring Dashboard"