level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Proxy"
    technology: "Stateless edge proxy deployed on on-prem-k8s and eu-central-1"
    description: "Routes external traffic and terminates secure client traffic at the edge with TLS 1.3."
  - type: "component"
    name: "Routing and Validation Engine"
    technology: "OpenAPI, GitOps"
    description: "Enforces declarative infrastructure routing and strict contract validation at the edge."
relationships:
  - source: "Edge Proxy"
    destination: "Routing and Validation Engine"
    description: "Validates and routes requests [HTTPS, MFA]"