level: component
scope: "Component diagram for the Billing Service container"
parentContainer:
  name: "Billing Service"
elements:
  - type: "component"
    name: "Outbox Processor"
    technology: "Outbox Pattern / Idempotent API Handlers"
    description: "Ensures reliable financial transaction processing without duplicates."
  - type: "component"
    name: "Saga Orchestrator"
    technology: "Saga Pattern"
    description: "Manages distributed transaction consistency across complex workflows."
  - type: "component"
    name: "Resilience Handler"
    technology: "Circuit Breakers and Bulkhead Isolation"
    description: "Prevents cascading failures and isolates real-time copays from batch claims."
  - type: "component"
    name: "Audit Logger"
    technology: "Event-Sourcing and Immutable Append-Only Logs"
    description: "Satisfies 10-year data retention and strict auditability mandates."
  - type: "component"
    name: "Anti-Corruption Layer"
    technology: "Adapter / ACL"
    description: "Isolates external insurance protocol changes from core domain logic."
relationships:
  - source: "Outbox Processor"
    destination: "Saga Orchestrator"
    description: "Triggers distributed workflow events"
  - source: "Saga Orchestrator"
    destination: "Resilience Handler"
    description: "Executes calls through resilient boundaries"
  - source: "Resilience Handler"
    destination: "Anti-Corruption Layer"
    description: "Communicates with external systems safely"
  - source: "Audit Logger"
    destination: "Outbox Processor"
    description: "Records immutable transaction events"