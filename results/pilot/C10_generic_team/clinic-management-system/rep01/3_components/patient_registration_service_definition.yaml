level: component
scope: "Component diagram for the Patient Registration Service container"
parentContainer:
  name: "Patient Registration Service"
elements:
  - type: "component"
    name: "Patient Registration Controller"
    technology: "REST/gRPC, OpenAPI"
    description: "Handles incoming patient admission requests and API Gateway traffic."
  - type: "component"
    name: "Patient Domain Service"
    technology: "Java, Domain-Driven Design, CQRS"
    description: "Implements business logic for patient registration, validation, and management."
  - type: "component"
    name: "Patient Data Access Repository"
    technology: "JDBC, TLS"
    description: "Manages persistence and retrieval of patient records with PostgreSQL."
  - type: "component"
    name: "Registration Event Publisher"
    technology: "AMQP, TCP"
    description: "Publishes patient registration events to persistent message queues."
relationships:
  - source: "Patient Registration Controller"
    destination: "Patient Domain Service"
    description: "Delegates business logic requests"
  - source: "Patient Domain Service"
    destination: "Patient Data Access Repository"
    description: "Reads and writes transactional patient data"
  - source: "Patient Domain Service"
    destination: "Registration Event Publisher"
    description: "Sends asynchronous domain events"