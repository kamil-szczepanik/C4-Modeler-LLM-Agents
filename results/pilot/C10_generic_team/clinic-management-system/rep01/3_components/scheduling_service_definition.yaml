level: component
scope: "Component diagram for the Scheduling Service container"
parentContainer:
  name: "Scheduling Service"
elements:
  - type: "component"
    name: "Booking Controller"
    technology: "Microservice REST/gRPC"
    description: "Handles incoming booking requests routed from the API Gateway."
  - type: "component"
    name: "Reservation Manager"
    technology: "Domain-Driven Design Domain Model"
    description: "Queries and manages time-slot reservations using distributed locks."
  - type: "component"
    name: "Event Publisher"
    technology: "Persistent Message Queues / Saga Pattern"
    description: "Publishes asynchronous state change events to message brokers."
  - type: "component"
    name: "Audit Logger"
    technology: "Secure Stream"
    description: "Streams immutable audit logs asynchronously to WORM storage."
relationships:
  - source: "Booking Controller"
    destination: "Reservation Manager"
    description: "Delegates time-slot reservation logic [Internal Function Call]"
  - source: "Reservation Manager"
    destination: "Event Publisher"
    description: "Triggers state change events [Saga Pattern]"
  - source: "Reservation Manager"
    destination: "Audit Logger"
    description: "Generates audit trail for reservation actions [Secure Stream]"