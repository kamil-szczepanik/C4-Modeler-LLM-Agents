level: component
scope: "Component diagram for the EMR Service container"
parentContainer:
  name: "EMR Service"
elements:
  - type: "component"
    name: "EMR API Controller"
    technology: "Microservice / REST, gRPC"
    description: "Handles incoming routing requests from the API Gateway and exposes endpoints for clinical records."
  - type: "component"
    name: "CQRS Command/Query Handler"
    technology: "CQRS Pattern"
    description: "Separates read and write operations on patient records for performance optimization."
  - type: "component"
    name: "ABAC Enforcement Engine"
    technology: "Attribute-Based Access Control"
    description: "Enforces strict HIPAA/GDPR compliance and access control policies for patient data."
  - type: "component"
    name: "FHIR Interoperability Adapter"
    technology: "HL7 FHIR"
    description: "Serializes and deserializes data for seamless interoperability with external labs and imaging systems."
relationships:
  - source: "EMR API Controller"
    destination: "CQRS Command/Query Handler"
    description: "Delegates read and write operations"
  - source: "CQRS Command/Query Handler"
    destination: "ABAC Enforcement Engine"
    description: "Validates access permissions for data operations"
  - source: "CQRS Command/Query Handler"
    destination: "FHIR Interoperability Adapter"
    description: "Transforms clinical data to standardized formats"