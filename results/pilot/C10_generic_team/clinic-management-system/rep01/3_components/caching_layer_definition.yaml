level: component
scope: "Component diagram for the Caching Layer container"
parentContainer:
  name: "Caching Layer"
elements:
  - type: "component"
    name: "Redis Primary-Replica Store"
    technology: "Redis with Redis Sentinel/Cluster"
    description: "In-memory store with LRU eviction and memory-wiping mechanisms providing low latency and high availability."
  - type: "component"
    name: "Access Control Layer (ACL)"
    technology: "Redis ACL"
    description: "Restricts key-spaces to ensure strict HIPAA and GDPR compliance regulations."
  - type: "component"
    name: "Event Invalidation Listener"
    technology: "AMQP/Kafka Client"
    description: "Receives asynchronous event-driven invalidation signals from the message broker."
relationships:
  - source: "Event Invalidation Listener"
    destination: "Redis Primary-Replica Store"
    description: "Triggers cache invalidation upon receiving events [In-memory Redis Protocol over TLS 1.3]"