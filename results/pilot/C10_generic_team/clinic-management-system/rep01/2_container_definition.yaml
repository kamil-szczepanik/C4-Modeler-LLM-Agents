level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Clinical Staff"
    description: "Medical professionals who access patient records, manage admissions, and provide care."
  - type: "person"
    name: "Administrative Staff"
    description: "Staff responsible for scheduling, billing, and clinic operations."
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who access their personal health records and appointments."
  - type: "externalSystem"
    name: "External Labs and Imaging Systems"
    description: "External systems providing lab results and medical imaging data via HL7 FHIR APIs."
  - type: "externalSystem"
    name: "Third-Party Billing/Insurance Gateways"
    description: "External systems handling payment processing and insurance claims."
  - type: "container"
    name: "API Gateway"
    technology: "HTTPS, TLS 1.3, OpenAPI"
    description: "Routes internal and external traffic to downstream microservices and handles security."
  - type: "container"
    name: "EMR Service"
    technology: "Microservice, HL7 FHIR"
    description: "Manages electronic medical records and clinical workflows."
  - type: "container"
    name: "Scheduling Service"
    technology: "Microservice"
    description: "Handles patient appointments and calendar management."
  - type: "container"
    name: "Billing Service"
    technology: "Microservice"
    description: "Processes financial transactions, invoicing, and third-party insurance gateways."
  - type: "container"
    name: "Patient Registration Service"
    technology: "Microservice"
    description: "Manages patient admissions and profile onboarding."
  - type: "container"
    name: "Background Worker Pools"
    technology: "Asynchronous Worker Nodes"
    description: "Handles asynchronous tasks and persistent queue processing."
  - type: "container"
    name: "Caching Layer"
    technology: "Redis"
    description: "Provides high-performance caching for low-latency EMR load requirements."
  - type: "container"
    name: "Message Brokers"
    technology: "Persistent Message Queues with Dead-Letter Routing"
    description: "Facilitates asynchronous event-driven communication between services."
relationships:
  - source: "Clinical Staff"
    destination: "API Gateway"
    description: "Access system features via HTTPS with Multi-Factor Authentication"
    technology: "HTTPS, MFA"
  - source: "Administrative Staff"
    destination: "API Gateway"
    description: "Access administrative and scheduling features via HTTPS with MFA"
    technology: "HTTPS, MFA"
  - source: "Patients"
    destination: "API Gateway"
    description: "Access personal health records and appointments via HTTPS with MFA"
    technology: "HTTPS, MFA"
  - source: "API Gateway"
    destination: "EMR Service"
    description: "Routes requests to EMR container"
    technology: "REST, gRPC over TLS"
  - source: "API Gateway"
    destination: "Scheduling Service"
    description: "Routes requests to Scheduling container"
    technology: "REST, gRPC over TLS"
  - source: "API Gateway"
    destination: "Billing Service"
    description: "Routes requests to Billing container"
    technology: "REST, gRPC over TLS"
  - source: "API Gateway"
    destination: "Patient Registration Service"
    description: "Routes requests to Registration container"
    technology: "REST, gRPC over TLS"
  - source: "API Gateway"
    destination: "External Labs and Imaging Systems"
    description: "Integrates external clinical data and imaging systems"
    technology: "HL7 FHIR APIs"
  - source: "EMR Service"
    destination: "Caching Layer"
    description: "Queries caching layer for performance optimization"
    technology: "In-memory Redis Protocol"
  - source: "Scheduling Service"
    destination: "Caching Layer"
    description: "Queries caching layer for performance optimization"
    technology: "In-memory Redis Protocol"
  - source: "Billing Service"
    destination: "Third-Party Billing/Insurance Gateways"
    description: "Interacts with external billing and insurance gateways"
    technology: "HTTPS, REST"
  - source: "EMR Service"
    destination: "Message Brokers"
    description: "Communicates asynchronously with other services"
    technology: "Persistent Queues"
  - source: "Scheduling Service"
    destination: "Message Brokers"
    description: "Communicates asynchronously with other services"
    technology: "Persistent Queues"
  - source: "Billing Service"
    destination: "Message Brokers"
    description: "Communicates asynchronously with other services"
    technology: "Persistent Queues"
  - source: "Patient Registration Service"
    destination: "Message Brokers"
    description: "Communicates asynchronously with other services"
    technology: "Persistent Queues"