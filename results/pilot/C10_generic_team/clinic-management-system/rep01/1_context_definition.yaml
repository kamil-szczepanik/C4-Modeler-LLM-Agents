level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid-cloud healthcare platform designed to manage patient admissions, electronic medical records, scheduling, and billing for medium-sized hospitals and clinics while enforcing HIPAA and GDPR compliance."
elements:
  - type: "person"
    name: "Clinical Staff"
    description: "Medical professionals who access patient records, manage admissions, and provide care."
  - type: "person"
    name: "Administrative Staff"
    description: "Staff responsible for scheduling, billing, and clinic operations."
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who access their personal health records and appointments."
  - type: "externalSystem"
    name: "External Labs/Imaging Systems"
    description: "External systems providing lab results and medical imaging data via HL7 FHIR APIs."
  - type: "externalSystem"
    name: "Third-Party Billing/Insurance Gateways"
    description: "External systems handling payment processing and insurance claims."
  - type: "container"
    name: "API Gateway"
    description: "Routes internal and external traffic to downstream microservices."
    technology: "HTTPS (TLS 1.3), REST, gRPC"
  - type: "container"
    name: "EMR Service"
    description: "Manages electronic medical records and integrates with external labs and imaging."
    technology: "Microservice, HL7 FHIR"
  - type: "container"
    name: "Scheduling Service"
    description: "Handles patient appointments and calendar management."
    technology: "Microservice"
  - type: "container"
    name: "Billing Service"
    description: "Processes financial transactions and insurance gateways."
    technology: "Microservice"
  - type: "container"
    name: "Patient Registration Service"
    description: "Handles patient admissions and profile onboarding."
    technology: "Microservice"
  - type: "container"
    name: "Message Queue/Event Bus"
    description: "Facilitates asynchronous event-driven communication between services."
    technology: "Message Bus"
  - type: "component"
    name: "Read Replicas"
    description: "Provides scalable read operations for PostgreSQL databases."
    technology: "PostgreSQL"
  - type: "component"
    name: "Caching Layer"
    description: "Accelerates data retrieval and reduces database load."
    technology: "In-memory Cache"
  - type: "component"
    name: "FHIR Adapter"
    description: "Translates clinical data to HL7 FHIR standards for external systems."
    technology: "HL7 FHIR"
  - type: "component"
    name: "Immutable Audit Logger"
    description: "Records cryptographic audit logs for HIPAA and GDPR compliance."
    technology: "Security Component"
  - type: "component"
    name: "ABAC Security Engine"
    description: "Enforces Attribute-Based Access Control policies."
    technology: "ABAC"
relationships:
  - source: "Clinical Staff"
    destination: "API Gateway"
    description: "Access front-end applications with Multi-Factor Authentication"
    technology: "HTTPS (TLS 1.3), MFA"
  - source: "Administrative Staff"
    destination: "API Gateway"
    description: "Manage scheduling, billing, and administrative workflows"
    technology: "HTTPS (TLS 1.3), MFA"
  - source: "Patients"
    destination: "API Gateway"
    description: "Access personal health records and schedule appointments"
    technology: "HTTPS (TLS 1.3), MFA"
  - source: "API Gateway"
    destination: "EMR Service"
    description: "Routes internal traffic"
    technology: "gRPC and REST over TLS"
  - source: "API Gateway"
    destination: "Scheduling Service"
    description: "Routes internal traffic"
    technology: "gRPC and REST over TLS"
  - source: "API Gateway"
    destination: "Billing Service"
    description: "Routes internal traffic"
    technology: "gRPC and REST over TLS"
  - source: "EMR Service"
    destination: "External Labs/Imaging Systems"
    description: "Integrates clinical data and imaging results"
    technology: "HL7 FHIR APIs over HTTPS"