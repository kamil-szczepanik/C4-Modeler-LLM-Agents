level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform managing patient registrations, electronic medical records, scheduling, and billing for medium-sized hospitals and clinics, ensuring strict HIPAA and GDPR compliance."
elements:
  - type: "person"
    name: "Front Desk Administrator"
    description: "Manages patient registrations, check-ins, and front desk workflows."
  - type: "person"
    name: "Clinician"
    description: "Accesses and updates electronic medical records and clinical schedules."
  - type: "person"
    name: "Billing Specialist"
    description: "Manages billing, claims, and financial transactions."
  - type: "person"
    name: "Patient"
    description: "Interacts with the patient portal for appointments and health records."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing lab results and medical imaging via HL7 FHIR APIs."
relationships:
  - source: "Front Desk Administrator"
    destination: "Clinic Management System"
    description: "Interacts with web client for administrative workflows"
    technology: "HTTPS (TLS 1.3)"
  - source: "Clinician"
    destination: "Clinic Management System"
    description: "Interacts with web client for clinical workflows and EMR"
    technology: "HTTPS (TLS 1.3)"
  - source: "Billing Specialist"
    destination: "Clinic Management System"
    description: "Interacts with web client for billing and claims"
    technology: "HTTPS (TLS 1.3)"
  - source: "Patient"
    destination: "Clinic Management System"
    description: "Interacts with patient portal for appointments and records"
    technology: "HTTPS (TLS 1.3)"
  - source: "External Lab & Imaging Systems"
    destination: "Clinic Management System"
    description: "Exchanges lab and imaging data"
    technology: "HL7 FHIR APIs over mTLS"