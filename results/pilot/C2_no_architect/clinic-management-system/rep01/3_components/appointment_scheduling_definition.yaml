level: component
scope: "Component diagram for the Appointment Scheduling container"
parentContainer:
  name: "Appointment Scheduling"
elements:
  - type: "component"
    name: "Appointment Controller"
    technology: "REST / gRPC"
    description: "Handles incoming appointment booking and viewing requests from the Patient Portal and administrative users."
  - type: "component"
    name: "Appointment Service"
    technology: "Microservice Logic"
    description: "Manages business rules for scheduling, updating, and linking appointments to medical records."
  - type: "component"
    name: "Calendar Integration Engine"
    technology: "mTLS / gRPC"
    description: "Synchronizes clinician schedules and links appointment entries to the EMR container."
relationships:
  - source: "Appointment Controller"
    destination: "Appointment Service"
    description: "Validates and routes requests"
  - source: "Appointment Service"
    destination: "Calendar Integration Engine"
    description: "Links appointments to patient records"