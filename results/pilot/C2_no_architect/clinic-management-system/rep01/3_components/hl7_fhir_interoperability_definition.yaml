level: component
scope: "Component diagram for the HL7 FHIR Interoperability container"
parentContainer:
  name: "HL7 FHIR Interoperability"
elements:
  - type: "component"
    name: "FHIR API Gateway"
    technology: "API Gateway / REST / mTLS"
    description: "Handles incoming and outgoing HL7 FHIR requests from external lab systems and internal services."
  - type: "component"
    name: "Data Ingestion Service"
    technology: "gRPC / Kafka"
    description: "Processes and standardizes incoming lab and imaging results for consumption by the EMR."
relationships:
  - source: "FHIR API Gateway"
    destination: "Data Ingestion Service"
    description: "Routes validated lab and imaging payloads [gRPC / REST via mTLS]"