level: component
scope: "Component diagram for the Patient Registration container"
parentContainer:
  name: "Patient Registration"
elements:
  - type: "component"
    name: "Registration API Controller"
    technology: "Kubernetes container, REST API"
    description: "Handles incoming HTTP requests from the Front Desk Administrator and Patient Portal for patient admissions, intake, and demographics."
  - type: "component"
    name: "Registration Service"
    technology: "Business Logic Engine"
    description: "Processes patient registration logic and coordinates updates with downstream EMR systems."
relationships:
  - source: "Registration API Controller"
    destination: "Registration Service"
    description: "Invokes business logic for intake processing"