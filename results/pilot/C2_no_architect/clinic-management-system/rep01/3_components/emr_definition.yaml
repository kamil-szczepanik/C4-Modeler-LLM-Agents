level: component
scope: "Component diagram for the EMR container"
parentContainer:
  name: "EMR"
elements:
  - type: "component"
    name: "Medical Records Management Engine"
    technology: "Kubernetes Container, Encrypted Distributed Storage with NVMe & Tiered Object Storage"
    description: "Manages the creation, updating, and secure storage of electronic medical records with active-active multi-master replication, AES-256 storage-at-rest, and field-level encryption."
  - type: "component"
    name: "Clinician Access Interface"
    technology: "HTTPS (TLS 1.3), OAuth2/OIDC MFA"
    description: "Handles secure clinician authentication and authorization for viewing and updating medical records."
  - type: "component"
    name: "Internal Integration Receiver"
    technology: "gRPC / REST via mTLS (SPIFFE/SPIRE)"
    description: "Processes incoming requests from Patient Registration, Appointment Scheduling, Billing & Claims, and HL7 FHIR Interoperability containers."
relationships:
  - source: "Clinician"
    destination: "Clinician Access Interface"
    description: "Views and updates medical records via HTTPS (TLS 1.3) with OAuth2/OIDC MFA"
  - source: "Patient Registration"
    destination: "Internal Integration Receiver"
    description: "Creates and updates patient records via gRPC / REST via mTLS (SPIFFE/SPIRE)"
  - source: "Appointment Scheduling"
    destination: "Internal Integration Receiver"
    description: "Links appointments to patient records via gRPC / REST via mTLS"
  - source: "Billing & Claims"
    destination: "Internal Integration Receiver"
    description: "Accesses clinical encounter data via gRPC / REST via mTLS"
  - source: "HL7 FHIR Interoperability"
    destination: "Internal Integration Receiver"
    description: "Ingests lab and imaging results via gRPC / REST via mTLS"
  - source: "Medical Records Management Engine"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges data using HL7 FHIR APIs"