# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Front Desk Administrator"
    description: "Manages patient admissions and front desk workflows."
  - type: "person"
    name: "Clinician"
    description: "Accesses EMRs and manages clinical schedules."
  - type: "person"
    name: "Billing Specialist"
    description: "Manages billing, claims, and financial workflows."
  - type: "person"
    name: "Patient"
    description: "Interacts with the patient portal for appointments and records."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing lab results and medical imaging."
  - type: "container"
    name: "Patient Registration"
    technology: "Kubernetes, REST API"
    description: "Manages patient admissions and registration workflows."
  - type: "container"
    name: "Appointment Scheduling"
    technology: "Kubernetes, REST API"
    description: "Handles scheduling for clinical appointments."
  - type: "container"
    name: "EMR"
    technology: "Kubernetes, Encrypted Distributed Storage"
    description: "Manages electronic medical records securely."
  - type: "container"
    name: "Billing & Claims"
    technology: "Kubernetes, Encrypted Distributed Storage"
    description: "Manages billing, financial workloads, and insurance claims."
  - type: "container"
    name: "HL7 FHIR Interoperability"
    technology: "Kubernetes, HL7 FHIR APIs"
    description: "Integrates with external lab and imaging systems."
  - type: "container"
    name: "Patient Portal"
    technology: "Kubernetes, REST API"
    description: "Provides patients access to appointments and health records."
relationships:
  - source: "Front Desk Administrator"
    destination: "Patient Registration"
    description: "Accesses via web interface for admissions"
    technology: "HTTPS (TLS 1.3), OAuth2/OIDC MFA"
  - source: "Front Desk Administrator"
    destination: "Appointment Scheduling"
    description: "Manages appointments"
    technology: "HTTPS (TLS 1.3), OAuth2/OIDC MFA"
  - source: "Clinician"
    destination: "EMR"
    description: "Views and updates medical records"
    technology: "HTTPS (TLS 1.3), OAuth2/OIDC MFA"
  - source: "Clinician"
    destination: "Appointment Scheduling"
    description: "Views clinical schedules"
    technology: "HTTPS (TLS 1.3), OAuth2/OIDC MFA"
  - source: "Billing Specialist"
    destination: "Billing & Claims"
    description: "Manages billing and claims"
    technology: "HTTPS (TLS 1.3), OAuth2/OIDC MFA"
  - source: "Patient"
    destination: "Patient Portal"
    description: "Views appointments and health records"
    technology: "HTTPS (TLS 1.3), OAuth2/OIDC MFA"
  - source: "HL7 FHIR Interoperability"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges lab and imaging data"
    technology: "HL7 FHIR APIs over mTLS"
  - source: "Patient Registration"
    destination: "EMR"
    description: "Creates and updates patient records"
    technology: "gRPC / REST via mTLS"
  - source: "Appointment Scheduling"
    destination: "EMR"
    description: "Links appointments to patient records"
    technology: "gRPC / REST via mTLS"
  - source: "Billing & Claims"
    destination: "EMR"
    description: "Accesses clinical encounter data for billing"
    technology: "gRPC / REST via mTLS"
  - source: "Patient Portal"
    destination: "Appointment Scheduling"
    description: "Books and views appointments"
    technology: "gRPC / REST via mTLS"
  - source: "HL7 FHIR Interoperability"
    destination: "EMR"
    description: "Ingests lab and imaging results"
    technology: "gRPC / REST via mTLS"