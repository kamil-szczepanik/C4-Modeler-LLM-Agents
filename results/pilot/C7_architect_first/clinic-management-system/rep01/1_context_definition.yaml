level: context
scope: "System Context diagram for Clinic Management System (CMS)"
system:
  name: "Clinic Management System (CMS)"
  description: "An enterprise software solution designed for medium-sized hospitals and clinics to manage patient admissions, electronic medical records, scheduling, and billing with high availability and stringent compliance."
elements:
  - type: "person"
    name: "Patients, Clinicians, and Billing Staff"
    description: "Users who interact with the system to manage patient admissions, records, scheduling, and billing."
  - type: "externalSystem"
    name: "External Payment Gateways & Insurance Clearinghouse"
    description: "External systems used to process copays and insurance claims."
  - type: "externalSystem"
    name: "Third-Party Lab and Imaging Systems"
    description: "External medical systems that exchange health data."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "System providing Multi-Factor Authentication and identity management."
  - type: "externalSystem"
    name: "External Notification Service"
    description: "SMS and Email providers used to dispatch alerts and MFA challenges."
relationships:
  - source: "Patients, Clinicians, and Billing Staff"
    destination: "Clinic Management System (CMS)"
    description: "Interacts to manage records, scheduling, and billing"
    technology: "HTTPS, OAuth 2.0 / OpenID Connect"
  - source: "Clinic Management System (CMS)"
    destination: "External Payment Gateways & Insurance Clearinghouse"
    description: "Processes copays and insurance claims"
    technology: "REST/TLS"
  - source: "Clinic Management System (CMS)"
    destination: "Third-Party Lab and Imaging Systems"
    description: "Exchanges health data"
    technology: "HL7 FHIR APIs over HTTPS"
  - source: "Clinic Management System (CMS)"
    destination: "External Notification Service"
    description: "Dispatches alerts and MFA challenges"
    technology: "SMPP and HTTPS"