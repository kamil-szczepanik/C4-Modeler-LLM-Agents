# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients, Clinicians, and Billing Staff"
    description: "Users who interact with the system to manage patient admissions, records, scheduling, and billing."
  - type: "externalSystem"
    name: "External Payment Gateways"
    description: "External systems used for processing payments."
  - type: "externalSystem"
    name: "Insurance Clearinghouses"
    description: "External systems used for managing insurance claims."
  - type: "externalSystem"
    name: "Lab and Imaging Systems"
    description: "External medical systems exchanging health data."
  - type: "container"
    name: "Next.js Single Page Application"
    technology: "Next.js / CDN"
    description: "Frontend container delivering sub-second P95 frontend screen loads."
  - type: "container"
    name: "Go API Gateway"
    technology: "Go"
    description: "Powers the API Gateway for high-performance request routing and rate limiting."
  - type: "container"
    name: "Java Spring Boot Microservices"
    technology: "Java Spring Boot"
    description: "Handles robust enterprise transactions for Patient, Scheduling, EMR, and Billing microservices."
  - type: "container"
    name: "Apache Camel K Integration Broker"
    technology: "Apache Camel K"
    description: "Manages isolated HL7 FHIR integrations and interoperability."
  - type: "container"
    name: "Apache Kafka"
    technology: "Apache Kafka"
    description: "Provides event streaming and immutable audit logs for 10-year retention."
  - type: "container"
    name: "Multi-master PostgreSQL Cluster and Redis Enterprise"
    technology: "PostgreSQL, Redis, AES-256"
    description: "Ensures multi-master active-active persistence and low-latency scheduling checks with encryption."
relationships:
  - source: "Patients, Clinicians, and Billing Staff"
    destination: "Next.js Single Page Application"
    description: "Interacts with the application to manage admissions, EMRs, scheduling, and billing"
    technology: "HTTPS/JSON"
  - source: "Next.js Single Page Application"
    destination: "Go API Gateway"
    description: "Routes frontend requests through the gateway"
    technology: "HTTPS/JSON"
  - source: "Go API Gateway"
    destination: "Java Spring Boot Microservices"
    description: "Routes requests to microservices"
    technology: "gRPC with mTLS"
  - source: "Java Spring Boot Microservices"
    destination: "Multi-master PostgreSQL Cluster and Redis Enterprise"
    description: "Reads and writes persistence and caching data"
    technology: "gRPC and SQL protocols"
  - source: "Java Spring Boot Microservices"
    destination: "Apache Kafka"
    description: "Publishes and consumes audit events and streams"
    technology: "TCP/TLS"
  - source: "Apache Camel K Integration Broker"
    destination: "Lab and Imaging Systems"
    description: "Exchanges health data with external medical systems"
    technology: "HL7 FHIR over HTTPS"
  - source: "Java Spring Boot Microservices"
    destination: "External Payment Gateways"
    description: "Processes payments and financial transactions"
    technology: "HTTPS"
  - source: "Java Spring Boot Microservices"
    destination: "Insurance Clearinghouses"
    description: "Submits and reconciles insurance claims"
    technology: "HTTPS"