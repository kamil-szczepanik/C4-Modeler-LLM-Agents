level: component
scope: "Component diagram for the Java Spring Boot Microservices container"
parentContainer:
  name: "Java Spring Boot Microservices"
elements:
  - type: "component"
    name: "PatientService"
    technology: "Java Spring Boot 3.2"
    description: "Manages patient admissions and demographic records."
  - type: "component"
    name: "SchedulingService"
    technology: "Java Spring Boot 3.2"
    description: "Handles appointment scheduling and clinician calendars."
  - type: "component"
    name: "EMRService"
    technology: "Java Spring Boot 3.2"
    description: "Manages Electronic Medical Records and HL7 FHIR interoperability."
  - type: "component"
    name: "BillingService"
    technology: "Java Spring Boot 3.2"
    description: "Processes financial transactions, insurance claims, and billing."
  - type: "component"
    name: "AuditService"
    technology: "Java Spring Boot 3.2"
    description: "Streams and logs audit events for HIPAA and GDPR compliance."
relationships:
  - source: "PatientService"
    destination: "Multi-master PostgreSQL Cluster"
    description: "Persists patient data via SQL protocols over TLS"
  - source: "SchedulingService"
    destination: "Multi-master PostgreSQL Cluster"
    description: "Persists appointment data via SQL protocols over TLS"
  - source: "EMRService"
    destination: "Redis Enterprise"
    description: "Caches EMR data via Lettuce to meet sub-second performance targets"
  - source: "EMRService"
    destination: "Multi-master PostgreSQL Cluster"
    description: "Persists EMR data via SQL protocols over TLS"
  - source: "BillingService"
    destination: "Multi-master PostgreSQL Cluster"
    description: "Persists billing data via SQL protocols over TLS"
  - source: "AuditService"
    destination: "Apache Kafka"
    description: "Streams audit events and Saga messages via TCP/TLS"