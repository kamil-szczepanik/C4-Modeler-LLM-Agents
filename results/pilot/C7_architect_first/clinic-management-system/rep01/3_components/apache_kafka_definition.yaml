level: component
scope: "Component diagram for the Apache Kafka container"
parentContainer:
  name: "Apache Kafka"
elements:
  - type: "component"
    name: "Network Processor"
    technology: "Java, TCP/TLS 1.3"
    description: "Manages client TCP connections and inbound requests."
  - type: "component"
    name: "Request Channel & KafkaRequestHandler Pool"
    technology: "Java, Concurrency Framework"
    description: "Handles concurrency and request execution."
  - type: "component"
    name: "Log Manager & LogSegment"
    technology: "Java, NVMe Local Disks, Tiered Object Storage"
    description: "Manages segment storage, NVMe local disks, and tiered object storage offloading."
  - type: "component"
    name: "KRaft Metadata Quorum"
    technology: "KRaft Protocol, mTLS, TCP"
    description: "Provides cluster coordination, controller election, and metadata consensus."
  - type: "component"
    name: "Strimzi Operator"
    technology: "Kubernetes, Go, CRDs"
    description: "Automates Kubernetes lifecycle management, rolling upgrades, and pod anti-affinity."
  - type: "component"
    name: "Cruise Control"
    technology: "Java, Apache Kafka"
    description: "Executes automated cluster rebalancing, self-healing, and workload redistribution."
  - type: "component"
    name: "KafkaProducer & KafkaConsumer"
    technology: "Java Client Libraries"
    description: "Client libraries for application-level data publishing and consumption."
relationships:
  - source: "Client Microservices"
    destination: "Network Processor"
    description: "Publishes and consumes audit events and streams via [TCP/TLS 1.3, mTLS]."
  - source: "Kafka Brokers"
    destination: "Tiered Object Storage"
    description: "Offloads older log segments via [HTTPS/TLS]."
  - source: "Kafka Brokers"
    destination: "KRaft Metadata Quorum"
    description: "Coordinates metadata consensus via [mTLS, TCP]."
  - source: "On-Premises Kubernetes Cluster"
    destination: "AWS eu-central-1"
    description: "Replicates critical audit topics via [MirrorMaker 2, TLS 1.3]."