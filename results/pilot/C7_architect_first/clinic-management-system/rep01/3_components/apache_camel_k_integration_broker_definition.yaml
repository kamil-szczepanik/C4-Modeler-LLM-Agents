level: component
scope: "Component diagram for the Apache Camel K Integration Broker container"
parentContainer:
  name: "Apache Camel K Integration Broker"
elements:
  - type: "component"
    name: "FHIR Transformer Component"
    technology: "Quarkus runtime, camel-fhir"
    description: "Clinical data mapping and validation using camel-fhir."
  - type: "component"
    name: "Routing Slip Manager"
    technology: "Camel Enterprise Integration Pattern engine"
    description: "Manages asynchronous message flows."
  - type: "component"
    name: "Kafka Consumer Component"
    technology: "Reactive connectors, TCP/SASL"
    description: "Ingests events from Apache Kafka."
  - type: "component"
    name: "HTTPS/REST Dispatcher Component"
    technology: "TLS 1.3, mTLS"
    description: "Manages outbound traffic to external labs."
relationships:
  - source: "Apache Camel K Integration Broker"
    destination: "Apache Kafka"
    description: "Ingests asynchronous events [TCP/SASL]"
  - source: "HTTPS/REST Dispatcher Component"
    destination: "Third-Party Lab and Imaging Systems"
    description: "Exchanges health data [HTTPS with TLS 1.3 and mTLS]"
  - source: "Routing Slip Manager"
    destination: "FHIR Transformer Component"
    description: "Direct in-memory exchanges for data transformation [`direct://` endpoints]"
  - source: "HashiCorp Vault"
    destination: "HTTPS/REST Dispatcher Component"
    description: "Injects ephemeral client certificates for authentication [Secure API]"