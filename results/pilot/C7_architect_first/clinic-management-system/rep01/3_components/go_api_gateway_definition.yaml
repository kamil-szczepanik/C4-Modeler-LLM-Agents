level: component
scope: "Component diagram for the Go API Gateway container"
parentContainer:
  name: "Go API Gateway"
elements:
  - type: "component"
    name: "HTTP Router"
    technology: "gorilla/mux"
    description: "Inbound request router providing high-speed URL pattern matching."
  - type: "component"
    name: "Auth Middleware"
    technology: "Go / JWT"
    description: "JWT validator enforcing HIPAA/GDPR access controls."
  - type: "component"
    name: "Rate Limiter & Cacher"
    technology: "Redis Enterprise, go-redis, ristretto"
    description: "Handles distributed throttling and local caching with 60-second TTL."
  - type: "component"
    name: "gRPC Client Pool"
    technology: "gRPC, HTTP/2, sony/gopher-breaker, SPIFFE/SPIRE"
    description: "Manages internal service communication with circuit breaking and mTLS."
  - type: "component"
    name: "Observability"
    technology: "Prometheus, OpenTelemetry"
    description: "Exports Prometheus metrics and OpenTelemetry distributed traces."
relationships:
  - source: "HTTP Router"
    destination: "Auth Middleware"
    description: "Passes inbound requests for authentication [JWT Validation]"
  - source: "Auth Middleware"
    destination: "Rate Limiter & Cacher"
    description: "Checks throttling limits [TCP/Redis Protocol]"
  - source: "Rate Limiter & Cacher"
    destination: "HTTP Router"
    description: "Returns caching and rate-limiting status"
  - source: "HTTP Router"
    destination: "gRPC Client Pool"
    description: "Forwards validated requests to internal services [gRPC, mTLS]"
  - source: "HTTP Router"
    destination: "Observability"
    description: "Reports metrics and trace data"