level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Clinic Staff"
    description: "Primary internal users accessing the system to manage clinical and administrative workflows."
  - type: "person"
    name: "Patients"
    description: "External users interacting via a web and mobile portal for admissions, records, and scheduling."
  - type: "externalSystem"
    name: "Insurance Gateways"
    description: "External systems processing billing claims via secure protocols."
  - type: "externalSystem"
    name: "Lab and Imaging Systems"
    description: "External diagnostic systems integrated via HL7 FHIR standards."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Enterprise authentication service managing OAuth 2.0 and OpenID Connect."
  - type: "container"
    name: "Single Page Application"
    technology: "React"
    description: "Provides high-performance, responsive UI for clinical staff and patients."
  - type: "container"
    name: "API Gateway"
    technology: "Edge Routing, OAuth2/OIDC"
    description: "Handles edge routing and OAuth2/OIDC authentication."
  - type: "container"
    name: "Patient Management Microservice"
    technology: "Kubernetes, Microservice"
    description: "Manages patient admissions and profile information."
  - type: "container"
    name: "EMR Microservice"
    technology: "Kubernetes, Microservice"
    description: "Manages electronic medical records."
  - type: "container"
    name: "Scheduling Microservice"
    technology: "Kubernetes, Microservice"
    description: "Manages scheduling and real-time appointment clash checks."
  - type: "container"
    name: "Billing Microservice"
    technology: "Kubernetes, Microservice"
    description: "Manages billing and financial transactions."
  - type: "container"
    name: "HL7 FHIR Integration Container"
    technology: "Apache Camel"
    description: "Standardizes internal data into HL7 FHIR resources for clinical interoperability."
  - type: "container"
    name: "PostgreSQL Database"
    technology: "PostgreSQL, AES-256"
    description: "Provides relational storage with AES-256 encryption for HIPAA/GDPR compliance."
  - type: "container"
    name: "Redis Cache"
    technology: "Redis"
    description: "Delivers low-latency in-memory caching for real-time appointment scheduling clash checks."
  - type: "container"
    name: "Elasticsearch Audit Trail"
    technology: "Elasticsearch"
    description: "Implements append-only, immutable storage for mandatory 10-year audit trails."
  - type: "container"
    name: "Messaging Backbone"
    technology: "Apache Kafka"
    description: "Enables asynchronous, decoupled event-driven communication across services."
relationships:
  - source: "Clinic Staff"
    destination: "Single Page Application"
    description: "Interacts via HTTPS"
    technology: "HTTPS, TLS 1.3"
  - source: "Patients"
    destination: "Single Page Application"
    description: "Interacts via HTTPS"
    technology: "HTTPS, TLS 1.3"
  - source: "Single Page Application"
    destination: "API Gateway"
    description: "Connects to API Gateway for routing and authentication"
    technology: "HTTPS, OAuth2/OIDC"
  - source: "API Gateway"
    destination: "Patient Management Microservice"
    description: "Routes requests"
    technology: "gRPC, mTLS"
  - source: "API Gateway"
    destination: "EMR Microservice"
    description: "Routes requests"
    technology: "gRPC, mTLS"
  - source: "API Gateway"
    destination: "Scheduling Microservice"
    description: "Routes requests"
    technology: "gRPC, mTLS"
  - source: "API Gateway"
    destination: "Billing Microservice"
    description: "Routes requests"
    technology: "gRPC, mTLS"
  - source: "Patient Management Microservice"
    destination: "PostgreSQL Database"
    description: "Persists data"
    technology: "PostgreSQL"
  - source: "EMR Microservice"
    destination: "PostgreSQL Database"
    description: "Persists data"
    technology: "PostgreSQL"
  - source: "Scheduling Microservice"
    destination: "PostgreSQL Database"
    description: "Persists data"
    technology: "PostgreSQL"
  - source: "Billing Microservice"
    destination: "PostgreSQL Database"
    description: "Persists data"
    technology: "PostgreSQL"
  - source: "Scheduling Microservice"
    destination: "Redis Cache"
    description: "Caches states and checks schedules"
    technology: "Redis"
  - source: "Patient Management Microservice"
    destination: "Messaging Backbone"
    description: "Publishes domain events"
    technology: "Apache Kafka"
  - source: "EMR Microservice"
    destination: "Messaging Backbone"
    description: "Publishes domain events"
    technology: "Apache Kafka"
  - source: "Scheduling Microservice"
    destination: "Messaging Backbone"
    description: "Publishes domain events"
    technology: "Apache Kafka"
  - source: "Billing Microservice"
    destination: "Messaging Backbone"
    description: "Publishes domain events"
    technology: "Apache Kafka"
  - source: "HL7 FHIR Integration Container"
    destination: "Lab and Imaging Systems"
    description: "Communicates diagnostic data and results"
    technology: "HL7 FHIR APIs"
  - source: "Billing Microservice"
    destination: "Insurance Gateways"
    description: "Submits billing claims"
    technology: "HTTPS, REST"
  - source: "API Gateway"
    destination: "Identity Provider"
    description: "Validates authentication and tokens"
    technology: "OAuth2/OIDC"