level: component
scope: "Component diagram for the HL7 FHIR Integration Container container"
parentContainer:
  name: "HL7 FHIR Integration Container"
elements:
  - type: "component"
    name: "Inbound FHIR Router"
    technology: "Apache Camel"
    description: "Parses and forwards incoming payloads using Camel Direct Endpoints."
  - type: "component"
    name: "Data Mapper"
    technology: "Apache Camel"
    description: "Transforms and formats payloads between external formats and FHIR resources."
  - type: "component"
    name: "FHIR Validation & Compliance Engine"
    technology: "Apache Camel & HAPI FHIR"
    description: "Evaluates resource integrity and checks adherence to clinical compliance standards."
  - type: "component"
    name: "Outbound Dispatcher"
    technology: "Apache Camel"
    description: "Queues validated payloads via Camel SEDA Queues for delivery."
relationships:
  - source: "Inbound FHIR Router"
    destination: "Data Mapper"
    description: "Parses and forwards incoming payloads [Camel Direct Endpoints]"
  - source: "Data Mapper"
    destination: "FHIR Validation & Compliance Engine"
    description: "Evaluates resource integrity [Camel Direct Endpoints]"
  - source: "FHIR Validation & Compliance Engine"
    destination: "Outbound Dispatcher"
    description: "Queues validated payloads [Camel SEDA Queues]"