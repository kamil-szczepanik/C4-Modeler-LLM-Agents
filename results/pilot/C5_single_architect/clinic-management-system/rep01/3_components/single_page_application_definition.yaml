level: component
scope: "Component diagram for the Single Page Application container"
parentContainer:
  name: "Single Page Application"
elements:
  - type: "component"
    name: "UI Router and Controller"
    technology: "React Router"
    description: "Manages client-side routing, view rendering, and user session state for clinic staff and patients."
  - type: "component"
    name: "Authentication Client"
    technology: "OAuth2/OIDC JS SDK"
    description: "Handles user login, token acquisition, and secure storage of JWT tokens for API communication."
  - type: "component"
    name: "API Communication Service"
    technology: "Axios / Fetch API"
    description: "Executes secure HTTPS requests carrying TLS 1.3 and JWT credentials to the API Gateway."
relationships:
  - source: "UI Router and Controller"
    destination: "Authentication Client"
    description: "Triggers authentication and token management"
  - source: "UI Router and Controller"
    destination: "API Communication Service"
    description: "Requests data fetching and mutations"
  - source: "API Communication Service"
    destination: "API Gateway"
    description: "Sends HTTPS requests with OAuth2/OIDC JWT [HTTPS, OAuth2/OIDC, JWT]"