level: component
scope: "Component diagram for the EMR Microservice container"
parentContainer:
  name: "EMR Microservice"
elements:
  - type: "component"
    name: "EMR Controller"
    technology: "Spring Boot, Java 17"
    description: "Manages incoming API requests and routes them within the EMR microservice."
  - type: "component"
    name: "Medical Record Manager"
    technology: "Spring Boot, Java 17"
    description: "Handles business logic for processing and persisting patient medical records."
  - type: "component"
    name: "Audit Trail Generator"
    technology: "Spring Boot, Java 17"
    description: "Generates strict compliance logs for HIPAA and GDPR adherence."
  - type: "component"
    name: "FHIR Transformer"
    technology: "Spring Boot, Java 17"
    description: "Integrates and transforms clinical data using HL7 FHIR standards."
  - type: "component"
    name: "EMR Cache Manager"
    technology: "Spring Cache, Java 17"
    description: "Manages caching mechanisms to ensure sub-second screen load times."
  - type: "component"
    name: "Event Publisher"
    technology: "Spring Cloud Stream, Java 17"
    description: "Publishes domain events asynchronously to the messaging backbone."
relationships:
  - source: "API Gateway"
    destination: "EMR Controller"
    description: "Routes requests [gRPC, mTLS]"
  - source: "Medical Record Manager"
    destination: "PostgreSQL Database"
    description: "Persists patient data [JDBC, AES-256]"
  - source: "EMR Cache Manager"
    destination: "Redis Cache"
    description: "Retrieves cached records [Redis Protocol, TLS]"
  - source: "Audit Trail Generator"
    destination: "Elasticsearch Audit Trail"
    description: "Writes compliance logs [REST, TLS]"
  - source: "Event Publisher"
    destination: "Messaging Backbone"
    description: "Publishes domain events [Apache Kafka, TLS]"
  - source: "FHIR Transformer"
    destination: "Lab & Imaging Systems"
    description: "Integrates clinical data [HL7 FHIR APIs]"