level: component
scope: "Component diagram for the Scheduling Microservice container"
parentContainer:
  name: "Scheduling Microservice"
elements:
  - type: "component"
    name: "AppointmentController"
    technology: "gRPC with OAuth2/OIDC"
    description: "Handles incoming gRPC routing from the API Gateway with OAuth2/OIDC."
  - type: "component"
    name: "SchedulingEngine"
    technology: "Go"
    description: "Executes concurrent resource clash detection using an in-memory interval tree."
  - type: "component"
    name: "SlotManager"
    technology: "Redis"
    description: "Interfaces with Redis for low-latency availability state checks."
  - type: "component"
    name: "AppointmentRepository"
    technology: "PostgreSQL"
    description: "Manages ACID-compliant persistence and field-level PII cryptographic masking in PostgreSQL."
  - type: "component"
    name: "AuditInterceptor"
    technology: "Apache Kafka, Elasticsearch"
    description: "Intercepts state-changing requests to generate cryptographically-signed audit logs routed to Elasticsearch via Apache Kafka."
relationships:
  - source: "API Gateway"
    destination: "AppointmentController"
    description: "Routes incoming requests via gRPC with mTLS."
  - source: "SchedulingEngine"
    destination: "SlotManager"
    description: "Evaluates availability states via in-process memory calls."
  - source: "AppointmentRepository"
    destination: "PostgreSQL Database"
    description: "Persists appointment data using PostgreSQL protocol with AES-256 encryption."
  - source: "AppointmentRepository"
    destination: "Apache Kafka"
    description: "Publishes domain events and audit logs asynchronously via Messaging Backbone."