level: component
scope: "Component diagram for the Billing Microservice container"
parentContainer:
  name: "Billing Microservice"
elements:
  - type: "component"
    name: "BillingController"
    technology: "Spring MVC"
    description: "Spring MVC component handling incoming gRPC/REST endpoints from the API Gateway."
  - type: "component"
    name: "ClaimProcessingService"
    technology: "Java"
    description: "Core business logic component orchestrating invoice generation and state transitions."
  - type: "component"
    name: "InsuranceGatewayClient"
    technology: "Resilience4j WebClient"
    description: "Resilience4j-wrapped WebClient managing external HTTPS/REST communication."
  - type: "component"
    name: "BillingRepository"
    technology: "Spring Data JPA"
    description: "Spring Data JPA component managing secure database persistence."
  - type: "component"
    name: "TokenizationService"
    technology: "Token Vault"
    description: "Component isolating and handling patient financial instruments and credit card data via a token vault."
  - type: "component"
    name: "ClaimStatusListener"
    technology: "Spring Kafka"
    description: "Spring Kafka message listener component consuming asynchronous updates from the Messaging Backbone."
  - type: "component"
    name: "KafkaEventPublisher"
    technology: "Apache Kafka"
    description: "Component publishing financial domain events."
relationships:
  - source: "API Gateway"
    destination: "BillingController"
    description: "Routes incoming requests [gRPC, mTLS]"
  - source: "BillingRepository"
    destination: "PostgreSQL Database"
    description: "Persists financial data [PostgreSQL, AES-256]"
  - source: "KafkaEventPublisher"
    destination: "Messaging Backbone"
    description: "Publishes domain events [Apache Kafka]"
  - source: "InsuranceGatewayClient"
    destination: "Insurance Gateways"
    description: "Submits billing claims [HTTPS, REST]"
  - source: "Messaging Backbone"
    destination: "ClaimStatusListener"
    description: "Consumes claim status updates [Apache Kafka]"