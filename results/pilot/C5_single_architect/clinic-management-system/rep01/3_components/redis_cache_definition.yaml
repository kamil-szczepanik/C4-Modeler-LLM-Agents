level: component
scope: "Component diagram for the Redis Cache container"
parentContainer:
  name: "Redis Cache"
elements:
  - type: "component"
    name: "Redis Cluster Manager"
    technology: "Redis Enterprise"
    description: "Manages distributed clustering, high availability, and failover for caching layers."
  - type: "component"
    name: "Data Structures Engine"
    technology: "Hashes, Sorted Sets"
    description: "Stores and retrieves structured session and scheduling cache data efficiently."
  - type: "component"
    name: "L1 In-Memory Cache Wrapper"
    technology: "In-memory wrapper"
    description: "Provides ultra-low latency local application caching alongside Redis Enterprise."
relationships:
  - source: "Scheduling Microservice"
    destination: "Redis Cluster Manager"
    description: "Sends RESP3 over TLS, TCP requests for caching and distributed locking"
  - source: "Redis Cluster Manager"
    destination: "Data Structures Engine"
    description: "Persists and queries hashes and sorted sets"
  - source: "Data Structures Engine"
    destination: "L1 In-Memory Cache Wrapper"
    description: "Synchronizes local in-memory cache wrapper data"