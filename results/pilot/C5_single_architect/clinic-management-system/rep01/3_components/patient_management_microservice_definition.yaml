level: component
scope: "Component diagram for the Patient Management Microservice container"
parentContainer:
  name: "Patient Management Microservice"
elements:
  - type: "component"
    name: "PatientController"
    technology: "Spring Boot Controller"
    description: "Handles incoming HTTP/gRPC requests, routing them to the service layer."
  - type: "component"
    name: "PatientService"
    technology: "Java 21, Spring Boot Service"
    description: "Encapsulates the core business logic for patient admissions and demographic capture."
  - type: "component"
    name: "PatientRepository"
    technology: "Spring Data JPA, Hibernate, JDBC"
    description: "Executes data persistence operations against the PostgreSQL database."
  - type: "component"
    name: "PatientCacheManager"
    technology: "Redis, Lettuce Drivers"
    description: "Manages fast in-memory caching to meet sub-second performance constraints."
  - type: "component"
    name: "AuditLogger"
    technology: "Java Logging / HTTP/S Client"
    description: "Emits security and compliance audit logs to the Elasticsearch Audit Trail."
relationships:
  - source: "PatientController"
    destination: "PatientService"
    description: "Delegates requests [In-memory method calls]"
  - source: "PatientService"
    destination: "PatientRepository"
    description: "Executes queries [Hibernate/JPA, JDBC over TLS 1.3]"
  - source: "PatientService"
    destination: "PatientCacheManager"
    description: "Manages cache [Lettuce drivers]"
  - source: "PatientService"
    destination: "Messaging Backbone"
    description: "Publishes domain events [Apache Kafka, JSON, TCP]"
  - source: "AuditLogger"
    destination: "Elasticsearch Audit Trail"
    description: "Emits audit logs [HTTP/S]"