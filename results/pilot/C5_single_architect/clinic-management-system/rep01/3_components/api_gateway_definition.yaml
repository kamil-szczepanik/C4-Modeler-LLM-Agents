level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Router Component"
    technology: "Envoy routing tables, HTTP/2, gRPC"
    description: "Routes internal traffic and handles high-performance edge routing."
  - type: "component"
    name: "Auth Filter Component"
    technology: "JWT validation, RBAC"
    description: "Validates tokens and enforces role-based access control."
  - type: "component"
    name: "Rate Limiter Component"
    technology: "Redis, local token-bucket"
    description: "Executes distributed sliding window checks and controls traffic."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Apache Kafka"
    description: "Emits structured compliance logs asynchronously."
