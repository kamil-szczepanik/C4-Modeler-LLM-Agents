level: component
scope: "Component diagram for the Elasticsearch Audit Trail container"
parentContainer:
  name: "Elasticsearch Audit Trail"
elements:
  - type: "component"
    name: "Audit Event Ingestor"
    technology: "Logstash / Elasticsearch Ingest Node"
    description: "Parses and normalizes incoming security logs and consumes security events from the Messaging Backbone."
  - type: "component"
    name: "Index Lifecycle Manager"
    technology: "Elasticsearch ILM Policies"
    description: "Interacts with AES-256 encrypted storage for automated index tiering and ensures WORM constraints."
  - type: "component"
    name: "Compliance Query API"
    technology: "Elasticsearch REST / JSON, TLS 1.3, OpenID Connect"
    description: "Serves secure read requests to administrators and enforces access control via OIDC tokens."
  - type: "component"
    name: "Messaging Backbone"
    technology: "Apache Kafka"
    description: "Ensures reliable, high-throughput event streaming via Kafka Connect."
  - type: "component"
    name: "Identity Provider"
    technology: "OIDC / OAuth2"
    description: "Provides identity and authentication services for secure access."
relationships:
  - source: "Audit Event Ingestor"
    destination: "Messaging Backbone"
    description: "Consumes security events from Messaging Backbone via Kafka Connect protocol"
  - source: "Index Lifecycle Manager"
    destination: "Audit Event Ingestor"
    description: "Manages indices and automated tiering for stored security logs"
  - source: "Compliance Query API"
    destination: "Identity Provider"
    description: "Authenticates requests using OpenID Connect tokens via TLS 1.3"