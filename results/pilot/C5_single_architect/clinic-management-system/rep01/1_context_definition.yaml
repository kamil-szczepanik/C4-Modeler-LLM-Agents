level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed to handle patient admissions, electronic medical records, scheduling, and billing for medium-sized hospitals and clinics while ensuring HIPAA and GDPR compliance."
elements:
  - type: "person"
    name: "Clinic Staff"
    description: "Primary internal users accessing the system to manage clinical and administrative workflows."
  - type: "person"
    name: "Patients"
    description: "External users interacting via a web and mobile portal for admissions, records, and scheduling."
  - type: "externalSystem"
    name: "Insurance Gateways"
    description: "External systems processing billing claims via secure REST and EDI protocols."
  - type: "externalSystem"
    name: "Lab and Imaging Systems"
    description: "External diagnostic systems integrated via HL7 FHIR standards."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Enterprise authentication service (Keycloak or Auth0) managing OAuth 2.0 and OpenID Connect."
  - type: "externalSystem"
    name: "Message Queues"
    description: "Apache Kafka and AWS SQS handling asynchronous claim submissions."
relationships:
  - source: "Clinic Staff"
    destination: "Clinic Management System"
    description: "Interacts via HTTPS and MFA over TLS 1.3"
    technology: "HTTPS, MFA, TLS 1.3"
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Accesses patient portal via web and mobile interface"
    technology: "HTTPS, TLS 1.3"
  - source: "Clinic Management System"
    destination: "Insurance Gateways"
    description: "Submits billing claims via secure REST/EDI using mutual TLS"
    technology: "REST, EDI, mTLS"
  - source: "Clinic Management System"
    destination: "Lab and Imaging Systems"
    description: "Communicates diagnostic data and results"
    technology: "HL7 FHIR"
  - source: "Clinic Management System"
    destination: "Identity Provider"
    description: "Authenticates users via federation"
    technology: "OAuth 2.0, OpenID Connect, TLS 1.3"
  - source: "Clinic Management System"
    destination: "Message Queues"
    description: "Decouples asynchronous claim submissions"
    technology: "Apache Kafka, AWS SQS"