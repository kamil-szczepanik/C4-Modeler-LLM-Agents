level: component
scope: "Component diagram for the EMR Service container"
parentContainer:
  name: "EMR Service"
elements:
  - type: "component"
    name: "EMR Query Component"
    technology: "Read-optimized Redis caching and PostgreSQL read replicas"
    description: "Internal component utilizing read-optimized Redis caching and PostgreSQL read replicas."
  - type: "component"
    name: "FHIR Mapper Component"
    technology: "HAPI FHIR libraries and Apache Camel"
    description: "Internal component utilizing HAPI FHIR libraries and Apache Camel for interoperability."
  - type: "component"
    name: "Audit Service Component"
    technology: "Asynchronous compliance logging"
    description: "Internal component managing asynchronous, tamper-evident compliance logging."
  - type: "container"
    name: "NGINX/Kong API Gateway"
    technology: "API Gateway"
    description: "Routes external requests using gRPC with mTLS."
  - type: "container"
    name: "Distributed PostgreSQL Database"
    technology: "PostgreSQL"
    description: "Primary data store with AES-256 encryption at rest and schema-per-service isolation."
  - type: "container"
    name: "Redis Caching Layer"
    technology: "Redis"
    description: "In-memory cache utilizing application-layer encryption for patient chart fragments."
  - type: "container"
    name: "Apache Camel Integration Service"
    technology: "Apache Camel"
    description: "Integration service for transforming and transmitting clinical payloads."
  - type: "container"
    name: "Apache Kafka Event Broker"
    technology: "Apache Kafka"
    description: "Event streaming backbone using SASL/SCRAM authentication."
  - type: "system"
    name: "External Lab & Imaging Systems"
    technology: "HL7 FHIR R4 over mTLS"
    description: "External systems exchanging standardized data using HL7 FHIR R4."
relationships:
  - source: "NGINX/Kong API Gateway"
    destination: "EMR Service"
    description: "Routes external requests using gRPC with mTLS"
  - source: "EMR Service"
    destination: "Distributed PostgreSQL Database"
    description: "Persists and queries transactional health data via JDBC with HikariCP connection pooling"
  - source: "EMR Service"
    destination: "Redis Caching Layer"
    description: "Retrieves and stores encrypted patient chart fragments via Spring Data Redis (Lettuce)"
  - source: "EMR Service"
    destination: "Apache Camel Integration Service"
    description: "Transforms and transmits clinical payloads using internal gRPC stubs"
  - source: "FHIR Mapper Component"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges standardized data using HL7 FHIR R4 over mTLS"
  - source: "EMR Service"
    destination: "Apache Kafka Event Broker"
    description: "Streams domain events using SASL/SCRAM authentication"