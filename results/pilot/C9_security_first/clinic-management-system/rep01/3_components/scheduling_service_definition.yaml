level: component
scope: "Component diagram for the Scheduling Service container"
parentContainer:
  name: "Scheduling Service"
elements:
  - type: "component"
    name: "AppointmentController"
    technology: "gRPC / Spring Boot / OAuth2/OIDC"
    description: "Handles incoming gRPC routing and OAuth2/OIDC JWT scope validation"
  - type: "component"
    name: "CalendarManager"
    technology: "Java / Spring Beans"
    description: "Executes core scheduling business logic and distributed locking"
  - type: "component"
    name: "ResourceAllocationEngine"
    technology: "Java / Spring Beans"
    description: "Manages clinician, room, and equipment availability"
  - type: "component"
    name: "SlotCacheAdapter"
    technology: "Redis Protocol / Spring Data"
    description: "Interfaces with Redis to cache practitioner availability matrices"
  - type: "component"
    name: "PersistenceAdapter"
    technology: "Spring Data JPA / JDBC"
    description: "Interfaces with Distributed PostgreSQL Database via Spring Data JPA"
  - type: "component"
    name: "KafkaEventPublisher"
    technology: "Apache Kafka Client"
    description: "Publishes domain events to Apache Kafka Event Broker"
  - type: "component"
    name: "NotificationDispatcher"
    technology: "Java / Spring Boot Async"
    description: "Processes async domain events for automated reminders and rescheduling"
  - type: "component"
    name: "NGINX/Kong API Gateway"
    technology: "API Gateway"
    description: "External API gateway routing scheduling requests"
  - type: "component"
    name: "Distributed PostgreSQL Database"
    technology: "PostgreSQL with AES-256"
    description: "Primary transactional data store persisting encrypted records"
  - type: "component"
    name: "Apache Kafka Event Broker"
    technology: "Apache Kafka"
    description: "Event broker for decoupling asynchronous notifications and reminders"
relationships:
  - source: "NGINX/Kong API Gateway"
    destination: "AppointmentController"
    description: "Routes scheduling requests [gRPC with mTLS]"
  - source: "CalendarManager"
    destination: "ResourceAllocationEngine"
    description: "Evaluates booking constraints [In-process method calls]"
  - source: "CalendarManager"
    destination: "SlotCacheAdapter"
    description: "Reads/writes availability [Redis protocol]"
  - source: "PersistenceAdapter"
    destination: "Distributed PostgreSQL Database"
    description: "Persists encrypted records [JDBC with AES-256 and distributed locks]"
  - source: "KafkaEventPublisher"
    destination: "Apache Kafka Event Broker"
    description: "Streams domain events [SASL/SCRAM authenticated event streaming]"