level: component
scope: "Component diagram for the Patient Service container"
parentContainer:
  name: "Patient Service"
elements:
  - type: "component"
    name: "Patient Controller"
    technology: "Java & Spring Boot"
    description: "Handles incoming gRPC requests routed from the API Gateway and exposes endpoints for patient admission operations."
  - type: "component"
    name: "Patient Domain Model"
    technology: "Java & Spring Boot"
    description: "Encapsulates the core business logic and state validation for patient records."
  - type: "component"
    name: "Patient Event Publisher"
    technology: "Apache Kafka"
    description: "Streams domain events to the Apache Kafka Event Broker via SASL/SCRAM authentication."
  - type: "component"
    name: "Patient Data Access Repository"
    technology: "Distributed PostgreSQL"
    description: "Persists patient transactional data securely via AES-256 encrypted volumes."
  - type: "component"
    name: "FHIR Integration Adapter"
    technology: "HL7 FHIR APIs"
    description: "Interoperates with third-party lab and imaging systems using standard HL7 FHIR protocols."
relationships:
  - source: "Patient Controller"
    destination: "Patient Domain Model"
    description: "Delegates request business logic to"
  - source: "Patient Domain Model"
    destination: "Patient Event Publisher"
    description: "Triggers domain events via"
  - source: "Patient Domain Model"
    destination: "Patient Data Access Repository"
    description: "Persists and retrieves data using"
  - source: "Patient Domain Model"
    destination: "FHIR Integration Adapter"
    description: "Communicates with external systems via"