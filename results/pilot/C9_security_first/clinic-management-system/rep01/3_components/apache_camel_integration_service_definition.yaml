level: component
scope: "Component diagram for the Apache Camel Integration Service container"
parentContainer:
  name: "Apache Camel Integration Service"
elements:
  - type: "component"
    name: "FHIR-Parser-Component"
    technology: "Apache Camel / Java DSL"
    description: "Parses and validates incoming FHIR clinical data and financial claims."
  - type: "component"
    name: "HL7-Transformation-Component"
    technology: "Apache Camel / Spring Boot"
    description: "Handles protocol translation and data structure mapping for interoperability."
  - type: "component"
    name: "External-Connector-Pool"
    technology: "Resilience4j / Java"
    description: "Manages secure connections and circuit breaking for external third-party endpoints."
  - type: "component"
    name: "Audit-Logging-Processor"
    technology: "OpenTelemetry / Java"
    description: "Enforces distributed tracing and HIPAA/GDPR-compliant audit logging."
  - type: "component"
    name: "Dead Letter Channel"
    technology: "Apache Camel / PostgreSQL"
    description: "Provides zero-loss buffering and error management for failed transmissions."
relationships:
  - source: "FHIR-Parser-Component"
    destination: "HL7-Transformation-Component"
    description: "Passes parsed payloads for structural transformation"
  - source: "HL7-Transformation-Component"
    destination: "External-Connector-Pool"
    description: "Routes transformed messages to external healthcare networks"
  - source: "External-Connector-Pool"
    destination: "Dead Letter Channel"
    description: "Redirects failed messages on endpoint failure"
  - source: "FHIR-Parser-Component"
    destination: "Audit-Logging-Processor"
    description: "Sends transaction telemetry and audit trails"