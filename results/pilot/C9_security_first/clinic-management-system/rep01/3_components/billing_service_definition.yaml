level: component
scope: "Component diagram for the Billing Service container"
parentContainer:
  name: "Billing Service"
elements:
  - type: "component"
    name: "BillingController"
    technology: "gRPC facade component"
    description: "Routes incoming gRPC requests to the application logic."
  - type: "component"
    name: "InvoiceManager"
    technology: "Spring bean"
    description: "Generates patient bills."
  - type: "component"
    name: "ClaimProcessor"
    technology: "Spring bean"
    description: "Handles insurance submissions."
  - type: "component"
    name: "PaymentEngine"
    technology: "Spring bean"
    description: "Manages payment gateway integration."
  - type: "component"
    name: "LedgerRepository"
    technology: "Spring Data JPA persistence component"
    description: "Persists transactional records."
  - type: "component"
    name: "Billing Service"
    technology: "Java, Spring Boot, gRPC container"
    description: "Core container responsible for managing patient billing, payments, and financial processing."
  - type: "component"
    name: "NGINX/Kong API Gateway"
    technology: "API Gateway"
    description: "Routes incoming gRPC requests."
  - type: "component"
    name: "Apache Kafka Event Broker"
    technology: "Event streaming backbone"
    description: "Publishes and consumes domain events."
  - type: "component"
    name: "Distributed PostgreSQL Database"
    technology: "Schema-per-service storage"
    description: "Persists transactional records."
  - type: "component"
    name: "Redis"
    technology: "In-memory data store"
    description: "Stores idempotency keys."
  - type: "component"
    name: "External Clearinghouses/Gateways"
    technology: "External Service"
    description: "Receives claims and processes payments."
relationships:
  - source: "NGINX/Kong API Gateway"
    destination: "Billing Service"
    description: "Routes incoming gRPC requests [gRPC with mTLS]"
  - source: "Billing Service"
    destination: "Apache Kafka Event Broker"
    description: "Publishes domain events InvoiceIssued, PaymentProcessed [Spring Kafka via SASL/SCRAM]"
  - source: "Billing Service"
    destination: "Distributed PostgreSQL Database"
    description: "Persists transactional records [Spring Data JPA over AES-256 encrypted volumes]"
  - source: "ClaimProcessor & PaymentEngine"
    destination: "External Clearinghouses/Gateways"
    description: "Submits claims and processes payments [HTTPS/REST wrapped in Resilience4j circuit breakers]"
  - source: "Billing Service"
    destination: "Redis"
    description: "Stores idempotency keys [TCP/RESP]"