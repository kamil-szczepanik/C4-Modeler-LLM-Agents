level: component
scope: "Component diagram for the React SPA Frontend container"
parentContainer:
  name: "React SPA Frontend"
elements:
  - type: "component"
    name: "Authentication Context"
    technology: "React Context, OAuth2/OIDC"
    description: "Manages user authentication state, secure login flows, and MFA integration."
  - type: "component"
    name: "Routing & Layout Engine"
    technology: "React Router, TypeScript"
    description: "Handles client-side routing, code-splitting, lazy loading, and core layout rendering."
  - type: "component"
    name: "EMR Workspace Module"
    technology: "React, TypeScript, IndexedDB with AES-GCM"
    description: "Provides the primary interface for clinicians to view and update electronic medical records with offline resilience."
  - type: "component"
    name: "Scheduling & Billing Views"
    technology: "React, TypeScript"
    description: "Enables receptionists and billing specialists to manage appointments, admissions, and process bills."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios, Fetch API, JWT"
    description: "Encapsulates communication with the NGINX/Kong API Gateway via HTTPS/WSS with token-based authentication."
relationships:
  - source: "Routing & Layout Engine"
    destination: "EMR Workspace Module"
    description: "Renders dynamically via lazy loading"
  - source: "Routing & Layout Engine"
    destination: "Scheduling & Billing Views"
    description: "Renders navigation views"
  - source: "EMR Workspace Module"
    destination: "API Client Layer"
    description: "Sends EMR queries and mutations"
  - source: "Scheduling & Billing Views"
    destination: "API Client Layer"
    description: "Sends scheduling and billing requests"
  - source: "Authentication Context"
    destination: "API Client Layer"
    description: "Injects JWT authorization headers"