level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud clinical IT platform designed to handle patient admissions, electronic medical records, appointment scheduling, and billing for medium-sized hospitals and clinics."
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who access the portal for appointments and records."
  - type: "person"
    name: "Receptionists"
    description: "Front-desk staff handling patient admissions and scheduling."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals managing electronic medical records and clinical workflows."
  - type: "person"
    name: "Billing Specialists"
    description: "Financial staff managing billing and insurance claims."
  - type: "externalSystem"
    name: "Third-Party Lab & Imaging Systems"
    description: "External diagnostic systems for lab results and medical imaging."
  - type: "externalSystem"
    name: "External Payment Gateways"
    description: "External services processing patient payments."
  - type: "externalSystem"
    name: "Insurance Clearinghouses"
    description: "External systems processing insurance claims and verification."
relationships:
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Accesses portal, schedules appointments, and views records"
    technology: "HTTPS/TLS 1.3, OAuth 2.0 / OpenID Connect, MFA"
  - source: "Receptionists"
    destination: "Clinic Management System"
    description: "Manages patient admissions and scheduling"
    technology: "HTTPS/TLS 1.3, OAuth 2.0 / OpenID Connect, MFA"
  - source: "Clinicians"
    destination: "Clinic Management System"
    description: "Updates electronic medical records and clinical workflows"
    technology: "HTTPS/TLS 1.3, OAuth 2.0 / OpenID Connect, MFA"
  - source: "Billing Specialists"
    destination: "Clinic Management System"
    description: "Processes bills and claims"
    technology: "HTTPS/TLS 1.3, OAuth 2.0 / OpenID Connect, MFA"
  - source: "Clinic Management System"
    destination: "Third-Party Lab & Imaging Systems"
    description: "Exchanges clinical data"
    technology: "HL7 FHIR over RESTful APIs"
  - source: "Clinic Management System"
    destination: "External Payment Gateways"
    description: "Processes financial transactions"
    technology: "HTTPS, Secure Webhooks"
  - source: "Clinic Management System"
    destination: "Insurance Clearinghouses"
    description: "Submits and tracks insurance claims"
    technology: "HTTPS, Secure Webhooks"