level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who access the portal for appointments and records."
  - type: "person"
    name: "Receptionists"
    description: "Front-desk staff handling patient admissions and scheduling."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals managing electronic medical records and clinical workflows."
  - type: "person"
    name: "Billing Specialists"
    description: "Financial staff managing billing and insurance claims."
  - type: "externalSystem"
    name: "Third-Party Lab & Imaging Systems"
    description: "External diagnostic systems for lab results and medical imaging."
  - type: "externalSystem"
    name: "External Payment Gateways"
    description: "External services processing patient payments."
  - type: "externalSystem"
    name: "Insurance Clearinghouses"
    description: "External systems processing insurance claims and verification."
  - type: "container"
    name: "React SPA Frontend"
    technology: "React, CDN/Nginx"
    description: "Provides the user interface for patients, receptionists, clinicians, and billing specialists."
  - type: "container"
    name: "NGINX/Kong API Gateway"
    technology: "NGINX/Kong"
    description: "Handles single entry point, token exchange, routing, and security enforcement."
  - type: "container"
    name: "Patient Service"
    technology: "Java, Spring Boot, gRPC"
    description: "Manages patient admissions and profile data."
  - type: "container"
    name: "Scheduling Service"
    technology: "Java, Spring Boot, gRPC"
    description: "Manages appointment scheduling and calendar workflows."
  - type: "container"
    name: "EMR Service"
    technology: "Java, Spring Boot, gRPC"
    description: "Manages electronic medical records with sub-second performance SLAs."
  - type: "container"
    name: "Billing Service"
    technology: "Java, Spring Boot, gRPC"
    description: "Manages billing, payments, and financial processing."
  - type: "container"
    name: "Apache Camel Integration Service"
    technology: "Apache Camel"
    description: "Handles HL7 FHIR translation and integration with external systems."
  - type: "container"
    name: "Distributed PostgreSQL Database"
    technology: "PostgreSQL, Active-Active Hybrid Replication"
    description: "Provides distributed, partitioned transactional storage with AES-256 encryption."
  - type: "container"
    name: "Apache Kafka Event Broker"
    technology: "Apache Kafka, SASL/SCRAM"
    description: "Enables resilient asynchronous event streaming between microservices."
relationships:
  - source: "Patients"
    destination: "React SPA Frontend"
    description: "Accesses portal, schedules appointments, and views records"
    technology: "HTTPS/WSS, OAuth2/OIDC, MFA"
  - source: "Receptionists"
    destination: "React SPA Frontend"
    description: "Manages patient admissions and scheduling"
    technology: "HTTPS/WSS, OAuth2/OIDC, MFA"
  - source: "Clinicians"
    destination: "React SPA Frontend"
    description: "Updates electronic medical records and clinical workflows"
    technology: "HTTPS/WSS, OAuth2/OIDC, MFA"
  - source: "Billing Specialists"
    destination: "React SPA Frontend"
    description: "Processes bills and claims"
    technology: "HTTPS/WSS, OAuth2/OIDC, MFA"
  - source: "React SPA Frontend"
    destination: "NGINX/Kong API Gateway"
    description: "Sends API requests"
    technology: "HTTPS/WSS, OAuth2/OIDC, MFA"
  - source: "NGINX/Kong API Gateway"
    destination: "Patient Service"
    description: "Routes requests via service mesh"
    technology: "gRPC with mTLS"
  - source: "NGINX/Kong API Gateway"
    destination: "Scheduling Service"
    description: "Routes requests via service mesh"
    technology: "gRPC with mTLS"
  - source: "NGINX/Kong API Gateway"
    destination: "EMR Service"
    description: "Routes requests via service mesh"
    technology: "gRPC with mTLS"
  - source: "NGINX/Kong API Gateway"
    destination: "Billing Service"
    description: "Routes requests via service mesh"
    technology: "gRPC with mTLS"
  - source: "Apache Camel Integration Service"
    destination: "Third-Party Lab & Imaging Systems"
    description: "Exchanges clinical data"
    technology: "HL7 FHIR APIs over TLS"
  - source: "Apache Camel Integration Service"
    destination: "External Payment Gateways"
    description: "Processes financial transactions"
    technology: "HL7 FHIR APIs over TLS / Secure Webhooks"
  - source: "Apache Camel Integration Service"
    destination: "Insurance Clearinghouses"
    description: "Submits and tracks insurance claims"
    technology: "HL7 FHIR APIs over TLS"
  - source: "Patient Service"
    destination: "Apache Kafka Event Broker"
    description: "Streams domain events"
    technology: "SASL/SCRAM authenticated event streaming"
  - source: "Scheduling Service"
    destination: "Apache Kafka Event Broker"
    description: "Streams domain events"
    technology: "SASL/SCRAM authenticated event streaming"
  - source: "EMR Service"
    destination: "Apache Kafka Event Broker"
    description: "Streams domain events"
    technology: "SASL/SCRAM authenticated event streaming"
  - source: "Billing Service"
    destination: "Apache Kafka Event Broker"
    description: "Streams domain events"
    technology: "SASL/SCRAM authenticated event streaming"
  - source: "Patient Service"
    destination: "Distributed PostgreSQL Database"
    description: "Persists transactional data"
    technology: "AES-256 encrypted persistent volumes with schema-per-service"
  - source: "Scheduling Service"
    destination: "Distributed PostgreSQL Database"
    description: "Persists transactional data"
    technology: "AES-256 encrypted persistent volumes with schema-per-service"
  - source: "EMR Service"
    destination: "Distributed PostgreSQL Database"
    description: "Persists transactional data"
    technology: "AES-256 encrypted persistent volumes with schema-per-service"
  - source: "Billing Service"
