level: context
scope: "System Context diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization System"
  description: "A cloud-native Azure platform that gradually replaces a legacy mainframe, enabling online claim submissions and modern adjuster workflows while maintaining hybrid interoperability."
elements:
  - type: "person"
    name: "Policyholders and Brokers"
    description: "Users who submit claims and interact with the insurance system online."
  - type: "person"
    name: "Claims Adjusters"
    description: "Users who process and manage claims using modern workflows."
  - type: "externalSystem"
    name: "On-Premises Active Directory"
    description: "Identity provider used for enterprise authentication and synchronization via Azure AD Connect."
  - type: "externalSystem"
    name: "Legacy Mainframe COBOL/DB2 System"
    description: "30-year-old system of record that maintains core data and is integrated via an Anti-Corruption Layer."
  - type: "container"
    name: "Azure Claims Modernization System"
    description: "Cloud-native Azure platform hosting the web frontend, APIs, and business logic."
    technology: "Microsoft Azure Cloud (PaaS, App Service)"
  - type: "container"
    name: "Anti-Corruption Layer (ACL) & Azure Service Bus"
    description: "Integration containers handling secure, asynchronous communication and data translation with the legacy mainframe."
    technology: "Azure Service Bus, mTLS, TLS 1.3"
relationships:
  - source: "Policyholders and Brokers"
    destination: "Azure Claims Modernization System"
    description: "Interact with Azure Web Frontend to submit claims and view status"
    technology: "HTTPS"
  - source: "Claims Adjusters"
    destination: "Azure Claims Modernization System"
    description: "Use Azure Web App with SSO for claim management workflows"
    technology: "HTTPS, OpenID Connect / SAML"
  - source: "Anti-Corruption Layer (ACL) & Azure Service Bus"
    destination: "Legacy Mainframe COBOL/DB2 System"
    description: "Communicates via asynchronous messaging and data synchronization"
    technology: "mTLS"
  - source: "On-Premises Active Directory"
    destination: "Azure Claims Modernization System"
    description: "Synchronizes identity data and provides Single Sign-On"
    technology: "Azure AD Connect, OpenID Connect / SAML"