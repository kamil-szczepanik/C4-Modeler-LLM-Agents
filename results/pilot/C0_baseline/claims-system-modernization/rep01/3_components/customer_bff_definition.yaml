level: component
scope: "Component diagram for the Customer BFF container"
parentContainer:
  name: "Customer BFF"
elements:
  - type: "component"
    name: "Authentication Controller"
    technology: "Node.js, TypeScript"
    description: "Handles incoming OAuth2/OIDC authentication and request context."
  - type: "component"
    name: "Claim Submission Router"
    technology: "Node.js, TypeScript"
    description: "Routes online claim submissions to appropriate downstream handlers."
  - type: "component"
    name: "Downstream Orchestrator"
    technology: "Node.js, TypeScript"
    description: "Orchestrates claim operations and forwards requests to the Modular Monolith."
  - type: "component"
    name: "Routing Anti-Corruption Layer (ACL)"
    technology: "Node.js, TypeScript"
    description: "Translates and adapts requests to bridge hybrid legacy migration complexities."
  - type: "component"
    name: "Validation and Sanitization Component"
    technology: "Zod"
    description: "Performs TypeScript-first schema validation for strict payload sanitization."
  - type: "component"
    name: "State Cache Manager"
    technology: "Redis Cache"
    description: "Persists multi-step wizard state for session recovery."
  - type: "component"
    name: "Asset Direct-Upload Handler"
    technology: "Azure Blob Storage, SAS Tokens"
    description: "Issues SAS tokens and coordinates direct-to-cloud asset uploads."
relationships:
  - source: "Claim Submission Router"
    destination: "Validation and Sanitization Component"
    description: "Validates and sanitizes payloads"
  - source: "Claim Submission Router"
    destination: "State Cache Manager"
    description: "Persists multi-step wizard state"
  - source: "Claim Submission Router"
    destination: "Asset Direct-Upload Handler"
    description: "Issues SAS tokens for direct media uploads"
  - source: "Downstream Orchestrator"
    destination: "Routing Anti-Corruption Layer (ACL)"
    description: "Adapts and forwards validated claim operations"