level: component
scope: "Component diagram for the Integration Worker with ACL container"
parentContainer:
  name: "Integration Worker with ACL"
elements:
  - type: "component"
    name: "Event Consumer"
    technology: "Node.js, TypeScript, Azure Service Bus SDK"
    description: "Consumes asynchronous domain events from the Azure Service Bus and triggers integration workflows."
  - type: "component"
    name: "Anti-Corruption Layer (ACL)"
    technology: "Node.js, TypeScript"
    description: "Translates modern domain models into legacy mainframe formats and isolates the volatile mainframe system."
  - type: "component"
    name: "Legacy Sync Adapter"
    technology: "Node.js, mTLS"
    description: "Secures communication and synchronizes data using batch payloads with the Legacy Mainframe COBOL/DB2 System."
relationships:
  - source: "Event Consumer"
    destination: "Anti-Corruption Layer (ACL)"
    description: "Forwards consumed domain events for data transformation"
  - source: "Anti-Corruption Layer (ACL)"
    destination: "Legacy Sync Adapter"
    description: "Sends translated batch payloads to the legacy communication adapter"
  - source: "Legacy Sync Adapter"
    destination: "Legacy Mainframe COBOL/DB2 System"
    description: "Synchronizes data using batch payloads [mTLS]"