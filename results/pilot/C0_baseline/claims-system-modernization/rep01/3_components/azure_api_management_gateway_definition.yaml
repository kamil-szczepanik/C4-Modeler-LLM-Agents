level: component
scope: "Component diagram for the Azure API Management Gateway container"
parentContainer:
  name: "Azure API Management Gateway"
elements:
  - type: "component"
    name: "Policy Enforcer"
    technology: "Azure API Management"
    description: "Enforces security policies and validates JWT tokens for incoming requests."
  - type: "component"
    name: "Request Router"
    technology: "Azure API Management"
    description: "Routes validated client requests to the appropriate downstream BFF."
  - type: "component"
    name: "Transformation"
    technology: "Azure API Management / Liquid Templates"
    description: "Transforms request and response payloads using Liquid templates."
  - type: "component"
    name: "Telemetry Publisher"
    technology: "Azure API Management"
    description: "Publishes operational telemetry and metrics for monitoring."
relationships:
  - source: "Policy Enforcer"
    destination: "Request Router"
    description: "Validates and passes requests"
  - source: "Request Router"
    destination: "Transformation"
    description: "Routes requests for payload transformation"