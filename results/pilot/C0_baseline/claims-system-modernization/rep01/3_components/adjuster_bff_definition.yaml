level: component
scope: "Component diagram for the Adjuster BFF container"
parentContainer:
  name: "Adjuster BFF"
elements:
  - type: "component"
    name: "HTTP Router and Request Handler"
    technology: "Node.js, TypeScript, Express.js"
    description: "Handles incoming HTTP routing from the Azure API Management Gateway and exposes endpoints for the adjuster web application."
  - type: "component"
    name: "Reactive Stream Coordinator"
    technology: "RxJS, Node.js"
    description: "Coordinates asynchronous I/O and reactive data streams to aggregate hybrid data sources without blocking the event loop."
  - type: "component"
    name: "Cache Manager"
    technology: "Redis Cache, node-cache"
    description: "Manages transient claim state and caches legacy segments to meet sub-two-second latency SLAs."
  - type: "component"
    name: "Legacy Integration Client"
    technology: "Node.js, TypeScript, HTTPS"
    description: "Fetches fallback legacy claim data and masks legacy mainframe latency from the integration layer."
relationships:
  - source: "HTTP Router and Request Handler"
    destination: "Reactive Stream Coordinator"
    description: "Delegates request processing and data aggregation [RxJS streams]"
  - source: "Reactive Stream Coordinator"
    destination: "Cache Manager"
    description: "Retrieves and stores transient claim state and cached legacy segments [TCP, TLS]"
  - source: "Reactive Stream Coordinator"
    destination: "Legacy Integration Client"
    description: "Requests fallback legacy claim data when needed [HTTPS]"