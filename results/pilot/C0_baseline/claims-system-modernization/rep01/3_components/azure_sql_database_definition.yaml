level: component
scope: "Component diagram for the Azure SQL Database container"
parentContainer:
  name: "Azure SQL Database"
elements:
  - type: "component"
    name: "Core Schema"
    technology: "Azure SQL Engine"
    description: "Primary relational data store for transactional data."
  - type: "component"
    name: "Outbox Schema"
    technology: "Azure SQL Engine"
    description: "Transactional Outbox Table for domain event management."
  - type: "component"
    name: "Audit Schema"
    technology: "Azure SQL Engine"
    description: "Stores audit logs and telemetry data."
relationships:
  - source: "Modular Monolith"
    destination: "Core Schema"
    description: "Persists relational data [Entity Framework Core, T-SQL over encrypted TDS, Managed Identities]"
  - source: "Modular Monolith"
    destination: "Outbox Schema"
    description: "Persists domain events [Entity Framework Core, T-SQL over encrypted TDS, Managed Identities]"
  - source: "Core Schema"
    destination: "Azure Key Vault"
    description: "Secures data encryption [Transparent Data Encryption with Customer-Managed Keys]"
  - source: "Core Schema"
    destination: "Azure Monitor"
    description: "Streams audit logs and telemetry [TLS-secured log streaming]"