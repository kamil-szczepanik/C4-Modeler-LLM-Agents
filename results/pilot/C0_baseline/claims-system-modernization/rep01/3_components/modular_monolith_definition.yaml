level: component
scope: "Component diagram for the Modular Monolith container"
parentContainer:
  name: "Modular Monolith"
elements:
  - type: "component"
    name: "ClaimManagement"
    technology: "Node.js with TypeScript, TSyringe or Inversify"
    description: "Core component that isolates domain logic and manages claim processing."
  - type: "component"
    name: "PolicyVerification"
    technology: "Node.js with TypeScript, TSyringe or Inversify"
    description: "Component responsible for verifying insurance policies."
  - type: "component"
    name: "DocumentHandling"
    technology: "Node.js with TypeScript, TSyringe or Inversify"
    description: "Component responsible for handling and processing documents."
  - type: "component"
    name: "Azure SQL Database"
    technology: "Azure SQL Database"
    description: "Relational storage utilizing transactional outbox pattern."
  - type: "component"
    name: "Azure Service Bus"
    technology: "Azure Service Bus"
    description: "Asynchronous messaging broker for event-driven consistency."
  - type: "component"
    name: "Redis Cache"
    technology: "Redis Cache"
    description: "High-performance storage for low-latency adjuster screen reads."
  - type: "component"
    name: "In-Process Mediator"
    technology: "In-Process Mediator"
    description: "Communicates via strongly-typed domain events."
relationships:
  - source: "ClaimManagement"
    destination: "Azure SQL Database"
    description: "Persists transactional data [T-SQL]"
  - source: "ClaimManagement"
    destination: "Azure Service Bus"
    description: "Publishes asynchronous domain events [AMQP]"
  - source: "ClaimManagement"
    destination: "Redis Cache"
    description: "Updates read-model projections [Redis Protocol]"
  - source: "ClaimManagement"
    destination: "In-Process Mediator"
    description: "Communicates via strongly-typed domain events [In-Process]"
  - source: "PolicyVerification"
    destination: "In-Process Mediator"
    description: "Communicates via strongly-typed domain events [In-Process]"
  - source: "DocumentHandling"
    destination: "In-Process Mediator"
    description: "Communicates via strongly-typed domain events [In-Process]"