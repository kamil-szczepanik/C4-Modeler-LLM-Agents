level: component
scope: "Component diagram for the Redis Cache container"
parentContainer:
  name: "Redis Cache"
elements:
  - type: "component"
    name: "Key Eviction Engine"
    technology: "Redis volatile-lru policy"
    description: "Manages memory limits and evicts least recently used keys with an expiration set."
  - type: "component"
    name: "In-Memory Data Store"
    technology: "Redis Hashes and structured string keys"
    description: "Stores read-model projections with tenant and claim-type prefixes for rapid retrieval."
  - type: "component"
    name: "RESP Interface"
    technology: "RESP Protocol, Azure Private Link, TCP with TLS 1.3"
    description: "Provides secure, encrypted, low-latency communication interface for clients."
  - type: "component"
    name: "Persistence Subsystem"
    technology: "Point-in-time RDB snapshots"
    description: "Handles disaster recovery backups via point-in-time snapshots."
relationships:
  - source: "RESP Interface"
    destination: "In-Memory Data Store"
    description: "Routes client queries and updates to"
  - source: "In-Memory Data Store"
    destination: "Key Eviction Engine"
    description: "Triggers eviction policies when memory thresholds are approached"
  - source: "In-Memory Data Store"
    destination: "Persistence Subsystem"
    description: "Backs up state using"