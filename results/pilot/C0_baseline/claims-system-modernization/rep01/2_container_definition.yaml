level: container
scope: "Container diagram for Insurance Claims Modernization System"
system:
  name: "Insurance Claims Modernization System"
elements:
  - type: "person"
    name: "Policyholders and Brokers"
    description: "Users who submit claims and interact with the insurance system online."
  - type: "person"
    name: "Claims Adjusters"
    description: "Users who process and manage claims using modern workflows."
  - type: "externalSystem"
    name: "On-Premises Active Directory"
    description: "Identity provider used for enterprise authentication."
  - type: "externalSystem"
    name: "Legacy Mainframe COBOL/DB2 System"
    description: "30-year-old system of record maintaining core data."
  - type: "container"
    name: "React Single-Page Application (SPA)"
    technology: "React, Azure Blob Storage, CDN"
    description: "Frontend interface hosted for policyholders, brokers, and claims adjusters."
  - type: "container"
    name: "Customer BFF"
    technology: "Node.js, TypeScript"
    description: "Backend-for-Frontend service for policyholders and brokers."
  - type: "container"
    name: "Adjuster BFF"
    technology: "Node.js, TypeScript"
    description: "Backend-for-Frontend service for claims adjusters."
  - type: "container"
    name: "Azure API Management Gateway"
    technology: "Azure API Management, OAuth2/OIDC"
    description: "Routes client requests and secures API endpoints."
  - type: "container"
    name: "Modular Monolith"
    technology: "Node.js, TypeScript"
    description: "Core backend service handling domain logic and business operations."
  - type: "container"
    name: "Azure Service Bus"
    technology: "Azure Service Bus"
    description: "Handles asynchronous event distribution and messaging."
  - type: "container"
    name: "Integration Worker with ACL"
    technology: "Node.js, mTLS"
    description: "Anti-Corruption Layer worker that synchronizes data with the legacy mainframe."
  - type: "container"
    name: "Redis Cache"
    technology: "Redis Cache"
    description: "Caches read-model projections for fast retrieval."
  - type: "container"
    name: "Azure SQL Database"
    technology: "Azure SQL Database, Transactional Outbox"
    description: "Transactional data store ensuring guaranteed consistency."
relationships:
  - source: "Policyholders and Brokers"
    destination: "React Single-Page Application (SPA)"
    description: "Interacts with SPA for digital claim submissions and status tracking"
    technology: "HTTPS"
  - source: "Claims Adjusters"
    destination: "React Single-Page Application (SPA)"
    description: "Interacts with SPA for fast claim processing workflows"
    technology: "HTTPS"
  - source: "React Single-Page Application (SPA)"
    destination: "Azure API Management Gateway"
    description: "Sends client API requests"
    technology: "HTTPS"
  - source: "Azure API Management Gateway"
    destination: "Customer BFF"
    description: "Routes customer requests"
    technology: "HTTPS, OAuth2/OIDC"
  - source: "Azure API Management Gateway"
    destination: "Adjuster BFF"
    description: "Routes adjuster requests"
    technology: "HTTPS, OAuth2/OIDC"
  - source: "Customer BFF"
    destination: "Modular Monolith"
    description: "Invokes core domain operations"
    technology: "HTTP/REST"
  - source: "Adjuster BFF"
    destination: "Modular Monolith"
    description: "Invokes core domain operations"
    technology: "HTTP/REST"
  - source: "Modular Monolith"
    destination: "Azure Service Bus"
    description: "Publishes and consumes asynchronous events"
    technology: "AMQP"
  - source: "Modular Monolith"
    destination: "Azure SQL Database"
    description: "Persists transactional data using outbox pattern"
    technology: "T-SQL"
  - source: "Modular Monolith"
    destination: "Redis Cache"
    description: "Reads and writes read-model projections"
    technology: "Redis Protocol"
  - source: "Azure Service Bus"
    destination: "Integration Worker with ACL"
    description: "Triggers asynchronous integration tasks"
    technology: "AMQP"
  - source: "Integration Worker with ACL"
    destination: "Legacy Mainframe COBOL/DB2 System"
    description: "Synchronizes data using file/batch payloads"
    technology: "mTLS"
  - source: "On-Premises Active Directory"
    destination: "Azure API Management Gateway"
    description: "Authenticates users via identity federation"
    technology: "OAuth2/OIDC"