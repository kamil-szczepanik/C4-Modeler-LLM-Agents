level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A comprehensive platform designed for public and academic libraries to catalogue physical and digital items, manage circulation, and provide self-service portals with strict EU-only data residency."
elements:
  - type: "person"
    name: "Library Patrons & Staff"
    description: "Users who interact with the system for circulation, cataloging, and self-service portals."
  - type: "person"
    name: "Library Administrators"
    description: "Users who manage and administer the platform with elevated privileges."
  - type: "externalSystem"
    name: "External Payment Gateways"
    description: "External services used to process financial transactions."
  - type: "externalSystem"
    name: "External Digital Content Providers (OverDrive, JSTOR)"
    description: "External providers supplying digital books, articles, and media content."
  - type: "externalSystem"
    name: "Institutional SSO Providers"
    description: "External identity providers used for authentication."
  - type: "externalSystem"
    name: "Elasticsearch / OpenSearch"
    description: "Manages the catalogue search tier to satisfy high-performance search SLAs."
  - type: "externalSystem"
    name: "Terraform"
    description: "Enforces automated residency guardrails within Frankfurt and Dublin cloud availability zones."
  - type: "externalSystem"
    name: "OpenTelemetry"
    description: "Provides distributed tracing across API gateways and search clusters."
relationships:
  - source: "Library Patrons & Staff"
    destination: "Library Management System"
    description: "Interact via TLS 1.3 / OAuth 2.0 with OIDC"
    technology: "TLS 1.3, OAuth 2.0, OIDC"
  - source: "Library Administrators"
    destination: "Library Management System"
    description: "Authenticate via SAML 2.0 / OIDC with hardware-backed MFA"
    technology: "SAML 2.0, OIDC, Hardware-backed MFA"
  - source: "Library Management System"
    destination: "External Payment Gateways"
    description: "Integrates for payment processing"
    technology: "REST APIs, HTTPS"
  - source: "Library Management System"
    destination: "External Digital Content Providers (OverDrive, JSTOR)"
    description: "Integrates to access digital content"
    technology: "REST APIs, HTTPS"
  - source: "Library Management System"
    destination: "Institutional SSO Providers"
    description: "Authenticates users via institutional identity providers"
    technology: "SAML 2.0, OIDC"
  - source: "Library Management System"
    destination: "Elasticsearch / OpenSearch"
    description: "Queries catalogue search tier"
    technology: "REST APIs, HTTPS"