  - source: "PgBouncer"
    destination: "Dedicated read replica nodes"
    description: "Routes read queries using PostgreSQL wire protocol via mTLS"
  - source: "Patroni"
    destination: "Primary transactional write engine"
    description: "Manages failover orchestration and distributed consensus"