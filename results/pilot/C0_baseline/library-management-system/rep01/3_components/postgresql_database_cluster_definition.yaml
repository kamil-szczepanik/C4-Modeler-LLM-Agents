    name: "Primary transactional write engine"
    technology: "PostgreSQL"
    description: "Primary transactional storage ensuring strict ACID compliance."
  - type: "component"
    name: "Dedicated read replica nodes"
    technology: "PostgreSQL"
    description: "Read replica nodes for scaling read queries."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Connection proxy component providing connection pooling and request queuing."
