level: component
scope: "Component diagram for the Core Circulation & Catalog Service container"
parentContainer:
  name: "Core Circulation & Catalog Service"
elements:
  - type: "component"
    name: "CatalogManager"
    technology: "Java / Spring Boot"
    description: "Metadata handling for physical and digital library items."
  - type: "component"
    name: "CirculationEngine"
    technology: "Java / Spring Boot"
    description: "Loan workflows and fine calculations."
  - type: "component"
    name: "FinePolicyEngine"
    technology: "Java / Spring Boot"
    description: "Modular loan policies and fine rules."
  - type: "component"
    name: "InventoryRepository"
    technology: "Spring Data JPA"
    description: "Data persistence layer interacting with the PostgreSQL Database Cluster."
  - type: "component"
    name: "ExternalSyncAdapter"
    technology: "Spring Cloud Circuit Breaker"
    description: "Digital provider integration for external vendors like OverDrive and JSTOR."
relationships:
  - source: "CirculationEngine"
    destination: "FinePolicyEngine"
    description: "Applies loan policies and calculates fines"
  - source: "CirculationEngine"
    destination: "InventoryRepository"
    description: "Persists loan and inventory state"
  - source: "CatalogManager"
    destination: "InventoryRepository"
    description: "Persists catalog metadata"
  - source: "CirculationEngine"
    destination: "ExternalSyncAdapter"
    description: "Synchronizes digital items and provider data"