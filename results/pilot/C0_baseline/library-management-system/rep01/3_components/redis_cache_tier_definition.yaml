level: component
scope: "Component diagram for the Redis Cache Tier container"
parentContainer:
  name: "Redis Cache Tier"
elements:
  - type: "component"
    name: "Redis OSS Core Engine"
    technology: "Redis OSS v7.2, Redis Cluster Topology"
    description: "Provides high-speed, low-latency in-memory data storage, cluster management, zero-data-loss failover, and AOF persistence with encrypted EBS."
  - type: "component"
    name: "Redis JSON and Search Modules"
    technology: "Redis JSON & Search Modules"
    description: "Enables complex faceted catalog queries and advanced data structures directly in memory."
  - type: "component"
    name: "Security and Access Control"
    technology: "Mutual TLS (mTLS) & Redis 6+ ACLs"
    description: "Secures wire protocol traffic and enforces strict cross-service access control and EU compliance."
  - type: "component"
    name: "Prometheus Redis Exporter"
    technology: "Prometheus Redis exporter, OpenTelemetry collector"
    description: "Scrapes and exposes operational metrics such as memory fragmentation and eviction rates."
relationships:
  - source: "Core Circulation & Catalog Service"
    destination: "Redis OSS Core Engine"
    description: "Queries cache and triggers pub/sub invalidations [Redis Protocol over TCP port 6379]"
  - source: "Search Aggregator"
    destination: "Redis JSON and Search Modules"
    description: "Executes faceted queries and utilizes client-side caching [Redis Protocol over TCP port 6379]"
  - source: "Authentication & Session Service"
    destination: "Redis OSS Core Engine"
    description: "Manages session tokens via Redis Hashes [Redis Protocol over TCP port 6379]"
  - source: "Prometheus Redis Exporter"
    destination: "Prometheus"
    description: "Scrapes metrics (memory fragmentation, eviction rates) [HTTP]"