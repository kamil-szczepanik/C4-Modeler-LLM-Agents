level: component
scope: "Component diagram for the Search Aggregator container"
parentContainer:
  name: "Search Aggregator"
elements:
  - type: "component"
    name: "GraphQL Resolver Layer"
    technology: "Apollo Server, Node.js"
    description: "Component for query parsing, schema federation, rate-limiting, and RBAC."
  - type: "component"
    name: "Query Planner & Fan-Out Engine"
    technology: "Node.js"
    description: "Component for parallel execution and circuit-breaking."
  - type: "component"
    name: "Search Result Cacher"
    technology: "Redis Cache Tier"
    description: "Component for rapid retrieval of frequent queries."
  - type: "component"
    name: "Facet & Weighting Engine"
    technology: "Node.js"
    description: "Component for dynamic multi-segment filtering."
  - type: "component"
    name: "Telemetry Streamer"
    technology: "OpenTelemetry, Prometheus"
    description: "Component for offloading search interaction metrics."
relationships:
  - source: "Mobile API Gateway"
    destination: "GraphQL Resolver Layer"
    description: "gRPC over TLS"
  - source: "GraphQL Resolver Layer"
    destination: "Query Planner & Fan-Out Engine"
    description: "Invokes parallel query execution"
  - source: "Query Planner & Fan-Out Engine"
    destination: "Core Circulation & Catalog Service"
    description: "gRPC over TLS"
  - source: "Query Planner & Fan-Out Engine"
    destination: "Elasticsearch / OpenSearch Cluster"
    description: "Queries catalog search index [REST APIs, HTTPS]"
  - source: "Query Planner & Fan-Out Engine"
    destination: "Search Result Cacher"
    description: "Caches search results [Redis protocol, mTLS, AES-256]"
  - source: "Facet & Weighting Engine"
    destination: "Elasticsearch / OpenSearch Cluster"
    description: "Multi-segment filtering queries"
  - source: "Telemetry Streamer"
    destination: "Asynchronous Notification Worker"
    description: "Offloads telemetry [Internal message queues]"