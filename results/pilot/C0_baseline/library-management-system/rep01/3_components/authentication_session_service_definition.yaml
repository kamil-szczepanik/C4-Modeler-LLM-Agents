level: component
scope: "Component diagram for the Authentication & Session Service container"
parentContainer:
  name: "Authentication & Session Service"
elements:
  - type: "component"
    name: "OIDC/SAML Federation Adapter"
    technology: "Passport.js"
    description: "Component using Passport.js for institutional SSO."
  - type: "component"
    name: "Local Credential Verifier"
    technology: "Argon2id"
    description: "Component using Argon2id for public patron passwords."
  - type: "component"
    name: "Session Manager"
    technology: "Redis"
    description: "Component using Redis for token state validation and session handling."
  - type: "component"
    name: "RBAC Authorization Engine"
    technology: "Casbin"
    description: "Component using Casbin for fine-grained permission enforcement."
  - type: "component"
    name: "Institutional SSO Providers"
    technology: "External Identity Provider"
    description: "External identity providers."
  - type: "component"
    name: "Core Circulation & Catalog Service"
    technology: "gRPC over TLS"
    description: "External service validating sessions via gRPC over TLS with mTLS."
  - type: "component"
    name: "Mobile API Gateway"
    technology: "gRPC over TLS"
    description: "External gateway querying session state via gRPC over TLS."
relationships:
  - source: "OIDC/SAML Federation Adapter"
    destination: "Institutional SSO Providers"
    description: "Authenticates via HTTPS using SAML 2.0 and OIDC."
  - source: "Core Circulation & Catalog Service"
    destination: "Session Manager"
    description: "Validates sessions via gRPC over TLS with mTLS."
  - source: "Mobile API Gateway"
    destination: "Session Manager"
    description: "Queries session state via gRPC over TLS."