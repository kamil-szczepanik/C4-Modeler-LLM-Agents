level: component
scope: "Component diagram for the Asynchronous Notification Worker container"
parentContainer:
  name: "Asynchronous Notification Worker"
elements:
  - type: "component"
    name: "Queue Consumer Component"
    technology: "Python, asyncio, HMAC-SHA256"
    description: "Consumes queued events with HMAC-SHA256 validation."
  - type: "component"
    name: "Template Engine Component"
    technology: "Jinja2"
    description: "Renders ephemeral memory templates with zero PII logging."
  - type: "component"
    name: "Gateway Dispatcher Component"
    technology: "TLS 1.3, Circuit Breakers"
    description: "Dispatches messages securely to external providers with circuit breakers."
  - type: "component"
    name: "Redis Cache Tier"
    technology: "Redis, RESP3"
    description: "Handles deduplication, rate-limiting, and durable retry state machine."
  - type: "component"
    name: "Core Circulation & Catalog Service"
    technology: "Java, Spring Boot"
    description: "Triggers notification events via gRPC over TLS with HMAC-SHA256 payload signing."
  - type: "component"
    name: "External SMTP Relays and SMS Gateways"
    technology: "EU-region SMTP/SMS Protocols"
    description: "Receives final dispatched notifications over TLS 1.3 with certificate pinning."
relationships:
  - source: "Core Circulation & Catalog Service"
    destination: "Queue Consumer Component"
    description: "Triggers events via mTLS [gRPC over TLS] with HMAC-SHA256 payload signing"
  - type: "source"
    destination: ""
    description: ""
  - source: "Queue Consumer Component"
    destination: "Redis Cache Tier"
    description: "Deduplicates messages and manages retry states [RESP3]"
  - source: "Queue Consumer Component"
    destination: "Template Engine Component"
    description: "Renders notification templates"
  - source: "Template Engine Component"
    destination: "Gateway Dispatcher Component"
    description: "Sends rendered messages for dispatch"
  - source: "Gateway Dispatcher Component"
    destination: "External SMTP Relays and SMS Gateways"
    description: "Dispatches messages [TLS 1.3 with certificate pinning]"