level: component
scope: "Component diagram for the Integration Service container"
parentContainer:
  name: "Integration Service"
elements:
  - type: "component"
    name: "Webhook Receiver"
    technology: "FastAPI"
    description: "Provides high-performance API endpoints for webhook ingestion with schema validation and invokes updates to the core service."
  - type: "component"
    name: "Task Dispatcher"
    technology: "Celery"
    description: "Coordinates asynchronous jobs and background task execution via message broker queues."
  - type: "component"
    name: "Provider Adapters Module"
    technology: "Python"
    description: "Synchronizes data with external digital content providers via outbound egress filtering."
  - type: "component"
    name: "Sync State Manager"
    technology: "Python"
    description: "Tracks transaction state and patron metadata with column-level encryption."
  - type: "component"
    name: "Redis Cache Tier"
    technology: "Redis"
    description: "Acts as the message broker with persistence enabled (AOF/RDB) for Celery queues."
  - type: "component"
    name: "Core Circulation & Catalog Service"
    technology: "Java/Spring Boot"
    description: "External core service that receives updates via gRPC over mTLS."
  - type: "component"
    name: "PostgreSQL Database Cluster"
    technology: "PostgreSQL"
    description: "Stores transaction states and patron metadata with column-level encryption."
  - type: "component"
    name: "External Payment Gateways"
    technology: "HTTPS"
    description: "External provider handling payment processing and callback events."
  - type: "component"
    name: "OverDrive and JSTOR Digital Content Providers"
    technology: "HTTPS, TLS 1.3"
    description: "External digital content providers synchronized via outbound egress filtering."
relationships:
  - source: "Webhook Receiver"
    destination: "Core Circulation & Catalog Service"
    description: "Invokes updates via gRPC over mTLS [gRPC over TLS, mTLS]"
  - source: "Task Dispatcher"
    destination: "Redis Cache Tier"
    description: "Coordinates asynchronous jobs via message broker queues [Redis Protocol]"
  - source: "Provider Adapters Module"
    destination: "OverDrive and JSTOR Digital Content Providers"
    description: "Synchronizes data via outbound egress filtering [HTTPS, TLS 1.3]"
  - source: "Webhook Receiver"
    destination: "External Payment Gateways"
    description: "Receives callback events [Webhooks, HTTPS]"
  - source: "Sync State Manager"
    destination: "PostgreSQL Database Cluster"
    description: "Tracks transaction state with column-level encryption [PostgreSQL Protocol, TLS]"