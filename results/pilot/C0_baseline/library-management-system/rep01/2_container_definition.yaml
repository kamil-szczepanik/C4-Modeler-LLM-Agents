level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons & Staff"
    description: "Users who interact with the system for circulation, cataloging, and self-service portals."
  - type: "person"
    name: "Library Administrators"
    description: "Users who manage and administer the platform with elevated privileges."
  - type: "externalSystem"
    name: "External Payment Gateways"
    description: "External services used to process financial transactions."
  - type: "externalSystem"
    name: "OverDrive"
    description: "External digital content provider supplying books and media."
  - type: "externalSystem"
    name: "JSTOR"
    description: "External digital content provider supplying academic articles and media."
  - type: "externalSystem"
    name: "Institutional SSO Providers"
    description: "External identity providers used for authentication."
  - type: "externalSystem"
    name: "Elasticsearch / OpenSearch Cluster"
    description: "Cluster providing high-performance catalogue search indexing."
  - type: "container"
    name: "Web Application Frontend"
    technology: "React/TypeScript"
    description: "Provides the user interface for patrons, staff, and administrators."
  - type: "container"
    name: "Mobile API Gateway"
    technology: "Node.js/Express"
    description: "Manages and routes API requests from mobile and client applications."
  - type: "container"
    name: "Search Aggregator"
    technology: "Node.js/GraphQL"
    description: "Aggregates and serves search queries with sub-800ms latency requirements."
  - type: "container"
    name: "Core Circulation & Catalog Service"
    technology: "Java/Spring Boot"
    description: "Handles core business logic for item cataloging and circulation workflows."
  - type: "container"
    name: "Integration Service"
    technology: "Python/Celery"
    description: "Synchronizes data and handles integrations with external providers."
  - type: "container"
    name: "Authentication & Session Service"
    technology: "Node.js"
    description: "Manages user authentication, sessions, and security validation."
  - type: "container"
    name: "Asynchronous Notification Worker"
    technology: "Python"
    description: "Processes and dispatches asynchronous notifications."
  - type: "container"
    name: "PostgreSQL Database Cluster"
    technology: "PostgreSQL"
    description: "Stores stateful transactional data within EU cloud regions."
  - type: "container"
    name: "Redis Cache Tier"
    technology: "Redis"
    description: "Provides caching for high-speed data retrieval within EU cloud regions."
relationships:
  - source: "Library Patrons & Staff"
    destination: "Web Application Frontend"
    description: "Interact via HTTPS/REST and WebSockets"
    technology: "HTTPS, WebSockets"
  - source: "Library Patrons & Staff"
    destination: "Mobile API Gateway"
    description: "Interact via HTTPS/REST and WebSockets"
    technology: "HTTPS, WebSockets"
  - source: "Library Administrators"
    destination: "Web Application Frontend"
    description: "Manage system via HTTPS/REST"
    technology: "HTTPS, REST"
  - source: "Web Application Frontend"
    destination: "Mobile API Gateway"
    description: "Sends API requests"
    technology: "HTTPS/REST"
  - source: "Mobile API Gateway"
    destination: "Search Aggregator"
    description: "Communicates via gRPC over TLS"
    technology: "gRPC over TLS"
  - source: "Mobile API Gateway"
    destination: "Core Circulation & Catalog Service"
    description: "Communicates via gRPC over TLS"
    technology: "gRPC over TLS"
  - source: "Search Aggregator"
    destination: "Core Circulation & Catalog Service"
    description: "Communicates via gRPC over TLS"
    technology: "gRPC over TLS"
  - source: "Core Circulation & Catalog Service"
    destination: "Authentication & Session Service"
    description: "Validates sessions via mTLS"
    technology: "gRPC over TLS, mTLS"
  - source: "Integration Service"
    destination: "Core Circulation & Catalog Service"
    description: "Synchronizes data via mTLS"
    technology: "gRPC over TLS, mTLS"
  - source: "Asynchronous Notification Worker"
    destination: "Core Circulation & Catalog Service"
    description: "Communicates internally via mTLS"
    technology: "gRPC over TLS, mTLS"
  - source: "Integration Service"
    destination: "External Payment Gateways"
    description: "Integrates via webhooks and outbound egress filtering"
    technology: "Webhooks, HTTPS"
  - source: "Integration Service"
    destination: "OverDrive"
    description: "Synchronizes via webhooks and outbound egress filtering"
    technology: "Webhooks, HTTPS"
  - source: "Integration Service"
    destination: "JSTOR"
    description: "Synchronizes via webhooks and outbound egress filtering"
    technology: "Webhooks, HTTPS"
  - source: "Authentication & Session Service"
    destination: "Institutional SSO Providers"
    description: "Authenticates via SSO protocols"
    technology: "SAML 2.0, OIDC"
  - source: "Core Circulation & Catalog Service"
    destination: "PostgreSQL Database Cluster"
    description: "Queries stateful transactional data"
    technology: "PostgreSQL Protocol"
  - source: "Core Circulation & Catalog Service"
    destination: "Redis Cache Tier"
    description: "Queries cache tier"
    technology: "Redis Protocol"
  - source: "Search Aggregator"
    destination: "Elasticsearch / OpenSearch Cluster"
    description: "Queries catalog search index"
    technology: "REST APIs, HTTPS"