level: component
scope: "Component diagram for the EU National E-Prescription Formatters container"
parentContainer:
  name: "EU National E-Prescription Formatters"
elements:
  - type: "component"
    name: "Template Engine Component"
    technology: "Spring Boot, Java, HL7/XML parsing ecosystems"
    description: "Translates clinical data into national EU e-prescription formats."
  - type: "component"
    name: "Validation Engine Component"
    technology: "Spring Boot, Java, XMLDSig"
    description: "Validates formatted e-prescriptions and applies digital signatures."
  - type: "component"
    name: "Gateway Connector Component"
    technology: "Spring Boot, Java, Resilience4j"
    description: "Sends formatted e-prescriptions to EU National E-Prescription Gateways with circuit breakers and backoff retries."
  - type: "component"
    name: "Go Clinical Workspace Service"
    technology: "Go, gRPC"
    description: "Caller service that invokes serialization."
  - type: "component"
    name: "EU National E-Prescription Gateways"
    technology: "REST over HTTPS, mTLS, XMLDSig"
    description: "External system receiving compliant cross-border e-prescriptions."
  - type: "component"
    name: "GCP Secret Manager"
    technology: "API"
    description: "External system providing X.509 client certificates."
relationships:
  - source: "Go Clinical Workspace Service"
    destination: "Template Engine Component"
    description: "Invokes serialization [gRPC]"
  - source: "Template Engine Component"
    destination: "Validation Engine Component"
    description: "Passes formatted prescription for validation and signing"
  - source: "Validation Engine Component"
    destination: "Gateway Connector Component"
    description: "Passes validated e-prescription for transmission"
  - source: "Gateway Connector Component"
    destination: "EU National E-Prescription Gateways"
    description: "Sends formatted e-prescriptions [REST over HTTPS, mTLS, XMLDSig]"
  - source: "Gateway Connector Component"
    destination: "GCP Secret Manager"
    description: "Retrieves X.509 client certificates [API]"