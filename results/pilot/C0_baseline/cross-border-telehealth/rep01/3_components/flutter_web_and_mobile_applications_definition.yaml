level: component
scope: "Component diagram for the Flutter Web and Mobile Applications container"
parentContainer:
  name: "Flutter Web and Mobile Applications"
elements:
  - type: "component"
    name: "Presentation Layer (UI)"
    technology: "Flutter / Dart"
    description: "Adaptive screens for patient onboarding, telehealth consultations, and clinician workflows."
  - type: "component"
    name: "State Management Engine"
    technology: "Riverpod"
    description: "Coordinator for asynchronous data synchronization and offline-first resilience."
  - type: "component"
    name: "Local Secure Storage Service"
    technology: "SQLCipher with platform-secure hardware keys (Keychain/EncryptedSharedPreferences)"
    description: "Stores encrypted consent profiles and draft data securely on client devices."
  - type: "component"
    name: "Network & WebRTC Client"
    technology: "HTTPS/TLS 1.3, WebSockets, WebRTC, mediasoup"
    description: "Manages HTTPS/TLS 1.3, WebSockets, and adaptive bitrate streaming via mediasoup SFU."
  - type: "component"
    name: "AI Symptom Checker Wrapper"
    technology: "Flutter / Dart"
    description: "Validates input payloads and captures traceability metadata."
relationships:
  - source: "Patients & Clinicians"
    destination: "Presentation Layer (UI)"
    description: "Uses for UI interactions and telehealth consultations [HTTPS/TLS 1.3, WebRTC]"
  - source: "Network & WebRTC Client"
    destination: "GCP Cloud Armor & Envoy API Gateway"
    description: "Sends API requests and video streams [HTTPS/TLS 1.3, WebRTC over UDP/TCP]"
  - source: "Network & WebRTC Client"
    destination: "mediasoup SFU"
    description: "Streams adaptive video consultations [WebRTC]"
  - source: "State Management Engine"
    destination: "Local Secure Storage Service"
    description: "Reads/writes encrypted consent profiles and draft data [SQLCipher API]"
  - source: "AI Symptom Checker Wrapper"
    destination: "GCP Cloud Armor & Envoy API Gateway"
    description: "Dispatches validated symptom payloads [HTTPS/TLS 1.3]"