level: component
scope: "Component diagram for the AI Symptom Checker Container container"
parentContainer:
  name: "AI Symptom Checker Container"
elements:
  - type: "component"
    name: "Triage Orchestrator"
    technology: "Python, FastAPI"
    description: "Manages conversation flow and service coordination."
  - type: "component"
    name: "Model Inference Engine"
    technology: "Hugging Face Transformers"
    description: "Executes localized LLM inference."
  - type: "component"
    name: "Clinical Rule Validator"
    technology: "Pydantic"
    description: "Applies deterministic safety overrides and input validation."
  - type: "component"
    name: "Audit Logger"
    technology: "Python"
    description: "Handles regional traceability and immutable logging."
relationships:
  - source: "Node.js API Gateway"
    destination: "Triage Orchestrator"
    description: "Requests AI symptom analysis [Internal gRPC, mTLS]"
  - source: "Triage Orchestrator"
    destination: "Model Inference Engine"
    description: "Coordinates local inference [In-memory Python calls]"
  - source: "Triage Orchestrator"
    destination: "Clinical Rule Validator"
    description: "Coordinates validation [In-memory Python calls]"
  - source: "Audit Logger"
    destination: "Go Consent & Localization Engine"
    description: "Dispatches structured JSON payloads and model version tags [Internal gRPC, async]"