level: component
scope: "Component diagram for the US HL7 FHIR Adapters container"
parentContainer:
  name: "US HL7 FHIR Adapters"
elements:
  - type: "component"
    name: "FHIR Resource Mapper"
    technology: "Go / Python"
    description: "Transforms internal data models to and from HL7 FHIR standard formats."
  - type: "component"
    name: "Client Connection Pooler"
    technology: "Go"
    description: "Manages outbound mTLS connections and connection pooling to external US HL7 FHIR Engines."
  - type: "component"
    name: "Terminology Translator"
    technology: "Python / Rust"
    description: "Translates medical terminologies and codes for US healthcare system interoperability."
relationships:
  - source: "Client Connection Pooler"
    destination: "FHIR Resource Mapper"
    description: "Provides mapped FHIR resources over internal channels"
  - source: "FHIR Resource Mapper"
    destination: "Terminology Translator"
    description: "Requests code and terminology translations"