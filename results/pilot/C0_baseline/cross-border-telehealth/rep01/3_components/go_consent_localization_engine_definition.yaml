level: component
scope: "Component diagram for the Go Consent & Localization Engine container"
parentContainer:
  name: "Go Consent & Localization Engine"
elements:
  - type: "component"
    name: "Consent Manager"
    technology: "Go"
    description: "Manages patient consent records and compliance verification across jurisdictions."
  - type: "component"
    name: "Localization Engine"
    technology: "Go"
    description: "Handles regional language, timezone, and regulatory localization rules."
  - type: "component"
    name: "Audit Logger"
    technology: "Go"
    description: "Records access and consent changes for regulatory auditing purposes."
relationships:
  - source: "Consent Manager"
    destination: "Localization Engine"
    description: "Queries localization rules for specific jurisdictions"
  - source: "Consent Manager"
    destination: "Audit Logger"
    description: "Logs consent transactions"