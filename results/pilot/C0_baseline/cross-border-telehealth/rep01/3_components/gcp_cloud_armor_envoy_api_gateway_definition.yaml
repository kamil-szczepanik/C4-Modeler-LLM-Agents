level: component
scope: "Component diagram for the GCP Cloud Armor & Envoy API Gateway container"
parentContainer:
  name: "GCP Cloud Armor & Envoy API Gateway"
elements:
  - type: "component"
    name: "GCP Cloud Armor WAF"
    technology: "Google Cloud Armor"
    description: "Provides Layer 7 geo-based ACLs, DDoS protection, and rate limiting for regional compliance."
  - type: "component"
    name: "Envoy Edge Proxy"
    technology: "Envoy Proxy & GCP Traffic Director"
    description: "Handles dynamic routing, mTLS, and HTTP/2 connection multiplexing at the edge."
  - type: "component"
    name: "Edge Cache Manager"
    technology: "Redis"
    description: "Caches validated OAuth2 tokens and consent scopes to minimize latency for rural users."
  - type: "component"
    name: "CA Service Integrator"
    technology: "GCP Certificate Authority Service"
    description: "Automates short-lived certificate rotation for secure mTLS tunnels."
  - type: "component"
    name: "Observability Exporter"
    technology: "Prometheus & Grafana"
    description: "Scrapes Envoy metrics endpoints for latency and circuit breaker monitoring."
relationships:
  - source: "GCP Cloud Armor WAF"
    destination: "Envoy Edge Proxy"
    description: "Inspects and forwards filtered client traffic [HTTPS/TLS 1.3]"
  - source: "Envoy Edge Proxy"
    destination: "Edge Cache Manager"
    description: "Validates tokens and consent scopes synchronously [Redis Cache]"
  - source: "CA Service Integrator"
    destination: "Envoy Edge Proxy"
    description: "Provides short-lived certificates for mTLS tunnels"
  - source: "Observability Exporter"
    destination: "Envoy Edge Proxy"
    description: "Scrapes `/stats/prometheus` endpoints for metrics"