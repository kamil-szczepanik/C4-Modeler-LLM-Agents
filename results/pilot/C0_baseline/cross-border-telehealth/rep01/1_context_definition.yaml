level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides secure video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US, ensuring strict data residency and regulatory compliance."
elements:
  - type: "person"
    name: "Patients"
    description: "Patients in the EU and US seeking consultations, e-prescriptions, and AI symptom checks."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals providing secure video consultations and issuing prescriptions."
  - type: "externalSystem"
    name: "External Pharmacies"
    description: "Third-party pharmacies receiving e-prescription orders."
  - type: "externalSystem"
    name: "National E-Prescription Gateways"
    description: "Gateways handling national e-prescription compliance and routing."
  - type: "externalSystem"
    name: "Regional Identity Providers"
    description: "Providers handling authentication and identity mapping."
  - type: "container"
    name: "Regional API Gateways"
    description: "Entry points for UI interactions and routing traffic."
    technology: "HTTPS, REST, WebRTC"
  - type: "container"
    name: "WebRTC Media Servers"
    description: "Servers handling low-bandwidth video and audio consultations with adaptive TURN/STUN relays."
    technology: "WebRTC"
  - type: "container"
    name: "AI Symptom Checker Service"
    description: "Service providing traceable triage recommendations."
    technology: "gRPC over TLS"
  - type: "container"
    name: "Consent Management Service"
    description: "Service managing user consent and regulatory compliance policies."
    technology: "Terraform/Pulumi, OPA Gatekeeper"
  - type: "container"
    name: "Regional Databases"
    description: "Isolated storage instances ensuring zero cross-border database peering."
    technology: "GCP Regional Storage, Cloud KMS"
relationships:
  - source: "Patients"
    destination: "Regional API Gateways"
    description: "Interacts for UI interactions and video consultations"
    technology: "HTTPS/WebRTC"
  - source: "Licensed Clinicians"
    destination: "Regional API Gateways"
    description: "Interacts for UI interactions and video consultations"
    technology: "HTTPS/WebRTC"
  - source: "Regional API Gateways"
    destination: "External Pharmacies"
    description: "Sends e-prescriptions"
    technology: "TLS-encrypted REST and HL7 FHIR APIs"
  - source: "Regional API Gateways"
    destination: "National E-Prescription Gateways"
    description: "Sends e-prescriptions"
    technology: "TLS-encrypted REST and HL7 FHIR APIs"
  - source: "Regional API Gateways"
    destination: "WebRTC Media Servers"
    description: "Routes media streams for consultations"
    technology: "WebRTC"
  - source: "Regional API Gateways"
    destination: "AI Symptom Checker Service"
    description: "Requests triage recommendations"
    technology: "gRPC over TLS"
  - source: "AI Symptom Checker Service"
    destination: "Regional Databases"
    description: "Persists audit logs and encrypted data"
    technology: "Encrypted connections"
  - source: "Consent Management Service"
    destination: "Regional Databases"
    description: "Manages compliance and consent records"
    technology: "Encrypted connections"