level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients in the EU and US seeking consultations, e-prescriptions, and AI symptom checks."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals providing secure video consultations and issuing prescriptions."
  - type: "externalSystem"
    name: "US HL7 FHIR Engines"
    description: "External US healthcare systems handling HL7 FHIR interoperability."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways"
    description: "External EU gateways handling national e-prescription compliance and routing."
  - type: "container"
    name: "Flutter Web and Mobile Applications"
    technology: "Flutter Web, Mobile"
    description: "Client applications used by Patients and Licensed Clinicians."
  - type: "container"
    name: "GCP Cloud Armor & Envoy API Gateway"
    technology: "GCP Cloud Armor, Envoy, GCP Traffic Director"
    description: "Edge layer managing traffic ingress, security, and routing."
  - type: "container"
    name: "Node.js API Gateway"
    technology: "Node.js"
    description: "API gateway routing requests and handling client traffic."
  - type: "container"
    name: "Go Clinical Workspace Service"
    technology: "Go"
    description: "Service managing clinical workspace logic and operations."
  - type: "container"
    name: "Go Consent & Localization Engine"
    technology: "Go"
    description: "Engine ensuring strict regional data isolation and consent management."
  - type: "container"
    name: "AI Symptom Checker Container"
    technology: "Python, FastAPI"
    description: "AI-driven service providing triage recommendations and structured payload logging."
  - type: "container"
    name: "mediasoup WebRTC SFU"
    technology: "mediasoup, WebRTC"
    description: "Selective Forwarding Unit handling real-time video streaming."
  - type: "container"
    name: "US HL7 FHIR Adapters"
    technology: "Containerized Integration"
    description: "Integration container connecting to US HL7 FHIR engines."
  - type: "container"
    name: "EU National E-Prescription Formatters"
    technology: "Containerized Integration"
    description: "Integration container connecting to EU national e-prescription gateways."
relationships:
  - source: "Patients"
    destination: "Flutter Web and Mobile Applications"
    description: "Uses for UI interactions and telehealth consultations"
    technology: "HTTPS/TLS 1.3, WebRTC"
  - source: "Licensed Clinicians"
    destination: "Flutter Web and Mobile Applications"
    description: "Uses for clinical workspace and consultations"
    technology: "HTTPS/TLS 1.3, WebRTC"
  - source: "Flutter Web and Mobile Applications"
    destination: "GCP Cloud Armor & Envoy API Gateway"
    description: "Sends client requests and streams video"
    technology: "HTTPS/TLS 1.3, WebRTC over UDP/TCP"
  - source: "GCP Cloud Armor & Envoy API Gateway"
    destination: "Node.js API Gateway"
    description: "Routes incoming API traffic"
    technology: "mTLS, gRPC/REST"
  - source: "Node.js API Gateway"
    destination: "Go Clinical Workspace Service"
    description: "Delegates clinical domain logic"
    technology: "mTLS, gRPC/REST"
  - source: "Node.js API Gateway"
    destination: "Go Consent & Localization Engine"
    description: "Validates localization and consent rules"
    technology: "mTLS, gRPC/REST"
  - source: "Node.js API Gateway"
    destination: "AI Symptom Checker Container"
    description: "Requests AI symptom analysis"
    technology: "Internal gRPC"
  - source: "Node.js API Gateway"
    destination: "mediasoup WebRTC SFU"
    description: "Coordinates video streaming sessions"
    technology: "WebRTC"
  - source: "Go Clinical Workspace Service"
    destination: "US HL7 FHIR Adapters"
    description: "Integrates with US health records"
    technology: "REST"
  - source: "Go Clinical Workspace Service"
    destination: "EU National E-Prescription Formatters"
    description: "Formats and sends e-prescriptions"
    technology: "REST"
  - source: "AI Symptom Checker Container"
    destination: "Go Consent & Localization Engine"
    description: "Logs model versioning and structured payloads to regional storage"
    technology: "Internal gRPC"
  - source: "US HL7 FHIR Adapters"
    destination: "US HL7 FHIR Engines"
    description: "Connects to external US healthcare systems"
    technology: "REST APIs"
  - source: "EU National E-Prescription Formatters"
    destination: "EU National E-Prescription Gateways"
    description: "Connects to external EU e-prescription gateways"
    technology: "REST APIs"