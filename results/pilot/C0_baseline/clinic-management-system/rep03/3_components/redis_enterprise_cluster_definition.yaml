level: component
scope: "Component diagram for the Redis Enterprise cluster container"
parentContainer:
  name: "Redis Enterprise cluster"
elements:
  # Components within the parent container's boundary
  - type: "component"
    name: "Distributed Caching Engine"
    technology: "Redis Enterprise"
    description: "Delivers low-latency distributed caching for core clinical and billing data."
  - type: "component"
    name: "Session Management Engine"
    technology: "Redis Enterprise"
    description: "Manages user and system sessions securely across hybrid environments."
  - type: "component"
    name: "Appointment Locking Mechanism"
    technology: "Redis Enterprise with CRDTs"
    description: "Handles distributed appointment locking ensuring consistency and conflict-free replication."
relationships:
  - source: "Distributed Caching Engine"
    destination: "Session Management Engine"
    description: "Shares memory space and state data"
  - source: "Appointment Locking Mechanism"
    destination: "Distributed Caching Engine"
    description: "Utilizes caching infrastructure for lock states"