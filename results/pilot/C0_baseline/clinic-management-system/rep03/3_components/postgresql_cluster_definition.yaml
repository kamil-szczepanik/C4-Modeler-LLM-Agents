level: component
scope: "Component diagram for the PostgreSQL cluster container"
parentContainer:
  name: "PostgreSQL cluster"
elements:
  - type: "component"
    name: "PostgreSQL Primary and Standby Instances"
    technology: "PostgreSQL Core Engine"
    description: "Provides ACID-compliant relational persistence and replication."
  - type: "component"
    name: "Patroni"
    technology: "Patroni & Etcd"
    description: "Handles distributed consensus, automated failover, and leader election for 99.99% availability."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Handles high-concurrency connection pooling for Spring Boot microservices."
  - type: "component"
    name: "CloudNativePG / Patroni Kubernetes Operator"
    technology: "Kubernetes Operator"
    description: "Manages the deployment and lifecycle of the database cluster."
  - type: "component"
    name: "pgAudit"
    technology: "pgAudit & pgcrypto"
    description: "Delivers regulatory compliance audit trails and encryption."
  - type: "component"
    name: "Prometheus PostgreSQL Exporter"
    technology: "Prometheus Exporter"
    description: "Scrapes cluster health and replication metrics."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Manages short-lived, dynamic database credentials via SCRAM-SHA-256."
  - type: "component"
    name: "Local NVMe with dm-crypt"
    technology: "dm-crypt / AES-256"
    description: "Provides encrypted local storage and AES-256 encryption."
relationships:
  - source: "Core Clinical Services"
    destination: "PgBouncer"
    description: "Persists transactional clinical data [Secure TCP/TLS, port 5432, mTLS]"
  - source: "Finance & Billing"
    destination: "PgBouncer"
    description: "Persists financial data [Secure TCP/TLS, port 5432, mTLS]"
  - source: "PgBouncer"
    destination: "PostgreSQL Primary and Standby Instances"
    description: "Routes pooled connection queries [Secure TCP/TLS]"
  - source: "Prometheus PostgreSQL Exporter"
    destination: "Prometheus"
    description: "Scrapes cluster health and replication metrics [HTTP]"