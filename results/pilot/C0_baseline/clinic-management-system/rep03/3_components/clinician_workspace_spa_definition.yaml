level: component
scope: "Component diagram for the Clinician Workspace SPA container"
parentContainer:
  name: "Clinician Workspace SPA"
elements:
  - type: "component"
    name: "State Management Engine"
    technology: "Redux Toolkit"
    description: "Normalized local caching and state management for high-performance UI rendering."
  - type: "component"
    name: "Routing & Lazy-Loading Core"
    technology: "React Router with code-splitting"
    description: "Manages routing and code-splitting for role-specific bundles."
  - type: "component"
    name: "Role-Based Access Module"
    technology: "CASL"
    description: "Dynamic UI permission evaluation for authorized clinical and staff operations."
  - type: "component"
    name: "FHIR Client Wrapper"
    technology: "React 18 / JavaScript"
    description: "Handles interoperability and data exchange for clinical EMRs."
  - type: "component"
    name: "Offline Storage & Sync Manager"
    technology: "IndexedDB via Dexie.js with Web Crypto API"
    description: "Provides offline capabilities and encrypted local storage for cached PHI."
  - type: "component"
    name: "WebSocket Client Component"
    technology: "WebSockets / JavaScript"
    description: "Enables real-time data streams and updates with the API Gateway."
relationships:
  - source: "State Management Engine"
    destination: "FHIR Client Wrapper"
    description: "Provides cached state to"
  - source: "Routing & Lazy-Loading Core"
    destination: "Role-Based Access Module"
    description: "Evaluates permissions for"
  - source: "Offline Storage & Sync Manager"
    destination: "State Management Engine"
    description: "Syncs offline data with"
  - source: "WebSocket Client Component"
    destination: "State Management Engine"
    description: "Updates state via real-time streams"