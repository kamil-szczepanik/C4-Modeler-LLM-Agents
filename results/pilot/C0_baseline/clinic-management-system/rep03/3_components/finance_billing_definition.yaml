level: component
scope: "Component diagram for the Finance & Billing container"
parentContainer:
  name: "Finance & Billing"
elements:
  - type: "component"
    name: "InvoiceGenerator"
    technology: "Spring component"
    description: "Renders itemized patient statements."
  - type: "component"
    name: "ClaimProcessor"
    technology: "Spring WebFlux component"
    description: "Formats and submits ANSI X12/HL7 FHIR claims."
  - type: "component"
    name: "PaymentEngine"
    technology: "Spring component"
    description: "Integrates with external Payment Gateways using Resilience4j."
  - type: "component"
    name: "LedgerService"
    technology: "Spring Data JPA service"
    description: "Manages append-only, partitioned financial ledgers."
relationships:
  - source: "LedgerService"
    destination: "Apache Kafka"
    description: "Publishes payment and invoicing events using transactional outbox patterns."