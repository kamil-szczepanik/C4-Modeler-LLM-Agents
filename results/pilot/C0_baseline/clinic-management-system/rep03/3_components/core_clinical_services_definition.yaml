level: component
scope: "Component diagram for the Core Clinical Services container"
parentContainer:
  name: "Core Clinical Services"
elements:
  - type: "component"
    name: "Patient Admission Controller"
    technology: "Spring Boot REST Controller"
    description: "Manages patient admission workflows and intake processing."
  - type: "component"
    name: "EMR Service"
    technology: "Spring Boot Service"
    description: "Handles Electronic Medical Records retrieval and updates."
  - type: "component"
    name: "Scheduling Manager"
    technology: "Spring Boot Service"
    description: "Manages appointment scheduling and conflict prevention using Redis locking."
relationships:
  - source: "Patient Admission Controller"
    destination: "EMR Service"
    description: "Invokes EMR creation and updates"
  - source: "Scheduling Manager"
    destination: "EMR Service"
    description: "Coordinates appointment details with patient records"