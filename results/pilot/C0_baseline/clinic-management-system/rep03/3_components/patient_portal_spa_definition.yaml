level: component
scope: "Component diagram for the Patient Portal SPA container"
parentContainer:
  name: "Patient Portal SPA"
elements:
  - type: "component"
    name: "Routing Module"
    technology: "React Router / TypeScript"
    description: "Handles client-side routing and navigation within the patient portal."
  - type: "component"
    name: "Appointment Scheduler Component"
    technology: "React 18 / TypeScript"
    description: "Provides interface for patients to view, book, and manage clinical appointments."
  - type: "component"
    name: "Medical Records Viewer"
    technology: "React 18 / TypeScript"
    description: "Displays electronic medical records and test results to patients."
  - type: "component"
    name: "API Client"
    technology: "Fetch API / Axios"
    description: "Communicates securely with the API Gateway via HTTPS (TLS 1.3)."
relationships:
  - source: "Routing Module"
    destination: "Appointment Scheduler Component"
    description: "Renders based on URL"
  - source: "Routing Module"
    destination: "Medical Records Viewer"
    description: "Renders based on URL"
  - source: "Appointment Scheduler Component"
    destination: "API Client"
    description: "Sends scheduling requests"
  - source: "Medical Records Viewer"
    destination: "API Client"
    description: "Fetches patient records"