level: component
scope: "Component diagram for the Kafka event bus container"
parentContainer:
  name: "Kafka event bus"
elements:
  - type: "component"
    name: "Kafka Broker Cluster"
    technology: "Apache Kafka / KRaft via Strimzi"
    description: "Acts as the asynchronous messaging backbone ensuring real-time handoffs, audit logging, and high availability."
  - type: "component"
    name: "Confluent Schema Registry"
    technology: "Avro"
    description: "Enforces strict data contracts for clinical payload validation and HIPAA compliance."
  - type: "component"
    name: "Kafka Connect"
    technology: "Kafka Connect with HashiCorp Vault"
    description: "Offloads audit trails to cold storage and manages secure sink connectors."
  - type: "component"
    name: "Kafka Cruise Control"
    technology: "Apache Kafka Cruise Control"
    description: "Automates cluster balancing and management."
  - type: "component"
    name: "MirrorMaker 2"
    technology: "Apache Kafka MirrorMaker 2"
    description: "Handles geo-replication and cross-domain transit between On-Prem Kubernetes and AWS eu-central-1."
relationships:
  - source: "Core Clinical Services"
    destination: "Kafka Broker Cluster"
    description: "Publishes clinical and scheduling events using Kafka Producer API [TCP/TLS, mTLS, SASL/SCRAM-512]"
  - source: "Finance & Billing"
    destination: "Kafka Broker Cluster"
    description: "Consumes billing and claim events using Kafka Consumer API [TCP/TLS, mTLS, SASL/SCRAM-512]"
  - source: "Kafka Broker Cluster"
    destination: "Kafka Connect"
    description: "Offloads audit trails to cold storage [TCP/TLS]"
  - source: "On-Prem Kubernetes Cluster"
    destination: "AWS eu-central-1"
    description: "Geo-replication and cross-domain transit [MirrorMaker 2 via mTLS]"