level: component
scope: "Component diagram for the Elasticsearch container"
parentContainer:
  name: "Elasticsearch"
elements:
  - type: "component"
    name: "Lucene Index Engine"
    technology: "Lucene Index Engine"
    description: "Inverted index execution for sub-second query performance."
  - type: "component"
    name: "REST/Transport Interface layer"
    technology: "REST/Transport Interface"
    description: "Handles client requests and node communication over HTTP and transport protocols."
  - type: "component"
    name: "Document Routing & Sharding Module"
    technology: "Elasticsearch Routing"
    description: "Manages document routing, distribution, and shard synchronization."
  - type: "component"
    name: "Query Parser & Analyzer"
    technology: "Elasticsearch Analysis"
    description: "Parses and analyzes incoming search queries for full-text retrieval."
  - type: "component"
    name: "Index Lifecycle Management (ILM) Module"
    technology: "Elasticsearch ILM"
    description: "Manages hot-warm-cold tiering and offloading of cold indices."
  - type: "component"
    name: "Core Clinical Services"
    technology: "HTTPS, JSON, mTLS"
    description: "External service that queries and indexes EMR search data and audit logs."
  - type: "component"
    name: "Elasticsearch Nodes"
    technology: "Transport Protocol, TLS 1.3"
    description: "Cluster nodes handling shard synchronization and cluster state updates."
  - type: "component"
    name: "Object Storage"
    technology: "HTTPS, AES-256"
    description: "External storage for offloaded cold indices for long-term retention."
relationships:
  - source: "Core Clinical Services"
    destination: "REST/Transport Interface layer"
    description: "Queries and indexes EMR search data and audit logs [HTTPS, Port 9200, JSON, mTLS]"
  - type: "source"
    destination: "Elasticsearch Nodes"
    description: "Shard synchronization and cluster state updates [Transport Protocol, TLS 1.3, Ports 9300-9400]"
  - source: "Index Lifecycle Management (ILM) Module"
    destination: "Object Storage"
    description: "Offloads cold indices for long-term retention [HTTPS, AES-256]"
  - source: "REST/Transport Interface layer"
    destination: "Query Parser & Analyzer"
    description: "Passes incoming requests for analysis and execution"
  - source: "Query Parser & Analyzer"
    destination: "Lucene Index Engine"
    description: "Executes searches against the inverted index"
  - source: "REST/Transport Interface layer"
    destination: "Document Routing & Sharding Module"
    description: "Routes documents to appropriate shards"