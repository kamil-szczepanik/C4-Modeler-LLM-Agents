level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid-cloud platform that manages patient admissions, EMRs, scheduling, and billing, providing secure and highly available clinical operations while ensuring strict HIPAA and GDPR compliance."
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who interact with the system via the patient portal."
  - type: "person"
    name: "Front Desk Staff"
    description: "Administrative staff managing patient admissions and scheduling."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals managing electronic medical records (EMRs) and clinical operations."
  - type: "person"
    name: "Billing Specialists"
    description: "Financial staff handling claims and billing processing."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system for processing claims and payments."
  - type: "externalSystem"
    name: "Insurance Verification/RTE APIs"
    description: "External clearinghouse APIs for Real-Time Eligibility checks."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "External medical systems for laboratory and diagnostic imaging."
relationships:
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Accesses patient portal and clinical services"
    technology: "HTTPS over TLS 1.3 with OAuth2/MFA"
  - source: "Front Desk Staff"
    destination: "Clinic Management System"
    description: "Manages patient admissions and scheduling"
    technology: "HTTPS over TLS 1.3 with OAuth2/MFA"
  - source: "Clinicians"
    destination: "Clinic Management System"
    description: "Manages clinical operations and EMRs"
    technology: "HTTPS over TLS 1.3 with OAuth2/MFA"
  - source: "Billing Specialists"
    destination: "Clinic Management System"
    description: "Processes billing and claims"
    technology: "HTTPS over TLS 1.3 with OAuth2/MFA"
  - source: "Clinic Management System"
    destination: "Lab & Imaging Systems"
    description: "Exchanges medical data and test results"
    technology: "RESTful HL7 FHIR APIs over mTLS"
  - source: "Clinic Management System"
    destination: "Insurance Verification/RTE APIs"
    description: "Performs real-time insurance eligibility verification"
    technology: "TLS 1.3 with payload signatures"
  - source: "Clinic Management System"
    destination: "Payment Gateway"
    description: "Processes claims and financial transactions"
    technology: "Secure HTTPS"