level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who interact with the system via the patient portal."
  - type: "person"
    name: "Front Desk Staff"
    description: "Administrative staff managing patient admissions and scheduling."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals managing electronic medical records (EMRs) and clinical operations."
  - type: "person"
    name: "Billing Specialists"
    description: "Financial staff handling claims and billing processing."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system for processing claims and payments."
  - type: "externalSystem"
    name: "Insurance Verification/RTE APIs"
    description: "External clearinghouse APIs for Real-Time Eligibility checks."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "External medical systems for laboratory and diagnostic imaging."
  - type: "container"
    name: "Patient Portal SPA"
    technology: "React"
    description: "Powers the patient portal for interactive user interface."
  - type: "container"
    name: "Clinician Workspace SPA"
    technology: "React"
    description: "Powers the clinician workspace for interactive user interface."
  - type: "container"
    name: "API Gateway"
    technology: "Kong/Envoy"
    description: "Acts as secure API Gateway handling OAuth2/OIDC and RBAC/ABAC."
  - type: "container"
    name: "Core Clinical Services"
    technology: "Spring Boot"
    description: "Implements core clinical services and business logic."
  - type: "container"
    name: "Finance & Billing"
    technology: "Spring Boot"
    description: "Implements finance and billing business logic."
  - type: "container"
    name: "PostgreSQL cluster"
    technology: "PostgreSQL with PgBouncer"
    description: "Provides transactional persistence with AES-256 encryption at rest."
  - type: "container"
    name: "Elasticsearch"
    technology: "Elasticsearch"
    description: "Enables indexed EMR full-text searches and audit log queries."
  - type: "container"
    name: "Redis Enterprise cluster"
    technology: "Redis Enterprise"
    description: "Delivers low-latency caching and appointment locking."
  - type: "container"
    name: "Kafka event bus"
    technology: "Apache Kafka (Confluent/MSK)"
    description: "Handles asynchronous event messaging between clinical and billing domains."
relationships:
  - source: "Patients"
    destination: "Patient Portal SPA"
    description: "Accesses patient portal"
    technology: "HTTPS (TLS 1.3)"
  - source: "Front Desk Staff"
    destination: "Clinician Workspace SPA"
    description: "Manages admissions and scheduling"
    technology: "HTTPS (TLS 1.3)"
  - source: "Clinicians"
    destination: "Clinician Workspace SPA"
    description: "Manages EMRs and clinical operations"
    technology: "HTTPS (TLS 1.3)"
  - source: "Billing Specialists"
    destination: "Clinician Workspace SPA"
    description: "Accesses financial and billing operations"
    technology: "HTTPS (TLS 1.3)"
  - source: "Patient Portal SPA"
    destination: "API Gateway"
    description: "Routes requests to backend services"
    technology: "HTTPS (TLS 1.3)"
  - source: "Clinician Workspace SPA"
    destination: "API Gateway"
    description: "Routes requests to backend services"
    technology: "HTTPS (TLS 1.3)"
  - source: "API Gateway"
    destination: "Core Clinical Services"
    description: "Proxies requests to clinical backend"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Finance & Billing"
    description: "Proxies requests to finance backend"
    technology: "gRPC over mTLS"
  - source: "Core Clinical Services"
    destination: "Kafka event bus"
    description: "Publishes asynchronous events for billing decoupling"
    technology: "TCP/TLS"
  - source: "Core Clinical Services"
    destination: "PostgreSQL cluster"
    description: "Persists transactional clinical data"
    technology: "Secure TCP/TLS"
  - source: "Core Clinical Services"
    destination: "Elasticsearch"
    description: "Queries and indexes EMR search data and audit logs"
    technology: "Secure TCP/TLS"
  - source: "Core Clinical Services"
    destination: "Redis Enterprise cluster"
    description: "Caches data and handles appointment locking"
    technology: "Secure TCP/TLS"
  - source: "Finance & Billing"
    destination: "PostgreSQL cluster"
    description: "Persists financial data"
    technology: "Secure TCP/TLS"
  - source: "Finance & Billing"
    destination: "Redis Enterprise cluster"
    description: "Caches billing session data"
    technology: "Secure TCP/TLS"
  - source: "Lab & Imaging Systems"
    destination: "API Gateway"
    description: "Exchanges medical data and test results"
    technology: "HL7 FHIR over HTTPS REST"
  - source: "API Gateway"
    destination: "Insurance Verification/RTE APIs"
    description: "Performs real-time insurance eligibility checks"
    technology: "HTTPS REST"
  - source: "Finance & Billing"
    destination: "Payment Gateway"
    description: "Processes claims and financial transactions"
    technology: "HTTPS REST"