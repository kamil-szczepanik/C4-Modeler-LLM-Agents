level: component
scope: "Component diagram for the Billing Service container"
parentContainer:
  name: "Billing Service"
elements:
  - type: "component"
    name: "ClaimProcessor"
    technology: "Python, FastAPI"
    description: "Validates incoming claims and handles RBAC/OAuth2 entry points."
  - type: "component"
    name: "PaymentOrchestrator"
    technology: "Python, Celery, Redis"
    description: "Manages asynchronous payment tasks and gateway retries."
  - type: "component"
    name: "InvoiceManager"
    technology: "Python, SQLAlchemy"
    description: "Executes double-entry bookkeeping and persistence."
  - type: "component"
    name: "ReconciliationEngine"
    technology: "Python, Kubernetes CronJob"
    description: "Performs batch financial reconciliation."
  - type: "component"
    name: "External Payment Gateways"
    technology: "HTTPS"
    description: "Process credit card and insurance transactions."
  - type: "component"
    name: "PostgreSQL"
    technology: "PostgreSQL"
    description: "Relational database providing encrypted storage for financial ledger data."
  - type: "component"
    name: "Redis"
    technology: "Redis"
    description: "Manages task queues via TLS and SCRAM-SHA-512."
relationships:
  - source: "ClaimProcessor"
    destination: "InvoiceManager"
    description: "Invokes internal Python function calls for invoice creation"
  - source: "ClaimProcessor"
    destination: "PaymentOrchestrator"
    description: "Dispatches asynchronous jobs via Celery broker over mTLS"
  - source: "PaymentOrchestrator"
    destination: "External Payment Gateways"
    description: "Processes payments via REST/JSON over HTTPS"
  - source: "InvoiceManager"
    destination: "PostgreSQL"
    description: "Persists and queries data using encrypted TCP (AES-256)"
  - source: "ReconciliationEngine"
    destination: "PostgreSQL"
    description: "Persists and queries data using encrypted TCP (AES-256)"
  - source: "Billing Service Components"
    destination: "Redis"
    description: "Manages task queues via TLS and SCRAM-SHA-512"