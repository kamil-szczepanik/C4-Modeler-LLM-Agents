level: component
scope: "Component diagram for the EMR Backend container"
parentContainer:
  name: "EMR Backend"
elements:
  - type: "component"
    name: "EMR Orchestrator"
    technology: "Spring WebFlux"
    description: "Reactive, non-blocking request handling for low latency and high-throughput clinical workflows."
  - type: "component"
    name: "Clinical Data Access Layer"
    technology: "Spring Data JPA & HikariCP"
    description: "Queries and persists patient records using high-performance database connection pooling."
  - type: "component"
    name: "FHIR Interoperability Adapter"
    technology: "Spring Boot & HL7 FHIR"
    description: "Exchanges medical data with external systems via REST/HTTPS."
  - type: "component"
    name: "Audit Log Interceptor"
    technology: "Java"
    description: "Intercepts requests and writes immutable audit logs to WORM storage."
  - type: "component"
    name: "In-Memory Clinical Cache"
    technology: "Hazelcast"
    description: "In-memory distributed caching for emergency room offline resilience."
  - type: "component"
    name: "FHIR Event Consumer"
    technology: "Apache Kafka Client"
    description: "Ingests clinical events securely from the event broker."
  - type: "component"
    name: "PostgreSQL & WORM Storage"
    technology: "PostgreSQL & Cryptographic WORM"
    description: "Dual persistence model for transactional data and tamper-evident audit logs."
  - type: "component"
    name: "Apache Kafka Event Broker"
    technology: "Apache Kafka"
    description: "Asynchronous event streaming for decoupled lab ingestion."
  - type: "component"
    name: "Physician EMR Frontend"
    technology: "gRPC with mTLS"
    description: "External client frontend requesting clinical data."
  - type: "component"
    name: "External Systems"
    technology: "REST/HTTPS"
    description: "External medical systems interacting via HL7 FHIR."
relationships:
  - source: "Physician EMR Frontend"
    destination: "EMR Orchestrator"
    description: "Requests clinical data [gRPC with mTLS]"
  - source: "EMR Orchestrator"
    destination: "Clinical Data Access Layer"
    description: "Queries and persists patient records [Encrypted TCP (AES-256)]"
  - source: "FHIR Interoperability Adapter"
    destination: "External Systems"
    description: "Exchanges medical data [REST/HTTPS via HL7 FHIR]"
  - source: "FHIR Event Consumer"
    destination: "Apache Kafka Event Broker"
    description: "Ingests clinical events [TLS and SCRAM-SHA-512]"
  - source: "Audit Log Interceptor"
    destination: "PostgreSQL & WORM Storage"
    description: "Writes immutable audit logs [Cryptographic verification]"
  - source: "In-Memory Clinical Cache"
    destination: "In-Memory Clinical Cache"
    description: "Clusters cache replication across EMR Backend nodes [TLS 1.3 mTLS]"