level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Relational Data Store"
    technology: "PostgreSQL"
    description: "Handles transactional workloads for patient records, scheduling, and billing with robust ACID compliance, row-level security, and pgaudit support."
  - type: "component"
    name: "Audit Log Engine"
    technology: "WORM Storage (AWS S3 Object Lock & On-Premise WORM)"
    description: "Provides immutable, append-only electronic medical record audit logs to meet the 10-year immutable audit retention requirement."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Manages database connection pooling to prevent thread exhaustion under high concurrent loads."
relationships:
  - source: "PgBouncer"
    destination: "Relational Data Store"
    description: "Manages and pools database connections"
  - source: "Relational Data Store"
    destination: "Audit Log Engine"
    description: "Streams cryptographic audit events and logs"