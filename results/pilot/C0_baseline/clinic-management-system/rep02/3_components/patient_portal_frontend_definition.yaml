level: component
scope: "Component diagram for the Patient Portal Frontend container"
parentContainer:
  name: "Patient Portal Frontend"
elements:
  - type: "component"
    name: "Authentication Handler"
    technology: "React.js / Node.js"
    description: "Manages user authentication, multi-factor authentication, and communicates with the Enterprise IDP using OAuth 2.0 / OIDC."
  - type: "component"
    name: "Registration Module"
    technology: "React.js"
    description: "Handles patient registrations independently within the secure single-page application."
  - type: "component"
    name: "Scheduling Widget"
    technology: "React.js"
    description: "Enables patients to manage their scheduling and appointments."
  - type: "component"
    name: "Session Management Module"
    technology: "Node.js / React.js"
    description: "Manages active user sessions and enforces strict token security and zero plaintext PHI caching."
  - type: "component"
    name: "API Client Service"
    technology: "React.js / Node.js"
    description: "Routes client requests to the API Gateway via HTTPS and communicates with the Billing Service using gRPC with mTLS."
relationships:
  - source: "Authentication Handler"
    destination: "Enterprise IDP"
    description: "Manages user authentication and multi-factor auth [OAuth 2.0 / OIDC]"
  - source: "API Client Service"
    destination: "API Gateway"
    description: "Routes client requests and authenticates [HTTPS]"
  - source: "API Client Service"
    destination: "Billing Service"
    description: "Communicates for billing operations [gRPC with mTLS]"