# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients accessing the healthcare platform for scheduling and viewing records."
  - type: "person"
    name: "Receptionists"
    description: "Receptionists managing patient admissions and scheduling."
  - type: "person"
    name: "Physicians"
    description: "Physicians managing Electronic Medical Records (EMRs) and patient care."
  - type: "person"
    name: "Billing Specialists"
    description: "Billing specialists managing financial transactions and billing."
  - type: "externalSystem"
    name: "Payment Gateways"
    description: "External systems for processing patient payments."
  - type: "externalSystem"
    name: "Lab and Imaging Systems"
    description: "External medical systems providing lab results and imaging data."
  - type: "externalSystem"
    name: "Enterprise IDP"
    description: "External identity provider for authentication and token validation."
  - type: "container"
    name: "API Gateway"
    technology: "Go"
    description: "Secure entry point and API Gateway for handling incoming traffic."
  - type: "container"
    name: "Patient Portal Frontend"
    technology: "Node.js"
    description: "Frontend application providing secure patient portal services."
  - type: "container"
    name: "Physician EMR Frontend"
    technology: "React"
    description: "Frontend application providing physician EMR interfaces."
  - type: "container"
    name: "EMR Backend"
    technology: "Java Spring Boot"
    description: "Backend service managing physician EMRs and clinical logic."
  - type: "container"
    name: "Billing Service"
    technology: "Python"
    description: "Service managing billing and financial transactions."
  - type: "container"
    name: "Event Broker"
    technology: "Apache Kafka"
    description: "Asynchronous event-driven messaging and backpressure handling."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL & WORM Storage"
    description: "Relational data persistence and 10-year immutable audit logging."
relationships:
  - source: "Patients"
    destination: "API Gateway"
    description: "Accesses patient portal services"
    technology: "HTTPS / OAuth2/OIDC / mTLS"
  - source: "Receptionists"
    destination: "API Gateway"
    description: "Manages admissions and scheduling"
    technology: "HTTPS / OAuth2/OIDC / mTLS"
  - source: "Physicians"
    destination: "API Gateway"
    description: "Accesses EMR services"
    technology: "HTTPS / OAuth2/OIDC / mTLS"
  - source: "Billing Specialists"
    destination: "API Gateway"
    description: "Manages billing services"
    technology: "HTTPS / OAuth2/OIDC / mTLS"
  - source: "Lab and Imaging Systems"
    destination: "API Gateway"
    description: "Exchanges medical data and test results"
    technology: "REST/JSON over HTTPS using HL7 FHIR standards"
  - source: "API Gateway"
    destination: "Patient Portal Frontend"
    description: "Routes requests to patient frontend"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Physician EMR Frontend"
    description: "Routes requests to physician frontend"
    technology: "HTTPS"
  - source: "Patient Portal Frontend"
    destination: "Billing Service"
    description: "Communicates for billing operations"
    technology: "gRPC with mTLS"
  - source: "Physician EMR Frontend"
    destination: "EMR Backend"
    description: "Communicates for EMR operations"
    technology: "gRPC with mTLS"
  - source: "EMR Backend"
    destination: "Event Broker"
    description: "Publishes and consumes events"
    technology: "TLS and SCRAM-SHA-512"
  - source: "Billing Service"
    destination: "Event Broker"
    description: "Publishes and consumes events"
    technology: "TLS and SCRAM-SHA-512"
  - source: "EMR Backend"
    destination: "Database"
    description: "Persists and retrieves EMR data and audit logs"
    technology: "Encrypted TCP (AES-256)"
  - source: "Billing Service"
    destination: "Database"
    description: "Persists billing data"
    technology: "Encrypted TCP (AES-256)"
  - source: "Billing Service"
    destination: "Payment Gateways"
    description: "Processes payments"
    technology: "REST/JSON over HTTPS"