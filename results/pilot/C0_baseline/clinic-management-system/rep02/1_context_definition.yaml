level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid healthcare platform designed to manage patient admissions, EMRs, scheduling, and billing for clinics with HIPAA/GDPR compliance and 99.99% high availability."
elements:
  - type: "person"
    name: "Patients"
    description: "Patients accessing the healthcare platform for scheduling and viewing records."
  - type: "person"
    name: "Receptionists"
    description: "Receptionists managing patient admissions and scheduling."
  - type: "person"
    name: "Physicians"
    description: "Physicians managing Electronic Medical Records (EMRs) and patient care."
  - type: "person"
    name: "Billing Specialists"
    description: "Billing specialists managing financial transactions and billing."
  - type: "externalSystem"
    name: "Payment Gateways"
    description: "External systems for processing patient payments."
  - type: "externalSystem"
    name: "Lab and Imaging Systems"
    description: "External medical systems providing lab results and imaging data."
  - type: "externalSystem"
    name: "Enterprise IDP"
    description: "External identity provider for authentication and token validation."
relationships:
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Secure web and mobile access"
    technology: "HTTPS/TLS"
  - source: "Receptionists"
    destination: "Clinic Management System"
    description: "Manage patient admissions and scheduling"
    technology: "HTTPS/TLS"
  - source: "Physicians"
    destination: "Clinic Management System"
    description: "Manage EMRs and patient appointments"
    technology: "HTTPS/TLS"
  - source: "Billing Specialists"
    destination: "Clinic Management System"
    description: "Process and manage billing records"
    technology: "HTTPS/TLS"
  - source: "Clinic Management System"
    destination: "Payment Gateways"
    description: "Payment processing integration"
    technology: "REST/JSON APIs"
  - source: "Clinic Management System"
    destination: "Lab and Imaging Systems"
    description: "Exchange medical data and test results"
    technology: "HL7 FHIR over secure HTTPS"