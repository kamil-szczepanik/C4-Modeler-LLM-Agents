level: component
scope: "Component diagram for the Apache Kafka Event Bus container"
parentContainer:
  name: "Apache Kafka Event Bus"
elements:
  - type: "component"
    name: "Kafka Brokers"
    technology: "Apache Kafka, KRaft"
    description: "Handles distributed event streaming, log compaction, and message persistence across the event bus cluster."
  - type: "component"
    name: "Schema Registry"
    technology: "Apache Avro"
    description: "Manages and validates data schemas for messages produced and consumed across core clinical and scheduling services."
  - type: "component"
    name: "Strimzi Operator"
    technology: "Strimzi Operator"
    description: "Automates the management, provisioning, and scaling of the Apache Kafka cluster within the Kubernetes infrastructure."
relationships:
  - source: "Kafka Brokers"
    destination: "Schema Registry"
    description: "Validates message schemas"
  - source: "Strimzi Operator"
    destination: "Kafka Brokers"
    description: "Manages and deploys"