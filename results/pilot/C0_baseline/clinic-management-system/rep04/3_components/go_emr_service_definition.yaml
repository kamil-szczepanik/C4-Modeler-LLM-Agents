# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Go EMR Service container"
parentContainer:
  name: "Go EMR Service"
elements:
  - type: "component"
    name: "EMR Query Handler"
    technology: "Go, Redis Sentinel"
    description: "Manages read-optimized queries with Redis caching."
  - type: "component"
    name: "Clinical Command Processor"
    technology: "Go Routines, ABAC"
    description: "Executes write operations with Go routines and attribute-based access control (ABAC)."
  - type: "component"
    name: "Audit Log Interceptor"
    technology: "Go"
    description: "Generates immutable, cryptographically signed audit trails."
  - type: "component"
    name: "FHIR Adapter"
    technology: "Go, HL7 FHIR"
    description: "Translates internal models to HL7 FHIR resources."
  - type: "component"
    name: "Data Masking Engine"
    technology: "Go"
    description: "Dynamically redacts and tokenizes Protected Health Information (PHI)."
  - type: "component"
    name: "Async Event Publisher"
    technology: "Go, Apache Kafka"
    description: "Streams domain mutation events asynchronously."
relationships:
  - source: "EMR Query Handler"
    destination: "Redis Cluster"
    description: "Caches read-optimized data using TLS"
  - source: "Clinical Command Processor"
    destination: "PostgreSQL Cluster"
    description: "Persists transactional data with AES-256 storage encryption"
  - source: "Async Event Publisher"
    destination: "Apache Kafka Event Bus"
    description: "Streams asynchronous events using payload-level encryption (JWE)"
  - source: "API Gateway"
    destination: "EMR Query Handler"
    description: "Routes read requests using gRPC and REST over mTLS"
  - source: "API Gateway"
    destination: "Clinical Command Processor"
    description: "Routes write requests using gRPC and REST over mTLS"