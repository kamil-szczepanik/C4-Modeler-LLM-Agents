level: component
scope: "Component diagram for the Node.js Scheduling Service container"
parentContainer:
  name: "Node.js Scheduling Service"
elements:
  - type: "component"
    name: "REST API Controller"
    technology: "Express.js, JWT, Zod"
    description: "Handles incoming HTTP routes, JWT validation, Zod schema validation, and rate limiting."
  - type: "component"
    name: "Scheduling Engine"
    technology: "Node.js"
    description: "Encapsulates slot-allocation business logic, resource metadata, sanitation windows, and constraint calculations."
  - type: "component"
    name: "Resource Clash Detector"
    technology: "Redis, ioredis"
    description: "Utilizes Redis distributed locks via ioredis to prevent double-booking."
  - type: "component"
    name: "Persistence Repository"
    technology: "PostgreSQL, PgBouncer, pg"
    description: "Manages transactional writes, PgBouncer connection pooling, and the transactional outbox pattern to the PostgreSQL Cluster."
  - type: "component"
    name: "Kafka Event Publisher"
    technology: "Apache Kafka, kafkajs"
    description: "Emits AppointmentScheduled domain events asynchronously using kafkajs to Apache Kafka."
relationships:
  - source: "API Gateway"
    destination: "REST API Controller"
    description: "Routes authenticated HTTP/REST requests over mTLS."
  - source: "REST API Controller"
    destination: "Scheduling Engine"
    description: "Delegates validated booking requests"
  - source: "Scheduling Engine"
    destination: "Resource Clash Detector"
    description: "Acquires locks using ioredis over TLS 1.3."
  - source: "Scheduling Engine"
    destination: "Persistence Repository"
    description: "Requests transactional persistence for bookings"
  - source: "Persistence Repository"
    destination: "PostgreSQL Cluster"
    description: "Executes SQL transactions using the pg client over TLS 1.3."
  - source: "Persistence Repository"
    destination: "Kafka Event Publisher"
    description: "Triggers asynchronous event publishing via outbox pattern"
  - source: "Kafka Event Publisher"
    destination: "Apache Kafka Event Bus"
    description: "Publishes domain events over TLS."