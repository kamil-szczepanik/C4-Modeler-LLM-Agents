# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the React Single Page Application (SPA) container"
parentContainer:
  name: "React Single Page Application (SPA)"
elements:
  - type: "component"
    name: "Router & View Controller"
    technology: "React Router"
    description: "Manages client-side routing and page views for front desk, clinicians, billing, patients, and administrators."
  - type: "component"
    name: "State Management & Data Fetching"
    technology: "React Query"
    description: "Handles asynchronous data synchronization, caching, and state management for sub-second EMR loads."
  - type: "component"
    name: "Authentication & Security Module"
    technology: "OAuth2 / OpenID Connect Client"
    description: "Manages user login tokens, session security, and MFA enforcement via HTTPS."
relationships:
  - source: "Router & View Controller"
    destination: "State Management & Data Fetching"
    description: "Triggers data fetching requests"
  - source: "State Management & Data Fetching"
    destination: "API Gateway"
    description: "Sends perimeter requests via HTTPS"