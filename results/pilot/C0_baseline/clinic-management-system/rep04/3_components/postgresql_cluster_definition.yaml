level: component
scope: "Component diagram for the PostgreSQL Cluster container"
parentContainer:
  name: "PostgreSQL Cluster"
elements:
  - type: "component"
    name: "Primary Write Node"
    technology: "PostgreSQL"
    description: "Manages transactional writes, enforces ACID compliance, and handles primary data persistence."
  - type: "component"
    name: "Synchronous Standby Nodes"
    technology: "PostgreSQL"
    description: "Provides synchronous data replication to ensure zero-data-loss failover."
  - type: "component"
    name: "Read-Only Replica Nodes"
    technology: "PostgreSQL"
    description: "Executes analytical queries and offloads read traffic from the primary node."
  - type: "component"
    name: "PgBouncer Connection Pooler"
    technology: "PgBouncer"
    description: "Manages client connection pools efficiently to maintain low latency."
  - type: "component"
    name: "pgaudit Extension"
    technology: "pgaudit"
    description: "Enforces database auditability to comply with HIPAA and GDPR mandates."
  - type: "component"
    name: "HashiCorp Vault Secrets Manager"
    technology: "HashiCorp Vault"
    description: "Secures and rotates database superuser and replication credentials."
  - type: "component"
    name: "Patroni / CloudNativePG Orchestrator"
    technology: "Patroni / CloudNativePG"
    description: "Orchestrates high availability and automated failover across hybrid Kubernetes environments."
relationships:
  - source: "Go EMR Service"
    destination: "Primary Write Node"
    description: "Persists transactional data via PostgreSQL Wire Protocol over TCP/IP port 5432 with TLS 1.3 and SCRAM-SHA-256"
  - source: "Node.js Scheduling Service"
    destination: "Primary Write Node"
    description: "Manages appointment data via PostgreSQL Wire Protocol over TCP/IP port 5432 with TLS 1.3"
  - source: "Reporting Container"
    destination: "Read-Only Replica Nodes"
    description: "Executes analytical queries using PostgreSQL protocol"
  - source: "Primary Write Node"
    destination: "Synchronous Standby Nodes"
    description: "Replicates data using native PostgreSQL streaming replication"