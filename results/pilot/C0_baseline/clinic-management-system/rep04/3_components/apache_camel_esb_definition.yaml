level: component
scope: "Component diagram for the Apache Camel ESB container"
parentContainer:
  name: "Apache Camel ESB"
elements:
  - type: "component"
    name: "Route Orchestration Engine"
    technology: "Camel Java DSL"
    description: "Orchestrates integration workflows, mapping incoming data and dispatching messages."
  - type: "component"
    name: "FHIR Transformation Processor"
    technology: "Apache Camel DataFormats"
    description: "Maps incoming data and handles HL7 v2 to FHIR JSON mapping and schema validation."
  - type: "component"
    name: "Secure Protocol Adapter"
    technology: "Camel HTTP/Netty components"
    description: "Dispatches messages securely over HTTPS/mTLS."
  - type: "component"
    name: "Dead Letter Channel & Audit Logging Components"
    technology: "Apache Camel"
    description: "Handles integration fault-tolerance, failed payloads, and audit logging."
  - type: "component"
    name: "PostgreSQL Cluster"
    technology: "PostgreSQL with AES-256"
    description: "Persistent storage with encryption at rest for audit logs and DLC."
  - type: "component"
    name: "Redis Cluster"
    technology: "Redis"
    description: "High-performance caching and state management."
  - type: "component"
    name: "External Lab and Imaging Systems"
    technology: "HL7 FHIR APIs over HTTPS/mTLS"
    description: "External medical systems synchronized via the ESB."
relationships:
  - source: "Apache Camel ESB"
    destination: "External Lab and Imaging Systems"
    description: "Synchronizes data [HL7 FHIR APIs over HTTPS/mTLS]"
  - source: "Route Orchestration Engine"
    destination: "FHIR Transformation Processor"
    description: "Maps incoming data [direct-vm endpoints]"
  - source: "Route Orchestration Engine"
    destination: "Secure Protocol Adapter"
    description: "Dispatches messages [HTTPS/mTLS]"
  - source: "Route Orchestration Engine"
    destination: "PostgreSQL Cluster"
    description: "Persists failed payloads [JDBC with AES-256]"