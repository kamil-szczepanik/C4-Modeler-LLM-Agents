level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform that manages patient admissions, electronic medical records, scheduling, and billing for medium-sized clinics, ensuring high availability, regulatory compliance, and seamless interoperability."
elements:
  - type: "person"
    name: "Front Desk Staff"
    description: "Staff members responsible for managing patient admissions and scheduling."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals managing electronic medical records and patient care."
  - type: "person"
    name: "Billing Specialists"
    description: "Personnel managing patient and insurance billing."
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who interact with the system via the portal."
  - type: "person"
    name: "Clinic Administrators"
    description: "Administrators managing system policies, compliance, and configurations."
  - type: "externalSystem"
    name: "Third-Party Payment Gateways"
    description: "External systems processing financial transactions and payments."
  - type: "externalSystem"
    name: "External Insurance Verification Services"
    description: "External services used to verify patient insurance details."
  - type: "externalSystem"
    name: "External Lab and Imaging Systems"
    description: "External medical systems providing lab and imaging results."
  - type: "container"
    name: "Patient Portal Client"
    description: "Client-facing application for patient access."
    technology: "Web/Mobile"
  - type: "container"
    name: "API Gateways"
    description: "Segregated gateways managing ingress and routing."
    technology: "HTTPS/REST, mTLS"
  - type: "container"
    name: "Microservices"
    description: "Core business logic services orchestrated via Kubernetes."
    technology: "Kubernetes, Docker"
  - type: "container"
    name: "Transactional Databases"
    description: "Databases storing operational data."
    technology: "Relational/NoSQL Database"
  - type: "container"
    name: "Immutable Audit Log Storage"
    description: "Secure storage for compliance and audit logging."
    technology: "Secure Storage"
  - type: "component"
    name: "RBAC/ABAC Policy Engines"
    description: "Components enforcing role-based and attribute-based access control."
    technology: "Security Engine"
  - type: "component"
    name: "HL7 FHIR Adapters"
    description: "Adapters facilitating interoperability with healthcare standards."
    technology: "HL7 FHIR REST APIs"
  - type: "component"
    name: "Automated Circuit Breakers"
    description: "Fault tolerance and latency management mechanisms."
    technology: "Distributed Tracing / Circuit Breaker"
  - type: "component"
    name: "Envelope Encryption Modules"
    description: "Modules providing AES-256 with HSM encryption."
    technology: "AES-256, HSM"
relationships:
  - source: "Front Desk Staff"
    destination: "Clinic Management System"
    description: "Interacts with the CMS for admissions and scheduling"
    technology: "TLS-secured HTTPS"
  - source: "Clinicians"
    destination: "Clinic Management System"
    description: "Interacts with the CMS for EMR and patient management"
    technology: "TLS-secured HTTPS"
  - source: "Billing Specialists"
    destination: "Clinic Management System"
    description: "Interacts with the CMS for billing operations"
    technology: "TLS-secured HTTPS"
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Interacts with the CMS via the patient portal"
    technology: "TLS-secured HTTPS"
  - source: "Clinic Administrators"
    destination: "Clinic Management System"
    description: "Manages system configurations and policies"
    technology: "TLS-secured HTTPS"
  - source: "Clinic Management System"
    destination: "External Lab and Imaging Systems"
    description: "Integrates for lab and imaging data exchange"
    technology: "HL7 FHIR APIs over HTTPS/REST"
  - source: "Clinic Management System"
    destination: "Third-Party Payment Gateways"
    description: "Processes payments securely"
    technology: "Secure RESTful APIs"
  - source: "Clinic Management System"
    destination: "External Insurance Verification Services"
    description: "Verifies insurance coverage"
    technology: "Secure RESTful APIs"