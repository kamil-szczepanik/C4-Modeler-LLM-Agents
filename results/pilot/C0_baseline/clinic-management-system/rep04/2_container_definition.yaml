level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Front Desk Staff"
    description: "Staff members responsible for managing patient admissions and scheduling."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals managing electronic medical records and patient care."
  - type: "person"
    name: "Billing Specialists"
    description: "Personnel managing patient and insurance billing."
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who interact with the system via the portal."
  - type: "person"
    name: "Clinic Administrators"
    description: "Administrators managing system policies, compliance, and configurations."
  - type: "externalSystem"
    name: "Third-Party Payment Gateways"
    description: "External systems processing financial transactions and payments."
  - type: "externalSystem"
    name: "External Insurance Verification Services"
    description: "External services used to verify patient insurance details."
  - type: "externalSystem"
    name: "External Lab and Imaging Systems"
    description: "External medical systems providing lab and imaging results."
  - type: "container"
    name: "React Single Page Application (SPA)"
    technology: "React, CDN"
    description: "Frontend application served via CDN accessed by users."
  - type: "container"
    name: "API Gateway"
    technology: "NGINX / Kong, OAuth2, MFA"
    description: "Handles TLS termination, OAuth2, and MFA for perimeter requests."
  - type: "container"
    name: "Go EMR Service"
    technology: "Go, gRPC"
    description: "Backend service managing electronic medical records."
  - type: "container"
    name: "Node.js Scheduling Service"
    technology: "Node.js, REST"
    description: "Backend service managing appointment scheduling."
  - type: "container"
    name: "Reporting Container"
    technology: "Containerized Service"
    description: "Handles system reporting and analytics."
  - type: "container"
    name: "Apache Camel ESB"
    technology: "Apache Camel, HL7 FHIR"
    description: "Integration container for HL7 FHIR translations."
  - type: "container"
    name: "Apache Kafka Event Bus"
    technology: "Apache Kafka"
    description: "Event bus handling asynchronous messaging and events."
  - type: "container"
    name: "PostgreSQL Cluster"
    technology: "PostgreSQL, Read Replicas, AES-256"
    description: "Primary relational database cluster with read replicas for transactional storage."
  - type: "container"
    name: "Redis Cluster"
    technology: "Redis, Redis Sentinel, TLS"
    description: "Caching cluster for real-time slot locking."
relationships:
  - source: "Front Desk Staff"
    destination: "React Single Page Application (SPA)"
    description: "Accesses portal via HTTPS"
    technology: "HTTPS (TLS 1.3)"
  - source: "Clinicians"
    destination: "React Single Page Application (SPA)"
    description: "Accesses portal via HTTPS"
    technology: "HTTPS (TLS 1.3)"
  - source: "Billing Specialists"
    destination: "React Single Page Application (SPA)"
    description: "Accesses portal via HTTPS"
    technology: "HTTPS (TLS 1.3)"
  - source: "Patients"
    destination: "React Single Page Application (SPA)"
    description: "Accesses portal via HTTPS"
    technology: "HTTPS (TLS 1.3)"
  - source: "Clinic Administrators"
    destination: "React Single Page Application (SPA)"
    description: "Accesses portal via HTTPS"
    technology: "HTTPS (TLS 1.3)"
  - source: "React Single Page Application (SPA)"
    destination: "API Gateway"
    description: "Sends perimeter requests to the API Gateway"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Go EMR Service"
    description: "Routes requests to the EMR service"
    technology: "gRPC and REST over mTLS"
  - source: "API Gateway"
    destination: "Node.js Scheduling Service"
    description: "Routes requests to the scheduling service"
    technology: "gRPC and REST over mTLS"
  - source: "Go EMR Service"
    destination: "PostgreSQL Cluster"
    description: "Persists transactional data"
    technology: "AES-256 storage encryption"
  - source: "Node.js Scheduling Service"
    destination: "Redis Cluster"
    description: "Locks resources for scheduling"
    technology: "TLS"
  - source: "Apache Camel ESB"
    destination: "External Lab and Imaging Systems"
    description: "Synchronizes data using HL7 FHIR APIs"
    technology: "HL7 FHIR APIs over HTTPS"
  - source: "Clinic Management System"
    destination: "Third-Party Payment Gateways"
    description: "Integrates for payment processing"
    technology: "Secure RESTful APIs"
  - source: "Clinic Management System"
    destination: "External Insurance Verification Services"
    description: "Integrates for insurance verification"
    technology: "Secure RESTful APIs"