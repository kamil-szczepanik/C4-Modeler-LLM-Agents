level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who access the system."
  - type: "person"
    name: "Receptionists"
    description: "Clinic staff managing patient admissions and front-desk operations."
  - type: "person"
    name: "Attending Physicians"
    description: "Medical professionals managing electronic medical records and treatments."
  - type: "person"
    name: "Billing Specialists"
    description: "Financial staff handling patient billing, payments, and claims."
  - type: "person"
    name: "Clinic Administrators"
    description: "Management staff overseeing system configuration and compliance."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External system handling authentication and access control."
  - type: "externalSystem"
    name: "Third-Party Payment Gateways/Clearinghouses"
    description: "External financial systems for processing insurance claims and payments."
  - type: "externalSystem"
    name: "External Laboratory & Imaging Systems"
    description: "External systems providing medical lab results and diagnostic images."
  - type: "container"
    name: "Web Application Gateway"
    technology: "NGINX"
    description: "Entry point managing incoming traffic via HTTPS/TLS."
  - type: "container"
    name: "Core API Service"
    technology: "Node.js / NestJS"
    description: "Handles core business logic and API requests."
  - type: "container"
    name: "EMR Engine"
    technology: "Java / Spring Boot"
    description: "Engine responsible for electronic medical records management."
  - type: "container"
    name: "Billing Worker"
    technology: "Python / Celery"
    description: "Processes billing and financial asynchronous tasks."
  - type: "container"
    name: "Audit Logging Sidecar"
    technology: "Sidecar Proxy"
    description: "Handles WORM audit logging for compliance."
  - type: "container"
    name: "PostgreSQL Cluster"
    technology: "PostgreSQL with AES-256 and LUKS"
    description: "Transactional data store with read-replicas."
  - type: "container"
    name: "Redis"
    technology: "Redis"
    description: "Used for caching and distributed locking."
  - type: "container"
    name: "Kafka"
    technology: "Apache Kafka"
    description: "Message broker for asynchronous processing."
relationships:
  - source: "Patients"
    destination: "Web Application Gateway"
    description: "Accesses system services"
    technology: "HTTPS/TLS"
  - source: "Receptionists"
    destination: "Web Application Gateway"
    description: "Manages patient admissions"
    technology: "HTTPS/TLS"
  - source: "Attending Physicians"
    destination: "Web Application Gateway"
    description: "Views and updates EMRs"
    technology: "HTTPS/TLS"
  - source: "Billing Specialists"
    destination: "Web Application Gateway"
    description: "Processes billing"
    technology: "HTTPS/TLS"
  - source: "Clinic Administrators"
    destination: "Web Application Gateway"
    description: "Administers system"
    technology: "HTTPS/TLS"
  - source: "Web Application Gateway"
    destination: "Core API Service"
    description: "Routes API requests"
    technology: "gRPC over TLS"
  - source: "Core API Service"
    destination: "EMR Engine"
    description: "Communicates with EMR service"
    technology: "gRPC over TLS"
  - source: "Core API Service"
    destination: "PostgreSQL Cluster"
    description: "Persists transactional data"
    technology: "TCP"
  - source: "Core API Service"
    destination: "Redis"
    description: "Caches data and acquires locks"
    technology: "TCP"
  - source: "Core API Service"
    destination: "Kafka"
    description: "Publishes billing messages"
    technology: "TCP"
  - source: "EMR Engine"
    destination: "PostgreSQL Cluster"
    description: "Persists patient records"
    technology: "TCP"
  - source: "EMR Engine"
    destination: "Redis"
    description: "Caches EMR data"
    technology: "TCP"
  - source: "Billing Worker"
    destination: "Kafka"
    description: "Processes billing messages"
    technology: "TCP"
  - source: "Core API Service"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OAuth2/JWT"
  - source: "Core API Service"
    destination: "Third-Party Payment Gateways/Clearinghouses"
    description: "Processes payments and claims"
    technology: "REST/HTTPS"
  - source: "Core API Service"
    destination: "External Laboratory & Imaging Systems"
    description: "Integrates lab and imaging data"
    technology: "HL7 FHIR REST APIs"