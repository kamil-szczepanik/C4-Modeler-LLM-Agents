level: component
scope: "Component diagram for the PostgreSQL Cluster container"
parentContainer:
  name: "PostgreSQL Cluster"
elements:
  - type: "component"
    name: "Primary Database Node"
    technology: "PostgreSQL"
    description: "Manages write operations and DDL execution."
  - type: "component"
    name: "Synchronous Standby Nodes"
    technology: "PostgreSQL, Patroni with etcd"
    description: "Maintains zero-data-loss high availability via Patroni."
  - type: "component"
    name: "Asynchronous Read Replicas"
    technology: "PostgreSQL"
    description: "Scales query loads for EMR and billing operations."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Manages connection pooling and routes incoming application queries."
  - type: "component"
    name: "Audit Logging Sidecar"
    technology: "pgaudit"
    description: "Collects pgaudit security logs for immutable tracking."
  - type: "component"
    name: "WORM Object Storage"
    technology: "pg_backrest"
    description: "Stores automated pg_backrest archives for long-term retention."
relationships:
  - source: "Core API Service"
    destination: "PgBouncer"
    description: "Persists transactional data via PostgreSQL wire protocol over TCP with mTLS."
  - source: "EMR Engine"
    destination: "PgBouncer"
    description: "Queries patient records via PostgreSQL wire protocol over TCP with mTLS."
  - source: "Primary Database Node"
    destination: "Synchronous Standby Nodes"
    description: "Replicates transactions via streaming replication protocol over TLS 1.3."
  - source: "PostgreSQL Cluster"
    destination: "WORM Object Storage"
    description: "Exports automated pg_backrest archives for long-term retention."