level: component
scope: "Component diagram for the Kafka container"
parentContainer:
  name: "Kafka"
elements:
  - type: "component"
    name: "Broker Node Engine"
    technology: "Apache Kafka / KRaft"
    description: "Manages cluster coordination and partition leadership via KRaft protocol."
  - type: "component"
    name: "Partition Log Manager"
    technology: "Apache Kafka"
    description: "Handles immutable segment files and tiering to object storage."
  - type: "component"
    name: "Access Control & Auth Interceptor"
    technology: "Apache Ranger / mTLS / SASL/SCRAM"
    description: "Enforces security policies, mTLS, and token validation."
  - type: "component"
    name: "Core API Service"
    technology: "TCP"
    description: "Publishes billing and event streams."
  - type: "component"
    name: "Billing Worker"
    technology: "TCP"
    description: "Consumes event streams for financial processing."
relationships:
  - source: "Core API Service"
    destination: "Access Control & Auth Interceptor"
    description: "Publishes billing messages securely [TCP over TLS 1.3 / SASL/SCRAM]."
  - source: "Billing Worker"
    destination: "Partition Log Manager"
    description: "Consumes billing and event streams [TCP]."
  - source: "Broker Node Engine"
    destination: "Broker Node Engine"
    description: "Handles internal cluster consensus and replication [TCP over mTLS using KRaft]."