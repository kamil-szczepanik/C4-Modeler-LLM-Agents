level: component
scope: "Component diagram for the Billing Worker container"
parentContainer:
  name: "Billing Worker"
elements:
  - type: "component"
    name: "Task Consumer (Celery Worker)"
    technology: "Python / Celery"
    description: "Orchestrates event handling and background task execution."
  - type: "component"
    name: "Insurance Claim Formatter"
    technology: "Python"
    description: "Maps internal data models to HL7/X12 and regulatory formats."
  - type: "component"
    name: "Payment Gateway Client"
    technology: "Python, Tenacity"
    description: "Handles secure outbound communication with external clearinghouses and implements circuit breaker patterns."
  - type: "component"
    name: "Apache Kafka"
    technology: "Apache Kafka"
    description: "Message broker supplying asynchronous billing events via TCP."
  - type: "component"
    name: "PostgreSQL Cluster"
    technology: "PostgreSQL"
    description: "Persistent storage ensuring transactional idempotency and AES-256 encryption."
  - type: "component"
    name: "Redis"
    technology: "Redis"
    description: "State-locking backend supporting concurrent claim processing."
  - type: "component"
    name: "Third-Party Clearinghouses"
    technology: "External Service"
    description: "External systems receiving batch financial payloads via mutual TLS (mTLS) over HTTPS."
relationships:
  - source: "Billing Worker"
    destination: "Apache Kafka"
    description: "Consumes asynchronous claim generation tasks via amqp protocol over TCP."
  - source: "Billing Worker"
    destination: "PostgreSQL Cluster"
    description: "Persists transaction states and claims via direct TCP connections."
  - source: "Payment Gateway Client"
    destination: "Third-Party Clearinghouses"
    description: "Transmits batch financial payloads via mutual TLS (mTLS) over HTTPS."
  - source: "Task Consumer (Celery Worker)"
    destination: "Redis"
    description: "Manages distributed state locking for concurrent execution."