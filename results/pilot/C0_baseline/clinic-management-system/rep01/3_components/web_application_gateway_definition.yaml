level: component
scope: "Component diagram for the Web Application Gateway container"
parentContainer:
  name: "Web Application Gateway"
elements:
  - type: "component"
    name: "TLS Termination Module"
    technology: "NGINX"
    description: "Handles incoming HTTPS/TLS connections and decrypts traffic at the edge."
  - type: "component"
    name: "Reverse Proxy & Routing Engine"
    technology: "NGINX"
    description: "Routes client requests to downstream core services and APIs."
  - type: "component"
    name: "Rate Limiter & WAF Module"
    technology: "NGINX Module"
    description: "Provides Web Application Firewall protection, rate limiting, and forwards security telemetry."
  - type: "component"
    name: "JWT Validation Filter"
    technology: "NGINX / Lua or Custom C Module"
    description: "Validates JSON Web Tokens (JWT) for incoming client requests."
relationships:
  - source: "Rate Limiter & WAF Module"
    destination: "Audit Logging Sidecar"
    description: "Forwards security event telemetry"