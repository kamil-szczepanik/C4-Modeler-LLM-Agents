level: component
scope: "Component diagram for the EMR Engine container"
parentContainer:
  name: "EMR Engine"
elements:
  - type: "component"
    name: "EMR Controller"
    technology: "Spring REST / gRPC"
    description: "Facade handling ingress for the EMR Engine."
  - type: "component"
    name: "Clinical Record Service"
    technology: "Spring Boot, ABAC, Resilience4j"
    description: "Domain logic, validation, ABAC, and circuit breakers."
  - type: "component"
    name: "HL7 FHIR Transformer"
    technology: "HAPI FHIR, Spring WebFlux"
    description: "Reactive payload serialization and HL7 FHIR transformation."
  - type: "component"
    name: "Audit Interceptor"
    technology: "Chronicle Queue"
    description: "Event publisher for cryptographic non-repudiation."
  - type: "component"
    name: "PostgreSQL Cluster"
    technology: "PostgreSQL, AES-256, LUKS"
    description: "Primary data store for patient records."
  - type: "component"
    name: "Redis"
    technology: "Redis, In-memory encryption"
    description: "Hot patient data cache with TTL."
  - type: "component"
    name: "Audit Logging Sidecar"
    technology: "Sidecar Proxy"
    description: "Sidecar proxy for immutable logging."
relationships:
  - source: "Core API Service"
    destination: "EMR Controller"
    description: "Transmits requests via gRPC over TLS with mTLS."
  - source: "Clinical Record Service"
    destination: "PostgreSQL Cluster"
    description: "Persists patient records via TCP."
  - source: "Clinical Record Service"
    destination: "Redis"
    description: "Caches EMR data via TCP."
  - source: "Audit Interceptor"
    destination: "Audit Logging Sidecar"
    description: "Dispatches signed audit events."
  - source: "HL7 FHIR Transformer"
    destination: "External Systems"
    description: "Exchanges lab and imaging payloads via HL7 FHIR REST APIs."