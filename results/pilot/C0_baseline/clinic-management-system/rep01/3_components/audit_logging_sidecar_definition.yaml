level: component
scope: "Component diagram for the Audit Logging Sidecar container"
parentContainer:
  name: "Audit Logging Sidecar"
elements:
  - type: "component"
    name: "HTTP Log Interceptor"
    technology: "Go / Envoy Filter"
    description: "Captures operational events across hybrid cloud deployments without impacting clinical performance."
  - type: "component"
    name: "Asynchronous Buffer Queue"
    technology: "Golang channel-based ring buffer with local disk caching"
    description: "Buffers operational events to ensure zero data loss and fault tolerance during network partitions or cloud outages."
  - type: "component"
    name: "WORM Storage Exporter"
    technology: "Go"
    description: "Exports audit logs securely to immutable storage."
  - type: "component"
    name: "Indexer and Query Agent"
    technology: "Go with embedded SQLite/Bleve search index"
    description: "Provides query and search capabilities over audit logs for compliance officers."
relationships:
  - source: "HTTP Log Interceptor"
    destination: "Asynchronous Buffer Queue"
    description: "Pushes captured log events to"
  - source: "Asynchronous Buffer Queue"
    destination: "WORM Storage Exporter"
    description: "Feeds buffered events to"
  - source: "WORM Storage Exporter"
    destination: "Immutable S3 Bucket with Object Lock"
    description: "Sends cryptographically signed logs via HTTPS (TLS 1.3) with Object Lock to"
  - source: "Compliance Officers"
    destination: "Indexer and Query Agent"
    description: "Queries audit logs via secure gRPC management API with token-based auth and RBAC"