level: component
scope: "Component diagram for the Core API Service container"
parentContainer:
  name: "Core API Service"
elements:
  - type: "component"
    name: "API Gateway Controller Layer"
    technology: "Node.js / NestJS / Fastify"
    description: "Handles incoming routing and optimized throughput via Fastify adapters."
  - type: "component"
    name: "Domain Orchestration Service"
    technology: "Node.js / NestJS"
    description: "Executes business logic and manages clinical and administrative workflows."
  - type: "component"
    name: "Data Access Repository Layer"
    technology: "Prisma ORM"
    description: "Provides type-safe query management against the PostgreSQL database."
  - type: "component"
    name: "Security Interceptor"
    technology: "Node.js / NestJS"
    description: "Validates authentication, authorization, and ensures security policies."
  - type: "component"
    name: "Audit Dispatcher Component"
    technology: "Node.js / NestJS"
    description: "Dispatches logs and compliance events to the audit sidecar."
  - type: "component"
    name: "Interoperability Adapter Component"
    technology: "Node.js / NestJS"
    description: "Integrates with external systems using HL7 FHIR and gRPC."
  - type: "component"
    name: "Distributed Locking Component"
    technology: "Redis"
    description: "Coordinates atomic resource clash checks and distributed locking."
relationships:
  - source: "API Gateway Controller Layer"
    destination: "Security Interceptor"
    description: "Validates requests"
  - source: "Security Interceptor"
    destination: "Domain Orchestration Service"
    description: "Passes authenticated requests"
  - source: "Domain Orchestration Service"
    destination: "Data Access Repository Layer"
    description: "Queries transactional data"
  - source: "Domain Orchestration Service"
    destination: "Distributed Locking Component"
    description: "Coordinates locks"
  - source: "Domain Orchestration Service"
    destination: "Audit Dispatcher Component"
    description: "Dispatches audit events"
  - source: "Domain Orchestration Service"
    destination: "Interoperability Adapter Component"
    description: "Communicates externally"