level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid healthcare platform designed to manage patient admissions, EMRs, scheduling, and billing for clinics while ensuring high availability and strict HIPAA/GDPR compliance."
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who access the system via the Patient Portal."
  - type: "person"
    name: "Receptionists"
    description: "Clinic staff managing patient admissions and front-desk operations."
  - type: "person"
    name: "Attending Physicians"
    description: "Medical professionals managing electronic medical records (EMRs) and patient treatments."
  - type: "person"
    name: "Billing Specialists"
    description: "Financial staff handling patient billing, payments, and insurance claims."
  - type: "person"
    name: "Clinic Administrators"
    description: "Management staff overseeing system configuration, compliance, and administration."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External system handling authentication and access control using OAuth2/OIDC."
  - type: "externalSystem"
    name: "Third-Party Payment Gateways/Clearinghouses"
    description: "External financial systems for processing insurance claims and payments."
  - type: "externalSystem"
    name: "External Laboratory & Imaging Systems"
    description: "External systems providing medical lab results and diagnostic images via HL7 FHIR."
  - type: "container"
    name: "Patient Portal"
    description: "Interface allowing patients to interact with the clinic services."
    technology: "Web/Mobile Frontend"
  - type: "container"
    name: "EMR Service"
    description: "Service responsible for electronic medical records management."
    technology: "Microservice / Kubernetes"
  - type: "container"
    name: "Scheduling Service"
    description: "Service managing patient appointments and doctor schedules."
    technology: "Microservice / Kubernetes"
  - type: "container"
    name: "Billing Service"
    description: "Service managing financial transactions, billing, and insurance claims."
    technology: "Microservice / AWS"
  - type: "container"
    name: "API Gateway"
    description: "Entry point managing incoming traffic and security enforcement."
    technology: "HTTPS/TLS 1.3, MFA"
  - type: "container"
    name: "Service Mesh"
    description: "Internal network management tool ensuring secure hybrid traffic routing."
    technology: "Enterprise Service Mesh, mTLS"
relationships:
  - source: "Patients"
    destination: "API Gateway"
    description: "Accesses patient portal and services"
    technology: "HTTPS/TLS 1.3, Multi-Factor Authentication (MFA)"
  - source: "Receptionists"
    destination: "API Gateway"
    description: "Manages patient admissions and scheduling"
    technology: "HTTPS/TLS 1.3, Multi-Factor Authentication (MFA)"
  - source: "Attending Physicians"
    destination: "API Gateway"
    description: "Views and updates electronic medical records"
    technology: "HTTPS/TLS 1.3, Multi-Factor Authentication (MFA)"
  - source: "Billing Specialists"
    destination: "API Gateway"
    description: "Processes billing and insurance claims"
    technology: "HTTPS/TLS 1.3, Multi-Factor Authentication (MFA)"
  - source: "Clinic Administrators"
    destination: "API Gateway"
    description: "Administers system users and configurations"
    technology: "HTTPS/TLS 1.3, Multi-Factor Authentication (MFA)"
  - source: "Clinic Management System"
    destination: "Identity Provider"
    description: "Authenticates users and enforces access control"
    technology: "OAuth2/OIDC"
  - source: "Clinic Management System"
    destination: "External Laboratory & Imaging Systems"
    description: "Exchanges health data and lab results"
    technology: "HL7 FHIR APIs over mutual TLS (mTLS)"
  - source: "Clinic Management System"
    destination: "Third-Party Payment Gateways/Clearinghouses"
    description: "Processes payments and insurance claims"
    technology: "REST/HTTPS"