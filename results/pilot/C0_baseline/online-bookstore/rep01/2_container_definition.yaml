level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Customers"
    description: "End-users browsing the catalogue, making purchases, and managing orders."
  - type: "person"
    name: "Administrators"
    description: "System administrators managing platform operations, catalogue data, and system configurations."
  - type: "externalSystem"
    name: "Third-Party Shipping Providers"
    description: "External logistics and shipping partners handling order delivery."
  - type: "externalSystem"
    name: "Payment Gateway APIs"
    description: "External payment processors handling PCI-DSS compliant checkout."
  - type: "externalSystem"
    name: "Global Tax and Currency Conversion Service"
    description: "External financial service for global tax calculation and currency conversion."
  - type: "externalSystem"
    name: "Transactional Email and SMS Service Provider"
    description: "External messaging service for notifications."
  - type: "container"
    name: "React Single Page Application"
    technology: "React, Amazon CloudFront, AWS WAF"
    description: "Client-side single page application serving users with optimized global delivery."
  - type: "container"
    name: "ECS Fargate Go Microservices"
    technology: "Go, Amazon ECS Fargate, gRPC"
    description: "Backend container tier handling business logic, order fulfillment, and notifications."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "ACID-compliant transactional database for core application data."
  - type: "container"
    name: "AWS DynamoDB"
    technology: "AWS DynamoDB"
    description: "High-velocity catalogue and recommendation database."
  - type: "container"
    name: "Amazon SQS & SNS"
    technology: "Amazon SQS, Amazon SNS"
    description: "Event-driven messaging service for asynchronous workflows."
  - type: "container"
    name: "Redis"
    technology: "Redis"
    description: "Caching layer for currency and exchange rate data."
relationships:
  - source: "Customers"
    destination: "React Single Page Application"
    description: "Interacts with the application via secure edge connection"
    technology: "HTTPS (TLS 1.3), Amazon CloudFront, AWS WAF"
  - source: "Administrators"
    destination: "React Single Page Application"
    description: "Manages platform operations"
    technology: "HTTPS"
  - source: "React Single Page Application"
    destination: "ECS Fargate Go Microservices"
    description: "Communicates for backend operations and API requests"
    technology: "HTTPS, gRPC"
  - source: "ECS Fargate Go Microservices"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists and queries transactional data"
    technology: "TLS 1.3, AES-256"
  - source: "ECS Fargate Go Microservices"
    destination: "AWS DynamoDB"
    description: "Reads and writes catalogue and recommendation data"
    technology: "TLS 1.3, AES-256"
  - source: "ECS Fargate Go Microservices"
    destination: "Amazon SQS & SNS"
    description: "Publishes and consumes asynchronous events for order fulfillment and notifications"
    technology: "AWS SDK"
  - source: "ECS Fargate Go Microservices"
    destination: "Redis"
    description: "Reads exchange rates and currency caching"
    technology: "Redis Protocol"
  - source: "ECS Fargate Go Microservices"
    destination: "Third-Party Shipping Providers"
    description: "Dispatches shipping orders via restricted egress"
    technology: "HTTPS REST APIs"
  - source: "ECS Fargate Go Microservices"
    destination: "Payment Gateway APIs"
    description: "Processes secure payments via restricted egress"
    technology: "HTTPS REST APIs"
  - source: "ECS Fargate Go Microservices"
    destination: "Global Tax and Currency Conversion Service"
    description: "Retrieves tax rates and currency conversion data"
    technology: "HTTPS REST APIs"
  - source: "ECS Fargate Go Microservices"
    destination: "Transactional Email and SMS Service Provider"
    description: "Dispatches emails and SMS notifications"
    technology: "SMTP, HTTPS APIs"