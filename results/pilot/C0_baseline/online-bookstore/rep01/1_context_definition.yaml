level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "An Amazon-style e-commerce platform designed to provide global catalogue browsing, secure multi-currency checkout, and personalized book recommendations with high availability and scalability."
elements:
  - type: "person"
    name: "Customers"
    description: "End-users browsing the catalogue, making purchases, and managing orders via Web and Mobile clients."
  - type: "person"
    name: "Administrators"
    description: "System administrators managing platform operations, catalogue data, and system configurations."
  - type: "externalSystem"
    name: "Third-Party Shipping Providers"
    description: "External logistics and shipping partners handling order delivery."
  - type: "externalSystem"
    name: "Payment Gateway APIs"
    description: "External payment processors (e.g., Stripe) handling PCI-DSS compliant checkout."
  - type: "externalSystem"
    name: "Global CDN"
    description: "Edge caching network (e.g., AWS CloudFront) providing fast global content delivery."
  - type: "externalSystem"
    name: "Transactional Email and SMS Service Provider"
    description: "External messaging service (e.g., Amazon SES/SNS) for notifications."
  - type: "externalSystem"
    name: "Global Tax and Currency Conversion Service"
    description: "External financial service (e.g., Avalara) for global tax calculation and currency conversion."
  - type: "externalSystem"
    name: "AWS DynamoDB Global Tables"
    description: "Multi-region distributed database for low-latency state replication."
relationships:
  - source: "Customers"
    destination: "Global CDN"
    description: "Browsing and accessing the bookstore via secure connection"
    technology: "HTTPS/TLS 1.3"
  - source: "Administrators"
    destination: "Online Bookstore"
    description: "Managing platform operations and administration"
    technology: "HTTPS"
  - source: "Online Bookstore"
    destination: "Payment Gateway APIs"
    description: "Processing secure payments for checkout"
    technology: "HTTPS/REST/JSON"
  - source: "Online Bookstore"
    destination: "Third-Party Shipping Providers"
    description: "Dispatching and tracking shipping orders"
    technology: "Webhook and REST/JSON"
  - source: "Online Bookstore"
    destination: "Transactional Email and SMS Service Provider"
    description: "Sending transactional notifications to users"
    technology: "SMTP and HTTPS APIs"
  - source: "Online Bookstore"
    destination: "Global Tax and Currency Conversion Service"
    description: "Calculating taxes and converting currencies"
    technology: "REST/JSON over TLS 1.3"
  - source: "Online Bookstore"
    destination: "AWS DynamoDB Global Tables"
    description: "Persisting and replicating application state"
    technology: "internal mTLS and AWS KMS"