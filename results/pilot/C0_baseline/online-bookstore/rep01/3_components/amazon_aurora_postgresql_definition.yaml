level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL container"
parentContainer:
  name: "Amazon Aurora PostgreSQL"
elements:
  - type: "component"
    name: "Amazon Aurora PostgreSQL Primary Write Instance"
    technology: "PostgreSQL 15 engine"
    description: "Serves as the transactional backbone for secure order processing, inventory tracking, and multi-currency support with ACID compliance."
  - type: "component"
    name: "Amazon Aurora PostgreSQL Read Replicas"
    technology: "Distributed PostgreSQL 15 Engine"
    description: "Distributed across Availability Zones to support read workloads and high availability."
  - type: "component"
    name: "PgBouncer Connection Pooling Sidecar"
    technology: "PgBouncer"
    description: "Manages and pools database connections to handle high-volume microservice requests."
  - type: "component"
    name: "AWS Secrets Manager"
    technology: "AWS Secrets Manager"
    description: "Manages automated 30-day credential rotation."
  - type: "component"
    name: "AWS Key Management Service (AWS KMS)"
    technology: "AWS KMS"
    description: "Provides Transparent Data Encryption (TDE) via Customer Managed Keys."
  - type: "component"
    name: "Amazon CloudWatch and RDS Data Protection"
    technology: "Amazon CloudWatch"
    description: "Streams performance metrics, audit logs, and monitors data protection."
relationships:
  - source: "ECS Fargate Go Microservices"
    destination: "PgBouncer Connection Pooling Sidecar"
    description: "Manages database connections [TCP]"
  - source: "PgBouncer Connection Pooling Sidecar"
    destination: "Amazon Aurora PostgreSQL Primary Write Instance"
    description: "Executes queries and transactions [TCP, TLS 1.3, mTLS]"
  - source: "Amazon Aurora PostgreSQL Primary Write Instance"
    destination: "Amazon S3"
    description: "Stores continuous point-in-time backups [HTTPS]"
  - source: "Amazon Aurora PostgreSQL Primary Write Instance"
    destination: "Amazon CloudWatch and RDS Data Protection"
    description: "Streams performance metrics and audit logs [HTTPS]"