level: component
scope: "Component diagram for the ECS Fargate Go Microservices container"
parentContainer:
  name: "ECS Fargate Go Microservices"
elements:
  - type: "component"
    name: "HTTP/gRPC API Routers"
    technology: "Go, gRPC, HTTP"
    description: "Handles incoming requests from clients and internal microservices."
  - type: "component"
    name: "Domain Handlers"
    technology: "Go"
    description: "Processes domain-specific requests and coordinates workflows."
  - type: "component"
    name: "Business Logic Services"
    technology: "Go (Goroutines)"
    description: "Contains the core business logic, order fulfillment, and notification handling."
  - type: "component"
    name: "Data Access Repositories"
    technology: "Go, SQL, AWS SDK"
    description: "Manages persistence operations for databases and caches."
  - type: "component"
    name: "Event Consumers"
    technology: "Go, Amazon SQS, Amazon SNS"
    description: "Consumes and produces asynchronous messages and events."
  - type: "component"
    name: "Outbound Adapters"
    technology: "Go, HTTPS REST APIs"
    description: "Communicates with external integrations like payment gateways and shipping providers."
relationships:
  - source: "HTTP/gRPC API Routers"
    destination: "Domain Handlers"
    description: "Routes requests to"
  - source: "Domain Handlers"
    destination: "Business Logic Services"
    description: "Invokes business rules"
  - source: "Business Logic Services"
    destination: "Data Access Repositories"
    description: "Reads and writes data via"
  - source: "Business Logic Services"
    destination: "Event Consumers"
    description: "Triggers and handles events"
  - source: "Business Logic Services"
    destination: "Outbound Adapters"
    description: "Calls external APIs via"