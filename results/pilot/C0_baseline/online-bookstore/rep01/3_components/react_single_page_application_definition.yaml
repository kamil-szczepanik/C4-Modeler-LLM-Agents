level: component
scope: "Component diagram for the React Single Page Application container"
parentContainer:
  name: "React Single Page Application"
elements:
  - type: "component"
    name: "Catalogue Module"
    technology: "React 18, Tailwind CSS"
    description: "Delivers responsive catalogue browsing and product discovery across multiple currencies and regions."
  - type: "component"
    name: "Cart Module"
    technology: "React 18, Redux Toolkit, React Query"
    description: "Manages user shopping carts, item persistence, and state caching."
  - type: "component"
    name: "Checkout Module"
    technology: "React 18, React Query"
    description: "Handles secure checkout flows and user payment processing interactions."
  - type: "component"
    name: "Administration Module"
    technology: "React 18, React Router"
    description: "Provides internal administrative operations for managing inventory, orders, and review moderation."
  - type: "component"
    name: "Routing and Security Layer"
    technology: "React Router, DOMPurify"
    description: "Enforces strict separation between customer and admin views and sanitizes data to prevent XSS."
relationships:
  - source: "Catalogue Module"
    destination: "ECS Fargate Go Microservices"
    description: "Fetches product catalogue data via gRPC-Web over HTTPS"
  - source: "Cart Module"
    destination: "ECS Fargate Go Microservices"
    description: "Synchronizes cart state via gRPC-Web over HTTPS"
  - source: "Checkout Module"
    destination: "ECS Fargate Go Microservices"
    description: "Submits orders and payment data via gRPC-Web over HTTPS"
  - source: "Administration Module"
    destination: "ECS Fargate Go Microservices"
    description: "Manages inventory and orders via gRPC-Web over HTTPS"
  - source: "Routing and Security Layer"
    destination: "Catalogue Module"
    description: "Directs navigation and renders"
  - source: "Routing and Security Layer"
    destination: "Cart Module"
    description: "Directs navigation and renders"
  - source: "Routing and Security Layer"
    destination: "Checkout Module"
    description: "Directs navigation and renders"
  - source: "Routing and Security Layer"
    destination: "Administration Module"
    description: "Enforces route segregation and renders"