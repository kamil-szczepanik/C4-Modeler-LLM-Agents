level: component
scope: "Component diagram for the Redis container"
parentContainer:
  name: "Redis"
elements:
  - type: "component"
    name: "In-Memory Data Store Engine"
    technology: "Redis Hash data structures"
    description: "Provides ultra-fast, in-memory currency exchange rate lookups using Redis Hash data structures."
  - type: "component"
    name: "Eviction Policy Manager"
    technology: "volatile-lru with TTL"
    description: "Manages data eviction using volatile-lru strategy with Time-To-Live settings."
  - type: "component"
    name: "Replication & Persistence Module"
    technology: "AOF persistence, asynchronous master-replica"
    description: "Handles data persistence via AOF and manages asynchronous master-replica replication."
  - type: "component"
    name: "Amazon ElastiCache"
    technology: "Multi-AZ with automatic failover"
    description: "Managed Redis service providing Multi-AZ high availability and automated failover."
  - type: "component"
    name: "ECS Fargate Go Microservices"
    technology: "Go"
    description: "Microservices that read currency exchange rates via Redis Serialization Protocol."
  - type: "component"
    name: "AWS KMS"
    technology: "Customer-managed keys"
    description: "Encrypts data at rest using customer-managed keys for compliance and data protection."
  - type: "component"
    name: "CloudWatch"
    technology: "AWS Monitoring"
    description: "Collects and monitors metrics including DatabaseMemoryUsagePercentage and EngineCPUUtilization."
relationships:
  - source: "ECS Fargate Go Microservices"
    destination: "In-Memory Data Store Engine"
    description: "Reads currency exchange rates via Redis Serialization Protocol (RESP) over TCP with TLS."
  - source: "In-Memory Data Store Engine"
    destination: "AWS KMS"
    description: "Encrypts data at rest using customer-managed keys."
  - source: "Amazon ElastiCache"
    destination: "CloudWatch"
    description: "Exports metrics including DatabaseMemoryUsagePercentage and EngineCPUUtilization."