level: component
scope: "Component diagram for the Amazon SQS & SNS container"
parentContainer:
  name: "Amazon SQS & SNS"
elements:
  - type: "component"
    name: "Amazon SNS Topics"
    technology: "Amazon SNS"
    description: "Fan-out publishing for domain events (OrderEvents, InventoryEvents, NotificationEvents)."
  - type: "component"
    name: "Amazon SQS Queues"
    technology: "Amazon SQS"
    description: "Point-to-point ingestion and buffering (Fulfillment Queue, Notification Queue, SQS FIFO queues)."
  - type: "component"
    name: "Dead-Letter Queues (DLQs)"
    technology: "Amazon SQS DLQ"
    description: "Poisoned payload isolation with a maxReceiveCount of 3."
relationships:
  - source: "Amazon SNS Topics"
    destination: "Amazon SQS Queues"
    description: "Fans out asynchronous events via AWS SNS-SQS Subscriptions."
  - source: "Amazon SQS Queues"
    destination: "Dead-Letter Queues (DLQs)"
    description: "Buffers failed messages via AWS SQS Redrive Policy."