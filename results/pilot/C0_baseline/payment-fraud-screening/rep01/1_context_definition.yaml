level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
  description: "Screens card-not-present payment authorizations for fraud at 3,000 TPS within a sub-50ms P99 latency window and manages suspicious cases for human analysts under PCI-DSS Level 1 constraints."
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Internal users reviewing flagged transactions via TLS."
  - type: "externalSystem"
    name: "Merchant Integration Systems"
    description: "External clients submitting payment authorizations via gRPC/HTTPS."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External OIDC/IAM service for analyst Single Sign-On."
  - type: "externalSystem"
    name: "API Gateway / Network Load Balancer (NLB)"
    description: "AWS managed ingress terminating TLS and routing traffic."
  - type: "externalSystem"
    name: "Scoring Engine"
    description: "Containerized microservice processing real-time fraud scoring using cached rule sets."
  - type: "externalSystem"
    name: "Case Management Portal"
    description: "Web interface for analysts to investigate flagged transactions."
  - type: "externalSystem"
    name: "Audit Storage"
    description: "AWS S3 with Object Lock and KMS encryption for tamper-evident 7-year retention."
relationships:
  - source: "Merchant Integration Systems"
    destination: "API Gateway / Network Load Balancer (NLB)"
    description: "Push payment authorizations with mandatory mTLS and OAuth2/JWT validation"
    technology: "gRPC/HTTPS"
  - source: "Fraud Analysts"
    destination: "Case Management Portal"
    description: "Access review queues over TLS authenticated via OIDC"
    technology: "TLS / OIDC"
  - source: "Scoring Engine"
    destination: "Audit Storage"
    description: "Stream cryptographic hash-chained decision logs and inputs via AWS PrivateLink"
    technology: "AWS PrivateLink"
  - source: "Scoring Engine"
    destination: "Tokenization Proxy"
    description: "Process ephemeral payment payloads to mask Primary Account Numbers (PAN)"
    technology: "Internal API"