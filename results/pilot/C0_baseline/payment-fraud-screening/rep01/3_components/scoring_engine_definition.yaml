level: component
scope: "Component diagram for the Scoring Engine container"
parentContainer:
  name: "Scoring Engine"
elements:
  - type: "component"
    name: "Request Handler Component"
    technology: "Go, gRPC"
    description: "Handles incoming payment evaluation requests and routes them via gRPC over HTTP/2."
  - type: "component"
    name: "Model Evaluator Component"
    technology: "ONNX Runtime, Dual-Buffer Registry"
    description: "Executes machine learning models for fraud screening with zero-downtime model hot-swapping via atomic pointer swaps."
  - type: "component"
    name: "Feature Aggregator Component"
    technology: "Concurrent Redis Pipeline"
    description: "Performs in-memory feature lookups and velocity checks."
  - type: "component"
    name: "Audit Dispatcher Component"
    technology: "Amazon SQS, AWS SDK"
    description: "Emits asynchronous, KMS-signed audit events."
relationships:
  - source: "Request Handler Component"
    destination: "Feature Aggregator Component"
    description: "Fetches features for transactions"
  - source: "Request Handler Component"
    destination: "Model Evaluator Component"
    description: "Evaluates models for transaction scoring"
  - source: "Request Handler Component"
    destination: "Audit Dispatcher Component"
    description: "Dispatches audit events for transactions"