level: component
scope: "Component diagram for the Case Management Portal container"
parentContainer:
  name: "Case Management Portal"
elements:
  - type: "component"
    name: "React Web UI"
    technology: "React, TypeScript"
    description: "Powers the analyst web UI for rapid, responsive case triage."
  - type: "component"
    name: "NestJS API Controller"
    technology: "NestJS, TypeScript"
    description: "Provides a structured, scalable REST API controller architecture."
  - type: "component"
    name: "Case Service"
    technology: "TypeScript"
    description: "Execute business logic for case resolution."
  - type: "component"
    name: "Prisma ORM"
    technology: "Prisma ORM"
    description: "Manages type-safe database access and parameterized queries to prevent injection vectors."
  - type: "component"
    name: "Amazon RDS for PostgreSQL"
    technology: "Amazon RDS for PostgreSQL"
    description: "Stores relational case data securely with automated Multi-AZ failover and AWS KMS encryption at rest."
  - type: "component"
    name: "External Identity Provider"
    technology: "OIDC/JWT"
    description: "Authenticate users and validate tokens."
  - type: "component"
    name: "Audit Storage"
    technology: "Amazon S3 with S3 Object Lock"
    description: "Retrieve historical decision explanations."
relationships:
  - source: "React Web UI"
    destination: "NestJS API Controller"
    description: "Invoke REST endpoints and fetch investigation data [HTTPS/TLS 1.3]"
  - source: "NestJS API Controller"
    destination: "Case Service"
    description: "Execute business logic for case resolution [In-memory]"
  - source: "Case Service"
    destination: "Prisma ORM"
    description: "Query and persist case metadata [Internal]"
  - source: "Prisma ORM"
    destination: "Amazon RDS for PostgreSQL"
    description: "Persist relational case data [TCP/SSL, TLS 1.3, IAM authentication]"
  - source: "NestJS API Controller"
    destination: "External Identity Provider"
    description: "Authenticate users and validate tokens [OIDC/JWT]"
  - source: "NestJS API Controller"
    destination: "Audit Storage"
    description: "Retrieve historical decision explanations [Secure REST]"