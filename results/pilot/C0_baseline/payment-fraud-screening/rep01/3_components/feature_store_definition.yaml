level: component
scope: "Component diagram for the Feature Store container"
parentContainer:
  name: "Feature Store"
elements:
  - type: "component"
    name: "Feature Store"
    technology: "AWS ElastiCache Redis Cluster"
    description: "Provides low-latency behavioral feature lookups to power real-time fraud scoring for payment authorizations with sub-millisecond retrieval."
  - type: "component"
    name: "Feature Ingestion Worker"
    technology: "Python, Celery"
    description: "Ingests real-time transaction streams and updates behavioral aggregates."
  - type: "component"
    name: "Point-in-Time Retrieval API"
    technology: "Embedded Redis modules"
    description: "Handles point-in-time retrieval requests for features."
  - type: "component"
    name: "Data Synchronization Service"
    technology: "AWS KMS, HTTPS"
    description: "Manages asynchronous persistence for audit retention."
  - type: "component"
    name: "Schema Registry Component"
    technology: "Internal"
    description: "Manages data schemas for features and ingestion streams."
  - type: "component"
    name: "TTL Management Module"
    technology: "Redis TTL"
    description: "Manages strict memory TTLs for data retention and compliance."
  - type: "component"
    name: "Scoring Engine"
    technology: "External Container"
    description: "Performs in-memory feature lookups."
  - type: "component"
    name: "Amazon S3"
    technology: "AWS Storage"
    description: "External storage for asynchronous persistence and audit retention."
relationships:
  - source: "Scoring Engine"
    destination: "Feature Store"
    description: "Performs in-memory feature lookups [TCP, Redis RESP, TLS]"
  - source: "Feature Ingestion Worker"
    destination: "Feature Store"
    description: "Ingests real-time transaction streams and updates behavioral aggregates [TCP, Redis RESP]"
  - source: "Data Synchronization Service"
    destination: "Amazon S3"
    description: "Manages asynchronous persistence for audit retention [HTTPS, AWS KMS]"