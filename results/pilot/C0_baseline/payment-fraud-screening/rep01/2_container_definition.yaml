level: container
scope: "Container diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Internal users reviewing flagged transactions and managing suspicious cases."
  - type: "externalSystem"
    name: "Merchant Integration Systems"
    description: "External clients submitting card-not-present payment authorizations."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External OIDC/IAM service for analyst Single Sign-On."
  - type: "externalSystem"
    name: "API Gateway / Network Load Balancer (NLB)"
    description: "AWS managed ingress terminating TLS and routing incoming traffic."
  - type: "container"
    name: "Scoring Engine"
    technology: "Go, AWS ECS Fargate"
    description: "Containerized microservice processing real-time payment fraud scoring at 3,000 TPS."
  - type: "container"
    name: "Case Management Portal"
    technology: "Node.js, TypeScript, PostgreSQL"
    description: "Secure web application and database providing a portal for fraud analysts."
  - type: "container"
    name: "Feature Store"
    technology: "Redis Cluster"
    description: "In-memory cache providing low-latency feature lookups for the scoring engine."
  - type: "container"
    name: "Audit Queue"
    technology: "Amazon SQS"
    description: "Message queueing service for asynchronous audit event decoupling."
  - type: "container"
    name: "Audit Stream Processor"
    technology: "Amazon Kinesis Firehose"
    description: "Ingestion and streaming service for audit logs."
  - type: "container"
    name: "Audit Storage"
    technology: "Amazon S3, S3 Object Lock"
    description: "WORM-compliant storage providing 7-year tamper-evident audit retention."
relationships:
  - source: "Merchant Integration Systems"
    destination: "API Gateway / Network Load Balancer (NLB)"
    description: "Submit payment authorizations"
    technology: "HTTPS (REST/JSON)"
  - source: "API Gateway / Network Load Balancer (NLB)"
    destination: "Scoring Engine"
    description: "Route payment evaluation requests"
    technology: "gRPC over HTTP/2"
  - source: "Fraud Analysts"
    destination: "Case Management Portal"
    description: "Investigate flagged transactions and manage cases"
    technology: "TLS"
  - source: "Fraud Analysts"
    destination: "Identity Provider"
    description: "Authenticate via Single Sign-On"
    technology: "OAuth2/OIDC"
  - source: "Scoring Engine"
    destination: "Feature Store"
    description: "Perform in-memory feature lookups"
    technology: "TCP"
  - source: "Scoring Engine"
    destination: "Audit Queue"
    description: "Emit asynchronous audit events"
    technology: "AWS SDK"
  - source: "Case Management Portal"
    destination: "Case Management Portal"
    description: "Persist relational case data"
    technology: "TLS"
  - source: "Audit Stream Processor"
    destination: "Audit Storage"
    description: "Write immutable audit records for WORM storage"
    technology: "HTTPS"