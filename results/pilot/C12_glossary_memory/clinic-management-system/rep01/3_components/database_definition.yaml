level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Patroni Coordinator"
    technology: "Patroni"
    description: "Manages PostgreSQL high availability, automatic failover, and consensus cluster state."
  - type: "component"
    name: "PgBouncer Connection Pooler"
    technology: "PgBouncer"
    description: "Manages and optimizes database connection pooling for high-throughput microservice requests."
  - type: "component"
    name: "PostgreSQL Data Engine"
    technology: "PostgreSQL 16 with pgcrypto"
    description: "Provides ACID-compliant relational data storage with AES-256 encryption at rest for patient EMR and billing data."
relationships:
  - source: "PgBouncer Connection Pooler"
    destination: "PostgreSQL Data Engine"
    description: "Routes and multiplexes queries"
  - source: "Patroni Coordinator"
    destination: "PostgreSQL Data Engine"
    description: "Monitors and manages health and failover"