level: component
scope: "Component diagram for the Interoperability Service container"
parentContainer:
  name: "Interoperability Service"
elements:
  - type: "component"
    name: "API Router Component"
    technology: "Python, FastAPI"
    description: "Routes incoming internal gRPC requests from the API Gateway to appropriate interoperability handlers."
  - type: "component"
    name: "FHIR Transformation Engine"
    technology: "Python, Pydantic"
    description: "Transforms internal data models into HL7 FHIR standard payloads and vice versa."
  - type: "component"
    name: "Outbound mTLS Dispatcher Component"
    technology: "Python, HTTPX"
    description: "Dispatches HL7 FHIR payloads securely to external systems using mutual TLS (mTLS)."
relationships:
  - source: "API Router Component"
    destination: "FHIR Transformation Engine"
    description: "Forwards payloads for transformation"
  - source: "FHIR Transformation Engine"
    destination: "Outbound mTLS Dispatcher Component"
    description: "Sends transformed FHIR payloads for dispatch"
  - source: "Outbound mTLS Dispatcher Component"
    destination: "Laboratory Information Systems (LIS)"
    description: "Transmits HL7 FHIR data over secure mutual TLS (mTLS)"
  - source: "Outbound mTLS Dispatcher Component"
    destination: "PACS Imaging Archives"
    description: "Transmits HL7 FHIR data over secure mutual TLS (mTLS)"
  - source: "Outbound mTLS Dispatcher Component"
    destination: "Insurance Payment Gateways"
    description: "Transmits HL7 FHIR data over secure mutual TLS (mTLS)"