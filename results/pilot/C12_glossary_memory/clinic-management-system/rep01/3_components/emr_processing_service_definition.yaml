level: component
scope: "Component diagram for the EMR Processing Service container"
parentContainer:
  name: "EMR Processing Service"
elements:
  - type: "component"
    name: "ClinicalRecordController"
    technology: "Java Spring Boot"
    description: "Handles incoming gRPC requests from the API Gateway and exposes endpoints for clinical records."
  - type: "component"
    name: "ClinicalRecordManager"
    technology: "Java Spring Boot"
    description: "Contains the core clinical workflows, business logic, and orchestrates record management."
  - type: "component"
    name: "AuditTrailService"
    technology: "Java Spring Boot"
    description: "Tracks and logs all clinical record access and modifications to ensure HIPAA and GDPR compliance."
  - type: "component"
    name: "ClinicalRepositoryAdapter"
    technology: "Java Spring Boot / Spring Data JPA"
    description: "Manages data access operations and persistence for clinical entities using JPA and Hibernate."
  - type: "component"
    name: "Database"
    technology: "PostgreSQL"
    description: "Encrypted relational storage ensuring ACID compliance and AES-256 encryption at rest."
relationships:
  - source: "API Gateway"
    destination: "ClinicalRecordController"
    description: "Internal gRPC over mTLS"
  - source: "ClinicalRecordController"
    destination: "ClinicalRecordManager"
    description: "In-process method call"
  - source: "ClinicalRecordManager"
    destination: "ClinicalRepositoryAdapter"
    description: "In-process method call"
  - source: "ClinicalRepositoryAdapter"
    destination: "Database"
    description: "JDBC over TLS"
  - source: "ClinicalRecordManager"
    destination: "AuditTrailService"
    description: "Spring Application Event Publisher"