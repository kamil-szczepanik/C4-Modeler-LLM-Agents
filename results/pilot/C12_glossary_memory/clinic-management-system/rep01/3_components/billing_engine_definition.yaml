level: component
scope: "Component diagram for the Billing Engine container"
parentContainer:
  name: "Billing Engine"
elements:
  - type: "component"
    name: "Claim Generation Controller"
    technology: "Java Spring Boot component"
    description: "Handles incoming internal gRPC requests and enforces token validation."
  - type: "component"
    name: "Invoice Processor"
    technology: "Java Spring Boot component"
    description: "Manages itemized statement logic and domain event publishing using Spring Events."
  - type: "component"
    name: "Payment Orchestrator"
    technology: "Java Spring Boot component"
    description: "Coordinates external financial transactions and outbox patterns."
  - type: "component"
    name: "Billing Repository"
    technology: "Java Spring Boot component"
    description: "Manages data access using Spring Data JPA with field-level encryption and Optimistic Locking."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL"
    description: "Encrypted PostgreSQL cluster providing ACID compliance and AES-256 encryption at rest."
  - type: "externalSystem"
    name: "Insurance Payment Gateways"
    technology: "External System"
    description: "External systems for processing insurance claims and payments."
  - type: "container"
    name: "API Gateway"
    technology: "Node.js"
    description: "Routing and OAuth/MFA enforcement container."
relationships:
  - source: "API Gateway"
    destination: "Claim Generation Controller"
    description: "Routes internal financial requests [Internal gRPC]"
  - source: "Payment Orchestrator"
    destination: "Insurance Payment Gateways"
    description: "Coordinates external financial transactions [HTTPS REST over mutual TLS (mTLS) with public-key pinning]"
  - source: "Billing Repository"
    destination: "Database"
    description: "Manages data access and persistence [JDBC with connection pooling and AES-256 encryption at rest]"