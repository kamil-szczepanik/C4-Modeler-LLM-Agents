level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Front Desk Staff"
    description: "Manages patient admissions, check-ins, and basic scheduling."
  - type: "person"
    name: "Clinicians"
    description: "Accesses and updates electronic medical records (EMR) and manages clinical workflows."
  - type: "person"
    name: "Billing Specialists"
    description: "Handles financial transactions, insurance claims, and billing operations."
  - type: "person"
    name: "Patients"
    description: "Interacts via portal to view records, schedule appointments, and manage billing."
  - type: "person"
    name: "Clinic Administrators"
    description: "Oversees clinic operations and administrative tasks."
  - type: "person"
    name: "Practice Managers"
    description: "Monitors analytics dashboards and performance metrics."
  - type: "externalSystem"
    name: "Laboratory Information Systems (LIS)"
    description: "External system for managing laboratory test orders and results."
  - type: "externalSystem"
    name: "PACS Imaging Archives"
    description: "External system for storing and managing medical imaging data."
  - type: "externalSystem"
    name: "Insurance Payment Gateways"
    description: "External systems for processing insurance claims and payments."
  - type: "container"
    name: "Web Frontend"
    technology: "React"
    description: "Single Page Application container providing responsive user interfaces."
  - type: "container"
    name: "API Gateway"
    technology: "Node.js"
    description: "Routing and OAuth/MFA enforcement container."
  - type: "container"
    name: "EMR Processing Service"
    technology: "Java Spring Boot"
    description: "Core clinical records container."
  - type: "container"
    name: "Billing Engine"
    technology: "Java Spring Boot"
    description: "Isolated container for financial workflows and claims."
  - type: "container"
    name: "Interoperability Service"
    technology: "Python"
    description: "Container handling HL7 FHIR payloads."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL"
    description: "Encrypted PostgreSQL cluster container with ACID compliance and AES-256 encryption at rest."
relationships:
  - source: "Front Desk Staff"
    destination: "API Gateway"
    description: "Accesses system functionalities securely"
    technology: "HTTPS (TLS 1.3) with OAuth 2.0 / OIDC and MFA"
  - source: "Clinicians"
    destination: "API Gateway"
    description: "Accesses EMR and clinical workflows securely"
    technology: "HTTPS (TLS 1.3) with OAuth 2.0 / OIDC and MFA"
  - source: "Billing Specialists"
    destination: "API Gateway"
    description: "Accesses billing workflows securely"
    technology: "HTTPS (TLS 1.3) with OAuth 2.0 / OIDC and MFA"
  - source: "Patients"
    destination: "API Gateway"
    description: "Interacts with patient portal securely"
    technology: "HTTPS (TLS 1.3) with OAuth 2.0 / OIDC and MFA"
  - source: "Clinic Administrators"
    destination: "API Gateway"
    description: "Oversees operations securely"
    technology: "HTTPS (TLS 1.3) with OAuth 2.0 / OIDC and MFA"
  - source: "Practice Managers"
    destination: "API Gateway"
    description: "Monitors dashboards securely"
    technology: "HTTPS (TLS 1.3) with OAuth 2.0 / OIDC and MFA"
  - source: "Web Frontend"
    destination: "API Gateway"
    description: "Sends user requests to the backend"
    technology: "HTTPS (TLS 1.3)"
  - source: "API Gateway"
    destination: "EMR Processing Service"
    description: "Routes internal clinical requests"
    technology: "Internal gRPC"
  - source: "API Gateway"
    destination: "Billing Engine"
    description: "Routes internal financial requests"
    technology: "Internal gRPC"
  - source: "API Gateway"
    destination: "Interoperability Service"
    description: "Routes internal HL7 FHIR integration requests"
    technology: "Internal gRPC"
  - source: "Interoperability Service"
    destination: "Laboratory Information Systems (LIS)"
    description: "Exchanges lab orders and results"
    technology: "HL7 FHIR APIs over secure mutual TLS (mTLS)"
  - source: "Interoperability Service"
    destination: "PACS Imaging Archives"
    description: "Retrieves and stores medical imaging"
    technology: "HL7 FHIR APIs over secure mutual TLS (mTLS)"
  - source: "Interoperability Service"
    destination: "Insurance Payment Gateways"
    description: "Processes insurance claims and payments"
    technology: "HL7 FHIR APIs over secure mutual TLS (mTLS)"