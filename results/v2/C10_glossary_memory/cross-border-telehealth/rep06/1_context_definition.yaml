level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "A multi-region cross-border telehealth platform providing video consultations, e-prescriptions, and an AI symptom checker for EU and US patients while enforcing strict regional data residency and regulatory compliance under GDPR, HIPAA, and EU MDR."
elements:
  - type: "person"
    name: "Patients"
    description: "Users accessing care, managing consent, and utilizing the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Healthcare providers delivering video consultations and issuing cross-border e-prescriptions."
  - type: "person"
    name: "Compliance Officers"
    description: "Overseeing audit trails, AI traceability, and data residency."
  - type: "externalSystem"
    name: "Video Infrastructure Provider"
    description: "Third-party WebRTC SFU handling low-bandwidth consultations."
  - type: "externalSystem"
    name: "AI Inference Engine"
    description: "External LLM service providing urgency recommendations."
  - type: "externalSystem"
    name: "Regional Pharmacy Gateways"
    description: "External HL7 FHIR APIs (US) and national gateways (EU) for e-prescription delivery."
  - type: "externalSystem"
    name: "Identity & Consent Providers"
    description: "Regional OIDC/OAuth2 authentication and consent management services."
relationships:
  - source: "Patients"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses care, manages consent, and utilizes AI symptom checker"
    technology: "HTTPS, WebSockets"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Delivers video consultations and issues e-prescriptions"
    technology: "HTTPS, WebSockets"
  - source: "Compliance Officers"
    destination: "Cross-Border Telehealth Platform"
    description: "Oversees audit trails, AI traceability, and data residency"
    technology: "HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Video Infrastructure Provider"
    description: "Handles real-time video streaming for consultations"
    technology: "HTTPS, WebSockets (WSS)"
  - source: "Cross-Border Telehealth Platform"
    destination: "AI Inference Engine"
    description: "Sends symptom evaluation requests and receives urgencies"
    technology: "HTTPS (REST/gRPC)"
  - source: "Cross-Border Telehealth Platform"
    destination: "Regional Pharmacy Gateways"
    description: "Delivers e-prescriptions to US and EU pharmacies"
    technology: "HTTPS (HL7 FHIR / National APIs)"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity & Consent Providers"
    description: "Authenticates users and manages consent"
    technology: "OIDC/OAuth2 with FIDO2/WebAuthn"