level: component
scope: "Component diagram for the Consultation & Prescriptions Service container"
parentContainer:
  name: "Consultation & Prescriptions Service"
elements:
  - type: "component"
    name: "Consultation Controller"
    technology: "Go/gRPC"
    description: "Exposes gRPC endpoints for consultation management, video session coordination, and clinician interaction."
  - type: "component"
    name: "Prescription Manager"
    technology: "Go"
    description: "Handles business logic for cross-border e-prescriptions and coordinates with external pharmacy gateways."
  - type: "component"
    name: "Prescription Data Access"
    technology: "Go / SQL Driver"
    description: "Persists and retrieves consultation history and prescription records with regional data residency enforcement."
relationships:
  - source: "Consultation Controller"
    destination: "Prescription Manager"
    description: "Delegates e-prescription workflow requests"
  - source: "Prescription Manager"
    destination: "Prescription Data Access"
    description: "Reads and writes prescription state"