level: component
scope: "Component diagram for the AI Traceability & Logging Service container"
parentContainer:
  name: "AI Traceability & Logging Service"
elements:
  - type: "component"
    name: "AI Logging API Controller"
    technology: "Python/FastAPI"
    description: "Exposes REST endpoints for ingestion and auditing of AI inference logs and traceability records."
  - type: "component"
    name: "Audit & Traceability Processor"
    technology: "Python/FastAPI / Pandas"
    description: "Processes, normalizes, and structures audit logs for compliance with EU MDR and regional requirements."
  - type: "component"
    name: "Export Formatter"
    technology: "Python/FastAPI"
    description: "Generates exportable audit reports and compliance logs for review by compliance officers."
relationships:
  - source: "AI Logging API Controller"
    destination: "Audit & Traceability Processor"
    description: "Ingests and forwards logs for normalization and validation"
  - source: "Audit & Traceability Processor"
    destination: "Export Formatter"
    description: "Feeds processed audit trails for reporting and export"