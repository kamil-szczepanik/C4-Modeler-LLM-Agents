level: component
scope: "Component diagram for the Consent & Policy Engine container"
parentContainer:
  name: "Consent & Policy Engine"
elements:
  - type: "component"
    name: "Policy Decision Point (PDP)"
    technology: "Open Policy Agent"
    description: "Evaluates sub-millisecond ABAC and purpose-based consent rules."
  - type: "component"
    name: "Consent Repository Proxy"
    technology: "Go"
    description: "Proxies requests to the consent datastore enforcing regional data residency."
  - type: "component"
    name: "Audit & Traceability Publisher"
    technology: "Go"
    description: "Asynchronously publishes policy decisions and audit logs to WORM storage."
relationships:
  - source: "Policy Decision Point (PDP)"
    destination: "Consent Repository Proxy"
    description: "Internal Go interface"
  - source: "Policy Decision Point (PDP)"
    destination: "Audit & Traceability Publisher"
    description: "Asynchronous channel"