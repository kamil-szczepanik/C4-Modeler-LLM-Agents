level: component
scope: "Component diagram for the API Gateway / BFF container"
parentContainer:
  name: "API Gateway / BFF"
elements:
  - type: "component"
    name: "GraphQL Schema Federation Router"
    technology: "Node.js / GraphQL"
    description: "Federates GraphQL schemas and routes client-driven data fetching requests across microservices."
  - type: "component"
    name: "Authentication & Authorization Middleware"
    technology: "Node.js / OIDC / OAuth2"
    description: "Validates incoming tokens and enforces security policies for incoming client traffic."
  - type: "component"
    name: "gRPC Client Proxy"
    technology: "Node.js / gRPC / SPIFFE/SPIRE"
    description: "Manages secure mTLS connections and forwards backend requests to internal microservices."
relationships:
  - source: "GraphQL Schema Federation Router"
    destination: "Authentication & Authorization Middleware"
    description: "Authenticates requests before resolving GraphQL queries"
  - source: "GraphQL Schema Federation Router"
    destination: "gRPC Client Proxy"
    description: "Dispatches backend calls"
  - source: "gRPC Client Proxy"
    destination: "Consultation & Prescriptions Service"
    description: "Invokes gRPC over TLS (mTLS via SPIFFE/SPIRE)"
  - source: "gRPC Client Proxy"
    destination: "Consent & Policy Engine"
    description: "Invokes gRPC over TLS (mTLS)"
  - source: "gRPC Client Proxy"
    destination: "AI Traceability & Logging Service"
    description: "Invokes gRPC over TLS (mTLS)"