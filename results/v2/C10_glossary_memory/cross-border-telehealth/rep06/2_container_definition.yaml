level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "Users accessing care, managing consent, and utilizing the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Healthcare providers delivering video consultations and issuing cross-border e-prescriptions."
  - type: "person"
    name: "Compliance Officers"
    description: "Overseeing audit trails, AI traceability, and data residency."
  - type: "externalSystem"
    name: "Video Infrastructure Provider"
    description: "Third-party WebRTC SFU handling low-bandwidth consultations."
  - type: "externalSystem"
    name: "AI Inference Engine"
    description: "External LLM service providing urgency recommendations."
  - type: "externalSystem"
    name: "Regional Pharmacy Gateways"
    description: "External HL7 FHIR APIs (US) and national gateways (EU) for e-prescription delivery."
  - type: "externalSystem"
    name: "Identity & Consent Providers"
    description: "Regional OIDC/OAuth2 authentication and consent management services."
  - type: "container"
    name: "API Gateway / BFF"
    technology: "Node.js/GraphQL"
    description: "API Gateway / BFF for efficient client-driven data fetching."
  - type: "container"
    name: "Consultation & Prescriptions Service"
    technology: "Go/gRPC"
    description: "High-performance backend microservices and inter-container communication."
  - type: "container"
    name: "AI Traceability & Logging Service"
    technology: "Python/FastAPI"
    description: "AI Traceability & Logging Service for machine learning integration and auditing."
  - type: "container"
    name: "Consent & Policy Engine"
    technology: "Go/OPA"
    description: "Fine-grained ABAC enforcement for patient consent validation."
  - type: "container"
    name: "Patient Portal App"
    technology: "Flutter/Web & Mobile"
    description: "Client applications optimized for multi-standard records and offline caching."
  - type: "container"
    name: "Clinician Workspace App"
    technology: "React/TypeScript SPA"
    description: "Client applications optimized for multi-standard records and offline caching."
relationships:
  - source: "Patients"
    destination: "API Gateway / BFF"
    description: "Accesses API Gateway / BFF"
    technology: "HTTPS, WebSockets"
  - source: "Licensed Clinicians"
    destination: "API Gateway / BFF"
    description: "Accesses API Gateway / BFF"
    technology: "HTTPS, WebSockets"
  - source: "Compliance Officers"
    destination: "API Gateway / BFF"
    description: "Accesses API Gateway / BFF"
    technology: "HTTPS"
  - source: "Consultation & Prescriptions Service"
    destination: "Regional Pharmacy Gateways"
    description: "Delivers e-prescriptions to US and EU pharmacies"
    technology: "HTTPS (HL7 FHIR in US / National APIs in EU)"
  - source: "API Gateway / BFF"
    destination: "Consultation & Prescriptions Service"
    description: "Communicates via gRPC over TLS"
    technology: "gRPC over TLS (mTLS via SPIFFE/SPIRE)"
  - source: "Cross-Border Telehealth Platform"
    destination: "Video Infrastructure Provider"
    description: "Handles real-time video streaming for consultations"
    technology: "HTTPS, WebSockets (WSS), SRTP/DTLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "AI Inference Engine"
    description: "Sends symptom evaluation requests and receives urgencies"
    technology: "HTTPS (REST/gRPC)"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity & Consent Providers"
    description: "Authenticates users and manages consent"
    technology: "OIDC/OAuth2 with FIDO2/WebAuthn"