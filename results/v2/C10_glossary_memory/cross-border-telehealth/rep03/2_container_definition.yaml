level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU & US)"
    description: "Patients seeking video consultations, e-prescriptions, and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Clinicians conducting video consultations and issuing e-prescriptions."
  - type: "externalSystem"
    name: "EU/US Regional Pharmacies"
    description: "Regional pharmacies fulfilling e-prescriptions using national EU standards and US HL7 FHIR."
  - type: "externalSystem"
    name: "Regulatory Authorities / Notified Bodies (EU/US)"
    description: "Authorities auditing and ensuring compliance with GDPR, HIPAA, and EU MDR."
  - type: "externalSystem"
    name: "Identity Providers (IDPs)"
    description: "External identity providers handling authentication via OAuth2/OIDC."
  - type: "externalSystem"
    name: "Third-Party Video Infrastructure"
    description: "WebRTC-compliant SFU/MCU provider supporting adaptive bitrate streaming."
  - type: "container"
    name: "API Gateway / BFF"
    technology: "Node.js"
    description: "Provides API gateway and backend-for-frontend services."
  - type: "container"
    name: "Consultation & Prescriptions Service"
    technology: "Java/Spring Boot"
    description: "Manages video consultations and prescription logic."
  - type: "container"
    name: "E-Prescription Adapter"
    technology: "Node.js"
    description: "Adapts and communicates with regional pharmacies."
  - type: "container"
    name: "AI Symptom Checker Service"
    technology: "Python/FastAPI"
    description: "Provides AI-driven symptom checking for patients."
  - type: "container"
    name: "Consent & Privacy Service"
    technology: "Go"
    description: "Manages user consent and privacy compliance."
  - type: "container"
    name: "Regional Databases"
    technology: "Cloud SQL PostgreSQL"
    description: "Provides strictly partitioned regional relational databases for data residency compliance."
relationships:
  - source: "Patients (EU & US)"
    destination: "API Gateway / BFF"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS/TLS 1.3 and WebRTC"
  - source: "Licensed Clinicians"
    destination: "API Gateway / BFF"
    description: "Conducts consultations and manages prescriptions"
    technology: "HTTPS/TLS 1.3 and WebRTC"
  - source: "API Gateway / BFF"
    destination: "Consultation & Prescriptions Service"
    description: "Routes consultation and prescription requests"
    technology: "gRPC over mTLS"
  - source: "Consultation & Prescriptions Service"
    destination: "E-Prescription Adapter"
    description: "Sends e-prescription data for fulfillment"
    technology: "gRPC over mTLS"
  - source: "E-Prescription Adapter"
    destination: "EU/US Regional Pharmacies"
    description: "Sends e-prescriptions"
    technology: "HTTPS/REST with national EU standards and US HL7 FHIR"
  - source: "API Gateway / BFF"
    destination: "AI Symptom Checker Service"
    description: "Requests AI symptom analysis"
    technology: "gRPC over mTLS"
  - source: "API Gateway / BFF"
    destination: "Consent & Privacy Service"
    description: "Verifies and records user consent and privacy settings"
    technology: "gRPC over mTLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity Providers (IDPs)"
    description: "Authenticates users"
    technology: "OAuth2/OIDC"
  - source: "Regulatory Authorities / Notified Bodies (EU/US)"
    destination: "API Gateway / BFF"
    description: "Audits regional instances"
    technology: "HTTPS / TLS 1.3 with mTLS and signed JWT"