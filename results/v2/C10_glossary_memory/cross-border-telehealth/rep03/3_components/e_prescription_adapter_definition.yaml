level: component
scope: "Component diagram for the E-Prescription Adapter container"
parentContainer:
  name: "E-Prescription Adapter"
elements:
  - type: "component"
    name: "Prescription Routing Controller"
    technology: "Node.js / Express Router"
    description: "Receives gRPC prescription dispatch requests from the Consultation & Prescriptions Service and handles routing logic."
  - type: "component"
    name: "EU Standard Formatter"
    technology: "Node.js / JavaScript Module"
    description: "Transforms prescription payloads into national EU pharmacy standards."
  - type: "component"
    name: "US HL7 FHIR Adapter"
    technology: "Node.js / HL7 FHIR Client"
    description: "Transforms and formats prescription payloads into US HL7 FHIR compliant requests."
  - type: "component"
    name: "Pharmacy Integration Client"
    technology: "Node.js / Axios (HTTPS/REST)"
    description: "Communicates securely with EU/US Regional Pharmacies to deliver e-prescriptions."
relationships:
  - source: "Prescription Routing Controller"
    destination: "EU Standard Formatter"
    description: "Forwards EU-bound prescriptions"
  - source: "Prescription Routing Controller"
    destination: "US HL7 FHIR Adapter"
    description: "Forwards US-bound prescriptions"
  - source: "EU Standard Formatter"
    destination: "Pharmacy Integration Client"
    description: "Passes formatted EU prescription payload"
  - source: "US HL7 FHIR Adapter"
    destination: "Pharmacy Integration Client"
    description: "Passes formatted FHIR prescription payload"