level: component
scope: "Component diagram for the Consultation & Prescriptions Service container"
parentContainer:
  name: "Consultation & Prescriptions Service"
elements:
  - type: "component"
    name: "Consultation Session Manager"
    technology: "Java/Spring Boot, WebRTC, Redis Protocol"
    description: "Manages video consultation sessions, adaptive bitrate video streaming, and ephemeral session states."
  - type: "component"
    name: "Prescription Domain Controller"
    technology: "Java/Spring Boot, JDBC"
    description: "Handles prescription business logic and interacts with regional relational databases."
relationships:
  - source: "Consultation Session Manager"
    destination: "Third-Party Video Infrastructure"
    description: "Connects for video consultations via HTTPS/WebSocket over TLS 1.3"
  - source: "Prescription Domain Controller"
    destination: "Regional Databases"
    description: "Persists prescription and consultation data via JDBC over mTLS"
  - source: "Consultation Session Manager"
    destination: "Regional Databases"
    description: "Caches ephemeral session states via Redis Protocol over mTLS"
  - source: "Consultation & Prescriptions Service"
    destination: "Consent & Privacy Service"
    description: "Verifies consent and privacy compliance via gRPC over mTLS"