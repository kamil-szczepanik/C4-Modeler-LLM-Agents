level: component
scope: "Component diagram for the Regional Databases container"
parentContainer:
  name: "Regional Databases"
elements:
  - type: "component"
    name: "Data Partition Manager"
    technology: "PostgreSQL Partitioning"
    description: "Manages regional data partitioning to enforce strict data residency compliance."
  - type: "component"
    name: "Audit Logging Store"
    technology: "PostgreSQL Append-Only Tables / pgAudit"
    description: "Stores immutable audit logs for regulatory compliance and traceability."
  - type: "component"
    name: "Consent Indexer"
    technology: "PostgreSQL B-Tree/GIN Indexes"
    description: "Provides indexing for fast and efficient consent and privacy record retrieval."
  - type: "component"
    name: "Patient Data Archival & Purge Manager"
    technology: "PostgreSQL Partition Dropping / Retention Jobs"
    description: "Manages data retention policies, archiving, and purging of patient data."
relationships:
  - source: "Data Partition Manager"
    destination: "Audit Logging Store"
    description: "Logs partitioning events"
  - source: "Consent Indexer"
    destination: "Data Partition Manager"
    description: "Indexes partitioned consent data"
  - source: "Patient Data Archival & Purge Manager"
    destination: "Data Partition Manager"
    description: "Executes partition dropping and retention cleanup"