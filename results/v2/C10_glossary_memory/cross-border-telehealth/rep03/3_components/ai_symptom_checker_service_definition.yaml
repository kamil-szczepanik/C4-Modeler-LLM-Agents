level: component
scope: "Component diagram for the AI Symptom Checker Service container"
parentContainer:
  name: "AI Symptom Checker Service"
elements:
  - type: "component"
    name: "Symptom Checker API Controller"
    technology: "Python / FastAPI"
    description: "Exposes REST and gRPC endpoints to handle symptom checking requests from the API Gateway."
  - type: "component"
    name: "Inference Engine"
    technology: "Python / PyTorch"
    description: "Executes machine learning models to analyze patient symptoms and generate preliminary health insights."
  - type: "component"
    name: "Consent Verification Client"
    technology: "Python / gRPC Client"
    description: "Communicates with the Consent & Privacy Service over mTLS to verify user consent before processing symptom data."
  - type: "component"
    name: "Data Access Repository"
    technology: "SQLAlchemy / PostgreSQL Driver"
    description: "Manages secure data persistence and retrieval from the Regional Databases over mTLS."
relationships:
  - source: "Symptom Checker API Controller"
    destination: "Inference Engine"
    description: "Delegates symptom text and data for AI model inference."
  - source: "Symptom Checker API Controller"
    destination: "Consent Verification Client"
    description: "Requests user privacy and consent validation via gRPC over mTLS."
  - source: "Inference Engine"
    destination: "Data Access Repository"
    description: "Persists and retrieves anonymized diagnostic data using PostgreSQL over mTLS."