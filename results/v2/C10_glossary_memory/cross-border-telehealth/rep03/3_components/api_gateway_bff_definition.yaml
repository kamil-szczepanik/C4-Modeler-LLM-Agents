level: component
scope: "Component diagram for the API Gateway / BFF container"
parentContainer:
  name: "API Gateway / BFF"
elements:
  - type: "component"
    name: "Ingress Router & Geo-Routing Middleware"
    technology: "Node.js/Express"
    description: "Secures edge ingress, applies rate limiting, and enforces geo-routing."
  - type: "consent"
    name: "Consent Enforcement Proxy"
    technology: "Node.js"
    description: "Enforces consent checks at the gateway layer."
  - type: "component"
    name: "BFF Aggregator & Payload Optimizer"
    technology: "Node.js"
    description: "Aggregates responses and optimizes payloads for low-bandwidth rural connections."
relationships:
  - source: "Ingress Router & Geo-Routing Middleware"
    destination: "Consent Enforcement Proxy"
    description: "Routes requests for consent validation"
  - source: "Consent Enforcement Proxy"
    destination: "BFF Aggregator & Payload Optimizer"
    description: "Forwards validated requests"