level: component
scope: "Component diagram for the Consent & Privacy Service container"
parentContainer:
  name: "Consent & Privacy Service"
elements:
  - type: "component"
    name: "Consent API Controller"
    technology: "Go HTTP Handler"
    description: "Handles incoming gRPC requests related to user consent and privacy management."
  - type: "component"
    name: "Privacy Enforcement Engine"
    technology: "Go Business Logic"
    description: "Validates and enforces regional data privacy policies, GDPR, and HIPAA compliance rules."
  - type: "component"
    name: "Consent Data Access Component"
    technology: "Go Database Driver"
    description: "Interacts securely with the regional partitioned database to store and retrieve consent records."
relationships:
  - source: "Consent API Controller"
    destination: "Privacy Enforcement Engine"
    description: "Delegates validation and enforcement of privacy policies"
  - source: "Privacy Enforcement Engine"
    destination: "Consent Data Access Component"
    description: "Persists and queries consent records"