level: component
scope: "Component diagram for the Frontend UI (with localization) container"
parentContainer:
  name: "Frontend UI (with localization)"
elements:
  - type: "component"
    name: "Localization Module"
    technology: "Flutter Localization Engine"
    description: "Manages dynamic localization and language packs for EU and US users."
  - type: "component"
    name: "Offline Storage Module"
    technology: "Local SQLite / Secure Storage"
    description: "Handles offline-first caching of patient session data and compliance records."
  - type: "component"
    name: "UI Presentation Layer"
    technology: "Flutter Web/Mobile Widgets"
    description: "Renders responsive views for patients, clinicians, pharmacists, and auditors."
relationships:
  - source: "Localization Module"
    destination: "UI Presentation Layer"
    description: "Provides localized strings"
  - source: "Offline Storage Module"
    destination: "UI Presentation Layer"
    description: "Syncs cached offline data"