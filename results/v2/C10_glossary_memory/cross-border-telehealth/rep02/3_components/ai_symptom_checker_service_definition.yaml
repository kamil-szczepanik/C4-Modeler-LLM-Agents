level: component
scope: "Component diagram for the AI Symptom Checker Service container"
parentContainer:
  name: "AI Symptom Checker Service"
elements:
  - type: "component"
    name: "Triage Controller"
    technology: "FastAPI / Python"
    description: "Handles incoming symptom checking requests and orchestrates the triage workflow."
  - type: "component"
    name: "AI Inference Engine"
    technology: "PyTorch & GCP Vertex AI"
    description: "Powers regional AI symptom triage models with auto-scaling capabilities."
  - type: "component"
    name: "Cryptographic Signer"
    technology: "Google Cloud HSM"
    description: "Provides cryptographic hardware security for signing AI outputs ensuring EU MDR traceability."
relationships:
  - source: "Triage Controller"
    destination: "AI Inference Engine"
    description: "Sends symptom data for processing"
  - source: "AI Inference Engine"
    destination: "Cryptographic Signer"
    description: "Requests cryptographic signature for AI outputs"