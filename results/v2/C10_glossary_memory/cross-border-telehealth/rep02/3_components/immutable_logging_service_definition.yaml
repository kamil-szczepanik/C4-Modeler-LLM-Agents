level: component
scope: "Component diagram for the Immutable Logging Service container"
parentContainer:
  name: "Immutable Logging Service"
elements:
  - type: "component"
    name: "Log Ingestion Component"
    technology: "Go, gRPC/PubSub subscriber"
    description: "Ingests log entries via Pub/Sub and gRPC subscribers for immutable tracking."
  - type: "component"
    name: "Cryptographic Verifier Component"
    technology: "Go, Tink/Cloud HSM"
    description: "Verifies and signs logs cryptographically using Tink and Cloud HSM."
  - type: "component"
    name: "WORM Storage Manager Component"
    technology: "Java/Go, GCP Cloud Storage Object Lock"
    description: "Manages Write Once, Read Many (WORM) storage using GCP Cloud Storage Object Lock."
relationships:
  - source: "Log Ingestion Component"
    destination: "Cryptographic Verifier Component"
    description: "Sends ingested logs for cryptographic verification"
  - source: "Cryptographic Verifier Component"
    destination: "WORM Storage Manager Component"
    description: "Forwards verified signed logs to WORM storage"