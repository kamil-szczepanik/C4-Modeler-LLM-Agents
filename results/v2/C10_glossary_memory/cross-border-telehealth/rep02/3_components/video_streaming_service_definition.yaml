level: component
scope: "Component diagram for the Video Streaming Service container"
parentContainer:
  name: "Video Streaming Service"
elements:
  - type: "component"
    name: "Signaling & Session Manager Component"
    technology: "Node.js/Go, gRPC/WebSockets"
    description: "Manages session signaling, connection negotiation, and real-time messaging for video consultations."
  - type: "component"
    name: "Adaptive Quality & Fallback Controller Component"
    technology: "C++/WebRTC, DTLS/SCTP"
    description: "Controls video stream quality dynamically and manages fallback paths under unstable network conditions."
  - type: "component"
    name: "TURN Relay Coordinator Component"
    technology: "Coturn-based, UDP/TCP/TLS"
    description: "Coordinates NAT traversal and relay allocations for secure peer-to-peer media streams."
relationships:
  - source: "Signaling & Session Manager Component"
    destination: "Adaptive Quality & Fallback Controller Component"
    description: "Coordinates session state and adaptation parameters"
  - source: "Signaling & Session Manager Component"
    destination: "TURN Relay Coordinator Component"
    description: "Allocates relay paths for session media"