level: component
scope: "Component diagram for the Consent & Data Management Service container"
parentContainer:
  name: "Consent & Data Management Service"
elements:
  - type: "component"
    name: "Consent API Controller"
    technology: "Go / Java (Spring Boot)"
    description: "Handles incoming consent-related API requests and coordinates validation and processing workflows."
  - type: "component"
    name: "Residency Enforcer & Policy Engine"
    technology: "Open Policy Agent (OPA)"
    description: "Evaluates dynamic consent and regional data residency policies."
  - type: "component"
    name: "Regional Vault Manager"
    technology: "JDBC over mTLS"
    description: "Manages regional data storage and vault access ensuring regional isolation."
  - type: "component"
    name: "Consent Event Publisher"
    technology: "GCP Pub/Sub"
    description: "Publishes consent and revocation events across regions instantly."
  - type: "component"
    name: "Break-Glass Evaluator"
    technology: "Go / Java (Spring Boot)"
    description: "Validates and evaluates emergency break-glass access requests."
relationships:
  - source: "Consent API Controller"
    destination: "Residency Enforcer & Policy Engine"
    description: "In-process function calls"
  - source: "Residency Enforcer & Policy Engine"
    destination: "Regional Vault Manager"
    description: "JDBC over mTLS"
  - source: "Residency Enforcer & Policy Engine"
    destination: "Consent Event Publisher"
    description: "GCP Pub/Sub"
  - source: "Consent API Controller"
    destination: "Break-Glass Evaluator"
    description: "In-process validation"
  - source: "Break-Glass Evaluator"
    destination: "Immutable Logging Service"
    description: "GCP Pub/Sub, regional CMEK"