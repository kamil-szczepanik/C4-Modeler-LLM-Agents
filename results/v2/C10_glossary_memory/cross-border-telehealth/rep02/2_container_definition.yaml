level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU & US)"
    description: "Patients located in the EU and US seeking video consultations, e-prescriptions, and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals providing remote video consultations and issuing e-prescriptions."
  - type: "person"
    name: "Pharmacists (EU/US)"
    description: "Pharmacists fulfilling e-prescriptions across EU and US regions."
  - type: "person"
    name: "Compliance & Regulatory Auditors"
    description: "Auditors reviewing system compliance against HIPAA and EU MDR regulations."
  - type: "externalSystem"
    name: "National e-Prescription Gateways (EU)"
    description: "External national gateways in the EU for processing e-prescriptions using national standards."
  - type: "externalSystem"
    name: "Pharmacy Systems (US)"
    description: "External US pharmacy systems for fulfilling prescriptions using HL7 FHIR."
  - type: "externalSystem"
    name: "Third-Party Video Infrastructure (WebRTC CPaaS)"
    description: "CPaaS providing WebRTC-compatible video streaming services with adaptive bitrate codecs and TURN relays."
  - type: "externalSystem"
    name: "Regional Identity Providers (eIDAS/OIDC/OAuth 2.0)"
    description: "External identity providers validating authentication tokens using eIDAS, OIDC, and OAuth 2.0."
  - type: "container"
    name: "Frontend UI (with localization)"
    technology: "Flutter Web/Mobile"
    description: "Localized user interface with offline-first local storage supporting compliance flows."
  - type: "container"
    name: "Regional API Gateways"
    technology: "GCP Cloud Endpoints/API Gateway"
    description: "API gateways deployed in GCP regions to handle incoming regional traffic."
  - type: "container"
    name: "Video Streaming Service"
    technology: "WebRTC, UDP/TCP/TLS, TURN"
    description: "Manages low-bandwidth video consultations."
  - type: "container"
    name: "AI Symptom Checker Service"
    technology: "AI / GCP, Cloud HSM"
    description: "Provides AI-driven symptom checking with cryptographically signed outputs."
  - type: "container"
    name: "Consent & Data Management Service"
    technology: "CMEK, GCP"
    description: "Manages user consent and enforces regional data residency and CMEK encryption."
  - type: "container"
    name: "Immutable Logging Service"
    technology: "GCP Cloud Storage, Cloud Logging, Pub/Sub"
    description: "Records audit trails and cryptographically signed AI outputs locally per region."
relationships:
  - source: "Patients (EU & US)"
    destination: "Frontend UI (with localization)"
    description: "Interact with the platform for consultations and symptom checking"
    technology: "HTTPS (TLS 1.3), secure WebSockets, OIDC/OAuth 2.0"
  - source: "Licensed Clinicians"
    destination: "Frontend UI (with localization)"
    description: "Conduct video consultations and manage e-prescriptions"
    technology: "HTTPS (TLS 1.3), secure WebSockets, OIDC/OAuth 2.0"
  - source: "Pharmacists (EU/US)"
    destination: "Frontend UI (with localization)"
    description: "Access and fulfill e-prescriptions"
    technology: "HTTPS (TLS 1.3), secure WebSockets, OIDC/OAuth 2.0"
  - source: "Compliance & Regulatory Auditors"
    destination: "Frontend UI (with localization)"
    description: "Review audit trails and compliance logs"
    technology: "HTTPS (TLS 1.3)"
  - source: "Frontend UI (with localization)"
    destination: "Regional API Gateways"
    description: "Sends API requests for core telehealth operations"
    technology: "HTTPS (REST/GraphQL), TLS 1.3"
  - source: "Regional API Gateways"
    destination: "Consent & Data Management Service"
    description: "Manages encrypted patient data and regional consents"
    technology: "gRPC over mTLS"
  - source: "AI Symptom Checker Service"
    destination: "Immutable Logging Service"
    description: "Streams cryptographically signed AI outputs for audit and traceability"
    technology: "GCP Pub/Sub (encrypted with regional CMEK)"
  - source: "Regional API Gateways"
    destination: "Third-Party Video Infrastructure (WebRTC CPaaS)"
    description: "Connects for low-bandwidth video consultations"
    technology: "WebRTC (UDP/TCP/TLS via TURN relays)"
  - source: "Regional API Gateways"
    destination: "National e-Prescription Gateways (EU)"
    description: "Integrates for EU e-prescriptions"
    technology: "HTTPS/REST (national standards)"
  - source: "Regional API Gateways"
    destination: "Pharmacy Systems (US)"
    description: "Integrates for US prescription fulfillment"
    technology: "HTTPS/REST (HL7 FHIR)"