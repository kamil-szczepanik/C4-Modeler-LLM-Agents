level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "EU & US patients seeking video consultations, e-prescriptions, and AI symptom checks."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals providing video consultations and issuing e-prescriptions."
  - type: "externalSystem"
    name: "Pharmacies"
    description: "EU/US pharmacies fulfilling prescriptions."
  - type: "externalSystem"
    name: "External Pharmacies"
    description: "EU national gateways and US pharmacy networks."
  - type: "externalSystem"
    name: "Regional Identity & Consent Providers"
    description: "eIDAS/EU login and US IAM managing identity and consent."
  - type: "externalSystem"
    name: "AI Model Providers / Medical Devices"
    description: "External AI inference APIs powering the AI symptom checker."
  - type: "container"
    name: "Patient Web/Mobile App"
    technology: "Flutter / React Native"
    description: "Powers the Patient Web/Mobile App with local state caching for unstable connections."
  - type: "container"
    name: "Clinician Portal"
    technology: "React SPA"
    description: "Powers the Clinician Portal."
  - type: "container"
    name: "API Gateway & Routing Service"
    technology: "Envoy Proxy / Istio"
    description: "Manages API gateway routing, Istio service mesh mTLS, and Canary deployments."
  - type: "container"
    name: "Core Telehealth Service"
    technology: "Node.js / Go"
    description: "Powers the Core Telehealth Service handling consultations and consent."
  - type: "container"
    name: "E-Prescription Interoperability Service"
    technology: "Spring Boot / Apache Camel"
    description: "Powers the E-Prescription Interoperability Service translating HL7 FHIR and national EU standards."
  - type: "container"
    name: "AI Symptom Checker Service"
    technology: "Python / FastAPI"
    description: "Powers the AI Symptom Checker Service with local PII/PHI masking."
  - type: "container"
    name: "Database Cluster"
    technology: "Cloud Spanner / PostgreSQL"
    description: "Regional data stores secured with Google Cloud KMS CMEK."
relationships:
  - source: "Patients"
    destination: "Patient Web/Mobile App"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS / WebSockets (adaptive codec)"
  - source: "Licensed Clinicians"
    destination: "Clinician Portal"
    description: "Manages patient consultations and issues e-prescriptions"
    technology: "HTTPS"
  - source: "Patient Web/Mobile App"
    destination: "API Gateway & Routing Service"
    description: "Sends client requests through gateway"
    technology: "HTTPS / WebSockets"
  - source: "Clinician Portal"
    destination: "API Gateway & Routing Service"
    description: "Sends clinician requests through gateway"
    technology: "HTTPS"
  - source: "API Gateway & Routing Service"
    destination: "Core Telehealth Service"
    description: "Routes consultation and consent requests"
    technology: "gRPC / mTLS"
  - source: "API Gateway & Routing Service"
    destination: "E-Prescription Interoperability Service"
    description: "Routes e-prescription requests"
    technology: "gRPC / mTLS"
  - source: "API Gateway & Routing Service"
    destination: "AI Symptom Checker Service"
    description: "Routes symptom check requests"
    technology: "gRPC / mTLS"
  - source: "Core Telehealth Service"
    destination: "Database Cluster"
    description: "Reads and writes telehealth and consent data"
    technology: "TCP / CMEK"
  - source: "E-Prescription Interoperability Service"
    destination: "External Pharmacies"
    description: "Sends e-prescriptions and fulfillment requests"
    technology: "TLS / Mutual TLS"
  - source: "AI Symptom Checker Service"
    destination: "AI Model Providers / Medical Devices"
    description: "Sends masked payloads for AI inference"
    technology: "HTTPS (REST/gRPC with payload masking)"
  - source: "Core Telehealth Service"
    destination: "Regional Identity & Consent Providers"
    description: "Authenticates users and validates consent"
    technology: "OAuth2 / OpenID Connect"