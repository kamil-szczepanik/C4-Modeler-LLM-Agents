level: component
scope: "Component diagram for the API Gateway & Routing Service container"
parentContainer:
  name: "API Gateway & Routing Service"
elements:
  - type: "component"
    name: "Envoy Edge Proxy"
    technology: "Envoy Proxy"
    description: "Manages regional API gateway routing, ingress traffic, and geo-routing policies."
  - type: "component"
    name: "Istio Service Mesh Sidecar"
    technology: "Istio"
    description: "Handles mTLS security, service-to-service encryption, and Canary deployments."
  - type: "component"
    name: "Rate Limiter & Consent Router"
    technology: "Node.js / Envoy Extension"
    description: "Enforces regional rate-limiting and verifies consent states before routing requests."
relationships:
  - source: "Envoy Edge Proxy"
    destination: "Istio Service Mesh Sidecar"
    description: "Routes filtered traffic [gRPC / mTLS]"
  - source: "Rate Limiter & Consent Router"
    destination: "Envoy Edge Proxy"
    description: "Controls request flow and validation"