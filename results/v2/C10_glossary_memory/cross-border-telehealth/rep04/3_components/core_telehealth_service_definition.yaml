level: component
scope: "Component diagram for the Core Telehealth Service container"
parentContainer:
  name: "Core Telehealth Service"
elements:
  - type: "component"
    name: "Consultation Management Component"
    technology: "Go"
    description: "Handles secure video consultations, session handling, and real-time communication routing."
  - type: "component"
    name: "Consent & Identity Integration Component"
    technology: "Go / OAuth2 / OpenID Connect"
    description: "Manages integration with Regional Identity & Consent Providers for EU and US compliance."
relationships:
  - source: "Consultation Management Component"
    destination: "Database Cluster"
    description: "Stores consultation metadata and state (TCP / CMEK)"
  - source: "Consent & Identity Integration Component"
    destination: "Regional Identity & Consent Providers"
    description: "Authenticates users and verifies consent (OAuth2 / OpenID Connect)"