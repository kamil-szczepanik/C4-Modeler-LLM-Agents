level: component
scope: "Component diagram for the Clinician Portal container"
parentContainer:
  name: "Clinician Portal"
elements:
  - type: "component"
    name: "Consultation Workspace Component"
    technology: "React / WebRTC"
    description: "Manages live video feeds and low-bandwidth fallback tools."
  - type: "component"
    name: "AI Audit Reviewer Component"
    technology: "React SPA"
    description: "Displays traceable AI symptom-checker recommendations and model versions."
  - type: "component"
    name: "E-Prescription Dashboard Component"
    technology: "React SPA"
    description: "Interfaces with regional standards and features a Cross-Border Pharmacy Routing Indicator."
  - type: "component"
    name: "Portal Navigation Shell Component"
    technology: "React Router"
    description: "Manages layout routing, role-based view rendering, and error boundaries."
  - type: "component"
    name: "Portal State Management Component"
    technology: "Redux Toolkit / React Query"
    description: "Managing session state, RBAC, and inactivity timeouts without caching PHI/PII."
  - type: "component"
    name: "API Client Component"
    technology: "Axios / WebSockets / OpenTelemetry"
    description: "Client handling secure egress with OpenTelemetry distributed tracing."
  - type: "component"
    name: "Clinician Portal"
    technology: "GCP Cloud Storage / Cloud CDN"
    description: "React SPA providing the clinician user interface."
relationships:
  - source: "Clinician Portal"
    destination: "GCP Cloud Storage / Cloud CDN"
    description: "Serves static SPA assets globally per region [HTTPS]"
  - source: "Clinician Portal"
    destination: "Regional Identity & Consent Providers"
    description: "Authenticates clinicians via OIDC with short-lived JWTs [HTTPS]"
  - source: "Clinician Portal"
    destination: "API Gateway & Routing Service"
    description: "Routes all outbound traffic via API Client Component [HTTPS]"
  - source: "Portal Navigation Shell Component"
    destination: "Consultation Workspace Component"
    description: "Renders active consultation view [React Props / State]"
  - source: "Portal Navigation Shell Component"
    destination: "AI Audit Reviewer Component"
    description: "Renders audit logs view [React Props / State]"
  - source: "Portal Navigation Shell Component"
    destination: "E-Prescription Dashboard Component"
    description: "Renders prescription and routing view [React Props / State]"
  - source: "Consultation Workspace Component"
    destination: "API Client Component"
    description: "Fetches video stream metadata [HTTPS / WebSockets]"
  - source: "AI Audit Reviewer Component"
    destination: "API Client Component"
    description: "Queries traceable AI logs [HTTPS]"
  - source: "E-Prescription Dashboard Component"
    destination: "API Client Component"
    description: "Submits prescriptions [HTTPS]"