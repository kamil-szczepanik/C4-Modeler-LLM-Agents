level: component
scope: "Component diagram for the E-Prescription Interoperability Service container"
parentContainer:
  name: "E-Prescription Interoperability Service"
elements:
  - type: "component"
    name: "Prescription Router Component"
    technology: "Apache Camel EIP"
    description: "Routes e-prescription messages using Enterprise Integration Patterns."
  - type: "component"
    name: "HL7 FHIR Translator Component"
    technology: "Java / HAPI FHIR"
    description: "Implements HL7 FHIR standard translations for US prescription compliance."
  - type: "component"
    name: "EU National Gateway Adapter Component"
    technology: "Apache Camel / Spring Integration"
    description: "Adapts and communicates with EU national gateways for cross-border prescription delivery."
  - type: "component"
    name: "Prescription Audit & Status Service Component"
    technology: "Spring Boot / Data JPA"
    description: "Tracks prescription audit trails and operational status."
  - type: "component"
    name: "Security & Token Validation Component"
    technology: "Spring Security / OAuth2"
    description: "Handles security checks and token validation for incoming requests."
  - type: "component"
    name: "Dead-Letter Queue (DLQ) & Retry Handler Component"
    technology: "Google Cloud Pub/Sub"
    description: "Manages resilient asynchronous dead-letter queues and message retries."
  - type: "component"
    name: "External Pharmacies"
    technology: "EU national gateways and US pharmacy networks"
    description: "External systems representing EU national gateways and US pharmacy networks."
relationships:
  - source: "API Gateway & Routing Service"
    destination: "Security & Token Validation Component"
    description: "gRPC / mTLS"
  - source: "Security & Token Validation Component"
    destination: "Prescription Router Component"
    description: "Direct / In-memory"
  - source: "Prescription Router Component"
    destination: "EU National Gateway Adapter Component"
    description: "Direct / In-memory"
  - source: "Prescription Router Component"
    destination: "HL7 FHIR Translator Component"
    description: "Direct / In-memory"
  - source: "Prescription Router Component"
    destination: "Dead-Letter Queue (DLQ) & Retry Handler Component"
    description: "AMQP / Pub/Sub"
  - source: "EU National Gateway Adapter Component"
    destination: "External Pharmacies"
    description: "TLS / Mutual TLS with digital signatures"