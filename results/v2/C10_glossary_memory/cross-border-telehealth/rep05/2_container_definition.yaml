level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "End-users receiving video consultations, e-prescriptions, and using the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Healthcare professionals providing video consultations and issuing e-prescriptions to patients."
  - type: "person"
    name: "Compliance Officers / Auditors"
    description: "Personnel responsible for auditing system logs and ensuring regulatory compliance."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways"
    description: "External EU gateways for managing and transmitting e-prescriptions."
  - type: "externalSystem"
    name: "US Pharmacy Networks (Surescripts)"
    description: "External US pharmacy networks for processing prescriptions."
  - type: "externalSystem"
    name: "Identity Providers (eIDAS / OAuth2/OIDC)"
    description: "External identity providers for secure authentication and identity verification."
  - type: "externalSystem"
    name: "Regional Payment & Insurance Gateways"
    description: "External gateways handling regional payments and insurance verification."
  - type: "container"
    name: "Web Application Container"
    technology: "React / Next.js"
    description: "Frontend web application serving patients and clinicians."
  - type: "container"
    name: "API Gateway Container"
    technology: "Envoy / GCP API Gateway"
    description: "Manages and routes incoming API requests to internal microservices."
  - type: "container"
    name: "Core Services Container"
    technology: "Go / Node.js microservices"
    description: "Core business logic microservices for telehealth operations."
  - type: "container"
    name: "AI Symptom Checker Container"
    technology: "Python / FastAPI + Vertex AI"
    description: "Processes symptom inputs and generates traceable, versioned recommendations."
  - type: "container"
    name: "Media Relay Container"
    technology: "Janus / WebRTC SFU"
    description: "Handles WebRTC media streaming for video consultations."
  - type: "container"
    name: "E-Prescription Integration Container"
    technology: "Java / Spring Boot"
    description: "Integrates with external e-prescription gateways and pharmacy networks."
  - type: "container"
    name: "Databases"
    technology: "GCP Cloud SQL for PostgreSQL"
    description: "Relational database secured via CMEK for persistent data storage."
relationships:
  - source: "Patients"
    destination: "Web Application Container"
    description: "Views and interacts with the platform"
    technology: "HTTPS"
  - source: "Licensed Clinicians"
    destination: "Web Application Container"
    description: "Manages consultations and patient care"
    technology: "HTTPS"
  - source: "Web Application Container"
    destination: "API Gateway Container"
    description: "Sends API requests"
    technology: "HTTPS / REST & GraphQL"
  - source: "Patients"
    destination: "Media Relay Container"
    description: "Streams video consultations"
    technology: "WebRTC / DTLS-SRTP, UDP"
  - source: "Licensed Clinicians"
    destination: "Media Relay Container"
    description: "Streams video consultations"
    technology: "WebRTC / DTLS-SRTP, UDP"
  - source: "API Gateway Container"
    destination: "Core Services Container"
    description: "Routes requests to core business logic"
    technology: "gRPC over mTLS"
  - source: "API Gateway Container"
    destination: "AI Symptom Checker Container"
    description: "Routes symptom check requests"
    technology: "gRPC over mTLS"
  - source: "Core Services Container"
    destination: "E-Prescription Integration Container"
    description: "Requests e-prescription processing"
    technology: "gRPC over mTLS"
  - source: "Core Services Container"
    destination: "Databases"
    description: "Reads and writes relational data"
    technology: "TCP / SSL"
  - source: "E-Prescription Integration Container"
    destination: "EU National E-Prescription Gateways"
    description: "Transmits e-prescriptions"
    technology: "HTTPS / mTLS / HL7 FHIR"
  - source: "E-Prescription Integration Container"
    destination: "US Pharmacy Networks (Surescripts)"
    description: "Transmits e-prescriptions"
    technology: "HTTPS / mTLS / HL7 FHIR"