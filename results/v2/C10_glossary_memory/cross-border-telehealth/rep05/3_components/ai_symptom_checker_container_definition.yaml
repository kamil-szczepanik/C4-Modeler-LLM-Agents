level: component
scope: "Component diagram for the AI Symptom Checker Container container"
parentContainer:
  name: "AI Symptom Checker Container"
elements:
  - type: "component"
    name: "Symptom Router"
    technology: "Python / FastAPI Router"
    description: "Handles incoming gRPC requests over mTLS and routes symptom triage payloads."
  - type: "component"
    name: "Triage Engine"
    technology: "Python / Asyncio"
    description: "Processes symptom inputs asynchronously for high-performance recommendation generation."
  - type: "component"
    name: "Vertex AI Integration Client"
    technology: "Python / GCP SDK via Private Service Connect"
    description: "Communicates securely with GCP Vertex AI to fetch managed AI triage recommendations."
relationships:
  - source: "Symptom Router"
    destination: "Triage Engine"
    description: "Forwards structured triage requests"
  - source: "Triage Engine"
    destination: "Vertex AI Integration Client"
    description: "Invokes managed AI models"