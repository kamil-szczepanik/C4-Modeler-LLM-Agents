level: component
scope: "Component diagram for the Core Services Container container"
parentContainer:
  name: "Core Services Container"
elements:
  - type: "component"
    name: "Telehealth Core API Controller"
    technology: "Go / Node.js REST & gRPC handler"
    description: "Handles incoming API requests from the API Gateway, enforcing business workflows for video consultations and user management."
  - type: "component"
    name: "Appointment & Consultation Service"
    technology: "Go / Node.js business logic module"
    description: "Manages scheduling, session states, and coordination for cross-border video consultations between patients and clinicians."
  - type: "component"
    name: "Prescription Orchestrator"
    technology: "Go / Node.js orchestration module"
    description: "Coordinates e-prescription workflows by dispatching requests to the E-Prescription Integration Container."
  - type: "component"
    name: "Data Access Repository"
    technology: "Go / Node.js database connector (TCP/SSL)"
    description: "Manages secure data persistence and retrieval interacting with GCP Cloud SQL for PostgreSQL."
relationships:
  - source: "Telehealth Core API Controller"
    destination: "Appointment & Consultation Service"
    description: "Delegates appointment and consultation requests"
  - source: "Telehealth Core API Controller"
    destination: "Prescription Orchestrator"
    description: "Delegates prescription handling workflows"
  - source: "Appointment & Consultation Service"
    destination: "Data Access Repository"
    description: "Reads and writes consultation state data"
  - source: "Prescription Orchestrator"
    destination: "Data Access Repository"
    description: "Reads and writes prescription tracking records"