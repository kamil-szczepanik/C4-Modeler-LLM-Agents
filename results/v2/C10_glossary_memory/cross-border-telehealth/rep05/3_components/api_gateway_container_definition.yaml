level: component
scope: "Component diagram for the API Gateway Container container"
parentContainer:
  name: "API Gateway Container"
elements:
  - type: "component"
    name: "Rate Limiting Component"
    technology: "Envoy WASM/Lua filter"
    description: "Enforces rate limits on incoming API requests to prevent abuse."
  - type: "component"
    name: "Geo-Router Component"
    technology: "Envoy routing filter"
    description: "Routes regional traffic to isolate workloads in appropriate data centers."
  - type: "component"
    name: "Auth & Token Introspection Component"
    technology: "Envoy OIDC/OAuth2 filter"
    description: "Validates security tokens and integrates with identity providers."
  - type: "component"
    name: "Upstream Proxy Component"
    technology: "Envoy proxy cluster"
    description: "Proxies and balances traffic to upstream microservices."
relationships:
  - source: "Rate Limiting Component"
    destination: "Upstream Proxy Component"
    description: "Inspects and passes allowed requests"
  - source: "Geo-Router Component"
    destination: "Upstream Proxy Component"
    description: "Directs traffic to regional endpoints"
  - source: "Auth & Token Introspection Component"
    destination: "Rate Limiting Component"
    description: "Authenticates requests before rate limiting"