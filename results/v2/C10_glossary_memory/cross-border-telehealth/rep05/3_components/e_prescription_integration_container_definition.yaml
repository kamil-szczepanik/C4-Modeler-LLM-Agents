level: component
scope: "Component diagram for the E-Prescription Integration Container container"
parentContainer:
  name: "E-Prescription Integration Container"
elements:
  - type: "component"
    name: "Prescription Gateway Controller"
    technology: "Spring MVC / REST"
    description: "Exposes REST endpoints for receiving e-prescription requests from core microservices."
  - type: "component"
    name: "Prescription Orchestrator Service"
    technology: "Spring Service / Business Logic"
    description: "Manages business logic, data mapping, and routing for international prescriptions."
  - type: "component"
    name: "EU Gateway Client"
    technology: "Spring Cloud OpenFeign / HL7 FHIR"
    description: "Integrates securely with EU National E-Prescription Gateways via mTLS."
  - type: "component"
    name: "US Pharmacy Client"
    technology: "Spring Cloud OpenFeign / HL7 FHIR"
    description: "Integrates securely with US Pharmacy Networks (Surescripts) via mTLS."
  - type: "component"
    name: "Resilience Handler"
    technology: "Resilience4j"
    description: "Provides circuit breaking, retries, and fault tolerance for external network calls."
relationships:
  - source: "Prescription Gateway Controller"
    destination: "Prescription Orchestrator Service"
    description: "Delegates requests"
  - source: "Prescription Orchestrator Service"
    destination: "EU Gateway Client"
    description: "Dispatches EU prescriptions"
  - source: "Prescription Orchestrator Service"
    destination: "US Pharmacy Client"
    description: "Dispatches US prescriptions"
  - source: "EU Gateway Client"
    destination: "Resilience Handler"
    description: "Wraps external calls with fault tolerance"
  - source: "US Pharmacy Client"
    destination: "Resilience Handler"
    description: "Wraps external calls with fault tolerance"