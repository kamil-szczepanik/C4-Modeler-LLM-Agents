level: component
scope: "Component diagram for the Web Application Container container"
parentContainer:
  name: "Web Application Container"
elements:
  - type: "component"
    name: "Web UI Router"
    technology: "Next.js Pages/App Router"
    description: "Manages client-side routing, page rendering strategies (SSR/SSG), and initial view composition for patients and clinicians."
  - type: "component"
    name: "Authentication Client"
    technology: "OAuth2 / OIDC SDK"
    description: "Handles user login, token management, and integration with external Identity Providers (eIDAS / OAuth2/OIDC)."
  - type: "component"
    name: "Telehealth Video Interface"
    technology: "WebRTC Client / React Components"
    description: "Renders real-time video consultation views and manages streaming sessions interfacing with the Media Relay Container."
  - type: "component"
    name: "API Service Client"
    technology: "GraphQL / REST Client (Axios/Apollo)"
    description: "Communicates securely via HTTPS with the API Gateway Container to fetch and update application data."
relationships:
  - source: "Web UI Router"
    destination: "Authentication Client"
    description: "Authenticates users"
  - source: "Web UI Router"
    destination: "Telehealth Video Interface"
    description: "Loads video consultation views"
  - source: "Web UI Router"
    destination: "API Service Client"
    description: "Requests business data and mutations"
  - source: "API Service Client"
    destination: "API Gateway Container"
    description: "Sends HTTPS / REST & GraphQL requests"
  - source: "Telehealth Video Interface"
    destination: "Media Relay Container"
    description: "Establishes WebRTC / DTLS-SRTP, UDP connections"