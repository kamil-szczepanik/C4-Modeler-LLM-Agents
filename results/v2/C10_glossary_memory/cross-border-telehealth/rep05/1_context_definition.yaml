level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients across the EU and US while enforcing strict regional data residency and regulatory compliance."
elements:
  - type: "person"
    name: "Patients"
    description: "End-users receiving video consultations, e-prescriptions, and using the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Healthcare professionals providing video consultations and issuing e-prescriptions to patients."
  - type: "person"
    name: "Compliance Officers / Auditors"
    description: "Personnel responsible for auditing system logs and ensuring regulatory compliance."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways"
    description: "External EU gateways for managing and transmitting e-prescriptions."
  - type: "externalSystem"
    name: "US Pharmacy Networks (Surescripts)"
    description: "External US pharmacy networks for processing prescriptions."
  - type: "externalSystem"
    name: "Identity Providers (eIDAS / OAuth2/OIDC)"
    description: "External identity providers for secure authentication and identity verification."
  - type: "externalSystem"
    name: "Regional Payment & Insurance Gateways"
    description: "External gateways handling regional payments and insurance verification."
relationships:
  - source: "Patients"
    destination: "Cross-Border Telehealth Platform"
    description: "Video consultations, e-prescriptions, and AI symptom checking"
    technology: "HTTPS/WebRTC (DTLS-SRTP, adaptive bitrate)"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Conducting video consultations and managing patient care"
    technology: "HTTPS/WebRTC (DTLS-SRTP, adaptive bitrate)"
  - source: "Auditors"
    destination: "Cross-Border Telehealth Platform"
    description: "Accessing read-only audit logs"
    technology: "HTTPS (IAM roles)"
  - source: "Cross-Border Telehealth Platform"
    destination: "EU National E-Prescription Gateways"
    description: "Transmitting e-prescriptions"
    technology: "secure APIs via mTLS and HL7 FHIR / REST"
  - source: "Cross-Border Telehealth Platform"
    destination: "US Pharmacy Networks (Surescripts)"
    description: "Transmitting e-prescriptions"
    technology: "secure APIs via mTLS and HL7 FHIR / REST"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity Providers (eIDAS / OAuth2/OIDC)"
    description: "Authenticating users"
    technology: "OIDC/OAuth2"
  - source: "Cross-Border Telehealth Platform"
    destination: "Regional Payment & Insurance Gateways"
    description: "Processing payments and insurance claims"
    technology: "HTTPS/REST with tokenization via GCP VPC Service Controls"