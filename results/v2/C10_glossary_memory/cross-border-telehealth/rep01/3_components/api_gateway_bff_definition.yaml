level: component
scope: "Component diagram for the API Gateway & BFF container"
parentContainer:
  name: "API Gateway & BFF"
elements:
  - type: "component"
    name: "Edge Router & TLS Terminator"
    technology: "Envoy Proxy"
    description: "Handles edge routing, TLS termination, and WAF."
  - type: "component"
    name: "Rate Limiting & Resilience Proxy"
    technology: "Envoy/Go"
    description: "Manages rate limiting and resilience proxies for high performance."
  - type: "component"
    name: "Patient & Clinician BFF Service"
    technology: "Go"
    description: "Powers the BFF service for frontend optimization."
  - type: "component"
    name: "Audit & Metadata Interceptor"
    technology: "Go"
    description: "Intercepts requests for audit and metadata logging."
relationships:
  - source: "Edge Router & TLS Terminator"
    destination: "Rate Limiting & Resilience Proxy"
    description: "Routes client traffic"
  - source: "Rate Limiting & Resilience Proxy"
    destination: "Patient & Clinician BFF Service"
    description: "Forwards validated requests"
  - source: "Patient & Clinician BFF Service"
    destination: "Audit & Metadata Interceptor"
    description: "Logs metadata"
  - source: "Patient & Clinician BFF Service"
    destination: "Core Telehealth Service"
    description: "Routes business logic requests [gRPC / mTLS]"
  - source: "Patient & Clinician BFF Service"
    destination: "AI Triage Service"
    description: "Routes symptom-checker requests [gRPC / mTLS]"