level: component
scope: "Component diagram for the Consent & Audit Ledger container"
parentContainer:
  name: "Consent & Audit Ledger"
elements:
  - type: "component"
    name: "Consent Ledger Manager"
    technology: "Go"
    description: "Manages consent records and immutable audit logs with cryptographic integrity."
  - type: "component"
    name: "Auditor Reporting API"
    technology: "Go / HTTPS"
    description: "Provides auditor reporting interface via HTTPS for compliance checks."
  - type: "component"
    name: "PostgreSQL Database Engine"
    technology: "Cloud SQL for PostgreSQL"
    description: "Regionally isolated data persistence secured via GCP Cloud KMS (CMEK), row-level security, and pgcrypto."
relationships:
  - source: "Consent Ledger Manager"
    destination: "PostgreSQL Database Engine"
    description: "Persists audit logs and consent records using PostgreSQL Wire Protocol"
  - source: "Auditor Reporting API"
    destination: "Consent Ledger Manager"
    description: "Queries consent and audit data for compliance reporting"