level: component
scope: "Component diagram for the Core Telehealth Service container"
parentContainer:
  name: "Core Telehealth Service"
elements:
  - type: "component"
    name: "Consultation Session Manager"
    technology: "Java / Spring Boot"
    description: "Manages telehealth consultation sessions and session state recovery."
  - type: "component"
    name: "Consent Enforcement Interceptor"
    technology: "Java / Spring Boot"
    description: "Enforces strict regional consent and data access checks before method execution."
  - type: "component"
    name: "Telehealth Orchestrator"
    technology: "Java / Spring Boot"
    description: "Orchestrates workflows between telehealth services, dispatchers, and triage."
  - type: "component"
    name: "Telehealth Notification & Audit Adapter"
    technology: "Java / Spring Boot"
    description: "Adapts and dispatches audit logs and notifications to the Consent & Audit Ledger."
relationships:
  - source: "Consultation Session Manager"
    destination: "Consent Enforcement Interceptor"
    description: "Internal Method Call"
  - source: "Telehealth Orchestrator"
    destination: "E-Prescription Dispatcher"
    description: "gRPC"
  - source: "Telehealth Notification & Audit Adapter"
    destination: "Consent & Audit Ledger"
    description: "PostgreSQL Wire Protocol"
  - source: "Core Telehealth Service"
    destination: "AI Triage Service"
    description: "gRPC"