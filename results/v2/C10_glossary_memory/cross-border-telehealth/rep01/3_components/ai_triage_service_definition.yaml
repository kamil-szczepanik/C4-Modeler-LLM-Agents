level: component
scope: "Component diagram for the AI Triage Service container"
parentContainer:
  name: "AI Triage Service"
elements:
  - type: "component"
    name: "PHI Sanitizer Component"
    technology: "Python / FastAPI"
    description: "Sanitizes Protected Health Information (PHI) and PII locally before model processing."
  - type: "component"
    name: "Inference Orchestrator Component"
    technology: "Python / FastAPI"
    description: "Orchestrates symptom-checking inference requests and model interactions."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Python / FastAPI"
    description: "Logs AI triage activities and ensures EU MDR traceability and audit compliance."
  - type: "component"
    name: "Clinical Feedback Collector Component"
    technology: "Python / FastAPI"
    description: "Collects clinical feedback for AI triage model refinement and monitoring."
relationships:
  - source: "PHI Sanitizer Component"
    destination: "Inference Orchestrator Component"
    description: "Sends sanitized data"
  - source: "Inference Orchestrator Component"
    destination: "Audit Logger Component"
    description: "Records audit logs"
  - source: "Clinical Feedback Collector Component"
    destination: "Audit Logger Component"
    description: "Logs feedback events"