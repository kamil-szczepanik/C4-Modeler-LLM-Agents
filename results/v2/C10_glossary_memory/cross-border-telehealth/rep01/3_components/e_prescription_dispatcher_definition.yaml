level: component
scope: "Component diagram for the E-Prescription Dispatcher container"
parentContainer:
  name: "E-Prescription Dispatcher"
elements:
  - type: "component"
    name: "Prescription Receiver"
    technology: "Go / gRPC"
    description: "Receives internal prescription dispatch requests from the Core Telehealth Service."
  - type: "component"
    name: "Dispatch Engine"
    technology: "Go"
    description: "Orchestrates secure, reliable, and idempotent cross-border prescription routing."
  - type: "component"
    name: "Pharmacy Client"
    technology: "Go / REST / HL7 FHIR"
    description: "Handles external communication and API interactions with regional pharmacies, health authorities, and payers."
relationships:
  - source: "Prescription Receiver"
    destination: "Dispatch Engine"
    description: "Passes incoming dispatch requests"
  - source: "Dispatch Engine"
    destination: "Pharmacy Client"
    description: "Triggers external prescription transmission"