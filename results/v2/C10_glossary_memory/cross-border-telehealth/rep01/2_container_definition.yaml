level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients & Licensed Clinicians"
    description: "Primary human users interacting via Web and Mobile Apps for video consultations, e-prescriptions, and symptom checking."
  - type: "externalSystem"
    name: "Pharmacies & Regional Health Authorities/Payers"
    description: "External systems handling prescriptions, claims, and reimbursement."
  - type: "externalSystem"
    name: "AI Triage Model Provider"
    description: "GCP Vertex AI managing symptom-checking inference."
  - type: "externalSystem"
    name: "Identity & Consent Providers"
    description: "Region-specific IAM systems supporting OIDC/SAML."
  - type: "container"
    name: "Web & Mobile Apps"
    technology: "Flutter/React"
    description: "Client-facing applications for patients and clinicians."
  - type: "container"
    name: "API Gateway & BFF"
    technology: "Envoy/Go"
    description: "External traffic routing, TLS termination, and backend-for-frontend logic."
  - type: "container"
    name: "Core Telehealth Service"
    technology: "Java/Spring Boot"
    description: "Implements the core telehealth service business logic."
  - type: "container"
    name: "AI Triage Service"
    technology: "Python/FastAPI"
    description: "Powers the AI Triage Service for local PHI/PII sanitization and model interaction."
  - type: "container"
    name: "Consent & Audit Ledger"
    technology: "PostgreSQL"
    description: "Serves as the Consent & Audit Ledger, secured via Customer-Managed Encryption Keys (CMEK) via Cloud KMS."
  - type: "container"
    name: "E-Prescription Dispatcher"
    technology: "Go"
    description: "Dispatches e-prescriptions to regional pharmacies and health authorities."
relationships:
  - source: "Patients & Licensed Clinicians"
    destination: "Web & Mobile Apps"
    description: "Interacts with UI for video consultations, e-prescriptions, and symptom checking"
    technology: "HTTPS/WebRTC"
  - source: "Web & Mobile Apps"
    destination: "API Gateway & BFF"
    description: "Sends client requests and API calls"
    technology: "HTTPS"
  - source: "API Gateway & BFF"
    destination: "Core Telehealth Service"
    description: "Routes business logic requests"
    technology: "gRPC / REST"
  - source: "API Gateway & BFF"
    destination: "AI Triage Service"
    description: "Routes AI symptom checker requests"
    technology: "gRPC / REST"
  - source: "Core Telehealth Service"
    destination: "Consent & Audit Ledger"
    description: "Reads and writes audit logs and consent records"
    technology: "PostgreSQL Wire Protocol"
  - source: "Core Telehealth Service"
    destination: "E-Prescription Dispatcher"
    description: "Triggers e-prescription dispatch"
    technology: "Internal Messaging / gRPC"
  - source: "AI Triage Service"
    destination: "AI Triage Model Provider"
    description: "Performs version-pinned inference APIs"
    technology: "Version-pinned inference APIs (mTLS)"
  - source: "E-Prescription Dispatcher"
    destination: "Pharmacies & Regional Health Authorities/Payers"
    description: "Sends e-prescriptions and health claims"
    technology: "REST / HL7 FHIR"
  - source: "API Gateway & BFF"
    destination: "Identity & Consent Providers"
    description: "Authenticates users"
    technology: "OIDC / SAML"