level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patient"
    description: "Patients interacting with the clinic management system for scheduling and records."
  - type: "person"
    name: "Clinician"
    description: "Doctors and Nurses managing electronic medical records and patient care."
  - type: "person"
    name: "Billing/Admin Staff"
    description: "Staff managing billing, admissions, and administrative tasks."
  - type: "person"
    name: "Compliance Officer"
    description: "Officer responsible for ensuring HIPAA and GDPR compliance."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "External systems providing laboratory and imaging data."
  - type: "externalSystem"
    name: "Insurance Clearinghouse / External Billing Provider"
    description: "External system for insurance claims and billing processing."
  - type: "container"
    name: "Patient Portal SPA/Mobile"
    technology: "React/TypeScript"
    description: "High-performance frontend user interface for patients."
  - type: "container"
    name: "Clinician/Admin Workspace SPA"
    technology: "React/TypeScript"
    description: "High-performance frontend user interface for clinicians and administrative staff."
  - type: "container"
    name: "API Gateway / BFF"
    technology: "Envoy/Kong"
    description: "API gateway for reverse proxy, routing, and token exchange."
  - type: "container"
    name: "Core Services Container"
    technology: "Java/Spring Boot"
    description: "Robust domain logic for core clinical services and electronic medical records."
  - type: "container"
    name: "Billing Service Container"
    technology: "Node.js/TypeScript"
    description: "Isolated financial and billing processing."
  - type: "container"
    name: "Integration Service Container"
    technology: "Apache Camel / Spring Integration"
    description: "HL7 FHIR translation adapters for interoperability with external lab and imaging systems."
  - type: "container"
    name: "Audit & Compliance Logging Container"
    technology: "WORM-compliant storage / Spring Integration"
    description: "Ensures comprehensive service mesh security and regulatory compliance logging."
  - type: "container"
    name: "PostgreSQL & HL7 FHIR Compliant Data Stores"
    technology: "PostgreSQL with AES-256 at rest"
    description: "Relational persistence with AES-256 encryption at rest."
  - type: "container"
    name: "Message Broker"
    technology: "RabbitMQ/Kafka"
    description: "Asynchronous messaging for resilient insurance claim submissions and decoupled communication."
relationships:
  - source: "Patient"
    destination: "API Gateway / BFF"
    description: "Interacts with portal for scheduling and records"
    technology: "HTTPS (TLS 1.3, OAuth2/OIDC, MFA)"
  - source: "Clinician"
    destination: "API Gateway / BFF"
    description: "Accesses workspace for patient care and EMR"
    technology: "HTTPS (TLS 1.3, OAuth2/OIDC, MFA)"
  - source: "Billing/Admin Staff"
    destination: "API Gateway / BFF"
    description: "Manages billing and administrative tasks"
    technology: "HTTPS (TLS 1.3, OAuth2/OIDC, MFA)"
  - source: "Compliance Officer"
    destination: "API Gateway / BFF"
    description: "Monitors and audits system compliance"
    technology: "HTTPS (TLS 1.3, OAuth2/OIDC, MFA)"
  - source: "API Gateway / BFF"
    destination: "Patient Portal SPA/Mobile"
    description: "Routes requests to"
    technology: "HTTPS"
  - source: "API Gateway / BFF"
    destination: "Clinician/Admin Workspace SPA"
    description: "Routes requests to"
    technology: "HTTPS"
  - source: "API Gateway / BFF"
    destination: "Core Services Container"
    description: "Forwards core clinical requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway / BFF"
    destination: "Billing Service Container"
    description: "Forwards billing requests"
    technology: "gRPC over mTLS"
  - source: "Core Services Container"
    destination: "PostgreSQL & HL7 FHIR Compliant Data Stores"
    description: "Persists and retrieves clinical data"
    technology: "JDBC (AES-256 at rest)"
  - source: "Billing Service Container"
    destination: "Message Broker"
    description: "Sends asynchronous insurance claim submissions"
    technology: "AMQP"
  - source: "Integration Service Container"
    destination: "Lab & Imaging Systems"
    description: "Exchanges clinical and imaging data"
    technology: "HL7 FHIR over REST/JSON (TLS 1.3)"
  - source: "Billing Service Container"
    destination: "Insurance Clearinghouse / External Billing Provider"
    description: "Submits insurance claims"
    technology: "HTTPS / EDI X12"