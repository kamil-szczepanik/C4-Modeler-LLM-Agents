level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed to manage patient admissions, electronic medical records, scheduling, and billing for medium-sized hospitals and clinics, ensuring HIPAA and GDPR compliance."
elements:
  - type: "person"
    name: "Patient"
    description: "Patients interacting with the clinic management system for scheduling and records."
  - type: "person"
    name: "Clinician"
    description: "Doctors and Nurses managing electronic medical records and patient care."
  - type: "person"
    name: "Billing/Admin Staff"
    description: "Staff managing billing, admissions, and administrative tasks."
  - type: "person"
    name: "Compliance Officer"
    description: "Officer responsible for ensuring HIPAA and GDPR compliance."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "External systems providing laboratory and imaging data."
  - type: "externalSystem"
    name: "Insurance Clearinghouse / External Billing Provider"
    description: "External system for insurance claims and billing processing."
relationships:
  - source: "Patient"
    destination: "Clinic Management System"
    description: "Manages admissions, appointments, and records"
    technology: "HTTPS (TLS 1.3, OAuth2/OIDC, MFA)"
  - source: "Clinician"
    destination: "Clinic Management System"
    description: "Accesses and updates electronic medical records and schedules"
    technology: "HTTPS (TLS 1.3, OAuth2/OIDC, MFA)"
  - source: "Billing/Admin Staff"
    destination: "Clinic Management System"
    description: "Manages billing and administrative workflows"
    technology: "HTTPS (TLS 1.3, OAuth2/OIDC, MFA)"
  - source: "Compliance Officer"
    destination: "Clinic Management System"
    description: "Monitors and audits system compliance and access logs"
    technology: "HTTPS (TLS 1.3, OAuth2/OIDC, MFA)"
  - source: "Clinic Management System"
    destination: "Lab & Imaging Systems"
    description: "Exchanges clinical data and imaging results"
    technology: "HL7 FHIR over REST/JSON (TLS 1.3)"
  - source: "Clinic Management System"
    destination: "Insurance Clearinghouse / External Billing Provider"
    description: "Submits billing and insurance claims"
    technology: "HTTPS / EDI X12"