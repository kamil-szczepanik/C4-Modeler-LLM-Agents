level: component
scope: "Component diagram for the Core Services Container container"
parentContainer:
  name: "Core Services Container"
elements:
  - type: "component"
    name: "Clinical Domain Controller"
    technology: "Spring MVC / REST"
    description: "Exposes REST endpoints for electronic medical records, patient admissions, and scheduling."
  - type: "component"
    name: "EMR Clinical Service"
    technology: "Java / Spring Boot"
    description: "Encapsulates robust clinical domain logic and meets the <1s P95 EMR performance requirement."
  - type: "component"
    name: "Persistence Repository"
    technology: "Spring Data JPA / JDBC"
    description: "Manages database operations and connects to the PostgreSQL data store securely."
relationships:
  - source: "Clinical Domain Controller"
    destination: "EMR Clinical Service"
    description: "Delegates business requests to"
  - source: "EMR Clinical Service"
    destination: "Persistence Repository"
    description: "Executes queries via"