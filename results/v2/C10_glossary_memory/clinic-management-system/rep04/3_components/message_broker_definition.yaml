level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Ingestion & Authentication Gateway"
    technology: "Apache Kafka / KRaft"
    description: "Handles incoming connections, mTLS verification, and client authentication for producers and consumers."
  - type: "component"
    name: "Distributed Commit Log Engine"
    technology: "Apache Kafka Log Storage"
    description: "Persists messages sequentially with AES-256 encryption at rest, ensuring high throughput and durability."
  - type: "component"
    name: "Offset & Consumer Group Coordinator"
    technology: "Kafka Consumer Coordinator"
    description: "Manages consumer group rebalancing, offset tracking, and reliable asynchronous message delivery across services."
relationships:
  - source: "Ingestion & Authentication Gateway"
    destination: "Distributed Commit Log Engine"
    description: "Routes authenticated messages to"
  - source: "Distributed Commit Log Engine"
    destination: "Offset & Consumer Group Coordinator"
    description: "Coordinates consumption streams with"