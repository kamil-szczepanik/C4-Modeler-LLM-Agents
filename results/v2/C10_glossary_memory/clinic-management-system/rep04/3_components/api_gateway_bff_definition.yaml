level: component
scope: "Component diagram for the API Gateway / BFF container"
parentContainer:
  name: "API Gateway / BFF"
elements:
  - type: "component"
    name: "Edge Routing Controller"
    technology: "Envoy/Kong Router"
    description: "Handles reverse proxying, URL routing, and edge security for incoming traffic."
  - type: "component"
    name: "Token Exchange & Auth Service"
    technology: "OAuth2/OIDC Middleware"
    description: "Manages token exchange, user authentication, and multi-factor authentication validation."
  - type: "component"
    name: "Payload Aggregator"
    technology: "TypeScript/Node.js"
    description: "Aggregates responses to meet sub-second P95 performance targets for SPA clients."
relationships:
  - source: "Edge Routing Controller"
    destination: "Token Exchange & Auth Service"
    description: "Authenticates requests"
  - source: "Edge Routing Controller"
    destination: "Payload Aggregator"
    description: "Forwards routed requests"