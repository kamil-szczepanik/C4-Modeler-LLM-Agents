level: component
scope: "Component diagram for the Audit & Compliance Logging Container container"
parentContainer:
  name: "Audit & Compliance Logging Container"
elements:
  - type: "person"
    name: "Compliance Officer"
    technology: ""
    description: "Officer responsible for ensuring HIPAA and GDPR compliance."
  - type: "container"
    name: "Message Broker"
    technology: "RabbitMQ/Kafka"
    description: "Asynchronous messaging for resilient insurance claim submissions and decoupled communication."
  - type: "component"
    name: "Audit Collector Component"
    technology: "Spring Integration"
    description: "Collects security event logging and messages."
  - type: "component"
    name: "Compliance Query Service Component"
    technology: "Spring MVC"
    description: "Provides secure REST query endpoints for compliance reporting."
  - type: "component"
    name: "Audit Indexing & Tokenization Service Component"
    technology: ""
    description: "Indexes logs and tokenizes PHI for data minimization."
  - type: "component"
    name: "WORM Storage Adapter Component"
    technology: "AWS S3 Compliance Mode / Object Lock"
    description: "Enforces tamper-proof, >= 10-year data retention compliance."
relationships:
  - source: "Compliance Officer"
    destination: "Compliance Query Service Component"
    description: "HTTPS (TLS 1.3, OAuth2/OIDC, MFA)"
  - source: "Message Broker"
    destination: "Audit Collector Component"
    description: "AMQP"
  - source: "Audit Collector Component"
    destination: "Audit Indexing & Tokenization Service Component"
    description: "gRPC over mTLS"
  - source: "Audit Indexing & Tokenization Service Component"
    destination: "WORM Storage Adapter Component"
    description: "S3 API / TLS 1.3 (AES-256 at rest)"