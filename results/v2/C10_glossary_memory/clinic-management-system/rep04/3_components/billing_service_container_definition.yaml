level: component
scope: "Component diagram for the Billing Service Container container"
parentContainer:
  name: "Billing Service Container"
elements:
  - type: "component"
    name: "Billing Controller"
    technology: "Express.js / TypeScript"
    description: "Exposes REST and gRPC endpoints for financial processing and billing operations."
  - type: "component"
    name: "Billing Processor Service"
    technology: "Node.js / TypeScript"
    description: "Executes isolated financial logic, transaction handling, and insurance claim formatting."
  - type: "component"
    name: "Insurance Integration Client"
    technology: "HTTPS / EDI X12 Client"
    description: "Manages secure communication with external insurance clearinghouses and billing providers."
relationships:
  - source: "Billing Controller"
    destination: "Billing Processor Service"
    description: "Delegates financial processing requests"
  - source: "Billing Processor Service"
    destination: "Insurance Integration Client"
    description: "Initiates external claim submissions"