level: component
scope: "Component diagram for the Integration Service Container container"
parentContainer:
  name: "Integration Service Container"
elements:
  - type: "component"
    name: "Integration Service Container"
    technology: "Apache Camel / Spring Integration"
    description: "Hybrid cloud platform container designed to manage patient admissions, electronic medical records, scheduling, and billing."
  - type: "component"
    name: "FHIR Translator Route"
    technology: "Apache Camel / Spring Integration"
    description: "Handles translation of integration routes to HL7 FHIR standards."
  - type: "component"
    name: "Retry & Dead-Letter Handler"
    technology: "RabbitMQ / Apache Camel"
    description: "Manages message redelivery policies and dead-letter queuing for resilient communication."
  - type: "component"
    name: "Connection Monitor"
    technology: "Spring Boot / Resilience4j"
    description: "Monitors connectivity status to external endpoints and systems."
  - type: "component"
    name: "Outbound HTTP Gateway"
    technology: "Spring Integration HTTP"
    description: "Sends outbound HL7 FHIR requests over REST/JSON using TLS 1.3."
  - type: "component"
    name: "Circuit Breaker Component"
    technology: "Resilience4j"
    description: "Provides fault tolerance and circuit breaking for outbound and inbound calls."
  - type: "component"
    name: "Observability Probe"
    technology: "Prometheus / OpenTelemetry"
    description: "Exposes operational metrics, latency tracking, and distributed tracing."
  - type: "component"
    name: "Inbound Polling Adapter"
    technology: "Apache Camel Polling Consumer"
    description: "Polls incoming endpoints and messages for downstream processing."
  - type: "component"
    name: "Message Validation Component"
    technology: "Spring Integration Validator"
    description: "Validates payload structures and ensures payload sanitization and PHI masking."
  - type: "component"
    name: "Ingress Rate Limiter"
    technology: "Bucket4j"
    description: "Controls ingress traffic rates and protects against excessive loads."
  - type: "component"
    name: "Lab & Imaging Systems"
    technology: "External HL7 FHIR Endpoint"
    description: "External systems providing laboratory and imaging data."
  - type: "component"
    name: "Core Services Container"
    technology: "Java / Spring Boot"
    description: "Robust domain logic for core clinical services and electronic medical records."
  - type: "component"
    name: "RabbitMQ"
    technology: "RabbitMQ"
    description: "Asynchronous messaging broker for asynchronous data flows."
  - type: "component"
    name: "Prometheus / OpenTelemetry"
    technology: "Prometheus / OpenTelemetry"
    description: "Monitoring and telemetry collection system."
relationships:
  - source: "Integration Service Container"
    destination: "Lab & Imaging Systems"
    description: "HL7 FHIR over REST/JSON (TLS 1.3 / mTLS)"
  - source: "Lab & Imaging Systems"
    destination: "Integration Service Container"
    description: "HL7 FHIR over REST/JSON (mTLS)"
  - source: "FHIR Translator Route"
    destination: "Outbound HTTP Gateway"
    description: "In-memory / Direct VM"
  - source: "Outbound HTTP Gateway"
    destination: "Lab & Imaging Systems"
    description: "HL7 FHIR over REST/JSON (TLS 1.3)"
  - source: "Integration Service Container"
    destination: "Prometheus / OpenTelemetry"
    description: "OpenMetrics (HTTP)"
  - source: "Inbound Polling Adapter"
    destination: "Message Validation Component"
    description: "In-memory / Direct VM"
  - source: "Message Validation Component"
    destination: "Core Services Container"
    description: "gRPC over mTLS"
  - source: "Integration Service Container"
    destination: "RabbitMQ"
    description: "AMQP"