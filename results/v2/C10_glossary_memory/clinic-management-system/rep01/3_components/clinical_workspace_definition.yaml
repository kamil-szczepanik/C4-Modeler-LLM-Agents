level: component
scope: "Component diagram for the Clinical Workspace container"
parentContainer:
  name: "Clinical Workspace"
elements:
  - type: "component"
    name: "EMR Presentation Component"
    technology: "Kubernetes"
    description: "Handles EMR presentation and rendering for clinical workflows."
  - type: "component"
    name: "Clinical Data Orchestrator"
    technology: "Kubernetes"
    description: "Orchestrates clinical data processing and queries."
  - type: "component"
    name: "Treatment & Prescription Engine"
    technology: "Kubernetes"
    description: "Manages medical treatments and digital prescription sign-offs."
relationships:
  - source: "EMR Presentation Component"
    destination: "Clinical Data Orchestrator"
    description: "Communicates via gRPC over mTLS"
  - source: "Clinical Data Orchestrator"
    destination: "Core Datastore"
    description: "Executes queries via PostgreSQL Read Replicas using CQRS"
  - source: "Treatment & Prescription Engine"
    destination: "Hardware Security Module (HSM)"
    description: "Performs cryptographic sign-offs via FIPS 140-2 / AES-256"
  - source: "Clinical Data Orchestrator"
    destination: "WORM Audit Logging Service"
    description: "Emits compliance and break-glass events via asynchronous secure logging"