level: component
scope: "Component diagram for the WORM Audit Logging Service container"
parentContainer:
  name: "WORM Audit Logging Service"
elements:
  - type: "person"
    name: "Compliance Officers / Auditors"
    technology: "HTTPS / TLS 1.3, OAuth 2.0 / OIDC, MFA"
    description: "Compliance officers and auditors who query and export audit logs for compliance reviews."
  - type: "container"
    name: "Clinical Workspace"
    technology: "Kubernetes"
    description: "Provides medical professionals tools for managing EMRs and patient care."
  - type: "container"
    name: "Billing & Admin Suite"
    technology: "Kubernetes"
    description: "Handles patient admissions, scheduling, and billing operations."
  - type: "container"
    name: "Hardware Security Module (HSM)"
    technology: "FIPS 140-2 Hardware"
    description: "Provides FIPS 140-2 validated cryptographic operations and key management."
  - type: "component"
    name: "Ingestion API Component"
    technology: "Go, REST/gRPC"
    description: "Ingests asynchronous logs from clinical and billing workflows."
  - type: "component"
    name: "Secure Message Broker"
    technology: "Apache Kafka, TLS 1.3"
    description: "Provides durable, encrypted message brokering to prevent log loss during network partitions."
  - type: "component"
    name: "Cryptographic Signing & Verifier Component"
    technology: "Rust, OpenSSL"
    description: "Cryptographically signs and verifies audit logs for data integrity and non-repudiation."
  - type: "component"
    name: "WORM Storage Writer Component"
    technology: "Go, AWS S3 Object Lock / MinIO"
    description: "Writes immutable logs to WORM object storage to ensure compliance and data retention."
  - type: "component"
    name: "Audit Query & Export Component"
    technology: "Go, GraphQL"
    description: "Enables compliant querying and exporting of audit logs for auditors."
  - type: "externalSystem"
    name: "WORM Object Storage"
    technology: "AWS S3 Object Lock / MinIO"
    description: "Enforces Write-Once-Read-Many (WORM) compliance across hybrid cloud storage."

relationships:
  - source: "Clinical Workspace"
    destination: "Ingestion API Component"
    description: "gRPC over mTLS, SPIFFE/SPIRE"
  - source: "Billing & Admin Suite"
    destination: "Ingestion API Component"
    description: "gRPC over mTLS, SPIFFE/SPIRE"
  - source: "Ingestion API Component"
    destination: "Secure Message Broker"
    description: "Encrypted Apache Kafka / TLS 1.3"
  - source: "Secure Message Broker"
    destination: "Cryptographic Signing & Verifier Component"
    description: "Internal gRPC"
  - source: "Cryptographic Signing & Verifier Component"
    destination: "Hardware Security Module (HSM)"
    description: "FIPS 140-2 / PKCS#11"
  - source: "Cryptographic Signing & Verifier Component"
    destination: "WORM Storage Writer Component"
    description: "Internal gRPC"
  - source: "WORM Storage Writer Component"
    destination: "WORM Object Storage"
    description: "AWS S3 Object Lock / MinIO"
  - source: "Compliance Officers / Auditors"
    destination: "Audit Query & Export Component"
    description: "HTTPS / TLS 1.3, OAuth 2.0 / OIDC, MFA"