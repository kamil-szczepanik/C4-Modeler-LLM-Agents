level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Ingress Router"
    technology: "Envoy / NGINX"
    description: "Provides high-performance ingress routing, payload sanitization, and TLS termination."
  - type: "component"
    name: "Security Filter"
    technology: "Lua / WASM"
    description: "Executes low-latency JWT validation, MFA verification, and scope-based access checks."
  - type: "component"
    name: "Rate Limiter"
    technology: "Redis (Cluster)"
    description: "Powers token-bucket rate limiting and distributed token revocation checks."
relationships:
  - source: "Ingress Router"
    destination: "Security Filter"
    description: "Forwards requests for validation and authentication"
  - source: "Security Filter"
    destination: "Rate Limiter"
    description: "Checks rate limits and token revocation"