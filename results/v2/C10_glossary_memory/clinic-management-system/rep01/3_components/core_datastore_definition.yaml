level: component
scope: "Component diagram for the Core Datastore container"
parentContainer:
  name: "Core Datastore"
elements:
  - type: "component"
    name: "Primary Write Datastore"
    technology: "PostgreSQL Master"
    description: "Handles persistent write traffic for EMRs, patient admissions, and billing."
  - type: "component"
    name: "Read Replicas"
    technology: "PostgreSQL Read Replicas"
    description: "Handles read traffic utilizing CQRS pattern to ensure sub-second EMR retrieval."
relationships:
  - source: "Primary Write Datastore"
    destination: "Read Replicas"
    description: "Synchronizes data changes for read isolation and performance."