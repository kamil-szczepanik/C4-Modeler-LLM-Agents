level: component
scope: "Component diagram for the Patient Portal container"
parentContainer:
  name: "Patient Portal"
elements:
  - type: "component"
    name: "Portal API Controller"
    technology: "Node.js / Express"
    description: "Handles asynchronous gRPC traffic and coordinates requests."
  - type: "component"
    name: "Appointment Self-Service Module"
    technology: "TypeScript"
    description: "Manages appointment scheduling and self-service workflows."
  - type: "component"
    name: "Record Viewer Service"
    technology: "TypeScript"
    description: "Retrieves and displays personal health records."
  - type: "component"
    name: "Patient Web Frontend"
    technology: "React / Next.js"
    description: "Delivers a mobile-responsive UI with Content Security Policies."
  - type: "component"
    name: "Patient Cache Manager"
    technology: "Redis"
    description: "In-memory cache manager with TLS 1.3 for sub-second P95 performance."
relationships:
  - source: "Portal API Controller"
    destination: "Appointment Self-Service Module"
    description: "In-process gRPC / TypeScript function calls"
  - source: "Portal API Controller"
    destination: "Record Viewer Service"
    description: "In-process gRPC / TypeScript function calls"
  - source: "Record Viewer Service"
    destination: "Patient Cache Manager"
    description: "Read-through caching via TLS 1.3 over internal service mesh"