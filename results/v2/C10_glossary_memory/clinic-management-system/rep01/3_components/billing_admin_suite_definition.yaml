relationships:
  - source: "Billing Management Service"
    destination: "Core Datastore"
    description: "PostgreSQL with CQRS"
  - source: "Admission Management Service"
    destination: "Core Datastore"
    description: "PostgreSQL with CQRS"
  - source: "Billing Management Service"
    destination: "Hardware Security Module (HSM)"
    description: "FIPS 140-2 / AES-256"
  - source: "Billing Management Service"
    destination: "WORM Audit Logging Service"
    description: "Asynchronous secure logging"