level: component
scope: "Component diagram for the Hardware Security Module (HSM) container"
parentContainer:
  name: "Hardware Security Module (HSM)"
elements:
  - type: "component"
    name: "Cryptographic Engine"
    technology: "FIPS 140-2 Level 3 Hardware"
    description: "Performs hardware-accelerated cryptographic operations and tamper-resistant key storage."
  - type: "component"
    name: "Key Management Service (KMS) Daemon"
    technology: "PKCS#11 / KMIP & TLS 1.3"
    description: "Manages cryptographic keys, lifecycle operations, and zero-downtime key rotation."
  - type: "component"
    name: "Secure Hardware Vault"
    technology: "FIPS 140-2 Level 3 Secure Storage"
    description: "Provides secure, isolated hardware storage for master keys and sensitive cryptographic material."
  - type: "component"
    name: "Key Version Registry"
    technology: "Internal Secure Database"
    description: "Tracks key versions, metadata, and state transitions for cryptographic keys."
relationships:
  - source: "Key Management Service (KMS) Daemon"
    destination: "Secure Hardware Vault"
    description: "Communicates via internal proprietary bus"
  - source: "Key Management Service (KMS) Daemon"
    destination: "Key Version Registry"
    description: "Performs secure database read/write"
  - source: "Cryptographic Engine"
    destination: "Secure Hardware Vault"
    description: "Accesses keys for cryptographic operations"