level: component
scope: "Component diagram for the FHIR Integration Engine container"
parentContainer:
  name: "FHIR Integration Engine"
elements:
  - type: "component"
    name: "FHIR Router"
    technology: "Apache Camel"
    description: "Routes and maps incoming HL7 FHIR messages to internal domain models."
  - type: "component"
    name: "FHIR Resource Mapper"
    technology: "Node.js"
    description: "Transforms FHIR resources for persistence in the Core Datastore."
relationships:
  - source: "FHIR Router"
    destination: "FHIR Resource Mapper"
    description: "Routes mapped payloads"
  - source: "FHIR Resource Mapper"
    destination: "Core Datastore"
    description: "Persists clinical data using PostgreSQL with CQRS"