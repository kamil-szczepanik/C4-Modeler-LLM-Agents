level: context
scope: "System Context diagram for Clinic Management System (CMS)"
system:
  name: "Clinic Management System (CMS)"
  description: "Manages patient admissions, EMRs, scheduling, and billing for healthcare facilities while ensuring strict HIPAA/GDPR compliance and 99.99% availability."
elements:
  - type: "person"
    name: "Patients"
    description: "Patients interacting with the clinic management system for scheduling and personal records."
  - type: "person"
    name: "Clinicians / Medical Staff"
    description: "Medical professionals managing electronic medical records (EMRs) and patient care."
  - type: "person"
    name: "Administrative / Billing Staff"
    description: "Staff managing patient admissions, scheduling, and billing operations."
  - type: "externalSystem"
    name: "External Labs/Imaging"
    description: "External systems providing laboratory and imaging results via FHIR APIs."
  - type: "externalSystem"
    name: "Insurance Payment Gateways"
    description: "External payment processors handling insurance billing and transactions."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External identity provider managing authentication, federation, and step-up MFA."
  - type: "container"
    name: "API Gateway"
    description: "Manages incoming traffic and enforces security policies."
    technology: "Kubernetes / AWS"
  - type: "container"
    name: "Hardware Security Module (HSM)"
    description: "Provides FIPS 140-2 validated cryptographic operations and key management."
    technology: "FIPS 140-2 Hardware"
  - type: "container"
    name: "WORM Audit Logging Service"
    description: "Provides asynchronous WORM auditing for compliance and security."
    technology: "Secure Storage"
relationships:
  - source: "Patients"
    destination: "Clinic Management System (CMS)"
    description: "Accesses scheduling and portal features"
    technology: "HTTPS (TLS 1.3), OAuth 2.0 / OIDC, MFA"
  - source: "Clinicians / Medical Staff"
    destination: "Clinic Management System (CMS)"
    description: "Manages EMRs and patient care data"
    technology: "HTTPS (TLS 1.3), OAuth 2.0 / OIDC, MFA"
  - source: "Administrative / Billing Staff"
    destination: "Clinic Management System (CMS)"
    description: "Handles admissions, scheduling, and billing"
    technology: "HTTPS (TLS 1.3), OAuth 2.0 / OIDC, MFA"
  - source: "External Labs/Imaging"
    destination: "Clinic Management System (CMS)"
    description: "Exchanges clinical data and lab results"
    technology: "HL7 FHIR RESTful APIs over HTTPS"
  - source: "Insurance Payment Gateways"
    destination: "Clinic Management System (CMS)"
    description: "Processes billing and payment transactions"
    technology: "Secure API webhooks / REST"
  - source: "Identity Provider (IdP)"
    destination: "Clinic Management System (CMS)"
    description: "Authenticates users and provides federation"
    technology: "OAuth 2.0 / OpenID Connect (OIDC)"
  - source: "Clinic Management System (CMS)"
    destination: "API Gateway"
    description: "Routes and secures inbound/outbound traffic"
    technology: "mTLS (Mutual TLS 1.3), ZTNA"
  - source: "Clinic Management System (CMS)"
    destination: "Hardware Security Module (HSM)"
    description: "Performs cryptographic encryption and key operations"
    technology: "FIPS 140-2 / AES-256"
  - source: "Clinic Management System (CMS)"
    destination: "WORM Audit Logging Service"
    description: "Records immutable audit logs for compliance"
    technology: "Asynchronous secure logging"