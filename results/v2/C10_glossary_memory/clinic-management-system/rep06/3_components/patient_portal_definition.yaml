level: component
scope: "Component diagram for the Patient Portal container"
parentContainer:
  name: "Patient Portal"
elements:
  - type: "component"
    name: "Patient Portal UI"
    technology: "React / TypeScript, Nginx"
    description: "Web and mobile user interface allowing patients to view personal portal information and manage scheduling."
  - type: "component"
    name: "Portal Authentication Client"
    technology: "OIDC / OAuth 2.0 Client"
    description: "Handles user login, token management, and session validation against the External Identity Provider and API Gateway."
  - type: "component"
    name: "Appointment Scheduler UI"
    technology: "React / TypeScript"
    description: "Component allowing patients to browse available appointment slots, book, and manage scheduling workflows."
relationships:
  - source: "Patient Portal UI"
    destination: "Portal Authentication Client"
    description: "Authenticates users via"
  - source: "Patient Portal UI"
    destination: "Appointment Scheduler UI"
    description: "Renders scheduling views via"
  - source: "Portal Authentication Client"
    destination: "API Gateway"
    description: "Sends secure requests with OIDC tokens via"
  - source: "Appointment Scheduler UI"
    destination: "API Gateway"
    description: "Requests scheduling data via"