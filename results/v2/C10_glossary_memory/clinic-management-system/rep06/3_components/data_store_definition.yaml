level: component
scope: "Component diagram for the Data Store container"
parentContainer:
  name: "Data Store"
elements:
  - type: "component"
    name: "Primary Relational Database"
    technology: "PostgreSQL 16 & Read-Replicas"
    description: "Provides core transactional data storage and offloads analytical queries with active-passive replication."
  - type: "component"
    name: "Audit & Archive Object Store"
    technology: "S3-compatible Object Storage with Object Lock"
    description: "Enforces immutable 10-year WORM retention and automated tiering."
  - type: "component"
    name: "Read Replica Cluster"
    technology: "PostgreSQL Read-Replicas"
    description: "Handles read-heavy workloads and offloads analytical queries from the primary transactional database."
relationships:
  - source: "Primary Relational Database"
    destination: "Audit & Archive Object Store"
    description: "S3 API / TLS 1.3"
  - source: "Primary Relational Database"
    destination: "Read Replica Cluster"
    description: "Active-passive replication"