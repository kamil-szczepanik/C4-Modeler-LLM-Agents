level: component
scope: "Component diagram for the Patient Admission Service container"
parentContainer:
  name: "Patient Admission Service"
elements:
  - type: "component"
    name: "Admission API Controller"
    technology: "Go / Fiber"
    description: "Handles request routing and front-end clinical workflows for patient admissions."
  - type: "component"
    name: "Admission Workflow Engine"
    technology: "Go / Temporal / FSM"
    description: "Manages state and orchestration for admission workflows."
  - type: "component"
    name: "Demographic Validator & Deduplication Module"
    technology: "Go"
    description: "Validates and deduplicates patient demographic information."
  - type: "component"
    name: "Data Access Repository"
    technology: "Go / database/sql with pgx"
    description: "Manages persistence operations against the PostgreSQL database."
  - type: "component"
    name: "Insurance Eligibility Check Integration Handler"
    technology: "Go / gRPC client"
    description: "Integrates with external insurance and billing clearinghouses."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / Envoy"
    description: "Handles mTLS, rate limiting, and token validation for incoming requests."
  - type: "container"
    name: "Integration Engine"
    technology: "Go / Node.js"
    description: "Securely integrates with external health systems and clearinghouses."
  - type: "container"
    name: "Data Store"
    technology: "PostgreSQL, WORM Object Storage"
    description: "Persists core data with multi-region active-passive setup, AES-256 encryption, and 10-year audit retention."
relationships:
  - source: "API Gateway"
    destination: "Admission API Controller"
    description: "gRPC / REST over internal mesh with mTLS"
  - source: "Admission API Controller"
    destination: "Admission Workflow Engine"
    description: "In-process function calls"
  - source: "Admission Workflow Engine"
    destination: "Demographic Validator & Deduplication Module"
    description: "In-process function calls"
  - source: "Admission Workflow Engine"
    destination: "Insurance Eligibility Check Integration Handler"
    description: "In-process function calls"
  - source: "Demographic Validator & Deduplication Module"
    destination: "Data Access Repository"
    description: "In-process function calls"
  - source: "Data Access Repository"
    destination: "Data Store"
    description: "PostgreSQL protocol with AES-256 and TLS 1.3"
  - source: "Insurance Eligibility Check Integration Handler"
    destination: "Integration Engine"
    description: "gRPC over internal mesh with SPIFFE/SPIRE mTLS"