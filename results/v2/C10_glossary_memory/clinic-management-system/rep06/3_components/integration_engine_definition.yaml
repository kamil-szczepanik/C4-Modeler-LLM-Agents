level: component
scope: "Component diagram for the Integration Engine container"
parentContainer:
  name: "Integration Engine"
elements:
  - type: "component"
    name: "HL7 FHIR Adapter"
    technology: "Go / Node.js"
    description: "Exchanges diagnostic data and medical imaging via HL7 FHIR over HTTPS with mTLS."
  - type: "component"
    name: "EDI Clearinghouse Adapter"
    technology: "Go / Node.js"
    description: "Submits insurance and billing claims via EDI over SFTP / HTTPS."
  - type: "component"
    name: "Message Routing Engine"
    technology: "RabbitMQ / NATS"
    description: "Routes internal and external messages across the integration pipeline."
relationships:
  - source: "HL7 FHIR Adapter"
    destination: "Message Routing Engine"
    description: "Publishes normalized diagnostic messages"
  - source: "EDI Clearinghouse Adapter"
    destination: "Message Routing Engine"
    description: "Publishes claims processing status"
  - source: "Message Routing Engine"
    destination: "HL7 FHIR Adapter"
    description: "Dispatches payloads for external lab systems"
  - source: "Message Routing Engine"
    destination: "EDI Clearinghouse Adapter"
    description: "Dispatches claims batches for insurance clearinghouses"