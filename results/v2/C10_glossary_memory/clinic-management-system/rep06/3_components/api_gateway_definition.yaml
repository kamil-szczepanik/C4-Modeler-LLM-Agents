level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing Engine"
    technology: "Kong / Envoy"
    description: "Routes incoming requests from the client portals to the appropriate backend microservices over the internal mesh."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Lua / WASM"
    description: "Validates OIDC tokens, interacts with the External Identity Provider for JWKS, and enforces RBAC/ABAC policies."
  - type: "component"
    name: "Rate Limiting & Throttling Module"
    technology: "Kong / Envoy Plugin"
    description: "Evaluates rate limits and throttling rules backed by a distributed cache."
relationships:
  - source: "Routing Engine"
    destination: "Patient Admission Service"
    description: "Routes admission requests [gRPC / REST]"
  - source: "Routing Engine"
    destination: "Scheduling Service"
    description: "Routes scheduling requests [gRPC / REST]"
  - source: "Routing Engine"
    destination: "EMR Service"
    description: "Routes EMR requests [gRPC / REST]"
  - source: "Routing Engine"
    destination: "Billing Service"
    description: "Routes billing requests [gRPC / REST]"
  - source: "Routing Engine"
    destination: "Integration Engine"
    description: "Routes integration requests [gRPC / REST]"
  - source: "Authentication & Authorization Filter"
    destination: "External Identity Provider (IdP)"
    description: "Validates tokens and fetches JWKS [HTTPS]"
  - source: "Rate Limiting & Throttling Module"
    destination: "Data Store"
    description: "Evaluates rate limits against distributed cache [Redis Protocol]"