level: component
scope: "Component diagram for the EMR Service container"
parentContainer:
  name: "EMR Service"
elements:
  - type: "component"
    name: "EMR API Controller"
    technology: "Go / Node.js"
    description: "Exposes REST and gRPC endpoints for electronic medical records management."
  - type: "component"
    name: "Clinical Workflow Manager"
    technology: "Go / Node.js"
    description: "Manages clinical workflows, chart notes, and high-performance data processing."
  - type: "component"
    name: "EMR Data Access Layer"
    technology: "Go / Node.js, PostgreSQL protocol"
    description: "Handles secure database transactions and AES-256 encrypted queries with the Data Store."
relationships:
  - source: "EMR API Controller"
    destination: "Clinical Workflow Manager"
    description: "Delegates clinical requests"
  - source: "Clinical Workflow Manager"
    destination: "EMR Data Access Layer"
    description: "Persists and retrieves medical records"