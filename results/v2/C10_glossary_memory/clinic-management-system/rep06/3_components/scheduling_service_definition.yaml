level: component
scope: "Component diagram for the Scheduling Service container"
parentContainer:
  name: "Scheduling Service"
elements:
  - type: "component"
    name: "Scheduling Controller"
    technology: "Go / Node.js Router"
    description: "Handles incoming gRPC and REST requests for appointment scheduling and slot management from the API Gateway."
  - type: "component"
    name: "Appointment Workflow Manager"
    technology: "Temporal SDK / Asynq (Redis)"
    description: "Manages complex appointment orchestration, reminders, and asynchronous task queues for reliable scheduling workflows."
  - type: "component"
    name: "Scheduling Repository"
    technology: "PostgreSQL Client Driver"
    description: "Handles secure persistence and retrieval of appointment and calendar data with AES-256 encryption."
relationships:
  - source: "Scheduling Controller"
    destination: "Appointment Workflow Manager"
    description: "Triggers appointment processing workflows"
  - source: "Appointment Workflow Manager"
    destination: "Scheduling Repository"
    description: "Persists appointment data"
  - source: "Scheduling Repository"
    destination: "Data Store"
    description: "PostgreSQL protocol with AES-256"