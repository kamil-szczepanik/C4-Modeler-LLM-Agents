level: component
scope: "Component diagram for the Internal Staff Application container"
parentContainer:
  name: "Internal Staff Application"
elements:
  - type: "component"
    name: "Staff Auth & Session Manager"
    technology: "OpenID Connect (OIDC) / SAML 2.0 with MFA"
    description: "Manages staff authentication, session management, and secure token isolation using HttpOnly, Secure, SameSite=Strict Cookies."
  - type: "component"
    name: "Admission & Reception Module"
    technology: "React / TypeScript, Nginx"
    description: "Handles patient admissions and front-desk workflows within the internal staff application."
  - type: "component"
    name: "EMR Clinical Workspace Module"
    technology: "React / TypeScript, Nginx"
    description: "Provides dynamic, role-based single-page application interfaces for managing electronic medical records with sub-second performance."
  - type: "component"
    name: "Billing & Claims Module"
    technology: "React / TypeScript, Nginx"
    description: "Handles financial records, invoicing, and insurance claims interfaces for billing specialists."
  - type: "component"
    name: "Compliance & Audit Dashboard"
    technology: "React / TypeScript, Nginx"
    description: "Monitors audit trails, security, and regulatory compliance (HIPAA, GDPR) for compliance and security officers."
relationships:
  - source: "Staff Auth & Session Manager"
    destination: "External Identity Provider (IdP)"
    description: "Authenticates users via HTTPS (OIDC / SAML 2.0 with MFA)"
  - source: "Admission & Reception Module"
    destination: "API Gateway"
    description: "Sends API requests via HTTPS (mTLS/OIDC, REST/GraphQL)"
  - source: "EMR Clinical Workspace Module"
    destination: "API Gateway"
    description: "Sends API requests via HTTPS (mTLS/OIDC, REST/GraphQL)"
  - source: "Billing & Claims Module"
    destination: "API Gateway"
    description: "Sends API requests via HTTPS (mTLS/OIDC, REST/GraphQL)"
  - source: "Compliance & Audit Dashboard"
    destination: "API Gateway"
    description: "Sends API requests via HTTPS (mTLS/OIDC, REST/GraphQL)"