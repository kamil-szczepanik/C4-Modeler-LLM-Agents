level: component
scope: "Component diagram for the Billing Service container"
parentContainer:
  name: "Billing Service"
elements:
  - type: "component"
    name: "Invoice Management Component"
    technology: "Java Spring Boot"
    description: "Routes invoice and billing queries."
  - type: "component"
    name: "Claims Processing Component"
    technology: "Spring Batch & Spring Integration"
    description: "Dispatches batch claims."
  - type: "component"
    name: "Payment Reconciliation Component"
    technology: "Java Spring Boot"
    description: "Handles financial record reconciliation."
  - type: "component"
    name: "Clearinghouse Adapter Component"
    technology: "Java Spring Boot"
    description: "Adapts and transmits payloads for insurance clearinghouses."
  - type: "component"
    name: "Patient Billing Portal Component"
    technology: "Java Spring Boot"
    description: "Routes self-service payments."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / Envoy"
    description: "Routes invoice and billing queries."
  - type: "container"
    name: "Patient Portal"
    technology: "React / TypeScript, Nginx"
    description: "Routes self-service payments via API Gateway."
  - type: "container"
    name: "Integration Engine"
    technology: "Go / Node.js"
    description: "Transmits EDI payloads to the insurance clearinghouse."
  - type: "container"
    name: "Data Store"
    technology: "PostgreSQL, WORM Object Storage"
    description: "Reads and writes financial records."
  - type: "externalSystem"
    name: "Insurance Clearinghouse"
    technology: "EDI over SFTP / HTTPS"
    description: "External system receiving insurance and billing claims."
relationships:
  - source: "API Gateway"
    destination: "Invoice Management Component"
    description: "Routes invoice and billing queries [gRPC / REST]"
  - source: "Patient Portal"
    destination: "Patient Billing Portal Component"
    description: "Routes self-service payments [gRPC / REST via API Gateway]"
  - source: "Claims Processing Component"
    destination: "Clearinghouse Adapter Component"
    description: "Dispatches batch claims [Internal Message Broker]"
  - source: "Clearinghouse Adapter Component"
    destination: "Integration Engine"
    description: "Transmits EDI payloads [TLS 1.3, SFTP / HTTPS]"
  - source: "Integration Engine"
    destination: "Insurance Clearinghouse"
    description: "Transmits EDI payloads [TLS 1.3, SFTP / HTTPS]"
  - source: "Invoice Management Component"
    destination: "Data Store"
    description: "Reads and writes financial records [JDBC over PostgreSQL protocol with AES-256]"
  - source: "Claims Processing Component"
    destination: "Data Store"
    description: "Reads and writes financial records [JDBC over PostgreSQL protocol with AES-256]"
  - source: "Payment Reconciliation Component"
    destination: "Data Store"
    description: "Reads and writes financial records [JDBC over PostgreSQL protocol with AES-256]"
  - source: "Clearinghouse Adapter Component"
    destination: "Data Store"
    description: "Reads and writes financial records [JDBC over PostgreSQL protocol with AES-256]"
  - source: "Patient Billing Portal Component"
    destination: "Data Store"
    description: "Reads and writes financial records [JDBC over PostgreSQL protocol with AES-256]"