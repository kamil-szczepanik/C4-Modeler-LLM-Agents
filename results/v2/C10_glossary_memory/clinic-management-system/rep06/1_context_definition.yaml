level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid-cloud platform designed for medium-sized hospitals and clinics to manage patient admissions, electronic medical records (EMR), scheduling, and billing while ensuring high availability, strict regulatory compliance, and high-performance clinical workflows."
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who interact with the system for scheduling and portals via web or mobile clients."
  - type: "person"
    name: "Receptionists/Admins"
    description: "Administrative staff managing patient admissions, front-desk workflows, and scheduling."
  - type: "person"
    name: "Clinicians/Doctors"
    description: "Medical professionals managing electronic medical records (EMR), clinical workflows, and patient care."
  - type: "person"
    name: "Billing Specialists"
    description: "Staff members handling financial records, invoicing, and insurance claims."
  - type: "person"
    name: "Compliance/Security Officers"
    description: "Personnel responsible for monitoring audit trails, security, and regulatory compliance (HIPAA, GDPR)."
  - type: "person"
    name: "Hospital/Clinic Management"
    description: "Executives viewing management dashboards and high-level clinical operations data."
  - type: "externalSystem"
    name: "External Identity Provider (IdP)"
    description: "External system providing authentication services via OpenID Connect (OIDC) / SAML 2.0 with MFA."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External diagnostic systems exchanging medical imaging and lab data via HL7 FHIR."
  - type: "externalSystem"
    name: "Insurance Clearinghouse"
    description: "External system receiving insurance and billing claims via EDI over secure SFTP / HTTPS."
relationships:
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Interacts for patient care, scheduling, and portal access"
    technology: "HTTPS (Web/Mobile)"
  - source: "Receptionists/Admins"
    destination: "Clinic Management System"
    description: "Manages patient admissions and scheduling"
    technology: "HTTPS (Web)"
  - source: "Clinicians/Doctors"
    destination: "Clinic Management System"
    description: "Accesses and updates EMR and clinical workflows"
    technology: "HTTPS (Web/Mobile)"
  - source: "Billing Specialists"
    destination: "Clinic Management System"
    description: "Manages billing and financial processes"
    technology: "HTTPS (Web)"
  - source: "Compliance/Security Officers"
    destination: "Clinic Management System"
    description: "Monitors audit trails, security logs, and compliance"
    technology: "HTTPS (Web)"
  - source: "Hospital/Clinic Management"
    destination: "Clinic Management System"
    description: "Views management dashboards and operational metrics"
    technology: "HTTPS (Web)"
  - source: "Clinic Management System"
    destination: "External Identity Provider (IdP)"
    description: "Authenticates users via OIDC/SAML with MFA"
    technology: "HTTPS"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges diagnostic data"
    technology: "HL7 FHIR over HTTPS (REST/JSON) with mTLS"
  - source: "Clinic Management System"
    destination: "Insurance Clearinghouse"
    description: "Submits insurance claims"
    technology: "EDI over SFTP / HTTPS"