level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who interact with the system for scheduling and portals via web or mobile clients."
  - type: "person"
    name: "Receptionists/Admins"
    description: "Administrative staff managing patient admissions, front-desk workflows, and scheduling."
  - type: "person"
    name: "Clinicians/Doctors"
    description: "Medical professionals managing electronic medical records (EMR), clinical workflows, and patient care."
  - type: "person"
    name: "Billing Specialists"
    description: "Staff members handling financial records, invoicing, and insurance claims."
  - type: "person"
    name: "Compliance/Security Officers"
    description: "Personnel responsible for monitoring audit trails, security, and regulatory compliance (HIPAA, GDPR)."
  - type: "person"
    name: "Hospital/Clinic Management"
    description: "Executives viewing management dashboards and high-level clinical operations data."
  - type: "externalSystem"
    name: "External Identity Provider (IdP)"
    description: "External system providing authentication services via OpenID Connect (OIDC) / SAML 2.0 with MFA."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External diagnostic systems exchanging medical imaging and lab data via HL7 FHIR."
  - type: "externalSystem"
    name: "Insurance Clearinghouse"
    description: "External system receiving insurance and billing claims via EDI over secure SFTP / HTTPS."
  - type: "container"
    name: "Patient Portal"
    technology: "React / TypeScript, Nginx"
    description: "Web and mobile interface allowing patients to manage scheduling and view personal portal information."
  - type: "container"
    name: "Internal Staff Application"
    technology: "React / TypeScript, Nginx"
    description: "Internal web application for receptionists, clinicians, billing specialists, compliance officers, and management."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / Envoy"
    description: "Handles mTLS, rate limiting, and token validation for incoming requests."
  - type: "container"
    name: "Patient Admission Service"
    technology: "Go / Node.js"
    description: "Manages patient admissions and front-desk workflows."
  - type: "container"
    name: "Scheduling Service"
    technology: "Go / Node.js"
    description: "Handles appointments and scheduling workflows."
  - type: "container"
    name: "EMR Service"
    technology: "Go / Node.js"
    description: "Manages electronic medical records with sub-second performance."
  - type: "container"
    name: "Billing Service"
    technology: "Java Spring Boot"
    description: "Handles financial records, invoicing, and insurance claims."
  - type: "container"
    name: "Integration Engine"
    technology: "Go / Node.js"
    description: "Securely integrates with external health systems and clearinghouses."
  - type: "container"
    name: "Data Store"
    technology: "PostgreSQL, WORM Object Storage"
    description: "Persists core data with multi-region active-passive setup, AES-256 encryption, and 10-year audit retention."
relationships:
  - source: "Patients"
    destination: "Patient Portal"
    description: "Accesses portals and scheduling"
    technology: "HTTPS (Web/Mobile)"
  - source: "Receptionists/Admins"
    destination: "Internal Staff Application"
    description: "Manages patient admissions and front-desk workflows"
    technology: "HTTPS (Web)"
  - source: "Clinicians/Doctors"
    destination: "Internal Staff Application"
    description: "Manages electronic medical records and clinical workflows"
    technology: "HTTPS (Web)"
  - source: "Billing Specialists"
    destination: "Internal Staff Application"
    description: "Handles financial records and billing"
    technology: "HTTPS (Web)"
  - source: "Compliance/Security Officers"
    destination: "Internal Staff Application"
    description: "Monitors audit trails and security compliance"
    technology: "HTTPS (Web)"
  - source: "Hospital/Clinic Management"
    destination: "Internal Staff Application"
    description: "Views management dashboards and operations data"
    technology: "HTTPS (Web)"
  - source: "Patient Portal"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS (mTLS/OIDC)"
  - source: "Internal Staff Application"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS (mTLS/OIDC)"
  - source: "API Gateway"
    destination: "Patient Admission Service"
    description: "Routes admission requests"
    technology: "gRPC / REST over internal mesh"
  - source: "API Gateway"
    destination: "Scheduling Service"
    description: "Routes scheduling requests"
    technology: "gRPC / REST over internal mesh"
  - source: "API Gateway"
    destination: "EMR Service"
    description: "Routes EMR requests"
    technology: "gRPC / REST over internal mesh"
  - source: "API Gateway"
    destination: "Billing Service"
    description: "Routes billing requests"
    technology: "gRPC / REST over internal mesh"
  - source: "Integration Engine"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges diagnostic data and lab results"
    technology: "HL7 FHIR over HTTPS (REST/JSON) with mTLS"
  - source: "Integration Engine"
    destination: "Insurance Clearinghouse"
    description: "Submits insurance and billing claims"
    technology: "EDI over SFTP / HTTPS"
  - source: "Patient Admission Service"
    destination: "Data Store"
    description: "Reads and writes admission data"
    technology: "PostgreSQL protocol with AES-256"
  - source: "Scheduling Service"
    destination: "Data Store"
    description: "Reads and writes scheduling data"
    technology: "PostgreSQL protocol with AES-256"
  - source: "EMR Service"
    destination: "Data Store"
    description: "Reads and writes EMR data"
    technology: "PostgreSQL protocol with AES-256"
  - source: "Billing Service"
    destination: "Data Store"
    description: "Reads and writes billing data"
    technology: "PostgreSQL protocol with AES-256"