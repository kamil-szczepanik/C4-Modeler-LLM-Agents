level: component
scope: "Component diagram for the Administrative & Analytics Service container"
parentContainer:
  name: "Administrative & Analytics Service"
elements:
  - type: "component"
    name: "API Controller"
    technology: "FastAPI"
    description: "Exposes REST endpoints for administrative dashboards and report generation with low overhead."
  - type: "component"
    name: "Query & Reporting Engine"
    technology: "Python / SQLAlchemy"
    description: "Executes optimized read-only analytical queries against database replicas."
  - type: "component"
    name: "Compliance & Audit Worker"
    technology: "Celery"
    description: "Handles asynchronous, long-running tasks for HIPAA/GDPR audit trail generation and data retention archiving."
  - type: "component"
    name: "Analytics Data Store"
    technology: "Encrypted Document/Columnar Store"
    description: "Caches aggregated metric summaries locally to meet P95 load NFRs."
relationships:
  - source: "Hospital Administrator"
    destination: "Administrative & Analytics Service"
    description: "HTTPS (TLS 1.3) via WAF with risk-based adaptive MFA"
  - source: "API Gateway / Reverse Proxy"
    destination: "Administrative & Analytics Service"
    description: "HTTPS / mTLS"
  - source: "API Controller"
    destination: "Identity Provider (IdP)"
    description: "OpenID Connect (OIDC) / OAuth2 over HTTPS"
  - source: "API Controller"
    destination: "Query & Reporting Engine"
    description: "In-process / Python Function Calls"
  - source: "Query & Reporting Engine"
    destination: "Analytics Data Store"
    description: "In-process / SQLAlchemy"
  - source: "Compliance & Audit Worker"
    destination: "Clinical Core Database"
    description: "Read-only replicas via encrypted SQL over mTLS"