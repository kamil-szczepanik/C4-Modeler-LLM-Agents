level: component
scope: "Component diagram for the API Gateway / Reverse Proxy container"
parentContainer:
  name: "API Gateway / Reverse Proxy"
elements:
  - type: "component"
    name: "TLS Termination & WAF Module"
    technology: "Envoy / NGINX"
    description: "Perimeter proxy featuring TLS Termination & WAF Module."
  - type: "component"
    name: "Authentication & Claims Filter"
    technology: "Envoy / NGINX Filter"
    description: "Handles authentication and claims validation."
  - type: "component"
    name: "Dynamic Routing & Rate Limiting Engine"
    technology: "Envoy / NGINX Engine"
    description: "Handles dynamic routing and tenant-aware rate limiting."
  - type: "component"
    name: "Resilience & Fault Injection Module"
    technology: "Envoy / NGINX Module"
    description: "Ensures high availability and resilience."
relationships:
  - source: "TLS Termination & WAF Module"
    destination: "Authentication & Claims Filter"
    description: "Passes decrypted requests with verified TLS"
  - source: "Authentication & Claims Filter"
    destination: "Dynamic Routing & Rate Limiting Engine"
    description: "Forwards authenticated claims for routing"
  - source: "Dynamic Routing & Rate Limiting Engine"
    destination: "Resilience & Fault Injection Module"
    description: "Applies resilience and routing rules"