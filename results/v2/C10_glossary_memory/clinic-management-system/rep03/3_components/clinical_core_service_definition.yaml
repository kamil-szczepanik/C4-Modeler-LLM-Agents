level: component
scope: "Component diagram for the Clinical Core Service container"
parentContainer:
  name: "Clinical Core Service"
elements:
  - type: "component"
    name: "EMR Management Component"
    technology: "Java / Spring Data JPA"
    description: "Handles EMR CRUD operations and caching."
  - type: "component"
    name: "Audit Trail Interceptor"
    technology: "Spring AOP / JDBC"
    description: "Asynchronously logs medical record access."
  - type: "component"
    name: "Scheduling Engine"
    technology: "Java / Quartz Scheduler"
    description: "Handles concurrency-safe resource clash checks and emergency overrides."
  - type: "component"
    name: "Distributed Cache Component"
    technology: "Redis Cluster"
    description: "Provides low-latency caching for patient data and EMR summaries."
  - type: "component"
    name: "Clinical Core Database"
    technology: "Encrypted SQL"
    description: "Encrypted SQL database with read-only replicas storing core clinical data."
  - type: "container"
    name: "API Gateway / Reverse Proxy"
    technology: "Envoy / NGINX"
    description: "Routes API traffic"
  - type: "container"
    name: "Notification & Messaging Service"
    technology: "Node.js / Python"
    description: "Publishes patient alerts"
relationships:
  - source: "API Gateway / Reverse Proxy"
    destination: "Clinical Core Service"
    description: "Routes API traffic [HTTPS / mTLS]"
  - source: "EMR Management Component"
    destination: "Clinical Core Database"
    description: "Persists and retrieves medical records [JDBC over mTLS]"
  - source: "Scheduling Engine"
    destination: "Clinical Core Database"
    description: "Evaluates appointment calendars and locks resources [JDBC over mTLS]"
  - source: "EMR Management Component"
    destination: "Audit Trail Interceptor"
    description: "Triggers audit events [In-process Spring ApplicationEvent]"
  - source: "EMR Management Component"
    destination: "Distributed Cache Component"
    description: "Caches and retrieves lightweight EMR summaries [Redis Protocol over mTLS]"
  - source: "Clinical Core Service"
    destination: "Notification & Messaging Service"
    description: "Publishes patient alerts [AMQP / Kafka over mTLS]"