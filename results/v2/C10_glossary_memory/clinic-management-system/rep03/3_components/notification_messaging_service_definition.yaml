level: component
scope: "Component diagram for the Notification & Messaging Service container"
parentContainer:
  name: "Notification & Messaging Service"
elements:
  - type: "component"
    name: "Notification Ingestion Controller"
    technology: "Node.js / Express"
    description: "Receives notification requests and event messages from internal microservices via AMQP/Kafka."
  - type: "component"
    name: "Messaging Dispatcher"
    technology: "Python / Celery"
    description: "Processes asynchronous notification tasks and interfaces with external SMS and email delivery APIs."
relationships:
  - source: "Notification Ingestion Controller"
    destination: "Messaging Dispatcher"
    description: "Queues and hands off messages for asynchronous dispatch."