level: component
scope: "Component diagram for the Clinical Core Database container"
parentContainer:
  name: "Clinical Core Database"
elements:
  - type: "component"
    name: "Primary Write Database"
    technology: "PostgreSQL multi-node synchronous replication cluster"
    description: "PostgreSQL multi-node synchronous replication cluster for primary write operations."
  - type: "component"
    name: "Read-Only Replica Cluster"
    technology: "Asynchronously replicated read-nodes"
    description: "Asynchronously replicated read-nodes for analytics and reporting queries."
  - type: "component"
    name: "Audit Log Store"
    technology: "Append-only, tamper-evident storage subsystem with WORM compliance"
    description: "Append-only, tamper-evident storage subsystem with WORM compliance for secure audit trails."
  - type: "component"
    name: "Database Connection Pooler"
    technology: "PgBouncer instances"
    description: "PgBouncer instances for connection management and high concurrent clinician traffic."
relationships:
  - source: "Database Connection Pooler"
    destination: "Primary Write Database"
    description: "PostgreSQL wire protocol over mTLS"
  - source: "Clinical Core Service"
    destination: "Database Connection Pooler"
    description: "PostgreSQL wire protocol over mTLS"
  - source: "Administrative & Analytics Service"
    destination: "Read-Only Replica Cluster"
    description: "PostgreSQL wire protocol over mTLS"
  - source: "Clinical Core Service"
    destination: "Audit Log Store"
    description: "Encrypted append-only stream over mTLS"