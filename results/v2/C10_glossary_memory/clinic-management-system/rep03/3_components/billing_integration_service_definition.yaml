level: component
scope: "Component diagram for the Billing & Integration Service container"
parentContainer:
  name: "Billing & Integration Service"
elements:
  - type: "component"
    name: "Claim Submission Handler"
    technology: "Go"
    description: "Handles insurance claims processing and initiates payment workflows."
  - type: "component"
    name: "Payment Workflow Orchestrator"
    technology: "Temporal.io"
    description: "Manages stateful, long-running financial retry workflows and sagas."
  - type: "component"
    name: "Gateway Integration Client"
    technology: "Go"
    description: "Communicates securely with external payment gateways for transaction processing."
  - type: "component"
    name: "Financial Ledger & Audit Store"
    technology: "Encrypted SQL"
    description: "Stores immutable transaction and audit logs securely."
  - type: "component"
    name: "Billing Notification Trigger"
    technology: "Go"
    description: "Triggers asynchronous notifications following billing events."
relationships:
  - source: "Claim Submission Handler"
    destination: "Payment Workflow Orchestrator"
    description: "Internal Go Channel / gRPC"
  - source: "Payment Workflow Orchestrator"
    destination: "Gateway Integration Client"
    description: "Internal gRPC"
  - source: "Gateway Integration Client"
    destination: "Payment Gateway"
    description: "Payment REST APIs over encrypted HTTPS"
  - source: "Payment Workflow Orchestrator"
    destination: "Financial Ledger & Audit Store"
    description: "Encrypted SQL over mTLS"
  - source: "Payment Workflow Orchestrator"
    destination: "Billing Notification Trigger"
    description: "Internal Go Channel"
  - source: "Billing Notification Trigger"
    destination: "Notification & Messaging Service"
    description: "AMQP / Kafka over mTLS"