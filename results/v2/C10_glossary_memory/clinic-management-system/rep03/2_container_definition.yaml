level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patient"
    description: "End-user interacting with the patient portals for scheduling and access."
  - type: "person"
    name: "Receptionist / Front Desk"
    description: "Administrative user managing patient admissions and front desk scheduling."
  - type: "person"
    name: "Clinician / Doctor"
    description: "Medical professional managing electronic medical records and clinical workflows."
  - type: "person"
    name: "Billing Specialist"
    description: "Financial user handling billing and payment processing."
  - type: "person"
    name: "Hospital Administrator"
    description: "System supervisor managing oversight, configuration, and compliance."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system processing payments via REST APIs."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External clinical systems integrating via HL7 FHIR APIs."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Centralized authentication system using OpenID Connect (OIDC) / OAuth2."
  - type: "container"
    name: "API Gateway / Reverse Proxy"
    technology: "Envoy / NGINX"
    description: "Handles TLS 1.3 termination, WAF, and traffic routing."
  - type: "container"
    name: "Patient Portal App"
    technology: "React SPA / Node.js / CDN"
    description: "Provides front-end application access for patients."
  - type: "container"
    name: "Clinical Core Service"
    technology: "Java / Spring Boot"
    description: "Manages EMR data, scheduling resource checks, and audit trails."
  - type: "container"
    name: "Billing & Integration Service"
    technology: "Go / Temporal.io"
    description: "Handles insurance claims and resilient payment retries."
  - type: "container"
    name: "Administrative & Analytics Service"
    technology: "Python / FastAPI + Celery"
    description: "Isolates compliance and reporting queries."
  - type: "container"
    name: "Notification & Messaging Service"
    technology: "Node.js / Python"
    description: "Manages asynchronous patient alerts via SMS/Email APIs."
  - type: "container"
    name: "FHIR Integration Adapter"
    technology: "Dedicated Integration Service"
    description: "Decouples external clinical systems."
  - type: "container"
    name: "Clinical Core Database"
    technology: "Encrypted SQL"
    description: "Stores EMR and core clinical data, providing read-only replicas."
relationships:
  - source: "Patient"
    destination: "API Gateway / Reverse Proxy"
    description: "Sends HTTPS requests via WAF"
    technology: "HTTPS (TLS 1.3) via WAF with risk-based adaptive MFA"
  - source: "Receptionist / Front Desk"
    destination: "API Gateway / Reverse Proxy"
    description: "Sends HTTPS requests via WAF"
    technology: "HTTPS (TLS 1.3) via WAF with risk-based adaptive MFA"
  - source: "Clinician / Doctor"
    destination: "API Gateway / Reverse Proxy"
    description: "Sends HTTPS requests via WAF"
    technology: "HTTPS (TLS 1.3) via WAF with risk-based adaptive MFA"
  - source: "Billing Specialist"
    destination: "API Gateway / Reverse Proxy"
    description: "Sends HTTPS requests via WAF"
    technology: "HTTPS (TLS 1.3) via WAF with risk-based adaptive MFA"
  - source: "Hospital Administrator"
    destination: "API Gateway / Reverse Proxy"
    description: "Sends HTTPS requests via WAF"
    technology: "HTTPS (TLS 1.3) via WAF with risk-based adaptive MFA"
  - source: "API Gateway / Reverse Proxy"
    destination: "Patient Portal App"
    description: "Routes static assets and SPA traffic"
    technology: "HTTPS"
  - source: "API Gateway / Reverse Proxy"
    destination: "Clinical Core Service"
    description: "Routes clinical API traffic"
    technology: "HTTPS / mTLS"
  - source: "API Gateway / Reverse Proxy"
    destination: "Billing & Integration Service"
    description: "Routes billing API traffic"
    technology: "HTTPS / mTLS"
  - source: "API Gateway / Reverse Proxy"
    destination: "Administrative & Analytics Service"
    description: "Routes analytics API traffic"
    technology: "HTTPS / mTLS"
  - source: "Clinical Core Service"
    destination: "Notification & Messaging Service"
    description: "Publishes asynchronous patient alerts"
    technology: "AMQP / Kafka over mTLS"
  - source: "Billing & Integration Service"
    destination: "Payment Gateway"
    description: "Processes insurance claims and payments"
    technology: "Payment REST APIs over encrypted HTTPS"
  - source: "FHIR Integration Adapter"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical and imaging data"
    technology: "HL7 FHIR APIs over encrypted HTTPS"
  - source: "Administrative & Analytics Service"
    destination: "Clinical Core Database"
    description: "Executes read-only analytical queries"
    technology: "Read-only replicas via encrypted SQL over mTLS"
  - source: "Clinical Core Service"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users and manages identity"
    technology: "OpenID Connect (OIDC) / OAuth2 over HTTPS"