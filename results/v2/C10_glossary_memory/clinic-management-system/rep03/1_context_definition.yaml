level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid clinical IT platform that manages patient admissions, electronic medical records, scheduling, and billing for medium-sized hospitals and clinics, delivering highly available, secure healthcare operations while maintaining strict regulatory compliance."
elements:
  - type: "person"
    name: "Patient"
    description: "End-user interacting with the patient portals for scheduling and access."
  - type: "person"
    name: "Receptionist / Front Desk"
    description: "Administrative user managing patient admissions and front desk scheduling."
  - type: "person"
    name: "Clinician / Doctor"
    description: "Medical professional managing electronic medical records and clinical workflows."
  - type: "person"
    name: "Billing Specialist"
    description: "Financial user handling billing and payment processing."
  - type: "person"
    name: "Hospital Administrator"
    description: "System supervisor managing oversight, configuration, and compliance."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system processing payments via REST APIs."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External clinical systems integrating via HL7 FHIR APIs."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Centralized authentication system using OpenID Connect (OIDC) / OAuth2."
relationships:
  - source: "Patient"
    destination: "Clinic Management System"
    description: "Interacts via portal for admissions and scheduling"
    technology: "HTTPS (TLS 1.3) via WAF with risk-based adaptive MFA"
  - source: "Receptionist / Front Desk"
    destination: "Clinic Management System"
    description: "Manages patient admissions and front desk workflows"
    technology: "HTTPS (TLS 1.3) via WAF with risk-based adaptive MFA"
  - source: "Clinician / Doctor"
    destination: "Clinic Management System"
    description: "Accesses and updates electronic medical records"
    technology: "HTTPS (TLS 1.3) via WAF with risk-based adaptive MFA"
  - source: "Billing Specialist"
    destination: "Clinic Management System"
    description: "Processes financial transactions and billing"
    technology: "HTTPS (TLS 1.3) via WAF with risk-based adaptive MFA"
  - source: "Hospital Administrator"
    destination: "Clinic Management System"
    description: "Configures and administers system operations"
    technology: "HTTPS (TLS 1.3) via WAF with risk-based adaptive MFA"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users and manages identity"
    technology: "OpenID Connect (OIDC) / OAuth2 over HTTPS"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical and imaging data"
    technology: "HL7 FHIR APIs over encrypted HTTPS"
  - source: "Clinic Management System"
    destination: "Payment Gateway"
    description: "Processes financial transactions"
    technology: "Payment REST APIs over encrypted HTTPS"