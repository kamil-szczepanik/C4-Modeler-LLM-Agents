level: component
scope: "Component diagram for the Clinical Database container"
parentContainer:
  name: "Clinical Database"
elements:
  - type: "component"
    name: "PostgreSQL Primary Node"
    technology: "PostgreSQL 15"
    description: "Provides robust transactional storage, read replicas, and row-level security for data isolation."
  - type: "component"
    name: "PostgreSQL Read Replicas"
    technology: "PostgreSQL 15"
    description: "Handles read queries for database services to maintain high availability and sub-second response times."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Manages high concurrency and connection pooling for database services."
  - type: "component"
    name: "Data Archival Worker"
    technology: "Background Worker / PostgreSQL"
    description: "Archives historical records off-peak to ensure sub-second EMR performance."
  - type: "component"
    name: "PostgreSQL RLS Enforcer"
    technology: "PostgreSQL Row-Level Security"
    description: "Ensures data isolation and satisfies strict HIPAA/GDPR compliance."
relationships:
  - source: "Connection Pooler"
    destination: "PostgreSQL Primary Node"
    description: "Routes write transactions [TCP over mTLS]"
  - source: "Connection Pooler"
    destination: "PostgreSQL Read Replicas"
    description: "Routes read queries [TCP over mTLS]"
  - source: "Data Archival Worker"
    destination: "PostgreSQL Primary Node"
    description: "Archives historical records [TCP over mTLS]"
  - source: "PostgreSQL Primary Node"
    destination: "PostgreSQL RLS Enforcer"
    description: "Enforces row-level security policies"