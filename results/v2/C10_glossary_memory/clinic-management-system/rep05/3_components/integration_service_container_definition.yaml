level: component
scope: "Component diagram for the Integration Service Container container"
parentContainer:
  name: "Integration Service Container"
elements:
  - type: "component"
    name: "HL7 FHIR Ingress Listener"
    technology: "Apache Camel HTTP Consumer"
    description: "Receives HL7 FHIR over HTTPS requests from external Lab and Imaging Systems securely using mTLS."
  - type: "component"
    name: "FHIR Transformation Engine"
    technology: "HAPI FHIR Server"
    description: "Translates and validates healthcare interoperability data formats against standard FHIR schemas."
  - type: "component"
    name: "gRPC Integration Dispatcher"
    technology: "Apache Camel gRPC Component"
    description: "Forwards processed clinical and lab records downstream to the EMR Service Container over gRPC with mTLS."
  - type: "component"
    name: "Async Error Publisher"
    technology: "Apache Camel AMQP Component"
    description: "Publishes failed integration payloads and dead-letter events to the External Managed Message Queue via AMQP over TLS 1.3."
relationships:
  - source: "HL7 FHIR Ingress Listener"
    destination: "FHIR Transformation Engine"
    description: "Passes raw HL7/FHIR payloads for validation and mapping"
  - source: "FHIR Transformation Engine"
    destination: "gRPC Integration Dispatcher"
    description: "Sends normalized FHIR resources"
  - source: "gRPC Integration Dispatcher"
    destination: "EMR Service Container"
    description: "Invokes EMR APIs using gRPC over mTLS"
  - source: "FHIR Transformation Engine"
    destination: "Async Error Publisher"
    description: "Dispatches unprocessable message payloads on failure"
  - source: "Async Error Publisher"
    destination: "External Managed Message Queue"
    description: "Sends decoupled error queue messages over AMQP with TLS 1.3"