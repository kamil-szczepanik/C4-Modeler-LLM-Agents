level: component
scope: "Component diagram for the EMR Service Container container"
parentContainer:
  name: "EMR Service Container"
elements:
  - type: "component"
    name: "EMR API Controller Component"
    technology: "Java / Spring Boot"
    description: "Handles incoming gRPC requests for electronic medical records from the API Gateway."
  - type: "component"
    name: "Security & Compliance Policy Component"
    technology: "Spring Security & AspectJ"
    description: "Enforces RBAC/ABAC and security policies for patient data access."
  - type: "component"
    name: "Clinical Record Domain Component"
    technology: "Java / Spring Boot"
    description: "Contains core business logic for managing clinical records and patient health data."
  - type: "component"
    name: "Audit Trail Interceptor Component"
    technology: "AspectJ"
    description: "Provides non-invasive audit logging and emits events for compliance tracking."
relationships:
  - source: "EMR API Controller Component"
    destination: "Security & Compliance Policy Component"
    description: "In-memory method calls"
  - source: "Security & Compliance Policy Component"
    destination: "Clinical Record Domain Component"
    description: "In-memory method calls"
  - source: "Clinical Record Domain Component"
    destination: "Clinical Database"
    description: "JDBC via TLS 1.3"
  - source: "Audit Trail Interceptor Component"
    destination: "Notification Gateway"
    description: "HTTPS/REST"