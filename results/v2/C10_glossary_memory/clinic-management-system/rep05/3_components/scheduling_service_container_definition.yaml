level: component
scope: "Component diagram for the Scheduling Service Container container"
parentContainer:
  name: "Scheduling Service Container"
elements:
  - type: "component"
    name: "Scheduling API Controller"
    technology: "TypeScript / Express or Fastify"
    description: "Handles incoming routing and validation logic for scheduling endpoints."
  - type: "component"
    name: "Resource Clash Engine"
    technology: "TypeScript"
    description: "Executes validation logic to detect resource clashes and enforce atomic locks."
  - type: "component"
    name: "Appointment Manager"
    technology: "TypeScript"
    description: "Manages appointment business logic and queues reminders."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "TypeScript"
    description: "Queues reminders and dispatches alerts to the external notification gateway."
  - type: "component"
    name: "Clinical Database"
    technology: "PostgreSQL"
    description: "Enforces atomic locks with SERIALIZABLE isolation over TLS 1.3 to prevent double-booking race conditions."
  - type: "component"
    name: "Audit & Observability Sidecar"
    technology: "FluentBit / Prometheus"
    description: "Emits logs and metrics for tamper-evident logging and observability."
  - type: "component"
    name: "API Gateway / BFF Container"
    technology: "Kong / Envoy"
    description: "Routes internal requests to the scheduling service container."
  - type: "component"
    name: "Notification Gateway"
    technology: "Twilio / SendGrid"
    description: "External gateway that dispatches alerts and notifications."
relationships:
  - source: "API Gateway / BFF Container"
    destination: "Scheduling API Controller"
    description: "Routes internal requests [gRPC over mTLS]"
  - source: "Scheduling API Controller"
    destination: "Resource Clash Engine"
    description: "Executes validation logic [In-memory / Function call]"
  - source: "Resource Clash Engine"
    destination: "Clinical Database"
    description: "Enforces atomic locks [SQL with SERIALIZABLE isolation over TLS 1.3]"
  - source: "Appointment Manager"
    destination: "Notification Dispatcher"
    description: "Queues reminders [AMQP/RabbitMQ]"
  - source: "Notification Dispatcher"
    destination: "Notification Gateway"
    description: "Dispatches alerts [HTTPS with TLS 1.3]"
  - source: "Scheduling Service Container"
    destination: "Audit & Observability Sidecar"
    description: "Emits logs and metrics [Stdout / Prometheus metrics]"