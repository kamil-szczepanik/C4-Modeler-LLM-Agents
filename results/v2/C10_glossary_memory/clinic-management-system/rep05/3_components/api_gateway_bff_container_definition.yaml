level: component
scope: "Component diagram for the API Gateway / BFF Container container"
parentContainer:
  name: "API Gateway / BFF Container"
elements:
  - type: "component"
    name: "Ingress Router Component"
    technology: "Kong / Envoy"
    description: "Manages ingress routing, TLS 1.3 termination, and canary deployments."
  - type: "component"
    name: "Authentication & Token Relay Component"
    technology: "OIDC/SAML 2.0"
    description: "Handles identity verification and token relay for downstream services."
  - type: "component"
    name: "Rate Limiting & Throttling Component"
    technology: "Redis-backed"
    description: "Powers multi-region rate-limiting and request throttling for high availability."
  - type: "component"
    name: "BFF Aggregator Component"
    technology: "Node.js / GraphQL"
    description: "Shapes tailored payloads to guarantee EMR load times under 1 second."
  - type: "component"
    name: "Localization & Formatting Middleware"
    technology: "Node.js Middleware"
    description: "Provides localization and formatting for client responses."
  - type: "component"
    name: "Audit & Observability Sidecar"
    technology: "FluentBit / Prometheus"
    description: "Delivers distributed tracing and tamper-evident audit logs for HIPAA compliance."
relationships:
  - source: "Ingress Router Component"
    destination: "Authentication & Token Relay Component"
    description: "Routes incoming requests for authentication [HTTPS]"
  - source: "Authentication & Token Relay Component"
    destination: "Rate Limiting & Throttling Component"
    description: "Enforces rate limits and throttling [Redis]"
  - source: "Rate Limiting & Throttling Component"
    destination: "BFF Aggregator Component"
    description: "Passes validated requests [Internal]"
  - source: "BFF Aggregator Component"
    destination: "Localization & Formatting Middleware"
    description: "Applies localization and formatting"
  - source: "BFF Aggregator Component"
    destination: "EMR Service Container"
    description: "gRPC over mTLS"
  - source: "BFF Aggregator Component"
    destination: "Scheduling Service Container"
    description: "gRPC over mTLS"
  - source: "BFF Aggregator Component"
    destination: "Billing Service Container"
    description: "gRPC over mTLS"
  - source: "BFF Aggregator Component"
    destination: "Integration Service Container"
    description: "gRPC over mTLS"
  - source: "Ingress Router Component"
    destination: "Audit & Observability Sidecar"
    description: "Local IPC / FluentBit"