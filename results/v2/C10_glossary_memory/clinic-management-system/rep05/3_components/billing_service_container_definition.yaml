level: component
scope: "Component diagram for the Billing Service Container container"
parentContainer:
  name: "Billing Service Container"
elements:
  - type: "component"
    name: "Claim Validation Engine"
    technology: "Go"
    description: "Validates billing claims against rules and standards."
  - type: "component"
    name: "Claim Dispatcher"
    technology: "Go"
    description: "Sends asynchronous claim payloads with retry backoff to external gateways."
  - type: "component"
    name: "Ledger & Invoice Manager"
    technology: "Go"
    description: "Manages financial transactions, ledgers, and invoice records."
relationships:
  - source: "Claim Dispatcher"
    destination: "Insurance Payment Gateway"
    description: "Sends asynchronous claim payloads with retry backoff [HTTPS / REST with TLS 1.3]"
  - source: "Ledger & Invoice Manager"
    destination: "Clinical Database"
    description: "Persists financial transactions and audit records [SQL over TLS 1.3]"