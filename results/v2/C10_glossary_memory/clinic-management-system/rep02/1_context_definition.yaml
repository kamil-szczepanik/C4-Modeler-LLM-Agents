level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid healthcare IT platform designed to manage patient admissions, EMRs, scheduling, and billing, providing high availability, secure operations, and regulatory compliance for medium-sized hospitals and clinics."
elements:
  - type: "person"
    name: "Front-Desk Receptionists"
    description: "Manages patient check-ins, admissions, and basic front-desk operations."
  - type: "person"
    name: "Clinicians"
    description: "Accesses and updates electronic medical records (EMRs) and manages patient care."
  - type: "person"
    name: "Billing Specialists"
    description: "Manages invoices, payments, and financial transactions with insurance providers."
  - type: "person"
    name: "IT/Compliance Administrators"
    description: "Manages system security, compliance, infrastructure, and access controls."
  - type: "person"
    name: "Patients"
    description: "Interacts with the system via portal to view appointments, records, and billing."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "External systems providing laboratory results and medical imaging data."
  - type: "externalSystem"
    name: "Insurance Clearinghouses"
    description: "External systems for processing medical claims and insurance verifications."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Handles multi-factor authentication (MFA), OIDC, and SAML 2.0 identity services."
  - type: "externalSystem"
    name: "Patient Portal / Mobile App"
    description: "External client application used by patients to access healthcare services."
  - type: "container"
    name: "Unified API Gateway"
    description: "Handles rate-limiting, JWT validation, and routes traffic for the system."
    technology: "API Gateway, TLS 1.3"
  - type: "container"
    name: "EMR Microservice"
    description: "Manages electronic medical records and patient health information."
    technology: "Microservice"
  - type: "container"
    name: "Scheduling Service"
    description: "Manages appointments, scheduling, and calendar resources."
    technology: "Microservice"
  - type: "container"
    name: "Billing Service"
    description: "Processes billing, invoices, and clearinghouse integrations."
    technology: "Microservice"
  - type: "container"
    name: "Distributed Cache (Redis Enterprise)"
    description: "Provides distributed session state and WebSocket message broker capabilities."
    technology: "Redis Enterprise"
relationships:
  - source: "Patient Portal / Mobile App"
    destination: "Unified API Gateway"
    description: "Requests API data and manages sessions"
    technology: "HTTPS / REST and WebSocket via OIDC/OAuth 2.0"
  - source: "Clinic Management System"
    destination: "Lab & Imaging Systems"
    description: "Exchanges lab orders and imaging results"
    technology: "HL7 FHIR over HTTPS (REST/JSON) with W3C trace contexts"
  - source: "Clinic Management System"
    destination: "Insurance Clearinghouses"
    description: "Submits claims and verifies insurance"
    technology: "Secure EDI / HTTPS APIs with circuit breakers"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users and performs multi-factor authentication"
    technology: "OIDC/SAML 2.0 over HTTPS"
  - source: "on-prem-k8s"
    destination: "eu-central-1"
    description: "Hybrid cloud active-active communication and replication"
    technology: "Encrypted IPsec site-to-site VPN and mutual TLS (mTLS)"