level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Front-Desk Receptionists"
    description: "Manages patient check-ins, admissions, and basic front-desk operations."
  - type: "person"
    name: "Clinicians"
    description: "Accesses and updates electronic medical records (EMRs) and manages patient care."
  - type: "person"
    name: "Billing Specialists"
    description: "Manages invoices, payments, and financial transactions with insurance providers."
  - type: "person"
    name: "IT/Compliance Administrators"
    description: "Manages system security, compliance, infrastructure, and access controls."
  - type: "person"
    name: "Patients"
    description: "Interacts with the system via portal to view appointments, records, and billing."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "External systems providing laboratory results and medical imaging data."
  - type: "externalSystem"
    name: "Insurance Clearinghouses"
    description: "External systems for processing medical claims and insurance verifications."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Handles multi-factor authentication (MFA), OIDC, and SAML 2.0 identity services."
  - type: "externalSystem"
    name: "Patient Portal / Mobile App"
    description: "External client application used by patients to access healthcare services."
  - type: "container"
    name: "Unified API Gateway"
    technology: "API Gateway, TLS 1.3"
    description: "Handles rate-limiting, JWT validation, and routes traffic for the system."
  - type: "container"
    name: "Patient Registration Microservice"
    technology: "Spring Boot"
    description: "Manages patient registration, admissions, and onboarding data."
  - type: "container"
    name: "EMR Microservice"
    technology: "Go / gRPC"
    description: "Manages electronic medical records and patient health information."
  - type: "container"
    name: "Scheduling Microservice"
    technology: "Spring Boot"
    description: "Manages appointments, scheduling, and calendar resources."
  - type: "container"
    name: "Billing Microservice"
    technology: "Node.js / Express"
    description: "Processes billing, invoices, and clearinghouse integrations."
  - type: "container"
    name: "Async Claims Processing Worker"
    technology: "Background Worker"
    description: "Processes asynchronous insurance claims via message broker."
  - type: "container"
    name: "Message Broker"
    technology: "Apache Kafka"
    description: "Implements asynchronous messaging for claims processing to prevent blocking HTTP threads."
  - type: "container"
    name: "Distributed Cache (Redis Enterprise)"
    technology: "Redis Enterprise"
    description: "Provides distributed session state and WebSocket message broker capabilities."
  - type: "container"
    name: "Cloud-Native Distributed SQL Database"
    technology: "CockroachDB"
    description: "Distributed SQL storage with Raft consensus to guarantee zero-downtime availability and 10-year data retention."
relationships:
  - source: "Patient Portal / Mobile App"
    destination: "Unified API Gateway"
    description: "Requests API data and manages sessions"
    technology: "HTTPS / REST and WebSocket via OIDC/OAuth 2.0"
  - source: "Front-Desk Receptionists"
    destination: "Unified API Gateway"
    description: "Manages patient admissions and check-ins"
    technology: "HTTPS / REST"
  - source: "Clinicians"
    destination: "Unified API Gateway"
    description: "Accesses and updates patient records"
    technology: "HTTPS / REST"
  - source: "Billing Specialists"
    destination: "Unified API Gateway"
    description: "Manages invoices and financial transactions"
    technology: "HTTPS / REST"
  - source: "IT/Compliance Administrators"
    destination: "Unified API Gateway"
    description: "Manages system security, compliance, and infrastructure"
    technology: "HTTPS / REST"
  - source: "Unified API Gateway"
    destination: "Patient Registration Microservice"
    description: "Routes registration requests"
    technology: "HTTP / REST"
  - source: "Unified API Gateway"
    destination: "EMR Microservice"
    description: "Routes EMR requests"
    technology: "gRPC"
  - source: "Unified API Gateway"
    destination: "Scheduling Microservice"
    description: "Routes scheduling requests"
    technology: "HTTP / REST"
  - source: "Unified API Gateway"
    destination: "Billing Microservice"
    description: "Routes billing requests"
    technology: "HTTP / REST"
  - source: "EMR Microservice"
    destination: "Cloud-Native Distributed SQL Database"
    description: "Reads and writes EMR data"
    technology: "SQL / TLS"
  - source: "Patient Registration Microservice"
    destination: "Cloud-Native Distributed SQL Database"
    description: "Reads and writes patient data"
    technology: "SQL / TLS"
  - source: "Scheduling Microservice"
    destination: "Cloud-Native Distributed SQL Database"
    description: "Reads and writes scheduling data"
    technology: "SQL / TLS"
  - source: "Billing Microservice"
    destination: "Cloud-Native Distributed SQL Database"
    description: "Reads and writes billing data"
    technology: "SQL / TLS"
  - source: "Billing Microservice"
    destination: "Message Broker"
    description: "Publishes claims processing events"
    technology: "Apache Kafka Protocol"
  - source: "Async Claims Processing Worker"
    destination: "Message Broker"
    description: "Consumes claims events"
    technology: "Apache Kafka Protocol"
  - source: "Clinic Management System"
    destination: "Lab & Imaging Systems"
    description: "Exchanges lab orders and imaging results"
    technology: "HL7 FHIR over HTTPS (REST/JSON) with W3C trace contexts"
  - source: "Clinic Management System"
    destination: "Insurance Clearinghouses"
    description: "Submits claims and verifies insurance"
    technology: "Secure EDI / HTTPS APIs with circuit breakers"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users and performs multi-factor authentication"
    technology: "OIDC/SAML 2.0 over HTTPS"
  - source: "on-prem-k8s"
    destination: "eu-central-1"
    description: "Hybrid cloud active-active communication and replication"
    technology: "Encrypted IPsec site-to-site VPN and mutual TLS (mTLS)"