level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Topic Manager"
    technology: "Apache Kafka Topic Controller"
    description: "Manages Kafka topics, partitions, and replication policies for asynchronous event streams."
  - type: "component"
    name: "Access Control & Encryption Manager"
    technology: "Kafka ACLs & SASL/SCRAM-512"
    description: "Enforces fine-grained access control lists and encryption for data in transit within the message broker."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry"
    description: "Validates and manages event schemas to ensure backward and forward compatibility across microservices."
  - type: "component"
    name: "Broker Health & Metrics Exporter"
    technology: "Prometheus Exporter"
    description: "Exposes health metrics, broker status, and telemetry data for cluster monitoring."
  - type: "component"
    name: "Data Retention & Tiered Storage Manager"
    technology: "Kafka Tiered Storage"
    description: "Enforces 10-year data retention mandates by tiering historical event logs to secure long-term storage."
  - type: "component"
    name: "In-Transit Data Masking & Tokenization"
    technology: "Custom Interceptor Middleware"
    description: "Masks and tokenizes sensitive patient and financial data flowing through event streams for HIPAA/GDPR compliance."
  - type: "component"
    name: "Broker Audit & Compliance Logger"
    technology: "Kafka Audit Logger"
    description: "Logs all broker access attempts, message operations, and administrative actions for regulatory compliance."
relationships:
  - source: "Access Control & Encryption Manager"
    destination: "Topic Manager"
    description: "Secures access to"
  - source: "In-Transit Data Masking & Tokenization"
    destination: "Topic Manager"
    description: "Masks payloads for"
  - source: "Schema Registry"
    destination: "Topic Manager"
    description: "Validates schemas for"
  - source: "Data Retention & Tiered Storage Manager"
    destination: "Topic Manager"
    description: "Manages storage retention for"
  - source: "Broker Health & Metrics Exporter"
    destination: "Topic Manager"
    description: "Monitors health of"
  - source: "Broker Audit & Compliance Logger"
    destination: "Access Control & Encryption Manager"
    description: "Records security and access events from"