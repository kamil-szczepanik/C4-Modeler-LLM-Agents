level: component
scope: "Component diagram for the Patient Registration Microservice container"
parentContainer:
  name: "Patient Registration Microservice"
elements:
  - type: "component"
    name: "Registration Controller"
    technology: "Spring MVC"
    description: "Handles incoming patient registration and admission HTTP requests."
  - type: "component"
    name: "Patient Matching Engine"
    technology: "Java / Algorithms"
    description: "Matches incoming patient data against existing records to prevent duplicates."
  - type: "component"
    name: "Eligibility Verification Service"
    technology: "Spring Cloud OpenFeign"
    description: "Verifies patient insurance and eligibility status via external services."
  - type: "component"
    name: "Eligibility Circuit Breaker Wrapper"
    technology: "Resilience4j"
    description: "Wraps eligibility verification calls to ensure fault tolerance and resilience."
  - type: "component"
    name: "Audit & Compliance Interceptor"
    technology: "Spring AspectJ"
    description: "Intercepts requests for auditing and ensures compliance with HIPAA and GDPR mandates."
  - type: "component"
    name: "Registration Data Repository"
    technology: "Spring Data JPA"
    description: "Persists patient registration and onboarding data to the underlying database."
relationships:
  - source: "Registration Controller"
    destination: "Patient Matching Engine"
    description: "In-Memory Method Call"
  - source: "Registration Controller"
    destination: "Eligibility Circuit Breaker Wrapper"
    description: "In-Memory Method Call"
  - source: "Eligibility Circuit Breaker Wrapper"
    destination: "Eligibility Verification Service"
    description: "HTTPS / JSON with Circuit Breaker"
  - source: "Registration Controller"
    destination: "Audit & Compliance Interceptor"
    description: "AOP / AspectJ"
  - source: "Audit & Compliance Interceptor"
    destination: "Registration Data Repository"
    description: "JDBC / TLS"
  - source: "Registration Controller"
    destination: "Registration Data Repository"
    description: "JDBC / TLS"