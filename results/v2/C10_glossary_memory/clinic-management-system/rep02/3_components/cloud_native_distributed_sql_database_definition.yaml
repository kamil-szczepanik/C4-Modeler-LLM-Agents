level: component
scope: "Component diagram for the Cloud-Native Distributed SQL Database container"
parentContainer:
  name: "Cloud-Native Distributed SQL Database"
elements:
  - type: "component"
    name: "SQL Layer"
    technology: "CockroachDB SQL Engine"
    description: "Parses, optimizes, and executes SQL queries and provides PostgreSQL wire protocol compatibility."
  - type: "component"
    name: "Distributed Transaction Engine"
    technology: "CockroachDB Distributed Transaction Coordinator"
    description: "Coordinates distributed ACID transactions across multiple nodes and shards."
  - type: "component"
    name: "Storage Layer (Raft Consensus & RocksDB)"
    technology: "RocksDB & Raft Consensus"
    description: "Persists data using RocksDB storage engines and ensures replication and consensus via Raft."
relationships:
  - source: "SQL Layer"
    destination: "Distributed Transaction Engine"
    description: "Routes queries for transaction coordination"
  - source: "Distributed Transaction Engine"
    destination: "Storage Layer (Raft Consensus & RocksDB)"
    description: "Reads and writes replicated data shards"