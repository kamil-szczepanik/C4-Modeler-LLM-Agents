level: component
scope: "Component diagram for the Async Claims Processing Worker container"
parentContainer:
  name: "Async Claims Processing Worker"
elements:
  - type: "component"
    name: "Claims Consumer"
    technology: "Node.js / Kafka Consumer"
    description: "Consumes asynchronous claims processing jobs from the message broker."
  - type: "component"
    name: "EDI Formatter"
    technology: "TypeScript / EDI Parser"
    description: "Formats processed claims into secure EDI format for clearinghouse submission."
  - type: "component"
    name: "Clearinghouse Integration Client"
    technology: "HTTPS Client with Circuit Breakers"
    description: "Communicates securely with external insurance clearinghouses using circuit breakers."
relationships:
  - source: "Claims Consumer"
    destination: "EDI Formatter"
    description: "Passes raw claim messages for formatting"
  - source: "EDI Formatter"
    destination: "Clearinghouse Integration Client"
    description: "Sends formatted EDI payloads"