level: component
scope: "Component diagram for the Billing Microservice container"
parentContainer:
  name: "Billing Microservice"
elements:
  - type: "component"
    name: "Invoice API Controller"
    technology: "Node.js / Express"
    description: "Handles HTTP/REST billing requests."
  - type: "component"
    name: "Claims Orchestrator"
    technology: "Node.js / Express"
    description: "Coordinates asynchronous claim events."
  - type: "component"
    name: "Clearinghouse Integration Adapter"
    technology: "Node.js / Axios"
    description: "Manages outbound API calls."
  - type: "component"
    name: "Cloud-Native Distributed SQL Database"
    technology: "CockroachDB"
    description: "Stores financial records."
  - type: "component"
    name: "Message Broker"
    technology: "Apache Kafka"
    description: "Handles asynchronous claim messaging."
  - type: "component"
    name: "Distributed Cache (Redis Enterprise)"
    technology: "Redis Enterprise"
    description: "Manages session states and rate-limiting."
  - type: "component"
    name: "Insurance Clearinghouses"
    technology: "External System"
    description: "External claim processing systems."
relationships:
  - source: "Invoice API Controller"
    destination: "Cloud-Native Distributed SQL Database"
    description: "Reads/writes invoices [SQL / TLS]"
  - source: "Claims Orchestrator"
    destination: "Message Broker"
    description: "Publishes claim events [Apache Kafka Protocol]"
  - source: "Clearinghouse Integration Adapter"
    destination: "Insurance Clearinghouses"
    description: "Submits claims [Secure EDI / HTTPS]"
  - source: "Invoice API Controller"
    destination: "Distributed Cache (Redis Enterprise)"
    description: "Caches session states [RESP / TLS]"