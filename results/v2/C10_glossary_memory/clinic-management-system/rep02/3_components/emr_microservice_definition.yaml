level: component
scope: "Component diagram for the EMR Microservice container"
parentContainer:
  name: "EMR Microservice"
elements:
  - type: "component"
    name: "EMR API Handler"
    technology: "Go / gRPC"
    description: "Handles incoming gRPC requests for electronic medical records from the Unified API Gateway."
  - type: "component"
    name: "EMR Domain Service"
    technology: "Go"
    description: "Contains business logic for managing electronic medical records and patient health information."
  - type: "component"
    name: "EMR Data Access Repository"
    technology: "SQL / TLS"
    description: "Manages database operations and queries against the Cloud-Native Distributed SQL Database."
relationships:
  - source: "EMR API Handler"
    destination: "EMR Domain Service"
    description: "Delegates requests to"
  - source: "EMR Domain Service"
    destination: "EMR Data Access Repository"
    description: "Queries and updates records via"
  - source: "EMR Data Access Repository"
    destination: "Cloud-Native Distributed SQL Database"
    description: "Executes SQL statements over TLS"