level: component
scope: "Component diagram for the Distributed Cache (Redis Enterprise) container"
parentContainer:
  name: "Distributed Cache (Redis Enterprise)"
elements:
  - type: "component"
    name: "In-Memory Data Store"
    technology: "Redis Core / Redis Enterprise Active-Active CRDTs"
    description: "Manages high-performance distributed session state, real-time messaging, and transient caching with active-active CRDT multi-region synchronization."
  - type: "component"
    name: "Cluster Manager & Proxy"
    technology: "Envoy/Redis-Proxy"
    description: "Handles intelligent client routing, connection pooling, and TLS termination."
  - type: "component"
    name: "Pub/Sub & WebSocket Engine"
    technology: "Redis native Pub/Sub"
    description: "Enables real-time messaging and WebSocket pub/sub communications."
  - type: "component"
    name: "Unified API Gateway"
    technology: "API Gateway, TLS 1.3"
    description: "Handles rate-limiting, JWT validation, and routes traffic for the system."
  - type: "component"
    name: "EMR Microservice"
    technology: "Go / gRPC"
    description: "Manages electronic medical records and patient health information."
  - type: "component"
    name: "Scheduling Microservice"
    technology: "Spring Boot"
    description: "Manages appointments, scheduling, and calendar resources."
  - type: "component"
    name: "Patient Portal / Mobile App"
    technology: "External client application"
    description: "External client application used by patients to access healthcare services."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "Secrets Management"
    description: "Provides automated TLS certificate and AUTH token rotation via API."
relationships:
  - source: "Unified API Gateway"
    destination: "In-Memory Data Store"
    description: "RESP / mTLS 1.3 for session management and WebSocket pub/sub messaging"
  - source: "EMR Microservice"
    destination: "In-Memory Data Store"
    description: "RESP / mTLS 1.3 for transient data caching"
  - source: "Scheduling Microservice"
    destination: "In-Memory Data Store"
    description: "RESP / mTLS 1.3 for calendar lock states"
  - source: "HashiCorp Vault"
    destination: "In-Memory Data Store"
    description: "Automated TLS certificate and AUTH token rotation via API"