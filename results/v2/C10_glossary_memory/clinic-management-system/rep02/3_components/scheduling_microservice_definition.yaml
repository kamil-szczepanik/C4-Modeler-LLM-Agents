level: component
scope: "Component diagram for the Scheduling Microservice container"
parentContainer:
  name: "Scheduling Microservice"
elements:
  - type: "component"
    name: "Appointment Controller"
    technology: "Spring MVC"
    description: "Exposes REST endpoints for appointment scheduling and routes requests via mTLS."
  - type: "component"
    name: "Scheduling Engine"
    technology: "Spring Service"
    description: "Coordinates scheduling logic and manages interaction with calendar and slot reservation services."
  - type: "component"
    name: "Calendar Resource Manager"
    technology: "Spring Service"
    description: "Manages calendar resources and availability."
  - type: "component"
    name: "Slot Reservation Manager"
    technology: "Spring Service"
    description: "Handles ephemeral slot reservation timeouts and concurrency."
  - type: "component"
    name: "Scheduling Data Access Repository"
    technology: "Spring Data JPA"
    description: "Manages database persistence and transaction boundaries for scheduling."
relationships:
  - source: "Unified API Gateway"
    destination: "Appointment Controller"
    description: "HTTP / REST via mTLS"
  - source: "Appointment Controller"
    destination: "Scheduling Engine"
    description: "In-process Java Method Call"
  - source: "Scheduling Engine"
    destination: "Calendar Resource Manager"
    description: "In-process Java Method Call"
  - source: "Scheduling Engine"
    destination: "Slot Reservation Manager"
    description: "In-process Java Method Call"
  - source: "Slot Reservation Manager"
    destination: "Distributed Cache (Redis Enterprise)"
    description: "Redis Protocol / TLS"
  - source: "Scheduling Engine"
    destination: "Scheduling Data Access Repository"
    description: "In-process Java Method Call"
  - source: "Scheduling Data Access Repository"
    destination: "Cloud-Native Distributed SQL Database"
    description: "SQL / TLS with serializable isolation"