level: component
scope: "Component diagram for the Order and Checkout Service container"
parentContainer:
  name: "Order and Checkout Service"
elements:
  - type: "component"
    name: "Cart Component"
    technology: "Go / In-Memory"
    description: "Low-latency shopping cart persistence to minimize cart abandonment."
  - type: "component"
    name: "Checkout Orchestrator"
    technology: "Go"
    description: "Handles transactional safety, multi-currency support, and checkout orchestration."
  - type: "component"
    name: "Order Processing Component"
    technology: "Go"
    description: "Handles ACID-compliant order finalization and multi-region replication."
  - type: "component"
    name: "Notification Component"
    technology: "Go"
    description: "Sends asynchronous transactional email notifications without blocking checkout."
relationships:
  - source: "Checkout Orchestrator"
    destination: "Cart Component"
    description: "In-Memory / Function Call"
  - source: "Checkout Orchestrator"
    destination: "Payment Gateway"
    description: "HTTPS/REST"
  - source: "Checkout Orchestrator"
    destination: "Third-Party Shipping APIs"
    description: "HTTPS/REST"
  - source: "Order Processing Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "TCP with TLS 1.3"
  - source: "Cart Component"
    destination: "Amazon DynamoDB"
    description: "TCP with TLS 1.3"
  - source: "Notification Component"
    destination: "Email Service"
    description: "Amazon SES"