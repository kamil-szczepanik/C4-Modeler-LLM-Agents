level: component
scope: "Component diagram for the Amazon API Gateway container"
parentContainer:
  name: "Amazon API Gateway"
elements:
  - type: "component"
    name: "WAF & Threat Protection"
    technology: "AWS WAF"
    description: "Inspects incoming traffic and provides threat protection."
  - type: "component"
    name: "JWT Authorizer"
    technology: "AWS Lambda / Native IAM"
    description: "Forwards sanitized requests and handles authentication context."
  - type: "component"
    name: "Request Validator"
    technology: "API Gateway Request Validator"
    description: "Passes validated security context."
  - type: "component"
    name: "Throttling & Rate Limiter"
    technology: "API Gateway Usage Plans"
    description: "Evaluates rate limits and throttles requests."
  - type: "component"
    name: "Response Caching"
    technology: "API Gateway Cache"
    description: "Checks cache for read operations."
  - type: "component"
    name: "API Router"
    technology: "Amazon API Gateway Routes/Stages"
    description: "Forwards approved requests to downstream services."
  - type: "component"
    name: "Access Logging & Tracing"
    technology: "Amazon CloudWatch / AWS X-Ray"
    description: "Emits metrics and handles logging and tracing."
relationships:
  - source: "Web Frontend"
    destination: "WAF & Threat Protection"
    description: "Inspects incoming traffic [HTTPS/REST]"
  - source: "WAF & Threat Protection"
    destination: "JWT Authorizer"
    description: "Forwards sanitized requests [Internal]"
  - source: "JWT Authorizer"
    destination: "Request Validator"
    description: "Passes validated security context [Internal]"
  - source: "Request Validator"
    destination: "Throttling & Rate Limiter"
    description: "Evaluates rate limits [Internal]"
  - source: "Throttling & Rate Limiter"
    destination: "API Router"
    description: "Forwards approved requests [Internal]"
  - source: "API Router"
    destination: "Response Caching"
    description: "Checks cache for read operations [Internal]"
  - source: "API Router"
    destination: "Catalogue Service"
    description: "Routes catalogue requests [HTTPS/REST with mTLS]"
  - source: "API Router"
    destination: "Order and Checkout Service"
    description: "Routes checkout requests [HTTPS/REST with mTLS]"
  - source: "API Router"
    destination: "Access Logging & Tracing"
    description: "Emits metrics [Internal]"