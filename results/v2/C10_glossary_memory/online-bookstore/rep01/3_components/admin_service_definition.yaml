level: component
scope: "Component diagram for the Admin Service container"
parentContainer:
  name: "Admin Service"
elements:
  - type: "component"
    name: "Catalogue Management Controller"
    technology: "Express Router / Joi"
    description: "Manages catalogue curation and input validation during batch imports."
  - type: "component"
    name: "Audit Logging Middleware"
    technology: "Winston / Amazon CloudWatch"
    description: "Handles asynchronous structured compliance and audit logging."
  - type: "component"
    name: "Admin Data Repository"
    technology: "Sequelize ORM"
    description: "Executes structured database interactions for administrative operations."
relationships:
  - source: "Catalogue Management Controller"
    destination: "Admin Data Repository"
    description: "TCP/Sequelize"
  - source: "Audit Logging Middleware"
    destination: "Amazon CloudWatch / S3"
    description: "HTTPS/REST"
  - source: "Admin Data Repository"
    destination: "Amazon Aurora PostgreSQL"
    description: "TLS/TCP"
  - source: "Admin Service"
    destination: "AWS Secrets Manager"
    description: "HTTPS/REST"