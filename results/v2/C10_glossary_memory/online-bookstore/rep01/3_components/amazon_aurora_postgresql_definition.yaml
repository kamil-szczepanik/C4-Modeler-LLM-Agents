level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL container"
parentContainer:
  name: "Amazon Aurora PostgreSQL"
elements:
  - type: "component"
    name: "Catalogue Data Manager"
    technology: "PostgreSQL Schema / SQL"
    description: "Manages persistent storage and retrieval for the book catalogue data."
  - type: "component"
    name: "Order Data Manager"
    technology: "PostgreSQL Schema / SQL"
    description: "Handles relational data persistence for transactional orders and checkout safety."
  - type: "component"
    name: "Review Data Manager"
    technology: "PostgreSQL Schema / SQL"
    description: "Manages relational persistence for user book reviews and ratings."
  - type: "component"
    name: "Admin Data Manager"
    technology: "PostgreSQL Schema / SQL"
    description: "Stores administrative configurations, catalogue management data, and system settings."
relationships:
  - source: "Catalogue Data Manager"
    destination: "Order Data Manager"
    description: "Maintains relational consistency for order items and catalogue references"