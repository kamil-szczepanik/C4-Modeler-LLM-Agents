level: component
scope: "Component diagram for the Web Frontend container"
parentContainer:
  name: "Web Frontend"
elements:
  - type: "component"
    name: "Catalogue Browser"
    technology: "React Component"
    description: "Renders book catalogue, search results, and details for customers."
  - type: "component"
    name: "Shopping Cart Manager"
    technology: "React Component"
    description: "Handles user cart operations and session state."
  - type: "component"
    name: "Checkout UI"
    technology: "React Component"
    description: "Provides interface for secure checkout and payment processing."
  - type: "component"
    name: "Review Component"
    technology: "React Component"
    description: "Allows users to read and submit book reviews."
relationships:
  - source: "Catalogue Browser"
    destination: "Amazon API Gateway"
    description: "Fetches catalogue data via HTTPS/REST"
  - source: "Shopping Cart Manager"
    destination: "Amazon API Gateway"
    description: "Syncs cart state via HTTPS/REST"
  - source: "Checkout UI"
    destination: "Amazon API Gateway"
    description: "Submits orders via HTTPS/REST"
  - source: "Review Component"
    destination: "Amazon API Gateway"
    description: "Manages reviews via HTTPS/REST"