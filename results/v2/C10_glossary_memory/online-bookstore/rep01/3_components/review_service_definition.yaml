level: component
scope: "Component diagram for the Review Service container"
parentContainer:
  name: "Review Service"
elements:
  - type: "component"
    name: "Review API Router"
    technology: "Python / FastAPI Router"
    description: "Handles incoming HTTP/REST requests and routing for review submission and retrieval."
  - type: "component"
    name: "Review Controller"
    technology: "Python / FastAPI"
    description: "Orchestrates review business logic, validation, and JWT verification handling."
  - type: "component"
    name: "Review Repository"
    technology: "SQLAlchemy ORM"
    description: "Manages data access and persistence operations for book reviews in Amazon Aurora PostgreSQL."
relationships:
  - source: "Review API Router"
    destination: "Review Controller"
    description: "Routes requests to"
  - source: "Review Controller"
    destination: "Review Repository"
    description: "Invokes data persistence operations"
  - source: "Review Repository"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes review data via TCP with mTLS"