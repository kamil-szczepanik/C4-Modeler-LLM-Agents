level: component
scope: "Component diagram for the Amazon DynamoDB container"
parentContainer:
  name: "Amazon DynamoDB"
elements:
  - type: "component"
    name: "Cart Table"
    technology: "Amazon DynamoDB Global Table"
    description: "Low-latency data store for managing user shopping carts across multiple regions with TTL and KMS encryption."
  - type: "component"
    name: "Session Table"
    technology: "Amazon DynamoDB Global Table"
    description: "Low-latency data store for managing active user sessions across multiple regions."
relationships:
  - source: "Order and Checkout Service"
    destination: "Cart Table"
    description: "Reads and writes shopping cart data over TLS 1.3 with VPC Endpoints"
  - source: "Order and Checkout Service"
    destination: "Session Table"
    description: "Reads and writes session data over TLS 1.3 with VPC Endpoints"