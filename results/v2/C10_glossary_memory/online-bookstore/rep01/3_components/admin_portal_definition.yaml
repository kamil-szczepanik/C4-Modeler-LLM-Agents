level: component
scope: "Component diagram for the Admin Portal container"
parentContainer:
  name: "Admin Portal"
elements:
  - type: "component"
    name: "Authentication Module"
    technology: "React & TypeScript / OIDC/OAuth2"
    description: "Handles user authentication and identity verification with the Identity Provider."
  - type: "component"
    name: "Catalogue Management Dashboard"
    technology: "React & TypeScript / Material-UI"
    description: "Provides administrative UI to manage catalogue items and pricing."
  - type: "component"
    name: "Operations & Fulfillment View"
    technology: "React & TypeScript / Material-UI"
    description: "Provides operational analytics and fulfillment management."
  - type: "component"
    name: "Reporting & Analytics View"
    technology: "React & TypeScript / Material-UI"
    description: "Displays operational reports and system analytics."
  - type: "component"
    name: "Audit & Logging Client"
    technology: "React & TypeScript"
    description: "Collects and forwards audit logs to the backend to meet GDPR and CCPA compliance."
  - type: "person"
    name: "Store Administrator"
    technology: "Admin"
    description: "An administrator managing system configurations, catalogue items, and store operations."
  - type: "externalSystem"
    name: "Identity Provider"
    technology: "Auth0 / AWS Cognito / OIDC"
    description: "Authentication and authorization service utilizing OAuth2/OIDC."
  - type: "container"
    name: "Amazon API Gateway"
    technology: "Amazon API Gateway"
    description: "Secure ingress routing and JWT validation."
  - type: "container"
    name: "Admin Service"
    technology: "Node.js / Express"
    description: "Handles administrative backend logic and system configurations."
relationships:
  - source: "Store Administrator"
    destination: "Authentication Module"
    description: "OIDC/OAuth2"
  - source: "Authentication Module"
    destination: "Identity Provider"
    description: "HTTPS/OIDC"
  - source: "Catalogue Management Dashboard"
    destination: "Amazon API Gateway"
    description: "HTTPS/REST with JWT validation"
  - source: "Operations & Fulfillment View"
    destination: "Amazon API Gateway"
    description: "HTTPS/REST with JWT validation"
  - source: "Reporting & Analytics View"
    destination: "Amazon API Gateway"
    description: "HTTPS/REST with JWT validation"
  - source: "Audit & Logging Client"
    destination: "Amazon API Gateway"
    description: "HTTPS/REST"
  - source: "Amazon API Gateway"
    destination: "Admin Service"
    description: "HTTPS/REST with JWT validation"