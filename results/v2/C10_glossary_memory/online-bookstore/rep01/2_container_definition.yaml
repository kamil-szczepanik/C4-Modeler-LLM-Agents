level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Book Shopper"
    description: "An end-user browsing the catalogue, purchasing books, and leaving reviews."
  - type: "person"
    name: "Reviewer"
    description: "A user who interacts with the system to read and submit book reviews."
  - type: "person"
    name: "Store Administrator"
    description: "An administrator managing system configurations, catalogue items, and store operations."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processor such as Stripe or PayPal handling secure checkout transactions."
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "External shipping providers handling order fulfillment and delivery tracking."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Authentication and authorization service such as Auth0 or AWS Cognito utilizing OAuth2/OIDC."
  - type: "externalSystem"
    name: "Email Service"
    description: "Amazon SES used for sending transactional and notification emails."
  - type: "externalSystem"
    name: "ML Recommendation Engine"
    description: "Amazon Personalize providing personalized book recommendations."
  - type: "container"
    name: "Web Frontend"
    technology: "React SPA"
    description: "Provides catalogue browsing, user account management, and customer-facing UI."
  - type: "container"
    name: "Admin Portal"
    technology: "React SPA"
    description: "Provides administrative UI for managing catalogue items and store operations."
  - type: "container"
    name: "Amazon API Gateway"
    technology: "Amazon API Gateway"
    description: "Entry point for client requests, routing traffic and validating JWT tokens."
  - type: "container"
    name: "Catalogue Service"
    technology: "Node.js / Express"
    description: "Manages book catalogue data and sub-second keyword search."
  - type: "container"
    name: "Order and Checkout Service"
    technology: "Go"
    description: "Handles transactional checkout safety and order processing."
  - type: "container"
    name: "Review Service"
    technology: "Python / FastAPI"
    description: "Manages submission and retrieval of book reviews."
  - type: "container"
    name: "Admin Service"
    technology: "Node.js / Express"
    description: "Handles administrative backend logic and system configurations."
  - type: "container"
    name: "Recommendation Integration Service"
    technology: "Node.js"
    description: "Integrates with external ML recommendation engine for personalized book suggestions."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Multi-region relational data store for persistent application data."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Low-latency data store for user shopping carts and active sessions."
  - type: "container"
    name: "Amazon OpenSearch"
    technology: "Amazon OpenSearch"
    description: "Provides sub-second keyword search capabilities for the catalogue."
relationships:
  - source: "Book Shopper"
    destination: "Web Frontend"
    description: "Browses catalogue, manages account, and performs secure checkout"
    technology: "HTTPS via AWS CloudFront"
  - source: "Reviewer"
    destination: "Web Frontend"
    description: "Submits and reads book reviews"
    technology: "HTTPS via AWS CloudFront"
  - source: "Store Administrator"
    destination: "Admin Portal"
    description: "Manages store catalogue and administrative operations"
    technology: "HTTPS via AWS CloudFront"
  - source: "Web Frontend"
    destination: "Amazon API Gateway"
    description: "Sends API requests for catalogue, orders, and reviews"
    technology: "HTTPS/REST with JWT validation"
  - source: "Admin Portal"
    destination: "Amazon API Gateway"
    description: "Sends API requests for administrative tasks"
    technology: "HTTPS/REST with JWT validation"
  - source: "Amazon API Gateway"
    destination: "Catalogue Service"
    description: "Routes catalogue and search requests"
    technology: "HTTPS/REST with JWT validation"
  - source: "Amazon API Gateway"
    destination: "Order and Checkout Service"
    description: "Routes checkout and order processing requests"
    technology: "HTTPS/REST with JWT validation"
  - source: "Amazon API Gateway"
    destination: "Review Service"
    description: "Routes review submission and retrieval requests"
    technology: "HTTPS/REST with JWT validation"
  - source: "Amazon API Gateway"
    destination: "Admin Service"
    description: "Routes administrative backend requests"
    technology: "HTTPS/REST with JWT validation"
  - source: "Amazon API Gateway"
    destination: "Recommendation Integration Service"
    description: "Routes recommendation requests"
    technology: "HTTPS/REST with JWT validation"
  - source: "Order and Checkout Service"
    destination: "Payment Gateway"
    description: "Processes secure checkout payments"
    technology: "HTTPS/REST"
  - source: "Order and Checkout Service"
    destination: "Third-Party Shipping APIs"
    description: "Coordinates order fulfillment and shipping"
    technology: "HTTPS/REST and Webhooks"
  - source: "Web Frontend"
    destination: "Identity Provider"
    description: "Authenticates users and manages sessions"
    technology: "OAuth2/OIDC"
  - source: "Admin Portal"
    destination: "Identity Provider"
    description: "Authenticates administrators and manages sessions"
    technology: "OAuth2/OIDC"
  - source: "Order and Checkout Service"
    destination: "Email Service"
    description: "Sends automated notifications and receipts"
    technology: "Amazon SES"
  - source: "Recommendation Integration Service"
    destination: "ML Recommendation Engine"
    description: "Fetches personalized product recommendations"
    technology: "HTTPS/REST and Asynchronous SQS/SNS"
  - source: "Catalogue Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes relational catalogue data"
    technology: "TCP"
  - source: "Catalogue Service"
    destination: "Amazon OpenSearch"
    description: "Queries catalogue index for keyword search"
    technology: "TCP"
  - source: "Order and Checkout Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists order and transaction data"
    technology: "TCP"
  - source: "Order and Checkout Service"
    destination: "Amazon DynamoDB"
    description: "Reads and writes shopping cart data"
    technology: "TCP"
  - source: "Review Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists book reviews"
    technology: "TCP"
  - source: "Admin Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Updates administrative and catalogue records"
    technology: "TCP"