level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "A multi-region e-commerce platform providing catalogue browsing, secure checkout, reviews, and personalized recommendations for 1 million monthly active users."
elements:
  - type: "person"
    name: "Book Shopper"
    description: "An end-user browsing the catalogue, purchasing books, and leaving reviews."
  - type: "person"
    name: "Reviewer"
    description: "A user who interacts with the system to read and submit book reviews."
  - type: "person"
    name: "Store Administrator"
    description: "An administrator managing system configurations, catalogue items, and store operations."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processor such as Stripe or PayPal handling secure checkout transactions."
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "External shipping providers handling order fulfillment and delivery tracking."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Authentication and authorization service such as Auth0 or AWS Cognito utilizing OAuth2/OIDC."
  - type: "externalSystem"
    name: "Email Service"
    description: "Amazon SES used for sending transactional and notification emails."
  - type: "externalSystem"
    name: "ML Recommendation Engine"
    description: "Amazon Personalize providing personalized book recommendations."
relationships:
  - source: "Book Shopper"
    destination: "Online Bookstore"
    description: "Browses catalogue, manages account, and performs secure checkout"
    technology: "HTTPS via CloudFront"
  - source: "Reviewer"
    destination: "Online Bookstore"
    description: "Submits and reads book reviews"
    technology: "HTTPS via CloudFront"
  - source: "Store Administrator"
    destination: "Online Bookstore"
    description: "Manages store catalogue and administrative operations"
    technology: "HTTPS via CloudFront"
  - source: "Online Bookstore"
    destination: "Payment Gateway"
    description: "Processes secure checkout payments"
    technology: "HTTPS/REST"
  - source: "Online Bookstore"
    destination: "Third-Party Shipping APIs"
    description: "Coordinates order fulfillment and shipping"
    technology: "HTTPS/REST and Webhooks"
  - source: "Online Bookstore"
    destination: "Identity Provider"
    description: "Authenticates users and manages sessions"
    technology: "OAuth2/OIDC"
  - source: "Online Bookstore"
    destination: "Email Service"
    description: "Sends automated notifications and receipts"
    technology: "Amazon SES"
  - source: "Online Bookstore"
    destination: "ML Recommendation Engine"
    description: "Fetches personalized product recommendations"
    technology: "HTTPS/REST and Asynchronous SQS/SNS"