level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Customers"
    description: "Primary system users interacting via web and mobile interfaces to browse catalogs, purchase books, and write reviews."
  - type: "person"
    name: "Authors/Publishers"
    description: "Users who interact with the system regarding catalog content and publications."
  - type: "person"
    name: "Store Administrators"
    description: "Users responsible for managing the e-commerce platform, catalogs, orders, and support."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system processing secure financial transactions via client-side tokenization and webhook callbacks."
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "External APIs used for fulfillment and shipping synchronization."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External Identity Provider (AWS Cognito/Auth0) handling authentication and MFA."
  - type: "externalSystem"
    name: "AWS CloudFront CDN/WAF"
    description: "Edge and security infrastructure for DDoS protection, TLS 1.3 termination, and content delivery."
  - type: "externalSystem"
    name: "Route 53"
    description: "DNS routing service for global traffic management."
  - type: "externalSystem"
    name: "AWS Secrets Manager"
    description: "Service for dynamic credential rotation."
  - type: "externalSystem"
    name: "AWS KMS"
    description: "Service for encryption at rest using AES-256."
  - type: "container"
    name: "Web App Frontend"
    technology: "React, Next.js, TypeScript"
    description: "Delivers catalog browsing, secure checkout, reviews, and personalized recommendations."
  - type: "container"
    name: "API Gateway"
    technology: "Amazon API Gateway"
    description: "Routes and manages incoming API requests to backend microservices."
  - type: "container"
    name: "Catalog & Search Service"
    technology: "Java, Spring Boot, Amazon OpenSearch"
    description: "Handles catalog management and search functionalities."
  - type: "container"
    name: "Checkout & Order Service"
    technology: "Go, gRPC/REST"
    description: "Handles secure checkout and order processing for ACID performance."
  - type: "container"
    name: "Recommendation Service"
    technology: "Python, FastAPI"
    description: "Delivers personalized recommendations to users."
  - type: "container"
    name: "Admin Management Service"
    technology: "Java, Spring Boot"
    description: "Manages store administration and operational tasks."
  - type: "container"
    name: "Database Storage"
    technology: "Amazon Aurora PostgreSQL Global Database"
    description: "Multi-region transactional persistence layer."
  - type: "container"
    name: "Caching Layer"
    technology: "Amazon ElastiCache (Redis)"
    description: "Provides sub-100ms caching for recommendations and data."
relationships:
  - source: "Customers"
    destination: "Web App Frontend"
    description: "Interacts with the web application for browsing, purchasing, and reviews"
    technology: "HTTPS / TLS 1.3 / OAuth 2.0 / OIDC"
  - source: "Web App Frontend"
    destination: "API Gateway"
    description: "Sends API requests to backend services"
    technology: "HTTPS / REST / gRPC"
  - source: "API Gateway"
    destination: "Catalog & Search Service"
    description: "Routes catalog and search queries"
    technology: "HTTPS / gRPC"
  - source: "API Gateway"
    destination: "Checkout & Order Service"
    description: "Routes checkout and order processing requests"
    technology: "HTTPS / gRPC"
  - source: "API Gateway"
    destination: "Recommendation Service"
    description: "Routes recommendation requests"
    technology: "HTTPS / gRPC"
  - source: "API Gateway"
    destination: "Admin Management Service"
    description: "Routes administrative management requests"
    technology: "HTTPS / gRPC"
  - source: "Checkout & Order Service"
    destination: "Payment Gateway"
    description: "Processes secure payments"
    technology: "HTTPS / REST APIs"
  - source: "Checkout & Order Service"
    destination: "Third-Party Shipping APIs"
    description: "Handles order fulfillment and shipping synchronization"
    technology: "HTTPS / REST APIs"
  - source: "API Gateway"
    destination: "Identity Provider"
    description: "Authenticates users via OIDC/OAuth 2.0"
    technology: "OIDC / OAuth 2.0 / HTTPS"
  - source: "Recommendation Service"
    destination: "Caching Layer"
    description: "Retrieves and stores cached recommendation data"
    technology: "Redis Protocol"
  - source: "Catalog & Search Service"
    destination: "Database Storage"
    description: "Reads and writes transactional data"
    technology: "PostgreSQL Protocol over TLS"
  - source: "Checkout & Order Service"
    destination: "Database Storage"
    description: "Reads and writes transactional data"
    technology: "PostgreSQL Protocol over TLS"
  - source: "Admin Management Service"
    destination: "Database Storage"
    description: "Reads and writes transactional data"
    technology: "PostgreSQL Protocol over TLS"