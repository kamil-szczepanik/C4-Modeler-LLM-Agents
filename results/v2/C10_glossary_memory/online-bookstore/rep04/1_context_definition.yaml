level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "An AWS-hosted online bookstore built for 1M MAU, delivering catalog browsing, secure checkout, reviews, and personalized recommendations."
elements:
  - type: "person"
    name: "Customers"
    description: "Primary system users interacting via web and mobile interfaces to browse catalogs, purchase books, and write reviews."
  - type: "person"
    name: "Authors/Publishers"
    description: "Users who interact with the system regarding catalog content and publications."
  - type: "person"
    name: "Store Administrators"
    description: "Users responsible for managing the e-commerce platform, catalogs, orders, and support."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system processing secure financial transactions via client-side tokenization and webhook callbacks."
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "External APIs used for fulfillment and shipping synchronization."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External notification service (SES/SendGrid) for sending system emails and alerts."
  - type: "externalSystem"
    name: "Customer Support CRM"
    description: "External CRM system for managing customer support operations."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External Identity Provider (AWS Cognito/Auth0) handling authentication and MFA."
  - type: "externalSystem"
    name: "AWS CloudFront CDN/WAF"
    description: "Edge and security infrastructure for DDoS protection, TLS 1.3 termination, and content delivery."
  - type: "externalSystem"
    name: "Route 53"
    description: "DNS routing service for global traffic management."
  - type: "externalSystem"
    name: "AWS Secrets Manager"
    description: "Service for dynamic credential rotation."
  - type: "externalSystem"
    name: "AWS KMS"
    description: "Service for encryption at rest using AES-256."
relationships:
  - source: "Customers"
    destination: "Online Bookstore System"
    description: "Connect via HTTPS (TLS 1.3) through CDN/WAF for browsing, purchasing, and reviews"
    technology: "HTTPS / TLS 1.3 / OAuth 2.0 / OIDC"
  - source: "Authors/Publishers"
    destination: "Online Bookstore System"
    description: "Interact with system via web and mobile interfaces"
    technology: "HTTPS"
  - source: "Store Administrators"
    destination: "Online Bookstore System"
    description: "Administer the store and manage operations"
    technology: "HTTPS"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Integrates for secure payment processing and webhook callbacks"
    technology: "HTTPS / REST APIs"
  - source: "Online Bookstore System"
    destination: "Third-Party Shipping APIs"
    description: "Integrates for order fulfillment and shipping"
    technology: "HTTPS / REST APIs"
  - source: "Online Bookstore System"
    destination: "Customer Support CRM"
    description: "Synchronizes customer support data"
    technology: "HTTPS / REST APIs"
  - source: "Online Bookstore System"
    destination: "Identity Provider"
    description: "Authenticates users via OIDC/OAuth 2.0 supporting MFA"
    technology: "OIDC / OAuth 2.0 / HTTPS"