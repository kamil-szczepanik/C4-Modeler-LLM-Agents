level: component
scope: "Component diagram for the Web App Frontend container"
parentContainer:
  name: "Web App Frontend"
elements:
  - type: "component"
    name: "SSR Page Router / Rendering Component"
    technology: "Next.js App Router, TypeScript"
    description: "Handles server-side rendering and user authentication flows."
  - type: "component"
    name: "Catalog & Search UI Component"
    technology: "React, TypeScript"
    description: "Provides catalog browsing and search user interface."
  - type: "component"
    name: "Shopping Cart & Checkout UI Component"
    technology: "React, TypeScript"
    description: "Manages shopping cart interactions and secure checkout workflows."
  - type: "component"
    name: "Reviews & Recommendations Component"
    technology: "React, TypeScript"
    description: "Displays user reviews and personalized recommendations."
  - type: "component"
    name: "Localization & Currency Preference Component"
    technology: "React, TypeScript"
    description: "Manages user localization and currency preferences."
  - type: "component"
    name: "API Client / BFF Proxy Component"
    technology: "Next.js API Routes / TypeScript"
    description: "Proxies backend requests and handles internal function calls."
relationships:
  - source: "SSR Page Router / Rendering Component"
    destination: "Identity Provider"
    description: "Handles user authentication flow [OIDC / OAuth 2.0 / HTTPS]"
  - source: "SSR Page Router / Rendering Component"
    destination: "API Client / BFF Proxy Component"
    description: "Internal function calls [Internal function call / HTTP]"
  - source: "API Client / BFF Proxy Component"
    destination: "API Gateway"
    description: "Proxies backend requests [HTTPS / REST]"
  - source: "Web App Frontend"
    destination: "API Gateway"
    description: "Sends API requests to backend services [HTTPS / REST / gRPC]"
  - source: "Customers"
    destination: "Web App Frontend"
    description: "Interacts with the web application [HTTPS / TLS 1.3 / OAuth 2.0 / OIDC]"