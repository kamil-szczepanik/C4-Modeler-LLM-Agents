level: component
scope: "Component diagram for the Admin Management Service container"
parentContainer:
  name: "Admin Management Service"
elements:
  - type: "component"
    name: "Admin API Controller"
    technology: "Spring MVC"
    description: "Exposes secure endpoints for administrative operations and RBAC validation."
  - type: "component"
    name: "Catalog Management Component"
    technology: "Spring Data JPA"
    description: "Manages administrative CRUD operations for books and categories."
  - type: "component"
    name: "Order Operations Component"
    technology: "Java, Spring Boot"
    description: "Handles administrative overrides, refunds, and fulfillment tracking."
  - type: "component"
    name: "Audit Logging Service"
    technology: "Java, Spring Boot"
    description: "Captures immutable administrative action trails."
  - type: "component"
    name: "Metrics & Reporting Component"
    technology: "Java, Spring Boot"
    description: "Aggregates operational KPIs for the administrative dashboard."
  - type: "component"
    name: "Workflow Orchestrator Component"
    technology: "Java, Spring Boot"
    description: "Manages multi-step content governance state machines."
relationships:
  - source: "API Gateway"
    destination: "Admin Management Service"
    description: "Routes administrative management requests [HTTPS / gRPC]"
  - source: "Admin Management Service"
    destination: "Database Storage"
    description: "Reads and writes transactional data [PostgreSQL Protocol over TLS]"
  - source: "Catalog Management Component"
    destination: "Catalog & Search Service"
    description: "Interfaces for catalog synchronization [gRPC]"
  - source: "Order Operations Component"
    destination: "Checkout & Order Service"
    description: "Communicates fulfillment updates [gRPC]"
  - source: "Workflow Orchestrator Component"
    destination: "AWS SQS / SNS"
    description: "Processes asynchronous workflows [AWS SDK / HTTPS]"
  - source: "Admin Management Service"
    destination: "Identity Provider"
    description: "Enforces step-up multi-factor authentication [OIDC / OAuth 2.0 / HTTPS]"
  - source: "Admin Management Service"
    destination: "AWS Secrets Manager"
    description: "Retrieves credentials via IAM role assumption [HTTPS]"