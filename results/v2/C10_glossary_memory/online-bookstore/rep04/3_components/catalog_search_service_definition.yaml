level: component
scope: "Component diagram for the Catalog & Search Service container"
parentContainer:
  name: "Catalog & Search Service"
elements:
  - type: "component"
    name: "Catalog Search Controller"
    technology: "Java, Spring Boot"
    description: "Exposes REST and gRPC endpoints for searching and browsing the product catalog."
  - type: "component"
    name: "Search Indexer"
    technology: "Java, Spring Boot"
    description: "Synchronizes product catalog data and executes faceted search queries against Amazon OpenSearch."
  - type: "component"
    name: "Cache Manager"
    technology: "Java, Spring Boot, Redis Client"
    description: "Reads and writes cached search hits and metadata to the Caching Layer."
relationships:
  - source: "Catalog Search Controller"
    destination: "Search Indexer"
    description: "Delegates search and retrieval requests"
  - source: "Search Indexer"
    destination: "Amazon OpenSearch"
    description: "Executes faceted search queries"
  - source: "Search Indexer"
    destination: "Database Storage"
    description: "Syncs catalog source-of-truth"
  - source: "Search Indexer"
    destination: "Caching Layer"
    description: "Reads/writes cached search hits and metadata"