level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing & Dispatcher Component"
    technology: "Amazon API Gateway Router"
    description: "Forwards queries and routes checkout payloads to downstream microservices."
  - type: "component"
    name: "Authentication & Authorization Authorizer"
    technology: "Lambda Authorizer / IAM"
    description: "Validates tokens against the Identity Provider."
  - type: "component"
    name: "Throttling & Rate Limiting Component"
    technology: "API Gateway Usage Plans"
    description: "Manages ingress traffic limits and ensures scalable throughput."
  - type: "component"
    name: "Request Transformation & Enrichment Component"
    technology: "API Gateway Mapping Templates"
    description: "Fetches routing secrets and enriches incoming requests."
relationships:
  - source: "Routing & Dispatcher Component"
    destination: "Catalog & Search Service"
    description: "Forwards queries [gRPC over TLS with mTLS]"
  - source: "Routing & Dispatcher Component"
    destination: "Checkout & Order Service"
    description: "Routes checkout payloads [gRPC/HTTP/2 over mTLS]"
  - source: "Authentication & Authorization Authorizer"
    destination: "Identity Provider"
    description: "Validates tokens [HTTPS / OAuth 2.0 / OIDC]"
  - source: "Request Transformation & Enrichment Component"
    destination: "AWS Secrets Manager"
    description: "Fetches routing secrets [HTTPS]"