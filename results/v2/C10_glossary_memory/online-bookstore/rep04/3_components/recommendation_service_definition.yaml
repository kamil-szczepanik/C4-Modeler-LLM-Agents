level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "Recommendation API Controller"
    technology: "Python, FastAPI"
    description: "Handles incoming API requests and business logic routing for personalized book recommendations."
  - type: "component"
    name: "Model Inference Engine"
    technology: "PyTorch, Scikit-learn"
    description: "Processes machine learning models to generate real-time personalized recommendations."
  - type: "component"
    name: "Event Consumer"
    technology: "Python, Amazon MSK / Kafka Client"
    description: "Consumes asynchronous events from the event stream for real-0time customer behavior tracking."
  - type: "component"
    name: "Cache Integration Client"
    technology: "Python, Redis Client, TLS 1.3"
    description: "Interacts with the caching layer to deliver sub-100ms recommendation data."
relationships:
  - source: "Recommendation API Controller"
    destination: "Model Inference Engine"
    description: "Invokes model inference"
  - source: "Recommendation API Controller"
    destination: "Cache Integration Client"
    description: "Retrieves cached recommendations"
  - source: "Event Consumer"
    destination: "Model Inference Engine"
    description: "Updates model features based on event stream"
  - source: "Cache Integration Client"
    destination: "Caching Layer"
    description: "Redis Protocol over TLS 1.3"