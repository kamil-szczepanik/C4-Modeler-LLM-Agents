level: component
scope: "Component diagram for the Checkout & Order Service container"
parentContainer:
  name: "Checkout & Order Service"
elements:
  - type: "component"
    name: "API Handler Component"
    technology: "Go"
    description: "Handles incoming API requests and routing for checkout and order operations."
  - type: "component"
    name: "Order Management Component"
    technology: "Go"
    description: "Processes order fulfillment and management logic with ACID guarantees."
  - type: "component"
    name: "Payment Processing Component"
    technology: "Go"
    description: "Processes secure financial transactions interacting with external payment gateways."
  - type: "component"
    name: "Fulfillment Integration Component"
    technology: "Go"
    description: "Integrates with third-party shipping APIs and includes a Shipping Rate & Estimation Sub-module."
  - type: "component"
    name: "Compliance Component"
    technology: "Go"
    description: "Ensures strict GDPR, CCPA, and PCI-DSS compliance through tokenization, anonymization, and audit logging."
  - type: "component"
    name: "Database Storage"
    technology: "Amazon Aurora PostgreSQL Global Database"
    description: "Multi-region transactional persistence layer ensuring ACID guarantees."
  - type: "component"
    name: "Caching Layer"
    technology: "Amazon ElastiCache (Redis)"
    description: "Provides sub-100ms caching for shipping fallback rates and related data."
  - type: "component"
    name: "Payment Gateway"
    technology: "External"
    description: "External system processing secure financial transactions."
  - type: "component"
    name: "Third-Party Shipping APIs"
    technology: "External"
    description: "External APIs used for fulfillment and shipping synchronization."
  - type: "component"
    name: "AWS Secrets Manager & AWS KMS"
    technology: "AWS Secrets Manager & AWS KMS"
    description: "Enforces column-level PII encryption (AES-256) and dynamic credential rotation."
relationships:
  - source: "API Gateway"
    destination: "API Handler Component"
    description: "HTTPS / gRPC with TLS 1.3"
  - source: "Order Management Component"
    destination: "Database Storage"
    description: "PostgreSQL Protocol over TLS 1.3"
  - source: "Payment Processing Component"
    destination: "Payment Gateway"
    description: "HTTPS / REST APIs with TLS 1.3"
  - source: "Fulfillment Integration Component"
    destination: "Third-Party Shipping APIs"
    description: "HTTPS / REST APIs with TLS 1.3"
  - source: "Fulfillment Integration Component"
    destination: "Caching Layer"
    description: "Redis Protocol"