level: component
scope: "Component diagram for the Async Notification Service container"
parentContainer:
  name: "Async Notification Service"
elements:
  - type: "component"
    name: "Queue Listener"
    technology: "Node.js, AWS SQS Consumer"
    description: "Listens to AWS SQS queues for asynchronous event messages from the Order & Checkout Service."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Node.js/Express"
    description: "Processes and dispatches notifications to external notification providers based on received events."
relationships:
  - source: "Queue Listener"
    destination: "Notification Dispatcher"
    description: "Forwards event messages for processing"