level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Database Container"
    technology: "Amazon Aurora PostgreSQL"
    description: "Amazon Aurora PostgreSQL with multi-AZ, read replicas, and Aurora Global Databases."
  - type: "component"
    name: "Catalog Schema Component"
    technology: "Relational tables with GiST/GIN indexes"
    description: "Stores books, authors, and categories with keyword search and catalog query optimizations."
  - type: "component"
    name: "Order & Transactions Schema Component"
    technology: "ACID-compliant relational tables"
    description: "Stores carts, orders, and multi-currency pricing with TTL cleanup."
  - type: "component"
    name: "Reviews & Recommendations Schema Component"
    technology: "Relational tables"
    description: "Stores user ratings and review texts."
  - type: "component"
    name: "Audit & Compliance Component"
    technology: "Row-level security (RLS) and automated anonymization"
    description: "Enforces strict security, encryption, and automated anonymization controls to meet GDPR and CCPA regulatory mandates."
  - type: "component"
    name: "Supporting Infrastructure"
    technology: "Amazon RDS Proxy and AWS Database Activity Streams"
    description: "Prevents connection exhaustion and mitigates thread exhaustion under high traffic while streaming audit logs."
relationships:
  - source: "Catalog & Search Service"
    destination: "Database Container"
    description: "Reads and writes catalog data [PostgreSQL Protocol over TLS]"
  - source: "Order & Checkout Service"
    destination: "Database Container"
    description: "Reads and writes order data [PostgreSQL Protocol over TLS]"
  - source: "Recommendation & Review Service"
    destination: "Database Container"
    description: "Reads and writes review and recommendation data [PostgreSQL Protocol over TLS]"
  - source: "Async Notification Service"
    destination: "Database Container"
    description: "Persists notification state [PostgreSQL Protocol over TLS]"
  - source: "Database Container"
    destination: "Amazon Kinesis"
    description: "Streams audit logs for compliance [AWS Kinesis Protocol]"