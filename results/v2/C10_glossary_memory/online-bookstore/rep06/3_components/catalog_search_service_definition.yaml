level: component
scope: "Component diagram for the Catalog & Search Service container"
parentContainer:
  name: "Catalog & Search Service"
elements:
  - type: "component"
    name: "API Router Component"
    technology: "Go/Gin"
    description: "High-throughput, low-latency REST API routing for catalog search."
  - type: "component"
    name: "Search Engine Client"
    technology: "Go, Elasticsearch Client"
    description: "Interacts with Elasticsearch for search and multi-facet filtering."
  - type: "component"
    name: "Catalog Repository"
    technology: "Go, database/sql"
    description: "Handles relational database operations for catalog records."
  - type: "component"
    name: "Index Synchronization Worker"
    technology: "Go, Debezium CDC"
    description: "Synchronizes data between the database and Elasticsearch using Debezium CDC."
  - type: "component"
    name: "Pricing & Localization Resolver"
    technology: "Go"
    description: "Resolves multi-currency pricing and localization requirements."
  - type: "component"
    name: "Cache Management Middleware"
    technology: "Go, Redis Client"
    description: "Manages caching layer interactions to ensure fast page loads."
  - type: "component"
    name: "Elasticsearch / Amazon OpenSearch Service"
    technology: "Elasticsearch / OpenSearch"
    description: "Provides fast, typo-tolerant keyword search and multi-facet filtering."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Delivers reliable, multi-AZ relational persistence for catalog records."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache (Redis)"
    description: "Caches search snippets to ensure sub-2-second page loads."
relationships:
  - source: "API Router Component"
    destination: "Search Engine Client"
    description: "In-process Go interfaces"
  - source: "API Router Component"
    destination: "Cache Management Middleware"
    description: "In-process Go interfaces"
  - source: "Cache Management Middleware"
    destination: "Amazon ElastiCache (Redis)"
    description: "Redis Protocol over TLS"
  - source: "Search Engine Client"
    destination: "Elasticsearch / Amazon OpenSearch Service"
    description: "HTTP/REST over TLS"
  - source: "Search Engine Client"
    destination: "Pricing & Localization Resolver"
    description: "In-process Go structs"
  - source: "Catalog Repository"
    destination: "Amazon Aurora PostgreSQL"
    description: "PostgreSQL Protocol over TLS"
  - source: "Index Synchronization Worker"
    destination: "Amazon Aurora PostgreSQL"
    description: "Transactional Outbox via CDC"
  - source: "Index Synchronization Worker"
    destination: "Elasticsearch / Amazon OpenSearch Service"
    description: "Transactional Outbox via CDC"