level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Order API Controller"
    technology: "Node.js, Express, TypeScript"
    description: "Handles incoming HTTP/REST requests from the API Gateway for order creation and checkout operations."
  - type: "component"
    name: "Checkout Processing Engine"
    technology: "Node.js, TypeScript"
    description: "Executes core business logic for processing orders, managing carts, and coordinating payments."
  - type: "component"
    name: "Payment Integration Client"
    technology: "Node.js, HTTPS/REST, mTLS, HMAC"
    description: "Communicates securely with the external Payment Gateway for processing transactions."
  - type: "component"
    name: "Shipping Integration Client"
    technology: "Node.js, HTTPS/REST, mTLS, HMAC"
    description: "Interacts with Third-Party Shipping APIs to handle logistics and shipping arrangements."
  - type: "component"
    name: "Messaging Publisher"
    technology: "Node.js, AWS SQS SDK"
    description: "Publishes asynchronous notification events to AWS SQS queues with Dead-Letter Queue support."
  - type: "component"
    name: "Data Access Repository"
    technology: "Node.js, PostgreSQL Driver, TLS"
    description: "Manages persistence and retrieval of transactional data in Amazon Aurora PostgreSQL."
relationships:
  - source: "Order API Controller"
    destination: "Checkout Processing Engine"
    description: "Delegates request processing"
  - source: "Checkout Processing Engine"
    destination: "Payment Integration Client"
    description: "Invokes payment authorization"
  - source: "Checkout Processing Engine"
    destination: "Shipping Integration Client"
    description: "Coordinates fulfillment logistics"
  - source: "Checkout Processing Engine"
    destination: "Messaging Publisher"
    description: "Dispatches asynchronous events"
  - source: "Checkout Processing Engine"
    destination: "Data Access Repository"
    description: "Persists order state"