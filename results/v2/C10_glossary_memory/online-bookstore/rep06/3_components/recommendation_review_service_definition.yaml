level: component
scope: "Component diagram for the Recommendation & Review Service container"
parentContainer:
  name: "Recommendation & Review Service"
elements:
  - type: "component"
    name: "Recommendation Controller"
    technology: "FastAPI Router"
    description: "Handles incoming HTTP requests for book recommendations and user reviews."
  - type: "component"
    name: "Recommendation Engine"
    technology: "Python Machine Learning Library"
    description: "Processes user behavior and catalog data to generate personalized book recommendations."
  - type: "component"
    name: "Review Manager"
    technology: "Python Service Logic"
    description: "Validates, stores, and retrieves book reviews submitted by registered reviewers."
relationships:
  - source: "Recommendation Controller"
    destination: "Recommendation Engine"
    description: "Invokes recommendation generation algorithms"
  - source: "Recommendation Controller"
    destination: "Review Manager"
    description: "Delegates review CRUD operations"