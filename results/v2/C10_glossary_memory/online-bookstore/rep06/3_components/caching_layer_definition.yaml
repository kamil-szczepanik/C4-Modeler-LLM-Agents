level: component
scope: "Component diagram for the Caching Layer container"
parentContainer:
  name: "Caching Layer"
elements:
  - type: "component"
    name: "Catalog Cache Component"
    technology: "Amazon ElastiCache (Redis)"
    description: "Caches catalog and search data to accelerate high-throughput catalog browsing."
  - type: "component"
    name: "Session Store Component"
    technology: "Amazon ElastiCache (Redis)"
    description: "Manages active shopping cart sessions for the Order & Checkout Service."
  - type: "component"
    name: "Recommendation Cache Component"
    technology: "Amazon ElastiCache (Redis)"
    description: "Stores precomputed recommendation data for fast retrieval."
relationships:
  - source: "Catalog & Search Service"
    destination: "Catalog Cache Component"
    description: "Retrieves and stores cached catalog data (Redis Protocol over TLS 1.3)"
  - source: "Order & Checkout Service"
    destination: "Session Store Component"
    description: "Manages shopping cart sessions (Redis Protocol over TLS 1.3)"
  - source: "Recommendation & Review Service"
    destination: "Recommendation Cache Component"
    description: "Caches recommendation datasets (Redis Protocol over TLS 1.3)"