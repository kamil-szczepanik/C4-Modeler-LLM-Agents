level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Book Buyer (Customer)"
    description: "End-user who browses the catalog, makes purchases, and leaves reviews."
  - type: "person"
    name: "Registered Reviewer"
    description: "User who writes and manages reviews for books."
  - type: "person"
    name: "Store Administrator"
    description: "User who manages store operations and administration."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe/PayPal used for secure multi-currency checkout."
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "FedEx/UPS used for handling shipping logistics."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Auth0/AWS Cognito used for OAuth2/OIDC authentication and JWT scopes."
  - type: "externalSystem"
    name: "Notification Provider"
    description: "SendGrid/Twilio used for sending user notifications."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "Avalara used for calculating order taxes."
  - type: "externalSystem"
    name: "AWS CloudFront"
    description: "CDN for global content caching and edge acceleration."
  - type: "container"
    name: "Storefront SPA"
    technology: "React hosted on AWS S3 & CloudFront"
    description: "Single page application providing catalog browsing, checkout, recommendations, and reviews."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway"
    description: "Entry point for routing client requests to backend microservices."
  - type: "container"
    name: "Catalog & Search Service"
    technology: "Go/Gin, Elasticsearch"
    description: "Handles book catalog browsing and search capabilities."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Node.js/Express"
    description: "Manages secure multi-currency checkout and order processing."
  - type: "container"
    name: "Recommendation & Review Service"
    technology: "Python/FastAPI"
    description: "Provides product recommendations and manages user reviews."
  - type: "container"
    name: "Async Notification Service"
    technology: "Node.js, AWS SQS"
    description: "Handles asynchronous messaging and event notifications."
  - type: "container"
    name: "Database"
    technology: "Amazon Aurora PostgreSQL with multi-AZ and read replicas"
    description: "Stores persistent platform data."
  - type: "container"
    name: "Caching Layer"
    technology: "Amazon ElastiCache (Redis)"
    description: "Caches frequently accessed catalog and session data."
relationships:
  - source: "Book Buyer (Customer)"
    destination: "Storefront SPA"
    description: "Browses catalog, places orders, and leaves reviews"
    technology: "HTTPS"
  - source: "Registered Reviewer"
    destination: "Storefront SPA"
    description: "Manages reviews"
    technology: "HTTPS"
  - source: "Store Administrator"
    destination: "Storefront SPA"
    description: "Manages store operations"
    technology: "HTTPS"
  - source: "Storefront SPA"
    destination: "AWS CloudFront"
    description: "Loaded and cached via CDN"
    technology: "CDN"
  - source: "Storefront SPA"
    destination: "API Gateway"
    description: "Makes API requests"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Catalog & Search Service"
    description: "Routes catalog requests"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "Order & Checkout Service"
    description: "Routes checkout requests"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "Recommendation & Review Service"
    description: "Routes recommendation and review requests"
    technology: "HTTPS/REST"
  - source: "Order & Checkout Service"
    destination: "Async Notification Service"
    description: "Dispatches asynchronous events"
    technology: "AWS SQS"
  - source: "Catalog & Search Service"
    destination: "Database"
    description: "Reads and writes catalog data"
    technology: "PostgreSQL Protocol over TLS"
  - source: "Order & Checkout Service"
    destination: "Database"
    description: "Reads and writes order data"
    technology: "PostgreSQL Protocol over TLS"
  - source: "Recommendation & Review Service"
    destination: "Database"
    description: "Reads and writes review and recommendation data"
    technology: "PostgreSQL Protocol over TLS"
  - source: "Async Notification Service"
    destination: "Database"
    description: "Persists notification state"
    technology: "PostgreSQL Protocol over TLS"
  - source: "Catalog & Search Service"
    destination: "Caching Layer"
    description: "Caches catalog search results"
    technology: "Redis Protocol"
  - source: "Storefront SPA"
    destination: "Payment Gateway"
    description: "Processes secure payments"
    technology: "Outbound HTTPS/REST with mTLS and HMAC"
  - source: "Storefront SPA"
    destination: "Third-Party Shipping APIs"
    description: "Manages shipping logistics"
    technology: "Outbound HTTPS/REST with mTLS and HMAC"
  - source: "Storefront SPA"
    destination: "Notification Provider"
    description: "Sends user notifications"
    technology: "Outbound HTTPS/REST with mTLS and HMAC"
  - source: "Storefront SPA"
    destination: "Tax Calculation Service"
    description: "Calculates purchase taxes"
    technology: "Outbound HTTPS/REST with mTLS and HMAC"
  - source: "Storefront SPA"
    destination: "Identity Provider"
    description: "Enforces authentication and authorization"
    technology: "OAuth2/OIDC with JWT scopes"