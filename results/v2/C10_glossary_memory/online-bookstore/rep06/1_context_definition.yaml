level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "A cloud-native e-commerce platform designed to provide catalog browsing, secure multi-currency checkout, recommendations, and reviews for physical and electronic books."
elements:
  - type: "person"
    name: "Book Buyer (Customer)"
    description: "End-user who browses the catalog, makes purchases, and leaves reviews."
  - type: "person"
    name: "Registered Reviewer"
    description: "User who writes and manages reviews for books."
  - type: "person"
    name: "Store Administrator"
    description: "User who manages store operations and administration."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe/PayPal used for secure multi-currency checkout."
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "FedEx/UPS used for handling shipping logistics."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Auth0/AWS Cognito used for OAuth2/OIDC authentication and JWT scopes."
  - type: "externalSystem"
    name: "Notification Provider"
    description: "SendGrid/Twilio used for sending user notifications."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "Avalara used for calculating order taxes."
  - type: "externalSystem"
    name: "AWS CloudFront"
    description: "CDN for global content caching and edge acceleration."
relationships:
  - source: "Book Buyer (Customer)"
    destination: "Online Bookstore"
    description: "Interacts via Web/Mobile"
    technology: "HTTPS"
  - source: "Registered Reviewer"
    destination: "Online Bookstore"
    description: "Interacts via Web/Mobile"
    technology: "HTTPS"
  - source: "Store Administrator"
    destination: "Online Bookstore"
    description: "Interacts via Web/Mobile"
    technology: "HTTPS"
  - source: "Online Bookstore"
    destination: "AWS CloudFront"
    description: "Uses for global content caching and edge acceleration"
    technology: "CDN"
  - source: "Online Bookstore"
    destination: "Payment Gateway"
    description: "Processes secure payments"
    technology: "Outbound HTTPS/REST with mTLS and HMAC"
  - source: "Online Bookstore"
    destination: "Third-Party Shipping APIs"
    description: "Manages shipping logistics"
    technology: "Outbound HTTPS/REST with mTLS and HMAC"
  - source: "Online Bookstore"
    destination: "Identity Provider"
    description: "Enforces authentication and authorization"
    technology: "OAuth2/OIDC with JWT scopes"
  - source: "Online Bookstore"
    destination: "Notification Provider"
    description: "Sends notifications to users"
    technology: "Outbound HTTPS/REST with mTLS and HMAC"
  - source: "Online Bookstore"
    destination: "Tax Calculation Service"
    description: "Calculates taxes for purchases"
    technology: "Outbound HTTPS/REST with mTLS and HMAC"