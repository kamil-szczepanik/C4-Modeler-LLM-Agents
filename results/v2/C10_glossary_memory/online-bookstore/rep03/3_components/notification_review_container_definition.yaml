level: component
scope: "Component diagram for the Notification & Review Container container"
parentContainer:
  name: "Notification & Review Container"
elements:
  - type: "component"
    name: "Review Controller"
    technology: "Express.js Router"
    description: "Handles HTTP requests for submitting and fetching customer book reviews."
  - type: "component"
    name: "Notification Event Consumer"
    technology: "Node.js SQS Consumer"
    description: "Consumes asynchronous notification events from Amazon SQS."
  - type: "component"
    name: "Review Service"
    technology: "Node.js Business Logic"
    description: "Processes review validation, moderation rules, and database persistence."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Node.js / Express Client"
    description: "Formats and sends emails via the external Notification Service."
relationships:
  - source: "Review Controller"
    destination: "Review Service"
    description: "Delegates review creation and retrieval requests"
  - source: "Notification Event Consumer"
    destination: "Notification Dispatcher"
    description: "Triggers notification dispatch upon receiving SQS messages"
  - source: "Notification Dispatcher"
    destination: "Notification Service"
    description: "Delivers emails via SMTP / API"