level: component
scope: "Component diagram for the Single Page App / Mobile App container"
parentContainer:
  name: "Single Page App / Mobile App"
elements:
  - type: "component"
    name: "Router & Navigation Component"
    technology: "React Router / React Navigation"
    description: "Manages client-side routing, deep linking, and screen navigation across web and mobile platforms."
  - type: "component"
    name: "State Management Component"
    technology: "Redux Toolkit"
    description: "Handles client-side state for user sessions, shopping cart, localization, and cached catalog data."
  - type: "component"
    name: "Catalog & Search View Component"
    technology: "React / React Native"
    description: "Provides user interfaces for browsing books, executing search queries, and displaying product details."
  - type: "component"
    name: "Checkout & Cart View Component"
    technology: "React / React Native"
    description: "Manages shopping cart interactions, order placement forms, and multi-currency checkout flows."
  - type: "component"
    name: "Review & Rating Component"
    technology: "React / React Native"
    description: "Allows customers to submit 5-star ratings and read integrated book reviews."
relationships:
  - source: "Router & Navigation Component"
    destination: "Catalog & Search View Component"
    description: "Navigates to"
  - source: "Router & Navigation Component"
    destination: "Checkout & Cart View Component"
    description: "Navigates to"
  - source: "Router & Navigation Component"
    destination: "Review & Rating Component"
    description: "Navigates to"
  - source: "Catalog & Search View Component"
    destination: "State Management Component"
    description: "Reads and updates catalog state"
  - source: "Checkout & Cart View Component"
    destination: "State Management Component"
    description: "Reads and updates cart state"
  - source: "Review & Rating Component"
    destination: "State Management Component"
    description: "Updates review state"
  - source: "Catalog & Search View Component"
    destination: "API Gateway / BFF Container"
    description: "Fetches catalog and search data via HTTPS / REST"
  - source: "Checkout & Cart View Component"
    destination: "API Gateway / BFF Container"
    description: "Submits orders and manages cart via HTTPS / REST"
  - source: "Review & Rating Component"
    destination: "API Gateway / BFF Container"
    description: "Submits and fetches reviews via HTTPS / REST"
  - source: "Router & Navigation Component"
    destination: "Identity Provider"
    description: "Authenticates users via JWT / JWKS via OpenID Connect"