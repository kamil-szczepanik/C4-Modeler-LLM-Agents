level: component
scope: "Component diagram for the Checkout & Order Container container"
parentContainer:
  name: "Checkout & Order Container"
elements:
  - type: "component"
    name: "API Gateway / BFF Container"
    technology: "AWS API Gateway / Envoy"
    description: "Backend-for-frontend and entry point routing client requests to downstream microservices."
  - type: "component"
    name: "Checkout & Order Container"
    technology: "Java / Spring Boot"
    description: "Manages shopping cart, order placement, and integration with payment and fulfillment systems."
  - type: "component"
    name: "Cart Component"
    technology: "Spring Data Redis / Amazon Aurora PostgreSQL"
    description: "Manages active cart state and persistence."
  - type: "component"
    name: "Order Orchestrator Component"
    technology: "Spring State Machine / Saga"
    description: "Orchestrates distributed transactions and order workflows."
  - type: "component"
    name: "Payment Integration Component"
    technology: "Spring Cloud OpenFeign"
    description: "Handles integration with external payment gateways."
  - type: "component"
    name: "Fulfillment Integration Component"
    technology: "Spring Cloud OpenFeign"
    description: "Handles integration with shipping and fulfillment providers."
  - type: "component"
    name: "Database Containers"
    technology: "Amazon Aurora Global PostgreSQL"
    description: "Provides multi-region relational data durability and cross-region replication."
  - type: "component"
    name: "Payment Gateway"
    technology: "External secure payment processor"
    description: "External service processing secure multi-currency checkouts."
  - type: "component"
    name: "Shipping / Fulfillment Provider"
    technology: "External logistics API"
    description: "External API handling physical book logistics."
relationships:
  - source: "API Gateway / BFF Container"
    destination: "Order Orchestrator Component"
    description: "Internal mTLS / REST"
  - source: "Order Orchestrator Component"
    destination: "Cart Component"
    description: "JDBC / Lettuce Redis Client"
  - source: "Order Orchestrator Component"
    destination: "Payment Integration Component"
    description: "Internal Method Call"
  - source: "Payment Integration Component"
    destination: "Payment Gateway"
    description: "HTTPS / REST, TLS 1.3, PCI-DSS"
  - source: "Fulfillment Integration Component"
    destination: "Shipping / Fulfillment Provider"
    description: "HTTPS / REST Webhooks"