level: component
scope: "Component diagram for the Catalog & Search Container container"
parentContainer:
  name: "Catalog & Search Container"
elements:
  - type: "component"
    name: "Search API Controller"
    technology: "Go / Fiber"
    description: "Handles search requests and queries."
  - type: "component"
    name: "Query Parser & Facet Engine"
    technology: "Go"
    description: "Parses queries and manages facets."
  - type: "component"
    name: "Catalog Management Service"
    technology: "Go"
    description: "Manages catalog data."
  - type: "component"
    name: "Search Indexer Client"
    technology: "Go"
    description: "Interacts with search indexes."
  - type: "component"
    name: "Pricing & Currency Resolver"
    technology: "Go"
    description: "Resolves prices and currencies."
  - type: "component"
    name: "Audit Logging Middleware"
    technology: "Go"
    description: "Performs audit logging."
relationships:
  - source: "Search API Controller"
    destination: "Amazon OpenSearch Service"
    description: "HTTPS / REST, TLS 1.3"
  - source: "Catalog Management Service"
    destination: "Database Containers"
    description: "Internal mTLS / PostgreSQL Protocol"
  - source: "Audit Logging Middleware"
    destination: "Amazon S3"
    description: "HTTPS / AWS IAM"