level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Customer / Reviewer"
    description: "End-users browsing catalogues, purchasing items, managing carts, and submitting 5-star ratings."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service processing secure multi-currency checkouts (USD, EUR, GBP)."
  - type: "externalSystem"
    name: "Shipping / Fulfillment Provider"
    description: "External API handling physical book logistics."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "AWS Cognito / Auth0 managing customer authentication and OIDC/OAuth 2.0 flows."
  - type: "externalSystem"
    name: "Notification Service"
    description: "AWS SES / SendGrid delivering order confirmations and review prompts."
  - type: "container"
    name: "Single Page App / Mobile App"
    technology: "React / React Native"
    description: "Client-side interface for customers to browse, search, purchase books, and manage reviews."
  - type: "container"
    name: "API Gateway / BFF Container"
    technology: "AWS API Gateway / Envoy"
    description: "Backend-for-frontend and entry point routing client requests to downstream microservices."
  - type: "container"
    name: "Catalog & Search Container"
    technology: "Node.js / Go"
    description: "Handles book catalog management and search functionalities."
  - type: "container"
    name: "Checkout & Order Container"
    technology: "Java / Spring Boot"
    description: "Manages shopping cart, order placement, and integration with payment and fulfillment systems."
  - type: "container"
    name: "Notification & Review Container"
    technology: "Node.js / Express"
    description: "Handles customer reviews and triggers notifications asynchronously."
  - type: "container"
    name: "Admin Dashboard Container"
    technology: "React"
    description: "Internal dashboard for administrators to manage catalogue integrity, fulfillment, and compliance."
  - type: "container"
    name: "Database Containers"
    technology: "Amazon Aurora Global PostgreSQL"
    description: "Provides transactional data storage with cross-region replication."
relationships:
  - source: "Customer / Reviewer"
    destination: "Single Page App / Mobile App"
    description: "Browses books, manages carts, and submits reviews"
    technology: "HTTPS"
  - source: "Single Page App / Mobile App"
    destination: "API Gateway / BFF Container"
    description: "Sends API requests"
    technology: "HTTPS / REST"
  - source: "API Gateway / BFF Container"
    destination: "Catalog & Search Container"
    description: "Queries and retrieves catalog and search data"
    technology: "Internal mTLS / REST"
  - source: "API Gateway / BFF Container"
    destination: "Checkout & Order Container"
    description: "Processes checkouts and orders"
    technology: "Internal mTLS / REST"
  - source: "Checkout & Order Container"
    destination: "Payment Gateway"
    description: "Authorizes transactions"
    technology: "HTTPS / REST, TLS 1.3, PCI-DSS"
  - source: "Checkout & Order Container"
    destination: "Shipping / Fulfillment Provider"
    description: "Dispatches fulfillment orders"
    technology: "HTTPS / REST Webhooks"
  - source: "Checkout & Order Container"
    destination: "Notification & Review Container"
    description: "Triggers asynchronous notification events"
    technology: "Amazon SQS / SNS"
  - source: "Single Page App / Mobile App"
    destination: "Identity Provider"
    description: "Authenticates and authorizes users"
    technology: "JWT / JWKS via OpenID Connect"
  - source: "Notification & Review Container"
    destination: "Notification Service"
    description: "Sends transactional emails and alerts"
    technology: "SMTP / API"