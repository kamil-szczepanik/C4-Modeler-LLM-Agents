# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "An Amazon-style e-commerce platform enabling users to browse, search, and purchase physical and electronic books with integrated reviews and recommendations."
elements:
  - type: "person"
    name: "Customer / Reviewer"
    description: "End-users browsing catalogues, purchasing items, managing carts, and submitting 5-star ratings."
  - type: "person"
    name: "Store Administrator"
    description: "Internal personnel managing catalogue integrity, fulfillment, and GDPR/CCPA compliance."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service processing secure multi-currency checkouts (USD, EUR, GBP)."
  - type: "externalSystem"
    name: "Shipping / Fulfillment Provider"
    description: "External API handling physical book logistics."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "AWS Cognito / Auth0 managing customer authentication and OIDC/OAuth 2.0 flows."
  - type: "externalSystem"
    name: "Notification Service"
    description: "AWS SES / SendGrid delivering order confirmations and review prompts."
relationships:
  - source: "Customer / Reviewer"
    destination: "Online Bookstore System"
    description: "Browses, searches, and checks out"
    technology: "HTTPS (Web/Mobile)"
  - source: "Customer / Reviewer"
    destination: "Identity Provider"
    description: "Authenticates and authorizes"
    technology: "HTTPS / OpenID Connect"
  - source: "Online Bookstore System"
    destination: "Identity Provider"
    description: "Validates tokens"
    technology: "JWT / JWKS"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Authorizes transactions"
    technology: "HTTPS / REST (TLS 1.3, PCI-DSS)"
  - source: "Online Bookstore System"
    destination: "Shipping / Fulfillment Provider"
    description: "Dispatches fulfillment orders"
    technology: "HTTPS / REST Webhooks"
  - source: "Online Bookstore System"
    destination: "Notification Service"
    description: "Triggers transactional emails"
    technology: "SMTP / API"