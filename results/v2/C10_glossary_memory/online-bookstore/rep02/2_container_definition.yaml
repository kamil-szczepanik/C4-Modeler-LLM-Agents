level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Book Buyer / Customer and Site Visitor"
    description: "People interacting with the platform via HTTPS to browse catalogues, make purchases, write reviews, and receive recommendations."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processing service such as Stripe or PayPal."
  - type: "externalSystem"
    name: "Third-Party Shipping Providers"
    description: "External shipping services such as FedEx and UPS APIs for fulfillment."
  - type: "externalSystem"
    name: "Tax & Compliance Service"
    description: "External tax and compliance service such as Avalara."
  - type: "externalSystem"
    name: "Recommendation Engine"
    description: "AWS Personalize service providing personalized book recommendations."
  - type: "externalSystem"
    name: "Email/Notification Service"
    description: "Amazon SES for sending emails and notifications."
  - type: "externalSystem"
    name: "Centralized Logging & SIEM"
    description: "Centralized logging and security information and event management system."
  - type: "container"
    name: "Public Catalog & Search SPA & Authenticated Customer Portal SPA"
    technology: "Amazon S3, Amazon CloudFront, AWS WAF"
    description: "Single page applications providing public catalogue browsing, search, and the authenticated customer portal."
  - type: "container"
    name: "AWS API Gateway"
    technology: "AWS API Gateway, AWS App Mesh"
    description: "Manages and routes incoming API requests to internal microservices with mutual TLS."
  - type: "container"
    name: "Catalog & Search Service"
    technology: "Node.js/Express, Java/Spring Boot, Python/FastAPI, AWS ECS on Fargate"
    description: "Handles book catalog browsing and search functionalities."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Node.js/Express, Java/Spring Boot, Python/FastAPI, AWS ECS on Fargate"
    description: "Manages secure checkout and order processing workflows."
  - type: "container"
    name: "Recommendation & Review Service"
    technology: "Node.js/Express, Java/Spring Boot, Python/FastAPI, AWS ECS on Fargate"
    description: "Provides book recommendations and customer reviews."
  - type: "container"
    name: "Customer Review & Moderation Service"
    technology: "Node.js/Express, Java/Spring Boot, Python/FastAPI, AWS ECS on Fargate"
    description: "Moderates and manages customer submitted reviews."
  - type: "container"
    name: "Notification & Engagement Worker"
    technology: "Node.js/Express, Java/Spring Boot, Python/FastAPI, AWS ECS on Fargate"
    description: "Processes asynchronous notification tasks and engagement messages."
  - type: "container"
    name: "Amazon RDS"
    technology: "Amazon RDS"
    description: "Relational database storage for persistent application data."
  - type: "container"
    name: "Redis on Amazon ElastiCache"
    technology: "Redis, Amazon ElastiCache"
    description: "In-memory caching layer for performance optimization and protecting checkout availability."
  - type: "container"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Message queue for decoupled asynchronous messaging between services."
  - type: "container"
    name: "AWS Secrets Manager"
    technology: "AWS Secrets Manager, AWS KMS"
    description: "Manages secrets, encryption keys, and sensitive configuration data."
relationships:
  - source: "Book Buyer / Customer and Site Visitor"
    destination: "Public Catalog & Search SPA & Authenticated Customer Portal SPA"
    description: "Accesses catalogue browsing, secure checkout, reviews, and personalized recommendations"
    technology: "HTTPS (TLS 1.3)"
  - source: "Public Catalog & Search SPA & Authenticated Customer Portal SPA"
    destination: "AWS API Gateway"
    description: "Sends API requests for application data and actions"
    technology: "HTTPS"
  - source: "AWS API Gateway"
    destination: "Catalog & Search Service"
    description: "Routes catalog and search requests"
    technology: "gRPC over TLS (with mutual TLS via AWS App Mesh)"
  - source: "AWS API Gateway"
    destination: "Order & Checkout Service"
    description: "Routes checkout and order placement requests"
    technology: "gRPC over TLS (with mutual TLS via AWS App Mesh)"
  - source: "AWS API Gateway"
    destination: "Recommendation & Review Service"
    description: "Routes recommendation and review requests"
    technology: "gRPC over TLS (with mutual TLS via AWS App Mesh)"
  - source: "AWS API Gateway"
    destination: "Customer Review & Moderation Service"
    description: "Routes review submission and moderation requests"
    technology: "gRPC over TLS (with mutual TLS via AWS App Mesh)"
  - source: "Order & Checkout Service"
    destination: "Payment Gateway"
    description: "Processes payments securely"
    technology: "REST over HTTPS with circuit breakers"
  - source: "Order & Checkout Service"
    destination: "Third-Party Shipping Providers"
    description: "Coordinates fulfillment and shipping"
    technology: "REST over HTTPS with circuit breakers"
  - source: "Order & Checkout Service"
    destination: "Tax & Compliance Service"
    description: "Calculates applicable taxes"
    technology: "REST over HTTPS with circuit breakers"
  - source: "Recommendation & Review Service"
