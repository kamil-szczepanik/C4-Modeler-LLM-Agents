level: component
scope: "Component diagram for the Recommendation & Review Service container"
parentContainer:
  name: "Recommendation & Review Service"
elements:
  - type: "component"
    name: "Recommendation & Review API Handler"
    technology: "Python / FastAPI"
    description: "Handles incoming gRPC requests via AWS App Mesh for recommendations and customer reviews."
  - type: "component"
    name: "Recommendation Logic Controller"
    technology: "Python / FastAPI"
    description: "Manages recommendation processing, communicating with the external Recommendation Engine via REST over HTTPS with circuit breakers."
  - type: "component"
    name: "Review Moderation Handler"
    technology: "Python / FastAPI"
    description: "Processes and validates customer review submissions."
  - type: "component"
    name: "Cache Manager"
    technology: "Python / FastAPI & Redis on Amazon ElastiCache"
    description: "Handles high-frequency read requests using a cache-aside pattern with Redis via RESP with TLS."
  - type: "component"
    name: "Data Access Layer"
    technology: "Python / FastAPI & AWS SDK"
    description: "Interacts with Amazon RDS for persistent storage of review and recommendation data."
  - type: "component"
    name: "Messaging Publisher"
    technology: "Python / FastAPI & AWS SDK"
    description: "Publishes asynchronous telemetry and analytics events to Amazon SQS."
  - type: "component"
    name: "Security & Secrets Handler"
    technology: "Python / FastAPI & AWS SDK"
    description: "Retrieves secure configuration data and secrets from AWS Secrets Manager."
  - type: "component"
    name: "Telemetry & Logging Client"
    technology: "Python / FastAPI"
    description: "Sends centralized logs and telemetry data to the Centralized Logging & SIEM system."
relationships:
  - source: "Recommendation & Review API Handler"
    destination: "Recommendation Logic Controller"
    description: "Delegates recommendation requests"
  - source: "Recommendation & Review API Handler"
    destination: "Review Moderation Handler"
    description: "Delegates review processing requests"
  - source: "Recommendation Logic Controller"
    destination: "Cache Manager"
    description: "Checks and updates cache"
  - source: "Recommendation Logic Controller"
    destination: "Recommendation Engine"
    description: "Fetches machine learning-driven recommendations via REST over HTTPS with circuit breakers"
  - source: "Cache Manager"
    destination: "Redis on Amazon ElastiCache"
    description: "Serves read requests via RESP with TLS"
  - source: "Review Moderation Handler"
    destination: "Data Access Layer"
    description: "Saves and retrieves review data"
  - source: "Data Access Layer"
    destination: "Amazon RDS"
    description: "Executes database queries via AWS SDK"
  - source: "Recommendation Logic Controller"
    destination: "Messaging Publisher"
    description: "Dispatches asynchronous events"
  - source: "Messaging Publisher"
    destination: "Amazon SQS"
    description: "Sends messages via AWS SDK"
  - source: "Recommendation & Review API Handler"
    destination: "Security & Secrets Handler"
    description: "Fetches runtime secrets"
  - source: "Security & Secrets Handler"
    destination: "AWS Secrets Manager"
    description: "Retrieves secrets via AWS SDK"
  - source: "Recommendation & Review API Handler"
    destination: "Telemetry & Logging Client"
    description: "Emits audit logs and metrics"
  - source: "Telemetry & Logging Client"
    destination: "Centralized Logging & SIEM"
    description: "Forwards logs via HTTPS / AWS Infrastructure"