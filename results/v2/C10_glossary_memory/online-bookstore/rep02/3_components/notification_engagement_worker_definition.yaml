level: component
scope: "Component diagram for the Notification & Engagement Worker container"
parentContainer:
  name: "Notification & Engagement Worker"
elements:
  - type: "component"
    name: "Notification Consumer"
    technology: "Node.js/Express, Java/Spring Boot, Python/FastAPI, AWS ECS on Fargate"
    description: "Consumes messages from Amazon SQS to process asynchronous notification tasks and engagement messages."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Node.js/Express, Java/Spring Boot, Python/FastAPI, AWS ECS on Fargate"
    description: "Sends emails and notifications using the Email/Notification Service (Amazon SES)."
relationships:
  - source: "Notification Consumer"
    destination: "Notification Dispatcher"
    description: "Triggers message dispatch"