level: component
scope: "Component diagram for the AWS API Gateway container"
parentContainer:
  name: "AWS API Gateway"
elements:
  - type: "component"
    name: "Amazon API Gateway HTTP API"
    technology: "Amazon API Gateway HTTP API"
    description: "Handles and routes incoming HTTP requests from the frontend SPAs."
  - type: "component"
    name: "AWS App Mesh"
    technology: "AWS App Mesh"
    description: "Provides service mesh capabilities and routing management."
  - type: "component"
    name: "API Router / HTTP Proxy"
    technology: "Envoy / HTTP Proxy"
    description: "Routes traffic to internal microservices."
  - type: "component"
    name: "JWT Authorizer / Auth Validator"
    technology: "AWS Lambda / JWT Validator"
    description: "Validates JSON Web Tokens for authenticated requests."
  - type: "component"
    name: "Rate Limiter & Throttler"
    technology: "API Gateway Native / Throttling Rules"
    description: "Controls traffic rates and protects backend services from overloads."
  - type: "component"
    name: "Service Mesh Proxy Sidecar"
    technology: "Envoy Proxy Sidecar"
    description: "Manages secure communication via mutual TLS."
  - type: "component"
    name: "Request Validation & Transformation"
    technology: "API Gateway Validation"
    description: "Validates and transforms incoming request payloads."
relationships:
  - source: "Amazon API Gateway HTTP API"
    destination: "API Router / HTTP Proxy"
    description: "Forwards routed requests"
  - source: "API Router / HTTP Proxy"
    destination: "Service Mesh Proxy Sidecar"
    description: "Proxies traffic via mTLS"
  - source: "JWT Authorizer / Auth Validator"
    destination: "Amazon API Gateway HTTP API"
    description: "Validates tokens for requests"