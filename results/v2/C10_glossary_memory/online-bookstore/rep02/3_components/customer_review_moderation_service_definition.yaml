level: component
scope: "Component diagram for the Customer Review & Moderation Service container"
parentContainer:
  name: "Customer Review & Moderation Service"
elements:
  - type: "component"
    name: "Review Ingestion API"
    technology: "Python/FastAPI"
    description: "Processes and ingests incoming customer reviews."
  - type: "component"
    name: "Review Moderation Queue"
    technology: "Amazon SQS"
    description: "Queues reviews for moderation to protect system performance."
  - type: "component"
    name: "Automated Moderation & Spam Filter"
    technology: "Python/FastAPI with NLP/ML"
    description: "Performs automated moderation and spam filtering on reviews."
  - type: "component"
    name: "Moderation Workflow & Analytics Engine"
    technology: "Python/FastAPI"
    description: "Manages the moderation workflow and analytics."
  - type: "component"
    name: "Review Persistence Repository"
    technology: "Amazon RDS"
    description: "Persistent relational storage for reviews and metrics."
  - type: "component"
    name: "Content Moderator / Administrator"
    technology: "Person"
    description: "Human administrator managing complex moderation tasks."
  - type: "component"
    name: "Catalog / Quality Analyst"
    technology: "Person"
    description: "Quality analyst reviewing metrics and catalog feedback."
  - type: "component"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Decouples ingestion from CPU-intensive ML filtering."
  - type: "component"
    name: "Amazon RDS"
    technology: "Amazon RDS"
    description: "Provides persistent relational storage for reviews and metrics."
relationships:
  - source: "Review Ingestion API"
    destination: "Review Moderation Queue"
    description: "AWS SDK"
  - source: "Review Moderation Queue"
    destination: "Automated Moderation & Spam Filter"
    description: "AWS SDK"
  - source: "Automated Moderation & Spam Filter"
    destination: "Moderation Workflow & Analytics Engine"
    description: "Internal Function Call"
  - source: "Moderation Workflow & Analytics Engine"
    destination: "Amazon RDS"
    description: "AWS SDK"