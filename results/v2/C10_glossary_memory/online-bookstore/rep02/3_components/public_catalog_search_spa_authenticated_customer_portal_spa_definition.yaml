level: component
scope: "Component diagram for the Public Catalog & Search SPA & Authenticated Customer Portal SPA container"
parentContainer:
  name: "Public Catalog & Search SPA & Authenticated Customer Portal SPA"
elements:
  - type: "component"
    name: "Public Catalog SPA"
    technology: "React, TypeScript, Vite, Amazon S3, Amazon CloudFront"
    description: "Provides public catalogue browsing and search functionalities to site visitors."
  - type: "component"
    name: "Authenticated Customer Portal SPA"
    technology: "React, TypeScript, Vite, Amazon S3, Amazon CloudFront"
    description: "Provides authenticated customer portal capabilities for account and order management."
  - type: "component"
    name: "Edge Security & Routing Component"
    technology: "AWS WAF, CloudFront Functions, Lambda@Edge"
    description: "Handles DDoS mitigation, edge routing, and CSP injection."
relationships:
  - source: "Public Catalog SPA"
    destination: "AWS API Gateway"
    description: "Sends catalog and search API requests over HTTPS"
  - source: "Authenticated Customer Portal SPA"
    destination: "AWS API Gateway"
    description: "Sends authenticated portal API requests over HTTPS"