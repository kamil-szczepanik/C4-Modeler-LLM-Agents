level: component
scope: "Component diagram for the Catalog & Search Service container"
parentContainer:
  name: "Catalog & Search Service"
elements:
  - type: "component"
    name: "Catalog Search Controller"
    technology: "Spring MVC / gRPC Controller"
    description: "Handles incoming catalog search and browsing API requests from the API Gateway."
  - type: "component"
    name: "Catalog Search Manager"
    technology: "Java / Spring Boot Service"
    description: "Implements business logic for searching, filtering, and retrieving book catalog information."
  - type: "component"
    name: "Catalog Repository"
    technology: "Spring Data JPA / AWS SDK"
    description: "Interfaces with Amazon RDS for persistent catalog data storage and retrieval."
  - type: "component"
    name: "Search Index Client"
    technology: "Amazon OpenSearch Client / HTTPS"
    description: "Offloads heavy keyword searches, facets, and multi-currency catalog filtering to Amazon OpenSearch Service."
  - type: "component"
    name: "Cache Manager"
    technology: "Spring Data Redis / RESP"
    description: "Manages in-memory caching with Redis on Amazon ElastiCache to optimize search and catalog performance."
  - type: "component"
    name: "Secret Configuration Client"
    technology: "AWS Secrets Manager SDK"
    description: "Retrieves encrypted secrets, database credentials, and configuration data from AWS Secrets Manager."
relationships:
  - source: "Catalog Search Controller"
    destination: "Catalog Search Manager"
    description: "Delegates requests"
  - source: "Catalog Search Manager"
    destination: "Catalog Repository"
    description: "Queries relational catalog data via"
  - source: "Catalog Search Manager"
    destination: "Search Index Client"
    description: "Executes keyword searches via"
  - source: "Catalog Search Manager"
    destination: "Cache Manager"
    description: "Reads and writes cache entries via"
  - source: "Catalog Search Manager"
    destination: "Secret Configuration Client"
    description: "Fetches credentials and secrets via"