level: component
scope: "Component diagram for the Redis on Amazon ElastiCache container"
parentContainer:
  name: "Redis on Amazon ElastiCache"
elements:
  - type: "component"
    name: "Catalog Cache Store"
    technology: "In-Memory Key-Value Store"
    description: "Delivers sub-millisecond latency for high-frequency catalog searches and active shopping carts."
  - type: "component"
    name: "Session & Cart Store"
    technology: "In-Memory Hash/String Store"
    description: "Maintains session state and active user shopping carts to protect checkout availability."
relationships:
  - source: "Catalog & Search Service"
    destination: "Catalog Cache Store"
    description: "RESP over TLS"
  - source: "Order & Checkout Service"
    destination: "Session & Cart Store"
    description: "RESP over TLS"
  - source: "Redis on Amazon ElastiCache"
    destination: "AWS Secrets Manager"
    description: "AWS SDK for AUTH token management"