level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "A cloud-native e-commerce platform providing catalogue browsing, secure checkout, customer reviews, and personalized recommendations for physical and electronic books."
elements:
  - type: "person"
    name: "Book Buyer / Customer and Site Visitor"
    description: "People interacting with the platform via HTTPS to browse catalogues, make purchases, write reviews, and receive recommendations."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processing service such as Stripe or PayPal."
  - type: "externalSystem"
    name: "Third-Party Shipping Providers"
    description: "External shipping services such as FedEx and UPS APIs for fulfillment."
  - type: "externalSystem"
    name: "Tax & Compliance Service"
    description: "External tax and compliance service such as Avalara."
  - type: "externalSystem"
    name: "Recommendation Engine"
    description: "AWS Personalize service providing personalized book recommendations."
  - type: "externalSystem"
    name: "Email/Notification Service"
    description: "Amazon SES for sending emails and notifications."
  - type: "externalSystem"
    name: "Centralized Logging & SIEM"
    description: "Centralized logging and security information and event management system."
relationships:
  - source: "Book Buyer / Customer and Site Visitor"
    destination: "Online Bookstore"
    description: "Interact with the Online Bookstore for browsing, purchasing, and account management"
    technology: "HTTPS (TLS 1.3)"
  - source: "Online Bookstore"
    destination: "Payment Gateway"
    description: "Processes secure payments with client-side payment tokenization"
    technology: "REST over HTTPS with circuit breakers"
  - source: "Online Bookstore"
    destination: "Third-Party Shipping Providers"
    description: "Calculates shipping rates and manages fulfillment"
    technology: "REST over HTTPS with circuit breakers"
  - source: "Online Bookstore"
    destination: "Tax & Compliance Service"
    description: "Calculates applicable taxes for transactions"
    technology: "REST over HTTPS with circuit breakers"
  - source: "Online Bookstore"
    destination: "Recommendation Engine"
    description: "Fetches personalized book recommendations"
    technology: "AWS Personalize via REST over HTTPS"
  - source: "Online Bookstore"
    destination: "Email/Notification Service"
    description: "Sends transactional and notification emails"
    technology: "Amazon SES"
  - source: "Online Bookstore"
    destination: "Centralized Logging & SIEM"
    description: "Streams operational logs and security telemetry"
    technology: "HTTPS / AWS Infrastructure"