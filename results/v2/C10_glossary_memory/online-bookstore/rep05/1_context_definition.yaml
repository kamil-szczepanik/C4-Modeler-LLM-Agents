level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "An AWS-hosted global online bookstore handling 1 million monthly active users with multi-currency support and secure e-commerce operations, providing catalogue browsing, secure checkout, reviews, and personalized book recommendations."
elements:
  - type: "person"
    name: "Customers / Shoppers"
    description: "End-users browsing catalogues and purchasing books."
  - type: "person"
    name: "Registered Users / Reviewers"
    description: "Authenticated customers writing reviews and ratings."
  - type: "person"
    name: "Store Administrators"
    description: "Internal staff managing content and catalogue accuracy."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe/PayPal handling secure tokenized transactions."
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "FedEx/UPS/DHL providing real-time rates."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "AWS Cognito managing OAuth2/OIDC authentication."
  - type: "externalSystem"
    name: "Analytics & Monitoring Platform"
    description: "Datadog/Segment tracking checkout friction and telemetry."
relationships:
  - source: "Customers / Shoppers"
    destination: "Online Bookstore System"
    description: "Browses catalogues and purchases books"
    technology: "HTTPS (TLS 1.3) via global CDN/WAF and Route 53"
  - type: "Registered Users / Reviewers"
    destination: "Online Bookstore System"
    description: "Authenticates, writes reviews, and manages account"
    technology: "HTTPS (TLS 1.3)"
  - type: "Store Administrators"
    destination: "Online Bookstore System"
    description: "Manages content and catalogue accuracy"
    technology: "HTTPS (TLS 1.3)"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Handles secure tokenized transactions for checkout"
    technology: "HTTPS/REST using tokenized iframe SDKs"
  - source: "Online Bookstore System"
    destination: "Third-Party Shipping APIs"
    description: "Retrieves real-time shipping rates"
    technology: "HTTPS/REST with circuit breakers and fallback caching"
  - source: "Online Bookstore System"
    destination: "Identity Provider"
    description: "Authenticates users and manages sessions"
    technology: "OAuth2/OIDC with short-lived JWTs"
  - source: "Online Bookstore System"
    destination: "Analytics & Monitoring Platform"
    description: "Tracks checkout friction and system telemetry"
    technology: "HTTPS"