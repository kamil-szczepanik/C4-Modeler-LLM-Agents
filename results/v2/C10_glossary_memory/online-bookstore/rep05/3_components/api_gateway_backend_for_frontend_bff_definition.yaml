level: component
scope: "Component diagram for the API Gateway / Backend-for-Frontend (BFF) container"
parentContainer:
  name: "API Gateway / Backend-for-Frontend (BFF)"
elements:
  - type: "component"
    name: "API Router & Rate Limiter Component"
    technology: "AWS API Gateway"
    description: "Provides edge routing, WAF evaluation, and token bucket rate limiting for security."
  - type: "component"
    name: "GraphQL / REST Resolver Component"
    technology: "NestJS on AWS ECS Fargate"
    description: "Powers the backend-for-frontend containers with horizontal autoscaling."
  - type: "component"
    name: "Session & Auth Middleware Component"
    technology: "NestJS"
    description: "Manages session and authentication middleware."
  - type: "component"
    name: "Telemetry & Logging Interceptor Component"
    technology: "NestJS / OpenTelemetry"
    description: "Standardizes distributed tracing across BFF and backend gRPC services."
  - type: "component"
    name: "Regional Distributed Caching"
    technology: "AWS ElastiCache / Redis"
    description: "Implements regional distributed caching for currency rates and catalogue metadata to reduce latency."
relationships:
  - source: "Single-Page Application (SPA)"
    destination: "API Router & Rate Limiter Component"
    description: "HTTPS/REST and GraphQL"
  - source: "API Router & Rate Limiter Component"
    destination: "Session & Auth Middleware Component"
    description: "Internal HTTP"
  - source: "Session & Auth Middleware Component"
    destination: "GraphQL / REST Resolver Component"
    description: "In-process calls"
  - source: "GraphQL / REST Resolver Component"
    destination: "Catalog & Search Service"
    description: "gRPC over mTLS"
  - source: "GraphQL / REST Resolver Component"
    destination: "Order & Checkout Service"
    description: "gRPC over mTLS"
  - source: "GraphQL / REST Resolver Component"
    destination: "Recommendation & Review Service"
    description: "gRPC over mTLS"
  - source: "API Router & Rate Limiter Component"
    destination: "Identity Provider"
    description: "OAuth2/OIDC with short-lived JWTs"
  - source: "API Router & Rate Limiter Component"
    destination: "Analytics & Monitoring Platform"
    description: "HTTPS"