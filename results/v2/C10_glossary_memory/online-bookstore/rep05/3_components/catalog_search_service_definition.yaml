level: component
scope: "Component diagram for the Catalog & Search Service container"
parentContainer:
  name: "Catalog & Search Service"
elements:
  - type: "component"
    name: "Catalog Controller"
    technology: "Node.js / Express or Spring MVC REST Controller"
    description: "Exposes REST and gRPC endpoints for searching books, browsing categories, and retrieving product details."
  - type: "component"
    name: "Search Indexer Service"
    technology: "Node.js / Java"
    description: "Synchronizes product catalogue data and manages indices in AWS OpenSearch for fast keyword matching."
  - type: "component"
    name: "Catalogue Repository"
    technology: "AWS OpenSearch Client"
    description: "Handles data persistence queries and full-text search operations against AWS OpenSearch."
relationships:
  - source: "Catalog Controller"
    destination: "Search Indexer Service"
    description: "Delegates search and query execution"
  - source: "Search Indexer Service"
    destination: "Catalogue Repository"
    description: "Queries and indexes catalogue data"