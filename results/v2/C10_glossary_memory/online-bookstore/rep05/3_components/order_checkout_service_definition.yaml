level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Cart Management Component"
    technology: "Spring Boot / Go"
    description: "Manages ephemeral and persistent user cart states."
  - type: "component"
    name: "Checkout Orchestrator Component"
    technology: "Spring Boot / Go"
    description: "Enforces ACID transactions and coordinates payment/shipping."
  - type: "component"
    name: "Order Fulfillment Component"
    technology: "Spring Boot / Go"
    description: "Handles asynchronous downstream event dispatch."
  - type: "component"
    name: "AWS Aurora PostgreSQL Multi-Region"
    technology: "AWS Aurora PostgreSQL"
    description: "Provides durable relational storage for orders."
  - type: "component"
    name: "AWS ElastiCache for Redis"
    technology: "AWS ElastiCache for Redis"
    description: "Caches transient cart sessions and multi-currency rates."
  - type: "component"
    name: "AWS SQS/SNS"
    technology: "AWS SQS/SNS"
    description: "Delivers asynchronous event messaging and dead-letter queues."
relationships:
  - source: "API Gateway / Backend-for-Frontend (BFF)"
    destination: "Checkout Orchestrator Component"
    description: "Routes gRPC requests with mTLS over AWS Cloud Map"
  - source: "Checkout Orchestrator Component"
    destination: "Payment Gateway"
    description: "Transacts securely via HTTPS/REST using tokenized iframe SDKs"
  - source: "Checkout Orchestrator Component"
    destination: "AWS Aurora PostgreSQL Multi-Region"
    description: "Executes transactional reads and writes over JDBC/SQL"
  - source: "Cart Management Component"
    destination: "AWS ElastiCache for Redis"
    description: "Accesses cached cart state via RESP protocol"
  - source: "Checkout Orchestrator Component"
    destination: "Order Fulfillment Component"
    description: "Publishes domain events asynchronously via AWS SQS/SNS"