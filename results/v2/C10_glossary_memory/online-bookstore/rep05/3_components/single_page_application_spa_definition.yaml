level: component
scope: "Component diagram for the Single-Page Application (SPA) container"
parentContainer:
  name: "Single-Page Application (SPA)"
elements:
  - type: "component"
    name: "Router & View Controller"
    technology: "React Router, TypeScript"
    description: "Manages client-side routing, view rendering, and navigation across catalogue browsing, checkout, reviews, and recommendations."
  - type: "component"
    name: "Catalogue & Search Module"
    technology: "React, TypeScript, Vite"
    description: "Handles user interfaces for browsing books, executing keyword searches, and displaying item details."
  - type: "component"
    name: "Checkout & Cart Module"
    technology: "React, TypeScript, Vite"
    description: "Manages shopping cart state and coordinates secure checkout interactions."
  - type: "component"
    name: "Recommendations & Reviews Module"
    technology: "React, TypeScript, Vite"
    description: "Displays personalized book recommendations and handles user review submissions."
relationships:
  - source: "Router & View Controller"
    destination: "Catalogue & Search Module"
    description: "Renders"
  - source: "Router & View Controller"
    destination: "Checkout & Cart Module"
    description: "Renders"
  - source: "Router & View Controller"
    destination: "Recommendations & Reviews Module"
    description: "Renders"
  - source: "Catalogue & Search Module"
    destination: "API Gateway / Backend-for-Frontend (BFF)"
    description: "Fetches catalogue and search data via HTTPS/REST and GraphQL"
  - source: "Checkout & Cart Module"
    destination: "API Gateway / Backend-for-Frontend (BFF)"
    description: "Processes cart operations and checkout via HTTPS/REST and GraphQL"
  - source: "Recommendations & Reviews Module"
    destination: "API Gateway / Backend-for-Frontend (BFF)"
    description: "Fetches recommendations and submits reviews via HTTPS/REST and GraphQL"