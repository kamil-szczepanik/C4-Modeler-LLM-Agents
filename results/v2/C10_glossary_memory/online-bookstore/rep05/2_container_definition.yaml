level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Customers / Shoppers"
    description: "End-users browsing catalogues and purchasing books."
  - type: "person"
    name: "Registered Users / Reviewers"
    description: "Authenticated customers writing reviews and ratings."
  - type: "person"
    name: "Store Administrators"
    description: "Internal staff managing content and catalogue accuracy."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe/PayPal handling secure tokenized transactions."
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "FedEx/UPS/DHL providing real-time rates."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "AWS Cognito managing OAuth2/OIDC authentication."
  - type: "externalSystem"
    name: "Analytics & Monitoring Platform"
    description: "Datadog/Segment tracking checkout friction and telemetry."
  - type: "container"
    name: "Single-Page Application (SPA)"
    technology: "React, TypeScript, Vite"
    description: "Delivers sub-2s page loads on 3G for the SPA hosted globally on AWS CloudFront/S3."
  - type: "container"
    name: "API Gateway / Backend-for-Frontend (BFF)"
    technology: "AWS API Gateway / NestJS on AWS ECS Fargate"
    description: "Handles request routing, rate limiting, and TLS termination."
  - type: "container"
    name: "Catalog & Search Service"
    technology: "Node.js / Java, AWS OpenSearch"
    description: "Isolates keyword searches for scalable catalogue browsing."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Spring Boot / Go"
    description: "Ensures ACID-compliant transactions for carts and orders across multiple regions."
  - type: "container"
    name: "Recommendation & Review Service"
    technology: "Python / FastAPI, AWS DynamoDB / ElastiCache"
    description: "Isolates heavy analytical recommendation and review queries from checkout."
relationships:
  - source: "Customers / Shoppers"
    destination: "Single-Page Application (SPA)"
    description: "Browses catalogues and purchases books"
    technology: "HTTPS (TLS 1.3) via global CDN/WAF and Route 53"
  - source: "Registered Users / Reviewers"
    destination: "Single-Page Application (SPA)"
    description: "Authenticates, writes reviews, and manages account"
    technology: "HTTPS (TLS 1.3)"
  - source: "Store Administrators"
    destination: "Single-Page Application (SPA)"
    description: "Manages content and catalogue accuracy"
    technology: "HTTPS (TLS 1.3)"
  - source: "Single-Page Application (SPA)"
    destination: "API Gateway / Backend-for-Frontend (BFF)"
    description: "Sends API requests"
    technology: "HTTPS/REST and GraphQL"
  - source: "API Gateway / Backend-for-Frontend (BFF)"
    destination: "Catalog & Search Service"
    description: "Routes catalogue and search queries"
    technology: "internal gRPC over AWS Cloud Map / ECS Service Connect with mTLS"
  - source: "API Gateway / Backend-for-Frontend (BFF)"
    destination: "Order & Checkout Service"
    description: "Routes order and checkout requests"
    technology: "internal gRPC over AWS Cloud Map / ECS Service Connect with mTLS"
  - source: "API Gateway / Backend-for-Frontend (BFF)"
    destination: "Recommendation & Review Service"
    description: "Routes recommendation and review requests"
    technology: "internal gRPC over AWS Cloud Map / ECS Service Connect with mTLS"
  - source: "Order & Checkout Service"
    destination: "Payment Gateway"
    description: "Handles secure tokenized transactions for checkout"
    technology: "HTTPS/REST using tokenized iframe SDKs"
  - source: "Order & Checkout Service"
    destination: "Third-Party Shipping APIs"
    description: "Retrieves real-time shipping rates"
    technology: "HTTPS/REST with circuit breakers and fallback caching"
  - source: "API Gateway / Backend-for-Frontend (BFF)"
    destination: "Identity Provider"
    description: "Authenticates users and manages sessions"
    technology: "OAuth2/OIDC with short-lived JWTs"
  - source: "API Gateway / Backend-for-Frontend (BFF)"
    destination: "Analytics & Monitoring Platform"
    description: "Tracks checkout friction and system telemetry"
    technology: "HTTPS"