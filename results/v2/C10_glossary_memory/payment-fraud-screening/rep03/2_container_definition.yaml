level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analysts & Risk Managers"
    description: "Internal users accessing the system for case reviews and rule updates."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "External system sending authorization requests via REST/gRPC."
  - type: "externalSystem"
    name: "AWS Cognito"
    description: "Identity provider handling OAuth2/OIDC and MFA."
  - type: "container"
    name: "AWS Application Load Balancer (ALB)"
    technology: "AWS ALB"
    description: "Ingress layer providing low-latency routing without API Gateway overhead."
  - type: "container"
    name: "Scoring Engine"
    technology: "Java (Spring Boot / gRPC) on AWS ECS on Fargate"
    description: "Stateless scoring engine meeting <50ms P99 latency at 3,000 TPS."
  - type: "container"
    name: "Case Management Service"
    technology: "Node.js / React on AWS ECS on Fargate"
    description: "Case management UI ensuring analysts never access raw card data."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Low-latency feature store for transaction evaluation."
  - type: "container"
    name: "AWS S3 Object Lock"
    technology: "AWS S3 Object Lock"
    description: "Tamper-evident 7-year audit storage replacing QLDB to minimize operational overhead."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "AWS Application Load Balancer (ALB)"
    description: "Sends synchronous authorization requests"
    technology: "gRPC/HTTPS over mTLS"
  - source: "Fraud Analysts & Risk Managers"
    destination: "AWS Cognito"
    description: "Authenticates via OAuth2 and MFA"
    technology: "OAuth2/OIDC"
  - source: "Fraud Analysts & Risk Managers"
    destination: "Case Management Service"
    description: "Accesses case management for case reviews and rule updates"
    technology: "HTTPS, TLS 1.3"
  - source: "AWS Application Load Balancer (ALB)"
    destination: "Scoring Engine"
    description: "Routes scoring and authorization traffic"
    technology: "gRPC/HTTPS"
  - source: "AWS Application Load Balancer (ALB)"
    destination: "Case Management Service"
    description: "Routes case management UI and API traffic"
    technology: "HTTPS"
  - source: "Scoring Engine"
    destination: "Amazon DynamoDB"
    description: "Retrieves low-latency transaction features"
    technology: "TCP"
  - source: "Scoring Engine"
    destination: "AWS S3 Object Lock"
    description: "Streams asynchronous tamper-evident audit logs"
    technology: "AWS API"