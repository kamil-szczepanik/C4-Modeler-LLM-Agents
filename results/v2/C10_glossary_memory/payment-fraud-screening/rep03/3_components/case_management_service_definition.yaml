level: component
scope: "Component diagram for the Case Management Service container"
parentContainer:
  name: "Case Management Service"
elements:
  - type: "component"
    name: "Case Management API Controller"
    technology: "Node.js (Express)"
    description: "Exposes REST endpoints for fraud analysts and risk managers to review cases and update investigation statuses."
  - type: "component"
    name: "Case Management UI"
    technology: "React"
    description: "Web frontend serving the risk operations dashboard via Amazon CloudFront and S3."
  - type: "component"
    name: "Case Business Logic Service"
    technology: "Node.js Service"
    description: "Orchestrates case workflows, communicates with the Scoring Engine via gRPC, and logs audit events."
relationships:
  - source: "Case Management UI"
    destination: "Case Management API Controller"
    description: "Sends HTTPS API requests for case data"
  - source: "Case Management API Controller"
    destination: "Case Business Logic Service"
    description: "Delegates workflow requests"
  - source: "Case Business Logic Service"
    destination: "Scoring Engine"
    description: "Queries scoring details via gRPC"
  - source: "Case Business Logic Service"
    destination: "AWS S3 Object Lock"
    description: "Persists tamper-evident audit logs via AWS API"