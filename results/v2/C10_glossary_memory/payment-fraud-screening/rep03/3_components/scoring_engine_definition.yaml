level: component
scope: "Component diagram for the Scoring Engine container"
parentContainer:
  name: "Scoring Engine"
elements:
  - type: "component"
    name: "gRPC Ingress Handler"
    technology: "Java (Spring Boot / gRPC)"
    description: "Handles incoming gRPC requests from the AWS Application Load Balancer."
  - type: "component"
    name: "Feature Evaluator Component"
    technology: "Java"
    description: "Evaluates features by retrieving data from Amazon DynamoDB."
  - type: "component"
    name: "ML Inference & Rule Engine Component"
    technology: "Java / ONNX Runtime"
    description: "Performs machine learning inference and rule evaluation with a Shadow Evaluation Router."
  - type: "component"
    name: "Audit Dispatcher Component"
    technology: "Java"
    description: "Dispatches audit logs to AWS S3 Object Lock via AWS API."
relationships:
  - source: "gRPC Ingress Handler"
    destination: "Feature Evaluator Component"
    description: "Passes request payload for feature extraction."
  - source: "Feature Evaluator Component"
    destination: "ML Inference & Rule Engine Component"
    description: "Provides evaluated features for transaction scoring."
  - source: "ML Inference & Rule Engine Component"
    destination: "Audit Dispatcher Component"
    description: "Sends scoring results and audit data for recording."
  - source: "Feature Evaluator Component"
    destination: "Amazon DynamoDB"
    description: "Queries transaction features via TCP."
  - source: "Audit Dispatcher Component"
    destination: "AWS S3 Object Lock"
    description: "Stores tamper-evident audit logs via AWS API."