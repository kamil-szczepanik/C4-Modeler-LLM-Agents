level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Processes card-not-present payment authorizations to detect fraud within a sub-50ms latency window while providing case management for analysts."
elements:
  - type: "person"
    name: "Cardholders / Merchants"
    description: "External entities initiating transactions indirectly."
  - type: "person"
    name: "Fraud Analysts & Risk Managers"
    description: "Internal users accessing the system for case reviews and rule updates."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "External system sending authorization requests via REST/gRPC."
  - type: "externalSystem"
    name: "AWS ECS on Fargate"
    description: "Container platform hosting the hot-path scoring engine."
  - type: "externalSystem"
    name: "AWS QLDB / S3 Object Lock"
    description: "Storage for tamper-evident audit logs."
  - type: "externalSystem"
    name: "AWS Cognito"
    description: "Identity provider handling OAuth2/OIDC and MFA."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Sends synchronous authorization requests"
    technology: "gRPC/HTTPS over mTLS"
  - source: "Fraud Analysts & Risk Managers"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Accesses case management for case reviews and rule updates"
    technology: "HTTPS (TLS 1.3)"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "AWS QLDB / S3 Object Lock"
    description: "Streams asynchronous audit logs for tamper-evident retention"
    technology: "AWS QLDB / S3 API"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "AWS ECS on Fargate"
    description: "Executes scalable scoring containers for low-latency decisions"
    technology: "AWS ECS / Fargate"