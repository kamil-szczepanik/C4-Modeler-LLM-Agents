level: component
scope: "Component diagram for the Case Management Container container"
parentContainer:
  name: "Case Management Container"
elements:
  - type: "person"
    name: "Fraud Analyst"
    technology: "Internal reporting tooling"
    description: "Reviews cases and manages fraud rules via internal reporting tooling."
  - type: "person"
    name: "Risk Manager"
    technology: "Internal reporting tooling"
    description: "Monitors risk metrics and system performance via internal tooling."
  - type: "component"
    name: "Case UI Component"
    technology: "React / TypeScript SPA via AWS S3/CloudFront"
    description: "Delivers responsive single-page application dashboards for case reviews and monitoring."
  - type: "component"
    name: "Case API Component"
    technology: "Node.js / Express on AWS ECS Fargate"
    description: "Handles backend requests and business logic for case management workflows."
  - type: "component"
    name: "Case Ingestion Worker Component"
    technology: "Node.js / TypeScript on AWS ECS Fargate"
    description: "Ingests suspicious transactions asynchronously for fraud analyst reviews."
  - type: "component"
    name: "Case Database Component"
    technology: "AWS Aurora Serverless v2 PostgreSQL"
    description: "Provides cost-effective, auto-scaling relational storage for case reviews and audit logs."
  - type: "container"
    name: "Scoring Engine Container"
    technology: "Rust / Tokio, AWS ECS Fargate"
    description: "Handles high-throughput, low-latency real-time fraud scoring for payment authorizations."
  - type: "externalSystem"
    name: "AWS SQS"
    technology: "Managed Message Queue"
    description: "Enables decoupled, asynchronous ingestion of suspicious transactions with Dead-Letter Queue support."
relationships:
  - source: "Fraud Analyst"
    destination: "Case UI Component"
    description: "HTTPS Web UI"
  - source: "Risk Manager"
    destination: "Case UI Component"
    description: "HTTPS Web UI"
  - source: "Fraud Analyst"
    destination: "Case API Component"
    description: "HTTPS / REST over TLS 1.3"
  - source: "Risk Manager"
    destination: "Case API Component"
    description: "HTTPS / REST over TLS 1.3"
  - source: "Case API Component"
    destination: "Case Database Component"
    description: "PostgreSQL Wire Protocol over TLS 1.3"
  - source: "Scoring Engine Container"
    destination: "Case Ingestion Worker Component"
    description: "AWS SQS over TLS 1.3 with AWS KMS"
  - source: "Case Ingestion Worker Component"
    destination: "Case Database Component"
    description: "PostgreSQL Wire Protocol over TLS 1.3"