level: component
scope: "Component diagram for the Scoring Engine Container container"
parentContainer:
  name: "Scoring Engine Container"
elements:
  - type: "component"
    name: "API Ingress Component"
    technology: "Rust / Tonic gRPC"
    description: "Receives incoming payment authorization requests and enforces protocol security."
  - type: "component"
    name: "Token Resolution Component"
    technology: "Rust / Reqwest"
    description: "Securely resolves tokens against the external CDE/Tokenization Vault."
  - type: "component"
    name: "Rule & Model Execution Component"
    technology: "Rust / Native Eval"
    description: "Executes cryptographic rules and models for low-latency scoring."
  - type: "component"
    name: "Audit Dispatcher Component"
    technology: "Rust / Tokio async channel"
    description: "Dispatches decision inputs and audit logs asynchronously."
  - type: "component"
    name: "Circuit Breaker & Fallback Coordinator Component"
    technology: "Rust / custom Tokio-native wrapper"
    description: "Manages resilience, handling failover to the Fallback Scoring Container during primary outages."
relationships:
  - source: "API Ingress Component"
    destination: "Token Resolution Component"
    description: "Forwards token data for resolution"
  - source: "Token Resolution Component"
    destination: "Rule & Model Execution Component"
    description: "Passes resolved transaction data for scoring"
  - source: "Rule & Model Execution Component"
    destination: "Audit Dispatcher Component"
    description: "Sends scoring results and decision inputs for auditing"
  - source: "Rule & Model Execution Component"
    destination: "Circuit Breaker & Fallback Coordinator Component"
    description: "Monitors scoring health and coordinates fallbacks if needed"