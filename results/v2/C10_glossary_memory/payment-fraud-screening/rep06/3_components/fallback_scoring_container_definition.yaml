level: component
scope: "Component diagram for the Fallback Scoring Container container"
parentContainer:
  name: "Fallback Scoring Container"
elements:
  - type: "component"
    name: "Heuristic Evaluator"
    technology: "Python / FastAPI"
    description: "Executes simplified heuristic rules during primary outages to maintain baseline fraud screening."
  - type: "component"
    name: "Fallback API Handler"
    technology: "FastAPI Routing"
    description: "Receives fallback scoring requests via HTTPS over mTLS from the primary scoring engine."
relationships:
  - source: "Fallback API Handler"
    destination: "Heuristic Evaluator"
    description: "Delegates requests for heuristic evaluation"