level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Reviews cases and manages fraud rules via internal reporting tooling."
  - type: "person"
    name: "Risk Manager"
    description: "Monitors risk metrics and system performance via internal tooling."
  - type: "person"
    name: "Compliance & Audit Officer"
    description: "Ensures regulatory compliance and audits historical transaction logs."
  - type: "externalSystem"
    name: "Payment Gateway / Core Processing System"
    description: "Sends card-not-present payment authorization requests."
  - type: "externalSystem"
    name: "External Cardholder Data Environment (CDE) / Tokenization Vault"
    description: "Resolves tokens securely via APIs to ensure raw PANs never enter application memory."
  - type: "externalSystem"
    name: "AWS S3 Object Lock"
    description: "Provides WORM-compliant tamper-evident storage for 7-year auditability."
  - type: "externalSystem"
    name: "Dynamic Rule & Model Registry"
    description: "Stores cryptographically signed rules and models hot-loaded via AWS KMS."
  - type: "container"
    name: "Scoring Engine Container"
    technology: "Rust / Tokio, AWS ECS Fargate"
    description: "Handles high-throughput, low-latency real-time fraud scoring for payment authorizations."
  - type: "container"
    name: "Case Management Container"
    technology: "Node.js / TypeScript, AWS ECS Fargate"
    description: "Supports administrative workflows and fraud analyst case reviews."
  - type: "container"
    name: "Fallback Scoring Container"
    technology: "Python / FastAPI, AWS ECS Fargate"
    description: "Executes simplified heuristic rules during primary outages."
  - type: "container"
    name: "Audit Reporting Container"
    technology: "Node.js / TypeScript, AWS ECS Fargate"
    description: "Provides audit reporting and compliance oversight tools."
relationships:
  - source: "Payment Gateway / Core Processing System"
    destination: "Scoring Engine Container"
    description: "Sends payment authorization requests"
    technology: "gRPC/REST over TLS 1.3 with mTLS and OAuth2/JWT"
  - source: "Scoring Engine Container"
    destination: "External Cardholder Data Environment (CDE) / Tokenization Vault"
    description: "Resolves tokens securely"
    technology: "Secure APIs"
  - source: "Scoring Engine Container"
    destination: "Dynamic Rule & Model Registry"
    description: "Cryptographically validates and hot-loads signed rules"
    technology: "AWS KMS and ECDSA P-256"
  - source: "Scoring Engine Container"
    destination: "AWS S3 Object Lock"
    description: "Writes decision inputs, model versions, and explanations"
    technology: "AWS Firehose / S3 API"
  - source: "Scoring Engine Container"
    destination: "Fallback Scoring Container"
    description: "Routes to fallback during primary outages"
    technology: "Internal HTTP/JSON via AWS Service Discovery"
  - source: "Fraud Analyst"
    destination: "Case Management Container"
    description: "Interacts for case reviews and management"
    technology: "HTTPS Web UI"
  - source: "Risk Manager"
    destination: "Case Management Container"
    description: "Monitors risk metrics"
    technology: "HTTPS Web UI"
  - source: "Compliance & Audit Officer"
    destination: "Audit Reporting Container"
    description: "Interacts for compliance audits and reporting"
    technology: "HTTPS Web UI"
  - source: "Audit Reporting Container"
    destination: "AWS S3 Object Lock"
    description: "Audits historical transaction logs and compliance data"
    technology: "AWS SDK / S3 API"