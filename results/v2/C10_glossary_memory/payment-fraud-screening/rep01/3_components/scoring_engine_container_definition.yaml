level: component
scope: "Component diagram for the Scoring Engine Container container"
parentContainer:
  name: "Scoring Engine Container"
elements:
  - type: "component"
    name: "Inference API Controller"
    technology: "Python, FastAPI"
    description: "Exposes the scoring engine API endpoints and routes incoming scoring requests."
  - type: "component"
    name: "Model Registry Sync Agent"
    technology: "Python"
    description: "Synchronizes machine learning models from the model registry pipeline."
  - type: "component"
    name: "Model Execution Engine"
    technology: "Python, ONNX Runtime / Triton Inference Server"
    description: "Executes ML model inference using ONNX Runtime C-API for low latency."
  - type: "component"
    name: "Feature Extraction Component"
    technology: "Python"
    description: "Extracts and transforms features required for model inference in-memory."
  - type: "component"
    name: "Explanation Generation Component"
    technology: "Python"
    description: "Generates model explanations asynchronously for audit and compliance."
relationships:
  - source: "Inference API Controller"
    destination: "Feature Extraction Component"
    description: "In-Memory Function Call"
  - source: "Inference API Controller"
    destination: "Model Execution Engine"
    description: "In-Memory Function Call / ONNX Runtime C-API"
  - source: "Model Execution Engine"
    destination: "Explanation Generation Component"
    description: "In-Memory Function Call"
  - source: "Model Registry Sync Agent"
    destination: "CI/CD & Model Registry Pipeline"
    description: "HTTPS / S3 API"
  - source: "Scoring Engine Container"
    destination: "AWS Audit & Compliance Store"
    description: "HTTPS / S3 API"