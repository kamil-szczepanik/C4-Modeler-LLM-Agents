level: component
scope: "Component diagram for the Case Management Portal Container container"
parentContainer:
  name: "Case Management Portal Container"
elements:
  - type: "component"
    name: "UI Presentation Component"
    technology: "React/TypeScript, Nginx"
    description: "Powers the UI Presentation Component with strict CSP headers and client-side card data masking."
  - type: "component"
    name: "Case Management API Component"
    technology: "Node.js/TypeScript"
    description: "Powers the Case Management API Component for efficient asynchronous case workflow handling."
  - type: "component"
    name: "Audit Logging Component"
    technology: "AWS KMS (AES-256)"
    description: "Secures local disk buffers and encrypted storage for tamper-evident compliance audit trails."
  - type: "person"
    name: "Fraud Analyst"
    technology: "Human user"
    description: "Reviews flagged cases and manages fraud investigations."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    technology: "OIDC / OAuth2"
    description: "Secures authentication, RBAC, and hardware-backed MFA for analysts."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Stores transactional case data with read replicas."
  - type: "externalSystem"
    name: "AWS Audit & Compliance Store"
    technology: "HTTPS / S3 API"
    description: "Stores tamper-evident WORM audit retention data."
  - type: "externalSystem"
    name: "AWS CloudWatch / Observability Platform"
    technology: "HTTPS / AWS SDK"
    description: "Provides centralized observability and distributed tracing."
relationships:
  - source: "Fraud Analyst"
    destination: "UI Presentation Component"
    description: "HTTPS (TLS 1.3)"
  - source: "UI Presentation Component"
    destination: "Case Management API Component"
    description: "HTTPS (JSON/REST)"
  - source: "Case Management API Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "SQL / TLS"
  - source: "Case Management API Component"
    destination: "AWS Audit & Compliance Store"
    description: "HTTPS / S3 API"
  - source: "Case Management API Component"
    destination: "AWS CloudWatch / Observability Platform"
    description: "HTTPS / AWS SDK"
  - source: "UI Presentation Component"
    destination: "Identity Provider (IdP)"
    description: "OIDC / OAuth2"