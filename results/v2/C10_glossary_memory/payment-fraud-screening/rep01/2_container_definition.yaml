level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Reviews flagged cases and manages fraud investigations."
  - type: "externalSystem"
    name: "Merchant / Payment Gateway"
    description: "Submits card-not-present payment authorizations for fraud screening."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Secures authentication, RBAC, and hardware-backed MFA for analysts."
  - type: "externalSystem"
    name: "AWS Audit & Compliance Store"
    description: "Stores tamper-evident WORM audit retention data."
  - type: "externalSystem"
    name: "CI/CD & Model Registry Pipeline"
    description: "Manages continuous integration, delivery, and model registry."
  - type: "container"
    name: "Decision API Container"
    technology: "Go, AWS Fargate"
    description: "Powers the Decision API for high-performance and low-latency authorization checks."
  - type: "container"
    name: "Scoring Engine Container"
    technology: "Python, FastAPI, AWS Fargate"
    description: "Powers the Scoring Engine for ML model inference."
  - type: "container"
    name: "Case Management Portal Container"
    technology: "AWS Fargate"
    description: "Provides case management interfaces for fraud analysts."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Stores transactional case data with read replicas."
relationships:
  - source: "Merchant / Payment Gateway"
    destination: "Decision API Container"
    description: "Sends payment authorizations for fraud screening"
    technology: "gRPC / HTTPS"
  - source: "Decision API Container"
    destination: "Scoring Engine Container"
    description: "Requests scoring and model inference"
    technology: "Internal VPC gRPC / mTLS"
  - source: "Fraud Analyst"
    destination: "Case Management Portal Container"
    description: "Performs case management and analyst reviews"
    technology: "HTTPS (TLS 1.3)"
  - source: "Case Management Portal Container"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users via OIDC/OAuth2"
    technology: "OIDC / OAuth2"
  - source: "Scoring Engine Container"
    destination: "AWS Audit & Compliance Store"
    description: "Saves audit logs for tamper-evident compliance"
    technology: "HTTPS / S3 API"