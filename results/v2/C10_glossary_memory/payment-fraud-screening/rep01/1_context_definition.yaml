level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Screens card-not-present payment authorizations for fraud before approval and provides case management for analyst reviews."
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Reviews flagged cases and manages fraud investigations."
  - type: "person"
    name: "Risk & Compliance Officer"
    description: "Oversees risk management and compliance with regulatory standards."
  - type: "externalSystem"
    name: "Merchant / Payment Gateway"
    description: "Submits card-not-present payment authorizations for fraud screening."
  - type: "externalSystem"
    name: "Payment Processing Core / Acquirer"
    description: "Processes payments and integrates with the screening system."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Secures authentication, RBAC, and hardware-backed MFA for analysts."
  - type: "externalSystem"
    name: "AWS Audit & Compliance Store"
    description: "Stores tamper-evident WORM audit retention data."
  - type: "externalSystem"
    name: "Notification / Alerting Service"
    description: "Handles alerts and notifications."
  - type: "externalSystem"
    name: "AWS CloudWatch / Observability Platform"
    description: "Provides centralized observability and distributed tracing."
  - type: "externalSystem"
    name: "CI/CD & Model Registry Pipeline"
    description: "Manages continuous integration, delivery, and model registry."
relationships:
  - source: "Merchant / Payment Gateway"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Sends payment authorizations for fraud screening"
    technology: "gRPC / HTTPS"
  - source: "Fraud Analyst"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Performs case management and analyst reviews"
    technology: "HTTPS (TLS 1.3)"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "AWS Audit & Compliance Store"
    description: "Saves audit logs for 7-year retention"
    technology: "HTTPS / S3 API"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Notification / Alerting Service"
    description: "Triggers notifications and alerts"
    technology: "API"
  - source: "Payment Processing Core / Acquirer"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Communicates payment and screening data securely"
    technology: "mTLS"