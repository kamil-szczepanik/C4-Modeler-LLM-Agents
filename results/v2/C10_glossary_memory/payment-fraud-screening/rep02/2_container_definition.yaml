level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Screens card-not-present payment authorizations for fraud in real-time while providing case management for analysts."
elements:
  - type: "person"
    name: "Fraud Analyst & Risk Operations Manager"
    description: "Internal users reviewing cases and updating rules."
  - type: "externalSystem"
    name: "Payment Gateway / Acquiring System"
    description: "External actor submitting authorization requests."
  - type: "externalSystem"
    name: "External Fraud Intelligence Feeds"
    description: "External sources providing risk data via webhooks."
  - type: "externalSystem"
    name: "AWS API Gateway / Envoy Proxy"
    description: "Edge layer handling mTLS termination and traffic routing."
  - type: "externalSystem"
    name: "AWS Cognito"
    description: "Managed Identity Provider handling OIDC/OAuth2 authentication and RBAC."
  - type: "externalSystem"
    name: "AWS S3 Object Lock"
    description: "Immutable storage backend configured in Compliance Mode for audit logging."
  - type: "externalSystem"
    name: "AWS KMS"
    description: "Cryptographic service managing envelope encryption and hardware-isolated keys."
  - type: "container"
    name: "Scoring Service Container"
    technology: "Go / AWS Fargate"
    description: "Guarantees predictable low memory footprint and sub-50ms P99 latency for real-time fraud scoring."
  - type: "container"
    name: "Case Management Container"
    technology: "Node.js / TypeScript / AWS Fargate"
    description: "Powers analyst workflows and UI rendering."
  - type: "container"
    name: "Amazon ElastiCache for Redis"
    technology: "in-memory cache"
    description: "Provides in-memory feature storage and hot rules caching for sub-millisecond lookups."
  - type: "container"
    name: "Amazon Aurora PostgreSQL Serverless v2"
    technology: "relational database"
    description: "Persists case management metadata and review actions securely."
relationships:
  - source: "Payment Gateway / Acquiring System"
    destination: "AWS API Gateway / Envoy Proxy"
    description: "Submits payment authorization requests"
    technology: "gRPC over mTLS"
  - source: "Fraud Analyst & Risk Operations Manager"
    destination: "AWS Cognito"
    description: "Authenticates to the web frontend"
    technology: "OIDC/OAuth2 over HTTPS/REST"
  - source: "AWS API Gateway / Envoy Proxy"
    destination: "Scoring Service Container"
    description: "Routes real-time payment authorization screening requests"
    technology: "gRPC"
  - source: "Scoring Service Container"
    destination: "Amazon ElastiCache for Redis"
    description: "Fetches in-memory features and hot rules"
    technology: "RESP over TLS"
  - source: "Scoring Service Container"
    destination: "AWS S3 Object Lock"
    description: "Archives scoring inputs and decisions"
    technology: "AWS SDK / HTTPS"
  - source: "Case Management Container"
    destination: "Amazon Aurora PostgreSQL Serverless v2"
    description: "Persists case management metadata and review actions"
    technology: "PostgreSQL wire protocol over TLS"
  - source: "External Fraud Intelligence Feeds"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Ingests risk data"
    technology: "HTTPS/REST webhooks"