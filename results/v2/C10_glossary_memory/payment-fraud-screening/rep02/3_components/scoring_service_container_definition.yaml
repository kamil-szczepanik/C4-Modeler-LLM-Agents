level: component
scope: "Component diagram for the Scoring Service Container container"
parentContainer:
  name: "Scoring Service Container"
elements:
  - type: "component"
    name: "API Handler Component"
    technology: "Go / AWS Fargate"
    description: "Handles incoming gRPC requests from the AWS API Gateway / Envoy Proxy and manages request validation."
  - type: "component"
    name: "Scoring Engine Component"
    technology: "Go / AWS Fargate"
    description: "Executes real-time fraud scoring algorithms and interacts with Amazon ElastiCache for Redis."
  - type: "component"
    name: "Audit Dispatcher Component"
    technology: "Go / AWS Fargate"
    description: "Dispatches audit logs and transaction details to AWS S3 Object Lock."
  - type: "component"
    name: "Circuit Breaker & Fallback Manager Component"
    technology: "Go / AWS Fargate"
    description: "Manages fault tolerance, circuit breaking, and fallback behaviors during high load or partial outages."
relationships:
  - source: "API Handler Component"
    destination: "Scoring Engine Component"
    description: "Invokes scoring logic"
  - source: "Scoring Engine Component"
    destination: "Audit Dispatcher Component"
    description: "Triggers audit log dispatch"
  - source: "API Handler Component"
    destination: "Circuit Breaker & Fallback Manager Component"
    description: "Monitors execution health"