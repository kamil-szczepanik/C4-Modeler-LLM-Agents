level: context
scope: "System Context diagram for Real-time Payment Fraud Screening Platform"
system:
  name: "Real-time Payment Fraud Screening Platform"
  description: "A real-time payment fraud screening platform that evaluates card-not-present transactions, provides case management for fraud analysts, blocks fraudulent transactions, and maintains immutable audit logs while complying with PCI-DSS Level 1."
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Evaluates flagged transactions and manages cases."
  - type: "person"
    name: "Risk Operations Manager / Data Scientist"
    description: "Manages rules, models, and overall risk operations."
  - type: "externalSystem"
    name: "Payment Processor / Merchant Systems"
    description: "External customer systems sending transaction data."
  - type: "externalSystem"
    name: "Payment Gateway / Processor Core"
    description: "Core payment gateway routing authorization requests."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Provides authentication and OIDC services."
relationships:
  - source: "Payment Processor / Merchant Systems"
    destination: "Real-time Payment Fraud Screening Platform"
    description: "Submits card-not-present transactions for evaluation"
    technology: "REST / gRPC"
  - source: "Fraud Analyst"
    destination: "Real-time Payment Fraud Screening Platform"
    description: "Accesses case management for fraud review"
    technology: "HTTPS / OIDC"
  - source: "Payment Gateway / Processor Core"
    destination: "Real-time Payment Fraud Screening Platform"
    description: "Requests real-time fraud scoring"
    technology: "gRPC / mTLS"