level: container
scope: "Container diagram for Real-time Payment Fraud Screening Platform"
system:
  name: "Real-time Payment Fraud Screening Platform"
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Evaluates flagged transactions and manages cases."
  - type: "externalSystem"
    name: "Payment Gateway / Processor Core"
    description: "Core payment gateway routing authorization requests."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Provides authentication and OIDC services."
  - type: "container"
    name: "Fraud Scoring API"
    technology: "Go, Embedded ONNX runtime"
    description: "Screens card-not-present payment authorizations for fraud in real-time."
  - type: "container"
    name: "Case Management Backend"
    technology: "Node.js"
    description: "Provides backend services for fraud analyst workflows and case management."
  - type: "container"
    name: "Case Management UI"
    technology: "React"
    description: "Provides a user interface for fraud analysts reviewing suspicious payments."
  - type: "container"
    name: "Audit & Event Store"
    technology: "AWS Aurora PostgreSQL"
    description: "Provides tamper-evident, 7-year append-only audit data retention."
relationships:
  - source: "Payment Gateway / Processor Core"
    destination: "Fraud Scoring API"
    description: "Requests real-time fraud scoring"
    technology: "gRPC / mTLS"
  - source: "Fraud Analyst"
    destination: "Case Management UI"
    description: "Accesses case management for fraud review"
    technology: "HTTPS / OIDC"
  - source: "Fraud Scoring API"
    destination: "Audit & Event Store"
    description: "Persists audit events and logs"
    technology: "TCP/TLS"
  - source: "Case Management Backend"
    destination: "Audit & Event Store"
    description: "Persists case data and audit logs"
    technology: "TCP/TLS"
  - source: "Case Management UI"
    destination: "Case Management Backend"
    description: "Sends API requests for case management workflows"
    technology: "HTTPS"