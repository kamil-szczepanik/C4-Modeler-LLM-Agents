level: component
scope: "Component diagram for the Case Management Backend container"
parentContainer:
  name: "Case Management Backend"
elements:
  - type: "component"
    name: "API Router / Controller"
    technology: "Node.js with Express"
    description: "Routes API requests for case workflows and validates JWTs."
  - type: "component"
    name: "Case Service"
    technology: "Node.js"
    description: "Handles case workflows and business logic."
  - type: "component"
    name: "Case Analytics & Metrics Service"
    technology: "Node.js"
    description: "Requests KPI reports and queries historical case data."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Node.js"
    description: "Maintains tamper-evident audit logs."
relationships:
  - source: "API Router / Controller"
    destination: "Case Service"
    description: "Routes case workflows [Internal]"
  - source: "API Router / Controller"
    destination: "Case Analytics & Metrics Service"
    description: "Requests KPI reports [Internal]"