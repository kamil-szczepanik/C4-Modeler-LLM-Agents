level: component
scope: "Component diagram for the Audit & Event Store container"
parentContainer:
  name: "Audit & Event Store"
elements:
  - type: "component"
    name: "Event Ingestion Service"
    technology: "Go, AWS ECS Fargate, gRPC, mTLS"
    description: "Receives audit events via gRPC/mTLS and validates schemas."
  - type: "component"
    name: "Relational Ledger Store"
    technology: "AWS Aurora PostgreSQL, pg_audit"
    description: "Stores hot audit data with pg_audit enabled for 90 days."
  - type: "component"
    name: "Archival Worker"
    technology: "AWS Lambda, Python"
    description: "Periodically archives historical data to long-term storage."
  - type: "component"
    name: "S3 Glacier Object Lock Bucket"
    technology: "AWS S3, Object Lock"
    description: "Provides WORM (Write-Once-Read-Many) storage for 7-year regulatory retention."
  - type: "component"
    name: "Network Load Balancer"
    technology: "AWS NLB"
    description: "Routes high-throughput internal traffic to ingestion tasks."
  - type: "component"
    name: "AWS Secrets Manager / IAM"
    technology: "AWS Secrets Manager, IAM"
    description: "Manages dynamic credentials and database authentication."
relationships:
  - source: "Fraud Scoring API"
    destination: "Event Ingestion Service"
    description: "Sends audit events [gRPC/mTLS]"
  - source: "Case Management Backend"
    destination: "Event Ingestion Service"
    description: "Sends audit events [gRPC/mTLS]"
  - source: "Event Ingestion Service"
    destination: "Relational Ledger Store"
    description: "Persists hot audit data [SQL/TLS]"
  - source: "Archival Worker"
    destination: "Relational Ledger Store"
    description: "Queries historical data [SQL/TLS]"
  - source: "Archival Worker"
    destination: "S3 Glacier Object Lock Bucket"
    description: "Archives historical data [HTTPS/TLS]"