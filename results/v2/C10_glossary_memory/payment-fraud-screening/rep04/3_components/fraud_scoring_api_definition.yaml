level: component
scope: "Component diagram for the Fraud Scoring API container"
parentContainer:
  name: "Fraud Scoring API"
elements:
  - type: "component"
    name: "API Router & Validator"
    technology: "Go"
    description: "Routes incoming requests and validates payloads."
  - type: "component"
    name: "Feature Assembler"
    technology: "Go"
    description: "Assembles the feature vector required for inference."
  - type: "component"
    name: "Inference Engine"
    technology: "Go, Embedded ONNX Runtime"
    description: "Executes machine learning models locally in-process to score transactions."
  - type: "component"
    name: "Audit Dispatcher"
    technology: "Go"
    description: "Emits scoring results, explanations, and model versions asynchronously."
relationships:
  - source: "API Router & Validator"
    destination: "Feature Assembler"
    description: "Passes sanitized request and correlation ID [Go method call]"
  - source: "Feature Assembler"
    destination: "Inference Engine"
    description: "Passes assembled feature vector [Go method call]"
  - source: "Inference Engine"
    destination: "Audit Dispatcher"
    description: "Emits scoring result, explanation, and model version [Go channel / async]"