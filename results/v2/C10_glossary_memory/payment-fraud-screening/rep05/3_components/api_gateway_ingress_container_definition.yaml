level: component
scope: "Component diagram for the API Gateway / Ingress Container container"
parentContainer:
  name: "API Gateway / Ingress Container"
elements:
  - type: "component"
    name: "Ingress Router"
    technology: "AWS API Gateway / HTTP API"
    description: "Handles incoming HTTP/gRPC requests, ingress routing, and perimeter defense."
  - type: "component"
    name: "Authentication Validator"
    technology: "OAuth2 / SAML, mTLS"
    description: "Validates incoming tokens and handles authentication via the Identity Provider."
  - type: "component"
    name: "Token Resolution Handler"
    technology: "HTTPS via mTLS"
    description: "Performs token resolution with Card Networks / Tokenization Vault."
  - type: "component"
    name: "Fraud Routing Client"
    technology: "gRPC over AWS VPC internal networks via mTLS"
    description: "Routes real-time authorization requests to the Fraud Scoring Engine Container."
relationships:
  - source: "Ingress Router"
    destination: "Authentication Validator"
    description: "Validates request authentication"
  - source: "Ingress Router"
    destination: "Token Resolution Handler"
    description: "Resolves card tokens"
  - source: "Ingress Router"
    destination: "Fraud Routing Client"
    description: "Forwards requests for fraud evaluation"