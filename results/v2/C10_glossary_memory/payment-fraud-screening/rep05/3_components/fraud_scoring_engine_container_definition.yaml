level: component
scope: "Component diagram for the Fraud Scoring Engine Container container"
parentContainer:
  name: "Fraud Scoring Engine Container"
elements:
  - type: "component"
    name: "Ingress Router Component"
    technology: "Go / Rust"
    description: "Routes incoming authorization requests and handles initial protocol parsing."
  - type: "component"
    name: "Feature Aggregator Component"
    technology: "Go / Rust"
    description: "Fetches user and device features from the caching layer for real-time evaluation."
  - type: "component"
    name: "Execution & Scoring Component"
    technology: "Go / Rust"
    description: "Evaluates scoring rules and ML models to deliver sub-50ms fraud decisions."
  - type: "component"
    name: "Audit & Persistence Dispatcher Component"
    technology: "Go / Rust"
    description: "Dispatches transactional and audit data to the database storage asynchronously."
  - type: "component"
    name: "Fallback Circuit Breaker Component"
    technology: "Go / Rust"
    description: "Provides robust fallback mechanisms to ensure high availability during partial failures."
relationships:
  - source: "Ingress Router Component"
    destination: "Feature Aggregator Component"
    description: "Forwards parsed transactions to gather features"
  - source: "Feature Aggregator Component"
    destination: "Execution & Scoring Component"
    description: "Provides aggregated features for scoring"
  - source: "Execution & Scoring Component"
    destination: "Audit & Persistence Dispatcher Component"
    description: "Sends scoring results for persistence"
  - source: "Fallback Circuit Breaker Component"
    destination: "Execution & Scoring Component"
    description: "Monitors and intercepts calls to handle faults"