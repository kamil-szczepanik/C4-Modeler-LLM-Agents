level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Payment Merchants / End Consumers"
    description: "External users initiating transactions."
  - type: "person"
    name: "Fraud Analysts & Risk/Compliance Officers"
    description: "Internal personnel reviewing flagged cases and ensuring regulatory compliance."
  - type: "person"
    name: "Risk / Data Scientists"
    description: "Internal users updating fraud rules and ML models."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "External system submitting authorization requests."
  - type: "externalSystem"
    name: "Card Networks / Tokenization Vault"
    description: "External provider supplying tokenized card data."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system managing OAuth2/SAML authentication."
  - type: "container"
    name: "API Gateway / Ingress Container"
    technology: "AWS API Gateway or Envoy"
    description: "Handles incoming HTTP/gRPC requests and ingress routing."
  - type: "container"
    name: "Fraud Scoring Engine Container"
    technology: "Go or Rust"
    description: "Evaluates transactions and delivers sub-50ms fraud decisions."
  - type: "container"
    name: "Case Management Container"
    technology: "Node.js/Python + React SPA on Amazon S3 / CloudFront"
    description: "Provides a secure case management interface for fraud analysts."
  - type: "container"
    name: "Model Registry Container"
    technology: "MLflow on Amazon ECS"
    description: "Manages zero-downtime model and rule updates."
  - type: "container"
    name: "Database & Storage"
    technology: "Amazon Aurora Serverless v2"
    description: "Stores transactional and audit data with append-only tables and immutable cryptographic triggers."
  - type: "container"
    name: "Caching Layer"
    technology: "Amazon ElastiCache with Redis OSS"
    description: "Provides low-latency feature lookups and rate limiting."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "API Gateway / Ingress Container"
    description: "Submits real-time authorization requests"
    technology: "HTTPS / gRPC"
  - source: "Fraud Analysts & Risk/Compliance Officers"
    destination: "Case Management Container"
    description: "Reviews flagged cases via the Case Management UI"
    technology: "HTTPS via TLS 1.3"
  - source: "API Gateway / Ingress Container"
    destination: "Card Networks / Tokenization Vault"
    description: "Performs token resolution"
    technology: "HTTPS via mTLS"
  - source: "API Gateway / Ingress Container"
    destination: "Identity Provider (IdP)"
    description: "Handles authentication"
    technology: "HTTPS via mTLS / OAuth2/SAML"
  - source: "Fraud Scoring Engine Container"
    destination: "Identity Provider (IdP)"
    description: "Handles authentication"
    technology: "HTTPS via mTLS / OAuth2/SAML"
  - source: "Case Management Container"
    destination: "Identity Provider (IdP)"
    description: "Handles authentication"
    technology: "HTTPS via mTLS / OAuth2/SAML"
  - source: "Model Registry Container"
    destination: "Identity Provider (IdP)"
    description: "Handles authentication"
    technology: "HTTPS via mTLS / OAuth2/SAML"
  - source: "API Gateway / Ingress Container"
    destination: "Fraud Scoring Engine Container"
    description: "Routes requests for fraud evaluation"
    technology: "gRPC over AWS VPC internal networks via mTLS"
  - source: "Fraud Scoring Engine Container"
    destination: "Caching Layer"
    description: "Performs low-latency feature lookups"
    technology: "Redis OSS Protocol"
  - source: "Fraud Scoring Engine Container"
    destination: "Database & Storage"
    description: "Persists transaction and audit data"
    technology: "PostgreSQL Wire Protocol"
  - source: "Case Management Container"
    destination: "Database & Storage"
    description: "Reads and updates case data"
    technology: "PostgreSQL Wire Protocol"
  - source: "Model Registry Container"
    destination: "Fraud Scoring Engine Container"
    description: "Provides zero-downtime model and rule updates"
    technology: "S3 memory caching"
  - source: "Risk / Data Scientists"
    destination: "Model Registry Container"
    description: "Updates fraud rules and ML models"
    technology: "HTTPS / AWS IAM"