level: component
scope: "Component diagram for the Claim Router & Integration Worker container"
parentContainer:
  name: "Claim Router & Integration Worker"
elements:
  - type: "component"
    name: "Routing Engine Component"
    technology: ".NET class library"
    description: "Handles dynamic routing rules and claim type migration logic."
  - type: "component"
    name: "Mainframe Adapter Component"
    technology: ".NET HttpClient/gRPC"
    description: "Interfaces with the legacy mainframe system using secure mTLS and signed JWT."
  - type: "component"
    name: "Outbox Processor Component"
    technology: ".NET Hosted Service"
    description: "Ensures zero data loss and supports rapid rollbacks through an outbox pattern."
  - type: "component"
    name: "Audit & Telemetry Component"
    technology: "Application Insights"
    description: "Provides monitoring and telemetry for the integration worker."
  - type: "container"
    name: "Azure Service Bus"
    technology: "Azure Messaging Service"
    description: "Manages messaging, backpressure, and reliable queueing to prevent duplicate or lost claims."
  - type: "container"
    name: "Legacy Mainframe System"
    technology: "On-premises DB2/COBOL"
    description: "System of record for legacy claims data."
  - type: "container"
    name: "Azure Key Vault"
    technology: "Secret Management"
    description: "Secures sensitive mTLS certificates and signing keys using managed identities."
  - type: "container"
    name: "Claims Core API Service"
    technology: "Modular Monolith/.NET"
    description: "Core API service handling business logic and data processing."
relationships:
  - source: "Claim Router & Integration Worker"
    destination: "Azure Service Bus"
    description: "AMQP"
  - source: "Claim Router & Integration Worker"
    destination: "Legacy Mainframe System"
    description: "mTLS and signed JWT over hybrid IPsec VPN"
  - source: "Claim Router & Integration Worker"
    destination: "Azure Key Vault"
    description: "HTTPS/Managed Identity"
  - source: "Routing Engine Component"
    destination: "Claims Core API Service"
    description: "HTTPS/SQL"