level: component
scope: "Component diagram for the Azure Service Bus container"
parentContainer:
  name: "Azure Service Bus"
elements:
  - type: "component"
    name: "Topic Router Component"
    technology: "Azure Service Bus Topic / Routing Logic"
    description: "Routes incoming claim messages to appropriate subscriptions and integrates with downstream workers."
  - type: "component"
    name: "Session Manager Component"
    technology: "Azure Service Bus Sessions"
    description: "Manages ordered session-based message processing for claims."
  - type: "component"
    name: "Dead-Letter Monitor Component"
    technology: "Azure Service Bus DLQ Monitoring"
    description: "Monitors and processes failed or poisoned claim messages."
  - type: "component"
    name: "Claim Message Schema Registry Component"
    technology: "Azure Service Bus Schema Validation"
    description: "Validates and ensures claim message conformance against defined schemas."
  - type: "component"
    name: "Backpressure & Throttling Controller Component"
    technology: "Azure Service Bus Flow Control"
    description: "Manages rate-limiting and backpressure to protect downstream legacy systems."
relationships:
  - source: "Claims Core API Service"
    destination: "Claim Message Schema Registry Component"
    description: "Validates claim messages (AMQP)"
  - source: "Claim Message Schema Registry Component"
    destination: "Topic Router Component"
    description: "Forwards validated messages (Internal memory/pipelining)"
  - source: "Topic Router Component"
    destination: "Claim Router & Integration Worker"
    description: "Dispatches messages (AMQP via Azure Service Bus Subscriptions)"
  - source: "Topic Router Component"
    destination: "Session Manager Component"
    description: "Manages session routing (AMQP)"
  - source: "Session Manager Component"
    destination: "Claim Router & Integration Worker"
    description: "Processes ordered messages (AMQP)"