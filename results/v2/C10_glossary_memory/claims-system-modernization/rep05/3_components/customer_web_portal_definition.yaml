level: component
scope: "Component diagram for the Customer Web Portal container"
parentContainer:
  name: "Customer Web Portal"
elements:
  - type: "component"
    name: "Authentication Component"
    technology: "TypeScript / MSAL.js"
    description: "Implements authentication flows with OIDC/SAML protocols, securing user sessions via a BFF pattern."
  - type: "component"
    name: "Claim Submission Form Component"
    technology: "React / Formik"
    description: "Provides dynamic UI for users to input and submit claim payloads."
  - type: "component"
    name: "Claim Status & Dashboard Component"
    technology: "React"
    description: "Displays claim statuses and dashboard metrics, adapting dynamically to support gradual claim type migrations."
  - type: "component"
    name: "API Gateway Client Component"
    technology: "Axios / Fetch"
    description: "Handles outbound HTTP/REST requests to backend services."
  - type: "component"
    name: "Resilience & Fallback Component"
    technology: "TypeScript / React"
    description: "Ensures UI resilience and handles fallback states during errors or latency."
  - type: "component"
    name: "Azure Application Insights"
    technology: "Azure Application Insights"
    description: "Provides real user monitoring (RUM) and synthetic transaction logging."
  - type: "component"
    name: "Corporate Active Directory / Entra ID"
    technology: "OIDC / SAML"
    description: "Identity Provider used for user authentication."
  - type: "component"
    name: "Claims Core API Service"
    technology: "Modular Monolith / .NET"
    description: "Core API service handling business logic and data processing via BFF."
  - type: "component"
    name: "End Customers and Brokers"
    technology: "Person"
    description: "Web users who submit and manage claims."
relationships:
  - source: "End Customers and Brokers"
    destination: "Customer Web Portal"
    description: "Accesses portal UI [HTTPS/REST]"
  - source: "Customer Web Portal"
    destination: "Corporate Active Directory / Entra ID"
    description: "Authenticates users [OIDC/SAML]"
  - source: "Claim Submission Form Component"
    destination: "API Gateway Client Component"
    description: "Sends claim payload [HTTPS/REST]"
  - source: "API Gateway Client Component"
    destination: "Azure Application Insights"
    description: "Tracks frontend performance and errors [RUM/Telemetry]"
  - source: "Customer Web Portal"
    destination: "Claims Core API Service"
    description: "Submits and retrieves claim data via BFF [HTTPS/REST]"