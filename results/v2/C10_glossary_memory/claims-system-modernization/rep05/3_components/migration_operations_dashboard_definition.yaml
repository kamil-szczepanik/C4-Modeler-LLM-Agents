level: component
scope: "Component diagram for the Migration Operations Dashboard container"
parentContainer:
  name: "Migration Operations Dashboard"
elements:
  - type: "component"
    name: "Migration Dashboard UI"
    technology: "ASP.NET Core Razor Pages / Blazor"
    description: "Provides the web interface for migration operations managers to oversee and control the gradual claim-type migration process."
  - type: "component"
    name: "Migration Control API"
    technology: "ASP.NET Core Web API"
    description: "Exposes secure endpoints for managing migration states, feature flags, and viewing audit logs."
  - type: "component"
    name: "Migration Audit Service"
    technology: ".NET Class Library"
    description: "Handles tracking, validation, and reporting of claim migration progress and rollback operations."
relationships:
  - source: "Migration Dashboard UI"
    destination: "Migration Control API"
    description: "Calls REST endpoints for status and control actions [HTTPS/REST, JWT]"
  - source: "Migration Control API"
    destination: "Migration Audit Service"
    description: "Invokes business logic for tracking and auditing migration events"