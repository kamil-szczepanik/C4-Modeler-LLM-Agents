level: component
scope: "Component diagram for the Claims Core API Service container"
parentContainer:
  name: "Claims Core API Service"
elements:
  - type: "component"
    name: "Claim Submission Controller"
    technology: ".NET Controller"
    description: "Handles incoming HTTP/REST requests for claim submissions from the client applications."
  - type: "component"
    name: "Claims Domain Service"
    technology: ".NET Modular Monolith Service"
    description: "Encapsulates core business logic, validation, and orchestration for claims processing."
  - type: "component"
    name: "Claim Data Access Repository"
    technology: "Entity Framework Core / Azure SQL"
    description: "Manages local read models and persistence for sub-2-second adjuster response times."
  - type: "component"
    name: "Messaging Publisher"
    technology: ".NET Client Library / AMQP"
    description: "Publishes asynchronous integration events and messages to Azure Service Bus."
relationships:
  - source: "Claim Submission Controller"
    destination: "Claims Domain Service"
    description: "Invokes business logic"
  - source: "Claims Domain Service"
    destination: "Claim Data Access Repository"
    description: "Reads and writes claim data"
  - source: "Claims Domain Service"
    destination: "Messaging Publisher"
    description: "Triggers asynchronous events"
  - source: "Messaging Publisher"
    destination: "Azure Service Bus"
    description: "Publishes messages via AMQP"