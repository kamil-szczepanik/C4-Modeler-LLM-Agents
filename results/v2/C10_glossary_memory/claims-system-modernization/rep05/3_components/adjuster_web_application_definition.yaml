level: component
scope: "Component diagram for the Adjuster Web Application container"
parentContainer:
  name: "Adjuster Web Application"
elements:
  - type: "component"
    name: "Claims Adjusters"
    technology: "Person"
    description: "Internal web users responsible for claim handling."
  - type: "component"
    name: "Adjuster UI"
    technology: "SPA/React"
    description: "Provides responsive adjuster screens with optimistic updates."
  - type: "component"
    name: "Claim Handling API"
    technology: "ASP.NET Core"
    description: "Powers the modular monolith backend API."
  - type: "component"
    name: "Claim Context & Routing Component"
    technology: ".NET Component"
    description: "Evaluates routing and feature flags for rapid claim type rollbacks."
  - type: "component"
    name: "Mainframe Abstraction Layer"
    technology: ".NET Component"
    description: "Fetches fallback data and insulates user screens from slow legacy mainframe responses."
  - type: "component"
    name: "Corporate Active Directory / Entra ID"
    technology: "External System"
    description: "Identity Provider used for user authentication."
  - type: "component"
    name: "Claims Core API Service"
    technology: "Container"
    description: "Core API service handling business logic and data processing."
relationships:
  - source: "Claims Adjusters"
    destination: "Adjuster UI"
    description: "Manage claims [HTTPS/REST]"
  - source: "Adjuster UI"
    destination: "Claim Handling API"
    description: "Invoke workflows [HTTPS/REST]"
  - source: "Claim Handling API"
    destination: "Claim Context & Routing Component"
    description: "Evaluate routing [In-Memory]"
  - source: "Claim Context & Routing Component"
    destination: "Mainframe Abstraction Layer"
    description: "Fetch fallback data [In-Memory]"
  - source: "Claim Handling API"
    destination: "Corporate Active Directory / Entra ID"
    description: "Authenticate users [OIDC/OAuth 2.0]"