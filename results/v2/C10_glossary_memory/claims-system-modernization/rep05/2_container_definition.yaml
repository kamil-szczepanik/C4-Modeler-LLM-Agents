level: container
scope: "Container diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
elements:
  - type: "person"
    name: "End Customers and Brokers"
    description: "Web users who submit and manage claims."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal web users responsible for claim handling."
  - type: "person"
    name: "Migration Operations Managers"
    description: "Internal users managing claim type migration and dashboard operations."
  - type: "externalSystem"
    name: "Legacy Mainframe System"
    description: "On-premises DB2/COBOL system of record for legacy claims data."
  - type: "externalSystem"
    name: "Corporate Active Directory / Entra ID"
    description: "Identity Provider used for user authentication."
  - type: "externalSystem"
    name: "Integration Middleware / API Gateway"
    description: "Azure Service Bus and Azure Functions facilitating integration and secure messaging."
  - type: "container"
    name: "Customer Web Portal"
    technology: "SPA/React"
    description: "Web portal allowing end customers and brokers to submit and manage claims."
  - type: "container"
    name: "Adjuster Web Application"
    technology: "Modular Monolith/.NET"
    description: "Web application used by claims adjusters for claim handling."
  - type: "container"
    name: "Migration Operations Dashboard"
    technology: "Web App/.NET"
    description: "Dashboard for migration operations managers to oversee gradual claim type migration."
  - type: "container"
    name: "Claims Core API Service"
    technology: "Modular Monolith/.NET"
    description: "Core API service handling business logic and data processing."
  - type: "container"
    name: "Claim Router & Integration Worker"
    technology: ".NET Worker Service"
    description: "Asynchronous worker service for routing claims and integrating with the legacy mainframe."
  - type: "container"
    name: "Azure Service Bus"
    technology: "Azure Messaging Service"
    description: "Manages messaging, backpressure, dead-letter queues, and rate-limiting."
relationships:
  - source: "End Customers and Brokers"
    destination: "Customer Web Portal"
    description: "Submit and manage claims"
    technology: "HTTPS/REST"
  - source: "Claims Adjusters"
    destination: "Adjuster Web Application"
    description: "Handle claims"
    technology: "HTTPS/REST"
  - source: "Migration Operations Managers"
    destination: "Migration Operations Dashboard"
    description: "Monitor migration operations"
    technology: "HTTPS/REST"
  - source: "Customer Web Portal"
    destination: "Corporate Active Directory / Entra ID"
    description: "Authenticates users"
    technology: "OIDC/SAML"
  - source: "Adjuster Web Application"
    destination: "Corporate Active Directory / Entra ID"
    description: "Authenticates users"
    technology: "OIDC/SAML"
  - source: "Migration Operations Dashboard"
    destination: "Corporate Active Directory / Entra ID"
    description: "Authenticates users"
    technology: "OIDC/SAML"
  - source: "Claim Router & Integration Worker"
    destination: "Legacy Mainframe System"
    description: "Routes claims and synchronizes data"
    technology: "mTLS/VPN and signed JWT"
  - source: "Claims Core API Service"
    destination: "Azure Service Bus"
    description: "Sends and receives asynchronous messages"
    technology: "AMQP"