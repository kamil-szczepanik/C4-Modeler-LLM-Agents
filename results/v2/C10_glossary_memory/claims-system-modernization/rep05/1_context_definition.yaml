level: context
scope: "System Context diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
  description: "A cloud-based web application modernizing a regional insurer's legacy COBOL/DB2 mainframe claims platform for customers and adjusters, ensuring business continuity via a hybrid architecture."
elements:
  - type: "person"
    name: "End Customers and Brokers"
    description: "Web users who submit and manage claims."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal web users responsible for claim handling."
  - type: "externalSystem"
    name: "Legacy Mainframe System"
    description: "On-premises DB2/COBOL system of record for legacy claims data."
  - type: "externalSystem"
    name: "Corporate Active Directory / Entra ID"
    description: "Identity Provider used for user authentication."
  - type: "externalSystem"
    name: "Integration Middleware / API Gateway"
    description: "Azure Service Bus and Azure Functions facilitating integration and secure messaging."
relationships:
  - source: "End Customers and Brokers"
    destination: "Modern Claims Platform"
    description: "Interact for claim submission"
    technology: "HTTPS/REST"
  - source: "Claims Adjusters"
    destination: "Modern Claims Platform"
    description: "Interact for claim handling"
    technology: "HTTPS/REST"
  - source: "Modern Claims Platform"
    destination: "Corporate Active Directory / Entra ID"
    description: "Authenticates users"
    technology: "OIDC/SAML"
  - source: "Modern Claims Platform"
    destination: "Legacy Mainframe System"
    description: "Synchronizes data with legacy system"
    technology: "Secure message queues and APIs over hybrid IPsec VPN/ExpressRoute with mTLS"
  - source: "Modern Claims Platform"
    destination: "Integration Middleware / API Gateway"
    description: "Processes integration logic and asynchronous messaging"
    technology: "Azure Service Bus / Azure Functions"