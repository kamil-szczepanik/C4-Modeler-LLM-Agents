level: context
scope: "System Context diagram for New Claims Platform"
system:
  name: "New Claims Platform"
  description: "A hybrid architecture gradually modernizing a legacy regional insurance claims system by decoupling online submission and adjuster interfaces from an on-premise mainframe using managed Azure services and asynchronous integration patterns."
elements:
  - type: "person"
    name: "Customers & Brokers"
    description: "External users performing online claim submissions."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff handling web application claims processing."
  - type: "person"
    name: "Finance & Compliance Auditors"
    description: "Auditors reviewing financial and compliance data."
  - type: "externalSystem"
    name: "Azure Service Bus"
    description: "Asynchronous event queuing and message broker to buffer events and protect against the mainframe batch window."
  - type: "externalSystem"
    name: "Enterprise Service Bus / Integration Gateway"
    description: "On-premise integration gateway handling hybrid message transit."
  - type: "externalSystem"
    name: "Legacy Mainframe COBOL/DB2 System of Record"
    description: "On-premise legacy system of record for insurance claims data."
  - type: "externalSystem"
    name: "Insurer Active Directory"
    description: "On-premise directory service providing single sign-on and MFA."
relationships:
  - source: "Customers & Brokers"
    destination: "New Claims Platform"
    description: "Online claim submission"
    technology: "HTTPS / JSON"
  - source: "Claims Adjusters"
    destination: "New Claims Platform"
    description: "Web application handling"
    technology: "HTTPS / HTML"
  - source: "New Claims Platform"
    destination: "Azure Service Bus"
    description: "Asynchronous event queuing"
    technology: "AMQP / HTTPS"
  - source: "Azure Service Bus"
    destination: "Enterprise Service Bus / Integration Gateway"
    description: "Hybrid message transit"
    technology: "IPsec VPN / Azure ExpressRoute, TLS 1.3"
  - source: "Enterprise Service Bus / Integration Gateway"
    destination: "Legacy Mainframe COBOL/DB2 System of Record"
    description: "Gradual data synchronization"
    technology: "Managed File Transfer / MQ / APIs"
  - source: "New Claims Platform"
    destination: "Insurer Active Directory"
    description: "Single sign-on and MFA"
    technology: "OIDC / OAuth2 via Entra ID Connect"