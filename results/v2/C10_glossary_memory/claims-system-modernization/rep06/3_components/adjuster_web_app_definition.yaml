level: component
scope: "Component diagram for the Adjuster Web App container"
parentContainer:
  name: "Adjuster Web App"
elements:
  - type: "component"
    name: "UI Shell & Routing"
    technology: "React / TypeScript"
    description: "Delivers sub-2-second adjuster screen loads and manages frontend routing."
  - type: "component"
    name: "Claim Action Queue"
    technology: "React / TypeScript"
    description: "Displays modern claims processing queues for adjusters."
  - type: "component"
    name: "BFF Orchestrator Service / BFF Claim Controller"
    technology: "Node.js / Express / Zod / Joi"
    description: "Implements the Backend-For-Frontend pattern, isolating frontend from backend latency and validating JSON payloads."
  - type: "component"
    name: "Session & Token Manager"
    technology: "Node.js"
    description: "Manages authentication sessions and tokens via OIDC/OAuth2."
relationships:
  - source: "Claims Adjusters"
    destination: "UI Shell & Routing"
    description: "HTTPS / HTML"
  - source: "UI Shell & Routing"
    destination: "BFF Orchestrator Service / BFF Claim Controller"
    description: "HTTP / JSON"
  - source: "BFF Orchestrator Service / BFF Claim Controller"
    destination: "Claims Core API"
    description: "HTTPS / JSON"
  - source: "Session & Token Manager"
    destination: "Insurer Active Directory"
    description: "OIDC / OAuth2 via Azure Entra ID Connect"