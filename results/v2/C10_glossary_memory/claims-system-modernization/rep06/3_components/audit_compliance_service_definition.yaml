level: component
scope: "Component diagram for the Audit & Compliance Service container"
parentContainer:
  name: "Audit & Compliance Service"
elements:
  - type: "component"
    name: "Audit Event Consumer"
    technology: ".NET Isolated Azure Function Trigger"
    description: "Consumes audit events from the message broker and records them."
  - type: "component"
    name: "Compliance Rules Engine"
    technology: "C# Domain Component"
    description: "Evaluates compliance rules against audit and claims data."
  - type: "component"
    name: "Audit Query API"
    technology: "ASP.NET Core Functions HTTP Trigger"
    description: "Provides query endpoints for auditors to access audit logs."
  - type: "component"
    name: "Compliance Report Generator"
    technology: ".NET Timer Trigger Azure Function"
    description: "Periodically generates scheduled compliance reports."
  - type: "person"
    name: "Finance & Compliance Auditors"
    technology: "Human"
    description: "Auditors reviewing financial and compliance data."
  - type: "container"
    name: "Audit Data Store"
    technology: "Azure SQL Database Ledger with Read Replica"
    description: "Tamper-evident, cryptographically secure append-only audit tables."
  - type: "externalSystem"
    name: "Azure Service Bus"
    technology: "Azure Service Bus"
    description: "Asynchronous event queuing and message broker."
  - type: "externalSystem"
    name: "Insurer Active Directory"
    technology: "Active Directory / Azure Entra ID"
    description: "Directory service providing single sign-on and MFA."
  - type: "externalSystem"
    name: "Azure Monitor / Application Insights"
    technology: "Azure Monitor"
    description: "Monitoring and telemetry platform."
relationships:
  - source: "Finance & Compliance Auditors"
    destination: "Audit Query API"
    description: "HTTPS / JSON, Role-Based Access Control"
  - source: "Audit Event Consumer"
    destination: "Azure Service Bus"
    description: "AMQP"
  - source: "Audit Event Consumer"
    destination: "Audit Data Store"
    description: "TDS / TCP via Entity Framework Core"
  - source: "Compliance Rules Engine"
    destination: "Audit Data Store"
    description: "TDS / TCP via Entity Framework Core"
  - source: "Compliance Report Generator"
    destination: "Audit Data Store"
    description: "TDS / TCP (Ledger Read Replica)"
  - source: "Audit Query API"
    destination: "Audit Data Store"
    description: "TDS / TCP (Ledger Read Replica)"
  - source: "Audit & Compliance Service"
    destination: "Insurer Active Directory"
    description: "OIDC / OAuth2 via Azure Entra ID, Azure Managed Identity"
  - source: "Audit & Compliance Service"
    destination: "Azure Monitor / Application Insights"
    description: "HTTPS"