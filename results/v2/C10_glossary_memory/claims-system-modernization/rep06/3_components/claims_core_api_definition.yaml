level: component
scope: "Component diagram for the Claims Core API container"
parentContainer:
  name: "Claims Core API"
elements:
  - type: "component"
    name: "Claim Submission Component"
    technology: ".NET Core"
    description: "Handles incoming claim submissions and processes validation logic."
  - type: "component"
    name: "Claim Query & Routing Component"
    technology: ".NET Core"
    description: "Fetches optimized read models and handles query routing."
  - type: "component"
    name: "Fallback Orchestrator Component"
    technology: ".NET Core"
    description: "Orchestrates fallback mechanisms across the hybrid cloud-mainframe boundary using circuit breakers and resilience patterns."
  - type: "component"
    name: "Claim Admin & Metadata Component"
    technology: ".NET Core"
    description: "Manages administrative tasks and claim metadata operations."
relationships:
  - source: "Customer Portal App"
    destination: "Claims Core API"
    description: "Sends claim submissions [HTTPS / JSON]"
  - source: "Adjuster Web App"
    destination: "Claims Core API"
    description: "Fetches and updates claim data [HTTPS / JSON]"
  - source: "Claim Submission Component"
    destination: "Azure Service Bus"
    description: "Publishes new claim events [AMQP]"
  - source: "Claim Query & Routing Component"
    destination: "Claim Read Database"
    description: "Fetches optimized read models [TDS / TCP]"
  - source: "Claims Core API"
    destination: "Insurer Active Directory"
    description: "Authenticates requests [OIDC / OAuth2 via Entra ID Connect]"