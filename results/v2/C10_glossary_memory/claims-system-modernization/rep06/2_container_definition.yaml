level: container
scope: "Container diagram for New Claims Platform"
system:
  name: "New Claims Platform"
elements:
  - type: "person"
    name: "Customers & Brokers"
    description: "External users performing online claim submissions."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff handling web application claims processing."
  - type: "externalSystem"
    name: "Azure Service Bus"
    description: "Asynchronous event queuing and message broker to buffer events and protect against the mainframe batch window."
  - type: "externalSystem"
    name: "Enterprise Service Bus / Integration Gateway"
    description: "On-premise integration gateway handling hybrid message transit."
  - type: "externalSystem"
    name: "Legacy Mainframe COBOL/DB2 System of Record"
    description: "On-premise legacy system of record for insurance claims data."
  - type: "externalSystem"
    name: "Insurer Active Directory"
    description: "On-premise directory service providing single sign-on and MFA."
  - type: "container"
    name: "Customer Portal App"
    technology: "React/TypeScript, Azure Static Web Apps"
    description: "Allows customers and brokers to perform online claim submissions."
  - type: "container"
    name: "Adjuster Web App"
    technology: "React/Node.js BFF"
    description: "Web application for claims adjusters to process claims."
  - type: "container"
    name: "Claims Core API"
    technology: ".NET Core modular monolith, Azure Container Apps"
    description: "Core business logic and backend APIs for claim handling."
  - type: "container"
    name: "Integration Worker"
    technology: ".NET background service, Azure Container Apps"
    description: "Background worker service handling asynchronous integration processes."
  - type: "container"
    name: "Audit & Compliance Service"
    technology: "Azure Function"
    description: "Auditing service reviewing financial and compliance data."
  - type: "container"
    name: "Claim Read Database"
    technology: "Azure SQL Database"
    description: "Relational storage providing fast read performance with Transparent Data Encryption (TDE)."
relationships:
  - source: "Customers & Brokers"
    destination: "Customer Portal App"
    description: "Submits claims online"
    technology: "HTTPS / JSON"
  - source: "Claims Adjusters"
    destination: "Adjuster Web App"
    description: "Manages claims processing"
    technology: "HTTPS / HTML"
  - source: "Customer Portal App"
    destination: "Claims Core API"
    description: "Sends claim submissions"
    technology: "HTTPS / JSON"
  - source: "Adjuster Web App"
    destination: "Claims Core API"
    description: "Fetches and updates claim data"
    technology: "HTTPS / JSON"
  - source: "Claims Core API"
    destination: "Claim Read Database"
    description: "Reads and writes claim read data"
    technology: "TDS / TCP"
  - source: "Claims Core API"
    destination: "Azure Service Bus"
    description: "Publishes asynchronous events"
    technology: "AMQP"
  - source: "Integration Worker"
    destination: "Azure Service Bus"
    description: "Consumes and produces asynchronous messages"
    technology: "AMQP"
  - source: "Azure Service Bus"
    destination: "Enterprise Service Bus / Integration Gateway"
    description: "Transits messages across hybrid boundary"
    technology: "IPsec VPN / Azure ExpressRoute, TLS 1.3"
  - source: "Enterprise Service Bus / Integration Gateway"
    destination: "Legacy Mainframe COBOL/DB2 System of Record"
    description: "Synchronizes data with legacy system"
    technology: "Managed File Transfer / MQ / APIs"
  - source: "Customer Portal App"
    destination: "Insurer Active Directory"
    description: "Authenticates users"
    technology: "OIDC / OAuth2 via Azure Entra ID Connect"
  - source: "Adjuster Web App"
    destination: "Insurer Active Directory"
    description: "Authenticates adjusters"
    technology: "OIDC / OAuth2 via Azure Entra ID Connect"