level: container
scope: "Container diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization"
elements:
  - type: "person"
    name: "End Customers and Brokers"
    description: "External users who submit online claims and interact with the insurance platform."
  - type: "person"
    name: "Claims Adjusters and Claims Managers"
    description: "Internal staff who use adjuster workflows to manage and process claims."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise 30-year-old COBOL/DB2 system serving as the system of record."
  - type: "externalSystem"
    name: "Corporate Active Directory / Azure AD"
    description: "Identity Provider for authentication and Single Sign-On."
  - type: "externalSystem"
    name: "Analytics & Reporting System"
    description: "Azure Synapse / Power BI system for reporting and analytics."
  - type: "container"
    name: "Customer/Broker Portal"
    technology: "Azure App Service, React"
    description: "Public SPA and BFF for end customers and brokers to interact with the insurance platform."
  - type: "container"
    name: "Adjuster Workstation"
    technology: "Azure App Service, Angular"
    description: "Internal UI optimized for sub-2s loads used by claims adjusters and managers."
  - type: "container"
    name: "Integration & Routing Engine"
    technology: "Azure Service Bus, Azure Functions"
    description: "Handles asynchronous queuing, DLQ, and deduplication for claims routing."
  - type: "container"
    name: "Azure API Management Gateway"
    technology: "Azure API Management"
    description: "Gateway for rate-limiting, token validation, and mainframe protection."
  - type: "container"
    name: "Observability & Audit Logging"
    technology: "Azure Application Insights, Azure Cosmos DB"
    description: "Provides distributed tracing and state tracking across the platform."
  - type: "container"
    name: "Secret Management"
    technology: "Azure Key Vault"
    description: "Provides managed identities and automated rotation for secrets."
relationships:
  - source: "End Customers and Brokers"
    destination: "Customer/Broker Portal"
    description: "Submit and manage claims"
    technology: "HTTPS"
  - source: "Claims Adjusters and Claims Managers"
    destination: "Adjuster Workstation"
    description: "Manage and process claims workflows"
    technology: "HTTPS"
  - source: "Customer/Broker Portal"
    destination: "Integration & Routing Engine"
    description: "Route claim submissions and messages"
    technology: "HTTPS / AMQP"
  - source: "Adjuster Workstation"
    destination: "Integration & Routing Engine"
    description: "Route adjuster actions and messages"
    technology: "HTTPS / AMQP"
  - source: "Integration & Routing Engine"
    destination: "Azure API Management Gateway"
    description: "Forward routed traffic to backend interfaces"
    technology: "HTTPS"
  - source: "Azure API Management Gateway"
    destination: "Legacy Mainframe"
    description: "Secure data exchange and mainframe integration"
    technology: "Azure ExpressRoute, mTLS"
  - source: "Integration & Routing Engine"
    destination: "Analytics & Reporting System"
    description: "Stream event data for reporting"
    technology: "Azure Event Hubs, TLS 1.3"
  - source: "End Customers and Brokers"
    destination: "Corporate Active Directory / Azure AD"
    description: "Authentication and Single Sign-On"
    technology: "OAuth 2.0 / OIDC"
  - source: "Claims Adjusters and Claims Managers"
    destination: "Corporate Active Directory / Azure AD"
    description: "Authentication and Single Sign-On"
    technology: "OAuth 2.0 / OIDC"
  - source: "Customer/Broker Portal"
    destination: "Observability & Audit Logging"
    description: "Send telemetry and logs"
    technology: "HTTPS"
  - source: "Adjuster Workstation"
    destination: "Observability & Audit Logging"
    description: "Send telemetry and logs"
    technology: "HTTPS"
  - source: "Integration & Routing Engine"
    destination: "Observability & Audit Logging"
    description: "Send telemetry and logs"
    technology: "HTTPS"
  - source: "Azure API Management Gateway"
    destination: "Observability & Audit Logging"
    description: "Send telemetry and logs"
    technology: "HTTPS"
  - source: "Observability & Audit Logging"
    destination: "Observability & Audit Logging"
    description: "Internal state tracking"
    technology: "HTTPS"
  - source: "Secret Management"
    destination: "Observability & Audit Logging"
    description: "Send telemetry and logs"
    technology: "HTTPS"