level: component
scope: "Component diagram for the Adjuster Workstation container"
parentContainer:
  name: "Adjuster Workstation"
elements:
  - type: "component"
    name: "Adjuster UI Controller"
    technology: "Angular, Azure App Service"
    description: "Renders the internal UI optimized for sub-2s loads and handles user interactions for claims adjusters and managers."
  - type: "component"
    name: "Adjuster Session & Auth Handler"
    technology: "OAuth 2.0 / OIDC, Azure App Service"
    description: "Manages authentication and secure session tokens for claims adjusters communicating via Corporate Active Directory / Azure AD."
  - type: "component"
    name: "Local Read-Model Cache"
    technology: "Azure SQL Database"
    description: "Provides fast local caching of claim data to ensure sub-2s UI response times for the adjuster workstation."
relationships:
  - source: "Adjuster UI Controller"
    destination: "Local Read-Model Cache"
    description: "Queries cached claim data for rapid UI rendering [HTTPS]"
  - source: "Adjuster UI Controller"
    destination: "Adjuster Session & Auth Handler"
    description: "Authenticates user session [OAuth 2.0 / OIDC]"