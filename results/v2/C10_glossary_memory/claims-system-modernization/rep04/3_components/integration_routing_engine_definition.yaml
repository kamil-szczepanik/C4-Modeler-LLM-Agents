level: component
scope: "Component diagram for the Integration & Routing Engine container"
parentContainer:
  name: "Integration & Routing Engine"
elements:
  - type: "component"
    name: "Claim Router Component"
    technology: ".NET Isolated Azure Functions"
    description: "Routes claim submissions using Azure Functions."
  - type: "component"
    name: "Deduplication & State Component"
    technology: "Azure Cosmos DB"
    description: "Enforces idempotency and tracks state for deduplication."
  - type: "component"
    name: "Fallback Switch Component"
    technology: "Azure App Configuration"
    description: "Dynamically manages routing rules for the 1-day mainframe fallback."
  - type: "component"
    name: "Retry & DLQ Handler Component"
    technology: ".NET Azure Functions"
    description: "Manages asynchronous queuing, AMQP delivery, and Dead-Letter Queues."
relationships:
  - source: "Claim Router Component"
    destination: "Deduplication & State Component"
    description: "Checks state and enforces idempotency"
  - source: "Claim Router Component"
    destination: "Fallback Switch Component"
    description: "Evaluates fallback routing rules"
  - source: "Retry & DLQ Handler Component"
    destination: "Claim Router Component"
    description: "Retries failed claim routing"