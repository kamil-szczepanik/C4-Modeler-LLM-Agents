level: context
scope: "System Context diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization"
  description: "Gradually replaces a 30-year-old COBOL/DB2 mainframe claims system with a modern Azure platform while the legacy system remains the system of record."
elements:
  - type: "person"
    name: "End Customers and Brokers"
    description: "External users who submit online claims and interact with the insurance platform."
  - type: "person"
    name: "Claims Adjusters and Claims Managers"
    description: "Internal staff who use adjuster workflows to manage and process claims."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise 30-year-old COBOL/DB2 system serving as the system of record."
  - type: "externalSystem"
    name: "Corporate Active Directory / Azure AD"
    description: "Identity Provider for authentication and Single Sign-On."
  - type: "externalSystem"
    name: "Analytics & Reporting System"
    description: "Azure Synapse / Power BI system for reporting and analytics."
  - type: "container"
    name: "New Claims Platform"
    description: "Modern Azure platform hosting application services and databases for online claim submission and adjuster workflows."
    technology: "Azure App Service, Azure SQL"
  - type: "container"
    name: "Azure API Management (APM) Gateway"
    description: "Gateway for rate-limiting, token validation, and protecting fragile mainframe interfaces."
    technology: "Azure API Management"
relationships:
  - source: "End Customers and Brokers"
    destination: "New Claims Platform"
    description: "Online claim submission"
    technology: "HTTPS"
  - source: "Claims Adjusters and Claims Managers"
    destination: "New Claims Platform"
    description: "Web application access for adjuster workflows"
    technology: "HTTPS"
  - source: "New Claims Platform"
    destination: "Legacy Mainframe"
    description: "Data synchronization and legacy integration"
    technology: "Azure ExpressRoute, mTLS, and Azure API Management"
  - source: "New Claims Platform"
    destination: "Analytics & Reporting System"
    description: "Event streaming for reporting"
    technology: "Azure Event Hubs, TLS 1.3"
  - source: "End Customers and Brokers"
    destination: "Corporate Active Directory / Azure AD"
    description: "Authentication and Single Sign-On"
    technology: "OAuth 2.0 / OIDC"
  - source: "Claims Adjusters and Claims Managers"
    destination: "Corporate Active Directory / Azure AD"
    description: "Authentication and Single Sign-On"
    technology: "OAuth 2.0 / OIDC"