level: container
scope: "Container diagram for Insurance Claims Modernization platform"
system:
  name: "Insurance Claims Modernization platform"
elements:
  - type: "person"
    name: "Customers & Brokers"
    description: "External users performing online claim submissions."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users handling claims via the new web application."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise COBOL/DB2 system of record with a 3-year retention constraint."
  - type: "externalSystem"
    name: "Azure AD (Entra ID)"
    description: "Identity provider for Single Sign-On and RBAC."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External financial system for automated claim payouts."
  - type: "externalSystem"
    name: "Core Notification Service"
    description: "External system for automated SMS/email updates."
  - type: "externalSystem"
    name: "Enterprise Service Bus (ESB/MQ)"
    description: "Hybrid messaging intermediary for asynchronous decoupling."
  - type: "container"
    name: "Web Application"
    technology: "React / TypeScript & Next.js"
    description: "Powers responsive adjuster and customer web interfaces."
  - type: "container"
    name: "Customer Portal"
    technology: "React / TypeScript & Next.js"
    description: "Provides customer-facing interactions and claim submissions."
  - type: "container"
    name: "Claim Processing API"
    technology: "Azure Container Apps"
    description: "Handles core business logic for processing claims and orchestrating workflows."
  - type: "container"
    name: "Integration Gateway / ACL"
    technology: "Azure Container Apps"
    description: "Translates modern messages into legacy formats and interfaces with the mainframe."
  - type: "container"
    name: "Feature Flag / Migration Router"
    technology: "Azure Container Apps"
    description: "Routes requests dynamically to support the 3-year transition strategy."
  - type: "container"
    name: "Document & Audit Store"
    technology: "Azure Blob Storage & Azure Cosmos DB"
    description: "Provides secure, cloud-native document and audit data storage."
relationships:
  - source: "Customers & Brokers"
    destination: "Web Application"
    description: "Submit online claims and interact with portals"
    technology: "HTTPS (REST/GraphQL)"
  - source: "Customers & Brokers"
    destination: "Customer Portal"
    description: "Manage claim submissions"
    technology: "HTTPS (REST/GraphQL)"
  - source: "Claims Adjusters"
    destination: "Web Application"
    description: "Handle claims via web application UI"
    technology: "HTTPS"
  - source: "Web Application"
    destination: "Claim Processing API"
    description: "Sends API requests for claim operations"
    technology: "HTTPS (REST/GraphQL)"
  - source: "Customer Portal"
    destination: "Claim Processing API"
    description: "Sends API requests for claim portal operations"
    technology: "HTTPS (REST/GraphQL)"
  - source: "Claim Processing API"
    destination: "Feature Flag / Migration Router"
    description: "Evaluates migration routing rules"
    technology: "Internal gRPC / HTTPS"
  - source: "Claim Processing API"
    destination: "Integration Gateway / ACL"
    description: "Sends asynchronous messaging via Enterprise Service Bus"
    technology: "Asynchronous messaging via Enterprise Service Bus (ESB/MQ) over AMQP/MQTT with mTLS"
  - source: "Claim Processing API"
    destination: "Document & Audit Store"
    description: "Persists documents and audit data"
    technology: "HTTPS / TLS 1.3 (Azure SDK)"
  - source: "Integration Gateway / ACL"
    destination: "Legacy Mainframe"
    description: "Asynchronous data synchronization and queue transfers"
    technology: "Hybrid ESB/MQ connection"
  - source: "Web Application"
    destination: "Azure AD (Entra ID)"
    description: "Authenticate users and authorize access"
    technology: "OpenID Connect / OAuth 2.0 via HTTPS"
  - source: "Customer Portal"
    destination: "Azure AD (Entra ID)"
    description: "Authenticate users and authorize access"
    technology: "OpenID Connect / OAuth 2.0 via HTTPS"
  - source: "Claim Processing API"
    destination: "Payment Gateway"
    description: "Process automated claim payouts with idempotency tokens"
    technology: "HTTPS (REST with OAuth 2.0)"
  - source: "Claim Processing API"
    destination: "Core Notification Service"
    description: "Send automated SMS and email updates"
    technology: "Asynchronous Webhooks via Azure Event Grid (HTTPS)"