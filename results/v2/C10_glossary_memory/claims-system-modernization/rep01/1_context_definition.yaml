level: context
scope: "System Context diagram for Insurance Claims Modernization platform"
system:
  name: "Insurance Claims Modernization platform"
  description: "A hybrid cloud-native platform gradually replacing an on-premise mainframe system while ensuring continuous, zero-loss claim processing during a 3-year transition."
elements:
  - type: "person"
    name: "Customers & Brokers"
    description: "External users performing online claim submissions."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users handling claims via the new web application."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise COBOL/DB2 system of record with a 3-year retention constraint."
  - type: "externalSystem"
    name: "Azure AD (Entra ID)"
    description: "Identity provider for Single Sign-On and RBAC."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External financial system for automated claim payouts."
  - type: "externalSystem"
    name: "Core Notification Service"
    description: "External system for automated SMS/email updates."
  - type: "externalSystem"
    name: "Enterprise Service Bus (ESB/MQ)"
    description: "Hybrid messaging intermediary for asynchronous decoupling."
relationships:
  - source: "Customers & Brokers"
    destination: "Insurance Claims Modernization platform"
    description: "Submit online claims"
    technology: "HTTPS (REST/GraphQL)"
  - source: "Claims Adjusters"
    destination: "Insurance Claims Modernization platform"
    description: "Handle claims via web application UI"
    technology: "HTTPS"
  - source: "Insurance Claims Modernization platform"
    destination: "Legacy Mainframe"
    description: "Asynchronous data synchronization and queue transfers"
    technology: "ESB/MQ"
  - source: "Insurance Claims Modernization platform"
    destination: "Azure AD (Entra ID)"
    description: "Authenticate users and authorize access"
    technology: "OpenID Connect / OAuth 2.0 via HTTPS"
  - source: "Insurance Claims Modernization platform"
    destination: "Payment Gateway"
    description: "Process automated claim payouts with idempotency tokens"
    technology: "HTTPS (REST with OAuth 2.0)"
  - source: "Insurance Claims Modernization platform"
    destination: "Core Notification Service"
    description: "Send automated SMS and email updates"
    technology: "Asynchronous Webhooks via Azure Event Grid (HTTPS)"