level: component
scope: "Component diagram for the Customer Portal container"
parentContainer:
  name: "Customer Portal"
elements:
  - type: "component"
    name: "Claim Submission Controller"
    technology: "Next.js API Route / TypeScript"
    description: "Handles incoming online claim submissions and validation from customers and brokers."
  - type: "component"
    name: "Broker Dashboard Service"
    technology: "React / TypeScript"
    description: "Provides customer-facing interactions, submission tracking, and broker dashboards."
  - type: "component"
    name: "Authentication Client"
    technology: "NextAuth.js"
    description: "Manages OpenID Connect / OAuth 2.0 authentication flow with Azure AD."
relationships:
  - source: "Claim Submission Controller"
    destination: "Broker Dashboard Service"
    description: "Updates UI state"
  - source: "Authentication Client"
    destination: "Claim Submission Controller"
    description: "Provides security context"