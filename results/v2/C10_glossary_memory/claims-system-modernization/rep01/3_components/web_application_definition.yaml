level: component
scope: "Component diagram for the Web Application container"
parentContainer:
  name: "Web Application"
elements:
  - type: "component"
    name: "Web UI Router & BFF Controller"
    technology: "Next.js & React / TypeScript"
    description: "Handles server-side rendering, routing, and BFF logic for adjuster and customer web interfaces."
  - type: "component"
    name: "Authentication Client"
    technology: "OpenID Connect / OAuth 2.0 SDK"
    description: "Manages user authentication and token exchange with Azure AD (Entra ID)."
  - type: "component"
    name: "API Gateway Proxy"
    technology: "TypeScript / Axios with mTLS"
    description: "Forwards backend queries and operations to the Claim Processing API securely."
relationships:
  - source: "Web UI Router & BFF Controller"
    destination: "Authentication Client"
    description: "Authenticates users"
  - source: "Web UI Router & BFF Controller"
    destination: "API Gateway Proxy"
    description: "Forwards queries and operations"
  - source: "API Gateway Proxy"
    destination: "Claim Processing API"
    description: "Sends backend operations via HTTPS with mTLS"