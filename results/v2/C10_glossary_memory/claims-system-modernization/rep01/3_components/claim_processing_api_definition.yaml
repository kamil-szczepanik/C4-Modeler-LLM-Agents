level: component
scope: "Component diagram for the Claim Processing API container"
parentContainer:
  name: "Claim Processing API"
elements:
  - type: "component"
    name: "Claim Orchestrator Component"
    technology: ".NET 8 / MediatR"
    description: "Handles core business logic for processing claims and orchestrating workflows."
  - type: "component"
    name: "Payment & Notification Coordinator Component"
    technology: ".NET 8 / HTTP Client"
    description: "Coordinates payments and notifications with external systems."
  - type: "component"
    name: "Migration & Routing Client Component"
    technology: ".NET 8 / gRPC Client"
    description: "Client component for interacting with the migration router."
  - type: "component"
    name: "Data Persistence Component"
    technology: ".NET 8 / Azure Cosmos DB SDK"
    description: "Manages data persistence operations against Azure Cosmos DB."
  - type: "component"
    name: "Feature Flag / Migration Router"
    technology: "Azure Container Apps"
    description: "Routes requests dynamically to support the 3-year transition strategy."
  - type: "component"
    name: "Payment Gateway"
    technology: "External system"
    description: "External financial system for automated claim payouts."
  - type: "component"
    name: "Core Notification Service"
    technology: "External system"
    description: "External system for automated SMS/email updates."
  - type: "component"
    name: "Document & Audit Store"
    technology: "Azure Blob Storage & Azure Cosmos DB"
    description: "Provides secure, cloud-native document and audit data storage."
relationships:
  - source: "Claim Orchestrator Component"
    destination: "Migration & Routing Client Component"
    description: "In-memory MediatR dispatch"
  - source: "Migration & Routing Client Component"
    destination: "Feature Flag / Migration Router"
    description: "Internal gRPC"
  - source: "Payment & Notification Coordinator Component"
    destination: "Payment Gateway"
    description: "HTTPS with OAuth 2.0 and idempotency tokens"
  - source: "Payment & Notification Coordinator Component"
    destination: "Core Notification Service"
    description: "Asynchronous Webhooks via Azure Event Grid (HTTPS)"
  - source: "Data Persistence Component"
    destination: "Document & Audit Store"
    description: "HTTPS / TLS 1.3 via Azure Cosmos DB SDK"