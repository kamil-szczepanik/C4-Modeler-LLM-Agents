level: component
scope: "Component diagram for the Routing & Reconciliation Service container"
parentContainer:
  name: "Routing & Reconciliation Service"
elements:
  - type: "component"
    name: "Claim Router Component"
    technology: "C# / .NET Core / gRPC"
    description: "Routes claims between services and handles gRPC communication."
  - type: "component"
    name: "Reconciliation Engine Component"
    technology: "C# / .NET Core Worker Service"
    description: "Executes reconciliation processes to ensure zero data loss."
  - type: "component"
    name: "DLQ Manager Component"
    technology: "C# / .NET Core / Azure Service Bus SDK"
    description: "Manages dead-letter queues and failed message reprocessing."
  - type: "component"
    name: "Reconciliation Dashboard API Component"
    technology: "C# / .NET Core / ASP.NET Web API"
    description: "Provides APIs for the reconciliation dashboard."
  - type: "component"
    name: "Audit & State Store Component"
    technology: "Azure Cosmos DB, SQL API"
    description: "Persists immutable transaction logs and state data."
relationships:
  - source: "Claim Router Component"
    destination: "Audit & State Store Component"
    description: "HTTPS / Cosmos DB SQL API"
  - source: "Reconciliation Engine Component"
    destination: "Audit & State Store Component"
    description: "HTTPS / Cosmos DB SQL API"
  - source: "DLQ Manager Component"
    destination: "Audit & State Store Component"
    description: "HTTPS / Cosmos DB SQL API"
  - source: "Reconciliation Dashboard API Component"
    destination: "Audit & State Store Component"
    description: "HTTPS / Cosmos DB SQL API"