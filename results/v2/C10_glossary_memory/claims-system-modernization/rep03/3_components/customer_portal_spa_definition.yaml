level: component
scope: "Component diagram for the Customer Portal SPA container"
parentContainer:
  name: "Customer Portal SPA"
elements:
  - type: "component"
    name: "Customer Portal UI"
    technology: "React, TypeScript, Azure Static Web Apps"
    description: "Provides the user interface for customers and brokers to submit and track insurance claims."
  - type: "component"
    name: "Authentication Client"
    technology: "OpenID Connect / OAuth 2.0 Client"
    description: "Handles user authentication and token management with the Identity Provider."
  - type: "component"
    name: "API Integration Client"
    technology: "HTTPS REST/GraphQL Client"
    description: "Communicates securely with the API Gateway for claim submissions and status updates."
relationships:
  - source: "Customer Portal UI"
    destination: "Authentication Client"
    description: "Authenticates users via"
  - source: "Customer Portal UI"
    destination: "API Integration Client"
    description: "Sends API requests via"
  - source: "API Integration Client"
    destination: "API Gateway"
    description: "Makes HTTPS REST/GraphQL calls to"