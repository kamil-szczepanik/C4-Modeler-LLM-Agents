level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Rate Limiting Module"
    technology: "Azure API Management Policy"
    description: "Enforces rate limiting to protect backend services from excessive traffic."
  - type: "component"
    name: "JWT Validation Module"
    technology: "Azure API Management / JWKS"
    description: "Validates OAuth 2.0 JSON Web Tokens for incoming requests."
  - type: "component"
    name: "WAF & Security Module"
    technology: "Azure Web Application Firewall"
    description: "Inspects traffic for common web vulnerabilities and enforces security policies."
  - type: "component"
    name: "Error Mapping Module"
    technology: "Azure API Management Policy"
    description: "Maps backend errors to RFC 7807 standard problem details."
relationships:
  - source: "Rate Limiting Module"
    destination: "JWT Validation Module"
    description: "Passes filtered requests for token validation"
  - source: "JWT Validation Module"
    destination: "WAF & Security Module"
    description: "Forwards authenticated traffic to security inspection"
  - source: "WAF & Security Module"
    destination: "Error Mapping Module"
    description: "Routes processed requests and handles formatting errors"