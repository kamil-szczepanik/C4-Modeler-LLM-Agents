level: component
scope: "Component diagram for the Claims Processing Core & BFF container"
parentContainer:
  name: "Claims Processing Core & BFF"
elements:
  - type: "component"
    name: "Claims BFF Controller"
    technology: ".NET 8 Web API"
    description: "Handles frontend requests from the API Gateway, optimizing payloads and exposing REST/GraphQL endpoints for the Customer Portal SPA."
  - type: "component"
    name: "Claims Processing Engine"
    technology: ".NET 8 Worker Service"
    description: "Executes core business logic and workflows for processing insurance claims within Azure Kubernetes Service."
  - type: "component"
    name: "Notification Client"
    technology: ".NET 8 HTTP Client"
    description: "Integrates with the external Notification Service to send SMS and email alerts via SendGrid/Twilio."
  - type: "component"
    name: "Routing & Reconciliation Client"
    technology: ".NET 8 gRPC Client"
    description: "Communicates securely with the Routing & Reconciliation Service using internal gRPC over TLS 1.3."
relationships:
  - source: "Claims BFF Controller"
    destination: "Claims Processing Engine"
    description: "Delegates claims processing workflows"
  - source: "Claims Processing Engine"
    destination: "Notification Client"
    description: "Triggers notifications"
  - source: "Claims Processing Engine"
    destination: "Routing & Reconciliation Client"
    description: "Synchronizes claim state and routing data"