level: container
scope: "Container diagram for New Insurance Claims Platform"
system:
  name: "New Insurance Claims Platform"
elements:
  - type: "person"
    name: "Customers"
    description: "External users submitting claims online."
  - type: "person"
    name: "Brokers"
    description: "External users submitting claims on behalf of customers."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users managing and processing claims via the new web application."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise COBOL/DB2 system of record operating under a 3-year constraint."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Corporate Active Directory / Azure AD providing authentication services."
  - type: "externalSystem"
    name: "Notification Service"
    description: "SendGrid/Twilio external SMS/email provider for sending notifications."
  - type: "container"
    name: "Customer Portal SPA"
    technology: "Azure Static Web Apps, React/TypeScript"
    description: "Hosts the React/TypeScript Customer Portal SPA."
  - type: "container"
    name: "API Gateway"
    technology: "Azure API Management"
    description: "Enforces rate limiting, OAuth 2.0 token validation, and circuit breaking toward the mainframe."
  - type: "container"
    name: "Claims Processing Core & BFF"
    technology: "Azure Kubernetes Service"
    description: "Standardizes backend compute for claims processing and BFF to minimize operational overhead."
  - type: "container"
    name: "Routing & Reconciliation Service"
    technology: "Azure Kubernetes Service + Azure Cosmos DB"
    description: "Tracks claims state and reconciliation data for zero-loss guarantees and rapid fallbacks."
relationships:
  - source: "Customers"
    destination: "Customer Portal SPA"
    description: "Accesses portal to submit and manage claims"
    technology: "HTTPS/WSS"
  - source: "Brokers"
    destination: "Customer Portal SPA"
    description: "Accesses portal to submit claims on behalf of customers"
    technology: "HTTPS/WSS"
  - source: "Claims Adjusters"
    destination: "Customer Portal SPA"
    description: "Accesses portal to manage and process claims"
    technology: "HTTPS/WSS"
  - source: "Customer Portal SPA"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS REST/GraphQL"
  - source: "API Gateway"
    destination: "Claims Processing Core & BFF"
    description: "Forwards requests to backend services"
    technology: "HTTPS / mTLS"
  - source: "Claims Processing Core & BFF"
    destination: "Routing & Reconciliation Service"
    description: "Coordinates routing and reconciliation"
    technology: "Internal gRPC/REST"
  - source: "Routing & Reconciliation Service"
    destination: "Legacy Mainframe"
    description: "Synchronizes data and protects batch window"
    technology: "Azure Service Bus over Azure ExpressRoute/VPN"
  - source: "Customer Portal SPA"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OpenID Connect / OAuth 2.0"
  - source: "Claims Processing Core & BFF"
    destination: "Notification Service"
    description: "Sends SMS and email notifications"
    technology: "HTTPS REST API"