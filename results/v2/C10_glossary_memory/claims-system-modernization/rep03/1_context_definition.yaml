level: context
scope: "System Context diagram for Regional Insurer's Claims Platform Modernization"
system:
  name: "New Insurance Claims Platform"
  description: "Modern cloud-native claims processing platform built on Azure West Europe, replacing legacy components while maintaining continuity through a hybrid migration approach."
elements:
  - type: "person"
    name: "Customers"
    description: "External users submitting claims online."
  - type: "person"
    name: "Brokers"
    description: "External users submitting claims on behalf of customers."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users managing and processing claims via the new web application."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise COBOL/DB2 system of record operating under a 3-year constraint."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Corporate Active Directory / Azure AD providing authentication services."
  - type: "externalSystem"
    name: "Notification Service"
    description: "SendGrid/Twilio external SMS/email provider for sending notifications."
relationships:
  - source: "Customers"
    destination: "New Insurance Claims Platform"
    description: "Submit claims online"
    technology: "HTTPS/WSS"
  - source: "Brokers"
    destination: "New Insurance Claims Platform"
    description: "Submit claims online"
    technology: "HTTPS/WSS"
  - source: "Claims Adjusters"
    destination: "New Insurance Claims Platform"
    description: "Manage claims via the web application"
    technology: "HTTPS/WSS"
  - source: "New Insurance Claims Platform"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OpenID Connect / OAuth 2.0"
  - source: "New Insurance Claims Platform"
    destination: "Legacy Mainframe"
    description: "Synchronizes data and protects batch window"
    technology: "Azure Service Bus over Azure ExpressRoute/VPN"
  - source: "New Insurance Claims Platform"
    destination: "Notification Service"
    description: "Sends SMS and email notifications"
    technology: "HTTPS REST API"