level: component
scope: "Component diagram for the Core Claims Service container"
parentContainer:
  name: "Core Claims Service"
elements:
  - type: "component"
    name: "Claim Domain Controller"
    technology: "Java / Spring Boot or .NET"
    description: "Serves as the entry point for handling core claims requests within the Core Claims Service."
  - type: "component"
    name: "Claim Processing Engine"
    technology: "Java / Spring Boot or .NET"
    description: "Implements the core claims processing business logic and domain rules."
  - type: "component"
    name: "Mainframe Anti-Corruption Layer (ACL)"
    technology: "Java / Spring Boot or .NET"
    description: "Translates and isolates interactions between the modern claims platform and the legacy mainframe system."
  - type: "component"
    name: "Outbox Event Publisher"
    technology: "Java / Spring Boot or .NET"
    description: "Implements the Transactional Outbox pattern to reliably publish events to the messaging infrastructure."
  - type: "component"
    name: "Repository / Data Access Component"
    technology: "Spring Data JPA / Entity Framework"
    description: "Encapsulates persistence logic and data access operations for the Azure SQL Database."
  - type: "container"
    name: "Azure SQL Database"
    technology: "Azure SQL Database"
    description: "Acts as the cloud system of record using Transparent Data Encryption."
  - type: "container"
    name: "Data Sync Engine"
    technology: "Azure Service Bus & Azure Functions"
    description: "Powers Data Sync Engine for reliable messaging."
relationships:
  - source: "Claim Domain Controller"
    destination: "Claim Processing Engine"
    description: "In-process method calls"
  - source: "Claim Processing Engine"
    destination: "Mainframe Anti-Corruption Layer (ACL)"
    description: "In-process method calls"
  - source: "Claim Processing Engine"
    destination: "Outbox Event Publisher"
    description: "JDBC / Transactional Outbox"
  - source: "Claim Processing Engine"
    destination: "Repository / Data Access Component"
    description: "In-process method calls"
  - source: "Repository / Data Access Component"
    destination: "Azure SQL Database"
    description: "TDS with encryption"
  - source: "Outbox Event Publisher"
    destination: "Data Sync Engine"
    description: "AMQP / Azure Service Bus"