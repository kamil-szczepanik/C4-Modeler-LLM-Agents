level: component
scope: "Component diagram for the Azure SQL Database container"
parentContainer:
  name: "Azure SQL Database"
elements:
  - type: "component"
    name: "Claims Relational Tables"
    technology: "Azure SQL Database Tables"
    description: "Stores core claims data, policies, and participant details relational structures."
  - type: "component"
    name: "Azure SQL Ledger Tables"
    technology: "Azure SQL Ledger"
    description: "Provides tamper-evident auditing and cryptographic verification for claims transactions."
  - type: "component"
    name: "Change Tracking Engine"
    technology: "Azure SQL Change Tracking"
    description: "Monitors and records data modifications to support incremental synchronization with the Data Sync Engine."
relationships:
  - source: "Claims Relational Tables"
    destination: "Azure SQL Ledger Tables"
    description: "Records immutable history of data modifications"
  - source: "Claims Relational Tables"
    destination: "Change Tracking Engine"
    description: "Exposes changed rows for synchronization"