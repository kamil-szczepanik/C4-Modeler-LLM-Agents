level: component
scope: "Component diagram for the Data Sync Engine container"
parentContainer:
  name: "Data Sync Engine"
elements:
  - type: "component"
    name: "Sync Ingestion Function"
    technology: "Azure Functions (.NET)"
    description: "Synchronizes claims between the cloud and the on-premises mainframe."
  - type: "component"
    name: "Mainframe Adapter Component"
    technology: "Azure Functions (.NET)"
    description: "Adapts and interfaces with the legacy mainframe system."
  - type: "component"
    name: "Dead-Letter & Reconciliation Handler"
    technology: "Azure Functions (.NET)"
    description: "Handles dead-letter messages and reconciliation logic."
  - type: "component"
    name: "Idempotency Store"
    technology: "Azure SQL Database"
    description: "Powers the Idempotency Store for deduplication and exactly-once processing."
  - type: "externalSystem"
    name: "Legacy Mainframe System"
    technology: "COBOL/DB2"
    description: "On-Premises COBOL/DB2 mainframe system acting as the system of record."
  - type: "person"
    name: "Operations and Support Staff"
    technology: ""
    description: "Staff responsible for monitoring system operations and providing user support."
  - type: "externalSystem"
    name: "Azure Monitor / Application Insights"
    technology: ""
    description: "Delivers native observability without custom UI maintenance overhead."
  - type: "externalSystem"
    name: "Azure Key Vault"
    technology: ""
    description: "Secures mTLS client certificates and encryption keys for compliance and security."
relationships:
  - source: "Sync Ingestion Function"
    destination: "Idempotency Store"
    description: "TDS (Tabular Data Stream) with encryption"
  - source: "Mainframe Adapter Component"
    destination: "Legacy Mainframe System"
    description: "Encrypted TCP/MQ with mTLS via Enterprise Service Bus"
  - source: "Dead-Letter & Reconciliation Handler"
    destination: "Azure Monitor / Application Insights"
    description: "HTTPS/TLS (REST)"
  - source: "Mainframe Adapter Component"
    destination: "Azure Key Vault"
    description: "HTTPS/TLS (REST)"