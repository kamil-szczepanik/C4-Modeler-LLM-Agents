level: component
scope: "Component diagram for the API Gateway / Backend-for-Frontend (BFF) container"
parentContainer:
  name: "API Gateway / Backend-for-Frontend (BFF)"
elements:
  - type: "component"
    name: "API Router and Gateway"
    technology: "Azure Container Apps (Node.js/Go)"
    description: "Handles incoming client requests, request routing, and reverse proxying to downstream services."
  - type: "component"
    name: "Authentication & Token Translation"
    technology: "Azure Container Apps (Node.js/Go)"
    description: "Validates incoming tokens from the Enterprise Identity Provider and translates them for backend services."
  - type: "component"
    name: "Response Cache"
    technology: "Azure Container Apps (Node.js/Go)"
    description: "Provides caching layers to improve performance and reduce latency for frequent client requests."
relationships:
  - source: "API Router and Gateway"
    destination: "Authentication & Token Translation"
    description: "Validates security tokens for requests"
  - source: "API Router and Gateway"
    destination: "Response Cache"
    description: "Retrieves and stores cached responses"