level: component
scope: "Component diagram for the Web Frontend container"
parentContainer:
  name: "Web Frontend"
elements:
  - type: "component"
    name: "Web Frontend"
    technology: "React/TypeScript on Azure Static Web Apps"
    description: "Serves adjusters and customers with a responsive interface."
  - type: "component"
    name: "Auth Component"
    technology: "TypeScript / MSAL.js"
    description: "Manages OIDC authentication and Single Sign-On session tokens."
  - type: "component"
    name: "Customer Portal UI"
    technology: "React"
    description: "Provides customer-facing claims submission and management interface."
  - type: "component"
    name: "Adjuster Workspace UI"
    technology: "React"
    description: "Provides adjusters with claims review and processing interface."
  - type: "component"
    name: "Migration Feature Flag Adapter"
    technology: "TypeScript"
    description: "Handles feature flagging for incremental migration of claim types."
relationships:
  - source: "Web Frontend"
    destination: "Auth Component"
    description: "Delegates authentication"
  - source: "Web Frontend"
    destination: "Customer Portal UI"
    description: "Renders"
  - source: "Web Frontend"
    destination: "Adjuster Workspace UI"
    description: "Renders"
  - source: "Web Frontend"
    destination: "Migration Feature Flag Adapter"
    description: "Evaluates feature flags"