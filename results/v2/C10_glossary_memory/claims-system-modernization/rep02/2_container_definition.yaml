level: container
scope: "Container diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "External users who interact with the system to submit and manage claims."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff who review, process, and manage claims within the system."
  - type: "person"
    name: "Operations and Support Staff"
    description: "Staff responsible for monitoring system operations and providing user support."
  - type: "person"
    name: "Finance and Accounting"
    description: "Internal department responsible for financial reconciliation and reporting."
  - type: "externalSystem"
    name: "Legacy Mainframe System"
    description: "On-Premises COBOL/DB2 mainframe system acting as the system of record."
  - type: "externalSystem"
    name: "Enterprise Identity Provider"
    description: "Active Directory / Entra ID providing Single Sign-On (OIDC)."
  - type: "container"
    name: "Web Frontend"
    technology: "React/TypeScript on Azure Static Web Apps"
    description: "Serves adjusters and customers with a responsive interface."
  - type: "container"
    name: "API Gateway / Backend-for-Frontend (BFF)"
    technology: "Azure Container Apps (Node.js/Go)"
    description: "Implements API Gateway/BFF for caching and async orchestration."
  - type: "container"
    name: "Core Claims Service"
    technology: "Azure Container Apps (Java/Spring Boot or .NET)"
    description: "Hosts Core Claims Service domain logic."
  - type: "container"
    name: "Data Sync Engine"
    technology: "Azure Service Bus & Azure Functions"
    description: "Powers Data Sync Engine for reliable messaging."
  - type: "container"
    name: "Azure SQL Database"
    technology: "Azure SQL Database"
    description: "Acts as cloud system of record with Transparent Data Encryption (TDE)."
relationships:
  - source: "Customers and Brokers"
    destination: "Web Frontend"
    description: "Interacts with the platform to manage claims"
    technology: "HTTPS/TLS (REST/GraphQL)"
  - source: "Claims Adjusters"
    destination: "Web Frontend"
    description: "Processes and manages claims"
    technology: "HTTPS/TLS (REST/GraphQL)"
  - source: "Operations and Support Staff"
    destination: "Web Frontend"
    description: "Supports and monitors the platform"
    technology: "HTTPS/TLS (REST/GraphQL)"
  - source: "Finance and Accounting"
    destination: "Web Frontend"
    description: "Receives financial feeds and reconciliation data"
    technology: "SFTP / encrypted API feeds"
  - source: "Web Frontend"
    destination: "API Gateway / Backend-for-Frontend (BFF)"
    description: "Sends API requests"
    technology: "HTTPS/TLS (REST/GraphQL)"
  - source: "Web Frontend"
    destination: "Enterprise Identity Provider"
    description: "Authenticates users for Single Sign-On"
    technology: "OpenID Connect (OIDC)"
  - source: "API Gateway / Backend-for-Frontend (BFF)"
    destination: "Core Claims Service"
    description: "Forwards requests and orchestrates services"
    technology: "HTTPS/TLS (gRPC/REST)"
  - source: "Core Claims Service"
    destination: "Azure SQL Database"
    description: "Reads and writes claim data"
    technology: "TDS (Tabular Data Stream) with encryption"
  - source: "Data Sync Engine"
    destination: "Legacy Mainframe System"
    description: "Synchronizes claims data asynchronously"
    technology: "Encrypted TCP/MQ with mTLS via Enterprise Service Bus"