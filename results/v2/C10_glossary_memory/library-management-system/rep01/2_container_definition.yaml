level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Member (Patron)"
    description: "End-user who searches for items, manages loans, and uses self-service portals."
  - type: "person"
    name: "Librarian / Staff"
    description: "Staff member who manages circulation, catalogs items, and assists patrons."
  - type: "person"
    name: "Library Administrator"
    description: "Administrator who configures the system, manages users, and oversees system operations."
  - type: "externalSystem"
    name: "Anycast CDN / DDoS Protection Service (EU-PoPs)"
    description: "Edge service providing DDoS protection and routing traffic via EU points of presence."
  - type: "externalSystem"
    name: "EU Cloud Infrastructure (AWS/Azure EU Region)"
    description: "Hosting environment that persists data and anchors all hosting within certified EU regions."
  - type: "externalSystem"
    name: "EU Identity Provider (IdP)"
    description: "Provides authentication services via OIDC/OAuth2 with MFA for users and administrators."
  - type: "externalSystem"
    name: "EU Compliance & Audit Logging Service"
    description: "Receives exported audit events for compliance tracking."
  - type: "externalSystem"
    name: "EU Monitoring & APM Provider"
    description: "Receives operational telemetry to meet performance and latency requirements."
  - type: "externalSystem"
    name: "Third-Party Digital Content Providers (OverDrive/Libby)"
    description: "Provides digital assets and content syncing for circulation."
  - type: "externalSystem"
    name: "External Notification Service"
    description: "Dispatches alerts and notifications via SMTP or HTTPS API."
  - type: "container"
    name: "API Gateway / BFF"
    technology: "Nginx/Envoy"
    description: "Handles edge routing, TLS termination, and rate limiting."
  - type: "container"
    name: "Patron Portal"
    technology: "Web/Mobile Container"
    description: "Self-service portal for library members to search and manage loans."
  - type: "container"
    name: "Staff Circulation App"
    technology: "Web/Mobile Container"
    description: "Application for staff to manage circulation and assist patrons."
  - type: "container"
    name: "Admin Console"
    technology: "Web/Mobile Container"
    description: "Console for administrators to configure system operations."
  - type: "container"
    name: "Search & Catalog Service"
    technology: "Java/Spring Boot + Elasticsearch"
    description: "Provides sub-800ms search performance and catalog management."
  - type: "container"
    name: "Circulation & Core Engine"
    technology: "Go/Node.js"
    description: "Core business logic engine for managing circulation and library workflows."
  - type: "container"
    name: "Primary Database"
    technology: "PostgreSQL, EU-hosted"
    description: "Persists application data with AES-256 encryption at rest."
  - type: "container"
    name: "Notification Worker"
    technology: "Async Worker"
    description: "Dispatches notifications asynchronously."
  - type: "container"
    name: "Digital Content Sync Worker"
    technology: "Async Worker"
    description: "Syncs digital content from third-party providers asynchronously."
relationships:
  - source: "Library Member (Patron)"
    destination: "Anycast CDN / DDoS Protection Service (EU-PoPs)"
    description: "Uses system via web/mobile portal"
    technology: "TLS 1.3, HTTPS"
  - source: "Librarian / Staff"
    destination: "Anycast CDN / DDoS Protection Service (EU-PoPs)"
    description: "Uses system for staff workflows"
    technology: "TLS 1.3, HTTPS"
  - source: "Library Administrator"
    destination: "Anycast CDN / DDoS Protection Service (EU-PoPs)"
    description: "Uses system for administration"
    technology: "TLS 1.3, HTTPS"
  - source: "Anycast CDN / DDoS Protection Service (EU-PoPs)"
    destination: "API Gateway / BFF"
    description: "Routes traffic to the API Gateway"
    technology: "TLS 1.3, HTTPS"
  - source: "Patron Portal"
    destination: "API Gateway / BFF"
    description: "Sends API requests and WebSocket messages"
    technology: "HTTPS/REST, WSS"
  - source: "Staff Circulation App"
    destination: "API Gateway / BFF"
    description: "Sends API requests"
    technology: "HTTPS/REST"
  - source: "Admin Console"
    destination: "API Gateway / BFF"
    description: "Sends API requests"
    technology: "HTTPS/REST"
  - source: "API Gateway / BFF"
    destination: "Search & Catalog Service"
    description: "Queries search and catalog data"
    technology: "gRPC"
  - source: "API Gateway / BFF"
    destination: "Circulation & Core Engine"
    description: "Invokes core business operations"
    technology: "gRPC / HTTPS"
  - source: "Circulation & Core Engine"
    destination: "Primary Database"
    description: "Reads and writes core data securely"
    technology: "Postgres Wire Protocol over mTLS"
  - source: "Circulation & Core Engine"
    destination: "Digital Content Sync Worker"
    description: "Queues synchronization tasks"
    technology: "Async Message Queues (RabbitMQ/Redis)"
  - source: "Circulation & Core Engine"
    destination: "Notification Worker"
    description: "Queues notification tasks"
    technology: "Async Message Queues (RabbitMQ/Redis)"
  - source: "Digital Content Sync Worker"
    destination: "Third-Party Digital Content Providers (OverDrive/Libby)"
    description: "Syncs digital assets"
    technology: "OAuth2, HTTPS/REST"
  - source: "Notification Worker"
    destination: "External Notification Service"
    description: "Dispatches alerts and notifications"
    technology: "SMTP/HTTPS API"
  - source: "API Gateway / BFF"
    destination: "EU Identity Provider (IdP)"
    description: "Validates authentication and JWT tokens"
    technology: "OIDC/OAuth2"