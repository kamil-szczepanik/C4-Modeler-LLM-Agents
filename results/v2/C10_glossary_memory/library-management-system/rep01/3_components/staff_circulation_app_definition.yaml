level: component
scope: "Component diagram for the Staff Circulation App container"
parentContainer:
  name: "Staff Circulation App"
elements:
  - type: "component"
    name: "Circulation Dashboard Component"
    technology: "React SPA / TypeScript"
    description: "Provides the main interface for librarians to manage circulation workflows, checkouts, and returns."
  - type: "component"
    name: "Patron Lookup & Verification Component"
    technology: "React SPA / TypeScript, IndexedDB & Web Crypto API"
    description: "Enables rapid patron search and verification, interfacing with local encrypted storage."
  - type: "component"
    name: "Loan Management UI Component"
    technology: "React SPA / TypeScript"
    description: "Manages active loans, renewals, and item status updates."
  - type: "component"
    name: "Fine-Grained Override Management Feature"
    technology: "React SPA / TypeScript"
    description: "Allows authorized staff to apply circulation overrides based on permissions."
  - type: "component"
    name: "Authentication & Session Manager"
    technology: "OIDC/OAuth2, React SPA / TypeScript"
    description: "Enforces secure multi-factor authentication and token-based session management via the EU Identity Provider."
  - type: "component"
    name: "Offline Sync & Caching Service"
    technology: "IndexedDB & Web Crypto API, AES-GCM"
    description: "Provides secure, encrypted offline-tolerant caching of patron PII and records during network partitions."
  - type: "component"
    name: "Audit & Telemetry Dispatcher"
    technology: "React SPA / TypeScript"
    description: "Dispatches audit logs and operational telemetry through the API Gateway."
relationships:
  - source: "Librarian / Staff"
    destination: "Anycast CDN / DDoS Protection Service (EU-PoPs)"
    description: "Accesses via TLS 1.3, HTTPS"
  - source: "Staff Circulation App"
    destination: "API Gateway / BFF"
    description: "Communicates via HTTPS/REST"
  - source: "Authentication & Session Manager"
    destination: "EU Identity Provider (IdP)"
    description: "Authenticates via OIDC/OAuth2"
  - source: "Audit & Telemetry Dispatcher"
    destination: "API Gateway / BFF"
    description: "Sends audit and telemetry data via HTTPS/REST"
  - source: "Patron Lookup & Verification Component"
    destination: "Offline Sync & Caching Service"
    description: "Reads and writes via Encrypted local storage (AES-GCM)"