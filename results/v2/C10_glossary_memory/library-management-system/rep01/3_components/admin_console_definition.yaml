level: component
scope: "Component diagram for the Admin Console container"
parentContainer:
  name: "Admin Console"
elements:
  - type: "component"
    name: "Admin UI Router & View Controller"
    technology: "React/TypeScript SPA"
    description: "Provides a responsive, maintainable single-page application framework for administrative interfaces."
  - type: "component"
    name: "System Configuration Client"
    technology: "TypeScript Module"
    description: "Enables Library Administrators to configure operations and system settings."
  - type: "component"
    name: "Admin Authentication & Session Manager"
    technology: "OpenID Connect SDK"
    description: "Implements secure OIDC/OAuth2 authentication and multi-factor authentication flows."
  - type: "component"
    name: "Audit & Telemetry Dispatcher"
    technology: "TypeScript Module"
    description: "Dispatches compliance audit events and operational telemetry."
  - type: "component"
    name: "Reporting & Analytics Dashboard Module"
    technology: "React/TypeScript Module"
    description: "Monitors metrics and generates reporting and analytics data for administrators."
  - type: "component"
    name: "API Gateway / BFF"
    technology: "Nginx/Envoy"
    description: "Handles edge routing, TLS termination, and rate limiting."
  - type: "component"
    name: "EU Identity Provider (IdP)"
    technology: "External Service"
    description: "Provides authentication services via OIDC/OAuth2 with MFA for users and administrators."
  - type: "component"
    name: "EU Compliance & Audit Logging Service"
    technology: "External Service"
    description: "Receives exported audit events for compliance tracking."
  - type: "component"
    name: "EU Monitoring & APM Provider"
    technology: "External Service"
    description: "Receives operational telemetry to meet performance and latency requirements."
relationships:
  - source: "Admin UI Router & View Controller"
    destination: "System Configuration Client"
    description: "In-memory TS calls"
  - source: "Admin UI Router & View Controller"
    destination: "Reporting & Analytics Dashboard Module"
    description: "In-memory TS calls"
  - source: "System Configuration Client"
    destination: "API Gateway / BFF"
    description: "HTTPS/REST, TLS 1.3"
  - source: "Reporting & Analytics Dashboard Module"
    destination: "API Gateway / BFF"
    description: "HTTPS/REST, TLS 1.3"
  - source: "Admin Authentication & Session Manager"
    destination: "EU Identity Provider (IdP)"
    description: "OIDC/OAuth2, TLS 1.3"
  - source: "Audit & Telemetry Dispatcher"
    destination: "EU Compliance & Audit Logging Service"
    description: "Syslog/HTTPS, TLS 1.3"
  - source: "Audit & Telemetry Dispatcher"
    destination: "EU Monitoring & APM Provider"
    description: "OTLP/HTTPS, TLS 1.3"