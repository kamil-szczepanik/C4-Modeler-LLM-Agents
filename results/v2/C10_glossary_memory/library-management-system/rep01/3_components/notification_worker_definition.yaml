level: component
scope: "Component diagram for the Notification Worker container"
parentContainer:
  name: "Notification Worker"
elements:
  - type: "component"
    name: "Queue Consumer Component"
    technology: "Go / RabbitMQ Client"
    description: "Consumes raw notification tasks from message queues."
  - type: "component"
    name: "Preference & Routing Component"
    technology: "Go"
    description: "Validates and routes raw jobs based on patron preferences."
  - type: "component"
    name: "Template Engine Component"
    technology: "Go template library"
    description: "Renders localized alerts and notifications using templates."
  - type: "component"
    name: "Dispatch Handler Component"
    technology: "Go HTTP/SMTP Client"
    description: "Dispatches rendered messages to external notification services."
relationships:
  - source: "Queue Consumer Component"
    destination: "Preference & Routing Component"
    description: "Passes raw job for preference validation"
  - source: "Preference & Routing Component"
    destination: "Primary Database"
    description: "Queries patron preferences"
  - source: "Preference & Routing Component"
    destination: "Template Engine Component"
    description: "Passes filtered/routed payload"
  - source: "Template Engine Component"
    destination: "Dispatch Handler Component"
    description: "Passes rendered message"
  - source: "Dispatch Handler Component"
    destination: "External Notification Service"
    description: "Dispatches alerts and notifications"
  - source: "Notification Worker"
    destination: "EU Monitoring & APM Provider"
    description: "Exports telemetry metrics"