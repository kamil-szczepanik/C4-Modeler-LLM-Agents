level: component
scope: "Component diagram for the Digital Content Sync Worker container"
parentContainer:
  name: "Digital Content Sync Worker"
elements:
  - type: "component"
    name: "Sync Task Consumer"
    technology: "Node.js with TypeScript, Async Message Queues (RabbitMQ/Redis)"
    description: "Queues and consumes sync tasks asynchronously."
  - type: "component"
    name: "Provider Integration Client"
    technology: "Node.js with TypeScript, OAuth2, HTTPS/REST"
    description: "Syncs digital assets from third-party digital content providers."
  - type: "component"
    name: "Catalog Persistence Adapter"
    technology: "Node.js with TypeScript, Postgres Wire Protocol over mTLS, AES-256"
    description: "Writes metadata to the primary database securely."
  - type: "component"
    name: "Telemetry & Audit Publisher"
    technology: "Node.js with TypeScript, OTLP/HTTPS"
    description: "Sends metrics and traces to the EU monitoring and APM provider."
  - type: "component"
    name: "Sync Circuit Breaker & Retry Manager"
    technology: "Node.js with TypeScript"
    description: "Prevents database exhaustion and third-party API throttling using circuit breakers and retries."
relationships:
  - source: "Circulation & Core Engine"
    destination: "Sync Task Consumer"
    description: "Queues sync tasks [Async Message Queues (RabbitMQ/Redis, AMQPS)]"
  - source: "Provider Integration Client"
    destination: "Third-Party Digital Content Providers (OverDrive/Libby)"
    description: "Syncs digital assets [OAuth2, HTTPS/REST]"
  - source: "Catalog Persistence Adapter"
    destination: "Primary Database"
    description: "Writes metadata [Postgres Wire Protocol over mTLS]"
  - source: "Telemetry & Audit Publisher"
    destination: "EU Monitoring & APM Provider"
    description: "Sends metrics and traces [OTLP/HTTPS]"