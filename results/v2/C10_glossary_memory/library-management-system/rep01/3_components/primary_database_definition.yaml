level: component
scope: "Component diagram for the Primary Database container"
parentContainer:
  name: "Primary Database"
elements:
  - type: "component"
    name: "Connection Pooler Component"
    technology: "PgBouncer"
    description: "Manages database connections to prevent thread exhaustion during peak academic loads."
  - type: "component"
    name: "Relational Storage Engine Component"
    technology: "PostgreSQL Core"
    description: "Provides ACID transactional integrity and EU-hosted relational storage."
  - type: "component"
    name: "Encryption & Key Management Component"
    technology: "AES-256 and pgcrypto"
    description: "Secures application data at rest and column-level PII."
  - type: "component"
    name: "Replication & Failover Component"
    technology: "PostgreSQL Replication"
    description: "Handles automated replication and failover to ensure high availability."
relationships:
  - source: "Circulation & Core Engine"
    destination: "Connection Pooler Component"
    description: "Postgres Wire Protocol over mTLS"
  - source: "Connection Pooler Component"
    destination: "Relational Storage Engine Component"
    description: "Proxies connections"
  - source: "Relational Storage Engine Component"
    destination: "Encryption & Key Management Component"
    description: "Applies encryption at rest and column-level PII protection"
  - source: "Relational Storage Engine Component"
    destination: "Replication & Failover Component"
    description: "Synchronizes data for high availability and backup targets"