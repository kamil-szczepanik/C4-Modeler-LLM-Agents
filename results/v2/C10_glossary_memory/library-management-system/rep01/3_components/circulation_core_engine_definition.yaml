level: component
scope: "Component diagram for the Circulation & Core Engine container"
parentContainer:
  name: "Circulation & Core Engine"
elements:
  - type: "component"
    name: "Circulation API & Auth Facade"
    technology: "Go"
    description: "Handles edge communication, authentication, and request facade duties for the circulation engine."
  - type: "component"
    name: "Loan Management Component"
    technology: "Go"
    description: "Manages core loan logic, item checkout, check-in, and renewal workflows."
  - type: "component"
    name: "Patron Policy Component"
    technology: "Go"
    description: "Evaluates patron privileges, borrowing limits, and circulation policies."
  - type: "component"
    name: "Audit & Event Dispatcher Component"
    technology: "Go"
    description: "Dispatches audit events, compliance logs, and asynchronous notifications."
  - type: "container"
    name: "API Gateway / BFF"
    technology: "Nginx/Envoy"
    description: "Handles edge routing, TLS termination, and rate limiting."
  - type: "container"
    name: "Primary Database"
    technology: "PostgreSQL, EU-hosted"
    description: "Persists application data with AES-256 encryption at rest."
  - type: "container"
    name: "Notification Worker"
    technology: "Async Worker"
    description: "Dispatches notifications asynchronously."
  - type: "externalSystem"
    name: "EU Compliance & Audit Logging Service"
    technology: "Syslog/HTTPS"
    description: "Receives exported audit events for compliance tracking."
relationships:
  - source: "API Gateway / BFF"
    destination: "Circulation API & Auth Facade"
    description: "gRPC"
  - source: "Circulation API & Auth Facade"
    destination: "Loan Management Component"
    description: "In-Process Function Call"
  - source: "Circulation API & Auth Facade"
    destination: "Patron Policy Component"
    description: "In-Process Function Call"
  - source: "Loan Management Component"
    destination: "Patron Policy Component"
    description: "In-Process Function Call"
  - source: "Loan Management Component"
    destination: "Primary Database"
    description: "Postgres Wire Protocol over mTLS"
  - source: "Loan Management Component"
    destination: "Audit & Event Dispatcher Component"
    description: "In-Process Channel"
  - source: "Audit & Event Dispatcher Component"
    destination: "Notification Worker"
    description: "Async Message Queues (RabbitMQ/Redis)"
  - source: "Audit & Event Dispatcher Component"
    destination: "EU Compliance & Audit Logging Service"
    description: "Syslog/HTTPS"