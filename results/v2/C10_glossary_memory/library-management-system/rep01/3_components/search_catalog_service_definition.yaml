level: component
scope: "Component diagram for the Search & Catalog Service container"
parentContainer:
  name: "Search & Catalog Service"
elements:
  - type: "component"
    name: "Search API Controller"
    technology: "Java / Spring Boot REST Controller"
    description: "Handles HTTP/gRPC requests for catalog searching and book discovery."
  - type: "component"
    name: "Catalog Management Service"
    technology: "Java / Spring Boot Service"
    description: "Business logic layer for managing library catalog entries and metadata."
  - type: "component"
    name: "Elasticsearch Client Adapter"
    technology: "Elasticsearch Java REST Client"
    description: "Interfaces with the Elasticsearch cluster to execute high-performance sub-800ms search queries."
relationships:
  - source: "Search API Controller"
    destination: "Catalog Management Service"
    description: "Invokes business logic for search and catalog operations"
  - source: "Catalog Management Service"
    destination: "Elasticsearch Client Adapter"
    description: "Executes queries and indexes catalog records"