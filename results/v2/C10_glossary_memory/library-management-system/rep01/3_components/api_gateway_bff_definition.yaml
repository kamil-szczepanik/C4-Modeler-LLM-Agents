level: component
scope: "Component diagram for the API Gateway / BFF container"
parentContainer:
  name: "API Gateway / BFF"
elements:
  - type: "component"
    name: "Edge Router & TLS Termination Component"
    technology: "Envoy"
    description: "Handles edge routing, TLS 1.3 termination, and low-latency proxying."
  - type: "component"
    name: "Authentication & JWT Validation Filter"
    technology: "Envoy Filter / OIDC"
    description: "Validates JSON Web Tokens and handles authentication flows with the EU Identity Provider."
  - type: "component"
    name: "Rate Limiting & Threat Protection Component"
    technology: "Envoy + Redis"
    description: "Protects catalog search and endpoints from scraping and excessive traffic using multi-AZ replicated Redis."
  - type: "component"
    name: "BFF Aggregator & Protocol Translator"
    technology: "Envoy / Go"
    description: "Translates external REST/WSS traffic to internal gRPC over mTLS for backend services."
relationships:
  - source: "Edge Router & TLS Termination Component"
    destination: "Authentication & JWT Validation Filter"
    description: "Passes terminated HTTPS traffic for token validation"
  - source: "Authentication & JWT Validation Filter"
    destination: "Rate Limiting & Threat Protection Component"
    description: "Enforces rate limits on authenticated requests"
  - source: "Rate Limiting & Threat Protection Component"
    destination: "BFF Aggregator & Protocol Translator"
    description: "Routes validated and rate-limited traffic to the aggregator"