level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public users accessing self-service portals."
  - type: "person"
    name: "Librarians / Circulation Staff"
    description: "Staff managing item cataloguing and circulation workflows."
  - type: "person"
    name: "Library Administrators"
    description: "Personnel managing system reporting, inventory, and budgets."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processing (Adyen/Stripe EU)."
  - type: "externalSystem"
    name: "Digital Content Providers"
    description: "External e-Book Vendors providing digital content."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External service for sending system notifications."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Authentication and identity management (Keycloak/Auth0 EU)."
  - type: "container"
    name: "Patron Self-Service Portal"
    technology: "Web/Mobile App"
    description: "Provides self-service capabilities for library patrons."
  - type: "container"
    name: "Circulation Management Dashboard"
    technology: "Web App"
    description: "Dashboard for librarians and circulation staff to manage circulation workflows."
  - type: "container"
    name: "Administration Console"
    technology: "Web App"
    description: "Console for library administrators to manage reporting, inventory, and budgets."
  - type: "container"
    name: "API Gateway"
    technology: "NGINX / Kong"
    description: "Handles TLS termination, WAF policies, and routing for all incoming traffic."
  - type: "container"
    name: "Catalog & Search Service"
    technology: "Spring Boot, Elasticsearch"
    description: "Manages catalogue queries and search operations."
  - type: "container"
    name: "Circulation & Loan Service"
    technology: "Node.js / Express"
    description: "Manages item circulation, loans, and transactional state."
  - type: "container"
    name: "Reporting & Analytics Service"
    technology: "Python / FastAPI"
    description: "Handles reporting and analytics workloads."
  - type: "container"
    name: "Notification Dispatcher"
    technology: "Go"
    description: "Dispatches asynchronous notifications."
  - type: "container"
    name: "PostgreSQL Database"
    technology: "PostgreSQL 15"
    description: "Stores transactional state and analytics data."
  - type: "container"
    name: "RabbitMQ"
    technology: "Message Broker"
    description: "Facilitates asynchronous event-driven messaging."
relationships:
  - source: "Library Patrons"
    destination: "API Gateway"
    description: "Accesses self-service portal"
    technology: "HTTPS / WAF-protected"
  - source: "Librarians / Circulation Staff"
    destination: "API Gateway"
    description: "Accesses circulation dashboard"
    technology: "HTTPS / WAF-protected"
  - source: "Library Administrators"
    destination: "API Gateway"
    description: "Accesses administration console"
    technology: "HTTPS / WAF-protected"
  - source: "API Gateway"
    destination: "Catalog & Search Service"
    description: "Routes requests"
    technology: "HTTP/2 reverse proxy"
  - source: "API Gateway"
    destination: "Circulation & Loan Service"
    description: "Routes requests"
    technology: "HTTP/2 reverse proxy"
  - source: "API Gateway"
    destination: "Reporting & Analytics Service"
    description: "Routes requests"
    technology: "HTTP/2 reverse proxy"
  - source: "Patron Self-Service Portal"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OIDC / OAuth 2.0 over HTTPS with PKCE"
  - source: "Circulation Management Dashboard"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OIDC / OAuth 2.0 over HTTPS with PKCE"
  - source: "Administration Console"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OIDC / OAuth 2.0 over HTTPS with PKCE"
  - source: "Catalog & Search Service"
    destination: "Circulation & Loan Service"
    description: "Interservice communication"
    technology: "gRPC over TLS 1.3 / mTLS"
  - source: "Circulation & Loan Service"
    destination: "Reporting & Analytics Service"
    description: "Interservice communication"
    technology: "gRPC over TLS 1.3 / mTLS"
  - source: "Reporting & Analytics Service"
    destination: "Notification Dispatcher"
    description: "Interservice communication"
    technology: "gRPC over TLS 1.3 / mTLS"
  - source: "Catalog & Search Service"
    destination: "RabbitMQ"
    description: "Publishes and consumes events"
    technology: "AMQP over TLS 1.3"
  - source: "Circulation & Loan Service"
    destination: "RabbitMQ"
    description: "Publishes and consumes events"
    technology: "AMQP over TLS 1.3"
  - source: "Notification Dispatcher"
    destination: "RabbitMQ"
    description: "Consumes notification events"
    technology: "AMQP over TLS 1.3"
  - source: "Circulation & Loan Service"
    destination: "PostgreSQL Database"
    description: "Reads and writes transactional data"
    technology: "SQL / PostgreSQL protocol"
  - source: "Reporting & Analytics Service"
    destination: "PostgreSQL Database"
    description: "Queries analytics data from read-replicas"
    technology: "SQL / PostgreSQL protocol"
  - source: "Circulation & Loan Service"
    destination: "Payment Gateway"
    description: "Processes payments"
    technology: "REST / HTTPS over TLS 1.3"
  - source: "Catalog & Search Service"
    destination: "Digital Content Providers"
    description: "Accesses digital content"
    technology: "REST / HTTPS over TLS 1.3"
  - source: "Notification Dispatcher"
    destination: "Notification Service"
    description: "Sends notifications"
    technology: "REST / HTTPS over TLS 1.3"