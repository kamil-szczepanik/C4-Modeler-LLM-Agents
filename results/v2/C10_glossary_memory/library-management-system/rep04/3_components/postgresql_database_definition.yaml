level: component
scope: "Component diagram for the PostgreSQL Database container"
parentContainer:
  name: "PostgreSQL Database"
elements:
  - type: "component"
    name: "Primary Database Instance"
    technology: "PostgreSQL 15"
    description: "Handles transactional read/write operations for the Circulation & Loan Service."
  - type: "component"
    name: "Analytics Read-Replica"
    technology: "PostgreSQL 15 Read-Replica"
    description: "Dedicated replica serving heavy analytical queries from the Reporting & Analytics Service."
  - type: "component"
    name: "PgBouncer Connection Pooler"
    technology: "PgBouncer"
    description: "Manages client connections efficiently to prevent resource exhaustion."
  - type: "component"
    name: "Data Anonymization Engine"
    technology: "Scheduled PL/pgSQL routines"
    description: "Executing automated pseudonymization of PII for closed accounts."
  - type: "component"
    name: "Security & Governance Controls"
    technology: "Row-Level Security (RLS) policies, pgAudit logging, TLS 1.3 / mTLS enforcement"
    description: "Enforces security policies, audit logging, and encryption for the database."
relationships:
  - source: "PgBouncer Connection Pooler"
    destination: "Primary Database Instance"
    description: "Forwards write traffic [SQL / PostgreSQL protocol]."
  - source: "PgBouncer Connection Pooler"
    destination: "Analytics Read-Replica"
    description: "Forwards read-only analytical traffic [SQL / PostgreSQL protocol]."