level: component
scope: "Component diagram for the Administration Console container"
parentContainer:
  name: "Administration Console"
elements:
  - type: "component"
    name: "Authentication Manager"
    technology: "React / OIDC Client"
    description: "Manages OIDC / OAuth 2.0 authentication flows with PKCE and secures session storage."
  - type: "component"
    name: "Dashboard UI Module"
    technology: "React Component"
    description: "Provides a responsive, component-driven user interface for administrative workflows and high-level metrics."
  - type: "component"
    name: "Reporting Engine Client"
    technology: "React / REST Client"
    description: "Interfaces with the Reporting & Analytics Service to retrieve reporting and vendor ROI analytics."
  - type: "component"
    name: "Inventory & Budget Management Module"
    technology: "React Component"
    description: "Empowers Library Administrators to manage library inventory and financial budgets."
  - type: "component"
    name: "Vendor Analytics Module"
    technology: "React Component"
    description: "Displays analytics and insights regarding vendor performance and ROI."
relationships:
  - source: "Library Administrators"
    destination: "Administration Console"
    description: "HTTPS / WAF-protected API Gateway"
  - source: "Administration Console"
    destination: "Identity Provider"
    description: "OIDC / OAuth 2.0 over HTTPS with PKCE"
  - source: "Administration Console"
    destination: "API Gateway"
    description: "REST / HTTPS over TLS 1.3"
  - source: "Administration Console"
    destination: "Reporting & Analytics Service"
    description: "REST / HTTPS over TLS 1.3 via API Gateway"