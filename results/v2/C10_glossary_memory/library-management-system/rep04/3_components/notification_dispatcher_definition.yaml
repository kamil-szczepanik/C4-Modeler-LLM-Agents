level: component
scope: "Component diagram for the Notification Dispatcher container"
parentContainer:
  name: "Notification Dispatcher"
elements:
  - type: "component"
    name: "Event Consumer"
    technology: "Go / AMQP"
    description: "Consumes notification events from RabbitMQ."
  - type: "component"
    name: "Notification Router"
    technology: "Go"
    description: "Routes notification events to the appropriate template engine."
  - type: "component"
    name: "Template Engine"
    technology: "Go"
    description: "Processes notification templates."
  - type: "component"
    name: "Delivery Worker Pool"
    technology: "Go"
    description: "Manages worker pool for dispatching notifications."
  - type: "component"
    name: "External Client Adapter"
    technology: "Go / HTTP Client"
    description: "Adapts calls to external notification services."
  - type: "component"
    name: "Audit Logger"
    technology: "Go"
    description: "Logs dispatch actions for auditing and compliance."
  - type: "container"
    name: "RabbitMQ"
    technology: "Message Broker"
    description: "Facilitates asynchronous event-driven messaging with Dead-Letter Exchange support."
  - type: "externalSystem"
    name: "Notification Service"
    technology: "External Notification Service"
    description: "External service for sending system notifications."
relationships:
  - source: "RabbitMQ"
    destination: "Event Consumer"
    description: "Consumes notification events [AMQP over TLS 1.3]"
  - source: "Event Consumer"
    destination: "Notification Router"
    description: "Internal function call"
  - source: "Notification Router"
    destination: "Template Engine"
    description: "Internal function call"
  - source: "Template Engine"
    destination: "Delivery Worker Pool"
    description: "Internal channel-based dispatch"
  - source: "Delivery Worker Pool"
    destination: "External Client Adapter"
    description: "Internal function call"
  - source: "External Client Adapter"
    destination: "Notification Service"
    description: "Sends notifications [REST / HTTPS over TLS 1.3 with mTLS/OAuth 2.0]"