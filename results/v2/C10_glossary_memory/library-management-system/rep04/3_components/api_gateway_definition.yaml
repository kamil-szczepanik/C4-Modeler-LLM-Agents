level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "WAF"
    technology: "NGINX / Kong WAF Module"
    description: "Inspects incoming HTTP/HTTPS traffic to block common web exploits and enforce edge security."
  - type: "component"
    name: "JWT Validation"
    technology: "NGINX / Kong JWT Plugin"
    description: "Validates JSON Web Tokens against the Identity Provider for incoming requests."
  - type: "component"
    name: "Rate Limiting"
    technology: "NGINX / Kong Rate Limiting Plugin"
    description: "Throttles incoming requests to ensure high-availability performance and prevent abuse."
  - type: "component"
    name: "Reverse Proxy"
    technology: "NGINX / Kong Core Proxy"
    description: "Routes verified requests to backend microservices via HTTP/2 over TLS 1.3 (mTLS)."
relationships:
  - source: "WAF"
    destination: "JWT Validation"
    description: "Passes inspected requests for authentication"
  - source: "JWT Validation"
    destination: "Rate Limiting"
    description: "Passes authenticated requests for rate limit evaluation"
  - source: "Rate Limiting"
    destination: "Reverse Proxy"
    description: "Forwards allowed requests to internal microservices"