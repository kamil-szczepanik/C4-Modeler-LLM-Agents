level: component
scope: "Component diagram for the Patron Self-Service Portal container"
parentContainer:
  name: "Patron Self-Service Portal"
elements:
  - type: "component"
    name: "UI Routing & Layout Component"
    technology: "React / TypeScript"
    description: "Manages client-side routing, layout structure, and navigation across the portal."
  - type: "component"
    name: "Catalogue Search & Discovery Component"
    technology: "React / TypeScript"
    description: "Enables public and academic library patrons to discover catalogue items."
  - type: "component"
    name: "Loan & Account Management Component"
    technology: "React / TypeScript"
    description: "Allows patrons to manage their loans and account details."
  - type: "component"
    name: "Payment & Fine Settlement Component"
    technology: "React / TypeScript"
    description: "Handles the UI flow for settling fines and making payments securely."
  - type: "component"
    name: "Digital Content Viewer Component"
    technology: "React / TypeScript"
    description: "Provides viewing capabilities for digital content and e-books."
  - type: "component"
    name: "Library Patrons"
    technology: "Person"
    description: "Students and public users accessing self-service portals."
  - type: "component"
    name: "API Gateway"
    technology: "NGINX / Kong"
    description: "Handles TLS termination, WAF policies, and routing for all incoming traffic."
  - type: "component"
    name: "Circulation & Loan Service"
    technology: "Node.js / Express"
    description: "Manages item circulation, loans, and transactional state."
  - type: "component"
    name: "Identity Provider"
    technology: "Keycloak / Auth0 EU"
    description: "Authentication and identity management."
  - type: "component"
    name: "Digital Content Providers"
    technology: "External e-Book Vendors"
    description: "External providers of digital e-Book content."
relationships:
  - source: "Patron Self-Service Portal"
    destination: "API Gateway"
    description: "HTTPS / TLS 1.3"
  - source: "Patron Self-Service Portal"
    destination: "Identity Provider"
    description: "OIDC / OAuth 2.0 over HTTPS with PKCE"
  - source: "Payment & Fine Settlement Component"
    destination: "Circulation & Loan Service"
    description: "REST / HTTPS over TLS 1.3 via Gateway"
  - source: "Digital Content Viewer Component"
    destination: "Digital Content Providers"
    description: "REST / HTTPS over TLS 1.3"