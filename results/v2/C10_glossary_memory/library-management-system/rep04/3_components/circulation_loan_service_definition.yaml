level: component
scope: "Component diagram for the Circulation & Loan Service container"
parentContainer:
  name: "Circulation & Loan Service"
elements:
  - type: "component"
    name: "Loan Orchestrator"
    technology: "Node.js / Express"
    description: "Orchestrates item circulation, loans, and transactional state."
  - type: "component"
    name: "Fine & Fee Manager"
    technology: "Node.js / Express"
    description: "Manages fine and fee collection and processing."
  - type: "component"
    name: "Loan Data Access Repository"
    technology: "Sequelize ORM"
    description: "Manages transactional state against PostgreSQL with strict ACID isolation."
  - type: "component"
    name: "Event Publisher"
    technology: "amqplib"
    description: "Publishes asynchronous events to the message broker."
  - type: "component"
    name: "API Gateway"
    technology: "NGINX / Kong"
    description: "Handles TLS termination, WAF policies, and routing for all incoming traffic."
  - type: "component"
    name: "PostgreSQL Database"
    technology: "PostgreSQL 15"
    description: "Stores transactional state and analytics data."
  - type: "component"
    name: "RabbitMQ"
    technology: "Message Broker"
    description: "Facilitates asynchronous event-driven messaging."
  - type: "component"
    name: "Payment Gateway"
    technology: "Adyen/Stripe EU"
    description: "External payment processing."
relationships:
  - source: "API Gateway"
    destination: "Loan Orchestrator"
    description: "HTTP/2 reverse proxy"
  - source: "Loan Orchestrator"
    destination: "Fine & Fee Manager"
    description: "In-memory function call"
  - source: "Loan Orchestrator"
    destination: "Loan Data Access Repository"
    description: "TypeScript Async/Await"
  - source: "Loan Orchestrator"
    destination: "Event Publisher"
    description: "AMQP protocol"
  - source: "Fine & Fee Manager"
    destination: "Payment Gateway"
    description: "REST / HTTPS over TLS 1.3"
  - source: "Loan Data Access Repository"
    destination: "PostgreSQL Database"
    description: "SQL / PostgreSQL protocol over TLS 1.3"
  - source: "Event Publisher"
    destination: "RabbitMQ"
    description: "AMQP over TLS 1.3"