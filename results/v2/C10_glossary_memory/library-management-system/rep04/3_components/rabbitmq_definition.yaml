level: component
scope: "Component diagram for the RabbitMQ container"
parentContainer:
  name: "RabbitMQ"
elements:
  - type: "component"
    name: "Exchange Router"
    technology: "Erlang / Direct & Topic Exchanges"
    description: "Routes incoming published messages to target queues based on exchange rules."
  - type: "component"
    name: "Queue Manager"
    technology: "Erlang / Mnesia"
    description: "Manages queue state, durable message storage, and queue operations."
  - type: "component"
    name: "DLQ & Policy Engine"
    technology: "Erlang"
    description: "Handles poisoned messages and routes them to dead-letter queues according to defined policies."
  - type: "component"
    name: "Metrics Exporter"
    technology: "Erlang / Prometheus Plugin"
    description: "Extracts runtime and depth metrics for monitoring with low overhead."
  - type: "component"
    name: "Catalog & Search Service"
    technology: "Spring Boot, Elasticsearch"
    description: "External service publishing catalogue events to the broker."
  - type: "component"
    name: "Circulation & Loan Service"
    technology: "Node.js / Express"
    description: "External service publishing loan and payment events to the broker."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Go"
    description: "External service consuming queued events to dispatch asynchronous notifications."
relationships:
  - source: "Catalog & Search Service"
    destination: "Exchange Router"
    description: "Publishes catalogue events [AMQP 0-9-1 over TLS 1.3 with mTLS]"
  - source: "Circulation & Loan Service"
    destination: "Exchange Router"
    description: "Publishes loan and payment events [AMQP 0-9-1 over TLS 1.3 with mTLS]"
  - source: "Exchange Router"
    destination: "Queue Manager"
    description: "Dispatches messages to target queues [Internal Erlang messaging]"
  - source: "Queue Manager"
    destination: "Notification Dispatcher"
    description: "Consumes queued events [AMQP 0-9-1 over TLS 1.3]"
  - source: "Queue Manager"
    destination: "DLQ & Policy Engine"
    description: "Routes poisoned messages [Internal Erlang messaging]"
  - source: "Queue Manager"
    destination: "Metrics Exporter"
    description: "Feeds runtime and depth metrics [Internal Erlang messaging]"