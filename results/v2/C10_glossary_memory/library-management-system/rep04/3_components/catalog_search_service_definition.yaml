level: component
scope: "Component diagram for the Catalog & Search Service container"
parentContainer:
  name: "Catalog & Search Service"
elements:
  - type: "component"
    name: "Catalog & Search Controller"
    technology: "Spring MVC REST Controller"
    description: "Exposes HTTP endpoints for catalog discovery, faceted search queries, and digital content aggregation, enforcing the <800ms SLA."
  - type: "component"
    name: "Search Query Engine"
    technology: "Spring Boot Service, Elasticsearch Client"
    description: "Processes search queries, optimizes indexing, and manages high-performance caching for rapid item discovery."
  - type: "component"
    name: "Content Integrator"
    technology: "Spring WebClient / RestTemplate"
    description: "Integrates with external Digital Content Providers to fetch and cache e-Book and digital metadata securely over TLS 1.3."
  - type: "component"
    name: "Event Publisher"
    technology: "Spring AMQP"
    description: "Publishes catalog and search-related domain events asynchronously to RabbitMQ using AMQP over TLS 1.3."
relationships:
  - source: "Catalog & Search Controller"
    destination: "Search Query Engine"
    description: "Delegates search and retrieval requests"
  - source: "Search Query Engine"
    destination: "Content Integrator"
    description: "Requests digital metadata from external content providers when needed"
  - source: "Search Query Engine"
    destination: "Event Publisher"
    description: "Dispatches search index and catalog modification events"