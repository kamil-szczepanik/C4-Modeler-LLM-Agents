level: component
scope: "Component diagram for the Reporting & Analytics Service container"
parentContainer:
  name: "Reporting & Analytics Service"
elements:
  - type: "component"
    name: "API Controller"
    technology: "FastAPI Router"
    description: "Routes HTTP/2 reverse proxy requests and manages low-latency asynchronous API handling."
  - type: "component"
    name: "Report Generation Engine"
    technology: "Pandas / NumPy"
    description: "Processes heavy data frames for executive reports and delegates tasks via internal Python function calls."
  - type: "component"
    name: "Data Access Repository"
    technology: "SQLAlchemy"
    description: "Fetches pseudonymized data using SQLAlchemy ORM and SQL queries."
  - type: "component"
    name: "Alert Evaluation Worker"
    technology: "Celery / Background Tasks"
    description: "Manages asynchronous background worker tasks, queues, and triggers threshold alerts."
  - type: "component"
    name: "Administration Console"
    technology: "Web App"
    description: "Console for library administrators to manage reporting, inventory, and budgets."
  - type: "component"
    name: "Circulation & Loan Service"
    technology: "Node.js / Express"
    description: "Manages item circulation, loans, and transactional state."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Go"
    description: "Dispatches asynchronous notifications."
  - type: "component"
    name: "PostgreSQL Database"
    technology: "PostgreSQL 15"
    description: "Stores transactional state and analytics data using read-replicas."
relationships:
  - source: "API Gateway"
    destination: "API Controller"
    description: "Routes HTTP/2 reverse proxy requests"
  - source: "Circulation & Loan Service"
    destination: "API Controller"
    description: "Handles interservice communication via gRPC over TLS 1.3 / mTLS"
  - source: "API Controller"
    destination: "Report Generation Engine"
    description: "Delegates tasks via internal Python function call / task queue"
  - source: "Report Generation Engine"
    destination: "Data Access Repository"
    description: "Fetches pseudonymized data using SQLAlchemy ORM / SQL query"
  - source: "Data Access Repository"
    destination: "PostgreSQL Database"
    description: "Queries analytics data using SQL / PostgreSQL protocol"
  - source: "Alert Evaluation Worker"
    destination: "Notification Dispatcher"
    description: "Triggers threshold alerts via gRPC over TLS 1.3"