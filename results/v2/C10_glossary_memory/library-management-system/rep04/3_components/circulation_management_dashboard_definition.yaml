level: component
scope: "Component diagram for the Circulation Management Dashboard container"
parentContainer:
  name: "Circulation Management Dashboard"
elements:
  - type: "component"
    name: "IndexedDB Local Cache"
    technology: "IndexedDB with Web Crypto API"
    description: "Provides encrypted client-side storage to safely buffer offline transactions at rest."
  - type: "component"
    name: "Sync Manager"
    technology: "TypeScript"
    description: "Manages encrypted offline operations and flushes queued offline transactions to the API Gateway."
  - type: "component"
    name: "Loan Processing Component"
    technology: "React / TypeScript"
    description: "Empowers staff to execute rapid check-outs, returns, and processes loans via the Circulation & Loan Service."
  - type: "component"
    name: "Exception Management Component"
    technology: "React / TypeScript"
    description: "Handles exception management and resolves workflow anomalies."
relationships:
  - source: "Librarians / Circulation Staff"
    destination: "Circulation Management Dashboard"
    description: "Interacts with circulation workflows [HTTPS]"
  - source: "Circulation Management Dashboard"
    destination: "API Gateway"
    description: "Routes synchronous operational commands and flushes queued offline transactions [REST / JSON over HTTPS / TLS 1.3]"
  - source: "Circulation Management Dashboard"
    destination: "Identity Provider"
    description: "Manages session tokens and authentication [OIDC / OAuth 2.0 over HTTPS with PKCE]"
  - source: "Circulation Management Dashboard"
    destination: "Circulation & Loan Service"
    description: "Processes loans and resolves exceptions (via API Gateway) [REST / JSON over HTTPS / TLS 1.3]"