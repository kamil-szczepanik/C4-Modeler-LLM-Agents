level: component
scope: "Component diagram for the Notification Service container"
parentContainer:
  name: "Notification Service"
elements:
  - type: "component"
    name: "Notification API Handler"
    technology: "Express.js, TypeScript"
    description: "Exposes gRPC/HTTP endpoints for secure ingress from core services."
  - type: "component"
    name: "Message Dispatcher Engine"
    technology: "Node.js, TypeScript"
    description: "Buffers traffic spikes and decouples ingestion from dispatch."
  - type: "component"
    name: "Channel Adapter Module"
    technology: "Node.js, TypeScript"
    description: "Handles secure message dispatch to external providers."
  - type: "component"
    name: "Template & Localization Manager"
    technology: "Node.js, TypeScript"
    description: "Manages message templates and localization requirements."
  - type: "component"
    name: "Preference & Consent Manager"
    technology: "Node.js, TypeScript"
    description: "Validates patron preferences and GDPR consent states."
  - type: "component"
    name: "RabbitMQ/Kafka Message Broker"
    technology: "RabbitMQ/Kafka"
    description: "Buffers traffic spikes during bulk notification events."
  - type: "component"
    name: "Redis In-Memory Cache"
    technology: "Redis"
    description: "Caches GDPR consent states to maintain low dispatch latencies."
  - type: "component"
    name: "EU-Hosted Email/SMS Providers"
    technology: "External Service"
    description: "Delivers messages to library patrons and staff via secure channels."
  - type: "component"
    name: "Primary Database & Read Replica"
    technology: "PostgreSQL"
    description: "Persists user consent settings within strict EU data residency boundaries."
relationships:
  - source: "Core API Gateway / Circulation Service"
    destination: "Notification API Handler"
    description: "gRPC, mTLS"
  - source: "Notification API Handler"
    destination: "RabbitMQ/Kafka Message Broker"
    description: "AMQP / Kafka Protocol"
  - source: "Message Dispatcher Engine"
    destination: "Preference & Consent Manager"
    description: "Internal Function Call"
  - source: "Preference & Consent Manager"
    destination: "Primary Database & Read Replica"
    description: "PostgreSQL Protocol"
  - source: "Message Dispatcher Engine"
    destination: "Channel Adapter Module"
    description: "Internal Function Call"
  - source: "Channel Adapter Module"
    destination: "EU-Hosted Email/SMS Providers"
    description: "HTTPS, TLS 1.3"