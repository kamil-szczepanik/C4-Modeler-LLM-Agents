level: component
scope: "Component diagram for the Patron Web App container"
parentContainer:
  name: "Patron Web App"
elements:
  - type: "component"
    name: "Search & Discovery UI"
    technology: "React, TypeScript"
    description: "Provides high-performance client-side rendering for searching library catalogs."
  - type: "component"
    name: "Account & Circulation Portal"
    technology: "React, TypeScript"
    description: "Enables library patrons to manage accounts and handle self-service circulation securely."
  - type: "component"
    name: "Payment Integration Client"
    technology: "React, TypeScript"
    description: "Handles secure payment workflows for library patrons."
  - type: "component"
    name: "Auth Client Module"
    technology: "OIDC Client"
    description: "Manages secure authentication and token exchange using OIDC with PKCE."
relationships:
  - source: "Search & Discovery UI"
    destination: "Core API Gateway"
    description: "HTTPS (TLS 1.3), JSON"
  - source: "Account & Circulation Portal"
    destination: "Core API Gateway"
    description: "HTTPS (TLS 1.3), JSON"
  - source: "Payment Integration Client"
    destination: "Core API Gateway"
    description: "HTTPS (TLS 1.3), JSON"
  - source: "Auth Client Module"
    destination: "EU Identity Provider (IdP)"
    description: "OIDC over HTTPS, TLS 1.3 with PKCE"