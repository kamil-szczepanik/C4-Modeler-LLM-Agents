level: component
scope: "Component diagram for the Staff Web App container"
parentContainer:
  name: "Staff Web App"
elements:
  - type: "component"
    name: "Circulation Desk Component"
    technology: "Angular"
    description: "Provides offline-resilient circulation desk workflows and local caching with IndexedDB."
  - type: "component"
    name: "Catalog Management Component"
    technology: "Angular"
    description: "Handles catalog management and administrative library interfaces."
  - type: "component"
    name: "Admin Dashboard Component"
    technology: "Angular"
    description: "Provides robust administrative workflows and overview dashboards."
  - type: "component"
    name: "Auth Guard & State Service"
    technology: "Angular"
    description: "Manages state and enforces authentication token exchange via OIDC."
relationships:
  - source: "Librarians"
    destination: "Staff Web App"
    description: "Accesses via HTTPS, TLS 1.3"
  - source: "Library Administrators"
    destination: "Staff Web App"
    description: "Accesses via HTTPS, TLS 1.3"
  - source: "Staff Web App"
    destination: "Core API Gateway"
    description: "Sends API traffic via HTTPS, TLS 1.3"
  - source: "Auth Guard & State Service"
    destination: "EU Identity Provider (IdP)"
    description: "Authenticates via OIDC over HTTPS"
  - source: "Circulation Desk Component"
    destination: "Circulation Service"
    description: "Invokes via Core API Gateway using HTTPS, TLS 1.3"
  - source: "Catalog Management Component"
    destination: "Catalog & Search Service"
    description: "Invokes via Core API Gateway using HTTPS, TLS 1.3"