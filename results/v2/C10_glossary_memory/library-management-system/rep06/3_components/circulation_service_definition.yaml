level: component
scope: "Component diagram for the Circulation Service container"
parentContainer:
  name: "Circulation Service"
elements:
  - type: "component"
    name: "Loan Management Component"
    technology: "Spring Data JPA"
    description: "Manages patron loans and borrowing history with EU-compliant handling."
  - type: "component"
    name: "Hold & Reservation Component"
    technology: "Java"
    description: "Handles item holds and reservations."
  - type: "component"
    name: "Fine Management Component"
    technology: "Java"
    description: "Manages fine settlements and financial transactions."
  - type: "component"
    name: "Audit Logging Component"
    technology: "Java"
    description: "Provides audit logging for circulation and access activities."
relationships:
  - source: "Core API Gateway"
    destination: "Circulation Service"
    description: "gRPC / HTTPS, mTLS"
  - source: "Fine Management Component"
    destination: "Payment Gateway"
    description: "REST/JSON, mTLS over HTTPS with Idempotency Keys"
  - source: "Loan Management Component"
    destination: "Notification Service"
    description: "AMQP / RabbitMQ"
  - source: "Loan Management Component"
    destination: "Primary Database & Read Replica"
    description: "PostgreSQL Protocol over TLS 1.3"
  - source: "Fine Management Component"
    destination: "Primary Database & Read Replica"
    description: "PostgreSQL Protocol over TLS 1.3"
  - source: "Loan Management Component"
    destination: "Hold & Reservation Component"
    description: "In-process / Java Method Call"