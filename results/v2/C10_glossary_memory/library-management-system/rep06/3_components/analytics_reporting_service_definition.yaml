level: component
scope: "Component diagram for the Analytics & Reporting Service container"
parentContainer:
  name: "Analytics & Reporting Service"
elements:
  - type: "component"
    name: "Circulation Analytics Component"
    technology: "Python, Pandas"
    description: "Queries and analyzes circulation data from the primary database read replica."
  - type: "component"
    name: "Usage & Engagement Reporting Component"
    technology: "Python, Pandas"
    description: "Queries and processes usage and engagement metrics."
  - type: "component"
    name: "Report Generation & Export Component"
    technology: "Python, ReportLab/Openpyxl"
    description: "Generates export artifacts and queues background export tasks."
  - type: "component"
    name: "Report Export Job Queue"
    technology: "Celery, Redis/RabbitMQ"
    description: "Manages asynchronous report export job tasks and worker pools."
  - type: "component"
    name: "EU-Pinned Object Storage"
    technology: "S3-compatible storage"
    description: "Secures and stores exported report artifacts within compliant EU boundaries."
relationships:
  - source: "Circulation Analytics Component"
    destination: "Primary Database & Read Replica"
    description: "Queries analytical data [PostgreSQL Protocol, Read Replica]"
  - source: "Usage & Engagement Reporting Component"
    destination: "Primary Database & Read Replica"
    description: "Queries engagement data [PostgreSQL Protocol, Read Replica]"
  - source: "Report Generation & Export Component"
    destination: "Report Export Job Queue"
    description: "Queues export tasks [AMQP / Redis Protocol]"
  - source: "Report Generation & Export Component"
    destination: "EU-Pinned Object Storage"
    description: "Stores export artifacts [HTTPS, TLS 1.3]"