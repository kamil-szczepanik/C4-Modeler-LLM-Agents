level: component
scope: "Component diagram for the Core API Gateway container"
parentContainer:
  name: "Core API Gateway"
elements:
  - type: "component"
    name: "Authentication Filter Component"
    technology: "Envoy OAuth2/OIDC filter"
    description: "Validates tokens and manages edge security authentication."
  - type: "component"
    name: "Rate Limiting Component"
    technology: "Redis-backed Token Bucket"
    description: "Powers high-performance rate limiting aligned with EU data residency."
  - type: "component"
    name: "Request Prioritization & Shaping Component"
    technology: "Envoy Traffic Director"
    description: "Enforces traffic shaping and prioritization to meet search SLAs."
  - type: "component"
    name: "Circuit Breaker & Resilience Component"
    technology: "Spring Cloud Circuit Breaker"
    description: "Provides resilience and fault tolerance for gateway routing."
  - type: "component"
    name: "Routing & Load Balancing Component"
    technology: "Spring Cloud Gateway"
    description: "Manages edge routing, traffic distribution, and load balancing."
relationships:
  - source: "Library Patrons"
    destination: "Core API Gateway"
    description: "Sends API requests [HTTPS, TLS 1.3]"
  - source: "Core API Gateway"
    destination: "EU Identity Provider (IdP)"
    description: "Validates tokens [OIDC over HTTPS]"
  - source: "Core API Gateway"
    destination: "Catalog & Search Service"
    description: "Routes queries [gRPC, mTLS]"
  - source: "Core API Gateway"
    destination: "Circulation Service"
    description: "Routes requests [gRPC, mTLS]"