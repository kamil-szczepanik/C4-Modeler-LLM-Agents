level: component
scope: "Component diagram for the Catalog & Search Service container"
parentContainer:
  name: "Catalog & Search Service"
elements:
  - type: "component"
    name: "Search Controller"
    technology: "Java, Spring Boot"
    description: "Exposes endpoints for catalog search and handles incoming requests."
  - type: "component"
    name: "Search Engine Client"
    technology: "Java, Spring Boot"
    description: "Communicates with the Elasticsearch cluster to execute search queries."
  - type: "component"
    name: "Catalog Manager"
    technology: "Java, Spring Boot"
    description: "Manages catalog items and interacts with the primary database and digital content providers."
  - type: "component"
    name: "Metadata Indexer"
    technology: "Java, Spring Boot"
    description: "Indexes catalog metadata into the Elasticsearch cluster."
  - type: "component"
    name: "Digital Asset Synchronizer"
    technology: "Java, Spring Boot"
    description: "Synchronizes digital assets and content providers with the system."
relationships:
  - source: "Search Controller"
    destination: "Search Engine Client"
    description: "In-Memory Java API"
  - source: "Search Engine Client"
    destination: "Elasticsearch Cluster"
    description: "Transport Client / REST over HTTPS, mTLS"
  - source: "Catalog Manager"
    destination: "Primary Database & Read Replica"
    description: "PostgreSQL Protocol, SCRAM-SHA-256, TLS"
  - source: "Catalog Manager"
    destination: "Digital Content Providers"
    description: "HTTPS (REST API), TLS 1.3, Certificate Pinning"
  - source: "Metadata Indexer"
    destination: "Elasticsearch Cluster"
    description: "REST over HTTPS, mTLS"