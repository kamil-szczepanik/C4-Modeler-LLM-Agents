level: component
scope: "Component diagram for the Primary Database & Read Replica container"
parentContainer:
  name: "Primary Database & Read Replica"
elements:
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Connection pooling to prevent resource exhaustion from microservices and route traffic."
  - type: "component"
    name: "Primary Database Instance"
    technology: "PostgreSQL 15"
    description: "Core relational database engine for robust ACID compliance and write transactions."
  - type: "component"
    name: "Read Replica Instance"
    technology: "PostgreSQL 15"
    description: "Handles heavy read traffic to ensure uninterrupted self-service borrowing and sub-800ms search responses."
  - type: "component"
    name: "Failover & Consensus Manager"
    technology: "Patroni / etcd"
    description: "Automated high-availability failover and consensus management, monitoring health."
relationships:
  - source: "Connection Pooler"
    destination: "Primary Database Instance"
    description: "Routes write transactions [PostgreSQL Protocol, TLS 1.3]"
  - source: "Connection Pooler"
    destination: "Read Replica Instance"
    description: "Routes read queries [PostgreSQL Protocol, TLS 1.3]"
  - source: "Primary Database Instance"
    destination: "Read Replica Instance"
    description: "Replicates data [Streaming Replication, TLS 1.3]"
  - source: "Failover & Consensus Manager"
    destination: "Primary Database Instance"
    description: "Monitors health and manages failover [TCP/HTTP]"
  - source: "Failover & Consensus Manager"
    destination: "Read Replica Instance"
    description: "Monitors health and manages promotion [TCP/HTTP]"