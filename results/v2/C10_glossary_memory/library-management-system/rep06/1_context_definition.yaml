level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Provides cataloging, circulation, and self-service portals while enforcing EU data residency, high-performance search, and role-based access control."
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public users who access the self-service portals and search the catalog."
  - type: "person"
    name: "Librarians"
    description: "Circulation staff who manage daily library operations and patron accounts."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators who oversee system configurations and manage diverse user personas."
  - type: "externalSystem"
    name: "EU Identity Provider (IdP)"
    description: "Manages authentication and token exchange using OIDC."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Processes transactions via REST/JSON over HTTPS."
  - type: "externalSystem"
    name: "Digital Content Providers"
    description: "Supplies external digital content and media via APIs over HTTPS."
relationships:
  - source: "Library Patrons"
    destination: "Library Management System"
    description: "Accesses self-service portals and cataloging"
    technology: "HTTPS (TLS 1.3)"
  - source: "Librarians"
    destination: "Library Management System"
    description: "Manages circulation and library operations"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Administrators"
    destination: "Library Management System"
    description: "Performs administrative tasks and role-based access control"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Management System"
    destination: "EU Identity Provider (IdP)"
    description: "Authenticates users and handles token exchange"
    technology: "OIDC over HTTPS"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Processes payments for fines and services"
    technology: "REST/JSON over HTTPS"
  - source: "Library Management System"
    destination: "Digital Content Providers"
    description: "Retrieves digital content and media resources"
    technology: "API over HTTPS"