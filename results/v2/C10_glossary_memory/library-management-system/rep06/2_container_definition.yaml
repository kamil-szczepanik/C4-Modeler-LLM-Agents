level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public users who access the self-service portals and search the catalog."
  - type: "person"
    name: "Librarians"
    description: "Circulation staff who manage daily library operations and patron accounts."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators who oversee system configurations and manage diverse user personas."
  - type: "externalSystem"
    name: "EU Identity Provider (IdP)"
    description: "Manages authentication and token exchange using OIDC."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Processes transactions via REST/JSON over HTTPS."
  - type: "externalSystem"
    name: "Digital Content Providers"
    description: "Supplies external digital content and media via APIs over HTTPS."
  - type: "container"
    name: "Patron Web App"
    technology: "React, TypeScript"
    description: "Powers the responsive Patron Web App for fast client-side rendering."
  - type: "container"
    name: "Staff Web App"
    technology: "Angular, TypeScript"
    description: "Structures the robust Staff Web App for administrative workflows."
  - type: "container"
    name: "Core API Gateway"
    technology: "Envoy, Spring Cloud Gateway"
    description: "Routes and manages incoming traffic and security boundaries."
  - type: "container"
    name: "Catalog & Search Service"
    technology: "Java, Spring Boot, Elasticsearch"
    description: "Implements high-performance microservices and meets the sub-800ms search SLA."
  - type: "container"
    name: "Circulation Service"
    technology: "Java, Spring Boot"
    description: "Manages circulation workflows and patron accounts."
  - type: "container"
    name: "Notification Service"
    technology: "Node.js, TypeScript, RabbitMQ/Kafka"
    description: "Handles asynchronous notifications and messaging."
  - type: "container"
    name: "Analytics & Reporting Service"
    technology: "Python, FastAPI"
    description: "Processes reporting and analytics workloads."
  - type: "container"
    name: "Primary Database & Read Replica"
    technology: "PostgreSQL"
    description: "Manages transactional data with strict EU-only data residency constraints."
relationships:
  - source: "Library Patrons"
    destination: "Patron Web App"
    description: "Accesses self-service portals and searches the catalog"
    technology: "HTTPS, TLS 1.3"
  - source: "Librarians"
    destination: "Staff Web App"
    description: "Manages daily library operations and patron accounts"
    technology: "HTTPS, TLS 1.3"
  - source: "Library Administrators"
    destination: "Staff Web App"
    description: "Oversees system configurations and user personas"
    technology: "HTTPS, TLS 1.3"
  - source: "Patron Web App"
    destination: "Core API Gateway"
    description: "Sends API requests"
    technology: "HTTPS, TLS 1.3"
  - source: "Staff Web App"
    destination: "Core API Gateway"
    description: "Sends API requests"
    technology: "HTTPS, TLS 1.3"
  - source: "Core API Gateway"
    destination: "Catalog & Search Service"
    description: "Routes search and catalog queries"
    technology: "gRPC / HTTPS, mTLS"
  - source: "Core API Gateway"
    destination: "Circulation Service"
    description: "Routes circulation requests"
    technology: "gRPC / HTTPS, mTLS"
  - source: "Core API Gateway"
    destination: "Notification Service"
    description: "Triggers notifications"
    technology: "gRPC / HTTPS, mTLS"
  - source: "Core API Gateway"
    destination: "Analytics & Reporting Service"
    description: "Sends reporting requests"
    technology: "gRPC / HTTPS, mTLS"
  - source: "Core API Gateway"
    destination: "EU Identity Provider (IdP)"
    description: "Authenticates users and validates tokens"
    technology: "OIDC over HTTPS"
  - source: "Circulation Service"
    destination: "Payment Gateway"
    description: "Processes fines and financial transactions"
    technology: "REST/JSON, mTLS over HTTPS"
  - source: "Catalog & Search Service"
    destination: "Primary Database & Read Replica"
    description: "Reads and writes catalog data"
    technology: "PostgreSQL Protocol"
  - source: "Circulation Service"
    destination: "Primary Database & Read Replica"
    description: "Reads and writes transaction and user data"
    technology: "PostgreSQL Protocol"
  - source: "Core API Gateway"
    destination: "Digital Content Providers"
    description: "Retrieves digital content and media resources"
    technology: "API over HTTPS"