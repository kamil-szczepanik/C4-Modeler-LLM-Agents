level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Relational Data Store"
    technology: "PostgreSQL Engine"
    description: "Provides robust ACID compliance and row-level security for transactional integrity."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Manages and optimizes incoming database connections under peak load."
  - type: "component"
    name: "Audit Logging Module"
    technology: "pgAudit"
    description: "Captures security-relevant DDL/DML events for compliance."
  - type: "component"
    name: "HA Failover Manager"
    technology: "Patroni"
    description: "Handles automated leader election and high availability across availability zones."
  - type: "component"
    name: "Backup & Archival Agent"
    technology: "Barman / WAL-G"
    description: "Manages continuous WAL archiving and point-in-time recovery."
  - type: "component"
    name: "Circulation Service"
    technology: "Node.js / NestJS"
    description: "Manages loans, fines, and business integrations."
  - type: "component"
    name: "Catalog & Search Service"
    technology: "Java, Spring Boot + Elasticsearch"
    description: "Dedicated to meeting sub-800ms search and cataloging requirements."
relationships:
  - source: "Circulation Service"
    destination: "Connection Pooler"
    description: "Submits loan and fine transactions [SQL over mTLS]"
  - source: "Catalog & Search Service"
    destination: "Connection Pooler"
    description: "Queries and updates item metadata [SQL over mTLS]"
  - source: "Connection Pooler"
    destination: "Relational Data Store"
    description: "Forwards pooled queries [TCP/IP]"
  - source: "Relational Data Store"
    destination: "Audit Logging Module"
    description: "Emits audit logs [Internal IPC]"