level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Router & Reverse Proxy"
    technology: "NGINX / Envoy"
    description: "Provides high-performance edge routing and load balancing for incoming requests."
  - type: "component"
    name: "TLS Termination & Security Manager"
    technology: "NGINX / Envoy"
    description: "Handles mTLS termination and enforces secure communication boundaries."
  - type: "component"
    name: "Rate Limiter & Auth Validator"
    technology: "NGINX / Envoy"
    description: "Applies rate limiting rules and validates OIDC tokens against the Identity Provider."
relationships:
  - source: "Edge Router & Reverse Proxy"
    destination: "TLS Termination & Security Manager"
    description: "Passes decrypted traffic securely"
  - source: "TLS Termination & Security Manager"
    destination: "Rate Limiter & Auth Validator"
    description: "Evaluates authentication and request rate"