level: component
scope: "Component diagram for the Catalog & Search Service container"
parentContainer:
  name: "Catalog & Search Service"
elements:
  - type: "component"
    name: "Search Query Engine"
    technology: "Java, Spring Data Elasticsearch"
    description: "Handles high-performance search queries ensuring sub-800ms response times."
  - type: "component"
    name: "Catalog Management API"
    technology: "Java, Spring MVC"
    description: "Manages cataloging operations and librarian updates securely."
  - type: "component"
    name: "Index Synchronization Worker"
    technology: "Java, Spring Integration"
    description: "Asynchronous worker responsible for event-driven index synchronization."
  - type: "component"
    name: "Elasticsearch Index"
    technology: "Elasticsearch"
    description: "High-speed search index for fast retrieval."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL"
    description: "Relational database providing ACID-compliant transactional persistence."
  - type: "container"
    name: "API Gateway"
    technology: "NGINX / Envoy"
    description: "Edge routing, TLS termination, and OIDC token validation."
  - type: "container"
    name: "Message Broker"
    technology: "Apache Kafka / RabbitMQ"
    description: "Asynchronous message broker for event-driven index synchronization."
  - type: "container"
    name: "Audit Service"
    technology: "Go"
    description: "High-performance audit logging service ensuring compliance with security constraints."
relationships:
  - source: "API Gateway"
    destination: "Search Query Engine"
    description: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Catalog Management API"
    description: "gRPC over mTLS"
  - source: "Search Query Engine"
    destination: "Elasticsearch Index"
    description: "Internal Java API / Transport over mTLS"
  - source: "Catalog Management API"
    destination: "Database"
    description: "SQL over mTLS"
  - source: "Index Synchronization Worker"
    destination: "Message Broker"
    description: "AMQP/Kafka Protocol over mTLS"
  - source: "Index Synchronization Worker"
    destination: "Database"
    description: "SQL over mTLS"
  - source: "Catalog Management API"
    destination: "Audit Service"
    description: "REST over mTLS"