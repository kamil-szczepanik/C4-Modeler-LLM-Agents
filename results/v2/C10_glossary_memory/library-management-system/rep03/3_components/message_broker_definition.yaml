level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Kafka Event Bus"
    technology: "Apache Kafka"
    description: "Persistent, event-driven message broker supporting dead-letter queues and EU data residency for asynchronous communication between services."
  - type: "component"
    name: "Catalog Events Topic"
    technology: "Kafka Topic"
    description: "Stores catalog and search-related asynchronous events."
  - type: "component"
    name: "Circulation Events Topic"
    technology: "Kafka Topic"
    description: "Stores loan, fine, and circulation-related asynchronous events."
  - type: "component"
    name: "Audit Events Topic"
    technology: "Kafka Topic"
    description: "Stores security and compliance audit event streams."
relationships:
  - source: "Catalog & Search Service"
    destination: "Kafka Event Bus"
    description: "Publishes and consumes search-related events over mTLS"
  - source: "Circulation Service"
    destination: "Kafka Event Bus"
    description: "Publishes and consumes circulation-related events over mTLS"
  - source: "Audit Service"
    destination: "Kafka Event Bus"
    description: "Consumes audit logs and compliance events over mTLS"