level: component
scope: "Component diagram for the Audit Service container"
parentContainer:
  name: "Audit Service"
elements:
  - type: "component"
    name: "Audit Consumer"
    technology: "Go"
    description: "Consumes audit events from the message broker and writes them to the audit database."
  - type: "component"
    name: "Audit API Handler"
    technology: "Go"
    description: "Handles incoming API requests for audit data and queries the audit database."
  - type: "component"
    name: "Audit Database"
    technology: "PostgreSQL"
    description: "Immutable audit data store enforcing EU-only data residency."
relationships:
  - source: "Message Broker"
    destination: "Audit Consumer"
    description: "AMQP/Kafka Protocol over mTLS"
  - source: "API Gateway"
    destination: "Audit API Handler"
    description: "gRPC over mTLS"
  - source: "Audit Consumer"
    destination: "Audit Database"
    description: "SQL over mTLS"
  - source: "Audit API Handler"
    destination: "Audit Database"
    description: "SQL over mTLS"