level: component
scope: "Component diagram for the Circulation Service container"
parentContainer:
  name: "Circulation Service"
elements:
  - type: "component"
    name: "Circulation Controller"
    technology: "NestJS Controller"
    description: "Handles incoming REST/gRPC endpoints for loan, return, and fine operations."
  - type: "component"
    name: "Loan Management Service"
    technology: "NestJS Service"
    description: "Contains business logic for processing book loans, renewals, and returns."
  - type: "component"
    name: "Fine Management Service"
    technology: "NestJS Service"
    description: "Manages fine calculations and processing integration."
  - type: "component"
    name: "Database Repository"
    technology: "TypeORM / PostgreSQL Client"
    description: "Handles secure persistence and querying of relational transactional data."
relationships:
  - source: "Circulation Controller"
    destination: "Loan Management Service"
    description: "Delegates loan and return requests"
  - source: "Circulation Controller"
    destination: "Fine Management Service"
    description: "Delegates fine settlement operations"
  - source: "Loan Management Service"
    destination: "Database Repository"
    description: "Reads and writes transactional data"
  - source: "Fine Management Service"
    destination: "Database Repository"
    description: "Updates fine records"