# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Provides cataloging, circulation management, and self-service portals for public and academic libraries while enforcing strict EU-only data residency and high-performance search capabilities."
elements:
  - type: "person"
    name: "Library Member (Patron)"
    description: "End-user who accesses self-service portals for searching catalogs and managing loans."
  - type: "person"
    name: "Librarian / Staff"
    description: "Library personnel who manage circulation, cataloging, and day-to-day operations."
  - type: "person"
    name: "Library Administrator"
    description: "System administrator responsible for managing the library management system configuration and settings."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system used for processing fine settlements."
  - type: "externalSystem"
    name: "Notification Provider"
    description: "External system used for sending out loan reminders and alerts."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External system used for user authentication and identity management."
relationships:
  - source: "Library Member (Patron)"
    destination: "Library Management System"
    description: "Interacts with the system via self-service portals"
    technology: "HTTPS / TLS 1.3"
  - source: "Librarian / Staff"
    destination: "Library Management System"
    description: "Manages circulation and cataloging"
    technology: "HTTPS / TLS 1.3"
  - source: "Library Administrator"
    destination: "Library Management System"
    description: "Administers the system"
    technology: "HTTPS / TLS 1.3"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Integrates for fine settlements"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "Notification Provider"
    description: "Integrates for loan reminders"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OIDC/OAuth2 over HTTPS"