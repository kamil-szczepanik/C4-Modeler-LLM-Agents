level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Member (Patron)"
    description: "End-user who accesses self-service portals for searching catalogs and managing loans."
  - type: "person"
    name: "Librarian / Staff"
    description: "Library personnel who manage circulation, cataloging, and day-to-day operations."
  - type: "person"
    name: "Library Administrator"
    description: "System administrator responsible for managing the library management system configuration and settings."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system used for processing fine settlements."
  - type: "externalSystem"
    name: "Notification Provider"
    description: "External system used for sending out loan reminders and alerts."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External system used for user authentication and identity management."
  - type: "container"
    name: "Web Application / SPA"
    technology: "React, TypeScript"
    description: "UI logic for patrons and staff providing cataloging, circulation management, and self-service portals."
  - type: "container"
    name: "API Gateway"
    technology: "NGINX / Envoy"
    description: "Edge routing, TLS termination, and OIDC token validation."
  - type: "container"
    name: "Catalog & Search Service"
    technology: "Java, Spring Boot + Elasticsearch"
    description: "Dedicated to meeting sub-800ms search and cataloging requirements."
  - type: "container"
    name: "Circulation Service"
    technology: "Node.js / NestJS"
    description: "Manages loans, fines, and business integrations."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL"
    description: "Primary relational data store for transactional data."
  - type: "container"
    name: "Message Broker"
    technology: "Apache Kafka / RabbitMQ"
    description: "Asynchronous, event-driven communication."
  - type: "container"
    name: "Audit Service"
    technology: "Go"
    description: "High-performance audit logging service ensuring compliance with security constraints."
relationships:
  - source: "Library Member (Patron)"
    destination: "API Gateway"
    description: "Accesses self-service portals"
    technology: "HTTPS / TLS 1.3"
  - source: "Librarian / Staff"
    destination: "API Gateway"
    description: "Manages circulation and cataloging"
    technology: "HTTPS / TLS 1.3"
  - source: "Library Administrator"
    destination: "API Gateway"
    description: "Administers the system"
    technology: "HTTPS / TLS 1.3"
  - source: "API Gateway"
    destination: "Catalog & Search Service"
    description: "Routes search and catalog requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Circulation Service"
    description: "Routes circulation requests"
    technology: "gRPC over mTLS"
  - source: "Circulation Service"
    destination: "Message Broker"
    description: "Publishes and consumes asynchronous events"
    technology: "AMQP/Kafka Protocol over mTLS"
  - source: "Circulation Service"
    destination: "Database"
    description: "Reads and writes transactional data"
    technology: "SQL over mTLS"
  - source: "Catalog & Search Service"
    destination: "Database"
    description: "Reads and writes catalog data"
    technology: "SQL over mTLS"
  - source: "Circulation Service"
    destination: "Audit Service"
    description: "Sends audit logs"
    technology: "REST over mTLS"
  - source: "Circulation Service"
    destination: "Payment Gateway"
    description: "Processes fine settlements"
    technology: "HTTPS/REST"
  - source: "Circulation Service"
    destination: "Notification Provider"
    description: "Sends loan reminders and alerts"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "Identity Provider"
    description: "Validates and authenticates user identities"
    technology: "OIDC/OAuth2 over HTTPS"