level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons & Staff"
    description: "Actors interacting via HTTPS/TLS to use self-service portals, circulation management, and cataloguing."
  - type: "externalSystem"
    name: "EU-edge Reverse Proxy"
    description: "Edge-caching and CDN layer with WAF and rate limiting deployed on EU-Hosted Cloud Infrastructure."
  - type: "externalSystem"
    name: "Third-Party Digital Content Providers"
    description: "External system integrated via REST APIs for digital content."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system for processing fines and fees securely."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External system for patron alerts via Webhooks/SMTP."
  - type: "container"
    name: "Self-Service Web App"
    technology: "React/Next.js SPA"
    description: "Frontend UI deployed on EU-edge static hosting for library patrons."
  - type: "container"
    name: "Admin/Staff Portal"
    technology: "React Admin SPA"
    description: "Frontend UI deployed on EU-edge static hosting for library staff and administrators."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx/Kong"
    description: "API Gateway for routing, rate limiting, and OAuth2/OIDC token validation."
  - type: "container"
    name: "Circulation & Cataloguing Service"
    technology: "Node.js/TypeScript"
    description: "Service responsible for core business logic regarding circulation and cataloguing."
  - type: "container"
    name: "Core Search Engine"
    technology: "Elasticsearch"
    description: "Search engine hosted in EU regions to satisfy R-05 search SLA (<800ms)."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL"
    description: "Managed database with AES-256 encryption at rest in EU region for data residency."
relationships:
  - source: "Library Patrons & Staff"
    destination: "EU-edge Reverse Proxy"
    description: "Interacts via HTTPS/TLS 1.3, OIDC/OAuth2 authentication (with MFA for staff)."
    technology: "HTTPS/TLS 1.3, OIDC/OAuth2"
  - source: "EU-edge Reverse Proxy"
    destination: "Self-Service Web App"
    description: "Serves static assets and forwards requests."
    technology: "HTTPS"
  - source: "EU-edge Reverse Proxy"
    destination: "Admin/Staff Portal"
    description: "Serves static assets and forwards requests."
    technology: "HTTPS"
  - source: "Self-Service Web App"
    destination: "API Gateway"
    description: "Makes API requests with JWT."
    technology: "HTTPS/REST with JWT"
  - source: "Admin/Staff Portal"
    destination: "API Gateway"
    description: "Makes API requests with JWT."
    technology: "HTTPS/REST with JWT"
  - source: "API Gateway"
    destination: "Circulation & Cataloguing Service"
    description: "Routes validated requests to the backend service."
    technology: "gRPC/Internal, mTLS"
  - source: "Circulation & Cataloguing Service"
    destination: "Core Search Engine"
    description: "Queries search index for catalog search."
    technology: "TCP"
  - source: "Circulation & Cataloguing Service"
    destination: "Database"
    description: "Reads and writes transactional data."
    technology: "PostgreSQL Wire Protocol"
  - source: "Circulation & Cataloguing Service"
    destination: "Third-Party Digital Content Providers"
    description: "Integrates via REST APIs with circuit breakers and fallback caching."
    technology: "REST/JSON over HTTPS"
  - source: "Circulation & Cataloguing Service"
    destination: "Payment Gateway"
    description: "Processes secure financial transactions for fines and fees."
    technology: "HTTPS/REST"
  - source: "Circulation & Cataloguing Service"
    destination: "Notification Service"
    description: "Sends patron alerts using cryptographic message signing."
    technology: "Webhooks/SMTP with HMAC"