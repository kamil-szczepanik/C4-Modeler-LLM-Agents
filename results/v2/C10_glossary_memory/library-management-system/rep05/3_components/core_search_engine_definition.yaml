level: component
scope: "Component diagram for the Core Search Engine container"
parentContainer:
  name: "Core Search Engine"
elements:
  - type: "component"
    name: "Query Processing Component"
    technology: "Elasticsearch Module"
    description: "Processes and parses incoming search queries from the circulation and cataloguing service."
  - type: "component"
    name: "Indexing Component"
    technology: "Elasticsearch Module"
    description: "Manages the ingestion and indexing of physical and digital items for fast retrieval."
  - type: "component"
    name: "Search Indices"
    technology: "Inverted Index"
    description: "Stores optimized indices to natively guarantee sub-800ms search latencies."
  - type: "component"
    name: "Analysis Component"
    technology: "Elasticsearch Module"
    description: "Performs text analysis, tokenization, and linguistic processing for search queries."
  - type: "component"
    name: "Cluster Coordination Component"
    technology: "Elasticsearch 3-node cluster"
    description: "Manages cluster state, node communication, and high availability across EU availability zones."
relationships:
  - source: "Query Processing Component"
    destination: "Analysis Component"
    description: "Analyzes and tokenizes query text"
  - source: "Query Processing Component"
    destination: "Search Indices"
    description: "Executes searches against"
  - source: "Indexing Component"
    destination: "Search Indices"
    description: "Updates and maintains"
  - source: "Cluster Coordination Component"
    destination: "Query Processing Component"
    description: "Coordinates cluster nodes for"
  - source: "Cluster Coordination Component"
    destination: "Indexing Component"
    description: "Coordinates cluster nodes for"