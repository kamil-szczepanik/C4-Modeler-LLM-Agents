level: component
scope: "Component diagram for the Circulation & Cataloguing Service container"
parentContainer:
  name: "Circulation & Cataloguing Service"
elements:
  - type: "component"
    name: "Cataloguing Controller"
    technology: "Node.js / Express / Zod"
    description: "Handles incoming gRPC and REST requests for cataloguing books, physical media, and digital assets."
  - type: "component"
    name: "Circulation Controller"
    technology: "Node.js / Express / Zod"
    description: "Manages patron checkouts, returns, renewals, and fine calculations."
  - type: "component"
    name: "Cataloguing & Circulation Service Logic"
    technology: "TypeScript / Domain Services"
    description: "Encapsulates core business rules for library operations, inventory tracking, and search integrations."
  - type: "component"
    name: "Data Access Repository"
    technology: "Node-Postgres / Outbox Pattern"
    description: "Interacts with PostgreSQL using secure connections and implements the transactional outbox pattern for audit logs and webhooks."
relationships:
  - source: "Cataloguing Controller"
    destination: "Cataloguing & Circulation Service Logic"
    description: "Delegates cataloguing requests to"
  - source: "Circulation Controller"
    destination: "Cataloguing & Circulation Service Logic"
    description: "Delegates circulation requests to"
  - source: "Cataloguing & Circulation Service Logic"
    destination: "Data Access Repository"
    description: "Persists and queries transaction data using"
  - source: "Data Access Repository"
    destination: "Database"
    description: "PostgreSQL Wire Protocol over TLS"
  - source: "Cataloguing & Circulation Service Logic"
    destination: "Core Search Engine"
    description: "TCP over TLS"
  - source: "Cataloguing & Circulation Service Logic"
    destination: "Third-Party Digital Content Providers"
    description: "REST/JSON over HTTPS"
  - source: "Cataloguing & Circulation Service Logic"
    destination: "Payment Gateway"
    description: "HTTPS/REST"
  - source: "Cataloguing & Circulation Service Logic"
    destination: "Notification Service"
    description: "Webhooks/SMTP with HMAC"