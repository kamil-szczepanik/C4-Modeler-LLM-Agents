level: component
scope: "Component diagram for the Admin/Staff Portal container"
parentContainer:
  name: "Admin/Staff Portal"
elements:
  - type: "component"
    name: "Staff Authentication Controller"
    technology: "React Router / OIDC Client"
    description: "Manages staff authentication flows, token exchange, and secure session state within the Admin/Staff Portal."
  - type: "component"
    name: "Admin Dashboard UI"
    technology: "React Admin / Material-UI"
    description: "High-density data grids and administrative workflows for managing library operations and cataloguing."
  - type: "component"
    name: "Staff API Client"
    technology: "Axios / Fetch API"
    description: "Handles secure HTTP/REST communication with JWT authentication headers targeting the API Gateway."
relationships:
  - source: "Staff Authentication Controller"
    destination: "Staff API Client"
    description: "Supplies JWT for authorized requests"
  - source: "Admin Dashboard UI"
    destination: "Staff API Client"
    description: "Initiates data queries and administrative mutations"