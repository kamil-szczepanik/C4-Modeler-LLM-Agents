level: component
scope: "Component diagram for the Self-Service Web App container"
parentContainer:
  name: "Self-Service Web App"
elements:
  - type: "component"
    name: "BFF Routing & Session Handler"
    technology: "Next.js API Routes / Node.js"
    description: "Handles client-side routing, renders UI pages, and translates HttpOnly cookies to JWT tokens for backend API communication."
  - type: "component"
    name: "Catalogue Search UI"
    technology: "React Component / Client-side Cache"
    description: "Provides rapid catalogue search interactions and caches search results in the browser."
  - type: "component"
    name: "Fine Payment Widget"
    technology: "React Component / Iframe Integration"
    description: "Manages fine settlements securely via an isolated iframe tokenization mechanism."
relationships:
  - source: "BFF Routing & Session Handler"
    destination: "API Gateway"
    description: "HTTPS/REST with HttpOnly Cookie-to-JWT translation"
  - source: "Fine Payment Widget"
    destination: "Payment Gateway"
    description: "HTTPS, via isolated iframe tokenization"