level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Connection Pool Manager"
    technology: "PostgreSQL Connection Pooling"
    description: "Manages database connections efficiently for the circulation and cataloguing service."
  - type: "component"
    name: "Relational Storage Engine"
    technology: "PostgreSQL B-tree/GIN Indexing"
    description: "Provides structured relational storage and indexing for library data."
  - type: "component"
    name: "Audit & Encryption Subsystem"
    technology: "AES-256 Encryption at Rest"
    description: "Ensures data security and compliance with strict EU data residency regulations."
  - type: "component"
    name: "Replication & Backup Subsystem"
    technology: "PostgreSQL Replication"
    description: "Handles data redundancy and disaster recovery."
  - type: "component"
    name: "Data Retention & Archival Subsystem"
    technology: "PostgreSQL Archival Policies"
    description: "Manages historical data and compliance retention schedules."
relationships:
  - source: "Connection Pool Manager"
    destination: "Relational Storage Engine"
    description: "Routes queries to"
  - source: "Relational Storage Engine"
    destination: "Audit & Encryption Subsystem"
    description: "Secures data using"
  - source: "Relational Storage Engine"
    destination: "Replication & Backup Subsystem"
    description: "Replicates data via"
  - source: "Relational Storage Engine"
    destination: "Data Retention & Archival Subsystem"
    description: "Archives old records through"