# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Provides self-service portals, circulation management, and cataloguing for public and academic libraries with EU-only data residency and strict search SLAs."
elements:
  - type: "person"
    name: "Library Patrons & Staff"
    description: "Actors interacting via HTTPS/TLS to use self-service portals, circulation management, and cataloguing."
  - type: "externalSystem"
    name: "Third-Party Digital Content Providers"
    description: "External system integrated via REST APIs for digital content."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system for processing fines and fees securely."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External system for patron alerts via Webhooks/SMTP."
  - type: "externalSystem"
    name: "EU-edge Reverse Proxy"
    description: "Edge-caching and CDN layer with WAF and rate limiting deployed on EU-Hosted Cloud Infrastructure."
relationships:
  - source: "Library Patrons & Staff"
    destination: "EU-edge Reverse Proxy"
    description: "Interacts via HTTPS/TLS 1.3, OIDC/OAuth2 authentication (with MFA for staff)."
    technology: "HTTPS/TLS 1.3, OIDC/OAuth2"
  - type: "person"
    name: "Library Patrons & Staff"
    destination: "Library Management System"
    description: "Accesses self-service portals, circulation management, and cataloguing."
    technology: "HTTPS/TLS"
  - source: "Library Management System"
    destination: "Third-Party Digital Content Providers"
    description: "Integrates via REST APIs with circuit breakers and fallback caching."
    technology: "REST/JSON over HTTPS"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Processes secure financial transactions for fines and fees."
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "Notification Service"
    description: "Sends patron alerts using cryptographic message signing."
    technology: "Webhooks/SMTP with HMAC"