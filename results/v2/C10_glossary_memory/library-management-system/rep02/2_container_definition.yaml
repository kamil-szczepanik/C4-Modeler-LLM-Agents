# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public citizens who use the self-service portals to access catalogue management and digital content."
  - type: "person"
    name: "Circulation Staff and Library Administrators"
    description: "Staff and administrators responsible for managing library operations, circulation control, and system administration."
  - type: "externalSystem"
    name: "Identity Provider / SSO"
    description: "External system supporting SAML/Shibboleth and local accounts for federated authentication."
  - type: "externalSystem"
    name: "Digital Content Providers"
    description: "External vendor systems for e-books and audiobooks."
  - type: "externalSystem"
    name: "Notification Gateway"
    description: "External SMS/Email provider for dispatching notifications."
  - type: "externalSystem"
    name: "Observability & Logging Platform"
    description: "Prometheus/Grafana platform for monitoring and logging."
  - type: "container"
    name: "Web Portal"
    technology: "React/TypeScript on Nginx"
    description: "Provides the user interface for library patrons and staff."
  - type: "container"
    name: "API Gateway"
    technology: "Envoy/Kong"
    description: "Handles routing, edge security, circuit breaking, and OIDC validation."
  - type: "container"
    name: "Core Services API"
    technology: "Java/Spring Boot"
    description: "Handles core business logic and transactional operations."
  - type: "container"
    name: "Search & Catalogue Service"
    technology: "Elasticsearch/OpenSearch"
    description: "Provides high-performance search queries for the catalogue."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL with EU hosting"
    description: "Stores persistent relational data with EU residency compliance."
relationships:
  - source: "Library Patrons"
    destination: "Web Portal"
    description: "Accesses self-service portals"
    technology: "HTTPS/TLS 1.3"
  - source: "Circulation Staff and Library Administrators"
    destination: "Web Portal"
    description: "Manages library operations"
    technology: "HTTPS/TLS 1.3"
  - source: "API Gateway"
    destination: "Identity Provider / SSO"
    description: "Validates user authentication"
    technology: "OIDC/SAML over HTTPS"
  - source: "Web Portal"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS / JSON over TLS 1.3"
  - source: "API Gateway"
    destination: "Core Services API"
    description: "Routes core requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Search & Catalogue Service"
    description: "Routes search requests"
    technology: "gRPC over mTLS"
  - source: "Core Services API"
    destination: "Database"
    description: "Reads and writes transactional data"
    technology: "PostgreSQL Wire Protocol over TLS 1.3"
  - source: "Search & Catalogue Service"
    destination: "Database"
    description: "Syncs or queries catalogue data"
    technology: "PostgreSQL Wire Protocol over TLS 1.3"
  - source: "Core Services API"
    destination: "Notification Gateway"
    description: "Dispatches notifications asynchronously"
    technology: "Asynchronous HTTPS/REST webhooks over TLS 1.3"
  - source: "Core Services API"
    destination: "Digital Content Providers"
    description: "Integrates with external digital content vendors"
    technology: "HTTPS/REST with mutual TLS"