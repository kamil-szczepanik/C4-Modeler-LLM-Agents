level: component
scope: "Component diagram for the Web Portal container"
parentContainer:
  name: "Web Portal"
elements:
  - type: "component"
    name: "Patron UI SPA"
    technology: "React / TypeScript"
    description: "Provides the user interface and client-side routing for library patrons to browse catalogues, manage loans, and access self-service portals."
  - type: "component"
    name: "Staff Dashboard SPA"
    technology: "React / TypeScript"
    description: "Provides administrative and circulation control interfaces for staff and library administrators."
  - type: "component"
    name: "Nginx Web Server"
    technology: "Nginx on EU-restricted container"
    description: "Serves static assets and handles reverse proxying within an EU-restricted container deployment."
relationships:
  - source: "Patron UI SPA"
    destination: "Nginx Web Server"
    description: "Routed and served through"
  - source: "Staff Dashboard SPA"
    destination: "Nginx Web Server"
    description: "Routed and served through"