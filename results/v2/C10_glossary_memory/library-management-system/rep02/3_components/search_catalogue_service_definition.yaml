level: component
scope: "Component diagram for the Search & Catalogue Service container"
parentContainer:
  name: "Search & Catalogue Service"
elements:
  - type: "component"
    name: "Search API Handler"
    technology: "Java/Spring Boot"
    description: "Handles incoming search requests and routes them within the search service."
  - type: "component"
    name: "Query Builder & Faceting Engine"
    technology: "Java"
    description: "Constructs complex search queries and manages faceting logic."
  - type: "component"
    name: "Indexing Worker"
    technology: "Java/Spring Boot"
    description: "Processes data streams and updates the search index."
  - type: "component"
    name: "Search Engine Index"
    technology: "OpenSearch"
    description: "Executes inverted-index queries for high-performance search."
relationships:
  - source: "Search API Handler"
    destination: "Query Builder & Faceting Engine"
    description: "In-process method call"
  - source: "Query Builder & Faceting Engine"
    destination: "Search Engine Index"
    description: "REST over mTLS"