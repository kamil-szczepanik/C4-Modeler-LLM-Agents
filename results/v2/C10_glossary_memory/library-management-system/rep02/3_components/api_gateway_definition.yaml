level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing and Edge Router"
    technology: "Envoy/Kong"
    description: "Handles high-performance edge routing, rate limiting, and security termination."
  - type: "component"
    name: "Authentication & OIDC Validator"
    technology: "Envoy/Kong Plugin / Lua"
    description: "Validates incoming tokens against the Identity Provider / SSO."
  - type: "component"
    name: "gRPC Upstream Proxy"
    technology: "Envoy/Kong Proxy"
    description: "Routes internal traffic securely to Core Services API and Search & Catalogue Service via gRPC over mTLS."
relationships:
  - source: "Routing and Edge Router"
    destination: "Authentication & OIDC Validator"
    description: "Delegates token validation"
  - source: "Routing and Edge Router"
    destination: "gRPC Upstream Proxy"
    description: "Forwards validated requests"