level: component
scope: "Component diagram for the Core Services API container"
parentContainer:
  name: "Core Services API"
elements:
  - type: "component"
    name: "Circulation Management Component"
    technology: "Java / Spring Boot"
    description: "Orchestrates library transactions and circulation management."
  - type: "component"
    name: "Patron Account Component"
    technology: "Java / Spring Boot"
    description: "Manages patron account logic and validates memberships."
  - type: "component"
    name: "Integration Orchestrator Component"
    technology: "Java / Spring Boot"
    description: "Integration orchestrator component that brokers external digital content and dispatches alerts."
relationships:
  - source: "API Gateway"
    destination: "Core Services API"
    description: "Routes core requests [gRPC over mTLS with OAuth2 metadata headers]"
  - source: "Circulation Management Component"
    destination: "Database"
    description: "Persists loans and audit events [PostgreSQL Wire Protocol over TLS 1.3]"
  - source: "Patron Account Component"
    destination: "Database"
    description: "Validates memberships [PostgreSQL Wire Protocol over TLS 1.3]"
  - source: "Integration Orchestrator Component"
    destination: "Notification Gateway"
    description: "Dispatches alerts [Asynchronous HTTPS/REST webhooks over TLS 1.3]"
  - source: "Integration Orchestrator Component"
    destination: "Digital Content Providers"
    description: "Brokers external licensing [HTTPS/REST with mutual TLS]"
  - source: "Core Services API"
    destination: "Observability & Logging Platform"
    description: "Emits sanitized distributed traces [OpenTelemetry over gRPC / TLS 1.3]"