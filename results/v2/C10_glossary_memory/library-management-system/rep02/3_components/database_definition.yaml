level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Connection Pool & Session Manager"
    technology: "PgBouncer"
    description: "Manages and pools client database connections over TLS 1.3 to ensure high performance and EU data residency compliance."
  - type: "component"
    name: "Relational Data Store"
    technology: "PostgreSQL with EU hosting"
    description: "Stores persistent relational data including patron records, circulation logs, and catalogue metadata with row/column encryption."
relationships:
  - source: "Connection Pool & Session Manager"
    destination: "Relational Data Store"
    description: "Routes and multiplexes database queries over PostgreSQL Wire Protocol"