level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Provides public and academic libraries with catalogue management, circulation control, and self-service portals, enforcing strict EU-only data residency and high-performance search requirements."
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public citizens who use the self-service portals to access catalogue management and digital content."
  - type: "person"
    name: "Circulation Staff and Library Administrators"
    description: "Staff and administrators responsible for managing library operations, circulation control, and system administration."
  - type: "externalSystem"
    name: "Identity Provider / SSO"
    description: "External system supporting SAML/Shibboleth and local accounts for federated authentication."
  - type: "externalSystem"
    name: "Digital Content Providers"
    description: "External vendor systems for e-books and audiobooks."
  - type: "externalSystem"
    name: "Notification Gateway"
    description: "External SMS/Email provider for dispatching notifications."
  - type: "externalSystem"
    name: "Observability & Logging Platform"
    description: "Prometheus/Grafana platform for monitoring and logging."
relationships:
  - source: "Library Patrons"
    destination: "Library Management System"
    description: "Accesses catalogue management, circulation control, and self-service portals"
    technology: "HTTPS (Web/Mobile) using TLS 1.3"
  - source: "Circulation Staff and Library Administrators"
    destination: "Library Management System"
    description: "Manages library operations and system administration"
    technology: "HTTPS (Web/Mobile) using TLS 1.3"
  - source: "Library Management System"
    destination: "Identity Provider / SSO"
    description: "Authenticates users via federated identity"
    technology: "OIDC/SAML over HTTPS"
  - source: "Library Management System"
    destination: "Digital Content Providers"
    description: "Integrates with vendor systems for e-books and audiobooks"
    technology: "HTTPS/REST with mutual TLS (mTLS)"
  - source: "Library Management System"
    destination: "Notification Gateway"
    description: "Dispatches SMS and email notifications"
    technology: "Asynchronous HTTPS/REST webhooks"