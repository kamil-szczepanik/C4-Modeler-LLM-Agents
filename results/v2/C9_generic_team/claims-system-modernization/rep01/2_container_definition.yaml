level: container
scope: "Container diagram for Hybrid Insurance Claims Modernization Platform"
system:
  name: "Hybrid Insurance Claims Modernization Platform"
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "Submit online claims."
  - type: "person"
    name: "Claims Adjusters"
    description: "Handle claims via modern web application."
  - type: "externalSystem"
    name: "On-Premises COBOL/DB2 Mainframe"
    description: "System of record for legacy claims processing."
  - type: "externalSystem"
    name: "Azure Active Directory"
    description: "Provides Single Sign-On (SSO) and identity management."
  - type: "externalSystem"
    name: "Azure Monitor/Application Insights"
    description: "Provides distributed tracing, monitoring, and observability."
  - type: "container"
    name: "API Gateway"
    description: "Routes ingress traffic internally and serves low-latency claims reads."
    technology: "Azure Hosted API Gateway"
  - type: "container"
    name: "Claim Ingestion & Validation Module"
    description: "Validates incoming claim payloads."
    technology: ".NET Core / Modular Monolith"
  - type: "container"
    name: "Anti-Corruption Layer (ACL)"
    description: "Translates and dispatches claim data to legacy interfaces."
    technology: ".NET Core / Modular Monolith"
  - type: "container"
    name: "Read-Model Cache"
    description: "Serves low-latency claim reads (<2s response) to the API Gateway and Adjuster UI."
    technology: "Azure Cache / In-Memory Database"
  - type: "container"
    name: "Data Synchronization Worker"
    description: "Updates claim states asynchronously via Azure Service Bus."
    technology: ".NET Background Worker"
  - type: "container"
    name: "Feature Flag Management Module"
    description: "Dynamically toggles claim-type routing for rapid rollback."
    technology: "Azure App Configuration"
  - type: "container"
    name: "Centralized Observability & Audit Logging Module"
    description: "Handles centralized auditing and logging."
    technology: "Azure Monitor / Application Insights"
  - type: "container"
    name: "Database Migration & Schema Versioning Module"
    description: "Performs automated schema versioning."
    technology: "Flyway / Entity Framework"
relationships:
  - source: "Customers and Brokers"
    destination: "API Gateway"
    description: "Submit online claims"
    technology: "HTTPS"
  - source: "Claims Adjusters"
    destination: "API Gateway"
    description: "Handle claims via modern web application"
    technology: "HTTPS / SSO via Azure Active Directory"
  - source: "API Gateway"
    destination: "Claim Ingestion & Validation Module"
    description: "Route ingress traffic internally"
    technology: "Internal API"
  - source: "Claim Ingestion & Validation Module"
    destination: "Anti-Corruption Layer (ACL)"
    description: "Forward validated claims payloads"
    technology: "Internal Routing"
  - source: "Anti-Corruption Layer (ACL)"
    destination: "On-Premises COBOL/DB2 Mainframe"
    description: "Translate and dispatch claim data via restricted legacy interfaces"
    technology: "Restricted Legacy Interfaces"
  - source: "Data Synchronization Worker"
    destination: "Read-Model Cache"
    description: "Update claim states asynchronously"
    technology: "Azure Service Bus"
  - source: "Read-Model Cache"
    destination: "API Gateway"
    description: "Serve low-latency claim reads (<2s response)"
    technology: "Internal Cache Query"
  - source: "Feature Flag Management Module"
    destination: "Anti-Corruption Layer (ACL)"
    description: "Dynamically toggle claim-type routing for rapid rollback"
    technology: "Azure App Configuration"
  - source: "Feature Flag Management Module"
    destination: "API Gateway"
    description: "Dynamically toggle claim-type routing for rapid rollback"
    technology: "Azure App Configuration"