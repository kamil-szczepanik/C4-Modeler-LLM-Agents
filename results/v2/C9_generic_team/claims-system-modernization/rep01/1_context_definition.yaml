level: context
scope: "System Context diagram for Hybrid Insurance Claims Modernization Platform"
system:
  name: "Hybrid Insurance Claims Modernization Platform"
  description: "Gradually replaces a legacy mainframe claims system with a modern cloud platform while ensuring uninterrupted legacy processing."
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "Submit online claims and interact with the platform."
  - type: "person"
    name: "Claims Adjusters"
    description: "Handle claims through the modern platform."
  - type: "externalSystem"
    name: "On-Premises COBOL/DB2 Mainframe"
    description: "System of record for legacy insurance claims processing."
  - type: "externalSystem"
    name: "Azure Service Bus"
    description: "Provides idempotent, reliable messaging for claims ingestion and state synchronization."
  - type: "externalSystem"
    name: "Azure Key Vault"
    description: "Centralizes secret and configuration management using Managed Identity."
relationships:
  - source: "Customers and Brokers"
    destination: "Hybrid Insurance Claims Modernization Platform"
    description: "Interact for online claim submission"
    technology: "HTTPS"
  - source: "Claims Adjusters"
    destination: "Hybrid Insurance Claims Modernization Platform"
    description: "Interact for claim handling"
    technology: "HTTPS"
  - source: "Hybrid Insurance Claims Modernization Platform"
    destination: "On-Premises COBOL/DB2 Mainframe"
    description: "Integrates via Centralized API Gateway"
    technology: "REST/JSON"
  - source: "Hybrid Insurance Claims Modernization Platform"
    destination: "Azure Key Vault"
    description: "Securely retrieves secrets"
    technology: "Managed Identity"
  - source: "Hybrid Insurance Claims Modernization Platform"
    destination: "Azure Service Bus"
    description: "Asynchronous events flow for claims ingestion and state synchronization"
    technology: "AMQP / Messaging"