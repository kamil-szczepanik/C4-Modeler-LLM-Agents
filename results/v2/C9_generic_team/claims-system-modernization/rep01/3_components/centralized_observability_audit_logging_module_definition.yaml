level: component
scope: "Component diagram for the Centralized Observability & Audit Logging Module container"
parentContainer:
  name: "Centralized Observability & Audit Logging Module"
elements:
  - type: "component"
    name: "Telemetry Collector"
    technology: "Azure Monitor / Application Insights (W3C Trace Context, HTTPS)"
    description: "Receives and aggregates structured JSON logs and telemetry streams from all .NET Core modules."
  - type: "component"
    name: "Audit Trail Manager"
    technology: "Azure Log Analytics"
    description: "Maintains compliance-ready audit trails and structured logs for system access and claim modifications."
relationships:
  - source: "Telemetry Collector"
    destination: "Audit Trail Manager"
    description: "Forwards structured telemetry and logs to"