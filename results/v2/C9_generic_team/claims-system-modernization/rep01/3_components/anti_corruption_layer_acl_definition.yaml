level: component
scope: "Component diagram for the Anti-Corruption Layer (ACL) container"
parentContainer:
  name: "Anti-Corruption Layer (ACL)"
elements:
  - type: "component"
    name: "Claim Translation Component"
    technology: ".NET Core / Modular Monolith"
    description: "Translates modern claim data models into legacy-compatible formats for the mainframe."
  - type: "component"
    name: "Legacy Dispatcher Component"
    technology: ".NET Core with Polly"
    description: "Dispatches claim data to the on-premises COBOL/DB2 mainframe using circuit breaker and resilience patterns."
relationships:
  - source: "Claim Translation Component"
    destination: "Legacy Dispatcher Component"
    description: "Passes translated claim payloads"