level: component
scope: "Component diagram for the Read-Model Cache container"
parentContainer:
  name: "Read-Model Cache"
elements:
  - type: "component"
    name: "Azure Redis Cache"
    technology: "Azure Redis Cache"
    description: "Provides low-latency in-memory data storage to meet the sub-2s performance requirement (R-05)."
  - type: "component"
    name: "Repository Abstraction Layer"
    technology: ".NET Core"
    description: "Encapsulates cache logic and connection management to improve maintainability for a team with limited cloud experience."
  - type: "component"
    name: "Data Synchronization Worker"
    technology: ".NET Background Worker"
    description: "Updates claim states asynchronously with Optimistic Concurrency Control."
  - type: "component"
    name: "Azure App Configuration"
    technology: "Azure App Configuration"
    description: "Externalizes cache timeouts, TTL policies, and retry limits for dynamic runtime tuning."
  - type: "component"
    name: "Application Insights"
    technology: "Azure Monitor / Application Insights"
    description: "Tracks hit/miss ratios, latency, and cache metrics via Telemetry API."
relationships:
  - source: "Repository Abstraction Layer"
    destination: "Azure Redis Cache"
    description: "Read and write claim states securely [TCP / Redis Protocol]"
  - source: "Data Synchronization Worker"
    destination: "Azure Redis Cache"
    description: "Update claim states asynchronously with Optimistic Concurrency Control [Redis MULTI/EXEC]"
  - source: "Adjuster Web Application"
    destination: "Repository Abstraction Layer"
    description: "Serve low-latency claim reads under 2s with Cache-Aside pattern [Internal API]"
  - source: "Application Insights"
    destination: "Azure Redis Cache"
    description: "Track hit/miss ratios, latency, and cache metrics [Telemetry API]"