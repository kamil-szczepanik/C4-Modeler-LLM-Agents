level: component
scope: "Component diagram for the Feature Flag Management Module container"
parentContainer:
  name: "Feature Flag Management Module"
elements:
  - type: "component"
    name: "Feature Flag Management Module"
    technology: "Azure App Configuration"
    description: "Dynamically controls claim-type routing between the legacy mainframe and the modern Azure platform."
  - type: "component"
    name: "API Gateway and Anti-Corruption Layer (ACL)"
    technology: ".NET Core / Modular Monolith"
    description: "Routes claims and handles anti-corruption layer translation."
  - type: "component"
    name: "Centralized Observability & Audit Logging Module"
    technology: "Azure Monitor / Application Insights"
    description: "Emits telemetry and audit logs."
  - type: "component"
    name: "GitOps Pipeline and Version-Controlled Configuration Repositories"
    technology: "Version-Controlled JSON/YAML"
    description: "Manages flags as code to prevent manual human error."
  - type: "component"
    name: "Feature Flag Facade / Wrapper"
    technology: "Custom Abstraction & In-memory Caching"
    description: "Provides local caching with a 30-second TTL to ensure sub-2-second response times and circuit breaker fail-safe defaults."
relationships:
  - source: "Feature Flag Management Module"
    destination: "API Gateway and Anti-Corruption Layer (ACL)"
    description: "Dynamically toggles claim-type routing via REST API / Azure SDK"
  - source: "Feature Flag Management Module"
    destination: "Centralized Observability & Audit Logging Module"
    description: "Emits telemetry and audit logs via Azure Monitor"