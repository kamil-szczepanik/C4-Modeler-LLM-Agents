level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Routing and Rate Limiting Component"
    technology: "Azure API Gateway"
    description: "Handles edge routing, rate limiting, circuit breaking, and response caching for incoming traffic."
  - type: "component"
    name: "Security and Validation Component"
    technology: "Azure API Gateway / JWT / OAuth2"
    description: "Performs JWT/OAuth2 validation, request aggregation, and error transformation."
  - type: "component"
    name: "Routing Control Component"
    technology: "Azure App Configuration"
    description: "Dynamically toggles claim-type routing for rapid rollback via feature flag management."
relationships:
  - source: "Edge Routing and Rate Limiting Component"
    destination: "Security and Validation Component"
    description: "Validates and secures incoming requests"
  - source: "Security and Validation Component"
    destination: "Routing Control Component"
    description: "Checks feature flags for claim-type routing"