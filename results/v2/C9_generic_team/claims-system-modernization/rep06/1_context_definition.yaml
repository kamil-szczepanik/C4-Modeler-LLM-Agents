level: context
scope: "System Context diagram for Regional Insurer Claims Platform"
system:
  name: "Regional Insurer Claims Platform"
  description: "Modernizes a regional insurer's legacy COBOL/DB2 mainframe claims platform by incrementally migrating claim types to a hybrid cloud architecture, maintaining continuous claims processing."
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "External users who submit online claims."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff who handle and process claims."
  - type: "externalSystem"
    name: "On-Premise COBOL/DB2 Mainframe (System of Record)"
    description: "Legacy system of record handling core mainframe logic and database storage."
  - type: "externalSystem"
    name: "On-Premise Active Directory"
    description: "Directory service used for authentication and SSO."
  - type: "container"
    name: "Azure Web Application"
    description: "Containerized web application providing the UI for customers, brokers, and adjusters."
    technology: "Azure Container"
  - type: "container"
    name: "Azure Anti-Corruption Layer (ACL)"
    description: "Containerized ACL that communicates with the on-premise mainframe and prevents contract violations."
    technology: "Azure Container, JSON Schema, Avro Schema Registry"
  - type: "container"
    name: "Azure Database with Snapshot State Versioning"
    description: "Azure database utilizing snapshot state versioning for historical auditability and rollbacks."
    technology: "Azure Database"
  - type: "container"
    name: "Azure Observability Container"
    description: "Container dedicated to monitoring and observability of the Azure environment."
    technology: "Azure Container"
relationships:
  - source: "Customers and Brokers"
    destination: "Azure Web Application"
    description: "Online claim submission"
    technology: "HTTPS/REST"
  - source: "Claims Adjusters"
    destination: "Azure Web Application"
    description: "Claim handling and processing"
    technology: "HTTPS/REST"
  - source: "Azure Anti-Corruption Layer (ACL)"
    destination: "On-Premise COBOL/DB2 Mainframe (System of Record)"
    description: "Communicates with on-premise mainframe for hybrid message delivery and synchronization"
    technology: "Secure VPN/ExpressRoute, synchronous REST/MQ APIs"
  - source: "Azure Web Application"
    destination: "On-Premise Active Directory"
    description: "Authenticates users via SSO"
    technology: "OAuth2/OpenID Connect (SSO)"