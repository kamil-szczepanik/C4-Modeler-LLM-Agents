level: component
scope: "Component diagram for the Web Application (SPA) container"
parentContainer:
  name: "Web Application (SPA)"
elements:
  - type: "component"
    name: "UI Presentation Layer"
    technology: "TypeScript, Single Page Application (SPA)"
    description: "Provides the user interface for customers, brokers, and claims adjusters with optimistic UI updates and feature-flagged routing."
  - type: "component"
    name: "API Client"
    technology: "OpenAPI, TypeScript"
    description: "Generates type-safe API clients to eliminate schema drift between the frontend and the BFF."
  - type: "component"
    name: "Authentication Client"
    technology: "HTTPS, Active Directory SSO"
    description: "Handles single sign-on authentication for users against the on-premise Active Directory."
  - type: "component"
    name: "Telemetry and Testing Agent"
    technology: "Playwright, Azure Application Insights"
    description: "Executes automated end-to-end smoke tests and provides real-time client-side telemetry and performance monitoring."
relationships:
  - source: "UI Presentation Layer"
    destination: "API Client"
    description: "Uses type-safe API client to communicate"
  - source: "API Client"
    destination: "Backend-for-Frontend (BFF)"
    description: "Communicates via HTTPS/REST"
  - source: "UI Presentation Layer"
    destination: "Authentication Client"
    description: "Authenticates via SSO [HTTPS]"
  - source: "Authentication Client"
    destination: "On-Premise Active Directory"
    description: "Validates credentials"
  - source: "UI Presentation Layer"
    destination: "Azure Application Insights"
    description: "Sends real-time telemetry and performance metrics"