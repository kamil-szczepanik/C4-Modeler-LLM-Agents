level: component
scope: "Component diagram for the Cache / Read Model Store container"
parentContainer:
  name: "Cache / Read Model Store"
elements:
  - type: "component"
    name: "Read Model Database Engine"
    technology: "Managed Cloud Database"
    description: "Stores denormalized read models to deliver fast read performance for adjuster screens and decouples read models from mainframe latency."
  - type: "component"
    name: "In-Memory Cache Layer"
    technology: "Managed Cloud Cache"
    description: "Caches frequent claim queries to reduce latency for the Backend-for-Frontend (BFF)."
relationships:
  - source: "Data Synchronization / ETL Service"
    destination: "Read Model Database Engine"
    description: "Database Replication"
  - source: "Backend-for-Frontend (BFF)"
    destination: "In-Memory Cache Layer"
    description: "TCP/Redis Protocol"