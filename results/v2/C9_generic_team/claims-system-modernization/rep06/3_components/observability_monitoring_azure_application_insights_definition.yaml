level: component
scope: "Component diagram for the Observability / Monitoring (Azure Application Insights) container"
parentContainer:
  name: "Observability / Monitoring (Azure Application Insights)"
elements:
  - type: "component"
    name: "Distributed Tracing Collector"
    technology: "Azure Application Insights / W3C Trace Context"
    description: "Collects and aggregates end-to-end distributed traces injected via HTTP headers across hybrid boundaries."
  - type: "component"
    name: "Structured Logging Engine"
    technology: "Azure Application Insights Logging"
    description: "Captures and indexes structured log streams emitted by backend containers."
  - type: "component"
    name: "Telemetry Alerting Service"
    technology: "Azure Application Insights Alerts"
    description: "Provides automated alerting and operational monitoring based on telemetry data."
  - type: "component"
    name: "Kusto Query Interface"
    technology: "Kusto Query Language (KQL)"
    description: "Processes version-controlled query templates for rapid operational triage and monitoring."
relationships:
  - source: "Structured Logging Engine"
    destination: "Kusto Query Interface"
    description: "Provides queryable log data for"
  - source: "Distributed Tracing Collector"
    destination: "Telemetry Alerting Service"
    description: "Triggers alerts based on trace anomalies and failures for"