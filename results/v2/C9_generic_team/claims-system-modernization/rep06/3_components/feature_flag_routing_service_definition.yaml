level: component
scope: "Component diagram for the Feature Flag / Routing Service container"
parentContainer:
  name: "Feature Flag / Routing Service"
elements:
  - type: "component"
    name: "Routing Controller"
    technology: "Azure App Configuration & Routing Client SDK"
    description: "Manages incremental claim type migration routing rules, feature flags, and handles HTTP/REST queries from BFF and Claim Management Core."
  - type: "component"
    name: "Consistent Hashing Engine"
    technology: "Deterministic Algorithm"
    description: "Applies deterministic consistent hashing based on claim IDs to guarantee repeatable routing decisions between the legacy mainframe and Azure platform."
  - type: "component"
    name: "Circuit Breaker Manager"
    technology: "Routing Client SDK Resilience Pattern"
    description: "Enforces fallback-to-safe-default behavior targeting the mainframe during outages to ensure reliable hybrid routing."
  - type: "component"
    name: "Cache Invalidation Publisher"
    technology: "Azure Service Bus"
    description: "Publishes and handles cache invalidation events to enable near-instantaneous emergency rollbacks."
  - type: "component"
    name: "Telemetry Emitter"
    technology: "Azure Application Insights"
    description: "Emits metrics, audit logs, and distributed traces for telemetry, canary evaluation, and monitoring."
relationships:
  - source: "Routing Controller"
    destination: "Consistent Hashing Engine"
    description: "Evaluates routing state using"
  - source: "Routing Controller"
    destination: "Circuit Breaker Manager"
    description: "Protects routing calls with"
  - source: "Routing Controller"
    destination: "Cache Invalidation Publisher"
    description: "Triggers event distribution via"
  - source: "Routing Controller"
    destination: "Telemetry Emitter"
    description: "Sends metrics and logs to"