level: component
scope: "Component diagram for the Backend-for-Frontend (BFF) container"
parentContainer:
  name: "Backend-for-Frontend (BFF)"
elements:
  - type: "component"
    name: "Web API Controller"
    technology: "ASP.NET Core / C#"
    description: "Exposes RESTful endpoints for the Web Application SPA and handles incoming HTTP requests."
  - type: "component"
    name: "Configuration Client"
    technology: "Azure App Configuration SDK"
    description: "Fetches and manages externalized configuration, timeouts, and feature flags."
  - type: "component"
    name: "Resilience & Caching Manager"
    technology: "Response Caching & Polly Circuit Breaker"
    description: "Mitigates mainframe latency, caches responses, and prevents cascading failures."
  - type: "component"
    name: "Security & Middleware Handler"
    technology: "Correlation IDs & PII Masking Middleware"
    description: "Ensures distributed tracing across the hybrid boundary and scrubs sensitive data for compliance."
  - type: "component"
    name: "Telemetry Exporter"
    technology: "Azure Application Insights SDK"
    description: "Exports telemetry and distributed traces via HTTPS."
relationships:
  - source: "Web API Controller"
    destination: "Resilience & Caching Manager"
    description: "Routes requests through caching and circuit breakers"
  - source: "Web API Controller"
    destination: "Security & Middleware Handler"
    description: "Passes requests through security and correlation ID middleware"
  - source: "Resilience & Caching Manager"
    destination: "Configuration Client"
    description: "Reads operational endpoints and timeouts"
  - source: "Web API Controller"
    destination: "Telemetry Exporter"
    description: "Sends telemetry data"