level: component
scope: "Component diagram for the Anti-Corruption Layer (ACL) container"
parentContainer:
  name: "Anti-Corruption Layer (ACL)"
elements:
  - type: "component"
    name: "Mainframe Adapter"
    technology: "Azure App Service / Secure Mainframe Protocols"
    description: "Communicates directly with the On-Premise COBOL/DB2 Mainframe to exchange data securely."
  - type: "component"
    name: "Message Publisher"
    technology: "Azure Service Bus SDK"
    description: "Publishes and subscribes events to the Azure Service Bus using the Outbox pattern."
  - type: "component"
    name: "Domain Translator"
    technology: "Clean Architecture / Ports & Adapters"
    description: "Translates legacy mainframe data models into modern cloud-native domain models."
relationships:
  - source: "Domain Translator"
    destination: "Mainframe Adapter"
    description: "Exchanges legacy data"
  - source: "Domain Translator"
    destination: "Message Publisher"
    description: "Publishes events"