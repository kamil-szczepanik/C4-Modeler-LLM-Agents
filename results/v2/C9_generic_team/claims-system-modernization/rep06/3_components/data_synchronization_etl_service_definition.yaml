level: component
scope: "Component diagram for the Data Synchronization / ETL Service container"
parentContainer:
  name: "Data Synchronization / ETL Service"
elements:
  - type: "component"
    name: "Mainframe Extraction Adapter"
    technology: "Modular Adapter / Azure App Service"
    description: "Extracts batch data and state from the On-Premise COBOL/DB2 Mainframe via Secure Mainframe Protocols."
  - type: "component"
    name: "Data Transformation Engine"
    technology: "Azure Compute / ETL"
    description: "Transforms state between the on-premise mainframe and cloud read models during incremental claim migrations."
  - type: "component"
    name: "Read Model Upsert Manager"
    technology: "Azure Compute / ETL"
    description: "Upserts transformed data and read models to the Cache / Read Model Store via Database Replication."
  - type: "component"
    name: "Resilient Message Handler"
    technology: "Azure Service Bus Client"
    description: "Routes failed messages to Dead-Letter Queues (DLQs) using AMQP to handle transient failures."
  - type: "component"
    name: "Telemetry and Monitoring Publisher"
    technology: "Azure Application Insights SDK"
    description: "Publishes telemetry, lag metrics, and error rates via HTTPS."
  - type: "component"
    name: "Configuration Manager"
    technology: "Azure App Configuration Client"
    description: "Fetches centralized pipeline parameters, batch sizes, and feature toggles to enable rapid operational adjustments."
relationships:
  - source: "Mainframe Extraction Adapter"
    destination: "Data Transformation Engine"
    description: "Passes extracted batch data for transformation [Internal Data Flow]"
  - source: "Data Transformation Engine"
    destination: "Read Model Upsert Manager"
    description: "Sends transformed records for synchronization [Internal Data Flow]"
  - source: "Read Model Upsert Manager"
    destination: "Cache / Read Model Store"
    description: "Upserts transformed data and read models via Database Replication [Database Replication]"
  - source: "Mainframe Extraction Adapter"
    destination: "On-Premise COBOL/DB2 Mainframe (System of Record)"
    description: "Extracts batch data and state via Secure Mainframe Protocols / ETL [ETL / Secure Protocols]"
  - source: "Resilient Message Handler"
    destination: "Azure Service Bus"
    description: "Routes failed messages to Dead-Letter Queues (DLQs) using AMQP [AMQP]"
  - source: "Telemetry and Monitoring Publisher"
    destination: "Azure Application Insights"
    description: "Publishes telemetry, lag metrics, and error rates via HTTPS [HTTPS]"