level: component
scope: "Component diagram for the Message Broker (Azure Service Bus) container"
parentContainer:
  name: "Message Broker (Azure Service Bus)"
elements:
  - type: "component"
    name: "Claim Event Publisher"
    technology: "Azure Service Bus Client"
    description: "Publishes claim processing events from the Claim Management Core into the message broker."
  - type: "component"
    name: "Anti-Corruption Event Consumer"
    technology: "Azure Service Bus Client"
    description: "Subscribes to modern claim events and forwards them to the Anti-Corruption Layer for legacy mainframe translation."
  - type: "component"
    name: "Outbox Pattern Handler"
    technology: "Azure Service Bus Outbox Processor"
    description: "Ensures reliable, exactly-once message publishing and delivery across hybrid boundaries."
  - type: "component"
    name: "Dead-Letter Queue Manager"
    technology: "Azure Service Bus DLQ"
    description: "Manages and isolates failed messages to guarantee message processing integrity and facilitate debugging."
relationships:
  - source: "Claim Event Publisher"
    destination: "Outbox Pattern Handler"
    description: "Routes outgoing messages through"
  - source: "Outbox Pattern Handler"
    destination: "Anti-Corruption Event Consumer"
    description: "Delivers asynchronous events via"
  - source: "Anti-Corruption Event Consumer"
    destination: "Dead-Letter Queue Manager"
    description: "Fails over malformed or unprocessable messages to"