level: container
scope: "Container diagram for Regional Insurer Claims Platform"
system:
  name: "Regional Insurer Claims Platform"
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "External users who submit online claims."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff who handle and process claims."
  - type: "externalSystem"
    name: "On-Premise COBOL/DB2 Mainframe (System of Record)"
    description: "Legacy system of record handling core mainframe logic and database storage."
  - type: "externalSystem"
    name: "On-Premise Active Directory"
    description: "Directory service used for authentication and SSO."
  - type: "container"
    name: "Web Application (SPA)"
    technology: "Azure App Service / SPA"
    description: "Provides the user interface for customers, brokers, and adjusters."
  - type: "container"
    name: "Backend-for-Frontend (BFF)"
    technology: "Azure App Service"
    description: "Serves as an orchestration layer tailored for the web application."
  - type: "container"
    name: "Claim Management Core"
    technology: "Azure App Service"
    description: "Handles the core claim processing and business logic."
  - type: "container"
    name: "Anti-Corruption Layer (ACL)"
    technology: "Azure App Service / Secure Mainframe Protocols"
    description: "Translates and protects modern cloud services from legacy mainframe schemas."
  - type: "container"
    name: "Data Synchronization / ETL Service"
    technology: "Azure Service / ETL"
    description: "Replicates state between the mainframe and the read model store."
  - type: "container"
    name: "Feature Flag / Routing Service"
    technology: "Azure App Service"
    description: "Manages incremental rollout and hybrid routing logic."
  - type: "container"
    name: "Message Broker (Azure Service Bus)"
    technology: "Azure Service Bus"
    description: "Manages asynchronous messaging to isolate hybrid network latency."
  - type: "container"
    name: "Cache / Read Model Store"
    technology: "Managed Cloud Database / Cache"
    description: "Provides fast read access and cached state for the platform."
  - type: "container"
    name: "Observability / Monitoring (Azure Application Insights)"
    technology: "Azure Application Insights"
    description: "Provides centralized observability across cloud and on-premise boundaries."
relationships:
  - source: "Customers and Brokers"
    destination: "Web Application (SPA)"
    description: "Interact with web application"
    technology: "HTTPS/REST (SSO via Active Directory)"
  - source: "Claims Adjusters"
    destination: "Web Application (SPA)"
    description: "Interact with web application"
    technology: "HTTPS/REST (SSO via Active Directory)"
  - source: "Web Application (SPA)"
    destination: "Backend-for-Frontend (BFF)"
    description: "Communicates with BFF"
    technology: "HTTPS/REST"
  - source: "Backend-for-Frontend (BFF)"
    destination: "Claim Management Core"
    description: "Communicates with Claim Management Core"
    technology: "HTTPS/REST"
  - source: "Backend-for-Frontend (BFF)"
    destination: "Anti-Corruption Layer (ACL)"
    description: "Communicates with Anti-Corruption Layer"
    technology: "HTTPS/REST"
  - source: "Anti-Corruption Layer (ACL)"
    destination: "On-Premise COBOL/DB2 Mainframe (System of Record)"
    description: "Exchanges data with legacy mainframe"
    technology: "Secure mainframe protocols"
  - source: "Claim Management Core"
    destination: "Message Broker (Azure Service Bus)"
    description: "Publishes and subscribes events"
    technology: "Azure Service Bus"
  - source: "Anti-Corruption Layer (ACL)"
    destination: "Message Broker (Azure Service Bus)"
    description: "Publishes and subscribes events"
    technology: "Azure Service Bus"
  - source: "Data Synchronization / ETL Service"
    destination: "On-Premise COBOL/DB2 Mainframe (System of Record)"
    description: "Replicates state with mainframe"
    technology: "ETL / Secure Protocols"
  - source: "Data Synchronization / ETL Service"
    destination: "Cache / Read Model Store"
    description: "Replicates state with read model store"
    technology: "Database Replication"
  - source: "Web Application (SPA)"
    destination: "On-Premise Active Directory"
    description: "Authenticates via SSO"
    technology: "HTTPS"