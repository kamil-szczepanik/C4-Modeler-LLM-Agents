level: component
scope: "Component diagram for the API Gateway / Anti-Corruption Layer (ACL) container"
parentContainer:
  name: "API Gateway / Anti-Corruption Layer (ACL)"
elements:
  - type: "component"
    name: "REST API Router"
    technology: "Custom microservices on Azure"
    description: "Handles incoming HTTPS/REST traffic from customers and brokers submitting claims online."
  - type: "component"
    name: "Transformation Engine"
    technology: "Custom microservices on Azure"
    description: "Decouples modern domain models from rigid legacy mainframe contracts using an adapter pattern."
  - type: "component"
    name: "Cache Manager"
    technology: "Azure Redis Cache"
    description: "Executes read-through and write-behind caching to meet sub-second response SLAs."
  - type: "component"
    name: "Message Publisher"
    technology: "Azure Service Bus"
    description: "Dispatches asynchronous event messaging and queueing for background processing."
relationships:
  - source: "REST API Router"
    destination: "Transformation Engine"
    description: "Routes requests for contract translation and validation"
  - source: "Transformation Engine"
    destination: "Cache Manager"
    description: "Reads and writes cached claim data via TCP/Redis Protocol"
  - source: "Transformation Engine"
    destination: "Message Publisher"
    description: "Sends asynchronous events via AMQP/HTTPS"