level: component
scope: "Component diagram for the Backend-for-Frontend (BFF) container"
parentContainer:
  name: "Backend-for-Frontend (BFF)"
elements:
  - type: "component"
    name: "Adjuster Web Application Handler"
    technology: "Azure Web Applications / Node.js"
    description: "Orchestrates interactions for the adjuster web application and exposes endpoints for client consumption."
  - type: "component"
    name: "Orchestration & Data Retrieval Handler"
    technology: "Azure Web Applications / REST / gRPC"
    description: "Manages internal orchestration and data retrieval interacting with the API Gateway and ACL."
  - type: "component"
    name: "Caching & State Manager"
    technology: "Azure Redis Cache / TCP"
    description: "Externalizes session state and caches pre-aggregated read models for low-latency responses."
  - type: "component"
    name: "Event-Driven Migration Publisher"
    technology: "Azure Service Bus / AMQP"
    description: "Handles asynchronous event-driven migration tasks and messaging."
relationships:
  - source: "Adjuster Web Application Handler"
    destination: "Orchestration & Data Retrieval Handler"
    description: "Delegates requests for internal orchestration and data retrieval [HTTPS / gRPC]"
  - source: "Orchestration & Data Retrieval Handler"
    destination: "Caching & State Manager"
    description: "Reads and writes low-latency read models and session state [TCP / Redis Protocol]"
  - source: "Orchestration & Data Retrieval Handler"
    destination: "Event-Driven Migration Publisher"
    description: "Dispatches asynchronous events for migration [AMQP / MQTT]"