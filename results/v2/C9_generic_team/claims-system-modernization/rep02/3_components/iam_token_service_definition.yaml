level: component
scope: "Component diagram for the IAM / Token Service container"
parentContainer:
  name: "IAM / Token Service"
elements:
  - type: "component"
    name: "Authentication & Token Controller"
    technology: "Azure Identity services / OAuth 2.0 / OIDC"
    description: "Handles incoming authentication requests and issues tokens for the Backend-for-Frontend (BFF)."
  - type: "component"
    name: "Directory Synchronization Service"
    technology: "Azure AD / Entra ID Connect"
    description: "Synchronizes user identities and performs Single Sign-On with Corporate Active Directory."
relationships:
  - source: "Authentication & Token Controller"
    destination: "Directory Synchronization Service"
    description: "Validates credentials and retrieves user profiles via OIDC / SAML / LDAP"