level: component
scope: "Component diagram for the Centralized Logging & Monitoring container"
parentContainer:
  name: "Centralized Logging & Monitoring"
elements:
  - type: "component"
    name: "Azure Monitor"
    technology: "Managed PaaS (Application Insights)"
    description: "Provides operational visibility, metrics, logs, and alerts with managed PaaS capabilities to minimize operational overhead."
  - type: "component"
    name: "API Gateway / Anti-Corruption Layer (ACL)"
    technology: "API Gateway with Log-Scrubbing Middleware"
    description: "Performs log-scrubbing and acts as an entry point with injected correlation IDs for legacy mainframe integration."
  - type: "component"
    name: "Azure App Configuration and Azure Key Vault"
    technology: "Azure PaaS"
    description: "Enables dynamic log-level toggling across the architecture."
  - type: "component"
    name: "CI/CD Log Schema Validation Linter"
    technology: "CI/CD Pipeline Tool"
    description: "Enforces JSON structured logging and schema validation to ensure maintainability and consistent log parsing."
  - type: "component"
    name: "Azure Blob Storage"
    technology: "Azure Blob Storage"
    description: "Provides cold archival for compliance audit trails via automated scheduled exports."
relationships:
  - source: "Microservices & ACL"
    destination: "Azure Monitor"
    description: "Transmits telemetry via HTTPS / OpenTelemetry using W3C Trace Context headers."
  - source: "API Gateway / ACL"
    destination: "Legacy COBOL/DB2 Mainframe"
    description: "Communicates via Synchronous Protocol / Batch with injected correlation IDs."
  - source: "Azure Monitor"
    destination: "On-Call Notification Channels"
    description: "Sends actionable alerts via HTTPS / Webhooks."
  - source: "Azure Monitor"
    destination: "Azure Blob Storage"
    description: "Exports logs via Automated Scheduled Export for archival."