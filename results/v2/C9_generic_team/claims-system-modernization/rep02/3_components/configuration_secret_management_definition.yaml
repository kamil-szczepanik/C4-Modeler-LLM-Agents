level: component
scope: "Component diagram for the Configuration & Secret Management container"
parentContainer:
  name: "Configuration & Secret Management"
elements:
  - type: "component"
    name: "Azure Key Vault"
    technology: "Azure Key Vault"
    description: "Manages secure credentials, secrets, and automated lifecycle/rotation policies to protect hybrid boundaries."
  - type: "component"
    name: "Azure App Configuration"
    technology: "Azure App Configuration"
    description: "Stores dynamic feature flags and environment settings using labels for canary testing and rapid rollbacks."
  - type: "component"
    name: "Azure Bicep"
    technology: "Azure Bicep"
    description: "Enforces repeatable, version-controlled Infrastructure-as-Code provisioning."
  - type: "component"
    name: "Azure Policy"
    technology: "Azure Policy"
    description: "Provides compliance and drift detection."
  - type: "component"
    name: "Azure Monitor"
    technology: "Azure Monitor and Out-of-the-Box Dashboards"
    description: "Tracks telemetry, fetch latency, cache hit ratios, and authentication failures."
  - type: "component"
    name: "CI/CD Pipelines with JSON Schema Validation"
    technology: "CI/CD Pipelines / JSON Schema"
    description: "Prevents malformed configurations during CI/CD deployments and deploys infrastructure."
  - type: "component"
    name: "Centralized Configuration Abstraction Layer"
    technology: "Unified client interface"
    description: "Provides a unified client interface for microservices."
relationships:
  - source: "Microservices"
    destination: "Azure Key Vault"
    description: "Fetches secrets using Azure SDKs via HTTPS/TLS 1.3"
  - source: "Microservices"
    destination: "Azure App Configuration"
    description: "Fetches configuration parameters using Azure SDKs via HTTPS/TLS 1.3"
  - source: "Azure Policy"
    destination: "Azure Key Vault"
    description: "Audits settings against Azure Bicep templates"
  - source: "Azure Policy"
    destination: "Azure App Configuration"
    description: "Audits settings against Azure Bicep templates"
  - source: "Configuration stores and microservices"
    destination: "Azure Monitor"
    description: "Ingests telemetry, metrics, and logs via Azure Diagnostics"
  - source: "CI/CD Pipelines with JSON Schema Validation"
    destination: "Azure App Configuration"
    description: "Deploys infrastructure and configuration settings using Azure Resource Manager REST APIs"
  - source: "CI/CD Pipelines with JSON Schema Validation"
    destination: "Azure Key Vault"
    description: "Deploys infrastructure and configuration settings using Azure Resource Manager REST APIs"