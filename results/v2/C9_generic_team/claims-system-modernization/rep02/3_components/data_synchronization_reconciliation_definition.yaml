level: component
scope: "Component diagram for the Data Synchronization / Reconciliation container"
parentContainer:
  name: "Data Synchronization / Reconciliation"
elements:
  - type: "component"
    name: "Azure Functions and WebJobs"
    technology: "Azure Functions / WebJobs"
    description: "Serverless execution for reconciliation, background processing, and data synchronization using the Adapter Pattern and Idempotent Upsert Pattern."
  - type: "component"
    name: "Azure Service Bus"
    technology: "Azure Service Bus"
    description: "Managed event broker providing reliable messaging, Dead Letter Queues, and routing for asynchronous synchronization events."
  - type: "component"
    name: "Azure Redis Cache"
    technology: "Azure Redis Cache"
    description: "Low-latency caching layer to store claim state and checksums for rapid comparison using the Idempotent Upsert Pattern."
  - type: "component"
    name: "Azure Blob Storage"
    technology: "Azure Blob Storage"
    description: "Claim Check payload repository used to offload heavy payloads via the Claim Check Pattern."
  - type: "component"
    name: "Azure App Configuration and Key Vault"
    technology: "Azure App Configuration & Key Vault"
    description: "Externalized JSON/YAML mapping schemas and secrets management to support configuration-driven field transformations without code deployments."
  - type: "component"
    name: "On-Premises COBOL/DB2 Mainframe"
    technology: "COBOL / DB2"
    description: "System of Record maintaining the legacy insurance claims data."
relationships:
  - source: "Azure Functions and WebJobs"
    destination: "On-Premises COBOL/DB2 Mainframe"
    description: "Synchronizes data via secure extraction files using the Adapter Pattern"
  - source: "Azure Functions and WebJobs"
    destination: "Azure Redis Cache"
    description: "Reads and writes state and cache data using the Idempotent Upsert Pattern"
  - source: "Azure Functions and WebJobs"
    destination: "Azure Blob Storage"
    description: "Offloads heavy payloads using the Claim Check Pattern"
  - source: "Azure Functions and WebJobs"
    destination: "Azure Service Bus"
    description: "Routes asynchronous synchronization events and Dead Letter Queue messages"