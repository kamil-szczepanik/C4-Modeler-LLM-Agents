level: container
scope: "Container diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization"
elements:
  - type: "person"
    name: "Customers"
    description: "Submit claims online."
  - type: "person"
    name: "Brokers"
    description: "Submit claims online."
  - type: "person"
    name: "Claims Adjusters"
    description: "Interact with the claims application."
  - type: "externalSystem"
    name: "COBOL/DB2 Mainframe"
    description: "On-premises legacy System of Record."
  - type: "externalSystem"
    name: "Corporate Active Directory"
    description: "On-premises identity and authentication provider."
  - type: "container"
    name: "API Gateway / Anti-Corruption Layer (ACL)"
    technology: "Custom microservices on Azure"
    description: "Decouples modern Azure components from rigid mainframe contracts and handles claim submissions."
  - type: "container"
    name: "Event Broker"
    technology: "Azure Service Bus"
    description: "Enables reliable asynchronous messaging and strangler migration support."
  - type: "container"
    name: "Caching / State Store"
    technology: "Azure Redis Cache"
    description: "Meets sub-2-second UI performance targets by providing low-latency read models."
  - type: "container"
    name: "Data Synchronization / Reconciliation"
    technology: "Azure Functions / WebJobs"
    description: "Handles asynchronous reconciliation and data consistency."
  - type: "container"
    name: "Backend-for-Frontend (BFF)"
    technology: "Azure web applications"
    description: "Supports the adjuster web application and internal orchestration."
  - type: "container"
    name: "Centralized Logging & Monitoring"
    technology: "Azure Monitoring"
    description: "Provides operational visibility across containers."
  - type: "container"
    name: "IAM / Token Service"
    technology: "Azure Identity services"
    description: "Integrated with corporate Active Directory for SSO."
  - type: "container"
    name: "Configuration & Secret Management"
    technology: "Azure Key Vault and App Configuration"
    description: "Handles secure credentials and feature-flags."
  - type: "container"
    name: "Worker / Background Processing"
    technology: "Azure Functions / WebJobs"
    description: "Executes asynchronous background processing tasks."
relationships:
  - source: "Customers"
    destination: "API Gateway / Anti-Corruption Layer (ACL)"
    description: "Submit claims online"
    technology: "HTTPS / REST"
  - source: "Brokers"
    destination: "API Gateway / Anti-Corruption Layer (ACL)"
    description: "Submit claims online"
    technology: "HTTPS / REST"
  - source: "Claims Adjusters"
    destination: "Backend-for-Frontend (BFF)"
    description: "Interact with the adjuster web application"
    technology: "HTTPS / REST"
  - source: "Backend-for-Frontend (BFF)"
    destination: "API Gateway / Anti-Corruption Layer (ACL)"
    description: "Internal orchestration and data retrieval"
    technology: "HTTPS / gRPC"
  - source: "API Gateway / Anti-Corruption Layer (ACL)"
    destination: "COBOL/DB2 Mainframe"
    description: "System of record updates"
    technology: "Batch / Legacy protocols"
  - source: "Backend-for-Frontend (BFF)"
    destination: "Event Broker"
    description: "Asynchronous event-driven migration"
    technology: "AMQP / MQTT"
  - source: "Backend-for-Frontend (BFF)"
    destination: "Caching / State Store"
    description: "Low-latency read models"
    technology: "TCP / Redis Protocol"
  - source: "IAM / Token Service"
    destination: "Corporate Active Directory"
    description: "Single Sign-On authentication"
    technology: "OIDC / SAML"