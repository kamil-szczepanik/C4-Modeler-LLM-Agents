level: container
scope: "Container diagram for Hybrid Insurance Claims Modernization Platform"
system:
  name: "Hybrid Insurance Claims Modernization Platform"
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "External users submitting claims online."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users managing claims."
  - type: "externalSystem"
    name: "COBOL/DB2 Mainframe"
    description: "Legacy on-premise system of record."
  - type: "externalSystem"
    name: "Active Directory"
    description: "Insurer's identity provider for SSO."
  - type: "container"
    name: "API Gateway Container"
    description: "Manages and routes incoming client traffic."
    technology: "Azure Container Apps / API Management"
  - type: "container"
    name: "Customer BFF Container"
    description: "Backend-For-Frontend tailored for customer and broker experiences."
    technology: "Azure App Service / Container Apps"
  - type: "container"
    name: "Adjuster BFF Container"
    description: "Backend-For-Frontend tailored for claims adjuster workflows."
    technology: "Azure App Service / Container Apps"
  - type: "container"
    name: "Modular Monolith Container"
    description: "Core business logic container hosted in Azure."
    technology: "Azure App Service / Container Apps"
  - type: "container"
    name: "Anti-Corruption Layer (ACL) Container"
    description: "Translates and manages integration with the legacy mainframe."
    technology: "Azure Container Apps"
  - type: "container"
    name: "Routing / Feature Flag Container"
    description: "Handles dynamic request routing and feature flag evaluations."
    technology: "Container Apps"
  - type: "container"
    name: "Data Sync / Reconciliation Container"
    description: "Ensures continuous synchronization with the legacy system of record."
    technology: "Azure Container Apps"
  - type: "container"
    name: "Asynchronous Messaging & Caching Layer"
    description: "Handles asynchronous messaging and performance caching."
    technology: "Azure Service Bus and Redis"
  - type: "container"
    name: "IAM Proxy / Token Exchange Container"
    description: "Handles authentication and token exchange."
    technology: "Container Apps"
  - type: "container"
    name: "Observability & Logging Container"
    description: "Collects centralized telemetry and distributed tracing."
    technology: "Azure Application Insights"
  - type: "container"
    name: "Configuration & Secrets Management Container"
    description: "Manages centralized configuration and secrets."
    technology: "Azure Key Vault"
relationships:
  - source: "Customers and Brokers"
    destination: "Customer BFF Container"
    description: "Interacts for online submissions"
    technology: "HTTPS (TLS 1.3)"
  - source: "Claims Adjusters"
    destination: "Adjuster BFF Container"
    description: "Interacts for adjuster workflows"
    technology: "HTTPS (TLS 1.3)"
  - source: "Customer BFF Container"
    destination: "API Gateway Container"
    description: "Communicates via internal APIs"
    technology: "Internal HTTPS/REST"
  - source: "Adjuster BFF Container"
    destination: "API Gateway Container"
    description: "Communicates via internal APIs"
    technology: "Internal HTTPS/REST"
  - source: "API Gateway Container"
    destination: "Routing / Feature Flag Container"
    description: "Routes traffic"
    technology: "Internal REST/gRPC"
  - source: "Routing / Feature Flag Container"
    destination: "Modular Monolith Container"
    description: "Forwards routed traffic"
    technology: "Internal REST/gRPC"
  - source: "Modular Monolith Container"
    destination: "Anti-Corruption Layer (ACL) Container"
    description: "Communicates with legacy system"
    technology: "Internal REST/gRPC"
  - source: "Anti-Corruption Layer (ACL) Container"
    destination: "COBOL/DB2 Mainframe"
    description: "Secure communication with system of record"
    technology: "Secure VPN/TLS"
  - source: "Modular Monolith Container"
    destination: "Asynchronous Messaging & Caching Layer"
    description: "Utilizes for async processing and caching"
    technology: "AMQP and Redis Protocol"
  - source: "IAM Proxy / Token Exchange Container"
    destination: "Active Directory"
    description: "Integrates for authentication"
    technology: "SAML/OAuth2/OIDC"
  - source: "Observability & Logging Container"
    destination: "API Gateway Container"
    description: "Collects telemetry"
    technology: "Telemetry SDK"
  - source: "Observability & Logging Container"
    destination: "Customer BFF Container"
    description: "Collects telemetry"
    technology: "Telemetry SDK"
  - source: "Observability & Logging Container"
    destination: "Adjuster BFF Container"
    description: "Collects telemetry"
    technology: "Telemetry SDK"
  - source: "Observability & Logging Container"
    destination: "Modular Monolith Container"
    description: "Collects telemetry"
    technology: "Telemetry SDK"