level: component
scope: "Component diagram for the Observability & Logging Container container"
parentContainer:
  name: "Observability & Logging Container"
elements:
  - type: "component"
    name: "OpenTelemetry Collector Sidecar"
    technology: "OpenTelemetry Collector"
    description: "Collects telemetry, traces, and structured JSON logs from application containers."
  - type: "component"
    name: "Centralized Audit Log Sink"
    technology: "Azure Managed Storage / Secure API"
    description: "Receives and stores security and data mutation events."
  - type: "component"
    name: "Azure Application Insights"
    technology: "Azure Application Insights (Managed SaaS)"
    description: "Centralized managed SaaS telemetry platform for distributed tracing and monitoring."
relationships:
  - source: "OpenTelemetry Collector Sidecar"
    destination: "Azure Application Insights"
    description: "Forwards aggregated traces, metrics, and logs via HTTPS"
  - source: "Centralized Audit Log Sink"
    destination: "Azure Application Insights"
    description: "Integrates audit records and security events for monitoring via Secure API"