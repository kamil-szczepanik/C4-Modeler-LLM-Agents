level: component
scope: "Component diagram for the IAM Proxy / Token Exchange Container container"
parentContainer:
  name: "IAM Proxy / Token Exchange Container"
elements:
  - type: "component"
    name: "Authentication and Token Exchange Module"
    technology: "Azure App Service Authentication (Easy Auth) / RFC 8693"
    description: "Authenticates users against Active Directory and standardizes token exchange using SAML/OAuth2/OIDC without custom protocol translation."
  - type: "component"
    name: "Session and Cache Manager"
    technology: "Redis"
    description: "Caches session states and token validations to accelerate validation checks and support adjuster screen performance."
  - type: "component"
    name: "Security Telemetry Reporter"
    technology: "Azure Application Insights / W3C Trace Context"
    description: "Reports security events and propagates correlation IDs across the hybrid boundary for end-to-end observability."
  - type: "component"
    name: "Configuration and Secrets Loader"
    technology: "Azure Key Vault"
    description: "Dynamically supplies immutable configuration, issuer mappings, and secrets at startup to prevent configuration drift."
relationships:
  - source: "Authentication and Token Exchange Module"
    destination: "Session and Cache Manager"
    description: "Caches session states and token validations using"
  - source: "Authentication and Token Exchange Module"
    destination: "Security Telemetry Reporter"
    description: "Reports security events using"
  - source: "Configuration and Secrets Loader"
    destination: "Authentication and Token Exchange Module"
    description: "Supplies immutable configuration, issuer mappings, and secrets to"