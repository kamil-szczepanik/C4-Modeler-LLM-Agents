level: component
scope: "Component diagram for the Adjuster BFF Container container"
parentContainer:
  name: "Adjuster BFF Container"
elements:
  - type: "component"
    name: "Adjuster UI Controller"
    technology: "Azure App Service / Container Apps"
    description: "Handles incoming HTTPS requests from claims adjusters and serves adjuster workflows."
  - type: "component"
    name: "API Integration Client"
    technology: "Internal HTTPS/REST"
    description: "Communicates with the downstream API Gateway Container for data retrieval and submission."
  - type: "component"
    name: "Telemetry Integration Agent"
    technology: "Telemetry SDK"
    description: "Collects and forwards telemetry data to the Observability & Logging Container."
relationships:
  - source: "Adjuster UI Controller"
    destination: "API Integration Client"
    description: "Delegates downstream API calls"
  - source: "Telemetry Integration Agent"
    destination: "Adjuster UI Controller"
    description: "Monitors and collects telemetry"