level: component
scope: "Component diagram for the Routing / Feature Flag Container container"
parentContainer:
  name: "Routing / Feature Flag Container"
elements:
  - type: "component"
    name: "Routing Engine"
    technology: "Azure Container Apps, REST/gRPC"
    description: "Manages dynamic request routing and traffic splitting between the legacy mainframe and modern platform."
  - type: "component"
    name: "Feature Flag Evaluation Engine"
    technology: "OpenFeature standard"
    description: "Evaluates feature flags using an open specification to support gradual migration and rapid rollbacks."
  - type: "component"
    name: "Local Cache Manager"
    technology: "In-memory LRU cache, Redis"
    description: "Caches evaluated flags locally to achieve sub-millisecond evaluation latencies."
  - type: "component"
    name: "Configuration Sync Component"
    technology: "Azure App Configuration"
    description: "Fetches and synchronizes dynamic routing rules and migration flags."
  - type: "component"
    name: "Telemetry Emitter"
    technology: "OpenTelemetry, Azure Application Insights"
    description: "Emits asynchronous audit logs, evaluation latency metrics, and telemetry."
relationships:
  - source: "Routing Engine"
    destination: "Feature Flag Evaluation Engine"
    description: "Queries feature flags to determine traffic destination"
  - source: "Feature Flag Evaluation Engine"
    destination: "Local Cache Manager"
    description: "Checks local cache for flag evaluations"
  - source: "Local Cache Manager"
    destination: "Redis"
    description: "Backs local in-memory flag cache"
  - source: "Configuration Sync Component"
    destination: "Azure App Configuration"
    description: "Fetches dynamic routing rules"
  - source: "Telemetry Emitter"
    destination: "Observability & Logging Container"
    description: "Emits asynchronous audit logs and telemetry via OpenTelemetry"
  - source: "Routing Engine"
    destination: "Modular Monolith Container"
    description: "Routes live traffic via internal REST/gRPC"