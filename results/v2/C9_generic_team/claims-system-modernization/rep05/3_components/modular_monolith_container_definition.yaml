level: component
scope: "Component diagram for the Modular Monolith Container container"
parentContainer:
  name: "Modular Monolith Container"
elements:
  - type: "component"
    name: "Claims Domain Module"
    technology: "C# / .NET Core Domain Model"
    description: "Encapsulates the core business logic and rules for insurance claims processing using Hexagonal/Clean Architecture."
  - type: "component"
    name: "Policy Domain Module"
    technology: "C# / .NET Core Domain Model"
    description: "Encapsulates policy validation and management domain logic."
  - type: "component"
    name: "Application Services"
    technology: "C# / .NET Core Application Layer"
    description: "Orchestrates use cases, handling transactions, outbox/inbox patterns, and coordinating domain modules."
  - type: "component"
    name: "Infrastructure Adapters"
    technology: "C# / .NET Core Infrastructure"
    description: "Implements outbound ports for communicating with the Anti-Corruption Layer (ACL), Asynchronous Messaging & Caching Layer, and databases."
relationships:
  - source: "Application Services"
    destination: "Claims Domain Module"
    description: "Executes business use cases"
  - source: "Application Services"
    destination: "Policy Domain Module"
    description: "Validates policy rules"
  - source: "Application Services"
    destination: "Infrastructure Adapters"
    description: "Invokes external calls and persistence operations"
  - source: "Infrastructure Adapters"
    destination: "Anti-Corruption Layer (ACL) Container"
    description: "Communicates with legacy system [Internal REST/gRPC]"
  - source: "Infrastructure Adapters"
    destination: "Asynchronous Messaging & Caching Layer"
    description: "Publishes/consumes async messages and caches data [AMQP and Redis Protocol]"