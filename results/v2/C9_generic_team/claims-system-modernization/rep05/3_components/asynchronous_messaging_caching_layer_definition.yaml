level: component
scope: "Component diagram for the Asynchronous Messaging & Caching Layer container"
parentContainer:
  name: "Asynchronous Messaging & Caching Layer"
elements:
  - type: "component"
    name: "Azure Service Bus"
    technology: "Azure Cloud Service"
    description: "Handles asynchronous messaging, event publishing, dead-letter queues, and at-least-once delivery guarantees."
  - type: "component"
    name: "Azure Cache for Redis"
    technology: "Azure Cloud Service"
    description: "Provides high-performance caching for read-heavy reference data using the Redis Protocol via Cache-Aside pattern."
  - type: "component"
    name: "Azure Blob Storage"
    technology: "Azure Cloud Service"
    description: "Stores large binary files via the Claim Check pattern to keep message payloads small."
  - type: "component"
    name: "Modular Monolith"
    technology: ".NET Core / Containerized Runtime"
    description: "Core business logic container processing claims, consuming messages, and implementing the Transactional Outbox Pattern."
  - type: "component"
    name: "Azure Application Insights"
    technology: "Azure Cloud Service"
    description: "Collects telemetry, metrics, and distributed tracing for dead-letter queues and message processing states."
relationships:
  - source: "Modular Monolith"
    destination: "Azure Service Bus"
    description: "Publishes and consumes domain events using AMQP with W3C trace context headers."
  - source: "Modular Monolith"
    destination: "Azure Cache for Redis"
    description: "Reads and writes cached reference data using the Redis Protocol via Cache-Aside pattern."
  - source: "Modular Monolith"
    destination: "Azure Blob Storage"
    description: "Offloads and retrieves large binary documents using HTTPS via Claim Check pattern."
  - source: "Azure Service Bus"
    destination: "Azure Application Insights"
    description: "Emits telemetry for dead-letter queues and message processing states."