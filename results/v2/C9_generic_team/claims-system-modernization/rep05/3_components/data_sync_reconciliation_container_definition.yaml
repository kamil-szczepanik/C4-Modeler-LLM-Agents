level: component
scope: "Component diagram for the Data Sync / Reconciliation Container container"
parentContainer:
  name: "Data Sync / Reconciliation Container"
elements:
  - type: "component"
    name: "Sync Orchestrator"
    technology: "Azure Container Apps / .NET Worker"
    description: "Orchestrates background data synchronization workflows between the modern platform and the legacy mainframe."
  - type: "component"
    name: "DB2 Connector"
    technology: "IBM DB2 Driver / ADO.NET"
    description: "Establishes secure connections to read and write data directly from the COBOL/DB2 Mainframe data store."
  - type: "component"
    name: "Reconciliation Engine"
    technology: "Azure Container Apps / C#"
    description: "Compares state between the modern modular monolith data store and the mainframe to ensure consistency."
relationships:
  - source: "Sync Orchestrator"
    destination: "DB2 Connector"
    description: "Uses to query and update mainframe data"
  - source: "Sync Orchestrator"
    destination: "Reconciliation Engine"
    description: "Triggers consistency checks"