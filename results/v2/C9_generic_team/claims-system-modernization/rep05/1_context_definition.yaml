# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Hybrid Insurance Claims Modernization Platform"
system:
  name: "Hybrid Insurance Claims Modernization Platform"
  description: "Incrementally replaces a legacy mainframe with a modern Azure platform while maintaining data consistency."
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "External users submitting claims online."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users managing claims via the modern web application."
  - type: "externalSystem"
    name: "COBOL/DB2 Mainframe"
    description: "On-premise system of record."
  - type: "container"
    name: "Modern Web Application"
    description: "Azure App Service container hosting adjuster screens."
    technology: "Azure App Service"
  - type: "container"
    name: "Anti-Corruption Layer (ACL)"
    description: "Microservice container managing dynamic routing, feature flags, and contract mapping."
    technology: "Microservice Container"
  - type: "container"
    name: "Azure Service Bus"
    description: "Message broker handling asynchronous communication."
    technology: "Azure Service Bus"
relationships:
  - source: "Customers and Brokers"
    destination: "Modern Web Application"
    description: "Submitting claims online"
    technology: "HTTPS (REST)"
  - source: "Claims Adjusters"
    destination: "Modern Web Application"
    description: "Managing claims via the modern web application"
    technology: "HTTPS (REST, SSO via Active Directory)"
  - source: "Modern Web Application"
    destination: "Azure Service Bus"
    description: "Handling asynchronous communication"
    technology: "AMQP/HTTPS"
  - source: "Anti-Corruption Layer (ACL)"
    destination: "COBOL/DB2 Mainframe"
    description: "Managing dynamic routing and contract mapping"
    technology: "MQ/TCP with Circuit Breakers"