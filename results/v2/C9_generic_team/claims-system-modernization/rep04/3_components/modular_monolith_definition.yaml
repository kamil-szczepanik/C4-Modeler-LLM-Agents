level: component
scope: "Component diagram for the Modular Monolith container"
parentContainer:
  name: "Modular Monolith"
elements:
  - type: "component"
    name: "Claims Processing Module"
    technology: "C# / .NET Core"
    description: "Encapsulates core business logic and rules for online claims and adjuster workflows."
  - type: "component"
    name: "Data Access Layer"
    technology: "Entity Framework Core / TCP/TLS"
    description: "Persists state to Azure Cosmos DB and caches read models via Redis."
  - type: "component"
    name: "Integration Outbox Service"
    technology: ".NET Core / AMQP"
    description: "Publishes claim events asynchronously to Azure Service Bus for synchronization with the ACL."
  - type: "component"
    name: "Secret Management Client"
    technology: "Azure SDK for .NET / HTTPS"
    description: "Retrieves secrets securely from Azure Key Vault."
relationships:
  - source: "Claims Processing Module"
    destination: "Data Access Layer"
    description: "Persists state and caches read models via"
  - source: "Claims Processing Module"
    destination: "Integration Outbox Service"
    description: "Dispatches domain events to"
  - source: "Claims Processing Module"
    destination: "Secret Management Client"
    description: "Requests runtime secrets from"