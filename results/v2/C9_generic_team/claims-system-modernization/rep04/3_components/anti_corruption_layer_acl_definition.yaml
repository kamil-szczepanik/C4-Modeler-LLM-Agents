level: component
scope: "Component diagram for the Anti-Corruption Layer (ACL) container"
parentContainer:
  name: "Anti-Corruption Layer (ACL)"
elements:
  - type: "component"
    name: "Transactional Outbox & De-duplication Engine"
    technology: "Redis, .NET / C#"
    description: "Manages reliable messaging and idempotency via Redis."
  - type: "component"
    name: "Data Transformation & Mapping Layer"
    technology: ".NET / C#, Pact"
    description: "Translates legacy COBOL copybooks into modern domain events and enforces payload validation."
  - type: "component"
    name: "Resilience & Routing Manager"
    technology: ".NET / C#, Polly"
    description: "Implements Circuit Breakers, Feature Flags, and declarative routing rules."
  - type: "component"
    name: "Monitoring & Diagnostics"
    technology: "Azure Monitor, OpenTelemetry"
    description: "Handles distributed tracing, health check probes, and Dead Letter Queue (DLQ) operations."
relationships:
  - source: "Resilience & Routing Manager"
    destination: "Data Transformation & Mapping Layer"
    description: "Routes processed requests to transformation"
  - source: "Data Transformation & Mapping Layer"
    destination: "Transactional Outbox & De-duplication Engine"
    description: "Saves outbox state and checks idempotency"