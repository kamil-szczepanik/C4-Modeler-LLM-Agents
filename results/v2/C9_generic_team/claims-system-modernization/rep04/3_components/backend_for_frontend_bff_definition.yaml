level: component
scope: "Component diagram for the Backend-for-Frontend (BFF) container"
parentContainer:
  name: "Backend-for-Frontend (BFF)"
elements:
  - type: "component"
    name: "API Gateway Controller"
    technology: "Azure Container Apps / OpenAPI/Swagger"
    description: "Standardizes API contracts, schema validation at the BFF boundary, and routes incoming requests from customers, brokers, and claims adjusters."
  - type: "component"
    name: "Session and Cache Manager"
    technology: "Azure Redis Cache"
    description: "Manages session state and aggressive caching to meet sub-2s response requirements."
  - type: "component"
    name: "Security and Secret Retriever"
    technology: "Azure Key Vault / Active Directory"
    description: "Handles secure secret retrieval and integrates with Active Directory for identity provision."
  - type: "component"
    name: "Tracing and Telemetry Agent"
    technology: "W3C Trace Context headers"
    description: "Enables distributed tracing across the hybrid Azure and on-prem boundary."
relationships:
  - source: "API Gateway Controller"
    destination: "Session and Cache Manager"
    description: "Caches session state and query results [In-Memory/TCP]"
  - source: "API Gateway Controller"
    destination: "Security and Secret Retriever"
    description: "Secure secret retrieval [HTTPS]"
  - source: "API Gateway Controller"
    destination: "Tracing and Telemetry Agent"
    description: "Injects and propagates W3C Trace Context headers [HTTP Headers]"