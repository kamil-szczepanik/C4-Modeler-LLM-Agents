level: container
scope: "Container diagram for Azure Claims Modernization Platform"
system:
  name: "Azure Claims Modernization Platform"
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "Users who submit claims online via the modern platform."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users who interact with and process claims via a web application."
  - type: "externalSystem"
    name: "On-Premises COBOL/DB2 Mainframe"
    description: "System of record containing legacy claims data and processing logic."
  - type: "externalSystem"
    name: "Active Directory"
    description: "Identity Provider used for Single Sign-On (SSO) integration."
  - type: "container"
    name: "Backend-for-Frontend (BFF)"
    technology: "Azure Container Apps"
    description: "Handles incoming requests from web interfaces and communicates with internal services."
  - type: "container"
    name: "Modular Monolith"
    technology: "Azure Container Apps"
    description: "Core business logic container maintaining clean internal boundaries."
  - type: "container"
    name: "Anti-Corruption Layer (ACL)"
    technology: "Azure Container Apps"
    description: "Isolates legacy schemas and communicates with the on-premises mainframe."
  - type: "container"
    name: "Azure Service Bus"
    technology: "Azure Service Bus"
    description: "Message broker providing asynchronous messaging and zero data loss."
  - type: "container"
    name: "Azure Cosmos DB / Redis"
    technology: "Azure Cosmos DB, Redis"
    description: "State store and transactional outbox cache."
  - type: "container"
    name: "Azure Key Vault"
    technology: "Azure Key Vault"
    description: "Centralized secrets management."
relationships:
  - source: "Customers and Brokers"
    destination: "Backend-for-Frontend (BFF)"
    description: "Submit claims online"
    technology: "HTTPS/REST"
  - source: "Claims Adjusters"
    destination: "Backend-for-Frontend (BFF)"
    description: "Claim handling and processing"
    technology: "HTTPS/REST"
  - source: "Backend-for-Frontend (BFF)"
    destination: "Modular Monolith"
    description: "Communicates for application logic"
    technology: "Internal HTTPS/REST"
  - source: "Modular Monolith"
    destination: "Azure Cosmos DB / Redis"
    description: "Transactional outbox persistence and state management"
    technology: "TCP/TLS"
  - source: "Anti-Corruption Layer (ACL)"
    destination: "On-Premises COBOL/DB2 Mainframe"
    description: "Integrates with legacy system of record"
    technology: "Legacy protocols over secure VPN/ExpressRoute"
  - source: "Backend-for-Frontend (BFF)"
    destination: "Azure Key Vault"
    description: "Retrieves secrets securely"
    technology: "HTTPS"
  - source: "Modular Monolith"
    destination: "Azure Key Vault"
    description: "Retrieves secrets securely"
    technology: "HTTPS"
  - source: "Anti-Corruption Layer (ACL)"
    destination: "Azure Key Vault"
    description: "Retrieves secrets securely"
    technology: "HTTPS"