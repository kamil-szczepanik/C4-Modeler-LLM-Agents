level: context
scope: "System Context diagram for Azure Claims Modernization Platform"
system:
  name: "Azure Claims Modernization Platform"
  description: "A modern Azure-hosted platform gradually replacing a 30-year-old COBOL/DB2 mainframe claims system using a Strangler Fig migration pattern to maintain continuous claim processing."
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "Users who submit claims online via the modern platform."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users who interact with and process claims via a web application."
  - type: "externalSystem"
    name: "On-Premises COBOL/DB2 Mainframe"
    description: "System of record containing legacy claims data and processing logic."
  - type: "externalSystem"
    name: "Active Directory"
    description: "Identity Provider used for Single Sign-On (SSO) integration."
  - type: "container"
    name: "Azure Service Bus"
    description: "Asynchronous messaging backbone to decouple services and handle latency."
    technology: "Azure Service Bus"
  - type: "container"
    name: "Anti-Corruption Layer and Switchboard"
    description: "Custom software component and integration gateway to isolate legacy schemas and dynamically route traffic."
    technology: "Custom Software, OpenAPI"
relationships:
  - source: "Customers and Brokers"
    destination: "Azure Claims Modernization Platform"
    description: "Submit claims online"
    technology: "HTTPS"
  - source: "Claims Adjusters"
    destination: "Azure Claims Modernization Platform"
    description: "Interact with and process claims"
    technology: "HTTPS, Azure Active Directory SSO"
  - source: "Azure Claims Modernization Platform"
    destination: "On-Premises COBOL/DB2 Mainframe"
    description: "Communicates asynchronously and routes traffic dynamically via integration gateway"
    technology: "Asynchronous Messaging, Anti-Corruption Layer"
  - source: "Azure Claims Modernization Platform"
    destination: "Active Directory"
    description: "Authenticates users via SSO"
    technology: "OIDC / OAuth"