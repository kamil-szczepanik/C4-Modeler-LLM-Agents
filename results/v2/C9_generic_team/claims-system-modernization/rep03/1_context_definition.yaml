level: context
scope: "System Context diagram for Regional Insurance Mainframe Claims System Modernization"
system:
  name: "Azure Modular Monolith Platform"
  description: "Modernizes a 30-year-old regional insurance mainframe claims system using a hybrid cloud approach, gradually migrating claim types to an Azure-hosted platform while ensuring business continuity."
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "Submit claims to the insurance system."
  - type: "person"
    name: "Claims Adjusters"
    description: "Interact with the claims application to process claims."
  - type: "externalSystem"
    name: "COBOL/DB2 On-Premises Mainframe System of Record"
    description: "Legacy 30-year-old mainframe system holding core records and data."
  - type: "externalSystem"
    name: "Azure Active Directory"
    description: "Provides enterprise identity and single sign-on capabilities."
relationships:
  - source: "Customers and Brokers"
    destination: "Azure Modular Monolith Platform"
    description: "Submit claims"
    technology: "HTTPS/REST APIs"
  - source: "Claims Adjusters"
    destination: "Azure Modular Monolith Platform"
    description: "Interact with the claims web application"
    technology: "HTTPS"
  - source: "Azure Modular Monolith Platform"
    destination: "COBOL/DB2 On-Premises Mainframe System of Record"
    description: "Routes traffic and synchronizes data via facade and ACL"
    technology: "HTTPS/MQ"
  - source: "Azure Modular Monolith Platform"
    destination: "Azure Active Directory"
    description: "Authenticates users"
    technology: "OpenID Connect/OAuth2"