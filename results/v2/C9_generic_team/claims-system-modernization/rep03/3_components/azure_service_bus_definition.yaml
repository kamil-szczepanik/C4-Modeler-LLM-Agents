level: component
scope: "Component diagram for the Azure Service Bus container"
parentContainer:
  name: "Azure Service Bus"
elements:
  - type: "component"
    name: "AMQP Message Publisher"
    technology: "AMQP / Azure Service Bus SDK"
    description: "Publishes asynchronous events from the Azure Modular Monolith Platform to Azure Service Bus."
  - type: "component"
    name: "Message Broker"
    technology: "Azure Service Bus"
    description: "Acts as the asynchronous messaging backbone providing guaranteed message delivery and decoupling."
  - type: "component"
    name: "Claim-Check Payload Handler"
    technology: "Azure Blob Storage / HTTPS"
    description: "Handles large claim attachments offloaded by the Azure Modular Monolith Platform to stay within Service Bus limits."
  - type: "component"
    name: "Telemetry and Tracing Collector"
    technology: "Azure Application Insights"
    description: "Collects distributed trace headers and telemetry with correlation IDs across cloud and mainframe boundaries."
relationships:
  - source: "AMQP Message Publisher"
    destination: "Message Broker"
    description: "Publishes asynchronous events using AMQP protocol"
  - source: "Azure Modular Monolith Platform"
    destination: "Claim-Check Payload Handler"
    description: "Offloads large claim attachments over HTTPS"
  - source: "Telemetry and Tracing Collector"
    destination: "Message Broker"
    description: "Collects distributed trace headers and telemetry"