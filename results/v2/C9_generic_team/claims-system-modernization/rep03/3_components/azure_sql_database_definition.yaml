level: component
scope: "Component diagram for the Azure SQL Database container"
parentContainer:
  name: "Azure SQL Database"
elements:
  - type: "component"
    name: "Claim Data Store"
    technology: "Azure SQL Database, Temporal Tables"
    description: "Securely stores relational claims data with strict per-module schema separation and temporal auditing."
  - type: "component"
    name: "Schema Migration Engine"
    technology: "FluentMigrator / Entity Framework Core Migrations"
    description: "Applies isolated schema migrations and automated updates for modular database deployments."
relationships:
  - source: "Schema Migration Engine"
    destination: "Claim Data Store"
    description: "Applies isolated schema migrations [SQL via Azure Bicep / Terraform]"
  - source: "Azure App Service"
    destination: "Claim Data Store"
    description: "Reads and writes claim data [Tabular Data Stream over TLS]"