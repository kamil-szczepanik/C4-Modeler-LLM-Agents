level: component
scope: "Component diagram for the Azure Application Insights container"
parentContainer:
  name: "Azure Application Insights"
elements:
  - type: "component"
    name: "Telemetry Collector"
    technology: "Application Insights SDK"
    description: "Collects telemetry, logs, and trace data from the Azure App Service."
  - type: "component"
    name: "Distributed Tracer"
    technology: "OpenTelemetry / Application Insights"
    description: "Ensures distributed tracing and observability across the hybrid cloud-mainframe boundary."
relationships:
  - source: "Telemetry Collector"
    destination: "Distributed Tracer"
    description: "Forwards collected logs and metrics for analysis via [HTTPS]"