level: component
scope: "Component diagram for the Azure Redis Cache container"
parentContainer:
  name: "Azure Redis Cache"
elements:
  - type: "component"
    name: "Cache Manager"
    technology: "Redis Protocol"
    description: "Manages transient read models and cache-aside operations to ensure sub-2-second UI response times."
  - type: "component"
    name: "Cache Invalidation Service"
    technology: "AMQP Listener"
    description: "Handles cache eviction and invalidation messages received from the Azure Service Bus."
relationships:
  - source: "Cache Manager"
    destination: "Cache Invalidation Service"
    description: "Triggers invalidation routines on domain events"