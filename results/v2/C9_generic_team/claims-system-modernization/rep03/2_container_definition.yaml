level: container
scope: "Container diagram for Insurance Claims Modernization system"
system:
  name: "Azure Modular Monolith Platform"
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "Submit online claims and interact with the insurance system."
  - type: "person"
    name: "Claims Adjusters"
    description: "Process claims and manage workflows."
  - type: "externalSystem"
    name: "COBOL/DB2 On-Premises Mainframe System of Record"
    description: "Legacy 30-year-old mainframe system holding core records and data."
  - type: "externalSystem"
    name: "Microsoft Entra ID (Azure AD)"
    description: "Provides enterprise identity and authentication services."
  - type: "container"
    name: "API Gateway"
    technology: "Azure API Gateway"
    description: "Routes incoming requests and handles initial entry for online claim submissions."
  - type: "container"
    name: "Azure App Service"
    technology: "Azure App Service (PaaS)"
    description: "Hosting the Azure Modular Monolith Platform and Anti-Corruption Layer (ACL)."
  - type: "container"
    name: "Azure SQL Database"
    technology: "Azure SQL Database"
    description: "Stores relational claims data with strict per-module schema separation."
  - type: "container"
    name: "Azure Service Bus"
    technology: "Azure Service Bus"
    description: "Enables asynchronous decoupling and communication with the on-premises mainframe."
  - type: "container"
    name: "Azure Redis Cache"
    technology: "Azure Redis Cache"
    description: "Caches read models to ensure sub-2-second UI responses."
  - type: "container"
    name: "Azure Application Insights"
    technology: "Azure Application Insights"
    description: "Provides distributed tracing across hybrid boundaries for observability."
relationships:
  - source: "Customers and Brokers"
    destination: "API Gateway"
    description: "Submit online claims"
    technology: "HTTPS"
  - source: "Claims Adjusters"
    destination: "Azure App Service"
    description: "Interact for claims management and workflows"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Microsoft Entra ID (Azure AD)"
    description: "Authenticates users"
    technology: "OpenID Connect/OAuth 2.0"
  - source: "API Gateway"
    destination: "Azure App Service"
    description: "Forwards authenticated claim submission requests"
    technology: "HTTPS"
  - source: "Azure App Service"
    destination: "COBOL/DB2 On-Premises Mainframe System of Record"
    description: "Communicates asynchronously via Anti-Corruption Layer"
    technology: "Azure Service Bus"
  - source: "Azure App Service"
    destination: "Azure SQL Database"
    description: "Reads and writes claim data"
    technology: "Tabular Data Stream"
  - source: "Azure App Service"
    destination: "Azure Redis Cache"
    description: "Caches and retrieves read models"
    technology: "Redis Protocol"
  - source: "Azure App Service"
    destination: "Azure Application Insights"
    description: "Sends telemetry and trace data"
    technology: "HTTPS"