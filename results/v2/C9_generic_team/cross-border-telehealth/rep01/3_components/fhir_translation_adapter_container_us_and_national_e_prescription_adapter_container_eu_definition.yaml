level: component
scope: "Component diagram for the FHIR Translation Adapter Container (US) and National E-Prescription Adapter Container (EU) container"
parentContainer:
  name: "FHIR Translation Adapter Container (US) and National E-Prescription Adapter Container (EU)"
elements:
