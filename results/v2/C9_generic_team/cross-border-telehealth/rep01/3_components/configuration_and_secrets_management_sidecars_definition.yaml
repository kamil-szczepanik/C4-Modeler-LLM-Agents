level: component
scope: "Component diagram for the Configuration and Secrets Management Sidecars container"
parentContainer:
  name: "Configuration and Secrets Management Sidecars"
elements:
  - type: "component"
    name: "GCP Secret Manager Client"
    technology: "gRPC/HTTPS Client"
    description: "Communicates with GCP Secret Manager to securely retrieve configuration and secrets."
  - type: "component"
    name: "Unix Domain Socket Publisher"
    technology: "Local Loopback Unix Domain Socket"
    description: "Delivers configuration securely to Core Application Containers without plain-text environment variables."
  - type: "component"
    name: "KMS Encryption Manager"
    technology: "GCP Cloud KMS API"
    description: "Interfaces with GCP Cloud KMS for ciphertext encryption and decryption of locally cached files."
  - type: "component"
    name: "Telemetry Exporter"
    technology: "Prometheus / OpenTelemetry"
    description: "Emits sync status, cache rates, and decryption health metrics to Observability Exporter Sidecars."
relationships:
  - source: "GCP Secret Manager Client"
    destination: "Unix Domain Socket Publisher"
    description: "Forwards retrieved configuration"
  - source: "GCP Secret Manager Client"
    destination: "KMS Encryption Manager"
    description: "Requests decryption of cached secrets"
  - source: "Unix Domain Socket Publisher"
    destination: "Stateless Core Application Containers"
    description: "Transmits configurations securely"
  - source: "Telemetry Exporter"
    destination: "Observability & Telemetry Exporter Sidecars"
    description: "Emits Prometheus metrics for sync status tracking"