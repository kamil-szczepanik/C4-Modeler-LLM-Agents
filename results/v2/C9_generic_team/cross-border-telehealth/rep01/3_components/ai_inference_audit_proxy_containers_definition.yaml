level: component
scope: "Component diagram for the AI Inference & Audit Proxy Containers container"
parentContainer:
  name: "AI Inference & Audit Proxy Containers"
elements:
  - type: "component"
    name: "gRPC Request Router"
    technology: "Python / gRPC"
    description: "Routes incoming gRPC and REST requests from the API Gateway to internal handlers."
  - type: "component"
    name: "AI Symptom Checker Client"
    technology: "Python / gRPC / Protocol Buffers"
    description: "Communicates with the AI Symptom Checker Service using strict schema validation."
  - type: "component"
    name: "Audit Logging Buffer"
    technology: "Python / Local Queue"
    description: "Asynchronously flushes local audit logs to the Regional Audit and Compliance Logging Subsystem."
relationships:
  - source: "gRPC Request Router"
    destination: "AI Symptom Checker Client"
    description: "Invokes symptom analysis [gRPC / REST]"
  - source: "gRPC Request Router"
    destination: "Audit Logging Buffer"
    description: "Queues audit events [Asynchronous / Local Queue Flush]"