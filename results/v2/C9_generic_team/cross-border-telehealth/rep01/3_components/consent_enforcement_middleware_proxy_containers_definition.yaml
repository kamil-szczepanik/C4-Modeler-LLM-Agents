# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Consent Enforcement Middleware/Proxy Containers container"
parentContainer:
  name: "Consent Enforcement Middleware/Proxy Containers"
elements:
  - type: "component"
    name: "Envoy Ingress Router"
    technology: "Envoy Proxy"
    description: "Handles incoming ingress traffic routing and inspects W3C Trace Context headers (traceparent)."
  - type: "component"
    name: "ExtAuthz Filter"
    technology: "Envoy ExtAuthz Filter"
    description: "Enforces strict default-deny privacy controls and intercepts requests to validate JWT tokens and enforce consent."
  - type: "component"
    name: "Metadata Enrichment Agent"
    technology: "Custom Middleware"
    description: "Enriches requests with metadata headers like X-Consent-Purpose and X-Data-Residency-Region before forwarding."
relationships:
  - source: "Envoy Ingress Router"
    destination: "ExtAuthz Filter"
    description: "Routes incoming client requests for authorization [HTTPS / gRPC]"
  - source: "ExtAuthz Filter"
    destination: "Metadata Enrichment Agent"
    description: "Passes validated and authorized requests for header enrichment"