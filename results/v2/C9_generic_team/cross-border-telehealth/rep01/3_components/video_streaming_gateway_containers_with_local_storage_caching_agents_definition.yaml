level: component
scope: "Component diagram for the Video Streaming Gateway Containers with Local Storage/Caching Agents container"
parentContainer:
  name: "Video Streaming Gateway Containers with Local Storage/Caching Agents"
elements:
  - type: "component"
    name: "WebRTC Streaming Router"
    technology: "WebRTC & TURN/STUN"
    description: "Manages real-time video consultation streams and handles unstable network conditions down to 300 kbit/s."
  - type: "component"
    name: "Store-and-Forward Cache Agent"
    technology: "GCP Persistent Disk Encryption"
