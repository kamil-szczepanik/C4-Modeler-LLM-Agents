level: component
scope: "Component diagram for the Stateless Core Application Containers container"
parentContainer:
  name: "Stateless Core Application Containers"
elements:
  - type: "component"
    name: "Patient and Clinician Interface Controller"
    technology: "Containerized Microservices on GCP / REST"
    description: "Handles incoming requests from patients and clinicians for secure video consultations and e-prescriptions."
  - type: "component"
    name: "Consultation and Prescription Service"
    technology: "Containerized Microservices on GCP / gRPC"
    description: "Core business logic service managing video consultation orchestration and e-prescription workflows."
  - type: "component"
    name: "AI Symptom Checker Orchestrator"
    technology: "Containerized Microservices on GCP / Python / gRPC"
    description: "Coordinates symptom checking logic and interfaces with the AI inference proxy."
relationships:
  - source: "Patient and Clinician Interface Controller"
    destination: "Consultation and Prescription Service"
    description: "Routes consultation and prescription requests"
  - source: "Consultation and Prescription Service"
    destination: "AI Symptom Checker Orchestrator"
    description: "Delegates symptom analysis requests"