level: component
scope: "Component diagram for the Observability & Telemetry Exporter Sidecars with PII/PHI Stripping container"
parentContainer:
  name: "Observability & Telemetry Exporter Sidecars with PII/PHI Stripping"
elements:
  - type: "component"
    name: "Telemetry Collector Agent"
    technology: "OpenTelemetry (OTel) Collector framework"
    description: "Collects logs, traces, and metrics from application and proxy containers."
  - type: "component"
    name: "PII/PHI Stripping Filter"
    technology: "Custom Exporter / Sanitization Module"
    description: "Inspects telemetry payloads to strip personally identifiable information (PII) and protected health information (PHI)."
  - type: "component"
    name: "Local File Buffer"
    technology: "Local Storage / File Buffer"
    description: "Temporarily buffers sanitized telemetry data locally during unstable network conditions."
relationships:
  - source: "Telemetry Collector Agent"
    destination: "PII/PHI Stripping Filter"
    description: "Passes raw telemetry for sanitization"
  - source: "PII/PHI Stripping Filter"
    destination: "Local File Buffer"
    description: "Buffers sanitized telemetry locally"
  - source: "Local File Buffer"
    destination: "Regional OpenTelemetry backends in europe-west3 and us-central1"
    description: "Exports sanitized logs and metrics"