level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides secure video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US while enforcing strict regional data isolation to comply with GDPR and HIPAA mandates."
elements:
  - type: "person"
    name: "Patients and Clinicians"
    description: "Client applications users who participate in video consultations, use the AI symptom checker, and manage e-prescriptions."
  - type: "externalSystem"
    name: "Global Traffic Director / API Gateway"
    description: "Routes global client traffic to the appropriate regional stack."
  - type: "externalSystem"
    name: "AI Symptom Checker Service"
    description: "Provides automated symptom checking capabilities for patients."
  - type: "externalSystem"
    name: "Regional Audit and Compliance Logging Subsystem"
    description: "Handles regional audit and compliance logging to meet GDPR and HIPAA requirements."
  - type: "externalSystem"
    name: "External Identity and Consent Provider"
    description: "Manages user identity and consent verification."
  - type: "externalSystem"
    name: "National E-Prescription Gateways and Pharmacy Networks"
    description: "External networks for processing e-prescriptions via national and HL7 FHIR standards."
  - type: "externalSystem"
    name: "External Notification and Messaging Service"
    description: "Sends external notifications and messages to users."
  - type: "externalSystem"
    name: "External Payment Gateways and Billing Systems"
    description: "Processes financial transactions and billing."
relationships:
  - source: "Patients and Clinicians"
    destination: "Global Traffic Director / API Gateway"
    description: "Interact with the Global Traffic Director"
    technology: "HTTPS and WebSockets"
  - source: "Global Traffic Director / API Gateway"
    destination: "Cross-Border Telehealth Platform"
    description: "Routes regional traffic to regional stacks"
    technology: "mTLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "National E-Prescription Gateways and Pharmacy Networks"
    description: "Communicate with prescription gateways"
    technology: "HL7 FHIR (US) and national standards (EU)"
  - source: "Cross-Border Telehealth Platform"
    destination: "External Identity and Consent Provider"
    description: "Integrate for identity and consent"
    technology: "OpenID Connect (OIDC)"
  - source: "Cross-Border Telehealth Platform"
    destination: "External Payment Gateways and Billing Systems"
    description: "Process payments and billing"
    technology: "REST APIs over HTTPS"