level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients and Clinicians"
    description: "Client applications users who participate in video consultations, use the AI symptom checker, and manage e-prescriptions."
  - type: "externalSystem"
    name: "Global Traffic Director / API Gateway"
    description: "Routes global client traffic to the appropriate regional stack."
  - type: "externalSystem"
    name: "AI Symptom Checker Service"
    description: "Provides automated symptom checking capabilities for patients."
  - type: "externalSystem"
    name: "Regional Audit and Compliance Logging Subsystem"
    description: "Handles regional audit and compliance logging to meet GDPR and HIPAA requirements."
  - type: "externalSystem"
    name: "External Identity and Consent Provider"
    description: "Manages user identity and consent verification."
  - type: "externalSystem"
    name: "National E-Prescription Gateways and Pharmacy Networks"
    description: "External networks for processing e-prescriptions via national and HL7 FHIR standards."
  - type: "externalSystem"
    name: "External Notification and Messaging Service"
    description: "Sends external notifications and messages to users."
  - type: "externalSystem"
    name: "External Payment Gateways and Billing Systems"
    description: "Processes financial transactions and billing."
  - type: "container"
    name: "API Gateway / Ingress Controller Containers"
    description: "Manages inbound traffic for regional deployments."
    technology: "Google Cloud Platform Ingress / Envoy"
  - type: "container"
    name: "Consent Enforcement Middleware/Proxy Containers"
    description: "Enforces explicit consent for data processing and routing."
    technology: "Custom Middleware / Envoy Proxy"
  - type: "container"
    name: "Stateless Core Application Containers"
    description: "Handles core business logic, routing traffic through consent middleware."
    technology: "Containerized Microservices (GCP)"
  - type: "container"
    name: "Video Streaming Gateway Containers with Local Storage/Caching Agents"
    description: "Manages WebRTC video consultations with adaptive bitrate streaming and local caching for unstable rural connections."
    technology: "WebRTC, TURN/STUN, Local Storage Agents"
  - type: "container"
    name: "AI Inference & Audit Proxy Containers"
    description: "Synchronously logs inputs, model versions, and outputs before returning urgency recommendations."
    technology: "Python / gRPC"
  - type: "container"
    name: "FHIR Translation Adapter Container (US) and National E-Prescription Adapter Container (EU)"
    description: "Translates and adapts prescriptions for US (HL7 FHIR) and EU (national standards) external systems."
    technology: "REST / HL7 FHIR / National APIs"
  - type: "container"
    name: "Local Async Event Bus / Queue Containers"
    description: "Buffers telemetry and events locally during network drops and syncs upon reconnection."
    technology: "MQTT / Local Message Broker"
  - type: "container"
    name: "Configuration and Secrets Management Sidecars"
    description: "Manages configuration and secrets for regional containers."
    technology: "GCP Secret Manager Sidecar"
  - type: "container"
    name: "Observability & Telemetry Exporter Sidecars with PII/PHI Stripping"
    description: "Collects telemetry and strips PII/PHI before exporting."
    technology: "OpenTelemetry / Custom Exporter"
relationships:
  - source: "Patients and Clinicians"
    destination: "API Gateway / Ingress Controller Containers"
    description: "Connect to Regional API Gateways via HTTPS and WebRTC"
    technology: "HTTPS and WebRTC (TURN/STUN)"
  - source: "Global Traffic Director / API Gateway"
    destination: "API Gateway / Ingress Controller Containers"
    description: "Routes regional traffic to regional stacks"
    technology: "mTLS"
  - source: "Stateless Core Application Containers"
    destination: "Consent Enforcement Middleware/Proxy Containers"
    description: "Route traffic through consent enforcement"
    technology: "gRPC/REST"
  - source: "Video Streaming Gateway Containers with Local Storage/Caching Agents"
    destination: "Patients and Clinicians"
    description: "Utilizes adaptive bitrate streaming for unstable connections"
    technology: "WebRTC"
  - source: "FHIR Translation Adapter Container (US) and National E-Prescription Adapter Container (EU)"
    destination: "National E-Prescription Gateways and Pharmacy Networks"
    description: "Connects US Core to external pharmacies via HL7 FHIR and EU Core via national standards"
    technology: "HL7 FHIR (US) and national standards (EU)"
  - source: "AI Inference & Audit Proxy Containers"
    destination: "AI Symptom Checker Service"
    description: "Sends requests for AI inference and urgency recommendations"
    technology: "gRPC/REST"
  - source: "Local Async Event Bus / Queue Containers"
    destination: "Regional Audit and Compliance Logging Subsystem"
    description: "Syncs buffered telemetry to Regional Audit Subsystems upon reconnection"
    technology: "MQTT / HTTPS"
  - source: "Stateless Core Application Containers"
    destination: "External Identity and Consent Provider"
    description: "Integrate for identity and consent"
    technology: "OpenID Connect (OIDC)"
  - source: "Stateless Core Application Containers"
    destination: "External Payment Gateways and Billing Systems"
    description: "Process payments and billing"
    technology: "REST APIs over HTTPS"