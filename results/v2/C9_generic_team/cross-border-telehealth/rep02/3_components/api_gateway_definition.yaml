level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "HTTPS/WebSocket Handler"
    technology: "HTTPS, WebSockets"
    description: "Handles incoming client connections and traffic termination for end users."
  - type: "component"
    name: "Routing & Security Proxy"
    technology: "Reverse Proxy, TLS, Redis"
    description: "Performs distributed rate limiting, circuit breaking, idempotency enforcement, and routes regional traffic."
relationships:
  - source: "HTTPS/WebSocket Handler"
    destination: "Routing & Security Proxy"
    description: "Passes authenticated requests"