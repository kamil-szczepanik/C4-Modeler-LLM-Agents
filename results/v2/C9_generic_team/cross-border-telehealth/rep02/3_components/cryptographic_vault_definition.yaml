level: component
scope: "Component diagram for the Cryptographic Vault container"
parentContainer:
  name: "Cryptographic Vault"
elements:
  - type: "component"
    name: "Key Management Interface"
    technology: "Provider-Agnostic Key Management Interface (Wrapper Pattern)"
    description: "Interfaces with GCP Cloud KMS and HSM using a wrapper pattern for provider-agnostic key management."
  - type: "component"
    name: "Envelope Encryption Service"
    technology: "Python / Cryptographic Libraries"
    description: "Handles requests for Data Encryption Keys (DEKs) using envelope encryption principles."
  - type: "component"
    name: "Vault gRPC Handler"
    technology: "gRPC with Protocol Buffers"
    description: "Provides low-latency, type-safe API communication for calling microservices interacting with the vault."
relationships:
  - source: "Vault gRPC Handler"
    destination: "Key Management Interface"
    description: "Uses to interact with hardware-backed key isolation"
  - source: "Vault gRPC Handler"
    destination: "Envelope Encryption Service"
    description: "Requests Data Encryption Keys (DEKs)"
  - source: "Key Management Interface"
    destination: "Cryptographic Vault Container (GCP Cloud KMS / HSM)"
    description: "Interacts with hardware security modules"