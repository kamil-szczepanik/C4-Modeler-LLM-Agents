level: component
scope: "Component diagram for the Asynchronous Task Worker container"
parentContainer:
  name: "Asynchronous Task Worker"
elements:
  - type: "component"
    name: "Region-Isolated Task Queues"
    technology: "Redis / Regional Database Constraints"
    description: "Queues tasks locally within GCP regions to maintain data residency and handle rural network retry resilience using idempotency keys."
  - type: "component"
    name: "Regional Databases"
    technology: "GCP Cloud Infrastructure (europe-west3, us-central1)"
    description: "Stores transient data locally, enforcing strict regional data residency compliance for EU and US health data."
  - type: "component"
    name: "Cryptographic Vault"
    technology: "GCP Cloud Infrastructure / TLS"
    description: "Secures and encrypts sensitive health data and credentials."
  - type: "component"
    name: "Dead-Letter Queue (DLQ)"
    technology: "Redis / Protocol Buffers"
    description: "Captures and routes failed tasks using exponential backoff."
  - type: "component"
    name: "External Regional E-Prescription Gateways and AI Model Registry"
    technology: "REST / HL7 FHIR with Circuit Breakers"
    description: "External gateways for e-prescriptions and AI model integrations."
relationships:
  - source: "Asynchronous Task Worker"
    destination: "Region-Isolated Task Queues"
    description: "Processes jobs from Region-Isolated Task Queues via Background Worker Framework"
  - source: "Asynchronous Task Worker"
    destination: "Regional Databases"
    description: "Reads/writes transient data to Regional Databases using TLS"
  - source: "Asynchronous Task Worker"
    destination: "Cryptographic Vault"
    description: "Reads/writes cryptographic keys and data using TLS"
  - source: "Asynchronous Task Worker"
    destination: "External Regional E-Prescription Gateways and AI Model Registry"
    description: "Integrates via REST/HL7 FHIR with Circuit Breakers"
  - source: "Asynchronous Task Worker"
    destination: "Dead-Letter Queue (DLQ)"
    description: "Routes failed tasks to Dead-Letter Queue (DLQ) with Exponential Backoff"