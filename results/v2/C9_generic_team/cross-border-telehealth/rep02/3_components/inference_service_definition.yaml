level: component
scope: "Component diagram for the Inference Service container"
parentContainer:
  name: "Inference Service"
elements:
  - type: "component"
    name: "Inference Service"
    technology: "Python, gRPC, Protocol Buffers"
    description: "Executes the AI symptom checker, ensuring strong typing and high-performance serialization."
  - type: "component"
    name: "AI Model Registry"
    technology: "External Storage"
    description: "Stores versioned, cryptographically verified model artifacts."
  - type: "component"
    name: "Middleware Audit Interceptor"
    technology: "Middleware"
    description: "Captures inputs, model versions, and outputs for R-07 compliance."
  - type: "component"
    name: "Local Ephemeral Buffer / DLQ"
    technology: "Local Ephemeral Storage"
    description: "Provides local caching and DLQ fallback for audit payloads during telemetry outages."
  - type: "component"
    name: "API Gateway / Workers"
    technology: "API Gateway / Workers"
    description: "Invokes symptom checks and streams telemetry."
  - type: "component"
    name: "Telemetry/Audit Collector"
    technology: "Collector Service"
    description: "Receives immutable audit logs and traces."
relationships:
  - source: "Inference Service"
    destination: "AI Model Registry"
    description: "Fetches versioned model artifacts [gRPC]."
  - source: "API Gateway / Workers"
    destination: "Inference Service"
    description: "Invokes symptom checks and streams telemetry [gRPC, TLS]."
  - source: "Inference Service"
    destination: "Telemetry/Audit Collector"
    description: "Dispatches immutable audit logs and traces [gRPC/HTTPS]."