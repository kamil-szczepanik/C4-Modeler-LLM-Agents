level: component
scope: "Component diagram for the Data Localization Router container"
parentContainer:
  name: "Data Localization Router"
elements:
  - type: "component"
    name: "Geo-DNS Router"
    technology: "Geo-DNS and TLS SNI Parsing"
    description: "Routes incoming patient and clinician requests to the appropriate regional infrastructure based on geographic origin."
  - type: "component"
    name: "Stateless Interceptor Middleware"
    technology: "Stateless Middleware"
    description: "Intercepts requests at the edge to enforce fail-closed security and data residency policies."
  - type: "component"
    name: "Data Residency Enforcer"
    technology: "Policy Routing Engine"
    description: "Ensures data persistence is strictly directed to GCP-managed regional databases ineurope-west3 and us-central1."
relationships:
  - source: "Geo-DNS Router"
    destination: "Stateless Interceptor Middleware"
    description: "Passes parsed requests for security and policy inspection"
  - source: "Stateless Interceptor Middleware"
    destination: "Data Residency Enforcer"
    description: "Enforces routing rules to regional databases and external services"