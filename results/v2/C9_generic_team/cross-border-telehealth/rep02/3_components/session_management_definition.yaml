level: component
scope: "Component diagram for the Session Management container"
parentContainer:
  name: "Session Management"
elements:
  - type: "component"
    name: "Session Management Component"
    technology: "GCP Regional Services"
    description: "Governs secure, region-isolated user consultations across GCP boundaries and maintains fault-tolerant session lifecycles using Stateless JWTs, Explicit State Pattern, and Bulkhead Pattern."
  - type: "component"
    name: "Regional Distributed Cache"
    technology: "Redis"
    description: "Enables instant session revocation and consent-driven logouts."
  - type: "component"
    name: "Cloud KMS"
    technology: "Hardware Security Module"
    description: "Enforces strict cryptographic data residency separation between EU and US regions using region-bound signing keys."
  - type: "component"
    name: "Telemetry & Audit Collector"
    technology: "gRPC"
    description: "Collects telemetry and audit logs."
  - type: "component"
    name: "API Gateway"
    technology: "HTTPS, WebSockets"
    description: "Entry point for client traffic."
relationships:
  - source: "API Gateway"
    destination: "Session Management Component"
    description: "HTTPS, WebSockets"
  - source: "Session Management Component"
    destination: "Regional Distributed Cache"
    description: "TCP"
  - source: "Session Management Component"
    destination: "Cloud KMS"
    description: "gRPC"
  - source: "Session Management Component"
    destination: "Telemetry & Audit Collector"
    description: "gRPC"