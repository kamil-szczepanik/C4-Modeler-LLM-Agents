level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients in the EU and US seeking video consultations, e-prescriptions, and AI symptom checks."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals providing remote consultations and issuing e-prescriptions."
  - type: "externalSystem"
    name: "EU/US Pharmacies"
    description: "External systems for processing and fulfilling electronic prescriptions."
  - type: "externalSystem"
    name: "AI Model Registry"
    description: "External system providing version-tracked recommendations for the AI symptom checker."
  - type: "externalSystem"
    name: "External IdP"
    description: "External system managing authentication and identity federation."
  - type: "externalSystem"
    name: "Payment Gateways"
    description: "External system providing billing and payment processing."
  - type: "container"
    name: "Offline Sync/Queue Container"
    description: "Client-side container handling offline synchronization and queues for unstable rural connections."
    technology: "Local Storage, Custom Queue Manager"
  - type: "container"
    name: "API Gateway"
    description: "Entry point for clients routing requests to regional core containers."
    technology: "HTTPS, WebSockets"
  - type: "container"
    name: "Data Localization Router"
    description: "Routes data to regional clusters ensuring strict regional data residency."
    technology: "GCP Cloud Infrastructure"
  - type: "container"
    name: "Session Management"
    description: "Manages active user consultation sessions."
    technology: "GCP Regional Services"
  - type: "container"
    name: "Anti-Corruption Layer (ACL)"
    description: "Translates external protocols and standards like HL7 FHIR and national e-prescription formats."
    technology: "REST, HL7 FHIR, National Standards"
  - type: "container"
    name: "Inference Service"
    description: "MDR-compliant AI symptom checker providing isolated inference and immutable audit logging."
    technology: "Python, gRPC"
  - type: "container"
    name: "Asynchronous Task Worker"
    description: "Handles background and deferred tasks for resilience in unstable environments."
    technology: "Background Worker Framework"
  - type: "container"
    name: "Cryptographic Vault"
    description: "Stores and manages encryption keys to guarantee GDPR and HIPAA compliance."
    technology: "Cloud KMS / Hardware Security Module"
  - type: "container"
    name: "Regional Databases"
    description: "Isolated regional data persistence layers in europe-west3 and us-central1."
    technology: "TLS, GCP Managed Database"
relationships:
  - source: "Patients"
    destination: "API Gateway"
    description: "Accesses video consultations and data"
    technology: "HTTPS/WebSockets"
  - source: "Licensed Clinicians"
    destination: "API Gateway"
    description: "Accesses video consultations and data"
    technology: "HTTPS/WebSockets"
  - source: "Inference Service"
    destination: "AI Model Registry"
    description: "Fetches model versioning"
    technology: "gRPC"
  - source: "Anti-Corruption Layer (ACL)"
    destination: "EU/US Pharmacies"
    description: "Sends e-prescriptions and health data"
    technology: "REST/HL7 FHIR"
  - source: "Anti-Corruption Layer (ACL)"
    destination: "Payment Gateways"
    description: "Processes transactions"
    technology: "REST"
  - source: "Data Localization Router"
    destination: "Regional Databases"
    description: "Persists localized data securely"
    technology: "TLS"