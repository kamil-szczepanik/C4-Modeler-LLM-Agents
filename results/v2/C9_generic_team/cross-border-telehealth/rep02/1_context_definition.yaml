level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "A cross-border telehealth platform providing video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US, enforcing strict regional data residency while ensuring compliance with GDPR, HIPAA, and EU MDR."
elements:
  - type: "person"
    name: "Patients"
    description: "Patients in the EU and US seeking video consultations, e-prescriptions, and AI symptom checks."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals providing remote consultations and issuing e-prescriptions."
  - type: "externalSystem"
    name: "Edge / Adaptive Media Relay"
    description: "External system handling real-time video streaming and adaptive media relay."
  - type: "externalSystem"
    name: "EU/US Pharmacies & National E-Prescription Gateways"
    description: "External systems for processing and fulfilling electronic prescriptions."
  - type: "externalSystem"
    name: "AI Model Registry"
    description: "External system providing version-tracked recommendations for the AI symptom checker."
  - type: "externalSystem"
    name: "Consent & Identity Provider Boundary / External IdP & Federation Service"
    description: "External system managing localized token issuance and consent."
  - type: "externalSystem"
    name: "External Notification & Messaging Gateway"
    description: "External system handling asynchronous alerts via SMTP, SMPP, and APNS."
  - type: "externalSystem"
    name: "Telemetry/Audit Collector & Global Clock / NTP"
    description: "External system for collecting immutable audit logs and time synchronization."
  - type: "externalSystem"
    name: "External Payment and Billing Gateways"
    description: "External system providing PCI-DSS compliant billing and payment processing."
relationships:
  - source: "Patients"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS (REST/GraphQL) and WebRTC"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Conducts consultations and manages patient care"
    technology: "HTTPS (REST/GraphQL) and WebRTC"
  - source: "Cross-Border Telehealth Platform"
    destination: "Edge / Adaptive Media Relay"
    description: "Streams throttled video consultations"
    technology: "WebRTC/RTP"
  - source: "Cross-Border Telehealth Platform"
    destination: "EU/US Pharmacies & National E-Prescription Gateways"
    description: "Sends e-prescriptions"
    technology: "HL7 FHIR (US) and national e-prescription standards (EU)"
  - source: "Cross-Border Telehealth Platform"
    destination: "AI Model Registry"
    description: "Fetches version-tracked AI recommendations"
    technology: "gRPC"
  - source: "Cross-Border Telehealth Platform"
    destination: "Consent & Identity Provider Boundary / External IdP & Federation Service"
    description: "Authenticates users and manages consent"
    technology: "OAuth2/OIDC"
  - source: "Cross-Border Telehealth Platform"
    destination: "External Notification & Messaging Gateway"
    description: "Sends asynchronous alerts"
    technology: "SMTP/SMPP/APNS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Telemetry/Audit Collector & Global Clock / NTP"
    description: "Sends immutable audit logs"
    technology: "TLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "External Payment and Billing Gateways"
    description: "Processes billing"
    technology: "REST/HTTPS"