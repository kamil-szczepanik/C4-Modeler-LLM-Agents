level: component
scope: "Component diagram for the WebRTC SFU Video Streaming Containers container"
parentContainer:
  name: "WebRTC SFU Video Streaming Containers"
elements:
  - type: "component"
    name: "SFU Media Forwarder"
    technology: "WebRTC SFU"
    description: "Powers selective forwarding unit video streaming for low-latency multi-party consultations."
  - type: "component"
    name: "OpenTelemetry Observability Sidecar Agent"
    technology: "OpenTelemetry"
    description: "Captures real-time container metrics, packet loss, jitter, and bitrate metrics for automated scaling and health checks."
  - type: "component"
    name: "Session Token Handler"
    technology: "Redis / GCP Secret Manager"
    description: "Manages low-latency distributed caching for stateless SFU session tokenization, resumption, and secret injection."
relationships:
  - source: "SFU Media Forwarder"
    destination: "Session Token Handler"
    description: "Stores and retrieves stateless session handover tokens [TCP]"
  - source: "OpenTelemetry Observability Sidecar Agent"
    destination: "SFU Media Forwarder"
    description: "Captures real-time packet loss, jitter, and bitrate metrics"