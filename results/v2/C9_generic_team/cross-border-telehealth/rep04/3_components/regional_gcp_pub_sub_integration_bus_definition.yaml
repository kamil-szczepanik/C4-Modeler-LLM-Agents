level: component
scope: "Component diagram for the Regional GCP Pub/Sub Integration Bus container"
parentContainer:
  name: "Regional GCP Pub/Sub Integration Bus"
elements:
  - type: "component"
    name: "Regional Topic Segregator"
    technology: "GCP Pub/Sub Topics"
    description: "Enforces strict regional topic segregation and regional CMEK scoping to satisfy GDPR and HIPAA."
  - type: "component"
    name: "Schema Validation Registry"
    technology: "Protocol Buffers & GCP Schema Validation"
    description: "Enforces strict schema registry and backward-compatible event evolution across message boundaries."
  - type: "component"
    name: "Trace Context Propagation Agent"
    technology: "OpenTelemetry & W3C Traceparent"
    description: "Maintains unbroken distributed tracing across asynchronous message boundaries."
relationships:
  - source: "Regional Topic Segregator"
    destination: "Schema Validation Registry"
    description: "Validates message payloads against schemas"
  - source: "Schema Validation Registry"
    destination: "Trace Context Propagation Agent"
    description: "Injects W3C trace context into validated events"