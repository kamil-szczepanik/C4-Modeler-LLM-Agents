level: component
scope: "Component diagram for the Interoperability Adapter Containers container"
parentContainer:
  name: "Interoperability Adapter Containers"
elements:
  - type: "component"
    name: "Anti-Corruption Layer (ACL) and Circuit Breaker"
    technology: "Java / Spring Boot"
    description: "Isolates internal domain models from external third-party variations and prevents cascading failures."
  - type: "component"
    name: "Pluggable Strategy Engine"
    technology: "Design Pattern / Strategy Interface"
    description: "Modularizes diverse EU national e-prescription standards and US HL7 FHIR requirements."
  - type: "component"
    name: "Transactional Outbox and Idempotency Handler"
    technology: "Database Outbox / Redis Idempotency Keys"
    description: "Guarantees reliable message dispatch without duplicate prescriptions."
  - type: "component"
    name: "Bulkhead Isolation Manager"
    technology: "Resilience4j / Thread Pool Isolation"
    description: "Isolates resource and connection pools per external partner to contain blast radiuses."
relationships:
  - source: "Anti-Corruption Layer (ACL) and Circuit Breaker"
    destination: "Pluggable Strategy Engine"
    description: "Transforms domain models for regional standards"
  - source: "Pluggable Strategy Engine"
    destination: "Bulkhead Isolation Manager"
    description: "Routes external partner requests through isolated pools"
  - source: "Transactional Outbox and Idempotency Handler"
    destination: "Anti-Corruption Layer (ACL) and Circuit Breaker"
    description: "Dispatches reliable messages to ACL"