level: component
scope: "Component diagram for the AI Symptom Checker & Immutable Traceability Logging Service container"
parentContainer:
  name: "AI Symptom Checker & Immutable Traceability Logging Service"
elements:
  - type: "component"
    name: "AI Symptom Checker Engine"
    technology: "Python, OpenTelemetry"
    description: "Performs real-time AI inference and symptom analysis for EU and US patients."
  - type: "component"
    name: "Immutable Traceability Logging Service"
    technology: "Python, SHA-256 Cryptographic Hashing, Write-Ahead Append-Only Logs"
    description: "Ensures tamper-evident EU MDR accountability and traceability logging."
  - type: "component"
    name: "CQRS & Circuit Breaker Manager"
    technology: "Python, Circuit Breaker Pattern"
    description: "Decouples real-time AI inference from logging writes to ensure availability during connection drops."
relationships:
  - source: "AI Symptom Checker Engine"
    destination: "CQRS & Circuit Breaker Manager"
    description: "Routes inference and logging requests"
  - source: "CQRS & Circuit Breaker Manager"
    destination: "Immutable Traceability Logging Service"
    description: "Writes append-only tamper-evident logs"