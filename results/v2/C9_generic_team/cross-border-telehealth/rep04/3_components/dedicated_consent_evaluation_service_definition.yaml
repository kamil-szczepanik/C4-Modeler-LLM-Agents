level: component
scope: "Component diagram for the Dedicated Consent Evaluation Service container"
parentContainer:
  name: "Dedicated Consent Evaluation Service"
elements:
  - type: "component"
    name: "Dedicated Consent Evaluation Service"
    technology: "Open Policy Agent (OPA) / Rego, Protocol Buffers"
    description: "Core policy engine that provides real-time, policy-driven data privacy enforcement and evaluates patient consent."
  - type: "component"
    name: "Region-Isolated API Gateways and Backend Services"
    technology: "Internal REST/gRPC API, W3C Trace Context"
    description: "Clients invoking the consent service for validating patient consent prior to data access."
  - type: "component"
    name: "GCP Pub/Sub"
    technology: "GCP Pub/Sub Protocol"
    description: "Asynchronous messaging bus for cache invalidation events across europe-west3 and us-central1."
  - type: "component"
    name: "Distributed Cache (Redis)"
    technology: "TCP/Redis Protocol"
    description: "In-memory caching layer for low-latency consent evaluations with short TTLs."
relationships:
  - source: "Region-Isolated API Gateways and Backend Services"
    destination: "Dedicated Consent Evaluation Service"
    description: "Validates patient consent [Internal REST/gRPC API, W3C Trace Context]"
  - source: "Dedicated Consent Evaluation Service"
    destination: "GCP Pub/Sub"
    description: "Publishes and consumes cache invalidation events [GCP Pub/Sub Protocol]"
  - source: "Dedicated Consent Evaluation Service"
    destination: "Distributed Cache (Redis)"
    description: "Reads and writes cached consent states [TCP/Redis Protocol]"