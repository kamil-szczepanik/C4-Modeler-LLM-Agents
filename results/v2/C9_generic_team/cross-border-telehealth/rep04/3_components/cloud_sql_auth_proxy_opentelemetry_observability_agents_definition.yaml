level: component
scope: "Component diagram for the Cloud SQL Auth Proxy & OpenTelemetry Observability Agents container"
parentContainer:
  name: "Cloud SQL Auth Proxy & OpenTelemetry Observability Agents"
elements:
  - type: "component"
    name: "Cloud SQL Auth Proxy Sidecar"
    technology: "GCP Cloud SQL Auth Proxy"
    description: "Enforces secure, region-isolated database tunnels with connection pooling for HIPAA and GDPR compliance, connecting securely via mutual TLS."
  - type: "component"
    name: "OpenTelemetry Collector Sidecar"
    technology: "OpenTelemetry"
    description: "Collects distributed traces and metrics with disk-backed file storage buffering to prevent data loss during network partitions."
  - type: "component"
    name: "GCP Secret Manager Integration"
    technology: "GCP Secret Manager"
    description: "Automates secure database credential rotation without application downtime."
  - type: "component"
    name: "Local Buffering Storage Extension"
    technology: "Local disk-backed buffering file storage"
    description: "Provides local disk-backed buffering to ensure asynchronous batch processing and prevent data loss during network partitions."
relationships:
  - source: "Region-Isolated Backend Services"
    destination: "Cloud SQL Auth Proxy Sidecar"
    description: "Connects securely via mutual TLS (mTLS) and configured connection pooling limits."
  - source: "OpenTelemetry Collector Sidecar"
    destination: "Regional Observability Backend"
    description: "Exports sanitized telemetry using asynchronous batch processing and disk-backed buffering."
  - source: "Cloud SQL Auth Proxy Sidecar"
    destination: "GCP Cloud SQL (europe-west3, us-central1)"
    description: "Establishes secure regional database tunnels with exponential backoff retry policies."
  - source: "OpenTelemetry Collector Sidecar"
    destination: "Local Buffering Storage Extension"
    description: "Utilizes disk-backed file storage extensions for buffering telemetry data."
  - source: "Cloud SQL Auth Proxy Sidecar"
    destination: "GCP Secret Manager Integration"
    description: "Retrieves credentials for secure database authentication and rotation."