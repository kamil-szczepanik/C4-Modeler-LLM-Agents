level: component
scope: "Component diagram for the Region-Isolated API Gateways and Backend Services container"
parentContainer:
  name: "Region-Isolated API Gateways and Backend Services"
elements:
  - type: "component"
    name: "Envoy Proxy"
    technology: "Envoy / OpenAPI / Protobuf"
    description: "Edge routing, circuit breaking, rate limiting, and schema validation for incoming HTTPS requests."
  - type: "component"
    name: "Backend Services"
    technology: "gRPC / REST"
    description: "Core business logic processing video consultations, e-prescriptions, and routing requests with schema validation."
  - type: "component"
    name: "Regional Memorystore for Redis"
    technology: "GCP Memorystore (Redis)"
    description: "Low-latency, region-isolated storage tracking idempotency keys and rate limits via internal TCP."
  - type: "component"
    name: "Cloud SQL Auth Proxy"
    technology: "Cloud SQL Auth Proxy"
    description: "Securely connects backend services to regional databases via TCP."
  - type: "component"
    name: "GCP Pub/Sub Integration Bus"
    technology: "GCP Pub/Sub"
    description: "Publishes and distributes platform events across regional services."
  - type: "component"
    name: "OpenTelemetry Observability Agents"
    technology: "OpenTelemetry"
    description: "Handles distributed tracing and compliance logging."
relationships:
  - source: "Patients and Licensed Clinicians"
    destination: "Envoy Proxy"
    description: "Interacts via HTTPS"
  - source: "Envoy Proxy"
    destination: "Backend Services"
    description: "Routes requests via gRPC/REST with schema validation"
  - source: "Backend Services"
    destination: "Regional Memorystore for Redis"
    description: "Tracks idempotency keys and rate limits via internal TCP"
  - source: "Backend Services"
    destination: "Cloud SQL Auth Proxy"
    description: "Connects to regional databases via TCP"
  - source: "Backend Services"
    destination: "GCP Pub/Sub Integration Bus"
    description: "Publishes events via GCP Pub/Sub"