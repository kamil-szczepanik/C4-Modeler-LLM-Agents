level: context
scope: "System Context diagram for Multi-Region Cross-Border Telehealth Platform"
system:
  name: "Multi-Region Cross-Border Telehealth Platform"
  description: "A multi-region cross-border telehealth platform deployed on GCP providing video consultations, e-prescriptions, and an AI symptom checker for EU and US patients while enforcing strict regional data residency and high availability for rural connections."
elements:
  - type: "person"
    name: "Patients (EU and US)"
    description: "Patients located in the EU and US seeking video consultations, e-prescriptions, and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals providing video consultations and care to patients."
  - type: "externalSystem"
    name: "Third-Party Pharmacies"
    description: "External pharmacy systems for fulfilling prescriptions."
  - type: "externalSystem"
    name: "National E-Prescription Endpoints"
    description: "External national endpoints for e-prescription integration in the EU and US."
relationships:
  - source: "Patients (EU and US)"
    destination: "Multi-Region Cross-Border Telehealth Platform"
    description: "Interacts for video consultations, e-prescriptions, and AI symptom checking"
    technology: "HTTPS, WebRTC"
  - source: "Licensed Clinicians"
    destination: "Multi-Region Cross-Border Telehealth Platform"
    description: "Interacts to conduct video consultations and manage patient care"
    technology: "HTTPS, WebRTC"
  - source: "Multi-Region Cross-Border Telehealth Platform"
    destination: "Third-Party Pharmacies"
    description: "Sends prescription and fulfillment details"
    technology: "HL7 FHIR / National Protocols"
  - source: "Multi-Region Cross-Border Telehealth Platform"
    destination: "National E-Prescription Endpoints"
    description: "Integrates with national e-prescription systems via Anti-Corruption Layers"
    technology: "HL7 FHIR, National Protocols"