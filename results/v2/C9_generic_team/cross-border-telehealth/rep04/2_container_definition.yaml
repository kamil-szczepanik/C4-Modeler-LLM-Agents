level: container
scope: "Container diagram for Multi-Region Cross-Border Telehealth Platform"
system:
  name: "Multi-Region Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU and US)"
    description: "Patients located in the EU and US seeking video consultations, e-prescriptions, and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals providing video consultations and care to patients."
  - type: "externalSystem"
    name: "Third-Party Pharmacies"
    description: "External pharmacy systems for fulfilling prescriptions."
  - type: "externalSystem"
    name: "National E-Prescription Endpoints"
    description: "External national endpoints for e-prescription integration in the EU and US."
  - type: "container"
    name: "Region-Isolated API Gateways and Backend Services"
    technology: "GCP, Envoy Proxy, REST/gRPC"
    description: "Handles region-isolated routing, rate limiting, circuit breaking, and backend business logic for europe-west3 and us-central1."
  - type: "container"
    name: "WebRTC SFU Video Streaming Containers"
    technology: "WebRTC SFU, Adaptive Bitrate Streaming"
    description: "Enables resilient, low-latency adaptive bitrate video streaming for unstable connections."
  - type: "container"
    name: "AI Symptom Checker & Immutable Traceability Logging Service"
    technology: "Python, OpenTelemetry"
    description: "Provides AI-driven symptom checking and immutable audit logs for EU MDR traceability and telemetry."
  - type: "container"
    name: "Interoperability Adapter Containers"
    technology: "HL7 FHIR, EU e-prescription standards"
    description: "Adapters integrating core systems with third-party pharmacies and national endpoints using HL7 FHIR and EU standards."
  - type: "container"
    name: "Regional GCP Pub/Sub Integration Bus"
    technology: "GCP Pub/Sub"
    description: "Asynchronous messaging bus for decoupled third-party integrations and event distribution."
  - type: "container"
    name: "Dedicated Consent Evaluation Service"
    technology: "Microservice, Policy Engine"
    description: "Evaluates and enforces data privacy consent for EU and US patients."
  - type: "container"
    name: "Cloud SQL Auth Proxy & OpenTelemetry Observability Agents"
    technology: "GCP Cloud SQL Auth Proxy, OpenTelemetry"
    description: "Manages secure database connections and collects distributed tracing and metrics."
relationships:
  - source: "Patients (EU and US)"
    destination: "Region-Isolated API Gateways and Backend Services"
    description: "Interacts for API calls and video consultation access"
    technology: "HTTPS"
  - source: "Patients (EU and US)"
    destination: "WebRTC SFU Video Streaming Containers"
    description: "Streams video consultations"
    technology: "WebRTC"
  - source: "Licensed Clinicians"
    destination: "Region-Isolated API Gateways and Backend Services"
    description: "Interacts for clinical workflows and management"
    technology: "HTTPS"
  - source: "Licensed Clinicians"
    destination: "WebRTC SFU Video Streaming Containers"
    description: "Streams video consultations"
    technology: "WebRTC"
  - source: "Region-Isolated API Gateways and Backend Services"
    destination: "AI Symptom Checker & Immutable Traceability Logging Service"
    description: "Sends requests for symptom checking and logs audit events"
    technology: "gRPC/Internal API"
  - source: "Region-Isolated API Gateways and Backend Services"
    destination: "Dedicated Consent Evaluation Service"
    description: "Validates patient consent"
    technology: "Internal API"
  - source: "Region-Isolated API Gateways and Backend Services"
    destination: "Regional GCP Pub/Sub Integration Bus"
    description: "Publishes e-prescription events"
    technology: "GCP Pub/Sub"
  - source: "Regional GCP Pub/Sub Integration Bus"
    destination: "Interoperability Adapter Containers"
    description: "Triggers adapter processing for prescription dispatch"
    technology: "GCP Pub/Sub"
  - source: "Interoperability Adapter Containers"
    destination: "Third-Party Pharmacies"
    description: "Sends prescription and fulfillment details"
    technology: "HL7 FHIR / National Protocols"
  - source: "Interoperability Adapter Containers"
    destination: "National E-Prescription Endpoints"
    description: "Integrates with national e-prescription systems"
    technology: "HL7 FHIR, EU Standards"
  - source: "Region-Isolated API Gateways and Backend Services"
    destination: "Cloud SQL Auth Proxy & OpenTelemetry Observability Agents"
    description: "Connects to regional database and exports telemetry"
    technology: "Cloud SQL Auth Proxy, OpenTelemetry"