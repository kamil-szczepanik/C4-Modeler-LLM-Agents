level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Cross-Border Telehealth Platform providing video consultations, e-prescriptions, and an AI symptom checker for EU and US patients with strict regional data residency and compliance via isolated GCP deployments."
elements:
  - type: "person"
    name: "Patients and Licensed Clinicians"
    description: "End-users utilizing video consultations, e-prescriptions, and the AI symptom checker across EU and US regions."
  - type: "externalSystem"
    name: "US HL7 FHIR Providers"
    description: "External US-based healthcare systems using HL7 FHIR protocols."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways"
    description: "External EU-based national gateways for managing e-prescriptions."
  - type: "externalSystem"
    name: "Regional Pharmacy Networks"
    description: "External regional pharmacy networks for fulfilling prescriptions."
relationships:
  - source: "Patients and Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS/WebRTC (Adaptive streaming)"
  - source: "Cross-Border Telehealth Platform"
    destination: "US HL7 FHIR Providers"
    description: "Interoperability and data exchange for US patients"
    technology: "REST/FHIR"
  - source: "Cross-Border Telehealth Platform"
    destination: "EU National E-Prescription Gateways"
    description: "Interoperability and e-prescription routing for EU patients"
    technology: "National Protocols"
  - source: "Cross-Border Telehealth Platform"
    destination: "Regional Pharmacy Networks"
    description: "Prescription fulfillment and coordination"
    technology: "REST/HTTPS"