level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients and Licensed Clinicians"
    description: "End-users utilizing video consultations, e-prescriptions, and the AI symptom checker across EU and US regions."
  - type: "externalSystem"
    name: "US HL7 FHIR Providers"
    description: "External US-based healthcare systems using HL7 FHIR protocols."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways"
    description: "External EU-based national gateways for managing e-prescriptions."
  - type: "externalSystem"
    name: "Regional Pharmacy Networks"
    description: "External regional pharmacy networks for fulfilling prescriptions."
  - type: "container"
    name: "API Gateway / Region Router"
    technology: "Google Cloud Platform / HTTPS / WebSockets"
    description: "Routes incoming traffic to regional containers in europe-west3 and us-central1."
  - type: "container"
    name: "Offline-First Patient Mobile/Web App"
    technology: "REST/gRPC / Idempotency Keys"
    description: "Client application that synchronizes state and handles unstable rural network connections."
  - type: "container"
    name: "Consent Management Container"
    technology: "Authorization Middleware"
    description: "Enforces authorization middleware and privacy compliance across all API routes."
  - type: "container"
    name: "Core Business Logic & Video Consultation Containers"
    technology: "GCP Regional Containers / WebRTC"
    description: "Handles core telehealth workflows, AI symptom checker, and video consultations."
  - type: "container"
    name: "Traceability Logging Container"
    technology: "OpenTelemetry Collector Sidecars"
    description: "Performs localized distributed tracing and audit logging."
  - type: "container"
    name: "FHIR/E-Prescription Adapter Containers"
    technology: "REST/FHIR / National Protocols"
    description: "Integrates with external US HL7 FHIR Providers, EU National Gateways, and Pharmacy Networks."
  - type: "container"
    name: "Event-Driven Integration Bus"
    technology: "GCP Pub/Sub"
    description: "Handles asynchronous handoffs and decoupling per region."
  - type: "container"
    name: "Regional Caches"
    technology: "GCP Memorystore"
    description: "Supports stateless container scaling and temporary sync payloads."
relationships:
  - source: "Patients and Licensed Clinicians"
    destination: "API Gateway / Region Router"
    description: "Interacts with platform via secure protocols"
    technology: "HTTPS/WebSockets"
  - source: "API Gateway / Region Router"
    destination: "Consent Management Container"
    description: "Enforces authorization middleware across API routes"
    technology: "Internal API"
  - source: "API Gateway / Region Router"
    destination: "Core Business Logic & Video Consultation Containers"
    description: "Routes traffic to regional deployment boundaries"
    technology: "gRPC/REST"
  - source: "Offline-First Patient Mobile/Web App"
    destination: "API Gateway / Region Router"
    description: "Synchronizes state and sends requests with idempotency keys"
    technology: "REST/gRPC"
  - source: "Consent Management Container"
    destination: "Core Business Logic & Video Consultation Containers"
    description: "Validates consent and access rights"
    technology: "Internal Middleware"
  - source: "Core Business Logic & Video Consultation Containers"
    destination: "Event-Driven Integration Bus"
    description: "Publishes and consumes asynchronous regional events"
    technology: "GCP Pub/Sub"
  - source: "Core Business Logic & Video Consultation Containers"
    destination: "Regional Caches"
    description: "Stores and retrieves temporary sync payloads"
    technology: "GCP Memorystore"
  - source: "FHIR/E-Prescription Adapter Containers"
    destination: "US HL7 FHIR Providers"
    description: "Exchanges clinical data and interoperability payloads"
    technology: "REST/FHIR"
  - source: "FHIR/E-Prescription Adapter Containers"
    destination: "EU National E-Prescription Gateways"
    description: "Routes national e-prescriptions"
    technology: "National Protocols"
  - source: "FHIR/E-Prescription Adapter Containers"
    destination: "Regional Pharmacy Networks"
    description: "Coordinates prescription fulfillment"
    technology: "REST/HTTPS"
  - source: "Core Business Logic & Video Consultation Containers"
    destination: "FHIR/E-Prescription Adapter Containers"
    description: "Requests prescription creation and external data lookup"
    technology: "Internal API / gRPC"
  - source: "Traceability Logging Container"
    destination: "Core Business Logic & Video Consultation Containers"
    description: "Collects distributed traces and audit logs"
    technology: "OpenTelemetry"