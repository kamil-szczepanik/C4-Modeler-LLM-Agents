level: component
scope: "Component diagram for the API Gateway / Region Router container"
parentContainer:
  name: "API Gateway / Region Router"
elements:
  - type: "component"
    name: "Geo-DNS and Anycast IP Router"
    technology: "Geo-DNS / Anycast IP"
    description: "Directs global traffic to regional perimeters at the network edge."
  - type: "component"
    name: "Authorization Middleware"
    technology: "Internal API Gateway Middleware"
    description: "Enforces authorization checks in coordination with the Consent Management Container."
  - type: "component"
    name: "Region Router"
    technology: "gRPC and REST over mTLS"
    description: "Routes traffic to regional boundaries based on patient and clinician location."
relationships:
  - source: "Geo-DNS and Anycast IP Router"
    destination: "Region Router"
    description: "Forwards global incoming traffic"
  - source: "Region Router"
    destination: "Authorization Middleware"
    description: "Invokes authorization checks via internal APIs"