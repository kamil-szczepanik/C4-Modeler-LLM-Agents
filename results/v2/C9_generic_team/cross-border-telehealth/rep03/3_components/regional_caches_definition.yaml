level: component
scope: "Component diagram for the Regional Caches container"
parentContainer:
  name: "Regional Caches"
elements:
  - type: "component"
    name: "Memorystore Instance"
    technology: "GCP Memorystore"
    description: "Provides low-latency regional caching supporting the Cache-Aside pattern, TTLs, and Redlock distributed locks."
  - type: "component"
    name: "Cache Management Service"
    technology: "Python, Redis Client"
    description: "Manages cache invalidation, TTL enforcement, and coordinates with core business logic."
relationships:
  - source: "Cache Management Service"
    destination: "Memorystore Instance"
    description: "Reads and writes cached data using Cache-Aside pattern"