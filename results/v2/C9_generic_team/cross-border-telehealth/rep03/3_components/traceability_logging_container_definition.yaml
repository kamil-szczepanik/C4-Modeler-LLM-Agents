level: component
scope: "Component diagram for the Traceability Logging Container container"
parentContainer:
  name: "Traceability Logging Container"
elements:
  - type: "component"
    name: "OpenTelemetry Collector Sidecar"
    technology: "OpenTelemetry Collector"
    description: "Decouples telemetry emission, enforces schema validation, buffering, and tail-based sampling for AI traceability."
  - type: "component"
    name: "Telemetry Storage Exporter"
    technology: "GCP Cloud Storage Exporter"
    description: "Transmits buffered telemetry data to region-isolated immutable storage sinks."
relationships:
  - source: "OpenTelemetry Collector Sidecar"
    destination: "Telemetry Storage Exporter"
    description: "Forwards buffered and sampled telemetry"