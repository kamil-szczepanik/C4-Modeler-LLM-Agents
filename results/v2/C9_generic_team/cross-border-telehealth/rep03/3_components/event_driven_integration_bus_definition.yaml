level: component
scope: "Component diagram for the Event-Driven Integration Bus container"
parentContainer:
  name: "Event-Driven Integration Bus"
elements:
  - type: "component"
    name: "Regional Pub/Sub Topics"
    technology: "GCP Pub/Sub with Regional Topics"
    description: "Manages regional message distribution, dead-letter queues, and flow control for asynchronous event-driven communication."
  - type: "component"
    name: "Schema Validator"
    technology: "Protocol Buffers / JSON Schema"
    description: "Enforces strict message schema validation at publisher boundaries."
  - type: "component"
    name: "Claim Check Handler"
    technology: "GCP Cloud Storage"
    description: "Offloads and retrieves large payloads using the Claim Check pattern to maintain optimal event bus performance."
relationships:
  - source: "Regional Pub/Sub Topics"
    destination: "Schema Validator"
    description: "Validates messages against strict schemas"
  - source: "Regional Pub/Sub Topics"
    destination: "Claim Check Handler"
    description: "Offloads large payloads"