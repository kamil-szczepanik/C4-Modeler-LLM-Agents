level: component
scope: "Component diagram for the Consent Management Container container"
parentContainer:
  name: "Consent Management Container"
elements:
  - type: "component"
    name: "Policy evaluation middleware"
    technology: "Internal REST/gRPC"
    description: "Evaluates authorization requests forwarded from the API Gateway/Region Router."
  - type: "component"
    name: "Open Policy Agent (OPA) Evaluation Core"
    technology: "Open Policy Agent (OPA)"
    description: "Evaluates dynamic, versioned access control and privacy policies."
  - type: "component"
    name: "GCP Memorystore (Regional caching layer)"
    technology: "GCP Memorystore / Redis"
    description: "Provides low-latency regional caching for active consent tokens."
  - type: "component"
    name: "GCP Pub/Sub (Push-based policy distribution bus)"
    technology: "GCP Pub/Sub"
    description: "Distributes compiled OPA policy bundles via push subscription."
  - type: "component"
    name: "OpenTelemetry Collector Sidecars"
    technology: "OpenTelemetry"
    description: "Emits structured audit logs asynchronously via local socket for distributed tracing."
  - type: "component"
    name: "API Gateway / Region Router"
    technology: "Gateway / Router"
    description: "Forwards requests for authorization evaluation."
relationships:
  - source: "API Gateway / Region Router"
    destination: "Policy evaluation middleware"
    description: "Forwards requests for authorization evaluation via internal REST/gRPC"
  - type: "component"
    name: "Policy evaluation middleware"
    destination: "GCP Memorystore (Regional caching layer)"
    description: "Reads cached active consent tokens via Redis protocol"
  - type: "component"
    name: "GCP Pub/Sub (Push-based policy distribution bus)"
    destination: "Policy evaluation middleware"
    description: "Distributes compiled OPA policy bundles via push subscription"
  - type: "component"
    name: "Policy evaluation middleware"
    destination: "OpenTelemetry Collector Sidecars"
    description: "Emits structured audit logs asynchronously via local socket"