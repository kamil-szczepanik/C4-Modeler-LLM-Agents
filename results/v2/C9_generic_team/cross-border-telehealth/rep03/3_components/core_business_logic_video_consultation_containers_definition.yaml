level: component
scope: "Component diagram for the Core Business Logic & Video Consultation Containers container"
parentContainer:
  name: "Core Business Logic & Video Consultation Containers"
elements:
  - type: "component"
    name: "WebRTC Media Containers"
    technology: "WebRTC / UDP"
    description: "Streams video consultations supporting degraded network conditions."
  - type: "component"
    name: "Core Business Logic Container"
    technology: "Hexagonal Architecture / Anti-Corruption Layers"
    description: "Manages domain logic, AI symptom checker, and core business workflows."
  - type: "component"
    name: "FHIR/E-Prescription Adapter Containers"
    technology: "gRPC / REST"
    description: "Requests prescriptions and external data, isolating domain logic from external regional standards."
  - type: "component"
    name: "Traceability Logging Container"
    technology: "OpenTelemetry"
    description: "Collects distributed audit logs and AI recommendation traceability."
  - type: "component"
    name: "GCP Pub/Sub Event Bus"
    technology: "GCP Pub/Sub (gRPC/HTTPS)"
    description: "Publishes asynchronous events utilizing the Claim Check Pattern for heavy payloads."
  - type: "component"
    name: "GCP Memorystore Regional Caches"
    technology: "Redis Protocol"
    description: "Stores temporary sync payloads."
  - type: "component"
    name: "GCP Secret Manager"
    technology: "GCP Secret Manager"
    description: "Enforces strict regional data residency boundaries for secrets."
relationships:
  - source: "WebRTC Media Containers"
    destination: "Patients/Clinicians"
    description: "Streams video consultations [WebRTC/UDP]"
  - source: "Core Business Logic Container"
    destination: "GCP Pub/Sub Event Bus"
    description: "Publishes asynchronous events [gRPC/HTTPS]"
  - source: "Core Business Logic Container"
    destination: "GCP Memorystore Regional Caches"
    description: "Stores temporary sync payloads [Redis Protocol]"
  - source: "Core Business Logic Container"
    destination: "FHIR/E-Prescription Adapter Containers"
    description: "Requests prescriptions and external data [gRPC/REST]"
  - source: "Traceability Logging Container"
    destination: "Core Business Logic Container"
    description: "Collects distributed audit logs [OpenTelemetry]"