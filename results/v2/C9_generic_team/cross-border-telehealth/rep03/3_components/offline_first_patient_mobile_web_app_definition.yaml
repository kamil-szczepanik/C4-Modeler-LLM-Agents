level: component
scope: "Component diagram for the Offline-First Patient Mobile/Web App container"
parentContainer:
  name: "Offline-First Patient Mobile/Web App"
elements:
  - type: "component"
    name: "Local Database Storage"
    technology: "SQLite (mobile) and IndexedDB (web)"
    description: "Resilient local-first persistence for offline periods storing local state and mutation queues."
  - type: "component"
    name: "Transactional Outbox"
    technology: "State Machine Architecture"
    description: "Manages state transitions and queues mutations with idempotency keys during offline states."
  - type: "component"
    name: "Cryptographic Envelope Manager"
    technology: "Android Keystore and iOS Keychain"
    description: "Handles client-side cryptographic envelope encryption for data-at-rest protection."
  - type: "component"
    name: "Client-Side PII Redactor"
    technology: "Client-side processing logic"
    description: "Redacts personally identifiable information on the client side prior to transmission."
  - type: "component"
    name: "Network Resilience Manager"
    technology: "Service Workers, Circuit Breakers, Token Bucket Rate Limiting"
    description: "Implements stale-while-revalidate strategies, rate limiting, and network fault tolerance."
relationships:
  - source: "Transactional Outbox"
    destination: "Local Database Storage"
    description: "Reads and writes queued mutations and state locally"
  - source: "Cryptographic Envelope Manager"
    destination: "Local Database Storage"
    description: "Encrypts data stored within local persistence layers"
  - source: "Client-Side PII Redactor"
    destination: "Transactional Outbox"
    description: "Sanitizes clinical payloads prior to outbox queuing"
  - source: "Network Resilience Manager"
    destination: "Transactional Outbox"
    description: "Controls the synchronization flow of queued mutations over network boundaries"