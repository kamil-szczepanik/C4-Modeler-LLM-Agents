level: component
scope: "Component diagram for the FHIR/E-Prescription Adapter Containers container"
parentContainer:
  name: "FHIR/E-Prescription Adapter Containers"
elements:
  - type: "component"
    name: "US HL7 FHIR Adapter"
    technology: "Containerized Service / REST / FHIR"
    description: "Exchanges clinical data with US HL7 FHIR Providers using Anti-Corruption Layer patterns."
  - type: "component"
    name: "EU E-Prescription Gateway Adapter"
    technology: "Containerized Service / National Protocols"
    description: "Routes e-prescriptions to EU National E-Prescription Gateways with strict regional routing."
  - type: "component"
    name: "Pharmacy Network Coordinator"
    technology: "Containerized Service / REST / HTTPS"
    description: "Coordinates fulfillment with Regional Pharmacy Networks, protected by circuit breakers and bulkheads."
relationships:
  - source: "US HL7 FHIR Adapter"
    destination: "EU E-Prescription Gateway Adapter"
    description: "Coordinates cross-border clinical data mapping [Internal gRPC]"
  - source: "EU E-Prescription Gateway Adapter"
    destination: "Pharmacy Network Coordinator"
    description: "Dispatches fulfillment requests [Internal API]"