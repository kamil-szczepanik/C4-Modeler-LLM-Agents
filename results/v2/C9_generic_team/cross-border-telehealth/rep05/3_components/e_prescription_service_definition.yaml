level: component
scope: "Component diagram for the E-Prescription Service container"
parentContainer:
  name: "E-Prescription Service"
elements:
  - type: "component"
    name: "Prescription Controller"
    technology: "gRPC and REST"
    description: "Handles incoming e-prescription requests from users and external adapters."
  - type: "component"
    name: "Prescription Business Logic"
    technology: "Java / Spring Boot"
    description: "Processes prescription validation, regional compliance rules, and transactional workflows."
  - type: "component"
    name: "Regional Database Access Layer"
    technology: "Cloud SQL / Spanner Driver"
    description: "Manages isolated, jurisdiction-compliant data persistence for regional storage."
relationships:
  - source: "Prescription Controller"
    destination: "Prescription Business Logic"
    description: "Delegates requests to"
  - source: "Prescription Business Logic"
    destination: "Regional Database Access Layer"
    description: "Persists prescription records using"