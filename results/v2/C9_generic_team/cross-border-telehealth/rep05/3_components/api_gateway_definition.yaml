level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Geographic Router"
    technology: "Google Cloud Platform / Edge Proxy"
    description: "Handles geographic routing, TLS termination, and directs incoming traffic to the appropriate regional infrastructure."
  - type: "component"
    name: "Auth & Validation Handler"
    technology: "Stateless JWT, HTTPS/WSS, HTTP/2"
    description: "Performs client authentication, validates explicit user consent tokens via the Consent Enforcement Proxy, and processes idempotency keys."
  - type: "component"
    name: "AI Dispatcher"
    technology: "gRPC"
    description: "Forwards symptom checker requests to the AI Symptom Checker Container for urgency recommendations."
  - type: "component"
    name: "Data Access Router"
    technology: "SQL over internal VPC"
    description: "Processes e-prescriptions and health records locally within regional databases (`europe-west3` and `us-central1`)."
  - type: "component"
    name: "Audit Emitter"
    technology: "OpenTelemetry, Structured JSON"
    description: "Emits regional structured access logs for audit logging and observability."
relationships:
  - source: "Geographic Router"
    destination: "Auth & Validation Handler"
    description: "Routes authenticated client requests for validation [HTTPS/WSS, HTTP/2]"
  - source: "Auth & Validation Handler"
    destination: "Consent Enforcement Proxy"
    description: "Validates explicit user consent tokens for cross-region requests [gRPC/REST]"
  - source: "Auth & Validation Handler"
    destination: "AI Dispatcher"
    description: "Forwards validated requests for urgency recommendations [gRPC]"
  - source: "Auth & Validation Handler"
    destination: "Data Access Router"
    description: "Routes requests to regional databases locally [SQL over internal VPC]"
  - source: "Auth & Validation Handler"
    destination: "Audit Emitter"
    description: "Triggers emission of regional structured access logs [OpenTelemetry / JSON]"