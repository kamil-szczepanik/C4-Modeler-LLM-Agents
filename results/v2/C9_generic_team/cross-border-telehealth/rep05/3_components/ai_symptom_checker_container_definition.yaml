level: component
scope: "Component diagram for the AI Symptom Checker Container container"
parentContainer:
  name: "AI Symptom Checker Container"
elements:
  - type: "component"
    name: "Symptom Analysis Controller"
    technology: "gRPC"
    description: "Handles incoming gRPC requests from the API Gateway to process patient symptoms."
  - type: "component"
    name: "Cache Manager"
    technology: "Redis Protocol"
    description: "Interacts with the Distributed Cache to retrieve and store session and lookup data."
  - type: "component"
    name: "Audit Event Emitter"
    technology: "Structured JSON Logs, OpenTelemetry"
    description: "Sends structured JSON audit logs and telemetry data to the Audit Logging Service for compliance."
relationships:
  - source: "Symptom Analysis Controller"
    destination: "Cache Manager"
    description: "Queries and updates session state via Redis Protocol"
  - source: "Symptom Analysis Controller"
    destination: "Audit Event Emitter"
    description: "Emits telemetry and structured JSON audit logs"