level: component
scope: "Component diagram for the Consent Enforcement Proxy container"
parentContainer:
  name: "Consent Enforcement Proxy"
elements:
  - type: "component"
    name: "Consent Enforcement Proxy Sidecar"
    technology: "gRPC, REST, Sidecar Proxy"
    description: "Intercepts cross-region requests between europe-west3 and us-central1, validates tokens via local Redis cache and Bloom filter revocation checks."
  - type: "component"
    name: "Open Policy Agent (OPA) Policy Engine"
    technology: "In-memory, Rego"
    description: "Evaluates declarative Rego policies locally to enforce purpose-based consent and compliance rules."
  - type: "component"
    name: "Policy Bundle Manager"
    technology: "HTTPS, Google Cloud Storage"
    description: "Pulls cryptographically signed policy bundles from regional Google Cloud Storage buckets."
  - type: "component"
    name: "Token Validation and Revocation Check"
    technology: "Distributed Redis Cache, Bloom Filters, TCP"
    description: "Validates cryptographically signed JSON Web Tokens (JWTs) and checks real-time revocation status."
relationships:
  - source: "Consent Enforcement Proxy Sidecar"
    destination: "Open Policy Agent (OPA) Policy Engine"
    description: "Evaluates declarative Rego policies locally [In-memory]"
  - source: "Consent Enforcement Proxy Sidecar"
    destination: "Policy Bundle Manager"
    description: "Pulls cryptographically signed policy bundles [HTTPS]"
  - source: "Consent Enforcement Proxy Sidecar"
    destination: "Token Validation and Revocation Check"
    description: "Validates tokens via local Redis cache and Bloom filter revocation checks [TCP]"