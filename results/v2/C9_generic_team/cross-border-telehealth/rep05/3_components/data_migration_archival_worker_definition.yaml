level: component
scope: "Component diagram for the Data Migration / Archival Worker container"
parentContainer:
  name: "Data Migration / Archival Worker"
elements:
  - type: "component"
    name: "Migration Coordinator"
    technology: "Python, Cloud Pub/Sub Client"
    description: "Orchestrates data migration and archival tasks triggered by regional events."
  - type: "component"
    name: "Archival Processor"
    technology: "Python, Cloud Storage API"
    description: "Processes and securely transfers historical patient and clinical data to regional cold storage while enforcing residency rules."
  - type: "component"
    name: "Compliance Validator"
    technology: "Python, OpenTelemetry"
    description: "Validates data payloads against GDPR and HIPAA compliance rules prior to archival."
relationships:
  - source: "Migration Coordinator"
    destination: "Archival Processor"
    description: "Triggers data packaging and transfer"
  - source: "Migration Coordinator"
    destination: "Compliance Validator"
    description: "Validates residency and privacy compliance"