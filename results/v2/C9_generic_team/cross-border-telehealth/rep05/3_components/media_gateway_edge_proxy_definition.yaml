level: component
scope: "Component diagram for the Media Gateway / Edge Proxy container"
parentContainer:
  name: "Media Gateway / Edge Proxy"
elements:
  - type: "component"
    name: "WebRTC Signaling Router"
    technology: "Janus"
    description: "Manages session establishment, NAT traversal, and peer connection signaling for video consultations."
  - type: "component"
    name: "TURN/STUN Relay Handler"
    technology: "Coturn"
    description: "Handles media relay and NAT traversal fallback over UDP, TCP, and TLS for unstable or rural networks."
  - type: "component"
    name: "Adaptive Bitrate & Congestion Controller"
    technology: "Google Congestion Control (GCC)"
    description: "Adjusts video stream quality and bandwidth dynamically based on real-time network conditions."
  - type: "component"
    name: "Session Metadata Offloader"
    technology: "Redis Client"
    description: "Communicates with the Regional Distributed Cache to persist and retrieve session states."
relationships:
  - source: "WebRTC Signaling Router"
    destination: "TURN/STUN Relay Handler"
    description: "Delegates media transport and NAT traversal [UDP/TCP/TLS]"
  - source: "TURN/STUN Relay Handler"
    destination: "Adaptive Bitrate & Congestion Controller"
    description: "Feeds network metrics for bandwidth adaptation [GCC]"
  - source: "WebRTC Signaling Router"
    destination: "Session Metadata Offloader"
    description: "Offloads session metadata [Redis Protocol]"