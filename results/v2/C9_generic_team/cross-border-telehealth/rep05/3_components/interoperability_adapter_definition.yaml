level: component
scope: "Component diagram for the Interoperability Adapter container"
parentContainer:
  name: "Interoperability Adapter"
elements:
  - type: "component"
    name: "Adapter Plugins & Strategy Pattern"
    technology: "Package-per-Country structure"
    description: "Encapsulates country-specific formatting for EU standards and US HL7 FHIR."
  - type: "component"
    name: "Outbox Worker & DLQ"
    technology: "Managed Cloud SQL / Spanner"
    description: "Persists asynchronous messaging queues for resilient e-prescription delivery."
  - type: "component"
    name: "Configuration & Feature Flag Service Client"
    technology: "gRPC/HTTPS"
    description: "Dynamically loads country-specific routing and feature flags with hot-reloading."
  - type: "component"
    name: "OpenTelemetry Tracer"
    technology: "OpenTelemetry"
    description: "Handles distributed tracing and correlation ID propagation across adapter boundaries."
  - type: "component"
    name: "Schema Validator"
    technology: "Pact & OpenAPI"
    description: "Performs contract-first development and schema validation gates."
relationships:
  - source: "Adapter Plugins & Strategy Pattern"
    destination: "Regional Pharmacies"
    description: "Sends e-prescriptions via HL7 FHIR [US] and national e-prescription standards [EU]"
  - source: "Adapter Plugins & Strategy Pattern"
    destination: "National Standards APIs"
    description: "Fetches reference data and submits transactions [REST/gRPC]"
  - source: "Outbox Worker & DLQ"
    destination: "Regional Pharmacies"
    description: "Delivers asynchronous e-prescription messages reliably"
  - source: "Configuration & Feature Flag Service Client"
    destination: "Configuration & Feature Flag Service"
    description: "Dynamically loads country-specific routing and feature flags [gRPC/HTTPS]"