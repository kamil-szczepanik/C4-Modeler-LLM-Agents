level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients in the EU and US seeking video consultations, e-prescriptions, and symptom checks."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed medical professionals providing video consultations and issuing prescriptions."
  - type: "externalSystem"
    name: "Regional Pharmacies"
    description: "Pharmacies receiving e-prescriptions across EU and US regions."
  - type: "externalSystem"
    name: "National Standards APIs"
    description: "External national APIs for e-prescription and healthcare standards compliance."
  - type: "externalSystem"
    name: "AI Symptom Checker"
    description: "AI-powered symptom checker with immutable audit logging and asynchronous gRPC integration."
  - type: "container"
    name: "API Gateway"
    technology: "Google Cloud Platform, HTTPS/WSS"
    description: "Provides client routing, authentication, and TLS termination for incoming requests."
  - type: "container"
    name: "Media Gateway / Edge Proxy"
    technology: "WebRTC, Dedicated Edge Proxy"
    description: "Manages WebRTC video consultations with adaptive bitrate handling for unstable connections."
  - type: "container"
    name: "AI Symptom Checker Container"
    technology: "gRPC"
    description: "Integrates and processes symptom checking logic for patients."
  - type: "container"
    name: "E-Prescription Service"
    technology: "Managed Regional Databases (Cloud SQL / Spanner)"
    description: "Handles e-prescription generation and management workflows."
  - type: "container"
    name: "Interoperability Adapter"
    technology: "HL7 FHIR, National Standards"
    description: "Integrates with regional pharmacies and external APIs."
  - type: "container"
    name: "Consent Enforcement Proxy"
    technology: "gRPC, REST"
    description: "Intercepts cross-region requests between europe-west3 and us-central1 to validate explicit user consent tokens."
  - type: "container"
    name: "Audit Logging"
    technology: "Structured JSON Logs, Regional Storage"
    description: "Collects regional structured JSON logs for security and compliance."
  - type: "container"
    name: "Observability / Tracing"
    technology: "OpenTelemetry"
    description: "Collects distributed traces and OpenTelemetry metrics regionally."
  - type: "container"
    name: "Configuration & Feature Flag Service"
    technology: "Google Cloud Platform"
    description: "Manages system configuration and feature flags dynamically."
  - type: "container"
    name: "Data Migration / Archival Worker"
    technology: "Managed Regional Databases"
    description: "Executes background data migration and archival tasks within regional boundaries."
relationships:
  - source: "Patients"
    destination: "API Gateway"
    description: "Interacts for client routing, authentication, and TLS termination"
    technology: "HTTPS/WSS"
  - source: "Licensed Clinicians"
    destination: "API Gateway"
    description: "Interacts for client routing, authentication, and TLS termination"
    technology: "HTTPS/WSS"
  - source: "Patients"
    destination: "Media Gateway / Edge Proxy"
    description: "Manages real-time video consultations"
    technology: "WebRTC"
  - source: "Licensed Clinicians"
    destination: "Media Gateway / Edge Proxy"
    description: "Manages real-time video consultations"
    technology: "WebRTC"
  - source: "Consent Enforcement Proxy"
    destination: "API Gateway"
    description: "Intercepts cross-region requests to validate explicit user consent tokens"
    technology: "gRPC/REST"
  - source: "Interoperability Adapter"
    destination: "Regional Pharmacies"
    description: "Integrates with regional pharmacies using HL7 FHIR and national standards"
    technology: "HL7 FHIR"
  - source: "Interoperability Adapter"
    destination: "National Standards APIs"
    description: "Integrates with national standards APIs"
    technology: "REST/gRPC"
  - source: "API Gateway"
    destination: "AI Symptom Checker"
    description: "Integrates with AI Symptom Checker service"
    technology: "gRPC"
  - source: "Audit Logging"
    destination: "API Gateway"
    description: "Collects regional structured JSON logs"
    technology: "OpenTelemetry / JSON"
  - source: "Observability / Tracing"
    destination: "API Gateway"
    description: "Collects OpenTelemetry metrics and distributed traces"
    technology: "OpenTelemetry"