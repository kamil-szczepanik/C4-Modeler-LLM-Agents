level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "A cross-border telehealth platform providing video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and the US, ensuring GDPR and HIPAA compliance."
elements:
  - type: "person"
    name: "Patients"
    description: "Patients in the EU and US seeking video consultations, e-prescriptions, and symptom checks."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed medical professionals providing video consultations and issuing prescriptions."
  - type: "externalSystem"
    name: "Regional Pharmacies"
    description: "Pharmacies receiving e-prescriptions across EU and US regions."
  - type: "externalSystem"
    name: "National Standards APIs"
    description: "External national APIs for e-prescription and healthcare standards compliance."
  - type: "externalSystem"
    name: "AI Symptom Checker"
    description: "AI-powered symptom checker with immutable audit logging and asynchronous gRPC integration."
relationships:
  - source: "Patients"
    destination: "Cross-Border Telehealth Platform"
    description: "Interact with regional telehealth platforms for video consultations and symptom checking"
    technology: "HTTPS, WebRTC"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Conduct video consultations and manage patient care"
    technology: "HTTPS, WebRTC"
  - source: "Cross-Border Telehealth Platform"
    destination: "Regional Pharmacies"
    description: "Send e-prescriptions via Anti-Corruption Layer"
    technology: "HL7 FHIR, National E-Prescription Standards"
  - source: "Cross-Border Telehealth Platform"
    destination: "National Standards APIs"
    description: "Integrate with national standards for interoperability"
    technology: "OpenAPI, AsyncAPI"
  - source: "Cross-Border Telehealth Platform"
    destination: "AI Symptom Checker"
    description: "Integrate core platform with AI service, logging inputs and model versions"
    technology: "gRPC"