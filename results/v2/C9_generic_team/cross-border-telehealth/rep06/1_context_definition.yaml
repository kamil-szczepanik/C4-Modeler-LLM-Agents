level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients across the EU and US, enforcing strict regional data residency, regulatory compliance, and resilience."
elements:
  - type: "person"
    name: "Patients and Licensed Clinicians"
    description: "Users who interact with the platform for video consultations, e-prescriptions, and AI symptom checking."
  - type: "externalSystem"
    name: "External Health Integrations"
    description: "External health systems including HL7 FHIR for US and national e-prescription standards for EU."
relationships:
  - source: "Patients and Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Interact with the platform for video consultations, prescriptions, and symptom checks"
    technology: "HTTPS/TLS 1.3, WebRTC (RTP/SRTP)"
  - source: "Cross-Border Telehealth Platform"
    destination: "External Health Integrations"
    description: "Integrates with external health systems for US (HL7 FHIR) and EU national standards via regional adapters"
    technology: "HL7 FHIR, EU National APIs, Regional Adapters"