level: component
scope: "Component diagram for the Health & Resilience Monitoring Container container"
parentContainer:
  name: "Health & Resilience Monitoring Container"
elements:
  - type: "component"
    name: "Telemetry Ingestion Component"
    technology: "Prometheus / OpenTelemetry (OTel)"
    description: "Receives regional telemetry collection and inbound telemetry reporting using standardized schemas."
  - type: "component"
    name: "Health & Metrics Engine"
    technology: "GCP Cloud Monitoring / Prometheus"
    description: "Evaluates health, resilience, and telemetry with isolated instances per region to satisfy GDPR and HIPAA."
  - type: "component"
    name: "Event Publisher Component"
    technology: "GCP Pub/Sub"
    description: "Exports resilience events and decouples observability from control-plane logic via event-driven webhooks."
  - type: "component"
    name: "Configuration Client Component"
    technology: "REST/gRPC"
    description: "Fetches operational configuration parameters from the Config & Feature Management Container."
relationships:
  - source: "Telemetry Ingestion Component"
    destination: "Health & Metrics Engine"
    description: "Passes normalized telemetry for processing"
  - source: "Health & Metrics Engine"
    destination: "Event Publisher Component"
    description: "Exports resilience events [GCP Pub/Sub]"
  - source: "Configuration Client Component"
    destination: "Health & Metrics Engine"
    description: "Applies operational configuration parameters"