level: component
scope: "Component diagram for the Integration & Translation Container container"
parentContainer:
  name: "Integration & Translation Container"
elements:
  - type: "component"
    name: "Protocol Adapter"
    technology: "Node.js / GCP Cloud Run"
    description: "Maps incoming gRPC requests to external health integration standards."
  - type: "component"
    name: "Validation and Schema Engine"
    technology: "Zod / JSON Schema"
    description: "Enforces strict data validation at adapter boundaries."
  - type: "component"
    name: "Circuit Breaker Manager"
    technology: "Opossum"
    description: "Implements circuit breakers for resilient outbound calls to external partners."
relationships:
  - source: "Protocol Adapter"
    destination: "Validation and Schema Engine"
    description: "Validates payload data [Zod / JSON Schema]"
  - source: "Protocol Adapter"
    destination: "Circuit Breaker Manager"
    description: "Protects outbound calls to external partners [HTTP/HTTPS]"