level: component
scope: "Component diagram for the Data Persistence Container container"
parentContainer:
  name: "Data Persistence Container"
elements:
  - type: "component"
    name: "Database Router"
    technology: "Cloud SQL / Cloud Spanner with Database Router pattern"
    description: "Routes queries and handles table partitioning for regional data isolation."
  - type: "component"
    name: "Schema Migration Manager"
    technology: "Flyway / Liquibase"
    description: "Enforces expand-and-contract zero-downtime automated schema migrations."
  - type: "component"
    name: "Encryption Manager"
    technology: "GCP Cloud KMS"
    description: "Handles regionally segregated customer-managed encryption keys for data at rest."
relationships:
  - source: "Database Router"
    destination: "Encryption Manager"
    description: "Encrypts data at rest with regionally segregated keys [Internal GCP APIs]"
  - source: "Schema Migration Manager"
    destination: "Database Router"
    description: "Performs automated zero-downtime schema migrations"