level: component
scope: "Component diagram for the Identity & Access Management (IAM) Container container"
parentContainer:
  name: "Identity & Access Management (IAM) Container"
elements:
  - type: "component"
    name: "Authentication and Authorization Controller"
    technology: "OAuth2 / OpenID Connect / JWTs"
    description: "Handles incoming authentication requests, issues short-lived (15-minute) tokens, and validates API requests."
  - type: "component"
    name: "Consent and State Manager"
    technology: "PostgreSQL Protocol / SQL"
    description: "Queries and manages regional user consent and user states."
  - type: "component"
    name: "Audit Event Emitter"
    technology: "gRPC"
    description: "Emits asynchronous security audit events to logging and traceability streams."
relationships:
  - source: "Authentication and Authorization Controller"
    destination: "API Gateway / Edge Proxy Container"
    description: "Authenticates and authorizes requests [gRPC over mTLS, JWT]"
  - source: "Authentication and Authorization Controller"
    destination: "Secrets & Certificate Management Container"
    description: "Retrieves signing keys and environment variables [HTTPS]"
  - source: "Audit Event Emitter"
    destination: "Audit & Traceability Logging Container"
    description: "Emits asynchronous security audit events [gRPC]"
  - source: "Consent and State Manager"
    destination: "Data Persistence Container"
    description: "Queries regional consent and user states [PostgreSQL Protocol / SQL]"