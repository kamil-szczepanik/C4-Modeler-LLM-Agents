level: component
scope: "Component diagram for the Audit & Traceability Logging Container container"
parentContainer:
  name: "Audit & Traceability Logging Container"
elements:
  - type: "component"
    name: "Log Publisher"
    technology: "GCP Pub/Sub"
    description: "Publishes asynchronous audit and traceability logs with at-least-once delivery."
  - type: "component"
    name: "Log Processor"
    technology: "GCP Cloud Logging"
    description: "Processes and ingests region-isolated logging streams for compliance."
  - type: "component"
    name: "Log Archiver"
    technology: "GCP Cloud Storage"
    description: "Archives tamper-evident logs to WORM storage with Bucket Lock."
relationships:
  - source: "Log Publisher"
    destination: "Log Processor"
    description: "Streams log events [HTTPS]"
  - source: "Log Processor"
    destination: "Log Archiver"
    description: "Persists tamper-evident logs to WORM storage [HTTPS]"