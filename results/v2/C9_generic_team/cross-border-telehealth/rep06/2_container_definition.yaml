# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients and Licensed Clinicians"
    description: "Users who interact with the platform for video consultations, e-prescriptions, and AI symptom checking."
  - type: "externalSystem"
    name: "External Health Integrations & Pharmacies"
    description: "External health systems, pharmacies, and national EU/US e-prescription standards."
  - type: "container"
    name: "API Gateway / Edge Proxy Container"
    technology: "GCP Cloud Load Balancing / Envoy"
    description: "Manages incoming traffic, routing requests securely to internal containers."
  - type: "container"
    name: "Integration & Translation Container"
    technology: "Node.js / GCP Cloud Run"
    description: "Communicates with external pharmacies and health systems via HL7 FHIR and national EU e-prescription standards."
  - type: "container"
    name: "State & Session Management Container"
    technology: "Redis / GCP Memorystore"
    description: "Utilizes regional Redis instances for session persistence and degraded-mode reconnections."
  - type: "container"
    name: "Config & Feature Management Container"
    technology: "GCP Cloud Config / Custom Service"
    description: "Manages configuration and feature flags for the platform."
  - type: "container"
    name: "Audit & Traceability Logging Container"
    technology: "GCP Pub/Sub / Cloud Logging"
    description: "Receives asynchronous events from an Inter-Container Event Bus using GCP Pub/Sub for traceability."
  - type: "container"
    name: "Identity & Access Management (IAM) Container"
    technology: "OAuth2 / OpenID Connect / JWTs"
    description: "Handles stateless authorization and purpose-based consent management."
  - type: "container"
    name: "Health & Resilience Monitoring Container"
    technology: "GCP Cloud Monitoring / Prometheus"
    description: "Monitors health and resilience across regional GCP deployments."
  - type: "container"
    name: "Secrets & Certificate Management Container"
    technology: "GCP Secret Manager"
    description: "Manages secrets and certificates securely across regions."
  - type: "container"
    name: "Data Persistence Container"
    technology: "Cloud SQL / Spanner (GCP)"
    description: "Enforces strict regional data partitioning via managed databases in GCP."
relationships:
  - source: "Patients and Licensed Clinicians"
    destination: "API Gateway / Edge Proxy Container"
    description: "Interact with the platform for video consultations, prescriptions, and symptom checks"
    technology: "HTTPS and WebRTC (adaptive bandwidth protocols)"
  - source: "API Gateway / Edge Proxy Container"
    destination: "Integration & Translation Container"
    description: "Routes requests to internal containers"
    technology: "gRPC over mTLS"
  - source: "API Gateway / Edge Proxy Container"
    destination: "State & Session Management Container"
    description: "Manages user sessions"
    technology: "gRPC over mTLS"
  - source: "API Gateway / Edge Proxy Container"
    destination: "Config & Feature Management Container"
    description: "Fetches configurations and feature flags"
    technology: "gRPC over mTLS"
  - source: "API Gateway / Edge Proxy Container"
    destination: "Audit & Traceability Logging Container"
    description: "Sends asynchronous logging events"
    technology: "GCP Pub/Sub"
  - source: "API Gateway / Edge Proxy Container"
    destination: "Identity & Access Management (IAM) Container"
    description: "Authenticates and authorizes requests"
    technology: "gRPC over mTLS, JWT"
  - source: "API Gateway / Edge Proxy Container"
    destination: "Health & Resilience Monitoring Container"
    description: "Reports health and telemetry"
    technology: "gRPC over mTLS"
  - source: "API Gateway / Edge Proxy Container"
    destination: "Secrets & Certificate Management Container"
    description: "Retrieves secrets and certificates"
    technology: "gRPC over mTLS"
  - source: "API Gateway / Edge Proxy Container"
    destination: "Data Persistence Container"
    description: "Queries and persists data"
    technology: "gRPC over mTLS"
  - source: "Integration & Translation Container"
    destination: "External Health Integrations & Pharmacies"
    description: "Communicates with external pharmacies and health systems"
    technology: "HL7 FHIR, EU national e-prescription standards"