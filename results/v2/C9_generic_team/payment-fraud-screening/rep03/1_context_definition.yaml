level: context
scope: "System Context diagram for Real-Time Fraud Detection System"
system:
  name: "Real-Time Fraud Detection System"
  description: "Screens card-not-present payment authorizations for fraud in real-time and provides case management for fraud analysts."
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Internal users performing case reviews."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External source of authorization requests."
  - type: "externalSystem"
    name: "ML Training Environment"
    description: "External system for model updates."
relationships:
  - source: "Payment Gateway"
    destination: "Real-Time Fraud Detection System"
    description: "Sends payment authorization requests for fraud screening"
    technology: "HTTPS/TLS 1.3"
  - source: "Fraud Analysts"
    destination: "Real-Time Fraud Detection System"
    description: "Performs case reviews and manages fraud cases"
    technology: "HTTPS/TLS 1.3"