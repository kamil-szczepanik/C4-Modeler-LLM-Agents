level: component
scope: "Component diagram for the Tokenization Proxy Container container"
parentContainer:
  name: "Tokenization Proxy Container"
elements:
  - type: "component"
    name: "gRPC Ingress Receiver"
    technology: "gRPC / Protobuf"
    description: "Receives forwarded payment data requests from the AWS API Gateway."
  - type: "component"
    name: "Tokenization Engine"
    technology: "Containerized Microservice"
    description: "Tokenizes sensitive payment information to ensure PCI-DSS Level 1 compliance."
  - type: "component"
    name: "Internal VPC Forwarder"
    technology: "TCP / Internal Network"
    description: "Sends tokenized payment data over the Internal VPC Network to the Modular Monolith Core Scoring Engine."
relationships:
  - source: "gRPC Ingress Receiver"
    destination: "Tokenization Engine"
    description: "Passes raw payment data for tokenization"
  - source: "Tokenization Engine"
    destination: "Internal VPC Forwarder"
    description: "Forwards tokenized data"
  - source: "Internal VPC Forwarder"
    destination: "Modular Monolith Core Scoring Engine"
    description: "Sends tokenized payment data over Internal VPC Network"