level: component
scope: "Component diagram for the AWS S3 Glacier container"
parentContainer:
  name: "AWS S3 Glacier"
elements:
  - type: "component"
    name: "Lifecycle Policy Manager"
    technology: "AWS S3 Lifecycle Configuration"
    description: "Transitions older audit payloads from S3 Object Lock into S3 Glacier storage tiers."
  - type: "component"
    name: "Restore Job Handler"
    technology: "AWS S3 Asynchronous Restore API"
    description: "Retrieves archived audit payloads via asynchronous restore jobs when requested by the Case Management Service."
relationships:
  - source: "Lifecycle Policy Manager"
    destination: "Restore Job Handler"
    description: "Transitions and manages data lifecycle states"