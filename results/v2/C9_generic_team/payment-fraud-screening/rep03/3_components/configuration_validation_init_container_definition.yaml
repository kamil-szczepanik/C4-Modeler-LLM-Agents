level: component
scope: "Component diagram for the Configuration Validation Init Container container"
parentContainer:
  name: "Configuration Validation Init Container"
elements:
  - type: "component"
    name: "Configuration Parser"
    technology: "Python / Pydantic"
    description: "Parses and loads configuration files from the shared volume on startup."
  - type: "component"
    name: "Schema Validator"
    technology: "JSON Schema / Pydantic"
    description: "Validates read-only mounted configurations against shared schemas to ensure structural and semantic correctness."
  - type: "component"
    name: "Volume Release Controller"
    technology: "Container Init Script"
    description: "Releases the shared volume marker to the Modular Monolith Core Scoring Engine upon successful validation."
relationships:
  - source: "Configuration Parser"
    destination: "Schema Validator"
    description: "Passes raw configuration data for validation."
  - source: "Schema Validator"
    destination: "Volume Release Controller"
    description: "Signals successful validation to release the shared volume marker."