level: component
scope: "Component diagram for the Modular Monolith Core Scoring Engine container"
parentContainer:
  name: "Modular Monolith Core Scoring Engine"
elements:
  - type: "component"
    name: "Rule-Evaluation Module"
    technology: "Java, Strategy Pattern, Atomic References"
    description: "Evaluates transactions against fraud rules with zero-downtime hot-swapping capability in memory."
  - type: "component"
    name: "ML-Scoring Module"
    technology: "Java, Atomic References"
    description: "Scores transactions using machine learning models with zero-downtime hot-swapping capability in memory."
  - type: "component"
    name: "Fail-Fast Validation Pipeline"
    technology: "Java"
    description: "Performs immediate validation checks on incoming payment data to quickly reject malformed requests."
relationships:
  - source: "Fail-Fast Validation Pipeline"
    destination: "Rule-Evaluation Module"
    description: "Passes validated payment data for rule evaluation"
  - source: "Rule-Evaluation Module"
    destination: "ML-Scoring Module"
    description: "Passes data for ML-based fraud scoring"