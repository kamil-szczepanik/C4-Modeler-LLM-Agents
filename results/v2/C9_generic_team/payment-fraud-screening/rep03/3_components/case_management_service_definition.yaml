level: component
scope: "Component diagram for the Case Management Service container"
parentContainer:
  name: "Case Management Service"
elements:
  - type: "component"
    name: "Case Review Controller"
    technology: "AWS ECS Fargate / Modular Monolith"
    description: "Handles secure HTTPS/TLS 1.3 requests from Fraud Analysts reviewing suspicious payments and managing fraud cases."
  - type: "component"
    name: "Async Event Consumer"
    technology: "Amazon SQS SDK"
    description: "Consumes case review triggers and asynchronous events from the Amazon SQS Message Bus via polling."
  - type: "component"
    name: "Projection Repository"
    technology: "PostgreSQL Client / AWS RDS Aurora Serverless v2"
    description: "Queries and updates read-optimized case projections using the PostgreSQL protocol over TCP."
  - type: "component"
    name: "Event Sourcing Appender"
    technology: "AWS SDK / HTTPS"
    description: "Appends immutable domain events and event snapshots to AWS S3 Object Lock for 7-year tamper-evident auditability."
  - type: "component"
    name: "Telemetry Collector"
    technology: "AWS Distro for OpenTelemetry Sidecar"
    description: "Delivers automated synthetic health checks, metrics, and tracing for the Case Management Service."
relationships:
  - source: "Case Review Controller"
    destination: "Projection Repository"
    description: "Queries and updates read-optimized case projections [PostgreSQL Protocol / TCP]"
  - source: "Async Event Consumer"
    destination: "Event Sourcing Appender"
    description: "Triggers immutable event persistence upon processing async events"
  - source: "Event Sourcing Appender"
    destination: "Projection Repository"
    description: "Synchronizes event state with read projections"
  - source: "Telemetry Collector"
    destination: "Case Review Controller"
    description: "Monitors and traces runtime operations"