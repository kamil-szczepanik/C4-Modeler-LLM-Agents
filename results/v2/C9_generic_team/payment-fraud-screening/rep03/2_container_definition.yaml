level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Internal users performing case reviews and managing fraud cases."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External source of authorization requests."
  - type: "container"
    name: "AWS API Gateway"
    technology: "AWS API Gateway with Circuit Breaker"
    description: "Receives payment authorizations and routes incoming traffic."
  - type: "container"
    name: "Tokenization Proxy Container"
    technology: "Container"
    description: "Handles tokenization securely for incoming payment requests via gRPC/Protobuf."
  - type: "container"
    name: "Modular Monolith Core Scoring Engine"
    technology: "AWS ECS Fargate"
    description: "Processes and evaluates card-not-present payment authorizations for fraud in real-time."
  - type: "container"
    name: "Case Management Service"
    technology: "AWS ECS Fargate"
    description: "Provides case management tools for fraud analysts."
  - type: "container"
    name: "Amazon SQS Message Bus"
    technology: "Amazon SQS"
    description: "Decouples real-time scoring from asynchronous analyst case management."
  - type: "container"
    name: "AWS S3 Object Lock"
    technology: "AWS S3 Object Lock"
    description: "Immutable audit storage for tamper-evident logging."
  - type: "container"
    name: "AWS S3 Glacier"
    technology: "AWS S3 Glacier"
    description: "Archival storage for long-term data retention."
  - type: "container"
    name: "OpenTelemetry Sidecar Container"
    technology: "AWS Distro for OpenTelemetry"
    description: "Sidecar telemetry collection for monitoring P99 latency."
  - type: "container"
    name: "Configuration Validation Init Container"
    technology: "Container"
    description: "Validates configuration on startup."
relationships:
  - source: "Payment Gateway"
    destination: "AWS API Gateway"
    description: "Sends payment authorization requests"
    technology: "HTTPS/TLS 1.3"
  - source: "AWS API Gateway"
    destination: "Tokenization Proxy Container"
    description: "Forwards payment data"
    technology: "gRPC/Protobuf"
  - source: "Tokenization Proxy Container"
    destination: "Modular Monolith Core Scoring Engine"
    description: "Sends tokenized payment data for scoring"
    technology: "Internal VPC Network"
  - source: "Modular Monolith Core Scoring Engine"
    destination: "Amazon SQS Message Bus"
    description: "Asynchronously routes cases"
    technology: "Amazon SQS API"
  - source: "Amazon SQS Message Bus"
    destination: "Case Management Service"
    description: "Triggers case processing via polling"
    technology: "Polling"
  - source: "Fraud Analysts"
    destination: "Case Management Service"
    description: "Performs case reviews and manages fraud cases"
    technology: "HTTPS/TLS 1.3"
  - source: "Modular Monolith Core Scoring Engine"
    destination: "AWS S3 Object Lock"
    description: "Writes tamper-evident audit logs"
    technology: "AWS SDK / S3 API"
  - source: "OpenTelemetry Sidecar Container"
    destination: "Monitoring Backend"
    description: "Exports telemetry and metrics"
    technology: "OTLP"