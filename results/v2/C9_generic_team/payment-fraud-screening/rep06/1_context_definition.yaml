level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
  description: "Screens card-not-present payment authorizations for fraud prior to approval and provides a case management interface for suspicious transactions."
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Fraud analysts who access the case management interface to review suspicious transactions."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system that invokes the payment fraud screening system for card-not-present authorizations."
  - type: "container"
    name: "API Gateway with Fail-Open Circuit Breaker"
    description: "Gateway routing incoming synchronous scoring requests with fail-open capabilities."
    technology: "HTTPS, OpenAPI"
  - type: "container"
    name: "Stateless Scoring Service"
    description: "Stateless service using Rust/Go and embedded ONNX model runtimes for scoring."
    technology: "Rust/Go, ONNX, gRPC/HTTP"
  - type: "container"
    name: "Case Management and Audit Service"
    description: "Service providing case management interface and audit handling."
    technology: "HTTPS"
  - type: "container"
    name: "Decoupled Configuration Store"
    description: "Store for rules and model weights."
    technology: "Managed Store"
  - type: "container"
    name: "Managed Database / WORM Object Storage"
    description: "Storage for 7-year tamper-evident audit logs."
    technology: "DynamoDB / Aurora Serverless / S3 WORM"
  - type: "container"
    name: "Dead-Letter Queues (DLQs)"
    description: "Queues for asynchronous isolation of audit events and case data."
    technology: "AWS SQS"
relationships:
  - source: "Payment Gateway"
    destination: "API Gateway with Fail-Open Circuit Breaker"
    description: "Invokes payment gateway via versioned OpenAPI contracts"
    technology: "HTTPS"
  - source: "API Gateway with Fail-Open Circuit Breaker"
    destination: "Stateless Scoring Service"
    description: "Routes synchronous scoring requests"
    technology: "gRPC/HTTP"
  - source: "Stateless Scoring Service"
    destination: "Decoupled Configuration Store"
    description: "Reads models and rules"
    technology: "Internal API"
  - source: "Stateless Scoring Service"
    destination: "Dead-Letter Queues (DLQs)"
    description: "Asynchronously pushes audit events and case data"
    technology: "AWS SDK"
  - source: "Stateless Scoring Service"
    destination: "Managed Database / WORM Object Storage"
    description: "Persists audit logs and case data"
    technology: "AWS SDK"
  - source: "Fraud Analysts"
    destination: "Case Management and Audit Service"
    description: "Accesses case management interface"
    technology: "HTTPS"