level: component
scope: "Component diagram for the Case Management Container container"
parentContainer:
  name: "Case Management Container"
elements:
  - type: "component"
    name: "Case Review Controller"
    technology: "OpenAPI, RESTful APIs, HTTPS/TLS 1.3"
    description: "Handles interaction with Fraud Analysts for review tasks and suspicious payment reviews, enforcing strict schema validation and RFC 7807 Problem Details."
  - type: "component"
    name: "Case Ingestion Service"
    technology: "AWS SDK, SQS Protocol"
    description: "Ingests asynchronous case creation events from Amazon SQS."
  - type: "component"
    name: "Case Domain Service"
    technology: "Hexagonal Architecture, Java / Python"
    description: "Core business logic implementing hexagonal architecture, managing case resolution, idempotency keys, and explicit domain event logging."
  - type: "component"
    name: "Persistence Adapter"
    technology: "SQL, Logical CQRS, Optimistic Concurrency Control (OCC)"
    description: "Persists case and review data to Amazon Aurora via logical CQRS."
  - type: "component"
    name: "Rule Integration Adapter"
    technology: "Internal API"
    description: "Interfaces with the Model & Rule Registry Service Container to supply rules and models."
  - type: "component"
    name: "Audit Dispatcher Adapter"
    technology: "Internal API"
    description: "Forwards domain event logs for state transitions to the Audit & Compliance Container."
relationships:
  - source: "Case Review Controller"
    destination: "Case Domain Service"
    description: "Delegates review task operations"
  - source: "Case Ingestion Service"
    destination: "Case Domain Service"
    description: "Triggers case creation events"
  - source: "Case Domain Service"
    destination: "Persistence Adapter"
    description: "Saves and retrieves case state via logical CQRS"
  - source: "Case Domain Service"
    destination: "Rule Integration Adapter"
    description: "Fetches rules and models"
  - source: "Case Domain Service"
    destination: "Audit Dispatcher Adapter"
    description: "Publishes domain event logs"