level: component
scope: "Component diagram for the API Gateway / Payment Gateway Integration Container container"
parentContainer:
  name: "API Gateway / Payment Gateway Integration Container"
elements:
  - type: "component"
    name: "Request Router"
    technology: "AWS ECS with Fargate"
    description: "Receives incoming authorization requests and routes them for processing."
  - type: "component"
    name: "Proxy Coordinator"
    technology: "AWS ECS with Fargate"
    description: "Coordinates PAN scrubbing and tokenization requests."
  - type: "component"
    name: "Scoring Invoker"
    technology: "AWS ECS with Fargate"
    description: "Queries real-time fraud scores for transactions."
relationships:
  - source: "Request Router"
    destination: "Proxy Coordinator"
    description: "Forwards requests for PAN scrubbing"
  - source: "Request Router"
    destination: "Scoring Invoker"
    description: "Queries fraud scores"