level: component
scope: "Component diagram for the Real-Time Scoring Engine Container container"
parentContainer:
  name: "Real-Time Scoring Engine Container"
elements:
  - type: "component"
    name: "Transaction Evaluation Engine"
    technology: "Rust / Go"
    description: "Evaluates transactions concurrently against scoring models and rules to screen payment authorizations for fraud within strict latency SLAs."
  - type: "component"
    name: "Cache Query Component"
    technology: "Redis Protocol"
    description: "Queries local in-memory cache for fast transaction evaluation."
  - type: "component"
    name: "Decision Publisher"
    technology: "AWS SDK"
    description: "Publishes scoring decisions asynchronously."
relationships:
  - source: "Tokenization/Masking Proxy Container"
    destination: "Transaction Evaluation Engine"
    description: "Forwards scrubbed transaction data [gRPC / Protocol Buffers]"
  - source: "Transaction Evaluation Engine"
    destination: "Amazon ElastiCache (Redis)"
    description: "Queries local cache for fast transaction evaluation [Redis Protocol]"
  - source: "Transaction Evaluation Engine"
    destination: "Amazon SQS / SNS"
    description: "Publishes scoring decisions asynchronously [AWS SDK]"
  - source: "Model & Rule Registry Service Container"
    destination: "Transaction Evaluation Engine"
    description: "Supplies immutable scoring models and rules [gRPC]"