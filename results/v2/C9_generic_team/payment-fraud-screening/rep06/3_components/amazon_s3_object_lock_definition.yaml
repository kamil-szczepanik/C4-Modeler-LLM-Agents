level: component
scope: "Component diagram for the Amazon S3 Object Lock container"
parentContainer:
  name: "Amazon S3 Object Lock"
elements:
  - type: "component"
    name: "WORM Storage Engine"
    technology: "Amazon S3 Object Lock (Compliance Mode)"
    description: "Provides immutable, Write-Once-Read-Many (WORM) storage for tamper-evident audit logs enforcing a 7-year retention mandate."
  - type: "component"
    name: "Lifecycle and Archival Manager"
    technology: "Amazon S3 Glacier Lifecycle Policies"
    description: "Automatically transitions audit logs to Glacier Flexible Archive to meet the monthly budget constraint."
relationships:
  - source: "Audit & Compliance Container"
    destination: "WORM Storage Engine"
    description: "Writes tamper-evident audit logs with client-side SHA-256 hashes and schema versions [AWS SDK]"
  - source: "WORM Storage Engine"
    destination: "Lifecycle and Archival Manager"
    description: "Transitions older log data for long-term retention"