level: component
scope: "Component diagram for the Model & Rule Registry Service Container container"
parentContainer:
  name: "Model & Rule Registry Service Container"
elements:
  - type: "component"
    name: "Model and Rule API Controller"
    technology: "AWS ECS / Fargate, REST/gRPC"
    description: "Receives requests to register, update, and query fraud detection models and rules."
  - type: "component"
    name: "Registry Orchestrator Service"
    technology: "Python / Node.js"
    description: "Manages the business logic for publishing immutable models and rules to downstream engines."
  - type: "component"
    name: "Publisher Service"
    technology: "Amazon SNS / SQS"
    description: "Broadcasts immutable models and rules asynchronously to the scoring and case management engines."
relationships:
  - source: "Model and Rule API Controller"
    destination: "Registry Orchestrator Service"
    description: "Forwards registration and query requests"
  - source: "Registry Orchestrator Service"
    destination: "Publisher Service"
    description: "Triggers broadcast of immutable models and rules"