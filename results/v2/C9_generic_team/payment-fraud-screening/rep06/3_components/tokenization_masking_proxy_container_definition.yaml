level: component
scope: "Component diagram for the Tokenization/Masking Proxy Container container"
parentContainer:
  name: "Tokenization/Masking Proxy Container"
elements:
  - type: "component"
    name: "Proxy Ingress Handler"
    technology: "AWS ECS with Fargate, TLS 1.3"
    description: "Receives incoming payment authorization requests and forwards them for PAN scrubbing."
  - type: "component"
    name: "PAN Scrubber and Tokenizer"
    technology: "AWS ECS with Fargate"
    description: "Performs vault-backed tokenization and envelope encryption using AWS KMS, ensuring PCI-DSS compliance."
  - type: "component"
    name: "Token Cache Client"
    technology: "Amazon ElastiCache (Redis)"
    description: "Minimizes latency via in-memory caching for recurring token lookups."
  - type: "component"
    name: "Secrets and Config Injector"
    technology: "AWS Secrets Manager"
    description: "Secures runtime configuration injection directly into task definitions."
  - type: "component"
    name: "Tracing Agent"
    technology: "AWS X-Ray"
    description: "Provides distributed tracing across requests."
relationships:
  - source: "Proxy Ingress Handler"
    destination: "PAN Scrubber and Tokenizer"
    description: "Forwards scrubbed transaction data"
  - source: "PAN Scrubber and Tokenizer"
    destination: "Token Cache Client"
    description: "Performs token lookups and caching"
  - source: "PAN Scrubber and Tokenizer"
    destination: "Secrets and Config Injector"
    description: "Injects secure runtime configuration"
  - source: "Proxy Ingress Handler"
    destination: "Tracing Agent"
    description: "Reports distributed traces"