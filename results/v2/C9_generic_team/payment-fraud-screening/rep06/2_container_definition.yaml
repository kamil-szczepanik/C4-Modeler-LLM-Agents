level: container
scope: "Container diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Fraud analysts who interact with the case management interface to review suspicious payment reviews."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system that sends card-not-present payment authorization requests."
  - type: "container"
    name: "API Gateway / Payment Gateway Integration Container"
    technology: "AWS ECS with Fargate, HTTPS/TLS 1.3, OpenAPI / AsyncAPI"
    description: "Handles incoming synchronous authorization requests from the payment gateway."
  - type: "container"
    name: "Tokenization/Masking Proxy Container"
    technology: "AWS ECS with Fargate"
    description: "Scrubs Primary Account Numbers (PAN) before forwarding data to ensure analysts never see full card numbers."
  - type: "container"
    name: "Real-Time Scoring Engine Container"
    technology: "AWS ECS with Fargate, gRPC/REST"
    description: "Evaluates transactions synchronously within <50ms P99 latency and publishes decisions asynchronously."
  - type: "container"
    name: "Case Management Container"
    technology: "AWS ECS with Fargate, HTTPS/TLS 1.3"
    description: "Manages suspicious payment reviews and review tasks for fraud analysts."
  - type: "container"
    name: "Model & Rule Registry Service Container"
    technology: "AWS ECS with Fargate"
    description: "Supplies immutable scoring models and rules to containers for zero-downtime updates."
  - type: "container"
    name: "Audit & Compliance Container"
    technology: "AWS ECS with Fargate"
    description: "Consumes messages from SQS and stores tamper-evident logs in Amazon S3 Object Lock."
  - type: "container"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache (Redis)"
    description: "Provides low-latency in-memory caching for local caching and sub-50ms P99 latency."
  - type: "container"
    name: "Amazon Aurora"
    technology: "Amazon Aurora"
    description: "Provides low-latency data storage."
  - type: "container"
    name: "Amazon SQS / SNS"
    technology: "Amazon SQS / SNS"
    description: "Asynchronous event-driven messaging decoupling audit logging from synchronous payment paths."
  - type: "container"
    name: "Amazon S3 Object Lock"
    technology: "Amazon S3 Object Lock"
    description: "Write-Once-Read-Many (WORM) storage satisfying 7-year tamper-evident audit requirements."
relationships:
  - source: "Payment Gateway"
    destination: "API Gateway / Payment Gateway Integration Container"
    description: "Sends authorization requests"
    technology: "HTTPS/TLS 1.3"
  - source: "API Gateway / Payment Gateway Integration Container"
    destination: "Tokenization/Masking Proxy Container"
    description: "Forwards requests for PAN scrubbing"
    technology: "Internal API"
  - source: "Tokenization/Masking Proxy Container"
    destination: "Real-Time Scoring Engine Container"
    description: "Forwards scrubbed transaction data"
    technology: "Internal API"
  - source: "Real-Time Scoring Engine Container"
    destination: "Amazon ElastiCache (Redis)"
    description: "Queries local cache for fast transaction evaluation"
    technology: "Redis Protocol"
  - source: "Real-Time Scoring Engine Container"
    destination: "Amazon SQS / SNS"
    description: "Publishes scoring decisions asynchronously"
    technology: "AWS SDK"
  - source: "Amazon SQS / SNS"
    destination: "Audit & Compliance Container"
    description: "Supplies messages for audit logging"
    technology: "SQS Consumer"
  - source: "Audit & Compliance Container"
    destination: "Amazon S3 Object Lock"
    description: "Stores tamper-evident logs for 7 years"
    technology: "AWS SDK"
  - source: "Model & Rule Registry Service Container"
    destination: "Real-Time Scoring Engine Container"
    description: "Supplies immutable scoring models and rules"
    technology: "Internal API"
  - source: "Model & Rule Registry Service Container"
    destination: "Case Management Container"
    description: "Supplies rules and models"
    technology: "Internal API"
  - source: "Fraud Analysts"
    destination: "Case Management Container"
    description: "Interacts with review tasks and suspicious payment reviews"
    technology: "HTTPS/TLS 1.3"
  - source: "Case Management Container"
    destination: "Amazon Aurora"
    description: "Persists case and review data"
    technology: "SQL"