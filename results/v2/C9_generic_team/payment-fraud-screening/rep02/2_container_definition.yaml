level: container
scope: "Container diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Reviews cases and manages fraud analysis via the Case Management Web Application."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "Sends synchronous authorization requests for card-not-present payments."
  - type: "container"
    name: "API Gateway / Ingestion Container"
    technology: "AWS API Gateway / Envoy proxy"
    description: "Handles ingress security, rate limiting, and tokenization stripping."
  - type: "container"
    name: "High-Performance Scoring Engine"
    technology: "AWS ECS on Fargate"
    description: "Evaluates card-not-present payment authorizations in real time."
  - type: "container"
    name: "Feature Store"
    technology: "Redis"
    description: "In-memory feature store for ultra-low latency lookups."
  - type: "container"
    name: "Async Event Bus"
    technology: "AWS EventBridge / SQS"
    description: "Decouples asynchronous event processing for audits and case management."
  - type: "container"
    name: "Case Management Web Application"
    technology: "AWS ECS on Fargate"
    description: "Enables fraud analysts to review suspicious transactions."
  - type: "container"
    name: "Model & Rule Registry Container"
    technology: "Container Service"
    description: "Manages models and rules for the scoring engine."
  - type: "container"
    name: "Audit & Compliance Storage"
    technology: "AWS S3 with Object Lock and Parquet format"
    description: "Tamper-evident, cost-effective 7-year audit storage."
  - type: "container"
    name: "Configuration & Secrets Management"
    technology: "AWS Secrets Manager / Parameter Store"
    description: "Manages configuration settings and secrets securely."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "API Gateway / Ingestion Container"
    description: "Sends payment authorizations"
    technology: "HTTPS/TLS"
  - source: "API Gateway / Ingestion Container"
    destination: "High-Performance Scoring Engine"
    description: "Routes authorization requests"
    technology: "Internal VPC gRPC/REST"
  - source: "High-Performance Scoring Engine"
    destination: "Feature Store"
    description: "Fetches features for scoring"
    technology: "Redis Protocol"
  - source: "High-Performance Scoring Engine"
    destination: "Async Event Bus"
    description: "Publishes transaction events"
    technology: "AWS SDK (JSON/Protobuf over SQS/EventBridge)"
  - source: "Async Event Bus"
    destination: "Case Management Web Application"
    description: "Dispatches case events"
    technology: "AWS SQS/SNS"
  - source: "Async Event Bus"
    destination: "Audit & Compliance Storage"
    description: "Streams audit logs"
    technology: "AWS SQS/SNS"
  - source: "Fraud Analyst"
    destination: "Case Management Web Application"
    description: "Reviews suspicious transactions"
    technology: "HTTPS/TLS"