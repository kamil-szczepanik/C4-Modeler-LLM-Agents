level: component
scope: "Component diagram for the Async Event Bus container"
parentContainer:
  name: "Async Event Bus"
elements:
  - type: "component"
    name: "Event Publisher"
    technology: "AWS SDK"
    description: "Publishes transaction scoring events from the scoring engine to the event bus."
  - type: "component"
    name: "Event Router"
    technology: "AWS EventBridge"
    description: "Routes incoming scoring events to appropriate downstream queues and targets."
  - type: "component"
    name: "Event Queue"
    technology: "AWS SQS"
    description: "Queues suspicious case events and decision audit logs for asynchronous processing."
relationships:
  - source: "Event Publisher"
    destination: "Event Router"
    description: "Publishes scoring events [AWS SDK over SQS/EventBridge]"
  - source: "Event Router"
    destination: "Event Queue"
    description: "Dispatches events to queues [AWS SQS/SNS]"