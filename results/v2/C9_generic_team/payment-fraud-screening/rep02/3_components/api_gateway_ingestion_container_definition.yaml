level: component
scope: "Component diagram for the API Gateway / Ingestion Container container"
parentContainer:
  name: "API Gateway / Ingestion Container"
elements:
  - type: "component"
    name: "AWS API Gateway & Envoy proxy"
    technology: "AWS API Gateway & Envoy proxy"
    description: "Serves as the secure edge proxy handling external ingress, request validation, edge routing, circuit breaking, and low-latency gRPC connection pooling."
  - type: "component"
    name: "Protocol Buffers Serializer"
    technology: "Protocol Buffers"
    description: "Minimizes serialization overhead for validated payloads to meet the 50 ms P99 latency target."
  - type: "component"
    name: "W3C Trace Context & AWS X-Ray"
    technology: "W3C Trace Context & AWS X-Ray"
    description: "Enables distributed tracing for compliance and auditability."
  - type: "component"
    name: "Idempotency & Token Cache"
    technology: "Redis (Native Envoy Integration)"
    description: "Handles sliding-window idempotency checks and request deduplication."
relationships:
  - source: "AWS API Gateway & Envoy proxy"
    destination: "Protocol Buffers Serializer"
    description: "Serializes validated payloads [Protocol Buffers]"
  - source: "AWS API Gateway & Envoy proxy"
    destination: "Idempotency & Token Cache"
    description: "Performs deduplication and idempotency checks [Internal TCP]"
  - source: "AWS API Gateway & Envoy proxy"
    destination: "W3C Trace Context & AWS X-Ray"
    description: "Propagates trace context for distributed tracing"