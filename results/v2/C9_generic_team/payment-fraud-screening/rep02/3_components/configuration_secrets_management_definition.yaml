level: component
scope: "Component diagram for the Configuration & Secrets Management container"
parentContainer:
  name: "Configuration & Secrets Management"
elements:
  - type: "component"
    name: "AWS Systems Manager Parameter Store"
    technology: "AWS SSM Parameter Store"
    description: "Stores non-sensitive application configurations and feature flags."
  - type: "component"
    name: "AWS Secrets Manager"
    technology: "AWS Secrets Manager"
    description: "Manages sensitive credentials and API keys with native AWS Lambda rotation."
  - type: "component"
    name: "High-Performance Scoring Engine"
    technology: "AWS ECS on Fargate"
    description: "Consumes and caches configurations locally in-memory to maintain sub-50ms latency."
  - type: "component"
    name: "Git-Ops / Infrastructure-as-Code Pipeline"
    technology: "GitHub / GitLab CI"
    description: "Acts as the single source of truth and enforces CI/CD schema validation."
  - type: "component"
    name: "Amazon CloudWatch"
    technology: "Amazon CloudWatch Metrics & Alarms"
    description: "Monitors cache age, fallback activation, and schema validation failure metrics."
relationships:
  - source: "High-Performance Scoring Engine"
    destination: "AWS Systems Manager Parameter Store"
    description: "Polls configurations using HTTPS over AWS PrivateLink"
  - source: "High-Performance Scoring Engine"
    destination: "AWS Secrets Manager"
    description: "Polls credentials using HTTPS over AWS PrivateLink"
  - source: "Git-Ops / Infrastructure-as-Code Pipeline"
    destination: "AWS Systems Manager Parameter Store"
    description: "Pushes validated configurations via AWS SDK / API"
  - source: "High-Performance Scoring Engine"
    destination: "Amazon CloudWatch"
    description: "Emits operational telemetry via AWS SDK"