level: component
scope: "Component diagram for the Feature Store container"
parentContainer:
  name: "Feature Store"
elements:
  - type: "component"
    name: "In-Memory Feature Cache"
    technology: "AWS ElastiCache for Redis"
    description: "Provides sub-millisecond operational feature retrieval using batch pipelining and an L1 cache."
  - type: "component"
    name: "Cold Historical Feature Storage"
    technology: "Amazon S3 / DynamoDB"
    description: "Provides fallback lookup for historical features and supports 7-year audit requirements."
  - type: "component"
    name: "Snapshot Publisher"
    technology: "AWS SDK / JSON over TLS"
    description: "Publishes immutable point-in-time feature snapshots to the async event bus."
relationships:
  - source: "In-Memory Feature Cache"
    destination: "Snapshot Publisher"
    description: "Publishes immutable point-in-time feature snapshots [AWS SDK / JSON over TLS]"
  - source: "In-Memory Feature Cache"
    destination: "Cold Historical Feature Storage"
    description: "Fallback lookup for historical features [HTTPS]"