level: component
scope: "Component diagram for the High-Performance Scoring Engine container"
parentContainer:
  name: "High-Performance Scoring Engine"
elements:
  - type: "component"
    name: "API Gateway / Ingestion Container"
    technology: "Envoy proxy / AWS API Gateway"
    description: "Routes authorization requests via gRPC over internal VPC."
  - type: "component"
    name: "Feature Store"
    technology: "Redis with local in-memory LRU cache"
    description: "Fetches transaction features using Redis Protocol with strict 15ms timeout budget."
  - type: "component"
    name: "Async Event Bus"
    technology: "AWS SQS / EventBridge"
    description: "Publishes transaction decisions and audit events using AWS SDK / JSON over SQS."
  - type: "component"
    name: "Audit & Compliance Storage"
    technology: "AWS S3 with Object Lock and Parquet format"
    description: "Persists immutable input snapshots and model versions using AWS SDK / HTTPS."
  - type: "component"
    name: "Model & Rule Registry Container"
    technology: "Containerized Registry"
    description: "Provides hot-reloadable models for transaction evaluation."
relationships:
  - source: "API Gateway / Ingestion Container"
    destination: "High-Performance Scoring Engine"
    description: "Routes authorization requests [gRPC over internal VPC]"
  - source: "High-Performance Scoring Engine"
    destination: "Feature Store"
    description: "Fetches transaction features [Redis Protocol with strict 15ms timeout budget]"
  - source: "High-Performance Scoring Engine"
    destination: "Async Event Bus"
    description: "Publishes transaction decisions and audit events [AWS SDK / JSON over SQS]"
  - source: "High-Performance Scoring Engine"
    destination: "Audit & Compliance Storage"
    description: "Persists immutable input snapshots and model versions [AWS SDK / HTTPS]"