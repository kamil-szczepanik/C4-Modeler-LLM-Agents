level: component
scope: "Component diagram for the Model & Rule Registry Container container"
parentContainer:
  name: "Model & Rule Registry Container"
elements:
  - type: "component"
    name: "Model & Rule Registry API"
    technology: "OpenAPI/Swagger"
    description: "Defines the API contract and handles incoming requests for publishing versioned model and rule artifacts."
  - type: "component"
    name: "Artifact Publisher"
    technology: "AWS ECS on Fargate"
    description: "Publishes versioned model and rule artifacts to AWS S3 and updates configuration pointers in AWS Parameter Store."
relationships:
  - source: "Model & Rule Registry API"
    destination: "Artifact Publisher"
    description: "Invokes artifact storage and configuration updates"