level: component
scope: "Component diagram for the Audit & Compliance Storage container"
parentContainer:
  name: "Audit & Compliance Storage"
elements:
  - type: "component"
    name: "Audit Event Ingestion Consumer"
    technology: "AWS Lambda / ECS Worker"
    description: "Consumes immutable audit logs and scoring decisions from the Async Event Bus."
  - type: "component"
    name: "Data Transformation & Parquet Writer"
    technology: "Python / Apache Arrow"
    description: "Transforms raw audit events into Parquet format for optimized storage and querying."
  - type: "component"
    name: "Object Lock Enforcement Manager"
    technology: "AWS S3 Object Lock (Compliance Mode)"
    description: "Enforces 7-year tamper-evident retention policies on stored compliance data."
  - type: "component"
    name: "Query & Analytics Interface"
    technology: "Amazon Athena with Partition Projection"
    description: "Provides cost-controlled serverless querying capabilities over compliance storage."
relationships:
  - source: "Audit Event Ingestion Consumer"
    destination: "Data Transformation & Parquet Writer"
    description: "Passes raw event payloads for formatting [Internal]"
  - source: "Data Transformation & Parquet Writer"
    destination: "Object Lock Enforcement Manager"
    description: "Writes structured Parquet files with compliance retention locks [AWS S3 API]"
  - source: "Query & Analytics Interface"
    destination: "Object Lock Enforcement Manager"
    description: "Queries immutable audit records for regulatory review [SQL]"