level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
  description: "Screens card-not-present payment authorizations for fraud, providing sub-50ms decisions and case management for human analysts under strict PCI-DSS Level 1 compliance."
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Reviews cases and manages fraud analysis via the Case Management UI."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "Sends synchronous authorization requests for card-not-present payments."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "Real-Time Payment Fraud Screening"
    description: "Sends synchronous authorization requests"
    technology: "HTTPS/JSON"
  - source: "Fraud Analyst"
    destination: "Real-Time Payment Fraud Screening"
    description: "Accesses Case Management UI asynchronously"
    technology: "TLS"