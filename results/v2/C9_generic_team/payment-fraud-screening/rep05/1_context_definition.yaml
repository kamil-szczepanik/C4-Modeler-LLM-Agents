level: context
scope: "System Context diagram for Card-Not-Present Fraud Screening System"
system:
  name: "Card-Not-Present Fraud Screening System"
  description: "Screens card-not-present payment authorizations for fraud in real-time while providing case management for suspicious payments."
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Fraud analysts who access the case management system to review suspicious payments."
  - type: "person"
    name: "Cardholder / Merchant"
    description: "End users and merchants initiating card-not-present transactions."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "External payment gateway or acquirer invoking fraud screening for authorizations."
  - type: "externalSystem"
    name: "Fallback Proxy"
    description: "Proxy ensuring fail-open resilience during system outages."
  - type: "container"
    name: "Fraud Screening Engine"
    description: "Stateless scoring engine providing real-time fraud checks."
    technology: "AWS Fargate / Lambda"
  - type: "container"
    name: "Case Management System"
    description: "System for fraud analysts to manage suspicious payment cases."
    technology: "Web App / HTTPS"
  - type: "container"
    name: "Content-Addressable Model Registry"
    description: "Registry storing immutable model weights for zero-downtime updates."
    technology: "Amazon S3"
  - type: "container"
    name: "Audit Trail Store"
    description: "Tiered tamper-evident audit storage ensuring 7-year compliance."
    technology: "Amazon DynamoDB & S3 Glacier Vault Lock"
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "Card-Not-Present Fraud Screening System"
    description: "Invokes fraud screening for payment authorizations with strict timeout"
    technology: "HTTPS REST API"
  - source: "Fraud Analysts"
    destination: "Card-Not-Present Fraud Screening System"
    description: "Accesses case management system to investigate suspicious payments"
    technology: "HTTPS"
  - source: "Fraud Screening Engine"
    destination: "Content-Addressable Model Registry"
    description: "Retrieves model weights"
    technology: "Internal AWS Network"
  - source: "Fraud Screening Engine"
    destination: "Audit Trail Store"
    description: "Writes tamper-evident audit logs"
    technology: "AWS SDK / Internal Network"