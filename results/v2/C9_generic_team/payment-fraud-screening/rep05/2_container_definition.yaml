level: container
scope: "Container diagram for Card-Not-Present Payment Fraud Screening Platform"
system:
  name: "Card-Not-Present Payment Fraud Screening Platform"
elements:
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "External entity submitting authorization requests."
  - type: "container"
    name: "Fallback Proxy Container"
    technology: "Container Proxy"
    description: "Manages circuit breaking and fail-open policies."
  - type: "container"
    name: "Scoring Engine Container"
    technology: "AWS ECS on Fargate, Protocol Buffers"
    description: "Stateless AWS ECS on Fargate service for real-time fraud evaluation."
  - type: "container"
    name: "Case Management & Admin Container"
    technology: "AWS ECS on Fargate"
    description: "Handles analyst workflows and rule updates."
  - type: "container"
    name: "Amazon S3"
    technology: "AWS S3 with Object Lock"
    description: "Object storage with Object Lock for immutable audit logs and versioned model bundles."
  - type: "container"
    name: "Amazon Aurora Serverless"
    technology: "Amazon Aurora Serverless, TLS"
    description: "Persistence layer for case data and audit trails."
  - type: "container"
    name: "AWS Systems Manager Parameter Store"
    technology: "AWS Systems Manager"
    description: "Centralized configuration and secrets management."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "Fallback Proxy Container"
    description: "Submits authorization requests"
    technology: "HTTPS/REST"
  - source: "Fallback Proxy Container"
    destination: "Scoring Engine Container"
    description: "Invokes fraud evaluation"
    technology: "gRPC / HTTP"
  - source: "Scoring Engine Container"
    destination: "Amazon S3"
    description: "Loads model bundles and writes tamper-evident audit records"
    technology: "HTTPS / TLS"
  - source: "Scoring Engine Container"
    destination: "AWS Systems Manager Parameter Store"
    description: "Reads configuration"
    technology: "AWS API"
  - source: "Case Management & Admin Container"
    destination: "AWS Systems Manager Parameter Store"
    description: "Reads configuration"
    technology: "AWS API"
  - source: "Case Management & Admin Container"
    destination: "Amazon Aurora Serverless"
    description: "Reads and writes audit data and cases"
    technology: "TLS"