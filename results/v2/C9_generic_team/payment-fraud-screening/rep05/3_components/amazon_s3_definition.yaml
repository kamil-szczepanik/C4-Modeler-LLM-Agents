    name: "Model Bundle Storage"
    technology: "AWS S3 Bucket with VPC Gateway Endpoints"
    description: "Stores machine learning model bundles loaded by the Scoring Engine Container."
  - type: "component"
    name: "Audit Record Store"
    technology: "AWS S3 with Object Lock and SSE-KMS"
