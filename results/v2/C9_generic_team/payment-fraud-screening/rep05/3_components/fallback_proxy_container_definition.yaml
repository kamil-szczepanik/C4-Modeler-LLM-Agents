level: component
scope: "Component diagram for the Fallback Proxy Container container"
parentContainer:
  name: "Fallback Proxy Container"
elements:
  - type: "component"
    name: "Ingress Handler"
    technology: "Envoy"
    description: "Manages ingress and HTTPS/REST requests from Cardholder / Merchant."
  - type: "component"
    name: "Circuit Breaker & Fail-Open Policy Manager"
    technology: "Envoy"
    description: "Ensures resilience and handles fallback behaviors during downstream failures."
  - type: "component"
    name: "Local Blocklist Heuristics"
    technology: "Envoy Lua / ExtAuthz"
    description: "Evaluates local blocklist rules at the edge for rapid threat mitigation."
  - type: "component"
    name: "Data Masking Engine"
    technology: "Envoy"
    description: "Masks sensitive payload data before logging or forwarding."
relationships:
  - source: "Ingress Handler"
    destination: "Circuit Breaker & Fail-Open Policy Manager"
    description: "Routes requests through"
  - source: "Circuit Breaker & Fail-Open Policy Manager"
    destination: "Local Blocklist Heuristics"
    description: "Checks rules via"
  - source: "Local Blocklist Heuristics"
    destination: "Data Masking Engine"
    description: "Sends sanitized data to"