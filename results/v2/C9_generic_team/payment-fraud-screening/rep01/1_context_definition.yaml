level: container
scope: "Container diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
  description: "Screens card-not-present payment authorizations for fraud under strict latency and compliance constraints, providing real-time evaluation and a case management interface."
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Review cases and manage fraud workflows using the case management interface."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "Sends payment authorizations for fraud screening."
  - type: "container"
    name: "AWS API Gateway"
    description: "Handles ingress validation, rate limiting, and circuit breaking."
    technology: "AWS API Gateway"
  - type: "container"
    name: "AWS ECS on Fargate Scoring Engine"
    description: "Stateless scoring engine that evaluates transactions in real-time."
    technology: "AWS ECS on Fargate"
  - type: "container"
    name: "Amazon Aurora Serverless"
    description: "Provides elastic relational case management storage."
    technology: "Amazon Aurora Serverless"
  - type: "container"
    name: "Amazon S3 Audit Store"
    description: "Provides cost-effective, tamper-evident 7-year audit retention with Object Lock and Glacier."
    technology: "Amazon S3 with Object Lock and Glacier Vault Lock"
  - type: "container"
    name: "AWS SNS and PagerDuty"
    description: "Handles operational alerts."
    technology: "AWS SNS / PagerDuty"
relationships:
  - source: "External Payment Gateway"
    destination: "AWS API Gateway"
    description: "Sends payment authorizations for fraud screening"
    technology: "HTTPS/HTTP/2 using gRPC/JSON payloads"
  - source: "AWS API Gateway"
    destination: "AWS ECS on Fargate Scoring Engine"
    description: "Forwards transactions for real-time scoring"
    technology: "HTTPS"
  - source: "AWS ECS on Fargate Scoring Engine"
    destination: "Amazon Aurora Serverless"
    description: "Reads and writes case management data"
    technology: "TLS"
  - source: "AWS ECS on Fargate Scoring Engine"
    destination: "Amazon S3 Audit Store"
    description: "Writes tamper-evident cryptographic audit logs"
    technology: "AWS SDK / HTTPS"
  - source: "AWS ECS on Fargate Scoring Engine"
    destination: "AWS SNS and PagerDuty"
    description: "Sends operational alerts"
    technology: "AWS SNS"
  - source: "Fraud Analysts"
    destination: "Amazon Aurora Serverless"
    description: "Accesses case management data via the interface"
    technology: "HTTPS"