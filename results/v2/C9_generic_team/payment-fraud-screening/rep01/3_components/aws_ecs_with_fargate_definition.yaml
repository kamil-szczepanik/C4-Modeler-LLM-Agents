level: component
scope: "Component diagram for the AWS ECS with Fargate container"
parentContainer:
  name: "AWS ECS with Fargate"
elements:
  - type: "component"
    name: "API Gateway / Ingestion Service"
    technology: "Rust / Go / Java"
    description: "Handles incoming REST/OpenAPI authorization traffic."
  - type: "component"
    name: "Scoring Engine"
    technology: "Rust / Go / Java"
    description: "Evaluates transactions using embedded ML models and rules."
  - type: "component"
    name: "Case Management & Admin UI"
    technology: "Web UI"
    description: "Web interface for fraud analysts to review flagged transactions."
  - type: "component"
    name: "Amazon S3 with Object Lock"
    technology: "AWS S3"
    description: "Persists immutable decision inputs and model versions via AWS SDK."
  - type: "component"
    name: "Amazon SQS"
    technology: "AWS SQS"
    description: "Provides message queuing for asynchronous processing."
relationships:
  - source: "API Gateway / Ingestion Service"
    destination: "Scoring Engine"
    description: "Delegates transaction payloads via gRPC/Protobuf."
  - source: "Scoring Engine"
    destination: "Amazon S3 with Object Lock"
    description: "Persists immutable decision inputs and model versions via AWS SDK."