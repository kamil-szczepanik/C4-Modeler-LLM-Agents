level: component
scope: "Component diagram for the Case Management & Admin UI container"
parentContainer:
  name: "Case Management & Admin UI"
elements:
  - type: "component"
    name: "Single Page Application (SPA) Frontend"
    technology: "React or Vue, Ant Design or MUI, AWS CloudFront, Amazon S3"
    description: "Provides the secure web user interface for fraud analysts to review suspicious payment authorizations, manage cases, and update fraud rules."
  - type: "component"
    name: "Backend-For-Frontend (BFF) Container"
    technology: "AWS Fargate (ECS), AWS SDK"
    description: "Securely handles session management, API aggregation, and communicates with downstream services."
  - type: "component"
    name: "AWS Cognito"
    technology: "Managed Identity Provider (OIDC/HTTPS)"
    description: "Authenticates users and manages sessions for secure Role-Based Access Control (RBAC)."
  - type: "component"
    name: "Amazon CloudWatch"
    technology: "AWS SDK"
    description: "Emits structured logs and distributed traces for monitoring and auditability."
relationships:
  - source: "Single Page Application (SPA) Frontend"
    destination: "Backend-For-Frontend (BFF) Container"
    description: "Communicates via API calls [HTTPS/REST]"
  - source: "Backend-For-Frontend (BFF) Container"
    destination: "AWS Cognito"
    description: "Authenticates users and manages sessions [OIDC/HTTPS]"
  - source: "Backend-For-Frontend (BFF) Container"
    destination: "Downstream Services"
    description: "Fetches and updates case data [HTTPS/REST]"
  - source: "Single Page Application (SPA) Frontend"
    destination: "Amazon CloudWatch"
    description: "Emits structured logs and distributed traces [AWS SDK]"
  - source: "Backend-For-Frontend (BFF) Container"
    destination: "Amazon CloudWatch"
    description: "Emits structured logs and distributed traces [AWS SDK]"