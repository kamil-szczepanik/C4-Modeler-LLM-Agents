level: container
scope: "Container diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "System users who interact with the case management interface."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "External system that sends card-not-present payment authorization requests."
  - type: "container"
    name: "API Gateway / Ingestion Service"
    technology: "Rust, Go, or Java with OpenAPI"
    description: "Ingests and screens payment authorizations securely."
  - type: "container"
    name: "Scoring Engine"
    technology: "Rust, Go, or Java with embedded ML runtimes and Protobuf"
    description: "Processes scoring payloads and evaluates fraud risk in real-time."
  - type: "container"
    name: "Case Management & Admin UI"
    technology: "Web UI"
    description: "Provides a case management interface for fraud analysts."
  - type: "container"
    name: "Amazon S3 with Object Lock"
    technology: "Amazon S3 with Object Lock"
    description: "Provides WORM storage for tamper-evident audit logs."
  - type: "container"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Handles asynchronous failure events as a dead-letter queue."
  - type: "container"
    name: "AWS ECS with Fargate"
    technology: "AWS ECS with Fargate"
    description: "Provides container orchestration to maintain low operational overhead."
relationships:
  - source: "External Payment Gateway"
    destination: "API Gateway / Ingestion Service"
    description: "Sends authorization requests"
    technology: "HTTPS/REST"
  - source: "API Gateway / Ingestion Service"
    destination: "Scoring Engine"
    description: "Forwards scoring payloads"
    technology: "gRPC/Protobuf"
  - source: "Scoring Engine"
    destination: "Amazon S3 with Object Lock"
    description: "Writes tamper-evident audit logs"
    technology: "AWS SDK"
  - source: "Fraud Analysts"
    destination: "Case Management & Admin UI"
    description: "Interacts with the interface"
    technology: "HTTPS/REST"
  - source: "Scoring Engine"
    destination: "Amazon SQS"
    description: "Delegates asynchronous failure events"
    technology: "AWS SDK / Message Queue"