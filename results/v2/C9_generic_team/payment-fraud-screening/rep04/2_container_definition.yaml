level: container
scope: "Container diagram for Real-Time Payment Fraud Screening Platform"
system:
  name: "Real-Time Payment Fraud Screening Platform"
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Review flagged transactions via the Case Management UI."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Integrates via REST APIs to submit payment authorizations for screening."
  - type: "container"
    name: "API Gateway / Ingress Container"
    technology: "OpenAPI / JSON Schema"
    description: "Enforces strict ingress payload validation to maintain audit data integrity."
  - type: "container"
    name: "Real-Time Scoring Container"
    technology: "AWS (eu-west-1), gRPC/REST"
    description: "Provides sub-50ms fraud scoring and hot-reloads machine learning models."
  - type: "container"
    name: "Audit Logging Container"
    technology: "AWS SQS / Kinesis, S3 Object Lock"
    description: "Dispatches and writes tamper-evident audit logs ensuring 7-year retention."
  - type: "container"
    name: "Case Management Container"
    technology: "AWS"
    description: "Manages fraud analyst reviews and investigations."
  - type: "container"
    name: "Amazon S3"
    technology: "AWS S3 Object Lock"
    description: "Model storage and Audit logs with Object Lock."
  - type: "container"
    name: "AWS SQS / Kinesis"
    technology: "AWS"
    description: "Asynchronous event bus for decision events."
  - type: "container"
    name: "AWS Secrets Manager / Parameter Store"
    technology: "AWS"
    description: "Injects credentials securely at container startup."
relationships:
  - source: "Payment Gateway"
    destination: "API Gateway / Ingress Container"
    description: "Interacts via REST APIs using OpenAPI contracts"
    technology: "HTTPS / REST"
  - source: "API Gateway / Ingress Container"
    destination: "Real-Time Scoring Container"
    description: "Interacts synchronously for scoring"
    technology: "gRPC/REST"
  - source: "Real-Time Scoring Container"
    destination: "AWS SQS / Kinesis"
    description: "Asynchronously dispatches decision events"
    technology: "AWS SQS/Kinesis"
  - source: "AWS SQS / Kinesis"
    destination: "Audit Logging Container"
    description: "Delivers decision events for logging"
    technology: "AWS Event Bus"
  - source: "Real-Time Scoring Container"
    destination: "Amazon S3"
    description: "Hot-reloads machine learning models"
    technology: "AWS S3"
  - source: "Audit Logging Container"
    destination: "Amazon S3"
    description: "Writes tamper-evident audit logs with Object Lock enabled in compliance mode"
    technology: "AWS S3 API"
  - source: "Fraud Analysts"
    destination: "Case Management Container"
    description: "Reviews flagged transactions"
    technology: "HTTPS"