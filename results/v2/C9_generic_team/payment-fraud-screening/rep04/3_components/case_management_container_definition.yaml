level: component
scope: "Component diagram for the Case Management Container container"
parentContainer:
  name: "Case Management Container"
elements:
  - type: "component"
    name: "Case Workflow Controller"
    technology: "Finite State Machine & REST API"
    description: "Manages analyst case workflows, state transitions, and standardized error handling using RFC 7807."
  - type: "component"
    name: "Case Service Layer"
    technology: "Service Layer Pattern"
    description: "Implements business logic for reviewing flagged transactions and processing fraud analyst decisions."
  - type: "component"
    name: "Case Repository"
    technology: "Repository Pattern & Optimistic Concurrency Control"
    description: "Handles data access operations and persists case states and transactional integrity."
relationships:
  - source: "Case Workflow Controller"
    destination: "Case Service Layer"
    description: "Delegates workflow requests and business operations [Invokes]"
  - source: "Case Service Layer"
    destination: "Case Repository"
    description: "Persists and retrieves case states [TCP/SQL]"