level: component
scope: "Component diagram for the API Gateway / Ingress Container container"
parentContainer:
  name: "API Gateway / Ingress Container"
elements:
  - type: "component"
    name: "Ingress Router"
    technology: "AWS API Gateway / Envoy / Nginx"
    description: "Managed ingress routing, TLS termination, and traffic entry point."
  - type: "component"
    name: "Rate Limiter & Idempotency Validator"
    technology: "Amazon ElastiCache (Redis)"
    description: "Validates idempotency keys and tracks rate limits to prevent duplicate processing."
  - type: "component"
    name: "Payload Validator"
    technology: "OpenAPI / JSON Schema"
    description: "Performs strict boundary validation and automated schema checks."
relationships:
  - source: "Ingress Router"
    destination: "Payload Validator"
    description: "Forwards incoming REST requests for schema validation [HTTPS]"
  - source: "Payload Validator"
    destination: "Rate Limiter & Idempotency Validator"
    description: "Checks idempotency keys and rate limits [Redis Protocol]"