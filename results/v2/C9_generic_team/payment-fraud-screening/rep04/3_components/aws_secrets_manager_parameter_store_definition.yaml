level: component
scope: "Component diagram for the AWS Secrets Manager / Parameter Store container"
parentContainer:
  name: "AWS Secrets Manager / Parameter Store"
elements:
  - type: "component"
    name: "Secrets Retrieval Engine"
    technology: "AWS SDK / KMS"
    description: "Fetches and decrypts database credentials, API keys, and configuration parameters securely at runtime."
  - type: "component"
    name: "Caching and Rotation Controller"
    technology: "AWS Lambda / IAM"
    description: "Manages local in-memory caching of secrets and automates periodic credential rotation to enhance security."
relationships:
  - source: "Secrets Retrieval Engine"
    destination: "Caching and Rotation Controller"
    description: "Populates and updates cached secrets"