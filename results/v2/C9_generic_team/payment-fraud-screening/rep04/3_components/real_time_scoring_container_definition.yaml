level: component
scope: "Component diagram for the Real-Time Scoring Container container"
parentContainer:
  name: "Real-Time Scoring Container"
elements:
  - type: "component"
    name: "Model Evaluation Engine"
    technology: "In-memory C++ / Python runtime"
    description: "Evaluates card-not-present payment authorizations against memory-resident models with sub-50ms latency."
  - type: "component"
    name: "Hot-Reload Manager"
    technology: "HTTPS client"
    description: "Fetches and hot-reloads machine learning models from Amazon S3 achieving zero-downtime model updates."
  - type: "component"
    name: "Event Dispatcher"
    technology: "AWS SDK"
    description: "Dispatches decision events asynchronously to AWS SQS / Kinesis and handles tamper-evident audit logging."
  - type: "component"
    name: "Resilience & Telemetry Manager"
    technology: "Circuit Breaker / Prometheus metrics"
    description: "Provides circuit breaking, graceful fallback mechanisms, and Prometheus-compatible histograms for local metrics scraping."
relationships:
  - source: "Model Evaluation Engine"
    destination: "Event Dispatcher"
    description: "Dispatches decision events asynchronously [AWS SDK]"
  - source: "Hot-Reload Manager"
    destination: "Amazon S3"
    description: "Hot-reloads machine learning models [HTTPS]"
  - source: "Event Dispatcher"
    destination: "AWS SQS / Kinesis"
    description: "Sends asynchronous decision events [AWS SDK]"