level: component
scope: "Component diagram for the Amazon S3 container"
parentContainer:
  name: "Amazon S3"
elements:
  - type: "component"
    name: "Model Artifacts Store"
    technology: "Content-Addressable Storage with SSE-KMS"
    description: "Stores versioned model tar.gz artifacts for the Real-Time Scoring Container."
  - type: "component"
    name: "Tamper-Evident Audit Log Store"
    technology: "Object Lock WORM Storage with Glacier Lifecycle"
    description: "Maintains tamper-evident audit records in compliance mode with automated lifecycle tiering for 7-year retention."
relationships:
  - source: "Real-Time Scoring Container"
    destination: "Model Artifacts Store"
    description: "Asynchronously downloads model artifacts via local caching sidecars"
  - source: "Audit Logging Container"
    destination: "Tamper-Evident Audit Log Store"
    description: "Writes tamper-evident audit logs via AWS VPC Gateway Endpoints with Object Lock enabled"