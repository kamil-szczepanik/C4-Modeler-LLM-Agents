level: component
scope: "Component diagram for the Audit Logging Container container"
parentContainer:
  name: "Audit Logging Container"
elements:
  - type: "component"
    name: "Validation Proxy"
    technology: "Lightweight validation proxy using JSON Schema and SHA-256"
    description: "Validates incoming decision events and generates cryptographic checksums to ensure audit integrity."
  - type: "component"
    name: "Embedded Append-Only Log"
    technology: "Local memory-mapped file buffering"
    description: "Provides local buffering during transient network partitions to preserve availability and prevent log loss."
  - type: "component"
    name: "Firehose Dispatcher"
    technology: "AWS Kinesis Data Firehose Client"
    description: "Pushes validated and cryptographically hashed audit batches to AWS Kinesis Data Firehose."
relationships:
  - source: "Validation Proxy"
    destination: "Embedded Append-Only Log"
    description: "Buffers unwritten audit logs locally during network partitions"
  - source: "Validation Proxy"
    destination: "Firehose Dispatcher"
    description: "Dispatches validated audit batches"
  - source: "Firehose Dispatcher"
    destination: "AWS Kinesis Data Firehose"
    description: "Pushes cryptographically hashed audit batches via AWS API"