level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening Platform"
system:
  name: "Real-Time Payment Fraud Screening Platform"
  description: "A real-time payment fraud screening platform that evaluates 3,000 card-not-present authorizations per second with automated risk scoring, case management, and a secure 7-year tamper-evident audit trail."
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Review flagged transactions via the Case Management UI."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Integrates via REST APIs to submit payment authorizations for screening."
relationships:
  - source: "Payment Gateway"
    destination: "Real-Time Payment Fraud Screening Platform"
    description: "Invokes authorization screening"
    technology: "HTTPS/REST"
  - source: "Fraud Analysts"
    destination: "Real-Time Payment Fraud Screening Platform"
    description: "Accesses Case Management UI to review flagged transactions"
    technology: "HTTPS"