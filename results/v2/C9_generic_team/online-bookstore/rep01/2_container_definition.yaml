level: container
scope: "Container diagram for Online Bookstore Platform"
system:
  name: "Online Bookstore Platform"
elements:
  - type: "person"
    name: "Customer"
    description: "Browses and purchases physical and electronic books via web or mobile interfaces."
  - type: "person"
    name: "Store Administrator"
    description: "Manages store operations, catalog, and administrative tasks."
  - type: "externalSystem"
    name: "Global Content Delivery Network (CDN) and WAF"
    description: "Provides edge security, DDoS protection, and content delivery."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Handles secure checkout and multi-currency transactions."
  - type: "externalSystem"
    name: "Shipping Providers"
    description: "Provides APIs for order fulfillment and delivery tracking."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "Calculates regional taxes for compliance."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Sends transactional emails and notifications."
  - type: "externalSystem"
    name: "SIEM Provider"
    description: "Monitors security events and telemetry."
  - type: "externalSystem"
    name: "Compliance/Archival Store"
    description: "Stores immutable audit logs for regulatory compliance."
  - type: "container"
    name: "Single Page Application (SPA) / Mobile Client"
    technology: "React, Angular, or Mobile Native"
    description: "Provides the user interface for customers and administrators."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway / Reverse Proxy"
    description: "Handles rate limiting, WAF integration, and routing."
  - type: "container"
    name: "Catalog Service"
    technology: "Microservice (Java/Spring Boot or Node.js)"
    description: "Manages the book catalog for physical and electronic sales."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Microservice (Java/Spring Boot or Node.js)"
    description: "Handles cart management, checkout, and payment/shipping integration."
  - type: "container"
    name: "Recommendation Service"
    technology: "Microservice (Python / Machine Learning)"
    description: "Provides personalized book recommendations to users."
  - type: "container"
    name: "Review Service"
    technology: "Microservice (Java/Spring Boot or Node.js)"
    description: "Manages customer reviews and ratings."
  - type: "container"
    name: "Asynchronous Message Broker"
    technology: "AWS SQS/SNS"
    description: "Decouples microservices and handles asynchronous messaging."
  - type: "container"
    name: "Distributed Caching Container"
    technology: "Amazon ElastiCache"
    description: "Provides regional low-latency reads."
  - type: "container"
    name: "Compliance/User Data Container"
    technology: "Segregated Isolated Data Stores"
    description: "Stores user and sensitive data following the Database-per-Service pattern."
  - type: "container"
    name: "Configuration/Secrets Management Container"
    technology: "AWS Secrets Manager / Parameter Store"
    description: "Manages centralized credentials and configuration."
relationships:
  - source: "Customer"
    destination: "Global Content Delivery Network (CDN) and WAF"
    description: "Accesses the platform securely via browser or mobile"
    technology: "HTTPS via TLS 1.3"
  - type: "Store Administrator"
    destination: "Global Content Delivery Network (CDN) and WAF"
    description: "Accesses administrative tools securely"
    technology: "HTTPS via TLS 1.3"
  - source: "Global Content Delivery Network (CDN) and WAF"
    destination: "Single Page Application (SPA) / Mobile Client"
    description: "Serves client assets"
    technology: "HTTPS"
  - source: "Single Page Application (SPA) / Mobile Client"
    destination: "API Gateway"
    description: "Interacts with backend services"
    technology: "HTTPS using OpenAPI/Swagger specifications"
  - source: "API Gateway"
    destination: "Catalog Service"
    description: "Routes catalog requests"
    technology: "REST/gRPC"
  - source: "API Gateway"
    destination: "Order & Checkout Service"
    description: "Routes order and checkout requests"
    technology: "REST/gRPC"
  - source: "API Gateway"
    destination: "Recommendation Service"
    description: "Routes recommendation requests"
    technology: "REST/gRPC"
  - source: "API Gateway"
    destination: "Review Service"
    description: "Routes review requests"
    technology: "REST/gRPC"
  - source: "Order & Checkout Service"
    destination: "Payment Gateway"
    description: "Processes secure payments"
    technology: "TLS and AWS SQS/SNS"
  - source: "Order & Checkout Service"
    destination: "Shipping Providers"
    description: "Arranges order fulfillment"
    technology: "TLS and AWS SQS/SNS"
  - source: "Order & Checkout Service"
    destination: "Asynchronous Message Broker"
    description: "Publishes and consumes asynchronous events"
    technology: "AWS SQS/SNS"
  - source: "Catalog Service"
    destination: "Asynchronous Message Broker"
    description: "Publishes catalog events"
    technology: "AWS SQS/SNS"
  - source: "Recommendation Service"
    destination: "Asynchronous Message Broker"
    description: "Consumes platform events"
    technology: "AWS SQS/SNS"
  - source: "Review Service"
    destination: "Asynchronous Message Broker"
    description: "Publishes review events"
    technology: "AWS SQS/SNS"
  - source: "Catalog Service"
    destination: "Distributed Caching Container"
    description: "Reads cached catalog data"
    technology: "Redis Protocol / TCP"
  - source: "Recommendation Service"
    destination: "Distributed Caching Container"
    description: "Reads cached recommendations"
    technology: "Redis Protocol / TCP"
  - source: "Catalog Service"
    destination: "Compliance/User Data Container"
    description: "Accesses catalog database"
    technology: "Database-per-Service (TCP)"
  - source: "Order & Checkout Service"
    destination: "Compliance/User Data Container"
    description: "Accesses order database"
    technology: "Database-per-Service (TCP)"
  - source: "Recommendation Service"
    destination: "Compliance/User Data Container"
    description: "Accesses recommendation database"
    technology: "Database-per-Service (TCP)"
  - source: "Review Service"
    destination: "Compliance/User Data Container"
    description: "Accesses review database"
    technology: "Database-per-Service (TCP)"
  - source: "Order & Checkout Service"
    destination: "Tax Calculation Service"
    description: "Calculates taxes"
    technology: "gRPC/HTTPS"
  - source: "Order & Checkout Service"
    destination: "Notification Service"
    description: "Triggers notifications"
    technology: "Asynchronous event messaging (AMQP/HTTPS)"
  - source: "API Gateway"
    destination: "SIEM Provider"
    description: "Exports structured JSON logs"
    technology: "HTTPS"
  - source: "Catalog Service"
    destination: "SIEM Provider"
    description: "Exports structured JSON logs"
    technology: "HTTPS"
  - source: "Order & Checkout Service"
    destination: "SIEM Provider"
    description: "Exports structured JSON logs"
    technology: "HTTPS"
  - source: "Recommendation Service"
    destination: "SIEM Provider"
    description: "Exports structured JSON logs"
    technology: "HTTPS"
  - source: "Review Service"
    destination: "SIEM Provider"
    description: "Exports structured JSON logs"
    technology: "HTTPS"
  - source: "SIEM Provider"
    destination: "Compliance/Archival Store"
    description: "Archives audit logs for GDPR/CCPA compliance"
    technology: "HTTPS"