level: component
scope: "Component diagram for the Configuration/Secrets Management Container container"
parentContainer:
  name: "Configuration/Secrets Management Container"
elements:
  - type: "component"
    name: "AWS Secrets Manager and Parameter Store"
    technology: "AWS Secrets Manager & Parameter Store"
    description: "Centralized secrets and configuration backend providing managed storage, encryption at rest, and automated rotation for credentials."
  - type: "component"
    name: "Microservices Container Application Layer"
    technology: "Catalog, Order, Recommendation, and Review Services"
    description: "Consumes configuration and runtime secrets for the online bookstore microservices architecture."
  - type: "component"
    name: "In-Memory Fallback Cache and Sanitization Middleware"
    technology: "In-Memory Fallback Caches with TTL"
    description: "Maintains resilience against transient outages and sanitizes data to meet uptime and security requirements."
  - type: "component"
    name: "CI/CD Pipeline Configuration Bundler"
    technology: "Version Control Repository with Cryptographically Signed Manifests"
    description: "Ensures build-phase immutability and environmental reproducibility."
relationships:
  - source: "Microservices Container Application Layer"
    destination: "AWS Secrets Manager and Parameter Store"
    description: "Fetches credentials and runtime secrets using HTTPS over AWS IAM."
  - source: "Microservices Container Application Layer"
    destination: "In-Memory Fallback Cache and Sanitization Middleware"
    description: "Communicates via HTTP/REST for health check endpoints and utilizes fallback caching."
  - type: "component"
    source: "AWS Secrets Manager and Parameter Store"
    destination: "CI/CD Pipeline Configuration Bundler"
    description: "Streams audit logs and secret access attempts to AWS CloudTrail/CloudWatch."