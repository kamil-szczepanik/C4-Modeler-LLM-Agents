level: component
scope: "Component diagram for the Review Service container"
parentContainer:
  name: "Review Service"
elements:
  - type: "component"
    name: "Moderation Pipeline"
    technology: "Java/Spring Boot or Node.js"
    description: "Internal component handling automated moderation and content filtering for customer reviews."
  - type: "component"
    name: "Data Retention & Anonymization Worker"
    technology: "Java/Spring Boot or Node.js"
    description: "Internal worker ensuring GDPR/CCPA compliance by anonymizing and managing user data retention."
  - type: "component"
    name: "Transactional Outbox Pattern"
    technology: "Java/Spring Boot or Node.js"
    description: "Internal component ensuring reliable event publishing to the message broker."
  - type: "component"
    name: "Bulkhead Thread Pools"
    technology: "Java/Spring Boot or Node.js"
    description: "Internal component isolating failure domains and managing resource pools."
  - type: "component"
    name: "Health Check Probes"
    technology: "Java/Spring Boot or Node.js"
    description: "Internal component monitoring container health and service liveness/readiness."
  - type: "component"
    name: "Rate Limiting / Input Sanitization Middleware"
    technology: "Java/Spring Boot or Node.js"
    description: "Internal middleware protecting the service from malicious payloads and volumetric traffic."
relationships:
  - source: "Moderation Pipeline"
    destination: "Transactional Outbox Pattern"
    description: "Queues events for publishing"
  - source: "Data Retention & Anonymization Worker"
    destination: "Compliance/User Data Container"
    description: "Anonymizes user records"
  - source: "Rate Limiting / Input Sanitization Middleware"
    destination: "Bulkhead Thread Pools"
    description: "Forwards sanitized requests"