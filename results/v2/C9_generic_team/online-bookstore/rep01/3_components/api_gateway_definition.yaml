level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Router and Reverse Proxy"
    technology: "AWS API Gateway / Reverse Proxy"
    description: "Centralizes edge routing, HTTPS termination, and traffic distribution across multi-region deployments."
  - type: "component"
    name: "Authentication and Security Filter"
    technology: "OAuth2 / JWT / AWS WAF"
    description: "Handles user authentication, rate limiting, and request validation at the edge."
  - type: "component"
    name: "Circuit Breaker and Load Balancer"
    technology: "Spring Cloud Circuit Breaker / Resilience4j"
    description: "Ensures fault tolerance and graceful degradation when routing traffic to backend microservices."
relationships:
  - source: "Edge Router and Reverse Proxy"
    destination: "Authentication and Security Filter"
    description: "Passes incoming requests for security inspection and token validation"
  - source: "Authentication and Security Filter"
    destination: "Circuit Breaker and Load Balancer"
    description: "Forwards validated requests for backend routing"