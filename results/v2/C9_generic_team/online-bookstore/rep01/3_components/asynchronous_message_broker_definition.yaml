level: component
scope: "Component diagram for the Asynchronous Message Broker container"
parentContainer:
  name: "Asynchronous Message Broker"
elements:
  - type: "component"
    name: "Event Publisher"
    technology: "AWS SNS"
    description: "Publishes asynchronous domain events from microservices to the messaging infrastructure."
  - type: "component"
    name: "Event Consumer"
    technology: "AWS SQS"
    description: "Queues and delivers asynchronous messages to subscribed microservices for processing."
  - type: "component"
    name: "Event Archive"
    technology: "AWS Kinesis / SQS Archive"
    description: "Stores historical events for event replay, auditing, and compliance purposes."
relationships:
  - source: "Event Publisher"
    destination: "Event Consumer"
    description: "Routes published events to appropriate message queues"
  - source: "Event Consumer"
    destination: "Event Archive"
    description: "Persists processed event streams for replay and analytics"