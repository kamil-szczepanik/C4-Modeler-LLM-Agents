level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "API Layer"
    technology: "Java/Spring Boot or Node.js"
    description: "Exposes REST/gRPC endpoints for routing order and checkout requests from the API Gateway."
  - type: "component"
    name: "Application Layer (Saga Orchestrators)"
    technology: "Java/Spring Boot or Node.js with Orchestration-based Saga Pattern"
    description: "Orchestrates distributed transactions across microservices and external providers."
  - type: "component"
    name: "Domain Layer (Checkout State Machines)"
    technology: "Java/Spring Boot or Node.js"
    description: "Manages checkout state transitions and domain logic."
  - type: "component"
    name: "Infrastructure Layer (Persistence, External API Adapters)"
    technology: "Database-per-Service, TLS, HTTPS, gRPC adapters"
    description: "Handles data persistence and communication with external systems like Payment Gateway, Shipping Providers, and Tax Calculation Service."
  - type: "component"
    name: "Idempotency Ledger (Redis/ElastiCache)"
    technology: "Amazon ElastiCache (Redis)"
    description: "Ensures idempotency to eliminate double-charges and guarantee transaction safety."
  - type: "component"
    name: "Message Outbox"
    technology: "Outbox Pattern with AWS SQS/SNS"
    description: "Reliably publishes domain events to the asynchronous message broker."
  - type: "component"
    name: "Health/Readiness Probes"
    technology: "HTTP Probes (/health/readiness, /health/liveness)"
    description: "Monitors the health and readiness of the container."
relationships:
  - source: "API Layer"
    destination: "Application Layer (Saga Orchestrators)"
    description: "Delegates requests to"
  - source: "Application Layer (Saga Orchestrators)"
    destination: "Domain Layer (Checkout State Machines)"
    description: "Drives"
  - source: "Application Layer (Saga Orchestrators)"
    destination: "Idempotency Ledger (Redis/ElastiCache)"
    description: "Checks and records idempotency state via"
  - source: "Application Layer (Saga Orchestrators)"
    destination: "Message Outbox"
    description: "Writes events to"
  - source: "Infrastructure Layer (Persistence, External API Adapters)"
    destination: "Compliance/User Data Container"
    description: "Accesses order database via Database-per-Service (TCP)"
  - source: "Infrastructure Layer (Persistence, External API Adapters)"
    destination: "Payment Gateway"
    description: "Processes secure payments via TLS and AWS SQS/SNS"
  - source: "Infrastructure Layer (Persistence, External API Adapters)"
    destination: "Shipping Providers"
    description: "Arranges fulfillment via TLS and AWS SQS/SNS"
  - source: "Infrastructure Layer (Persistence, External API Adapters)"
    destination: "Tax Calculation Service"
    description: "Calculates taxes via gRPC/HTTPS"
  - source: "Message Outbox"
    destination: "Asynchronous Message Broker"
    description: "Publishes events to"
  - source: "Application Layer (Saga Orchestrators)"
    destination: "Notification Service"
    description: "Triggers notifications via asynchronous messaging (AMQP/HTTPS)"
  - source: "Infrastructure Layer (Persistence, External API Adapters)"
    destination: "SIEM Provider"
    description: "Exports structured JSON logs via HTTPS"