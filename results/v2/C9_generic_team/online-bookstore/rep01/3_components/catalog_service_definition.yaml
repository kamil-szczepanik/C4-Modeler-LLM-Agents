level: component
scope: "Component diagram for the Catalog Service container"
parentContainer:
  name: "Catalog Service"
elements:
  - type: "component"
    name: "Catalog Controller"
    technology: "Java/Spring Boot REST Controller"
    description: "Exposes REST and gRPC endpoints with OpenAPI validation for catalog and search requests."
  - type: "component"
    name: "Search Index Manager"
    technology: "Java/Spring Boot Service"
    description: "Queries the read-optimized search index implementing CQRS for fast keyword searches."
  - type: "component"
    name: "Cache Manager"
    technology: "Java/Spring Boot Service with HikariCP"
    description: "Manages distributed caching using the Cache-Aside pattern for low latency data retrieval."
  - type: "component"
    name: "Database Repository"
    technology: "Java/Spring Boot Data / Flyway"
    description: "Accesses the primary relational database using a database-per-service pattern with automated migrations."
  - type: "component"
    name: "Event Publisher"
    technology: "AWS SQS/SNS Client"
    description: "Publishes and consumes asynchronous cache invalidation and catalog events ensuring idempotency."
  - type: "component"
    name: "Telemetry Logger"
    technology: "OpenTelemetry"
    description: "Exports structured JSON logs and distributed tracing data."
relationships:
  - source: "Catalog Controller"
    destination: "Search Index Manager"
    description: "Delegates search requests [TCP/HTTPS]"
  - source: "Catalog Controller"
    destination: "Cache Manager"
    description: "Reads and writes cached data [Redis Protocol / TCP]"
  - source: "Catalog Controller"
    destination: "Database Repository"
    description: "Accesses primary relational data [Database-per-Service (TCP)]"
  - source: "Search Index Manager"
    destination: "Telemetry Logger"
    description: "Exports structured search execution logs [HTTPS]"
  - source: "Cache Manager"
    destination: "Event Publisher"
    description: "Triggers cache invalidation events [AWS SQS/SNS]"
  - source: "Database Repository"
    destination: "Telemetry Logger"
    description: "Exports structured database access logs [HTTPS]"