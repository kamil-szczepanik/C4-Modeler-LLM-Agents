level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "Recommendation API Controller"
    technology: "Python / FastAPI"
    description: "Handles incoming real-time recommendation requests from the API Gateway with strict <200ms timeouts."
  - type: "component"
    name: "ML Inference Engine"
    technology: "Python / Machine Learning Library"
    description: "Processes user preferences and item data to generate personalized book recommendations."
  - type: "component"
    name: "Event Consumer"
    technology: "Python / Boto3"
    description: "Consumes platform events idempotently from the Asynchronous Message Broker for model training inputs."
  - type: "component"
    name: "Cache Manager"
    technology: "Python / Redis Client"
    description: "Reads pre-computed fallback items and interacts with the Distributed Caching Container via TCP."
  - type: "component"
    name: "Data Access Layer"
    technology: "Python / Database Connector"
    description: "Accesses pseudonymized user preference data securely from the Compliance/User Data Container."
  - type: "component"
    name: "Telemetry & Logging Client"
    technology: "Python / HTTPS Client"
    description: "Exports structured JSON logs and model telemetry to the SIEM Provider."
relationships:
  - source: "Recommendation API Controller"
    destination: "ML Inference Engine"
    description: "Delegates recommendation requests [Internal Function Call]"
  - source: "ML Inference Engine"
    destination: "Cache Manager"
    description: "Fetches pre-computed fallbacks [Redis Protocol / TCP]"
  - source: "ML Inference Engine"
    destination: "Data Access Layer"
    description: "Queries pseudonymized user preference data [Database-per-Service (TCP)]"
  - source: "Event Consumer"
    destination: "ML Inference Engine"
    description: "Feeds asynchronous event data for model training [Internal Message Queue]"
  - source: "Telemetry & Logging Client"
    destination: "SIEM Provider"
    description: "Exports structured JSON logs and model telemetry [HTTPS]"