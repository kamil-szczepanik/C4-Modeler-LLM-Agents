level: component
scope: "Component diagram for the Storefront Frontend (SPA) container"
parentContainer:
  name: "Storefront Frontend (SPA)"
elements:
  - type: "component"
    name: "Catalog Browser Component"
    technology: "React, React Query"
    description: "Handles catalog browsing, searching, and product listing displays."
  - type: "component"
    name: "Shopping Cart Component"
    technology: "React, RTK Query"
    description: "Manages shopping cart items, local state, and synchronization."
  - type: "component"
    name: "Secure Checkout Component"
    technology: "React"
    description: "Manages the secure checkout user flow and payment UI interactions."
  - type: "component"
    name: "Reviews and Recommendations Component"
    technology: "React"
    description: "Displays product reviews and personalized recommendations to users."
relationships:
  - source: "Catalog Browser Component"
    destination: "Shopping Cart Component"
    description: "Adds selected products"
  - source: "Shopping Cart Component"
    destination: "Secure Checkout Component"
    description: "Proceeds to checkout with cart items"