level: component
scope: "Component diagram for the Background Workers container"
parentContainer:
  name: "Background Workers"
elements:
  - type: "component"
    name: "Task Execution Engine"
    technology: "AWS ECS / AWS Lambda"
    description: "Executes background tasks and worker pools for scalability, managing asynchronous tasks and GDPR compliance routines."
  - type: "component"
    name: "Message Consumer"
    technology: "AWS SQS / SNS"
    description: "Consumes queued asynchronous messages with Dead Letter Queues and utilizes the claim-check pattern with Amazon S3 for large payloads."
  - type: "component"
    name: "Integration Gateway"
    technology: "HTTPS Client"
    description: "Integrates with third-party shipping providers and notification SaaS securely."
  - type: "component"
    name: "State and Rate Management"
    technology: "Amazon ElastiCache (Redis) & Amazon RDS"
    description: "Manages distributed rate limiting, centralized job status tracking, and persists job state."
relationships:
  - source: "Message Consumer"
    destination: "Task Execution Engine"
    description: "Triggers asynchronous jobs [AMQP/HTTPS]"
  - source: "Task Execution Engine"
    destination: "Integration Gateway"
    description: "Integrates with third-party shipping APIs [HTTPS]"
  - source: "Task Execution Engine"
    destination: "State and Rate Management"
    description: "Stores job status and handles state management [TCP]"