level: component
scope: "Component diagram for the Caching Layer container"
parentContainer:
  name: "Caching Layer"
elements:
  - type: "component"
    name: "Redis Cache Engine"
    technology: "Amazon ElastiCache (Redis)"
    description: "Handles in-memory caching using Cache-Aside pattern, volatile-lru eviction, and Redlock distributed locking with multi-AZ replication."
  - type: "component"
    name: "Cache Invalidation Worker"
    technology: "AWS Lambda / ECS"
    description: "Listens to asynchronous messages to invalidate or refresh stale cache entries using Stale-While-Revalidate."
relationships:
  - source: "Cache Invalidation Worker"
    destination: "Redis Cache Engine"
    description: "Evicts and updates keys via TCP"