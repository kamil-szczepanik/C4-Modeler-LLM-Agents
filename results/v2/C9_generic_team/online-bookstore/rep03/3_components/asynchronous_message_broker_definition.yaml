level: component
scope: "Component diagram for the Asynchronous Message Broker container"
parentContainer:
  name: "Asynchronous Message Broker"
elements:
  - type: "component"
    name: "Event Publisher"
    technology: "AWS SNS"
    description: "Publishes domain events from core services for asynchronous processing."
  - type: "component"
    name: "Event Queue"
    technology: "AWS SQS"
    description: "Queues asynchronous tasks and events with Dead Letter Queue (DLQ) support for fault tolerance."
relationships:
  - source: "Event Publisher"
    destination: "Event Queue"
    description: "Routes messages to appropriate queues [AMQP/HTTPS]"