level: component
scope: "Component diagram for the Persistence Layer container"
parentContainer:
  name: "Persistence Layer"
elements:
  - type: "component"
    name: "Amazon RDS"
    technology: "Relational Database Service"
    description: "Primary transactional database for orders, users, and inventory, providing ACID compliance and high-availability multi-region scaling."
  - type: "component"
    name: "Amazon OpenSearch"
    technology: "Search Engine"
    description: "Handles catalogue search, product recommendations, and sub-second keyword search capabilities."
  - type: "component"
    name: "Amazon RDS Read Replicas"
    technology: "Relational Database Read Replicas"
    description: "Offloads read queries for reviews and browsing to protect the primary transactional database."
  - type: "component"
    name: "Amazon S3 Glacier"
    technology: "Cold Storage Archive"
    description: "Archives cold transactional data for long-term storage and GDPR data retention compliance."
  - type: "component"
    name: "AWS KMS"
    technology: "Key Management Service"
    description: "Provides encryption at rest and in transit."
  - type: "component"
    name: "Debezium / AWS DMS"
    technology: "Change Data Capture (CDC)"
    description: "Synchronizes relational data asynchronously to search indexes without impacting checkout latency."
  - type: "component"
    name: "Core Domain Services"
    technology: "HikariCP / gRPC / HTTPS"
    description: "External services interacting with the persistence layer for data operations."
relationships:
  - source: "Core Domain Services"
    destination: "Amazon RDS"
    description: "Reads/writes transactional data via TCP [HikariCP / gRPC]"
  - source: "Core Domain Services"
    destination: "Amazon OpenSearch"
    description: "Queries search indexes and recommendations [TCP]"
  - source: "Amazon RDS"
    destination: "Amazon OpenSearch"
    description: "Synchronizes data asynchronously via Change Data Capture [TCP]"
  - source: "Core Domain Services"
    destination: "Amazon S3 Glacier"
    description: "Archives cold transactional data [HTTPS]"