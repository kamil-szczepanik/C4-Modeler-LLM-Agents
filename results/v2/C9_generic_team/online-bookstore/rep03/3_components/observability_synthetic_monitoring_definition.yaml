level: component
scope: "Component diagram for the Observability & Synthetic Monitoring container"
parentContainer:
  name: "Observability & Synthetic Monitoring"
elements:
  - type: "component"
    name: "Observability & Synthetic Monitoring Container"
    technology: "AWS CloudWatch, AWS X-Ray"
    description: "Native AWS monitoring, distributed tracing, and metric ingestion supporting multi-region observability."
  - type: "component"
    name: "Automated Synthetic Canaries & Out-of-Band Probes"
    technology: "Automated Test Scripts"
    description: "Executes periodic automated test scripts across us-east-1, eu-west-1, and ap-southeast-1 to validate regional user journeys."
  - type: "component"
    name: "Core Domain Services"
    technology: "ECS / EKS, gRPC / REST"
    description: "Emits structured JSON logs and RED metrics to AWS CloudWatch via APM SDK wrappers."
  - type: "component"
    name: "Operations Personnel & On-Call Engineering Team"
    technology: "Human / Alert Receiver"
    description: "Receives dispatched alerts based on SLO burn rates from AWS CloudWatch composite alarms."
relationships:
  - source: "Core Domain Services"
    destination: "Observability & Synthetic Monitoring Container"
    description: "Emit structured JSON logs and RED metrics via APM SDK wrappers"
  - source: "Automated Synthetic Canaries & Out-of-Band Probes"
    destination: "Observability & Synthetic Monitoring Container"
    description: "Validate regional user journeys and send monitoring data"
  - source: "Observability & Synthetic Monitoring Container"
    destination: "Operations Personnel & On-Call Engineering Team"
    description: "Dispatches alerts based on SLO burn rates"