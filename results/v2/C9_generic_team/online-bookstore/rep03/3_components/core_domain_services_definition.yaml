level: component
scope: "Component diagram for the Core Domain Services container"
parentContainer:
  name: "Core Domain Services"
elements:
  - type: "component"
    name: "Order Controller"
    technology: "gRPC & REST"
    description: "Handles incoming synchronous requests from the API Gateway for business logic."
  - type: "component"
    name: "Order Service"
    technology: "Java / Spring Boot"
    description: "Implements domain logic for order processing, catalog browsing, and reviews."
  - type: "component"
    name: "Event Publisher"
    technology: "AMQP / HTTPS"
    description: "Publishes asynchronous events for orders and shipping to the message broker."
relationships:
  - source: "Order Controller"
    destination: "Order Service"
    description: "Invokes business logic"
  - source: "Order Service"
    destination: "Event Publisher"
    description: "Sends asynchronous events"