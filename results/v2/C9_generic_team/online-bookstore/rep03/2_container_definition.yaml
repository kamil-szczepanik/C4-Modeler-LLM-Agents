level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Customers"
    description: "End-users who browse, purchase, and review physical and electronic books."
  - type: "externalSystem"
    name: "Payment Gateways"
    description: "External services responsible for processing secure financial transactions."
  - type: "externalSystem"
    name: "Shipping Providers"
    description: "External logistics services used for fulfilling and tracking physical book deliveries."
  - type: "container"
    name: "Storefront Frontend (SPA)"
    technology: "AWS S3, Amazon CloudFront"
    description: "Hosted via AWS S3 and distributed globally via Amazon CloudFront to provide catalogue browsing, reviews, and secure checkout."
  - type: "container"
    name: "Edge Security & WAF"
    technology: "AWS WAF"
    description: "Integrated with CloudFront and API Gateway to provide edge security."
  - type: "container"
    name: "API Gateway / BFF"
    technology: "AWS API Gateway"
    description: "Handles routing, rate limiting, and protocol translation."
  - type: "container"
    name: "Core Domain Services"
    technology: "AWS ECS / EKS, gRPC, REST"
    description: "Catalog/Search, Checkout/Cart, Recommendations, and User Management containers handling backend business logic."
  - type: "container"
    name: "Caching Layer"
    technology: "Amazon ElastiCache (Redis)"
    description: "Caches currency rates, search results, and recommendations."
  - type: "container"
    name: "Asynchronous Message Broker"
    technology: "AWS SQS/SNS with Dead Letter Queue (DLQ)"
    description: "Handles fault-tolerant asynchronous event-driven processing."
  - type: "container"
    name: "Background Workers"
    technology: "AWS ECS / Lambda"
    description: "Handles shipping integrations, audits, and GDPR anonymization."
  - type: "container"
    name: "Persistence Layer"
    technology: "Amazon RDS, Amazon OpenSearch"
    description: "Stores transactional data and provides catalogue search capabilities."
  - type: "container"
    name: "Observability & Synthetic Monitoring"
    technology: "AWS CloudWatch, X-Ray"
    description: "Provides monitoring and regional synthetic probes."
relationships:
  - source: "Customers"
    destination: "Storefront Frontend (SPA)"
    description: "Accesses the SPA storefront"
    technology: "HTTPS"
  - source: "Storefront Frontend (SPA)"
    destination: "Edge Security & WAF"
    description: "Protects frontend requests"
    technology: "AWS WAF"
  - source: "Storefront Frontend (SPA)"
    destination: "API Gateway / BFF"
    description: "Routes frontend API requests"
    technology: "HTTPS"
  - source: "API Gateway / BFF"
    destination: "Core Domain Services"
    description: "Invokes backend business logic"
    technology: "gRPC/REST"
  - source: "Core Domain Services"
    destination: "Caching Layer"
    description: "Retrieves cached catalogue and rate data"
    technology: "TCP"
  - source: "Core Domain Services"
    destination: "Persistence Layer"
    description: "Reads and writes transactional and search data"
    technology: "TCP"
  - source: "Core Domain Services"
    destination: "Asynchronous Message Broker"
    description: "Publishes asynchronous events for orders and shipping"
    technology: "AMQP/HTTPS"
  - source: "Asynchronous Message Broker"
    destination: "Background Workers"
    description: "Triggers background tasks"
    technology: "AMQP/HTTPS"
  - source: "Background Workers"
    destination: "Shipping Providers"
    description: "Integrates with third-party shipping"
    technology: "HTTPS"