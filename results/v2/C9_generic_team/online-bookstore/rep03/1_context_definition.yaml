level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "A global e-commerce platform built to sell physical and electronic books with integrated recommendations and reviews, providing a scalable, secure, and multi-currency shopping experience across multiple regions."
elements:
  - type: "person"
    name: "Customers"
    description: "End-users who browse, purchase, and review physical and electronic books."
  - type: "person"
    name: "Content Moderators"
    description: "Personnel responsible for monitoring and moderating user-generated content and reviews."
  - type: "person"
    name: "Operations Personnel"
    description: "Staff members managing the day-to-day operations and infrastructure of the platform."
  - type: "person"
    name: "Customer Support Agents"
    description: "Agents who assist customers with inquiries, issues, and order management."
  - type: "externalSystem"
    name: "Payment Gateways"
    description: "External services responsible for processing secure financial transactions."
  - type: "externalSystem"
    name: "Shipping Providers"
    description: "External logistics services used for fulfilling and tracking physical book deliveries."
  - type: "externalSystem"
    name: "Identity Providers"
    description: "External OAuth2/OIDC providers (Google/Apple) for user authentication."
  - type: "externalSystem"
    name: "Notification SaaS"
    description: "External service used for dispatching transactional messages and notifications."
  - type: "externalSystem"
    name: "Currency Exchange Rate Provider"
    description: "External provider supplying up-to-date currency exchange rates for multi-currency support."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "External services (Avalara/TaxJar) used to calculate applicable taxes."
  - type: "externalSystem"
    name: "SIEM / Compliance Logging SaaS"
    description: "External SaaS for streaming security, compliance, and audit logs."
  - type: "externalSystem"
    name: "Customer Support Helpdesk SaaS"
    description: "External SaaS platform utilized by support agents to manage customer queries."
  - type: "externalSystem"
    name: "CDN & Geo-DNS"
    description: "Edge delivery network for routing and low-latency global page loads."
relationships:
  - source: "Customers"
    destination: "CDN & Geo-DNS"
    description: "Accesses the platform securely via global routing and edge delivery"
    technology: "HTTPS"
  - source: "CDN & Geo-DNS"
    destination: "Online Bookstore"
    description: "Forwards user traffic to the core system"
    technology: "HTTPS"
  - source: "Online Bookstore"
    destination: "Payment Gateways"
    description: "Processes payments securely"
    technology: "REST APIs over TLS 1.3"
  - source: "Online Bookstore"
    destination: "Currency Exchange Rate Provider"
    description: "Fetches current exchange rates for multi-currency transactions"
    technology: "REST APIs over TLS 1.3"
  - source: "Online Bookstore"
    destination: "Tax Calculation Service"
    description: "Calculates region-specific taxes for orders"
    technology: "HTTPS APIs"
  - source: "Online Bookstore"
    destination: "Shipping Providers"
    description: "Coordinates order fulfillment and shipping"
    technology: "HTTPS APIs"
  - source: "Online Bookstore"
    destination: "Identity Providers"
    description: "Authenticates users via federation"
    technology: "OAuth2 / OIDC"
  - source: "Online Bookstore"
    destination: "Notification SaaS"
    description: "Dispatches transactional emails and notifications"
    technology: "API"
  - source: "Online Bookstore"
    destination: "SIEM / Compliance Logging SaaS"
    description: "Streams security and audit logs"
    technology: "Secure Syslog / HTTPS"