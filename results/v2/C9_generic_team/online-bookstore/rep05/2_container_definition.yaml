level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Customers"
    description: "End users accessing the platform via web browsers and native mobile apps to purchase books, read reviews, and view recommendations."
  - type: "externalSystem"
    name: "CDN"
    description: "Content Delivery Network for fetching static assets and catalogue data to ensure sub-2-second page loads."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system for processing secure financial transactions during checkout."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "External system for calculating applicable taxes during checkout."
  - type: "externalSystem"
    name: "Third-Party Shipping Provider"
    description: "External system handling order fulfillment and shipping asynchronously."
  - type: "externalSystem"
    name: "Notification Services"
    description: "External systems for sending emails and SMS notifications asynchronously."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External SaaS IdP providing authentication and identity management."
  - type: "externalSystem"
    name: "Monitoring and Observability"
    description: "External APM SaaS for monitoring system health and performance."
  - type: "externalSystem"
    name: "Secret Management Service"
    description: "AWS Secrets Manager for credential security meeting OWASP Top-10 requirements."
  - type: "externalSystem"
    name: "Feature Flag Service"
    description: "External SaaS for managing feature flags."
  - type: "externalSystem"
    name: "Currency Exchange Rate Service"
    description: "External SaaS providing currency conversion rates during checkout."
  - type: "container"
    name: "Web Application/API Gateway"
    technology: "AWS ECS/EKS, Envoy Proxy"
    description: "Entry point for client requests, providing rate limiting, circuit breaking, OWASP top-10 mitigation, and routing to core containers."
  - type: "container"
    name: "Catalog & Search Container"
    technology: "AWS ECS/EKS, Dedicated Data Store"
    description: "Manages product catalog data and search capabilities for physical and electronic books."
  - type: "container"
    name: "Checkout & Order Container"
    technology: "AWS ECS/EKS, Dedicated Data Store"
    description: "Handles secure checkout flows, order processing, and payment/tax service integrations."
  - type: "container"
    name: "Recommendation Container"
    technology: "AWS ECS/EKS, Dedicated Data Store"
    description: "Generates personalized book recommendations for customers."
  - type: "container"
    name: "Customer & Reviews Container"
    technology: "AWS ECS/EKS, Dedicated Data Store"
    description: "Manages customer profiles, account settings, and book reviews."
  - type: "container"
    name: "Background Worker / Job Processing Container"
    technology: "AWS ECS/EKS, AWS SQS/SNS"
    description: "Processes asynchronous tasks, background jobs, event-driven workflows, and notifications."
relationships:
  - source: "Customers"
    destination: "CDN"
    description: "Access static assets and content delivery"
    technology: "HTTPS"
  - source: "Customers"
    destination: "Web Application/API Gateway"
    description: "Interact with the online bookstore platform"
    technology: "HTTPS via CDN"
  - source: "Web Application/API Gateway"
    destination: "Catalog & Search Container"
    description: "Routes catalogue and search requests"
    technology: "gRPC/REST over TLS"
  - source: "Web Application/API Gateway"
    destination: "Checkout & Order Container"
    description: "Routes checkout and order processing requests"
    technology: "gRPC/REST over TLS"
  - source: "Web Application/API Gateway"
    destination: "Recommendation Container"
    description: "Fetches recommendations for users"
    technology: "gRPC/REST over TLS"
  - source: "Web Application/API Gateway"
    destination: "Customer & Reviews Container"
    description: "Manages customer profile and review interactions"
    technology: "gRPC/REST over TLS"
  - source: "Checkout & Order Container"
    destination: "Payment Gateway"
    description: "Processes financial transactions"
    technology: "HTTPS"
  - source: "Checkout & Order Container"
    destination: "Tax Calculation Service"
    description: "Calculates order taxes"
    technology: "HTTPS"
  - source: "Checkout & Order Container"
    destination: "Third-Party Shipping Provider"
    description: "Initiates shipping fulfillment"
    technology: "HTTPS"
  - source: "Checkout & Order Container"
    destination: "Currency Exchange Rate Service"
    description: "Fetches exchange rates"
    technology: "HTTPS"
  - source: "Web Application/API Gateway"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "HTTPS"
  - source: "Web Application/API Gateway"
    destination: "Feature Flag Service"
    description: "Evaluates feature flags"
    technology: "HTTPS"
  - source: "Web Application/API Gateway"
    destination: "Secret Management Service"
    description: "Retrieves secure credentials"
    technology: "AWS Secrets Manager"
  - source: "Web Application/API Gateway"
    destination: "Monitoring and Observability"
    description: "Sends telemetry and trace data"
    technology: "W3C Trace Context / AWS X-Ray"
  - source: "Checkout & Order Container"
    destination: "Background Worker / Job Processing Container"
    description: "Publishes asynchronous tasks and events"
    technology: "AWS SQS/SNS"
  - source: "Background Worker / Job Processing Container"
    destination: "Notification Services"
    description: "Sends asynchronous notifications (Email/SMS)"
    technology: "HTTPS"