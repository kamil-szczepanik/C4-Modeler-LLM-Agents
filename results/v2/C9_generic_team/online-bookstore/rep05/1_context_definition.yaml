level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "A multi-region e-commerce platform built on AWS to support global book sales with recommendations and reviews, handling 1M MAU across three regions."
elements:
  - type: "person"
    name: "Customers"
    description: "End users accessing the platform via web browsers and native mobile apps to purchase books, read reviews, and view recommendations."
  - type: "externalSystem"
    name: "CDN"
    description: "Content Delivery Network for fetching static assets and catalogue data to ensure sub-2-second page loads."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system for processing secure financial transactions during checkout."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "External system for calculating applicable taxes during checkout."
  - type: "externalSystem"
    name: "Third-Party Shipping Provider"
    description: "External system handling order fulfillment and shipping asynchronously."
  - type: "externalSystem"
    name: "Notification Services"
    description: "External systems for sending emails and SMS notifications asynchronously."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External SaaS IdP providing authentication and identity management."
  - type: "externalSystem"
    name: "Monitoring and Observability"
    description: "External APM SaaS for monitoring system health and performance."
  - type: "externalSystem"
    name: "Secret Management Service"
    description: "AWS Secrets Manager for credential security meeting OWASP Top-10 requirements."
  - type: "externalSystem"
    name: "Feature Flag Service"
    description: "External SaaS for managing feature flags."
  - type: "externalSystem"
    name: "Currency Exchange Rate Service"
    description: "External SaaS providing currency conversion rates during checkout."
relationships:
  - source: "Customers"
    destination: "Online Bookstore"
    description: "Interact with client applications and core system via HTTPS"
    technology: "HTTPS"
  - source: "Online Bookstore"
    destination: "CDN"
    description: "Fetch static assets and catalogue data"
    technology: "HTTPS"
  - source: "Online Bookstore"
    destination: "Payment Gateway"
    description: "Integrate synchronously during checkout"
    technology: "HTTPS"
  - source: "Online Bookstore"
    destination: "Tax Calculation Service"
    description: "Integrate synchronously during checkout"
    technology: "HTTPS"
  - source: "Online Bookstore"
    destination: "Third-Party Shipping Provider"
    description: "Integrate asynchronously via event buses"
    technology: "Event Bus / Message Queues"
  - source: "Online Bookstore"
    destination: "Notification Services"
    description: "Send asynchronous notifications (Email/SMS)"
    technology: "Event Bus / Message Queues"
  - source: "Online Bookstore"
    destination: "Identity Provider"
    description: "Authenticate users securely"
    technology: "Internal AWS VPC peering / IAM"
  - source: "Online Bookstore"
    destination: "Secret Management Service"
    description: "Manage and retrieve credentials securely"
    technology: "AWS Secrets Manager"
  - source: "Online Bookstore"
    destination: "Currency Exchange Rate Service"
    description: "Fetch currency exchange rates during checkout"
    technology: "HTTPS"