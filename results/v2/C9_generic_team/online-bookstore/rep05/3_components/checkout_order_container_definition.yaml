level: component
scope: "Component diagram for the Checkout & Order Container container"
parentContainer:
  name: "Checkout & Order Container"
elements:
  - type: "component"
    name: "Checkout & Order Container"
    technology: "AWS ECS/EKS"
    description: "Microservice responsible for secure financial transactions, order processing, and third-party logistics integrations."
  - type: "component"
    name: "Dedicated Data Store"
    technology: "PostgreSQL"
    description: "ACID-compliant relational database ensuring strict consistency for financial transactions and order states."
  - type: "component"
    name: "External Payment Gateway"
    technology: "HTTPS"
    description: "External service that authorizes and processes financial transactions."
  - type: "component"
    name: "Tax Calculation Service"
    technology: "HTTPS"
    description: "External service that computes regional taxes."
  - type: "component"
    name: "Third-Party Shipping Provider"
    technology: "HTTPS"
    description: "External service that initiates fulfillment and shipping."
  - type: "component"
    name: "Currency Exchange Rate Service"
    technology: "HTTPS"
    description: "External service that fetches conversion rates."
  - type: "component"
    name: "Background Worker / Job Processing Container"
    technology: "AWS SQS/SNS with Dead Letter Queue"
    description: "Handles asynchronous messaging and decoupled background job processing."
  - type: "component"
    name: "Web Application / API Gateway"
    technology: "Envoy Proxy"
    description: "Routes checkout and order requests to the container."
relationships:
  - source: "Web Application / API Gateway"
    destination: "Checkout & Order Container"
    description: "Routes checkout and order requests [gRPC/REST over TLS]"
  - source: "Checkout & Order Container"
    destination: "External Payment Gateway"
    description: "Authorizes and processes financial transactions [HTTPS]"
  - source: "Checkout & Order Container"
    destination: "Tax Calculation Service"
    description: "Computes regional taxes [HTTPS]"
  - source: "Checkout & Order Container"
    destination: "Third-Party Shipping Provider"
    description: "Initiates fulfillment and shipping [HTTPS]"
  - source: "Checkout & Order Container"
    destination: "Currency Exchange Rate Service"
    description: "Fetches conversion rates [HTTPS]"
  - source: "Checkout & Order Container"
    destination: "Background Worker / Job Processing Container"
    description: "Publishes asynchronous tasks and events [AWS SQS/SNS]"