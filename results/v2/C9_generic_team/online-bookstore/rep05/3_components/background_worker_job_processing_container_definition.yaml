level: component
scope: "Component diagram for the Background Worker / Job Processing Container container"
parentContainer:
  name: "Background Worker / Job Processing Container"
elements:
  - type: "component"
    name: "Event Consumer and Router"
    technology: "AWS ECS/EKS tasks, AWS SQS/SNS, W3C Trace Context"
    description: "Consumes segmented messages (high-priority, default, bulk) from AWS SQS and routes them based on payload envelopes while preserving distributed tracing context."
  - type: "component"
    name: "Idempotency and State Manager"
    technology: "Redis, DynamoDB"
    description: "Provides distributed locking for atomic state management and tracks idempotency keys to ensure safe message redelivery and processing."
  - type: "component"
    name: "External Integration Handler"
    technology: "Resilience4j, Polly, HTTPS"
    description: "Communicates with third-party shipping providers, payment gateways, and notification services, protected by circuit breakers and exponential backoff."
  - type: "component"
    name: "DLQ Triage and Replay Manager"
    technology: "AWS SQS DLQ"
    description: "Isolates poisoned messages after the maximum receive count is exceeded and provides triage and replay mechanisms."
relationships:
  - source: "Event Consumer and Router"
    destination: "Idempotency and State Manager"
    description: "Checks state and acquires distributed locks for incoming domain events"
  - source: "Event Consumer and Router"
    destination: "External Integration Handler"
    description: "Delegates fulfillment, tracking, and notification tasks to external services"
  - source: "Event Consumer and Router"
    destination: "DLQ Triage and Replay Manager"
    description: "Sends poisoned or repeatedly failing messages to the Dead-Letter Queue"
  - source: "External Integration Handler"
    destination: "Notification Services"
    description: "Sends asynchronous email/SMS notifications [HTTPS]"
  - source: "External Integration Handler"
    destination: "Third-Party Shipping Providers"
    description: "Communicates fulfillment and tracking requests [HTTPS]"