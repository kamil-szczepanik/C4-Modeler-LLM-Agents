level: component
scope: "Component diagram for the Customer & Reviews Container container"
parentContainer:
  name: "Customer & Reviews Container"
elements:
  - type: "component"
    name: "Customer Profile Domain"
    technology: "Microservice Component"
    description: "Manages strict PII and account settings."
  - type: "component"
    name: "Reviews Domain"
    technology: "Microservice Component"
    description: "Manages public book reviews and 5-star ratings."
  - type: "component"
    name: "Background Worker Container"
    technology: "AWS ECS/EKS Container"
    description: "Executes data retention, anonymization, and Saga workflows."
  - type: "component"
    name: "API Gateway"
    technology: "AWS API Gateway"
    description: "Enforces rate limiting, Content Security Policy (CSP), and request routing."
relationships:
  - source: "API Gateway"
    destination: "Customer Profile Domain"
    description: "Manages customer profile and review interactions [gRPC/REST over TLS]."
  - source: "API Gateway"
    destination: "Reviews Domain"
    description: "Manages customer profile and review interactions [gRPC/REST over TLS]."
  - source: "Customer Profile Domain"
    destination: "Background Worker Container"
    description: "Publishes asynchronous events [AWS SQS/SNS]."
  - source: "Reviews Domain"
    destination: "Background Worker Container"
    description: "Publishes asynchronous events [AWS SQS/SNS]."