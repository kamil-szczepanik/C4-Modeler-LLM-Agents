# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Web Application/API Gateway container"
parentContainer:
  name: "Web Application/API Gateway"
elements:
  # Components within the parent container's boundary
  - type: "component"
    name: "Envoy Proxy Router"
    technology: "Envoy Proxy"
    description: "Routes incoming traffic to appropriate backend containers via gRPC/REST over TLS."
  - type: "component"
    name: "Security & Authentication Filter"
    technology: "JWT Validation / Envoy Filter"
    description: "Authenticates users via HTTPS with the Identity Provider and enforces OWASP compliance."
  - type: "component"
    name: "Secrets and Credentials Manager"
    technology: "AWS Secrets Manager"
    description: "Retrieves credentials securely for internal services."
relationships:
  - source: "Envoy Proxy Router"
    destination: "Security & Authentication Filter"
    description: "Validates incoming user requests"
  - source: "Security & Authentication Filter"
    destination: "Secrets and Credentials Manager"
    description: "Retrieves required credentials"