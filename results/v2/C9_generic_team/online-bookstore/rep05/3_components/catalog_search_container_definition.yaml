level: component
scope: "Component diagram for the Catalog & Search Container container"
parentContainer:
  name: "Catalog & Search Container"
elements:
  - type: "component"
    name: "Search and Browse API Controller"
    technology: "Web Application/API Gateway, gRPC/REST over TLS"
    description: "Routes search and browse requests from the Web Application/API Gateway."
  - type: "component"
    name: "Search Service Engine"
    technology: "AWS ECS/EKS, Protocol Buffers / gRPC"
    description: "Core logic for product discovery, keyword queries, and catalog browsing."
  - type: "component"
    name: "Query Caching Manager"
    technology: "AWS ElastiCache / Redis, TCP"
    description: "Caches high-frequency queries and exchange rates using in-memory read-through caching."
  - type: "component"
    name: "Product Index Adapter"
    technology: "AWS OpenSearch / Dedicated Data Store, TCP"
    description: "Queries the dedicated product index for sub-100ms keyword queries."
  - type: "component"
    name: "Background Indexing Worker"
    technology: "Background Worker / Job Processing Container, AWS ECS/EKS"
    description: "Handles asynchronous background job processing and catalog synchronization."
relationships:
  - source: "Search and Browse API Controller"
    destination: "Search Service Engine"
    description: "Delegates search and browse requests [gRPC]"
  - source: "Search Service Engine"
    destination: "Query Caching Manager"
    description: "Checks and stores high-frequency queries and exchange rates [TCP]"
  - source: "Search Service Engine"
    destination: "Product Index Adapter"
    description: "Queries product index for search results [TCP]"
  - source: "Background Indexing Worker"
    destination: "Product Index Adapter"
    description: "Updates and maintains the product index [TCP]"