level: component
scope: "Component diagram for the Recommendation Container container"
parentContainer:
  name: "Recommendation Container"
elements:
  - type: "component"
    name: "Recommendation Controller"
    technology: "AWS ECS/EKS, gRPC/REST"
    description: "Handles incoming recommendation requests from the Web Application/API Gateway."
  - type: "component"
    name: "Recommendation Service"
    technology: "Clean Architecture, CQRS"
    description: "Core business logic implementing CQRS pattern for processing recommendations."
  - type: "component"
    name: "Event Handler"
    technology: "AWS SQS/SNS"
    description: "Ingests asynchronous domain events from background workers."
  - type: "component"
    name: "Data Repository"
    technology: "Automatic retries, exponential backoff, jitter"
    description: "Manages read and write operations to the dedicated data store."
  - type: "component"
    name: "Cache Manager"
    technology: "Redis/ElastiCache"
    description: "Pre-computes and caches recommendations to reduce latency."
relationships:
  - source: "Recommendation Controller"
    destination: "Recommendation Service"
    description: "Delegates request processing"
  - source: "Event Handler"
    destination: "Recommendation Service"
    description: "Forwards ingested domain events"
  - source: "Recommendation Service"
    destination: "Data Repository"
    description: "Reads and writes recommendation data"
  - source: "Recommendation Service"
    destination: "Cache Manager"
    description: "Serves pre-computed recommendations"