level: component
scope: "Component diagram for the AWS CloudFront & S3 container"
parentContainer:
  name: "AWS CloudFront & S3"
elements:
  - type: "component"
    name: "AWS CloudFront"
    technology: "AWS CloudFront CDN"
    description: "Content Delivery Network at the edge for global static asset delivery."
  - type: "component"
    name: "Amazon S3 Primary"
    technology: "Amazon S3"
    description: "Primary object storage bucket for static assets and SPAs."
  - type: "component"
    name: "Amazon S3 Replication Bucket"
    technology: "Amazon S3"
    description: "Replicated object storage bucket providing high availability."
  - type: "component"
    name: "AWS WAF"
    technology: "AWS WAF"
    description: "Web Application Firewall integrated at the edge for traffic inspection and filtering."
  - type: "component"
    name: "CloudFront Functions"
    technology: "AWS CloudFront Edge Compute"
    description: "Lightweight edge compute for dynamic configuration and CSP nonces."
  - type: "component"
    name: "CloudWatch Synthetics"
    technology: "AWS CloudWatch"
    description: "Global monitoring canaries."
relationships:
  - source: "AWS WAF"
    destination: "AWS CloudFront"
    description: "Inspects and filters inbound traffic at the edge"
  - source: "AWS CloudFront"
    destination: "Amazon S3 Primary"
    description: "Origin fetch via Origin Access Control (OAC) using SigV4"
  - source: "Amazon S3 Primary"
    destination: "Amazon S3 Replication Bucket"
    description: "Cross-Region Replication (CRR) via HTTPS"