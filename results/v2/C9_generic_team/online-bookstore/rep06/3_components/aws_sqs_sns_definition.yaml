level: component
scope: "Component diagram for the AWS SQS/SNS container"
parentContainer:
  name: "AWS SQS/SNS"
elements:
  - type: "component"
    name: "Amazon SNS Topics"
    technology: "AWS SNS"
    description: "Publishes asynchronous events and broadcasts messages to multiple subscribers."
  - type: "component"
    name: "Amazon SQS Queues"
    technology: "AWS SQS"
    description: "Buffers and manages queues for asynchronous task processing across microservices."
  - type: "component"
    name: "Dead Letter Queues"
    technology: "AWS SQS DLQ"
    description: "Captures and stores failed or poisoned messages for troubleshooting and reprocessing."
relationships:
  - source: "Amazon SNS Topics"
    destination: "Amazon SQS Queues"
    description: "Fans out messages to queues [HTTPS]"
  - source: "Amazon SQS Queues"
    destination: "Dead Letter Queues"
    description: "Forwards failed messages after max retry attempts [HTTPS]"