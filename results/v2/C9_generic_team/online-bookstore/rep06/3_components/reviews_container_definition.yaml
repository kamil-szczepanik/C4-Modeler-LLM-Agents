level: component
scope: "Component diagram for the Reviews Container container"
parentContainer:
  name: "Reviews Container"
elements:
  - type: "component"
    name: "Reviews API Controller"
    technology: "Docker, Amazon ECS/EKS"
    description: "Manages customer ratings, 5-star reviews, and routes review and rating queries."
  - type: "component"
    name: "Compliance Workflow Manager"
    technology: "Docker, Amazon ECS/EKS"
    description: "Triggers GDPR/CCPA data redaction workflows and asynchronous compliance processing."
  - type: "component"
    name: "Caching Manager"
    technology: "Amazon ElastiCache (Redis)"
    description: "Caches aggregated ratings, serves fallbacks, and maintains fast page loads."
  - type: "component"
    name: "Event Publisher"
    technology: "AWS SNS & AWS SQS"
    description: "Publishes and distributes new review events for asynchronous processing."
relationships:
  - source: "Reviews API Controller"
    destination: "Caching Manager"
    description: "Caches and retrieves aggregated ratings [Redis Protocol/TCP]"
  - source: "Reviews API Controller"
    destination: "Event Publisher"
    description: "Publishes new review events [AWS SDK/HTTPS]"
  - source: "Event Publisher"
    destination: "Compliance Workflow Manager"
    description: "Triggers compliance and redaction workflows [AWS Protocol]"