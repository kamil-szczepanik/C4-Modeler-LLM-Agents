level: component
scope: "Component diagram for the Compliance Workers container"
parentContainer:
  name: "Compliance Workers"
elements:
  - type: "component"
    name: "Compliance Request Consumer"
    technology: "Docker / Amazon ECS/EKS"
    description: "Consumes compliance requests asynchronously from Amazon SQS and handles message retry backoff and DLQ routing."
  - type: "component"
    name: "State Machine Orchestrator"
    technology: "AWS Step Functions / Local State Tracking"
    description: "Manages multi-step compliance request state machines (Pending, Processing, Completed, Failed)."
  - type: "component"
    name: "Data Anonymizer and Exporter"
    technology: "Docker / Isolated Database Connection Pool"
    description: "Executes isolated batch data anonymization, exports, and deletions using a bulkhead pattern to protect core performance."
  - type: "component"
    name: "Audit Log Emitter"
    technology: "HTTPS / S3 API"
    description: "Emits immutable compliance audit logs to Amazon S3."
relationships:
  - source: "Compliance Request Consumer"
    destination: "State Machine Orchestrator"
    description: "Triggers state transitions for incoming compliance requests"
  - source: "State Machine Orchestrator"
    destination: "Data Anonymizer and Exporter"
    description: "Orchestrates batch data anonymization and deletions"
  - source: "Data Anonymizer and Exporter"
    destination: "Audit Log Emitter"
    description: "Sends execution results to generate immutable audit logs"