level: component
scope: "Component diagram for the Amazon ElastiCache container"
parentContainer:
  name: "Amazon ElastiCache"
elements:
  - type: "component"
    name: "Session State Manager"
    technology: "Redis In-Memory Data Store"
    description: "Manages user session state and user metadata for fast retrieval across the BFF and API Gateway."
  - type: "component"
    name: "Catalog Cache Manager"
    technology: "Redis In-Memory Data Store utilizing Cache-Aside pattern, LRU eviction, and Lazy Freeing"
    description: "Caches frequently accessed book catalog data to reduce read load on Amazon Aurora/RDS and ensure low-latency responses."
relationships:
  - source: "Session State Manager"
    destination: "Catalog Cache Manager"
    description: "Shares memory resources and caching eviction policies within the ElastiCache cluster."