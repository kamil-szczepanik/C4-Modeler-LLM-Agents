level: component
scope: "Component diagram for the API Gateway & BFF container"
parentContainer:
  name: "API Gateway & BFF"
elements:
  - type: "component"
    name: "Request Router"
    technology: "Node.js / Express"
    description: "Routes incoming storefront requests to appropriate backend microservices."
  - type: "component"
    name: "Request Aggregator"
    technology: "Node.js"
    description: "Aggregates responses from multiple microservices to optimize client payloads."
  - type: "component"
    name: "Rate Limiter & Security Filter"
    technology: "AWS WAF / API Gateway Native"
    description: "Enforces rate limiting and mitigates OWASP Top-10 vulnerabilities at the edge."
  - type: "component"
    name: "Session Manager"
    technology: "Redis Client"
    description: "Interacts with Amazon ElastiCache to query and manage user session states."
relationships:
  - source: "Request Router"
    destination: "Request Aggregator"
    description: "Forwards routed requests for aggregation"
  - source: "Request Router"
    destination: "Session Manager"
    description: "Validates session state"
  - source: "Rate Limiter & Security Filter"
    destination: "Request Router"
    description: "Passes sanitized and validated requests"