level: component
scope: "Component diagram for the Recommendations Container container"
parentContainer:
  name: "Recommendations Container"
elements:
  - type: "component"
    name: "Recommendation API Router"
    technology: "Amazon ECS / REST"
    description: "Routes incoming recommendation requests from the API Gateway and BFF."
  - type: "component"
    name: "Recommendation Scoring Engine"
    technology: "Amazon ECS / Docker"
    description: "Core logic for generating personalized book recommendations."
  - type: "component"
    name: "Background Pre-computation Worker"
    technology: "Amazon ECS Worker"
    description: "Performs periodic scoring updates and processes background tasks."
  - type: "component"
    name: "Cache and Rate Limiter Client"
    technology: "Redis Protocol"
    description: "Interacts with Amazon ElastiCache to read cached scores and enforce rate limits."
  - type: "component"
    name: "Event Ingestion Handler"
    technology: "AWS SNS/SQS"
    description: "Ingests purchase events and GDPR compliance triggers."
relationships:
  - source: "Recommendation API Router"
    destination: "Recommendation Scoring Engine"
    description: "Delegates recommendation generation [HTTPS/REST]"
  - source: "Recommendation Scoring Engine"
    destination: "Cache and Rate Limiter Client"
    description: "Reads cached scores and checks rate limits [TCP/Redis Protocol]"
  - source: "Background Pre-computation Worker"
    destination: "Cache and Rate Limiter Client"
    description: "Updates pre-computed recommendation matrices [TCP/Redis Protocol]"
  - source: "Event Ingestion Handler"
    destination: "Background Pre-computation Worker"
    description: "Passes purchase and compliance events [AMQP/SQS]"