level: component
scope: "Component diagram for the Catalog Container container"
parentContainer:
  name: "Catalog Container"
elements:
  - type: "component"
    name: "Search Module"
    technology: "Java / Internal Package"
    description: "Manages keyword searches and retrieval of catalog items."
  - type: "component"
    name: "Inventory Module"
    technology: "Java / Internal Package"
    description: "Manages inventory metadata and stock levels."
  - type: "component"
    name: "Metadata Package"
    technology: "Java / Internal Package"
    description: "Handles book listings and associated metadata."
relationships:
  - source: "Search Module"
    destination: "Amazon ElastiCache (Redis)"
    description: "Fetches and caches search results and exchange rates via Redis Protocol"
  - source: "Search Module"
    destination: "Amazon Aurora/RDS"
    description: "Queries primary database and Read Replicas via SQL/TCP"
  - source: "Inventory Module"
    destination: "Amazon Aurora/RDS"
    description: "Queries primary database and Read Replicas via SQL/TCP"
  - source: "Metadata Package"
    destination: "Amazon Aurora/RDS"
    description: "Queries primary database and Read Replicas via SQL/TCP"
  - source: "Metadata Package"
    destination: "Amazon ElastiCache (Redis)"
    description: "Fetches and caches search results and exchange rates via Redis Protocol"