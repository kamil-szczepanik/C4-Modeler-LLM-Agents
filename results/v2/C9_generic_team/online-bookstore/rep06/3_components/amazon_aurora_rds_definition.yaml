level: component
scope: "Component diagram for the Amazon Aurora/RDS container"
parentContainer:
  name: "Amazon Aurora/RDS"
elements:
  - type: "component"
    name: "Amazon Aurora Writer Instance"
    technology: "Amazon Aurora PostgreSQL"
    description: "Handles all transactional write operations including checkout and orders."
  - type: "component"
    name: "Amazon Aurora Read Replicas"
    technology: "Amazon Aurora PostgreSQL"
    description: "Scales read-heavy operations such as catalog browsing, reviews, and recommendations."
  - type: "component"
    name: "AWS RDS Proxy"
    technology: "AWS RDS Proxy"
    description: "Manages and pools database connections from ECS/EKS containers to prevent connection exhaustion."
  - type: "component"
    name: "Compliance Workers"
    technology: "PostgreSQL pgaudit Extension / Terraform"
    description: "Executes GDPR/CCPA data anonymization, logical soft deletes, partitioning, and cryptographic shredding."
  - type: "component"
    name: "Amazon CloudWatch"
    technology: "Amazon CloudWatch"
    description: "Monitors database telemetry, connection pool saturation, replication lag, and publishes audit logs."
relationships:
  - source: "AWS RDS Proxy"
    destination: "Amazon Aurora Writer Instance"
    description: "Forwards transactions and queries via [PostgreSQL Wire Protocol]."
  - source: "AWS RDS Proxy"
    destination: "Amazon Aurora Read Replicas"
    description: "Forwards queries via [PostgreSQL Wire Protocol]."
  - source: "Compliance Workers"
    destination: "Amazon Aurora Writer Instance"
    description: "Executes data anonymization, partitioning, and cryptographic shredding via [Database Protocol]."
  - source: "Amazon Aurora Writer Instance"
    destination: "Amazon CloudWatch"
    description: "Publishes audit logs, slow-query metrics, and telemetry via [AWS API]."
  - source: "Amazon Aurora Read Replicas"
    destination: "Amazon CloudWatch"
    description: "Publishes telemetry and metrics via [AWS API]."