level: component
scope: "Component diagram for the Checkout Container container"
parentContainer:
  name: "Checkout Container"
elements:
  - type: "component"
    name: "Cart/Order State Manager"
    technology: "Domain Model & Application Service"
    description: "Manages cart processing and core domain models"
  - type: "component"
    name: "Payment Gateway Adapter"
    technology: "Anti-Corruption Layer (ACL) / HTTPS"
    description: "Integrates with external payment providers via an Anti-Corruption Layer (ACL)"
  - type: "component"
    name: "Fulfillment Integrator"
    technology: "Integration Service / HTTPS"
    description: "Interfaces with third-party shipping APIs for order delivery"
  - type: "component"
    name: "Saga Orchestrator"
    technology: "Workflow Engine"
    description: "Manages distributed transactions and compensation workflows"
  - type: "component"
    name: "Outbox Publisher & DLQ"
    technology: "AWS SQS/SNS & Event Publisher"
    description: "Handles reliable event publishing using AWS SQS/SNS and dead-letter queues"
  - type: "component"
    name: "API Gateway & BFF"
    technology: "HTTPS/REST"
    description: "External system routing incoming checkout and cart requests"
  - type: "component"
    name: "Payment Gateways"
    technology: "HTTPS/REST with Idempotency Keys"
    description: "External payment provider"
  - type: "component"
    name: "Third-Party Shipping APIs"
    technology: "HTTPS/REST"
    description: "External shipping provider"
  - type: "component"
    name: "Amazon Aurora/RDS"
    technology: "TCP/PostgreSQL Protocol"
    description: "Relational database for ACID compliance during order processing and event persistence"
  - type: "component"
    name: "AWS SQS/SNS"
    technology: "AWS SDK/HTTPS"
    description: "Asynchronous messaging infrastructure for outbox event delivery"
relationships:
  - source: "API Gateway & BFF"
    destination: "Cart/Order State Manager"
    description: "Routes incoming checkout and cart requests via [HTTPS/REST]"
  - source: "Saga Orchestrator"
    destination: "Payment Gateway Adapter"
    description: "Coordinates payment transactions"
  - source: "Saga Orchestrator"
    destination: "Fulfillment Integrator"
    description: "Coordinates order fulfillment"
  - source: "Payment Gateway Adapter"
    destination: "Payment Gateways"
    description: "Processes secure payments using [HTTPS/REST] with Idempotency Keys"
  - source: "Fulfillment Integrator"
    destination: "Third-Party Shipping APIs"
    description: "Coordinates order fulfillment via [HTTPS/REST]"
  - source: "Cart/Order State Manager"
    destination: "Amazon Aurora/RDS"
    description: "Persists transactional state via [TCP/PostgreSQL Protocol]"
  - source: "Outbox Publisher & DLQ"
    destination: "Amazon Aurora/RDS"
    description: "Persists outbox events via [TCP/PostgreSQL Protocol]"
  - source: "Outbox Publisher & DLQ"
    destination: "AWS SQS/SNS"
    description: "Publishes asynchronous order and fulfillment events via [AWS SDK/HTTPS]"