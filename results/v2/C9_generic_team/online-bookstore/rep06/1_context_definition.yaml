level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore System"
  description: "Core retail platform handling catalog, cart, checkout, reviews, and recommendations for physical and electronic books."
elements:
  - type: "person"
    name: "Customers"
    description: "End-users accessing the web and mobile interfaces to browse, purchase, review, and receive recommendations."
  - type: "externalSystem"
    name: "Payment Gateways"
    description: "External processors for secure financial transactions."
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "External logistics providers for physical book fulfillment."
  - type: "externalSystem"
    name: "Forex/Currency Rate API"
    description: "External service providing real-time exchange rates for USD, EUR, and GBP."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External email and SMS providers for alerts and receipts."
relationships:
  - source: "Customers"
    destination: "Online Bookstore System"
    description: "Catalog browsing, cart management, and secure checkout"
    technology: "HTTPS via TLS 1.3"
  - source: "Online Bookstore System"
    destination: "Payment Gateways"
    description: "Processing multi-currency transactions"
    technology: "REST/JSON over TLS 1.3"
  - source: "Online Bookstore System"
    destination: "Third-Party Shipping APIs"
    description: "Order fulfillment and tracking"
    technology: "REST/JSON over TLS 1.3"
  - source: "Online Bookstore System"
    destination: "Forex/Currency Rate API"
    description: "Real-time currency conversion"
    technology: "REST/JSON over TLS 1.3"
  - source: "Online Bookstore System"
    destination: "Notification Service"
    description: "Order confirmations and password resets"
    technology: "Asynchronous messaging and API calls"