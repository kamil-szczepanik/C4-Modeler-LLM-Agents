level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Customers"
    description: "End-users accessing the web and mobile interfaces to browse, purchase, review, and receive recommendations."
  - type: "externalSystem"
    name: "Payment Gateways"
    description: "External processors for secure financial transactions."
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "External logistics providers for physical book fulfillment."
  - type: "externalSystem"
    name: "Forex/Currency Rate API"
    description: "External service providing real-time exchange rates for USD, EUR, and GBP."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External email and SMS providers for alerts and receipts."
  - type: "container"
    name: "AWS CloudFront & S3"
    technology: "AWS CloudFront, Amazon S3"
    description: "CDN and storage for static web and mobile assets."
  - type: "container"
    name: "API Gateway & BFF"
    technology: "AWS API Gateway"
    description: "Handles client routing, rate limiting, and request aggregation."
  - type: "container"
    name: "Catalog Container"
    technology: "Docker, Amazon ECS/EKS"
    description: "Manages book listings, search, and inventory."
  - type: "container"
    name: "Checkout Container"
    technology: "Docker, Amazon ECS/EKS"
    description: "Manages cart processing, payments, and order fulfillment integration."
  - type: "container"
    name: "Recommendations Container"
    technology: "Docker, Amazon ECS/EKS"
    description: "Provides personalized book recommendations to users."
  - type: "container"
    name: "Reviews Container"
    technology: "Docker, Amazon ECS/EKS"
    description: "Handles user reviews and ratings for books."
  - type: "container"
    name: "Compliance Workers"
    technology: "Docker, Amazon ECS/EKS"
    description: "Handles GDPR/CCPA data anonymization and compliance tasks."
  - type: "container"
    name: "Amazon Aurora/RDS"
    technology: "Amazon Aurora/RDS"
    description: "Database-per-service storage for core containers."
  - type: "container"
    name: "Amazon ElastiCache"
    technology: "Amazon ElastiCache (Redis)"
    description: "Caching and distributed session management."
  - type: "container"
    name: "AWS SQS/SNS"
    technology: "AWS SQS, AWS SNS, DLQ"
    description: "Decoupled asynchronous event-driven messaging backbone."
relationships:
  - source: "Customers"
    destination: "AWS CloudFront & S3"
    description: "Fetch static assets"
    technology: "HTTPS"
  - source: "Customers"
    destination: "API Gateway & BFF"
    description: "Interact with backend services via storefront"
    technology: "HTTPS/REST"
  - source: "API Gateway & BFF"
    destination: "Amazon ElastiCache"
    description: "Queries for session state and catalog caching"
    technology: "Redis Protocol"
  - source: "API Gateway & BFF"
    destination: "Catalog Container"
    description: "Routes catalog requests"
    technology: "HTTPS/REST"
  - source: "API Gateway & BFF"
    destination: "Checkout Container"
    description: "Routes checkout requests"
    technology: "HTTPS/REST"
  - source: "API Gateway & BFF"
    destination: "Recommendations Container"
    description: "Routes recommendation requests"
    technology: "HTTPS/REST"
  - source: "API Gateway & BFF"
    destination: "Reviews Container"
    description: "Routes review requests"
    technology: "HTTPS/REST"
  - source: "Core Containers"
    destination: "AWS SQS/SNS"
    description: "Communicates asynchronously using events"
    technology: "AMQP/JSON"
  - source: "Checkout Container"
    destination: "Payment Gateways"
    description: "Integrates for secure payment processing"
    technology: "HTTPS/REST"
  - source: "Checkout Container"
    destination: "Third-Party Shipping APIs"
    description: "Integrates for fulfillment"
    technology: "HTTPS/REST"
  - source: "Compliance Workers"
    destination: "Amazon Aurora/RDS"
    description: "Interacts for GDPR/CCPA data anonymization"
    technology: "Database Protocol"