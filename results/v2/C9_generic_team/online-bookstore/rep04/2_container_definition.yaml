level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Customers"
    description: "End-users browsing catalogues, purchasing books, and leaving reviews."
  - type: "person"
    name: "Administrators/Content Moderators"
    description: "Internal operators managing catalogue data and moderating reviews."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system for secure checkout and payment processing."
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "External fulfillment and shipping services."
  - type: "externalSystem"
    name: "Identity/Consent Management"
    description: "External provider for GDPR and CCPA compliance tracking."
  - type: "externalSystem"
    name: "Currency Exchange"
    description: "External provider for dynamic multi-currency rates."
  - type: "externalSystem"
    name: "Monitoring Provider"
    description: "SaaS provider for APM and log aggregation."
  - type: "container"
    name: "Single Page Application / Server-Side Rendered Frontend"
    technology: "AWS S3 / CloudFront"
    description: "Edge/Client-Side container delivering the user interface."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway"
    description: "Entry point handling TLS termination, rate limiting, and JWT validation."
  - type: "container"
    name: "Catalog & Search"
    technology: "Docker / AWS ECS/EKS, OpenSearch"
    description: "Backend container for book catalog and search capabilities."
  - type: "container"
    name: "Checkout & Order"
    technology: "Docker / AWS ECS/EKS, PostgreSQL"
    description: "Backend container for processing checkout and order transactions."
  - type: "container"
    name: "Recommendations"
    technology: "Docker / AWS ECS/EKS"
    description: "Backend container providing personalized book recommendations."
  - type: "container"
    name: "User & Reviews"
    technology: "Docker / AWS ECS/EKS"
    description: "Backend container managing user accounts and book reviews."
  - type: "container"
    name: "Async Event Bus"
    technology: "AWS EventBridge / Kafka"
    description: "Infrastructure container for asynchronous pub/sub messaging."
  - type: "container"
    name: "Configuration & Secrets Management"
    technology: "AWS Secrets Manager"
    description: "Infrastructure container managing configuration and credentials."
  - type: "container"
    name: "Observability/Telemetry"
    technology: "OpenTelemetry sidecars"
    description: "Infrastructure containers for distributed tracing and monitoring."
  - type: "container"
    name: "PostgreSQL Database"
    technology: "PostgreSQL"
    description: "Data tier for ACID-compliant checkout transactions."
  - type: "container"
    name: "OpenSearch Database"
    technology: "OpenSearch"
    description: "Data tier for catalog indexing and search."
  - type: "container"
    name: "Redis Cache"
    technology: "Redis"
    description: "Data tier for cart and currency session caching."
relationships:
  - source: "Customers"
    destination: "Single Page Application / Server-Side Rendered Frontend"
    description: "Accesses the platform UI"
    technology: "HTTPS / TLS"
  - source: "Administrators/Content Moderators"
    destination: "Single Page Application / Server-Side Rendered Frontend"
    description: "Accesses administrative interfaces"
    technology: "HTTPS / TLS"
  - source: "Single Page Application / Server-Side Rendered Frontend"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS / TLS"
  - source: "API Gateway"
    destination: "Catalog & Search"
    description: "Routes catalog requests"
    technology: "Internal TLS / REST / gRPC"
  - source: "API Gateway"
    destination: "Checkout & Order"
    description: "Routes checkout requests"
    technology: "Internal TLS / REST / gRPC"
  - source: "API Gateway"
    destination: "Recommendations"
    description: "Routes recommendation requests"
    technology: "Internal TLS / REST / gRPC"
  - source: "API Gateway"
    destination: "User & Reviews"
    description: "Routes user and review requests"
    technology: "Internal TLS / REST / gRPC"
  - source: "Catalog & Search"
    destination: "Async Event Bus"
    description: "Publishes and consumes catalog events"
    technology: "Asynchronous pub/sub messaging"
  - source: "Checkout & Order"
    destination: "Async Event Bus"
    description: "Publishes and consumes order events"
    technology: "Asynchronous pub/sub messaging"
  - source: "Recommendations"
    destination: "Async Event Bus"
    description: "Publishes and consumes recommendation events"
    technology: "Asynchronous pub/sub messaging"
  - source: "User & Reviews"
    destination: "Async Event Bus"
    description: "Publishes and consumes user and review events"
    technology: "Asynchronous pub/sub messaging"
  - source: "Checkout & Order"
    destination: "PostgreSQL Database"
    description: "Reads and writes transactional order data"
    technology: "Native database protocols (SQL drivers)"
  - source: "Catalog & Search"
    destination: "OpenSearch Database"
    description: "Indexes and searches catalog data"
    technology: "Native database protocols (NoSQL drivers)"
  - source: "Checkout & Order"
    destination: "Redis Cache"
    description: "Caches cart and currency data"
    technology: "Redis drivers"
  - source: "Catalog & Search"
    destination: "Payment Gateway"
    description: "Interacts with external payment services"
    technology: "HTTPS / REST APIs with centralized secrets"
  - source: "Checkout & Order"
    destination: "Payment Gateway"
    description: "Processes payments"
    technology: "HTTPS / REST APIs with centralized secrets"
  - source: "Checkout & Order"
    destination: "Third-Party Shipping APIs"
    description: "Sends fulfillment requests"
    technology: "HTTPS / REST APIs with centralized secrets"
  - source: "User & Reviews"
    destination: "Identity/Consent Management"
    description: "Validates consent and identity compliance"
    technology: "HTTPS / REST APIs with centralized secrets"
  - source: "Checkout & Order"
    destination: "Currency Exchange"
    description: "Fetches dynamic currency exchange rates"
    technology: "HTTPS / REST APIs with centralized secrets"
  - source: "Observability/Telemetry"
    destination: "Monitoring Provider"
    description: "Exports telemetry and trace data"
    technology: "HTTPS / REST APIs with centralized secrets"