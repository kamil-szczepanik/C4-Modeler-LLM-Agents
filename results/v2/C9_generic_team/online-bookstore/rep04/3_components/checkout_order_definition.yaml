level: component
scope: "Component diagram for the Checkout & Order container"
parentContainer:
  name: "Checkout & Order"
elements:
  - type: "component"
    name: "Checkout API Controller"
    technology: "Docker / AWS ECS/EKS, REST / gRPC"
    description: "Routes checkout requests and handles incoming API traffic from the API Gateway."
  - type: "component"
    name: "Order Processing Service"
    technology: "Docker / AWS ECS/EKS"
    description: "Orchestrates core checkout workflows, transactional messaging, and outbox patterns."
  - type: "component"
    name: "Payment Integration Service"
    technology: "HTTPS / REST APIs"
    description: "Processes payments securely interacting with external payment gateway providers."
  - type: "component"
    name: "Shipping Integration Service"
    technology: "HTTPS / REST APIs"
    description: "Sends fulfillment requests to third-party shipping APIs."
relationships:
  - source: "Checkout API Controller"
    destination: "Order Processing Service"
    description: "Delegates business logic and transaction processing [Internal TLS / REST / gRPC]"
  - source: "Order Processing Service"
    destination: "Payment Integration Service"
    description: "Initiates payment transactions [HTTPS / REST]"
  - source: "Order Processing Service"
    destination: "Shipping Integration Service"
    description: "Requests order fulfillment [HTTPS / REST]"