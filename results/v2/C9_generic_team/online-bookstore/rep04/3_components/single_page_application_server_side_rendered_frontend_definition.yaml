level: component
scope: "Component diagram for the Single Page Application / Server-Side Rendered Frontend container"
parentContainer:
  name: "Single Page Application / Server-Side Rendered Frontend"
elements:
  - type: "component"
    name: "Router Component"
    technology: "JavaScript / TypeScript"
    description: "Handles client-side routing and page transitions within the Single Page Application."
  - type: "component"
    name: "UI View Components"
    technology: "React / Vue.js / HTML5"
    description: "Renders the user interface for browsing catalogs, managing user profiles, and viewing recommendations."
  - type: "component"
    name: "API Client Component"
    technology: "Fetch API / Axios"
    description: "Manages secure HTTP/HTTPS communication, JWT/OAuth tokens, and requests sent to the API Gateway."
relationships:
  - source: "Router Component"
    destination: "UI View Components"
    description: "Loads and displays"
  - source: "UI View Components"
    destination: "API Client Component"
    description: "Triggers API requests via"
  - source: "API Client Component"
    destination: "API Gateway"
    description: "Sends HTTPS API requests using JWT/OAuth"