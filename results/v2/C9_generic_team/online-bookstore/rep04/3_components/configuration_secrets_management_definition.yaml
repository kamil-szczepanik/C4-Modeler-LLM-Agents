level: component
scope: "Component diagram for the Configuration & Secrets Management container"
parentContainer:
  name: "Configuration & Secrets Management"
elements:
  - type: "component"
    name: "Provider Interface Adapter"
    technology: "Adapter Pattern"
    description: "Internal interface that microservices utilize to securely retrieve configuration and secrets."
  - type: "component"
    name: "Parameter Store Integration"
    technology: "AWS Systems Manager Parameter Store"
    description: "Manages hierarchical, non-sensitive operational configurations with standard throughput."
  - type: "component"
    name: "Secrets Manager Integration"
    technology: "AWS Secrets Manager & AWS Lambda"
    description: "Handles sensitive credentials with automatic rotation driven by AWS Lambda."
  - type: "component"
    name: "Schema Validation Engine"
    technology: "Pydantic / JSON Schema"
    description: "Enforces strict startup schema validation with a fail-fast mechanism."
relationships:
  - source: "Provider Interface Adapter"
    destination: "Parameter Store Integration"
    description: "Retrieves operational configurations"
  - source: "Provider Interface Adapter"
    destination: "Secrets Manager Integration"
    description: "Retrieves sensitive credentials"
  - source: "Provider Interface Adapter"
    destination: "Schema Validation Engine"
    description: "Validates retrieved configurations and secrets on startup"