level: component
scope: "Component diagram for the Observability/Telemetry container"
parentContainer:
  name: "Observability/Telemetry"
elements:
  - type: "component"
    name: "OpenTelemetry Sidecars & Collectors"
    technology: "OpenTelemetry (OTel), In-memory bounded queues with drop policies, W3C Trace Context"
    description: "Infrastructure containers deployed alongside microservices for telemetry capture, PII scrubbing, and non-blocking asynchronous export."
  - type: "component"
    name: "Telemetry Configuration Management Plane"
    technology: "AWS Systems Manager Parameter Store, AWS SDK / HTTPS"
    description: "Centralized repository for fetching dynamic sampling and configuration rules."
  - type: "component"
    name: "Monitoring and Observability Provider"
    technology: "HTTPS / REST APIs"
    description: "External destination for exported traces, metrics, and logs."
  - type: "component"
    name: "CI/CD Telemetry Validation"
    technology: "Automated pipelines with mock collectors and schema validation"
    description: "Automated pipelines that validate telemetry schemas and configuration before deployment."
relationships:
  - source: "OpenTelemetry Sidecars & Collectors"
    destination: "Monitoring and Observability Provider"
    description: "Export telemetry data [HTTPS / REST APIs]"
  - source: "OpenTelemetry Sidecars & Collectors"
    destination: "Telemetry Configuration Management Plane"
    description: "Fetch dynamic sampling and configuration rules [AWS SDK / HTTPS]"