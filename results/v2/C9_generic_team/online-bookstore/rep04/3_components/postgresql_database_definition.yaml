level: component
scope: "Component diagram for the PostgreSQL Database container"
parentContainer:
  name: "PostgreSQL Database"
elements:
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Manages transactional SQL connections and connection pooling layer for 1 million MAU."
  - type: "component"
    name: "Flyway / Liquibase"
    technology: "Flyway / Liquibase"
    description: "Handles deterministic, version-controlled schema migrations across multi-region AWS environments."
  - type: "component"
    name: "AWS KMS"
    technology: "AWS KMS"
    description: "Provides encryption at rest for database backups."
  - type: "component"
    name: "Regional Read-Replicas"
    technology: "PostgreSQL streaming replication protocol"
    description: "Offloads read-heavy queries through asynchronous data replication."
  - type: "component"
    name: "OpenTelemetry"
    technology: "OpenTelemetry / PostgreSQL stats exporters"
    description: "Scrapes database health, metrics, slow queries, and health status."
relationships:
  - source: "Checkout & Order Container"
    destination: "PgBouncer"
    description: "Manages transactional SQL connections [Native database protocols (TCP/IP)]"
  - source: "Application Microservices"
    destination: "PgBouncer"
    description: "Executes least-privilege, parameterized queries [SQL drivers]"
  - source: "PostgreSQL Database"
    destination: "Regional Read-Replicas"
    description: "Asynchronous data replication [PostgreSQL streaming replication protocol]"
  - source: "OpenTelemetry"
    destination: "PostgreSQL Database"
    description: "Scrapes performance metrics, slow queries, and health status [OpenTelemetry protocol (OTLP) / PostgreSQL stats exporters]"