level: component
scope: "Component diagram for the Recommendations container"
parentContainer:
  name: "Recommendations"
elements:
  - type: "component"
    name: "Recommendation Controller"
    technology: "REST / gRPC"
    description: "Handles incoming recommendation requests routed from the API Gateway via Internal TLS."
  - type: "component"
    name: "Recommendation Service"
    technology: "Business Logic / Microservice Component"
    description: "Core logic for processing and generating book recommendations."
  - type: "component"
    name: "Event Publisher/Consumer"
    technology: "Async Event Bus (AWS EventBridge / Kafka)"
    description: "Publishes and consumes recommendation events via asynchronous pub/sub messaging."
  - type: "component"
    name: "Cache Manager"
    technology: "Redis Client"
    description: "Fetches pre-computed recommendation payloads and tracks idempotent event processing via low-latency key-value lookups."
  - type: "component"
    name: "Repository Adapter"
    technology: "Repository Pattern Abstraction"
    description: "Queries backup data stores when cache misses occur."
relationships:
  - source: "Recommendation Controller"
    destination: "Recommendation Service"
    description: "Delegates incoming recommendation requests"
  - source: "Recommendation Service"
    destination: "Event Publisher/Consumer"
    description: "Publishes and consumes recommendation events"
  - source: "Recommendation Service"
    destination: "Cache Manager"
    description: "Fetches pre-computed payloads and checks idempotency"
  - source: "Cache Manager"
    destination: "Repository Adapter"
    description: "Queries fallback data stores on cache misses via Repository pattern"