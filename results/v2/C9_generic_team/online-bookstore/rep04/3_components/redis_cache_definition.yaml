level: component
scope: "Component diagram for the Redis Cache container"
parentContainer:
  name: "Redis Cache"
elements:
  - type: "component"
    name: "Session Management Component"
    technology: "AWS ElastiCache Redis / Redis Data Structures"
    description: "Handles high-throughput cart and currency session operations for customers."
  - type: "component"
    name: "Caching Engine Component"
    technology: "Redis In-Memory Data Store"
    description: "Provides multi-AZ replication, automatic failover, and fast data retrieval for transient session data."
relationships:
  - source: "Session Management Component"
    destination: "Caching Engine Component"
    description: "Reads and writes session and cart data"