level: component
scope: "Component diagram for the Async Event Bus container"
parentContainer:
  name: "Async Event Bus"
elements:
  - type: "component"
    name: "Event Publisher"
    technology: "AWS EventBridge / Kafka Producer"
    description: "Publishes domain events generated by core services to the event bus with JSON Schema validation."
  - type: "component"
    name: "Event Consumer"
    technology: "Kafka Consumer / EventBridge Rule Target"
    description: "Consumes asynchronous domain events and routes them to respective downstream services."
  - type: "component"
    name: "Dead Letter Queue Handler"
    technology: "AWS SQS DLQ"
    description: "Captures and stores failed or unprocessable event messages for later analysis and retry."
relationships:
  - source: "Event Publisher"
    destination: "Event Consumer"
    description: "Transmits domain events asynchronously [Pub/Sub]"
  - source: "Event Consumer"
    destination: "Dead Letter Queue Handler"
    description: "Routes failed message processing attempts"