# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "A multi-region e-commerce platform built on AWS to sell physical and electronic books with integrated reviews and recommendations, providing a scalable, secure, and globally available shopping experience supporting high concurrency and multi-currency transactions."
elements:
  - type: "person"
    name: "Customers"
    description: "End-users browsing catalogues, purchasing books, and leaving reviews."
  - type: "person"
    name: "Administrators/Content Moderators"
    description: "Internal operators managing catalogue data and moderating reviews."
  - type: "externalSystem"
    name: "Payment Gateway Provider"
    description: "Stripe/PayPal for secure checkout and PCI-DSS compliance."
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "External fulfillment services."
  - type: "externalSystem"
    name: "Identity/Consent Management Provider"
    description: "GDPR & CCPA compliance tracking."
  - type: "externalSystem"
    name: "Notification Services"
    description: "Email/SMS for alerts and password resets."
  - type: "externalSystem"
    name: "Currency Exchange Rate Provider"
    description: "Dynamic rates for USD, EUR, and GBP."
  - type: "externalSystem"
    name: "Monitoring and Observability Provider"
    description: "APM and log aggregation SaaS."
relationships:
  - source: "Customers"
    destination: "Online Bookstore"
    description: "Interacts with the platform to browse catalogues, purchase books, and leave reviews"
    technology: "HTTPS, REST/GraphQL"
  - source: "Administrators/Content Moderators"
    destination: "Online Bookstore"
    description: "Manages the platform, catalogue data, and moderates reviews via secure administrative interfaces"
    technology: "HTTPS"
  - source: "Online Bookstore"
    destination: "Payment Gateway Provider"
    description: "Integrates for secure checkout and payment processing"
    technology: "HTTPS/TLS 1.3"
  - source: "Online Bookstore"
    destination: "Third-Party Shipping APIs"
    description: "Connects for fulfillment tracking"
    technology: "HTTPS"
  - source: "Online Bookstore"
    destination: "Currency Exchange Rate Provider"
    description: "Synchronizes multi-currency rates"
    technology: "REST over HTTPS"