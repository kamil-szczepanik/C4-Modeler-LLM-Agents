level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Customers"
    description: "End-users browsing, purchasing, and reviewing books."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Handles secure checkout transactions."
  - type: "externalSystem"
    name: "Shipping Providers"
    description: "Manages logistics and fulfillment."
  - type: "externalSystem"
    name: "Identity/Compliance"
    description: "Provides identity and compliance support."
  - type: "externalSystem"
    name: "FX Provider"
    description: "Provides multi-currency conversion."
  - type: "externalSystem"
    name: "Tax Service"
    description: "Calculates real-time taxes."
  - type: "externalSystem"
    name: "Anti-Fraud"
    description: "Performs fraud and risk assessments."
  - type: "externalSystem"
    name: "Book Distributors"
    description: "Manages real-time stock synchronization and inventory."
  - type: "externalSystem"
    name: "Observability Provider"
    description: "Centralized SIEM and audit logging."
  - type: "externalSystem"
    name: "CI/CD"
    description: "Handles deployment and configuration management pipelines."
  - type: "container"
    name: "API Gateway Container"
    technology: "AWS API Gateway / Reverse Proxy"
    description: "Handles rate limiting, TLS termination, and request routing."
  - type: "container"
    name: "Frontend Container"
    technology: "SPA/SSR backed by CDN"
    description: "Delivers user interfaces via CDN."
  - type: "container"
    name: "Core Domain Containers"
    technology: "Microservices / REST / gRPC"
    description: "Includes Catalogue, Cart/Checkout, Recommendations, and Reviews services."
  - type: "container"
    name: "Integration / Anti-Corruption Layer (ACL) Container"
    technology: "Microservice / REST"
    description: "Encapsulates third-party APIs (FX, Tax, Shipping)."
  - type: "container"
    name: "Async Worker / Event Broker Container"
    technology: "Event broker utilizing CloudEvents"
    description: "Manages asynchronous messaging and background processing."
  - type: "container"
    name: "Caching/Session Container"
    technology: "Redis"
    description: "Handles high-frequency reads and user sessions."
  - type: "container"
    name: "Background Job Scheduler Container"
    technology: "Scheduler / Cron worker"
    description: "Executes periodic batch tasks."
  - type: "container"
    name: "Observability Sidecar & Config Agents"
    technology: "AWS Systems Manager Parameter Store / Secrets Manager agents"
    description: "Standardize telemetry and runtime secret injection."
relationships:
  - source: "Customers"
    destination: "Frontend Container"
    description: "Browsing, purchasing, and reviewing books"
    technology: "HTTPS over TLS"
  - source: "Frontend Container"
    destination: "API Gateway Container"
    description: "API requests and routing"
    technology: "HTTPS / REST"
  - source: "API Gateway Container"
    destination: "Core Domain Containers"
    description: "Routes requests to microservices"
    technology: "Internal REST / gRPC"
  - source: "Core Domain Containers"
    destination: "Caching/Session Container"
    description: "Reads and writes high-frequency data and sessions"
    technology: "In-memory protocol (Redis)"
  - source: "Core Domain Containers"
    destination: "Async Worker / Event Broker Container"
    description: "Publishes and subscribes to asynchronous events"
    technology: "Publish/Subscribe messaging (CloudEvents)"
  - source: "Core Domain Containers"
    destination: "Integration / Anti-Corruption Layer (ACL) Container"
    description: "Requests third-party integrations"
    technology: "Internal REST"
  - source: "Integration / Anti-Corruption Layer (ACL) Container"
    destination: "Shipping Providers"
    description: "Manages logistics and fulfillment"
    technology: "HTTPS APIs"
  - source: "Integration / Anti-Corruption Layer (ACL) Container"
    destination: "FX Provider"
    description: "Retrieves currency exchange rates"
    technology: "HTTPS APIs"
  - source: "Integration / Anti-Corruption Layer (ACL) Container"
    destination: "Tax Service"
    description: "Calculates taxes"
    technology: "HTTPS APIs"