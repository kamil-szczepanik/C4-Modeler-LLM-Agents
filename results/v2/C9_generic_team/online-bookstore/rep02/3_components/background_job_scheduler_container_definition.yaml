level: component
scope: "Component diagram for the Background Job Scheduler Container container"
parentContainer:
  name: "Background Job Scheduler Container"
elements:
  - type: "component"
    name: "Scheduler Worker"
    technology: "Cron worker / Scheduler"
    description: "Manages asynchronous batch tasks securely and reliably, coordinating with external systems and internal caching."
  - type: "component"
    name: "Distributed Lock Manager"
    technology: "Redis"
    description: "Provides distributed locking and session management to prevent duplicate job execution."
  - type: "component"
    name: "Job Definition Provider"
    technology: "AWS Systems Manager Parameter Store"
    description: "Stores externalized job definitions and dynamic cron expressions."
relationships:
  - source: "Scheduler Worker"
    destination: "Distributed Lock Manager"
    description: "Acquires distributed locks via TCP to prevent duplicate job execution"
  - source: "Scheduler Worker"
    destination: "Job Definition Provider"
    description: "Retrieves externalized job definitions and dynamic cron expressions"