level: component
scope: "Component diagram for the Integration / Anti-Corruption Layer (ACL) Container container"
parentContainer:
  name: "Integration / Anti-Corruption Layer (ACL) Container"
elements:
  - type: "component"
    name: "Shipping Integration Adapter"
    technology: "Java / Resilience4j"
    description: "Manages fulfillment and communication with external Shipping Providers with circuit breakers and bulkhead isolation."
  - type: "component"
    name: "FX Rate Adapter"
    technology: "Java / Resilience4j"
    description: "Handles requests to the Foreign Exchange (FX) Rate Provider with token-bucket rate limiting."
  - type: "component"
    name: "Tax Calculation Adapter"
    technology: "Java / Resilience4j"
    description: "Communicates with the Tax Calculation Service to compute accurate tax rates."
relationships:
  - source: "Shipping Integration Adapter"
    destination: "Shipping Providers"
    description: "Manages fulfillment [HTTPS APIs with Resilience4j circuit breakers]"
  - source: "FX Rate Adapter"
    destination: "FX Rate Provider"
    description: "Fetches exchange rates [HTTPS APIs with token-bucket rate limiting]"
  - source: "Tax Calculation Adapter"
    destination: "Tax Calculation Service"
    description: "Calculates taxes [HTTPS APIs with bulkhead isolation]"