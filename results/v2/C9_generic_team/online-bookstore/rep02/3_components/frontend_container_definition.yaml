level: component
scope: "Component diagram for the Frontend Container container"
parentContainer:
  name: "Frontend Container"
elements:
  - type: "component"
    name: "Single Page Application (SPA)"
    technology: "TypeScript / Client-Side Rendering"
    description: "Handles user interactions, browsing, purchasing, and reviewing books on the client side with end-to-end type safety."
  - type: "component"
    name: "Server-Side Rendering (SSR) Engine"
    technology: "TypeScript / Node.js"
    description: "Renders initial pages on the server to ensure fast load times and optimized Core Web Vitals tracking."
  - type: "component"
    name: "Content Delivery Network (CDN) Integration"
    technology: "CDN Edge Caching / CSP / SRI"
    description: "Delivers static and dynamic assets securely with OWASP Top-10 mitigation and aggressive edge caching."
relationships:
  - source: "Single Page Application (SPA)"
    destination: "Server-Side Rendering (SSR) Engine"
    description: "Hydrates and exchanges application state [HTTPS]"
  - source: "Server-Side Rendering (SSR) Engine"
    destination: "Content Delivery Network (CDN) Integration"
    description: "Serves cached assets and pages [HTTPS]"