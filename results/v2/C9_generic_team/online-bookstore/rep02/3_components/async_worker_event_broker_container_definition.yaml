level: component
scope: "Component diagram for the Async Worker / Event Broker Container container"
parentContainer:
  name: "Async Worker / Event Broker Container"
elements:
  - type: "component"
    name: "Event Publisher"
    technology: "AWS MSK / Amazon EventBridge, CloudEvents, W3C Trace Context"
    description: "Publishes standardized event messages using CloudEvents and W3C Trace Context headers to the event broker."
  - type: "component"
    name: "Payload Offloader"
    technology: "Amazon S3"
    description: "Handles out-of-band storage for large event payloads via S3 URIs."
  - type: "component"
    name: "Shipping Integration Worker"
    technology: "HTTPS, Circuit Breaker, Token-Bucket Rate Limiting"
    description: "Processes async jobs to communicate with Third-Party Shipping Services using resilience patterns."
relationships:
  - source: "Event Publisher"
    destination: "Payload Offloader"
    description: "Stores large event payloads via S3 URIs"
  - source: "Shipping Integration Worker"
    destination: "Third-Party Shipping Services"
    description: "Communicates via HTTPS with circuit breakers and token-bucket rate limiting"