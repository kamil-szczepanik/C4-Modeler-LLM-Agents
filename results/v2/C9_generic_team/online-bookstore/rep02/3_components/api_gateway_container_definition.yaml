level: component
scope: "Component diagram for the API Gateway Container container"
parentContainer:
  name: "API Gateway Container"
elements:
  - type: "component"
    name: "Router & Routing Controller"
    technology: "AWS API Gateway"
    description: "Handles perimeter security, routing, and internal traffic distribution to core domain containers."
  - type: "component"
    name: "Rate Limiter & Idempotency Validator"
    technology: "AWS API Gateway / Redis"
    description: "Performs distributed rate limiting and idempotency tracking using the caching layer."
  - type: "component"
    name: "Security & TLS Termination Filter"
    technology: "AWS API Gateway (TLS/JWT)"
    description: "Handles TLS termination, JWT validation, and perimeter security checks."
relationships:
  - source: "Security & TLS Termination Filter"
    destination: "Router & Routing Controller"
    description: "Forwards validated and secure client requests"
  - source: "Router & Routing Controller"
    destination: "Rate Limiter & Idempotency Validator"
    description: "Validates rate limits and idempotency via Redis"