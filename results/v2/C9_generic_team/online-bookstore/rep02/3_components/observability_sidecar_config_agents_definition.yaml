level: component
scope: "Component diagram for the Observability Sidecar & Config Agents container"
parentContainer:
  name: "Observability Sidecar & Config Agents"
elements:
  - type: "component"
    name: "Telemetry Collector"
    technology: "OpenTelemetry Sidecar"
    description: "Handles standardized telemetry collection and exports metrics and traces."
  - type: "component"
    name: "Configuration Agent"
    technology: "AWS Systems Manager Parameter Store Agent"
    description: "Retrieves and manages dynamic configuration updates for core containers."
  - type: "component"
    name: "Secrets Manager Agent"
    technology: "AWS Secrets Manager Agent"
    description: "Securely injects secrets and credentials into the core containers."
relationships:
  - source: "Telemetry Collector"
    destination: "Configuration Agent"
    description: "Shares shared container runtime resources"
  - source: "Configuration Agent"
    destination: "Secrets Manager Agent"
    description: "Coordinates secret and configuration synchronization"