# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "A multi-region e-commerce platform built on AWS to sell physical and electronic books with recommendations and reviews, providing a scalable, secure, and globally performant shopping experience meeting strict compliance and availability standards."
elements:
  - type: "person"
    name: "Customers"
    description: "End users browsing, purchasing, and reviewing physical and electronic books."
  - type: "externalSystem"
    name: "Third-party Payment Gateway"
    description: "Handles secure checkout transactions."
  - type: "externalSystem"
    name: "Shipping Providers"
    description: "Manages logistics and fulfillment."
  - type: "externalSystem"
    name: "Identity/Compliance Services"
    description: "Provides identity and compliance support."
  - type: "externalSystem"
    name: "Notification Services"
    description: "Handles system notifications."
  - type: "externalSystem"
    name: "Foreign Exchange (FX) Rate Provider"
    description: "Provides multi-currency conversion (USD, EUR, GBP)."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "Calculates real-time taxes."
  - type: "externalSystem"
    name: "Anti-Fraud / Risk Assessment Service"
    description: "Performs fraud and risk assessments."
  - type: "externalSystem"
    name: "Book Distributors / Inventory Suppliers"
    description: "Manages real-time stock synchronization."
  - type: "externalSystem"
    name: "Observability/Audit Logging Provider"
    description: "Centralized SIEM and audit logging."
  - type: "externalSystem"
    name: "CI/CD Deployment and Configuration Management"
    description: "Handles deployment and configuration management pipelines."
relationships:
  - source: "Customers"
    destination: "Online Bookstore"
    description: "Browsing, purchasing, and reviewing books"
    technology: "HTTPS / WebSockets via AWS CloudFront CDN"
  - source: "Online Bookstore"
    destination: "Third-party Payment Gateway"
    description: "Secure checkout transactions"
    technology: "HTTPS / REST API"
  - source: "Online Bookstore"
    destination: "Shipping Providers"
    description: "Logistics and fulfillment"
    technology: "HTTPS / REST API"
  - source: "Online Bookstore"
    destination: "Tax Calculation Service"
    description: "Real-time tax calculation"
    technology: "HTTPS / REST API"
  - source: "Online Bookstore"
    destination: "Foreign Exchange (FX) Rate Provider"
    description: "Multi-currency conversion (USD, EUR, GBP)"
    technology: "HTTPS / REST API"
  - source: "Online Bookstore"
    destination: "Book Distributors / Inventory Suppliers"
    description: "Real-time stock synchronization"
    technology: "HTTPS / REST API"