level: component
scope: "Component diagram for the Background Worker Container container"
parentContainer:
  name: "Background Worker Container"
elements:
  - type: "component"
    name: "Asynchronous Job Processor"
    technology: "Idempotent Consumer Pattern & Dead Letter Queue (DLQ)"
    description: "Processes asynchronous workloads independently, preventing data corruption and quarantining persistently failing jobs."
  - type: "component"
    name: "Telemetry Exporter"
    technology: "W3C Trace Context & Structured JSON Logging"
    description: "Exports runtime metrics and W3C trace context headers to the EU-Hosted Observability Infrastructure."
  - type: "component"
    name: "External Communication Manager"
    technology: "Circuit Breaker & Backpressure"
    description: "Communicates with external systems utilizing rate-limiting, circuit breaker patterns, and backpressure to prevent cascading failures."
  - type: "component"
    name: "Lifecycle Manager"
    technology: "Graceful Shutdown & Cancellation Tokens"
    description: "Intercepts SIGTERM signals and enforces hard timeouts to preserve task state during shutdowns."
relationships:
  - source: "Asynchronous Job Processor"
    destination: "Telemetry Exporter"
    description: "Forwards trace context and structured logs"
  - source: "Asynchronous Job Processor"
    destination: "External Communication Manager"
    description: "Invokes external systems via resilient patterns"