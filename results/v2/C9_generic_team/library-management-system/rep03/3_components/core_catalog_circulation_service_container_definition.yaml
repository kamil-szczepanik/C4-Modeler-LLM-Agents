level: component
scope: "Component diagram for the Core Catalog/Circulation Service Container container"
parentContainer:
  name: "Core Catalog/Circulation Service Container"
elements:
  - type: "component"
    name: "Domain Models"
    technology: "Domain-Driven Design (DDD) Layers"
    description: "Encapsulates the business logic, entities, and value objects for library cataloging and circulation."
  - type: "component"
    name: "Application Services"
    technology: "DDD Application Services"
    description: "Orchestrates use cases, coordinating domain models and infrastructure adapters."
  - type: "component"
    name: "Infrastructure Adapters"
    technology: "Repository Pattern, Flyway/Liquibase, OpenAPI/Protobuf"
    description: "Manages persistence, database migrations on container startup, and external communication contracts."
relationships:
  - source: "Application Services"
    destination: "Domain Models"
    description: "Executes business logic and workflows"
  - source: "Application Services"
    destination: "Infrastructure Adapters"
    description: "Persists state and handles external messaging/caching"