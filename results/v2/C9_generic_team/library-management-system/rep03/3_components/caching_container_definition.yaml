level: component
scope: "Component diagram for the Caching Container container"
parentContainer:
  name: "Caching Container"
elements:
  - type: "component"
    name: "In-Memory Data Store"
    technology: "Redis"
    description: "Provides low-latency, in-memory data storage, atomic operations, and automated eviction (allkeys-lru) with TTLs."
  - type: "component"
    name: "Cache Management and Invalidation Controller"
    technology: "Redis Protocol"
    description: "Handles write invalidations, query optimizations, and distributed rate-limiting enforcement for incoming container requests."
  - type: "component"
    name: "Telemetry Forwarder"
    technology: "Protocol Buffers / Compressed JSON"
    description: "Forwards telemetry, traces, and memory alerts to the EU-Hosted Observability Infrastructure."
relationships:
  - source: "Cache Management and Invalidation Controller"
    destination: "In-Memory Data Store"
    description: "Manages data storage, query optimization, and rate limiting using"
  - source: "Cache Management and Invalidation Controller"
    destination: "Telemetry Forwarder"
    description: "Feeds metrics and memory alerts to"