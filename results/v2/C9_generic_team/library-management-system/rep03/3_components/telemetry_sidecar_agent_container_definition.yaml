level: component
scope: "Component diagram for the Telemetry Sidecar/Agent Container container"
parentContainer:
  name: "Telemetry Sidecar/Agent Container"
elements:
  - type: "component"
    name: "Telemetry Agent"
    technology: "OpenTelemetry (OTel)"
    description: "Standardized semantic conventions, structured JSON logging, and handling asynchronous batching via local disk buffering."
  - type: "component"
    name: "Sanitization and Circuit Breaker Module"
    technology: "Custom Go/Java Module with Circuit Breaker & Adaptive Sampling"
    description: "Performs PII sanitization, protects against resource exhaustion, and manages high-load log volumes."
  - type: "component"
    name: "Lifecycle Handler"
    technology: "Signal Handlers"
    description: "Intercepts SIGTERM for graceful shutdowns and buffer flushing."
relationships:
  - source: "Telemetry Agent"
    destination: "EU-Hosted Observability Infrastructure"
    description: "Exports sanitized operational metrics and logs [TLS Syslog/HTTPS with Gzip/Zstd compression]"
  - source: "Telemetry Agent"
    destination: "Configuration and Secrets Management Container"
    description: "Reads runtime configuration and environment variables"