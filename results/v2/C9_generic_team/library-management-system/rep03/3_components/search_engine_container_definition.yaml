level: component
scope: "Component diagram for the Search Engine Container container"
parentContainer:
  name: "Search Engine Container"
elements:
  - type: "component"
    name: "Search Indexer and Query Processor"
    technology: "Dedicated Indexing Engine with ILM and Alias Swapping"
    description: "Handles real-time search queries, processes asynchronous catalogue update events, and manages zero-downtime schema migrations."
  - type: "component"
    name: "Cache Manager"
    technology: "Redis Client"
    description: "Interacts with the Caching Container to optimize queries and cache facets."
  - type: "component"
    name: "Telemetry Exporter"
    technology: "W3C Trace Context / Telemetry Agent"
    description: "Exports scrubbed query telemetry and W3C Trace Context to the EU-Hosted Observability Infrastructure."
relationships:
  - source: "Search Indexer and Query Processor"
    destination: "Cache Manager"
    description: "Optimizes queries and caches facets [Redis Protocol]"
  - source: "Search Indexer and Query Processor"
    destination: "Telemetry Exporter"
    description: "Exports scrubbed query telemetry and W3C Trace Context"