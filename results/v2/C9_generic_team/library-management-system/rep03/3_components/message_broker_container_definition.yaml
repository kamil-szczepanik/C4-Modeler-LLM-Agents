level: component
scope: "Component diagram for the Message Broker Container container"
parentContainer:
  name: "Message Broker Container"
elements:
  - type: "component"
    name: "Event Broker Core"
    technology: "Message Broker with Schema Registry (Avro/JSON Schema)"
    description: "Manages event-driven workflows, topic routing, and protocol validation."
  - type: "component"
    name: "Dead Letter Queue (DLQ) Manager"
    technology: "Message Broker DLQ Mechanism"
    description: "Captures and stores failed message deliveries for analysis and error handling."
  - type: "component"
    name: "Trace Propagation Engine"
    technology: "W3C Trace Context"
    description: "Propagates distributed tracing headers across asynchronous message flows."
relationships:
  - source: "Event Broker Core"
    destination: "Dead Letter Queue (DLQ) Manager"
    description: "Routes unprocessable messages"
  - source: "Event Broker Core"
    destination: "Trace Propagation Engine"
    description: "Injects and extracts trace contexts"