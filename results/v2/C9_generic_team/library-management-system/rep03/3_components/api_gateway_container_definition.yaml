level: component
scope: "Component diagram for the API Gateway Container container"
parentContainer:
  name: "API Gateway Container"
elements:
  - type: "component"
    name: "Reverse Proxy and Routing Engine"
    technology: "Modular, plugin-based/middleware architecture"
    description: "Handles declarative routing, reverse proxy duties, and internal routing to the Core Catalog and Search Engine via gRPC."
  - type: "component"
    name: "Edge Validation and Contracts Middleware"
    technology: "OpenAPI/Swagger"
    description: "Performs strict API schema validation at the gateway edge."
  - type: "component"
    name: "Resilience and Caching Middleware"
    technology: "Redis"
    description: "Manages stale-while-revalidate fallback caching, rate limiting, and circuit breaking."
  - type: "component"
    name: "Error Handling and Tracing Middleware"
    technology: "RFC 7807 Problem Details and W3C Trace Context"
    description: "Handles standardized error formats and W3C Trace Context propagation for distributed tracing."
  - type: "component"
    name: "Observability and Compliance Middleware"
    technology: "Prometheus format metrics and PII-redacted access logging"
    description: "Exposes metrics and routes PII-redacted access logs to EU-hosted observability infrastructure."
relationships:
  - source: "Reverse Proxy and Routing Engine"
    destination: "Edge Validation and Contracts Middleware"
    description: "Validates incoming request schemas against OpenAPI/Swagger specs"
  - source: "Reverse Proxy and Routing Engine"
    destination: "Resilience and Caching Middleware"
    description: "Applies rate limiting and checks Redis cache for stale-while-revalidate fallback"
  - source: "Reverse Proxy and Routing Engine"
    destination: "Error Handling and Tracing Middleware"
    description: "Propagates W3C Trace Context and formats errors using RFC 7807"
  - source: "Reverse Proxy and Routing Engine"
    destination: "Observability and Compliance Middleware"
    description: "Exposes Prometheus metrics and records PII-redacted access logs"