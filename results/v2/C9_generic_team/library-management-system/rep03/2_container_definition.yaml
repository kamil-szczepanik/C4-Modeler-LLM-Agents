level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Users and Administrators"
    description: "Users and administrators who interact with the system via self-service portals."
  - type: "externalSystem"
    name: "External Identity Providers"
    description: "External systems handling authentication using OAuth2/SAML."
  - type: "externalSystem"
    name: "Third-Party Hardware Interfaces"
    description: "Barcode and RFID scanners and automated return sorting equipment."
  - type: "externalSystem"
    name: "High-Volume Publisher Feeds"
    description: "Feeds providing digital catalog data asynchronously."
  - type: "externalSystem"
    name: "Inter-Library Loan Networks"
    description: "External networks synchronizing state via bi-directional APIs."
  - type: "externalSystem"
    name: "Notification and Communication Gateways"
    description: "EU-compliant SMS and email gateways."
  - type: "externalSystem"
    name: "EU-Hosted Observability Infrastructure"
    description: "SIEM and APM tools for EU-compliant observability."
  - type: "externalSystem"
    name: "Archival and Backup Storage Service"
    description: "Storage service for archives and backups."
  - type: "container"
    name: "Client-Side Application Container"
    technology: "Single Page App / Mobile App"
    description: "Provides self-service portals and user interfaces for library users and administrators."
  - type: "container"
    name: "API Gateway Container"
    technology: "Reverse Proxy / API Gateway"
    description: "Routes synchronous internal calls and manages incoming client requests."
  - type: "container"
    name: "Core Catalog/Circulation Service Container"
    technology: "Microservice"
    description: "Manages physical and digital item cataloging and circulation logic."
  - type: "container"
    name: "Search Engine Container"
    technology: "Dedicated Indexing Engine"
    description: "Provides high-performance search capabilities ensuring 99th-percentile search response < 800 ms."
  - type: "container"
    name: "Caching Container"
    technology: "Redis"
    description: "Handles read-heavy library catalog browsing and reduces database load."
  - type: "container"
    name: "Message Broker Container"
    technology: "Message Broker"
    description: "Handles asynchronous event-driven workflows with publisher feeds and notification gateways."
  - type: "container"
    name: "Background Worker Container"
    technology: "Background Worker"
    description: "Processes asynchronous jobs independently from the Message Broker."
  - type: "container"
    name: "Configuration and Secrets Management Container"
    technology: "Dynamic Runtime Injection"
    description: "Manages runtime injection for database connection strings and keys."
  - type: "container"
    name: "Telemetry Sidecar/Agent Container"
    technology: "Sidecar Agent"
    description: "Exports sanitized operational metrics and logs exclusively to EU-Hosted Observability Infrastructure."
relationships:
  - source: "Library Users and Administrators"
    destination: "Client-Side Application Container"
    description: "Interacts with via self-service portals"
    technology: "HTTPS/TLS"
  - source: "Client-Side Application Container"
    destination: "API Gateway Container"
    description: "Connects via HTTPS/TLS termination"
    technology: "HTTPS/TLS"
  - source: "API Gateway Container"
    destination: "Core Catalog/Circulation Service Container"
    description: "Routes synchronous internal calls"
    technology: "HTTP/gRPC"
  - source: "API Gateway Container"
    destination: "Search Engine Container"
    description: "Routes search queries"
    technology: "HTTP/gRPC"
  - source: "Core Catalog/Circulation Service Container"
    destination: "Caching Container"
    description: "Interacts for read-heavy query optimization"
    technology: "Redis Protocol"
  - source: "Search Engine Container"
    destination: "Caching Container"
    description: "Interacts for query optimization"
    technology: "Redis Protocol"
  - source: "High-Volume Publisher Feeds"
    destination: "Message Broker Container"
    description: "Ingests digital catalog data asynchronously"
    technology: "Asynchronous Messaging"
  - source: "Message Broker Container"
    destination: "Background Worker Container"
    description: "Triggers asynchronous job processing"
    technology: "Message Queue"
  - source: "Message Broker Container"
    destination: "Notification and Communication Gateways"
    description: "Dispatches asynchronous notifications"
    technology: "Webhooks/SMTP"
  - source: "Telemetry Sidecar/Agent Container"
    destination: "EU-Hosted Observability Infrastructure"
    description: "Exports sanitized operational metrics and logs"
    technology: "TLS Syslog/HTTPS"
  - source: "Client-Side Application Container"
    destination: "External Identity Providers"
    description: "Authenticates users"
    technology: "OAuth2/SAML"
  - source: "Third-Party Hardware Interfaces"
    destination: "API Gateway Container"
    description: "Connects for hardware integration"
    technology: "Local Drivers/HTTP"
  - source: "Inter-Library Loan Networks"
    destination: "API Gateway Container"
    description: "Synchronizes state via bi-directional APIs"
    technology: "Bi-directional APIs"
  - source: "Core Catalog/Circulation Service Container"
    destination: "Archival and Backup Storage Service"
    description: "Offloads backups and archives"
    technology: "Secure Storage Protocol"