level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A solution for public and academic libraries to catalogue items, manage circulation, and provide self-service portals with strict EU-only data residency and high-performance search."
elements:
  - type: "person"
    name: "Client / User Agent"
    description: "Library patrons and staff accessing the self-service portals, catalog, and management features."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "OAuth2/OIDC compliant service enforcing EU residency for authentication."
  - type: "externalSystem"
    name: "Notification / Messaging Service"
    description: "Service handling asynchronous webhooks and HTTPS for patron alerts."
  - type: "externalSystem"
    name: "Monitoring and Telemetry Aggregator"
    description: "EU-hosted APM and telemetry sink preventing PII export."
  - type: "externalSystem"
    name: "Disaster Recovery / Backup Target"
    description: "Encrypted scheduled replication and region-locked backups."
relationships:
  - source: "Client / User Agent"
    destination: "Library Management System"
    description: "Accesses portals, catalog, and circulation features"
    technology: "HTTPS/TLS"
  - source: "Library Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OAuth2/OIDC"
  - source: "Library Management System"
    destination: "Notification / Messaging Service"
    description: "Sends patron alerts"
    technology: "Asynchronous webhooks/HTTPS"
  - source: "Library Management System"
    destination: "Monitoring and Telemetry Aggregator"
    description: "Sends telemetry data"
    technology: "Localized syslog/OTLP"
  - source: "Library Management System"
    destination: "Disaster Recovery / Backup Target"
    description: "Replicates data for backups"
    technology: "Encrypted scheduled replication"