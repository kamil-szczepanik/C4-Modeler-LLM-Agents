level: component
scope: "Component diagram for the Redis Distributed Cache Container container"
parentContainer:
  name: "Redis Distributed Cache Container"
elements:
  - type: "component"
    name: "Distributed Cache Store"
    technology: "Redis"
    description: "Absorbs read spikes and manages session data to meet <800ms search latency while enforcing EU data residency."
  - type: "component"
    name: "Session Manager"
    technology: "Redis Session Engine"
    description: "Isolates and manages user session data securely within EU constraints."
  - type: "component"
    name: "Cache Invalidation Listener"
    technology: "Redis Pub/Sub Subscriber"
    description: "Listens for event-driven cache-busting and invalidation messages from the message broker."
relationships:
  - source: "Catalog Management Service (Spring Boot)"
    destination: "Distributed Cache Store"
    description: "Queries cache [TCP]"
  - source: "Circulation Service (Spring Boot)"
    destination: "Distributed Cache Store"
    description: "Queries cache [TCP]"
  - source: "User Portals Service (Spring Boot)"
    destination: "Distributed Cache Store"
    description: "Queries cache [TCP]"
  - source: "Asynchronous Message Broker Container (RabbitMQ / Kafka)"
    destination: "Cache Invalidation Listener"
    description: "Pub/sub cache invalidation events [TCP]"