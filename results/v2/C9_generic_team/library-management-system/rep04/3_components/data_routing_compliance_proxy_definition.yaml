level: component
scope: "Component diagram for the Data Routing / Compliance Proxy container"
parentContainer:
  name: "Data Routing / Compliance Proxy"
elements:
  - type: "component"
    name: "Data Routing / Compliance Proxy"
    technology: "OCI-compliant Container"
    description: "Manages ingress traffic for the Library Management System, enforcing strict EU-only data residency and protecting performance SLAs."
  - type: "component"
    name: "Redis Distributed Cache Container"
    technology: "Redis"
    description: "Enables low-latency compliance rule lookups and distributed rate limiting."
  - type: "component"
    name: "RabbitMQ / Kafka Asynchronous Message Broker Container"
    technology: "RabbitMQ / Kafka"
    description: "Supports asynchronous dead-letter queue integration for non-blocking compliance auditing."
  - type: "component"
    name: "Consul / Spring Cloud Config Centralized Configuration Store"
    technology: "Consul / Spring Cloud Config"
    description: "Facilitates dynamic, zero-downtime updates to routing tables and geo-IP lists."
  - type: "component"
    name: "Monitoring and Telemetry Aggregator"
    technology: "Telemetry Tools"
    description: "Aggregates monitoring and telemetry data."
  - type: "component"
    name: "Catalog Management"
    technology: "Downstream Service"
    description: "Handles catalog management downstream services."
  - type: "component"
    name: "Circulation"
    technology: "Downstream Service"
    description: "Handles circulation downstream services."
relationships:
  - source: "Client Portals"
    destination: "Data Routing / Compliance Proxy"
    description: "Routes requests via HTTPS/REST"
  - source: "Data Routing / Compliance Proxy"
    destination: "Redis Distributed Cache Container"
    description: "Performs lookups and rate limiting via RESP (REdis Serialization Protocol)"
  - source: "Data Routing / Compliance Proxy"
    destination: "RabbitMQ / Kafka Asynchronous Message Broker Container"
    description: "Sends compliance auditing messages via AMQP/Kafka Protocol"
  - source: "Data Routing / Compliance Proxy"
    destination: "Consul / Spring Cloud Config Centralized Configuration Store"
    description: "Fetches configuration updates via HTTP/gRPC"