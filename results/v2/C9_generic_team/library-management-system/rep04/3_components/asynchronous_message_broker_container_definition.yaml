level: component
scope: "Component diagram for the Asynchronous Message Broker Container container"
parentContainer:
  name: "Asynchronous Message Broker Container"
elements:
  - type: "component"
    name: "Message Broker"
    technology: "RabbitMQ / Kafka"
    description: "Handles asynchronous event streaming with multi-node clustering for high availability and strict EU-only data residency."
  - type: "component"
    name: "Schema Registry"
    technology: "Schema Registry / AsyncAPI"
    description: "Enforces strict message payload governance to prevent silent integration failures."
  - type: "component"
    name: "Metrics Exporter"
    technology: "Prometheus"
    description: "Collects broker metrics including consumer lag, queue depth, and throughput."
relationships:
  - source: "Catalog Management"
    destination: "Message Broker"
    description: "Publishes/consumes events [AMQP/TCP]"
  - source: "Circulation"
    destination: "Message Broker"
    description: "Publishes/consumes events [AMQP/TCP]"
  - source: "User Portals"
    destination: "Message Broker"
    description: "Publishes/consumes events [AMQP/TCP]"
  - source: "Message Broker"
    destination: "Log/Metrics Collector Agent"
    description: "Exports Prometheus-compatible metrics [HTTP/TCP]"