# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the API Gateway Container container"
parentContainer:
  name: "API Gateway Container"
elements:
  - type: "component"
    name: "Routing and Proxy Module"
    technology: "Envoy / NGINX (OCI-compliant)"
    description: "Securely routes, validates, and optimizes client traffic from the Web Frontend and Mobile App to core microservices."
  - type: "component"
    name: "Security and TLS Termination Module"
    technology: "Envoy / NGINX"
    description: "Handles TLS termination, IP whitelisting, and enforces strict request size and payload limits at the edge."
  - type: "component"
    name: "Rate Limiting and Caching Module"
    technology: "Redis Distributed Cache (RESP/TCP)"
    description: "Implements token bucket algorithms and manages distributed state for rate limiting and traffic management."
  - type: "component"
    name: "Validation and Error Handling Module"
    technology: "OpenAPI / JSON Schema, RFC 7807"
    description: "Ensures standardized payloads and handles error structures using Problem Details."
  - type: "component"
    name: "Observability and Telemetry Agent"
    technology: "W3C Trace Context, OTel Collector"
    description: "Captures and propagates distributed tracing and telemetry data for inbound and outbound traffic."
relationships:
  - source: "Web Frontend"
    destination: "Routing and Proxy Module"
    description: "Sends client traffic [HTTPS/REST]"
  - source: "Mobile App"
    destination: "Routing and Proxy Module"
    description: "Sends client traffic [HTTPS/REST]"
  - source: "Security and TLS Termination Module"
    destination: "Routing and Proxy Module"
    description: "Terminates TLS and enforces security policies"
  - source: "Routing and Proxy Module"
    destination: "Rate Limiting and Caching Module"
    description: "Queries token bucket and distributed state [RESP/TCP]"
  - source: "Routing and Proxy Module"
    destination: "Validation and Error Handling Module"
    description: "Validates incoming payloads"
  - source: "Routing and Proxy Module"
    destination: "Catalog Management"
    description: "Routes requests [gRPC/REST]"
  - source: "Routing and Proxy Module"
    destination: "Circulation"
    description: "Routes requests [gRPC/REST]"
  - source: "Routing and Proxy Module"
    destination: "User Portals"
    description: "Routes requests [gRPC/REST]"
  - source: "Routing and Proxy Module"
    destination: "Redis Distributed Cache"
    description: "Communicates for caching [RESP/TCP]"