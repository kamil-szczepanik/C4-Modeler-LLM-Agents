level: component
scope: "Component diagram for the User Portals container"
parentContainer:
  name: "User Portals"
elements:
  - type: "component"
    name: "Repository Layer"
    technology: "Spring Boot"
    description: "Implements data persistence and retrieval patterns for EU-hosted data."
  - type: "component"
    name: "Service Layer"
    technology: "Spring Boot"
    description: "Contains core business logic, orchestrating calls to cache, database, and message broker."
  - type: "component"
    name: "Exception Handler"
    technology: "RFC 7807"
    description: "Provides standardized Problem Details for global exception handling and error mapping."
  - type: "component"
    name: "Health Probe"
    technology: "Spring Boot Actuator"
    description: "Provides liveness, readiness, and startup probes for OCI container orchestration."
relationships:
  - source: "Service Layer"
    destination: "Repository Layer"
    description: "Queries and updates data"
  - source: "Service Layer"
    destination: "Exception Handler"
    description: "Maps errors to RFC 7807 problem details"