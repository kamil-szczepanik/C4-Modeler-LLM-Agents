level: component
scope: "Component diagram for the Centralized Configuration Store container"
parentContainer:
  name: "Centralized Configuration Store"
elements:
  - type: "component"
    name: "Configuration Server"
    technology: "Spring Cloud Config"
    description: "Serves immutable configurations to client containers and maintains centralized configuration state."
  - type: "component"
    name: "Key-Value Store Backend"
    technology: "Consul"
    description: "Provides the underlying data store for configuration management and supports immutable image builds and data residency requirements."
relationships:
  - source: "Configuration Server"
    destination: "Key-Value Store Backend"
    description: "Fetches and persists configuration data"