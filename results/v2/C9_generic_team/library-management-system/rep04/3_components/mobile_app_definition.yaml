level: component
scope: "Component diagram for the Mobile App container"
parentContainer:
  name: "Mobile App"
elements:
  - type: "component"
    name: "Client / User Agent"
    technology: "Native / Cross-Platform Mobile UI"
    description: "Serves as the client interface for users to access search and circulation features."
  - type: "component"
    name: "API Gateway Container"
    technology: "Envoy / NGINX"
    description: "Handles incoming requests from the mobile app."
  - type: "component"
    name: "Identity Provider (IdP)"
    technology: "OAuth2 / OIDC"
    description: "Authenticates mobile app users and secures tokens."
  - type: "component"
    name: "Monitoring and Telemetry Aggregator"
    technology: "OpenTelemetry / APM"
    description: "Aggregates logs and metrics from the mobile application."
  - type: "component"
    name: "Local Storage Manager"
    technology: "SQLite / Secure Key-Value Stores, Android Keystore / iOS Keychain"
    description: "Provides localized caching for offline support and secures tokens and credentials."
  - type: "component"
    name: "Background Sync Manager"
    technology: "WorkManager / BackgroundTasks"
    description: "Manages resource-aware background synchronization."
relationships:
  - source: "Client / User Agent"
    destination: "Mobile App"
    description: "Interacts via HTTPS/REST"
  - source: "Mobile App"
    destination: "API Gateway Container"
    description: "Sends requests via HTTPS/REST"
  - source: "Identity Provider (IdP)"
    destination: "Mobile App"
    description: "Authenticates via OAuth2/OIDC"
  - source: "Mobile App"
    destination: "Monitoring and Telemetry Aggregator"
    description: "Forwards telemetry via OpenTelemetry/APM"