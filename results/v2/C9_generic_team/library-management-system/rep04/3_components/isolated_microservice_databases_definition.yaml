level: component
scope: "Component diagram for the Isolated Microservice Databases container"
parentContainer:
  name: "Isolated Microservice Databases"
elements:
  - type: "component"
    name: "Catalog Management Database"
    technology: "Relational/NoSQL Database"
    description: "Stores catalog and bibliographic data with strict EU-only data residency."
  - type: "component"
    name: "Circulation Database"
    technology: "Relational/NoSQL Database"
    description: "Stores circulation, checkout, and patron transaction records."
  - type: "component"
    name: "User Portals Database"
    technology: "Relational/NoSQL Database"
    description: "Stores user profiles, preferences, and portal session data."
relationships:
  - source: "Catalog Management Database"
    destination: "Circulation Database"
    description: "Synchronizes bibliographic state"