level: component
scope: "Component diagram for the Circulation container"
parentContainer:
  name: "Circulation"
elements:
  - type: "component"
    name: "Circulation Component"
    technology: "OCI-compliant Container, Spring Boot"
    description: "Handles high-concurrency lending, returns, and inventory state transitions using robust distributed systems patterns."
  - type: "component"
    name: "Isolated Microservice Database"
    technology: "Relational/NoSQL Database"
    description: "Stores transactional data securely with isolated microservice boundary."
  - type: "component"
    name: "Asynchronous Message Broker Container"
    technology: "RabbitMQ / Kafka"
    description: "Publishes domain events via AMQP/TCP using the Transactional Outbox Pattern."
  - type: "component"
    name: "Redis Distributed Cache Container"
    technology: "Redis"
    description: "Queries cached session data via TCP with strict TTLs and PII scrubbing."
  - type: "component"
    name: "API Gateway Container"
    technology: "Envoy / NGINX"
    description: "Routes traffic using gRPC/REST with correlation ID propagation."
  - type: "component"
    name: "Notification / Messaging Service"
    technology: "Messaging Service"
    description: "Triggers external notifications protected by Resilience4j circuit breakers."
relationships:
  - source: "API Gateway Container"
    destination: "Circulation Component"
    description: "Routes traffic using gRPC/REST with correlation ID propagation"
  - source: "Circulation Component"
    destination: "Isolated Microservice Database"
