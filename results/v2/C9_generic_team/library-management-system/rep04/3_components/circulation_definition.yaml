  - source: "Circulation Component"
    destination: "Asynchronous Message Broker Container"
    description: "Publishes domain events (ItemLent, ItemReturned) via AMQP/TCP using the Transactional Outbox Pattern"
  - source: "Circulation Component"
    destination: "Redis Distributed Cache Container"
