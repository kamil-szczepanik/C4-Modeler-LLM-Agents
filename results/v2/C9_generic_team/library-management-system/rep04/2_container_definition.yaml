level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Client / User Agent"
    description: "Library patrons and staff accessing the self-service portals, catalog, and management features."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "OAuth2/OIDC compliant service enforcing EU residency for authentication."
  - type: "externalSystem"
    name: "Notification / Messaging Service"
    description: "Service handling asynchronous webhooks and HTTPS for patron alerts."
  - type: "externalSystem"
    name: "Monitoring and Telemetry Aggregator"
    description: "EU-hosted APM and telemetry sink preventing PII export."
  - type: "externalSystem"
    name: "Disaster Recovery / Backup Target"
    description: "Encrypted scheduled replication and region-locked backups."
  - type: "container"
    name: "Web Frontend"
    technology: "React / HTML / JavaScript"
    description: "Web-based user interface for clients to access portals and catalog."
  - type: "container"
    name: "Mobile App"
    technology: "Native / Cross-Platform Mobile"
    description: "Mobile application for clients to access catalog and circulation features."
  - type: "container"
    name: "API Gateway Container"
    technology: "OCI-compliant Container, Envoy / NGINX"
    description: "Entry point for client traffic, routing requests to core microservices."
  - type: "container"
    name: "Data Routing / Compliance Proxy"
    technology: "OCI-compliant Container"
    description: "Ensures strict EU data residency compliance and proxying."
  - type: "container"
    name: "Catalog Management"
    technology: "OCI-compliant Container, Spring Boot"
    description: "Handles item cataloging and metadata management."
  - type: "container"
    name: "Circulation"
    technology: "OCI-compliant Container, Spring Boot"
    description: "Manages lending, returns, and circulation workflows."
  - type: "container"
    name: "User Portals"
    technology: "OCI-compliant Container, Spring Boot"
    description: "Provides self-service portal backend features for users."
  - type: "container"
    name: "Elasticsearch / OpenSearch Search Container"
    technology: "Elasticsearch / OpenSearch"
    description: "Decouples search queries to meet high-performance search requirements."
  - type: "container"
    name: "Redis Distributed Cache Container"
    technology: "Redis"
    description: "Absorbs read spikes as a distributed cache and manages stateless session data."
  - type: "container"
    name: "Isolated Microservice Databases"
    technology: "Relational/NoSQL Database"
    description: "Explicit database isolation ensuring compliance with EU data residency."
  - type: "container"
    name: "Asynchronous Message Broker Container"
    technology: "RabbitMQ / Kafka"
    description: "Handles asynchronous event publishing and consumption between microservices."
  - type: "container"
    name: "Centralized Configuration Store"
    technology: "Consul / Spring Cloud Config"
    description: "Centralizes configuration to maintain immutable image builds."
  - type: "container"
    name: "Log/Metrics Collector Agent"
    technology: "OTel Collector / Fluentd"
    description: "Forwards structured JSON logs and metrics to monitoring."
relationships:
  - source: "Client / User Agent"
    destination: "Web Frontend"
    description: "Interacts with"
    technology: "HTTPS/REST"
  - source: "Client / User Agent"
    destination: "Mobile App"
    description: "Interacts with"
    technology: "HTTPS/REST"
  - source: "Web Frontend"
    destination: "API Gateway Container"
    description: "Sends requests to"
    technology: "HTTPS/REST"
  - source: "Mobile App"
    destination: "API Gateway Container"
    description: "Sends requests to"
    technology: "HTTPS/REST"
  - source: "API Gateway Container"
    destination: "Catalog Management"
    description: "Routes traffic to"
    technology: "gRPC/REST"
  - source: "API Gateway Container"
    destination: "Circulation"
    description: "Routes traffic to"
    technology: "gRPC/REST"
  - source: "API Gateway Container"
    destination: "User Portals"
    description: "Routes traffic to"
    technology: "gRPC/REST"
  - source: "Catalog Management"
    destination: "Redis Distributed Cache Container"
    description: "Queries cache"
    technology: "TCP"
  - source: "Circulation"
    destination: "Redis Distributed Cache Container"
    description: "Queries cache"
    technology: "TCP"
  - source: "User Portals"
    destination: "Redis Distributed Cache Container"
    description: "Queries cache"
    technology: "TCP"
  - source: "Catalog Management"
    destination: "Elasticsearch / OpenSearch Search Container"
    description: "Queries search index"
    technology: "TCP"
  - source: "Circulation"
    destination: "Elasticsearch / OpenSearch Search Container"
    description: "Queries search index"
    technology: "TCP"
  - source: "Catalog Management"
    destination: "Isolated Microservice Databases"
    description: "Reads and writes data"
    technology: "SQL/TCP"
  - source: "Circulation"
    destination: "Isolated Microservice Databases"
    description: "Reads and writes data"
    technology: "SQL/TCP"
  - source: "User Portals"
    destination: "Isolated Microservice Databases"
    description: "Reads and writes data"
    technology: "SQL/TCP"
  - source: "Catalog Management"
    destination: "Asynchronous Message Broker Container"
    description: "Publishes/consumes events"
    technology: "AMQP/TCP"
  - source: "Circulation"
    destination: "Asynchronous Message Broker Container"
    description: "Publishes/consumes events"
    technology: "AMQP/TCP"
  - source: "User Portals"
    destination: "Asynchronous Message Broker Container"
    description: "Publishes/consumes events"
    technology: "AMQP/TCP"
  - source: "Log/Metrics Collector Agent"
    destination: "Monitoring and Telemetry Aggregator"
    description: "Forwards structured JSON logs"
    technology: "TLS"