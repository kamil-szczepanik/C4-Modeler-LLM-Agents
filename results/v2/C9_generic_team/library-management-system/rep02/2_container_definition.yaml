level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Self-Service Patrons"
    description: "Patrons who interact with the system for searching and self-service portals."
  - type: "person"
    name: "Library Staff"
    description: "Staff members who interact with the system for administrative catalogue management and circulation."
  - type: "externalSystem"
    name: "Identity and Access Management (IAM) Provider"
    description: "Provider utilizing OAuth2/OIDC for authentication and RBAC."
  - type: "externalSystem"
    name: "External Notification Systems"
    description: "EU-compliant email/SMS gateways."
  - type: "externalSystem"
    name: "Third-Party Digital Content Providers"
    description: "Providers of digital content integrated with the library system."
  - type: "externalSystem"
    name: "Centralized Audit and Logging System"
    description: "System for streaming logs and telemetry."
  - type: "container"
    name: "Web Application (SPA)"
    technology: "Frontend SPA served via CDN"
    description: "Provides public and academic libraries with item cataloging, circulation management, and self-service portals."
  - type: "container"
    name: "API Gateway"
    technology: "API Gateway with TLS termination and IAM token validation"
    description: "Routes requests from the web application to core business services."
  - type: "container"
    name: "Core Business Services"
    technology: "Decoupled microservices architecture"
    description: "Handles Catalogue, Circulation, and User Management business logic."
  - type: "container"
    name: "Search Engine Container"
    technology: "Elasticsearch/OpenSearch"
    description: "Provides fast search capabilities isolated within the EU."
  - type: "container"
    name: "Database Container"
    technology: "PostgreSQL"
    description: "Regional PostgreSQL instance with encryption at rest for stateful data."
  - type: "container"
    name: "Async Event Broker Container"
    technology: "Apache Kafka or RabbitMQ"
    description: "Handles asynchronous messaging and event streaming."
  - type: "container"
    name: "Shared Caching Container"
    technology: "Redis"
    description: "Deployed regionally in front of the database to improve performance."
  - type: "container"
    name: "File Storage Container"
    technology: "S3/HTTPS Compatible Storage"
    description: "Stores file assets securely with EU data residency."
  - type: "container"
    name: "Worker / Background Job Processing Container"
    technology: "Background Worker Service"
    description: "Processes background jobs and asynchronous tasks."
  - type: "container"
    name: "Configuration Management Container/Service"
    technology: "Configuration Service"
    description: "Manages system-wide configurations."
relationships:
  - source: "Self-Service Patrons"
    destination: "Web Application (SPA)"
    description: "Interacts for searching and self-service portals"
    technology: "HTTPS/TLS"
  - source: "Library Staff"
    destination: "Web Application (SPA)"
    description: "Interacts for administrative catalogue management and circulation"
    technology: "HTTPS/TLS"
  - source: "Web Application (SPA)"
    destination: "API Gateway"
    description: "Sends user requests"
    technology: "HTTPS/TLS"
  - source: "API Gateway"
    destination: "Core Business Services"
    description: "Routes validated requests"
    technology: "gRPC/REST"
  - source: "Core Business Services"
    destination: "Database Container"
    description: "Reads and writes relational data"
    technology: "PostgreSQL protocol"
  - source: "Core Business Services"
    destination: "Search Engine Container"
    description: "Queries search index"
    technology: "HTTP/REST"
  - source: "Core Business Services"
    destination: "Async Event Broker Container"
    description: "Publishes and consumes asynchronous events"
    technology: "AMQP/Kafka protocol"
  - source: "Core Business Services"
    destination: "Shared Caching Container"
    description: "Retrieves and stores cached data"
    technology: "Redis protocol"
  - source: "Core Business Services"
    destination: "File Storage Container"
    description: "Uploads and retrieves files"
    technology: "S3/HTTPS"
  - source: "Core Business Services"
    destination: "Worker / Background Job Processing Container"
    description: "Offloads background tasks"
    technology: "Internal API / Messaging"
  - source: "Core Business Services"
    destination: "Configuration Management Container/Service"
    description: "Fetches runtime configurations"
    technology: "Internal API"
  - source: "API Gateway"
    destination: "Identity and Access Management (IAM) Provider"
    description: "Validates IAM tokens"
    technology: "OAuth2/OIDC"
  - source: "Core Business Services"
    destination: "External Notification Systems"
    description: "Sends notifications"
    technology: "SMTP/SMPP"
  - source: "Core Business Services"
    destination: "Third-Party Digital Content Providers"
    description: "Integrates with digital content"
    technology: "HTTPS/REST"
  - source: "Core Business Services"
    destination: "Centralized Audit and Logging System"
    description: "Streams logs and telemetry"
    technology: "TLS"