level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A solution for public and academic libraries to catalogue physical and digital items, manage circulation, and provide self-service portals with strict EU-only data residency."
elements:
  - type: "person"
    name: "Self-Service Patrons"
    description: "Patrons who interact with the system for searching and self-service portals."
  - type: "person"
    name: "Library Staff"
    description: "Staff members who interact with the system for administrative catalogue management and circulation."
  - type: "externalSystem"
    name: "External Notification Systems"
    description: "EU-compliant email/SMS gateways."
  - type: "externalSystem"
    name: "Third-Party Digital Content Providers"
    description: "Providers of digital content integrated with the library system."
  - type: "externalSystem"
    name: "Time Synchronization/Scheduling Service"
    description: "Service for time synchronization and scheduling."
  - type: "externalSystem"
    name: "Centralized Audit and Logging System"
    description: "System for streaming logs and telemetry."
  - type: "externalSystem"
    name: "Identity and Access Management (IAM) Provider"
    description: "Provider utilizing OAuth2/OIDC for authentication and RBAC."
  - type: "externalSystem"
    name: "External Data Migration/Import System"
    description: "System for external data migration and importing."
  - type: "externalSystem"
    name: "Archival and Long-Term Data Retention System"
    description: "Storage solutions for statutory record retention."
  - type: "externalSystem"
    name: "Disaster Recovery and Backup Storage"
    description: "EU-certified cloud storage for backups and disaster recovery."
relationships:
  - source: "Self-Service Patrons"
    destination: "Library Management System"
    description: "Interacts for searching and self-service portals"
    technology: "HTTPS/REST"
  - source: "Library Staff"
    destination: "Library Management System"
    description: "Interacts for administrative catalogue management and circulation"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "External Notification Systems"
    description: "Integrates for sending notifications"
    technology: "SMTP/SMPP"
  - source: "Library Management System"
    destination: "Third-Party Digital Content Providers"
    description: "Communicates with digital content providers"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "Identity and Access Management (IAM) Provider"
    description: "Authenticates users and enforces role-based access control"
    technology: "OAuth2/OIDC"
  - source: "Library Management System"
    destination: "Centralized Audit and Logging System"
    description: "Streams logs and telemetry"
    technology: "TLS"