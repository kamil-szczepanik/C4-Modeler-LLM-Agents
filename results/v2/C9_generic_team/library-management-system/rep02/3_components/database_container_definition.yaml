level: component
scope: "Component diagram for the Database Container container"
parentContainer:
  name: "Database Container"
elements:
  - type: "component"
    name: "Regional PostgreSQL instance"
    technology: "PostgreSQL"
    description: "Provides ACID transactional integrity for circulation, encryption at rest, and ensures compliance with EU-only data residency."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Manages traffic spikes and connection limits for the database."
  - type: "component"
    name: "Flyway or Liquibase"
    technology: "Flyway / Liquibase"
    description: "Automates safe schema evolution."
  - type: "component"
    name: "Monitoring and Telemetry"
    technology: "Prometheus, postgres_exporter, pg_audit"
    description: "Exposes metrics for monitoring infrastructure and tracks database auditing."
  - type: "component"
    name: "Disaster Recovery and Backup Storage"
    technology: "Storage container with WAL archiving"
    description: "Handles automated PITR and backup storage."
relationships:
  - source: "PgBouncer"
    destination: "Regional PostgreSQL instance"
    description: "Manages and routes database connections to"
  - type: "component"
    name: "Flyway or Liquibase"
    destination: "Regional PostgreSQL instance"
    description: "Applies safe schema migrations to"
  - type: "component"
    name: "Monitoring and Telemetry"
    destination: "Regional PostgreSQL instance"
    description: "Scrapes metrics and audits"