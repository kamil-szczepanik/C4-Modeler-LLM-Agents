level: component
scope: "Component diagram for the Core Business Services container"
parentContainer:
  name: "Core Business Services"
elements:
  - type: "component"
    name: "Catalogue Domain Service"
    technology: "Decoupled microservices architecture"
    description: "Manages catalogue items, physical and digital inventory, and integrates with search engines."
  - type: "component"
    name: "Circulation Domain Service"
    technology: "Decoupled microservices architecture"
    description: "Handles item checkouts, returns, renewals, and fine management."
  - type: "component"
    name: "User Management Domain Service"
    technology: "Decoupled microservices architecture"
    description: "Manages patron and staff profiles, authentication context, and role-based access."
relationships:
  - source: "Catalogue Domain Service"
    destination: "Search Engine Container"
    description: "Queries search index [HTTP/REST]"
  - source: "Circulation Domain Service"
    destination: "Database Container"
    description: "Reads and writes domain data [PostgreSQL protocol]"
  - source: "User Management Domain Service"
    destination: "Async Event Broker Container"
    description: "Publishes and consumes asynchronous events [AMQP/Kafka protocol]"