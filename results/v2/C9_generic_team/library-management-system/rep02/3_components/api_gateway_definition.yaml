level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Router"
    technology: "Custom edge router with integrated TLS termination"
    description: "Handles routing, TLS termination, and forwards incoming user requests."
  - type: "component"
    name: "Security Manager"
    technology: "OAuth2/OIDC validation module"
    description: "Validates IAM tokens and handles security checks."
  - type: "component"
    name: "Caching Manager"
    technology: "Redis Client"
    description: "Manages caching of frequent search queries and serves fallback responses."
  - type: "component"
    name: "Resiliency and Rate Limiting Controller"
    technology: "Circuit Breaker and Rate Limiting patterns"
    description: "Enforces rate limits and provides circuit breaker patterns for backend protection."
relationships:
  - source: "Edge Router"
    destination: "Security Manager"
    description: "Delegates token validation"
  - source: "Edge Router"
    destination: "Resiliency and Rate Limiting Controller"
    description: "Applies rate limiting and circuit breaking"
  - source: "Edge Router"
    destination: "Caching Manager"
    description: "Checks and stores cached query responses"