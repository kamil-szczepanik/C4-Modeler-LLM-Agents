level: component
scope: "Component diagram for the Web Application (SPA) container"
parentContainer:
  name: "Web Application (SPA)"
elements:
  - type: "component"
    name: "Frontend UI Router and Views"
    technology: "React"
    description: "Manages single-page application routing, view rendering, and screen navigation for patrons and staff."
  - type: "component"
    name: "Client-Side State and Cache Manager"
    technology: "React Query / RTK Query"
    description: "Handles client-side state management, data fetching, and search caching."
  - type: "component"
    name: "API Communication Client"
    technology: "HTTPS/TLS Client"
    description: "Communicates securely with the API Gateway to send user requests and retrieve data."
relationships:
  - source: "Frontend UI Router and Views"
    destination: "Client-Side State and Cache Manager"
    description: "Fetches and caches data"
  - source: "Client-Side State and Cache Manager"
    destination: "API Communication Client"
    description: "Sends requests via"
  - source: "API Communication Client"
    destination: "API Gateway"
    description: "Sends user requests and retrieves data [HTTPS/TLS]"