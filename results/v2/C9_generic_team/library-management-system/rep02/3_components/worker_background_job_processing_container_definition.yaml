level: component
scope: "Component diagram for the Worker / Background Job Processing Container container"
parentContainer:
  name: "Worker / Background Job Processing Container"
elements:
  - type: "component"
    name: "Job Consumer Component"
    technology: "Background Worker Service / Async Listener"
    description: "Consumes asynchronous tasks and events from the event broker for long-running processes."
  - type: "component"
    name: "Task Processor Component"
    technology: "Business Logic Handler"
    description: "Executes background workflows, maintaining data integrity, error handling, and stateful job tracking."
  - type: "component"
    name: "Notification Dispatcher Component"
    technology: "HTTPS Client"
    description: "Sends notifications and interacts with external third-party notification systems."
relationships:
  - source: "Job Consumer Component"
    destination: "Task Processor Component"
    description: "Triggers and passes payloads for background execution"
  - source: "Task Processor Component"
    destination: "Database Container"
    description: "Persists stateful job tracking and updates data [SQL / TCP]"
  - source: "Notification Dispatcher Component"
    destination: "External Notification Systems & Third-Party Digital Content Providers"
    description: "Sends outbound alerts and notifications [HTTPS]"