# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Shared Caching Container container"
parentContainer:
  name: "Shared Caching Container"
elements:
  # Components within the parent container's boundary
  - type: "component"
    name: "Cache Manager"
    technology: "Redis In-Memory Engine"
    description: "Manages in-memory data access and eviction policies to support sub-800ms search performance."
  - type: "component"
    name: "Session Store"
    technology: "Redis KV Store"
    description: "Stores active patron and staff session states for the self-service portals."
relationships:
  - source: "Cache Manager"
    destination: "Session Store"
    description: "Persists and retrieves cached data entries [Redis protocol]"