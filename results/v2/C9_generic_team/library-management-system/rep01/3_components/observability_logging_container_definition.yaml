level: component
scope: "Component diagram for the Observability & Logging Container container"
parentContainer:
  name: "Observability & Logging Container"
elements:
  - type: "component"
    name: "Telemetry Processing Service"
    technology: "OpenTelemetry"
    description: "Processes centralized metrics, tracing, and log aggregation."
  - type: "component"
    name: "Schema Validation Engine"
    technology: "JSON / Centralized Schema Registry"
    description: "Validates incoming telemetry against standardized schemas."
  - type: "component"
    name: "Compliance and Archival Manager"
    technology: "Active Storage & Cold Storage"
    description: "Manages compliance monitoring, PII masking, and cold storage archival."
  - type: "component"
    name: "Application Sidecars"
    technology: "Fluentd or Vector"
    description: "Provides asynchronous buffering, local disk spooling, and non-blocking log emission."
  - type: "component"
    name: "Core Domain Services"
    technology: "JSON & OpenTelemetry"
    description: "Upstream producers of metrics, traces, and structured JSON logs."
  - type: "component"
    name: "Observability Dashboards"
    technology: "Query Timeout & Resource Throttling Mechanisms"
    description: "Protected interfaces for operators to query and analyze system telemetry."
relationships:
  - source: "Core Domain Services"
    destination: "Application Sidecars"
    description: "Emits structured JSON logs and OpenTelemetry traces via local I/O."
  - source: "Application Sidecars"
    destination: "Telemetry Processing Service"
    description: "Forwards telemetry over TLS 1.3 with asynchronous buffering."
  - source: "Telemetry Processing Service"
    destination: "Schema Validation Engine"
    description: "Sends telemetry data for schema validation."
  - source: "Telemetry Processing Service"
    destination: "Compliance and Archival Manager"
    description: "Routes data for compliance monitoring and archival storage."
  - source: "Observability Dashboards"
    destination: "Telemetry Processing Service"
    description: "Queries telemetry data protected by query timeout and resource throttling."