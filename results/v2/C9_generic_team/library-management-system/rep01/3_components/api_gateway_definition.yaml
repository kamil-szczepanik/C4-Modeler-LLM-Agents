level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing and Security Router"
    technology: "HTTP/REST, TLS termination, OAuth2/JWT token introspection"
    description: "Serves as the single secure entry point enforcing routing, security, and performance constraints."
  - type: "component"
    name: "Caching Manager"
    technology: "Redis, In-memory / TCP"
    description: "Handles caching and idempotency for mutating request protection."
  - type: "component"
    name: "Observability Collector"
    technology: "W3C Trace Context, Prometheus-compatible /metrics endpoint"
    description: "Manages centralized metrics and tracing."
  - type: "component"
    name: "Configuration Manager"
    technology: "Dynamic declarative routing"
    description: "Manages dynamic declarative routing configurations."
relationships:
  - source: "Routing and Security Router"
    destination: "Caching Manager"
    description: "Checks and stores cache data via In-memory / TCP"
  - source: "Routing and Security Router"
    destination: "Observability Collector"
    description: "Sends centralized metrics and tracing data"