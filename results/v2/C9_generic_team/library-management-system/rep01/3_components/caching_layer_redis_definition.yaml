level: component
scope: "Component diagram for the Caching Layer (Redis) container"
parentContainer:
  name: "Caching Layer (Redis)"
elements:
  - type: "component"
    name: "Redis In-Memory Store"
    technology: "Redis"
    description: "In-memory data store for low-latency read acceleration and fast search response times."
  - type: "component"
    name: "Cache Management Interface"
    technology: "RESP (REdis Serialization Protocol)"
    description: "Handles RESP over TCP communication with TLS for queries from Core Domain Services."
  - type: "component"
    name: "Secrets and Certificate Handler"
    technology: "EU-certified Secrets Management Vault Integration"
    description: "Retrieves runtime TLS certificates and credentials enforcing EU data residency."
relationships:
  - source: "Cache Management Interface"
    destination: "Redis In-Memory Store"
    description: "Reads and writes cached data using RESP over TCP"
  - type: "Secrets and Certificate Handler"
    destination: "Redis In-Memory Store"
    description: "Injects runtime TLS certificates and credentials"