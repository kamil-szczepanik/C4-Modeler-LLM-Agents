# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the API Composition / BFF Container container"
parentContainer:
  name: "API Composition / BFF Container"
elements:
  # Components within the parent container's boundary
  - type: "component"
    name: "Request Router and Orchestrator"
    technology: "Node.js / Vert.x / Go (Non-blocking I/O)"
    description: "Orchestrates client requests, handles payload shaping, and routes client traffic from the API Gateway."
  - type: "component"
    name: "Schema Validation and Contract Enforcer"
    technology: "OpenAPI / Schema validation"
    description: "Enforces strict contracts and automated testing for incoming and outgoing payloads."
  - type: "component"
    name: "Fault Tolerance Manager"
    technology: "Circuit Breakers & RFC 7807"
    description: "Prevents cascading failures during heavy loads and standardizes error-handling and fault-normalization payloads."
  - type: "component"
    name: "Telemetry Instrumenter"
    technology: "OpenTelemetry"
    description: "Instruments distributed tracing across requests for monitoring and observability."
relationships:
  - source: "Request Router and Orchestrator"
    destination: "Schema Validation and Contract Enforcer"
    description: "Validates request and response payloads [OpenAPI]"
  - source: "Request Router and Orchestrator"
    destination: "Fault Tolerance Manager"
    description: "Applies circuit breaker protection and fault normalization [RFC 7807]"
  - source: "Request Router and Orchestrator"
    destination: "Telemetry Instrumenter"
    description: "Sends tracing data for requests [OpenTelemetry]"