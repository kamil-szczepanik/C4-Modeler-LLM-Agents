level: component
scope: "Component diagram for the Self-Service Portals and Kiosks container"
parentContainer:
  name: "Self-Service Portals and Kiosks"
elements:
  - type: "component"
    name: "Web and Mobile UI Frontend"
    technology: "Modular component-driven design system"
    description: "Provides catalogue management, circulation, and self-service interfaces for library patrons and staff."
  - type: "component"
    name: "Resilience Handler"
    technology: "Circuit Breaker and Retry pattern with exponential backoff"
    description: "Handles transient network failures between clients and upstream services."
  - type: "component"
    name: "Security and Storage Manager"
    technology: "Strict CSP headers, XSS sanitization, zero-trust short-lived tokens, and encrypted IndexedDB"
    description: "Manages local storage, sanitization, and secure token handling on constrained kiosk hardware."
  - type: "component"
    name: "Compliance and Telemetry Redactor"
    technology: "Client-side PII redaction"
    description: "Ensures EU-only data residency requirements by redacting telemetry before export."
relationships:
  - source: "Web and Mobile UI Frontend"
    destination: "Resilience Handler"
    description: "Routes network calls through"
  - source: "Resilience Handler"
    destination: "Security and Storage Manager"
    description: "Validates and secures requests using"
  - source: "Security and Storage Manager"
    destination: "Compliance and Telemetry Redactor"
    description: "Passes telemetry to"