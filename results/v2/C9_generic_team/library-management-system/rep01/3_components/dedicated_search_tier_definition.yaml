level: component
scope: "Component diagram for the Dedicated Search Tier container"
parentContainer:
  name: "Dedicated Search Tier"
elements:
  - type: "component"
    name: "Search Index Service"
    technology: "Search Infrastructure Engine with Versioned Indices"
    description: "Manages versioned search indices and executes low-latency search queries while guaranteeing a 99th-percentile response time under 800 ms."
  - type: "component"
    name: "Idempotent Event Consumer"
    technology: "Message Broker Consumer Handler"
    description: "Consumes catalog events asynchronously from the event bus with idempotent handlers to update search indices."
  - type: "component"
    name: "Resilience Handler"
    technology: "Circuit Breaker and Bulkhead Engine"
    description: "Provides thread pool isolation, load shedding, and graceful degradation for search requests and event processing."
  - type: "component"
    name: "Backup and Snapshot Manager"
    technology: "S3 API Client and HTTPS"
    description: "Manages strictly localized index backups and snapshots, transferring them securely to EU-certified object storage."
relationships:
  - source: "Resilience Handler"
    destination: "Search Index Service"
    description: "Protects search execution with circuit breakers and bulkhead patterns [In-process]"
  - source: "Idempotent Event Consumer"
    destination: "Search Index Service"
    description: "Applies catalog updates to indices [In-process]"
  - source: "Backup and Snapshot Manager"
    destination: "Search Index Service"
    description: "Reads index data for backups [In-process]"