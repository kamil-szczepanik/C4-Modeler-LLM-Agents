level: component
scope: "Component diagram for the Asynchronous Event Bus (Message Broker) container"
parentContainer:
  name: "Asynchronous Event Bus (Message Broker)"
elements:
  - type: "component"
    name: "Message Broker Core"
    technology: "AMQP / Kafka"
    description: "Handles asynchronous message distribution, decoupling core domain services from the search tier while ensuring EU-compliant event-driven synchronization."
  - type: "component"
    name: "Schema Registry"
    technology: "Avro / JSON Schema"
    description: "Enforces standardized message payload compatibility across publishers and consumers."
  - type: "component"
    name: "Transactional Outbox Processor"
    technology: "HTTP / gRPC"
    description: "Utilizes the transactional outbox pattern to reliably capture and publish updates from core domain services."
  - type: "component"
    name: "Security and Traceability Manager"
    technology: "TLS mTLS and W3C Trace Context headers"
    description: "Enforces topic-level authorization, secure transport, and enables distributed tracing across asynchronous message boundaries."
relationships:
  - source: "Core Domain Services"
    destination: "Message Broker Core"
    description: "publishes updates [AMQP/Kafka]"
  - source: "Message Broker Core"
    destination: "Dedicated Search Tier"
    description: "consumes events [Message Broker Protocol]"
  - source: "Core Domain Services"
    destination: "Transactional Outbox Processor"
    description: "utilizes transactional outbox pattern [HTTP/gRPC]"