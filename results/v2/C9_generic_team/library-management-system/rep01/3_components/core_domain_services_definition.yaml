level: component
scope: "Component diagram for the Core Domain Services container"
parentContainer:
  name: "Core Domain Services"
elements:
  - type: "component"
    name: "Cataloguing Controller"
    technology: "gRPC / REST"
    description: "Handles incoming requests related to cataloguing items within the library management system."
  - type: "component"
    name: "Circulation Controller"
    technology: "gRPC / REST"
    description: "Manages library circulation operations and user interactions."
  - type: "component"
    name: "Domain Service Logic"
    technology: "Hexagonal Architecture / Domain-Driven Design"
    description: "Encapsulates the core business rules and isolates domain logic from infrastructure."
relationships:
  - source: "Cataloguing Controller"
    destination: "Domain Service Logic"
    description: "Delegates cataloguing commands and queries"
  - source: "Circulation Controller"
    destination: "Domain Service Logic"
    description: "Delegates circulation operations"