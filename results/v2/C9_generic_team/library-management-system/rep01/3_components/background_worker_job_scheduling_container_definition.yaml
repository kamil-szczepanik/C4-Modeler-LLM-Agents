level: component
scope: "Component diagram for the Background Worker / Job Scheduling Container container"
parentContainer:
  name: "Background Worker / Job Scheduling Container"
elements:
  - type: "component"
    name: "Job Scheduler"
    technology: "Kubernetes CronJobs / Container Orchestration"
    description: "Executes scheduled tasks and batch data maintenance while enforcing EU-only data residency."
  - type: "component"
    name: "Distributed Lock Manager"
    technology: "Redis Caching Layer"
    description: "Acquires distributed locks to prevent duplicate concurrent execution of time-sensitive cron jobs."
  - type: "component"
    name: "Event Publisher / Consumer"
    technology: "Asynchronous Event Bus (Message Broker)"
    description: "Publishes and consumes scheduled job events using AMQP/Kafka with Dead Letter Queue (DLQ) processing."
  - type: "component"
    name: "Data Maintenance Handler"
    technology: "Relational Database / SQL"
    description: "Executes scheduled data maintenance and catalog/circulation processing against the primary transactional datastore."
relationships:
  - source: "Job Scheduler"
    destination: "Event Publisher / Consumer"
    description: "Publishes/consumes scheduled job events [AMQP/Kafka]"
  - source: "Job Scheduler"
    destination: "Distributed Lock Manager"
    description: "Acquires distributed locks [TCP/Redis Protocol]"
  - source: "Job Scheduler"
    destination: "Data Maintenance Handler"
    description: "Executes scheduled data maintenance [TCP/SQL]"