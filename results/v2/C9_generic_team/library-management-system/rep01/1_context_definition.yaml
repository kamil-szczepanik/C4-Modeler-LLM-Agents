level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Provides item cataloguing, circulation management, and self-service portals for public and academic libraries with strict EU data residency compliance and high-performance search capabilities."
elements:
  - type: "person"
    name: "Library Patrons and Staff"
    description: "Users who interact with the system for cataloguing, circulation, and self-service capabilities."
  - type: "externalSystem"
    name: "Self-Service Portals and Kiosks"
    description: "Interfaces used by patrons and staff to access library services."
  - type: "externalSystem"
    name: "API Gateway"
    description: "Manages and routes traffic to core domain services with enforced geo-routing."
  - type: "externalSystem"
    name: "Core Domain Services"
    description: "Core business logic services managing cataloguing and circulation."
  - type: "externalSystem"
    name: "Dedicated Search Tier"
    description: "High-performance search tier achieving < 800ms p99 latency."
  - type: "externalSystem"
    name: "Primary Transactional Datastore"
    description: "Stores transactional data securely within the EU."
  - type: "externalSystem"
    name: "EU-certified Secrets Management Vault"
    description: "Secures storage and rotation of credentials, API keys, and certificates."
relationships:
  - source: "Library Patrons and Staff"
    destination: "Self-Service Portals and Kiosks"
    description: "accesses portals via HTTPS"
    technology: "HTTPS"
  - source: "Self-Service Portals and Kiosks"
    destination: "API Gateway"
    description: "communicates using OpenAPI-defined REST contracts"
    technology: "OpenAPI/REST"
  - source: "API Gateway"
    destination: "Core Domain Services"
    description: "routes traffic with enforced geo-routing"
    technology: "HTTPS"
  - source: "Core Domain Services"
    destination: "Dedicated Search Tier"
    description: "queries for catalogue searches achieving < 800ms p99 latency"
    technology: "Network Protocol"
  - source: "Core Domain Services"
    destination: "Primary Transactional Datastore"
    description: "persists transactional data strictly within the EU"
    technology: "Database Protocol"