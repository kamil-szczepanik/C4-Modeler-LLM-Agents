level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons and Staff"
    description: "Users who interact with the system for cataloguing, circulation, and self-service capabilities."
  - type: "container"
    name: "Self-Service Portals and Kiosks"
    technology: "Web/Mobile UI"
    description: "Interfaces used by patrons and staff to access library services."
  - type: "container"
    name: "API Gateway"
    technology: "API Gateway / HTTP/REST"
    description: "Manages and routes traffic to internal services with enforced geo-routing."
  - type: "container"
    name: "API Composition / BFF Container"
    technology: "HTTP/REST, OpenAPI"
    description: "Orchestrates client requests and payload shaping for front-end portals."
  - type: "container"
    name: "Core Domain Services"
    technology: "Microservices / gRPC / REST"
    description: "Core business logic services managing cataloguing and circulation."
  - type: "container"
    name: "Dedicated Search Tier"
    technology: "Search Infrastructure"
    description: "High-performance search tier achieving < 800ms p99 latency."
  - type: "container"
    name: "Primary Transactional Datastore"
    technology: "Relational Database / SQL"
    description: "Stores transactional data securely within the EU."
  - type: "container"
    name: "Caching Layer (Redis)"
    technology: "Redis / In-memory"
    description: "In-memory read acceleration of item availability and patron accounts."
  - type: "container"
    name: "Asynchronous Event Bus (Message Broker)"
    technology: "AMQP / Kafka"
    description: "Ensures decoupled, EU-compliant event-driven synchronization."
  - type: "container"
    name: "Observability & Logging Container"
    technology: "Centralized metrics, tracing, log aggregation"
    description: "Monitors system health with PII masking."
  - type: "container"
    name: "Data Migration and Backup Container"
    technology: "Backup & Migration tooling"
    description: "Manages data migration and backups within EU residency rules."
  - type: "container"
    name: "Configuration & Feature Management Container"
    technology: "Feature flags & Configuration service"
    description: "Manages dynamic configuration and feature flags."
  - type: "container"
    name: "Background Worker / Job Scheduling Container"
    technology: "Job Scheduler / Worker"
    description: "Executes scheduled tasks against core domain services and primary datastore."
  - type: "externalSystem"
    name: "EU-certified Secrets Management Vault"
    description: "Secures storage and rotation of credentials, API keys, and certificates."
relationships:
  - source: "Library Patrons and Staff"
    destination: "Self-Service Portals and Kiosks"
    description: "accesses portals via HTTPS"
    technology: "HTTPS"
  - source: "Self-Service Portals and Kiosks"
    destination: "API Gateway"
    description: "communicates using HTTPS/REST"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "API Composition / BFF Container"
    description: "routes client traffic to BFF"
    technology: "HTTP/REST"
  - source: "API Composition / BFF Container"
    destination: "Core Domain Services"
    description: "interacts with core services"
    technology: "gRPC/REST"
  - source: "Core Domain Services"
    destination: "Caching Layer (Redis)"
    description: "queries caching layer"
    technology: "TCP/SQL"
  - source: "Core Domain Services"
    destination: "Primary Transactional Datastore"
    description: "queries primary transactional datastore"
    technology: "TCP/SQL"
  - source: "Core Domain Services"
    destination: "Asynchronous Event Bus (Message Broker)"
    description: "publishes updates to event bus"
    technology: "AMQP/Kafka"
  - source: "Asynchronous Event Bus (Message Broker)"
    destination: "Dedicated Search Tier"
    description: "consumes events to update search indices"
    technology: "Message Broker Protocol"
  - source: "Background Worker / Job Scheduling Container"
    destination: "Core Domain Services"
    description: "executes scheduled tasks"
    technology: "Internal Protocol"
  - source: "Background Worker / Job Scheduling Container"
    destination: "Primary Transactional Datastore"
    description: "executes scheduled data maintenance"
    technology: "TCP/SQL"