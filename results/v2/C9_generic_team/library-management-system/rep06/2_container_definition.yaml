level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Patrons and Library Staff"
    description: "Human users who interact with the system to catalogue items, manage circulation, and use self-service portals."
  - type: "externalSystem"
    name: "External Identity Providers (SSO/OAuth)"
    description: "External systems providing authentication services via OIDC/OAuth."
  - type: "externalSystem"
    name: "Payment Gateways"
    description: "External systems used for processing fees."
  - type: "externalSystem"
    name: "External Archival/Reporting System"
    description: "External systems that receive compliance data exports via secure batch transfers."
  - type: "container"
    name: "Client-Side SPA/Mobile Container"
    description: "Self-service portals and staff apps used by patrons and library staff."
    technology: "Web/Mobile Technologies"
  - type: "container"
    name: "API Gateway Container"
    description: "Handles rate limiting, TLS termination, and JWT validation."
    technology: "NGINX / Kong"
  - type: "container"
    name: "Core Business Logic / Circulation API Container"
    description: "Handles core business logic and circulation management."
    technology: "Microservice / API Runtime"
  - type: "container"
    name: "Search Engine Container"
    description: "Provides sub-800ms search performance for catalog items."
    technology: "Elasticsearch / OpenSearch"
  - type: "container"
    name: "Data Access Layer / Persistence Container"
    description: "Stores relational data, deployed exclusively within EU regions for data residency."
    technology: "PostgreSQL"
  - type: "container"
    name: "Asynchronous Message Broker Container"
    description: "Handles decoupled event-driven processing."
    technology: "RabbitMQ / Kafka"
  - type: "container"
    name: "Background Workers Container"
    description: "Processes asynchronous background tasks via event subscription."
    technology: "Background Worker Runtime"
  - type: "container"
    name: "Configuration & Secrets Management Container"
    description: "Manages secure credentials and configuration."
    technology: "HashiCorp Vault"
  - type: "container"
    name: "Centralized Observability Container"
    description: "Monitors system health, logs, and metrics."
    technology: "Observability Platform"
relationships:
  - source: "Patrons and Library Staff"
    destination: "Client-Side SPA/Mobile Container"
    description: "Interacts with self-service portals and staff apps"
    technology: "HTTPS"
  - source: "Client-Side SPA/Mobile Container"
    destination: "API Gateway Container"
    description: "Sends API requests"
    technology: "HTTPS (REST/GraphQL)"
  - source: "API Gateway Container"
    destination: "Core Business Logic / Circulation API Container"
    description: "Routes verified API requests"
    technology: "internal gRPC/HTTP"
  - source: "Core Business Logic / Circulation API Container"
    destination: "Search Engine Container"
    description: "Queries and indexes catalog data for fast search"
    technology: "REST/gRPC"
  - source: "Core Business Logic / Circulation API Container"
    destination: "Data Access Layer / Persistence Container"
    description: "Reads and writes relational data"
    technology: "TLS"
  - source: "Core Business Logic / Circulation API Container"
    destination: "Asynchronous Message Broker Container"
    description: "Publishes domain events"
    technology: "AMQP/Kafka Protocol"
  - source: "Asynchronous Message Broker Container"
    destination: "Background Workers Container"
    description: "Consumes events via subscription"
    technology: "Event Subscription"
  - source: "External Identity Providers (SSO/OAuth)"
    destination: "API Gateway Container"
    description: "Authenticates users"
    technology: "OAuth2/OIDC"
  - source: "Payment Gateways"
    destination: "API Gateway Container"
    description: "Sends payment notifications"
    technology: "HTTPS Webhooks"