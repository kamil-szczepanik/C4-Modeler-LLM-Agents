level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A solution for public and academic libraries to catalogue items and manage circulation, providing self-service portals while enforcing strict EU-only data residency."
elements:
  - type: "person"
    name: "Patrons and Library Staff"
    description: "Human users who interact with the system to catalogue items, manage circulation, and use self-service portals."
  - type: "externalSystem"
    name: "External Identity Providers (SSO/OAuth)"
    description: "External systems providing authentication services via OIDC/OAuth."
  - type: "externalSystem"
    name: "Payment Gateways"
    description: "External systems used for processing fees."
  - type: "externalSystem"
    name: "External Archival/Reporting System"
    description: "External systems that receive compliance data exports via secure batch transfers."
relationships:
  - source: "Patrons and Library Staff"
    destination: "Library Management System"
    description: "Interact via API Gateway and self-service portals"
    technology: "HTTPS"
  - source: "Library Management System"
    destination: "External Identity Providers (SSO/OAuth)"
    description: "Authenticates users via federation"
    technology: "OIDC / OAuth 2.0"
  - source: "Library Management System"
    destination: "Payment Gateways"
    description: "Processes fees"
    technology: "HTTPS"
  - source: "Library Management System"
    destination: "External Archival/Reporting System"
    description: "Exports compliance data"
    technology: "Secure Batch Transfers"