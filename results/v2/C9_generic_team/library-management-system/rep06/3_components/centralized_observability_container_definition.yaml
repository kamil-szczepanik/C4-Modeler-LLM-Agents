level: component
scope: "Component diagram for the Centralized Observability Container container"
parentContainer:
  name: "Centralized Observability Container"
elements:
  - type: "component"
    name: "OpenTelemetry Collector"
    technology: "OpenTelemetry (OTel)"
    description: "Ingests metrics, logs, and traces asynchronously from upstream containers using OTel protocols with EU-only data residency and PII scrubbing."
  - type: "component"
    name: "Observability Platform Backend"
    technology: "Observability Platform"
    description: "Processes and stores telemetry data, managing sliding-window retention and supporting dashboards and alert rules managed via Infrastructure-as-Code."
relationships:
  - source: "OpenTelemetry Collector"
    destination: "Observability Platform Backend"
    description: "Forwards ingested metrics, logs, and traces for processing and storage"