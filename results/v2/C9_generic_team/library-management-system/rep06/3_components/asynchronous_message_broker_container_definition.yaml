level: component
scope: "Component diagram for the Asynchronous Message Broker Container container"
parentContainer:
  name: "Asynchronous Message Broker Container"
elements:
  - type: "component"
    name: "Message Broker Core"
    technology: "RabbitMQ / Kafka"
    description: "Handles asynchronous message brokering for decoupled event-driven processing and high throughput."
  - type: "component"
    name: "Schema Registry"
    technology: "Avro / JSON Schema"
    description: "Manages schema contracts for domain event versioning and compatibility."
  - type: "component"
    name: "Broker Security Manager"
    technology: "HashiCorp Vault"
    description: "Manages configuration and secrets for secure broker access."
relationships:
  - source: "Message Broker Core"
    destination: "Schema Registry"
    description: "Validates event schemas against [Avro / JSON Schema]"
  - source: "Message Broker Core"
    destination: "Broker Security Manager"
    description: "Retrieves access credentials via [TLS encryption]"