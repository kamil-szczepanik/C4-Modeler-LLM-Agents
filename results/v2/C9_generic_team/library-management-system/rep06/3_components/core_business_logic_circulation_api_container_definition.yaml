level: component
scope: "Component diagram for the Core Business Logic / Circulation API Container container"
parentContainer:
  name: "Core Business Logic / Circulation API Container"
elements:
  - type: "component"
    name: "Loan Aggregate Component"
    technology: "Domain-Driven Design / Microservice / API Runtime"
    description: "Manages core domain operations for loans and circulation logic adhering to strict EU data residency constraints."
  - type: "component"
    name: "Patron Aggregate Component"
    technology: "Domain-Driven Design / Microservice / API Runtime"
    description: "Manages patron domain data and behaviors within the core business logic."
  - type: "component"
    name: "Item Aggregate Component"
    technology: "Domain-Driven Design / Microservice / API Runtime"
    description: "Manages item cataloging and inventory domain logic."
  - type: "component"
    name: "API Controller / Endpoint Component"
    technology: "OpenAPI / Protobuf / gRPC / HTTP"
    description: "Exposes contract-first APIs and routes verified requests for domain execution."
  - type: "component"
    name: "Data Access Repository Component"
    technology: "Repository Pattern / Dependency Injection / TLS"
    description: "Decouples core domain logic from persistence and reads/writes relational data securely."
  - type: "component"
    name: "Event Publisher Component"
    technology: "AMQP / Kafka Protocol"
    description: "Publishes explicit domain events to the asynchronous message broker."
relationships:
  - source: "API Controller / Endpoint Component"
    destination: "Loan Aggregate Component"
    description: "Routes verified API requests to loan domain logic"
  - source: "API Controller / Endpoint Component"
    destination: "Patron Aggregate Component"
    description: "Routes verified API requests to patron domain logic"
  - source: "API Controller / Endpoint Component"
    destination: "Item Aggregate Component"
    description: "Routes verified API requests to item domain logic"
  - source: "Loan Aggregate Component"
    destination: "Data Access Repository Component"
    description: "Reads and writes relational data over TLS"
  - source: "Patron Aggregate Component"
    destination: "Data Access Repository Component"
    description: "Reads and writes relational data over TLS"
  - source: "Item Aggregate Component"
    destination: "Data Access Repository Component"
    description: "Reads and writes relational data over TLS"
  - source: "Loan Aggregate Component"
    destination: "Event Publisher Component"
    description: "Publishes domain events"