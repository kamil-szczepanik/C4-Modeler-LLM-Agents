level: component
scope: "Component diagram for the API Gateway Container container"
parentContainer:
  name: "API Gateway Container"
elements:
  - type: "component"
    name: "Perimeter Security & TLS Termination Component"
    technology: "NGINX / Kong"
    description: "Manages perimeter security, TLS termination, and JWT validation."
  - type: "component"
    name: "Routing & Resilience Component"
    technology: "NGINX / Kong"
    description: "Handles request routing, fail-open rate limiting, and token-based residency claims."
  - type: "component"
    name: "Rate-Limit State Cache Component"
    technology: "Redis"
    description: "Maintains partitioned rate-limit state caching to support performance."
relationships:
  - source: "Perimeter Security & TLS Termination Component"
    destination: "Routing & Resilience Component"
    description: "Passes authenticated and validated requests"
  - source: "Routing & Resilience Component"
    destination: "Rate-Limit State Cache Component"
    description: "Checks and updates rate-limit states"