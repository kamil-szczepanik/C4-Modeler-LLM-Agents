level: component
scope: "Component diagram for the Core Transactional Service Container container"
parentContainer:
  name: "Core Transactional Service Container"
elements:
  - type: "component"
    name: "Circulation and Cataloguing Module"
    technology: "Domain-Driven Design (DDD)"
    description: "Handles core business logic and modular monolith boundaries for circulation and cataloguing."
  - type: "component"
    name: "Transactional Outbox Processor"
    technology: "Transactional Outbox Pattern"
    description: "Ensures reliable event publishing without dual-write inconsistencies."
  - type: "component"
    name: "Concurrency Control Manager"
    technology: "Optimistic Concurrency Control"
    description: "Handles high-contention item checkouts via version columns."
relationships:
  - source: "Circulation and Cataloguing Module"
    destination: "Transactional Outbox Processor"
    description: "Persists events for reliable publishing"
  - source: "Circulation and Cataloguing Module"
    destination: "Concurrency Control Manager"
    description: "Manages checkout consistency and versions"