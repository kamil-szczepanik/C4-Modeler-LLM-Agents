level: component
scope: "Component diagram for the Distributed Cache Container container"
parentContainer:
  name: "Distributed Cache Container"
elements:
  - type: "component"
    name: "Redis Cache Engine"
    technology: "Redis, AOF/RDB Persistence, Redis Protocol with TLS"
    description: "High-throughput, low-latency caching engine providing sub-800ms search performance and EU data residency compliance."
  - type: "component"
    name: "Cache Management and Resilience Module"
    technology: "Resilience4j / Polly, Protocol Buffers / Compressed JSON"
    description: "Handles connection pooling, circuit breaking, cache stampede prevention, and efficient payload serialization."
  - type: "component"
    name: "Telemetry and Testing Adapter"
    technology: "Testcontainers"
    description: "Exports telemetry and metrics to the monitoring service and supports automated integration testing of caching logic."
relationships:
  - source: "Core Transactional Service Container"
    destination: "Redis Cache Engine"
    description: "Caches and retrieves fast data [Redis Protocol with TLS]"
  - source: "Redis Cache Engine"
    destination: "Enterprise Logging and Monitoring Service"
    description: "Exports telemetry and metrics"