# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the API Gateway / BFF Container container"
parentContainer:
  name: "API Gateway / BFF Container"
elements:
  # Components within the parent container's boundary
  - type: "component"
    name: "Routing Engine"
    technology: "Custom routing engine with declarative configuration"
    description: "Handles client requests, route optimization, and traffic management."
  - type: "component"
    name: "Authentication Validator"
    technology: "OAuth2/OIDC integrated"
    description: "Secures traffic and validates authentication tokens for incoming requests."
  - type: "component"
    name: "Session Manager"
    technology: "Redis client"
    description: "Offloads session state and caching to the distributed cache."
relationships:
  - source: "Routing Engine"
    destination: "Core Transactional Service Container"
    description: "Routes requests [Internal REST/gRPC]"
  - source: "Routing Engine"
    destination: "Search Service Container"
    description: "Routes search queries [Internal REST/gRPC]"
  - source: "Session Manager"
    destination: "Distributed Cache Container (Redis)"
    description: "Offloads session state and caching [TCP]"