level: component
scope: "Component diagram for the Search Service Container container"
parentContainer:
  name: "Search Service Container"
elements:
  - type: "component"
    name: "Search Controller"
    technology: "HTTP REST API Framework"
    description: "Receives and validates incoming search queries from the Web App Container."
  - type: "component"
    name: "Indexing Consumer"
    technology: "Message Consumer / Event Handler"
    description: "Consumes asynchronous events from the Message Broker Container for real-time indexing."
  - type: "component"
    name: "Search Engine Core"
    technology: "Elasticsearch / OpenSearch"
    description: "Delivers fast, scalable search functionality ensuring 99th-percentile responses under 800ms."
  - type: "component"
    name: "Cache Manager"
    technology: "Redis Client"
    description: "Interacts with the Distributed Cache Container to cache frequent catalogue lookups."
  - type: "component"
    name: "Backup Service"
    technology: "HTTPS Storage Client"
    description: "Stores automated index snapshots to EU-Hosted Backup and Archival Storage."
relationships:
  - source: "Search Controller"
    destination: "Search Engine Core"
    description: "Executes search queries [HTTP]"
  - source: "Indexing Consumer"
    destination: "Search Engine Core"
    description: "Indexes incoming event payloads [Asynchronous Message Stream]"
  - source: "Search Controller"
    destination: "Cache Manager"
    description: "Checks and stores frequent catalogue lookups [TCP]"
  - source: "Search Engine Core"
    destination: "Backup Service"
    description: "Triggers automated index snapshots [HTTPS]"