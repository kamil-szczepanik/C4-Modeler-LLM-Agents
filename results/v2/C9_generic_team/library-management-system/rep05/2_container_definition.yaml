level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Patrons"
    description: "Self-service portal users who interact with the system via HTTPS."
  - type: "person"
    name: "Staff"
    description: "Library staff who interact with the system via HTTPS."
  - type: "person"
    name: "Librarians"
    description: "Librarians managing cataloging and circulation."
  - type: "person"
    name: "System Administrators"
    description: "Personnel responsible for managing and operating the system."
  - type: "externalSystem"
    name: "External Legacy ILS"
    description: "Legacy Integrated Library System that syncs with workers."
  - type: "externalSystem"
    name: "Identity Providers"
    description: "External identity services for authentication."
  - type: "externalSystem"
    name: "Payment Gateways"
    description: "External services for processing payments."
  - type: "externalSystem"
    name: "WAF"
    description: "Web Application Firewall providing protection."
  - type: "container"
    name: "API Gateway / BFF Container"
    description: "Routes requests and acts as a backend-for-frontend."
    technology: "API Gateway / BFF"
  - type: "container"
    name: "Web App Container"
    description: "Provides cataloging, circulation, and self-service portals."
    technology: "Web Application Framework"
  - type: "container"
    name: "Core Transactional Service Container"
    description: "Handles core business transactions and logic."
    technology: "Microservice / REST / gRPC"
  - type: "container"
    name: "Search Service Container"
    description: "Provides fast search functionality meeting sub-800ms requirements."
    technology: "Elasticsearch / OpenSearch"
  - type: "container"
    name: "Message Broker Container"
    description: "Decouples writes and maintains indexing consistency asynchronously."
    technology: "RabbitMQ / Kafka"
  - type: "container"
    name: "Distributed Cache Container"
    description: "Maintains stateless application tiers and fast data access."
    technology: "Redis"
  - type: "container"
    name: "Worker / Background Task Container"
    description: "Handles background processing and syncing tasks."
    technology: "Worker / Background Processor"
  - type: "container"
    name: "Observability Sidecars"
    description: "Provides monitoring and telemetry for containers."
    technology: "Observability Sidecar"
relationships:
  - source: "Patrons"
    destination: "API Gateway / BFF Container"
    description: "Communicate via HTTPS"
    technology: "HTTPS"
  - source: "Staff"
    destination: "API Gateway / BFF Container"
    description: "Communicate via HTTPS"
    technology: "HTTPS"
  - source: "Librarians"
    destination: "API Gateway / BFF Container"
    description: "Communicate via HTTPS"
    technology: "HTTPS"
  - source: "System Administrators"
    destination: "API Gateway / BFF Container"
    description: "Communicate via HTTPS"
    technology: "HTTPS"
  - source: "API Gateway / BFF Container"
    destination: "Web App Container"
    description: "Routes requests"
    technology: "Internal REST/gRPC"
  - source: "API Gateway / BFF Container"
    destination: "Core Transactional Service Container"
    description: "Routes requests"
    technology: "Internal REST/gRPC"
  - source: "Core Transactional Service Container"
    destination: "Message Broker Container"
    description: "Publishes events"
    technology: "AMQP/Kafka protocol"
  - source: "Message Broker Container"
    destination: "Search Service Container"
    description: "Consumes events for indexing"
    technology: "Asynchronous Message Stream"
  - source: "Web App Container"
    destination: "Search Service Container"
    description: "Serves search queries"
    technology: "HTTP"
  - source: "Core Transactional Service Container"
    destination: "Distributed Cache Container"
    description: "Caches and retrieves fast data"
    technology: "Redis Protocol"
  - source: "Worker / Background Task Container"
    destination: "External Legacy ILS"
    description: "Syncs with legacy systems"
    technology: "Scheduled Batch Protocols"
  - source: "API Gateway / BFF Container"
    destination: "Identity Providers"
    description: "Authenticates users"
    technology: "OAuth2/OIDC"
  - source: "API Gateway / BFF Container"
    destination: "Payment Gateways"
    description: "Processes transactions"
    technology: "HTTPS"
  - source: "WAF"
    destination: "API Gateway / BFF Container"
    description: "Inspects and filters traffic"
    technology: "HTTPS"