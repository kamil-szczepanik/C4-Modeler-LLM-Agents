level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A solution for public and academic libraries to catalogue items, manage circulation, and provide self-service portals, adhering strictly to EU-only data residency constraints."
elements:
  - type: "person"
    name: "Patrons"
    description: "Self-service portal users who interact with the system via HTTPS through Edge/WAF."
  - type: "person"
    name: "Staff and Librarians"
    description: "Users who access core domain services via HTTPS."
  - type: "person"
    name: "System Administrator / Operations"
    description: "Personnel responsible for managing and operating the system."
  - type: "externalSystem"
    name: "Legacy ILS / Campus ERP Systems"
    description: "Legacy systems that sync with the core software system via REST/SOAP APIs."
  - type: "externalSystem"
    name: "Identity Providers and Payment Gateways"
    description: "External services that integrate with the system via OAuth2/OIDC for identity federation."
  - type: "externalSystem"
    name: "Edge / WAF"
    description: "Web Application Firewall providing DDoS protection and latency optimization."
  - type: "externalSystem"
    name: "Enterprise Logging and Monitoring Service"
    description: "Service used for system logging and monitoring."
  - type: "externalSystem"
    name: "EU-Hosted Backup and Archival Storage"
    description: "EU-hosted infrastructure for backup and archival storage."
  - type: "externalSystem"
    name: "Network Time Protocol (NTP) service"
    description: "Service used for time synchronization across the system."
relationships:
  - source: "Patrons"
    destination: "Library Management System"
    description: "Interact with the self-service portal"
    technology: "HTTPS via Edge/WAF"
  - source: "Staff and Librarians"
    destination: "Library Management System"
    description: "Access core domain services"
    technology: "HTTPS"
  - source: "Library Management System"
    destination: "Legacy ILS / Campus ERP Systems"
    description: "Syncs data with legacy and campus systems"
    technology: "REST/SOAP APIs"
  - source: "Library Management System"
    destination: "Identity Providers and Payment Gateways"
    description: "Integrates for identity federation"
    technology: "OAuth2/OIDC"
  - source: "Library Management System"
    destination: "EU-Hosted Backup and Archival Storage"
    description: "Communicates with backup storage for data retention"
    technology: "Encrypted transport protocols"