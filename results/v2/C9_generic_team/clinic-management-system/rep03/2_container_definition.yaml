level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients, Clinicians, and Administrative Staff"
    description: "Users who interact with the system to manage patient admissions, electronic medical records, scheduling, and billing."
  - type: "externalSystem"
    name: "External Identity Providers (IdPs)"
    description: "Provides Multi-Factor Authentication and OpenID Connect (OIDC) authentication for system users."
  - type: "externalSystem"
    name: "Third-Party Billing Gateways"
    description: "External systems used to process financial transactions and billing."
  - type: "externalSystem"
    name: "HL7 FHIR-Compliant Lab/Imaging Systems"
    description: "External clinical systems integrated via HL7 FHIR REST APIs for lab and imaging data."
  - type: "container"
    name: "API Gateway Container"
    technology: "Kubernetes Ingress / Custom Proxy"
    description: "Unified routing and multi-factor authentication (MFA) enforcement."
  - type: "container"
    name: "Domain Containers"
    technology: "Microservices / Kubernetes"
    description: "EMR, Scheduling, and Billing microservices."
  - type: "container"
    name: "Integration Service Container"
    technology: "Asynchronous Worker"
    description: "Asynchronous HL7 FHIR traffic handler."
  - type: "container"
    name: "Event Bus / Message Broker Container"
    technology: "Apache Kafka or RabbitMQ"
    description: "Asynchronous messaging and event-driven communication."
  - type: "container"
    name: "Caching Container"
    technology: "Redis Enterprise"
    description: "Demographic and schedule data caching for sub-second retrieval."
  - type: "container"
    name: "File/Document Storage Container"
    technology: "Object Storage with WORM support"
    description: "Storage for clinical imaging and PDFs with strict retention policies."
  - type: "container"
    name: "Data Archival & Purging Container"
    technology: "Background Worker"
    description: "10-year data retention management and automated archival."
  - type: "container"
    name: "Observability & Configuration Container"
    technology: "Prometheus, Fluentbit, Secret Manager"
    description: "Centralized logging, distributed tracing, and secrets management."
relationships:
  - source: "Patients, Clinicians, and Administrative Staff"
    destination: "API Gateway Container"
    description: "Secure user access and MFA enforcement"
    technology: "HTTPS/MFA"
  - source: "API Gateway Container"
    destination: "Domain Containers"
    description: "Internal microservice routing"
    technology: "gRPC/REST"
  - source: "Domain Containers"
    destination: "Event Bus / Message Broker Container"
    description: "Decoupled event publishing"
    technology: "AMQP/Kafka"
  - source: "Integration Service Container"
    destination: "HL7 FHIR-Compliant Lab/Imaging Systems"
    description: "Lab and imaging data exchange"
    technology: "HL7 FHIR REST/JSON"
  - source: "Domain Containers"
    destination: "Caching Container"
    description: "Sub-second data retrieval"
    technology: "Redis Protocol"
  - source: "Clinic Management System"
    destination: "External Identity Providers (IdPs)"
    description: "Authenticate users"
    technology: "OpenID Connect"
  - source: "Clinic Management System"
    destination: "Third-Party Billing Gateways"
    description: "Process financial transactions"
    technology: "REST APIs"