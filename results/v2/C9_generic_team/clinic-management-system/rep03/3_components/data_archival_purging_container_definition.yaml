level: component
scope: "Component diagram for the Data Archival & Purging Container container"
parentContainer:
  name: "Data Archival & Purging Container"
elements:
  - type: "component"
    name: "Archival Extractor Worker"
    technology: "Background Worker / Go or Python"
    description: "Extracts historical data from primary databases based on the strict 10-year data retention mandate."
  - type: "component"
    name: "Checksum Validator"
    technology: "SHA-256 Hashing Library"
    description: "Validates extracted historical data integrity via SHA-256 checksums before transfer."
  - type: "component"
    name: "WORM Storage Client"
    technology: "Object Storage SDK / HTTPS"
    description: "Transfers validated historical data to File/Document Storage Container with WORM support."
relationships:
  - source: "Archival Extractor Worker"
    destination: "Checksum Validator"
    description: "Sends extracted historical data for integrity validation"
  - source: "Checksum Validator"
    destination: "WORM Storage Client"
    description: "Transfers validated data for immutable storage"