level: component
scope: "Component diagram for the Integration Service Container container"
parentContainer:
  name: "Integration Service Container"
elements:
  - type: "component"
    name: "HL7 FHIR Worker"
    technology: "Asynchronous Worker / Streaming JSON Parsers"
    description: "Processes HL7 FHIR traffic and external system interactions with memory-efficient payload parsing."
  - type: "component"
    name: "Circuit Breaker & DLQ Handler"
    technology: "Circuit Breaker & Dead-Letter Queue (DLQ)"
    description: "Handles errors and external communication failures with PII/PHI sanitization."
  - type: "component"
    name: "Transactional Outbox Dispatcher"
    technology: "Transactional Outbox Pattern"
    description: "Ensures atomic state changes and message dispatches to prevent split-brain issues."
relationships:
  - source: "HL7 FHIR Worker"
    destination: "Circuit Breaker & DLQ Handler"
    description: "Routes failed external calls and sanitizes errors via [Circuit Breaker/DLQ]"
  - source: "Transactional Outbox Dispatcher"
    destination: "HL7 FHIR Worker"
    description: "Dispatches atomic state changes and messages via [AMQP/TCP or Kafka Protocol]"