level: component
scope: "Component diagram for the Domain Containers container"
parentContainer:
  name: "Domain Containers"
elements:
  - type: "component"
    name: "EMR Service"
    technology: "Microservice / gRPC / REST"
    description: "Manages electronic medical records, patient admissions, and clinical data."
  - type: "component"
    name: "Scheduling Service"
    technology: "Microservice / gRPC / REST"
    description: "Handles appointments, practitioner schedules, and resource allocation."
  - type: "component"
    name: "Billing Service"
    technology: "Microservice / gRPC / REST"
    description: "Processes financial operations, invoices, and third-party billing integrations."
relationships:
  - source: "EMR Service"
    destination: "Scheduling Service"
    description: "Coordinates patient appointments and medical history access via gRPC/REST"
  - source: "Scheduling Service"
    destination: "Billing Service"
    description: "Triggers billing workflows upon appointment completion via gRPC/REST"