level: component
scope: "Component diagram for the API Gateway Container container"
parentContainer:
  name: "API Gateway Container"
elements:
  - type: "component"
    name: "Ingress Proxy & Routing Component"
    technology: "Kubernetes Ingress / Custom Proxy"
    description: "Handles secure user access, HTTPS/MFS enforcement, and internal microservice routing via gRPC/REST."
  - type: "component"
    name: "Authentication & Token Validation Component"
    technology: "OAuth2 / JWT & W3C Trace Context"
    description: "Performs token introspection and JWT validation via HTTPS with External Identity Providers (IdPs)."
  - type: "component"
    name: "Rate Limiting & Session Management Component"
    technology: "Redis Enterprise"
    description: "Manages session persistence, distributed rate limiting, and idempotency tracking via TCP."
relationships:
  - source: "Ingress Proxy & Routing Component"
    destination: "Authentication & Token Validation Component"
    description: "Validates incoming tokens and enforces security"
  - source: "Ingress Proxy & Routing Component"
    destination: "Rate Limiting & Session Management Component"
    description: "Tracks session persistence and distributed rate limiting via TCP"