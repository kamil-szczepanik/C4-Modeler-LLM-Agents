level: component
scope: "Component diagram for the Observability & Configuration Container container"
parentContainer:
  name: "Observability & Configuration Container"
elements:
  - type: "component"
    name: "Prometheus & OpenTelemetry"
    technology: "Prometheus & OpenTelemetry"
    description: "Standardized metric scraping, distributed tracing, and health probe monitoring."
  - type: "component"
    name: "Fluentbit"
    technology: "Fluentbit"
    description: "Edge log aggregation featuring automated PII/PHI payload masking and disk-backed local buffering."
  - type: "component"
    name: "Secret Manager"
    technology: "Dedicated sidecar/initialization plane"
    description: "Decoupled secret management plane ensuring isolated and secure credential handling."
  - type: "component"
    name: "Configuration Agent"
    technology: "JSON Schema / Protocol Buffers"
    description: "Manages hot-reloaded configurations with immutable, tamper-resistant version tagging."
  - type: "component"
    name: "Local Disk Buffers (EmptyDir)"
    technology: "Kubernetes EmptyDir"
    description: "Temporary storage for fault-tolerant telemetry backpressure during network partitions."
relationships:
  - source: "Prometheus & OpenTelemetry"
    destination: "Local Disk Buffers (EmptyDir)"
    description: "Buffers telemetry data locally"
  - source: "Fluentbit"
    destination: "Local Disk Buffers (EmptyDir)"
    description: "Buffers scrubbed logs locally"
  - source: "Configuration Agent"
    destination: "Secret Manager"
    description: "Coordinates configuration and secure secrets"