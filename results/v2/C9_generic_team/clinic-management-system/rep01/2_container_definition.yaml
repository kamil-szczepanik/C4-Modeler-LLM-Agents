# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients, Practitioners, and Billing Staff"
    description: "System users who interface with the platform to manage administration, clinical workflows, and billing."
  - type: "externalSystem"
    name: "External Lab and Imaging Systems"
    description: "External healthcare systems that integrate via HL7 FHIR APIs to exchange clinical data."
  - type: "container"
    name: "API Gateway / Reverse Proxy Container"
    technology: "Reverse Proxy / API Gateway"
    description: "Unified ingress boundary handling incoming HTTPS and MFA traffic."
  - type: "container"
    name: "Core Domain Containers"
    technology: "Microservices / Kubernetes"
    description: "Handles Patient Registration, Scheduling, EMR, and Billing subsystems."
  - type: "container"
    name: "Integration Engine Container"
    technology: "HL7 FHIR translator"
    description: "Translates and connects core domains to external lab and imaging systems using HL7 FHIR APIs."
  - type: "container"
    name: "Data Access & Governance Container Layer"
    technology: "Storage Management Layer with AES-256"
    description: "Exclusive storage query router ensuring data security and compliance."
  - type: "container"
    name: "Asynchronous Event Bus Container"
    technology: "Kafka / RabbitMQ"
    description: "Durable messaging backbone for decoupled, asynchronous inter-subsystem communication using AsyncAPI event payloads."
  - type: "container"
    name: "Shared Observability & Telemetry Container"
    technology: "Prometheus, Fluentbit, OpenTelemetry"
    description: "Distributed tracing, metrics, and immutable audit logs."
  - type: "container"
    name: "Configuration and Secrets Management Container / Sidecar"
    technology: "Vault / Kubernetes Secrets"
    description: "Cryptographic key and config store implementing secure secret management."
relationships:
  - source: "Patients, Practitioners, and Billing Staff"
    destination: "API Gateway / Reverse Proxy Container"
    description: "Access the system via HTTPS/MFA"
    technology: "HTTPS, MFA"
  - source: "API Gateway / Reverse Proxy Container"
    destination: "Core Domain Containers"
    description: "Routes ingress traffic to core domain services"
    technology: "HTTPS"
  - source: "Core Domain Containers"
    destination: "Asynchronous Event Bus Container"
    description: "Communicate asynchronously using event payloads"
    technology: "AsyncAPI, Kafka / RabbitMQ"
  - source: "Integration Engine Container"
    destination: "External Lab and Imaging Systems"
    description: "Connects to external systems for clinical data exchange"
    technology: "HL7 FHIR APIs"
  - source: "Core Domain Containers"
    destination: "Data Access & Governance Container Layer"
    description: "Route storage queries exclusively through the governance layer"
    technology: "AES-256 Encryption"