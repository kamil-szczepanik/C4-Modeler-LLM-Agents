# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the API Gateway / Reverse Proxy Container container"
parentContainer:
  name: "API Gateway / Reverse Proxy Container"
elements:
  - type: "component"
    name: "Edge Routing & TLS Termination Component"
    technology: "Reverse Proxy / Ingress Controller"
    description: "Handles incoming HTTPS traffic, performs TLS termination, and routes validated requests to appropriate downstream microservices."
  - type: "component"
    name: "Schema Validation & Security Component"
    technology: "API Gateway Middleware"
    description: "Enforces input schema validation, rate limiting, user context propagation, and circuit breaking."
  - type: "component"
    name: "Error Standardization Component"
    technology: "RFC 7807 Middleware"
    description: "Standardizes API error responses according to RFC 7807 for consistent client handling."
relationships:
  - source: "Edge Routing & TLS Termination Component"
    destination: "Schema Validation & Security Component"
    description: "Routes terminated HTTPS traffic for validation and security checks [HTTPS]"
  - source: "Schema Validation & Security Component"
    destination: "Error Standardization Component"
    description: "Delegates error formatting when validation or circuit breaking fails [Internal API Call]"