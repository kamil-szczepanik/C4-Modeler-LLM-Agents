level: component
scope: "Component diagram for the Core Domain Containers container"
parentContainer:
  name: "Core Domain Containers"
elements:
  - type: "component"
    name: "Patient Registration Component"
    technology: "Microservice / Kubernetes Pod"
    description: "Manages patient admissions and registration data."
  - type: "component"
    name: "Appointment Scheduling Component"
    technology: "Microservice / Kubernetes Pod"
    description: "Handles scheduling for patient appointments."
  - type: "component"
    name: "EMR Component"
    technology: "Microservice / Kubernetes Pod"
    description: "Manages electronic medical records ensuring high availability and sub-second response times."
  - type: "component"
    name: "Billing Component"
    technology: "Microservice / Kubernetes Pod"
    description: "Handles billing and financial transactions for healthcare facilities."
relationships:
  - source: "Patient Registration Component"
    destination: "Appointment Scheduling Component"
    description: "Coordinates patient details for scheduling [HTTPS]"
  - source: "Appointment Scheduling Component"
    destination: "EMR Component"
    description: "Links appointments with electronic medical records [HTTPS]"
  - source: "EMR Component"
    destination: "Billing Component"
    description: "Triggers billing events based on medical services [Async]"