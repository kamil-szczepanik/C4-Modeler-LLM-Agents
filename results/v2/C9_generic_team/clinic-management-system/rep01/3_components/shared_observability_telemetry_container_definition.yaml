level: component
scope: "Component diagram for the Shared Observability & Telemetry Container container"
parentContainer:
  name: "Shared Observability & Telemetry Container"
elements:
  - type: "component"
    name: "Prometheus"
    technology: "Prometheus"
    description: "Collects metrics and time-series data from all containers."
  - type: "component"
    name: "Fluentbit"
    technology: "Fluentbit"
    description: "Gathers, scrubs, and forwards audit logs and telemetry data."
  - type: "component"
    name: "OpenTelemetry"
    technology: "OpenTelemetry"
    description: "Provides distributed tracing across microservices."
relationships:
  - source: "OpenTelemetry"
    destination: "Prometheus"
    description: "Sends distributed tracing metrics"
  - source: "Fluentbit"
    destination: "Prometheus"
    description: "Forwards structured log data"