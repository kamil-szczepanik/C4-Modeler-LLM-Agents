level: component
scope: "Component diagram for the Integration Engine Container container"
parentContainer:
  name: "Integration Engine Container"
elements:
  # Components within the parent container's boundary
  - type: "component"
    name: "HL7 FHIR Translator"
    technology: "Java / Spring Boot with Stateless Integration Engine"
    description: "Translates and processes clinical data formats into standard HL7 FHIR APIs for external lab and imaging systems."
  - type: "component"
    name: "Translation Event Router"
    technology: "Kafka Client / Resilience4j"
    description: "Routes translation events to the event bus and handles fault tolerance with circuit breaking."
  - type: "component"
    name: "Cache Lookup Manager"
    technology: "Redis Client"
    description: "Performs distributed caching lookups for stateless translation processes."
relationships:
  - source: "HL7 FHIR Translator"
    destination: "Translation Event Router"
    description: "Sends translation events and manages Dead Letter Queues [Kafka Protocol]"
  - source: "HL7 FHIR Translator"
    destination: "Cache Lookup Manager"
    description: "Performs translation lookups [Redis]"