level: component
scope: "Component diagram for the Configuration and Secrets Management Sidecar container"
parentContainer:
  name: "Configuration and Secrets Management Sidecar"
elements:
  - type: "component"
    name: "Secrets Management Engine"
    technology: "HashiCorp Vault / Kubernetes Secrets"
    description: "Secure backend for encrypted configuration and credential management."
  - type: "component"
    name: "Local Configuration Parser"
    technology: "JSON Schema"
    description: "Typed validation contracts for local configuration parsing."
  - type: "component"
    name: "IPC Handler"
    technology: "Unix Domain Sockets"
    description: "Handles secure intra-pod communication between sidecar and core containers."
relationships:
  - source: "Local Configuration Parser"
    destination: "Secrets Management Engine"
    description: "Interacts with upstream secrets using HTTPS"
  - source: "IPC Handler"
    destination: "Local Configuration Parser"
    description: "Provides validated configuration over restricted local loopback"