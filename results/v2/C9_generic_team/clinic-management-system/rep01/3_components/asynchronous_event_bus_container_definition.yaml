    name: "Event Broker Core"
    technology: "Apache Kafka / RabbitMQ"
    description: "Handles durable, decoupled asynchronous event-driven communication for core clinical microservices."
  - type: "component"
    name: "Schema Registry"
    technology: "Avro / JSON Schema Registry"
    description: "Manages schema and payload structures for event-driven messaging."
  - type: "component"
    name: "Claims Check Store"
    technology: "Object Storage / Distributed Cache"
    description: "Handles offloading and retrieval of large medical imaging payloads using the Claims Check pattern."
relationships:
  - source: "Event Broker Core"
    destination: "Schema Registry"
    description: "Validates event payload schemas via"
  - source: "Event Broker Core"
    destination: "Claims Check Store"
