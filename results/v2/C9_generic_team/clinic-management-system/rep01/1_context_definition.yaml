level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed for medium-sized hospitals and clinics to securely handle patient administration, electronic medical records (EMR), scheduling, and billing with high availability and strict regulatory compliance."
elements:
  - type: "person"
    name: "Patients, Practitioners, and Billing Staff"
    description: "System users who interface with the platform to manage administration, clinical workflows, and billing."
  - type: "externalSystem"
    name: "External Lab and Imaging Systems"
    description: "External healthcare systems that integrate via HL7 FHIR APIs to exchange clinical data."
  - type: "container"
    name: "API Gateway / Edge Routing"
    description: "Unified ingress boundary handling incoming HTTPS and MFA traffic."
  - type: "container"
    name: "Centralized Identity and Access Management"
    description: "IdP and Zero-Trust Policy Enforcement boundary for unified multi-factor auth, RBAC, and secure key rotation."
  - type: "container"
    name: "Asynchronous Event Bus"
    description: "Durable messaging backbone for decoupled, asynchronous inter-subsystem communication."
  - type: "container"
    name: "Core Clinical Subsystems"
    description: "Patient Registration, Scheduling, EMR, and Billing subsystems."
  - type: "container"
    name: "Telemetry and Observability Plane"
    description: "Unified logging, metrics, and tracing plane ingesting data from all components."
  - type: "container"
    name: "Configuration and Secret Management Boundary"
    description: "Cryptographic key and config store implementing AES-256 for data at rest."
relationships:
  - source: "Patients, Practitioners, and Billing Staff"
    destination: "API Gateway / Edge Routing"
    description: "Interface with the system via HTTPS and Multi-Factor Authentication (MFA)"
    technology: "HTTPS, MFA"
  - source: "External Lab and Imaging Systems"
    destination: "API Gateway / Edge Routing"
    description: "Integrate into the system for clinical data exchange"
    technology: "HL7 FHIR over TLS"
  - source: "API Gateway / Edge Routing"
    destination: "Centralized Identity and Access Management"
    description: "Enforces zero-trust access policies across all API Gateway routes"
    technology: "Zero-Trust Policies, IdP"
  - source: "Core Clinical Subsystems"
    destination: "Asynchronous Event Bus"
    description: "Communicate asynchronously across the hybrid boundary using durable message queues"
    technology: "Distributed Event Bus"
  - source: "Telemetry and Observability Plane"
    destination: "Core Clinical Subsystems"
    description: "Ingests logs, traces, and metrics from on-premise Kubernetes and AWS components"
    technology: "Kubernetes Telemetry"