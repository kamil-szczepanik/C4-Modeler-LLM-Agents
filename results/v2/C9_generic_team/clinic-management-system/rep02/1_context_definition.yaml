level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid clinical IT platform that manages patient admissions, electronic medical records (EMR), scheduling, and billing while ensuring HIPAA and GDPR compliance, 99.99% uptime, and long-term data retention."
elements:
  - type: "person"
    name: "Patients"
    description: "Patients accessing the system for admissions, scheduling, and medical records via Multi-Factor Authentication (MFA)."
  - type: "person"
    name: "Doctors"
    description: "Medical doctors accessing electronic medical records and scheduling tools via Multi-Factor Authentication (MFA)."
  - type: "person"
    name: "Billing Staff"
    description: "Billing staff managing patient billing and insurance claims via Multi-Factor Authentication (MFA)."
  - type: "externalSystem"
    name: "Third-party Insurance Gateways"
    description: "External systems used to submit billing claims asynchronously."
  - type: "externalSystem"
    name: "Lab/Imaging Systems"
    description: "External systems that exchange medical data using HL7 FHIR standards."
  - type: "externalSystem"
    name: "External Identity Providers"
    description: "External identity providers used for authentication and access control."
relationships:
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Access applications via HTTPS/TLS with enforced MFA"
    technology: "HTTPS/TLS, MFA"
  - source: "Doctors"
    destination: "Clinic Management System"
    description: "Access applications via HTTPS/TLS with enforced MFA"
    technology: "HTTPS/TLS, MFA"
  - source: "Billing Staff"
    destination: "Clinic Management System"
    description: "Access applications via HTTPS/TLS with enforced MFA"
    technology: "HTTPS/TLS, MFA"
  - source: "Clinic Management System"
    destination: "Lab/Imaging Systems"
    description: "Exchange medical data via HL7 FHIR APIs over HTTPS"
    technology: "HL7 FHIR, HTTPS"
  - source: "Clinic Management System"
    destination: "Third-party Insurance Gateways"
    description: "Submit billing claims asynchronously using REST/SOAP with backpressure and circuit breakers"
    technology: "REST/SOAP"
  - source: "Clinic Management System"
    destination: "External Identity Providers"
    description: "Authenticate users and manage access control"
    technology: "HTTPS/OAuth/OIDC"