level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients accessing the system for admissions, scheduling, and medical records via Multi-Factor Authentication (MFA)."
  - type: "person"
    name: "Doctors"
    description: "Medical doctors accessing electronic medical records and scheduling tools via Multi-Factor Authentication (MFA)."
  - type: "person"
    name: "Billing Staff"
    description: "Billing staff managing patient billing and insurance claims via Multi-Factor Authentication (MFA)."
  - type: "externalSystem"
    name: "Third-party Insurance Gateways"
    description: "External systems used to submit billing claims asynchronously."
  - type: "externalSystem"
    name: "Lab/Imaging Systems"
    description: "External systems that exchange medical data using HL7 FHIR standards."
  - type: "externalSystem"
    name: "External Identity Providers"
    description: "External identity providers used for authentication and access control."
  - type: "container"
    name: "API Gateway"
    technology: "Kubernetes Ingress, Reverse Proxy"
    description: "Routes incoming HTTPS, REST, and GraphQL requests from users to appropriate domain services."
  - type: "container"
    name: "Patient/EMR Service"
    technology: "Microservice, Kubernetes, Database-per-service"
    description: "Manages patient admissions and electronic medical records."
  - type: "container"
    name: "Scheduling Service"
    technology: "Microservice, Kubernetes, Database-per-service"
    description: "Handles appointments and scheduling for clinical operations."
  - type: "container"
    name: "Billing Service"
    technology: "Microservice, Kubernetes, Database-per-service"
    description: "Manages billing operations and insurance claims."
  - type: "container"
    name: "Distributed Cache"
    technology: "Redis"
    description: "Provides distributed caching for system performance and sub-second EMR access."
  - type: "container"
    name: "Message Broker"
    technology: "Kafka / RabbitMQ"
    description: "Handles asynchronous event publishing and consumption for HL7 FHIR payloads and insurance claims, featuring Dead Letter Queues."
  - type: "container"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Provides externalized encrypted configuration and secrets management."
  - type: "container"
    name: "Observability & Security Sidecars"
    technology: "Prometheus, OpenTelemetry, Falco/Trivy Operator"
    description: "Monitors metrics, distributed tracing, and ensures runtime security and vulnerability compliance."
relationships:
  - source: "Patients"
    destination: "API Gateway"
    description: "Patient registration, scheduling, EMR access, and billing queries"
    technology: "HTTPS / REST / GraphQL"
  - source: "Doctors"
    destination: "API Gateway"
    description: "Patient registration, scheduling, EMR access, and billing queries"
    technology: "HTTPS / REST / GraphQL"
  - source: "Billing Staff"
    destination: "API Gateway"
    description: "Patient registration, scheduling, EMR access, and billing queries"
    technology: "HTTPS / REST / GraphQL"
  - source: "API Gateway"
    destination: "Patient/EMR Service"
    description: "Routes requests to domain services"
    technology: "gRPC / REST"
  - source: "API Gateway"
    destination: "Scheduling Service"
    description: "Routes requests to domain services"
    technology: "gRPC / REST"
  - source: "API Gateway"
    destination: "Billing Service"
    description: "Routes requests to domain services"
    technology: "gRPC / REST"
  - source: "Patient/EMR Service"
    destination: "Message Broker"
    description: "Asynchronous event publishing and consumption for HL7 FHIR payloads"
    technology: "Kafka / RabbitMQ"
  - source: "Billing Service"
    destination: "Message Broker"
    description: "Asynchronous event publishing and consumption for insurance claims"
    technology: "Kafka / RabbitMQ"
  - source: "Patient/EMR Service"
    destination: "Lab/Imaging Systems"
    description: "Connects to lab and imaging systems with circuit breakers"
    technology: "HTTPS / HL7 FHIR APIs"
  - source: "Billing Service"
    destination: "Third-party Insurance Gateways"
    description: "Connects to third-party insurance gateways with circuit breakers"
    technology: "HTTPS / HL7 FHIR APIs"
  - source: "Patient/EMR Service"
    destination: "Distributed Cache"
    description: "Caches frequently accessed data for low latency"
    technology: "Redis Protocol"
  - source: "Scheduling Service"
    destination: "Distributed Cache"
    description: "Caches scheduling data"
    technology: "Redis Protocol"
  - source: "Patient/EMR Service"
    destination: "HashiCorp Vault"
    description: "Retrieves encrypted configurations and secrets"
    technology: "HTTPS / Vault API"
  - source: "Scheduling Service"
    destination: "HashiCorp Vault"
    description: "Retrieves encrypted configurations and secrets"
    technology: "HTTPS / Vault API"
  - source: "Billing Service"
    destination: "HashiCorp Vault"
    description: "Retrieves encrypted configurations and secrets"
    technology: "HTTPS / Vault API"