level: component
scope: "Component diagram for the Billing Service container"
parentContainer:
  name: "Billing Service"
elements:
  - type: "component"
    name: "Billing Controller"
    technology: "REST / gRPC API"
    description: "Handles incoming billing requests and routes them from the API Gateway."
  - type: "component"
    name: "Billing Processing Service"
    technology: "Microservice Business Logic, Java / Go"
    description: "Implements domain logic, transactional outbox pattern, CQRS, and financial data consistency."
  - type: "component"
    name: "Insurance Integration Adapter"
    technology: "HTTPS / HL7 FHIR APIs"
    description: "Submits insurance claims to third-party insurance gateways."
  - type: "component"
    name: "Secrets Management Client"
    technology: "HTTPS / Vault API"
    description: "Retrieves encrypted configurations and secrets from HashiCorp Vault."
relationships:
  - source: "Billing Controller"
    destination: "Billing Processing Service"
    description: "Delegates business logic execution [Internal]"
  - source: "Billing Processing Service"
    destination: "Insurance Integration Adapter"
    description: "Submits claims [HTTPS / HL7 FHIR APIs]"
  - source: "Billing Processing Service"
    destination: "Secrets Management Client"
    description: "Fetches encrypted secrets [Vault API]"