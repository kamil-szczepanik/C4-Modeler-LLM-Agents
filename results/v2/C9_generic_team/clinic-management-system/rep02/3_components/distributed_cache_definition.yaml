# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Distributed Cache container"
parentContainer:
  name: "Distributed Cache"
elements:
  - type: "component"
    name: "Clinical Data Cache Manager"
    technology: "Redis Protocol with TLS encryption"
    description: "Caches clinical data for low latency and sub-second EMR access."
  - type: "component"
    name: "Resource Lock Manager"
    technology: "Redis Protocol with TLS encryption"
    description: "Manages resource locks and scheduling data caching."
  - type: "component"
    name: "Transaction Idempotency Store"
    technology: "Redis Protocol"
    description: "Stores idempotency keys for billing transaction safety."
relationships:
  - source: "Patient/EMR Service"
    destination: "Clinical Data Cache Manager"
    description: "Caches clinical data for low latency via Redis Protocol with TLS encryption"
  - source: "Scheduling Service"
    destination: "Resource Lock Manager"
    description: "Manages resource locks and caching via Redis Protocol with TLS encryption"
  - source: "Billing Service"
    destination: "Transaction Idempotency Store"
    description: "Stores idempotency keys for transaction safety via Redis Protocol"