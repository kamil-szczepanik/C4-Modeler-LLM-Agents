level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Event Producer"
    technology: "Kafka Producer / RabbitMQ Publisher"
    description: "Publishes asynchronous HL7 FHIR payloads and insurance claims from the Patient/EMR and Billing services using TLS 1.3 and SASL/SCRAM ACLs."
  - type: "component"
    name: "Event Consumer"
    technology: "Kafka Consumer / RabbitMQ Subscriber"
    description: "Consumes asynchronous events and payloads across services with `patient_id` partitioning."
  - type: "component"
    name: "Schema Registry"
    technology: "Apache Kafka Schema Registry"
    description: "Enforces structural validation and serialization schemas for event payloads."
  - type: "component"
    name: "Dead Letter Queues (DLQs)"
    technology: "Kafka / RabbitMQ DLQ Mechanism"
    description: "Captures and stores failed or unprocessable event messages for auditing and error handling."
relationships:
  - source: "Event Producer"
    destination: "Schema Registry"
    description: "Validates event schemas via"
  - source: "Event Producer"
    destination: "Event Consumer"
    description: "Streams asynchronous events to"
  - source: "Event Consumer"
    destination: "Dead Letter Queues (DLQs)"
    description: "Routes failed messages to"