level: component
scope: "Component diagram for the Scheduling Service container"
parentContainer:
  name: "Scheduling Service"
elements:
  - type: "component"
    name: "Scheduling Controller"
    technology: "gRPC / REST API"
    description: "Handles incoming appointment and availability requests routed from the API Gateway."
  - type: "component"
    name: "Scheduling Domain Service"
    technology: "Business Logic / CQRS Pattern"
    description: "Executes core clinical workflows, resource clash checks, and orchestrates transactional writes using Optimistic Concurrency Control."
  - type: "component"
    name: "Outbox Processor"
    technology: "Transactional Outbox Pattern"
    description: "Guarantees at-least-once asynchronous event delivery without dual-write inconsistencies."
  - type: "component"
    name: "Cache Repository"
    technology: "Redis Protocol"
    description: "Interacts with the Distributed Cache to cache scheduling data and read models for high-throughput read operations."
  - type: "component"
    name: "Event Publisher"
    technology: "Kafka / AMQP"
    description: "Publishes asynchronous domain events to the Message Broker for downstream consumers like Billing and EMR services."
  - type: "component"
    name: "Secrets Manager Client"
    technology: "HTTPS / Vault API"
    description: "Retrieves encrypted configurations and secrets dynamically from HashiCorp Vault."
relationships:
  - source: "Scheduling Controller"
    destination: "Scheduling Domain Service"
    description: "Delegates appointment and availability requests"
  - source: "Scheduling Domain Service"
    destination: "Cache Repository"
    description: "Reads and writes cached scheduling data and read models"
  - source: "Scheduling Domain Service"
    destination: "Outbox Processor"
    description: "Stores domain events transactionally for reliable publishing"
  - source: "Outbox Processor"
    destination: "Event Publisher"
    description: "Dispatches domain events"
  - source: "Scheduling Domain Service"
    destination: "Secrets Manager Client"
    description: "Fetches encrypted runtime configurations and secrets"