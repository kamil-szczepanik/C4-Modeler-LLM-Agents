level: component
scope: "Component diagram for the Patient/EMR Service container"
parentContainer:
  name: "Patient/EMR Service"
elements:
  - type: "component"
    name: "EMR Controller"
    technology: "Kubernetes Microservice Component / REST & gRPC API"
    description: "Handles incoming routing requests from the API Gateway and exposes endpoints for patient admissions and EMR operations."
  - type: "component"
    name: "EMR Business Logic Handler"
    technology: "Golang / Java Microservice Logic"
    description: "Executes core clinical workflows, manages patient data, and applies PII/PHI masking."
  - type: "component"
    name: "Cache Manager"
    technology: "Redis Client"
    description: "Interfaces with the Distributed Cache (Redis) to cache data for low latency and <1s P95 screen load performance."
  - type: "component"
    name: "Event Publisher"
    technology: "Kafka / RabbitMQ Client"
    description: "Publishes asynchronous events to the Message Broker."
  - type: "component"
    name: "External Integration Client"
    technology: "HTTPS / HL7 FHIR APIs with Circuit Breakers"
    description: "Connects securely to third-party Lab/Imaging Systems and Insurance Gateways."
  - type: "component"
    name: "Secret Manager Client"
    technology: "HashiCorp Vault API / HTTPS"
    description: "Retrieves secrets and handles fail-fast startup validation."
relationships:
  - source: "EMR Controller"
    destination: "EMR Business Logic Handler"
    description: "Delegates requests"
  - source: "EMR Business Logic Handler"
    destination: "Cache Manager"
    description: "Caches data for low latency [Redis Protocol]"
  - source: "EMR Business Logic Handler"
    destination: "Event Publisher"
    description: "Asynchronous event publishing [Kafka / RabbitMQ]"
  - source: "EMR Business Logic Handler"
    destination: "External Integration Client"
    description: "Connects via circuit breakers [HTTPS / HL7 FHIR APIs]"
  - source: "EMR Business Logic Handler"
    destination: "Secret Manager Client"
    description: "Retrieves secrets [HTTPS / Vault API]"