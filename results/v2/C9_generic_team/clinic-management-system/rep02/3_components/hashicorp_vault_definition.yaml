level: component
scope: "Component diagram for the HashiCorp Vault container"
parentContainer:
  name: "HashiCorp Vault"
elements:
  - type: "component"
    name: "Vault Server"
    technology: "HashiCorp Vault / Go"
    description: "Centralized secrets management server providing dynamic database credentials, encryption services, and authentication methods."
  - type: "component"
    name: "Vault Agent Sidecar"
    technology: "Vault Agent / Kubernetes Sidecar"
    description: "Local caching and template rendering agent using tmpfs volumes to securely fetch and cache encrypted configurations and secrets."
  - type: "component"
    name: "Vault Policy and Mount Manager"
    technology: "Terraform"
    description: "Declarative configuration management tool for defining and provisioning Vault policies, secret engines, and authentication mounts."
relationships:
  - source: "Vault Agent Sidecar"
    destination: "Vault Server"
    description: "Authenticates and fetches secrets via Kubernetes Auth Method and HTTPS"
  - type: "Vault Policy and Mount Manager"
    destination: "Vault Server"
    description: "Configures policies and mounts declaratively"