# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Observability & Security Sidecars container"
parentContainer:
  name: "Observability & Security Sidecars"
elements:
  - type: "component"
    name: "OpenTelemetry Collector Sidecar"
    technology: "OpenTelemetry"
    description: "Collects traces and metrics asynchronously via local Unix domain sockets."
  - type: "component"
    name: "Envoy Proxy Sidecar"
    technology: "Envoy"
    description: "Handles internal microservice communication via gRPC and REST with mTLS."
  - type: "component"
    name: "Falco & Trivy DaemonSets"
    technology: "Falco & Trivy"
    description: "Performs node-level runtime security and vulnerability scanning."
relationships:
  - source: "OpenTelemetry Collector Sidecar"
    destination: "Envoy Proxy Sidecar"
    description: "Monitors and intercepts telemetry data from proxy operations."
  - source: "Envoy Proxy Sidecar"
    destination: "Falco & Trivy DaemonSets"
    description: "Coordinates with node security agents for secure traffic routing."