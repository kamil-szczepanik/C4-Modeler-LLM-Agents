level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid-cloud platform designed for medium-sized hospitals and clinics to manage patient admissions, EMRs, scheduling, and billing with high availability and strict regulatory compliance."
elements:
  - type: "person"
    name: "Patients"
    description: "Patients interacting with the clinic system for admissions, scheduling, and personal records."
  - type: "person"
    name: "Practitioners"
    description: "Medical practitioners managing EMRs, patient schedules, and treatments."
  - type: "person"
    name: "Administrators"
    description: "System and clinic administrators managing operations, users, and configurations."
  - type: "externalSystem"
    name: "Insurance Providers"
    description: "External systems for processing billing, claims, and insurance verification."
  - type: "externalSystem"
    name: "External Labs/Imaging"
    description: "External medical laboratories and imaging centers integrating via HL7 FHIR APIs."
  - type: "externalSystem"
    name: "Identity & Access Management (IAM)"
    description: "Manages authentication, credentials, and access control."
  - type: "externalSystem"
    name: "Centralized Audit Logging Service"
    description: "Records audit logs for regulatory compliance and security tracking."
  - type: "externalSystem"
    name: "External Notification Providers"
    description: "Sends notifications and alerts to users."
  - type: "externalSystem"
    name: "Air-gapped DR Storage Targets"
    description: "Provides isolated disaster recovery storage for backups."
  - type: "externalSystem"
    name: "Configuration and Secret Management Services"
    description: "Stores and retrieves credentials and system secrets securely."
  - type: "container"
    name: "API Gateway/Enterprise Ingress"
    description: "Manages and routes incoming API requests and external integrations."
    technology: "Enterprise Ingress"
  - type: "container"
    name: "Microservices"
    description: "Core functional services including Registration, Scheduling, EMR, and Billing."
    technology: "Microservices Architecture"
  - type: "container"
    name: "Asynchronous Event Broker"
    description: "Handles asynchronous messaging for cross-site synchronization."
    technology: "Kafka / RabbitMQ"
  - type: "container"
    name: "On-Premises Kubernetes"
    description: "On-premises infrastructure cluster for hybrid cloud deployment."
    technology: "Kubernetes"
  - type: "container"
    name: "AWS eu-central-1 Region"
    description: "Cloud infrastructure region supporting active-active high availability."
    technology: "AWS Cloud"
  - type: "component"
    name: "Policy Enforcement Point"
    description: "Enforces security policies and access controls."
    technology: "Security Component"
  - type: "component"
    name: "Distributed Tracing/Telemetry Sinks"
    description: "Gathers telemetry and distributed tracing data for observability."
    technology: "Telemetry Sink"
  - type: "component"
    name: "Circuit Breaker"
    description: "Provides fault tolerance and prevents cascading failures."
    technology: "Resilience Component"
  - type: "component"
    name: "Batch Data Migration & Seeding Interface"
    description: "Handles batch data migrations and initial database seeding."
    technology: "Data Interface"
relationships:
  - source: "Patients"
    destination: "Clinic Management System"
    description: "interact with clinic management via MFA and HTTPS"
    technology: "HTTPS/TLS, MFA"
  - source: "Practitioners"
    destination: "Clinic Management System"
    description: "interact with clinic management via MFA and HTTPS"
    technology: "HTTPS/TLS, MFA"
  - source: "External Labs/Imaging"
    destination: "Clinic Management System"
    description: "integrate via HL7 FHIR APIs through the API Gateway"
    technology: "HL7 FHIR APIs"
  - source: "Microservices"
    destination: "Asynchronous Event Broker"
    description: "publish and consume messages for cross-site synchronization"
    technology: "Kafka / RabbitMQ"
  - source: "Clinic Management System"
    destination: "Configuration and Secret Management Services"
    description: "offloads credential and secret retrieval"
    technology: "API"