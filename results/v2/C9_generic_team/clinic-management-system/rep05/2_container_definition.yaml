level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Users interacting with the clinic system for admissions, scheduling, and personal records."
  - type: "person"
    name: "Practitioners"
    description: "Medical practitioners managing EMRs, patient schedules, and treatments."
  - type: "person"
    name: "Administrators"
    description: "System and clinic administrators managing operations, users, and configurations."
  - type: "externalSystem"
    name: "Insurance Providers"
    description: "External systems for processing billing, claims, and insurance verification."
  - type: "externalSystem"
    name: "External Labs/Imaging"
    description: "External medical laboratories and imaging centers integrating via HL7 FHIR APIs."
  - type: "externalSystem"
    name: "IAM"
    description: "Identity and Access Management service for authentication and access control."
  - type: "externalSystem"
    name: "Centralized Audit Logging"
    description: "Records audit logs for regulatory compliance and security tracking."
  - type: "externalSystem"
    name: "DR Storage"
    description: "Air-gapped disaster recovery storage targets for historical records."
  - type: "externalSystem"
    name: "Centralized Secrets Management"
    description: "Stores and retrieves credentials and system secrets securely."
  - type: "container"
    name: "API Gateway Container"
    technology: "Container, JWT, Rate Limiting"
    description: "Single entry point handling routing, authentication, and rate limiting via TLS 1.3."
  - type: "container"
    name: "Core Domain Containers"
    technology: "Containers, Microservices"
    description: "Handles patient registration, EMR, scheduling, and billing business logic."
  - type: "container"
    name: "Read-Model / Query Container"
    technology: "Container, CQRS Pattern"
    description: "Optimized container for high-throughput reads using the CQRS pattern."
  - type: "container"
    name: "Integration / Adapter Container"
    technology: "Container, HL7 FHIR, REST"
    description: "Anti-Corruption Layer interfacing with external labs and imaging using HL7 FHIR APIs."
  - type: "container"
    name: "Background Worker Container"
    technology: "Container, Asynchronous Worker"
    description: "Performs asynchronous tasks such as PDF generation and bulk claims processing."
  - type: "container"
    name: "Data Archival & Migration Container"
    technology: "Container, Data Archival"
    description: "Offloads and transfers historical records for 10-year retention to DR storage."
  - type: "container"
    name: "Session & State Management Container"
    technology: "Container, Redis"
    description: "Provides Redis-backed distributed locks and session management."
  - type: "container"
    name: "Envoy Sidecars"
    technology: "Container, Envoy Proxy"
    description: "Resilience proxy providing circuit breakers, telemetry injection, and mTLS enforcement."
  - type: "container"
    name: "Asynchronous Message Broker"
    technology: "Apache Kafka / RabbitMQ"
    description: "Handles asynchronous, event-driven messaging and decoupled workflows."
relationships:
  - source: "Patients"
    destination: "API Gateway Container"
    description: "Communicate via HTTPS and TLS 1.3"
    technology: "HTTPS, TLS 1.3"
  - source: "Practitioners"
    destination: "API Gateway Container"
    description: "Communicate via HTTPS and TLS 1.3"
    technology: "HTTPS, TLS 1.3"
  - source: "Administrators"
    destination: "API Gateway Container"
    description: "Communicate via HTTPS and TLS 1.3"
    technology: "HTTPS, TLS 1.3"
  - source: "API Gateway Container"
    destination: "Core Domain Containers"
    description: "Routes traffic via mTLS"
    technology: "mTLS"
  - source: "API Gateway Container"
    destination: "Read-Model / Query Container"
    description: "Routes read traffic via mTLS"
    technology: "mTLS"
  - source: "Core Domain Containers"
    destination: "Asynchronous Message Broker"
    description: "Emits events to the asynchronous message broker"
    technology: "Kafka/RabbitMQ"
  - source: "Asynchronous Message Broker"
    destination: "Background Worker Container"
    description: "Consumes asynchronous tasks"
    technology: "Kafka/RabbitMQ"
  - source: "External Labs/Imaging"
    destination: "Integration / Adapter Container"
    description: "Interfaces using HL7 FHIR over REST"
    technology: "HL7 FHIR over REST"
  - source: "Data Archival & Migration Container"
    destination: "DR Storage"
    description: "Transfers historical data to air-gapped targets"
    technology: "Encrypted Storage Transfer"