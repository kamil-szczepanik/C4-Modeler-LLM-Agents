level: component
scope: "Component diagram for the Data Archival & Migration Container container"
parentContainer:
  name: "Data Archival & Migration Container"
elements:
  - type: "component"
    name: "Archival Controller"
    technology: "Containerized Microservice / Python / Go"
    description: "Triggers and manages asynchronous data offloading workflows for long-term 10-year retention."
  - type: "component"
    name: "Migration Processor"
    technology: "Apache Parquet / Avro / Schema Registry"
    description: "Executes batch processing, serialization, and write-verify-delete lifecycles for EMR records."
  - type: "component"
    name: "Cryptographic Verification Service"
    technology: "TLS 1.3 / SHA-256 / Cryptographic Manifests"
    description: "Ensures data integrity during storage transfer by verifying checksums and manifest authenticity."
relationships:
  - source: "Archival Controller"
    destination: "Migration Processor"
    description: "Triggers batch offloading and data serialization workflows"
  - source: "Migration Processor"
    destination: "Cryptographic Verification Service"
    description: "Generates cryptographic checksums and validates transfers"
  - source: "Cryptographic Verification Service"
    destination: "DR Storage Targets"
    description: "Transfers encrypted data using TLS 1.3 with SHA-256 checksums"