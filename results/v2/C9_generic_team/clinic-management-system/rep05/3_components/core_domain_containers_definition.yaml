level: component
scope: "Component diagram for the Core Domain Containers container"
parentContainer:
  name: "Core Domain Containers"
elements:
  - type: "component"
    name: "Registration Component"
    technology: "Microservice / Spring Boot"
    description: "Manages patient admissions, registration data, and related domain logic."
  - type: "component"
    name: "Scheduling Component"
    technology: "Microservice / Spring Boot"
    description: "Handles appointments and practitioner scheduling for clinic staff."
  - type: "component"
    name: "EMR Component"
    technology: "Microservice / Spring Boot"
    description: "Manages electronic medical records ensuring rapid data access and HIPAA/GDPR compliance."
  - type: "component"
    name: "Billing Component"
    technology: "Microservice / Spring Boot"
    description: "Processes patient billing, invoices, and financial records."
relationships:
  - source: "Registration Component"
    destination: "Scheduling Component"
    description: "Triggers schedule setup for newly registered patients"
  - source: "Scheduling Component"
    destination: "EMR Component"
    description: "Links appointments with electronic medical records"
  - source: "EMR Component"
    destination: "Billing Component"
    description: "Forwards clinical service details for invoice generation"