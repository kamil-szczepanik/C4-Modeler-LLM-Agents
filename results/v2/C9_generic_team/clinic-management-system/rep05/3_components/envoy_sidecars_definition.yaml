level: component
scope: "Component diagram for the Envoy Sidecars container"
parentContainer:
  name: "Envoy Sidecars"
elements:
  - type: "component"
    name: "Proxy Instance"
    technology: "Envoy Proxy"
    description: "Enforces mTLS, circuit breaking, and handles weighted traffic shifting."
  - type: "component"
    name: "Telemetry Reporter"
    technology: "gRPC"
    description: "Collects and forwards distributed tracing telemetry."
relationships:
  - source: "Proxy Instance"
    destination: "Telemetry Reporter"
    description: "Sends tracing data"