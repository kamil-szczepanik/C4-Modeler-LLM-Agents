level: component
scope: "Component diagram for the Integration / Adapter Container container"
parentContainer:
  name: "Integration / Adapter Container"
elements:
  - type: "component"
    name: "HL7 FHIR REST Adapter"
    technology: "HL7 FHIR over REST"
    description: "Interfaces with external labs, imaging systems, and insurance providers using standardized clinical interoperability protocols."
  - type: "component"
    name: "Schema Translation Engine"
    technology: "JSONata / Liquid Templates"
    description: "Applies declarative mapping rules for schema translations between external payloads and internal domain models."
  - type: "component"
    name: "Outbox Event Publisher"
    technology: "Transactional Outbox Pattern"
    description: "Publishes domain events to the asynchronous message broker using reliable transactional outbox patterns."
  - type: "component"
    name: "Audit Emission Component"
    technology: "W3C Trace Context"
    description: "Emits distributed traces and logs to the centralized audit logging service."
relationships:
  - source: "HL7 FHIR REST Adapter"
    destination: "Schema Translation Engine"
    description: "[Transforms external payload]"
  - source: "Schema Translation Engine"
    destination: "Outbox Event Publisher"
    description: "[Publishes domain events]"
  - source: "HL7 FHIR REST Adapter"
    destination: "Audit Emission Component"
    description: "[Emits traces and logs]"