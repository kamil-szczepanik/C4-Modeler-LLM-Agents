level: component
scope: "Component diagram for the Asynchronous Message Broker container"
parentContainer:
  name: "Asynchronous Message Broker"
elements:
  - type: "component"
    name: "Event Publisher"
    technology: "Apache Kafka Producer (TLS 1.3, SASL/SCRAM)"
    description: "Emits domain events from Core Domain Containers to the message broker ensuring causal consistency by PatientID."
  - type: "component"
    name: "Event Consumer"
    technology: "Apache Kafka Consumer (Manual Offset Commits)"
    description: "Consumes asynchronous tasks and events for the Background Worker Container."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry (Avro/Protobuf)"
    description: "Ensures event contract governance and backward compatibility for event-driven messaging."
relationships:
  - source: "Event Publisher"
    destination: "Schema Registry"
    description: "Validates event schemas via"
  - source: "Schema Registry"
    destination: "Event Consumer"
    description: "Provides event contracts to"