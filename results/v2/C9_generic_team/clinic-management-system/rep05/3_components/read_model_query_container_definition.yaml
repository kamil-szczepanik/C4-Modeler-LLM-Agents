level: component
scope: "Component diagram for the Read-Model / Query Container container"
parentContainer:
  name: "Read-Model / Query Container"
elements:
  - type: "component"
    name: "Query Controller"
    technology: "CQRS Pattern / REST API"
    description: "Handles incoming read requests and routes queries for EMR workflows."
  - type: "component"
    name: "Query Service"
    technology: "Business Logic Layer"
    description: "Implements business logic for retrieving and processing read-model data."
  - type: "component"
    name: "Cache Manager"
    technology: "Redis / TCP"
    description: "Implements the cache-aside pattern for low-latency data retrieval."
  - type: "component"
    name: "Event Synchronization Handler"
    technology: "AMQP / Kafka"
    description: "Synchronizes event streams from the message broker to update read models."
relationships:
  - source: "Query Controller"
    destination: "Query Service"
    description: "Delegates query execution"
  - source: "Query Service"
    destination: "Cache Manager"
    description: "Retrieves cached state via cache-aside pattern"
  - source: "Event Synchronization Handler"
    destination: "Query Service"
    description: "Updates read models from event streams"