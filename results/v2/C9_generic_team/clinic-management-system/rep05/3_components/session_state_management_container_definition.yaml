level: component
scope: "Component diagram for the Session & State Management Container container"
parentContainer:
  name: "Session & State Management Container"
elements:
  - type: "component"
    name: "Distributed Locking Manager"
    technology: "Redis Enterprise"
    description: "Provides high-availability distributed locking for clinical workflows."
  - type: "component"
    name: "Session Management Service"
    technology: "Redis Enterprise"
    description: "Manages user and system sessions across hybrid-cloud operations."
  - type: "component"
    name: "Rate Limiter"
    technology: "Redis Enterprise"
    description: "Handles rate limiting and protects upstream core domain services."
  - type: "component"
    name: "Active-Active Replication Engine"
    technology: "Redis Enterprise"
    description: "Replicates state between on-prem Kubernetes and eu-central-1."
relationships:
  - source: "Session Management Service"
    destination: "Distributed Locking Manager"
    description: "Coordinates distributed locks for concurrent operations"
  - source: "Active-Active Replication Engine"
    destination: "Session Management Service"
    description: "Synchronizes state across multi-region deployments"