level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "End users who access the system for admissions, scheduling, and personal records."
  - type: "person"
    name: "Clinical Staff"
    description: "Healthcare professionals who manage patient EMRs, appointments, and clinical workflows."
  - type: "person"
    name: "Billing Administrators"
    description: "Administrative staff responsible for managing billing, invoices, and financial operations."
  - type: "externalSystem"
    name: "External Labs"
    description: "External laboratory systems that exchange clinical data."
  - type: "externalSystem"
    name: "Imaging Systems"
    description: "External diagnostic imaging systems that integrate with the platform."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External OAuth2/OIDC service for multi-factor authentication and session management."
  - type: "container"
    name: "API Gateway / FHIR Facade Container"
    technology: "Apache Camel / custom FHIR facade"
    description: "Routes incoming traffic, translates HL7 FHIR APIs, and interfaces with external systems."
  - type: "container"
    name: "Security/Auth Proxy Container"
    technology: "OAuth2 / OpenID Connect"
    description: "Handles authentication, authorization, and secure access proxying."
  - type: "container"
    name: "Domain Services Containers"
    technology: "Microservices, gRPC / REST over TLS"
    description: "Encapsulates core business logic for Patient/EMR, Scheduling, and Billing."
  - type: "container"
    name: "Async Event Bus Container"
    technology: "Kafka / RabbitMQ"
    description: "Enables asynchronous decoupling and high throughput message passing between services."
  - type: "container"
    name: "Background Worker Container and Database Migration Init-Containers"
    technology: "Kubernetes Jobs / Init-Containers"
    description: "Handles background tasks and automated database schema migrations."
  - type: "container"
    name: "Observability Stack"
    technology: "Prometheus, Grafana, OpenTelemetry"
    description: "Provides centralized metrics, monitoring, and distributed tracing."
  - type: "container"
    name: "Secret Management Sidecar"
    technology: "HashiCorp Vault"
    description: "Secures AES-256 encryption keys and application credentials."
relationships:
  - source: "Patients"
    destination: "API Gateway / FHIR Facade Container"
    description: "Interact with the system via HTTPS and OAuth2"
    technology: "HTTPS (TLS 1.3), OAuth2/OIDC"
  - source: "Clinical Staff"
    destination: "API Gateway / FHIR Facade Container"
    description: "Access clinical operations and EMR management"
    technology: "HTTPS (TLS 1.3), OAuth2/OIDC"
  - source: "Billing Administrators"
    destination: "API Gateway / FHIR Facade Container"
    description: "Manage billing and financial workflows"
    technology: "HTTPS (TLS 1.3), OAuth2/OIDC"
  - source: "API Gateway / FHIR Facade Container"
    destination: "Security/Auth Proxy Container"
    description: "Validate requests and authenticate sessions"
    technology: "OAuth2 / OpenID Connect"
  - source: "API Gateway / FHIR Facade Container"
    destination: "Domain Services Containers"
    description: "Route traffic to domain microservices"
    technology: "gRPC / REST over TLS"
  - source: "Domain Services Containers"
    destination: "Async Event Bus Container"
    description: "Publish and consume asynchronous events"
    technology: "Kafka / RabbitMQ"
  - source: "API Gateway / FHIR Facade Container"
    destination: "External Labs"
    description: "Communicate using HL7 FHIR APIs"
    technology: "HTTPS, HL7 FHIR"
  - source: "API Gateway / FHIR Facade Container"
    destination: "Imaging Systems"
    description: "Exchange medical imaging and clinical data"
    technology: "HTTPS, HL7 FHIR"
  - source: "Security/Auth Proxy Container"
    destination: "Identity Provider (IdP)"
    description: "Authenticate users against external IdP"
    technology: "OAuth2 / OIDC"
  - source: "Domain Services Containers"
    destination: "Secret Management Sidecar"
    description: "Retrieve encryption keys and secrets"
    technology: "HashiCorp Vault API"