level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform that handles patient admissions, electronic medical records, scheduling, and billing for medium-sized clinics, providing highly available, secure, and interoperable clinical IT operations compliant with HIPAA and GDPR mandates."
elements:
  - type: "person"
    name: "Patients"
    description: "End users who access the system for admissions, scheduling, and personal records."
  - type: "person"
    name: "Clinical Staff"
    description: "Healthcare professionals who manage patient EMRs, appointments, and clinical workflows."
  - type: "person"
    name: "Billing Administrators"
    description: "Administrative staff responsible for managing billing, invoices, and financial operations."
  - type: "externalSystem"
    name: "External Labs"
    description: "External laboratory systems that exchange clinical data."
  - type: "externalSystem"
    name: "Imaging Systems"
    description: "External diagnostic imaging systems that integrate with the platform."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External OAuth2/OIDC service for multi-factor authentication and session management."
relationships:
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Authenticate and access clinical functions and scheduling"
    technology: "HTTPS/TLS 1.3, Multi-factor Authentication"
  - source: "Clinical Staff"
    destination: "Clinic Management System"
    description: "Authenticate and manage patient EMRs, admissions, and schedules"
    technology: "HTTPS/TLS 1.3, Multi-factor Authentication"
  - source: "Billing Administrators"
    destination: "Clinic Management System"
    description: "Authenticate and manage billing and financial operations"
    technology: "HTTPS/TLS 1.3, Multi-factor Authentication"
  - source: "External Labs"
    destination: "Clinic Management System"
    description: "Exchange clinical data using HL7 FHIR APIs"
    technology: "HTTPS, HL7 FHIR"
  - source: "Imaging Systems"
    destination: "Clinic Management System"
    description: "Integrate and exchange medical imaging data"
    technology: "HTTPS, HL7 FHIR"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticate users and manage sessions"
    technology: "OAuth2/OIDC, HTTPS/TLS 1.3"