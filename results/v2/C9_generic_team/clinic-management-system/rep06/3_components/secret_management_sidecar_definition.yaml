level: component
scope: "Component diagram for the Secret Management Sidecar container"
parentContainer:
  name: "Secret Management Sidecar"
elements:
  - type: "component"
    name: "Vault Agent"
    technology: "HashiCorp Vault Agent / tmpfs"
    description: "Handles secure authentication with HashiCorp Vault, dynamic secret retrieval, and local tmpfs caching for high-performance credential rotation."
  - type: "component"
    name: "Secret Management Service"
    technology: "Sidecar Process / Local Loopback"
    description: "Exposes local loopback interface endpoints to supply AES-256 encryption keys and credentials securely to domain services."
relationships:
  - source: "Vault Agent"
    destination: "Secret Management Service"
    description: "Populates templates and syncs secrets via [Local loopback interface localhost:8200 / Vault Agent templates]"