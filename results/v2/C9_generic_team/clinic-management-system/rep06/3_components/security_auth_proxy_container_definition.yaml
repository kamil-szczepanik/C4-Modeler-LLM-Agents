level: component
scope: "Component diagram for the Security/Auth Proxy Container container"
parentContainer:
  name: "Security/Auth Proxy Container"
elements:
  - type: "component"
    name: "OAuth2 / OIDC Reverse Proxy"
    technology: "Envoy"
    description: "Validates requests, authenticates sessions, enforces mTLS, rate-limiting, and request schema validation."
  - type: "component"
    name: "Token Validator Component"
    technology: "OAuth2 / OpenID Connect with JWKS"
    description: "Stateless authentication using locally validated short-lived JWTs to minimize IdP bottlenecks."
relationships:
  - source: "OAuth2 / OIDC Reverse Proxy"
    destination: "Token Validator Component"
    description: "Validates incoming tokens and authenticates sessions [OAuth2 / OIDC]"