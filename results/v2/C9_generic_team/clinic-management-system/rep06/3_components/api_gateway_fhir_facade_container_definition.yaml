level: component
scope: "Component diagram for the API Gateway / FHIR Facade Container container"
parentContainer:
  name: "API Gateway / FHIR Facade Container"
elements:
  - type: "component"
    name: "FHIR Facade Router"
    technology: "Apache Camel"
    description: "Handles payload transformation, routing, and translation between custom payloads and HL7 FHIR standards."
  - type: "component"
    name: "API Gateway Handler"
    technology: "Custom FHIR Facade"
    description: "Manages incoming HTTPS/TLS 1.3 requests from patients, staff, and external systems, routing them appropriately."
  - type: "component"
    name: "Auth Validator"
    technology: "OAuth2 / OpenID Connect Client"
    description: "Communicates with the Security/Auth Proxy Container to validate incoming requests and user sessions."
relationships:
  - source: "API Gateway Handler"
    destination: "Auth Validator"
    description: "Validates requests via OAuth2 / OpenID Connect"
  - source: "API Gateway Handler"
    destination: "FHIR Facade Router"
    description: "Forwards requests for routing and payload transformation"
  - source: "FHIR Facade Router"
    destination: "Domain Services Containers"
    description: "Route traffic via gRPC / REST over TLS (mTLS)"
  - source: "FHIR Facade Router"
    destination: "External Labs / Imaging Systems"
    description: "Communicate via HTTPS, HL7 FHIR APIs"