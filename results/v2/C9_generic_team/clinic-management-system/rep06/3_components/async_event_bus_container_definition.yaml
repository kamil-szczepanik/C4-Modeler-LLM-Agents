level: component
scope: "Component diagram for the Async Event Bus Container container"
parentContainer:
  name: "Async Event Bus Container"
elements:
  - type: "component"
    name: "Event Publisher"
    technology: "Kafka / RabbitMQ Producer Client"
    description: "Publishes asynchronous events from domain services with AES-256 encryption."
  - type: "component"
    name: "Event Broker Core"
    technology: "Apache Kafka / RabbitMQ"
    description: "Handles high throughput, message routing, and cross-site mirroring for disaster recovery."
  - type: "component"
    name: "Event Consumer"
    technology: "Kafka / RabbitMQ Consumer Client"
    description: "Consumes asynchronous events for downstream domain processing and auditing."
relationships:
  - source: "Event Publisher"
    destination: "Event Broker Core"
    description: "Sends encrypted event messages over TLS"
  - source: "Event Broker Core"
    destination: "Event Consumer"
    description: "Delivers queued asynchronous events"