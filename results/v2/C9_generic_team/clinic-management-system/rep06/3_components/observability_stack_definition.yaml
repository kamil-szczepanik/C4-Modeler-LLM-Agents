# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Observability Stack container"
parentContainer:
  name: "Observability Stack"
elements:
  - type: "component"
    name: "Prometheus"
    technology: "Prometheus"
    description: "Collects and stores metrics from all system containers and microservices."
  - type: "component"
    name: "Grafana"
    technology: "Grafana"
    description: "Provides dashboards and visualization for metrics, logs, and traces."
  - type: "component"
    name: "OpenTelemetry Collectors"
    technology: "OpenTelemetry Protocol (OTLP)"
    description: "Collects telemetry data with local buffering collectors from all containers."
relationships:
  - source: "OpenTelemetry Collectors"
    destination: "Prometheus"
    description: "Forwards metrics data"
  - source: "Prometheus"
    destination: "Grafana"
    description: "Feeds metrics for visualization"
  - source: "OpenTelemetry Collectors"
    destination: "Grafana"
    description: "Feeds trace and telemetry data for visualization"