level: component
scope: "Component diagram for the Core Domain Containers container"
parentContainer:
  name: "Core Domain Containers"
elements:
  - type: "component"
    name: "Patient Admission Controller"
    technology: "gRPC/REST, Kubernetes"
    description: "Handles patient admission workflows and requests."
  - type: "component"
    name: "EMR Service"
    technology: "gRPC/REST, Kubernetes"
    description: "Manages electronic medical records with <1s load times."
  - type: "component"
    name: "Scheduling Service"
    technology: "gRPC/REST, Kubernetes"
    description: "Manages appointments and resource scheduling."
  - type: "component"
    name: "Billing Service"
    technology: "gRPC/REST, Kubernetes"
    description: "Processes billing and financial transactions."
relationships:
  - source: "Patient Admission Controller"
    destination: "EMR Service"
    description: "Routes admission data [gRPC]"
  - source: "EMR Service"
    destination: "Scheduling Service"
    description: "Coordinates appointments [gRPC]"
  - source: "Scheduling Service"
    destination: "Billing Service"
    description: "Triggers billing events [gRPC]"