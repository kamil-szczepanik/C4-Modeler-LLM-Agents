level: component
scope: "Component diagram for the Observability Container container"
parentContainer:
  name: "Observability Container"
elements:
  - type: "component"
    name: "Metrics Collector"
    technology: "OpenTelemetry / Prometheus"
    description: "Collects operational metrics from all containers across the hybrid cloud platform."
  - type: "component"
    name: "Distributed Tracing Agent"
    technology: "OpenTelemetry / W3C Trace Context"
    description: "Captures and propagates trace correlation IDs across synchronous and asynchronous boundaries."
  - type: "component"
    name: "Log Aggregator"
    technology: "OpenTelemetry"
    description: "Collects and sanitizes logs while ensuring HIPAA and GDPR compliance."
relationships:
  - source: "Metrics Collector"
    destination: "Distributed Tracing Agent"
    description: "Correlates metrics with distributed trace contexts"
  - source: "Distributed Tracing Agent"
    destination: "Log Aggregator"
    description: "Links trace IDs to corresponding system logs"