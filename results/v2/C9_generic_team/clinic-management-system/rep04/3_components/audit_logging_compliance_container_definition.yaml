level: component
scope: "Component diagram for the Audit Logging & Compliance Container container"
parentContainer:
  name: "Audit Logging & Compliance Container"
elements:
  - type: "component"
    name: "Audit Event Receiver"
    technology: "Node.js / Express API"
    description: "Receives security and compliance audit events from the Asynchronous Event Bus and core services."
  - type: "component"
    name: "Compliance Validation Engine"
    technology: "Python / HIPAA-GDPR Policy Engine"
    description: "Validates incoming events against strict HIPAA and GDPR regulations and ensures 10-year retention rules."
  - type: "component"
    name: "WORM Storage Writer"
    technology: "AWS S3 SDK with Object Lock"
    description: "Writes tamper-resistant audit logs directly to Write-Once-Read-Many (WORM) storage for compliance mandates."
relationships:
  - source: "Audit Event Receiver"
    destination: "Compliance Validation Engine"
    description: "Forwards collected audit events for policy checking"
  - source: "Compliance Validation Engine"
    destination: "WORM Storage Writer"
    description: "Sends validated logs for immutable storage"