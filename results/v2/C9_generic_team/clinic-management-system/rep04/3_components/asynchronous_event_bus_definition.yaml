level: component
scope: "Component diagram for the Asynchronous Event Bus container"
parentContainer:
  name: "Asynchronous Event Bus"
elements:
  - type: "component"
    name: "Centralized Schema Registry"
    technology: "Avro / JSON Schema Registry"
    description: "Enforces strict backward and forward compatibility to prevent schema drift across services."
  - type: "component"
    name: "Message Broker"
    technology: "Kafka/RabbitMQ"
    description: "Handles asynchronous, decoupled event-driven workflows and high availability with TLS and Envelope Encryption."
  - type: "component"
    name: "Dead Letter Queues (DLQ)"
    technology: "AMQP/Kafka"
    description: "Routes malformed or failed messages for later inspection and error handling."
relationships:
  - source: "Message Broker"
    destination: "Dead Letter Queues (DLQ)"
    description: "Route malformed or failed messages [AMQP/Kafka]"
  - source: "Centralized Schema Registry"
    destination: "Message Broker"
    description: "Provides schema validation for events published across [AMQP/Kafka with TLS and Envelope Encryption]"