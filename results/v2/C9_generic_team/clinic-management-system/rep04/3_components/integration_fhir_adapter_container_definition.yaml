level: component
scope: "Component diagram for the Integration / FHIR Adapter Container container"
parentContainer:
  name: "Integration / FHIR Adapter Container"
elements:
  - type: "component"
    name: "FHIR API Router"
    technology: "Node.js / Express"
    description: "Routes incoming HL7 FHIR requests from external lab and imaging systems."
  - type: "component"
    name: "Anti-Corruption Layer (ACL) Transformer"
    technology: "TypeScript"
    description: "Translates external HL7 FHIR payloads into internal domain models and vice versa."
  - type: "component"
    name: "Rate Limiting Middleware"
    technology: "Redis Client"
    description: "Enforces traffic throttling and idempotency checks using the Redis Distributed Rate Limiting Store."
relationships:
  - source: "FHIR API Router"
    destination: "Anti-Corruption Layer (ACL) Transformer"
    description: "Forwards validated payloads for transformation"
  - source: "FHIR API Router"
    destination: "Rate Limiting Middleware"
    description: "Checks request rate limits and idempotency"