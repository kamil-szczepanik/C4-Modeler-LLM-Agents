level: component
scope: "Component diagram for the Data Archival Worker container"
parentContainer:
  name: "Data Archival Worker"
elements:
  - type: "component"
    name: "Data Archival Worker"
    technology: "Kubernetes CronJob / Persistent Worker Pool"
    description: "Batch processor utilizing chunk-based processing, idempotency keys, and resource throttling to secure and offload historical clinical data."
  - type: "component"
    name: "Cold Storage"
    technology: "AWS Glacier (or on-prem equivalent) via AES-256"
    description: "Secure long-term storage destination for 10-year data retention."
  - type: "component"
    name: "Dead Letter Queue (DLQ)"
    technology: "Queue / Message Broker"
    description: "Error handling queue for failed archival batches."
  - type: "component"
    name: "Audit Logging Container"
    technology: "AMQP/Kafka"
    description: "Destination for cryptographic checksums, compliance traces, and structured audit events."
  - type: "component"
    name: "Observability Container"
    technology: "Prometheus"
    description: "Exporter tracking batch processing duration, throughput, and DLQ depth."
  - type: "component"
    name: "Secret Management Sidecar"
    technology: "Kubernetes sidecar / Local IPC / Volume mounts"
    description: "Supplies configuration and encryption credentials."
relationships:
  - source: "Data Archival Worker"
    destination: "Cold Storage"
    description: "Streams encrypted, compressed payloads using HTTPS/TLS and AES-256"
  - source: "Data Archival Worker"
    destination: "Audit Logging Container"
    description: "Emits structured events and correlation IDs via AMQP/Kafka"
  - source: "Data Archival Worker"
    destination: "Observability Container"
    description: "Exposes metrics via Prometheus scraping"
  - source: "Data Archival Worker"
    destination: "Secret Management Sidecar"
    description: "Fetches keys and configs via local IPC/Volume mounts"