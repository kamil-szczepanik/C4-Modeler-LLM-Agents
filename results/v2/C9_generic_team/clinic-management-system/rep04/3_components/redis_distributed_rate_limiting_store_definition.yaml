level: component
scope: "Component diagram for the Redis Distributed Rate Limiting Store container"
parentContainer:
  name: "Redis Distributed Rate Limiting Store"
elements:
  - type: "component"
    name: "Rate Limiting Engine"
    technology: "Lua Scripts"
    description: "Executes atomically within Redis for Token Bucket and Sliding Window algorithms to enforce low-latency rate limits."
  - type: "component"
    name: "Caching Store"
    technology: "Redis In-Memory Store"
    description: "Provides low-latency ephemeral caching and offloads ephemeral state from transactional databases."
  - type: "component"
    name: "Metrics Exporter"
    technology: "OpenTelemetry / Redis Metrics"
    description: "Exposes Redis performance metrics such as evicted_keys and used_memory_rss for scraping via HTTP/gRPC."
relationships:
  - source: "Rate Limiting Engine"
    destination: "Caching Store"
    description: "Reads and writes rate limit state atomically using"
  - source: "Metrics Exporter"
    destination: "Caching Store"
    description: "Scrapes telemetry and performance metrics from"