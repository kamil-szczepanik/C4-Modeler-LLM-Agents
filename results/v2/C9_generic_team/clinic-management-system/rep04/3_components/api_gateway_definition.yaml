level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Request Router"
    technology: "Reverse Proxy / API Gateway Engine"
    description: "Routes incoming requests from the Frontend Container to the Core Domain Containers using internal gRPC/REST."
  - type: "component"
    name: "Authentication & Authorization Module"
    technology: "JWT & MFA Validator"
    description: "Validates JWT tokens and multi-factor authentication for all incoming HTTPS requests."
  - type: "component"
    name: "Rate Limiting Module"
    technology: "Redis Rate Limiter Client"
    description: "Enforces edge throttling using the Redis Distributed Rate Limiting Store."
relationships:
  - source: "Request Router"
    destination: "Authentication & Authorization Module"
    description: "Delegates request validation"
  - source: "Request Router"
    destination: "Rate Limiting Module"
    description: "Checks rate limits"