level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Hospital Staff and Patients"
    description: "Users who interact with the system for admissions, electronic medical records, scheduling, and billing."
  - type: "externalSystem"
    name: "External Lab and Imaging Systems"
    description: "External systems that integrate via HL7 FHIR protocols over HTTPS."
  - type: "container"
    name: "Frontend Container"
    technology: "HTTPS/TLS"
    description: "Provides the user interface for hospital staff and patients."
  - type: "container"
    name: "API Gateway"
    technology: "HTTPS, JWT/MFA"
    description: "Manages incoming requests, routing, and authentication validation."
  - type: "container"
    name: "Core Domain Containers"
    technology: "gRPC/REST, Kubernetes"
    description: "Manages core domain logic including Patient Registration, EMR, Scheduling, and Billing."
  - type: "container"
    name: "Integration / FHIR Adapter Container"
    technology: "HL7 FHIR, HTTPS"
    description: "Connects the system to external lab and imaging systems."
  - type: "container"
    name: "Asynchronous Event Bus"
    technology: "Kafka/RabbitMQ, AMQP"
    description: "Handles asynchronous, decoupled event-driven workflows across containers."
  - type: "container"
    name: "Audit Logging & Compliance Container"
    technology: "AES-256"
    description: "Ensures HIPAA/GDPR compliance and tracks audit logs."
  - type: "container"
    name: "Observability Container"
    technology: "OpenTelemetry"
    description: "Provides end-to-end distributed tracing and metrics collection."
  - type: "container"
    name: "Shared Configuration & Secret Management Sidecar"
    technology: "Kubernetes Sidecar"
    description: "Manages shared configurations and secrets securely."
  - type: "container"
    name: "Database Migration Container"
    technology: "Kubernetes Job"
    description: "Handles database migrations during deployments."
  - type: "container"
    name: "Data Archival Worker"
    technology: "Background Worker"
    description: "Manages long-term data archival tasks."
  - type: "container"
    name: "Redis Distributed Rate Limiting Store"
    technology: "Redis"
    description: "Provides distributed rate limiting and low-latency caching."
relationships:
  - source: "Hospital Staff and Patients"
    destination: "Frontend Container"
    description: "Interact with the frontend via HTTPS/TLS"
    technology: "HTTPS/TLS"
  - source: "Frontend Container"
    destination: "API Gateway"
    description: "Communicates and sends API requests via HTTPS with JWT/MFA validation"
    technology: "HTTPS, JWT/MFA"
  - source: "API Gateway"
    destination: "Core Domain Containers"
    description: "Routes requests to core domain services"
    technology: "internal gRPC/REST"
  - source: "Core Domain Containers"
    destination: "Asynchronous Event Bus"
    description: "Publish and consume events"
    technology: "AMQP/Kafka"
  - source: "Integration / FHIR Adapter Container"
    destination: "External Lab and Imaging Systems"
    description: "Connects and exchanges health data"
    technology: "HL7 FHIR protocols over HTTPS"