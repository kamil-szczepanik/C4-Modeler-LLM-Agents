level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed to manage patient admissions, electronic medical records (EMR), scheduling, and billing for medium-sized hospitals and clinics while enforcing strict healthcare compliance and interoperability standards."
elements:
  - type: "person"
    name: "Hospital Staff and Patients"
    description: "Users who interact with the system for admissions, electronic medical records, scheduling, and billing."
  - type: "externalSystem"
    name: "External Lab and Imaging Systems"
    description: "External systems that integrate via HL7 FHIR APIs through the Anti-Corruption Layer."
relationships:
  - source: "Hospital Staff and Patients"
    destination: "Clinic Management System"
    description: "Interact with the system for clinical operations via HTTPS/TLS using OAuth2/MFA"
    technology: "HTTPS/TLS, OAuth2/MFA"
  - source: "External Lab and Imaging Systems"
    destination: "Clinic Management System"
    description: "Integrate via HL7 FHIR APIs through the Anti-Corruption Layer"
    technology: "HL7 FHIR APIs"