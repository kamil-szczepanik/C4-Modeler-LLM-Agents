level: context
scope: "System Context diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization"
  description: "Gradually replaces a 30-year-old on-premises mainframe with a modern cloud platform in Azure West Europe, maintaining hybrid coexistence and data consistency while migrating claim types incrementally."
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "External users submitting claims online."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users managing claims in the new web application."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premises COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Active Directory / Azure AD handling authentication."
  - type: "externalSystem"
    name: "Anti-Corruption Layer (ACL)"
    description: "Buffering proxy service in Azure protecting the legacy mainframe."
relationships:
  - source: "Customers and Brokers"
    destination: "Insurance Claims Modernization"
    description: "Submitting claims online"
    technology: "HTTPS / OpenID Connect"
  - source: "Claims Adjusters"
    destination: "Insurance Claims Modernization"
    description: "Managing claims in the new web application"
    technology: "HTTPS"
  - source: "Insurance Claims Modernization"
    destination: "Identity Provider"
    description: "Authenticating users"
    technology: "OpenID Connect / OAuth 2.0"
  - source: "Insurance Claims Modernization"
    destination: "Legacy Mainframe"
    description: "Synchronizing data and accessing system of record via the Anti-Corruption Layer"
    technology: "mTLS over VPN/ExpressRoute"