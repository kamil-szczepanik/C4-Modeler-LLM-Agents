level: container
scope: "Container diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization"
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "External users submitting claims online."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users managing claims in the new web application."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premises COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Azure Active Directory (Entra ID) handling authentication."
  - type: "externalSystem"
    name: "Anti-Corruption Layer (ACL)"
    description: "Buffering proxy service protecting the legacy mainframe."
  - type: "container"
    name: "Web Portal (SPA)"
    technology: "React, TypeScript, Azure Static Web Apps"
    description: "Customer and broker portal for submitting and viewing claims."
  - type: "container"
    name: "Adjuster Workspace"
    technology: "Web Application"
    description: "Web application handling adjuster claims processing workflows."
  - type: "container"
    name: "API Gateway / Router"
    technology: "YARP reverse proxy"
    description: "Manages feature flags, routing, rate-limiting, and circuit breakers."
  - type: "container"
    name: "Claims Core Service"
    technology: "Spring Boot, Java, Azure Container Apps"
    description: "Domain-driven modular monolith processing online claims and workflows."
  - type: "container"
    name: "Integration & Sync Engine"
    technology: "Apache Kafka, Azure Service Bus"
    description: "Handles message durability and event streams for hybrid synchronization."
  - type: "container"
    name: "Azure SQL Database"
    technology: "Azure SQL Database, Azure Managed Identity, TDE"
    description: "Modern isolated persistence layer for migrated claims."
  - type: "container"
    name: "Audit & Activity Trail Service"
    technology: "Dedicated Microservice"
    description: "Tracks user actions across workflows."
relationships:
  - source: "Customers and Brokers"
    destination: "Web Portal (SPA)"
    description: "Accesses claims portal"
    technology: "HTTPS"
  - source: "Claims Adjusters"
    destination: "Adjuster Workspace"
    description: "Processes claims"
    technology: "HTTPS"
  - source: "Web Portal (SPA)"
    destination: "API Gateway / Router"
    description: "Sends API requests"
    technology: "TLS 1.3 / OAuth 2.0 / OIDC"
  - source: "Adjuster Workspace"
    destination: "API Gateway / Router"
    description: "Sends API requests"
    technology: "TLS 1.3 / OAuth 2.0 / OIDC"
  - source: "API Gateway / Router"
    destination: "Claims Core Service"
    description: "Routes traffic based on feature flags"
    technology: "HTTPS"
  - source: "API Gateway / Router"
    destination: "Legacy Mainframe"
    description: "Routes unmigrated traffic"
    technology: "HTTPS / mTLS"
  - source: "Claims Core Service"
    destination: "Azure SQL Database"
    description: "Reads and writes claim data"
    technology: "Azure Managed Identity / TDE"
  - source: "Claims Core Service"
    destination: "Integration & Sync Engine"
    description: "Publishes and consumes events"
    technology: "AMQP / Kafka Protocol"
  - source: "Integration & Sync Engine"
    destination: "Anti-Corruption Layer (ACL)"
    description: "Communicates with legacy systems"
    technology: "mTLS over IPsec VPN/ExpressRoute"
  - source: "Anti-Corruption Layer (ACL)"
    destination: "Legacy Mainframe"
    description: "Synchronizes data with system of record"
    technology: "mTLS over IPsec VPN/ExpressRoute"
  - source: "Claims Core Service"
    destination: "Audit & Activity Trail Service"
    description: "Logs user actions"
    technology: "REST / Internal Messaging"
  - source: "Web Portal (SPA)"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OAuth 2.0 / OpenID Connect"
  - source: "Adjuster Workspace"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OAuth 2.0 / OpenID Connect"