level: component
scope: "Component diagram for the Azure SQL Database container"
parentContainer:
  name: "Azure SQL Database"
elements:
  - type: "component"
    name: "Claim Aggregates Repository"
    technology: "Azure SQL Database (Serverless tier), TDE, Azure Private Endpoint"
    description: "Stores and manages claim aggregates with strong consistency, auto-scaling, and secure data isolation."
  - type: "component"
    name: "Managed Identity Authentication Handler"
    technology: "Azure AD Managed Identity"
    description: "Enforces passwordless authentication and eliminates embedded credentials for database access."
  - type: "component"
    name: "PII Protection Enclave"
    technology: "Always Encrypted with Secure Enclaves"
    description: "Protects sensitive PII data at rest, in transit, and during computation."
relationships:
  - source: "Claim Aggregates Repository"
    destination: "PII Protection Enclave"
    description: "Secures sensitive PII fields within claim records"
  - source: "Managed Identity Authentication Handler"
    destination: "Claim Aggregates Repository"
    description: "Authenticates incoming database connections securely"