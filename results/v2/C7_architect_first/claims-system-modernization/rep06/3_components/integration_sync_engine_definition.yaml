level: component
scope: "Component diagram for the Integration & Sync Engine container"
parentContainer:
  name: "Integration & Sync Engine"
elements:
  - type: "component"
    name: "Message Broker Interface"
    technology: "Azure Service Bus Premium"
    description: "Handles pub/sub, partitioning, and dead-lettering for reliable data synchronization."
  - type: "component"
    name: "Idempotency & Reconciliation Worker"
    technology: "Spring Boot (Java)"
    description: "Enforces deduplication, business-level reconciliation, and state tracking."
  - type: "component"
    name: "Azure SQL Database"
    technology: "Azure SQL"
    description: "Persistent store for transaction hashes and state tracking."
  - type: "component"
    name: "Azure Key Vault"
    technology: "Azure Key Vault"
    description: "Secure storage for tokenized PII and sensitive claim field values."
  - type: "component"
    name: "Business-Facing DLQ Dashboard & Metrics"
    technology: "Operational Visibility Tools"
    description: "Provides operational visibility for tracking failed syncs and migration progress."
relationships:
  - source: "Claims Core Service"
    destination: "Message Broker Interface"
    description: "Publishes domain events [AMQP over TLS]"
  - source: "Message Broker Interface"
    destination: "Anti-Corruption Layer (ACL)"
    description: "Relays sync messages to mainframe [AMQP over ExpressRoute/mTLS]"
  - source: "Idempotency & Reconciliation Worker"
    destination: "Azure SQL Database"
    description: "Enforces deduplication [JDBC/TLS]"
  - source: "Claims Core Service"
    destination: "Azure Key Vault"
    description: "Tokenizes and retrieves high-risk PII [HTTPS/REST]"