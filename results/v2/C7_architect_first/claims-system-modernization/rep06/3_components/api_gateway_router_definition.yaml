level: component
scope: "Component diagram for the API Gateway / Router container"
parentContainer:
  name: "API Gateway / Router"
elements:
  - type: "component"
    name: "Dynamic Route Dispatcher"
    technology: "YARP (Yet Another Reverse Proxy)"
    description: "Routes migrated claim traffic and unmigrated legacy traffic dynamically."
  - type: "component"
    name: "Circuit Breaker & Fallback Handler"
    technology: ".NET / YARP Middleware"
    description: "Handles circuit breaking and fallbacks for service resilience."
  - type: "component"
    name: "Token Validation Middleware"
    technology: ".NET Middleware / OAuth 2.0 / OIDC"
    description: "Validates incoming authentication tokens for requests."
  - type: "component"
    name: "Audit Interceptor"
    technology: ".NET Middleware"
    description: "Dispatches routing telemetry and audit data."
  - type: "component"
    name: "Error Translation Middleware"
    technology: ".NET Middleware / RFC 7807"
    description: "Translates errors into standardized error payloads."
relationships:
  - source: "Dynamic Route Dispatcher"
    destination: "Claims Core Service"
    description: "Routes migrated claim traffic [gRPC / HTTPS]"
  - source: "Dynamic Route Dispatcher"
    destination: "Legacy Mainframe"
    description: "Routes unmigrated traffic [HTTPS / mTLS]"
  - source: "Dynamic Route Dispatcher"
    destination: "Audit Interceptor"
    description: "Dispatches routing telemetry [In-process]"
  - source: "Error Translation Middleware"
    destination: "Web Portal (SPA)"
    description: "Returns standardized error payloads [HTTPS / RFC 7807]"
  - source: "Error Translation Middleware"
    destination: "Adjuster Workspace"
    description: "Returns standardized error payloads [HTTPS / RFC 7807]"