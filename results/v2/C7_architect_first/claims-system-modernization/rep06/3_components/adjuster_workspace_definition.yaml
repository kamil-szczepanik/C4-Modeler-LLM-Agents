level: component
scope: "Component diagram for the Adjuster Workspace container"
parentContainer:
  name: "Adjuster Workspace"
elements:
  - type: "component"
    name: "Workspace Shell Component"
    technology: "React, TypeScript"
    description: "Powers responsive frontend components for rapid UI development and integrates with the Identity Provider."
  - type: "component"
    name: "Claim Processing Dashboard"
    technology: "React, TanStack Query"
    description: "Provides optimistic UI updates and local caching to mask legacy mainframe latency."
  - type: "component"
    name: "Integration Client Layer"
    technology: "Axios, OpenAPI client"
    description: "Handles outbound API calls to the API Gateway and interfaces with telemetry."
  - type: "component"
    name: "State & Offline Manager Component"
    technology: "Zustand, IndexedDB, Web Crypto API"
    description: "Manages local offline state and draft caching with client-side encryption."
  - type: "component"
    name: "Telemetry & Tracing Interceptor"
    technology: "OpenTelemetry JS"
    description: "Captures distributed tracing headers (W3C Trace Context) while scrubbing PII."
relationships:
  - source: "Claim Processing Dashboard"
    destination: "State & Offline Manager Component"
    description: "Uses [In-memory / IndexedDB]"
  - source: "Integration Client Layer"
    destination: "Telemetry & Tracing Interceptor"
    description: "Uses [HTTPS]"