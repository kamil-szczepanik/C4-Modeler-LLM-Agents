level: component
scope: "Component diagram for the Claims Core Service container"
parentContainer:
  name: "Claims Core Service"
elements:
  - type: "component"
    name: "Claim Submission REST API"
    technology: "Spring Web"
    description: "Handling online submissions via HTTPS."
  - type: "component"
    name: "Claim Workflow Engine"
    technology: "Spring State Machine"
    description: "Managing adjuster lifecycles, SLAs, and audits."
  - type: "component"
    name: "Mainframe Sync Adaptor"
    technology: "Apache Kafka"
    description: "Component communicating with the Anti-Corruption Layer via Apache Kafka."
  - type: "component"
    name: "Data Access Repository"
    technology: "Spring Data JPA"
    description: "Spring Data JPA component interacting with Azure SQL Database."
  - type: "component"
    name: "Feature Flag Router Component"
    technology: "Spring Cloud Feature Management"
    description: "Spring Cloud Feature Management component for dynamic claim-type routing."
relationships:
  - source: "API Gateway / Router"
    destination: "Claim Submission REST API"
    description: "Routes online claim requests [HTTPS / OAuth2]"
  - source: "Claim Submission REST API"
    destination: "Claim Workflow Engine"
    description: "Forwards validated submissions for processing [Internal Method Call]"
  - source: "Claim Workflow Engine"
    destination: "Data Access Repository"
    description: "Persists workflow state and claim data [Spring Data JPA / TLS 1.3]"
  - source: "Mainframe Sync Adaptor"
    destination: "Integration & Sync Engine"
    description: "Publishes and consumes asynchronous events [AMQP / Apache Kafka Protocol with mTLS]"
  - source: "Claim Workflow Engine"
    destination: "Audit & Activity Trail Service"
    description: "Emits cryptographically signed business audit events [REST / Internal Messaging]"