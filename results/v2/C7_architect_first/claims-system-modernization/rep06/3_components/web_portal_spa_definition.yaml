level: component
scope: "Component diagram for the Web Portal (SPA) container"
parentContainer:
  name: "Web Portal (SPA)"
elements:
  - type: "component"
    name: "Core Frontend Framework"
    technology: "React & TypeScript"
    description: "Core frontend framework for building the SPA with high maintainability."
  - type: "component"
    name: "Global Edge Hosting"
    technology: "Azure Static Web Apps"
    description: "Global edge hosting and deployment for the SPA."
  - type: "component"
    name: "State Management Engine"
    technology: "TanStack Query"
    description: "Manages server-state caching, retries, and synchronization."
  - type: "component"
    name: "Local Storage Engine"
    technology: "Dexie.js & IndexedDB"
    description: "Enables offline-resilient local form persistence."
  - type: "component"
    name: "Monitoring Service"
    technology: "Azure Application Insights"
    description: "Provides real-user monitoring (RUM) and error telemetry."
relationships:
  - source: "Core Frontend Framework"
    destination: "State Management Engine"
    description: "Uses for server-state caching and synchronization"
  - source: "Core Frontend Framework"
    destination: "Local Storage Engine"
    description: "Persists form data locally for offline resilience"
  - source: "Core Frontend Framework"
    destination: "Monitoring Service"
    description: "Sends telemetry and RUM data"