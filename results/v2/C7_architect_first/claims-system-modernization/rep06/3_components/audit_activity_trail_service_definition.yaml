level: component
scope: "Component diagram for the Audit & Activity Trail Service container"
parentContainer:
  name: "Audit & Activity Trail Service"
elements:
  - type: "component"
    name: "Audit Event Consumer"
    technology: "Spring Boot, Java 17, Azure Service Bus Client"
    description: "Consumes asynchronous audit events from the Azure Service Bus via AMQP to decouple logging from core claims processing."
  - type: "component"
    name: "Audit Processor and Encryption Engine"
    technology: "Java 17, Azure Key Vault SDK"
    description: "Applies envelope encryption and processes audit payloads to protect Personally Identifiable Information (PII)."
  - type: "component"
    name: "Audit Persistence Manager"
    technology: "Spring Data JPA, Azure Cosmos DB SQL API Client"
    description: "Persists immutable, append-only compliance logs to Azure Cosmos DB."
  - type: "component"
    name: "Compliance Query API"
    technology: "Spring Web, REST / HTTPS, Azure AD PIM/MFA"
    description: "Provides secured REST endpoints for compliance officers and support managers to query audit trails."
  - type: "component"
    name: "Change Feed Streamer"
    technology: "Azure Cosmos DB Change Feed Processor, TLS"
    description: "Streams change feeds from Azure Cosmos DB to Azure Data Lake for regulatory reporting."
relationships:
  - source: "Audit Event Consumer"
    destination: "Audit Processor and Encryption Engine"
    description: "Passes raw audit payloads for encryption and processing [In-memory]"
  - source: "Audit Processor and Encryption Engine"
    destination: "Audit Persistence Manager"
    description: "Sends encrypted payloads for storage [In-memory]"
  - source: "Audit Persistence Manager"
    destination: "Azure Cosmos DB (SQL API)"
    description: "Persists append-only logs [TLS / Spring Data JPA]"
  - source: "Compliance Query API"
    destination: "Audit Persistence Manager"
    description: "Queries stored audit logs [In-memory]"
  - source: "Change Feed Streamer"
    destination: "Azure Data Lake"
    description: "Streams change feeds for reporting [Encrypted TLS]"