level: container
scope: "Container diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
elements:
  - type: "person"
    name: "Customer"
    description: "End-users who submit claims via the modern web applications."
  - type: "person"
    name: "Broker"
    description: "Intermediaries who assist in managing and submitting claims."
  - type: "person"
    name: "Claims Adjuster"
    description: "Internal staff who utilize the adjuster workflows with asynchronous caching for fast load times."
  - type: "externalSystem"
    name: "Mainframe Claims System"
    description: "30-year-old on-premise legacy system (IBM z/OS, COBOL, DB2) acting as the system of record."
  - type: "externalSystem"
    name: "Corporate Active Directory"
    description: "Directory service used for user authentication via OIDC and OAuth2."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "Third-party service utilized for automated claim payouts."
  - type: "container"
    name: "Claims Web Application"
    technology: "Azure Static Web Apps, React, TypeScript"
    description: "Frontend application providing fast client-side rendering for customer submissions and adjuster workflows."
  - type: "container"
    name: "API Gateway / BFF"
    technology: ".NET Core"
    description: "Backend-for-Frontend managing routing, authentication, and communication with backend services."
  - type: "container"
    name: "Claims Processing Service"
    technology: ".NET Core, Azure Container Apps"
    description: "Scalable business logic service for processing insurance claims."
  - type: "container"
    name: "Integration & Anti-Corruption Layer"
    technology: "Azure Functions, Azure Service Bus"
    description: "Asynchronous hybrid synchronization layer decoupling modern platform from the legacy mainframe."
  - type: "container"
    name: "Claims Database"
    technology: "Azure SQL, Transparent Data Encryption (TDE)"
    description: "Structured claim data store."
  - type: "container"
    name: "Configuration & Feature Store"
    technology: "Azure App Configuration"
    description: "Dynamic feature flagging and routing configuration."
  - type: "container"
    name: "Security & Observability"
    technology: "Azure Key Vault, Azure Monitor, Azure WAF, Azure Active Directory (Entra ID)"
    description: "Robust protection, secret management, and monitoring."
relationships:
  - source: "Customer"
    destination: "Claims Web Application"
    description: "Interacts with the web application for claim submissions"
    technology: "HTTPS / JSON"
  - source: "Broker"
    destination: "Claims Web Application"
    description: "Interacts with the web application for claim submissions and management"
    technology: "HTTPS / JSON"
  - source: "Claims Adjuster"
    destination: "Claims Web Application"
    description: "Utilizes the adjuster workflows via the web application"
    technology: "HTTPS / JSON"
  - source: "Claims Web Application"
    destination: "API Gateway / BFF"
    description: "Sends API requests and authenticates users"
    technology: "HTTPS / JSON (OIDC/JWT)"
  - source: "API Gateway / BFF"
    destination: "Claims Processing Service"
    description: "Routes requests to business logic"
    technology: "HTTPS / gRPC"
  - source: "API Gateway / BFF"
    destination: "Configuration & Feature Store"
    description: "Fetches dynamic feature flags and routing configurations"
    technology: "HTTPS / gRPC"
  - source: "Claims Processing Service"
    destination: "Claims Database"
    description: "Reads and writes structured claim data"
    technology: "TDS / SQL"
  - source: "Integration & Anti-Corruption Layer"
    destination: "Mainframe Claims System"
    description: "Synchronizes data and handles hybrid integration fallback"
    technology: "mTLS / AMQP"
  - source: "Modern Claims Platform"
    destination: "Corporate Active Directory"
    description: "Authenticates users"
    technology: "OIDC / OAuth2"
  - source: "Modern Claims Platform"
    destination: "External Payment Gateway"
    description: "Integrates for automated claim payouts"
    technology: "HTTPS / REST API"