level: component
scope: "Component diagram for the Integration & Anti-Corruption Layer container"
parentContainer:
  name: "Integration & Anti-Corruption Layer"
elements:
  - type: "component"
    name: "Mainframe Translation Adapter"
    technology: ".NET 8 / Azure Functions"
    description: "Translates payloads between modern cloud formats and legacy systems, interacting with the mainframe via mTLS."
  - type: "component"
    name: "Batch Window Throttler"
    technology: "Azure Service Bus"
    description: "Queues and throttles messages to respect the strict nightly batch window."
  - type: "component"
    name: "Dual-Write Router"
    technology: ".NET Core / Azure Functions with Durable Functions"
    description: "Orchestrates dual-write synchronization, protocol translation, and state routing."
  - type: "component"
    name: "Claim Provenance & Audit Registry"
    technology: "Azure Cosmos DB / Redis / Azure Table Storage"
    description: "Maintains real-time claim provenance and routing state for rapid fallback."
  - type: "component"
    name: "Claims Processing Service"
    technology: ".NET Core / Azure Container Apps"
    description: "Processes claims logic within the hybrid Azure cloud platform."
  - type: "component"
    name: "Mainframe Claims System"
    technology: "COBOL / DB2"
    description: "Legacy regional insurer mainframe claims system."
relationships:
  - source: "Claims Processing Service"
    destination: "Dual-Write Router"
    description: "gRPC"
  - source: "Dual-Write Router"
    destination: "Claim Provenance & Audit Registry"
    description: "gRPC / Low-latency read-write"
  - source: "Mainframe Translation Adapter"
    destination: "Claim Provenance & Audit Registry"
    description: "gRPC"
  - source: "Mainframe Translation Adapter"
    destination: "Mainframe Claims System"
    description: "mTLS / TCP via ExpressRoute"