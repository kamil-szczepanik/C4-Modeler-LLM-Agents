level: component
scope: "Component diagram for the Claims Web Application container"
parentContainer:
  name: "Claims Web Application"
elements:
  - type: "component"
    name: "Routing & Shell Component"
    technology: "React Router, WCAG 2.1 AA"
    description: "Provides layout structure, navigation, and ensures accessibility standards."
  - type: "component"
    name: "Authentication Client Component"
    technology: "MSAL.js, memory-only token storage"
    description: "Handles user authentication and maintains security via memory-only token storage."
  - type: "component"
    name: "Claim Submission Feature Component"
    technology: "React Hook Form, Zod, local storage persistence"
    description: "Manages multi-step claim submissions with client-side validation and local storage resilience."
  - type: "component"
    name: "Adjuster Workspace Component"
    technology: "TanStack Query"
    description: "Delivers adjuster dashboard interfaces leveraging aggressive caching to maintain <2s screen loads."
  - type: "component"
    name: "API Client Component"
    technology: "Axios, Application Insights integration"
    description: "Centralized HTTP client managing communication with the BFF and streaming telemetry."
relationships:
  - source: "Routing & Shell Component"
    destination: "Authentication Client Component"
    description: "Validates user session and access permissions"
  - source: "Routing & Shell Component"
    destination: "Claim Submission Feature Component"
    description: "Renders submission view"
  - source: "Routing & Shell Component"
    destination: "Adjuster Workspace Component"
    description: "Renders adjuster workspace view"
  - source: "Claim Submission Feature Component"
    destination: "API Client Component"
    description: "Sends claim payloads via HTTPS"
  - source: "Adjuster Workspace Component"
    destination: "API Client Component"
    description: "Fetches claim data via HTTPS"
  - source: "API Client Component"
    destination: "Azure Monitor / Application Insights"
    description: "Streams telemetry via HTTPS"