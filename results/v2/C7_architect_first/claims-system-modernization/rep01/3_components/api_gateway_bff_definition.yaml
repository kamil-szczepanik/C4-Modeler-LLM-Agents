level: component
scope: "Component diagram for the API Gateway / BFF container"
parentContainer:
  name: "API Gateway / BFF"
elements:
  - type: "component"
    name: "Routing & Proxy Component"
    technology: "YARP (Yet Another Reverse Proxy)"
    description: "Handles high-performance routing, load balancing, and canary rollouts for phased claim migrations."
  - type: "component"
    name: "Authentication & Authorization Middleware"
    technology: ".NET Core Middleware"
    description: "Secures incoming traffic, manages authentication, and processes OIDC/JWT tokens."
  - type: "component"
    name: "Feature Routing & Orchestration Component"
    technology: ".NET Core with Local Fallback Cache"
    description: "Orchestrates phased claim migrations using dynamic feature flags and local fallback caching for business continuity."
  - type: "component"
    name: "Context Propagation Middleware"
    technology: ".NET Core Middleware"
    description: "Injects and propagates OpenTelemetry trace contexts and metadata headers across hybrid cloud boundaries."
  - type: "component"
    name: "Rate Limiting & Resilience Component"
    technology: "Polly"
    description: "Provides rate limiting, resilience, and fault tolerance for outgoing calls."
relationships:
  - source: "Claims Web Application"
    destination: "Routing & Proxy Component"
    description: "HTTPS / JSON (OIDC/JWT)"
  - source: "Routing & Proxy Component"
    destination: "Authentication & Authorization Middleware"
    description: "Validates requests"
  - source: "Authentication & Authorization Middleware"
    destination: "Feature Routing & Orchestration Component"
    description: "Forwards authenticated requests"
  - source: "Feature Routing & Orchestration Component"
    destination: "Context Propagation Middleware"
    description: "Enriches request with trace contexts"
  - source: "Context Propagation Middleware"
    destination: "Rate Limiting & Resilience Component"
    description: "Applies resilience and limits"
  - source: "Rate Limiting & Resilience Component"
    destination: "Claims Processing Service"
    description: "gRPC (mTLS, TLS 1.3) with OpenTelemetry trace contexts and metadata headers"
  - source: "Rate Limiting & Resilience Component"
    destination: "Integration & Anti-Corruption Layer"
    description: "gRPC (mTLS, TLS 1.3) with OpenTelemetry trace contexts and metadata headers"
  - source: "Feature Routing & Orchestration Component"
    destination: "Configuration & Feature Store"
    description: "HTTPS / gRPC with local fallback cache"