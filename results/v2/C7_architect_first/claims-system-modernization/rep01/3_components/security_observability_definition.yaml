level: component
scope: "Component diagram for the Security & Observability container"
parentContainer:
  name: "Security & Observability"
elements:
  - type: "component"
    name: "Token Validator Component"
    technology: ".NET Core Middleware, OpenID Connect"
    description: "Validates security tokens and integrates with identity providers."
  - type: "component"
    name: "Secret Manager Client"
    technology: "Managed Identities, Azure Key Vault"
    description: "Manages secure access to secrets and credentials."
  - type: "component"
    name: "Telemetry Aggregator"
    technology: "OpenTelemetry SDK, gRPC, Azure Monitor"
    description: "Collects and aggregates distributed tracing and metrics."
  - type: "component"
    name: "Audit Logger Component"
    technology: ".NET Core library, Azure Log Analytics"
    description: "Provides immutable audit logging for compliance and tracking."
  - type: "component"
    name: "mTLS Termination Proxy"
    technology: "Azure Container Apps Ingress"
    description: "Handles mTLS termination for secure hybrid communication."
  - type: "component"
    name: "Automated Rotation Service"
    technology: "Azure Event Grid, Azure Functions"
    description: "Automates the rotation of credentials and secrets."
relationships:
  - source: "Token Validator Component"
    destination: "Azure AD (Entra ID)"
    description: "OpenID Connect / HTTPS"
  - source: "Secret Manager Client"
    destination: "Azure Key Vault"
    description: "Managed Identities / HTTPS / REST"
  - source: "Telemetry Aggregator"
    destination: "Azure Monitor"
    description: "gRPC / OpenTelemetry"
  - source: "mTLS Termination Proxy"
    destination: "On-Premise Mainframe"
    description: "mTLS / HTTPS"