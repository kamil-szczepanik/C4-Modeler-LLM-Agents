level: component
scope: "Component diagram for the Claims Processing Service container"
parentContainer:
  name: "Claims Processing Service"
elements:
  - type: "component"
    name: "Claims Orchestrator"
    technology: ".NET/C#"
    description: "State machine managing claim lifecycles and idempotency."
  - type: "component"
    name: "Claim Type Adapter"
    technology: ".NET/C# (Strategy Pattern)"
    description: "Strategy-pattern implementation for isolated feature toggling and rapid rollbacks."
  - type: "component"
    name: "Validation & Rules Engine"
    technology: ".NET/C#"
    description: "Evaluates business logic locally before persistence."
  - type: "component"
    name: "Idempotency & Outbox Processor"
    technology: ".NET/C#"
    description: "Ensures exactly-once processing and handles circuit breaking during batch windows."
  - type: "component"
    name: "Audit Logging Component"
    technology: ".NET/C# / Azure SQL Ledger"
    description: "Captures immutable business events using Azure SQL Ledger."
  - type: "component"
    name: "Claims Database"
    technology: "Azure SQL / Entity Framework Core"
    description: "Primary database offering tamper-evident audit logs and persistence."
relationships:
  - source: "Claims Orchestrator"
    destination: "Claim Type Adapter"
    description: "Invokes type-specific workflows via In-process C# Interfaces."
  - source: "Claim Type Adapter"
    destination: "Claims Database"
    description: "Persists state changes via Entity Framework Core [TDS / SQL]."
  - source: "Claims Orchestrator"
    destination: "Idempotency & Outbox Processor"
    description: "Persists outbox messages transactionally [In-process / C#]."
  - source: "Claims Orchestrator"
    destination: "Audit Logging Component"
    description: "Emits audit trails [In-process / C#]."
  - source: "Idempotency & Outbox Processor"
    destination: "Claims Database"
    description: "Stores deduplication keys [TDS / SQL]."