level: component
scope: "Component diagram for the Configuration & Feature Store container"
parentContainer:
  name: "Configuration & Feature Store"
elements:
  - type: "component"
    name: "Feature Flag Manager"
    technology: "Azure App Configuration Feature Management"
    description: "Manages dynamic feature flags for gradual claim type migration and toggling."
  - type: "component"
    name: "Dynamic Routing Store"
    technology: "Azure App Configuration KV-sets"
    description: "Stores endpoint routing maps for navigation between legacy mainframe and the new cloud platform."
  - type: "component"
    name: "GitOps Deployment Pipeline"
    technology: "Bicep/Terraform with automated JSON schema validation"
    description: "Ensures all routing changes and feature toggles are version-controlled, validated, and automatically synced."
  - type: "component"
    name: "Break-Glass Workflow"
    technology: "Automated emergency PR mechanism"
    description: "Triggers rapid rollbacks and instant claim-type fallback during emergencies."
  - type: "component"
    name: "API Gateway / BFF"
    technology: ".NET Core"
    description: "Evaluates feature flags and retrieves endpoint routing maps."
  - type: "component"
    name: "Emergency Operators"
    technology: "Human / External"
    description: "Operators who trigger instant claim-type fallback during emergencies."
relationships:
  - source: "API Gateway / BFF"
    destination: "Feature Flag Manager"
    description: "Evaluates feature flags [HTTPS / Azure SDK, polling/push via Event Grid]"
  - source: "API Gateway / BFF"
    destination: "Dynamic Routing Store"
    description: "Retrieves endpoint routing maps [HTTPS / Azure SDK]"
  - source: "Emergency Operators"
    destination: "Break-Glass Workflow"
    description: "Triggers instant claim-type fallback [HTTPS]"