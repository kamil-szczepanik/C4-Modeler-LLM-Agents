level: context
scope: "System Context diagram for Hybrid Cloud Insurance Claims Modernization Platform"
system:
  name: "Hybrid Cloud Insurance Claims Modernization Platform"
  description: "A hybrid cloud insurance claims modernization platform that gradually replaces a legacy COBOL/DB2 mainframe while ensuring zero data loss and continuous operations."
elements:
  - type: "person"
    name: "Customers"
    description: "End users who perform modern digital claim submission via web and mobile clients."
  - type: "person"
    name: "Brokers"
    description: "Partners who assist with insurance claims and interact via digital channels."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff who use the high-performance web application for claims processing."
  - type: "externalSystem"
    name: "On-premises COBOL/DB2 Mainframe"
    description: "The legacy System of Record containing core insurance data."
  - type: "externalSystem"
    name: "Insurer Active Directory"
    description: "On-premises identity provider connected via Azure AD / Entra ID Connect."
relationships:
  - source: "Customers"
    destination: "Hybrid Cloud Insurance Claims Modernization Platform"
    description: "Accesses web and mobile client interfaces for claim submission"
    technology: "HTTPS via TLS 1.3"
  - source: "Brokers"
    destination: "Hybrid Cloud Insurance Claims Modernization Platform"
    description: "Accesses web and mobile client interfaces for claims assistance"
    technology: "HTTPS via TLS 1.3"
  - source: "Claims Adjusters"
    destination: "Hybrid Cloud Insurance Claims Modernization Platform"
    description: "Uses the high-performance web application for claims processing"
    technology: "HTTPS via TLS 1.3"
  - source: "Hybrid Cloud Insurance Claims Modernization Platform"
    destination: "On-premises COBOL/DB2 Mainframe"
    description: "Asynchronous messaging and integration through the Anti-Corruption Layer"
    technology: "Azure Service Bus with Dead Letter Queues, mTLS, TLS 1.3"
  - source: "Hybrid Cloud Insurance Claims Modernization Platform"
    destination: "Insurer Active Directory"
    description: "Performs Single Sign-On and user authentication"
    technology: "OIDC / OAuth2 over HTTPS"