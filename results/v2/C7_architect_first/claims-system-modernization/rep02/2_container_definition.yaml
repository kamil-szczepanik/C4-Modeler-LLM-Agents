level: container
scope: "Container diagram for Hybrid Cloud Insurance Claims Modernization Platform"
system:
  name: "Hybrid Cloud Insurance Claims Modernization Platform"
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "External actors who submit claims and interact via digital channels."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff who process claims using the adjuster workspace."
  - type: "externalSystem"
    name: "Insurer Active Directory"
    description: "External identity provider system for authentication and authorization."
  - type: "externalSystem"
    name: "On-Premises COBOL/DB2 Mainframe"
    description: "Legacy system of record for core insurance processing."
  - type: "container"
    name: "API Gateway / BFF"
    technology: "Node.js / TypeScript Container"
    description: "Backend for Frontend and API gateway managing client requests."
  - type: "container"
    name: "Customer Portal and Adjuster Workspace"
    technology: "React Web Apps in Azure Static Web Apps"
    description: "Frontend web applications for customers, brokers, and adjusters."
  - type: "container"
    name: "Claims Processing Service"
    technology: "Java Spring Boot Container"
    description: "Core business logic service for processing claims."
  - type: "container"
    name: "Integration Bridge"
    technology: "Apache Camel / Azure Integration Services Container"
    description: "Middleware bridging modern services and legacy mainframe via secure channels."
  - type: "container"
    name: "Reference Data & Policy Cache"
    technology: "Redis Container"
    description: "Caching layer providing fast access to reference data and policies."
  - type: "container"
    name: "Notification Service"
    technology: "Azure Communication Services Container"
    description: "Service responsible for dispatching notifications to users."
  - type: "container"
    name: "Audit Logging Container"
    technology: "WORM Storage"
    description: "Secure storage ensuring immutable audit logs."
  - type: "container"
    name: "Document & Evidence Management Service"
    technology: "Azure Blob Storage Container"
    description: "Storage container for managing documents and claim evidence."
  - type: "container"
    name: "Self-Service Dashboard Backend"
    technology: "Container"
    description: "Backend supporting the self-service dashboard capabilities."
relationships:
  - source: "Customers and Brokers"
    destination: "API Gateway / BFF"
    description: "Accesses APIs via BFF"
    technology: "HTTPS/REST"
  - source: "API Gateway / BFF"
    destination: "Insurer Active Directory"
    description: "Performs Single Sign-On"
    technology: "OpenID Connect (OIDC)"
  - source: "Claims Adjusters"
    destination: "Customer Portal and Adjuster Workspace"
    description: "Uses the adjuster workspace"
    technology: "HTTPS"
  - source: "Customer Portal and Adjuster Workspace"
    Reference Data & Policy Cache:
    destination: "Reference Data & Policy Cache"
    description: "Queries data for sub-2s performance"
    technology: "gRPC"
  - source: "Claims Processing Service"
    destination: "Integration Bridge"
    description: "Sends asynchronous messages"
    technology: "Azure Service Bus"
  - source: "Integration Bridge"
    destination: "On-Premises COBOL/DB2 Mainframe"
    description: "Communicates with legacy mainframe securely"
    technology: "IPsec VPN, ExpressRoute, and mTLS"