level: component
scope: "Component diagram for the Reference Data & Policy Cache container"
parentContainer:
  name: "Reference Data & Policy Cache"
elements:
  - type: "component"
    name: "Policy Data Cache Manager"
    technology: "Azure Cache for Redis"
    description: "Manages in-memory caching and rapid retrieval of policy and reference data for sub-2-second adjuster response times."
  - type: "component"
    name: "Sync Ingestion Listener"
    technology: "Apache Camel / Redis Pub-Sub"
    description: "Listens for nightly batch deltas and real-time updates to keep the cache synchronized."
relationships:
  - source: "Sync Ingestion Listener"
    destination: "Policy Data Cache Manager"
    description: "Updates cached records [Internal Redis API]"