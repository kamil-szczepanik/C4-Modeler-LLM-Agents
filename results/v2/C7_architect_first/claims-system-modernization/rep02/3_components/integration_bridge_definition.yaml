level: component
scope: "Component diagram for the Integration Bridge container"
parentContainer:
  name: "Integration Bridge"
elements:
  - type: "component"
    name: "Route Orchestrator"
    technology: "Apache Camel Core Component"
    description: "Handles internal routing and enterprise integration patterns."
  - type: "component"
    name: "Mainframe Adapter Component"
    technology: "Apache Camel / Azure Integration Services"
    description: "Interfaces securely with the on-premises legacy mainframe."
  - type: "component"
    name: "Dead Letter Queue (DLQ) Handler Component"
    technology: "Apache Camel"
    description: "Handles failed messages and triggers business exception alerts."
  - type: "component"
    name: "Circuit Breaker & Rate Limiting Component"
    technology: "Resilience4j via Camel"
    description: "Protects the legacy mainframe via circuit breaking and backpressure."
  - type: "component"
    name: "Fallback Routing Switch Component"
    technology: "Apache Camel"
    description: "Allows rapid fallback per claim type."
  - type: "component"
    name: "Key Vault Secrets Provider Component"
    technology: "Azure Key Vault / Managed Identity"
    description: "Dynamically fetches credentials and secrets."
  - type: "component"
    name: "Reconciliation & Business Dashboard Adapter Component"
    technology: "Apache Camel"
    description: "Adapts data for reconciliation and business dashboards."
relationships:
  - source: "Route Orchestrator"
    destination: "Mainframe Adapter Component"
    description: "Internal routing [Direct VM / In-Memory]"
  - source: "Key Vault Secrets Provider Component"
    destination: "Azure Key Vault"
    description: "Dynamically fetches credentials and secrets [HTTPS / Managed Identity]"
  - source: "DLQ Handler Component"
    destination: "Notification Service"
    description: "Triggers business exception alerts [REST API]"