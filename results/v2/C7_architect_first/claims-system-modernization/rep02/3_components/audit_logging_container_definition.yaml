level: component
scope: "Component diagram for the Audit Logging Container container"
parentContainer:
  name: "Audit Logging Container"
elements:
  - type: "component"
    name: "Audit Ingestion API"
    technology: "Azure Function, Node.js"
    description: "Receives raw audit events via HTTPS and OAuth2/JWT using Azure Managed Identities."
  - type: "component"
    name: "PII Sanitizer & Normalizer"
    technology: "Lightweight container"
    description: "Sanitizes and normalizes raw events from the internal queue."
  - type: "component"
    name: "Immutable Storage Writer"
    technology: "Azure Blob Storage with WORM Policy"
    description: "Writes encrypted objects ensuring regulatory compliance through time-based immutability."
  - type: "component"
    name: "Azure Key Vault HSM"
    technology: "Azure Key Vault HSM"
    description: "Provides Customer-Managed Keys (CMK) for envelope encryption of sensitive claims data."
  - type: "component"
    name: "Azure Monitor and Application Insights"
    technology: "Azure Monitor"
    description: "Collects telemetry from the Audit Ingestion API and Sanitizer via HTTPS."
relationships:
  - source: "Claims Processing Service"
    destination: "Audit Ingestion API"
    description: "Invokes via HTTPS and OAuth2/JWT using Azure Managed Identities"
  - source: "Audit Ingestion API"
    destination: "PII Sanitizer & Normalizer"
    description: "Passes raw events via internal queue"
  - source: "PII Sanitizer & Normalizer"
    destination: "Immutable Storage Writer"
    description: "Writes encrypted objects via Azure SDK (HTTPS)"
  - source: "Azure Monitor and Application Insights"
    destination: "Audit Ingestion API"
    description: "Collects telemetry via HTTPS"
  - source: "Azure Monitor and Application Insights"
    destination: "PII Sanitizer & Normalizer"
    description: "Collects telemetry via HTTPS"