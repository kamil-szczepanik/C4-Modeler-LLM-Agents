level: component
scope: "Component diagram for the Document & Evidence Management Service container"
parentContainer:
  name: "Document & Evidence Management Service"
elements:
  - type: "component"
    name: "Document API Controller"
    technology: "Spring Boot / Java Component"
    description: "Handles REST requests from the Claims Processing Service for evidence linking."
  - type: "component"
    name: "SAS Token Issuer Component"
    technology: "Java Component"
    description: "Issues short-lived SAS tokens to clients for secure, direct-to-cloud upload permissions."
  - type: "component"
    name: "Metadata Registrar Component"
    technology: "Java Component"
    description: "Finalizes upload registration after files are transferred to storage."
  - type: "component"
    name: "Virus Scanning Processor"
    technology: "Azure Function / ClamAV Container"
    description: "Asynchronously scans uploaded files for malware and moves clean files to the trusted container."
  - type: "component"
    name: "Storage Gateway"
    technology: "Azure Blob SDK"
    description: "Manages interactions with Azure Blob Storage including WORM-compliant policies."
  - type: "component"
    name: "Azure Blob Storage"
    technology: "Cloud Object Storage (Quarantine Container and Trusted Evidence WORM Container)"
    description: "Stores uploaded documents securely with strict WORM immutability policies."
  - type: "component"
    name: "Azure Event Grid"
    technology: "Event Routing Backbone (with Dead Letter Queue)"
    description: "Routes storage events to trigger asynchronous virus scanning."
  - type: "component"
    name: "Customer Portal & Adjuster Workspace"
    technology: "React Web Apps"
    description: "Client applications used by customers and adjusters to interact with evidence management."
relationships:
  - source: "Customer Portal & Adjuster Workspace"
    destination: "SAS Token Issuer Component"
    description: "Requests upload permissions via HTTPS/REST"
  - source: "Customer Portal & Adjuster Workspace"
    destination: "Azure Blob Storage"
    description: "Performs direct-to-blob upload using SAS tokens via HTTPS"
  - source: "Customer Portal & Adjuster Workspace"
    destination: "Metadata Registrar Component"
    description: "Finalizes upload registration via HTTPS/REST"
  - source: "Claims Processing Service"
    destination: "Document API Controller"
    description: "Requests evidence linking via HTTPS/REST"
  - source: "Azure Blob Storage"
    destination: "Azure Event Grid"
    description: "Triggers event on new blob creation"
  - source: "Azure Event Grid"
    destination: "Virus Scanning Processor"
    description: "Dispatches file scan event"
  - source: "Virus Scanning Processor"
    destination: "Azure Blob Storage"
    description: "Moves clean files to Trusted Container via HTTPS/Azure SDK"