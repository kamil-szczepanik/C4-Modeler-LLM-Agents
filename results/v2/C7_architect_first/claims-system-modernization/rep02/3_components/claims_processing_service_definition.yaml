level: component
scope: "Component diagram for the Claims Processing Service container"
parentContainer:
  name: "Claims Processing Service"
elements:
  - type: "component"
    name: "Claim Orchestrator"
    technology: "Spring State Machine"
    description: "Manages claim lifecycles and workflow states."
  - type: "component"
    name: "Claim Command API"
    technology: "Spring MVC"
    description: "Exposes REST endpoints for handling claim commands."
  - type: "component"
    name: "Mainframe Anti-Corruption Layer"
    technology: "Spring Integration"
    description: "Translates payloads and decouples legacy mainframe dependencies."
  - type: "component"
    name: "Event Publisher"
    technology: "Spring Cloud Stream"
    description: "Publishes domain events to the integration bridge."
  - type: "component"
    name: "SLA & Escalation Component"
    technology: "Java / Spring Boot"
    description: "Monitors and enforces claim processing SLAs and escalations."
  - type: "component"
    name: "Business Metrics & Audit Trail Component"
    technology: "Java / Spring Boot"
    description: "Tracks business metrics and maintains audit trails."
  - type: "component"
    name: "Data Access Layer"
    technology: "Spring Data JPA"
    description: "Handles persistence and data retrieval against Azure PostgreSQL."
  - type: "component"
    name: "Feature Flag Component"
    technology: "Toggle Service"
    description: "Manages feature flags to support fallback to the mainframe."
  - type: "component"
    name: "Customer Notification Trigger Component"
    technology: "Java / Spring Boot"
    description: "Triggers notifications for customers regarding claim status updates."
relationships:
  - source: "Claim Command API"
    destination: "Claim Orchestrator"
    description: "Delegates command execution and state transitions"
  - source: "Claim Orchestrator"
    destination: "Mainframe Anti-Corruption Layer"
    description: "Interacts with legacy mainframe via translation layer"
  - source: "Claim Orchestrator"
    destination: "Event Publisher"
    description: "Publishes state change events"
  - source: "Claim Orchestrator"
    destination: "Data Access Layer"
    description: "Persists claim state data"
  - source: "Claim Orchestrator"
    destination: "Customer Notification Trigger Component"
    description: "Triggers notifications based on state events"
  - source: "Claim Orchestrator"
    destination: "SLA & Escalation Component"
    description: "Evaluates SLA rules during lifecycle"
  - source: "Claim Orchestrator"
    destination: "Business Metrics & Audit Trail Component"
    description: "Records audit and metric data"
  - source: "Claim Orchestrator"
    destination: "Feature Flag Component"
    description: "Checks feature flags for routing and rollback support"