level: component
scope: "Component diagram for the Customer Portal and Adjuster Workspace container"
parentContainer:
  name: "Customer Portal and Adjuster Workspace"
elements:
  - type: "component"
    name: "Public Portal UI"
    technology: "React"
    description: "Handles customer and broker claim submissions."
  - type: "component"
    name: "Internal Workspace UI"
    technology: "React"
    description: "Manages adjuster workflows and multi-client broker dashboards."
  - type: "component"
    name: "Authentication Interceptor"
    technology: "TypeScript / MSAL.js"
    description: "Handles OIDC/OAuth2 integration with Active Directory."
  - type: "component"
    name: "BFF Client SDK"
    technology: "TypeScript"
    description: "Encapsulates API requests to backend services."
  - type: "component"
    name: "Optimistic State Manager"
    technology: "React / Zustand / IndexedDB / Web Crypto API (AES-GCM)"
    description: "Manages local state mutations, IndexedDB storage, and PII encryption at rest."
relationships:
  - source: "Internal Workspace UI"
    destination: "BFF Client SDK"
    description: "Invokes claims operations [HTTPS/REST]"
  - source: "Public Portal UI"
    destination: "BFF Client SDK"
    description: "Submits new claims [HTTPS/REST]"
  - source: "Authentication Interceptor"
    destination: "Insurer Active Directory"
    description: "Validates tokens [OIDC/HTTPS]"
  - source: "Optimistic State Manager"
    destination: "BFF Client SDK"
    description: "Synchronizes background requests [HTTPS/REST]"