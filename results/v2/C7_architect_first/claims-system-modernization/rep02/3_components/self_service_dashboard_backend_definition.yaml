level: component
scope: "Component diagram for the Self-Service Dashboard Backend container"
parentContainer:
  name: "Self-Service Dashboard Backend"
elements:
  - type: "component"
    name: "Dashboard Aggregator Component"
    technology: "NestJS / TypeScript, RxJS"
    description: "Aggregates data from legacy and modern sources using reactive stream merging."
  - type: "component"
    name: "Claim Submission Orchestrator Component"
    technology: "NestJS / TypeScript"
    description: "Orchestrates claim submission workflows between the interface and backend services."
  - type: "component"
    name: "Cache-Aside Client Component"
    technology: "NestJS / TypeScript, Redis"
    description: "Manages data retrieval and caching with the Reference Data & Policy Cache."
  - type: "component"
    name: "Auth & Context Validator Component"
    technology: "NestJS / TypeScript, OAuth2/OIDC (JWKS)"
    description: "Validates security tokens locally to minimize latency against Insurer Active Directory."
  - type: "component"
    name: "Normalization Service Component"
    technology: "NestJS / TypeScript"
    description: "Enforces an Anti-Corruption Layer to seamlessly blend legacy mainframe and modern platform data."
  - type: "component"
    name: "Event-Driven Projection Listener"
    technology: "NestJS / TypeScript, Azure WORM Storage"
    description: "Listens to events and writes audit logs to Azure WORM Storage."
relationships:
  - source: "Dashboard Aggregator Component"
    destination: "Claims Processing Service"
    description: "Communicates via gRPC / Async messaging over TLS 1.3"
  - source: "Claim Submission Orchestrator Component"
    destination: "Claims Processing Service"
    description: "Submits claims via gRPC / Async messaging over TLS 1.3"
  - source: "Cache-Aside Client Component"
    destination: "Reference Data & Policy Cache (Redis)"
    description: "Connects via mTLS"
  - source: "Auth & Context Validator Component"
    destination: "Insurer Active Directory"
    description: "Validates tokens via OAuth2/OIDC (JWKS)"
  - source: "Event-Driven Projection Listener"
    destination: "Azure WORM Storage"
    description: "Writes audit logging securely"