level: component
scope: "Component diagram for the Notification Service container"
parentContainer:
  name: "Notification Service"
elements:
  - type: "component"
    name: "Notification Router Component"
    technology: "Java / Spring Boot"
    description: "Extracts claim events via Azure Service Bus to route notifications."
  - type: "component"
    name: "Preference Resolution Component"
    technology: "Java / Spring Boot, Redis"
    description: "Resolves user notification preferences backed by Redis cache."
  - type: "component"
    name: "Template Engine Component"
    technology: "Java"
    description: "Renders notification templates for multi-channel delivery."
  - type: "component"
    name: "Azure Communication Adapter Component"
    technology: "Java, Azure SDK for Java"
    description: "Adapts messages to Azure Communication Services."
  - type: "component"
    name: "Delivery Status Tracker Component"
    technology: "Cosmos DB"
    description: "Tracks message delivery states asynchronously with CMK encryption."
relationships:
  - source: "Claims Processing Service"
    destination: "Notification Router Component"
    description: "AMQP via Azure Service Bus"
  - source: "Notification Router Component"
    destination: "Preference Resolution Component"
    description: "REST/gRPC with Redis cache"
  - source: "Template Engine Component"
    destination: "Azure Communication Adapter Component"
    description: "Spring Application Events"
  - source: "Azure Communication Adapter Component"
    destination: "Azure Communication Services"
    description: "HTTPS / TLS 1.3"