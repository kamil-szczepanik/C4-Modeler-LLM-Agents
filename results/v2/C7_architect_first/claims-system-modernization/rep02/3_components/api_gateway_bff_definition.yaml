level: component
scope: "Component diagram for the API Gateway / BFF container"
parentContainer:
  name: "API Gateway / BFF"
elements:
  - type: "component"
    name: "Routing Router"
    technology: "Node.js / TypeScript"
    description: "Evaluates dynamic claim-type routing rules and handles geo-routing coordination."
  - type: "component"
    name: "Authentication Middleware"
    technology: "OpenID Connect & JWT"
    description: "Enables single sign-on with Insurer Active Directory."
  - type: "component"
    name: "Cache Client"
    technology: "Redis"
    description: "Interfaces with Redis to store and retrieve dynamic claim-type routing rules and fallback flags."
  - type: "component"
    name: "Bridge Client"
    technology: "gRPC/mTLS"
    description: "Communicates securely with the Claims Processing Service & Integration Bridge."
relationships:
  - source: "Routing Router"
    destination: "Cache Client"
    description: "Fetches routing rules via TCP"
  - source: "Authentication Middleware"
    destination: "Insurer Active Directory"
    description: "Authenticates users via OpenID Connect (OIDC)"
  - source: "Bridge Client"
    destination: "Claims Processing Service & Integration Bridge"
    description: "Sends claims data via gRPC/mTLS"