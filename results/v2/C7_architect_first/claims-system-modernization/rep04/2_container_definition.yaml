level: container
scope: "Container diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization"
elements:
  - type: "person"
    name: "Customer/Broker"
    description: "External user who submits and views online insurance claims."
  - type: "person"
    name: "Claims Adjuster"
    description: "Internal user who manages and processes claims using the adjuster workspace."
  - type: "externalSystem"
    name: "Legacy COBOL/DB2 Mainframe"
    description: "30-year-old on-premise mainframe system acting as the core system of record."
  - type: "externalSystem"
    name: "Corporate Active Directory / Microsoft Entra ID"
    description: "Identity Provider used for user authentication and Single Sign-On."
  - type: "container"
    name: "Customer Portal"
    technology: "React, Azure Static Web Apps"
    description: "Modern web application providing online claims submission and viewing for customers and brokers."
  - type: "container"
    name: "Adjuster Workspace"
    technology: ".NET Core, Azure App Service"
    description: "Modern web application allowing adjusters to manage and process claims."
  - type: "container"
    name: "Claims Integration Service"
    technology: ".NET Core Worker Service, Azure Container Apps"
    description: "Backend service handling integration logic and asynchronous event processing."
  - type: "container"
    name: "Mainframe Adapter"
    technology: ".NET Core API, On-Premises"
    description: "On-premises API adapter that secures and translates communication with the legacy mainframe."
  - type: "container"
    name: "Azure Service Bus"
    technology: "Azure Service Bus (AMQP)"
    description: "Message broker providing reliable asynchronous eventing and zero data loss."
  - type: "container"
    name: "Azure Key Vault"
    technology: "Azure Key Vault with Managed Identities"
    description: "Secure storage for secrets, certificates, and configuration data."
relationships:
  - source: "Customer/Broker"
    destination: "Customer Portal"
    description: "Interacts with via web interface"
    technology: "HTTPS/REST"
  - source: "Claims Adjuster"
    destination: "Adjuster Workspace"
    description: "Interacts with to process claims"
    technology: "HTTPS/REST"
  - source: "Adjuster Workspace"
    destination: "Claims Integration Service"
    description: "Communicates with for claims processing logic"
    technology: "gRPC over HTTP/2 (with mandatory TLS)"
  - source: "Claims Integration Service"
    destination: "Azure Service Bus"
    description: "Publishes events to message broker"
    technology: "AMQP"
  - source: "Claims Integration Service"
    destination: "Mainframe Adapter"
    description: "Communicates with for mainframe integration"
    technology: "REST/JSON over mTLS"
  - source: "Mainframe Adapter"
    destination: "Legacy COBOL/DB2 Mainframe"
    description: "Integrates with legacy system"
    technology: "Legacy Protocol / DB2"
  - source: "Customer Portal"
    destination: "Corporate Active Directory / Microsoft Entra ID"
    description: "Authenticates users"
    technology: "OpenID Connect (OIDC)"
  - source: "Adjuster Workspace"
    destination: "Corporate Active Directory / Microsoft Entra ID"
    description: "Authenticates users"
    technology: "OpenID Connect (OIDC)"