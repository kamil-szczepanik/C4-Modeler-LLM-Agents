level: context
scope: "System Context diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization"
  description: "A cloud-native platform in Azure West Europe gradually replacing a 30-year-old on-premise mainframe, enabling online claims submission and adjuster workflows while maintaining the legacy DB2/COBOL mainframe as the system of record."
elements:
  - type: "person"
    name: "Customer/Broker"
    description: "External user who submits online insurance claims."
  - type: "person"
    name: "Claims Adjuster"
    description: "Internal user who manages and processes claims using the web UI."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise DB2/COBOL system serving as the system of record."
  - type: "externalSystem"
    name: "Corporate Active Directory"
    description: "On-premise Identity Provider (IDP) used for SSO."
  - type: "container"
    name: "Insurance Claims Platform"
    description: "Cloud-native platform handling online claims submission and adjuster workflows."
    technology: "Azure Cloud-Native"
  - type: "container"
    name: "Anti-Corruption Layer (ACL)"
    description: "Decouples cloud domain models from rigid mainframe schemas."
    technology: "Azure"
  - type: "container"
    name: "CQRS Read Model"
    description: "Isolates legacy latency to ensure sub-2-second adjuster screen loads."
    technology: "Azure"
  - type: "container"
    name: "API Gateway"
    description: "Manages incoming traffic and routing for the platform."
    technology: "Azure"
  - type: "container"
    name: "Azure Service Bus"
    description: "Handles asynchronous state synchronization using dead-letter queues."
    technology: "Azure Service Bus"
relationships:
  - source: "Customer/Broker"
    destination: "Insurance Claims Platform"
    description: "Online submission of claims"
    technology: "HTTPS"
  - source: "Claims Adjuster"
    destination: "Insurance Claims Platform"
    description: "Web UI access for workflows"
    technology: "HTTPS"
  - source: "Insurance Claims Platform"
    destination: "Legacy Mainframe"
    description: "Asynchronous state sync via batch window (23:00-05:00)"
    technology: "Asynchronous Messaging/ETL over secure Site-to-Site VPN with mTLS"
  - source: "Insurance Claims Platform"
    destination: "Corporate Active Directory"
    description: "Single Sign-On (SSO) authentication"
    technology: "OIDC/SAML"