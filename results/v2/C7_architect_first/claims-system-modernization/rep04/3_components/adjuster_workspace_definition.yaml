level: component
scope: "Component diagram for the Adjuster Workspace container"
parentContainer:
  name: "Adjuster Workspace"
elements:
  - type: "component"
    name: "UI Controller / Razor Pages"
    technology: "ASP.NET Core MVC"
    description: "Handles user interaction and renders views [HTTPS]."
  - type: "component"
    name: "Claim Processing Facade"
    technology: "C# service"
    description: "Orchestrates workflow, caching, business metrics emission, and audit logging."
  - type: "component"
    name: "Local Claim Cache"
    technology: "IMemoryCache"
    description: "Mitigates 5-second mainframe latency via short-TTL cached claim states."
  - type: "component"
    name: "Integration Client"
    technology: "gRPC client"
    description: "Communicates securely with backend services."
  - type: "component"
    name: "Auth Handler"
    technology: "ASP.NET Core Security Middleware"
    description: "Integrates with Microsoft Entra ID via OpenID Connect (OIDC)."
  - type: "component"
    name: "Claims Integration Service"
    technology: ".NET Core Worker Service"
    description: "Downstream worker service hosted in Azure Container Apps."
relationships:
  - source: "Claims Adjuster"
    destination: "UI Controller / Razor Pages"
    description: "Interacts to process claims [HTTPS/REST]"
  - source: "UI Controller / Razor Pages"
    destination: "Claim Processing Facade"
    description: "Invokes business logic [In-Process]"
  - source: "Claim Processing Facade"
    destination: "Local Claim Cache"
    description: "Reads and writes cached claim states [In-Process]"
  - source: "Claim Processing Facade"
    destination: "Integration Client"
    description: "Requests backend data [In-Process]"
  - source: "Integration Client"
    destination: "Claims Integration Service"
    description: "Fetches claim data [gRPC over HTTP/2 with TLS 1.3]"
  - source: "Auth Handler"
    destination: "Microsoft Entra ID"
    description: "Authenticates users [OpenID Connect (OIDC)]"