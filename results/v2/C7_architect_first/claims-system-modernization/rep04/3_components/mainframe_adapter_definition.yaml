level: component
scope: "Component diagram for the Mainframe Adapter container"
parentContainer:
  name: "Mainframe Adapter"
elements:
  - type: "component"
    name: "API Controller"
    technology: ".NET Core Web API"
    description: "Handles incoming REST/JSON over mTLS requests from the Claims Integration Service."
  - type: "component"
    name: "Translation Service"
    technology: ".NET Core Business Logic"
    description: "Performs in-memory data mapping and processes domain models."
  - type: "component"
    name: "Mainframe Connector"
    technology: ".NET Core Infrastructure"
    description: "Communicates with the legacy mainframe via legacy protocol and DB2 over TCP/Sockets/CICS/MQ."
  - type: "component"
    name: "Audit & Reconciliation Logger"
    technology: ".NET Core State/Log Component"
    description: "Logs state and operational metrics for audit and reconciliation purposes."
  - type: "component"
    name: "Idempotency Manager"
    technology: ".NET Core with Local SQLite/PostgreSQL"
    description: "Ensures idempotency and state persistence using local storage."
  - type: "component"
    name: "Active Directory"
    technology: "Corporate Identity Provider"
    description: "Provides corporate identity and access management."
  - type: "component"
    name: "Azure Key Vault"
    technology: "Azure Key Vault"
    description: "Provides dynamic credential sync via hybrid sync."
  - type: "component"
    name: "Legacy COBOL/DB2 Mainframe"
    technology: "Mainframe COBOL/DB2"
    description: "The legacy core banking and claims processing mainframe."
  - type: "component"
    name: "Claims Integration Service"
    technology: "Integration Service"
    description: "External service calling the Mainframe Adapter."
relationships:
  - source: "Claims Integration Service"
    destination: "API Controller"
    description: "REST/JSON over mTLS"
  - source: "API Controller"
    destination: "Translation Service"
    description: "In-memory data mapping"
  - source: "Translation Service"
    destination: "Mainframe Connector"
    description: "Processed domain models"
  - source: "Mainframe Connector"
    destination: "Legacy COBOL/DB2 Mainframe"
    description: "Legacy Protocol / DB2 over TCP/Sockets/CICS/MQ"
  - source: "Mainframe Connector"
    destination: "Azure Key Vault"
    description: "Dynamic credential sync via hybrid sync"