level: component
scope: "Component diagram for the Customer Portal container"
parentContainer:
  name: "Customer Portal"
elements:
  - type: "component"
    name: "Authentication Controller"
    technology: "React Router / OIDC client library"
    description: "Handles user authentication via OpenID Connect."
  - type: "component"
    name: "Claim Submission Form"
    technology: "React Component"
    description: "Provides the interface for submitting online claims."
  - type: "component"
    name: "Claim Status Viewer"
    technology: "React Component with Broker Workspace View"
    description: "Displays claim status and includes a broker workspace view."
  - type: "component"
    name: "Draft Management Component"
    technology: "React / Encrypted IndexedDB"
    description: "Manages secure local offline draft persistence."
  - type: "component"
    name: "API Gateway Client"
    technology: "TypeScript / Axios"
    description: "Communicates securely with the API Gateway."
  - type: "component"
    name: "Application Insights Frontend SDK"
    technology: "Azure Application Insights SDK"
    description: "Provides Real User Monitoring (RUM) and synthetic testing."
  - type: "component"
    name: "Azure Static Web Apps"
    technology: "Azure Static Web Apps"
    description: "Serverless hosting platform for the React single-page application."
  - type: "component"
    name: "Microsoft Entra ID"
    technology: "Microsoft Entra ID"
    description: "Identity provider for OIDC authentication."
  - type: "component"
    name: "Azure API Management"
    technology: "Azure API Management"
    description: "API gateway managing secure HTTPS/REST communication."
  - type: "component"
    name: "Customer / Broker"
    technology: "Human / External User"
    description: "End user accessing the web interface."
relationships:
  - source: "Customer / Broker"
    destination: "Customer Portal"
    description: "Accesses web interface via HTTPS/REST"
  - source: "Authentication Controller"
    destination: "Microsoft Entra ID"
    description: "Authenticates users via OpenID Connect (OIDC)"
  - source: "Claim Submission Form"
    destination: "API Gateway Client"
    description: "Sends/retrieves data locally"
  - source: "Claim Status Viewer"
    destination: "API Gateway Client"
    description: "Sends/retrieves data locally"
  - source: "Draft Management Component"
    destination: "API Gateway Client"
    description: "Sends/retrieves data locally"
  - source: "API Gateway Client"
    destination: "Azure API Management"
    description: "Communicates securely via HTTPS/REST"