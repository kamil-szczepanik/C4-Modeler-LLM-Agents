level: component
scope: "Component diagram for the Claims Integration Service container"
parentContainer:
  name: "Claims Integration Service"
elements:
  - type: "component"
    name: "Claim Router Component"
    technology: ".NET Core"
    description: "Routes hybrid claims processing between the Azure cloud platform and the legacy mainframe."
  - type: "component"
    name: "Outbox Processor Component"
    technology: ".NET Core"
    description: "Ensures zero-data-loss claim migration using the Transactional Outbox pattern."
  - type: "component"
    name: "Legacy Fallback Component"
    technology: ".NET Core"
    description: "Handles fallback logic and integration paths for legacy mainframe processing."
  - type: "component"
    name: "Audit & Telemetry Logger Component"
    technology: ".NET Core"
    description: "Records audit logs and telemetry data for compliance and system reliability."
  - type: "component"
    name: "Azure Service Bus"
    technology: "AMQP/AMQPS"
    description: "Reliable message broker for asynchronous event processing."
  - type: "component"
    name: "Azure App Configuration"
    technology: "HTTPS/REST"
    description: "Centralized feature flagging to support quick claim-type rollbacks."
  - type: "component"
    name: "Azure Key Vault"
    technology: "Managed Identities"
    description: "Secure credential management and envelope encryption."
  - type: "component"
    name: "Azure Application Insights"
    technology: "TLS 1.3"
    description: "Monitoring and telemetry with Customer-Managed Keys."
  - type: "component"
    name: "Mainframe Adapter"
    technology: ".NET Core API, On-Premises"
    description: "Bridges modern cloud components with the on-premise legacy mainframe."
relationships:
  - source: "Claim Router Component"
    destination: "Legacy Fallback Component"
    description: "Internal C# method calls"
  - source: "Claim Router Component"
    destination: "Audit & Telemetry Logger Component"
    description: "In-memory C# events"
  - source: "Outbox Processor Component"
    destination: "Azure Service Bus"
    description: "AMQP with AMQPS / TLS 1.3"
  - source: "Claims Integration Service"
    destination: "Azure App Configuration"
    description: "HTTPS/REST via Managed Identity"
  - source: "Claims Integration Service"
    destination: "Mainframe Adapter"
    description: "REST/JSON over mTLS"
  - source: "Claims Integration Service"
    destination: "Azure Application Insights"
    description: "TLS 1.3 with Customer-Managed Keys"