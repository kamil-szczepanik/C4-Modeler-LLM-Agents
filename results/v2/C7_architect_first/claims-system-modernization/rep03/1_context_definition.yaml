level: context
scope: "System Context diagram for Modern Hybrid Claims Platform"
system:
  name: "Modern Hybrid Claims Platform"
  description: "Gradually replaces a 30-year-old mainframe claims system with a modern hybrid cloud platform while ensuring uninterrupted legacy processing and decoupling real-time user experiences from mainframe batch constraints."
elements:
  - type: "person"
    name: "Customers"
    description: "End users submitting and tracking their insurance claims."
  - type: "person"
    name: "Brokers"
    description: "Intermediaries who assist customers and manage claims processing."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff responsible for reviewing, processing, and adjudicating claims."
  - type: "externalSystem"
    name: "Legacy Mainframe System"
    description: "On-premise COBOL/DB2 system of record for core claims processing."
  - type: "externalSystem"
    name: "Corporate Active Directory"
    description: "On-premise identity provider for authentication and identity federation."
relationships:
  - source: "Customers"
    destination: "Modern Hybrid Claims Platform"
    description: "Submits and manages claims via real-time user experiences"
    technology: "HTTPS via TLS 1.3, OIDC, OAuth 2.0"
  - source: "Brokers"
    destination: "Modern Hybrid Claims Platform"
    description: "Assists with claims management and interactions"
    technology: "HTTPS via TLS 1.3, OIDC, OAuth 2.0"
  - source: "Claims Adjusters"
    destination: "Modern Hybrid Claims Platform"
    description: "Reviews and processes claims"
    technology: "HTTPS via TLS 1.3, OIDC, OAuth 2.0"
  - source: "Modern Hybrid Claims Platform"
    destination: "Corporate Active Directory"
    description: "Authenticates users and performs identity federation"
    technology: "LDAPS / SAML"
  - source: "Modern Hybrid Claims Platform"
    destination: "Legacy Mainframe System"
    description: "Synchronizes claim states asynchronously via integration middleware"
    technology: "Azure Service Bus, mTLS, AES-256, ExpressRoute/VPN"