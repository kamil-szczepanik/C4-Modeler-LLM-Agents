level: component
scope: "Component diagram for the Adjuster Workspace container"
parentContainer:
  name: "Adjuster Workspace"
elements:
  - type: "component"
    name: "SPA Client"
    technology: "React, TypeScript"
    description: "Delivers responsive client-side rendering for fast adjuster UI loads."
  - type: "component"
    name: "BFF Routing & Session Controller"
    technology: "Node.js, Express"
    description: "Powers the Backend-For-Frontend (BFF) and internal routing components."
  - type: "component"
    name: "Claims Orchestration Service"
    technology: "Node.js"
    description: "Orchestrates claims workflows and communicates with backend services."
  - type: "component"
    name: "Local View Cache Manager"
    technology: "Node.js"
    description: "Manages local read models and caching to isolate legacy latency."
  - type: "component"
    name: "Feature Flag & Routing Adapter"
    technology: "Node.js"
    description: "Evaluates active claim types and handles dynamic routing."
  - type: "component"
    name: "Audit Logging Interceptor"
    technology: "Node.js"
    description: "Intercepts requests to handle security and audit logging."
  - type: "component"
    name: "Claims Read/Write Database"
    technology: "Azure Database for PostgreSQL"
    description: "Stores local claim read models and audit logs."
  - type: "component"
    name: "API Gateway"
    technology: "Azure API Management"
    description: "Routes and secures traffic between cloud and on-premise mainframe."
  - type: "component"
    name: "Corporate Active Directory"
    technology: "OIDC/SAML"
    description: "Authenticates users via SSO."
relationships:
  - source: "SPA Client"
    destination: "BFF Routing & Session Controller"
    description: "Renders UI and invokes BFF APIs [HTTPS/REST]"
  - source: "Claims Orchestration Service"
    destination: "API Gateway"
    description: "Fetches domain data [HTTPS/REST]"
  - source: "Local View Cache Manager"
    destination: "Claims Read/Write Database"
    description: "Queries local read models [TCP/PostgreSQL]"
  - source: "SPA Client"
    destination: "Feature Flag & Routing Adapter"
    description: "Evaluates active claim types [HTTPS/REST]"
  - source: "BFF Routing & Session Controller"
    destination: "Corporate Active Directory"
    description: "Authenticates via SSO [OIDC/SAML]"