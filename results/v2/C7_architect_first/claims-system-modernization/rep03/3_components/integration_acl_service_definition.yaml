level: component
scope: "Component diagram for the Integration / ACL Service container"
parentContainer:
  name: "Integration / ACL Service"
elements:
  - type: "component"
    name: "Mainframe Translator Component"
    technology: ".NET, Serviceakami copybook parsers"
    description: "Translates data structures between modern formats and legacy copybooks."
  - type: "component"
    name: "Sync Orchestrator Component"
    technology: ".NET Hosted Service, Serilog"
    description: "Orchestrates synchronization processes and logging."
  - type: "component"
    name: "Circuit Breaker & Fallback Component"
    technology: "Polly for .NET"
    description: "Provides circuit breaker and retry policies to isolate mainframe latency."
  - type: "component"
    name: "Audit Logger Sub-component"
    technology: "Azure Monitor / Log Analytics"
    description: "Captures audit logs and monitoring data."
relationships:
  - source: "Mainframe Translator Component"
    destination: "Legacy Mainframe System"
    description: "Communicates via mTLS over IPsec VPN / Azure ExpressRoute"
  - source: "Sync Orchestrator Component"
    destination: "Azure Database for PostgreSQL"
    description: "Synchronizes claim data via Entity Framework Core and Azure Managed Identities"
  - source: "Sync Orchestrator Component"
    destination: "Azure Service Bus"
    description: "Publishes and consumes asynchronous messages using transport-level security"
  - source: "GitHub Actions CI/CD Pipeline"
    destination: "Mainframe Mocking Harness"
    description: "Executes automated regression testing without live VPN connectivity"