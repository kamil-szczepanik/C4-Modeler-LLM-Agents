level: component
scope: "Component diagram for the Claims Read/Write Database container"
parentContainer:
  name: "Claims Read/Write Database"
elements:
  - type: "component"
    name: "Claim Operational Store"
    technology: "Azure Database for PostgreSQL (Flexible Server) / PostgreSQL 15+"
    description: "Provides robust ACID compliance, high availability, and stores primary claim data using JSONB and Row-Level Security."
  - type: "component"
    name: "Sync State Manager"
    technology: "PostgreSQL 15+ / PgBouncer"
    description: "Manages synchronization state and connection pooling for low-latency queries between systems."
  - type: "component"
    name: "Audit & Fallback Log"
    technology: "PostgreSQL 15+ / Azure Key Vault"
    description: "Provides database activity monitoring, audit logging, and safeguards fallback data for zero data loss."
  - type: "component"
    name: "Claim State Machine Tables"
    technology: "PostgreSQL 15+"
    description: "Tracks the operational states of claims within the modern hybrid platform workflows."
  - type: "component"
    name: "Outbox Pattern Table"
    technology: "PostgreSQL 15+"
    description: "Enables reliable publishing of domain events to the Azure Service Bus."
relationships:
  - source: "Outbox Pattern Table"
    destination: "Azure Service Bus"
    description: "Publishes domain events via Outbox Pattern Table [AMQP / HTTPS]"