level: component
scope: "Component diagram for the Azure Service Bus container"
parentContainer:
  name: "Azure Service Bus"
elements:
  - type: "component"
    name: "Claim Submission Topic & Subscriptions"
    technology: "Azure Service Bus Premium"
    description: "Publishes and routes incoming claim submission messages to appropriate downstream handlers."
  - type: "component"
    name: "Dead-Letter Queue (DLQ) Handler"
    technology: "Azure Service Bus DLQ"
    description: "Captures and isolates malformed or failed messages for administrative review and reprocessing."
  - type: "component"
    name: "Session State Manager"
    technology: "Azure Service Bus Sessions"
    description: "Maintains ordered processing state for related claim transactions to ensure strict consistency."
  - type: "component"
    name: "Partitioned Topic Engine"
    technology: "Azure Service Bus Partitioned Topics"
    description: "Scales throughput horizontally across multiple message brokers to handle peak loads."
  - type: "component"
    name: "Duplicate Detection Filter"
    technology: "Azure Service Bus Duplicate Detection"
    description: "Prevents duplicate claim processing by identifying and discarding retransmitted messages."
relationships:
  - source: "Claim Submission Topic & Subscriptions"
    destination: "Session State Manager"
    description: "Enforces ordered processing using message sessions [AMQP 1.0]"
  - source: "Claim Submission Topic & Subscriptions"
    destination: "Duplicate Detection Filter"
    description: "Validates incoming messages for uniqueness [AMQP 1.0]"
  - source: "Claim Submission Topic & Subscriptions"
    destination: "Partitioned Topic Engine"
    description: "Distributes message load across partitions [AMQP 1.0]"
  - source: "Claim Submission Topic & Subscriptions"
    destination: "Dead-Letter Queue (DLQ) Handler"
    description: "Routes failed or poisoned messages [AMQP 1.0]"