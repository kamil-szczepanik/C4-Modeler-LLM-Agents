level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Authentication & Token Validator"
    technology: "Azure API Management Policy / OIDC / JWT"
    description: "Validates incoming tokens and authenticates requests against Corporate Active Directory."
  - type: "component"
    name: "Routing & Path Dispatcher"
    technology: "Azure API Management Routing"
    description: "Dispatches incoming traffic to appropriate backend services like the Integration / ACL Service."
  - type: "component"
    name: "Rate Limiting & Throttling"
    technology: "Azure API Management Policy"
    description: "Protects backend systems by enforcing rate limits and throttling incoming traffic."
  - type: "component"
    name: "API Versioning & Transformation"
    technology: "Azure API Management Policy"
    description: "Handles API versioning and transforms request/response payloads as needed."
  - type: "component"
    name: "Circuit Breaker"
    technology: "Azure API Management Policy"
    description: "Prevents cascading failures by monitoring backend health and tripping during outages."
relationships:
  - source: "Authentication & Token Validator"
    destination: "Routing & Path Dispatcher"
    description: "Passes authenticated requests"
  - source: "Routing & Path Dispatcher"
    destination: "Rate Limiting & Throttling"
    description: "Evaluates rate limits"
  - source: "Routing & Path Dispatcher"
    destination: "API Versioning & Transformation"
    description: "Transforms payload"
  - source: "Routing & Path Dispatcher"
    destination: "Circuit Breaker"
    description: "Checks circuit status before routing"