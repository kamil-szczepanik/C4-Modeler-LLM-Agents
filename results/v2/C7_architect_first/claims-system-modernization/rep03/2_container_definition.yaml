level: container
scope: "Container diagram for Modern Hybrid Claims Platform"
system:
  name: "Modern Hybrid Claims Platform"
elements:
  - type: "person"
    name: "Customers"
    description: "End users submitting and tracking their insurance claims."
  - type: "person"
    name: "Brokers"
    description: "Intermediaries who assist customers and manage claims processing."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff responsible for reviewing, processing, and adjudicating claims."
  - type: "externalSystem"
    name: "Legacy Mainframe System"
    description: "On-premise COBOL/DB2 system of record for core claims processing."
  - type: "externalSystem"
    name: "Corporate Active Directory"
    description: "On-premise identity provider for authentication and centralized single sign-on."
  - type: "container"
    name: "Customer Portal"
    technology: "Azure App Service, React"
    description: "Provides online claims submission and tracking for customers and brokers."
  - type: "container"
    name: "Adjuster Workspace"
    technology: "Azure App Service, React, Node.js BFF"
    description: "Enables fast adjuster workflows for reviewing and processing claims."
  - type: "container"
    name: "API Gateway"
    technology: "Azure API Management"
    description: "Routes incoming traffic to the customer portal, adjuster workspace, and integration services."
  - type: "container"
    name: "Integration / ACL Service"
    technology: "Azure Container Apps, .NET"
    description: "Anti-Corruption Layer (ACL) that bridges the modern cloud architecture with the legacy mainframe."
  - type: "container"
    name: "Claims Read/Write Database"
    technology: "Azure Database for PostgreSQL"
    description: "Provides local caching and transactional data storage to achieve fast screen loads."
  - type: "container"
    name: "Azure Service Bus"
    technology: "Azure Service Bus"
    description: "Orchestrates reliable asynchronous messaging for zero-loss consistency across the platform."
relationships:
  - source: "Customers"
    destination: "Customer Portal"
    description: "Interacts with and submits claims"
    technology: "HTTPS/REST"
  - source: "Brokers"
    destination: "Customer Portal"
    description: "Assists with claims and interactions"
    technology: "HTTPS/REST"
  - source: "Claims Adjusters"
    destination: "Adjuster Workspace"
    description: "Reviews and processes claims"
    technology: "HTTPS/REST"
  - source: "Customer Portal"
    destination: "API Gateway"
    description: "Sends and receives routed traffic"
    technology: "HTTPS"
  - source: "Adjuster Workspace"
    destination: "API Gateway"
    description: "Sends and receives routed traffic"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Customer Portal"
    description: "Routes traffic"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Adjuster Workspace"
    description: "Routes traffic"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Integration / ACL Service"
    description: "Routes traffic"
    technology: "HTTPS"
  - source: "Integration / ACL Service"
    destination: "Legacy Mainframe System"
    description: "Communicates with COBOL/DB2 mainframe"
    technology: "mTLS over IPsec VPN / Azure ExpressRoute"
  - source: "Customer Portal"
    destination: "Claims Read/Write Database"
    description: "Reads and writes claim data"
    technology: "Azure Managed Identities"
  - source: "Adjuster Workspace"
    destination: "Claims Read/Write Database"
    description: "Reads and writes claim data for fast loads"
    technology: "Azure Managed Identities"
  - source: "Integration / ACL Service"
    destination: "Claims Read/Write Database"
    description: "Synchronizes claim data"
    technology: "Azure Managed Identities"
  - source: "Integration / ACL Service"
    destination: "Azure Service Bus"
    description: "Publishes and consumes asynchronous messages"
    technology: "Azure Managed Identities"
  - source: "Customer Portal"
    destination: "Corporate Active Directory"
    description: "Authenticates via SSO"
    technology: "OIDC / SAML"
  - source: "Adjuster Workspace"
    destination: "Corporate Active Directory"
    description: "Authenticates via SSO"
    technology: "OIDC / SAML"