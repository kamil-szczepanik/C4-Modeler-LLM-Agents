level: context
scope: "System Context diagram for Insurance Claims Modernization Platform"
system:
  name: "Insurance Claims Modernization Platform"
  description: "Modernizes a regional insurer's claims platform by gradually migrating claims from a 30-year-old legacy mainframe to a cloud-native Azure environment."
elements:
  - type: "person"
    name: "Customers & Brokers"
    description: "External users submitting claims online."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff handling claims via a new web application."
  - type: "externalSystem"
    name: "Legacy Mainframe System"
    description: "On-premises COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "Core Integration Hub"
    description: "Anti-corruption layer bridging Azure and the mainframe."
  - type: "externalSystem"
    name: "Insurer's Active Directory"
    description: "Identity Provider (Entra ID) for Single Sign-On."
  - type: "externalSystem"
    name: "Payment Gateway & Notification System"
    description: "External services for payouts and SMS/Email updates."
relationships:
  - source: "Customers & Brokers"
    destination: "Insurance Claims Modernization Platform"
    description: "Online claim submission"
    technology: "HTTPS / OIDC / MFA"
  - source: "Claims Adjusters"
    destination: "Insurance Claims Modernization Platform"
    description: "Claim handling via new web application"
    technology: "HTTPS / OIDC / OAuth 2.0"
  - source: "Insurance Claims Modernization Platform"
    destination: "Core Integration Hub"
    description: "Internal communication and data synchronization"
    technology: "Internal REST APIs / Messaging"
  - source: "Core Integration Hub"
    destination: "Legacy Mainframe System"
    description: "Hybrid data synchronization with legacy system of record"
    technology: "mTLS, IPsec VPN / Azure ExpressRoute"
  - source: "Insurance Claims Modernization Platform"
    destination: "Insurer's Active Directory"
    description: "Single Sign-On and authentication"
    technology: "OIDC / SAML"
  - source: "Insurance Claims Modernization Platform"
    destination: "Payment Gateway & Notification System"
    description: "Automated status updates and payouts"
    technology: "HTTPS / REST"