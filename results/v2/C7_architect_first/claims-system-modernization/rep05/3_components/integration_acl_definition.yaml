level: component
scope: "Component diagram for the Integration & ACL container"
parentContainer:
  name: "Integration & ACL"
elements:
  - type: "component"
    name: "ACL Router & Circuit-Breaker Component"
    technology: "Java Spring Boot, Resilience4j"
    description: "Dynamically routes traffic and protects the fragile legacy mainframe during high loads using circuit-breaking and rate-limiting."
  - type: "component"
    name: "Data Mapper & Sanitizer Component"
    technology: "Java Spring Boot, MapStruct, JSON Schema/XML"
    description: "Enforces payload schema validation and PII sanitization between modern and legacy data structures."
  - type: "component"
    name: "Outbox/Inbox Processor Component"
    technology: "Java Spring Boot, JDBC/JPA, Azure SQL Database"
    description: "Handles reliable message processing and publishes/consumes reliable messages."
  - type: "component"
    name: "Claims Processing Service"
    technology: "Java Spring Boot"
    description: "Sends asynchronous domain events."
  - type: "component"
    name: "Azure Service Bus"
    technology: "Azure Service Bus topics, Azure Dead-Letter Queues"
    description: "Ensures durable, reliable message queuing and at-least-once delivery."
  - type: "component"
    name: "Legacy Mainframe System"
    technology: "COBOL/DB2 Legacy Mainframe System"
    description: "The 30-year-old legacy mainframe system for insurance claims."
  - type: "component"
    name: "Azure Key Vault"
    technology: "Azure Key Vault, Azure Managed Identities"
    description: "Retrieves database credentials and certificates securely."
relationships:
  - source: "Claims Processing Service"
    destination: "Outbox/Inbox Processor Component"
    description: "Sends asynchronous domain events via JDBC/JPA"
  - source: "Outbox/Inbox Processor Component"
    destination: "Azure Service Bus"
    description: "Publishes and consumes reliable messages using AMQP protocol"
  - source: "ACL Router & Circuit-Breaker Component"
    destination: "Legacy Mainframe System"
    description: "Dynamically routes traffic and synchronizes data via mTLS over restricted interface protocols"
  - source: "Outbox/Inbox Processor Component"
    destination: "Azure Key Vault"
    description: "Retrieves database credentials and certificates using Azure Managed Identities"