level: component
scope: "Component diagram for the Web Frontend container"
parentContainer:
  name: "Web Frontend"
elements:
  - type: "component"
    name: "Claim Submission UI"
    technology: "React, TypeScript"
    description: "Allows customers and brokers to submit online claims."
  - type: "component"
    name: "Adjuster Dashboard"
    technology: "React, TypeScript"
    description: "Provides workflows for claims adjusters."
  - type: "component"
    name: "Auth Client Module"
    technology: "OAuth2 / OIDC with PKCE"
    description: "Handles user authentication and session validation with the Insurer's Active Directory."
  - type: "component"
    name: "Accessibility & Localization Module"
    technology: "React"
    description: "Ensures accessibility standards and localization for users."
  - type: "component"
    name: "User Analytics & Telemetry Tracking"
    technology: "Azure Application Insights"
    description: "Tracks user analytics, RUM, synthetic monitoring, and telemetry."
relationships:
  - source: "Auth Client Module"
    destination: "Insurer's Active Directory"
    description: "Authenticates users and validates sessions via OAuth2 / OIDC with PKCE"
  - source: "Claim Submission UI"
    destination: "BFF / API Gateway"
    description: "Proxies requests, routes traffic, and handles session cookies via HTTPS / REST"
  - source: "Adjuster Dashboard"
    destination: "BFF / API Gateway"
    description: "Proxies requests, routes traffic, and handles session cookies via HTTPS / REST"