level: component
scope: "Component diagram for the BFF / API Gateway container"
parentContainer:
  name: "BFF / API Gateway"
elements:
  - type: "component"
    name: "API Gateway Proxy"
    technology: "Azure API Management"
    description: "Handles edge routing, OAuth2/OIDC validation, and OpenAPI schema enforcement."
  - type: "component"
    name: "Customer BFF"
    technology: "Java Spring Boot"
    description: "Serves customer-facing frontend requests and aggregates backend services."
  - type: "component"
    name: "Adjuster BFF"
    technology: "Java Spring Boot"
    description: "Serves adjuster-facing frontend requests, managing UI state and claim queries."
  - type: "component"
    name: "Dynamic Routing & Feature Dispatcher"
    technology: "Azure App Configuration"
    description: "Stores dynamic routing rules for rapid claim-type rollbacks."
  - type: "component"
    name: "Circuit Breaker & Fallback Manager"
    technology: "Resilience4j"
    description: "Implements circuit breaking and fallback logic for slow mainframe responses."
  - type: "component"
    name: "Azure Redis Cache"
    technology: "Azure Redis"
    description: "Reads UI state and cached data for the Adjuster BFF."
relationships:
  - source: "API Gateway Proxy"
    destination: "Customer BFF"
    description: "Forwards authenticated routes [mTLS / HTTP]"
  - source: "API Gateway Proxy"
    destination: "Adjuster BFF"
    description: "Forwards authenticated routes [mTLS / HTTP]"
  - source: "Adjuster BFF"
    destination: "Azure Redis Cache"
    description: "Reads UI state and cached data [Redis Protocol / TLS]"
  - source: "Adjuster BFF"
    destination: "Circuit Breaker & Fallback Manager"
    description: "Protects outgoing calls to backend systems"
  - source: "Dynamic Routing & Feature Dispatcher"
    destination: "Customer BFF"
    description: "Supplies dynamic routing and feature flags"
  - source: "Dynamic Routing & Feature Dispatcher"
    destination: "Adjuster BFF"
    description: "Supplies dynamic routing and feature flags"