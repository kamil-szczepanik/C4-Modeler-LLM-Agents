level: component
scope: "Component diagram for the Claims Processing Service container"
parentContainer:
  name: "Claims Processing Service"
elements:
  - type: "component"
    name: "Claim Command Handler"
    technology: "Spring Web/MVC, Java"
    description: "Handles claim commands, validates payload and idempotency, and triggers state transitions."
  - type: "component"
    name: "Claim Read Service & Materializer"
    technology: "Spring Data JPA, Java"
    description: "Reads denormalized views and materializes data for clients."
  - type: "component"
    name: "Workflow Orchestrator"
    technology: "Spring State Machine, Java"
    description: "Orchestrates workflows and persists workflow state."
  - type: "component"
    name: "Claim Policy & Validation Engine"
    technology: "Spring Validation, Java"
    description: "Validates claim policies and rules."
  - type: "component"
    name: "Azure SQL Database"
    technology: "JDBC / JPA"
    description: "Relational storage for ACID compliance and workflow state persistence."
  - type: "component"
    name: "Azure Service Bus"
    technology: "AMQP"
    description: "Asynchronous messaging for decoupled event-driven integration."
  - type: "component"
    name: "Integration & ACL"
    technology: "Java / Messaging Adapter"
    description: "Anti-corruption layer for external system communication."
relationships:
  - source: "Claim Command Handler"
    destination: "Claim Policy & Validation Engine"
    description: "Validates payload and idempotency [In-memory / Java Method]"
  - source: "Claim Command Handler"
    destination: "Integration & ACL"
    description: "Publishes state changes [Azure Service Bus / AMQP]"
  - source: "Claim Read Service & Materializer"
    destination: "Azure SQL Database"
    description: "Reads denormalized views [JDBC]"
  - source: "Workflow Orchestrator"
    destination: "Azure SQL Database"
    description: "Persists workflow state [JPA / JDBC]"
  - source: "Workflow Orchestrator"
    destination: "Claim Command Handler"
    description: "Triggers state transitions [In-memory / Java Method]"