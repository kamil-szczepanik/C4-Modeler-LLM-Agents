level: container
scope: "Container diagram for Insurance Claims Modernization Platform"
system:
  name: "Insurance Claims Modernization Platform"
elements:
  - type: "person"
    name: "Customers & Brokers"
    description: "External users submitting claims online."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff handling claims via a new web application."
  - type: "externalSystem"
    name: "Legacy Mainframe System"
    description: "On-premises COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "Insurer's Active Directory"
    description: "Identity Provider (Entra ID) for Single Sign-On."
  - type: "container"
    name: "Web Frontend"
    technology: "React, Azure App Service"
    description: "Web application for online claims and adjuster workflows."
  - type: "container"
    name: "BFF / API Gateway"
    technology: "Azure API Management, Node.js, Java Spring Boot"
    description: "Backend-for-Frontend and API Gateway routing requests."
  - type: "container"
    name: "Claims Processing Service"
    technology: "Java Spring Boot, JPA, Azure Container Apps"
    description: "Core service handling claims processing and business logic."
  - type: "container"
    name: "Integration & ACL"
    technology: "Azure Service Bus, Custom Routing & Circuit-Breaker Worker"
    description: "Anti-corruption layer protecting and synchronizing with the legacy mainframe."
  - type: "container"
    name: "Azure Redis Cache"
    technology: "Azure Redis Cache"
    description: "Caching layer for reference data retrieval and sub-second adjuster screens."
  - type: "container"
    name: "Azure SQL Database"
    technology: "Azure SQL Database, JDBC/JPA"
    description: "Primary transactional database for the claims processing service."
relationships:
  - source: "Customers & Brokers"
    destination: "Web Frontend"
    description: "Submits online claims and views status"
    technology: "HTTPS / REST"
  - source: "Claims Adjusters"
    destination: "Web Frontend"
    description: "Executes adjuster workflows"
    technology: "HTTPS / REST"
  - source: "Web Frontend"
    destination: "BFF / API Gateway"
    description: "Proxies API requests and handles routing"
    technology: "HTTPS / REST"
  - source: "BFF / API Gateway"
    destination: "Claims Processing Service"
    description: "Delegates claims processing workflows"
    technology: "HTTPS / REST"
  - source: "BFF / API Gateway"
    destination: "Azure Redis Cache"
    description: "Retrieves reference data"
    technology: "Redis Protocol"
  - source: "Claims Processing Service"
    destination: "Azure SQL Database"
    description: "Reads and writes claim data"
    technology: "JDBC / JPA"
  - source: "Claims Processing Service"
    destination: "Integration & ACL"
    description: "Sends asynchronous events and messages"
    technology: "Azure Service Bus"
  - source: "Integration & ACL"
    destination: "Legacy Mainframe System"
    description: "Synchronizes data via restricted interface protocols"
    technology: "Restricted Interface Protocols"
  - source: "Web Frontend"
    destination: "Insurer's Active Directory"
    description: "Authenticates users via OAuth2/OIDC"
    technology: "OAuth2 / OIDC"