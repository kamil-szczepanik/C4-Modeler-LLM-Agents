level: container
scope: "Container diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Evaluates flagged transactions and manages fraud cases."
  - type: "person"
    name: "Merchant Risk Manager"
    description: "Monitors KPIs and rule efficacy via a web dashboard."
  - type: "person"
    name: "Compliance / Auditor Officer"
    description: "Reviews audit trails and ensures regulatory compliance."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer Systems"
    description: "External software system providing payment authorization traffic."
  - type: "externalSystem"
    name: "Card Networks / Tokenization Vaults"
    description: "External software system for card data tokenization and network interaction."
  - type: "externalSystem"
    name: "Core Banking / Ledger Systems"
    description: "External software system receiving asynchronous post-processing messages."
  - type: "container"
    name: "AWS API Gateway"
    description: "Ingresses and routes incoming payment authorization traffic."
    technology: "AWS API Gateway"
  - type: "container"
    name: "Real-Time Scoring Engine"
    description: "Evaluates card-not-present payment authorizations against fraud models."
    technology: "Go / Java, AWS ECS Fargate"
  - type: "container"
    name: "Case Management Backend"
    description: "Manages analyst reviews and fraud cases."
    technology: "AWS ECS Fargate"
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    description: "Secure relational storage for transaction history and case records."
    technology: "Amazon Aurora PostgreSQL"
  - type: "container"
    name: "Amazon S3"
    description: "Secure WORM storage for audit trails and archives."
    technology: "Amazon S3"
  - type: "container"
    name: "Amazon ElastiCache (Redis)"
    description: "In-memory feature store for rapid fraud rule evaluation."
    technology: "Amazon ElastiCache (Redis)"
  - type: "container"
    name: "Amazon SQS"
    description: "Lightweight, managed asynchronous event messaging."
    technology: "AWS SQS"
relationships:
  - source: "Payment Gateway / Acquirer Systems"
    destination: "AWS API Gateway"
    description: "Sends payment authorization requests"
    technology: "HTTPS/REST"
  - source: "AWS API Gateway"
    destination: "Real-Time Scoring Engine"
    description: "Routes authorization traffic for scoring"
    technology: "HTTP/gRPC with mTLS"
  - source: "Real-Time Scoring Engine"
    destination: "Amazon ElastiCache (Redis)"
    description: "Retrieves features for rapid rule evaluation"
    technology: "Redis Protocol"
  - source: "Real-Time Scoring Engine"
    destination: "Amazon SQS"
    description: "Sends asynchronous event messages"
    technology: "AWS SDK/SQS API"
  - source: "Case Management Backend"
    destination: "Amazon SQS"
    description: "Consumes asynchronous event messages"
    technology: "AWS SDK/SQS API"
  - source: "Case Management Backend"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists case data and transaction records"
    technology: "HTTPS with mTLS"
  - source: "Fraud Analyst"
    destination: "Case Management Backend"
    description: "Reviews flagged transactions and manages cases"
    technology: "HTTPS"
  - source: "Merchant Risk Manager"
    destination: "Case Management Backend"
    description: "Monitors KPIs and rule efficacy"
    technology: "HTTPS"
  - source: "Compliance / Auditor Officer"
    destination: "Amazon S3"
    description: "Reviews audit trails and logs"
    technology: "Secure Read-Only Access"