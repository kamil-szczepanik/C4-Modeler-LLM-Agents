# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
  description: "A real-time payment fraud screening system for a mid-size payment processor that evaluates card-not-present authorizations against fraud models before approval, providing case management for fraud analysts while ensuring strict PCI-DSS Level 1 compliance and sub-50ms latency."
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Evaluates flagged transactions and manages fraud cases."
  - type: "person"
    name: "Merchant Risk Manager"
    description: "Monitors KPIs and rule efficacy via a web dashboard."
  - type: "person"
    name: "Compliance / Auditor Officer"
    description: "Reviews audit trails and ensures regulatory compliance."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer Systems"
    description: "External software system providing payment authorization traffic."
  - type: "externalSystem"
    name: "Card Networks / Tokenization Vaults"
    description: "External software system for card data tokenization and network interaction."
  - type: "externalSystem"
    name: "Core Banking / Ledger Systems"
    description: "External software system receiving asynchronous post-processing messages."
relationships:
  - source: "Payment Gateway / Acquirer Systems"
    destination: "Real-Time Payment Fraud Screening"
    description: "Evaluates card-not-present authorizations against fraud models"
    technology: "REST/JSON over HTTPS with mTLS and OAuth2/JWT"
  - source: "Fraud Analyst"
    destination: "Real-Time Payment Fraud Screening"
    description: "Performs case management"
    technology: "HTTPS via Web UI"
  - source: "Merchant Risk Manager"
    destination: "Real-Time Payment Fraud Screening"
    description: "Views KPIs and rule efficacy"
    technology: "HTTPS via Web Dashboard"
  - source: "Compliance / Auditor Officer"
    destination: "Real-Time Payment Fraud Screening"
    description: "Accesses secure audit trails"
    technology: "Secure Read-Only API/Console"
  - source: "Real-Time Payment Fraud Screening"
    destination: "Core Banking / Ledger Systems"
    description: "Sends asynchronous post-screening messages"
    technology: "AWS SQS/SNS"