level: component
scope: "Component diagram for the Case Management Backend container"
parentContainer:
  name: "Case Management Backend"
elements:
  - type: "component"
    name: "API Controller Component"
    technology: "TypeScript/Node.js or Go"
    description: "RESTful interface handling authentication, RBAC, input validation, and bulk case operations over HTTPS."
  - type: "component"
    name: "Case Workflow Engine Component"
    technology: "TypeScript/Node.js or Go"
    description: "Manages case states (Open, Under Review, Resolved) and bulk resolution logic."
  - type: "component"
    name: "Event Consumer Component"
    technology: "TypeScript/Node.js or Go"
    description: "Subscribes to Amazon SQS to ingest flagged transaction payloads and hydrate case records."
  - type: "component"
    name: "Audit Logger Component"
    technology: "TypeScript/Node.js or Go"
    description: "Streams immutable records to S3 Object Lock (Compliance Mode) and maintains an indexed metadata view in Amazon Aurora PostgreSQL."
  - type: "component"
    name: "SLA Metrics Component"
    technology: "TypeScript/Node.js or Go"
    description: "Calculates time-to-decision metrics for compliance and operational tracking."
  - type: "component"
    name: "RDS Proxy"
    technology: "AWS RDS Proxy"
    description: "Manages database connection pooling between ECS Fargate tasks and Amazon Aurora PostgreSQL."
  - type: "system"
    name: "Fraud Analyst / Merchant Risk Manager"
    technology: "User"
    description: "External actor who reviews cases and monitors metrics via HTTPS with mTLS and OAuth2/OIDC."
  - type: "container"
    name: "Amazon SQS"
    technology: "AWS SQS"
    description: "Messaging service for asynchronous event ingestion with a Dead Letter Queue."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Relational database for persisting case records and metadata."
  - type: "container"
    name: "Amazon S3"
    technology: "Amazon S3"
    description: "Object storage with Object Lock for 7-year tamper-evident audit logging."
relationships:
  - source: "Fraud Analyst / Merchant Risk Manager"
    destination: "API Controller Component"
    description: "Reviews cases and monitors metrics via [HTTPS] with [mTLS] and [OAuth2/OIDC]"
  - source: "Event Consumer Component"
    destination: "Amazon SQS"
    description: "Consumes transaction messages via [AWS SDK / SQS API]"
  - source: "Case Workflow Engine Component"
    destination: "RDS Proxy"
    description: "Persists case records and SLA metrics via [RDS Proxy] using [mTLS] and [AWS IAM]"
  - source: "Audit Logger Component"
    destination: "Amazon S3"
    description: "Stores tamper-evident logs via [AWS SDK / S3 API] with [Object Lock]"
  - source: "RDS Proxy"
    destination: "Amazon Aurora PostgreSQL"
    description: "Proxies connections to database"