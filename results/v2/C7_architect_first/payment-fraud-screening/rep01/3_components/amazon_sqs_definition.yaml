level: component
scope: "Component diagram for the Amazon SQS container"
parentContainer:
  name: "Amazon SQS"
elements:
  - type: "component"
    name: "Standard Queue"
    technology: "Amazon SQS Standard Queue"
    description: "Buffers asynchronous telemetry and audit events sent by the Real-Time Scoring Engine."
  - type: "component"
    name: "Dead-Letter Queue"
    technology: "Amazon SQS DLQ"
    description: "Captures messages that fail processing for later analysis and error handling."
relationships:
  - source: "Real-Time Scoring Engine"
    destination: "Standard Queue"
    description: "Sends asynchronous telemetry and audit events [AWS SDK/SQS API via Interface VPC Endpoint]"
  - source: "Standard Queue"
    destination: "Case Management Backend"
    description: "Consumes messages via Long Polling and DeleteMessage [AWS SDK/SQS API via Interface VPC Endpoint]"
  - source: "Standard Queue"
    destination: "Dead-Letter Queue"
    description: "Routes failed messages upon processing exhaustion"