level: component
scope: "Component diagram for the Amazon S3 container"
parentContainer:
  name: "Amazon S3"
elements:
  - type: "component"
    name: "Bucket Policy Enforcer"
    technology: "IAM / AWS Lake Formation"
    description: "Manages fine-grained access control and IAM conditions."
  - type: "component"
    name: "Object Lock & Vault Manager"
    technology: "S3 Object Lock"
    description: "Enforces Write-Once-Read-Many (WORM) compliance in Compliance Mode."
  - type: "component"
    name: "Server-Side Encryption Engine"
    technology: "AWS KMS"
    description: "Applies envelope encryption using customer-managed keys (CMK)."
  - type: "component"
    name: "S3 Lifecycle Engine"
    technology: "AWS S3 Lifecycle"
    description: "Manages automated tiering from Standard to S3 Glacier Deep Archive."
  - type: "component"
    name: "Athena Query Gateway"
    technology: "Amazon Athena"
    description: "Executes sanitized queries over partitioned audit data."
  - type: "component"
    name: "Merchant Risk Manager & Compliance Officer"
    technology: "External Persona"
    description: "External personas querying reporting and audit logs."
  - type: "component"
    name: "Real-Time Scoring Engine"
    technology: "AWS SDK"
    description: "Writes decision audit payloads via HTTPS/TLS 1.3."
  - type: "component"
    name: "DevOps Specialist"
    technology: "Terraform (IaC)"
    description: "Manages automated tiering policies via Terraform."
relationships:
  - source: "Real-Time Scoring Engine"
    destination: "Object Lock & Vault Manager"
    description: "Writes decision audit payloads via AWS SDK (HTTPS/TLS 1.3)."
  - source: "Compliance Officer"
    destination: "Bucket Policy Enforcer"
    description: "Queries archived audit logs via AWS Management Console / Athena (HTTPS)."
  - source: "Merchant Risk Manager"
    destination: "Athena Query Gateway"
    description: "Queries pseudonymized fraud trends via BI tools (HTTPS)."
  - source: "Athena Query Gateway"
    destination: "Object Lock & Vault Manager"
    description: "Reads parquet-formatted audit partitions via internal AWS backbone."
  - source: "DevOps Specialist"
    destination: "S3 Lifecycle Engine"
    description: "Manages automated tiering policies via Terraform (IaC)."