level: component
scope: "Component diagram for the Real-Time Scoring Engine container"
parentContainer:
  name: "Real-Time Scoring Engine"
elements:
  - type: "component"
    name: "Rule Evaluation Component"
    technology: "Go"
    description: "Evaluates business rules against incoming authorization traffic."
  - type: "component"
    name: "Feature Aggregator Component"
    technology: "Go"
    description: "Aggregates features and velocity counters for real-time scoring."
  - type: "component"
    name: "Model & Rule Registry Component"
    technology: "Go"
    description: "Downloads immutable rules and model weights from Amazon S3."
  - type: "component"
    name: "Explainability Engine Component"
    technology: "Go"
    description: "Provides explainability for risk decisions."
  - type: "component"
    name: "Audit Trail Emitter"
    technology: "Go"
    description: "Pushes cryptographically signed decision payloads to Amazon SQS."
relationships:
  - source: "Rule Evaluation Component"
    destination: "Feature Aggregator Component"
    description: "Retrieves velocity counters and features"
  - source: "Model & Rule Registry Component"
    destination: "Amazon S3"
    description: "Downloads immutable rules and model weights [HTTPS]"
  - source: "Audit Trail Emitter"
    destination: "Amazon SQS"
    description: "Pushes cryptographically signed decision payloads [AWS SDK/SQS API]"