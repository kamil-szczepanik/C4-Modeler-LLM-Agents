level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Screens card-not-present payment authorizations for fraud at 3,000 TPS while supporting analyst case reviews, enforcing PCI-DSS Level 1 compliance and 7-year tamper-evident auditability within a €25k/month AWS budget."
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Reviews fraud cases using the web-based UI."
  - type: "person"
    name: "Compliance Officer / Auditor"
    description: "Accesses audit logs and compliance data."
  - type: "person"
    name: "Cardholder"
    description: "Initiates card-not-present payment transactions."
  - type: "externalSystem"
    name: "Payment Gateway / Core Processing Platform"
    description: "Sends payment authorizations for fraud screening."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Authenticates users via OAuth2/OIDC."
  - type: "externalSystem"
    name: "AWS Cloud Services (eu-west-1)"
    description: "Cloud infrastructure hosting the system and S3 audit logs."
  - type: "externalSystem"
    name: "AWS S3"
    description: "Object storage with Object Lock for 7-year tamper-evident audit retention."
relationships:
  - source: "Payment Gateway / Core Processing Platform"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Sends payment authorizations for fraud screening"
    technology: "gRPC over TLS 1.3"
  - source: "Fraud Analyst"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Performs analyst case reviews"
    technology: "HTTPS (Web-based UI)"
  - source: "Compliance Officer / Auditor"
    destination: "AWS S3"
    description: "Accesses audit records"
    technology: "HTTPS"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users and sessions"
    technology: "OAuth2/OIDC"