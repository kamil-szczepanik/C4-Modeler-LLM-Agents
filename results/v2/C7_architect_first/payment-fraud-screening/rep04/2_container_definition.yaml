level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Reviews fraud cases using the web-based UI."
  - type: "person"
    name: "Compliance Officer / Auditor"
    description: "Accesses audit logs and compliance data."
  - type: "person"
    name: "Cardholder"
    description: "Initiates card-not-present payment transactions."
  - type: "externalSystem"
    name: "Payment Gateway / Core Processing Platform"
    description: "Sends payment authorizations for fraud screening."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Authenticates users via OAuth2/OIDC."
  - type: "externalSystem"
    name: "AWS S3"
    description: "Object storage with Object Lock for 7-year tamper-evident audit retention."
  - type: "container"
    name: "API Gateway / Ingestion Service"
    technology: "Go, Node.js/TypeScript, AWS ECS (Fargate)"
    description: "Ingests payment authorizations and routes traffic securely."
  - type: "container"
    name: "Fraud Scoring Engine"
    technology: "Rust, AWS ECS (Fargate)"
    description: "Performs real-time fraud screening with deterministic sub-50 ms tail latencies."
  - type: "container"
    name: "Case Management API"
    technology: "Go, Node.js/TypeScript, AWS ECS (Fargate)"
    description: "Manages fraud case reviews and workflows."
  - type: "container"
    name: "Analyst Web Application"
    technology: "Node.js/TypeScript, AWS ECS (Fargate)"
    description: "Provides a web-based UI for fraud analysts to review cases."
  - type: "container"
    name: "Audit Query API"
    technology: "Go, Node.js/TypeScript, AWS ECS (Fargate)"
    description: "Provides access to audit logs and query interfaces."
  - type: "container"
    name: "Audit & Compliance Portal"
    technology: "Node.js/TypeScript, AWS ECS (Fargate)"
    description: "Portal for compliance officers and auditors."
  - type: "container"
    name: "Audit & Event Store"
    technology: "Amazon Aurora with immutable ledgers"
    description: "Provides tamper-evident 7-year audit storage and synchronous cryptographic ledger writes."
relationships:
  - source: "Payment Gateway / Core Processing Platform"
    destination: "API Gateway / Ingestion Service"
    description: "Sends payment authorizations for fraud screening"
    technology: "HTTPS/JSON"
  - source: "API Gateway / Ingestion Service"
    destination: "Fraud Scoring Engine"
    description: "Routes authorization requests for real-time scoring"
    technology: "gRPC with mTLS via AWS VPC security groups and AWS Certificate Manager"
  - source: "Fraud Analyst"
    destination: "Analyst Web Application"
    description: "Performs analyst case reviews"
    technology: "HTTPS with OIDC/JWT authentication"
  - source: "Compliance Officer / Auditor"
    destination: "Audit & Compliance Portal"
    description: "Accesses compliance data and audit logs"
    technology: "HTTPS with OIDC/JWT authentication"
  - source: "Analyst Web Application"
    destination: "Case Management API"
    description: "Sends API requests for case management"
    technology: "HTTPS with OIDC/JWT authentication"
  - source: "Audit & Compliance Portal"
    destination: "Audit Query API"
    description: "Queries audit records"
    technology: "HTTPS with OIDC/JWT authentication"
  - source: "Fraud Scoring Engine"
    destination: "Audit & Event Store"
    description: "Performs synchronous cryptographic ledger writes"
    technology: "Synchronous ledger writes"
  - source: "Audit & Event Store"
    destination: "AWS S3"
    description: "Archives logs with Object Lock"
    technology: "AWS S3 Object Lock"
  - source: "Analyst Web Application"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OIDC/JWT"
  - source: "Audit & Compliance Portal"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OIDC/JWT"