level: component
scope: "Component diagram for the API Gateway / Ingestion Service container"
parentContainer:
  name: "API Gateway / Ingestion Service"
elements:
  - type: "component"
    name: "HTTP Ingestion Handler"
    technology: "Go (net/http)"
    description: "Securely ingests, validates, and routes real-time payment authorization requests while enforcing strict security controls, latency SLAs, and PCI-DSS compliance."
  - type: "component"
    name: "Rate Limiter & Circuit Breaker"
    technology: "Custom middleware"
    description: "Protects the service and downstream dependencies by enforcing rate limits and providing fault-tolerant merchant availability."
  - type: "component"
    name: "gRPC Client"
    technology: "Go (grpc-go)"
    description: "Forwards sanitized authorization requests to the Fraud Scoring Engine."
  - type: "component"
    name: "Audit Dispatcher"
    technology: "Asynchronous worker pool"
    description: "Asynchronously writes tamper-evident decision inputs and metadata to the Audit & Event Store."
  - type: "component"
    name: "FluentBit log redaction sidecar"
    technology: "FluentBit sidecar"
    description: "Performs log redaction to ensure sensitive data is not exposed."
relationships:
  - source: "HTTP Ingestion Handler"
    destination: "Rate Limiter & Circuit Breaker"
    description: "Passes incoming HTTP requests for traffic management and resilience"
  - source: "HTTP Ingestion Handler"
    destination: "gRPC Client"
    description: "Invokes to forward sanitized requests"
  - source: "HTTP Ingestion Handler"
    destination: "Audit Dispatcher"
    description: "Triggers asynchronous audit logging"
  - source: "gRPC Client"
    destination: "Fraud Scoring Engine"
    description: "Sends gRPC requests over HTTP/2 with mTLS via AWS VPC security groups"
  - source: "Audit Dispatcher"
    destination: "Audit & Event Store"
    description: "Asynchronously writes via HTTPS / AWS SDK with HMAC-SHA256"