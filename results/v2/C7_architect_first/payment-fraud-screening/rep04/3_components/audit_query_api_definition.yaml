level: component
scope: "Component diagram for the Audit Query API container"
parentContainer:
  name: "Audit Query API"
elements:
  - type: "component"
    name: "Query Router / Controller"
    technology: "Go (HTTPS/REST)"
    description: "Go-based entry point handling HTTPS/REST requests, OIDC/JWT authentication, RBAC, input validation, and rate-limiting."
  - type: "component"
    name: "Audit Query Service"
    technology: "Go"
    description: "Go-based business logic layer executing search, filtering, pagination, data masking, and export orchestration."
  - type: "component"
    name: "Export Formatter"
    technology: "Go"
    description: "Go-based streaming component transforming audit records into CSV or JSON formats."
  - type: "component"
    name: "Ledger Repository"
    technology: "Go and AWS SDK"
    description: "Go and AWS SDK data access layer connecting exclusively to an Amazon Aurora read replica."
  - type: "component"
    name: "Amazon Aurora Read Replica"
    technology: "PostgreSQL"
    description: "Dedicated PostgreSQL-compatible database layer storing encrypted, tamper-evident audit ledgers."
relationships:
  - source: "Compliance Portal"
    destination: "Query Router / Controller"
    description: "HTTPS with OIDC/JWT authentication [TLS 1.3]"
  - source: "Query Router / Controller"
    destination: "Audit Query Service"
    description: "In-process function calls with RBAC and rate-limiting"
  - source: "Audit Query Service"
    destination: "Export Formatter"
    description: "Streams raw records for serialization [In-process function calls]"
  - source: "Audit Query Service"
    destination: "Ledger Repository"
    description: "Queries historical audit data [mTLS / PostgreSQL Wire Protocol]"
  - source: "Ledger Repository"
    destination: "Amazon Aurora Read Replica"
    description: "Executes parameterized SQL read queries [TCP / KMS encrypted]"