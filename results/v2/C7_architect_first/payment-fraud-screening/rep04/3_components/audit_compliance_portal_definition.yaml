level: component
scope: "Component diagram for the Audit & Compliance Portal container"
parentContainer:
  name: "Audit & Compliance Portal"
elements:
  - type: "component"
    name: "Portal UI Component"
    technology: "React SPA served via AWS S3 / CloudFront"
    description: "Powers the SPA frontend for lightweight client-side routing and timeline visualization."
  - type: "component"
    name: "BFF Routing & RBAC Component"
    technology: "Node.js & NestJS, AWS ECS Fargate"
    description: "Powers the BFF container for centralized RBAC, session management, and routing."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache (Redis) with AWS KMS"
    description: "Caches historical queries to optimize performance for auditor workloads and encrypts cached audit data at rest."
  - type: "component"
    name: "Compliance Officer / Auditor"
    technology: "Person"
    description: "End user accessing the secure portal to review audit logs and generate compliance reports."
  - type: "component"
    name: "Audit Query API"
    technology: "Backend service"
    description: "Backend service for retrieving audit records."
  - type: "component"
    name: "Identity Provider (IdP)"
    technology: "External OIDC/JWT"
    description: "External OIDC/JWT authentication provider."
relationships:
  - source: "Compliance Officer / Auditor"
    destination: "Portal UI Component"
    description: "Accesses interface via HTTPS"
  - source: "Portal UI Component"
    destination: "BFF Routing & RBAC Component"
    description: "API requests via HTTPS/JSON using HTTP-only cookies"
  - source: "BFF Routing & RBAC Component"
    destination: "Audit Query API"
    description: "Fetches audit data via HTTPS/gRPC over mTLS with propagated JWTs"
  - source: "BFF Routing & RBAC Component"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches and retrieves encrypted audit read results"
  - source: "BFF Routing & RBAC Component"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users via OIDC/JWT"