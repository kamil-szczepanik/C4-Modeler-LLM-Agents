level: component
scope: "Component diagram for the Audit & Event Store container"
parentContainer:
  name: "Audit & Event Store"
elements:
  - type: "component"
    name: "Ingest API / Router"
    technology: "Go"
    description: "Receives fraud decisions and routes incoming requests."
  - type: "component"
    name: "Ledger Writer"
    technology: "Go"
    description: "Consumes messages and writes audit data to persistent storage."
  - type: "component"
    name: "Retention & Archival Worker"
    technology: "Go"
    description: "Manages data lifecycle and archival for 7-year retention."
  - type: "component"
    name: "Ingestion Buffer / WAL"
    technology: "Amazon SQS FIFO"
    description: "Asynchronous buffering ensuring zero data loss and traffic spike absorption."
  - type: "component"
    name: "Audit Query Adapter"
    technology: "Go"
    description: "Provides isolated read queries against the audit store."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL (with Ledger/Table features)"
    description: "Relational persistence with tamper-evident ledger features."
  - type: "component"
    name: "Amazon S3 with Object Lock"
    technology: "Amazon S3 with Object Lock (Compliance Mode)"
    description: "Immutable, cost-effective 7-year cold tier storage."
relationships:
  - source: "Fraud Scoring Engine"
    destination: "Ingest API / Router"
    description: "gRPC over TLS [Internal RPC]"
  - source: "Ingest API / Router"
    destination: "Ingestion Buffer / WAL"
    description: "AWS SDK (HTTPS) [Message Queuing]"
  - source: "Ledger Writer"
    destination: "Ingestion Buffer / WAL"
    description: "AWS SDK (HTTPS) [Stream Consumption]"
  - source: "Ledger Writer"
    destination: "Amazon Aurora PostgreSQL"
    description: "SQL/TCP [Data Persistence]"
  - source: "Retention & Archival Worker"
    destination: "Amazon S3 with Object Lock"
    description: "HTTPS [Object Lock API]"
  - source: "Audit Query Adapter"
    destination: "Amazon Aurora PostgreSQL"
    description: "SQL/TCP (Read Replica) [Query Isolation]"