level: component
scope: "Component diagram for the Case Management API container"
parentContainer:
  name: "Case Management API"
elements:
  - type: "component"
    name: "Case Controller Component"
    technology: "Go, chi Router"
    description: "Provides lightweight, native HTTP routing and handles incoming API requests from the Analyst Web Application."
  - type: "component"
    name: "Workflow Service Component"
    technology: "Go, In-process function calls"
    description: "Invokes state transitions and manages the core case management workflow."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Go, Transactional outbox pattern"
    description: "Publishes events and ensures secure audit logging."
  - type: "component"
    name: "Case Metrics / SLA Service Component"
    technology: "Go, Prometheus"
    description: "Tracks internal metrics for queue depth and SLA tracking."
relationships:
  - source: "Case Controller Component"
    destination: "Workflow Service Component"
    description: "Invokes state transitions [In-process Go function calls]"
  - source: "Workflow Service Component"
    destination: "Audit Logger Component"
    description: "Publishes events via transactional outbox pattern"