level: container
scope: "Container diagram for Core Fraud Screening System"
system:
  name: "Core Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analysts and Risk Operations Managers"
    description: "Internal users responsible for case management, reporting, and reviewing flagged payment authorizations."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer Systems"
    description: "External software systems submitting card-not-present payment authorizations for real-time fraud screening."
  - type: "externalSystem"
    name: "Immutable Audit Log Sink"
    description: "AWS-based storage utilizing S3 Object Lock, KMS, and CloudTrail Lake for automated cryptographic log shipping and 7-year audit retention."
  - type: "container"
    name: "API Gateway & Fallback Layer"
    technology: "Amazon API Gateway"
    description: "Ingress point for REST/JSON traffic over HTTPS with a built-in circuit breaker."
  - type: "container"
    name: "Real-Time Scoring Service"
    technology: "Go, AWS ECS Fargate"
    description: "Microservice that evaluates authorizations to guarantee low, predictable latency without GC pauses."
  - type: "container"
    name: "Case Management Backend"
    technology: "Node.js/TypeScript, AWS ECS Fargate"
    description: "Microservice that manages analyst reviews and case operations."
  - type: "container"
    name: "Feature Cache"
    technology: "Amazon DynamoDB"
    description: "Low-latency data store for feature reads and writes over VPC endpoints."
  - type: "container"
    name: "Audit and Case Data Store"
    technology: "Amazon Aurora PostgreSQL"
    description: "Transactional data store for audit and case data over VPC endpoints."
  - type: "container"
    name: "Messaging & Event Bus"
    technology: "Amazon SQS and SNS"
    description: "Asynchronous messaging infrastructure for audit event publishing."
  - type: "container"
    name: "Audit Storage"
    technology: "Amazon S3 with Object Lock"
    description: "Tamper-evident log archival using S3 Object Lock (WORM)."
relationships:
  - source: "Payment Gateway / Acquirer Systems"
    destination: "API Gateway & Fallback Layer"
    description: "Sends ingress REST/JSON traffic for authorization"
    technology: "HTTPS"
  - source: "Fraud Analysts and Risk Operations Managers"
    destination: "Case Management Backend"
    description: "Manages and reviews flagged payment authorizations"
    technology: "HTTPS"
  - source: "API Gateway & Fallback Layer"
    destination: "Real-Time Scoring Service"
    description: "Internal routing of scoring requests"
    technology: "REST/gRPC"
  - source: "Real-Time Scoring Service"
    destination: "Feature Cache"
    description: "Reads and writes low-latency features"
    technology: "VPC endpoints over AWS"
  - source: "Case Management Backend"
    destination: "Audit and Case Data Store"
    description: "Performs transactional case queries"
    technology: "VPC endpoints over AWS"
  - source: "Real-Time Scoring Service"
    destination: "Messaging & Event Bus"
    description: "Publishes asynchronous audit events"
    technology: "Amazon SQS/SNS"
  - source: "Case Management Backend"
    destination: "Messaging & Event Bus"
    description: "Publishes asynchronous audit events"
    technology: "Amazon SQS/SNS"
  - source: "Messaging & Event Bus"
    destination: "Audit Storage"
    description: "Archives tamper-evident logs"
    technology: "SQS to S3 Object Lock"
  - source: "Audit Storage"
    destination: "Immutable Audit Log Sink"
    description: "Sends cryptographic log shipping and retention"
    technology: "AWS S3 Object Lock, KMS, and CloudTrail Lake"