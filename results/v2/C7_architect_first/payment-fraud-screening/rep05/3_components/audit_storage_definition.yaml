level: component
scope: "Component diagram for the Audit Storage container"
parentContainer:
  name: "Audit Storage"
elements:
  - type: "component"
    name: "Amazon Kinesis Data Firehose"
    technology: "AWS Kinesis Data Firehose"
    description: "Natively handles batching, compression, and buffering without custom code to minimize operational overhead for a 3-engineer team."
  - type: "component"
    name: "Amazon S3 with Object Lock"
    technology: "Amazon S3 (Object Lock in Compliance Mode)"
    description: "Enforces strict WORM storage to satisfy 7-year regulatory retention mandates."
  - type: "component"
    name: "AWS KMS"
    technology: "AWS Key Management Service"
    description: "Manages customer-managed keys (CMK) and envelope encryption to protect cardholder and audit data."
  - type: "component"
    name: "S3 Cross-Region Replication"
    technology: "S3 Cross-Region Replication (CRR)"
    description: "Replicates immutable audit objects across AWS regions securely via HTTPS."
  - type: "component"
    name: "Amazon S3 Glacier Flexible Retrieval"
    technology: "Amazon S3 Glacier Flexible Retrieval / Deep Archive"
    description: "Automatically transitions aged audit logs to low-cost storage to stay within budget constraints."
relationships:
  - source: "Messaging & Event Bus"
    destination: "Amazon Kinesis Data Firehose"
    description: "Pushes batch audit events via AWS SQS/SNS integration (HTTPS)."
  - source: "Amazon Kinesis Data Firehose"
    destination: "Amazon S3 with Object Lock"
    description: "Writes encrypted, immutable objects using TLS 1.3 and AWS SigV4."
  - source: "Amazon S3 with Object Lock"
    destination: "S3 Cross-Region Replication"
    description: "Replicates immutable audit objects across AWS regions (HTTPS)."