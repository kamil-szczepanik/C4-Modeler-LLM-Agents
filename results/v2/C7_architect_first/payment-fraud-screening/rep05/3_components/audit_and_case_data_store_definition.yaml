level: component
scope: "Component diagram for the Audit and Case Data Store container"
parentContainer:
  name: "Audit and Case Data Store"
elements:
  - type: "component"
    name: "Transactional and Audit Schema"
    technology: "Amazon Aurora PostgreSQL"
    description: "Houses transactional and audit schemas for storing immutable decision logs."
  - type: "component"
    name: "Case Schema"
    technology: "Amazon Aurora PostgreSQL"
    description: "Houses case schemas for managing analyst workflows and query processing."
relationships:
  - source: "Transactional and Audit Schema"
    destination: "Case Schema"
    description: "Replicates data to read replica"