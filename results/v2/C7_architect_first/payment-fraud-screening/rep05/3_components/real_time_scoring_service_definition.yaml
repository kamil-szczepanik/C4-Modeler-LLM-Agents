level: component
scope: "Component diagram for the Real-Time Scoring Service container"
parentContainer:
  name: "Real-Time Scoring Service"
elements:
  - type: "component"
    name: "API Handler Component"
    technology: "Go / net/http"
    description: "Processes card-not-present payment authorizations to approve, decline, or route transactions for review."
  - type: "component"
    name: "Feature Aggregator Component"
    technology: "Go"
    description: "Reads and writes low-latency features via VPC endpoints over AWS."
  - type: "component"
    name: "Scoring Engine Component"
    technology: "Go"
    description: "Executes fraud scoring logic and internally consumes data via Go channels and context propagation."
  - type: "component"
    name: "Audit Publisher Component"
    technology: "Go / AWS SDK"
    description: "Publishes asynchronous audit events to decoupling messaging infrastructure."
  - type: "component"
    name: "Fallback Circuit Breaker Component"
    technology: "Go"
    description: "Ensures high performance, fault tolerance, and resilience under failure conditions."
  - type: "component"
    name: "Telemetry Interceptor Component"
    technology: "Go"
    description: "Monitors and captures telemetry data for performance and latency tracking."
  - type: "component"
    name: "Amazon API Gateway & Fallback Layer"
    technology: "Amazon API Gateway"
    description: "Handles internal routing of scoring requests."
  - type: "component"
    name: "Amazon ECS Fargate"
    technology: "AWS ECS Fargate"
    description: "Container orchestration maintaining low operational load."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Low-latency NoSQL data store used for the Feature Cache."
  - type: "component"
    name: "Amazon SQS and SNS"
    technology: "Amazon SQS and SNS"
    description: "Messaging infrastructure used to decouple non-blocking audit event generation."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Relational data store supporting system operations."
  - type: "component"
    name: "Amazon S3 with Object Lock"
    technology: "Amazon S3"
    description: "Dynamically loads cryptographically verified model binaries and rules."
  - type: "component"
    name: "AWS KMS"
    technology: "AWS KMS"
    description: "Secures model decryption keys and audit signing keys."
  - type: "component"
    name: "Fraud Analysts and Risk Operations Managers"
    technology: "Human / User"
    description: "Users who interact with the system for review and auditable decision-making."
relationships:
  - source: "Amazon API Gateway & Fallback Layer"
    destination: "API Handler Component"
    description: "Internal routing of scoring requests via [REST/gRPC]"
  - source: "Feature Aggregator Component"
    destination: "Amazon DynamoDB"
    description: "Reads and writes low-latency features via [VPC endpoints over AWS]"
  - source: "Scoring Engine Component"
    destination: "Feature Aggregator Component"
    description: "Internal data consumption via [Go channels and context propagation]"
  - source: "Audit Publisher Component"
    destination: "Amazon SQS and SNS"
    description: "Publishes asynchronous audit events via [AWS SDK]"
  - source: "Real-Time Scoring Service"
    destination: "Amazon S3 with Object Lock"
    description: "Dynamically loads cryptographically verified model binaries and rules via [HTTPS/AWS SDK]"