level: component
scope: "Component diagram for the Feature Cache container"
parentContainer:
  name: "Feature Cache"
elements:
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Serverless primary data store for transactional features and velocity metrics."
  - type: "component"
    name: "Feature Data Access Component"
    technology: "Go (AWS SDK)"
    description: "Application layer utilizing the AWS SDK for optimized batch reads and writes."
  - type: "component"
    name: "TTL Manager Component"
    technology: "DynamoDB Time-To-Live"
    description: "DynamoDB Time-To-Live feature for automatically expiring stale transactional records."
  - type: "component"
    name: "In-Process Go Cache"
    technology: "In-Process Go Memory"
    description: "Local, short-TTL memory cache inside the Real-Time Scoring Service for static features."
  - type: "component"
    name: "AWS Key Management Service (KMS)"
    technology: "AWS KMS (CMK)"
    description: "Customer-managed keys securing data encryption-at-rest."
relationships:
  - source: "Real-Time Scoring Service"
    destination: "Feature Data Access Component"
    description: "Retrieves and updates features via VPC Endpoints using HTTPS/gRPC."
  - source: "Feature Data Access Component"
    destination: "Amazon DynamoDB"
    description: "Executes encrypted data read/write queries over AWS VPC infrastructure."
  - source: "Real-Time Scoring Service"
    destination: "In-Process Go Cache"
    description: "Fetches static cached features via internal application memory access."
  - source: "Amazon SNS/SQS"
    destination: "In-Process Go Cache"
    description: "Delivers event-driven cache invalidation messages for velocity updates."