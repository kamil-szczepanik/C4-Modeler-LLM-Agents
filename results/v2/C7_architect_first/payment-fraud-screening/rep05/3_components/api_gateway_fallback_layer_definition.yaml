level: component
scope: "Component diagram for the API Gateway & Fallback Layer container"
parentContainer:
  name: "API Gateway & Fallback Layer"
elements:
  - type: "component"
    name: "Ingress Router"
    technology: "Amazon API Gateway"
    description: "Terminates TLS, enforces WAF rules, and handles rate limiting with minimal operational overhead."
  - type: "component"
    name: "Circuit Breaker & Fallback Engine"
    technology: "AWS Lambda"
    description: "Executes serverless fallback logic to satisfy budget constraints and ensure zero merchant disruption."
  - type: "component"
    name: "Telemetry & Audit Emitter"
    technology: "Amazon CloudWatch / AWS X-Ray"
    description: "Provides distributed tracing for sub-50ms P99 latency tracking and pushes sanitized request metadata."
  - type: "component"
    name: "AWS WAF"
    technology: "AWS WAF"
    description: "Secures ingress REST/JSON traffic for the fraud screening system."
  - type: "component"
    name: "AWS CodeDeploy"
    technology: "AWS CodeDeploy"
    description: "Manages canary deployments for zero-downtime rule updates."
  - type: "component"
    name: "CloudWatch Synthetics Canary"
    technology: "CloudWatch Synthetics"
    description: "Runs 24/7 mock payment checks for proactive availability monitoring."
relationships:
  - source: "Payment Gateway / Acquirer Systems"
    destination: "Ingress Router"
    description: "Sends ingress REST/JSON traffic for authorization [HTTPS / mTLS / SigV4]"
  - source: "Ingress Router"
    destination: "Circuit Breaker & Fallback Engine"
    description: "Routes scoring requests [AWS Lambda internal invocation]"
  - source: "Circuit Breaker & Fallback Engine"
    destination: "Real-Time Scoring Service"
    description: "Forwards scoring requests [REST/gRPC]"
  - source: "Telemetry & Audit Emitter"
    destination: "Immutable Audit Log Sink"
    description: "Pushes sanitized request metadata [HTTPS]"