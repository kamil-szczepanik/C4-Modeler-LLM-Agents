level: component
scope: "Component diagram for the Case Management Backend container"
parentContainer:
  name: "Case Management Backend"
elements:
  - type: "component"
    name: "Case API Controller"
    technology: "Node.js, Express, TypeScript"
    description: "Handling incoming HTTPS requests from Fraud Analysts."
  - type: "component"
    name: "Case Workflow Engine"
    technology: "TypeScript"
    description: "Managing case state transitions and SLA timers."
  - type: "component"
    name: "Audit & Evidence Assembler"
    technology: "TypeScript"
    description: "Sanitizing payloads and gathering decision metadata."
  - type: "component"
    name: "Read Model Projection Component"
    technology: "TypeScript"
    description: "Maintaining denormalized read views from asynchronous events."
  - type: "component"
    name: "Data Access Layer"
    technology: "TypeORM/Prisma"
    description: "Interfacing with PostgreSQL via AWS RDS Proxy."
  - type: "component"
    name: "Audit and Case Data Store"
    technology: "Amazon Aurora PostgreSQL"
    description: "Amazon Aurora PostgreSQL database storing transactional case data."
  - type: "component"
    name: "Messaging & Event Bus"
    technology: "Amazon SQS and SNS"
    description: "Amazon SQS and SNS for asynchronous event distribution."
relationships:
  - source: "Case API Controller"
    destination: "Case Workflow Engine"
    description: "Invokes workflow operations [In-process]"
  - source: "Case API Controller"
    destination: "Audit & Evidence Assembler"
    description: "Gathers decision metadata and sanitized evidence [In-process]"
  - source: "Case API Controller"
    destination: "Read Model Projection Component"
    description: "Queries paginated audit trails [In-process]"
  - source: "Case Workflow Engine"
    destination: "Data Access Layer"
    description: "Executes queries [In-process]"
  - source: "Audit & Evidence Assembler"
    destination: "Data Access Layer"
    description: "Executes queries [In-process]"
  - source: "Case Workflow Engine"
    destination: "Messaging & Event Bus"
    description: "Publishes state change events [Amazon SQS/SNS]"
  - source: "Data Access Layer"
    destination: "Audit and Case Data Store"
    description: "Performs transactional queries [AWS RDS Proxy over VPC endpoints]"