level: context
scope: "System Context diagram for Core Fraud Screening System"
system:
  name: "Core Fraud Screening System"
  description: "Evaluates card-not-present payment authorizations in AWS (eu-west-1) to detect fraud and manage reviews while satisfying PCI-DSS Level 1 compliance."
elements:
  - type: "person"
    name: "Fraud Analysts and Risk Operations Managers"
    description: "Internal users responsible for case management, reporting, and reviewing flagged payment authorizations."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer Systems"
    description: "External software systems submitting card-not-present payment authorizations for real-time fraud screening."
  - type: "externalSystem"
    name: "Card Networks / Tokenization Vault"
    description: "External system used for secure API calls to validate card tokens without storing PANs."
  - type: "externalSystem"
    name: "Immutable Audit Log Sink"
    description: "AWS-based storage utilizing S3 Object Lock, KMS, and CloudTrail Lake for automated cryptographic log shipping and 7-year audit retention."
relationships:
  - source: "Payment Gateway / Acquirer Systems"
    destination: "Core Fraud Screening System"
    description: "Sends payment authorizations for real-time scoring"
    technology: "gRPC over TLS (mTLS)"
  - source: "Fraud Analysts and Risk Operations Managers"
    destination: "Core Fraud Screening System"
    description: "Accesses case management and reporting"
    technology: "HTTPS via ZTNA / identity-aware proxies with SSO"
  - source: "Core Fraud Screening System"
    destination: "Card Networks / Tokenization Vault"
    description: "Validates card tokens securely without storing PANs"
    technology: "Secure API calls"
  - source: "Core Fraud Screening System"
    destination: "Immutable Audit Log Sink"
    description: "Performs automated cryptographic log shipping and S3 Object Lock"
    technology: "AWS S3 Object Lock, KMS, and CloudTrail Lake"