level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Screens card-not-present payment authorizations for fraud at scale and supports case management for analysts under PCI-DSS Level 1 compliance."
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Reviews suspicious cases to make final fraud determinations."
  - type: "person"
    name: "Data Scientists / Risk Managers"
    description: "Updates scoring models and rules to adapt to new fraud patterns."
  - type: "person"
    name: "Regulatory / Compliance Auditors"
    description: "Audits system logs and decision inputs for compliance."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer Systems"
    description: "Submits payment authorizations for fraud screening."
  - type: "externalSystem"
    name: "Card Networks / Tokenization Providers"
    description: "Provides token resolution and network-level integrations."
  - type: "container"
    name: "AWS ECS on Fargate"
    description: "Runs containerized microservices within a single region (eu-west-1)."
    technology: "AWS ECS on Fargate"
  - type: "container"
    name: "AWS Global Accelerator"
    description: "Ensures predictable, low-latency routing for high-throughput traffic."
    technology: "AWS Global Accelerator"
  - type: "container"
    name: "S3 Object Lock (Compliance Mode)"
    description: "Enforces tamper-evident, 7-year retention for audit logs and decision inputs."
    technology: "Amazon S3"
  - type: "container"
    name: "AWS Secrets Manager"
    description: "Manages database credentials, JWT signing keys, and model encryption keys."
    technology: "AWS Secrets Manager"
relationships:
  - source: "Payment Gateway / Acquirer Systems"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Submits payment authorizations for fraud screening"
    technology: "HTTPS / REST (<50ms SLA)"
  - source: "Fraud Analysts"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Reviews suspicious cases"
    technology: "HTTPS with OIDC/OAuth2 and MFA"
  - source: "Data Scientists / Risk Managers"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Updates scoring models and rules"
    technology: "HTTPS with IAM authentication"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Card Networks / Tokenization Providers"
    description: "Resolves tokens"
    technology: "HTTPS / REST with mTLS"