level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Reviews suspicious cases to make final fraud determinations."
  - type: "person"
    name: "Data Scientists / Risk Managers"
    description: "Updates scoring models and rules to adapt to new fraud patterns."
  - type: "person"
    name: "Regulatory / Compliance Auditors"
    description: "Audits system logs and decision inputs for compliance."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer Systems"
    description: "Submits payment authorizations for fraud screening."
  - type: "externalSystem"
    name: "Card Networks / Tokenization Providers"
    description: "Provides token resolution and network-level integrations."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx / AWS ALB"
    description: "Intercepts card-not-present payment authorizations and routes traffic."
  - type: "container"
    name: "Fraud Scoring Engine"
    technology: "Go service with embedded ONNX runtime"
    description: "Assesses fraud risk in real-time while balancing sub-50ms latency SLAs."
  - type: "container"
    name: "Case Management Backend"
    technology: "Node.js / Express service"
    description: "Handles backend logic for analyst review of suspicious transactions."
  - type: "container"
    name: "Model/Rule Manager"
    technology: "Python / FastAPI service"
    description: "Manages and updates models and rules with zero-downtime."
  - type: "container"
    name: "Amazon ElastiCache for Redis"
    technology: "Amazon ElastiCache for Redis"
    description: "Feature Store for real-time feature lookups."
  - type: "container"
    name: "Amazon Aurora Serverless v2"
    technology: "Amazon Aurora Serverless v2"
    description: "Case DB for analyst data access."
  - type: "container"
    name: "Amazon S3"
    technology: "Amazon S3"
    description: "Audit WORM Archives for 7-year audit requirements."
  - type: "container"
    name: "Amazon MSK Serverless"
    technology: "Amazon MSK Serverless"
    description: "Decouples scoring from audit persistence to protect hot-path latency."
  - type: "container"
    name: "AWS ECS Fargate"
    technology: "AWS ECS Fargate"
    description: "Container orchestration providing serverless scaling."
relationships:
  - source: "Payment Gateway / Acquirer Systems"
    destination: "API Gateway"
    description: "Submits payment authorizations for fraud screening"
    technology: "HTTPS/JSON"
  - source: "API Gateway"
    destination: "Fraud Scoring Engine"
    description: "Routes authorization requests"
    technology: "gRPC"
  - source: "Fraud Scoring Engine"
    destination: "Amazon ElastiCache for Redis"
    description: "Performs feature lookups"
    technology: "TCP"
  - source: "Amazon ElastiCache for Redis"
    destination: "Fraud Scoring Engine"
    description: "Returns feature data"
    technology: "TCP"
  - source: "Fraud Scoring Engine"
    destination: "Amazon MSK Serverless"
    description: "Streams asynchronous audit logs"
    technology: "TLS"
  - source: "Amazon MSK Serverless"
    destination: "Amazon S3"
    description: "Persists audit logs via native consumer connectors"
    technology: "Native connector"
  - source: "Amazon MSK Serverless"
    destination: "Amazon Aurora Serverless v2"
    description: "Persists data via native consumer connectors"
    technology: "Native connector"
  - source: "Fraud Analysts"
    destination: "Case Management Backend"
    description: "Accesses case management for analyst review"
    technology: "HTTPS"
  - source: "Case Management Backend"
    destination: "Amazon Aurora Serverless v2"
    description: "Performs analyst data access"
    technology: "SQL/TCP"
  - source: "Amazon Aurora Serverless v2"
    destination: "Case Management Backend"
    description: "Returns analyst data"
    technology: "SQL/TCP"
  - source: "Data Scientists / Risk Managers"
    destination: "Model/Rule Manager"
    description: "Updates scoring models and rules"
    technology: "HTTPS"
  - source: "Model/Rule Manager"
    destination: "Fraud Scoring Engine"
    description: "Performs zero-downtime rules updates"
    technology: "HTTP/gRPC"