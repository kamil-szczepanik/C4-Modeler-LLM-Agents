level: component
scope: "Component diagram for the Amazon S3 container"
parentContainer:
  name: "Amazon S3"
elements:
  - type: "component"
    name: "Fraud-Audit-Active"
    technology: "Amazon S3 Standard Bucket"
    description: "Persists raw authorization inputs, model versions, and decisions via Amazon S3 Sink Connector."
  - type: "component"
    name: "WORM-Policy"
    technology: "Amazon S3 Object Lock Configuration"
    description: "Enforces Write-Once-Read-Many (WORM) storage for 7-year tamper-evident audit retention in Compliance Mode."
  - type: "component"
    name: "Amazon S3 Lifecycle Management Engine"
    technology: "AWS S3 Lifecycle"
    description: "Automates lifecycle transitions to S3 Glacier Flexible Archive after 30 days to stay within budget."
  - type: "component"
    name: "Amazon Athena Query Layer"
    technology: "Amazon Athena"
    description: "Provides low-cost, serverless querying over parquet-formatted audit logs in place."
  - type: "component"
    name: "AWS KMS Customer Managed Keys"
    technology: "AWS KMS (SSE-KMS)"
    description: "Encrypts data at rest using Customer Managed Keys to meet PCI-DSS Level 1 standards."
relationships:
  - source: "Amazon MSK Serverless"
    destination: "Fraud-Audit-Active"
    description: "Persists raw authorization inputs, model versions, and decisions via Amazon S3 Sink Connector (HTTPS/REST with TLS 1.3)"
  - source: "Fraud-Audit-Active"
    destination: "WORM-Policy"
    description: "Protected by"
  - source: "Fraud-Audit-Active"
    destination: "Amazon S3 Lifecycle Management Engine"
    description: "Managed by lifecycle rules for transition to Glacier"
  - source: "Regulatory Auditors"
    destination: "Amazon Athena Query Layer"
    description: "Queries parquet-formatted audit logs in place via Pre-signed URLs (HTTPS)"
  - source: "Amazon Athena Query Layer"
    destination: "Fraud-Audit-Active"
    description: "Reads audit logs from"
  - source: "Fraud-Audit-Active"
    destination: "AWS KMS Customer Managed Keys"
    description: "Encrypted using"