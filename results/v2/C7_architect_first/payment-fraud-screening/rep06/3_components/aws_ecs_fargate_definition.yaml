level: component
scope: "Component diagram for the AWS ECS Fargate container"
parentContainer:
  name: "AWS ECS Fargate"
elements:
  - type: "component"
    name: "Scoring Engine"
    technology: "Go, ONNX Runtime"
    description: "Screens card-not-present payment authorizations for fraud prior to approval with <50ms P99 latency."
  - type: "component"
    name: "Case Management"
    technology: "Node.js, Express"
    description: "Provides case management for suspicious transactions and queries persistent fraud cases."
  - type: "component"
    name: "Model/Rule Manager"
    technology: "Python, FastAPI"
    description: "Manages rules and administration workloads, pulling artifacts from storage."
relationships:
  - source: "Scoring Engine"
    destination: "Case Management"
    description: "Routes decision inputs and flagged transactions"
  - source: "Model/Rule Manager"
    destination: "Scoring Engine"
    description: "Deploys updated models and rules"