level: component
scope: "Component diagram for the Fraud Scoring Engine container"
parentContainer:
  name: "Fraud Scoring Engine"
elements:
  - type: "component"
    name: "API Handler"
    technology: "Go"
    description: "Routes authorization requests and coordinates the fraud screening workflow."
  - type: "component"
    name: "Feature Aggregator"
    technology: "Go"
    description: "Performs parallel feature lookups to construct feature vectors."
  - type: "component"
    name: "Inference Orchestrator"
    technology: "Go with embedded ONNX Runtime"
    description: "Executes in-memory machine learning model inference for fraud scoring."
  - type: "component"
    name: "Explainability Engine"
    technology: "Go"
    description: "Calculates tree-path contribution scores for decision explainability."
  - type: "component"
    name: "Buffered Dispatcher"
    technology: "Go with BadgerDB"
    description: "Batches encrypted audit logs and provides ephemeral storage for zero-loss audit queuing."
relationships:
  - source: "API Handler"
    destination: "Feature Aggregator"
    description: "Requests feature vectors"
  - source: "Inference Orchestrator"
    destination: "Explainability Engine"
    description: "Calculates tree-path contribution scores"