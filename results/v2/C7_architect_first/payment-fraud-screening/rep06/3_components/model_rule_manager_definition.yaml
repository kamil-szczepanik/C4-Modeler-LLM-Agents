level: component
scope: "Component diagram for the Model/Rule Manager container"
parentContainer:
  name: "Model/Rule Manager"
elements:
  - type: "component"
    name: "API Controller"
    technology: "Python, FastAPI"
    description: "FastAPI routes handling incoming rule and model upload requests."
  - type: "component"
    name: "Validator & Compiler"
    technology: "Python, ONNX Runtime"
    description: "Validates ONNX compatibility and rule payloads."
  - type: "component"
    name: "Model Registry Manager"
    technology: "Python"
    description: "Stores versioned artifacts and applies cryptographic signatures."
  - type: "component"
    name: "Distribution Publisher"
    technology: "Python, Kafka Protocol"
    description: "Broadcasts model/rule update events and handles automated rollbacks."
  - type: "component"
    name: "Audit Log Service"
    technology: "Python"
    description: "Captures immutable deployment metadata."
  - type: "component"
    name: "Data Scientists / Risk Managers"
    technology: "External User"
    description: "External users uploading rules and models."
  - type: "component"
    name: "Amazon S3"
    technology: "AWS S3 with Object Lock, AWS KMS"
    description: "Immutable WORM storage with Object Lock and AWS KMS encryption."
  - type: "component"
    name: "Amazon MSK Serverless"
    technology: "Kafka Protocol"
    description: "Event bus for zero-downtime propagation."
  - type: "component"
    name: "Fraud Scoring Engine"
    technology: "External Container"
    description: "Consumes updates via Kafka protocol."
relationships:
  - source: "Data Scientists / Risk Managers"
    destination: "API Controller"
    description: "Uploads rules and models via HTTPS (OAuth2/OIDC via AWS IAM, mTLS)."
  - source: "API Controller"
    destination: "Audit Log Service"
    description: "Records deployment events via synchronous internal calls."
  - source: "Validator & Compiler"
    destination: "Model Registry Manager"
    description: "Passes verified artifacts via internal function calls."
  - source: "Model Registry Manager"
    destination: "Amazon S3"
    description: "Persists signed bundles via AWS SDK (HTTPS)."
  - source: "Distribution Publisher"
    destination: "Amazon MSK Serverless"
    description: "Publishes reload events via Kafka Protocol."