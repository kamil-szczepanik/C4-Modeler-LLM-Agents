level: component
scope: "Component diagram for the Amazon Aurora Serverless v2 container"
parentContainer:
  name: "Amazon Aurora Serverless v2"
elements:
  - type: "component"
    name: "Case Data Schema"
    technology: "PostgreSQL-compatible relational engine"
    description: "Securely persists case data and review decisions for the real-time payment fraud screening system."
  - type: "component"
    name: "Audit Log Table"
    technology: "PostgreSQL pgaudit extension, Row-Level Security"
    description: "Append-only, tamper-evident storage for audit trails enforcing strict PCI-DSS boundaries and a 7-year retention policy."
  - type: "component"
    name: "Amazon RDS Proxy Layer"
    technology: "Amazon RDS Proxy"
    description: "Provides connection pooling and multiplexing to prevent serverless scaling exhaustion."
  - type: "component"
    name: "AWS Secrets Manager"
    technology: "AWS Secrets Manager"
    description: "Handles credential and secret management for database access."
relationships:
  - source: "AWS Lambda"
    destination: "Amazon RDS Proxy Layer"
    description: "Ingests streaming audit records [SQL/TLS over TCP]"
  - source: "Case Management Backend"
    destination: "Amazon RDS Proxy Layer"
    description: "Queries and mutates case data and audit logs [SQL/TLS over TCP]"
  - source: "Amazon RDS Proxy Layer"
    destination: "Case Data Schema"
    description: "Manages multiplexed database connections [TCP]"
  - source: "Amazon Aurora Serverless v2"
    destination: "Amazon S3"
    description: "Ships immutable audit logs with Object Lock enabled [HTTPS]"