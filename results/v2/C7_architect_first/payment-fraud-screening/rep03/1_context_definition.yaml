level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening Platform"
system:
  name: "Real-Time Payment Fraud Screening Platform"
  description: "A platform that evaluates card-not-present payment authorizations to approve, decline, or flag them for manual review while maintaining PCI-DSS Level 1 compliance and a 7-year tamper-evident audit trail."
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Internal user reviewing suspicious cases and monitoring metrics."
  - type: "person"
    name: "Fraud Operations Manager"
    description: "Internal user reviewing suspicious cases and monitoring metrics."
  - type: "person"
    name: "Risk Rule Author"
    description: "Internal user managing fraud models."
  - type: "person"
    name: "Data Scientist"
    description: "Internal user managing fraud models."
  - type: "person"
    name: "Regulatory / Compliance Auditor"
    description: "External actor reviewing audit logs."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "External actor sending authorization requests."
  - type: "externalSystem"
    name: "AWS S3 Object Lock"
    description: "Cloud storage providing tamper-evident audit logging."
  - type: "externalSystem"
    name: "Model Registry"
    description: "Repository for secure model retrieval."
  - type: "container"
    name: "Low-Latency Scoring Engine"
    description: "Container handling real-time authorization scoring."
    technology: "AWS ECS on EC2"
  - type: "container"
    name: "Case Management Portal"
    description: "Container handling analyst reviews and reporting."
    technology: "Web-based Portal with OAuth2/OIDC"
  - type: "container"
    name: "AWS Infrastructure"
    description: "Cloud provider hosting ECS, EC2, S3, and Secrets Manager."
    technology: "AWS (ECS, EC2, S3, Secrets Manager, IAM)"
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "Low-Latency Scoring Engine"
    description: "Sends authorization requests"
    technology: "REST/gRpC over mTLS (TLS 1.3)"
  - source: "Fraud Analyst"
    destination: "Case Management Portal"
    description: "Reviews suspicious cases and monitors metrics"
    technology: "HTTPS over TLS 1.3 with OAuth2/OIDC"
  - source: "Fraud Operations Manager"
    destination: "Case Management Portal"
    description: "Reviews suspicious cases and monitors metrics"
    technology: "HTTPS over TLS 1.3 with OAuth2/OIDC"
  - source: "Risk Rule Author"
    destination: "Case Management Portal"
    description: "Manages fraud models"
    technology: "HTTPS over TLS 1.3 with OAuth2/OIDC"
  - source: "Data Scientist"
    destination: "Case Management Portal"
    description: "Manages fraud models"
    technology: "HTTPS over TLS 1.3 with OAuth2/OIDC"
  - source: "Regulatory / Compliance Auditor"
    destination: "Case Management Portal"
    description: "Reviews audit logs"
    technology: "HTTPS over TLS 1.3"
  - source: "Low-Latency Scoring Engine"
    destination: "AWS S3 Object Lock"
    description: "Tamper-evident audit logging"
    technology: "AWS SDK"
  - source: "Low-Latency Scoring Engine"
    destination: "Model Registry"
    description: "Secure model retrieval"
    technology: "HTTPS with digital signature verification"