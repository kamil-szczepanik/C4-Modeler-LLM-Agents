level: component
scope: "Component diagram for the Amazon DynamoDB container"
parentContainer:
  name: "Amazon DynamoDB"
elements:
  - type: "component"
    name: "FraudDecisions Table"
    technology: "Amazon DynamoDB Table"
    description: "Stores immutable audit payloads with Partition Key TransactionId and Sort Key Timestamp."
  - type: "component"
    name: "FraudRules Table"
    technology: "Amazon DynamoDB Table"
    description: "Stores compiled rules with Partition Key RuleId."
  - type: "component"
    name: "EntityState Table"
    technology: "Amazon DynamoDB Table"
    description: "Stores entity state and velocity counters with Partition Key EntityFingerprint."
  - type: "component"
    name: "DynamoDB Streams"
    technology: "DynamoDB Streams"
    description: "Captures item-level modifications for real-time change data capture and S3 archival."
  - type: "component"
    name: "AWS KMS"
    technology: "AWS Key Management Service"
    description: "Manages customer-managed encryption keys enforcing AES-256 encryption at rest."
relationships:
  - source: "Fraud Scoring Engine"
    destination: "FraudDecisions Table"
    description: "Writes immutable audit payloads [AWS SDK / HTTPS]"
  - source: "Fraud Scoring Engine"
    destination: "FraudRules Table"
    description: "Reads compiled rules [AWS SDK / HTTPS]"
  - source: "Fraud Scoring Engine"
    destination: "EntityState Table"
    description: "Updates velocity counters [AWS SDK / HTTPS]"
  - source: "FraudDecisions Table"
    destination: "DynamoDB Streams"
    description: "Streams real-time transaction events [AWS Internal]"
  - source: "DynamoDB Streams"
    destination: "Amazon S3 Object Lock"
    description: "Archives tamper-evident audit logs for 7 years [AWS Kinesis Firehose / HTTPS]"