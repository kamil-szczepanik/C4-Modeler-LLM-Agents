level: component
scope: "Component diagram for the AWS ALB container"
parentContainer:
  name: "AWS ALB"
elements:
  - type: "component"
    name: "AWS ALB Native Listener with ACM"
    technology: "AWS ALB Native Listener, ACM, AWS Private CA"
    description: "Terminates TLS 1.3 and enforces mTLS via AWS Private CA."
  - type: "component"
    name: "AWS WAF"
    technology: "AWS WAF"
    description: "Provides L7 threat inspection, DDoS protection, and rate-limiting."
  - type: "component"
    name: "AWS ALB Target Groups"
    technology: "AWS ALB Target Groups"
    description: "Handles path-based routing, connection draining, and circuit-breaker health checks."
  - type: "component"
    name: "S3 Bucket with Object Lock"
    technology: "Amazon S3 Object Lock"
    description: "Stores immutable ALB access logs for compliance."
  - type: "component"
    name: "Payment Gateway"
    technology: "External Gateway"
    description: "Sends ingress traffic to the AWS ALB."
  - type: "component"
    name: "Fraud Scoring Engine"
    technology: "Microservice"
    description: "Receives sanitized traffic from AWS ALB via internal TLS 1.3."
relationships:
  - source: "Payment Gateway"
    destination: "AWS ALB Native Listener with ACM"
    description: "Ingress traffic via HTTPS / TLS 1.3 with mTLS [mTLS/HTTPS]"
  - source: "AWS ALB Native Listener with ACM"
    destination: "AWS WAF"
    description: "Inspects decrypted L7 payloads [Internal]"
  - source: "AWS ALB Target Groups"
    destination: "Fraud Scoring Engine"
    description: "Forwards sanitized traffic with internal TLS 1.3 [HTTP/2 over gRPC]"
  - source: "AWS ALB Native Listener with ACM"
    destination: "S3 Bucket with Object Lock"
    description: "Streams access logs for auditability [HTTPS]"