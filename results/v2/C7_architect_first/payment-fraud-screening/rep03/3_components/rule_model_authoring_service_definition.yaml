level: component
scope: "Component diagram for the Rule/Model Authoring Service container"
parentContainer:
  name: "Rule/Model Authoring Service"
elements:
  - type: "component"
    name: "Rule Authoring Controller"
    technology: "Spring Boot / Java REST API"
    description: "Manages, validates, and securely publishes fraud detection rules and ONNX scoring models; reads/writes draft rules and triggers dry-runs."
  - type: "component"
    name: "Drools Rule Engine / DRL Compiler"
    technology: "Drools / Java"
    description: "Rule validation component for checking rule syntax and logic."
  - type: "component"
    name: "Model Validation Service"
    technology: "Worker / Java"
    description: "Performs security scanning and constraint validation on models."
  - type: "component"
    name: "Simulation Worker"
    technology: "AWS Lambda"
    description: "Handles serverless dry-run testing and simulations."
relationships:
  - source: "Rule Authoring Controller"
    destination: "Authoring Database"
    description: "Reads/Writes draft rules via AWS SDK (HTTPS)"
  - source: "Rule Authoring Controller"
    destination: "Simulation Worker"
    description: "Triggers dry-runs via Amazon SQS"
  - source: "Rule Authoring Controller"
    destination: "Amazon SQS"
    description: "Publishes cryptographically signed rule/model packages via AWS SDK (SQS)"
  - source: "Simulation Worker"
    destination: "Amazon S3"
    description: "Accesses historical sample data via HTTPS"