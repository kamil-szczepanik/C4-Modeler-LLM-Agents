level: component
scope: "Component diagram for the Case Management API & UI container"
parentContainer:
  name: "Case Management API & UI"
elements:
  - type: "component"
    name: "API Gateway / Router"
    technology: "Go"
    description: "Routes API requests and WebSocket streams for real-time fraud case review and queue management."
  - type: "component"
    name: "Case Handler Service"
    technology: "Go"
    description: "Handles business logic for case management and consumes review queues."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "Go"
    description: "Writes HMAC-SHA256 signed audit logs ensuring PCI-DSS compliance and long-term regulatory auditability."
  - type: "component"
    name: "Fraud Analyst SPA"
    technology: "React, AWS S3, CloudFront"
    description: "Frontend Single Page Application providing fraud case review capabilities for analysts."
  - type: "component"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Reliable asynchronous message queuing for review cases."
  - type: "component"
    name: "AWS ECS Fargate"
    technology: "AWS ECS Fargate"
    description: "Serverless container execution minimizing operational overhead."
  - type: "component"
    name: "AWS S3 Object Lock"
    technology: "S3 Object Lock"
    description: "Tamper-evident 7-year retention storage for compliance audits."
relationships:
  - source: "Fraud Analyst / Operations Manager"
    destination: "API Gateway / Router"
    description: "Reviews cases and monitors queues [HTTPS / WebSockets]"
  - source: "API Gateway / Router"
    destination: "Case Handler Service"
    description: "Routes API requests and WebSocket streams [Internal gRPC/REST]"
  - source: "Case Handler Service"
    destination: "Amazon SQS"
    description: "Consumes review queues [SQS Message Polling]"
  - source: "Audit & Compliance Logger"
    destination: "AWS S3 Object Lock"
    description: "Writes HMAC-SHA256 signed audit logs [HTTPS / S3 API]"