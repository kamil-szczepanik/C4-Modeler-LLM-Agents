level: component
scope: "Component diagram for the Fraud Scoring Engine container"
parentContainer:
  name: "Fraud Scoring Engine"
elements:
  - type: "component"
    name: "API Handler Component"
    technology: "Spring WebFlux / Netty"
    description: "Screens card-not-present payment authorizations for fraud, providing real-time decisions."
  - type: "component"
    name: "Feature Enriched Component"
    technology: "Embedded Caffeine cache and Redis client"
    description: "Delivers high-performance in-memory feature caching and velocity counting."
  - type: "component"
    name: "Inference Engine Component"
    technology: "Embedded ONNX Runtime with Java bindings"
    description: "Provides embedded machine learning model inference to meet the sub-50ms latency constraint."
  - type: "component"
    name: "Explainability Formatter Component"
    technology: "Java"
    description: "Formats explainable auditability and output data."
  - type: "component"
    name: "Circuit Breaker & Fallback Component"
    technology: "Resilience4j"
    description: "Implements circuit breaking for fault tolerance and R-07 fail-open compliance."
  - type: "component"
    name: "Audit Logger Component"
    technology: "SHA-256 hashing"
    description: "Generates cryptographic hashing for tamper-evident audit logs ensuring PCI-DSS compliance."
relationships:
  - source: "API Handler Component"
    destination: "Circuit Breaker & Fallback Component"
    description: "Manages execution flow [Direct method call]"
  - source: "Feature Enriched Component"
    destination: "Inference Engine Component"
    description: "Passes tensor features [Direct memory transfer]"
  - source: "Inference Engine Component"
    destination: "Explainability Formatter Component"
    description: "Passes raw tensors [Direct memory transfer]"
  - source: "Inference Engine Component"
    destination: "Audit Logger Component"
    description: "Emits decision record [Blocking queue]"