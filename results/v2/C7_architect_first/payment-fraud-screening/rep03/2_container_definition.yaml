# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Real-Time Payment Fraud Screening Platform"
system:
  name: "Real-Time Payment Fraud Screening Platform"
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Internal user reviewing suspicious cases and monitoring metrics."
  - type: "person"
    name: "Fraud Operations Manager"
    description: "Internal user reviewing suspicious cases and monitoring metrics."
  - type: "person"
    name: "Risk Rule Author"
    description: "Internal user managing fraud models."
  - type: "person"
    name: "Data Scientist"
    description: "Internal user managing fraud models."
  - type: "person"
    name: "Regulatory / Compliance Auditor"
    description: "External actor reviewing audit logs."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "External actor sending authorization requests."
  - type: "externalSystem"
    name: "AWS S3 Object Lock"
    description: "Cloud storage providing tamper-evident audit logging with 7-year retention."
  - type: "container"
    name: "AWS ALB"
    technology: "AWS ALB"
    description: "Provides TLS termination, request routing, tokenizes PANs, and fail-safe circuit breaker health checks."
  - type: "container"
    name: "Fraud Scoring Engine"
    technology: "Java/Spring Boot container on AWS ECS Fargate with embedded ONNX Runtime"
    description: "Evaluates real-time payment authorizations and manages suspicious transactions with sub-50ms latency."
  - type: "container"
    name: "Case Management API & UI"
    technology: "Go/Node.js backend container and React SPA frontend"
    description: "Handles analyst reviews, case management, and reporting."
  - type: "container"
    name: "Rule/Model Authoring Service"
    technology: "Container Service"
    description: "Manages and publishes updates to fraud rules and models."
  - type: "container"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Asynchronous message bus for case routing and publishing model/rule updates."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Hot data store for low-latency state and rule lookups."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "AWS ALB"
    description: "Calls via gRPC/HTTPS over TLS"
    technology: "gRPC/HTTPS over TLS"
  - source: "AWS ALB"
    destination: "Fraud Scoring Engine"
    description: "Routes traffic and tokenizes PANs"
    technology: "HTTPS"
  - source: "Fraud Scoring Engine"
    destination: "Amazon DynamoDB"
    description: "Persists decisions and retrieves state/rules"
    technology: "AWS SDK"
  - source: "Fraud Scoring Engine"
    destination: "Amazon SQS"
    description: "Sends asynchronous messages for cases"
    technology: "AWS SDK"
  - source: "Amazon SQS"
    destination: "Case Management API & UI"
    description: "Routes async cases"
    technology: "SQS Message Polling"
  - source: "Rule/Model Authoring Service"
    destination: "Amazon SQS"
    description: "Publishes updates"
    technology: "AWS SDK"
  - source: "Fraud Scoring Engine"
    destination: "AWS S3 Object Lock"
    description: "Archives data and audit logs using AWS KMS CMKs"
    technology: "AWS SDK with AWS KMS"
  - source: "Fraud Analyst"
    destination: "Case Management API & UI"
    description: "Reviews suspicious cases and monitors metrics"
    technology: "HTTPS"
  - source: "Fraud Operations Manager"
    destination: "Case Management API & UI"
    description: "Reviews suspicious cases and monitors metrics"
    technology: "HTTPS"
  - source: "Risk Rule Author"
    destination: "Case Management API & UI"
    description: "Manages fraud models and rules"
    technology: "HTTPS"
  - source: "Data Scientist"
    destination: "Case Management API & UI"
    description: "Manages fraud models"
    technology: "HTTPS"
  - source: "Regulatory / Compliance Auditor"
    destination: "AWS S3 Object Lock"
    description: "Reviews audit logs"
    technology: "HTTPS"