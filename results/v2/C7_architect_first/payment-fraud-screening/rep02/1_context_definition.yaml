level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "A real-time payment fraud screening system that evaluates card-not-present transactions for a mid-size payment processor, providing instant authorization decisions and case management for fraud analysts while ensuring strict regulatory compliance."
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Fraud analysts who use the Case Management UI to review and manage fraud cases."
  - type: "person"
    name: "Compliance Auditors"
    description: "Compliance auditors who review audit logs and ensure strict regulatory compliance."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "Sends authorization requests for card-not-present transactions."
  - type: "externalSystem"
    name: "Card Schemes / External Credit Bureaus"
    description: "External systems used for data enrichment during transaction evaluation."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Sends authorization requests"
    technology: "gRPC / TLS 1.3 (mTLS)"
  - source: "Fraud Analysts"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Accesses Case Management UI"
    technology: "HTTPS / Browser"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Card Schemes / External Credit Bureaus"
    description: "Fetches data enrichment"
    technology: "HTTPS / REST"