level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Fraud analysts who use the Case Management UI to review and manage fraud cases."
  - type: "person"
    name: "Compliance Auditors"
    description: "Compliance auditors who review audit logs and ensure strict regulatory compliance."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "Sends authorization requests for card-not-present transactions."
  - type: "externalSystem"
    name: "Card Schemes / External Credit Bureaus"
    description: "External systems used for data enrichment during transaction evaluation."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway (REST)"
    description: "Handles ingress, JWT validation, and token masking."
  - type: "container"
    name: "Network Load Balancer"
    technology: "AWS Network Load Balancer (NLB)"
    description: "Handles load balancing with mTLS via AWS Certificate Manager Private CA."
  - type: "container"
    name: "Fraud Scoring Engine"
    technology: "Go, Amazon ECS on EC2 (c6i)"
    description: "Provides real-time fraud scoring and evaluation for payment authorizations."
  - type: "container"
    name: "Case Management Backend"
    technology: "Node.js / TypeScript, Amazon ECS Fargate"
    description: "Backend service powering the fraud analyst case management workflow."
  - type: "container"
    name: "Fraud Analyst UI"
    technology: "React Single Page Application, Amazon S3, Amazon CloudFront"
    description: "User interface for fraud analysts to review and manage fraud cases."
  - type: "container"
    name: "Feature/Rule Store & Hot Case Data"
    technology: "Amazon DynamoDB"
    description: "Stores features, rules, and hot case data."
  - type: "container"
    name: "Audit Log Store"
    technology: "Amazon Aurora PostgreSQL with ledger tables"
    description: "Provides tamper-evident 7-year audit logs."
  - type: "container"
    name: "Analytics Store"
    technology: "Amazon S3 with Athena"
    description: "Storage and analytics for transaction and fraud data."
  - type: "container"
    name: "Identity & Security Service"
    technology: "AWS Cognito, AWS Secrets Manager, AWS KMS"
    description: "Manages authentication, secrets, and encryption."
  - type: "container"
    name: "Observability Service"
    technology: "AWS X-Ray, AWS Container Insights"
    description: "Provides tracing, metrics, and monitoring for services."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "API Gateway"
    description: "Communicates authorization requests"
    technology: "HTTPS (REST, TLS 1.3)"
  - source: "API Gateway"
    destination: "Network Load Balancer"
    description: "Routes traffic"
    technology: "mTLS"
  - source: "Network Load Balancer"
    destination: "Fraud Scoring Engine"
    description: "Routes scored requests"
    technology: "mTLS"
  - source: "Fraud Analysts"
    destination: "Fraud Analyst UI"
    description: "Interacts with"
    technology: "HTTPS / Browser"
  - source: "Fraud Analyst UI"
    destination: "Case Management Backend"
    description: "Interacts with"
    technology: "HTTPS"
  - source: "Case Management Backend"
    destination: "Feature/Rule Store & Hot Case Data"
    description: "Reads/writes"
    technology: "AWS SDK"
  - source: "Case Management Backend"
    destination: "Audit Log Store"
    description: "Reads/writes"
    technology: "AWS SDK"
  - source: "Fraud Scoring Engine"
    destination: "Feature/Rule Store & Hot Case Data"
    description: "Queries features and rules"
    technology: "AWS SDK using IAM Roles"
  - source: "Fraud Scoring Engine"
    destination: "Audit Log Store"
    description: "Writes tamper-evident decision logs"
    technology: "AWS SDK using IAM Roles"
  - source: "Fraud Scoring Engine"
    destination: "Observability Service"
    description: "Sends metrics and traces"
    technology: "AWS X-Ray / Container Insights"