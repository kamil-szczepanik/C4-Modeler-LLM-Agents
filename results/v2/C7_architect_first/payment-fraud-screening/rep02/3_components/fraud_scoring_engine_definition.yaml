level: component
scope: "Component diagram for the Fraud Scoring Engine container"
parentContainer:
  name: "Fraud Scoring Engine"
elements:
  - type: "component"
    name: "API Handler Component"
    technology: "Go (net/http)"
    description: "Receives incoming requests, manages timeouts, and strips raw card data (PANs)."
  - type: "component"
    name: "Feature Fetcher & Cache Component"
    technology: "In-memory LRU cache / DynamoDB"
    description: "In-memory LRU cache wrapping DynamoDB lookups with a localized circuit breaker."
  - type: "component"
    name: "Rule Engine Component"
    technology: "Go structs and ASTs"
    description: "In-memory deterministic rule evaluator using Go structs and ASTs."
  - type: "component"
    name: "Model Scorer Component"
    technology: "ONNX Runtime Go bindings"
    description: "Executes pre-loaded machine learning models."
  - type: "component"
    name: "Explanation Builder Component"
    technology: "In-memory assembler"
    description: "Synchronous assembler capturing rule matches, feature weights, and version tags."
  - type: "component"
    name: "Audit & Telemetry Dispatcher Component"
    technology: "Go channels and worker pool"
    description: "Go channels and worker pool flushing logs asynchronously."
  - type: "component"
    name: "Network Load Balancer"
    technology: "Network Load Balancer"
    description: "Routes incoming payment authorization requests [mTLS]."
  - type: "component"
    name: "Audit Log Store"
    technology: "Amazon Aurora PostgreSQL"
    description: "Stores ledger data using AWS SDK with IAM Roles / KMS Envelope Encryption."
  - type: "component"
    name: "Observability Service"
    technology: "AWS X-Ray / Container Insights"
    description: "Emits metrics and traces using AWS SDK."
relationships:
  - source: "Network Load Balancer"
    destination: "API Handler Component"
    description: "Routes incoming payment authorization requests [mTLS]"
  - source: "API Handler Component"
    destination: "Feature Fetcher & Cache Component"
    description: "Queries hot features [In-memory lookup [Sync]]"
  - source: "API Handler Component"
    destination: "Rule Engine Component"
    description: "Evaluates transaction risk [Direct Go Interface [Sync]]"
  - source: "API Handler Component"
    destination: "Model Scorer Component"
    description: "Evaluates transaction risk [Direct Go Interface [Sync]]"
  - source: "Rule Engine Component"
    destination: "Explanation Builder Component"
    description: "Compiles match traces and importances [In-memory assembly [Sync]]"
  - source: "Model Scorer Component"
    destination: "Explanation Builder Component"
    description: "Compiles match traces and importances [In-memory assembly [Sync]]"
  - source: "Explanation Builder Component"
    destination: "Audit & Telemetry Dispatcher Component"
    description: "Passes compiled audit payload [Go Channels [Async]]"
  - source: "Audit & Telemetry Dispatcher Component"
    destination: "Audit Log Store"
    description: "Writes ledger data [AWS SDK using IAM Roles / KMS Envelope Encryption]"
  - source: "Audit & Telemetry Dispatcher Component"
    destination: "Observability Service"
    description: "Emits metrics and traces [AWS SDK]"