level: component
scope: "Component diagram for the Observability Service container"
parentContainer:
  name: "Observability Service"
elements:
  - type: "component"
    name: "Telemetry Collector"
    technology: "AWS Distro for OpenTelemetry (ADOT) sidecar"
    description: "Collects and performs local payload scrubbing on traces and metrics to protect cardholder data (PANs)."
  - type: "component"
    name: "Metrics & Tracing Backend"
    technology: "Amazon CloudWatch Metrics & AWS X-Ray"
    description: "Stores and visualizes sanitized metrics and traces with native AWS integration."
  - type: "component"
    name: "Log Ingestion & Retention Manager"
    technology: "Amazon CloudWatch Logs and Amazon S3 with S3 Object Lock (Compliance Mode)"
    description: "Manages log ingestion and guarantees tamper-evident 7-year audit retention."
  - type: "component"
    name: "Operations Dashboard"
    technology: "Amazon CloudWatch Dashboards"
    description: "Provides business and technical KPIs for operations and analysts."
  - type: "component"
    name: "Synthetic Monitoring"
    technology: "CloudWatch Synthetic Canaries"
    description: "Performs continuous uptime validation against the 1-minute availability SLA."
  - type: "component"
    name: "Fraud Scoring Engine"
    technology: "External Container"
    description: "Sends masked traces and metrics."
  - type: "component"
    name: "Fraud Analysts"
    technology: "Person"
    description: "Views business and technical KPIs via HTTPS."
relationships:
  - source: "Fraud Scoring Engine"
    destination: "Telemetry Collector"
    description: "Sends masked traces and metrics via gRPC over TLS 1.3"
  - source: "Telemetry Collector"
    destination: "Metrics & Tracing Backend"
    description: "Forwards sanitized metrics and traces over TLS 1.3"
  - source: "Fraud Analysts"
    destination: "Operations Dashboard"
    description: "Views business and technical KPIs via HTTPS"