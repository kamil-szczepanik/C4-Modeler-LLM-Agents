level: component
scope: "Component diagram for the Fraud Analyst UI container"
parentContainer:
  name: "Fraud Analyst UI"
elements:
  - type: "component"
    name: "Authentication Module"
    technology: "React, AWS Amplify, AWS Cognito"
    description: "Handles user authentication, MFA, session management, and short-lived JWTs."
  - type: "component"
    name: "Case Dashboard & Queue"
    technology: "React, TanStack Table"
    description: "Enables fraud analysts to manage queues and inspect case data."
  - type: "component"
    name: "Transaction Inspector with Decision Feedback Widget"
    technology: "React"
    description: "Inspects transactions and allows analysts to submit decision feedback."
  - type: "component"
    name: "Rule & Model Management Panel"
    technology: "React"
    description: "Allows fraud analysts to view, update, and manage fraud rules and models."
  - type: "component"
    name: "Observability Service"
    technology: "AWS RUM, AWS X-Ray, OpenTelemetry"
    description: "Tracks client-side observability and performance."
relationships:
  - source: "Authentication Module"
    destination: "Case Dashboard & Queue"
    description: "Passes in-memory state via React Context API"
  - source: "Case Dashboard & Queue"
    destination: "Case Management Backend"
    description: "Sends HTTPS / REST requests with Authorization: Bearer JWT"
  - source: "Transaction Inspector with Decision Feedback Widget"
    destination: "Case Management Backend"
    description: "Sends HTTPS / REST requests for decision feedback"
  - source: "Rule & Model Management Panel"
    destination: "Case Management Backend"
    description: "Sends HTTPS / REST requests for rule management"