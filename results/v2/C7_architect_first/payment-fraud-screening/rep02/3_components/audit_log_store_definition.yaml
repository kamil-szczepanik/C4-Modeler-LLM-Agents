level: component
scope: "Component diagram for the Audit Log Store container"
parentContainer:
  name: "Audit Log Store"
elements:
  - type: "component"
    name: "Audit Ingestion Component"
    technology: "Go"
    description: "Ingests decision logs and audit trails from the Fraud Scoring Engine and Case Management Backend."
  - type: "component"
    name: "Ledger Storage Engine"
    technology: "Amazon Aurora PostgreSQL Ledger Tables"
    description: "Stores ledger data for cryptographic immutability and simple operations."
  - type: "component"
    name: "Retention & Archival Component"
    technology: "AWS Step Functions + Amazon ECS Fargate + Amazon S3 Object Lock"
    description: "Offloads historical partitions and stores WORM-compliant archives."
  - type: "component"
    name: "Auditor Query Service"
    technology: "Go"
    description: "Provides audit bundles to the Case Management Backend via internal REST API to satisfy sub-50ms constraints."
relationships:
  - source: "Fraud Scoring Engine"
    destination: "Audit Ingestion Component"
    description: "Writes decision logs via internal HTTP/gRPC [AWS SDK, mTLS, IAM]"
  - source: "Case Management Backend"
    destination: "Audit Ingestion Component"
    description: "Writes audit trails via internal HTTP/gRPC [AWS SDK, mTLS, IAM]"
  - source: "Case Management Backend"
    destination: "Auditor Query Service"
    description: "Requests audit bundles via internal REST API [TLS 1.3]"
  - source: "Retention & Archival Component"
    destination: "Ledger Storage Engine"
    description: "Offloads historical partitions [PostgreSQL wire protocol]"
  - source: "Retention & Archival Component"
    destination: "Amazon S3"
    description: "Stores WORM-compliant archives [HTTPS/TLS 1.3]"