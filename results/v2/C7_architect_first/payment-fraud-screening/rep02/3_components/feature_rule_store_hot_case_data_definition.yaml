level: component
scope: "Component diagram for the Feature/Rule Store & Hot Case Data container"
parentContainer:
  name: "Feature/Rule Store & Hot Case Data"
elements:
  - type: "component"
    name: "Feature Store"
    technology: "Amazon DynamoDB"
    description: "Stores low-latency features for real-time fraud scoring."
  - type: "component"
    name: "DAX Accelerator"
    technology: "Amazon DynamoDB Accelerator (DAX)"
    description: "Provides in-memory caching for DynamoDB to meet <50ms P99 latency SLA."
  - type: "component"
    name: "Hot Case Data Store"
    technology: "Amazon DynamoDB"
    description: "Persists hot case data for ongoing fraud investigations."
  - type: "component"
    name: "Rule Distribution Provider"
    technology: "AWS AppConfig"
    description: "Distributes scoring rules with zero downtime and built-in schema validation."
relationships:
  - source: "DAX Accelerator"
    destination: "Feature Store"
    description: "Caches and queries low-latency feature lookups"
  - source: "Rule Distribution Provider"
    destination: "Feature Store"
    description: "Supplies configuration rules"