level: component
scope: "Component diagram for the Analytics Store container"
parentContainer:
  name: "Analytics Store"
elements:
  - type: "component"
    name: "Data Lake Storage"
    technology: "Amazon S3, Parquet format, Object Lock"
    description: "Immutable, cost-effective storage meeting the 7-year retention rule under budget."
  - type: "component"
    name: "Query Engine"
    technology: "Amazon Athena"
    description: "Serverless SQL query engine eliminating operational infrastructure overhead."
  - type: "component"
    name: "Schema Catalog"
    technology: "AWS Glue Data Catalog"
    description: "Manages schema definitions for data lake storage."
  - type: "component"
    name: "ETL Ingestion Worker"
    technology: "AWS Lambda (Python)"
    description: "Serverless ETL execution enforcing automated PII masking without AWS DMS."
  - type: "component"
    name: "BI Dashboard Interface"
    technology: "Amazon QuickSight"
    description: "Pay-per-session BI dashboarding layer empowering non-technical analysts."
  - type: "component"
    name: "Security Controls"
    technology: "AWS Lake Formation, AWS KMS"
    description: "Granular row and column-level access control for compliance."
  - type: "container"
    name: "Audit Log Store"
    technology: "Aurora PostgreSQL"
    description: "Source of audit logs for the analytics pipeline."
  - type: "person"
    name: "Fraud Analysts & Compliance Auditors"
    technology: "HTTPS via AWS Cognito"
    description: "Users querying analytics and compliance dashboards."
relationships:
  - source: "Audit Log Store"
    destination: "Data Lake Storage"
    description: "Lambda PutObject (HTTPS)"
  - source: "Data Lake Storage"
    destination: "Schema Catalog"
    description: "AWS Glue Crawler / Explicit Schema"
  - source: "Schema Catalog"
    destination: "Query Engine"
    description: "SQL (HTTPS)"
  - source: "Query Engine"
    destination: "BI Dashboard Interface"
    description: "JDBC/ODBC (HTTPS)"
  - source: "Fraud Analysts & Compliance Auditors"
    destination: "BI Dashboard Interface"
    description: "HTTPS via AWS Cognito"