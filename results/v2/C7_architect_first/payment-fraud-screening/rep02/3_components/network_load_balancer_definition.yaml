level: component
scope: "Component diagram for the Network Load Balancer container"
parentContainer:
  name: "Network Load Balancer"
elements:
  - type: "component"
    name: "TLS Termination"
    technology: "AWS Network Load Balancer TLS Listener"
    description: "Handles Layer 4/7 edge routing with TLS 1.3/1.2 ciphers and terminates incoming mTLS connections from the API Gateway."
  - type: "component"
    name: "Health Check"
    technology: "AWS NLB Target Group Health Checks"
    description: "Monitors the health and availability of downstream Fraud Scoring Engine instances."
relationships:
  - source: "TLS Termination"
    destination: "Health Check"
    description: "Validates target availability before forwarding traffic"