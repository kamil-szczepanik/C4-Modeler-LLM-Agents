level: component
scope: "Component diagram for the Case Management Backend container"
parentContainer:
  name: "Case Management Backend"
elements:
  - type: "component"
    name: "API Router / Controller"
    technology: "Express.js / Node.js"
    description: "Manages incoming HTTPS REST requests and JWT validation."
  - type: "component"
    name: "Case Service"
    technology: "TypeScript"
    description: "Handles domain business logic, case lifecycles, and WebSockets."
  - type: "component"
    name: "Audit Logger Component"
    technology: "TypeScript"
    description: "Asynchronously processes tamper-evident audit records."
  - type: "component"
    name: "Metrics & Telemetry Collector"
    technology: "OpenTelemetry"
    description: "Captures operational SLAs and review turnaround times."
  - type: "component"
    name: "Data Access Layer"
    technology: "AWS SDK v3"
    description: "Enforces data masking and tokenization against databases."
  - type: "component"
    name: "Fraud Analyst UI"
    technology: "Web UI"
    description: "User interface for fraud analysts reviewing cases."
  - type: "component"
    name: "Amazon SQS FIFO Queue"
    technology: "Amazon SQS FIFO (with DLQ)"
    description: "Guarantees ordered, reliable, and retriable audit event dispatching."
relationships:
  - source: "Fraud Analyst UI"
    destination: "API Router / Controller"
    description: "HTTPS / REST and WebSockets"
  - source: "API Router / Controller"
    destination: "Case Service"
    description: "In-process function calls"
  - source: "Case Service"
    destination: "Metrics & Telemetry Collector"
    description: "In-process telemetry calls"
  - source: "Case Service"
    destination: "Data Access Layer"
    description: "Reads/writes hot cases [DynamoDB SDK]"
  - source: "Audit Logger Component"
    destination: "Amazon SQS FIFO Queue"
    description: "Publishes audit events [HTTPS / SigV4]"
  - source: "Amazon SQS FIFO Queue"
    destination: "Data Access Layer"
    description: "Batched consumption [Aurora SDK]"
  - source: "Case Management Backend"
    destination: "Amazon SQS FIFO Queue"
    description: "Interface VPC Endpoints"