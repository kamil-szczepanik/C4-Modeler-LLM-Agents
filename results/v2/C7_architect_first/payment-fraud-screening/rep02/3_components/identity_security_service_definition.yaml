level: component
scope: "Component diagram for the Identity & Security Service container"
parentContainer:
  name: "Identity & Security Service"
elements:
  - type: "component"
    name: "Authentication Component"
    technology: "AWS Cognito"
    description: "Manages user authentication and short-lived JWT tokens for analysts."
  - type: "component"
    name: "Key Management Component"
    technology: "AWS KMS"
    description: "Handles envelope encryption, cryptographic signing, and data key caching via AWS Encryption SDK."
  - type: "component"
    name: "Secrets Management Component"
    technology: "AWS Secrets Manager"
    description: "Secures and automatically rotates database credentials and API keys."
  - type: "component"
    name: "Access Control & Policy Component"
    technology: "AWS IAM"
    description: "Enforces strict least-privilege service-to-service authorization and segregation of duties."
  - type: "person"
    name: "Fraud Analysts and Compliance Auditors"
    technology: "External User"
    description: "Users who authenticate via the Authentication Component."
  - type: "container"
    name: "Fraud Analyst UI"
    technology: "Web UI"
    description: "UI for fraud analysts."
  - type: "container"
    name: "Fraud Scoring Engine"
    technology: "Backend Service"
    description: "Engine that scores transactions."
  - type: "container"
    name: "Case Management Backend"
    technology: "Backend Service"
    description: "Backend for managing cases."
  - type: "container"
    name: "Audit Log Store"
    technology: "Database"
    description: "Store for audit logs."
relationships:
  - source: "Fraud Analyst UI"
    destination: "Authentication Component"
    description: "Authenticates via HTTPS/OIDC"
  - source: "Fraud Scoring Engine"
    destination: "Secrets Management Component"
    description: "Retrieves secrets via HTTPS/AWS SDK"
  - source: "Case Management Backend"
    destination: "Secrets Management Component"
    description: "Retrieves secrets via HTTPS/AWS SDK"
  - source: "Fraud Scoring Engine"
    destination: "Access Control & Policy Component"
    description: "Enforces IAM roles via AWS STS/IAM API"
  - source: "Case Management Backend"
    destination: "Access Control & Policy Component"
    description: "Enforces IAM roles via AWS STS/IAM API"
  - source: "Audit Log Store"
    destination: "Key Management Component"
    description: "Uses for ledger table encryption via AWS KMS API"