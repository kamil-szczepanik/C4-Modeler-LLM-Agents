level: component
scope: "Component diagram for the Analytics Event Collector & Datastore container"
parentContainer:
  name: "Analytics Event Collector & Datastore"
elements:
  - type: "component"
    name: "Ingestion Proxy / Collector"
    technology: "Fluentd"
    description: "Collects raw events, handles high-throughput buffering, pipeline filtering, and PII masking."
  - type: "component"
    name: "Stream Buffer"
    technology: "Apache Kafka"
    description: "Decouples ingestion from persistence, absorbs traffic spikes, and routes poison pills to a DLQ."
  - type: "component"
    name: "Analytics Datastore Engine"
    technology: "ClickHouse"
    description: "Columnar database for fast OLAP queries, massive write throughput, and automated partition TTL policies supporting EU data residency."
  - type: "component"
    name: "ETL / Aggregation Worker"
    technology: "Python"
    description: "Computes materialized views and executes scheduled TTL rollups for metrics computation."
  - type: "component"
    name: "Dead-Letter Queue (DLQ)"
    technology: "Apache Kafka Topic"
    description: "Routes and stores poison pills and failed events."
relationships:
  - source: "API Gateway"
    destination: "Ingestion Proxy / Collector"
    description: "Forwards raw events [HTTP/2 / TLS 1.3 with mTLS]"
  - source: "Ingestion Proxy / Collector"
    destination: "Stream Buffer"
    description: "Publishes pseudonymized events [TCP / Kafka Wire Protocol with SASL/SCRAM and TLS 1.3]"
  - source: "Stream Buffer"
    destination: "Analytics Datastore Engine"
    description: "Consumes and flushes events to disk [TCP]"
  - source: "Analytics Datastore Engine"
    destination: "Core Services API"
    description: "Serves OLAP queries and BI exports [HTTP/gRPC]"
  - source: "ETL / Aggregation Worker"
    destination: "Analytics Datastore Engine"
    description: "Computes materialized views and executes scheduled TTL rollups [Internal TCP]"