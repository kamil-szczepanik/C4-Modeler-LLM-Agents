level: component
scope: "Component diagram for the Web Application (SPA) container"
parentContainer:
  name: "Web Application (SPA)"
elements:
  - type: "component"
    name: "Router & State Management"
    technology: "React Router and Zustand"
    description: "Manages routing, global application state, and volatile in-memory JWT tokens to mitigate XSS vulnerabilities."
  - type: "component"
    name: "Authentication Module"
    technology: "OpenID Connect/OAuth2 client"
    description: "Handles user authentication and attaches volatile JWT headers to API requests."
  - type: "component"
    name: "Catalog & Search UI"
    technology: "React components"
    description: "Provides interfaces for querying search indices and managing item catalogues."
  - type: "component"
    name: "Self-Service & Circulation UI"
    technology: "React components"
    description: "Provides self-service portals and circulation interfaces for library patrons and staff."
  - type: "component"
    name: "API Client"
    technology: "Axios/Fetch API"
    description: "Communicates with external backend services and sends HTTPS/JSON requests to the API Gateway."
  - type: "component"
    name: "Offline Sync & Optimistic Cache Layer"
    technology: "IndexedDB repository pattern, Web Crypto API"
    description: "Persists transient actions for offline circulation resilience and encrypts transient patron borrowing data at rest."
  - type: "component"
    name: "Accessibility & Localization Core"
    technology: "React-Intl and ARIA-compliant primitives"
    description: "Ensures accessibility compliance and multi-language support across the UI."
relationships:
  - source: "Catalog & Search UI"
    destination: "API Client"
    description: "Queries search indices [HTTPS / JSON]"
  - source: "Self-Service & Circulation UI"
    destination: "Offline Sync & Optimistic Cache Layer"
    description: "Persists transient actions [IndexedDB]"
  - source: "Authentication Module"
    destination: "API Client"
    description: "Attaches volatile JWT headers [HTTPS]"
  - source: "API Client"
    destination: "API Gateway"
    description: "Sends requests [HTTPS / JSON]"