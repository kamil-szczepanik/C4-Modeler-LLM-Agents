level: component
scope: "Component diagram for the Search Engine container"
parentContainer:
  name: "Search Engine"
elements:
  - type: "component"
    name: "Query Parser Component"
    technology: "Lucene Query DSL engine"
    description: "Handling sanitization, fuzzy matching, facets, and PII masking."
  - type: "component"
    name: "Indexing Pipeline Component"
    technology: "Tokenizer and bulk ingestion pipeline"
    description: "Featuring language analyzers and circuit breakers."
  - type: "component"
    name: "Storage & Cluster Routing Component"
    technology: "Apache Lucene distributed shards on multi-AZ OpenSearch data nodes"
    description: "Manages distributed shards and cluster routing."
  - type: "component"
    name: "Redis Dead-Letter Queue (DLQ)"
    technology: "Redis"
    description: "Backpressure handler for bulk synchronization."
  - type: "component"
    name: "Analytics Datastore"
    technology: "ClickHouse/TimescaleDB"
    description: "Receiving search analytics, zero-result tracking, and audit logs."
  - type: "component"
    name: "Core Services API"
    technology: "HTTPS / REST with mTLS"
    description: "Submits search queries to the Search Engine."
  - type: "component"
    name: "Async Worker"
    technology: "HTTP / REST (Bulk API)"
    description: "Synchronizes catalogue item mutations secured by mTLS/IAM."
relationships:
  - source: "Core Services API"
    destination: "Query Parser Component"
    description: "Submits search queries via [HTTPS / REST] with mTLS."
  - source: "Async Worker"
    destination: "Indexing Pipeline Component"
    description: "Synchronizes catalogue item mutations via [HTTP / REST (Bulk API)] secured by mTLS/IAM."
  - source: "Query Parser Component"
    destination: "Storage & Cluster Routing Component"
    description: "Executes optimized Lucene search shards via [Internal Bolt/Transport Protocol]."
  - source: "Query Parser Component"
    destination: "Analytics Datastore"
    description: "Streams metrics, slow-logs, and zero-results tracking."
  - source: "Indexing Pipeline Component"
    destination: "Analytics Datastore"
    description: "Streams metrics, slow-logs, and zero-results tracking."
  - source: "Storage & Cluster Routing Component"
    destination: "Analytics Datastore"
    description: "Streams metrics, slow-logs, and zero-results tracking."