level: component
scope: "Component diagram for the Core Services API container"
parentContainer:
  name: "Core Services API"
elements:
  - type: "component"
    name: "Catalogue Management Component"
    technology: "NestJS module"
    description: "NestJS module for physical and digital item CRUD operations."
  - type: "component"
    name: "Circulation & RBAC Component"
    technology: "NestJS module"
    description: "NestJS module enforcing role-based access control and loan logic."
  - type: "component"
    name: "Search Integration Component"
    technology: "NestJS module"
    description: "NestJS module interfacing with Elasticsearch or OpenSearch."
  - type: "component"
    name: "Integration Facade Component"
    technology: "NestJS module"
    description: "NestJS module managing outbound calls to payment, DRM, and notification services."
  - type: "component"
    name: "Event Emitter Module"
    technology: "NestJS module"
    description: "Internal NestJS asynchronous event dispatcher for transaction decoupling."
  - type: "component"
    name: "API Gateway"
    technology: "API Gateway"
    description: "Routes requests via gRPC with mTLS to the Core Services API."
  - type: "component"
    name: "Relational Database"
    technology: "PostgreSQL"
    description: "Persistent transactional storage with SSL/TLS encryption."
  - type: "component"
    name: "Search Engine"
    technology: "Elasticsearch or OpenSearch"
    description: "Used for catalog queries."
  - type: "component"
    name: "Async Worker"
    technology: "Python/Celery and Redis"
    description: "Background task processing."
  - type: "component"
    name: "External Payment Gateway"
    technology: "HTTPS/REST"
    description: "Processes fines."
  - type: "component"
    name: "DRM Provider"
    technology: "HTTPS/REST"
    description: "Fetches digital assets."
  - type: "component"
    name: "Notification Service"
    technology: "HTTPS/REST"
    description: "Sends automated alerts."
relationships:
  - source: "API Gateway"
    destination: "Core Services API"
    description: "Routes requests via gRPC with mTLS."
  - source: "Core Services API"
    destination: "Relational Database"
    description: "Reads and writes transactional data via TCP using the PostgreSQL protocol."
  - source: "Core Services API"
    destination: "Search Engine"
    description: "Performs catalog queries via HTTP/REST."
  - source: "Core Services API"
    destination: "Async Worker"
    description: "Queues background tasks via Redis."
  - source: "Core Services API"
    destination: "External Payment Gateway"
    description: "Processes fines via HTTPS/REST."
  - source: "Core Services API"
    destination: "DRM Provider"
    description: "Fetches digital assets via HTTPS/REST."
  - source: "Core Services API"
    destination: "Notification Service"
    description: "Sends automated alerts via HTTPS/REST."