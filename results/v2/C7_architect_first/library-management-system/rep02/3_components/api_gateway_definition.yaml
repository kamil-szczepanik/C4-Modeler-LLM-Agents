level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Web Application (SPA)"
    technology: "React/TypeScript frontend served via CDN"
    description: "Used by patrons, staff, and administrators."
  - type: "component"
    name: "Routing & Upstream Component"
    technology: "Kong Proxy (Lua/Nginx core)"
    description: "Handling reverse proxying, load balancing, circuit breaking, and fallback responses."
  - type: "component"
    name: "Authentication & Authorization Component"
    technology: "Kong OIDC / JWT Plugin"
    description: "Enforcing edge validation of JSON Web Tokens."
  - type: "component"
    name: "Rate Limiting & Security Component"
    technology: "Kong plugins"
    description: "Enforcing role-aware throttling and WAF payload inspection."
  - type: "component"
    name: "Telemetry Emission Component"
    technology: "OpenTelemetry and Prometheus plugin"
    description: "Capturing metrics and scrubbing PII for EU compliance."
  - type: "component"
    name: "Core Services API"
    technology: "Node.js/NestJS"
    description: "Downstream services receiving proxied gRPC traffic."
  - type: "component"
    name: "Analytics Event Collector"
    technology: "HTTP / TLS 1.3"
    description: "Receives streamed logs and metrics."
relationships:
  - source: "Web Application (SPA)"
    destination: "Authentication & Authorization Component"
    description: "Sends requests [HTTPS / JSON]"
  - source: "Authentication & Authorization Component"
    destination: "Rate Limiting & Security Component"
    description: "Passes enriched context [Internal Lua context]"
  - source: "Rate Limiting & Security Component"
    destination: "Routing & Upstream Component"
    description: "Forwards sanitized requests"
  - source: "Routing & Upstream Component"
    destination: "Core Services API"
    description: "Proxies payload [gRPC / mTLS 1.3]"
  - source: "Telemetry Emission Component"
    destination: "Analytics Event Collector"
    description: "Streams logs and metrics [HTTP / TLS 1.3]"