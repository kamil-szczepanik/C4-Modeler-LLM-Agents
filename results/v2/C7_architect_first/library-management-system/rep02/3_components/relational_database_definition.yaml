level: component
scope: "Component diagram for the Relational Database container"
parentContainer:
  name: "Relational Database"
elements:
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Connection pooling subsystem for internal connection routing, throttling, and protecting PostgreSQL under peak loads."
  - type: "component"
    name: "PostgreSQL"
    technology: "PostgreSQL with pg_trgm, pgaudit, TDE, and AES-256"
    description: "Primary EU-hosted relational storage engine with transparent data encryption, column-level PII encryption, and DDL/DML auditing."
  - type: "component"
    name: "Patroni"
    technology: "Patroni"
    description: "High availability manager providing automated failover and multi-AZ deployment for zero-downtime maintenance."
  - type: "component"
    name: "postgres_exporter"
    technology: "postgres_exporter"
    description: "Telemetry exporter capturing metrics and slow queries for Prometheus."
relationships:
  - source: "PgBouncer"
    destination: "PostgreSQL"
    description: "Internal connection routing and throttling"
  - source: "Patroni"
    destination: "PostgreSQL"
    description: "Manages high availability and automated failover"