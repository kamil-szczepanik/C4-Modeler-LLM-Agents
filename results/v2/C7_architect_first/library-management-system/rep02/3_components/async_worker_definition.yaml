level: component
scope: "Component diagram for the Async Worker container"
parentContainer:
  name: "Async Worker"
elements:
  - type: "component"
    name: "Task Consumer / Router"
    technology: "Python/Celery"
    description: "Manages background processing, routing tasks, and ensuring asynchronous reliability."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Python"
    description: "Dispatches alerts and notifications to external services."
  - type: "component"
    name: "Index Synchronizer"
    technology: "Python"
    description: "Synchronizes and updates the search index using the outbox pattern."
  - type: "component"
    name: "Integration Sync Engine"
    technology: "Python"
    description: "Manages third-party integrations, updates transaction/sync states, and fetches secure API keys."
  - type: "component"
    name: "Redis"
    technology: "Message Broker / Cluster with AOF+RDB, TLS"
    description: "Acts as message broker for background task processing and queue management."
  - type: "component"
    name: "Relational Database"
    technology: "PostgreSQL with PgBouncer"
    description: "Stores transaction and sync states, utilizing connection pooling."
  - type: "component"
    name: "Search Engine"
    technology: "OpenSearch"
    description: "Provides search capabilities meeting sub-800ms search SLA."
  - type: "component"
    name: "External Notification Service"
    technology: "HTTPS/REST"
    description: "External service for sending alerts and notifications."
  - type: "component"
    name: "Digital Content Provider / DRM"
    technology: "Third-party Integration"
    description: "External digital content and DRM provider."
  - type: "component"
    name: "External Payment Gateway"
    technology: "Third-party Integration"
    description: "External payment gateway service."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "HTTPS/REST"
    description: "Provides secure storage for API keys and secrets."
  - type: "component"
    name: "Core Services API"
    technology: "API Service"
    description: "Enqueues jobs into the task consumer."
relationships:
  - source: "Core Services API"
    destination: "Task Consumer / Router"
    description: "Enqueues jobs [Redis, AMQP, TLS, mTLS]"
  - source: "Notification Dispatcher"
    destination: "External Notification Service"
    description: "Sends alerts [HTTPS/REST]"
  - source: "Index Synchronizer"
    destination: "Search Engine"
    description: "Updates search index [HTTP/REST]"
  - source: "Integration Sync Engine"
    destination: "Relational Database"
    description: "Updates transaction/sync states [SQL/PostgreSQL, connection pooling]"
  - source: "Integration Sync Engine"
    destination: "HashiCorp Vault"
    description: "Fetches API keys securely [HTTPS/REST]"