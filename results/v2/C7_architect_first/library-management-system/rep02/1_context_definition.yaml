level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A cloud-native solution designed for public and academic libraries to catalogue physical and digital items, manage circulation, and provide self-service portals, enforcing strict EU-only data residency and high-performance search capabilities."
elements:
  - type: "person"
    name: "Library Patron"
    description: "A library user who accesses self-service portals to search and borrow items."
  - type: "person"
    name: "Librarian / Staff"
    description: "Staff members who manage the catalogue and circulation."
  - type: "person"
    name: "Library Administrator"
    description: "Administrators who access reporting dashboards and manage system access."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "External system used to process fines and fees."
  - type: "externalSystem"
    name: "Digital Content Provider / DRM"
    description: "External provider used to fetch digital assets."
  - type: "externalSystem"
    name: "External Notification Service"
    description: "External service used to send automated alerts."
relationships:
  - source: "Library Patron"
    destination: "Library Management System"
    description: "Uses self-service portals"
    technology: "HTTPS/REST, OpenID Connect"
  - source: "Librarian / Staff"
    destination: "Library Management System"
    description: "Manages catalogue and circulation"
    technology: "HTTPS/REST with MFA"
  - source: "Library Administrator"
    destination: "Library Management System"
    description: "Accesses reporting dashboards"
    technology: "HTTPS/REST with strict RBAC/MFA"
  - source: "Library Management System"
    destination: "External Payment Gateway"
    description: "Processes fines and fees"
    technology: "REST over TLS 1.3"
  - source: "Library Management System"
    destination: "Digital Content Provider / DRM"
    description: "Fetches digital assets"
    technology: "Asynchronous queuing and REST over TLS 1.3"
  - source: "Library Management System"
    destination: "External Notification Service"
    description: "Sends automated alerts"
    technology: "REST over TLS 1.3"