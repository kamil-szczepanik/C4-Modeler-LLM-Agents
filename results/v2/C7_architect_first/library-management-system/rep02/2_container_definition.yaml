level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patron"
    description: "A library user who accesses self-service portals to search and borrow items."
  - type: "person"
    name: "Librarian / Staff"
    description: "Staff members who manage the catalogue and circulation."
  - type: "person"
    name: "Library Administrator"
    description: "Administrators who access reporting dashboards and manage system access."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system used to process fines and fees."
  - type: "externalSystem"
    name: "DRM Provider"
    description: "External provider used to fetch digital assets."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External service used to send automated alerts."
  - type: "container"
    name: "Web Application (SPA)"
    technology: "React/TypeScript served via CDN"
    description: "Client-side UI and administrative reporting."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx / Kong"
    description: "Reverse proxy, TLS termination, OAuth 2.0 / OIDC JWT validation."
  - type: "container"
    name: "Core Services API"
    technology: "Node.js/NestJS"
    description: "Business logic and role-based access control (RBAC)."
  - type: "container"
    name: "Search Engine"
    technology: "Elasticsearch / OpenSearch"
    description: "Dedicated search container for <800ms NFR."
  - type: "container"
    name: "Relational Database"
    technology: "PostgreSQL"
    description: "Primary EU-hosted datastore with CMK encryption at rest."
  - type: "container"
    name: "Async Worker"
    technology: "Python/Celery & Redis"
    description: "Asynchronous background jobs."
  - type: "container"
    name: "Analytics Event Collector & Datastore"
    technology: "Kafka/Fluentd and ClickHouse/TimescaleDB"
    description: "EU-hosted telemetry and usage analytics datastore."
relationships:
  - source: "Library Patron"
    destination: "Web Application (SPA)"
    description: "Uses self-service portals"
    technology: "HTTPS"
  - source: "Librarian / Staff"
    destination: "Web Application (SPA)"
    description: "Manages catalogue and circulation"
    technology: "HTTPS"
  - source: "Library Administrator"
    destination: "Web Application (SPA)"
    description: "Accesses reporting dashboards"
    technology: "HTTPS"
  - source: "Web Application (SPA)"
    destination: "API Gateway"
    description: "Sends requests"
    technology: "HTTPS / JSON"
  - source: "API Gateway"
    destination: "Core Services API"
    description: "Routes API requests"
    technology: "gRPC / mTLS"
  - source: "Core Services API"
    destination: "Relational Database"
    description: "Reads and writes core transactional data"
    technology: "TCP / PostgreSQL protocol"
  - source: "Core Services API"
    destination: "Search Engine"
    description: "Performs catalog searches"
    technology: "HTTP / REST"
  - source: "Core Services API"
    destination: "Async Worker"
    description: "Queues background tasks"
    technology: "Redis / Message Broker"
  - source: "API Gateway"
    destination: "Analytics Event Collector & Datastore"
    description: "Sends telemetry events"
    technology: "HTTP / TLS 1.3"
  - source: "Analytics Event Collector & Datastore"
    destination: "Analytics Event Collector & Datastore"
    description: "Stores telemetry and usage analytics data"
    technology: "TCP"
  - source: "Core Services API"
    destination: "Payment Gateway"
    description: "Processes fines and fees"
    technology: "HTTPS / REST"
  - source: "Core Services API"
    destination: "DRM Provider"
    description: "Fetches digital assets"
    technology: "HTTPS / REST"
  - source: "Core Services API"
    destination: "Notification Service"
    description: "Sends automated alerts"
    technology: "HTTPS / REST"