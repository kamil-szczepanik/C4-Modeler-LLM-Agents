level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patron"
    description: "End user who borrows physical and digital items and uses self-service portals."
  - type: "person"
    name: "Academic Researcher"
    description: "User who searches and accesses academic resources and catalogues."
  - type: "person"
    name: "Librarian / Administrator"
    description: "Staff member managing daily circulation, catalogue items, and administrative tasks."
  - type: "person"
    name: "Library Manager"
    description: "Management user overseeing library operations, analytics, and system configurations."
  - type: "externalSystem"
    name: "EU-Compliant Payment Gateway"
    description: "External payment processor handling tokenized payments securely."
  - type: "externalSystem"
    name: "Third-Party Notification Service"
    description: "External service used for sending due-date alerts and notifications."
  - type: "externalSystem"
    name: "External Identity Provider (IdP)"
    description: "External provider handling user authentication and role/attribute mapping."
  - type: "container"
    name: "Web Frontend"
    technology: "React, Nginx"
    description: "Provides cataloging, circulation, and self-service portals for users."
  - type: "container"
    name: "API Gateway"
    technology: "Kong, Spring Cloud Gateway"
    description: "Routes, manages, and secures incoming traffic to internal services."
  - type: "container"
    name: "Core Catalog Service"
    technology: "Spring Boot, PostgreSQL"
    description: "Manages catalog data and operational data storage."
  - type: "container"
    name: "Circulation & Search Service"
    technology: "FastAPI, Elasticsearch"
    description: "Handles search functionality and circulation processes with high performance."
  - type: "container"
    name: "Worker Service"
    technology: "Celery, RabbitMQ"
    description: "Handles background tasks, asynchronous operations, and external integrations."
relationships:
  - source: "Library Patron"
    destination: "Web Frontend"
    description: "Accesses portals for circulation and self-service"
    technology: "HTTPS"
  - source: "Academic Researcher"
    destination: "Web Frontend"
    description: "Searches academic catalogues via web interface"
    technology: "HTTPS"
  - source: "Librarian / Administrator"
    destination: "Web Frontend"
    description: "Manages cataloging and circulation via admin UI"
    technology: "HTTPS"
  - source: "Library Manager"
    destination: "Web Frontend"
    description: "Accesses management reports and administration"
    technology: "HTTPS"
  - source: "Web Frontend"
    destination: "API Gateway"
    description: "Sends API requests to backend services"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "Core Catalog Service"
    description: "Routes internal catalog requests"
    technology: "gRPC over Istio service mesh (mTLS)"
  - source: "API Gateway"
    destination: "Circulation & Search Service"
    description: "Routes circulation and search requests"
    technology: "gRPC over Istio service mesh (mTLS)"
  - source: "API Gateway"
    destination: "Worker Service"
    description: "Triggers asynchronous background tasks"
    technology: "gRPC over Istio service mesh (mTLS)"
  - source: "API Gateway"
    destination: "External Identity Provider (IdP)"
    description: "Validates user tokens and identity"
    technology: "OAuth2/OIDC JWT validation"
  - source: "Worker Service"
    destination: "EU-Compliant Payment Gateway"
    description: "Processes payments securely"
    technology: "HTTPS"
  - source: "Worker Service"
    destination: "Third-Party Notification Service"
    description: "Sends notifications and alerts"
    technology: "HTTPS"
  - source: "Circulation & Search Service"
    destination: "Core Catalog Service"
    description: "Queries operational data"
    technology: "gRPC over Istio service mesh (mTLS)"