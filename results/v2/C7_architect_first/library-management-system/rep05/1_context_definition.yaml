level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A multi-tenant cloud SaaS platform designed to catalogue physical and digital items, manage circulation, and provide self-service portals for academic and public libraries with strict EU data residency."
elements:
  - type: "person"
    name: "Library Patron"
    description: "End user who borrows physical and digital items and uses self-service portals."
  - type: "person"
    name: "Academic Researcher"
    description: "User who searches and accesses academic resources and catalogues."
  - type: "person"
    name: "Librarian / Administrator"
    description: "Staff member managing daily circulation, catalogue items, and administrative tasks."
  - type: "person"
    name: "Library Manager"
    description: "Management user overseeing library operations, analytics, and system configurations."
  - type: "externalSystem"
    name: "EU-Compliant Payment Gateway"
    description: "External payment processor handling tokenized payments securely."
  - type: "externalSystem"
    name: "Third-Party Notification Service"
    description: "External service used for sending due-date alerts and notifications."
  - type: "externalSystem"
    name: "External Identity Provider (IdP)"
    description: "External provider handling user authentication and role/attribute mapping."
relationships:
  - source: "Library Patron"
    destination: "Library Management System"
    description: "Accesses web portals for circulation and self-service"
    technology: "HTTPS (TLS 1.3), OAuth 2.0 / OIDC, MFA"
  - source: "Academic Researcher"
    destination: "Library Management System"
    description: "Searches and accesses academic catalogues"
    technology: "HTTPS (TLS 1.3), OAuth 2.0 / OIDC"
  - source: "Librarian / Administrator"
    destination: "Library Management System"
    description: "Manages cataloging, circulation, and admin dashboards"
    technology: "HTTPS (TLS 1.3), OAuth 2.0 / OIDC, MFA"
  - source: "Library Manager"
    destination: "Library Management System"
    description: "Accesses management reports and administration"
    technology: "HTTPS (TLS 1.3), OAuth 2.0 / OIDC, MFA"
  - source: "Library Management System"
    destination: "EU-Compliant Payment Gateway"
    description: "Processes tokenized payments and webhook verification"
    technology: "REST over mTLS"
  - source: "Library Management System"
    destination: "Third-Party Notification Service"
    description: "Sends due-date alerts and notifications"
    technology: "REST API over HTTPS with circuit-breaker"
  - source: "Library Management System"
    destination: "External Identity Provider (IdP)"
    description: "Authenticates users and maps RBAC/ABAC permissions"
    technology: "OIDC / OAuth 2.0"