level: component
scope: "Component diagram for the Worker Service container"
parentContainer:
  name: "Worker Service"
elements:
  - type: "component"
    name: "Task Dispatcher"
    technology: "Python, Celery"
    description: "Handles background tasks, asynchronous operations, and worker management."
  - type: "component"
    name: "Payment Processor Component"
    technology: "Python"
    description: "Processes financial transactions securely via the EU-Compliant Payment Gateway."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Python"
    description: "Sends notifications and alerts through the Third-Party Notification Service."
  - type: "component"
    name: "Data Sync Component"
    technology: "Python"
    description: "Handles indexing updates for the Circulation & Search Service."
  - type: "component"
    name: "Scheduled Task Scheduler Component"
    technology: "Python, Celery Beat"
    description: "Drives scheduled batch workflows and periodic task scheduling."
  - type: "component"
    name: "Transient Job State Store"
    technology: "Redis"
    description: "Transient job state store for idempotency deduplication keys with replication and AOF persistence."
  - type: "component"
    name: "RabbitMQ Message Broker"
    technology: "RabbitMQ"
    description: "Message broker with Dead Letter Queues (DLQ) for reliable task routing."
  - type: "component"
    name: "EU-Compliant Payment Gateway"
    technology: "External Service"
    description: "Processes financial transactions securely."
  - type: "component"
    name: "Third-Party Notification Service"
    technology: "External Service"
    description: "Sends notifications and alerts."
  - type: "component"
    name: "Circulation & Search Service"
    technology: "Elasticsearch"
    description: "External search and circulation service handling indexing updates."
relationships:
  - source: "API Gateway"
    destination: "Task Dispatcher"
    description: "Triggers asynchronous background tasks [gRPC over Istio service mesh with mTLS]"
  - source: "Scheduled Task Scheduler Component"
    destination: "Task Dispatcher"
    description: "Triggers periodic background jobs [Internal function call]"
  - source: "Task Dispatcher"
    destination: "RabbitMQ Message Broker"
    description: "Consumes and routes background jobs [AMQP with TLS 1.3, SCRAM-SHA-512]"
  - source: "Task Dispatcher"
    destination: "Transient Job State Store"
    description: "Checks and sets idempotency deduplication keys [Redis Protocol over TLS]"
  - source: "Payment Processor Component"
    destination: "EU-Compliant Payment Gateway"
    description: "Processes financial transactions securely [HTTPS]"
  - source: "Notification Dispatcher"
    destination: "Third-Party Notification Service"
    description: "Sends notifications and alerts [HTTPS]"
  - source: "Data Sync Component"
    destination: "Circulation & Search Service"
    description: "Handles indexing updates [REST/gRPC]"