level: component
scope: "Component diagram for the Web Frontend container"
parentContainer:
  name: "Web Frontend"
elements:
  - type: "component"
    name: "Authentication Manager"
    technology: "React, TypeScript, OIDC Client"
    description: "Handles login and session tokens via OIDC Client interacting with the External IdP."
  - type: "component"
    name: "Catalogue & Search UI"
    technology: "React, TypeScript, TanStack Query, Chart.js"
    description: "Provides interfaces for cataloguing items, searching, and viewing analytics while ensuring sub-800ms search responses."
  - type: "component"
    name: "Circulation & Self-Service Portal"
    technology: "React, TypeScript, TanStack Query"
    description: "Allows library patrons and researchers to manage circulation and self-service activities."
  - type: "component"
    name: "Admin Dashboard"
    technology: "React, TypeScript, Chart.js"
    description: "Enables librarians and administrators to manage system configurations and administrative tasks."
  - type: "component"
    name: "State & Session Store"
    technology: "Zustand"
    description: "Manages in-memory state management and user session data on the client side."
  - type: "component"
    name: "API Client"
    technology: "TypeScript, HTTPS/REST, WebSockets"
    description: "Sends API requests to the API Gateway via HTTPS/REST and WebSockets."
relationships:
  - source: "Authentication Manager"
    destination: "External IdP"
    description: "Handles login and session tokens via OIDC Client"
  - source: "API Client"
    destination: "API Gateway"
    description: "Sends API requests via HTTPS/REST and WebSockets"
  - source: "Catalogue & Search UI"
    destination: "State & Session Store"
    description: "Reads and writes UI state"
  - source: "Circulation & Self-Service Portal"
    destination: "State & Session Store"
    description: "Reads and writes session state"
  - source: "Admin Dashboard"
    destination: "State & Session Store"
    description: "Reads and writes admin state"