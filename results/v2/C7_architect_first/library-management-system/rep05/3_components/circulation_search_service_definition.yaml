level: component
scope: "Component diagram for the Circulation & Search Service container"
parentContainer:
  name: "Circulation & Search Service"
elements:
  - type: "component"
    name: "Search API Handler"
    technology: "FastAPI"
    description: "Managing queries, fuzzy matching, and input sanitization."
  - type: "component"
    name: "Circulation Engine"
    technology: "FastAPI"
    description: "Handling checkout, hold, and return workflows with RBAC."
  - type: "component"
    name: "Circulation State Manager"
    technology: "FastAPI"
    description: "Managing loan transactions and state."
  - type: "component"
    name: "Catalog Indexer Worker"
    technology: "Python async consumer"
    description: "Keeping indices synchronized."
  - type: "component"
    name: "Search Analytics Adapter"
    technology: "FastAPI"
    description: "Collecting anonymized query metrics."
  - type: "component"
    name: "Elasticsearch"
    technology: "Elasticsearch"
    description: "Datastore enforcing AES-256 encryption at rest and localized EU volumes."
  - type: "component"
    name: "RabbitMQ"
    technology: "RabbitMQ"
    description: "Message broker managing asynchronous event updates."
  - type: "component"
    name: "Core Catalog Service"
    technology: "External Service"
    description: "Queries operational data via gRPC over Istio service mesh."
relationships:
  - source: "Search API Handler"
    destination: "Elasticsearch"
    description: "Queries and indexes catalogue data via REST/Transport over mTLS (TLS)."
  - source: "RabbitMQ"
    destination: "Catalog Indexer Worker"
    description: "Consumes catalog sync events via AMQP."
  - source: "Circulation Engine"
    destination: "Circulation State Manager"
    description: "Executes internal Python function calls."
  - source: "Circulation State Manager"
    destination: "Core Catalog Service"
    description: "Queries operational data via gRPC over Istio service mesh (mTLS)."
  - source: "Search API Handler"
    destination: "Search Analytics Adapter"
    description: "Emits asynchronous query metrics internally."