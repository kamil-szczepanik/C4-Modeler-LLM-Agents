level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Authentication & Authorization"
    technology: "Kong / Spring Cloud Gateway Plugins"
    description: "Validates OAuth2/OIDC JWT tokens against the External Identity Provider and enforces access control."
  - type: "component"
    name: "Routing & Load Balancing"
    technology: "Kong / Spring Cloud Gateway"
    description: "Routes incoming requests from the Web Frontend to the appropriate backend microservices."
  - type: "component"
    name: "Rate Limiting & Throttling"
    technology: "Redis backed Kong Plugin"
    description: "Provides tiered rate-limiting and throttling to ensure system stability and fair usage."
  - type: "component"
    name: "Telemetry & Logging"
    technology: "Kong Observability Plugins"
    description: "Collects metrics, logs, and trace data for monitoring API operations."
  - type: "component"
    name: "Request Transformation"
    technology: "Kong Plugin"
    description: "Modifies incoming and outgoing request/response headers and payloads as required."
  - type: "component"
    name: "Circuit Breaker & Fallback"
    technology: "Kong Resilience Plugins"
    description: "Detects failures and provides fallback mechanisms to ensure reliability when backend services are degraded."
relationships:
  - source: "Authentication & Authorization"
    destination: "External Identity Provider (IdP)"
    description: "OAuth2/OIDC JWT validation"
  - source: "Routing & Load Balancing"
    destination: "Core Catalog Service"
    description: "gRPC over Istio service mesh (mTLS)"
  - source: "Routing & Load Balancing"
    destination: "Circulation & Search Service"
    description: "gRPC over Istio service mesh (mTLS)"
  - source: "Routing & Load Balancing"
    destination: "Worker Service"
    description: "gRPC over Istio service mesh (mTLS)"