level: component
scope: "Component diagram for the Core Catalog Service container"
parentContainer:
  name: "Core Catalog Service"
elements:
  - type: "component"
    name: "CatalogController"
    technology: "Spring MVC/REST adapter, gRPC, SPIFFE/SPIRE"
    description: "Exposes gRPC endpoints with SPIFFE/SPIRE SVID authentication."
  - type: "component"
    name: "CatalogService"
    technology: "Java / Spring Boot, MARC21/Dublin Core"
    description: "Domain component containing metadata validation, dynamic schema adapters, and facet generation."
  - type: "component"
    name: "CatalogRepository"
    technology: "Spring Data JPA, Hibernate, HikariCP, PostgreSQL JDBC"
    description: "Data access component with connection pooling and PostgreSQL JDBC drivers."
  - type: "component"
    name: "Outbox Poller"
    technology: "Java / Asynchronous Event Drainer"
    description: "Asynchronous event drainer implementing the transactional outbox pattern."
  - type: "component"
    name: "SearchSyncPublisher"
    technology: "HMAC-SHA256, Event Emitter"
    description: "Event emitter generating cryptographically signed outbox messages."
  - type: "component"
    name: "PostgreSQL Database"
    technology: "PostgreSQL, RLS, AES-256"
    description: "Primary-replica relational database with EU data residency, Row-Level Security, and encryption-at-rest."
  - type: "component"
    name: "RabbitMQ"
    technology: "RabbitMQ, mTLS, DLX"
    description: "Message broker secured with mTLS and dead-letter exchanges for asynchronous search synchronization."
  - type: "component"
    name: "API Gateway / Circulation Service"
    technology: "Istio service mesh, mTLS"
    description: "External callers routing gRPC requests over Istio service mesh using mTLS."
relationships:
  - source: "API Gateway / Circulation Service"
    destination: "CatalogController"
    description: "Routes gRPC requests over Istio service mesh using mTLS."
  - source: "CatalogController"
    destination: "CatalogService"
    description: "Direct in-process method invocation."
  - source: "CatalogService"
    destination: "CatalogRepository"
    description: "Spring Data JPA / JDBC calls with Hibernate Envers auditing."
  - source: "CatalogRepository"
    destination: "PostgreSQL Database"
    description: "TLS 1.3 encrypted JDBC queries, utilizing JSONB columns for flexible metadata."
  - source: "Outbox Poller"
    destination: "RabbitMQ"
    description: "Publishes HMAC-SHA256 signed transactional outbox events for downstream search indexing."