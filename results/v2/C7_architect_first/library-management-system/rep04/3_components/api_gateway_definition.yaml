level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing Filter"
    technology: "Spring Cloud Gateway Filter"
    description: "Proxies and routes incoming client requests to core services."
  - type: "component"
    name: "Auth Filter"
    technology: "Spring Cloud Gateway Filter"
    description: "Validates OAuth2/OIDC JWT tokens against the Identity Provider."
  - type: "component"
    name: "Rate Limiting & Resiliency"
    technology: "Resilience4j & Redis"
    description: "Protects backend SLAs using token bucket rate-limiting and circuit breakers."
  - type: "component"
    name: "Distributed Tracing Filter"
    technology: "W3C Trace Context"
    description: "Enables distributed tracing across requests."
  - type: "component"
    name: "Token Translation Component"
    technology: "Spring Bean"
    description: "Translates and validates tokens at the edge to protect backend systems."
relationships:
  - source: "Auth Filter"
    destination: "Identity Provider (IdP)"
    description: "Validates OAuth2/OIDC JWT tokens"
  - source: "Routing Filter"
    destination: "Core Services Container"
    description: "Proxies requests via gRPC over mTLS"
  - source: "Rate Limiting & Resiliency"
    destination: "Redis"
    description: "Checks token bucket rate-limiting"