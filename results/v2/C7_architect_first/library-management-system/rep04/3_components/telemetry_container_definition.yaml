level: component
scope: "Component diagram for the Telemetry Container container"
parentContainer:
  name: "Telemetry Container"
elements:
  - type: "component"
    name: "Prometheus"
    technology: "Prometheus & Prometheus Rule Evaluator"
    description: "Metrics Scraper, TSDB, Rule Evaluator, and secondary replication for long-term storage, providing metrics collection and pre-aggregation for PromQL queries."
  - type: "component"
    name: "Fluentbit"
    technology: "Fluentbit"
    description: "Log Forwarder with disk-backed queues, rate limiting, and PII sanitization for log collection, scrubbing, and rate-limited log forwarding."
  - type: "component"
    name: "Grafana"
    technology: "Grafana"
    description: "Visualization and Alerting UI with RBAC and immutable audit logging for operational and business dashboard visualization."
  - type: "component"
    name: "Blackbox Exporter"
    technology: "Blackbox Exporter"
    description: "Synthetic probing for search SLA verification (< 800ms) and R-05 SLA tracking."
  - type: "component"
    name: "Library Administrator"
    technology: "Business-value dashboard consumer"
    description: "User who consumes business-value dashboards."
  - type: "component"
    name: "Core Services"
    technology: "Container Service"
    description: "External core services container pulling metrics."
  - type: "component"
    name: "Search"
    technology: "Container Service"
    description: "External search container pulling metrics."
  - type: "component"
    name: "API Gateway"
    technology: "API Gateway"
    description: "External API gateway pulling metrics."
  - type: "component"
    name: "All Containers"
    technology: "Container Services"
    description: "All system containers writing logs."
  - type: "component"
    name: "External Alert Sink"
    technology: "PagerDuty / EU-hosted incident tool"
    description: "External tool receiving webhooks from Grafana."
relationships:
  - source: "Core Services"
    destination: "Prometheus"
    description: "Pulls metrics via HTTP/TCP"
  - source: "Search"
    destination: "Prometheus"
    description: "Pulls metrics via HTTP/TCP"
  - source: "API Gateway"
    destination: "Prometheus"
    description: "Pulls metrics via HTTP/TCP"
  - source: "All Containers"
    destination: "Fluentbit"
    description: "Writes logs via local socket/file mounts"
  - source: "Prometheus"
    destination: "Prometheus"
    description: "Internal evaluation loop (Scraper to Rule Evaluator)"
  - source: "Library Administrator"
    destination: "Grafana"
    description: "HTTPS, via API Gateway OIDC integration"
  - source: "Grafana"
    destination: "External Alert Sink"
    description: "Webhooks via PagerDuty/EU-hosted incident tool"