level: component
scope: "Component diagram for the Search Container container"
parentContainer:
  name: "Search Container"
elements:
  - type: "component"
    name: "Search Router / API Handler"
    technology: "Java / Spring Boot"
    description: "Processes complex search queries, facets, and spelling suggestions, and handles JWT validation."
  - type: "component"
    name: "Facet & Aggregation Processor"
    technology: "Java / Spring Boot"
    description: "Processes facets and aggregations for item discovery."
  - type: "component"
    name: "Search Engine Index"
    technology: "Elasticsearch 8.x, 3-node Kubernetes StatefulSet"
    description: "Delivers fast, secure item discovery for patrons and staff using inverted indices and multi-match queries."
  - type: "component"
    name: "CDC Ingestion Listener"
    technology: "Logstash / Kafka Connect"
    description: "Handles low-latency index updates via internal TCP/Transport protocol."
  - type: "component"
    name: "Caching Layer"
    technology: "Redis"
    description: "Implements short-TTL caching for frequent search queries, facet counts, and rate limiting."
relationships:
  - source: "API Gateway"
    destination: "Search Router / API Handler"
    description: "REST/HTTPS (JSON payload) with JWT validation"
  - source: "Search Router / API Handler"
    destination: "Search Engine Index"
    description: "REST/Transport protocol using optimized Query DSL"
  - source: "CDC Ingestion Listener"
    destination: "Search Engine Index"
    description: "Internal TCP/Transport protocol for low-latency index updates"
  - source: "Search Router / API Handler"
    destination: "Caching Layer"
    description: "In-memory caching for frequent search queries and facet counts"