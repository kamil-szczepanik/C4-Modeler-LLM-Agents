level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Database Container"
    technology: "PostgreSQL"
    description: "Provides cataloging, circulation, and self-service portals with secure transactional processing."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Inbound connection management to prevent exhaustion under load."
  - type: "component"
    name: "Relational Storage Engine"
    technology: "PostgreSQL Core"
    description: "Core relational data storage enforcing ACID compliance."
  - type: "component"
    name: "Read-Replica Routing Layer"
    technology: "Routing Layer"
    description: "Routes read-only queries to replicas."
  - type: "component"
    name: "Row-Level Security (RLS) Policy Engine"
    technology: "PostgreSQL RLS"
    description: "Enforces row-level security for data protection."
  - type: "component"
    name: "Audit Logging Module"
    technology: "pgaudit"
    description: "Security and administrative event capture for compliance reporting."
  - type: "component"
    name: "Patroni Primary-Replica Cluster"
    technology: "Patroni with etcd"
    description: "Automated high-availability failover and consensus management."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Dynamic, short-lived database credential provisioning."
relationships:
  - source: "Core Services Container"
    destination: "Connection Pooler"
    description: "Manages persistent connections [JDBC/TCP, TLS 1.3]"
  - source: "Connection Pooler"
    destination: "Relational Storage Engine"
    description: "Routes write and transactional queries [TCP]"
  - source: "Connection Pooler"
    destination: "Read-Replica Routing Layer"
    description: "Routes read-only queries [TCP]"
  - source: "Read-Replica Routing Layer"
    destination: "Patroni Primary-Replica Cluster"
    description: "Distributes read queries [TCP, mTLS]"
  - source: "Telemetry Container"
    destination: "Database Container"
    description: "Scrapes metrics and replication lag [Prometheus exporter]"