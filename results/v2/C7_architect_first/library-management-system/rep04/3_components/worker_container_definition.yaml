level: component
scope: "Component diagram for the Worker Container container"
parentContainer:
  name: "Worker Container"
elements:
  - type: "component"
    name: "Task Dispatch Consumer"
    technology: "Python, Celery"
    description: "Executes asynchronous background tasks and consumes messages from the message broker."
  - type: "component"
    name: "Notification Processor"
    technology: "Python"
    description: "Processes and sends notifications to external notification services."
  - type: "component"
    name: "Index Synchronizer"
    technology: "Python"
    description: "Pushes updates to the Search Container to keep indexes synchronized."
  - type: "component"
    name: "State Cache Manager"
    technology: "Python client, Redis"
    description: "Manages ephemeral state, rate-limiting, and distributed locking."
  - type: "component"
    name: "Fine & Circulation Batch Processor"
    technology: "Python"
    description: "Handles batch processing for fines and circulation, querying the database and calling payment gateways."
  - type: "component"
    name: "RabbitMQ"
    technology: "RabbitMQ"
    description: "Message broker with AMQPS transport security and Dead Letter Queues."
  - type: "component"
    name: "Search Container"
    technology: "Elasticsearch"
    description: "External search container for indexing and searching."
  - type: "component"
    name: "Notification Service"
    technology: "External Service"
    description: "External service responsible for dispatching notifications."
  - type: "component"
    name: "Payment Gateway"
    technology: "External Service"
    description: "External service for processing financial transactions and fines."
  - type: "component"
    name: "Database"
    technology: "PostgreSQL"
    description: "Relational database for storing library data."
  - type: "component"
    name: "Telemetry Container"
    technology: "Prometheus, Grafana, Fluentbit"
    description: "Provides telemetry, audit log streaming, and PII masking."
relationships:
  - source: "Task Dispatch Consumer"
    destination: "RabbitMQ"
    description: "Receives messages from via AMQPS (TLS 1.3)"
  - source: "Index Synchronizer"
    destination: "Search Container"
    description: "Pushes updates via HTTP/REST"
  - source: "Notification Processor"
    destination: "Notification Service"
    description: "Calls external service via HTTPS (TLS 1.3)"
  - source: "Fine & Circulation Batch Processor"
    destination: "Payment Gateway"
    description: "Calls external service via HTTPS (TLS 1.3)"
  - source: "Task Dispatch Consumer"
    destination: "State Cache Manager"
    description: "Interacts via TCP/RESP (TLS)"
  - source: "Notification Processor"
    destination: "State Cache Manager"
    description: "Interacts via TCP/RESP (TLS)"
  - source: "Index Synchronizer"
    destination: "State Cache Manager"
    description: "Interacts via TCP/RESP (TLS)"
  - source: "Fine & Circulation Batch Processor"
    destination: "State Cache Manager"
    description: "Interacts via TCP/RESP (TLS)"
  - source: "Fine & Circulation Batch Processor"
    destination: "Database"
    description: "Queries via JDBC/TCP"