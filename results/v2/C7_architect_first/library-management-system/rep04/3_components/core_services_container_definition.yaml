level: component
scope: "Component diagram for the Core Services Container container"
parentContainer:
  name: "Core Services Container"
elements:
  - type: "component"
    name: "Catalog Component"
    technology: "Spring @Service, JPA"
    description: "Manages physical and digital item metadata."
  - type: "component"
    name: "Circulation Component"
    technology: "Spring @Service, JPA"
    description: "Handles borrowing, returns, and holds logic."
  - type: "component"
    name: "Patron Account Component"
    technology: "Spring @Service, JPA"
    description: "Manages user profiles and EU-constrained PII."
  - type: "component"
    name: "Data Access Layer"
    technology: "Spring Data JPA, Hibernate"
    description: "Enforces EU-only data residency and AES-256 encryption."
  - type: "component"
    name: "API Gateway"
    technology: "Gateway"
    description: "External dependency handling routing and authentication."
  - type: "component"
    name: "PostgreSQL Database"
    technology: "PostgreSQL"
    description: "External database dependency."
  - type: "component"
    name: "Elasticsearch Search Container"
    technology: "Elasticsearch"
    description: "External search container dependency."
  - type: "component"
    name: "RabbitMQ"
    technology: "RabbitMQ"
    description: "External message broker and dead-letter queue."
relationships:
