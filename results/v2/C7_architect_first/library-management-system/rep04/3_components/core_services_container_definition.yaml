    destination: "Circulation Component"
    description: "Authenticated gRPC / internal REST with mTLS, W3C Trace Context, and Spring Security @PreAuthorize"
  - source: "API Gateway"
    destination: "Patron Account Component"
    description: "Authenticated gRPC / internal REST with mTLS, W3C Trace Context, and Spring Security @PreAuthorize"
  - source: "Catalog Component"
    destination: "Data Access Layer"
    description: "JDBC over TLS 1.3 within private EU subnet"
  - source: "Circulation Component"
    destination: "Data Access Layer"
    description: "JDBC over TLS 1.3 within private EU subnet"
  - source: "Catalog Component"
    destination: "Elasticsearch Search Container"
