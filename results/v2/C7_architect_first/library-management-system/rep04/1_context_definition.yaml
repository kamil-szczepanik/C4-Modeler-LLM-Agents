level: context
scope: "System Context diagram for Library Management System (LMS)"
system:
  name: "Library Management System (LMS)"
  description: "A EU-hosted solution providing public and academic libraries with cataloging, circulation, and self-service portals, ensuring high-performance item searches and strict regional compliance."
elements:
  - type: "person"
    name: "Patron & Library Administrator / Staff"
    description: "End-users accessing self-service portals, circulation tools, and reporting via WCAG 2.1 AA accessibility standards."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Manages authentication via OAuth 2.0 / OpenID Connect and issues signed JWTs."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Processes fines and fees with PCI-DSS compliance."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Handles automated transactional alerts (SendGrid/Twilio EU region)."
relationships:
  - source: "Patron & Library Administrator / Staff"
    destination: "Library Management System (LMS)"
    description: "Accesses self-service portals, circulation tools, and reporting"
    technology: "HTTPS / REST using TLS 1.3, mTLS, and API rate-limiting"
  - source: "Library Management System (LMS)"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users and enforces RBAC"
    technology: "OpenID Connect / OAuth 2.0"
  - source: "Library Management System (LMS)"
    destination: "Payment Gateway"
    description: "Processes fines and fees securely"
    technology: "HTTPS / REST with regional EU acquirers"
  - source: "Library Management System (LMS)"
    destination: "Notification Service"
    description: "Sends automated transactional alerts"
    technology: "Asynchronous webhooks with HMAC signature verification"