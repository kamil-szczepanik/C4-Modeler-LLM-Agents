level: container
scope: "Container diagram for Library Management System (LMS)"
system:
  name: "Library Management System (LMS)"
elements:
  - type: "person"
    name: "Patron & Library Administrator / Staff"
    description: "End-users accessing self-service portals, circulation tools, and reporting via WCAG 2.1 AA accessibility standards."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Manages authentication via OAuth 2.0 / OpenID Connect and issues signed JWTs."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Processes fines and fees with PCI-DSS compliance."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Handles automated transactional alerts (SendGrid/Twilio EU region)."
  - type: "container"
    name: "Web App (SPA)"
    technology: "React, Nginx"
    description: "Frontend delivery for patrons and staff."
  - type: "container"
    name: "API Gateway"
    technology: "Spring Cloud Gateway, OAuth2/OIDC"
    description: "Microservice orchestration and API routing."
  - type: "container"
    name: "Core Services Container"
    technology: "Spring Boot"
    description: "Microservices handling core business logic."
  - type: "container"
    name: "Search Container"
    technology: "Elasticsearch"
    description: "High-performance catalogue searching."
  - type: "container"
    name: "Worker Container"
    technology: "Python, Celery, RabbitMQ, Redis"
    description: "Background worker processing and broker."
  - type: "container"
    name: "Telemetry Container"
    technology: "Prometheus, Grafana, Fluentbit"
    description: "Monitoring, telemetry, and logging."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL, AES-256 encryption"
    description: "Transactional relational data storage."
relationships:
  - source: "Patron & Library Administrator / Staff"
    destination: "Web App (SPA)"
    description: "Accesses portals and UI"
    technology: "HTTPS with TLS 1.3"
  - source: "Web App (SPA)"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS with TLS 1.3"
  - source: "API Gateway"
    destination: "Core Services Container"
    description: "Routes requests to core services"
    technology: "gRPC / internal REST with mTLS"
  - source: "Core Services Container"
    destination: "Database"
    description: "Reads and writes transactional data"
    technology: "Restricted private EU subnet with AES-256"
  - source: "Core Services Container"
    destination: "Search Container"
    description: "Synchronizes data for searching"
    technology: "Asynchronous change data capture (CDC) sync"
  - source: "Library Management System (LMS)"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users and enforces RBAC"
    technology: "OpenID Connect / OAuth 2.0"
  - source: "Library Management System (LMS)"
    destination: "Payment Gateway"
    description: "Processes fines and fees securely"
    technology: "HTTPS / REST with regional EU acquirers"
  - source: "Library Management System (LMS)"
    destination: "Notification Service"
    description: "Sends automated transactional alerts"
    technology: "Asynchronous webhooks with HMAC signature verification"