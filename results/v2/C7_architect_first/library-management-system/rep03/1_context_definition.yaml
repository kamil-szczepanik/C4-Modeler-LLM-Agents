level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Provides cataloguing, circulation, and self-service portals for public and academic libraries while ensuring strict EU-only data residency and high-performance search."
elements:
  - type: "person"
    name: "Library Patron"
    description: "Accesses self-service portals to borrow books, search catalogues, and manage their library accounts."
  - type: "person"
    name: "Librarian / Staff"
    description: "Manages library circulation, cataloguing, and administrative tasks using the management system."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system used for processing fines, fees, and payments securely via tokenized PAN."
  - type: "externalSystem"
    name: "National Library Registry"
    description: "External system for national bibliographic data exchange and cataloguing synchronization."
  - type: "externalSystem"
    name: "Third-Party IdP / Academic SSO"
    description: "Provides federated authentication and multi-factor authentication compliance using SAML 2.0 / OIDC."
  - type: "externalSystem"
    name: "Notification System"
    description: "External system responsible for sending out alerts, reminders, and notifications to patrons and staff."
  - type: "container"
    name: "CDN / Edge Caching Layer"
    description: "Edge caching layer implemented to achieve high-performance search response times."
relationships:
  - source: "Library Patron"
    destination: "CDN / Edge Caching Layer"
    description: "Accesses portal and search services"
    technology: "HTTPS, TLS 1.3"
  - source: "Librarian / Staff"
    destination: "CDN / Edge Caching Layer"
    description: "Accesses staff and management features"
    technology: "HTTPS, TLS 1.3"
  - source: "Library Management System"
    destination: "Third-Party IdP / Academic SSO"
    description: "Authenticates users via federated identity"
    technology: "SAML 2.0 / OIDC over HTTPS"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Processes financial transactions and fees"
    technology: "HTTPS/REST, tokenized PAN"
  - source: "Library Management System"
    destination: "National Library Registry"
    description: "Synchronizes registry and cataloguing data"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "Notification System"
    description: "Dispatches notifications and alerts"
    technology: "HTTPS/REST"