# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patron"
    description: "Accesses self-service portals to borrow books, search catalogues, and manage their library accounts."
  - type: "person"
    name: "Librarian / Staff"
    description: "Manages library circulation, cataloguing, and administrative tasks using the management system."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system used for processing fines, fees, and payments securely via tokenized PAN."
  - type: "externalSystem"
    name: "National Library Registry"
    description: "External system for national bibliographic data exchange and cataloguing synchronization."
  - type: "externalSystem"
    name: "Third-Party IdP / Academic SSO"
    description: "Provides federated authentication and multi-factor authentication compliance using SAML 2.0 / OIDC."
  - type: "externalSystem"
    name: "Notification System"
    description: "External system responsible for sending out alerts, reminders, and notifications to patrons and staff."
  - type: "container"
    name: "Web Application SPA"
    technology: "React/TypeScript"
    description: "Client-side routing for patron/staff portals delivered via CDN."
  - type: "container"
    name: "API Gateway"
    technology: "NGINX / Spring Cloud Gateway"
    description: "Handles routing, SSL termination, and JWT validation."
  - type: "container"
    name: "Core Domain Service"
    technology: "Java/Spring Boot"
    description: "Manages cataloging, circulation, and business logic."
  - type: "container"
    name: "Search Service"
    technology: "Python/FastAPI with Elasticsearch"
    description: "Optimizes indices for sub-800ms search NFR."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL"
    description: "Relational storage with EU-only data residency and column-level PII encryption."
  - type: "container"
    name: "Background Worker"
    technology: "Python/Celery"
    description: "Asynchronous background task processing."
  - type: "container"
    name: "Asynchronous Broker"
    technology: "Redis"
    description: "Event pub/sub and task queue with AOF persistence."
relationships:
  - source: "Library Patron"
    destination: "Web Application SPA"
    description: "Accesses self-service portals and search"
    technology: "HTTPS/WSS"
  - source: "Librarian / Staff"
    destination: "Web Application SPA"
    description: "Accesses management and circulation features"
    technology: "HTTPS/WSS"
  - source: "Web Application SPA"
    destination: "API Gateway"
    description: "Sends API requests with JWT validation"
    technology: "HTTPS/WSS with JWT"
  - source: "API Gateway"
    destination: "Core Domain Service"
    description: "Routes business logic requests"
    technology: "gRPC over HTTP/2 with mTLS"
  - source: "API Gateway"
    destination: "Search Service"
    description: "Routes search requests"
    technology: "gRPC over HTTP/2 with mTLS"
  - source: "Core Domain Service"
    destination: "Database"
    description: "Reads and writes relational data"
    technology: "JDBC/TLS"
  - source: "Search Service"
    destination: "Database"
    description: "Queries search index data"
    technology: "JDBC/TLS"
  - source: "Core Domain Service"
    destination: "Asynchronous Broker"
    description: "Dispatches async tasks and events"
    technology: "TLS"
  - source: "Background Worker"
    destination: "Asynchronous Broker"
    description: "Consumes background tasks"
    technology: "TLS"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Processes payments and fines"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "National Library Registry"
    description: "Synchronizes bibliographic data"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "Third-Party IdP / Academic SSO"
    description: "Authenticates users"
    technology: "SAML 2.0 / OIDC over HTTPS"
  - source: "Library Management System"
    destination: "Notification System"
    description: "Sends alerts and notifications"
    technology: "HTTPS/REST"