level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Connection pooler managing client connections and statement timeouts."
  - type: "component"
    name: "PostgreSQL Core (Relational Data Engine)"
    technology: "PostgreSQL"
    description: "Stores structured data and enforces row/column-level security (RLS/CLS)."
  - type: "component"
    name: "pgaudit Extension"
    technology: "pgaudit"
    description: "Captures detailed statements and session audit logs for PII access."
  - type: "component"
    name: "pgcrypto Extension"
    technology: "pgcrypto"
    description: "Handles transparent column-level encryption for sensitive patron data."
relationships:
  - source: "PgBouncer"
    destination: "PostgreSQL Core (Relational Data Engine)"
    description: "Routes and manages pooled connections [TCP]"
  - source: "PostgreSQL Core (Relational Data Engine)"
    destination: "pgaudit Extension"
    description: "Emits database activity logs [Internal]"