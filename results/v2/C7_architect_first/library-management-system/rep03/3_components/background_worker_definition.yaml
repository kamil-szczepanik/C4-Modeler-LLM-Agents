level: component
scope: "Component diagram for the Background Worker container"
parentContainer:
  name: "Background Worker"
elements:
  - type: "component"
    name: "Task Consumer"
    technology: "Python 5.x / Celery 5.x"
    description: "Celery Worker Core that consumes asynchronous tasks via AMQP/Redis using TLS and mTLS."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Python 5.x"
    description: "Sends alerts and handles out-of-band communications via REST/HTTPS."
  - type: "component"
    name: "Data Sync Processor"
    technology: "Python 5.x"
    description: "Synchronizes catalogue metadata with the National Library Registry via REST/HTTPS with TLS 1.3."
  - type: "component"
    name: "Task Router & DLQ Handler"
    technology: "Python 5.x / Celery 5.x"
    description: "Routes tasks and handles the Dead Letter Queue to prevent task starvation and isolate long-running jobs."
relationships:
  - source: "Task Consumer"
    destination: "Asynchronous Broker"
    description: "Consumes tasks via AMQP/Redis [TLS, mTLS]"
  - source: "Notification Dispatcher"
    destination: "Notification System"
    description: "Sends alerts via REST/HTTPS"
  - source: "Data Sync Processor"
    destination: "National Library Registry"
    description: "Syncs metadata via REST/HTTPS [TLS 1.3]"
  - source: "Task Consumer"
    destination: "Database"
    description: "Reads/writes job states via SQLAlchemy [TLS 1.3, PgBouncer]"