level: component
scope: "Component diagram for the Asynchronous Broker container"
parentContainer:
  name: "Asynchronous Broker"
elements:
  - type: "component"
    name: "Event Publisher"
    technology: "Redis Pub/Sub"
    description: "Publishes domain events using TCP/RESP3 and mTLS."
  - type: "component"
    name: "Task Queue Manager"
    technology: "Redis Streams / Lists"
    description: "Enqueues background tasks with encrypted PII payloads and manages stream acknowledgments."
  - type: "component"
    name: "Dead-Letter Queue"
    technology: "Redis List / Stream"
    description: "Routes unprocessable poison-pill messages."
relationships:
  - source: "Event Publisher"
    destination: "Task Queue Manager"
    description: "Publishes domain events and coordinates message flow"
  - source: "Task Queue Manager"
    destination: "Dead-Letter Queue"
    description: "Routes unprocessable poison-pill messages"