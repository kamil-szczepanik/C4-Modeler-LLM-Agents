level: component
scope: "Component diagram for the Core Domain Service container"
parentContainer:
  name: "Core Domain Service"
elements:
  - type: "component"
    name: "Catalog Management Component"
    technology: "Spring @Service, Java"
    description: "Manages cataloging rules and operations for the Library Management System."
  - type: "component"
    name: "Circulation Engine Component"
    technology: "Spring @Service, Java"
    description: "Processes circulation logic and patron borrowing rules."
  - type: "component"
    name: "Fine & Fee Management Component"
    technology: "Spring @Service, Java"
    description: "Handles financial rules, fines, and fee processing for patrons."
  - type: "component"
    name: "Domain Event Publisher"
    technology: "Spring Component, Java"
    description: "Delegates and dispatches domain state changes via Spring's ApplicationEventPublisher."
relationships:
  - source: "Catalog Management Component"
    destination: "Database"
    description: "Executes transactional reads and writes via Spring Data JPA and JDBC over TLS"
  - source: "Circulation Engine Component"
    destination: "Database"
    description: "Executes transactional reads and writes via Spring Data JPA and JDBC over TLS"
  - source: "Fine & Fee Management Component"
    destination: "Database"
    description: "Executes transactional reads and writes via Spring Data JPA and JDBC over TLS"
  - source: "Circulation Engine Component"
    destination: "Domain Event Publisher"
    description: "Delegates domain state changes"
  - source: "Fine & Fee Management Component"
    destination: "Domain Event Publisher"
    description: "Delegates domain state changes"
  - source: "Domain Event Publisher"
    destination: "Asynchronous Broker"
    description: "Dispatches domain events via Spring Data Redis over TLS with application-layer encryption for financial payloads"