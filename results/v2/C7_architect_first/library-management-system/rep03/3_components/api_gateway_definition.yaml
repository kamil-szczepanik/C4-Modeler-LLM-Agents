level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing & Load Balancing Component"
    technology: "Spring Cloud Gateway"
    description: "Manages dynamic request routing, load balancing, and edge caching/compression coordination."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Spring Security / Custom Filter"
    description: "Validates JWTs and enforces strict authentication and authorization."
  - type: "component"
    name: "Rate Limiting & Throttling Component"
    technology: "Redis"
    description: "Distributed token bucket rate limiting and pub/sub cache invalidation."
  - type: "component"
    name: "Caching & Compression Component"
    technology: "Spring Caching / Compression"
    description: "Caches responses to ensure low-latency search performance."
  - type: "component"
    name: "Telemetry & Audit Interceptor"
    technology: "OpenTelemetry"
    description: "Handles distributed tracing and telemetry collection."
  - type: "component"
    name: "Web Application Firewall (WAF) Layer"
    technology: "WAF Layer"
    description: "Provides security enforcement for public and academic library portals."
  - type: "component"
    name: "Kubernetes Deployment Infrastructure"
    technology: "Kubernetes"
    description: "Manages horizontal autoscaling and resource allocation."
  - type: "component"
    name: "Web Application SPA"
    technology: "Single Page Application"
    description: "External or peer client application sending requests."
  - type: "component"
    name: "Core Domain / Search Service"
    technology: "gRPC over HTTP/2 with mTLS"
    description: "Internal backend services handling domain and search logic."
  - type: "component"
    name: "Kubernetes Cloud Load Balancer"
    technology: "Cloud Load Balancer"
    description: "Routes EU-only traffic into the cluster."
relationships:
  - source: "Web Application SPA"
    destination: "Authentication & Authorization Filter"
    description: "Validates JWTs [HTTPS]"
  - source: "Routing & Load Balancing Component"
    destination: "Caching & Compression Component"
    description: "Checks cached responses [Internal]"
  - source: "Routing & Load Balancing Component"
    destination: "Rate Limiting & Throttling Component"
    description: "Checks request quotas [In-memory Redis protocol]"
  - source: "Authentication & Authorization Filter"
    destination: "Core Domain / Search Service"
    description: "Propagates cryptographic assertion tokens [gRPC over HTTP/2 with mTLS]"
  - source: "Kubernetes Cloud Load Balancer"
    destination: "Routing & Load Balancing Component"
    description: "Routes EU-only traffic [HTTPS]"