level: component
scope: "Component diagram for the Search Service container"
parentContainer:
  name: "Search Service"
elements:
  - type: "component"
    name: "API Controller"
    technology: "FastAPI routing and request validation handler"
    description: "FastAPI routing and request validation handler for incoming client traffic."
  - type: "component"
    name: "Query Builder"
    technology: "Python / FastAPI"
    description: "Handles fuzzy matching, synonyms, and facets."
  - type: "component"
    name: "Access Control Filter"
    technology: "Python / FastAPI"
    description: "Enforces pre-query role-based filtering."
  - type: "component"
    name: "Elasticsearch Client"
    technology: "elasticsearch-py async client"
    description: "Executes asynchronous search queries against Elasticsearch."
  - type: "component"
    name: "Index Sync Listener"
    technology: "Background consumer / Python"
    description: "Background consumer keeping indices synchronized via Redis."
relationships:
  - source: "API Controller"
    destination: "Query Builder"
    description: "Routes validated search requests to"
  - source: "Query Builder"
    destination: "Access Control Filter"
    description: "Applies access control rules to"
  - source: "Access Control Filter"
    destination: "Elasticsearch Client"
    description: "Sends secure query parameters to"
  - source: "Index Sync Listener"
    destination: "Elasticsearch Client"
    description: "Synchronizes index updates to"