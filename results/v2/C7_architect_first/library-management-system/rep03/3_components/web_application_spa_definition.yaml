level: component
scope: "Component diagram for the Web Application SPA container"
parentContainer:
  name: "Web Application SPA"
elements:
  - type: "component"
    name: "Routing & State Management Component"
    technology: "React Router & Zustand"
    description: "Manages navigation, roles, and in-memory state."
  - type: "component"
    name: "API Client Component"
    technology: "Axios/Fetch with interceptors"
    description: "Handles communication with the Gateway."
  - type: "component"
    name: "Search & Catalog UI Component"
    technology: "Reactive UI (React/TypeScript)"
    description: "Reactive UI supporting WCAG 2.1 AA accessibility and <800ms search NFR."
  - type: "component"
    name: "Authentication & Session Component"
    technology: "OIDC Client"
    description: "Handles authentication using Authorization Code Flow with PKCE."
  - type: "component"
    name: "Accessibility & Localization Provider"
    technology: "Cross-cutting context"
    description: "Cross-cutting context for i18n and screen-reader compliance."
  - type: "component"
    name: "Telemetry & Resilience Middleware"
    technology: "OpenTelemetry SDK & Circuit-breaker"
    description: "Exports sanitized OpenTelemetry traces and handles resilience."
relationships:
  - source: "Routing & State Management Component"
    destination: "API Client Component"
    description: "Passes state and session data for requests"
  - source: "API Client Component"
    destination: "API Gateway"
    description: "Sends API requests and JWT validation [HTTPS/WSS with JWT]"
  - source: "Authentication & Session Component"
    destination: "Third-Party IdP / Academic SSO"
    description: "Authenticates via Authorization Code Flow with PKCE [HTTPS]"
  - source: "Telemetry & Resilience Middleware"
    destination: "EU-hosted API Gateway"
    description: "Exports sanitized OpenTelemetry traces [HTTPS]"