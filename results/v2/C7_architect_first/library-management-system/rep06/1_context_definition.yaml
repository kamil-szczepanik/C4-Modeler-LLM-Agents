# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Core software system handling business logic, cataloging, circulation, and high-performance search capabilities for public and academic libraries within EU infrastructure."
elements:
  - type: "person"
    name: "Library Patrons"
    description: "End-users accessing public catalogs and self-service portals."
  - type: "person"
    name: "Library Staff"
    description: "Administrative users managing cataloging and circulation."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "Third-party system for processing fines and fees."
  - type: "externalSystem"
    name: "Digital Content Repositories"
    description: "External systems for streaming and downloading digital items."
relationships:
  - source: "Library Patrons"
    destination: "Library Management System"
    description: "Accesses public catalogs and self-service portals"
    technology: "HTTPS/TLS 1.3"
  - source: "Library Staff"
    destination: "Library Management System"
    description: "Manages cataloging and circulation"
    technology: "HTTPS/TLS 1.3"
  - source: "Library Management System"
    destination: "External Payment Gateway"
    description: "Processes financial transactions for fines and fees"
    technology: "mTLS over HTTPS"
  - source: "Library Management System"
    destination: "Digital Content Repositories"
    description: "Handles digital item streaming and downloads"
    technology: "mTLS over HTTPS with OIDC SSO"