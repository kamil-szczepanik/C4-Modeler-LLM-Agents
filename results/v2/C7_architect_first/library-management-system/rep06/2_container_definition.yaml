level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "End-users accessing public catalogs and self-service portals."
  - type: "person"
    name: "Library Staff"
    description: "Administrative users managing cataloging and circulation."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "External system for processing fines and fees."
  - type: "externalSystem"
    name: "Digital Content Repositories"
    description: "External systems for digital content and assets."
  - type: "container"
    name: "Web Application"
    technology: "React/TypeScript, Nginx"
    description: "Client-side rendering and static asset hosting."
  - type: "container"
    name: "API Gateway"
    technology: "Kong or Spring Cloud Gateway"
    description: "API routing, rate limiting, and OAuth2/OIDC token validation."
  - type: "container"
    name: "Core Domain Service"
    technology: "Java/Spring Boot"
    description: "Core business logic, circulation management, and immutable audit logging."
  - type: "container"
    name: "Search Service"
    technology: "Python/FastAPI, Elasticsearch"
    description: "High-performance search to meet the <800ms P99 requirement."
  - type: "container"
    name: "Notification Service"
    technology: "Node.js"
    description: "Asynchronous messaging and zero-loss notifications."
  - type: "container"
    name: "PostgreSQL Database"
    technology: "PostgreSQL"
    description: "Relational operational data store with primary-replica streaming."
  - type: "container"
    name: "RabbitMQ Message Broker"
    technology: "RabbitMQ"
    description: "Asynchronous messaging with quorum queues for zero-loss notifications."
relationships:
  - source: "Library Patrons"
    destination: "Web Application"
    description: "Accesses public catalogs and self-service portals"
    technology: "HTTPS"
  - source: "Library Staff"
    destination: "Web Application"
    description: "Manages cataloging and circulation"
    technology: "HTTPS"
  - source: "Web Application"
    destination: "API Gateway"
    description: "Routes API requests"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "Core Domain Service"
    description: "Forwards core business requests"
    technology: "gRPC with mTLS"
  - source: "API Gateway"
    destination: "Search Service"
    description: "Forwards search queries"
    technology: "gRPC with mTLS"
  - source: "Core Domain Service"
    destination: "PostgreSQL Database"
    description: "Persists operational data"
    technology: "TLS 1.3"
  - source: "Notification Service"
    destination: "RabbitMQ Message Broker"
    description: "Publishes and consumes asynchronous messages"
    technology: "AMQP with TLS 1.3"
  - source: "External Payment Gateway"
    destination: "API Gateway"
    description: "Integrates with external payment and financial workflows"
    technology: "HTTPS"
  - source: "Digital Content Repositories"
    destination: "API Gateway"
    description: "Integrates with digital asset storage"
    technology: "HTTPS"