# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Web Application container"
parentContainer:
  name: "Web Application"
elements:
  # Components within the parent container's boundary
  - type: "component"
    name: "Client-Side SPA"
    technology: "React, TypeScript"
    description: "Renders the user interface for public catalogs, self-service portals, and staff cataloging/circulation management."
  - type: "component"
    name: "Nginx Reverse Proxy"
    technology: "Nginx"
    description: "Handles static asset hosting, secure reverse proxy/BFF pattern, and session management using HttpOnly cookies."
relationships:
  - source: "Client-Side SPA"
    destination: "Nginx Reverse Proxy"
    description: "Routes API requests and serves static assets [HTTPS]"