level: component
scope: "Component diagram for the Core Domain Service container"
parentContainer:
  name: "Core Domain Service"
elements:
  - type: "component"
    name: "Circulation Manager Component"
    technology: "Spring Bean/Service"
    description: "Handles circulation management, loan policies, and business logic."
  - type: "component"
    name: "Catalogue Manager Component"
    technology: "Spring Bean/Service"
    description: "Handles item cataloguing and related inventory operations."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Spring Bean/Data JPA"
    description: "Provides EU-compliant audit logging and writes to a restricted, append-only schema."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Spring Cloud Stream / RabbitMQ Template"
    description: "Publishes domain events like ItemCheckedOut asynchronously."
  - type: "component"
    name: "Security Interceptor Component"
    technology: "Spring Security / gRPC Interceptor"
    description: "Authorizes validated gRPC calls and validates method-level OAuth2/JWT scopes for roles."
  - type: "component"
    name: "PostgreSQL Database"
    technology: "PostgreSQL with dedicated audit schema"
    description: "Stores operational transactional state and isolated, immutable audit logs."
  - type: "component"
    name: "RabbitMQ Message Broker"
    technology: "RabbitMQ with DLQ"
    description: "Handles asynchronous domain event dispatching with circuit breakers and dead-letter queues."
  - type: "component"
    name: "API Gateway"
    technology: "API Gateway"
    description: "External entry point that forwards requests via gRPC with mTLS."
relationships:
  - source: "API Gateway"
    destination: "Security Interceptor Component"
    description: "Forwards requests [gRPC with mTLS]"
  - source: "Security Interceptor Component"
    destination: "Circulation Manager Component"
    description: "Authorizes validated gRPC calls"
  - source: "Security Interceptor Component"
    destination: "Catalogue Manager Component"
    description: "Authorizes validated gRPC calls"
  - source: "Circulation Manager Component"
    destination: "PostgreSQL Database"
    description: "Persists transactional state [JDBC over TLS 1.3]"
  - source: "Catalogue Manager Component"
    destination: "PostgreSQL Database"
    description: "Persists transactional state [JDBC over TLS 1.3]"
  - source: "Audit Logger Component"
    destination: "PostgreSQL Database"
    description: "Writes to a restricted, append-only schema [JDBC over TLS 1.3]"
  - source: "Event Publisher Component"
    destination: "RabbitMQ Message Broker"
    description: "Publishes domain events like ItemCheckedOut [AMQP 0-9-1 over TLS 1.3]"