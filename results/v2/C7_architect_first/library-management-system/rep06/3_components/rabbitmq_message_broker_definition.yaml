level: component
scope: "Component diagram for the RabbitMQ Message Broker container"
parentContainer:
  name: "RabbitMQ Message Broker"
elements:
  - type: "component"
    name: "Exchange Router Component"
    technology: "RabbitMQ Exchange"
    description: "Routes incoming messages to appropriate queues based on routing keys and bindings."
  - type: "component"
    name: "Quorum Queue Component"
    technology: "Quorum Queues (Raft-consensus)"
    description: "Provides zero-loss messaging and robust storage backed by Raft consensus."
  - type: "component"
    name: "Connection Manager Component"
    technology: "AMQP 0-9-1 with TLS 1.3 & mTLS"
    description: "Handles secure client connections and authentication under strict EU data residency constraints."
  - type: "component"
    name: "Management API/UI Component"
    technology: "HTTP/S over Port 15672"
    description: "Exposes management interfaces and exports operational metrics."
  - type: "component"
    name: "Dead Letter Router Component"
    technology: "RabbitMQ DLX"
    description: "Routes undeliverable or failed messages for error handling and analysis."
  - type: "component"
    name: "Policy Enforcement Component"
    technology: "RabbitMQ Policies"
    description: "Enforces security controls, resource guardrails, and priority handling."
  - type: "container"
    name: "Core Domain Service"
    technology: "Microservice"
    description: "Core business domain service interacting with the message broker."
  - type: "container"
    name: "Notification Service"
    technology: "Microservice"
    description: "Service responsible for dispatching notifications."
  - type: "system"
    name: "Monitoring Stack"
    technology: "Prometheus"
    description: "Centralized observability and metrics collection platform."
relationships:
  - source: "Core Domain Service"
    destination: "Connection Manager Component"
    description: "AMQP 0-9-1 with TLS 1.3"
  - source: "Notification Service"
    destination: "Connection Manager Component"
    description: "AMQP 0-9-1 with TLS 1.3"
  - source: "Quorum Queue Component"
    destination: "Dead Letter Router Component"
    description: "AMQP 0-9-1"
  - source: "Management API/UI Component"
    destination: "Monitoring Stack"
    description: "HTTP/S over Port 15672"