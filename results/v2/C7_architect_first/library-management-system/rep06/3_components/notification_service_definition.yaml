level: component
scope: "Component diagram for the Notification Service container"
parentContainer:
  name: "Notification Service"
elements:
  - type: "component"
    name: "AMQP Consumer Component"
    technology: "Node.js, amqplib"
    description: "Consumes event messages from the message broker."
  - type: "component"
    name: "Notification Router Component"
    technology: "Node.js"
    description: "Routes notification payloads and orchestrates the delivery workflow."
  - type: "component"
    name: "Template Engine Component"
    technology: "Nunjucks"
    description: "Renders localized templates for alerts."
  - type: "component"
    name: "Provider Integration Adapters"
    technology: "Node.js, Axios, SendGrid, Twilio"
    description: "Sends payloads to external communication providers."
  - type: "component"
    name: "Outbox Repository Component"
    technology: "Node.js, TypeORM, PostgreSQL"
    description: "Persists delivery status and outbox audit logs."
  - type: "component"
    name: "Preference Cache Component"
    technology: "Node.js, ioredis, Redis"
    description: "Provides low-latency lookups for patron preferences."
relationships:
  - source: "AMQP Consumer Component"
    destination: "RabbitMQ Message Broker"
    description: "Consumes event messages [AMQP 0-9-1 with TLS 1.3]"
  - source: "Notification Router Component"
    destination: "Preference Cache Component"
    description: "Queries patron preferences [In-Memory/TCP]"
  - source: "Notification Router Component"
    destination: "Template Engine Component"
    description: "Renders localized templates [Internal Call]"
  - source: "Notification Router Component"
    destination: "Provider Integration Adapters"
    description: "Sends payload [HTTPS]"
  - source: "Provider Integration Adapters"
    destination: "Outbox Repository Component"
    description: "Persists delivery status [SQL/TCP]"