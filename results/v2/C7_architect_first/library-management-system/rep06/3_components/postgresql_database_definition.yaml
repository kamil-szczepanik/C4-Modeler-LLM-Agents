level: component
scope: "Component diagram for the PostgreSQL Database container"
parentContainer:
  name: "PostgreSQL Database"
elements:
  - type: "component"
    name: "PostgreSQL Storage"
    technology: "PostgreSQL"
    description: "Relational database engine managing ACID transactions"
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Connection pooler preventing resource exhaustion"
  - type: "component"
    name: "Patroni with etcd"
    technology: "Patroni, etcd"
    description: "Consensus-based automated failover manager"
  - type: "component"
    name: "Read-Only Replica Router"
    technology: "Routing Layer"
    description: "Logical routing layer for administrative traffic"
  - type: "component"
    name: "PostgreSQL Read Replica"
    technology: "PostgreSQL"
    description: "Asynchronous replica for reporting workloads"
  - type: "component"
    name: "Prometheus Exporter"
    technology: "Prometheus"
    description: "Metrics sidecar for operational observability"
  - type: "component"
    name: "pgaudit"
    technology: "pgaudit extension"
    description: "Audit logging extension for compliance monitoring"
  - type: "component"
    name: "Volume Mount"
    technology: "LUKS/AES-256"
    description: "Encrypted persistence storage"
relationships:
  - source: "PgBouncer"
    destination: "PostgreSQL Storage"
    description: "SQL queries [TCP/IP over mTLS 1.3]"
  - source: "Read-Only Replica Router"
    destination: "PostgreSQL Read Replica"
    description: "SQL queries [TCP/IP over mTLS 1.3]"
  - source: "PostgreSQL Storage"
    destination: "Volume Mount"
    description: "Encrypted persistence [LUKS/AES-256]"