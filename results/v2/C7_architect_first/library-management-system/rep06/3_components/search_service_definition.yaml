level: component
scope: "Component diagram for the Search Service container"
parentContainer:
  name: "Search Service"
elements:
  - type: "component"
    name: "Search API Controller"
    technology: "FastAPI endpoint"
    description: "Validating JWT claims from gRPC metadata."
  - type: "component"
    name: "Query Pipeline Processor"
    technology: "Python / FastAPI"
    description: "Combines query parsing, facet/filter processing, and the relevance/ranking engine."
  - type: "component"
    name: "Search Repository"
    technology: "elasticsearch-py"
    description: "Executing queries against Elasticsearch."
  - type: "component"
    name: "Index Synchronizer"
    technology: "Python / FastAPI"
    description: "Consumes domain events from RabbitMQ to maintain index freshness."
  - type: "component"
    name: "Caching Layer"
    technology: "Redis"
    description: "In-memory Redis cache with role-based cache key segregation."
  - type: "component"
    name: "API Gateway"
    technology: "Kong or Spring Cloud Gateway"
    description: "Forwarding requests via gRPC with mTLS."
  - type: "component"
    name: "RabbitMQ Message Broker"
    technology: "RabbitMQ"
    description: "Message broker with AMQP protocol, TLS/SASL, and a dead-letter queue (DLQ)."
  - type: "component"
    name: "Elasticsearch Cluster"
    technology: "Elasticsearch"
    description: "Dedicated data nodes with NVMe storage in an EU-only Kubernetes cluster."
relationships:
  - source: "API Gateway"
    destination: "Search API Controller"
    description: "gRPC with mTLS"
  - source: "Search API Controller"
    destination: "Query Pipeline Processor"
    description: "In-process"
  - source: "Query Pipeline Processor"
    destination: "Search Repository"
    description: "In-process / AsyncIO"
  - source: "Index Synchronizer"
    destination: "Search Repository"
    description: "In-process / AsyncIO"
  - source: "RabbitMQ Message Broker"
    destination: "Index Synchronizer"
    description: "AMQP with TLS/SASL"
  - source: "Search Repository"
    destination: "Elasticsearch Cluster"
    description: "Transport Layer Security with RBAC"