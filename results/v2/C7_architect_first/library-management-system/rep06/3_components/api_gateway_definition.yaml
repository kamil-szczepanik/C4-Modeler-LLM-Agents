level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing Engine (Kong Proxy)"
    technology: "Kong API Gateway, DB-less Kubernetes Mode"
    description: "Handles API versioning, priority routing for Library Staff, and downstream traffic direction."
  - type: "component"
    name: "Authentication Filter"
    technology: "Kong OIDC Plugin, Local JWT/OIDC"
    description: "Performs local JWT/OIDC token validation at the edge."
  - type: "component"
    name: "Rate Limiting & Circuit Breaker"
    technology: "Kong Plugin Ecosystem"
    description: "Protects downstream services and enforces throttling on search/auth endpoints."
  - type: "component"
    name: "Security & Telemetry Enforcers"
    technology: "OpenTelemetry, Prometheus"
    description: "Injects security headers, sanitizes inputs, and emits OpenTelemetry/Prometheus metrics."
relationships:
  - source: "Web Application"
    destination: "Routing Engine (Kong Proxy)"
    description: "Forwards versioned client requests [HTTPS/REST using TLS 1.3]"
  - source: "Routing Engine (Kong Proxy)"
    destination: "Core Domain Service"
    description: "Proxies validated traffic [gRPC with mTLS]"
  - source: "Routing Engine (Kong Proxy)"
    destination: "Search Service"
    description: "Proxies validated traffic [gRPC with mTLS]"
  - source: "Routing Engine (Kong Proxy)"
    destination: "Telemetry Exporter"
    description: "Emits distributed traces and Prometheus metrics [Internal]"