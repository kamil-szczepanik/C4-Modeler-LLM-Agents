# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Ingress Listener"
    technology: "Kong Proxy"
    description: "Handles incoming HTTP/HTTPS traffic from the Web Application SPA and routes it appropriately."
  - type: "component"
    name: "Security & Auth Plugin"
    technology: "Kong Plugin / Coraza WAF"
    description: "Enforces JWT/OIDC authentication, mTLS, and web application firewall security rules."
  - type: "component"
    name: "Rate-Limiting & Quota Component"
    technology: "Kong Rate Limiting / Redis"
    description: "Manages sliding-window rate-limiting using a high-availability Redis cluster."
  - type: "component"
    name: "Routing & Upstream Balancer"
    technology: "Kong Upstream Balancer"
    description: "Routes core business and search requests to downstream microservices via gRPC over mTLS."
  - type: "component"
    name: "Transform & Error Mapping Component"
    technology: "Kong Transform Plugin"
    description: "Transforms request/response payloads and maps error codes for consistent API responses."
  - type: "component"
    name: "Telemetry Exporter"
    technology: "OpenTelemetry (OTLP)"
    description: "Forwards access logs and metrics to the Centralized Observability Platform."
relationships:
  - source: "Ingress Listener"
    destination: "Security & Auth Plugin"
    description: "Passes incoming requests for authentication and security inspection"
  - source: "Security & Auth Plugin"
    destination: "Rate-Limiting & Quota Component"
    description: "Checks rate limits for authenticated requests"
  - source: "Rate-Limiting & Quota Component"
    destination: "Transform & Error Mapping Component"
    description: "Forwards valid requests for payload transformation"
  - source: "Transform & Error Mapping Component"
    destination: "Routing & Upstream Balancer"
    description: "Dispatches processed requests to upstream services"
  - source: "Routing & Upstream Balancer"
    destination: "Telemetry Exporter"
    description: "Emits request metrics and access logs"