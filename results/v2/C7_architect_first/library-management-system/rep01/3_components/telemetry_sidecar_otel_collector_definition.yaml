level: component
scope: "Component diagram for the Telemetry Sidecar / OTEL Collector container"
parentContainer:
  name: "Telemetry Sidecar / OTEL Collector"
elements:
  - type: "component"
    name: "Receivers Component"
    technology: "OpenTelemetry Receiver Modules"
    description: "Ingests telemetry from internal microservices using Kubernetes service account tokens via OTLP/gRPC."
  - type: "component"
    name: "Processors Component"
    technology: "OTEL Processor Pipeline & Regex-based PII Scrubbing"
    description: "Sanitizes application telemetry and scrubs PII for GDPR compliance."
  - type: "component"
    name: "Memory Limiter & Sampler Component"
    technology: "OpenTelemetry Collector Contrib"
    description: "Manages memory utilization and sampling to preserve necessary metrics for SLAs."
  - type: "component"
    name: "Exporters Component"
    technology: "OTEL Exporter Modules"
    description: "Forwards processed telemetry to the Centralized Observability Platform via TLS 1.3 / mTLS and OTLP/gRPC."
  - type: "component"
    name: "Persistent Queueing Extension"
    technology: "Persistent File Storage Extension with Encryption at Rest"
    description: "Handles backpressure and queueing with encryption at rest."
  - type: "component"
    name: "Prometheus Self-Monitoring Endpoint"
    technology: "Prometheus"
    description: "Provides self-monitoring metrics for the collector."
relationships:
  - source: "Core Domain Service"
    destination: "Receivers Component"
    description: "Pushes telemetry via OTLP/gRPC"
  - source: "Search Service"
    destination: "Receivers Component"
    description: "Pushes telemetry via OTLP/gRPC"
  - source: "Async Worker"
    destination: "Receivers Component"
    description: "Pushes telemetry via OTLP/gRPC"
  - source: "Receivers Component"
    destination: "Processors Component"
    description: "Passes raw telemetry for sanitization"
  - source: "Processors Component"
    destination: "Memory Limiter & Sampler Component"
    description: "Passes processed telemetry for limiting and sampling"
  - source: "Memory Limiter & Sampler Component"
    destination: "Persistent Queueing Extension"
    description: "Buffers telemetry during backpressure"
  - source: "Memory Limiter & Sampler Component"
    destination: "Exporters Component"
    description: "Sends telemetry for export"
  - source: "Persistent Queueing Extension"
    destination: "Exporters Component"
    description: "Replays queued telemetry to exporters"
  - source: "Exporters Component"
    destination: "Centralized Observability Platform"
    description: "Forwards processed telemetry via TLS 1.3 / mTLS and OTLP/gRPC"