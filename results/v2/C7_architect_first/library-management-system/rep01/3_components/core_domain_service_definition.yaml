level: component
scope: "Component diagram for the Core Domain Service container"
parentContainer:
  name: "Core Domain Service"
elements:
  - type: "component"
    name: "Circulation Controller"
    technology: "NestJS Controller (Node.js, REST/gRPC)"
    description: "Handling REST/gRPC endpoints, JWT validation, and RBAC."
  - type: "component"
    name: "Catalog Management Module"
    technology: "NestJS Module (Node.js)"
    description: "Managing item metadata, availability rules, and R-01 cataloguing."
  - type: "component"
    name: "Domain Event Publisher"
    technology: "NestJS Service (Node.js)"
    description: "Emitting encrypted AMQP events with W3C Trace Context."
  - type: "component"
    name: "Repository Adapters"
    technology: "TypeORM / Prisma (TypeScript)"
    description: "TypeORM/Prisma components with circuit breakers and RLS."
relationships:
  - source: "API Gateway"
    destination: "Circulation Controller"
    description: "Routes requests [gRPC over mTLS]."
  - source: "Circulation Controller"
    destination: "Catalog Management Module"
    description: "Coordinates item availability [TypeScript Method Calls]."
  - source: "Circulation Controller"
    destination: "Repository Adapters"
    description: "Executes persistence operations [TLS-encrypted TCP with fail-closed circuit breakers]."
  - source: "Catalog Management Module"
    destination: "Repository Adapters"
    description: "Executes persistence operations [TLS-encrypted TCP with fail-closed circuit breakers]."
  - source: "Domain Event Publisher"
    destination: "RabbitMQ"
    description: "Dispatches audit and domain events [AMQP over TLS with AES-GCM encryption and W3C headers]."