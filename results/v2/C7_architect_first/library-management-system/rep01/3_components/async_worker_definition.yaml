level: component
scope: "Component diagram for the Async Worker container"
parentContainer:
  name: "Async Worker"
elements:
  - type: "component"
    name: "Task Dispatcher Receiver"
    technology: "Python / Celery (AMQP)"
    description: "Consumes messages via AMQP."
  - type: "component"
    name: "Celery Task Router Component"
    technology: "Python / Celery"
    description: "Validates AMQP signatures, enforces JSON serialization, and routes tasks."
  - type: "component"
    name: "DLQ Handler Component"
    technology: "Python / Celery"
    description: "Captures failed tasks and sanitizes PII payloads."
  - type: "component"
    name: "Sync Orchestrator Component"
    technology: "Python / Celery"
    description: "Manages National Library Database synchronization."
  - type: "component"
    name: "Notification Processor Component"
    technology: "Python / Celery"
    description: "Handles multi-language patron alerts."
  - type: "component"
    name: "Notification Templates Component"
    technology: "Python / Celery"
    description: "Manages localized messaging policies."
  - type: "component"
    name: "Core Domain Service"
    technology: "Microservice"
    description: "Core domain service providing system triggers."
  - type: "component"
    name: "National Library Database"
    technology: "External Database"
    description: "External national library database for synchronization."
  - type: "component"
    name: "Telemetry Sidecar / OTEL Collector"
    technology: "OpenTelemetry"
    description: "Collects distributed telemetry and traces."
relationships:
  - source: "Core Domain Service"
    destination: "Task Dispatcher Receiver"
    description: "AMQP over TLS with RabbitMQ"
  - source: "Task Dispatcher Receiver"
    destination: "Celery Task Router Component"
    description: "In-memory function call"
  - source: "Celery Task Router Component"
    destination: "DLQ Handler Component"
    description: "In-memory on failure"
  - source: "Sync Orchestrator Component"
    destination: "National Library Database"
    description: "HTTPS/REST with TLS 1.3"
  - source: "Async Worker"
    destination: "Telemetry Sidecar / OTEL Collector"
    description: "OpenTelemetry context propagation"