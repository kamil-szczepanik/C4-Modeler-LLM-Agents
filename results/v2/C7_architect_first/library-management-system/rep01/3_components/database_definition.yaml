level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Database Primary"
    technology: "PostgreSQL"
    description: "Manages transactional state with multi-AZ replication in the EU."
  - type: "component"
    name: "Database Read Replica"
    technology: "PostgreSQL Read Replica"
    description: "Isolates heavy reporting queries from transactional workloads."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Handles connection pooling to prevent connection exhaustion."
  - type: "component"
    name: "Catalog Schema"
    technology: "PostgreSQL Schema"
    description: "Stores metadata for physical and digital items."
  - type: "component"
    name: "Circulation Schema"
    technology: "PostgreSQL Schema"
    description: "Manages patron accounts, loans, and reservations."
  - type: "component"
    name: "Audit & Logging Schema"
    technology: "PostgreSQL Schema"
    description: "Captures transactional state changes for observability."
relationships:
  - source: "Core Domain Service"
    destination: "Database Primary"
    description: "Reads and writes transactional data via TLS-encrypted TCP."
  - source: "Core Domain Service"
    destination: "Database Read Replica"
    description: "Routes heavy analytics and reporting queries via SQL over TLS-encrypted TCP."
  - source: "Database Primary"
    destination: "Database Read Replica"
    description: "Synchronizes transactional data via Streaming Replication over TLS-encrypted TCP."
  - source: "Search Service"
    destination: "Database Primary"
    description: "Replicates catalog changes via Change Data Capture using Debezium over TLS-encrypted TCP."
  - source: "Async Worker"
    destination: "Database Primary"
    description: "Polls and writes background job states via SQL over TLS-encrypted TCP."