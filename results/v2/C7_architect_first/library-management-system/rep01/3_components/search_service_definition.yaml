level: component
scope: "Component diagram for the Search Service container"
parentContainer:
  name: "Search Service"
elements:
  - type: "component"
    name: "Search REST/gRPC Controller"
    technology: "Java / Spring Boot"
    description: "Exposes search endpoints and handles incoming search requests."
  - type: "component"
    name: "Query Builder Component"
    technology: "Java"
    description: "Processes sanitized requests and user roles, and constructs DSL queries."
  - type: "component"
    name: "Faceting & Suggestion Engine"
    technology: "Java"
    description: "Processes aggregations, faceting, and spellcheck suggestions."
  - type: "component"
    name: "Elasticsearch Client Adapter"
    technology: "Java / High-Level REST Client"
    description: "Executes queries and indexing operations against the search engine cluster."
  - type: "component"
    name: "Index Synchronization Consumer"
    technology: "Java / Kafka Consumer"
    description: "Consumes Kafka domain events to asynchronously update index data."
  - type: "component"
    name: "Search Engine Cluster"
    technology: "Elasticsearch, EU-hosted"
    description: "Provides high-performance full-text search, native faceting, and suggestion capabilities."
relationships:
  - source: "API Gateway"
    destination: "Search REST/gRPC Controller"
    description: "Forwards search requests [gRPC over mTLS]"
  - source: "Search REST/gRPC Controller"
    destination: "Query Builder Component"
    description: "Passes sanitized requests and user roles [In-process Java method calls]"
  - source: "Query Builder Component"
    destination: "Faceting & Suggestion Engine"
    description: "Processes aggregations and spellcheck [In-process Java method calls]"
  - source: "Query Builder Component"
    destination: "Elasticsearch Client Adapter"
    description: "Passes constructed DSL queries [In-process Java method calls]"
  - source: "Elasticsearch Client Adapter"
    destination: "Search Engine Cluster"
    description: "Executes queries/indexing [HTTP/Bolt over TCP with TLS v1.3]"
  - source: "Index Synchronization Consumer"
    destination: "Search Engine Cluster"
    description: "Updates index data [Kafka domain events]"