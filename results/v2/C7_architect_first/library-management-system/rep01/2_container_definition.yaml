level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons & Staff"
    description: "End-users accessing physical and digital item cataloging, circulation management, and self-service portals."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Identity Provider system for authentication and authorization."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment gateway for handling transactions."
  - type: "externalSystem"
    name: "National Library Database"
    description: "External national library database for catalog synchronization."
  - type: "externalSystem"
    name: "Centralized Observability Platform"
    description: "Platform for collecting system telemetry and logs."
  - type: "container"
    name: "Web Application (SPA)"
    technology: "React"
    description: "Powers the frontend SPA for fast patron and staff self-service."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx / Kong"
    description: "Acts as API Gateway for ingress, rate-limiting, and JWT validation."
  - type: "container"
    name: "Core Domain Service"
    technology: "Node.js / NestJS"
    description: "Implements the Core Domain Service for circulation and catalog logic."
  - type: "container"
    name: "Search Service"
    technology: "Java / Elasticsearch"
    description: "Powers the dedicated Search Service to guarantee sub-800ms query performance."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL"
    description: "Stores transactional data with multi-AZ replication in the EU."
  - type: "container"
    name: "Async Worker"
    technology: "Python / Celery"
    description: "Manages asynchronous background tasks and external integrations."
  - type: "container"
    name: "Telemetry Sidecar / OTEL Collector"
    technology: "OpenTelemetry"
    description: "Collects and forwards telemetry data to centralized observability."
relationships:
  - source: "Library Patrons & Staff"
    destination: "Web Application (SPA)"
    description: "Interacts with self-service portals and administrative workflows"
    technology: "HTTPS/REST with TLS 1.3"
  - source: "Web Application (SPA)"
    destination: "API Gateway"
    description: "Sends API requests to the backend"
    technology: "HTTPS/REST with TLS 1.3"
  - source: "API Gateway"
    destination: "Core Domain Service"
    description: "Routes core business requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Search Service"
    description: "Routes search queries"
    technology: "gRPC over mTLS"
  - source: "Core Domain Service"
    destination: "Database"
    description: "Reads and writes transactional data"
    technology: "TLS-encrypted TCP"
  - source: "Core Domain Service"
    destination: "Async Worker"
    description: "Dispatches background tasks"
    technology: "AMQP over TLS with RabbitMQ"
  - source: "Containers"
    destination: "Centralized Observability Platform"
    description: "Sends telemetry and metrics"
    technology: "OTEL Protocol via Telemetry Sidecar / OTEL Collector"