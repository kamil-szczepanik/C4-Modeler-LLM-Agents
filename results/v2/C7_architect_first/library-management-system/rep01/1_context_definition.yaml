level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A cloud-native platform designed for public and academic libraries to catalogue physical and digital items, manage circulation, and provide self-service portals with strict EU-only data residency."
elements:
  - type: "person"
    name: "Library Patrons & Staff"
    description: "End-users accessing self-service portals and administrative workflows."
  - type: "externalSystem"
    name: "CDN / Edge Layer"
    description: "Cloudflare or AWS CloudFront with EU-only POPs providing edge routing and caching."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Keycloak or Auth0 EU instance supporting OIDC and MFA."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "EU-compliant vendor for processing fines and fees."
  - type: "externalSystem"
    name: "National Library Database"
    description: "EU-compliant source for bibliographic data imports."
  - type: "externalSystem"
    name: "Centralized Observability Platform"
    description: "APM and distributed tracing system."
relationships:
  - source: "Library Patrons & Staff"
    destination: "CDN / Edge Layer"
    description: "Accesses self-service portals and admin workflows"
    technology: "HTTPS (TLS 1.3)"
  - source: "CDN / Edge Layer"
    destination: "Library Management System"
    description: "Routes client requests to the core platform"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "Identity Provider"
    description: "Authenticates users and manages sessions"
    technology: "OIDC"
  - source: "Library Management System"
    destination: "External Payment Gateway"
    description: "Processes library fines and fees"
    technology: "HTTPS/REST (EU endpoints via DPAs)"
  - source: "Library Management System"
    destination: "National Library Database"
    description: "Imports bibliographic data"
    technology: "HTTPS/REST (EU endpoints via DPAs)"