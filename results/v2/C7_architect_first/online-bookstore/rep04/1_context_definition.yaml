level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "An Amazon-style global e-commerce platform for physical and electronic books with recommendations and reviews, designed for 1M MAU across multiple geographic regions with high availability and strict privacy compliance."
elements:
  - type: "person"
    name: "Customer"
    description: "End-user who browses books, purchases items via shopping cart/checkout, views recommendations, and leaves reviews."
  - type: "person"
    name: "Inventory Manager"
    description: "Staff member responsible for managing product catalog and inventory levels."
  - type: "person"
    name: "Customer Support Representative"
    description: "Staff member who manages orders and moderation using HTTPS with MFA/RBAC."
  - type: "externalSystem"
    name: "AWS Cognito"
    description: "Identity Provider handling OIDC/OAuth 2.0 authentication and GDPR/CCPA consent."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system (Stripe/PayPal) handling transaction authorizations with PCI-DSS scope isolation."
  - type: "externalSystem"
    name: "Shipping APIs"
    description: "External logistics services (FedEx/UPS) coordinating shipping and fulfillment via REST/TLS with circuit breakers."
  - type: "externalSystem"
    name: "Notification Service"
    description: "AWS SES providing communication and notification capabilities."
  - type: "externalSystem"
    name: "Publisher Partner Systems"
    description: "Supply chain systems providing inventory feeds via SFTP/REST with IP allowlisting."
relationships:
  - source: "Customer"
    destination: "Online Bookstore System"
    description: "Browses and purchases items"
    technology: "HTTPS/TLS 1.3"
  - type: "Inventory Manager"
    destination: "Online Bookstore System"
    description: "Manages catalog and inventory"
    technology: "HTTPS"
  - type: "Customer Support Representative"
    destination: "Online Bookstore System"
    description: "Manages orders and moderation"
    technology: "HTTPS with MFA/RBAC"
  - type: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Authorizes transactions"
    technology: "REST/TLS"
  - type: "Online Bookstore System"
    destination: "Shipping APIs"
    description: "Coordinates logistics"
    technology: "REST/TLS with circuit breakers"
  - type: "Online Bookstore System"
    destination: "AWS Cognito"
    description: "Validates tokens and manages authentication"
    technology: "OIDC/HTTPS"
  - type: "Publisher Partner Systems"
    destination: "Online Bookstore System"
    description: "Syncs catalog and inventory feeds"
    technology: "SFTP/HTTPS"