level: component
scope: "Component diagram for the Single-Page Application (SPA) container"
parentContainer:
  name: "Single-Page Application (SPA)"
elements:
  - type: "component"
    name: "Routing & Shell Component"
    technology: "React Router, React lazy, Suspense"
    description: "Handles client-side routing, code splitting, and application shell rendering."
  - type: "component"
    name: "Catalog & Search Component"
    technology: "React, local caching"
    description: "Provides catalog browsing, search capabilities, and local caching with accessibility features."
  - type: "component"
    name: "Cart & Checkout Component"
    technology: "Zustand, React Context"
    description: "Manages shopping cart state, transient UI states, and multi-currency checkouts."
  - type: "component"
    name: "Recommendations & Reviews Component"
    technology: "React UI modules"
    description: "Displays product recommendations and user reviews."
  - type: "component"
    name: "Auth & Profile Component"
    technology: "AWS Cognito integration"
    description: "Manages user authentication, role-based access control, and secure session tokens."
  - type: "component"
    name: "Centralized API Client Module"
    technology: "Fetch-based with interceptors"
    description: "Handles secure HTTP communication and request/response interceptors for backend APIs."
  - type: "component"
    name: "CloudFront Functions / Lambda@Edge"
    technology: "AWS Edge Computing"
    description: "Executes edge computing tasks for content delivery and request processing."
