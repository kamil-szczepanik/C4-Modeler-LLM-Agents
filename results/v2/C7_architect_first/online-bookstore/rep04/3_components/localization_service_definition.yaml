level: component
scope: "Component diagram for the Localization Service container"
parentContainer:
  name: "Localization Service"
elements:
  - type: "component"
    name: "Translation Controller"
    technology: "Node.js, Express, @grpc/grpc-js"
    description: "Handles incoming gRPC requests from the API Gateway and routes them for translation and localization processing."
  - type: "component"
    name: "Translation Engine Component"
    technology: "i18next, Node.js"
    description: "Manages multi-region translation bundles and text localization."
  - type: "component"
    name: "Currency Conversion Component"
    technology: "Node.js, Background Sync Worker"
    description: "Handles currency conversion and syncs rates using external financial APIs and credentials from AWS Secrets Manager."
  - type: "component"
    name: "Geo-Resolution Component"
    technology: "Node.js"
    description: "Resolves geographic location data to provide region-specific localization."
  - type: "component"
    name: "Localization Data Access Layer"
    technology: "Node.js, PostgreSQL Driver, Redis Client"
    description: "Manages data reads and writes for translation bundles, currency rates, and persistent locale metadata."
relationships:
  - source: "Translation Controller"
    destination: "Translation Engine Component"
    description: "Delegates translation requests"
  - source: "Translation Controller"
    destination: "Currency Conversion Component"
    description: "Delegates currency conversion requests"
  - source: "Translation Controller"
    destination: "Geo-Resolution Component"
    description: "Delegates geo-resolution requests"
  - source: "Translation Engine Component"
    destination: "Localization Data Access Layer"
    description: "Reads and writes translation bundles"
  - source: "Currency Conversion Component"
    destination: "Localization Data Access Layer"
    description: "Reads and writes currency rates"
  - source: "Currency Conversion Component"
    destination: "AWS Secrets Manager"
    description: "Fetches credentials for external financial APIs via TLS 1.3"
  - source: "Localization Data Access Layer"
    destination: "Amazon ElastiCache (Redis)"
    description: "Reads/writes translation bundles and currency rates via TCP/6379 with TLS"
  - source: "Localization Data Access Layer"
    destination: "Amazon Aurora PostgreSQL"
    description: "Connects for persistent locale metadata via TCP/5432 with TLS"
  - source: "Translation Controller"
    destination: "Amazon API Gateway"
    description: "Receives gRPC over HTTP/2 with mTLS requests"
  - source: "Translation Controller"
    destination: "AWS CloudWatch and CloudWatch Logs"
    description: "Emits Prometheus metrics and audit logs"