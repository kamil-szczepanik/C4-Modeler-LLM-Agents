level: component
scope: "Component diagram for the Amazon ElastiCache container"
parentContainer:
  name: "Amazon ElastiCache"
elements:
  - type: "component"
    name: "Session Store Component"
    technology: "Redis Engine (v6/v7)"
    description: "Manages active user carts and sessions for 1 million monthly active users."
  - type: "component"
    name: "Product Catalog Cache Component"
    technology: "Redis Engine (v6/v7)"
    description: "Caches book details and search aggregations to support sub-2-second page loads."
  - type: "component"
    name: "Recommendation Cache Component"
    technology: "Redis Engine (v6/v7)"
    description: "Stores pre-computed recommendation vectors for fast retrieval."
relationships:
  - source: "Catalog & Search Service"
    destination: "Product Catalog Cache Component"
    description: "Retrieves book details and search aggregations via TCP (RESP protocol)"
  - source: "Order & Checkout Service"
    destination: "Session Store Component"
    description: "Reads and writes active user carts and session data via TCP (RESP protocol)"
  - source: "Recommendation Service"
    destination: "Recommendation Cache Component"
    description: "Fetches pre-computed recommendation vectors via TCP (RESP protocol)"
  - source: "Localization Service"
    destination: "Session Store Component"
    description: "Accesses user localization context and session preferences via TCP (RESP protocol)"
  - source: "Amazon ElastiCache"
    destination: "AWS Secrets Manager"
    description: "Performs automated auth token rotation via HTTPS"
  - source: "Amazon ElastiCache"
    destination: "Amazon CloudWatch"
    description: "Sends metric telemetry and alarm monitoring via AWS internal APIs"