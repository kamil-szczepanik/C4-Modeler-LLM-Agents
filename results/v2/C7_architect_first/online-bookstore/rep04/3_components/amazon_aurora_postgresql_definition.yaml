level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL container"
parentContainer:
  name: "Amazon Aurora PostgreSQL"
elements:
  - type: "component"
    name: "Connection Pooler Component (PgBouncer/AWS RDS Proxy)"
    technology: "PgBouncer / AWS RDS Proxy"
    description: "Manages dynamic microservice connection limits."
  - type: "component"
    name: "Catalog & Localization Schema Component"
    technology: "PostgreSQL Schema"
    description: "Stores book metadata and localization data."
  - type: "component"
    name: "Order & Transaction Schema Component"
    technology: "PostgreSQL Schema"
    description: "Handles ACID transactions for orders and checkout."
  - type: "component"
    name: "Aurora Global Database Storage Engine Component"
    technology: "Amazon Aurora PostgreSQL Global Database"
    description: "Provides global replication, high availability, and storage."
  - type: "component"
    name: "Read-Replica Routing Component"
    technology: "PostgreSQL Read-Replicas"
    description: "Directs read queries to local regional replicas."
  - type: "component"
    name: "Materialized View / Indexing Component"
    technology: "PostgreSQL Views and Indexes"
    description: "Optimizes query performance for low-latency retrieval."
relationships:
  - source: "Order & Checkout Service"
    destination: "Order & Transaction Schema Component"
    description: "Executes ACID transactions [TCP/TLS via Proxy]"
  - source: "Catalog & Search Service"
    destination: "Read-Replica Routing Component"
    description: "Directs read queries to local regional replicas [TCP/TLS via Proxy]"
  - source: "Catalog & Search Service"
    destination: "Catalog & Localization Schema Component"
    description: "Queries book metadata [TCP/TLS via Proxy]"