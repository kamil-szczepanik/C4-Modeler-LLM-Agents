level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "Recommendation API Controller"
    technology: "Python / FastAPI"
    description: "Handles asynchronous API routing, schema validation, and real-time personalized suggestion requests."
  - type: "component"
    name: "Model Inference Engine"
    technology: "Python / PyTorch"
    description: "Executes lightweight collaborative filtering and machine learning model inference."
  - type: "component"
    name: "Recommendation Cache Manager"
    technology: "Python / redis-py"
    description: "Manages caching operations using a cache-aside pattern for sub-50ms responses."
  - type: "component"
    name: "Feature Store Client"
    technology: "Python / boto3"
    description: "Fetches user purchase history and book metadata from DynamoDB."
  - type: "component"
    name: "Cache Warm-up Worker"
    technology: "Python / Asyncio / Celery"
    description: "Precomputes and warms up recommendation caches asynchronously."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache (Redis)"
    description: "Provides sub-50ms caching for precomputed recommendations via RESP over TCP."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Scalable NoSQL storage for user purchase history and book metadata."
  - type: "component"
    name: "Amazon SQS (Dead-Letter Queues)"
    technology: "Amazon SQS"
    description: "Handles message queuing and dead-letter queues for background worker tasks."
relationships:
  - source: "Recommendation API Controller"
    destination: "Recommendation Cache Manager"
    description: "In-process call"
  - source: "Recommendation Cache Manager"
    destination: "Amazon ElastiCache (Redis)"
    description: "RESP over TCP, Cache-aside pattern"
  - source: "Recommendation API Controller"
    destination: "Model Inference Engine"
    description: "In-memory function call"
  - source: "Model Inference Engine"
    destination: "Feature Store Client"
    description: "gRPC"
  - source: "Feature Store Client"
    destination: "Amazon DynamoDB"
    description: "HTTPS/AWS SDK"
  - source: "Cache Warm-up Worker"
    destination: "Model Inference Engine"
    description: "In-memory call"
  - source: "Cache Warm-up Worker"
    destination: "Amazon SQS (Dead-Letter Queues)"
    description: "AMQP/AWS SDK"