level: component
scope: "Component diagram for the Review Moderation Container container"
parentContainer:
  name: "Review Moderation Container"
elements:
  - type: "component"
    name: "Moderation API Controller"
    technology: "Node.js/Express, Amazon ECS on AWS Fargate"
    description: "Handles incoming review moderation API requests."
  - type: "component"
    name: "Moderation Queue Consumer"
    technology: "Node.js/Express, Amazon ECS on AWS Fargate"
    description: "Consumes messages from the ingestion queue for asynchronous processing."
  - type: "component"
    name: "Auto-Moderator Engine"
    technology: "Node.js/Express, Amazon ECS on AWS Fargate"
    description: "Performs automated filtering and moderation of user-submitted reviews."
  - type: "component"
    name: "Moderator Dashboard Service"
    technology: "Node.js/Express, Amazon ECS on AWS Fargate"
    description: "Provides human-in-the-loop review moderation capabilities."
  - type: "component"
    name: "Moderation Data Access Layer"
    technology: "Node.js/Express, Amazon ECS on AWS Fargate"
    description: "Manages data persistence and retrieval for moderation workflows."
  - type: "component"
    name: "Amazon API Gateway"
    technology: "AWS API Gateway"
    description: "External entry point routing traffic to the Moderation API Controller."
  - type: "component"
    name: "Amazon SQS"
    technology: "AWS SQS"
    description: "Message queue for asynchronous decoupling and protection against NLP processing traffic spikes."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Relational database with AWS KMS encryption for secure review state and audit log persistence."
  - type: "component"
    name: "Amazon SNS"
    technology: "Amazon SNS"
    description: "Notification service for event broadcasting."
relationships:
  - source: "Amazon API Gateway"
    destination: "Moderation API Controller"
    description: "gRPC over HTTP/2 via mTLS"
  - source: "Moderation API Controller"
    destination: "Amazon SQS"
    description: "HTTPS/AWS SDK"
  - source: "Moderation Queue Consumer"
    destination: "Auto-Moderator Engine"
    description: "In-process"
  - source: "Moderator Dashboard Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "TCP/PostgreSQL wire protocol via TLS 1.3"
  - source: "Review Moderation Container"
    destination: "Amazon SNS"
    description: "Amazon SNS/SQS"