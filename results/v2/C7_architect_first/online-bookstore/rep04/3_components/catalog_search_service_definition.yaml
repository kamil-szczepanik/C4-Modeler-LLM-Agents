level: component
scope: "Component diagram for the Catalog & Search Service container"
parentContainer:
  name: "Catalog & Search Service"
elements:
  - type: "component"
    name: "Search Controller"
    technology: "Node.js/Express"
    description: "Handles routing and invokes search queries or fetches product details."
  - type: "component"
    name: "Search Engine Client"
    technology: "TypeScript"
    description: "Executes full-text search against Amazon OpenSearch."
  - type: "component"
    name: "Product Repository"
    technology: "TypeScript/Prisma"
    description: "Reads and writes product data to Amazon Aurora PostgreSQL."
  - type: "component"
    name: "Cache Manager"
    technology: "ioredis"
    description: "Manages resilient caching layers via Amazon ElastiCache (Redis)."
  - type: "component"
    name: "Catalog Sync Worker"
    technology: "Node.js/BullMQ"
    description: "Processes asynchronous background jobs to update the search index."
  - type: "component"
    name: "Amazon OpenSearch Service"
    technology: "Amazon OpenSearch"
    description: "Provides sub-second full-text search and synonyms."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Provides ACID-compliant relational product metadata."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache"
    description: "Deployed for sub-2s hot-cache performance."
  - type: "component"
    name: "Amazon SQS/SNS"
    technology: "AWS SQS/SNS"
    description: "Pushes catalog events to the worker."
relationships:
  - source: "Search Controller"
    destination: "Search Engine Client"
    description: "Invokes search queries [In-process / Function Call]"
  - source: "Search Controller"
    destination: "Product Repository"
    description: "Fetches product details [In-process / Function Call]"
  - source: "Search Engine Client"
    destination: "Amazon OpenSearch Service"
    description: "Executes full-text search [HTTPS / AWS SigV4]"
  - source: "Product Repository"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads/Writes product data [TCP/PostgreSQL wire protocol]"
  - source: "Amazon SQS/SNS"
    destination: "Catalog Sync Worker"
    description: "Pushes catalog events [HTTPS / SQS Polling]"
  - source: "Catalog Sync Worker"
    destination: "Amazon OpenSearch Service"
    description: "Updates search index [HTTPS / AWS SigV4]"