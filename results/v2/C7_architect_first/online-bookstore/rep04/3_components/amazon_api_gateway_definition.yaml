level: component
scope: "Component diagram for the Amazon API Gateway container"
parentContainer:
  name: "Amazon API Gateway"
elements:
  - type: "component"
    name: "Routing & Regional Edge Component"
    technology: "AWS Regional API Gateway, CloudFront, AWS WAF, AWS Shield"
    description: "Manages global ingress, edge routing, and mTLS termination across AWS infrastructure."
  - type: "component"
    name: "Authentication & Authorization Component"
    technology: "AWS Lambda Authorizer, Amazon Cognito"
    description: "Handles custom token authorization, identity management, and OIDC-compliant JWT generation."
  - type: "component"
    name: "Rate Limiting & Throttling Component"
    technology: "API Gateway Usage Plans, Token Bucket"
    description: "Enforces rate limiting and throttling policies to protect backend microservices."
  - type: "component"
    name: "Request/Response Transformation Component"
    technology: "VTL, AWS Lambda mappers"
    description: "Executes request validation and payload transformations."
  - type: "component"
    name: "API Versioning & Routing Component"
    technology: "Path/header-based routing engine"
    description: "Directs traffic using path or header-based routing rules to backend services."
  - type: "component"
    name: "Monetization & Usage Analytics Component"
    technology: "AWS CloudWatch, Amazon Kinesis Data Firehose"
    description: "Captures sanitized monetization metrics and operational telemetry."
  - type: "component"
    name: "SPA"
    technology: "Single-Page Application"
    description: "Client application interacting with the global API Gateway."
  - type: "component"
    name: "Amazon Cognito"
    technology: "Amazon Cognito"
    description: "External or integrated identity provider for authentication."
  - type: "component"
    name: "Catalog & Order ECS Containers"
    technology: "ECS Containers"
    description: "Backend microservices handling catalog and order processing."
  - type: "component"
    name: "Amazon Kinesis"
    technology: "Amazon Kinesis"
    description: "Data streaming service for async analytics ingestion."
relationships:
  - source: "SPA"
    destination: "Routing & Regional Edge Component"
    description: "HTTPS / JSON"
  - source: "Authentication & Authorization Component"
    destination: "Amazon Cognito"
    description: "HTTPS / OIDC"
  - source: "Routing & Regional Edge Component"
    destination: "API Versioning & Routing Component"
    description: "Internal HTTP"
  - source: "API Versioning & Routing Component"
    destination: "Catalog & Order ECS Containers"
    description: "HTTP/2"
  - source: "Monetization & Usage Analytics Component"
    destination: "Amazon Kinesis"
    description: "Async JSON"