level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Order Controller"
    technology: "Spring MVC"
    description: "Exposes RESTful endpoints for cart finalization and checkout workflows."
  - type: "component"
    name: "Checkout Orchestrator"
    technology: "Java / Spring Boot"
    description: "Manages multi-step saga patterns for payment processing and inventory reservation."
  - type: "component"
    name: "Payment Integration Client"
    technology: "HTTPS/REST"
    description: "Communicates securely with external Payment Gateways using PCI-DSS compliant tokenization."
  - type: "component"
    name: "Shipping Facade"
    technology: "gRPC"
    description: "Interfaces with external Third-Party Shipping APIs for rate calculations."
  - type: "component"
    name: "Promotion & Discount Engine"
    technology: "In-memory / Java"
    description: "Validates and applies coupon codes and promotional discounts in real-time."
  - type: "component"
    name: "Idempotency Manager"
    technology: "Lettuce"
    description: "Prevents double-charging and duplicate order creation."
  - type: "component"
    name: "Order Data Access Component"
    technology: "Spring Data JPA / TCP"
    description: "Persists transactional order state and audit logs."
  - type: "component"
    name: "Event Publisher"
    technology: "AWS SDK for Java"
    description: "Emits asynchronous order fulfillment events."
  - type: "component"
    name: "Order Notification Trigger"
    technology: "gRPC / HTTPS"
    description: "Dispatches confirmation messages and digital receipts."
  - type: "component"
    name: "Amazon ElastiCache"
    technology: "Redis protocol"
    description: "Stores idempotency keys."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Spring Data JPA / TCP"
    description: "Persists transactional data."
  - type: "component"
    name: "Amazon SQS/SNS"
    technology: "AWS SDK for Java"
    description: "Publishes fulfillment events."
  - type: "component"
    name: "Notification Service"
    technology: "gRPC / HTTPS"
    description: "Dispatches customer communications."
relationships:
  - source: "Order Controller"
    destination: "Checkout Orchestrator"
    description: "Triggers saga execution [Java Method Calls]."
  - source: "Checkout Orchestrator"
    destination: "Payment Integration Client"
    description: "Executes secure payment processing [HTTPS/REST]."
  - source: "Checkout Orchestrator"
    destination: "Shipping Facade"
    description: "Fetches shipping rates [gRPC]."
  - source: "Checkout Orchestrator"
    destination: "Promotion & Discount Engine"
    description: "Validates coupons [In-memory / Java]."
  - source: "Checkout Orchestrator"
    destination: "Idempotency Manager"
    description: "Checks request uniqueness [Lettuce]."
  - source: "Idempotency Manager"
    destination: "Amazon ElastiCache"
    description: "Stores idempotency keys [Redis protocol]."
  - source: "Order Data Access Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists transactional data [Spring Data JPA / TCP]."
  - source: "Event Publisher"
    destination: "Amazon SQS/SNS"
    description: "Publishes fulfillment events [AWS SDK for Java]."
  - source: "Order Notification Trigger"
    destination: "Notification Service"
    description: "Dispatches customer communications [gRPC / HTTPS]."