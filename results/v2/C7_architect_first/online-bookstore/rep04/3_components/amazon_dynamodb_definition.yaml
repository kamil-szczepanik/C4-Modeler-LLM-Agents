level: component
scope: "Component diagram for the Amazon DynamoDB container"
parentContainer:
  name: "Amazon DynamoDB"
elements:
  - type: "component"
    name: "Cart Table Component"
    technology: "Amazon DynamoDB Table"
    description: "Stores shopping cart items, read and deleted during checkout via AWS SDK."
  - type: "component"
    name: "Session Store Component"
    technology: "Amazon DynamoDB Table"
    description: "Stores low-latency user session data."
  - type: "component"
    name: "DynamoDB Streams Component"
    technology: "Amazon DynamoDB Streams"
    description: "Emits real-time item mutation events from the cart table."
relationships:
  - source: "Cart Table Component"
    destination: "DynamoDB Streams Component"
    description: "Emits real-time item mutation events [Internal AWS IPC]"