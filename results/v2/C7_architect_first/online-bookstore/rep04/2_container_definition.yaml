level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Customer"
    description: "End-user who browses books, purchases items via shopping cart/checkout, views recommendations, and leaves reviews."
  - type: "person"
    name: "Inventory Manager"
    description: "Staff member responsible for managing product catalog and inventory levels."
  - type: "person"
    name: "Customer Support Representative"
    description: "Staff member who manages orders and moderation using HTTPS with MFA/RBAC."
  - type: "externalSystem"
    name: "AWS Cognito"
    description: "Identity Provider handling OIDC/OAuth 2.0 authentication and GDPR/CCPA consent."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system handling transaction authorizations with PCI-DSS scope isolation."
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "External logistics services coordinating shipping and fulfillment."
  - type: "externalSystem"
    name: "Notification Service"
    description: "AWS SES providing communication and notification capabilities."
  - type: "externalSystem"
    name: "Publisher Partner Systems"
    description: "Supply chain systems providing inventory feeds."
  - type: "container"
    name: "Single-Page Application (SPA)"
    technology: "React/TypeScript, AWS S3, Amazon CloudFront"
    description: "Frontend interface for users to interact with the e-commerce platform."
  - type: "container"
    name: "Amazon API Gateway"
    technology: "AWS"
    description: "Entry point managing REST/GraphQL requests and security."
  - type: "container"
    name: "Catalog & Search Service"
    technology: "Node.js/Express, Amazon ECS on AWS Fargate"
    description: "Handles product catalog and search functionality."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Java/Spring Boot, Amazon ECS on AWS Fargate"
    description: "Manages order placement and checkout workflows."
  - type: "container"
    name: "Recommendation Service"
    technology: "Python/FastAPI, Amazon ECS on AWS Fargate"
    description: "Provides personalized book recommendations to users."
  - type: "container"
    name: "Localization Service"
    technology: "Node.js/Express, Amazon ECS on AWS Fargate"
    description: "Manages multi-region and localization support."
  - type: "container"
    name: "Review Moderation Container"
    technology: "Amazon ECS on AWS Fargate"
    description: "Moderates user reviews and feedback."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora (Multi-AZ/Global)"
    description: "Transactional database for core relational data."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "AWS NoSQL"
    description: "Stores shopping carts and session data."
  - type: "container"
    name: "Amazon ElastiCache"
    technology: "Redis"
    description: "Caching layer for high-performance data retrieval."
  - type: "container"
    name: "Amazon SQS/SNS"
    technology: "AWS"
    description: "Async messaging for decoupling core microservices."
relationships:
  - source: "Customer"
    destination: "Single-Page Application (SPA)"
    description: "Browses and purchases items via HTTPS"
    technology: "HTTPS/TLS 1.3 (Amazon CloudFront)"
  - type: "Inventory Manager"
    destination: "Single-Page Application (SPA)"
    description: "Manages catalog and inventory"
    technology: "HTTPS"
  - type: "Customer Support Representative"
    destination: "Single-Page Application (SPA)"
    description: "Manages orders and moderation"
    technology: "HTTPS with MFA/RBAC"
  - type: "Single-Page Application (SPA)"
    destination: "Amazon API Gateway"
    description: "Sends API requests"
    technology: "REST/GraphQL over HTTPS"
  - type: "Amazon API Gateway"
    destination: "AWS Cognito"
    description: "Validates tokens and authenticates users"
    technology: "OIDC/HTTPS"
  - type: "Amazon API Gateway"
    destination: "Catalog & Search Service"
    description: "Routes catalog and search queries"
    technology: "gRPC over HTTP/2"
  - type: "Amazon API Gateway"
    destination: "Order & Checkout Service"
    description: "Routes order and checkout requests"
    technology: "gRPC over HTTP/2"
  - type: "Amazon API Gateway"
    destination: "Recommendation Service"
    description: "Routes recommendation requests"
    technology: "gRPC over HTTP/2"
  - type: "Amazon API Gateway"
    destination: "Localization Service"
    description: "Routes localization requests"
    technology: "gRPC over HTTP/2"
  - type: "Amazon API Gateway"
    destination: "Review Moderation Container"
    description: "Routes review moderation requests"
    technology: "gRPC over HTTP/2"
  - type: "Catalog & Search Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes transactional data"
    technology: "TCP/TLS"
  - type: "Order & Checkout Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes transactional data"
    technology: "TCP/TLS"
  - type: "Order & Checkout Service"
    destination: "Amazon DynamoDB"
    description: "Manages cart and session data"
    technology: "TCP/TLS"
  - type: "Recommendation Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads catalog data"
    technology: "TCP/TLS"
  - type: "Localization Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads localization data"
    technology: "TCP/TLS"
  - type: "Order & Checkout Service"
    destination: "Payment Gateway"
    description: "Authorizes transactions"
    technology: "HTTPS"
  - type: "Order & Checkout Service"
    destination: "Third-Party Shipping APIs"
    description: "Coordinates fulfillment and logistics"
    technology: "HTTPS"
  - type: "Order & Checkout Service"
    destination: "Amazon SQS/SNS"
    description: "Publishes asynchronous events"
    technology: "AWS SQS/SNS protocols"
  - type: "Catalog & Search Service"
    destination: "Amazon SQS/SNS"
    description: "Publishes asynchronous events"
    technology: "AWS SQS/SNS protocols"
  - type: "Publisher Partner Systems"
    destination: "Catalog & Search Service"
    description: "Syncs catalog and inventory feeds"
    technology: "SFTP/REST"
  - type: "Notification Service"
    destination: "Customer"
    description: "Sends notifications and communications"
    technology: "SES/HTTPS"