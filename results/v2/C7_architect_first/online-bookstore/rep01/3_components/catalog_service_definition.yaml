level: component
scope: "Component diagram for the Catalog Service container"
parentContainer:
  name: "Catalog Service"
elements:
  - type: "component"
    name: "CatalogController"
    technology: "Node.js / Express"
    description: "Manages book discovery, browsing, and search endpoints."
  - type: "component"
    name: "AdminCatalogController"
    technology: "Node.js / Express"
    description: "Handles administrative catalog operations and metadata management."
  - type: "component"
    name: "SearchService"
    technology: "Node.js"
    description: "Processes search and filtering logic using Amazon OpenSearch."
  - type: "component"
    name: "PricingService"
    technology: "Node.js"
    description: "Calculates multi-currency pricing and utilizes Redis cache for exchange rates."
  - type: "component"
    name: "CatalogRepository"
    technology: "Node.js / TypeORM"
    description: "Persists and retrieves structured book metadata from Amazon RDS PostgreSQL."
  - type: "component"
    name: "Amazon RDS (PostgreSQL)"
    technology: "Amazon RDS"
    description: "Stores authoritative book metadata and multi-currency pricing."
  - type: "component"
    name: "Amazon OpenSearch"
    technology: "Amazon OpenSearch"
    description: "Delivers high-performance keyword search and filtering."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache (Redis)"
    description: "Caches exchange rates and hot queries for low latency."
  - type: "component"
    name: "API Gateway"
    technology: "AWS"
    description: "Routes catalog queries via HTTPS / mTLS."
relationships:
  - source: "API Gateway"
    destination: "CatalogController"
    description: "Routes catalog queries [HTTPS / mTLS via AWS App Mesh]"
  - source: "CatalogController"
    destination: "SearchService"
    description: "In-memory function calls [TypeScript]"
  - source: "SearchService"
    destination: "Amazon OpenSearch"
    description: "Queries catalog index [HTTPS]"
  - source: "CatalogController"
    destination: "PricingService"
    description: "In-memory calculation [TypeScript]"
  - source: "CatalogController"
    destination: "CatalogRepository"
    description: "In-memory function calls [TypeScript]"
  - source: "AdminCatalogController"
    destination: "CatalogRepository"
    description: "In-memory persistence calls [TypeScript]"
  - source: "CatalogRepository"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Reads/Writes structured data [TCP / SQL via TLS]"
  - source: "PricingService"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches exchange rates and hot queries [TCP via TLS]"