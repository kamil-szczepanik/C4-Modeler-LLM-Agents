level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "Recommendation API Router"
    technology: "Python, FastAPI"
    description: "Handles incoming recommendation requests and routes them for scoring."
  - type: "component"
    name: "Scoring Engine"
    technology: "Python, NumPy"
    description: "Generates personalized 'Customers also bought' suggestions."
  - type: "component"
    name: "Model Ingestion Worker"
    technology: "Python"
    description: "Consumes clickstream and order events to ingest ML models."
  - type: "component"
    name: "Data Access Repository"
    technology: "Python, boto3"
    description: "Manages data reads and writes to Amazon DynamoDB."
  - type: "component"
    name: "Fallback Handler Component"
    technology: "Python"
    description: "Provides fallback handling to ensure high availability and low latency."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "AWS DynamoDB with Global Tables and TTL"
    description: "Stores cached scores with active-active multi-region replication."
  - type: "component"
    name: "Amazon SQS"
    technology: "AWS SQS"
    description: "Decouples offline ML ingestion from real-time read paths."
relationships:
  - source: "API Gateway"
    destination: "Recommendation API Router"
    description: "HTTPS / mTLS via AWS App Mesh"
  - source: "Recommendation API Router"
    destination: "Scoring Engine"
    description: "In-process Python call"
  - source: "Recommendation API Router"
    destination: "Data Access Repository"
    description: "Read cached scores / TCP / AWS SDK"
  - source: "Data Access Repository"
    destination: "Amazon DynamoDB"
    description: "Low-latency read/write / HTTPS / AWS SDK"
  - source: "Amazon SQS"
    destination: "Model Ingestion Worker"
    description: "Consume clickstream/order events / AMQP / AWS SDK"