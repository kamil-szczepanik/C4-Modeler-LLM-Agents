level: component
scope: "Component diagram for the Order Management & Payment Integration Containers container"
parentContainer:
  name: "Order Management & Payment Integration Containers"
elements:
  - type: "component"
    name: "Order Controller"
    technology: "Spring Boot REST Controller"
    description: "Handles incoming HTTP requests from the API Gateway for checkout and payment processing."
  - type: "component"
    name: "Payment Service"
    technology: "Spring Boot Service with Circuit Breakers"
    description: "Communicates with the external Payment Gateway to process secure transactions."
  - type: "component"
    name: "Shipping Integration Service"
    technology: "Spring Boot Service with Circuit Breakers"
    description: "Interfaces with external Shipping Provider APIs to generate labels and fulfillment details."
  - type: "component"
    name: "Notification Publisher"
    technology: "Spring Boot AWS SQS/SNS Client"
    description: "Asynchronously dispatches order confirmation messages to the AWS SNS/SQS messaging infrastructure."
relationships:
  - source: "Order Controller"
    destination: "Payment Service"
    description: "Processes transactions [HTTPS with Circuit Breakers]"
  - source: "Order Controller"
    destination: "Shipping Integration Service"
    description: "Generates shipping labels [HTTPS with Circuit Breakers]"
  - source: "Order Controller"
    destination: "Notification Publisher"
    description: "Triggers asynchronous confirmations [AWS SNS / SQS]"