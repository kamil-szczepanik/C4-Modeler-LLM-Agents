level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "AWS API Gateway / AWS WAF"
    description: "Sends API requests and handles authentication and authorization."
  - type: "component"
    name: "Scope & RBAC Enforcement Component"
    technology: "AWS API Gateway"
    description: "Passes validated identity claims and enforces scope and RBAC."
  - type: "component"
    name: "Request Transformation & Localization Component"
    technology: "AWS API Gateway"
    description: "Forwards authorized requests and injects locale/currency."
  - type: "component"
    name: "Routing & Rate Limiting Component"
    technology: "AWS API Gateway"
    description: "Routes traffic to backend services and handles rate limiting."
  - type: "component"
    name: "Edge Observability & Telemetry Component"
    technology: "AWS X-Ray / AWS CloudWatch"
    description: "Offloads request metrics and logs from edge routing."
relationships:
  - source: "Single Page Application (SPA)"
    destination: "Authentication & Authorization Filter"
    description: "Sends API requests [HTTPS / REST / JSON]"
  - source: "Authentication & Authorization Filter"
    destination: "Scope & RBAC Enforcement Component"
    description: "Passes validated identity claims [Internal]"
  - source: "Scope & RBAC Enforcement Component"
    destination: "Request Transformation & Localization Component"
    description: "Forwards authorized requests [Internal]"
  - source: "Request Transformation & Localization Component"
    destination: "Routing & Rate Limiting Component"
    description: "Injects locale/currency and forwards requests [Internal]"
  - source: "Routing & Rate Limiting Component"
    destination: "Edge Observability & Telemetry Component"
    description: "Offloads request metrics and logs [Internal]"
  - source: "Routing & Rate Limiting Component"
    destination: "Catalog Service"
    description: "Routes traffic [HTTPS / mTLS via AWS App Mesh]"
  - source: "Routing & Rate Limiting Component"
    destination: "Order Management & Payment Integration Containers"
    description: "Routes traffic [HTTPS / mTLS via AWS App Mesh]"
  - source: "Routing & Rate Limiting Component"
    destination: "Recommendation Service"
    description: "Routes traffic [HTTPS / mTLS via AWS App Mesh]"