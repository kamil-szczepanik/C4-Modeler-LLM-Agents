level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "An Amazon-style online bookstore providing catalogue browsing, secure checkout, 5-star reviews, and book recommendations, handling 1M monthly active users globally with GDPR and CCPA compliance."
elements:
  - type: "person"
    name: "Customer"
    description: "End user who browses catalogues, purchases books, leaves 5-star reviews, and receives recommendations."
  - type: "person"
    name: "Admin / Support Staff"
    description: "Internal staff member who manages the catalogue, handles orders, and resolves disputes."
  - type: "person"
    name: "Authors / Publishers"
    description: "External partners who access sales analytics and royalty reports."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External financial system used to process secure transactions."
  - type: "externalSystem"
    name: "Shipping Provider API"
    description: "External logistics system used to generate shipping labels asynchronously."
  - type: "externalSystem"
    name: "Email / Notification Service"
    description: "External communication service used to send transactional emails."
relationships:
  - source: "Customer"
    destination: "Online Bookstore System"
    description: "Browses, purchases, reviews, and receives recommendations"
    technology: "HTTPS (TLS 1.3)"
  - source: "Admin / Support Staff"
    destination: "Online Bookstore System"
    description: "Manages catalogue, orders, and disputes"
    technology: "HTTPS with MFA"
  - source: "Authors / Publishers"
    destination: "Online Bookstore System"
    description: "Accesses sales analytics and royalty reports"
    technology: "HTTPS"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Processes secure transactions"
    technology: "REST/TLS"
  - source: "Online Bookstore System"
    destination: "Shipping Provider API"
    description: "Generates shipping labels asynchronously"
    technology: "REST/JSON"
  - source: "Online Bookstore System"
    destination: "Email / Notification Service"
    description: "Sends transactional emails asynchronously"
    technology: "Managed Message Queues"