level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Customer"
    description: "End user who browses catalogues, purchases books, leaves 5-star reviews, and receives recommendations."
  - type: "person"
    name: "Admin / Support Staff"
    description: "Internal staff member who manages the catalogue, handles orders, and resolves disputes."
  - type: "person"
    name: "Authors / Publishers"
    description: "External partners who access sales analytics and royalty reports."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External financial system used to process secure transactions."
  - type: "externalSystem"
    name: "Shipping Provider API"
    description: "External logistics system used to generate shipping labels asynchronously."
  - type: "externalSystem"
    name: "Email / Notification Service"
    description: "External communication service used to send transactional emails."
  - type: "container"
    name: "Single Page Application (SPA)"
    technology: "React and TypeScript, AWS S3 & CloudFront"
    description: "Responsive client-side rendering for the online bookstore interface."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway with WAF and JWT validation"
    description: "Entry point for client requests, providing security, WAF protection, and token validation."
  - type: "container"
    name: "Catalog Service"
    technology: "Node.js (Express), Amazon RDS (PostgreSQL)"
    description: "Manages book catalogs, browsing, and relational data."
  - type: "container"
    name: "Order Management & Payment Integration Containers"
    technology: "Spring Boot (Java), AWS SQS"
    description: "Handles order processing, payment workflows, and decouples via AWS SQS to prevent cascading failures."
  - type: "container"
    name: "Recommendation Service"
    technology: "Python (FastAPI), Amazon DynamoDB"
    description: "Generates and serves book recommendations based on user interactions."
relationships:
  - source: "Customer"
    destination: "Single Page Application (SPA)"
    description: "Accesses bookstore frontend"
    technology: "HTTPS"
  - source: "Admin / Support Staff"
    destination: "Single Page Application (SPA)"
    description: "Manages store operations"
    technology: "HTTPS"
  - source: "Authors / Publishers"
    destination: "Single Page Application (SPA)"
    description: "Accesses reports and analytics"
    technology: "HTTPS"
  - source: "Single Page Application (SPA)"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS / REST / JSON"
  - source: "API Gateway"
    destination: "Catalog Service"
    description: "Routes catalog queries"
    technology: "HTTPS / mTLS via AWS App Mesh"
  - source: "API Gateway"
    destination: "Order Management & Payment Integration Containers"
    description: "Routes order and payment actions"
    technology: "HTTPS / mTLS via AWS App Mesh"
  - source: "API Gateway"
    destination: "Recommendation Service"
    description: "Routes recommendation queries"
    technology: "HTTPS / mTLS via AWS App Mesh"
  - source: "Order Management & Payment Integration Containers"
    destination: "Payment Gateway"
    description: "Processes payments"
    technology: "HTTPS with Circuit Breakers"
  - source: "Order Management & Payment Integration Containers"
    destination: "Shipping Provider API"
    description: "Generates shipping labels"
    technology: "HTTPS with Circuit Breakers"
  - source: "Order Management & Payment Integration Containers"
    destination: "Email / Notification Service"
    description: "Triggers notifications asynchronously"
    technology: "AWS SNS / SQS"