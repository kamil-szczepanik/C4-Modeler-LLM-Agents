level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Customer"
    description: "Global user browsing, purchasing physical and electronic books, and writing reviews."
  - type: "person"
    name: "Administrator / Content Manager"
    description: "System user managing catalogue, content, and system administration."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External provider like Stripe/PayPal for secure transactions and tokenization."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "External services for rate calculation and label generation."
  - type: "container"
    name: "Single Page Application"
    technology: "React, TypeScript, Amazon S3, Amazon CloudFront"
    description: "Frontend interface for users to browse, purchase, review, and receive book recommendations securely."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway"
    description: "Routes and manages incoming traffic from the Single Page Application to internal services."
  - type: "container"
    name: "Core API Application"
    technology: "Node.js, Express, Amazon ECS Fargate"
    description: "Handles core e-commerce business logic, routing, and event publishing."
  - type: "container"
    name: "Recommendation Service"
    technology: "Python, FastAPI, Amazon ECS Fargate"
    description: "Provides book recommendations based on user activity."
  - type: "container"
    name: "Admin Dashboard Container"
    technology: "Amazon ECS Fargate"
    description: "Provides administrative interfaces for managing catalogue, content, and system administration."
  - type: "container"
    name: "Database & Cache"
    technology: "Amazon Aurora PostgreSQL, Amazon ElastiCache Redis"
    description: "Stores transactional data, user information, and handles cache-aside patterns."
  - type: "container"
    name: "Messaging & Integration"
    technology: "Amazon SQS, Amazon SNS, Amazon EventBridge"
    description: "Handles asynchronous decoupling for shipping, notification, and analytics processing."
relationships:
  - source: "Customer"
    destination: "Single Page Application"
    description: "Accesses SPA via static asset delivery and CloudFront"
    technology: "HTTPS"
  - source: "Administrator / Content Manager"
    destination: "Admin Dashboard Container"
    description: "Manages catalogue, content, and system administration"
    technology: "HTTPS"
  - source: "Single Page Application"
    destination: "API Gateway"
    description: "Communicates with API Gateway"
    technology: "HTTPS/REST/GraphQL"
  - source: "API Gateway"
    destination: "Core API Application"
    description: "Routes traffic to Core API"
    technology: "mTLS / AWS Service Connect"
  - source: "API Gateway"
    destination: "Recommendation Service"
    description: "Routes traffic to Recommendation Service"
    technology: "mTLS / AWS Service Connect"
  - source: "API Gateway"
    destination: "Admin Dashboard Container"
    description: "Routes traffic to Admin Dashboard"
    technology: "mTLS / AWS Service Connect"
  - source: "Core API Application"
    destination: "Database & Cache"
    description: "Interacts with Aurora PostgreSQL and ElastiCache Redis"
    technology: "JDBC/TLS and RESP"
  - source: "Core API Application"
    destination: "Messaging & Integration"
    description: "Publishes events for async shipping, notification, and analytics processing"
    technology: "AWS SQS/SNS/EventBridge"
  - source: "Core API Application"
    destination: "Payment Gateway"
    description: "Egresses securely for payment processing"
    technology: "HTTPS via AWS Network Firewall"
  - source: "Core API Application"
    destination: "Shipping Provider APIs"
    description: "Egresses securely for shipping calculations and labels"
    technology: "HTTPS via AWS Network Firewall"