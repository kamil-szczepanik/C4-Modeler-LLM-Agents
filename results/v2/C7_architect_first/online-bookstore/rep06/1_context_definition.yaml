level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "An Amazon-style e-commerce web platform enabling global users to purchase physical and electronic books with integrated reviews and recommendations, built for high availability across three AWS regions."
elements:
  - type: "person"
    name: "Customer"
    description: "Global user browsing, purchasing physical and electronic books, and writing reviews."
  - type: "person"
    name: "Administrator / Content Manager"
    description: "System user managing catalogue, content, and system administration."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External provider like Stripe/PayPal for secure transactions and tokenization."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "External services for rate calculation and label generation."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "AWS Cognito/Auth0 for authentication and MFA."
  - type: "externalSystem"
    name: "Recommendation ML Service"
    description: "Machine learning service for item affinity scoring."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Amazon SES/SendGrid for asynchronous transactional alerts."
relationships:
  - source: "Customer"
    destination: "Online Bookstore System"
    description: "Browses, purchases, and writes reviews via web/mobile"
    technology: "HTTPS"
  - type: "Administrator / Content Manager"
    destination: "Online Bookstore System"
    description: "Manages catalogue and system administration"
    technology: "HTTPS"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Processes secure transactions and tokenization"
    technology: "REST/HTTPS"
  - source: "Online Bookstore System"
    destination: "Shipping Provider APIs"
    description: "Requests rate calculation and label generation asynchronously"
    technology: "REST/HTTPS"
  - source: "Online Bookstore System"
    destination: "Identity Provider"
    description: "Authenticates users and handles MFA"
    technology: "OAuth2/OIDC via HTTPS"
  - source: "Online Bookstore System"
    destination: "Recommendation ML Service"
    description: "Fetches item affinity scoring"
    technology: "REST/gRPC via HTTPS"
  - source: "Online Bookstore System"
    destination: "Notification Service"
    description: "Dispatches asynchronous transactional alerts"
    technology: "REST/SMTP"