level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "Recommendation API Router"
    technology: "FastAPI, Python"
    description: "High-performance REST routing and strict input schema validation."
  - type: "component"
    name: "Recommendation Engine Core"
    technology: "SciPy, NumPy, Python"
    description: "Provides mathematical operations for collaborative filtering and ranking logic."
  - type: "component"
    name: "ML Model Client"
    technology: "boto3, gRPC, Python"
    description: "Handles communication with ML models and Amazon S3."
  - type: "component"
    name: "Cache & Persistence Repository"
    technology: "redis-py client, Python"
    description: "Delivers low-latency retrieval and persistence of pre-computed recommendation lists."
  - type: "component"
    name: "Event Consumer"
    technology: "boto3 worker, Python"
    description: "Manages asynchronous event processing from Amazon SQS."
  - type: "component"
    name: "Business Analytics Logging Component"
    technology: "Python"
    description: "Handles business analytics logging via asynchronous events."
  - type: "component"
    name: "Amazon ECS Fargate"
    technology: "Amazon ECS Fargate"
    description: "Serverless container execution ensuring scalable, zero-downtime rolling updates."
  - type: "component"
    name: "Amazon ElastiCache Redis"
    technology: "Amazon ElastiCache Redis"
    description: "Provides caching infrastructure using the Redis Protocol."
  - type: "component"
    name: "Amazon S3"
    technology: "Amazon S3"
    description: "Manages artifact storage with least-privilege IAM roles."
  - type: "component"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Manages asynchronous event queues."
relationships:
  - source: "API Gateway"
    destination: "Recommendation API Router"
    description: "mTLS/IAM [HTTP/REST]"
  - source: "ML Model Client"
    destination: "Amazon S3"
    description: "IAM Task Roles [HTTPS/gRPC]"
  - source: "Cache & Persistence Repository"
    destination: "Amazon ElastiCache Redis"
    description: "Redis Protocol"
  - source: "Event Consumer"
    destination: "Amazon SQS"
    description: "AMQP/SQS"
  - source: "Business Analytics Logging Component"
    destination: "Downstream Analytics Stores"
    description: "Asynchronous Events [HTTP/Queue]"