level: component
scope: "Component diagram for the Single Page Application container"
parentContainer:
  name: "Single Page Application"
elements:
  - type: "component"
    name: "Router Component"
    technology: "React Router, React Suspense, React.lazy()"
    description: "Manages client-side navigation, code-splitting, and dynamic feature bundle loading."
  - type: "component"
    name: "State Management Store"
    technology: "Redux Toolkit, Zustand"
    description: "Manages global state, multi-currency preferences (USD, EUR, GBP), and GDPR/CCPA consent."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios, Apollo Client"
    description: "Handles secure communication with the API Gateway via HTTPS/REST/GraphQL with token injection and telemetry."
  - type: "component"
    name: "UI Component Library"
    technology: "Tailwind CSS, Atomic Design"
    description: "Renders feature views using atomic design elements with localization banners and automatic XSS output encoding."
  - type: "component"
    name: "Code-Splitting & Lazy Loading Manager"
    technology: "React Suspense, React.lazy()"
    description: "Dynamically loads feature bundles on demand."
  - type: "component"
    name: "Local Caching Middleware"
    technology: "IndexedDB wrapper, Web Crypto API"
    description: "Handles offline cart persistence and encrypted local metadata caching using Web Crypto API encryption."
relationships:
  - source: "Router Component"
    destination: "UI Component Library"
    description: "Renders feature views using atomic design elements."
  - source: "Router Component"
    destination: "Code-Splitting & Lazy Loading Manager"
    description: "Dynamically loads feature bundles on demand."
  - source: "State Management Store"
    destination: "Local Caching Middleware"
    description: "Persists cart and metadata locally using Web Crypto API encryption."
  - source: "API Client Layer"
    destination: "API Gateway"
    description: "Communicates via HTTPS/REST/GraphQL with token injection and telemetry."