level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Request Router / Reverse Proxy"
    technology: "AWS API Gateway"
    description: "Dispatches incoming traffic securely to backend core containers and microservices."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "AWS API Gateway, AWS WAF"
    description: "Handles security checks, token validation, and scope enforcement."
  - type: "component"
    name: "Rate Limiting & Throttling Controller"
    technology: "AWS API Gateway, Amazon ElastiCache Redis"
    description: "Controls traffic rates and protects backend services from being overwhelmed."
  - type: "component"
    name: "Request/Response Transformation Engine"
    technology: "AWS API Gateway"
    description: "Transforms payloads and headers between clients and backend microservices."
relationships:
  - source: "Request Router / Reverse Proxy"
    destination: "Authentication & Authorization Filter"
    description: "Passes requests for security validation"
  - source: "Authentication & Authorization Filter"
    destination: "Rate Limiting & Throttling Controller"
    description: "Enforces rate limits for authenticated requests"
  - source: "Rate Limiting & Throttling Controller"
    destination: "Request/Response Transformation Engine"
    description: "Forwards validated and throttled requests for payload transformation"