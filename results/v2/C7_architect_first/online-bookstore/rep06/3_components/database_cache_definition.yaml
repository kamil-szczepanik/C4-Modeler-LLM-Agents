level: component
scope: "Component diagram for the Database & Cache container"
parentContainer:
  name: "Database & Cache"
elements:
  - type: "component"
    name: "Connection Pooling Component"
    technology: "Amazon RDS Proxy / PgBouncer sidecar"
    description: "Manages connection limits from auto-scaling ECS Fargate tasks and executes transactional queries."
  - type: "component"
    name: "Primary Relational Datastore"
    technology: "Amazon Aurora PostgreSQL Multi-AZ"
    description: "Handles ACID-compliant transactional data, multi-currency decimal precision, and automated cross-region replication."
  - type: "component"
    name: "Read Replica Cluster"
    technology: "Amazon Aurora PostgreSQL Read Replicas"
    description: "Provides scaled read operations to ensure sub-second response times under heavy traffic."
  - type: "component"
    name: "Distributed Cache Layer"
    technology: "Amazon ElastiCache for Redis"
    description: "Provides low-latency session persistence and cache-aside catalogue performance."
relationships:
  - source: "Connection Pooling Component"
    destination: "Primary Relational Datastore"
    description: "Executes transactional queries on port 5432 using pgJDBC over TLS"