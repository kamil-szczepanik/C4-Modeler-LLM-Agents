level: component
scope: "Component diagram for the Messaging & Integration container"
parentContainer:
  name: "Messaging & Integration"
elements:
  - type: "component"
    name: "Event Router"
    technology: "Amazon EventBridge"
    description: "Serverless event bus that routes domain events and provides schema validation."
  - type: "component"
    name: "Notification Dispatcher Queue"
    technology: "Amazon SQS"
    description: "Standard queue for forwarding notification events."
  - type: "component"
    name: "Shipping Fulfillment Topic"
    technology: "Amazon SNS"
    description: "Pub/sub topic for forwarding checkout events."
  - type: "component"
    name: "Dead Letter Queue Handlers"
    technology: "Amazon SQS DLQ"
    description: "Paired DLQs that route failed messages after max retries."
  - type: "component"
    name: "Schema Registry"
    technology: "AWS Glue Schema Registry"
    description: "Enforces strict payload validation and secrets redaction."
  - type: "component"
    name: "State Store"
    technology: "Amazon ElastiCache Redis"
    description: "Manages deduplication and idempotency tracking."
relationships:
  - source: "Core API Application"
    destination: "Event Router"
    description: "Publishes domain events [HTTPS / AWS SDK]"
  - source: "Event Router"
    destination: "Notification Dispatcher Queue"
    description: "Forwards notification events [AWS SQS integration]"
  - source: "Event Router"
    destination: "Shipping Fulfillment Topic"
    description: "Forwards checkout events [AWS SNS integration]"
  - source: "Event Router"
    destination: "Dead Letter Queue Handlers"
    description: "Routes failed messages after max retries [AWS SQS]"
  - source: "Dead Letter Queue Handlers"
    destination: "Event Router"
    description: "Publishes OrderProcessingFailed event [AWS SDK]"