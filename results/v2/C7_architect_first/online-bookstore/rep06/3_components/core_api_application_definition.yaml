level: component
scope: "Component diagram for the Core API Application container"
parentContainer:
  name: "Core API Application"
elements:
  - type: "component"
    name: "Catalog Component"
    technology: "TypeScript"
    description: "Handles browsing, keyword search queries, and caching interactions."
  - type: "component"
    name: "Cart & Checkout Component"
    technology: "TypeScript"
    description: "Manages shopping carts, payment coordination, session persistence, and idempotency."
  - type: "component"
    name: "Order Management Component"
    technology: "TypeScript"
    description: "Orchestrates fulfillment, transactional outbox pattern, and event publishing."
  - type: "component"
    name: "Review Component"
    technology: "TypeScript"
    description: "Manages customer reviews, 5-star ratings, and moderation workflows."
relationships:
  - source: "Catalog Component"
    destination: "Database & Cache"
    description: "Queries and caches data"
  - source: "Cart & Checkout Component"
    destination: "Database & Cache"
    description: "Persists session and cart data"
  - source: "Cart & Checkout Component"
    destination: "Payment Gateway"
    description: "Processes secure financial transactions"
  - source: "Order Management Component"
    destination: "Database & Cache"
    description: "Executes transactions using Prisma ORM"
  - source: "Order Management Component"
    destination: "Messaging & Integration"
    description: "Publishes events for async processing"
  - source: "Order Management Component"
    destination: "Shipping Provider APIs"
    description: "Calculates shipping and generates labels"
  - source: "Review Component"
    destination: "Database & Cache"
    description: "Stores and retrieves reviews"