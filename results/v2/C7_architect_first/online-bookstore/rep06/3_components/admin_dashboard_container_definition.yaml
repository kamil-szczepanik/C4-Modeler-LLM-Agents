level: component
scope: "Component diagram for the Admin Dashboard Container container"
parentContainer:
  name: "Admin Dashboard Container"
elements:
  - type: "component"
    name: "React/Nginx SPA Frontend"
    technology: "React, Nginx"
    description: "Provides internal management interfaces for catalogue inventory, order fulfillment, and review moderation."
  - type: "component"
    name: "Node.js API Backend"
    technology: "Node.js"
    description: "Implements the unified backend logic, validates JWT tokens, enforces RBAC, and coordinates internal operations."
  - type: "component"
    name: "Internal Application Load Balancer"
    technology: "AWS ALB"
    description: "Routes secure traffic using mTLS and restricts network access via VPC peering and AWS Security Groups."
  - type: "component"
    name: "Administrator / Content Manager"
    technology: "Human User"
    description: "Accesses the dashboard via HTTPS with mandatory MFA."
  - type: "component"
    name: "Identity Provider"
    technology: "External Service"
    description: "Validates JWT tokens and enforces RBAC."
  - type: "component"
    name: "Core API Application"
    technology: "gRPC over TLS"
    description: "Performs inventory and catalogue operations."
  - type: "component"
    name: "Shipping Provider APIs"
    technology: "HTTPS"
    description: "Monitors fulfillment and exceptions."
  - type: "component"
    name: "Amazon CloudWatch & AWS X-Ray"
    technology: "AWS CloudWatch, AWS X-Ray"
    description: "Ships immutable audit logs, structured JSON logs, and provides distributed tracing."
relationships:
  - source: "Administrator / Content Manager"
    destination: "Internal Application Load Balancer"
    description: "Accesses dashboard via HTTPS with mandatory MFA"
  - source: "Internal Application Load Balancer"
    destination: "React/Nginx SPA Frontend"
    description: "Routes secure traffic using mTLS"
  - source: "React/Nginx SPA Frontend"
    destination: "Node.js API Backend"
    description: "Communicates with unified backend"
  - source: "Node.js API Backend"
    destination: "Identity Provider"
    description: "Validates JWT tokens and enforces RBAC [HTTPS]"
  - source: "Node.js API Backend"
    destination: "Core API Application"
    description: "Performs inventory and catalogue operations [gRPC over TLS]"
  - source: "Node.js API Backend"
    destination: "Shipping Provider APIs"
    description: "Monitors fulfillment and exceptions [HTTPS]"
  - source: "Node.js API Backend"
    destination: "Amazon CloudWatch & AWS X-Ray"
    description: "Ships immutable audit logs and structured JSON logs [HTTPS]"