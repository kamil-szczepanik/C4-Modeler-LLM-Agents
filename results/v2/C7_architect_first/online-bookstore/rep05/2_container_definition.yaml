level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Customers and Administrators"
    description: "End-users browsing the catalog, managing accounts, purchasing books, and internal staff administering the platform."
  - type: "externalSystem"
    name: "Stripe/PayPal"
    description: "Payment Gateway for secure payment processing."
  - type: "externalSystem"
    name: "FedEx/UPS"
    description: "Shipping APIs for order fulfillment and shipping."
  - type: "externalSystem"
    name: "SendGrid/Amazon SES"
    description: "Notification Service for transactional messaging."
  - type: "externalSystem"
    name: "Fixer/Open Exchange Rates"
    description: "Currency Exchange Rate Provider for multi-currency support."
  - type: "container"
    name: "Global Edge Layer"
    technology: "Amazon CloudFront, Amazon Route 53, AWS WAF"
    description: "Provides global static asset delivery, DNS routing, and security/WAF mitigations."
  - type: "container"
    name: "React Single Page Application"
    technology: "React, Amazon S3"
    description: "Frontend user interface hosted as a fast global static asset."
  - type: "container"
    name: "Amazon API Gateway"
    technology: "Amazon API Gateway (REST/GraphQL)"
    description: "Ingress layer handling authentication and routing requests to internal microservices."
  - type: "container"
    name: "Catalog Service"
    technology: "Amazon ECS Fargate, gRPC, AWS App Mesh"
    description: "Manages book catalog, searching, and inventory."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Amazon ECS Fargate, gRPC, AWS App Mesh"
    description: "Handles secure ordering, payment processing integrations, and checkout logic."
  - type: "container"
    name: "Recommendation Service"
    technology: "Amazon ECS Fargate, gRPC, AWS App Mesh"
    description: "Provides real-time personalized book recommendations."
  - type: "container"
    name: "Customer Privacy/Compliance Service"
    technology: "Amazon ECS Fargate, gRPC, AWS App Mesh"
    description: "Ensures strict GDPR and CCPA compliance and data protection."
  - type: "container"
    name: "Notification Service"
    technology: "Amazon ECS Fargate, Amazon SQS/SNS"
    description: "Consumes events and dispatches transactional emails and notifications."
  - type: "container"
    name: "Review Service"
    technology: "Amazon ECS Fargate, gRPC, AWS App Mesh"
    description: "Handles customer reviews and ratings for books."
  - type: "container"
    name: "Analytics Ingestion Pipeline"
    technology: "Amazon ECS Fargate, gRPC, AWS App Mesh"
    description: "Ingests operational and user activity data for analytics."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora (PostgreSQL)"
    description: "Primary transactional database ensuring checkout integrity."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Fast NoSQL database supporting catalog and search features."
  - type: "container"
    name: "Amazon ElastiCache Redis"
    technology: "Amazon ElastiCache (Redis)"
    description: "In-memory caching layer for real-time recommendations and fast data retrieval."
relationships:
  - source: "Customers and Administrators"
    destination: "Global Edge Layer"
    description: "Accesses the React SPA via HTTPS through Amazon CloudFront and Amazon Route 53"
    technology: "HTTPS"
  - source: "Global Edge Layer"
    destination: "React Single Page Application"
    description: "Serves static frontend assets from Amazon S3"
    technology: "HTTPS"
  - source: "React Single Page Application"
    destination: "Amazon API Gateway"
    description: "Communicates for authentication, routing, and API requests"
    technology: "HTTPS/WSS"
  - source: "Amazon API Gateway"
    destination: "Catalog Service"
    description: "Routes requests to backend microservices"
    technology: "gRPC over HTTP/2 via AWS App Mesh"
  - source: "Amazon API Gateway"
    destination: "Order & Checkout Service"
    description: "Routes requests to backend microservices"
    technology: "gRPC over HTTP/2 via AWS App Mesh"
  - source: "Amazon API Gateway"
    destination: "Recommendation Service"
    description: "Routes requests to backend microservices"
    technology: "gRPC over HTTP/2 via AWS App Mesh"
  - source: "Amazon API Gateway"
    destination: "Customer Privacy/Compliance Service"
    description: "Routes requests to backend microservices"
    technology: "gRPC over HTTP/2 via AWS App Mesh"
  - source: "Amazon API Gateway"
    destination: "Notification Service"
    description: "Routes requests to backend microservices"
    technology: "gRPC over HTTP/2 via AWS App Mesh"
  - source: "Amazon API Gateway"
    destination: "Review Service"
    description: "Routes requests to backend microservices"
    technology: "gRPC over HTTP/2 via AWS App Mesh"
  - source: "Amazon API Gateway"
    destination: "Analytics Ingestion Pipeline"
    description: "Routes requests to backend microservices"
    technology: "gRPC over HTTP/2 via AWS App Mesh"
  - source: "Order & Checkout Service"
    destination: "Stripe/PayPal"
    description: "Integrates securely for payment processing"
    technology: "HTTPS"
  - source: "Order & Checkout Service"
    destination: "FedEx/UPS"
    description: "Triggers third-party shipping APIs for fulfillment"
    technology: "HTTPS"
  - source: "Notification Service"
    destination: "SendGrid/Amazon SES"
    description: "Sends messages and transactional notifications"
    technology: "HTTPS/SMTP"
  - source: "Order & Checkout Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists transactional checkout and order data"
    technology: "PostgreSQL Wire Protocol"
  - source: "Catalog Service"
    destination: "Amazon DynamoDB"
    description: "Reads and writes catalog and search data"
    technology: "DynamoDB API"
  - source: "Recommendation Service"
    destination: "Amazon ElastiCache Redis"
    description: "Queries real-time caching for recommendations"
    technology: "Redis Protocol"
  - source: "Notification Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Consumes events and reads/writes state"
    technology: "PostgreSQL Wire Protocol"