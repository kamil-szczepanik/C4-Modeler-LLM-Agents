level: component
scope: "Component diagram for the Customer Privacy/Compliance Service container"
parentContainer:
  name: "Customer Privacy/Compliance Service"
elements:
  - type: "component"
    name: "Consent & Preference Controller"
    technology: "gRPC, Spring Boot"
    description: "Manages opt-ins/opt-outs and self-service privacy portal APIs."
  - type: "component"
    name: "Data Erasure & Anonymization Engine"
    technology: "Amazon SQS, Distributed Saga Pattern"
    description: "Executes distributed saga patterns via Amazon SQS for data deletion."
  - type: "component"
    name: "Data Export Handler"
    technology: "Amazon S3, Java"
    description: "Aggregates customer data and generates secure Amazon S3 export packages."
  - type: "component"
    name: "Compliance Audit Logger"
    technology: "Amazon DynamoDB, AWS KMS"
    description: "Records immutable regulatory audit trails in Amazon DynamoDB."
relationships:
  - source: "Consent & Preference Controller"
    destination: "Data Erasure & Anonymization Engine"
    description: "Triggers asynchronous deletion workflows"
  - source: "Data Erasure & Anonymization Engine"
    destination: "Amazon SQS"
    description: "Publishes and consumes asynchronous deletion and saga events"
  - source: "Data Export Handler"
    destination: "Amazon Aurora PostgreSQL"
    description: "Queries customer data for export packages"
  - source: "Compliance Audit Logger"
    destination: "Amazon DynamoDB"
    description: "Persists immutable audit trails with AWS KMS encryption"