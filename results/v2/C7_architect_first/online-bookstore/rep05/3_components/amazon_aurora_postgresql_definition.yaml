level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL container"
parentContainer:
  name: "Amazon Aurora PostgreSQL"
elements:
  - type: "component"
    name: "Writer Node"
    technology: "AWS Aurora PostgreSQL Engine"
    description: "Handles database write operations and transactions."
  - type: "component"
    name: "Reader Node"
    technology: "AWS Aurora PostgreSQL Engine"
    description: "Handles read-only queries and data retrieval workloads."
  - type: "component"
    name: "Connection Pooler"
    technology: "AWS RDS Proxy"
    description: "Manages connection spikes and prevents max-connection exhaustion from ECS Fargate."
  - type: "component"
    name: "Distributed Storage Volume"
    technology: "AWS Aurora Distributed Storage"
    description: "Provides multi-region durability and storage replication."
relationships:
  - source: "Connection Pooler"
    destination: "Writer Node"
    description: "Routes write traffic [Internal Routing]"
  - source: "Connection Pooler"
    destination: "Reader Node"
    description: "Routes read traffic [Internal Routing]"
  - source: "Writer Node"
    destination: "Distributed Storage Volume"
    description: "Replicates data [Storage Replication]"