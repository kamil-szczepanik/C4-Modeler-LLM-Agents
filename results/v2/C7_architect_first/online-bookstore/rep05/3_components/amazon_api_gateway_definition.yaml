level: component
scope: "Component diagram for the Amazon API Gateway container"
parentContainer:
  name: "Amazon API Gateway"
elements:
  - type: "component"
    name: "API Router"
    technology: "AWS API Gateway Routing"
    description: "Proxies requests and routes traffic to backend microservices."
  - type: "component"
    name: "Auth & Authorization"
    technology: "AWS API Gateway Custom Authorizer / AWS Cognito"
    description: "Validates user JSON Web Tokens (JWT) and handles authorization."
  - type: "component"
    name: "Rate Limiting & Throttling"
    technology: "AWS API Gateway Usage Plans"
    description: "Enforces rate limits and throttles incoming API requests to protect backend services."
relationships:
  - source: "API Router"
    destination: "Auth & Authorization"
    description: "Validates user JWT"
  - source: "Auth & Authorization"
    destination: "API Router"
    description: "Passes execution context"