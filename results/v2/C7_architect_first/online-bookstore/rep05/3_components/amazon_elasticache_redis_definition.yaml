level: component
scope: "Component diagram for the Amazon ElastiCache Redis container"
parentContainer:
  name: "Amazon ElastiCache Redis"
elements:
  - type: "component"
    name: "Session Store Engine"
    technology: "Redis Hashes, Redis (Cluster Mode), RESP v3"
    description: "Manages user shopping cart states and session data with a 7-day TTL and noeviction policy."
  - type: "component"
    name: "Recommendation Cache Engine"
    technology: "Redis Sorted Sets (ZSET), Redis (Cluster Mode), RESP v3"
    description: "Stores precomputed 'Customers also bought' item affinities using volatile-lru eviction."
relationships:
  - source: "Order & Checkout Service"
    destination: "Session Store Engine"
    description: "Reads and writes cart state via Redis Serialization Protocol (RESP v3) over TLS."
  - source: "Recommendation Service"
    destination: "Recommendation Cache Engine"
    description: "Fetches item affinities using RESP v3 over TLS."
  - source: "Customer Privacy/Compliance Service"
    destination: "Session Store Engine"
    description: "Purges user session hashes and PII using Redis SCAN and DEL commands."