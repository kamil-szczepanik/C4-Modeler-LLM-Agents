level: component
scope: "Component diagram for the Review Service container"
parentContainer:
  name: "Review Service"
elements:
  - type: "component"
    name: "Review API Controller"
    technology: "Node.js/TypeScript (Express/gRPC)"
    description: "Handles authenticated review requests and routes gRPC traffic."
  - type: "component"
    name: "Review Data Access Component"
    technology: "Node.js/TypeScript"
    description: "Manages persistence and cache invalidation."
  - type: "component"
    name: "Rating Aggregator Component"
    technology: "Node.js/TypeScript"
    description: "Handles asynchronous aggregate score recalculation."
  - type: "component"
    name: "Review Moderation Engine"
    technology: "AWS Lambda"
    description: "Processes text for sentiment and compliance."
  - type: "component"
    name: "Amazon API Gateway"
    technology: "AWS API Gateway"
    description: "Routes incoming gRPC traffic over HTTP/2 with mTLS via AWS App Mesh."
  - type: "component"
    name: "Order & Checkout Service"
    technology: "Microservice"
    description: "Validates purchase history via gRPC calls."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache Redis"
    description: "Caches queries and invalidates keys on writes/GDPR deletions."
  - type: "component"
    name: "AWS RDS Proxy"
    technology: "AWS RDS Proxy"
    description: "Manages database connection pools securely."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Executes relational database queries with KMS encryption."
  - type: "component"
    name: "Amazon SQS"
    technology: "Amazon SQS with DLQs"
    description: "Processes moderation tasks asynchronously."
relationships:
  - source: "Amazon API Gateway"
    destination: "Review API Controller"
    description: "Routes incoming gRPC traffic over HTTP/2 with mTLS via AWS App Mesh."
  - source: "Review API Controller"
    destination: "Order & Checkout Service"
    description: "Validates purchase history via gRPC calls."
  - source: "Review API Controller"
    destination: "Review Data Access Component"
    description: "Executes internal function calls."
  - source: "Review Data Access Component"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches queries and invalidates keys on writes/GDPR deletions."
  - source: "Review Data Access Component"
    destination: "AWS RDS Proxy"
    description: "Manages database connection pools securely."
  - source: "AWS RDS Proxy"
    destination: "Amazon Aurora PostgreSQL"
    description: "Executes JDBC/TLS over TCP queries with KMS encryption."
  - source: "Review Moderation Engine"
    destination: "Amazon SQS"
    description: "Processes moderation tasks asynchronously."