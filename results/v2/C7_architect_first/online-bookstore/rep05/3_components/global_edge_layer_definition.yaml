level: component
scope: "Component diagram for the Global Edge Layer container"
parentContainer:
  name: "Global Edge Layer"
elements:
  - type: "component"
    name: "DNS Router"
    technology: "Amazon Route 53 (Anycast geo-DNS)"
    description: "Directs global user traffic with geo-DNS routing and automated health-check failovers."
  - type: "component"
    name: "Web Application Firewall"
    technology: "AWS WAF"
    description: "Provides OWASP Top-10 mitigation, rate-limiting, and geo-restriction compliance."
  - type: "component"
    name: "Edge Request Transformer"
    technology: "CloudFront Functions / Lambda@Edge"
    description: "Performs header sanitization, sub-millisecond request transformation, and edge JWT validation."
  - type: "component"
    name: "Edge Content Delivery Network"
    technology: "Amazon CloudFront and Amazon S3"
    description: "Handles static asset caching, global delivery, and dynamic origin shielding."
  - type: "component"
    name: "Amazon API Gateway"
    technology: "Amazon API Gateway"
    description: "Routes dynamic API traffic from the edge to the regional backend."
relationships:
  - source: "DNS Router"
    destination: "Web Application Firewall"
    description: "Directs global user traffic [DNS]"
  - source: "Web Application Firewall"
    destination: "Edge Request Transformer"
    description: "Forwards filtered HTTP/S requests [HTTPS]"
  - source: "Edge Request Transformer"
    destination: "Edge Content Delivery Network"
    description: "Passes enriched requests for cache evaluation [Internal]"
  - source: "Edge Content Delivery Network"
    destination: "Amazon API Gateway"
    description: "Routes dynamic API traffic and bypasses cache for authenticated routes [HTTPS/REST]"