level: component
scope: "Component diagram for the Analytics Ingestion Pipeline container"
parentContainer:
  name: "Analytics Ingestion Pipeline"
elements:
  - type: "component"
    name: "Ingestion API Controller"
    technology: "Go, gRPC"
    description: "Receives high-volume operational and behavioral event streams with high-throughput and low-latency."
  - type: "component"
    name: "Event Schema Validator"
    technology: "Protocol Buffers / JSON Schema"
    description: "Validates incoming event payloads to ensure data integrity."
  - type: "component"
    name: "Event Buffer"
    technology: "Amazon Kinesis Data Streams"
    description: "Decouples high-throughput ingestion from processing to absorb traffic spikes and guarantee at-least-once delivery."
  - type: "component"
    name: "Stream Processor / Anonymizer"
    technology: "AWS Lambda / Apache Flink on ECS"
    description: "Performs stateless stream processing, payload sanitization, and PII anonymization."
  - type: "component"
    name: "Data Sink Loader"
    technology: "Amazon S3 / Amazon Timestream"
    description: "Loads processed data into columnar storage for training recommendation models and long-term analytics retention."
  - type: "component"
    name: "Dead Letter Queues"
    technology: "Amazon S3 / SQS"
    description: "Captures failed or invalid events for later inspection and error handling."
relationships:
  - source: "Amazon API Gateway"
    destination: "Ingestion API Controller"
    description: "gRPC over HTTP/2 via AWS App Mesh"
  - source: "Ingestion API Controller"
    destination: "Event Schema Validator"
    description: "In-memory function call"
  - source: "Ingestion API Controller"
    destination: "Event Buffer"
    description: "AWS SDK / TCP"
  - source: "Stream Processor / Anonymizer"
    destination: "Event Buffer"
    description: "AWS SDK"
  - source: "Stream Processor / Anonymizer"
    destination: "Data Sink Loader"
    description: "AWS SDK"