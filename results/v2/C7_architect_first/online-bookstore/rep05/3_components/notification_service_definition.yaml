level: component
scope: "Component diagram for the Notification Service container"
parentContainer:
  name: "Notification Service"
elements:
  - type: "component"
    name: "Event Consumer Component"
    technology: "Spring Boot (Java)"
    description: "Processes asynchronous domain events."
  - type: "component"
    name: "Notification Router Component"
    technology: "Java / gRPC"
    description: "Handles user preferences and routing decisions."
  - type: "component"
    name: "Template Engine Component"
    technology: "Thymeleaf"
    description: "Renders localized messages using templates from Amazon S3."
  - type: "component"
    name: "Dispatch Adapter Component"
    technology: "Java / AWS SDK"
    description: "Integrates with external providers via HTTPS/SMTP, backed by AWS Secrets Manager."
  - type: "component"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Buffers incoming domain events and includes Dead Letter Queues (DLQ)."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Stores scalable, non-PII delivery audit trails."
  - type: "component"
    name: "External Providers"
    technology: "SendGrid, Amazon SES, and Amazon SNS"
    description: "Sends emails and SMS."
relationships:
  - source: "Amazon SQS"
    destination: "Event Consumer Component"
    description: "Consumes domain events [Polling over AWS SDK]"
  - source: "Notification Router Component"
    destination: "Customer Privacy/Compliance Service"
    description: "Validates opt-in preferences [gRPC over AWS App Mesh with mTLS]"
  - source: "Template Engine Component"
    destination: "Amazon S3"
    description: "Fetches notification templates [HTTPS]"
  - source: "Dispatch Adapter Component"
    destination: "External Providers"
    description: "Sends emails and SMS [HTTPS/SMTP]"
  - source: "Dispatch Adapter Component"
    destination: "AWS Secrets Manager"
    description: "Fetches credentials [AWS SDK over HTTPS]"
  - source: "Dispatch Adapter Component"
    destination: "Amazon DynamoDB"
    description: "Persists delivery logs [DynamoDB Wire Protocol]"