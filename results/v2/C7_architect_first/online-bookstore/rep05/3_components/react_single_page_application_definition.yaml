level: component
scope: "Component diagram for the React Single Page Application container"
parentContainer:
  name: "React Single Page Application"
elements:
  - type: "component"
    name: "Routing & App Shell"
    technology: "React, react-router-dom"
    description: "Handles client-side routing and application layout, supporting dynamic imports and code-splitting."
  - type: "component"
    name: "Catalog & Search Module"
    technology: "React, Redux Toolkit"
    description: "Manages catalog browsing, search state, and related UI components."
  - type: "component"
    name: "Cart & Checkout Flow"
    technology: "React Hook Form, Stripe Elements SDK"
    description: "Manages shopping cart operations, checkout validation, and secure payment processing."
  - type: "component"
    name: "Recommendation & Review Widgets"
    technology: "React"
    description: "Renders personalized recommendations and product reviews."
  - type: "component"
    name: "API Client"
    technology: "Axios, GraphQL Client"
    description: "Communicates with backend APIs via HTTPS, REST, and GraphQL."
  - type: "component"
    name: "Browser Local Storage"
    technology: "Browser Local Storage"
    description: "Provides an encrypted guest cart fallback mechanism."
  - type: "component"
    name: "Global Edge Layer"
    technology: "Amazon CloudFront, Amazon S3"
    description: "Delivers static assets globally with low latency and high availability."
  - type: "component"
    name: "Amazon API Gateway"
    technology: "Amazon API Gateway"
    description: "Routes client requests securely to backend services."
relationships:
  - source: "Routing & App Shell"
    destination: "Catalog & Search Module"
    description: "Dynamic Import / React.lazy"
  - source: "Routing & App Shell"
    destination: "Cart & Checkout Flow"
    description: "Dynamic Import / React.lazy"
  - source: "Catalog & Search Module"
    destination: "API Client"
    description: "HTTPS/REST/GraphQL"
  - source: "Cart & Checkout Flow"
    destination: "API Client"
    description: "HTTPS/REST/GraphQL"
  - source: "Recommendation & Review Widgets"
    destination: "API Client"
    description: "HTTPS/REST/GraphQL"
  - source: "API Client"
    destination: "Amazon API Gateway"
    description: "HTTPS/WSS"
  - source: "Cart & Checkout Flow"
    destination: "Browser Local Storage"
    description: "Encrypted JSON, fallback only"
  - source: "Global Edge Layer"
    destination: "Routing & App Shell"
    description: "HTTPS"