level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Order Management"
    technology: "Spring Boot / Java"
    description: "Handles core order processing, transactional state, and audit trails."
  - type: "component"
    name: "Payment Orchestration"
    technology: "Spring Boot / Java"
    description: "Coordinates payment processing and stores idempotency keys."
  - type: "component"
    name: "Fulfillment Integration"
    technology: "Spring Boot / Java"
    description: "Integrates with external shipping providers to generate shipping labels."
  - type: "component"
    name: "Outbox Event Publisher"
    technology: "Spring Boot / Java"
    description: "Publishes asynchronous fulfillment messages using the outbox pattern."
relationships:
  - source: "Order Management"
    destination: "Payment Orchestration"
    description: "Internal method calls [Java]"
  - source: "Payment Orchestration"
    destination: "Stripe/PayPal"
    description: "Processes payments [HTTPS with TLS 1.3]"
  - source: "Fulfillment Integration"
    destination: "FedEx/UPS"
    description: "Generates shipping labels [HTTPS]"
  - source: "Order Management"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists transactional state and audit trails [PostgreSQL Wire Protocol via HikariCP]"
  - source: "Outbox Event Publisher"
    destination: "Amazon SQS"
    description: "Publishes asynchronous fulfillment messages [AWS SDK]"
  - source: "Payment Orchestration"
    destination: "Amazon ElastiCache Redis"
    description: "Stores idempotency keys [Redis Wire Protocol with TLS]"