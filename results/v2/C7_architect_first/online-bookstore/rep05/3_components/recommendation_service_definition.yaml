level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "Recommendation API Controller"
    technology: "Go"
    description: "Go service handling incoming gRPC requests, input validation, and fallback logic."
  - type: "component"
    name: "Recommendation Engine"
    technology: "Python FastAPI"
    description: "Python FastAPI service running collaborative filtering and ML scoring models."
  - type: "component"
    name: "Fallback & Resiliency Manager"
    technology: "Go / Resilience Logic"
    description: "Component handling circuit breaking and static top-seller fallbacks."
  - type: "component"
    name: "Data Access Repository"
    technology: "Go Module"
    description: "Go module interfacing with databases and caches."
  - type: "component"
    name: "Amazon ElastiCache Redis"
    technology: "Amazon ElastiCache Redis"
    description: "High-performance cache storing pre-computed recommendation vectors and fallbacks."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Relational database storing anonymized historical purchase data."
  - type: "component"
    name: "AWS App Mesh"
    technology: "AWS App Mesh"
    description: "Service mesh managing secure internal communications and telemetry."
relationships:
  - source: "Amazon API Gateway"
    destination: "Recommendation API Controller"
    description: "Routes gRPC requests [gRPC over HTTP/2 via AWS App Mesh]"
  - source: "Recommendation API Controller"
    destination: "Recommendation Engine"
    description: "Forwards scoring requests [gRPC over mTLS via AWS App Mesh]"
  - source: "Recommendation API Controller"
    destination: "Amazon ElastiCache Redis"
    description: "Queries fallback top-sellers [Redis Protocol over TLS]"
  - source: "Recommendation Engine"
    destination: "Amazon ElastiCache Redis"
    description: "Fetches pre-computed vectors [Redis Protocol over TLS]"
  - source: "Recommendation Engine"
    destination: "Amazon Aurora PostgreSQL"
    description: "Queries order history [SQL/TCP with IAM Auth]"