level: component
scope: "Component diagram for the Amazon DynamoDB container"
parentContainer:
  name: "Amazon DynamoDB"
elements:
  - type: "component"
    name: "Catalog Table Store"
    technology: "Amazon DynamoDB Standard Tables"
    description: "Stores book metadata, inventory counts, and categories partitioned by BookID."
  - type: "component"
    name: "Search Index Accelerator"
    technology: "Global Secondary Indexes (GSIs) and DynamoDB Streams"
    description: "Maintains Global Secondary Indexes (GSIs) and DynamoDB Streams for faceted keyword/author searches and analytics."
  - type: "component"
    name: "Global Table Replica Manager"
    technology: "DynamoDB Global Tables"
    description: "Manages active-active multi-region replication across us-east-1, eu-west-1, and ap-southeast-1."
relationships:
  - source: "Catalog Service"
    destination: "Catalog Table Store"
    description: "Reads/writes book details and stock levels [DynamoDB API over HTTPS via VPC Endpoint]"
  - source: "Recommendation Service"
    destination: "Catalog Table Store"
    description: "Queries co-purchase patterns and GSI projections [DynamoDB API over HTTPS via VPC Endpoint]"
  - source: "Catalog Table Store"
    destination: "AWS KMS"
    description: "Encrypts data at rest using Customer Managed Keys [AWS internal API]"
  - source: "Catalog Table Store"
    destination: "DynamoDB Streams"
    description: "Emits item updates for downstream analytics [AWS internal IPC]"