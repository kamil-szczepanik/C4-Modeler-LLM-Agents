level: component
scope: "Component diagram for the Catalog Service container"
parentContainer:
  name: "Catalog Service"
elements:
  - type: "component"
    name: "Catalog API Controller"
    technology: "Go, gRPC"
    description: "Handles incoming catalog requests and coordinates in-process method calls."
  - type: "component"
    name: "Search Engine Adapter"
    technology: "Go"
    description: "Adapts search queries for the underlying search engine."
  - type: "component"
    name: "Inventory Manager"
    technology: "Go"
    description: "Manages real-time inventory tracking and database operations."
  - type: "component"
    name: "Catalog Cache Layer"
    technology: "Go, go-redis"
    description: "Provides sub-second catalog detail caching and resiliency fallbacks."
  - type: "component"
    name: "Pricing & Localization Interceptor"
    technology: "Go"
    description: "Provides multi-currency support and localization."
  - type: "component"
    name: "Inventory Write-Through / Event Publisher"
    technology: "Go"
    description: "Publishes inventory events and handles write-through updates."
  - type: "component"
    name: "Amazon OpenSearch"
    technology: "Amazon OpenSearch"
    description: "High-performance keyword search and faceted catalog browsing."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "ACID-compliant transactional data storage with multi-region read replicas."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache (Redis)"
    description: "In-memory data store for caching."
  - type: "component"
    name: "Amazon SQS/SNS"
    technology: "Amazon SQS/SNS"
    description: "Messaging and event publishing service."
relationships:
  - source: "Catalog API Controller"
    destination: "Search Engine Adapter"
    description: "In-process method calls"
  - source: "Catalog API Controller"
    destination: "Inventory Manager"
    description: "In-process method calls"
  - source: "Search Engine Adapter"
    destination: "Amazon OpenSearch"
    description: "Query DSL over HTTPS"
  - source: "Inventory Manager"
    destination: "Amazon Aurora PostgreSQL"
    description: "PostgreSQL Wire Protocol via TCP"
  - source: "Catalog Cache Layer"
    destination: "Amazon ElastiCache (Redis)"
    description: "RESP protocol via TCP"
  - source: "Inventory Write-Through / Event Publisher"
    destination: "Amazon SQS/SNS"
    description: "AWS SDK / HTTPS"