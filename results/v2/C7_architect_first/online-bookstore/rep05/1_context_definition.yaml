level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore System"
  description: "A globally distributed e-commerce platform designed to support 1 million monthly active users with multi-currency checkout, secure payments, and strict regulatory compliance."
elements:
  - type: "person"
    name: "Customers & Admins"
    description: "End-users browsing the catalog, making purchases, and internal support staff managing the platform."
  - type: "externalSystem"
    name: "Global Edge Layer"
    description: "CDN and edge routing layer with AWS WAF and AWS Shield for security and routing."
  - type: "externalSystem"
    name: "Stripe/PayPal"
    description: "Payment Gateway for secure payment processing."
  - type: "externalSystem"
    name: "FedEx/UPS"
    description: "Shipping APIs for order fulfillment and shipping."
  - type: "externalSystem"
    name: "SendGrid/AWS SES"
    description: "Notification Service for transactional messaging."
  - type: "externalSystem"
    name: "Fixer/Open Exchange Rates"
    description: "Currency Exchange Rate Provider for multi-currency support."
relationships:
  - source: "Customers & Admins"
    destination: "Global Edge Layer"
    description: "Accesses the platform via global edge routing"
    technology: "HTTPS / TLS 1.3 via Global Anycast DNS (AWS Route 53)"
  - source: "Global Edge Layer"
    destination: "Online Bookstore System"
    description: "Routes traffic to regional deployments"
    technology: "HTTPS / TLS 1.3"
  - source: "Online Bookstore System"
    destination: "Stripe/PayPal"
    description: "Processes secure payments and checkout"
    technology: "HTTPS / REST / mTLS 1.3"
  - source: "Online Bookstore System"
    destination: "FedEx/UPS"
    description: "Handles shipping and fulfillment integration"
    technology: "HTTPS / REST / mTLS 1.3"
  - source: "Online Bookstore System"
    destination: "Fixer/Open Exchange Rates"
    description: "Fetches currency exchange rates"
    technology: "HTTPS / REST / mTLS 1.3"
  - source: "Online Bookstore System"
    destination: "SendGrid/AWS SES"
    description: "Sends transactional messages and notifications"
    technology: "HTTPS / SMTP / TLS 1.3"