# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Amazon Aurora (PostgreSQL) Global Database container"
parentContainer:
  name: "Amazon Aurora (PostgreSQL) Global Database"
elements:
  - type: "component"
    name: "Primary Cluster Instance (Writer)"
    technology: "PostgreSQL"
    description: "Handles write operations and transactional data for the core e-commerce platform."
  - type: "component"
    name: "Cross-Region Read Replica Instances"
    technology: "PostgreSQL"
    description: "Handles regional read operations and personalized queries to reduce latency."
  - type: "component"
    name: "Aurora Storage Volume"
    technology: "Distributed Storage"
    description: "Provides scalable, replicated storage underlying the Aurora database clusters."
  - type: "component"
    name: "PostgreSQL Extension Manager"
    technology: "PostgreSQL Extension"
    description: "Manages database extensions for specialized functions and data types."
relationships:
  - source: "Primary Cluster Instance (Writer)"
    destination: "Aurora Storage Volume"
    description: "Persists transactional data"
  - source: "Cross-Region Read Replica Instances"
    destination: "Aurora Storage Volume"
    description: "Replicates data globally"