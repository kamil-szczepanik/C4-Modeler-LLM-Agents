level: component
scope: "Component diagram for the Core E-Commerce API container"
parentContainer:
  name: "Core E-Commerce API"
elements:
  - type: "component"
    name: "Catalog Component"
    technology: "Express Router, pg query builder"
    description: "Manages book browsing and keyword search."
  - type: "component"
    name: "Cart Management Component"
    technology: "In-memory session manager, Amazon ElastiCache"
    description: "Handles ephemeral shopping carts and promotional discounts."
  - type: "component"
    name: "Order & Checkout Component"
    technology: "Domain service module"
    description: "Handles secure checkout, tax calculation, payment processing, and inventory reservation."
  - type: "component"
    name: "Fulfillment Component"
    technology: "Integration adapter"
    description: "Manages shipping provider APIs and tracking data."
  - type: "component"
    name: "Amazon API Gateway"
    technology: "AWS App Mesh, HTTPS"
    description: "Routes validated HTTP requests."
  - type: "component"
    name: "Amazon Aurora (PostgreSQL)"
    technology: "TCP, SQL"
    description: "Relational database for durable transactional data."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Redis RESP"
    description: "In-memory cache for sub-millisecond cart retrieval and session management."
  - type: "component"
    name: "Tax Calculation Service"
    technology: "HTTPS, REST"
    description: "External service for calculating taxes during checkout."
  - type: "component"
    name: "Payment Gateway"
    technology: "HTTPS, REST"
    description: "External service for processing payments."
  - type: "component"
    name: "Notification Service"
    technology: "HTTPS, REST"
    description: "External service for sending transaction notifications."
  - type: "component"
    name: "Shipping Provider API"
    technology: "HTTPS, REST"
    description: "External shipping provider API for order fulfillment and tracking."
relationships:
  - source: "Amazon API Gateway"
    destination: "Core E-Commerce API"
    description: "Routes validated HTTP requests using HTTPS via AWS App Mesh."
  - source: "Catalog Component"
    destination: "Amazon Aurora (PostgreSQL)"
    description: "Queries catalog data via TCP/SQL."
  - source: "Catalog Component"
    destination: "Amazon ElastiCache (Redis)"
    description: "Queries catalog data via Redis RESP."
  - source: "Cart Management Component"
    destination: "Amazon ElastiCache (Redis)"
    description: "Stores session and cart states via Redis RESP."
  - source: "Order & Checkout Component"
    destination: "Tax Calculation Service"
    description: "Communicates via HTTPS/REST."
  - source: "Order & Checkout Component"
    destination: "Payment Gateway"
    description: "Communicates via HTTPS/REST."
  - source: "Order & Checkout Component"
    destination: "Notification Service"
    description: "Communicates via HTTPS/REST."
  - source: "Fulfillment Component"
    destination: "Shipping Provider API"
    description: "Manages order fulfillment via HTTPS/REST."