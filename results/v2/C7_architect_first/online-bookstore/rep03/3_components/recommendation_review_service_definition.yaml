level: component
scope: "Component diagram for the Recommendation & Review Service container"
parentContainer:
  name: "Recommendation & Review Service"
elements:
  - type: "component"
    name: "API Controller Component"
    technology: "Python, FastAPI"
    description: "Handles incoming API requests and delegates operations."
  - type: "component"
    name: "Review Management Component"
    technology: "Python"
    description: "Manages customer reviews and publishes review events."
  - type: "component"
    name: "Recommendation Aggregator Component"
    technology: "Python"
    description: "Aggregates product recommendations and interacts with third-party engines and caches."
  - type: "component"
    name: "Data Access Repository Component"
    technology: "Python, async SQLAlchemy"
    description: "Persists and queries data from the database securely via TLS 1.3."
  - type: "component"
    name: "Caching / Fallback Store Component"
    technology: "Amazon ElastiCache Redis"
    description: "Reads and writes cached recommendations and heuristics fallback."
  - type: "component"
    name: "Review Event Consumer Component"
    technology: "Amazon SQS / SNS"
    description: "Publishes and processes review events asynchronously with Dead-Letter Queues."
  - type: "component"
    name: "Third-Party Recommendation Engine"
    technology: "External System"
    description: "Fetches product suggestions via HTTPS/REST with circuit breaker."
  - type: "component"
    name: "Core E-Commerce API"
    technology: "External System"
    description: "Invokes endpoints on the API Controller using gRPC over mTLS."
  - type: "component"
    name: "Amazon Aurora (PostgreSQL) Global Database"
    technology: "PostgreSQL"
    description: "Distributed relational storage with multi-region replication."
relationships:
  - source: "Core E-Commerce API"
    destination: "API Controller Component"
    description: "Invokes endpoints [gRPC over mTLS]"
  - source: "API Controller Component"
    destination: "Review Management Component"
    description: "Delegates operations [In-process]"
  - source: "API Controller Component"
    destination: "Recommendation Aggregator Component"
    description: "Delegates operations [In-process]"
  - source: "Recommendation Aggregator Component"
    destination: "Third-Party Recommendation Engine"
    description: "Fetches product suggestions [HTTPS/REST with circuit breaker]"
  - source: "Recommendation Aggregator Component"
    destination: "Caching / Fallback Store Component"
    description: "Reads/writes cached recommendations [Redis TLS]"
  - source: "Review Management Component"
    destination: "Data Access Repository Component"
    description: "Persists and queries data [Async SQLAlchemy via TLS 1.3]"
  - source: "Recommendation Aggregator Component"
    destination: "Data Access Repository Component"
    description: "Persists and queries data [Async SQLAlchemy via TLS 1.3]"
  - source: "Review Management Component"
    destination: "Review Event Consumer Component"
    description: "Publishes review events [Amazon SQS / SNS]"
  - source: "Data Access Repository Component"
    destination: "Amazon Aurora (PostgreSQL) Global Database"
    description: "Persists and queries relational data"