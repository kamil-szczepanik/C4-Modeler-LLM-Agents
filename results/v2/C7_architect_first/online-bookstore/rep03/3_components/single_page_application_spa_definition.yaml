level: component
scope: "Component diagram for the Single Page Application (SPA) container"
parentContainer:
  name: "Single Page Application (SPA)"
elements:
  - type: "component"
    name: "Routing & View Manager"
    technology: "React Router"
    description: "Handles client-side routing and lazy-loading for performance."
  - type: "component"
    name: "Catalog & Search Module"
    technology: "React"
    description: "Delivers high-performance catalog browsing and search."
  - type: "component"
    name: "Cart & Checkout Module"
    technology: "React"
    description: "Manages secure checkout and cart operations."
  - type: "component"
    name: "Auth & Session Context"
    technology: "React Context"
    description: "Manages user authentication and session state with in-memory token handling."
  - type: "component"
    name: "State Management Layer"
    technology: "Zustand / React Context"
    description: "Provides lightweight state management for optimistic UI updates."
  - type: "component"
    name: "Analytics & Tracking Wrapper"
    technology: "React"
    description: "Dispatches async tracking and analytics events."
  - type: "component"
    name: "Amazon S3 & Amazon CloudFront (CDN)"
    technology: "AWS S3, CloudFront, Lambda@Edge"
    description: "Global static asset hosting and CDN delivery with geo-based currency routing and security headers."
  - type: "component"
    name: "Amazon API Gateway"
    technology: "AWS API Gateway"
    description: "Provides API endpoint access via HTTPS/JSON using Axios."
relationships:
  - source: "Routing & View Manager"
    destination: "Catalog & Search Module"
    description: "In-memory routing"
  - source: "Routing & View Manager"
    destination: "Cart & Checkout Module"
    description: "In-memory routing"
  - source: "Cart & Checkout Module"
    destination: "State Management Layer"
    description: "In-memory state sync"
  - source: "Routing & View Manager"
    destination: "Analytics & Tracking Wrapper"
    description: "Async event dispatch"
  - source: "Catalog & Search Module"
    destination: "Analytics & Tracking Wrapper"
    description: "Async event dispatch"
  - source: "Cart & Checkout Module"
    destination: "Analytics & Tracking Wrapper"
    description: "Async event dispatch"
  - source: "Auth & Session Context"
    destination: "Analytics & Tracking Wrapper"
    description: "Async event dispatch"
  - source: "State Management Layer"
    destination: "Analytics & Tracking Wrapper"
    description: "Async event dispatch"
  - source: "Routing & View Manager"
    destination: "Amazon API Gateway"
    description: "HTTPS/JSON via Axios"
  - source: "Catalog & Search Module"
    destination: "Amazon API Gateway"
    description: "HTTPS/JSON via Axios"
  - source: "Cart & Checkout Module"
    destination: "Amazon API Gateway"
