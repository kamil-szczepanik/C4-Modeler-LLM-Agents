level: component
scope: "Component diagram for the Amazon API Gateway container"
parentContainer:
  name: "Amazon API Gateway"
elements:
  - type: "component"
    name: "Request Validator"
    technology: "Amazon API Gateway Built-in Validation / AWS WAF"
    description: "Validates incoming client requests and enforces input sanitization."
  - type: "component"
    name: "Router and Authorizer"
    technology: "AWS Lambda / JWT (OIDC/OAuth 2.0)"
    description: "Validates user tokens and handles routing logic."
  - type: "component"
    name: "Throttling and Rate Limiting"
    technology: "Amazon API Gateway Usage Plans and Throttling"
    description: "Controls request rates to protect backend services from surges."
  - type: "component"
    name: "Transform and Edge Routing"
    technology: "Amazon API Gateway Mappings / AWS App Mesh"
    description: "Transforms and routes sanitized requests with currency context to backend services."
  - type: "component"
    name: "Edge Caching"
    technology: "Amazon API Gateway Caching"
    description: "Caches responses at the edge to ensure low-latency performance."
relationships:
  - source: "Request Validator"
    destination: "Router and Authorizer"
    description: "Passes validated and sanitized request"
  - source: "Router and Authorizer"
    destination: "Identity Provider"
    description: "Validates user tokens [OIDC/OAuth 2.0]"
  - source: "Router and Authorizer"
    destination: "Throttling and Rate Limiting"
    description: "Checks rate limits"
  - source: "Throttling and Rate Limiting"
    destination: "Transform and Edge Routing"
    description: "Allows throttled and authorized requests"
  - source: "Transform and Edge Routing"
    destination: "Edge Caching"
    description: "Retrieves or stores cached content"
  - source: "Transform and Edge Routing"
    destination: "Core E-Commerce API"
    description: "Routes validated, sanitized requests with currency context [HTTPS via AWS App Mesh/ECS Service Connect using mTLS or AWS IAM SigV4]"