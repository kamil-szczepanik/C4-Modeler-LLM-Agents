level: component
scope: "Component diagram for the Amazon ElastiCache (Redis) container"
parentContainer:
  name: "Amazon ElastiCache (Redis)"
elements:
  - type: "component"
    name: "Redis Cluster Engine"
    technology: "Amazon ElastiCache (Redis OSS) with Primary and Replica nodes"
    description: "Multi-AZ caching engine ensuring high availability, failover management, and sub-millisecond latency."
  - type: "component"
    name: "Session Store Module"
    technology: "Redis Keyspace (`sess:*`) with AWS KMS encryption"
    description: "Stores encrypted user sessions and shopping carts for sub-millisecond lookups and zero cart data loss."
  - type: "component"
    name: "Catalogue Cache Module"
    technology: "Redis Keyspace (`cat:*`) with LRU eviction"
    description: "Caches product metadata and search facets to support read-heavy catalog operations without cache thrashing."
relationships:
  - source: "Session Store Module"
    destination: "Redis Cluster Engine"
    description: "Operates on primary and replica shards with TLS 1.3 encryption and AOF persistence"
  - source: "Catalogue Cache Module"
    destination: "Redis Cluster Engine"
    description: "Utilizes LRU eviction policies and multi-AZ replication across shards"