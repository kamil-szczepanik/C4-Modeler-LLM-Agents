level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Customer"
    description: "End user who browses the catalog, makes purchases, leaves reviews, and receives personalized recommendations."
  - type: "person"
    name: "Admin / Content Manager"
    description: "User responsible for managing system content, catalog, and administrative tasks."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service for processing secure transactions."
  - type: "externalSystem"
    name: "Shipping Provider API"
    description: "External fulfillment and tracking service."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External service for sending notifications."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "External service for real-time tax evaluation."
  - type: "externalSystem"
    name: "Third-Party Recommendation Engine"
    description: "External recommendation engine providing product suggestions."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External service for authentication and MFA."
  - type: "container"
    name: "Single Page Application (SPA)"
    technology: "React, Amazon CloudFront, Amazon S3"
    description: "Client-side rendering and global CDN for sub-2s page load SLA."
  - type: "container"
    name: "Amazon API Gateway"
    technology: "AWS API Gateway, JWT"
    description: "Ingress interface handling client requests with JWT validation."
  - type: "container"
    name: "Core E-Commerce API"
    technology: "Node.js, Express, Amazon ECS (Fargate)"
    description: "Microservice handling core e-commerce business logic."
  - type: "container"
    name: "Recommendation & Review Service"
    technology: "Python, FastAPI, Amazon ECS (Fargate)"
    description: "Microservice handling async recommendations and reviews."
  - type: "container"
    name: "Amazon Aurora (PostgreSQL) Global Database"
    technology: "Amazon Aurora PostgreSQL"
    description: "Transactional storage with cross-region replication for GDPR data residency."
  - type: "container"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache Redis"
    description: "Write-through session and catalogue caching for persistent carts and low latency."
relationships:
  - source: "Customer"
    destination: "Single Page Application (SPA)"
    description: "Browses catalog, manages cart, and places orders"
    technology: "HTTPS/JSON"
  - source: "Admin / Content Manager"
    destination: "Single Page Application (SPA)"
    description: "Manages system content and catalog"
    technology: "HTTPS/JSON"
  - source: "Single Page Application (SPA)"
    destination: "Amazon API Gateway"
    description: "Sends client API requests"
    technology: "HTTPS/JSON"
  - source: "Amazon API Gateway"
    destination: "Core E-Commerce API"
    description: "Routes validated requests"
    technology: "HTTPS via AWS App Mesh/ECS Service Connect"
  - source: "Core E-Commerce API"
    destination: "Recommendation & Review Service"
    description: "Fetches recommendations and reviews"
    technology: "gRPC over mTLS"
  - source: "Core E-Commerce API"
    destination: "Amazon Aurora (PostgreSQL) Global Database"
    description: "Reads and writes transactional data"
    technology: "TLS 1.3 with AES-256"
  - source: "Core E-Commerce API"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches sessions and catalog data"
    technology: "TLS 1.3 with AES-256"
  - source: "Recommendation & Review Service"
    destination: "Amazon Aurora (PostgreSQL) Global Database"
    description: "Reads and writes recommendation and review data"
    technology: "TLS 1.3 with AES-256"
  - source: "Core E-Commerce API"
    destination: "Payment Gateway"
    description: "Processes transactions"
    technology: "HTTPS/REST"
  - source: "Core E-Commerce API"
    destination: "Shipping Provider API"
    description: "Manages fulfillment and tracking"
    technology: "HTTPS/REST"
  - source: "Core E-Commerce API"
    destination: "Notification Service"
    description: "Sends user notifications"
    technology: "HTTPS/REST"
  - source: "Core E-Commerce API"
    destination: "Tax Calculation Service"
    description: "Calculates real-time taxes"
    technology: "HTTPS/REST"
  - source: "Recommendation & Review Service"
    destination: "Third-Party Recommendation Engine"
    description: "Fetches third-party product suggestions"
    technology: "HTTPS/REST"
  - source: "Amazon API Gateway"
    destination: "Identity Provider"
    description: "Validates user authentication and tokens"
    technology: "OIDC/OAuth 2.0"