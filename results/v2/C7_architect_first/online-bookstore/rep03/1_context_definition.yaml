level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "A globally distributed e-commerce platform built on AWS to serve 1 million Monthly Active Users with high availability and stringent regulatory compliance, providing catalog browsing, secure checkout, personalized recommendations, and reviews."
elements:
  - type: "person"
    name: "Customer"
    description: "End user who browses the catalog, makes purchases, leaves reviews, and receives personalized recommendations."
  - type: "person"
    name: "Admin / Content Manager"
    description: "User responsible for managing system content, catalog, and administrative tasks."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service (Stripe/PayPal) for processing secure transactions."
  - type: "externalSystem"
    name: "Shipping Provider API"
    description: "External fulfillment and tracking service (FedEx/UPS)."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External service (SendGrid/AWS SES) for sending notifications."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "External service (Avalara/TaxJar) for real-time tax evaluation."
  - type: "externalSystem"
    name: "Third-Party Recommendation Engine"
    description: "External recommendation engine providing product suggestions."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External service (Auth0/AWS Cognito) for authentication and MFA."
relationships:
  - source: "Customer"
    destination: "Online Bookstore System"
    description: "Browsing and purchasing products"
    technology: "HTTPS (Web/Mobile)"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Transaction processing"
    technology: "HTTPS/REST"
  - source: "Online Bookstore System"
    destination: "Shipping Provider API"
    description: "Fulfillment and tracking"
    technology: "HTTPS/REST"
  - source: "Online Bookstore System"
    destination: "Tax Calculation Service"
    description: "Real-time tax evaluation"
    technology: "HTTPS/REST (synchronous)"
  - source: "Online Bookstore System"
    destination: "Third-Party Recommendation Engine"
    description: "Product suggestions"
    technology: "HTTPS/REST with <200ms timeout"
  - source: "Online Bookstore System"
    destination: "Identity Provider"
    description: "Authentication and MFA"
    technology: "OIDC/OAuth 2.0"