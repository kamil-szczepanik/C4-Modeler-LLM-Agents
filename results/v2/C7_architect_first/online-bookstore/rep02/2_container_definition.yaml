level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Guest Buyer"
    description: "Unauthenticated visitor browsing the catalog and adding items to the cart."
  - type: "person"
    name: "Registered Buyer"
    description: "Authenticated customer purchasing books, writing reviews, and managing account details."
  - type: "person"
    name: "Store Administrator"
    description: "User managing store operations, catalog data, and platform settings."
  - type: "person"
    name: "Third-Party Vendor/Publisher"
    description: "External partner managing inventory, listings, and digital publications."
  - type: "externalSystem"
    name: "Stripe/PayPal"
    description: "Payment Gateway handling secure financial transactions."
  - type: "externalSystem"
    name: "FedEx/UPS"
    description: "Shipping Provider API handling physical book fulfillment and tracking."
  - type: "externalSystem"
    name: "AWS SES"
    description: "Email and Notification Service for user communications."
  - type: "externalSystem"
    name: "AWS Cognito/Auth0"
    description: "Identity Provider for user authentication and authorization."
  - type: "container"
    name: "Single Page Application"
    technology: "React.js, AWS S3, CloudFront"
    description: "High-performance frontend delivery for <2s page load times."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway, AWS Cognito JWT validation"
    description: "Scalable entry point with secure JWT validation."
  - type: "container"
    name: "Core E-Commerce Container"
    technology: "Node.js / TypeScript, Amazon ECS with AWS Fargate"
    description: "Handles core e-commerce functionalities and transactions."
  - type: "container"
    name: "Recommendation & Review Container"
    technology: "Python, FastAPI, Amazon ECS with AWS Fargate"
    description: "Handles book recommendations and user reviews."
  - type: "container"
    name: "Tax & Currency Container"
    technology: "Node.js, Amazon ECS with AWS Fargate"
    description: "Manages multi-currency calculations and taxation."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Transactional relational database with global replication and geo-fencing."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Low-latency NoSQL storage for catalog and operational data."
  - type: "container"
    name: "Amazon ElastiCache Redis"
    technology: "Amazon ElastiCache Redis"
    description: "Local caching for recommendations to protect performance."
  - type: "container"
    name: "Event Bus & Integration"
    technology: "Amazon SQS / SNS"
    description: "Asynchronous messaging and event distribution."
relationships:
  - source: "Guest Buyer"
    destination: "Single Page Application"
    description: "Browses catalog and interacts via web"
    technology: "HTTPS / WSS"
  - source: "Registered Buyer"
    destination: "Single Page Application"
    description: "Purchases books, manages account, and leaves reviews"
    technology: "HTTPS / WSS"
  - source: "Store Administrator"
    destination: "Single Page Application"
    description: "Manages store operations and catalog"
    technology: "HTTPS / WSS"
  - source: "Third-Party Vendor/Publisher"
    destination: "API Gateway"
    description: "Manages inventory and product listings via APIs"
    technology: "HTTPS"
  - source: "Single Page Application"
    destination: "API Gateway"
    description: "Sends API requests and handles authentication"
    technology: "HTTPS / WSS"
  - source: "API Gateway"
    destination: "Core E-Commerce Container"
    description: "Routes requests to core e-commerce services"
    technology: "gRPC / HTTPS via Internal VPC Application Load Balancers"
  - source: "API Gateway"
    destination: "Recommendation & Review Container"
    description: "Routes requests for recommendations and reviews"
    technology: "gRPC / HTTPS via Internal VPC Application Load Balancers"
  - source: "API Gateway"
    destination: "Tax & Currency Container"
    description: "Routes requests for tax and currency calculations"
    technology: "gRPC / HTTPS via Internal VPC Application Load Balancers"
  - source: "Core E-Commerce Container"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes transactional data"
    technology: "PostgreSQL wire protocol"
  - source: "Core E-Commerce Container"
    destination: "Amazon DynamoDB"
    description: "Reads and writes low-latency operational data"
    technology: "DynamoDB API"
  - source: "Recommendation & Review Container"
    destination: "Amazon ElastiCache Redis"
    description: "Caches recommendation data"
    technology: "Redis protocol"
  - source: "Core E-Commerce Container"
    destination: "Event Bus & Integration"
    description: "Publishes and consumes asynchronous events"
    technology: "Amazon SQS / SNS"
  - source: "API Gateway"
    destination: "AWS Cognito/Auth0"
    description: "Validates user JWT tokens"
    technology: "OIDC/OAuth2 over HTTPS/JWT"
  - source: "Core E-Commerce Container"
    destination: "Stripe/PayPal"
    description: "Processes secure payments"
    technology: "Outbound HTTPS/REST"
  - source: "Core E-Commerce Container"
    destination: "FedEx/UPS"
    description: "Coordinates physical shipping and fulfillment"
    technology: "Outbound HTTPS/REST"
  - source: "Core E-Commerce Container"
    destination: "AWS SES"
    description: "Sends transactional emails and notifications"
    technology: "Outbound HTTPS/API"