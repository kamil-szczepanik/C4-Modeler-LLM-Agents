level: component
scope: "Component diagram for the Core E-Commerce Container container"
parentContainer:
  name: "Core E-Commerce Container"
elements:
  - type: "component"
    name: "Catalogue Component"
    technology: "NestJS / TypeORM"
    description: "NestJS module managing product browsing and search via TypeORM."
  - type: "component"
    name: "Cart & Checkout Component"
    technology: "NestJS"
    description: "NestJS module handling ephemeral cart states and tokenized payment processing."
  - type: "component"
    name: "Order Fulfillment Component"
    technology: "NestJS"
    description: "Manages order state transitions and third-party logistics integration."
  - type: "component"
    name: "Customer Notification Component"
    technology: "NestJS / AWS SES"
    description: "Handles transactional communications via AWS SES."
relationships:
  - source: "Catalogue Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes product data via PostgreSQL wire protocol"
  - source: "Cart & Checkout Component"
    destination: "Amazon ElastiCache Redis"
    description: "Manages cart state and session management"
  - source: "Cart & Checkout Component"
    destination: "Stripe/PayPal"
    description: "Processes tokenized payments via Outbound HTTPS/REST"
  - source: "Order Fulfillment Component"
    destination: "FedEx/UPS"
    description: "Integrates with third-party logistics via Outbound HTTPS/REST"
  - source: "Order Fulfillment Component"
    destination: "Amazon DynamoDB"
    description: "Stores order data via DynamoDB API"
  - source: "Customer Notification Component"
    destination: "AWS SES"
    description: "Sends transactional communications via Outbound HTTPS/API"
  - source: "Core E-Commerce Container"
    destination: "Amazon SQS/SNS"
    description: "Publishes asynchronous events"