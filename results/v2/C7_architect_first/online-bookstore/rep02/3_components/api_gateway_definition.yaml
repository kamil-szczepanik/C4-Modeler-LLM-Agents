level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Request Router / Reverse Proxy"
    technology: "AWS API Gateway / Envoy Proxy"
    description: "Terminates TLS, enforces rate limits, handles CORS, and inspects locale headers for multi-currency routing."
  - type: "component"
    name: "Authentication & Authorization Filter Component"
    technology: "AWS Cognito / Auth0"
    description: "Validates JWT tokens against AWS Cognito/Auth0 and executes user-ID-based rate limiting and RBAC."
  - type: "component"
    name: "Request/Response Transformation Component"
    technology: "Custom Middleware / AWS Lambda"
    description: "Performs schema validation, payload sanitization, and dynamic PII masking for GDPR compliance."
  - type: "component"
    name: "Circuit Breaker & Traffic Management Component"
    technology: "Envoy Proxy Circuit Breaker"
    description: "Implements adaptive traffic shedding to prioritize checkout traffic during high-load events."
  - type: "component"
    name: "Telemetry & Analytics Interceptor"
    technology: "AWS CloudWatch / SQS"
    description: "Asynchronously scrubs and streams anonymized usage metrics to the event bus."
relationships:
  - source: "Request Router / Reverse Proxy"
    destination: "Authentication & Authorization Filter Component"
    description: "Validates incoming authentication tokens [Internal In-Memory / gRPC]"
  - source: "Circuit Breaker & Traffic Management Component"
    destination: "Core E-Commerce Container"
    description: "Forwards prioritized requests [gRPC over internal Application Load Balancers with mTLS]"
  - source: "Circuit Breaker & Traffic Management Component"
    destination: "Recommendation & Review Container"
    description: "Forwards prioritized requests [gRPC over internal Application Load Balancers with mTLS]"
  - source: "Circuit Breaker & Traffic Management Component"
    destination: "Tax & Currency Container"
    description: "Forwards prioritized requests [gRPC over internal Application Load Balancers with mTLS]"
  - source: "Telemetry & Analytics Interceptor"
    destination: "Event Bus & Integration"
    description: "Publishes decoupled usage and analytics metrics [HTTPS]"