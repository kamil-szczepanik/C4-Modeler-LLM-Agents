level: component
scope: "Component diagram for the Amazon ElastiCache Redis container"
parentContainer:
  name: "Amazon ElastiCache Redis"
elements:
  - type: "component"
    name: "Rate Limiter Component"
    technology: "Amazon ElastiCache Redis OSS (volatile-ttl)"
    description: "Evaluates and enforces rate-limiting counters for API Gateway requests."
  - type: "component"
    name: "Cart Cache Component"
    technology: "Amazon ElastiCache Redis OSS (noeviction)"
    description: "Persists active shopping sessions and cart state for the Core E-Commerce container."
  - type: "component"
    name: "Recommendation Cache Component"
    technology: "Amazon ElastiCache Redis OSS (allkeys-lru)"
    description: "Reads and writes pre-computed product recommendations for the Recommendation & Review container."
relationships:
  - source: "Rate Limiter Component"
    destination: "Cart Cache Component"
    description: "Segregates cache workloads to prevent cross-component memory exhaustion [RESP over TLS 1.3]."
  - source: "Cart Cache Component"
    destination: "Recommendation Cache Component"
    description: "Maintains isolated memory spaces for independent microservices workloads [RESP over TLS 1.3]."