level: component
scope: "Component diagram for the Tax & Currency Container container"
parentContainer:
  name: "Tax & Currency Container"
elements:
  - type: "component"
    name: "Tax Calculation Component"
    technology: "Node.js"
    description: "Calculates localized taxes and interacts with external tax APIs."
  - type: "component"
    name: "Currency Conversion Component"
    technology: "Node.js"
    description: "Handles multi-currency conversions and interfaces with caching layers."
relationships:
  - source: "Tax Calculation Component"
    destination: "External Tax API (Avalara/TaxJar)"
    description: "HTTPS / REST with TLS 1.3"
  - source: "Currency Conversion Component"
    destination: "Amazon ElastiCache Redis"
    description: "TCP with TLS and AWS KMS encryption"