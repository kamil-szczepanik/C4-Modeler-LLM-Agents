level: component
scope: "Component diagram for the Recommendation & Review Container container"
parentContainer:
  name: "Recommendation & Review Container"
elements:
  - type: "component"
    name: "Review API Component"
    technology: "Python, FastAPI, Pydantic"
    description: "FastAPI application handling review CRUD operations, moderation flags, and verified purchase badging."
  - type: "component"
    name: "Recommendation Query Component"
    technology: "Python, FastAPI, Pydantic"
    description: "FastAPI application serving low-latency 'Customers also bought' suggestions."
  - type: "component"
    name: "Recommendation Worker Component"
    technology: "Python, Background Worker"
    description: "Decoupled Python background worker processing purchase events."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Relational Database"
    description: "Relational database for persistent storage of reviews and purchase histories."
  - type: "component"
    name: "Amazon ElastiCache Redis"
    technology: "Redis, Multi-AZ"
    description: "In-memory cache for fast recommendation lookups with Multi-AZ replication."
  - type: "component"
    name: "Amazon SQS / SNS"
    technology: "AWS SQS / SNS"
    description: "Event bus used for triggering background workers and publishing analytics."
  - type: "component"
    name: "API Gateway"
    technology: "API Gateway"
    description: "Routes HTTP/REST requests to internal APIs."
relationships:
  - source: "API Gateway"
    destination: "Review API Component"
    description: "Routes HTTP/REST requests [HTTPS]"
  - source: "API Gateway"
    destination: "Recommendation Query Component"
    description: "Routes HTTP/REST requests [HTTPS]"
  - source: "Review API Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes transactional data [TCP / PostgreSQL Wire Protocol with TLS]"
  - source: "Recommendation Query Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes transactional data [TCP / PostgreSQL Wire Protocol with TLS]"
  - source: "Recommendation Query Component"
    destination: "Amazon ElastiCache Redis"
    description: "Fetches cached recommendations [Redis TCP with TLS and AUTH]"
  - source: "Amazon SQS / SNS"
    destination: "Recommendation Worker Component"
    description: "Triggers asynchronous background model updates [AWS SDK / SQS API]"
  - source: "Recommendation Query Component"
    destination: "Amazon SQS / SNS"
    description: "Logs impression and click-through metrics [AWS SDK]"