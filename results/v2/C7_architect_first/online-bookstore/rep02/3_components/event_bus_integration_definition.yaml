level: component
scope: "Component diagram for the Event Bus & Integration container"
parentContainer:
  name: "Event Bus & Integration"
elements:
  - type: "component"
    name: "Event Router"
    technology: "AWS EventBridge"
    description: "Provides content-based asynchronous event routing across microservices."
  - type: "component"
    name: "Notification Queue"
    technology: "Amazon SQS & DLQs"
    description: "Handles asynchronous backpressure and isolation of poisoned messages."
  - type: "component"
    name: "Integration Dispatcher"
    technology: "AWS Lambda"
    description: "Performs secure third-party webhook dispatching and PII tokenization."
  - type: "component"
    name: "Audit Streamer"
    technology: "Amazon Kinesis Data Firehose"
    description: "Streams order lifecycle events for high-throughput, scalable audit logging."
  - type: "component"
    name: "Notification Status Tracker"
    technology: "Amazon DynamoDB / AWS Lambda"
    description: "Tracks notification status and integrates with storage."
  - type: "component"
    name: "Secure Analytics Store"
    technology: "Amazon S3"
    description: "Persists immutable audit logs."
  - type: "system"
    name: "Core E-Commerce Container"
    technology: "Microservices"
    description: "Publishes domain events."
relationships:
  - source: "Core E-Commerce Container"
    destination: "Event Router"
    description: "Publishes domain events [JSON over AWS SNS/EventBridge]"
  - source: "Event Router"
    destination: "Notification Queue"
    description: "Forwards background tasks [AWS SQS]"
  - source: "Notification Queue"
    destination: "Integration Dispatcher"
    description: "Triggers asynchronous processing [AWS Lambda Event Source Mapping]"
  - source: "Event Router"
    destination: "Audit Streamer"
    description: "Streams order lifecycle events [AWS EventBridge Target / Kinesis]"
  - source: "Audit Streamer"
    destination: "Secure Analytics Store"
    description: "Persists immutable audit logs [HTTPS / AWS S3 API]"