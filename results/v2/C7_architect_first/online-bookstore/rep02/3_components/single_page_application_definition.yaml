level: component
scope: "Component diagram for the Single Page Application container"
parentContainer:
  name: "Single Page Application"
elements:
  - type: "component"
    name: "Router Component"
    technology: "React Router v6"
    description: "Handles client-side navigation with code-splitting for <2s page load times."
  - type: "component"
    name: "State Management Store"
    technology: "Zustand"
    description: "Lightweight state management ensuring tokens are kept strictly in-memory for security."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios"
    description: "HTTP client with interceptors for JWT injection and multi-currency headers."
  - type: "component"
    name: "Feature Modules"
    technology: "React.js"
    description: "Includes Catalog Browser, Checkout Flow, Review Manager, and Recommendation Widget."
  - type: "component"
    name: "External Infrastructure"
    technology: "AWS S3, AWS CloudFront, AWS API Gateway"
    description: "Static asset storage, global edge distribution, and backend API gateway entry point."
relationships:
  - source: "Router Component"
    destination: "Feature Modules"
    description: "Loads Feature Modules on-demand [In-Memory]"
  - source: "Feature Modules"
    destination: "State Management Store"
    description: "Read/write state [In-Memory]"
  - source: "Feature Modules"
    destination: "API Client Layer"
    description: "Invoke API Client Layer [TypeScript / HTTPS]"
  - source: "API Client Layer"
    destination: "External Infrastructure"
    description: "Sends requests to AWS API Gateway [HTTPS]"