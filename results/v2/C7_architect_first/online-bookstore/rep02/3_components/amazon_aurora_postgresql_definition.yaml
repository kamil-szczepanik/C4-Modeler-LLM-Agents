level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL container"
parentContainer:
  name: "Amazon Aurora PostgreSQL"
elements:
  - type: "component"
    name: "Writer Instance"
    technology: "Aurora PostgreSQL engine"
    description: "Primary Aurora PostgreSQL engine handling regional write traffic."
  - type: "component"
    name: "Reader Instances"
    technology: "Aurora PostgreSQL read replicas"
    description: "Aurora PostgreSQL read replicas scaled horizontally across availability zones."
  - type: "component"
    name: "Cluster Endpoint (Writer)"
    technology: "DNS routing component"
    description: "DNS routing component directing write traffic."
  - type: "component"
    name: "Reader Endpoint"
    technology: "Load-balanced DNS endpoint"
    description: "Load-balanced DNS endpoint for read queries."
  - type: "component"
    name: "Amazon RDS Proxy"
    technology: "Connection pooler"
    description: "Connection pooler securing and managing database connections."
  - type: "component"
    name: "Aurora Distributed Storage"
    technology: "Asynchronously replicated global storage layer"
    description: "Asynchronously replicated global storage layer across AWS regions."
relationships:
  - source: "Core E-Commerce Container"
    destination: "Cluster Endpoint (Writer)"
    description: "Transmits transactional writes [PostgreSQL wire protocol / TLS 1.3]."
  - source: "Core E-Commerce Container"
    destination: "Reader Endpoint"
    description: "Transmits read queries [PostgreSQL wire protocol / TLS 1.3]."
  - source: "Reader Endpoint"
    destination: "Amazon RDS Proxy"
    description: "Pools and forwards read traffic [PostgreSQL wire protocol]."
  - source: "Amazon RDS Proxy"
    destination: "Reader Instances"
    description: "Manages query distribution [PostgreSQL wire protocol]."