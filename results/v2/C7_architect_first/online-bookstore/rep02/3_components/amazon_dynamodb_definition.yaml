level: component
scope: "Component diagram for the Amazon DynamoDB container"
parentContainer:
  name: "Amazon DynamoDB"
elements:
  - type: "component"
    name: "Request Router / API Frontend"
    technology: "HTTPS / DynamoDB API"
    description: "Handles incoming requests from the Core E-Commerce Container for cart, catalog, and session data."
  - type: "component"
    name: "Partition Router & Storage Nodes"
    technology: "TCP / Consistent Hashing"
    description: "Routes internal RPC requests and manages data partitioning across storage nodes."
  - type: "component"
    name: "Storage Engine"
    technology: "B+-Tree & LSM-like indexing, Local PCIe/SATA"
    description: "Executes persistent B+-Tree updates and manages low-latency NoSQL datastore operations."
  - type: "component"
    name: "Streams Processor"
    technology: "DynamoDB Streams, Internal Memory Buffers"
    description: "Triggers change data capture events and publishes item-level modification events."
  - type: "component"
    name: "Global Tables"
    technology: "Multi-region active-active replication"
    description: "Provides active-active multi-region replication across us-east-1, eu-west-1, and ap-southeast-1."
relationships:
  - source: "Request Router / API Frontend"
    destination: "Partition Router & Storage Nodes"
    description: "Routes internal RPC requests [TCP / Consistent Hashing]"
  - source: "Partition Router & Storage Nodes"
    destination: "Storage Engine"
    description: "Executes persistent B+-Tree updates [Local PCIe/SATA]"
  - source: "Storage Engine"
    destination: "Streams Processor"
    description: "Triggers change data capture events [Internal Memory Buffers]"