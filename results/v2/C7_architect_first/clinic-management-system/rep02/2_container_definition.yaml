level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients who interact with the system for self-service scheduling and viewing lab results."
  - type: "person"
    name: "Doctors, Nurses, and Clinic Staff"
    description: "Clinical staff who access the system for patient care and management."
  - type: "person"
    name: "Hospital Administrators"
    description: "Administrative staff managing overall clinic operations."
  - type: "person"
    name: "Billing Specialists / Revenue Cycle Managers"
    description: "Staff handling billing and financial transactions."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service processing billing transactions."
  - type: "externalSystem"
    name: "Insurance Verification Service"
    description: "External service used for verifying patient insurance."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing laboratory and imaging data."
  - type: "externalSystem"
    name: "Public Health Registries"
    description: "External registries for public health reporting."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx / Envoy"
    description: "Handles entry routing, TLS termination, and rate limiting."
  - type: "container"
    name: "Identity & Access Management"
    technology: "Keycloak / OAuth2 Proxy"
    description: "Handles MFA and RBAC for system security."
  - type: "container"
    name: "Core Services"
    technology: "Spring Boot / Java"
    description: "Microservices for patient registration, scheduling, EMR with audit trails, and billing."
  - type: "container"
    name: "Integration Service"
    technology: "Node.js / Apache Camel"
    description: "Handles HL7 FHIR transformations and external communications."
  - type: "container"
    name: "Message Broker"
    technology: "Kafka / RabbitMQ"
    description: "Asynchronous messaging with Dead Letter Queues (DLQ) for billing retries and event-driven workflows."
  - type: "container"
    name: "Data Tier"
    technology: "PostgreSQL"
    description: "Regional active-passive transactional database with column-level AES-256 encryption."
  - type: "container"
    name: "Storage"
    technology: "WORM Object Storage"
    description: "Provides 10-year audit log retention for regulatory compliance."
relationships:
  - source: "Patients"
    destination: "API Gateway"
    description: "Accesses system features via self-service."
    technology: "HTTPS / gRPC over TLS"
  - source: "Doctors, Nurses, and Clinic Staff"
    destination: "API Gateway"
    description: "Accesses clinical and administrative workflows."
    technology: "HTTPS / gRPC over TLS"
  - source: "Hospital Administrators"
    destination: "API Gateway"
    description: "Accesses system management tools."
    technology: "HTTPS / gRPC over TLS"
  - source: "Billing Specialists / Revenue Cycle Managers"
    destination: "API Gateway"
    description: "Accesses billing functions."
    technology: "HTTPS / gRPC over TLS"
  - source: "API Gateway"
    destination: "Identity & Access Management"
    description: "Authenticates users and enforces authorization."
    technology: "OAuth2 / OpenID Connect"
  - source: "API Gateway"
    destination: "Core Services"
    description: "Routes internal API requests."
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Integration Service"
    description: "Routes integration requests."
    technology: "gRPC over mTLS"
  - source: "Core Services"
    destination: "Data Tier"
    description: "Persists and queries transactional data."
    technology: "SQL over encrypted connections"
  - source: "Core Services"
    destination: "Message Broker"
    description: "Publishes and consumes asynchronous billing and event messages."
    technology: "AMQP / Kafka with client-side envelope encryption over mTLS"
  - source: "Integration Service"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges health data."
    technology: "HL7 FHIR APIs over HTTPS"
  - source: "Clinic Management System"
    destination: "Payment Gateway"
    description: "Connects for billing transactions."
    technology: "REST over TLS 1.3"
  - source: "Clinic Management System"
    destination: "Insurance Verification Service"
    description: "Integrates for verifying insurance."
    technology: "REST and OAuth2 over HTTPS"
  - source: "Clinic Management System"
    destination: "Public Health Registries"
    description: "Integrates for public health reporting."
    technology: "REST and OAuth2 over HTTPS"
  - source: "Core Services"
    destination: "Storage"
    description: "Archives audit logs for long-term retention."
    technology: "Encrypted Object Storage Protocol"