level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "Manages patient admissions, electronic medical records (EMR), scheduling, and billing for medium-sized clinics via a hybrid cloud architecture."
elements:
  - type: "person"
    name: "Patients"
    description: "Patients who interact with the system for self-service scheduling and viewing lab results."
  - type: "person"
    name: "Doctors, Nurses, and Clinic Staff"
    description: "Clinical staff who access the system for patient care and management."
  - type: "person"
    name: "Hospital Administrators"
    description: "Administrative staff managing overall clinic operations."
  - type: "person"
    name: "Billing Specialists / Revenue Cycle Managers"
    description: "Staff handling billing and financial transactions."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service processing billing transactions."
  - type: "externalSystem"
    name: "Insurance Verification Service"
    description: "External service used for verifying patient insurance."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing laboratory and imaging data."
  - type: "externalSystem"
    name: "Public Health Registries"
    description: "External registries for public health reporting."
relationships:
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Interact with the system for self-service scheduling and lab results."
    technology: "HTTPS"
  - source: "Doctors, Nurses, and Clinic Staff"
    destination: "Clinic Management System"
    description: "Access the system for clinical and administrative workflows with Multi-Factor Authentication."
    technology: "HTTPS with MFA"
  - source: "Hospital Administrators"
    destination: "Clinic Management System"
    description: "Access the system for administrative management."
    technology: "HTTPS with MFA"
  - source: "Billing Specialists / Revenue Cycle Managers"
    destination: "Clinic Management System"
    description: "Access the system for managing billing and revenue."
    technology: "HTTPS with MFA"
  - source: "Clinic Management System"
    destination: "Payment Gateway"
    description: "Connects for billing transactions."
    technology: "REST over TLS 1.3"
  - source: "Clinic Management System"
    destination: "Insurance Verification Service"
    description: "Integrates for verifying insurance."
    technology: "REST and OAuth2 over HTTPS"
  - source: "External Lab & Imaging Systems"
    destination: "Clinic Management System"
    description: "Communicate platform data and lab results."
    technology: "HL7 FHIR over HTTPS/TLS"
  - source: "Clinic Management System"
    destination: "Public Health Registries"
    description: "Integrates for public health reporting."
    technology: "REST and OAuth2 over HTTPS"