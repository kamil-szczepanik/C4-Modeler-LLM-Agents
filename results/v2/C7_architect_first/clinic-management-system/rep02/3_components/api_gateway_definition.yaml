level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Router Component"
    technology: "Envoy"
    description: "Provides dynamic routing and strict mTLS for incoming traffic."
  - type: "component"
    name: "Authentication Filter Component"
    technology: "OAuth2 / OpenID Connect / JWT"
    description: "Authenticates users and validates tokens."
  - type: "component"
    name: "Rate Limiter Component"
    technology: "Envoy Rate Limiter"
    description: "Enforces rate limits on incoming requests."
  - type: "component"
    name: "Local Rate Limit Cache Component"
    technology: "In-Memory Cache"
    description: "Caches rate-limiting data locally for fast evaluation."
  - type: "component"
    name: "Telemetry & Audit Filter Component"
    technology: "Envoy Native Tracing"
    description: "Handles native tracing and PHI-sanitized audit logging."
relationships:
  - source: "Edge Router Component"
    destination: "Authentication Filter Component"
    description: "Passes requests for token validation"
  - source: "Authentication Filter Component"
    destination: "Rate Limiter Component"
    description: "Forwards authenticated requests for rate limit checks"
  - source: "Rate Limiter Component"
    destination: "Local Rate Limit Cache Component"
    description: "Queries local cache"
  - source: "Rate Limiter Component"
    destination: "Telemetry & Audit Filter Component"
    description: "Passes requests for telemetry and auditing"