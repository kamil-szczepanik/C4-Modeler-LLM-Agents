level: component
scope: "Component diagram for the Core Services container"
parentContainer:
  name: "Core Services"
elements:
  - type: "component"
    name: "Patient Registry Component"
    technology: "Spring Boot / Java"
    description: "Manages patient admissions, demographics, and registry data."
  - type: "component"
    name: "Scheduling Engine"
    technology: "Spring Boot / Java"
    description: "Handles appointment scheduling and emits lifecycle events."
  - type: "component"
    name: "EMR Management Component"
    technology: "Spring Boot / Java"
    description: "Manages electronic medical records, writes encrypted records, and creates audit logs."
  - type: "component"
    name: "Billing Processor"
    technology: "Spring Boot / Java"
    description: "Processes billing and revenue cycle operations."
relationships:
  - source: "EMR Management Component"
    destination: "Data Tier"
    description: "Writes encrypted patient records and tamper-evident audit logs via JDBC with AES-256."
  - source: "Scheduling Engine"
    destination: "Message Broker"
    description: "Emits appointment lifecycle events using Kafka."
  - source: "Core Services"
    destination: "WORM Storage"
    description: "Archives cryptographically signed audit logs for long-term retention."