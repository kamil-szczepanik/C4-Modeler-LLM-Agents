level: component
scope: "Component diagram for the Identity & Access Management container"
parentContainer:
  name: "Identity & Access Management"
elements:
  - type: "component"
    name: "Authentication Engine (Keycloak Core)"
    technology: "Keycloak Core"
    description: "Manages credentials, federation, and MFA to ensure robust IAM."
  - type: "component"
    name: "Token Service"
    technology: "JSON Web Tokens (JWT)"
    description: "Uses asymmetric keys (RS256/ES256) for stateless, secure session handling."
  - type: "component"
    name: "Policy Decision Point (PDP)"
    technology: "Java / Custom Policy Engine"
    description: "Evaluates access rules and fine-grained access control."
  - type: "component"
    name: "Audit Logger"
    technology: "Apache Kafka"
    description: "Publishes security events and handles asynchronous audit logging to meet 10-year retention rules."
  - type: "component"
    name: "Caching & Redis Cluster"
    technology: "Redis Cluster"
    description: "Provides in-memory caching for sub-millisecond RBAC evaluations."
  - type: "component"
    name: "User & Role Sync Service"
    technology: "Async Worker Service"
    description: "Syncs user roles asynchronously to the Redis cluster."
  - type: "component"
    name: "Identity Federation Adapter"
    technology: "OIDC / SAML"
    description: "Delegates external patient logins."
  - type: "container"
    name: "API Gateway"
    technology: "API Gateway Technology"
    description: "Entry point for external and internal requests."
  - type: "container"
    name: "Message Broker"
    technology: "Apache Kafka"
    description: "Handles asynchronous messaging and event streaming."
relationships:
  - source: "API Gateway"
    destination: "Token Service"
    description: "Validates incoming JWTs [gRPC / Internal REST]"
  - source: "Policy Decision Point (PDP)"
    destination: "Caching & Redis Cluster"
    description: "Evaluates access rules [Redis Protocol]"
  - source: "Audit Logger"
    destination: "Message Broker"
    description: "Publishes security events [Kafka Protocol]"
  - source: "Authentication Engine (Keycloak Core)"
    destination: "Identity Federation Adapter"
    description: "Delegates external patient logins [OIDC / SAML]"
  - source: "User & Role Sync Service"
    destination: "Caching & Redis Cluster"
    description: "Syncs user roles asynchronously [Redis Protocol]"