level: component
scope: "Component diagram for the Data Tier container"
parentContainer:
  name: "Data Tier"
elements:
  - type: "component"
    name: "Primary DB Instance"
    technology: "PostgreSQL 16"
    description: "Handling transactional writes and critical reads."
  - type: "component"
    name: "Replica DB Instances"
    technology: "PostgreSQL 16, Patroni"
    description: "Managed by Patroni for read-only EMR and reporting queries."
  - type: "component"
    name: "Audit Ledger Component"
    technology: "PostgreSQL 16 Partition, Row-Level Security"
    description: "WORM-enabled append-only database table partition."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Routing traffic and preventing connection starvation."
  - type: "component"
    name: "External KMS"
    technology: "HashiCorp Vault"
    description: "Managing per-record Data Encryption Keys (DEKs)."
relationships:
  - source: "Primary DB Instance"
    destination: "Replica DB Instances"
    description: "Synchronous/asynchronous data replication via Patroni."