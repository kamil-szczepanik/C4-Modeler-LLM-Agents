level: component
scope: "Component diagram for the Storage container"
parentContainer:
  name: "Storage"
elements:
  - type: "component"
    name: "Core Services"
    technology: "Spring Boot / Java"
    description: "Manages patient admissions, EMRs, scheduling, and billing while ensuring strict HIPAA and GDPR compliance."
  - type: "component"
    name: "Ingestion & Validation Engine"
    technology: "Node.js"
    description: "Powers high-throughput request handling and payload ingestion."
  - type: "component"
    name: "Encryption Manager"
    technology: "Java / BouncyCastle"
    description: "Enforces envelope encryption and KMS integration."
  - type: "component"
    name: "Retention & Compliance Controller"
    technology: "Go"
    description: "Implements robust WORM immutability enforcement."
  - type: "component"
    name: "Metadata Indexer"
    technology: "Elasticsearch / OpenSearch"
    description: "Handles indexed metadata search with strict RBAC and AES-256 encryption."
  - type: "component"
    name: "Object Store Backend"
    technology: "MinIO / AWS S3 Object Lock"
    description: "Provides secure, highly available, and immutable long-term data retention for audit logs and medical records."
  - type: "component"
    name: "Buffer Queue"
    technology: "Embedded SQLite/WAL"
    description: "Provides local write-ahead logging to guarantee zero audit log loss during network partitions."
relationships:
  - source: "Core Services"
    destination: "Ingestion & Validation Engine"
    description: "Sends audit logs and EMR archives via gRPC over mTLS."
  - source: "Ingestion & Validation Engine"
    destination: "Encryption Manager"
    description: "Passes raw payloads for encryption via Internal In-Memory API."
  - source: "Ingestion & Validation Engine"
    destination: "Metadata Indexer"
    description: "Publishes search metadata via Kafka/Async."
  - source: "Encryption Manager"
    destination: "Object Store Backend"
    description: "Writes encrypted objects using S3 API."