level: component
scope: "Component diagram for the Integration Service container"
parentContainer:
  name: "Integration Service"
elements:
  - type: "component"
    name: "FHIR Transformer Engine"
    technology: "Apache Camel/Java"
    description: "Forwards normalized payloads and handles HL7 FHIR transformations using robust enterprise integration patterns."
  - type: "component"
    name: "External Protocol Adapter"
    technology: "HTTPS/REST with mTLS"
    description: "Exchanges health data with external lab and imaging systems."
  - type: "component"
    name: "Resilience & Circuit Breaker Manager"
    technology: "Resilience4j"
    description: "Protects against external cascading failures using circuit breaking, timeouts, and backoff retry policies."
  - type: "component"
    name: "Outbox Message Publisher"
    technology: "Java / Message Publisher"
    description: "Publishes integration audit events."
  - type: "component"
    name: "DLQ Exception Router"
    technology: "Java / Exception Router"
    description: "Routes poisoned or failed payloads to the DLQ topic with AES-GCM envelope encryption for PHI payloads."
  - type: "component"
    name: "Message Broker (Kafka)"
    technology: "Apache Kafka"
    description: "Handles integration event messaging and DLQ topics."
  - type: "component"
    name: "External Lab & Imaging Systems"
    technology: "External Systems"
    description: "External clinical and imaging systems exchanging health data."
relationships:
  - source: "FHIR Transformer Engine"
    destination: "External Protocol Adapter"
    description: "Forwards normalized payloads [Direct Route]"
  - source: "Resilience & Circuit Breaker Manager"
    destination: "External Protocol Adapter"
    description: "Protects against external cascading failures [In-memory wrapper]"
  - source: "Outbox Message Publisher"
    destination: "Message Broker (Kafka)"
    description: "Publishes integration audit events [TCP/Kafka]"
  - source: "DLQ Exception Router"
    destination: "Message Broker (Kafka)"
    description: "Routes poisoned or failed payloads to the DLQ topic [TCP/Kafka]"
  - source: "External Protocol Adapter"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges health data [mTLS over HTTPS/REST]"