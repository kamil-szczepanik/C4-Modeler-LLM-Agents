level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Ingestion Router"
    technology: "Kafka KRaft"
    description: "Routes raw event streams and publishes domain events via mTLS and Kafka Protocol."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry"
    description: "Validates event schemas via HTTP/REST over TLS."
  - type: "component"
    name: "DLQ Manager"
    technology: "Apache Kafka Topic"
    description: "Diverts failed processing messages via Kafka Topic."
  - type: "component"
    name: "Encryption Key Manager"
    technology: "KMS"
    description: "Fetches data encryption keys via internal gRPC over TLS."
  - type: "component"
    name: "Topic Replicator"
    technology: "MirrorMaker 2"
    description: "Streams replicated topics for hybrid DR via Kafka TLS."
  - type: "component"
    name: "Broker Authorization & ACL Enforcement Engine"
    technology: "Internal API/Plugin"
    description: "Validates client publish/consume permissions via internal API/Plugin."
  - type: "component"
    name: "Operational Audit & Compliance Exporter"
    technology: "Async Exporter"
    description: "Forwards non-payload access telemetry asynchronously."
  - type: "component"
    name: "Stream Processing / State Handler"
    technology: "Kafka Streams"
    description: "Manages event aggregations and windowing for complex clinical workflows."
  - type: "component"
    name: "Broker Health & Metrics Exporter"
    technology: "Prometheus"
    description: "Exposes Prometheus metrics via HTTP Scrape over TLS."
relationships:
  - source: "Core Services"
    destination: "Ingestion Router"
    description: "Publishes domain events via mTLS and Kafka Protocol."
  - source: "Ingestion Router"
    destination: "Schema Registry"
    description: "Validates event schemas via HTTP/REST over TLS."
  - source: "Ingestion Router"
    destination: "Encryption Key Manager"
    description: "Fetches data encryption keys via internal gRPC over TLS."
  - source: "Ingestion Router"
    destination: "Topic Replicator"
    description: "Streams replicated topics for hybrid DR via Kafka TLS."
  - source: "Ingestion Router"
    destination: "Broker Authorization & ACL Enforcement Engine"
    description: "Validates client publish/consume permissions via internal API/Plugin."
  - source: "Ingestion Router"
    destination: "Operational Audit & Compliance Exporter"
    description: "Forwards non-payload access telemetry asynchronously."
  - source: "Ingestion Router"
    destination: "Stream Processing / State Handler"
    description: "Routes raw event streams via internal Kafka Protocol."
  - source: "Stream Processing / State Handler"
    destination: "DLQ Manager"
    description: "Diverts failed processing messages via Kafka Topic."
  - source: "Ingestion Router"
    destination: "Broker Health & Metrics Exporter"
    description: "Exposes Prometheus metrics via HTTP Scrape over TLS."