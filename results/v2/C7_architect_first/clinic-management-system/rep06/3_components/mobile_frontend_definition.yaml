level: component
scope: "Component diagram for the Mobile Frontend container"
parentContainer:
  name: "Mobile Frontend"
elements:
  - type: "component"
    name: "Authentication & Session Manager"
    technology: "React Native Keychain / Flutter Secure Storage"
    description: "Manages secure enclave token storage and user authentication sessions."
  - type: "component"
    name: "EMR & Scheduling View Module"
    technology: "React Native / Flutter UI Widgets"
    description: "Provides the user interface for electronic medical records and scheduling."
  - type: "component"
    name: "API Client & Offline Sync Engine"
    technology: "WatermelonDB / Isar"
    description: "Handles encrypted local caching with AES-256 and offline-first data synchronization."
  - type: "component"
    name: "OTA Update & Telemetry Manager"
    technology: "Sentry SDK / Native OTA runtime"
    description: "Manages real-time telemetry, privacy-compliant crash tracking, and signed bundle updates."
  - type: "component"
    name: "Security & RASP Enclave"
    technology: "Native Security Libraries"
    description: "Provides client-side PHI scrubbing, local encryption enforcement, and security protection."
relationships:
  - source: "Security & RASP Enclave"
    destination: "API Gateway"
    description: "Sends mTLS-pinned, authenticated requests [HTTPS/JSON]"
  - source: "Authentication & Session Manager"
    destination: "API Gateway"
    description: "Validates tokens & sends requests [HTTPS/JSON]"
  - source: "EMR & Scheduling View Module"
    destination: "API Client & Offline Sync Engine"
    description: "Reads/Writes cached clinical data [Local IPC]"
  - source: "OTA Update & Telemetry Manager"
    destination: "Secure Cloud Storage"
    description: "Fetches signed bundle updates [HTTPS]"