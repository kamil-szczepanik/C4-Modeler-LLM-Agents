level: component
scope: "Component diagram for the Compliance & Reporting Service container"
parentContainer:
  name: "Compliance & Reporting Service"
elements:
  - type: "component"
    name: "Compliance Dashboard API"
    technology: "Spring Boot REST controller"
    description: "Spring Boot REST controller handling secure, RBAC-protected ad-hoc queries."
  - type: "component"
    name: "Audit Log Processor"
    technology: "Asynchronous Kafka consumer"
    description: "Asynchronous Kafka consumer handling log ingestion, normalization, and cryptographic chaining."
  - type: "component"
    name: "Regulatory Report Generator"
    technology: "Isolated KEDA-scaled worker pool"
    description: "Isolated KEDA-scaled worker pool producing encrypted PDF, JSON, and CSV reports."
  - type: "component"
    name: "Data Retention Enforcer"
    technology: "Background lifecycle worker"
    description: "Background lifecycle worker managing the 10-year data archiving policy."
  - type: "component"
    name: "WORM Audit Store"
    technology: "External immutable storage"
    description: "External immutable storage target with cross-region replication and object-lock."
  - type: "component"
    name: "CockroachDB & Redis"
    technology: "Distributed SQL database and in-memory cache"
    description: "Distributed SQL database with read-replicas and in-memory cache with strict TTL."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "KMS"
    description: "KMS managing AES-256 keys for temporary scratch space and export encryption."
relationships:
  - source: "Core Business Services"
    destination: "Audit Log Processor"
    description: "Publishes domain and access events [Kafka over TLS with mTLS]."
  - source: "API Gateway"
    destination: "Compliance Dashboard API"
    description: "Exposes compliance queries [HTTPS/REST]."
  - source: "Compliance Dashboard API"
    destination: "CockroachDB & Redis"
    description: "Fetches masked audit metadata [JDBC/TLS]."
  - source: "Regulatory Report Generator"
    destination: "HashiCorp Vault"
    description: "Fetches encryption keys [HTTPS/TLS]."
  - source: "Data Retention Enforcer"
    destination: "WORM Audit Store"
    description: "Archives finalized bundles and verifies health [gRPC/TLS]."
  - source: "Regulatory Report Generator"
    destination: "WORM Audit Store"
    description: "Archives finalized bundles and verifies health [gRPC/TLS]."