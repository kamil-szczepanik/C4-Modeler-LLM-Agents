level: component
scope: "Component diagram for the Core Business Services container"
parentContainer:
  name: "Core Business Services"
elements:
  - type: "component"
    name: "Patient Management Component"
    technology: "Java Spring Boot"
    description: "Handles patient admissions and profile management."
  - type: "component"
    name: "Scheduling Engine Component"
    technology: "Java Spring Boot, Redis"
    description: "Manages appointment scheduling and acquires distributed locks."
  - type: "component"
    name: "EMR Core Component"
    technology: "Java Spring Boot, CockroachDB, WORM Audit Store"
    description: "Manages Electronic Medical Records, ACID transactions, and guaranteed-delivery audit trails."
  - type: "component"
    name: "Billing Service Component"
    technology: "Java Spring Boot"
    description: "Processes billing and financial services for healthcare facilities."
  - type: "component"
    name: "API Gateway"
    technology: "Istio"
    description: "Routes requests via gRPC over mTLS to core components."
  - type: "component"
    name: "CockroachDB"
    technology: "Distributed SQL"
    description: "Stores relational data, providing active-active multi-region resiliency and ACID transactions."
  - type: "component"
    name: "Redis"
    technology: "In-memory data store"
    description: "Provides high-performance appointment locking via Redis RESP / TLS."
  - type: "component"
    name: "WORM Audit Store"
    technology: "Storage"
    description: "Stores guaranteed-delivery audit trails using the transactional outbox pattern."
  - type: "component"
    name: "External KMS (HashiCorp Vault)"
    technology: "HashiCorp Vault, AES-256"
    description: "Performs envelope encryption and acts as an external key management system."
relationships:
