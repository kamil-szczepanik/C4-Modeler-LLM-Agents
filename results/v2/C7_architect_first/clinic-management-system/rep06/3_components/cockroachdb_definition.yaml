level: component
scope: "Component diagram for the CockroachDB container"
parentContainer:
  name: "CockroachDB"
elements:
  - type: "component"
    name: "SQL Layer"
    technology: "Go"
    description: "Parses queries and enforces Role-Based Access Control (RBAC)."
  - type: "component"
    name: "Transaction Engine"
    technology: "Go"
    description: "Manages distributed MVCC transactions and consensus."
  - type: "component"
    name: "Raft Consensus Module"
    technology: "Go"
    description: "Replicates data ranges across nodes for active-active availability."
  - type: "component"
    name: "Storage Engine / RocksDB"
    technology: "C++/Go, RocksDB, AES-256"
    description: "Persists data locally on disk with AES-256 encryption."
  - type: "component"
    name: "Distributed Leaseholder & Multi-Region Coordinator"
    technology: "Go"
    description: "Pin-points range leaseholders to minimize cross-boundary latency."
relationships:
  - source: "Core Business Services"
    destination: "SQL Layer"
    description: "Executes distributed SQL queries via [PostgreSQL Wire Protocol over TLS 1.3]."
  - source: "SQL Layer"
    destination: "Transaction Engine"
    description: "Translates queries into transactional read/write intents."
  - source: "Transaction Engine"
    destination: "Raft Consensus Module"
    description: "Replicates state changes via [gRPC over TLS]."
  - source: "Raft Consensus Module"
    destination: "Storage Engine / RocksDB"
    description: "Persists committed ranges via [Cgo / Direct File I/O]."
  - source: "SQL Layer"
    destination: "Distributed Leaseholder & Multi-Region Coordinator"
    description: "Routes queries to leaseholders via [Internal RPC over TLS]."