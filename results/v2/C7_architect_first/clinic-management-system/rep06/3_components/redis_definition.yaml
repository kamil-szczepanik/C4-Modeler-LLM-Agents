level: component
scope: "Component diagram for the Redis container"
parentContainer:
  name: "Redis"
elements:
  - type: "component"
    name: "Redis Enterprise Cluster Engine"
    technology: "Multi-master, multi-replica in-memory store"
    description: "Provides high availability and horizontal scalability."
  - type: "component"
    name: "Distributed Lock Manager"
    technology: "Redlock algorithm"
    description: "Coordinates appointment scheduling locks."
  - type: "component"
    name: "Session & Token Cache"
    technology: "Ephemeral cache"
    description: "Stores user sessions and OAuth2 tokens."
  - type: "component"
    name: "EMR Read-Through Cache"
    technology: "In-memory cache"
    description: "Holds hot patient demographic and scheduling records."
  - type: "component"
    name: "Persistence & Encryption Engine"
    technology: "AES-256 RDB/AOF snapshots"
    description: "Secures persistence snapshots for HIPAA/GDPR compliance."
relationships:
  - source: "API Gateway"
    destination: "Session & Token Cache"
    description: "Validates ephemeral auth tokens [RESP over mTLS]"
  - source: "Core Business Services"
    destination: "Distributed Lock Manager"
    description: "Coordinates scheduling locks via Redlock [RESP over mTLS]"
  - source: "Core Business Services"
    destination: "EMR Read-Through Cache"
    description: "Reads/writes cached patient state [RESP over mTLS]"