level: component
scope: "Component diagram for the Patient Notification Service container"
parentContainer:
  name: "Patient Notification Service"
elements:
  - type: "component"
    name: "Notification Router Component"
    technology: "Spring Cloud Gateway / Routing"
    description: "Routes notification requests and queries consent preferences."
  - type: "component"
    name: "Channel Adapter Component"
    technology: "Apache Camel"
    description: "Integrates third-party messaging providers and decouples external latency."
  - type: "component"
    name: "Template Engine Component"
    technology: "Thymeleaf"
    description: "Generates secure, compliant patient alerts and reminders."
  - type: "component"
    name: "Delivery Status Tracker Component"
    technology: "Redis Streams / CockroachDB"
    description: "Processes retries and Dead Letter Queues ensuring high availability."
  - type: "component"
    name: "Consent & Preference Manager Component"
    technology: "Redis caching layer"
    description: "Manages patient consent and preference checks for HIPAA and GDPR compliance."
relationships:
  - source: "Core Business Services"
    destination: "Notification Router Component"
    description: "Invokes via gRPC with mTLS and OAuth2/JWT"
  - source: "Notification Router Component"
    destination: "Consent & Preference Manager Component"
    description: "Queries via local method calls"
  - source: "Channel Adapter Component"
    destination: "External Providers (Twilio/SendGrid)"
    description: "Calls via HTTPS/SMTP over TLS 1.3"
  - source: "Delivery Status Tracker Component"
    destination: "CockroachDB and Redis"
    description: "Processes retries and Dead Letter Queues"