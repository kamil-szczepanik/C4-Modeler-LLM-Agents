level: component
scope: "Component diagram for the Web Frontend container"
parentContainer:
  name: "Web Frontend"
elements:
  - type: "component"
    name: "Web Frontend"
    technology: "React / TypeScript"
    description: "Component-based SPA framework for responsive clinical interfaces."
  - type: "component"
    name: "API Gateway"
    technology: "Envoy / Nginx"
    description: "Containerized static asset delivery and edge routing."
  - type: "component"
    name: "Authentication Module"
    technology: "oidc-client-ts"
    description: "OAuth2/OIDC login and MFA token management."
  - type: "component"
    name: "Session Guardian"
    technology: "TypeScript"
    description: "Manages session state and token teardown."
  - type: "component"
    name: "RBAC Router"
    technology: "React Router / TypeScript"
    description: "Enforces role-based access control and routing."
  - type: "component"
    name: "EMR View Controller"
    technology: "React / TypeScript"
    description: "Controls the rendering and interaction of Electronic Medical Records."
  - type: "component"
    name: "API Client"
    technology: "Axios"
    description: "HTTP client for telemetry, JWT injection, and error boundaries."
  - type: "component"
    name: "Scheduling Workspace"
    technology: "React / TypeScript"
    description: "Provides interface for clinical scheduling operations."
relationships:
  - source: "Web Frontend"
    destination: "API Gateway"
    description: "HTTPS / REST / JSON, WebSocket [HTTPS / WSS]"
  - source: "RBAC Router"
    destination: "Authentication Module"
    description: "Internal component call for claims verification"
  - source: "Session Guardian"
    destination: "API Client"
    description: "Internal component call for token refresh/teardown"