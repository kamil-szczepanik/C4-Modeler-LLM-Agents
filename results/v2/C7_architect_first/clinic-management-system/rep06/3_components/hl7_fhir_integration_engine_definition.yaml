level: component
scope: "Component diagram for the HL7 FHIR Integration Engine container"
parentContainer:
  name: "HL7 FHIR Integration Engine"
elements:
  - type: "component"
    name: "FHIR API Gateway / Router"
    technology: "Apache Camel (REST DSL)"
    description: "Manages TLS termination, OAuth2/JWT validation, and mTLS."
  - type: "component"
    name: "Transformation & Mapping Engine"
    technology: "Apache Camel (DataFormats)"
    description: "Translating internal domain models to FHIR R4 JSON."
  - type: "component"
    name: "Validation & Compliance Service"
    technology: "HAPI FHIR Validator"
    description: "Stateless HAPI FHIR Validator ensuring profile conformance and stripping PII."
  - type: "component"
    name: "Outbound Dispatcher"
    technology: "Apache Camel (HTTP4/Netty)"
    description: "Dispatcher with RabbitMQ DLQ and resilience4j circuit breakers."
relationships:
  - source: "FHIR API Gateway / Router"
    destination: "Validation & Compliance Service"
    description: "In-process Java API with OpenTelemetry correlation ID headers."
  - source: "Validation & Compliance Service"
    destination: "Transformation & Mapping Engine"
    description: "In-process Java API."
  - source: "Transformation & Mapping Engine"
    destination: "Outbound Dispatcher"
    description: "Forwards lab/imaging payloads with AES-256 encryption at rest."