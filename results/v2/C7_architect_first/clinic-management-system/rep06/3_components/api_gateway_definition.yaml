level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Router & Reverse Proxy"
    technology: "Envoy / Nginx"
    description: "Handles external access, TLS termination, WAF security controls, and perimeter defense."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "OAuth2/OIDC + OPA"
    description: "Performs perimeter authentication and RBAC/ABAC enforcement."
  - type: "component"
    name: "Rate Limiter & Circuit Breaker"
    technology: "Redis-backed with local token-bucket caching"
    description: "Manages rate limiting and circuit breaking with active-active replication."
  - type: "component"
    name: "API Versioning & Transformation Filter"
    technology: "Internal Routing Middleware"
    description: "Handles API versioning and payload transformation."
  - type: "component"
    name: "Request Deduplication & Idempotency Module"
    technology: "Redis-backed tracking"
    description: "Ensures request deduplication and idempotency tracking."
relationships:
  - source: "Edge Router & Reverse Proxy"
    destination: "Authentication & Authorization Filter"
    description: "Intercepts requests [In-memory / gRPC]"
  - source: "Authentication & Authorization Filter"
    destination: "API Versioning & Transformation Filter"
    description: "Passes validated claims [In-memory]"
  - source: "API Versioning & Transformation Filter"
    destination: "Core Business Services"
    description: "Forwards payloads [gRPC / mTLS via Istio]"
  - source: "Edge Router & Reverse Proxy"
    destination: "Compliance & Reporting Service"
    description: "Audit log routing [HTTPS]"