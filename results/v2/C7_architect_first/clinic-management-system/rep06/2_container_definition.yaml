level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Medical Staff"
    description: "Medical staff managing patient admissions, EMR, and scheduling."
  - type: "person"
    name: "Administrators"
    description: "System administrators managing the platform and compliance."
  - type: "person"
    name: "Patients"
    description: "End-users accessing portal services and scheduling."
  - type: "person"
    name: "Billing Specialists"
    description: "Financial users managing revenue cycles and billing."
  - type: "externalSystem"
    name: "External Labs & Imaging Systems"
    description: "External diagnostic partners integrating via HL7 FHIR."
  - type: "externalSystem"
    name: "WORM Audit Store"
    description: "Dedicated compliance boundary for immutable logs and audit records."
  - type: "container"
    name: "API Gateway"
    technology: "Envoy / Nginx"
    description: "Routes incoming requests and secures perimeter access."
  - type: "container"
    name: "Web Frontend"
    technology: "React / TypeScript SPA"
    description: "Web-based user interface for medical staff, administrators, patients, and billing specialists."
  - type: "container"
    name: "Mobile Frontend"
    technology: "React Native / Flutter"
    description: "Mobile application for users accessing the platform on-the-go."
  - type: "container"
    name: "Core Business Services"
    technology: "Go / Spring Boot"
    description: "Microservices handling Patient, EMR, Scheduling, and Billing domains."
  - type: "container"
    name: "HL7 FHIR Integration Engine"
    technology: "Apache Camel / Node-RED"
    description: "Integration engine handling HL7 FHIR APIs for external labs and imaging systems."
  - type: "container"
    name: "Patient Notification Service"
    technology: "Microservice"
    description: "Handles patient notifications and alerts."
  - type: "container"
    name: "Compliance & Reporting Service"
    technology: "Spring Boot / Python"
    description: "Ensures compliance and generates regulatory reports."
  - type: "container"
    name: "CockroachDB"
    technology: "Distributed SQL"
    description: "Distributed database for ACID transactions and persistence."
  - type: "container"
    name: "Redis"
    technology: "In-memory Data Store"
    description: "Used for caching and distributed locks."
relationships:
  - source: "Medical Staff"
    destination: "API Gateway"
    description: "Accesses daily workflows via web/mobile"
    technology: "HTTPS"
  - source: "Administrators"
    destination: "API Gateway"
    description: "Manages system and compliance"
    technology: "HTTPS"
  - source: "Patients"
    destination: "API Gateway"
    description: "Accesses portal and scheduling"
    technology: "HTTPS"
  - source: "Billing Specialists"
    destination: "API Gateway"
    description: "Manages billing and revenue"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Web Frontend"
    description: "Serves web application"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Mobile Frontend"
    description: "Serves mobile application"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Core Business Services"
    description: "Routes API requests"
    technology: "HTTPS / gRPC (mTLS via Istio)"
  - source: "Core Business Services"
    destination: "CockroachDB"
    description: "Reads and writes transactional data"
    technology: "TLS"
  - source: "Core Business Services"
    destination: "Redis"
    description: "Caches data and acquires locks"
    technology: "TLS"
  - source: "Core Business Services"
    destination: "WORM Audit Store"
    description: "Writes audit logs"
    technology: "gRPC/TLS"
  - source: "HL7 FHIR Integration Engine"
    destination: "External Labs & Imaging Systems"
    description: "Exchanges diagnostic data"
    technology: "HL7 FHIR APIs"
  - source: "Compliance & Reporting Service"
    destination: "WORM Audit Store"
    description: "Sends compliance and reporting data"
    technology: "gRPC/TLS"