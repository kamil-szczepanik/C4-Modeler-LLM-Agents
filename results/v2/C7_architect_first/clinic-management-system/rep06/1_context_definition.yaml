level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid clinical IT platform that manages patient admissions, electronic medical records (EMR), scheduling, and billing for medium-sized hospitals and clinics."
elements:
  - type: "person"
    name: "Medical Staff & Administrators"
    description: "Primary clinical users accessing daily workflows via HTTPS and MFA."
  - type: "person"
    name: "Patients"
    description: "End-users accessing self-service scheduling and viewing records via the Patient Portal."
  - type: "person"
    name: "Billing Specialists"
    description: "Financial users managing revenue cycles and claims."
  - type: "externalSystem"
    name: "External Labs & Imaging Systems"
    description: "External diagnostic partners integrating via HL7 FHIR."
  - type: "externalSystem"
    name: "Insurance Clearinghouse"
    description: "External entity for automated claims processing."
  - type: "externalSystem"
    name: "WORM Audit Store"
    description: "Dedicated compliance boundary for immutable logs."
relationships:
  - source: "Medical Staff & Administrators"
    destination: "Clinic Management System"
    description: "Interacts for daily workflows"
    technology: "HTTPS with TLS 1.3 and MFA"
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Accesses self-service scheduling and views records"
    technology: "HTTPS with TLS 1.3 and MFA"
  - source: "Billing Specialists"
    destination: "Clinic Management System"
    description: "Manages revenue cycles and claims"
    technology: "HTTPS with TLS 1.3 and MFA"
  - source: "Clinic Management System"
    destination: "External Labs & Imaging Systems"
    description: "Integrates for diagnostic data"
    technology: "HL7 FHIR (REST/JSON over TLS 1.3)"
  - source: "Clinic Management System"
    destination: "Insurance Clearinghouse"
    description: "Submits claims"
    technology: "Secure EDI/HTTPS"
  - source: "Clinic Management System"
    destination: "WORM Audit Store"
    description: "Streams immutable access and admin logs"
    technology: "Secure syslog/TLS"