level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Doctors"
    description: "Medical professionals who access and update electronic medical records and patient data."
  - type: "person"
    name: "Nurses"
    description: "Healthcare staff who manage patient admissions, scheduling, and basic EMR entries."
  - type: "person"
    name: "Receptionists"
    description: "Front-desk staff responsible for patient scheduling and initial intake."
  - type: "person"
    name: "Billing Staff"
    description: "Personnel who manage patient invoices, payments, and insurance claims."
  - type: "person"
    name: "Clinic Administrators"
    description: "Management staff overseeing system configuration, users, and overall clinic operations."
  - type: "person"
    name: "Patients"
    description: "End-users who access the patient portal to view health records, schedule appointments, and pay bills."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system responsible for user authentication and authorization."
  - type: "externalSystem"
    name: "External Labs & Imaging Systems"
    description: "Third-party diagnostic systems exchanging standardized medical data."
  - type: "externalSystem"
    name: "Payment Gateway / Insurance Clearinghouse"
    description: "External financial systems processing payments and insurance claims."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx / Kong"
    description: "Manages TLS termination, rate limiting, and traffic routing."
  - type: "container"
    name: "Web Application (SPA)"
    technology: "React / TypeScript, Nginx"
    description: "Frontend interface serving users via browser."
  - type: "container"
    name: "Core Services (Patient & Scheduling, EMR, Billing, FHIR Interoperability)"
    technology: "Node.js / NestJS or Java / Spring Boot"
    description: "Microservices handling business logic, patient records, scheduling, billing, and interoperability."
  - type: "container"
    name: "PostgreSQL"
    technology: "PostgreSQL (Active-Passive)"
    description: "Relational database storing encrypted application data with AES-256 at rest."
  - type: "container"
    name: "Redis"
    technology: "Redis"
    description: "Caching layer for edge caching and fast data access."
  - type: "container"
    name: "Apache Kafka"
    technology: "Apache Kafka"
    description: "Message broker supporting event-driven workflows and Transactional Outbox Pattern."
  - type: "container"
    name: "AWS S3 Object Lock"
    technology: "AWS S3"
    description: "Immutable storage ensuring strict compliance and data retention."
relationships:
  - source: "Doctors"
    destination: "Web Application (SPA)"
    description: "Accesses Web Application via HTTPS/TLS terminated at the API Gateway"
    technology: "HTTPS / TLS"
  - source: "Nurses"
    destination: "Web Application (SPA)"
    description: "Accesses Web Application via HTTPS/TLS terminated at the API Gateway"
    technology: "HTTPS / TLS"
  - source: "Receptionists"
    destination: "Web Application (SPA)"
    description: "Accesses Web Application via HTTPS/TLS terminated at the API Gateway"
    technology: "HTTPS / TLS"
  - source: "Billing Staff"
    destination: "Web Application (SPA)"
    description: "Accesses Web Application via HTTPS/TLS terminated at the API Gateway"
    technology: "HTTPS / TLS"
  - source: "Clinic Administrators"
    destination: "Web Application (SPA)"
    description: "Accesses Web Application via HTTPS/TLS terminated at the API Gateway"
    technology: "HTTPS / TLS"
  - source: "Patients"
    destination: "Web Application (SPA)"
    description: "Accesses Web Application via HTTPS/TLS terminated at the API Gateway"
    technology: "HTTPS / TLS"
  - source: "Web Application (SPA)"
    destination: "API Gateway"
    description: "Sends requests to API Gateway"
    technology: "HTTPS / TLS"
  - source: "API Gateway"
    destination: "Identity Provider (IdP)"
    description: "Authenticates requests via OAuth2/OIDC"
    technology: "OAuth2 / OIDC"
  - source: "API Gateway"
    destination: "Core Services (Patient & Scheduling, EMR, Billing, FHIR Interoperability)"
    description: "Routes traffic securely"
    technology: "gRPC over mTLS"
  - source: "Core Services (Patient & Scheduling, EMR, Billing, FHIR Interoperability)"
    destination: "PostgreSQL"
    description: "Reads and writes relational data with AES-256 at rest"
    technology: "SQL / TLS"
  - source: "Core Services (Patient & Scheduling, EMR, Billing, FHIR Interoperability)"
    destination: "Redis"
    description: "Caches and retrieves edge data"
    technology: "Redis Protocol"
  - source: "Core Services (Patient & Scheduling, EMR, Billing, FHIR Interoperability)"
    destination: "Apache Kafka"
    description: "Publishes and consumes events for asynchronous workflows"
    technology: "Kafka Protocol"
  - source: "Core Services (Patient & Scheduling, EMR, Billing, FHIR Interoperability)"
    destination: "AWS S3 Object Lock"
    description: "Stores immutable compliance data"
    technology: "HTTPS / AWS API"
  - source: "Core Services (Patient & Scheduling, EMR, Billing, FHIR Interoperability)"
    destination: "External Labs & Imaging Systems"
    description: "Exchanges medical data using HL7 FHIR APIs"
    technology: "HL7 FHIR APIs"
  - source: "Core Services (Patient & Scheduling, EMR, Billing, FHIR Interoperability)"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Submits claims asynchronously"
    technology: "Apache Kafka / REST"