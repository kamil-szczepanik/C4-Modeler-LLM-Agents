level: component
scope: "Component diagram for the Core Services (Patient & Scheduling, EMR, Billing, FHIR Interoperability) container"
parentContainer:
  name: "Core Services"
elements:
  - type: "component"
    name: "Patient & Scheduling Component"
    technology: "NestJS (TypeScript)"
    description: "Handles patient registration and appointment scheduling workflows."
  - type: "component"
    name: "EMR Component"
    technology: "NestJS (TypeScript)"
    description: "Manages Electronic Medical Records with sub-second response times."
  - type: "component"
    name: "Billing Component"
    technology: "NestJS (TypeScript)"
    description: "Processes billing and interacts with insurance clearinghouses and payment gateways."
  - type: "component"
    name: "FHIR Interoperability Component"
    technology: "NestJS (TypeScript) / HL7 FHIR APIs"
    description: "Exchanges medical data using HL7 FHIR APIs and SMART-on-FHIR scopes with external labs."
relationships:
  - source: "Patient & Scheduling Component"
    destination: "EMR Component"
    description: "Shares patient context and scheduling data"
  - source: "EMR Component"
    destination: "Billing Component"
    description: "Triggers billing events based on clinical services"
  - source: "FHIR Interoperability Component"
    destination: "EMR Component"
    description: "Ingests and exports interoperable medical data"