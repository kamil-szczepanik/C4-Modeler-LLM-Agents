level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "TLS Termination & Ingress Controller"
    technology: "Kong Ingress Controller / Nginx"
    description: "Handles TLS termination and ingress routing for low latency and high throughput."
  - type: "component"
    name: "Authentication & JWT Validation Plugin"
    technology: "Kong OAuth2/OIDC Plugin with local JWKS"
    description: "Validates JWT tokens using decentralized, low-latency token verification."
  - type: "component"
    name: "RBAC/ABAC Policy Enforcement Filter"
    technology: "Kong Policy Enforcement Filter"
    description: "Enforces role-based and attribute-based access control policies for HIPAA and GDPR compliance."
  - type: "component"
    name: "Rate Limiting & Throttling Filter"
    technology: "Kong Rate Limiting Plugin / Redis"
    description: "Performs distributed rate-limiting and throttling using Redis."
  - type: "component"
    name: "Tenant-Aware Priority Router"
    technology: "Kong Upstream Service"
    description: "Proxies prioritized requests to core services."
  - type: "component"
    name: "Audit Logging & Redaction Filter"
    technology: "Fluentbit over TLS"
    description: "Streams redacted audit logs with strict PHI redaction."
relationships:
  - source: "Web Application (SPA)"
    destination: "TLS Termination & Ingress Controller"
    description: "Sends requests [HTTPS / TLS 1.3]"
  - source: "Authentication & JWT Validation Plugin"
    destination: "Identity Provider (IdP)"
    description: "Fetches JWKS keys [HTTPS]"
  - source: "Tenant-Aware Priority Router"
    destination: "Core Services"
    description: "Proxies prioritized requests [gRPC over mTLS]"
  - source: "Audit Logging & Redaction Filter"
    destination: "Immutable Data Store"
    description: "Streams redacted logs [Fluentbit over TLS]"