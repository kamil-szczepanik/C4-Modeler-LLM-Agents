level: component
scope: "Component diagram for the Web Application (SPA) container"
parentContainer:
  name: "Web Application (SPA)"
elements:
  - type: "component"
    name: "Routing & State Management Component"
    technology: "React Router, Zustand, Zod"
    description: "Handles client-side routing, in-memory session state management, and runtime claim validation."
  - type: "component"
    name: "RBAC Router Guard Component"
    technology: "Zod, TypeScript"
    description: "Enforces role-based access control and secure routing based on runtime claim validation."
  - type: "component"
    name: "Authentication Interceptor Component"
    technology: "OAuth2/OIDC"
    description: "Manages token exchange and MFA triggers with the Identity Provider."
  - type: "component"
    name: "Session Lifecycle Manager Component"
    technology: "Zustand, React 18"
    description: "Manages the active session lifecycle and ensures memory-only state without local PHI caching."
  - type: "component"
    name: "Clinical Workspace Component"
    technology: "React 18, TypeScript"
    description: "Delivers role-based clinical and administrative workflows to healthcare staff and patients."
  - type: "component"
    name: "API Client Component"
    technology: "Axios, OpenTelemetry"
    description: "Wraps HTTP requests to backend services and captures browser tracing for performance metrics."
relationships:
  - source: "Users"
    destination: "Web Application (SPA)"
    description: "Access via HTTPS/TLS terminated at the API Gateway [HTTPS / TLS]"
  - source: "Web Application (SPA)"
    destination: "API Gateway"
    description: "Sends requests to backend services [HTTPS / REST / JSON]"
  - source: "Authentication Interceptor Component"
    destination: "Identity Provider (IdP)"
    description: "Token exchange and MFA triggers [OAuth2 / OIDC]"
  - source: "Delivery CDN / Proxies"
    destination: "Web Application (SPA)"
    description: "Serves immutable Vite static assets with nonces-based CSP [HTTPS]"