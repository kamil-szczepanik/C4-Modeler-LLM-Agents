level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "Database Engine"
    technology: "PostgreSQL v16 with pgaudit, Row-Level Security, and TDE"
    description: "Relational database providing robust storage, querying capabilities, and strict compliance enforcement."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Manages incoming connections to maintain performance during peak clinic hours."
  - type: "component"
    name: "Replication Agent"
    technology: "Patroni + etcd"
    description: "Orchestrates automated failover for primary-standby deployment to hit 99.99% uptime."
  - type: "component"
    name: "Storage and Backup"
    technology: "AWS S3 Object Lock"
    description: "Ensures immutable 10-year data retention for backups and audit logs."
  - type: "component"
    name: "Secret Management"
    technology: "HashiCorp Vault"
    description: "Automates short-lived X.509 certificate rotation and dynamic credential generation."
relationships:
  - source: "Core Services"
    destination: "Connection Pooler"
    description: "TCP / mTLS, port 6432 with X.509 client certificate authentication"
  - source: "Connection Pooler"
    destination: "Database Engine"
    description: "TCP / mTLS, port 5432 enforcing TLS 1.3"
  - source: "Database Engine"
    destination: "Storage and Backup"
    description: "HTTPS / TLS 1.3 for continuous WAL archiving and backups"
  - source: "Replication Agent"
    destination: "Replication Agent"
    description: "Internal IPC / TCP for cluster health checks and leader election"