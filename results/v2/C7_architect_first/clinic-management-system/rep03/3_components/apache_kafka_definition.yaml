level: component
scope: "Component diagram for the Apache Kafka container"
parentContainer:
  name: "Apache Kafka"
elements:
  - type: "component"
    name: "Kafka Brokers"
    technology: "Apache Kafka (acks=all)"
    description: "Handles zero-data-loss event streaming, publishing, and consuming asynchronous clinical events."
  - type: "component"
    name: "KRaft Controller Quorum"
    technology: "Apache Kafka KRaft Mode"
    description: "Manages metadata and consensus for streamlined failovers without ZooKeeper."
  - type: "component"
    name: "Kafka Connect"
    technology: "Kafka Connect Framework"
    description: "Provides exactly-once event syncing to PostgreSQL and AWS S3 Object Lock."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry"
    description: "Stores and enforces Avro/Protobuf backward-compatibility rules for event schemas."
  - type: "component"
    name: "Kafka Stream Processors"
    technology: "Kafka Streams"
    description: "Performs real-time appointment clash checks and event aggregation."
relationships:
  - source: "Kafka Brokers"
    destination: "AWS S3 Object Lock"
    description: "Tiered storage and audit log archiving [HTTPS]"
  - source: "Kafka Brokers"
    destination: "Schema Registry"
    description: "Stores schema definitions [Kafka Protocol]"