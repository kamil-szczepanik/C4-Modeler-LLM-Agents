level: component
scope: "Component diagram for the AWS S3 Object Lock container"
parentContainer:
  name: "AWS S3 Object Lock"
elements:
  - type: "component"
    name: "Object Ingestion API"
    technology: "AWS SDK / REST API"
    description: "Handles incoming compliance data and document uploads securely over AWS PrivateLink."
  - type: "component"
    name: "Retention Enforcement Engine"
    technology: "AWS S3 Object Lock (WORM Compliance Mode)"
    description: "Enforces strict 10-year immutable retention policies on stored medical records."
  - type: "component"
    name: "Audit Logger"
    technology: "Node.js / AWS CloudTrail integration"
    description: "Tracks and logs all data access, modifications, and retention events for compliance monitoring."
  - type: "component"
    name: "KMS Envelope Encryption Wrapper"
    technology: "AWS KMS"
    description: "Provides cryptographic envelope encryption and enables cryptographic GDPR erasure."
relationships:
  - source: "Object Ingestion API"
    destination: "Retention Enforcement Engine"
    description: "Routes uploaded data to be locked under WORM compliance mode"
  - source: "Retention Enforcement Engine"
    destination: "KMS Envelope Encryption Wrapper"
    description: "Encrypts and secures stored medical data objects"
  - source: "Object Ingestion API"
    destination: "Audit Logger"
    description: "Logs ingestion and access activities"