level: component
scope: "Component diagram for the Redis container"
parentContainer:
  name: "Redis"
elements:
  - type: "component"
    name: "Redis Cluster Coordinator / Proxy"
    technology: "Redis Cluster Coordinator"
    description: "Manages cluster topology, routing, and proxying requests to the underlying data nodes."
  - type: "component"
    name: "In-Memory Data Store"
    technology: "Redis In-Memory Data Store"
    description: "Provides low-latency access for caching and active session/EMR data."
  - type: "component"
    name: "Persistence Engine"
    technology: "Redis Persistence Engine"
    description: "Handles data persistence with AES-256 encryption for secure data storage."
relationships:
  - source: "Redis Cluster Coordinator / Proxy"
    destination: "In-Memory Data Store"
    description: "Routes read/write operations"
  - source: "Redis Cluster Coordinator / Proxy"
    destination: "Persistence Engine"
    description: "Triggers secure disk persistence"