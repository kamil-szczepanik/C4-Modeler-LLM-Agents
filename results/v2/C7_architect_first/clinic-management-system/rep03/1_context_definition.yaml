level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed for medium-sized hospitals and clinics to manage patient admissions, EMRs, scheduling, and billing while ensuring HIPAA and GDPR compliance."
elements:
  - type: "person"
    name: "Doctors"
    description: "Medical professionals who access and update electronic medical records and patient data."
  - type: "person"
    name: "Nurses"
    description: "Healthcare staff who manage patient admissions, scheduling, and basic EMR entries."
  - type: "person"
    name: "Receptionists"
    description: "Front-desk staff responsible for patient scheduling and initial intake."
  - type: "person"
    name: "Billing Staff"
    description: "Personnel who manage patient invoices, payments, and insurance claims."
  - type: "person"
    name: "Clinic Administrators"
    description: "Management staff overseeing system configuration, users, and overall clinic operations."
  - type: "person"
    name: "Patients"
    description: "End-users who access the patient portal to view health records, schedule appointments, and pay bills."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system responsible for user authentication and authorization."
  - type: "externalSystem"
    name: "External Labs & Imaging Systems"
    description: "Third-party diagnostic systems exchanging standardized medical data."
  - type: "externalSystem"
    name: "Payment Gateway / Insurance Clearinghouse"
    description: "External financial systems processing payments and insurance claims."
relationships:
  - source: "Doctors"
    destination: "Clinic Management System"
    description: "Accesses patient admissions, EMRs, and scheduling"
    technology: "HTTPS / TLS 1.3 with MFA"
  - source: "Nurses"
    destination: "Clinic Management System"
    description: "Manages admissions, scheduling, and patient data"
    technology: "HTTPS / TLS 1.3 with MFA"
  - source: "Receptionists"
    destination: "Clinic Management System"
    description: "Handles patient scheduling and intake"
    technology: "HTTPS / TLS 1.3 with MFA"
  - source: "Billing Staff"
    destination: "Clinic Management System"
    description: "Manages billing, invoicing, and claims"
    technology: "HTTPS / TLS 1.3 with MFA"
  - source: "Clinic Administrators"
    destination: "Clinic Management System"
    description: "Manages clinic operations and system administration"
    technology: "HTTPS / TLS 1.3 with MFA"
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Interacts via the Patient Portal / Web UI for health records and billing"
    technology: "HTTPS / TLS 1.3 with MFA"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users securely"
    technology: "OpenID Connect (OIDC) over mTLS"
  - source: "Clinic Management System"
    destination: "External Labs & Imaging Systems"
    description: "Exchanges lab and imaging data"
    technology: "HL7 FHIR over HTTPS"
  - source: "Clinic Management System"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Processes transactions and insurance claims"
    technology: "REST over TLS 1.3"