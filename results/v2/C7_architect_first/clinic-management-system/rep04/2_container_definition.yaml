level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patient"
    description: "Accesses the Patient Self-Service Portal to manage appointments and records."
  - type: "person"
    name: "Clinician/Doctor"
    description: "Manages clinical data and patient care using web applications."
  - type: "person"
    name: "Receptionist"
    description: "Handles patient admissions and scheduling."
  - type: "person"
    name: "Billing Staff"
    description: "Manages billing, payments, and insurance claims."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing clinical laboratory and imaging results via HL7 FHIR."
  - type: "externalSystem"
    name: "Payment Gateway / Insurance Clearinghouse"
    description: "External systems for processing payments and insurance claims."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Handles authentication and identity services via OIDC/SAML."
  - type: "externalSystem"
    name: "On-Premises Hardware Security Module (HSM)"
    description: "Provides key management and cryptographic security."
  - type: "container"
    name: "API Gateway / Edge Proxy"
    technology: "NGINX / Envoy"
    description: "Acts as the edge proxy managing incoming traffic and routing."
  - type: "container"
    name: "Web Application Frontend"
    technology: "React / TypeScript"
    description: "Provides clinical workflows and user interfaces for staff."
  - type: "container"
    name: "Patient Self-Service Portal"
    technology: "React / TypeScript"
    description: "Enables patients to access records and manage appointments."
  - type: "container"
    name: "Core Clinical & EMR Service"
    technology: "Java / Spring Boot"
    description: "Manages electronic medical records and core clinical workflows."
  - type: "container"
    name: "Scheduling & Billing Service"
    technology: "Node.js / NestJS"
    description: "Handles appointment scheduling, billing, and payment processing."
  - type: "container"
    name: "Local Storage/Sync Daemon"
    technology: "IndexedDB / AES-256"
    description: "Provides offline resilience and client-side storage."
  - type: "container"
    name: "PostgreSQL"
    technology: "PostgreSQL with row-level encryption"
    description: "Primary database for relational storage and clinical records."
  - type: "container"
    name: "Redis"
    technology: "Redis"
    description: "Provides caching and scheduling locks."
  - type: "container"
    name: "Immutable Audit Log"
    technology: "AWS QLDB / Append-only Postgres"
    description: "Maintains immutable audit trails for compliance."
relationships:
  - source: "Patient"
    destination: "API Gateway / Edge Proxy"
    description: "Accesses patient portal services"
    technology: "HTTPS / WSS"
  - source: "Clinician/Doctor"
    destination: "API Gateway / Edge Proxy"
    description: "Accesses clinical workflows"
    technology: "HTTPS / WSS"
  - source: "Receptionist"
    destination: "API Gateway / Edge Proxy"
    description: "Accesses scheduling and admissions"
    technology: "HTTPS / WSS"
  - source: "Billing Staff"
    destination: "API Gateway / Edge Proxy"
    description: "Accesses billing and claims"
    technology: "HTTPS / WSS"
  - source: "API Gateway / Edge Proxy"
    destination: "Web Application Frontend"
    description: "Serves web frontend"
    technology: "HTTPS"
  - source: "API Gateway / Edge Proxy"
    destination: "Patient Self-Service Portal"
    description: "Serves patient portal"
    technology: "HTTPS"
  - source: "API Gateway / Edge Proxy"
    destination: "Core Clinical & EMR Service"
    description: "Routes internal API requests"
    technology: "gRPC over Istio Service Mesh"
  - source: "API Gateway / Edge Proxy"
    destination: "Scheduling & Billing Service"
    description: "Routes internal API requests"
    technology: "gRPC over Istio Service Mesh"
  - source: "Core Clinical & EMR Service"
    destination: "PostgreSQL"
    description: "Reads and writes clinical data"
    technology: "JDBC/TLS with mTLS"
  - source: "Core Clinical & EMR Service"
    destination: "Immutable Audit Log"
    description: "Appends audit logs"
    technology: "JDBC/TLS with mTLS"
  - source: "Scheduling & Billing Service"
    destination: "Redis"
    description: "Manages cache and locks"
    technology: "TCP/TLS"
  - source: "Scheduling & Billing Service"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Processes payments and claims"
    technology: "HTTPS/REST"
  - source: "Core Clinical & EMR Service"
    destination: "On-Premises Hardware Security Module (HSM)"
    description: "Manages encryption keys"
    technology: "Secure Hardware Interface"
  - source: "Web Application Frontend"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OIDC/SAML"
  - source: "Patient Self-Service Portal"
    destination: "Identity Provider (IdP)"
    description: "Authenticates patients"
    technology: "OIDC/SAML"
  - source: "Core Clinical & EMR Service"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical data"
    technology: "HL7 FHIR over REST/TLS 1.3"