level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed to manage patient admissions, electronic medical records (EMR), scheduling, and billing for medium-sized hospitals and clinics."
elements:
  - type: "person"
    name: "Patient"
    description: "Accesses the Patient Portal to manage appointments and records via HTTPS."
  - type: "person"
    name: "Clinician/Doctor"
    description: "Manages clinical data and patient care securely using HTTPS/MFA and RBAC/ABAC."
  - type: "person"
    name: "Receptionist"
    description: "Handles patient admissions and scheduling using HTTPS/MFA and RBAC/ABAC."
  - type: "person"
    name: "Billing Staff"
    description: "Manages billing and claims using HTTPS/MFA and RBAC/ABAC."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing clinical laboratory and imaging results via HL7 FHIR."
  - type: "externalSystem"
    name: "Payment Gateway / Insurance Clearinghouse"
    description: "External systems for processing payments and insurance claims."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Handles authentication and identity services via OIDC/SAML."
  - type: "externalSystem"
    name: "On-Premises Hardware Security Module (HSM)"
    description: "Provides key management and cryptographic security for on-premises data."
relationships:
  - source: "Patient"
    destination: "Clinic Management System"
    description: "Accesses patient portal and services"
    technology: "HTTPS/TLS 1.3"
  - source: "Clinician/Doctor"
    destination: "Clinic Management System"
    description: "Manages clinical workflows and EMR"
    technology: "HTTPS/MFA with RBAC/ABAC"
  - source: "Receptionist"
    destination: "Clinic Management System"
    description: "Manages patient admissions and scheduling"
    technology: "HTTPS/MFA with RBAC/ABAC"
  - source: "Billing Staff"
    destination: "Clinic Management System"
    description: "Processes billing and claims"
    technology: "HTTPS/MFA with RBAC/ABAC"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical data"
    technology: "HL7 FHIR over REST/TLS 1.3"
  - source: "Clinic Management System"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Processes payments and claims"
    technology: "REST/TLS 1.3"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OIDC/SAML"