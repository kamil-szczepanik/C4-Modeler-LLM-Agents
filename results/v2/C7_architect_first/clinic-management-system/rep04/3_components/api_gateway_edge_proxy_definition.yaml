level: component
scope: "Component diagram for the API Gateway / Edge Proxy container"
parentContainer:
  name: "API Gateway / Edge Proxy"
elements:
  - type: "component"
    name: "API Gateway / Edge Proxy (Envoy)"
    technology: "Envoy"
    description: "Acts as the secure entry point for the Clinic Management System, routing all external traffic to internal microservices."
  - type: "component"
    name: "TLS Termination & SSL Offloading Engine"
    technology: "TLS 1.3"
    description: "Handles secure transport-layer encryption and SSL offloading."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Identity Provider / OAuth2 / OIDC"
    description: "Validates tokens and enforces authentication and authorization."
  - type: "component"
    name: "Rate Limiting & Threat Protection"
    technology: "Redis, local token-bucket"
    description: "Provides distributed rate limiting and threat protection with local token fallback."
  - type: "component"
    name: "Routing & Load Balancing Core"
    technology: "Envoy xDS"
    description: "Manages routing and load balancing core for hybrid cloud traffic."
  - type: "component"
    name: "Priority & Traffic Shaping Filter"
    technology: "Envoy Traffic Shaping"
    description: "Applies priority and traffic shaping for resilient traffic management."
  - type: "component"
    name: "Egress DLP & Sanitization Filter"
    technology: "Envoy DLP"
    description: "Ensures strict HIPAA/GDPR compliance via egress data loss prevention and sanitization."
  - type: "component"
    name: "Telemetry & Distributed Tracing Sidecar"
    technology: "OpenTelemetry, W3C Trace Context, Prometheus / Grafana"
    description: "Handles distributed tracing and telemetry metrics."
relationships:
  - source: "API Gateway / Edge Proxy (Envoy)"
    destination: "TLS Termination & SSL Offloading Engine"
    description: "Terminates inbound HTTPS/WSS traffic"
  - source: "TLS Termination & SSL Offloading Engine"
    destination: "Authentication & Authorization Filter"
    description: "Passes decrypted requests to auth"
  - source: "Authentication & Authorization Filter"
    destination: "Rate Limiting & Threat Protection"
    description: "Checks limits and threats using Redis and local token fallback"
  - source: "Rate Limiting & Threat Protection"
    destination: "Routing & Load Balancing Core"
    description: "Routes validated requests"
  - source: "Routing & Load Balancing Core"
    destination: "Priority & Traffic Shaping Filter"
    description: "Shapes traffic priority"
  - source: "Priority & Traffic Shaping Filter"
    destination: "Egress DLP & Sanitization Filter"
    description: "Sanitizes data for HIPAA/GDPR compliance"
  - source: "API Gateway / Edge Proxy (Envoy)"
    destination: "Telemetry & Distributed Tracing Sidecar"
    description: "Exports metrics and W3C trace contexts"