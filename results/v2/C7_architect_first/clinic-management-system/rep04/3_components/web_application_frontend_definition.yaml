level: component
scope: "Component diagram for the Web Application Frontend container"
parentContainer:
  name: "Web Application Frontend"
elements:
  - type: "component"
    name: "Auth & Session Component"
    technology: "oidc-client-ts"
    description: "Manages user authentication, session state, and securely passes memory-only tokens for API requests."
  - type: "component"
    name: "Clinical Workflow Router & State Component"
    technology: "React Router & Redux Toolkit"
    description: "Manages complex multi-step application state and navigation for clinical workflows."
  - type: "component"
    name: "Data Fetching & Cache Component"
    technology: "TanStack Query / React Query"
    description: "Optimizes data retrieval, local caching, and communicates with the API Gateway."
  - type: "component"
    name: "Local Storage Sync Service"
    technology: "IndexedDB with Web Crypto API"
    description: "Enables offline resilience through secure client-side storage with AES-256 encryption."
  - type: "component"
    name: "UI Component & Design System Library"
    technology: "Tailwind CSS & Radix UI"
    description: "Provides accessible, WCAG 2.1 AA compliant UI primitives with minimal DOM overhead."
  - type: "system"
    name: "API Gateway"
    technology: "HTTPS/REST/GraphQL"
    description: "External API Gateway handling backend service routing."
relationships:
  - source: "Clinical Workflow Router & State Component"
    destination: "Data Fetching & Cache Component"
    description: "Uses to query the API Gateway [HTTPS/REST/GraphQL]"
  - source: "Data Fetching & Cache Component"
    destination: "Local Storage Sync Service"
    description: "Reads/writes to local storage [IndexedDB/AES-256]"
  - source: "Clinical Workflow Router & State Component"
    destination: "UI Component & Design System Library"
    description: "Renders views using UI component library"
  - source: "Auth & Session Component"
    destination: "Data Fetching & Cache Component"
    description: "Securely passes memory-only tokens for requests to the API Gateway [HTTPS]"
  - source: "Data Fetching & Cache Component"
    destination: "API Gateway"
    description: "Queries data [HTTPS/REST/GraphQL]"