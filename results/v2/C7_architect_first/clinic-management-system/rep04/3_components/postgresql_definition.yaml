level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "Row-Level Security & Encryption Manager"
    technology: "PostgreSQL RLS & Transparent Data Encryption"
    description: "Manages row-level data segregation and cryptographic encryption at rest."
  - type: "component"
    name: "pgaudit Compliance Module"
    technology: "PostgreSQL Extension (pgaudit)"
    description: "Captures immutable DDL and DML audit trails for compliance."
relationships:
  - source: "Row-Level Security & Encryption Manager"
    destination: "On-Premises HSM"
    description: "Requests cryptographic keys via [PKCS#11 / gRPC over TLS]"
  - source: "pgaudit Compliance Module"
    destination: "Immutable Audit Log"
    description: "Streams audit records via [Syslog / TLS]"