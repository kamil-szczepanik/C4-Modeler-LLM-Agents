level: component
scope: "Component diagram for the Patient Self-Service Portal container"
parentContainer:
  name: "Patient Self-Service Portal"
elements:
  - type: "component"
    name: "Authentication & Session Manager"
    technology: "React Context / OAuth2 SDK"
    description: "Handles OIDC tokens and 15-minute inactivity timeouts."
  - type: "component"
    name: "Dashboard & Record Viewer"
    technology: "React Components"
    description: "Renders demographics, localized UI, and WCAG 2.1 AA accessible EMR summaries."
  - type: "component"
    name: "Appointment Booking Widget"
    technology: "React / Redux"
    description: "Interface for slot selection and clash checks."
  - type: "component"
    name: "Local State Cache"
    technology: "IndexedDB / Web Crypto API"
    description: "Provides client-side AES-256 encryption for temporary PHI."
  - type: "component"
    name: "Telemetry & Error Handler"
    technology: "OpenTelemetry JS SDK"
    description: "Captures RUM metrics with strict PHI sanitization."
  - type: "component"
    name: "Identity Provider (IdP)"
    technology: "OAuth2 / OIDC"
    description: "External system for authentication and token management."
  - type: "component"
    name: "API Gateway / Edge Proxy"
    technology: "HTTPS / REST"
    description: "External gateway routing requests to backend services."
relationships:
  - source: "Authentication & Session Manager"
    destination: "Identity Provider (IdP)"
    description: "Exchanges and refreshes tokens [OIDC/OAuth2 over HTTPS]."
  - source: "Dashboard & Record Viewer"
    destination: "API Gateway / Edge Proxy"
    description: "Fetches medical history [HTTPS / REST, JSON]."
  - source: "Appointment Booking Widget"
    destination: "API Gateway / Edge Proxy"
    description: "Submits appointment requests [HTTPS / REST, JSON]."
  - source: "Dashboard & Record Viewer"
    destination: "Telemetry & Error Handler"
    description: "Reports runtime UI metrics [HTTPS]."