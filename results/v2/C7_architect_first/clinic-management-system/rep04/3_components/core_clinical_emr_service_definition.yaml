level: component
scope: "Component diagram for the Core Clinical & EMR Service container"
parentContainer:
  name: "Core Clinical & EMR Service"
elements:
  - type: "component"
    name: "Patient Record Manager"
    technology: "Java / Spring Boot"
    description: "Manages patient admissions and electronic medical records (EMR)."
  - type: "component"
    name: "Authorization & Policy Engine"
    technology: "Java / Spring Boot"
    description: "Evaluates fine-grained access policies for requests."
  - type: "component"
    name: "Audit Logging Interceptor"
    technology: "Java / Spring Boot"
    description: "Intercepts requests and appends audit events for HIPAA/GDPR compliance."
  - type: "component"
    name: "FHIR Interoperability Adapter"
    technology: "Java / Spring Boot / HAPI FHIR"
    description: "Exchanges standardized clinical data with external lab and imaging systems."
  - type: "component"
    name: "Crypto & Key Management Facade"
    technology: "Java / Spring Boot / Secure Hardware Interface"
    description: "Manages envelope encryption keys using an On-Premises HSM."
relationships:
  - source: "Authorization & Policy Engine"
    destination: "Patient Record Manager"
    description: "Evaluates fine-grained access via In-process calls"