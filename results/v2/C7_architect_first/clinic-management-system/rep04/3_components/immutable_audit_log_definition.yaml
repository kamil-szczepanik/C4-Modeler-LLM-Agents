level: component
scope: "Component diagram for the Immutable Audit Log container"
parentContainer:
  name: "Immutable Audit Log"
elements:
  - type: "component"
    name: "Audit Ingestion API"
    technology: "Java / Spring Boot"
    description: "Appends event payloads via gRPC / TLS 1.3 and handles incoming audit events."
  - type: "component"
    name: "Cryptographic Signer Component"
    technology: "Java / Bouncy Castle"
    description: "Signs and chains log entries using cryptographic hashing and chaining algorithms."
  - type: "component"
    name: "Ledger Storage Engine"
    technology: "AWS QLDB / Append-Only PostgreSQL"
    description: "Commits verifiable blocks and enforces write-once-read-many (WORM) immutability semantics."
  - type: "component"
    name: "Compliance Export Service"
    technology: "Java / Spring Boot"
    description: "Generates tamper-proof reports and queries historical audit records."
  - type: "component"
    name: "Compliance Officer"
    technology: "Person"
    description: "Generates tamper-proof reports via HTTPS / TLS 1.3."
  - type: "component"
    name: "Core Clinical & EMR Service"
    technology: "Container"
    description: "Appends event payloads to the Audit Ingestion API."
  - type: "component"
    name: "AWS CloudHSM"
    technology: "AWS CloudHSM Cluster"
    description: "Provides secure, dedicated key custody and cryptographic operations."
  - type: "component"
    name: "S3 Object Lock"
    technology: "S3 Object Lock (Compliance Mode)"
    description: "Cost-effectively stores historical logs for the mandatory 10-year retention period."
relationships:
  - source: "Core Clinical & EMR Service"
    destination: "Audit Ingestion API"
    description: "Appends event payloads via `gRPC / TLS 1.3`"
  - source: "Audit Ingestion API"
    destination: "Cryptographic Signer Component"
    description: "Requests event signing via `In-Process Method Call`"
  - source: "Cryptographic Signer Component"
    destination: "AWS CloudHSM"
    description: "Signs and chains log entries via `PKCS#11 / TLS`"
  - source: "Cryptographic Signer Component"
    destination: "Ledger Storage Engine"
    description: "Commits verifiable blocks via `JDBC / TLS`"
  - source: "Compliance Officer"
    destination: "Compliance Export Service"
    description: "Generates tamper-proof reports via `HTTPS / TLS 1.3`"
  - source: "Compliance Export Service"
    destination: "S3 Object Lock"
    description: "Queries historical audit records via `AWS SDK / HTTPS`"