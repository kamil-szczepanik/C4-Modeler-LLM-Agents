level: component
scope: "Component diagram for the Redis container"
parentContainer:
  name: "Redis"
elements:
  - type: "component"
    name: "Core In-Memory Data Store"
    technology: "Redis OSS / Enterprise"
    description: "Caches encrypted session/lookup data and provides high-throughput in-memory storage."
  - type: "component"
    name: "Lock Coordination Engine"
    technology: "Redlock Engine"
    description: "Acquires scheduling mutex locks for conflict-free appointment management."
  - type: "component"
    name: "Replication & Persistence Controller"
    technology: "Redis Sentinel, AOF (fsync everysec), and RDB"
    description: "Ensures automated failover under 3 seconds and balances data durability with performance."
relationships:
  - source: "Scheduling & Billing Service"
    destination: "Core In-Memory Data Store"
    description: "Caches encrypted session/lookup data [RESP/TLS 1.3]"
  - source: "Scheduling & Billing Service"
    destination: "Lock Coordination Engine"
    description: "Acquires scheduling mutex locks [RESP/TLS 1.3]"