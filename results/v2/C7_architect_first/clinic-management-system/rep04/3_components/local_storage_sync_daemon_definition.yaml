level: component
scope: "Component diagram for the Local Storage/Sync Daemon container"
parentContainer:
  name: "Local Storage/Sync Daemon"
elements:
  - type: "component"
    name: "Sync Engine Coordinator"
    technology: "TypeScript / RxJS"
    description: "Manages reactive, bi-directional delta synchronization and communicates with the core service."
  - type: "component"
    name: "Local Storage Manager"
    technology: "IndexedDB / SQLCipher with Web Crypto API"
    description: "Persists data locally using AES-256 encryption and provides offline storage."
  - type: "component"
    name: "Conflict Resolution Controller"
    technology: "TypeScript"
    description: "Resolves data conflicts during synchronization."
  - type: "component"
    name: "Audit & Safety Interceptor"
    technology: "TypeScript"
    description: "Enforces clinical safety checks and compliance."
  - type: "component"
    name: "Key Derivation & Session Wrapper"
    technology: "Web Crypto API"
    description: "Handles transient key derivation without storing encryption keys permanently on disk."
  - type: "component"
    name: "Encrypted Local Dead-Letter Queue (DLQ)"
    technology: "TypeScript / Encrypted Storage"
    description: "Queues failed messages securely to meet HIPAA and GDPR mandates."
  - type: "component"
    name: "Core Clinical & EMR Service"
    technology: "Java / Spring Boot"
    description: "Backend core service handling clinical data and EMRs."
  - type: "component"
    name: "Web Application Frontend"
    technology: "React / TypeScript"
    description: "Provides the user interface for the clinic management system."
relationships:
  - source: "Sync Engine Coordinator"
    destination: "Core Clinical & EMR Service"
    description: "Communicates via gRPC over mTLS 1.3"
  - source: "Local Storage Manager"
    destination: "Encrypted Local Dead-Letter Queue (DLQ)"
    description: "Persists and queues failed synchronization data"
  - source: "Web Application Frontend"
    destination: "Sync Engine Coordinator"
    description: "Interacts via Local IPC / Custom DOM Events"