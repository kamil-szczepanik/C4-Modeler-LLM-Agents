level: component
scope: "Component diagram for the Scheduling & Billing Service container"
parentContainer:
  name: "Scheduling & Billing Service"
elements:
  - type: "component"
    name: "Appointment Scheduler Component"
    technology: "NestJS / TypeScript"
    description: "Manages resource clash checks and appointment scheduling."
  - type: "component"
    name: "Billing & Claims Processor Component"
    technology: "NestJS / TypeScript"
    description: "Handles billing, insurance claims, and processing payments."
  - type: "component"
    name: "Notification Handler Component"
    technology: "NestJS / TypeScript"
    description: "Handles automated patient reminders and dispatches scrubbed notifications."
  - type: "component"
    name: "Data Access & Encryption Component"
    technology: "TypeORM / AES-256"
    description: "Manages data access, transactional persistence, and encryption at rest."
  - type: "component"
    name: "Redis Cluster"
    technology: "Multi-node with automatic failover"
    description: "Provides high-availability distributed locking and durable local queues for retry logic."
  - type: "component"
    name: "PostgreSQL"
    technology: "Shared database with Outbox table and row-level security"
    description: "Shared database utilized for transactional data persistence and outbox pattern implementation."
  - type: "component"
    name: "Payment Gateway / Insurance Clearinghouse"
    technology: "External System"
    description: "External system for submitting claims and processing payments."
  - type: "component"
    name: "External Notification Service"
    technology: "External System"
    description: "External system that dispatches scrubbed reminders."
  - type: "component"
    name: "Patient Self-Service Portal"
    technology: "Container"
    description: "Portal for patients to view itemized billing data."
relationships:
  - source: "Appointment Scheduler Component"
    destination: "Redis Cluster"
    description: "Acquires distributed locks via Redlock [TCP/TLS]"
  - source: "Appointment Scheduler Component"
    destination: "PostgreSQL"
    description: "Persists transactional events [TypeORM / TCP]"
  - source: "Billing & Claims Processor Component"
    destination: "PostgreSQL"
    description: "Utilizes transactional outbox table for claim dispatch [TypeORM / TCP]"
  - source: "Billing & Claims Processor Component"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Submits claims and processes payments [HTTPS/REST with mTLS]"
  - source: "Billing & Claims Processor Component"
    destination: "Patient Self-Service Portal"
    description: "Exposes itemized billing data [gRPC/REST]"
  - source: "Notification Handler Component"
    destination: "External Notification Service"
    description: "Dispatches scrubbed reminders [HTTPS/REST]"
  - source: "Notification Handler Component"
    destination: "Redis Cluster"
    description: "Utilizes durable local queue for retry logic [TCP/TLS]"
  - source: "Notification Handler Component"
    destination: "PostgreSQL"
    description: "Utilizes durable local queue for retry logic [TCP/TLS]"