level: component
scope: "Component diagram for the EMR Core Service container"
parentContainer:
  name: "EMR Core Service"
elements:
  - type: "component"
    name: "EMR Controller Component"
    technology: "Spring MVC"
    description: "Exposes RESTful endpoints via HTTPS/JSON."
  - type: "component"
    name: "Clinical Data Processing Component"
    technology: "Java / Spring Boot"
    description: "Enforces clinical business logic and emergency break-glass overrides."
  - type: "component"
    name: "Break-Glass Interceptor Sub-component"
    technology: "Spring Interceptor"
    description: "Validates multi-factor emergency override tokens."
  - type: "component"
    name: "Persistence & Audit Repository Component"
    technology: "Spring Data JPA / Hibernate, PostgreSQL"
    description: "Interfaces with PostgreSQL utilizing RLS and AES-256 encryption."
  - type: "component"
    name: "FHIR Event Publisher Component"
    technology: "Spring Cloud Stream, Apache Kafka"
    description: "Publishes asynchronous clinical updates."
  - type: "component"
    name: "API Gateway / Edge Proxy"
    technology: "Envoy / Kubernetes Ingress"
    description: "Routes client requests securely via mTLS/gRPC to the EMR Core Service."
  - type: "component"
    name: "FHIR Interoperability Service"
    technology: "Java / Spring Boot"
    description: "Receives broadcasted clinical updates via Apache Kafka."
relationships:
  - source: "API Gateway / Edge Proxy"
    destination: "EMR Core Service"
    description: "Routes client requests securely via mTLS/gRPC"
  - source: "EMR Controller Component"
    destination: "Clinical Data Processing Component"
    description: "Delegates requests using direct local method calls"
  - source: "Clinical Data Processing Component"
    destination: "Persistence & Audit Repository Component"
    description: "Reads and writes records via TLS/SQL with Row-Level Security"
  - source: "Clinical Data Processing Component"
    destination: "FHIR Event Publisher Component"
    description: "Publishes events asynchronously using Spring ApplicationEventPublisher"
  - source: "FHIR Event Publisher Component"
    destination: "FHIR Interoperability Service"
    description: "Broadcasts clinical updates via Apache Kafka with dynamic Vault tokens"