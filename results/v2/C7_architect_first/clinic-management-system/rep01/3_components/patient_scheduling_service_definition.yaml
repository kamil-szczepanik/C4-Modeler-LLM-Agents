level: component
scope: "Component diagram for the Patient & Scheduling Service container"
parentContainer:
  name: "Patient & Scheduling Service"
elements:
  - type: "component"
    name: "PatientController & SchedulingController"
    technology: "REST and gRPC (NestJS)"
    description: "REST and gRPC entry points for client and API Gateway traffic."
  - type: "component"
    name: "PatientDomainService"
    technology: "TypeScript (NestJS)"
    description: "Manages demographic capture, RBAC/ABAC authorization, and GDPR data masking."
  - type: "component"
    name: "SchedulingEngine"
    technology: "TypeScript (NestJS)"
    description: "Executes real-time resource clash checks and asynchronous booking workflows."
  - type: "component"
    name: "AuditInterceptor"
    technology: "TypeScript (NestJS)"
    description: "Generates fail-secure, immutable audit trails for compliance."
  - type: "component"
    name: "EventDispatcher"
    technology: "Transactional Outbox Pattern (Kafka)"
    description: "Emits domain events using the Transactional Outbox Pattern over Kafka."
  - type: "component"
    name: "AvailabilityCacheManager"
    technology: "Encrypted Redis"
    description: "Caches anonymous slot metadata via encrypted Redis."
  - type: "component"
    name: "DataRepository"
    technology: "PostgreSQL with TypeORM & AES-256"
    description: "Interfaces with PostgreSQL using TypeORM and AES-256 encryption."
  - type: "component"
    name: "API Gateway"
    technology: "API Gateway / Edge Proxy"
    description: "External entry point routing client traffic."
  - type: "component"
    name: "Kafka Message Broker"
    technology: "Kafka over TLS 1.3 with SASL/SCRAM"
    description: "Handles asynchronous event streaming."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "HTTPS"
    description: "Secret management and dynamic credential issuance."
relationships:
  - source: "API Gateway"
    destination: "PatientController & SchedulingController"
    description: "gRPC / mTLS"
  - source: "SchedulingEngine"
    destination: "AvailabilityCacheManager"
    description: "Redis over TLS"
  - source: "SchedulingEngine"
    destination: "DataRepository"
    description: "TCP/SQL over TLS"
  - source: "PatientDomainService"
    destination: "DataRepository"
    description: "TCP/SQL over TLS"
  - source: "EventDispatcher"
    destination: "Kafka Message Broker"
    description: "Kafka over TLS 1.3 with SASL/SCRAM"
  - source: "AuditInterceptor"
    destination: "HashiCorp Vault"
    description: "HTTPS"