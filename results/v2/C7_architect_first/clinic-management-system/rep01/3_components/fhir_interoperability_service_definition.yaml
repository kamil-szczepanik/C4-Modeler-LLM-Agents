level: component
scope: "Component diagram for the FHIR Interoperability Service container"
parentContainer:
  name: "FHIR Interoperability Service"
elements:
  - type: "component"
    name: "FHIR REST Controller"
    technology: "Java / Spring MVC"
    description: "Exposes FHIR R4/R5 endpoints and validates OAuth 2.0 / SMART-on-FHIR scopes."
  - type: "component"
    name: "Resource Mapping Engine"
    technology: "HAPI FHIR / Java"
    description: "Translates internal EMR models to FHIR JSON/XML, prioritizing patient-facing reads."
  - type: "component"
    name: "Audit & Compliance Interceptor"
    technology: "Java"
    description: "Captures transactions and enforces redacted, HIPAA-compliant access logs."
  - type: "component"
    name: "FHIR Message Queue Broker"
    technology: "NATS JetStream"
    description: "Buffers asynchronous FHIR bundles with AES-256 encrypted persistent volumes."
  - type: "component"
    name: "External Integration Client"
    technology: "Apache HttpClient/WebClient"
    description: "Manages outbound communication with external lab and imaging systems."
  - type: "component"
    name: "External Lab & Imaging Systems"
    technology: "HTTPS / mTLS"
    description: "External systems exchanging clinical data."
relationships:
  - source: "FHIR REST Controller"
    destination: "Resource Mapping Engine"
    description: "Delegates payload transformation [In-memory Java Method Calls]"
  - source: "Resource Mapping Engine"
    destination: "Audit & Compliance Interceptor"
    description: "Emits transaction audit events [Spring Application Events]"
  - source: "FHIR REST Controller"
    destination: "FHIR Message Queue Broker"
    description: "Offloads asynchronous FHIR ingestion [AMQP/NATS]"
  - source: "FHIR Message Queue Broker"
    destination: "External Integration Client"
    description: "Feeds queued outbound transactions [AMQP/NATS]"
  - source: "External Integration Client"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical data [HTTPS / mTLS with client certificate pinning]"