level: component
scope: "Component diagram for the Data Storage Layer container"
parentContainer:
  name: "Data Storage Layer"
elements:
  - type: "component"
    name: "Relational Database Engine"
    technology: "PostgreSQL 15+ with Citus/Patroni, PgAudit"
    description: "Provides relational storage with active-active high availability and Row-Level Security (RLS)."
  - type: "component"
    name: "Object Storage Repository"
    technology: "MinIO on-prem / AWS S3 in eu-central-1"
    description: "Supplies object storage with WORM policies and S3 Object Lock in Compliance mode for 10-year retention."
  - type: "component"
    name: "Database Audit & Encryption Proxy"
    technology: "HashiCorp Vault and PgAudit"
    description: "Manages envelope encryption keys, automatic 90-day key rotation, and audit logging."
  - type: "component"
    name: "Connection Pooling & Load Balancing"
    technology: "PgBouncer"
    description: "Separates read-only queries from transactional writes to meet P95 performance targets."
  - type: "component"
    name: "Backup and Disaster Recovery"
    technology: "Velero and automated WAL archiving"
    description: "Executes Kubernetes-native continuous snapshotting of persistent volumes and WAL archiving."
  - type: "component"
    name: "EMR Core Service"
    technology: "External Service"
    description: "Consumes relational database and object storage."
  - type: "component"
    name: "Billing Service"
    technology: "External Service"
    description: "Consumes relational database."
relationships:
  - source: "EMR Core Service"
    destination: "Relational Database Engine"
    description: "TLS/SQL with RLS, TCP 5432"
  - source: "Billing Service"
    destination: "Relational Database Engine"
    description: "TLS/SQL with RLS, TCP 5432"
  - source: "EMR Core Service"
    destination: "Object Storage Repository"
    description: "HTTPS/S3 API, TLS 1.3"
  - source: "Relational Database Engine"
    destination: "Object Storage Repository"
    description: "Continuous WAL archiving, HTTPS"