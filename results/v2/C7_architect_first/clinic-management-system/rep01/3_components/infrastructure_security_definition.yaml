level: component
scope: "Component diagram for the Infrastructure & Security container"
parentContainer:
  name: "Infrastructure & Security"
elements:
  - type: "component"
    name: "Service Mesh Control Plane & Envoys"
    technology: "Istio"
    description: "Manages mTLS and zero-trust traffic policies across hybrid clusters, enforcing ingress security."
  - type: "component"
    name: "Secrets & Key Management Service"
    technology: "HashiCorp Vault & AWS KMS with FIPS HSM backing"
    description: "Enforces AES-256 encryption at rest and FIPS-validated key management."
  - type: "component"
    name: "GitOps Deployment Engine"
    technology: "ArgoCD"
    description: "Triggers hybrid deployments across on-premise Kubernetes clusters and AWS."
  - type: "component"
    name: "Observability & Distributed Tracing Pipeline"
    technology: "OpenTelemetry, Prometheus, Grafana Tempo"
    description: "Delivers distributed tracing and PHI-scrubbed observability, collecting metrics, logs, and traces."
  - type: "component"
    name: "Policy & Identity Enforcement Engine"
    technology: "Open Policy Agent / OPA"
    description: "Provides fine-grained ABAC and patient consent enforcement."
  - type: "component"
    name: "Distributed Policy Cache"
    technology: "Redis / OPA sidecar caching"
    description: "Localizes policy evaluation to maintain <50ms latency budgets by reading cached evaluation rules."
  - type: "component"
    name: "Secrets & Key Replication Manager"
    technology: "Custom Replication Engine"
    description: "Manages secrets and key replication to ensure high resilience across hybrid environments."
relationships:
  - source: "API Gateway"
    destination: "Service Mesh Control Plane & Envoys"
    description: "Enforces ingress security and mutual TLS [gRPC]"
  - source: "EMR Core Service"
    destination: "Secrets & Key Management Service"
    description: "Fetches envelope encryption keys with local caching [gRPC / HTTPS]"
  - source: "System Administrators"
    destination: "GitOps Deployment Engine"
    description: "Triggers hybrid deployments [Git/HTTPS]"
  - source: "All Containers"
    destination: "Observability & Distributed Tracing Pipeline"
    description: "Exports metrics, logs, and traces [OTLP/gRPC]"
  - source: "Policy & Identity Enforcement Engine"
    destination: "Distributed Policy Cache"
    description: "Reads cached evaluation rules [In-memory / Local IPC]"