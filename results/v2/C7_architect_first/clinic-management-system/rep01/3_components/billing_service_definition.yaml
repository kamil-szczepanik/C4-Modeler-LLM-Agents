level: component
scope: "Component diagram for the Billing Service container"
parentContainer:
  name: "Billing Service"
elements:
  - type: "component"
    name: "Billing API Controller & Patient Billing Portal API"
    technology: "FastAPI"
    description: "Manages incoming traffic, routes API requests, and handles patient billing portal interactions."
  - type: "component"
    name: "Invoice & Ledger Engine"
    technology: "Python"
    description: "Handles core business logic for patient financial transactions, invoicing, and ledger updates."
  - type: "component"
    name: "Claims Processor & Insurance Reconciliation Engine"
    technology: "Python/Celery"
    description: "Decouples and manages asynchronous insurance claims processing and reconciliation."
  - type: "component"
    name: "Payment Integrator"
    technology: "Python/HTTPX"
    description: "Interfaces with external payment gateways and insurance clearinghouses to process payments."
  - type: "component"
    name: "Billing Data Repository"
    technology: "PostgreSQL with SQLAlchemy ORM"
    description: "Provides relational data integrity and handles data persistence for financial records."
  - type: "component"
    name: "Idempotency State Store"
    technology: "Distributed Redis"
    description: "Powers idempotency controls to ensure safe, duplicate-free financial operations."
relationships:
  - source: "API Gateway / Edge Proxy"
    destination: "Billing API Controller & Patient Billing Portal API"
    description: "Routes incoming traffic [mTLS/gRPC/HTTPS]"
  - source: "Billing API Controller & Patient Billing Portal API"
    destination: "Invoice & Ledger Engine"
    description: "Delegates business logic [In-Memory / Python Function Calls]"
  - source: "Claims Processor & Insurance Reconciliation Engine"
    destination: "External Payment Gateway & Insurance Clearinghouse"
    description: "Submits claims and processes payments [HTTPS]"
  - source: "Payment Integrator"
    destination: "External Payment Gateway & Insurance Clearinghouse"
    description: "Submits claims and processes payments [HTTPS]"
  - source: "Invoice & Ledger Engine"
    destination: "Billing Data Repository"
    description: "Interfaces for data persistence and ledger updates [SQLAlchemy Connection Pooling]"
  - source: "Claims Processor & Insurance Reconciliation Engine"
    destination: "Idempotency State Store"
    description: "Uses for idempotency state management [Redis]"