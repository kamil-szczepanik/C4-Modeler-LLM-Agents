level: container
scope: "Container diagram for Clinic Management System (CMS)"
system:
  name: "Clinic Management System (CMS)"
elements:
  - type: "person"
    name: "Patients & Clinical Staff"
    description: "Doctors, nurses, receptionists, and patients who access the system via web or mobile interfaces for admissions, records, and scheduling."
  - type: "person"
    name: "System Administrators"
    description: "Administrators responsible for managing and maintaining the Clinic Management System infrastructure."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing laboratory and medical imaging data."
  - type: "externalSystem"
    name: "Payment Gateway & Insurance Clearinghouse"
    description: "External financial systems handling billing, payments, and insurance claims."
  - type: "externalSystem"
    name: "External Identity Provider (IdP)"
    description: "External provider handling authentication and Multi-Factor Authentication (MFA)."
  - type: "container"
    name: "API Gateway / Edge Proxy"
    technology: "Kong/Envoy"
    description: "Manages incoming traffic, security enforcement, and routing to internal microservices."
  - type: "container"
    name: "Patient & Scheduling Service"
    technology: "Node.js/TypeScript"
    description: "Manages patient admissions, profiles, and appointment scheduling."
  - type: "container"
    name: "EMR Core Service"
    technology: "Java/Spring Boot"
    description: "Handles core electronic medical records and clinical data processing."
  - type: "container"
    name: "Billing Service"
    technology: "Python/FastAPI"
    description: "Processes patient billing, payments, and insurance claims."
  - type: "container"
    name: "FHIR Interoperability Service"
    technology: "Java/HAPI FHIR"
    description: "Facilitates healthcare data exchange using the FHIR standard with external systems."
  - type: "container"
    name: "Data Storage Layer"
    technology: "PostgreSQL, MinIO/AWS S3 Object Storage"
    description: "Provides secure persistent storage for relational data with RLS and object storage."
  - type: "container"
    name: "Infrastructure & Security"
    technology: "Istio Service Mesh, HashiCorp Vault/AWS KMS, ArgoCD"
    description: "Manages service-to-service communication security, encryption keys, and declarative deployments."
relationships:
  - source: "Patients & Clinical Staff"
    destination: "API Gateway / Edge Proxy"
    description: "Accesses system features via secure web or mobile interfaces"
    technology: "HTTPS/REST"
  - source: "System Administrators"
    destination: "Infrastructure & Security"
    description: "Manages hybrid infrastructure and deployments"
    technology: "ArgoCD / mTLS"
  - source: "API Gateway / Edge Proxy"
    destination: "Patient & Scheduling Service"
    description: "Routes client requests securely"
    technology: "mTLS/gRPC"
  - source: "API Gateway / Edge Proxy"
    destination: "EMR Core Service"
    description: "Routes client requests securely"
    technology: "mTLS/gRPC"
  - source: "API Gateway / Edge Proxy"
    destination: "Billing Service"
    description: "Routes client requests securely"
    technology: "mTLS/gRPC"
  - source: "API Gateway / Edge Proxy"
    destination: "FHIR Interoperability Service"
    description: "Routes client requests securely"
    technology: "mTLS/gRPC"
  - source: "EMR Core Service"
    destination: "Data Storage Layer"
    description: "Reads and writes electronic medical records"
    technology: "TLS/SQL with RLS"
  - source: "FHIR Interoperability Service"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical lab and imaging data"
    technology: "HTTPS/TLS with client certificate pinning"
  - source: "Billing Service"
    destination: "Payment Gateway & Insurance Clearinghouse"
    description: "Processes payments and insurance claims"
    technology: "HTTPS"