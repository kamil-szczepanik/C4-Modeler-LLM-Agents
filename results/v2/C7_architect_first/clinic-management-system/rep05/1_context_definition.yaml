level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid clinical IT platform that manages patient admissions, electronic medical records, appointment scheduling, and billing, providing high availability, stringent compliance, and seamless interoperability."
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals who access the system for appointments, portals, and billing interactions."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals who access latency-critical electronic medical records (EMR) workflows."
  - type: "person"
    name: "Hospital Administrators"
    description: "Staff members who manage administrative, scheduling, and billing operations."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system responsible for issuing OAuth2/JWT tokens for user authentication."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External medical systems that integrate with the platform for clinical data exchange."
  - type: "externalSystem"
    name: "Payment Gateways/Insurance Clearinghouses"
    description: "External financial systems utilized for billing and payment processing."
relationships:
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Accesses the system via portal and billing traffic"
    technology: "HTTPS/TLS 1.3, OAuth2/JWT"
  - source: "Clinicians"
    destination: "Clinic Management System"
    description: "Accesses latency-critical EMR workflows"
    technology: "HTTPS/TLS 1.3, OAuth2/JWT"
  - source: "Hospital Administrators"
    destination: "Clinic Management System"
    description: "Manages system operations and administrative functions"
    technology: "HTTPS/TLS 1.3, OAuth2/JWT"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users and issues tokens"
    technology: "OAuth2/JWT"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges standardized clinical data"
    technology: "RESTful HL7 FHIR over mutual TLS (mTLS)"
  - source: "Clinic Management System"
    destination: "Payment Gateways/Insurance Clearinghouses"
    description: "Processes payments and insurance claims"
    technology: "HTTPS"