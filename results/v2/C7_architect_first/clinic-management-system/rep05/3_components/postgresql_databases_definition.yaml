level: component
scope: "Component diagram for the PostgreSQL Databases container"
parentContainer:
  name: "PostgreSQL Databases"
elements:
  - type: "component"
    name: "Patient & Portal DB"
    technology: "PostgreSQL 16, Patroni, CloudNativePG"
    description: "Stores patient portal and profile data with mTLS TCP connectivity."
  - type: "component"
    name: "Scheduling DB"
    technology: "PostgreSQL 16, Patroni, CloudNativePG"
    description: "Stores scheduling and appointment data with mTLS TCP connectivity."
  - type: "component"
    name: "EMR DB"
    technology: "PostgreSQL 16, Patroni, CloudNativePG, pgaudit"
    description: "Stores active and archival electronic medical records with HIPAA audit logging."
  - type: "component"
    name: "Billing DB"
    technology: "PostgreSQL 16, Patroni, CloudNativePG"
    description: "Stores financial records and billing information with mTLS TCP connectivity."
relationships:
  - source: "Patient Portal Service"
    destination: "Patient & Portal DB"
    description: "Reads/writes data [TCP / mTLS]"
  - source: "Patient & Scheduling Service"
    destination: "Scheduling DB"
    description: "Reads/writes data [TCP / mTLS]"
  - source: "EMR Service"
    destination: "EMR DB"
    description: "Reads/writes active and archival data [TCP / mTLS]"
  - source: "Billing Service"
    destination: "Billing DB"
    description: "Reads/writes financial records [TCP / mTLS]"
  - source: "Integration Service"
    destination: "Patient & Portal DB"
    description: "Interoperability data sync [TCP / mTLS]"
  - source: "Integration Service"
    destination: "Scheduling DB"
    description: "Interoperability data sync [TCP / mTLS]"
  - source: "Integration Service"
    destination: "EMR DB"
    description: "Interoperability data sync [TCP / mTLS]"
  - source: "Integration Service"
    destination: "Billing DB"
    description: "Interoperability data sync [TCP / mTLS]"