level: component
scope: "Component diagram for the EMR Service container"
parentContainer:
  name: "EMR Service"
elements:
  - type: "component"
    name: "EMR API Controller"
    technology: "Spring MVC / WebFlux"
    description: "Handles incoming HTTP/gRPC requests, routes them, and initiates patient consent validation."
  - type: "component"
    name: "Clinical Record Manager"
    technology: "Java / Spring Boot Core Domain"
    description: "Manages clinical workflows, core domain logic, and the Clinical Summary Generator."
  - type: "component"
    name: "Audit Trail Service & Compliance Dashboard Feed"
    technology: "Spring Boot / Spring Kafka"
    description: "Streams signed audit events to the event broker for compliance monitoring."
  - type: "component"
    name: "Consent & Preference Handler"
    technology: "Java / Spring Boot"
    description: "Pre-processes and validates patient consent via internal calls."
  - type: "component"
    name: "FHIR Interoperability Adapter"
    technology: "HL7 FHIR / OAuth2 / OIDC"
    description: "Communicates with external systems via HL7 FHIR APIs using mutual TLS."
  - type: "component"
    name: "Vault Transit Client"
    technology: "HashiCorp Vault"
    description: "Manages encryption keys and envelope encryption for secure data handling."
  - type: "component"
    name: "PostgreSQL Databases"
    technology: "PostgreSQL with HikariCP & Redis"
    description: "Primary transactional persistence with automated table-partitioning and caching layer."
  - type: "component"
    name: "Apache Kafka Event Broker"
    technology: "Apache Kafka"
    description: "Asynchronous event broker for tamper-evident audit streaming."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Provides envelope encryption and dynamic key rotation."
relationships:
  - source: "API Gateway"
    destination: "EMR API Controller"
    description: "Routes requests via gRPC / Internal Mesh with mTLS"
  - source: "EMR API Controller"
    destination: "Consent & Preference Handler"
    description: "Pre-processes patient consent validation via internal calls"
  - source: "Clinical Record Manager"
    destination: "PostgreSQL Databases"
    description: "JDBC over TCP / TLS with HikariCP pooling"
  - source: "Clinical Record Manager"
    destination: "Redis"
    description: "Caches encrypted PHI summaries over TCP / TLS with Resilience4j"
  - source: "Audit Trail Service"
    destination: "Apache Kafka Event Broker"
    description: "Streams signed events via Spring Kafka over TCP / TLS"
  - source: "EMR Service components"
    destination: "HashiCorp Vault"
    description: "Manages encryption keys and envelope encryption via Vault Transit Client"
  - source: "FHIR Interoperability Adapter"
    destination: "External Systems"
    description: "Communicates via HL7 FHIR APIs with OAuth2/OIDC mutual TLS"