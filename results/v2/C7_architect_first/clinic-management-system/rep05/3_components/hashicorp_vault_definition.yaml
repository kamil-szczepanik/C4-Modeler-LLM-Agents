level: component
scope: "Component diagram for the HashiCorp Vault container"
parentContainer:
  name: "HashiCorp Vault"
elements:
  - type: "component"
    name: "HTTP API / Core Router"
    technology: "Go"
    description: "Handles incoming HTTP/gRPC requests, routing them to the appropriate internal Vault subsystems."
  - type: "component"
    name: "Secrets Engines Manager"
    technology: "Go"
    description: "Manages secrets engines, handling dynamic credential generation for PostgreSQL Databases and data encryption."
  - type: "component"
    name: "Auth Methods Manager"
    technology: "Go"
    description: "Manages authentication methods including Kubernetes Auth and AppRole for microservices."
  - type: "component"
    name: "Audit Log Subsystem"
    technology: "Go"
    description: "Streams compliance and audit logs to tamper-evident storage."
  - type: "component"
    name: "Consul Storage Backend / Raft Consensus"
    technology: "Go / Raft"
    description: "Provides durable, highly available storage and consensus for Vault data."
relationships:
  - source: "HTTP API / Core Router"
    destination: "Secrets Engines Manager"
    description: "Delegates secret retrieval and dynamic credential requests"
  - source: "HTTP API / Core Router"
    destination: "Auth Methods Manager"
    description: "Delegates authentication requests"
  - source: "Auth Methods Manager"
    destination: "HTTP API / Core Router"
    description: "Returns authentication tokens"
  - source: "Secrets Engines Manager"
    destination: "Consul Storage Backend / Raft Consensus"
    description: "Reads and writes encrypted state data"
  - source: "HTTP API / Core Router"
    destination: "Audit Log Subsystem"
    description: "Logs request and response audit trails"