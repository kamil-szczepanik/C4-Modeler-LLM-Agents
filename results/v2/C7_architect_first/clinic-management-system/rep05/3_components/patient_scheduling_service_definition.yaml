level: component
scope: "Component diagram for the Patient & Scheduling Service container"
parentContainer:
  name: "Patient & Scheduling Service"
elements:
  - type: "component"
    name: "Patient Controller"
    technology: "NestJS Controller"
    description: "Handles gRPC endpoints for patient registration and electronic medical records."
  - type: "component"
    name: "Scheduling Controller"
    technology: "NestJS Controller"
    description: "Handles gRPC endpoints for appointment scheduling."
  - type: "component"
    name: "Appointment Engine"
    technology: "Node.js / TypeScript"
    description: "Manages business logic for resource checks and scheduling workflows."
  - type: "component"
    name: "Conflict Resolution Service"
    technology: "Node.js / TypeScript"
    description: "Manages slot-finding logic and resolves scheduling clashes."
  - type: "component"
    name: "Data Access Repository"
    technology: "TypeORM / Prisma"
    description: "Persistence layer handling reads and writes to the relational database with pessimistic locking."
  - type: "component"
    name: "Outbox Dispatcher"
    technology: "Node.js / TypeScript"
    description: "Implements the transactional outbox pattern to persist domain events atomically."
  - type: "component"
    name: "Event Publisher"
    technology: "KafkaJS"
    description: "Publishes domain events via TCP/TLS to the event broker."
relationships:
  - source: "Scheduling Controller"
    destination: "Appointment Engine"
    description: "Invokes business logic via direct method calls."
  - source: "Appointment Engine"
    destination: "Conflict Resolution Service"
    description: "Triggers slot-finding logic upon clash detection."
  - source: "Data Access Repository"
    destination: "Outbox Dispatcher"
    description: "Persists domain events atomically."