level: component
scope: "Component diagram for the Integration Service container"
parentContainer:
  name: "Integration Service"
elements:
  - type: "component"
    name: "FHIR Route Engine"
    technology: "Apache Camel / Java"
    description: "Orchestrates enterprise integration patterns and HL7 FHIR transformations."
  - type: "component"
    name: "HL7 v2/v3 Adapter"
    technology: "Apache Camel / Java"
    description: "Adapts legacy HL7 v2 and v3 messages for internal consumption."
  - type: "component"
    name: "Kafka Event Publisher"
    technology: "Java / Kafka Client"
    description: "Publishes sanitized events to the Apache Kafka event broker."
  - type: "component"
    name: "Resilience & DLQ Handler"
    technology: "Java / Spring Retry / Camel"
    description: "Delegates failures and publishes encrypted poison messages to the DLQ."
  - type: "component"
    name: "Payload Masking & Audit Interceptor"
    technology: "Java / Interceptor"
    description: "Passes and sanitizes clinical payloads in-memory."
relationships:
  - source: "API Gateway"
    destination: "Integration Service"
    description: "Routes requests [gRPC / Internal Mesh with mTLS]"
  - source: "FHIR Route Engine"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical data [HTTPS / REST / HL7 FHIR APIs]"
  - source: "FHIR Route Engine"
    destination: "Payload Masking & Audit Interceptor"
    description: "Passes clinical payloads [In-memory]"
  - source: "Payload Masking & Audit Interceptor"
    destination: "Kafka Event Publisher"
    description: "Forwards sanitized events [In-memory]"
  - source: "FHIR Route Engine"
    destination: "Resilience & DLQ Handler"
    description: "Delegates failures [In-memory]"
  - source: "Resilience & DLQ Handler"
    destination: "Apache Kafka Event Broker"
    description: "Publishes encrypted poison messages to DLQ [TCP / TLS]"
  - source: "Integration Service"
    destination: "PostgreSQL Databases"
    description: "Reads and writes clinical data [TCP / TLS]"