level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "API Gateway Core"
    technology: "Envoy / Kong"
    description: "Active-active Kubernetes ingress and high-performance routing."
  - type: "component"
    name: "Envoy Sidecar Container"
    technology: "Envoy"
    description: "Manages sidecar proxying and service mesh communication."
  - type: "component"
    name: "TLS Termination & mTLS Enforcer"
    technology: "Envoy Security Filter"
    description: "Handles TLS termination and enforces mutual TLS."
  - type: "component"
    name: "OAuth2/OIDC Token Introspection & Scope Enforcer"
    technology: "Envoy Auth Filter / Lua"
    description: "Validates tokens and enforces security scopes."
  - type: "component"
    name: "WAF & Payload Sanitization Filter"
    technology: "WASM / Envoy Filter"
    description: "Protects against web attacks and sanitizes payloads."
  - type: "component"
    name: "Data Masking & PII Redirection Filter"
    technology: "WASM / Lua"
    description: "Masks sensitive data and handles PII redirection."
  - type: "component"
    name: "Dynamic Router"
    technology: "Envoy Router"
    description: "Dynamically routes incoming requests."
  - type: "component"
    name: "Rate Limiting & Circuit Breaker Engine"
    technology: "Envoy Rate Limit Service"
    description: "Prevents overloading and provides circuit breaking."
  - type: "component"
    name: "Request Transformation Engine"
    technology: "Native Lua / WASM filters"
    description: "Translates REST/GraphQL to gRPC."
  - type: "component"
    name: "Patient & Resource Session Router"
    technology: "Envoy Routing Rules"
    description: "Routes patient and resource sessions."
  - type: "component"
    name: "Health Probe & Canary Traffic Controller"
    technology: "Kubernetes Probes / Envoy"
    description: "Manages health checks and canary deployments."
  - type: "component"
    name: "Distributed Tracing Injector"
    technology: "OpenTelemetry"
    description: "Injects tracing headers into requests."
  - type: "component"
    name: "Telemetry Exporter"
    technology: "Prometheus Exporter"
    description: "Exports metrics to the central monitoring stack."
  - type: "component"
    name: "API Usage Analytics & Monetization Logger"
    technology: "Analytics Logger"
    description: "Logs API usage and monetization metrics."
relationships:
  - source: "API Gateway Core"
    destination: "Dynamic Router"
    description: "Passes routed requests"
  - source: "TLS Termination & mTLS Enforcer"
    destination: "OAuth2/OIDC Token Introspection & Scope Enforcer"
    description: "Forwards authenticated traffic"
  - source: "OAuth2/OIDC Token Introspection & Scope Enforcer"
    destination: "WAF & Payload Sanitization Filter"
    description: "Passes inspected requests"
  - source: "WAF & Payload Sanitization Filter"
    destination: "Data Masking & PII Redirection Filter"
    description: "Passes sanitized payloads"
  - source: "Dynamic Router"
    destination: "Request Transformation Engine"
    description: "Transforms request protocols"
  - source: "Request Transformation Engine"
    destination: "Patient & Resource Session Router"
    description: "Directs session traffic"
  - source: "Rate Limiting & Circuit Breaker Engine"
    destination: "Dynamic Router"
    description: "Enforces limits on routing"
  - source: "Distributed Tracing Injector"
    destination: "Telemetry Exporter"
    description: "Sends tracing and telemetry data"