level: component
scope: "Component diagram for the Billing Service container"
parentContainer:
  name: "Billing Service"
elements:
  - type: "component"
    name: "Invoice Controller"
    technology: "Python / FastAPI"
    description: "Handles incoming HTTP and gRPC requests related to invoicing and billing operations."
  - type: "component"
    name: "Claim Processing Engine"
    technology: "Python / FastAPI"
    description: "Processes claims and manages insurance clearinghouse workflows."
  - type: "component"
    name: "Payment Gateway Adapter"
    technology: "Python / FastAPI"
    description: "Interfaces with external payment gateways and insurance clearinghouses to process payments and settlements."
  - type: "component"
    name: "Billing Data Access Repository"
    technology: "SQLAlchemy ORM"
    description: "Manages transactional boundaries and interacts with PostgreSQL databases, enforcing field-level encryption."
  - type: "component"
    name: "Audit & Compliance Interceptor"
    technology: "Python / FastAPI"
    description: "Enforces cryptographic audit logging and compliance checks for HIPAA and GDPR."
  - type: "component"
    name: "Kafka Event Consumer"
    technology: "Python / aiokafka"
    description: "Consumes asynchronous events and handles message processing from the Apache Kafka Event Broker."
relationships:
  - source: "Invoice Controller"
    destination: "Claim Processing Engine"
    description: "Passes invoice and billing data for claim evaluation [In-process]"
  - source: "Claim Processing Engine"
    destination: "Payment Gateway Adapter"
    description: "Sends settlement and payment requests [HTTPS]"
  - source: "Invoice Controller"
    destination: "Billing Data Access Repository"
    description: "Reads and writes transactional billing data [TCP / TLS]"
  - source: "Claim Processing Engine"
    destination: "Billing Data Access Repository"
    description: "Persists claim status and transaction logs [TCP / TLS]"
  - source: "Audit & Compliance Interceptor"
    destination: "Billing Data Access Repository"
    description: "Records compliance and audit trails [TCP / TLS]"
  - source: "Kafka Event Consumer"
    destination: "Claim Processing Engine"
    description: "Dispatches asynchronous failure events and exception feeds [In-process]"