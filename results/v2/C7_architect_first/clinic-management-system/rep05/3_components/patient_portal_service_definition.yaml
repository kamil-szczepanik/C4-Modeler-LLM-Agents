level: component
scope: "Component diagram for the Patient Portal Service container"
parentContainer:
  name: "Patient Portal Service"
elements:
  - type: "component"
    name: "Portal Controller / Router"
    technology: "NestJS / Express.js, gRPC, HTTP"
    description: "Router handling incoming gRPC and HTTP requests."
  - type: "component"
    name: "Patient Profile & Auth Manager"
    technology: "Node.js / TypeScript, OIDC, JWT, RBAC/ABAC"
    description: "Enforces MFA, OIDC JWT validation, RBAC/ABAC, and proxy access."
  - type: "component"
    name: "Appointment View Component"
    technology: "Node.js / TypeScript, ORM"
    description: "Manages appointment history and slot selection."
  - type: "component"
    name: "Consent & Preference Handler"
    technology: "Node.js / TypeScript"
    description: "Captures and verifies GDPR/HIPAA compliance flags with cryptographic audit trails."
  - type: "component"
    name: "Notification & Engagement Manager"
    technology: "Node.js / TypeScript, HTTPS / REST"
    description: "Triggers SMS/email alerts via external gateways with stripped PHI/PII."
  - type: "component"
    name: "Data Access Repository"
    technology: "TypeScript, ORM, TCP/TLS"
    description: "Manages encrypted database persistence."
  - type: "component"
    name: "Event Publisher"
    technology: "Node.js / TypeScript, TCP / TLS"
    description: "Emits domain events to Apache Kafka."
relationships:
  - source: "API Gateway"
    destination: "Portal Controller / Router"
    description: "Routes incoming requests [gRPC / Internal Mesh with mTLS]"
  - source: "Portal Controller / Router"
    destination: "Patient Profile & Auth Manager"
    description: "Forwards authentication and demographic interactions [In-memory / Function Call]"
  - source: "Appointment View Component"
    destination: "Data Access Repository"
    description: "Queries and updates appointment data [TypeScript/ORM via TCP/TLS]"
  - source: "Event Publisher"
    destination: "Apache Kafka Event Broker"
    description: "Publishes domain events [TCP / TLS]"
  - source: "Notification & Engagement Manager"
    destination: "External Notification Gateway"
    description: "Sends alerts [HTTPS / REST]"