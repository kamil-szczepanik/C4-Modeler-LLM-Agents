level: component
scope: "Component diagram for the Apache Kafka Event Broker container"
parentContainer:
  name: "Apache Kafka Event Broker"
elements:
  - type: "component"
    name: "Kafka Broker Core"
    technology: "Apache Kafka with KRaft consensus"
    description: "Publishes and consumes partitioned event logs via mTLS."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry"
    description: "Validates message structure against enforced contracts via HTTP/REST over TLS."
  - type: "component"
    name: "Kafka Connect"
    technology: "Apache Kafka Connect"
    description: "Offloads immutable audit and EMR logs to object storage / long-term archive."
relationships:
  - source: "Kafka Broker Core"
    destination: "Schema Registry"
    description: "Validates message structure against enforced contracts via HTTP/REST over TLS"
  - source: "Kafka Connect"
    destination: "Kafka Broker Core"
    description: "Consumes event logs for offloading to long-term archive"