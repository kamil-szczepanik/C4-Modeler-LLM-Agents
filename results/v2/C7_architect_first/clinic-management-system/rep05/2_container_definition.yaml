level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals who access the system for appointments, portals, and billing interactions."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals who access latency-critical electronic medical records (EMR) workflows."
  - type: "person"
    name: "Hospital Administrators"
    description: "Staff members who manage administrative, scheduling, and billing operations."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system responsible for user authentication and authorization."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External medical systems that integrate with the platform for clinical data exchange via HL7 FHIR."
  - type: "externalSystem"
    name: "Payment Gateways & Insurance Clearinghouses"
    description: "External financial and insurance systems utilized for billing and payment processing."
  - type: "container"
    name: "API Gateway"
    technology: "Kong, Nginx, Envoy sidecar"
    description: "Manages incoming traffic, routing, mTLS, circuit breaking, and resilience."
  - type: "container"
    name: "Patient Portal Service"
    technology: "Node.js / TypeScript"
    description: "Handles patient-facing portal workflows and interactions."
  - type: "container"
    name: "Patient & Scheduling Service"
    technology: "Node.js / TypeScript"
    description: "Manages patient records and appointment scheduling workflows."
  - type: "container"
    name: "EMR Service"
    technology: "Java / Spring Boot"
    description: "Handles electronic medical records and clinical workflows."
  - type: "container"
    name: "Billing Service"
    technology: "Python / FastAPI"
    description: "Processes billing, payments, and interactions with financial clearinghouses."
  - type: "container"
    name: "Integration Service"
    technology: "Apache Camel"
    description: "Integrates with external lab, imaging, and healthcare systems using HL7 FHIR APIs."
  - type: "container"
    name: "PostgreSQL Databases"
    technology: "PostgreSQL with read replicas"
    description: "Persists core application data with read replicas for high availability."
  - type: "container"
    name: "Apache Kafka Event Broker"
    technology: "Apache Kafka"
    description: "Provides event-driven asynchronous messaging across microservices."
  - type: "container"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Manages secrets and sensitive configuration data securely."
relationships:
  - source: "Patients"
    destination: "API Gateway"
    description: "Accesses portals and scheduling"
    technology: "HTTPS/REST/GraphQL/mTLS"
  - source: "Clinicians"
    destination: "API Gateway"
    description: "Accesses EMR workflows and clinical data"
    technology: "HTTPS/REST/GraphQL/mTLS"
  - source: "Hospital Administrators"
    destination: "API Gateway"
    description: "Accesses management and administrative functions"
    technology: "HTTPS/REST/GraphQL/mTLS"
  - source: "API Gateway"
    destination: "Patient Portal Service"
    description: "Routes requests"
    technology: "gRPC / Internal Mesh with mTLS"
  - source: "API Gateway"
    destination: "Patient & Scheduling Service"
    description: "Routes requests"
    technology: "gRPC / Internal Mesh with mTLS"
  - source: "API Gateway"
