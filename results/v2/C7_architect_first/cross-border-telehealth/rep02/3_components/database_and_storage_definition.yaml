level: component
scope: "Component diagram for the Database and Storage container"
parentContainer:
  name: "Database and Storage"
elements:
  - type: "component"
    name: "PostgreSQL Database"
    technology: "Google Cloud SQL PostgreSQL (Enterprise Plus), Row-Level Security, TLS 1.3"
    description: "Persists patient data, operational records, and audit logs with region-locked data residency."
  - type: "component"
    name: "WORM Storage"
    technology: "Google Cloud Storage, Regional WORM Bucket Lock, CMEK via Cloud KMS"
    description: "Stores immutable audit logs and compliance records to satisfy EU MDR traceability and accountability."
relationships:
  - source: "PostgreSQL Database"
    destination: "WORM Storage"
    description: "Synchronizes or archives operational audit data for compliance retention."