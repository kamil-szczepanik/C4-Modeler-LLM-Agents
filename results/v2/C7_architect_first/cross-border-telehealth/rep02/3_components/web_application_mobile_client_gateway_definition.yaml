level: component
scope: "Component diagram for the Web Application & Mobile Client Gateway container"
parentContainer:
  name: "Web Application & Mobile Client Gateway"
elements:
  - type: "component"
    name: "Web and Mobile Client Interface"
    technology: "React / React Native"
    description: "Cross-platform frontend supporting multilingual UI and accessibility for patients, clinicians, pharmacists, auditors, and administrators."
  - type: "component"
    name: "Client Routing & Auth Interceptor"
    technology: "Envoy Proxy"
    description: "Handles edge routing, TLS termination, WAF, rate limiting, and circuit breaking."
  - type: "component"
    name: "Offline Resilience Cache"
    technology: "Redux Persist / SQLCipher"
    description: "Provides client-side storage encryption for PHI protection on mobile devices and offline resilience."
relationships:
  - source: "Web and Mobile Client Interface"
    destination: "Client Routing & Auth Interceptor"
    description: "Routes client requests and handles authentication"
  - source: "Client Routing & Auth Interceptor"
    destination: "Offline Resilience Cache"
    description: "Persists local state and encrypted PHI"