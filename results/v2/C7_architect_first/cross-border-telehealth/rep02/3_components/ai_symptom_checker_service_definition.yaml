level: component
scope: "Component diagram for the AI Symptom Checker Service container"
parentContainer:
  name: "AI Symptom Checker Service"
elements:
  - type: "component"
    name: "API Router"
    technology: "Python / FastAPI"
    description: "Routes incoming symptom analysis requests and manages endpoint traffic."
  - type: "component"
    name: "Pseudonymization & Sanitization"
    technology: "Python"
    description: "Sanitizes patient input and pseudonymizes data to ensure GDPR and HIPAA compliance."
  - type: "component"
    name: "Inference Orchestrator"
    technology: "Python / FastAPI"
    description: "Orchestrates symptom analysis requests and communicates with Vertex AI."
  - type: "component"
    name: "Audit & Traceability"
    technology: "Python"
    description: "Generates and persists immutable logs for EU MDR traceability."
  - type: "component"
    name: "External Fallback Handler"
    technology: "Python"
    description: "Handles fallback logic and alternative routing when external AI services fail."
relationships:
  - source: "API Router"
    destination: "Pseudonymization & Sanitization"
    description: "Passes raw input for sanitization"
  - source: "Pseudonymization & Sanitization"
    destination: "Inference Orchestrator"
    description: "Sends sanitized data for inference"
  - source: "Inference Orchestrator"
    destination: "External Fallback Handler"
    description: "Invokes fallback on service failure"
  - source: "Inference Orchestrator"
    destination: "Audit & Traceability"
    description: "Logs inference steps and decisions"