level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing & Regional Affinity Router"
    technology: "Go"
    description: "Enforces regional data residency and routes client requests to appropriate regional downstream services."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Go"
    description: "Validates credentials and enforces granular consent scopes for incoming requests."
  - type: "component"
    name: "Rate Limiting & Circuit Breaker"
    technology: "Go"
    description: "Protects downstream services from traffic spikes and system failures."
  - type: "component"
    name: "Interoperability Protocol Adapter"
    technology: "Go"
    description: "Facilitates secure e-prescription transmission and translation to external national EU and US pharmacy systems."
relationships:
  - source: "Routing & Regional Affinity Router"
    destination: "Downstream Services"
    description: "Internal communication via gRPC over mTLS via Istio Service Mesh"
  - source: "Interoperability Protocol Adapter"
    destination: "External Gateways"
    description: "E-prescription transmission using mTLS and regional APIs / HTTPS"