level: component
scope: "Component diagram for the WebRTC Video Session Orchestrator container"
parentContainer:
  name: "WebRTC Video Session Orchestrator"
elements:
  - type: "component"
    name: "Signaling Controller"
    technology: "Node.js / WebSockets"
    description: "Manages real-time session signaling, coordination, and asynchronous audit logging via gRPC."
  - type: "component"
    name: "Adaptive Bitrate Manager"
    technology: "Go"
    description: "Monitors network conditions and dynamically adjusts media streams for low-bandwidth resilience."
  - type: "component"
    name: "TURN/SFU Proxy Controller"
    technology: "C++ / Pion-based"
    description: "Handles media relay and routing for real-time video/audio sessions using blind-relay enforcement."
relationships:
  - source: "Signaling Controller"
    destination: "Adaptive Bitrate Manager"
    description: "Communicates via internal channels to manage stream bitrates"
  - source: "TURN/SFU Proxy Controller"
    destination: "Signaling Controller"
    description: "Coordinates media session paths and signaling states"