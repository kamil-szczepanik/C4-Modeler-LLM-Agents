level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US, enforcing strict regional data residency and regulatory compliance via isolated GCP deployments."
elements:
  - type: "person"
    name: "Patients"
    description: "End users receiving video consultations and using the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals conducting video consultations and issuing prescriptions."
  - type: "person"
    name: "Local Pharmacists"
    description: "Pharmacy staff fulfilling e-prescriptions."
  - type: "person"
    name: "Compliance Auditors"
    description: "Auditors verifying regulatory compliance and data residency."
  - type: "person"
    name: "Platform Administrators"
    description: "Administrators managing platform infrastructure and zero-trust IAM."
  - type: "externalSystem"
    name: "National EU E-Prescription Gateways and US Pharmacy Systems"
    description: "External systems for processing and fulfilling national e-prescriptions."
  - type: "externalSystem"
    name: "WebRTC Video Infrastructure"
    description: "Regional video infrastructure supporting consultations and degraded modes."
  - type: "container"
    name: "EU Telehealth Platform"
    description: "GCP europe-west3 isolated deployment for EU users."
    technology: "Google Cloud Platform (GCP europe-west3), HL7 FHIR, CMEK, OAuth2/OIDC"
  - type: "container"
    name: "US Telehealth Platform"
    description: "GCP us-central1 isolated deployment for US users."
    technology: "Google Cloud Platform (GCP us-central1), HL7 FHIR, CMEK, OAuth2/OIDC"
  - type: "container"
    name: "Regional GCP Artifact Registries and KMS"
    description: "Stores cryptographically signed AI model weights and provides CMEK."
    technology: "GCP KMS, GCP Artifact Registries"
relationships:
  - source: "Patients"
    destination: "EU Telehealth Platform"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS and TLS 1.3"
  - source: "Patients"
    destination: "US Telehealth Platform"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS and TLS 1.3"
  - source: "Licensed Clinicians"
    destination: "EU Telehealth Platform"
    description: "Conducts video consultations and manages prescriptions"
    technology: "HTTPS and TLS 1.3"
  - source: "Licensed Clinicians"
    destination: "US Telehealth Platform"
    description: "Conducts video consultations and manages prescriptions"
    technology: "HTTPS and TLS 1.3"
  - source: "EU Telehealth Platform"
    destination: "National EU E-Prescription Gateways and US Pharmacy Systems"
    description: "Sends e-prescriptions and interoperability data"
    technology: "mTLS and regional APIs"
  - source: "US Telehealth Platform"
    destination: "National EU E-Prescription Gateways and US Pharmacy Systems"
    description: "Sends e-prescriptions and interoperability data"
    technology: "mTLS and regional APIs"
  - source: "EU Telehealth Platform"
    destination: "WebRTC Video Infrastructure"
    description: "Establishes video consultation sessions supporting sub-300 kbit/s degraded modes"
    technology: "Regional endpoints"
  - source: "US Telehealth Platform"
    destination: "WebRTC Video Infrastructure"
    description: "Establishes video consultation sessions supporting sub-300 kbit/s degraded modes"
    technology: "Regional endpoints"
  - source: "EU Telehealth Platform"
    destination: "US Telehealth Platform"
    description: "Performs cross-region data access via token-exchange proxies based on patient consent"
    technology: "Short-lived OAuth2 tokens"