# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "End users receiving video consultations, e-prescriptions, and using the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals conducting video consultations and issuing prescriptions."
  - type: "person"
    name: "Local Pharmacists"
    description: "Pharmacy staff fulfilling e-prescriptions."
  - type: "person"
    name: "Compliance Auditors"
    description: "Auditors verifying regulatory compliance and data residency."
  - type: "person"
    name: "Platform Administrators"
    description: "Administrators managing platform infrastructure and zero-trust IAM."
  - type: "externalSystem"
    name: "National EU E-Prescription Gateways and US Pharmacy Systems"
    description: "External systems for processing and fulfilling national e-prescriptions."
  - type: "container"
    name: "Web Application & Mobile Client Gateway"
    technology: "React / React Native"
    description: "Provides secure user interfaces and client gateway for patients, clinicians, and administrators."
  - type: "container"
    name: "API Gateway"
    technology: "Node.js / Go"
    description: "Routes and manages API requests across the platform services."
  - type: "container"
    name: "AI Symptom Checker Service"
    technology: "Python / FastAPI, Vertex AI"
    description: "Powers the AI symptom checker with model monitoring and immutable audit logging."
  - type: "container"
    name: "WebRTC Video Session Orchestrator"
    technology: "WebRTC, STUN/TURN"
    description: "Orchestrates secure video consultation sessions with edge-optimized servers."
  - type: "container"
    name: "Database and Storage"
    technology: "Google Cloud SQL PostgreSQL, Google Cloud Storage WORM"
    description: "Enforces regional encryption via CMEK and WORM audit logging."
  - type: "container"
    name: "Service Mesh"
    technology: "Istio Service Mesh, Envoy proxy"
    description: "Orchestrates container workloads and enforces mTLS service mesh security."
relationships:
  - source: "Patients"
    destination: "Web Application & Mobile Client Gateway"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS / JSON over REST and WebSockets"
  - source: "Licensed Clinicians"
    destination: "Web Application & Mobile Client Gateway"
    description: "Conducts video consultations and manages prescriptions"
    technology: "HTTPS / JSON over REST and WebSockets"
  - source: "Local Pharmacists"
    destination: "Web Application & Mobile Client Gateway"
    description: "Fulfills e-prescriptions"
    technology: "HTTPS / JSON over REST"
  - source: "Compliance Auditors"
    destination: "Web Application & Mobile Client Gateway"
    description: "Audits platform compliance and logs"
    technology: "HTTPS"
  - source: "Platform Administrators"
    destination: "Web Application & Mobile Client Gateway"
    description: "Manages platform infrastructure and zero-trust IAM"
    technology: "HTTPS"
  - source: "Web Application & Mobile Client Gateway"
    destination: "API Gateway"
    description: "Sends client requests to core services"
    technology: "HTTPS / JSON over REST and WebSockets"
  - source: "API Gateway"
    destination: "AI Symptom Checker Service"
    description: "Invokes AI symptom analysis and audit logging"
    technology: "gRPC over mTLS (Istio)"
  - source: "API Gateway"
    destination: "WebRTC Video Session Orchestrator"
    description: "Orchestrates video sessions"
    technology: "gRPC over mTLS (Istio)"
  - source: "API Gateway"
    destination: "Database and Storage"
    description: "Persists patient data, operational records, and audit logs"
    technology: "gRPC over mTLS (Istio)"
  - source: "AI Symptom Checker Service"
    destination: "Database and Storage"
    description: "Writes immutable audit logs to WORM storage and invokes Vertex AI"
    technology: "gRPC over mTLS (Istio) / Cloud APIs"
  - source: "API Gateway"
    destination: "National EU E-Prescription Gateways and US Pharmacy Systems"
    description: "Transmits e-prescriptions securely via interoperability adapters"
    technology: "mTLS and regional APIs"