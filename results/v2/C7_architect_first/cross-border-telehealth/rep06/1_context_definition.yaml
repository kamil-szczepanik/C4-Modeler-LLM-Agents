level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides secure video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US with strict regional data residency, HIPAA/GDPR compliance, and EU MDR traceability."
elements:
  - type: "person"
    name: "Patients and Licensed Clinicians"
    description: "Mobile and web clients interacting with the telehealth platform for consultations, e-prescriptions, and symptom checking."
  - type: "externalSystem"
    name: "EU Telehealth System"
    description: "Regional deployment located in europe-west3 handling EU operations."
  - type: "externalSystem"
    name: "US Telehealth System"
    description: "Regional deployment located in us-central1 handling US operations."
  - type: "externalSystem"
    name: "AI Symptom Checker Subsystem"
    description: "Subsystem providing AI-driven symptom checking."
  - type: "externalSystem"
    name: "External EU National E-Prescription Gateways and US Pharmacy Networks"
    description: "External networks and gateways for processing e-prescriptions."
  - type: "externalSystem"
    name: "Third-Party Video Infrastructure"
    description: "WebRTC-based infrastructure providing video consultation capabilities."
  - type: "externalSystem"
    name: "Zero-Trust Consent Gateways"
    description: "Cryptographically isolated proxies managing cross-region access with OAuth 2.0 and signed consent scopes."
relationships:
  - source: "Patients and Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses video consultations, e-prescriptions, and symptom checker"
    technology: "HTTPS (REST/GraphQL) and WebRTC (secure SRTP/DTLS)"
  - source: "Cross-Border Telehealth Platform"
    destination: "EU Telehealth System"
    description: "Processes regional workloads for compliance and data residency"
    technology: "GCP europe-west3 with VPC Service Controls"
  - source: "Cross-Border Telehealth Platform"
    destination: "US Telehealth System"
    description: "Processes regional workloads for compliance and data residency"
    technology: "GCP us-central1 with VPC Service Controls"
  - source: "Cross-Border Telehealth Platform"
    destination: "AI Symptom Checker Subsystem"
    description: "Evaluates patient symptoms"
    technology: "mTLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "External EU National E-Prescription Gateways and US Pharmacy Networks"
    description: "Fulfills e-prescriptions and medication requests"
    technology: "REST/FHIR over mTLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Third-Party Video Infrastructure"
    description: "Facilitates secure video consultations"
    technology: "WebRTC"
  - source: "Cross-Border Telehealth Platform"
    destination: "Zero-Trust Consent Gateways"
    description: "Manages secure cross-region access and consent"
    technology: "OAuth 2.0 and signed consent scopes"