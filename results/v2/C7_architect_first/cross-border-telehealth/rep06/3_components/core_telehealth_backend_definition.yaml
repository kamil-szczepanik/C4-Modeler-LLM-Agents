level: component
scope: "Component diagram for the Core Telehealth Backend container"
parentContainer:
  name: "Core Telehealth Backend"
elements:
  - type: "component"
    name: "Consultation Orchestrator"
    technology: "Node.js, Express"
    description: "Coordinates video sessions and manages telehealth workflows."
  - type: "component"
    name: "Prescription Manager"
    technology: "Node.js, Express"
    description: "Manages e-prescriptions and interacts with external regional gateways."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "Node.js, Express"
    description: "Logs compliance data and ensures cryptographic sealing for audit trails."
  - type: "component"
    name: "Identity & Consent Enforcer"
    technology: "Node.js, Express"
    description: "Validates access rights and consent scopes for secure operations."
relationships:
  - source: "Consultation Orchestrator"
    destination: "Video Media Router"
    description: "Coordinates video sessions [WebRTC]"
  - source: "Consultation Orchestrator"
    destination: "Identity & Consent Enforcer"
    description: "Validates access rights and consent scopes [Internal gRPC]"
  - source: "Prescription Manager"
    destination: "Identity & Consent Enforcer"
    description: "Validates access rights and consent scopes [Internal gRPC]"
  - source: "Core Telehealth Backend"
    destination: "Data Tier"
    description: "Reads/writes clinical data [TCP/PostgreSQL]"
  - source: "Audit & Compliance Logger"
    destination: "Data Tier"
    description: "Writes immutable compliance data [TCP/PostgreSQL]"
  - source: "Prescription Manager"
    destination: "External EU National E-Prescription Gateways and US Pharmacy Networks"
    description: "Transmits regional prescriptions [HTTPS / TLS 1.3]"