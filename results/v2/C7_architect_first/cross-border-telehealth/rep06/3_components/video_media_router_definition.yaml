level: component
scope: "Component diagram for the Video Media Router container"
parentContainer:
  name: "Video Media Router"
elements:
  - type: "component"
    name: "Signaling Handler"
    technology: "Node.js / WebSockets"
    description: "Manages signaling connections and authenticates room parameters."
  - type: "component"
    name: "SFU Worker Manager"
    technology: "Mediasoup SFU Worker"
    description: "Manages underlying worker processes and communicates with the ABR Controller."
  - type: "component"
    name: "ABR Controller"
    technology: "Node.js / Internal IPC"
    description: "Monitors packet loss and adjusts streams for low-bandwidth resilience."
  - type: "component"
    name: "Media Relayer/Transport"
    technology: "WebRTC / UDP"
    description: "Relays media streams between participants."
  - type: "component"
    name: "DTLS-SRTP Encryptor/Decryptor"
    technology: "SRTP over UDP"
    description: "Secures media streams with ephemeral key negotiation."
  - type: "component"
    name: "Event Dispatcher"
    technology: "Internal Event Bus"
    description: "Triggers fallback notifications and system events."
relationships:
  - source: "SFU Worker Manager"
    destination: "ABR Controller"
    description: "Monitors packet loss and adjusts streams [Internal IPC]"
  - source: "ABR Controller"
    destination: "Event Dispatcher"
    description: "Triggers fallback notifications [Internal Event Bus]"
  - source: "Media Relayer/Transport"
    destination: "DTLS-SRTP Encryptor/Decryptor"
    description: "Secures media streams [SRTP over UDP]"