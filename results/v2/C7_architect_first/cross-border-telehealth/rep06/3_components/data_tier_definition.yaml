level: component
scope: "Component diagram for the Data Tier container"
parentContainer:
  name: "Data Tier"
elements:
  - type: "component"
    name: "Region-Isolated PostgreSQL Instances"
    technology: "Cloud SQL PostgreSQL"
    description: "Independent clusters in europe-west3 and us-central1 providing region-isolated relational storage with Row-Level Security (RLS) for consent enforcement."
  - type: "component"
    name: "Encrypted Object Store"
    technology: "Cloud Storage"
    description: "Buckets for storing media and AI artifacts securely."
  - type: "component"
    name: "Key Management Service"
    technology: "Cloud KMS"
    description: "Enforces region-locked Customer-Managed Encryption Keys (CMEK) to guarantee GDPR and HIPAA compliance."
  - type: "component"
    name: "Audit Ledger Subsystem"
    technology: "PostgreSQL Append-Only Tables"
    description: "Append-only tables with cryptographic hashing ensuring full traceability for EU MDR compliance."
  - type: "component"
    name: "Connection Management"
    technology: "PgBouncer"
    description: "Sidecars for connection pooling, managing intermittent rural reconnection spikes and preventing database exhaustion."
  - type: "component"
    name: "Schema Migration Automation"
    technology: "Cloud Deploy"
    description: "Automates region-aware, backward-compatible schema migrations."
  - type: "system"
    name: "Core Telehealth Backend"
    technology: "Backend Service"
    description: "External telehealth backend that reads and writes clinical data, consent preferences, and sync queues."
relationships:
  - source: "Core Telehealth Backend"
    destination: "Region-Isolated PostgreSQL Instances"
    description: "Reads and writes clinical data, consent preferences, and sync queues via TCP/PostgreSQL via mTLS."
  - source: "Region-Isolated PostgreSQL Instances"
    destination: "Key Management Service"
    description: "Requests regional encryption keys and dynamic IAM authentication via HTTPS/REST."
  - source: "Connection Management"
    destination: "Region-Isolated PostgreSQL Instances"
    description: "Manages connection pooling and prevents database exhaustion."
  - source: "Region-Isolated PostgreSQL Instances"
    destination: "Audit Ledger Subsystem"
    description: "Records cryptographic audit logs for AI diagnostics and compliance."