level: component
scope: "Component diagram for the Consent & Preference Management Service container"
parentContainer:
  name: "Consent & Preference Management Service"
elements:
  - type: "component"
    name: "Consent API Controller"
    technology: "Node.js, Express"
    description: "Handles incoming API requests related to consent and preference management."
  - type: "component"
    name: "Consent Evaluation Engine"
    technology: "Node.js, Express, TypeScript"
    description: "Evaluates active consent states and policies for data access."
  - type: "component"
    name: "Audit Publisher Component"
    technology: "Node.js, Express, GCP Pub/Sub SDK"
    description: "Dispatches asynchronous audit logs for consent evaluation events."
  - type: "component"
    name: "Consent Cache Manager"
    technology: "Node.js, Express, GCP Memorystore Redis"
    description: "Manages the caching layer for active consent states to ensure low latency."
  - type: "component"
    name: "Consent Data Access Repository"
    technology: "Node.js, Express, Cloud SQL PostgreSQL"
    description: "Interacts with the relational data store for persistent consent records."
relationships:
  - source: "Consent API Controller"
    destination: "Consent Evaluation Engine"
    description: "In-memory function calls [TypeScript]"
  - source: "Consent Evaluation Engine"
    destination: "Consent Cache Manager"
    description: "TCP / Redis Protocol (TLS)"
  - source: "Consent Evaluation Engine"
    destination: "Audit Publisher Component"
    description: "Asynchronous dispatch [GCP Pub/Sub SDK]"
  - source: "Consent Evaluation Engine"
    destination: "Consent Data Access Repository"
    description: "Parameterized SQL [TLS 1.3 / IAM Auth]"
  - source: "Audit Publisher Component"
    destination: "GCP Pub/Sub"
    description: "HTTPS / TLS 1.3"