level: component
scope: "Component diagram for the Patient PWA & Clinician Dashboard Frontends container"
parentContainer:
  name: "Patient PWA & Clinician Dashboard Frontends"
elements:
  - type: "component"
    name: "Patient PWA"
    technology: "React 18+, TypeScript, Zustand"
    description: "Provides video consultations, e-prescriptions, and AI symptom checker interface for patients in the EU and US."
  - type: "component"
    name: "Clinician Dashboard"
    technology: "React 18+, TypeScript, Zustand"
    description: "Allows clinicians to view patient data, fetch FHIR records, and manage e-prescriptions."
  - type: "component"
    name: "AI Symptom Checker UI"
    technology: "React 18+, TypeScript"
    description: "Submits symptom payloads to the API Gateway."
  - type: "component"
    name: "Video Consultation View"
    technology: "WebRTC, React 18+"
    description: "Handles video consultation streams via the Video Media Router."
  - type: "component"
    name: "Service Workers Workbox"
    technology: "Workbox"
    description: "Provides PWA offline caching and resilience for unstable connections."
relationships:
  - source: "Patient PWA"
    destination: "API Gateway"
    description: "API requests and authentication via HTTPS"
  - source: "Clinician Dashboard"
    destination: "API Gateway"
    description: "Fetches FHIR/e-prescription data via HTTPS"
  - source: "AI Symptom Checker UI"
    destination: "API Gateway"
    description: "Submits symptom payloads via HTTPS"
  - source: "Video Consultation View"
    destination: "Video Media Router (SFU)"
    description: "WebRTC media streams with DTLS-SRTP"