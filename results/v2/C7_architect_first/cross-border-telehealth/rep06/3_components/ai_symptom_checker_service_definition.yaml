level: component
scope: "Component diagram for the AI Symptom Checker Service container"
parentContainer:
  name: "AI Symptom Checker Service"
elements:
  - type: "component"
    name: "API Router / Controller"
    technology: "FastAPI"
    description: "Handles incoming gRPC requests"
  - type: "component"
    name: "Clinical NLP / Feature Extractor"
    technology: "spaCy / SciSpaCy"
    description: "Normalizes text into HL7 FHIR / SNOMED CT"
  - type: "component"
    name: "Inference Engine"
    technology: "PyTorch / Hugging Face"
    description: "Executes clinical triage models"
  - type: "component"
    name: "Explainability Module"
    technology: "SHAP / LIME"
    description: "Generates feature-attribution weights"
  - type: "component"
    name: "Semantic Caching Component"
    technology: "Regional Memorystore for Redis"
    description: "Caches symptom results"
  - type: "component"
    name: "Audit & Traceability Logger"
    technology: "Regional Cloud SQL & WORM Cloud Storage"
    description: "Captures synchronous write-ahead logs"
  - type: "component"
    name: "Clinician Dashboard"
    technology: "HTTPS / REST"
    description: "External dashboard receiving transparency data"
  - type: "component"
    name: "Core Telehealth Backend"
    technology: "gRPC / mTLS"
    description: "External backend sending symptom data"
relationships:
  - source: "Core Telehealth Backend"
    destination: "API Router / Controller"
    description: "Sends symptom data via [gRPC / mTLS]"
  - source: "API Router / Controller"
    destination: "Semantic Caching Component"
    description: "Checks for cached triage results [Redis Protocol / mTLS]"
  - source: "API Router / Controller"
    destination: "Inference Engine"
    description: "Evaluates uncached symptom inputs [Internal Python function call]"
  - source: "Inference Engine"
    destination: "Audit & Traceability Logger"
    description: "Persists immutable logs to [Regional Cloud SQL & WORM Cloud Storage]"
  - source: "Explainability Module"
    destination: "Clinician Dashboard"
    description: "Provides transparency data via [HTTPS / REST]"