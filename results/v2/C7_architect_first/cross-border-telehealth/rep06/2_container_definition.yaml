level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients and Licensed Clinicians"
    description: "Mobile and web clients interacting with the telehealth platform for consultations, e-prescriptions, and symptom checking."
  - type: "externalSystem"
    name: "EU Telehealth System"
    description: "Regional deployment located in europe-west3 handling EU operations under GDPR."
  - type: "externalSystem"
    name: "US Telehealth System"
    description: "Regional deployment located in us-central1 handling US operations under HIPAA."
  - type: "externalSystem"
    name: "External EU National E-Prescription Gateways and US Pharmacy Networks"
    description: "External networks and gateways for processing e-prescriptions."
  - type: "container"
    name: "API Gateway"
    technology: "Cloud Armor, Cloud Load Balancing"
    description: "Entry point managing inbound traffic, security, and load balancing across regional deployments."
  - type: "container"
    name: "Patient PWA & Clinician Dashboard Frontends"
    technology: "React, Cloud Storage, Cloud CDN"
    description: "Web and progressive web application frontends for patients and clinicians."
  - type: "container"
    name: "Core Telehealth Backend"
    technology: "Node.js, Express"
    description: "Core backend service handling business logic, consultations, and prescriptions."
  - type: "container"
    name: "AI Symptom Checker Service"
    technology: "Python, FastAPI"
    description: "AI service providing automated symptom checking for patients."
  - type: "container"
    name: "Video Media Router"
    technology: "Mediasoup SFU"
    description: "Real-time video media router for video consultations in degraded network conditions."
  - type: "container"
    name: "Consent & Preference Management Service"
    technology: "Node.js, Express"
    description: "Manages patient consent, data preferences, and compliance tracking."
  - type: "container"
    name: "Data Tier"
    technology: "Cloud SQL PostgreSQL, Cloud Storage, Cloud KMS"
    description: "Region-isolated relational databases and object storage encrypted with CMEK."
relationships:
  - source: "Patients and Licensed Clinicians"
    destination: "API Gateway"
    description: "Sends HTTPS/WSS/WebRTC requests to access the platform frontends and services"
    technology: "HTTPS/WSS/WebRTC"
  - source: "Patient PWA & Clinician Dashboard Frontends"
    destination: "API Gateway"
    description: "Communicates via API calls through the gateway"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Core Telehealth Backend"
    description: "Routes API requests to the core backend"
    technology: "gRPC / mTLS"
  - source: "API Gateway"
    destination: "Consent & Preference Management Service"
    description: "Routes consent and preference queries"
    technology: "gRPC / mTLS"
  - source: "Core Telehealth Backend"
    destination: "Data Tier"
    description: "Reads and writes patient and clinical data"
    technology: "TCP/PostgreSQL"
  - source: "AI Symptom Checker Service"
    destination: "Core Telehealth Backend"
    description: "Communicates symptom analysis results and data"
    technology: "gRPC / mTLS"
  - source: "Core Telehealth Backend"
    destination: "Video Media Router"
    description: "Coordinates video consultation sessions"
    technology: "WebRTC"
  - source: "Cross-Border Telehealth Platform"
    destination: "EU Telehealth System"
    description: "Processes regional workloads for compliance and data residency"
    technology: "GCP europe-west3 with VPC Service Controls"
  - source: "Cross-Border Telehealth Platform"
    destination: "US Telehealth System"
    description: "Processes regional workloads for compliance and data residency"
    technology: "GCP us-central1 with VPC Service Controls"
  - source: "Cross-Border Telehealth Platform"
    destination: "External EU National E-Prescription Gateways and US Pharmacy Networks"
    description: "Fulfills e-prescriptions and medication requests"
    technology: "REST/FHIR over mTLS"