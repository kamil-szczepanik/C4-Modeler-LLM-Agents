level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US, bridging fragmented healthcare systems while enforcing regional data residency and compliance."
elements:
  - type: "person"
    name: "Patients"
    description: "Patients accessing video consultations, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed clinicians accessing the platform to conduct video consultations and manage healthcare delivery."
  - type: "externalSystem"
    name: "National e-Prescription Gateways (EU)"
    description: "External national gateways for e-prescriptions within the EU."
  - type: "externalSystem"
    name: "Pharmacy Networks (US)"
    description: "External pharmacy networks within the US."
  - type: "externalSystem"
    name: "Third-Party AI Model Providers"
    description: "External AI providers powering the symptom checker."
  - type: "externalSystem"
    name: "Identity Providers"
    description: "External OAuth2/OIDC, EU eIDAS, and US Login.gov authentication systems."
  - type: "externalSystem"
    name: "Infrastructure Services"
    description: "GCP Cloud Logging, Cloud KMS, and WORM storage."
relationships:
  - source: "Patients"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS, WebRTC with adaptive bitrates, and TLS 1.3"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses platform to manage consultations and patient care"
    technology: "HTTPS, WebRTC with adaptive bitrates, and TLS 1.3"
  - source: "Cross-Border Telehealth Platform"
    destination: "National e-Prescription Gateways (EU)"
    description: "Exchanges e-prescription data"
    technology: "REST and HL7 FHIR over secure mTLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Pharmacy Networks (US)"
    description: "Exchanges prescription and pharmacy data"
    technology: "REST and HL7 FHIR over secure mTLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Third-Party AI Model Providers"
    description: "Sends anonymized symptom data for AI analysis"
    technology: "HTTPS with pre-processor PII/PHI stripping"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity Providers"
    description: "Authenticates users via OAuth2/OIDC, eIDAS, and Login.gov"
    technology: "OAuth2/OIDC, mTLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Infrastructure Services"
    description: "Uses infrastructure for logging, encryption keys, and immutable audit logs"
    technology: "GCP Cloud Logging, Cloud KMS, WORM storage"