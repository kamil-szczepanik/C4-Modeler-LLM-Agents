level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients accessing video consultations, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed clinicians accessing the platform to conduct video consultations and manage healthcare delivery."
  - type: "externalSystem"
    name: "EU National e-Prescription Gateways"
    description: "External national gateways for e-prescriptions within the EU."
  - type: "externalSystem"
    name: "US Pharmacy Networks"
    description: "External pharmacy networks within the US."
  - type: "externalSystem"
    name: "Third-Party AI Model Providers"
    description: "External AI providers powering the symptom checker."
  - type: "externalSystem"
    name: "Identity Providers"
    description: "External OAuth2/OIDC, EU eIDAS, and US Login.gov authentication systems."
  - type: "container"
    name: "GCP API Gateway"
    description: "Cloud Endpoints routing and securing incoming requests."
    technology: "Google Cloud Endpoints / Cloud API Gateway"
  - type: "container"
    name: "Web Application & Mobile App Containers"
    description: "Client-facing frontend applications for patients and clinicians."
    technology: "React, React Native"
  - type: "container"
    name: "Core Services GKE Clusters"
    description: "Microservices for Consultation, Prescription, AI Symptom Checker, Consent & Policy, Notification, Localization, and BI Ingestion."
    technology: "Google Kubernetes Engine (GKE), Istio Service Mesh, gRPC"
  - type: "container"
    name: "Data Containers"
    description: "Region-isolated transactional data storage and encrypted medical artifacts."
    technology: "Cloud SQL PostgreSQL, Cloud Storage with WORM policies"
  - type: "container"
    name: "Media Relay Containers"
    description: "Relays real-time video and audio data for consultations."
    technology: "Coturn TURN/STUN, Mediasoup SFU"
relationships:
  - source: "Patients"
    destination: "Web Application & Mobile App Containers"
    description: "Interacts with the platform via web or mobile apps"
    technology: "HTTPS/WSS"
  - source: "Licensed Clinicians"
    destination: "Web Application & Mobile App Containers"
    description: "Interacts with the platform via web or mobile apps"
    technology: "HTTPS/WSS"
  - source: "Web Application & Mobile App Containers"
    destination: "GCP API Gateway"
    description: "Sends API requests to backend services"
    technology: "HTTPS/WSS"
  - source: "GCP API Gateway"
    destination: "Core Services GKE Clusters"
    description: "Routes requests to regional GKE services"
    technology: "gRPC over mTLS"
  - source: "Core Services GKE Clusters"
    destination: "Media Relay Containers"
    description: "Connects consultation traffic to media relays"
    technology: "WebRTC (DTLS-SRTP)"
  - source: "Core Services GKE Clusters"
    destination: "Data Containers"
    description: "Reads and writes transactional data and medical artifacts"
    technology: "PostgreSQL protocol, Cloud Storage APIs"
  - source: "Core Services GKE Clusters"
    destination: "EU National e-Prescription Gateways"
    description: "Integrates for EU e-prescriptions"
    technology: "REST and HL7 FHIR over secure mTLS"
  - source: "Core Services GKE Clusters"
    destination: "US Pharmacy Networks"
    description: "Integrates for US pharmacy and prescription data"
    technology: "REST and HL7 FHIR over secure mTLS"
  - source: "Core Services GKE Clusters"
    destination: "Third-Party AI Model Providers"
    description: "Invokes third-party AI models with anonymized payloads via Istio Egress Gateways"
    technology: "HTTPS with Istio Egress Filtering"
  - source: "Core Services GKE Clusters"
    destination: "Identity Providers"
    description: "Authenticates users"
    technology: "OAuth2/OIDC, mTLS"