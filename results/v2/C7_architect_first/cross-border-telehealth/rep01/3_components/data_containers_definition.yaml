level: component
scope: "Component diagram for the Data Containers container"
parentContainer:
  name: "Data Containers"
elements:
  - type: "component"
    name: "PostgreSQL Regional Instances"
    technology: "Cloud SQL for PostgreSQL 15"
    description: "Stores transactional records, audit logs, and consent states with regional isolation in europe-west3 and us-central1."
  - type: "component"
    name: "Medical Artifact Buckets"
    technology: "GCP Cloud Storage"
    description: "Persists encrypted medical files and AI trace bundles with Object Lock and CMEK for WORM compliance."
  - type: "component"
    name: "Regional Redis Caches"
    technology: "GCP Memorystore for Redis"
    description: "Manages session state and fast-path authorization tokens for ephemeral session caching and rate-limiting."
  - type: "component"
    name: "Security and Encryption Services"
    technology: "GCP Cloud KMS & VPC Service Controls"
    description: "Provides regional encryption key management and network isolation."
relationships:
  - source: "PostgreSQL Regional Instances"
    destination: "Security and Encryption Services"
    description: "Secured by regional encryption keys and VPC Service Controls"
  - source: "Medical Artifact Buckets"
    destination: "Security and Encryption Services"
    description: "Encrypted using CMEK and protected by VPC Service Controls"
  - source: "Regional Redis Caches"
    destination: "Security and Encryption Services"
    description: "Secured via network isolation and encryption controls"