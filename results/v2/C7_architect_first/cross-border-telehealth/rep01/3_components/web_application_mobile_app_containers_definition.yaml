level: component
scope: "Component diagram for the Web Application & Mobile App Containers container"
parentContainer:
  name: "Web Application & Mobile App Containers"
elements:
  - type: "component"
    name: "UI Layer"
    technology: "React / React Native"
    description: "Client-facing web and mobile applications delivering video consultations, e-prescriptions, and user interfaces."
  - type: "component"
    name: "AI Symptom Checker Client Module"
    technology: "Client-side Module"
    description: "Handles AI-driven symptom checking logic on the client side."
  - type: "component"
    name: "Media Client Module"
    technology: "WebRTC"
    description: "Manages real-time video streaming and media interactions."
  - type: "component"
    name: "Local State & Consent Manager"
    technology: "SQLCipher"
    description: "Encrypted local storage for offline-first caching and PHI protection, managing consent gating."
  - type: "component"
    name: "Offline Sync Queue"
    technology: "Client-side Queue"
    description: "Queues data for synchronization when network connectivity is restored."
relationships:
  - source: "UI Layer"
    destination: "AI Symptom Checker Client Module"
    description: "Internal Application Events"
  - source: "UI Layer"
    destination: "Media Client Module"
    description: "Internal Application Events"
  - source: "AI Symptom Checker Client Module"
    destination: "GCP API Gateway"
    description: "HTTPS/REST"
  - source: "Media Client Module"
    destination: "Media Relay Containers"
    description: "WSS/WebRTC"
  - source: "Local State & Consent Manager"
    destination: "GCP API Gateway"
    description: "HTTPS with Signed Consent Claims"