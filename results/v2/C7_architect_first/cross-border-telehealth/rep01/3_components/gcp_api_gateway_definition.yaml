level: component
scope: "Component diagram for the GCP API Gateway container"
parentContainer:
  name: "GCP API Gateway"
elements:
  - type: "component"
    name: "Auth Interceptor & Token Validator Component"
    technology: "Cloud IAM & Firebase Auth, JWT/OAuth2"
    description: "Validates JWT/OAuth2 tokens and handles identity verification for incoming requests."
  - type: "component"
    name: "Request Validator & Schema Validation Component"
    technology: "GCP API Gateway / Cloud Endpoints"
    description: "Performs edge validation and schema validation for incoming requests."
  - type: "component"
    name: "Context & Consent Injector Component"
    technology: "GCP API Gateway custom extension"
    description: "Injects regional context and patient consent data into the request payload."
relationships:
  - source: "Auth Interceptor & Token Validator Component"
    destination: "Request Validator & Schema Validation Component"
    description: "Passes authenticated context"
  - source: "Request Validator & Schema Validation Component"
    destination: "Context & Consent Injector Component"
    description: "Forwards validated request"