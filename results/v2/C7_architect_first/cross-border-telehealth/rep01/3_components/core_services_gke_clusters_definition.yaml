level: component
scope: "Component diagram for the Core Services GKE Clusters container"
parentContainer:
  name: "Core Services GKE Clusters"
elements:
  - type: "component"
    name: "Consultation"
    technology: "Java (Spring Boot) / Python (FastAPI)"
    description: "Handles video consultations and session management."
  - type: "component"
    name: "Prescription"
    technology: "Java (Spring Boot) / Python (FastAPI)"
    description: "Manages e-prescriptions and integration with gateways."
  - type: "component"
    name: "AI Symptom Checker"
    technology: "Python (FastAPI)"
    description: "Provides AI symptom checking and invokes third-party AI models."
  - type: "component"
    name: "Consent & Policy"
    technology: "Java (Spring Boot) / OPA"
    description: "Manages consent and policy enforcement for regulatory compliance."
  - type: "component"
    name: "Localization & Fallbandwidth"
    technology: "Go"
    description: "Ensures robust performance and low-bandwidth optimizations."
  - type: "component"
    name: "Notification"
    technology: "Java (Spring Boot) / Go"
    description: "Handles system notifications and messaging."
  - type: "component"
    name: "BI Ingestion"
    technology: "Java (Spring Boot) / Python (FastAPI)"
    description: "Ingests data for Business Intelligence processing."
relationships:
  - source: "AI Symptom Checker"
    destination: "Third-Party AI Model Providers"
    description: "Invokes external models via Istio Egress Gateways using HTTPS with strict L7 filtering."
  - source: "Consultation"
    destination: "Media Relay Containers"
    description: "Connects session traffic using WebRTC (DTLS-SRTP)."
  - source: "Prescription"
    destination: "EU/US e-Prescription Gateways"
    description: "Integrates prescription workflows using REST and HL7 FHIR over secure mTLS."