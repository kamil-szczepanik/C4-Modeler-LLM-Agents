level: component
scope: "Component diagram for the AI Symptom Checker Service container"
parentContainer:
  name: "AI Symptom Checker Service"
elements:
  - type: "component"
    name: "API Controller Component"
    technology: "Python / FastAPI"
    description: "Routes symptom checking requests and returns compliant payloads."
  - type: "component"
    name: "Inference Orchestrator Component"
    technology: "Python / FastAPI"
    description: "Delegates pseudonymized analysis and interacts with the AI model registry."
  - type: "component"
    name: "Audit & Compliance Logger Component"
    technology: "Python / FastAPI, OpenTelemetry"
    description: "Emits prediction audit events and writes immutable logs."
  - type: "component"
    name: "Response Formatting & Disclaimer Engine Component"
    technology: "Python / FastAPI"
    description: "Passes raw triage output and applies required compliance disclaimers."
relationships:
  - source: "API Controller Component"
    destination: "Inference Orchestrator Component"
    description: "Delegates pseudonymized analysis [In-memory]"
  - source: "Inference Orchestrator Component"
    destination: "Audit & Compliance Logger Component"
    description: "Emits prediction audit events [Async Pub/Sub]"
  - source: "Inference Orchestrator Component"
    destination: "Response Formatting & Disclaimer Engine Component"
    description: "Passes raw triage output [In-memory]"
  - source: "Response Formatting & Disclaimer Engine Component"
    destination: "API Controller Component"
    description: "Returns compliant payload [In-memory]"
  - source: "Audit & Compliance Logger Component"
    destination: "Data Storage Layer"
    description: "Writes immutable logs [SSL-enforced TCP/Postgres & WORM Storage]"