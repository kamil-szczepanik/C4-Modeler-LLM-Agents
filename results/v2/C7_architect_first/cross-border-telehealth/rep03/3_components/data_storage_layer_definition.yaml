level: component
scope: "Component diagram for the Data Storage Layer container"
parentContainer:
  name: "Data Storage Layer"
elements:
  - type: "component"
    name: "EU Data Store"
    technology: "GCP europe-west3 (Cloud SQL PostgreSQL & Cloud Storage)"
    description: "Region-isolated persistent storage, structured PHI/PII, and unstructured media for European deployments."
  - type: "component"
    name: "US Data Store"
    technology: "GCP us-central1 (Cloud SQL PostgreSQL & Cloud Storage)"
    description: "Region-isolated persistent storage, structured PHI/PII, and unstructured media for US deployments."
  - type: "component"
    name: "Clinical Database"
    technology: "Cloud SQL PostgreSQL"
    description: "Stores structured PHI/PII and e-prescriptions using Row-Level Security."
  - type: "component"
    name: "Consent & Audit Engine"
    technology: "PostgreSQL Schema/Triggers"
    description: "Maintains immutable audit logs and granular consent states."
  - type: "component"
    name: "Blob Storage Repository"
    technology: "Cloud Storage"
    description: "Handles unstructured media and raw AI payloads via regional buckets."
  - type: "component"
    name: "Data Access Proxy"
    technology: "Envoy / Sidecar"
    description: "Intercepts traffic to inject regional context and validate client certificates."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Manages connection pooling for high availability during peak hours."
relationships:
  - source: "Consultation Service"
    destination: "Data Access Proxy"
    description: "Reads and writes consultation data [SSL-enforced TCP/Postgres via mTLS]"
  - source: "AI Symptom Checker Service"
    destination: "Data Access Proxy"
    description: "Reads and writes symptom check data and model versions [SSL-enforced TCP/Postgres]"
  - source: "E-Prescription & Interoperability Service"
    destination: "Data Access Proxy"
    description: "Reads and writes prescription data [SSL-enforced TCP/Postgres]"
  - source: "Data Access Proxy"
    destination: "Clinical Database"
    description: "Routes regional traffic and injects session context [Local TCP]"