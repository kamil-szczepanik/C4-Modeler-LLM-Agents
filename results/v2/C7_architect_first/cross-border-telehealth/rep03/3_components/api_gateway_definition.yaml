level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Router and Load Shedder"
    technology: "Envoy / Google Cloud API Gateway"
    description: "Handles edge routing, rate limiting, TLS 1.3 termination, and regional traffic management."
  - type: "component"
    name: "Auth Component"
    technology: "OIDC / JWKS"
    description: "Validates tokens against External Identity Providers."
relationships:
  - source: "Edge Router and Load Shedder"
    destination: "Consultation Service"
    description: "Routes consultation requests [gRPC over mTLS]"
  - source: "Edge Router and Load Shedder"
    destination: "AI Symptom Checker Service"
    description: "Routes symptom checking requests with W3C Trace Context [gRPC over mTLS]"
  - source: "Edge Router and Load Shedder"
    destination: "E-Prescription & Interoperability Service"
    description: "Routes e-prescription requests [gRPC over mTLS]"
  - source: "Auth Component"
    destination: "External Identity Providers"
    description: "Token validation [OIDC/JWKS over HTTPS]"