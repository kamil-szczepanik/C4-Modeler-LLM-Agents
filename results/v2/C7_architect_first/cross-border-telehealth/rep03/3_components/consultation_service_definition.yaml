level: component
scope: "Component diagram for the Consultation Service container"
parentContainer:
  name: "Consultation Service"
elements:
  - type: "component"
    name: "Signaling Component"
    technology: "Go, WebSockets"
    description: "Manages WebRTC connection setup and room coordination."
  - type: "component"
    name: "SFU Media Router"
    technology: "Go, Pion WebRTC"
    description: "Handles media mixing and routing with adaptive bitrate control."
  - type: "component"
    name: "Session Management Component"
    technology: "Go"
    description: "Enforces access control, checks patient consent, and logs session metadata."
  - type: "component"
    name: "Bandwidth Adaptator Component"
    technology: "Go"
    description: "Dynamically monitors stream metrics and triggers downscaling for degraded mode."
relationships:
  - source: "API Gateway"
    destination: "Signaling Component"
    description: "Routes consultation requests [gRPC over mTLS]"
  - source: "Signaling Component"
    destination: "SFU Media Router"
    description: "Manages media tracks [In-process / Go function calls]"
  - source: "Signaling Component"
    destination: "Session Management Component"
    description: "Validates auth tokens [In-process]"
  - source: "Bandwidth Adaptator Component"
    destination: "SFU Media Router"
    description: "Adjusts track bitrates dynamically [In-process / Go channels]"
  - source: "Session Management Component"
    destination: "Data Storage Layer"
    description: "Persists regional session states [SSL-enforced TCP/Postgres]"
  - source: "SFU Media Router"
    destination: "Client Applications"
    description: "Relays encrypted video/audio [DTLS-SRTP]"