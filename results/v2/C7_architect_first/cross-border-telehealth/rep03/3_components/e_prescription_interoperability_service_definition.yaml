level: component
scope: "Component diagram for the E-Prescription & Interoperability Service container"
parentContainer:
  name: "E-Prescription & Interoperability Service"
elements:
  - type: "component"
    name: "Prescription Orchestrator Component"
    technology: "Java / Spring Boot"
    description: "Manages prescription lifecycles and coordinates regional delegation."
  - type: "component"
    name: "US FHIR Adapter Component"
    technology: "Java / Spring Boot, Resilience4j, HL7 FHIR"
    description: "Handles US regional format translations and external pharmacy communication."
  - type: "component"
    name: "EU National Gateway Adapter Component"
    technology: "Java / Spring Boot, Resilience4j"
    description: "Handles EU national gateway integrations and payload transformations."
  - type: "component"
    name: "Prescription Status & Audit Component"
    technology: "Java / Spring Boot, GCP KMS, Cloud Storage WORM"
    description: "Manages prescription status updates, immutable audit logging, and secure data protection."
  - type: "component"
    name: "Google Cloud Pub/Sub"
    technology: "Google Cloud Pub/Sub"
    description: "At-least-once asynchronous event delivery with partition ordering for delivery status updates."
  - type: "component"
    name: "Cloud SQL PostgreSQL"
    technology: "Cloud SQL PostgreSQL"
    description: "Persists operational data and status changes via SSL-enforced TCP."
  - type: "component"
    name: "GCP KMS & Cloud Storage WORM"
    technology: "GCP KMS, Cloud Storage WORM"
    description: "Provides envelope encryption for secure data-at-rest and tamper-resistant immutable audit logging."
relationships:
  - source: "API Gateway"
    destination: "Prescription Orchestrator Component"
    description: "Invokes prescription creation [gRPC]"
  - source: "Prescription Orchestrator Component"
    destination: "US FHIR Adapter Component"
    description: "Delegates payload transformation [Internal Java Interfaces]"
  - source: "Prescription Orchestrator Component"
    destination: "EU National Gateway Adapter Component"
    description: "Delegates payload transformation [Internal Java Interfaces]"
  - source: "US FHIR Adapter Component"
    destination: "External Pharmacies"
    description: "Dispatches messages [HTTPS, REST, HL7 FHIR over mTLS]"
  - source: "EU National Gateway Adapter Component"
    destination: "External Pharmacies"
    description: "Dispatches messages [HTTPS, REST, HL7 FHIR over mTLS]"
  - source: "US FHIR Adapter Component"
    destination: "Prescription Status & Audit Component"
    description: "Publishes delivery status updates [Google Cloud Pub/Sub]"
  - source: "EU National Gateway Adapter Component"
    destination: "Prescription Status & Audit Component"
    description: "Publishes delivery status updates [Google Cloud Pub/Sub]"
  - source: "Prescription Status & Audit Component"
    destination: "Data Storage Layer"
    description: "Persists audit logs and status changes [SSL-enforced TCP, PostgreSQL]"