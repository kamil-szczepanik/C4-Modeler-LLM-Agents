level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and the US while ensuring strict cross-border health data residency and regulatory compliance."
elements:
  - type: "person"
    name: "Patients"
    description: "Mobile and Web clients who use the platform for video consultations, e-prescriptions, and AI symptom checking."
  - type: "person"
    name: "Clinicians"
    description: "Web clients who use the platform to conduct video consultations and manage patient care."
  - type: "externalSystem"
    name: "External Pharmacies"
    description: "EU national e-prescription networks and US pharmacy networks that receive prescription orders."
  - type: "externalSystem"
    name: "Identity Providers"
    description: "External systems handling authentication via OAuth2/OIDC."
relationships:
  - source: "Patients"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS, WebRTC, OIDC"
  - source: "Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Manages consultations and patient interactions"
    technology: "HTTPS, WebRTC, OIDC"
  - source: "Cross-Border Telehealth Platform"
    destination: "External Pharmacies"
    description: "Sends prescriptions and pharmacy requests"
    technology: "mTLS, HL7 FHIR (US), REST/SOAP (EU)"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity Providers"
    description: "Authenticates users"
    technology: "OAuth2/OIDC over HTTPS"