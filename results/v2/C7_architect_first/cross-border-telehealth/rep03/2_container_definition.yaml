level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "Mobile and Web clients who use the platform for video consultations, e-prescriptions, and AI symptom checking."
  - type: "person"
    name: "Clinicians"
    description: "Web clients who use the platform to conduct video consultations and manage patient care."
  - type: "externalSystem"
    name: "External Pharmacies"
    description: "EU national e-prescription networks and US pharmacy networks that receive prescription orders."
  - type: "externalSystem"
    name: "Identity Providers"
    description: "External systems handling authentication via OAuth2/OIDC."
  - type: "container"
    name: "Web & Mobile Frontend Applications"
    technology: "Flutter / React"
    description: "Provides the user interface for patients and clinicians to access platform features."
  - type: "container"
    name: "API Gateway"
    technology: "Envoy / Google Cloud API Gateway"
    description: "Routes incoming requests and enforces security policies at the edge."
  - type: "container"
    name: "Consultation Service"
    technology: "Go, WebRTC SFU"
    description: "Handles real-time video consultations and communication."
  - type: "container"
    name: "AI Symptom Checker Service"
    technology: "Python / FastAPI"
    description: "Provides AI-driven symptom checking functionality for patients."
  - type: "container"
    name: "E-Prescription & Interoperability Service"
    technology: "Node.js / Java"
    description: "Manages e-prescriptions and interoperability with external pharmacies."
  - type: "container"
    name: "Data Storage Layer"
    technology: "Cloud SQL PostgreSQL + Cloud Storage"
    description: "Provides secure, region-isolated persistent storage for platform data."
relationships:
  - source: "Patients"
    destination: "Web & Mobile Frontend Applications"
    description: "Interacts with the platform"
    technology: "HTTPS, WSS"
  - source: "Clinicians"
    destination: "Web & Mobile Frontend Applications"
    description: "Interacts with the platform"
    technology: "HTTPS, WSS"
  - source: "Web & Mobile Frontend Applications"
    destination: "API Gateway"
    description: "Sends API requests and establishes WebSocket connections"
    technology: "HTTPS, REST/JSON, WSS"
  - source: "API Gateway"
    destination: "Consultation Service"
    description: "Routes consultation requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "AI Symptom Checker Service"
    description: "Routes symptom checking requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "E-Prescription & Interoperability Service"
    description: "Routes e-prescription requests"
    technology: "gRPC over mTLS"
  - source: "Consultation Service"
    destination: "Data Storage Layer"
    description: "Reads and writes consultation data"
    technology: "SSL-enforced TCP/Postgres"
  - source: "AI Symptom Checker Service"
    destination: "Data Storage Layer"
    description: "Reads and writes symptom check data"
    technology: "SSL-enforced TCP/Postgres"
  - source: "E-Prescription & Interoperability Service"
    destination: "Data Storage Layer"
    description: "Reads and writes prescription data"
    technology: "SSL-enforced TCP/Postgres"
  - source: "E-Prescription & Interoperability Service"
    destination: "External Pharmacies"
    description: "Sends prescription orders"
    technology: "HL7 FHIR (US) and national standards (EU)"
  - source: "Web & Mobile Frontend Applications"
    destination: "Identity Providers"
    description: "Authenticates users"
    technology: "OAuth2/OIDC over HTTPS"