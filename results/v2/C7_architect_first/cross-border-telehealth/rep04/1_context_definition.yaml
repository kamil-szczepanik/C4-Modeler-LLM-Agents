# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "A cross-border telehealth platform providing video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US, enforcing strict regional data residency, regulatory compliance, and resilience for low-bandwidth users."
elements:
  - type: "person"
    name: "Patients (EU/US)"
    description: "Patients located in the EU or US accessing video consultations, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed medical professionals providing video consultations and issuing e-prescriptions."
  - type: "person"
    name: "Compliance/Audit Authorities"
    description: "Regulatory and audit authorities reviewing system compliance and WORM audit logs."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways"
    description: "External national gateways in the EU for processing e-prescriptions."
  - type: "externalSystem"
    name: "US Pharmacy Systems"
    description: "External US pharmacy systems for integrating and fulfilling prescriptions."
  - type: "externalSystem"
    name: "Identity Providers (OAuth2/OIDC)"
    description: "External identity providers handling authentication via OAuth2 and OIDC."
relationships:
  - source: "Patients (EU/US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Interact with regional platform instances for consultations and symptom checking"
    technology: "HTTPS, WebRTC (SRTP/DTLS-SRTP)"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Provide telehealth consultations and manage patient care"
    technology: "HTTPS, WebRTC (SRTP/DTLS-SRTP)"
  - source: "Compliance/Audit Authorities"
    destination: "Cross-Border Telehealth Platform"
    description: "Review system audit logs and compliance data"
    technology: "HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "EU National E-Prescription Gateways"
    description: "Integrates with EU gateways for e-prescriptions"
    technology: "REST/SOAP"
  - source: "Cross-Border Telehealth Platform"
    destination: "US Pharmacy Systems"
    description: "Integrates with US pharmacy systems for prescription fulfillment"
    technology: "HL7 FHIR, NCPDP"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity Providers (OAuth2/OIDC)"
    description: "Authenticates users"
    technology: "OAuth2/OIDC"