level: component
scope: "Component diagram for the Core Telehealth Backend container"
parentContainer:
  name: "Core Telehealth Backend"
elements:
  - type: "component"
    name: "ConsentManager"
    technology: "TypeScript"
    description: "Validates purpose-based consent and stores cryptographic consent tokens using Prisma ORM over regional VPC."
  - type: "component"
    name: "AuditLogger"
    technology: "TypeScript"
    description: "Encrypts audit payloads using GCP KMS API and dispatches audit events asynchronously via Pub/Sub SDK."
  - type: "component"
    name: "FhirAdapter"
    technology: "TypeScript"
    description: "Handles healthcare data interoperability and FHIR standard translations."
  - type: "component"
    name: "PatientPortalAPI"
    technology: "TypeScript / NestJS"
    description: "Exposes endpoints for patient portal interactions and validates consent via in-process calls."
relationships:
  - source: "PatientPortalAPI"
    destination: "ConsentManager"
    description: "Validates purpose-based consent via in-process TypeScript calls"
  - source: "ConsentManager"
    destination: "Cloud SQL"
    description: "Stores cryptographic consent tokens using Prisma ORM over regional VPC"
  - source: "AuditLogger"
    destination: "Cloud KMS"
    description: "Encrypts audit payloads before transport via GCP KMS API"
  - source: "AuditLogger"
    destination: "Cloud Pub/Sub"
    description: "Dispatches audit events asynchronously using Pub/Sub SDK"