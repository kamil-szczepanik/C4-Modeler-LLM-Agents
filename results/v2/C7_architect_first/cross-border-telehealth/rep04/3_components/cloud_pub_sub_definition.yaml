level: component
scope: "Component diagram for the Cloud Pub/Sub container"
parentContainer:
  name: "Cloud Pub/Sub"
elements:
  - type: "component"
    name: "Topic Router"
    technology: "Google Cloud Pub/Sub"
    description: "Routes validated events to regional topics."
  - type: "component"
    name: "Schema Registry"
    technology: "Google Cloud Pub/Sub"
    description: "Validates raw event payloads."
  - type: "component"
    name: "Retry & Backoff Controller"
    technology: "Google Cloud Pub/Sub"
    description: "Manages retry and backoff logic for messaging."
  - type: "component"
    name: "DLQ Handler"
    technology: "Google Cloud Pub/Sub"
    description: "Handles dead letter queues for failed message deliveries."
  - type: "component"
    name: "Audit Logger"
    technology: "Google Cloud Pub/Sub"
    description: "Logs event activities for auditing and traceability."
relationships:
  - source: "Schema Registry"
    destination: "Topic Router"
    description: "Forwards validated events"
  - source: "DLQ Handler"
    destination: "Interoperability Worker"
    description: "Triggers redelivery or alerts"