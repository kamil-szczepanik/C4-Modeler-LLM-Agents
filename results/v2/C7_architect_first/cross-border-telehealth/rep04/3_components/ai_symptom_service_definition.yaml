level: component
scope: "Component diagram for the AI Symptom Service container"
parentContainer:
  name: "AI Symptom Service"
elements:
  - type: "component"
    name: "API Controller"
    technology: "Python / FastAPI"
    description: "Routes requests via gRPC over VPC."
  - type: "component"
    name: "Symptom Inference Engine"
    technology: "Python / FastAPI"
    description: "Evaluates inputs in-process."
  - type: "component"
    name: "Traceability & Audit Logger"
    technology: "Python / FastAPI"
    description: "Delegates audit payloads in-process."
  - type: "component"
    name: "Data Residency Filter"
    technology: "Python / FastAPI"
    description: "Filters and isolates data regionally to satisfy GDPR and HIPAA mandates."
  - type: "component"
    name: "Resilience & Fallback Handler"
    technology: "Python / FastAPI"
    description: "Maintains availability and traceability for unstable connections."
relationships:
  - source: "API Controller"
    destination: "Symptom Inference Engine"
    description: "Evaluates inputs in-process"
  - source: "Symptom Inference Engine"
    destination: "Traceability & Audit Logger"
    description: "Delegates audit payloads in-process"