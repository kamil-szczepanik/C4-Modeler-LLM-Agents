level: component
scope: "Component diagram for the Interoperability Worker container"
parentContainer:
  name: "Interoperability Worker"
elements:
  - type: "component"
    name: "PubSub Consumer Module"
    technology: "Go"
    description: "Consumes regional e-prescription tasks from Cloud Pub/Sub."
  - type: "component"
    name: "Prescription Translator"
    technology: "Go"
    description: "Maps internal prescription models to EU REST/SOAP and US HL7 FHIR/NCPDP formats."
  - type: "component"
    name: "Gateway Dispatcher"
    technology: "Go, mTLS, TLS 1.3"
    description: "Transmits prescriptions securely to EU National E-Prescription Gateways and US Pharmacy Systems."
  - type: "component"
    name: "Status Notifier"
    technology: "Go, gRPC"
    description: "Pushes delivery status updates back to the Core Telehealth Backend."
relationships:
  - source: "PubSub Consumer Module"
    destination: "Prescription Translator"
    description: "Passes raw e-prescription messages for transformation"
  - source: "Prescription Translator"
    destination: "Gateway Dispatcher"
    description: "Forwards formatted prescription payloads"
  - source: "Gateway Dispatcher"
    destination: "Status Notifier"
    description: "Triggers status updates upon transmission completion"