level: component
scope: "Component diagram for the Video Media Server container"
parentContainer:
  name: "Video Media Server"
elements:
  - type: "component"
    name: "WebRTC Ingress/Egress Handler"
    technology: "LiveKit SDK / C++"
    description: "Handles live video and audio media streams using WebRTC over UDP/TCP, DTLS/SRTP."
  - type: "component"
    name: "Adaptive Bitrate (ABR) Controller"
    technology: "LiveKit SFU"
    description: "Maintains stable consultations in rural areas below 300 kbit/s."
  - type: "component"
    name: "Session & Auth Coordinator"
    technology: "Backend Service"
    description: "Manages room creation, participant management, and real-time control events."
  - type: "component"
    name: "Media Recorder"
    technology: "GStreamer / GCP Cloud Storage"
    description: "Handles secure local and archived session media recording."
  - type: "component"
    name: "Distributed TURN Relays"
    technology: "TURN / Network Infrastructure"
    description: "Ensures communication across unstable rural network connections."
  - type: "component"
    name: "Redis Pub/Sub Event Bus"
    technology: "Redis"
    description: "In-memory event bus for real-time control messaging and consent updates."
relationships:
  - source: "API Gateway"
    destination: "Session & Auth Coordinator"
    description: "Room creation and participant management [gRPC]"
  - source: "Patients/Clinicians"
    destination: "WebRTC Ingress/Egress Handler"
    description: "Video and audio media streams [WebRTC over UDP/TCP, DTLS/SRTP]"
  - source: "Session & Auth Coordinator"
    destination: "Media Recorder"
    description: "Real-time control events for consent management [Redis Pub/Sub]"
  - source: "Media Recorder"
    destination: "GCP Cloud Storage"
    description: "Encrypted session archives [HTTPS / Regional CMEK]"