level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Routing Proxy"
    technology: "Envoy Proxy / Google Cloud Run"
    description: "Handles edge routing, WASM consent filters, and rate-limiting to support unstable connections."
  - type: "component"
    name: "Web Security WAF"
    technology: "Google Cloud Armor"
    description: "Provides API threat protection and DDoS mitigation."
relationships:
  - source: "Edge Routing Proxy"
    destination: "Web Security WAF"
    description: "Inspects inbound traffic for threats"