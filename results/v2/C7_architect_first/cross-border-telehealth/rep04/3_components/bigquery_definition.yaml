# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the BigQuery container"
parentContainer:
  name: "BigQuery"
elements:
  - type: "component"
    name: "EU/US Analytics Datasets"
    technology: "Google Cloud BigQuery"
    description: "Regional datasets enforcing strict EU/US data residency compliance and storing audit logs and telemetry."
  - type: "component"
    name: "BigQuery Write API"
    technology: "gRPC"
    description: "Batch-loads audit logs and telemetry data from Cloud Pub/Sub into regional datasets."
  - type: "component"
    name: "Authorized Views"
    technology: "BigQuery SQL API"
    description: "Safely exposes aggregated AI metrics and audit reports to internal teams and auditors without exposing raw PHI."
  - type: "component"
    name: "BigQuery Reservation API"
    technology: "Management API"
    description: "Allocates and isolates compute capacity for regional analytics datasets."
relationships:
  - source: "Cloud Pub/Sub"
    destination: "EU/US Analytics Datasets"
    description: "Batch-loads audit logs via BigQuery Storage Write API [gRPC]"
  - source: "AI Symptom Service / Compliance Portal"
    destination: "Authorized Views"
    description: "Queries aggregated AI metrics and audit reports [BigQuery SQL API]"
  - source: "BigQuery Reservation API"
    destination: "EU/US Analytics Datasets"
    description: "Allocates and isolates compute capacity [Management API]"