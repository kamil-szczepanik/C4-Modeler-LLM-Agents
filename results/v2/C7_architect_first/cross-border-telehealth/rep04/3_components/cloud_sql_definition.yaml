level: component
scope: "Component diagram for the Cloud SQL container"
parentContainer:
  name: "Cloud SQL"
elements:
  - type: "component"
    name: "PostgreSQL Database Engine"
    technology: "PostgreSQL 15"
    description: "Managed relational database service configured with physically isolated instances per region to satisfy GDPR and HIPAA."
  - type: "component"
    name: "Row-Level Security (RLS) Policy Enforcer"
    technology: "PostgreSQL RLS"
    description: "Enforces data access boundaries based on regional and user context."
  - type: "component"
    name: "Audit Logging Extension (pgAudit)"
    technology: "pgAudit"
    description: "Intercepts and logs transactional events to Cloud Logging."
  - type: "component"
    name: "Consent Indexing & Verification Engine"
    technology: "PostgreSQL Extension / Pl/pgSQL"
    description: "Validates patient data-sharing scope before transactional writes."
  - type: "component"
    name: "PgBouncer Connection Pooler"
    technology: "PgBouncer"
    description: "Connection pooling service at container ingress to manage rural internet reconnection surges."
relationships:
  - source: "PostgreSQL Database Engine"
    destination: "Audit Logging Extension (pgAudit)"
    description: "Intercepts and logs transactional events to Cloud Logging [Internal IPC]"
  - source: "PostgreSQL Database Engine"
    destination: "Cloud KMS"
    description: "Encrypts data-at-rest using regional Customer-Managed Encryption Keys [Google Cloud API]"