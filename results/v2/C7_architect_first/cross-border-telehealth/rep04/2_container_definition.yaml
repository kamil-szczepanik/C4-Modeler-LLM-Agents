level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU/US)"
    description: "Patients located in the EU or US accessing video consultations, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed medical professionals providing video consultations and issuing e-prescriptions."
  - type: "person"
    name: "Compliance Authorities"
    description: "Regulatory and audit authorities reviewing system compliance and audit logs."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways"
    description: "External national gateways in the EU for processing e-prescriptions."
  - type: "externalSystem"
    name: "US Pharmacy Systems"
    description: "External US pharmacy systems for integrating and fulfilling prescriptions."
  - type: "externalSystem"
    name: "OAuth2/OIDC Identity Providers"
    description: "External identity providers handling user authentication."
  - type: "container"
    name: "API Gateway"
    technology: "Cloud Run / Envoy"
    description: "Manages incoming traffic, security, and routing to regional backend services."
  - type: "container"
    name: "Core Telehealth Backend"
    technology: "Node.js / NestJS"
    description: "Handles core business logic, user management, and validates consent."
  - type: "container"
    name: "AI Symptom Service"
    technology: "Python / FastAPI"
    description: "Provides AI symptom checking and logs inputs/outputs for EU MDR traceability."
  - type: "container"
    name: "Video Media Server"
    technology: "LiveKit / WebRTC"
    description: "Handles low-bandwidth resilient video and audio consultations."
  - type: "container"
    name: "Interoperability Worker"
    technology: "Go"
    description: "Processes e-prescriptions asynchronously to external national gateways."
  - type: "container"
    name: "Cloud SQL"
    technology: "PostgreSQL"
    description: "Regionalized database storage for core application data."
  - type: "container"
    name: "BigQuery"
    technology: "Google Cloud BigQuery"
    description: "Stores compliance logs and AI telemetry for traceability."
  - type: "container"
    name: "Cloud Pub/Sub"
    technology: "Google Cloud Pub/Sub with DLQs"
    description: "Provides asynchronous messaging with Dead Letter Queues for robust e-prescription delivery."
relationships:
  - source: "Patients (EU/US)"
    destination: "API Gateway"
    description: "Accesses consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS/REST, WebRTC"
  - source: "Licensed Clinicians"
    destination: "API Gateway"
    description: "Accesses platform to manage consultations and prescriptions"
    technology: "HTTPS/REST, WebRTC"
  - source: "Compliance Authorities"
    destination: "API Gateway"
    description: "Reviews audit logs and compliance metrics"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Core Telehealth Backend"
    description: "Routes regional core requests"
    technology: "gRPC over VPC"
  - source: "API Gateway"
    destination: "AI Symptom Service"
    description: "Routes AI symptom check requests"
    technology: "gRPC over VPC"
  - source: "API Gateway"
    destination: "Video Media Server"
    description: "Initiates video/audio sessions"
    technology: "WebRTC"
  - source: "Core Telehealth Backend"
    destination: "Cloud SQL"
    description: "Reads and writes application data and validates consent"
    technology: "PostgreSQL Protocol"
  - source: "Core Telehealth Backend"
    destination: "Cloud Pub/Sub"
    description: "Publishes e-prescription tasks asynchronously"
    technology: "Cloud Pub/Sub API"
  - source: "AI Symptom Service"
    destination: "BigQuery"
    description: "Logs AI inputs and outputs for EU MDR traceability"
    technology: "BigQuery API"
  - source: "Interoperability Worker"
    destination: "Cloud Pub/Sub"
    description: "Consumes e-prescription tasks"
    technology: "Cloud Pub/Sub API"
  - source: "Interoperability Worker"
    destination: "EU National E-Prescription Gateways"
    description: "Sends e-prescriptions to EU national gateways"
    technology: "REST/SOAP"
  - source: "Interoperability Worker"
    destination: "US Pharmacy Systems"
    description: "Sends e-prescriptions to US pharmacy systems"
    technology: "HL7 FHIR, NCPDP"
  - source: "API Gateway"
    destination: "OAuth2/OIDC Identity Providers"
    description: "Authenticates users"
    technology: "OAuth2/OIDC"