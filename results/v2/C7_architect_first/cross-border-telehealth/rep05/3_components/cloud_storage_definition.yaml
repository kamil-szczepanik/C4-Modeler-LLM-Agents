level: component
scope: "Component diagram for the Cloud Storage container"
parentContainer:
  name: "Cloud Storage"
elements:
  - type: "component"
    name: "Storage Gateway"
    technology: "Go / REST API"
    description: "Reads/writes encrypted blobs and interacts with Google Cloud Storage Buckets."
  - type: "component"
    name: "Upload Session Manager"
    technology: "Go / REST API"
    description: "Initiates resumable upload sessions and issues signed upload handles."
  - type: "component"
    name: "Encryption Service"
    technology: "Google Cloud KMS"
    description: "Encrypts/decrypts payloads and provides customer-managed encryption keys."
  - type: "component"
    name: "Data Residency Auditor"
    technology: "Google Cloud Functions"
    description: "Enforces strict regional data residency and compliance."
  - type: "component"
    name: "Access Control Enforcer"
    technology: "Go / Open Policy Agent"
    description: "Verifies key access rights and enforces security controls."
  - type: "component"
    name: "Google Cloud Storage Buckets"
    technology: "Google Cloud Storage"
    description: "Regional EU and US buckets for isolated data storage."
relationships:
  - source: "Storage Gateway"
    destination: "Google Cloud Storage Buckets"
    description: "Reads/writes encrypted blobs [HTTPS / GCP API]"
  - source: "Storage Gateway"
    destination: "Encryption Service"
    description: "Encrypts/decrypts payloads [gRPC]"
  - source: "Storage Gateway"
    destination: "Upload Session Manager"
    description: "Initiates resumable upload sessions [gRPC]"
  - source: "Upload Session Manager"
    destination: "Google Cloud Storage Buckets"
    description: "Issues signed upload handles [HTTPS]"
  - source: "Access Control Enforcer"
    destination: "Encryption Service"
    description: "Verifies key access rights [gRPC]"