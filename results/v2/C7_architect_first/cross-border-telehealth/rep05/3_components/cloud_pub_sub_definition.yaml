level: component
scope: "Component diagram for the Cloud Pub/Sub container"
parentContainer:
  name: "Cloud Pub/Sub"
elements:
  - type: "component"
    name: "Event Publisher"
    technology: "Google Cloud Pub/Sub Publisher API / TLS 1.3"
    description: "Publishes asynchronous healthcare events and messages from Core Services and Integration Service."
  - type: "component"
    name: "Event Consumer"
    technology: "Google Cloud Pub/Sub Subscriber API / TLS 1.3"
    description: "Consumes asynchronous events to ensure resilient and prioritized delivery for critical healthcare workflows."
relationships:
  - source: "Event Publisher"
    destination: "Event Consumer"
    description: "Dispatches and routes asynchronous healthcare events via Google Cloud Pub/Sub using TLS 1.3."