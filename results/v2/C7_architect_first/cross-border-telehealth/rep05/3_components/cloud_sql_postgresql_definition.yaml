level: component
scope: "Component diagram for the Cloud SQL (PostgreSQL) container"
parentContainer:
  name: "Cloud SQL (PostgreSQL)"
elements:
  - type: "component"
    name: "Database Instance Component"
    technology: "PostgreSQL with pgaudit"
    description: "Manages physically isolated relational data instances in europe-west3 and us-central1 ensuring GDPR and HIPAA compliance."
  - type: "component"
    name: "Connection Pooling Component"
    technology: "TCP/SSL"
    description: "Manages database sessions and connection pooling via TCP/SSL for core services."
relationships:
  - source: "Core Services Container"
    destination: "Connection Pooling Component"
    description: "Manages database sessions via TCP/SSL"
  - source: "Connection Pooling Component"
    destination: "Database Instance Component"
    description: "Routes queries to relational data instances"