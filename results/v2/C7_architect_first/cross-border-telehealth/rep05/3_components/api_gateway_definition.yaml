level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Policy Enforcement Proxy"
    technology: "Envoy Proxy"
    description: "Dispatches validated, consent-checked requests to core services."
  - type: "component"
    name: "Auth & Rate Limiter"
    technology: "Envoy Filter / Lua"
    description: "Handles JWT validation and routing rules."
  - type: "component"
    name: "Signaling Proxy"
    technology: "NGINX"
    description: "Relays real-time session metadata for video consultations."
  - type: "component"
    name: "Protocol Translation Bridge"
    technology: "Custom Bridge"
    description: "Translates protocols to ensure continuous, degraded-mode availability for rural connections."
relationships:
  - source: "Policy Enforcement Proxy"
    destination: "Core Services Container"
    description: "Dispatches validated, consent-checked requests [gRPC / mTLS]"
  - type: "Signaling Proxy"
    destination: "Video Media Server"
    description: "Relays real-time session metadata [WSS]"