level: component
scope: "Component diagram for the Video Media Server container"
parentContainer:
  name: "Video Media Server"
elements:
  - type: "component"
    name: "SFU Core"
    technology: "Go / LiveKit Engine"
    description: "Handles real-time media streams and core SFU functionality."
  - type: "component"
    name: "Room & Session Manager"
    technology: "Go"
    description: "Manages video rooms and user sessions."
  - type: "component"
    name: "Adaptive Bitrate Controller"
    technology: "Go"
    description: "Dynamically adjusts media codecs and enforces audio-only fallback."
  - type: "component"
    name: "Token Verifier"
    technology: "Go"
    description: "Validates incoming client JWTs locally."
relationships:
  - source: "Room & Session Manager"
    destination: "Core Services Container"
    description: "Validates session authorization [gRPC over mTLS]"
  - source: "SFU Core"
    destination: "Token Verifier"
    description: "Validates incoming client JWTs locally [In-Memory]"
  - source: "Adaptive Bitrate Controller"
    destination: "SFU Core"
    description: "Dynamically adjusts media codecs and enforces audio-only fallback [In-Memory Go API]"