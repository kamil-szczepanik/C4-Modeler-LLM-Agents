level: component
scope: "Component diagram for the AI Symptom Checker Container container"
parentContainer:
  name: "AI Symptom Checker Container"
elements:
  - type: "component"
    name: "API Router / Endpoint Handler"
    technology: "Python / FastAPI"
    description: "High-performance asynchronous API framework for handling routing and request validation."
  - type: "component"
    name: "Data Residency Guard"
    technology: "In-process logic"
    description: "Validates regional payload boundaries and enforces compliance."
  - type: "component"
    name: "Inference Engine"
    technology: "PyTorch / ONNX Runtime"
    description: "Optimized machine learning inference engine for rapid symptom analysis."
  - type: "component"
    name: "Model Cache / Warm Loader"
    technology: "In-memory cache"
    description: "Retrieves pre-loaded model weights for rapid inference."
  - type: "component"
    name: "Clinical Output Formatter"
    technology: "Python"
    description: "Passes and formats raw prediction vectors into structured clinical outputs."
  - type: "component"
    name: "Audit & Traceability Logger"
    technology: "OpenTelemetry / Cloud Logging"
    description: "Exports and persists prediction metadata, inputs, and model versions."
  - type: "component"
    name: "Google Cloud Cloud Logging / Cloud Storage"
    technology: "HTTPS / Cloud Storage API"
    description: "Persists immutable audit logs."
relationships:
  - source: "Core Services Container"
    destination: "API Router / Endpoint Handler"
    description: "Sends symptom analysis requests [gRPC over mTLS]"
  - source: "API Router / Endpoint Handler"
    destination: "Data Residency Guard"
    description: "Validates regional payload boundaries [In-process]"
  - source: "Data Residency Guard"
    destination: "Inference Engine"
    description: "Forwards verified payloads [In-process]"
  - source: "Inference Engine"
    destination: "Model Cache / Warm Loader"
    description: "Retrieves pre-loaded model weights [In-memory]"
  - source: "Inference Engine"
    destination: "Clinical Output Formatter"
    description: "Passes raw prediction vectors [In-process]"
  - source: "Inference Engine"
    destination: "Audit & Traceability Logger"
    description: "Exports prediction metadata, inputs, and model versions [Asynchronous]"
  - source: "Audit & Traceability Logger"
    destination: "Google Cloud Cloud Logging / Cloud Storage"
    description: "Persists immutable audit logs [HTTPS / Cloud Storage API]"