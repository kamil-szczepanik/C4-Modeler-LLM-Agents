level: component
scope: "Component diagram for the Web & Mobile App container"
parentContainer:
  name: "Web & Mobile App"
elements:
  - type: "component"
    name: "UI Layer"
    technology: "Flutter / TypeScript"
    description: "Cross-platform mobile and web presentation layers providing platform interfaces for patients, clinicians, and regional pharmacists."
  - type: "component"
    name: "State & Offline Manager"
    technology: "SQLCipher & IndexedDB"
    description: "Manages local encrypted storage for offline caching and resilience in unstable rural environments."
  - type: "component"
    name: "Video Client Wrapper"
    technology: "LiveKit Web/Mobile SDK"
    description: "Handles real-time WebRTC video consultation delivery between patients, clinicians, and pharmacists."
  - type: "component"
    name: "API & WebSocket Client"
    technology: "TypeScript / WebSockets / HTTPS"
    description: "Sends API requests and WebSocket messages to the API Gateway."
  - type: "component"
    name: "Consent & Policy Interceptor"
    technology: "Android Keystore / iOS Keychain / Unleash"
    description: "Routes region-locked, consented sync payloads via HTTPS ensuring data residency and compliance."
