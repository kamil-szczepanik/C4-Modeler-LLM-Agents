level: component
scope: "Component diagram for the Core Services Container container"
parentContainer:
  name: "Core Services Container"
elements:
  - type: "component"
    name: "Telehealth API Controller"
    technology: "Spring Boot / Java"
    description: "Handles incoming routing requests from the API Gateway via gRPC over mTLS."
  - type: "component"
    name: "Consent Policy Evaluator"
    technology: "Spring Boot / Java"
    description: "Evaluates cached consent policies by interacting with Memorystore for Redis."
  - type: "component"
    name: "Audit Logger"
    technology: "Spring Boot / Java"
    description: "Stores immutable audit logs in Cloud Storage via HTTPS / GCP API."
relationships:
  - source: "Telehealth API Controller"
    destination: "Consent Policy Evaluator"
    description: "Evaluates cached consent policies [Redis Protocol over TLS]"
  - source: "Telehealth API Controller"
    destination: "Audit Logger"
    description: "Dispatches compliance and audit records [HTTPS / GCP API]"