level: component
scope: "Component diagram for the Integration Service Container container"
parentContainer:
  name: "Integration Service Container"
elements:
  - type: "component"
    name: "Prescription Router"
    technology: "Node.js / TypeScript"
    description: "Routes prescription requests to the appropriate regional adapters."
  - type: "component"
    name: "EU/US E-Prescription Adapters"
    technology: "Node.js / TypeScript"
    description: "Adapts and sends e-prescription data to EU National E-Prescription Gateways and US Pharmacy Networks."
  - type: "component"
    name: "Outbox Event Processor"
    technology: "Node.js / TypeScript"
    description: "Processes outbox events for asynchronous messaging and decoupled communication."
  - type: "component"
    name: "Audit & Telemetry Interceptor"
    technology: "Node.js / TypeScript"
    description: "Intercepts and records audit logs and telemetry data for compliance and tracking."
  - type: "component"
    name: "DLQ Manager"
    technology: "Node.js / TypeScript"
    description: "Manages dead-letter queues and publishes permanent dispatch failure notifications via Cloud Pub/Sub."
relationships:
  - source: "DLQ Manager"
    destination: "Core Services Container"
    description: "Publishes permanent dispatch failure notifications via Cloud Pub/Sub"