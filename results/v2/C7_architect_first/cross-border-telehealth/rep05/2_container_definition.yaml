level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients using mobile or web clients for video consultations, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Clinicians"
    description: "Clinicians using web clients to conduct video consultations and manage patient care."
  - type: "person"
    name: "Regional Pharmacists"
    description: "Regional pharmacists fulfilling prescriptions across borders."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways"
    description: "External national gateways for e-prescriptions in the European Union."
  - type: "externalSystem"
    name: "US Pharmacy Networks"
    description: "External pharmacy networks in the United States using HL7 FHIR."
  - type: "externalSystem"
    name: "Regional Identity Providers"
    description: "OIDC/OAuth2 identity providers for authentication."
  - type: "container"
    name: "Web & Mobile App"
    technology: "Flutter / TypeScript"
    description: "Client applications for cross-platform support providing user interfaces for video, e-prescriptions, and symptom checking."
  - type: "container"
    name: "API Gateway"
    technology: "Google Cloud API Gateway"
    description: "Manages and routes incoming HTTPS and WebSocket traffic, and handles WebRTC signaling."
  - type: "container"
    name: "Core Services Container"
    technology: "Spring Boot / Java"
    description: "Handles core business logic, consent management, and data orchestration."
  - type: "container"
    name: "AI Symptom Checker Container"
    technology: "Python / FastAPI"
    description: "Provides AI symptom checker inference and logging."
  - type: "container"
    name: "Integration Service Container"
    technology: "Node.js / TypeScript"
    description: "Handles asynchronous e-prescription dispatch and external integrations."
  - type: "container"
    name: "Video Media Server"
    technology: "LiveKit / WebRTC"
    description: "Provides low-bandwidth resilient video consultations."
  - type: "container"
    name: "Cloud SQL (PostgreSQL)"
    technology: "PostgreSQL"
    description: "Provides encrypted, region-isolated data persistence."
  - type: "container"
    name: "Cloud Storage"
    technology: "Google Cloud Storage"
    description: "Stores encrypted documents and media files with region isolation."
  - type: "container"
    name: "Cloud Pub/Sub"
    technology: "Google Cloud Pub/Sub"
    description: "Handles asynchronous messaging and region-isolated event dispatch."
relationships:
  - source: "Patients"
    destination: "Web & Mobile App"
    description: "Interacts with the platform via mobile and web interfaces"
    technology: "HTTPS / WebSockets"
  - source: "Clinicians"
    destination: "Web & Mobile App"
    description: "Manages consultations and patient care via web client"
    technology: "HTTPS / WebSockets"
  - source: "Regional Pharmacists"
    destination: "Web & Mobile App"
    description: "Accesses prescription fulfillment workflows"
    technology: "HTTPS"
  - source: "Web & Mobile App"
    destination: "API Gateway"
    description: "Sends API requests and WebSocket messages"
    technology: "HTTPS / WebSockets"
  - source: "Web & Mobile App"
    destination: "Video Media Server"
    description: "Connects for video consultations (signaled via API Gateway)"
    technology: "WebRTC"
  - source: "API Gateway"
    destination: "Core Services Container"
    description: "Routes backend requests securely"
    technology: "gRPC over mTLS"
  - source: "Core Services Container"
    destination: "AI Symptom Checker Container"
    description: "Sends inference requests"
    technology: "gRPC over mTLS"
  - source: "Core Services Container"
    destination: "Integration Service Container"
    description: "Dispatches events via regionally isolated topics"
    technology: "Cloud Pub/Sub"
  - source: "Core Services Container"
    destination: "Cloud SQL (PostgreSQL)"
    description: "Reads and writes relational data"
    technology: "JDBC / SQL"
  - source: "Core Services Container"
    destination: "Cloud Storage"
    description: "Reads and writes encrypted files"
    technology: "HTTPS / GCP API"
  - source: "Integration Service Container"
    destination: "EU National E-Prescription Gateways"
    description: "Sends e-prescription data"
    technology: "REST / HL7 FHIR"
  - source: "Integration Service Container"
    destination: "US Pharmacy Networks"
    description: "Sends e-prescription data"
    technology: "REST / HL7 FHIR"
  - source: "Core Services Container"
    destination: "Regional Identity Providers"
    description: "Authenticates users"
    technology: "OIDC / OAuth2"