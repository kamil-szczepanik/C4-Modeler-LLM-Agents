level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "A cross-border telehealth platform providing video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and the US."
elements:
  - type: "person"
    name: "Patients"
    description: "Patients using mobile or web clients for video consultations, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Clinicians"
    description: "Clinicians using web clients to conduct video consultations and manage patient care."
  - type: "person"
    name: "Regional Pharmacists"
    description: "Regional pharmacists fulfilling prescriptions across borders."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways"
    description: "External national gateways for e-prescriptions in the European Union."
  - type: "externalSystem"
    name: "US Pharmacy Networks"
    description: "External pharmacy networks in the United States."
  - type: "externalSystem"
    name: "Regional Identity Providers"
    description: "OIDC/OAuth2 identity providers for authentication."
relationships:
  - source: "Patients"
    destination: "Cross-Border Telehealth Platform"
    description: "Connects via TLS 1.3 for video consultations, symptom checking, and prescriptions"
    technology: "HTTPS / WebRTC / TLS 1.3"
  - source: "Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Connects via TLS 1.3 to manage consultations and patient records"
    technology: "HTTPS / TLS 1.3"
  - source: "Regional Pharmacists"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses prescription data and fulfillment details"
    technology: "HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "EU National E-Prescription Gateways"
    description: "Integrates for EU e-prescriptions"
    technology: "REST / HL7 FHIR"
  - source: "Cross-Border Telehealth Platform"
    destination: "US Pharmacy Networks"
    description: "Integrates for US e-prescriptions"
    technology: "REST / HL7 FHIR"
  - source: "Cross-Border Telehealth Platform"
    destination: "Regional Identity Providers"
    description: "Authenticates users via OIDC/OAuth2"
    technology: "OIDC / OAuth2"