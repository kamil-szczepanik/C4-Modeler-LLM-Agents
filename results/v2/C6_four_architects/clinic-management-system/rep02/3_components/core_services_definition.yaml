level: component
scope: "Component diagram for the Core Services container"
parentContainer:
  name: "Core Services"
elements:
  - type: "component"
    name: "Patient Management Component"
    technology: "TypeORM / Node.js"
    description: "Handles demographic capture via TypeORM."
  - type: "component"
    name: "Scheduling Engine Component"
    technology: "Node.js / NestJS"
    description: "Manages appointment scheduling and resource clash checks."
  - type: "component"
    name: "Billing Service Component"
    technology: "HTTP/REST / Node.js"
    description: "Processes claims and invoices via HTTP/REST."
  - type: "component"
    name: "Audit Logger Component"
    technology: "AMQP / Node.js"
    description: "Publishes immutable audit trails."
  - type: "component"
    name: "Access Control & Policy Enforcer Component"
    technology: "JWT / NestJS"
    description: "Validates JWT claims and scopes."
  - type: "component"
    name: "FHIR Data Mapper Component"
    technology: "HL7 FHIR / Node.js"
    description: "Translates models into HL7 FHIR standards."
  - type: "component"
    name: "Encryption-at-Rest Middleware Component"
    technology: "Node.js Crypto Module (AES-256-GCM)"
    description: "Applies AES-256 field-level encryption."
  - type: "component"
    name: "Patient Data Repository Component"
    technology: "SQL / Node.js"
    description: "Encapsulates data queries and PHI protection."
  - type: "component"
    name: "Config & Secret Manager Component"
    technology: "HTTPS / Node.js"
    description: "Fetches dynamic runtime configurations and keys."
relationships:
  - source: "Scheduling Engine Component"
    destination: "Cache / State Store"
    description: "Read/Write lock states via TCP/TLS (RESP)."
  - source: "Billing Service Component"
    destination: "Insurance Clearinghouses"
    description: "Submit claims via HTTPS/REST."
  - source: "Audit Logger Component"
    destination: "Message Broker"
    description: "Produce audit events via AMQP/TLS."
  - source: "FHIR Data Mapper Component"
    destination: "Integration Service"
    description: "Publish standardized resources via gRPC/TLS."
  - source: "Patient Management Component"
    destination: "Encryption-at-Rest Middleware Component"
    description: "Encrypt data via Node.js Crypto Module (AES-256-GCM)."
  - source: "Billing Service Component"
    destination: "Encryption-at-Rest Middleware Component"
    description: "Encrypt data via Node.js Crypto Module (AES-256-GCM)."
  - source: "Patient Data Repository Component"
    destination: "Data Layer"
    description: "Encrypted SQL queries via TLS (TCP/JDBC)."
  - source: "Encryption-at-Rest Middleware Component"
    destination: "Config & Secret Manager Component"
    description: "Retrieve keys via HTTPS."
  - source: "Internal components"
    destination: "Access Control & Policy Enforcer Component"
    description: "In-process NestJS middleware and EventEmitter."