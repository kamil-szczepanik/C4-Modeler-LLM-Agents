level: component
scope: "Component diagram for the Data Layer container"
parentContainer:
  name: "Data Layer"
elements:
  - type: "component"
    name: "Primary Relational Store"
    technology: "PostgreSQL (Multi-Master / Citus or Cloud Managed RDS)"
    description: "Stores structured EMR, billing, and scheduling data with ACID compliance."
  - type: "component"
    name: "Audit Logging Store"
    technology: "Append-only PostgreSQL schema"
    description: "Provides tamper-proof audit trails with row-level security."
  - type: "component"
    name: "Blob Object Store"
    technology: "MinIO / AWS S3"
    description: "Stores large medical imaging and lab binary files."
  - type: "component"
    name: "Data Access Proxy"
    technology: "PgBouncer"
    description: "Handles connection pooling and load distribution to prevent database exhaustion."
  - type: "component"
    name: "Encryption & Key Management Module"
    technology: "HashiCorp Vault or AWS KMS"
    description: "Provides FIPS 140-2 Level 3 HSM encryption and AES-256 encryption at rest."
  - type: "component"
    name: "Replication & Sync Manager"
    technology: "Debezium and Kafka Connect"
    description: "Manages reliable hybrid cross-site synchronization between on-prem-k8s and AWS."
  - type: "component"
    name: "Database Migration & Schema Manager"
    technology: "Flyway or Liquibase"
    description: "Executes atomic, zero-downtime version-controlled schema upgrades."
relationships:
  - source: "Core Services & EMR Service"
    destination: "Data Access Proxy"
    description: "TLS (TCP/JDBC) for connection pooling."
  - source: "Data Access Proxy"
    destination: "Primary Relational Store"
    description: "TCP/JDBC."
  - source: "EMR Service"
    destination: "Blob Object Store"
    description: "HTTPS (S3 API) with pre-signed URLs for binary transfers."
  - source: "Primary Relational Store"
    destination: "Audit Logging Store"
    description: "Internal synchronous logical replication."
  - source: "Primary Relational Store"
    destination: "Encryption & Key Management Module"
    description: "gRPC/HTTPS for envelope encryption and key rotation."
  - source: "Blob Object Store"
    destination: "Encryption & Key Management Module"
    description: "gRPC/HTTPS for envelope encryption and key rotation."
  - source: "Replication & Sync Manager"
    destination: "Primary Relational Store"
    description: "TLS (Logical Replication Stream) between on-prem-k8s and eu-central-1."