level: component
scope: "Component diagram for the EMR Service container"
parentContainer:
  name: "EMR Service"
elements:
  - type: "component"
    name: "EMR REST Controller"
    technology: "Spring MVC"
    description: "Handles incoming HTTP requests for patient admissions, electronic medical records, scheduling, and billing."
  - type: "component"
    name: "EMR Domain Engine"
    technology: "Spring Data JPA"
    description: "Executes core clinical business logic and data persistence."
  - type: "component"
    name: "Audit Interceptor"
    technology: "Spring AOP"
    description: "Provides automated immutable audit trails for HIPAA compliance."
  - type: "component"
    name: "FHIR Transformer Component"
    technology: "HAPI FHIR library"
    description: "Handles HL7 FHIR standardization for external interoperability."
  - type: "component"
    name: "EMR Cache Manager"
    technology: "Spring Cache / Redis Client"
    description: "Manages distributed caching for sub-second P95 screen loads."
  - type: "component"
    name: "Clinical Document Storage Adapter"
    technology: "AWS SDK / S3 Client"
    description: "Manages encrypted binary blob storage with AES-256."
  - type: "component"
    name: "Clinical Event Publisher"
    technology: "Spring Cloud Stream / Kafka Client"
    description: "Publishes asynchronous events for cross-service messaging."
  - type: "component"
    name: "Cache / State Store (Redis Cluster)"
    technology: "Redis Cluster"
    description: "Distributed caching layer for state storage."
  - type: "component"
    name: "Data Layer (MinIO/AWS S3)"
    technology: "MinIO / AWS S3"
    description: "Encrypted binary blob storage layer."
  - type: "component"
    name: "Message Broker (Kafka)"
    technology: "Apache Kafka"
    description: "Asynchronous event-driven message broker."
relationships:
  - source: "EMR REST Controller"
    destination: "EMR Domain Engine"
    description: "In-process method calls [HTTPS]"
  - source: "EMR Domain Engine"
    destination: "Audit Interceptor"
    description: "In-process method calls [TLS/JDBC]"
  - source: "EMR Domain Engine"
    destination: "FHIR Transformer Component"
    description: "In-process method calls"
  - source: "EMR Domain Engine"
    destination: "EMR Cache Manager"
    description: "In-process method calls"
  - source: "EMR Cache Manager"
    destination: "Cache / State Store (Redis Cluster)"
    description: "Distributed caching [TLS / RESP]"
  - source: "EMR Domain Engine"
    destination: "Clinical Document Storage Adapter"
    description: "In-process method calls"
  - source: "Clinical Document Storage Adapter"
    destination: "Data Layer (MinIO/AWS S3)"
    description: "Blob storage [HTTPS / S3 API]"
  - source: "EMR Domain Engine"
    destination: "Clinical Event Publisher"
    description: "In-process method calls"
  - source: "Clinical Event Publisher"
    destination: "Message Broker (Kafka)"
    description: "Event publishing [AMQP/TLS]"