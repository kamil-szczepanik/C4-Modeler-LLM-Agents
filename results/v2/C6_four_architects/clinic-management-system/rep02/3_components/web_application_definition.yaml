level: component
scope: "Component diagram for the Web Application container"
parentContainer:
  name: "Web Application"
elements:
  - type: "component"
    name: "Router & State Controller"
    technology: "TypeScript, React Router"
    description: "Managing client-side navigation and session state enforcement."
  - type: "component"
    name: "Auth & Session Manager"
    technology: "TypeScript module"
    description: "Handling OpenID Connect (OIDC) token exchange with Keycloak and enforcing multi-factor authentication (MFA)."
  - type: "component"
    name: "EMR UI Module"
    technology: "TypeScript, React"
    description: "Component tree optimized for medical records with local caching."
  - type: "component"
    name: "Billing & Scheduling UI Module"
    technology: "TypeScript, React"
    description: "Components handling patient registration, appointments, and insurance claims."
  - type: "component"
    name: "API Client / Interceptor"
    technology: "TypeScript, Axios"
    description: "Module managing centralized communication and injecting JWT bearer tokens."
  - type: "component"
    name: "Offline State & Sync Manager"
    technology: "TypeScript, browser IndexedDB, Web Crypto API"
    description: "Browser IndexedDB module with Web Crypto API encryption for transient data."
  - type: "component"
    name: "Telemetry & Audit Logger"
    technology: "TypeScript module"
    description: "Capturing client performance metrics and security audit events."
  - type: "component"
    name: "API Gateway"
    technology: "HTTPS, TLS 1.3"
    description: "External API Gateway receiving requests from the Web Application."
