level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Topic Management & Partitioning Engine"
    technology: "Apache Kafka"
    description: "Handles topic management and data partitioning for clinical event streams."
  - type: "component"
    name: "Access Control & TLS Termination Module"
    technology: "TLS / mTLS"
    description: "Manages access control and TLS termination to ensure HIPAA/GDPR compliance."
  - type: "component"
    name: "Schema Registry Component"
    technology: "Confluent Schema Registry / Apicurio"
    description: "Enforces Avro/Protobuf clinical payload contracts."
  - type: "component"
    name: "Broker Cluster Coordinator"
    technology: "KRaft"
    description: "Provides metadata and leader election without ZooKeeper for high availability."
  - type: "component"
    name: "Log Compaction & Retention Manager"
    technology: "Apache Kafka Log Compaction"
    description: "Manages long-term log compaction and historical log tiering to cold storage."
  - type: "component"
    name: "Dead Letter Queue & Routing Component"
    technology: "Apache Kafka DLQ"
    description: "Handles internal stream redirection for failed messages."
  - type: "component"
    name: "Audit Logging & Compliance Interceptor"
    technology: "Kafka Interceptor"
    description: "Captures security audit streams for compliance."
  - type: "component"
    name: "Keycloak"
    technology: "Identity & Policy Container"
    description: "Manages identity and policies via OAuth2/OIDC."
  - type: "component"
    name: "MinIO / AWS S3"
    technology: "MinIO / AWS S3"
    description: "Provides long-term cold storage for 10-year data retention compliance."
  - type: "component"
    name: "Core Services & EMR Service"
    technology: "Clinical IT Platform Services"
    description: "Manages patient admissions, EMRs, scheduling, and billing workflows."
relationships:
  - source: "Core Services & EMR Service"
    destination: "Schema Registry Component"
    description: "HTTP/TLS for schema validation"
  - source: "Core Services & EMR Service"
    destination: "Topic Management & Partitioning Engine"
    description: "TCP/TLS (Kafka Protocol)"
  - source: "Access Control & TLS Termination Module"
    destination: "Keycloak"
    description: "OAuth2/OIDC via HTTPS"
  - source: "Topic Management & Partitioning Engine"
    destination: "Broker Cluster Coordinator"
    description: "Raft consensus over TCP/TLS"
  - source: "Broker Cluster Coordinator"
    destination: "Topic Management & Partitioning Engine"
    description: "Raft consensus over TCP/TLS"
  - source: "Log Compaction & Retention Manager"
    destination: "MinIO / AWS S3"
    description: "HTTPS for historical log tiering"
  - source: "Topic Management & Partitioning Engine"
    destination: "Dead Letter Queue & Routing Component"
    description: "Internal TCP/TLS stream redirection"
  - source: "Audit Logging & Compliance Interceptor"
    destination: "Core Services & EMR Service"
    description: "TCP/TLS for security audit streams"