level: component
scope: "Component diagram for the Integration Service container"
parentContainer:
  name: "Integration Service"
elements:
  - type: "component"
    name: "FHIR Ingress/Egress Router"
    technology: "Apache Camel / Java"
    description: "Routes FHIR over HTTPS requests to and from external Lab/Imaging Systems."
  - type: "component"
    name: "HL7 v2 MLLP Adapter"
    technology: "Apache Camel / Java"
    description: "Handles legacy data ingestion via MLLP over TCP from external Lab/Imaging Systems."
  - type: "component"
    name: "Schema Validation Component"
    technology: "Apache Camel / Java"
    description: "Validates incoming and outgoing healthcare message schemas."
  - type: "component"
    name: "Data Transformation Engine"
    technology: "Apache Camel / Java"
    description: "Transforms healthcare data formats between internal models and external standards."
  - type: "component"
    name: "Circuit Breaker & Resilience Engine"
    technology: "Apache Camel / Java"
    description: "Ensures resilience and fault tolerance using distributed state synchronized with Redis."
  - type: "component"
    name: "OAuth2/mTLS Security Interceptor"
    technology: "Apache Camel / Java"
    description: "Provides security interception using OAuth2 and mTLS for secure communication."
  - type: "component"
    name: "Dead Letter Channel & Audit Component"
    technology: "Apache Camel / Java"
    description: "Manages failed messages and persists audit trails to the Data Layer."
  - type: "component"
    name: "Integration Queue Producer"
    technology: "Apache Camel / Java"
    description: "Publishes integration events to the Message Broker."
  - type: "component"
    name: "Metrics & Telemetry Publisher"
    technology: "Apache Camel / Java"
    description: "Publishes operational telemetry to the monitoring stack."
relationships:
  - source: "FHIR Ingress/Egress Router"
    destination: "External Lab/Imaging Systems"
    description: "FHIR over HTTPS [HTTPS/JSON]"
  - source: "HL7 v2 MLLP Adapter"
    destination: "External Lab/Imaging Systems"
    description: "Legacy data ingestion via MLLP [TCP]"
  - source: "Integration Queue Producer"
    destination: "Message Broker (Apache Kafka)"
    description: "Event publishing [TCP/Kafka]"
  - source: "Circuit Breaker & Resilience Engine"
    destination: "Cache / State Store (Redis Cluster)"
    description: "State synchronization via RESP [RESP/TLS]"
  - source: "Dead Letter Channel & Audit Component"
    destination: "Data Layer (PostgreSQL/MinIO)"
    description: "Audit persistence via JDBC [JDBC/TLS]"
  - source: "Metrics & Telemetry Publisher"
    destination: "Monitoring Stack"
    description: "Operational telemetry [HTTP/TLS]"