level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Router"
    technology: "Envoy"
    description: "Edge Router handling TLS 1.3 HTTPS traffic and upstream gRPC/mTLS routing."
  - type: "component"
    name: "Auth Filter"
    technology: "Envoy Filter"
    description: "Authenticates requests and synchronizes JWKS cache with the Identity & Policy Container."
  - type: "component"
    name: "Rate Limiting Plugin"
    technology: "Envoy Plugin"
    description: "Performs token bucket tracking and rate-limiting evaluation using Redis Cluster."
  - type: "component"
    name: "Audit Interceptor"
    technology: "Envoy Interceptor"
    description: "Streams asynchronous audit logs to Apache Kafka for HIPAA compliance."
  - type: "component"
    name: "Data Masking Filter"
    technology: "Envoy Filter"
    description: "Masks sensitive patient data to ensure HIPAA and GDPR compliance."
relationships:
  - source: "Edge Router"
    destination: "Core Services"
    description: "Upstream requests [gRPC over mTLS]"
  - source: "Edge Router"
    destination: "EMR Service"
    description: "Upstream requests [gRPC over mTLS]"
  - source: "Auth Filter"
    destination: "Identity & Policy Container"
    description: "JWKS cache sync [HTTPS]"
  - source: "Rate Limiting Plugin"
    destination: "Cache / State Store"
    description: "Token bucket tracking [RESP / TCP]"
  - source: "Audit Interceptor"
    destination: "Message Broker"
    description: "Asynchronous audit logs [TCP / Kafka Protocol]"
  - source: "Edge Router"
    destination: "Integration Service"
    description: "FHIR interoperability requests [gRPC / HTTPS]"