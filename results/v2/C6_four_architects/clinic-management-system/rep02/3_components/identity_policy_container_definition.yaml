level: component
scope: "Component diagram for the Identity & Policy Container container"
parentContainer:
  name: "Identity & Policy Container"
elements:
  - type: "component"
    name: "Authn Engine"
    technology: "Keycloak Authentication SPIs, Java"
    description: "Built-in Keycloak Authentication SPIs handling MFA and OIDC/OAuth2."
  - type: "component"
    name: "Policy Enforcement / RBAC Module"
    technology: "Keycloak Authorization Services"
    description: "Evaluates fine-grained roles and user permissions."
  - type: "component"
    name: "User Federation Service"
    technology: "LDAP/SAML SPI"
    description: "Integrates with external IdPs via LDAP/SAML."
  - type: "component"
    name: "Local Token Cache"
    technology: "Infinispan, JGroups"
    description: "Infinispan distributed cache for session synchronization."
  - type: "component"
    name: "Audit Logging SPI"
    technology: "Keycloak Event Listener SPI"
    description: "Captures security events for compliance tracking."
  - type: "component"
    name: "OAuth2 Token Introspection Module"
    technology: "Keycloak OAuth2 Endpoint"
    description: "Handles token revocation and session termination."
relationships:
  - source: "API Gateway"
    destination: "Authn Engine"
    description: "Token validation via local Public Key Cryptography (JWT/JWKS over HTTPS)."
  - source: "Policy Enforcement / RBAC Module"
    destination: "Core Services / EMR Service"
    description: "Authorization endpoints via gRPC over mTLS."
  - source: "Audit Logging SPI"
    destination: "Message Broker"
    description: "Event publishing via AMQP/Kafka Protocol over TLS."
  - source: "Core Services / EMR Service"
    destination: "OAuth2 Token Introspection Module"
    description: "Token validation via gRPC over mTLS."
  - source: "Internal Components"
    destination: "Local Token Cache"
    description: "Session synchronization via JGroups over TLS."
  - source: "Authn Engine"
    destination: "Data Layer"
    description: "Credential and session persistence via JDBC over TLS."