level: component
scope: "Component diagram for the Cache / State Store container"
parentContainer:
  name: "Cache / State Store"
elements:
  - type: "component"
    name: "TLS Termination Proxy"
    technology: "Redis Proxy / TLS 1.3"
    description: "Terminates inbound TLS connections and enforces secure transport from core services."
  - type: "component"
    name: "Access Control & RBAC Enforcer"
    technology: "Redis ACL Module"
    description: "Validates permissions and handles internal routing of authenticated commands."
  - type: "component"
    name: "In-Memory Data Engine"
    technology: "Redis Enterprise / Redis Cluster"
    description: "Provides ultra-low latency caching, distributed locking via Redlock, and keyspace operations."
  - type: "component"
    name: "Cluster Topology Manager"
    technology: "Redis Cluster Consensus Manager"
    description: "Performs internal IPC for node state monitoring and high availability."
  - type: "component"
    name: "Encryption & Key Management Module"
    technology: "AES-256 Module"
    description: "Handles internal crypto operations for transparent data encryption at rest."
  - type: "component"
    name: "Cache / State Store (Active-Active Sync)"
    technology: "Redis Active-Active CRDTs"
    description: "Manages encrypted WAN replication link between on-prem-k8s and eu-central-1."
relationships:
  - source: "Core Services & EMR Service"
    destination: "TLS Termination Proxy"
    description: "TCP/TLS (RESP)"
  - source: "TLS Termination Proxy"
    destination: "Access Control & RBAC Enforcer"
    description: "Internal routing of authenticated commands"
  - source: "Access Control & RBAC Enforcer"
    destination: "In-Memory Data Engine"
    description: "Authorized keyspace operations"
  - source: "In-Memory Data Engine"
    destination: "Cluster Topology Manager"
    description: "Internal IPC for node state monitoring"
  - source: "In-Memory Data Engine"
    destination: "Encryption & Key Management Module"
    description: "Internal crypto operations for disk persistence"
  - source: "Cache / State Store"
    destination: "Cache / State Store (Active-Active Sync)"
    description: "Encrypted WAN replication link (on-prem-k8s to eu-central-1)"
  - source: "Cache / State Store"
    destination: "Message Broker"
    description: "TCP/TLS (AMQP/Kafka) for state-eviction events"