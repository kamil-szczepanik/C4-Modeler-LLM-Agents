level: component
scope: "Component diagram for the Async Worker Containers container"
parentContainer:
  name: "Async Worker Containers"
elements:
  - type: "component"
    name: "Task Dispatcher"
    technology: "Python / Celery"
    description: "Consumes messages from Message Broker via AMQP/Kafka."
  - type: "component"
    name: "Workflow Orchestrator"
    technology: "Temporal"
    description: "Manages durable, multi-step clinical sagas with built-in audit trails and persists state to Data Layer."
  - type: "component"
    name: "Integration Dispatcher"
    technology: "Python / httpx"
    description: "Invokes External Systems securely via HTTPS/mTLS."
  - type: "component"
    name: "Encryption / Sanitization Component"
    technology: "Python cryptography"
    description: "Ensures HIPAA/GDPR compliance and secure handling of sensitive data."
  - type: "component"
    name: "Batch Export Formatter"
    technology: "Python / Jinja2 / Marshmallow"
    description: "Formats and sends payloads to Integration Dispatcher."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Python structlog"
    description: "Flushes encrypted records to Data Layer (PostgreSQL) via TLS 1.3."
  - type: "component"
    name: "Dead-Letter Queue (DLQ) Handler"
    technology: "Celery DLQ extensions"
    description: "Handles failed task messages for error management."
  - type: "component"
    name: "Worker Health & Metrics Exporter"
    technology: "Prometheus Python Client"
    description: "Exposes endpoints scraped by Kubernetes via HTTP/GET."
  - type: "component"
    name: "Message Broker"
    technology: "AMQP / Kafka"
    description: "External message broker supplying tasks to the Task Dispatcher."
  - type: "component"
    name: "Data Layer"
    technology: "PostgreSQL"
    description: "Persistent storage for workflow states and audit logs."
  - type: "component"
    name: "External Systems"
    technology: "HTTPS / mTLS"
    description: "External systems invoked securely by the Integration Dispatcher."
  - type: "component"
    name: "Kubernetes"
    technology: "Container Orchestration"
    description: "Infrastructure scraping metrics from the Worker Health & Metrics Exporter."
relationships:
  - source: "Task Dispatcher"
    destination: "Message Broker"
    description: "Consumes messages from"
  - source: "Workflow Orchestrator"
    destination: "Data Layer"
    description: "Persists state to via encrypted SQL/TLS 1.3"
  - source: "Integration Dispatcher"
    destination: "External Systems"
    description: "Invokes securely via HTTPS/mTLS"
  - source: "Batch Export Formatter"
    destination: "Integration Dispatcher"
    description: "Sends payloads to via gRPC/HTTP"
  - source: "Audit Logger Component"
    destination: "Data Layer"
    description: "Flushes encrypted records to via TLS 1.3"
  - source: "Worker Health & Metrics Exporter"
    destination: "Kubernetes"
    description: "Exposes endpoints scraped by via HTTP/GET"