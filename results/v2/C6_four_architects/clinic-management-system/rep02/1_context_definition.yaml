level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed to handle patient registration, scheduling, electronic medical records (EMR), and billing for medical clinics, ensuring HIPAA/GDPR compliance, 99.99% availability, and strict 10-year data retention."
elements:
  - type: "person"
    name: "Doctors"
    description: "Medical professionals who access and manage electronic medical records (EMR) and patient clinical data."
  - type: "person"
    name: "Nurses"
    description: "Healthcare staff who assist with patient care, updates, and clinical data entry."
  - type: "person"
    name: "Receptionists"
    description: "Administrative staff responsible for patient registration and appointment scheduling."
  - type: "person"
    name: "Billing Officers"
    description: "Staff members who manage invoices, payments, and financial interactions."
  - type: "person"
    name: "Patients"
    description: "End users who access their records, appointments, and billing information."
  - type: "externalSystem"
    name: "External Lab/Imaging Systems"
    description: "External systems providing laboratory results and medical imaging data via HL7 FHIR."
  - type: "externalSystem"
    name: "Insurance Clearinghouses"
    description: "External systems handling insurance claims and verification."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe-like external service processing secure financial payments."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Keycloak or Azure AD handling authentication and OpenID Connect (OIDC) validation."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Twilio or AWS SES handling system notifications and alerts."
  - type: "container"
    name: "API Gateway"
    description: "Kong/NGINX for TLS termination and OIDC validation."
  - type: "container"
    name: "Core Clinical & EMR Service"
    description: "Spring Boot service handling core electronic medical records."
  - type: "container"
    name: "Scheduling & Billing Service"
    description: "Node.js service managing appointments and billing processes."
  - type: "container"
    name: "FHIR Integration Broker"
    description: "Python/FastAPI service for HL7 FHIR integration."
  - type: "container"
    name: "Notification Worker"
    description: "Go service handling asynchronous notifications."
  - type: "container"
    name: "PostgreSQL"
    description: "Primary database with active-active replication."
  - type: "container"
    name: "Redis"
    description: "In-memory cache for low-latency read operations."
  - type: "container"
    name: "Apache Kafka"
    description: "Event bus for messaging between services."
  - type: "container"
    name: "MinIO/AWS S3"
    description: "Object storage and immutable audit logs."
  - type: "component"
    name: "Patient Demographic Controller"
    description: "Manages patient demographic information within the Core EMR."
  - type: "component"
    name: "EMR Management Component"
    description: "Handles electronic medical records logic and processing."
  - type: "component"
    name: "Audit Trail Logger"
    description: "Records immutable audit trails for compliance and security."
  - type: "component"
    name: "Data Access Repository"
    description: "Manages data persistence and retrieval for the Core EMR."
relationships:
  - source: "Doctors"
    destination: "Clinic Management System"
    description: "Accesses clinical records and schedules"
    technology: "HTTPS (TLS 1.3), OpenID Connect (OIDC)"
  - source: "Nurses"
    destination: "Clinic Management System"
    description: "Views and updates patient EMR data"
    technology: "HTTPS (TLS 1.3), OpenID Connect (OIDC)"
  - source: "Receptionists"
    destination: "Clinic Management System"
    description: "Registers patients and manages schedules"
    technology: "HTTPS (TLS 1.3), OpenID Connect (OIDC)"
  - source: "Billing Officers"
    destination: "Clinic Management System"
    description: "Manages patient billing and invoices"
    technology: "HTTPS (TLS 1.3), OpenID Connect (OIDC)"
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Views personal health and billing information"
    technology: "HTTPS (TLS 1.3), OpenID Connect (OIDC)"
  - source: "Clinic Management System"
    destination: "External Lab/Imaging Systems"
    description: "Exchanges medical data and results"
    technology: "HL7 FHIR over REST/HTTPS"
  - source: "Clinic Management System"
    destination: "Insurance Clearinghouses"
    description: "Submits and processes insurance claims"
    technology: "HL7 FHIR over REST/HTTPS"
  - source: "Clinic Management System"
    destination: "Payment Gateway"
    description: "Processes secure patient payments"
    technology: "REST/HTTPS"
  - source: "Clinic Management System"
    destination: "Notification Service"
    description: "Dispatches alerts and messages to users"
    technology: "REST/HTTPS"