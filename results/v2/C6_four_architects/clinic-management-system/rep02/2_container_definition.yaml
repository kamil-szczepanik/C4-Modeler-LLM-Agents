level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Doctors"
    description: "Medical professionals who access and manage electronic medical records (EMR) and patient clinical data."
  - type: "person"
    name: "Nurses"
    description: "Healthcare staff who assist with patient care, updates, and clinical data entry."
  - type: "person"
    name: "Receptionists"
    description: "Administrative staff responsible for patient registration and appointment scheduling."
  - type: "person"
    name: "Billing Officers"
    description: "Staff members who manage invoices, payments, and financial interactions."
  - type: "person"
    name: "Patients"
    description: "End users who access their records, appointments, and billing information."
  - type: "externalSystem"
    name: "External Lab/Imaging Systems"
    description: "External systems providing laboratory results and medical imaging data via HL7 FHIR."
  - type: "externalSystem"
    name: "Insurance Clearinghouses"
    description: "External systems handling insurance claims and verification."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service processing secure financial payments."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External service handling system notifications and alerts."
  - type: "container"
    name: "API Gateway"
    technology: "Kong/Envoy"
    description: "Edge routing, mTLS, and OAuth2/MFA enforcement."
  - type: "container"
    name: "Web Application"
    technology: "React / Nginx"
    description: "High-performance client-side UI rendering."
  - type: "container"
    name: "Core Services"
    technology: "Node.js / NestJS"
    description: "Rapid development of core administrative and billing workflows."
  - type: "container"
    name: "EMR Service"
    technology: "Java / Spring Boot"
    description: "Robust enterprise transaction management and strict compliance auditing for EMR."
  - type: "container"
    name: "Integration Service"
    technology: "Apache Camel / Node.js"
    description: "Handles integration with external clinical and laboratory systems."
  - type: "container"
    name: "Async Worker Containers"
    technology: "Python/Celery or Java"
    description: "Handles asynchronous background processing and tasks."
  - type: "container"
    name: "Identity & Policy Container"
    technology: "Keycloak"
    description: "Local token validation and fine-grained RBAC."
  - type: "container"
    name: "Message Broker"
    technology: "Apache Kafka or RabbitMQ"
    description: "Asynchronous decoupling for high availability during external system outages."
  - type: "container"
    name: "Cache / State Store"
    technology: "Redis Cluster"
    description: "Active-active distributed locking for scheduling clash checks and rate-limiting."
  - type: "container"
    name: "Data Layer"
    technology: "PostgreSQL and MinIO/AWS S3"
    description: "Active-active hybrid replication and immutable object storage for 10-year retention."
relationships:
  - source: "Doctors"
    destination: "API Gateway"
    description: "HTTPS (JSON/REST)"
    technology: "HTTPS"
  - source: "Nurses"
    destination: "API Gateway"
    description: "HTTPS (JSON/REST)"
    technology: "HTTPS"
  - source: "Receptionists"
    destination: "API Gateway"
    description: "HTTPS (JSON/REST)"
    technology: "HTTPS"
  - source: "Billing Officers"
    destination: "API Gateway"
    description: "HTTPS (JSON/REST)"
    technology: "HTTPS"
  - source: "Patients"
    destination: "API Gateway"
    description: "HTTPS (JSON/REST)"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Identity & Policy Container"
    description: "OIDC/OAuth2"
    technology: "OIDC/OAuth2"
    description: "OIDC/OAuth2"
  - source: "Core Services"
    destination: "Data Layer"
    description: "TLS (TCP/JDBC)"
    technology: "TLS (TCP/JDBC)"
  - source: "EMR Service"
    destination: "Data Layer"
    description: "TLS (TCP/JDBC) and S3 API"
    technology: "TLS / HTTPS"
  - source: "Core Services"
    destination: "Message Broker"
    description: "AMQP/TLS"
    technology: "AMQP/TLS"
  - source: "EMR Service"
    destination: "Message Broker"
    description: "AMQP/TLS"
    technology: "AMQP/TLS"
  - source: "Core Services"
    destination: "Cache / State Store"
    description: "TCP/TLS (RESP)"
    technology: "TCP/TLS (RESP)"
  - source: "Integration Service"
    destination: "External Lab/Imaging Systems"
    description: "HL7 FHIR over HTTPS"
    technology: "HTTPS"
  - source: "EMR Service"
    destination: "Data Layer"
    description: "HTTPS (S3 API)"
    technology: "HTTPS"