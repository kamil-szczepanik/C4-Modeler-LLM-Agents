level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A distributed healthcare platform designed to manage patient admissions, electronic medical records, scheduling, and billing in a hybrid cloud environment."
elements:
  - type: "person"
    name: "Patient"
    description: "Web or Mobile users who access portal features, registration, and scheduling."
  - type: "person"
    name: "Clinician/Staff"
    description: "Desktop or Web users who manage clinical workflows and electronic medical records."
  - type: "person"
    name: "Billing Administrator"
    description: "Web users who manage billing and insurance claims."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Provides federated multi-factor authentication via OIDC/SAML 2.0."
  - type: "externalSystem"
    name: "Insurance Gateway"
    description: "Handles insurance claims and verifications."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "Integrates clinical lab and imaging data via HL7 FHIR."
  - type: "externalSystem"
    name: "National Health Registry"
    description: "External registry for patient and health data reporting."
  - type: "externalSystem"
    name: "External Archival Storage"
    description: "Long-term external storage for archival data."
  - type: "externalSystem"
    name: "SMS/Notification Gateway"
    description: "Sends notifications and SMS messages to users."
relationships:
  - source: "Patient"
    destination: "Clinic Management System"
    description: "Portal access, registration, and scheduling"
    technology: "HTTPS (TLS 1.3)"
  - source: "Clinician/Staff"
    destination: "Clinic Management System"
    description: "Clinical operations and workspace access"
    technology: "HTTPS (TLS 1.3)"
  - source: "Billing Administrator"
    destination: "Clinic Management System"
    description: "Billing and claims administration"
    technology: "HTTPS (TLS 1.3)"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Federated multi-factor authentication"
    technology: "OIDC/SAML 2.0"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Clinical data exchange"
    technology: "HL7 FHIR over HTTPS"
  - source: "Clinic Management System"
    destination: "Insurance Gateway"
    description: "Claims and verification processing"
    technology: "REST/JSON over HTTPS with mTLS"
  - source: "Clinic Management System"
    destination: "National Health Registry"
    description: "Health data reporting"
    technology: "REST/JSON over HTTPS with mTLS"