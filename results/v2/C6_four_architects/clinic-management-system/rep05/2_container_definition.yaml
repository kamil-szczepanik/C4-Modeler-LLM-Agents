level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patient"
    description: "Web or Mobile users who access portal features, registration, and scheduling."
  - type: "person"
    name: "Clinician/Staff"
    description: "Desktop or Web users who manage clinical workflows and electronic medical records."
  - type: "person"
    name: "Billing Administrator"
    description: "Web users who manage billing and insurance claims."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Provides federated multi-factor authentication via OIDC/SAML 2.0."
  - type: "externalSystem"
    name: "Insurance Gateway"
    description: "Handles insurance claims and verifications."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "Integrates clinical lab and imaging data via HL7 FHIR."
  - type: "externalSystem"
    name: "National Health Registry"
    description: "External registry for patient and health data reporting."
  - type: "externalSystem"
    name: "External Archival Storage"
    description: "Long-term external storage for archival data."
  - type: "externalSystem"
    name: "SMS/Notification Gateway"
    description: "Sends notifications and SMS messages to users."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx / Kong"
    description: "Container handling SSL termination, rate limiting, and JWT validation via OIDC."
  - type: "container"
    name: "Patient & Scheduling Service"
    technology: "Java / Spring Boot"
    description: "Container managing registrations and appointments."
  - type: "container"
    name: "EMR Service"
    technology: "Java / Spring Boot"
    description: "Container handling clinical notes, audit trails, and gRPC communication."
  - type: "container"
    name: "Billing Service"
    technology: "Node.js / TypeScript"
    description: "Container handling insurance claims and billing."
  - type: "container"
    name: "FHIR Interoperability Service"
    technology: "Python / FastAPI"
    description: "Container translating data to HL7 FHIR standards."
  - type: "container"
    name: "Background Worker"
    technology: "Python / Celery"
    description: "Container handling asynchronous tasks, PDF generation, and log offloading."
  - type: "container"
    name: "Keycloak Container"
    technology: "Docker / Keycloak"
    description: "Local IAM container managing RBAC tokens and local token introspection."
  - type: "container"
    name: "Observability Agent"
    technology: "Prometheus / Grafana Promtail"
    description: "Sidecar container for metrics and structured logging."
  - type: "container"
    name: "Distributed Cache"
    technology: "Redis Enterprise"
    description: "Cluster providing fast data reads."
  - type: "container"
    name: "Message Broker"
    technology: "Apache Kafka"
    description: "Cluster for asynchronous event-driven decoupling."
  - type: "container"
    name: "Primary Database"
    technology: "PostgreSQL"
    description: "Multi-master active-active cluster with AES-256 encryption."
  - type: "container"
    name: "Database Access Proxy"
    technology: "PgBouncer"
    description: "Proxy with IAM authentication for connection pooling."
  - type: "container"
    name: "Audit & Archival Store"
    technology: "AWS S3 / On-Prem Object Storage"
    description: "Storage for 10+ year immutable data retention."
  - type: "container"
    name: "Internal Service Mesh"
    technology: "Istio / Envoy"
    description: "Enforces mutual TLS (mTLS) across all containers."
relationships:
  - source: "Patient"
    destination: "API Gateway"
    description: "Access portal features, registration, and scheduling"
    technology: "HTTPS / TLS 1.3"
  - source: "Clinician/Staff"
    destination: "API Gateway"
    description: "Manage clinical workflows and electronic medical records"
    technology: "HTTPS / TLS 1.3"
  - source: "Billing Administrator"
    destination: "API Gateway"
    description: "Manage billing and insurance claims"
    technology: "HTTPS / TLS 1.3"
  - source: "API Gateway"
    destination: "Patient & Scheduling Service"
    description: "Routes registration and appointment traffic"
    technology: "Istio Service Mesh (mTLS / HTTP/2)"
  - source: "API Gateway"
    destination: "EMR Service"
    description: "Routes clinical data traffic"
    technology: "Istio Service Mesh (mTLS / HTTP/2)"
  - source: "API Gateway"
    destination: "Billing Service"
    description: "Routes billing traffic"
    technology: "Istio Service Mesh (mTLS / HTTP/2)"
  - source: "API Gateway"
    destination: "FHIR Interoperability Service"
    description: "Routes FHIR translation traffic"
    technology: "Istio Service Mesh (mTLS / HTTP/2)"
  - source: "API Gateway"
    destination: "Keycloak Container"
    description: "Token validation and IAM requests"
    technology: "HTTPS / OIDC"
  - source: "Patient & Scheduling Service"
    destination: "Message Broker"
    description: "Publishes asynchronous events"
    technology: "SASL/SCRAM over TLS"
  - source: "EMR Service"
    destination: "Message Broker"
    description: "Publishes asynchronous events"
    technology: "SASL/SCRAM over TLS"
  - source: "Billing Service"
    destination: "Message Broker"
    description: "Publishes asynchronous events"
    technology: "SASL/SCRAM over TLS"
  - source: "FHIR Interoperability Service"
    destination: "Message Broker"
    description: "Publishes asynchronous events"
    technology: "SASL/SCRAM over TLS"
  - source: "Patient & Scheduling Service"
    destination: "Distributed Cache"
    description: "Queries data for fast reads"
    technology: "TCP"
  - source: "EMR Service"
    destination: "Distributed Cache"
    description: "Queries data for fast reads"
    technology: "TCP"
  - source: "Billing Service"
    destination: "Distributed Cache"
    description: "Queries data for fast reads"
    technology: "TCP"
  - source: "Patient & Scheduling Service"
    destination: "Database Access Proxy"
    description: "Queries data via connection pooling"
    technology: "TCP"
  - source: "EMR Service"
    destination: "Database Access Proxy"
    description: "Queries data via connection pooling"
    technology: "TCP"
  - source: "Billing Service"
    destination: "Database Access Proxy"
    description: "Queries data via connection pooling"
    technology: "TCP"
  - source: "Database Access Proxy"
    destination: "Primary Database"
    description: "Connects to database cluster"
    technology: "TLS 1.3"
  - source: "Background Worker"
    destination: "Message Broker"
    description: "Consumes asynchronous events"
    technology: "SASL/SCRAM over TLS"
  - source: "Background Worker"
    destination: "Audit & Archival Store"
    description: "Writes cold audit data"
    technology: "HTTPS"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Federated multi-factor authentication"
    technology: "OIDC/SAML 2.0"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Clinical data exchange"
    technology: "HL7 FHIR over HTTPS"
  - source: "Clinic Management System"
    destination: "Insurance Gateway"
    description: "Claims and verification processing"
    technology: "REST/JSON over HTTPS with mTLS"
  - source: "Clinic Management System"
    destination: "National Health Registry"
    description: "Health data reporting"
    technology: "REST/JSON over HTTPS with mTLS"