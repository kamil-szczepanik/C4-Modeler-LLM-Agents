level: component
scope: "Component diagram for the Internal Service Mesh container"
parentContainer:
  name: "Internal Service Mesh"
elements:
  - type: "component"
    name: "Control Plane (istiod)"
    technology: "Go, xDS APIs over gRPC"
    description: "Manages and configures the proxy instances, pushing policies via xDS APIs and handling authorization."
  - type: "component"
    name: "Data Plane Sidecars (Envoy Proxy)"
    technology: "Envoy Proxy, mTLS, gRPC/HTTP2"
    description: "Proxies running alongside microservices to handle secure, reliable, and observable communication."
  - type: "component"
    name: "Telemetry & Policy Enforcer (Telemetry v2)"
    technology: "Prometheus, OTLP/gRPC"
    description: "Enforces policies and streams low-latency telemetry metrics for compliance and audit logging."
  - type: "component"
    name: "Ingress/Egress Gateway Proxies"
    technology: "Envoy Gateway, HTTPS/gRPC"
    description: "Manages incoming and outgoing traffic crossing the service mesh boundary."
  - type: "component"
    name: "Authorization Policy Controller"
    technology: "Embedded in istiod"
    description: "Enforces zero-trust boundaries and regulatory compliance access policies."
  - type: "component"
    name: "East-West Gateways"
    technology: "mTLS over gRPC"
    description: "Synchronizes communication and secures traffic across hybrid Kubernetes clusters."
relationships:
  - source: "Data Plane Sidecars (Envoy Proxy)"
    destination: "Data Plane Sidecars (Envoy Proxy)"
    description: "Communicate via mTLS over gRPC/HTTP2 for AES-256 encryption in transit."
  - source: "Control Plane (istiod)"
    destination: "Data Plane Sidecars (Envoy Proxy)"
    description: "Pushes policies via xDS APIs over gRPC."
  - source: "Data Plane Sidecars (Envoy Proxy)"
    destination: "Telemetry & Policy Enforcer (Telemetry v2)"
    description: "Stream metrics to Prometheus via OTLP/gRPC."
  - source: "Ingress/Egress Gateway Proxies"
    destination: "Data Plane Sidecars (Envoy Proxy)"
    description: "Routes external traffic via HTTPS/gRPC through Ingress Gateways."
  - source: "East-West Gateways"
    destination: "East-West Gateways"
    description: "Synchronizes hybrid clusters using mTLS over gRPC."