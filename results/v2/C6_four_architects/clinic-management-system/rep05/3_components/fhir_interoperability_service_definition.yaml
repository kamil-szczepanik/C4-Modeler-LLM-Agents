level: component
scope: "Component diagram for the FHIR Interoperability Service container"
parentContainer:
  name: "FHIR Interoperability Service"
elements:
  - type: "component"
    name: "FHIR API Controller"
    technology: "FastAPI Router, Python"
    description: "Handles incoming HTTP/REST requests and enforces JWT-based authorization scopes."
  - type: "component"
    name: "Resource Transformer Engine"
    technology: "Python, fhir.resources Library"
    description: "Maps internal domain models to/from standard HL7 FHIR JSON resources."
  - type: "component"
    name: "Terminology Mapper"
    technology: "Python, Redis Enterprise"
    description: "Translates local clinic codes to LOINC and SNOMED-CT reference tables."
  - type: "component"
    name: "Data Sync Outbox Client & Resilience Manager"
    technology: "Python, SQLite with WAL, Apache Kafka"
    description: "Interfaces with Apache Kafka and uses SQLite/WAL for at-least-once delivery."
  - type: "component"
    name: "External System Connector"
    technology: "Python, HTTP/2, mTLS"
    description: "Manages outbound HTTP/2 client calls to external systems using mTLS."
  - type: "component"
    name: "Audit & Compliance Interceptor"
    technology: "Python"
    description: "Captures requests, hashes PHI, and emits immutable audit events."
  - type: "component"
    name: "Distributed Cache"
    technology: "Redis Enterprise"
    description: "Provides low-latency caching for terminology mappings."
  - type: "component"
    name: "External Lab & Imaging Systems"
    technology: "REST over HTTPS via mTLS"
    description: "External clinical systems receiving REST calls."
  - type: "component"
    name: "Message Broker"
    technology: "Apache Kafka"
    description: "Manages reliable, asynchronous event distribution."
relationships:
  - source: "FHIR API Controller"
    destination: "Resource Transformer Engine"
    description: "Direct async/await method calls"
  - source: "Resource Transformer Engine"
    destination: "Terminology Mapper"
    description: "Direct method calls with Distributed Cache (Redis) lookup"
  - source: "External System Connector"
    destination: "External Lab & Imaging Systems"
    description: "REST over HTTPS via mTLS"
  - source: "Data Sync Outbox Client & Resilience Manager"
    destination: "Message Broker"
    description: "Publishes asynchronous events via SASL/SCRAM over TLS"