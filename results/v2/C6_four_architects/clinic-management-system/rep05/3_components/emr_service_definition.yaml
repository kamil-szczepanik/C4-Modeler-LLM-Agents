level: component
scope: "Component diagram for the EMR Service container"
parentContainer:
  name: "EMR Service"
elements:
  - type: "component"
    name: "EMR API Controller"
    technology: "Spring MVC"
    description: "Exposes REST/gRPC endpoints and routes requests."
  - type: "component"
    name: "Clinical Record Manager"
    technology: "Spring Service"
    description: "Core business logic for clinical notes and treatments."
  - type: "component"
    name: "Audit Trail Logger"
    technology: "Spring AOP / Aspect"
    description: "Intercepts operations for tamper-evident logs."
  - type: "component"
    name: "Encryption Interceptor"
    technology: "Hibernate / JPA Attribute Converter"
    description: "Enforces AES-256 field-level encryption for PHI."
  - type: "component"
    name: "EMR Cache Manager"
    technology: "Spring Data Redis"
    description: "Manages hot patient records in cache."
  - type: "component"
    name: "Cache Encryption Utility"
    technology: "Java"
    description: "Encrypts and decrypts cached PHI."
  - type: "component"
    name: "FHIR Transformer Component"
    technology: "HAPI FHIR Library"
    description: "Maps internal clinical models to HL7 FHIR standards."
  - type: "component"
    name: "Circuit Breaker & Fallback Manager"
    technology: "Resilience4j"
    description: "Provides fault tolerance for database and broker calls."
  - type: "component"
    name: "Async Event Publisher"
    technology: "Spring Application Events / Kafka Template"
    description: "Decouples domain actions from event dispatching."
  - type: "component"
    name: "Database Access Proxy"
    technology: "Proxy"
    description: "Executes database queries."
  - type: "component"
    name: "Message Broker"
    technology: "Messaging Infrastructure"
    description: "Publishes asynchronous events."
relationships:
  - source: "EMR API Controller"
    destination: "FHIR Transformer Component"
    description: "Converts inbound/outbound payloads"
  - source: "Clinical Record Manager"
    destination: "Encryption Interceptor"
    description: "Secures PHI payload"
  - source: "Clinical Record Manager"
    destination: "EMR Cache Manager"
    description: "Reads/writes hot clinical records"
  - source: "EMR Cache Manager"
    destination: "Cache Encryption Utility"
    description: "Encrypts/decrypts cached PHI"
  - source: "Clinical Record Manager"
    destination: "Circuit Breaker & Fallback Manager"
    description: "Invokes guarded persistence"
  - source: "Circuit Breaker & Fallback Manager"
    destination: "Database Access Proxy"
    description: "Executes queries"
  - source: "Clinical Record Manager"
    destination: "Async Event Publisher"
    description: "Dispatches domain events"
  - source: "Async Event Publisher"
    destination: "Message Broker"
    description: "Publishes asynchronous events"