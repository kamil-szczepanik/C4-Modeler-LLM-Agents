level: component
scope: "Component diagram for the Distributed Cache container"
parentContainer:
  name: "Distributed Cache"
elements:
  - type: "component"
    name: "Redis Proxy"
    technology: "Envoy / Redis Cluster Proxy"
    description: "Handles incoming requests from patient, EMR, and billing services using RESP protocol over TCP."
  - type: "component"
    name: "In-Memory Data Nodes"
    technology: "Redis Core"
    description: "Provides distributed, low-latency caching for sub-second EMR performance."
  - type: "component"
    name: "Persistence Engine"
    technology: "AOF/RDB"
    description: "Ensures data persistence and durability for the cache."
  - type: "component"
    name: "Data Encryption & Tokenization Component"
    technology: "AES-256"
    description: "Enforces data encryption at rest for HIPAA and GDPR compliance via internal memory hooks."
  - type: "component"
    name: "Cluster Management & Replication Daemon"
    technology: "TLS/TCP"
    description: "Manages cluster topology, replication, and high availability across nodes."
  - type: "component"
    name: "Cache Invalidation & TTL Manager"
    technology: "Apache Kafka Protocol / TCP"
    description: "Enables event-driven cache invalidation to prevent stale PHI reads."
  - type: "component"
    name: "Telemetry & Metrics Exporter"
    technology: "Prometheus / HTTP"
    description: "Scrapes cluster health and replication metrics for high availability monitoring."
relationships:
  - source: "Patient, EMR, and Billing Services"
    destination: "Redis Proxy"
    description: "RESP protocol over TCP"
  - source: "Redis Proxy"
    destination: "In-Memory Data Nodes"
    description: "Redis Cluster Bus"
  - source: "In-Memory Data Nodes"
    destination: "Redis Proxy"
    description: "Redis Cluster Bus"
  - source: "In-Memory Data Nodes"
    destination: "Data Encryption & Tokenization Component"
    description: "Internal Memory Hooks"
  - source: "In-Memory Data Nodes"
    destination: "Cluster Management & Replication Daemon"
    description: "TLS/TCP"
  - source: "Cluster Management & Replication Daemon"
    destination: "In-Memory Data Nodes"
    description: "TLS/TCP"
  - source: "Message Broker (Apache Kafka)"
    destination: "Cache Invalidation & TTL Manager"
    description: "Kafka Protocol/TCP"
  - source: "Telemetry & Metrics Exporter"
    destination: "Observability Agent"
    description: "HTTP/Prometheus"