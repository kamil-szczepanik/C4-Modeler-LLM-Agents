# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "TLS Termination & Routing Engine"
    technology: "Nginx / Kong"
    description: "Terminates TLS connections and routes incoming traffic to core microservices."
  - type: "component"
    name: "Authentication & Authorization Plugin"
    technology: "Kong OIDC"
    description: "Validates JWT tokens and manages IAM requests against Keycloak."
  - type: "component"
    name: "Rate Limiting Component"
    technology: "Redis Enterprise"
    description: "Enforces rate limits using distributed counters."
  - type: "component"
    name: "Request Audit & Logging Interceptor"
    technology: "Custom Interceptor / Fluent Bit"
    description: "Captures and offloads audit events and access logs for compliance."
  - type: "component"
    name: "WAF & Threat Protection Engine"
    technology: "Coraza WAF"
    description: "Provides edge security and threat protection against web vulnerabilities."
  - type: "component"
    name: "Request Transformation & Sanitization Component"
    technology: "Kong Plugin"
    description: "Sanitizes and transforms incoming requests before routing to backend services."
  - type: "component"
    name: "Health Check & Circuit Breaker Engine"
    technology: "Kong Health Check Plugin"
    description: "Monitors downstream service health and implements circuit breaker patterns."
relationships:
  - source: "TLS Termination & Routing Engine"
    destination: "Authentication & Authorization Plugin"
    description: "Delegates request authentication [OIDC / HTTPS]"
  - source: "Authentication & Authorization Plugin"
    destination: "Rate Limiting Component"
    description: "Queries token caching and rate limit counters [RESP / TCP]"
  - source: "TLS Termination & Routing Engine"
    destination: "WAF & Threat Protection Engine"
    description: "Inspects incoming requests for threats"
  - source: "TLS Termination & Routing Engine"
    destination: "Request Transformation & Sanitization Component"
    description: "Sanitizes payloads"
  - source: "Request Transformation & Sanitization Component"
    destination: "Health Check & Circuit Breaker Engine"
    description: "Validates downstream availability"
  - source: "Request Audit & Logging Interceptor"
    destination: "Message Broker (Apache Kafka)"
    description: "Offloads audit events [Kafka Protocol / TCP]"