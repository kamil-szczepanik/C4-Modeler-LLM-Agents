level: component
scope: "Component diagram for the Background Worker container"
parentContainer:
  name: "Background Worker"
elements:
  - type: "component"
    name: "Task Dispatcher / Consumer"
    technology: "Python / Celery"
    description: "Manages stateless asynchronous task execution and worker distribution."
  - type: "component"
    name: "Document Generator"
    technology: "Python / ReportLab"
    description: "Handles CPU-bound PDF generation for medical reports and invoices."
  - type: "component"
    name: "Audit Offloader"
    technology: "Python / boto3"
    description: "Offloads audit data to secure object storage."
  - type: "component"
    name: "Data Purger / Retention Manager"
    technology: "Python"
    description: "Manages long-term data retention and compliance purges."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Python"
    description: "Dispatches notifications and SMS alerts via external gateways."
  - type: "component"
    name: "FHIR Sync Worker"
    technology: "Python / Celery"
    description: "Synchronizes health data with the FHIR Interoperability Service."
  - type: "component"
    name: "Worker Health & Metrics Agent"
    technology: "Python / Prometheus client"
    description: "Exposes real-time worker metrics for observability."
relationships:
  - source: "Task Dispatcher / Consumer"
    destination: "Message Broker"
    description: "Consumes messages [SASL/SCRAM over TLS]"
  - source: "Task Dispatcher / Consumer"
    destination: "Primary Database"
    description: "Queries data [SQL over TLS]"
  - source: "Task Dispatcher / Consumer"
    destination: "Notification Dispatcher"
    description: "Dispatches tasks [In-process / Celery Task]"
  - source: "Task Dispatcher / Consumer"
    destination: "FHIR Sync Worker"
    description: "Dispatches tasks [In-process / Celery Task]"
  - source: "Document Generator"
    destination: "Audit & Archival Store"
    description: "Stores documents [HTTPS]"
  - source: "Audit Offloader"
    destination: "Primary Database"
    description: "Reads audit logs [SQL over TLS]"
  - source: "Audit Offloader"
    destination: "Audit & Archival Store"
    description: "Offloads logs [HTTPS]"
  - source: "Notification Dispatcher"
    destination: "SMS/Notification Gateway"
    description: "Sends notifications [HTTPS]"
  - source: "FHIR Sync Worker"
    destination: "FHIR Interoperability Service"
    description: "Syncs resources [gRPC / TLS]"
  - source: "Worker Health & Metrics Agent"
    destination: "Observability Agent"
    description: "Exposes metrics [HTTP / Prometheus Scraping]"