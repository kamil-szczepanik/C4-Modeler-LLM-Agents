level: component
scope: "Component diagram for the Billing Service container"
parentContainer:
  name: "Billing Service"
elements:
  - type: "component"
    name: "Invoice Controller"
    technology: "Express.js / TypeScript"
    description: "Web framework for handling HTTP routing in the Invoice Controller."
  - type: "component"
    name: "Claims Processor"
    technology: "TypeScript Business Logic Engine"
    description: "Processes insurance claims and manages external submissions."
  - type: "component"
    name: "Circuit Breaker Middleware"
    technology: "Opossum / TypeScript"
    description: "Provides resilience and fault tolerance for external insurance gateway calls."
  - type: "component"
    name: "Insurance Gateway Client"
    technology: "Axios / HTTPS over TLS 1.3"
    description: "Submits claims securely to external insurance gateways."
  - type: "component"
    name: "Billing Data Repository"
    technology: "TypeORM / TCP via PgBouncer"
    description: "Object-Relational Mapper for structured data access via PgBouncer."
  - type: "component"
    name: "Billing Audit Logger"
    technology: "TypeScript Event-Driven / TCP"
    description: "Dedicated audit logging for compliance and tracking."
  - type: "component"
    name: "Payment Reconciliation Worker"
    technology: "Node.js Worker Threads / Kafka Consumer"
    description: "Consumes payment events and handles payment reconciliation asynchronously."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx / Kong"
    description: "Routes billing traffic into the system."
  - type: "container"
    name: "Message Broker"
    technology: "Apache Kafka"
    description: "Event broker for reliable asynchronous messaging."
  - type: "container"
    name: "Primary Database"
    technology: "PostgreSQL"
    description: "Relational storage meeting ACID and retention requirements."
relationships:
  - source: "API Gateway"
    destination: "Invoice Controller"
    description: "Routes billing traffic [Istio Service Mesh (mTLS / HTTP/2)]"
  - source: "Claims Processor"
    destination: "Circuit Breaker Middleware"
    description: "Invokes external submission [TypeScript]"
  - source: "Circuit Breaker Middleware"
    destination: "Insurance Gateway Client"
    description: "Submits claims [HTTPS / TLS 1.3]"
  - source: "Claims Processor"
    destination: "Message Broker"
    description: "Publishes domain events [SASL/SCRAM over TLS]"
  - source: "Message Broker"
    destination: "Payment Reconciliation Worker"
    description: "Consumes payment events [SASL/SCRAM over TLS]"
  - source: "Invoice Controller"
    destination: "Billing Data Repository"
    description: "Queries and persists data [TCP]"
  - source: "Claims Processor"
    destination: "Billing Data Repository"
    description: "Queries and persists data [TCP]"
  - source: "Payment Reconciliation Worker"
    destination: "Billing Data Repository"
    description: "Queries and persists data [TCP]"