level: component
scope: "Component diagram for the Database Access Proxy container"
parentContainer:
  name: "Database Access Proxy"
elements:
  - type: "component"
    name: "Connection Manager Component"
    technology: "C-based routing engine, PgBouncer container"
    description: "Forwards pooled queries to the primary database."
  - type: "component"
    name: "IAM Auth Interceptor Component"
    technology: "Dynamic OAuth2/IAM translation"
    description: "Validates authentication tokens against the Keycloak Container."
  - type: "component"
    name: "Health & Metrics Prober Component"
    technology: "Prometheus-compatible monitoring"
    description: "Exposes health check endpoints via Istio/Envoy."
  - type: "component"
    name: "Audit Logging Interceptor Component"
    technology: "Metadata-only event logger"
    description: "Ships audit metadata to the observability agent."
relationships:
  - source: "Application Tier Services"
    destination: "Connection Manager Component"
    description: "Queries data via connection pooling [TCP / TLS 1.3]"
  - source: "IAM Auth Interceptor Component"
    destination: "Keycloak Container"
    description: "Validates authentication tokens [HTTPS]"
  - source: "Health & Metrics Prober Component"
    destination: "Istio/Envoy"
    description: "Exposes health check endpoints [TCP/HTTP]"
  - source: "Connection Manager Component"
    destination: "Primary Database"
    description: "Forwards pooled queries [PostgreSQL Wire Protocol over TLS 1.3]"
  - source: "Audit Logging Interceptor Component"
    destination: "Observability Agent"
    description: "Ships audit metadata [gRPC]"