level: component
scope: "Component diagram for the Primary Database container"
parentContainer:
  name: "Primary Database"
elements:
  - type: "component"
    name: "PostgreSQL Database Engine"
    technology: "PostgreSQL 16, AES-256"
    description: "Core relational engine providing ACID transactions and AES-256 transparent data encryption at rest."
  - type: "component"
    name: "Streaming Replication & Consensus Manager"
    technology: "PostgreSQL Replication"
    description: "Manages streaming replication and consensus for high availability across hybrid cloud environments."
  - type: "component"
    name: "Row-Level Security (RLS) Policy Enforcer"
    technology: "PostgreSQL RLS"
    description: "Enforces strict row-level security and compliance policies for HIPAA and GDPR."
  - type: "component"
    name: "Logical Replication & Audit Streamer"
    technology: "PostgreSQL Logical Replication, Internal TCP / TLS"
    description: "Streams change data capture and audit events to the message broker."
  - type: "component"
    name: "Schema Migration & Versioning Manager"
    technology: "Migration Tool, TLS 1.3"
    description: "Manages database schema migrations and versioning securely."
  - type: "component"
    name: "Backup & Point-in-Time Recovery (PITR) Agent"
    technology: "PITR Agent, HTTPS / TLS 1.3"
    description: "Handles automated backups and point-in-time recovery to the archival store."
relationships:
  - source: "Database Access Proxy"
    destination: "PostgreSQL Database Engine"
    description: "TLS 1.3"
  - source: "PostgreSQL Database Engine"
    destination: "Streaming Replication & Consensus Manager"
    description: "mTLS"
  - source: "PostgreSQL Database Engine"
    destination: "Logical Replication & Audit Streamer"
    description: "Internal TCP / TLS"
  - source: "Logical Replication & Audit Streamer"
    destination: "Message Broker (Apache Kafka)"
    description: "TLS / TCP"
  - source: "Schema Migration & Versioning Manager"
    destination: "PostgreSQL Database Engine"
    description: "TLS 1.3"
  - source: "Backup & PITR Agent"
    destination: "Audit & Archival Store"
    description: "HTTPS / TLS 1.3"
  - source: "CI/CD Pipeline"
    destination: "Schema Migration & Versioning Manager"
    description: "Secure API / SSH"