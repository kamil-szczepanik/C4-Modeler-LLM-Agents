level: component
scope: "Component diagram for the Observability Agent container"
parentContainer:
  name: "Observability Agent"
elements:
  - type: "component"
    name: "Prometheus Metrics Scraper"
    technology: "Prometheus"
    description: "Collects system and service metrics from the application containers."
  - type: "component"
    name: "Log Collector"
    technology: "Grafana Promtail"
    description: "Aggregates container logs and forwards them to the central observability cluster."
  - type: "component"
    name: "Distributed Tracer"
    technology: "OpenTelemetry Collector"
    description: "Captures and exports distributed traces across microservices via gRPC over TLS."
relationships:
  - source: "Prometheus Metrics Scraper"
    destination: "Log Collector"
    description: "Coordinates telemetry pipeline"
  - source: "Distributed Tracer"
    destination: "Prometheus Metrics Scraper"
    description: "Shares tracing context"