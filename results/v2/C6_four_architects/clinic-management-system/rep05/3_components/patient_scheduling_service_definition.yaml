level: component
scope: "Component diagram for the Patient & Scheduling Service container"
parentContainer:
  name: "Patient & Scheduling Service"
elements:
  - type: "component"
    name: "Patient Controller"
    technology: "Java / Spring MVC"
    description: "Manages patient admissions and requests, triggering audit events via AOP."
  - type: "component"
    name: "Scheduling Controller"
    technology: "Java / Spring MVC"
    description: "Handles scheduling requests and interactions, triggering audit events via AOP."
  - type: "component"
    name: "Appointment Engine"
    technology: "Java / Core Domain Component"
    description: "Core business logic component for appointment management, checking slot locks and querying availability."
  - type: "component"
    name: "Data Access Repository"
    technology: "Spring Data JPA"
    description: "Manages database operations and queries for availability with ACID compliance."
  - type: "component"
    name: "Event Publisher"
    technology: "Spring Kafka Template"
    description: "Dispatches domain events to the message broker and commits events to transaction boundaries."
  - type: "component"
    name: "Scheduling Cache Manager"
    technology: "Spring Data Redis"
    description: "Manages ephemeral availability locks and slot lock status."
  - type: "component"
    name: "Audit Interceptor"
    technology: "Spring AOP"
    description: "Intersects controller operations to trigger audit events."
  - type: "component"
    name: "Outbox Event Handler"
    technology: "Transactional Outbox Pattern"
    description: "Handles events to guarantee data integrity across transaction boundaries."
  - type: "component"
    name: "FHIR Translation Adapter"
    technology: "HL7 FHIR Mapper"
    description: "Dispatches standardized FHIR resources to the event publisher."
  - type: "container"
    name: "Distributed Cache"
    technology: "Redis Enterprise"
    description: "Distributed cache for fast pre-checks and locking."
  - type: "container"
    name: "Message Broker"
    technology: "Apache Kafka"
    description: "Message broker for reliable asynchronous event streaming."
relationships:
  - source: "Patient Controller"
    destination: "Audit Interceptor"
    description: "Triggers audit events [In-Process / AOP]"
  - source: "Scheduling Controller"
    destination: "Audit Interceptor"
    description: "Triggers audit events [In-Process / AOP]"
  - source: "Appointment Engine"
    destination: "Scheduling Cache Manager"
    description: "Checks slot lock status [In-Process]"
  - source: "Scheduling Cache Manager"
    destination: "Distributed Cache"
    description: "Reads/writes ephemeral availability locks [TCP]"
  - source: "Appointment Engine"
    destination: "Data Access Repository"
    description: "Queries availability [In-Process]"
  - source: "Event Publisher"
    destination: "Outbox Event Handler"
    description: "Commits events to transaction boundary [In-Process]"
  - source: "Event Publisher"
    destination: "Message Broker"
    description: "Dispatches domain events [SASL/SCRAM over TLS]"
  - source: "FHIR Translation Adapter"
    destination: "Event Publisher"
    description: "Dispatches standardized FHIR resources [In-Process]"