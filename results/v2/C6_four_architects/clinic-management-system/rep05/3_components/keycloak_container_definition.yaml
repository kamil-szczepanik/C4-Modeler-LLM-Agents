level: component
scope: "Component diagram for the Keycloak Container container"
parentContainer:
  name: "Keycloak Container"
elements:
  - type: "component"
    name: "Authentication SPI"
    technology: "Java / Keycloak SPI"
    description: "Handles user authentication and credential verification."
  - type: "component"
    name: "User Federation Provider"
    technology: "Java / Keycloak SPI"
    description: "Connects to external user stores and directories."
  - type: "component"
    name: "Token Service"
    technology: "Java / Quarkus"
    description: "Issues, validates, and manages OAuth2/OIDC tokens."
  - type: "component"
    name: "Session Cache Manager"
    technology: "Infinispan"
    description: "Manages and synchronizes active user sessions across nodes."
  - type: "component"
    name: "Admin REST API / Theme Engine"
    technology: "Java / Quarkus"
    description: "Provides administration endpoints and login UI templates."
  - type: "component"
    name: "Audit Event SPI"
    technology: "Java / Keycloak SPI"
    description: "Captures and exports security audit events."
  - type: "component"
    name: "Identity Brokering & Federation Engine"
    technology: "Java / Keycloak"
    description: "Enables single sign-on and integration with external identity providers."
relationships:
  - source: "Authentication SPI"
    destination: "Primary Database"
    description: "Persists credentials and config [JDBC / TLS via PgBouncer]"
  - source: "Token Service"
    destination: "Primary Database"
    description: "Persists credentials and config [JDBC / TLS via PgBouncer]"
  - source: "Session Cache Manager"
    destination: "Session Cache Manager (Remote)"
    description: "Synchronizes user sessions [Infinispan / TCP]"
  - source: "Audit Event SPI"
    destination: "Observability Agent"
    description: "Exports security logs [Syslog / HTTPS]"