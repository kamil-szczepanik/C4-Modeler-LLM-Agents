level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Event Ingestion & Routing Engine"
    technology: "Apache Kafka brokers"
    description: "Handles high-throughput client connections and partition leader balancing."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry"
    description: "Enforces strict Avro/Protobuf schema evolution and validation."
  - type: "component"
    name: "Cluster Controller (KRaft)"
    technology: "KRaft"
    description: "ZooKeeper-free metadata manager reducing operational complexity."
  - type: "component"
    name: "Event Mirroring & Replication Agent"
    technology: "Kafka MirrorMaker 2"
    description: "Manages cross-datacenter replication between on-prem-k8s and eu-central-1."
  - type: "component"
    name: "Stream Processing & State Store"
    technology: "Apache Kafka Streams with local RocksDB"
    description: "Executes real-time appointment scheduling resource clash checks."
  - type: "component"
    name: "Broker Security & Authorization Manager"
    technology: "Apache Ranger / Kafka ACLs"
    description: "Integrated with Keycloak for topic-level access control and HIPAA compliance."
relationships:
  - source: "Services (Patient, EMR, Billing, FHIR)"
    destination: "Schema Registry"
    description: "Validates event schemas [HTTPS/REST]"
  - source: "Services"
    destination: "Event Ingestion Engine"
    description: "Publishes and consumes encrypted domain events [SASL/SCRAM over TLS, TCP/9094]"
  - source: "Event Ingestion Engine"
    destination: "Event Mirroring Agent"
    description: "Replicates encrypted topics across hybrid boundaries [TLS, TCP/9094]"
  - source: "Event Ingestion Engine"
    destination: "Audit & Archival Store"
    description: "Streams long-term event logs for 10-year retention [Kafka Connect / HTTPS]"
  - source: "Event Ingestion Engine"
    destination: "Stream Processing"
    description: "Processes event streams [In-memory / Local RocksDB]"
  - source: "Stream Processing"
    destination: "Distributed Cache"
    description: "Synchronizes materialized views [Redis Protocol over TLS]"
  - source: "Keycloak Container"
    destination: "Security Manager"
    description: "Synchronizes OAuth2/OIDC tokens for authorization [HTTPS/REST]"