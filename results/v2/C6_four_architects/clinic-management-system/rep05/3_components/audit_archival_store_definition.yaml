level: component
scope: "Component diagram for the Audit & Archival Store container"
parentContainer:
  name: "Audit & Archival Store"
elements:
  - type: "component"
    name: "Ingestion API Gateway"
    technology: "Java/Spring Boot"
    description: "Accepts cold audit data writes from the background worker."
  - type: "component"
    name: "Encryption & Hashing Engine"
    technology: "Java/Spring Boot"
    description: "Passes logs for encryption and hashing."
  - type: "component"
    name: "Tiering & Lifecycle Manager"
    technology: "Python/FastAPI"
    description: "Applies lifecycle rules to stored archival data."
  - type: "component"
    name: "Compliance Query Interface"
    technology: "Node.js/TypeScript"
    description: "Provides compliance query endpoints and delegates exports."
  - type: "component"
    name: "Integrity Verifier"
    technology: "Python/FastAPI"
    description: "Validates checksums and ensures audit data integrity."
  - type: "component"
    name: "Audit Export & Redaction Service"
    technology: "Python/FastAPI"
    description: "Retrieves archival subsets and performs redaction for exports."
relationships:
  - source: "Ingestion API Gateway"
    destination: "Encryption & Hashing Engine"
    description: "Passes logs for encryption via In-memory / Internal IPC"
  - source: "Encryption & Hashing Engine"
    destination: "Tiering & Lifecycle Manager"
    description: "Persists immutable objects via HTTPS / S3 API"
  - source: "Tiering & Lifecycle Manager"
    destination: "Compliance Query Interface"
    description: "Applies lifecycle rules via S3 Lifecycle API"
  - source: "Integrity Verifier"
    destination: "Audit Export & Redaction Service"
    description: "Validates checksums via HTTPS / S3 API"
  - source: "Compliance Query Interface"
    destination: "Audit Export & Redaction Service"
    description: "Delegates exports via Internal gRPC"
  - source: "Audit Export & Redaction Service"
    destination: "Ingestion API Gateway"
    description: "Retrieves archival subsets via HTTPS / S3 API"