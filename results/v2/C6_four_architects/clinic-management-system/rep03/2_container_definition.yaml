level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients interacting with the clinic for scheduling and accessing their records."
  - type: "person"
    name: "Doctors"
    description: "Medical professionals managing patient EMR and diagnoses."
  - type: "person"
    name: "Administrators"
    description: "Clinic staff managing admissions, scheduling, and overall system administration."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Handles authentication via OIDC/SAML."
  - type: "externalSystem"
    name: "Third-Party Billing Gateway"
    description: "Processes clinic billing transactions."
  - type: "externalSystem"
    name: "External Lab/Imaging Systems"
    description: "External systems communicating via HL7 FHIR."
  - type: "externalSystem"
    name: "Notification Gateway"
    description: "Sends notifications to users."
  - type: "externalSystem"
    name: "Cloud Backup Archive"
    description: "Stores long-term data retention and backups using S3/HTTPS with AES-256."
  - type: "container"
    name: "Web Frontend"
    technology: "React / TypeScript / NGINX"
    description: "User interface for patients, doctors, and administrators."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / NGINX"
    description: "Handles TLS termination and OAuth2/OIDC token validation."
  - type: "container"
    name: "Core Microservices"
    technology: "Go / Spring Boot"
    description: "Handles domain business logic for patient admissions, EMR, scheduling, and billing."
  - type: "container"
    name: "Background Worker"
    technology: "Go / Celery"
    description: "Executes asynchronous background tasks."
  - type: "container"
    name: "Integration Service"
    technology: "Apache Camel / Node.js"
    description: "Integrates with external lab and imaging systems using HL7 FHIR."
  - type: "container"
    name: "Message Broker"
    technology: "Apache Kafka / RabbitMQ"
    description: "Active-active cluster for asynchronous events."
  - type: "container"
    name: "PostgreSQL"
    technology: "PostgreSQL with AES-256"
    description: "Relational database for EMR and scheduling data."
  - type: "container"
    name: "Object Storage"
    technology: "MinIO / S3"
    description: "Stores medical imaging data."
  - type: "container"
    name: "Caching & Session Container"
    technology: "Redis Enterprise"
    description: "Provides sub-second EMR performance and session management in active-active mode."
  - type: "container"
    name: "Audit & Compliance Logging"
    technology: "FluentBit / OpenSearch"
    description: "Collects audit logs to ensure compliance mandates."
  - type: "container"
    name: "Backup & Archive Manager"
    technology: "Velero / AWS Backup"
    description: "Manages backups and 10-year data retention."
relationships:
  - source: "Patients"
    destination: "Web Frontend"
    description: "Accesses portal via HTTPS"
    technology: "HTTPS"
  - source: "Doctors"
    destination: "Web Frontend"
    description: "Accesses portal via HTTPS"
    technology: "HTTPS"
  - source: "Administrators"
    destination: "Web Frontend"
    description: "Accesses portal via HTTPS"
    technology: "HTTPS"
  - source: "Web Frontend"
    destination: "API Gateway"
    description: "Sends requests to the backend"
    technology: "HTTPS / JSON"
  - source: "API Gateway"
    destination: "Core Microservices"
    description: "Routes validated requests to core services"
    technology: "gRPC / Internal mTLS"
  - source: "Core Microservices"
    destination: "PostgreSQL"
    description: "Reads and writes relational data"
    technology: "TLS"
  - source: "Core Microservices"
    destination: "Caching & Session Container"
    description: "Caches session and EMR data"
    technology: "Redis Protocol / TLS"
  - source: "Core Microservices"
    destination: "Message Broker"
    description: "Publishes asynchronous events"
    technology: "AMQP / TLS"
  - source: "Message Broker"
    destination: "Background Worker"
    description: "Consumes asynchronous events for background processing"
    technology: "AMQP / TLS"
  - source: "Integration Service"
    destination: "External Lab/Imaging Systems"
    description: "Exchanges lab and imaging data"
    technology: "HL7 FHIR over HTTPS"
  - source: "Web Frontend"
    destination: "Audit & Compliance Logging"
    description: "Sends audit logs"
    technology: "Syslog / gRPC"
  - source: "API Gateway"
    destination: "Audit & Compliance Logging"
    description: "Sends audit logs"
    technology: "Syslog / gRPC"
  - source: "Core Microservices"
    destination: "Audit & Compliance Logging"
    description: "Sends audit logs"
    technology: "Syslog / gRPC"
  - source: "Background Worker"
    destination: "Audit & Compliance Logging"
    description: "Sends audit logs"
    technology: "Syslog / gRPC"
  - source: "Integration Service"
    destination: "Audit & Compliance Logging"
    description: "Sends audit logs"
    technology: "Syslog / gRPC"
  - source: "Message Broker"
    destination: "Audit & Compliance Logging"
    description: "Sends audit logs"
    technology: "Syslog / gRPC"
  - source: "PostgreSQL"
    destination: "Audit & Compliance Logging"
    description: "Sends audit logs"
    technology: "Syslog / gRPC"
  - source: "Object Storage"
    destination: "Audit & Compliance Logging"
    description: "Sends audit logs"
    technology: "Syslog / gRPC"
  - source: "Caching & Session Container"
    destination: "Audit & Compliance Logging"
    description: "Sends audit logs"
    technology: "Syslog / gRPC"
  - source: "Backup & Archive Manager"
    destination: "Audit & Compliance Logging"
    description: "Sends audit logs"
    technology: "Syslog / gRPC"
  - source: "Backup & Archive Manager"
    destination: "Cloud Backup Archive"
    description: "Performs long-term data archiving and backups"
    technology: "HTTPS / TLS 1.3"
  - source: "Core Microservices"
