level: component
scope: "Component diagram for the Backup & Archive Manager container"
parentContainer:
  name: "Backup & Archive Manager"
elements:
  - type: "component"
    name: "Backup Management API Controller"
    technology: "Go"
    description: "Inbound interface for administrative triggers, status monitoring, and manual overrides."
  - type: "component"
    name: "Scheduler Engine"
    technology: "Go"
    description: "Triggers automated snapshot and archival jobs based on compliance policies."
  - type: "component"
    name: "Snapshot Agent"
    technology: "Velero-based"
    description: "Captures consistent data states from Kubernetes, PostgreSQL, and MinIO."
  - type: "component"
    name: "Encryption & Compliance Pipeline"
    technology: "Go"
    description: "Enforces AES-256 encryption and sanitizes volatile session data."
  - type: "component"
    name: "Retention Policy Enforcer"
    technology: "Go"
    description: "Manages lifecycle rules and executes secure data purging."
  - type: "component"
    name: "Integrity & Verification Service"
    technology: "Go"
    description: "Performs automated restore drills and cryptographic hash validation."
  - type: "component"
    name: "Key Management Intermediary"
    technology: "Go / Vault SDK"
    description: "Manages archive-specific encryption keys and cryptographic deletion."
relationships:
  - source: "API Gateway / Admin CLI"
    destination: "Backup Management API Controller"
    description: "Forwards administrative commands [gRPC / mTLS]"
  - source: "Backup Management API Controller"
    destination: "Scheduler Engine"
    description: "Dispatches manual run requests [Internal gRPC]"
  - source: "Scheduler Engine"
    destination: "Snapshot Agent"
    description: "Triggers backups [Internal gRPC]"
  - source: "Snapshot Agent"
    destination: "Encryption & Compliance Pipeline"
    description: "Streams raw backup payloads [Internal Channel / Memory]"
  - source: "Encryption & Compliance Pipeline"
    destination: "Key Management Intermediary"
    description: "Fetches archive-specific encryption keys [Transit API / mTLS]"
  - source: "Encryption & Compliance Pipeline"
    destination: "Cloud Backup Archive"
    description: "Uploads encrypted archives [HTTPS / TLS 1.3]"
  - source: "Retention Policy Enforcer"
    destination: "Cloud Backup Archive"
    description: "Applies object lifecycle policies [S3 API / HTTPS]"
  - source: "Retention Policy Enforcer"
    destination: "Key Management Intermediary"
    description: "Revokes/destroys keys for secure purging [Transit API / mTLS]"
  - source: "Scheduler Engine"
    destination: "Integrity & Verification Service"
    description: "Triggers validation jobs [Internal gRPC]"
  - source: "Integrity & Verification Service"
    destination: "Cloud Backup Archive"
    description: "Reads and verifies archived payloads [S3 API / HTTPS]"
  - source: "Integrity & Verification Service"
    destination: "Audit & Compliance Logging"
    description: "Reports verification audit trails [gRPC]"
  - source: "Backup Management API Controller"
    destination: "Audit & Compliance Logging"
    description: "Emits security audit events [gRPC]"