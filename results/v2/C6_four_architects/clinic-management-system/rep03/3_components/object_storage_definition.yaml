level: component
scope: "Component diagram for the Object Storage container"
parentContainer:
  name: "Object Storage"
elements:
  - type: "component"
    name: "Storage API Gateway"
    technology: "MinIO / S3 API"
    description: "Provides object storage compatible APIs for scalable medical imaging and document storage."
  - type: "component"
    name: "Encryption & Compliance Engine"
    technology: "HashiCorp Vault / OpenSSL"
    description: "Enforces mandatory AES-256 server-side encryption at rest for HIPAA/GDPR compliance."
  - type: "component"
    name: "Replication & Erasure Coding Manager"
    technology: "Reed-Solomon Erasure Coding"
    description: "Ensures multi-node data redundancy for high availability."
  - type: "component"
    name: "Lifecycle & Retention Manager"
    technology: "S3 Object Lock & ILM Rules"
    description: "Manages automated tiering and object-locking for mandatory >= 10-year retention."
  - type: "component"
    name: "Metadata & Index Catalog"
    technology: "Embedded RocksDB"
    description: "Delivers fast local metadata lookups and versioning states across distributed nodes."
  - type: "component"
    name: "Integrity & Health Monitor"
    technology: "SHA-256"
    description: "Performs continuous background bit-rot checks and integrity verification."
relationships:
  - source: "Core Microservices"
    destination: "Storage API Gateway"
    description: "Uploads/retrieves EMR attachments and DICOM medical imaging [HTTPS/REST]"
  - source: "Storage API Gateway"
    destination: "Encryption & Compliance Engine"
    description: "Delegates cryptographic operations [Internal gRPC]"
  - source: "Storage API Gateway"
    destination: "Metadata & Index Catalog"
    description: "Queries object metadata [Internal IPC/Memory]"
  - source: "Replication & Erasure Coding Manager"
    destination: "Replication & Erasure Coding Manager (Remote)"
    description: "Synchronizes data blocks across on-premise Kubernetes and eu-central-1 [mTLS/TCP]"
  - source: "Lifecycle & Retention Manager"
    destination: "Cloud Backup Archive"
    description: "Replicates historical medical records to secondary cloud region [HTTPS/S3 API]"
  - source: "Encryption & Compliance Engine"
    destination: "Audit & Compliance Logging"
    description: "Streams audit trails and integrity anomalies [gRPC]"
  - source: "Integrity & Health Monitor"
    destination: "Audit & Compliance Logging"
    description: "Streams audit trails and integrity anomalies [gRPC]"