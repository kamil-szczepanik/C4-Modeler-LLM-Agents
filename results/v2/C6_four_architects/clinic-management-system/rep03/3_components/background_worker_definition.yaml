level: component
scope: "Component diagram for the Background Worker container"
parentContainer:
  name: "Background Worker"
elements:
  - type: "component"
    name: "Job Consumer Component"
    technology: "Go / goroutines"
    description: "Consumes asynchronous events from the Message Broker."
  - type: "component"
    name: "Task Processor Component"
    technology: "Go"
    description: "Executes and processes background tasks, dispatching to other components."
  - type: "component"
    name: "Data Access Component"
    technology: "Go / database/sql"
    description: "Persists job state and business entities to PostgreSQL."
  - type: "component"
    name: "Integration Dispatcher Component"
    technology: "Go"
    description: "Delegates external sync tasks and offloads export chunks."
  - type: "component"
    name: "Retry & Dead-Letter Manager Component"
    technology: "Go"
    description: "Forwards failed job executions and manages backoff tasks or DLQ."
  - type: "component"
    name: "Encryption/Decryption Utility Component"
    technology: "Go / crypto/aes"
    description: "Invokes cryptographic operations for data security."
relationships:
  - source: "Message Broker"
    destination: "Job Consumer Component"
    description: "Consumes asynchronous events [AMQP / TLS]"
  - source: "Job Consumer Component"
    destination: "Task Processor Component"
    description: "Dispatches tasks [Go channels]"
  - source: "Task Processor Component"
    destination: "Encryption/Decryption Utility Component"
    description: "Invokes cryptographic operations [In-memory function calls]"
  - source: "Task Processor Component"
    destination: "Data Access Component"
    description: "Persists job state and business entities [Go channels / Postgres Wire Protocol / TLS]"
  - source: "Data Access Component"
    destination: "PostgreSQL"
    description: "Persists encrypted data [Postgres Wire Protocol / TLS]"
  - source: "Task Processor Component"
    destination: "Integration Dispatcher Component"
    description: "Delegates external sync tasks [Go channels]"
  - source: "Integration Dispatcher Component"
    destination: "Integration Service"
    description: "Submits batch payloads [HTTPS / TLS 1.3]"
  - source: "Integration Dispatcher Component"
    destination: "Object Storage"
    description: "Offloads EMR export chunks [S3 API / TLS]"
  - source: "Task Processor Component"
    destination: "Retry & Dead-Letter Manager Component"
    description: "Forwards failed job executions [Go channels]"
  - source: "Retry & Dead-Letter Manager Component"
    destination: "Message Broker"
    description: "Re-queues backoff tasks or publishes to DLQ [AMQP / TLS]"
  - source: "Task Processor Component"
    destination: "Audit & Compliance Logging"
    description: "Emits compliance trails [gRPC]"