level: component
scope: "Component diagram for the Caching & Session Container container"
parentContainer:
  name: "Caching & Session Container"
elements:
  - type: "component"
    name: "Session Manager"
    technology: "Redis Enterprise"
    description: "Manages user sessions and authentication states."
  - type: "component"
    name: "EMR Cache-Aside"
    technology: "Redis Modules (ReJSON, RedisBloom)"
    description: "Enables structured EMR caching and partial document caching."
  - type: "component"
    name: "Cluster Coordination"
    technology: "Redis Enterprise"
    description: "Synchronizes CRDT state across hybrid regions."
  - type: "component"
    name: "Data Masking & Encryption"
    technology: "Redis Enterprise Security Module"
    description: "Enforces in-memory encryption and AES-256 for HIPAA/GDPR compliance."
  - type: "component"
    name: "Eviction & TTL Policy Manager"
    technology: "Redis Enterprise"
    description: "Manages data lifecycles, TTLs, and eviction policies."
  - type: "component"
    name: "Redis Core Storage Engine"
    technology: "Redis Enterprise"
    description: "Provides high-performance in-memory data storage."
relationships:
  - source: "Cluster Coordination"
    destination: "External Redis Enterprise Peers"
    description: "Synchronizes CRDT state across hybrid regions via Encrypted TCP / TLS 1.3"
  - source: "Data Masking & Encryption"
    destination: "Audit & Compliance Logging"
    description: "Sends audit logs via Syslog / gRPC"