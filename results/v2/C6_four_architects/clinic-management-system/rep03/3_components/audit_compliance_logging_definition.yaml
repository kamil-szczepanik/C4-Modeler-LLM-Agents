level: component
scope: "Component diagram for the Audit & Compliance Logging container"
parentContainer:
  name: "Audit & Compliance Logging"
elements:
  - type: "component"
    name: "Log Collector Component"
    technology: "FluentBit"
    description: "Gathers and sanitizes OTLP streams from all upstream containers, dropping plaintext PHI/PII."
  - type: "component"
    name: "Log Forwarder / Buffer Component"
    technology: "FluentBit local buffer"
    description: "Persistent local disk buffer preventing log loss during network partitions."
  - type: "component"
    name: "Log Indexer & Search Engine"
    technology: "OpenSearch"
    description: "Indexes structured audit events with WORM policies."
  - type: "component"
    name: "Compliance Reporter Component"
    technology: "Go service"
    description: "Generates automated HIPAA/GDPR audit reports."
  - type: "component"
    name: "Audit Integrity Verifier"
    technology: "Go daemon"
    description: "Computes SHA-256 cryptographic hashes for tamper-evidence."
relationships:
  - source: "Upstream Containers"
    destination: "Log Collector Component"
    description: "Buffered log push [OTLP/gRPC over TLS 1.3]"
  - source: "Log Collector Component"
    destination: "Log Indexer & Search Engine"
    description: "Bulk indexing [HTTPS/REST via mTLS]"
  - source: "Compliance Reporter Component"
    destination: "Log Indexer & Search Engine"
    description: "Audit queries [HTTPS/REST via mTLS]"
  - source: "Audit Integrity Verifier"
    destination: "Log Indexer & Search Engine"
    description: "Read audit blocks [HTTPS/REST via mTLS]"
  - source: "Log Indexer & Search Engine"
    destination: "Cloud Backup Archive"
    description: "Cold storage tiering and cryptographic proofs [S3 API / HTTPS]"
  - source: "Audit Integrity Verifier"
    destination: "Cloud Backup Archive"
    description: "Cold storage tiering and cryptographic proofs [S3 API / HTTPS]"