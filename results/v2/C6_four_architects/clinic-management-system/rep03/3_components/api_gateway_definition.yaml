level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "TLS Termination & Routing Engine"
    technology: "Kong / NGINX"
    description: "Handles incoming client connections, terminates TLS, and routes traffic."
  - type: "component"
    name: "Auth & Token Introspection Plugin"
    technology: "Kong Plugin"
    description: "Validates user tokens against the Identity Provider."
  - type: "component"
    name: "Rate Limiting & Threat Protection Component"
    technology: "Kong Plugin"
    description: "Protects against threats and enforces rate-limiting to meet uptime constraints."
  - type: "component"
    name: "Audit & Request Correlation Interceptor"
    technology: "Kong Plugin"
    description: "Forwards access logs and security events to audit and compliance logging."
  - type: "component"
    name: "Request Transformation & Payload Validation Engine"
    technology: "Kong Plugin"
    description: "Transforms requests and validates payloads before routing."
  - type: "component"
    name: "Edge Caching & Session Store Component"
    technology: "Kong Plugin / Redis"
    description: "Manages edge caching and session state."
relationships:
  - source: "Auth & Token Introspection Plugin"
    destination: "Identity Provider"
    description: "Validates user tokens [HTTPS / OIDC]"
  - source: "Audit & Request Correlation Interceptor"
    destination: "Audit & Compliance Logging"
    description: "Forwards access logs and security events [gRPC / mTLS]"
  - source: "TLS Termination & Routing Engine"
    destination: "Core Microservices"
    description: "Routes validated traffic [gRPC / Internal mTLS]"