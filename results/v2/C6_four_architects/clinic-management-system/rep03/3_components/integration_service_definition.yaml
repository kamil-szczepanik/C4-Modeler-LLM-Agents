level: component
scope: "Component diagram for the Integration Service container"
parentContainer:
  name: "Integration Service"
elements:
  - type: "component"
    name: "Camel Route Orchestrator"
    technology: "Apache Camel / Spring Boot"
    description: "Orchestrates integration patterns and data flows between external healthcare systems and internal microservices."
  - type: "component"
    name: "FHIR Validator"
    technology: "HAPI FHIR Validator"
    description: "Performs strict HL7 FHIR profile validation for all incoming and outgoing interoperability messages."
  - type: "component"
    name: "mTLS Communication Handler"
    technology: "HTTPS with mTLS"
    description: "Secures external communications with lab and imaging systems using mutual TLS."
relationships:
  - source: "Camel Route Orchestrator"
    destination: "FHIR Validator"
    description: "Validates payloads"
  - source: "Camel Route Orchestrator"
    destination: "mTLS Communication Handler"
    description: "Sends secure requests to external systems"