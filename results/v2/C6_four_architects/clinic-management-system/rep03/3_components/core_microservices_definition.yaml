level: component
scope: "Component diagram for the Core Microservices container"
parentContainer:
  name: "Core Microservices"
elements:
  - type: "component"
    name: "Core API Dispatcher"
    technology: "Go"
    description: "Dispatches and routes validated API requests."
  - type: "component"
    name: "Access Control & Policy Enforcement Component"
    technology: "Spring Boot"
    description: "Evaluates permissions and enforces access policies."
  - type: "component"
    name: "Patient Admissions Component"
    technology: "Go"
    description: "Manages patient admissions."
  - type: "component"
    name: "Scheduling Component"
    technology: "Spring Boot"
    description: "Handles appointment scheduling and acquires distributed locks."
  - type: "component"
    name: "EMR Component"
    technology: "Spring Boot"
    description: "Manages electronic medical records and dispatches audit events."
  - type: "component"
    name: "Billing Component"
    technology: "Go"
    description: "Manages billing for hospitals and clinics."
  - type: "component"
    name: "FHIR Interoperability Component"
    technology: "Go"
    description: "Transmits standardized health records."
  - type: "component"
    name: "Internal Event Dispatcher"
    technology: "Go"
    description: "Publishes domain events to the message broker."
  - type: "component"
    name: "Data Encryption & Anonymization Component"
    technology: "Go"
    description: "Persists encrypted clinical data and handles encryption/anonymization."
  - type: "component"
    name: "Database Repository Abstraction Layer"
    technology: "Go/Spring Data"
    description: "Provides database abstraction for persistence."
relationships:
  - source: "API Gateway"
    destination: "Core API Dispatcher"
    description: "Routes validated requests [gRPC / mTLS]"
  - source: "Core API Dispatcher"
    destination: "Access Control & Policy Enforcement Component"
    description: "Evaluates permissions [In-process method call / gRPC]"
  - source: "Scheduling Component"
    destination: "Caching & Session Container"
    description: "Acquires distributed locks [Redis Protocol / TLS]"
  - source: "EMR Component"
    destination: "Audit & Compliance Logging"
    description: "Dispatches audit events [gRPC]"
  - source: "FHIR Interoperability Component"
    destination: "Integration Service"
    description: "Transmits standardized health records [gRPC / mTLS]"
  - source: "Internal Event Dispatcher"
    destination: "Message Broker"
    description: "Publishes domain events [AMQP / TLS]"
  - source: "Data Encryption & Anonymization Component"
    destination: "PostgreSQL"
    description: "Persists encrypted clinical data [SQL / TLS]"