level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "PostgreSQL Primary Instance"
    technology: "PostgreSQL 15+ / AES-256"
    description: "Relational data storage for EMR and scheduling with AES-256 encryption at rest."
  - type: "component"
    name: "PostgreSQL Standby Replica"
    technology: "PostgreSQL 15+"
    description: "Standby replica(s) providing high availability and read scalability."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Connection pooling and multiplexing to prevent resource exhaustion."
  - type: "component"
    name: "Row-Level Security (RLS) Policy Engine"
    technology: "PostgreSQL RLS"
    description: "Applies context-aware database queries and enforces data access policies."
  - type: "component"
    name: "Logical Replication / CDC Publisher"
    technology: "PostgreSQL CDC"
    description: "Publishes table mutations to the message broker."
  - type: "component"
    name: "Backup Agent"
    technology: "Backup Agent"
    description: "Streams encrypted WAL archives and snapshots to cloud backup storage."
  - type: "component"
    name: "Encryption Manager"
    technology: "pgcrypto / KMS Integration"
    description: "Encrypts and decrypts sensitive fields using transparent data encryption and column-level hashing."
relationships:
  - source: "PgBouncer"
    destination: "PostgreSQL Primary Instance"
    description: "Forwarded transactions [TCP / TLS]"
  - source: "PostgreSQL Primary Instance"
    destination: "PostgreSQL Standby Replica"
    description: "Streaming replication [TCP / TLS]"
  - source: "PostgreSQL Primary Instance"
    destination: "Logical Replication / CDC Publisher"
    description: "Publishes table mutations [TCP / PostgreSQL Wire Protocol]"
  - source: "Backup Agent"
    destination: "PostgreSQL Primary Instance"
    description: "Manages and streams encrypted WAL archives"
  - source: "PostgreSQL Primary Instance"
    destination: "Encryption Manager"
    description: "Encrypts/decrypts sensitive fields [Internal C Extension / KMS API]"