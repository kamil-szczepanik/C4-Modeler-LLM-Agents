level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Kafka Broker Nodes"
    technology: "Apache Kafka (KRaft mode)"
    description: "Provides immutable append-only event logs in KRaft mode, satisfying 10-year data retention and HIPAA audit requirements."
  - type: "component"
    name: "Schema Registry"
    technology: "Kafka Schema Registry"
    description: "Manages and validates data schemas for messages flowing through the event streams."
  - type: "component"
    name: "Kafka Connect"
    technology: "Kafka Connect"
    description: "Integrates external data sources and sinks with the message broker ecosystem."
  - type: "component"
    name: "Kafka REST Proxy"
    technology: "Kafka REST Proxy"
    description: "Exposes RESTful APIs for interacting with the Kafka cluster, allowing HTTP-based ingestion from integration services."
  - type: "component"
    name: "Access Control List (ACL) Authorizer"
    technology: "Kafka Security ACLs"
    description: "Validates client credentials and topic permissions via internal gRPC."
  - type: "component"
    name: "Encryption & Key Manager"
    technology: "TLS 1.3 & AES-256 Key Management"
    description: "Encrypts sensitive EMR and demographic payloads at rest and in transit."
  - type: "component"
    name: "Partition Rebalancer / Controller"
    technology: "KRaft Controller"
    description: "Manages metadata and partition leadership without ZooKeeper overhead."
  - type: "component"
    name: "Dead Letter Queue (DLQ) Manager"
    technology: "Kafka DLQ Pattern"
    description: "Handles poisoned or unprocessable messages for asynchronous debugging and recovery."
  - type: "component"
    name: "Topic Mirroring Agent"
    technology: "MirrorMaker 2"
    description: "Synchronizes partition logs bidirectionally across hybrid boundaries for high availability."
  - type: "component"
    name: "Metrics & Telemetry Exporter"
    technology: "Prometheus Exporter / Kafka Telemetry"
    description: "Exports broker metrics and telemetry data for system observability."
relationships:
  - source: "Core Microservices"
    destination: "Kafka Broker Nodes"
    description: "Publishes domain events [TCP / TLS 1.3 (Kafka protocol)]"
  - source: "Kafka Broker Nodes"
    destination: "Background Worker"
    description: "Consumes streaming events for asynchronous processing [TCP / TLS 1.3 (Kafka protocol)]"
  - source: "Integration Service"
    destination: "Kafka REST Proxy"
    description: "Ingests external lab/imaging messages via authenticated HTTP [HTTPS / TLS 1.3]"
  - source: "Access Control List (ACL) Authorizer"
    destination: "Kafka Broker Nodes"
    description: "Validates client credentials and topic permissions [Internal gRPC / TLS 1.3]"
  - source: "Kafka Broker Nodes"
    destination: "Encryption & Key Manager"
    description: "Encrypts sensitive EMR and demographic payloads at rest [Internal API / TLS 1.3]"
  - source: "Topic Mirroring Agent"
    destination: "Kafka Broker Nodes"
    description: "Synchronizes partition logs bidirectionally across hybrid boundary [Kafka Protocol / TLS 1.3]"
  - source: "Kafka Broker Nodes"
    destination: "Audit & Compliance Logging"
    description: "Streams audit trails and security events [gRPC / TLS 1.3]"