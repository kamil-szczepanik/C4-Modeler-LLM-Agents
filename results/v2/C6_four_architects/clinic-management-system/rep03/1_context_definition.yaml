level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "Manages patient admissions, EMR, scheduling, and billing for clinics via a hybrid cloud architecture, ensuring HIPAA/GDPR compliance and high availability."
elements:
  - type: "person"
    name: "Patients"
    description: "Patients interacting with the clinic for scheduling and accessing their records."
  - type: "person"
    name: "Doctors"
    description: "Medical professionals managing patient EMR and diagnoses."
  - type: "person"
    name: "Administrators"
    description: "Clinic staff managing admissions, scheduling, and overall system administration."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Handles authentication via OIDC/SAML."
  - type: "externalSystem"
    name: "Third-Party Billing Gateway"
    description: "Processes clinic billing transactions."
  - type: "externalSystem"
    name: "External Lab/Imaging Systems"
    description: "External systems communicating via HL7 FHIR."
  - type: "externalSystem"
    name: "Notification Gateway"
    description: "Sends notifications to users."
  - type: "externalSystem"
    name: "Cloud Backup Archive"
    description: "Stores long-term data retention and backups using S5/HTTPS with AES-256."
relationships:
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Accesses portal for appointments and records"
    technology: "HTTPS / WSS over TLS 1.3"
  - source: "Doctors"
    destination: "Clinic Management System"
    description: "Manages EMR and patient schedules"
    technology: "HTTPS / WSS over TLS 1.3"
  - source: "Administrators"
    destination: "Clinic Management System"
    description: "Manages clinic admissions, scheduling, and billing"
    technology: "HTTPS / WSS over TLS 1.3"
  - source: "Clinic Management System"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OIDC / SAML"
  - source: "Clinic Management System"
    destination: "Third-Party Billing Gateway"
    description: "Processes payments and financial transactions"
    technology: "HTTPS / REST"
  - source: "Clinic Management System"
    destination: "External Lab/Imaging Systems"
    description: "Exchanges lab and imaging data"
    technology: "HL7 FHIR over REST/JSON"
  - source: "Clinic Management System"
    destination: "Notification Gateway"
    description: "Triggers notifications"
    technology: "HTTPS / REST"
  - source: "Clinic Management System"
    destination: "Cloud Backup Archive"
    description: "Performs long-term data archiving"
    technology: "S5 / HTTPS with AES-256"