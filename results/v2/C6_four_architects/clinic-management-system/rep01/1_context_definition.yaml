level: context
scope: "System Context diagram for Clinic Management System (CMS)"
system:
  name: "Clinic Management System (CMS)"
  description: "Manages patient admissions, electronic medical records (EMR), scheduling, and billing for medium-sized hospitals and clinics."
elements:
  - type: "person"
    name: "Patient"
    description: "Interacts with the CMS for admissions, scheduling, and portal access."
  - type: "person"
    name: "Clinician / Staff"
    description: "Uses the CMS to manage patient records, electronic medical records (EMR), and schedules."
  - type: "person"
    name: "Hospital Administrator"
    description: "Manages administrative tasks, billing, and system oversight."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Handles authentication and multi-factor authentication (MFA) via OIDC/SAML 2.0."
  - type: "externalSystem"
    name: "Insurance Gateway"
    description: "Processes insurance claims and billing verification via REST/SOAP."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "Integrates with CMS to exchange clinical lab and imaging data via HL7 FHIR."
  - type: "externalSystem"
    name: "Notification Gateway"
    description: "Sends automated notifications and alerts to patients and staff."
  - type: "externalSystem"
    name: "Cloud Backup (AWS S3 Glacier)"
    description: "Secure cloud cold storage for long-term data retention."
  - type: "container"
    name: "Envoy API Gateway"
    description: "Edge routing, TLS 1.3 termination, and automated service mesh mTLS."
    technology: "Envoy / Istio"
  - type: "container"
    name: "EMR Service"
    description: "Manages electronic medical records ensuring compliance and performance."
    technology: "Java / Spring Boot"
  - type: "container"
    name: "Patient & Scheduling Service"
    description: "Handles patient admissions, details, and appointment scheduling."
    technology: "Go"
  - type: "container"
    name: "Billing & Claims Service"
    description: "Processes claims and financial billing."
    technology: ".NET Core"
  - type: "container"
    name: "Apache Kafka"
    description: "Asynchronous event streaming for decoupled domain integration."
    technology: "Apache Kafka"
  - type: "container"
    name: "PostgreSQL Operational Databases"
    description: "Multi-master operational databases enforcing the database-per-service pattern."
    technology: "PostgreSQL"
relationships:
  - source: "Patient"
    destination: "Clinic Management System (CMS)"
    description: "Accesses patient portal, admissions, and scheduling"
    technology: "HTTPS (TLS 1.3) with OIDC/SAML 2.0 MFA"
  - source: "Clinician / Staff"
    destination: "Clinic Management System (CMS)"
    description: "Accesses EMR, scheduling, and clinical workflows"
    technology: "HTTPS (TLS 1.3) with OIDC/SAML 2.0 MFA"
  - source: "Hospital Administrator"
    destination: "Clinic Management System (CMS)"
    description: "Manages administrative and billing operations"
    technology: "HTTPS (TLS 1.3) with OIDC/SAML 2.0 MFA"
  - source: "Clinic Management System (CMS)"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical data"
    technology: "HL7 FHIR over HTTPS (RESTful)"
  - source: "Clinic Management System (CMS)"
    destination: "Insurance Gateway"
    description: "Submits claims and verifies insurance"
    technology: "REST/SOAP over TLS 1.3"
  - source: "Clinic Management System (CMS)"
    destination: "Cloud Backup (AWS S3 Glacier)"
    description: "Archives data for long-term retention"
    technology: "Encrypted TLS links"