level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients interacting with admissions, scheduling, and portal access."
  - type: "person"
    name: "Clinicians/Staff"
    description: "Clinicians and hospital staff using the system to manage electronic medical records, schedules, and clinical workflows."
  - type: "person"
    name: "Hospital Administrators"
    description: "Administrators managing billing, operations, and system oversight."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Handles user authentication and security tokens."
  - type: "externalSystem"
    name: "Insurance Gateway"
    description: "Processes insurance claims and verification."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "Exchanges clinical lab and imaging data."
  - type: "externalSystem"
    name: "Notification Gateway"
    description: "Sends automated alerts and notifications to users."
  - type: "externalSystem"
    name: "Cloud Backup (AWS S3 Glacier)"
    description: "Long-term cold storage for audit logs and backups."
  - type: "container"
    name: "API Gateway"
    technology: "Kong/Envoy"
    description: "Handles TLS termination, rate limiting, and JWT validation."
  - type: "container"
    name: "Web Frontend"
    technology: "React/TypeScript / Nginx/CloudFront"
    description: "Provides the web interface for users."
  - type: "container"
    name: "Core Services Container"
    technology: "Java/Spring Boot"
    description: "Manages patient registration, scheduling, and billing."
  - type: "container"
    name: "EMR Service"
    technology: "Node.js/TypeScript"
    description: "Handles sub-second EMR performance and audit trails."
  - type: "container"
    name: "Database Layer"
    technology: "PostgreSQL"
    description: "Provides multi-master replication and encrypted storage."
  - type: "container"
    name: "Integration Worker"
    technology: "Apache Camel/Python"
    description: "Performs asynchronous HL7 FHIR messaging."
  - type: "container"
    name: "Event Broker"
    technology: "Apache Kafka"
    description: "Handles asynchronous decoupling across hybrid clusters."
  - type: "container"
    name: "Audit Log Store"
    technology: "PostgreSQL Append-Only tables / AWS S3 Glacier"
    description: "Maintains 10-year data retention for audit logs."
  - type: "container"
    name: "Key Management Service (KMS)"
    technology: "HashiCorp Vault / AWS KMS"
    description: "Performs envelope encryption and key separation."
  - type: "container"
    name: "Background Job Scheduler"
    technology: "Temporal.io"
    description: "Orchestrates complex clinical and insurance workflows."
  - type: "container"
    name: "Global Load Balancer"
    technology: "AWS Route 53 / Envoy Global"
    description: "Manages active-active multi-region health checks and geo-routing."
  - type: "container"
    name: "Observability & Monitoring Collector"
    technology: "OpenTelemetry / Prometheus / Grafana Loki"
    description: "Collects aggregated metrics, traces, and logs."
relationships:
  - source: "Patients"
    destination: "Web Frontend"
    description: "Interacts with portal"
    technology: "HTTPS/WSS"
  - source: "Clinicians/Staff"
    destination: "Web Frontend"
    description: "Interacts with clinical interface"
    technology: "HTTPS/WSS"
  - source: "Hospital Administrators"
    destination: "Web Frontend"
    description: "Interacts with administrative dashboard"
    technology: "HTTPS/WSS"
  - source: "Web Frontend"
    destination: "API Gateway"
    description: "Interacts with API backend"
    technology: "HTTPS/WSS"
  - source: "API Gateway"
    destination: "Core Services Container"
    description: "Communicates with core business logic"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "EMR Service"
    description: "Communicates with electronic medical records"
    technology: "gRPC over mTLS"
  - source: "Core Services Container"
    destination: "Database Layer"
    description: "Persists and queries operational data"
    technology: "Encrypted PostgreSQL wire protocol"
  - source: "EMR Service"
