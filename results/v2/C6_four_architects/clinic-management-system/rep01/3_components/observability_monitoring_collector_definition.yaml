level: component
scope: "Component diagram for the Observability & Monitoring Collector container"
parentContainer:
  name: "Observability & Monitoring Collector"
elements:
  - type: "component"
    name: "OTLP Receiver & mTLS Terminator"
    technology: "Go"
    description: "Ingests telemetry data via gRPC/OTLP over TLS."
  - type: "component"
    name: "Data Redaction Processor"
    technology: "Custom Go Component"
    description: "Ensures strict HIPAA/GDPR compliance via automated PHI/PII redaction."
  - type: "component"
    name: "Trace Sampler Processor"
    technology: "Go"
    description: "Performs tail-based sampling and optimizes cross-region bandwidth."
  - type: "component"
    name: "Metrics Aggregator Component"
    technology: "Prometheus / Go"
    description: "Aggregates metrics for the hybrid infrastructure."
  - type: "component"
    name: "Audit & Compliance Enforcer"
    technology: "Go"
    description: "Validates sanitization compliance and enforces audit rules."
  - type: "component"
    name: "Prometheus Remote-Write Exporter"
    technology: "Go"
    description: "Forwards metrics using HTTP/Snappy."
  - type: "component"
    name: "Grafana Loki Exporter"
    technology: "Go"
    description: "Streams sanitized logs via gRPC/OTLP."
  - type: "component"
    name: "OTLP Storage Exporter"
    technology: "Go"
    description: "Forwards sampled traces."
  - type: "component"
    name: "Key Management Service"
    technology: "HashiCorp Vault / AWS KMS"
    description: "Provides masking policies and keys."
  - type: "component"
    name: "Audit Log Store"
    technology: "PostgreSQL Append-Only tables / AWS S3 Glacier"
    description: "Persists verification logs."
relationships:
  - source: "Upstream Containers"
    destination: "OTLP Receiver & mTLS Terminator"
    description: "Ingests telemetry data [gRPC/OTLP over TLS]"
  - source: "OTLP Receiver & mTLS Terminator"
    destination: "Data Redaction Processor"
    description: "Passes telemetry payloads [Internal Memory Call]"
  - source: "OTLP Receiver & mTLS Terminator"
    destination: "Trace Sampler Processor"
    description: "Passes telemetry payloads [Internal Memory Call]"
  - source: "Data Redaction Processor"
    destination: "Key Management Service"
    description: "Fetches masking policies and keys [HTTPS/REST, mTLS]"
  - source: "Data Redaction Processor"
    destination: "Audit & Compliance Enforcer"
    description: "Validates sanitization compliance [Internal Memory Call]"
  - source: "Audit & Compliance Enforcer"
    destination: "Audit Log Store"
    description: "Persists verification logs [PostgreSQL Wire Protocol over TLS]"
  - source: "Trace Sampler Processor"
    destination: "OTLP Storage Exporter"
    description: "Forwards sampled traces [Internal gRPC]"
  - source: "Metrics Aggregator Component"
    destination: "Prometheus Remote-Write Exporter"
    description: "Forwards metrics [HTTP/Snappy]"
  - source: "Data Redaction Processor"
    destination: "Grafana Loki Exporter"
    description: "Streams sanitized logs [gRPC/OTLP]"