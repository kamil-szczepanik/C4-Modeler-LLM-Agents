level: component
scope: "Component diagram for the Database Layer container"
parentContainer:
  name: "Database Layer"
elements:
  - type: "component"
    name: "PostgreSQL Primary/Active-Active Nodes"
    technology: "Citus/Postgres-BDR"
    description: "Distributed multi-master relational storage for scalability and cross-region sync."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer Connection Pooler"
    description: "Connection pooling to support sub-second P95 performance."
  - type: "component"
    name: "Audit Trail Manager"
    technology: "Audit Trail Manager"
    description: "Tracks database actions for regulatory compliance."
  - type: "component"
    name: "Backup & Archival Agent"
    technology: "Backup & Archival Agent"
    description: "Streams WAL logs to cloud backup for long-term data retention."
  - type: "component"
    name: "Logical Replication Manager"
    technology: "Logical Replication Manager"
    description: "Manages cross-region synchronization across PostgreSQL nodes."
  - type: "component"
    name: "Distributed Lock Manager"
    technology: "etcd/Redlock"
    description: "Coordinates distributed locking for active-active nodes."
  - type: "component"
    name: "Data Encryption & Key Handler"
    technology: "Data Encryption & Key Handler"
    description: "Handles envelope encryption for AES-256 data at rest."
  - type: "component"
    name: "Failover & Health Monitor"
    technology: "Patroni"
    description: "Automated leader election and failover to ensure 99.99% uptime."
  - type: "component"
    name: "Query Optimizer & Index Manager"
    technology: "Query Optimizer & Index Manager"
    description: "Optimizes and executes query plans for incoming database queries."
relationships:
  - source: "Core Services Container & EMR Service"
    destination: "PgBouncer"
    description: "Connection pooling [PostgreSQL wire protocol over TLS]"
  - source: "PgBouncer"
    destination: "Query Optimizer & Index Manager"
    description: "Routes queries [PostgreSQL wire protocol]"
  - source: "Query Optimizer & Index Manager"
    destination: "PostgreSQL Primary/Active-Active Nodes"
    description: "Executes query plans [Internal IPC]"
  - source: "Data Encryption & Key Handler"
    destination: "Key Management Service (HashiCorp Vault/AWS KMS)"
    description: "Fetches keys [HTTPS/REST with mTLS]"
  - source: "Backup & Archival Agent"
    destination: "Cloud Backup (AWS S3 Glacier)"
    description: "Streams WAL logs [HTTPS/TLS 1.3]"
  - source: "Database Layer"
    destination: "Observability & Monitoring Collector (OpenTelemetry/Prometheus)"
    description: "Exports telemetry [gRPC/OTLP over TLS]"
  - source: "PostgreSQL Primary/Active-Active Nodes"
    destination: "Logical Replication Manager"
    description: "Cross-region sync [Encrypted replication protocol]"