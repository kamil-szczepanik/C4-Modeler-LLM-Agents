level: component
scope: "Component diagram for the Background Job Scheduler container"
parentContainer:
  name: "Background Job Scheduler"
elements:
  - type: "component"
    name: "Temporal Frontend Service"
    technology: "Go"
    description: "Handles incoming client requests and routes workflow commands."
  - type: "component"
    name: "Temporal History Service"
    technology: "Go"
    description: "Manages workflow state and history events."
  - type: "component"
    name: "Temporal Matching Service"
    technology: "Go"
    description: "Matches workflow tasks to available workers."
  - type: "component"
    name: "Temporal Worker Service"
    technology: "Go"
    description: "Executes workflow and activity tasks."
  - type: "component"
    name: "Temporal Persistence Layer"
    technology: "PostgreSQL"
    description: "Stores persistent state, schedules, and workflow data with ACID compliance."
  - type: "component"
    name: "Temporal Cluster Membership"
    technology: "Go/Ringpop"
    description: "Provides gossip-based node discovery and cluster health management."
  - type: "component"
    name: "Temporal Crypt Interceptor"
    technology: "Go"
    description: "Secures Protected Health Information (PHI) via application-layer payload encryption."
  - type: "component"
    name: "Key Management Service (KMS)"
    technology: "HTTPS/REST over mTLS"
    description: "Manages cryptographic keys for payload encryption."
relationships:
  - source: "Temporal Frontend Service"
    destination: "Temporal History Service"
    description: "gRPC"
  - source: "Temporal History Service"
    destination: "Temporal Matching Service"
    description: "gRPC"
  - source: "Temporal Matching Service"
    destination: "Temporal Worker Service"
    description: "gRPC"
  - source: "Temporal History Service"
    destination: "Temporal Persistence Layer"
    description: "SQL/CQL over TLS"
  - source: "Temporal Matching Service"
    destination: "Temporal Persistence Layer"
    description: "SQL/CQL over TLS"
  - source: "Temporal Frontend Service"
    destination: "Temporal Cluster Membership"
    description: "gRPC / Custom TCP"
  - source: "Temporal History Service"
    destination: "Temporal Cluster Membership"
    description: "gRPC / Custom TCP"
  - source: "Temporal Matching Service"
    destination: "Temporal Cluster Membership"
    description: "gRPC / Custom TCP"
  - source: "Temporal Worker Service"
    destination: "Temporal Cluster Membership"
    description: "gRPC / Custom TCP"
  - source: "Temporal Frontend Service"
    destination: "Temporal Crypt Interceptor"
    description: "In-memory Go interface"
  - source: "Temporal History Service"
    destination: "Temporal Crypt Interceptor"
    description: "In-memory Go interface"
  - source: "Temporal Crypt Interceptor"
    destination: "Key Management Service (KMS)"
    description: "HTTPS/REST over mTLS"