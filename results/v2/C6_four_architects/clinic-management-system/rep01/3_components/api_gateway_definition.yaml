level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing and Proxy Module"
    technology: "Kong / Envoy"
    description: "Routes incoming encrypted UI requests to core services and EMR services via gRPC over mTLS."
  - type: "component"
    name: "Rate Limiting Module"
    technology: "Redis Sidecar"
    description: "Tracks distributed rate limits using RESP over TCP with TLS."
  - type: "component"
    name: "Security and Key Management Integration"
    technology: "HashiCorp Vault / AWS KMS Client"
    description: "Validates keys and secrets securely via HTTPS/REST."
relationships:
  - source: "Routing and Proxy Module"
    destination: "Core Services Container"
    description: "Routes business logic traffic [gRPC over mTLS]"
  - source: "Routing and Proxy Module"
    destination: "EMR Service"
    description: "Routes electronic medical records traffic [gRPC over mTLS]"
  - source: "Routing and Proxy Module"
    destination: "Key Management Service"
    description: "Validates keys and secrets [HTTPS/REST]"
  - source: "Routing and Proxy Module"
    destination: "Redis Sidecar"
    description: "Tracks distributed rate limits [RESP over TCP with TLS]"