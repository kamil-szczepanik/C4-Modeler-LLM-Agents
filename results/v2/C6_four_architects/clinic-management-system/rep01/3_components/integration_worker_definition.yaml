level: component
scope: "Component diagram for the Integration Worker container"
parentContainer:
  name: "Integration Worker"
elements:
  - type: "component"
    name: "Route Orchestrator"
    technology: "Apache Camel / Python"
    description: "Orchestrates integration routes and message flow within the Integration Worker."
  - type: "component"
    name: "FHIR Transformer"
    technology: "Apache Camel / Python"
    description: "Transforms clinical data into HL7 FHIR formats for external exchange."
  - type: "component"
    name: "Connector Client"
    technology: "Apache Camel / Python"
    description: "Handles outbound and inbound connections to external lab, imaging, and insurance systems."
  - type: "component"
    name: "Security Enforcer"
    technology: "Apache Camel / Python"
    description: "Enforces security policies, compliance, and mTLS verification."
  - type: "component"
    name: "DLQ Handler"
    technology: "Apache Camel / Python"
    description: "Manages dead-letter queues and failed message processing."
  - type: "component"
    name: "Worker Health Monitor"
    technology: "Apache Camel / Python"
    description: "Monitors the health and operational status of the Integration Worker components."
relationships:
  - source: "Route Orchestrator"
    destination: "FHIR Transformer"
    description: "Passes raw messages for clinical data transformation [Internal Pipeline]"
  - source: "Route Orchestrator"
    destination: "Connector Client"
    description: "Delegates message dispatch to external systems [Internal Pipeline]"
  - source: "Security Enforcer"
    destination: "Route Orchestrator"
    description: "Validates security and compliance for routed messages [Security Check]"
  - source: "Route Orchestrator"
    destination: "DLQ Handler"
    description: "Routes failed messages upon processing errors [Error Handling]"
  - source: "Worker Health Monitor"
    destination: "Route Orchestrator"
    description: "Monitors operational health [Telemetry]"