level: component
scope: "Component diagram for the Event Broker container"
parentContainer:
  name: "Event Broker"
elements:
  - type: "component"
    name: "Kafka Broker Nodes (KRaft)"
    technology: "Apache Kafka (KRaft mode)"
    description: "Manages event streaming and consensus without ZooKeeper."
  - type: "component"
    name: "Confluent Schema Registry"
    technology: "Confluent"
    description: "Enforces data schemas and serialization formats for messages."
  - type: "component"
    name: "Kafka Connect"
    technology: "Apache Kafka Connect"
    description: "Integrates external data sources and sinks with the event broker."
  - type: "component"
    name: "Client-Side Interceptor Component"
    technology: "Custom Kafka Interceptor"
    description: "Applies envelope encryption and security headers to messages."
  - type: "component"
    name: "Kafka MirrorMaker 2"
    technology: "Apache MirrorMaker 2"
    description: "Handles cross-datacenter topic replication between on-prem and AWS."
  - type: "component"
    name: "Topic Authorization & Access Control Component (Kafka ACLs)"
    technology: "Kafka ACLs"
    description: "Enforces fine-grained access control and topic-level permissions."
  - type: "component"
    name: "Broker Health & Partition Rebalancer (Kafka Cruise Control)"
    technology: "Kafka Cruise Control"
    description: "Automates partition rebalancing and monitors broker health."
  - type: "component"
    name: "Dead Letter Queue (DLQ) Manager"
    technology: "Kafka DLQ Pattern"
    description: "Captures and routes failed message processing attempts."
relationships:
  - source: "Kafka Broker Nodes (KRaft)"
    destination: "Key Management Service (KMS)"
    description: "Fetches encryption keys [gRPC over mTLS]"
  - source: "Kafka MirrorMaker 2"
    destination: "Kafka Broker Nodes (KRaft)"
    description: "Replicates topics cross-datacenter [Kafka over mTLS]"