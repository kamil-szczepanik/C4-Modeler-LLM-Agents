level: component
scope: "Component diagram for the Key Management Service (KMS) container"
parentContainer:
  name: "Key Management Service (KMS)"
elements:
  - type: "component"
    name: "Access Control & Policy Enforcer"
    technology: "OPA / Vault ACLs"
    description: "Enforces policies and access control for keys and policies via zero-trust boundaries."
  - type: "component"
    name: "Key Manager Component"
    technology: "Java / Spring Vault SDK"
    description: "Manages cryptographic keys, executing hardware-backed operations and orchestrating replication."
  - type: "component"
    name: "Crypto-Worker Component"
    technology: "Go"
    description: "Performs low-level cryptographic operations and processing."
  - type: "component"
    name: "Transit Secrets Engine Component"
    technology: "HashiCorp Vault Transit"
    description: "Provides cryptographic primitives as a service (transit encryption)."
  - type: "component"
    name: "Secrets Engine Component"
    technology: "HashiCorp Vault KV"
    description: "Stores and manages key-value secrets securely."
  - type: "component"
    name: "Key Rotation Worker"
    technology: "Go / Cron"
    description: "Automatically rotates cryptographic keys on a scheduled basis."
  - type: "component"
    name: "Key Expiry & Revocation Manager"
    technology: "Go"
    description: "Manages the lifecycle, expiry, and revocation of cryptographic keys."
  - type: "component"
    name: "Key Sync & Replication Manager"
    technology: "Go"
    description: "Replicates encrypted key metadata across nodes using consensus protocols."
  - type: "component"
    name: "HSM Integration Layer"
    technology: "PKCS#11 wrapper"
    description: "Interfaces with Hardware Security Modules for hardware-backed cryptographic operations."
  - type: "component"
    name: "External KMS Interoperability Adapter"
    technology: "Go / AWS SDK"
    description: "Synchronizes cloud-native cryptographic primitives with external KMS providers."
  - type: "component"
    name: "Key Health & Readiness Probe"
    technology: "Go"
    description: "Monitors and reports the health and readiness status of the key management infrastructure."
  - type: "component"
    name: "Backup & Recovery Agent"
    technology: "Python / Go"
    description: "Exports encrypted KMS snapshots and key metadata to cloud backup storage."
relationships:
  - source: "Key Manager Component"
    destination: "HSM Integration Layer"
    description: "Executes hardware-backed cryptographic operations [PKCS#11 / TLS 1.3]"
  - source: "Key Manager Component"
    destination: "Key Sync & Replication Manager"
    description: "Replicates encrypted key metadata [Raft Consensus / TLS 1.3]"
  - source: "External KMS Interoperability Adapter"
    destination: "AWS KMS"
    description: "Synchronizes cloud-native cryptographic primitives [HTTPS/REST with SigV4 and TLS 1.3]"
  - source: "Backup & Recovery Agent"
    destination: "AWS S3 Glacier"
    description: "Exports encrypted KMS snapshots and key metadata [HTTPS/REST with AWS SigV4]"