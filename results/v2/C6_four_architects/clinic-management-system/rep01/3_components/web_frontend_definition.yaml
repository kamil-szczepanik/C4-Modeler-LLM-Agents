level: component
scope: "Component diagram for the Web Frontend container"
parentContainer:
  name: "Web Frontend"
elements:
  - type: "component"
    name: "Routing & Shell"
    technology: "React / TypeScript"
    description: "Manages application navigation, layout, and view routing."
  - type: "component"
    name: "Auth & Session Module"
    technology: "React / TypeScript"
    description: "Handles user authentication, session state, and security tokens."
  - type: "component"
    name: "Feature Modules"
    technology: "React / TypeScript"
    description: "Contains clinical UI modules for patient admissions, EMR, scheduling, and billing."
  - type: "component"
    name: "API Client & Interceptor"
    technology: "Axios / Fetch"
    description: "Centralizes API interception, token injection, and server-state communication."
  - type: "component"
    name: "Local State & Cache Manager"
    technology: "TanStack Query / Redux Toolkit"
    description: "Manages server-state caching and local application state for sub-second EMR load times."
  - type: "component"
    name: "Telemetry Agent"
    technology: "OpenTelemetry JS SDK"
    description: "Tracks and exports client performance and error metrics."
relationships:
  - source: "Telemetry Agent"
    destination: "Observability & Monitoring Collector"
    description: "Exports client performance and error metrics [gRPC/OTLP over TLS]"