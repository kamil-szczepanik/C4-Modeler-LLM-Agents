level: component
scope: "Component diagram for the Global Load Balancer container"
parentContainer:
  name: "Global Load Balancer"
elements:
  - type: "component"
    name: "Geo-DNS Resolver"
    technology: "AWS Route 53"
    description: "Ensures intelligent global routing and 99.99% uptime."
  - type: "component"
    name: "Anycast Traffic Manager"
    technology: "Envoy Proxy / BGP Anycast"
    description: "Routes resolved client traffic and forwards incoming requests to regional entry points."
  - type: "component"
    name: "Health Check Prober"
    technology: "Envoy Health Check Service"
    description: "Performs active health probes and reports regional degradation metrics."
  - type: "component"
    name: "Traffic Routing Policy Engine"
    technology: "Open Policy Agent (OPA) / Custom Lua in Envoy"
    description: "Evaluates dynamic failover, GDPR data residency policies, and queries dynamic routing decisions."
  - type: "component"
    name: "API Gateway"
    technology: "Kong / Envoy"
    description: "Handles incoming requests at regional entry points."
  - type: "component"
    name: "Key Management Service (KMS)"
    technology: "HashiCorp Vault / AWS KMS"
    description: "Retrieves TLS certificates and cipher suites, securing sensitive data."
  - type: "component"
    name: "Observability Collector"
    technology: "OpenTelemetry / Prometheus / Grafana Loki"
    description: "Provides centralized metrics collection across the hybrid deployment."
relationships:
  - source: "Geo-DNS Resolver"
    destination: "Anycast Traffic Manager"
    description: "Routes resolved client traffic [TCP/IP]"
  - source: "Anycast Traffic Manager"
    destination: "API Gateway"
    description: "Forwards incoming requests to regional entry points [HTTPS/gRPC]"
  - source: "Anycast Traffic Manager"
    destination: "Key Management Service (KMS)"
    description: "Retrieves TLS certificates and cipher suites [gRPC over mTLS]"
  - source: "Anycast Traffic Manager"
    destination: "Traffic Routing Policy Engine"
    description: "Queries dynamic routing decisions [In-process gRPC/Lua]"
  - source: "Health Check Prober"
    destination: "API Gateway"
    description: "Performs active health probes [HTTPS/GET]"
  - source: "Health Check Prober"
    destination: "Observability Collector"
    description: "Reports regional degradation metrics [gRPC/OTLP]"
  - source: "Traffic Routing Policy Engine"
    destination: "Health Check Prober"
    description: "Subscribes to real-time regional health status [In-memory event stream]"