level: component
scope: "Component diagram for the Audit Log Store container"
parentContainer:
  name: "Audit Log Store"
elements:
  - type: "component"
    name: "Audit Ingestor"
    technology: "Node.js / TypeScript"
    description: "Processing asynchronous log events."
  - type: "component"
    name: "Immutable Storage Engine"
    technology: "PostgreSQL (Append-Only / WORM)"
    description: "Append-only tables utilizing SHA-256 cryptographic chaining."
  - type: "component"
    name: "Archival Worker"
    technology: "Python"
    description: "Handling batch offloads to long-term storage."
  - type: "component"
    name: "Audit Query API"
    technology: "Node.js / TypeScript"
    description: "Providing secure, read-only compliance access."
  - type: "component"
    name: "Replication Manager"
    technology: "Go"
    description: "Managing multi-region active-active synchronization."
  - type: "component"
    name: "Integrity Verifier"
    technology: "Go"
    description: "Performing routine hash-chain verification and alerting."
relationships:
  - source: "Event Broker"
    destination: "Audit Ingestor"
    description: "Consumes log events [Kafka Protocol over TLS]"
  - source: "Audit Ingestor"
    destination: "Immutable Storage Engine"
    description: "Writes audit records [SQL/TCP with TLS]"
  - source: "API Gateway"
    destination: "Audit Query API"
    description: "Forwards search and compliance requests [gRPC over mTLS]"
  - source: "Core Services"
    destination: "Audit Query API"
    description: "Forwards search and compliance requests [gRPC over mTLS]"
  - source: "Audit Query API"
    destination: "Immutable Storage Engine"
    description: "Reads verified audit records [SQL/TCP with TLS]"
  - source: "Immutable Storage Engine"
    destination: "Replication Manager"
    description: "Streams Write-Ahead Logs [TCP with TLS]"
  - source: "Archival Worker"
    destination: "Cloud Backup"
    description: "Exports batch archives [HTTPS / Encrypted Storage API]"
  - source: "Replication Manager"
    destination: "Cloud Backup"
    description: "Exports batch archives [HTTPS / Encrypted Storage API]"
  - source: "Integrity Verifier"
    destination: "Observability & Monitoring Collector"
    description: "Emits compliance alert metrics [gRPC/OTLP over TLS]"
  - source: "Immutable Storage Engine"
    destination: "Key Management Service (KMS)"
    description: "Requests envelope encryption keys [HTTPS/REST]"