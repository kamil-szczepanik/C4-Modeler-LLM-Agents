level: component
scope: "Component diagram for the EMR Service container"
parentContainer:
  name: "EMR Service"
elements:
  - type: "component"
    name: "EMR API Controller"
    technology: "Express.js / Fastify"
    description: "Manages patient admissions, scheduling, and API requests."
  - type: "component"
    name: "CDR Manager"
    technology: "Prisma ORM / Node.js"
    description: "Manages electronic medical records and queries clinical data."
  - type: "component"
    name: "Caching Layer"
    technology: "Redis / Dragonfly"
    description: "Caches hot patient records to guarantee low-latency load times."
  - type: "component"
    name: "Encryption & Masking Engine"
    technology: "Node.js crypto / Vault SDK"
    description: "Encrypts and decrypts PII fields for compliance."
  - type: "component"
    name: "Audit Trail Interceptor"
    technology: "TypeScript Middleware"
    description: "Publishes immutable audit logs for security tracking."
  - type: "component"
    name: "FHIR Transformation Engine"
    technology: "HAPI FHIR / TypeScript mapper"
    description: "Transforms clinical events and publishes FHIR payloads."
relationships:
  - source: "EMR API Controller"
    destination: "CDR Manager"
    description: "Queries clinical data [In-memory TypeScript function calls]"
  - source: "CDR Manager"
    destination: "Caching Layer"
    description: "Reads/writes hot patient records [In-memory Redis protocol]"
  - source: "CDR Manager"
    destination: "Database Layer"
    description: "Queries and persists EMR data [Encrypted PostgreSQL wire protocol]"
  - source: "EMR API Controller"
    destination: "Encryption & Masking Engine"
    description: "Encrypts/decrypts PII fields [In-memory function calls]"
  - source: "Audit Trail Interceptor"
    destination: "Audit Log Store"
    description: "Publishes immutable audit logs [Encrypted TLS / HTTPS]"
  - source: "FHIR Transformation Engine"
    destination: "Event Broker"
    description: "Consumes clinical events and publishes FHIR payloads [Kafka Protocol over TLS]"