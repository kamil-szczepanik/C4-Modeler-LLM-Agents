level: component
scope: "Component diagram for the Core Services Container container"
parentContainer:
  name: "Core Services Container"
elements:
  - type: "component"
    name: "Patient Registration Component"
    technology: "Java/Spring Data JPA"
    description: "Manages patient admissions and registration data."
  - type: "component"
    name: "Scheduling Engine Component"
    technology: "Java / Drools"
    description: "Handles clinical scheduling logic and rules."
  - type: "component"
    name: "Billing & Claims Component"
    technology: "Java/Spring Integration"
    description: "Manages billing operations and claims processing."
  - type: "component"
    name: "Audit Interceptor Component"
    technology: "Spring AOP"
    description: "Provides HIPAA-compliant automated audit logging via method interception."
  - type: "component"
    name: "Security Context & Policy Enforcer"
    technology: "Spring Security / OAuth2"
    description: "Enforces zero-trust role-based access control (RBAC)."
  - type: "component"
    name: "FHIR Translation Adapter"
    technology: "Java / HAPI FHIR"
    description: "Translates data for HL7 FHIR clinical interoperability standards."
  - type: "component"
    name: "Health & Readiness Probe Component"
    technology: "Spring Boot Actuator"
    description: "Exposes health and readiness metrics for Kubernetes and load balancers."
