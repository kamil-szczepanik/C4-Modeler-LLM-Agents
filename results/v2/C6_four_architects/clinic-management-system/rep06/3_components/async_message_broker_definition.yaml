level: component
scope: "Component diagram for the Async Message Broker container"
parentContainer:
  name: "Async Message Broker"
elements:
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry"
    description: "Validates event schemas to maintain cross-service compatibility for clinical data."
  - type: "component"
    name: "Event Router / Topic Manager"
    technology: "Kafka Broker Core"
    description: "Manages Kafka broker core routing and topic management."
  - type: "component"
    name: "Access Control & Encryption Module"
    technology: "TLS 1.3 and mTLS"
    description: "Enforces mTLS and ACL-based topic authorization and encrypted data transmission."
  - type: "component"
    name: "Partition Replica Manager"
    technology: "Apache Kafka"
    description: "Handles partition-based replication, guaranteed ordering, and event production/consumption."
  - type: "component"
    name: "Data Masking & Retention Component"
    technology: "Internal Memory/Pipeline"
    description: "Applies redaction rules to event streams to satisfy compliance mandates."
  - type: "component"
    name: "Consumer Group Coordinator"
    technology: "Apache Kafka Protocol"
    description: "Coordinates offset commits for consumer groups."
  - type: "component"
    name: "Broker Telemetry & Metrics Exporter"
    technology: "Prometheus Format"
    description: "Scrapes and exports internal broker health metrics."
  - type: "container"
    name: "Patient & Scheduling Service"
    technology: "Enterprise Service"
    description: "External system producing and consuming domain events and validating schemas."
  - type: "container"
    name: "EMR Service"
    technology: "Enterprise Service"
    description: "External system producing and consuming domain events."
  - type: "container"
    name: "Billing & Claims Service"
    technology: "Enterprise Service"
    description: "External system producing and consuming domain events."
  - type: "container"
    name: "FHIR Integration Broker"
    technology: "Integration Service"
    description: "Subscribes to clinical event streams."
  - type: "container"
    name: "Audit Data Store"
    technology: "AWS S3 / MinIO WORM"
    description: "Provides immutable storage for archived immutable event logs."
  - type: "container"
    name: "Observability Stack"
    technology: "Prometheus"
    description: "Scrapes internal metrics for monitoring broker health."
relationships:
  - source: "Patient & Scheduling Service"
    destination: "Partition Replica Manager"
    description: "Produces and consumes domain events [Kafka Protocol over TCP]"
  - source: "EMR Service"
    destination: "Partition Replica Manager"
    description: "Produces and consumes domain events [Kafka Protocol over TCP]"
  - source: "Billing & Claims Service"
    destination: "Partition Replica Manager"
    description: "Produces and consumes domain events [Kafka Protocol over TCP]"
  - source: "Patient & Scheduling Service"
    destination: "Schema Registry"
    description: "Validates event schemas [HTTP/REST]"
  - source: "Access Control & Encryption Module"
    destination: "Partition Replica Manager"
    description: "Enforces mTLS and ACL-based topic authorization [Internal TCP interceptor]"
  - source: "Data Masking & Retention Component"
    destination: "Event Router / Topic Manager"
    description: "Applies redaction rules to event streams [Internal Memory/Pipeline]"
  - source: "Partition Replica Manager"
    destination: "Audit Data Store"
    description: "Exports immutable event logs for archiving [HTTPS/S3 API]"
  - source: "Consumer Group Coordinator"
    destination: "Partition Replica Manager"
    description: "Coordinates offset commits [Kafka Protocol over TCP]"
  - source: "FHIR Integration Broker"
    destination: "Consumer Group Coordinator"
    description: "Subscribes to clinical event streams [Kafka Protocol over TCP]"
  - source: "Broker Telemetry & Metrics Exporter"
    destination: "Observability Stack"
    description: "Scrapes internal metrics [HTTP/Prometheus format]"