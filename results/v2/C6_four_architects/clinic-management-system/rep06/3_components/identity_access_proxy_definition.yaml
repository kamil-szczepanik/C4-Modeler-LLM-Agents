level: component
scope: "Component diagram for the Identity & Access Proxy container"
parentContainer:
  name: "Identity & Access Proxy"
elements:
  - type: "component"
    name: "mTLS Termination Component"
    technology: "Envoy / Go"
    description: "Terminates mTLS and passes decrypted payload streams."
  - type: "component"
    name: "Token Validator Component"
    technology: "Go / JWT Library"
    description: "Validates tokens, fetches and caches JWKS from external IdP, and routes external calls."
  - type: "component"
    name: "Policy Enforcement Point (PEP)"
    technology: "Open Policy Agent (OPA)"
    description: "Enforces policies, checks roles and revocation lists, and passes authorized requests."
  - type: "component"
    name: "Session State Manager"
    technology: "Go / Redis"
    description: "Persists and manages session tokens in the distributed cache."
  - type: "component"
    name: "Circuit Breaker & Fallback Handler"
    technology: "Go"
    description: "Handles circuit breaking and falls back to cached keys on external call failures."
  - type: "component"
    name: "Audit Interceptor"
    technology: "Go"
    description: "Emits security and audit events to the log shipper."
  - type: "component"
    name: "Claim Transformation & Sanitization Engine"
    technology: "Go"
    description: "Passes and forwards sanitized requests to backend services."
relationships:
  - source: "mTLS Termination Component"
    destination: "Token Validator Component"
    description: "Passes decrypted payload streams [Internal gRPC]"
  - source: "Token Validator Component"
    destination: "Circuit Breaker & Fallback Handler"
    description: "Routes external calls [HTTPS/REST]"
  - source: "PEP"
    destination: "Claim Transformation & Sanitization Engine"
    description: "Passes authorized requests [Internal gRPC]"
  - source: "Audit Interceptor"
    destination: "Audit & Compliance Log Shipper"
    description: "Emits security events [Local Fluentbit Socket]"
  - source: "Session State Manager"
    destination: "Distributed Cache"
    description: "Persists session tokens [In-memory RESP]"