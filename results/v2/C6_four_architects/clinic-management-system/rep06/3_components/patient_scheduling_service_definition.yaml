level: component
scope: "Component diagram for the Patient & Scheduling Service container"
parentContainer:
  name: "Patient & Scheduling Service"
elements:
  - type: "component"
    name: "Patient Management Controller"
    technology: "Spring MVC"
    description: "Handles patient admissions, demographics, and scheduling requests."
  - type: "component"
    name: "Scheduling Engine Component"
    technology: "Spring Service"
    description: "Manages scheduling logic and resource clash prevention."
  - type: "component"
    name: "FHIR Mapping Adapter Component"
    technology: "Apache Camel / Spring Integration"
    description: "Translates internal models to HL7 FHIR standards for external interoperability."
  - type: "component"
    name: "Audit Interceptor Component"
    technology: "Spring AOP"
    description: "Captures audit logs transparently without business logic pollution for HIPAA/GDPR compliance."
  - type: "component"
    name: "Notification Trigger Component"
    technology: "Spring Event Listener"
    description: "Dispatches appointment alerts and notifications."
  - type: "component"
    name: "Domain Event Publisher Component"
    technology: "Spring AMQP / Kafka Client"
    description: "Emits domain events to the message broker."
  - type: "component"
    name: "Data Access Repository Layer"
    technology: "Spring Data JPA"
    description: "Manages database persistence for patient and appointment data."
  - type: "container"
    name: "API Gateway"
    technology: "Gateway Technology"
    description: "Routes demographic and scheduling requests."
  - type: "container"
    name: "Distributed Cache"
    technology: "Redis"
    description: "Provides distributed caching and atomic resource locking."
  - type: "container"
    name: "Patient DB"
    technology: "SQL Database"
    description: "Stores patient and appointment data."
  - type: "container"
    name: "Async Message Broker"
    technology: "AMQP / Kafka"
    description: "Handles asynchronous domain events."
  - type: "system"
    name: "Hospital Notification/SMS Gateway"
    technology: "REST/HTTPS"
    description: "External system dispatching appointment alerts."
relationships:
  - source: "API Gateway"
    destination: "Patient Management Controller"
    description: "Routes demographic and scheduling requests [gRPC]"
  - source: "Scheduling Engine Component"
    destination: "Distributed Cache"
    description: "Acquires atomic resource locks [Redis Protocol over TLS]"
  - source: "Scheduling Engine Component"
    destination: "Patient DB"
    description: "Reads/writes appointment data [TLS-encrypted SQL]"
  - source: "Domain Event Publisher Component"
    destination: "Async Message Broker"
    description: "Emits domain events [AMQP/Kafka]"
  - source: "Notification Trigger Component"
    destination: "Hospital Notification/SMS Gateway"
    description: "Dispatches appointment alerts [REST/HTTPS]"