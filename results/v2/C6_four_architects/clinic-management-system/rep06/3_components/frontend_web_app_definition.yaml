level: component
scope: "Component diagram for the Frontend Web App container"
parentContainer:
  name: "Frontend Web App"
elements:
  - type: "component"
    name: "Routing & Shell Component"
    technology: "React Router"
    description: "Handles SPA navigation and layout structuring."
  - type: "component"
    name: "State Management Store"
    technology: "Redux Toolkit / Zustand"
    description: "Manages global user session and UI state."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios/Fetch wrapper"
    description: "Manages REST/JSON communication and JWT authentication over HTTPS."
  - type: "component"
    name: "PatientRegistration"
    technology: "React SPA & TypeScript"
    description: "Feature module for handling patient admissions."
  - type: "component"
    name: "AppointmentScheduler"
    technology: "React SPA & TypeScript"
    description: "Feature module for appointment scheduling and real-time updates over WSS."
  - type: "component"
    name: "EMREditor"
    technology: "React SPA & TypeScript"
    description: "Feature module for electronic medical records with sub-second performance."
  - type: "component"
    name: "BillingModule"
    technology: "React SPA & TypeScript"
    description: "Feature module for billing and claims management."
  - type: "component"
    name: "Security & Audit Guard"
    technology: "TypeScript"
    description: "Enforces Role-Based Access Control (RBAC)."
  - type: "component"
    name: "Offline/Cache Manager"
    technology: "LocalStorage / IndexedDB"
    description: "Supports offline capabilities and high availability."
  - type: "component"
    name: "Telemetry & Error Boundary Component"
    technology: "TypeScript"
    description: "Captures error boundaries and sends telemetry data."
  - type: "component"
    name: "State Encryption Wrapper"
    technology: "Web Crypto API (SubtleCrypto)"
    description: "Provides client-side PHI encryption at rest for HIPAA compliance."
  - type: "component"
    name: "Design System Component"
    technology: "Headless UI / Tailwind CSS"
    description: "Provides standardized clinical data-grids and UI elements."
relationships:
  - source: "PatientRegistration"
    destination: "API Client Layer"
    description: "Internal TypeScript function calls"
  - source: "AppointmentScheduler"
    destination: "API Client Layer"
    description: "Internal TypeScript function calls"
  - source: "EMREditor"
    destination: "API Client Layer"
    description: "Internal TypeScript function calls"
  - source: "BillingModule"
    destination: "API Client Layer"
    description: "Internal TypeScript function calls"
  - source: "API Client Layer"
    destination: "API Gateway / Identity & Access Proxy"
    description: "REST/JSON and JWT authentication over HTTPS"
  - source: "AppointmentScheduler"
    destination: "API Gateway"
    description: "Real-time scheduling updates over WSS (WebSocket Secure)"
  - source: "PatientRegistration"
    destination: "Offline/Cache Manager"
    description: "Local caching of PHI data"
  - source: "AppointmentScheduler"
    destination: "Offline/Cache Manager"
    description: "Local caching of scheduling data"
  - source: "EMREditor"
    destination: "Offline/Cache Manager"
    description: "Local caching of EMR data"
  - source: "BillingModule"
    destination: "Offline/Cache Manager"
    description: "Local caching of billing data"
  - source: "Offline/Cache Manager"
    destination: "State Encryption Wrapper"
    description: "PHI encryption via SubtleCrypto API and IndexedDB"
  - source: "Telemetry & Error Boundary Component"
    destination: "Audit & Compliance Log Shipper"
    description: "Security event logs over HTTPS"