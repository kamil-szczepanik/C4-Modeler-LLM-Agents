level: component
scope: "Component diagram for the Audit Data Store container"
parentContainer:
  name: "Audit Data Store"
elements:
  - type: "component"
    name: "Object Storage Engine"
    technology: "AWS S3 / MinIO Object Lock"
    description: "Enforces WORM immutability for >= 10-year retention and stores encrypted audit payloads."
  - type: "component"
    name: "Key Management Service"
    technology: "AWS KMS / HashiCorp Vault"
    description: "Provides AES-256 encryption at rest with annual key rotation."
  - type: "component"
    name: "Access Control Policy Enforcer"
    technology: "Access Control Policy Engine"
    description: "Enforces strict access control policies for audit data."
  - type: "component"
    name: "Lifecycle Management Policy Engine"
    technology: "S3 Lifecycle API"
    description: "Applies retention and tiering rules to the object storage engine."
  - type: "component"
    name: "Integrity Verification Monitor"
    technology: "S3 API"
    description: "Reads and validates block checksums to ensure data integrity."
  - type: "component"
    name: "Audit Query & Export Gateway"
    technology: "HTTPS / S3 API"
    description: "Handles requests for compliance reports and log exports, retrieving verified audit objects."
  - type: "component"
    name: "Audit Event Indexer / Metadata Catalog"
    technology: "OpenSearch"
    description: "Enables sub-second metadata indexing and searches without exposing raw PII."
relationships:
  - source: "Audit & Compliance Log Shipper"
    destination: "Object Storage Engine"
    description: "Writes encrypted audit payloads via HTTPS [S3 API]"
  - source: "Object Storage Engine"
    destination: "Key Management Service"
    description: "Requests envelope encryption keys via [gRPC/HTTPS]"
  - source: "Lifecycle Management Policy Engine"
    destination: "Object Storage Engine"
    description: "Applies retention and tiering rules via [S3 Lifecycle API]"
  - source: "Integrity Verification Monitor"
    destination: "Object Storage Engine"
    description: "Reads and validates block checksums via [S3 API]"
  - source: "Regulatory/Audit Authority"
    destination: "Audit Query & Export Gateway"
    description: "Requests compliance reports and log exports via [HTTPS]"
  - source: "Audit Query & Export Gateway"
    destination: "Object Storage Engine"
    description: "Retrieves verified audit objects via [HTTPS/S3 API]"
  - source: "Object Storage Engine"
    destination: "Audit Event Indexer / Metadata Catalog"
    description: "Streams new object creation events for indexing via [Kafka/Webhook]"