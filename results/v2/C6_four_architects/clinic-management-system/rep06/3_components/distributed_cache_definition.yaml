level: component
scope: "Component diagram for the Distributed Cache container"
parentContainer:
  name: "Distributed Cache"
elements:
  - type: "component"
    name: "Client Connection Handler"
    technology: "Multiplexing I/O Engine"
    description: "Handles incoming client connections and multiplexes I/O operations."
  - type: "component"
    name: "Cache Cluster Manager"
    technology: "Redis Sentinel / Cluster Coordinator"
    description: "Coordinates high availability and automatic failover across hybrid nodes."
  - type: "component"
    name: "In-Memory Storage Engine"
    technology: "Redis Core"
    description: "Provides in-memory storage for high-performance sub-second EMR retrieval."
  - type: "component"
    name: "Data Encryption Module"
    technology: "TLS / AES-256 Module"
    description: "Ensures in-transit and at-rest security for HIPAA and GDPR compliance."
  - type: "component"
    name: "Replication Agent"
    technology: "Redis Master-Replica Sync Engine"
    description: "Streams write-ahead logs and manages master-replica synchronization."
  - type: "component"
    name: "WAN Replication & Tunneling Module"
    technology: "Redis Enterprise Active-Active / Envoy Proxy"
    description: "Handles secure cross-site WAN tunneling via mTLS."
  - type: "component"
    name: "Cache Eviction & Expiry Manager"
    technology: "Memory Management Engine"
    description: "Purges expired keys and manages cache eviction."
relationships:
  - source: "EMR Service"
    destination: "Client Connection Handler"
    description: "Sends read/write commands via [TCP / Redis Protocol]"
  - source: "Client Connection Handler"
    destination: "Data Encryption Module"
    description: "Decrypts incoming traffic via [In-Memory Processing]"
  - source: "Cache Cluster Manager"
    destination: "In-Memory Storage Engine"
    description: "Coordinates replication via [Internal Redis Cluster Bus]"
  - source: "In-Memory Storage Engine"
    destination: "Replication Agent"
    description: "Streams write-ahead logs via [TCP / Redis Replication Protocol]"
  - source: "Replication Agent"
    destination: "WAN Replication & Tunneling Module"
    description: "Forwards cross-site data via [TCP]"
  - source: "WAN Replication & Tunneling Module"
    destination: "WAN Replication & Tunneling Module (Remote)"
    description: "Synchronizes state via [mTLS]"
  - source: "Cache Eviction & Expiry Manager"
    destination: "In-Memory Storage Engine"
    description: "Purges expired keys via [Internal Memory Access]"