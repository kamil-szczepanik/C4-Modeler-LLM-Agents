level: component
scope: "Component diagram for the EMR Service container"
parentContainer:
  name: "EMR Service"
elements:
  - type: "component"
    name: "EMR API Controller"
    technology: "Express.js/NestJS"
    description: "Handles incoming requests for the EMR Service."
  - type: "component"
    name: "Clinical Record Manager"
    technology: "Node.js/TypeScript"
    description: "Manages clinical records and interacts with the FHIR Transformer."
  - type: "component"
    name: "FHIR Transformer Component"
    technology: "Node.js/TypeScript"
    description: "Converts records for external sync."
  - type: "component"
    name: "Data Access Repository"
    technology: "Node.js/TypeScript"
    description: "Handles data access and interfaces with the FLE Interceptor."
  - type: "component"
    name: "Audit Event Dispatcher"
    technology: "Node.js/TypeScript"
    description: "Dispatches audit events for compliance."
  - type: "component"
    name: "Cache-Aside Manager"
    technology: "Node.js/TypeScript"
    description: "Manages cached EMR data retrieval."
  - type: "component"
    name: "Field-Level Encryption (FLE) Interceptor"
    technology: "Node.js/TypeScript"
    description: "Encrypts and decrypts PHI payloads as in-memory middleware."
  - type: "component"
    name: "Telemetry & Health Probe Interceptor"
    technology: "Node.js/TypeScript"
    description: "Propagates trace context and handles telemetry."
relationships:
  - source: "Clinical Record Manager"
    destination: "FHIR Transformer Component"
    description: "Converts records for external sync [In-memory]"
  - source: "Data Access Repository"
    destination: "Field-Level Encryption (FLE) Interceptor"
    description: "Encrypts/decrypts PHI payloads [In-memory middleware]"
  - source: "Telemetry & Health Probe Interceptor"
    destination: "Async Message Broker"
    description: "Propagates trace context [AMQP headers]"