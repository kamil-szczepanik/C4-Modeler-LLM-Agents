level: component
scope: "Component diagram for the EMR DB container"
parentContainer:
  name: "EMR DB"
elements:
  - type: "component"
    name: "WiredTiger Engine"
    technology: "MongoDB WiredTiger Storage Engine"
    description: "Provides flexible schema EMR storage and native AES-256 encryption at rest."
  - type: "component"
    name: "3-node Replica Sets"
    technology: "MongoDB Replica Set"
    description: "Ensures high availability and automated failover across multi-availability zones."
  - type: "component"
    name: "Change Streams"
    technology: "MongoDB Change Streams"
    description: "Streams oplog data for immutable audit trails to the log shipper."
  - type: "component"
    name: "Backup & PITR Agent"
    technology: "MongoDB Backup Agent"
    description: "Streams encrypted database backups and point-in-time recovery logs to the audit data store."
  - type: "component"
    name: "Encryption Key Management Module"
    technology: "KMIP Module"
    description: "Fetches data encryption keys (DEKs) using envelope encryption from the Identity Provider/KMS."
  - type: "component"
    name: "Query Access Control Subsystem"
    technology: "MongoDB RBAC"
    description: "Validates incoming connection tokens, context, and permissions for database access."
relationships:
  - source: "WiredTiger Engine"
    destination: "Distributed Cache"
    description: "Caches frequent patient EMR lookup segments [TCP / Redis wire protocol via TLS]"
  - source: "Change Streams"
    destination: "Audit & Compliance Log Shipper"
    description: "Streams oplog data for immutable audit trails [Internal DB Oplog tailing / TLS]"
  - source: "Backup & PITR Agent"
    destination: "Audit Data Store"
    description: "Streams encrypted database backups and PITR logs [HTTPS / S3 API over TLS]"
  - source: "Encryption Key Management Module"
    destination: "Identity Provider (IdP)"
    description: "Fetches data encryption keys (DEKs) using envelope encryption [KMIP over TLS]"
  - source: "Query Access Control Subsystem"
    destination: "Identity & Access Proxy"
    description: "Validates incoming connection tokens and context [TLS / SCRAM-SHA-256]"