level: component
scope: "Component diagram for the Patient DB container"
parentContainer:
  name: "Patient DB"
elements:
  - type: "component"
    name: "Primary DB Instance"
    technology: "PostgreSQL 15"
    description: "Provides robust, relational data storage for structured scheduling and patient demographics."
  - type: "component"
    name: "Read Replica"
    technology: "PostgreSQL 15 Standby"
    description: "Provides read-only scaling and handles standby traffic via streaming replication."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Manages incoming database connections to prevent connection exhaustion under high concurrency."
  - type: "component"
    name: "Encryption Manager"
    technology: "PostgreSQL TDE / pgcrypto"
    description: "Enforces AES-256 encryption at rest for HIPAA and GDPR compliance."
  - type: "component"
    name: "Failover Coordinator"
    technology: "Patroni / etcd"
    description: "Enables automated leader election and failover for high availability."
  - type: "component"
    name: "Backup & Archiving Agent"
    technology: "Barman / pgBackRest"
    description: "Handles continuous WAL archiving and point-in-time recovery for long-term retention."
  - type: "component"
    name: "Row-Level Security Policy Engine"
    technology: "PostgreSQL RLS"
    description: "Enforces database-level multi-tenant security and context-aware access policies per query."
relationships:
  - source: "Connection Pooler"
    destination: "Primary DB Instance"
    description: "Pools and forwards database connections [TCP / TLS]"
  - source: "Primary DB Instance"
    destination: "Read Replica"
    description: "Streams transaction logs [TCP / Streaming Replication]"
  - source: "Failover Coordinator"
    destination: "Primary DB Instance"
    description: "Health checks and consensus state management [TCP / HTTP]"
  - source: "Failover Coordinator"
    destination: "Read Replica"
    description: "Health checks and consensus state management [TCP / HTTP]"
  - source: "Backup & Archiving Agent"
    destination: "Primary DB Instance"
    description: "Pulls database backups and WAL streams [TCP / SSH/TLS]"