level: component
scope: "Component diagram for the Audit & Compliance Log Shipper container"
parentContainer:
  name: "Audit & Compliance Log Shipper"
elements:
  - type: "component"
    name: "Log Input Collector"
    technology: "Fluent Bit and Vector"
    description: "Gathers local system and application logs."
  - type: "component"
    name: "Compliance Filter & Transformer"
    technology: "Lua-based transformation"
    description: "Sanitizes and transforms log entries for compliance."
  - type: "component"
    name: "Encryption & Integrity Signer"
    technology: "HMAC-SHA256 signing"
    description: "Cryptographically signs log batches to ensure integrity."
  - type: "component"
    name: "Local Buffer & Retry Manager"
    technology: "Disk-backed buffering"
    description: "Persists signed log batches locally and manages retry logic."
  - type: "component"
    name: "WORM Storage Exporter"
    technology: "HTTPS / S3 API"
    description: "Replays and writes immutable log batches to secure storage."
relationships:
  - source: "Log Input Collector"
    destination: "Compliance Filter & Transformer"
    description: "Gathers local logs [UNIX sockets / In-process]"
  - source: "Compliance Filter & Transformer"
    destination: "Encryption & Integrity Signer"
    description: "Passes sanitized batches [In-process]"
  - source: "Encryption & Integrity Signer"
    destination: "Local Buffer & Retry Manager"
    description: "Persists signed batches [Local File I/O]"
  - source: "Local Buffer & Retry Manager"
    destination: "WORM Storage Exporter"
    description: "Replays log batches [In-process]"