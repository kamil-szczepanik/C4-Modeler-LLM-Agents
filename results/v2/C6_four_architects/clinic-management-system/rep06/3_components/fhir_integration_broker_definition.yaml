level: component
scope: "Component diagram for the FHIR Integration Broker container"
parentContainer:
  name: "FHIR Integration Broker"
elements:
  - type: "component"
    name: "External Labs & Imaging Systems"
    technology: "HTTPS / REST, JSON/XML"
    description: "External partners exchanging medical data"
  - type: "component"
    name: "FHIR API Route Engine"
    technology: "Apache Camel REST DSL"
    description: "Exposes RESTful FHIR endpoints"
  - type: "component"
    name: "FHIR Security & Validation Interceptor"
    technology: "Camel Policy / JSON Schema Validator"
    description: "Enforces access control and schema validation"
  - type: "component"
    name: "Data Transformation Processor"
    technology: "Apache Camel / Python"
    description: "Translates payloads to standardized FHIR resources"
  - type: "component"
    name: "FHIR Persistence Adapter"
    technology: "Python FastAPI / SQLAlchemy"
    description: "Manages transactional persistence and database queries"
  - type: "component"
    name: "FHIR Outbound Dispatcher"
    technology: "Camel HTTP4 / Webhook Client"
    description: "Manages outgoing FHIR queries and event notifications"
  - type: "component"
    name: "FHIR Audit & Compliance Logger"
    technology: "Camel / Python / Fluentbit"
    description: "Captures transactions for immutable audit logging"
  - type: "component"
    name: "Async Message Broker"
    technology: "Apache Kafka / RabbitMQ"
    description: "Propagates domain events"
  - type: "component"
    name: "Audit & Compliance Log Shipper"
    technology: "Fluentbit / Vector"
    description: "Forwards audit payloads"
relationships:
  - source: "External Labs & Imaging Systems"
    destination: "FHIR API Route Engine"
    description: "Submits lab and imaging data [HTTPS / REST, JSON/XML]"
  - source: "FHIR API Route Engine"
    destination: "FHIR Security & Validation Interceptor"
    description: "Delegates incoming requests [In-Memory Route]"
  - source: "FHIR Security & Validation Interceptor"
    destination: "Data Transformation Processor"
    description: "Forwards validated payloads [In-Memory Route]"
  - source: "Data Transformation Processor"
    destination: "FHIR Persistence Adapter"
    description: "Sends normalized resources [gRPC]"
  - source: "Data Transformation Processor"
    destination: "FHIR Outbound Dispatcher"
    description: "Forwards outbound payloads [In-Memory Route]"
  - source: "FHIR Outbound Dispatcher"
    destination: "External Labs & Imaging Systems"
    description: "Dispatches notifications [HTTPS / REST, JSON/XML]"
  - source: "FHIR Security & Validation Interceptor"
    destination: "FHIR Audit & Compliance Logger"
    description: "Emits audit events [Asynchronous In-Memory Queue]"
  - source: "FHIR Audit & Compliance Logger"
    destination: "Audit & Compliance Log Shipper"
    description: "Writes audit payloads [Local Unix Domain Socket / File Tail]"
  - source: "FHIR Persistence Adapter"
    destination: "Async Message Broker"
    description: "Publishes domain events [AMQP/TCP]"