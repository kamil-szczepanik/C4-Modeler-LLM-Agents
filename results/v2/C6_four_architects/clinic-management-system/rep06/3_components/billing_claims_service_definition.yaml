level: component
scope: "Component diagram for the Billing & Claims Service container"
parentContainer:
  name: "Billing & Claims Service"
elements:
  - type: "component"
    name: "Claim Processing Engine"
    technology: ".NET Core / MediatR"
    description: "Processes insurance claims and manages workflow logic."
  - type: "component"
    name: "Invoice & Ledger API Controller"
    technology: ".NET Core ASP.NET Web API"
    description: "Handles synchronous billing requests and payment status queries."
  - type: "component"
    name: "Insurance Gateway Adapter"
    technology: ".NET Core HttpClient / Polly"
    description: "Processes insurance claims and payments with external gateways."
  - type: "component"
    name: "Billing Data Repository"
    technology: "Entity Framework Core"
    description: "Interfaces with the patient database using connection pooling."
  - type: "component"
    name: "Event Dispatcher Worker"
    technology: ".NET Core BackgroundService"
    description: "Publishes domain events to the async message broker."
  - type: "component"
    name: "Billing Audit Interceptor"
    technology: "EF Core SaveChangesInterceptor"
    description: "Forwards immutable audit logs asynchronously to the log shipper."
  - type: "component"
    name: "Claim Event Consumer"
    technology: ".NET Core BackgroundService / MassTransit"
    description: "Consumes domain events from the async message broker."
  - type: "component"
    name: "Billing Local Cache Manager"
    technology: "StackExchange.Redis"
    description: "Temporarily stores tariff schedules and rules."
  - type: "component"
    name: "PHI Masking & Tokenization Engine"
    technology: ".NET Core Middleware"
    description: "Ensures data compliance and privacy for PHI."
  - type: "component"
    name: "Health & Circuit Breaker Health Check Endpoint"
    technology: ".NET Core HealthChecks"
    description: "Monitors health and implements circuit breaker patterns."
relationships:
  - source: "Invoice & Ledger API Controller"
    destination: "External Clients"
    description: "Handles synchronous billing requests and payment status queries [HTTPS]"
  - source: "Insurance Gateway Adapter"
    destination: "Insurance Payment Gateway"
    description: "Processes insurance claims and payments [External HTTPS]"
  - source: "Billing Data Repository"
    destination: "Patient DB"
    description: "Interfaces with PostgreSQL using connection pooling [SQL/TCP]"
  - source: "Event Dispatcher Worker"
    destination: "Async Message Broker"
    description: "Publishes and consumes domain events [AMQP/TCP]"
  - source: "Claim Event Consumer"
    destination: "Async Message Broker"
    description: "Publishes and consumes domain events [AMQP/TCP]"
  - source: "Billing Audit Interceptor"
    destination: "Audit & Compliance Log Shipper"
    description: "Forwards immutable audit logs asynchronously [Fluentbit/Vector]"
  - source: "Billing Local Cache Manager"
    destination: "Distributed Cache"
    description: "Temporarily stores tariff schedules and rules [Redis Protocol]"