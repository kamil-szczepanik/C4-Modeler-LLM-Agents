level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Doctor"
    description: "Medical professional who manages patient care, admissions, and electronic medical records."
  - type: "person"
    name: "Nurse"
    description: "Healthcare worker who assists in patient care and record updates."
  - type: "person"
    name: "Receptionist"
    description: "Front-desk staff responsible for patient scheduling and admissions."
  - type: "person"
    name: "Billing Officer"
    description: "Financial staff handling billing and insurance interactions."
  - type: "person"
    name: "Patient"
    description: "Recipient of medical care interacting with the system for scheduling and records."
  - type: "person"
    name: "Regulatory/Audit Authority"
    description: "Authority checking compliance and audit logs for regulatory standards."
  - type: "externalSystem"
    name: "Insurance Payment Gateway"
    description: "External payment processing system for handling insurance claims and billing."
  - type: "container"
    name: "Frontend Web App"
    technology: "React SPA"
    description: "User-facing web application for interacting with the clinic management system."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx / Kong"
    description: "Entry point handling incoming traffic, routing, and security."
  - type: "container"
    name: "Identity & Access Proxy"
    technology: "OAuth2 Proxy / Keycloak Sidecar"
    description: "Handles identity verification and access proxying."
  - type: "container"
    name: "Patient & Scheduling Service"
    technology: "Java / Spring Boot"
    description: "Manages patient admissions and appointment scheduling."
  - type: "container"
    name: "EMR Service"
    technology: "Node.js / TypeScript"
    description: "Manages electronic medical records."
  - type: "container"
    name: "Billing & Claims Service"
    technology: ".NET Core"
    description: "Manages billing operations and insurance claims."
  - type: "container"
    name: "FHIR Integration Broker"
    technology: "Apache Camel / Python"
    description: "Integrates healthcare data using the FHIR standard."
  - type: "container"
    name: "Async Message Broker"
    technology: "Apache Kafka / RabbitMQ"
    description: "Decouples services using event-driven messaging."
  - type: "container"
    name: "Audit & Compliance Log Shipper"
    technology: "Fluentbit / Vector"
    description: "Ships audit logs and compliance data securely."
  - type: "container"
    name: "Patient DB"
    technology: "PostgreSQL"
    description: "Relational database storing structured scheduling and patient data."
  - type: "container"
    name: "EMR DB"
    technology: "MongoDB"
    description: "NoSQL database storing flexible EMR payloads."
  - type: "container"
    name: "Distributed Cache"
    technology: "Redis"
    description: "Provides sub-second EMR retrieval and session caching."
  - type: "container"
    name: "Audit Data Store"
    technology: "AWS S3 / MinIO WORM"
    description: "Stores audit logs with 10-year WORM retention."
relationships:
  - source: "Doctor"
    destination: "Frontend Web App"
    description: "Accesses patient admissions, records, and scheduling"
    technology: "HTTPS"
  - source: "Nurse"
    destination: "Frontend Web App"
    description: "Manages patient records and scheduling"
    technology: "HTTPS"
  - source: "Receptionist"
    destination: "Frontend Web App"
    description: "Handles patient admissions and scheduling"
    technology: "HTTPS"
  - source: "Billing Officer"
    destination: "Frontend Web App"
    description: "Manages billing operations"
    technology: "HTTPS"
  - source: "Patient"
    destination: "Frontend Web App"
    description: "Views appointments and medical information"
    technology: "HTTPS"
  - source: "Regulatory/Audit Authority"
    destination: "Frontend Web App"
    description: "Reviews audit logs and compliance data"
    technology: "HTTPS"
  - source: "Frontend Web App"
    destination: "API Gateway"
    description: "Sends client requests"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Identity & Access Proxy"
    description: "Authenticates requests"
    technology: "Internal gRPC"
  - source: "API Gateway"
    destination: "Patient & Scheduling Service"
    description: "Routes requests to patient and scheduling domain"
    technology: "gRPC"
  - source: "API Gateway"
    destination: "EMR Service"
    description: "Routes requests to EMR domain"
    technology: "gRPC"
  - source: "Patient & Scheduling Service"
    destination: "Async Message Broker"
    description: "Publishes and consumes events"
    technology: "AMQP/TCP"
  - source: "EMR Service"
    destination: "Async Message Broker"
    description: "Publishes and consumes events"
    technology: "AMQP/TCP"
  - source: "Billing & Claims Service"
    destination: "Async Message Broker"
    description: "Publishes and consumes events"
    technology: "AMQP/TCP"
  - source: "FHIR Integration Broker"
    destination: "Async Message Broker"
    description: "Publishes and consumes synchronization events"
    technology: "AMQP/TCP"
  - source: "Patient & Scheduling Service"
    destination: "Patient DB"
    description: "Reads and writes structured patient data"
    technology: "TLS-encrypted SQL driver"
  - source: "EMR Service"
    destination: "EMR DB"
    description: "Reads and writes EMR payloads"
    technology: "TLS-encrypted NoSQL driver"
  - source: "EMR Service"
    destination: "Distributed Cache"
    description: "Retrieves cached EMR data"
    technology: "Redis Protocol"
  - source: "Billing & Claims Service"
    destination: "Insurance Payment Gateway"
    description: "Processes insurance claims and payments"
    technology: "External HTTPS"
  - source: "Audit & Compliance Log Shipper"
    destination: "Audit Data Store"
    description: "Writes compliance logs securely"
    technology: "HTTPS/S3 API"