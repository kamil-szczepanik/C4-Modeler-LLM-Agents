level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed for medium-sized hospitals and clinics to securely manage patient admissions, electronic medical records, scheduling, and billing while ensuring high availability and compliance with HIPAA and GDPR."
elements:
  - type: "person"
    name: "Doctor"
    description: "Medical professional who manages patient care, admissions, and electronic medical records."
  - type: "person"
    name: "Nurse"
    description: "Healthcare worker who assists in patient care and record updates."
  - type: "person"
    name: "Receptionist"
    description: "Front-desk staff responsible for patient scheduling and admissions."
  - type: "person"
    name: "Billing Officer"
    description: "Financial staff handling billing and insurance interactions."
  - type: "person"
    name: "Patient"
    description: "Recipient of medical care interacting with the system for scheduling and records."
  - type: "person"
    name: "Regulatory/Audit Authority"
    description: "Authority checking compliance and audit logs for regulatory standards."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system handling user authentication and identity management."
  - type: "externalSystem"
    name: "External Labs & Imaging Systems"
    description: "External medical systems providing lab results and medical imaging via HL7 FHIR."
  - type: "externalSystem"
    name: "Insurance Payment Gateway"
    description: "External payment processing system for handling insurance claims and billing."
  - type: "externalSystem"
    name: "Hospital Notification/SMS Gateway"
    description: "External gateway used for sending notifications and SMS messages to users and patients."
  - type: "container"
    name: "API Gateway / Edge Proxy"
    description: "AWS-hosted entry point handling incoming traffic and routing."
  - type: "container"
    name: "Scheduling & Billing Services"
    description: "AWS-hosted stateless scalable services for managing clinic schedules and financial billing."
  - type: "container"
    name: "EMR & Patient Records Service"
    description: "On-premises service managing sensitive electronic medical records."
  - type: "container"
    name: "FHIR Integration Broker"
    description: "On-premises broker handling HL7 FHIR interoperability with external medical systems."
  - type: "container"
    name: "Audit Logging Service & Storage"
    description: "On-premises service recording audit logs for compliance."
  - type: "container"
    name: "EMR Secure Datastore"
    description: "AES-256 encrypted relational database storing sensitive patient records on-premises."
  - type: "container"
    name: "Message Broker / Event Bus"
    description: "Kafka/RabbitMQ shared infrastructure providing asynchronous messaging."
  - type: "container"
    name: "Transactional Datastore"
    description: "Managed PostgreSQL/Aurora transactional database hosted in AWS."
relationships:
  - source: "Doctor"
    destination: "API Gateway / Edge Proxy"
    description: "Accesses patient admissions, records, and scheduling via secure interface"
    technology: "HTTPS and OAuth2/OIDC with MFA via TLS 1.3"
  - source: "Nurse"
    destination: "API Gateway / Edge Proxy"
    description: "Manages patient records and scheduling via secure interface"
    technology: "HTTPS and OAuth2/OIDC with MFA via TLS 1.3"
  - source: "Receptionist"
    destination: "API Gateway / Edge Proxy"
    description: "Handles patient admissions and scheduling"
    technology: "HTTPS and OAuth2/OIDC with MFA via TLS 1.3"
  - source: "Billing Officer"
    destination: "API Gateway / Edge Proxy"
    description: "Manages billing operations"
    technology: "HTTPS and OAuth2/OIDC with MFA via TLS 1.3"
  - source: "Patient"
    destination: "API Gateway / Edge Proxy"
    description: "Views appointments and medical information"
    technology: "HTTPS and OAuth2/OIDC with MFA via TLS 1.3"
  - source: "Regulatory/Audit Authority"
    destination: "API Gateway / Edge Proxy"
    description: "Reviews audit logs and compliance data"
    technology: "HTTPS and OAuth2/OIDC with MFA via TLS 1.3"
  - source: "API Gateway / Edge Proxy"
    destination: "Scheduling & Billing Services"
    description: "Routes internal requests to microservices"
    technology: "gRPC over mTLS"
  - source: "API Gateway / Edge Proxy"
    destination: "EMR & Patient Records Service"
    description: "Routes internal requests to EMR service"
    technology: "gRPC over mTLS"
  - source: "EMR & Patient Records Service"
    destination: "EMR Secure Datastore"
    description: "Reads and writes encrypted patient data"
    technology: "PostgreSQL wire protocol over mTLS with AES-256"
  - source: "FHIR Integration Broker"
    destination: "External Labs & Imaging Systems"
    description: "Exchanges clinical data with external systems"
    technology: "HL7 FHIR over HTTPS"
  - source: "Scheduling & Billing Services"
    destination: "Insurance Payment Gateway"
    description: "Processes insurance claims and payments"
    technology: "REST over TLS 1.3"
  - source: "Scheduling & Billing Services"
    destination: "Hospital Notification/SMS Gateway"
    description: "Sends automated notifications and SMS"
    technology: "REST over TLS 1.3"
  - source: "EMR & Patient Records Service"
    destination: "Audit Logging Service & Storage"
    description: "Sends audit logs for compliance tracking"
    technology: "gRPC over mTLS"