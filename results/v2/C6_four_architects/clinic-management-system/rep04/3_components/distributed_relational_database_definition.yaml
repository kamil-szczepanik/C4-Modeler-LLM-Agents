level: component
scope: "Component diagram for the Distributed Relational Database container"
parentContainer:
  name: "Distributed Relational Database"
elements:
  - type: "component"
    name: "SQL Layer (Distributed Query Engine)"
    technology: "CockroachDB SQL Parser / Optimizer"
    description: "Parses and optimizes SQL queries."
  - type: "component"
    name: "Transaction Coordinator / Raft Consensus Engine"
    technology: "CockroachDB Raft / Multi-Raft"
    description: "Coordinates reads and writes using Raft consensus."
  - type: "component"
    name: "Storage Engine (RocksDB)"
    technology: "RocksDB via Go wrapper"
    description: "Persists key-value ranges locally."
  - type: "component"
    name: "Encryption & Key Management Subsystem"
    technology: "CockroachDB Enterprise Security / OpenSSL"
    description: "Handles encryption and security operations."
  - type: "component"
    name: "Change-Data-Capture (CDC) Streamer"
    technology: "CockroachDB Changefeeds / gRPC"
    description: "Streams transactional change feeds."
  - type: "component"
    name: "Connection & Pool Manager"
    technology: "Built-in SQL Proxy / PgBouncer"
    description: "Manages client connections and pooling."
  - type: "component"
    name: "Microservices"
    technology: "PostgreSQL wire protocol over TLS 1.3"
    description: "External microservices persisting data."
  - type: "component"
    name: "Key Management Service (Vault / Cloud KMS)"
    technology: "HTTPS / REST over TLS 1.3"
    description: "External key management service for fetching and rotating keys."
  - type: "component"
    name: "Message Broker (Apache Kafka)"
    technology: "gRPC / Kafka Protocol over TLS 1.3"
    description: "External message broker for publishing change feeds."
relationships:
  - source: "Microservices"
    destination: "Connection & Pool Manager"
    description: "Persists data [PostgreSQL wire protocol over TLS 1.3]"
  - source: "Encryption & Key Management Subsystem"
    destination: "Key Management Service (Vault / Cloud KMS)"
    description: "Fetches and rotates encryption keys [HTTPS / REST over TLS 1.3]"
  - source: "Change-Data-Capture (CDC) Streamer"
    destination: "Message Broker (Apache Kafka)"
    description: "Publishes transactional change feeds [gRPC / Kafka Protocol over TLS 1.3]"
  - source: "Connection & Pool Manager"
    destination: "SQL Layer (Distributed Query Engine)"
    description: "Forwards authenticated queries [In-memory function calls]"
  - source: "SQL Layer (Distributed Query Engine)"
    destination: "Transaction Coordinator / Raft Consensus Engine"
    description: "Coordinates reads and writes [Multi-Raft]"
  - source: "Transaction Coordinator / Raft Consensus Engine"
    destination: "Storage Engine (RocksDB)"
    description: "Persists key-value ranges locally [RocksDB API via CGO]"
  - source: "Storage Engine (RocksDB)"
    destination: "Transaction Coordinator / Raft Consensus Engine"
    description: "Persists key-value ranges locally [RocksDB API via CGO]"