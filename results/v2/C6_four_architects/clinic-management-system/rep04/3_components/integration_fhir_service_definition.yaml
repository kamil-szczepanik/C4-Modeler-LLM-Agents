level: component
scope: "Component diagram for the Integration / FHIR Service container"
parentContainer:
  name: "Integration / FHIR Service"
elements:
  - type: "component"
    name: "FHIR Facade Controller"
    technology: "Node.js & TypeScript"
    description: "Handles incoming FHIR API requests and coordinates routing."
  - type: "component"
    name: "Authentication & SMART-on-FHIR Authorizer"
    technology: "Node.js & TypeScript"
    description: "Enforces security policies and SMART-on-FHIR authorization."
  - type: "component"
    name: "FHIR-to-Domain Mapper"
    technology: "Node.js & TypeScript"
    description: "Translates between FHIR resources and internal domain models."
  - type: "component"
    name: "Outbound Sync Engine"
    technology: "Node.js & TypeScript"
    description: "Manages outbound synchronization and forwards sync payloads."
  - type: "component"
    name: "FHIR Storage Repository"
    technology: "Node.js & TypeScript"
    description: "Interacts with persistent storage for FHIR resources."
  - type: "component"
    name: "Audit & Compliance Interceptor"
    technology: "Node.js & TypeScript"
    description: "Logs requests and ensures HIPAA/GDPR compliance measures."
  - type: "component"
    name: "FHIR Profile Validator"
    technology: "Node.js & TypeScript"
    description: "Validates incoming FHIR payloads against defined profiles."
  - type: "component"
    name: "FHIR Caching Manager"
    technology: "Node.js & TypeScript"
    description: "Manages caching layers for frequent FHIR resources."
relationships:
  - source: "FHIR Facade Controller"
    destination: "FHIR Caching Manager"
    description: "Caches resources [TCP over TLS 1.3 to Redis Enterprise]"
  - source: "Integration / FHIR Service"
    destination: "Message Broker / Event Bus"
    description: "Publishes domain events [Kafka producer, JSON over TCP]"
  - source: "Integration / FHIR Service"
    destination: "Distributed Relational Database"
    description: "Persists canonical data [PostgreSQL wire protocol over TLS 1.3]"
  - source: "Outbound Sync Engine"
    destination: "FHIR Integration Broker"
    description: "Forwards sync payloads [gRPC over mTLS]"