level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "TLS Termination Ingress"
    technology: "Kong / Envoy"
    description: "Handles incoming HTTPS and WSS traffic and terminates TLS."
  - type: "component"
    name: "Auth & JWT Filter"
    technology: "Kong / Envoy Plugin"
    description: "Performs OIDC and JWKS verification via HTTPS with the Identity Provider."
  - type: "component"
    name: "Rate Limiting Engine"
    technology: "Kong / Envoy Plugin"
    description: "Enforces traffic rate limits across client requests."
  - type: "component"
    name: "Routing & Load Balancing Proxy"
    technology: "Kong / Envoy Proxy"
    description: "Routes requests to backend microservices using gRPC over mTLS via Istio."
  - type: "component"
    name: "Audit & Request Logging Interceptor"
    technology: "Kong / Envoy Plugin"
    description: "Sends audit logs and request records to Apache Kafka over mTLS."
  - type: "component"
    name: "Circuit Breaker Module"
    technology: "Kong / Envoy Plugin"
    description: "Prevents cascading failures by breaking circuits during service degradation."
  - type: "component"
    name: "Request Transformation Filter"
    technology: "Kong / Envoy Plugin"
    description: "Modifies and normalizes incoming request and response payloads."
  - type: "component"
    name: "Token Cache Manager"
    technology: "Redis / In-Memory Cache"
    description: "Caches authentication tokens for fast validation."
relationships:
  - source: "Auth & JWT Filter"
    destination: "Identity Provider"
    description: "OIDC / JWKS verification via HTTPS"
  - source: "Audit & Request Logging Interceptor"
    destination: "Apache Kafka"
    description: "Kafka Protocol over mTLS"
  - source: "Routing & Load Balancing Proxy"
    destination: "Spring Boot Core Clinical"
    description: "gRPC over mTLS via Istio"
  - source: "Routing & Load Balancing Proxy"
    destination: "Go Scheduling"
    description: "gRPC over mTLS via Istio"
  - source: "Routing & Load Balancing Proxy"
    destination: ".NET Billing & Claims"
    description: "gRPC over mTLS via Istio"
  - source: "Routing & Load Balancing Proxy"
    destination: "Node.js Integration/FHIR"
    description: "gRPC over mTLS via Istio"