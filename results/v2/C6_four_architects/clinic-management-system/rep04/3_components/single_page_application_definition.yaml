level: component
scope: "Component diagram for the Single-Page Application container"
parentContainer:
  name: "Single-Page Application"
elements:
  - type: "component"
    name: "Router"
    technology: "React Router / TypeScript"
    description: "Manages client-side navigation and view rendering."
  - type: "component"
    name: "Auth"
    technology: "TypeScript / OAuth2/OIDC Client"
    description: "Handles user authentication and session management."
  - type: "component"
    name: "API Client"
    technology: "TypeScript / TanStack Query"
    description: "Communicates with the backend API Gateway via HTTPS/WSS."
  - type: "component"
    name: "UI Modules"
    technology: "React / TypeScript / Redux Toolkit / Zustand"
    description: "Implements user interfaces for Doctors, Nurses, Receptionists, and Billing Staff."
  - type: "component"
    name: "Security Interceptor"
    technology: "TypeScript"
    description: "Injects security headers and tokens into outgoing requests."
  - type: "component"
    name: "Telemetry"
    technology: "OpenTelemetry"
    description: "Collects and reports client-side metrics and telemetry data."
  - type: "component"
    name: "Encryption Manager"
    technology: "Web Crypto API"
    description: "Handles client-side encryption for sensitive data."
relationships:
  - source: "Auth"
    destination: "API Client"
    description: "Provides authentication tokens"
  - source: "Security Interceptor"
    destination: "API Client"
    description: "Intercepts and secures requests"
  - source: "UI Modules"
    destination: "API Client"
    description: "Sends data requests"
  - source: "API Client"
    destination: "API Gateway"
    description: "Sends requests via HTTPS / WSS"