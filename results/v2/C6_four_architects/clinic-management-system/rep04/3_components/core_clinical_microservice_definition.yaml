level: component
scope: "Component diagram for the Core Clinical Microservice container"
parentContainer:
  name: "Core Clinical Microservice"
elements:
  - type: "component"
    name: "Patient Management Controller"
    technology: "Spring Boot Controller"
    description: "Handles patient admission and profile HTTP/gRPC requests."
  - type: "component"
    name: "EMR Service Bean"
    technology: "Spring Service"
    description: "Encapsulates business logic for electronic medical records."
  - type: "component"
    name: "Clinical Data Repository Adapter"
    technology: "Spring Data JPA / PostgreSQL Driver"
    description: "Manages data access and persistence to the distributed relational database."
  - type: "component"
    name: "Security & Context Interceptor"
    technology: "Spring Security / OAuth2 / JWT"
    description: "Enforces RBAC/ABAC and validates security contexts for incoming requests."
  - type: "component"
    name: "Clinical Event Publisher"
    technology: "Spring Kafka Template"
    description: "Publishes asynchronous clinical events to the message broker."
  - type: "component"
    name: "Clinical Cache Manager"
    technology: "Spring Data Redis"
    description: "Reads and invalidates cached records in the state caching layer."
  - type: "component"
    name: "Audit & Compliance Interceptor"
    technology: "Spring Aspect / Java Interceptor"
    description: "Captures audit logs for HIPAA and GDPR compliance."
  - type: "component"
    name: "Global Exception & Validation Handler"
    technology: "Spring Web ExceptionHandler"
    description: "Handles global validation and exception mapping."
relationships:
  - source: "Patient Management Controller"
    destination: "Security & Context Interceptor"
    description: "Passes requests for authentication and authorization"
  - source: "Security & Context Interceptor"
    destination: "EMR Service Bean"
    description: "Delegates verified requests to business logic"
  - source: "EMR Service Bean"
    destination: "Clinical Data Repository Adapter"
    description: "Executes database transactions"
  - source: "EMR Service Bean"
    destination: "Clinical Event Publisher"
    description: "Triggers asynchronous events"
  - source: "EMR Service Bean"
    destination: "Clinical Cache Manager"
    description: "Reads and writes session/record states"
  - source: "EMR Service Bean"
    destination: "Audit & Compliance Interceptor"
    description: "Logs access for compliance tracking"
  - source: "Patient Management Controller"
    destination: "Global Exception & Validation Handler"
    description: "Forwards exceptions for uniform handling"