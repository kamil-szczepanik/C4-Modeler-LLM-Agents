level: component
scope: "Component diagram for the Audit Log Store container"
parentContainer:
  name: "Audit Log Store"
elements:
  - type: "component"
    name: "Log Ingestion API Component"
    technology: "Go / gRPC"
    description: "High-performance, secure audit event ingestion."
  - type: "component"
    name: "Tamper-Evident Hashing Engine"
    technology: "SHA-256 Merkle Tree Processor"
    description: "Cryptographic chaining for log immutability and tamper detection."
  - type: "component"
    name: "Primary Storage Indexer"
    technology: "Elasticsearch / OpenSearch"
    description: "Fast compliance querying with role-based access control."
  - type: "component"
    name: "Long-Term Archival Manager"
    technology: "S3 Glacier Object Lock / WORM Storage"
    description: "Cost-effective WORM storage for 10-year retention compliance."
  - type: "component"
    name: "Compliance Query Interface"
    technology: "REST / HTTPS"
    description: "Provides compliance query interface for auditors and compliance services."
  - type: "component"
    name: "Key Management & Encryption Component"
    technology: "HashiCorp Vault Integration"
    description: "HSM-backed envelope encryption and zero-knowledge verification."
  - type: "component"
    name: "Core Clinical Microservice"
    technology: "Microservice"
    description: "Core clinical microservice sending logs to ingestion API."
  - type: "component"
    name: "Auditor / Compliance Service"
    technology: "External Service"
    description: "Accesses compliance query interface for auditing."
  - type: "component"
    name: "Vault / Cloud KMS"
    technology: "Cloud KMS / Vault"
    description: "External key management service for encryption."
  - type: "component"
    name: "Message Broker"
    technology: "Apache Kafka"
    description: "Decoupled, asynchronous event streaming to protect clinical performance."
  - type: "component"
    name: "Observability & Telemetry Collector"
    technology: "OpenTelemetry"
    description: "Collects telemetry data from the compliance query interface."
relationships:
  - source: "Core Clinical Microservice"
    destination: "Log Ingestion API Component"
    description: "Invokes via gRPC/TLS"
  - source: "Log Ingestion API Component"
    destination: "Tamper-Evident Hashing Engine"
    description: "Invokes via Internal Method Call"
  - source: "Tamper-Evident Hashing Engine"
    destination: "Primary Storage Indexer"
    description: "Sends data via Internal Channel"
  - source: "Primary Storage Indexer"
    destination: "Long-Term Archival Manager"
    description: "Archives data via HTTPS"
  - source: "Auditor / Compliance Service"
    destination: "Compliance Query Interface"
    description: "Queries via HTTPS/mTLS"
  - source: "Tamper-Evident Hashing Engine"
    destination: "Key Management & Encryption Component"
    description: "Requests keys via gRPC/TLS"
  - source: "Primary Storage Indexer"
    destination: "Vault / Cloud KMS"
    description: "Encrypts data via HTTPS (AES-256)"
  - source: "Message Broker"
    destination: "Log Ingestion API Component"
    description: "Streams events via Kafka Consumer Protocol (TLS)"
  - source: "Compliance Query Interface"
    destination: "Observability & Telemetry Collector"
    description: "Sends telemetry via OpenTelemetry (gRPC)"