level: component
scope: "Component diagram for the Billing & Claims Microservice container"
parentContainer:
  name: "Billing & Claims Microservice"
elements:
  - type: "component"
    name: "ClaimsController"
    technology: ".NET ASP.NET Core Web API"
    description: "Manages secure invoice generation, insurance claim processing, and real-time payment operations."
  - type: "component"
    name: "BillingEngine"
    technology: ".NET Class Library"
    description: "Enforces strict business orchestration rules and coordinates payment processing."
  - type: "component"
    name: "ClaimsProcessor"
    technology: ".NET Class Library"
    description: "Processes insurance claims and coordinates external clearinghouse communication."
  - type: "component"
    name: "ClearinghouseAdapter"
    technology: ".NET HttpClient/WCF"
    description: "Handles external integration for insurance claim clearinghouses via HTTPS/SOAP."
  - type: "component"
    name: "PaymentGatewayClient"
    technology: ".NET HttpClient with Polly"
    description: "Manages external payment gateway integrations with built-in resilience and circuit-breaking."
  - type: "component"
    name: "DataRepository"
    technology: "Entity Framework Core"
    description: "Database ORM and persistence mapping for billing and claims data."
  - type: "component"
    name: "EventPublisher"
    technology: ".NET / Confluent.Kafka"
    description: "Asynchronous event publishing using CloudEvents."
  - type: "component"
    name: "BillingAuditInterceptor"
    technology: "EF Core Interceptor"
    description: "Intercepts save operations to ensure HIPAA logging and audit traceability."
relationships:
  - source: "ClaimsController"
    destination: "BillingEngine"
    description: "In-memory C# method calls"
  - source: "ClaimsController"
    destination: "ClaimsProcessor"
    description: "In-memory C# method calls"
  - source: "ClaimsProcessor"
    destination: "ClearinghouseAdapter"
    description: "External integration [HTTPS / SOAP]"
  - source: "BillingEngine"
    destination: "PaymentGatewayClient"
    description: "External integration [HTTPS / REST]"
  - source: "DataRepository"
    destination: "BillingAuditInterceptor"
    description: "Intercepts save operations for HIPAA logging"
  - source: "EventPublisher"
    destination: "Apache Kafka"
    description: "Asynchronous event publishing [CloudEvents]"