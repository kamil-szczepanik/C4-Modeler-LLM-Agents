level: component
scope: "Component diagram for the State Caching Layer container"
parentContainer:
  name: "State Caching Layer"
elements:
  - type: "component"
    name: "Cache Router / Proxy"
    technology: "Envoy Proxy (sidecar)"
    description: "Secures TCP/RESP traffic and enforces TLS termination, routing and invalidating session & EMR cache."
  - type: "component"
    name: "In-Memory Store"
    technology: "Redis Enterprise Core"
    description: "Core in-memory storage providing sub-second P95 performance for patient state and EMR."
  - type: "component"
    name: "At-Rest Encryption Engine"
    technology: "Custom module with AES-256"
    description: "Secures sensitive PHI before persistence."
  - type: "component"
    name: "Replication & Sync Manager"
    technology: "Redis Enterprise Active-Active CRDT Modules"
    description: "Enables WAN-optimized multi-region synchronization for 99.99% availability."
  - type: "component"
    name: "Audit & TTL Enforcer"
    technology: "Redis Functions / Lua Scripting"
    description: "Triggers audit logging for sensitive PHI cache accesses and enforces TTLs."
  - type: "component"
    name: "Cache Warmup & Hydration Worker"
    technology: "Go background worker"
    description: "Fetches baseline clinical state and populates initial cache keys."
  - type: "component"
    name: "Core Clinical, Scheduling, and Billing Microservices"
    technology: "Microservices"
    description: "External microservices that query and invalidate session & EMR cache."
  - type: "component"
    name: "Key Management Service (Vault / Cloud KMS)"
    technology: "Vault / Cloud KMS"
    description: "Manages AES-256 keys for strict HIPAA/GDPR encryption."
  - type: "component"
    name: "Audit Log Store (Elasticsearch)"
    technology: "Elasticsearch"
    description: "Immutable storage for compliance and audit logging."
  - type: "component"
    name: "Distributed Relational Database (CockroachDB)"
    technology: "CockroachDB"
    description: "Holds baseline clinical state."
relationships:
  - source: "Core Clinical, Scheduling, and Billing Microservices"
    destination: "Cache Router / Proxy"
    description: "Queries and invalidates session & EMR cache [TLS / RESP]"
  - source: "In-Memory Store"
    destination: "At-Rest Encryption Engine"
    description: "Secures sensitive PHI before persistence [Internal API]"
  - source: "In-Memory Store"
    destination: "Replication & Sync Manager"
    description: "Replicates state changes across hybrid regions [TLS / Redis Cluster Bus]"
  - source: "At-Rest Encryption Engine"
    destination: "Key Management Service (Vault / Cloud KMS)"
    description: "Retrieves and rotates data encryption keys [gRPC / TLS]"
  - source: "Cache Router / Proxy"
    destination: "Audit & TTL Enforcer"
    description: "Triggers audit logging for sensitive PHI cache accesses [Internal Function Call]"
  - source: "Audit & TTL Enforcer"
    destination: "Audit Log Store (Elasticsearch)"
    description: "Streams compliance events [gRPC / TLS]"
  - source: "Cache Warmup & Hydration Worker"
    destination: "Distributed Relational Database (CockroachDB)"
    description: "Fetches baseline clinical state [SQL / TLS]"
  - source: "Cache Warmup & Hydration Worker"
    destination: "In-Memory Store"
    description: "Populates initial cache keys [TCP / RESP]"