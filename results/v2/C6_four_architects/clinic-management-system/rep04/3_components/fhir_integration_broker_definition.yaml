level: component
scope: "Component diagram for the FHIR Integration Broker container"
parentContainer:
  name: "FHIR Integration Broker"
elements:
  - type: "component"
    name: "FHIR REST Endpoint Listener"
    technology: "Apache Camel REST DSL on OpenJDK 17"
    description: "Exposes FHIR R4 APIs and listens for incoming requests."
  - type: "component"
    name: "HL7/FHIR Transformation Engine"
    technology: "HAPI FHIR Java Libraries"
    description: "Maps legacy formats to FHIR resources."
  - type: "component"
    name: "Message Router & Enrichener"
    technology: "Apache Camel Content-Based Router"
    description: "Inspects resource types and enriches data."
  - type: "component"
    name: "Kafka Event Publisher"
    technology: "Apache Camel Kafka Connector"
    description: "Publishes standardized events."
  - type: "component"
    name: "Security & Audit Interceptor"
    technology: "Apache Camel policy component"
    description: "Enforces OAuth2/JWT validation and audit logging."
  - type: "component"
    name: "Outbound FHIR Dispatcher"
    technology: "Apache Camel HTTP4/Netty component"
    description: "Pushes notifications and query responses."
  - type: "component"
    name: "Dead Letter & Retry Handler"
    technology: "Apache Camel Dead Letter Channel"
    description: "Captures and retries transient failures."
  - type: "component"
    name: "API Gateway"
    technology: "Gateway Technology"
    description: "External API Gateway sending requests."
  - type: "component"
    name: "Audit Log Service"
    technology: "Audit Service Technology"
    description: "Service receiving compliance and audit records."
  - type: "component"
    name: "External Lab & Imaging Systems"
    technology: "External Systems Technology"
    description: "External systems receiving outbound data."
  - type: "component"
    name: "Apache Kafka"
    technology: "Distributed Event Broker"
    description: "Event broker for reliable asynchronous message delivery."
relationships:
  - source: "API Gateway"
    destination: "FHIR REST Endpoint Listener"
    description: "Sends requests via HTTPS"
  - source: "FHIR REST Endpoint Listener"
    destination: "Security & Audit Interceptor"
    description: "Delegates requests via In-JVM method calls"
  - source: "Security & Audit Interceptor"
    destination: "Audit Log Service"
    description: "Writes compliance records via gRPC/TLS"
  - source: "Outbound FHIR Dispatcher"
    destination: "External Lab & Imaging Systems"
    description: "Transmits data via HTTPS (mTLS)"
  - source: "Kafka Event Publisher"
    destination: "Apache Kafka"
    description: "Send messages via Kafka Wire Protocol"
  - source: "Dead Letter & Retry Handler"
    destination: "Apache Kafka"
    description: "Send messages via Kafka Wire Protocol"