level: component
scope: "Component diagram for the Service Mesh container"
parentContainer:
  name: "Service Mesh"
elements:
  - type: "component"
    name: "Sidecar Proxy (Envoy)"
    technology: "Envoy (C++)"
    description: "High-performance proxy for traffic interception and routing."
  - type: "component"
    name: "Control Plane / Discovery (Istiod)"
    technology: "Istiod (Go)"
    description: "Central control plane for service discovery and configuration."
  - type: "component"
    name: "Authorization Policy Engine"
    technology: "Envoy RBAC / SPIFFE/SPIRE"
    description: "Enforces zero-trust authorization policies across services."
  - type: "component"
    name: "Cross-Network Gateway"
    technology: "Envoy Multi-Cluster Gateway"
    description: "Manages encrypted mTLS traffic between on-premises and AWS environments."
  - type: "component"
    name: "Telemetry Collector Adapter"
    technology: "Envoy OTel extension"
    description: "Collects and forwards metrics and traces via OTLP."
  - type: "component"
    name: "Certificate Authority (CA) Controller"
    technology: "Istiod CA / Citadel with HashiCorp Vault"
    description: "Provides automated X.509 certificate generation and rotation."
relationships:
  - source: "Sidecar Proxy (Envoy)"
    destination: "Microservices"
    description: "Secures communication via mTLS (gRPC/HTTP/2)"
  - source: "Control Plane / Discovery (Istiod)"
    destination: "Sidecar Proxy (Envoy)"
    description: "Configures and manages via xDS API (gRPC)"
  - source: "Sidecar Proxy (Envoy)"
    destination: "Cross-Network Gateway"
    description: "Routes traffic via Encrypted mTLS (TLS Passthrough/Termination over TCP)"
  - source: "Sidecar Proxy (Envoy)"
    destination: "Telemetry Collector Adapter"
    description: "Sends telemetry data via gRPC/OTLP"
  - source: "Certificate Authority (CA) Controller"
    destination: "Sidecar Proxy (Envoy)"
    description: "Provides secrets via Secret Discovery Service (SDS / gRPC)"