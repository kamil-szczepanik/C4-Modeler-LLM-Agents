level: component
scope: "Component diagram for the Key Management Service container"
parentContainer:
  name: "Key Management Service"
elements:
  - type: "component"
    name: "KMS API Gateway Component"
    technology: "Go"
    description: "Standardized ingress interface for cryptographic requests."
  - type: "component"
    name: "Crypto Engine"
    technology: "Go"
    description: "Executes envelope encryption primitives with in-process ephemeral memory."
  - type: "component"
    name: "Key Lifecycle Manager"
    technology: "Go, HashiCorp Vault SDK / Raft"
    description: "Manages automated key rotation, Master Keys (KEKs), and secure shredding."
  - type: "component"
    name: "Audit & Access Control Enforcer"
    technology: "Open Policy Agent (OPA) / Istio"
    description: "Validates mTLS identities and logs key access immutably."
  - type: "component"
    name: "HSM Integration Layer"
    technology: "PKCS#11"
    description: "Abstracts hardware security module interactions for root keys."
  - type: "component"
    name: "Key Replication Synchronizer"
    technology: "HashiCorp Vault SDK / Raft"
    description: "Handles secure cross-region and cross-cluster replication."
  - type: "component"
    name: "Core Clinical Microservice"
    technology: "External Container"
    description: "Invokes KMS API Gateway Component."
  - type: "component"
    name: "CockroachDB (Encrypted)"
    technology: "SQL over TLS"
    description: "Stores encrypted key material."
  - type: "component"
    name: "Audit Log Store"
    technology: "Kafka"
    description: "Receives tamper-resistant audit logs."
relationships:
  - source: "Core Clinical Microservice"
    destination: "KMS API Gateway Component"
    description: "Invokes via gRPC over mTLS"
  - source: "KMS API Gateway Component"
    destination: "Crypto Engine"
    description: "Delegates requests to"
  - source: "Key Lifecycle Manager"
    destination: "HSM Integration Layer"
    description: "Interacts via PKCS#11 / gRPC"
  - source: "Key Lifecycle Manager"
    destination: "Key Replication Synchronizer"
    description: "Uses via gRPC over mTLS"
  - source: "Key Lifecycle Manager"
    destination: "CockroachDB (Encrypted)"
    description: "Reads/writes encrypted key material using SQL over TLS"
  - source: "Audit & Access Control Enforcer"
    destination: "Audit Log Store"
    description: "Streams access logs via Kafka"