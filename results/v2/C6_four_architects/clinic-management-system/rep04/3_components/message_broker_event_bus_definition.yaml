level: component
scope: "Component diagram for the Message Broker / Event Bus container"
parentContainer:
  name: "Message Broker / Event Bus"
elements:
  - type: "component"
    name: "Broker Cluster"
    technology: "Apache Kafka"
    description: "Manages asynchronous CloudEvents production and consumption across microservices."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry"
    description: "Validates event schemas for services like the Core Clinical Microservice."
  - type: "component"
    name: "Kafka Connect"
    technology: "Kafka Connect"
    description: "Streams audit events and offloads historical data to external storage."
  - type: "component"
    name: "Stream Processor"
    technology: "Apache Flink / Kafka Streams"
    description: "Processes data streams within the event bus architecture."
  - type: "component"
    name: "Topic Access Control Manager"
    technology: "Kafka Security Manager"
    description: "Manages access controls for messaging topics."
  - type: "component"
    name: "DLQ Manager"
    technology: "Kafka Dead Letter Queue Handler"
    description: "Handles failed message delivery and dead-letter queues."
  - type: "component"
    name: "Kafka UI"
    technology: "Web-based Kafka Management UI"
    description: "Provides cluster health monitoring and consumer lag tracking for SRE / Operations."
relationships:
  - source: "Core Clinical Microservice"
    destination: "Schema Registry"
    description: "Validates event schemas [HTTP/REST over TLS]"
  - source: "Kafka Connect"
    destination: "Audit Log Store / Immutable Object Storage"
    description: "Streams audit events and offloads historical data [HTTPS]"
  - source: "SRE / Operations"
    destination: "Kafka UI"
    description: "Monitors cluster health and consumer lag [HTTPS]"