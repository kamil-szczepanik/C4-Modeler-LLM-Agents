level: component
scope: "Component diagram for the Scheduling Microservice container"
parentContainer:
  name: "Scheduling Microservice"
elements:
  - type: "component"
    name: "API Handler"
    technology: "Go Router/gRPC"
    description: "Manages incoming mTLS traffic from the API Gateway."
  - type: "component"
    name: "Policy & Consent Evaluator"
    technology: "Go Middleware + Open Policy Agent"
    description: "Enforces HIPAA/GDPR access controls."
  - type: "component"
    name: "Scheduling Engine"
    technology: "Go Domain Logic"
    description: "Implements core scheduling algorithms and conflict detection."
  - type: "component"
    name: "Lock Manager Component"
    technology: "Redis Enterprise"
    description: "Provides distributed locks via TCP/RESP to prevent double-booking."
  - type: "component"
    name: "Calendar Synchronizer"
    technology: "Go Worker"
    description: "Manages asynchronous event publishing using Go channels."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Go Worker"
    description: "Dispatches appointment confirmations and reminders."
  - type: "component"
    name: "Data Access Layer"
    technology: "pgx"
    description: "Manages connection pooling and executes transactional queries."
  - type: "component"
    name: "Message Broker / Event Bus"
    technology: "Apache Kafka"
    description: "Publishes CloudEvents asynchronously."
relationships:
  - source: "API Handler"
    destination: "Policy & Consent Evaluator"
    description: "Intercepts requests for authorization [In-memory function/gRPC]"
  - source: "Scheduling Engine"
    destination: "Lock Manager Component"
    description: "Acquires distributed locks [Redis RESP]"
  - source: "Scheduling Engine"
    destination: "Data Access Layer"
    description: "Commits validated appointments [PostgreSQL wire protocol over TLS 1.3]"
  - source: "Scheduling Engine"
    destination: "Calendar Synchronizer"
    description: "Emits domain events [Go Channels]"
  - source: "Calendar Synchronizer"
    destination: "Message Broker / Event Bus"
    description: "Publishes CloudEvents [Apache Kafka]"