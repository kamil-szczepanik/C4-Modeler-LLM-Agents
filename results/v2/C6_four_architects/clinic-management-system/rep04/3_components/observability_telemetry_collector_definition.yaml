# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Observability & Telemetry Collector container"
parentContainer:
  name: "Observability & Telemetry Collector"
elements:
  - type: "component"
    name: "OpenTelemetry Collector Gateway"
    technology: "OpenTelemetry Collector"
    description: "Receives telemetry data from microservices via gRPC (OTLP)."
  - type: "component"
    name: "Sampling & Retention Policy Enforcer"
    technology: "OpenTelemetry Policy Engine"
    description: "Enforces data sampling and retention policies on collected telemetry."
  - type: "component"
    name: "Data Sanitization Processor"
    technology: "OpenTelemetry Processor"
    description: "Sanitizes PHI and PII from logs, traces, and metrics to ensure HIPAA and GDPR compliance."
  - type: "component"
    name: "Trace & Metrics Processors"
    technology: "OpenTelemetry Processor"
    description: "Processes and transforms trace and metric data streams."
  - type: "component"
    name: "Destination Router"
    technology: "OpenTelemetry Router"
    description: "Dispatches sanitized logs, metrics, and traces to backend monitoring systems."
  - type: "component"
    name: "Health & Readiness Prober"
    technology: "OpenTelemetry Prober"
    description: "Monitors and reports the health and readiness status of the observability pipeline."
relationships:
  - source: "OpenTelemetry Collector Gateway"
    destination: "Sampling & Retention Policy Enforcer"
    description: "Passes incoming telemetry for policy evaluation"
  - source: "Sampling & Retention Policy Enforcer"
    destination: "Data Sanitization Processor"
    description: "Sends sampled data for PHI/PII removal"
  - source: "Data Sanitization Processor"
    destination: "Trace & Metrics Processors"
    description: "Forwards sanitized telemetry for processing"
  - source: "Trace & Metrics Processors"
    destination: "Destination Router"
    description: "Sends processed telemetry to destination router"
  - source: "Destination Router"
    destination: "Prometheus, Loki, and Elasticsearch"
    description: "Dispatches sanitized logs and traces via HTTPS/mTLS"
  - source: "Health & Readiness Prober"
    destination: "OpenTelemetry Collector Gateway"
    description: "Monitors health status"