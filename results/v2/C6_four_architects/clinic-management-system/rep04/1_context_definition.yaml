level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed for medium-sized hospitals and clinics to manage patient admissions, electronic medical records (EMR), scheduling, and billing while ensuring high availability, strict compliance, and clinical interoperability."
elements:
  - type: "person"
    name: "Doctors"
    description: "Clinical staff responsible for patient medical records and care."
  - type: "person"
    name: "Nurses"
    description: "Clinical staff assisting with patient admissions and care management."
  - type: "person"
    name: "Receptionists"
    description: "Administrative staff managing patient scheduling and front-desk admissions."
  - type: "person"
    name: "Billing Staff"
    description: "Administrative staff handling invoicing and payment processing."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system providing authentication and OIDC token validation with MFA."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system for processing patient and insurance payments."
  - type: "externalSystem"
    name: "Insurance Clearinghouse"
    description: "External system for handling insurance claims and verification."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External clinical systems for diagnostic tests and medical imaging."
  - type: "container"
    name: "Edge API Gateway"
    description: "Entry point for users, managing traffic routing and security."
    technology: "Envoy/Kong"
  - type: "container"
    name: "On-Premises Core Service"
    description: "Local core service managing sensitive patient admissions and low-latency scheduling."
    technology: "Java/Spring Boot"
  - type: "container"
    name: "Cloud EMR & Billing Services"
    description: "Cloud-hosted microservices for electronic medical records and billing."
    technology: "Node.js/Python"
  - type: "container"
    name: "Service Mesh Bridge"
    description: "Bridge facilitating secure streaming between on-premises and cloud environments."
    technology: "Istio/Linkerd"
  - type: "container"
    name: "Audit Log Service"
    description: "Service responsible for tracking and recording system audit logs."
    technology: "Microservice"
  - type: "component"
    name: "Admission Controller"
    description: "Handles patient admissions logic on-premises."
    technology: "Java/Spring Boot"
  - type: "component"
    name: "Scheduling Engine"
    description: "Manages appointment scheduling and clash checks."
    technology: "Java/Spring Boot & Redis"
  - type: "component"
    name: "FHIR Interoperability Adapter"
    description: "Adapts clinical data for external lab systems integration."
    technology: "HL7 FHIR"
  - type: "component"
    name: "Security & Authorization Interceptor"
    description: "Enforces security policies and access controls."
    technology: "Spring Security"
  - type: "component"
    name: "Data Access Repository"
    description: "Manages persistence and database interactions."
    technology: "Hibernate/JPA"
  - type: "component"
    name: "Event Publisher Component"
    description: "Publishes domain events for asynchronous streaming."
    technology: "Apache Kafka"
relationships:
  - source: "Doctors"
    destination: "Edge API Gateway"
    description: "Accesses system features via secure web interface"
    technology: "HTTPS/TLS with OIDC token validation"
  - source: "Nurses"
    destination: "Edge API Gateway"
    description: "Accesses system features via secure web interface"
    technology: "HTTPS/TLS with OIDC token validation"
  - source: "Receptionists"
    destination: "Edge API Gateway"
    description: "Accesses system features via secure web interface"
    technology: "HTTPS/TLS with OIDC token validation"
  - source: "Billing Staff"
    destination: "Edge API Gateway"
    description: "Accesses system features via secure web interface"
    technology: "HTTPS/TLS with OIDC token validation"
  - source: "Edge API Gateway"
    destination: "On-Premises Core Service"
    description: "Routes admission and scheduling requests"
    technology: "gRPC over TLS and REST/HTTPS"
  - source: "Edge API Gateway"
    destination: "Cloud EMR & Billing Services"
    description: "Routes EMR and billing requests"
    technology: "REST/HTTPS"
  - source: "On-Premises Core Service"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical data and lab results"
    technology: "HL7 FHIR over REST/TLS"
  - source: "On-Premises Core Service"
    destination: "Cloud EMR & Billing Services"
    description: "Streams clinical and operational data events via Service Mesh Bridge"
    technology: "Apache Kafka streaming with mTLS"