level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed for medium-sized hospitals and clinics to manage patient admissions, electronic medical records (EMR), scheduling, and billing while ensuring high availability, strict compliance, and clinical interoperability."
elements:
  - type: "person"
    name: "Doctors"
    description: "Clinical staff responsible for patient medical records and care."
  - type: "person"
    name: "Nurses"
    description: "Clinical staff assisting with patient admissions and care management."
  - type: "person"
    name: "Receptionists"
    description: "Administrative staff managing patient scheduling and front-desk admissions."
  - type: "person"
    name: "Billing Staff"
    description: "Administrative staff handling invoicing and payment processing."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system providing authentication and OIDC token validation with MFA."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system for processing patient and insurance payments."
  - type: "externalSystem"
    name: "Insurance Clearinghouse"
    description: "External system for handling insurance claims and verification."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External clinical systems for diagnostic tests and medical imaging."
  - type: "container"
    name: "Single-Page Application"
    technology: "React / TypeScript"
    description: "Frontend SPA for responsive user interactions."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / Envoy"
    description: "Manages traffic routing, ingress, and security."
  - type: "container"
    name: "Core Clinical Microservice"
    technology: "Spring Boot"
    description: "Core Clinical microservice for enterprise security and audit features."
  - type: "container"
    name: "Scheduling Microservice"
    technology: "Go"
    description: "Scheduling microservice for high-throughput, low-latency concurrency."
  - type: "container"
    name: "Billing & Claims Microservice"
    technology: ".NET"
    description: "Billing microservice for enterprise integrations and claims."
  - type: "container"
    name: "Integration / FHIR Service"
    technology: "Node.js"
    description: "Connects to external lab and imaging systems via HL7 FHIR APIs."
  - type: "container"
    name: "FHIR Integration Broker"
    technology: "Apache Camel"
    description: "Brokers FHIR and clinical integration messages."
  - type: "container"
    name: "Distributed Relational Database"
    technology: "CockroachDB / PostgreSQL"
    description: "Distributed SQL database for active-active multi-region replication."
  - type: "container"
    name: "Message Broker / Event Bus"
    technology: "Apache Kafka"
    description: "Event bus for decoupled, eventually consistent asynchronous messaging."
  - type: "container"
    name: "State Caching Layer"
    technology: "Redis Enterprise"
    description: "Distributed caching for sub-second P95 EMR performance."
  - type: "container"
    name: "Key Management Service"
    technology: "Vault / Cloud KMS"
    description: "Key management for envelope encryption and AES-256 at rest compliance."
  - type: "container"
    name: "Audit Log Store"
    technology: "Elasticsearch / Immutable Storage"
    description: "Stores tamper-evident audit logs."
  - type: "container"
    name: "Observability & Telemetry Collector"
    technology: "OpenTelemetry / Prometheus / Loki"
    description: "Collects metrics, logs, and traces for telemetry."
  - type: "container"
    name: "Service Mesh"
    technology: "Istio"
    description: "Zero-trust network policies and mTLS enforcement for HIPAA compliance."
relationships:
  - source: "Doctors"
    destination: "Single-Page Application"
    description: "Interacts with the user interface"
    technology: "HTTPS / WSS"
  - source: "Nurses"
    destination: "Single-Page Application"
    description: "Interacts with the user interface"
    technology: "HTTPS / WSS"
  - source: "Receptionists"
    destination: "Single-Page Application"
    description: "Interacts with the user interface"
    technology: "HTTPS / WSS"
  - source: "Billing Staff"
