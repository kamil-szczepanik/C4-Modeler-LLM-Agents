level: component
scope: "Component diagram for the Core Telehealth Service container"
parentContainer:
  name: "Core Telehealth Service"
elements:
  - type: "component"
    name: "Consultation Session Manager"
    technology: "Java / Spring Boot"
    description: "Initiates room allocation and manages video sessions."
  - type: "component"
    name: "Prescription Orchestrator"
    technology: "Java / Spring Boot"
    description: "Dispatches regional e-prescription payloads and publishes asynchronous e-prescription events."
  - type: "component"
    name: "Data Residency Guard"
    technology: "Java / Spring Boot"
    description: "Enforces region-locked connection strings (europe-west3 / us-central1)."
  - type: "component"
    name: "Symptom Checker Gateway"
    technology: "Java / Spring Boot"
    description: "Submits symptom payloads with metadata tracking."
  - type: "component"
    name: "Consent Enforcement Interceptor"
    technology: "Java / Spring Boot"
    description: "Enforces consent rules using Spring Security aspects."
  - type: "component"
    name: "Degraded Mode Adaptor"
    technology: "Java / Spring Boot"
    description: "Ensures high availability in rural and low-bandwidth connections."
  - type: "component"
    name: "Regional Routing Router"
    technology: "Java / Spring Boot"
    description: "Routes ingress traffic with region context headers."
  - type: "component"
    name: "Audit Event Dispatcher"
    technology: "Java / Spring Boot"
    description: "Publishes cryptographically signed audit payloads."
relationships:
  - source: "Consultation Session Manager"
    destination: "WebRTC Media Broker"
    description: "Initiates room allocation and manages video sessions [gRPC, WebSockets/UDP]"
  - source: "Prescription Orchestrator"
    destination: "FHIR & E-Prescription Integration Service"
    description: "Dispatches regional e-prescription payloads [gRPC]"
  - source: "Prescription Orchestrator"
    destination: "Messaging (Cloud Pub/Sub)"
    description: "Publishes asynchronous e-prescription events [Protobuf over gRPC]"
  - source: "Symptom Checker Gateway"
    destination: "AI Symptom Checker Service"
    description: "Submits symptom payloads with metadata tracking [gRPC]"
  - source: "Audit Event Dispatcher"
    destination: "Messaging (Cloud Pub/Sub)"
    description: "Publishes cryptographically signed audit payloads [gRPC / Protobuf]"
  - source: "Data Residency Guard"
    destination: "Cloud SQL PostgreSQL"
    description: "Enforces region-locked connection strings (europe-west3 / us-central1) [JDBC/TLS]"