level: component
scope: "Component diagram for the AI Symptom Checker Service container"
parentContainer:
  name: "AI Symptom Checker Service"
elements:
  - type: "component"
    name: "Inference Controller"
    technology: "Python / FastAPI"
    description: "High-performance asynchronous API framework for handling internal gRPC and HTTP routing."
  - type: "component"
    name: "Region-Aware State Sanitizer"
    technology: "Python"
    description: "Enforces strict regional data residency and PII minimization to satisfy GDPR and HIPAA compliance."
  - type: "component"
    name: "Model Orchestrator"
    technology: "Python / LangChain"
    description: "Orchestration tooling for managing external AI model inference requests."
  - type: "component"
    name: "Fallback & Caching Engine"
    technology: "Redis / Python LRU"
    description: "Caching layer providing offline resilience and non-diagnostic triage guidelines for unstable connections."
  - type: "component"
    name: "Metadata Redactor"
    technology: "Python"
    description: "Redacts sensitive metadata to protect patient data before logging."
  - type: "component"
    name: "Audit & Traceability Logger"
    technology: "Python"
    description: "Ensures EU MDR traceability through immutable logging."
relationships:
  - source: "Inference Controller"
    destination: "Region-Aware State Sanitizer"
    description: "In-process"
  - source: "Region-Aware State Sanitizer"
    destination: "Model Orchestrator"
    description: "gRPC"
  - source: "Model Orchestrator"
    destination: "Fallback & Caching Engine"
    description: "Redis Protocol"
  - source: "Model Orchestrator"
    destination: "External AI Model Registry & Inference Provider"
    description: "HTTPS/gRPC"
  - source: "Model Orchestrator"
    destination: "Metadata Redactor"
    description: "In-process"
  - source: "Metadata Redactor"
    destination: "Audit & Traceability Logger"
    description: "In-process"
  - source: "Audit & Traceability Logger"
    destination: "Cloud Pub/Sub"
    description: "gRPC"