level: component
scope: "Component diagram for the Consent & Audit Logging Service container"
parentContainer:
  name: "Consent & Audit Logging Service"
elements:
  - type: "component"
    name: "Consent API Handler Component"
    technology: "Go, grpc-go, net/http"
    description: "Handles incoming Consent API requests via gRPC over HTTP/2."
  - type: "component"
    name: "Consent Manager Component"
    technology: "Go, Open Policy Agent"
    description: "Manages consent and enforces rapid, stateless GDPR and HIPAA access rule evaluations."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Go, Crypto-Shredding & Hashing Sub-component"
    description: "Manages immutable audit trails and processes messages from Cloud Pub/Sub."
  - type: "component"
    name: "Compliance Export Component"
    technology: "Go"
    description: "Handles compliance export functions using internal Go interface calls."
  - type: "component"
    name: "Storage Abstraction Layer"
    technology: "Go, CMEK Key Management Interface"
    description: "Provides storage abstraction and interfaces with GCP KMS for regional CMEK."
  - type: "component"
    name: "API Gateway"
    technology: "API Gateway"
    description: "External API Gateway routing traffic to the Consent API Handler."
  - type: "component"
    name: "Core Telehealth Service"
    technology: "Microservice"
    description: "External telehealth service performing synchronous checks against the Consent Manager."
  - type: "component"
    name: "AI Symptom Checker Service"
    technology: "AI Service"
    description: "External AI service performing synchronous checks against the Consent Manager."
  - type: "component"
    name: "Cloud Pub/Sub"
    technology: "Messaging"
    description: "Cloud messaging service sending audit events to the Audit Logger."
  - type: "component"
    name: "Cloud Storage"
    technology: "Cloud Storage (WORM configuration)"
    description: "Provides WORM storage for immutable audit logs."
  - type: "component"
    name: "Regional Cloud SQL Databases"
    technology: "Cloud SQL PostgreSQL (europe-west3, us-central1)"
    description: "Provides regional persistence via PostgreSQL wire protocol over TLS 1.3."
  - type: "component"
    name: "GCP KMS"
    technology: "GCP KMS"
    description: "Enforces regional Customer-Managed Encryption Keys (CMEK)."
relationships:
  - source: "API Gateway"
    destination: "Consent API Handler Component"
    description: "gRPC over HTTP/2"
  - source: "Core Telehealth Service"
    destination: "Consent Manager Component"
    description: "gRPC synchronous checks"
  - source: "AI Symptom Checker Service"
    destination: "Consent Manager Component"
    description: "gRPC synchronous checks"
  - source: "Cloud Pub/Sub"
    destination: "Audit Logger Component"
    description: "AMQP/PubSub protocol"
  - source: "Consent API Handler Component"
    destination: "Consent Manager Component"
    description: "In-process Go function calls / channels"
  - source: "Consent API Handler Component"
    destination: "Audit Logger Component"
    description: "In-process Go function calls / channels"
  - source: "Audit Logger Component"
    destination: "Cloud Storage"
    description: "HTTPS/Storage API"
  - source: "Consent Manager Component"
    destination: "Regional Cloud SQL Databases"
    description: "PostgreSQL wire protocol via TLS 1.3"
  - source: "Storage Abstraction Layer"
    destination: "GCP KMS"
    description: "gRPC/Cloud KMS API via TLS 1.3"
  - source: "Compliance Export Component"
    destination: "Storage Abstraction Layer"
    description: "Internal Go interface calls"