level: component
scope: "Component diagram for the Web & Mobile Clients container"
parentContainer:
  name: "Web & Mobile Clients"
elements:
  - type: "component"
    name: "Patient Portal App"
    technology: "React, React Native, TypeScript"
    description: "Provides patient-facing telehealth features, video consultations, and AI symptom checking."
  - type: "component"
    name: "Clinician Workspace App"
    technology: "React, React Native, TypeScript"
    description: "Provides clinician-facing tools for consultations, e-prescriptions, and FHIR records."
  - type: "component"
    name: "WebRTC Media Client Module"
    technology: "WebRTC, TypeScript"
    description: "Handles peer-to-peer and SFU video consultations."
  - type: "component"
    name: "Local State & Storage Manager"
    technology: "IndexedDB, SQLite, TypeScript"
    description: "Provides local offline caching to handle unstable rural connections."
  - type: "component"
    name: "AI Symptom Checker UI Module"
    technology: "React, TypeScript"
    description: "Interface for patients to interact with the AI symptom checker."
  - type: "component"
    name: "E-Prescription & FHIR Viewer"
    technology: "React, TypeScript"
    description: "Displays medical records and e-prescriptions."
  - type: "component"
    name: "Consent & Privacy Manager"
    technology: "TypeScript"
    description: "Manages privacy consents and regulatory compliance payloads."
  - type: "component"
    name: "Telemetry & Audit Logger"
    technology: "TypeScript"
    description: "Captures audit logs and telemetry data."
  - type: "component"
    name: "Adaptive Bitrate Controller"
    technology: "TypeScript"
    description: "Manages video streaming quality based on network conditions."
  - type: "component"
    name: "Regional Endpoint Router"
    technology: "TypeScript"
    description: "Pins geographic context and routes regional requests."
  - type: "component"
    name: "Secure Token & Session Manager"
    technology: "OAuth 2.0, OIDC, TypeScript"
    description: "Secures session management and token refreshes."
relationships:
  - source: "WebRTC Media Client Module"
    destination: "WebRTC Media Broker"
    description: "Streams video [UDP/DTLS via ICE/STUN/TURN]"
  - source: "Regional Endpoint Router"
    destination: "API Gateway & Routing"
    description: "Transmits regional requests [TLS 1.3 over HTTPS]"
  - source: "Consent & Privacy Manager"
    destination: "API Gateway & Routing"
    description: "Transmits consent payloads [TLS 1.3 over HTTPS]"
  - source: "Telemetry & Audit Logger"
    destination: "API Gateway & Routing"
    description: "Transmits audit payloads [TLS 1.3 over HTTPS]"