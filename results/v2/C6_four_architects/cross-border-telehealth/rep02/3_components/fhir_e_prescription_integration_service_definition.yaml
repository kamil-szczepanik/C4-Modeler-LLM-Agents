level: component
scope: "Component diagram for the FHIR & E-Prescription Integration Service container"
parentContainer:
  name: "FHIR & E-Prescription Integration Service"
elements:
  - type: "component"
    name: "FHIR Transformer"
    technology: "Python / Java (HAPI FHIR)"
    description: "Transforms internal data models into US Core profiles and national eHDSI/OpenNCP standards."
  - type: "component"
    name: "E-Prescription Router"
    technology: "Python / Java"
    description: "Routes e-prescriptions to National E-Prescription Gateways in the EU and US Pharmacy Networks."
relationships:
  - source: "FHIR Transformer"
    destination: "E-Prescription Router"
    description: "Passes standardized FHIR payloads"