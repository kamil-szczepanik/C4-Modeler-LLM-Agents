level: component
scope: "Component diagram for the WebRTC Media Broker container"
parentContainer:
  name: "WebRTC Media Broker"
elements:
  - type: "component"
    name: "Signaling & Room Manager"
    technology: "Node.js / TypeScript"
    description: "Manages signaling and room coordination for video consultations."
  - type: "component"
    name: "SFU Core Router"
    technology: "Mediasoup C++ worker wrapper"
    description: "Selective Forwarding Unit core router handling media streams."
  - type: "component"
    name: "Adaptive Bitrate & Quality Controller"
    technology: "Node.js"
    description: "Controls adaptive bitrate and stream quality for low-bandwidth users."
  - type: "component"
    name: "NAT Traversal Agents"
    technology: "GCP STUN/TURN integration"
    description: "Handles NAT traversal using GCP STUN/TURN."
  - type: "component"
    name: "Media Region Router"
    technology: "C++ / Node.js"
    description: "Routes media streams to regional GCP nodes."
  - type: "component"
    name: "Media Session Logger"
    technology: "Node.js"
    description: "Logs media session metadata and regional telemetry."
  - type: "component"
    name: "Media Encryption Enforcer"
    technology: "DTLS-SRTP with AES-GCM"
    description: "Enforces native secure transport configuration for encrypted media streams."
  - type: "component"
    name: "STUN/TURN Health & Metrics Exporter"
    technology: "Node.js"
    description: "Exports health checks and metrics for STUN/TURN infrastructure."
relationships:
  - source: "Signaling & Room Manager"
    destination: "SFU Core Router"
    description: "Coordinates media routing"
  - source: "SFU Core Router"
    destination: "Adaptive Bitrate & Quality Controller"
    description: "Asynchronous Worker IPC"
  - source: "Media Session Logger"
    destination: "Consent & Audit Logging Service"
    description: "Regional Telemetry [gRPC]"
  - source: "STUN/TURN Health & Metrics Exporter"
    destination: "Core Telehealth Service"
    description: "Health Check [gRPC]"