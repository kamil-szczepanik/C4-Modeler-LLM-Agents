level: component
scope: "Component diagram for the API Gateway & Routing container"
parentContainer:
  name: "API Gateway & Routing"
elements:
  - type: "component"
    name: "Ingress WAF Controller"
    technology: "Kong Enterprise Plugin"
    description: "Manages ingress traffic, Web Application Firewall protection, and threat mitigation."
  - type: "component"
    name: "Geo-Routing & DNS Router"
    technology: "Kong Enterprise / GCP Cloud DNS"
    description: "Routes client requests to the appropriate regional data residency boundary (EU vs US)."
  - type: "component"
    name: "mTLS & Security Terminator"
    technology: "Kong Enterprise mTLS Plugin"
    description: "Terminates incoming TLS connections and establishes secure mTLS sessions for internal routing."
relationships:
  - source: "Ingress WAF Controller"
    destination: "Geo-Routing & DNS Router"
    description: "Filters and passes validated ingress requests"
  - source: "Geo-Routing & DNS Router"
    destination: "mTLS & Security Terminator"
    description: "Forwards geographically routed requests for secure internal dispatch"