level: component
scope: "Component diagram for the Messaging container"
parentContainer:
  name: "Messaging"
elements:
  - type: "component"
    name: "EU Pub/Sub Topic Partition"
    technology: "GCP Pub/Sub"
    description: "Handles asynchronous messaging and data residency for the EU region (europe-west3)."
  - type: "component"
    name: "US Pub/Sub Topic Partition"
    technology: "GCP Pub/Sub"
    description: "Handles asynchronous messaging and data residency for the US region (us-central1)."
  - type: "component"
    name: "Event Schema Registry"
    technology: "Apache Avro / JSON Schema"
    description: "Enforces payload validation and schema compliance."
  - type: "component"
    name: "Client Ingress Relay"
    technology: "WebSocket / MQTT"
    description: "Edge connectivity protocol handler for managing rural and low-bandwidth clients."
  - type: "component"
    name: "Regional Message Forwarders"
    technology: "Java / Go"
    description: "Processes and forwards messages across regional Pub/Sub partitions."
  - type: "component"
    name: "Dead Letter Queue (DLQ) & Retry Handler Component"
    technology: "Java / Go"
    description: "Manages failed messages, retry logic, and poisoned message isolation."
  - type: "component"
    name: "DLQ Monitoring & Alerting Component"
    technology: "Cloud Monitoring / Cloud Functions"
    description: "Provides automated alerting and monitoring for DLQ and poisoned messages."
relationships:
  - source: "Web & Mobile Clients"
    destination: "Client Ingress Relay"
    description: "Connects via WebSocket/MQTT [WSS]"
  - source: "Client Ingress Relay"
    destination: "EU Pub/Sub Topic Partition"
    description: "Relays messages via GCP Pub/Sub [gRPC]"
  - source: "Client Ingress Relay"
    destination: "US Pub/Sub Topic Partition"
    description: "Relays messages via GCP Pub/Sub [gRPC]"
  - source: "Core Telehealth & AI Services"
    destination: "Event Schema Registry"
    description: "Validates payloads via [HTTPS/gRPC]"
  - source: "EU Pub/Sub Topic Partition"
    destination: "Regional Message Forwarders"
    description: "Forwards messages via [gRPC]"
  - source: "US Pub/Sub Topic Partition"
    destination: "Regional Message Forwarders"
    description: "Forwards messages via [gRPC]"
  - source: "EU Pub/Sub Topic Partition"
    destination: "DLQ & Monitoring & Alerting Component"
    description: "Routes failed messages via [gRPC/HTTPS]"
  - source: "US Pub/Sub Topic Partition"
    destination: "DLQ & Monitoring & Alerting Component"
    description: "Routes failed messages via [gRPC/HTTPS]"