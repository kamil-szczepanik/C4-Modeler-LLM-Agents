level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients and Clinicians"
    description: "External actors who use the platform for video consultations, e-prescriptions, and AI symptom checking."
  - type: "externalSystem"
    name: "National E-Prescription Gateways & US Pharmacy Networks"
    description: "External systems for handling national and regional e-prescriptions."
  - type: "container"
    name: "Web & Mobile Clients"
    technology: "React / React Native"
    description: "Client-facing applications for patients and clinicians."
  - type: "container"
    name: "API Gateway & Routing"
    technology: "Kong / GCP API Gateway"
    description: "Manages and routes incoming client traffic securely."
  - type: "container"
    name: "Core Telehealth Service"
    technology: "Java / Spring Boot"
    description: "Handles core business logic for telehealth consultations."
  - type: "container"
    name: "WebRTC Media Broker"
    technology: "Node.js / Mediasoup"
    description: "Manages real-time video and audio media streams, supporting degraded modes for unstable connections."
  - type: "container"
    name: "AI Symptom Checker Service"
    technology: "Python / FastAPI"
    description: "Provides AI-powered symptom analysis for patients."
  - type: "container"
    name: "FHIR & E-Prescription Integration Service"
    technology: "Python / Java"
    description: "Integrates with external e-prescription gateways and pharmacy networks."
  - type: "container"
    name: "Consent & Audit Logging Service"
    technology: "Go"
    description: "Manages user consent and records immutable audit logs."
  - type: "container"
    name: "Messaging"
    technology: "Cloud Pub/Sub"
    description: "Asynchronous messaging backbone for decoupled services."
  - type: "container"
    name: "Databases"
    technology: "Cloud SQL PostgreSQL, Cloud Storage"
    description: "Region-isolated transactional stores and cryptographically bound audit logs."
relationships:
  - source: "Patients and Clinicians"
    destination: "Web & Mobile Clients"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS, WSS"
  - source: "Web & Mobile Clients"
    destination: "API Gateway & Routing"
    description: "Sends client requests and signaling"
    technology: "TLS 1.3 over HTTPS, WSS"
  - source: "API Gateway & Routing"
    destination: "Core Telehealth Service"
    description: "Routes telehealth requests via internal VPC Service Controls"
    technology: "gRPC"
  - source: "API Gateway & Routing"
    destination: "AI Symptom Checker Service"
    description: "Routes AI inference requests via internal VPC Service Controls"
    technology: "gRPC"
  - source: "Core Telehealth Service"
    destination: "WebRTC Media Broker"
    description: "Establishes media and signaling sessions"
    technology: "gRPC, WebSockets/UDP"
  - source: "AI Symptom Checker Service"
    destination: "Messaging"
    description: "Publishes asynchronous AI events and outputs"
    technology: "gRPC"
  - source: "FHIR & E-Prescription Integration Service"
    destination: "National E-Prescription Gateways & US Pharmacy Networks"
    description: "Exchanges e-prescription data"
    technology: "HTTPS with mTLS"
  - source: "Consent & Audit Logging Service"
    destination: "Databases"
    description: "Stores audit logs and consent records encrypted via CMEK"
    technology: "Cloud Storage / Cloud SQL"