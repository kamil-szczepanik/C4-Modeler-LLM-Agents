level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US while enforcing strict regional data residency."
elements:
  - type: "person"
    name: "Patients and Clinicians"
    description: "External actors who use the platform for video consultations, e-prescriptions, and AI symptom checking."
  - type: "externalSystem"
    name: "Global Media Relay Network"
    description: "External WebRTC Infrastructure for video consultations."
  - type: "externalSystem"
    name: "National E-Prescription Gateways (EU) and US Pharmacy Networks"
    description: "External systems for handling e-prescriptions."
  - type: "externalSystem"
    name: "Identity & Consent Providers"
    description: "Regional External IDPs for authentication and consent management."
  - type: "externalSystem"
    name: "AI Model Registry & Inference Provider"
    description: "External ML Service for AI symptom checker."
  - type: "container"
    name: "API Gateway / BFF"
    description: "Handles signaling and app interactions."
    technology: "Cloud Run / Cloud Load Balancing"
  - type: "container"
    name: "Consultation Service & AI Proxy & Audit Service"
    description: "Core backend logic and proxy services."
    technology: "GKE Microservices"
  - type: "container"
    name: "Consent & Identity Service & E-Prescription Integration Service"
    description: "Manages identity, consent, and prescriptions."
    technology: "Cloud Run Containers"
  - type: "container"
    name: "Cloud SQL and Cloud Storage"
    description: "Regional persistence layer with Customer-Managed Encryption Keys."
    technology: "Cloud SQL (PostgreSQL) and Cloud Storage"
relationships:
  - source: "Patients and Clinicians"
    destination: "Global Media Relay Network"
    description: "Video consultations"
    technology: "WebRTC/UDP/TCP over TLS"
  - source: "Patients and Clinicians"
    destination: "API Gateway / BFF"
    description: "Signaling and app interactions"
    technology: "HTTPS/WebSockets"
  - source: "API Gateway / BFF"
    destination: "Consultation Service & AI Proxy & Audit Service"
    description: "Internal communication"
    technology: "gRPC over mTLS"
  - source: "Consent & Identity Service & E-Prescription Integration Service"
    destination: "National E-Prescription Gateways (EU) and US Pharmacy Networks"
    description: "E-prescription integration"
    technology: "HTTPS/REST (HL7 FHIR in US)"
  - source: "Consultation Service & AI Proxy & Audit Service"
    destination: "AI Model Registry & Inference Provider"
    description: "AI inference requests"
    technology: "gRPC/HTTPS"