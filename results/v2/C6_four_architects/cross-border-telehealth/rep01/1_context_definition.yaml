level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for EU and US patients with strict regional data residency, regulatory compliance, and interoperability across dual GCP environments."
elements:
  - type: "person"
    name: "Patients (EU/US)"
    description: "Patients from the EU and US accessing video consultations, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed medical professionals conducting video consultations and prescribing treatments."
  - type: "externalSystem"
    name: "National Pharmacies"
    description: "External national pharmacy systems for handling e-prescriptions."
  - type: "externalSystem"
    name: "National EHR Gateways"
    description: "External Electronic Health Record gateways for medical record integration."
  - type: "externalSystem"
    name: "Payment Gateways (Stripe)"
    description: "External payment processing provider."
  - type: "externalSystem"
    name: "Notification Providers (Twilio/Firebase)"
    description: "External providers for sending system notifications."
relationships:
  - source: "Patients (EU/US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses telehealth services, video consultations, and AI symptom checker"
    technology: "HTTPS, WebSockets, WebRTC"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Conducts video consultations and manages patient care"
    technology: "HTTPS, WebSockets, WebRTC"
  - source: "Cross-Border Telehealth Platform"
    destination: "National Pharmacies"
    description: "Sends e-prescriptions and prescription data"
    technology: "HL7 FHIR / National e-Prescription APIs over REST/TLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "National EHR Gateways"
    description: "Exchanges patient health records"
    technology: "HL7 FHIR over REST/TLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Payment Gateways (Stripe)"
    description: "Processes consultation and service payments"
    technology: "HTTPS/REST"
  - source: "Cross-Border Telehealth Platform"
    destination: "Notification Providers (Twilio/Firebase)"
    description: "Sends SMS and push notifications to users"
    technology: "HTTPS/REST"