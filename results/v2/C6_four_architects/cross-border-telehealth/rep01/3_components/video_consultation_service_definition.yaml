level: component
scope: "Component diagram for the Video Consultation Service container"
parentContainer:
  name: "Video Consultation Service"
elements:
  - type: "component"
    name: "Signaling Controller"
    technology: "Node.js / WebSockets"
    description: "Handles WebSockets signaling for video consultation sessions and communicates with the API Gateway via gRPC for session authorization."
  - type: "component"
    name: "Media Router / SFU Core"
    technology: "Janus Media Server / C++"
    description: "Manages real-time video streaming, routing media streams between participants."
  - type: "component"
    name: "Adaptive Bitrate & Quality Manager"
    technology: "C++ plugin"
    description: "Manages video quality and adapts bitrates for unstable rural internet connections."
  - type: "component"
    name: "Room Access Control & Consent Verifier"
    technology: "Node.js"
    description: "Validates real-time consent and data residency via internal gRPC queries."
  - type: "component"
    name: "Recording & Transcoding Worker"
    technology: "Python / GStreamer"
    description: "Records and transcodes consultation sessions, streaming encrypted media chunks to Regional Cloud Storage via HTTPS."
  - type: "component"
    name: "TURN/STUN Relay Manager"
    technology: "Coturn on GCE Compute Engine"
    description: "Provides NAT traversal and relay services for WebRTC connections."
relationships:
  - source: "Signaling Controller"
    destination: "Room Access Control & Consent Verifier"
    description: "Queries for real-time consent and data residency validation via internal gRPC"
  - source: "Recording & Transcoding Worker"
    destination: "Regional Cloud Storage"
    description: "Streams encrypted media chunks via HTTPS (REST)"
  - source: "Media Router / SFU Core"
    destination: "Dedicated Audit & Logging Container"
    description: "Emits session telemetry via OpenTelemetry (gRPC)"