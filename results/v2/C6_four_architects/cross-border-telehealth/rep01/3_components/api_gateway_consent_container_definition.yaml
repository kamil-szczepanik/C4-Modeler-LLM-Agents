level: component
scope: "Component diagram for the API Gateway & Consent Container container"
parentContainer:
  name: "API Gateway & Consent Container"
elements:
  - type: "component"
    name: "Envoy Proxy"
    technology: "Envoy Proxy"
    description: "Manages ingress TLS, WSS signaling, and gRPC routing."
  - type: "component"
    name: "Open Policy Agent"
    technology: "Open Policy Agent (OPA)"
    description: "Evaluates consent scopes and regional policies."
  - type: "component"
    name: "WASM Claims Extension"
    technology: "WASM"
    description: "Inspects and extracts claims at the edge for policy validation."
relationships:
  - source: "Envoy Proxy"
    destination: "Open Policy Agent"
    description: "Queries for authorization and consent decisions"
  - source: "Envoy Proxy"
    destination: "WASM Claims Extension"
    description: "Executes for request claim validation"