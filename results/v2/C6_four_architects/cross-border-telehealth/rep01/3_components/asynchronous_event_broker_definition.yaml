level: component
scope: "Component diagram for the Asynchronous Event Broker container"
parentContainer:
  name: "Asynchronous Event Broker"
elements:
  - type: "component"
    name: "Regional EU/US Topics"
    technology: "GCP Pub/Sub"
    description: "Handles asynchronous event distribution with regional separation for EU and US data residency."
  - type: "component"
    name: "Schema Registry"
    technology: "GCP Pub/Sub Schema Registry"
    description: "Enforces payload validation for structured recommendation and transaction events."
  - type: "component"
    name: "Event Flow Router"
    technology: "GCP Pub/Sub Router"
    description: "Routes filtered events such as e-prescription events to downstream adapters."
  - type: "component"
    name: "DLQ Manager"
    technology: "GCP Pub/Sub DLQ Retry Manager"
    description: "Captures and manages unprocessable event payloads for archiving into regional storage."
relationships:
  - source: "Schema Registry"
    destination: "Regional EU/US Topics"
    description: "Validates message schemas for [gRPC/HTTPS]"
  - source: "Regional EU/US Topics"
    destination: "Event Flow Router"
    description: "Dispatches asynchronous events for [gRPC]"
  - source: "Event Flow Router"
    destination: "DLQ Manager"
    description: "Forwards failed or unprocessable messages to [gRPC]"