level: component
scope: "Component diagram for the Core Telehealth Backend container"
parentContainer:
  name: "Core Telehealth Backend"
elements:
  - type: "component"
    name: "Consultation Orchestrator"
    technology: "Go"
    description: "Manages consultation workflows and media stream interactions."
  - type: "component"
    name: "E-Prescription Workflow"
    technology: "Go"
    description: "Handles e-prescription generation and workflow management."
  - type: "component"
    name: "Consent Enforcement Middleware"
    technology: "Go / Open Policy Agent"
    description: "Enforces data access and consent policies."
  - type: "component"
    name: "Symptom Checker Orchestrator"
    technology: "Go"
    description: "Orchestrates symptom checks and communicates with the AI engine."
  - type: "component"
    name: "Patient Profile & Consent Manager"
    technology: "Go"
    description: "Manages patient profiles and consent records."
  - type: "component"
    name: "Event Dispatcher"
    technology: "Go"
    description: "Dispatches domain events to the message broker."
  - type: "component"
    name: "Outbox Pattern Handler"
    technology: "Go"
    description: "Ensures reliable message publishing via the transactional outbox pattern."
relationships:
  - source: "Consultation Orchestrator"
    destination: "Video Consultation Service"
    description: "Manages media streams [gRPC]"
  - source: "E-Prescription Workflow"
    destination: "Interoperability Adapter"
    description: "Dispatches national-format payloads [gRPC]"
  - source: "Symptom Checker Orchestrator"
    destination: "AI Symptom Checker"
    description: "Requests urgency recommendations [gRPC]"
  - source: "Event Dispatcher"
    destination: "Asynchronous Event Broker"
    description: "Publishes sanitized domain events to region-pinned topics [gRPC/Protobuf]"
  - source: "Core Telehealth Backend"
    destination: "Regional Databases"
    description: "Enforces geo-pinned data storage [PostgreSQL wire protocol]"
  - source: "Core Telehealth Backend"
    destination: "Dedicated Audit & Logging Container"
    description: "Sends audit logs [gRPC]"