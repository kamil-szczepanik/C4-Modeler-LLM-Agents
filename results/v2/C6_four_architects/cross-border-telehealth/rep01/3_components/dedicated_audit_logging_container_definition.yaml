level: component
scope: "Component diagram for the Dedicated Audit & Logging Container container"
parentContainer:
  name: "Dedicated Audit & Logging Container"
elements:
  - type: "component"
    name: "Log Collector"
    technology: "Fluent Bit"
    description: "Lightweight log ingestion and PHI stripping at the edge."
  - type: "component"
    name: "Audit & Compliance Engine"
    technology: "OpenTelemetry Collector"
    description: "Normalization and structured schema tagging for AI traceability."
  - type: "component"
    name: "Compliance Archival Manager"
    technology: "Go"
    description: "Manages the archival of compliance and audit logs to regional storage."
  - type: "component"
    name: "Log Access Proxy"
    technology: "HTTPS / mTLS Proxy"
    description: "Provides secure access for external compliance auditors to regional cloud storage."
relationships:
  - source: "Log Collector"
    destination: "Audit & Compliance Engine"
    description: "In-memory / IPC"
  - source: "Audit & Compliance Engine"
    destination: "Compliance Archival Manager"
    description: "Internal gRPC"