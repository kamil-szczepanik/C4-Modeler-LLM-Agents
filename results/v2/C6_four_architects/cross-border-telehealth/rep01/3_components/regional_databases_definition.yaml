level: component
scope: "Component diagram for the Regional Databases container"
parentContainer:
  name: "Regional Databases"
elements:
  - type: "component"
    name: "Transactional Store"
    technology: "Cloud SQL PostgreSQL"
    description: "Region-locked relational storage for patient records and e-prescriptions."
  - type: "component"
    name: "Document & Audit Store"
    technology: "Cloud Firestore"
    description: "Document storage capturing immutable AI symptom-checker inputs and model versions."
  - type: "component"
    name: "Blob Storage"
    technology: "Cloud Storage"
    description: "Encrypted object storage for consultation artifacts with CMEK."
  - type: "component"
    name: "Data Encryption Manager"
    technology: "Cloud KMS"
    description: "Regional Customer-Managed Encryption Keys ensuring cryptographic isolation."
  - type: "component"
    name: "Database Migration & Schema Manager"
    technology: "Flyway / Cloud Build"
    description: "Apply localized schema migrations."
  - type: "component"
    name: "Regional Replica Router"
    technology: "Cloud SQL Proxy / Built-in HA"
    description: "Localized read-scaling and automatic failover."
  - type: "component"
    name: "Database Backup & Retention Manager"
    technology: "Cloud Backup and DR / Storage Lifecycle"
    description: "Execute regional snapshots and lifecycle archival."
relationships:
  - source: "Transactional Store"
    destination: "Data Encryption Manager"
    description: "Encrypt/Decrypt regional data at rest [Cloud KMS API / gRPC]"
  - source: "Document & Audit Store"
    destination: "Data Encryption Manager"
    description: "Encrypt/Decrypt regional data at rest [Cloud KMS API / gRPC]"
  - source: "Blob Storage"
    destination: "Data Encryption Manager"
    description: "Encrypt/Decrypt regional data at rest [Cloud KMS API / gRPC]"
  - source: "Database Migration & Schema Manager"
    destination: "Transactional Store"
    description: "Apply localized schema migrations [TCP / PostgreSQL Wire Protocol]"
  - source: "Regional Replica Router"
    destination: "Transactional Store"
    description: "Replicate transactional data within the same region [TCP]"
  - source: "Database Backup & Retention Manager"
    destination: "Transactional Store"
    description: "Execute regional snapshots [GCP Internal API]"
  - source: "Database Backup & Retention Manager"
    destination: "Blob Storage"
    description: "Execute lifecycle archival [GCP Internal API]"