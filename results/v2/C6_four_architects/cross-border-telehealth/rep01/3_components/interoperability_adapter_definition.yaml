level: component
scope: "Component diagram for the Interoperability Adapter container"
parentContainer:
  name: "Interoperability Adapter"
elements:
  - type: "component"
    name: "Region Routing Resolver"
    technology: "Spring Cloud Config / Routing"
    description: "Routes requests based on region for the Cross-Border Telehealth Platform."
  - type: "component"
    name: "Schema Validation Interceptor"
    technology: "Hibernate Validator / JSON Schema"
    description: "Validates request schemas before processing."
  - type: "component"
    name: "Data Residency Enforcer"
    technology: "Spring Security / AspectJ"
    description: "Enforces strict regional data residency rules."
  - type: "component"
    name: "FHIR Translation Engine"
    technology: "Java / HAPI FHIR"
    description: "Translates US healthcare data using standardized FHIR libraries."
  - type: "component"
    name: "EU National Gateway Translator"
    technology: "Java / Apache Camel"
    description: "Transforms diverse EU national formats."
  - type: "component"
    name: "Outbound Protocol Dispatcher"
    technology: "Spring WebClient / Resilience4j"
    description: "Dispatches outbound protocols with circuit breaker capabilities."
  - type: "component"
    name: "Adapter Audit Interceptor"
    technology: "Spring AOP"
    description: "Audits adapter activities and interactions."
relationships:
  - source: "Core Telehealth Backend"
    destination: "Region Routing Resolver"
    description: "gRPC"
  - source: "Region Routing Resolver"
    destination: "Schema Validation Interceptor"
    description: "In-memory"
  - source: "Schema Validation Interceptor"
    destination: "FHIR Translation Engine"
    description: "In-memory"
  - source: "Schema Validation Interceptor"
    destination: "EU National Gateway Translator"
    description: "In-memory"
  - source: "Data Residency Enforcer"
    destination: "Regional Databases"
    description: "Database Protocol"
  - source: "Data Residency Enforcer"
    destination: "Outbound Protocol Dispatcher"
    description: "In-memory method call"
  - source: "Outbound Protocol Dispatcher"
    destination: "National Pharmacies / National EHR Gateways"
    description: "mTLS over HTTPS"
  - source: "Adapter Audit Interceptor"
    destination: "Dedicated Audit & Logging Container"
    description: "gRPC"