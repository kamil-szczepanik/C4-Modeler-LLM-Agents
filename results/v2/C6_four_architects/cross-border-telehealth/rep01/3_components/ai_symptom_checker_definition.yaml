level: component
scope: "Component diagram for the AI Symptom Checker container"
parentContainer:
  name: "AI Symptom Checker"
elements:
  - type: "component"
    name: "API Router / Controller"
    technology: "Python / FastAPI"
    description: "Routes symptom check requests and handles API entry points."
  - type: "component"
    name: "Inference Orchestrator"
    technology: "Python / FastAPI"
    description: "Manages symptom analysis and coordinates processing steps."
  - type: "component"
    name: "Model Version & Provenance Tracker"
    technology: "Python"
    description: "Logs model metadata and persists hashes locally."
  - type: "component"
    name: "Data Residency Enforcer"
    technology: "Python"
    description: "Enforces strict regional data residency constraints."
  - type: "component"
    name: "Regional LLM Gateway / Client"
    technology: "Vertex AI SDK"
    description: "Executes model inference via regional LLM deployments."
  - type: "component"
    name: "Clinical Safety Guardrail Filter"
    technology: "LangChain Guardrails"
    description: "Validates outputs and ensures clinical safety."
  - type: "component"
    name: "Local Audit & State Store"
    technology: "SQLite / Cloud SQL proxy"
    description: "Persists hashes locally and maintains state."
  - type: "component"
    name: "Async Event Publisher"
    technology: "Python asyncio"
    description: "Queues telemetry logs asynchronously."
relationships:
  - source: "API Router / Controller"
    destination: "Inference Orchestrator"
    description: "Manages symptom analysis [In-process]"
  - source: "Inference Orchestrator"
    destination: "Model Version & Provenance Tracker"
    description: "Logs metadata [In-process]"
  - source: "Inference Orchestrator"
    destination: "Clinical Safety Guardrail Filter"
    description: "Validates outputs [In-process]"
  - source: "Inference Orchestrator"
    destination: "Regional LLM Gateway / Client"
    description: "Executes model inference [HTTPS / Vertex AI SDK]"
  - source: "Model Version & Provenance Tracker"
    destination: "Local Audit & State Store"
    description: "Persists hashes locally [SQL / In-process DB]"
  - source: "Inference Orchestrator"
    destination: "Async Event Publisher"
    description: "Queues logs [In-process async]"
  - source: "Async Event Publisher"
    destination: "Asynchronous Event Broker (GCP Pub/Sub)"
    description: "Streams telemetry [gRPC over TLS]"
  - source: "Clinical Safety Guardrail Filter"
    destination: "Dedicated Audit & Logging Container"
    description: "Sends raw vs. filtered logs [gRPC]"
  - source: "AI Symptom Checker"
    destination: "Regional Databases"
    description: "Persists check histories [gRPC/SQL]"