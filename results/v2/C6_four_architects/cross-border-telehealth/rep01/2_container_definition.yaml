level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU/US)"
    description: "Patients from the EU and US accessing video consultations, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed medical professionals conducting video consultations and prescribing treatments."
  - type: "externalSystem"
    name: "National Pharmacies"
    description: "External national pharmacy systems for handling e-prescriptions."
  - type: "externalSystem"
    name: "National EHR Gateways"
    description: "External Electronic Health Record gateways for medical record integration."
  - type: "externalSystem"
    name: "Payment Gateways (Stripe)"
    description: "External payment processing provider."
  - type: "externalSystem"
    name: "Notification Providers (Twilio/Firebase)"
    description: "External providers for sending system notifications."
  - type: "container"
    name: "API Gateway & Consent Container"
    technology: "Envoy / Google Cloud Endpoints, Open Policy Agent"
    description: "Manages incoming HTTPS/WSS traffic, routing, and enforces consent and regional access policies."
  - type: "container"
    name: "Core Telehealth Backend"
    technology: "Node.js / Go"
    description: "Handles core telehealth business logic, orchestration, and service coordination."
  - type: "container"
    name: "Video Consultation Service"
    technology: "WebRTC / Janus Media Server on GCE MIGs"
    description: "Provides real-time video and audio streaming for patient-clinician consultations."
  - type: "container"
    name: "AI Symptom Checker"
    technology: "Python / FastAPI"
    description: "Provides AI-driven symptom analysis and preliminary assessments for users."
  - type: "container"
    name: "Interoperability Adapter"
    technology: "Java / Spring Boot"
    description: "Translates and manages secure communications with external national EHR gateways and pharmacies."
  - type: "container"
    name: "Asynchronous Event Broker"
    technology: "GCP Pub/Sub"
    description: "Handles asynchronous event distribution and system decoupling across microservices."
  - type: "container"
    name: "Dedicated Audit & Logging Container"
    technology: "Fluentbit / OpenTelemetry"
    description: "Collects, aggregates, and stores audit logs and telemetry data from backends and AI containers."
  - type: "container"
    name: "Regional Databases"
    technology: "Cloud SQL PostgreSQL, Cloud Storage, Cloud Firestore"
    description: "Provides region-locked transactional storage, object storage, and document storage with WORM immutability."
relationships:
  - source: "Patients (EU/US)"
    destination: "API Gateway & Consent Container"
    description: "Accesses telehealth services via API Gateway"
    technology: "HTTPS/WSS"
  - source: "Licensed Clinicians"
    destination: "API Gateway & Consent Container"
    description: "Accesses telehealth services via API Gateway"
    technology: "HTTPS/WSS"
  - source: "Patients (EU/US)"
    destination: "Video Consultation Service"
    description: "Connects to video consultation streams"
    technology: "WebRTC (UDP/TCP)"
  - source: "Licensed Clinicians"
    destination: "Video Consultation Service"
    description: "Connects to video consultation streams"
    technology: "WebRTC (UDP/TCP)"
  - source: "API Gateway & Consent Container"
    destination: "Core Telehealth Backend"
    description: "Forwards validated requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway & Consent Container"
    destination: "AI Symptom Checker"
    description: "Routes symptom check requests"
    technology: "gRPC over mTLS"
  - source: "Core Telehealth Backend"
    destination: "Asynchronous Event Broker"
    description: "Publishes and consumes asynchronous events"
    technology: "GCP Pub/Sub"
  - source: "Core Telehealth Backend"
    destination: "Regional Databases"
    description: "Reads and writes transactional and file data"
    technology: "SQL / HTTPS"
  - source: "Interoperability Adapter"
    destination: "National Pharmacies"
    description: "Sends e-prescriptions and prescription data"
    technology: "mTLS over HTTPS"
  - source: "Interoperability Adapter"
    destination: "National EHR Gateways"
    description: "Exchanges patient health records"
    technology: "mTLS over HTTPS"
  - source: "Core Telehealth Backend"
    destination: "Dedicated Audit & Logging Container"
    description: "Sends audit logs and telemetry"
    technology: "gRPC"
  - source: "AI Symptom Checker"
    destination: "Dedicated Audit & Logging Container"
    description: "Sends audit logs and telemetry"
    technology: "gRPC"
  - source: "Interoperability Adapter"
    destination: "Dedicated Audit & Logging Container"
    description: "Sends audit logs and telemetry"
    technology: "gRPC"
  - source: "Core Telehealth Backend"
    destination: "Payment Gateways (Stripe)"
    description: "Processes payments"
    technology: "HTTPS/REST"
  - source: "Core Telehealth Backend"
    destination: "Notification Providers (Twilio/Firebase)"
    description: "Sends notifications"
    technology: "HTTPS/REST"