level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US while enforcing strict regional data residency and compliance."
elements:
  - type: "person"
    name: "Patient"
    description: "User accessing the platform via Mobile or Web Apps for video consultations and symptom checking."
  - type: "person"
    name: "Clinician"
    description: "User accessing the platform via Mobile or Web Apps to conduct video consultations and issue e-prescriptions."
  - type: "externalSystem"
    name: "External Pharmacies"
    description: "External systems receiving e-prescriptions via REST / HL7 FHIR over TLS 1.3."
  - type: "externalSystem"
    name: "Identity Providers"
    description: "Auth0/GCP IAM managing authentication and identity."
  - type: "externalSystem"
    name: "Regional Regulatory Systems"
    description: "Systems ensuring regional regulatory and compliance standards are met."
  - type: "externalSystem"
    name: "National Health and Insurance Systems"
    description: "Systems for health records and insurance integration via REST / HL7 FHIR."
relationships:
  - source: "Patient"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS, WebRTC"
  - source: "Clinician"
    destination: "Cross-Border Telehealth Platform"
    description: "Conducts consultations, manages sessions, and issues e-prescriptions"
    technology: "HTTPS, WebRTC"
  - source: "Cross-Border Telehealth Platform"
    destination: "External Pharmacies"
    description: "Sends e-prescriptions"
    technology: "REST / HL7 FHIR over TLS 1.3"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity Providers"
    description: "Authenticates users"
    technology: "Auth0 / GCP IAM"
  - source: "Cross-Border Telehealth Platform"
    destination: "Regional Regulatory Systems"
    description: "Reports compliance and audit data"
    technology: "TLS 1.3"
  - source: "Cross-Border Telehealth Platform"
    destination: "National Health and Insurance Systems"
    description: "Interoperates with health records"
    technology: "REST / HL7 FHIR over TLS 1.3"