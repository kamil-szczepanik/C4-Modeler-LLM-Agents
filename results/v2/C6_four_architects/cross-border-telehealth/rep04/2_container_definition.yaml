level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patient"
    description: "User accessing the platform via Mobile or Web Apps for video consultations and symptom checking."
  - type: "person"
    name: "Clinician"
    description: "User accessing the platform via Mobile or Web Apps to conduct video consultations and issue e-prescriptions."
  - type: "externalSystem"
    name: "External Pharmacies"
    description: "External systems receiving e-prescriptions via REST / HL7 FHIR over TLS 1.3."
  - type: "externalSystem"
    name: "Identity Providers"
    description: "Auth0/GCP IAM managing authentication and identity."
  - type: "externalSystem"
    name: "Regional Regulatory Systems"
    description: "Systems ensuring regional regulatory and compliance standards are met."
  - type: "externalSystem"
    name: "National Health and Insurance Systems"
    description: "Systems for health records and insurance integration via REST / HL7 FHIR."
  - type: "container"
    name: "Web Application"
    technology: "React"
    description: "Web-based client application for patients and clinicians."
  - type: "container"
    name: "Mobile App"
    technology: "Flutter"
    description: "Mobile-based client application for patients and clinicians."
  - type: "container"
    name: "Ingress Layer"
    technology: "Google Cloud Global HTTPS Load Balancer, Google Cloud Armor, Google Cloud DNS"
    description: "Handles geo-routing, security filtering, and ingress traffic routing."
  - type: "container"
    name: "API Gateway"
    technology: "Google Cloud API Gateway"
    description: "Manages and routes incoming API requests to core services."
  - type: "container"
    name: "Core Telehealth Service"
    technology: "Node.js / Go"
    description: "Provides core telehealth business logic and operations."
  - type: "container"
    name: "Video Consultation Service"
    technology: "LiveKit"
    description: "Handles real-time video consultations within regional data boundaries."
  - type: "container"
    name: "AI Symptom Checker Service"
    technology: "Python / FastAPI"
    description: "Provides AI-driven symptom checking capabilities for patients."
  - type: "container"
    name: "Consent Management Service"
    technology: "Go"
    description: "Manages user consent and privacy settings."
  - type: "container"
    name: "E-Prescription & Interoperability Gateway"
    technology: "Node.js / TypeScript, Java / Spring Boot FHIR Adapter"
    description: "Handles e-prescriptions and interoperability with HL7 FHIR and EU protocols."
  - type: "container"
    name: "Audit & Compliance Logging Service"
    technology: "Go"
    description: "Ensures robust audit logging for GDPR, HIPAA, and EU MDR compliance."
  - type: "container"
    name: "Pub/Sub"
    technology: "Google Cloud Pub/Sub"
    description: "Facilitates asynchronous event processing between services."
  - type: "container"
    name: "Cloud SQL"
    technology: "Google Cloud SQL for PostgreSQL"
    description: "Provides secure persistent data storage with TLS encryption."
relationships:
  - source: "Patient"
    destination: "Ingress Layer"
    description: "Accesses platform via web and mobile apps"
    technology: "HTTPS/WSS via Google Cloud DNS geo-routing"
  - source: "Clinician"
    destination: "Ingress Layer"
    description: "Accesses platform via web and mobile apps"
    technology: "HTTPS/WSS via Google Cloud DNS geo-routing"
  - source: "Web Application"
    destination: "Ingress Layer"
    description: "Sends client requests"
    technology: "HTTPS/WSS"
  - source: "Mobile App"
    destination: "Ingress Layer"
    description: "Sends client requests"
    technology: "HTTPS/WSS"
  - source: "Ingress Layer"
    destination: "API Gateway"
    description: "Routes ingress traffic"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Core Telehealth Service"
    description: "Routes requests securely"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Video Consultation Service"
    description: "Routes requests securely"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "AI Symptom Checker Service"
    description: "Routes requests securely"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Consent Management Service"
    description: "Routes requests securely"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "E-Prescription & Interoperability Gateway"
    description: "Routes requests securely"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Audit & Compliance Logging Service"
    description: "Routes requests securely"
    technology: "gRPC over mTLS"
  - source: "Core Telehealth Service"
    destination: "Cloud SQL"
    description: "Persists and retrieves relational data"
    technology: "PostgreSQL Wire Protocol with TLS"
  - source: "Video Consultation Service"
    destination: "Cloud SQL"
    description: "Persists and retrieves relational data"
