level: component
scope: "Component diagram for the Cloud SQL container"
parentContainer:
  name: "Cloud SQL"
elements:
  - type: "component"
    name: "Region-Specific Database Instances"
    technology: "Google Cloud SQL for PostgreSQL"
    description: "Managed relational storage ensuring robust multi-region isolation in europe-west3 and us-central1."
  - type: "component"
    name: "Database Connection Pooler"
    technology: "PgBouncer"
    description: "Sidecar connection pooling for efficient handling of stateless microservices."
  - type: "component"
    name: "Row-Level Security (RLS) Engine"
    technology: "PostgreSQL Row-Level Security"
    description: "Enforces data access boundaries."
  - type: "component"
    name: "Audit Logging & Encryption Module"
    technology: "pgAudit + Cloud KMS CMEK"
    description: "Handles immutable auditing and customer-managed encryption keys enforcing strict data-at-rest compliance."
  - type: "component"
    name: "FHIR Storage Schemas"
    technology: "PostgreSQL JSONB tables"
    description: "Stores standardized healthcare records for interoperability."
  - type: "component"
    name: "Partitioned Consent & Audit Tables"
    technology: "PostgreSQL Partitions"
    description: "Manages partitioned data for consent and audit logs."
  - type: "component"
    name: "Read Replicas"
    technology: "PostgreSQL Regional Replicas"
    description: "Provides scalable read operations."
  - type: "component"
    name: "Schema Migration & Versioning Engine"
    technology: "Flyway/Liquibase"
    description: "Manages database schema migrations and versioning."
  - type: "component"
    name: "Database Backup & Point-in-Time Recovery (PITR) Agent"
    technology: "Google Cloud SQL Backup Agent"
    description: "Handles database backups and point-in-time recovery."
  - type: "component"
    name: "Automated Data Purging Daemon"
    technology: "pg_cron"
    description: "Automates data purging tasks."
  - type: "component"
    name: "In-Database Cryptographic Erasure Engine"
    technology: "pgcrypto"
    description: "Provides cryptographic erasure capabilities."
  - type: "component"
    name: "Database Telemetry & Metrics Exporter"
    technology: "Prometheus Exporter"
    description: "Exports database telemetry and metrics."
relationships:
  - source: "Core Telehealth Service"
    destination: "Region-Specific Database Instances & Read Replicas"
    description: "PostgreSQL Wire Protocol with TLS 1.3"
  - source: "Video Consultation Service"
    destination: "Region-Specific Database Instances & Read Replicas"
    description: "PostgreSQL Wire Protocol with TLS 1.3"
  - source: "AI Symptom Checker Service"
    destination: "Region-Specific Database Instances & Read Replicas"
    description: "PostgreSQL Wire Protocol with TLS 1.3"
  - source: "Consent Management Service"
    destination: "Region-Specific Database Instances & Read Replicas"
    description: "PostgreSQL Wire Protocol with TLS 1.3"
  - source: "E-Prescription & Interoperability Gateway"
    destination: "Region-Specific Database Instances & Read Replicas"
    description: "PostgreSQL Wire Protocol with TLS 1.3"
  - source: "Audit & Compliance Logging Service"
    destination: "Audit Logging & Encryption Module"
    description: "PostgreSQL Wire Protocol with TLS 1.3"
  - source: "E-Prescription & Interoperability Gateway"
    destination: "FHIR Storage Schemas"
    description: "PostgreSQL Wire Protocol with TLS 1.3"
  - source: "Cloud SQL Instance"
    destination: "Cloud Storage Regional Bucket"
    description: "GCP Internal APIs with TLS 1.3"
  - source: "Google Cloud Monitoring"
    destination: "Database Telemetry & Metrics Exporter"
    description: "HTTPS / Prometheus Scrape Protocol with TLS 1.3"