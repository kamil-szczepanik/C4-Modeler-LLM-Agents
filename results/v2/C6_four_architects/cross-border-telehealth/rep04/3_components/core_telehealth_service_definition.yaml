level: component
scope: "Component diagram for the Core Telehealth Service container"
parentContainer:
  name: "Core Telehealth Service"
elements:
  - type: "component"
    name: "Patient Management Component"
    technology: "Go"
    description: "Handles patient data management and records."
  - type: "component"
    name: "Consultation Orchestrator Component"
    technology: "Go"
    description: "Orchestrates video consultations and manages low-bandwidth state."
  - type: "component"
    name: "Prescription Coordinator Component"
    technology: "Node.js"
    description: "Coordinates e-prescriptions and integration flexibility."
  - type: "component"
    name: "Data Residency Enforcement Middleware"
    technology: "Go"
    description: "Wraps database queries to enforce strict regional data residency."
  - type: "component"
    name: "Audit Logging Interceptor Component"
    technology: "Go"
    description: "Dispatches compliance events and publishes audit streams."
  - type: "component"
    name: "Consent Verification Interceptor"
    technology: "Go"
    description: "Evaluates initial inbound requests for consent verification."
  - type: "component"
    name: "Resilience & Fallback Handler Component"
    technology: "Go/Node.js"
    description: "Manages low-bandwidth state and deferred events."
relationships:
