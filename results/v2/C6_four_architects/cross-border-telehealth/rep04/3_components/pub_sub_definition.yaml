# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Pub/Sub container"
parentContainer:
  name: "Pub/Sub"
elements:
  - type: "component"
    name: "EU Event Publisher"
    technology: "Google Cloud Pub/Sub API"
    description: "Handles region-isolated asynchronous event publishing for EU patients and clinicians complying with GDPR."
  - type: "component"
    name: "US Event Publisher"
    technology: "Google Cloud Pub/Sub API"
    description: "Handles region-isolated asynchronous event publishing for US patients and clinicians complying with HIPAA."
  - type: "component"
    name: "Event Router & Topic Manager"
    technology: "Google Cloud Pub/Sub"
    description: "Manages topics and subscriptions to decouple microservices and ensure high resilience and auditability."
relationships:
  - source: "EU Event Publisher"
    destination: "Event Router & Topic Manager"
    description: "Publishes encrypted events over TLS"
  - source: "US Event Publisher"
    destination: "Event Router & Topic Manager"
    description: "Publishes encrypted events over TLS"