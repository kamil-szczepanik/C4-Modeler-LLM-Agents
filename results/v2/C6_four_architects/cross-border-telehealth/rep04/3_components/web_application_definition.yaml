level: component
scope: "Component diagram for the Web Application container"
parentContainer:
  name: "Web Application"
elements:
  - type: "component"
    name: "Patient Portal UI & Clinician Dashboard"
    technology: "React, TypeScript"
    description: "Powers the Single Page Application UI and clinician dashboard."
  - type: "component"
    name: "Video Client Wrapper"
    technology: "WebRTC / LiveKit SDK"
    description: "Manages real-time audio/video streams with dynamic bitrate adaptation for unstable connections."
  - type: "component"
    name: "State & Consent Manager"
    technology: "Redux Toolkit / LocalStorage"
    description: "Manages local session state and granular data-sharing consent checks."
  - type: "component"
    name: "Local Audit & Telemetry Interceptor"
    technology: "TypeScript"
    description: "Passes UI events and consent decisions via in-memory calls and batches audit payloads."
  - type: "component"
    name: "Offline Cache & Sync Manager"
    technology: "IndexedDB / Service Worker"
    description: "Implements PWA caching strategies for offline resilience on rural connections."
  - type: "component"
    name: "Routing & Localization Engine"
    technology: "React Router / i18next"
    description: "Handles client-side navigation and dynamic jurisdictional localization."
  - type: "component"
    name: "Client Auth & Session Handler"
    technology: "OpenID Connect / OAuth2 SDK"
    description: "Handles secure in-memory token management for HIPAA and GDPR compliance."
relationships:
  - source: "Patient Portal UI & Clinician Dashboard"
    destination: "API Gateway"
    description: "Communicates via HTTPS/REST for business logic, e-prescriptions, and symptom checking"
  - source: "Video Client Wrapper"
    destination: "Video Consultation Service"
    description: "Connects via WSS/WebRTC for real-time video consultations"
  - source: "Patient Portal UI & Clinician Dashboard"
    destination: "Local Audit & Telemetry Interceptor"
    description: "Passes UI events and consent decisions via In-Memory Function Calls"
  - source: "Local Audit & Telemetry Interceptor"
    destination: "API Gateway"
    description: "Forwards batched telemetry, consent, and audit payloads via HTTPS/REST"
  - source: "Patient Portal UI & Clinician Dashboard"
    destination: "Offline Cache & Sync Manager"
    description: "Reads/writes cached state via IndexedDB API"
  - source: "Offline Cache & Sync Manager"
    destination: "API Gateway"
    description: "Synchronizes queued requests via HTTPS/REST upon reconnection"
  - source: "Patient Portal UI & Clinician Dashboard"
    destination: "Routing & Localization Engine"
    description: "Delegates route resolution and locale assets via In-Memory Function Calls"
  - source: "Patient Portal UI & Clinician Dashboard"
    destination: "Client Auth & Session Handler"
    description: "Verifies active session tokens via In-Memory Function Calls"
  - source: "Client Auth & Session Handler"
    destination: "API Gateway"
    description: "Authenticates requests via HTTPS with Bearer Tokens"