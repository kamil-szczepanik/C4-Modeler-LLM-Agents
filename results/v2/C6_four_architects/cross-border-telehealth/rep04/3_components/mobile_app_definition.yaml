level: component
scope: "Component diagram for the Mobile App container"
parentContainer:
  name: "Mobile App"
elements:
  - type: "component"
    name: "UI Layer"
    technology: "Flutter Widgets"
    description: "Presentation layer for consultations, e-prescriptions, and symptom checker."
  - type: "component"
    name: "State Management & Local Cache"
    technology: "Hive / SQLite"
    description: "Manages regional data isolation and offline-first capabilities."
  - type: "component"
    name: "API Client"
    technology: "Dio / gRPC"
    description: "Communicates with the Ingress Layer via HTTPS/WSS."
  - type: "component"
    name: "Video Module"
    technology: "LiveKit Flutter SDK"
    description: "Handles adaptive bitrate streaming for low-bandwidth connections."
  - type: "component"
    name: "Consent Module"
    technology: "Flutter"
    description: "Manages local consent states."
  - type: "component"
    name: "AI Symptom Checker Client"
    technology: "Flutter"
    description: "Handles local input validation and securely transmits payloads."
  - type: "component"
    name: "Secure Storage Manager"
    technology: "Flutter Secure Storage"
    description: "Encrypts auth tokens and regional routing preferences."
  - type: "component"
    name: "Localization & Regional Routing Manager"
    technology: "Flutter"
    description: "Stamps payloads with jurisdictional context (europe-west3 vs us-central1)."
relationships:
  - source: "API Client"
    destination: "Ingress Layer"
    description: "Sends client requests via HTTPS/WSS with region-specific routing headers."