level: component
scope: "Component diagram for the AI Symptom Checker Service container"
parentContainer:
  name: "AI Symptom Checker Service"
elements:
  - type: "component"
    name: "API Router / Controller"
    technology: "FastAPI"
    description: "Core framework for asynchronous REST endpoints."
  - type: "component"
    name: "Region Routing / Data Residency Enforcer"
    technology: "Python"
    description: "Validates residency constraints and enforces region boundaries."
  - type: "component"
    name: "FHIR Normalizer"
    technology: "Python"
    description: "Translates patient data."
  - type: "component"
    name: "Clinical NLP Pipeline"
    technology: "spaCy / Hugging Face transformers"
    description: "Clinical NLP processing for entity extraction."
  - type: "component"
    name: "Model Registry Client"
    technology: "Python"
    description: "Provides loaded model artifacts and version IDs."
  - type: "component"
    name: "Inference Engine"
    technology: "PyTorch / ONNX Runtime"
    description: "Low-latency, predictable inference execution for triage models."
  - type: "component"
    name: "Audit & Traceability Component"
    technology: "Python"
    description: "Emits cryptographic audit logs."
relationships:
  - source: "API Router / Controller"
    destination: "Region Routing / Data Residency Enforcer"
    description: "Validates residency constraints [Internal Python method call]"
  - source: "Region Routing / Data Residency Enforcer"
    destination: "FHIR Normalizer"
    description: "Translates patient data [Internal Python method call]"
  - source: "FHIR Normalizer"
    destination: "Clinical NLP Pipeline"
    description: "Extracts normalized medical entities [Internal Python method call]"
  - source: "Model Registry Client"
    destination: "Inference Engine"
    description: "Provides loaded model artifacts and version IDs [In-memory reference]"
  - source: "Inference Engine"
    destination: "Audit & Traceability Component"
    description: "Passes inference payloads and model version metadata [Internal event dispatch]"
  - source: "Audit & Traceability Component"
    destination: "Google Cloud Pub/Sub"
    description: "Emits cryptographic audit logs [Cloud Pub/Sub API over TLS]"