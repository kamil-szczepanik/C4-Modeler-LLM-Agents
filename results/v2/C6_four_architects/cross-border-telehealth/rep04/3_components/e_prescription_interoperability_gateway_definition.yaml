level: component
scope: "Component diagram for the E-Prescription & Interoperability Gateway container"
parentContainer:
  name: "E-Prescription & Interoperability Gateway"
elements:
  - type: "component"
    name: "Prescription Orchestrator Component"
    technology: "Node.js / TypeScript"
    description: "Manages internal workflow state and regional dispatch logic."
  - type: "component"
    name: "EU Translation Adapter Component"
    technology: "Node.js / TypeScript"
    description: "Translates prescription models into national EU formats."
  - type: "component"
    name: "US FHIR Adapter Component"
    technology: "Java / Spring Boot"
    description: "Interoperates with US healthcare systems using HL7 FHIR."
  - type: "component"
    name: "Audit & Signing Component"
    technology: "Node.js / TypeScript"
    description: "Cryptographically signs payloads and emits compliance audit events."
  - type: "component"
    name: "Consent Verification Middleware Component"
    technology: "Node.js / TypeScript"
    description: "Validates patient consent prior to prescription release."
  - type: "component"
    name: "Outbound Resilience & Retry Component"
    technology: "Node.js / TypeScript"
    description: "Implements circuit breaking, backoff, and store-and-forward queueing."
  - type: "component"
    name: "Consent Management Service"
    technology: "External Service"
    description: "External service that manages and provides consent tokens."
  - type: "component"
    name: "Cloud Pub/Sub"
    technology: "Google Cloud Pub/Sub"
    description: "Asynchronous messaging service for event streaming."
  - type: "component"
    name: "External Pharmacies"
    technology: "REST / SOAP / XML"
    description: "External pharmacy systems for prescription delivery."
  - type: "component"
    name: "National Health Systems"
    technology: "HL7 FHIR"
    description: "External US national health systems exchanging FHIR bundles."
relationships:
  - source: "Prescription Orchestrator Component"
    destination: "EU Translation Adapter Component"
    description: "Delegates regional formatting [Internal gRPC]"
  - source: "Prescription Orchestrator Component"
    destination: "US FHIR Adapter Component"
    description: "Delegates regional formatting [Internal gRPC]"
  - source: "Prescription Orchestrator Component"
    destination: "Consent Verification Middleware Component"
    description: "Validates active patient consent [Internal gRPC]"
  - source: "Prescription Orchestrator Component"
    destination: "Audit & Signing Component"
    description: "Requests payload digital signature [In-memory function call]"
  - source: "EU Translation Adapter Component"
    destination: "Outbound Resilience & Retry Component"
    description: "Delegates dispatch execution [In-memory async call]"
  - source: "US FHIR Adapter Component"
    destination: "Outbound Resilience & Retry Component"
    description: "Delegates dispatch execution [In-memory async call]"
  - source: "Consent Verification Middleware Component"
    destination: "Consent Management Service"
    description: "Queries consent tokens [gRPC over mTLS]"
  - source: "Audit & Signing Component"
    destination: "Cloud Pub/Sub"
    description: "Publishes audit events [Cloud Pub/Sub API over TLS]"
  - source: "Outbound Resilience & Retry Component"
    destination: "External Pharmacies"
    description: "Transmits prescriptions [REST / SOAP / XML over TLS 1.3]"
  - source: "US FHIR Adapter Component"
    destination: "National Health Systems"
    description: "Exchanges FHIR bundles [REST over TLS 1.3]"