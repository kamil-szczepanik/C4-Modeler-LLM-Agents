level: component
scope: "Component diagram for the Audit & Compliance Logging Service container"
parentContainer:
  name: "Audit & Compliance Logging Service"
elements:
  - type: "component"
    name: "Audit API Handler"
    technology: "Go / Fiber"
    description: "Handles incoming audit API requests securely."
  - type: "component"
    name: "Event Consumer Worker"
    technology: "Go / Goroutine"
    description: "Consumes asynchronous events for logging."
  - type: "component"
    name: "Compliance Sanitizer & Formatter"
    technology: "Go"
    description: "Sanitizes and formats audit payloads."
  - type: "component"
    name: "Log Persistence Engine"
    technology: "Go / pgx"
    description: "Persists and retrieves logs from relational storage."
  - type: "component"
    name: "Log Integrity Verifier"
    technology: "Go / Cryptographic Hash Chaining"
    description: "Validates cryptographic hash chains for log integrity."
  - type: "component"
    name: "Regulatory Reporter"
    technology: "Go"
    description: "Fetches logs for compliance and regulatory reporting."
relationships:
  - source: "Audit API Handler"
    destination: "Compliance Sanitizer & Formatter"
    description: "Processes audit payloads [In-memory function calls]"
  - source: "Event Consumer Worker"
    destination: "Compliance Sanitizer & Formatter"
    description: "Processes audit payloads [In-memory function calls]"
  - source: "Compliance Sanitizer & Formatter"
    destination: "Log Persistence Engine"
    description: "Forwards sanitized logs [In-memory function calls]"
  - source: "Log Persistence Engine"
    destination: "Log Integrity Verifier"
    description: "Validates cryptographic hash chains [In-memory channels / background goroutine]"
  - source: "Log Persistence Engine"
    destination: "Regulatory Reporter"
    description: "Fetches logs for reporting [In-memory function calls]"