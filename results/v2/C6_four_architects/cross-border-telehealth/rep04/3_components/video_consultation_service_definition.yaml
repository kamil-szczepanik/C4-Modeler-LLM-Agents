level: component
scope: "Component diagram for the Video Consultation Service container"
parentContainer:
  name: "Video Consultation Service"
elements:
  - type: "component"
    name: "Signaling Component"
    technology: "Node.js / Go"
    description: "Handles signaling, validates session access, manages room allocation and transport, and persists metadata and states."
  - type: "component"
    name: "Media Router / SFU Node"
    technology: "LiveKit Server"
    description: "SFU node responsible for real-time video media routing and transport."
  - type: "component"
    name: "Session Controller Component"
    technology: "Go"
    description: "Controls session logic and publishes audit events."
  - type: "component"
    name: "Bandwidth Adaptator"
    technology: "Go"
    description: "Dynamically adjusts simulcast layers for reliable video consultations."
  - type: "component"
    name: "Encryption & Compliance Proxy"
    technology: "C++ / Go"
    description: "Enforces encryption and broadcasts telemetry for compliance."
relationships:
  - source: "Signaling Component"
    destination: "Session Controller Component"
    description: "Validates session access [Internal gRPC]"
  - source: "Signaling Component"
    destination: "Media Router / SFU Node"
    description: "Manages room allocation and transport [WebRTC / WebSocket]"
  - source: "Signaling Component"
    destination: "Cloud SQL"
    description: "Persists metadata and states [PostgreSQL Wire Protocol with TLS]"
  - source: "Bandwidth Adaptator"
    destination: "Media Router / SFU Node"
    description: "Dynamically adjusts simulcast layers [LiveKit Server SDK]"
  - source: "Session Controller Component"
    destination: "Pub/Sub"
    description: "Publishes audit events [gRPC over TLS]"
  - source: "Encryption & Compliance Proxy"
    destination: "Pub/Sub"
    description: "Broadcasts telemetry [Cloud Pub/Sub API over TLS]"