level: component
scope: "Component diagram for the Ingress Layer container"
parentContainer:
  name: "Ingress Layer"
elements:
  - type: "component"
    name: "Google Cloud DNS"
    technology: "Google Cloud DNS"
    description: "Provides geo-routing to direct EU traffic to europe-west3 and US traffic to us-central1."
  - type: "component"
    name: "Google Cloud Armor"
    technology: "Google Cloud Armor"
    description: "Edge security and WAF providing OWASP Top 10 protection and rate-limiting."
  - type: "component"
    name: "Google Cloud Certificate Manager"
    technology: "Google Cloud Certificate Manager"
    description: "Manages SSL/TLS certificates for secure traffic termination."
  - type: "component"
    name: "Google Cloud Global HTTPS Load Balancer"
    technology: "Google Cloud Global HTTPS Load Balancer"
    description: "Terminates TLS 1.3, handles WebSocket upgrades, and utilizes Regional Backend Multiplexing."
  - type: "component"
    name: "Regional Backend Multiplexer"
    technology: "Google Cloud Regional Backend Multiplexer"
    description: "Forwards decrypted traffic to regionally segregated API gateways."
  - type: "component"
    name: "Ingress Access Logging"
    technology: "Google Cloud Logging & Pub/Sub"
    description: "Emits security events and access logs."
relationships:
  - source: "Google Cloud DNS"
    destination: "Google Cloud Global HTTPS Load Balancer"
    description: "Routes HTTPS/WSS traffic via geo-routing"
  - source: "Google Cloud Armor"
    destination: "Google Cloud Global HTTPS Load Balancer"
    description: "Passes filtered traffic"
  - source: "Google Cloud Certificate Manager"
    destination: "Google Cloud Global HTTPS Load Balancer"
    description: "Provides SSL/TLS certificates for termination"
  - source: "Google Cloud Global HTTPS Load Balancer"
    destination: "Regional Backend Multiplexer"
    description: "Forwards decrypted traffic via internal proxy routing"
  - source: "Google Cloud Armor"
    destination: "Ingress Access Logging"
    description: "Emits security events and access logs"
  - source: "Google Cloud Global HTTPS Load Balancer"
    destination: "Ingress Access Logging"
    description: "Emits security events and access logs"