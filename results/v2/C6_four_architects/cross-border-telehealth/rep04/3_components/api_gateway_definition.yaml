level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Authentication & Token Validator Component"
    technology: "Envoy/Lua-based JWT validator"
    description: "Validates JSON Web Tokens (JWT) for incoming requests."
  - type: "component"
    name: "Region Routing & Geofencing Filter"
    technology: "Custom Envoy Filter / Cloud API Gateway Extension"
    description: "Enforces regional data residency and geofencing rules."
  - type: "component"
    name: "Rate Limiter & Threat Protection Component"
    technology: "Redis-backed Rate Limiter"
    description: "Protects against threats and enforces rate limits."
  - type: "component"
    name: "Request Telemetry & Audit Injector Component"
    technology: "OpenTelemetry SDK / Custom Interceptor"
    description: "Injects telemetry and audit metadata into requests."
  - type: "component"
    name: "Payload Validation & Sanitization Component"
    technology: "JSON Schema / OpenAPI Validator"
    description: "Validates and sanitizes request payloads for EU MDR compliance."
  - type: "component"
    name: "Service Discovery & Upstream Router Component"
    technology: "Envoy Cluster Manager / gRPC Resolver"
    description: "Routes requests to appropriate upstream core downstream services."
relationships:
  - source: "Authentication & Token Validator Component"
    destination: "Payload Validation & Sanitization Component"
    description: "Internal"
  - source: "Payload Validation & Sanitization Component"
    destination: "Region Routing & Geofencing Filter"
    description: "Internal"
  - source: "Region Routing & Geofencing Filter"
    destination: "Request Telemetry & Audit Injector Component"
    description: "Internal"
  - source: "Region Routing & Geofencing Filter"
    destination: "Service Discovery & Upstream Router Component"
    description: "Internal"