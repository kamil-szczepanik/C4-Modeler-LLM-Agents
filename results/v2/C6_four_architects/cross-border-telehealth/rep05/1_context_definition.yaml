level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US while enforcing strict regional data isolation to comply with GDPR and HIPAA mandates."
elements:
  - type: "person"
    name: "Patients and Clinicians"
    description: "Users who access the platform for video consultations, e-prescriptions, and AI symptom checking."
  - type: "externalSystem"
    name: "Global HTTPS Load Balancer with Geo-routing (GCP)"
    description: "Routes user traffic globally to appropriate regional systems based on geographic location."
  - type: "externalSystem"
    name: "EU Telehealth System (GCP europe-west3)"
    description: "Regional system enforcing data residency and compliance for EU patients and clinicians."
  - type: "externalSystem"
    name: "US Telehealth System (GCP us-central1)"
    description: "Regional system enforcing data residency and compliance for US patients and clinicians."
  - type: "externalSystem"
    name: "Regional Pharmacy Networks and Health Information Exchanges (HIEs)"
    description: "External networks for handling prescriptions and health information exchange."
  - type: "externalSystem"
    name: "AI Model Provider / Inference Service"
    description: "External service providing AI-driven symptom checking capabilities."
  - type: "externalSystem"
    name: "WebRTC/SFU Media Relay"
    description: "Media relay supporting low-bandwidth video consultations with adaptive bitrate streaming."
relationships:
  - source: "Patients and Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS and WebRTC"
  - source: "Global HTTPS Load Balancer with Geo-routing (GCP)"
    destination: "EU Telehealth System (GCP europe-west3)"
    description: "Routes regional EU traffic"
    technology: "Regional Routing"
  - source: "Global HTTPS Load Balancer with Geo-routing (GCP)"
    destination: "US Telehealth System (GCP us-central1)"
    description: "Routes regional US traffic"
    technology: "Regional Routing"
  - source: "EU Telehealth System (GCP europe-west3)"
    destination: "Regional Pharmacy Networks and Health Information Exchanges (HIEs)"
    description: "Interoperates for e-prescriptions and health exchanges"
    technology: "mTLS, REST, HL7 FHIR, and national gateways"
  - source: "US Telehealth System (GCP us-central1)"
    destination: "Regional Pharmacy Networks and Health Information Exchanges (HIEs)"
    description: "Interoperates for e-prescriptions and health exchanges"
    technology: "mTLS, REST, HL7 FHIR, and national gateways"
  - source: "EU Telehealth System (GCP europe-west3)"
    destination: "AI Model Provider / Inference Service"
    description: "Requests AI inference for symptom checking"
    technology: "mTLS and HTTPS"
  - source: "US Telehealth System (GCP us-central1)"
    destination: "AI Model Provider / Inference Service"
    description: "Requests AI inference for symptom checking"
    technology: "mTLS and HTTPS"
  - source: "EU Telehealth System (GCP europe-west3)"
    destination: "US Telehealth System (GCP us-central1)"
    description: "Performs consent-driven queries between regional systems"
    technology: "mTLS and gRPC"