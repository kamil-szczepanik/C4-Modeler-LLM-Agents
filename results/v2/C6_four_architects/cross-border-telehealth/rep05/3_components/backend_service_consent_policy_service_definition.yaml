level: component
scope: "Component diagram for the Backend Service & Consent & Policy Service container"
parentContainer:
  name: "Backend Service & Consent & Policy Service"
elements:
  - type: "component"
    name: "API Router & Controller Component"
    technology: "Spring Boot / FastAPI"
    description: "Implements API routing and control logic"
  - type: "component"
    name: "Consent & Policy Engine Component"
    technology: "Open Policy Agent (OPA) + Java/Python"
    description: "Enforces GDPR and HIPAA consent rules"
  - type: "component"
    name: "FHIR & E-Prescription Domain Component"
    technology: "HAPI FHIR / Spring Data"
    description: "Manages clinical data models and standards"
  - type: "component"
    name: "Audit & Traceability Logger Component"
    technology: "Custom Middleware"
    description: "Logs and tracks platform activities"
  - type: "component"
    name: "Data Residency Router Component"
    technology: "Spring Cloud / Custom Middleware"
    description: "Handles regional routing for data-locality compliance"
  - type: "component"
    name: "AI Traceability & Logging Interceptor Component"
    technology: "Spring AOP / Python Middleware"
    description: "Captures AI symptom checker inputs and model versions"
  - type: "component"
    name: "E-Prescription Translation Adapter Component"
    technology: "Apache Camel"
    description: "Translates clinical models into regional e-prescription formats"
relationships:
  - source: "API Router & Controller Component"
    destination: "Consent & Policy Engine Component"
    description: "Evaluates access permissions via in-memory gRPC"
  - source: "API Router & Controller Component"
    destination: "Data Residency Router Component"
    description: "Determines target region for data mutations via in-process method calls"
  - source: "Data Residency Router Component"
    destination: "Cloud SQL for PostgreSQL & Memorystore for Redis"
    description: "Enforces regional connection pools via JDBC over TLS"
  - source: "FHIR & E-Prescription Domain Component"
    destination: "E-Prescription Translation Adapter Component"
    description: "Hands off clinical orders via in-process calls"
  - source: "E-Prescription Translation Adapter Component"
    destination: "Integration Adapter Container"
    description: "Dispatches formatted prescriptions via gRPC"
  - source: "AI Traceability & Logging Interceptor Component"
    destination: "GCP Cloud Storage with Object Retention (WORM)"
    description: "Writes immutable audit logs via HTTPS/Storage API"