level: component
scope: "Component diagram for the Integration Adapter Container container"
parentContainer:
  name: "Integration Adapter Container"
elements:
  - type: "component"
    name: "Internal Ingress Router"
    technology: "Go"
    description: "Handles high-performance tenant-aware gRPC routing."
  - type: "component"
    name: "FHIR Translation Component"
    technology: "Node.js/TypeScript"
    description: "Powers US HL7 FHIR standard transformations."
  - type: "component"
    name: "EU National e-Prescription Adapter"
    technology: "Java/Spring Boot"
    description: "Implements regional compliance for EU e-prescriptions."
  - type: "component"
    name: "AI Gateway Intermediary"
    technology: "Python/FastAPI"
    description: "Standardizes payloads for MDR traceability."
  - type: "component"
    name: "Adapter Security & Audit Proxy"
    technology: "Envoy Proxy (Sidecar)"
    description: "Acts as a sidecar proxy for strict egress policy and TLS 1.3 enforcement."
  - type: "component"
    name: "Backend Service & Consent & Policy Service"
    technology: "Backend Service"
    description: "External or parent boundary service interacting with the ingress router."
  - type: "component"
    name: "External HIEs"
    technology: "REST/FHIR over mTLS"
    description: "External Health Information Exchanges in us-central1."
  - type: "component"
    name: "External Pharmacy Networks"
    technology: "SOAP/REST over mTLS"
    description: "External pharmacy networks in europe-west3."
  - type: "component"
    name: "External Systems"
    technology: "TLS 1.3, mTLS"
    description: "External systems subject to region-locked GCP egress."
relationships:
  - source: "Backend Service & Consent & Policy Service"
    destination: "Internal Ingress Router"
    description: "gRPC over Istio mTLS"
  - source: "Internal Ingress Router"
    destination: "FHIR Translation Component"
    description: "Internal gRPC"
  - source: "Internal Ingress Router"
    destination: "EU National e-Prescription Adapter"
    description: "Internal gRPC"
  - source: "FHIR Translation Component"
    destination: "External HIEs"
    description: "REST/FHIR over mTLS (us-central1)"
  - source: "EU National e-Prescription Adapter"
    destination: "External Pharmacy Networks"
    description: "SOAP/REST over mTLS (europe-west3)"
  - source: "Adapter Security & Audit Proxy"
    destination: "External Systems"
    description: "TLS 1.3, mTLS, and region-locked GCP egress"