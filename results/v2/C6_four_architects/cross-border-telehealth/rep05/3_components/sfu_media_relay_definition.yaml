level: component
scope: "Component diagram for the SFU Media Relay container"
parentContainer:
  name: "SFU Media Relay"
elements:
  - type: "component"
    name: "ICE/TURN Server"
    technology: "WebRTC, STUN/TURN, UDP"
    description: "Handles NAT traversal and peer-to-peer connection establishment for low-bandwidth video streams."
  - type: "component"
    name: "SFU Core Routing Engine"
    technology: "LiveKit / Mediasoup, WebRTC"
    description: "Manages selective forwarding unit core routing, real-time video processing, and session states."
  - type: "component"
    name: "ABR Controller"
    technology: "Adaptive Bitrate Control"
    description: "Supports unstable rural connections through adaptive bitrate control and localized degradation modes."
  - type: "component"
    name: "Telemetry & QoS Agent"
    technology: "QoS Monitoring"
    description: "Monitors call quality and telemetry data during video consultations."
  - type: "component"
    name: "Token Auth & Session Validator"
    technology: "gRPC, mTLS"
    description: "Verifies participant access tokens with the Backend Service securely."
  - type: "component"
    name: "Media Recorder / Audit Interceptor"
    technology: "HTTPS"
    description: "Persists encrypted compliance recordings to GCP Cloud Storage."
relationships:
  - source: "Token Auth & Session Validator"
    destination: "Backend Service & Consent & Policy Service"
    description: "Verifies participant access tokens"
  - source: "SFU Core Routing Engine"
    destination: "Backend Service & Consent & Policy Service"
    description: "Reports call session states and metrics"
  - source: "Media Recorder / Audit Interceptor"
    destination: "GCP Cloud Storage with Object Retention (WORM)"
    description: "Persists encrypted compliance recordings"