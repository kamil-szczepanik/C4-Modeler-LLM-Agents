level: component
scope: "Component diagram for the GCP Cloud Storage with Object Retention (WORM) container"
parentContainer:
  name: "GCP Cloud Storage with Object Retention (WORM)"
elements:
  - type: "component"
    name: "Bucket Manager / Retention Policy Enforcer"
    technology: "GCP Cloud Storage & Bucket Lock"
    description: "Manages buckets and enforces WORM retention policies in compliance mode."
  - type: "component"
    name: "Access Control & Encryption Router"
    technology: "Cloud KMS & IAM"
    description: "Routes access control and executes envelope encryption using regional customer-managed encryption keys."
  - type: "component"
    name: "Audit Log Verifier / Integrity Checker"
    technology: "Cloud Pub/Sub & Integrity Validation Service"
    description: "Triggers and processes object integrity validation events asynchronously."
  - type: "component"
    name: "Audit & Access Logger"
    technology: "Cloud Logging API & BigQuery"
    description: "Captures and exports security telemetry and audit trails for compliance."
relationships:
  - source: "Bucket Manager / Retention Policy Enforcer"
    destination: "Audit Log Verifier / Integrity Checker"
    description: "Triggers integrity validation events [Cloud Pub/Sub]"
  - type: "component"
    name: "AI Symptom Checker Service"
    destination: "Access Control & Encryption Router"
    description: "Streams immutable audit logs [HTTPS / GCP IAM]"
  - type: "component"
    name: "Access Control & Encryption Router"
    destination: "Cloud KMS (Regional)"
    description: "Executes envelope encryption [gRPC]"
  - type: "component"
    name: "Audit & Access Logger"
    destination: "GCP Cloud Logging / BigQuery"
    description: "Exports security telemetry [Cloud Logging API]"