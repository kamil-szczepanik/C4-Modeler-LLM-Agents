level: component
scope: "Component diagram for the Envoy API Gateway container"
parentContainer:
  name: "Envoy API Gateway"
elements:
  - type: "component"
    name: "Listener & TLS Termination Component"
    technology: "Envoy TLS Filter / BoringSSL"
    description: "Terminates incoming TLS connections and handles cryptographic handshakes."
  - type: "component"
    name: "Routing & Traffic Management Component"
    technology: "Envoy Router Filter"
    description: "Manages secure routing and traffic flow across GCP regions."
  - type: "component"
    name: "External Authorization Filter"
    technology: "Envoy Ext_Authz Filter + Open Policy Agent / OPA"
    description: "Enforces policy, GDPR, HIPAA, and consent validation."
  - type: "component"
    name: "Telemetry & Audit Logging Component"
    technology: "Envoy Access Log Service / ALS with OpenTelemetry OTel Filter"
    description: "Emits span data and access logs for EU MDR traceability."
  - type: "component"
    name: "Rate Limiting & Circuit Breaking Component"
    technology: "Envoy Local/Global Rate Limit Filters & Memorystore for Redis"
    description: "Evaluates traffic quotas and client health using distributed token buckets."
  - type: "component"
    name: "WAF & Threat Mitigation Component"
    technology: "Google Cloud Armor"
    description: "Inspects incoming edge traffic and filters malicious payloads."
  - type: "component"
    name: "Geo-Routing & Header Enforcement Filter"
    technology: "Envoy Header Mutation & Lua/Wasm Filter"
    description: "Evaluates client context and tags requests for regional upstreams."
  - type: "component"
    name: "Upstream Health Checking & Failover Component"
    technology: "Envoy Active/Passive Health Checking & Outlier Detection"
    description: "Performs active health probes and queries endpoint health status."
  - type: "component"
    name: "Compression & Content Optimization Component"
    technology: "Envoy Compression Filter / Brotli & Gzip"
    description: "Passes outgoing response streams for dynamic API compression."
  - type: "component"
    name: "mTLS & Upstream TLS Context Component"
    technology: "Envoy Upstream TLS Context / Secret Discovery Service"
    description: "Enforces cryptographic tunnel parameters and mutual TLS encrypted connections."
relationships:
  - source: "GCP Global HTTPS Load Balancer"
    destination: "WAF & Threat Mitigation Component"
    description: "Inspects incoming edge traffic [HTTPS]"
  - source: "WAF & Threat Mitigation Component"
    destination: "Listener & TLS Termination Component"
    description: "Passes sanitized traffic to Envoy [HTTPS]"
  - source: "Listener & TLS Termination Component"
    destination: "Geo-Routing & Header Enforcement Filter"
    description: "Evaluates client context [Internal HTTP]"
  - source: "Geo-Routing & Header Enforcement Filter"
    destination: "Routing & Traffic Management Component"
    description: "Forwards tagged requests to regional upstreams [gRPC]"
  - source: "Routing & Traffic Management Component"
    destination: "External Authorization Filter"
    description: "Queries for permission checks [gRPC]"
  - source: "Routing & Traffic Management Component"
    destination: "Rate Limiting & Circuit Breaking Component"
    description: "Evaluates traffic quotas and client health [gRPC/Internal]"
  - source: "Rate Limiting & Circuit Breaking Component"
    destination: "Memorystore for Redis"
    description: "Fetches distributed token buckets for rate limiting [RESP]"
  - source: "Routing & Traffic Management Component"
    destination: "Telemetry & Audit Logging Component"
    description: "Emits span data and access logs [gRPC over OTel protocol]"
  - source: "Routing & Traffic Management Component"
    destination: "Upstream Health Checking & Failover Component"
    description: "Queries endpoint health status [Internal gRPC]"
  - source: "Upstream Health Checking & Failover Component"
    destination: "Backend Service & Consent & Policy Service"
    description: "Performs active health probes [HTTP/gRPC health checks]"
  - source: "Routing & Traffic Management Component"
    destination: "Compression & Content Optimization Component"
    description: "Passes outgoing response streams for encoding [Internal HTTP/2]"
  - source: "Compression & Content Optimization Component"
    destination: "Listener & TLS Termination Component"
    description: "Delivers compressed payloads back to the client [HTTPS]"
  - source: "Routing & Traffic Management Component"
    destination: "mTLS & Upstream TLS Context Component"
    description: "Enforces cryptographic tunnel parameters [Internal gRPC]"
  - source: "mTLS & Upstream TLS Context Component"
    destination: "Backend Service & Consent & Policy Service"
    description: "Establishes mutual TLS encrypted connections [gRPC over mTLS]"