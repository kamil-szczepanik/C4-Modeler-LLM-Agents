level: component
scope: "Component diagram for the AI Symptom Checker Service container"
parentContainer:
  name: "AI Symptom Checker Service"
elements:
  - type: "component"
    name: "API Router Component"
    technology: "Python / FastAPI"
    description: "Powers the core container services and REST/gRPC routing."
  - type: "component"
    name: "Consent Enforcement Interceptor"
    technology: "Open Policy Agent SDK"
    description: "Enforces regional consent policies locally."
  - type: "component"
    name: "Clinical Inference Orchestrator"
    technology: "Python"
    description: "Orchestrates clinical inference workflows."
  - type: "component"
    name: "Payload Sanitizer & PII Redactor"
    technology: "Python / Presidio"
    description: "Strips PII locally before external AI inference for GDPR/HIPAA compliance."
  - type: "component"
    name: "Region-Aware Model Router"
    technology: "Python"
    description: "Resolves regional endpoints for AI inference."
  - type: "component"
    name: "Symptom Session Cache"
    technology: "Async-LRU / Redis client"
    description: "Caches multi-turn session states for rural connectivity resilience."
  - type: "component"
    name: "FHIR Interoperability Mapper"
    technology: "Custom Pydantic-FHIR"
    description: "Standardizes clinical outputs to HL7 FHIR resources for interoperability."
  - type: "component"
    name: "Audit & Traceability Logger"
    technology: "Python"
    description: "Passes structured FHIR audit payloads."
  - type: "component"
    name: "AI Model Provider / Inference Service"
    technology: "External AI Service"
    description: "External AI inference service that receives de-identified clinical payloads."
  - type: "component"
    name: "GCP Cloud Storage with Object Retention (WORM)"
    technology: "GCP Cloud Storage (WORM)"
    description: "Stores immutable audit logs for EU MDR traceability compliance."
relationships:
  - source: "API Router Component"
    destination: "Consent Enforcement Interceptor"
    description: "Validates user consent [In-memory function call]"
  - source: "Consent Enforcement Interceptor"
    destination: "Clinical Inference Orchestrator"
    description: "Triggers analysis [In-memory function call]"
  - source: "Clinical Inference Orchestrator"
    destination: "Payload Sanitizer & PII Redactor"
    description: "Sanitizes symptom text [In-memory function call]"
  - source: "Payload Sanitizer & PII Redactor"
    destination: "AI Model Provider / Inference Service"
    description: "Sends de-identified clinical payloads [HTTPS / REST]"
  - source: "Clinical Inference Orchestrator"
    destination: "Region-Aware Model Router"
    description: "Resolves regional endpoint [In-memory function call]"
  - source: "Region-Aware Model Router"
    destination: "AI Model Provider / Inference Service"
    description: "Sends de-identified payload to region-specific AI instance [HTTPS / REST]"
  - source: "API Router Component"
    destination: "Symptom Session Cache"
    description: "Manages multi-turn conversation state [In-memory / Redis]"
  - source: "Clinical Inference Orchestrator"
    destination: "Symptom Session Cache"
    description: "Manages multi-turn conversation state [In-memory / Redis]"
  - source: "Clinical Inference Orchestrator"
    destination: "FHIR Interoperability Mapper"
    description: "Normalizes symptom assessment output [In-memory function call]"
  - source: "FHIR Interoperability Mapper"
    destination: "Audit & Traceability Logger"
    description: "Passes structured FHIR audit payload [In-memory queue]"
  - source: "Audit & Traceability Logger"
    destination: "GCP Cloud Storage with Object Retention (WORM)"
    description: "Writes immutable logs [GCP IAM / HTTPS]"