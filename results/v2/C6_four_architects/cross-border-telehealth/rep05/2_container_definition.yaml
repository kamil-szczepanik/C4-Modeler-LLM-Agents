level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients and Clinicians"
    description: "External users who access the platform for secure video consultations, e-prescriptions, and AI symptom checking."
  - type: "externalSystem"
    name: "External Regional Pharmacy Networks, HIEs, and AI Model Providers"
    description: "External systems for handling e-prescriptions, health information exchange, and AI model inferences."
  - type: "container"
    name: "GCP Global HTTPS Load Balancer with Geo-routing"
    description: "Routes user traffic globally to appropriate regional systems based on geographic location."
    technology: "GCP Global HTTPS Load Balancer"
  - type: "container"
    name: "Envoy API Gateway"
    description: "Provides edge routing, security, and TLS termination for regional internal traffic."
    technology: "Envoy Proxy, Google Cloud Armor"
  - type: "container"
    name: "Backend Service & Consent & Policy Service"
    description: "Manages backend business logic, relational data, FHIR records, consent, and access policies."
    technology: "GKE, Open Policy Agent (OPA)"
  - type: "container"
    name: "AI Symptom Checker Service"
    description: "Provides AI-driven symptom analysis for patients."
    technology: "FastAPI, GKE"
  - type: "container"
    name: "SFU Media Relay"
    description: "Supports low-bandwidth video consultations with adaptive bitrate streaming."
    technology: "LiveKit / Mediasoup, WebRTC"
  - type: "container"
    name: "Integration Adapter Container"
    description: "Handles interoperability and secure communication with external HIEs and pharmacies."
    technology: "Container, mTLS, HTTPS"
  - type: "container"
    name: "Cloud SQL for PostgreSQL & Memorystore for Redis"
    description: "Stores relational data, FHIR resources, consent records, sessions, and WebRTC states."
    technology: "Cloud SQL for PostgreSQL, Memorystore for Redis"
  - type: "container"
    name: "GCP Cloud Storage with Object Retention (WORM)"
    description: "Provides immutable object storage for AI audit logs and compliance."
    technology: "GCP Cloud Storage"
relationships:
  - source: "Patients and Clinicians"
    destination: "GCP Global HTTPS Load Balancer with Geo-routing"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS"
  - source: "GCP Global HTTPS Load Balancer with Geo-routing"
    destination: "Envoy API Gateway"
    description: "Routes regional user traffic"
    technology: "HTTPS/REST"
  - source: "Envoy API Gateway"
    destination: "Backend Service & Consent & Policy Service"
    description: "Forwards API requests and enforces policies"
    technology: "gRPC over Istio mTLS"
  - source: "Envoy API Gateway"
    destination: "AI Symptom Checker Service"
    description: "Sends symptom analysis requests"
    technology: "gRPC over Istio mTLS"
  - source: "Patients and Clinicians"
    destination: "SFU Media Relay"
    description: "Streams video consultations"
    technology: "UDP (ICE/STUN/TURN)"
  - source: "Backend Service & Consent & Policy Service"
    destination: "Cloud SQL for PostgreSQL & Memorystore for Redis"
    description: "Reads and writes relational data, FHIR, consent, and session states"
    technology: "SQL / Redis Protocol"
  - source: "AI Symptom Checker Service"
    destination: "GCP Cloud Storage with Object Retention (WORM)"
    description: "Stores immutable AI audit logs"
    technology: "GCP IAM / HTTPS"
  - source: "Integration Adapter Container"
    destination: "External Regional Pharmacy Networks, HIEs, and AI Model Providers"
    description: "Interoperates with external health networks and pharmacies"
    technology: "mTLS / HTTPS"
  - source: "Backend Service & Consent & Policy Service"
    destination: "Integration Adapter Container"
    description: "Communicates via internal service mesh"
    technology: "gRPC over Istio mTLS"