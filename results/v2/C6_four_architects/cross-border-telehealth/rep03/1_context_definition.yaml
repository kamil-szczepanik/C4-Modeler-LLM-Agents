level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US while enforcing strict regional data residency and regulatory compliance on GCP."
elements:
  - type: "person"
    name: "Patients and Clinicians"
    description: "Users located in the EU and US interacting with the telehealth platform for consultations and health checks."
  - type: "externalSystem"
    name: "External Pharmacy Gateways"
    description: "External systems for processing e-prescriptions."
  - type: "externalSystem"
    name: "Identity Providers (IdP)"
    description: "External identity providers handling authentication via OIDC/OAuth2."
  - type: "externalSystem"
    name: "Payment Gateways (Stripe)"
    description: "External payment processors handling financial transactions."
relationships:
  - source: "Patients and Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS, WebRTC, OIDC/OAuth2"
  - source: "Cross-Border Telehealth Platform"
    destination: "External Pharmacy Gateways"
    description: "Sends e-prescription data"
    technology: "mTLS, REST, SOAP, HL7 FHIR"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity Providers (IdP)"
    description: "Authenticates users"
    technology: "OIDC/OAuth2"
  - source: "Cross-Border Telehealth Platform"
    destination: "Payment Gateways (Stripe)"
    destination: "Processes payments"
    description: "Processes payments"
    technology: "HTTPS, REST with webhooks"