level: component
scope: "Component diagram for the AI Symptom Checker Service container"
parentContainer:
  name: "AI Symptom Checker Service"
elements:
  - type: "component"
    name: "Symptom Assessment API Handler"
    technology: "Python / FastAPI"
    description: "High-performance asynchronous API handling and request validation."
  - type: "component"
    name: "Consent & Policy Enforcer"
    technology: "Python / OPA SDK"
    description: "Runtime GDPR/HIPAA data-processing consent enforcement."
  - type: "component"
    name: "Clinical NLP Processor"
    technology: "Python / spaCy & Transformers"
    description: "Advanced NLP for extracting clinical entities from unstructured text."
  - type: "component"
    name: "Inference Orchestrator"
    technology: "Python / PyTorch / LangChain"
    description: "Core ML inference orchestration and regional LLM execution."
  - type: "component"
    name: "Regional Model Gateway"
    technology: "Python / HTTPX"
    description: "Enforces strict regional data residency in GCP via regional LLM endpoints."
  - type: "component"
    name: "Safety & Fallback Guardrail Engine"
    technology: "Python / Rule-based heuristics"
    description: "Validates raw urgency recommendations and provides deterministic safety guardrails."
  - type: "component"
    name: "Traceability & Audit Emitter"
    technology: "Python / OpenTelemetry SDK"
    description: "Publishes immutable audit logs for EU MDR traceability."
  - type: "component"
    name: "Audit Persistence Hook"
    technology: "Python / SQLAlchemy"
    description: "Regional PostgreSQL persistence for EU MDR traceability and audit logs."
relationships:
  - source: "Symptom Assessment API Handler"
    destination: "Consent & Policy Enforcer"
    description: "Validates active data-processing consent [gRPC / Local Cache]"
  - source: "Symptom Assessment API Handler"
    destination: "Clinical NLP Processor"
    description: "Extracts entities [In-memory]"
  - source: "Clinical NLP Processor"
    destination: "Inference Orchestrator"
    description: "Requests urgency score [In-memory]"
  - source: "Inference Orchestrator"
    destination: "Regional Model Gateway"
    description: "Dispatches sanitized features to regional LLM endpoints [REST/mTLS]"
  - source: "Inference Orchestrator"
    destination: "Safety & Fallback Guardrail Engine"
    description: "Validates raw urgency recommendation [In-memory]"
  - source: "Safety & Fallback Guardrail Engine"
    destination: "Symptom Assessment API Handler"
    description: "Returns finalized care urgency [In-memory]"
  - source: "Inference Orchestrator"
    destination: "Traceability & Audit Emitter"
    description: "Publishes immutable audit logs [gRPC]"
  - source: "Traceability & Audit Emitter"
    destination: "Audit Persistence Hook"
    description: "Persists audit logs locally [PostgreSQL over mTLS]"