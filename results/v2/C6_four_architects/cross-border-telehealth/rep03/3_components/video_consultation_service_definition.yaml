level: component
scope: "Component diagram for the Video Consultation Service container"
parentContainer:
  name: "Video Consultation Service"
elements:
  - type: "component"
    name: "Signaling"
    technology: "Node.js"
    description: "Handles signaling for WebRTC peer connections."
  - type: "component"
    name: "SFU Router"
    technology: "Mediasoup"
    description: "Routes media streams between participants in a video session."
  - type: "component"
    name: "Adaptive Transcoder"
    technology: "Node.js"
    description: "Adjusts media quality based on bandwidth conditions."
  - type: "component"
    name: "Session Policy Enforcer"
    technology: "Node.js"
    description: "Enforces session policies and access controls."
  - type: "component"
    name: "Compliance Audit Interceptor"
    technology: "Node.js"
    description: "Interprets and captures session data for compliance auditing."
  - type: "component"
    name: "TURN/STUN Orchestrator"
    technology: "Node.js"
    description: "Orchestrates NAT traversal via TURN/STUN servers."
  - type: "component"
    name: "Media Quality Monitor"
    technology: "Node.js"
    description: "Monitors the quality of active media streams."
  - type: "component"
    name: "Room State Manager"
    technology: "Node.js / Redis"
    description: "Manages active session and room states."
  - type: "component"
    name: "Media Encryption Enforcer"
    technology: "Node.js"
    description: "Enforces end-to-end encryption for media streams."
relationships:
  - source: "Signaling"
    destination: "Room State Manager"
    description: "Reads/writes active session states [TCP/Redis]"
  - source: "Compliance Audit Interceptor"
    destination: "Audit & Compliance Logger Sidecar"
    description: "Streams session telemetry [gRPC]"
  - source: "SFU Router"
    destination: "TURN/STUN Relay Server"
    description: "Relays encrypted SRTP media streams [UDP/TCP via TURN]"