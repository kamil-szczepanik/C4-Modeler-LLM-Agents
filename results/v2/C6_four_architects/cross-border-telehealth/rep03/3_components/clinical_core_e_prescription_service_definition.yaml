level: component
scope: "Component diagram for the Clinical Core & E-Prescription Service container"
parentContainer:
  name: "Clinical Core & E-Prescription Service"
elements:
  - type: "component"
    name: "Clinical Record Manager Component"
    technology: "Java / Spring Data JPA"
    description: "Manages clinical records and persistence."
  - type: "component"
    name: "E-Prescription Engine Component"
    technology: "Java / Spring Integration"
    description: "Handles e-prescription processing flows."
  - type: "component"
    name: "Prescription Validation & Signer Component"
    technology: "Java / Bouncy Castle"
    description: "Signs and validates prescription payloads."
  - type: "component"
    name: "Clinical Audit Interceptor Component"
    technology: "Java / AspectJ"
    description: "Interprets and triggers clinical audit events."
  - type: "component"
    name: "Tenant & Region Context Resolver Component"
    technology: "Java / Spring Interceptor"
    description: "Resolves tenant and regional metadata."
  - type: "component"
    name: "Interoperability Mapper Component"
    technology: "Java / MapStruct"
    description: "Performs format conversion for regional interoperability."
  - type: "component"
    name: "Outbox Event Dispatcher Component"
    technology: "Java / Debezium-lite pattern"
    description: "Dispatches transactional outbox records."
  - type: "component"
    name: "Terminology Code Resolver Component"
    technology: "Java / Spring Cache"
    description: "Resolves terminology codes with caching."
  - type: "component"
    name: "Consent Enforcement Validator Component"
    technology: "Java / Spring Security"
    description: "Validates consent enforcement for requests."
relationships:
  - source: "API Gateway / BFF"
    destination: "Tenant & Region Context Resolver Component"
    description: "Passes regional metadata [gRPC Headers]"
  - source: "Tenant & Region Context Resolver Component"
    destination: "Consent Enforcement Validator Component"
    description: "Passes request context [In-memory method]"
  - source: "Consent Enforcement Validator Component"
    destination: "Consent & Identity Management Service"
    description: "Verifies patient consent status [gRPC over mTLS]"
  - source: "Clinical Record Manager Component"
    destination: "Outbox Event Dispatcher Component"
    description: "Writes transactional outbox records [PostgreSQL JDBC]"
  - source: "Outbox Event Dispatcher Component"
    destination: "Notification & Pharmacy Integration Service"
    description: "Publishes domain events [Cloud Pub/Sub]"
  - source: "Clinical Record Manager Component"
    destination: "Clinical Audit Interceptor Component"
    description: "Triggers audit events [Spring Application Events]"
  - source: "Clinical Audit Interceptor Component"
    destination: "Audit & Compliance Logger Sidecar"
    description: "Forwards structured audit logs [Local Unix Domain Sockets / gRPC]"
  - source: "E-Prescription Engine Component"
    destination: "Interoperability Mapper Component"
    description: "Requests format conversion [In-memory method]"
  - source: "Interoperability Mapper Component"
    destination: "Prescription Validation & Signer Component"
    description: "Signs payload [In-memory Java method]"
  - source: "Prescription Validation & Signer Component"
    destination: "External Pharmacy Gateways"
    description: "Submits signed prescriptions [HTTPS / mTLS]"