level: component
scope: "Component diagram for the Consent & Identity Management Service container"
parentContainer:
  name: "Consent & Identity Management Service"
elements:
  - type: "component"
    name: "Regional Tenant Router Component"
    technology: "Spring Cloud / Java"
    description: "Routes identity and consent requests based on regional infrastructure and data residency constraints."
  - type: "component"
    name: "Identity & Federation Component"
    technology: "Spring Security / OAuth2"
    description: "Handles user authentication, federation, and session management."
  - type: "component"
    name: "Consent Ledger Component"
    technology: "Spring Data JPA"
    description: "Manages localized database queries and maintains consent ledgers."
  - type: "component"
    name: "OPA Policy Sidecar Component"
    technology: "Rego / Go"
    description: "Delivers low-latency policy evaluation for cross-border access control."
  - type: "component"
    name: "Local Credential Cache Component"
    technology: "Spring Cache / Redis"
    description: "Caches tokens and active consent for degraded network conditions."
  - type: "component"
    name: "Compliance Token Verifier Component"
    technology: "Spring Security JWT"
    description: "Delegates token parsing and validation and passes verified residency metadata."
  - type: "component"
    name: "Emergency Break-Glass Component"
    technology: "Java / Spring Security"
    description: "Handles emergency override events and logs them via audit interceptors."
  - type: "component"
    name: "Consent Revocation Broadcaster Component"
    technology: "Spring Cloud Stream / Cloud Pub/Sub"
    description: "Emits revocation notices and publishes revocation events to data storage."
  - type: "component"
    name: "Audit Interceptor Component"
    technology: "Spring AOP"
    description: "Logs override events for compliance and auditing purposes."
relationships:
  - source: "Identity & Federation Component"
    destination: "Compliance Token Verifier Component"
    description: "Delegates token parsing and validation [In-process Java method call]"
  - source: "Compliance Token Verifier Component"
    destination: "Regional Tenant Router Component"
    description: "Passes verified residency metadata [In-process Java method call]"
  - source: "Regional Tenant Router Component"
    destination: "Consent Ledger Component"
    description: "Forwards localized database queries [PostgreSQL Wire Protocol]"
  - source: "Consent Policy Engine"
    destination: "OPA Policy Sidecar Component"
    description: "Delegates access authorization [Local REST/UDS over mTLS]"
  - source: "Identity & Federation Component"
    destination: "Local Credential Cache Component"
    description: "Manages user sessions [Redis protocol over mTLS]"
  - source: "Consent Ledger Component"
    destination: "Consent Revocation Broadcaster Component"
    description: "Emits revocation notices [Spring ApplicationEvent]"
  - source: "Consent Revocation Broadcaster Component"
    destination: "Data Storage"
    description: "Publishes revocation events [Pub/Sub over mTLS]"
  - source: "Emergency Break-Glass Component"
    destination: "Audit Interceptor Component"
    description: "Logs override events [Spring ApplicationEvent]"