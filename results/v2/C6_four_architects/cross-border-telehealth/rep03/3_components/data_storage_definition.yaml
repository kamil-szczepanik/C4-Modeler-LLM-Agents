level: component
scope: "Component diagram for the Data Storage container"
parentContainer:
  name: "Data Storage"
elements:
  - type: "component"
    name: "Relational Data Store"
    technology: "Cloud SQL PostgreSQL"
    description: "Stores structured clinical records, prescription workflows, identity, and consent data."
  - type: "component"
    name: "Object Store"
    technology: "Cloud Storage"
    description: "Stores unstructured medical assets and binary transfers using signed URLs."
  - type: "component"
    name: "Event Bus"
    technology: "Cloud Pub/Sub"
    description: "Handles asynchronous event-driven integration and messaging."
  - type: "component"
    name: "Audit & Traceability Store"
    technology: "Append-Only PostgreSQL"
    description: "Logs tamper-evident audit trails, inputs, and model versions."
relationships:
  - source: "Clinical Core & E-Prescription Service"
    destination: "Relational Data Store"
    description: "Reads and writes structured data via PostgreSQL Wire Protocol (TLS 1.3) using CMEK."
  - source: "AI Symptom Checker Service"
    destination: "Relational Data Store"
    description: "Reads clinical context and writes session states via PostgreSQL Wire Protocol (TLS 1.3)."
  - source: "AI Symptom Checker Service"
    destination: "Audit & Traceability Store"
    description: "Logs inputs and model versions via PostgreSQL Wire Protocol (TLS 1.3)."
  - source: "Consent & Identity Management Service"
    destination: "Relational Data Store"
    description: "Stores identity and consent data via PostgreSQL Wire Protocol (TLS 1.3)."
  - source: "Notification & Pharmacy Integration Service"
    destination: "Event Bus"
    description: "Publishes and consumes events via Cloud Pub/Sub (gRPC/HTTPS)."