level: component
scope: "Component diagram for the Audit & Compliance Logger Sidecar container"
parentContainer:
  name: "Audit & Compliance Logger Sidecar"
elements:
  - type: "component"
    name: "Log Ingestion Receiver"
    technology: "Fluentbit Core"
    description: "Captures logs securely from app containers via Unix Domain Sockets."
  - type: "component"
    name: "Compliance Sanitizer & Masker"
    technology: "Go Custom Plugin / Filter"
    description: "Sanitizes and masks compliance logs to ensure regulatory adherence."
  - type: "component"
    name: "Regional Dispatcher"
    technology: "Fluentbit Output Plugin"
    description: "Routes compliance logs while enforcing regional data residency."
  - type: "component"
    name: "Traceability Indexer"
    technology: "Go Sidecar Agent"
    description: "Handles AI traceability and indexing."
  - type: "component"
    name: "Buffer & Resiliency Manager"
    technology: "Fluentbit Mem/Filesystem Buffer"
    description: "Manages filesystem I/O chunk storage for resiliency and zero log loss."
relationships:
  - source: "Log Ingestion Receiver"
    destination: "Compliance Sanitizer & Masker"
    description: "Passes raw logs via Go-routine channels"
  - source: "Compliance Sanitizer & Masker"
    destination: "Traceability Indexer"
    description: "Sends sanitized data via Go function calls"
  - source: "Traceability Indexer"
    destination: "Buffer & Resiliency Manager"
    description: "Writes data to filesystem via Fluentbit Chunk Storage"
  - source: "Buffer & Resiliency Manager"
    destination: "Regional Dispatcher"
    description: "Dispatches buffered logs via Mutual TLS"