level: component
scope: "Component diagram for the TURN/STUN Relay Server container"
parentContainer:
  name: "TURN/STUN Relay Server"
elements:
  - type: "component"
    name: "STUN/TURN Allocation Manager"
    technology: "C++"
    description: "Manages STUN/TURN allocations and validates HMAC time-limited tokens asynchronously."
  - type: "component"
    name: "Media Relay Engine"
    technology: "C++"
    description: "Relays adaptive bitrate media streams to external WebRTC clients."
  - type: "component"
    name: "Region-Bound Access Controller"
    technology: "Lua"
    description: "Enforces strict geo-routing for regional data residency."
  - type: "component"
    name: "Bandwidth Throttling & Adaptation Module"
    technology: "C++"
    description: "Handles bandwidth throttling and adaptation for resilient connectivity."
  - type: "component"
    name: "Load-Balanced Listener & Port Router"
    technology: "C++"
    description: "Routes incoming requests and handles STUN/TURN traffic over UDP/TCP/TLS 443/53."
  - type: "component"
    name: "Metrics Exporter Sidecar"
    technology: "Go"
    description: "Exports relay session telemetry for compliance auditing."
  - type: "component"
    name: "Audit & Compliance Logger Sidecar"
    technology: "Fluentbit / Go"
    description: "Logs audit and compliance data for GDPR and HIPAA adherence."
relationships:
  - source: "STUN/TURN Allocation Manager"
    destination: "Consent & Identity Management Service"
    description: "Validates HMAC time-limited tokens asynchronously [REST/HTTPS]"
  - source: "Media Relay Engine"
    destination: "External WebRTC Clients"
    description: "Relays adaptive bitrate media streams [SRTP over UDP/TCP]"
  - source: "Metrics Exporter Sidecar"
    destination: "Audit & Compliance Logger Sidecar"
    description: "Exports relay session telemetry [Prometheus/HTTP]"