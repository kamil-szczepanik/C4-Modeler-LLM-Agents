level: component
scope: "Component diagram for the Notification & Pharmacy Integration Service container"
parentContainer:
  name: "Notification & Pharmacy Integration Service"
elements:
  - type: "component"
    name: "Regional Integration Router Component"
    technology: "Go"
    description: "Routes regional integration requests and dispatches tasks to adapters and dispatchers."
  - type: "component"
    name: "EU/US Pharmacy Adapter Components"
    technology: "Go"
    description: "Adapters for EU and US pharmacy integrations handling e-prescriptions."
  - type: "component"
    name: "Notification Dispatcher Component"
    technology: "Go"
    description: "Dispatches notifications and alerts to external providers."
  - type: "component"
    name: "Outbox & Delivery Tracker Component"
    technology: "Go"
    description: "Manages the transactional outbox pattern and tracks delivery states."
  - type: "component"
    name: "Cloud Pub/Sub"
    technology: "Google Cloud Pub/Sub"
    description: "Regional messaging for reliable asynchronous event streaming."
  - type: "component"
    name: "Cloud SQL PostgreSQL"
    technology: "PostgreSQL"
    description: "Regional persistence for transactional outbox and delivery tracking."
  - type: "component"
    name: "External Pharmacy Gateways"
    technology: "HTTPS/REST (TLS 1.3)"
    description: "External gateways for EU/US pharmacies."
  - type: "component"
    name: "External Notification Providers"
    technology: "Twilio, Firebase, HTTPS/REST (TLS 1.3)"
    description: "External providers for sending alerts."
  - type: "component"
    name: "Audit & Compliance Logger Sidecar"
    technology: "Fluentbit / Go"
    description: "Emits audit logs via Unix Domain Sockets for compliance."
relationships:
  - source: "Cloud Pub/Sub"
    destination: "Regional Integration Router Component"
    description: "Delivers async events [Pub/Sub Pull/Push]"
  - source: "Regional Integration Router Component"
    destination: "EU/US Pharmacy Adapter Components"
    description: "Dispatches tasks [In-Process Go Channels]"
  - source: "Regional Integration Router Component"
    destination: "Notification Dispatcher Component"
    description: "Dispatches tasks [In-Process Go Channels]"
  - source: "EU/US Pharmacy Adapter Components"
    destination: "External Pharmacy Gateways"
    description: "Sends e-prescription data [HTTPS/REST (TLS 1.3)]"
  - source: "Notification Dispatcher Component"
    destination: "External Notification Providers"
    description: "Sends alerts [HTTPS/REST (TLS 1.3)]"
  - source: "Outbox & Delivery Tracker Component"
    destination: "Cloud SQL PostgreSQL"
    description: "Persists delivery state [pgx / SQL over TLS 1.3]"
  - source: "Outbox & Delivery Tracker Component"
    destination: "Audit & Compliance Logger Sidecar"
    description: "Emits audit logs [Unix Domain Sockets]"