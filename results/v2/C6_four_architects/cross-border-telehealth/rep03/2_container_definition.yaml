level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients and Clinicians"
    description: "Users located in the EU and US interacting with the telehealth platform for consultations and health checks."
  - type: "externalSystem"
    name: "External Pharmacy Gateways"
    description: "External systems for processing e-prescriptions."
  - type: "externalSystem"
    name: "Identity Providers"
    description: "External identity providers handling authentication via OIDC/OAuth2."
  - type: "externalSystem"
    name: "Stripe Payment Gateways"
    description: "External payment processors handling financial transactions."
  - type: "container"
    name: "API Gateway / BFF"
    technology: "Go / Envoy"
    description: "Provides API gateway and backend-for-frontend services."
  - type: "container"
    name: "Video Consultation Service"
    technology: "Node.js / WebRTC SFU / Mediasoup"
    description: "Handles video consultations and real-time communication."
  - type: "container"
    name: "TURN/STUN Relay Server"
    technology: "Coturn"
    description: "Relays media traffic for WebRTC under restricted network conditions."
  - type: "container"
    name: "Clinical Core & E-Prescription Service"
    technology: "Java / Spring Boot"
    description: "Manages clinical core business logic and e-prescriptions."
  - type: "container"
    name: "AI Symptom Checker Service"
    technology: "Python / FastAPI"
    description: "Provides AI-powered symptom checking for patients."
  - type: "container"
    name: "Consent & Identity Management Service"
    technology: "Java / Spring Security"
    description: "Manages user consent, authentication, and identity security."
  - type: "container"
    name: "Notification & Pharmacy Integration Service"
    technology: "Go"
    description: "Sends notifications and integrates with external pharmacies."
  - type: "container"
    name: "Audit & Compliance Logger Sidecar"
    technology: "Fluentbit / Go"
    description: "Logs audit trails and enforces compliance sidecar duties."
  - type: "container"
    name: "Data Storage"
    technology: "Cloud SQL PostgreSQL, Cloud Storage, Cloud Pub/Sub"
    description: "Provides persistent regional data storage, object storage, and messaging."
relationships:
  - source: "Patients and Clinicians"
    destination: "API Gateway / BFF"
    description: "Sends API requests and connects via client apps"
    technology: "HTTPS / WSS (JSON/gRPC)"
  - source: "API Gateway / BFF"
    destination: "Video Consultation Service"
    description: "Routes consultation requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway / BFF"
    destination: "Clinical Core & E-Prescription Service"
    description: "Routes clinical requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway / BFF"
    destination: "AI Symptom Checker Service"
    description: "Routes AI symptom check requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway / BFF"
    destination: "Consent & Identity Management Service"
    description: "Routes identity and consent requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway / BFF"
    destination: "Notification & Pharmacy Integration Service"
    description: "Routes notification and pharmacy requests"
    technology: "gRPC over mTLS"
  - source: "Video Consultation Service"
    destination: "TURN/STUN Relay Server"
    description: "Relays media streams"
    technology: "UDP/TCP (WebRTC)"
  - source: "Notification & Pharmacy Integration Service"
    destination: "External Pharmacy Gateways"
    description: "Sends e-prescription data"
    technology: "HTTPS/REST (TLS 1.3)"
  - source: "Consent & Identity Management Service"
    destination: "Identity Providers"
    description: "Authenticates users"
    technology: "OIDC/OAuth2"
  - source: "API Gateway / BFF"
    destination: "Stripe Payment Gateways"
    description: "Processes payments"
    technology: "HTTPS/REST"
  - source: "Clinical Core & E-Prescription Service"
    destination: "Data Storage"
    description: "Reads and writes clinical data"
    technology: "PostgreSQL Wire Protocol / HTTPS with CMEK"
  - source: "Consent & Identity Management Service"
    destination: "Data Storage"
    description: "Stores identity and consent data"
    technology: "PostgreSQL Wire Protocol / HTTPS with CMEK"
  - source: "Notification & Pharmacy Integration Service"
    destination: "Data Storage"
    description: "Publishes and consumes events"
    technology: "Cloud Pub/Sub"