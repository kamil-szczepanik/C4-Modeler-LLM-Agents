level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and the US while ensuring strict regional data residency, regulatory compliance, and low-bandwidth availability."
elements:
  - type: "person"
    name: "Patients and Clinicians"
    description: "Primary users who conduct video consultations, use the AI symptom checker, and manage e-prescriptions."
  - type: "person"
    name: "Regulatory and Compliance Auditors"
    description: "External users who audit platform compliance with regional data residency and healthcare regulations."
  - type: "externalSystem"
    name: "External Pharmacy Networks"
    description: "External systems for processing regional e-prescriptions using HL7 FHIR and REST APIs."
  - type: "externalSystem"
    name: "National Identity Providers"
    description: "External systems providing authentication and identity verification via OIDC/SAML."
  - type: "externalSystem"
    name: "Payment and Insurance Providers"
    description: "External systems handling payment transactions and insurance claims via HTTPS."
relationships:
  - source: "Patients and Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS and WebRTC"
  - source: "Regulatory and Compliance Auditors"
    destination: "Cross-Border Telehealth Platform"
    description: "Audits platform logs and compliance data"
    technology: "Cloud Logging and Regional Datastores"
  - source: "Cross-Border Telehealth Platform"
    destination: "External Pharmacy Networks"
    description: "Sends and receives e-prescriptions and health records"
    technology: "REST and HL7 FHIR APIs"
  - source: "Cross-Border Telehealth Platform"
    destination: "National Identity Providers"
    description: "Authenticates users"
    technology: "OIDC/SAML"
  - source: "Cross-Border Telehealth Platform"
    destination: "Payment and Insurance Providers"
    description: "Processes payments and insurance claims"
    technology: "HTTPS"