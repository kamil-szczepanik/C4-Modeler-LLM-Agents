level: component
scope: "Component diagram for the Google Cloud API Gateway with OPA container"
parentContainer:
  name: "Google Cloud API Gateway with OPA"
elements:
  - type: "component"
    name: "API Router"
    technology: "Google Cloud API Gateway"
    description: "Routes incoming requests to backend services and coordinates with rate limiting and context extraction."
  - type: "component"
    name: "Context Extractor"
    technology: "Google Cloud API Gateway"
    description: "Extracts raw requests and passes claims to the authorization engine."
  - type: "component"
    name: "Rate Limiting Component"
    technology: "Google Cloud API Gateway / Memorystore Redis"
    description: "Checks quotas and throttles traffic."
  - type: "component"
    name: "Authorization Engine (OPA)"
    technology: "Open Policy Agent"
    description: "Enforces dynamic purpose-based patient consent via Rego policies."
  - type: "component"
    name: "Audit Logger"
    technology: "Fluentbit sidecar"
    description: "Emits and forwards structured decision logs."
relationships:
  - source: "API Router"
    destination: "Rate Limiting Component"
    description: "Checks quotas [gRPC / Memorystore Redis]"
  - source: "API Router"
    destination: "Context Extractor"
    description: "Passes raw requests [In-memory]"
  - source: "Context Extractor"
    destination: "Authorization Engine (OPA)"
    description: "Forwards claims [gRPC]"
  - source: "Authorization Engine (OPA)"
    destination: "Audit Logger"
    description: "Emits decision logs [Async IPC / Fluentd]"