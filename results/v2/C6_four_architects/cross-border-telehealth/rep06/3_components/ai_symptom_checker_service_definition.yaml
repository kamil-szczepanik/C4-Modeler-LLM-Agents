level: component
scope: "Component diagram for the AI Symptom Checker Service container"
parentContainer:
  name: "AI Symptom Checker Service"
elements:
  - type: "component"
    name: "API Router / Endpoint Controller"
    technology: "FastAPI"
    description: "FastAPI-based controller validating incoming gRPC requests."
  - type: "component"
    name: "Consent & Policy Enforcement Interceptor"
    technology: "FastAPI Middleware"
    description: "FastAPI Middleware verifying active patient consent per data-sharing purpose."
  - type: "component"
    name: "Regional Context & Guardrails Engine"
    technology: "Python"
    description: "Enforces clinical triage guidelines and strips PHI prior to inference."
  - type: "component"
    name: "Inference Orchestrator"
    technology: "Python"
    description: "Manages prompt engineering, context windows, and model execution."
  - type: "component"
    name: "ML Model Runtime"
    technology: "ONNX Runtime / gRPC-local"
    description: "Runs local quantized LLM/classification models via ONNX Runtime / gRPC-local."
  - type: "component"
    name: "Clinical Triage Validator"
    technology: "Python"
    description: "Post-processes urgency scores against deterministic safety thresholds."
  - type: "component"
    name: "Audit & Traceability Logger"
    technology: "Python"
    description: "Captures inputs, model versions, and outputs for EU MDR traceability."
relationships:
  - source: "API Router / Endpoint Controller"
    destination: "Consent & Policy Enforcement Interceptor"
    description: "In-process FastAPI Middleware"
  - source: "Consent & Policy Enforcement Interceptor"
    destination: "Regional Context & Guardrails Engine"
    description: "In-process"
  - source: "Regional Context & Guardrails Engine"
    destination: "Inference Orchestrator"
    description: "In-process"
  - source: "Inference Orchestrator"
    destination: "ML Model Runtime"
    description: "In-process via ONNX Runtime / gRPC-local"
  - source: "Inference Orchestrator"
    destination: "Clinical Triage Validator"
    description: "In-process"
  - source: "Clinical Triage Validator"
    destination: "API Router / Endpoint Controller"
    description: "In-process"
  - source: "Audit & Traceability Logger"
    destination: "Google Cloud Pub/Sub"
    description: "gRPC"
  - source: "Audit & Traceability Logger"
    destination: "Google Cloud BigQuery / Cloud Storage"
    description: "REST/gRPC via Pub/Sub"