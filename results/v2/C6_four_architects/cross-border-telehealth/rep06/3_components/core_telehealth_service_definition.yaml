level: component
scope: "Component diagram for the Core Telehealth Service container"
parentContainer:
  name: "Core Telehealth Service"
elements:
  - type: "component"
    name: "Consultation Manager"
    technology: "Go"
    description: "Orchestrates video session lifecycles."
  - type: "component"
    name: "Prescription Engine"
    technology: "Go"
    description: "Manages regional e-prescription routing."
  - type: "component"
    name: "Consent & Policy Enforcement Engine"
    technology: "Go"
    description: "Enforces region-specific data residency and explicit patient consents."
  - type: "component"
    name: "Audit Logger"
    technology: "Go"
    description: "Emits structured audit trails."
  - type: "component"
    name: "Symptom Checker Orchestrator"
    technology: "Go"
    description: "Coordinates AI triage assessments and model versioning."
  - type: "component"
    name: "Degraded Mode Handler"
    technology: "Go"
    description: "Adapts network quality for low-bandwidth connections."
relationships:
  - source: "Consent & Policy Enforcement Engine"
    destination: "Datastores"
    description: "Executes region-isolated queries [PostgreSQL and Redis protocols]."
  - source: "Consultation Manager"
    destination: "Video Streaming Service"
    description: "Controls media sessions [gRPC]."
  - source: "Symptom Checker Orchestrator"
    destination: "AI Symptom Checker Service"
    description: "Triggers triage analysis [gRPC]."
  - source: "Prescription Engine"
    destination: "Integration Service"
    description: "Dispatches regional e-prescription payloads [gRPC]."
  - source: "Consultation Manager"
    destination: "Audit Logger"
    description: "Dispatches immutable tracing payloads [Buffered Go Channels]."
  - source: "Prescription Engine"
    destination: "Audit Logger"
    description: "Dispatches immutable tracing payloads [Buffered Go Channels]."
  - source: "Consent & Policy Enforcement Engine"
    destination: "Audit Logger"
    description: "Dispatches immutable tracing payloads [Buffered Go Channels]."
  - source: "Symptom Checker Orchestrator"
    destination: "Audit Logger"
    description: "Dispatches immutable tracing payloads [Buffered Go Channels]."
  - source: "Degraded Mode Handler"
    destination: "Audit Logger"
    description: "Dispatches immutable tracing payloads [Buffered Go Channels]."