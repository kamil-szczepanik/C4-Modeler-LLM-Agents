level: component
scope: "Component diagram for the Video Streaming Service container"
parentContainer:
  name: "Video Streaming Service"
elements:
  - type: "component"
    name: "Signaling Server"
    technology: "Node.js / WebSockets"
    description: "Handles session control and WebSockets signaling for clients."
  - type: "component"
    name: "SFU Router Core"
    technology: "mediasoup / C++ / Node.js"
    description: "Minimizes CPU and bandwidth overhead for video routing and media streaming."
  - type: "component"
    name: "Adaptive Bitrate & Quality Manager"
    technology: "Go"
    description: "Adjusts simulcast layers and guarantees degraded-mode operation below 300 kbit/s."
  - type: "component"
    name: "TURN/STUN Relay Manager"
    technology: "Coturn on GCP Compute Engine"
    description: "Handles NAT traversal for unstable rural connections."
  - type: "component"
    name: "Media Session Audit Logger"
    technology: "Go"
    description: "Emits session telemetry."
  - type: "component"
    name: "Geo-Distributed TURN Coordinator"
    technology: "Go"
    description: "Provisions relay endpoints while ensuring regional data residency."
relationships:
  - source: "Web & Mobile Apps"
    destination: "Signaling Server"
    description: "Session control [WSS]"
  - source: "Web & Mobile Apps"
    destination: "SFU Router Core"
    description: "Media streaming [WebRTC/UDP/DTLS]"
  - source: "Adaptive Bitrate & Quality Manager"
    destination: "SFU Router Core"
    description: "Adjusts simulcast layers [Internal IPC]"
  - source: "SFU Router Core"
    destination: "Media Session Audit Logger"
    description: "Emits session telemetry [gRPC]"
  - source: "Web & Mobile Apps"
    destination: "Geo-Distributed TURN Coordinator"
    description: "Relay allocation [HTTPS]"
  - source: "Geo-Distributed TURN Coordinator"
    destination: "TURN/STUN Relay Manager"
    description: "Provisions endpoints [gRPC]"