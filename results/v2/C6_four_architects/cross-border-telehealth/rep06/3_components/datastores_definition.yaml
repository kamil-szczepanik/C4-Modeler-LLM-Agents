level: component
scope: "Component diagram for the Datastores container"
parentContainer:
  name: "Datastores"
elements:
  - type: "component"
    name: "Regional Transactional DB"
    technology: "Cloud SQL PostgreSQL"
    description: "Relational transactional database for core telehealth data and user management."
  - type: "component"
    name: "Caching Layer"
    technology: "Memorystore Redis"
    description: "In-memory cache for low-latency session management and temporary state."
  - type: "component"
    name: "Audit & Analytics Store"
    technology: "Google Cloud BigQuery"
    description: "Immutable storage for AI traceability logging and compliance reporting."
  - type: "component"
    name: "Document Store / FHIR Repository"
    technology: "Google Cloud Storage"
    description: "Repository for FHIR resources and e-prescriptions."
  - type: "component"
    name: "Encryption Key Management Component"
    technology: "Google Cloud KMS"
    description: "Manages customer-managed encryption keys for strict cryptographic data-at-rest isolation."
  - type: "component"
    name: "CDC & Event Ingestion Pipeline"
    technology: "Google Cloud Pub/Sub & Dataflow"
    description: "Asynchronous event ingestion pipeline for zero-loss telemetry logging and change data capture."
  - type: "component"
    name: "Data Masking & Tokenization Component"
    technology: "Internal Service / Custom Library"
    description: "Sanitizes PHI and PII data."
  - type: "component"
    name: "Database Connection Pooling"
    technology: "PgBouncer"
    description: "Manages database connections for resilience against network flapping."
relationships:
  - source: "Regional Transactional DB"
    destination: "Encryption Key Management Component"
    description: "Data-at-rest encryption [gRPC over TLS with IAM]"
  - source: "Document Store / FHIR Repository"
    destination: "Encryption Key Management Component"
    description: "Data-at-rest encryption [gRPC over TLS with IAM]"
  - source: "Audit & Analytics Store"
    destination: "Encryption Key Management Component"
    description: "Data-at-rest encryption [gRPC over TLS with IAM]"
  - source: "Regional Transactional DB"
    destination: "CDC & Event Ingestion Pipeline"
    description: "Change data capture streams [Google Cloud Pub/Sub native protocol over TLS]"
  - source: "Audit & Analytics Store"
    destination: "Regulatory and Compliance Auditors"
    description: "Compliance reporting [BigQuery SQL via IAM-secured HTTPS]"