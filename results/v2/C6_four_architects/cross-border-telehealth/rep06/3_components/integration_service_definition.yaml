level: component
scope: "Component diagram for the Integration Service container"
parentContainer:
  name: "Integration Service"
elements:
  - type: "component"
    name: "FHIR Adapter Component"
    technology: "TypeScript / HAPI FHIR or custom mapper"
    description: "Bridges internal domain models with external pharmacy networks."
  - type: "component"
    name: "EU E-Prescription Gateway Component"
    technology: "TypeScript"
    description: "Manages EU e-prescription routing and gateway operations."
  - type: "component"
    name: "Data Residency Enforcer Component"
    technology: "Region-isolated instances in europe-west3 and us-central1"
    description: "Strictly enforces regional data residency for EU and US traffic."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Google Cloud BigQuery API"
    description: "Records audit logs asynchronously."
  - type: "component"
    name: "Retry & Dead-Letter Queue Component"
    technology: "BullMQ / Redis"
    description: "Offloads and retries failed outbound requests."
  - type: "component"
    name: "Transformation Engine Component"
    technology: "JSONata / Handlebars"
    description: "Applies schema mappings for complex national e-prescription schemas."
  - type: "component"
    name: "Circuit Breaker & Rate Limiter Component"
    technology: "Opossum"
    description: "Evaluates health and dispatches outbound requests with rate limiting."
relationships:
  - source: "Integration Service"
    destination: "External Pharmacy Networks"
    description: "Transmits payloads [HTTPS/REST, mTLS]"
  - source: "EU E-Prescription Gateway Component"
    destination: "Transformation Engine Component"
    description: "Applies schema mappings [In-memory]"
  - source: "FHIR Adapter Component"
    destination: "Transformation Engine Component"
    description: "Applies schema mappings [In-memory]"
  - source: "FHIR Adapter Component"
    destination: "Retry & Dead-Letter Queue Component"
    description: "Offloads failed outbound requests [Redis protocol]"
  - source: "EU E-Prescription Gateway Component"
    destination: "Retry & Dead-Letter Queue Component"
    description: "Offloads failed outbound requests [Redis protocol]"
  - source: "FHIR Adapter Component"
    destination: "Circuit Breaker & Rate Limiter Component"
    description: "Evaluates health and dispatches outbound requests [In-memory]"
  - source: "EU E-Prescription Gateway Component"
    destination: "Circuit Breaker & Rate Limiter Component"
    description: "Evaluates health and dispatches outbound requests [In-memory]"
  - source: "Circuit Breaker & Rate Limiter Component"
    destination: "External Pharmacy Networks"
    description: "Sends payloads [HTTPS/REST, mTLS]"
  - source: "Integration Service"
    destination: "Google Cloud BigQuery"
    description: "Records audit logs asynchronously [BigQuery API]"