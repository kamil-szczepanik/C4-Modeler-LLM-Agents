level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients and Clinicians"
    description: "Primary users who conduct video consultations, use the AI symptom checker, and manage e-prescriptions."
  - type: "externalSystem"
    name: "External Pharmacy Networks"
    description: "External systems for processing regional e-prescriptions using HL7 FHIR and national standards."
  - type: "externalSystem"
    name: "National Identity Providers"
    description: "External systems providing authentication and identity verification via OIDC/SAML."
  - type: "externalSystem"
    name: "Payment and Insurance Providers"
    description: "External systems handling payment transactions and insurance claims via HTTPS."
  - type: "container"
    name: "Web & Mobile Apps"
    technology: "React / React Native"
    description: "Provides the user interface for patients and clinicians across web and mobile devices."
  - type: "container"
    name: "Google Cloud API Gateway with OPA"
    technology: "Google Cloud API Gateway, Open Policy Agent (OPA)"
    description: "Handles API routing, security enforcement, and dynamic, purpose-based patient consent policies."
  - type: "container"
    name: "Core Telehealth Service"
    technology: "Go"
    description: "Powers the core business logic execution for telehealth operations."
  - type: "container"
    name: "AI Symptom Checker Service"
    technology: "Python / FastAPI"
    description: "Runs inference for the AI symptom checker service."
  - type: "container"
    name: "Video Streaming Service"
    technology: "mediasoup SFU on GCP Compute Engine, TURN/STUN relay"
    description: "Handles video streaming and rural low-bandwidth connections."
  - type: "container"
    name: "Integration Service"
    technology: "Node.js"
    description: "Integrates with external pharmacy networks via national standards and HL7 FHIR."
  - type: "container"
    name: "Datastores"
    technology: "Cloud SQL PostgreSQL, Memorystore Redis, Google Cloud BigQuery / Cloud Storage"
    description: "Provides region-isolated transactional, cache, and immutable audit log storage."
relationships:
  - source: "Patients and Clinicians"
    destination: "Web & Mobile Apps"
    description: "Interacts with the platform"
    technology: "HTTPS, WSS, and WebRTC/UDP"
  - source: "Web & Mobile Apps"
    destination: "Google Cloud API Gateway with OPA"
    description: "Sends API requests and establishes media connections"
    technology: "HTTPS, WSS, and WebRTC/UDP"
  - source: "Web & Mobile Apps"
    destination: "Video Streaming Service"
    description: "Streams video consultations"
    technology: "WebRTC/UDP"
  - source: "Google Cloud API Gateway with OPA"
    destination: "Core Telehealth Service"
    description: "Routes internal API requests"
    technology: "gRPC"
  - source: "Google Cloud API Gateway with OPA"
    destination: "AI Symptom Checker Service"
    description: "Routes AI symptom check requests"
    technology: "gRPC"
  - source: "Core Telehealth Service"
    destination: "Datastores"
    description: "Reads and writes transactional data and cache"
    technology: "PostgreSQL and Redis protocols"
  - source: "AI Symptom Checker Service"
    destination: "Datastores"
    description: "Maintains immutable audit logs for AI traceability"
    technology: "Google Cloud Pub/Sub and BigQuery / Cloud Storage"
  - source: "Integration Service"
    destination: "External Pharmacy Networks"
    description: "Sends and receives e-prescriptions"
    technology: "National standards and HL7 FHIR"
  - source: "Google Cloud API Gateway with OPA"
    destination: "Google Cloud API Gateway with OPA"
    description: "Cross-region access between gateways"
    technology: "Federated mTLS over HTTPS"