level: context
scope: "System Context diagram for New Insurance Claims Platform"
system:
  name: "New Insurance Claims Platform"
  description: "A hybrid cloud insurance claims platform that progressively replaces a 30-year-old COBOL/DB2 mainframe, modernizing customer submissions and adjuster workflows while maintaining legacy data consistency."
elements:
  - type: "person"
    name: "Customers"
    description: "End users submitting insurance claims."
  - type: "person"
    name: "Brokers"
    description: "Intermediaries assisting with insurance claims and submissions."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff reviewing and processing insurance claims."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise COBOL/DB2 System of Record."
  - type: "externalSystem"
    name: "Identity Provider / Active Directory"
    description: "On-premise SSO provider for authentication."
  - type: "externalSystem"
    name: "Document Management System"
    description: "On-premise archive for document storage."
  - type: "externalSystem"
    name: "Core Banking / Payout System"
    description: "On-premise ledger for handling financial payouts."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Cloud SaaS for sending notifications."
relationships:
  - source: "Customers"
    destination: "New Insurance Claims Platform"
    description: "Submits claims and interacts with the platform"
    technology: "HTTPS / REST"
  - source: "Brokers"
    destination: "New Insurance Claims Platform"
    description: "Submits claims and manages policies on behalf of customers"
    technology: "HTTPS / REST"
  - source: "Claims Adjusters"
    destination: "New Insurance Claims Platform"
    description: "Manages and processes workflows"
    technology: "HTTPS / Web"
  - source: "New Insurance Claims Platform"
    destination: "Legacy Mainframe"
    description: "Batch synchronization and data consistency"
    technology: "Azure Data Factory / Secure FTP via Azure ExpressRoute"
  - source: "Legacy Mainframe"
    destination: "New Insurance Claims Platform"
    description: "Data synchronization"
    technology: "Azure Data Factory / Secure FTP via Azure ExpressRoute"
  - source: "New Insurance Claims Platform"
    destination: "Identity Provider / Active Directory"
    description: "Authenticates users via SSO"
    technology: "OpenID Connect / OAuth 2.0 over mTLS / HTTPS"
  - source: "New Insurance Claims Platform"
    destination: "Document Management System"
    description: "Stores and retrieves archived documents"
    technology: "HTTPS over Azure ExpressRoute"
  - source: "Document Management System"
    destination: "New Insurance Claims Platform"
    description: "Provides document access"
    technology: "HTTPS over Azure ExpressRoute"
  - source: "New Insurance Claims Platform"
    destination: "Core Banking / Payout System"
    description: "Initiates financial payouts"
    technology: "ISO 20022 / HTTPS over Azure ExpressRoute"
  - source: "New Insurance Claims Platform"
    destination: "Notification Service"
    description: "Triggers notifications to users"
    technology: "HTTPS / REST via TLS 1.3"