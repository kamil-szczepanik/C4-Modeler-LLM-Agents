level: component
scope: "Component diagram for the Frontend container"
parentContainer:
  name: "Frontend"
elements:
  - type: "component"
    name: "Auth Module"
    technology: "MSAL.js"
    description: "Handles user authentication and integration with Azure AD for Single Sign-On (SSO)."
  - type: "component"
    name: "Customer Portal UI"
    technology: "React Single Page Application"
    description: "User interface for customers to interact with the claims system."
  - type: "component"
    name: "Adjuster Workspace UI"
    technology: "React Single Page Application"
    description: "User interface for claims adjusters to manage and process claims."
  - type: "component"
    name: "State Management Store"
    technology: "React Query"
    description: "Caches server state and enables optimistic UI updates to mask legacy latency."
  - type: "component"
    name: "API Client"
    technology: "Axios"
    description: "Sends API requests to the Edge Tier."
  - type: "component"
    name: "Feature Flag & Routing Engine"
    technology: "React"
    description: "Manages routing and feature flags for the application."
  - type: "component"
    name: "Error Boundary & Fallback Handler"
    technology: "React"
    description: "Handles runtime errors and provides fallback UI components."
relationships:
  - source: "Auth Module"
    destination: "Azure Active Directory (Entra ID)"
    description: "Authenticates users [OAuth2 / OIDC]"
  - source: "API Client"
    destination: "Edge Tier"
    description: "Sends API requests and authenticates [HTTPS / OIDC]"
  - source: "Customer Portal UI"
    destination: "State Management Store"
    description: "Reads and writes cached server state"
  - source: "Adjuster Workspace UI"
    destination: "State Management Store"
    description: "Reads and writes cached server state"
  - source: "State Management Store"
    destination: "API Client"
    description: "Fetches data via"