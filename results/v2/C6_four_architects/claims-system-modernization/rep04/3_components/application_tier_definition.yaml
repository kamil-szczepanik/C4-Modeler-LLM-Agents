level: component
scope: "Component diagram for the Application Tier container"
parentContainer:
  name: "Application Tier"
elements:
  - type: "component"
    name: "Claim Submission Component"
    technology: "Java, Spring Boot"
    description: "Handles the submission of new insurance claims."
  - type: "component"
    name: "Adjuster Workspace Component"
    technology: "Java, Spring Boot"
    description: "Provides the interface and logic for claims adjusters."
  - type: "component"
    name: "Anti-Corruption Layer (ACL) & Router Component"
    technology: "Java, Spring Boot"
    description: "Routes unmigrated claim types to the legacy mainframe and translates models."
  - type: "component"
    name: "Outbox Processor Component"
    technology: "Java, Spring Boot"
    description: "Processes transactional outbox messages for reliable event publishing."
  - type: "component"
    name: "Unified Workers"
    technology: "Java, Spring Boot, Azure Container Apps, KEDA"
    description: "Executes event-driven background tasks with autoscaling."
  - type: "component"
    name: "Audit & Compliance Component"
    technology: "Java, Spring Boot, Spring AOP"
    description: "Ensures audit trails and compliance checks across internal components."
relationships:
  - source: "Claim Submission Component"
    destination: "Data Tier"
    description: "Reads and writes data via Spring Data JPA / PostgreSQL Protocol"
  - source: "Adjuster Workspace Component"
    destination: "Data Tier"
    description: "Reads and writes data via Spring Data JPA / PostgreSQL Protocol"
  - source: "Anti-Corruption Layer (ACL) & Router Component"
    destination: "Hybrid Bridge"
    description: "Communicates via gRPC over Azure Relay / TCP"
  - source: "Outbox Processor Component"
    destination: "Integration Tier"
    description: "Publishes messages via AMQP over Azure Service Bus"
  - source: "Unified Workers"
    destination: "Core Banking & Notification Services"
    description: "Invokes services via HTTPS / REST"
  - source: "Claim Submission Component"
    destination: "Audit & Compliance Component"
    description: "Monitored via Spring AOP"
  - source: "Adjuster Workspace Component"
    destination: "Audit & Compliance Component"
    description: "Monitored via Spring AOP"
  - source: "Anti-Corruption Layer (ACL) & Router Component"
    destination: "Audit & Compliance Component"
    description: "Monitored via Spring AOP"
  - source: "Outbox Processor Component"
    destination: "Audit & Compliance Component"
    description: "Monitored via Spring AOP"
  - source: "Unified Workers"
    destination: "Audit & Compliance Component"
    description: "Monitored via Spring AOP"