level: component
scope: "Component diagram for the Integration Tier container"
parentContainer:
  name: "Integration Tier"
elements:
  - type: "component"
    name: "Event Bus Router"
    technology: "Azure Service Bus"
    description: "Asynchronous pub/sub messaging ensuring guaranteed message delivery and zero data loss."
  - type: "component"
    name: "Hybrid Tunnel Gateway"
    technology: "Azure Relay"
    description: "Establishes secure, outbound-only hybrid connectivity respecting corporate firewall constraints."
  - type: "component"
    name: "Dead Letter & Reconciliation Manager"
    technology: "Azure Service Bus DLQ and Azure Functions"
    description: "Captures poisoned messages and automates error reconciliation."
  - type: "component"
    name: "Schema Transformation Router"
    technology: "Azure Functions and API Management"
    description: "Centralized API routing and legacy data formatting to avoid costly mainframe modifications."
relationships:
  - source: "Application Tier"
    destination: "Event Bus Router"
    description: "Publishes domain events [AMQP]"
  - source: "Event Bus Router"
    destination: "Schema Transformation Router"
    description: "Queues messages requiring legacy translation [AMQP]"
  - source: "Schema Transformation Router"
    destination: "Hybrid Tunnel Gateway"
    description: "Forwards transformed payloads [HTTPS/AMQP]"
  - source: "Hybrid Tunnel Gateway"
    destination: "Hybrid Bridge"
    description: "Connects securely to on-premise mainframe [Azure Relay]"
  - source: "Event Bus Router"
    destination: "Dead Letter & Reconciliation Manager"
    description: "Captures poisoned messages [Internal Service Bus API]"
  - source: "Dead Letter & Reconciliation Manager"
    destination: "Application Tier"
    description: "Triggers reconciliation alerts [Webhooks/HTTPS]"