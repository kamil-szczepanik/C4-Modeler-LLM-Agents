level: component
scope: "Component diagram for the Hybrid Bridge container"
parentContainer:
  name: "Hybrid Bridge"
elements:
  - type: "component"
    name: "Sync Router Component"
    technology: "Spring Boot"
    description: "Routes incoming requests and integrates with Azure Service Bus / Azure Relay."
  - type: "component"
    name: "Mainframe Adapter Component"
    technology: "Spring Boot"
    description: "Adapts calls between modern services and legacy mainframe formats."
  - type: "component"
    name: "Transaction Ledger Component"
    technology: "Local H2/PostgreSQL store"
    description: "Maintains a local transactional ledger to ensure idempotency and zero data loss."
  - type: "component"
    name: "Configuration & Feature Toggle Component"
    technology: "Database-backed registry"
    description: "Manages configuration and feature toggles via an in-memory Java API."
  - type: "component"
    name: "Batch Co-ordination Component"
    technology: "Spring Boot"
    description: "Coordinates batch processing respecting rigid nightly batch windows."
  - type: "component"
    name: "Schema & EBCDIC Translation Component"
    technology: "Apache Camel"
    description: "Handles bi-ordinated JSON-to-EBCDIC mapping and schema translation."
  - type: "component"
    name: "Circuit Breaker & Retry Manager Component"
    technology: "Resilience4j"
    description: "Provides fault tolerance, circuit breaker, and retry policies over hybrid networks."
relationships:
  - source: "Sync Router Component"
    destination: "Configuration & Feature Toggle Component"
    description: "Queries feature toggles via In-memory Java API"
  - source: "Batch Co-ordination Component"
    destination: "Transaction Ledger Component"
    description: "Persists batch state using Local JPA/SQL"
  - source: "Mainframe Adapter Component"
    destination: "Schema & EBCDIC Translation Component"
    description: "Translates data via Internal Java Method Calls"
  - source: "Mainframe Adapter Component"
    destination: "Circuit Breaker & Retry Manager Component"
    description: "Decorates calls using Internal Java method decoration"