level: component
scope: "Component diagram for the Edge Tier container"
parentContainer:
  name: "Edge Tier"
elements:
  - type: "component"
    name: "BFF Orchestrator"
    technology: "Node.js / Express"
    description: "Orchestrates API calls, handles business logic aggregation, and communicates via gRPC with internal services."
  - type: "component"
    name: "Edge Security Proxy"
    technology: "Node.js / TypeScript"
    description: "Ensures edge security and communicates securely with the integration tier via HTTPS and mTLS."
  - type: "component"
    name: "Edge Configuration Component"
    technology: "Node.js with Redis Cache"
    description: "Provides sub-millisecond dynamic claim-type routing lookups and supports instant fallbacks."
relationships:
  - source: "BFF Orchestrator"
    destination: "Edge Configuration Component"
    description: "Redis Cache lookup"
  - source: "BFF Orchestrator"
    destination: "Edge Security Proxy"
    description: "gRPC"
  - source: "Edge Security Proxy"
    destination: "Integration Tier (Azure Relay)"
    description: "HTTPS / mTLS"
  - source: "BFF Orchestrator"
    destination: "Application Tier"
    description: "gRPC"