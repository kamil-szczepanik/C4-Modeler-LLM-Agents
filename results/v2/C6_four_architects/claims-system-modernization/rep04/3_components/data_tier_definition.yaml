level: component
scope: "Component diagram for the Data Tier container"
parentContainer:
  name: "Data Tier"
elements:
  - type: "component"
    name: "Transactional Store (OLTP)"
    technology: "Azure Database for PostgreSQL (core_oltp schema)"
    description: "Manages incoming claims and migrated states."
  - type: "component"
    name: "CQRS Read Model Store"
    technology: "Azure Database for PostgreSQL (read_models schema)"
    description: "Optimized denormalized tables for fast UI queries."
  - type: "component"
    name: "Migration Sync State Ledger"
    technology: "Azure Database for PostgreSQL (core_oltp schema)"
    description: "Tracks dual-write/sync status and sequence IDs."
  - type: "component"
    name: "Archival & Purge Worker"
    technology: "PostgreSQL pg_cron and Native Table Partitioning"
    description: "Background service automating historical claim data retention."
relationships:
  - source: "Transactional Store (OLTP)"
    destination: "Archival & Purge Worker"
    description: "Triggers data partitioning and archiving routines [Internal SQL / PostgreSQL pg_cron]"
  - source: "Application Tier"
    destination: "Transactional Store (OLTP)"
    description: "Reads and writes claims data [PostgreSQL Protocol / JDBC]"
  - source: "Application Tier"
    destination: "CQRS Read Model Store"
    description: "Fast queries for UI display [PostgreSQL Protocol / JDBC]"
  - source: "Application Tier"
    destination: "Migration Sync State Ledger"
    description: "Validates claim migration status and prevents double-processing [PostgreSQL Protocol / JDBC]"
  - source: "Integration Tier"
    destination: "Migration Sync State Ledger"
    description: "Asynchronous state synchronization and updates from mainframe batch events [PostgreSQL Protocol / JDBC]"