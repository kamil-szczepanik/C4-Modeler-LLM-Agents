level: container
scope: "Container diagram for New Insurance Claims Platform"
system:
  name: "New Insurance Claims Platform"
elements:
  - type: "person"
    name: "Customers"
    description: "End users submitting insurance claims."
  - type: "person"
    name: "Brokers"
    description: "Intermediaries assisting with insurance claims and submissions."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff reviewing and processing insurance claims."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise COBOL/DB2 System of Record."
  - type: "externalSystem"
    name: "Azure Active Directory / Entra ID"
    description: "Cloud identity provider for authentication and SSO."
  - type: "externalSystem"
    name: "Document Management System"
    description: "On-premise archive for document storage."
  - type: "externalSystem"
    name: "Core Banking / Payout System"
    description: "On-premise ledger for handling financial payouts."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Cloud SaaS for sending notifications."
  - type: "container"
    name: "Frontend"
    technology: "React, Azure Static Web Apps"
    description: "Modern user interface hosted for customers, brokers, and adjusters."
  - type: "container"
    name: "Edge Tier"
    technology: "Azure API Management, Node.js/TypeScript"
    description: "Request orchestration, BFF pattern, and security."
  - type: "container"
    name: "Application Tier"
    technology: "Java/Spring Boot, Python/C# Azure Functions, Azure Container Apps"
    description: "Modern Claims Service, Routing Service / ACL, and document/notification workers."
  - type: "container"
    name: "Data Tier"
    technology: "Azure Database for PostgreSQL"
    description: "Transactional storage and CQRS read models."
  - type: "container"
    name: "Integration Tier"
    technology: "Azure Service Bus, Azure Relay"
    description: "Asynchronous messaging and hybrid connectivity."
  - type: "container"
    name: "Hybrid Bridge"
    technology: "Spring Boot Mainframe Adapter, IBM DB2/COBOL Mainframe"
    description: "On-premise bridge connecting Azure to the legacy mainframe system of record."
relationships:
  - source: "Customers"
    destination: "Frontend"
    description: "Uses the system via browser"
    technology: "HTTPS"
  - source: "Brokers"
    destination: "Frontend"
    description: "Uses the system via browser"
    technology: "HTTPS"
  - source: "Claims Adjusters"
    destination: "Frontend"
    description: "Uses the system via browser"
    technology: "HTTPS"
  - source: "Frontend"
    destination: "Edge Tier"
    description: "Sends API requests and authenticates"
    technology: "HTTPS / OIDC (Entra ID for SSO)"
  - source: "Edge Tier"
    destination: "Application Tier"
    description: "Routes requests to backend services"
    technology: "gRPC and HTTPS/REST"
  - source: "Application Tier"
    destination: "Data Tier"
    description: "Reads and writes transactional data and CQRS models"
    technology: "PostgreSQL Protocol"
  - source: "Application Tier"
    destination: "Integration Tier"
    description: "Publishes and consumes asynchronous messages"
    technology: "AMQP via Azure Service Bus"
  - source: "Integration Tier"
    destination: "Hybrid Bridge"
    description: "Bridges cloud messaging to on-premise adapter"
    technology: "Azure Relay / VPN Gateway"
  - source: "Hybrid Bridge"
    destination: "Legacy Mainframe"
    description: "Executes queries and interacts with legacy system"
    technology: "IBM MQ and DB2 queries"
  - source: "Frontend"
    destination: "Azure Active Directory / Entra ID"
    description: "Authenticates users"
    technology: "OAuth2 / OIDC"
  - source: "Application Tier"
    destination: "Document Management System"
    description: "Archives and retrieves documents"
    technology: "HTTPS"
  - source: "Application Tier"
    destination: "Core Banking / Payout System"
    description: "Initiates payouts"
    technology: "HTTPS"
  - source: "Application Tier"
    destination: "Notification Service"
    description: "Triggers user notifications"
    technology: "HTTPS / REST"