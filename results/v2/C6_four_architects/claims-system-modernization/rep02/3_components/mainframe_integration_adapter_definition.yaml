level: component
scope: "Component diagram for the Mainframe Integration Adapter container"
parentContainer:
  name: "Mainframe Integration Adapter"
elements:
  - type: "component"
    name: "MQ Message Listener Component"
    technology: "Spring JMS"
    description: "Consumes and manages IBM MQ messages on-premises reliably."
  - type: "component"
    name: "Data Transformation Component"
    technology: "Apache Camel"
    description: "Translates legacy EBCDIC fixed-length records into JSON domain events."
  - type: "component"
    name: "Schema Validation Sub-component"
    technology: "JSON Schema Validator"
    description: "Intercepts malformed records before cloud transmission."
  - type: "component"
    name: "Outbound Dispatcher Component"
    technology: "Azure Service Bus SDK"
    description: "Securely routes transformed events to the cloud via AMQP 1.0."
  - type: "component"
    name: "Adapter Health & Audit Monitor Component"
    technology: "Micrometer / OpenTelemetry"
    description: "Emits health telemetry and audit metrics locally."
  - type: "component"
    name: "Retry & Dead-Letter Manager Component"
    technology: "Spring Retry / IBM MQ DLQ handler"
    description: "Handles re-queue or poison-message routing."
  - type: "component"
    name: "Legacy Mainframe"
    technology: "COBOL/DB2 Mainframe"
    description: "Dumps batch extracts via IBM MQ binary."
  - type: "component"
    name: "Data Sync Worker"
    technology: "Container"
    description: "Receives stream and sends processing ACKs."
relationships:
  - source: "Legacy Mainframe"
    destination: "MQ Message Listener Component"
    description: "Dumps batch extracts [IBM MQ binary]"
  - source: "Data Transformation Component"
    destination: "Schema Validation Sub-component"
    description: "Validates JSON payload [In-memory]"
  - source: "Schema Validation Sub-component"
    destination: "Outbound Dispatcher Component"
    description: "Valid payload [In-memory]"
  - source: "Outbound Dispatcher Component"
    destination: "Data Sync Worker"
    description: "Sends stream [AMQP 1.0 via Azure ExpressRoute]"
  - source: "Data Sync Worker"
    destination: "Outbound Dispatcher Component"
    description: "Sends processing ACKs [AMQP via Azure Service Bus]"
  - source: "Outbound Dispatcher Component"
    destination: "MQ Message Listener Component"
    description: "Confirms successful delivery [JMS commit]"
  - source: "Retry & Dead-Letter Manager Component"
    destination: "MQ Message Listener Component"
    description: "Re-queue or poison-message routing [IBM MQ API]"