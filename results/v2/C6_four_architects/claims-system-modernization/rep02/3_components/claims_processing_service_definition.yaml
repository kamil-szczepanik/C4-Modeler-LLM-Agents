level: component
scope: "Component diagram for the Claims Processing Service container"
parentContainer:
  name: "Claims Processing Service"
elements:
  - type: "component"
    name: "Claim Submission Controller"
    technology: "Spring MVC"
    description: "Handles incoming online claim submissions and adjuster workflows."
  - type: "component"
    name: "Claims Security & Context Facade"
    technology: "Spring Security"
    description: "Manages authentication, authorization, and security context propagation."
  - type: "component"
    name: "Validation & Enrichment Engine"
    technology: "Spring Validation / Drools"
    description: "Validates and enriches claim data against business rules."
  - type: "component"
    name: "Migration Strategy Router"
    technology: "Java SPI / Strategy Pattern"
    description: "Routes claims between modern persistence and legacy mainframe integration."
  - type: "component"
    name: "Claim Domain Model Core"
    technology: "Spring Data JPA"
    description: "Manages the core domain model and transactional persistence."
  - type: "component"
    name: "Outbox Event Publisher"
    technology: "Java / Spring Boot"
    description: "Implements the Transactional Outbox pattern to guarantee zero data loss."
  - type: "component"
    name: "Mainframe Sync Listener"
    technology: "Spring Integration"
    description: "Facilitates communication and synchronization with the legacy mainframe system."
relationships:
  - source: "Claim Submission Controller"
    destination: "Claims Security & Context Facade"
    description: "In-memory Filter / Method Call"
  - source: "Claims Security & Context Facade"
    destination: "Validation & Enrichment Engine"
    description: "In-memory Java Method Call"
  - source: "Validation & Enrichment Engine"
    destination: "Migration Strategy Router"
    description: "In-memory Java Method Call"
  - source: "Migration Strategy Router"
    destination: "Claim Domain Model Core"
    description: "In-memory Java Method Call"
  - source: "Migration Strategy Router"
    destination: "Mainframe Integration Adapter"
    description: "IBM MQ, asynchronous"
  - source: "Claim Domain Model Core"
    destination: "Outbox Event Publisher"
    description: "In-memory transactional boundary"
  - source: "Outbox Event Publisher"
    destination: "Primary Datastore"
    description: "JDBC over TLS"