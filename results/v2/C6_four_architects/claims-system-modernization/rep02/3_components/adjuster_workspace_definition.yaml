level: component
scope: "Component diagram for the Adjuster Workspace container"
parentContainer:
  name: "Adjuster Workspace"
elements:
  - type: "component"
    name: "Workspace Shell Component & Security Context Component"
    technology: "React components, Azure AD / Entra ID SSO via MSAL.js [OIDC/JWT]"
    description: "Handles layout, session, and Azure AD / Entra ID SSO."
  - type: "component"
    name: "Claim Interaction Controller & Caching & Synchronization Client"
    technology: "React/Redux, IndexedDB, Service Worker"
    description: "Manages local state and masks slow backend latencies."
  - type: "component"
    name: "Conflict Resolution UI Handler & Telemetry & Audit Component"
    technology: "React components, OpenTelemetry metrics"
    description: "Manages concurrent updates and telemetry/audit functions."
  - type: "component"
    name: "API Gateway Client Layer & Feature Flag & Routing Client"
    technology: "Axios/Fetch communication layer, dynamic routing toggle component"
    description: "Handles communication layer and dynamic routing toggles."
relationships:
  - source: "Workspace Shell Component & Security Context Component"
    destination: "API Gateway Client Layer & Feature Flag & Routing Client"
    description: "Transmits API requests with bearer tokens [HTTPS/JSON via Interceptors]"
  - source: "Claim Interaction Controller & Caching & Synchronization Client"
    destination: "Workspace Shell Component & Security Context Component"
    description: "Renders within layout and session context"
  - source: "Conflict Resolution UI Handler & Telemetry & Audit Component"
    destination: "Claim Interaction Controller & Caching & Synchronization Client"
    description: "Manages concurrent updates for local state"