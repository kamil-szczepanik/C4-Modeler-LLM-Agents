level: component
scope: "Component diagram for the Primary Datastore container"
parentContainer:
  name: "Primary Datastore"
elements:
  - type: "component"
    name: "Claim Transactional Engine"
    technology: "Azure SQL Database, Azure SQL Core"
    description: "Handles relational transactional persistence and core database operations."
  - type: "component"
    name: "Mainframe-Compatibility Schema Adapter"
    technology: "Azure SQL Database Schema"
    description: "Ensures schema compatibility with legacy mainframe systems for seamless fallbacks."
  - type: "component"
    name: "Audit Trail Log Table"
    technology: "Azure SQL Database Table"
    description: "Logs audit trails and cross-references state changes."
  - type: "component"
    name: "Row-Level Security (RLS) & Partitioning Manager"
    technology: "Azure SQL RLS & Partitioning"
    description: "Manages row-level security and data partitioning for hybrid security."
  - type: "component"
    name: "Temporal Table Archival Engine"
    technology: "Azure SQL Temporal Tables"
    description: "Automatically tracks historical row versions to support rollbacks and auditing."
relationships:
  - source: "Claims Processing Service"
    destination: "Claim Transactional Engine"
    description: "Relational transactional persistence [TDS over TLS]"
  - source: "Data Sync Worker"
    destination: "Temporal Table Archival Engine"
    description: "Reconciles state [TDS over TLS]"
  - source: "Audit and Reconciliation Service"
    destination: "Audit Trail Log Table"
    description: "Cross-references state [TDS over TLS]"