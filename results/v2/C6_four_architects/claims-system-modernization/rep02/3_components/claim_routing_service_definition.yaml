level: component
scope: "Component diagram for the Claim Routing Service container"
parentContainer:
  name: "Claim Routing Service"
elements:
  - type: "component"
    name: "Event Ingress Router"
    technology: "Apache Camel"
    description: "Dynamically directs incoming claims between legacy and modern pipelines."
  - type: "component"
    name: "Routing Rules Engine"
    technology: "Apache Camel"
    description: "Evaluates routing logic for claim types."
  - type: "component"
    name: "Feature Flag Evaluator"
    technology: "In-memory cache with short TTL"
    description: "Evaluates feature flags for claim migration status."
  - type: "component"
    name: "Modern Platform Dispatcher"
    technology: "Apache Camel"
    description: "Dispatches claims to the modern processing pipeline."
  - type: "component"
    name: "Mainframe Fallback Dispatcher"
    technology: "Apache Camel"
    description: "Dispatches claims to the legacy mainframe pipeline."
  - type: "component"
    name: "Dead Letter & Audit Handler"
    technology: "Apache Camel"
    description: "Handles failed messages and audit logging."
relationships:
  - source: "Event Ingress Router"
    destination: "Feature Flag Evaluator"
    description: "In-memory function call"
  - source: "Feature Flag Evaluator"
    destination: "Primary Datastore"
    description: "JDBC/TLS"
  - source: "Event Ingress Router"
    destination: "Modern Platform Dispatcher"
    description: "Routes claim"
  - source: "Modern Platform Dispatcher"
    destination: "Claims Processing Service"
    description: "gRPC/HTTP"
  - source: "Event Ingress Router"
    destination: "Mainframe Fallback Dispatcher"
    description: "Routes claim"
  - source: "Mainframe Fallback Dispatcher"
    destination: "Mainframe Integration Adapter"
    description: "AMQP/JMS via IBM MQ"
  - source: "Dead Letter & Audit Handler"
    destination: "Azure Blob Storage / Audit Service"
    description: "HTTPS"