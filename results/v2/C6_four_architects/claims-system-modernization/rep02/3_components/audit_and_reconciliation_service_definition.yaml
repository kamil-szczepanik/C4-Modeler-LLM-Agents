level: component
scope: "Component diagram for the Audit and Reconciliation Service container"
parentContainer:
  name: "Audit and Reconciliation Service"
elements:
  - type: "component"
    name: "Reconciliation Job Scheduler"
    technology: "Azure Timer Trigger"
    description: "Triggers reconciliation jobs on a schedule."
  - type: "component"
    name: "Reconciliation API"
    technology: "HTTP Trigger"
    description: "Exposes endpoints for manual spot-checks or overrides."
  - type: "component"
    name: "Mainframe Delta Extractor"
    technology: "C# .NET isolated worker"
    description: "Pulls daily transaction ledgers from the mainframe."
  - type: "component"
    name: "Ledger Comparison Engine"
    technology: ".NET Component"
    description: "Compares system of record state with expected ledgers."
  - type: "component"
    name: "Reconciliation State Repository"
    technology: "Azure Table Storage / Azure SQL"
    description: "Stores reconciliation state and metrics."
  - type: "component"
    name: "Remediation Dispatcher"
    technology: "C# .NET Component"
    description: "Publishes correction events to resolve discrepancies."
  - type: "component"
    name: "Discrepancy Notifier"
    technology: "Azure Monitor / HTTPS"
    description: "Escalates unresolved reconciliation failures to IT administrators."
relationships:
  - source: "Reconciliation Job Scheduler"
    destination: "Mainframe Delta Extractor"
    description: "Schedules delta extraction [Timer Trigger]"
  - source: "IT Administrator"
    destination: "Reconciliation API"
    description: "Initiates manual spot-checks or overrides [HTTPS]"
  - source: "Mainframe Delta Extractor"
    destination: "Mainframe Integration Adapter"
    description: "Pulls daily transaction ledgers [IBM MQ / AMQP]"
  - source: "Ledger Comparison Engine"
    destination: "Primary Datastore"
    description: "Queries system of record state [ADO.NET over TDS / TLS]"
  - source: "Remediation Dispatcher"
    destination: "Claim Routing Service"
    description: "Publishes correction events [AMQP]"
  - source: "Discrepancy Notifier"
    destination: "IT Administrator"
    description: "Escalates unresolved reconciliation failures [HTTPS / Azure Monitor]"