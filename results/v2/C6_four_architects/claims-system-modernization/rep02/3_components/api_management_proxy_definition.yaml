level: component
scope: "Component diagram for the API Management Proxy container"
parentContainer:
  name: "API Management Proxy"
elements:
  - type: "component"
    name: "JWT Validation Component"
    technology: "APMS Validate-JWT policy"
    description: "Validates incoming JWT tokens from the frontend applications."
  - type: "component"
    name: "API Versioning & Deprecation Component"
    technology: "APMS Version Sets"
    description: "Handles API versioning and deprecation management."
  - type: "component"
    name: "Claim Routing Evaluator"
    technology: "APMS Liquid templates"
    description: "Evaluates claim types and routes requests to modern services or the mainframe."
  - type: "component"
    name: "Mainframe Circuit Breaker"
    technology: "APMS Circuit Breaker policies"
    description: "Protects the legacy mainframe from overload and cascading failures."
  - type: "component"
    name: "Payload Sanitization & Transformation Policy"
    technology: "APMS XSLT/Liquid policies"
    description: "Sanitizes and transforms payloads for legacy mainframe integration."
relationships:
  - source: "JWT Validation Component"
    destination: "API Versioning & Deprecation Component"
    description: "Internal"
  - source: "API Versioning & Deprecation Component"
    destination: "Claim Routing Evaluator"
    description: "Internal"
  - source: "Claim Routing Evaluator"
    destination: "Mainframe Circuit Breaker"
    description: "Internal"
  - source: "Mainframe Circuit Breaker"
    destination: "Payload Sanitization & Transformation Policy"
    description: "Internal"