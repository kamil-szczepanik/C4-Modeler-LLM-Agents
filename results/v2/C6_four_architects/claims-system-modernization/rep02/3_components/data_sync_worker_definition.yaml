level: component
scope: "Component diagram for the Data Sync Worker container"
parentContainer:
  name: "Data Sync Worker"
elements:
  - type: "component"
    name: "CDC Reader Component"
    technology: "Java / Spring Boot"
    description: "Parses incoming delta messages from the legacy system."
  - type: "component"
    name: "Mainframe Protocol Handler Component"
    technology: "Java / Spring Boot, IBM MQ Client"
    description: "Translates proprietary MQ byte streams into domain objects."
  - type: "component"
    name: "Reconciliation Engine Component"
    technology: "Java / Spring Boot"
    description: "Enforces state reconciliation and prevents data loss using idempotency keys."
  - type: "component"
    name: "Outbox Dispatcher Component"
    technology: "Java / Spring Boot, Spring Integration"
    description: "Publishes synchronization events using the transactional outbox pattern."
  - type: "component"
    name: "Dead Letter & Exception Router Component"
    technology: "Java / Spring Boot"
    description: "Isolates malformed payloads and reconciliation conflicts for manual intervention."
  - type: "component"
    name: "Metrics & Audit Telemetry Component"
    technology: "Micrometer, Azure Monitor SDK"
    description: "Emits structured tracking metrics and audit logs."
  - type: "container"
    name: "Mainframe Integration Adapter"
    technology: "Legacy Adapter"
    description: "On-premises legacy mainframe interface."
  - type: "container"
    name: "Primary Datastore"
    technology: "Relational Database"
    description: "Stores reconciled state via JDBC / TDS over TLS."
  - type: "container"
    name: "Claim Routing Service"
    technology: "Azure Service Bus / AMQP"
    description: "Routes state delta events and failure alerts."
  - type: "container"
    name: "Audit and Reconciliation Service"
    technology: "HTTPS / OpenTelemetry"
    description: "Consumes streamed audit telemetry."
relationships:
  - source: "Mainframe Integration Adapter"
    destination: "Mainframe Protocol Handler Component"
    description: "Delivers raw byte streams [IBM MQ client]"
  - source: "CDC Reader Component"
    destination: "Reconciliation Engine Component"
    description: "Passes raw delta payloads [In-memory / Java queues]"
  - source: "Mainframe Protocol Handler Component"
    destination: "CDC Reader Component"
    description: "Supplies parsed messages [In-memory]"
  - source: "Reconciliation Engine Component"
    destination: "Primary Datastore"
    description: "Executes state upserts [JDBC / TDS over TLS]"
  - source: "Reconciliation Engine Component"
    destination: "Outbox Dispatcher Component"
    description: "Triggers event propagation [Transactional Outbox Pattern]"
  - source: "Reconciliation Engine Component"
    destination: "Dead Letter & Exception Router Component"
    description: "Forwards poisoned or conflicting records [In-memory / BlockingQueue]"
  - source: "Outbox Dispatcher Component"
    destination: "Claim Routing Service"
    description: "Publishes state delta events [AMQP over Azure Service Bus]"
  - source: "Dead Letter & Exception Router Component"
    destination: "Claim Routing Service"
    description: "Publishes failure alerts [AMQP over Azure Service Bus]"
  - source: "Reconciliation Engine Component"
    destination: "Metrics & Audit Telemetry Component"
    description: "Emits sync counters [In-memory]"
  - source: "Dead Letter & Exception Router Component"
    destination: "Metrics & Audit Telemetry Component"
    description: "Emits sync counters [In-memory]"
  - source: "Metrics & Audit Telemetry Component"
    destination: "Audit and Reconciliation Service"
    description: "Streams audit telemetry [HTTPS / OpenTelemetry]"