level: context
scope: "System Context diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
  description: "A hybrid cloud Modern Claims Platform that gradually replaces a 30-year-old COBOL/DB2 mainframe while maintaining continuous claims processing."
elements:
  - type: "person"
    name: "Customer & Broker"
    description: "External actors submitting online claims via web UI."
  - type: "person"
    name: "Claims Adjuster"
    description: "Internal actor processing claims in the new web application."
  - type: "person"
    name: "IT Administrator"
    description: "Manages system administration and access."
  - type: "externalSystem"
    name: "Legacy Mainframe (On-Premises)"
    description: "COBOL/DB2 system of record handling nightly batch processing (23:00-05:00)."
  - type: "externalSystem"
    name: "Insurer's Active Directory (Azure AD / Entra ID)"
    description: "Enterprise identity provider for SSO."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External third-party system for executing financial payouts."
relationships:
  - source: "Customer & Broker"
    destination: "Modern Claims Platform"
    description: "Submits online claims"
    technology: "HTTPS (TLS 1.3)"
  - source: "Claims Adjuster"
    destination: "Modern Claims Platform"
    description: "Processes claims in the new web application"
    technology: "HTTPS (TLS 1.3)"
  - source: "IT Administrator"
    destination: "Modern Claims Platform"
    description: "Manages system administration and access"
    technology: "HTTPS (TLS 1.3)"
  - source: "Modern Claims Platform"
    destination: "Insurer's Active Directory (Azure AD / Entra ID)"
    description: "Authenticates users for Single Sign-On"
    technology: "OIDC / OAuth 2.0 over HTTPS"
  - source: "Modern Claims Platform"
    destination: "Legacy Mainframe (On-Premises)"
    description: "Asynchronous bidirectional messaging and state synchronization"
    technology: "Azure Service Bus (AMQP/HTTPS)"
  - source: "Legacy Mainframe (On-Premises)"
    destination: "Modern Claims Platform"
    description: "Asynchronous bidirectional messaging and state synchronization"
    technology: "Azure Service Bus (AMQP/HTTPS)"
  - source: "Modern Claims Platform"
    destination: "Payment Gateway"
    description: "Executes financial payouts"
    technology: "REST / HTTPS"