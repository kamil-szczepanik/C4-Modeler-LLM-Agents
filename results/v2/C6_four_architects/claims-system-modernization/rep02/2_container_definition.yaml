level: container
scope: "Container diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
elements:
  - type: "person"
    name: "Customer & Broker"
    description: "External actors submitting online claims via web UI."
  - type: "person"
    name: "Claims Adjuster"
    description: "Internal actor processing claims in the new web application."
  - type: "externalSystem"
    name: "Legacy Mainframe (On-Premises)"
    description: "COBOL/DB2 system of record handling nightly batch processing."
  - type: "externalSystem"
    name: "Insurer's Active Directory (Azure AD / Entra ID)"
    description: "Enterprise identity provider for SSO."
  - type: "container"
    name: "Web Portal"
    technology: "React on Azure Static Web Apps"
    description: "Customer and broker claim submission interface."
  - type: "container"
    name: "Adjuster Workspace"
    technology: "React on Azure App Service"
    description: "Asynchronous caching workspace for claims handlers."
  - type: "container"
    name: "API Management Proxy"
    technology: "Azure API Management"
    description: "Handling routing and Azure AD (Entra ID) SSO."
  - type: "container"
    name: "Claims Processing Service"
    technology: "Java / Spring Boot on Azure Container Apps"
    description: "Core domain logic execution."
  - type: "container"
    name: "Claim Routing Service"
    technology: "Azure Service Bus"
    description: "Managing messaging and fallback routing."
  - type: "container"
    name: "Primary Datastore"
    technology: "Azure SQL Database"
    description: "Providing ACID compliance for the new platform."
  - type: "container"
    name: "Claim Read Model Store"
    technology: "Azure Cosmos DB / Redis"
    description: "Providing read-optimized projections."
  - type: "container"
    name: "Mainframe Integration Adapter"
    technology: "IBM MQ on-premises"
    description: "Managing legacy batch integration."
  - type: "container"
    name: "Data Sync Worker"
    technology: "Java / Spring Boot on Azure Container Apps"
    description: "Handling state reconciliation."
  - type: "container"
    name: "Audit and Reconciliation Service"
    technology: "Azure Functions"
    description: "Cross-referencing state to prevent discrepancies."
relationships:
  - source: "Customer & Broker"
    destination: "Web Portal"
    description: "Submits claims"
    technology: "HTTPS/TLS"
  - source: "Claims Adjuster"
    destination: "Adjuster Workspace"
    description: "Processes claims"
    technology: "HTTPS/TLS"
  - source: "Web Portal"
    destination: "API Management Proxy"
    description: "Routes portal traffic"
    technology: "HTTPS/TLS"
  - source: "Adjuster Workspace"
    destination: "API Management Proxy"
    description: "Routes adjuster traffic"
    technology: "HTTPS/TLS"
  - source: "API Management Proxy"
    destination: "Claims Processing Service"
    description: "Forwards API requests"
    technology: "Internal mTLS"
  - source: "API Management Proxy"
    destination: "Insurer's Active Directory (Azure AD / Entra ID)"
    description: "Authenticates users"
    technology: "HTTPS"
  - source: "Claims Processing Service"
    destination: "Primary Datastore"
    description: "Relational transactional persistence"
    technology: "TDS over TLS"
  - source: "Claims Processing Service"
    destination: "Claim Routing Service"
    description: "Publishes domain events"
    technology: "AMQP"
  - source: "Claim Routing Service"
    destination: "Claim Read Model Store"
    description: "Updates projections via CDC and events"
    technology: "Azure Service Bus"
  - source: "Legacy Mainframe (On-Premises)"
    destination: "Mainframe Integration Adapter"
    description: "Legacy synchronization"
    technology: "AMQP over Azure ExpressRoute/VPN"
  - source: "Mainframe Integration Adapter"
    destination: "Data Sync Worker"
    description: "Feeds legacy batch data"
    technology: "IBM MQ / Azure Service Bus"
  - source: "Data Sync Worker"
    destination: "Primary Datastore"
    description: "Reconciles state"
    technology: "TDS over TLS"
  - source: "Audit and Reconciliation Service"
    destination: "Primary Datastore"
    description: "Cross-references state"
    technology: "TDS over TLS"
  - source: "Audit and Reconciliation Service"
    destination: "Claim Read Model Store"
    description: "Validates read projections"
    technology: "HTTPS"