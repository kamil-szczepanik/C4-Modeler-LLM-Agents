level: context
scope: "System Context diagram for Insurance Claims Modernization Platform"
system:
  name: "Insurance Claims Modernization Platform"
  description: "A hybrid cloud platform that gradually replaces a legacy COBOL/DB2 mainframe while maintaining continuous claim processing and delivering modern web interfaces."
elements:
  - type: "person"
    name: "Customer"
    description: "External user interacting with the modern web interfaces for insurance claims."
  - type: "person"
    name: "Broker"
    description: "External user assisting clients and managing claims through the platform."
  - type: "person"
    name: "Claims Adjuster"
    description: "Internal user reviewing, processing, and managing insurance claims."
  - type: "externalSystem"
    name: "Active Directory"
    description: "Identity Provider used for authentication via SAML/OIDC."
  - type: "externalSystem"
    name: "Core Rating & Underwriting Engine"
    description: "External service for rating and underwriting policies and claims."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service handling financial transactions and claim payouts."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External service (SendGrid/Azure Communication Services) for sending alerts and notifications."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premises COBOL/DB2 system of record."
relationships:
  - source: "Customer"
    destination: "Insurance Claims Modernization Platform"
    description: "Interacts with the modern web interfaces"
    technology: "HTTPS"
  - source: "Broker"
    destination: "Insurance Claims Modernization Platform"
    description: "Interacts with the modern web interfaces"
    technology: "HTTPS"
  - source: "Claims Adjuster"
    destination: "Insurance Claims Modernization Platform"
    description: "Interacts with the modern web interfaces and Adjuster Web App"
    technology: "HTTPS"
  - source: "Insurance Claims Modernization Platform"
    destination: "Active Directory"
    description: "Authenticates users"
    technology: "SAML/OIDC over HTTPS"
  - source: "Insurance Claims Modernization Platform"
    destination: "Core Rating & Underwriting Engine"
    description: "Calls rating and underwriting functions"
    technology: "HTTPS/REST"
  - source: "Insurance Claims Modernization Platform"
    destination: "Payment Gateway"
    description: "Processes claim payments"
    technology: "HTTPS/REST"
  - source: "Insurance Claims Modernization Platform"
    destination: "Notification Service"
    description: "Sends notifications to users"
    technology: "HTTPS/REST"
  - source: "Insurance Claims Modernization Platform"
    destination: "Legacy Mainframe"
    description: "Communicates asynchronously via integration layer"
    technology: "ExpressRoute and legacy protocols via Azure Service Bus"