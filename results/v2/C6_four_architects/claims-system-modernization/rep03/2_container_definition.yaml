level: container
scope: "Container diagram for Insurance Claims Modernization Platform"
system:
  name: "Insurance Claims Modernization Platform"
elements:
  - type: "person"
    name: "Customer"
    description: "Customer interacting with the modern web interfaces for insurance claims."
  - type: "person"
    name: "Broker"
    description: "Broker assisting clients and managing claims through the platform."
  - type: "person"
    name: "Claims Adjuster"
    description: "Claims Adjuster reviewing, processing, and managing insurance claims."
  - type: "externalSystem"
    name: "Active Directory"
    description: "Identity Provider used for authentication."
  - type: "externalSystem"
    name: "Core Rating & Underwriting Engine"
    description: "External service for rating and underwriting policies and claims."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service handling financial transactions and claim payouts."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External service for sending alerts and notifications."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premises 30-year-old COBOL/DB2 system of record."
  - type: "container"
    name: "Web Portal"
    description: "Unified web interface for customers and brokers."
    technology: "React / TypeScript on Azure Static Web Apps"
  - type: "container"
    name: "Adjuster Web Application"
    description: "Web application for internal claims adjusters."
    technology: "React / TypeScript on Azure Static Web Apps"
  - type: "container"
    name: "API Gateway / BFF"
    description: "API routing, SSO, and Backend-for-Frontend layer."
    technology: "Azure API Management and Node.js"
  - type: "container"
    name: "Claims Management App"
    description: "Core application handling business logic and claims processing."
    technology: "Azure Container Apps"
  - type: "container"
    name: "Claim Routing Service"
    description: "Dedicated routing service ensuring rapid rollbacks and zero data loss."
    technology: "Azure Container Apps"
  - type: "container"
    name: "Integration & Sync Service"
    description: "Service managing synchronization with external and legacy systems."
    technology: "Azure Container Apps / Azure Service Bus"
  - type: "container"
    name: "Claims Database"
    description: "Primary database for storing claims data."
    technology: "Azure SQL Database"
  - type: "container"
    name: "Notification & Document Store"
    description: "Storage for notifications and documents."
    technology: "Azure Blob Storage / Azure Cosmos DB"
  - type: "container"
    name: "Mainframe Data Ingestion Worker"
    description: "Worker processing data ingestion from the legacy mainframe."
    technology: "Azure Functions / Azure Data Factory"
  - type: "container"
    name: "Observability & Audit Container"
    description: "Centralized monitoring and audit logging container."
    technology: "Azure Application Insights and Azure Monitor"
  - type: "component"
    name: "API / Controller Layer"
    description: "Handles incoming API requests for the Claims Management App."
    technology: "ASP.NET Core Controllers"
  - type: "component"
    name: "Domain / Business Logic Layer"
    description: "Encapsulates the core claims processing business rules."
    technology: "C# Class Library"
  - type: "component"
    name: "Data Access Layer"
    description: "Manages database interactions for the Claims Management App."
    technology: "Entity Framework Core / TDS"
  - type: "component"
    name: "Mainframe Anti-Corruption Layer (ACL)"
    description: "Isolates and translates communications with the legacy mainframe."
    technology: "C# Integration Service"
relationships:
  - source: "Customer"
    destination: "Web Portal"
    description: "Interacts with unified web interface"
    technology: "HTTPS"
  - source: "Broker"
    destination: "Web Portal"
    description: "Interacts with unified web interface"
    technology: "HTTPS"
  - source: "Claims Adjuster"
    destination: "Adjuster Web Application"
    description: "Interacts with adjuster application"
    technology: "HTTPS"
  - source: "Web Portal"
    destination: "API Gateway / BFF"
    description: "Sends requests to BFF"
    technology: "HTTPS"
  - source: "Adjuster Web Application"
    destination: "API Gateway / BFF"
    description: "Sends requests to BFF"
    technology: "HTTPS"
  - source: "API Gateway / BFF"
    destination: "Claims Management App"
    description: "Routes API calls"
    technology: "gRPC/HTTP"
  - source: "Claims Management App"
    destination: "Claim Routing Service"
    description: "Routes claim traffic and manages rollbacks"
    technology: "gRPC/REST"
  - source: "Claims Management App"
    destination: "Integration & Sync Service"
    description: "Sends asynchronous messages"
    technology: "AMQP/Azure Service Bus"
  - source: "Claims Management App"
    destination: "Claims Database"
    description: "Reads and writes claim data"
    technology: "Entity Framework Core / TDS"
  - source: "Claims Management App"
    destination: "Notification & Document Store"
    description: "Stores and retrieves documents"
    technology: "HTTPS/Blob SDK"
  - source: "Integration & Sync Service"
    destination: "Mainframe Data Ingestion Worker"
    description: "Triggers data ingestion"
    technology: "Azure Service Bus"
  - source: "Integration & Sync Service"
    destination: "Legacy Mainframe"
    description: "Synchronizes data with mainframe"
    technology: "secure FTP/MQ"
  - source: "Web Portal"
    destination: "Observability & Audit Container"
    description: "Sends telemetry"
    technology: "OpenTelemetry/HTTPS"
  - source: "Adjuster Web Application"
    destination: "Observability & Audit Container"
    description: "Sends telemetry"
    technology: "OpenTelemetry/HTTPS"
  - source: "API Gateway / BFF"
    destination: "Observability & Audit Container"
    description: "Sends telemetry"
    technology: "OpenTelemetry/HTTPS"
  - source: "Claims Management App"
    destination: "Observability & Audit Container"
    description: "Sends telemetry"
    technology: "OpenTelemetry/HTTPS"
  - source: "Claim Routing Service"
    destination: "Observability & Audit Container"
    description: "Sends telemetry"
    technology: "OpenTelemetry/HTTPS"
  - source: "Integration & Sync Service"
    destination: "Observability & Audit Container"
    description: "Sends telemetry"
    technology: "OpenTelemetry/HTTPS"
  - source: "Claims Database"
    destination: "Observability & Audit Container"
    description: "Sends telemetry"
    technology: "OpenTelemetry/HTTPS"
  - source: "Notification & Document Store"
    destination: "Observability & Audit Container"
    description: "Sends telemetry"
    technology: "OpenTelemetry/HTTPS"
  - source: "Mainframe Data Ingestion Worker"
    destination: "Observability & Audit Container"
    description: "Sends telemetry"
    technology: "OpenTelemetry/HTTPS"
  - source: "API / Controller Layer"
    destination: "Domain / Business Logic Layer"
    description: "Delegates requests"
    technology: "In-process method call"
  - source: "Domain / Business Logic Layer"
    destination: "Data Access Layer"
    description: "Queries data"
    technology: "In-process method call"
  - source: "Domain / Business Logic Layer"
    destination: "Mainframe Anti-Corruption Layer (ACL)"
    description: "Translates legacy models"
    technology: "In-process method call"