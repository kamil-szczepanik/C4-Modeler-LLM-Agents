level: component
scope: "Component diagram for the Claims Database container"
parentContainer:
  name: "Claims Database"
elements:
  - type: "component"
    name: "Claims Core Schema"
    technology: "Azure SQL Database"
    description: "Stores core insurance claims data securely with Transparent Data Encryption."
  - type: "component"
    name: "Migration & Sync Staging Schema"
    technology: "Azure SQL Database Staging Tables"
    description: "Handles data staging and synchronization between the hybrid mainframe and modern architecture."
  - type: "component"
    name: "Audit & History Table Store"
    technology: "Azure SQL System-Versioned Temporal Tables"
    description: "Maintains complete historical records and audit trails for compliance and zero data loss."
  - type: "component"
    name: "Data Access Security & Abstraction Layer"
    technology: "Entity Framework Core / TDS"
    description: "Provides secure data access abstraction and enforces row-level security and access controls."
  - type: "component"
    name: "Change Data Capture (CDC) & Index Management Engine"
    technology: "Azure SQL CDC"
    description: "Tracks and streams database changes to synchronize state and read change streams."
  - type: "component"
    name: "Database Migration & Versioning Controller"
    technology: "Azure SQL Versioning Controller"
    description: "Manages database schema migrations and supports rapid rollbacks for migrated claim types."
relationships:
  - source: "Claims Core Schema"
    destination: "Audit & History Table Store"
    description: "Automatically populates historical states"
  - source: "Data Access Security & Abstraction Layer"
    destination: "Claims Core Schema"
    description: "Reads and writes claim records"
  - source: "Change Data Capture (CDC) & Index Management Engine"
    destination: "Migration & Sync Staging Schema"
    description: "Captures and publishes change streams"