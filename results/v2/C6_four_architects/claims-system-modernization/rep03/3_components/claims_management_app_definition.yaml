level: component
scope: "Component diagram for the Claims Management App container"
parentContainer:
  name: "Claims Management App"
elements:
  - type: "component"
    name: "Claim Processing Controller"
    technology: ".NET 8 Web API"
    description: "Handles incoming API requests for claim processing."
  - type: "component"
    name: "Claim Domain Model"
    technology: ".NET 8 / EF Core"
    description: "Encapsulates the core claim business logic and data manipulation."
  - type: "component"
    name: "Outbox Transaction Processor"
    technology: ".NET 8 Background Service"
    description: "Processes outbox messages in the background for reliable event publishing."
  - type: "component"
    name: "Mainframe Adapter"
    technology: ".NET 8 / Polly"
    description: "Communicates with external mainframe systems with built-in resilience via Polly."
  - type: "component"
    name: "Feature & Routing Switcher"
    technology: ".NET 8 In-Memory Service"
    description: "Manages feature flags and claim type routing in-memory."
  - type: "component"
    name: "Authorization & Context Enforcer"
    technology: "ASP.NET Core Middleware"
    description: "Enforces security context and request authorization."
  - type: "component"
    name: "Event Dispatcher"
    technology: "Azure Service Bus Client"
    description: "Publishes domain events to Azure Service Bus."
relationships:
  - source: "Claim Processing Controller"
    destination: "Claim Domain Model"
    description: "Direct in-memory C# method calls [Synchronous]"
  - source: "Claim Domain Model"
    destination: "Claims Database"
    description: "Entity Framework Core [TDS]"
  - source: "Outbox Transaction Processor"
    destination: "Event Dispatcher"
    description: "Background polling and publishing [AMQP / Azure Service Bus]"
  - source: "Mainframe Adapter"
    destination: "Claim Routing Service"
    description: "Low-latency routing and fallback [gRPC]"
  - source: "Authorization & Context Enforcer"
    destination: "Claim Processing Controller"
    description: "Request interception [HTTP / JWT]"