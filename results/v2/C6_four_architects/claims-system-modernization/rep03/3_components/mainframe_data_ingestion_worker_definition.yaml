level: component
scope: "Component diagram for the Mainframe Data Ingestion Worker container"
parentContainer:
  name: "Mainframe Data Ingestion Worker"
elements:
  - type: "component"
    name: "Mainframe Batch Poller"
    technology: "Azure Timer Trigger Function"
    description: "Initiates automated data extraction securely on a schedule."
  - type: "component"
    name: "Sequential File Parser"
    technology: "Python / Node.js"
    description: "Parses fixed-width EBCDIC flat files efficiently."
  - type: "component"
    name: "Data Transformation & Mapping Engine"
    technology: "Azure Function / Custom Code"
    description: "Transforms and maps raw mainframe records into normalized claims data."
  - type: "component"
    name: "Ingestion Dispatcher"
    technology: "Azure Function / Custom Code"
    description: "Dispatches normalized events to downstream integration services."
  - type: "component"
    name: "Idempotency & Checkpoint Manager"
    technology: "Azure SQL / Custom Code"
    description: "Verifies record uniqueness and persists processing checkpoints."
  - type: "component"
    name: "Batch Orchestration Controller"
    technology: "Azure Durable Functions"
    description: "Coordinates parallel chunk processing within the rigid batch window."
  - type: "component"
    name: "Ingestion Error Handler"
    technology: "Azure Function / Custom Code"
    description: "Captures and handles malformed records and processing errors."
  - type: "component"
    name: "Mainframe Vault Credential Provider"
    technology: "Azure Key Vault Client"
    description: "Retrieves secrets securely via Azure Managed Identity."
relationships:
  - source: "Mainframe Batch Poller"
    destination: "Legacy Mainframe"
    description: "Fetches daily batch extracts [SFTP]"
  - source: "Mainframe Batch Poller"
    destination: "Mainframe Vault Credential Provider"
    description: "Retrieves secrets [Azure Managed Identity / HTTPS]"
  - source: "Batch Orchestration Controller"
    destination: "Sequential File Parser"
    description: "Orchestrates parallel processing [Internal Binding]"
  - source: "Sequential File Parser"
    destination: "Ingestion Error Handler"
    description: "Forwards malformed records [Internal Queue]"
  - source: "Ingestion Error Handler"
    destination: "Notification & Document Store"
    description: "Persists poison messages [Azure Blob Storage]"
  - source: "Data Transformation & Mapping Engine"
    destination: "Core Rating & Underwriting Engine"
    description: "Enriches claims data [REST/HTTPS]"
  - source: "Data Transformation & Mapping Engine"
    destination: "Idempotency & Checkpoint Manager"
    description: "Verifies record uniqueness [DB Query]"
  - source: "Idempotency & Checkpoint Manager"
    destination: "Claims Database"
    description: "Persists checkpoints [ADO.NET/HTTPS]"
  - source: "Ingestion Dispatcher"
    destination: "Integration & Sync Service"
    description: "Publishes normalized events [Azure Service Bus]"