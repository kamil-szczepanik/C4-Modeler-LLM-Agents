level: component
scope: "Component diagram for the Adjuster Web Application container"
parentContainer:
  name: "Adjuster Web Application"
elements:
  - type: "component"
    name: "Authentication Module"
    technology: "MSAL.js"
    description: "Handles Active Directory Single Sign-On integration for secure access."
  - type: "component"
    name: "Routing & Layout Component"
    technology: "React Router"
    description: "Manages modular single-page application navigation and renders dashboard and workspace."
  - type: "component"
    name: "Claims Dashboard Component"
    technology: "React / TypeScript"
    description: "Displays the main claims overview interface for adjusters."
  - type: "component"
    name: "Claim Details Workspace Component"
    technology: "React / TypeScript"
    description: "Provides detailed workspace views for individual claims."
  - type: "component"
    name: "Client-Side Cache Component"
    technology: "TanStack Query"
    description: "Provides client-side caching to meet sub-2-second performance goals despite slow mainframe responses."
  - type: "component"
    name: "BFF Client SDK / API Service Layer"
    technology: "TypeScript / REST"
    description: "Encapsulates API communication with the backend services."
relationships:
  - source: "Routing & Layout Component"
    destination: "Claims Dashboard Component"
    description: "Renders via In-Memory"
  - source: "Routing & Layout Component"
    destination: "Claim Details Workspace Component"
    description: "Renders via In-Memory"
  - source: "Claim Details Workspace Component"
    destination: "Client-Side Cache Component"
    description: "Queries via In-Memory"
  - source: "BFF Client SDK / API Service Layer"
    destination: "Client-Side Cache Component"
    description: "Uses via In-Memory"
  - source: "Adjuster Web Application"
    destination: "API Gateway / BFF"
    description: "Sends requests via HTTPS"
  - source: "Adjuster Web Application"
    destination: "Observability & Audit Container"
    description: "Sends telemetry via OpenTelemetry/HTTPS"