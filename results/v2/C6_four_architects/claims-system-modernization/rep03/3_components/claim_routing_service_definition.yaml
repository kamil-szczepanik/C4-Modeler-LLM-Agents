level: component
scope: "Component diagram for the Claim Routing Service container"
parentContainer:
  name: "Claim Routing Service"
elements:
  - type: "component"
    name: "Routing Engine Component"
    technology: "Java 17 / Spring Boot"
    description: "Manages high-throughput claim traffic distribution between the modern Azure cloud platform and the legacy on-premises mainframe."
  - type: "component"
    name: "State & Circuit Breaker Component"
    technology: "Resilience4j + Azure Redis Cache"
    description: "Handles circuit breaker patterns and distributed cache for dynamic failovers and rollbacks."
  - type: "component"
    name: "Audit & Reconciliation Logger Component"
    technology: "Java 17 / Spring Boot"
    description: "Logs claim routing and system activities for audit and reconciliation via Azure Service Bus."
  - type: "component"
    name: "Mainframe Fallback Adapter Component"
    technology: "Apache Camel / Java 17"
    description: "Transforms payloads and routes traffic to the legacy mainframe using enterprise integration patterns."
  - type: "component"
    name: "Idempotency & Deduplication Guard Component"
    technology: "Spring Data Redis & Caffeine Cache"
    description: "Enforces idempotency and high-availability in-memory caching to prevent duplicate claims."
  - type: "component"
    name: "Dynamic Routing Rule Synchronizer Component"
    technology: "Java 17 / Spring Boot"
    description: "Synchronizes dynamic routing rules received from the integration service."
  - type: "component"
    name: "Distributed Tracing & Correlation Component"
    technology: "Micrometer Tracing & OpenTelemetry"
    description: "Provides unified end-to-end telemetry across hybrid boundaries."
  - type: "component"
    name: "Fallback Cache-Aside Guard Component"
    technology: "Java 17 / Spring Boot"
    description: "Manages fallback data caching strategies for resiliency."
  - type: "component"
    name: "Claim Schema Validator Component"
    technology: "Java 17 / Spring Boot"
    description: "Validates incoming claim schemas before processing."
  - type: "component"
    name: "Secret & Endpoint Resolver Component"
    technology: "Azure Key Vault"
    description: "Manages secure credentials and mTLS certificate resolution."
  - type: "component"
    name: "Claims Management App"
    technology: "External Container"
    description: "Upstream application submitting claims."
  - type: "component"
    name: "Azure Redis Cache"
    technology: "Redis"
    description: "Distributed cache backing state and circuit breakers."
  - type: "component"
    name: "Legacy Mainframe"
    technology: "MQ / HTTPS"
    description: "On-premises legacy processing system."
  - type: "component"
    name: "Integration & Sync Service"
    technology: "External Container"
    description: "Service providing dynamic routing rules."
  - type: "component"
    name: "Observability & Audit Container"
    technology: "OpenTelemetry / HTTPS"
    description: "Centralized monitoring and auditing platform."

relationships:
  - source: "Claims Management App"
    destination: "Routing Engine Component"
    description: "gRPC"
  - source: "Routing Engine Component"
    destination: "Idempotency & Deduplication Guard Component"
    description: "In-process"
  - source: "Idempotency & Deduplication Guard Component"
    destination: "Claim Schema Validator Component"
    description: "In-process"
  - source: "Routing Engine Component"
    destination: "State & Circuit Breaker Component"
    description: "In-process / Redis TCP"
  - source: "State & Circuit Breaker Component"
    destination: "Azure Redis Cache"
    description: "TCP/Redis Protocol"
  - source: "State & Circuit Breaker Component"
    destination: "Fallback Cache-Aside Guard Component"
    description: "In-process"
  - source: "Routing Engine Component"
    destination: "Mainframe Fallback Adapter Component"
    description: "gRPC"
  - source: "Mainframe Fallback Adapter Component"
    destination: "Legacy Mainframe"
    description: "MQ / HTTPS"
  - source: "Mainframe Fallback Adapter Component"
    destination: "Secret & Endpoint Resolver Component"
    description: "In-process / HTTPS"
  - source: "Routing Engine Component"
    destination: "Audit & Reconciliation Logger Component"
    description: "Azure Service Bus / AMQP"
  - source: "Integration & Sync Service"
    destination: "Dynamic Routing Rule Synchronizer Component"
    description: "Azure Service Bus / AMQP"
  - source: "Dynamic Routing Rule Synchronizer Component"
