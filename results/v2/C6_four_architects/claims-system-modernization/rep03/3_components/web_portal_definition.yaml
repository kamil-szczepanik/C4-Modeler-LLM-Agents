level: component
scope: "Component diagram for the Web Portal container"
parentContainer:
  name: "Web Portal"
elements:
  - type: "component"
    name: "Web Portal Container"
    technology: "React / TypeScript on Azure Static Web Apps"
    description: "Modernized cloud-based web portal providing a secure, performant, and localized interface for customers and brokers."
  - type: "component"
    name: "Authentication Context / SSO Module"
    technology: "MSAL.js"
    description: "Handles single sign-on and authentication via OIDC."
  - type: "component"
    name: "Claim Submission Wizard"
    technology: "React Hook Form and Zod"
    description: "Allows users to submit claims with form validation."
  - type: "component"
    name: "Claim Tracking Dashboard"
    technology: "React"
    description: "Provides an interface for tracking claim statuses."
  - type: "component"
    name: "Local State & Cache Manager"
    technology: "TanStack Query / React Query"
    description: "Manages server state and caches data locally for sub-second UI responsiveness."
  - type: "component"
    name: "BFF API Client Layer"
    technology: "Axios/Fetch"
    description: "Handles communication with the BFF API."
  - type: "component"
    name: "Localization Provider"
    technology: "i18next"
    description: "Provides multi-language support for regional compliance."
  - type: "component"
    name: "Security Headers & CSP Enforcer"
    technology: "staticwebapp.config.json"
    description: "Applies security headers and content security policies."
  - type: "component"
    name: "External Active Directory"
    technology: "Azure AD"
    description: "External identity provider for enterprise security compliance."
  - type: "component"
    name: "API Gateway / BFF"
    technology: "Azure API Management and Node.js"
    description: "Gateway isolating the legacy mainframe and handling requests."
relationships:
  - source: "Customer / Broker"
    destination: "Web Portal Container"
    description: "Interacts with unified web interface [HTTPS]"
  - source: "Authentication Context"
    destination: "External Active Directory"
    description: "Authenticates via OIDC [HTTPS via Azure AD]"
  - source: "Claim Submission Wizard"
    destination: "Local State & Cache Manager"
    description: "Manages server state [TypeScript Module Call]"
  - source: "Claim Tracking Dashboard"
    destination: "Local State & Cache Manager"
    description: "Manages server state [TypeScript Module Call]"
  - source: "Local State & Cache Manager"
    destination: "BFF API Client Layer"
    description: "Fetches data [TypeScript Module Call]"
  - source: "Web Portal Container"
    destination: "API Gateway / BFF"
    description: "Sends requests to BFF [HTTPS]"
  - source: "Web Portal Container"
    destination: "Azure Static Web Apps Runtime"
    description: "Applies security headers [HTTP Security Headers / CSP]"