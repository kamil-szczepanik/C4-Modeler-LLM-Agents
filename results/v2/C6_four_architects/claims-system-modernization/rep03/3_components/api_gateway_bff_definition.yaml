level: component
scope: "Component diagram for the API Gateway / BFF container"
parentContainer:
  name: "API Gateway / BFF"
elements:
  - type: "component"
    name: "Azure API Management"
    technology: "Azure API Management"
    description: "External ingress and rate limiting, offloading enterprise-grade security."
  - type: "component"
    name: "Customer BFF"
    technology: "Node.js / Express"
    description: "Node.js / Express service for Web Portal handling request aggregation."
  - type: "component"
    name: "Adjuster BFF"
    technology: "Node.js / Express"
    description: "Node.js / Express service for Adjuster Web Application handling request aggregation."
  - type: "component"
    name: "BFF Response Cache"
    technology: "Redis"
    description: "Redis caching coordinator for sub-2s response times."
  - type: "component"
    name: "Token Exchange Middleware"
    technology: "Node.js Active Directory"
    description: "Node.js Active Directory JWT validation and enriched security context."
  - type: "component"
    name: "Circuit Breaker Proxy"
    technology: "Opossum"
    description: "Opossum-based resilience layer to prevent cascading failures."
  - type: "component"
    name: "API Composition & Transformation Engine"
    technology: "Node.js"
    description: "Payload shaping orchestrator."
  - type: "component"
    name: "API Metrics & Telemetry Exporter"
    technology: "OpenTelemetry SDK"
    description: "Vendor-agnostic telemetry collection for hybrid cloud latency tracking."
relationships:
  - source: "Web Portal"
    destination: "Azure API Management"
    description: "Public HTTPS traffic [HTTPS]"
  - source: "Adjuster Web Application"
    destination: "Azure API Management"
    description: "Public HTTPS traffic [HTTPS]"
  - source: "Azure API Management"
    destination: "Customer BFF"
    description: "Routes public traffic [HTTPS]"
  - source: "Azure API Management"
    destination: "Adjuster BFF"
    description: "Routes internal adjuster traffic [HTTPS]"
  - source: "Token Exchange Middleware"
    destination: "Customer BFF"
    description: "Passes enriched security context [In-Memory]"
  - source: "Token Exchange Middleware"
    destination: "Adjuster BFF"
    description: "Passes enriched security context [In-Memory]"
  - source: "Adjuster BFF"
    destination: "BFF Response Cache"
    description: "Queries cached claims data [TCP/Redis]"
