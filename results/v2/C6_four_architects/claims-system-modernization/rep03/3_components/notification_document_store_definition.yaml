level: component
scope: "Component diagram for the Notification & Document Store container"
parentContainer:
  name: "Notification & Document Store"
elements:
  - type: "component"
    name: "Document Storage Component"
    technology: "Azure Blob Storage with Hot/Cool tiers"
    description: "Managed binary storage for claim attachments to reduce operational overhead."
  - type: "component"
    name: "Metadata Catalog Component"
    technology: "Azure Cosmos DB with SQL API"
    description: "Flexible NoSQL schema for document metadata and notification history."
  - type: "component"
    name: "Document Ingestion Proxy Component"
    technology: "Azure Functions"
    description: "Serverless execution for proxying document uploads without cluster management."
  - type: "component"
    name: "Document Event Publisher Component"
    technology: "Azure Event Grid"
    description: "Asynchronous event routing for decoupled hybrid integration."
  - type: "component"
    name: "Notification Template Engine Component"
    technology: "Azure Functions / Handlebars.js"
    description: "Serverless rendering of notification templates."
  - type: "component"
    name: "Notification Dispatcher Component"
    technology: "Azure Functions"
    description: "Serverless execution for dispatching notifications."
  - type: "component"
    name: "Claims Management App"
    technology: "Claims Management App Technology"
    description: "External application interacting with the container."
  - type: "component"
    name: "Azure Service Bus"
    technology: "Azure Service Bus"
    description: "Messaging for decoupled hybrid integration."
  - type: "component"
    name: "External Notification Service"
    technology: "External Service"
    description: "External service used to send alerts."
relationships:
  - source: "Claims Management App"
    destination: "Document Ingestion Proxy Component"
    description: "Uploads documents [HTTPS/REST]"
  - source: "Claims Management App"
    destination: "Metadata Catalog Component"
    description: "Queries indexes and saves notification logs [HTTPS/Cosmos SDK]"
  - source: "Document Ingestion Proxy Component"
    destination: "Document Storage Component"
    description: "Stores binary attachments [HTTPS/Blob SDK]"
  - source: "Document Storage Component"
    destination: "Document Event Publisher Component"
    description: "Emits object events [Event Grid Webhook]"
  - source: "Document Event Publisher Component"
    destination: "Azure Service Bus"
    description: "Publishes document lifecycle events [AMQP]"
  - source: "Notification Dispatcher Component"
    destination: "Notification Template Engine Component"
    description: "Renders templates [In-memory function call]"
  - source: "Notification Dispatcher Component"
    destination: "External Notification Service"
    description: "Sends alerts [HTTPS/REST]"