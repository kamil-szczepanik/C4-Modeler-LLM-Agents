level: component
scope: "Component diagram for the Observability & Audit Container container"
parentContainer:
  name: "Observability & Audit Container"
elements:
  - type: "component"
    name: "Telemetry Collector"
    technology: "Azure Monitor / Application Insights"
    description: "Collects telemetry data from all platform containers using OpenTelemetry."
  - type: "component"
    name: "Audit Log Processor"
    technology: "Azure Application Insights / Azure Functions"
    description: "Processes and persists tamper-evident audit logs."
  - type: "component"
    name: "Alerting & Dashboard Engine"
    technology: "Azure Monitor / Azure Dashboards"
    description: "Provides alerts and monitoring dashboards for system health and performance."
  - type: "component"
    name: "Migration Trace Correlator"
    technology: "Azure Application Insights"
    description: "Correlates traces during the hybrid migration phase between legacy and cloud components."
  - type: "component"
    name: "Security & Access Auditor"
    technology: "Azure Monitor / Azure Security Center"
    description: "Audits security events and access logs across the platform."
relationships:
  - source: "Audit Log Processor"
    destination: "Notification & Document Store"
    description: "Persists tamper-evident logs"