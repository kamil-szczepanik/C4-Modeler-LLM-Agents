level: component
scope: "Component diagram for the Integration & Sync Service container"
parentContainer:
  name: "Integration & Sync Service"
elements:
  - type: "component"
    name: "Message Consumer"
    technology: "Spring Cloud Stream"
    description: "Consumes asynchronous domain events."
  - type: "component"
    name: "Idempotency & Deduplication Filter"
    technology: "Spring Boot Filter"
    description: "Filters and ensures idempotency of raw deserialized events."
  - type: "component"
    name: "Sync Orchestrator"
    technology: "Spring Boot / Saga Pattern"
    description: "Orchestrates synchronization workflows."
  - type: "component"
    name: "Mainframe Adapter"
    technology: "Camel / Spring Boot"
    description: "Adapts and dispatches outbound requests to the mainframe."
  - type: "component"
    name: "Feature Flag & Routing Switcher"
    technology: "Spring Cloud Config"
    description: "Routes fallback payloads during rollbacks."
  - type: "component"
    name: "Batch Rate Limiter"
    technology: "Resilience4j"
    description: "Throttles outbound traffic to protect the mainframe batch window."
  - type: "component"
    name: "Audit & Reconciliation Ledger"
    technology: "Spring Batch / JPA"
    description: "Enables automated state reconciliation and fetches legacy state snapshots."
  - type: "component"
    name: "Event Relay"
    technology: "Azure Service Bus SDK"
    description: "Relays events using Azure Service Bus."
relationships:
  - source: "External Azure Service Bus"
    destination: "Message Consumer"
    description: "Delivers asynchronous domain events [AMQP]"
  - source: "Message Consumer"
    destination: "Idempotency & Deduplication Filter"
    description: "Passes raw deserialized events [In-memory]"
  - source: "Idempotency & Deduplication Filter"
    destination: "Sync Orchestrator"
    description: "Forwards verified messages [In-memory]"
  - source: "Sync Orchestrator"
    destination: "Mainframe Adapter"
    description: "Dispatches outbound requests via Batch Rate Limiter [In-memory]"
  - source: "Feature Flag & Routing Switcher"
    destination: "Mainframe Adapter"
    description: "Routes fallback payloads during rollback [gRPC/Direct]"
  - source: "Audit & Reconciliation Ledger"
    destination: "Mainframe Adapter"
    description: "Fetches legacy state snapshots [AMQP/MQ]"
  - source: "Audit & Reconciliation Ledger"
    destination: "Observability & Audit Container"
    description: "Exports audit logs [OpenTelemetry/HTTPS]"