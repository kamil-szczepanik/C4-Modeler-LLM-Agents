level: context
scope: "System Context diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
  description: "A hybrid cloud Modern Claims Platform that gradually replaces a legacy COBOL/DB2 mainframe claims system over a 3-year period, enabling online claim submission and adjuster workflows while maintaining strict data consistency and synchronization."
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "External actors who submit online claims and interact with the platform."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal actors who manage and process claims within the adjuster workbench."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "External System of Record built on COBOL/DB2, hosted on-premise."
  - type: "externalSystem"
    name: "Active Directory / Azure AD"
    description: "External Identity Provider used for SSO."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External system for sending notifications."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system for processing payments."
  - type: "externalSystem"
    name: "Document Management System"
    description: "External system for managing documents."
  - type: "externalSystem"
    name: "Audit & Compliance System"
    description: "External system for auditing and compliance tracking."
relationships:
  - source: "Customers and Brokers"
    destination: "Modern Claims Platform"
    description: "Submit online claims and interact with the portal"
    technology: "HTTPS (REST/JSON)"
  - source: "Claims Adjusters"
    destination: "Modern Claims Platform"
    description: "Manage and process claims via adjuster workbench for sub-2s response times"
    technology: "HTTPS (REST/JSON)"
  - source: "Modern Claims Platform"
    destination: "Active Directory / Azure AD"
    description: "Authenticate users via Single Sign-On"
    technology: "HTTPS (OIDC/OAuth 2.0)"
  - source: "Modern Claims Platform"
    destination: "Legacy Mainframe"
    description: "Synchronize data and process claims asynchronously"
    technology: "Azure Service Bus and Azure Logic Apps"
  - source: "Modern Claims Platform"
    destination: "Notification Service"
    description: "Trigger notifications"
    technology: "HTTPS (REST)"
  - source: "Modern Claims Platform"
    destination: "Payment Gateway"
    description: "Process claim payouts"
    technology: "HTTPS (REST)"
  - source: "Modern Claims Platform"
    destination: "Document Management System"
    description: "Store and retrieve claim documents"
    technology: "HTTPS (REST)"
  - source: "Modern Claims Platform"
    destination: "Audit & Compliance System"
    description: "Log compliance and audit trails"
    technology: "HTTPS (REST)"