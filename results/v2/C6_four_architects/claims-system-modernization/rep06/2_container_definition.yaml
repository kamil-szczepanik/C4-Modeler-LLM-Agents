level: container
scope: "Container diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "External actors who submit online claims and interact with the platform."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal actors who manage and process claims within the adjuster workbench."
  - type: "externalSystem"
    name: "On-Premises COBOL/DB2 Mainframe"
    description: "Legacy System of Record built on COBOL/DB2, hosted on-premise."
  - type: "externalSystem"
    name: "Azure Active Directory"
    description: "External Identity Provider used for SSO and OIDC validation."
  - type: "container"
    name: "Customer Portal and Adjuster Workspace SPAs"
    technology: "React, Azure Static Web Apps"
    description: "Provides online claim submission and modern adjuster workflows."
  - type: "container"
    name: "Azure API Management"
    technology: "Azure API Management"
    description: "Acts as the API Gateway handling native OIDC validation and token propagation."
  - type: "container"
    name: "Claims Core Service"
    technology: ".NET 8, Azure Container Apps"
    description: "Domain microservice managing core claims processing and business logic."
  - type: "container"
    name: "Mainframe Integration Adapter"
    technology: ".NET 8, Azure Container Apps"
    description: "Isolates expensive mainframe interactions and bridges hybrid network requests."
  - type: "container"
    name: "Audit & Compliance Worker"
    technology: ".NET 8, Azure Container Apps"
    description: "Background worker handling audit and compliance tasks."
  - type: "container"
    name: "Azure Service Bus"
    technology: "Azure Service Bus"
    description: "Integration bus and message broker for asynchronous event processing."
  - type: "container"
    name: "Azure SQL Database"
    technology: "Azure SQL Database, Entity Framework Core"
    description: "ACID-compliant transactional store guaranteeing zero data loss."
  - type: "container"
    name: "Azure Data Factory"
    technology: "Azure Data Factory with Self-Hosted Integration Runtime"
    description: "Handles ETL and data replication during strict nightly batch windows."
relationships:
  - source: "Customers and Brokers"
    destination: "Customer Portal and Adjuster Workspace SPAs"
    description: "Submit online claims and interact with the portal"
    technology: "HTTPS"
  - source: "Claims Adjusters"
    destination: "Customer Portal and Adjuster Workspace SPAs"
    description: "Manage and process claims via adjuster workspace"
    technology: "HTTPS"
  - source: "Customer Portal and Adjuster Workspace SPAs"
    destination: "Azure API Management"
    description: "Send API requests with OIDC/OAuth2 authentication"
    technology: "HTTPS (OIDC/OAuth2)"
  - source: "Azure API Management"
    destination: "Claims Core Service"
    description: "Forward API requests with propagated JWT bearer tokens"
    technology: "HTTP/2"
  - source: "Azure API Management"
    destination: "Mainframe Integration Adapter"
    description: "Forward integration requests"
    technology: "HTTP/2"
  - source: "Claims Core Service"
    destination: "Azure Service Bus"
    description: "Publish and consume asynchronous messages"
    technology: "AMQP"
  - source: "Claims Core Service"
    destination: "Azure SQL Database"
    description: "Perform transactional persistence operations"
    technology: "TDS (Entity Framework Core)"
  - source: "Mainframe Integration Adapter"
    destination: "On-Premises COBOL/DB2 Mainframe"
    description: "Communicate with legacy mainframe backend"
    technology: "IBM MQ / CICS (TCP)"
  - source: "Azure Data Factory"
    destination: "On-Premises COBOL/DB2 Mainframe"
    description: "Synchronize data and execute batch replication during nightly window"
    technology: "JDBC/ODBC via Self-Hosted Integration Runtime"
  - source: "Customer Portal and Adjuster Workspace SPAs"
    destination: "Azure Active Directory"
    description: "Authenticate users and validate identity"
    technology: "OIDC/OAuth2"