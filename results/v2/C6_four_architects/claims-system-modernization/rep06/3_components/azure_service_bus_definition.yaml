level: component
scope: "Component diagram for the Azure Service Bus container"
parentContainer:
  name: "Azure Service Bus"
elements:
  - type: "component"
    name: "Claim Event Topic"
    technology: "Azure Service Bus Topic (AMQP)"
    description: "Azure Service Bus Topic for domain events (`claims-events`) using AMQP."
  - type: "component"
    name: "Mainframe Sync Queue"
    technology: "Azure Service Bus Queue (AMQP, Sessions / FIFO)"
    description: "Azure Service Bus Queue utilizing AMQP and Sessions (FIFO) for mainframe order enforcement."
  - type: "component"
    name: "Duplicate Detection Filter"
    technology: "Azure Service Bus Native Property (RequiresDuplicateDetection)"
    description: "Enforces exactly-once semantics using native broker features."
  - type: "component"
    name: "Subscription Filter Rules"
    technology: "Azure Service Bus SQL Filters"
    description: "Broker-level routing rules on topics to segment traffic by claim type."
  - type: "component"
    name: "DLQ Processor / Forwarder"
    technology: "Azure Service Bus Auto-Forwarding"
    description: "Auto-forwarding mechanism routing poisoned messages to a triage queue."
  - type: "component"
    name: "Session State Management"
    technology: "Azure Service Bus Session State"
    description: "Broker-native session state persistence on the sync queue."
relationships:
  - source: "Claims Core Service"
    destination: "Claim Event Topic"
    description: "Publish domain events (`ClaimSubmitted`, `ClaimUpdated`) [AMQP]"
  - source: "Claim Event Topic"
    destination: "Subscription Filter Rules"
    description: "Route events based on claim type [AMQP]"
  - source: "Mainframe Integration Adapter"
    destination: "Mainframe Sync Queue"
    description: "Consume ordered messages and manage session state [AMQP]"
  - source: "Mainframe Sync Queue"
    destination: "DLQ Processor / Forwarder"
    description: "Forward poisoned sync messages [AMQP]"