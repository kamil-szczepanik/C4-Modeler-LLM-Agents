level: component
scope: "Component diagram for the Customer Portal and Adjuster Workspace SPAs container"
parentContainer:
  name: "Customer Portal and Adjuster Workspace SPAs"
elements:
  - type: "component"
    name: "Claim Submission UI Module"
    technology: "React, Azure Static Web Apps"
    description: "Provides online claim submission interfaces for customers and brokers."
  - type: "component"
    name: "Adjuster Workspace UI Module"
    technology: "React, Azure Static Web Apps"
    description: "Provides modern workflows and interfaces for claims adjusters to manage and process claims."
  - type: "component"
    name: "Authentication Client Module"
    technology: "OIDC/OAuth2 Client Library"
    description: "Handles user authentication requests against Azure Active Directory."
  - type: "component"
    name: "API Gateway Client Module"
    technology: "Fetch / Axios REST Client"
    description: "Sends secure API requests over HTTPS to Azure API Management."
relationships:
  - source: "Claim Submission UI Module"
    destination: "API Gateway Client Module"
    description: "Sends claim submission data [HTTPS (REST/JSON)]"
  - source: "Adjuster Workspace UI Module"
    destination: "API Gateway Client Module"
    description: "Sends claim management requests [HTTPS (REST/JSON)]"
  - source: "Claim Submission UI Module"
    destination: "Authentication Client Module"
    description: "Authenticates users [OIDC/OAuth2]"
  - source: "Adjuster Workspace UI Module"
    destination: "Authentication Client Module"
    description: "Authenticates users [OIDC/OAuth2]"