level: component
scope: "Component diagram for the Azure Data Factory container"
parentContainer:
  name: "Azure Data Factory"
elements:
  - type: "component"
    name: "Mainframe Extraction Pipeline"
    technology: "Azure Data Factory Pipeline"
    description: "Extracts data from the on-premises COBOL/DB2 mainframe via the SHIR cluster and pushes payloads to staging blob storage."
  - type: "component"
    name: "Staging Blob Storage"
    technology: "Azure Data Lake Storage Gen2"
    description: "Temporarily holds raw parquet files to optimize processing within the strict batch window."
  - type: "component"
    name: "Transformation & Ingestion Flow"
    technology: "ADF Mapping Data Flows"
    description: "Transforms and ingests data, writing valid payloads to the database and invalid payloads to the quarantine container."
  - type: "component"
    name: "Reconciliation & Error-Handling Pipeline"
    technology: "ADF Pipeline"
    description: "Ensures automated reconciliation, zero data loss, and strict consistency."
  - type: "component"
    name: "Monitoring & Alerting Trigger"
    technology: "ADF Tumbling Window / Azure Monitor"
    description: "Invokes the mainframe extraction pipeline and monitors system executions."
  - type: "component"
    name: "Self-Hosted Integration Runtime (SHIR) Cluster"
    technology: "Multi-node active-active ADF SHIR"
    description: "Secures on-premises mainframe communication without opening inbound firewall ports."
  - type: "component"
    name: "Dead-Letter & Quarantine Container"
    technology: "Azure Blob Storage"
    description: "Provides append blobs for isolating malformed records in the dead-letter quarantine."
  - type: "component"
    name: "Mainframe Schema Registry"
    technology: "Azure Purview / ADF Dataset Metadata"
    description: "Provides schema definitions to the transformation and ingestion flow."
relationships:
  - source: "Mainframe Extraction Pipeline"
    destination: "Self-Hosted Integration Runtime (SHIR) Cluster"
    description: "Reads from On-Premises COBOL/DB2 Mainframe [JDBC / Encrypted TLS over HTTPS]"
  - source: "Mainframe Extraction Pipeline"
    destination: "Staging Blob Storage"
    description: "Pushes payloads [HTTPS]"
  - source: "Transformation & Ingestion Flow"
    destination: "Azure SQL Database"
    description: "Writes modern claim data [T-SQL/JDBC via Managed Private Endpoint]"
  - source: "Transformation & Ingestion Flow"
    destination: "Dead-Letter & Quarantine Container"
    description: "Writes invalid payloads [REST/HTTPS]"
  - source: "Transformation & Ingestion Flow"
    destination: "Mainframe Schema Registry"
    description: "Reads schema definitions [Metadata API]"
  - source: "Monitoring & Alerting Trigger"
    destination: "Mainframe Extraction Pipeline"
    description: "Invokes [Internal ADF Control Plane]"
  - source: "Mainframe Integration Adapter"
    destination: "Mainframe Extraction Pipeline"
    description: "Invokes [Azure Event Grid / ADF REST API]"