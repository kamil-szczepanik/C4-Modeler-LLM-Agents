level: component
scope: "Component diagram for the Claims Core Service container"
parentContainer:
  name: "Claims Core Service"
elements:
  - type: "component"
    name: "Claim Submission Controller"
    technology: "ASP.NET Core Web API"
    description: "Receives raw claim submissions."
  - type: "component"
    name: "Claim Routing Engine"
    technology: "C# Component"
    description: "Routes claim types to either modernized engine or legacy ACL."
  - type: "component"
    name: "Claim Domain Model & Engine"
    technology: "C# Class Library"
    description: "Processes modernized claims and publishes domain events."
  - type: "component"
    name: "Mainframe Anti-Corruption Layer - ACL"
    technology: "C# Component"
    description: "Translates and routes legacy claim types."
  - type: "component"
    name: "Persistence Repository"
    technology: "EF Core Context"
    description: "Performs transactional reads and writes to the database."
  - type: "component"
    name: "Integration Event Publisher/Subscriber"
    technology: "MassTransit .NET"
    description: "Publishes domain events asynchronously."
  - type: "component"
    name: "Workflow Orchestration Service"
    technology: "C# Component"
    description: "Orchestrates workflows and updates read models."
  - type: "component"
    name: "Document Management Client"
    technology: "Typed HttpClient"
    description: "Uploads and retrieves attachments from the document management system."
  - type: "component"
    name: "Claim Caching & Read Model Component"
    technology: "Redis / Memory"
    description: "Implements CQRS-lite read models for fast UI responses."
relationships:
  - source: "Claim Submission Controller"
    destination: "Claim Routing Engine"
    description: "Forwards raw submissions [In-process]"
  - source: "Claim Routing Engine"
    destination: "Claim Domain Model & Engine"
    description: "Routes modernized claim types [In-process]"
  - source: "Claim Routing Engine"
    destination: "Mainframe Anti-Corruption Layer - ACL"
    description: "Routes legacy claim types [In-process]"
  - source: "Claim Domain Model & Engine"
    destination: "Persistence Repository"
    description: "Performs transactional reads/writes [TDS via EF Core]"
  - source: "Claim Domain Model & Engine"
    destination: "Integration Event Publisher/Subscriber"
    description: "Publishes domain events [AMQP via Azure Service Bus]"
  - source: "Workflow Orchestration Service"
    destination: "Claim Caching & Read Model Component"
    description: "Updates read models [In-process / Redis]"
  - source: "Document Management Client"
    destination: "Document Management System"
    description: "Uploads and retrieves attachments [HTTPS]"
  - source: "Mainframe Anti-Corruption Layer - ACL"
    destination: "Mainframe Integration Adapter"
    description: "Syncs legacy data [gRPC/HTTP]"