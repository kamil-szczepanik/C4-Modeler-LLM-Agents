level: component
scope: "Component diagram for the Azure API Management container"
parentContainer:
  name: "Azure API Management"
elements:
  - type: "component"
    name: "JWT Validation Policy"
    technology: "Azure APIM Policy"
    description: "Validates incoming JSON Web Tokens and fetches OpenID Connect metadata and JWKS from Azure Active Directory."
  - type: "component"
    name: "Response Caching Component"
    technology: "Azure Redis Cache integration"
    description: "Caches read-only claim lookup data to protect the legacy mainframe from performance degradation."
  - type: "component"
    name: "Rate Limiting & Quota Policy"
    technology: "Azure APIM Policy"
    description: "Enforces rate limits and quotas for incoming API requests."
  - type: "component"
    name: "Transformation & Request Routing Policy"
    technology: "Azure APIM Policy"
    description: "Transforms and routes modern claim type requests to the Claims Core Service and legacy fallback requests to the Mainframe Integration Adapter."
relationships:
  - source: "JWT Validation Policy"
    destination: "Azure Active Directory"
    description: "Fetch OpenID Connect metadata and JSON Web Keys (JWKS) [HTTPS / OIDC]"
  - source: "Response Caching Component"
    destination: "Azure Redis Cache"
    description: "Cache read-only claim lookup data [TCP / Redis Protocol]"
  - source: "Transformation & Request Routing Policy"
    destination: "Claims Core Service"
    description: "Route modern claim type requests [HTTP/2]"
  - source: "Transformation & Request Routing Policy"
    destination: "Mainframe Integration Adapter"
    description: "Route legacy fallback requests [HTTP/2]"