level: component
scope: "Component diagram for the Audit & Compliance Worker container"
parentContainer:
  name: "Audit & Compliance Worker"
elements:
  - type: "component"
    name: "Event Consumer Component"
    technology: ".NET 8 Hosted Service / MassTransit"
    description: "Consumes domain events from Azure Service Bus via AMQP."
  - type: "component"
    name: "Compliance Validator Component"
    technology: ".NET 8"
    description: "Evaluates events, routing valid data to Audit Repository Access Component and failures to Dead Letter Manager Component."
  - type: "component"
    name: "Dead Letter Manager Component"
    technology: ".NET 8"
    description: "Stores poisoned messages in Azure Blob Storage."
  - type: "component"
    name: "Audit Repository Access Component"
    technology: "Entity Framework Core"
    description: "Persists compliance logs in Azure SQL Database."
  - type: "component"
    name: "Mainframe Sync Component"
    technology: ".NET 8 BackgroundService with native PeriodicTimer"
    description: "Pushes compliance packages to the Audit & Compliance System via HTTPS/REST."
relationships:
  - source: "Event Consumer Component"
    destination: "Compliance Validator Component"
    description: "Forwards consumed domain events for validation"
  - source: "Compliance Validator Component"
    destination: "Audit Repository Access Component"
    description: "Routes valid data"
  - source: "Compliance Validator Component"
    destination: "Dead Letter Manager Component"
    description: "Routes failures"
  - source: "Dead Letter Manager Component"
    destination: "Azure Blob Storage"
    description: "Stores poisoned messages in"
  - source: "Audit Repository Access Component"
    destination: "Azure SQL Database"
    description: "Persists compliance logs in"
  - source: "Mainframe Sync Component"
    destination: "Audit & Compliance System"
    description: "Pushes compliance packages to via HTTPS/REST"