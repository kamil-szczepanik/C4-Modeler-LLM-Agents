level: component
scope: "Component diagram for the Mainframe Integration Adapter container"
parentContainer:
  name: "Mainframe Integration Adapter"
elements:
  - type: "component"
    name: "Adapter API Controller"
    technology: ".NET 8 component"
    description: "Receives forwarded integration requests from Azure API Management."
  - type: "component"
    name: "Mainframe Message Translator with Versioning & Feature Flags"
    technology: ".NET 8 component"
    description: "Transforms payloads with versioning and feature flag management."
  - type: "component"
    name: "Outbox Pattern Processor"
    technology: ".NET 8 + Entity Framework Core component"
    description: "Persists transaction state to guarantee zero data loss."
  - type: "component"
    name: "Circuit Breaker & Fallback Manager"
    technology: ".NET 8 + Polly component"
    description: "Handles high mainframe latency and manages legacy fallback calls."
  - type: "component"
    name: "IBM MQ / CICS Client"
    technology: ".NET 8 component"
    description: "Executes legacy calls and secures persistent communication to the mainframe."
relationships:
  - source: "Adapter API Controller"
    destination: "Mainframe Message Translator with Versioning & Feature Flags"
    description: "Transform payloads [In-Memory]"
  - source: "Mainframe Message Translator with Versioning & Feature Flags"
    destination: "Outbox Pattern Processor"
    description: "Persist transaction state [In-Memory]"
  - source: "Outbox Pattern Processor"
    destination: "IBM MQ / CICS Client"
    description: "Queue dispatch [In-Memory]"
  - source: "IBM MQ / CICS Client"
    destination: "Circuit Breaker & Fallback Manager"
    description: "Execute legacy calls [TCP/IP via Azure Hybrid Connections]"
  - source: "Circuit Breaker & Fallback Manager"
    destination: "Azure Service Bus"
    description: "Publish fallback events [AMQP]"