level: component
scope: "Component diagram for the Azure SQL Database container"
parentContainer:
  name: "Azure SQL Database"
elements:
  - type: "component"
    name: "Claims Data Model"
    technology: "Entity Framework Core Migrations"
    description: "Relational tables and schemas structured per claim type ensuring zero data loss."
  - type: "component"
    name: "Data Access Layer"
    technology: ".NET 8 Libraries, Entity Framework Core, T-SQL"
    description: "Implements Repository and Unit of Work patterns for data access and transactions."
  - type: "component"
    name: "Database Security & Auditing"
    technology: "Azure SQL Transparent Data Encryption, Row-Level Security, SQL Audit"
    description: "Provides database security, row-level restrictions, and audit logs."
  - type: "component"
    name: "Temporal Tables"
    technology: "SQL Server System-Versioning"
    description: "Provides immutable historical audit trails for claims data."
  - type: "component"
    name: "Mainframe Sync Staging Tables"
    technology: "Dedicated Schemas / T-SQL"
    description: "Buffers bi-directional state changes between the modern platform and the legacy mainframe."
  - type: "component"
    name: "Stored Procedures & Database Triggers"
    technology: "T-SQL"
    description: "Handles high-performance batch processing and validation within strict legacy batch windows."
relationships:
  - source: "Claims Core Service"
    destination: "Data Access Layer"
    description: "In-process method calls [C# / Entity Framework Core]"
  - source: "Data Access Layer"
    destination: "Claims Data Model"
    description: "Queries and transactions [T-SQL]"
  - source: "Azure Data Factory"
    destination: "Mainframe Sync Staging Tables"
    description: "Bulk copy operations [Bulk Insert / T-SQL]"
  - source: "Mainframe Integration Adapter"
    destination: "Mainframe Sync Staging Tables"
    description: "Read/Write sync states [T-SQL via EF Core]"
  - source: "Audit & Compliance System"
    destination: "Database Security & Auditing"
    description: "Direct log scraping [Azure Monitor / SQL Audit Output]"