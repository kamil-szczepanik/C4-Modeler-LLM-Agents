level: component
scope: "Component diagram for the Integration & Sync Worker container"
parentContainer:
  name: "Integration & Sync Worker"
elements:
  - type: "component"
    name: "Event Consumer"
    technology: "C# Azure Function"
    description: "Consumes messages and events from the integration event broker to trigger synchronization workflows."
  - type: "component"
    name: "Sync Orchestrator"
    technology: "C# Azure Durable Functions"
    description: "Orchestrates long-running integration and synchronization workflows between the modern platform and mainframe."
  - type: "component"
    name: "Transformation & Mapping Engine"
    technology: "C# / .NET 8"
    description: "Maps and transforms data models between modern JSON/relational structures and legacy COBOL/DB2 formats."
  - type: "component"
    name: "Mainframe Adapter"
    technology: "C# / Secure SFTP / MQ"
    description: "Handles secure communication, data exchange, and interaction with the legacy mainframe system."
  - type: "component"
    name: "Resiliency & Retry Policy"
    technology: "Polly (.NET library)"
    description: "Provides fault tolerance, retries, and circuit breaker patterns for integration calls."
  - type: "component"
    name: "Reconciliation & Audit Logger"
    technology: "Entity Framework Core / C#"
    description: "Logs sync activities and performs data reconciliation to ensure zero data loss."
  - type: "component"
    name: "Configuration & Feature Flag"
    technology: "Azure App Configuration / C#"
    description: "Manages dynamic feature toggles and runtime configurations for the worker."
relationships:
  - source: "Event Consumer"
    destination: "Sync Orchestrator"
    description: "Triggers workflow"
  - source: "Sync Orchestrator"
    destination: "Transformation & Mapping Engine"
    description: "Transforms payloads"
  - source: "Transformation & Mapping Engine"
    destination: "Mainframe Adapter"
    description: "Sends/receives mapped data"
  - source: "Mainframe Adapter"
    destination: "Resiliency & Retry Policy"
    description: "Applies retry and fault tolerance policies"
  - source: "Sync Orchestrator"
    destination: "Reconciliation & Audit Logger"
    description: "Logs execution and state"
  - source: "Sync Orchestrator"
    destination: "Configuration & Feature Flag"
    description: "Reads configuration"