level: component
scope: "Component diagram for the Claims Database container"
parentContainer:
  name: "Claims Database"
elements:
  - type: "component"
    name: "Claim Tables"
    technology: "Azure SQL Database Managed Instance, T-SQL"
    description: "Core relational Azure SQL storage enforcing strict ACID guarantees for migrated claim types."
  - type: "component"
    name: "Sync Staging Tables"
    technology: "Azure SQL Database Managed Instance, T-SQL"
    description: "Azure SQL staging area for asynchronous replication payloads managed by the integration worker."
  - type: "component"
    name: "Audit & Temporal History"
    technology: "Azure SQL Database Managed Instance, System-Versioned Temporal Tables, T-SQL"
    description: "Azure SQL System-Versioned Temporal Tables tracking historical row versions for compliance and rollback."
  - type: "component"
    name: "Change Tracking Mechanism"
    technology: "Azure SQL Database Managed Instance, Change Tracking"
    description: "Azure SQL Change Tracking feature capturing row-level changes asynchronously without table locks."
  - type: "component"
    name: "Reconciliation & Rollback Views"
    technology: "Azure SQL Database Managed Instance, T-SQL Views"
    description: "Azure SQL Views encapsulating complex JOINs to expose unified payload views for verification and rollback."
  - type: "component"
    name: "Claims Core Service"
    technology: "TDS over TLS (TCP 1433)"
    description: "External service executing domain queries against core claim tables and audit history."
  - type: "component"
    name: "Integration & Sync Worker"
    technology: "TDS over TLS (TCP 1433)"
    description: "External worker managing reconciliation data, polling delta changes, and reading unified snapshots."
relationships:
  - source: "Claims Core Service"
    destination: "Claim Tables"
    description: "Executes domain queries via TDS over TLS (TCP 1433)."
  - source: "Claims Core Service"
    destination: "Audit & Temporal History"
    description: "Executes domain queries via TDS over TLS (TCP 1433)."
  - source: "Integration & Sync Worker"
    destination: "Sync Staging Tables"
    description: "Stages reconciliation data via TDS over TLS (TCP 1433)."
  - source: "Integration & Sync Worker"
    destination: "Change Tracking Mechanism"
    description: "Polls delta changes via TDS over TLS (TCP 1433)."
  - source: "Integration & Sync Worker"
    destination: "Reconciliation & Rollback Views"
    description: "Reads unified snapshots via TDS over TLS (TCP 1433)."