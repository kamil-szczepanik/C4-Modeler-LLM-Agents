level: component
scope: "Component diagram for the Integration Event Broker container"
parentContainer:
  name: "Integration Event Broker"
elements:
  - type: "component"
    name: "Claim Ingestion Topic"
    technology: "Azure Service Bus Topic"
    description: "Publishes domain events using CloudEvents JSON schema for asynchronous event-driven integration."
  - type: "component"
    name: "Mainframe Outbox Queue"
    technology: "Azure Service Bus Queue"
    description: "Consumes ordered messages using Service Bus Sessions for legacy synchronization."
  - type: "component"
    name: "Dead-Letter Handler"
    technology: "Azure Service Bus DLQ"
    description: "Handles failed message deliveries and exceptions for fault tolerance."
  - type: "component"
    name: "Replay & Dead-Letter Manager"
    technology: "Azure Service Bus Management"
    description: "Manages message replays and dead-letter queue inspection."
  - type: "component"
    name: "Access Control & Namespace Authorization"
    technology: "Azure IAM / SAS / RBAC"
    description: "Secures access and manages authorization across the messaging namespace."
  - type: "component"
    name: "Broker Diagnostics & Metrics Publisher"
    technology: "Azure Monitor / App Insights"
    description: "Publishes broker diagnostics and metrics for observability."
relationships:
  - source: "Claims Core Service"
    destination: "Claim Ingestion Topic"
    description: "Publishes domain events using CloudEvents JSON schema [AMQP over TLS (TCP 5671)]"
  - source: "Integration & Sync Worker"
    destination: "Mainframe Outbox Queue"
    description: "Consumes ordered messages using Service Bus Sessions [AMQP over TLS (TCP 5671)]"
  - source: "API Gateway / BFF"
    destination: "Claim Ingestion Topic"
    description: "Publishes direct customer/broker submission events [AMQP over TLS]"
  - source: "Integration Event Broker"
    destination: "Integration & Sync Worker"
    description: "Pushes batched synchronization payloads [AMQP over TLS]"