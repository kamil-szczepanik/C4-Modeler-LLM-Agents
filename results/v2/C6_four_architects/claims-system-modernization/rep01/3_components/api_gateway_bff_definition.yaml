level: component
scope: "Component diagram for the API Gateway / BFF container"
parentContainer:
  name: "API Gateway / BFF"
elements:
  - type: "component"
    name: "Customer BFF"
    technology: "Node.js / Express"
    description: "Lightweight, decoupled BFF tailored to customer workflows, communicating with core claims via gRPC."
  - type: "component"
    name: "Adjuster BFF"
    technology: "Node.js / Express with WebSocket Gateway Module"
    description: "BFF tailored to adjuster workflows featuring a WebSocket Gateway Module for real-time push updates."
relationships:
  - source: "Customer BFF"
    destination: "Claims Core Service"
    description: "Invokes core business logic via gRPC"
  - source: "Adjuster BFF"
    destination: "Claims Core Service"
    description: "Invokes core business logic via gRPC"
  - source: "Adjuster BFF"
    destination: "Azure Cache for Redis"
    description: "Reads and writes session/cache data via TCP/RESP"
  - source: "Azure Service Bus"
    destination: "Adjuster BFF"
    description: "Pushes real-time integration events via AMQP / Azure SDK"