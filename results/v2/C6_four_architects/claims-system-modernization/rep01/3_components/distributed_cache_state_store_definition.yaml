level: component
scope: "Component diagram for the Distributed Cache / State Store container"
parentContainer:
  name: "Distributed Cache / State Store"
elements:
  - type: "component"
    name: "Idempotency State Manager"
    technology: "Redis SETNX / TTL"
    description: "Manages idempotency states to prevent event replay."
  - type: "component"
    name: "Distributed Session Provider"
    technology: "Redis Sessions"
    description: "Provides distributed session management."
  - type: "component"
    name: "Migration Routing & Fallback Cache"
    technology: "Redis Hashes"
    description: "Evaluates migration status and supports rapid fallbacks."
  - type: "component"
    name: "Distributed Lock Manager"
    technology: "Redlock pattern"
    description: "Acquires synchronization locks for distributed operations."
  - type: "component"
    name: "Eviction & Expiration Policy Engine"
    technology: "volatile-lru"
    description: "Handles eviction and expiration policies for cached data."
relationships:
  - source: "Claims Core Service"
    destination: "Distributed Cache / State Store"
    description: "Manages session cache and idempotency [Redis RESP / TCP over TLS]"
  - source: "Integration & Sync Worker"
    destination: "Idempotency State Manager"
    description: "Prevents event replay [Redis RESP / TCP over TLS]"
  - source: "Claims Core Service"
    destination: "Migration Routing & Fallback Cache"
    description: "Evaluates migration status [Redis RESP / TCP over TLS]"
  - source: "Integration & Sync Worker"
    destination: "Distributed Lock Manager"
    description: "Acquires synchronization locks [Redis RESP / TCP over TLS]"