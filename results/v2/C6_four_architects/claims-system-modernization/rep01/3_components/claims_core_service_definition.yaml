level: component
scope: "Component diagram for the Claims Core Service container"
parentContainer:
  name: "Claims Core Service"
elements:
  - type: "component"
    name: "Feature Routing Dispatcher"
    technology: ".NET class library"
    description: "Routes claims workflows to modern handlers or legacy fallback based on dynamic feature flags."
  - type: "component"
    name: "Claim Command Processor"
    technology: ".NET class library using MediatR"
    description: "Processes claim commands and executes business workflows."
  - type: "component"
    name: "Claim Query Handler"
    technology: ".NET class library"
    description: "Handles read workloads for optimized claim data."
  - type: "component"
    name: "Domain Model / Aggregate Roots"
    technology: ".NET class library"
    description: "Encapsulates core business rules and aggregate roots."
  - type: "component"
    name: "Anti-Corruption Layer (ACL)"
    technology: ".NET class library"
    description: "Translates modern domain models to legacy structures."
  - type: "component"
    name: "Mainframe Adapter Component"
    technology: ".NET class library"
    description: "Delegates legacy fallback workflows to the mainframe system."
  - type: "component"
    name: "Idempotency Validator"
    technology: "StackExchange.Redis"
    description: "Checks duplicate processing using distributed caching."
  - type: "component"
    name: "Integration Event Publisher"
    technology: "Azure.Messaging.ServiceBus"
    description: "Emits state change events to the event broker."
  - type: "component"
    name: "Claims Database"
    technology: "Azure SQL / Database"
    description: "Stores optimized claim data."
relationships:
  - source: "Feature Routing Dispatcher"
    destination: "Claim Command Processor"
    description: "Delegates modern claim workflows [Internal C# Method Call]"
  - source: "Feature Routing Dispatcher"
    destination: "Mainframe Adapter Component"
    description: "Delegates legacy fallback workflows [Internal C# Method Call]"
  - source: "Claim Command Processor"
    destination: "Idempotency Validator"
    description: "Checks duplicate processing [Redis Protocol over TLS]"
  - source: "Claim Command Processor"
    destination: "Domain Model / Aggregate Roots"
    description: "Executes business rules [Internal C# Method Call]"
  - source: "Domain Model / Aggregate Roots"
    destination: "Anti-Corruption Layer (ACL)"
    description: "Translates domain models to legacy structures [Internal C# Method Call]"
  - source: "Domain Model / Aggregate Roots"
    destination: "Integration Event Publisher"
    description: "Emits state change events [AMQP over TLS (TCP 5671)]"
  - source: "Claim Query Handler"
    destination: "Claims Database"
    description: "Reads optimized claim data [TDS over TLS (TCP 1433)]"