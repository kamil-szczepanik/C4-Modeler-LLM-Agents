level: container
scope: "Container diagram for Regional Insurance Modernization System"
system:
  name: "Modern Claims Platform"
  description: "A modern cloud platform that processes online claims and adjuster workflows while gradually migrating claim types from a 30-year-old legacy mainframe."
elements:
  - type: "person"
    name: "Customer & Broker"
    description: "External users who submit and manage insurance claims through web and mobile interfaces."
  - type: "person"
    name: "Adjusters"
    description: "Internal insurance adjusters who handle claim workflows."
  - type: "container"
    name: "Customer & Broker Portal"
    description: "Web and mobile portal allowing customers and brokers to interact with the claims system."
  - type: "container"
    name: "Claims Web App"
    description: "Web application serving the modern claims platform interfaces."
  - type: "container"
    name: "API Management"
    description: "Secures ingress, manages traffic, and handles API policies for the cloud platform."
  - type: "container"
    name: "Claim Routing Service"
    description: "Dynamically routes claim types between the modern platform and the legacy system."
  - type: "container"
    name: "Claims Processing Service"
    description: "Processes online claims and adjuster workflows."
  - type: "container"
    name: "Azure SQL Database"
    description: "Cloud data persistence layer with rollback capability for migrated claim types."
  - type: "container"
    name: "Azure Service Bus"
    description: "Enables asynchronous, decoupled hybrid messaging."
  - type: "container"
    name: "On-Premises Integration Service"
    description: "Bridges cloud messaging with the on-premises legacy environment."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "COBOL/DB2 system acting as the core system of record."
  - type: "externalSystem"
    name: "Active Directory / Entra ID Connect"
    description: "Provides identity management and authentication services."
relationships:
  - source: "Customer & Broker"
    destination: "Customer & Broker Portal"
    description: "Interacts with portal to submit and track claims"
    technology: "HTTPS"
  - source: "Customer & Broker Portal"
    destination: "API Management"
    description: "Sends API requests to the modern claims platform"
    technology: "HTTPS/REST"
  - source: "Adjusters"
    destination: "Claims Web App"
    description: "Manages claim workflows"
    technology: "HTTPS/WebSockets"
  - source: "Claims Web App"
    destination: "API Management"
    description: "Routes workflow actions"
    technology: "HTTPS/REST"
  - source: "API Management"
    destination: "Claims Processing Service"
    description: "Forwards requests"
    technology: "HTTPS"
  - source: "API Management"
    destination: "Claim Routing Service"
    description: "Forwards claim routing requests"
    technology: "HTTPS"
  - source: "Modern Claims Platform"
    destination: "Active Directory / Entra ID Connect"
    description: "Authenticates users"
    technology: "HTTPS (OIDC/SAML)"
  - source: "Claim Routing Service"
    destination: "Azure SQL Database"
    description: "Reads and writes claim data"
    technology: "TDS via Entity Framework Core"
  - source: "Modern Claims Platform"
    destination: "Azure Service Bus"
    description: "Publishes asynchronous messages"
    technology: "AMQP"
  - source: "Azure Service Bus"
    destination: "On-Premises Integration Service"
    description: "Transmits messages across hybrid boundary"
    technology: "AMQP"
  - source: "On-Premises Integration Service"
    destination: "Legacy Mainframe"
    description: "Integrates with legacy backend"
    technology: "IBM MQ protocol"