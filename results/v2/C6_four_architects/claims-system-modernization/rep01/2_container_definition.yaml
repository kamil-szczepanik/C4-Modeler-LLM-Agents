level: container
scope: "Container diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
  description: "A system that gradually replaces a legacy COBOL/DB2 mainframe claims platform with a modern, hybrid cloud architecture."
elements:
  - type: "person"
    name: "Customer & Broker"
    description: "External users who submit and track insurance claims online."
  - type: "person"
    name: "Adjusters"
    description: "Internal users who handle claim workflows."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premises COBOL/DB2 system acting as the legacy system of record."
  - type: "externalSystem"
    name: "Azure AD / Entra ID"
    description: "Provides identity management and authentication services."
  - type: "container"
    name: "Customer Portal"
    technology: "React / TypeScript SPA"
    description: "Allows customers and brokers to submit and manage claims."
  - type: "container"
    name: "Web Frontend"
    technology: "React / TypeScript SPA"
    description: "Provides adjuster workflows and interface access."
  - type: "container"
    name: "API Gateway / BFF"
    technology: "Node.js / Express"
    description: "Secures ingress, manages traffic, and handles client-facing routing."
  - type: "container"
    name: "Claims Core Service"
    technology: ".NET 8 / C#"
    description: "Processes online claims and core business logic."
  - type: "container"
    name: "Integration & Sync Worker"
    technology: "Python / C# Azure Function"
    description: "Bridges cloud messaging and the legacy mainframe."
  - type: "container"
    name: "Claims Database"
    technology: "Azure SQL Database Managed Instance"
    description: "Provides relational persistence and ACID consistency for migrated claims."
  - type: "container"
    name: "Integration Event Broker"
    technology: "Azure Service Bus"
    description: "Asynchronously decouples services to protect legacy batch limits."
  - type: "container"
    name: "Distributed Cache / State Store"
    technology: "Azure Cache for Redis"
    description: "Handles distributed session caching and idempotency keys."
  - type: "container"
    name: "Configuration & Feature Store"
    technology: "Azure App Configuration"
    description: "Enables dynamic feature flagging for rapid claim-type switch-backs."
relationships:
  - source: "Customer & Broker"
    destination: "Customer Portal"
    description: "Submits and tracks claims"
    technology: "HTTPS"
  - source: "Adjusters"
    destination: "Web Frontend"
    description: "Performs claim workflows"
    technology: "HTTPS"
  - source: "Customer Portal"
    destination: "API Gateway / BFF"
    description: "Sends API requests and WebSocket messages"
    technology: "HTTPS/REST, WSS (JSON)"
  - source: "Web Frontend"
    destination: "API Gateway / BFF"
    description: "Sends API requests and WebSocket messages"
    technology: "HTTPS/REST, WSS (JSON)"
  - source: "API Gateway / BFF"
    destination: "Claims Core Service"
    description: "Forwards backend API requests"
    technology: "gRPC / HTTP/2"
  - source: "Claims Core Service"
    destination: "Claims Database"
    description: "Reads and writes claim data"
    technology: "TDS over TLS (TCP 1433)"
  - source: "Claims Core Service"
    destination: "Integration Event Broker"
    description: "Publishes asynchronous integration events"
    technology: "AMQP over TLS (TCP 5671)"
  - source: "Integration & Sync Worker"
    destination: "Legacy Mainframe"
    description: "Syncs data and integrates across hybrid boundary"
    technology: "Secure SFTP/MQ"
  - source: "Customer Portal"
    destination: "Azure AD / Entra ID"
    description: "Authenticates users"
    technology: "OpenID Connect (OIDC) over HTTPS"
  - source: "Web Frontend"
    destination: "Azure AD / Entra ID"
    description: "Authenticates users"
    technology: "OpenID Connect (OIDC) over HTTPS"
  - source: "API Gateway / BFF"
    destination: "Azure AD / Entra ID"
    description: "Validates tokens"
    technology: "OpenID Connect (OIDC) over HTTPS"
  - source: "Claims Core Service"
    destination: "Configuration & Feature Store"
    description: "Retrieves dynamic feature flags and configuration"
    technology: "HTTPS/REST"
  - source: "Claims Core Service"
    destination: "Distributed Cache / State Store"
    description: "Manages session cache and idempotency"
    technology: "Redis Protocol over TLS"