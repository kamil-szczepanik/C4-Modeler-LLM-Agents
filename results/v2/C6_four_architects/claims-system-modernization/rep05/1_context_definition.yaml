level: context
scope: "System Context diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization"
  description: "A hybrid cloud solution that gradually replaces a 30-year-old COBOL/DB2 mainframe claims system, enabling online claim submission and modernized adjuster workflows."
elements:
  - type: "person"
    name: "Customers & Brokers"
    description: "External users submitting claims."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff managing claims."
  - type: "externalSystem"
    name: "Active Directory"
    description: "Enterprise identity provider."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "API Gateway / Edge"
    description: "Azure Container Apps / App Gateway handling ingress and TLS termination."
  - type: "externalSystem"
    name: "Claims Web App"
    description: "React / Azure Static Web Apps user interface."
  - type: "externalSystem"
    name: "Claims Core Service"
    description: "Azure Container Apps / .NET backend domain logic."
  - type: "externalSystem"
    name: "Integration & Anti-Corruption Layer"
    description: "Azure Functions / Service Bus for mainframe decoupling."
  - type: "externalSystem"
    name: "Modern Claims Database"
    description: "Azure SQL Database for migrated claim data."
  - type: "externalSystem"
    name: "Asynchronous Message Broker"
    description: "Azure Service Bus for reliable event processing."
  - type: "externalSystem"
    name: "On-Premise Integration Agent"
    description: "Azure Relay / Hybrid Worker for secure mainframe connectivity."
  - type: "externalSystem"
    name: "Audit & Reconciliation Worker"
    description: "Azure Functions / .NET background worker for batch reconciliation."
relationships:
  - source: "Customers & Brokers"
    destination: "API Gateway / Edge"
    description: "UI access and claim submission"
    technology: "HTTPS (TLS 1.3)"
  - source: "Claims Adjusters"
    destination: "API Gateway / Edge"
    description: "UI access and claim management"
    technology: "HTTPS (TLS 1.3)"
  - source: "API Gateway / Edge"
    destination: "Claims Core Service"
    description: "Routes requests to backend domain logic"
    technology: "gRPC / internal HTTPS"
  - source: "Claims Core Service"
    destination: "Modern Claims Database"
    description: "Reads and writes migrated claim data"
    technology: "TDS via Entity Framework Core"
  - source: "Claims Core Service"
    destination: "Asynchronous Message Broker"
    description: "Publishes and consumes events"
    technology: "AMQP / Azure Service Bus SDK"
  - source: "Integration & Anti-Corruption Layer"
    destination: "Legacy Mainframe"
    description: "Decouples mainframe interactions and batch transfers"
    technology: "IBM MQ / z/OS Connect REST / SFTP"
  - source: "API Gateway / Edge"
    destination: "Active Directory"
    description: "Handles Single Sign-On authentication"
    technology: "OpenID Connect (OIDC) over HTTPS"