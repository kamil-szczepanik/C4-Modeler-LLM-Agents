level: component
scope: "Component diagram for the Anti-Corruption Layer container"
parentContainer:
  name: "Anti-Corruption Layer"
elements:
  - type: "component"
    name: "Routing & Feature Flag Dispatcher"
    technology: "Azure Functions (.NET 8 / Java)"
    description: "Routes requests and handles feature flag dispatching for the hybrid migration window."
  - type: "component"
    name: "Async Event Translator"
    technology: "Azure Functions (.NET 8 / Java)"
    description: "Translates asynchronous events between modern and legacy formats."
  - type: "component"
    name: "Model Transformer"
    technology: "Azure Functions (.NET 8 / Java)"
    description: "Transforms data models between the modern schema and the legacy COBOL/DB2 structure."
  - type: "component"
    name: "State & Deduplication Ledger"
    technology: "Azure Cosmos DB Serverless"
    description: "Tracks in-flight transactions and ensures message deduplication."
  - type: "component"
    name: "Circuit Breaker & Fallback Policy"
    technology: "Resilience4j / Polly"
    description: "Provides resilience, circuit breaking, and fallback policies for mainframe integration."
relationships:
  - source: "Routing & Feature Flag Dispatcher"
    destination: "Model Transformer"
    description: "Dispatches and transforms payloads"
  - source: "Async Event Translator"
    destination: "Model Transformer"
    description: "Translates events for model transformation"
  - source: "Model Transformer"
    destination: "State & Deduplication Ledger"
    description: "Records transaction state and checks deduplication"
  - source: "Routing & Feature Flag Dispatcher"
    destination: "Circuit Breaker & Fallback Policy"
    description: "Invokes external calls through resilience policies"