level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Topic Router"
    technology: "Azure Service Bus Topics"
    description: "Routes asynchronous events to appropriate subscription endpoints."
  - type: "component"
    name: "Dead-Letter Queue Manager"
    technology: "Azure Service Bus DLQ"
    description: "Handles undeliverable or poisoned messages for manual inspection."
  - type: "component"
    name: "Session Processor"
    technology: "Azure Service Bus Sessions"
    description: "Ensures strict FIFO ordering for related claim events."
  - type: "component"
    name: "Subscription Filter Engine"
    technology: "Azure Service Bus Rules"
    description: "Filters messages based on criteria defined per subscriber."
  - type: "component"
    name: "Broker Authorization Filter"
    technology: "Azure RBAC / SAS"
    description: "Secures access to queues and topics."
  - type: "component"
    name: "Message TTL & Archival Policy Engine"
    technology: "Azure Service Bus Policies"
    description: "Manages message expiration and archival workflows."
  - type: "component"
    name: "Telemetry & Audit Forwarder"
    technology: "Azure Monitor / Application Insights"
    description: "Forwards broker state metrics and audit trails."
  - type: "component"
    name: "Partition Controller"
    technology: "Azure Service Bus Partitioning"
    description: "Scales throughput by partitioning messages across internal nodes."
relationships:
  - source: "Topic Router"
    destination: "Subscription Filter Engine"
    description: "Evaluates message filters"
  - source: "Subscription Filter Engine"
    destination: "Session Processor"
    description: "Passes filtered messages for ordered processing"
  - source: "Session Processor"
    destination: "Dead-Letter Queue Manager"
    description: "Routes failed messages"
  - source: "Topic Router"
    destination: "Partition Controller"
    description: "Distributes load across partitions"
  - source: "Topic Router"
    destination: "Telemetry & Audit Forwarder"
    description: "Emits broker state metrics"