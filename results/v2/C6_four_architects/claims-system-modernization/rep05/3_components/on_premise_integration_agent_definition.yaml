level: component
scope: "Component diagram for the On-Premise Integration Agent container"
parentContainer:
  name: "On-Premise Integration Agent"
elements:
  - type: "component"
    name: "Inbound Listener"
    technology: "Apache Camel (Java)"
    description: "Receives asynchronous messages from Azure Service Bus for hybrid messaging."
  - type: "component"
    name: "Mainframe Protocol Adapter"
    technology: "CICS/DB2 connectors, Java"
    description: "Translates modern messages into legacy transactions and queries for the mainframe."
  - type: "component"
    name: "Outbound Poller"
    technology: "Apache Camel (Java)"
    description: "Polls legacy data sources and systems for outbound events and updates."
  - type: "component"
    name: "Circuit Breaker & Retry Manager"
    technology: "Resilience4j"
    description: "Ensures fault-tolerant communication and handles transient failures during mainframe integration."
  - type: "component"
    name: "Local State Store"
    technology: "H2 Database"
    description: "Maintains local state and buffers data to guarantee zero data loss during incremental migration."
  - type: "component"
    name: "Health & Telemetry Monitor"
    technology: "Micrometer (Java)"
    description: "Monitors system health and collects telemetry data for the integration agent."
relationships:
  - source: "Inbound Listener"
    destination: "Mainframe Protocol Adapter"
    description: "Routes inbound integration payloads [Java Method Invocation]"
  - source: "Mainframe Protocol Adapter"
    destination: "Circuit Breaker & Retry Manager"
    description: "Executes legacy transactions through fault-tolerant wrapper [Resilience4j]"
  - source: "Circuit Breaker & Retry Manager"
    destination: "Local State Store"
    description: "Persists pending state and retry queues [JDBC]"
  - source: "Outbound Poller"
    destination: "Circuit Breaker & Retry Manager"
    description: "Sends polled events through resilience wrapper [Java Method Invocation]"