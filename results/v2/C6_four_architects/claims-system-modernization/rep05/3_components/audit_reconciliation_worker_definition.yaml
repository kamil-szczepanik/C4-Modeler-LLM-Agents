level: component
scope: "Component diagram for the Audit & Reconciliation Worker container"
parentContainer:
  name: "Audit & Reconciliation Worker"
elements:
  - type: "component"
    name: "Reconciliation Job Scheduler"
    technology: "Quartz / Spring Batch Scheduler"
    description: "Triggers Mainframe Data Reader and Modern DB Reader via in-process method calls."
  - type: "component"
    name: "Mainframe Data Reader"
    technology: "Spring Batch component using On-Premise Integration Agent"
    description: "Queries the On-Premise Integration Agent via REST over TLS 1.3."
  - type: "component"
    name: "Modern DB Reader"
    technology: "Spring Data JPA"
    description: "Queries the Modern Claims Database via JDBC over TLS 1.3."
  - type: "component"
    name: "Discrepancy Analyzer"
    technology: "Java Streams"
    description: "Analyzes discrepancies and passes data to Audit Log Repository Writer synchronously and emits alerts to Alert & Compensation Publisher asynchronously."
  - type: "component"
    name: "Alert & Compensation Publisher"
    technology: "Azure Service Bus Client"
    description: "Emits alerts asynchronously via Azure Service Bus."
  - type: "component"
    name: "Audit Log Repository Writer"
    technology: "Spring Data JDBC"
    description: "Persists audit logs synchronously via JDBC."
relationships:
  - source: "Reconciliation Job Scheduler"
    destination: "Mainframe Data Reader"
    description: "Triggers via in-process method calls"
  - source: "Reconciliation Job Scheduler"
    destination: "Modern DB Reader"
    description: "Triggers via in-process method calls"
  - source: "Mainframe Data Reader"
    destination: "On-Premise Integration Agent"
    description: "Queries via REST over TLS 1.3"
  - source: "Modern DB Reader"
    destination: "Modern Claims Database"
    description: "Queries via JDBC over TLS 1.3"
  - source: "Discrepancy Analyzer"
    destination: "Audit Log Repository Writer"
    description: "Passes data synchronously via JDBC"
  - source: "Discrepancy Analyzer"
    destination: "Alert & Compensation Publisher"
    description: "Emits alerts asynchronously via Azure Service Bus"