level: component
scope: "Component diagram for the Read-Through Cache container"
parentContainer:
  name: "Read-Through Cache"
elements:
  - type: "component"
    name: "Redis In-Memory Data Store"
    technology: "Azure Cache for Redis Standard Tier"
    description: "Manages high-performance in-memory caching to ensure screen loads under 2 seconds."
  - type: "component"
    name: "Eviction Policy Manager"
    technology: "Native volatile-lru"
    description: "Manages data eviction within the cache using native policies."
  - type: "component"
    name: "Cache Synchronization Listener"
    technology: "Azure Service Bus Listener"
    description: "Listens for invalidation events to synchronize cache state."
relationships:
  - source: "Cache Synchronization Listener"
    destination: "Redis In-Memory Data Store"
    description: "DEL {key} [Redis RESP / TCP over TLS]"