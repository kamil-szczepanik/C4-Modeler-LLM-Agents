level: component
scope: "Component diagram for the API Gateway / Edge container"
parentContainer:
  name: "API Gateway / Edge"
elements:
  - type: "component"
    name: "JWT Validation Policy Engine"
    technology: "Azure API Management Policy / OIDC / JWT"
    description: "Validates security tokens and authenticates requests."
  - type: "component"
    name: "Path-Based Routing Router"
    technology: "Azure API Management Routing"
    description: "Forwards validated modern requests and routes hybrid/legacy-bound requests."
  - type: "component"
    name: "Rate Limiting & Throttling Policy"
    technology: "Azure API Management Policy"
    description: "Applies rate limiting and throttling to incoming requests."
  - type: "component"
    name: "Response Caching Policy Component"
    technology: "Azure API Management Policy"
    description: "Handles response caching."
  - type: "component"
    name: "SSL/TLS Termination & WAF Component"
    technology: "Azure Application Gateway / APIM WAF"
    description: "Serves as the ingress traffic entry point and handles SSL/TLS termination."
  - type: "component"
    name: "Telemetry & Audit Logging Component"
    technology: "Azure Monitor / APIM Logger"
    description: "Handles telemetry and audit logging."
relationships:
  - source: "JWT Validation Policy Engine"
    destination: "Path-Based Routing Router"
    description: "Passes validated requests for routing"