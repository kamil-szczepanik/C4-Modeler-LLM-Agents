level: component
scope: "Component diagram for the Claims Core Service container"
parentContainer:
  name: "Claims Core Service"
elements:
  - type: "component"
    name: "Claim Submission Controller"
    technology: "Spring MVC"
    description: "Exposes REST endpoints for claims handling and receives incoming HTTP requests."
  - type: "component"
    name: "Validation & Policy Component"
    technology: "Bean Validation / JSR-380"
    description: "Enforces structural payload validation and validates incoming DTOs."
  - type: "component"
    name: "Claim Routing Engine"
    technology: "Java / Spring Boot"
    description: "Routes validated domain commands and delegates unmigrated types."
  - type: "component"
    name: "Claim Processing Domain Service"
    technology: "Spring Data JPA"
    description: "Manages database interactions, business logic, transactional outbox persistence, and audit events."
  - type: "component"
    name: "Read-Through Cache Component"
    technology: "Spring Cache"
    description: "Powers the read-through cache integration for cached claim aggregates and sub-2s UI response times."
  - type: "component"
    name: "Outbox Event Publisher"
    technology: "Java / Spring Boot"
    description: "Writes outbox messages and publishes domain events to the message broker."
  - type: "component"
    name: "Reconciliation & Audit Listener"
    technology: "Spring Application Event"
    description: "Emits and listens to domain audit events for reconciliation."
  - type: "component"
    name: "Anti-Corruption Layer"
    technology: "gRPC over VNet"
    description: "Interfaces safely with the legacy mainframe for unmigrated claim types."
  - type: "component"
    name: "Message Broker (Azure Service Bus)"
    technology: "AMQP over TLS"
    description: "Facilitates secure messaging and event distribution."
relationships:
  - source: "Claim Submission Controller"
    destination: "Validation & Policy Component"
    description: "Validates incoming DTOs [In-process Method Call]"
  - source: "Validation & Policy Component"
    destination: "Claim Routing Engine"
    description: "Passes validated domain commands [In-process Method Call]"
  - source: "Claim Routing Engine"
    destination: "Claim Processing Domain Service"
    description: "Direct method invocation [In-process]"
  - source: "Claim Routing Engine"
    destination: "Anti-Corruption Layer"
    description: "Delegates unmigrated types [gRPC over VNet]"
  - source: "Claim Processing Domain Service"
    destination: "Read-Through Cache Component"
    description: "Reads/writes cached claim aggregates [In-process Method Call]"
  - source: "Claim Processing Domain Service"
    destination: "Outbox Event Publisher"
    description: "Writes outbox messages [In-process Method Call]"
  - source: "Outbox Event Publisher"
    destination: "Message Broker (Azure Service Bus)"
    description: "Publishes domain events [AMQP over TLS]"
  - source: "Claim Processing Domain Service"
    destination: "Reconciliation & Audit Listener"
    description: "Emits domain audit events [In-process Application Event]"