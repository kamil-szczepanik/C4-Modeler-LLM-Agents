level: component
scope: "Component diagram for the Modern Claims Database container"
parentContainer:
  name: "Modern Claims Database"
elements:
  - type: "component"
    name: "Claim Data Access Component"
    technology: "Entity Framework Core"
    description: "Reads and writes claim records."
  - type: "component"
    name: "Migration Audit Log Component"
    technology: "Azure SQL Ledger"
    description: "Enables tamper-evident, cryptographically verifiable migration audit logs."
  - type: "component"
    name: "Reference Data Component"
    technology: "Azure SQL Database"
    description: "Provides ACID compliance for strict consistency requirements."
  - type: "component"
    name: "Schema Versioning & Temporal Component"
    technology: "Azure SQL Temporal Tables"
    description: "Native time-slicing to support rapid one-day claim-type rollbacks."
  - type: "component"
    name: "Outbox Event Dispatcher Component"
    technology: "Transactional Outbox Pattern"
    description: "Guarantees atomic database writes and reliable messaging without distributed transactions."
  - type: "component"
    name: "Database Maintenance & Archival Component"
    technology: "T-SQL partitioning"
    description: "Manages table partitions and index maintenance."
relationships:
  - source: "Claims Core Service"
    destination: "Claim Data Access Component"
    description: "Reads and writes claim records [TDS (SQL)]"
  - source: "Claims Core Service"
    destination: "Schema Versioning & Temporal Component"
    description: "Queries historical claim snapshots [Entity Framework / TDS]"
  - source: "Outbox Event Dispatcher Component"
    destination: "Message Broker"
    description: "Publishes domain events [AMQP / Azure Service Bus SDK]"
  - source: "Database Maintenance & Archival Component"
    destination: "Claim Data Access Component"
    description: "Manages table partitions and index maintenance [SQL / T-SQL]"