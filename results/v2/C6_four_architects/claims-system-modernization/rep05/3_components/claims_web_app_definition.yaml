level: component
scope: "Component diagram for the Claims Web App container"
parentContainer:
  name: "Claims Web App"
elements:
  - type: "component"
    name: "Router / Navigation Component"
    technology: "React Router"
    description: "Handles client-side routing and navigation across the modern claims application."
  - type: "component"
    name: "Authentication Wrapper"
    technology: "MSAL.js"
    description: "Secures Azure Active Directory Single Sign-On integration and validates tokens."
  - type: "component"
    name: "Claim Submission Feature Module"
    technology: "React Hook Form / Zod"
    description: "Provides secure online claim submissions with client-side validation."
  - type: "component"
    name: "Adjuster Workbench Module"
    technology: "TanStack Query"
    description: "Provides high-performance adjuster workflows with local caching and optimistic updates."
  - type: "component"
    name: "Feature Flag / Claim Type Resolver"
    technology: "React"
    description: "Resolves feature flags and claim types dynamically."
  - type: "component"
    name: "API Client Layer"
    technology: "TypeScript / Fetch"
    description: "Proxies all REST requests to the backend."
  - type: "component"
    name: "Audit & Telemetry Interceptor"
    technology: "OpenTelemetry JS / App Insights SDK"
    description: "Emits telemetry events for end-to-end traceability and audit compliance."
  - type: "component"
    name: "State Management Store"
    technology: "Zustand"
    description: "Manages lightweight cross-component UI state and session data."
relationships:
  - source: "Authentication Wrapper"
    destination: "API Gateway / Edge"
    description: "Validates and sends tokens via HTTPS (OIDC/Bearer)"
  - source: "Claim Submission Feature Module"
    destination: "API Gateway / Edge"
    description: "Fetches and mutates claim data via HTTPS (REST)"
  - source: "Adjuster Workbench Module"
    destination: "API Gateway / Edge"
    description: "Fetches and mutates claim data via HTTPS (REST)"
  - source: "API Client Layer"
    destination: "API Gateway / Edge"
    description: "Proxies all REST requests via HTTPS (REST)"
  - source: "API Client Layer"
    destination: "Audit & Telemetry Interceptor"
    description: "Emits telemetry events via In-memory / SDK"
  - source: "Authentication Wrapper"
    destination: "State Management Store"
    description: "Manages session and UI state in-memory"
  - source: "Feature Modules"
    destination: "State Management Store"
    description: "Manages session and UI state in-memory"