# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization"
elements:
  - type: "person"
    name: "Customers"
    description: "Customers submitting claims."
  - type: "person"
    name: "Brokers"
    description: "Brokers assisting with claims."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff managing claims."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "Active Directory"
    description: "Enterprise identity provider."
  - type: "container"
    name: "API Gateway / Edge"
    technology: "Azure API Management"
    description: "Handles ingress, security, and routing."
  - type: "container"
    name: "Claims Web App"
    technology: "React on Azure Static Web Apps"
    description: "User interface for customers, brokers, and adjusters."
  - type: "container"
    name: "Claims Core Service"
    technology: "Java / Spring Boot on Azure App Service"
    description: "Backend services for processing claims."
  - type: "container"
    name: "Anti-Corruption Layer"
    technology: "Azure Functions"
    description: "Translates and decouples interactions with the legacy system."
  - type: "container"
    name: "Audit & Reconciliation Worker"
    technology: "Java / Spring Batch"
    description: "Background worker for batch audit and data reconciliation."
  - type: "container"
    name: "On-Premise Integration Agent"
    technology: "Integration Agent"
    description: "Ensures secure hybrid connectivity to the on-premise mainframe."
  - type: "container"
    name: "Modern Claims Database"
    technology: "Azure SQL Database"
    description: "Stores modern claim data with ACID compliance."
  - type: "container"
    name: "Read-Through Cache"
    technology: "Azure Cache for Redis"
    description: "Provides sub-2s performance caching."
  - type: "container"
    name: "Message Broker"
    technology: "Azure Service Bus"
    description: "Handles asynchronous messaging and event processing."
relationships:
  - source: "Customers"
    destination: "Claims Web App"
    description: "Accesses claim submission and management"
    technology: "HTTPS (REST)"
  - source: "Brokers"
    destination: "Claims Web App"
    description: "Accesses claim submission and management"
    technology: "HTTPS (REST)"
  - source: "Claims Adjusters"
    destination: "Claims Web App"
    description: "Accesses adjuster UI workflows"
    technology: "HTTPS (REST)"
  - source: "Claims Web App"
    destination: "API Gateway / Edge"
    description: "Sends API requests and authenticates"
    technology: "HTTPS (REST / OpenID Connect)"
  - source: "API Gateway / Edge"
    destination: "Claims Core Service"
    description: "Routes requests to backend domain logic"
    technology: "HTTPS (REST over internal VNet)"
  - source: "API Gateway / Edge"
    destination: "Active Directory"
    description: "Validates authentication and tokens"
    technology: "OIDC/JWT"
  - source: "Claims Core Service"
    destination: "Modern Claims Database"
    description: "Reads and writes claim records"
    technology: "TDS (SQL)"
  - source: "Claims Core Service"
    destination: "Read-Through Cache"
    description: "Caches frequently accessed data"
    technology: "Redis TCP"
  - source: "Claims Core Service"
    destination: "Message Broker"
    description: "Publishes and consumes asynchronous events"
    technology: "AMQP over TLS"
  - source: "On-Premise Integration Agent"
    destination: "Message Broker"
    description: "Connects hybrid messaging channels"
    technology: "outbound AMQP/HTTPS over TLS"
  - source: "On-Premise Integration Agent"
    destination: "Legacy Mainframe"
    description: "Communicates with legacy records"
    technology: "CICS/DB2 connectors"