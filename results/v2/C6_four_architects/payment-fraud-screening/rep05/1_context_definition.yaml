level: context
scope: "System Context diagram for Card-Not-Present Fraud Detection System"
system:
  name: "Card-Not-Present Fraud Detection System"
  description: "Screens card-not-present payment authorizations for fraud in real-time and provides a case management interface for analysts, ensuring sub-50ms latency while maintaining PCI-DSS Level 1 compliance and 7-year auditability."
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Reviews suspicious transactions and manages cases through the case management interface."
  - type: "externalSystem"
    name: "Payment Gateway / Core Ledger"
    description: "Sends payment authorizations for fraud screening."
  - type: "externalSystem"
    name: "Card Schemes / Tokenization Provider"
    description: "External card scheme and tokenization services."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Manages user authentication and identity."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Handles external notifications."
relationships:
  - source: "Payment Gateway / Core Ledger"
    destination: "Card-Not-Present Fraud Detection System"
    description: "Sends payment authorizations for fraud screening"
    technology: "gRPC (mTLS)"
  - source: "Fraud Analyst"
    destination: "Card-Not-Present Fraud Detection System"
    description: "Reviews suspicious transactions and manages cases"
    technology: "HTTPS"