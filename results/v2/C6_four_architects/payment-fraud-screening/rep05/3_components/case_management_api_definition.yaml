level: component
scope: "Component diagram for the Case Management API container"
parentContainer:
  name: "Case Management API"
elements:
  - type: "component"
    name: "API Controller Component"
    technology: "Python, FastAPI"
    description: "Forwards REST requests and handles API routing."
  - type: "component"
    name: "Masking & Tokenization Interceptor Component"
    technology: "Python"
    description: "In-process middleware hook that passes sanitized case data payloads."
  - type: "component"
    name: "IAM Authorization Component"
    technology: "Python, FastAPI Dependency Injection"
    description: "In-process dependency check for authorization."
  - type: "component"
    name: "Case Service Component"
    technology: "Python"
    description: "Manages suspicious cases and handles relational case state."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Python"
    description: "Writes tamper-evident audit trails."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Stores operational case data reliably with robust ACID compliance."
  - type: "component"
    name: "Amazon S3 Object Lock"
    technology: "Amazon S3 Object Lock"
    description: "Implements write-once-read-many (WORM) storage for tamper-evident auditability."
  - type: "component"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Decouples downstream event publishing for model retraining."
relationships:
  - source: "API Gateway"
    destination: "API Controller Component"
    description: "Forwards REST requests [HTTPS/REST]"
  - source: "API Controller Component"
    destination: "Masking & Tokenization Interceptor Component"
    description: "In-process middleware hook [Python native]"
  - source: "API Controller Component"
    destination: "IAM Authorization Component"
    description: "In-process dependency check [Python native]"
  - source: "Masking & Tokenization Interceptor Component"
    destination: "Case Service Component"
    description: "Passes sanitized case data payloads [Python native]"
  - source: "Case Service Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes relational case state [TCP/TLS via SQLAlchemy ORM]"
  - source: "Case Service Component"
    destination: "Amazon SQS"
    description: "Emits case resolution events [HTTPS/SQS API]"
  - source: "Audit Logger Component"
    destination: "Amazon S3 Object Lock"
    description: "Writes tamper-evident audit trails [HTTPS/S3 API]"