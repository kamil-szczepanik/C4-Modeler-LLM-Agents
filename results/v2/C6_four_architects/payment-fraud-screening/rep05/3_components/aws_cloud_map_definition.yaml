level: component
scope: "Component diagram for the AWS Cloud Map container"
parentContainer:
  name: "AWS Cloud Map"
elements:
  - type: "component"
    name: "Registry Manager"
    technology: "AWS SDK"
    description: "Manages service registration and metadata updates."
  - type: "component"
    name: "Health Check Prober"
    technology: "AWS Cloud Map Health Checker"
    description: "Continuously monitors the health of registered microservices."
  - type: "component"
    name: "Discovery API & DNS Resolver"
    technology: "Amazon Route 53 Private DNS"
    description: "Delivers sub-millisecond internal service discovery via DNS and API."
relationships:
  - source: "Registry Manager"
    destination: "Discovery API & DNS Resolver"
    description: "Updates service endpoints and routing records"
  - source: "Health Check Prober"
    destination: "Registry Manager"
    description: "Reports instance health status"