level: component
scope: "Component diagram for the AWS Lambda container"
parentContainer:
  name: "AWS Lambda"
elements:
  - type: "component"
    name: "SQS Event Consumer"
    technology: "Node.js (TypeScript)"
    description: "Consumes audit events from Amazon SQS for asynchronous processing."
  - type: "component"
    name: "Audit Normalizer"
    technology: "Node.js (TypeScript)"
    description: "Normalizes incoming audit event payloads."
  - type: "component"
    name: "Cryptographic Signer"
    technology: "Node.js (TypeScript)"
    description: "Orchestrates the cryptographic signing process for audit logs."
  - type: "component"
    name: "KMS Signer Client"
    technology: "Node.js (TypeScript) / AWS SDK v3"
    description: "Interacts with AWS KMS to generate cryptographic signatures."
  - type: "component"
    name: "S3 Storage Client"
    technology: "Node.js (TypeScript) / AWS SDK v3"
    description: "Manages persistence of signed audit logs to storage."
  - type: "component"
    name: "DLQ Error Handler"
    technology: "Node.js (TypeScript)"
    description: "Handles failed audit payloads by routing them to the Dead Letter Queue."
relationships:
  - source: "SQS Event Consumer"
    destination: "Audit Normalizer"
    description: "In-memory function call"
  - source: "Audit Normalizer"
    destination: "Cryptographic Signer"
    description: "In-memory function call"
  - source: "Cryptographic Signer"
    destination: "KMS Signer Client"
    description: "In-memory function call"
  - source: "KMS Signer Client"
    destination: "AWS KMS"
    description: "Requests cryptographic signature via HTTPS / AWS SigV4"
  - source: "Cryptographic Signer"
    destination: "S3 Storage Client"
    description: "In-memory function call"
  - source: "S3 Storage Client"
    destination: "Amazon S3 Object Lock"
    description: "Persists audit logs via HTTPS / AWS SigV4"
  - source: "SQS Event Consumer"
    destination: "Amazon SQS (DLQ)"
    description: "Sends failed audit payloads via HTTPS / AWS SigV4"