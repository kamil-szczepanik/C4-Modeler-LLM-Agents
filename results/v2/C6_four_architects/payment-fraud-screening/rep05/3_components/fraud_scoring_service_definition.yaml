level: component
scope: "Component diagram for the Fraud Scoring Service container"
parentContainer:
  name: "Fraud Scoring Service"
elements:
  - type: "component"
    name: "API Handler Component"
    technology: "Python, FastAPI"
    description: "Screens card-not-present payment authorizations in real-time, handling request validation and routing."
  - type: "component"
    name: "Feature Aggregator Component"
    technology: "Python, async Redis client"
    description: "Retrieves user profiling data and user velocity features."
  - type: "component"
    name: "Inference Engine Component"
    technology: "C-based ONNX Runtime via Python bindings"
    description: "Invokes ONNX model for probabilistic scoring to meet sub-50ms latency targets."
  - type: "component"
    name: "Rules Evaluator Component"
    technology: "Python, lightweight expression engine"
    description: "Evaluates hard-coded and dynamic business rules."
  - type: "component"
    name: "Audit Dispatcher Component"
    technology: "Python, boto3"
    description: "Dispatches payloads for asynchronous logging and publishes tamper-evident audit events."
  - type: "component"
    name: "Model & Rule Manager Component"
    technology: "Python, background thread/async task"
    description: "Fetches artifacts and updates active models and rules via thread-safe reference swap."
  - type: "container"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache (Redis)"
    description: "Stores low-latency feature states and velocity counters."
  - type: "container"
    name: "Amazon S3 Model Registry"
    technology: "Amazon S3"
    description: "Stores versioned ML models and JSON rules for zero-downtime hot-reloading."
  - type: "container"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Receives published tamper-evident audit events."
relationships:
  - source: "API Handler Component"
    destination: "Feature Aggregator Component"
    description: "Requests user velocity features [In-memory async call]"
  - source: "API Handler Component"
    destination: "Rules Evaluator Component"
    description: "Evaluates hard-coded and dynamic business rules [In-memory call]"
  - source: "API Handler Component"
    destination: "Inference Engine Component"
    description: "Invokes ONNX model for probabilistic scoring [In-memory C-binding call]"
  - source: "API Handler Component"
    destination: "Audit Dispatcher Component"
    description: "Dispatches payload for asynchronous logging [Non-blocking queue]"
  - source: "Model & Rule Manager Component"
    destination: "Amazon S3 Model Registry"
    description: "Fetches artifacts [HTTPS]"
  - source: "Model & Rule Manager Component"
    destination: "Inference Engine Component"
    description: "Updates active models/rules [Thread-safe reference swap]"
  - source: "Model & Rule Manager Component"
    destination: "Rules Evaluator Component"
    description: "Updates active models/rules [Thread-safe reference swap]"
  - source: "Feature Aggregator Component"
    destination: "Amazon ElastiCache (Redis)"
    description: "Retrieves user profiling data [TCP/RESP]"
  - source: "Audit Dispatcher Component"
    destination: "Amazon SQS"
    description: "Publishes tamper-evident audit events [HTTPS]"