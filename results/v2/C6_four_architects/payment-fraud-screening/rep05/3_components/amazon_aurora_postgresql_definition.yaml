level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL container"
parentContainer:
  name: "Amazon Aurora PostgreSQL"
elements:
  - type: "component"
    name: "Case Data Repository"
    technology: "PostgreSQL Tables"
    description: "Stores case management data, fraud analysis records, and audit logs."
  - type: "component"
    name: "Audit Log Storage"
    technology: "PostgreSQL Tables with S3 Export"
    description: "Maintains immutable audit records supporting 7-year retention compliance."
relationships:
  - source: "Case Management API"
    destination: "Case Data Repository"
    description: "Executes CRUD operations on cases via [TCP/TLS, PostgreSQL Wire Protocol]"
  - source: "Audit Log & Replication Daemon"
    destination: "Audit Log Storage"
    description: "Exports immutable audit logs to Amazon S3 Object Lock via [HTTPS/TLS]"