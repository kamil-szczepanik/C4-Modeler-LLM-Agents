level: component
scope: "Component diagram for the Amazon S3 Model Registry container"
parentContainer:
  name: "Amazon S3 Model Registry"
elements:
  - type: "component"
    name: "S3 Bucket & Versioning/Object Lock"
    technology: "Amazon S3"
    description: "Provides immutable storage, secure access control, and atomic versioning for fraud scoring models and rules with 7-year auditability."
  - type: "component"
    name: "S3 Event Notification to SQS Queue"
    technology: "Amazon SQS"
    description: "Triggers asynchronous deployment alerts upon new model uploads to prevent dropped reload signals during ECS Fargate scaling events."
  - type: "component"
    name: "Access Control & Encryption"
    technology: "AWS IAM & KMS SSE-S3"
    description: "Enforces least-privilege access and customer-managed encryption to satisfy PCI-DSS Level 1 compliance."
  - type: "component"
    name: "Model Metadata Manifest"
    technology: "JSON Manifest"
    description: "Implements lightweight atomic version pinning (`manifest.json`) for zero-downtime hot-reloading."
  - type: "component"
    name: "Staging and Production Prefixes"
    technology: "Amazon S3 Prefixes"
    description: "Logical separation for /staged and /production model binaries."
relationships:
  - source: "S3 Bucket & Versioning/Object Lock"
    destination: "S3 Event Notification to SQS Queue"
    description: "Triggers asynchronous deployment alerts upon new model uploads (HTTPS / S3 API)"
  - source: "Model Metadata Manifest"
    destination: "S3 Bucket & Versioning/Object Lock"
    description: "References version-pinned binaries stored in S3"
  - source: "Staging and Production Prefixes"
    destination: "S3 Bucket & Versioning/Object Lock"
    description: "Organizes model storage paths within the bucket"