level: container
scope: "Container diagram for Card-Not-Present Fraud Detection System"
system:
  name: "Card-Not-Present Fraud Detection System"
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Human reviewers managing suspicious transactions via UI."
  - type: "externalSystem"
    name: "Payment Gateway / Client"
    description: "External caller initiating payment authorizations."
  - type: "container"
    name: "AWS ALB"
    technology: "AWS Application Load Balancer"
    description: "Ingress load balancer handling gRPC/HTTP/2 traffic."
  - type: "container"
    name: "Fraud Scoring Service"
    technology: "Python, FastAPI, ONNX Runtime, Amazon ECS Fargate"
    description: "Scores payment authorizations for fraud in real-time."
  - type: "container"
    name: "Case Management API"
    technology: "Amazon ECS Fargate"
    description: "ECS Fargate service for analyst review workflows."
  - type: "container"
    name: "CloudFront / React SPA"
    technology: "Amazon CloudFront, React"
    description: "User interface for fraud analysts to manage reviews and cases."
  - type: "container"
    name: "API Gateway"
    technology: "Amazon API Gateway"
    description: "Gateway for analyst review traffic."
  - type: "container"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache Redis"
    description: "Low-latency feature store and cache."
  - type: "container"
    name: "Amazon S3 Model Registry"
    technology: "Amazon S3"
    description: "S3 bucket for zero-downtime model and rule hot-reloading."
  - type: "container"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Asynchronous messaging queue for audit processing."
  - type: "container"
    name: "AWS Lambda"
    technology: "AWS Lambda"
    description: "Audit processor function."
  - type: "container"
    name: "Amazon S3 Object Lock"
    technology: "Amazon S3 Object Lock"
    description: "Tamper-evident 7-year audit storage in Compliance Mode."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Operational data store for case management."
  - type: "container"
    name: "AWS Cloud Map"
    technology: "AWS Cloud Map"
    description: "Lightweight internal service discovery."
relationships:
  - source: "Payment Gateway / Client"
    destination: "AWS ALB"
    description: "Initiates payment authorizations"
    technology: "HTTPS/gRPC"
  - source: "AWS ALB"
    destination: "Fraud Scoring Service"
    description: "Routes scoring traffic"
    technology: "gRPC/HTTP/2 via AWS Cloud Map"
  - source: "Fraud Analysts"
    destination: "CloudFront / React SPA"
    description: "Accesses review UI"
    technology: "HTTPS"
  - source: "CloudFront / React SPA"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "Case Management API"
    description: "Forwards requests"
    technology: "HTTPS/REST"
  - source: "Fraud Scoring Service"
    destination: "Amazon ElastiCache (Redis)"
    description: "Retrieves and stores features"
    technology: "TCP/RESP"
  - source: "Fraud Scoring Service"
    destination: "Amazon S3 Model Registry"
    description: "Hot-reloads models and rules"
    technology: "HTTPS"
  - source: "Fraud Scoring Service"
    destination: "Amazon SQS"
    description: "Publishes audit events"
    technology: "HTTPS"
  - source: "Amazon SQS"
    destination: "AWS Lambda"
    description: "Triggers audit processing"
    technology: "Asynchronous"
  - source: "AWS Lambda"
    destination: "Amazon S3 Object Lock"
    description: "Stores audit logs"
    technology: "HTTPS"
  - source: "Case Management API"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes operational case data"
    technology: "TCP/TLS"