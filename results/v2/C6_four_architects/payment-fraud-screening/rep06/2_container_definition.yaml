level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Internal users responsible for reviewing and managing fraud cases."
  - type: "externalSystem"
    name: "Payment Gateway / Core Ledger"
    description: "External system that submits card-not-present payment authorizations."
  - type: "externalSystem"
    name: "AWS Cognito"
    description: "Identity Provider for authentication and user management."
  - type: "externalSystem"
    name: "AWS S3 Object Lock"
    description: "Tamper-evident WORM storage for 7-year audit retention."
  - type: "container"
    name: "API Gateway / Envoy"
    technology: "Envoy / HTTPS / TLS"
    description: "Ingress point handling TLS termination, routing, and fail-open circuit breaking."
  - type: "container"
    name: "Fraud Scoring Engine"
    technology: "Go / gRPC"
    description: "Core engine processing transactions for fraud within strict latency limits."
  - type: "container"
    name: "Case Management Backend"
    technology: "Java / Spring Boot"
    description: "Backend supporting enterprise analyst workflows and case management."
  - type: "container"
    name: "Model & Rule Registry Service"
    technology: "Python / FastAPI / S3"
    description: "Service managing models and zero-downtime rule updates."
  - type: "container"
    name: "Analyst UI"
    technology: "React / AWS S3 / CloudFront"
    description: "Single page application delivering the fraud analyst dashboard."
  - type: "container"
    name: "Asynchronous Audit Worker"
    technology: "Go / AWS Lambda"
    description: "Serverless worker handling asynchronous auditing and export to S3 Object Lock."
  - type: "container"
    name: "Redis Cluster / Amazon ElastiCache"
    technology: "Amazon ElastiCache (Redis)"
    description: "Low-latency feature store and in-memory cache."
  - type: "container"
    name: "PostgreSQL / Amazon Aurora"
    technology: "Amazon Aurora (PostgreSQL)"
    description: "Transactional data store for cases and rules."
  - type: "container"
    name: "Amazon SQS / SNS"
    technology: "Amazon SQS / SNS"
    description: "Asynchronous event bus for telemetry and auditing."
  - type: "container"
    name: "AWS Secrets Manager / Parameter Store"
    technology: "AWS Secrets Manager"
    description: "Configuration and secrets management supporting PCI-DSS compliance."
relationships:
  - source: "Payment Gateway / Core Ledger"
    destination: "API Gateway / Envoy"
    description: "Submits payment authorizations"
    technology: "HTTPS/JSON"
  - source: "API Gateway / Envoy"
    destination: "Fraud Scoring Engine"
    description: "Invokes fraud screening"
    technology: "gRPC"
  - source: "Fraud Scoring Engine"
    destination: "Redis Cluster / Amazon ElastiCache"
    description: "Queries feature data"
    technology: "TCP/TLS"
  - source: "Fraud Scoring Engine"
    destination: "Amazon SQS / SNS"
    description: "Publishes telemetry and audit events"
    technology: "SQS/SNS"
  - source: "Amazon SQS / SNS"
    destination: "Asynchronous Audit Worker"
    description: "Triggers audit event processing"
    technology: "AWS internal protocols"
  - source: "Asynchronous Audit Worker"
    destination: "AWS S3 Object Lock"
    description: "Writes tamper-evident audit logs"
    technology: "HTTPS"
  - source: "Fraud Scoring Engine"
    destination: "Model & Rule Registry Service"
    description: "Fetches compiled models"
    technology: "gRPC/polling"
  - source: "Fraud Analysts"
    destination: "Analyst UI"
    description: "Accesses case management dashboard"
    technology: "HTTPS / CloudFront"
  - source: "Analyst UI"
    destination: "AWS Cognito"
    description: "Authenticates users"
    technology: "OAuth2/OIDC (HTTPS)"
  - source: "Analyst UI"
    destination: "Case Management Backend"
    description: "Manages fraud cases and workflows"
    technology: "HTTPS/REST"
  - source: "Case Management Backend"
    destination: "PostgreSQL / Amazon Aurora"
    description: "Persists case data"
    technology: "TLS"