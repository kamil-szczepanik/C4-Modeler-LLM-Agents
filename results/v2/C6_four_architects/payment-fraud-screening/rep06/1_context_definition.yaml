level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Screens card-not-present payment authorizations for fraud at 3,000 TPS while managing analyst review cases, ensuring PCI-DSS Level 1 compliance, 7-year auditability, and sub-50ms latency within a 25,000 EUR monthly AWS budget."
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Internal users responsible for reviewing and managing fraud cases."
  - type: "externalSystem"
    name: "Payment Gateway / Core Ledger"
    description: "External system that submits card-not-present payment authorizations."
  - type: "externalSystem"
    name: "Identity Provider / IdP"
    description: "External identity provider used for user authentication."
  - type: "externalSystem"
    name: "Compliance Archive / AWS S3 Object Lock"
    description: "External storage providing WORM storage for tamper-evident 7-year auditability."
  - type: "container"
    name: "API Gateway / AWS ALB"
    description: "Container handling entry traffic and routing."
    technology: "AWS ALB / gRPC over TLS"
  - type: "container"
    name: "Fraud Scoring Engine"
    description: "Container executing real-time fraud screening decisions."
    technology: "AWS ECS Fargate"
  - type: "container"
    name: "Case Management Backend"
    description: "Container managing analyst review cases and rule metadata."
    technology: "AWS ECS Fargate"
  - type: "container"
    name: "AWS ElastiCache / Redis"
    description: "In-memory data store for feature stores and fallback circuit-breaking."
    technology: "AWS ElastiCache (Redis)"
  - type: "container"
    name: "Amazon Aurora Serverless v2 PostgreSQL"
    description: "Transactional database for case management and rule metadata."
    technology: "Amazon Aurora Serverless v2 (PostgreSQL)"
relationships:
  - source: "Payment Gateway / Core Ledger"
    destination: "API Gateway / AWS ALB"
    description: "Synchronous payment scoring requests"
    technology: "gRPC over TLS"
  - source: "Fraud Analysts"
    destination: "Identity Provider / IdP"
    description: "Authentication"
    technology: "HTTPS"
  - source: "Fraud Analysts"
    destination: "Case Management Backend"
    description: "Case reviews"
    technology: "HTTPS"
  - source: "Fraud Scoring Engine"
    destination: "AWS ElastiCache / Redis"
    description: "Feature lookup"
    technology: "In-memory TCP"
  - source: "Fraud Scoring Engine"
    destination: "Compliance Archive / AWS S3 Object Lock"
    description: "Asynchronous S3 Object Lock exports"
    technology: "AWS VPC Gateway Endpoints"