level: component
scope: "Component diagram for the Fraud Scoring Engine container"
parentContainer:
  name: "Fraud Scoring Engine"
elements:
  - type: "component"
    name: "gRPC Interface Controller"
    technology: "Go gRPC server"
    description: "Screens payment authorizations and exposes the gRPC interface."
  - type: "component"
    name: "Tokenization Filter"
    technology: "Go middleware utility"
    description: "Sanitizes inbound payment payloads."
  - type: "component"
    name: "Feature Aggregator"
    technology: "Go goroutines and channels"
    description: "Aggregates features for real-time evaluations."
  - type: "component"
    name: "Scoring Evaluator"
    technology: "Go with embedded WebAssembly / Starlark"
    description: "Evaluates scoring rules using embedded WebAssembly or Starlark."
  - type: "component"
    name: "Model Hot-Swapper"
    technology: "Go background worker"
    description: "Updates active model references via background worker."
  - type: "component"
    name: "Audit Event Publisher"
    technology: "Go buffered channel worker pool"
    description: "Emits decision payloads and metadata to audit streams."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Redis"
    description: "Provides fast in-memory feature data retrieval."
  - type: "component"
    name: "Amazon SQS / SNS"
    technology: "AWS SDK / HTTPS"
    description: "Handles asynchronous, decoupled audit event publishing."
relationships:
  - source: "gRPC Interface Controller"
    destination: "Tokenization Filter"
    description: "Sanitizes inbound payment payload [In-process Function Call]"
  - source: "Tokenization Filter"
    destination: "Feature Aggregator"
    description: "Forwards tokenized request context [In-process Function Call]"
  - source: "gRPC Interface Controller"
    destination: "Scoring Evaluator"
    description: "Passes features for scoring [In-process Function Call]"
  - source: "Feature Aggregator"
    destination: "Amazon ElastiCache (Redis)"
    description: "Queries feature data [TCP/TLS]"
  - source: "Model Hot-Swapper"
    destination: "Scoring Evaluator"
    description: "Updates active model reference [Thread-safe atomic pointer swap]"
  - source: "Scoring Evaluator"
    destination: "Audit Event Publisher"
    description: "Emits decision payload and metadata [Buffered Go Channel]"
  - source: "Audit Event Publisher"
    destination: "Amazon SQS / SNS"
    description: "Publishes audit events [AWS SDK / HTTPS]"