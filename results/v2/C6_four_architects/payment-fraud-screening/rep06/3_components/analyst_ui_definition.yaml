level: component
scope: "Component diagram for the Analyst UI container"
parentContainer:
  name: "Analyst UI"
elements:
  - type: "component"
    name: "React Single Page Application (SPA)"
    technology: "React / JavaScript / HTML / CSS"
    description: "Provides the user interface for fraud analysts to manage fraud cases and review alerts."
  - type: "component"
    name: "Static Asset Hosting"
    technology: "AWS S3"
    description: "Stores and serves the static build assets of the React SPA."
  - type: "component"
    name: "Content Delivery Network"
    technology: "Amazon CloudFront"
    description: "Distributes static assets globally with low latency over HTTPS."
relationships:
  - source: "Fraud Analysts"
    destination: "Content Delivery Network"
    description: "Accesses case management dashboard via HTTPS [CloudFront]"
  - source: "Content Delivery Network"
    destination: "Static Asset Hosting"
    description: "Fetches static web assets from"
  - source: "React Single Page Application (SPA)"
    destination: "API Gateway / Envoy"
    description: "Routes API calls via REST/JSON over HTTPS [TLS 1.3, JWT Bearer]"