level: component
scope: "Component diagram for the Asynchronous Audit Worker container"
parentContainer:
  name: "Asynchronous Audit Worker"
elements:
  - type: "component"
    name: "Event Consumer Component"
    technology: "Go / AWS Lambda"
    description: "Consumes messages from Amazon SQS."
  - type: "component"
    name: "Batch Processor Component"
    technology: "Go / AWS Lambda"
    description: "Passes batched SQS messages and delegates individual event formatting and hashing."
  - type: "component"
    name: "Audit Formatter Component"
    technology: "Go / AWS Lambda"
    description: "Handles individual event formatting and hashing, routing unprocessable payloads on failure."
  - type: "component"
    name: "S3 Exporter Component"
    technology: "Go / AWS Lambda"
    description: "Passes formatted and hashed audit batches and executes WORM-compliant storage operations."
  - type: "component"
    name: "DLQ Handler Component"
    technology: "Go / AWS Lambda"
    description: "Routes unprocessable audit payloads on failure and forwards dead-letter audit events."
relationships:
  - source: "Event Consumer Component"
    destination: "Batch Processor Component"
    description: "Passes batched SQS messages [Internal Function Call]"
  - source: "Batch Processor Component"
    destination: "Audit Formatter Component"
    description: "Delegates individual event formatting and hashing [Internal Function Call]"
  - source: "Batch Processor Component"
    destination: "S3 Exporter Component"
    description: "Passes formatted and hashed audit batches [Internal Function Call]"
  - source: "S3 Exporter Component"
    destination: "AWS S3 Object Lock"
    description: "Executes WORM-compliant storage operations [HTTPS / AWS SDK]"
  - source: "Audit Formatter Component"
    destination: "DLQ Handler Component"
    description: "Routes unprocessable audit payloads on failure [Internal Function Call]"
  - source: "DLQ Handler Component"
    destination: "Amazon SQS / SNS"
    description: "Forwards dead-letter audit events [HTTPS / AWS SDK]"