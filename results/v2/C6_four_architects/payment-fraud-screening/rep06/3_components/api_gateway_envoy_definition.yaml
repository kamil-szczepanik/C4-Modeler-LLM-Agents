level: component
scope: "Component diagram for the API Gateway / Envoy container"
parentContainer:
  name: "API Gateway / Envoy"
elements:
  - type: "component"
    name: "Listener & TLS Terminator"
    technology: "Envoy Listener"
    description: "Terminates inbound TLS connections and handles network-level entry for incoming payment authorizations and management requests."
  - type: "component"
    name: "Path-Based Router"
    technology: "Envoy Router"
    description: "Routes incoming requests to appropriate downstream services based on URL paths and traffic rules."
  - type: "component"
    name: "ext_authz"
    technology: "Envoy External Authorization Filter"
    description: "Performs external authorization checks on incoming requests to ensure security and compliance."
  - type: "component"
    name: "Redis Rate Limiter"
    technology: "Envoy Rate Limit Service Integration"
    description: "Checks and enforces rate limits and quotas using the Redis Cluster."
  - type: "component"
    name: "Circuit Breaker"
    technology: "Envoy Outlier Detection"
    description: "Protects downstream services by failing fast when error thresholds or latency spikes are detected."
  - type: "component"
    name: "Access Logger"
    technology: "Envoy Access Log Service"
    description: "Streams structured access logs and metrics to Amazon CloudWatch for observability and auditability."
relationships:
  - source: "Listener & TLS Terminator"
    destination: "Path-Based Router"
    description: "Passes decrypted traffic"
  - source: "Path-Based Router"
    destination: "ext_authz"
    description: "Validates request security"
  - source: "Path-Based Router"
    destination: "Redis Rate Limiter"
    description: "Checks rate limits"
  - source: "Path-Based Router"
    destination: "Circuit Breaker"
    description: "Wraps outbound calls"
  - source: "Path-Based Router"
    destination: "Access Logger"
    description: "Generates access logs"