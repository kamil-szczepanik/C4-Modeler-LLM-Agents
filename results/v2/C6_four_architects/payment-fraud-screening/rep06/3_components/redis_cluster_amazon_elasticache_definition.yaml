level: component
scope: "Component diagram for the Redis Cluster / Amazon ElastiCache container"
parentContainer:
  name: "Redis Cluster / Amazon ElastiCache"
elements:
  - type: "component"
    name: "Primary Shards"
    technology: "Redis v7.x"
    description: "Handles primary write operations for feature data, rate limits, and tokens."
  - type: "component"
    name: "Replica Shards"
    technology: "Redis v7.x"
    description: "Handles read scaling and high availability failover."
  - type: "component"
    name: "Cluster Manager (Redis Sentinel)"
    technology: "Redis Sentinel"
    description: "Monitors Redis instances and manages automatic failover."
  - type: "component"
    name: "In-Memory Token / Feature Index"
    technology: "Redis In-Memory Data Structure"
    description: "Stores low-latency features and sliding window rate limits for fraud scoring."
  - type: "component"
    name: "Sliding Window Rate Limiter"
    technology: "Amazon ElastiCache (Redis)"
    description: "Enforces velocity checks and request throttling."
relationships:
  - source: "Fraud Scoring Engine"
    destination: "In-Memory Token / Feature Index"
    description: "Queries feature data and executes velocity checks [Redis RESP / TCP/TLS]"
  - source: "Fraud Scoring Engine"
    destination: "Sliding Window Rate Limiter"
    description: "Validates transaction request rates [Redis RESP / TCP/TLS]"
  - source: "Cluster Manager (Redis Sentinel)"
    destination: "Primary Shards"
    description: "Monitors health and manages failover"
  - source: "Cluster Manager (Redis Sentinel)"
    destination: "Replica Shards"
    description: "Monitors health and manages replication"