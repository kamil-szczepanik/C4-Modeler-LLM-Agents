level: component
scope: "Component diagram for the Model & Rule Registry Service container"
parentContainer:
  name: "Model & Rule Registry Service"
elements:
  - type: "component"
    name: "Registry API Controller"
    technology: "Python / FastAPI"
    description: "Exposes endpoints for managing models and zero-downtime rule updates."
  - type: "component"
    name: "Model Compiler & Validator"
    technology: "Python"
    description: "Validates and compiles models before deployment."
  - type: "component"
    name: "Artifact Storage Manager"
    technology: "Python / S3"
    description: "Manages storage of model artifacts in compliance archive storage."
  - type: "component"
    name: "Distribution Coordinator"
    technology: "Python"
    description: "Coordinates distribution of rules and models to scoring engines."
  - type: "component"
    name: "Metadata Repository Client"
    technology: "Python"
    description: "Interacts with metadata repositories for tracking model states."
  - type: "component"
    name: "Hot Cache Manager"
    technology: "Python"
    description: "Manages in-memory caching for rapid rule and model retrieval."
  - type: "component"
    name: "Audit Event Emitter"
    technology: "Python"
    description: "Emits audit events for registry modifications."
relationships:
  - source: "Registry API Controller"
    destination: "Model Compiler & Validator"
    description: "Sends model payloads for validation and compilation"
  - source: "Model Compiler & Validator"
    destination: "Artifact Storage Manager"
    description: "Stores compiled artifacts"
  - source: "Artifact Storage Manager"
    destination: "Compliance Archive / AWS S3 Object Lock"
    description: "Stores immutable model artifacts [HTTPS / S3 API]"
  - source: "Registry API Controller"
    destination: "Distribution Coordinator"
    description: "Triggers distribution of new models/rules"
  - source: "Registry API Controller"
    destination: "Metadata Repository Client"
    description: "Persists and queries model metadata"
  - source: "Distribution Coordinator"
    destination: "Hot Cache Manager"
    description: "Updates cached active models and rules"
  - source: "Registry API Controller"
    destination: "Audit Event Emitter"
    description: "Emits audit events on configuration changes"