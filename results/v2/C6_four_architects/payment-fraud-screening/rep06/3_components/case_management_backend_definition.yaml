level: component
scope: "Component diagram for the Case Management Backend container"
parentContainer:
  name: "Case Management Backend"
elements:
  - type: "component"
    name: "Case Controller"
    technology: "Spring MVC"
    description: "Exposes REST endpoints for the analyst UI."
  - type: "component"
    name: "Case Workflow Service"
    technology: "Spring Service"
    description: "Manages business state transitions and writes audit events transactionally."
  - type: "component"
    name: "Case Repository"
    technology: "Spring Data JPA"
    description: "Persists case records transactionally to the database."
  - type: "component"
    name: "Masking & Authorization Interceptor"
    technology: "Spring Aspect/Filter"
    description: "Masks cardholder data dynamically for the analyst UI."
  - type: "component"
    name: "Outbox Event Publisher"
    technology: "Spring Transactional Outbox Pattern"
    description: "Dispatches signed audit payloads to messaging infrastructure."
  - type: "component"
    name: "Audit Publisher"
    technology: "Spring Cloud Stream / AWS SDK"
    description: "Publishes audit events using AWS SDK."
relationships:
  - source: "Case Controller"
    destination: "Analyst UI"
    description: "Exposes REST endpoints [HTTPS/REST]"
  - source: "Case Workflow Service"
    destination: "Case Repository"
    description: "Manages business state transitions [In-process]"
  - source: "Case Repository"
    destination: "PostgreSQL / Amazon Aurora"
    description: "Persists case records transactionally [JDBC / TLS]"
  - source: "Case Workflow Service"
    destination: "Outbox Table"
    description: "Writes audit events transactionally [JDBC / TLS]"
  - source: "Outbox Event Publisher"
    destination: "Amazon SQS / SNS"
    description: "Dispatches signed audit payloads [AWS SDK / HTTPS]"
  - source: "Masking Interceptor"
    destination: "Analyst UI"
    description: "Masks cardholder data dynamically [HTTPS/REST]"