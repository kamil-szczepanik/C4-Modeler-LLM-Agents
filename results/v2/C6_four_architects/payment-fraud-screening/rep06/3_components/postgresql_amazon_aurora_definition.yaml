level: component
scope: "Component diagram for the PostgreSQL / Amazon Aurora container"
parentContainer:
  name: "PostgreSQL / Amazon Aurora"
elements:
  - type: "component"
    name: "Case Repository Component"
    technology: "PostgreSQL relational tables with JSONB"
    description: "Manages analyst decisions and investigation notes."
  - type: "component"
    name: "Rule & Model Metadata Component"
    technology: "PostgreSQL"
    description: "Stores active rule definitions and version pointers."
  - type: "component"
    name: "Audit Ledger Component"
    technology: "PostgreSQL append-only tables with RLS and pgcrypto SHA-256 hashing"
    description: "Implements tamper-evident audit logs."
  - type: "component"
    name: "Connection Pooling & Routing Component"
    technology: "PgBouncer / RDS Proxy"
    description: "Controls connection limits and multiplexes connections."
  - type: "component"
    name: "Database Backup & PITR Component"
    technology: "AWS RDS Automated Snapshots and WAL archiving"
    description: "Handles automated snapshot lifecycles and Point-in-Time Recovery."
  - type: "component"
    name: "Read Replica Routing Component"
    technology: "Aurora PostgreSQL Read Replica endpoints"
    description: "Offloads analytical queries and rule metadata reads."
relationships:
  - source: "Case Management Backend"
    destination: "Case Repository Component"
    description: "Read/Write case states via SQL / PostgreSQL Wire Protocol over TLS."
  - source: "Model & Rule Registry Service"
    destination: "Read Replica Routing Component"
    description: "Queries rule metadata and metrics via SQL over TLS."
  - source: "Audit Ledger Component"
    destination: "Compliance Archive (AWS S3)"
    description: "Exports daily encrypted snapshots via AWS Internal Storage APIs over TLS."