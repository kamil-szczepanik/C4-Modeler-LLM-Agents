# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the AWS Secrets Manager / Parameter Store container"
parentContainer:
  name: "AWS Secrets Manager / Parameter Store"
elements:
  - type: "component"
    name: "Secrets Engine"
    technology: "AWS Secrets Manager"
    description: "Manages database credentials and tokens with automatic 30-day rotation."
  - type: "component"
    name: "Parameter Store"
    technology: "AWS Systems Manager Parameter Store"
    description: "Stores non-sensitive dynamic configurations using the advanced throughput tier."
  - type: "component"
    name: "Secrets Caching Component"
    technology: "AWS Secrets Manager Caching Library"
    description: "Provides client-side caching to maintain the 50ms P99 latency SLA."
  - type: "component"
    name: "Secrets Rotation Handler"
    technology: "AWS Lambda"
    description: "Connects to Secrets Manager and Amazon Aurora for automated 30-day credential rotation."
  - type: "component"
    name: "Audit Logging Bridge"
    technology: "AWS CloudTrail / Amazon S3 Object Lock"
    description: "Ensures tamper-evident, 7-year auditability of all secret access events."
  - type: "component"
    name: "Secret Versioning Manager"
    technology: "AWS Secrets Manager Staging Labels"
    description: "Manages secret versions and staging labels for secure rollouts."
  - type: "component"
    name: "Parameter Throughput Scaler"
    technology: "AWS Systems Manager Advanced Tier"
    description: "Supports up to 10,000 req/sec for dynamic configuration parameters."
relationships:
  - source: "Fraud Scoring Engine"
    destination: "Secrets Engine"
    description: "Retrieves secrets via AWS SDK v2 (HTTPS/TLS 1.3) with IAM least-privilege roles"
  - source: "Case Management Backend"
    destination: "Secrets Engine"
    description: "Retrieves parameters via AWS SDK v2 (HTTPS/TLS 1.3) with IAM least-privilege roles"
  - source: "Model & Rule Registry Service"
    destination: "Parameter Store"
    description: "Fetches cryptographic signing keys and dynamic parameters via HTTPS"
  - source: "Secrets Engine"
    destination: "Audit Logging Bridge"
    description: "Streams audit events via AWS CloudTrail"
  - source: "Parameter Store"
    destination: "Audit Logging Bridge"
    description: "Streams audit events via AWS CloudTrail"
  - source: "Secrets Rotation Handler"
    destination: "Secrets Engine"
    description: "Executes automated 30-day credential rotation via HTTPS"
  - source: "Secrets Rotation Handler"
    destination: "PostgreSQL / Amazon Aurora"
    description: "Updates database credentials during rotation via HTTPS"