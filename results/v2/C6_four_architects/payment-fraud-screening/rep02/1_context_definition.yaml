level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
  description: "Evaluates card-not-present payment authorizations for fraud and provides case management for human analysts."
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Human analysts who review cases and manage fraud workflows."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "Initiates payment authorizations and routes them to the screening system."
  - type: "externalSystem"
    name: "Card Networks & Tokenization Vault"
    description: "External networks and vaults handling card and token data."
  - type: "externalSystem"
    name: "Regulatory & Audit Authorities"
    description: "External entities requiring compliant and tamper-evident audit logs."
  - type: "externalSystem"
    name: "Core Banking / Ledger System"
    description: "Backend financial ledger system for core banking records."
  - type: "externalSystem"
    name: "ML Model Training Environment"
    description: "Environment used to train and update fraud detection machine learning models."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Provides authentication and identity management services."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "Real-Time Payment Fraud Screening"
    description: "Sends payment authorizations for fraud evaluation"
    technology: "gRPC over TLS 1.3"
  - source: "Fraud Analysts"
    destination: "Real-Time Payment Fraud Screening"
    description: "Accesses case management workflows and web UI"
    technology: "HTTPS over TLS 1.3 via AWS Client VPN or IAM"