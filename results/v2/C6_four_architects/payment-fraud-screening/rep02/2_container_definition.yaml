level: container
scope: "Container diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Human analysts who review cases and manage fraud workflows."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "Initiates payment authorizations and routes them to the screening system."
  - type: "container"
    name: "Fraud Analyst UI"
    technology: "React SPA via Amazon S3 / CloudFront"
    description: "Hosts secure single-page analyst interface."
  - type: "container"
    name: "API Gateway & Ingress"
    technology: "Java / Spring Cloud Gateway"
    description: "Handles secure public ingress and enforces PCI-DSS boundaries."
  - type: "container"
    name: "Real-Time Scoring Engine"
    technology: "Java / Spring Boot + ONNX"
    description: "Provides sub-50ms P99 latency scoring with embedded machine learning models."
  - type: "container"
    name: "Case Management Backend"
    technology: "Node.js / TypeScript"
    description: "Powers lightweight case management backend workflows."
  - type: "container"
    name: "Model & Rule Management Service"
    technology: "Python / FastAPI"
    description: "Manages zero-downtime model and rule updates."
  - type: "container"
    name: "Audit Worker"
    technology: "Node.js / Python worker"
    description: "Decouples scoring latency from durable audit logging."
  - type: "container"
    name: "Amazon Kinesis Data Streams"
    technology: "Amazon Kinesis"
    description: "Streams and decouples event data for durability and audit."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Provides tamper-evident append-only storage for 7-year audit requirements and scoring DB."
  - type: "container"
    name: "Amazon ElastiCache"
    technology: "Amazon ElastiCache (Redis)"
    description: "Delivers microsecond-latency feature lookups."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "API Gateway & Ingress"
    description: "Sends payment authorizations for fraud evaluation"
    technology: "HTTPS (REST/gRPC)"
  - source: "Fraud Analysts"
    destination: "Fraud Analyst UI"
    description: "Accesses case management workflows and web UI"
    technology: "HTTPS"
  - source: "Fraud Analyst UI"
    destination: "Case Management Backend"
    description: "Performs case reviews and workflow actions"
    technology: "HTTPS"
  - source: "API Gateway & Ingress"
    destination: "Real-Time Scoring Engine"
    description: "Forwards requests for real-time scoring"
    technology: "gRPC over HTTP/2"
  - source: "Real-Time Scoring Engine"
    destination: "Amazon ElastiCache"
    description: "Performs feature lookups"
    technology: "RESP over TCP"
  - source: "Real-Time Scoring Engine"
    destination: "Amazon Kinesis Data Streams"
    description: "Publishes scoring events and telemetry"
    technology: "HTTPS (AWS SDK)"
  - source: "Audit Worker"
    destination: "Amazon Aurora PostgreSQL"
    description: "Writes audit logs and screening history"
    technology: "TLS/TCP"
  - source: "Case Management Backend"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes case management data"
    technology: "TLS/TCP"
  - source: "Model & Rule Management Service"
    destination: "Real-Time Scoring Engine"
    description: "Updates models and rules"
    technology: "internal REST API over HTTPS"