level: component
scope: "Component diagram for the Case Management Backend container"
parentContainer:
  name: "Case Management Backend"
elements:
  - type: "component"
    name: "Case API Controller"
    technology: "Express.js / TypeScript"
    description: "Handles HTTP requests from the Fraud Analyst UI for case reviews and workflow actions."
  - type: "component"
    name: "Case Workflow Service"
    technology: "TypeScript"
    description: "Invokes business logic and orchestrates case workflows."
  - type: "component"
    name: "Data Access Repository"
    technology: "Prisma ORM / TypeScript"
    description: "Persists state changes and executes parameterized queries with optimistic locking."
  - type: "component"
    name: "Audit Logging Interceptor"
    technology: "TypeScript"
    description: "Dispatches tamper-evident audit events for compliance."
  - type: "component"
    name: "Tokenization Gateway Client"
    technology: "Axios / TypeScript"
    description: "Requests tokenized payloads via HTTPS/REST."
relationships:
  - source: "Case API Controller"
    destination: "Case Workflow Service"
    description: "Invokes business logic [In-memory function calls]"
  - source: "Case Workflow Service"
    destination: "Audit Logging Interceptor"
    description: "Dispatches audit events [Async/Sync method calls]"
  - source: "Case Workflow Service"
    destination: "Data Access Repository"
    description: "Persists state changes [TypeScript/Prisma]"
  - source: "Case Workflow Service"
    destination: "Tokenization Gateway Client"
    description: "Requests tokenized payload [HTTPS/REST]"