level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL container"
parentContainer:
  name: "Amazon Aurora PostgreSQL"
elements:
  - type: "component"
    name: "Primary Writer Database"
    technology: "Amazon Aurora PostgreSQL with pgcrypto"
    description: "Handles relational storage for primary write workloads, including case management and audit logging data."
  - type: "component"
    name: "Read Replicas"
    technology: "Amazon Aurora PostgreSQL Read Replicas"
    description: "Provides scalable read-only database instances to support high-throughput analytical queries and read workloads."
relationships:
  - source: "Primary Writer Database"
    destination: "Read Replicas"
    description: "Replicates transactional data via streaming replication"