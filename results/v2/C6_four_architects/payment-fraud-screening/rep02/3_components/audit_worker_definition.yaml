level: component
scope: "Component diagram for the Audit Worker container"
parentContainer:
  name: "Audit Worker"
elements:
  - type: "component"
    name: "Audit Event Consumer"
    technology: "Python, boto3"
    description: "Polls streaming events and manages stream offsets."
  - type: "component"
    name: "Stream Offset Manager"
    technology: "Python, AWS SDK"
    description: "Tracks Kinesis shard iterator positions."
  - type: "component"
    name: "Tamper-Evident Signer"
    technology: "Python, cryptography"
    description: "Generates cryptographic hashes for audit payloads."
  - type: "component"
    name: "KMS Integration Wrapper"
    technology: "Python, boto3"
    description: "Interfaces with AWS KMS for envelope encryption."
  - type: "component"
    name: "Audit Persistence Adapter"
    technology: "Python, psycopg2"
    description: "Handles database writes for audit logs."
  - type: "component"
    name: "Dead Letter Queue (DLQ) Handler"
    technology: "Python"
    description: "Captures failed payloads and routes them to SQS."
  - type: "component"
    name: "Amazon Kinesis Data Streams"
    technology: "AWS Kinesis"
    description: "Streaming platform for audit events."
  - type: "component"
    name: "Amazon SQS (DLQ)"
    technology: "Amazon SQS"
    description: "Dead letter queue for failed audit events."
  - type: "component"
    name: "AWS KMS"
    technology: "AWS KMS"
    description: "Provides signing keys and cryptographic operations."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "PostgreSQL"
    description: "Stores durable and compliant audit records."
relationships:
  - source: "Audit Event Consumer"
    destination: "Amazon Kinesis Data Streams"
    description: "Polls and commits stream offsets [HTTPS]"
  - source: "Audit Event Consumer"
    destination: "Tamper-Evident Signer"
    description: "Passes raw audit payload [In-memory]"
  - source: "Audit Event Consumer"
    destination: "Amazon SQS (DLQ)"
    description: "Forwards failed audit events [HTTPS]"
  - source: "Tamper-Evident Signer"
    destination: "AWS KMS"
    description: "Requests signing keys/operations [HTTPS/TLS]"
  - source: "Tamper-Evident Signer"
    destination: "Audit Persistence Adapter"
    description: "Passes signed record [In-memory]"
  - source: "Audit Persistence Adapter"
    destination: "Amazon Aurora PostgreSQL"
    description: "Inserts audit log [TLS/TCP]"