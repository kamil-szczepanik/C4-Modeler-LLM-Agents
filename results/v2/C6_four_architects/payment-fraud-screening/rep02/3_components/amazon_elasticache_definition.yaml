level: component
scope: "Component diagram for the Amazon ElastiCache container"
parentContainer:
  name: "Amazon ElastiCache"
elements:
  - type: "component"
    name: "Feature Store Cache"
    technology: "Redis Cluster"
    description: "Delivers microsecond-latency feature lookups and sliding-window velocity tracking."
  - type: "component"
    name: "Blacklist / Denylist Registry"
    technology: "Redis In-Memory Set / Hash"
    description: "Performs fast membership checks for fraud screening."
  - type: "component"
    name: "Session & Idempotency Store"
    technology: "Redis Strings with TTL"
    description: "Validates request tokens and locks."
  - type: "component"
    name: "Real-Time Model Feature Cache"
    technology: "Redis Sorted Sets"
    description: "Caches real-time model features for scoring."
  - type: "component"
    name: "Tokenized Entity Cache"
    technology: "Redis Encrypted Hash"
    description: "Stores and fetches token mappings securely over TLS."
relationships:
  - source: "Real-Time Scoring Engine"
    destination: "Feature Store Cache"
    description: "Fetches sliding-window user velocity metrics via RESP over TCP"
  - source: "Real-Time Scoring Engine"
    destination: "Blacklist / Denylist Registry"
    description: "Fast membership checks via RESP over TCP"
  - source: "API Gateway & Ingress"
    destination: "Session & Idempotency Store"
    description: "Validates request tokens and locks via RESP over TCP"
  - source: "Audit Worker / Model Service"
    destination: "Feature Store Cache"
    description: "Updates real-time aggregations via RESP over TCP"
  - source: "Real-Time Scoring Engine"
    destination: "Tokenized Entity Cache"
    description: "Fetches token mappings via RESP over TLS"