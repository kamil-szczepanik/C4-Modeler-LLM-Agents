level: component
scope: "Component diagram for the Model & Rule Management Service container"
parentContainer:
  name: "Model & Rule Management Service"
elements:
  - type: "component"
    name: "API Controller"
    technology: "FastAPI / Python"
    description: "FastAPI endpoints handling administrative requests over HTTPS."
  - type: "component"
    name: "Rule & Model Validator"
    technology: "Python"
    description: "Validates rule syntax and ONNX model compatibility."
  - type: "component"
    name: "Sandbox Evaluator"
    technology: "Python"
    description: "Tests models against historical regression fixtures."
  - type: "component"
    name: "Version Registry"
    technology: "Amazon Aurora PostgreSQL / SQL/ORM"
    description: "Manages semantic versioning and metadata backed by Amazon Aurora PostgreSQL."
  - type: "component"
    name: "Artifact Bundler"
    technology: "Python"
    description: "Packages models, configurations, and rules into immutable archives."
  - type: "component"
    name: "Distribution Publisher"
    technology: "Amazon S3 / Amazon SNS"
    description: "Publishes rule sets and ONNX binaries via Amazon S3 and Amazon SNS."
  - type: "component"
    name: "Audit Event Emitter"
    technology: "Python / Amazon SQS"
    description: "Emits cryptographically signed audit logs via Amazon SQS."
  - type: "component"
    name: "Real-Time Scoring Engine"
    technology: "External Container"
    description: "Receives distributed rule sets and ONNX binaries."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Relational Database"
    description: "Provides robust relational storage for version metadata and test fixtures."
  - type: "component"
    name: "Audit Worker"
    technology: "External Component"
    description: "Processes tamper-evident audit logs from Amazon SQS."
relationships:
  - source: "API Controller"
    destination: "Rule & Model Validator"
    description: "In-memory function call"
  - source: "Rule & Model Validator"
    destination: "Version Registry"
    description: "SQL/ORM over TLS"
  - source: "Rule & Model Validator"
    destination: "Sandbox Evaluator"
    description: "In-memory function call"
  - source: "Sandbox Evaluator"
    destination: "Amazon Aurora PostgreSQL"
    description: "Read historical test fixtures via SQL/ORM over TLS"
  - source: "Sandbox Evaluator"
    destination: "Artifact Bundler"
    description: "In-memory function call"
  - source: "Artifact Bundler"
    destination: "Distribution Publisher"
    description: "In-memory function call"
  - source: "Distribution Publisher"
    destination: "Real-Time Scoring Engine"
    description: "AWS SNS / HTTPS webhook"
  - source: "API Controller"
    destination: "Audit Event Emitter"
    description: "Internal Event bus"
  - source: "Version Registry"
    destination: "Audit Event Emitter"
    description: "Internal Event bus"
  - source: "Audit Event Emitter"
    destination: "Audit Worker"
    description: "Amazon SQS over TLS"