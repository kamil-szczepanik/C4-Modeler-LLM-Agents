level: component
scope: "Component diagram for the Amazon Kinesis Data Streams container"
parentContainer:
  name: "Amazon Kinesis Data Streams"
elements:
  - type: "component"
    name: "Shard Routing & Ingestion Service"
    technology: "AWS-managed ingress"
    description: "AWS-managed ingress handling partition key hashing."
  - type: "component"
    name: "Partition Log & Storage Engine"
    technology: "AWS-managed log storage"
    description: "AWS-managed immutable, append-only log storage."
  - type: "component"
    name: "Enhanced Fan-Out Consumer Endpoints"
    technology: "KCL, HTTP/2"
    description: "Dedicated HTTP/2 throughput channels via KCL."
  - type: "component"
    name: "Data Retention & Replay Controller"
    technology: "AWS-managed component"
    description: "AWS-managed component enforcing log retention."
  - type: "component"
    name: "Real-Time Scoring Engine"
    technology: "HTTPS (AWS SDK)"
    description: "Publishes events via HTTPS (AWS SDK)."
  - type: "component"
    name: "Audit Worker"
    technology: "HTTP/2 (KCL)"
    description: "Consumes event streams via HTTP/2 (KCL)."
relationships:
  - source: "Real-Time Scoring Engine"
    destination: "Shard Routing & Ingestion Service"
    description: "Publishes payment events [HTTPS (AWS SDK)]"
  - source: "Partition Log & Storage Engine"
    destination: "Data Retention & Replay Controller"
    description: "Manages time-based log rotation [AWS Internal API]"
  - source: "Partition Log & Storage Engine"
    destination: "Enhanced Fan-Out Consumer Endpoints"
    description: "Feeds real-time event streams [AWS Internal Protocol]"
  - source: "Enhanced Fan-Out Consumer Endpoints"
    destination: "Audit Worker"
    description: "Delivers push-based event streams [HTTP/2 (KCL)]"