level: component
scope: "Component diagram for the Real-Time Scoring Engine container"
parentContainer:
  name: "Real-Time Scoring Engine"
elements:
  - type: "component"
    name: "Scoring API Controller"
    technology: "Java / Spring MVC"
    description: "Ingests payment authorization requests via gRPC over HTTP/2."
  - type: "component"
    name: "Feature Aggregator"
    technology: "Java / Spring Data"
    description: "Fetches user velocity profiles and features from ElastiCache."
  - type: "component"
    name: "Inference Engine"
    technology: "Java + ONNX Runtime"
    description: "Executes machine learning models in-process via JNI for ultra-low latency."
  - type: "component"
    name: "Decision Evaluator"
    technology: "Java"
    description: "Evaluates raw scores to determine fraud risk and manage analyst reviews."
  - type: "component"
    name: "Model Hot-Swapper"
    technology: "Java"
    description: "Updates model references via in-memory pointer swap."
  - type: "component"
    name: "Audit Event Publisher"
    technology: "Java / AWS SDK"
    description: "Enqueues and publishes batched audit events to Kinesis."
  - type: "component"
    name: "Circuit Breaker & Fallback Handler"
    technology: "Resilience4j"
    description: "Wraps execution with circuit breaking and fallbacks to prevent upstream payment blocking."
relationships:
  - source: "Scoring API Controller"
    destination: "Feature Aggregator"
    description: "Fetches features [Direct Method Call]"
  - source: "Feature Aggregator"
    destination: "Amazon ElastiCache"
    description: "Fetches user velocity profiles [RESP over TCP]"
  - source: "Scoring API Controller"
    destination: "Inference Engine"
    description: "Invokes model inference [In-memory ONNX Runtime API]"
  - source: "Inference Engine"
    destination: "Decision Evaluator"
    description: "Passes raw scores [Direct Method Call]"
  - source: "Model & Rule Management Service"
    destination: "Model Hot-Swapper"
    description: "Pushes model binaries [gRPC / HTTPS]"
  - source: "Model Hot-Swapper"
    destination: "Inference Engine"
    description: "Updates model reference [In-memory pointer swap]"
  - source: "Decision Evaluator"
    destination: "Audit Event Publisher"
    description: "Enqueues logs [ConcurrentQueue]"
  - source: "Audit Event Publisher"
    destination: "Amazon Kinesis Data Streams"
    description: "Publishes batched events [AWS SDK over HTTPS]"
  - source: "Circuit Breaker & Fallback Handler"
    destination: "Scoring API Controller"
    description: "Wraps execution [AOP Interceptor]"
  - source: "API Gateway & Ingress"
    destination: "Scoring API Controller"
    description: "Ingests requests [gRPC over HTTP/2]"