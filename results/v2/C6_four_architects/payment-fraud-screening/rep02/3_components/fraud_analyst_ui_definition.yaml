level: component
scope: "Component diagram for the Fraud Analyst UI container"
parentContainer:
  name: "Fraud Analyst UI"
elements:
  - type: "component"
    name: "React SPA Root Component"
    technology: "React, Zustand, Tailwind CSS"
    description: "Main application entry point providing the single-page application structure for fraud analysts."
  - type: "component"
    name: "Case Management View"
    technology: "React, TanStack Table"
    description: "UI component for browsing, sorting, and filtering suspicious transactions and review cases."
  - type: "component"
    name: "Review Decision Form"
    technology: "React, Axios"
    description: "Form component used by analysts to submit decisions on suspicious transactions."
  - type: "component"
    name: "Rule Management Dashboard"
    technology: "React, Tailwind CSS"
    description: "Interface allowing fraud analysts to send rule update payloads and manage detection rules."
relationships:
  - source: "React SPA Root Component"
    destination: "Case Management View"
    description: "Renders"
  - source: "React SPA Root Component"
    destination: "Review Decision Form"
    description: "Renders"
  - source: "React SPA Root Component"
    destination: "Rule Management Dashboard"
    description: "Renders"
  - source: "Case Management View"
    destination: "Case Management Backend"
    description: "Fetches cases and submits review decisions [HTTPS / JSON REST]"
  - source: "Review Decision Form"
    destination: "Case Management Backend"
    description: "Submits review decisions [HTTPS / JSON REST]"
  - source: "Rule Management Dashboard"
    destination: "Model & Rule Management Service"
    description: "Sends rule update payloads [HTTPS / JSON REST]"
  - source: "React SPA Root Component"
    destination: "API Gateway & Ingress"
    description: "Transmits secured requests and audit telemetry [HTTPS / JSON REST]"