level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Processes card-not-present payment authorizations in AWS to detect fraud and support analyst reviews under strict latency and compliance constraints."
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "System users for case management and fraud reviews."
  - type: "externalSystem"
    name: "Payment Gateway / Core Ledger"
    description: "Source of authorization requests."
  - type: "externalSystem"
    name: "Card Schemes / Issuer 3DS Directory Servers"
    description: "Provides EMVCo 3DS 2.x APIs."
  - type: "externalSystem"
    name: "ML Feature Store / Threat Intelligence Provider"
    description: "External IP and device fingerprinting APIs."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "IdP for authentication and RBAC."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Email/SMS alerts."
  - type: "externalSystem"
    name: "Model Training & Experimentation Environment"
    description: "Amazon SageMaker Studio for out-of-band model development and zero-downtime updates."
  - type: "externalSystem"
    name: "AWS CloudFront & ALB"
    description: "Perimeter ingress and DDoS mitigation."
  - type: "externalSystem"
    name: "AWS KMS & S3 Object Lock"
    description: "Cryptographic audit and immutable 7-year storage."
relationships:
  - source: "Payment Gateway / Core Ledger"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Ingress of authorization requests"
    technology: "gRPC over HTTP/2 with mTLS"
  - source: "Fraud Analysts"
    destination: "AWS CloudFront & ALB"
    description: "Ingress for case management and review"
    technology: "HTTPS (TLS 1.3) with AWS WAF"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Card Schemes / Issuer 3DS Directory Servers"
    description: "Outbound egress for 3DS verification"
    technology: "HTTPS"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "ML Feature Store / Threat Intelligence Provider"
    description: "Outbound egress for feature enrichment"
    technology: "HTTPS"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "AWS KMS & S3 Object Lock"
    description: "Tamper-evident 7-year audit logging and encryption"
    technology: "AWS IAM policies"
  - source: "Model Training & Experimentation Environment"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Secure, signed model artifact transfer"
    technology: "AWS S3 Cross-Account Policies"