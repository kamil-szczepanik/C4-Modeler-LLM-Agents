level: component
scope: "Component diagram for the Scoring Engine Container container"
parentContainer:
  name: "Scoring Engine Container"
elements:
  - type: "component"
    name: "API Handler Component"
    technology: "Go, net/http / gRPC"
    description: "Routes external authorization traffic and handles incoming API requests."
  - type: "component"
    name: "Sanitization & Tokenization Guard Component"
    technology: "Go"
    description: "Sanitizes input and interacts with the tokenization proxy for card data."
  - type: "component"
    name: "Feature Fetcher Component"
    technology: "Go concurrency primitives"
    description: "Retrieves real-time features concurrently for fraud evaluation."
  - type: "component"
    name: "Circuit Breaker & Fallback Component"
    technology: "Go"
    description: "Handles errors and provides fallback mechanisms for inference calls."
  - type: "component"
    name: "Inference Engine Component"
    technology: "C++ via cgo, ONNX Runtime"
    description: "Executes compiled fraud scoring models in-memory for microsecond-level latency."
  - type: "component"
    name: "Model Loader Component"
    technology: "Go"
    description: "Hot-swaps models in-memory via pointer swaps."
  - type: "component"
    name: "Decision Explainer Component"
    technology: "Go"
    description: "Explains decisions and passes structs to the audit component."
  - type: "component"
    name: "Audit & Persistence Component"
    technology: "Go, AWS SDK"
    description: "Asynchronously emits events and writes hot state and audit logs."
  - type: "component"
    name: "AWS Application Load Balancer (ALB)"
    technology: "AWS ALB"
    description: "Routes external authorization traffic via HTTPS/gRPC."
  - type: "component"
    name: "Tokenization Proxy Container"
    technology: "AWS Nitro Enclaves"
    description: "Isolates tokenization to achieve PCI-DSS Level 1 compliance."
  - type: "component"
    name: "ML Feature Store"
    technology: "ML Feature Store"
    description: "Stores and provides real-time features."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Stores hot state."
  - type: "component"
    name: "Amazon S3 Object Lock"
    technology: "Amazon S3 Object Lock"
    description: "Stores tamper-evident audit logs."
relationships:
  - source: "AWS Application Load Balancer (ALB)"
    destination: "API Handler Component"
    description: "Routes external authorization traffic [HTTPS/gRPC]"
  - source: "API Handler Component"
    destination: "Sanitization & Tokenization Guard Component"
    description: "Internal Go call"
  - source: "Sanitization & Tokenization Guard Component"
    destination: "Tokenization Proxy Container"
    description: "Tokenizes card data [gRPC/mTLS over internal VPC]"
  - source: "Feature Fetcher Component"
    destination: "ML Feature Store"
    description: "Retrieves real-time features [gRPC]"
  - source: "Feature Fetcher Component"
    destination: "Circuit Breaker & Fallback Component"
    description: "Go error handling / interface call"
  - source: "Circuit Breaker & Fallback Component"
    destination: "Inference Engine Component"
    description: "Passes feature vector [Go function call]"
  - source: "Model Loader Component"
    destination: "Inference Engine Component"
    description: "Hot-swaps models [In-memory pointer swap]"
  - source: "Inference Engine Component"
    destination: "Decision Explainer Component"
    description: "In-memory Go struct passing"
  - source: "Decision Explainer Component"
    destination: "Audit & Persistence Component"
    description: "Asynchronous event emission via Go channel"
  - source: "Audit & Persistence Component"
    destination: "Amazon DynamoDB"
    description: "Writes hot state [AWS SDK]"
  - source: "Audit & Persistence Component"
    destination: "Amazon S3 Object Lock"
    description: "Writes tamper-evident audit logs [AWS SDK]"