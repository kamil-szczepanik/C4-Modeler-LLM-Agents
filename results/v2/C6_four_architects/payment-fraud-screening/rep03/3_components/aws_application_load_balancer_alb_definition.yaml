level: component
scope: "Component diagram for the AWS Application Load Balancer (ALB) container"
parentContainer:
  name: "AWS Application Load Balancer (ALB)"
elements:
  - type: "component"
    name: "Listener Component"
    technology: "AWS ALB Listener"
    description: "Routes external authorization traffic and interacts with the WAF and Routing Rules Engine."
  - type: "component"
    name: "Routing Rules Engine"
    technology: "Routing Rules Engine"
    description: "Internal handoff to route traffic between backend containers, scoring engines, and tokenization proxies."
  - type: "component"
    name: "Health Check & Circuit Breaker Component"
    technology: "Health Check & Circuit Breaker Component"
    description: "Performs active health probes on backend services."
  - type: "component"
    name: "WAF & Security Filter Component"
    technology: "AWS WAF"
    description: "Inspects headers and payloads for security filtering and OWASP Top 10 protection."
  - type: "component"
    name: "Access Logging & Telemetry Component"
    technology: "Access Logging & Telemetry Component"
    description: "Emits metadata asynchronously and stores audit logs."
  - type: "component"
    name: "Target Group Manager"
    technology: "Target Group Manager"
    description: "Resolves backend ECS tasks and manages connection pools."
relationships:
  - source: "Listener Component"
    destination: "WAF & Security Filter Component"
    description: "Inspects headers and payloads [In-Memory]"
  - source: "Listener Component"
    destination: "Routing Rules Engine"
    description: "Internal handoff [In-Memory]"
  - source: "Routing Rules Engine"
    destination: "Access Logging & Telemetry Component"
    description: "Emits metadata asynchronously [In-Memory/Queue]"
  - source: "Routing Rules Engine"
    destination: "Target Group Manager"
    description: "Resolves backend ECS tasks [In-Memory]"
  - source: "Health Check & Circuit Breaker Component"
    destination: "Target Group Manager"
    description: "Performs active health probes [HTTP GET]"
  - source: "Access Logging & Telemetry Component"
    destination: "Amazon S3 Object Lock"
    description: "Stores audit logs [HTTPS]"