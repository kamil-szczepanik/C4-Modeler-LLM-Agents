level: component
scope: "Component diagram for the Case Management Backend Container container"
parentContainer:
  name: "Case Management Backend Container"
elements:
  - type: "component"
    name: "Case Controller"
    technology: "Node.js, TypeScript, Express"
    description: "Handles HTTP/REST requests from the AWS Application Load Balancer for case management."
  - type: "component"
    name: "Case Service"
    technology: "Node.js, TypeScript"
    description: "Implements business logic for fraud case evaluation, review workflows, and analyst operations."
  - type: "component"
    name: "Data Access Layer"
    technology: "Node.js, TypeScript, AWS SDK"
    description: "Manages read and write operations to Amazon DynamoDB using VPC Endpoints."
  - type: "component"
    name: "Tokenization Client"
    technology: "Node.js, TypeScript, gRPC"
    description: "Communicates securely with the Tokenization Proxy Container via mTLS over internal VPC."
relationships:
  - source: "Case Controller"
    destination: "Case Service"
    description: "Delegates requests"
  - source: "Case Service"
    destination: "Data Access Layer"
    description: "Persists and retrieves case data"
  - source: "Case Service"
    destination: "Tokenization Client"
    description: "Requests tokenization services"
  - source: "Tokenization Client"
    destination: "Tokenization Proxy Container"
    description: "gRPC over internal VPC, mTLS"
  - source: "Data Access Layer"
    destination: "Amazon DynamoDB"
    description: "Read/Write cases, VPC Endpoints"