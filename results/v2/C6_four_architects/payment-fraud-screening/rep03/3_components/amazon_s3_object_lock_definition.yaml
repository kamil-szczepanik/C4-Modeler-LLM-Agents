level: component
scope: "Component diagram for the Amazon S3 Object Lock container"
parentContainer:
  name: "Amazon S3 Object Lock"
elements:
  - type: "component"
    name: "Object Writer"
    technology: "AWS SDK, HTTPS"
    description: "Writes decision payloads and human review audit trails into the storage layer."
  - type: "component"
    name: "Lifecycle Management"
    technology: "AWS SDK, HTTPS"
    description: "Configures transition of objects to S3 Glacier Deep Archive."
  - type: "component"
    name: "Audit Verification"
    technology: "AWS SDK, HTTPS"
    description: "Reads and verifies object integrity for compliance and audit retention."
  - type: "component"
    name: "Access Control & Compliance Policy Manager"
    technology: "AWS IAM / AWS SDK, HTTPS"
    description: "Configures bucket compliance parameters and enforces server-side encryption via AWS KMS."
  - type: "component"
    name: "Metadata Indexer"
    technology: "S3 Event Notifications, AWS SDK, HTTPS"
    description: "Triggers event notifications and persists audit metadata pointers to Amazon DynamoDB."
relationships:
  - source: "Object Writer"
    destination: "AWS S3 Storage Layer"
    description: "Persists immutable objects [AWS SDK, HTTPS]"
  - source: "Lifecycle Management"
    destination: "AWS S3 Storage Layer"
    description: "Configures transition to S3 Glacier Deep Archive [AWS SDK, HTTPS]"
  - source: "Audit Verification"
    destination: "AWS S3 Storage Layer"
    description: "Reads and verifies object integrity [AWS SDK, HTTPS]"
  - source: "Access Control & Compliance Policy Manager"
    destination: "AWS S3 Storage Layer"
    description: "Configures bucket compliance parameters [AWS IAM / AWS SDK, HTTPS]"
  - source: "Access Control & Compliance Policy Manager"
    destination: "AWS KMS"
    description: "Enforces server-side encryption [AWS SDK, HTTPS]"
  - source: "AWS S3 Storage Layer"
    destination: "Metadata Indexer"
    description: "Triggers event notifications [S3 Event Notifications, HTTPS]"
  - source: "Metadata Indexer"
    destination: "Amazon DynamoDB"
    description: "Persists audit metadata pointers [AWS SDK, HTTPS]"