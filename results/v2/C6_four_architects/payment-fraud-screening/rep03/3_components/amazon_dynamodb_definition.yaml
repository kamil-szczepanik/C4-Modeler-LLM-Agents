level: component
scope: "Component diagram for the Amazon DynamoDB container"
parentContainer:
  name: "Amazon DynamoDB"
elements:
  - type: "component"
    name: "Hot State Table Module"
    technology: "DynamoDB provisioned capacity table"
    description: "Stores transaction velocity counters and card profiles."
  - type: "component"
    name: "Case Management Table Module"
    technology: "DynamoDB on-demand capacity table"
    description: "Stores analyst investigation cases and audit logs."
  - type: "component"
    name: "DynamoDB Streams Processor"
    technology: "AWS Lambda function"
    description: "Captures mutation events for downstream audit export."
  - type: "component"
    name: "Audit Ledger Archive Module"
    technology: "Amazon S3 with Object Lock (Compliance Mode)"
    description: "Provides immutable 7-year retention."
  - type: "component"
    name: "IAM Fine-Grained Access Policy Module"
    technology: "AWS IAM"
    description: "Enforces least-privilege attribute-based access control (ABAC)."
  - type: "component"
    name: "Global Table Replication Module"
    technology: "DynamoDB Global Tables"
    description: "Ensures multi-AZ resilience in eu-west-1."
  - type: "component"
    name: "Time-To-Live (TTL) Expiry Module"
    technology: "Native DynamoDB background process"
    description: "Purges transient records."
  - type: "component"
    name: "DynamoDB Point-in-Time Recovery (PITR) Module"
    technology: "Continuous backup module"
    description: "Provides continuous backup for investigation logs."
relationships:
  - source: "Scoring Engine Container"
    destination: "Hot State Table Module"
    description: "Reads/Writes velocity state via AWS SDK (TCP/443 via VPC Endpoint)."
  - source: "Case Management Backend Container"
    destination: "Case Management Table Module"
    description: "Reads/Writes case data via AWS SDK (TCP/443)."
  - source: "Hot State Table Module"
    destination: "DynamoDB Streams Processor"
    description: "Triggers audit logging via DynamoDB Streams."
  - source: "DynamoDB Streams Processor"
    destination: "Audit Ledger Archive Module"
    description: "Flushes encrypted mutation logs via AWS SDK (HTTPS)."
  - source: "Case Management Table Module"
    destination: "AWS KMS"
    description: "Encrypts data at rest via AWS KMS CMK (Envelope Encryption)."
  - source: "IAM Fine-Grained Access Policy Module"
    destination: "Hot State Table Module"
    description: "Secures access boundaries via IAM Policies."
  - source: "Hot State Table Module"
    destination: "Time-To-Live (TTL) Expiry Module"
    description: "Automatically purges expired records via Native DynamoDB TTL background process."
  - source: "Case Management Table Module"
    destination: "DynamoDB Point-in-Time Recovery (PITR) Module"
    description: "Continuously backs up logs via DynamoDB PITR."