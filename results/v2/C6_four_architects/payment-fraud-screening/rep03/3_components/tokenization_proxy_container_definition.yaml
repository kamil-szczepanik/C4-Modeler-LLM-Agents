level: component
scope: "Component diagram for the Tokenization Proxy Container container"
parentContainer:
  name: "Tokenization Proxy Container"
elements:
  - type: "component"
    name: "API Router"
    technology: "Rust (Hyper/Tokio)"
    description: "Handles gRPC request termination over vsock."
  - type: "component"
    name: "Tokenization Core"
    technology: "Rust"
    description: "Manages ephemeral AES-GCM DEKs, moka in-memory LRU cache, and AWS KMS integration."
  - type: "component"
    name: "Audit Logger"
    technology: "Rust"
    description: "Generates and forwards cryptographic hashes for tamper-evident logging."
  - type: "component"
    name: "Health & Attestation Monitor"
    technology: "Rust"
    description: "Manages cryptographic attestation and vsock health checks."
  - type: "component"
    name: "Parent ECS Task"
    technology: "AWS ECS"
    description: "Orchestrator managing network and storage handoffs."
relationships:
  - source: "Scoring Engine Container"
    destination: "API Router"
    description: "Sends cleartext PAN for tokenization/detokenization via gRPC over VSOCK."
  - source: "Tokenization Core"
    destination: "AWS KMS"
    description: "Performs envelope encryption via parent VPC endpoint using HTTPS (TLS 1.3)."
  - source: "Audit Logger"
    destination: "Parent ECS Task"
    description: "Streams tamper-evident audit hashes for S3 Object Lock ingestion via gRPC over VSOCK."