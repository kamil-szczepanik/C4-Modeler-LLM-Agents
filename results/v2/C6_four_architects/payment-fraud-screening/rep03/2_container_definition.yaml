level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "System users for case management and fraud reviews."
  - type: "externalSystem"
    name: "Payment Gateway / Core Ledger"
    description: "Source of authorization requests."
  - type: "externalSystem"
    name: "ML Feature Store / Threat Intelligence Provider"
    description: "External feature store for scoring enrichment."
  - type: "container"
    name: "AWS Application Load Balancer (ALB)"
    technology: "AWS ALB Circuit Breaker"
    description: "Edge-level fail-open mechanism routing external authorization and analyst traffic."
  - type: "container"
    name: "Scoring Engine Container"
    technology: "Go, ONNX Runtime, AWS ECS Fargate"
    description: "Screens card-not-present payment authorizations within milliseconds using embedded C++ scoring."
  - type: "container"
    name: "Case Management Backend Container"
    technology: "Node.js, TypeScript, AWS ECS Fargate"
    description: "Manages suspicious payment reviews and investigation workflows."
  - type: "container"
    name: "Tokenization Proxy Container"
    technology: "AWS Nitro Enclaves"
    description: "Provides hardware-level isolation for tokenization to ensure PCI-DSS compliance and protect card data."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Stores hot state and investigation data."
  - type: "container"
    name: "Amazon S3 Object Lock"
    technology: "Amazon S3 Object Lock"
    description: "Compliance-mode storage ensuring tamper-evident 7-year audit retention."
relationships:
  - source: "Fraud Analysts"
    destination: "AWS Application Load Balancer (ALB)"
    description: "Interact with Case Management Backend via AWS ALB"
    technology: "HTTPS"
  - source: "Payment Gateway / Core Ledger"
    destination: "AWS Application Load Balancer (ALB)"
    description: "Routes external authorization traffic"
    technology: "HTTPS/gRPC"
  - source: "AWS Application Load Balancer (ALB)"
    destination: "Scoring Engine Container"
    description: "Routes external authorization traffic to Scoring Engine"
    technology: "HTTPS/gRPC"
  - source: "Scoring Engine Container"
    destination: "ML Feature Store / Threat Intelligence Provider"
    description: "Communicates with external Feature Stores"
    technology: "gRPC"
  - source: "Scoring Engine Container"
    destination: "Amazon DynamoDB"
    description: "Writes hot state"
    technology: "AWS SDK"
  - source: "Scoring Engine Container"
    destination: "Amazon S3 Object Lock"
    description: "Writes audit logs"
    technology: "AWS SDK"
  - source: "Case Management Backend Container"
    destination: "Amazon DynamoDB"
    description: "Reads and writes investigation data"
    technology: "VPC Endpoints"