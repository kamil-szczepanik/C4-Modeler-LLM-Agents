level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "User reviewing suspicious cases via a Web Browser."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "External system sending authorization requests via REST/HTTPS (HTTP/2)."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External authentication and RBAC provider using OIDC/OAuth2 over HTTPS."
  - type: "externalSystem"
    name: "ML Training Platform"
    description: "External offline system supplying scoring models via Amazon S3."
  - type: "container"
    name: "AWS Application Load Balancer (ALB)"
    technology: "AWS ALB"
    description: "Routes incoming traffic from payment gateway and analyst frontend to internal services."
  - type: "container"
    name: "Fraud Scoring Engine"
    technology: "Java / Spring Boot, AWS ECS Fargate, embedded ONNX/LightGBM"
    description: "Scores authorizations in under 50 milliseconds."
  - type: "container"
    name: "Case Management Service"
    technology: "Node.js / Python, AWS ECS Fargate"
    description: "Provides case management workflows and operations for fraud analysts."
  - type: "container"
    name: "Feature Store / Cache"
    technology: "Amazon ElastiCache Redis & Amazon DynamoDB"
    description: "Provides low-latency feature lookups and session state."
  - type: "container"
    name: "Transactional Database"
    technology: "Amazon Aurora PostgreSQL"
    description: "Utilized for relational case management transactions."
  - type: "container"
    name: "Audit Storage"
    technology: "Amazon S3 with Object Lock"
    description: "Tamper-evident 7-year audit log storage satisfying PCI-DSS."
  - type: "container"
    name: "Rule/Model Artifact Repository"
    technology: "Amazon S3"
    description: "Stores rule and model artifacts for the scoring engine."
  - type: "container"
    name: "Asynchronous Messaging"
    technology: "Amazon SQS & Amazon SNS"
    description: "Handles asynchronous messaging and notifications between services."
  - type: "container"
    name: "Analyst Frontend"
    technology: "Amazon S3 + Amazon CloudFront SPA"
    description: "Single page application for fraud analysts to review cases."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "AWS Application Load Balancer (ALB)"
    description: "Sends synchronous authorization scoring requests"
    technology: "REST/HTTPS (HTTP/2)"
  - type: "Fraud Analyst"
    destination: "Analyst Frontend"
    description: "Accesses case management interface"
    technology: "HTTPS"
  - type: "Analyst Frontend"
    destination: "AWS Application Load Balancer (ALB)"
    description: "API requests for case management"
    technology: "REST/HTTPS (JSON over HTTP/2)"
  - type: "AWS Application Load Balancer (ALB)"
    destination: "Fraud Scoring Engine"
    description: "Forwards authorization requests"
    technology: "HTTP/2"
  - type: "AWS Application Load Balancer (ALB)"
    destination: "Case Management Service"
    description: "Forwards analyst API requests"
    technology: "REST/HTTPS (JSON over HTTP/2)"
  - type: "Fraud Scoring Engine"
    destination: "Feature Store / Cache"
    description: "Performs low-latency feature lookups and state management"
    technology: "TCP/TLS"
  - type: "Fraud Scoring Engine"
    destination: "Rule/Model Artifact Repository"
    description: "Fetches rule and model artifacts"
    technology: "HTTPS (TLS 1.3)"
  - type: "Fraud Scoring Engine"
    destination: "Asynchronous Messaging"
    description: "Publishes scoring events and asynchronous data"
    technology: "AWS SDK (HTTPS/TLS 1.3)"
  - type: "Asynchronous Messaging"
    destination: "Case Management Service"
    description: "Delivers queued events for case processing"
    technology: "AWS SDK"
  - type: "Case Management Service"
    destination: "Transactional Database"
    description: "Persists case management transactions"
    technology: "TCP/TLS"
  - type: "Case Management Service"
    destination: "Audit Storage"
    description: "Writes tamper-evident audit logs"
    technology: "AWS SDK (HTTPS/TLS 1.3)"
  - type: "Case Management Service"
    destination: "Asynchronous Messaging"
    description: "Publishes notifications"
    technology: "AWS SDK (HTTPS/TLS 1.3)"
  - type: "Analyst Frontend"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OIDC/OAuth2 over HTTPS"
  - type: "Case Management Service"
    destination: "Identity Provider (IdP)"
    description: "Validates authentication tokens"
    technology: "OIDC/OAuth2 over HTTPS"
  - type: "ML Training Platform"
    destination: "Rule/Model Artifact Repository"
    description: "Uploads trained model artifacts"
    technology: "HTTPS/S3"