level: component
scope: "Component diagram for the Analyst Frontend container"
parentContainer:
  name: "Analyst Frontend"
elements:
  - type: "component"
    name: "Auth & Session Manager Component"
    technology: "React / TypeScript, Zustand / Redux"
    description: "Manages authentication state, short-lived JWTs, and RBAC visibility."
  - type: "component"
    name: "Case Dashboard & Queue Component"
    technology: "React / TypeScript"
    description: "Enables fraud analysts to review suspicious payment cases."
  - type: "component"
    name: "Decision & Audit Inspector Component"
    technology: "React / TypeScript"
    description: "Inspects explainability payloads and decision details."
  - type: "component"
    name: "Rule & Model Management Console Component"
    technology: "React / TypeScript"
    description: "Manages fraud rules and model configurations."
  - type: "component"
    name: "Audit Trail Viewer Component"
    technology: "React / TypeScript"
    description: "Supports 7-year auditability and tamper-evident compliance tracking."
  - type: "component"
    name: "API Gateway Client / HTTP Interceptor Component"
    technology: "TypeScript, Axios / Fetch"
    description: "Handles secure HTTPS / REST and WebSocket communication using short-lived JWTs."
  - type: "component"
    name: "Rule Simulation & Testing Sandbox Component"
    technology: "React / TypeScript"
    description: "Provides a sandbox for simulating and testing fraud rules."
  - type: "component"
    name: "Router & State Container Component"
    technology: "React Router, Zustand / Redux"
    description: "Manages client-side routing, global state, and strict Content Security Policies (CSP)."
relationships:
  - source: "Auth & Session Manager Component"
    destination: "Case Management Service"
    description: "Authenticates requests using short-lived JWTs"
  - source: "API Gateway Client / HTTP Interceptor Component"
    destination: "Case Management Service"
    description: "Communicates via HTTPS / REST (JSON) and WebSockets"
  - source: "Case Dashboard & Queue Component"
    destination: "API Gateway Client / HTTP Interceptor Component"
    description: "Fetches case data"
  - source: "Decision & Audit Inspector Component"
    destination: "API Gateway Client / HTTP Interceptor Component"
    description: "Fetches explainability payloads"
  - source: "Rule & Model Management Console Component"
    destination: "API Gateway Client / HTTP Interceptor Component"
    description: "Manages rules and models"
  - source: "Audit Trail Viewer Component"
    destination: "API Gateway Client / HTTP Interceptor Component"
    description: "Retrieves audit logs"
  - source: "Rule Simulation & Testing Sandbox Component"
    destination: "API Gateway Client / HTTP Interceptor Component"
    description: "Simulates and tests rules"