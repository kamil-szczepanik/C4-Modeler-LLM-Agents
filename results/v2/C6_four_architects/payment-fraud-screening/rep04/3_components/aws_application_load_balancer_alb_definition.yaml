level: component
scope: "Component diagram for the AWS Application Load Balancer (ALB) container"
parentContainer:
  name: "AWS Application Load Balancer (ALB)"
elements:
  - type: "component"
    name: "AWS WAF Rule Evaluator"
    technology: "AWS WAF"
    description: "Inspects incoming HTTP/2 traffic for malicious patterns, SQL injection, and DDoS threats at the edge."
  - type: "component"
    name: "TLS Termination Listener"
    technology: "AWS Certificate Manager (ACM) / HTTPS/2"
    description: "Terminates TLS 1.3 connections from the Payment Gateway / Acquirer and handles secure routing."
  - type: "component"
    name: "Route Router"
    technology: "AWS ALB Routing Engine"
    description: "Forwards validated scoring requests to the Fraud Scoring Engine via internal VPC and AWS Cloud Map."
relationships:
  - source: "TLS Termination Listener"
    destination: "AWS WAF Rule Evaluator"
    description: "Passes inspected traffic for security rule evaluation"
  - source: "AWS WAF Rule Evaluator"
    destination: "Route Router"
    description: "Passes validated traffic to routing rules"
  - source: "Route Router"
    destination: "Fraud Scoring Engine"
    description: "Routes scoring requests [HTTP/2 over internal VPC via AWS Cloud Map]"