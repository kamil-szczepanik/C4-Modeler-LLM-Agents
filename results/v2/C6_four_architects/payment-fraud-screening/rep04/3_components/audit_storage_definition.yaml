level: component
scope: "Component diagram for the Audit Storage container"
parentContainer:
  name: "Audit Storage"
elements:
  - type: "component"
    name: "Audit Ingestion API"
    technology: "AWS Lambda (Python)"
    description: "Receives audit payloads and coordinates secure writes to object storage and indexing."
  - type: "component"
    name: "Object Lock Manager"
    technology: "Amazon S3 (Glacier Flexible Retrieval / Compliance Mode)"
    description: "Enforces WORM storage and 7-year tamper-evident retention for audit objects."
  - type: "component"
    name: "Audit Indexer & Hash Verifier"
    technology: "Amazon DynamoDB and AWS Lambda"
    description: "Computes cryptographic hashes and maintains query indexes for audit data."
  - type: "component"
    name: "Audit Query Service"
    technology: "AWS Lambda (Python)"
    description: "Handles secure compliance reporting and retrieves audit trails."
  - type: "component"
    name: "Compliance Guardrails & IaC"
    technology: "Terraform/CloudFormation with AWS Config and AWS KMS"
    description: "Automates infrastructure deployment and enforces security configurations."
relationships:
  - source: "Fraud Scoring Engine / Case Management Service"
    destination: "Audit Ingestion API"
    description: "Sends decision payloads via AWS SDK (HTTPS/TLS 1.3)."
  - source: "Audit Ingestion API"
    destination: "Object Lock Manager"
    description: "Writes immutable audit objects via AWS SDK (S3 PutObject with Legal Hold/Retention)."
  - source: "Audit Ingestion API"
    destination: "Audit Indexer & Hash Verifier"
    description: "Stores audit metadata and cryptographic hashes via AWS SDK (HTTPS)."
  - source: "Fraud Analyst / Compliance & Audit Archive"
    destination: "Audit Query Service"
    description: "Requests audit trails via HTTPS/TLS 1.3."
  - source: "Audit Query Service"
    destination: "Audit Indexer & Hash Verifier"
    description: "Resolves query metadata via AWS SDK."
  - source: "Audit Query Service"
    destination: "Object Lock Manager"
    description: "Fetches raw immutable payload data via AWS SDK."
  - source: "Compliance & Audit Archive"
    destination: "Object Lock Manager & Audit Indexer & Hash Verifier"
    description: "Reads historical logs and queries indexes via AWS SDK (HTTPS/TLS 1.3)."