level: component
scope: "Component diagram for the Asynchronous Messaging container"
parentContainer:
  name: "Asynchronous Messaging"
elements:
  - type: "component"
    name: "Event Publisher Component"
    technology: "AWS SDK"
    description: "Dispatches asynchronous audit and scoring events."
  - type: "component"
    name: "Notification Dispatcher Component"
    technology: "Amazon SNS"
    description: "Fans out messages securely to queues."
  - type: "component"
    name: "Dead-Letter Queue (DLQ) Handler"
    technology: "AWS SQS"
    description: "Archives unprocessable or poisoned messages for long-term compliance retention."
  - type: "component"
    name: "Queue Consumer Routing Component"
    technology: "AWS SDK"
    description: "Delivers review payloads and routes messages to consumers."
relationships:
  - source: "Event Publisher Component"
    destination: "Notification Dispatcher Component"
    description: "Publishes encrypted payloads [AWS KMS SSE, AWS API]"
  - source: "Notification Dispatcher Component"
    destination: "Queue Consumer Routing Component"
    description: "Fans out messages securely [AWS internal]"
  - source: "Dead-Letter Queue (DLQ) Handler"
    destination: "Audit Storage"
    description: "Archives unprocessable or poisoned messages for long-term compliance retention [AWS SDK via HTTPS/TLS 1.3]"