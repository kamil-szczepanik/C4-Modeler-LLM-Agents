level: component
scope: "Component diagram for the Transactional Database container"
parentContainer:
  name: "Transactional Database"
elements:
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "AWS RDS PostgreSQL, Multi-AZ, pgcrypto"
    description: "Primary relational database storing case management records, review states, workflow assignments, and an append-only audit ledger."
  - type: "component"
    name: "Case Management Store Schema"
    technology: "Relational Tables"
    description: "Stores analyst cases, review states, and workflow assignments."
  - type: "component"
    name: "Audit Ledger Schema"
    technology: "Append-only Tables with pgcrypto"
    description: "Maintains tamper-evident logs for compliance and auditing."
  - type: "component"
    name: "Database Connection Pooler (PgBouncer)"
    technology: "PgBouncer"
    description: "Manages high-concurrency connection spikes from ECS Fargate tasks."
  - type: "component"
    name: "Row-Level Security (RLS) Policies"
    technology: "PostgreSQL RLS"
    description: "Enforces data isolation and least-privilege access at the database engine level."
  - type: "component"
    name: "Database Migration Manager"
    technology: "Flyway/Liquibase"
    description: "Manages automated schema evolution via CI/CD."
  - type: "component"
    name: "Transparent Data Encryption (TDE) / KMS Integration"
    technology: "AWS KMS"
    description: "Secures storage volumes and audit schemas using AWS KMS-managed keys."
  - type: "component"
    name: "Aurora Read Replica"
    technology: "PostgreSQL Read Replica"
    description: "Hot standby instance used to offload read-heavy case searches."
  - type: "component"
    name: "Backup and Retention Controller"
    technology: "AWS Backup"
    description: "Enforces point-in-time recovery (PITR) and 7-year retention."
relationships:
  - source: "Case Management Service"
    destination: "Database Connection Pooler (PgBouncer)"
    description: "Executes scoped CRUD operations and read-only queries via [TCP/TLS]."
  - source: "Audit Consumer Service"
    destination: "Database Connection Pooler (PgBouncer)"
    description: "Batch-writes decision audit logs into the Audit Ledger Schema via [TCP/TLS]."
  - source: "Amazon Aurora PostgreSQL"
    destination: "Transparent Data Encryption (TDE) / KMS Integration"
    description: "Encrypts storage volumes and audit records via [AWS API]."
  - source: "Amazon Aurora PostgreSQL"
    destination: "Backup and Retention Controller"
    description: "Triggers automated snapshots and PITR logs via [AWS API]."