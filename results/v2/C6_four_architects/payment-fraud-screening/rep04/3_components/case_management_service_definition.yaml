level: component
scope: "Component diagram for the Case Management Service container"
parentContainer:
  name: "Case Management Service"
elements:
  - type: "component"
    name: "Case API Controller"
    technology: "NestJS / Node.js"
    description: "Manages review workflows and handles HTTP requests from the Analyst Frontend."
  - type: "component"
    name: "Case Management Service Core"
    technology: "NestJS / Node.js"
    description: "Implements business logic for case processing, security interceptors, and data sanitization."
  - type: "component"
    name: "Messaging Consumer & Publisher"
    technology: "AWS SDK"
    description: "Polls SQS for queued review events and publishes analyst feedback to SNS/SQS for model retraining."
relationships:
  - source: "Case API Controller"
    destination: "Case Management Service Core"
    description: "Delegates workflow requests [In-process / TypeScript]"
  - source: "Messaging Consumer & Publisher"
    destination: "Case Management Service Core"
    description: "Triggers case creation and state updates [In-process / TypeScript]"
  - source: "Case Management Service Core"
    destination: "Transactional Database (Aurora PostgreSQL)"
    description: "Persists case states [TCP/Postgres, TLS]"
  - source: "Case Management Service Core"
    destination: "Audit Storage (Amazon S3 Object Lock)"
    description: "Stores tamper-evident decision and audit logs [HTTPS / AWS SDK]"
  - source: "Messaging Consumer & Publisher"
    destination: "Asynchronous Messaging (SNS/SQS)"
    description: "Publishes analyst feedback for model retraining [AWS SDK / HTTPS]"