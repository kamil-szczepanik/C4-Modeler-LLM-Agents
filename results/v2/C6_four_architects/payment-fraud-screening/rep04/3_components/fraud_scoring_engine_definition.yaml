level: component
scope: "Component diagram for the Fraud Scoring Engine container"
parentContainer:
  name: "Fraud Scoring Engine"
elements:
  - type: "component"
    name: "API Controller"
    technology: "Spring WebFlux"
    description: "Manages HTTP/2 ingress and timeouts."
  - type: "component"
    name: "Feature Aggregator"
    technology: "Jedis Client"
    description: "Queries Amazon ElastiCache Redis and Amazon DynamoDB for real-time velocity metrics."
  - type: "component"
    name: "Inference Executor"
    technology: "Microsoft ONNX Runtime"
    description: "Executes embedded LightGBM models."
  - type: "component"
    name: "Decision Explainer"
    technology: "Native Java"
    description: "Generates SHAP-lite feature attributions synchronously."
  - type: "component"
    name: "Audit Logger"
    technology: "Spring Events & Amazon SQS Publisher"
    description: "Emits immutable decision records."
  - type: "component"
    name: "Model & Rule Hot-Reloader"
    technology: "Custom File Watcher"
    description: "Polls Amazon S3 for dynamic in-memory model swapping."
  - type: "component"
    name: "Circuit Breaker & Fallback Manager"
    technology: "Resilience4j"
    description: "Enforces sub-millisecond degradation policies."
relationships:
  - source: "AWS Application Load Balancer (ALB)"
    destination: "API Controller"
    description: "Receives authorization requests via HTTP/2 over TLS."
  - source: "API Controller"
    destination: "Circuit Breaker & Fallback Manager"
    description: "Wraps scoring invocation in-memory."
  - source: "Circuit Breaker & Fallback Manager"
    destination: "Feature Aggregator"
    description: "Fetches user and card velocity features via TCP/Redis."
  - source: "Feature Aggregator"
    destination: "Inference Executor"
    description: "Passes assembled feature vectors via in-memory execution."
  - source: "API Controller"
    destination: "Inference Executor"
    description: "Passes assembled feature vectors via in-memory execution."
  - source: "Model & Rule Hot-Reloader"
    destination: "Rule/Model Artifact Repository"
    description: "Polls for model binaries and rule artifacts via HTTPS."
  - source: "Inference Executor"
    destination: "Decision Explainer"
    description: "Forwards raw scores and feature contributions in-memory."
  - source: "Decision Explainer"
    destination: "Audit Logger"
    description: "Submits enriched decision records asynchronously via Spring Events."
  - source: "Audit Logger"
    destination: "Asynchronous Messaging"
    description: "Publishes audit payloads via HTTPS."