level: component
scope: "Component diagram for the Feature Store / Cache container"
parentContainer:
  name: "Feature Store / Cache"
elements:
  - type: "component"
    name: "In-Memory Cache"
    technology: "Amazon ElastiCache Redis OSS"
    description: "Delivers ultra-low latency real-time rolling aggregates and stores hot velocity aggregates."
  - type: "component"
    name: "Feature Metadata Store"
    technology: "Amazon DynamoDB"
    description: "Stores user profiles and static feature vectors with point-in-time recovery and pre-computed profile features."
relationships:
  - source: "In-Memory Cache"
    destination: "Feature Metadata Store"
    description: "Synchronizes cached metrics with persistent feature profiles"