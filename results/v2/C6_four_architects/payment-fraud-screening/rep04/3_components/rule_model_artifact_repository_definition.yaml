level: component
scope: "Component diagram for the Rule/Model Artifact Repository container"
parentContainer:
  name: "Rule/Model Artifact Repository"
elements:
  - type: "component"
    name: "Model Artifact Storage"
    technology: "Amazon S3"
    description: "Stores versioned ONNX and LightGBM model binaries uploaded by the ML Training Platform."
  - type: "component"
    name: "Artifact Versioning and Metadata Index"
    technology: "S3 Object Versioning & AWS Lambda"
    description: "Manages metadata, checksums, and version history for scoring rules and ML models."
relationships:
  - source: "Artifact Versioning and Metadata Index"
    destination: "Model Artifact Storage"
    description: "Organizes and indexes"