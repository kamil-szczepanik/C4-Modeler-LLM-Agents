level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Evaluates card-not-present payment authorizations for fraud, providing sub-millisecond scoring decisions and case management workflows for analysts."
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "User reviewing suspicious cases via a Web Browser."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "External system sending authorization requests via REST/gRPC over HTTPS."
  - type: "externalSystem"
    name: "Card Networks / Tokenization Vault"
    description: "External system providing cardholder data and token resolution."
  - type: "externalSystem"
    name: "Compliance & Audit Archive"
    description: "External WORM storage using AWS S3 Object Lock."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External authentication and RBAC provider using OAuth2/OIDC."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External alerting service using AWS SES/SNS."
  - type: "externalSystem"
    name: "ML Training Platform"
    description: "External offline system supplying scoring models."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Synchronous authorization scoring requests"
    technology: "HTTPS/gRPC"
  - source: "Fraud Analyst"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Case management and rule updates"
    technology: "HTTPS"
  - source: "ML Training Platform"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Model artifact synchronization"
    technology: "HTTPS/S3"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Compliance & Audit Archive"
    description: "Immutable audit record streaming"
    technology: "AWS SDK/TLS"