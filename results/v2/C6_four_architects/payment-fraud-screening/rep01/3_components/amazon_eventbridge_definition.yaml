level: component
scope: "Component diagram for the Amazon EventBridge container"
parentContainer:
  name: "Amazon EventBridge"
elements:
  - type: "component"
    name: "Default Event Bus"
    technology: "Amazon EventBridge"
    description: "Receives and routes system-wide fraud and case events."
  - type: "component"
    name: "Fraud Event Rules"
    technology: "EventBridge Rules"
    description: "Evaluates and filters incoming events to direct them to appropriate targets."
  - type: "component"
    name: "Case Management Target"
    technology: "AWS internal SQS"
    description: "Dispatches filtered review events to the case management backend."
  - type: "component"
    name: "Audit Archive Target"
    technology: "Kinesis Data Firehose / HTTPS"
    description: "Streams decision logs for tamper-evident audit archiving."
  - type: "component"
    name: "Dead-Letter Queue"
    technology: "Amazon SQS DLQ"
    description: "Captures and stores undeliverable or failed event messages for troubleshooting."
relationships:
  - source: "Default Event Bus"
    destination: "Fraud Event Rules"
    description: "Evaluates events against"
  - source: "Fraud Event Rules"
    destination: "Case Management Target"
    description: "Dispatches filtered review events"
  - source: "Fraud Event Rules"
    destination: "Audit Archive Target"
    description: "Streams decision logs"
  - source: "Default Event Bus"
    destination: "Dead-Letter Queue"
    description: "Routes failed deliveries to"