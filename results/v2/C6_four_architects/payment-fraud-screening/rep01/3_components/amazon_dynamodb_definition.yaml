level: component
scope: "Component diagram for the Amazon DynamoDB container"
parentContainer:
  name: "Amazon DynamoDB"
elements:
  - type: "component"
    name: "Transaction Table"
    technology: "Amazon DynamoDB"
    description: "Stores real-time authorization and transaction data with single-digit millisecond latency."
  - type: "component"
    name: "Case Management Table"
    technology: "Amazon DynamoDB"
    description: "Stores case management data to support analyst workflows."
  - type: "component"
    name: "Global Secondary Indexes (GSIs)"
    technology: "Amazon DynamoDB GSI"
    description: "Provides alternative access patterns for querying case management data."
  - type: "component"
    name: "DynamoDB Streams Processor"
    technology: "AWS Lambda"
    description: "Processes real-time change data capture events from DynamoDB Streams."
  - type: "component"
    name: "Client-Side Encryption Component"
    technology: "AWS Encryption SDK"
    description: "Performs client-side column-level encryption for PCI-DSS Level 1 compliance."
  - type: "component"
    name: "Auto-Scaling Configuration"
    technology: "DynamoDB Auto-Scaling"
    description: "Manages capacity with 70% target utilization to handle 3,000 TPS within budget."
relationships:
  - source: "Real-Time Scoring Engine"
    destination: "Transaction Table"
    description: "Reads and writes authorization data using GetItem and PutItem via AWS SDK [HTTPS]"
  - source: "Case Management Backend"
    destination: "Case Management Table & GSIs"
    description: "Manages analyst workflows using Query and UpdateItem via AWS SDK [HTTPS]"
  - source: "Case Management Table"
    destination: "DynamoDB Streams Processor"
    description: "Triggers event processing via DynamoDB Streams [AWS Internal Stream]"
  - source: "DynamoDB Streams Processor"
    destination: "Amazon S3 Object Lock"
    description: "Streams tamper-evident audit logs via AWS SDK [HTTPS]"