level: component
scope: "Component diagram for the Case Management Backend container"
parentContainer:
  name: "Case Management Backend"
elements:
  - type: "component"
    name: "API Controller"
    technology: "Go (HTTPS)"
    description: "Handles incoming API requests from the Fraud Analyst Frontend for case management."
  - type: "component"
    name: "Case Logic Handler"
    technology: "Go"
    description: "Processes business logic for fraud cases and manages analyst decision events."
  - type: "component"
    name: "DynamoDB Client"
    technology: "Go on AWS SDK (HTTPS)"
    description: "Reads and writes case data to and from Amazon DynamoDB."
  - type: "component"
    name: "EventBridge Integration"
    technology: "AWS SDK / HTTPS"
    description: "Routes asynchronous events and publishes analyst decision events."
relationships:
  - source: "API Controller"
    destination: "Case Logic Handler"
    description: "Delegates request processing"
  - source: "Case Logic Handler"
    destination: "DynamoDB Client"
    description: "Invokes reads and writes"
  - source: "Case Logic Handler"
    destination: "EventBridge Integration"
    description: "Publishes decision and routing events"