level: component
scope: "Component diagram for the Amazon S3 Object Lock container"
parentContainer:
  name: "Amazon S3 Object Lock"
elements:
  - type: "component"
    name: "Audit Stream Processor"
    technology: "Go Lambda"
    description: "Streams audit logs from DynamoDB and writes signed logs to object storage."
  - type: "component"
    name: "Object Lifecycle Manager"
    technology: "Go Lambda"
    description: "Manages the lifecycle and WORM storage enforcement of compliance logs."
  - type: "component"
    name: "Audit Query API"
    technology: "Go Lambda"
    description: "Provides endpoints for compliance auditors to query historical decisions."
  - type: "component"
    name: "Integrity Verifier"
    technology: "Go Lambda"
    description: "Verifies checksums and tamper-evident auditability for compliance."
relationships:
  - source: "Audit Stream Processor"
    destination: "Object Lifecycle Manager"
    description: "Writes signed logs [AWS SDK / HTTPS]"
  - source: "Integrity Verifier"
    destination: "Object Lifecycle Manager"
    description: "Verifies checksums [AWS SDK / HTTPS]"