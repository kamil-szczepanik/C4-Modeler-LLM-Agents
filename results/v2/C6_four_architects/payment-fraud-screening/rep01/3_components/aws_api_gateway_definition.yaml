level: component
scope: "Component diagram for the AWS API Gateway container"
parentContainer:
  name: "AWS API Gateway"
elements:
  - type: "component"
    name: "AWS WAF"
    technology: "AWS WAF"
    description: "Edge security filter for IP reputation and geo-fencing."
  - type: "component"
    name: "AWS API Gateway HTTP API"
    technology: "AWS API Gateway HTTP API"
    description: "Public-facing ingress router for incoming payment requests."
  - type: "component"
    name: "Authentication & mTLS Validator"
    technology: "Mutual TLS"
    description: "Enforces transport security via Mutual TLS."
  - type: "component"
    name: "Payload Validator & Schema Enforcer"
    technology: "JSON Schema"
    description: "Validates incoming request structures using JSON Schema."
  - type: "component"
    name: "Rate Limiter & Throttling Controller"
    technology: "AWS API Gateway Throttling"
    description: "Protects downstream services from traffic spikes and DDoS attacks."
  - type: "component"
    name: "Internal Service Registry"
    technology: "AWS Cloud Map"
    description: "Dynamic container endpoint resolution."
  - type: "component"
    name: "Audit Log Redactor / Sanitizer"
    technology: "AWS Lambda"
    description: "Strips cleartext card data from logs for PCI-DSS compliance."
  - type: "component"
    name: "Metrics & Telemetry Emitter"
    technology: "Amazon CloudWatch and AWS X-Ray"
    description: "Tracing and monitoring for observability."
relationships:
  - source: "Payment Gateway / Acquirer Systems"
    destination: "AWS WAF"
    description: "Inspects inbound requests via HTTPS"
  - source: "AWS WAF"
    destination: "Authentication & mTLS Validator"
    description: "Forwards filtered traffic via HTTPS"
  - source: "Authentication & mTLS Validator"
    destination: "Payload Validator & Schema Enforcer"
    description: "Passes authenticated traffic internally via HTTP/2"
  - source: "Payload Validator & Schema Enforcer"
    destination: "Real-Time Scoring Engine"
    description: "Routes validated payloads using gRPC via AWS VPC Link"
  - source: "AWS API Gateway HTTP API"
    destination: "Metrics & Telemetry Emitter"
    description: "Collects telemetry asynchronously via AWS internal telemetry bus"
  - source: "AWS API Gateway HTTP API"
    destination: "Amazon S3 Object Lock"
    description: "Streams sanitized logs via AWS Kinesis Data Firehose"
  - source: "Real-Time Scoring Engine"
    destination: "AWS API Gateway HTTP API"
    description: "Returns decisions via gRPC"
  - source: "AWS API Gateway HTTP API"
    destination: "Payment Gateway / Acquirer Systems"
    description: "Returns final responses via HTTPS"