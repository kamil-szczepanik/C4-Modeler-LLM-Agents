level: component
scope: "Component diagram for the ML Inference Service container"
parentContainer:
  name: "ML Inference Service"
elements:
  - type: "component"
    name: "gRPC API Handler"
    technology: "Python gRPC/Protobuf"
    description: "Handles incoming gRPC requests for transaction screening."
  - type: "component"
    name: "Model Execution Engine"
    technology: "Python with ONNX Runtime"
    description: "Executes ML model inference with low memory footprint and high speed."
  - type: "component"
    name: "Feature Preprocessor"
    technology: "Python NumPy/Pandas"
    description: "Preprocesses feature vectors for model inference."
  - type: "component"
    name: "Model Loader"
    technology: "Python Boto3"
    description: "Fetches updated model binaries from the registry."
  - type: "component"
    name: "Explainability Component"
    technology: "ONNX-native TreeEnsemble Explainers"
    description: "Calculates lightweight tree path attributions."
  - type: "component"
    name: "Telemetry & Audit Emitter"
    technology: "Python AWS SDK"
    description: "Dispatches audit payloads via an async queue."
relationships:
  - source: "gRPC API Handler"
    destination: "Feature Preprocessor"
    description: "Passes feature vectors for preprocessing"
  - source: "Feature Preprocessor"
    destination: "Model Execution Engine"
    description: "Sends preprocessed data for inference"
  - source: "Model Loader"
    destination: "Model Execution Engine"
    description: "Supplies updated model binaries"
  - source: "Model Execution Engine"
    destination: "Explainability Component"
    description: "Calculates lightweight tree path attributions"
  - source: "Model Execution Engine"
    destination: "Telemetry & Audit Emitter"
    description: "Dispatches audit payload"