level: component
scope: "Component diagram for the Fraud Analyst Frontend container"
parentContainer:
  name: "Fraud Analyst Frontend"
elements:
  - type: "component"
    name: "Fraud Analysts"
    technology: "Human User"
    description: "End users accessing the system interface."
  - type: "component"
    name: "Authentication & Authorization Module"
    technology: "AWS Cognito, OAuth2/OIDC"
    description: "Enforces OAuth2/OIDC role-based access control."
  - type: "component"
    name: "Case Management Dashboard"
    technology: "React, TypeScript"
    description: "Component rendering transaction queues and risk metadata."
  - type: "component"
    name: "Audit Logging & Redaction Guard"
    technology: "Client-side Proxy Interceptor"
    description: "Prevents raw card primary account numbers (PANs) from rendering in the DOM."
  - type: "component"
    name: "Rule & Model Management Console"
    technology: "React, TypeScript"
    description: "Administrative interface for zero-downtime rule and scoring model updates."
  - type: "component"
    name: "WebSocket Client Module"
    technology: "Native Browser Client"
    description: "Maintains real-time queue synchronization."
relationships:
  - source: "Fraud Analysts"
    destination: "Fraud Analyst Frontend"
    description: "Accesses review interface via HTTPS"
  - source: "Authentication & Authorization Module"
    destination: "AWS Cognito"
    description: "OAuth2/OIDC authentication via HTTPS"
  - source: "Case Management Dashboard"
    destination: "Case Management Backend"
    description: "Fetches review queues and submits decisions via REST/JSON over HTTPS"
  - source: "Rule & Model Management Console"
    destination: "Case Management Backend"
    description: "Triggers rule adjustments and model deployments via REST/JSON over HTTPS"
  - source: "WebSocket Client Module"
    destination: "Case Management Backend"
    description: "Receives real-time queue synchronization updates via WSS over HTTPS"