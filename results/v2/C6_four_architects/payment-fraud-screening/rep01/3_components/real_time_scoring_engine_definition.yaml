level: component
scope: "Component diagram for the Real-Time Scoring Engine container"
parentContainer:
  name: "Real-Time Scoring Engine"
elements:
  - type: "component"
    name: "API Router & Token Handler"
    technology: "Go"
    description: "Terminating gRPC and sanitizing card data."
  - type: "component"
    name: "Feature Aggregator"
    technology: "Go"
    description: "Fetching data using Redis pipelining (errgroup)."
  - type: "component"
    name: "Decision Orchestrator"
    technology: "Go"
    description: "Coordinating ML inference and zero-downtime rules."
  - type: "component"
    name: "Audit Logger & Cryptographic Signer"
    technology: "Go"
    description: "Signing decisions via AWS KMS."
  - type: "component"
    name: "Metrics & Tracing Interceptor"
    technology: "Go middleware"
    description: "Using zerolog for zero-allocation telemetry."
relationships:
  - source: "AWS API Gateway"
    destination: "API Router & Token Handler"
    description: "Routes authorization requests [gRPC]"
  - source: "API Router & Token Handler"
    destination: "Feature Aggregator"
    description: "Invokes feature lookup [In-memory Go calls]"
  - source: "Feature Aggregator"
    destination: "Amazon ElastiCache"
    description: "Fetches user and card features [TCP (RESP)]"
  - source: "Decision Orchestrator"
    destination: "ML Inference Service"
    description: "Requests model scoring [Internal gRPC over HTTP/2]"
  - source: "Audit Logger & Cryptographic Signer"
    destination: "Amazon DynamoDB"
    description: "Persists audit records [HTTPS (AWS SDK v2)]"
  - source: "Audit Logger & Cryptographic Signer"
    destination: "Amazon S3 Object Lock"
    description: "Archives signed payloads [HTTPS (AWS SDK v2)]"