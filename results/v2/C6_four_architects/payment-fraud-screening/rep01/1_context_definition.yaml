level: context
scope: "System Context diagram for Real-Time Fraud Screening and Case Management System"
system:
  name: "Real-Time Fraud Screening and Case Management System"
  description: "Screens card-not-present payment authorizations for fraud in real-time and provides case management for fraud analysts within AWS eu-west-1."
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Internal users who access case management to review fraud cases."
  - type: "person"
    name: "ML Engineers"
    description: "Engineers who push model and rule updates to the system."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer Systems"
    description: "External actor that sends card-not-present payment authorization requests and receives circuit breaker signals."
  - type: "externalSystem"
    name: "Card Networks / Token Vaults"
    description: "External system used by the scoring engine to resolve tokens."
  - type: "externalSystem"
    name: "Audit / Compliance Archive"
    description: "External storage for tamper-evident 7-year audit logs."
  - type: "externalSystem"
    name: "ML Model / Rule Registry"
    description: "External system storing machine learning models and business rules."
relationships:
  - source: "Payment Gateway / Acquirer Systems"
    destination: "Real-Time Fraud Screening and Case Management System"
    description: "Sends authorization requests"
    technology: "gRPC over HTTP/2"
  - source: "Real-Time Fraud Screening and Case Management System"
    destination: "Card Networks / Token Vaults"
    description: "Resolves tokens"
    technology: "Secure API over mTLS"
  - source: "Real-Time Fraud Screening and Case Management System"
    destination: "Audit / Compliance Archive"
    description: "Streams audit logs asynchronously"
    technology: "HTTPS / TLS 1.3"
  - source: "Fraud Analysts"
    destination: "Real-Time Fraud Screening and Case Management System"
    description: "Accesses case management"
    technology: "HTTPS"
  - source: "ML Engineers"
    destination: "Real-Time Fraud Screening and Case Management System"
    description: "Pushes model and rule updates"
    technology: "HTTPS / REST API"
  - source: "Real-Time Fraud Screening and Case Management System"
    destination: "Payment Gateway / Acquirer Systems"
    description: "Sends circuit breaker signals for fail-open fallback"
    technology: "gRPC"