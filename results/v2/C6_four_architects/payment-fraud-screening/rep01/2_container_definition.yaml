level: container
scope: "Container diagram for Real-Time Payment Fraud Screening and Case Management System"
system:
  name: "Real-Time Payment Fraud Screening and Case Management System"
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Internal users who access case management to review fraud cases."
  - type: "person"
    name: "ML Engineers"
    description: "Engineers who develop and update models and rules."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer Systems"
    description: "External systems that send card-not-present payment authorization requests."
  - type: "externalSystem"
    name: "Card Networks / Token Vaults"
    description: "External systems used for token resolution."
  - type: "container"
    name: "AWS API Gateway"
    technology: "AWS API Gateway"
    description: "Ingestion router for incoming payment authorization requests."
  - type: "container"
    name: "Real-Time Scoring Engine"
    technology: "Go on AWS ECS Fargate"
    description: "Evaluates card-not-present payment authorizations in real-time."
  - type: "container"
    name: "ML Inference Service"
    technology: "Python with ONNX Runtime on AWS ECS Fargate"
    description: "Executes machine learning scoring and zero-downtime model updates."
  - type: "container"
    name: "Case Management Backend"
    technology: "Go/Node.js on AWS ECS Fargate"
    description: "Handles case management and backend routing for fraud analysts."
  - type: "container"
    name: "Fraud Analyst Frontend"
    technology: "Amazon CloudFront and S3"
    description: "Frontend application allowing fraud analysts to review cases."
  - type: "container"
    name: "Amazon ElastiCache"
    technology: "Redis"
    description: "Feature store providing low-latency feature lookups for context hydration."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Scalable storage for system data."
  - type: "container"
    name: "Amazon S3 Object Lock"
    technology: "Amazon S3 Object Lock"
    description: "WORM storage providing tamper-evident 7-year auditability."
  - type: "container"
    name: "Amazon EventBridge"
    technology: "Amazon EventBridge"
    description: "Event bus handling asynchronous, event-driven case routing."
relationships:
  - source: "Payment Gateway / Acquirer Systems"
    destination: "AWS API Gateway"
    description: "Sends payment authorization requests"
    technology: "mTLS over HTTPS / gRPC"
  - source: "AWS API Gateway"
    destination: "Real-Time Scoring Engine"
    description: "Routes requests to scoring engine"
    technology: "gRPC"
  - source: "Real-Time Scoring Engine"
    destination: "ML Inference Service"
    description: "Requests ML model inference"
    technology: "Internal gRPC"
  - source: "Real-Time Scoring Engine"
    destination: "Amazon ElastiCache"
    description: "Performs feature lookups"
    technology: "TCP (RESP)"
  - source: "Real-Time Scoring Engine"
    destination: "Amazon DynamoDB"
    description: "Reads and writes authorization and transaction data"
    technology: "HTTPS (AWS SDK)"
  - source: "Case Management Backend"
    destination: "Amazon DynamoDB"
    description: "Reads and writes case data"
    technology: "HTTPS (AWS SDK)"
  - source: "Amazon DynamoDB"
    destination: "Amazon S3 Object Lock"
    description: "Streams audit logs"
    technology: "AWS Internal Stream"
  - source: "Real-Time Scoring Engine"
    destination: "Amazon EventBridge"
    description: "Publishes fraud screening events"
    technology: "HTTPS (AWS SDK)"
  - source: "Amazon EventBridge"
    destination: "Case Management Backend"
    description: "Routes events asynchronously"
    technology: "HTTPS / Webhook"
  - source: "Fraud Analysts"
    destination: "Fraud Analyst Frontend"
    description: "Accesses fraud cases and interface"
    technology: "HTTPS"
  - source: "Fraud Analyst Frontend"
    destination: "Case Management Backend"
    description: "Sends API requests for case management"
    technology: "HTTPS"