level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "An Amazon-style e-commerce system enabling users to purchase physical and electronic books with recommendations and reviews. It provides a secure, multi-region platform designed to handle 1M MAU while ensuring strict compliance."
elements:
  - type: "person"
    name: "Customer"
    description: "End user who browses, purchases physical and electronic books, leaves reviews, and manages their cart."
  - type: "person"
    name: "Store Administrator"
    description: "System administrator managing catalog, orders, and platform operations."
  - type: "externalSystem"
    name: "AWS CloudFront/Route 53"
    description: "Content delivery network and DNS routing for global frontend and API access."
  - type: "externalSystem"
    name: "Stripe/PayPal"
    description: "External payment gateway services for secure financial transactions."
  - type: "externalSystem"
    name: "UPS/FedEx"
    description: "External logistics and shipping providers for physical book fulfillment."
  - type: "externalSystem"
    name: "Avalara"
    description: "External tax calculation service for compliance."
  - type: "externalSystem"
    name: "AWS SES/SNS"
    description: "Messaging and notification services for email and notifications."
  - type: "externalSystem"
    name: "AWS Personalize"
    description: "Machine learning service for personalized book recommendations."
  - type: "externalSystem"
    name: "AWS Fraud Detector"
    description: "Fraud detection service to secure transactions and user activity."
  - type: "container"
    name: "Web Application (React/Next.js SPA)"
    description: "Frontend SPA hosted on S3 and CloudFront for fast page loads."
    technology: "React / Next.js / S3"
  - type: "container"
    name: "API Gateway"
    description: "Entry point for routing client requests to backend microservices."
    technology: "AWS API Gateway"
  - type: "container"
    name: "Catalog Service"
    description: "Manages the book catalog and product data."
    technology: "Microservice"
  - type: "container"
    name: "Cart & Checkout Service"
    description: "Handles user shopping carts and checkout flows."
    technology: "Microservice"
  - type: "container"
    name: "Order & Fulfillment Service"
    description: "Processes orders and manages fulfillment workflows."
    technology: "Microservice"
  - type: "container"
    name: "User & Auth Service"
    description: "Manages user accounts, authentication, and authorization."
    technology: "Microservice"
  - type: "container"
    name: "Background Worker / Job Processors"
    description: "Processes asynchronous jobs and background tasks."
    technology: "Worker Process"
  - type: "container"
    name: "Amazon Aurora"
    description: "Primary relational storage database."
    technology: "Amazon Aurora"
  - type: "container"
    name: "OpenSearch"
    description: "Catalog search engine for fast product discovery."
    technology: "Amazon OpenSearch"
  - type: "container"
    name: "Amazon ElastiCache (Redis)"
    description: "Caching layer for product searches and session management."
    technology: "Amazon ElastiCache (Redis)"
  - type: "container"
    name: "Amazon EventBridge/SQS"
    description: "Asynchronous messaging event bus for decoupled microservices."
    technology: "Amazon EventBridge / SQS"
relationships:
  - source: "Customer"
    destination: "AWS CloudFront/Route 53"
    description: "Accesses the storefront via secure web traffic"
    technology: "HTTPS (TLS 1.3)"
  - source: "Store Administrator"
    destination: "AWS CloudFront/Route 53"
    description: "Accesses administrative tools via secure web traffic"
    technology: "HTTPS (TLS 1.3)"
  - source: "AWS CloudFront/Route 53"
    destination: "API Gateway"
    description: "Routes API requests to the backend gateway"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Catalog Service"
    description: "Routes catalog queries and requests"
    technology: "REST / GraphQL / gRPC"
  - source: "API Gateway"
    destination: "Cart & Checkout Service"
    description: "Routes cart and checkout operations"
    technology: "REST / GraphQL / gRPC"
  - source: "API Gateway"
    destination: "Order & Fulfillment Service"
    description: "Routes order creation and tracking requests"
    technology: "REST / GraphQL / gRPC"
  - source: "API Gateway"
    destination: "User & Auth Service"
    description: "Routes authentication and user management requests"
    technology: "REST / GraphQL / gRPC"
  - source: "Cart & Checkout Service"
    destination: "Stripe/PayPal"
    description: "Processes payments"
    technology: "REST / HTTPS"
  - source: "Cart & Checkout Service"
    destination: "Avalara"
    description: "Calculates taxes"
    technology: "REST / HTTPS"
  - source: "Order & Fulfillment Service"
    destination: "UPS/FedEx"
    description: "Coordinates shipment and fulfillment"
    technology: "REST / HTTPS"
  - source: "Catalog Service"
    destination: "AWS Personalize"
    description: "Fetches recommendations"
    technology: "REST / HTTPS"
  - source: "Cart & Checkout Service"
    destination: "AWS Fraud Detector"
    description: "Screens transactions for fraud"
    technology: "REST / HTTPS"
  - source: "User & Auth Service"
    destination: "AWS SES/SNS"
    description: "Sends notifications and emails"
    technology: "AWS SES / SNS"
  - source: "Catalog Service"
    destination: "Amazon Aurora"
    description: "Reads and writes relational data"
    technology: "TCP / Internal VPC"
  - source: "Catalog Service"
    destination: "OpenSearch"
    description: "Queries search index"
    technology: "TCP / Internal VPC"
  - source: "Cart & Checkout Service"
    destination: "Amazon ElastiCache (Redis)"
    description: "Manages session and cache data"
    technology: "TCP / Internal VPC"
  - source: "Order & Fulfillment Service"
    destination: "Amazon EventBridge/SQS"
    description: "Publishes and consumes asynchronous events"
    technology: "AWS EventBridge / SQS"