level: component
scope: "Component diagram for the Admin & Content Management Service container"
parentContainer:
  name: "Admin & Content Management Service"
elements:
  - type: "component"
    name: "Catalog Administration Component"
    technology: ".NET Core"
    description: "Manages inventory data and triggers index re-syncs."
  - type: "component"
    name: "Content Moderation Component"
    technology: ".NET Core"
    description: "Publishes moderation outcomes."
  - type: "component"
    name: "IAM & RBAC Component"
    technology: ".NET Core"
    description: "Authenticates administrative tokens."
  - type: "component"
    name: "Data Privacy & Compliance Component"
    technology: ".NET Core"
    description: "Executes data export/erasure for GDPR/CCPA compliance."
  - type: "component"
    name: "Shipping & Tax Configuration Component"
    technology: ".NET Core"
    description: "Caches tax and shipping rules."
  - type: "component"
    name: "CMS & Asset Management Component"
    technology: ".NET Core"
    description: "Uploads static media assets."
relationships:
  - source: "Amazon API Gateway"
    destination: "IAM & RBAC Component"
    description: "Authenticates administrative tokens [HTTPS]"
  - source: "Catalog Administration Component"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Manages inventory data [ADO.NET / TLS]"
  - source: "Catalog Administration Component"
    destination: "Amazon OpenSearch"
    description: "Triggers index re-syncs [HTTPS / REST]"
  - source: "Content Moderation Component"
    destination: "Amazon EventBridge"
    description: "Publishes moderation outcomes [AWS SDK / HTTPS]"
  - source: "Data Privacy & Compliance Component"
    destination: "Amazon RDS (PostgreSQL) / Amazon S3"
    description: "Executes data export/erasure [ADO.NET / TLS]"
  - source: "Shipping & Tax Configuration Component"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches tax/shipping rules [RESP / TCP over TLS]"
  - source: "CMS & Asset Management Component"
    destination: "Amazon S3"
    description: "Uploads static media assets [AWS SDK / HTTPS over TLS]"