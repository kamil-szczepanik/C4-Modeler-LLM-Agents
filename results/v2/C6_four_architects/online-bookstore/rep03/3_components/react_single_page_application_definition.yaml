level: component
scope: "Component diagram for the React Single Page Application container"
parentContainer:
  name: "React Single Page Application"
elements:
  - type: "component"
    name: "Routing & Shell Component"
    technology: "React, React Router"
    description: "Delivers a responsive user experience and manages page layout and client-side routing."
  - type: "component"
    name: "Catalog & Search Component"
    technology: "React"
    description: "Handles browsing and searching of books within the store."
  - type: "component"
    name: "Cart & Checkout Component"
    technology: "React"
    description: "Manages shopping cart contents and the checkout process."
  - type: "component"
    name: "Recommendation & Review Component"
    technology: "React"
    description: "Displays book recommendations and user reviews."
  - type: "component"
    name: "Auth & Profile Component"
    technology: "React"
    description: "Handles user authentication and profile management."
  - type: "component"
    name: "API Client & Interceptor Component"
    technology: "Axios"
    description: "Centralizes HTTP requests, token injection, and OWASP security headers, routing outbound traffic exclusively."
  - type: "component"
    name: "Localization & Currency Component"
    technology: "i18next"
    description: "Handles multi-currency display (USD, EUR, GBP) and client-side translation dictionaries."
relationships:
  - source: "Routing & Shell Component"
    destination: "API Client & Interceptor Component"
    description: "Routes outbound traffic exclusively"
  - source: "Catalog & Search Component"
    destination: "API Client & Interceptor Component"
    description: "Routes outbound traffic exclusively"
  - source: "Cart & Checkout Component"
    destination: "API Client & Interceptor Component"
    description: "Routes outbound traffic exclusively"
  - source: "Recommendation & Review Component"
    destination: "API Client & Interceptor Component"
    description: "Routes outbound traffic exclusively"
  - source: "Auth & Profile Component"
    destination: "API Client & Interceptor Component"
    description: "Routes outbound traffic exclusively"
  - source: "Localization & Currency Component"
    destination: "API Client & Interceptor Component"
    description: "Routes outbound traffic exclusively"