level: component
scope: "Component diagram for the Amazon DynamoDB container"
parentContainer:
  name: "Amazon DynamoDB"
elements:
  - type: "component"
    name: "Request Router"
    technology: "AWS Managed Service"
    description: "Routes incoming client requests to the appropriate storage nodes."
  - type: "component"
    name: "Storage Nodes (RocksDB)"
    technology: "RocksDB"
    description: "Manages underlying data storage and retrieval using RocksDB."
  - type: "component"
    name: "Streams Processor"
    technology: "AWS DynamoDB Streams"
    description: "Triggers change data capture events and processes table streams."
  - type: "component"
    name: "Global Tables Replicator"
    technology: "AWS Global Tables"
    description: "Replicates data across multiple AWS regions."
  - type: "component"
    name: "TTL Background Cleaner"
    technology: "AWS Background Process"
    description: "Automatically removes expired items based on Time-To-Live settings."
  - type: "component"
    name: "Request Authenticator (AWS IAM)"
    technology: "AWS IAM"
    description: "Authenticates and authorizes incoming requests using AWS IAM."
  - type: "component"
    name: "Partition Metadata Catalog"
    technology: "Internal Metadata Store"
    description: "Tracks partition locations and metadata for data routing."
relationships:
  - source: "Storage Nodes (RocksDB)"
    destination: "Streams Processor"
    description: "Triggers change data capture events"