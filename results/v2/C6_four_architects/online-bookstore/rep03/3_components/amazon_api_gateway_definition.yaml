level: component
scope: "Component diagram for the Amazon API Gateway container"
parentContainer:
  name: "Amazon API Gateway"
elements:
  - type: "component"
    name: "Edge Router & Reverse Proxy"
    technology: "AWS API Gateway V2 / HTTP APIs"
    description: "Acts as the edge router and reverse proxy, handling client requests and proxying sanitized payloads to backend microservices."
  - type: "component"
    name: "WAF & Threat Mitigation Filter"
    technology: "AWS WAF"
    description: "Inspects incoming payloads for SQLi, XSS, and bot traffic."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "AWS Lambda Authorizer"
    description: "Validates JWT tokens for incoming requests."
  - type: "component"
    name: "Rate Limiting & Throttling Engine"
    technology: "API Gateway Usage Plans & Amazon ElastiCache Redis"
    description: "Tracks token-bucket sliding windows to enforce rate limits and throttling."
  - type: "component"
    name: "Request/Response Transformation Engine"
    technology: "API Gateway Mapping Templates"
    description: "Transforms requests and responses at the edge boundary."
  - type: "component"
    name: "API Logging & Telemetry Publisher"
    technology: "Amazon CloudWatch & AWS X-Ray"
    description: "Publishes API logs and provides native distributed tracing and observability."
relationships:
  - source: "React Single Page Application"
    destination: "Edge Router & Reverse Proxy"
    description: "Submits client requests [HTTPS / HTTP/2 over TLS 1.3]"
  - source: "Edge Router & Reverse Proxy"
    destination: "WAF & Threat Mitigation Filter"
    description: "Inspects incoming payloads [AWS WAF WebACL]"
  - source: "Edge Router & Reverse Proxy"
    destination: "Authentication & Authorization Filter"
    description: "Validates JWT tokens [AWS Lambda]"
  - source: "Rate Limiting & Throttling Engine"
    destination: "Amazon ElastiCache (Redis)"
    description: "Tracks token-bucket sliding windows [TCP / Redis Protocol]"
  - source: "Request/Response Transformation Engine"
    destination: "Backend Microservices"
    description: "Proxies sanitized payloads [gRPC over HTTP/2]"