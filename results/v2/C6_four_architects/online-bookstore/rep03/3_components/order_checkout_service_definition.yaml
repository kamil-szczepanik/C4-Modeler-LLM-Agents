level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Checkout Controller"
    technology: "Node.js/Express"
    description: "Exposes REST/gRPC endpoints for API Gateway interaction."
  - type: "component"
    name: "Idempotency Guard"
    technology: "Node.js/Redis Client"
    description: "Prevents duplicate order creation via atomic locks."
  - type: "component"
    name: "Cart Manager"
    technology: "Node.js"
    description: "Encapsulates shopping cart state and lifecycle management."
  - type: "component"
    name: "Order Orchestrator"
    technology: "Node.js/Temporal.io SDK"
    description: "Manages distributed checkout sagas and consistency."
  - type: "component"
    name: "Payment & Tax Client"
    technology: "Node.js/Axios"
    description: "Integrates with Stripe/PayPal and Avalara."
  - type: "component"
    name: "Fulfillment & Risk Client"
    technology: "Node.js/Axios"
    description: "Interfaces with UPS/FedEx and AWS Fraud Detector."
  - type: "component"
    name: "Event Publisher"
    technology: "Node.js/AWS SDK"
    description: "Dispatches asynchronous domain events."
  - type: "component"
    name: "Order Data Access Layer"
    technology: "Node.js/DynamoDB Document Client"
    description: "Manages single-table design access patterns."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache (Redis)"
    description: "Checks/stores transaction locks [TCP]"
relationships:
  - source: "Checkout Controller"
    destination: "Idempotency Guard"
    description: "Validates request uniqueness [In-memory]"
  - source: "Idempotency Guard"
    destination: "Amazon ElastiCache (Redis)"
    description: "Checks/stores transaction locks [TCP]"
  - source: "Checkout Controller"
    destination: "Cart Manager"
    description: "Retrieves active cart items [In-memory]"
  - source: "Checkout Controller"
    destination: "Order Orchestrator"
    description: "Initiates saga workflow [In-memory]"
  - source: "Order Orchestrator"
    destination: "Payment & Tax Client & Fulfillment & Risk Client"
    description: "Executes transaction steps [HTTPS Egress]"
  - source: "Order Orchestrator"
    destination: "Order Data Access Layer"
    description: "Persists state transitions [NoSQL API over TCP]"
  - source: "Cart Manager"
    destination: "Order Data Access Layer"
    description: "Clears cart state [NoSQL API over TCP]"
  - source: "Order Orchestrator"
    destination: "Event Publisher"
    description: "Emits completion events [Event-driven Messaging]"