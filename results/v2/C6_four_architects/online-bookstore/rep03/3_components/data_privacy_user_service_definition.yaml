level: component
scope: "Component diagram for the Data Privacy & User Service container"
parentContainer:
  name: "Data Privacy & User Service"
elements:
  - type: "component"
    name: "UserController"
    technology: "Python / FastAPI"
    description: "Handles incoming API requests related to user management and data privacy."
  - type: "component"
    name: "GDPRComplianceEngine"
    technology: "Python / FastAPI"
    description: "Manages GDPR and CCPA compliance workflows and data rights."
  - type: "component"
    name: "UserRepository"
    technology: "Python / FastAPI"
    description: "Handles data persistence and retrieval for user records."
  - type: "component"
    name: "ConsentManager"
    technology: "Python / FastAPI"
    description: "Tracks and manages user consent preferences."
  - type: "component"
    name: "DataEncryptionService"
    technology: "Python / FastAPI"
    description: "Provides field-level encryption for PII compliance."
  - type: "component"
    name: "AuditLogger"
    technology: "Python / FastAPI"
    description: "Logs compliance and system audit trails."
  - type: "component"
    name: "AuthTokenVerifier"
    technology: "Python / FastAPI"
    description: "Verifies authentication tokens for secure access."
  - type: "component"
    name: "DataRetentionEnforcer"
    technology: "Python / FastAPI"
    description: "Enforces data retention policies and automated deletion."
  - type: "component"
    name: "UserProfileCacheManager"
    technology: "Python / FastAPI"
    description: "Manages caching for high-performance non-sensitive profile reads."
  - type: "component"
    name: "Amazon API Gateway"
    technology: "AWS"
    description: "Edge and API gateway service routing traffic to internal services."
  - type: "component"
    name: "Amazon RDS (PostgreSQL)"
    technology: "PostgreSQL"
    description: "Relational database for transactional user records."
  - type: "component"
    name: "AWS KMS"
    technology: "AWS KMS"
    description: "Key management service for field-level encryption."
  - type: "component"
    name: "Amazon EventBridge & SQS"
    technology: "AWS"
    description: "Messaging and integration infrastructure."
  - type: "component"
    name: "Amazon S3"
    technology: "Amazon S3"
    description: "Object storage for compliance documentation and files."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "DynamoDB"
    description: "NoSQL store for immutable audit logs and consent trails."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Redis"
    description: "In-memory cache for profile reads."
relationships:
  - source: "Amazon API Gateway"
    destination: "UserController"
    description: "gRPC / HTTPS over TLS"
  - source: "UserController"
    destination: "AuthTokenVerifier"
    description: "In-process"
  - source: "UserRepository"
    destination: "Amazon RDS (PostgreSQL)"
    description: "SQL / TCP"
  - source: "UserRepository"
    destination: "AWS KMS"
    description: "AWS SDK / HTTPS"
  - source: "GDPRComplianceEngine"
    destination: "Amazon EventBridge & SQS"
    description: "AMQP"
  - source: "GDPRComplianceEngine"
    destination: "Amazon S3"
    description: "HTTPS"
  - source: "AuditLogger"
    destination: "Amazon DynamoDB"
    description: "AWS SDK / HTTPS"
  - source: "UserProfileCacheManager"
    destination: "Amazon ElastiCache (Redis)"
    description: "RESP / TCP"