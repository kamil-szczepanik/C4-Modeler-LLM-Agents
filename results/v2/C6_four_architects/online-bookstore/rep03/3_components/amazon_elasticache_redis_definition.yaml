  - source: "Order & Checkout Service"
    destination: "Session Store Component"
    description: "Redis Protocol over TCP"
  - source: "Amazon API Gateway"
    destination: "Distributed Rate Limiter Component"
    description: "Redis Protocol over TCP"
  - source: "Order & Checkout Service"
    destination: "Idempotency & Deduplication Store Component"
