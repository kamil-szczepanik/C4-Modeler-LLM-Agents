level: component
scope: "Component diagram for the Async Worker Service container"
parentContainer:
  name: "Async Worker Service"
elements:
  - type: "component"
    name: "Task Consumer Component"
    technology: "Python / Celery or AWS Lambda"
    description: "Manages asynchronous workflows, task distribution, and message routing."
  - type: "component"
    name: "Workflow Orchestrator Component"
    technology: "Python / AWS Step Functions"
    description: "Orchestrates complex multi-step workflows and sagas."
  - type: "component"
    name: "Notification Dispatcher Component"
    technology: "Python"
    description: "Dispatches customer alerts and notifications."
  - type: "component"
    name: "Data Synchronization Component"
    technology: "Python"
    description: "Synchronizes data across data stores and services."
  - type: "component"
    name: "GDPR/CCPA Compliance Purge Component"
    technology: "Python"
    description: "Enforces regulatory compliance by anonymizing and purging PII data."
  - type: "component"
    name: "Search Indexing Component"
    technology: "Python"
    description: "Forwards catalogue updates and updates search indices."
  - type: "component"
    name: "DLQ Handler Component"
    technology: "Python"
    description: "Routes failed messages and alerts the operations team."
  - type: "component"
    name: "Third-party Shipping APIs (UPS/FedEx)"
    technology: "HTTPS/REST"
    description: "External shipping services for shipment creation."
  - type: "component"
    name: "Avalara"
    technology: "HTTPS/REST"
    description: "External tax calculation and commitment service."
  - type: "component"
    name: "AWS SES/SNS"
    technology: "AWS SDK / HTTPS"
    description: "Notification delivery infrastructure for customer alerts and operational paging."
  - type: "component"
    name: "Amazon RDS (PostgreSQL)"
    technology: "PostgreSQL JDBC/TCP"
    description: "Relational database storing transactional state."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "AWS SDK"
    description: "NoSQL database supporting PII anonymization and user data."
  - type: "component"
    name: "Amazon OpenSearch"
    technology: "HTTPS / OpenSearch REST Client"
    description: "Search index synchronization target for catalogue browsing performance."
relationships:
  - source: "Task Consumer Component"
    destination: "Workflow Orchestrator Component"
    description: "Triggers sagas [In-process Python function calls]"
  - source: "Task Consumer Component"
    destination: "GDPR/CCPA Compliance Purge Component"
    description: "Triggers data deletion [In-process Python function calls]"
  - source: "Task Consumer Component"
    destination: "Search Indexing Component"
    description: "Forwards catalogue updates [In-process Python function calls]"
  - source: "Task Consumer Component"
    destination: "DLQ Handler Component"
    description: "Routes failed messages [SQS SDK / Exception Handling]"
  - source: "Workflow Orchestrator Component"
    destination: "Third-party Shipping APIs (UPS/FedEx)"
    description: "Requests shipment creation [HTTPS/REST]"
  - source: "Workflow Orchestrator Component"
    destination: "Avalara"
    description: "Calculates and commits taxes [HTTPS/REST]"
  - source: "Notification Dispatcher Component"
    destination: "AWS SES/SNS"
    description: "Sends notifications [AWS SDK / HTTPS]"
  - source: "Data Synchronization Component"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Reads transactional state [PostgreSQL JDBC/TCP]"
  - source: "GDPR/CCPA Compliance Purge Component"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Anonymizes PII [SQL / AWS SDK]"
  - source: "GDPR/CCPA Compliance Purge Component"
    destination: "Amazon DynamoDB"
    description: "Anonymizes PII [SQL / AWS SDK]"
  - source: "Search Indexing Component"
    destination: "Amazon OpenSearch"
    description: "Updates search indices [HTTPS / OpenSearch REST Client]"
  - source: "DLQ Handler Component"
    destination: "AWS SES/SNS"
    description: "Alerts operations team [AWS SDK / HTTPS]"