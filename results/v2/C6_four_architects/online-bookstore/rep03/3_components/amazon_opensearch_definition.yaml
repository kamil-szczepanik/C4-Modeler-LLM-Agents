level: component
scope: "Component diagram for the Amazon OpenSearch container"
parentContainer:
  name: "Amazon OpenSearch"
elements:
  - type: "component"
    name: "Search Indexing Engine"
    technology: "Apache Lucene / OpenSearch Core"
    description: "Indexes catalog data and provides fast text search capabilities for books."
  - type: "component"
    name: "Query Processing API"
    technology: "RESTful HTTP API / OpenSearch DSL"
    description: "Receives and evaluates search queries from the Catalog & Search Service."
  - type: "component"
    name: "Data Sync Handler"
    technology: "Event Listener / REST endpoint"
    description: "Ingests catalogue update events from Async Worker Services to keep search indices synchronized."
relationships:
  - source: "Catalog & Search Service"
    destination: "Query Processing API"
    description: "Queries catalogue search indices [HTTPS/REST via OpenSearch DSL]"
  - source: "Async Worker Service"
    destination: "Data Sync Handler"
    description: "Syncs catalogue update events [HTTPS/REST]"