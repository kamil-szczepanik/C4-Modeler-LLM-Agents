level: component
scope: "Component diagram for the Recommendation & Review Service container"
parentContainer:
  name: "Recommendation & Review Service"
elements:
  - type: "component"
    name: "API Router / Controller"
    technology: "FastAPI"
    description: "Routes incoming HTTP requests and delegates logic to internal managers and clients."
  - type: "component"
    name: "Review & Rating Manager"
    technology: "FastAPI / SQLAlchemy / asyncpg"
    description: "Manages reviews and ratings, interfacing with the PostgreSQL database."
  - type: "component"
    name: "Recommendation Engine Client"
    technology: "Python SDK"
    description: "Fetches personalized recommendations from AWS Personalize."
  - type: "component"
    name: "Caching & Aggregation Layer"
    technology: "async-lru / Redis client"
    description: "Handles caching of rating aggregates, review snippets, and recommendation payloads."
  - type: "component"
    name: "Event Consumer Worker"
    technology: "Python / boto3"
    description: "Polls asynchronous events and triggers internal async method calls."
  - type: "container"
    name: "Amazon RDS (PostgreSQL)"
    technology: "PostgreSQL"
    description: "Stores persistent relational data for reviews and ratings."
  - type: "container"
    name: "Amazon ElastiCache (Redis)"
    technology: "Redis"
    description: "Caches rating aggregates, review snippets, and recommendation payloads."
  - type: "container"
    name: "AWS Personalize"
    technology: "Managed ML Service"
    description: "Powers personalized book recommendations."
  - type: "container"
    name: "Amazon SQS"
    technology: "AWS SQS"
    description: "Queues asynchronous events for consumption by the worker."
relationships:
  - source: "API Router / Controller"
    destination: "Review & Rating Manager"
    description: "In-process method calls"
  - source: "API Router / Controller"
    destination: "Recommendation Engine Client"
    description: "In-process method calls"
  - source: "Review & Rating Manager"
    destination: "Amazon RDS (PostgreSQL)"
    description: "SQL over TLS [TCP 5432] via asyncpg connection pooling"
  - source: "Review & Rating Manager"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches rating aggregates and review snippets [Redis RESP over TLS]"
  - source: "Recommendation Engine Client"
    destination: "AWS Personalize"
    description: "Fetches personalized recommendations [HTTPS]"
  - source: "Recommendation Engine Client"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches recommendation payloads [Redis RESP over TLS]"
  - source: "Amazon SQS"
    destination: "Event Consumer Worker"
    description: "Polls asynchronous events [HTTPS / SQS Long Polling]"
  - source: "Event Consumer Worker"
    destination: "Review & Rating Manager"
    description: "Internal async method calls"