level: component
scope: "Component diagram for the Amazon RDS (PostgreSQL) container"
parentContainer:
  name: "Amazon RDS (PostgreSQL)"
elements:
  - type: "component"
    name: "PostgreSQL Relational Engine"
    technology: "PostgreSQL 15+"
    description: "Core RDBMS managing ACID transactions."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Connection pooler for handling high-concurrency requests."
  - type: "component"
    name: "Partition Manager"
    technology: "Declarative SQL"
    description: "Declarative table partitioning for performance and data purging."
  - type: "component"
    name: "Extension Manager"
    technology: "Native extensions (pg_trgm, pgcrypto)"
    description: "Native extensions for search and encryption."
  - type: "component"
    name: "Row-Level Security (RLS) Policies"
    technology: "PostgreSQL RLS"
    description: "Tenant and regional data isolation mechanism."
  - type: "component"
    name: "Audit & Logging Subsystem"
    technology: "pgAudit"
    description: "Configured via pgAudit for compliance tracking."
  - type: "component"
    name: "Migration Manager"
    technology: "Flyway / Liquibase"
    description: "Schema version control integration."
  - type: "component"
    name: "Read Replica Routing Logic"
    technology: "PostgreSQL Streaming Replication / TCP"
    description: "Offloads read queries to regional replicas."
relationships:
  - source: "Order & Checkout Service"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Persists transactional data via [JDBC / TCP]."
  - source: "Catalog & Search Service"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Reads catalogue data via [JDBC / SQL over TCP]."
  - source: "Data Privacy & User Service"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Manages profiles and compliance deletions via [SQL over TCP]."
  - source: "Payment & Currency Service"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Persists transaction records via [ADO.NET / SQL over TCP]."
  - source: "Recommendation & Review Service"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Reads history for feature extraction via [Psycopg2 / TCP]."
  - source: "Admin & Content Management Service"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Executes updates via [JDBC / SQL over TCP]."
  - source: "Async Worker Service"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Updates job states via [JDBC / SQL over TCP]."
  - source: "Amazon RDS Primary"
    destination: "Amazon RDS Read Replicas"
    description: "Replicates data via [PostgreSQL Streaming Replication / TCP]."