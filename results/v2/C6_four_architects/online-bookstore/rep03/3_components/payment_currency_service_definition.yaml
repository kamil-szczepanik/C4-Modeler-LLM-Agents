level: component
scope: "Component diagram for the Payment & Currency Service container"
parentContainer:
  name: "Payment & Currency Service"
elements:
  - type: "component"
    name: "Payment Controller"
    technology: "ASP.NET Core Web API"
    description: "Handling incoming routing requests."
  - type: "component"
    name: "Transaction Manager Component"
    technology: "C# MediatR / Entity Framework Core"
    description: "Managing payment execution and idempotency."
  - type: "component"
    name: "Stripe & PayPal Gateway Adapter"
    technology: "C# HTTP Client"
    description: "Abstracting third-party payment providers."
  - type: "component"
    name: "Currency Exchange Component"
    technology: ".NET background service"
    description: "Managing multi-currency conversions."
  - type: "component"
    name: "Payment Audit & Tokenization Component"
    technology: ".NET Core security middleware"
    description: "Handling PCI-DSS data sanitization."
  - type: "component"
    name: "Webhook Receiver Component"
    technology: "ASP.NET Core Web API"
    description: "Ingesting asynchronous payment provider events."
relationships:
  - source: "Payment Controller"
    destination: "Transaction Manager Component"
    description: "Invokes command handlers [In-process]"
  - source: "Transaction Manager Component"
    destination: "Stripe & PayPal Gateway Adapter"
    description: "Executes payment calls [HTTPS Egress]"
  - source: "Transaction Manager Component"
    destination: "Payment Audit & Tokenization Component"
    description: "Forwards sanitized records [In-process]"
  - source: "Payment Audit & Tokenization Component"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Persists ledger and audit logs [ADO.NET / TLS]"
  - source: "Currency Exchange Component"
    destination: "Amazon ElastiCache (Redis)"
    description: "Reads/writes cached rates [Redis Protocol over TCP]"
  - source: "Stripe/PayPal"
    destination: "Webhook Receiver Component"
    description: "Delivers asynchronous notifications [HTTPS Ingress]"
  - source: "Webhook Receiver Component"
    destination: "Amazon SQS"
    description: "Publishes raw payment events [AWS SDK / HTTPS]"