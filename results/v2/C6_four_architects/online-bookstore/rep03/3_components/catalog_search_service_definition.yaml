level: component
scope: "Component diagram for the Catalog & Search Service container"
parentContainer:
  name: "Catalog & Search Service"
elements:
  - type: "component"
    name: "Search Controller"
    technology: "Spring Boot"
    description: "Handles incoming search requests for books."
  - type: "component"
    name: "Catalog Controller"
    technology: "Spring Boot"
    description: "Manages catalog retrieval and product details endpoints."
  - type: "component"
    name: "Search Service"
    technology: "Spring Boot"
    description: "Contains business logic for search and filtering operations."
  - type: "component"
    name: "Catalog Manager"
    technology: "Spring Boot"
    description: "Orchestrates catalog domain operations and data access."
  - type: "component"
    name: "Catalog Cache Manager"
    technology: "Spring Boot, Amazon ElastiCache (Redis)"
    description: "Manages caching for search and catalogue data to ensure sub-second retrieval."
  - type: "component"
    name: "Event Consumer"
    technology: "Spring Boot, Amazon SQS"
    description: "Handles asynchronous event ingestion and synchronization."
  - type: "component"
    name: "Search Indexer"
    technology: "Spring Boot, Amazon OpenSearch"
    description: "Updates and queries catalogue search indices."
  - type: "component"
    name: "Catalog Domain Model"
    technology: "Java"
    description: "Represents the core catalog domain entities and business rules."
  - type: "component"
    name: "Catalog Security/Validation Interceptor"
    technology: "Spring AOP"
    description: "Provides security validation and interception for catalog requests."
  - type: "component"
    name: "Catalog Circuit Breaker"
    technology: "Resilience4j"
    description: "Ensures resilience and fault tolerance for catalog operations."
  - type: "component"
    name: "Catalog Metrics & Telemetry Interceptor"
    technology: "Micrometer"
    description: "Exposes operational telemetry and metrics."
relationships:
  - source: "Search Controller"
    destination: "Search Service"
    description: "Delegates search queries"
  - source: "Catalog Controller"
    destination: "Catalog Manager"
    description: "Delegates catalogue management requests"
  - source: "Search Service"
    destination: "Search Indexer"
    description: "Queries search indices"
  - source: "Catalog Manager"
    destination: "Catalog Cache Manager"
    description: "Checks and updates cache"
  - source: "Catalog Manager"
    destination: "Catalog Domain Model"
    description: "Uses domain models"
  - source: "Event Consumer"
    destination: "Catalog Manager"
    description: "Triggers domain updates from async events"