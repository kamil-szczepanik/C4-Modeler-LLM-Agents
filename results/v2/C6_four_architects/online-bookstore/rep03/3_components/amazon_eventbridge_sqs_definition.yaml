level: component
scope: "Component diagram for the Amazon EventBridge & SQS container"
parentContainer:
  name: "Amazon EventBridge & SQS"
elements:
  - type: "component"
    name: "Event Bus"
    technology: "Amazon EventBridge"
    description: "Central JSON-based event router for domain events."
  - type: "component"
    name: "Event Rules & Targets"
    technology: "Amazon EventBridge Rules"
    description: "Filters and routes events based on patterns."
  - type: "component"
    name: "Event Archive & Replay"
    technology: "Amazon EventBridge Archive"
    description: "Stores events for retention, auditing, and lineage to maintain compliance with GDPR and CCPA."
  - type: "component"
    name: "Order Processing Queue"
    technology: "Amazon SQS Standard/FIFO"
    description: "Decouples services and buffers spike traffic."
  - type: "component"
    name: "Dead Letter Queue"
    technology: "Amazon SQS"
    description: "Captures poisoned or failed messages to isolate failures and ensure audit compliance."
relationships:
  - source: "Order & Checkout Service"
    destination: "Event Bus"
    description: "Publishes domain events via AWS SDK/HTTPS"
  - source: "Event Bus"
    destination: "Order Processing Queue"
    description: "Routes filtered events via EventBridge Rules"
  - source: "Event Bus"
    destination: "Event Archive & Replay"
    description: "Retains events for GDPR/CCPA audit"
  - source: "Async Worker Service"
    destination: "Order Processing Queue"
    description: "Polls via Long Polling / AWS SDK"
  - source: "Order Processing Queue"
    destination: "Dead Letter Queue"
    description: "Redrives poisoned messages"