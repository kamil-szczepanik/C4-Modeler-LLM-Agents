level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Customer"
    description: "End user who browses, purchases physical and electronic books, leaves reviews, and manages their cart."
  - type: "person"
    name: "Store Administrator"
    description: "System administrator managing catalog, orders, and platform operations."
  - type: "externalSystem"
    name: "Stripe/PayPal"
    description: "External payment gateway services for secure financial transactions."
  - type: "externalSystem"
    name: "UPS/FedEx"
    description: "External logistics and shipping providers for physical book fulfillment."
  - type: "externalSystem"
    name: "Avalara"
    description: "External tax calculation service for compliance."
  - type: "externalSystem"
    name: "AWS Personalize"
    description: "Machine learning service for personalized book recommendations."
  - type: "externalSystem"
    name: "AWS Fraud Detector"
    description: "Fraud detection service to secure transactions and user activity."
  - type: "container"
    name: "React Single Page Application"
    technology: "React, Amazon S3, Amazon CloudFront"
    description: "Frontend SPA hosted on Amazon S3 and served via Amazon CloudFront for global content delivery."
  - type: "container"
    name: "Amazon API Gateway"
    technology: "AWS API Gateway"
    description: "Edge service for routing, rate limiting, and JWT validation."
  - type: "container"
    name: "Catalog & Search Service"
    technology: "Spring Boot"
    description: "Manages catalog browsing and search capabilities."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Node.js"
    description: "Handles order processing and checkout flows."
  - type: "container"
    name: "Payment & Currency Service"
    technology: ".NET Core"
    description: "Processes multi-currency payments and financial transactions."
  - type: "container"
    name: "Recommendation & Review Service"
    technology: "Python"
    description: "Delivers recommendations and user reviews."
  - type: "container"
    name: "Data Privacy & User Service"
    technology: "Python"
    description: "Manages user data and ensures GDPR compliance."
  - type: "container"
    name: "Admin & Content Management Service"
    technology: ".NET Core"
    description: "Administers content and platform management operations."
  - type: "container"
    name: "Async Worker Service"
    technology: "Python"
    description: "Processes asynchronous background tasks and workflows."
  - type: "container"
    name: "Amazon RDS (PostgreSQL)"
    technology: "Amazon RDS, PostgreSQL"
    description: "Relational database for structured data storage."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "NoSQL data store for shopping carts and high-scale data."
  - type: "container"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache, Redis"
    description: "In-memory caching layer for low-latency search and currency caching."
  - type: "container"
    name: "Amazon OpenSearch"
    technology: "Amazon OpenSearch"
    description: "Search engine for catalogue indexing and discovery."
  - type: "container"
    name: "Amazon EventBridge & SQS"
    technology: "Amazon EventBridge, Amazon SQS"
    description: "Event-driven messaging and integration bus for asynchronous workflows."
relationships:
  - source: "Customer"
    destination: "React Single Page Application"
    description: "Browses catalogue and interacts with the storefront"
    technology: "HTTPS via CloudFront"
  - source: "Store Administrator"
    destination: "React Single Page Application"
    description: "Manages store administration and content"
    technology: "HTTPS via CloudFront"
  - source: "React Single Page Application"
    destination: "Amazon API Gateway"
    description: "Sends HTTPS API requests for data and actions"
    technology: "HTTPS"
  - source: "Amazon API Gateway"
    destination: "Catalog & Search Service"
    description: "Routes catalog and search requests"
    technology: "gRPC / HTTPS over TLS"
  - source: "Amazon API Gateway"
    destination: "Order & Checkout Service"
    description: "Routes order and checkout operations"
    technology: "gRPC / HTTPS over TLS"
  - source: "Amazon API Gateway"
    destination: "Payment & Currency Service"
    description: "Routes payment and currency requests"
    technology: "gRPC / HTTPS over TLS"
  - source: "Amazon API Gateway"
    destination: "Recommendation & Review Service"
    description: "Routes recommendation and review queries"
    technology: "gRPC / HTTPS over TLS"
  - source: "Amazon API Gateway"
    destination: "Data Privacy & User Service"
    description: "Routes user and GDPR compliance requests"
    technology: "gRPC / HTTPS over TLS"
  - source: "Amazon API Gateway"
    destination: "Admin & Content Management Service"
    description: "Routes admin operations"
    technology: "gRPC / HTTPS over TLS"
  - source: "Order & Checkout Service"
    destination: "Stripe/PayPal"
    description: "Processes payment transactions"
    technology: "HTTPS Egress"
  - source: "Payment & Currency Service"
    destination: "Stripe/PayPal"
    description: "Processes multi-currency payments"
    technology: "HTTPS Egress"
  - source: "Order & Checkout Service"
    destination: "Avalara"
    description: "Calculates taxes"
    technology: "HTTPS Egress"
  - source: "Order & Checkout Service"
    destination: "UPS/FedEx"
    description: "Coordinates shipment and fulfillment"
    technology: "HTTPS Egress"
  - source: "Recommendation & Review Service"
    destination: "AWS Personalize"
    description: "Fetches personalized recommendations"
    technology: "HTTPS Egress"
  - source: "Order & Checkout Service"
    destination: "AWS Fraud Detector"
    description: "Screens transactions for fraud"
    technology: "HTTPS Egress"
  - source: "Catalog & Search Service"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Reads and writes relational catalogue data"
    technology: "JDBC / SQL over TCP"
  - source: "Catalog & Search Service"
    destination: "Amazon OpenSearch"
    description: "Queries catalogue search indices"
    technology: "TCP"
  - source: "Order & Checkout Service"
    destination: "Amazon DynamoDB"
    description: "Manages shopping carts and order data"
    technology: "NoSQL API over TCP"
  - source: "Payment & Currency Service"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches currency rates and session data"
    technology: "Redis Protocol over TCP"
  - source: "Catalog & Search Service"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches search and catalogue data"
    technology: "Redis Protocol over TCP"
  - source: "Order & Checkout Service"
    destination: "Amazon EventBridge & SQS"
    description: "Publishes and consumes order processing events"
    technology: "Event-driven Messaging"
  - source: "Async Worker Service"
    destination: "Amazon EventBridge & SQS"
    description: "Processes asynchronous background tasks"
    technology: "Event-driven Messaging"