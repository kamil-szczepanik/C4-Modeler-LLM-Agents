level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Customer"
    description: "End user who browses the catalogue, manages a cart, makes purchases, and leaves reviews."
  - type: "person"
    name: "Admin Staff"
    description: "Staff member who manages catalogue, orders, and administrative tasks."
  - type: "externalSystem"
    name: "Amazon Cognito"
    description: "Authentication and user management identity provider."
  - type: "container"
    name: "Customer SPA"
    technology: "React, Amazon S3, CloudFront"
    description: "Frontend single-page application for customers to browse, checkout, and view recommendations."
  - type: "container"
    name: "Admin SPA"
    technology: "React, Amazon S3, CloudFront"
    description: "Frontend single-page application for administrative staff."
  - type: "container"
    name: "AWS API Gateway"
    technology: "AWS API Gateway, AWS WAF"
    description: "Edge API gateway routing traffic and protecting against threats using WAF."
  - type: "container"
    name: "Catalog & Search Service"
    technology: "Spring Boot, OpenSearch"
    description: "Handles book catalogue management and keyword search."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Node.js"
    description: "Processes customer orders and secure checkouts."
  - type: "container"
    name: "Recommendation Service"
    technology: "Python, FastAPI"
    description: "Generates personalized book recommendations."
  - type: "container"
    name: "Async Worker"
    technology: "Container"
    description: "Processes asynchronous background tasks and events."
  - type: "container"
    name: "Digital Asset Delivery Service"
    technology: "Go"
    description: "Secures and delivers digital assets and e-books."
  - type: "container"
    name: "Amazon EventBridge & SQS"
    technology: "Amazon EventBridge, AWS SQS"
    description: "Asynchronous event bus for domain decoupling."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL, Global Tables"
    description: "Multi-region relational database for transactional integrity."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "NoSQL database supporting recommendations and scale."
  - type: "container"
    name: "Redis ElastiCache"
    technology: "Redis, ElastiCache"
    description: "In-memory data store for session management and caching."
  - type: "container"
    name: "Amazon S3 Digital Assets"
    technology: "Amazon S3, CloudFront Signed URLs"
    description: "Storage bucket hosting secure digital e-book assets."
  - type: "container"
    name: "AWS Distro for OpenTelemetry"
    technology: "ADOT Sidecar"
    description: "Observability sidecar for distributed tracing."
relationships:
  - source: "Customer"
    destination: "Customer SPA"
    description: "Interacts via browser for catalog browsing, checkout, and reviews."
    technology: "HTTPS"
  - source: "Admin Staff"
    destination: "Admin SPA"
    description: "Interacts via browser for administrative operations."
    technology: "HTTPS"
  - source: "Customer SPA"
    destination: "AWS API Gateway"
    description: "Sends API requests and communicates via web sockets."
    technology: "HTTPS/WSS"
  - source: "Admin SPA"
    destination: "AWS API Gateway"
    description: "Sends administrative API requests."
    technology: "HTTPS/WSS"
  - source: "Customer SPA"
    destination: "Amazon Cognito"
    description: "Authenticates users via OIDC."
    technology: "HTTPS/OIDC"
  - source: "Admin SPA"
    destination: "Amazon Cognito"
    description: "Authenticates admin users via OIDC."
    technology: "HTTPS/OIDC"
  - source: "AWS API Gateway"
    destination: "Catalog & Search Service"
    description: "Routes internal traffic to catalog backend."
    technology: "gRPC over TLS / HTTPS"
  - source: "AWS API Gateway"
    destination: "Order & Checkout Service"
    description: "Routes internal traffic to order backend."
    technology: "gRPC over TLS / HTTPS"
  - source: "AWS API Gateway"
    destination: "Recommendation Service"
    destination: "Routes internal traffic to recommendation backend."
    technology: "gRPC over TLS / HTTPS"
  - source: "AWS API Gateway"
    destination: "Digital Asset Delivery Service"
    description: "Routes internal traffic to digital asset backend."
    technology: "gRPC over TLS / HTTPS"
  - source: "Order & Checkout Service"
    destination: "Amazon EventBridge & SQS"
    description: "Publishes asynchronous events."
    technology: "AWS SDK / API"
  - source: "Amazon EventBridge & SQS"
    destination: "Async Worker"
    description: "Triggers background tasks."
    technology: "AWS SDK / Queue Messaging"
  - source: "Amazon EventBridge & SQS"
    destination: "Digital Asset Delivery Service"
    description: "Triggers post-checkout asset delivery events."
    technology: "AWS SDK / Queue Messaging"
  - source: "Catalog & Search Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes transactional catalog data."
    technology: "Native Database Protocol over VPC"
  - source: "Order & Checkout Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes order and transactional data."
    technology: "Native Database Protocol over VPC"
  - source: "Recommendation Service"
    destination: "Amazon DynamoDB"
    description: "Reads recommendation data."
    technology: "Native Database Protocol over VPC"
  - source: "Order & Checkout Service"
    destination: "Redis ElastiCache"
    description: "Manages user sessions and caching."
    technology: "Redis Protocol over VPC"
  - source: "Customer"
    destination: "Amazon S3 Digital Assets"
    description: "Downloads e-books securely using CloudFront Signed URLs."
    technology: "HTTPS / CloudFront"