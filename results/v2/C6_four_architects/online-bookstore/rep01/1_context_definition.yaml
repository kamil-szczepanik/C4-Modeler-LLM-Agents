level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "An Amazon-style e-commerce online bookstore for physical and e-books handling multi-currency transactions, catalogue search, recommendations, and reviews at 1M MAU."
elements:
  - type: "person"
    name: "Customer"
    description: "End user who browses the catalogue, manages a cart, makes purchases, and leaves reviews."
  - type: "person"
    name: "Admin/Support Staff"
    description: "Staff member who manages catalogue, orders, and customer support operations."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe/PayPal integration for processing multi-currency transactions."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "External shipping services for fulfilling physical book deliveries."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Auth0/Cognito for authentication and user management."
  - type: "externalSystem"
    name: "Notification Service"
    description: "SES/SendGrid for sending emails and notifications."
  - type: "externalSystem"
    name: "Recommendation Service"
    description: "Amazon Personalize for generating book recommendations."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "Avalara/TaxJar for calculating applicable transaction taxes."
relationships:
  - source: "Customer"
    destination: "Online Bookstore"
    description: "Uses the bookstore via HTTPS for browsing, purchasing, and managing account."
    technology: "HTTPS"
  - type: "person"
    name: "Admin/Support Staff"
  - source: "Admin/Support Staff"
    destination: "Online Bookstore"
    description: "Manages system operations, catalogue, and support tasks."
    technology: "HTTPS"
  - source: "Online Bookstore"
    destination: "Payment Gateway"
    description: "Calls payment gateway to process transactions."
    technology: "HTTPS/REST"
  - source: "Online Bookstore"
    destination: "Shipping Provider APIs"
    description: "Calls shipping APIs to manage order fulfillment."
    technology: "HTTPS/REST"
  - source: "Online Bookstore"
    destination: "Identity Provider"
    description: "Authenticates users via identity provider."
    technology: "HTTPS/REST"
  - source: "Online Bookstore"
    destination: "Notification Service"
    description: "Triggers notifications and emails."
    technology: "HTTPS/REST"
  - source: "Online Bookstore"
    destination: "Recommendation Service"
    description: "Fetches personalized book recommendations."
    technology: "HTTPS/REST"
  - source: "Online Bookstore"
    destination: "Tax Calculation Service"
    description: "Calculates taxes for transactions."
    technology: "HTTPS/REST"