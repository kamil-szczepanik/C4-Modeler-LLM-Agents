level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "API Router"
    technology: "Python, FastAPI"
    description: "Handles incoming HTTP/REST requests and routes them to internal components."
  - type: "component"
    name: "Recommendation Engine"
    technology: "Python, Scikit-Learn, Pandas, NumPy"
    description: "Powers vectorization, collaborative filtering logic, and real-time recommendations."
  - type: "component"
    name: "Model Cache Manager"
    technology: "Python"
    description: "Manages caching layers to deliver sub-millisecond model responses."
  - type: "component"
    name: "Data Access Layer"
    technology: "Python, AWS SDK"
    description: "Interacts with data stores for cold-start seeding and item affinity graphs."
  - type: "component"
    name: "Telemetry Interceptor"
    technology: "Python, OpenTelemetry"
    description: "Captures distributed tracing telemetry and forwards it locally."
  - type: "component"
    name: "Feature Extractor"
    technology: "Python, NumPy, Pandas"
    description: "Extracts and transforms features for the recommendation algorithms."
relationships:
  - source: "API Router"
    destination: "Recommendation Engine"
    description: "Delegates recommendation requests"
  - source: "Recommendation Engine"
    destination: "Model Cache Manager"
    description: "Retrieves cached models and inference data"
  - source: "Model Cache Manager"
    destination: "Redis ElastiCache"
    description: "Reads/writes cached model data via TCP"
  - source: "Recommendation Engine"
    destination: "Amazon S3"
    description: "Fetches serialized machine learning models via HTTPS"
  - source: "Data Access Layer"
    destination: "Amazon DynamoDB"
    description: "Accesses item affinity graphs restricted to cold-start seeding via HTTPS"
  - source: "Telemetry Interceptor"
    destination: "AWS Distro for OpenTelemetry"
    description: "Sends tracing data via OTLP/gRPC over local loopback"
  - source: "API Router"
    destination: "Feature Extractor"
    description: "Passes input parameters for feature extraction"
  - source: "Feature Extractor"
    destination: "Recommendation Engine"
    description: "Provides processed feature vectors"