level: component
scope: "Component diagram for the Amazon EventBridge & SQS container"
parentContainer:
  name: "Amazon EventBridge & SQS"
elements:
  - type: "component"
    name: "Event Bus"
    technology: "Amazon EventBridge"
    description: "Publishes and routes domain events across the system."
  - type: "component"
    name: "Checkout Queue"
    technology: "Amazon SQS"
    description: "Buffers checkout events for asynchronous background execution."
  - type: "component"
    name: "Digital Asset Queue"
    technology: "Amazon SQS"
    description: "Buffers events to provision digital asset downloads."
  - type: "component"
    name: "Notification Queue"
    technology: "Amazon SQS"
    description: "Buffers events for sending user notifications."
  - type: "component"
    name: "General DLQ"
    technology: "Amazon SQS"
    description: "Receives failed messages after maximum retries for operational inspection."
  - type: "component"
    name: "Event Archive"
    technology: "Amazon EventBridge Archive"
    description: "Archives domain events for auditing and replay capabilities."
  - type: "component"
    name: "Cross-Region Event Rule"
    technology: "Amazon EventBridge Rule"
    description: "Replicates critical domain events across regions."
  - type: "component"
    name: "CloudWatch Alarms"
    technology: "Amazon CloudWatch"
    description: "Monitors queue depth and operational metrics for DLQ and messaging."
  - type: "component"
    name: "SQS KMS Encryption"
    technology: "AWS KMS"
    description: "Provides encryption at rest for SQS queues."
relationships:
  - source: "Event Bus"
    destination: "Checkout Queue"
    description: "Forwards filtered checkout domain events"
  - source: "Event Bus"
    destination: "Digital Asset Queue"
    description: "Forwards filtered digital asset events"
  - source: "Event Bus"
    destination: "Notification Queue"
    description: "Forwards filtered notification events"
  - source: "Event Bus"
    destination: "Cross-Region Event Rule"
    description: "Triggers cross-region event replication"
  - source: "Checkout Queue"
    destination: "General DLQ"
    description: "Forwards failed messages after max retries via redrive policy"
  - source: "Digital Asset Queue"
    destination: "General DLQ"
    description: "Forwards failed messages after max retries via redrive policy"
  - source: "Notification Queue"
    destination: "General DLQ"
    description: "Forwards failed messages after max retries via redrive policy"
  - source: "General DLQ"
    destination: "CloudWatch Alarms"
    description: "Emits depth metrics for operational monitoring"