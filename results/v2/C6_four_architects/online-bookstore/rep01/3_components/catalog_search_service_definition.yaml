level: component
scope: "Component diagram for the Catalog & Search Service container"
parentContainer:
  name: "Catalog & Search Service"
elements:
  - type: "component"
    name: "Search Controller"
    technology: "Spring Boot REST Controller"
    description: "Exposes REST endpoints for catalog browsing and full-text search queries."
  - type: "component"
    name: "Catalog Service"
    technology: "Spring Boot Service"
    description: "Handles business logic for book catalog management and item retrieval."
  - type: "component"
    name: "Search Indexer"
    technology: "Spring Boot Service"
    description: "Synchronizes product data with the search index for fast text retrieval."
relationships:
  - source: "Search Controller"
    destination: "Catalog Service"
    description: "Delegates catalog queries"
  - source: "Catalog Service"
    destination: "Search Indexer"
    description: "Triggers index updates"