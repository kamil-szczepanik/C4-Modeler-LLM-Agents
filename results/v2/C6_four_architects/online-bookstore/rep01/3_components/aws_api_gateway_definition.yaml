level: component
scope: "Component diagram for the AWS API Gateway container"
parentContainer:
  name: "AWS API Gateway"
elements:
  - type: "component"
    name: "API Router & WAF Integration"
    technology: "AWS WAF & API Gateway"
    description: "Inspects inbound client traffic, enforces edge security, and mitigates OWASP Top-10 threats."
  - type: "component"
    name: "Authentication & Authorization Middleware"
    technology: "Node.js / Lambda Authorizer"
    description: "Validates stateless JWT tokens for inbound client requests."
  - type: "component"
    name: "Internal Routing Proxy"
    technology: "AWS API Gateway gRPC Proxy"
    description: "Routes verified requests to internal microservices using gRPC over TLS."
relationships:
