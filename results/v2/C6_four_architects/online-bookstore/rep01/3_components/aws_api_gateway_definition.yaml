    description: "Passes inbound requests for token validation"
  - source: "Authentication & Authorization Middleware"
    destination: "Internal Routing Proxy"
    description: "Forwards authorized requests"
  - source: "Internal Routing Proxy"
    destination: "Catalog & Search Service"
    description: "Internal routing [gRPC over TLS]"
  - source: "Internal Routing Proxy"
    destination: "Order & Checkout Service"
    description: "Internal routing [gRPC over TLS]"
  - source: "Internal Routing Proxy"
    destination: "Recommendation Service"
    description: "Internal routing [gRPC over TLS]"
  - source: "Internal Routing Proxy"
    destination: "Digital Asset Delivery Service"
    description: "Internal routing [gRPC over TLS]"