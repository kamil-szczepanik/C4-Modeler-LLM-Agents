level: component
scope: "Component diagram for the Amazon S3 Digital Assets container"
parentContainer:
  name: "Amazon S3 Digital Assets"
elements:
  - type: "component"
    name: "Customer SPA"
    technology: "React, Amazon S3, CloudFront"
    description: "Customer single-page application for browsing and managing book orders."
  - type: "component"
    name: "Order & Checkout Service"
    technology: "Node.js"
    description: "Handles order processing and purchase entitlement validation."
  - type: "component"
    name: "Asset Management Controller"
    technology: "Go / AWS Lambda"
    description: "Manages asset requests and coordinates download tokens."
  - type: "component"
    name: "CloudFront Signer Component"
    technology: "Go SDK"
    description: "Generates signed URLs for secure e-book delivery."
  - type: "component"
    name: "S3 Private Storage Bucket"
    technology: "Amazon S3, AES-256"
    description: "Encrypted private object storage for binary e-book assets."
  - type: "component"
    name: "Access Audit Monitor"
    technology: "Amazon CloudFront Standard Logs / CloudWatch"
    description: "Monitors access and logs delivery metrics."
  - type: "component"
    name: "Bucket Policy Enforcer"
    technology: "AWS IAM / S3 Bucket Policy"
    description: "Enforces strict bucket policies preventing public access."
relationships:
  - source: "Customer SPA"
    destination: "Asset Management Controller"
    description: "Requests download token via [HTTPS / REST]"
  - source: "Asset Management Controller"
    destination: "CloudFront Signer Component"
    description: "Requests signed URL generation via [In-process Go function]"
  - source: "CloudFront Signer Component"
    destination: "Order & Checkout Service"
    description: "Validates purchase entitlement via [gRPC / HTTPS]"
  - source: "CloudFront Edge"
    destination: "S3 Private Storage Bucket"
    description: "Retrieves objects via [HTTPS / AWS IAM Origin Access Control (OAC)]"