level: component
scope: "Component diagram for the Amazon DynamoDB container"
parentContainer:
  name: "Amazon DynamoDB"
elements:
  - type: "component"
    name: "Recommendation Store Table"
    technology: "Amazon DynamoDB"
    description: "Stores recommendation data with Partition Key CustomerID and Sort Key ProductID."
  - type: "component"
    name: "Customer Session State Table"
    technology: "Amazon DynamoDB"
    description: "TTL-enabled cart persistence table for managing active shopping carts."
  - type: "component"
    name: "Customer Reviews & Ratings Table"
    technology: "Amazon DynamoDB"
    description: "Stores product reviews and ratings with Partition Key ProductID and Sort Key ReviewID."
  - type: "component"
    name: "Idempotency & Lock Table"
    technology: "Amazon DynamoDB"
    description: "Verifies transaction states using Partition Key OperationID."
relationships:
  - source: "Recommendation Service"
    destination: "Recommendation Store Table"
    description: "Reads recommendation data via Native Database Protocol over VPC."
  - source: "Order & Checkout Service"
    destination: "Customer Session State Table"
    description: "Persists active shopping carts via Native AWS SDK over VPC, HTTPS/TLS."
  - source: "Catalog & Search Service"
    destination: "Customer Reviews & Ratings Table"
    description: "Fetches product reviews and ratings via Native AWS SDK over VPC, HTTPS/TLS."
  - source: "Order & Checkout Service"
    destination: "Idempotency & Lock Table"
    description: "Verifies transaction states via Native AWS SDK over VPC, HTTPS/TLS."