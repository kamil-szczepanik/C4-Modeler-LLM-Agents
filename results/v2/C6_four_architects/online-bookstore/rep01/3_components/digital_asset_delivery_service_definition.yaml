level: component
scope: "Component diagram for the Digital Asset Delivery Service container"
parentContainer:
  name: "Digital Asset Delivery Service"
elements:
  - type: "component"
    name: "API Handler Component"
    technology: "Go (net/http)"
    description: "Handles incoming HTTP requests for digital asset delivery."
  - type: "component"
    name: "Entitlement Verifier Component"
    technology: "Go"
    description: "Verifies user licenses and purchase entitlements."
  - type: "component"
    name: "Asset Cache Manager Component"
    technology: "Go"
    description: "Manages caching to bypass redundant asset verification and processing."
  - type: "component"
    name: "Watermarking Component"
    technology: "Go"
    description: "Applies dynamic watermarks to digital assets."
  - type: "component"
    name: "Signed URL Generator Component"
    technology: "Go"
    description: "Generates time-limited signed URLs for secure asset downloads."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Go"
    description: "Handles GDPR-compliant audit logging asynchronously."
  - type: "component"
    name: "Redis ElastiCache"
    technology: "Redis ElastiCache"
    description: "Provides fast in-memory caching for assets and verification."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Stores reliable purchase and entitlement records."
  - type: "component"
    name: "Amazon S3 Digital Assets"
    technology: "Amazon S3 & CloudFront"
    description: "Delivers secure, scalable cloud storage for e-books and digital assets."
  - type: "component"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Handles asynchronous, non-blocking event publishing for audit compliance."
relationships:
  - source: "API Handler Component"
    destination: "Entitlement Verifier Component"
    description: "In-memory function call"
  - source: "Entitlement Verifier Component"
    destination: "Asset Cache Manager Component"
    description: "In-memory function call"
  - source: "Asset Cache Manager Component"
    destination: "Redis ElastiCache"
    description: "TCP/TLS using go-redis"
  - source: "Entitlement Verifier Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "TCP/TLS using database/sql"
  - source: "Entitlement Verifier Component"
    destination: "Watermarking Component"
    description: "In-memory function call"
  - source: "Watermarking Component"
    destination: "Amazon S3 Digital Assets"
    description: "HTTPS using aws-sdk-go-v2"
  - source: "Watermarking Component"
    destination: "Signed URL Generator Component"
    description: "In-memory function call"
  - source: "Signed URL Generator Component"
    destination: "Amazon S3 Digital Assets"
    description: "HTTPS using aws-sdk-go-v2"
  - source: "Audit Logger Component"
    destination: "Amazon SQS"
    description: "HTTPS using aws-sdk-go-v2"