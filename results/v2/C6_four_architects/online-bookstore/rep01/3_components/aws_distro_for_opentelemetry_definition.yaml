level: component
scope: "Component diagram for the AWS Distro for OpenTelemetry container"
parentContainer:
  name: "AWS Distro for OpenTelemetry"
elements:
  - type: "component"
    name: "ADOT Collector Core"
    technology: "OpenTelemetry Collector"
    description: "Receives, processes, and exports traces and metrics gathered from application containers."
  - type: "component"
    name: "OTLP Receiver"
    technology: "gRPC/HTTP"
    description: "Ingecsts local telemetry from application containers via OTLP on ports 4317/4318."
  - type: "component"
    name: "X-Ray Exporter"
    technology: "HTTPS"
    description: "Persists trace data to AWS X-Ray."
  - type: "component"
    name: "Prometheus Exporter"
    technology: "HTTP Remote Write"
    description: "Aggregates and pushes metric data to Amazon Managed Service for Prometheus."
  - type: "component"
    name: "IMDSv2 Connector"
    technology: "HTTP (TCP port 80)"
    description: "Fetches runtime environment context from AWS IMDSv2."
relationships:
  - source: "OTLP Receiver"
    destination: "ADOT Collector Core"
    description: "Passes ingested telemetry data for processing"
  - source: "ADOT Collector Core"
    destination: "X-Ray Exporter"
    description: "Sends processed traces"
  - source: "ADOT Collector Core"
    destination: "Prometheus Exporter"
    description: "Sends aggregated metrics"
  - source: "ADOT Collector Core"
    destination: "IMDSv2 Connector"
    description: "Enriches telemetry with runtime context"