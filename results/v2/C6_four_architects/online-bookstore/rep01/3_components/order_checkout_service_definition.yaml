level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "API Controller Component"
    technology: "NestJS"
    description: "Enforces strict DTO validation, modular architecture, and OWASP Top-10 security postures."
  - type: "component"
    name: "Idempotency Manager Component"
    technology: "Node.js / TypeScript"
    description: "Validates request tokens synchronously and interacts with Redis for cryptographic request hashes."
  - type: "component"
    name: "Cart Manager Component"
    technology: "TypeScript"
    description: "Manages session and cart state and snapshots cart data upon checkout."
  - type: "component"
    name: "Checkout Orchestrator Component"
    technology: "TypeScript with Saga pattern"
    description: "Coordinates distributed transactions across third-party services using resilience patterns."
  - type: "component"
    name: "Order Repository Component"
    technology: "TypeORM / Prisma"
    description: "Encapsulates ACID-compliant data access patterns to PostgreSQL."
  - type: "component"
    name: "Event Publisher Component"
    technology: "AWS SDK"
    description: "Dispatches domain events to messaging infrastructure."
  - type: "component"
    name: "AWS API Gateway"
    technology: "AWS API Gateway"
    description: "External system routing internal traffic."
  - type: "component"
    name: "Redis ElastiCache"
    technology: "Redis ElastiCache"
    description: "Delivers low-latency session caching and atomic idempotency checks."
  - type: "component"
    name: "Payment Gateway"
    technology: "HTTPS / REST"
    description: "Authorizes and captures payments."
  - type: "component"
    name: "Tax Calculation Service"
    technology: "HTTPS / REST"
    description: "Calculates dynamic taxes."
  - type: "component"
    name: "Shipping Provider APIs"
    technology: "HTTPS / REST"
    description: "Generates shipping labels."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Persists order data."
  - type: "component"
    name: "Amazon EventBridge & SQS"
    technology: "Amazon EventBridge & SQS"
    description: "Messaging and event distribution system."
relationships:
  - source: "AWS API Gateway"
    destination: "API Controller Component"
    description: "Routes internal traffic [gRPC over TLS / HTTPS]"
  - source: "API Controller Component"
    destination: "Idempotency Manager Component"
    description: "Validates request tokens synchronously [In-memory TypeScript]"
  - source: "Idempotency Manager Component"
    destination: "Redis ElastiCache"
    description: "Checks/stores cryptographic request hashes [Redis Protocol over VPC]"
  - source: "Cart Manager Component"
    destination: "Redis ElastiCache"
    description: "Manages session and cart state [Redis Protocol over VPC]"
  - source: "Cart Manager Component"
    destination: "Order Repository Component"
    description: "Snapshots cart data upon checkout [TypeORM / Prisma]"
  - source: "Checkout Orchestrator Component"
    destination: "Payment Gateway"
    description: "Authorizes and captures payments [HTTPS / REST with Opossum Circuit Breaker]"
  - source: "Checkout Orchestrator Component"
    destination: "Tax Calculation Service"
    description: "Calculates dynamic taxes [HTTPS / REST with Opossum Circuit Breaker]"
  - source: "Checkout Orchestrator Component"
    destination: "Shipping Provider APIs"
    description: "Generates shipping labels [HTTPS / REST with Opossum Circuit Breaker]"
  - source: "Order Repository Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists order data [Native Database Protocol over VPC]"
  - source: "Event Publisher Component"
    destination: "Amazon EventBridge & SQS"
    description: "Dispatches domain events [AWS SDK / API]"