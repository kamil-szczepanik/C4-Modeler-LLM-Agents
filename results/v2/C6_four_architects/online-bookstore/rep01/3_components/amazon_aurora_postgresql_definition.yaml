level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL container"
parentContainer:
  name: "Amazon Aurora PostgreSQL"
elements:
  - type: "component"
    name: "Aurora PostgreSQL Writer Instance"
    technology: "Node"
    description: "Handles primary write operations and transactional integrity for the database."
  - type: "component"
    name: "Aurora PostgreSQL Reader Instances"
    technology: "Replica Nodes"
    description: "Handles read-only queries and supports read scaling across instances."
  - type: "component"
    name: "Aurora Storage Volume"
    technology: "Distributed Shared Storage with Aurora Global Databases"
    description: "Provides distributed, replicated storage spanning multiple AWS regions."
  - type: "component"
    name: "Row-Level Security & Encryption Module"
    technology: "PostgreSQL RLS & AWS KMS Integration"
    description: "Ensures GDPR/CCPA compliance via row-level security and data encryption."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer integration"
    description: "Manages database connections to prevent exhaustion during traffic spikes."
  - type: "component"
    name: "Logical Replication & CDC Engine"
    technology: "PostgreSQL Logical Replication"
    description: "Streams change data capture events to external AWS services."
  - type: "component"
    name: "Aurora Reader/Writer Endpoint Router"
    technology: "AWS RDS Endpoint Routing"
    description: "Routes incoming traffic to the appropriate writer or reader instances."
  - type: "system"
    name: "Order & Checkout Service"
    technology: "Microservice"
    description: "Manages orders and checkout workflows."
  - type: "system"
    name: "Catalog & Search Service"
    technology: "Microservice"
    description: "Manages product catalog and search functionalities."
  - type: "system"
    name: "Amazon EventBridge / SQS"
    technology: "AWS Event & Messaging Services"
    description: "Handles asynchronous messaging and event distribution."
  - type: "system"
    name: "AWS KMS"
    technology: "AWS Key Management Service"
    description: "Provides cryptographic keys for data encryption."
relationships:
  - source: "Order & Checkout Service"
    destination: "Aurora Reader/Writer Endpoint Router"
    description: "Native Database Protocol / TCP over VPC"
  - source: "Catalog & Search Service"
    destination: "Aurora Reader/Writer Endpoint Router"
    description: "Native Database Protocol / TCP over VPC"
  - source: "Aurora Reader/Writer Endpoint Router"
    destination: "Aurora PostgreSQL Writer Instance"
    description: "TCP"
  - source: "Aurora Reader/Writer Endpoint Router"
    destination: "Aurora PostgreSQL Reader Instances"
    description: "TCP"
  - source: "Aurora PostgreSQL Writer Instance"
    destination: "Aurora Storage Volume"
    description: "Distributed Storage Volume Protocol"
  - source: "Logical Replication & CDC Engine"
    destination: "Amazon EventBridge / SQS"
    description: "HTTPS / AWS SDK"
  - source: "Row-Level Security & Encryption Module"
    destination: "AWS KMS"
    description: "HTTPS / AWS API"