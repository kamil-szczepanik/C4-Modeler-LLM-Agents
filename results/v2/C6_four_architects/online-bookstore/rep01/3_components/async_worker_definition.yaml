level: component
scope: "Component diagram for the Async Worker container"
parentContainer:
  name: "Async Worker"
elements:
  - type: "component"
    name: "Event Router / Consumer"
    technology: "Python, Celery, AWS Lambda"
    description: "Ingests asynchronous events from SQS."
  - type: "component"
    name: "Task Processor"
    technology: "Python"
    description: "Executing business logic for notifications and shipping integrations."
  - type: "component"
    name: "Data Access Layer"
    technology: "SQLAlchemy"
    description: "Interacting with Amazon Aurora PostgreSQL."
  - type: "component"
    name: "State Manager"
    technology: "Python, Redis-Py"
    description: "Managing distributed locks via Redis ElastiCache."
  - type: "component"
    name: "DLQ Handler"
    technology: "Python"
    description: "Routing poisoned messages to an AWS SQS Dead Letter Queue."
  - type: "component"
    name: "Telemetry Publisher"
    technology: "Python, OpenTelemetry SDK"
    description: "Collecting metrics."
  - type: "component"
    name: "Worker Runtime Engine"
    technology: "AWS ECS on AWS Fargate"
    description: "Hosting the worker process."
  - type: "component"
    name: "Data Sanitizer / PII Masker"
    technology: "Python"
    description: "Masking sensitive customer data."
  - type: "component"
    name: "AWS SQS"
    technology: "Amazon SQS"
    description: "Message queueing for asynchronous decoupling."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Relational database for transactional updates."
  - type: "component"
    name: "State Manager Cache"
    technology: "Redis ElastiCache"
    description: "In-memory data store for distributed locks and deduplication."
  - type: "component"
    name: "External Shipping APIs"
    technology: "HTTPS / REST"
    description: "External shipping services."
  - type: "component"
    name: "Notification Service"
    technology: "gRPC or HTTPS / REST"
    description: "Service for sending notifications."
  - type: "component"
    name: "AWS SQS DLQ"
    technology: "Amazon SQS DLQ"
    description: "Dead-letter handling for asynchronous decoupling."
  - type: "component"
    name: "ADOT Sidecar"
    technology: "AWS Distro for OpenTelemetry"
    description: "Telemetry sidecar for distributed tracing and metrics."
relationships:
  - source: "AWS SQS"
    destination: "Event Router / Consumer"
    description: "Long-polling via AWS SDK (HTTPS)"
  - source: "Event Router / Consumer"
    destination: "Task Processor"
    description: "Internal thread pool dispatch"
  - source: "Task Processor"
    destination: "Amazon Aurora PostgreSQL"
    description: "SQL over TLS"
  - source: "Task Processor"
    destination: "State Manager"
    description: "Redis RESP over TLS"
  - source: "Task Processor"
    destination: "External Shipping APIs"
    description: "HTTPS / REST"
  - source: "Task Processor"
    destination: "Notification Service"
    description: "gRPC or HTTPS / REST"
  - source: "Event Router / Consumer"
    destination: "DLQ Handler"
    description: "Exception routing on max retry failures"
  - source: "DLQ Handler"
    destination: "AWS SQS DLQ"
    description: "AWS SDK (HTTPS)"
  - source: "Event Router / Consumer"
    destination: "Telemetry Publisher"
    description: "In-process function calls"
  - source: "Task Processor"
    destination: "Telemetry Publisher"
    description: "In-process function calls"
  - source: "Telemetry Publisher"
    destination: "ADOT Sidecar"
    description: "OTLP over gRPC"
  - source: "Task Processor"
    destination: "Data Sanitizer / PII Masker"
    description: "In-process function call"