level: component
scope: "Component diagram for the Customer SPA container"
parentContainer:
  name: "Customer SPA"
elements:
  - type: "component"
    name: "Catalog Module"
    technology: "React, Vite"
    description: "Handles book browsing and keyword search."
  - type: "component"
    name: "Checkout & Cart Module"
    technology: "React, Vite"
    description: "Manages shopping cart and secure checkout."
  - type: "component"
    name: "Reviews & Ratings Module"
    technology: "React, Vite"
    description: "Processes 5-star ratings and customer reviews."
  - type: "component"
    name: "Recommendation Display Module"
    technology: "React, Vite"
    description: "Renders \"Customers also bought\" suggestions."
  - type: "component"
    name: "Auth Context Provider"
    technology: "React, OIDC"
    description: "Manages user authentication via OIDC."
  - type: "component"
    name: "State Management Layer"
    technology: "Zustand"
    description: "Utilizes Zustand for local cart and UI state."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios"
    description: "Centralizes requests using Axios with interceptors."
  - type: "component"
    name: "Telemetry & Error Modules"
    technology: "React Error Boundaries, Web Vitals"
    description: "Captures web vitals and implements React Error Boundaries."
relationships:
  - source: "Checkout & Cart Module"
    destination: "State Management Layer"
    description: "Stores and retrieves cart state using"
  - source: "API Client Layer"
    destination: "AWS API Gateway"
    description: "Sends API requests for data and transactions via"
  - source: "Auth Context Provider"
    destination: "Amazon Cognito"
    description: "Authenticates users and manages tokens via"