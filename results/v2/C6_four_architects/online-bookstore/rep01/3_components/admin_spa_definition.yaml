level: component
scope: "Component diagram for the Admin SPA container"
parentContainer:
  name: "Admin SPA"
elements:
  - type: "component"
    name: "Authentication Component"
    technology: "TypeScript, React Context"
    description: "Handles user authentication and context management."
  - type: "component"
    name: "Authorization & RBAC Guard Component"
    technology: "TypeScript, React Router"
    description: "Validates user claims and enforces role-based access control."
  - type: "component"
    name: "Catalog Management Component"
    technology: "React, TanStack Query"
    description: "Manages catalogue listings, queries, and mutations."
  - type: "component"
    name: "Order & Support Dashboard Component"
    technology: "React, AG-Grid"
    description: "Manages order operations using high-performance data tables."
  - type: "component"
    name: "Audit & Telemetry Logger Component"
    technology: "TypeScript"
    description: "Dispatches action events, performance metrics, and errors."
relationships:
  - source: "Authorization & RBAC Guard Component"
    destination: "Authentication Component"
    description: "Validates user claims [React Context]"
  - source: "Catalog Management Component"
    destination: "Audit & Telemetry Logger Component"
    description: "Dispatches action events [TypeScript Calls]"
  - source: "Order & Support Dashboard Component"
    destination: "Audit & Telemetry Logger Component"
    description: "Dispatches action events [TypeScript Calls]"