level: component
scope: "Component diagram for the Redis ElastiCache container"
parentContainer:
  name: "Redis ElastiCache"
elements:
  - type: "component"
    name: "Session Store Component"
    technology: "Redis Protocol via AWS VPC Private Subnets"
    description: "Manages user sessions for the Order & Checkout Service."
  - type: "component"
    name: "Product Catalog Cache Component"
    technology: "Redis Protocol"
    description: "Reads/writes hot catalogue items for the Catalog & Search Service."
  - type: "component"
    name: "Distributed Rate Limiter Component"
    technology: "Redis Data Structures"
    description: "Enforces rate limits and distributes traffic control."
  - type: "component"
    name: "Cart Persistence Component"
    technology: "Redis Protocol / gRPC"
    description: "Reads/updates active carts accessed via AWS API Gateway and Customer SPA."
  - type: "component"
    name: "Idempotency & Deduplication Component"
    technology: "Redis Data Structures (SETNX)"
    description: "Checks and sets transaction tokens for the Order & Checkout Service."
  - type: "component"
    name: "AWS ElastiCache Cluster Nodes"
    technology: "AWS ElastiCache for Redis (Cluster Mode Enabled)"
    description: "In-memory data store for sub-second caching and session management."
  - type: "component"
    name: "AWS Distro for OpenTelemetry (ADOT Sidecar)"
    technology: "AWS Distro for OpenTelemetry (ADOT)"
    description: "Exports Redis metrics via OpenTelemetry Protocol / Prometheus."
relationships:
  - source: "Order & Checkout Service"
    destination: "Session Store Component"
    description: "Manages user sessions [Redis Protocol via AWS VPC Private Subnets]"
  - source: "Catalog & Search Service"
    destination: "Product Catalog Cache Component"
    description: "Reads/writes hot catalogue items [Redis Protocol]"
  - source: "Customer SPA via AWS API Gateway"
    destination: "Cart Persistence Component"
    description: "Reads/updates active carts [Redis Protocol / gRPC]"
  - source: "Product Catalog Cache Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "Cache-aside fallback [PostgreSQL Wire Protocol]"
  - source: "Order & Checkout Service"
    destination: "Idempotency & Deduplication Component"
    description: "Checks/sets transaction tokens [Redis Protocol]"
  - source: "Redis ElastiCache"
    destination: "AWS Distro for OpenTelemetry (ADOT Sidecar)"
    description: "Exports Redis metrics [OpenTelemetry Protocol / Prometheus]"