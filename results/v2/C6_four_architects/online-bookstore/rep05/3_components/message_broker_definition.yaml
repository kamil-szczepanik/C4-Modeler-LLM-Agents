level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Event Publisher"
    technology: "Amazon SNS"
    description: "Publishes order lifecycle events via HTTPS (AWS SDK)."
  - type: "component"
    name: "Event Queue Manager"
    technology: "Amazon SQS"
    description: "Delivers queued events via HTTP long-polling and manages queues."
  - type: "component"
    name: "Dead Letter Queue Manager"
    technology: "Amazon SQS DLQ"
    description: "Routes unprocessable messages after max retry attempts via AWS SQS redrive policy."
  - type: "component"
    name: "Event Payload Encryption Component"
    technology: "AWS KMS"
    description: "Encrypts and decrypts sensitive message payloads via AWS KMS API."
  - type: "component"
    name: "Schema Validator"
    technology: "JSON Schema"
    description: "Validates event structures and payloads."
  - type: "component"
    name: "Message Routing & Filtering Router"
    technology: "Amazon SNS Filter Policies"
    description: "Evaluates filter attributes during message broadcast and forwards matched events."
relationships:
  - source: "Order & Checkout Service"
    destination: "Event Publisher"
    description: "Publishes order lifecycle events via HTTPS (AWS SDK)"
  - source: "Event Publisher"
    destination: "Message Routing & Filtering Router"
    description: "Evaluates filter attributes during message broadcast via Amazon SNS"
  - source: "Message Routing & Filtering Router"
    destination: "Event Queue Manager"
    description: "Forwards matched events to targeted SQS queues"
  - source: "Event Queue Manager"
    destination: "Dead Letter Queue Manager"
    description: "Routes unprocessable messages after max retry attempts via AWS SQS redrive policy"
  - source: "Event Queue Manager"
    destination: "Review & Notification Service / Recommendation Service / Catalog Service"
    description: "Delivers queued events via HTTP long-polling (AWS SDK)"
  - source: "Event Publisher / Event Queue Manager"
    destination: "Event Payload Encryption Component"
    description: "Encrypts and decrypts sensitive message payloads via AWS KMS API"