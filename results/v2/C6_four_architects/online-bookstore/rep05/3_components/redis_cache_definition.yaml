level: component
scope: "Component diagram for the Redis Cache container"
parentContainer:
  name: "Redis Cache"
elements:
  - type: "component"
    name: "Session Store"
    technology: "Amazon ElastiCache for Redis"
    description: "Stores and validates user sessions."
  - type: "component"
    name: "Shopping Cart Store"
    technology: "Amazon ElastiCache for Redis"
    description: "Persists shopping cart state."
  - type: "component"
    name: "Catalogue Cache"
    technology: "Amazon ElastiCache for Redis"
    description: "Caches product data for fast retrieval."
  - type: "component"
    name: "Rate Limiting Store"
    technology: "Amazon ElastiCache for Redis"
    description: "Checks and manages request counters for rate limiting."
  - type: "component"
    name: "Redis Persistence & Eviction Manager"
    technology: "Amazon ElastiCache for Redis"
    description: "Manages AOF snapshots and volatile-lru eviction policies."
  - type: "component"
    name: "Redis Key Namespace & TTL Policy Manager"
    technology: "Amazon ElastiCache for Redis"
    description: "Manages key namespaces and time-to-live policies."
  - type: "component"
    name: "Redis Telemetry & Metrics Exporter"
    technology: "Amazon ElastiCache for Redis"
    description: "Publishes operational metrics to Amazon CloudWatch."
relationships:
  - source: "API Gateway"
    destination: "Session Store"
    description: "Validates user sessions [Redis RESP]"
  - source: "API Gateway"
    destination: "Rate Limiting Store"
    description: "Checks request counters [Redis RESP]"
  - source: "Catalog Service"
    destination: "Catalogue Cache"
    description: "Reads/writes product data [Redis RESP]"
  - source: "Order & Checkout Service"
    destination: "Shopping Cart Store"
    description: "Persists cart state [Redis RESP]"
  - source: "Recommendation Service"
    destination: "Catalogue Cache"
    description: "Reads product recommendations [Redis RESP]"
  - source: "Redis Telemetry & Metrics Exporter"
    destination: "Amazon CloudWatch"
    description: "Publishes operational metrics [AWS CloudWatch API]"