level: component
scope: "Component diagram for the Review & Notification Service container"
parentContainer:
  name: "Review & Notification Service"
elements:
  - type: "component"
    name: "Review Controller"
    technology: "Node.js & NestJS REST"
    description: "Exposes REST endpoints for review submission and retrieval."
  - type: "component"
    name: "Review Service"
    technology: "Node.js & NestJS"
    description: "Manages review business logic and domain event publishing."
  - type: "component"
    name: "Moderation Service"
    technology: "Node.js & NestJS"
    description: "Sanitizes review text using compliance checks."
  - type: "component"
    name: "Review Repository"
    technology: "TypeORM"
    description: "Encapsulates database access using TypeORM."
  - type: "component"
    name: "Review Cache Component"
    technology: "Amazon Redis / Redis TCP/RESP"
    description: "Interfaces with Redis for caching top reviews."
  - type: "component"
    name: "Notification Consumer"
    technology: "AWS SDK (v3) / Amazon SQS"
    description: "Processes background messages from message queues."
  - type: "component"
    name: "Template Engine"
    technology: "Handlebars"
    description: "Compiles localized notification templates using Handlebars."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "SendGrid/AWS SES / HTTPS REST APIs"
    description: "Sends emails via external notification APIs."
  - type: "component"
    name: "API Gateway"
    technology: "Gateway"
    description: "External system routing traffic to the Review Controller."
  - type: "component"
    name: "Aurora PostgreSQL Database"
    technology: "PostgreSQL"
    description: "Database storing review and notification data."
  - type: "component"
    name: "Amazon SQS"
    technology: "AWS SQS"
    description: "Message queue service for asynchronous notifications."
  - type: "component"
    name: "SendGrid/AWS SES"
    technology: "HTTPS / REST APIs"
    description: "External email and notification service providers."
relationships:
  - source: "API Gateway"
    destination: "Review Controller"
    description: "HTTPS / REST"
  - source: "Review Service"
    destination: "Review Cache Component"
    description: "Redis TCP/RESP protocol"
  - source: "Review Repository"
    destination: "Aurora PostgreSQL Database"
    description: "Native TCP/TLS"
  - source: "Notification Consumer"
    destination: "Amazon SQS"
    description: "Long Polling"
  - source: "Notification Dispatcher"
    destination: "SendGrid/AWS SES"
    description: "HTTPS / REST APIs"