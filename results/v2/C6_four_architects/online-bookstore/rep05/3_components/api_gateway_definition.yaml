level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Rate Limiter Component"
    technology: "API Gateway throttling / Amazon Redis"
    description: "Supports rate limiting functionality and DDoS mitigation."
  - type: "component"
    name: "Auth Integration Component"
    technology: "AWS Lambda Authorizer / JWT"
    description: "Executes edge validation, transformation, and stateless authentication."
  - type: "component"
    name: "Request Validator Component"
    technology: "JSON Schema validation"
    description: "Enforces payload validation to satisfy OWASP Top-10 security requirements."
  - type: "component"
    name: "Route Dispatcher Component"
    technology: "AWS API Gateway routing"
    description: "Routes requests via internal Application Load Balancers."
  - type: "component"
    name: "Response Transformer Component"
    technology: "Lambda edge transformation"
    description: "Returns service responses and transforms payloads."
relationships:
  - source: "Rate Limiter Component"
    destination: "Auth Integration Component"
    description: "Forwards requests for token validation [Internal Invocation]"
  - source: "Auth Integration Component"
    destination: "Request Validator Component"
    description: "Forwards requests with context [In-memory]"
  - source: "Request Validator Component"
    destination: "Route Dispatcher Component"
    description: "Forwards sanitized payloads [In-memory]"
  - source: "Route Dispatcher Component"
    destination: "Response Transformer Component"
    description: "Routes requests to internal microservices and returns service responses [HTTPS / REST]"