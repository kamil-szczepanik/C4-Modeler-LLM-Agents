level: component
scope: "Component diagram for the OpenSearch Service container"
parentContainer:
  name: "OpenSearch Service"
elements:
  - type: "component"
    name: "Search API Handler"
    technology: "Java/Lucene-native REST layer"
    description: "Handles HTTP/REST requests for search queries."
  - type: "component"
    name: "Security & Access Control Component"
    technology: "IAM/RBAC middleware"
    description: "Manages security, authentication, and access control."
  - type: "component"
    name: "Query Parser & DSL Engine"
    technology: "JSON-to-Lucene query tree translator"
    description: "Translates JSON queries into Lucene query trees."
  - type: "component"
    name: "Indexing & Sharding Manager"
    technology: "Document routing and distributed shard allocator"
    description: "Manages document routing and distributed shard allocation."
  - type: "component"
    name: "Cluster State Coordinator"
    technology: "OpenSearch Cluster Manager node role"
    description: "Coordinates cluster state and node roles."
  - type: "component"
    name: "Data Nodes"
    technology: "Apache Lucene Indices"
    description: "Stores and indexes data using Apache Lucene."
relationships:
  - source: "Catalog Service"
    destination: "Search API Handler"
    description: "HTTP/REST (JSON) over TLS 1.3"
  - source: "Search API Handler"
    destination: "Security & Access Control Component"
    description: "In-memory middleware hook"
  - source: "Security & Access Control Component"
    destination: "Query Parser & DSL Engine"
    description: "In-memory invocation"
  - source: "Query Parser & DSL Engine"
    destination: "Data Nodes"
    description: "Apache Lucene Java API"
  - source: "Cluster State Coordinator"
    destination: "Data Nodes"
    description: "Transport Protocol (TCP/Custom)"
  - source: "Indexing & Sharding Manager"
    destination: "Data Nodes"
    description: "Transport Protocol (TCP/Custom)"