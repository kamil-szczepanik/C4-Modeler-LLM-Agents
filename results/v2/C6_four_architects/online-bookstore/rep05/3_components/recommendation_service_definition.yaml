level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "Recommendation API Controller"
    technology: "FastAPI"
    description: "Handles incoming REST requests over HTTPS from the API Gateway."
  - type: "component"
    name: "Recommendation Engine Core"
    technology: "Python, NumPy, Scikit-learn"
    description: "Executes collaborative filtering algorithms."
  - type: "component"
    name: "Cache Repository"
    technology: "Redis Client"
    description: "Interfaces with Amazon Redis via TCP for hot recommendations."
  - type: "component"
    name: "Data Enrichment Client"
    technology: "httpx"
    description: "Fetches real-time book metadata from the Catalog Service."
  - type: "component"
    name: "Event Consumer"
    technology: "SQS Worker"
    description: "Consumes order and clickstream events asynchronously from Amazon SQS."
  - type: "component"
    name: "Offline Training Pipeline"
    technology: "AWS SageMaker Job"
    description: "Computes model weights and embeddings."
  - type: "component"
    name: "Model Loader / Feature Store Client"
    technology: "HTTP/HTTPS Client"
    description: "Fetches serialized models and embeddings from Amazon S3 over HTTPS."
relationships:
  - source: "API Gateway"
    destination: "Recommendation API Controller"
    description: "Routes REST requests [HTTPS]"
  - source: "Recommendation API Controller"
    destination: "Cache Repository"
    description: "Queries hot recommendations [TCP / Redis Protocol]"
  - source: "Recommendation Engine Core"
    destination: "Data Enrichment Client"
    description: "Fetches book metadata [HTTP/REST]"
  - source: "Recommendation Engine Core"
    destination: "Model Loader / Feature Store Client"
    description: "Retrieves embeddings [HTTPS / S3 API]"
  - source: "Event Consumer"
    destination: "Amazon SQS"
    description: "Consumes real-time interaction updates [AMQP / HTTPS]"