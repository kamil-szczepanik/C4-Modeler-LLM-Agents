level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Cart Management Component"
    technology: "Spring MVC, Redis Cache"
    description: "Handles shopping cart state management."
  - type: "component"
    name: "Checkout Orchestrator Component"
    technology: "Spring Saga/Workflow Engine"
    description: "Orchestrates the secure checkout workflow."
  - type: "component"
    name: "Payment & Tax Integration Component"
    technology: "Spring WebClient, Stripe, PayPal, Avalara, TaxJar"
    description: "Integrates with external payment and tax services."
  - type: "component"
    name: "Shipping Integration Component"
    technology: "Spring WebClient, FedEx, UPS"
    description: "Requests shipment quotes and labels."
  - type: "component"
    name: "Order Persistence Component"
    technology: "Spring Data JPA, Aurora PostgreSQL"
    description: "Executes transactional writes for orders."
  - type: "component"
    name: "Order Query Component"
    technology: "Spring MVC, Aurora PostgreSQL read-replicas"
    description: "Handles read requests for order history."
  - type: "component"
    name: "Order Event Publisher Component"
    technology: "Spring Cloud Stream, Amazon SNS, Amazon SQS"
    description: "Publishes order-placed events to message brokers."
  - type: "component"
    name: "Resilience Policy Component"
    technology: "Resilience4j"
    description: "Wraps external API calls with fault-tolerance patterns."
  - type: "container"
    name: "API Gateway"
    technology: "Reverse Proxy / API Gateway"
    description: "Routes read requests via internal ALBs."
  - type: "container"
    name: "Aurora PostgreSQL Database"
    technology: "Aurora PostgreSQL"
    description: "Database storing order data and history."
  - type: "container"
    name: "Amazon SNS / SQS"
    technology: "AWS SNS/SQS"
    description: "Message broker services for event distribution."
relationships:
  - source: "API Gateway"
    destination: "Order Query Component"
    description: "Routes read requests [HTTPS / REST via internal ALBs]"
  - source: "Checkout Orchestrator Component"
    destination: "Payment & Tax Integration Component"
    description: "Triggers synchronous auth captures [Internal Java Method Calls]"
  - source: "Checkout Orchestrator Component"
    destination: "Shipping Integration Component"
    description: "Requests shipment quotes and labels [Internal Java Method Calls]"
  - source: "Checkout Orchestrator Component"
    destination: "Resilience Policy Component"
    description: "Wraps external API calls with fault-tolerance [Internal Java Method Calls]"
  - source: "Order Persistence Component"
    destination: "Aurora PostgreSQL Database"
    description: "Executes transactional writes [JDBC / TLS]"
  - source: "Order Query Component"
    destination: "Aurora PostgreSQL Database"
    description: "Reads order history [JDBC / TLS via read-replicas]"
  - source: "Order Event Publisher Component"
    destination: "Amazon SNS / SQS"
    description: "Publishes order-placed events [Spring Cloud Stream / JSON]"