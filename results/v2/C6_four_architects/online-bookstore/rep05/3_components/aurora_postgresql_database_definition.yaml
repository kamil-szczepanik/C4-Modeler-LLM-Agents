level: component
scope: "Component diagram for the Aurora PostgreSQL Database container"
parentContainer:
  name: "Aurora PostgreSQL Database"
elements:
  - type: "component"
    name: "Catalog Database Schema"
    technology: "PostgreSQL, schema-per-service isolation"
    description: "Stores book catalogue data with pg_trgm extension for search."
  - type: "component"
    name: "Order Database Schema"
    technology: "PostgreSQL, schema-per-service isolation"
    description: "Stores order and checkout information."
  - type: "component"
    name: "Review Database Schema"
    technology: "PostgreSQL, schema-per-service isolation"
    description: "Stores customer reviews and notification metadata."
relationships:
  - source: "Catalog Database Schema"
    destination: "Order Database Schema"
    description: "Maintains relational data boundaries via service isolation"