level: component
scope: "Component diagram for the Catalog Service container"
parentContainer:
  name: "Catalog Service"
elements:
  - type: "component"
    name: "Catalog API Controller"
    technology: "Express (Node.js/TypeScript)"
    description: "Handles incoming Express routes and input validation."
  - type: "component"
    name: "Catalog Service Layer"
    technology: "Node.js / TypeScript"
    description: "Implements core business logic for book details."
  - type: "component"
    name: "Search & Filter Engine"
    technology: "Node.js / @opensearch-project/opensearch"
    description: "Manages keyword searches via Amazon OpenSearch Service."
  - type: "component"
    name: "Data Access Repository"
    technology: "Node.js / Native PostgreSQL drivers"
    description: "Handles persistence via Aurora PostgreSQL."
  - type: "component"
    name: "Cache Manager"
    technology: "Node.js / Amazon Redis / ioredis"
    description: "Manages hot catalog reads using Amazon Redis."
  - type: "component"
    name: "Event Listener Component"
    technology: "Node.js / @aws-sdk/client-sqs"
    description: "Consumes inventory events from Amazon SQS."
  - type: "component"
    name: "Inventory Manager"
    technology: "Node.js / TypeScript"
    description: "Encapsulates stock-availability read logic."
  - type: "component"
    name: "Pricing & Currency Translator"
    technology: "Node.js / TypeScript"
    description: "Applies USD, EUR, and GBP currency conversions."
relationships:
  - source: "Catalog API Controller"
    destination: "Catalog Service Layer"
    description: "In-process method calls"
  - source: "Catalog Service Layer"
    destination: "Cache Manager"
    description: "Read/Write hot items [Redis Protocol / TCP]"
  - source: "Search & Filter Engine"
    destination: "Amazon OpenSearch Service"
    description: "Query catalog index [HTTPS]"
  - source: "Data Access Repository"
    destination: "Aurora PostgreSQL (Region Read Replica)"
    description: "SQL queries [TCP/TLS]"
  - source: "Amazon SQS"
    destination: "Event Listener Component"
    description: "Consume inventory change events [HTTPS / SQS SDK]"
  - source: "Event Listener Component"
    destination: "Cache Manager"
    description: "Evict/Update stale keys [Redis Protocol]"
  - source: "Event Listener Component"
    destination: "Search & Filter Engine"
    description: "Update document index [OpenSearch REST API]"
  - source: "Catalog Service Layer"
    destination: "Inventory Manager"
    description: "Verify stock availability [In-process]"
  - source: "Inventory Manager"
    destination: "Data Access Repository"
    description: "Stock-check queries [TCP/TLS]"
  - source: "Catalog Service Layer"
    destination: "Pricing & Currency Translator"
    description: "Enrich book prices [In-process]"