level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "A scaled-down Amazon-style e-commerce platform designed to provide browsing, searching, purchasing, reviews, and personalized recommendations for physical and electronic books."
elements:
  - type: "person"
    name: "Customer"
    description: "End-user browsing, reviewing, and purchasing books via web or mobile."
  - type: "externalSystem"
    name: "Stripe/PayPal"
    description: "Payment gateway for processing transactions."
  - type: "externalSystem"
    name: "FedEx/UPS"
    description: "Shipping provider APIs for handling order delivery."
  - type: "externalSystem"
    name: "Auth0/AWS Cognito"
    description: "Identity and OIDC provider for authentication."
  - type: "externalSystem"
    name: "SendGrid/AWS SES"
    description: "Email and notification service."
  - type: "externalSystem"
    name: "Avalara/TaxJar"
    description: "Tax calculation service."
relationships:
  - source: "Customer"
    destination: "Online Bookstore"
    description: "Browses, reviews, and purchases books"
    technology: "HTTPS"
  - source: "Online Bookstore"
    destination: "Stripe/PayPal"
    description: "Processes payments"
    technology: "REST APIs over TLS 1.3"
  - source: "Online Bookstore"
    destination: "FedEx/UPS"
    description: "Manages shipping and delivery"
    technology: "REST APIs over TLS 1.3"
  - source: "Online Bookstore"
    destination: "Auth0/AWS Cognito"
    description: "Authenticates users"
    technology: "OIDC / OAuth2 / REST over TLS 1.3"
  - source: "Online Bookstore"
    destination: "SendGrid/AWS SES"
    description: "Sends notifications and emails"
    technology: "REST APIs over TLS 1.3"
  - source: "Online Bookstore"
    destination: "Avalara/TaxJar"
    description: "Calculates taxes"
    technology: "REST APIs over TLS 1.3"