level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Customer"
    description: "End-user browsing, reviewing, and purchasing books via web or mobile."
  - type: "externalSystem"
    name: "Stripe/PayPal"
    description: "Payment gateway for processing transactions."
  - type: "externalSystem"
    name: "FedEx/UPS"
    description: "Shipping provider APIs for handling order delivery."
  - type: "externalSystem"
    name: "Auth0/AWS Cognito"
    description: "Identity and OIDC provider for authentication."
  - type: "externalSystem"
    name: "SendGrid/AWS SES"
    description: "Email and notification service."
  - type: "externalSystem"
    name: "Avalara/TaxJar"
    description: "Tax calculation service."
  - type: "container"
    name: "Single Page Application (SPA)"
    technology: "React, TypeScript, Amazon S3, Amazon CloudFront"
    description: "Provides the user interface for browsing, searching, purchasing, and reviewing books globally with sub-2-second page loads."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway, Lambda Authorizer"
    description: "Acts as the single secure entry point routing incoming HTTPS/REST requests to internal microservices."
  - type: "container"
    name: "Catalog Service"
    technology: "Node.js, Express"
    description: "Manages book catalog data, categories, and inventory details."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Spring Boot"
    description: "Handles shopping carts, checkout workflows, and order processing."
  - type: "container"
    name: "Recommendation Service"
    technology: "Python, FastAPI"
    description: "Generates AI-driven personalized book recommendations for users."
  - type: "container"
    name: "Review & Notification Service"
    technology: "Node.js / Container"
    description: "Handles customer reviews and asynchronous notifications."
  - type: "container"
    name: "Message Broker"
    technology: "Amazon SNS, Amazon SQS"
    description: "Handles asynchronous event-driven workflows across microservices."
  - type: "container"
    name: "Aurora PostgreSQL Database"
    technology: "Amazon Aurora PostgreSQL"
    description: "Managed database-per-service data tier providing strict isolation for GDPR compliance."
  - type: "container"
    name: "OpenSearch Service"
    technology: "Amazon OpenSearch Service"
    description: "Provides sub-second search capabilities across the catalog."
  - type: "container"
    name: "Redis Cache"
    technology: "Amazon Redis"
    description: "Provides fast in-memory caching and session management."
relationships:
  - source: "Customer"
    destination: "Single Page Application (SPA)"
    description: "Browses and interacts with the store"
    technology: "HTTPS"
  - source: "Single Page Application (SPA)"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS / REST"
  - source: "API Gateway"
    destination: "Catalog Service"
    description: "Routes catalog requests"
    technology: "HTTPS / REST via internal Application Load Balancers"
  - source: "API Gateway"
    destination: "Order & Checkout Service"
    description: "Routes order and checkout requests"
    technology: "HTTPS / REST via internal Application Load Balancers"
  - source: "API Gateway"
    destination: "Recommendation Service"
    description: "Routes recommendation requests"
    technology: "HTTPS / REST via internal Application Load Balancers"
  - source: "API Gateway"
    destination: "Review & Notification Service"
    description: "Routes review and notification requests"
    technology: "HTTPS / REST via internal Application Load Balancers"
  - source: "Catalog Service"
    destination: "Aurora PostgreSQL Database"
    description: "Reads and writes catalog data"
    technology: "Native TCP/TLS drivers (PostgreSQL wire protocol)"
  - source: "Order & Checkout Service"
    destination: "Aurora PostgreSQL Database"
    description: "Reads and writes order data"
    technology: "Native TCP/TLS drivers (PostgreSQL wire protocol)"
  - source: "Review & Notification Service"
    destination: "Aurora PostgreSQL Database"
    description: "Reads and writes review data"
    technology: "Native TCP/TLS drivers (PostgreSQL wire protocol)"
  - source: "Catalog Service"
    destination: "OpenSearch Service"
    description: "Indexes and queries catalog search data"
    technology: "OpenSearch REST API"
  - source: "Order & Checkout Service"
    destination: "Redis Cache"
    description: "Caches session and cart data"
    technology: "Redis RESP"
  - source: "Order & Checkout Service"
    destination: "Message Broker"
    description: "Publishes order events"
    technology: "JSON event publishing via Amazon SNS/SQS"
  - source: "Review & Notification Service"
    destination: "Message Broker"
    description: "Publishes and consumes notification events"
    technology: "JSON event consumption/publishing via Amazon SNS/SQS"
  - source: "Order & Checkout Service"
    destination: "Stripe/PayPal"
    description: "Processes payments"
    technology: "HTTPS / REST APIs"
  - source: "Order & Checkout Service"
    destination: "Avalara/TaxJar"
    description: "Calculates taxes"
    technology: "HTTPS / REST APIs"
  - source: "Order & Checkout Service"
    destination: "FedEx/UPS"
    description: "Manages shipping and delivery"
    technology: "HTTPS / REST APIs"
  - source: "API Gateway"
    destination: "Auth0/AWS Cognito"
    description: "Authenticates requests via Lambda Authorizer"
    technology: "OIDC / OAuth2 / HTTPS"
  - source: "Review & Notification Service"
    destination: "SendGrid/AWS SES"
    description: "Sends emails and notifications"
    technology: "HTTPS / REST APIs"