level: component
scope: "Component diagram for the BFF Container container"
parentContainer:
  name: "BFF Container"
elements:
  - type: "component"
    name: "SSR Page Router / Controller"
    technology: "Next.js App Router"
    description: "Handles server-side rendering and routing for fast initial page loads."
  - type: "component"
    name: "API Proxy Middleware"
    technology: "Node.js / Express-style handlers"
    description: "Proxies and handles request routing to downstream API gateways and services."
  - type: "component"
    name: "GraphQL / Aggregator Client"
    technology: "Apollo Client / native fetch"
    description: "Fetches and aggregates domain data from backend services."
  - type: "component"
    name: "Session & Cache Manager"
    technology: "ioredis"
    description: "Manages user session state and caching via Redis."
  - type: "component"
    name: "Security & Compliance Interceptor"
    technology: "Node.js middleware"
    description: "Enforces security compliance, sanitizes requests, and handles GDPR/CCPA requirements."
  - type: "component"
    name: "Telemetry & Tracing Agent"
    technology: "OpenTelemetry Node.js SDK"
    description: "Exports telemetry metrics and enables distributed tracing."
  - type: "container"
    name: "AWS API Gateway"
    technology: "AWS API Gateway"
    description: "API Gateway managed service."
  - type: "container"
    name: "Amazon ElastiCache"
    technology: "Amazon ElastiCache & Redis"
    description: "Provides low-latency storage for user sessions and cached API responses."
  - type: "container"
    name: "Compliance/Audit Lambda"
    technology: "AWS Lambda"
    description: "Processes audit logs asynchronously."
  - type: "container"
    name: "AWS X-Ray / CloudWatch"
    technology: "AWS X-Ray / CloudWatch"
    description: "Monitoring and telemetry infrastructure."
relationships:
  - source: "SSR Page Router / Controller"
    destination: "Security & Compliance Interceptor"
    description: "In-process function calls [TypeScript]"
  - source: "Security & Compliance Interceptor"
    destination: "API Proxy Middleware"
    description: "Passes sanitized requests [TypeScript]"
  - source: "API Proxy Middleware"
    destination: "AWS API Gateway"
    description: "Forwards proxied calls [gRPC over TLS]"
  - source: "GraphQL / Aggregator Client"
    destination: "AWS API Gateway"
    description: "Fetches and aggregates domain data [gRPC over TLS]"
  - source: "Session & Cache Manager"
    destination: "Amazon ElastiCache"
    description: "Manages session state and caching [RESP/Redis over TLS]"
  - source: "API Proxy Middleware"
    destination: "Compliance/Audit Lambda"
    description: "Offwrites audit logs asynchronously [HTTPS/JSON]"
  - source: "Telemetry & Tracing Agent"
    destination: "AWS X-Ray / CloudWatch"
    description: "Exports telemetry metrics [HTTPS / AWS SDK]"