level: component
scope: "Component diagram for the Amazon ElastiCache container"
parentContainer:
  name: "Amazon ElastiCache"
elements:
  - type: "component"
    name: "Redis Primary Node"
    technology: "Redis Engine / Amazon ElastiCache"
    description: "Handles write operations and state management for sessions, cart, and catalogue queries."
  - type: "component"
    name: "Redis Read Replica Nodes"
    technology: "Redis Engine"
    description: "Offloads read traffic to ensure low-latency queries and high availability."
  - type: "component"
    name: "ElastiCache Cluster Manager"
    technology: "AWS Managed Control Plane"
    description: "Manages the cluster infrastructure, Multi-AZ with Auto-Failover, and automatic recovery."
  - type: "component"
    name: "Redis Cluster Proxy"
    technology: "AWS ElastiCache Data Tiering / OSS Cluster API"
    description: "Routes session, cart, and catalogue queries from external services to primary and replica nodes."
  - type: "component"
    name: "In-Memory Eviction Manager"
    technology: "Redis LRU/LFU Engine (volatile-lru)"
    description: "Eviction policy preventing Out-Of-Memory crashes under peak load."
  - type: "component"
    name: "Backup & Snapshot Manager"
    technology: "AWS Automated Backup / Amazon S3"
    description: "Exports periodic RDB snapshots for robust disaster recovery."
  - type: "component"
    name: "ElastiCache Cluster Node-to-Node Encryption & Auth Engine"
    technology: "Redis TLS/AUTH (TLS 1.3 & AUTH)"
    description: "Secures internal node communication for OWASP compliance."
relationships:
  - source: "Redis Primary Node"
    destination: "Backup & Snapshot Manager"
    description: "Exports periodic RDB snapshots [Internal AWS API]"
  - source: "Redis Cluster Proxy"
    destination: "Redis Primary Node"
    description: "Enforces secure command routing [RESP over TLS with AUTH]"
  - source: "Redis Cluster Proxy"
    destination: "Redis Read Replica Nodes"
    description: "Enforces secure command routing [RESP over TLS with AUTH]"