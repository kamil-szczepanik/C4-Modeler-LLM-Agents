level: component
scope: "Component diagram for the AWS Glue & Athena container"
parentContainer:
  name: "AWS Glue & Athena"
elements:
  - type: "component"
    name: "AWS Glue Data Catalog"
    technology: "AWS Glue Data Catalog"
    description: "Metadata cataloging for scalable data ingestion and table definitions."
  - type: "component"
    name: "AWS Glue ETL Jobs"
    technology: "Apache Spark on AWS Glue Serverless"
    description: "Serverless ETL processing for offloading analytical workloads."
  - type: "component"
    name: "Amazon Athena Query Engine"
    technology: "Presto/Trino-based Amazon Athena"
    description: "Serverless interactive query service for fast ad-hoc analysis using standard SQL and compliance auditing."
  - type: "component"
    name: "S3 Data Lake"
    technology: "Amazon S3, Apache Parquet"
    description: "Columnar storage format optimizing query performance and storage costs."
  - type: "component"
    name: "Amazon Aurora Global Database"
    technology: "PostgreSQL"
    description: "Operational database serving the online bookstore."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "NoSQL operational database storing store data."
  - type: "component"
    name: "Compliance/Audit Lambda"
    technology: "AWS Lambda"
    description: "Automated GDPR/CCPA compliance auditing via data discovery queries."
  - type: "component"
    name: "Admin/Content Manager"
    technology: "User / AWS Console"
    description: "Admin or content manager executing analytical queries and audits."
relationships:
  - source: "AWS Glue ETL Jobs"
    destination: "Amazon Aurora Global Database"
    description: "JDBC/TLS"
  - source: "AWS Glue ETL Jobs"
    destination: "Amazon DynamoDB"
    description: "AWS SDK / S3"
  - source: "AWS Glue ETL Jobs"
    destination: "S3 Data Lake"
    description: "S3 API / HTTPS"
  - source: "Amazon Athena Query Engine"
    destination: "AWS Glue Data Catalog"
    description: "Internal AWS API"
  - source: "Amazon Athena Query Engine"
    destination: "S3 Data Lake"
    description: "S3 API / HTTPS"
  - source: "Compliance/Audit Lambda"
    destination: "Amazon Athena Query Engine"
    description: "AWS SDK / HTTPS"
  - source: "Admin/Content Manager"
    destination: "Amazon Athena Query Engine"
    description: "JDBC/ODBC or AWS Console/HTTPS"