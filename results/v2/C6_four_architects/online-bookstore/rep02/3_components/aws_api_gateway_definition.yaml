level: component
scope: "Component diagram for the AWS API Gateway container"
parentContainer:
  name: "AWS API Gateway"
elements:
  - type: "component"
    name: "WAF & Security Shield"
    technology: "AWS WAF"
    description: "Provides edge routing, security, and OWASP Top-10 mitigation."
  - type: "component"
    name: "Route Validator & Authorizer"
    technology: "AWS Lambda / IAM"
    description: "Validates routes and authorizes incoming requests."
  - type: "component"
    name: "Rate Limiter"
    technology: "AWS API Gateway Rate Limiting"
    description: "Controls the rate of incoming requests to protect downstream services."
  - type: "component"
    name: "Transformation & Validation"
    technology: "API Gateway Mapping Templates"
    description: "Transforms and validates request payloads."
  - type: "component"
    name: "Request Router"
    technology: "AWS VPC Links"
    description: "Routes validated requests to appropriate backend services."
  - type: "component"
    name: "Monitoring & Logging"
    technology: "Amazon CloudWatch"
    description: "Monitors and logs API traffic and performance metrics."
relationships:
  - source: "WAF & Security Shield"
    destination: "Route Validator & Authorizer"
    description: "Passes filtered requests for authorization"
  - source: "Route Validator & Authorizer"
    destination: "Rate Limiter"
    description: "Passes authenticated requests for rate checking"
  - source: "Rate Limiter"
    destination: "Transformation & Validation"
    description: "Passes rate-checked requests for payload processing"
  - source: "Transformation & Validation"
    destination: "Request Router"
    description: "Sends processed requests to routing"
  - source: "Request Router"
    destination: "Monitoring & Logging"
    description: "Logs routing metrics and access data"