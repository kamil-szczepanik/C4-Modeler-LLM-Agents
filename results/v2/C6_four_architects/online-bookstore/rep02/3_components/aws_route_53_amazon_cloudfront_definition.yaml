level: component
scope: "Component diagram for the AWS Route 53 & Amazon CloudFront container"
parentContainer:
  name: "AWS Route 53 & Amazon CloudFront"
elements:
  - type: "component"
    name: "Route 53 DNS Resolver"
    technology: "AWS Route 53"
    description: "Resolves domain and provides global DNS management with latency-based routing."
  - type: "component"
    name: "CloudFront CDN Distribution"
    technology: "Amazon CloudFront"
    description: "CDN for TLS 1.3 termination, caching, and reverse proxying."
  - type: "component"
    name: "CloudFront Lambda@Edge / CloudFront Functions"
    technology: "CloudFront Lambda@Edge / Functions"
    description: "Executes edge logic for security headers, geo-routing, and modifying headers/routes."
  - type: "component"
    name: "AWS WAF"
    technology: "AWS WAF"
    description: "Inspects incoming requests, enforces OWASP Top-10 mitigations, rate-limiting, and geo-blocking."
  - type: "component"
    name: "CloudFront Origin Groups & Failover"
    technology: "Amazon CloudFront Origin Groups"
    description: "Evaluates failover routing to forward dynamic traffic."
relationships:
  - source: "Customer & Admin/Content Manager"
    destination: "Route 53 DNS Resolver"
    description: "Resolves domain [DNS]"
  - source: "Route 53 DNS Resolver"
    destination: "CloudFront CDN Distribution"
    description: "Points traffic to edge [Anycast IP]"
  - source: "CloudFront CDN Distribution"
    destination: "AWS WAF"
    description: "Inspects incoming requests [Internal AWS API]"
  - source: "CloudFront Lambda@Edge / CloudFront Functions"
    destination: "CloudFront CDN Distribution"
    description: "Modifies headers/routes [In-memory execution]"
  - source: "CloudFront CDN Distribution"
    destination: "CloudFront Origin Groups & Failover"
    description: "Evaluates failover routing [Internal]"
  - source: "CloudFront Origin Groups & Failover"
    destination: "BFF Container"
    description: "Forwards dynamic traffic [HTTPS, Mutual TLS, HSTS]"