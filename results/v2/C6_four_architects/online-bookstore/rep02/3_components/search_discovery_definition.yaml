level: component
scope: "Component diagram for the Search & Discovery container"
parentContainer:
  name: "Search & Discovery"
elements:
  - type: "component"
    name: "Search API Controller"
    technology: "Java, Spring Boot"
    description: "Processes search requests and coordinates query parsing, aggregation, and analytics."
  - type: "component"
    name: "Query Parser & Matcher"
    technology: "Apache Lucene Query DSL"
    description: "Handles fuzzy matching and relevance scoring using Apache Lucene."
  - type: "component"
    name: "Catalog Synchronization Consumer"
    technology: "Java, Apache Kafka Consumer"
    description: "Consumes catalog data updates from Amazon MSK to keep search indexes synchronized."
  - type: "component"
    name: "Facet & Filter Aggregator"
    technology: "Java, OpenSearch Aggregations API"
    description: "Aggregates facets and filters for search results using OpenSearch."
  - type: "component"
    name: "Search Analytics Tracker"
    technology: "Java, Kafka Producer"
    description: "Tracks and produces search analytics telemetry data to Amazon MSK."
relationships:
  - source: "AWS API Gateway"
    destination: "Search API Controller"
    description: "gRPC over TLS"
  - source: "Search API Controller"
    destination: "Query Parser & Matcher"
    description: "In-process"
  - source: "Search API Controller"
    destination: "Facet & Filter Aggregator"
    description: "In-process"
  - source: "Query Parser & Matcher"
    destination: "Facet & Filter Aggregator"
    description: "In-process"
  - source: "Query Parser & Matcher"
    destination: "Amazon OpenSearch Cluster"
    description: "HTTPS"
  - source: "Facet & Filter Aggregator"
    destination: "Amazon OpenSearch Cluster"
    description: "HTTPS"
  - source: "Amazon MSK"
    destination: "Catalog Synchronization Consumer"
    description: "Kafka Protocol"
  - source: "Search API Controller"
    destination: "Search Analytics Tracker"
    description: "In-process"
  - source: "Search Analytics Tracker"
    destination: "Amazon MSK"
    description: "Kafka Protocol"