level: component
scope: "Component diagram for the Frontend SPA container"
parentContainer:
  name: "Frontend SPA"
elements:
  - type: "component"
    name: "Router & Layout Component"
    technology: "React Router"
    description: "Manages client-side routing via React Router and global layout shells."
  - type: "component"
    name: "Catalog & Search View"
    technology: "React & TypeScript"
    description: "Renders product grids and search interfaces."
  - type: "component"
    name: "Checkout & Cart Manager"
    technology: "React & TypeScript"
    description: "Handles shopping cart state and secure checkout flows."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios"
    description: "Axios-based abstraction layer for REST/GraphQL communication."
  - type: "component"
    name: "State Management Store"
    technology: "Redux Toolkit / Zustand"
    description: "Localized client state caching and multi-currency preferences (USD, EUR, GBP)."
  - type: "component"
    name: "Consent & Privacy Manager"
    technology: "React & TypeScript"
    description: "Captures user consent preferences to enforce GDPR and CCPA rights."
  - type: "component"
    name: "Auth & Session Handler"
    technology: "React & TypeScript"
    description: "Manages user session state and token refresh lifecycles securely in memory."
  - type: "component"
    name: "Code-Split Boundary / Lazy Loader"
    technology: "React Lazy / Dynamic Import"
    description: "Manages dynamic import chunks per route to minimize initial bundle size."
relationships:
  - source: "Frontend SPA"
    destination: "AWS Route 53 & Amazon CloudFront"
    description: "Fetches static assets via HTTPS"
  - source: "API Client Layer"
    destination: "BFF Container"
    description: "Communicates exclusively via HTTPS/JSON"
  - source: "Auth & Session Handler"
    destination: "BFF Container"
    description: "Manages authentication tokens through the BFF container"