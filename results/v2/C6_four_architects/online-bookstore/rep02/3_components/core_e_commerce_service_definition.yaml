level: component
scope: "Component diagram for the Core E-Commerce Service container"
parentContainer:
  name: "Core E-Commerce Service"
elements:
  - type: "component"
    name: "Order Management Component"
    technology: "Spring @Service, Java"
    description: "Handles core order placement and orchestration of business logic."
  - type: "component"
    name: "Catalog & Inventory Component"
    technology: "Spring @Service, Java"
    description: "Manages book catalogs and tracks inventory stock levels."
  - type: "component"
    name: "Checkout & Billing Component"
    technology: "Spring @Service, Java"
    description: "Processes secure financial transactions and payment checkouts."
  - type: "component"
    name: "Shipping & Fulfillment Component"
    technology: "Spring @Service, Java"
    description: "Coordinates delivery and logistics with external carriers."
  - type: "component"
    name: "Customer Account Component"
    technology: "Spring @Service, Java"
    description: "Manages customer profiles and account information."
  - type: "component"
    name: "Event Publisher/Consumer Component"
    technology: "Spring @Component / Spring Kafka, Java"
    description: "Publishes and consumes asynchronous domain events."
  - type: "component"
    name: "Data Access Repository Layer"
    technology: "Spring Data JPA / JDBC, Java"
    description: "Abstracts database interactions and executes persistence queries."
  - type: "component"
    name: "Amazon Aurora Global Database"
    technology: "PostgreSQL"
    description: "Stores transactional data with strict ACID compliance."
  - type: "component"
    name: "Amazon MSK"
    technology: "Apache Kafka"
    description: "Manages reliable, real-time event streaming."
  - type: "component"
    name: "External Payment Gateway"
    technology: "Secure REST/HTTPS"
    description: "Processes external payment transactions."
  - type: "component"
    name: "Third-Party Shipping API"
    technology: "Secure REST/HTTPS"
    description: "Coordinates shipping fulfillment with third-party logistics."
relationships:
  - source: "Order Management Component"
    destination: "Checkout & Billing Component"
    description: "Direct method invocation [In-Process / Java Bean]"
  - source: "Order Management Component"
    destination: "Shipping & Fulfillment Component"
    description: "Direct method invocation [In-Process / Java Bean]"
  - source: "Order Management Component"
    destination: "Event Publisher/Consumer Component"
    description: "Delegates domain events [In-Process / Java Bean]"
  - source: "Event Publisher/Consumer Component"
    destination: "Amazon MSK"
    description: "Publishes/consumes streams [Kafka protocol over TLS]"
  - source: "Catalog & Inventory Component"
    destination: "Data Access Repository Layer"
    description: "Queries stock states [In-Process / Java Bean]"
  - source: "Data Access Repository Layer"
    destination: "Amazon Aurora Global Database"
    description: "Executes ACID transactions [JDBC/TLS]"
  - source: "Checkout & Billing Component"
    destination: "External Payment Gateway"
    description: "Processes payments [Secure REST/HTTPS]"
  - source: "Shipping & Fulfillment Component"
    destination: "Third-Party Shipping API"
    description: "Coordinates delivery [Secure REST/HTTPS]"