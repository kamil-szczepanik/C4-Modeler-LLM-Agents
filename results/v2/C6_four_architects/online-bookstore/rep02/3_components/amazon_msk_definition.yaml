level: component
scope: "Component diagram for the Amazon MSK container"
parentContainer:
  name: "Amazon MSK"
elements:
  - type: "component"
    name: "Broker Nodes"
    technology: "Apache Kafka Brokers (Apache KRaft mode)"
    description: "Handles message ingestion, replication, and persists event streams to internal storage."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent / AWS Glue Schema Registry"
    description: "Validates Avro/JSON event payloads and event schemas."
  - type: "component"
    name: "Kafka Connect"
    technology: "AWS MSK Connect"
    description: "Syncs stream data to DynamoDB and Aurora."
  - type: "component"
    name: "Client Authentication & Authorization Manager"
    technology: "AWS IAM and SASL/SCRAM"
    description: "Enforces ACLs and authenticates connections."
  - type: "component"
    name: "Cluster Monitoring & Metrics Exporter"
    technology: "Amazon CloudWatch and Prometheus"
    description: "Emits and monitors telemetry metrics."
  - type: "component"
    name: "Topic & Partition Manager"
    technology: "Kafka Admin Client API"
    description: "Manages and provisions topic configurations and retention."
  - type: "component"
    name: "Internal Storage Volumes"
    technology: "Amazon EBS gp3"
    description: "Provides persistent block storage attached to broker nodes."
relationships:
  - source: "Core E-Commerce Service & Notification Worker"
    destination: "Broker Nodes"
    description: "Publishes/consumes events [Kafka protocol over TLS]"
  - source: "Core E-Commerce Service"
    destination: "Schema Registry"
    description: "Validates payloads [HTTP/REST over TLS]"
  - source: "Broker Nodes"
    destination: "Schema Registry"
    description: "Validates event schemas [HTTP/REST]"
  - source: "Core E-Commerce Service & Notification Worker"
    destination: "Client Authentication & Authorization Manager"
    description: "Authenticates connections [IAM / SASL over TLS]"
  - source: "Broker Nodes"
    destination: "Cluster Monitoring & Metrics Exporter"
    description: "Emits telemetry [Prometheus metrics / AWS CloudWatch]"
  - source: "Topic & Partition Manager"
    destination: "Broker Nodes"
    description: "Manages topic configurations [Kafka Admin Protocol over TLS]"
  - source: "Broker Nodes"
    destination: "Internal Storage Volumes"
    description: "Persists event streams [NVMe/EBS block storage interface]"
  - source: "Broker Nodes"
    destination: "Recommendation Engine"
    description: "Streams clickstream and order events [Kafka protocol over TLS]"
  - source: "Broker Nodes"
    destination: "AWS Glue & Athena"
    description: "Streams transactional audit data via S3 sink connectors [HTTPS]"