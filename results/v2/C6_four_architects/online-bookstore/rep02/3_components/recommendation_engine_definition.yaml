level: component
scope: "Component diagram for the Recommendation Engine container"
parentContainer:
  name: "Recommendation Engine"
elements:
  - type: "component"
    name: "API Controller"
    technology: "FastAPI (Python)"
    description: "Service handling incoming requests."
  - type: "component"
    name: "Model Inference Worker"
    technology: "PyTorch (Python)"
    description: "Worker executing scoring logic."
  - type: "component"
    name: "Feature Cache Client"
    technology: "Redis-py"
    description: "Client fetching pre-computed user/item embeddings."
  - type: "component"
    name: "Data Ingestion Consumer"
    technology: "Kafka Python"
    description: "Consumer consuming clickstream and purchase events."
  - type: "component"
    name: "Fallback Engine"
    technology: "Heuristic rule component"
    description: "Component for handling timeouts."
  - type: "component"
    name: "Model Registry Client"
    technology: "AWS SageMaker"
    description: "Client for dynamic weight hot-reloading."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Database for fallback recommendation metadata and processed interaction features."
  - type: "component"
    name: "Amazon MSK"
    technology: "Amazon MSK"
    description: "Streaming service for real-end user interaction events."
relationships:
  - source: "API Controller"
    destination: "Model Inference Worker"
    description: "Invokes scoring logic [In-process / Asyncio]"
  - source: "Model Inference Worker"
    destination: "Feature Cache Client"
    description: "Retrieves user preference vectors [TCP / Redis Protocol]"
  - source: "Model Inference Worker"
    destination: "Amazon DynamoDB"
    description: "Fetches fallback recommendation metadata [TLS]"
  - source: "Amazon MSK"
    destination: "Data Ingestion Consumer"
    description: "Streams real-end user interaction events [TCP / Kafka Protocol]"
  - source: "API Controller"
    destination: "Fallback Engine"
    description: "Queries fallback rules on cache/inference timeout [In-process]"
  - source: "Model Inference Worker"
    destination: "Model Registry Client"
    description: "Polls/fetches updated model artifacts [HTTPS / S3]"
  - source: "Data Ingestion Consumer"
    destination: "Amazon DynamoDB"
    description: "Persists processed interaction features [TLS]"