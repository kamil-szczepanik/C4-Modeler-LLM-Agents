level: component
scope: "Component diagram for the Amazon Aurora Global Database container"
parentContainer:
  name: "Amazon Aurora Global Database"
elements:
  - type: "component"
    name: "Primary DB Instance"
    technology: "PostgreSQL, Amazon Aurora"
    description: "Handles master write operations and ACID transactions."
  - type: "component"
    name: "Secondary DB Instances"
    technology: "PostgreSQL, Amazon Aurora"
    description: "Handles read-only queries across secondary global regions."
  - type: "component"
    name: "Aurora Distributed Storage Volume"
    technology: "AWS Distributed Storage"
    description: "Persists transaction logs and data storage across block-level replication."
  - type: "component"
    name: "Global Database Manager (GDM)"
    technology: "AWS Aurora GDM"
    description: "Manages replication and global state across regions."
  - type: "component"
    name: "Aurora Connection Manager (AWS RDS Proxy)"
    technology: "AWS RDS Proxy"
    description: "Routes and manages pooled SQL connections for high availability."
  - type: "component"
    name: "Global Routing & Failover Monitor"
    technology: "AWS Route 53 / Aurora Monitor"
    description: "Monitors health and orchestrates automatic cross-region failover."
  - type: "component"
    name: "Audit & Compliance Logging Subsystem"
    technology: "AWS Database Activity Streams / Kinesis / Lambda"
    description: "Streams security and audit events for compliance."
  - type: "component"
    name: "Read/Write Endpoint Resolver"
    technology: "AWS DNS / RDS Endpoint"
    description: "Resolves connection endpoints to primary or secondary instances."
relationships:
  - source: "Aurora Connection Manager (AWS RDS Proxy)"
    destination: "Primary DB Instance"
    description: "Forwards pooled write connections [TLS/PostgreSQL wire protocol]"
  - source: "Aurora Connection Manager (AWS RDS Proxy)"
    destination: "Secondary DB Instances"
    description: "Forwards pooled read connections [TLS/PostgreSQL wire protocol]"
  - source: "Primary DB Instance"
    destination: "Aurora Distributed Storage Volume"
    description: "Persists transaction logs via block-level replication [Internal AWS Protocol]"
  - source: "Aurora Distributed Storage Volume"
    destination: "Secondary DB Instances"
    description: "Cross-region storage replication < 1 second lag [AWS Backbone Network]"
  - source: "Primary DB Instance"
    destination: "Audit & Compliance Logging Subsystem"
    description: "Streams security and audit events [AWS Database Activity Streams / Kinesis]"