level: component
scope: "Component diagram for the Notification Worker container"
parentContainer:
  name: "Notification Worker"
elements:
  - type: "component"
    name: "Kafka Consumer"
    technology: "ECS / Java"
    description: "Consumes event streams from Amazon MSK via Kafka protocol over TLS."
  - type: "component"
    name: "Preference & Compliance Filter"
    technology: "ECS / Java"
    description: "Filters events based on user notification preferences and GDPR/CCPA compliance rules."
  - type: "component"
    name: "Template Renderer"
    technology: "ECS / Java"
    description: "Renders notification templates for emails and alerts."
  - type: "component"
    name: "Template Cache Manager"
    technology: "ECS / Amazon ElastiCache"
    description: "Manages low-latency caching for notification templates."
  - type: "component"
    name: "Dispatch Adapter"
    technology: "ECS / Java"
    description: "Dispatches rendered notifications to external delivery services."
  - type: "component"
    name: "DLQ Handler"
    technology: "ECS / Java"
    description: "Handles dead-letter queue processing for failed notification deliveries."
relationships:
  - source: "Kafka Consumer"
    destination: "Preference & Compliance Filter"
    description: "Passes raw events for validation"
  - source: "Preference & Compliance Filter"
    destination: "Template Renderer"
    description: "Forwards filtered events for template processing"
  - source: "Template Renderer"
    destination: "Template Cache Manager"
    description: "Retrieves cached templates"
  - source: "Template Renderer"
    destination: "Dispatch Adapter"
    description: "Sends rendered messages for delivery"
  - source: "Dispatch Adapter"
    destination: "DLQ Handler"
    description: "Routes failed deliveries to DLQ"