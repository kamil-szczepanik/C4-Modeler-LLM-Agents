level: component
scope: "Component diagram for the Amazon DynamoDB container"
parentContainer:
  name: "Amazon DynamoDB"
elements:
  - type: "component"
    name: "Request Router / API Frontend"
    technology: "AWS Distributed Router"
    description: "Routes incoming API requests to appropriate storage nodes."
  - type: "component"
    name: "Partition Router / Storage Nodes"
    technology: "DynamoDB Storage Engine"
    description: "Manages data partitions and handles read/write operations."
  - type: "component"
    name: "Replication Engine"
    technology: "Internal AWS replication protocol"
    description: "Handles multi-AZ and cross-region data replication."
  - type: "component"
    name: "DAX Service Node"
    technology: "Amazon DynamoDB Accelerator"
    description: "Provides low-latency in-memory caching and NoSQL data access."
  - type: "component"
    name: "Global Table Replicator"
    technology: "DynamoDB Global Tables"
    description: "Synchronizes data across multiple global AWS regions."
  - type: "component"
    name: "Streams Worker"
    technology: "DynamoDB Streams"
    description: "Captures stream of item-level modifications in DynamoDB tables."
  - type: "component"
    name: "Time-to-Live (TTL) Background Worker"
    technology: "DynamoDB TTL Service"
    description: "Deletes expired items from tables automatically."
relationships:
  - source: "Partition Router / Storage Nodes"
    destination: "Replication Engine"
    description: "Multi-AZ and cross-region replication [Internal AWS replication protocol over TLS]"
  - source: "Partition Router / Storage Nodes"
    destination: "Global Table Replicator"
    description: "Multi-AZ and cross-region replication [Internal AWS replication protocol over TLS]"
  - source: "Streams Worker"
    destination: "Compliance/Audit Lambda"
    description: "Publishes change data capture events [HTTPS / TLS 1.3, IAM]"