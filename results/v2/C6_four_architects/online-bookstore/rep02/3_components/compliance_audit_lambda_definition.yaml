level: component
scope: "Component diagram for the Compliance/Audit Lambda container"
parentContainer:
  name: "Compliance/Audit Lambda"
elements:
  - type: "component"
    name: "Event Router"
    technology: "TypeScript"
    description: "Component multiplexing incoming events from Amazon EventBridge and Amazon MSK."
  - type: "component"
    name: "Compliance Policy Validator"
    technology: "TypeScript"
    description: "Rule-evaluation component checking retention and consent rules."
  - type: "component"
    name: "Audit Log Ingestor"
    technology: "Node.js/TypeScript, AWS SDK"
    description: "Component utilizing AWS SDK to consume security and data-access events."
  - type: "component"
    name: "GDPR/CCPA Data Redactor"
    technology: "TypeScript"
    description: "Component executing erasure, anonymization, and PII scrubbing."
  - type: "component"
    name: "Compliance Report Generator"
    technology: "TypeScript, AWS SDK"
    description: "Component aggregating audit trails and building scheduled reports."
  - type: "component"
    name: "Amazon MSK"
    technology: "Apache Kafka"
    description: "External messaging system acting as an event source."
  - type: "component"
    name: "Amazon Aurora Global Database"
    technology: "SQL Database"
    description: "External relational database storing persistent data."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "NoSQL Database"
    description: "External NoSQL database storing operational data."
  - type: "component"
    name: "Amazon S3"
    technology: "Object Storage"
    description: "External storage service for report exports."
  - type: "component"
    name: "Amazon Athena"
    technology: "Query Service"
    description: "External query service for reading immutable metadata."
relationships:
  - source: "Event Router"
    destination: "Audit Log Ingestor"
    description: "Dispatches payloads via in-memory function calls"
  - source: "Event Router"
    destination: "GDPR/CCPA Data Redactor"
    description: "Dispatches payloads via in-memory function calls"
  - source: "Event Router"
    destination: "Compliance Policy Validator"
    description: "Dispatches payloads via in-memory function calls"
  - source: "Compliance Policy Validator"
    destination: "GDPR/CCPA Data Redactor"
    description: "Triggers via in-memory calls when regulatory thresholds are met"
  - source: "Audit Log Ingestor"
    destination: "Amazon MSK"
    description: "Consumes events via TCP/TLS"
  - source: "GDPR/CCPA Data Redactor"
    destination: "Amazon Aurora Global Database"
    description: "Queries/mutates via SQL protocols over TLS"
  - source: "GDPR/CCPA Data Redactor"
    destination: "Amazon DynamoDB"
    description: "Queries/mutates via NoSQL protocols over TLS"
  - source: "Compliance Report Generator"
    destination: "Amazon S3"
    description: "Writes exports via HTTPS"
  - source: "Compliance Report Generator"
    destination: "Amazon Athena"
    description: "Reads immutable metadata via HTTPS (AWS SDK)"