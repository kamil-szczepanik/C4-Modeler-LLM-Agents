# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Customer"
    description: "Customers accessing the platform via web browsers."
  - type: "person"
    name: "Admin/Content Manager"
    description: "Admin and Content Managers accessing the platform via web browsers."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system for processing payments."
  - type: "externalSystem"
    name: "Third-Party Shipping API"
    description: "External system for order fulfillment and shipping."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External system for sending emails and notifications."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External system for authentication and identity management."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "External system for calculating taxes."
  - type: "container"
    name: "AWS Route 53 & Amazon CloudFront"
    technology: "AWS Route 53, Amazon CloudFront CDN"
    description: "Global routing and content delivery network."
  - type: "container"
    name: "Frontend SPA"
    technology: "React, TypeScript, AWS S3"
    description: "Presentation layer single-page application stored in AWS S3."
  - type: "container"
    name: "BFF Container"
    technology: "Next.js, Node.js, Amazon ECS/Fargate"
    description: "Backend-for-Frontend container for server-side rendering and routing."
  - type: "container"
    name: "AWS API Gateway"
    technology: "AWS API Gateway"
    description: "Gateway for routing incoming traffic and security validation."
  - type: "container"
    name: "Compliance/Audit Lambda"
    technology: "AWS Lambda"
    description: "Container/function for compliance and auditing."
  - type: "container"
    name: "Core E-Commerce Service"
    technology: "Spring Boot, Java"
    description: "Handles transactional core business logic."
  - type: "container"
    name: "Recommendation Engine"
    technology: "FastAPI, Python"
    description: "Generates AI-powered book recommendations."
  - type: "container"
    name: "Search & Discovery"
    technology: "Amazon OpenSearch"
    description: "Manages catalog queries and search functionality."
  - type: "container"
    name: "Notification Worker"
    technology: "Amazon ECS/Fargate"
    description: "Processes background notification tasks."
  - type: "container"
    name: "Amazon Aurora Global Database"
    technology: "PostgreSQL, Amazon Aurora"
    description: "Relational database for ACID checkout and global operations."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "NoSQL database for reviews and caching."
  - type: "container"
    name: "Amazon ElastiCache"
    technology: "Redis"
    description: "In-memory data store for low-latency read caching."
  - type: "container"
    name: "Amazon MSK"
    technology: "Apache Kafka"
    description: "Event streaming and messaging bus."
  - type: "container"
    name: "AWS Glue & Athena"
    technology: "AWS Glue, Amazon Athena"
    description: "Data lake and analytics infrastructure."
relationships:
  - source: "Customer"
    destination: "AWS Route 53 & Amazon CloudFront"
    description: "Accesses via web browsers"
    technology: "HTTPS"
  - source: "Admin/Content Manager"
    destination: "AWS Route 53 & Amazon CloudFront"
    description: "Accesses via web browsers"
    technology: "HTTPS"
  - source: "AWS Route 53 & Amazon CloudFront"
    destination: "BFF Container"
    description: "Routes client traffic"
    technology: "HTTPS"
  - source: "BFF Container"
    destination: "AWS API Gateway"
    description: "Proxies requests"
    technology: "gRPC over TLS"
  - source: "AWS API Gateway"
    destination: "Core E-Commerce Service"
    description: "Routes business requests"
    technology: "gRPC over TLS"
  - source: "AWS API Gateway"
    destination: "Recommendation Engine"
    description: "Routes recommendation requests"
    technology: "gRPC over TLS"
  - source: "AWS API Gateway"
    destination: "Search & Discovery"
    description: "Routes search queries"
    technology: "gRPC over TLS"
  - source: "Core E-Commerce Service"
    destination: "Amazon Aurora Global Database"
    description: "Executes ACID transactions"
    technology: "TLS/JDBC"
  - source: "Core E-Commerce Service"
    destination: "Amazon ElastiCache"
    description: "Reads/writes cached data"
    technology: "RESP over TLS"
  - source: "Core E-Commerce Service"
    destination: "Amazon DynamoDB"
    description: "Accesses NoSQL data"
    technology: "TLS"
  - source: "Recommendation Engine"
    destination: "Amazon DynamoDB"
    description: "Accesses data"
    technology: "TLS"
  - source: "Core E-Commerce Service"
    destination: "Amazon MSK"
    description: "Publishes and consumes events"
    technology: "Kafka protocol over TLS"
  - source: "Notification Worker"
    destination: "Amazon MSK"
    description: "Consumes event streams"
    technology: "Kafka protocol over TLS"
  - source: "Notification Worker"
    destination: "Notification Service"
    description: "Sends notifications"
    technology: "Secure REST/HTTPS"
  - source: "Core E-Commerce Service"
    destination: "Payment Gateway"
    description: "Processes payments"
    technology: "Secure REST/HTTPS"
  - source: "Core E-Commerce Service"
    destination: "Third-Party Shipping API"
    description: "Coordinates fulfillment"
    technology: "Secure REST/HTTPS"
  - source: "Core E-Commerce Service"
    destination: "Tax Calculation Service"
    description: "Calculates taxes"
    technology: "Secure REST/HTTPS"
  - source: "AWS API Gateway"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "Secure REST/HTTPS"
  - source: "AWS Glue & Athena"
    destination: "Amazon Aurora Global Database"
    description: "Analyzes data lake"
    technology: "JDBC/TLS"