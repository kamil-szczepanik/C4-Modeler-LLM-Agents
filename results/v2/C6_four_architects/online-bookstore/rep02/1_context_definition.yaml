level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "A globally distributed, cloud-hosted e-commerce platform designed to support book purchasing, reviews, and recommendations with robust scalability and multi-region availability."
elements:
  - type: "person"
    name: "Customer"
    description: "Web/Mobile User who browses, purchases books, and interacts with the platform."
  - type: "person"
    name: "Admin/Content Manager"
    description: "Manager who oversees content, catalogue, and system administration."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe/PayPal service for processing transactions."
  - type: "externalSystem"
    name: "Third-Party Shipping API"
    description: "FedEx/UPS for order fulfillment and shipping."
  - type: "externalSystem"
    name: "Email/Notification Service"
    description: "SES/SendGrid for sending notifications and emails."
  - type: "externalSystem"
    name: "External Identity Provider"
    description: "AWS Cognito/Auth0 for authentication and identity management."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "Avalara/TaxJar for calculating taxes."
  - type: "container"
    name: "Frontend SPA"
    description: "Delivers rapid content and performance to users."
    technology: "React on AWS CloudFront/S3"
  - type: "container"
    name: "API Gateway"
    description: "Routes incoming traffic and validates tokens."
    technology: "AWS API Gateway"
  - type: "container"
    name: "Catalogue & Search Service"
    description: "Manages book catalogue and search functionalities."
    technology: "Node.js/Go with Amazon OpenSearch"
  - type: "container"
    name: "Checkout & Order Service"
    description: "Handles orders, transactions, and publishes events."
    technology: "Java/Spring Boot"
  - type: "container"
    name: "Recommendation Service"
    description: "Generates personalized book recommendations."
    technology: "Python/FastAPI"
  - type: "container"
    name: "Async Worker"
    description: "Processes asynchronous tasks and workflows."
    technology: "AWS Lambda/ECS Fargate"
  - type: "container"
    name: "Amazon Aurora Global Database"
    description: "Stores relational data and executes ACID transactions."
    technology: "Amazon Aurora"
  - type: "container"
    name: "Amazon ElastiCache"
    description: "Provides low-latency caching for catalogue data."
    technology: "Redis"
  - type: "container"
    name: "Amazon DynamoDB"
    description: "NoSQL data store for catalogue and recommendations."
    technology: "Amazon DynamoDB"
  - type: "container"
    name: "Amazon SQS/SNS"
    description: "Messaging system for decoupled event-driven workflows."
    technology: "Amazon SQS/SNS"
relationships:
  - source: "Customer"
    destination: "Frontend SPA"
    description: "Browses and interacts with the platform"
    technology: "HTTPS"
  - type: "Admin/Content Manager"
    destination: "Frontend SPA"
    description: "Manages platform content and administration"
    technology: "HTTPS"
  - source: "Frontend SPA"
    destination: "API Gateway"
    description: "Sends requests to backend services"
    technology: "REST/gRPC over TLS"
  - source: "API Gateway"
    destination: "Catalogue & Search Service"
    description: "Routes catalogue and search requests, validating tokens via External Identity Provider"
    technology: "REST/gRPC over TLS"
  - source: "API Gateway"
    destination: "Checkout & Order Service"
    description: "Routes checkout and order requests"
    technology: "REST/gRPC over TLS"
  - source: "API Gateway"
    destination: "Recommendation Service"
    description: "Routes recommendation requests"
    technology: "REST/gRPC over TLS"
  - source: "Checkout & Order Service"
    destination: "Amazon Aurora Global Database"
    description: "Executes ACID transactions"
    technology: "JDBC over TLS"
  - source: "Catalogue & Search Service"
    destination: "Amazon ElastiCache"
    description: "Retrieves cached data"
    technology: "Redis Protocol over TLS"
  - source: "Checkout & Order Service"
    destination: "Amazon SQS/SNS"
    description: "Publishes order events asynchronously"
    technology: "Messaging over TLS"
  - source: "Async Worker"
    destination: "Third-Party Shipping API"
    description: "Integrates for fulfillment"
    technology: "REST/HTTPS"
  - source: "Async Worker"
    destination: "Email/Notification Service"
    description: "Sends alerts and notifications"
    technology: "REST/HTTPS"
  - source: "Checkout & Order Service"
    destination: "Payment Gateway"
    description: "Processes payments"
    technology: "REST/HTTPS"
  - source: "Checkout & Order Service"
    destination: "Tax Calculation Service"
    description: "Calculates taxes"
    technology: "REST/HTTPS"