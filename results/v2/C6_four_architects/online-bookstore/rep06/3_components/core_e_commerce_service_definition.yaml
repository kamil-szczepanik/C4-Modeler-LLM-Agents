level: component
scope: "Component diagram for the Core E-Commerce Service container"
parentContainer:
  name: "Core E-Commerce Service"
elements:
  - type: "component"
    name: "Catalog Component"
    technology: "NestJS Module / TypeScript"
    description: "Manages book browsing, keyword searches, and product details."
  - type: "component"
    name: "Cart Management Component"
    technology: "NestJS Module / TypeScript"
    description: "Handles shopping cart state and low-latency session caching."
  - type: "component"
    name: "Checkout & Order Processing Component"
    technology: "NestJS Module / TypeScript"
    description: "Orchestrates secure transactions and multi-currency pricing."
  - type: "component"
    name: "Rating & Review Component"
    technology: "NestJS Module / TypeScript"
    description: "Manages customer reviews and 5-star ratings."
  - type: "component"
    name: "Currency Conversion Component"
    technology: "NestJS Module / TypeScript"
    description: "Resolves dynamic pricing across USD, EUR, and GBP."
  - type: "component"
    name: "Shipping Integration Component"
    technology: "NestJS Module / TypeScript"
    description: "Coordinates asynchronous third-party shipping API calls."
  - type: "component"
    name: "Inventory Management Component"
    technology: "NestJS Module / TypeScript"
    description: "Validates and reserves stock levels to prevent overselling."
  - type: "component"
    name: "Event Dispatcher Component"
    technology: "NestJS Module / TypeScript"
    description: "Publishes domain events asynchronously."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Relational Database"
    description: "Stores transactional data for orders, catalog, and reviews."
  - type: "component"
    name: "Amazon DynamoDB & Amazon ElastiCache (Redis)"
    technology: "NoSQL & In-Memory Cache"
    description: "Persists session/cart state and caches currency rates."
  - type: "component"
    name: "Amazon SQS"
    technology: "Message Queue"
    description: "Triggers shipping integration tasks."
  - type: "component"
    name: "Amazon EventBridge"
    technology: "Event Bus"
    description: "Publishes domain events such as OrderPlaced and ReviewAdded."
relationships:
  - source: "Catalog Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes transactional data [SQL/TLS via TypeORM]"
  - source: "Checkout & Order Processing Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes transactional data [SQL/TLS via TypeORM]"
  - source: "Inventory Management Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes transactional data [SQL/TLS via TypeORM]"
  - source: "Rating & Review Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes transactional data [SQL/TLS via TypeORM]"
  - source: "Cart Management Component"
    destination: "Amazon DynamoDB & Amazon ElastiCache (Redis)"
    description: "Persists session/cart state [Redis Protocol / TLS]"
  - source: "Checkout & Order Processing Component"
    destination: "Amazon SQS"
    description: "Triggers shipping integration tasks [AWS SDK / HTTPS]"
  - source: "Event Dispatcher Component"
    destination: "Amazon EventBridge"
    description: "Publishes domain events [AWS SDK / HTTPS]"
  - source: "Internal Components"
    destination: "Internal Components"
    description: "Executes synchronous business logic [TypeScript interfaces / In-Process Method Calls]"