level: component
scope: "Component diagram for the AWS API Gateway container"
parentContainer:
  name: "AWS API Gateway"
elements:
  - type: "component"
    name: "Custom Domain & SSL/TLS Termination"
    technology: "AWS Certificate Manager & Route 53"
    description: "Handles custom domain routing and SSL/TLS certificate termination at the edge."
  - type: "component"
    name: "AWS WAF"
    technology: "AWS WAF"
    description: "Protects APIs against common web exploits and OWASP Top-10 vulnerabilities."
  - type: "component"
    name: "Amazon Cognito JWT Authorizer"
    technology: "Amazon Cognito"
    description: "Validates JSON Web Tokens (JWT) for secure authentication and authorization."
  - type: "component"
    name: "API Router & Validator"
    technology: "AWS API Gateway"
    description: "Routes incoming requests to appropriate downstream services and validates request payloads."
  - type: "component"
    name: "API Gateway Usage Plans & Throttling"
    technology: "AWS API Gateway"
    description: "Manages rate limits and usage plans to control traffic and prevent abuse."
  - type: "component"
    name: "Request Transformer"
    technology: "AWS API Gateway"
    description: "Transforms request and response payloads between the client and backend services."
  - type: "component"
    name: "Endpoint Logging & Metrics"
    technology: "Amazon CloudWatch"
    description: "Captures logs and operational metrics for monitoring and auditing."
  - type: "component"
    name: "Mock / Documentation"
    technology: "OpenAPI / Swagger"
    description: "Provides API mock integrations and interactive API documentation."
relationships:
  - source: "Custom Domain & SSL/TLS Termination"
    destination: "AWS WAF"
    description: "Inspects incoming secure traffic"
  - source: "AWS WAF"
    destination: "Amazon Cognito JWT Authorizer"
    description: "Passes filtered requests for authentication"
  - source: "Amazon Cognito JWT Authorizer"
    destination: "API Router & Validator"
    description: "Forwards authenticated requests for routing and validation"
  - source: "API Router & Validator"
    destination: "API Gateway Usage Plans & Throttling"
    description: "Applies throttling limits"
  - source: "API Gateway Usage Plans & Throttling"
    destination: "Request Transformer"
    description: "Transforms validated requests"
  - source: "Request Transformer"
    destination: "Endpoint Logging & Metrics"
    description: "Logs request execution details"