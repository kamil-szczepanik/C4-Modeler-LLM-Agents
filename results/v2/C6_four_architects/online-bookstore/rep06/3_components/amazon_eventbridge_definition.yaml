level: component
scope: "Component diagram for the Amazon EventBridge container"
parentContainer:
  name: "Amazon EventBridge"
elements:
  - type: "component"
    name: "Event Bus"
    technology: "AWS EventBridge Service"
    description: "Receives domain events from the Core E-Commerce Service and routes them asynchronously."
  - type: "component"
    name: "Rule Router"
    technology: "EventBridge Routing Rules"
    description: "Evaluates event patterns and dispatches payloads to appropriate downstream targets."
relationships:
  - source: "Event Bus"
    destination: "Rule Router"
    description: "Evaluates incoming events against routing rules [AWS Internal]"