level: component
scope: "Component diagram for the Amazon ElastiCache (Redis) container"
parentContainer:
  name: "Amazon ElastiCache (Redis)"
elements:
  - type: "component"
    name: "Session Store Component"
    technology: "Amazon ElastiCache for Redis"
    description: "Stores user session data for fast retrieval and persistence across requests."
  - type: "component"
    name: "Catalog Cache Component"
    technology: "Amazon ElastiCache for Redis"
    description: "Caches book catalog and product details to ensure sub-2-second page loads."
  - type: "component"
    name: "Rate Limiter / Token Bucket Component"
    technology: "Amazon ElastiCache for Redis, Lua scripting"
    description: "Controls request rates and enforces token bucket algorithm for API throttling."
  - type: "component"
    name: "Distributed Lock Component"
    technology: "Amazon ElastiCache for Redis, Lua scripting"
    description: "Provides atomic execution for distributed locking and inventory management."
  - type: "component"
    name: "Pub/Sub Broker Component"
    technology: "Amazon ElastiCache for Redis"
    description: "Handles asynchronous messaging and event broadcasting between internal services."
  - type: "component"
    name: "Shopping Cart & Checkout Cache Component"
    technology: "Amazon ElastiCache for Redis"
    description: "Temporarily holds active shopping cart and secure checkout state."
  - type: "component"
    name: "Metrics & Slow-Log Collector"
    technology: "Amazon CloudWatch Agent / Redis INFO API"
    description: "Gathers performance metrics, slow logs, and health status for monitoring."
  - type: "component"
    name: "Redis Auth & ACL Enforcement"
    technology: "Redis AUTH & ACL"
    description: "Enforces security compliance via user/password credentials and access control lists over TLS."
  - type: "component"
    name: "Redis Eviction Engine"
    technology: "volatile-lru eviction policy"
    description: "Manages automated memory cleanup to prevent out-of-memory crashes."
relationships:
  - source: "Core E-Commerce Service"
    destination: "Session Store Component"
    description: "Redis RESP protocol over TLS"
  - source: "Core E-Commerce Service"
    destination: "Catalog Cache Component"
    description: "Redis RESP protocol over TLS"
  - source: "Core E-Commerce Service"
    destination: "Shopping Cart & Checkout Cache Component"
    description: "Redis RESP protocol over TLS"
  - source: "Core E-Commerce Service"
    destination: "Distributed Lock Component"
    description: "Redis RESP protocol over TLS"
  - source: "Core E-Commerce Service"
    destination: "Pub/Sub Broker Component"
    description: "Redis RESP protocol over TLS"
  - source: "Recommendation Engine"
    destination: "Catalog Cache Component"
    description: "Redis RESP protocol over TLS"
  - source: "Integration Service"
    destination: "Rate Limiter / Token Bucket Component"
    description: "Redis RESP protocol over TLS"
  - source: "AWS CloudWatch"
    destination: "Metrics & Slow-Log Collector"
    description: "Amazon CloudWatch Agent / Redis INFO API"
  - source: "Core E-Commerce Service & Recommendation Engine"
    destination: "Redis Auth & ACL Enforcement"
    description: "AUTH with user/password credentials over TLS"