level: component
scope: "Component diagram for the Audit & Compliance Service container"
parentContainer:
  name: "Audit & Compliance Service"
elements:
  - type: "component"
    name: "Audit Event Consumer"
    technology: "Node.js / TypeScript"
    description: "Consumes audit events from Amazon SQS."
  - type: "component"
    name: "Compliance Policy Engine"
    technology: "Node.js / TypeScript"
    description: "Enforces strict GDPR and CCPA regulations and triggers Amazon EventBridge for GDPR cascades."
  - type: "component"
    name: "Audit Log Repository Interface"
    technology: "Node.js / TypeScript"
    description: "Persists audit logs to Amazon Aurora PostgreSQL using WORM/RLS append-only data storage."
  - type: "component"
    name: "Compliance API Controller"
    technology: "Node.js / TypeScript"
    description: "Receives requests from AWS API Gateway for data subject access requests."
  - type: "component"
    name: "Data Export Generator"
    technology: "Node.js / TypeScript"
    description: "Writes encrypted DSAR export bundles to Amazon S3."
  - type: "component"
    name: "Retention Policy Scheduler"
    technology: "Node.js / TypeScript"
    description: "Manages data retention and triggers the Compliance Policy Engine."
  - type: "component"
    name: "Compliance Health & Metrics Monitor"
    technology: "OpenTelemetry / Prometheus"
    description: "Collects metrics and observability instrumentation from system components."
  - type: "system"
    name: "Amazon SQS"
    technology: "AMQP/SQS"
    description: "External messaging queue for audit events."
  - type: "system"
    name: "Amazon EventBridge"
    technology: "Async Events / JSON over EventBridge"
    description: "Event bus for GDPR cascades."
  - type: "system"
    name: "Amazon Aurora PostgreSQL"
    technology: "TLS/TCP"
    description: "Secure WORM/RLS append-only data storage."
  - type: "system"
    name: "AWS API Gateway"
    technology: "HTTPS/REST"
    description: "API Gateway routing incoming compliance requests."
  - type: "system"
    name: "Amazon S3"
    technology: "HTTPS/S3 API"
    description: "Temporary storage for encrypted DSAR export bundles."
relationships:
  - source: "Audit Event Consumer"
    destination: "Amazon SQS"
    description: "Reads from [AMQP/SQS]"
  - source: "Compliance Policy Engine"
    destination: "Amazon EventBridge"
    description: "Triggers Amazon EventBridge for GDPR cascades [Async Events / JSON over EventBridge]"
  - source: "Audit Log Repository Interface"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists to [TLS/TCP]"
  - source: "Compliance API Controller"
    destination: "AWS API Gateway"
    description: "Receives requests from [HTTPS/REST]"
  - source: "Data Export Generator"
    destination: "Amazon S3"
    description: "Writes to [HTTPS/S3 API]"
  - source: "Retention Policy Scheduler"
    destination: "Compliance Policy Engine"
    description: "Triggers [In-Process]"
  - source: "Audit Event Consumer"
    destination: "Compliance Health & Metrics Monitor"
    description: "Emits metrics to [In-Process / OpenTelemetry]"
  - source: "Compliance Policy Engine"
    destination: "Compliance Health & Metrics Monitor"
    description: "Emits metrics to [In-Process / OpenTelemetry]"
  - source: "Audit Log Repository Interface"
    destination: "Compliance Health & Metrics Monitor"
    description: "Emits metrics to [In-Process / OpenTelemetry]"
  - source: "Compliance API Controller"
    destination: "Compliance Health & Metrics Monitor"
    description: "Emits metrics to [In-Process / OpenTelemetry]"
  - source: "Data Export Generator"
    destination: "Compliance Health & Metrics Monitor"
    description: "Emits metrics to [In-Process / OpenTelemetry]"
  - source: "Retention Policy Scheduler"
    destination: "Compliance Health & Metrics Monitor"
    description: "Emits metrics to [In-Process / OpenTelemetry]"