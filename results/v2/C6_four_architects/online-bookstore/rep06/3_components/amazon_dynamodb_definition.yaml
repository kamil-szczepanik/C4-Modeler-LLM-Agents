level: component
scope: "Component diagram for the Amazon DynamoDB container"
parentContainer:
  name: "Amazon DynamoDB"
elements:
  - type: "component"
    name: "Cart Table Component"
    technology: "Amazon DynamoDB Table"
    description: "Stores transient shopping cart items using partition key userId and sort key cartId."
  - type: "component"
    name: "Session Table Component"
    technology: "Amazon DynamoDB Table with Global Tables"
    description: "Stores user session states with automatic TTL cleanup and multi-active cross-region replication."
  - type: "component"
    name: "DynamoDB Encryption Component"
    technology: "AWS KMS"
    description: "Enforces data encryption at rest using AWS KMS."
  - type: "component"
    name: "DynamoDB Streams Component"
    technology: "DynamoDB Streams"
    description: "Captures item modifications for real-time change data capture."
  - type: "component"
    name: "DynamoDB PITR"
    technology: "Amazon DynamoDB PITR"
    description: "Provides continuous backups for data durability."
  - type: "component"
    name: "Core E-Commerce Service"
    technology: "AWS SDK"
    description: "Reads/writes cart state and validates/updates session state."
  - type: "component"
    name: "Amazon EventBridge"
    technology: "Amazon EventBridge"
    description: "Receives forwarded cart abandonment events."
relationships:
  - source: "Core E-Commerce Service"
    destination: "Cart Table Component"
    description: "Reads and writes cart state via AWS SDK [HTTPS / TLS 1.3]."
  - source: "Core E-Commerce Service"
    destination: "Session Table Component"
    description: "Validates and updates session state via AWS SDK [HTTPS / TLS 1.3]."
  - source: "Cart Table Component"
    destination: "DynamoDB Encryption Component"
    description: "Encrypts stored PII data at rest [AWS KMS API / TLS 1.3]."
  - source: "Session Table Component"
    destination: "DynamoDB Encryption Component"
    description: "Encrypts stored PII data at rest [AWS KMS API / TLS 1.3]."
  - source: "Cart Table Component"
    destination: "DynamoDB Streams Component"
    description: "Emits cart abandonment events [AWS Internal]."
  - source: "DynamoDB Streams Component"
    destination: "Amazon EventBridge"
    description: "Forwards cart abandonment events [AWS SDK / TLS 1.3]."