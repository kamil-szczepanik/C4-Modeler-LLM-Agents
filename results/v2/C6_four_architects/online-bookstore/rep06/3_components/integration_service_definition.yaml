level: component
scope: "Component diagram for the Integration Service container"
parentContainer:
  name: "Integration Service"
elements:
  - type: "component"
    name: "Payment Orchestrator Component"
    technology: "Node.js with TypeScript"
    description: "Orchestrates payment processing with external gateways."
  - type: "component"
    name: "Shipping Adaptor Component"
    technology: "Node.js with TypeScript"
    description: "Coordinates fulfillment with third-party shipping APIs."
  - type: "component"
    name: "Currency Sync Worker Component"
    technology: "Node.js with TypeScript"
    description: "Fetches currency exchange rates and updates cache."
  - type: "component"
    name: "Integration Message Consumer Component"
    technology: "Node.js with TypeScript, Amazon SQS"
    description: "Consumes messages for asynchronous task distribution."
  - type: "component"
    name: "Notification Dispatcher Component"
    technology: "Node.js with TypeScript"
    description: "Dispatches alerts to the notification service."
  - type: "component"
    name: "Integration State Store Client Component"
    technology: "Node.js with TypeScript, pg"
    description: "Persists outbox state in the relational database."
  - type: "component"
    name: "Payment Gateway"
    technology: "External API"
    description: "Processes secure payments."
  - type: "component"
    name: "Third-Party Shipping API"
    technology: "External API"
    description: "Coordinates order fulfillment."
  - type: "component"
    name: "Currency Exchange Rate API"
    technology: "External API"
    description: "Provides currency exchange rates."
  - type: "component"
    name: "Notification Service"
    technology: "Container"
    description: "Sends alerts."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Relational Database"
    description: "Transactional outbox pattern and auditability storage."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Redis"
    description: "Caches currency exchange rates."
  - type: "component"
    name: "Amazon SQS"
    technology: "Message Queue"
    description: "Asynchronous task distribution queue."
relationships:
  - source: "Integration Message Consumer Component"
    destination: "Integration State Store Client Component"
    description: "Persists outbox state [SQL/TCP]"
  - source: "Integration Message Consumer Component"
    destination: "Payment Orchestrator Component"
    description: "Internal dispatch [In-Memory Function Call]"
  - source: "Integration Message Consumer Component"
    destination: "Shipping Adaptor Component"
    description: "Internal dispatch [In-Memory Function Call]"
  - source: "Integration Message Consumer Component"
    destination: "Notification Dispatcher Component"
    description: "Internal dispatch [In-Memory Function Call]"
  - source: "Payment Orchestrator Component"
    destination: "Payment Gateway"
    description: "Processes secure payments [HTTPS/REST]"
  - source: "Shipping Adaptor Component"
    destination: "Third-Party Shipping API"
    description: "Coordinates fulfillment [HTTPS/REST]"
  - source: "Notification Dispatcher Component"
    destination: "Notification Service"
    description: "Sends alerts [HTTPS/REST]"
  - source: "Currency Sync Worker Component"
    destination: "Currency Exchange Rate API"
    description: "Fetches rates [HTTPS/REST]"
  - source: "Currency Sync Worker Component"
    destination: "Amazon ElastiCache (Redis)"
    description: "Updates exchange rates [Redis Protocol]"