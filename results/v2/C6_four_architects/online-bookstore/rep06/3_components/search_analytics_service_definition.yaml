level: component
scope: "Component diagram for the Search & Analytics Service container"
parentContainer:
  name: "Search & Analytics Service"
elements:
  - type: "component"
    name: "Query API Controller"
    technology: "Node.js/TypeScript on AWS Lambda"
    description: "Routes search requests and executes full-text searches."
  - type: "component"
    name: "Indexing Worker"
    technology: "Python on AWS Lambda"
    description: "Triggers index updates and performs bulk updates and indexes data."
  - type: "component"
    name: "Analytics Aggregator"
    technology: "Python on AWS Lambda"
    description: "Publishes clickstream metrics."
  - type: "component"
    name: "Search Cache Layer"
    technology: "Amazon ElastiCache for Redis"
    description: "Caches frequent query results."
  - type: "component"
    name: "OpenSearch Index Cluster"
    technology: "Amazon OpenSearch Service"
    description: "Provides distributed full-text search and analytical capabilities."
  - type: "component"
    name: "AWS API Gateway"
    technology: "AWS API Gateway"
    description: "Routes search requests to the Query API Controller."
  - type: "component"
    name: "Amazon SQS / Amazon EventBridge"
    technology: "Amazon SQS / Amazon EventBridge"
    description: "Enables reliable asynchronous event-driven synchronization."
relationships:
  - source: "AWS API Gateway"
    destination: "Query API Controller"
    description: "Routes search requests [HTTPS/REST]"
  - source: "Query API Controller"
    destination: "Search Cache Layer"
    description: "Caches frequent query results [Redis protocol]"
  - source: "Query API Controller"
    destination: "OpenSearch Index Cluster"
    description: "Executes full-text searches [HTTPS/REST]"
  - source: "Amazon SQS / Amazon EventBridge"
    destination: "Indexing Worker"
    description: "Triggers index updates [JSON over SQS]"
  - source: "Indexing Worker"
    destination: "OpenSearch Index Cluster"
    description: "Bulk updates and indexes data [HTTPS/REST]"
  - source: "Analytics Aggregator"
    destination: "Amazon SQS / Amazon EventBridge"
    description: "Publishes clickstream metrics [JSON over EventBridge]"