level: component
scope: "Component diagram for the Recommendation Engine container"
parentContainer:
  name: "Recommendation Engine"
elements:
  - type: "component"
    name: "API Router / Controller"
    technology: "FastAPI"
    description: "Handles incoming HTTP requests and routes them to internal recommendation services."
  - type: "component"
    name: "Recommendation Service"
    technology: "Python"
    description: "Orchestrates personalized book recommendations and 'customers also bought' suggestions."
  - type: "component"
    name: "Model Scoring Agent"
    technology: "Python / scikit-learn / PyTorch"
    description: "Scores models to generate real-time recommendations."
  - type: "component"
    name: "Data Access Repository"
    technology: "SQLAlchemy / Boto3"
    description: "Interfaces with underlying data stores for profile and search operations."
  - type: "component"
    name: "Event Ingestion Listener"
    technology: "Python / Celery or asyncio worker"
    description: "Listens for asynchronous events and ingestion tasks."
  - type: "component"
    name: "Model Training Pipeline / Job Scheduler"
    technology: "Python / AWS SageMaker / ECS Scheduled Tasks"
    description: "Handles offline machine learning model training and scheduled jobs."
  - type: "component"
    name: "Recommendation Cache Manager"
    technology: "Python / Redis Client"
    description: "Manages in-memory caching to serve instant recommendations and protect the scoring engine."
relationships:
  - source: "API Router / Controller"
    destination: "Recommendation Service"
    description: "Delegates recommendation requests"
  - source: "Recommendation Service"
    destination: "Model Scoring Agent"
    description: "Requests model scoring"
  - source: "Recommendation Service"
    destination: "Recommendation Cache Manager"
    description: "Fetches and stores cached recommendations"
  - source: "Model Scoring Agent"
    destination: "Data Access Repository"
    description: "Retrieves profile and search data"
  - source: "Event Ingestion Listener"
    destination: "Data Access Repository"
    description: "Persists ingested event data"
  - source: "Model Training Pipeline / Job Scheduler"
    destination: "Data Access Repository"
    description: "Reads and writes historical training data"