level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL container"
parentContainer:
  name: "Amazon Aurora PostgreSQL"
elements:
  - type: "component"
    name: "Relational Database Engine"
    technology: "PostgreSQL 15+"
    description: "Handles core relational data management and ACID-compliant transactions for the e-commerce platform."
  - type: "component"
    name: "Aurora Storage Volume"
    technology: "Distributed Storage"
    description: "Provides scalable, fault-tolerant cloud storage underlying the Aurora database cluster."
  - type: "component"
    name: "Read Replica Endpoint"
    technology: "PostgreSQL Replica"
    description: "Serves read-heavy queries to offload traffic from the primary database instance."
  - type: "component"
    name: "Aurora Global Database Extension"
    technology: "Cross-Region Replication"
    description: "Enables fast local reads and low-latency global disaster recovery through asynchronous cross-region replication."
  - type: "component"
    name: "PostgreSQL Audit (pgaudit)"
    technology: "pgaudit Extension"
    description: "Generates detailed session and object audit logging to satisfy strict compliance constraints like GDPR and CCPA."
  - type: "component"
    name: "Connection Pooler (RDS Proxy)"
    technology: "RDS Proxy"
    description: "Manages and multiplexes database connections efficiently to support high concurrency from core services."
  - type: "component"
    name: "Automated Backup Subsystem"
    technology: "WAL streaming / Amazon S3"
    description: "Streams Write-Ahead Logs (WAL) to Amazon S3 to provide automated point-in-time recovery and backups."
relationships:
  - source: "Aurora Global Database Extension"
    destination: "Secondary Region Storage"
    description: "Asynchronous replication across AWS regions"
  - source: "Relational Database Engine"
    destination: "Automated Backup Subsystem"
    description: "WAL streaming to Amazon S3"