level: component
scope: "Component diagram for the React Single-Page Application (SPA) container"
parentContainer:
  name: "React Single-Page Application (SPA)"
elements:
  - type: "component"
    name: "Routing & Shell Component"
    technology: "React Router, Vite"
    description: "Manages application routing, layout shell, and global context provision."
  - type: "component"
    name: "Catalogue & Search View"
    technology: "React, Zustand"
    description: "Displays book catalogue and search results with local state management."
  - type: "component"
    name: "Checkout & Cart Workflow Component"
    technology: "React"
    description: "Handles shopping cart state and the checkout process."
  - type: "component"
    name: "Recommendation & Review Widget"
    technology: "React"
    description: "Displays product recommendations and user reviews."
  - type: "component"
    name: "Localization & Currency Context"
    technology: "React Context"
    description: "Manages localization settings and currency formatting."
  - type: "component"
    name: "API Client Service"
    technology: "TanStack React Query, Axios"
    description: "Handles server-state caching, data fetching, and REST API communication."
  - type: "component"
    name: "AWS CloudFront & Amazon S3"
    technology: "Edge Delivery, Static Hosting"
    description: "Provides global content delivery and static asset hosting."
  - type: "component"
    name: "AWS API Gateway"
    technology: "AWS"
    description: "Acts as the backend interface and API gateway."
relationships:
  - source: "Routing & Shell Component"
    destination: "Catalogue & Search View"
    description: "React props/context"
  - source: "Routing & Shell Component"
    destination: "Checkout & Cart Workflow Component"
    description: "React props/context"
  - source: "Routing & Shell Component"
    destination: "Recommendation & Review Widget"
    description: "React props/context"
  - source: "Catalogue & Search View"
    destination: "API Client Service"
    description: "Function invocation / REST wrapper"
  - source: "Checkout & Cart Workflow Component"
    destination: "API Client Service"
    description: "Function invocation / REST wrapper"
  - source: "Recommendation & Review Widget"
    destination: "API Client Service"
    description: "Function invocation / REST wrapper"
  - source: "API Client Service"
    destination: "AWS API Gateway"
    description: "[HTTPS/REST]"
  - source: "AWS CloudFront & Amazon S3"
    destination: "Routing & Shell Component"
    description: "[HTTPS]"