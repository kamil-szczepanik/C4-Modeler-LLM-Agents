level: container
scope: "Container diagram for E-Commerce Book Store"
system:
  name: "E-Commerce Book Store"
elements:
  - type: "person"
    name: "Customer"
    description: "End user browsing physical and electronic books, making purchases, and writing reviews."
  - type: "person"
    name: "Store Administrator"
    description: "Manager overseeing product catalogue, orders, and store operations."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe or PayPal for processing financial transactions."
  - type: "externalSystem"
    name: "Third-Party Shipping API"
    description: "FedEx or UPS for handling order fulfillment and shipping."
  - type: "externalSystem"
    name: "Notification Service"
    description: "AWS SES for sending emails and notifications."
  - type: "externalSystem"
    name: "Currency Exchange Rate API"
    description: "External service providing currency conversion rates."
  - type: "container"
    name: "React Single-Page Application (SPA)"
    technology: "React, AWS CloudFront, S3"
    description: "Global content delivery and user interface hosted at the edge for low latency."
  - type: "container"
    name: "AWS API Gateway"
    technology: "AWS API Gateway"
    description: "Routes incoming HTTPS/REST traffic from the SPA to core backend services."
  - type: "container"
    name: "Core E-Commerce Service"
    technology: "Node.js (TypeScript) or Python on Amazon ECS Fargate"
    description: "Handles primary bookstore operations, business logic, cart management, and order processing."
  - type: "container"
    name: "Recommendation Engine"
    technology: "Python on Amazon ECS Fargate"
    description: "Provides personalized book recommendations for customers."
  - type: "container"
    name: "Audit & Compliance Service"
    technology: "Node.js or Python on Amazon ECS Fargate"
    description: "Ensures GDPR compliance and logs audit trails."
  - type: "container"
    name: "Integration Service"
    technology: "Node.js or Python on Amazon ECS Fargate"
    description: "Communicates asynchronously via SQS/EventBridge with external third-party APIs."
  - type: "container"
    name: "Search & Analytics Service"
    technology: "Amazon OpenSearch Service"
    description: "Dedicated keyword search and review indexing."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Relational database for ACID-compliant transactional data storage."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "NoSQL database for cart storage and session data."
  - type: "container"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache (Redis)"
    description: "Distributed session caching and hot data performance."
  - type: "container"
    name: "Amazon EventBridge"
    technology: "Amazon EventBridge"
    description: "Decoupled asynchronous event router."
  - type: "container"
    name: "Amazon SQS/SNS"
    technology: "Amazon SQS / SNS"
    description: "Message queuing for decoupled asynchronous event-driven messaging."
  - type: "container"
    name: "AWS Lambda"
    technology: "AWS Lambda"
    description: "Serverless compute for lightweight event processing and edge functions."
relationships:
  - source: "Customer"
    destination: "React Single-Page Application (SPA)"
    description: "Browses catalogue, manages cart, places orders, and reads reviews"
    technology: "HTTPS"
  - source: "Store Administrator"
    destination: "React Single-Page Application (SPA)"
    description: "Manages store inventory, orders, and system administration"
    technology: "HTTPS"
  - source: "React Single-Page Application (SPA)"
    destination: "AWS API Gateway"
    description: "Interacts with backend services via API calls"
    technology: "HTTPS/REST"
  - source: "AWS API Gateway"
    destination: "Core E-Commerce Service"
    description: "Routes API requests"
    technology: "HTTPS/REST or gRPC"
  - source: "AWS API Gateway"
    destination: "Audit & Compliance Service"
    description: "Routes compliance and audit requests"
    technology: "HTTPS/REST or gRPC"
  - source: "AWS API Gateway"
    destination: "Search & Analytics Service"
    description: "Routes search and review queries"
    technology: "HTTPS/REST or gRPC"
  - source: "Core E-Commerce Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes transactional data"
    technology: "TLS"
  - source: "Core E-Commerce Service"
    destination: "Amazon DynamoDB"
    description: "Reads and writes session and cart data"
    technology: "TLS"
  - source: "Core E-Commerce Service"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches hot data and sessions"
    technology: "TLS"
  - source: "Core E-Commerce Service"
    destination: "Amazon EventBridge"
    description: "Publishes domain events"
    technology: "Asynchronous Messaging"
  - source: "Amazon EventBridge"
    destination: "Amazon SQS/SNS"
    description: "Forwards events to queues"
    technology: "AWS Messaging"
  - source: "Amazon SQS/SNS"
    destination: "Integration Service"
    description: "Triggers asynchronous integration tasks"
    technology: "SQS Messaging"
  - source: "Integration Service"
    destination: "Payment Gateway"
    description: "Processes secure payments"
    technology: "HTTPS/REST"
  - source: "Integration Service"
    destination: "Third-Party Shipping API"
    description: "Coordinates fulfillment and shipping"
    technology: "HTTPS/REST"
  - source: "Integration Service"
    destination: "Notification Service"
    description: "Triggers notifications and emails"
    technology: "AWS SES / HTTPS"
  - source: "Integration Service"
    destination: "Currency Exchange Rate API"
    description: "Fetches current currency exchange rates"
    technology: "HTTPS/REST"