# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Customers"
    description: "End-users browsing, purchasing, reviewing, and receiving book recommendations."
  - type: "person"
    name: "Store Administrators"
    description: "Manage the product catalog, moderate reviews, and oversee fulfillment."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe/PayPal integration for secure financial transactions."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "FedEx/UPS integrations for fulfillment and shipping."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Auth0/Cognito for authentication and OIDC."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "Avalara/TaxJar for tax computation."
  - type: "externalSystem"
    name: "Notification Service"
    description: "SES/Twilio for user alerts and notifications."
  - type: "container"
    name: "Single-Page Application (SPA)"
    technology: "React/TypeScript"
    description: "Client interface for browsing, purchasing, and managing accounts."
  - type: "container"
    name: "API Gateway"
    technology: "Amazon API Gateway"
    description: "Manages entry traffic and routes requests to backend services."
  - type: "container"
    name: "Catalog Service"
    technology: "Node.js (ECS Fargate)"
    description: "Manages the product catalog for physical and electronic books."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Java/Spring Boot (ECS Fargate)"
    description: "Handles orders, checkout processing, and cart management."
  - type: "container"
    name: "Recommendation Service"
    technology: "Python/FastAPI (ECS Fargate)"
    description: "Provides personalized book recommendations."
  - type: "container"
    name: "Auth Service"
    technology: "ECS Fargate"
    description: "Manages authentication and user security."
  - type: "container"
    name: "Privacy Service"
    technology: "ECS Fargate"
    description: "Ensures strict GDPR and CCPA compliance."
  - type: "container"
    name: "Background Worker"
    technology: "ECS Fargate"
    description: "Handles asynchronous background tasks."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Managed relational storage for transactional data."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "NoSQL storage for carts and sessions."
  - type: "container"
    name: "Amazon OpenSearch"
    technology: "Amazon OpenSearch"
    description: "Dedicated search engine for catalogue browsing."
  - type: "container"
    name: "Amazon S3 & CloudFront"
    technology: "Amazon S3, Amazon CloudFront"
    description: "Static asset delivery and digital book storage with low-latency CDN."
  - type: "container"
    name: "Messaging & Observability"
    technology: "Amazon SNS/SQS, Amazon CloudWatch, AWS X-Ray"
    description: "Asynchronous event messaging and system observability."
relationships:
  - source: "Customers"
    destination: "Single-Page Application (SPA)"
    description: "Interacts with the client interface"
    technology: "HTTPS"
  - source: "Store Administrators"
    destination: "Single-Page Application (SPA)"
    description: "Manages the platform via client interface"
    technology: "HTTPS"
  - source: "Single-Page Application (SPA)"
    destination: "API Gateway"
    description: "Sends client requests"
    technology: "HTTPS / JSON"
  - source: "API Gateway"
    destination: "Catalog Service"
    description: "Routes catalog requests"
    technology: "Internal gRPC / HTTP/2"
  - source: "API Gateway"
    destination: "Order & Checkout Service"
    description: "Routes order and checkout requests"
    technology: "Internal gRPC / HTTP/2"
  - source: "API Gateway"
    destination: "Recommendation Service"
    description: "Routes recommendation requests"
    technology: "Internal gRPC / HTTP/2"
  - source: "API Gateway"
    destination: "Auth Service"
    description: "Routes authentication requests"
    technology: "Internal gRPC / HTTP/2"
  - source: "API Gateway"
    destination: "Privacy Service"
    description: "Routes privacy compliance requests"
    technology: "Internal gRPC / HTTP/2"
  - source: "Catalog Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes relational data"
    technology: "JDBC / TCP"
  - source: "Order & Checkout Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes transactional data"
    technology: "JDBC / TCP"
  - source: "Order & Checkout Service"
    destination: "Amazon DynamoDB"
    description: "Manages carts and sessions"
    technology: "TCP"
  - source: "Catalog Service"
    destination: "Amazon OpenSearch"
    description: "Searches catalog data"
    technology: "TCP"
  - source: "Catalog Service"
    destination: "Amazon S3 & CloudFront"
    description: "Retrieves digital book assets"
    technology: "HTTPS"
  - source: "Order & Checkout Service"
    destination: "Messaging & Observability"
    description: "Publishes asynchronous events"
    technology: "Amazon SNS/SQS"
  - source: "Catalog Service"
    destination: "Messaging & Observability"
    description: "Publishes and consumes asynchronous events"
    technology: "Amazon SNS/SQS"
  - source: "Background Worker"
    destination: "Messaging & Observability"
    description: "Processes asynchronous messages"
    technology: "Amazon SNS/SQS"
  - source: "Online Bookstore System"
    destination: "Identity Provider"
    description: "Authenticating users via OIDC"
    technology: "HTTPS/OIDC"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Processing secure transactions"
    technology: "HTTPS/REST"
  - source: "Online Bookstore System"
    destination: "Tax Calculation Service"
    description: "Computing taxes for purchases"
    technology: "HTTPS/REST"
  - source: "Online Bookstore System"
    destination: "Shipping Provider APIs"
    description: "Handling fulfillment and shipping"
    technology: "HTTPS/REST"
  - source: "Online Bookstore System"
    destination: "Notification Service"
    description: "Sending alerts and notifications"
    technology: "HTTPS/REST"