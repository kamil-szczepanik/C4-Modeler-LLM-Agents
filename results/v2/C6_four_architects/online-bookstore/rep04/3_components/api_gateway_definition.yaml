level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "SSL Termination"
    technology: "AWS Certificate Manager"
    description: "Enforces TLS 1.3 at the edge for secure connections."
  - type: "component"
    name: "Rate Limiting"
    technology: "AWS WAF"
    description: "Enforces per-client usage quotas and rate limiting to protect against traffic spikes."
  - type: "component"
    name: "Authentication Interceptor"
    technology: "JWT / Lambda Authorizer"
    description: "Validates incoming client requests and handles authentication."
  - type: "component"
    name: "Request/Response Transformation"
    technology: "Amazon API Gateway"
    description: "Transforms payloads and handles request/response formatting."
  - type: "component"
    name: "Routing & Dispatcher"
    technology: "AWS Cloud Map / HTTP Integrations"
    description: "Routes requests to backend services via internal service discovery."
  - type: "component"
    name: "Request Logging & Audit Component"
    technology: "CloudWatch"
    description: "Exports audit and metric data."
relationships:
  - source: "SSL Termination"
    destination: "Rate Limiting"
    description: "Passes secure traffic"
  - source: "Rate Limiting"
    destination: "Authentication Interceptor"
    description: "Forwards filtered requests"
  - source: "Authentication Interceptor"
    destination: "Request/Response Transformation"
    description: "Passes authenticated requests"
  - source: "Request/Response Transformation"
    destination: "Routing & Dispatcher"
    description: "Dispatches transformed requests"
  - source: "Routing & Dispatcher"
    destination: "Request Logging & Audit Component"
    description: "Sends audit and metric data"