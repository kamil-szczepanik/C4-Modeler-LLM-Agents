level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Order API Controller"
    technology: "Java / Spring Boot"
    description: "Handles incoming HTTP requests for order placement and status tracking."
  - type: "component"
    name: "Checkout Orchestrator"
    technology: "Java / Spring Boot"
    description: "Orchestrates the multi-step checkout workflow across cart, pricing, payment, and fulfillment."
  - type: "component"
    name: "Cart Management"
    technology: "Java / Spring Boot"
    description: "Manages user shopping carts and session data."
  - type: "component"
    name: "Order Processing"
    technology: "Java / Spring Boot"
    description: "Processes core order business logic and prepares transactional records."
  - type: "component"
    name: "Pricing & Currency"
    technology: "Java / Spring Boot"
    description: "Calculates item totals, discounts, taxes, and currency conversions."
  - type: "component"
    name: "Payment Integration"
    technology: "Java / Spring Boot / Resilience4j"
    description: "Integrates with external payment gateways securely with circuit breakers."
  - type: "component"
    name: "Fulfillment Integration"
    technology: "Java / Spring Boot"
    description: "Integrates with external shipping provider APIs and tax services for order fulfillment."
relationships:
  - source: "Order API Controller"
    destination: "Checkout Orchestrator"
    description: "Delegates checkout requests"
  - source: "Checkout Orchestrator"
    destination: "Cart Management"
    description: "Retrieves and clears cart data"
  - source: "Checkout Orchestrator"
    destination: "Pricing & Currency"
    description: "Calculates final order pricing"
  - source: "Checkout Orchestrator"
    destination: "Order Processing"
    description: "Initiates order processing"
  - source: "Checkout Orchestrator"
    destination: "Payment Integration"
    description: "Executes payment transactions"
  - source: "Checkout Orchestrator"
    destination: "Fulfillment Integration"
    description: "Triggers shipping and tax calculations"