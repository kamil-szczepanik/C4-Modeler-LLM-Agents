level: component
scope: "Component diagram for the Background Worker container"
parentContainer:
  name: "Background Worker"
elements:
  - type: "component"
    name: "Task Router & Dispatcher"
    technology: "Node.js/TypeScript"
    description: "Routes incoming tasks from SQS and dispatches them to specialized workers."
  - type: "component"
    name: "Order Fulfillment Processor"
    technology: "Java/Spring Boot"
    description: "Processes order fulfillment and interacts with external shipping and payment services."
  - type: "component"
    name: "GDPR Data Purge Handler"
    technology: "Python/Boto3"
    description: "Handles data scrubbing and GDPR compliance tasks across databases."
  - type: "component"
    name: "Recommendation Sync Engine"
    technology: "Python/FastAPI"
    description: "Powers data science indexing and synchronization for recommendations."
  - type: "component"
    name: "Currency Rate Sync Worker"
    technology: "Node.js/TypeScript"
    description: "Synchronizes currency rates for multi-currency requirements."
  - type: "component"
    name: "Notification Dispatch Worker"
    technology: "Node.js/TypeScript"
    description: "Dispatches notifications to users asynchronously."
  - type: "component"
    name: "Worker Health & DLQ Manager"
    technology: "Java/Spring Boot"
    description: "Manages worker health and dead-letter queues for error management."
  - type: "component"
    name: "AWS X-Ray / CloudWatch Agent Sidecar"
    technology: "AWS Agent"
    description: "Collects logs, metrics, and tracing data for observability."
