level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL container"
parentContainer:
  name: "Amazon Aurora PostgreSQL"
elements:
  - type: "component"
    name: "AWS RDS Proxy"
    technology: "AWS RDS Proxy"
    description: "Connection pooling to prevent ECS Fargate connection exhaustion."
  - type: "component"
    name: "Primary DB Instance"
    technology: "Amazon Aurora PostgreSQL Primary Instance"
    description: "Managed relational storage for ACID transactions and scalability."
  - type: "component"
    name: "Replica DB Instances"
    technology: "Amazon Aurora PostgreSQL Replica Instances"
    description: "Read-replica instances for scaling read operations and multi-region availability."
  - type: "component"
    name: "Aurora Storage Volume"
    technology: "AWS Aurora Storage Fabric"
    description: "Persists data reliably across distributed multi-AZ storage volumes."
  - type: "component"
    name: "PostgreSQL Extension Manager"
    technology: "pgAudit and pgcrypto"
    description: "Provides database-level auditing and column-level encryption for GDPR/CCPA compliance."
relationships:
  - source: "AWS RDS Proxy"
    destination: "Primary DB Instance"
    description: "Manages connection pools and routes write transactions [PostgreSQL Protocol / TCP/5432]"
  - source: "AWS RDS Proxy"
    destination: "Replica DB Instances"
    description: "Manages connection pools and routes read queries [PostgreSQL Protocol / TCP/5432]"
  - source: "Primary DB Instance"
    destination: "Aurora Storage Volume"
    description: "Persists data [AWS Aurora Storage Fabric / TCP]"
  - source: "Primary DB Instance"
    destination: "PostgreSQL Extension Manager"
    description: "Applies auditing and encryption policies"