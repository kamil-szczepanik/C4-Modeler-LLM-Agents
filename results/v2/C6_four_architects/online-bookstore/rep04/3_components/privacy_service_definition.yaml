level: component
scope: "Component diagram for the Privacy Service container"
parentContainer:
  name: "Privacy Service"
elements:
  - type: "component"
    name: "Consent Controller & Middleware Component"
    technology: "Node.js / TypeScript"
    description: "Handles incoming privacy requests and manages user consent preferences."
  - type: "component"
    name: "DSAR Orchestrator Component"
    technology: "Node.js / TypeScript"
    description: "Coordinates asynchronous data export and erasure workflows."
  - type: "component"
    name: "Data Redaction Component"
    technology: "Node.js / TypeScript"
    description: "Purges and anonymizes PII from databases."
  - type: "component"
    name: "Compliance Reporting Component"
    technology: "Node.js / TypeScript"
    description: "Archives tamper-proof audit trails for regulatory compliance."
  - type: "component"
    name: "Amazon API Gateway"
    technology: "AWS API Gateway"
    description: "Routes incoming privacy requests to the consent controller."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "AWS DynamoDB"
    description: "Persists and queries user consent preferences."
  - type: "component"
    name: "Amazon SQS & SNS"
    technology: "AWS SQS / SNS"
    description: "Coordinates async data export and erasure workflows."
  - type: "component"
    name: "Amazon S3"
    technology: "AWS S3"
    description: "Stores user data export packages and archives tamper-proof audit trails."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "AWS Aurora PostgreSQL"
    description: "Relational database used for purging and anonymizing PII."
relationships:
  - source: "Amazon API Gateway"
    destination: "Consent Controller & Middleware Component"
    description: "Routes incoming privacy requests [gRPC / HTTP/2]"
  - source: "Consent Controller & Middleware Component"
    destination: "Amazon DynamoDB"
    description: "Persists and queries user consent preferences [AWS SDK / HTTPS]"
  - source: "DSAR Orchestrator Component"
    destination: "Amazon SQS & SNS"
    description: "Coordinates async data export and erasure workflows [AWS SDK / HTTPS]"
  - source: "DSAR Orchestrator Component"
    destination: "Amazon S3"
    description: "Stores user data export packages [AWS SDK / HTTPS]"
  - source: "Data Redaction Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "Purges and anonymizes PII [pg / TLS]"
  - source: "Compliance Reporting Component"
    destination: "Amazon S3"
    description: "Archives tamper-proof audit trails [AWS SDK / HTTPS]"