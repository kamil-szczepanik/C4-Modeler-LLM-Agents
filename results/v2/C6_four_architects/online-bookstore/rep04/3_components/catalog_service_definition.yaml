level: component
scope: "Component diagram for the Catalog Service container"
parentContainer:
  name: "Catalog Service"
elements:
  - type: "component"
    name: "Catalog API Controller"
    technology: "NestJS / Node.js"
    description: "Exposes HTTP/2 endpoints for browsing and searching."
  - type: "component"
    name: "Product Domain Service"
    technology: "NestJS / Node.js"
    description: "Encapsulates business logic, featuring a decorator-patterned Cache Interceptor."
  - type: "component"
    name: "Search & Indexing Repository"
    technology: "Amazon OpenSearch Client / Node.js"
    description: "Integrates with Amazon OpenSearch for catalog searches."
  - type: "component"
    name: "Relational Persistence Adapter"
    technology: "TypeORM / Node.js"
    description: "Uses TypeORM to communicate with Amazon Aurora PostgreSQL."
  - type: "component"
    name: "Catalog Cache Interceptor / Repository"
    technology: "Redis / Node.js"
    description: "Backed by an Amazon ElastiCache Redis cluster via TCP."
  - type: "component"
    name: "Event Publisher"
    technology: "AWS SDK for Node.js"
    description: "Emits domain events using the AWS SDK for Node.js."
  - type: "component"
    name: "Asset Management Adapter"
    technology: "AWS SDK for Node.js"
    description: "Manages digital book assets stored in Amazon S3."
relationships:
  - source: "Catalog API Controller"
    destination: "Product Domain Service"
    description: "Invokes business logic [TypeScript Interfaces]"
  - source: "Product Domain Service"
    destination: "Catalog Cache Interceptor / Repository"
    description: "Reads/writes cached data [Redis TCP]"
  - source: "Search & Indexing Repository"
    destination: "Amazon OpenSearch"
    description: "Queries catalog indices [HTTP/2 / HTTPS REST]"
  - source: "Relational Persistence Adapter"
    destination: "Amazon Aurora PostgreSQL"
    description: "Manages relational records [PostgreSQL TCP]"
  - source: "Asset Management Adapter"
    destination: "Amazon S3 & CloudFront"
    description: "Generates pre-signed asset URLs [HTTPS / AWS SDK]"
  - source: "Event Publisher"
    destination: "Messaging & Observability"
    description: "Publishes asynchronous domain events [AWS SDK / HTTPS]"