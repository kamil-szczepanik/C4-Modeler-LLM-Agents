level: component
scope: "Component diagram for the Auth Service container"
parentContainer:
  name: "Auth Service"
elements:
  - type: "component"
    name: "Authentication Controller"
    technology: "Fastify / Node.js / TypeScript"
    description: "Handling inbound HTTP/2 requests."
  - type: "component"
    name: "Token Manager"
    technology: "Node.js"
    description: "Manages JWTs and opaque sessions."
  - type: "component"
    name: "Identity Provider Integration Adapter"
    technology: "OAuth2/OIDC"
    description: "Federates logins via OAuth2/OIDC."
  - type: "component"
    name: "User Credential Repository"
    technology: "Argon2 / Amazon Aurora PostgreSQL"
    description: "Handles Argon2 password hashing and user profiles."
  - type: "component"
    name: "GDPR Consent Manager"
    technology: "Node.js"
    description: "Manages data access and deletion requests."
  - type: "component"
    name: "Security Audit Logger"
    technology: "Amazon SNS/SQS"
    description: "Captures authentication failures and security events."
  - type: "component"
    name: "Rate Limiting & Brute-Force Guard"
    technology: "Redis (ElastiCache)"
    description: "Mitigates credential stuffing via sliding-window tracking."
  - type: "component"
    name: "API Gateway"
    technology: "gRPC / HTTP/2"
    description: "Routes authentication requests."
  - type: "component"
    name: "Redis (ElastiCache)"
    technology: "Redis Protocol"
    description: "Caches sessions and revocation lists."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "TLS / JDBC"
    description: "Reads/writes credentials."
  - type: "component"
    name: "Privacy Service"
    technology: "gRPC"
    description: "Requests user data export/deletion."
  - type: "component"
    name: "Amazon SNS/SQS"
    technology: "AWS SDK / HTTPS"
    description: "Publishes audit events."
relationships:
  - source: "API Gateway"
    destination: "Authentication Controller"
    description: "Routes authentication requests [gRPC / HTTP/2]"
  - source: "Token Manager"
    destination: "Redis (ElastiCache)"
    description: "Caches sessions and revocation lists [Redis Protocol]"
  - source: "User Credential Repository"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads/writes credentials [TLS / JDBC]"
  - source: "Privacy Service"
    destination: "GDPR Consent Manager"
    description: "Requests user data export/deletion [gRPC]"
  - source: "Security Audit Logger"
    destination: "Amazon SNS/SQS"
    description: "Publishes audit events [AWS SDK / HTTPS]"