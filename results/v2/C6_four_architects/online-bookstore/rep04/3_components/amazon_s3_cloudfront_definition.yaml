level: component
scope: "Component diagram for the Amazon S3 & CloudFront container"
parentContainer:
  name: "Amazon S3 & CloudFront"
elements:
  - type: "component"
    name: "Static Web Hosting Bucket"
    technology: "Amazon S3 (Standard)"
    description: "Stores built React SPA artifacts and logs with lifecycle policies."
  - type: "component"
    name: "Digital Assets Bucket"
    technology: "Amazon S3 (Standard-IA/Glacier)"
    description: "Securely stores encrypted e-book files and high-resolution media."
  - type: "component"
    name: "CDN Distribution"
    technology: "Amazon CloudFront with Lambda@Edge"
    description: "Edge-caches static assets and protects digital books using signed URLs, validating them via Lambda@Edge."
  - type: "component"
    name: "Access Logging Bucket"
    technology: "Amazon S3 (Standard)"
    description: "Stores access logs streamed via S3 API."
  - type: "component"
    name: "Media Processing Trigger"
    technology: "Python / AWS Lambda"
    description: "Automatically optimizes and generates thumbnails for user-uploaded review images upon new image upload."
relationships:
  - source: "React SPA Container"
    destination: "CDN Distribution"
    description: "Loads static JS/CSS/HTML via HTTPS"
  - source: "Catalog & Order Services"
    destination: "CDN Distribution"
    description: "Requests signed URLs for e-book downloads via HTTPS"
  - source: "CDN Distribution"
    destination: "Digital Assets Bucket"
    description: "Fetches private media via Origin Access Control (OAC) and HTTPS"
  - source: "CDN Distribution"
    destination: "Access Logging Bucket"
    description: "Streams access logs via S3 API and HTTPS"
  - source: "Privacy Service"
    destination: "Digital Assets Bucket"
    description: "Manages data deletion and anonymization via AWS SDK (HTTPS)"
  - source: "Digital Assets Bucket"
    destination: "Media Processing Trigger"
    description: "Invokes processing upon new image upload via S3 Event Notifications (JSON/HTTPS)"