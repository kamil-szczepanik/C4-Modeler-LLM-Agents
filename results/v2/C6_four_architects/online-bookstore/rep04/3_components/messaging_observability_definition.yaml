level: component
scope: "Component diagram for the Messaging & Observability container"
parentContainer:
  name: "Messaging & Observability"
elements:
  - type: "component"
    name: "Amazon SNS"
    technology: "AWS SNS"
    description: "Publishes asynchronous events from microservices."
  - type: "component"
    name: "Amazon SQS"
    technology: "AWS SQS"
    description: "Queues asynchronous messages for downstream services."
  - type: "component"
    name: "Amazon CloudWatch"
    technology: "AWS CloudWatch"
    description: "Collects and stores logs and metrics from services."
  - type: "component"
    name: "AWS X-Ray"
    technology: "AWS X-Ray"
    description: "Traces requests across distributed microservices."
  - type: "component"
    name: "EventBridge Schema Registry"
    technology: "Amazon EventBridge"
    description: "Provides contract validation for event-driven messaging."
relationships:
  - source: "Amazon SNS"
    destination: "Amazon SQS"
    description: "Delivers messages to queues"
  - source: "Microservices"
    destination: "Amazon SNS"
    description: "Publish/Subscribe events"
  - source: "Services"
    destination: "Amazon CloudWatch"
    description: "Emits logs and metrics"
  - source: "Services"
    destination: "AWS X-Ray"
    description: "Emits traces"