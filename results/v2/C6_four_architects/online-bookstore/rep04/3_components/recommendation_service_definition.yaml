level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "Recommendation API Controller"
    technology: "Python / FastAPI"
    description: "High-performance asynchronous API framework for handling inbound requests."
  - type: "component"
    name: "Scoring Engine"
    technology: "Python / NumPy / Pandas"
    description: "Optimized libraries for in-memory collaborative filtering and scoring logic."
  - type: "component"
    name: "Model Ingestion Worker"
    technology: "Python / Celery"
    description: "Asynchronously processes model ingestion events."
  - type: "component"
    name: "Recommendation Cache Client"
    technology: "Redis-py"
    description: "Client for interacting with Amazon ElastiCache (Redis)."
  - type: "component"
    name: "Feature Store / Vector DB Client"
    technology: "Python"
    description: "Client for querying feature stores and vector databases like Amazon OpenSearch."
  - type: "component"
    name: "Telemetry Interceptor Middleware"
    technology: "Python"
    description: "Emits traces to AWS X-Ray and metrics to Amazon CloudWatch."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache (Redis)"
    description: "In-memory data store for sub-second recommendation retrieval to meet performance SLAs."
  - type: "component"
    name: "Amazon OpenSearch"
    technology: "Amazon OpenSearch"
    description: "Vector database and feature store for semantic similarity book recommendations."
  - type: "component"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Message queue for asynchronously decoupling order events from the model ingestion pipeline."
relationships:
  - source: "Recommendation API Controller"
    destination: "Scoring Engine"
    description: "In-memory function call"
  - source: "Scoring Engine"
    destination: "Recommendation Cache Client"
    description: "Redis TCP / RESP"
  - source: "Scoring Engine"
    destination: "Feature Store / Vector DB Client"
    description: "REST/HTTPS"
  - source: "Model Ingestion Worker"
    destination: "Amazon SQS"
    description: "AWS SDK / HTTPS"
  - source: "Model Ingestion Worker"
    destination: "Recommendation Cache Client"
    description: "Redis TCP / RESP"
  - source: "Telemetry Interceptor Middleware"
    destination: "Amazon ElastiCache (Redis)"
    description: "AWS SDK / HTTPS"