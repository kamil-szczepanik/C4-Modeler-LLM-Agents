level: component
scope: "Component diagram for the Amazon OpenSearch container"
parentContainer:
  name: "Amazon OpenSearch"
elements:
  - type: "component"
    name: "REST API Handler"
    technology: "Java / HTTP Server"
    description: "Handles incoming REST requests and API calls from services like the Catalog Service."
  - type: "component"
    name: "Distributed Search Engine"
    technology: "Apache Lucene Core"
    description: "Executes full-text search queries and document retrievals across the cluster."
  - type: "component"
    name: "Index Manager"
    technology: "OpenSearch Core"
    description: "Manages indices, mappings, and index lifecycle operations."
  - type: "component"
    name: "Cluster Coordinator"
    technology: "OpenSearch Cluster Manager"
    description: "Manages cluster state, node discovery, and topology coordination."
  - type: "component"
    name: "Data Replication Manager"
    technology: "OpenSearch Replication Engine"
    description: "Ensures high availability and data consistency through primary-replica replication."
  - type: "component"
    name: "Security & Access Control Module"
    technology: "AWS IAM / OpenSearch Security Plugin"
    description: "Enforces authentication, authorization, and AWS SigV4 request verification."
  - type: "component"
    name: "Snapshot Manager"
    technology: "OpenSearch Snapshot API"
    description: "Handles backing up cluster indices and persistent state to external storage."
relationships:
  - source: "Snapshot Manager"
    destination: "Amazon S3"
    description: "Persists index backups via HTTPS (S3 API)"