level: component
scope: "Component diagram for the Single-Page Application (SPA) container"
parentContainer:
  name: "Single-Page Application (SPA)"
elements:
  - type: "component"
    name: "Router Component"
    technology: "React Router"
    description: "React Router for client-side navigation and code-splitting."
  - type: "component"
    name: "Feature Modules"
    technology: "React & TypeScript"
    description: "Lazy-loaded views for catalogue, search, checkout, cart, reviews, and recommendations."
  - type: "component"
    name: "State Management Store"
    technology: "Redux Toolkit"
    description: "Redux Toolkit for global application state."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios"
    description: "Axios wrapper incorporating a Security & Token Interceptor for in-memory JWT handling."
  - type: "component"
    name: "Privacy & Consent Manager"
    technology: "React / Local Storage"
    description: "Local management of cookie banners and GDPR/CCPA compliance states."
  - type: "component"
    name: "Localization & Currency Provider"
    technology: "React Context"
    description: "Manages locale dictionaries and multi-currency formatting (USD, EUR, GBP)."
  - type: "component"
    name: "Amazon S3 & CloudFront"
    technology: "Amazon S3 / Amazon CloudFront"
    description: "External hosting for static asset delivery and global edge caching."
  - type: "component"
    name: "API Gateway"
    technology: "API Gateway"
    description: "Receives authenticated requests from the API Client Layer."
  - type: "component"
    name: "GitHub Actions (CI/CD)"
    technology: "GitHub Actions"
    description: "Deploys optimized React build bundles to Amazon S3 & CloudFront."
relationships:
  - source: "Router Component"
    destination: "Feature Modules"
    description: "Dynamically imports and lazy-loads views on demand [ES Modules]"
  - source: "Feature Modules"
    destination: "State Management Store"
    description: "Reads and writes global state [Redux Dispatch]"
  - source: "Feature Modules"
    destination: "API Client Layer"
    description: "Invokes remote operations [HTTPS / REST / JSON]"
  - source: "Privacy & Consent Manager"
    destination: "API Client Layer"
    description: "Sends compliance triggers to the Privacy Service [HTTPS / JSON]"
  - source: "API Client Layer"
    destination: "API Gateway"
    description: "Sends authenticated requests [HTTPS / JSON]"
  - source: "GitHub Actions (CI/CD)"
    destination: "Amazon S3 & CloudFront"
    description: "Deploys optimized React build bundles [HTTPS]"