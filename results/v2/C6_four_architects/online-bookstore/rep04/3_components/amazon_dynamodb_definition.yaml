level: component
scope: "Component diagram for the Amazon DynamoDB container"
parentContainer:
  name: "Amazon DynamoDB"
elements:
  - type: "component"
    name: "Request Router"
    technology: "AWS DynamoDB Internal Routing"
    description: "Routes incoming requests to the appropriate storage nodes or DAX cluster."
  - type: "component"
    name: "DAX Cluster"
    technology: "Amazon DynamoDB Accelerator"
    description: "In-memory cache for high-throughput carts and session state reads."
  - type: "component"
    name: "Storage Node Engine"
    technology: "DynamoDB Distributed Storage"
    description: "Manages underlying partitioned data storage for tables."
  - type: "component"
    name: "Index Manager"
    technology: "DynamoDB Secondary Indexes"
    description: "Manages local and global secondary indexes for fast querying."
  - type: "component"
    name: "TTL Background Cleaner"
    technology: "DynamoDB Time-to-Live Engine"
    description: "Automatically removes expired items to enforce GDPR and CCPA compliance."
  - type: "component"
    name: "Streams Publisher"
    technology: "DynamoDB Streams"
    description: "Captures change data capture (CDC) events for asynchronous event relay."
relationships:
  - source: "Request Router"
    destination: "DAX Cluster"
    description: "Routes cache-eligible requests via TCP"
  - source: "Request Router"
    destination: "Storage Node Engine"
    description: "Forwards storage read/write operations"
  - source: "Storage Node Engine"
    destination: "Index Manager"
    description: "Updates index data"
  - source: "Storage Node Engine"
    destination: "TTL Background Cleaner"
    description: "Triggers data expiration removal"
  - source: "Storage Node Engine"
    destination: "Streams Publisher"
    description: "Publishes CDC events"