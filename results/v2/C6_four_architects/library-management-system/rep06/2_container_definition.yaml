level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Patron"
    description: "Library user who interacts with the self-service portal to browse, borrow, and manage accounts."
  - type: "person"
    name: "Librarian"
    description: "Library staff member managing circulation, inventory, and patron assistance."
  - type: "person"
    name: "Library Administrator"
    description: "System administrator managing system configurations, users, and overall library policies."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "External system used to process fines and payments securely."
  - type: "externalSystem"
    name: "Legacy ILS"
    description: "Legacy Integrated Library System used for synchronizing records."
  - type: "container"
    name: "Web Application"
    technology: "React, TypeScript, CDN"
    description: "React/TypeScript SPA hosted on a CDN providing the digital platform for public and academic libraries."
  - type: "container"
    name: "API Gateway"
    technology: "Spring Cloud Gateway, NGINX"
    description: "Entry point for routing client traffic and securing system access."
  - type: "container"
    name: "Core Domain Service"
    technology: "Java, Spring Boot"
    description: "Service containing Catalog Management, Circulation Engine, User Management, and Data Access components."
  - type: "container"
    name: "Search Service"
    technology: "Python, FastAPI"
    description: "Service providing high-performance search capabilities and search index queries."
  - type: "container"
    name: "Integration Service"
    technology: "Node.js, Express"
    description: "Service handling integrations with external payment gateways and legacy ILS."
  - type: "container"
    name: "PostgreSQL"
    technology: "PostgreSQL"
    description: "Primary relational database hosted in the EU."
  - type: "container"
    name: "Elasticsearch"
    technology: "Elasticsearch"
    description: "Search index hosted in the EU for high-performance search."
  - type: "container"
    name: "Redis"
    technology: "Redis"
    description: "In-memory data store and cache hosted in the EU."
  - type: "container"
    name: "RabbitMQ"
    technology: "RabbitMQ"
    description: "Message broker for asynchronous events hosted in the EU."
relationships:
  - source: "Patron"
    destination: "Web Application"
    description: "Interacts with self-service portal"
    technology: "HTTPS"
  - source: "Librarian"
    destination: "Web Application"
    description: "Manages circulation and inventory via portal"
    technology: "HTTPS"
  - source: "Library Administrator"
    destination: "Web Application"
    description: "Manages system configurations"
    technology: "HTTPS"
  - source: "Web Application"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS / JSON"
  - source: "API Gateway"
    destination: "Core Domain Service"
    description: "Routes domain and circulation requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Search Service"
    description: "Routes search requests"
    technology: "gRPC over mTLS"
  - source: "Core Domain Service"
    destination: "PostgreSQL"
    description: "Persists relational data"
    technology: "JDBC over TLS 1.3"
  - source: "Core Domain Service"
    destination: "Redis"
    description: "Caches session and metadata"
    technology: "RESP over TLS 1.3"
  - source: "Core Domain Service"
    destination: "RabbitMQ"
    description: "Publishes asynchronous events"
    technology: "AMQP"
  - source: "Integration Service"
    destination: "External Payment Gateways"
    description: "Processes payments"
    technology: "HTTPS / AMQP"
  - source: "Integration Service"
    destination: "Legacy ILS"
    description: "Synchronizes legacy data"
    technology: "HTTPS / AMQP"