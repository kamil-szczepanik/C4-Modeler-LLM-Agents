level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "SSL/TLS Termination & Reverse Proxy"
    technology: "NGINX"
    description: "Edge termination, reverse proxy, and initial request buffering."
  - type: "component"
    name: "Routing Filter Component"
    technology: "Spring Cloud Gateway"
    description: "Dynamic routing and filter-based extensibility."
  - type: "component"
    name: "Authentication & Authorization Component"
    technology: "Spring Security / OAuth2"
    description: "Token validation for users."
  - type: "component"
    name: "Rate Limiting & Throttling Component"
    technology: "Redis-backed"
    description: "Distributed rate-limiting and throttling."
  - type: "component"
    name: "Telemetry & Request Tracing Component"
    technology: "Micrometer / OpenTelemetry"
    description: "Telemetry and distributed tracing."
  - type: "component"
    name: "Circuit Breaker & Fallback Component"
    technology: "Resilience4j"
    description: "Circuit breaking and fallback protection."
  - type: "component"
    name: "Request Validation Component"
    technology: "Spring Validation"
    description: "Validates incoming requests."
  - type: "component"
    name: "Caching Component"
    technology: "Spring Cache"
    description: "Response caching supporting low latency."
relationships:
  - source: "SSL/TLS Termination & Reverse Proxy"
    destination: "Routing Filter Component"
    description: "Forwards decrypted traffic [HTTP/2]"
  - source: "Circuit Breaker & Fallback Component"
    destination: "Integration Service"
    description: "Forwards third-party and legacy requests [gRPC over mTLS]"
  - source: "Caching Component"
    destination: "Redis"
    description: "Reads/writes cache entries [RESP / TCP]"