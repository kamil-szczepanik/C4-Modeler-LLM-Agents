level: component
scope: "Component diagram for the Web Application container"
parentContainer:
  name: "Web Application"
elements:
  - type: "component"
    name: "Router Component"
    technology: "react-router-dom"
    description: "Handles client-side routing within the SPA."
  - type: "component"
    name: "Auth & State Store Component"
    technology: "Zustand, OAuth2/OIDC Client"
    description: "Manages application state and secure sessions."
  - type: "component"
    name: "UI Component Library"
    technology: "Tailwind CSS, Radix UI"
    description: "Delivers accessible, responsive design elements."
  - type: "component"
    name: "API Client Component"
    technology: "Axios"
    description: "Handles HTTP communication with the API Gateway."
  - type: "component"
    name: "Search & Catalog View Component"
    technology: "React, TypeScript"
    description: "Optimized for performance and executes paginated queries."
  - type: "component"
    name: "Localization Component"
    technology: "react-i18next"
    description: "Provides multi-language support."
  - type: "component"
    name: "Error Boundary Component"
    technology: "React Error Boundary"
    description: "Handles faults and error catching in the UI."
relationships:
  - source: "Router Component"
    destination: "API Client Component"
    description: "Fetches and renders data"
  - source: "UI Component Library"
    destination: "API Client Component"
    description: "Fetches and renders data"
  - source: "Search & Catalog View Component"
    destination: "API Client Component"
    description: "Executes paginated queries"