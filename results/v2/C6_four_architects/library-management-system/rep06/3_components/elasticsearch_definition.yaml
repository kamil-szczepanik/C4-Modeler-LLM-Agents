level: component
scope: "Component diagram for the Elasticsearch container"
parentContainer:
  name: "Elasticsearch"
elements:
  - type: "component"
    name: "Search REST API Endpoint"
    technology: "HTTP/REST"
    description: "Exposes HTTP/REST endpoints for executing search queries."
  - type: "component"
    name: "Query Parsing & Analysis Engine"
    technology: "In-Process"
    description: "Parses and analyzes incoming search queries."
  - type: "component"
    name: "Distributed Index & Shard Manager"
    technology: "In-Process"
    description: "Manages distributed indices and shard allocation."
  - type: "component"
    name: "Caches & Segment Buffer"
    technology: "In-Memory"
    description: "Caches search results and buffers index segments for performance."
  - type: "component"
    name: "Cluster Coordination & Replication Manager"
    technology: "TCP"
    description: "Coordinates cluster state and manages data replication."
  - type: "component"
    name: "Node Transport Layer"
    technology: "Elasticsearch Transport Protocol"
    description: "Handles transport-layer communication between nodes."
  - type: "component"
    name: "Lucene Storage Engine"
    technology: "Low-level indexing / Apache Lucene"
    description: "Provides low-level indexing and storage operations."
relationships:
  - source: "Search Service"
    destination: "Search REST API Endpoint"
    description: "HTTP/JSON"
  - source: "Search REST API Endpoint"
    destination: "Query Parsing & Analysis Engine"
    description: "In-Process"
  - source: "Query Parsing & Analysis Engine"
    destination: "Caches & Segment Buffer"
    description: "In-Process"
  - source: "Query Parsing & Analysis Engine"
    destination: "Distributed Index & Shard Manager"
    description: "In-Process"
  - source: "Distributed Index & Shard Manager"
    destination: "Node Transport Layer"
    description: "TCP"
  - source: "Distributed Index & Shard Manager"
    destination: "Cluster Coordination & Replication Manager"
    description: "TCP"
  - source: "Cluster Coordination & Replication Manager"
    destination: "Distributed Index & Shard Manager"
    description: "TCP"
  - source: "Caches & Segment Buffer"
    destination: "Lucene Storage Engine"
    description: "In-Process/JNI"
  - source: "Distributed Index & Shard Manager"
    destination: "Lucene Storage Engine"
    description: "In-Process/JNI"
  - source: "Lucene Storage Engine"
    destination: "Search REST API Endpoint"
    description: "In-Process"