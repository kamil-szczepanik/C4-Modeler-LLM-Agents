level: component
scope: "Component diagram for the Integration Service container"
parentContainer:
  name: "Integration Service"
elements:
  - type: "component"
    name: "Integration Router / Controller"
    technology: "Express component"
    description: "Handles internal REST endpoints for the Core Domain Service."
  - type: "component"
    name: "Payment Gateway Adapter"
    technology: "TypeScript component"
    description: "Communicates with the external payment gateway."
  - type: "component"
    name: "ILS Sync Worker"
    technology: "TypeScript component"
    description: "Handles legacy ILS data synchronization."
  - type: "component"
    name: "Webhook Handler"
