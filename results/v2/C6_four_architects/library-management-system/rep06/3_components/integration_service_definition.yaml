    description: "Handles payment asynchronous callbacks."
  - type: "component"
    name: "Data Mapper & Transformer"
    technology: "TypeScript utility component"
    description: "Performs schema translations."
  - type: "component"
    name: "Circuit Breaker & Retry Manager"
    technology: "TypeScript component"
    description: "Provides downstream resilience."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "TypeScript component"
    description: "Provides GDPR-compliant tracking."
  - type: "component"
    name: "Core Domain Service"
    technology: "Internal upstream container"
    description: "Upstream container interacting with the integration service."
  - type: "component"
    name: "RabbitMQ"
    technology: "Message broker container"
    description: "Asynchronous event messaging for ILS synchronization."
  - type: "component"
    name: "External Payment Gateway"
    technology: "External system"
    description: "External system for payment communication."
  - type: "component"
    name: "Legacy ILS"
    technology: "External system"
    description: "External legacy integrated library system."
  - type: "component"
    name: "PostgreSQL"
