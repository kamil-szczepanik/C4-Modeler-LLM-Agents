level: component
scope: "Component diagram for the Search Service container"
parentContainer:
  name: "Search Service"
elements:
  - type: "component"
    name: "SearchController"
    technology: "FastAPI router"
    description: "FastAPI router handling incoming requests and input validation."
  - type: "component"
    name: "QueryBuilder"
    technology: "Python module"
    description: "Python module translating filters into Elasticsearch Query DSL."
  - type: "component"
    name: "SearchRepository"
    technology: "elasticsearch-py"
    description: "Elasticsearch client executing index queries."
  - type: "component"
    name: "IndexSyncConsumer"
    technology: "RabbitMQ consumer"
    description: "RabbitMQ consumer processing asynchronous domain events."
  - type: "component"
    name: "SearchCacheManager"
    technology: "redis-py"
    description: "Redis client managing search result caching."
  - type: "component"
    name: "CircuitBreaker"
    technology: "tenacity"
    description: "Resilience module handling failovers to fallback cache."
relationships:
  - source: "API Gateway"
    destination: "SearchController"
    description: "Routes search requests [gRPC over mTLS]"
  - source: "SearchController"
    destination: "SearchCacheManager"
    description: "Checks/sets search cache [In-memory / TCP]"
  - source: "SearchCacheManager"
    destination: "Redis"
    description: "Reads/writes cached results [RESP over TCP]"
  - source: "QueryBuilder"
    destination: "SearchRepository"
    description: "Translates search filters [Python Function]"
  - source: "SearchRepository"
    destination: "Elasticsearch"
    description: "Executes queries [HTTP/REST over TCP]"
  - source: "RabbitMQ"
    destination: "IndexSyncConsumer"
    description: "Pushes catalog change events [AMQP]"