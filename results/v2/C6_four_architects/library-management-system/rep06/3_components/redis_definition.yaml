level: component
scope: "Component diagram for the Redis container"
parentContainer:
  name: "Redis"
elements:
  - type: "component"
    name: "Session Store Component"
    technology: "Redis In-Memory Data Store"
    description: "Manages active Patron and Librarian authentication states."
  - type: "component"
    name: "Catalog Cache Component"
    technology: "Redis In-Memory Data Store"
    description: "Caches frequent catalogue metadata to offload PostgreSQL."
  - type: "component"
    name: "Rate Limiter Component"
    technology: "Lua Scripting / Redis"
    description: "Protects API Gateway from abuse on self-service endpoints using Lua scripting for atomicity."
  - type: "component"
    name: "Persistence & Replication Engine"
    technology: "RDB/AOF Snapshotting"
    description: "Handles asynchronous RDB/AOF snapshotting to EU-bound local storage."
  - type: "component"
    name: "Pub/Sub Messaging Component"
    technology: "Redis Pub/Sub"
    description: "Manages event broadcasting for cache invalidation."
  - type: "component"
    name: "Cluster & Sentinel Management Component"
    technology: "Redis Cluster & Sentinel"
    description: "Handles node health checks and automatic failover."
  - type: "component"
    name: "Security & TLS Termination Component"
    technology: "TLS 1.3 / RESP"
    description: "Manages inbound cryptographic handshakes using TLS 1.3."
  - type: "component"
    name: "EU Memory-Bound Storage Engine"
    technology: "Redis Memory Management"
    description: "Enforces hardware/runtime constraints for EU-only data residency."
relationships:
  - source: "Core Domain Service"
    destination: "Security & TLS Termination Component"
    description: "Sends session and metadata requests [RESP over TLS 1.3]"
  - source: "API Gateway"
    destination: "Security & TLS Termination Component"
    description: "Sends rate-limit checks [RESP over TLS 1.3]"
  - source: "Security & TLS Termination Component"
    destination: "Session Store Component"
    description: "Routes decrypted commands [In-Memory IPC]"
  - source: "Security & TLS Termination Component"
    destination: "Catalog Cache Component"
    description: "Routes decrypted commands [In-Memory IPC]"
  - source: "Security & TLS Termination Component"
    destination: "Rate Limiter Component"
    description: "Routes decrypted commands [In-Memory IPC]"
  - source: "Session Store Component"
    destination: "Persistence & Replication Engine"
    description: "Asynchronously persists snapshots [Local I/O]"
  - source: "Catalog Cache Component"
    destination: "Persistence & Replication Engine"
    description: "Asynchronously persists snapshots [Local I/O]"
  - source: "Core Domain Service"
    destination: "Pub/Sub Messaging Component"
    description: "Publishes cache eviction events [RESP over TLS 1.3]"
  - source: "Pub/Sub Messaging Component"
    destination: "Catalog Cache Component"
    description: "Triggers targeted key invalidations [In-Memory Call]"