level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "Relation Engine"
    technology: "PostgreSQL 15"
    description: "Handles ACID transactions, B-Tree indexes, and foreign keys."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Manages client sessions from the Core Domain Service."
  - type: "component"
    name: "Read-Only Routing Proxy"
    technology: "HAProxy"
    description: "Routes read-heavy queries to streaming replicas."
  - type: "component"
    name: "Replication Manager"
    technology: "Patroni"
    description: "Manages EU-region synchronous replication."
  - type: "component"
    name: "Backup & Archival Agent"
    technology: "pgBackRest"
    description: "Handles point-in-time recovery and EU-bound storage."
  - type: "component"
    name: "Security & Audit Subsystem"
    technology: "pgAudit"
    description: "Logs DDL/DML operations for compliance."
  - type: "component"
    name: "Query Optimizer & Statistics Engine"
    technology: "PostgreSQL Engine"
    description: "Evaluates execution plans with GIN/B-Tree indexes."
  - type: "component"
    name: "Extension Schema"
    technology: "pg_stat_statements"
    description: "Tracks execution metrics for performance tuning."
relationships:
  - source: "Core Domain Service"
    destination: "Connection Pooler"
    description: "Manages database sessions [TCP / TLS 1.3]"
  - source: "Core Domain Service"
    destination: "Read-Only Routing Proxy"
    description: "Submits read-only queries [TCP / TLS 1.3]"
  - source: "Connection Pooler"
    destination: "Relation Engine"
    description: "Forwards write queries [TCP]"
  - source: "Relation Engine"
    destination: "Replication Manager"
    description: "Streams WAL data [TCP / TLS 1.3]"
  - source: "Backup & Archival Agent"
    destination: "Relation Engine"
    description: "Reads WAL archives [Local Disk / S3 EU-Central bucket]"