level: component
scope: "Component diagram for the RabbitMQ container"
parentContainer:
  name: "RabbitMQ"
elements:
  - type: "component"
    name: "Exchange Router"
    technology: "AMQP 0-9-1"
    description: "Direct & Topic Exchanges routing messages."
  - type: "component"
    name: "Message Queues"
    technology: "RabbitMQ Quorum Queues"
    description: "Durable and Quorum Queues holding persistent messages on EU volumes."
  - type: "component"
    name: "Authentication & Authorization Engine"
    technology: "Erlang SSL and TLS"
    description: "Client certificate validation module."
  - type: "component"
    name: "Dead Letter Exchange & Retry Router"
    technology: "RabbitMQ"
    description: "Handles failed or unacknowledged messages."
  - type: "component"
    name: "Cluster Coordination Manager"
    technology: "Erlang Distributed Node Manager"
    description: "Handling Quorum Queue replication."
  - type: "component"
    name: "Management Plugin"
    technology: "HTTP/REST"
    description: "Exposes metrics and health checks."
relationships:
  - source: "Core Domain Service"
    destination: "Exchange Router"
    description: "Publishes domain events via [AMQP, JSON, TLS]"
  - source: "Integration Service"
    destination: "Exchange Router"
    description: "Publishes legacy sync events via [AMQP, JSON]"
  - source: "Exchange Router"
    destination: "Message Queues"
    description: "Routes messages via [AMQP]"
  - source: "Message Queues"
    destination: "Notification Service"
    description: "Dispatches async alerts via [AMQP]"
  - source: "Message Queues"
    destination: "Integration Service"
    description: "Syncs legacy ILS data via [AMQP]"
  - source: "Message Queues"
    destination: "Dead Letter Exchange"
    description: "Forwards poisoned or expired messages via [AMQP]"
  - source: "Node Manager"
    destination: "Peer RabbitMQ Nodes"
    description: "Replicates quorum states via [Erlang Distributed, TCP 25672]"
  - source: "Prometheus / Monitoring"
    destination: "Management Plugin"
    description: "Scrapes broker metrics via [HTTP]"