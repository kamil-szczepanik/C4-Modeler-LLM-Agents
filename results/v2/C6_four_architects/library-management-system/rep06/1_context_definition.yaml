level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A comprehensive digital solution for public and academic libraries to catalogue items, manage circulation, and provide self-service portals with strict EU-only data residency and sub-800ms search performance."
elements:
  - type: "person"
    name: "Patron"
    description: "Library user who interacts with the self-service portal to browse, borrow, and manage accounts."
  - type: "person"
    name: "Librarian"
    description: "Library staff member managing circulation, inventory, and patron assistance."
  - type: "person"
    name: "Library Administrator"
    description: "System administrator managing system configurations, users, and overall library policies."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "External system used to process fines and payments securely."
  - type: "externalSystem"
    name: "Digital Content Providers"
    description: "External providers used to fetch digital assets and media."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External service used to dispatch alerts and notifications via EU endpoints."
  - type: "externalSystem"
    name: "Integrated Library System (ILS) / Legacy Data Source"
    description: "Legacy data source used for synchronizing bibliographic records via Z39.50 or HTTPS."
  - type: "container"
    name: "Web App / Self-Service Portal"
    description: "React / Next.js frontend hosted on an EU Content Delivery Network (CDN)."
    technology: "React, Next.js, EU CDN"
  - type: "container"
    name: "API Gateway"
    description: "Kong or Nginx handling single entry-point routing and UI/API traffic."
    technology: "Kong or Nginx, HTTPS"
  - type: "container"
    name: "Core Backend Services"
    description: "Java 17 / Spring Boot backend handling business logic using gRPC for internal communication."
    technology: "Java 17, Spring Boot, gRPC"
  - type: "container"
    name: "Search Engine"
    description: "OpenSearch or Elasticsearch for sub-800ms catalog queries."
    technology: "OpenSearch or Elasticsearch"
  - type: "container"
    name: "Async Worker"
    description: "Apache Kafka or Redis streams for decoupled event-driven indexing."
    technology: "Apache Kafka or Redis streams"
  - type: "container"
    name: "Operational Database & Cache"
    description: "PostgreSQL (OLTP) and Redis (Cache) deployed in EU-Central."
    technology: "PostgreSQL, Redis, EU-Central"
relationships:
  - source: "Patron"
    destination: "API Gateway"
    description: "Routes UI and API traffic"
    technology: "HTTPS"
  - source: "Librarian"
    destination: "API Gateway"
    description: "Routes UI and API traffic"
    technology: "HTTPS"
  - source: "Library Administrator"
    destination: "API Gateway"
    description: "Routes UI and API traffic"
    technology: "HTTPS"
  - source: "Web App / Self-Service Portal"
    destination: "API Gateway"
    description: "Fetches application data"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "External Payment Gateway"
    description: "Processes fines"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "Digital Content Providers"
    description: "Fetches digital assets"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "Notification Service"
    description: "Dispatches alerts via EU endpoints"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "Integrated Library System (ILS) / Legacy Data Source"
    description: "Synchronizes bibliographic records"
    technology: "Z39.50 / HTTPS"
  - source: "Core Backend Services"
    destination: "Search Engine"
    description: "Updates search index via event streams"
    technology: "TCP/REST"
  - source: "Core Backend Services"
    destination: "Operational Database & Cache"
    description: "Handles transactional persistence and session caching"
    technology: "TCP"