level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Patrons and Staff"
    description: "End-users accessing web interfaces to browse catalogues, manage circulation, and utilize self-service portals."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External system for authentication and identity management."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system for processing payments and fines."
  - type: "externalSystem"
    name: "National Library Registry"
    description: "External registry for bibliographic metadata and ISBN lookups."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External provider for sending alerts and notifications."
  - type: "externalSystem"
    name: "Digital Content Delivery Provider"
    description: "External system for fulfilling digital assets."
  - type: "container"
    name: "Web Application"
    technology: "React, CDN"
    description: "Provides static patron and staff portals."
  - type: "container"
    name: "API Gateway"
    technology: "NGINX/Envoy"
    description: "Manages routing, ingress, and reverse proxying."
  - type: "container"
    name: "Core Services Container"
    technology: "Java, Spring Boot"
    description: "Handles transactional domain logic and circulation."
  - type: "container"
    name: "Search Container"
    technology: "Elasticsearch"
    description: "Provides high-performance search capabilities."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL"
    description: "Stores EU-resident relational data."
  - type: "container"
    name: "Caching Layer"
    technology: "Redis"
    description: "Provides high-speed metadata caching."
  - type: "container"
    name: "Async Worker Container"
    technology: "Background Workers"
    description: "Handles asynchronous background jobs."
  - type: "container"
    name: "Integration Worker Container"
    technology: "Integration Workers"
    description: "Handles external system integrations."
  - type: "container"
    name: "Search Worker Container"
    technology: "Debezium/CDC"
    description: "Synchronizes database changes to search via Change Data Capture."
  - type: "container"
    name: "Message Broker"
    technology: "RabbitMQ"
    description: "Facilitates AMQP event streaming between services and workers."
relationships:
  - source: "Patrons and Staff"
    destination: "Web Application"
    description: "Accesses portals and interacts with the system"
    technology: "HTTPS"
  - source: "Web Application"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS/REST/GraphQL"
  - source: "API Gateway"
    destination: "Core Services Container"
    description: "Routes requests to business logic"
    technology: "gRPC/HTTPS"
  - source: "API Gateway"
    destination: "Search Container"
    description: "Queries search index"
    technology: "gRPC/HTTPS"
  - source: "Core Services Container"
    destination: "Database"
    description: "Reads and writes relational data"
    technology: "TCP"
  - source: "Core Services Container"
    destination: "Caching Layer"
    description: "Reads and writes metadata cache"
    technology: "TCP"
  - source: "Core Services Container"
    destination: "Message Broker"
    description: "Publishes asynchronous events"
    technology: "AMQP"
  - source: "Message Broker"
    destination: "Async Worker Container"
    description: "Consumes background events"
    technology: "AMQP"
  - source: "Message Broker"
    destination: "Integration Worker Container"
    description: "Consumes integration events"
    technology: "AMQP"
  - source: "Message Broker"
    destination: "Search Worker Container"
    description: "Consumes search sync events"
    technology: "AMQP"
  - source: "Search Worker Container"
    destination: "Database"
    description: "Reads database changes via CDC"
    technology: "PostgreSQL CDC"
  - source: "Search Worker Container"
    destination: "Search Container"
    description: "Indexes search data"
    technology: "HTTPS/REST"
  - source: "Core Services Container"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "HTTPS"
  - source: "Core Services Container"
    destination: "Payment Gateway"
    description: "Processes fine collections"
    technology: "HTTPS"
  - source: "Core Services Container"
    destination: "National Library Registry"
    description: "Looks up metadata"
    technology: "HTTPS"
  - source: "Core Services Container"
    destination: "Notification Service"
    description: "Sends notifications"
    technology: "HTTPS"
  - source: "Core Services Container"
    destination: "Digital Content Delivery Provider"
    description: "Delivers digital content"
    technology: "HTTPS"