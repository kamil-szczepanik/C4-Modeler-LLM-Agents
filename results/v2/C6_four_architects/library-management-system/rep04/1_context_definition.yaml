level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A comprehensive solution for public and academic libraries to catalogue physical and digital items, manage circulation, and provide self-service portals, adhering strictly to EU-only data residency."
elements:
  - type: "person"
    name: "Patron & Staff"
    description: "End-users accessing web and mobile interfaces to browse catalogs, manage circulation, and utilize self-service portals."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Keycloak or Auth0 hosted in the EU for OAuth2/OIDC authentication."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "Stripe or Adyen restricted to EU regions for fine collection."
  - type: "externalSystem"
    name: "National Library Registry"
    description: "Used for ISBN and bibliographic metadata lookup."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Sendinblue/Brevo EU-hosted provider for circulation alerts."
  - type: "externalSystem"
    name: "Digital Content Delivery Provider"
    description: "OverDrive or Adobe APIs for digital asset fulfillment."
  - type: "container"
    name: "Web Frontend"
    description: "React/TypeScript Single Page Application served via CDN."
    technology: "React/TypeScript, CDN"
  - type: "container"
    name: "API Gateway"
    description: "Kong or Nginx reverse proxy managing routing and ingress."
    technology: "Kong or Nginx"
  - type: "container"
    name: "Core Services"
    description: "Java/Spring Boot application handling circulation and business logic."
    technology: "Java/Spring Boot"
  - type: "container"
    name: "Search Engine"
    description: "OpenSearch cluster for high-performance catalog queries."
    technology: "OpenSearch"
  - type: "container"
    name: "Database & Cache"
    description: "PostgreSQL 15+ on AWS RDS Frankfurt and Redis/Valkey for in-memory caching."
    technology: "PostgreSQL 15+, Redis/Valkey, AWS RDS Frankfurt"
  - type: "container"
    name: "Async Event Bus"
    description: "Apache Kafka or RabbitMQ for decoupled messaging."
    technology: "Apache Kafka or RabbitMQ"
relationships:
  - source: "Patron & Staff"
    destination: "Identity Provider"
    description: "Authenticates via OAuth2/OIDC redirect"
    technology: "HTTPS"
  - source: "Patron & Staff"
    destination: "Web Frontend"
    description: "Accesses web and mobile interfaces"
    technology: "HTTPS/TLS"
  - source: "Web Frontend"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Core Services"
    description: "Routes requests to business logic"
    technology: "gRPC over internal TLS"
  - source: "API Gateway"
    destination: "Search Engine"
    description: "Queries catalog data"
    technology: "gRPC over internal TLS"
  - source: "Core Services"
    destination: "Database & Cache"
    description: "Reads and writes relational data and cache"
    technology: "Internal TLS / TCP"
  - source: "Core Services"
    destination: "Async Event Bus"
    description: "Publishes and consumes asynchronous events"
    technology: "Internal TLS / TCP"
  - source: "Library Management System"
    destination: "External Payment Gateway"
    description: "Processes fine collections"
    technology: "REST/SOAP over HTTPS"
  - source: "Library Management System"
    destination: "National Library Registry"
    description: "Looks up ISBN and bibliographic metadata"
    technology: "REST/SOAP over HTTPS"
  - source: "Library Management System"
    destination: "Notification Service"
    description: "Sends circulation alerts"
    technology: "REST/SOAP over HTTPS"
  - source: "Library Management System"
    destination: "Digital Content Delivery Provider"
    description: "Fulfills digital assets"
    technology: "REST/SOAP over HTTPS"