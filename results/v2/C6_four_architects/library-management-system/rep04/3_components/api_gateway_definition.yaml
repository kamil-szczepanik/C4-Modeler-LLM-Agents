level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "SSL/TLS Termination & Geo-Routing Terminator"
    technology: "Kong/Envoy"
    description: "Handles edge termination and enforces strict EU-only data residency."
  - type: "component"
    name: "Auth & Rate Limiting Filter"
    technology: "Kong/Envoy Plugin"
    description: "Performs token validation and rate-limiting utilizing Redis."
  - type: "component"
    name: "Route Dispatcher"
    technology: "Kong/Envoy Router"
    description: "Routes validated and transformed business traffic to core services and search."
  - type: "component"
    name: "Request Transformation Engine"
    technology: "Kong/Envoy"
    description: "Transforms incoming requests before dispatching to internal containers."
  - type: "component"
    name: "Circuit Breaker & Fallback Manager"
    technology: "Kong/Envoy"
    description: "Implements fallback content and resilience patterns using Redis."
  - type: "component"
    name: "Analytics & Logging Collector"
    technology: "OTLP/HTTPS"
    description: "Exports audit and observability data to external SIEM/Monitoring within EU boundaries."
relationships:
  - source: "SSL/TLS Termination & Geo-Routing Terminator"
    destination: "Auth & Rate Limiting Filter"
    description: "Passes incoming requests for validation"
  - source: "Auth & Rate Limiting Filter"
    destination: "Request Transformation Engine"
    description: "Passes authenticated requests"
  - source: "Request Transformation Engine"
    destination: "Route Dispatcher"
    description: "Dispatches transformed requests"
  - source: "Route Dispatcher"
    destination: "Analytics & Logging Collector"
    description: "Sends metrics and logs"