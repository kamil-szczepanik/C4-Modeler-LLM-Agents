level: component
scope: "Component diagram for the Search Worker Container container"
parentContainer:
  name: "Search Worker Container"
elements:
  - type: "component"
    name: "CDC Source Connector Component"
    technology: "Java/Quarkus, Debezium Embedded"
    description: "Tails database Write-Ahead Logs to capture raw change events."
  - type: "component"
    name: "Search Transformer/Indexer Component"
    technology: "Java/Quarkus, Apache Camel"
    description: "Consumes batched sync payloads and bulk indexes documents."
  - type: "component"
    name: "Local DLQ/Retry Handler Component"
    technology: "Camel Error Handler"
    description: "Handles local retries and routes permanently failed payloads."
  - type: "component"
    name: "Metrics Exporter Component"
    technology: "Micrometer"
    description: "Exposes Prometheus-compatible metrics to track replication lag."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL Database"
    description: "Primary database source for change data capture."
  - type: "container"
    name: "Message Broker"
    technology: "RabbitMQ Message Broker"
    description: "Handles raw change events, batched payloads, and dead-letter routing."
  - type: "container"
    name: "Search Container"
    technology: "Elasticsearch Search Container"
    description: "Receives bulk indexed documents for search operations."
  - type: "system"
    name: "Monitoring"
    technology: "Prometheus-compatible"
    description: "External monitoring system for operational metrics."
relationships:
  - source: "Database"
    destination: "CDC Source Connector Component"
    description: "Tails database Write-Ahead Logs [PostgreSQL Replication Protocol]"
  - source: "CDC Source Connector Component"
    destination: "Message Broker"
    description: "Publishes raw change events [AMQP]"
  - source: "Message Broker"
    destination: "Search Transformer/Indexer Component"
    description: "Consumes batched sync payloads [AMQP]"
  - source: "Search Transformer/Indexer Component"
    destination: "Search Container"
    description: "Bulk indexes documents [HTTPS/REST]"
  - source: "Local DLQ/Retry Handler Component"
    destination: "Message Broker"
    description: "Routes permanently failed payloads to DLX [AMQP]"
  - source: "Metrics Exporter Component"
    destination: "Monitoring"
    description: "Exposes Prometheus-compatible metrics [HTTP]"