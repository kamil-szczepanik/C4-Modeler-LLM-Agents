level: component
scope: "Component diagram for the Web Application container"
parentContainer:
  name: "Web Application"
elements:
  - type: "component"
    name: "Patron Portal SPA"
    technology: "React, TypeScript"
    description: "Client-side single page application for public library patrons."
  - type: "component"
    name: "Staff Portal SPA"
    technology: "React, TypeScript"
    description: "Client-side single page application for library staff workflows."
  - type: "component"
    name: "API Client Service"
    technology: "Axios/Fetch wrapper"
    description: "Handles HTTP requests and API communication."
  - type: "component"
    name: "State Management Store"
    technology: "Zustand/Redux Toolkit"
    description: "Manages client-side state and caching."
  - type: "component"
    name: "Session & Localization Manager"
    technology: "JavaScript/Cookie utility"
    description: "Validates sessions and applies EU locales."
  - type: "component"
    name: "Error Boundary & Telemetry Reporter"
    technology: "Sentry/Custom JS"
    description: "Catches runtime exceptions and forwards client telemetry."
  - type: "component"
    name: "API Gateway"
    technology: "NGINX/Envoy"
    description: "Manages API routing, ingress security, and rate limiting."
  - type: "component"
    name: "Routing & Reverse Proxy Engine"
    technology: "Envoy Core"
    description: "Routes incoming API requests."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "JWT/OAuth2 module"
    description: "Inspects security tokens."
  - type: "component"
    name: "Rate Limiter"
    technology: "Token Bucket algorithm"
    description: "Protects downstream services using rate limiting."
relationships:
  - source: "Patron Portal SPA"
    destination: "API Client Service"
    description: "Dispatches requests"
  - source: "Staff Portal SPA"
    destination: "API Client Service"
    description: "Dispatches requests"
  - source: "Patron Portal SPA"
    destination: "Session & Localization Manager"
    description: "Validates session and applies EU locales"
  - source: "Staff Portal SPA"
    destination: "Session & Localization Manager"
    description: "Validates session and applies EU locales"
  - source: "Patron Portal SPA"
    destination: "Error Boundary & Telemetry Reporter"
    description: "Catches runtime exceptions"
  - source: "Staff Portal SPA"
    destination: "Error Boundary & Telemetry Reporter"
    description: "Catches runtime exceptions"
  - source: "API Client Service"
    destination: "API Gateway"
    description: "Sends API requests"
  - source: "Error Boundary & Telemetry Reporter"
    destination: "API Gateway"
    description: "Forwards client telemetry"
  - source: "Web Application"
    destination: "Routing & Reverse Proxy Engine"
    description: "Sends API requests"
  - source: "Routing & Reverse Proxy Engine"
    destination: "Authentication & Authorization Filter"
    description: "Inspects tokens"