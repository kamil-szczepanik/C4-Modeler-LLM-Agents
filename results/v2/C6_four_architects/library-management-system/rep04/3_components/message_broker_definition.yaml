level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Exchange Router"
    technology: "Topic Exchange (AMQP)"
    description: "Decouples publishers from queues using routing keys via AMQP 0-9-1 over TLS."
  - type: "component"
    name: "Queue Manager"
    technology: "AMQP queues"
    description: "Maintains bounded buffers for worker containers and delivers messages using push-based consumption with manual basic.ack."
  - type: "component"
    name: "Persistence Log"
    technology: "Mnesia / Disk storage"
    description: "Ensures localized message durability and strict EU-only data residency."
  - type: "component"
    name: "Dead Letter Exchange (DLX)"
    technology: "AMQP isolation mechanism"
    description: "Handles poisoned or unroutable messages for error isolation."
  - type: "component"
    name: "Cluster Federation / Sharding Plugin"
    technology: "Erlang-based clustering"
    description: "Enables clustering across availability zones."
  - type: "component"
    name: "Management & Monitoring Plugin"
    technology: "HTTP/REST endpoint (Port 15672)"
    description: "Exposes broker metrics via HTTP/REST for Prometheus scraping."
  - type: "component"
    name: "Access Control & Virtual Host Manager"
    technology: "AMQP SASL/TLS and x509"
    description: "Enforces in-transit encryption and access control."
relationships:
  - source: "Core Services Container"
    destination: "Exchange Router"
    description: "Publishes domain events via AMQP 0-9-1 over TLS"
  - source: "Queue Manager"
    destination: "Async Worker Container"
    description: "Delivers buffered messages using push-based consumption with manual basic.ack"
  - source: "Queue Manager"
    destination: "Integration Worker Container"
    description: "Delivers buffered messages using push-based consumption with manual basic.ack"
  - source: "Queue Manager"
    destination: "Search Worker Container"
    description: "Delivers buffered messages using push-based consumption with manual basic.ack"
  - source: "Management & Monitoring Plugin"
    destination: "Prometheus"
    description: "Exposes broker metrics via HTTP/REST for scraping"