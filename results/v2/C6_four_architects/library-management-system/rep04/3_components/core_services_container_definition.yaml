level: component
scope: "Component diagram for the Core Services Container container"
parentContainer:
  name: "Core Services Container"
elements:
  - type: "component"
    name: "Catalogue Component"
    technology: "Spring Data JPA"
    description: "Manages physical and digital item metadata."
  - type: "component"
    name: "Circulation Component"
    technology: "Spring Tx"
    description: "Implements checkout, hold, and fine-processing domain logic."
  - type: "component"
    name: "Integration Client Component"
    technology: "Spring Cloud OpenFeign/WebClient"
    description: "Encapsulates outbound HTTPS calls."
