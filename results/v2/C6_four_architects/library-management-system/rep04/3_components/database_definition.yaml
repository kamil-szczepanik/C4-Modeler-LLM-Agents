level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Connection Pooler (PgBouncer)"
    technology: "PgBouncer"
    description: "Manages incoming database connections and prevents connection exhaustion."
  - type: "component"
    name: "Relational Storage Engine"
    technology: "PostgreSQL with pg_trgm extension"
    description: "Provides robust relational storage and trigram-based fuzzy matching for search."
  - type: "component"
    name: "Logical Replication Slot"
    technology: "PostgreSQL internal mechanism"
    description: "Streams Write-Ahead Log (WAL) data for Change Data Capture (CDC)."
relationships:
  - source: "Connection Pooler (PgBouncer)"
    destination: "Relational Storage Engine"
    description: "Forwards queued client connections via TCP and Unix Domain Sockets."
  - source: "Relational Storage Engine"
    destination: "Logical Replication Slot"
    description: "Streams Write-Ahead Log (WAL) data."