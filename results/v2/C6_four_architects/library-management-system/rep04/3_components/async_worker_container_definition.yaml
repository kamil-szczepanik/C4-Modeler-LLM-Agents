level: component
scope: "Component diagram for the Async Worker Container container"
parentContainer:
  name: "Async Worker Container"
elements:
  - type: "component"
    name: "Job Dispatcher / Component"
    technology: "Spring AMQP"
    description: "Consumes background job events from the Message Broker."
  - type: "component"
    name: "Task Execution Engine"
    technology: "Spring Task / Java"
    description: "Delegates payload and executes background tasks like overdue notices and report generation."
  - type: "component"
    name: "Data Access Component"
    technology: "Spring Data JPA"
    description: "Persists state and updates entities in the Database."
  - type: "component"
    name: "Notification Client"
    technology: "HTTP Client"
    description: "Triggers alerts and routes them via the API Gateway."
  - type: "component"
    name: "Cache Client"
    technology: "Spring Data Redis"
    description: "Acquires idempotency locks and connects to the Caching Layer."
  - type: "component"
    name: "Storage Client"
    technology: "AWS SDK"
    description: "Persists reports and uploads them to Object Storage."
  - type: "component"
    name: "Metrics & Health Component"
    technology: "Micrometer / Actuator"
    description: "Provides container telemetry and liveness/readiness probes."
  - type: "component"
    name: "Job Error Handler / Dead-Letter Component"
    technology: "Spring Boot"
    description: "Forwards failed tasks to the Message Broker's DLX."
  - type: "component"
    name: "Database"
    technology: "PostgreSQL"
    description: "Relational persistence with EU data residency."
  - type: "component"
    name: "Message Broker"
    technology: "RabbitMQ"
    description: "Message consumption and DLQ error handling."
  - type: "component"
    name: "Caching Layer"
    technology: "Redis"
    description: "Distributed locking and idempotency management."
  - type: "component"
    name: "Object Storage"
    technology: "EU-Region MinIO/S3-Compatible"
    description: "Compliant object storage for bulk reports."
  - type: "component"
    name: "API Gateway"
    technology: "API Gateway"
    description: "Routes alerts from the notification client."
relationships:
  - source: "Message Broker"
    destination: "Job Dispatcher / Component"
    description: "Consumes events [AMQP]"
  - source: "Job Dispatcher / Component"
    destination: "Task Execution Engine"
    description: "Delegates payload [In-Memory]"
  - source: "Task Execution Engine"
    destination: "Data Access Component"
    description: "Persists state [JDBC]"
  - source: "Data Access Component"
    destination: "Database"
    description: "Updates entities [JDBC]"
  - source: "Task Execution Engine"
    destination: "Cache Client"
    description: "Acquires idempotency locks [TCP/Redis]"
  - source: "Cache Client"
    destination: "Caching Layer"
    description: "Connects [TCP/Redis Protocol]"
  - source: "Task Execution Engine"
    destination: "Storage Client"
    description: "Persists reports [HTTPS]"
  - source: "Storage Client"
    destination: "Object Storage"
    description: "Uploads reports [HTTPS]"
  - source: "Task Execution Engine"
    destination: "Notification Client"
    description: "Triggers alerts [In-Memory]"
  - source: "Notification Client"
    destination: "API Gateway"
    description: "Routes alerts [REST/HTTPS]"
  - source: "Task Execution Engine"
    destination: "Job Error Handler / Dead-Letter Component"
    description: "Forwards failed tasks [In-Memory]"
  - source: "Job Error Handler / Dead-Letter Component"
    destination: "Message Broker"
    description: "Publishes to DLX [AMQP]"
  - source: "Container Orchestrator"
    destination: "Metrics & Health Component"
    description: "Scrapes health [HTTP/REST]"