level: component
scope: "Component diagram for the Search Container container"
parentContainer:
  name: "Search Container"
elements:
  - type: "component"
    name: "Search API Handler"
    technology: "Java, Spring WebFlux"
    description: "Enables non-blocking I/O for low-latency request handling and processes search queries."
  - type: "component"
    name: "Query Sanitizer & Metrics Interceptor"
    technology: "Middleware"
    description: "Sanitizes incoming queries and intercepts requests for metrics collection."
  - type: "component"
    name: "Search Query Cache"
    technology: "Redis"
    description: "Caches frequent search queries to reduce index load."
  - type: "component"
    name: "Search Index Engine"
    technology: "Elasticsearch 8.x"
    description: "Provides high-performance indexing and full-text search with EU node pinning."
  - type: "component"
    name: "Index Management Service"
    technology: "Python sidecar"
    description: "Implements sidecar index management operations via loopback HTTPS."
  - type: "component"
    name: "API Gateway"
    technology: "API Gateway"
    description: "Forwards search queries to the Search API Handler via gRPC."
  - type: "component"
    name: "Search Worker Container"
    technology: "Container"
    description: "Ingests delta updates into the search index engine via HTTPS/REST."
relationships:
  - source: "API Gateway"
    destination: "Search API Handler"
    description: "Forwards search queries via gRPC"
  - source: "Search API Handler"
    destination: "Search Query Cache"
    description: "Checks cached result sets via RESP/TCP"
  - source: "Search Query Cache"
    destination: "Search Index Engine"
    description: "Fallback query on cache miss via Transport Client / TCP"
  - source: "Search Worker Container"
    destination: "Search Index Engine"
    description: "Ingests delta updates via HTTPS/REST"
  - source: "Index Management Service"
    destination: "Search Index Engine"
    description: "Admin operations via loopback HTTPS"