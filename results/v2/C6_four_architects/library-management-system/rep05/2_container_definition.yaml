level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons and Staff"
    description: "Users who interact with the library system via frontend SPA or mobile apps to catalogue items, manage circulation, and use self-service portals."
  - type: "externalSystem"
    name: "Stripe EU"
    description: "External payment gateway used for handling transactions."
  - type: "externalSystem"
    name: "AWS S3 EU-Central"
    description: "External cloud storage for securing digital catalog asset storage within EU boundaries."
  - type: "container"
    name: "Web Application (SPA)"
    technology: "React/TypeScript"
    description: "Powers the frontend SPA hosted on an EU-Central CDN."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx / Envoy"
    description: "Routes and manages incoming requests to internal services."
  - type: "container"
    name: "Core Services Container"
    technology: "Spring Boot / Java"
    description: "Provides scalable business logic for core catalogue and circulation."
  - type: "container"
    name: "Search Container"
    technology: "Elasticsearch Cluster"
    description: "Optimizes indexing and queries to meet the < 800ms 99th-percentile search SLA."
  - type: "container"
    name: "Integration Service"
    technology: "Node.js / Python"
    description: "Handles integrations with external services like Stripe EU."
  - type: "container"
    name: "Async Worker Container"
    technology: "Python / Celery or Java / Spring Batch"
    description: "Processes background tasks and asynchronous event handling."
  - type: "container"
    name: "Message Broker"
    technology: "Managed RabbitMQ"
    description: "Enables decoupled asynchronous event handling and webhooks."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL Managed RDS"
    description: "Ensures transactional consistency for core records."
  - type: "container"
    name: "Cache / Session Store"
    technology: "Managed AWS Redis"
    description: "Delivers sub-millisecond session validation and hot caching."
  - type: "container"
    name: "File Storage Container"
    technology: "AWS S3 EU-Central"
    description: "Secures digital assets and documents within the EU boundary."
relationships:
  - source: "Library Patrons and Staff"
    destination: "Web Application (SPA)"
    description: "Interacts via browser"
    technology: "HTTPS"
  - source: "Web Application (SPA)"
    destination: "API Gateway"
    description: "Sends requests to backend services"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "Core Services Container"
    description: "Routes core business logic requests"
    technology: "gRPC / internal REST"
  - source: "API Gateway"
    destination: "Search Container"
    description: "Routes search queries"
    technology: "gRPC / internal REST"
  - source: "API Gateway"
    destination: "Cache / Session Store"
    description: "Validates sessions and accesses cache"
    technology: "RESP over TLS"
  - source: "Core Services Container"
    destination: "Cache / Session Store"
    description: "Accesses hot cache and session state"
    technology: "RESP over TLS"
  - source: "Core Services Container"
    destination: "Database"
    description: "Reads and writes transactional data"
    technology: "JDBC over TLS"
  - source: "Core Services Container"
    destination: "Message Broker"
    description: "Publishes events and messages"
    technology: "AMQP/TLS"
  - source: "Message Broker"
    destination: "Async Worker Container"
    description: "Consumes asynchronous jobs and events"
    technology: "AMQP/TLS"
  - source: "Integration Service"
    destination: "Stripe EU"
    description: "Processes payments and external integrations"
    technology: "HTTPS/REST"
  - source: "Async Worker Container"
    destination: "Stripe EU"
    description: "Handles background payment or external tasks"
    technology: "HTTPS/REST"
  - source: "Integration Service"
    destination: "File Storage Container"
    description: "Manages digital assets"
    technology: "HTTPS/REST"
  - source: "Async Worker Container"
    destination: "File Storage Container"
    description: "Processes and retrieves files"
    technology: "HTTPS/REST"
  - source: "Database"
    destination: "Search Container"
    description: "Syncs search index data"
    technology: "Debezium CDC via internal TCP/TLS"