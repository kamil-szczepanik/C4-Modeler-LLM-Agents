level: component
scope: "Component diagram for the Core Services Container container"
parentContainer:
  name: "Core Services Container"
elements:
  - type: "component"
    name: "Catalogue Management Component"
    technology: "Spring Bean / Java"
    description: "Provides cataloguing functionality for public and academic libraries."
  - type: "component"
    name: "Circulation Engine Component"
    technology: "Spring Bean / Java"
    description: "Handles circulation workflows and publishes domain events."
  - type: "component"
    name: "Search Orchestrator Component"
    technology: "Spring Bean / Java"
    description: "Orchestrates high-performance search queries."
  - type: "component"
    name: "Authentication/Authorization Component"
    technology: "Spring Security / Java"
    description: "Manages authentication and authorization."
  - type: "component"
    name: "Notification & Event Dispatcher Component"
    technology: "Spring Event / Java"
    description: "Dispatches notifications and internal events."
  - type: "component"
    name: "Transaction & Audit Component"
    technology: "Spring @Transactional / Java"
    description: "Ensures atomic operations and audit logging."
  - type: "component"
    name: "Search Container"
    technology: "Elasticsearch"
    description: "Executes high-performance queries."
  - type: "component"
    name: "Message Broker"
    technology: "Managed RabbitMQ"
    description: "Handles asynchronous messaging."
  - type: "component"
    name: "Database"
    technology: "PostgreSQL RDS"
    description: "Stores transactional data ensuring ACID compliance."
  - type: "component"
    name: "Cache / Session Store"
    technology: "AWS Redis"
    description: "Manages transient states and session caching."
relationships:
  - source: "Search Orchestrator Component"
    destination: "Search Container"
    description: "Executes high-performance queries [REST over TLS]"
  - source: "Circulation Engine Component"
    destination: "Message Broker"
    description: "Publishes domain events [AMQP/TLS]"
  - source: "Transaction & Audit Component"
    destination: "Database"
    description: "Commits atomic operations [JDBC over TLS]"
  - source: "Circulation Engine Component"
    destination: "Cache / Session Store"
    description: "Manages transient states [RESP over TLS]"
  - source: "Catalogue Management Component"
    destination: "Circulation Engine Component"
    description: "Communicate via [In-process Method Calls]"