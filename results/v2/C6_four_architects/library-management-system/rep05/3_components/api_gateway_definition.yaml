level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Geo-Routing & Compliance Filter"
    technology: "Envoy Component (WebAssembly / Lua)"
    description: "Enforces strict EU-only data residency and geo-compliance filtering at the gateway perimeter."
  - type: "component"
    name: "Authentication Filter"
    technology: "Envoy Component"
    description: "Validates user tokens against the identity provider."
  - type: "component"
    name: "Rate Limiting Filter"
    technology: "Envoy Component"
    description: "Checks rate limit counters against the cache and session store."
  - type: "component"
    name: "Transformation Filter"
    technology: "Envoy Component"
    description: "Translates incoming JSON requests to gRPC."
  - type: "component"
    name: "Routing & Dispatcher Engine"
    technology: "Envoy Component (with Circuit Breaker)"
    description: "Forwards requests to core services and search containers with built-in circuit breaking."
relationships:
  - source: "Geo-Routing & Compliance Filter"
    destination: "Authentication Filter"
    description: "Forwards validated, geo-compliant requests [In-memory]"
  - source: "Rate Limiting Filter"
    destination: "Cache / Session Store"
    description: "Checks rate limit counters [RESP over TLS]"
  - source: "Transformation Filter"
    destination: "Routing & Dispatcher Engine"
    description: "Translates JSON to gRPC [In-memory]"
  - source: "Routing & Dispatcher Engine"
    destination: "Core Services Container"
    description: "Forwards requests with circuit breaking [gRPC]"
  - source: "Routing & Dispatcher Engine"
    destination: "Search Container"
    description: "Routes search queries [gRPC]"