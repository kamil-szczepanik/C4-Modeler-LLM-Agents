level: component
scope: "Component diagram for the Async Worker Container container"
parentContainer:
  name: "Async Worker Container"
elements:
  - type: "component"
    name: "Task Router / Consumer"
    technology: "Python 3.11, Celery Worker"
    description: "Consumes jobs from the message broker and routes them to appropriate workers."
  - type: "component"
    name: "Notification Processor"
    technology: "Python 3.11, Celery"
    description: "Triggers background payments and renewals."
  - type: "component"
    name: "Report & Batch Processor"
    technology: "Python 3.11, Celery"
    description: "Executes heavy analytical queries and generates reports."
  - type: "component"
    name: "Data Purge & Compliance Worker"
    technology: "Python 3.11, Celery"
    description: "Executes GDPR data anonymisation."
  - type: "component"
    name: "Integration Sync Worker"
    technology: "Python 3.11, Celery"
    description: "Fetches student and faculty updates from external systems."
  - type: "component"
    name: "Message Broker"
    technology: "Managed RabbitMQ / Redis"
    description: "Message broker and result backend for Celery."
  - type: "component"
    name: "Database"
    technology: "PostgreSQL Managed RDS EU-Central, SQLAlchemy, asyncpg"
    description: "Persists job state, updates statuses, and stores system data."
  - type: "component"
    name: "File Storage Container"
    technology: "AWS S3 EU-Central"
    description: "Stores generated reports and files."
relationships:
  - source: "Task Router / Consumer"
    destination: "Message Broker"
    description: "Consumes jobs [AMQP/TLS]"
  - source: "Task Router / Consumer"
    destination: "Database"
    description: "Persists job state and updates statuses [PostgreSQL/JDBC, EU-Central]"
  - source: "Notification Processor"
    destination: "Stripe EU"
    description: "Triggers background payments and renewals [HTTPS/REST, TLS 1.3]"
  - source: "Report & Batch Processor"
    destination: "Database"
    description: "Executes heavy analytical queries [PostgreSQL/JDBC, EU-Central]"
  - source: "Report & Batch Processor"
    destination: "File Storage Container"
    description: "Uploads generated reports [HTTPS/REST, TLS 1.3]"
  - source: "Data Purge & Compliance Worker"
    destination: "Database"
    description: "Executes GDPR data anonymisation [PostgreSQL/JDBC, EU-Central]"
  - source: "Integration Sync Worker"
    destination: "University SIS"
    description: "Fetches student/faculty updates [HTTPS/REST, TLS 1.3]"