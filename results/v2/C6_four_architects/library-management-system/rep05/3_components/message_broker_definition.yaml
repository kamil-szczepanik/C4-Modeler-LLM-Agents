level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Exchange Router Component"
    technology: "Managed RabbitMQ / AMQP 0-9-1"
    description: "Handles asynchronous event processing and webhook ingestion."
  - type: "component"
    name: "Queue Manager Component"
    technology: "Managed RabbitMQ / AMQP 0-9-1"
    description: "Manages queues, dispatches background jobs, and forwards failed messages."
  - type: "component"
    name: "Connection & Security Manager Component"
    technology: "TLS / HTTPS"
    description: "Secures internal messaging and communication protocols under EU data residency constraints."
  - type: "component"
    name: "Dead Letter & Retry Component"
    technology: "Managed RabbitMQ / Internal AMQP"
    description: "Forwards failed messages and re-dispatches retried tasks."
  - type: "component"
    name: "Broker Metrics & Audit Component"
    technology: "Prometheus / RabbitMQ Prometheus Plugin"
    description: "Emits telemetry and forwards security logs."
  - type: "component"
    name: "Topology Management Component"
    technology: "Terraform / RabbitMQ definitions JSON / AMQP Management API"
    description: "Applies schema definitions, bindings, and TTL policies."
  - type: "component"
    name: "Core Services Container"
    technology: "Microservice Container"
    description: "Publishes events to the Exchange Router."
  - type: "component"
    name: "Integration Service"
    technology: "Integration Service Container"
    description: "Publishes incoming third-party webhook events and system events."
  - type: "component"
    name: "Async Worker Container"
    technology: "Worker Container"
    description: "Receives dispatched background jobs and re-dispatches retried tasks."
  - type: "component"
    name: "SIEM / Central Log Collector"
    technology: "Syslog / TLS"
    description: "Receives forwarded security logs from the broker metrics and audit component."
  - type: "component"
    name: "CI/CD Deployment Pipeline"
    technology: "Pipeline / HTTPS"
    description: "Applies schema definitions to the topology management component."
relationships:
  - source: "Core Services Container"
    destination: "Exchange Router Component"
    description: "Publishes events [AMQP/TLS]"
  - source: "Integration Service"
    destination: "Exchange Router Component"
    description: "Publishes incoming third-party webhook events [AMQP/TLS]"
  - source: "Queue Manager Component"
    destination: "Async Worker Container"
    description: "Dispatches background jobs [AMQP/TLS]"
  - source: "Queue Manager Component"
    destination: "Dead Letter & Retry Component"
    description: "Forwards failed messages [Internal AMQP]"
  - source: "Dead Letter & Retry Component"
    destination: "Async Worker Container"
    description: "Re-dispatches retried tasks [AMQP/TLS]"
  - source: "Exchange Router Component"
    destination: "Broker Metrics & Audit Component"
    description: "Emits telemetry [Prometheus/TLS]"
  - source: "Queue Manager Component"
    destination: "Broker Metrics & Audit Component"
    description: "Emits telemetry [Prometheus/TLS]"
  - source: "Broker Metrics & Audit Component"
    destination: "SIEM / Central Log Collector"
    description: "Forwards security logs [Syslog/TLS]"
  - source: "CI/CD Deployment Pipeline"
    destination: "Topology Management Component"
    description: "Applies schema definitions [HTTPS]"
  - source: "Topology Management Component"
    destination: "Exchange Router Component"
    description: "Applies bindings and TTL policies [AMQP Management API / HTTPS]"
  - source: "Topology Management Component"
    destination: "Queue Manager Component"
    description: "Applies bindings and TTL policies [AMQP Management API / HTTPS]"