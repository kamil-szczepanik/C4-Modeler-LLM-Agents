# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Search Container container"
parentContainer:
  name: "Search Container"
elements:
  - type: "component"
    name: "Query Service Component"
    technology: "Java / Spring Boot"
    description: "Handles incoming search requests."
  - type: "component"
    name: "Schema Validation & Sanitization Component"
    technology: "Java / OWASP Validator"
    description: "Protects against query injection."
  - type: "component"
    name: "Encryption & Compliance Component"
    technology: "Java / Spring Security"
    description: "Enforcing TLS 1.3 and data masking."
  - type: "component"
    name: "Circuit Breaker & Fallback Component"
    technology: "Resilience4j"
    description: "Handling latency spikes and fallback results."
  - type: "component"
    name: "Indexing Worker Component"
    technology: "Java / custom consumer"
    description: "Processing asynchronous updates."
  - type: "component"
    name: "Index Lifecycle Management (ILM) Component"
    technology: "Elasticsearch ILM"
    description: "Managing index rollover and purging."
  - type: "component"
    name: "Search Engine Core"
    technology: "Elasticsearch 8.x"
    description: "Distributed cluster deployed across 3 availability zones."
  - type: "component"
    name: "API Gateway"
    technology: "API Gateway"
    description: "External entry point routing search traffic."
  - type: "component"
    name: "Message Broker"
    technology: "Message Broker"
    description: "Event broker delivering asynchronous events."
  - type: "component"
    name: "Cache / Session Store"
    technology: "Redis Protocol"
    description: "Low-latency caching layer for fast fallback search snippets."
relationships:
  - source: "API Gateway"
    destination: "Query Service Component"
    description: "gRPC"
  - source: "Message Broker"
    destination: "Indexing Worker Component"
    description: "AMQP via Debezium CDC"
  - source: "Query Service Component"
    destination: "Cache / Session Store"
    description: "Redis Protocol"
  - source: "Query Service Component"
    destination: "Search Engine Core"
    description: "Transport Protocol / HTTP over TLS 1.3"
  - source: "Indexing Worker Component"
    destination: "Search Engine Core"
    description: "HTTP/REST over TLS 1.3"
  - source: "Search Engine Core"
    destination: "Search Engine Core"
    description: "Transport Protocol / TCP 9300"