level: component
scope: "Component diagram for the Web Application (SPA) container"
parentContainer:
  name: "Web Application (SPA)"
elements:
  - type: "component"
    name: "Router & Shell Component"
    technology: "react-router"
    description: "Manages application navigation, layout framing, and route-based code splitting."
  - type: "component"
    name: "Authentication State Component"
    technology: "Context API + oidc-client-ts"
    description: "Handles user authentication states, OIDC session management, and token storage."
  - type: "component"
    name: "Catalogue & Search UI Component"
    technology: "React/TypeScript"
    description: "Provides the interface for browsing the library catalogue and executing searches with sub-800ms performance."
  - type: "component"
    name: "Circulation & Self-Service Component"
    technology: "React/TypeScript"
    description: "Enables self-service borrowing, returns, and account management for library patrons and staff."
  - type: "component"
    name: "State Management & Caching Store"
    technology: "TanStack Query"
    description: "Optimizes data fetching, server-state synchronization, and client-side caching to meet performance goals."
  - type: "component"
    name: "Notification & Feedback Component"
    technology: "React Toastify"
    description: "Renders toast notifications and system feedback messages to users."
  - type: "component"
    name: "API Client / HTTP Interceptor Component"
    technology: "Axios"
    description: "Centralizes HTTP requests, handles error interception, and injects bearer tokens."
relationships:
  - source: "API Client / HTTP Interceptor Component"
    destination: "API Gateway"
    description: "Sends API requests via [HTTPS/REST]"
  - source: "Authentication State Component"
    destination: "API Gateway"
    description: "Authenticates users via [HTTPS/REST]"
  - source: "Catalogue & Search UI Component"
    destination: "API Gateway"
    description: "Fetches search results and catalogue data via [HTTPS/REST]"