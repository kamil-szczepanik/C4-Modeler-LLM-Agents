level: component
scope: "Component diagram for the Integration Service container"
parentContainer:
  name: "Integration Service"
elements:
  - type: "component"
    name: "Integration Facade / Router"
    technology: "NestJS Module with Circuit Breaker & Retry Middleware"
    description: "Routes integration tasks and manages circuit breaking and retry logic."
  - type: "component"
    name: "Payment Adapter Component"
    technology: "NestJS"
    description: "Processes payments with external payment systems."
  - type: "component"
    name: "SIS Sync Component"
    technology: "NestJS"
    description: "Syncs patron rosters with university student information systems."
  - type: "component"
    name: "Webhook Handler Component"
    technology: "NestJS"
    description: "Handles incoming webhook events from external systems."
  - type: "component"
    name: "IoT Gateway Component"
    technology: "NestJS"
    description: "Receives item scans and communicates with IoT devices."
  - type: "component"
    name: "Notification Adapter Component"
    technology: "NestJS"
    description: "Manages and dispatches external notifications."
  - type: "component"
    name: "Delivery & Logistics Adapter Component"
    technology: "NestJS"
    description: "Coordinates shipments with third-party delivery services."
  - type: "component"
    name: "Core Services Container"
    technology: "gRPC"
    description: "Core backend services that delegate integration tasks."
  - type: "component"
    name: "Stripe EU"
    technology: "HTTPS/REST"
    description: "External payment processing platform."
  - type: "component"
    name: "University SIS"
    technology: "SFTP/REST"
    description: "External university student information system."
  - type: "component"
    name: "Third-Party Delivery"
    technology: "HTTPS/REST"
    description: "External delivery and logistics provider."
  - type: "component"
    name: "RFID Gates"
    technology: "MQTT"
    description: "IoT hardware gates for library item scans."
relationships:
  - source: "Core Services Container"
    destination: "Integration Facade / Router"
    description: "Delegates integration tasks [gRPC]"
  - source: "Integration Facade / Router"
    destination: "Payment Adapter Component"
    description: "Dispatches payloads [In-Memory / Resilience4ts]"
  - source: "Integration Facade / Router"
    destination: "SIS Sync Component"
    description: "Dispatches payloads [In-Memory / Resilience4ts]"
  - source: "Integration Facade / Router"
    destination: "Webhook Handler Component"
    description: "Dispatches payloads [In-Memory / Resilience4ts]"
  - source: "Integration Facade / Router"
    destination: "IoT Gateway Component"
    description: "Dispatches payloads [In-Memory / Resilience4ts]"
  - source: "Integration Facade / Router"
    destination: "Notification Adapter Component"
    description: "Dispatches payloads [In-Memory / Resilience4ts]"
  - source: "Integration Facade / Router"
    destination: "Delivery & Logistics Adapter Component"
    description: "Dispatches payloads [In-Memory / Resilience4ts]"
  - source: "Payment Adapter Component"
    destination: "Stripe EU"
    description: "Processes payments [HTTPS/REST]"
  - source: "SIS Sync Component"
    destination: "University SIS"
    description: "Syncs patron rosters [SFTP/REST]"
  - source: "IoT Gateway Component"
    destination: "RFID Gates"
    description: "Receives item scans [MQTT]"
  - source: "Delivery & Logistics Adapter Component"
    destination: "Third-Party Delivery"
