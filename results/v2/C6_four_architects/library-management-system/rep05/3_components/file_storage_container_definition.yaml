level: component
scope: "Component diagram for the File Storage Container container"
parentContainer:
  name: "File Storage Container"
elements:
  - type: "component"
    name: "File Controller / API Router"
    technology: "Spring WebFlux / Java"
    description: "Non-blocking reactive streaming of metadata and API routing."
  - type: "component"
    name: "Presigned URL Generator"
    technology: "Java"
    description: "Issues time-limited S3 upload/download tokens."
  - type: "component"
    name: "Virus & Malware Scanner Service"
    technology: "ClamAV via FastAPI / Python"
    description: "Lightweight wrapper and daemon for secure virus/malware scanning."
  - type: "component"
    name: "Storage Abstraction Manager"
    technology: "AWS SDK for Java"
    description: "Handles AWS S3 encryption-at-rest (AES-256) and IAM integration."
  - type: "component"
    name: "Audit Logging & Access Policy Enforcer"
    technology: "AWS IAM / CloudTrail"
    description: "Validates IAM permissions and EU residency."
  - type: "component"
    name: "AWS S3 EU-Central"
    technology: "AWS S3 EU-Central-1 Region"
    description: "Ensures strict EU-only data residency and quarantine isolation."
  - type: "component"
    name: "Integration Service"
    technology: "External Service"
    description: "Uploads/downloads digital assets and requests secure tokens."
relationships:
  - source: "Integration Service"
    destination: "File Controller / API Router"
    description: "Uploads/downloads digital assets and requests secure tokens [HTTPS/REST]"
  - source: "File Controller / API Router"
    destination: "Audit Logging & Access Policy Enforcer"
    description: "Validates IAM permissions and EU residency [In-Memory Java Call]"
  - source: "File Controller / API Router"
    destination: "Presigned URL Generator"
    description: "Issues time-limited S3 upload/download tokens [In-Memory]"
  - source: "Presigned URL Generator"
    destination: "AWS S3 EU-Central"
    description: "Direct client data transfer [HTTPS/SigV4]"
  - source: "File Controller / API Router"
    destination: "Virus & Malware Scanner Service"
    description: "Triggers asynchronous security scan [Internal gRPC]"
  - source: "Virus & Malware Scanner Service"
    destination: "Storage Abstraction Manager"
    description: "Signals clean scan status for quarantine-to-production promotion [Internal gRPC]"
  - source: "Storage Abstraction Manager"
    destination: "AWS S3 EU-Central"
    description: "Enforces AES-256 encryption-at-rest and bucket restrictions [HTTPS/SigV4]"