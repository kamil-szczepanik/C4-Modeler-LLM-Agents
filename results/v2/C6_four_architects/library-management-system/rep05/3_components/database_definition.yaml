level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Relational Data Store"
    technology: "PostgreSQL Managed RDS"
    description: "Stores core transactional entities ensuring transactional consistency and ACID compliance."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Manages inbound database connections to prevent connection exhaustion under peak loads."
  - type: "component"
    name: "Read Replica"
    technology: "PostgreSQL Replica"
    description: "Handles read-heavy queries and reporting."
  - type: "component"
    name: "WAL Publisher"
    technology: "PostgreSQL WAL / Debezium"
    description: "Emits transaction logs for Change Data Capture (CDC)."
  - type: "component"
    name: "Backup & Snapshot Manager"
    technology: "AWS RDS Automated Backups"
    description: "Enforces region-locked recovery and encrypted backups."
  - type: "component"
    name: "Audit & Security Monitor"
    technology: "pgaudit"
    description: "Captures security events and query logs."
  - type: "component"
    name: "Database Schema Migration Engine"
    technology: "Flyway or Liquibase"
    description: "Manages version-controlled schema evolution."
relationships:
  - source: "Core Services Container"
    destination: "Connection Pooler"
    description: "JDBC over TLS"
  - source: "Core Services Container"
    destination: "Read Replica"
    description: "JDBC over TLS (Read-Only)"
  - source: "Core Services Container"
    destination: "Relational Data Store"
    description: "JDBC over TLS (DDL execution)"
  - source: "WAL Publisher"
    destination: "Search Container"
    description: "TCP/TLS stream (Debezium CDC)"
  - source: "Relational Data Store"
    destination: "Read Replica"
    description: "PostgreSQL Streaming Replication [TCP/TLS]"
  - source: "Relational Data Store"
    destination: "Backup & Snapshot Manager"
    description: "Internal AWS Storage API over TLS"
  - source: "Audit & Security Monitor"
    destination: "File Storage Container"
    description: "HTTPS / S3 API"