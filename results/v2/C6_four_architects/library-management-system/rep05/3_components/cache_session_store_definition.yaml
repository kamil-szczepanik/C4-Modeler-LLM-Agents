level: component
scope: "Component diagram for the Cache / Session Store container"
parentContainer:
  name: "Cache / Session Store"
elements:
  - type: "component"
    name: "Session Store Component"
    technology: "AWS ElastiCache for Redis 7.x"
    description: "Manages active user authentication tokens and TTL-expiring keys."
  - type: "component"
    name: "Hot Data Cache Component"
    technology: "AWS ElastiCache for Redis 7.x with volatile-lru eviction policy"
    description: "Caches frequent catalogue queries using a volatile-lru eviction policy."
  - type: "component"
    name: "Distributed Lock Component"
    technology: "AWS ElastiCache for Redis 7.x"
    description: "Coordinates concurrency for circulation checkouts."
relationships:
  - source: "API Gateway"
    destination: "Session Store Component"
    description: "Validates active user sessions using RESP3 over TLS 1.3 with IAM authentication."
  - source: "Core Services Container"
    destination: "Hot Data Cache Component"
    description: "Queries and invalidates cached catalogue data using RESP3 over TLS 1.3."
  - source: "Core Services Container"
    destination: "Distributed Lock Component"
    description: "Acquires and releases concurrency locks using RESP3 over TLS 1.3."