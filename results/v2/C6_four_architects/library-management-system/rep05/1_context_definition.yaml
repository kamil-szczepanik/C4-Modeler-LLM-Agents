level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A cloud platform for public and academic libraries to catalogue physical and digital items, manage circulation, and provide self-service portals with strict EU-only data residency and sub-800ms search performance SLAs."
elements:
  - type: "person"
    name: "Library Patrons and Staff"
    description: "Users who interact with the library system via frontend SPA or mobile apps to catalogue items, manage circulation, and use self-service portals."
  - type: "externalSystem"
    name: "Stripe EU"
    description: "External payment gateway used for handling transactions."
  - type: "externalSystem"
    name: "LDAP/SAML IdP"
    description: "External identity provider for authentication and authorization."
  - type: "externalSystem"
    name: "AWS S3 EU-Central"
    description: "External cloud storage for securing digital catalog asset storage within EU boundaries."
  - type: "externalSystem"
    name: "University SIS"
    description: "University Student Information System integrating via SFTP/HTTPS."
  - type: "externalSystem"
    name: "Third-Party Delivery"
    description: "External delivery service for tracking and handling item logistics."
  - type: "externalSystem"
    name: "RFID Gates"
    description: "External hardware gates interacting with the library management system."
relationships:
  - source: "Library Patrons and Staff"
    destination: "Library Management System"
    description: "Interacts via Frontend SPA and Mobile App"
    technology: "HTTPS"
  - source: "University SIS"
    destination: "Library Management System"
    description: "Syncs student and academic data"
    technology: "SFTP/HTTPS"
  - source: "Library Management System"
    destination: "Stripe EU"
    description: "Processes payments"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "AWS S3 EU-Central"
    description: "Stores digital catalog assets securely within EU"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "Third-Party Delivery"
    description: "Manages physical item delivery logistics"
    technology: "HTTPS/REST"