level: component
scope: "Component diagram for the API Gateway Container container"
parentContainer:
  name: "API Gateway Container"
elements:
  - type: "component"
    name: "Routing & Proxy Engine"
    technology: "Kong Gateway Routing Core"
    description: "Handles edge routing, proxying frontend traffic, and forwarding validated requests."
  - type: "component"
    name: "Auth Plugin"
    technology: "Kong JWT/OAuth2 Plugin"
    description: "Validates OAuth2/OIDC tokens and performs JWT revocation checks."
  - type: "component"
    name: "Rate Limiting Plugin"
    technology: "Kong Rate Limiting Plugin"
    description: "Performs fast distributed rate-limiting using Redis."
  - type: "component"
    name: "Request Transformation Plugin"
    technology: "Kong Request Transformation Plugin"
    description: "Modifies incoming and outgoing request payloads and headers."
  - type: "component"
    name: "Telemetry & Tracing Component"
    technology: "OpenTelemetry"
    description: "Handles telemetry, distributed tracing, and P99 latency monitoring."
  - type: "component"
    name: "IP Geolocation & Geo-Fencing Plugin"
    technology: "Kong Geo-IP Plugin"
    description: "Enforces strict EU-only data residency and geo-fencing policies."
relationships:
  - source: "Routing & Proxy Engine"
    destination: "Auth Plugin"
    description: "Passes requests for token validation"
  - source: "Auth Plugin"
    destination: "Rate Limiting Plugin"
    description: "Passes authenticated requests for rate limiting"
  - source: "Rate Limiting Plugin"
    destination: "Request Transformation Plugin"
    description: "Passes rate-limited requests for transformation"
  - source: "Request Transformation Plugin"
    destination: "Routing & Proxy Engine"
    description: "Returns transformed requests for downstream routing"
  - source: "Routing & Proxy Engine"
    destination: "Telemetry & Tracing Component"
    description: "Reports telemetry and tracing data"
  - source: "IP Geolocation & Geo-Fencing Plugin"
    destination: "Routing & Proxy Engine"
    description: "Enforces geo-fencing on incoming requests"