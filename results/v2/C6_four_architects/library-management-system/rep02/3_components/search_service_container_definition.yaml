level: component
scope: "Component diagram for the Search Service Container container"
parentContainer:
  name: "Search Service Container"
elements:
  - type: "component"
    name: "Search API Router"
    technology: "FastAPI / Python"
    description: "Handles search API routing with an integrated Query Sanitizer for lightweight, high-performance REST routing."
  - type: "component"
    name: "Query Translator"
    technology: "Elasticsearch DSL / Python"
    description: "Passes validated query parameters and translates them into execution-ready search DSL."
  - type: "component"
    name: "Search Index Engine"
    technology: "OpenSearch"
    description: "Executes query DSL and performs bulk upserts, enforcing EU-only primary and replica shard placement."
  - type: "component"
    name: "Index Synchronization Consumer"
    technology: "Kafka Consumer / Python"
    description: "Streams catalog mutation events and performs idempotent bulk upserts to the search index."
  - type: "component"
    name: "Redis Cache Container"
    technology: "Redis"
    description: "System-level Redis cache used to check and store frequent query results."
  - type: "component"
    name: "API Gateway Container"
    technology: "Gateway"
    description: "External container that forwards search queries via HTTP/JSON over TLS."
  - type: "component"
    name: "Event Broker Container"
    technology: "Apache Kafka"
    description: "External container that streams catalog mutation events."
relationships:
  - source: "API Gateway Container"
    destination: "Search API Router"
    description: "Forwards search queries [HTTP/JSON over TLS]"
  - source: "Search API Router"
    destination: "Redis Cache Container"
    description: "Checks and stores frequent query results [Redis TCP over TLS]"
  - source: "Search API Router"
    destination: "Query Translator"
    description: "Passes validated query parameters [In-process]"
  - source: "Query Translator"
    destination: "Search Index Engine"
    description: "Executes query DSL on cache miss [REST/JSON over HTTP]"
  - source: "Event Broker Container"
    destination: "Index Synchronization Consumer"
    description: "Streams catalog mutation events [Apache Kafka TCP over TLS]"
  - source: "Index Synchronization Consumer"
    destination: "Search Index Engine"
    description: "Performs idempotent bulk upserts [REST/JSON over HTTP]"