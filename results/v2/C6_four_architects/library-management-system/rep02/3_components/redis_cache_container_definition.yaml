level: component
scope: "Component diagram for the Redis Cache Container container"
parentContainer:
  name: "Redis Cache Container"
elements:
  - type: "component"
    name: "In-Memory Data Store Engine (Redis Core)"
    technology: "Redis"
    description: "Manages key-value and sorted-set structures."
  - type: "component"
    name: "Cache Eviction & Expiry Manager"
    technology: "Redis Engine"
    description: "Enforces TTL policies and LRU eviction algorithms."
  - type: "component"
    name: "Persistence & Snapshot Manager (RDB/AOF)"
    technology: "RDB/AOF"
    description: "Handles point-in-time data durability."
  - type: "component"
    name: "TLS Termination & Security Manager"
    technology: "TLS/TCP"
    description: "Secures transport-layer encryption and authentication."
  - type: "component"
    name: "Pub/Sub Messaging Module"
    technology: "Redis Pub/Sub"
    description: "Manages lightweight event channels for cache invalidation."
  - type: "component"
    name: "Replication & High Availability Manager"
    technology: "Redis Sentinel/Clustering"
    description: "Handles master-replica synchronization and failover."
  - type: "component"
    name: "Core Services Container"
    technology: "Service Layer"
    description: "External container sending queries and invalidation triggers."
relationships:
  - source: "Core Services Container"
    destination: "TLS Termination & Security Manager"
    description: "Securely transmits cache queries [RESP over TLS/TCP]"
  - source: "Core Services Container"
    destination: "Pub/Sub Messaging Module"
    description: "Publishes and subscribes to cache invalidation triggers [RESP over TLS/TCP]"
  - source: "Cache Eviction & Expiry Manager"
    destination: "In-Memory Data Store Engine (Redis Core)"
    description: "Clears expired cache entries [Internal]"
  - source: "Replication & High Availability Manager"
    destination: "In-Memory Data Store Engine (Redis Core)"
    description: "Synchronizes state between instances [RESP replication stream]"