level: component
scope: "Component diagram for the Background Worker Container container"
parentContainer:
  name: "Background Worker Container"
elements:
  - type: "component"
    name: "Task Router"
    technology: "Python / Celery Task Dispatcher"
    description: "Routes messages from the Event Broker."
  - type: "component"
    name: "Notification Processor"
    technology: "Python / Celery"
    description: "Handles asynchronous dispatch of emails and push alerts."
  - type: "component"
    name: "Catalog Synchronization Engine"
    technology: "Python / Celery"
    description: "Manages batch updates to search and database containers."
  - type: "component"
    name: "ILL & Registry Integrator"
    technology: "Python / Celery"
    description: "Executes scheduled polling with external library systems."
  - type: "component"
    name: "Data Purge & Archival Worker"
    technology: "Python / Celery"
    description: "Executes scheduled maintenance and lifecycle tasks."
  - type: "component"
    name: "Task Telemetry & DLQ Handler"
    technology: "Python / Celery / Prometheus Python Client"
    description: "Manages failed jobs, Dead Letter Queues, and Prometheus metrics."
relationships:
  - source: "Core Services Container"
    destination: "Task Router"
    description: "Dispatches async jobs [AMQP / Celery protocol via Apache Kafka EU-hosted]"
  - source: "Notification Processor"
    destination: "SendGrid EU"
    description: "Dispatches notifications [HTTPS REST API]"
  - source: "Catalog Synchronization Engine"
    destination: "OpenSearch & PostgreSQL EU"
    description: "Bulk indexing and state reconciliation [REST/Transport TCP and PostgreSQL wire protocol over TLS]"
  - source: "ILL & Registry Integrator"
    destination: "National Library Registry & ILL Network"
    description: "Data synchronization [HTTPS]"
  - source: "Data Purge & Archival Worker"
    destination: "Digital Asset Storage Container"
    description: "Offloads expired media [S3 API over HTTPS]"
  - source: "Task Telemetry & DLQ Handler"
    destination: "Redis Cache Container"
    description: "Persists retry states [Redis Protocol over TLS]"