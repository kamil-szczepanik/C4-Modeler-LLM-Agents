    description: "Dispatches asynchronous background jobs [Kafka Protocol over TLS]"
  - source: "Stream Processing / Consumer Group Manager"
    destination: "DLQ Manager"
    description: "Routes failed messages after max retry exhaustion [Internal Kafka routing]"
  - source: "DLQ Manager"
    destination: "Background Worker Container"
    description: "Forwards failed events for manual inspection [Kafka Protocol over TLS]"
  - source: "Stream Processing / Consumer Group Manager"
    destination: "Broker Metrics & Health Monitor"
