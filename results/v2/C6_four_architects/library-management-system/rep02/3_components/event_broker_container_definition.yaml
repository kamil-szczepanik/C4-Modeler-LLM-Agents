  - source: "Access Control & mTLS Gateway"
    destination: "Event Ingestion Engine"
    description: "Forwards authorized message streams [Internal TCP]"
  - source: "Event Ingestion Engine"
    destination: "Topic Routing & Schema Registry"
    description: "Validates event schemas [HTTP/REST over TLS]"
