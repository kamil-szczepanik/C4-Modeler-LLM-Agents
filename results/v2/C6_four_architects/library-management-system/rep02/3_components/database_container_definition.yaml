level: component
scope: "Component diagram for the Database Container container"
parentContainer:
  name: "Database Container"
elements:
  - type: "component"
    name: "Relational Engine"
    technology: "PostgreSQL 16 EU region"
    description: "Core relational storage for ACID transactions."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Connection pooling to meet <800ms performance target."
  - type: "component"
    name: "Data Residency Enforcer (RLS)"
    technology: "Row-Level Security (RLS)"
    description: "Native enforcement of EU-only data compliance."
  - type: "component"
    name: "Audit Logging & Encryption Manager"
    technology: "AES-256 & LUKS"
    description: "Data at rest encryption and audit logging."
  - type: "component"
    name: "Backup & PITR Agent"
    technology: "Storage API / WAL streaming"
    description: "Handles backups and point-in-time recovery."
  - type: "component"
    name: "Query Optimization & Monitoring Subsystem"
    technology: "pg_stat_statements"
    description: "Query optimization and performance monitoring."
relationships:
  - source: "Core Services Container"
    destination: "PgBouncer"
    description: "SQL over TCP / TLS 1.3"
  - source: "PgBouncer"
    destination: "Relational Engine"
    description: "Local Unix Domain Socket / TCP"
  - source: "Relational Engine"
    destination: "Data Residency Enforcer (RLS)"
    description: "Internal database hooks and policies"
  - source: "Relational Engine"
    destination: "Audit Logging & Encryption Manager"
    description: "Filesystem API via Internal DB triggers / OS-level encryption (LUKS)"
  - source: "Relational Engine"
    destination: "Backup & PITR Agent"
    description: "Storage API via WAL streaming / Local file system"
  - source: "Relational Engine"
    destination: "Query Optimization & Monitoring Subsystem"
    description: "Shared Memory via Internal Extension Hooks"