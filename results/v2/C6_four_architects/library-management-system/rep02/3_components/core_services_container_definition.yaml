level: component
scope: "Component diagram for the Core Services Container container"
parentContainer:
  name: "Core Services Container"
elements:
  - type: "component"
    name: "CatalogueComponent"
    technology: "Spring Data JPA"
    description: "Managing physical and digital items (R-01)."
  - type: "component"
    name: "CirculationComponent"
    technology: "Java / Spring Boot"
    description: "Handling lending and circulation workflows."
  - type: "component"
    name: "SearchSyncComponent"
    technology: "Spring Event Listener"
    description: "Synchronizing search indexes."
  - type: "component"
    name: "CacheManagerComponent"
    technology: "Spring Data Redis"
    description: "Spring Data Redis component for metadata caching."
  - type: "component"
    name: "DigitalAssetComponent"
    technology: "Java / Spring Boot"
    description: "Managing digital asset references and storage URLs."
  - type: "component"
    name: "IdentityAdapter"
    technology: "Spring Security OAuth2 Client"
    description: "JWT validation."
  - type: "component"
    name: "PaymentAdapter"
    technology: "Spring Cloud OpenFeign"
    description: "Stripe EU integration for processing fines."
  - type: "component"
    name: "NotificationAdapter"
    technology: "Java / Spring Boot"
    description: "Adapter for SendGrid EU notifications."
  - type: "component"
    name: "IllNetworkAdapter"
    technology: "Spring RestClient"
    description: "Interlibrary Loan Network integration."
relationships:
  - source: "API Gateway Container"
    destination: "IdentityAdapter"
    description: "Forwards requests with bearer tokens [gRPC]"
  - source: "API Gateway Container"
    destination: "CatalogueComponent"
    description: "Forwards validated requests [gRPC]"
  - source: "CatalogueComponent"
    destination: "Database Container"
    description: "Executes queries [SQL over TCP]"
  - source: "CatalogueComponent"
    destination: "CacheManagerComponent"
    description: "Reads/writes cache [RESP over TCP]"
  - source: "CacheManagerComponent"
    destination: "Redis Cache Container"
    description: "Executes caching commands [RESP over TCP]"
  - source: "SearchSyncComponent"
    destination: "Search Service Container"
    description: "Updates indexes [HTTP/REST over TLS]"
  - source: "CatalogueComponent"
    destination: "Event Broker Container"
    description: "Publishes domain events [Kafka Protocol over TLS]"
  - source: "DigitalAssetComponent"
    destination: "Digital Asset Storage Container"
    description: "Requests pre-signed URLs [HTTPS/REST S3 API]"
  - source: "PaymentAdapter"
    destination: "Stripe EU"
    description: "Processes fines [HTTPS/REST]"
  - source: "NotificationAdapter"
    destination: "SendGrid EU"
    description: "Sends alerts [HTTPS/REST]"
  - source: "CirculationComponent"
    destination: "IllNetworkAdapter"
    description: "Coordinates loans [HTTPS/REST]"