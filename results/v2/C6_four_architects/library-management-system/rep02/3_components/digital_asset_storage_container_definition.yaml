# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Digital Asset Storage Container container"
parentContainer:
  name: "Digital Asset Storage Container"
elements:
  - type: "component"
    name: "Object Storage Engine"
    technology: "MinIO Server / MinIO Go binary"
    description: "Handles distributed disk persistence, erasure coding, and read/write I/O streams."
  - type: "component"
    name: "Access Control & Policy Manager"
    technology: "MinIO IAM / Open Policy Agent (OPA)"
    description: "Enforces bucket policies, IAM, validates permissions, and issues pre-signed URLs."
  - type: "component"
    name: "Encryption Service"
    technology: "EU-hosted KMS / PKCS#11 / AES-256"
    description: "Enforces AES-256 encryption-at-rest for all digital assets."
  - type: "component"
    name: "Lifecycle & Replication Worker"
    technology: "MinIO Lifecycle Management"
    description: "Applies retention rules, automated tiering, WORM compliance, and sweeps expired objects."
  - type: "component"
    name: "Audit & Telemetry Logger"
    technology: "FluentBit / Prometheus"
    description: "Captures and emits security events, access logs, audit trails, and performance metrics."
  - type: "component"
    name: "Core Services Container"
    technology: "Microservice Container"
    description: "External core service interacting with the storage container."
relationships:
  - source: "Core Services Container"
    destination: "Access Control & Policy Manager"
    description: "Requests pre-signed URLs and validates permissions via [HTTPS/REST (S3 API)]"
  - source: "Access Control & Policy Manager"
    destination: "Object Storage Engine"
    description: "Dispatches authorized read/write I/O streams"
  - source: "Object Storage Engine"
    destination: "Encryption Service"
    description: "Enforces AES-256 encryption-at-rest via [EU-hosted KMS / PKCS#11/HTTPS]"
  - source: "Lifecycle & Replication Worker"
    destination: "Object Storage Engine"
    description: "Applies retention rules and sweeps expired objects"
  - source: "Access Control & Policy Manager"
    destination: "Audit & Telemetry Logger"
    description: "Emits security events via [Local IPC / Syslog]"
  - source: "Object Storage Engine"
    destination: "Audit & Telemetry Logger"
    description: "Reports metrics via [Prometheus metrics scrape]"