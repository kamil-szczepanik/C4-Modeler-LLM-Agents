level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patron"
    description: "End-user accessing self-service portals to borrow items and manage their account."
  - type: "person"
    name: "Librarian / Staff"
    description: "Internal user managing cataloging, inventory, and circulation."
  - type: "externalSystem"
    name: "Stripe EU"
    description: "Payment Gateway for processing fines and fees."
  - type: "externalSystem"
    name: "SendGrid EU"
    description: "Notification Service for sending patron emails and alerts."
  - type: "externalSystem"
    name: "EU Identity Provider"
    description: "OIDC/Keycloak/Auth0 provider for authentication and authorization."
  - type: "externalSystem"
    name: "National Library Registry"
    description: "External registry for bibliographic data exchange via OAI-PMH."
  - type: "externalSystem"
    name: "Interlibrary Loan (ILL) Network"
    description: "Network for sharing library resources across institutions via ISO 18626."
  - type: "container"
    name: "Web Application Container"
    technology: "React/TypeScript, Nginx"
    description: "Frontend Single Page Application providing self-service portals and user interfaces."
  - type: "container"
    name: "API Gateway Container"
    technology: "Kong/Envoy"
    description: "Handles edge routing, SSL termination, and JWT auth validation."
  - type: "container"
    name: "Core Services Container"
    technology: "Java/Spring Boot"
    description: "Core business logic container for cataloguing and circulation."
  - type: "container"
    name: "Search Service Container"
    technology: "Elasticsearch/OpenSearch"
    description: "Dedicated search index ensuring R-05 sub-800ms performance."
  - type: "container"
    name: "Database Container"
    technology: "PostgreSQL EU region"
    description: "Primary transactional store with strict EU data residency enforcement."
  - type: "container"
    name: "Redis Cache Container"
    technology: "Redis"
    description: "In-memory cache for catalogue metadata acceleration."
  - type: "container"
    name: "Background Worker Container"
    technology: "Python/Celery"
    description: "Handles asynchronous background tasks."
  - type: "container"
    name: "Event Broker Container"
    technology: "Apache Kafka EU-hosted"
    description: "Event streaming platform with TLS for decoupled, asynchronous messaging."
  - type: "container"
    name: "Digital Asset Storage Container"
    technology: "MinIO / S3-compatible Object Storage"
    description: "EU-hosted binary storage for digital assets (PDFs, e-books)."
relationships:
  - source: "Library Patron"
    destination: "Web Application Container"
    description: "Accesses self-service portals and manages account"
    technology: "HTTPS/REST and WebSockets"
  - source: "Librarian / Staff"
    destination: "Web Application Container"
    description: "Manages cataloging and circulation operations"
    technology: "HTTPS/REST and WebSockets"
  - source: "Web Application Container"
    destination: "API Gateway Container"
    description: "Routes frontend requests to backend services"
    technology: "HTTPS/REST and WebSockets"
  - source: "API Gateway Container"
    destination: "Core Services Container"
    description: "Forwards validated requests to core business logic"
    technology: "gRPC"
  - source: "Core Services Container"
    destination: "Search Service Container"
    description: "Performs event-driven index updates"
    technology: "Apache Kafka TCP protocol over TLS"
  - source: "Core Services Container"
    destination: "Database Container"
    description: "Executes transactional queries with EU data residency"
    technology: "SQL over TCP"
  - source: "Core Services Container"
    destination: "Redis Cache Container"
    description: "Caches catalogue metadata for acceleration"
    technology: "RESP over TCP"
  - source: "Core Services Container"
    destination: "Event Broker Container"
    description: "Publishes and consumes domain events"
    technology: "Kafka Protocol over TLS"
  - source: "Core Services Container"
    destination: "Background Worker Container"
    description: "Delegates asynchronous tasks"
    technology: "AMQP via RabbitMQ"
  - source: "Core Services Container"
    destination: "Digital Asset Storage Container"
    description: "Accesses digital assets using pre-signed URLs"
    technology: "HTTPS/REST (S3 API)"
  - source: "Core Services Container"
    destination: "Stripe EU"
    description: "Processes payments for fines and fees"
    technology: "HTTPS/REST"
  - source: "Core Services Container"
    destination: "SendGrid EU"
    description: "Sends notifications and alerts to patrons"
    technology: "HTTPS/REST"
  - source: "Core Services Container"
    destination: "EU Identity Provider"
    description: "Validates authentication and authorization"
    technology: "HTTPS/REST"
  - source: "Core Services Container"
    destination: "National Library Registry"
    description: "Synchronizes catalog metadata"
    technology: "HTTPS/REST"
  - source: "Core Services Container"
    destination: "Interlibrary Loan (ILL) Network"
    description: "Coordinates interlibrary loans"
    technology: "HTTPS/REST"