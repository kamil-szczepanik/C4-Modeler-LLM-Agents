level: container
scope: "Container diagram for Library Management System (LMS)"
system:
  name: "Library Management System (LMS)"
elements:
  - type: "person"
    name: "Patron & Librarian / Staff"
    description: "End-users accessing the platform for self-service portals, item cataloging, and circulation management."
  - type: "externalSystem"
    name: "EU-Tenant Identity Provider (IdP)"
    description: "External system for authentication, identity management, and JWT validation restricted to EU endpoints."
  - type: "externalSystem"
    name: "EU-Hosted Payment Gateway"
    description: "External system for processing financial transactions securely within EU residency constraints."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External system for sending communications and notifications."
  - type: "externalSystem"
    name: "Digital Content Repository / DRM Provider"
    description: "External system providing digital content and DRM services."
  - type: "container"
    name: "Web Application (SPA)"
    technology: "React, Nginx"
    description: "Provides responsive user interfaces for patrons and staff."
  - type: "container"
    name: "API Gateway"
    technology: "Spring Cloud Gateway, Java"
    description: "Handles request routing, rate limiting, and JWT validation via EU-IdP."
  - type: "container"
    name: "Core Domain Service"
    technology: "Spring Boot, Java"
    description: "Powers core cataloging, business logic, and circulation management."
  - type: "container"
    name: "Search Service"
    technology: "OpenSearch"
    description: "Dedicated search index ensuring sub-800ms search responses."
  - type: "container"
    name: "Notification & Payment Worker / DRM Worker"
    technology: "Python, Celery"
    description: "Isolates and handles external third-party integrations for payments, notifications, and DRM."
  - type: "container"
    name: "Message Broker"
    technology: "Apache Kafka"
    description: "Manages decoupled, replayable domain event synchronization."
  - type: "container"
    name: "Caching Layer"
    technology: "Redis"
    description: "Provides distributed rate limiting and hot item caching."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL"
    description: "Ensures transactional integrity within EU data residency constraints."
relationships:
  - source: "Patron & Librarian / Staff"
    destination: "Web Application (SPA)"
    description: "Accesses user interfaces"
    technology: "HTTPS"
  - source: "Web Application (SPA)"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "Core Domain Service"
    description: "Routes domain requests"
    technology: "REST/TLS"
  - source: "API Gateway"
    destination: "Search Service"
    description: "Routes search queries"
    technology: "REST/TLS"
  - source: "API Gateway & Core Services"
    destination: "Caching Layer"
    description: "Reads and writes cache and rate limits"
    technology: "TCP"
  - source: "Core Domain Service"
    destination: "Database"
    description: "Persists domain data"
    technology: "JDBC"
  - source: "Core Domain Service"
    destination: "Message Broker"
    description: "Publishes domain events"
    technology: "Apache Kafka"
  - source: "Message Broker"
    destination: "Search Service"
    description: "Consumes events to update search index"
    technology: "Apache Kafka"
  - source: "Message Broker"
    destination: "Notification & Payment Worker / DRM Worker"
    description: "Consumes asynchronous task events"
    technology: "Apache Kafka"
  - source: "Notification & Payment Worker / DRM Worker"
    destination: "EU-Hosted Payment Gateway"
    description: "Processes payments and financial transactions"
    technology: "HTTPS"
  - source: "Notification & Payment Worker / DRM Worker"
    destination: "Notification Service"
    description: "Dispatches external notifications"
    technology: "HTTPS"
  - source: "Notification & Payment Worker / DRM Worker"
    destination: "Digital Content Repository / DRM Provider"
    description: "Manages digital content and DRM rights"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "EU-Tenant Identity Provider (IdP)"
    description: "Validates JWT tokens and authenticates users"
    technology: "REST/TLS"