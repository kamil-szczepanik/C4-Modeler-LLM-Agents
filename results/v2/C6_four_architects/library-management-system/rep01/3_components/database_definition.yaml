level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "PostgreSQL Database Container"
    technology: "PostgreSQL"
    description: "Core relational database management system."
  - type: "component"
    name: "Catalog Schema"
    technology: "PostgreSQL Schema (Relational Tables and JSONB)"
    description: "Manages physical and digital item metadata."
  - type: "component"
    name: "Circulation Schema"
    technology: "PostgreSQL Schema"
    description: "Manages patron loans, holds, and ACID transactions."
  - type: "component"
    name: "Audit Schema"
    technology: "PostgreSQL Schema (Partitioned Tables)"
    description: "Utilizes partitioned tables for GDPR compliance."
  - type: "component"
    name: "User Management Schema"
    technology: "PostgreSQL Schema (Row-Level Security)"
    description: "Manages patron profiles and staff roles with Row-Level Security (RLS)."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer (Transaction Pooling Mode)"
    description: "Connection pooler and proxy component."
  - type: "component"
    name: "Backup & Replication Manager"
    technology: "Barman and PostgreSQL Streaming Replication"
    description: "Ensures high availability and point-in-time recovery."
  - type: "component"
    name: "Database Audit & Encryption Manager"
    technology: "pgcrypto, pgaudit, TLS 1.3"
    description: "Enforces at-rest encryption and access logging."
  - type: "component"
    name: "Database Migration Component"
    technology: "Flyway"
    description: "Integrated into the Core Domain Service build pipeline for automated migrations."
  - type: "component"
    name: "Core Domain Service"
    technology: "Microservice"
    description: "Client application interacting with the database components."
  - type: "component"
    name: "Search Service (OpenSearch)"
    technology: "OpenSearch"
    description: "Handles text search offloaded from the core database."
  - type: "component"
    name: "Primary Node"
    technology: "PostgreSQL"
    description: "Primary database node streaming WAL data."
  - type: "component"
    name: "Standby Node"
    technology: "PostgreSQL"
    description: "Standby database node for high availability and continuous archiving."
relationships:
  - source: "Core Domain Service"
    destination: "PgBouncer"
    description: "Client queries via [TCP/PostgreSQL Wire Protocol] over [TLS 1.3]."
  - source: "PgBouncer"
    destination: "Catalog Schema"
    description: "Routed transactions via [TCP]."
  - source: "PgBouncer"
    destination: "Circulation Schema"
    description: "Routed transactions via [TCP]."
  - source: "PgBouncer"
    destination: "Audit Schema"
    description: "Routed transactions via [TCP]."
  - source: "PgBouncer"
    destination: "User Management Schema"
    description: "Routed transactions via [TCP]."
  - source: "Core Domain Service"
    destination: "Search Service (OpenSearch)"
    description: "Asynchronous index updates via [Apache Kafka]."
  - source: "Primary Node"
    destination: "Standby Node"
    description: "Continuous WAL archiving via [TCP/PostgreSQL Streaming Replication]."
  - source: "Database Migration Component"
    destination: "Catalog Schema"
    description: "Automated schema migrations via [JDBC]."