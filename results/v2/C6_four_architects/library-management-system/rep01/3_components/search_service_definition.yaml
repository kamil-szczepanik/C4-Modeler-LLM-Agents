level: component
scope: "Component diagram for the Search Service container"
parentContainer:
  name: "Search Service"
elements:
  - type: "component"
    name: "Query Parser & Router"
    technology: "Java"
    description: "Parses and routes search requests."
  - type: "component"
    name: "Tenant Security Context Filter"
    technology: "Java"
    description: "Validates tenant context for security and compliance."
  - type: "component"
    name: "Index Synchronization Worker"
    technology: "Java"
    description: "Consumes catalogue events and applies index updates."
  - type: "component"
    name: "Search Analytics & Caching Interceptor"
    technology: "Redis"
    description: "Handles caching and analytics for frequent searches and facets."
  - type: "component"
    name: "Index Lifecycle Manager"
    technology: "OpenSearch ISM"
    description: "Manages tiering, retention, and EU-compliant backups."
relationships:
  - source: "API Gateway"
    destination: "Query Parser & Router"
    description: "Forwards search requests [REST/TLS]"
  - source: "Message Broker"
    destination: "Index Synchronization Worker"
    description: "Consumes catalogue events [Apache Kafka]"
  - source: "Query Parser & Router"
    destination: "Search Analytics & Caching Interceptor"
    description: "Checks cache [RESP/TCP]"
  - source: "Query Parser & Router"
    destination: "Tenant Security Context Filter"
    description: "Validates tenant context [In-process]"
  - source: "Tenant Security Context Filter"
    destination: "Query Parser & Router"
    description: "Passes validated context [In-process]"
  - source: "Query Parser & Router"
    destination: "OpenSearch Cluster"
    description: "Executes queries [OpenSearch REST/HTTPs]"
  - source: "Index Synchronization Worker"
    destination: "OpenSearch Cluster"
    description: "Applies index updates [OpenSearch REST/HTTPs]"
  - source: "Index Lifecycle Manager"
    destination: "OpenSearch Indices"
    description: "Manages tiering and retention [OpenSearch REST API]"