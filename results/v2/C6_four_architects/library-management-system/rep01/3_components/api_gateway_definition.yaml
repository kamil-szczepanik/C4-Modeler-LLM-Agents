level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "SSL/TLS Termination"
    technology: "Netty"
    description: "Handles SSL/TLS termination for secure EU-compliant transport."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Spring Security"
    description: "Enforces authentication and RBAC validation."
  - type: "component"
    name: "Routing & Load Balancing Filter"
    technology: "Spring Cloud Gateway, Java"
    description: "Powers the API Gateway routing and filtering mechanisms."
  - type: "component"
    name: "Rate Limiting Filter"
    technology: "Bucket4j, Redis"
    description: "Implements distributed rate limiting for traffic protection."
  - type: "component"
    name: "Response Caching Component"
    technology: "Caffeine, Redis"
    description: "Delivers edge response caching for sub-800ms search performance."
  - type: "component"
    name: "API Analytics & Telemetry Filter"
    technology: "OpenTelemetry"
    description: "Collects metrics and traces for EU-hosted monitoring."
relationships:
  - source: "Web Application (SPA)"
    destination: "SSL/TLS Termination"
    description: "Initiates secure connection [HTTPS/TLS 1.3]"
  - source: "Authentication & Authorization Filter"
    destination: "EU-Tenant Identity Provider (IdP)"
    description: "Validates tokens [REST/TLS]"
  - source: "Routing & Load Balancing Filter"
    destination: "Core Domain Service"
    description: "Forwards validated requests [REST/TLS]"
  - source: "Routing & Load Balancing Filter"
    destination: "Search Service"
    description: "Forwards search queries under 800ms SLA [REST/TLS]"
  - source: "Rate Limiting Filter"
    destination: "Caching Layer (Redis)"
    description: "Reads/writes rate limit counters [TCP/Redis Protocol]"
  - source: "Response Caching Component"
    destination: "Caching Layer (Redis)"
    description: "Retrieves cached catalogue payloads [TCP/Redis Protocol]"
  - source: "API Analytics & Telemetry Filter"
    destination: "EU-Hosted Monitoring Backend"
    description: "Exports tracing and metrics [OTLP/gRPC]"