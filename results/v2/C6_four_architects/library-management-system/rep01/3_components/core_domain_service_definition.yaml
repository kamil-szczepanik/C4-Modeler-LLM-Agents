level: component
scope: "Component diagram for the Core Domain Service container"
parentContainer:
  name: "Core Domain Service"
elements:
  - type: "component"
    name: "Catalog Management Component"
    technology: "Spring @Service, Java"
    description: "Handles cataloging workflows for physical and digital items."
  - type: "component"
    name: "Circulation Workflow Component"
    technology: "Spring @Service, Java"
    description: "Manages circulation and borrowing workflows."
  - type: "component"
    name: "Domain Event Publisher"
    technology: "Spring Event / Kafka Template, Java"
    description: "Publishes domain events asynchronously."
  - type: "component"
    name: "Patron Account & Policy Engine Component"
    technology: "Spring @Service, Java"
    description: "Enforces patron account rules and circulation policies."
  - type: "component"
    name: "Search Integration Facade"
    technology: "Spring @Component, Java"
    description: "Provides integration interfaces for search indexing."
  - type: "component"
    name: "Data Governance & Audit Interceptor"
    technology: "Spring @Aspect, Java"
    description: "Intercepts operations for GDPR compliance and data residency."
  - type: "component"
    name: "Domain Health & Metrics Actuator"
    technology: "Spring Boot Actuator, Java"
    description: "Exposes internal health probes and metrics."
relationships:
  - source: "API Gateway"
    destination: "Catalog Management Component"
    description: "REST/TLS (JSON payloads)"
  - source: "API Gateway"
    destination: "Circulation Workflow Component"
    description: "REST/TLS (JSON payloads)"
  - source: "Catalog Management Component"
    destination: "Database"
    description: "JDBC over SSL via HikariCP"
  - source: "Circulation Workflow Component"
    destination: "Database"
    description: "JDBC over SSL via HikariCP"
  - source: "Catalog Management Component"
    destination: "Search Integration Facade"
    description: "Synchronous Spring ApplicationEvent (in-memory)"
  - source: "Circulation Workflow Component"
    destination: "Patron Account & Policy Engine Component"
    description: "In-memory Java method call"
  - source: "Catalog Management Component"
    destination: "Data Governance & Audit Interceptor"
    description: "In-memory AOP method invocation"
  - source: "Circulation Workflow Component"
    destination: "Data Governance & Audit Interceptor"
    description: "In-memory AOP method invocation"
  - source: "Domain Event Publisher"
    destination: "Message Broker"
    description: "Apache Kafka (TCP, TLS-encrypted)"
  - source: "Search Integration Facade"
    destination: "Message Broker"
    description: "Apache Kafka (TCP, TLS-encrypted)"
  - source: "Kubernetes Platform Monitor"
    destination: "Domain Health & Metrics Actuator"
    description: "Prometheus scraping / HTTP (TLS)"