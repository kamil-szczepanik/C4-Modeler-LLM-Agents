level: component
scope: "Component diagram for the Web Application (SPA) container"
parentContainer:
  name: "Web Application (SPA)"
elements:
  - type: "component"
    name: "Router & State Management"
    technology: "React Router, Zustand/Redux Toolkit"
    description: "Handles client-side routing and global application state within the single-page application."
  - type: "component"
    name: "API Client"
    technology: "Axios, oidc-client-ts"
    description: "Manages HTTP requests to the API Gateway and handles OIDC/OAuth2 authentication flows."
  - type: "component"
    name: "UI Presentation Layer"
    technology: "React, Nginx"
    description: "Renders the user interface components for patrons and librarians while ensuring EU data residency."
relationships:
  - source: "UI Presentation Layer"
    destination: "Router & State Management"
    description: "Triggers navigation and state updates"
  - source: "Router & State Management"
    destination: "API Client"
    description: "Initiates authenticated API calls"
  - source: "API Client"
    destination: "API Gateway"
    description: "Sends API requests via [HTTPS/REST]"