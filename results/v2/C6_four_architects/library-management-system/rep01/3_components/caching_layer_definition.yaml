level: component
scope: "Component diagram for the Caching Layer container"
parentContainer:
  name: "Caching Layer"
elements:
  - type: "component"
    name: "Cache Manager"
    technology: "Redis Core"
    description: "Stores hot catalogue items and patron session states in-memory."
  - type: "component"
    name: "Rate Limiter"
    technology: "Redis Module"
    description: "Enforces distributed rate limits for the API Gateway."
  - type: "component"
    name: "Cache Invalidation Listener"
    technology: "Redis Pub/Sub Subscriber"
    description: "Purges stale catalogue entries upon receiving updates."
  - type: "component"
    name: "Distributed Lock Manager"
    technology: "Redis Redlock / SETNX"
    description: "Prevents cache stampedes during sudden traffic spikes."
relationships:
  - source: "API Gateway"
    destination: "Rate Limiter"
    description: "Evaluates rate limits using Redis EVAL [TCP/RESP]"
  - source: "Core Domain Service"
    destination: "Cache Manager"
    description: "Reads and writes hot items via cache-aside/write-through patterns [TCP/RESP]"
  - source: "Core Domain Service"
    destination: "Distributed Lock Manager"
    description: "Acquires and releases locks during cache miss re-population using atomic commands [TCP/RESP]"
  - source: "Apache Kafka"
    destination: "Cache Invalidation Listener"
    description: "Triggers cache eviction on data updates [TCP]"
  - source: "Cache Invalidation Listener"
    destination: "Cache Manager"
    description: "Executes internal DEL/UNLINK commands [In-Memory Function Call]"