level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Kafka Broker Engine"
    technology: "Apache Kafka (KRaft Mode)"
    description: "Eliminates ZooKeeper dependencies and handles event-driven decoupled communication."
  - type: "component"
    name: "Topic Manager"
    technology: "Apache Kafka"
    description: "Provisions partitioned event logs."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry"
    description: "Enforces payload contracts (Avro/JSON Schema) for backward compatibility."
  - type: "component"
    name: "Producer/Consumer Connection Manager"
    technology: "Apache Kafka"
    description: "Manages connections for producers and consumers."
  - type: "component"
    name: "Log Compaction & Storage Engine"
    technology: "Apache Kafka"
    description: "Persists and flushes event logs to local storage."
  - type: "component"
    name: "Partition Replicas Manager"
    technology: "Apache Kafka"
    description: "Synchronizes partition state and ISR."
  - type: "component"
    name: "Metrics & Health Exporter"
    technology: "Prometheus/HTTP"
    description: "Feeds internal broker telemetry and monitors consumer lag."
  - type: "component"
    name: "ACL Authorizer"
    technology: "Apache Kafka"
    description: "Validates topic-level produce/consume permissions."
relationships:
  - source: "Kafka Broker Engine"
    destination: "Topic Manager"
    description: "Provisions partitioned event logs [TCP]"
  - source: "Kafka Broker Engine"
    destination: "Schema Registry"
    description: "Caches and validates event schemas at runtime [HTTP/REST]"
  - source: "Kafka Broker Engine"
    destination: "Log Compaction & Storage Engine"
    description: "Persists and flushes event logs to local storage [POSIX I/O]"
  - source: "Kafka Broker Engine"
    destination: "Partition Replicas Manager"
    description: "Synchronizes partition state and ISR [TCP]"
  - source: "Kafka Broker Engine"
    destination: "Metrics & Health Exporter"
    description: "Feeds internal broker telemetry [In-memory]"
  - source: "Producer/Consumer Connection Manager"
    destination: "ACL Authorizer"
    description: "Validates topic-level produce/consume permissions [In-memory]"