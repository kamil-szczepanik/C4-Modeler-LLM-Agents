level: context
scope: "System Context diagram for Library Management System (LMS)"
system:
  name: "Library Management System (LMS)"
  description: "An enterprise solution for public and academic libraries to catalogue items, manage circulation, and provide self-service portals with strict EU-only data residency and high-performance search capabilities."
elements:
  - type: "person"
    name: "Patron (Public/Academic)"
    description: "End users who access self-service portals to search and borrow library items."
  - type: "person"
    name: "Librarian/Staff"
    description: "Internal staff who manage catalogue items and circulation processes."
  - type: "externalSystem"
    name: "EU-Tenant Identity Provider (IdP)"
    description: "External system for authentication and identity management restricted to EU endpoints."
  - type: "externalSystem"
    name: "EU-Hosted Payment Gateway"
    description: "External system for processing financial transactions restricted to EU endpoints."
  - type: "externalSystem"
    name: "Notification Service (Email/SMS)"
    description: "External system for sending communications and notifications restricted to EU endpoints."
  - type: "externalSystem"
    name: "Digital Content Repository / DRM Provider"
    description: "External system providing digital content and DRM services restricted to EU endpoints."
relationships:
  - source: "Patron (Public/Academic)"
    destination: "Library Management System (LMS)"
    description: "Accesses portals for self-service and circulation management"
    technology: "HTTPS (TLS 1.3)"
  - source: "Librarian/Staff"
    destination: "Library Management System (LMS)"
    description: "Manages library items and system operations"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Management System (LMS)"
    destination: "EU-Tenant Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "REST/HTTPS (TLS 1.3)"
  - source: "Library Management System (LMS)"
    destination: "EU-Hosted Payment Gateway"
    description: "Processes payments and fees"
    technology: "REST/HTTPS (TLS 1.3)"
  - source: "Library Management System (LMS)"
    destination: "Notification Service (Email/SMS)"
    description: "Sends notifications to users"
    technology: "REST/HTTPS (TLS 1.3)"
  - source: "Library Management System (LMS)"
    destination: "Digital Content Repository / DRM Provider"
    description: "Retrieves digital content and manages DRM"
    technology: "REST/HTTPS (TLS 1.3)"