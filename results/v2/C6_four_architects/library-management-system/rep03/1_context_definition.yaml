level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Provides cataloging, circulation, and self-service portals for public and academic libraries, operating entirely within EU-compliant cloud regions."
elements:
  - type: "person"
    name: "Library Patron"
    description: "A person who accesses the library portals for self-service."
  - type: "person"
    name: "Librarian"
    description: "A person who manages cataloging and circulation within the system."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Handles user authentication."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Processes fines securely."
  - type: "externalSystem"
    name: "Digital Content Provider"
    description: "Provides digital assets and content."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Sends reminders and notifications to users."
  - type: "externalSystem"
    name: "National Library Registry"
    description: "Integrates with national library data and records."
  - type: "externalSystem"
    name: "Physical Access Control System"
    description: "Controls physical access to library facilities."
relationships:
  - source: "Library Patron"
    destination: "Library Management System"
    description: "Accesses portals via HTTPS"
    technology: "HTTPS"
  - source: "Librarian"
    destination: "Library Management System"
    description: "Manages cataloging and circulation via portals"
    technology: "HTTPS"
  - source: "Library Management System"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OIDC/HTTPS"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Processes fines"
    technology: "REST/TLS"
  - source: "Library Management System"
    destination: "Notification Service"
    description: "Sends reminders"
    technology: "REST/TLS"