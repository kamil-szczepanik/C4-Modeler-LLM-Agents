level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer / TCP/IP"
    description: "Connection pooling layer managing database traffic to prevent exhaustion under peak loads."
  - type: "component"
    name: "Primary PostgreSQL Instance"
    technology: "PostgreSQL / TCP/IP"
    description: "Handles write workloads and transactional operations with robust ACID compliance."
  - type: "component"
    name: "Read Replica Instance"
    technology: "PostgreSQL / TCP/IP"
    description: "Handles read-heavy analytical traffic and receives asynchronous streaming replication."
  - type: "component"
    name: "Catalog & Circulation Schema"
    technology: "PostgreSQL Schema"
    description: "Stores items, loans, and patron data."
  - type: "component"
    name: "Audit & Reporting Schema"
    technology: "PostgreSQL Schema"
    description: "Stores historical data isolated from operational paths."
  - type: "component"
    name: "Full-Text Search Indexer & Triggers"
    technology: "Native Indexes / PostgreSQL Triggers / WAL"
    description: "Maintains real-time search synchronization via native indexes."
  - type: "component"
    name: "EU Data Residency Enforcer"
    technology: "Configuration and Row-Level Security"
    description: "Enforces geographic restrictions to ensure strict compliance with EU-only data constraints."
relationships:
  - source: "PgBouncer"
    destination: "Primary PostgreSQL Instance"
    description: "Routes and pools database connections via [TCP/IP]."
  - source: "Primary PostgreSQL Instance"
    destination: "Read Replica Instance"
    description: "Executes asynchronous streaming replication via [TCP/IP]."
  - source: "Catalog & Circulation Schema"
    destination: "Full-Text Search Indexer & Triggers"
    description: "Propagates internal events via [PostgreSQL Triggers/WAL]."