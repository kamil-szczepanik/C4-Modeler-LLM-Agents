level: component
scope: "Component diagram for the Core Domain Service container"
parentContainer:
  name: "Core Domain Service"
elements:
  - type: "component"
    name: "Integration Facade Component"
    technology: "Spring @Controller / @GrpcService"
    description: "Handles inbound transport from API Gateway using gRPC over TLS."
  - type: "component"
    name: "Catalog Management Component"
    technology: "Spring @Service"
    description: "Catalogues library items for public and academic libraries."
  - type: "component"
    name: "Circulation & Lending Engine"
    technology: "Spring @Service"
    description: "Manages circulation and lending, utilizing distributed cache for sub-millisecond validation."
  - type: "component"
    name: "Patron Account Manager"
    technology: "Spring @Service"
    description: "Manages patron accounts."
  - type: "component"
    name: "Search Integration Component"
    technology: "Spring @Service"
    description: "Integrates with Elasticsearch to meet high-performance search requirements."
  - type: "component"
    name: "Data Access Layer Component"
    technology: "Spring Data JPA"
    description: "Centralized database access enforcing strict EU data residency constraints."
  - type: "component"
    name: "Event Publisher/Consumer Component"
    technology: "Spring @Component"
    description: "Handles asynchronous event publishing and consumption via Apache Kafka."
  - type: "component"
    name: "API Gateway"
    technology: "Gateway"
    description: "External system routing requests to the Integration Facade."
  - type: "component"
    name: "PostgreSQL Database"
    technology: "PostgreSQL"
    description: "External database system storing core application data."
  - type: "component"
    name: "Elasticsearch Search Service"
    technology: "Elasticsearch"
    description: "External search service providing high-performance search capabilities."
  - type: "component"
    name: "Distributed Cache"
    technology: "Redis"
    description: "External distributed cache for sub-millisecond circulation validation."
  - type: "component"
    name: "Notification & Event Bus"
    technology: "Apache Kafka"
    description: "External event bus for asynchronous messaging."
relationships:
  - source: "API Gateway"
    destination: "Integration Facade Component"
    description: "gRPC over TLS"
  - source: "Integration Facade Component"
    destination: "Catalog Management Component"
    description: "In-memory Method Calls"
  - source: "Integration Facade Component"
    destination: "Circulation & Lending Engine"
    description: "In-memory Method Calls"
  - source: "Integration Facade Component"
    destination: "Patron Account Manager"
    description: "In-memory Method Calls"
  - source: "Integration Facade Component"
    destination: "Search Integration Component"
    description: "In-memory Method Calls"
  - source: "Catalog Management Component"
    destination: "Data Access Layer Component"
    description: "In-memory Method Calls"
  - source: "Circulation & Lending Engine"
    destination: "Data Access Layer Component"
    description: "In-memory Method Calls"
  - source: "Patron Account Manager"
    destination: "Data Access Layer Component"
    description: "In-memory Method Calls"
  - source: "Search Integration Component"
    destination: "Data Access Layer Component"
    description: "In-memory Method Calls"
  - source: "Data Access Layer Component"
    destination: "PostgreSQL Database"
    description: "JDBC"
  - source: "Search Integration Component"
    destination: "Elasticsearch Search Service"
    description: "HTTP/REST over TLS"
  - source: "Circulation & Lending Engine"
