level: component
scope: "Component diagram for the Async Worker container"
parentContainer:
  name: "Async Worker"
elements:
  - type: "component"
    name: "Kafka Event Consumer"
    technology: "confluent-kafka"
    description: "Consumes events from the Notification & Event Bus."
  - type: "component"
    name: "Task Router / Dispatcher"
    technology: "Celery Beat"
    description: "Routes and dispatches asynchronous tasks."
  - type: "component"
    name: "Payment Processor Handler"
    technology: "requests / httpx"
    description: "Handles external payment processing communications."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "httpx"
    description: "Dispatches notifications to external services."
  - type: "component"
    name: "Registry Sync Handler"
    technology: "httpx"
    description: "Synchronizes data with the National Library Registry."
  - type: "component"
    name: "Data Sync & Maintenance Processor"
    technology: "SQLAlchemy"
    description: "Performs database batch cleanups and data synchronization."
  - type: "component"
    name: "Dead Letter Queue (DLQ) Manager"
    technology: "Celery Error Handling"
    description: "Manages failed tasks and routes them to the event bus."
  - type: "component"
    name: "Config & Secrets Manager"
    technology: "pydantic-settings"
    description: "Manages secure configuration and secrets for EU compliance."
  - type: "system"
    name: "Notification & Event Bus"
    technology: "Apache Kafka"
    description: "External event streaming platform."
  - type: "system"
    name: "Payment Gateway"
    technology: "HTTPS API"
    description: "External payment processing service."
  - type: "system"
    name: "Notification Service"
    technology: "HTTPS API"
    description: "External notification delivery service."
  - type: "system"
    name: "National Library Registry"
    technology: "HTTPS API"
    description: "External registry system."
  - type: "database"
    name: "PostgreSQL Database"
    technology: "PostgreSQL"
    description: "Relational database for data storage and persistence."
relationships:
  - source: "Notification & Event Bus"
    destination: "Kafka Event Consumer"
    description: "Sends events [TCP]"
  - source: "Kafka Event Consumer"
    destination: "Task Router / Dispatcher"
    description: "Dispatches events [In-memory Python function call]"
  - source: "Task Router / Dispatcher"
    destination: "Payment Processor Handler"
    description: "Triggers payment handling [In-memory Python function call]"
  - source: "Task Router / Dispatcher"
    destination: "Notification Dispatcher"
    description: "Triggers notifications [In-memory Python function call]"
  - source: "Payment Processor Handler"
    destination: "Payment Gateway"
    description: "Processes payments [HTTPS]"
  - source: "Notification Dispatcher"
    destination: "Notification Service"
    description: "Sends notifications [HTTPS]"
  - source: "Registry Sync Handler"
    destination: "National Library Registry"
    description: "Syncs registry data [HTTPS]"
  - source: "Data Sync & Maintenance Processor"
    destination: "PostgreSQL Database"
    description: "Executes batch operations and maintenance [TCP/SQL]"
  - source: "Task Router / Dispatcher"
    destination: "Dead Letter Queue (DLQ) Manager"
    description: "Handles task failures [In-memory Python exception handler]"
  - source: "Dead Letter Queue (DLQ) Manager"
    destination: "Notification & Event Bus"
    description: "Publishes failed messages [TCP]"
  - source: "Config & Secrets Manager"
    destination: "Payment Processor Handler"
    description: "Injects configuration [In-memory injection]"
  - source: "Config & Secrets Manager"
    destination: "Registry Sync Handler"
    description: "Injects configuration [In-memory injection]"