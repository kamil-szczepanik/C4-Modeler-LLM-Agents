level: component
scope: "Component diagram for the Reporting & Analytics Service container"
parentContainer:
  name: "Reporting & Analytics Service"
elements:
  - type: "component"
    name: "Report Orchestration Engine"
    technology: "Python, Celery"
    description: "Handles heavy report orchestration workloads and delegates tasks."
  - type: "component"
    name: "Analytics Query Processor"
    technology: "Python, Pandas/SQLAlchemy"
    description: "Processes data and handles analytical querying."
  - type: "component"
    name: "Export Formatter"
    technology: "Python, ReportLab/Openpyxl"
    description: "Renders PDF and spreadsheet exports."
  - type: "component"
    name: "Data Ingestion Component"
    technology: "Python, Faust/Kafka-Python"
    description: "Consumes raw events and persists metrics."
  - type: "component"
    name: "API Gateway"
    technology: "Nginx, Kong"
    description: "Forwards generation requests to the orchestration engine."
  - type: "component"
    name: "Notification & Event Bus"
    technology: "Apache Kafka"
    description: "High-throughput event ingestion bus."
  - type: "component"
    name: "Database"
    technology: "PostgreSQL"
    description: "Read-optimized data store for compliance with EU-only data residency."
  - type: "component"
    name: "Distributed Cache"
    technology: "Redis"
    description: "Distributed caching and broker protocol implementation."
  - type: "component"
    name: "Object Storage"
    technology: "MinIO, S3-compatible"
    description: "Stores large reports ensuring regional data residency compliance."
relationships:
  - source: "API Gateway"
    destination: "Report Orchestration Engine"
    description: "Forwards generation requests [gRPC over TLS]"
  - source: "Report Orchestration Engine"
    destination: "Notification & Event Bus"
    description: "Consumes domain events [Kafka Protocol]"
  - source: "Report Orchestration Engine"
    destination: "Distributed Cache"
    description: "Delegates tasks [Redis Broker Protocol]"
  - source: "Report Orchestration Engine"
    destination: "Export Formatter"
    description: "Renders exports [Direct Function Call]"
  - source: "Report Orchestration Engine"
    destination: "Analytics Query Processor"
    description: "Invokes queries [Python Asyncio]"
  - source: "Analytics Query Processor"
    destination: "Database"
    description: "Queries analytical views [SQL over TLS / psycopg2]"
  - source: "Analytics Query Processor"
    destination: "Distributed Cache"
    description: "Caches aggregates [RESP over TLS]"
  - source: "Data Ingestion Component"
    destination: "Notification & Event Bus"
    description: "Consumes raw events [Kafka Protocol]"
  - source: "Data Ingestion Component"
    destination: "Database"
    description: "Persists metrics [SQL over TLS]"
  - source: "Data Ingestion Component"
    destination: "Analytics Query Processor"
    description: "Invalidates cache [RESP over TLS]"
  - source: "Export Formatter"
    destination: "Object Storage"
    description: "Stores large reports [HTTPS / AWS S3 API]"