# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "SSL Termination Module"
    technology: "Kong on Nginx"
    description: "Terminates incoming SSL/TLS connections and handles HTTPS traffic."
  - type: "component"
    name: "Geo-Filtering & Compliance Module"
    technology: "Lua / Kong Plugin"
    description: "Enforces strict EU-only data residency constraints and filters traffic based on geography."
  - type: "component"
    name: "IP Whitelisting & Threat Protection Plugin"
    technology: "Lua / Kong Plugin"
    description: "Provides threat protection and validates IP whitelisting for incoming traffic."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "JWT / OAuth2"
    description: "Validates tokens and enforces stateless token-based authentication at the edge."
  - type: "component"
    name: "Routing Engine"
    technology: "Lua / Kong Router"
    description: "Powers internal routing and matches incoming routes to downstream services."
  - type: "component"
    name: "Protocol Translation Module"
    technology: "Kong / Internal IPC"
    description: "Translates client requests and routes business payloads to downstream microservices."
  - type: "component"
    name: "Request Transformation Component"
    technology: "Kong Plugin"
    description: "Transforms request payloads and structures as needed."
  - type: "component"
    name: "Rate Limiting & Throttling Component"
    technology: "Kong / Redis"
    description: "Tracks rate-limit counters and throttles excessive requests."
  - type: "component"
    name: "Load Balancing & Upstream Circuit Breaker"
    technology: "Kong Upstream"
    description: "Ensures resilience and sub-800ms responses via load balancing and circuit breaking."
  - type: "component"
    name: "API Versioning & Deprecation Filter"
    technology: "Kong Plugin"
    description: "Manages API versioning and deprecation policies."
  - type: "component"
    name: "Metrics & Logging Exporter"
    technology: "Kong Plugin"
    description: "Exports metrics and access logs for monitoring."
relationships:
  - source: "SSL Termination Module"
    destination: "Geo-Filtering & Compliance Module"
    description: "Passes decrypted traffic [Internal IPC]"
  - source: "Geo-Filtering & Compliance Module"
    destination: "IP Whitelisting & Threat Protection Plugin"
    description: "Passes filtered traffic [Internal IPC]"
  - source: "IP Whitelisting & Threat Protection Plugin"
    destination: "Routing Engine"
    description: "Passes validated traffic [Internal IPC]"
  - source: "Routing Engine"
    destination: "Protocol Translation Module"
    description: "Forwards matched routes [Internal IPC]"
  - source: "Rate Limiting & Throttling Component"
    destination: "Distributed Cache (Redis)"
    description: "Tracks rate-limit counters [RESP over TLS]"
  - source: "Authentication & Authorization Filter"
    destination: "Identity Provider"
    description: "Validates tokens [OAuth2/OIDC]"