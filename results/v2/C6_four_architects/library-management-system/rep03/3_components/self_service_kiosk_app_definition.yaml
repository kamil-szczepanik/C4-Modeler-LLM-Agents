level: component
scope: "Component diagram for the Self-Service Kiosk App container"
parentContainer:
  name: "Self-Service Kiosk App"
elements:
  - type: "component"
    name: "UI Shell"
    technology: "Electron, React"
    description: "Powers the touch-optimized user interface for the UI Shell."
  - type: "component"
    name: "Kiosk Host Bridge"
    technology: "C# .NET Core"
    description: "Manages the Kiosk Host Bridge for low-level OS and hardware integration."
  - type: "component"
    name: "Session & Auth Manager"
    technology: "C# .NET Core"
    description: "Manages user sessions and authentication requests."
  - type: "component"
    name: "Offline Queue Manager"
    technology: "SQLite, ADO.NET"
    description: "Provides local on-device transactional buffering for offline resilience."
  - type: "component"
    name: "Hardware Event Poller / Peripheral Monitor"
    technology: "C# .NET Core"
    description: "Monitors hardware peripherals and raises telemetry and fault alerts."
relationships:
  - source: "UI Shell"
    destination: "Kiosk Host Bridge"
    description: "Inter-Process Communication [gRPC over named pipes]"
  - source: "Kiosk Host Bridge"
    destination: "Hardware Peripherals"
    description: "Direct hardware drivers [USB/Serial, OPOS/UPOS]"
  - source: "Session & Auth Manager"
    destination: "API Gateway"
    description: "Secure API requests [HTTPS (REST/JSON)]"
  - source: "Session & Auth Manager"
    destination: "Offline Queue Manager"
    description: "Persists offline transactions [ADO.NET / SQLite]"
  - source: "Offline Queue Manager"
    destination: "API Gateway"
    description: "Background transaction sync [HTTPS (REST/JSON)]"
  - source: "Hardware Event Poller / Peripheral Monitor"
    destination: "API Gateway"
    description: "Telemetry & fault alerts [HTTPS (REST/JSON)]"