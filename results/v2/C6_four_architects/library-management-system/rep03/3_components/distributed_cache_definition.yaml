level: component
scope: "Component diagram for the Distributed Cache container"
parentContainer:
  name: "Distributed Cache"
elements:
  - type: "component"
    name: "Session Store Component"
    technology: "Redis 7.x In-Memory Data Structures"
    description: "Provides in-memory session management for transient patron data."
  - type: "component"
    name: "Catalog L2 Cache Component"
    technology: "Redis 7.x In-Memory Data Structures"
    description: "Provides fast catalog lookups and cache consistency for pre-serialized search facets and hot item metadata."
  - type: "component"
    name: "Eviction & Expiry Manager"
    technology: "Redis volatile-lru Engine"
    description: "Enforces volatile-lru eviction to satisfy EU-only volatile data storage constraints."
  - type: "component"
    name: "Cluster Topology Manager Component"
    technology: "Redis Cluster Mode"
    description: "Manages master-replica replication and slot-based redirection."
  - type: "component"
    name: "Pub/Sub Broker Component"
    technology: "Redis Pub/Sub"
    description: "Handles messaging and cache invalidation notifications."
  - type: "component"
    name: "Health & Metrics Exporter Component"
    technology: "Redis Exporter Sidecar"
    description: "Exposes Prometheus-compatible metrics for monitoring memory fragmentation via HTTP/TLS."
  - type: "component"
    name: "Circuit Breaker & Rate Limiter Component"
    technology: "Redis Lua Engine"
    description: "Executes atomic check-and-set operations for distributed locking and rate limiting."
relationships:
  - source: "Core Domain Service"
    destination: "Session Store Component"
    description: "Manages sessions, executes cache invalidation, and acquires distributed locks via RESP3/TCP (TLS 1.3)"
  - source: "Search Service"
    destination: "Catalog L2 Cache Component"
    description: "Queries pre-serialized search facets and hot item metadata via RESP3/TCP (TLS 1.3)"
  - source: "Prometheus"
    destination: "Health & Metrics Exporter Component"
    description: "Scrapes system and memory metrics via HTTP/TLS on port 9121"