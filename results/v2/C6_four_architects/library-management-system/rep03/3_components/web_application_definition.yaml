level: component
scope: "Component diagram for the Web Application container"
parentContainer:
  name: "Web Application"
elements:
  - type: "component"
    name: "UI Router & View Layer"
    technology: "React Router and Tailwind CSS"
    description: "Renders views and handles navigation for the Single Page Application."
  - type: "component"
    name: "State & Session Store"
    technology: "Zustand"
    description: "Manages client-side application state and user sessions lightweight."
  - type: "component"
    name: "Search & Filter Controller"
    technology: "React Hook / Local State"
    description: "Delegates search input and triggers debounced search."
  - type: "component"
    name: "Auth & Authorization Guard"
    technology: "React Context / JWT Decoder"
    description: "Checks permissions and injects Bearer tokens."
  - type: "component"
    name: "API Client"
    technology: "Axios"
    description: "Handles outbound REST/JSON communication."
  - type: "component"
    name: "Telemetry & Error Boundary"
    technology: "Sentry SDK / React Error Boundary"
    description: "Captures client-side exceptions and forwards logs to EU-hosted endpoints."
relationships:
  - source: "UI Router & View Layer"
    destination: "State & Session Store"
    description: "Reads/writes state [In-memory]"
  - source: "State & Session Store"
    destination: "API Client"
    description: "Triggers data fetching [In-memory]"
  - source: "UI Router & View Layer"
    destination: "Search & Filter Controller"
    description: "Delegates search input [In-memory]"
  - source: "Search & Filter Controller"
    destination: "API Client"
    description: "Triggers debounced search [HTTPS]"
  - source: "UI Router & View Layer"
    destination: "Auth & Authorization Guard"
    description: "Checks permissions [In-memory]"
  - source: "Auth & Authorization Guard"
    destination: "API Client"
    description: "Injects Bearer tokens [In-memory]"
  - source: "UI Router & View Layer"
    destination: "Telemetry & Error Boundary"
    description: "Reports exceptions [In-memory]"
  - source: "Telemetry & Error Boundary"
    destination: "EU-hosted Monitoring Endpoint"
    description: "Forwards logs [HTTPS]"
  - source: "API Client"
    destination: "API Gateway"
    description: "Makes API requests [HTTPS (REST/JSON)]"