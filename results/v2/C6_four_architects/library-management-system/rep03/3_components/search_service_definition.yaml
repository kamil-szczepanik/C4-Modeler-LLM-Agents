level: component
scope: "Component diagram for the Search Service container"
parentContainer:
  name: "Search Service"
elements:
  - type: "component"
    name: "Search REST Controller"
    technology: "Spring Boot"
    description: "Handles search requests via HTTP/REST over TLS."
  - type: "component"
    name: "Query Builder Component"
    technology: "Spring Boot"
    description: "Builds and constructs search queries."
  - type: "component"
    name: "Search Circuit Breaker"
    technology: "Resilience4j"
    description: "Provides circuit breaking for graceful degradation under heavy load."
  - type: "component"
    name: "Elasticsearch Client Wrapper"
    technology: "Spring Boot"
    description: "Encapsulates communication with the Elasticsearch Engine ensuring sub-800ms responses with EU boundary node pinning."
  - type: "component"
    name: "Search Result Ranker / Post-Processor"
    technology: "Spring Boot"
    description: "Ranks and post-processes search results."
  - type: "component"
    name: "Index Synchronizer Consumer"
    technology: "Spring Boot"
    description: "Consumes asynchronous events from the notification and event bus for index synchronization."
relationships:
  - source: "Search REST Controller"
    destination: "Query Builder Component"
    description: "In-process Method Call"
  - source: "Query Builder Component"
    destination: "Search Circuit Breaker"
    description: "In-process Method Call"
  - source: "Search Circuit Breaker"
    destination: "Elasticsearch Client Wrapper"
    description: "In-process Method Call"
  - source: "Elasticsearch Client Wrapper"
    destination: "Search Result Ranker / Post-Processor"
    description: "In-process Method Call"
  - source: "Search Result Ranker / Post-Processor"
    destination: "Search REST Controller"
    description: "In-process Method Call"
  - source: "Index Synchronizer Consumer"
    destination: "Elasticsearch Client Wrapper"
    description: "In-process Method Call"