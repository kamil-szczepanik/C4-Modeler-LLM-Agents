level: component
scope: "Component diagram for the Notification & Event Bus container"
parentContainer:
  name: "Notification & Event Bus"
elements:
  - type: "component"
    name: "Event Router (Topic Manager)"
    technology: "Apache Kafka Brokers"
    description: "Manages event routing and topics across the event bus."
  - type: "component"
    name: "Event Publisher Gateway"
    technology: "Kafka Producer Client API (Java/Python)"
    description: "Publishes events to the event bus."
  - type: "component"
    name: "Consumer Dispatcher"
    technology: "Kafka Consumer Client API"
    description: "Dispatches events to consumers."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry"
    description: "Enforces Avro/JSON Schema contracts to prevent breaking changes."
  - type: "component"
    name: "Dead Letter Queue (DLQ) Manager"
    technology: "Kafka DLQ Topics"
    description: "Manages dead letter queues for failed message processing."
  - type: "component"
    name: "Kafka Connect Engine"
    technology: "Confluent Kafka Connect"
    description: "Handles integration with external systems and databases."
  - type: "component"
    name: "Access Control & TLS Terminator"
    technology: "Kafka TLS/SASL Security Layer"
    description: "Implements mTLS and SASL/SCRAM for secure internal communication."
  - type: "component"
    name: "Stream Processing Engine"
    technology: "Apache Kafka Streams"
    description: "Processes real-time event transformations locally."
  - type: "component"
    name: "Event Bus Metrics Exporter"
    technology: "Prometheus JMX Exporter"
    description: "Collects telemetry to meet performance goals."
relationships:
  - source: "Core Domain Service"
    destination: "Access Control & TLS Terminator"
    description: "Kafka Wire Protocol over TLS"
  - source: "Event Publisher Gateway"
    destination: "Schema Registry"
    description: "HTTP/REST"
  - source: "Consumer Dispatcher"
    destination: "Dead Letter Queue (DLQ) Manager"
    description: "Kafka Wire Protocol"
  - source: "Kafka Connect Engine"
    destination: "Notification Service"
    description: "HTTPS"
  - source: "Kafka Connect Engine"
    destination: "Database"
    description: "JDBC"
  - source: "Event Router (Topic Manager)"
    destination: "Stream Processing Engine"
    description: "Kafka Wire Protocol"
  - source: "Stream Processing Engine"
    destination: "Reporting & Analytics Service"
    description: "Kafka Wire Protocol"
  - source: "Event Router (Topic Manager)"
    destination: "Event Bus Metrics Exporter"
    description: "HTTP/JMX"
  - source: "Reporting & Analytics Service"
    destination: "Event Bus Metrics Exporter"
    description: "Prometheus Scrape Protocol"