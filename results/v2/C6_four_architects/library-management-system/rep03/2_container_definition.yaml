level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patron"
    description: "A person who accesses the library portals for self-service."
  - type: "person"
    name: "Librarian"
    description: "A person who manages cataloging and circulation within the system."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Handles user authentication."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Processes fines securely."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Sends reminders and notifications to users."
  - type: "container"
    name: "Web Application"
    technology: "React, TypeScript"
    description: "Frontend rendering for responsive web UI served via CDN."
  - type: "container"
    name: "Self-Service Kiosk App"
    technology: "Electron, C# WPF"
    description: "Desktop app providing self-service kiosk capabilities."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx, Kong"
    description: "Reverse proxy routing and managing incoming traffic."
  - type: "container"
    name: "Core Domain Service"
    technology: "Java, Spring Boot"
    description: "Robust backend platform for core business logic."
  - type: "container"
    name: "Search Service"
    technology: "Elasticsearch"
    description: "Dedicated search engine ensuring sub-800ms response times."
  - type: "container"
    name: "Reporting & Analytics Service"
    technology: "Python, FastAPI"
    description: "Handles reporting and analytics workloads."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL"
    description: "Relational storage ensuring ACID compliance within EU boundaries."
  - type: "container"
    name: "Distributed Cache"
    technology: "Redis"
    description: "In-memory caching for session management and fast catalog lookups."
  - type: "container"
    name: "Notification & Event Bus"
    technology: "Apache Kafka"
    description: "Event broker for decoupled, reliable asynchronous processing."
  - type: "container"
    name: "Async Worker"
    technology: "Python, Celery"
    description: "Background worker handling asynchronous tasks."
relationships:
  - source: "Library Patron"
    destination: "Web Application"
    description: "Accesses cataloging and circulation features"
    technology: "HTTPS"
  - source: "Library Patron"
    destination: "Self-Service Kiosk App"
    description: "Uses self-service portals"
    technology: "HTTPS"
  - source: "Librarian"
    destination: "Web Application"
    description: "Manages cataloging and circulation"
    technology: "HTTPS"
  - source: "Web Application"
    destination: "API Gateway"
    description: "Makes API requests"
    technology: "HTTPS (REST/JSON)"
  - source: "Self-Service Kiosk App"
    destination: "API Gateway"
    description: "Makes API requests"
    technology: "HTTPS (REST/JSON)"
  - source: "API Gateway"
    destination: "Core Domain Service"
    description: "Routes core business requests"
    technology: "gRPC over TLS"
  - source: "API Gateway"
    destination: "Reporting & Analytics Service"
    description: "Routes reporting requests"
    technology: "gRPC over TLS"
  - source: "Core Domain Service"
    destination: "Database"
    description: "Persists and queries relational data"
    technology: "JDBC"
  - source: "Core Domain Service"
    destination: "Search Service"
    description: "Performs catalog searches"
    technology: "HTTP/REST over TLS"
  - source: "Core Domain Service"
    destination: "Distributed Cache"
    description: "Caches session and catalog data"
    technology: "TCP"
  - source: "Core Domain Service"
    destination: "Notification & Event Bus"
    description: "Publishes and consumes events"
    technology: "Kafka Wire Protocol"
  - source: "Async Worker"
    destination: "Payment Gateway"
    description: "Processes fines and payments"
    technology: "HTTPS"
  - source: "Async Worker"
    destination: "Notification Service"
    description: "Sends notifications and reminders"
    technology: "HTTPS"