level: component
scope: "Component diagram for the Billing & Claims Worker container"
parentContainer:
  name: "Billing & Claims Worker"
elements:
  - type: "component"
    name: "Claim Submission Queue Listener"
    technology: ".NET Core / RabbitMQ Client"
    description: "Consumes pending claim payloads from RabbitMQ."
  - type: "component"
    name: "Clearinghouse Integration Adapter"
    technology: ".NET Core / HttpClient with Polly"
    description: "Submits claims and processes payments to external payment gateways and insurance clearinghouses."
  - type: "component"
    name: "Reconciliation & State Manager"
    technology: ".NET Core / Entity Framework Core"
    description: "Parses clearinghouse responses and manages local claim states securely."
  - type: "component"
    name: "Remediation Mapping Engine"
    technology: ".NET Core / Localized lookup cache"
    description: "Maps and handles error remediation using a localized lookup cache."
  - type: "component"
    name: "Alert Dispatcher"
    technology: ".NET Core / SignalR & RabbitMQ Publisher"
    description: "Pushes enriched rejection alerts to the frontend."
  - type: "component"
    name: "RabbitMQ"
    technology: "RabbitMQ"
    description: "Message broker ensuring reliable, decoupled claim queueing."
  - type: "component"
    name: "Payment Gateway and Insurance Clearinghouse"
    technology: "External Service"
    description: "External clearinghouse and payment processing service."
  - type: "component"
    name: "API Gateway"
    technology: "API Gateway"
    description: "Gateway routing traffic to the frontend."
  - type: "component"
    name: "Audit Archive"
    technology: "Secure Storage"
    description: "Secure archive for signed audit logs."
relationships:
  - source: "Claim Submission Queue Listener"
    destination: "RabbitMQ"
    description: "Consumes pending claim payloads [AMQP with mTLS]"
  - source: "Clearinghouse Integration Adapter"
    destination: "Payment Gateway and Insurance Clearinghouse"
    description: "Submits claims and processes payments [HTTPS / REST with mTLS and strict egress filtering]"
  - source: "Reconciliation & State Manager"
    destination: "Remediation Mapping Engine"
    description: "Parses clearinghouse responses [Direct C# Method Invocation]"
  - source: "Alert Dispatcher"
    destination: "API Gateway"
    description: "Pushes enriched rejection alerts to Frontend [WSS / SignalR with JWT validation]"
  - source: "Reconciliation & State Manager"
    destination: "Audit Archive"
    description: "Emits signed audit logs [Secure API / TLS]"