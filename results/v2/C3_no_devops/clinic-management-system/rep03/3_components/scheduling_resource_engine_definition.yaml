level: component
scope: "Component diagram for the Scheduling & Resource Engine container"
parentContainer:
  name: "Scheduling & Resource Engine"
elements:
  - type: "component"
    name: "API Controller"
    technology: "Go"
    description: "Routes scheduling requests and handles entry point logic."
  - type: "component"
    name: "Resource Locking Coordinator"
    technology: "Go/Redis"
    description: "Coordinates atomic locking and state persistence for resource clash prevention."
  - type: "component"
    name: "Clinical Workflow Engine"
    technology: "Python"
    description: "Executes clinical workflows and rule evaluations."
  - type: "component"
    name: "Alternative Slot Recommender"
    technology: "Python"
    description: "Performs complex heuristic graph searches for alternative slot recommendations."
  - type: "component"
    name: "Telemetry & Analytics Emitter"
    technology: "Go"
    description: "Captures and publishes sanitized usage and slot metrics."
relationships:
  - source: "API Controller"
    destination: "Resource Locking Coordinator"
    description: "Internal communication [gRPC]"
  - source: "Alternative Slot Recommender"
    destination: "Telemetry & Analytics Emitter"
    description: "Captures slot metrics [Asynchronous channels]"