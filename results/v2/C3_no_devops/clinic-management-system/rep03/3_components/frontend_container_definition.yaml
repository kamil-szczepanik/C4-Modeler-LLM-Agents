level: component
scope: "Component diagram for the Frontend Container container"
parentContainer:
  name: "Frontend Container"
elements:
  - type: "component"
    name: "BFF Routing & Middleware"
    technology: "Next.js / Node.js"
    description: "Powers the Frontend BFF for server-side rendering, routing, and sub-second EMR loads."
  - type: "component"
    name: "UI View Orchestration"
    technology: "React / Tailwind, WCAG 2.1 AA"
    description: "Delivers role-tailored UI views with WCAG 2.1 AA accessibility."
  - type: "component"
    name: "API Client & Caching"
    technology: "TanStack Query / Redis"
    description: "Handles data fetching, state management, and SSR caching for high performance."
  - type: "component"
    name: "Session & Emergency Override Manager"
    technology: "Node.js"
    description: "Manages secure sessions, HTTP-only cookies, and emergency override capabilities for clinical staff."
relationships:
  - source: "UI View Orchestration"
    destination: "BFF Routing & Middleware"
    description: "Sends UI rendering requests and route navigation"
  - source: "BFF Routing & Middleware"
    destination: "API Client & Caching"
    description: "Fetches and caches clinical data via TanStack Query and Redis"
  - source: "Session & Emergency Override Manager"
    destination: "BFF Routing & Middleware"
    description: "Validates session security, CSP headers, and access control"