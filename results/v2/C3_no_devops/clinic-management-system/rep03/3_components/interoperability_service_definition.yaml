level: component
scope: "Component diagram for the Interoperability Service container"
parentContainer:
  name: "Interoperability Service"
elements:
  - type: "component"
    name: "FHIR API Endpoint Controller"
    technology: "Java/Spring Boot with HAPI FHIR"
    description: "Handles RESTful resource requests and standard compliance."
  - type: "component"
    name: "HL7/DICOM Translation Engine"
    technology: "Apache Camel"
    description: "Transforms legacy payload and performs schema validation."
  - type: "component"
    name: "Integration Message Broker Client"
    technology: "RabbitMQ/Kafka"
    description: "Manages message routing and Dead-Letter Queue management."
  - type: "component"
    name: "Audit & Metrics Publisher"
    technology: "Java/Spring Boot"
    description: "Handles telemetry, compliance logs, and Prometheus/Grafana monitoring."
relationships:
  - source: "External Systems"
    destination: "FHIR API Endpoint Controller"
    description: "Inbound lab/imaging requests [mTLS / OAuth 2.0 / HTTPS]"
  - source: "FHIR API Endpoint Controller"
    destination: "Clinical Core Container"
    description: "Forwards processed medical records [gRPC / TLS 1.3]"
  - source: "Integration Message Broker Client"
    destination: "Dead-Letter Queue"
    description: "Offloads unparseable payloads [AMQP]"
  - source: "HL7/DICOM Translation Engine"
    destination: "Audit & Metrics Publisher"
    description: "Emits telemetry and logs [Internal EventBus]"
  - source: "FHIR API Endpoint Controller"
    destination: "Audit & Metrics Publisher"
    description: "Emits telemetry and logs [Internal EventBus]"
  - source: "Audit & Metrics Publisher"
    destination: "Audit Archive"
    description: "Secures immutable audit trails [HTTPS / WORM storage]"