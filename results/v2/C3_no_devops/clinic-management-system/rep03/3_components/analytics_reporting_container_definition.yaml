level: component
scope: "Component diagram for the Analytics & Reporting Container container"
parentContainer:
  name: "Analytics & Reporting Container"
elements:
  - type: "component"
    name: "Dashboard & Visualization UI"
    technology: "Apache Superset"
    description: "Provides dashboard and visualization interface for analytical insights."
  - type: "component"
    name: "Query & Semantic Layer"
    technology: "Superset SQL Lab"
    description: "Handles query and semantic layer processing for reports."
  - type: "component"
    name: "Analytical Data Store"
    technology: "ClickHouse"
    description: "Stores sub-second time-series analytical data."
  - type: "component"
    name: "CDC Ingestion Worker"
    technology: "Debezium + Kafka Connect"
    description: "Streams asynchronous transactional data from primary PostgreSQL."
  - type: "component"
    name: "Report Export Service"
    technology: "Report Export Service"
    description: "Exports reports and streams immutable audit logs over TLS to audit archive."
  - type: "component"
    name: "Notification & Scheduling Worker"
    technology: "Celery / Node.js"
    description: "Manages notification and report scheduling workflows."
relationships:
  - source: "Dashboard & Visualization UI"
    destination: "Query & Semantic Layer"
    description: "Queries data via"
  - source: "Query & Semantic Layer"
    destination: "Analytical Data Store"
    description: "Retrieves analytical data from"
  - source: "CDC Ingestion Worker"
    destination: "Analytical Data Store"
    description: "Streams transactional data into"
  - source: "Report Export Service"
    destination: "Dashboard & Visualization UI"
    description: "Exports generated reports from"