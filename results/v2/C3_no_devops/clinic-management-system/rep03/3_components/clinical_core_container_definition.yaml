level: component
scope: "Component diagram for the Clinical Core Container container"
parentContainer:
  name: "Clinical Core Container"
elements:
  - type: "component"
    name: "Patient Registry Component"
    technology: "Java Spring Boot"
    description: "Manages patient demographic data and executes similarity queries using pg_trgm."
  - type: "component"
    name: "EMR Management Component"
    technology: "Java Spring Boot"
    description: "Manages electronic medical records and executes transactional reads/writes."
  - type: "component"
    name: "Clinical Persistence Facade"
    technology: "Java Spring Boot"
    description: "Provides persistence access and facade patterns for the clinical core."
  - type: "component"
    name: "CDS Integration Component"
    technology: "Java Spring Boot with Spring WebFlux & Resilience4j"
    description: "Handles asynchronous clinical decision support integrations and event hooks."
  - type: "component"
    name: "Search & Indexing Sub-component"
    technology: "Java Spring Boot"
    description: "Supports search and indexing operations across clinical records."
relationships:
  - source: "EMR Management Component"
    destination: "PostgreSQL"
    description: "Executes transactional reads/writes [JDBC over SSL with HikariCP]"
  - source: "EMR Management Component"
    destination: "CDS Integration Component"
    description: "Dispatches async event hooks [In-process Spring Events]"
  - source: "Patient Registry Component"
    destination: "PostgreSQL"
    description: "Executes similarity queries using pg_trgm [JDBC over SSL]"
  - source: "Clinical Core Container"
    destination: "Audit Archive"
    description: "Streams cryptographically signed audit logs [Secure TCP]"