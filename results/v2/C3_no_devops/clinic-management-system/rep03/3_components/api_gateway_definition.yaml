level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Router / Reverse Proxy"
    technology: "Kong / Nginx"
    description: "Centralized API Gateway routing, WAF, and reverse proxy for high availability and load management."
  - type: "component"
    name: "Authentication & Token Relay Plugin"
    technology: "OAuth2/OIDC"
    description: "Handles authentication and token relay for incoming requests."
  - type: "component"
    name: "Rate Limiting & Throttling Engine"
    technology: "Redis"
    description: "Distributed token bucket backing for persona-based rate limiting and throttling."
  - type: "component"
    name: "Audit Logging & Tracing Interceptor"
    technology: "Syslog / HTTPS"
    description: "Exports security and compliance logs to Audit Archive."
  - type: "component"
    name: "Metrics Exporter Component"
    technology: "Prometheus"
    description: "Asynchronous scraping of gateway operational metrics and error rates."
relationships:
  - source: "Edge Router / Reverse Proxy"
    destination: "Authentication & Token Relay Plugin"
    description: "Passes authenticated requests [HTTPS / REST, OAuth2/OIDC with MFA]"
  - source: "Authentication & Token Relay Plugin"
    destination: "Rate Limiting & Throttling Engine"
    description: "Checks rate limits [TCP / RESP]"
  - source: "Edge Router / Reverse Proxy"
    destination: "Clinical Core Container"
    description: "Routes requests [mTLS / gRPC / REST]"
  - source: "Edge Router / Reverse Proxy"
    destination: "Scheduling & Resource Engine"
    description: "Routes requests [mTLS / gRPC / REST]"
  - source: "Edge Router / Reverse Proxy"
    destination: "Interoperability Service"
    description: "Routes requests [mTLS / gRPC / REST]"
  - source: "Audit Logging & Tracing Interceptor"
    destination: "Audit Archive"
    description: "Exports security and compliance logs [HTTPS / Syslog]"
  - source: "Metrics Exporter Component"
    destination: "Analytics & Reporting Container"
    description: "Scrapes operational metrics [HTTP / Prometheus]"