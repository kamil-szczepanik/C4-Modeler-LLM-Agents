level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who interact with the system via web or mobile clients."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals who manage patient care and electronic medical records."
  - type: "person"
    name: "Administrative Staff"
    description: "Staff members handling scheduling and clinic workflows."
  - type: "person"
    name: "Billing Officers"
    description: "Personnel managing patient billing and financial transactions."
  - type: "person"
    name: "Regulatory Auditors"
    description: "Auditors reviewing compliance and system logs."
  - type: "externalSystem"
    name: "Enterprise Identity Provider"
    description: "Provides identity federation and authentication services."
  - type: "externalSystem"
    name: "External Lab and Imaging Systems"
    description: "External medical systems providing lab results and imaging data."
  - type: "externalSystem"
    name: "Payment Gateway and Insurance Clearinghouse"
    description: "External systems processing payments and insurance claims."
  - type: "externalSystem"
    name: "Audit Archive"
    description: "Storage with WORM controls for immutable data retention."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / Nginx"
    description: "Centralized routing and mTLS/OAuth2 enforcement."
  - type: "container"
    name: "Frontend Container"
    technology: "Next.js / Node.js"
    description: "Patient Portal BFF."
  - type: "container"
    name: "Clinical Core Container"
    technology: "Node.js / Java Spring Boot"
    description: "Handles core clinical workflows and electronic medical records."
  - type: "container"
    name: "Scheduling & Resource Engine"
    technology: "Python / Go with Redis"
    description: "Real-time resource locking and clash checks."
  - type: "container"
    name: "Interoperability Service"
    technology: "Apache Camel / HAPI FHIR"
    description: "HL7 FHIR standard compliance and interoperability."
  - type: "container"
    name: "Billing & Claims Worker"
    technology: ".NET Core with RabbitMQ"
    description: "Asynchronous billing and insurance claims processing."
  - type: "container"
    name: "Analytics & Reporting Container"
    technology: "Apache Superset / Metabase, ClickHouse, PostgreSQL Replica"
    description: "Analytics backed by ClickHouse and Read-Only PostgreSQL Replica via Debezium CDC."
relationships:
  - source: "Patients"
    destination: "API Gateway"
    description: "Interacts with platform via web/mobile clients"
    technology: "HTTPS / REST, OAuth2/OIDC with MFA"
  - source: "Clinicians"
    destination: "API Gateway"
    description: "Interacts with platform via web/mobile clients"
    technology: "HTTPS / REST, OAuth2/OIDC with MFA"
  - source: "Administrative Staff"
    destination: "API Gateway"
    description: "Interacts with platform via web/mobile clients"
    technology: "HTTPS / REST, OAuth2/OIDC with MFA"
  - source: "Billing Officers"
    destination: "API Gateway"
    description: "Interacts with platform via web/mobile clients"
    technology: "HTTPS / REST, OAuth2/OIDC with MFA"
  - source: "Regulatory Auditors"
    destination: "API Gateway"
    description: "Reviews compliance and system logs"
    technology: "HTTPS / REST, OAuth2/OIDC with MFA"
  - source: "Patient Portal BFF"
    destination: "API Gateway"
    description: "Routes requests through API gateway"
    technology: "HTTPS / REST"
  - source: "API Gateway"
    destination: "Clinical Core Container"
    description: "Routes clinical requests"
    technology: "mTLS / gRPC / REST"
  - source: "API Gateway"
    destination: "Scheduling & Resource Engine"
    description: "Routes scheduling requests"
    technology: "mTLS / gRPC / REST"
  - source: "API Gateway"
    destination: "Interoperability Service"
    description: "Routes interoperability requests"
    technology: "mTLS / gRPC / REST"
  - source: "Clinical Core Container"
    destination: "Audit Archive"
    description: "Streams cryptographically signed audit logs"
    technology: "Secure TCP"
  - source: "Billing & Claims Worker"
    destination: "Payment Gateway and Insurance Clearinghouse"
    description: "Submits claims and processes payments"
    technology: "HTTPS / REST with strict egress filtering"