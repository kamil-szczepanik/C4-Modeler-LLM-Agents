level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform that manages patient admissions, electronic medical records, scheduling, and billing for medium-sized clinics, ensuring HIPAA and GDPR compliance and 99.99% availability."
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who interact with the system via web or mobile clients."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals who manage patient care and electronic medical records."
  - type: "person"
    name: "Administrative Staff"
    description: "Staff members handling scheduling and clinic workflows."
  - type: "person"
    name: "Billing Officers"
    description: "Personnel managing patient billing and financial transactions."
  - type: "person"
    name: "Regulatory Auditors"
    description: "Auditors reviewing compliance and system logs."
  - type: "externalSystem"
    name: "Enterprise Identity Provider"
    description: "Provides identity federation and authentication services."
  - type: "externalSystem"
    name: "External Lab and Imaging Systems"
    description: "External medical systems providing lab results and imaging data."
  - type: "externalSystem"
    name: "Payment Gateway and Insurance Clearinghouse"
    description: "External systems processing payments and insurance claims."
  - type: "externalSystem"
    name: "Audit Archive"
    description: "AWS S3 Glacier storage with WORM controls for immutable 10-year data retention."
relationships:
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Interacts with the platform via Web/Mobile clients"
    technology: "HTTPS"
  - source: "Clinicians"
    destination: "Clinic Management System"
    description: "Interacts with the platform via Web/Mobile clients"
    technology: "HTTPS"
  - source: "Administrative Staff"
    destination: "Clinic Management System"
    description: "Interacts with the platform via Web/Mobile clients"
    technology: "HTTPS"
  - source: "Billing Officers"
    destination: "Clinic Management System"
    description: "Interacts with the platform via Web/Mobile clients"
    technology: "HTTPS"
  - source: "Regulatory Auditors"
    destination: "Clinic Management System"
    description: "Interacts with the platform and reviews audit logs"
    technology: "HTTPS"
  - source: "Clinic Management System"
    destination: "Enterprise Identity Provider"
    description: "Authenticates users"
    technology: "OIDC/SAML over HTTPS"
  - source: "Clinic Management System"
    destination: "External Lab and Imaging Systems"
    description: "Integrates for lab and imaging data exchange"
    technology: "HL7 FHIR APIs over mTLS/HTTPS"
  - source: "Clinic Management System"
    destination: "Payment Gateway and Insurance Clearinghouse"
    description: "Submits claims and processes payments"
    technology: "REST APIs over TLS 1.3"
  - source: "Clinic Management System"
    destination: "Audit Archive"
    description: "Streams logs for immutable data retention"
    technology: "Encrypted TLS 1.3"