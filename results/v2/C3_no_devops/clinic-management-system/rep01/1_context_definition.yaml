level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid-cloud healthcare platform designed to manage patient admissions, electronic medical records, appointment scheduling, and billing for medium-sized hospitals and clinics."
elements:
  - type: "person"
    name: "Patients / Consumers"
    description: "Individuals receiving care who interact with the system for admissions, appointments, and billing."
  - type: "person"
    name: "Clinic Staff / Receptionists"
    description: "Administrative staff managing patient admissions and scheduling appointments."
  - type: "person"
    name: "Healthcare Providers (Doctors/Nurses)"
    description: "Medical professionals managing electronic medical records and clinical workflows."
  - type: "person"
    name: "Billing Specialists"
    description: "Financial staff handling patient billing, payments, and insurance claims."
  - type: "person"
    name: "System Administrators / Compliance Officers"
    description: "Personnel overseeing system health, user access, and regulatory compliance."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Manages secure enterprise authentication and multi-factor authentication."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "External diagnostic and imaging services providing clinical data."
  - type: "externalSystem"
    name: "Payment Gateway / Insurance Clearinghouse"
    description: "External services processing payments and insurance claims."
  - type: "externalSystem"
    name: "Public Health Authority / Regulatory Registry"
    description: "External regulatory bodies receiving encrypted batch exports."
relationships:
  - source: "Patients / Consumers"
    destination: "Clinic Management System"
    description: "Accesses patient portal and services"
    technology: "HTTPS"
  - source: "Clinic Staff / Receptionists"
    destination: "Clinic Management System"
    description: "Manages admissions and scheduling"
    technology: "HTTPS"
  - source: "Healthcare Providers (Doctors/Nurses)"
    destination: "Clinic Management System"
    description: "Views and updates electronic medical records"
    technology: "HTTPS"
  - source: "Billing Specialists"
    destination: "Clinic Management System"
    description: "Manages billing and financial workflows"
    technology: "HTTPS"
  - source: "System Administrators / Compliance Officers"
    destination: "Clinic Management System"
    description: "Configures and monitors system operations"
    technology: "HTTPS"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OIDC/SAML"
  - source: "Clinic Management System"
    destination: "Lab & Imaging Systems"
    description: "Exchanges clinical and diagnostic data"
    technology: "HL7 FHIR over HTTPS"
  - source: "Clinic Management System"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Processes payments and insurance claims"
    technology: "HTTPS"
  - source: "Clinic Management System"
    destination: "Public Health Authority / Regulatory Registry"
    description: "Sends encrypted batch exports"
    technology: "SFTP/HTTPS"