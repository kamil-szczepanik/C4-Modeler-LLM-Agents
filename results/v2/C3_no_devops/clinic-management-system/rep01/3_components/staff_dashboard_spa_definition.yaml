level: component
scope: "Component diagram for the Staff Dashboard (SPA) container"
parentContainer:
  name: "Staff Dashboard (SPA)"
elements:
  - type: "component"
    name: "Auth & RBAC Module"
    technology: "JavaScript / TypeScript"
    description: "Handles JWT evaluation and role-based views."
  - type: "component"
    name: "EMR View Engine"
    technology: "JavaScript / TypeScript"
    description: "Implements local caching and virtualized rendering for medical records."
  - type: "component"
    name: "Scheduling & Intake Controller"
    technology: "JavaScript / TypeScript"
    description: "Manages appointment grids and patient registration."
  - type: "component"
    name: "Local Session State Manager"
    technology: "Volatile In-Memory RAM"
    description: "Volatile in-memory storage for unsaved form drafts."
  - type: "component"
    name: "WebSocket Reconnection Manager"
    technology: "WebSockets (WSS)"
    description: "Handles network drops and state re-sync."
  - type: "component"
    name: "API Client Layer"
    technology: "HTTPS / TLS"
    description: "Communicates securely with backend systems."
relationships:
  - source: "Scheduling & Intake Controller"
    destination: "Local Session State Manager"
    description: "Preserves ephemeral drafts [In-Memory RAM]"