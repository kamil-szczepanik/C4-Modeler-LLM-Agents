level: component
scope: "Component diagram for the Patient Portal (SPA) container"
parentContainer:
  name: "Patient Portal (SPA)"
elements:
  - type: "component"
    name: "Patient UI Router"
    technology: "React / TypeScript"
    description: "Manages client-side routing and view transitions for patient admissions, records, and billing."
  - type: "component"
    name: "Authentication & Session Manager"
    technology: "React / TypeScript, httpOnly Cookies"
    description: "Handles user authentication state and secure token management via httpOnly cookies."
  - type: "component"
    name: "API Communication Client"
    technology: "Fetch / WebSockets"
    description: "Communicates with the BFF Proxy Layer and API Gateway via HTTPS and WebSockets."
relationships:
  - source: "Patient UI Router"
    destination: "Authentication & Session Manager"
    description: "Verifies session state before rendering protected views"
  - source: "Patient UI Router"
    destination: "API Communication Client"
    description: "Triggers API requests for admissions, records, and billing"
  - source: "API Communication Client"
    destination: "BFF Proxy Layer / API Gateway"
    description: "Sends HTTPS API requests and WebSocket connections"