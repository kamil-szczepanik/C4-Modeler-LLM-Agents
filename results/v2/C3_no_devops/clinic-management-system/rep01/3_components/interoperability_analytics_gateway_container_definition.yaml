level: component
scope: "Component diagram for the Interoperability & Analytics Gateway Container container"
parentContainer:
  name: "Interoperability & Analytics Gateway Container"
elements:
  - type: "component"
    name: "FHIR API Facade Component"
    technology: "HAPI FHIR JPA Server / Java"
    description: "Provides robust HL7 FHIR resource management and RESTful capabilities."
  - type: "component"
    name: "HL7 v2 to FHIR Adapter Component"
    technology: "Apache Camel"
    description: "Facilitates reliable translation of legacy HL7 v2 messaging formats to modern FHIR bundles."
  - type: "component"
    name: "Audit & Compliance Interceptor Component"
    technology: "Custom Spring Boot Middleware"
    description: "Intercepts and persists immutable audit logs ensuring compliance."
  - type: "component"
    name: "Break-Glass Authorization Component"
    technology: "Open Policy Agent / Java"
    description: "Enables declarative evaluation of clinical break-glass emergency policies."
relationships:
  - source: "FHIR API Facade Component"
    destination: "Break-Glass Authorization Component"
    description: "Validates emergency access override [gRPC]"
  - source: "Break-Glass Authorization Component"
    destination: "Audit & Compliance Interceptor Component"
    description: "Dispatches high-priority security alerts [Kafka]"
  - source: "Audit & Compliance Interceptor Component"
    destination: "Core Clinical & Billing Services"
    description: "Persists immutable audit logs [Kafka]"