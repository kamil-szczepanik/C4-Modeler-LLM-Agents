level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing & Load Balancing Router"
    technology: "Kong / Envoy"
    description: "Routes incoming API requests and provides load balancing across backend services."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Kong / Envoy Plugin"
    description: "Validates tokens against the Identity Provider and enforces access control."
  - type: "component"
    name: "Rate Limiting & Throttling Engine"
    technology: "Kong / Envoy with Redis"
    description: "Checks quotas and throttles traffic using a fast in-memory state store."
  - type: "component"
    name: "Audit & Telemetry Interceptor"
    technology: "Kong / Envoy Interceptor"
    description: "Intercepts requests for auditing and telemetry collection to ensure compliance."
  - type: "component"
    name: "Telemetry & Metering Publisher"
    technology: "Kafka / RabbitMQ Publisher"
    description: "Publishes usage events and telemetry asynchronously."
relationships:
  - source: "Authentication & Authorization Filter"
    destination: "Identity Provider"
    description: "Validates tokens [HTTPS]"
  - source: "Rate Limiting & Throttling Engine"
    destination: "Redis Cache"
    description: "Checks quotas [RESP / TCP]"
  - source: "Routing & Load Balancing Router"
    destination: "Core Clinical & Billing Services"
    description: "Routes traffic [mTLS via Istio]"
  - source: "Telemetry & Metering Publisher"
    destination: "Kafka"
    description: "Publishes usage events [Async / AMQP]"