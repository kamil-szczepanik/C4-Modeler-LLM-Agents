level: component
scope: "Component diagram for the Core Clinical & Billing Services container"
parentContainer:
  name: "Core Clinical & Billing Services"
elements:
  - type: "component"
    name: "Patient Registry Component"
    technology: "Go / Java / Spring Boot"
    description: "Manages patient admissions and demographic records."
  - type: "component"
    name: "Scheduling & Resource Component"
    technology: "Go / Java / Spring Boot"
    description: "Handles appointments, resource clash checks using Redis, and scheduling workflows."
  - type: "component"
    name: "EMR Management Component"
    technology: "Go / Java / Spring Boot"
    description: "Manages electronic medical records, cold-tiering via S3-compatible object storage with AWS KMS and WORM Object Lock."
  - type: "component"
    name: "Billing & Claims Component"
    technology: "Go / Java / Spring Boot"
    description: "Processes medical billing and integrates synchronously with external payment gateways and insurance clearinghouses."
relationships:
  - source: "Billing & Claims Component"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Integrates synchronously for pre-validation via HTTPS/REST."
  - source: "EMR Management Component"
    destination: "Kafka"
    description: "Publishes and consumes domain events using JWE/envelope encryption."
  - source: "Scheduling & Resource Component"
    destination: "Kafka"
    description: "Publishes and consumes domain events using JWE/envelope encryption."
  - source: "EMR Management Component"
    destination: "S3-compatible object storage"
    description: "Cold-tiers historical records using AWS KMS encryption and WORM Object Lock."