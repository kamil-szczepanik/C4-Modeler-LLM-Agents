level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who interact with the patient portal."
  - type: "person"
    name: "Clinic Staff/Receptionists"
    description: "Administrative staff managing patient admissions and scheduling."
  - type: "person"
    name: "Healthcare Providers"
    description: "Medical professionals managing electronic medical records."
  - type: "person"
    name: "Billing Specialists"
    description: "Financial staff handling patient billing and payments."
  - type: "person"
    name: "System Administrators"
    description: "Personnel overseeing system health and compliance."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Manages secure authentication via OAuth 2.0 / OIDC."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "External diagnostic and imaging services."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External services processing payments."
  - type: "externalSystem"
    name: "Regulatory Registry"
    description: "External regulatory bodies receiving compliance data."
  - type: "container"
    name: "Patient Portal (SPA)"
    technology: "Nginx, Single Page Application"
    description: "Frontend application allowing patients to access their portal."
  - type: "container"
    name: "Staff Dashboard (SPA)"
    technology: "Nginx, Single Page Application"
    description: "Frontend dashboard for clinic staff and healthcare providers."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / Envoy"
    description: "Routes incoming client traffic to internal containers securely."
  - type: "container"
    name: "Core Clinical & Billing Services"
    technology: "Go / Java / Spring Boot, PostgreSQL, Kafka / RabbitMQ"
    description: "Manages core clinical records, scheduling, and billing workflows."
  - type: "container"
    name: "Interoperability & Analytics Gateway Container"
    technology: "HAPI FHIR JPA Server, HL7 FHIR"
    description: "Facilitates data exchange with external systems and regulatory entities."
relationships:
  - source: "Patients"
    destination: "Patient Portal (SPA)"
    description: "Interacts with portal for admissions, records, and billing"
    technology: "HTTPS / WebSockets"
  - source: "Clinic Staff/Receptionists"
    destination: "Staff Dashboard (SPA)"
    description: "Manages schedules and patient admissions"
    technology: "HTTPS / WebSockets"
  - source: "Healthcare Providers"
    destination: "Staff Dashboard (SPA)"
    description: "Views and updates electronic medical records"
    technology: "HTTPS / WebSockets"
  - source: "Billing Specialists"
    destination: "Staff Dashboard (SPA)"
    description: "Manages billing operations"
    technology: "HTTPS / WebSockets"
  - source: "System Administrators"
    destination: "Staff Dashboard (SPA)"
    description: "Monitors system and compliance"
    technology: "HTTPS / WebSockets"
  - source: "Patient Portal (SPA)"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS"
  - source: "Staff Dashboard (SPA)"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Core Clinical & Billing Services"
    description: "Routes traffic via service mesh"
    technology: "mTLS / Istio"
  - source: "API Gateway"
    destination: "Interoperability & Analytics Gateway Container"
    description: "Routes interoperability traffic via service mesh"
    technology: "mTLS / Istio"
  - source: "Interoperability & Analytics Gateway Container"
    destination: "Lab & Imaging Systems"
    description: "Exchanges clinical data"
    technology: "HL7 FHIR over HTTPS"
  - source: "Core Clinical & Billing Services"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OAuth 2.0 / OIDC"
  - source: "Core Clinical & Billing Services"
    destination: "Payment Gateway"
    description: "Processes payments"
    technology: "HTTPS"
  - source: "Interoperability & Analytics Gateway Container"
    destination: "Regulatory Registry"
    description: "Sends regulatory data"
    technology: "HTTPS"