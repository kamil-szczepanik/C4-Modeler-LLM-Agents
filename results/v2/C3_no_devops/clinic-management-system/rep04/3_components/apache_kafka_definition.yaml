level: component
scope: "Component diagram for the Apache Kafka container"
parentContainer:
  name: "Apache Kafka"
elements:
  - type: "component"
    name: "KRaft Controller Quorum"
    technology: "Java / ZooKeeper-less metadata management"
    description: "Manages cluster metadata and consensus."
  - type: "component"
    name: "Kafka Brokers"
    technology: "Java / Netty"
    description: "Handles client connections, partition log replication, and disk I/O."
  - type: "component"
    name: "Kafka Connect"
    technology: "Java Framework"
    description: "Offloads historical data to long-term storage."
  - type: "component"
    name: "Kafka Streams Engine"
    technology: "Java Kafka Streams API"
    description: "Handles stateful routing, retries, and dead-letter queues."
  - type: "component"
    name: "Core Services, EMR Service, & Integration Service"
    technology: "Producer/Consumer Microservices"
    description: "Produce and consume clinical, billing, and audit events."
relationships:
  - source: "Core Services, EMR Service, & Integration Service"
    destination: "Kafka Brokers"
    description: "Produce and consume events via TCP using TLS 1.3 and SASL/SCRAM-SHA-512"
  - source: "Kafka Connect"
    destination: "ClickHouse / Object Storage"
    description: "Exports historical audit and clinical event topics via HTTP/JDBC"
  - source: "KRaft Controller Quorum"
    destination: "Kafka Brokers"
    description: "Manages cluster metadata and consensus"