level: component
scope: "Component diagram for the Frontend Container container"
parentContainer:
  name: "Frontend Container"
elements:
  - type: "component"
    name: "Routing & Shell Component"
    technology: "React, TypeScript, Vite"
    description: "Manages application layout, navigation, and dynamically lazy-loads feature modules."
  - type: "component"
    name: "Authentication & Session Manager"
    technology: "React, OIDC/OAuth2, Web Crypto API"
    description: "Handles user authentication, sessions, multi-factor authentication, and integrates with external IdP."
  - type: "component"
    name: "Clinical & Administrative Feature Modules"
    technology: "React, TypeScript"
    description: "Provides specific workflows and UI for patients, clinic staff, clinicians, billing specialists, and system administrators."
  - type: "component"
    name: "API Client Service"
    technology: "Axios/Fetch, TypeScript"
    description: "Sends API requests to the backend API Gateway and receives responses over HTTPS/WSS."
  - type: "component"
    name: "Local Persistence & Sync Service"
    technology: "IndexedDB via Dexie.js, Web Crypto API"
    description: "Manages offline encrypted drafts and local data persistence securely."
relationships:
  - source: "Routing & Shell Component"
    destination: "Clinical & Administrative Feature Modules"
    description: "Dynamically lazy-loads modules"
  - source: "Clinical & Administrative Feature Modules"
    destination: "API Client Service"
    description: "Communicates with backend via API"
  - source: "Clinical & Administrative Feature Modules"
    destination: "Local Persistence & Sync Service"
    description: "Manages offline encrypted drafts"
  - source: "Authentication & Session Manager"
    destination: "API Client Service"
    description: "Provides authentication tokens for requests"