level: component
scope: "Component diagram for the Notification Container container"
parentContainer:
  name: "Notification Container"
elements:
  - type: "component"
    name: "Notification Router Component"
    technology: "Go"
    description: "Consumes inbound notification events from Apache Kafka."
  - type: "component"
    name: "Channel Dispatcher Components"
    technology: "Go, Twilio API, SMTP, Firebase/APNS"
    description: "Dispatches alerts to external SMS, email, and push providers."
  - type: "component"
    name: "Preference & Consent Manager Component"
    technology: "Go"
    description: "Manages user notification preferences and consent records."
relationships:
  - source: "API Gateway"
    destination: "Preference & Consent Manager Component"
    description: "Routes user preference updates [gRPC/HTTPS]"
  - source: "Notification Router Component"
    destination: "Apache Kafka"
    description: "Consumes inbound notification events [Kafka protocol, TLS + SASL]"
  - source: "Preference & Consent Manager Component"
    destination: "PostgreSQL Database"
    description: "Queries consent records [SQL/TLS]"
  - source: "Channel Dispatcher Components"
    destination: "External Providers"
    description: "Dispatches alerts [HTTPS/SMTP, TLS 1.3]"
  - source: "Notification Container"
    destination: "Audit & Compliance Container"
    description: "Streams audit events [Kafka, TLS + SASL]"