level: component
scope: "Component diagram for the EMR Service Container container"
parentContainer:
  name: "EMR Service Container"
elements:
  - type: "component"
    name: "EMR Management Component"
    technology: "Go"
    description: "Manages clinical data and business logic for electronic medical records."
  - type: "component"
    name: "Access Control Enforcer Component"
    technology: "Go"
    description: "Enforces strict HIPAA/GDPR compliance and access control rules."
  - type: "component"
    name: "Timeline Aggregator Component"
    technology: "Go"
    description: "Aggregates and retrieves patient history and timelines."
relationships:
  - source: "EMR Management Component"
    destination: "PostgreSQL Database"
    description: "Persists clinical data [Encrypted AES-256 connection]"
  - source: "Timeline Aggregator Component"
    destination: "PostgreSQL Database"
    description: "Retrieves aggregated patient history [Encrypted connection]"
  - source: "Timeline Aggregator Component"
    destination: "Encrypted Redis Cache"
    description: "Retrieves cached patient history [Encrypted connection]"