level: component
scope: "Component diagram for the PostgreSQL Database container"
parentContainer:
  name: "PostgreSQL Database"
elements:
  - type: "component"
    name: "PostgreSQL 16 Relational Storage Engine"
    technology: "PostgreSQL 16"
    description: "Relational storage engine providing ACID compliance for core transactional workloads."
  - type: "component"
    name: "Patroni & Etcd Replication & HA Controller"
    technology: "Patroni + Etcd"
    description: "High availability and synchronous streaming replication across hybrid environments."
  - type: "component"
    name: "PgBouncer Connection Pooler"
    technology: "PgBouncer"
    description: "Connection pooling to handle high concurrency and stabilize P95 latencies."
  - type: "component"
    name: "pg_partman Partition Manager"
    technology: "pg_partman"
    description: "Time-based automated partitioning for audit trails and EMR records."
  - type: "component"
    name: "pgcrypto Encryption Module"
    technology: "pgcrypto"
    description: "AES-256 encryption at rest to meet security constraints."
  - type: "component"
    name: "pgaudit Audit Logging"
    technology: "pgaudit & Row-Level Security (RLS)"
    description: "Advanced auditing and granular data access controls for HIPAA/GDPR compliance."
  - type: "component"
    name: "Read-Only Reporting Replicas & Router"
    technology: "PostgreSQL Replica"
    description: "Read-only reporting replicas and router for billing specialists and reporting workloads."
relationships:
  - source: "Core/EMR Services"
    destination: "PgBouncer Connection Pooler"
    description: "SQL over TCP [TLS 1.3, mTLS]"
  - source: "PgBouncer Connection Pooler"
    destination: "PostgreSQL 16 Relational Storage Engine"
    description: "Local Unix Domain Socket / TCP [Encrypted]"
  - source: "Billing Specialist/Reporting"
    destination: "Read-Only Reporting Replicas & Router"
    description: "SQL over TCP [TLS 1.3]"
  - source: "PostgreSQL 16 Relational Storage Engine"
    destination: "Audit & Compliance Container"
    description: "Audit Logs [Encrypted Stream]"