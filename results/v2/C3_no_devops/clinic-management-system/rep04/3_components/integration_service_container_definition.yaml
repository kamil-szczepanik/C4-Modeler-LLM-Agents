level: component
scope: "Component diagram for the Integration Service Container container"
parentContainer:
  name: "Integration Service Container"
elements:
  - type: "component"
    name: "FHIR Gateway Component"
    technology: "HAPI FHIR library"
    description: "Handles HL7 FHIR API requests and standardization for healthcare interoperability."
  - type: "component"
    name: "Adapter & Transformation Engine"
    technology: "Apache Camel / Go middleware"
    description: "Transforms and adapts data formats between internal models and external standards."
  - type: "component"
    name: "Outbox & Retry Dispatcher"
    technology: "PostgreSQL outbox"
    description: "Ensures guaranteed delivery and manages message retries using a local outbox pattern."
  - type: "component"
    name: "Clearinghouse Adapter Component"
    technology: "Go / Spring Boot"
    description: "Submits claims and adjudications to insurance clearinghouses using X12 EDI over mTLS."
  - type: "component"
    name: "Integration Metrics Exporter"
    technology: "Prometheus / Micrometer"
    description: "Exports failure telemetry and metrics for system monitoring."
relationships:
  - source: "Integration Service Container"
    destination: "Lab & Imaging Systems"
    description: "Exchanges clinical data [REST/HTTPS, HL7 FHIR over mTLS]"
  - source: "Clearinghouse Adapter Component"
    destination: "Insurance Clearinghouses"
    description: "Submits claims and adjudications [REST/HTTPS over mTLS, X12 EDI]"
  - source: "Integration Service Container"
    destination: "Audit & Compliance Container"
    description: "Streams audit events [Kafka, TLS + SASL]"
  - source: "Integration Metrics Exporter"
    destination: "System Monitoring"
    description: "Scrapes failure telemetry [Prometheus, HTTP]"