level: component
scope: "Component diagram for the ClickHouse Database container"
parentContainer:
  name: "ClickHouse Database"
elements:
  - type: "component"
    name: "Storage Engine (MergeTree Family)"
    technology: "ReplacingMergeTree and ReplicatedMergeTree on NVMe storage"
    description: "Manages data storage and replication across nodes ensuring high availability and a 10-year data retention policy."
  - type: "component"
    name: "Security & Encryption Module"
    technology: "AES-256, Column-level masking, RLS, OIDC RBAC"
    description: "Enforces security policies, data encryption, row-level security, and role-based access control to satisfy HIPAA and GDPR."
  - type: "component"
    name: "Ingestion & Materialization Worker"
    technology: "Apache Kafka Stream Consumer"
    description: "Consumes streams from Apache Kafka for real-time operational analytics and auditing."
  - type: "component"
    name: "Distributed Query Processor"
    technology: "Vectorized query engine"
    description: "Executes analytical queries for sub-second responses."
  - type: "component"
    name: "Materialized View & Aggregation Engine"
    technology: "ClickHouse Aggregation Engine"
    description: "Pre-aggregates patient throughput and billing metrics."
relationships:
  - source: "Core Services Container"
    destination: "Storage Engine (MergeTree Family)"
    description: "Interacts via HTTPS (Port 8443) using mTLS"
  - source: "Audit & Compliance Container"
    destination: "Security & Encryption Module"
    description: "Interacts via ClickHouse Native Protocol / HTTPS (Port 9000/8443) using mTLS"
  - source: "Apache Kafka"
    destination: "Ingestion & Materialization Worker"
    description: "Streams data via ClickHouse Native Protocol"