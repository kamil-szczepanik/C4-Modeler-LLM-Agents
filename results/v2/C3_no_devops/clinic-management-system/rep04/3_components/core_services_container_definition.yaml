level: component
scope: "Component diagram for the Core Services Container container"
parentContainer:
  name: "Core Services Container"
elements:
  - type: "component"
    name: "PatientManagementModule"
    technology: "Spring Boot Java"
    description: "Captures patient demographics."
  - type: "component"
    name: "SchedulingModule"
    technology: "Spring Boot Java"
    description: "Handles appointment scheduling and resource clash checks."
  - type: "component"
    name: "BillingModule"
    technology: "Spring Boot Java"
    description: "Manages billing and insurance claim submission."
  - type: "component"
    name: "Redis Cache"
    technology: "Redis"
    description: "In-memory cache for scheduling locks."
  - type: "component"
    name: "PostgreSQL Database"
    technology: "PostgreSQL"
    description: "Persistent state storage."
  - type: "component"
    name: "Integration Service Container"
    technology: "External System Integration"
    description: "Handles external system integrations."
  - type: "component"
    name: "API Gateway"
    technology: "Gateway"
    description: "Routes requests to the Core Services Container."
  - type: "component"
    name: "Apache Kafka"
    technology: "Kafka"
    description: "Streams audit events."
relationships:
  - source: "API Gateway"
    destination: "Core Services Container"
    description: "Routes requests [gRPC/REST over Istio mTLS]"
  - source: "Core Services Container"
    destination: "Integration Service Container"
    description: "Copay & eligibility verification [gRPC over Istio mTLS]"
  - source: "Core Services Container"
    destination: "PostgreSQL Database"
    description: "Reads and writes core data [JDBC over TLS with HikariCP]"
  - source: "SchedulingModule"
    destination: "Redis Cache"
    description: "Fast resource clash validation [Redis Protocol over TLS with AUTH]"
  - source: "Core Services Container"
    destination: "Apache Kafka"
    description: "Streams audit events [Kafka Producer API, TLS + SASL]"