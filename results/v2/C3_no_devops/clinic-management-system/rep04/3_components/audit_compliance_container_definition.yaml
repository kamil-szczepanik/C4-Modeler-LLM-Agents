level: component
scope: "Component diagram for the Audit & Compliance Container container"
parentContainer:
  name: "Audit & Compliance Container"
elements:
  - type: "component"
    name: "Audit Ingestion Component"
    technology: "Go / Spring Boot"
    description: "Persists streaming logs from Apache Kafka into the compliance storage."
  - type: "component"
    name: "Compliance Storage & Indexing Component"
    technology: "ClickHouse Database"
    description: "Stores and indexes audit logs for high-throughput, searchable queries."
  - type: "component"
    name: "Audit Query & Reporting API Component"
    technology: "Go / Node.js"
    description: "Executes analytical queries against compliance storage for reporting."
  - type: "component"
    name: "Retention & Archival Manager Component"
    technology: "Go"
    description: "Manages partition rotation and archives aged logs with SHA-256 hashes to cold object storage."
relationships:
  - source: "Audit Ingestion Component"
    destination: "Compliance Storage & Indexing Component"
    description: "Persists streaming logs [ClickHouse Native Protocol, mTLS]"
  - source: "Audit Query & Reporting API Component"
    destination: "Compliance Storage & Indexing Component"
    description: "Executes analytical queries [SQL, mTLS]"
  - source: "Retention & Archival Manager Component"
    destination: "Compliance Storage & Indexing Component"
    description: "Manages partition rotation [SQL/Admin API]"
  - source: "Retention & Archival Manager Component"
    destination: "Object Storage (Cold)"
    description: "Archives aged logs with SHA-256 hashes [HTTPS/S3 API, AES-256]"