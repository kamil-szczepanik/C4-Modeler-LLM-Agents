level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing & Protocol Translation Engine"
    technology: "Kong / Envoy"
    description: "Handles API requests via HTTPS/WSS, edge routing, and protocol translation."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "OAuth2/OIDC + Open Policy Agent"
    description: "Performs token validation and authorization checks via internal in-memory hook."
  - type: "component"
    name: "Rate Limiting Module"
    technology: "Redis-backed Token Bucket"
    description: "Queries and enforces rate quotas via Redis RESP."
  - type: "component"
    name: "Audit & Tracing Interceptor"
    technology: "Envoy OpenTelemetry Plugin"
    description: "Streams logs and traces via Apache Kafka (TLS + SASL)."
relationships:
  - source: "Routing & Protocol Translation Engine"
    destination: "Authentication & Authorization Filter"
    description: "Delegates token validation via [Internal In-Memory Hook]"
  - source: "Authentication & Authorization Filter"
    destination: "Rate Limiting Module"
    description: "Queries rate quotas via [Redis RESP]"
  - source: "Audit & Tracing Interceptor"
    destination: "Routing & Protocol Translation Engine"
    description: "Monitors and intercepts traffic for telemetry and auditing"