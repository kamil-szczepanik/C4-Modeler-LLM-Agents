level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed for medium-sized hospitals and clinics to manage patient admissions, electronic medical records, appointment scheduling, and medical billing with high availability and strict compliance."
elements:
  - type: "person"
    name: "Patient"
    description: "End user who interacts with the system for appointments and records."
  - type: "person"
    name: "Clinic Staff/Receptionist"
    description: "User responsible for front-desk operations, patient admissions, and scheduling."
  - type: "person"
    name: "Clinician/Doctor"
    description: "Medical professional who accesses and updates electronic medical records."
  - type: "person"
    name: "Billing Specialist"
    description: "User who manages medical billing and financial transactions."
  - type: "person"
    name: "System Administrator"
    description: "Personnel responsible for managing and maintaining the system infrastructure."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "External diagnostic and imaging systems integration."
  - type: "externalSystem"
    name: "Insurance Clearinghouses"
    description: "External network for insurance claims processing."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External authentication and authorization service providing MFA."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External financial service for secure payment processing."
relationships:
  - source: "Patient"
    destination: "Clinic Management System"
    description: "Interacts via secure web & mobile client gateway"
    technology: "HTTPS / TLS 1.3"
  - source: "Clinic Staff/Receptionist"
    destination: "Clinic Management System"
    description: "Manages admissions and scheduling via secure gateway"
    technology: "HTTPS / TLS 1.3"
  - source: "Clinician/Doctor"
    destination: "Clinic Management System"
    description: "Accesses medical records and clinical workflows"
    technology: "HTTPS / TLS 1.3"
  - source: "Billing Specialist"
    destination: "Clinic Management System"
    description: "Handles billing and financial records"
    technology: "HTTPS / TLS 1.3"
  - source: "System Administrator"
    destination: "Clinic Management System"
    description: "Monitors and configures platform infrastructure"
    technology: "HTTPS / TLS 1.3"
  - source: "Clinic Management System"
    destination: "Lab & Imaging Systems"
    description: "Exchanges clinical data and lab results"
    technology: "HL7 FHIR over HTTPS (REST/JSON)"
  - source: "Clinic Management System"
    destination: "Insurance Clearinghouses"
    description: "Submits claims and billing information"
    technology: "X12 EDI over HTTPS"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users and enforces multi-factor authentication"
    technology: "OAuth2 / OIDC with MFA"
  - source: "Clinic Management System"
    destination: "Payment Gateway"
    description: "Processes payments securely with tokenization"
    technology: "HTTPS (REST/JSON) with tokenization and HMAC"