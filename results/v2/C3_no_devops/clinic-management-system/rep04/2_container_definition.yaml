level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patient"
    description: "End user who interacts with the system for appointments and records."
  - type: "person"
    name: "Clinic Staff/Receptionist"
    description: "User responsible for front-desk operations, patient admissions, and scheduling."
  - type: "person"
    name: "Clinician/Doctor"
    description: "Medical professional who accesses and updates electronic medical records."
  - type: "person"
    name: "Billing Specialist"
    description: "User who manages medical billing and financial transactions."
  - type: "person"
    name: "System Administrator"
    description: "Personnel responsible for managing and maintaining the system infrastructure."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "External diagnostic and imaging systems integration."
  - type: "externalSystem"
    name: "Insurance Clearinghouses"
    description: "External network for insurance claims processing."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External authentication and authorization service providing MFA."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External financial service for secure payment processing."
  - type: "container"
    name: "Frontend Container"
    technology: "React, TypeScript, CDN, Nginx"
    description: "Single Page Application served via CDN/Nginx for responsive user interfaces."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / Envoy, Istio Service Mesh"
    description: "Handles incoming traffic, routing, and Istio mTLS enforcement."
  - type: "container"
    name: "Core Services Container"
    technology: "Go, Spring Boot, Node.js"
    description: "Manages core business logic for patient admissions, scheduling, and billing."
  - type: "container"
    name: "EMR Service Container"
    technology: "Go, Spring Boot, Node.js"
    description: "Manages electronic medical records securely."
  - type: "container"
    name: "Integration Service Container"
    technology: "Go, Spring Boot, Node.js, HL7 FHIR APIs"
    description: "Integrates with external lab & imaging systems and clearinghouses."
  - type: "container"
    name: "Notification Container"
    technology: "Go, Spring Boot, Node.js"
    description: "Handles system notifications and alerts."
  - type: "container"
    name: "Audit & Compliance Container"
    technology: "Go, Spring Boot, Node.js, Kafka (TLS + SASL)"
    description: "Collects audit logs from all containers for compliance tracking."
  - type: "container"
    name: "PostgreSQL Database"
    technology: "PostgreSQL, AES-256"
    description: "Relational database for persistent storage with encryption."
  - type: "container"
    name: "ClickHouse Database"
    technology: "ClickHouse"
    description: "Analytical database for fast querying and reporting."
  - type: "container"
    name: "Apache Kafka"
    technology: "Apache Kafka, RabbitMQ"
    description: "Asynchronous event streaming broker for decoupled architecture."
relationships:
  - source: "Patient"
    destination: "Frontend Container"
    description: "Interacts with user interface"
    technology: "HTTPS/WSS"
  - source: "Clinic Staff/Receptionist"
    destination: "Frontend Container"
    description: "Manages patient admissions and scheduling"
    technology: "HTTPS/WSS"
  - source: "Clinician/Doctor"
    destination: "Frontend Container"
    description: "Accesses clinical workflows and medical records"
    technology: "HTTPS/WSS"
  - source: "Billing Specialist"
    destination: "Frontend Container"
    description: "Manages billing and financial workflows"
    technology: "HTTPS/WSS"
  - source: "System Administrator"
    destination: "Frontend Container"
    description: "Monitors and configures platform"
    technology: "HTTPS/WSS"
  - source: "Frontend Container"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS/WSS"
  - source: "API Gateway"
    destination: "Core Services Container"
    description: "Routes requests"
    technology: "gRPC/REST over Istio mTLS"
  - source: "API Gateway"
    destination: "EMR Service Container"
    description: "Routes requests"
    technology: "gRPC/REST over Istio mTLS"
  - source: "Integration Service Container"
    destination: "Lab & Imaging Systems"
    description: "Exchanges clinical data"
    technology: "HL7 FHIR APIs"
  - source: "Core Services Container"
    destination: "Audit & Compliance Container"
    description: "Streams audit events"
    technology: "Kafka, TLS + SASL"
  - source: "EMR Service Container"
    destination: "Audit & Compliance Container"
    description: "Streams audit events"
    technology: "Kafka, TLS + SASL"
  - source: "Integration Service Container"
    destination: "Audit & Compliance Container"
    description: "Streams audit events"
    technology: "Kafka, TLS + SASL"
  - source: "Notification Container"
    destination: "Audit & Compliance Container"
    description: "Streams audit events"
    technology: "Kafka, TLS + SASL"
  - source: "Core Services Container"
    destination: "PostgreSQL Database"
    description: "Reads and writes core data"
    technology: "Encrypted connection (AES-256)"
  - source: "EMR Service Container"
    destination: "PostgreSQL Database"
    description: "Reads and writes EMR data"
    technology: "Encrypted connection (AES-256)"