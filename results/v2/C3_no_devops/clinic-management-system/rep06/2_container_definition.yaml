# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Clinic Receptionist"
    description: "Handles patient admissions, registration, and front-desk scheduling."
  - type: "person"
    name: "Physician"
    description: "Accesses and updates electronic medical records and manages patient care."
  - type: "person"
    name: "Billing Specialist"
    description: "Manages billing, claims, and payment processing."
  - type: "person"
    name: "Administrator"
    description: "Manages administrative settings, roles, and overall clinic operations."
  - type: "person"
    name: "Patient"
    description: "Interacts with the clinic for appointments, records, and payments."
  - type: "externalSystem"
    name: "Enterprise IdP"
    description: "Provides authentication, rate limiting, and MFA termination."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems for diagnostic laboratory and imaging data exchange."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Handles real-time insurance claims and financial transactions."
  - type: "externalSystem"
    name: "Audit Archival / SIEM System"
    description: "Receives encrypted audit logs and handles WORM-compliant data retention."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / Node.js"
    description: "Handles rate limiting, MFA termination, and routing."
  - type: "container"
    name: "Patient Portal BFF"
    technology: "Node.js / GraphQL"
    description: "Provides secure, consumer-grade user interfaces and BFF capabilities for patients."
  - type: "container"
    name: "Billing Operations UI Container"
    technology: "React / Nginx"
    description: "Provides the frontend interface for billing operations and administration."
  - type: "container"
    name: "Patient & Scheduling Service"
    technology: "Go"
    description: "Manages patient admissions, registration, and appointment scheduling."
  - type: "container"
    name: "EMR Core Service"
    technology: "Spring Boot"
    description: "Core service managing Electronic Medical Records and PHI storage."
  - type: "container"
    name: "Billing & Integration Service"
    technology: "FastAPI"
    description: "Handles billing operations and integration with external lab, imaging, and payment systems."
  - type: "container"
    name: "PostgreSQL"
    technology: "PostgreSQL (AES-256)"
    description: "Encrypted data store for PHI and relational data."
  - type: "container"
    name: "RabbitMQ"
    technology: "RabbitMQ"
    description: "Message broker for offline-resilient queuing and asynchronous processing."
relationships:
  - source: "Clinic Receptionist"
    destination: "API Gateway"
    description: "Accesses system features"
    technology: "HTTPS/REST with JWT"
  - source: "Physician"
    destination: "API Gateway"
    description: "Accesses EMR and clinical features"
    technology: "HTTPS/REST with JWT"
  - source: "Billing Specialist"
    destination: "API Gateway"
    description: "Accesses billing operations"
    technology: "HTTPS/REST with JWT"
  - source: "Administrator"
    destination: "API Gateway"
    description: "Manages system configurations"
    technology: "HTTPS/REST with JWT"
  - source: "Patient"
    destination: "Patient Portal BFF"
    description: "Views personal health records and schedule"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "Patient Portal BFF"
    description: "Routes patient portal requests"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Billing Operations UI Container"
    description: "Routes billing operations UI traffic"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Patient & Scheduling Service"
    description: "Routes core scheduling requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "EMR Core Service"
    description: "Routes EMR requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Billing & Integration Service"
    description: "Routes billing requests"
    technology: "gRPC over mTLS"
  - source: "Patient Portal BFF"
    destination: "Patient & Scheduling Service"
    description: "Fetches patient and scheduling data"
    technology: "gRPC over mTLS"
  - source: "Billing Operations UI Container"
    destination: "Billing & Integration Service"
    description: "Communicates for billing operations"
    technology: "HTTPS/REST with JWT"
  - source: "Patient & Scheduling Service"
    destination: "PostgreSQL"
    description: "Reads and writes patient data"
    technology: "SQL / AES-256"
  - source: "EMR Core Service"
    destination: "PostgreSQL"
    description: "Reads and writes EMR data"
    technology: "SQL / AES-256"
  - source: "Billing & Integration Service"
    destination: "PostgreSQL"
    description: "Reads and writes billing data"
    technology: "SQL / AES-256"
  - source: "Billing & Integration Service"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical and diagnostic data"
    technology: "HL7 FHIR APIs"
  - source: "Billing & Integration Service"
    destination: "Payment Gateway"
    description: "Processes financial transactions and claims"
    technology: "HTTPS/REST"
  - source: "EMR Core Service"
    destination: "Audit Archival / SIEM System"
    description: "Sends asynchronous append-only logs"
    technology: "Asynchronous Syslog/HTTPS"
  - source: "EMR Core Service"
    destination: "RabbitMQ"
    description: "Publishes asynchronous events"
    technology: "AMQP"
  - source: "Patient & Scheduling Service"
    destination: "RabbitMQ"
    description: "Publishes and consumes queued messages"
    technology: "AMQP"
  - source: "Billing & Integration Service"
    destination: "RabbitMQ"
    description: "Publishes and consumes billing events"
    technology: "AMQP"