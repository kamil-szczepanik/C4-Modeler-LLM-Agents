# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "Enterprise healthcare platform that handles patient admissions, electronic medical records, scheduling, and billing for medium-sized clinics, ensuring HIPAA/GDPR compliance, 99.99% availability, and a 10-year data retention policy across a hybrid cloud deployment."
elements:
  - type: "person"
    name: "Clinic Receptionist / Patient Registrar"
    description: "Handles patient admissions, registration, and front-desk scheduling."
  - type: "person"
    name: "Physician / Clinician"
    description: "Accesses and updates electronic medical records and manages patient care."
  - type: "person"
    name: "Billing Specialist"
    description: "Manages billing, claims, and payment processing."
  - type: "person"
    name: "Clinic Administrator"
    description: "Manages administrative settings, roles, and overall clinic operations."
  - type: "person"
    name: "Patient"
    description: "Interacts with the clinic for appointments, records, and payments."
  - type: "system"
    name: "Clinic Management System (CMS)"
    description: "Core enterprise healthcare platform providing EMR, scheduling, and billing."
  - type: "externalSystem"
    name: "Enterprise Identity Provider (IdP)"
    description: "Provides authentication and Role-Based Access Control (RBAC)."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems for diagnostic laboratory and imaging data exchange."
  - type: "externalSystem"
    name: "Payment Gateway / Insurance Clearinghouse"
    description: "Handles real-time insurance claims and financial transactions."
  - type: "externalSystem"
    name: "Audit Archival / SIEM System"
    description: "Receives encrypted audit logs and handles WORM-compliant data retention."
relationships:
  - source: "Clinic Receptionist / Patient Registrar"
    destination: "Clinic Management System (CMS)"
    description: "Performs patient admissions and scheduling"
    technology: "HTTPS/REST over TLS 1.3 with Multi-Factor Authentication"
  - source: "Physician / Clinician"
    destination: "Clinic Management System (CMS)"
    description: "Accesses and updates electronic medical records"
    technology: "HTTPS/REST over TLS 1.3 with Multi-Factor Authentication"
  - source: "Billing Specialist"
    destination: "Clinic Management System (CMS)"
    description: "Processes billing and claims"
    technology: "HTTPS/REST over TLS 1.3 with Multi-Factor Authentication"
  - source: "Clinic Administrator"
    destination: "Clinic Management System (CMS)"
    description: "Manages system administration and access controls"
    technology: "HTTPS/REST over TLS 1.3 with Multi-Factor Authentication"
  - source: "Patient"
    destination: "Clinic Management System (CMS)"
    description: "Views personal health records and appointment details"
    technology: "HTTPS/REST over TLS 1.3 with Multi-Factor Authentication"
  - source: "Clinic Management System (CMS)"
    destination: "Enterprise Identity Provider (IdP)"
    description: "Authenticates users and enforces RBAC"
    technology: "OIDC/SAML"
  - source: "Clinic Management System (CMS)"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical data and lab results"
    technology: "HL7 FHIR REST APIs over TLS 1.3"
  - source: "Clinic Management System (CMS)"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Submits real-time claims and processes financial transactions"
    technology: "HTTPS/REST"
  - source: "Clinic Management System (CMS)"
    destination: "Audit Archival / SIEM System"
    description: "Sends audit logs for security monitoring and long-term retention"
    technology: "Encrypted Syslog/HTTPS with HMAC-signed log packets"