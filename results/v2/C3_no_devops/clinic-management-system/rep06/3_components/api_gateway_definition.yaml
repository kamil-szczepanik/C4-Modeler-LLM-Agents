level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Kong Plugin / Node.js"
    description: "Validates JWT tokens and enforces access control policies for incoming requests."
  - type: "component"
    name: "Rate Limiting & Throttling Engine"
    technology: "Kong / Redis"
    description: "Powers persona-based rate limiting and throttling quotas using Redis."
  - type: "component"
    name: "Routing & Load Balancing Proxy"
    technology: "Kong / Node.js"
    description: "Routes frontend traffic and proxies backend requests using gRPC over mTLS."
  - type: "component"
    name: "Audit & Telemetry Interceptor"
    technology: "Kong Plugin"
    description: "Asynchronously emits access logs to the external SIEM system via HTTPS."
  - type: "component"
    name: "Edge WAF & Sanitization Filter"
    technology: "Kong Security Plugin"
    description: "Provides edge security controls and input sanitization."
  - type: "component"
    name: "Tenant & Usage Metering Component"
    technology: "Kong / Node.js"
    description: "Tracks usage metrics and multi-tenant activity."
relationships:
  - source: "Authentication & Authorization Filter"
    destination: "Routing & Load Balancing Proxy"
    description: "Allows authorized traffic to pass through for routing"
  - source: "Rate Limiting & Throttling Engine"
    destination: "Routing & Load Balancing Proxy"
    description: "Enforces traffic throttling rules"
  - source: "Edge WAF & Sanitization Filter"
    destination: "Authentication & Authorization Filter"
    description: "Inspects and sanitizes incoming HTTP traffic first"
  - source: "Audit & Telemetry Interceptor"
    destination: "SIEM System"
    description: "Asynchronously emits access logs [HTTPS]"
  - source: "Routing & Load Balancing Proxy"
    destination: "Patient Portal BFF & Billing Operations UI"
    description: "Routes frontend traffic [HTTPS]"
  - source: "Routing & Load Balancing Proxy"
    destination: "Patient & Scheduling, EMR Core, and Billing Services"
    description: "Proxies backend requests [gRPC over mTLS]"