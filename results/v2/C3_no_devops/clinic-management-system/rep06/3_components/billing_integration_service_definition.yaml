level: component
scope: "Component diagram for the Billing & Integration Service container"
parentContainer:
  name: "Billing & Integration Service"
elements:
  - type: "component"
    name: "Billing API Controller"
    technology: "FastAPI / Python"
    description: "Handles high-throughput asynchronous API endpoints and invokes claim generation with user context."
  - type: "component"
    name: "Claim Processing Engine"
    technology: "Python / SQLAlchemy"
    description: "Processes claims and orchestrates data persistence and audit logging."
  - type: "component"
    name: "FHIR Integration Adapter"
    technology: "HL7 FHIR / Python"
    description: "Transmits diagnostic data to external clinical and imaging systems using HL7 FHIR APIs over mTLS."
  - type: "component"
    name: "Payment & Reconciliation Worker"
    technology: "Python / RabbitMQ"
    description: "Executes financial transactions and processes billing events asynchronously with DLQ fallback."
  - type: "component"
    name: "Billing Data Repository Layer"
    technology: "SQLAlchemy ORM / PostgreSQL"
    description: "Manages secure database mapping, connection management, and AES-256 encrypted persistence."
relationships:
  - source: "Billing API Controller"
    destination: "Claim Processing Engine"
    description: "Invokes claim generation with user context [Python async call]"
  - source: "Claim Processing Engine"
    destination: "Billing Data Repository Layer"
    description: "Persists data and audit logs [SQLAlchemy / AES-256]"
  - source: "Payment & Reconciliation Worker"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Executes financial transactions [HTTPS/REST with mTLS & OAuth2]"
  - source: "FHIR Integration Adapter"
    destination: "External Lab & Imaging Systems"
    description: "Transmits diagnostic data [HL7 FHIR APIs over mTLS]"
  - source: "Payment & Reconciliation Worker"
    destination: "RabbitMQ"
    description: "Processes billing events with DLQ fallback [AMQP]"