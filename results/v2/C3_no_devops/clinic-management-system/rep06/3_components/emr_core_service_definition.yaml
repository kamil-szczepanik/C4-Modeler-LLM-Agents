level: component
scope: "Component diagram for the EMR Core Service container"
parentContainer:
  name: "EMR Core Service"
elements:
  - type: "component"
    name: "EMR API Controller"
    technology: "Spring WebFlux/gRPC, Spring Security"
    description: "Exposes secure endpoints for patient admissions, electronic medical records, and rapid data access."
  - type: "component"
    name: "Clinical Record Manager"
    technology: "Spring Service"
    description: "Core component managing EMR business logic, optimization, and validation."
  - type: "component"
    name: "Audit & Compliance Interceptor"
    technology: "Spring AOP, non-blocking disruptor queue"
    description: "Utilizes a non-blocking disruptor queue for asynchronous audit logging to ensure strict regulatory compliance."
  - type: "component"
    name: "Data Access Repository"
    technology: "Spring Data JPA, PostgreSQL"
    description: "Data access layer utilizing PostgreSQL with AES-256 storage and envelope encryption."
  - type: "component"
    name: "Event Publisher"
    technology: "Spring AMQP"
    description: "Dispatches signed domain events to RabbitMQ."
  - type: "component"
    name: "Caching Proxy"
    technology: "Redis"
    description: "High-performance in-memory cache utilizing Redis with client-side field-level encryption."
relationships:
  - source: "EMR API Controller"
    destination: "Clinical Record Manager"
    description: "In-process gRPC/Method call"
  - source: "Clinical Record Manager"
    destination: "Caching Proxy"
    description: "In-process Redis read-through"
  - source: "Clinical Record Manager"
    destination: "Data Access Repository"
    description: "JPA/SQL with AES-256"
  - source: "Clinical Record Manager"
    destination: "Audit & Compliance Interceptor"
    description: "Method Interception via Spring AOP"
  - source: "Audit & Compliance Interceptor"
    destination: "Audit Archival / SIEM System"
    description: "Asynchronous Syslog/HTTPS"
  - source: "Clinical Record Manager"
    destination: "Event Publisher"
    description: "AMQP event dispatch"