level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "Primary Engine"
    technology: "PostgreSQL 16"
    description: "Handles primary transactional data queries and updates."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Manages connection pooling to maintain sub-second EMR load times."
  - type: "component"
    name: "Patroni Standby Nodes"
    technology: "Patroni / PgBackRest"
    description: "Provides high-availability and standby nodes for replication."
  - type: "component"
    name: "pgAudit"
    technology: "pgAudit"
    description: "Ensures security auditing for HIPAA and GDPR compliance."
  - type: "component"
    name: "Debezium CDC Worker"
    technology: "Debezium"
    description: "Publishes row changes via CDC for asynchronous event streaming."
relationships:
  - source: "PgBouncer"
    destination: "Primary Engine"
    description: "Routes queries and updates transactional data [SQL over TLS / SCRAM-SHA-256]"
  - source: "Primary Engine"
    destination: "Patroni Standby Nodes"
    description: "Replicates transactional data [TCP Binary Streaming]"
  - source: "Primary Engine"
    destination: "Debezium CDC Worker"
    description: "Publishes row changes [pgoutput / TCP]"
  - source: "Primary Engine"
    destination: "pgAudit"
    description: "Logs database activities and access for compliance"