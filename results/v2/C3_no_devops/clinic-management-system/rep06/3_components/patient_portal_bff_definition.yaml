level: component
scope: "Component diagram for the Patient Portal BFF container"
parentContainer:
  name: "Patient Portal BFF"
elements:
  - type: "component"
    name: "GraphQL API Server"
    technology: "Node.js, Apollo Server"
    description: "Powers the Patient Portal BFF for efficient, tailored data payloads and handles incoming client requests."
  - type: "component"
    name: "Cache Manager"
    technology: "Redis"
    description: "Caches read-heavy static clinical data with AES-256 encryption at rest."
relationships:
  - source: "GraphQL API Server"
    destination: "Cache Manager"
    description: "Reads and writes cached clinical data [Redis Protocol]"
  - source: "GraphQL API Server"
    destination: "Patient & Scheduling Service"
    description: "Fetches scheduling data [gRPC over mTLS]"
  - source: "GraphQL API Server"
    destination: "EMR Core Service"
    description: "Fetches medical records [gRPC over mTLS]"