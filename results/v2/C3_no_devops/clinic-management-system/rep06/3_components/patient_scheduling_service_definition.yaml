level: component
scope: "Component diagram for the Patient & Scheduling Service container"
parentContainer:
  name: "Patient & Scheduling Service"
elements:
  - type: "component"
    name: "Patient Registry Controller"
    technology: "Go (Gin/Protobuf)"
    description: "Component for patient registration."
  - type: "component"
    name: "Scheduling Engine"
    technology: "Go"
    description: "Component executing appointment logic and resource clash checks."
  - type: "component"
    name: "Policy Enforcer"
    technology: "Go"
    description: "Component evaluating cancellation rules and receptionist override permissions."
  - type: "component"
    name: "Waitlist Manager"
    technology: "Go"
    description: "Component managing waitlist promotion logic."
  - type: "component"
    name: "Event Publisher"
    technology: "Go (AMQP client)"
    description: "Component dispatching domain and waitlist events."
  - type: "component"
    name: "Data Access Repository"
    technology: "Go (pgx/sqlc)"
    description: "Component interfacing with PostgreSQL."
  - type: "component"
    name: "RabbitMQ"
    technology: "Message broker (AMQPS)"
    description: "Asynchronous broker using AMQPS for secure event-driven workflows."
  - type: "component"
    name: "PostgreSQL"
    technology: "PostgreSQL with AES-256 encryption at rest"
    description: "Primary database providing serializable isolation levels to prevent double-booking."
relationships:
  - source: "API Gateway & Patient Portal BFF"
    destination: "Patient Registry Controller"
    description: "Routes requests via gRPC over mTLS with JWT/OAuth2 RBAC."
  - source: "API Gateway & Patient Portal BFF"
    destination: "Scheduling Engine"
    description: "Routes requests via gRPC over mTLS with JWT/OAuth2 RBAC."
  - source: "Scheduling Engine"
    destination: "Policy Enforcer"
    description: "Evaluates rules via in-memory function calls."
  - source: "Policy Enforcer"
    destination: "Waitlist Manager"
    description: "Triggers promotions via in-memory function calls."
  - source: "Waitlist Manager"
    destination: "Event Publisher"
    description: "Dispatches promotion events via in-memory calls."
  - source: "Event Publisher"
    destination: "RabbitMQ"
    description: "Publishes messages via AMQPS (TLS-encrypted AMQP) with field-level PII encryption."
  - source: "Scheduling Engine"
    destination: "Data Access Repository"
    description: "Executes queries with serializable isolation via SQL / TLS."