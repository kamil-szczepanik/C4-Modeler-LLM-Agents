level: component
scope: "Component diagram for the RabbitMQ container"
parentContainer:
  name: "RabbitMQ"
elements:
  - type: "component"
    name: "Erlang/RabbitMQ Core"
    technology: "Erlang/Ranch, AMQP 0-9-1"
    description: "Manages direct and topic exchanges, connection listening, and core message routing."
  - type: "component"
    name: "RabbitMQ Quorum Queues"
    technology: "Raft Consensus"
    description: "Provides durable, highly available queues guaranteeing zero data loss across nodes."
  - type: "component"
    name: "auth_backend_oauth2"
    technology: "OAuth2 / LDAP"
    description: "Enforces role-based and attribute-based access control integrated with the Enterprise IdP."
  - type: "component"
    name: "RabbitMQ Webhooks / Shovel plugin"
    technology: "HTTPS"
    description: "Facilitates secure integration routes and forwards dead-lettered payloads."
  - type: "component"
    name: "DLQ Notification Worker"
    technology: "Python/FastAPI"
    description: "Processes dead-lettered payloads to generate business and administrative alerts."
  - type: "component"
    name: "Enterprise Identity Provider (IdP)"
    technology: "External Security System"
    description: "Authenticates users and validates access permissions."
  - type: "component"
    name: "SIEM System"
    technology: "External Security System"
    description: "Receives real-time audit logs for compliance monitoring."
  - type: "component"
    name: "EMR, Scheduling, & Billing Services"
    technology: "AMQP 0-9-1, TLS 1.3 / mTLS"
    description: "External services that publish and consume asynchronous events."
relationships:
  - source: "EMR, Scheduling, & Billing Services"
    destination: "Erlang/RabbitMQ Core"
    description: "Publishes and consumes asynchronous events via AMQP 0-9-1 using TLS 1.3 / mTLS."
  - type: "component"
    source: "Erlang/RabbitMQ Core"
    destination: "Enterprise Identity Provider (IdP)"
    description: "Validates access permissions using auth_backend_oauth2."
  - type: "component"
    source: "RabbitMQ Webhooks / Shovel plugin"
    destination: "DLQ Notification Worker"
    description: "Forwards dead-lettered payloads via HTTPS webhooks."
  - type: "component"
    source: "Erlang/RabbitMQ Core"
    destination: "SIEM System"
    description: "Forwards real-time audit logs over TLS."