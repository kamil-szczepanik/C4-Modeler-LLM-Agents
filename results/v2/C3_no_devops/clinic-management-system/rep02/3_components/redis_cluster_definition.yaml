level: component
scope: "Component diagram for the Redis Cluster container"
parentContainer:
  name: "Redis Cluster"
elements:
  - type: "component"
    name: "Primary Master Nodes"
    technology: "In-memory Redis"
    description: "Handles caching scheduling states, locks, and distributed slot allocation for low-latency scheduling."
  - type: "component"
    name: "Replica / Failover Nodes"
    technology: "In-memory Redis"
    description: "Provides data replication and cluster heartbeat for high availability."
  - type: "component"
    name: "TLS Termination Module"
    technology: "Redis TLS Module"
    description: "Ensures secure transport and strict HIPAA/GDPR compliance via TLS v1.3 with mTLS."
  - type: "component"
    name: "Policy & Eviction Manager"
    technology: "Redis Policy Engine"
    description: "Manages memory limits, data eviction policies, and cluster caching lifecycles."
relationships:
  - source: "Primary Master Nodes"
    destination: "Replica / Failover Nodes"
    description: "Data replication and cluster heartbeat [Redis Cluster Bus protocol over TLS]"
  - source: "TLS Termination Module"
    destination: "Primary Master Nodes"
    description: "Terminates incoming encrypted connections [TLS v1.3 with mTLS]"