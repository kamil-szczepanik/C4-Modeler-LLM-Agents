level: component
scope: "Component diagram for the Apache Kafka container"
parentContainer:
  name: "Apache Kafka"
elements:
  - type: "component"
    name: "Kafka Brokers"
    technology: "Apache Kafka Core / KRaft mode"
    description: "Event-driven backbone managing asynchronous audit streaming, billing, and patient registration."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry"
    description: "Enforces Avro schemas for backward/forward data compatibility."
  - type: "component"
    name: "Kafka Connect"
    technology: "Confluent Kafka Connect"
    description: "Integrates directly with Cold Storage for compliance archiving."
  - type: "component"
    name: "Kafka Monitoring & Metrics Exporter"
    technology: "JMX Exporter / Prometheus Operator"
    description: "Enables real-time consumer lag monitoring and metric scraping."
relationships:
  - source: "EMR Backend Container"
    destination: "Kafka Brokers"
    description: "Streams immutable audit logs [Binary Kafka Wire Protocol over TLS 1.3, mTLS, SASL/SCRAM]"
  - source: "Patient Self-Service Container"
    destination: "Kafka Brokers"
    description: "Publishes patient registration and demographic events [Binary Kafka Wire Protocol over TLS 1.3]"
  - source: "Billing Container"
    destination: "Kafka Brokers"
    description: "Decouples insurance claim submissions [Binary Kafka Wire Protocol over TLS 1.3]"
  - source: "Kafka Connect"
    destination: "Cold Storage"
    description: "Sinks compliance logs for >= 10-year retention [WORM storage policies]"
  - source: "Kafka Monitoring & Metrics Exporter"
    destination: "Prometheus/Monitoring Stack"
    description: "Scrapes broker metrics and consumer lag [HTTP over TLS]"