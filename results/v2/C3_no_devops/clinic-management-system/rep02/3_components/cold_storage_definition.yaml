level: component
scope: "Component diagram for the Cold Storage container"
parentContainer:
  name: "Cold Storage"
elements:
  - type: "component"
    name: "Go-based Archival Worker Component"
    technology: "Go"
    description: "Powers lightweight archival and background worker processes."
  - type: "component"
    name: "Retrieval API Component"
    technology: "Go / REST API"
    description: "Handles retrieval requests and enqueues hydration tasks."
  - type: "component"
    name: "Job Orchestration Component"
    technology: "AWS SQS / Redis"
    description: "Manages and orchestrates restoration and hydration jobs."
  - type: "component"
    name: "Data Transformation Component"
    technology: "Parser Module"
    description: "Transforms and parses archived data."
  - type: "component"
    name: "Storage Engine"
    technology: "AWS S3 Glacier Flexible Retrieval / Ceph Object Storage"
    description: "Ensures secure, cost-effective long-term data retention with WORM immutability."
  - type: "component"
    name: "Audit & Compliance Daemon Container"
    technology: "Containerized Daemon"
    description: "Delivers decrypted historical records and enforces compliance."
relationships:
  - source: "EMR Database"
    destination: "Storage Engine"
    description: "Asynchronously streams partitioned Parquet files via TLS 1.3"
  - source: "Retrieval API Component"
    destination: "Job Orchestration Component"
    description: "Enqueues hydration tasks via Internal IPC / Redis"
  - source: "Job Orchestration Component"
    destination: "Storage Engine"
    description: "Initiates restoration jobs via AWS SDK / S3 API over TLS 1.3"
  - source: "Retrieval API Component"
    destination: "Audit & Compliance Daemon Container"
    description: "Delivers decrypted historical records via HTTPS / mTLS"