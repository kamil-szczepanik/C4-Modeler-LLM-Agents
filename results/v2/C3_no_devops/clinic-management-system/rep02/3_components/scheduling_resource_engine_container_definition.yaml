level: component
scope: "Component diagram for the Scheduling & Resource Engine Container container"
parentContainer:
  name: "Scheduling & Resource Engine Container"
elements:
  - type: "component"
    name: "Appointment API Controller"
    technology: "Java Spring Boot"
    description: "Routes booking requests and handles appointment API endpoints."
  - type: "component"
    name: "Resource Conflict Validator"
    technology: "Java Spring Boot"
    description: "Validates resource availability and checks for scheduling conflicts."
  - type: "component"
    name: "Distributed Lock Manager"
    technology: "Redis Cluster with Redisson client"
    description: "Provides atomic locking and state caching for real-time race-condition prevention."
  - type: "component"
    name: "Schedule Event Publisher"
    technology: "Java Spring Boot / Apache Kafka"
    description: "Emits sanitized schedule events to the message broker."
  - type: "component"
    name: "Resource Calendar Service"
    technology: "Java Spring Boot / JPA"
    description: "Manages resource calendars and queries availability."
relationships:
  - source: "Distributed Lock Manager"
    destination: "Redis Cluster"
    description: "Atomic locking & state caching [Encrypted TLS / Redisson over TCP]"
  - source: "Resource Conflict Validator"
    destination: "Resource Calendar Service"
    description: "Query availability [Internal JPA/SQL over JDBC with TLS 1.3]"
  - source: "Schedule Event Publisher"
    destination: "Apache Kafka"
    description: "Emit sanitized schedule events [TCP / SASL over TLS]"