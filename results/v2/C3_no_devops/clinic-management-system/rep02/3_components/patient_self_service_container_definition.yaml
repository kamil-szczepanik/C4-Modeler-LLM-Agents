level: component
scope: "Component diagram for the Patient Self-Service Container container"
parentContainer:
  name: "Patient Self-Service Container"
elements:
  - type: "component"
    name: "Patient"
    technology: "User Persona"
    description: "Interacts with the web portal for registration, scheduling, and billing."
  - type: "component"
    name: "Patient Self-Service Container"
    technology: "React / Next.js SPA"
    description: "Provides a secure, accessible web portal for patient registration, scheduling, and billing."
  - type: "component"
    name: "Routing & Session Component"
    technology: "Next.js Router / Custom Middleware"
    description: "Handles application routing and session state management."
  - type: "component"
    name: "Authentication & Consent Controller"
    technology: "JWT & TLS 1.3 / Security Middleware"
    description: "Manages secure session management, authentication, and zero PHI persistence at the edge."
  - type: "component"
    name: "Appointment & Demographics Client Service"
    technology: "React / TanStack Query"
    description: "Handles form validation and in-memory form state caching with optimistic UI updates."
  - type: "component"
    name: "Billing & Payment Widget Integration"
    technology: "JavaScript SDK / Embedded Widget"
    description: "Integrates billing and payment processing capabilities."
  - type: "component"
    name: "API Gateway"
    technology: "Kong / Nginx"
    description: "Routes and protects backend communications via internal mTLS."
  - type: "component"
    name: "CDN / Edge WAF"
    technology: "AWS CloudFront / Cloudflare + Kubernetes"
    description: "Protects and routes static assets and SSR routes ensuring 99.99% high availability."
relationships:
  - source: "Patient"
    destination: "Patient Self-Service Container"
    description: "Interacts via HTTPS (TLS 1.3)"
  - source: "Patient Self-Service Container"
    destination: "API Gateway"
    description: "Communicates via internal mTLS over gRPC/REST"
  - source: "CDN / Edge WAF"
    destination: "Patient Self-Service Container"
    description: "Protects and routes static assets and SSR routes"