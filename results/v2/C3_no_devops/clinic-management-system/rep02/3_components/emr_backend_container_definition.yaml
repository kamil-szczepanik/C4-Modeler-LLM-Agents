level: component
scope: "Component diagram for the EMR Backend Container container"
parentContainer:
  name: "EMR Backend Container"
elements:
  - type: "component"
    name: "EMR REST/gRPC Controller"
    technology: "Java Spring Boot 3"
    description: "Handles incoming REST and gRPC requests for EMR operations."
  - type: "component"
    name: "Clinical Record Service"
    technology: "Spring Data JPA"
    description: "Manages clinical records and provides optimistic locking for concurrent chart updates."
  - type: "component"
    name: "Audit Interceptor"
    technology: "Java Spring Boot"
    description: "Intercepts requests and actions to maintain compliance and audit logs."
  - type: "component"
    name: "Clinical Summary Aggregator"
    technology: "Java Spring Boot"
    description: "Aggregates clinical summaries for high-performance retrieval."
  - type: "component"
    name: "HashiCorp Vault Agent Sidecar"
    technology: "HashiCorp Vault"
    description: "Secures dynamic secret injection and ephemeral tokens at container startup."
relationships:
  - source: "EMR REST/gRPC Controller"
    destination: "Clinical Record Service"
    description: "In-process method calls"
  - type: "component"
    name: "EMR Database"
    technology: "PostgreSQL with RLS"
    description: "Enforces row-level security for HIPAA/GDPR patient isolation."
  - type: "component"
    name: "Redis Cluster"
    technology: "Redis"
    description: "Delivers sub-second P95 load times for cached clinical summaries."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Secures dynamic secret injection at container startup."
  - source: "Clinical Record Service"
    destination: "EMR Database"
    description: "JDBC over TLS with connection pooling"
  - source: "Clinical Summary Aggregator"
    destination: "Redis Cluster"
    description: "Redis protocol over TLS"
  - source: "EMR Backend Container"
    destination: "HashiCorp Vault"
    description: "Ephemeral tokens via sidecar"