level: component
scope: "Component diagram for the Integration Broker Container container"
parentContainer:
  name: "Integration Broker Container"
elements:
  - type: "component"
    name: "Route Orchestrator"
    technology: "Apache Camel Context"
    description: "Orchestrates integration routes and message flow."
  - type: "component"
    name: "Data Transformer Engine"
    technology: "Data Transformation Engine"
    description: "Transforms payloads between different message formats."
  - type: "component"
    name: "DLQ & Retry Manager"
    technology: "DLQ & Retry Manager"
    description: "Manages failed transactions and executes retry logic."
  - type: "component"
    name: "Broker Management API"
    technology: "Broker Management API"
    description: "Provides management and monitoring interfaces for the broker."
relationships:
  - source: "Route Orchestrator"
    destination: "Data Transformer Engine"
    description: "Transforms payloads [In-memory Java method call]"
  - source: "Route Orchestrator"
    destination: "DLQ & Retry Manager"
    description: "Forwards failed transactions [Kafka Producer / Internal Topic]"