level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Ingress Controller"
    technology: "Kong / Nginx"
    description: "Routes incoming external traffic into the internal microservices network."
  - type: "component"
    name: "Auth Filter"
    technology: "OAuth2 / OIDC / JWT / MFA"
    description: "Validates tokens, manages authentication, and enforces security policies."
  - type: "component"
    name: "Rate Limiter"
    technology: "Redis Protocol / TCP"
    description: "Prevents abuse by limiting the rate of incoming requests using the Redis cluster."
  - type: "component"
    name: "WAF"
    technology: "Coraza / ModSecurity"
    description: "Web Application Firewall for payload sanitization and threat protection."
  - type: "component"
    name: "Analytics Forwarder"
    technology: "gRPC"
    description: "Streams sanitized events to the audit and compliance daemon."
relationships:
  - source: "Auth Filter"
    destination: "Redis Cluster"
    description: "Token validation and rate limiting [TCP/Redis Protocol]"
  - source: "Analytics Forwarder"
    destination: "Audit & Compliance Daemon Container"
    description: "Stream sanitized events [gRPC]"