level: component
scope: "Component diagram for the EMR Database container"
parentContainer:
  name: "EMR Database"
elements:
  - type: "component"
    name: "Relational Storage Engine"
    technology: "PostgreSQL Cluster with synchronous streaming replication, Row-Level Security (RLS), and declarative table partitioning"
    description: "Primary relational database providing multi-tenancy, fast archiving, and routing of reads and writes."
  - type: "component"
    name: "Audit Logging Subsystem"
    technology: "PostgreSQL pgAudit"
    description: "Captures DDL and DML activity for comprehensive compliance logging."
  - type: "component"
    name: "Connection Pooler & Read Scaler"
    technology: "PgBouncer"
    description: "Handles high connection spikes, routes read-heavy diagnostic traffic to replicas, and directs writes to the primary PostgreSQL node."
  - type: "component"
    name: "Encryption & Key Manager Integration"
    technology: "HashiCorp Vault with AES-256 TDE"
    description: "Provides secrets management, AES-256 Transparent Data Encryption (TDE) keys, and dynamic credentials."
  - type: "component"
    name: "EMR Backend Container"
    technology: "Containerized Application"
    description: "Queries and updates patient records using TLS 1.3 mTLS and dynamic credentials."
  - type: "component"
    name: "Audit & Compliance Daemon Container"
    technology: "Containerized Daemon"
    description: "Daemon container supporting compliance monitoring."
  - type: "component"
    name: "Cold Storage"
    technology: "Long-term Storage"
    description: "Exports WORM-protected audit logs for 10-year retention."
relationships:
  - source: "EMR Backend Container"
    destination: "Connection Pooler & Read Scaler"
    description: "Queries and updates patient records via TLS 1.3 mTLS with dynamic credentials"
  - source: "Connection Pooler & Read Scaler"
    destination: "Relational Storage Engine"
    description: "Routes read-only queries to replicas and writes to primary PostgreSQL node"
  - source: "Relational Storage Engine"
    destination: "Audit Logging Subsystem"
    description: "Captures DDL/DML activity via pgAudit"
  - source: "Audit Logging Subsystem"
    destination: "Cold Storage"
    description: "Exports WORM-protected audit logs for 10-year retention"
  - source: "EMR Backend Container"
    destination: "Encryption & Key Manager Integration"
    description: "Provisions dynamic, short-lived database credentials"