level: component
scope: "Component diagram for the Audit & Compliance Daemon Container container"
parentContainer:
  name: "Audit & Compliance Daemon Container"
elements:
  - type: "component"
    name: "Audit Stream Consumer"
    technology: "Go (Sarama Go Kafka client)"
    description: "Consumes raw access and modification events from Apache Kafka."
  - type: "component"
    name: "Hash-Chain Ledger Engine"
    technology: "Go (Merkle tree / SHA-256)"
    description: "Maintains tamper-evident cryptographic hash-chained audit logs."
  - type: "component"
    name: "Compliance Query & Report API"
    technology: "Go (gRPC/REST with mTLS, RBAC, JWT, and Nonce protection)"
    description: "Provides compliance and audit query capabilities with robust security controls."
  - type: "component"
    name: "Cold Storage Sync Worker"
    technology: "Go"
    description: "Synchronizes cryptographically chained audit logs to cold storage."
  - type: "component"
    name: "Compliance Report Generator"
    technology: "Go"
    description: "Generates compliance reports with GDPR data minimization and break-glass justification logging."
relationships:
  - source: "Audit Stream Consumer"
    destination: "Hash-Chain Ledger Engine"
    description: "Feeds raw events for cryptographic ledger processing [Internal]"
  - type: "Hash-Chain Ledger Engine"
    destination: "Cold Storage Sync Worker"
    description: "Provides hashed logs for persistence [Internal]"
  - type: "Compliance Report Generator"
    destination: "Compliance Query & Report API"
    description: "Supplies generated reports for querying [Internal]"