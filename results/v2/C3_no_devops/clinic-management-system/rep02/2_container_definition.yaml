level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patient"
    description: "An individual receiving care who uses the web or mobile UI to access their portal, schedule appointments, and view medical records."
  - type: "person"
    name: "Clinical Staff"
    description: "Doctors and nurses who interact with the system to manage electronic medical records (EMR), patient admissions, and clinical workflows."
  - type: "person"
    name: "Administrative Staff"
    description: "Staff members responsible for managing scheduling, billing, and administrative operations within the clinic."
  - type: "person"
    name: "Compliance Officer / Auditor"
    description: "Personnel responsible for monitoring system security, auditing access logs, and ensuring HIPAA/GDPR compliance."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External financial service used to process patient payments and billing transactions securely."
  - type: "externalSystem"
    name: "Insurance Clearinghouse"
    description: "External system used to verify insurance coverage and process insurance claims."
  - type: "externalSystem"
    name: "External Lab / Imaging Systems"
    description: "External clinical systems used for diagnostic testing, lab results, and medical imaging."
  - type: "externalSystem"
    name: "Pharmacy Management System"
    description: "External system used for managing electronic prescriptions and pharmacy integration."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / Nginx in Kubernetes"
    description: "Handles ingress, TLS termination, rate-limiting, and routes traffic to internal containers."
  - type: "container"
    name: "Patient Self-Service Container"
    technology: "React / Next.js SPA served via CDN"
    description: "Provides the patient portal interface for self-service workflows."
  - type: "container"
    name: "EMR Backend Container"
    technology: "Node.js / Java Spring Boot"
    description: "Manages electronic medical records, patient admissions, and core business logic."
  - type: "container"
    name: "Scheduling & Resource Engine Container"
    technology: "Java Spring Boot / Redis Cluster"
    description: "Manages clinic appointments, scheduling, and resource allocation."
  - type: "container"
    name: "Integration Broker Container"
    technology: "Apache Camel / Node-RED"
    description: "Translates and manages HL7 FHIR APIs for external clinical systems."
  - type: "container"
    name: "Audit & Compliance Daemon Container"
    technology: "Go"
    description: "Streams and logs asynchronous immutable audit data for compliance tracking."
  - type: "container"
    name: "EMR Database"
    technology: "PostgreSQL with RLS"
    description: "Stores core electronic medical records and relational data with row-level security."
  - type: "container"
    name: "Redis Cluster"
    technology: "In-memory Redis with TLS"
    description: "Provides caching and fast state management for scheduling and real-time operations."
  - type: "container"
    name: "Cold Storage"
    technology: "Long-term storage with 10-year retention"
    description: "Archives historical medical records and audit data for long-term retention."
  - type: "container"
    name: "Apache Kafka"
    technology: "Apache Kafka"
    description: "Handles asynchronous log streaming for audit and compliance data."
relationships:
  - source: "Patient"
    destination: "API Gateway"
    description: "Accesses self-service portal via web/mobile UI"
    technology: "HTTPS/REST with OAuth2/OIDC, JWT, and MFA"
  - source: "Clinical Staff"
    destination: "API Gateway"
    description: "Accesses EMR and clinical workflows"
    technology: "HTTPS/REST with OAuth2/OIDC, JWT, and MFA"
  - source: "Administrative Staff"
    destination: "API Gateway"
    description: "Accesses scheduling and billing features"
    technology: "HTTPS/REST with OAuth2/OIDC, JWT, and MFA"
  - source: "Compliance Officer / Auditor"
    destination: "API Gateway"
    description: "Monitors audit logs and compliance controls"
    technology: "HTTPS/REST with OAuth2/OIDC, JWT, and MFA"
  - source: "API Gateway"
    destination: "Patient Self-Service Container"
    description: "Routes patient portal traffic"
    technology: "Internal mTLS over gRPC/REST"
  - source: "API Gateway"
    destination: "EMR Backend Container"
    description: "Routes EMR and core clinical requests"
    technology: "Internal mTLS over gRPC/REST"
  - source: "API Gateway"
    destination: "Scheduling & Resource Engine Container"
    description: "Routes scheduling requests"
    technology: "Internal mTLS over gRPC/REST"
  - source: "API Gateway"
    destination: "Integration Broker Container"
    description: "Routes integration requests"
    technology: "Internal mTLS over gRPC/REST"
  - source: "API Gateway"
    destination: "Audit & Compliance Daemon Container"
    description: "Routes compliance and audit queries"
    technology: "Internal mTLS over gRPC/REST"
  - source: "Integration Broker Container"
    destination: "External Lab / Imaging Systems"
    description: "Exchanges clinical data and diagnostic results"
    technology: "HL7 FHIR APIs over gRPC/REST"
  - source: "Integration Broker Container"
    destination: "Pharmacy Management System"
    description: "Sends and receives electronic prescriptions"
    technology: "HL7 FHIR APIs over gRPC/REST"
  - source: "Integration Broker Container"
    destination: "Payment Gateway"
    description: "Processes billing and payment transactions"
    technology: "HTTPS / REST"
  - source: "Integration Broker Container"
    destination: "Insurance Clearinghouse"
    description: "Verifies insurance and submits claims"
    technology: "HTTPS / REST"
  - source: "EMR Backend Container"
    destination: "EMR Database"
    description: "Reads and writes encrypted patient records"
    technology: "Encrypted TLS with AES-256 and HashiCorp Vault"
  - source: "Scheduling & Resource Engine Container"
    destination: "Redis Cluster"
    description: "Caches scheduling states and locks"
    technology: "Encrypted TLS with AES-256"
  - source: "Audit & Compliance Daemon Container"
    destination: "Apache Kafka"
    description: "Streams asynchronous immutable audit logs"
    technology: "TLS"
  - source: "EMR Backend Container"
    destination: "Cold Storage"
    description: "Archives long-term records"
    technology: "Encrypted Storage (10-year retention)"