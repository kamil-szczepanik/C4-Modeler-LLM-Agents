level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who access the system via the Patient Portal."
  - type: "person"
    name: "Clinical Staff"
    description: "Doctors, nurses, and medical professionals managing patient admissions, clinical workflows, and EMRs."
  - type: "person"
    name: "Administrative Staff"
    description: "Personnel responsible for scheduling, billing, and clinic operations."
  - type: "person"
    name: "Compliance Officers"
    description: "Officers responsible for monitoring regulatory compliance and system audit logs."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "External diagnostic systems that exchange clinical data."
  - type: "externalSystem"
    name: "Payment Gateway & Insurance Clearinghouse"
    description: "External financial systems handling billing transactions and insurance processing."
  - type: "externalSystem"
    name: "Regulatory & Auditing System"
    description: "External system for receiving audit logs and ensuring regulatory compliance."
  - type: "container"
    name: "API Gateway / BFF"
    technology: "Kong / Envoy"
    description: "Handles ingress routing, TLS termination, MFA/JWT enforcement, and OAuth2/OIDC."
  - type: "container"
    name: "Patient Portal"
    technology: "Node.js / TypeScript"
    description: "Self-service portal allowing patients to interact with the system via HTTPS/REST."
  - type: "container"
    name: "EMR & Scheduling Container"
    technology: "Java Spring Boot"
    description: "Handles core EMR business logic, resource clash checks, and audit trails."
  - type: "container"
    name: "Billing & Claims Container"
    technology: "Python / FastAPI"
    description: "Decouples billing and insurance claim submissions."
  - type: "container"
    name: "Analytics & Reporting Container"
    technology: "Apache Pinot / ClickHouse"
    description: "Optimizes 10-year retention and heavy reporting queries."
  - type: "container"
    name: "Data & Messaging Layer"
    technology: "PostgreSQL, Redis, Apache Kafka, Debezium"
    description: "Provides relational storage (AES-256), distributed scheduling locks, event-driven messaging, and CDC."
relationships:
  - source: "Patients"
    destination: "API Gateway / BFF"
    description: "Accesses system via HTTPS/REST"
    technology: "OAuth2/OIDC, mTLS, HTTPS/REST"
  - source: "Clinical Staff"
    destination: "API Gateway / BFF"
    description: "Accesses system via HTTPS/REST"
    technology: "OAuth2/OIDC, mTLS, HTTPS/REST"
  - source: "Administrative Staff"
    destination: "API Gateway / BFF"
    description: "Accesses system via HTTPS/REST"
    technology: "OAuth2/OIDC, mTLS, HTTPS/REST"
  - source: "Compliance Officers"
    destination: "API Gateway / BFF"
    description: "Accesses system via HTTPS/REST"
    technology: "OAuth2/OIDC, mTLS, HTTPS/REST"
  - source: "Patient Portal"
    destination: "API Gateway / BFF"
    description: "Communicates with backend via API Gateway"
    technology: "HTTPS/REST"
  - source: "API Gateway / BFF"
    destination: "Patient Portal"
    description: "Routes traffic to Patient Portal"
    technology: "HTTPS/REST"
  - source: "API Gateway / BFF"
    destination: "EMR & Scheduling Container"
    description: "Routes requests to EMR services"
    technology: "HTTPS/REST"
  - source: "EMR & Scheduling Container"
    destination: "Data & Messaging Layer"
    description: "Connects to PostgreSQL and Redis"
    technology: "gRPC/HTTPS, AES-256"
  - source: "EMR & Scheduling Container"
    destination: "Data & Messaging Layer"
    description: "Communicates asynchronously via Apache Kafka events (Saga Pattern)"
    technology: "Apache Kafka"
  - source: "Billing & Claims Container"
    destination: "Data & Messaging Layer"
    description: "Communicates asynchronously via Apache Kafka events (Saga Pattern)"
    technology: "Apache Kafka"
  - source: "Analytics & Reporting Container"
    destination: "Data & Messaging Layer"
    description: "Communicates asynchronously via Apache Kafka events (Saga Pattern)"
    technology: "Apache Kafka"
  - source: "Analytics & Reporting Container"
    destination: "Data & Messaging Layer"
    description: "Ingests data from PostgreSQL via Debezium CDC"
    technology: "Debezium CDC"
  - source: "EMR & Scheduling Container"
    destination: "Lab & Imaging Systems"
    description: "Integrates with external systems via HL7 FHIR APIs"
    technology: "HL7 FHIR APIs"
  - source: "Billing & Claims Container"
    destination: "Payment Gateway & Insurance Clearinghouse"
    description: "Submits billing and insurance claims"
    technology: "HTTPS/REST"
  - source: "EMR & Scheduling Container"
    destination: "Regulatory & Auditing System"
    description: "Sends audit logs for compliance"
    technology: "HTTPS/REST"