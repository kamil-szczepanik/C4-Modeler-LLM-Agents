level: component
scope: "Component diagram for the Analytics & Reporting Container container"
parentContainer:
  name: "Analytics & Reporting Container"
elements:
  - type: "component"
    name: "CDC Ingestion Worker"
    technology: "Python / Go"
    description: "High-throughput ingestion of Debezium CDC streams."
  - type: "component"
    name: "Query & Aggregation Service"
    technology: "Node.js / Express or Java Spring Boot"
    description: "Executes analytical queries against columnar storage."
  - type: "component"
    name: "Report Generation Engine"
    technology: "Node.js"
    description: "Asynchronous processing for report generation and exporting."
  - type: "component"
    name: "Reporting API / BFF"
    technology: "Node.js"
    description: "Exposes endpoints for operational dashboards and compliance reports."
  - type: "component"
    name: "Scheduler & Notification Dispatcher"
    technology: "Node.js / BullMQ"
    description: "Robust queue management for time-zone-aware scheduled report dispatch and alerts."
  - type: "component"
    name: "Analytics Database"
    technology: "ClickHouse / Apache Pinot"
    description: "Columnar store chosen for sub-second analytical queries and 10-year data retention."
  - type: "component"
    name: "Object Storage"
    technology: "S3-compatible"
    description: "Secure, ephemeral staging for generated CSV and PDF reports."
relationships:
  - source: "CDC Ingestion Worker"
    destination: "Apache Kafka"
    description: "Consumes streaming data [Kafka Protocol]"
  - source: "Query & Aggregation Service"
    destination: "Analytics Database"
    description: "Executes analytical queries [Native TCP / HTTP]"
  - source: "Report Generation Engine"
    destination: "Object Storage"
    description: "Persists temporary export payloads [HTTPS / TLS]"
  - source: "Scheduler & Notification Dispatcher"
    destination: "Report Generation Engine"
    description: "Triggers asynchronous generation [BullMQ Redis]"
  - source: "Scheduler & Notification Dispatcher"
    destination: "Email Gateway"
    description: "Dispatches alerts and notifications [HTTPS / TLS]"
  - source: "Reporting API / BFF"
    destination: "API Gateway"
    description: "Exposes endpoints [REST / gRPC]"