level: component
scope: "Component diagram for the EMR & Scheduling Container container"
parentContainer:
  name: "EMR & Scheduling Container"
elements:
  - type: "component"
    name: "API Gateway / BFF"
    technology: "Kong / Envoy"
    description: "Routes requests to backend services."
  - type: "component"
    name: "Patient Portal"
    technology: "Node.js / TypeScript"
    description: "Serves patient-facing interactions."
  - type: "component"
    name: "EMR & Scheduling Container"
    technology: "Java Spring Boot"
    description: "Core runtime for EMR and scheduling ensuring high performance and robust business logic."
  - type: "component"
    name: "Patient & EMR Management Component"
    technology: "Spring Data JPA / Hibernate"
    description: "Manages patient and EMR data persistence and retrieval."
  - type: "component"
    name: "Scheduling & Clash Detection Engine"
    technology: "Java / Redis"
    description: "Handles scheduling and rapid resource clash detection."
  - type: "component"
    name: "FHIR Interoperability Adapter"
    technology: "HAPI FHIR / Spring WebClient"
    description: "Translates domain models to HL7 FHIR resources for interoperability."
  - type: "component"
    name: "Clinical Workflow & Telemetry Component"
    technology: "Micrometer / OpenTelemetry"
    description: "Captures performance traces and UX telemetry."
  - type: "component"
    name: "Data & Messaging Layer"
    technology: "PostgreSQL, Redis, Apache Kafka, Debezium"
    description: "Provides data persistence, distributed locking, and messaging backbones."
  - type: "component"
    name: "Lab & Imaging Systems"
    technology: "External Systems"
    description: "External systems for labs and imaging integration."
relationships:
  - source: "API Gateway / BFF"
    destination: "EMR & Scheduling Container"
    description: "Routes requests [HTTPS/REST, mTLS]"
  - source: "Scheduling & Clash Detection Engine"
    destination: "Data & Messaging Layer"
    description: "Acquires distributed locks [Redis Protocol / TLS]"
  - source: "Patient & EMR Management Component"
    destination: "Data & Messaging Layer"
    description: "Persists EMR records with audit logs [JDBC / gRPC, AES-256]"
  - source: "EMR & Scheduling Container"
    destination: "Lab & Imaging Systems"
    description: "Integrates for labs/imaging [HL7 FHIR APIs]"
  - source: "Clinical Workflow & Telemetry Component"
    destination: "Data & Messaging Layer"
    description: "Publishes sanitized telemetry [Apache Kafka / TLS]"