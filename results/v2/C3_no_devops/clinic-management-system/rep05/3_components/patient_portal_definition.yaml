level: component
scope: "Component diagram for the Patient Portal container"
parentContainer:
  name: "Patient Portal"
elements:
  - type: "component"
    name: "Patient Portal Container"
    technology: "Node.js / TypeScript"
    description: "Secure, self-service container enabling patients to manage appointments, view EMR, and settle bills."
  - type: "component"
    name: "Authentication & Session Component"
    technology: "Passport.js / Auth0 SDK"
    description: "Powers multi-factor authentication and OAuth2/OIDC session management."
  - type: "component"
    name: "Appointment & Scheduling UI/Controller"
    technology: "Node.js / TypeScript"
    description: "Manages appointment and scheduling interactions for patients."
  - type: "component"
    name: "Payment Orchestration Component"
    technology: "Stripe Elements / tokenized iFrames"
    description: "Isolates financial data handling via tokenized payment frames to minimize PCI-DSS scope."
  - type: "component"
    name: "Patient Dashboard & EMR Viewer"
    technology: "Node.js / TypeScript"
    description: "Fetches and displays patient-scoped records."
  - type: "component"
    name: "Audit Logging Interceptor"
    technology: "Winston / Pino"
    description: "Captures structured audit logs for compliance tracking and emits events for PHI access attempts."
  - type: "component"
    name: "API Gateway / BFF"
    technology: "Kong / Envoy"
    description: "Handles routing and API communication."
relationships:
  - source: "Patient Portal Container"
    destination: "API Gateway / BFF"
    description: "Communicates via mTLS and HTTPS/REST with scoped OAuth2 access tokens"
  - source: "Authentication & Session Component"
    destination: "API Gateway / BFF"
    description: "Validates MFA status via OpenID Connect (OIDC)"
  - source: "Patient Dashboard & EMR Viewer"
    destination: "API Gateway / BFF"
    description: "Fetches patient-scoped records via HTTPS/REST with JWT propagation"
  - source: "Audit Logging Interceptor"
    destination: "Apache Kafka"
    description: "Emits audit events for PHI access attempts"