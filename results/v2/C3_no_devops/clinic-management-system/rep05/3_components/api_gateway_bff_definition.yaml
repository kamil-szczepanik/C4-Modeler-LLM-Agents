  - type: "component"
    name: "Persona-Specific BFF Routers"
    technology: "Node.js / TypeScript"
    description: "Provides persona-specific routing for patients, clinical staff, administrative staff, and compliance officers."
relationships:
  - source: "Edge Router & TLS Terminator"
    destination: "Auth & Policy Enforcement Filter"
    description: "In-Memory Plugin Call, Lua/Wasm"
  - source: "Auth & Policy Enforcement Filter"
    destination: "Persona-Specific BFF Routers"
    description: "Internal Request Headers"