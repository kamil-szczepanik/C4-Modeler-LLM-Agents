level: component
scope: "Component diagram for the Billing & Claims Container container"
parentContainer:
  name: "Billing & Claims Container"
elements:
  - type: "component"
    name: "Claim Processing Engine"
    technology: "Python / FastAPI"
    description: "Manages claim processing and internal updates via FastAPI/gRPC with mTLS."
  - type: "component"
    name: "Clearinghouse Integration Adapter"
    technology: "Python / httpx + WebSockets"
    description: "Handles integration with external payment gateways and insurance clearinghouses."
  - type: "component"
    name: "Appeals & Rejection Workflow Handler"
    technology: "Python / Celery"
    description: "Asynchronous task queue for automated rejection workflows and appeals."
  - type: "component"
    name: "Billing & Ledger Service"
    technology: "Python / FastAPI"
    description: "Handles billing services, APIs, and ledger updates."
relationships:
  - source: "Claim Processing Engine"
    destination: "Billing & Ledger Service"
    description: "Internal updates via [FastAPI/gRPC] with mTLS"
  - source: "Claim Processing Engine"
    destination: "Data & Messaging Layer"
    description: "Publishes ClaimStatusUpdated via [Apache Kafka]"
  - source: "Clearinghouse Integration Adapter"
    destination: "Payment Gateway & Insurance Clearinghouse"
    description: "Submits claims via [HTTPS/REST] and ingests webhooks via [HTTPS/Webhooks]"
  - source: "Billing & Ledger Service"
    destination: "Data & Messaging Layer"
    description: "Publishes PatientBalanceCalculated via [Apache Kafka]"