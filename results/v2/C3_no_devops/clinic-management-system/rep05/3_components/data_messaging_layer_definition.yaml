level: component
scope: "Component diagram for the Data & Messaging Layer container"
parentContainer:
  name: "Data & Messaging Layer"
elements:
  - type: "component"
    name: "PostgreSQL"
    technology: "PostgreSQL with TDE and Row-Level Security"
    description: "Provides relational storage with AES-256 TDE and Row-Level Security for strict compliance."
  - type: "component"
    name: "Redis Cluster"
    technology: "Redis Cluster"
    description: "Manages transient sessions and resource clash locks using the Redlock algorithm."
  - type: "component"
    name: "Apache Kafka"
    technology: "Apache Kafka"
    description: "Powers event-driven microservice choreography and Saga pattern rollbacks."
  - type: "component"
    name: "Debezium Connect Workers"
    technology: "Debezium"
    description: "Streams real-time database modifications from PostgreSQL WAL for analytics."
  - type: "component"
    name: "Flyway/Liquibase"
    technology: "Flyway / Liquibase"
    description: "Executes zero-downtime, backward-compatible database schema migrations."
  - type: "component"
    name: "Kafka Schema Registry"
    technology: "Kafka Schema Registry"
    description: "Enforces strict Avro/Protobuf schema evolution rules."
relationships:
  - source: "Debezium Connect Workers"
    destination: "PostgreSQL"
    description: "Streams real-time database modifications from PostgreSQL WAL"
  - source: "Apache Kafka"
    destination: "Kafka Schema Registry"
    description: "Enforces strict Avro/Protobuf schema evolution rules"