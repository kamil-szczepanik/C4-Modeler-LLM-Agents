level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed for medium-sized hospitals and clinics to securely manage patient admissions, electronic medical records, scheduling, and billing while ensuring high availability, strict regulatory compliance, and seamless clinical interoperability."
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who access the system via the Patient Portal to view records and manage appointments."
  - type: "person"
    name: "Clinical Staff"
    description: "Doctors, nurses, and medical professionals who use the system to manage patient admissions, clinical workflows, and EMRs."
  - type: "person"
    name: "Administrative Staff"
    description: "Personnel responsible for scheduling, billing, and clinic operations."
  - type: "person"
    name: "Compliance Officers"
    description: "Officers responsible for monitoring regulatory compliance and system audit logs."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "External diagnostic systems that exchange clinical data using HL7 FHIR standards."
  - type: "externalSystem"
    name: "Payment Gateway & Insurance Clearinghouse"
    description: "External financial systems handling billing transactions and insurance processing."
  - type: "externalSystem"
    name: "Regulatory & Auditing System"
    description: "External system for receiving audit logs and ensuring regulatory compliance."
  - type: "container"
    name: "Edge API Gateway"
    description: "Entry point handling edge-terminated authentication, token validation, and traffic routing."
    technology: "JWT (RS256/ES256), OAuth2, TLS 1.3"
  - type: "container"
    name: "Patient Portal"
    description: "Interface allowing patients to interact with the system."
    technology: "HTTPS, Multi-Factor Authentication (MFA)"
  - type: "container"
    name: "Clinic Core Services"
    description: "Core business logic handling admissions, scheduling, and overall clinic operations."
    technology: "Kubernetes, Hybrid Cloud"
  - type: "container"
    name: "EMR Engine"
    description: "Electronic Medical Records engine providing high-performance patient data storage and retrieval."
    technology: "AES-256, WORM Storage"
  - type: "container"
    name: "Billing Service"
    description: "Service responsible for processing payments and financial transactions."
    technology: "Secure API"
relationships:
  - source: "Patients"
    destination: "Edge API Gateway"
    description: "Accesses patient portal and services via secure protocols"
    technology: "HTTPS / TLS 1.3, Multi-Factor Authentication (MFA), JWT"
  - source: "Clinical Staff"
    destination: "Edge API Gateway"
    description: "Manages EMRs, admissions, and clinical workflows"
    technology: "HTTPS / TLS 1.3, Multi-Factor Authentication (MFA), JWT"
  - source: "Administrative Staff"
    destination: "Edge API Gateway"
    description: "Handles administrative and billing tasks"
    technology: "HTTPS / TLS 1.3, Multi-Factor Authentication (MFA), JWT"
  - source: "Compliance Officers"
    destination: "Edge API Gateway"
    description: "Monitors compliance and audit trails"
    technology: "HTTPS / TLS 1.3, Multi-Factor Authentication (MFA), JWT"
  - source: "Clinic Management System"
    destination: "Lab & Imaging Systems"
    description: "Exchanges clinical interoperability data using standardized diagnostic protocols"
    technology: "REST/JSON over HTTPS, HL7 FHIR, mTLS"
  - source: "Clinic Management System"
    destination: "Payment Gateway & Insurance Clearinghouse"
    description: "Processes billing and insurance transactions securely"
    technology: "Secure API / TLS 1.3"
  - source: "Clinic Management System"
    destination: "Regulatory & Auditing System"
    description: "Transmits immutable audit logs for regulatory compliance"
    technology: "Encrypted SFTP / Signed HTTPS APIs"