level: component
scope: "Component diagram for the AWS API Gateway container"
parentContainer:
  name: "AWS API Gateway"
elements:
  - type: "component"
    name: "WAF & Security Filter"
    technology: "AWS WAF"
    description: "AWS WAF integrated with API Gateway for OWASP Top-10 mitigations."
  - type: "component"
    name: "Authorizer Component"
    technology: "AWS Lambda"
    description: "AWS Lambda Authorizer for JWT validation and scope extraction."
  - type: "component"
    name: "Throttling & Usage Plan Engine"
    technology: "API Gateway Usage Plans and API Keys"
    description: "Native API Gateway Usage Plans and API Keys for rate limiting."
  - type: "component"
    name: "Request Router"
    technology: "AWS API Gateway REST/HTTP APIs"
    description: "AWS API Gateway REST/HTTP APIs using proxy integration."
  - type: "component"
    name: "Transform & Response Mapper"
    technology: "Velocity Template Language (VTL)"
    description: "Velocity Template Language (VTL) engine for payload formatting and PII masking."
  - type: "component"
    name: "Observability Publisher"
    technology: "Amazon CloudWatch and AWS X-Ray"
    description: "Amazon CloudWatch and AWS X-Ray for telemetry."
relationships:
  - source: "React SPA"
    destination: "WAF & Security Filter"
    description: "Inspects incoming requests [HTTPS/JSON, TLS 1.3]"
  - source: "WAF & Security Filter"
    destination: "Authorizer Component"
    description: "Validates security tokens [Internal]"
  - source: "Authorizer Component"
    destination: "Throttling & Usage Plan Engine"
    description: "Checks API quotas [Internal]"
  - source: "Throttling & Usage Plan Engine"
    destination: "Request Router"
    description: "Forwards authorized traffic [Internal]"
  - source: "Request Router"
    destination: "Transform & Response Mapper"
    description: "Formats error and success payloads [JSON]"
  - source: "Request Router"
    destination: "Observability Publisher"
    description: "Emits metrics, logs, and traces [CloudWatch/X-Ray]"
  - source: "Request Router"
    destination: "Backend Microservices (Catalog, Checkout)"
    description: "Forwards signed requests via AWS App Mesh [gRPC/HTTP with SigV4/mTLS]"