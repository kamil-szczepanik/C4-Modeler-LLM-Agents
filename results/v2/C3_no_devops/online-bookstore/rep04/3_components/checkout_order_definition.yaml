level: component
scope: "Component diagram for the Checkout & Order container"
parentContainer:
  name: "Checkout & Order"
elements:
  - type: "component"
    name: "Cart & Pricing Engine"
    technology: "Node.js/Express"
    description: "Manages real-time cart state and multi-currency conversions (USD, EUR, GBP)."
  - type: "component"
    name: "Order Orchestrator"
    technology: "Node.js/Express"
    description: "Coordinates distributed transactions, saga patterns, and asynchronous fulfillment queues."
  - type: "component"
    name: "Payment & Compliance Manager"
    technology: "Node.js/Express"
    description: "Handles payment tokenization and automated GDPR/CCPA data masking routines."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Persists transactional ledgers, localized tax data, and order states with column-level PII encryption."
  - type: "component"
    name: "AWS SQS"
    technology: "AWS SQS"
    description: "Decouples order confirmation from Third-Party Shipping API availability."
  - type: "component"
    name: "Payment Gateway"
    technology: "External third-party system"
    description: "External third-party system processing secure financial transactions."
  - type: "component"
    name: "Tax Calculation Service"
    technology: "Internal microservice"
    description: "Internal microservice providing regional tax rules via gRPC."
  - type: "component"
    name: "AWS API Gateway"
    technology: "AWS API Gateway"
    description: "Routes cart actions via REST/JSON over HTTPS with JWT validation."
relationships:
  - source: "AWS API Gateway"
    destination: "Cart & Pricing Engine"
    description: "Routes cart actions via REST/JSON over HTTPS with JWT validation."
  - source: "Order Orchestrator"
    destination: "Payment Gateway"
    description: "Authorizes payments via HTTPS/TLS 1.3 using client-side tokenization."
  - source: "Order Orchestrator"
    destination: "Tax Calculation Service"
    description: "Queries regional tax rules via gRPC over mTLS (AWS App Mesh)."
  - source: "Order Orchestrator"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists transactional data via SQL over TLS."
  - source: "Order Orchestrator"
    destination: "AWS SQS"
    description: "Queues fulfillment details asynchronously using AWS SDK with IAM Auth."
  - source: "Order Orchestrator"
    destination: "Payment & Compliance Manager"
    description: "Enforce cryptographically secure idempotency keys for transaction replays."