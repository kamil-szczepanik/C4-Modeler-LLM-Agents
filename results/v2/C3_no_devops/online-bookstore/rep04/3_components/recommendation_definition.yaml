level: component
scope: "Component diagram for the Recommendation container"
parentContainer:
  name: "Recommendation"
elements:
  - type: "component"
    name: "API Controller"
    technology: "Python/FastAPI"
    description: "Routes recommendation requests and manages overall request flow."
  - type: "component"
    name: "Consent & Preference Filter"
    technology: "Python/FastAPI Middleware"
    description: "Validates user consent states and forwards compliant telemetry."
  - type: "component"
    name: "Inference Engine"
    technology: "Python/PyTorch/Scikit-learn"
    description: "Executes collaborative filtering and real-time inference under 50ms."
  - type: "component"
    name: "Feedback Collector"
    technology: "Python/FastAPI, Amazon SQS/Kafka"
    description: "Ingests anonymized clickstream events for asynchronous processing."
  - type: "component"
    name: "Recommendation Cache Layer"
    technology: "Amazon ElastiCache Redis"
    description: "Retrieves pre-computed item associations for rapid retrieval."
relationships:
  - source: "AWS API Gateway"
    destination: "API Controller"
    description: "Routes recommendation requests via REST/gRPC [JWT, mTLS via AWS App Mesh]"
  - source: "API Controller"
    destination: "Consent & Preference Filter"
    description: "Validates user consent states [Internal function call]"
  - source: "Consent & Preference Filter"
    destination: "Feedback Collector"
    description: "Forwards compliant telemetry [Internal function call]"
  - source: "Feedback Collector"
    destination: "Amazon SQS/Kafka"
    description: "Ingests anonymized clickstream events [TLS 1.3, AWS KMS]"
  - source: "Inference Engine"
    destination: "Recommendation Cache Layer"
    description: "Retrieves pre-computed item associations [TLS, Redis AUTH]"