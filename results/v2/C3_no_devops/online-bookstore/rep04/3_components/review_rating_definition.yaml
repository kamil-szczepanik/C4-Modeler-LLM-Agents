level: component
scope: "Component diagram for the Review & Rating container"
parentContainer:
  name: "Review & Rating"
elements:
  - type: "component"
    name: "Review Controller"
    technology: "FastAPI Router / Python"
    description: "Exposes RESTful endpoints and validates JWTs for user and admin contexts."
  - type: "component"
    name: "Review Service"
    technology: "Python"
    description: "Encapsulates core business logic, including aggregate rating calculations."
  - type: "component"
    name: "Moderation Service"
    technology: "Python"
    description: "Handles administrative flagging, filtering, and deletion of abusive content."
  - type: "component"
    name: "Helpfulness Service"
    technology: "Python"
    description: "Manages idempotent user votes and tallies helpfulness scores."
  - type: "component"
    name: "Review Repository"
    technology: "Python / AWS SDK"
    description: "Interacts with the persistence layer."
relationships:
  - source: "AWS API Gateway"
    destination: "Review Controller"
    description: "Routes REST/gRPC requests with JWT [HTTPS, TLS 1.3]"
  - source: "Review Service"
    destination: "Checkout & Order Container"
    description: "Verifies customer purchases [REST/gRPC over mTLS via AWS App Mesh]"
  - source: "Review Service"
    destination: "Amazon DynamoDB"
    description: "Persists and queries review data [AWS SDK, HTTPS]"
  - source: "Helpfulness Service"
    destination: "Amazon DynamoDB"
    description: "Executes atomic conditional writes for votes [AWS SDK, HTTPS]"