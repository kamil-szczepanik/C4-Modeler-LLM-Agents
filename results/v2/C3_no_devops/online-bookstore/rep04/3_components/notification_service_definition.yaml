level: component
scope: "Component diagram for the Notification Service container"
parentContainer:
  name: "Notification Service"
elements:
  - type: "person"
    name: "Registered Customer"
    technology: "External User"
    description: "End-user receiving localized transactional alerts and preference-managed marketing communications via email and SMS."
  - type: "person"
    name: "Store Administrator"
    technology: "External User"
    description: "System user accessing delivery success rates, bounce logs, and troubleshooting metrics."
  - type: "container"
    name: "Checkout & Order"
    technology: "Microservice Container"
    description: "Upstream container triggering order and notification events."
  - type: "component"
    name: "Event Consumer Component"
    technology: "Node.js / Express, AWS SDK"
    description: "Polls AWS SQS queues and verifies HMAC message signatures."
  - type: "component"
    name: "Template Renderer Component"
    technology: "Node.js / Express, Handlebars / MJML, AWS Secrets Manager"
    description: "Generates localized, multi-currency messages using AWS Secrets Manager for configuration."
  - type: "component"
    name: "Preference Validation Middleware"
    technology: "Node.js / Express"
    description: "Security middleware evaluating GDPR/CCPA marketing opt-outs and consent flags."
  - type: "component"
    name: "Dispatch Engine Component"
    technology: "Node.js / Express, AWS SES, Amazon SNS"
    description: "Routing engine utilizing token-bucket rate limiting to send messages via AWS SES and Amazon SNS."
  - type: "component"
    name: "Audit & Metrics Component"
    technology: "Node.js / Express, Amazon CloudWatch"
    description: "Logging service recording non-PII delivery statuses to Amazon CloudWatch."
relationships:
  - source: "Checkout & Order"
    destination: "Event Consumer Component"
    description: "Triggers order and notification events [AWS SQS via HTTPS/TLS 1.3]"
  - source: "Event Consumer Component"
    destination: "Template Renderer Component"
    description: "Passes parsed event payloads [In-memory asynchronous function calls]"
  - source: "Template Renderer Component"
    destination: "Preference Validation Middleware"
    description: "Forwards rendered messages with consent context [In-memory asynchronous function calls]"
  - source: "Preference Validation Middleware"
    destination: "Dispatch Engine Component"
    description: "Authorizes compliant messages [In-memory asynchronous function calls]"
  - source: "Dispatch Engine Component"
    destination: "Registered Customer"
    description: "Delivers emails and SMS [SMTP/HTTPS via AWS SES and Amazon SNS]"
  - source: "Audit & Metrics Component"
    destination: "Store Administrator"
    description: "Exposes secured delivery and bounce logs [OAuth2/OIDC secured HTTPS interface via Identity Provider]"