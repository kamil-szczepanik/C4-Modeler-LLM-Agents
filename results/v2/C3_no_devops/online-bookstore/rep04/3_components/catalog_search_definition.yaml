level: component
scope: "Component diagram for the Catalog & Search container"
parentContainer:
  name: "Catalog & Search"
elements:
  - type: "component"
    name: "Catalog & Search Controller"
    technology: "Spring Boot"
    description: "Handles incoming REST/gRPC catalog and search requests and enforces JWT authentication."
  - type: "component"
    name: "Search Service"
    technology: "Spring Boot Service"
    description: "Executes full-text search, auto-suggestions, and faceted filtering operations."
  - type: "component"
    name: "Product Repository"
    technology: "AWS SDK"
    description: "Retrieves canonical product details and pricing from data storage."
relationships:
  - source: "Catalog & Search Controller"
    destination: "Search Service"
    description: "Delegates search and catalog requests"
  - source: "Search Service"
    destination: "Product Repository"
    description: "Queries product metadata"