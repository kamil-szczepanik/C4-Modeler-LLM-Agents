level: component
scope: "Component diagram for the React Single Page Application (SPA) container"
parentContainer:
  name: "React Single Page Application (SPA)"
elements:
  - type: "component"
    name: "Routing & Layout Component"
    technology: "React, React Router"
    description: "Handles application routing, layout structure, and route-based code-splitting for sub-2-second page loads."
  - type: "component"
    name: "Catalog & Search Component"
    technology: "React"
    description: "Provides catalog browsing, searching, and product display interfaces for customers."
  - type: "component"
    name: "Checkout & Cart Component"
    technology: "React, Zustand/Redux Toolkit"
    description: "Manages shopping cart state and guides customers through the secure checkout process."
  - type: "component"
    name: "Admin Dashboard Component"
    technology: "React"
    description: "Provides store administrators access to catalog and store management features via OAuth2/OIDC."
  - type: "component"
    name: "API Client"
    technology: "Axios/Fetch"
    description: "Handles secure HTTPS/JSON communication and requests to the AWS API Gateway."
