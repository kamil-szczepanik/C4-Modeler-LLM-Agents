level: component
scope: "Component diagram for the AWS App Mesh & Security container"
parentContainer:
  name: "AWS App Mesh & Security"
elements:
  - type: "component"
    name: "Envoy Proxy Sidecar"
    technology: "Envoy / AWS App Mesh"
    description: "Injected into every microservice pod to handle traffic routing, service discovery, and mTLS encryption."
  - type: "component"
    name: "Secrets Controller"
    technology: "AWS Secrets Manager and External Secrets Operator"
    description: "Secures and fetches runtime secrets for microservices."
  - type: "component"
    name: "Key Management Daemon"
    technology: "AWS KMS"
    description: "Manages data at rest with envelope encryption and strict IAM scoping."
  - type: "component"
    name: "Mesh Control Plane"
    technology: "AWS App Mesh Controller and AWS IAM"
    description: "Manages mesh configurations, routing, and access policies."
  - type: "component"
    name: "Telemetry & Audit Router"
    technology: "AWS CloudWatch and AWS X-Ray"
    description: "Captures access logs, mTLS handshake metrics, and distributed traces for compliance audits."
  - type: "component"
    name: "Certificate Authority"
    technology: "AWS Certificate Manager (ACM) Private CA"
    description: "Automates 24-hour certificate rotation with local Envoy caching for high availability."
relationships:
  - source: "Catalog, Checkout, & other Containers"
    destination: "Envoy Proxy Sidecar"
    description: "Localhost loopback [gRPC/HTTP]"
  - source: "Envoy Proxy Sidecar"
    destination: "Envoy Proxy Sidecar"
    description: "Cross-service communication [Mutual TLS over TCP/Port 443]"
  - source: "Services"
    destination: "Secrets Controller"
    description: "Fetch runtime secrets [HTTPS/AWS SDK]"
  - source: "Envoy Proxy Sidecar"
    destination: "Mesh Control Plane"
    description: "Fetch dynamic routing and certificate updates [gRPC with local caching fallback]"
  - source: "Envoy Proxy Sidecar"
    destination: "Telemetry & Audit Router"
    description: "Export metrics and access logs [OTLP/HTTPS]"