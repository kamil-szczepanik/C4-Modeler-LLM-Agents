level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Customer"
    description: "Casual Reader and Returning Bibliophile shopping for physical and electronic books."
  - type: "person"
    name: "Store Administrator"
    description: "Back-office user managing inventory and support."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processing system handling secure checkout."
  - type: "externalSystem"
    name: "Third-Party Shipping/Carrier APIs"
    description: "External logistics system managing physical fulfillment and shipping."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "External service for multi-region tax compliance."
  - type: "externalSystem"
    name: "Recommendation Provider"
    description: "External ML recommendation provider."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External or AWS-managed identity provider for authentication."
  - type: "container"
    name: "React Single Page Application (SPA)"
    technology: "React, AWS S3, CloudFront"
    description: "Frontend user interface hosted on AWS S3 & CloudFront."
  - type: "container"
    name: "AWS API Gateway"
    technology: "AWS API Gateway"
    description: "API routing, TLS termination, and OAuth2/OIDC token validation."
  - type: "container"
    name: "Catalog & Search"
    technology: "Spring Boot, Amazon OpenSearch, Amazon DynamoDB"
    description: "Handles product catalog browsing and search."
  - type: "container"
    name: "Checkout & Order"
    technology: "Node.js/Express, Amazon Aurora PostgreSQL"
    description: "Manages secure checkout, orders, and transactional data."
  - type: "container"
    name: "Review & Rating"
    technology: "Python/FastAPI, Amazon DynamoDB"
    description: "Manages customer reviews and ratings."
  - type: "container"
    name: "Notification Service"
    technology: "Node.js/Express, AWS SES, Amazon SNS, Amazon SQS"
    description: "Handles customer notifications and messaging."
  - type: "container"
    name: "Recommendation"
    technology: "Python/FastAPI"
    description: "Provides product recommendations to customers."
  - type: "container"
    name: "AWS App Mesh & Security"
    technology: "AWS App Mesh, AWS Secrets Manager, AWS KMS"
    description: "Manages internal mTLS traffic routing and secrets/encryption."
relationships:
  - source: "Customer"
    destination: "React Single Page Application (SPA)"
    description: "Browses catalog, manages cart, places orders, and leaves reviews"
    technology: "HTTPS/JSON, TLS 1.3"
  - source: "Store Administrator"
    destination: "React Single Page Application (SPA)"
    description: "Accesses admin features for catalog and store management"
    technology: "HTTPS, OAuth2/OIDC"
  - source: "React Single Page Application (SPA)"
    destination: "AWS API Gateway"
    description: "Sends API requests for catalog, checkout, reviews, and recommendations"
    technology: "HTTPS/JSON, TLS 1.3"
  - source: "AWS API Gateway"
    destination: "Catalog & Search"
    description: "Routes catalog and search requests"
    technology: "REST/gRPC with JWT"
  - source: "AWS API Gateway"
    destination: "Checkout & Order"
    description: "Routes checkout and order processing requests"
    technology: "REST/gRPC with JWT"
  - source: "AWS API Gateway"
    destination: "Review & Rating"
    description: "Routes review and rating requests"
    technology: "REST/gRPC with JWT"
  - source: "AWS API Gateway"
    destination: "Recommendation"
    description: "Routes recommendation requests"
    technology: "REST/gRPC with JWT"
  - source: "Checkout & Order"
    destination: "Payment Gateway"
    description: "Processes secure payments"
    technology: "HTTPS"
  - source: "Checkout & Order"
    destination: "Notification Service"
    description: "Triggers order notifications"
    technology: "AWS SQS"
  - source: "Checkout & Order"
    destination: "Third-Party Shipping/Carrier APIs"
    description: "Dispatches fulfillment details"
    technology: "AWS SQS / HTTPS"
  - source: "Notification Service"
    destination: "Customer"
    description: "Sends notifications and emails"
    technology: "AWS SES / AWS SNS"
  - source: "Catalog & Search"
    destination: "AWS App Mesh & Security"
    description: "Secures internal microservice communication"
    technology: "mTLS via AWS App Mesh"
  - source: "Checkout & Order"
    destination: "AWS App Mesh & Security"
    description: "Secures internal microservice communication"
    technology: "mTLS via AWS App Mesh"
  - source: "Review & Rating"
    destination: "AWS App Mesh & Security"
    description: "Secures internal microservice communication"
    technology: "mTLS via AWS App Mesh"
  - source: "Notification Service"
    destination: "AWS App Mesh & Security"
    description: "Secures internal microservice communication"
    technology: "mTLS via AWS App Mesh"
  - source: "Recommendation"
    destination: "AWS App Mesh & Security"
    description: "Secures internal microservice communication"
    technology: "mTLS via AWS App Mesh"