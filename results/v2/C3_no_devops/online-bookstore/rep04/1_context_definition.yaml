level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore System"
  description: "Core AWS-hosted multi-region retail platform designed to deliver secure, multi-currency book purchasing, recommendations, and reviews for 1 million monthly active users."
elements:
  - type: "person"
    name: "Customer"
    description: "End-user shopping for physical and electronic books."
  - type: "person"
    name: "Store Administrator"
    description: "Back-office user managing inventory and support."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe/PayPal handling secure PCI-DSS checkout."
  - type: "externalSystem"
    name: "Third-Party Shipping/Carrier APIs"
    description: "FedEx/UPS managing physical fulfillment."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "Avalara/TaxJar for multi-region tax compliance."
  - type: "externalSystem"
    name: "Recommendation Provider"
    description: "AWS Personalize generating 'Customers also bought' data."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "AWS SES/OAuth managing authentication and notifications."
relationships:
  - source: "Customer"
    destination: "Online Bookstore System"
    description: "Interacts for shopping, purchasing, and reviews"
    technology: "HTTPS (Web/Mobile) using TLS 1.3"
  - source: "Store Administrator"
    destination: "Online Bookstore System"
    description: "Accesses for managing inventory and support"
    technology: "HTTPS with OAuth 2.0 / OIDC and MFA"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Processes secure checkout and payments"
    technology: "TLS 1.3 / REST"
  - source: "Online Bookstore System"
    destination: "Tax Calculation Service"
    description: "Calculates multi-region taxes"
    technology: "TLS 1.3 / REST"
  - source: "Online Bookstore System"
    destination: "Third-Party Shipping/Carrier APIs"
    description: "Manages physical fulfillment and shipping"
    technology: "HTTPS/REST webhooks using HMAC-SHA256 signing"
  - source: "Online Bookstore System"
    destination: "Recommendation Provider"
    description: "Fetches ML recommendations"
    technology: "Asynchronous gRPC/REST APIs"