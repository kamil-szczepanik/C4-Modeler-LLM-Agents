level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "AWS WAF"
    technology: "AWS WAF"
    description: "Inspects traffic for OWASP Top-10 threats, SQL injection, and XSS protection at the edge."
  - type: "component"
    name: "Authentication & Authorization Component"
    technology: "AWS Lambda / IAM / JWT"
    description: "Validates JWTs and handles authentication and authorization for incoming requests."
  - type: "component"
    name: "Rate Limiting & Throttling Component"
    technology: "Amazon API Gateway Throttling"
    description: "Manages traffic rates and protects backend services from being overwhelmed."
  - type: "component"
    name: "Geographic Routing & Compliance Component"
    technology: "Amazon Route 53 / API Gateway Custom Authorizers"
    description: "Routes traffic across regional VPC Links ensuring compliance with GDPR and CCPA."
  - type: "component"
    name: "Routing & Protocol Translation Component"
    technology: "Amazon API Gateway"
    description: "Routes traffic and handles protocol translation from HTTP/HTTPS to mTLS/gRPC."
relationships:
  - source: "AWS WAF"
    destination: "Authentication & Authorization Component"
    description: "Inspects traffic for OWASP Top-10 threats [HTTPS]"
  - source: "Authentication & Authorization Component"
    destination: "Geographic Routing & Compliance Component"
    description: "Forwards authenticated requests with validated JWTs [Internal]"
  - source: "Geographic Routing & Compliance Component"
    destination: "Routing & Protocol Translation Component"
    description: "Routes traffic across regional VPC Links [mTLS, gRPC]"