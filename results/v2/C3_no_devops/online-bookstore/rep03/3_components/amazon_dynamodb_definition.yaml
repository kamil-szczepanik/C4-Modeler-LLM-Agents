level: component
scope: "Component diagram for the Amazon DynamoDB container"
parentContainer:
  name: "Amazon DynamoDB"
elements:
  - type: "component"
    name: "CartTable"
    technology: "Amazon DynamoDB Table"
    description: "Shopping Cart Table managing user cart data with low-latency access."
  - type: "component"
    name: "UserActivityTable"
    technology: "Amazon DynamoDB Table"
    description: "Session & History Table managing user sessions and browsing history."
  - type: "component"
    name: "ActivityStream"
    technology: "DynamoDB Streams"
    description: "Captures item-level changes in the DynamoDB tables for real-time event consumption."
  - type: "component"
    name: "Global Tables Replicator"
    technology: "DynamoDB Global Tables"
    description: "Enables active-active multi-region replication across us-east-1, eu-west-1, and ap-southeast-1."
  - type: "component"
    name: "DAX"
    technology: "DynamoDB Accelerator"
    description: "In-memory caching layer providing sub-millisecond read queries for user activity."
relationships:
  - source: "Core Microservices"
    destination: "CartTable"
    description: "CRUD operations via AWS SDK (HTTPS/TLS 1.3)"
  - source: "Core Microservices"
    destination: "UserActivityTable"
    description: "CRUD operations via AWS SDK (HTTPS/TLS 1.3)"
  - source: "ActivityStream"
    destination: "Core Microservices / Recommendation Engine"
    description: "Event consumption via Amazon Kinesis Adapter / AWS Lambda"
  - source: "CartTable"
    destination: "Global Tables Replicator"
    description: "Active-active multi-region replication via AWS backbone (Proprietary Protocol)"
  - source: "UserActivityTable"
    destination: "Global Tables Replicator"
    description: "Active-active multi-region replication via AWS backbone (Proprietary Protocol)"
  - source: "Core Microservices"
    destination: "DAX"
    description: "In-memory read queries via AWS DAX SDK (TLS 1.3)"