level: component
scope: "Component diagram for the Single-Page Application (SPA) & Back-Office Admin Portal container"
parentContainer:
  name: "Single-Page Application (SPA) & Back-Office Admin Portal"
elements:
  - type: "component"
    name: "Storefront Module"
    technology: "React, Redux Toolkit, DOMPurify"
    description: "Manages component-based UI, shopping cart optimistic updates, localized multi-currency rendering, and sanitizes user-generated customer reviews against DOM-based XSS."
  - type: "component"
    name: "Admin Portal Module"
    technology: "React, React Router"
    description: "Provides administrative interfaces and routing for back-office management."
  - type: "component"
    name: "Auth & Consent Manager"
    technology: "React Context, AWS Amplify, AWS Cognito"
    description: "Manages OIDC authentication, JWT sessions, and MFA enforcement."
  - type: "component"
    name: "API Client Interceptor"
    technology: "Axios"
    description: "Handles centralized communication and token management for API requests."
relationships:
  - source: "Storefront Module"
    destination: "API Gateway"
    description: "Communicates via centralized Axios interceptor [REST/HTTPS, JWT]"
  - source: "Admin Portal Module"
    destination: "API Gateway"
    description: "Communicates via centralized Axios interceptor [REST/HTTPS, JWT]"
  - source: "Auth & Consent Manager"
    destination: "API Gateway"
    description: "Authenticates and manages sessions [OIDC/AWS Cognito]"