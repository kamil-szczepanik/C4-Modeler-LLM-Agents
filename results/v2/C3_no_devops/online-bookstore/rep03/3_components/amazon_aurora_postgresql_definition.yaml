level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL container"
parentContainer:
  name: "Amazon Aurora PostgreSQL"
elements:
  - type: "component"
    name: "Aurora PostgreSQL Cluster"
    technology: "Multi-AZ with Primary Writer and Read Replicas"
    description: "Serves as the primary relational database ensuring transactional integrity for shopping carts and secure checkouts, scaling up to 128TB across 3 AZs."
  - type: "component"
    name: "Aurora Global Database"
    technology: "Cross-region replication"
    description: "Provides scalable, highly available data storage across multiple global regions (us-east-1, eu-west-1, ap-southeast-1)."
  - type: "component"
    name: "PostgreSQL Extension Manager"
    technology: "pg_stat_statements, pgcrypto"
    description: "Manages database extensions for performance monitoring and cryptographic operations."
  - type: "component"
    name: "IAM & Secrets Manager Integration"
    technology: "AWS IAM & Secrets Manager"
    description: "Eliminates static credentials and secures database access."
  - type: "component"
    name: "Private Database Subnets"
    technology: "Isolated VPC deployment"
    description: "Enforces strict network isolation for GDPR and CCPA compliance."
relationships:
  - source: "Core Microservices"
    destination: "Aurora PostgreSQL Cluster"
    description: "Executes queries and transactions [PostgreSQL wire protocol over TLS 1.3 via PgBouncer]"
  - source: "Core Microservices"
    destination: "IAM & Secrets Manager Integration"
    description: "Authenticates and manages database credentials [HTTPS/TLS 1.3]"
  - source: "Aurora PostgreSQL Cluster"
    destination: "Amazon CloudWatch"
    description: "Streams audit logs for compliance monitoring [AWS Internal API]"
  - source: "Aurora PostgreSQL Cluster"
    destination: "Amazon S3"
    description: "Performs continuous backups and point-in-time recovery (PITR) with immutable storage [AWS Internal API]"