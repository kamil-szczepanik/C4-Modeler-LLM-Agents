level: component
scope: "Component diagram for the Core Microservices container"
parentContainer:
  name: "Core Microservices"
elements:
  - type: "component"
    name: "Catalog & Search Component"
    technology: "Spring Boot"
    description: "Handles product catalog and search functionalities for physical and electronic books."
  - type: "component"
    name: "Checkout & Order Component"
    technology: "Spring Boot"
    description: "Manages checkout processes, order placement, and cart states."
  - type: "component"
    name: "Admin & Compliance Component"
    technology: "Python/FastAPI"
    description: "Handles back-office administration and ensures GDPR and CCPA compliance."
  - type: "component"
    name: "Async Notification Service"
    technology: "Python/FastAPI"
    description: "Dispatches asynchronous notifications via Amazon SNS and Amazon SES."
relationships:
  - source: "Checkout & Order Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads/writes relational data [JDBC/TLS]"
  - source: "Checkout & Order Component"
    destination: "Amazon DynamoDB"
    description: "Reads/writes cart states [AWS SDK / TLS]"
  - source: "Catalog & Search Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads relational data [JDBC/TLS]"
  - source: "Catalog & Search Component"
    destination: "Amazon EventBridge"
    description: "Publishes/consumes domain events [AWS SDK / TLS]"
  - source: "Checkout & Order Component"
    destination: "Amazon EventBridge"
    description: "Publishes/consumes domain events [AWS SDK / TLS]"
  - source: "Admin & Compliance Component"
    destination: "Amazon EventBridge"
    description: "Publishes/consumes domain events [AWS SDK / TLS]"
  - source: "Checkout & Order Component"
    destination: "Payment Gateway"
    description: "Processes transactions [REST/TLS]"
  - source: "Checkout & Order Component"
    destination: "Shipping Provider APIs"
    description: "Processes fulfillment [REST/TLS]"
  - source: "Admin & Compliance Component"
    destination: "Tax & Compliance Service"
    description: "Processes compliance [REST/TLS]"
  - source: "Catalog & Search Component"
    destination: "Recommendation Engine"
    description: "Processes recommendations [REST/TLS]"
  - source: "Async Notification Service"
    destination: "Amazon SNS"
    description: "Dispatches notifications [AWS SDK/TLS]"
  - source: "Async Notification Service"
    destination: "Amazon SES"
    description: "Dispatches notifications [AWS SDK/TLS]"