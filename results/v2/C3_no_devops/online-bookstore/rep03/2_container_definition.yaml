level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Customer"
    description: "End-user who browses, purchases books, and interacts with reviews and recommendations via web apps."
  - type: "person"
    name: "Admin / Content Manager"
    description: "System administrator and content manager who manages the platform using secure authentication."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service like Stripe or PayPal for processing payments."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "External logistics services like FedEx or UPS for managing shipments."
  - type: "externalSystem"
    name: "Tax & Compliance Service"
    description: "External service like Avalara for handling tax and compliance."
  - type: "externalSystem"
    name: "Recommendation Engine"
    description: "AWS Personalize service providing book recommendations."
  - type: "container"
    name: "Single-Page Application (SPA) & Back-Office Admin Portal"
    technology: "React, Amazon S3, Amazon CloudFront"
    description: "Provides customer-facing web application and back-office admin portal for sub-2s global page loads."
  - type: "container"
    name: "API Gateway"
    technology: "Amazon API Gateway"
    description: "Routes client traffic to core microservices via VPC Links with mTLS and handles REST/HTTPS requests with JWT authentication."
  - type: "container"
    name: "Core Microservices"
    technology: "Spring Boot, Python/FastAPI, Amazon ECS Fargate"
    description: "Includes Catalog & Search, Checkout & Order, Recommendation, and Admin & Compliance services."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Stores relational and transactional data."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Stores low-latency cart states."
relationships:
  - source: "Customer"
    destination: "Single-Page Application (SPA) & Back-Office Admin Portal"
    description: "Accesses via HTTPS over CloudFront"
    technology: "HTTPS"
  - source: "Admin / Content Manager"
    destination: "Single-Page Application (SPA) & Back-Office Admin Portal"
    description: "Accesses admin portal via HTTPS over CloudFront"
    technology: "HTTPS"
  - source: "Single-Page Application (SPA) & Back-Office Admin Portal"
    destination: "API Gateway"
    description: "Communicates using REST/HTTPS and JWT authentication"
    technology: "REST/HTTPS, JWT"
  - source: "API Gateway"
    destination: "Core Microservices"
    description: "Routes traffic via VPC Links"
    technology: "mTLS"
  - source: "Core Microservices"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes relational data"
    technology: "JDBC/TLS"
  - source: "Core Microservices"
    destination: "Amazon DynamoDB"
    description: "Reads and writes low-latency cart states"
    technology: "AWS SDK / TLS"
  - source: "Core Microservices"
    destination: "Payment Gateway"
    description: "Processes customer payments"
    technology: "REST/TLS"
  - source: "Core Microservices"
    destination: "Shipping Provider APIs"
    description: "Manages book shipping and delivery"
    technology: "REST/TLS"
  - source: "Core Microservices"
    destination: "Tax & Compliance Service"
    description: "Calculates taxes and ensures compliance"
    technology: "REST/TLS"
  - source: "Core Microservices"
    destination: "Recommendation Engine"
    description: "Retrieves book recommendations"
    technology: "REST/TLS"