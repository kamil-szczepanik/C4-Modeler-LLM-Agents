level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "A scaled-down Amazon-style e-commerce platform for purchasing physical and electronic books with integrated reviews and recommendations, delivering high scalability, security, and multi-region availability on AWS."
elements:
  - type: "person"
    name: "Customer"
    description: "End-user who browses, purchases books, and interacts with reviews and recommendations via web or mobile apps."
  - type: "person"
    name: "Admin / Content Manager"
    description: "System administrator and content manager who manages the platform using secure authentication."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service like Stripe or PayPal for processing payments."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "External logistics services like FedEx or UPS for managing shipments."
  - type: "externalSystem"
    name: "Tax & Compliance Service"
    description: "External service like Avalara for handling tax and compliance."
  - type: "externalSystem"
    name: "Recommendation Engine"
    description: "AWS Personalize service providing book recommendations."
relationships:
  - source: "Customer"
    destination: "Online Bookstore"
    description: "Interacts via Web/Mobile App to browse and purchase books"
    technology: "HTTPS / TLS 1.3"
  - source: "Admin / Content Manager"
    destination: "Online Bookstore"
    description: "Manages the platform with secure session management"
    technology: "HTTPS / TLS 1.3 with MFA and OAuth 2.0 / OIDC"
  - source: "Online Bookstore"
    destination: "Payment Gateway"
    description: "Processes customer payments"
    technology: "HTTPS/REST"
  - source: "Online Bookstore"
    destination: "Shipping Provider APIs"
    description: "Manages book shipping and delivery"
    technology: "HTTPS/REST"
  - source: "Online Bookstore"
    destination: "Tax & Compliance Service"
    description: "Calculates taxes and ensures compliance"
    technology: "HTTPS/REST"
  - source: "Online Bookstore"
    destination: "Recommendation Engine"
    description: "Retrieves book recommendations using pseudonymized IDs"
    technology: "HTTPS/REST"