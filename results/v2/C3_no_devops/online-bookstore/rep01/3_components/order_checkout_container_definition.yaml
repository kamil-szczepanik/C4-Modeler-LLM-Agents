level: component
scope: "Component diagram for the Order & Checkout Container container"
parentContainer:
  name: "Order & Checkout Container"
elements:
  - type: "component"
    name: "Cart Management Component"
    technology: "Node.js & TypeScript"
    description: "Manages shopping cart sessions and state."
  - type: "component"
    name: "Checkout Orchestrator Component"
    technology: "Node.js & TypeScript"
    description: "Orchestrates order placement, cart workflows, and coordinates payment and fulfillment."
  - type: "component"
    name: "Payment Integration Component"
    technology: "Node.js & TypeScript"
    description: "Handles secure integrations with payment services."
  - type: "component"
    name: "Fulfillment & Tax Component"
    technology: "Node.js & TypeScript"
    description: "Manages shipping fulfillment and tax calculation services."
  - type: "component"
    name: "Order Event Publisher Component"
    technology: "Node.js & TypeScript"
    description: "Dispatches domain events for notifications."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "AWS DynamoDB"
    description: "Provides low-latency, scalable storage for shopping cart states."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Persists finalized orders transactionally and guarantees strict transactional integrity."
  - type: "component"
    name: "Payment Gateway"
    technology: "REST / JSON over HTTPS / TLS 1.3"
    description: "External payment processing gateway."
  - type: "component"
    name: "Third-Party Shipping APIs"
    technology: "REST / JSON over HTTPS / TLS 1.3"
    description: "External shipping and fulfillment APIs."
  - type: "component"
    name: "Tax Calculation Service"
    technology: "REST / JSON over HTTPS / TLS 1.3"
    description: "External service for calculating regional taxes."
  - type: "component"
    name: "Email/Notification Service (via AWS SQS/SNS)"
    technology: "AWS SQS/SNS"
    description: "Enables asynchronous, decoupled domain event publishing for notifications."
relationships:
  - source: "Cart Management Component"
    destination: "Amazon DynamoDB"
    description: "Reads and writes cart sessions [DynamoDB API / TLS 1.3]"
  - source: "Checkout Orchestrator Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists finalized orders transactionally [PostgreSQL Wire Protocol / TLS 1.3]"
  - source: "Checkout Orchestrator Component"
    destination: "Payment Integration Component"
    description: "Invokes idempotent payment processing [Internal Async/Await]"
  - source: "Checkout Orchestrator Component"
    destination: "Fulfillment & Tax Component"
    description: "Requests tax calculation and shipping fulfillment [Internal Async/Await]"
  - source: "Payment Integration Component"
    destination: "Payment Gateway"
    description: "Processes secure payments [REST / JSON over HTTPS / TLS 1.3]"
  - source: "Fulfillment & Tax Component"
    destination: "Third-Party Shipping APIs"
    description: "Initiates shipping and fulfillment [REST / JSON over HTTPS / TLS 1.3]"
  - source: "Fulfillment & Tax Component"
    destination: "Tax Calculation Service"
    description: "Calculates regional taxes [REST / JSON over HTTPS / TLS 1.3]"
  - source: "Order Event Publisher Component"
    destination: "Email/Notification Service (via AWS SQS/SNS)"
    description: "Dispatches `OrderPlaced` domain events [AWS SDK / TLS 1.3]"