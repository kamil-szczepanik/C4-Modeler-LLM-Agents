level: component
scope: "Component diagram for the Customer Engagement & Notification Container container"
parentContainer:
  name: "Customer Engagement & Notification Container"
elements:
  - type: "component"
    name: "Event Consumer Component"
    technology: "Node.js, AWS SDK"
    description: "Processes asynchronous events from SQS/SNS to trigger notification workflows."
  - type: "component"
    name: "Notification Dispatcher Component"
    technology: "Node.js"
    description: "Coordinates message rendering and payload dispatching."
  - type: "component"
    name: "Template Engine Component"
    technology: "Handlebars, MJML"
    description: "Renders responsive, secure HTML/text multi-channel templates."
  - type: "component"
    name: "Consent & Preference Manager Component"
    technology: "Node.js, DynamoDB Client"
    description: "Validates user preferences and manages GDPR/CCPA compliance."
  - type: "component"
    name: "Third-Party Provider Adapter Component"
    technology: "Axios, HTTPS"
    description: "Dispatches payloads securely to external providers with exponential backoff retries."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Node.js"
    description: "Emits and persists dispatch results for auditing purposes."
  - type: "component"
    name: "Amazon SQS / SNS"
    technology: "AWS Messaging Service"
    description: "Triggers asynchronous notification workflows."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "AWS NoSQL Database"
    description: "Stores encrypted user consent profiles and non-PII audit logs."
  - type: "component"
    name: "AWS Secrets Manager"
    technology: "AWS Secrets Management"
    description: "Secures and retrieves third-party API keys at runtime."
  - type: "component"
    name: "External Email/Notification Service"
    technology: "SES, Twilio"
    description: "Sends final messages to end-users via email or SMS."
relationships:
  - source: "Amazon SQS / SNS"
    destination: "Event Consumer Component"
    description: "Triggers asynchronous notification workflows [AWS SQS/SNS, TLS]"
  - source: "Event Consumer Component"
    destination: "Consent & Preference Manager Component"
    description: "Validates user preferences [In-process / Async]"
  - source: "Consent & Preference Manager Component"
    destination: "Amazon DynamoDB"
    description: "Reads/writes user consent profiles [AWS SDK, TLS 1.3]"
  - source: "Notification Dispatcher Component"
    destination: "Template Engine Component"
    description: "Renders message content [In-process]"
  - source: "Notification Dispatcher Component"
    destination: "Third-Party Provider Adapter Component"
    description: "Dispatches payload [In-process]"
  - source: "Third-Party Provider Adapter Component"
    destination: "External Email/Notification Service"
    description: "Sends final message [HTTPS, TLS 1.3]"
  - source: "Third-Party Provider Adapter Component"
    destination: "Audit Logger Component"
    description: "Emits dispatch results [In-process / Async]"
  - source: "Audit Logger Component"
    destination: "Amazon DynamoDB"
    description: "Persists audit logs [AWS SDK, TLS 1.3]"
  - source: "Third-Party Provider Adapter Component"
    destination: "AWS Secrets Manager"
    description: "Retrieves API keys [AWS SDK, TLS 1.3]"