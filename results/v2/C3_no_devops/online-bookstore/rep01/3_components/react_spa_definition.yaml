level: component
scope: "Component diagram for the React SPA container"
parentContainer:
  name: "React SPA"
elements:
  - type: "component"
    name: "Router & View Controller"
    technology: "React Router, TypeScript"
    description: "Handles client-side routing, view rendering, and localized layout states for sub-2s loads."
  - type: "component"
    name: "State & Cache Manager"
    technology: "Zustand, TanStack Query"
    description: "Manages global UI state, multi-currency preferences, and efficient client-side API caching."
  - type: "component"
    name: "API Client"
    technology: "Axios, TypeScript"
    description: "Sends secure HTTPS/TLS 1.3 requests with localized headers to the API Gateway."
relationships:
  - source: "Router & View Controller"
    destination: "State & Cache Manager"
    description: "Reads and updates application state"
  - source: "State & Cache Manager"
    destination: "API Client"
    description: "Triggers data fetching and mutations"
  - source: "API Client"
    destination: "AWS API Gateway & CloudFront"
    description: "Sends API requests [HTTPS / TLS 1.3]"