level: component
scope: "Component diagram for the Catalog & Search Container container"
parentContainer:
  name: "Catalog & Search Container"
elements:
  - type: "component"
    name: "Search Controller"
    technology: "Spring MVC REST endpoints"
    description: "Provides REST endpoints for product browsing and search."
  - type: "component"
    name: "Admin Catalog Controller"
    technology: "Spring MVC administrative endpoints"
    description: "Provides administrative endpoints with RBAC enforcement."
  - type: "component"
    name: "Catalog Service"
    technology: "Spring Boot Business Logic"
    description: "Business logic for product retrieval and inventory mapping."
  - type: "component"
    name: "Search Indexer"
    technology: "Spring Data / OpenSearch Client"
    description: "Handles full-text search and fuzzy matching."
  - type: "component"
    name: "Cache Manager"
    technology: "Spring Cache with Lettuce"
    description: "Manages caching for Amazon ElastiCache Redis."
  - type: "component"
    name: "Audit Logging Aspect"
    technology: "Spring AOP"
    description: "Tracks modifications for audit logging."
  - type: "container"
    name: "AWS API Gateway & CloudFront"
    technology: "AWS Gateway / CDN"
    description: "Entry point for client applications."
  - type: "container"
    name: "Amazon ElastiCache Redis"
    technology: "Redis"
    description: "Delivers sub-millisecond hot-item caching and rate-limiting storage."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "PostgreSQL"
    description: "Stores persistent catalog data securely with IAM authentication."
  - type: "container"
    name: "Amazon OpenSearch"
    technology: "OpenSearch"
    description: "Enables scalable full-text search, facets, and fuzzy typo-tolerance."
relationships:
  - source: "AWS API Gateway & CloudFront"
    destination: "Search Controller"
    description: "REST / JSON over HTTP via mTLS"
  - source: "Search Controller"
    destination: "Catalog Service"
    description: "In-process Java method calls"
  - source: "Search Controller"
    destination: "Search Indexer"
    description: "In-process Java method calls"
  - source: "Admin Catalog Controller"
    destination: "Catalog Service"
    description: "In-process Java method calls with RBAC enforcement"
  - source: "Catalog Service"
    destination: "Cache Manager"
    description: "Redis Protocol"
  - source: "Cache Manager"
    destination: "Amazon ElastiCache Redis"
    description: "Redis Protocol"
  - source: "Catalog Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "JDBC / TLS 1.3"
  - source: "Search Indexer"
    destination: "Amazon OpenSearch"
    description: "HTTPS / TLS 1.3"