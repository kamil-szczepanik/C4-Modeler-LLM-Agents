level: component
scope: "Component diagram for the AWS API Gateway & CloudFront container"
parentContainer:
  name: "AWS API Gateway & CloudFront"
elements:
  - type: "component"
    name: "Amazon CloudFront"
    technology: "AWS CloudFront"
    description: "Caches and delivers static assets globally while routing dynamic traffic."
  - type: "component"
    name: "AWS WAF"
    technology: "AWS WAF"
    description: "Provides edge security and mitigates OWASP Top-10 threats."
  - type: "component"
    name: "Amazon Route 53"
    technology: "Amazon Route 53"
    description: "Handles global DNS routing."
  - type: "component"
    name: "Amazon API Gateway"
    technology: "Amazon API Gateway Regional Endpoints"
    description: "Manages incoming REST API requests using usage plans and API keys, routing via VPC Links."
relationships:
  - source: "Amazon CloudFront"
    destination: "Amazon WAF"
    description: "Inspects requests for security threats [HTTPS]"
  - source: "Amazon CloudFront"
    destination: "Amazon Route 53"
    description: "Resolves DNS queries [DNS]"
  - source: "Amazon CloudFront"
    destination: "Amazon API Gateway"
    description: "Routes dynamic traffic [HTTPS]"