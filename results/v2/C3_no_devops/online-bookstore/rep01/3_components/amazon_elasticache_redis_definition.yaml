level: component
scope: "Component diagram for the Amazon ElastiCache Redis container"
parentContainer:
  name: "Amazon ElastiCache Redis"
elements:
  - type: "component"
    name: "Catalog Cache Component"
    technology: "In-memory Data Store"
    description: "Stores serialized product details and search results in-memory."
  - type: "component"
    name: "Session & Cart State Component"
    technology: "In-memory Hashes"
    description: "Manages ephemeral user cart states using in-memory hashes."
  - type: "component"
    name: "Replication & Persistence Manager"
    technology: "Multi-AZ Replication, AOF/RDB"
    description: "Handles multi-AZ replication groups, AOF/RDB snapshots, and automated failover."
  - type: "component"
    name: "Cache Invalidation & Pub/Sub Worker"
    technology: "Redis Pub/Sub"
    description: "Processes invalidation events to safely prune stale keys via Redis Pub/Sub."
relationships:
  - source: "Catalog & Search Container"
    destination: "Catalog Cache Component"
    description: "Queries catalog data and issues invalidation commands via Redis Protocol over TLS (TCP 6379)."
  - source: "Order & Checkout Container"
    destination: "Session & Cart State Component"
    description: "Manages session and cart states via Redis Protocol over TLS (TCP 6379)."
  - source: "AWS SQS/SNS"
    destination: "Cache Invalidation & Pub/Sub Worker"
    description: "Triggers event-driven cache invalidation hooks."