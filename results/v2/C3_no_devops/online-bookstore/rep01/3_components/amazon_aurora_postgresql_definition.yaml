level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL container"
parentContainer:
  name: "Amazon Aurora PostgreSQL"
elements:
  - type: "component"
    name: "Primary DB Instance (Writer)"
    technology: "Amazon Aurora PostgreSQL"
    description: "Accepts write-heavy transactions from the checkout container."
  - type: "component"
    name: "Replica DB Instances (Readers)"
    technology: "Amazon Aurora PostgreSQL"
    description: "Offloads read-only queries across Availability Zones."
  - type: "component"
    name: "Aurora Storage Volume"
    technology: "Distributed SSD Volume"
    description: "Distributed SSD volume spanning three AZs for fault tolerance."
  - type: "component"
    name: "Aurora Global Database"
    technology: "AWS Aurora Global Database"
    description: "Cross-region deployment across us-east-1, eu-west-1, and ap-southeast-1."
  - type: "component"
    name: "Database Migration Manager"
    technology: "Flyway / Liquibase"
    description: "Manages schema versioning and multi-currency decimal types."
relationships:
  - source: "Primary DB Instance (Writer)"
    destination: "Aurora Storage Volume"
    description: "Performs block-level replication across 3 AZs using AWS Proprietary Protocol."
  - source: "Aurora Global Database"
    destination: "Replica DB Instances (Readers)"
    description: "Synchronizes data across cross-region clusters using AWS KMS encrypted transit."