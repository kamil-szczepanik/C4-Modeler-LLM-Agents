level: component
scope: "Component diagram for the Recommendation & Review Container container"
parentContainer:
  name: "Recommendation & Review Container"
elements:
  - type: "component"
    name: "Review Controller & Service"
    technology: "Python FastAPI"
    description: "Handles customer reviews and publishes review events."
  - type: "component"
    name: "Recommendation Controller & Service"
    technology: "Python FastAPI"
    description: "Provides personalized book suggestions by fetching from the external recommendation engine."
  - type: "component"
    name: "Helpfulness Service"
    technology: "Python FastAPI"
    description: "Manages and persists vote tallies for reviews."
  - type: "component"
    name: "Order Verification Client"
    technology: "Python FastAPI"
    description: "Validates purchases with the Order & Checkout Container."
  - type: "component"
    name: "Async Event Publisher"
    technology: "Celery / Python"
    description: "Asynchronous task queue for offloading review moderation events."
  - type: "component"
    name: "AWS SQS"
    technology: "AWS SQS"
    description: "Message broker for decoupled sentiment analysis and moderation."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "High-concurrency NoSQL storage for review helpfulness votes."
  - type: "component"
    name: "External Recommendation Engine"
    technology: "External Service"
    description: "External system providing book suggestions."
  - type: "component"
    name: "AWS API Gateway"
    technology: "AWS"
    description: "Routes requests to the Recommendation & Review Container."
  - type: "component"
    name: "Order & Checkout Container"
    technology: "Container"
    description: "Validates purchases made by customers."
relationships:
  - source: "AWS API Gateway"
    destination: "Review Controller & Service"
    description: "Routes requests [REST / JSON over HTTP, mTLS]"
  - source: "AWS API Gateway"
    destination: "Recommendation Controller & Service"
    description: "Routes requests [REST / JSON over HTTP, mTLS]"
  - source: "Review Controller & Service"
    destination: "AWS SQS"
    description: "Publishes review events [Async / AWS SQS SDK]"
  - source: "Recommendation Controller & Service"
    destination: "External Recommendation Engine"
    description: "Fetches suggestions [gRPC / TLS]"
  - source: "Helpfulness Service"
    destination: "Amazon DynamoDB"
    description: "Persists vote tallies [NoSQL / AWS SDK]"
  - source: "Order Verification Client"
    destination: "Order & Checkout Container"
    description: "Validates purchases [REST / JSON over HTTP, VPC]"