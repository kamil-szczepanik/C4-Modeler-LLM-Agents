level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Customers"
    description: "End users who browse the catalog, manage carts, and execute secure checkouts."
  - type: "person"
    name: "Store Administrators"
    description: "Operators responsible for managing platform back-office operations and catalogs."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service handling secure financial transactions and payment processing."
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "External services managing order fulfillment, tracking, and delivery logistics."
  - type: "externalSystem"
    name: "AWS Cognito"
    description: "Identity provider handling OAuth2/OIDC authentication and authorization."
  - type: "externalSystem"
    name: "AWS SQS/SNS"
    description: "Message brokers supporting asynchronous event-driven communication."
  - type: "container"
    name: "React SPA"
    technology: "React, TypeScript, AWS S3, CloudFront, WAF"
    description: "Frontend and admin back-office application delivering high-performance catalog browsing and user interfaces."
  - type: "container"
    name: "AWS API Gateway & CloudFront"
    technology: "AWS API Gateway, AWS CloudFront, WAF, mTLS"
    description: "Ingress management and routing layer protecting and routing incoming traffic."
  - type: "container"
    name: "Catalog & Search Container"
    technology: "Spring Boot, Amazon OpenSearch"
    description: "Handles product catalog management and high-performance search queries."
  - type: "container"
    name: "Order & Checkout Container"
    technology: "Node.js, TypeScript"
    description: "Manages order placement, checkout workflows, and secure integrations with external payment and shipping services."
  - type: "container"
    name: "Recommendation & Review Container"
    technology: "Python FastAPI"
    description: "Generates personalized recommendations and handles product reviews."
  - type: "container"
    name: "Customer Engagement & Notification Container"
    technology: "Node.js worker"
    description: "Processes asynchronous events to dispatch customer notifications and engagement messages."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Relational database storing transactional data."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "NoSQL database storing session and cart data."
  - type: "container"
    name: "Amazon ElastiCache Redis"
    technology: "Amazon ElastiCache Redis"
    description: "In-memory cache supporting fast catalog data retrieval."
relationships:
  - source: "Customers"
    destination: "React SPA"
    description: "Browse catalog and manage checkouts via the web application"
    technology: "HTTPS / TLS 1.3"
  - source: "Store Administrators"
    destination: "React SPA"
    description: "Manage platform back-office operations"
    technology: "HTTPS / TLS 1.3"
  - source: "React SPA"
    destination: "AWS API Gateway & CloudFront"
    description: "Sends API requests to backend services"
    technology: "HTTPS / TLS 1.3"
  - source: "AWS API Gateway & CloudFront"
    destination: "Catalog & Search Container"
    description: "Routes synchronous catalog and search traffic"
    technology: "REST / JSON over HTTP (VPC links, mTLS)"
  - source: "AWS API Gateway & CloudFront"
    destination: "Order & Checkout Container"
    description: "Routes synchronous checkout traffic"
    technology: "REST / JSON over HTTP (VPC links, mTLS)"
  - source: "AWS API Gateway & CloudFront"
    destination: "Recommendation & Review Container"
    description: "Routes recommendation and review requests"
    technology: "REST / JSON over HTTP (VPC links, mTLS)"
  - source: "Catalog & Search Container"
    destination: "Amazon ElastiCache Redis"
    description: "Caches catalog data for high performance"
    technology: "Redis Protocol"
  - source: "Order & Checkout Container"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists transactional order data"
    technology: "PostgreSQL Wire Protocol"
  - source: "Order & Checkout Container"
    destination: "Amazon DynamoDB"
    description: "Stores session and shopping cart state"
    technology: "DynamoDB API"
  - source: "Order & Checkout Container"
    destination: "Payment Gateway"
    description: "Processes secure payments"
    technology: "REST / JSON over HTTPS"
  - source: "Order & Checkout Container"
    destination: "Third-Party Shipping APIs"
    description: "Initiates shipping and fulfillment"
    technology: "REST / JSON over HTTPS"
  - source: "Order & Checkout Container"
    destination: "AWS SQS/SNS"
    description: "Publishes order-placed domain events"
    technology: "AWS SDK / TLS"
  - source: "AWS SQS/SNS"
    destination: "Customer Engagement & Notification Container"
    description: "Triggers asynchronous notification workflows"
    technology: "AWS SQS / SNS"