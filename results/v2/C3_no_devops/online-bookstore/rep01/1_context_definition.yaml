level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "An Amazon-style global e-commerce platform designed to support scalable book purchasing, multi-currency transactions, and personalized recommendations."
elements:
  - type: "person"
    name: "Customers"
    description: "End users who browse, purchase books, and receive personalized recommendations."
  - type: "person"
    name: "Book Authors/Publishers"
    description: "Content creators and suppliers who manage their book listings and inventory."
  - type: "person"
    name: "Store Administrators"
    description: "System operators responsible for managing platform operations, compliance, and user roles."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service handling secure multi-currency financial transactions and payment processing."
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "External services managing order fulfillment, tracking, and delivery logistics."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "External service calculating applicable taxes based on regional compliance and customer location."
  - type: "externalSystem"
    name: "Email/Notification Service"
    description: "External service dispatching transactional emails and customer notifications."
  - type: "externalSystem"
    name: "Recommendation Engine"
    description: "External system generating personalized book recommendations for users."
  - type: "externalSystem"
    name: "Web Application Firewall (WAF)"
    description: "Security infrastructure protecting the system from web exploits and ensuring regulatory compliance."
  - type: "externalSystem"
    name: "AWS API Gateway"
    description: "Infrastructure service managing incoming API requests and routing traffic securely."
  - type: "externalSystem"
    name: "AWS SQS/SNS"
    description: "TLS-encrypted message brokers supporting asynchronous event-driven communication."
relationships:
  - source: "Customers"
    destination: "Online Bookstore System"
    description: "Interact with the platform via Web/Mobile Clients to browse and purchase books"
    technology: "HTTPS (TLS 1.3)"
  - source: "Book Authors/Publishers"
    destination: "Online Bookstore System"
    description: "Manage book listings and catalog data"
    technology: "HTTPS (TLS 1.3)"
  - source: "Store Administrators"
    destination: "Online Bookstore System"
    description: "Administer platform settings and oversee operations"
    technology: "HTTPS (TLS 1.3)"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Process payments and multi-currency transactions"
    technology: "REST/JSON over HTTPS"
  - source: "Online Bookstore System"
    destination: "Third-Party Shipping APIs"
    description: "Initiate and track shipping logistics"
    technology: "REST/JSON over HTTPS"
  - source: "Online Bookstore System"
    destination: "Tax Calculation Service"
    description: "Calculate region-specific transaction taxes"
    technology: "REST/JSON over HTTPS"
  - source: "Online Bookstore System"
    destination: "Email/Notification Service"
    description: "Send out notifications and transactional emails asynchronously"
    technology: "AWS SQS/SNS (TLS 1.3)"
  - source: "Online Bookstore System"
    destination: "Recommendation Engine"
    description: "Fetch and process personalized recommendations asynchronously"
    technology: "AWS SQS/SNS (TLS 1.3)"