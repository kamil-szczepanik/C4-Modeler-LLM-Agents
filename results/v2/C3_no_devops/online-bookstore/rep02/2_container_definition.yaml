# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Book Buyer & Reviewer"
    description: "End user who browses, purchases, and reviews physical and electronic books."
  - type: "person"
    name: "Store Administrator"
    description: "Administrative user who manages the bookstore system."
  - type: "person"
    name: "Marketing/Merchandising Specialist"
    description: "Specialist managing marketing and merchandising strategies."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "External system processing multi-currency transactions."
  - type: "externalSystem"
    name: "Third-Party Shipping Provider API"
    description: "External system handling physical book fulfillment and shipping tracking via webhooks."
  - type: "externalSystem"
    name: "External Recommendation Service"
    description: "External service providing book recommendations to users."
  - type: "container"
    name: "Single-Page Application (SPA)"
    technology: "React / TypeScript on AWS S3 & CloudFront"
    description: "Frontend interface for book buyers and reviewers."
  - type: "container"
    name: "Admin / Back-Office App"
    technology: "AWS / Web-based"
    description: "Back-office application for store administrators and marketing specialists."
  - type: "container"
    name: "Amazon API Gateway"
    technology: "AWS API Gateway (REST/GraphQL)"
    description: "Entry point for client applications routing requests to backend services."
  - type: "container"
    name: "Core E-Commerce API"
    technology: "Node.js (NestJS) on AWS ECS (Fargate)"
    description: "Handles core e-commerce business logic and orchestration."
  - type: "container"
    name: "Recommendation Service"
    technology: "Python (FastAPI) on AWS ECS (Fargate)"
    description: "Provides personalized book recommendations and processing."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL (Multi-AZ)"
    description: "Primary relational database for transactional data."
  - type: "container"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache (Redis)"
    description: "Caching layer for high-performance read operations and session data."
  - type: "container"
    name: "Amazon EventBridge"
    technology: "Amazon EventBridge"
    description: "Event bus for asynchronous event-driven integration."
  - type: "container"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Message queue for decoupling and reliable integration."
relationships:
  - source: "Book Buyer & Reviewer"
    destination: "Single-Page Application (SPA)"
    description: "Browses books, makes purchases, and leaves reviews"
    technology: "HTTPS"
  - source: "Store Administrator"
    destination: "Admin / Back-Office App"
    description: "Manages store operations and catalog"
    technology: "HTTPS"
  - source: "Marketing/Merchandising Specialist"
    destination: "Admin / Back-Office App"
    description: "Manages marketing and merchandising campaigns"
    technology: "HTTPS"
  - source: "Single-Page Application (SPA)"
    destination: "Amazon API Gateway"
    description: "Makes API requests"
    technology: "HTTPS (REST/GraphQL)"
  - source: "Admin / Back-Office App"
    destination: "Amazon API Gateway"
    description: "Makes administrative API requests"
    technology: "HTTPS (REST/GraphQL)"
  - source: "Amazon API Gateway"
    destination: "Core E-Commerce API"
    description: "Routes client requests securely"
    technology: "mTLS"
  - source: "Amazon API Gateway"
    destination: "Recommendation Service"
    description: "Routes recommendation requests"
    technology: "mTLS"
  - source: "Core E-Commerce API"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes transactional data"
    technology: "TLS over TCP"
  - source: "Core E-Commerce API"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches and retrieves frequently accessed data"
    technology: "TLS over TCP"
  - source: "Core E-Commerce API"
    destination: "Recommendation Service"
    description: "Requests personalized recommendations"
    technology: "gRPC"
  - source: "Core E-Commerce API"
    destination: "Amazon SQS"
    description: "Queues messages for third-party shipping fulfillment"
    technology: "AWS SDK / API"
  - source: "Amazon SQS"
    destination: "Third-Party Shipping Provider API"
    description: "Dispatches shipping fulfillment requests"
    technology: "HTTPS"
  - source: "Admin / Back-Office App"
    destination: "Amazon EventBridge"
    description: "Publishes administrative events"
    technology: "AWS SDK / API"
  - source: "Amazon EventBridge"
    destination: "Core E-Commerce API"
    description: "Triggers event handlers"
    technology: "Event Bus"
  - source: "Amazon EventBridge"
    destination: "Recommendation Service"
    description: "Triggers event handlers"
    technology: "Event Bus"