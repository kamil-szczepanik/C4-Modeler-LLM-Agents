level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "An Amazon-style multi-currency e-commerce platform hosted on AWS for physical and electronic book sales, designed for 1 million monthly active users globally with GDPR/CCPA and OWASP compliance."
elements:
  - type: "person"
    name: "Book Buyer & Reviewer"
    description: "End user who browses, purchases, and reviews physical and electronic books."
  - type: "person"
    name: "Store Administrator"
    description: "Administrative user who manages the bookstore system."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "External system processing multi-currency transactions."
  - type: "externalSystem"
    name: "Third-Party Shipping Provider API"
    description: "External system handling physical book fulfillment and shipping tracking via webhooks."
  - type: "externalSystem"
    name: "External Recommendation Service"
    description: "External service providing book recommendations to users."
relationships:
  - source: "Book Buyer & Reviewer"
    destination: "Online Bookstore System"
    description: "Browses books, makes purchases, and leaves reviews"
    technology: "HTTPS / TLS 1.3"
  - source: "Store Administrator"
    destination: "Online Bookstore System"
    description: "Manages the bookstore operations with administrative privileges"
    technology: "HTTPS / TLS 1.3 (with MFA)"
  - source: "Online Bookstore System"
    destination: "External Payment Gateway"
    description: "Processes multi-currency payments securely"
    technology: "REST over TLS 1.3 / mTLS"
  - source: "Online Bookstore System"
    destination: "Third-Party Shipping Provider API"
    description: "Coordinates physical book shipping and receives status updates"
    technology: "REST/Webhook over TLS 1.3 / mTLS with HMAC"
  - source: "Online Bookstore System"
    destination: "External Recommendation Service"
    description: "Fetches personalized book recommendations"
    technology: "gRPC/REST over TLS 1.3"