level: component
scope: "Component diagram for the Single-Page Application (SPA) container"
parentContainer:
  name: "Single-Page Application (SPA)"
elements:
  - type: "component"
    name: "Router & State Management Module"
    technology: "Redux Toolkit / Zustand"
    description: "Manages application routing and global state across the SPA."
  - type: "component"
    name: "Catalog & Search View"
    technology: "React / TypeScript"
    description: "Renders the book catalog, search interfaces, and item details."
  - type: "component"
    name: "Checkout & Cart Workflow"
    technology: "React / TypeScript"
    description: "Handles shopping cart management and checkout flows for both guest and authenticated users."
  - type: "component"
    name: "Review & Rating Component"
    technology: "React / TypeScript, DOMPurify"
    description: "Enables users to read, write, and submit book reviews with client-side input sanitization against XSS."
  - type: "component"
    name: "API Client"
    technology: "Axios / GraphQL client with interceptors"
    description: "Handles HTTP and GraphQL communication, authentication headers, and request/response interceptors with backend services."
relationships:
  - source: "Router & State Management Module"
    destination: "Catalog & Search View"
    description: "Synchronizes application state and route parameters"
  - source: "Catalog & Search View"
    destination: "API Client"
    description: "Fetches book catalog and search results [HTTPS]"
  - source: "Checkout & Cart Workflow"
    destination: "API Client"
    description: "Submits cart data and checkout transactions [HTTPS]"
  - source: "Review & Rating Component"
    destination: "API Client"
    description: "Sends sanitized book reviews and ratings [HTTPS]"
  - source: "API Client"
    destination: "Amazon API Gateway"
    description: "Communicates API requests and authentication flows [HTTPS (REST/GraphQL)]"