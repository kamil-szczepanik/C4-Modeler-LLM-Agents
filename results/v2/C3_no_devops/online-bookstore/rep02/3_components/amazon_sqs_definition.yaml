level: component
scope: "Component diagram for the Amazon SQS container"
parentContainer:
  name: "Amazon SQS"
elements:
  - type: "component"
    name: "Standard/FIFO Queue Engine"
    technology: "AWS SQS Engine (Standard/FIFO)"
    description: "Decouples checkout from third-party shipping APIs by enqueuing shipping fulfillment orders securely."
  - type: "component"
    name: "DLQ (Dead Letter Queue)"
    technology: "AWS SQS DLQ"
    description: "Captures and isolates failed message deliveries for analysis and error handling."
  - type: "component"
    name: "KMS Encryption Component"
    technology: "AWS KMS"
    description: "Secures PII data within messages for GDPR/CCPA compliance."
relationships:
  - source: "Standard/FIFO Queue Engine"
    destination: "DLQ (Dead Letter Queue)"
    description: "Routes failed messages [AWS Internal]"
  - source: "Standard/FIFO Queue Engine"
    destination: "KMS Encryption Component"
    description: "Encrypts payload data [AWS SDK]"