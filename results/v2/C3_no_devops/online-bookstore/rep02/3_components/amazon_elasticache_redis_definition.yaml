level: component
scope: "Component diagram for the Amazon ElastiCache (Redis) container"
parentContainer:
  name: "Amazon ElastiCache (Redis)"
elements:
  - type: "component"
    name: "Session Store Component"
    technology: "Redis Hashes"
    description: "Manages ephemeral user sessions and shopping carts."
  - type: "component"
    name: "Product & Catalog Cache Component"
    technology: "Cache-Aside pattern"
    description: "Caches serialized book details and hot categories."
  - type: "component"
    name: "Recommendation Cache Component"
    technology: "Redis"
    description: "Stores pre-computed recommendation lists generated by the Recommendation Service."
relationships:
  - source: "Core E-Commerce API"
    destination: "Session Store Component"
    description: "Reads and writes session and cart data [Redis RESP protocol over TLS/TCP]"
  - source: "Core E-Commerce API"
    destination: "Product & Catalog Cache Component"
    description: "Retrieves cached catalog data [Redis RESP protocol over TLS/TCP]"
  - source: "Recommendation Service"
    destination: "Recommendation Cache Component"
    description: "Populates recommendation lists [Redis RESP protocol over TLS/TCP]"