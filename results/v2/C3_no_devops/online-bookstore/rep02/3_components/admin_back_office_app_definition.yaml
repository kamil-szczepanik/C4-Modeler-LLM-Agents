level: component
scope: "Component diagram for the Admin / Back-Office App container"
parentContainer:
  name: "Admin / Back-Office App"
elements:
  - type: "component"
    name: "Catalog Management Component"
    technology: "Angular / TypeScript"
    description: "Handles inventory CRUD operations"
  - type: "component"
    name: "Merchandising & Campaign Component"
    technology: "Angular / TypeScript"
    description: "Manages promotions and recommendation overrides"
  - type: "component"
    name: "User Data & Compliance Component"
    technology: "Angular / TypeScript"
    description: "Executes secure GDPR/CCPA data export and deletion workflows"
  - type: "component"
    name: "Audit Logging Service"
    technology: "TypeScript / AWS SDK"
    description: "Captures administrative state changes"
  - type: "component"
    name: "Order & Exception Operations Component"
    technology: "Angular / TypeScript"
    description: "Powers the Reconciliation Dashboard"
  - type: "component"
    name: "Analytics & Reporting Component"
    technology: "Angular / TypeScript"
    description: "Renders promotion performance metrics"
relationships:
  - source: "Audit Logging Service"
    destination: "Amazon EventBridge"
    description: "Publishes audit events [AWS SDK / API]"