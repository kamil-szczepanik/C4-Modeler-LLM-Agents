level: component
scope: "Component diagram for the Amazon EventBridge container"
parentContainer:
  name: "Amazon EventBridge"
elements:
  - type: "component"
    name: "Default Bus"
    technology: "AWS EventBridge"
    description: "Handles default system and AWS service events."
  - type: "component"
    name: "Custom Event Bus"
    technology: "AWS EventBridge Custom Bus (bookstore.retail)"
    description: "Receives and routes custom domain events like OrderPlaced and ItemReviewed."
  - type: "component"
    name: "Event Rules & Routing"
    technology: "EventBridge Rule Engine"
    description: "Evaluates events and routes them to appropriate targets based on defined patterns."
  - type: "component"
    name: "Target Dispatcher"
    technology: "EventBridge Target Dispatcher"
    description: "Dispatches matched events to downstream target services like SQS."
  - type: "component"
    name: "Event Archive"
    technology: "EventBridge Archive (bookstore-archive)"
    description: "Archives filtered events for compliance and historical tracking."
relationships:
  - source: "Default Bus"
    destination: "Event Rules & Routing"
    description: "Routes events to"
  - source: "Custom Event Bus"
    destination: "Event Rules & Routing"
    description: "Routes custom domain events to"
  - source: "Event Rules & Routing"
    destination: "Target Dispatcher"
    description: "Forwards matched events to"
  - source: "Custom Event Bus"
    destination: "Event Archive"
    description: "Archives filtered events via Native EventBridge Rule to"