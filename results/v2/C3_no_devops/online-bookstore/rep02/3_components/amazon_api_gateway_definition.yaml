level: component
scope: "Component diagram for the Amazon API Gateway container"
parentContainer:
  name: "Amazon API Gateway"
elements:
  - type: "component"
    name: "WAF Integration Component"
    technology: "AWS WAF"
    description: "Inspects and filters incoming web traffic against OWASP Top-10 threats at the edge."
  - type: "component"
    name: "Edge Router & SSL Terminating Proxy"
    technology: "Amazon API Gateway Edge Router"
    description: "Terminates SSL/TLS connections and routes incoming requests."
  - type: "component"
    name: "Authorizer Component"
    technology: "AWS Lambda Authorizers"
    description: "Validates JSON Web Tokens (JWT) and handles authentication and authorization."
  - type: "component"
    name: "Throttling & Rate Limiter"
    technology: "Amazon API Gateway Usage Plans"
    description: "Enforces rate limiting and throttling to protect backend services."
  - type: "component"
    name: "API Router & Transformer"
    technology: "Amazon API Gateway VPC Links"
    description: "Routes and transforms validated requests to backend microservices over mTLS."
  - type: "component"
    name: "Analytics & Metrics Component"
    technology: "Amazon CloudWatch & API Gateway Metrics"
    description: "Collects analytics and operational metrics for API usage."
relationships:
  - source: "WAF Integration Component"
    destination: "Edge Router & SSL Terminating Proxy"
    description: "Forwards clean traffic"
  - source: "Edge Router & SSL Terminating Proxy"
    destination: "Authorizer Component"
    description: "Authenticates requests"
  - source: "Authorizer Component"
    destination: "Throttling & Rate Limiter"
    description: "Applies usage limits"
  - source: "Throttling & Rate Limiter"
    destination: "API Router & Transformer"
    description: "Passes controlled requests"
  - source: "API Router & Transformer"
    destination: "Analytics & Metrics Component"
    description: "Reports execution metrics"