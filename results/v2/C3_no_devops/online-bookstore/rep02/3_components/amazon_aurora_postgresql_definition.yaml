level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL container"
parentContainer:
  name: "Amazon Aurora PostgreSQL"
elements:
  - type: "component"
    name: "Primary Write Instance (Writer Node)"
    technology: "Amazon Aurora PostgreSQL (Multi-AZ / Global Database)"
    description: "Handles core write transactions, ACID compliance, and data mutations."
  - type: "component"
    name: "Read Replica Instances (Multi-AZ / Global)"
    technology: "Amazon Aurora PostgreSQL Read Replicas"
    description: "Handles distributed read queries across regions for low-latency data access."
  - type: "component"
    name: "Database Encryption & Audit Engine"
    technology: "AWS KMS, PostgreSQL pgaudit extension, IAM Database Authentication"
    description: "Enforces encryption-at-rest, short-lived IAM credentials, and high-privilege query compliance auditing."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer / Aurora Proxy"
    description: "Manages client connections, routes traffic, and prevents thread exhaustion under high traffic."
  - type: "component"
    name: "Global Replication Manager"
    technology: "AWS Dedicated Backbone Network"
    description: "Synchronizes cross-region data securely between primary and global read replicas."
relationships:
  - source: "Connection Pooler"
    destination: "Primary Write Instance (Writer Node)"
    description: "Routes transactions [PostgreSQL Wire Protocol over TLS 1.3]"
  - source: "Connection Pooler"
    destination: "Read Replica Instances (Multi-AZ / Global)"
    description: "Routes read queries [PostgreSQL Wire Protocol over TLS 1.3]"
  - source: "Global Replication Manager"
    destination: "Read Replica Instances (Multi-AZ / Global)"
    description: "Synchronizes cross-region data [AWS Dedicated Backbone Network with TLS]"
  - source: "Database Encryption & Audit Engine"
    destination: "Primary Write Instance (Writer Node)"
    description: "Provides cryptographic keys, authentication tokens, and audit logging for security compliance"