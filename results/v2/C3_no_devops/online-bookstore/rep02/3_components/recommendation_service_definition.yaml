level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "API Controller"
    technology: "FastAPI / Python"
    description: "Manages inbound gRPC and REST requests with RBAC."
  - type: "component"
    name: "Recommendation Engine"
    technology: "Python, Scikit-learn, LightFM"
    description: "Performs collaborative filtering for 'Customers also bought' features."
  - type: "component"
    name: "Merchandising & Rules Processor"
    technology: "Python"
    description: "Applies promotional weights for sponsored book placements."
  - type: "component"
    name: "Model Store Client"
    technology: "AWS SDK / Python"
    description: "Fetches pre-computed machine learning models from Amazon S3."
  - type: "component"
    name: "Feature Cache Client"
    technology: "Redis Client / Python"
    description: "Retrieves real-time user clickstream data from Amazon ElastiCache (Redis)."
  - type: "component"
    name: "Async Telemetry Publisher"
    technology: "Python Background Worker"
    description: "Manages asynchronous metric collection."
  - type: "person"
    name: "Active Shopper & Marketing Manager"
    technology: "External Persona"
    description: "Primary users and internal personas driving discovery and promotional rules."
  - type: "container"
    name: "Amazon API Gateway"
    technology: "AWS API Gateway"
    description: "Routes incoming recommendation requests using mTLS and TLS 1.3."
  - type: "container"
    name: "Core E-Commerce API"
    technology: "Microservice"
    description: "Requests personalized recommendations via gRPC."
  - type: "container"
    name: "Amazon S3"
    technology: "AWS S3"
    description: "Stores pre-computed models secured with AWS KMS encryption."
  - type: "container"
    name: "Amazon ElastiCache (Redis)"
    technology: "Redis"
    description: "Delivers low-latency access to real-time user session data."
  - type: "container"
    name: "Amazon SQS"
    technology: "AWS SQS"
    description: "Decouples telemetry publishing to protect critical API latency SLAs."
relationships:
  - source: "Amazon API Gateway"
    destination: "API Controller"
    description: "Routes incoming recommendation requests using mTLS and TLS 1.3."
  - source: "Core E-Commerce API"
    destination: "API Controller"
    description: "Requests personalized recommendations via gRPC."
  - source: "API Controller"
    destination: "Recommendation Engine"
    description: "Coordinates business logic using synchronous in-process method calls."
  - source: "API Controller"
    destination: "Merchandising & Rules Processor"
    description: "Coordinates business logic using synchronous in-process method calls."
  - source: "Model Store Client"
    destination: "Amazon S3"
    description: "Fetches models using encrypted AWS SDK calls over HTTPS."
  - source: "Feature Cache Client"
    destination: "Amazon ElastiCache (Redis)"
    description: "Queries session features via TCP."
  - source: "Async Telemetry Publisher"
    destination: "Amazon SQS"
    description: "Publishes pseudonymized metrics asynchronously via HTTPS."