level: component
scope: "Component diagram for the Core E-Commerce API container"
parentContainer:
  name: "Core E-Commerce API"
elements:
  - type: "component"
    name: "Catalog Controller & Service"
    technology: "NestJS"
    description: "Handles catalog browsing and product-related business logic."
  - type: "component"
    name: "Cart & Checkout Engine"
    technology: "NestJS"
    description: "Manages shopping carts and secure checkout operations."
  - type: "component"
    name: "Currency Conversion Provider"
    technology: "NestJS"
    description: "Handles multi-currency transactions and exchange rate computations."
  - type: "component"
    name: "Feature Flag Module"
    technology: "AWS AppConfig / Unleash SDK"
    description: "Manages dynamic feature toggles across the application."
  - type: "component"
    name: "Idempotency Interceptor"
    technology: "NestJS / Redis"
    description: "Ensures idempotency for critical API requests using distributed locks."
  - type: "component"
    name: "Payment & Shipping Gateway Adapters"
    technology: "NestJS / Circuit Breaker"
    description: "Integrates external payment and shipping services with fault-tolerance."
  - type: "component"
    name: "Order Event Publisher"
    technology: "NestJS / Amazon EventBridge / Amazon SQS"
    description: "Publishes and queues order-related domain events."
relationships:
  - source: "Amazon API Gateway"
    destination: "Catalog Controller & Service"
    description: "Routes client catalog requests securely via mTLS"
  - source: "Amazon API Gateway"
    destination: "Cart & Checkout Engine"
    description: "Routes client cart and checkout requests securely via mTLS"
  - source: "Cart & Checkout Engine"
    destination: "Idempotency Interceptor"
    description: "Uses for request idempotency locking via TLS over TCP"
  - source: "Cart & Checkout Engine"
    destination: "Payment & Shipping Gateway Adapters"
    description: "Invokes for processing payments and fulfilling orders"
  - source: "Cart & Checkout Engine"
    destination: "Order Event Publisher"
    description: "Triggers order placement events"
  - source: "Currency Conversion Provider"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches exchange rates via TLS over TCP"
  - source: "Idempotency Interceptor"
    destination: "Amazon ElastiCache (Redis)"
    description: "Stores idempotency locks via TLS over TCP"
  - source: "Cart & Checkout Engine"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads/writes transactional data via TLS over TCP"
  - source: "Catalog Controller & Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads catalog data via TLS over TCP"
  - source: "Cart & Checkout Engine"
    destination: "Recommendation Service"
    description: "Requests personalized recommendations via gRPC"
  - source: "Order Event Publisher"
    destination: "Amazon SQS"
    description: "Queues shipping fulfillment tasks via AWS SDK"
  - source: "Amazon EventBridge"
    destination: "Order Event Publisher"
    description: "Triggers event handlers via Event Bus"