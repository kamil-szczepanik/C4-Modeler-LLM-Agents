level: component
scope: "Component diagram for the Notification Microservice container"
parentContainer:
  name: "Notification Microservice"
elements:
  - type: "component"
    name: "Event Consumer / Message Broker Listener"
    technology: "Node.js, AWS SQS SDK"
    description: "Listens to message brokers and consumes asynchronous messaging events."
  - type: "component"
    name: "Notification Router & Template Engine"
    technology: "Node.js, Handlebars"
    description: "Routes notifications and renders localized messages using templates."
  - type: "component"
    name: "Channel Adapters"
    technology: "Node.js, AWS SES, AWS SNS, FCM SDKs"
    description: "Dispatches notifications through external channels like SES, SNS, and FCM."
  - type: "component"
    name: "Preference Controller"
    technology: "Express.js, TypeScript"
    description: "Manages user preferences and consent for GDPR/CCPA compliance."
  - type: "component"
    name: "Notification DB"
    technology: "AWS DynamoDB, AWS KMS"
    description: "Stores user consent and notification data securely with customer-managed keys."
  - type: "component"
    name: "Campaign Manager Component"
    technology: "Express.js, TypeScript"
    description: "Handles admin broadcast requests and bulk payload batches."
  - type: "component"
    name: "Webhook Receiver Component"
    technology: "Express.js, TypeScript"
    description: "Receives engagement callbacks and webhooks from delivery services."
relationships:
  - source: "Event Consumer / Message Broker Listener"
    destination: "Notification Router & Template Engine"
    description: "Dispatches messages [Internal function call]"
  - source: "Campaign Manager Component"
    destination: "Notification Router & Template Engine"
    description: "Dispatches bulk payload batches [Internal function call]"
  - source: "Preference Controller"
    destination: "Notification DB"
    description: "Reads and writes user consent [TCP]"
  - source: "Channel Adapters"
    destination: "AWS SES / SNS / FCM"
    description: "Dispatches notifications [HTTPS REST / AWS SQS]"