level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Router & SSL Termination"
    technology: "AWS WAF & CloudFront"
    description: "Provides edge protection against OWASP Top-10 threats and global routing."
  - type: "component"
    name: "Authentication & Authorization Authorizer"
    technology: "AWS Lambda Custom Authorizer"
    description: "Executes stateless custom authorization and token validation."
  - type: "component"
    name: "Rate Limiting & Throttling Engine"
    technology: "AWS API Gateway Usage Plans"
    description: "Throttles and limits incoming client requests."
  - type: "component"
    name: "Service Proxy & Protocol Translator"
    technology: "AWS API Gateway & AWS App Mesh"
    description: "Managed entry point for high scalability and routes internal calls with zero-trust mTLS."
  - type: "component"
    name: "Usage & Analytics Logging"
    technology: "AWS CloudWatch & Amazon Kinesis Data Firehose"
    description: "Asynchronously streams sanitized logs for analytics without impacting latency."
  - type: "component"
    name: "Single Page App"
    technology: "HTTPS/JSON REST APIs"
    description: "Client application sending secure traffic to the Edge Router."
  - type: "component"
    name: "Third-Party Identity Provider"
    technology: "HTTPS"
    description: "Validates user tokens for the Authentication Authorizer."
  - type: "component"
    name: "Backend Microservices"
    technology: "gRPC over mTLS"
    description: "Internal microservices receiving routed calls via App Mesh."
relationships:
  - source: "Single Page App"
    destination: "Edge Router & SSL Termination"
    description: "Sends secure client traffic [HTTPS/JSON REST APIs]"
  - source: "Authentication & Authorization Authorizer"
    destination: "Third-Party Identity Provider"
    description: "Validates user tokens [HTTPS]"
  - source: "Service Proxy & Protocol Translator"
    destination: "Backend Microservices"
    description: "Routes internal calls with App Mesh [gRPC over mTLS]"
  - source: "Rate Limiting & Throttling Engine"
    destination: "Usage & Analytics Logging"
    description: "Streams sanitized access telemetry [CloudWatch Logs / Kinesis]"