level: component
scope: "Component diagram for the Content Management & Moderation Microservice container"
parentContainer:
  name: "Content Management & Moderation Microservice"
elements:
  - type: "component"
    name: "Review & Rating Controller"
    technology: "Node.js / TypeScript REST/gRPC"
    description: "Handles customer review submissions, updates, and GDPR erasure requests."
  - type: "component"
    name: "Moderation Workflow Engine"
    technology: "Node.js / TypeScript"
    description: "Manages queue states and enforces RBAC/ABAC authorization for Site Administrators and Customers."
  - type: "component"
    name: "Content Sanitizer Component"
    technology: "DOMPurify"
    description: "Input validation layer mitigating XSS and injection vulnerabilities."
  - type: "component"
    name: "Data Access Repository"
    technology: "AWS Aurora PostgreSQL with AWS KMS"
    description: "Interfaces with AWS Aurora PostgreSQL for secure multi-tenant storage."
  - type: "component"
    name: "Notification Dispatcher Component"
    technology: "AWS EventBridge"
    description: "Asynchronous integration layer publishing moderation events."
  - type: "component"
    name: "API Gateway"
    technology: "AWS App Mesh (mTLS / gRPC)"
    description: "External system routing moderation requests to controllers and engines."
  - type: "component"
    name: "Notification Microservice"
    technology: "HTTPS / IAM"
    description: "External system receiving asynchronous moderation events."
relationships:
  - source: "API Gateway"
    destination: "Review & Rating Controller"
    description: "Routes moderation requests via gRPC over mTLS."
  - source: "API Gateway"
    destination: "Moderation Workflow Engine"
    description: "Routes moderation requests via gRPC over mTLS."
  - source: "Review & Rating Controller"
    destination: "Data Access Repository"
    description: "Reads and writes data via secure TCP with AWS KMS encryption."
  - source: "Moderation Workflow Engine"
    destination: "Data Access Repository"
    description: "Reads and writes data via secure TCP with AWS KMS encryption."
  - source: "Notification Dispatcher Component"
    destination: "Notification Microservice"
    description: "Publishes moderation events asynchronously via AWS EventBridge over HTTPS with IAM authentication."