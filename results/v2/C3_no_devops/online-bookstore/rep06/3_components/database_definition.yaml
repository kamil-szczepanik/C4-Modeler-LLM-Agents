level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "AWS Aurora PostgreSQL Primary Writer"
    technology: "AWS Aurora PostgreSQL Multi-AZ"
    description: "Handles relational transactional data for orders and content management with ACID compliance."
  - type: "component"
    name: "AWS Aurora PostgreSQL Read-Replica Cluster"
    technology: "AWS Aurora PostgreSQL"
    description: "Serves read queries for catalog data and cart sessions."
  - type: "component"
    name: "AWS DynamoDB"
    technology: "AWS DynamoDB"
    description: "Provides sub-10ms key-value storage supporting recommendations and cart sessions."
  - type: "component"
    name: "AWS KMS"
    technology: "AWS KMS"
    description: "Enforces encryption-at-rest, Column-Level Encryption, and cryptographic erasure."
relationships:
  - source: "Catalog & Search Microservice"
    destination: "AWS Aurora PostgreSQL Read-Replica Cluster"
    description: "Reads catalog data [PostgreSQL over TLS 1.3 with IAM Authentication]"
  - source: "Order & Checkout Microservice"
    destination: "AWS Aurora PostgreSQL Primary Writer"
    description: "Reads and writes order data [PostgreSQL over TLS 1.3 with IAM Authentication]"
  - source: "Recommendation Microservice"
    destination: "AWS DynamoDB"
    description: "Reads recommendations and cart data [AWS SDK (HTTPS)]"
  - source: "Recommendation Microservice"
    destination: "AWS Aurora PostgreSQL Read-Replica Cluster"
    description: "Reads cart data [PostgreSQL over TLS 1.3]"
  - source: "Content Management & Moderation Microservice"
    destination: "AWS Aurora PostgreSQL Primary Writer"
    description: "Writes moderation data [PostgreSQL over TLS 1.3 with IAM Authentication]"
  - source: "AWS Aurora PostgreSQL Primary Writer"
    destination: "AWS KMS"
    description: "Enforces encryption-at-rest and cryptographic erasure [Internal AWS API]"
  - source: "AWS Aurora PostgreSQL Read-Replica Cluster"
    destination: "AWS KMS"
    description: "Enforces encryption-at-rest and cryptographic erasure [Internal AWS API]"
  - source: "AWS DynamoDB"
    destination: "AWS KMS"
    description: "Enforces encryption-at-rest and cryptographic erasure [Internal AWS API]"