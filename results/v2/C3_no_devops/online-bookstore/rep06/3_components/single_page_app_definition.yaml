level: component
scope: "Component diagram for the Single Page App container"
parentContainer:
  name: "Single Page App"
elements:
  - type: "component"
    name: "Single Page App"
    technology: "React, TypeScript, AWS S3, AWS CloudFront"
    description: "Provides a responsive user interface for catalog browsing, secure checkout, reviews, and recommendations."
  - type: "component"
    name: "Routing & State Manager"
    technology: "React Router, Redux Toolkit / React Context"
    description: "Manages client-side navigation, global session state, and shopping cart persistence."
  - type: "component"
    name: "Catalog & Search UI Module"
    technology: "React, TypeScript"
    description: "Displays catalog items and handles search functionality."
  - type: "component"
    name: "Checkout & Cart UI Module"
    technology: "React, TypeScript, Payment Gateway SDK"
    description: "Handles user shopping cart and secure, tokenized checkout."
  - type: "component"
    name: "Recommendation & Review UI Module"
    technology: "React, TypeScript"
    description: "Displays product recommendations and customer reviews."
  - type: "component"
    name: "Analytics & Telemetry Module"
    technology: "React, TypeScript"
    description: "Collects and sanitizes telemetry and analytics data."
  - type: "component"
    name: "Resilience & Storage Manager"
    technology: "IndexedDB"
    description: "Provides local browser storage for offline cart persistence during degraded network conditions."
  - type: "component"
    name: "API Gateway"
    technology: "AWS API Gateway"
    description: "Handles incoming requests from the SPA via HTTPS/JSON REST APIs."
relationships:
  - source: "Customer"
    destination: "Single Page App"
    description: "HTTPS over TLS 1.3"
  - source: "Site Administrator"
    destination: "Single Page App"
    description: "HTTPS over TLS 1.3"
  - source: "Single Page App"
    destination: "API Gateway"
    description: "HTTPS/JSON REST APIs"
  - source: "Single Page App Components"
    destination: "Single Page App"
    description: "Internal runtime communication via React props/context"