level: component
scope: "Component diagram for the Recommendation Microservice container"
parentContainer:
  name: "Recommendation Microservice"
elements:
  - type: "component"
    name: "API Router Layer"
    technology: "FastAPI, Pydantic"
    description: "FastAPI application managing incoming gRPC requests and input validation via Pydantic."
  - type: "component"
    name: "Inference Engine Component"
    technology: "Python"
    description: "Executes collaborative filtering and incorporates a Cold-Start Handling Component for fallback trending logic."
  - type: "component"
    name: "Recommendation Cache"
    technology: "AWS ElastiCache Redis"
    description: "AWS ElastiCache Redis cluster for sub-10ms cached retrieval of precomputed suggestions."
  - type: "component"
    name: "Data Sync Worker"
    technology: "Python, AWS SDK"
    description: "Asynchronous background worker processing order events."
  - type: "component"
    name: "Database"
    technology: "AWS DynamoDB, AWS KMS"
    description: "AWS DynamoDB storing vector embeddings and model weights encrypted with AWS KMS."
relationships:
  - source: "API Gateway"
    destination: "API Router Layer"
    description: "Routes recommendation requests via gRPC over mTLS using AWS App Mesh."
  - source: "API Router Layer"
    destination: "Inference Engine Component"
    description: "Delegates request handling via in-memory Python function calls."
  - source: "Inference Engine Component"
    destination: "Recommendation Cache"
    description: "Fetches precomputed recommendations via TCP/Redis Protocol with TLS-in-transit."
  - source: "Inference Engine Component"
    destination: "Database"
    description: "Executes fallback reads for sparse user profiles via HTTPS using AWS SDK."
  - source: "Data Sync Worker"
    destination: "Database"
    description: "Persists updated model weights and embeddings via HTTPS using AWS SDK."
  - source: "AWS EventBridge/SQS"
    destination: "Data Sync Worker"
    description: "Consumes order events asynchronously."