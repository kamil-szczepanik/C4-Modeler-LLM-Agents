level: component
scope: "Component diagram for the Catalog & Search Microservice container"
parentContainer:
  name: "Catalog & Search Microservice"
elements:
  - type: "component"
    name: "SearchController"
    technology: "Spring MVC / gRPC"
    description: "Spring MVC component exposing gRPC endpoints for keyword and faceted searches."
  - type: "component"
    name: "CatalogQueryService"
    technology: "Spring Service"
    description: "Spring Service orchestrating queries against AWS OpenSearch."
  - type: "component"
    name: "CatalogAdminController"
    technology: "Spring MVC"
    description: "Spring MVC component handling administrative mutations with strict RBAC."
  - type: "component"
    name: "CatalogRepository"
    technology: "Spring Data JPA"
    description: "Spring Data JPA component managing writes and reads against AWS Aurora PostgreSQL."
  - type: "component"
    name: "InventoryConsumer"
    technology: "Spring Kafka"
    description: "Spring Kafka consumer processing asynchronous inventory updates."
  - type: "component"
    name: "SearchAnalyticsService"
    technology: "Spring Component"
    description: "Component capturing anonymous search telemetry asynchronously."
  - type: "component"
    name: "AWS OpenSearch"
    technology: "Managed Search Engine"
    description: "Managed search engine for typo-tolerant full-text search."
  - type: "component"
    name: "AWS Aurora PostgreSQL"
    technology: "Relational Database"
    description: "Relational database for canonical book metadata."
  - type: "component"
    name: "AWS MSK (Kafka)"
    technology: "Event Streaming Platform"
    description: "Event streaming platform for domain events (catalog.updated)."
relationships:
  - source: "API Gateway"
    destination: "SearchController"
    description: "Routes search and catalog requests via gRPC over mTLS."
  - source: "API Gateway"
    destination: "CatalogAdminController"
    description: "Routes administrative mutations via gRPC over mTLS with JWT validation."
  - source: "CatalogQueryService"
    destination: "AWS OpenSearch"
    description: "Queries catalog data via REST over HTTPS with TLS."
  - source: "CatalogRepository"
    destination: "AWS Aurora PostgreSQL"
    description: "Reads and writes canonical data via JDBC with AWS KMS encryption at rest."
  - source: "InventoryConsumer"
    destination: "AWS MSK (Kafka)"
    description: "Consumes inventory update events via AMQP/Kafka."
  - source: "CatalogAdminController"
    destination: "CatalogRepository"
    description: "Writes metadata via JDBC."
  - source: "CatalogAdminController"
    destination: "AWS MSK (Kafka)"
    description: "Emits catalog.updated domain events secured with AWS KMS."
  - source: "SearchAnalyticsService"
    destination: "SearchAnalyticsService"
    description: "Publishes anonymous telemetry asynchronously."