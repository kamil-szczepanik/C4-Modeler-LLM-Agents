level: component
scope: "Component diagram for the Order & Checkout Microservice container"
parentContainer:
  name: "Order & Checkout Microservice"
elements:
  - type: "component"
    name: "Shopper & Customer Support Agent"
    technology: "Human Actor / Client"
    description: "Internal actors interacting with the checkout and order management flows."
  - type: "component"
    name: "Order API Controller"
    technology: "Node.js & TypeScript, gRPC, JWT"
    description: "Handles incoming gRPC requests and JWT-based authorization."
  - type: "component"
    name: "Checkout Orchestrator (Saga Coordinator)"
    technology: "Node.js & TypeScript"
    description: "Manages distributed transaction workflows and transient failures."
  - type: "component"
    name: "Payment Processor Client"
    technology: "Node.js & TypeScript, HTTPS REST API"
    description: "Integrates with the Payment Gateway using tokenization."
  - type: "component"
    name: "Fulfillment Adapter"
    technology: "Node.js & TypeScript, HTTPS API"
    description: "Interfaces with the Third-Party Shipping Partner API."
  - type: "component"
    name: "Tax & Currency Evaluator"
    technology: "Node.js & TypeScript, HTTPS REST"
    description: "Handles real-time USD, EUR, and GBP conversion."
  - type: "component"
    name: "Retry & DLQ Manager"
    technology: "AWS SQS with AWS KMS"
    description: "Manages asynchronous failure resilience."
  - type: "component"
    name: "Event Publisher"
    technology: "Node.js & TypeScript, AWS EventBridge / SNS"
    description: "Dispatches domain events to downstream services."
  - type: "component"
    name: "Order Repository"
    technology: "AWS Aurora PostgreSQL & TypeORM"
    description: "Persists encrypted transaction and order data."
  - type: "component"
    name: "API Gateway"
    technology: "Gateway"
    description: "Routes incoming checkout requests."
  - type: "component"
    name: "Notification Microservice"
    technology: "Microservice"
    description: "Receives domain events for notifications."
  - type: "component"
    name: "AWS Aurora PostgreSQL"
    technology: "AWS Aurora PostgreSQL"
    description: "Relational data store enforcing field-level encryption for PII."
relationships:
  - source: "API Gateway"
    destination: "Order API Controller"
    description: "Routes incoming checkout requests [gRPC over mTLS via AWS App Mesh]"
  - source: "Checkout Orchestrator (Saga Coordinator)"
    destination: "Payment Processor Client"
    description: "Processes financial transactions [HTTPS REST API]"
  - source: "Checkout Orchestrator (Saga Coordinator)"
    destination: "Fulfillment Adapter"
    description: "Sends fulfillment data [HTTPS API]"
  - source: "Checkout Orchestrator (Saga Coordinator)"
    destination: "Tax & Currency Evaluator"
    description: "Fetches localized pricing [HTTPS REST]"
  - source: "Checkout Orchestrator (Saga Coordinator)"
    destination: "Retry & DLQ Manager"
    description: "Offloads transient failures [AWS SQS with AWS KMS]"
  - source: "Event Publisher"
    destination: "Notification Microservice"
    description: "Dispatches order state changes [AWS EventBridge / SNS]"
  - source: "Order Repository"
    destination: "AWS Aurora PostgreSQL"
    description: "Persists order data [TCP with AWS KMS encryption at rest]"