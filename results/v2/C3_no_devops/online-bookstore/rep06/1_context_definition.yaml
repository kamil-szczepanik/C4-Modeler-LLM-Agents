# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "An Amazon-style global e-commerce platform for purchasing physical and electronic books, supporting multi-currency transactions, recommendations, and reviews."
elements:
  - type: "person"
    name: "Customer"
    description: "Book Buyer who browses, buys, reviews books, and authenticates via identity providers."
  - type: "person"
    name: "Site Administrator"
    description: "Content Moderator who manages the catalog and moderates platform content."
  - type: "externalSystem"
    name: "Third-Party Shipping Partner"
    description: "External partner that handles physical order fulfillment and shipping."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe/PayPal service used for processing financial transactions securely."
  - type: "externalSystem"
    name: "Tax & Currency Service"
    description: "External service handling multi-currency conversion and tax calculations."
  - type: "externalSystem"
    name: "Third-Party Identity Provider"
    description: "Google/Apple OAuth 2.0 / OIDC provider used to streamline customer authentication."
  - type: "externalSystem"
    name: "Notification Service"
    description: "AWS SES / SendGrid service that dispatches transactional emails."
relationships:
  - source: "Customer"
    destination: "Online Bookstore System"
    description: "Browses, buys, reviews"
    technology: "HTTPS"
  - source: "Site Administrator"
    destination: "Online Bookstore System"
    description: "Manages catalog and moderates"
    technology: "HTTPS"
  - source: "Customer"
    destination: "Third-Party Identity Provider"
    description: "Authenticates"
    technology: "OIDC / OAuth 2.0"
  - source: "Online Bookstore System"
    destination: "Third-Party Identity Provider"
    description: "Validates tokens"
    technology: "HTTPS"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Processes transactions"
    technology: "HTTPS / REST / TLS 1.3"
  - source: "Online Bookstore System"
    destination: "Third-Party Shipping Partner"
    description: "Sends fulfillment orders"
    technology: "HTTPS / REST"
  - source: "Online Bookstore System"
    destination: "Notification Service"
    description: "Dispatches transactional emails"
    technology: "HTTPS / REST / AWS SQS"