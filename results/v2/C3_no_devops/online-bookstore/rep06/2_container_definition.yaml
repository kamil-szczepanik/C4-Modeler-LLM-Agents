level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Customer"
    description: "Book Buyer who browses, buys, reviews books, and authenticates."
  - type: "person"
    name: "Site Administrator"
    description: "Content Moderator who manages the catalog and moderates platform content."
  - type: "externalSystem"
    name: "Third-Party Shipping Partner"
    description: "External partner that handles physical order fulfillment and shipping."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Service used for processing financial transactions securely."
  - type: "externalSystem"
    name: "Tax & Currency Service"
    description: "External service handling multi-currency conversion and tax calculations."
  - type: "externalSystem"
    name: "Third-Party Identity Provider"
    description: "OAuth 2.0 / OIDC provider used to streamline customer authentication."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Service that dispatches transactional emails and notifications."
  - type: "container"
    name: "Single Page App"
    technology: "React, TypeScript, AWS S3, AWS CloudFront"
    description: "Provides the responsive user interface for catalog browsing, secure checkout, reviews, and recommendations."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway"
    description: "Routes incoming requests from the frontend to the backend microservices securely."
  - type: "container"
    name: "Catalog & Search Microservice"
    technology: "Spring Boot, Java, AWS ECS Fargate, AWS OpenSearch"
    description: "Handles book catalog management and sub-2-second keyword search."
  - type: "container"
    name: "Order & Checkout Microservice"
    technology: "Node.js, TypeScript, AWS ECS Fargate"
    description: "Processes customer orders, payments, and shipping integrations."
  - type: "container"
    name: "Recommendation Microservice"
    technology: "FastAPI, Python, AWS ECS Fargate"
    description: "Provides personalized book recommendations to customers."
  - type: "container"
    name: "Content Management & Moderation Microservice"
    technology: "Node.js, TypeScript, AWS ECS Fargate"
    description: "Manages platform content and reviews moderation."
  - type: "container"
    name: "Notification Microservice"
    technology: "Node.js, TypeScript, AWS ECS Fargate"
    description: "Handles asynchronous notifications and messaging to users."
  - type: "container"
    name: "Database"
    technology: "AWS Aurora PostgreSQL, AWS DynamoDB, AWS KMS"
    description: "Primary persistent data stores with encryption at rest."
relationships:
  - source: "Customer"
    destination: "Single Page App"
    description: "Browses, buys, reviews, and manages account"
    technology: "HTTPS over TLS 1.3"
  - source: "Site Administrator"
    destination: "Single Page App"
    description: "Manages catalog and moderates content"
    technology: "HTTPS over TLS 1.3"
  - source: "Single Page App"
    destination: "API Gateway"
    description: "Makes API requests"
    technology: "HTTPS/JSON REST APIs"
  - source: "API Gateway"
    destination: "Catalog & Search Microservice"
    description: "Routes search and catalog requests"
    technology: "gRPC over mTLS via AWS App Mesh"
  - source: "API Gateway"
    destination: "Order & Checkout Microservice"
    description: "Routes order and checkout requests"
    technology: "gRPC over mTLS via AWS App Mesh"
  - source: "API Gateway"
    destination: "Recommendation Microservice"
    description: "Routes recommendation requests"
    technology: "gRPC over mTLS via AWS App Mesh"
  - source: "API Gateway"
    destination: "Content Management & Moderation Microservice"
    description: "Routes moderation requests"
    technology: "gRPC over mTLS via AWS App Mesh"
  - source: "API Gateway"
    destination: "Notification Microservice"
    description: "Routes notification requests"
    technology: "gRPC over mTLS via AWS App Mesh"
  - source: "Catalog & Search Microservice"
    destination: "Database"
    description: "Reads and writes catalog data"
    technology: "TCP with AWS KMS encryption at rest"
  - source: "Order & Checkout Microservice"
    destination: "Database"
    description: "Reads and writes order data"
    technology: "TCP with AWS KMS encryption at rest"
  - source: "Recommendation Microservice"
    destination: "Database"
    description: "Reads recommendation data"
    technology: "TCP with AWS KMS encryption at rest"
  - source: "Content Management & Moderation Microservice"
    destination: "Database"
    description: "Reads and writes moderation data"
    technology: "TCP with AWS KMS encryption at rest"
  - source: "Order & Checkout Microservice"
    destination: "Payment Gateway"
    description: "Processes financial transactions"
    technology: "HTTPS REST API"
  - source: "Order & Checkout Microservice"
    destination: "Third-Party Shipping Partner"
    description: "Sends fulfillment orders"
    technology: "HTTPS API"
  - source: "Notification Microservice"
    destination: "Notification Service"
    description: "Dispatches transactional emails"
    technology: "HTTPS REST / AWS SQS"
  - source: "Customer"
    destination: "Third-Party Identity Provider"
    description: "Authenticates identity"
    technology: "OIDC / OAuth 2.0"