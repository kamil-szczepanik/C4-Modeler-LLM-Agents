level: component
scope: "Component diagram for the Core Microservices container"
parentContainer:
  name: "Core Microservices"
elements:
  - type: "component"
    name: "Catalog Service"
    technology: "Go"
    description: "Manages the book catalog, product details, and inventory."
  - type: "component"
    name: "Checkout & Cart Service"
    technology: "Go"
    description: "Handles shopping cart state, order processing, and integration with payment gateways."
  - type: "component"
    name: "Recommendation Service"
    technology: "Python"
    description: "Provides personalized book recommendations to customers."
  - type: "component"
    name: "Review & Rating Service"
    technology: "Node.js"
    description: "Manages customer reviews, ratings, and feedback."
  - type: "component"
    name: "Moderation Worker"
    technology: "Python"
    description: "Moderates user-submitted reviews and content asynchronously."
relationships:
  - source: "Checkout & Cart Service"
    destination: "Payment Gateway"
    description: "Processes transactions via HTTPS/JSON"
  - source: "Core Microservices"
    destination: "Async Event Bus"
    description: "Publishes and consumes domain events via JSON over SNS/SQS"
  - source: "Core Microservices"
    destination: "Data Stores"
    description: "Reads and writes data via PostgreSQL protocol, DynamoDB API, and Elasticsearch API"