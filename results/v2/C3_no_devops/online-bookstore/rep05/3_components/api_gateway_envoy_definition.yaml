level: component
scope: "Component diagram for the API Gateway / Envoy container"
parentContainer:
  name: "API Gateway / Envoy"
elements:
  - type: "component"
    name: "AWS API Gateway Edge Router"
    technology: "AWS API Gateway"
    description: "Handles edge routing, ingress traffic entry, and initial request distribution."
  - type: "component"
    name: "Envoy Proxy Router"
    technology: "Envoy Proxy"
    description: "Performs low-latency service mesh routing, mTLS enforcement, and downstream load balancing."
  - type: "component"
    name: "Rate Limiter"
    technology: "Envoy Rate Limiting Extension / AWS ElastiCache (Redis)"
    description: "Evaluates rate limits and tracks token buckets for incoming client requests."
  - type: "component"
    name: "OWASP Defense Filter"
    technology: "AWS WAF / Custom Envoy Filter"
    description: "Blocks web exploits, SQL injections, and malicious bot traffic at the edge."
relationships:
  - source: "AWS API Gateway Edge Router"
    destination: "OWASP Defense Filter"
    description: "Inspects inbound requests for security threats via [HTTPS]"
  - source: "OWASP Defense Filter"
    destination: "Rate Limiter"
    description: "Checks request volume limits via [TCP]"
  - source: "Rate Limiter"
    destination: "Envoy Proxy Router"
    description: "Allows or rejects authenticated requests based on rate policies"
  - source: "Envoy Proxy Router"
    destination: "Core Microservices"
    description: "Routes authenticated requests via [gRPC over HTTP/2, mTLS]"