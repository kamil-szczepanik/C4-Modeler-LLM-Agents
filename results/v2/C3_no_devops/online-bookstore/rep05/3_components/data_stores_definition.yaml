level: component
scope: "Component diagram for the Data Stores container"
parentContainer:
  name: "Data Stores"
elements:
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "PostgreSQL"
    description: "Multi-region ACID transactions for core bookstore entities."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "DynamoDB Global Tables"
    description: "Low-latency storage for user shopping carts."
  - type: "component"
    name: "AWS OpenSearch Service"
    technology: "OpenSearch"
    description: "Handles global catalog search and personalized recommendations."
  - type: "component"
    name: "Identity & Compliance DB"
    technology: "Database"
    description: "Stores user identity and compliance-related records."
  - type: "component"
    name: "AWS Lambda Data Deletion Worker"
    technology: "AWS Lambda"
    description: "Executes cryptographic erasure and data deletion for GDPR/CCPA compliance."
relationships:
  - source: "AWS Lambda Data Deletion Worker"
    destination: "Identity & Compliance DB"
    description: "Deletes user data for compliance"
  - source: "AWS Lambda Data Deletion Worker"
    destination: "Amazon Aurora PostgreSQL"
    description: "Purges personal data"
  - source: "AWS Lambda Data Deletion Worker"
    destination: "Amazon DynamoDB"
    description: "Removes cart and session data"