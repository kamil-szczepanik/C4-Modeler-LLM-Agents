level: component
scope: "Component diagram for the Analytics & Event Tracking Container container"
parentContainer:
  name: "Analytics & Event Tracking Container"
elements:
  - type: "component"
    name: "Customers and Bookstore Administrators"
    technology: "Human / User"
    description: "Users interacting with the system, including customers sending clickstream/search events and administrators querying dashboards."
  - type: "component"
    name: "Single Page Application"
    technology: "Web Browser / Frontend"
    description: "Sends clickstream and search events."
  - type: "component"
    name: "Ingestion API"
    technology: "Node.js / AWS API Gateway"
    description: "Receives real-time telemetry ingestion and forwards scrubbed events."
  - type: "component"
    name: "Stream Processor"
    technology: "AWS Kinesis / Apache Flink"
    description: "Performs data masking and analytical processing for real-time telemetry."
  - type: "component"
    name: "Async Event Bus"
    technology: "Amazon EventBridge"
    description: "Publishes real-time user actions."
  - type: "component"
    name: "Data Firehose"
    technology: "AWS Kinesis Data Firehose"
    description: "Persists aggregated analytics to data stores."
  - type: "component"
    name: "Reporting & Insights API"
    technology: "Node.js / AWS Lambda"
    description: "Executes analytical queries for administrative sales insights and dashboards."
  - type: "component"
    name: "Data Stores"
    technology: "AWS S3 / Snowflake"
    description: "High-performance data warehousing for historical analytics and data-at-rest storage."
relationships:
  - source: "Single Page Application"
    destination: "Ingestion API"
    description: "Sends clickstream and search events [HTTPS / JSON]"
  - source: "Ingestion API"
    destination: "Stream Processor"
    description: "Forwards scrubbed events [AWS Kinesis]"
  - source: "Stream Processor"
    destination: "Async Event Bus"
    description: "Publishes real-time user actions [Amazon EventBridge]"
  - source: "Data Firehose"
    destination: "Data Stores"
    description: "Persists aggregated analytics [S3/Snowflake Bulk Load]"
  - source: "Customers and Bookstore Administrators"
    destination: "Reporting & Insights API"
    description: "Queries dashboards [HTTPS / JSON]"
  - source: "Reporting & Insights API"
    destination: "Data Stores"
    description: "Executes analytical queries [JDBC / Snowflake SQL]"