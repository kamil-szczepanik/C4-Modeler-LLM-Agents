level: component
scope: "Component diagram for the Async Event Bus container"
parentContainer:
  name: "Async Event Bus"
elements:
  - type: "component"
    name: "Event Router & Bus"
    technology: "Amazon EventBridge / SNS"
    description: "Handles high-throughput event routing and pub/sub messaging."
  - type: "component"
    name: "Message Queues"
    technology: "Amazon SQS"
    description: "Buffers decoupled workloads to absorb traffic spikes and guarantee delivery."
  - type: "component"
    name: "DLQ Handler"
    technology: "Amazon SQS + AWS Lambda"
    description: "Runs serverless DLQ scrubbing and alerting logic to capture and scrub poisoned messages."
  - type: "component"
    name: "Event Schema Registry"
    technology: "Amazon EventBridge Schema Registry"
    description: "Validates JSON event payloads and prevents malformed data propagation."
relationships:
  - source: "Core Microservices"
    destination: "Event Router & Bus"
    description: "Publish domain events with AWS SigV4 [HTTPS]"
  - source: "Event Router & Bus"
    destination: "Event Schema Registry"
    description: "Validate event payload structure [Internal AWS API]"
  - source: "Event Router & Bus"
    destination: "Message Queues"
    description: "Fan-out valid events to subscriber queues [SQS Protocol]"
  - source: "Message Queues"
    destination: "Third-Party Shipping API"
    description: "Trigger fulfillment [HTTPS/REST]"
  - source: "Message Queues"
    destination: "DLQ Handler"
    description: "Capture and scrub poisoned messages [SQS/Lambda]"