level: component
scope: "Component diagram for the Single Page Application (SPA) container"
parentContainer:
  name: "Single Page Application (SPA)"
elements:
  - type: "component"
    name: "Routing & View Manager"
    technology: "React Router"
    description: "Enables seamless client-side navigation for customers and administrators."
  - type: "component"
    name: "State & Session Store"
    technology: "Redux Toolkit / React Context"
    description: "Manages cart, catalog cache, and multi-currency state (USD, EUR, GBP)."
  - type: "component"
    name: "API Client"
    technology: "Axios/Fetch wrappers"
    description: "Communicates with API Gateway via HTTPS/REST using HttpOnly cookies."
  - type: "component"
    name: "Localization Engine"
    technology: "React i18n / Custom JS"
    description: "Handles locale, formatting, and currency conversion."
  - type: "component"
    name: "Telemetry & Event Tracker"
    technology: "Asynchronous JS / navigator.sendBeacon"
    description: "Streams clickstream and behavioral data asynchronously to analytics."
relationships:
  - source: "Routing & View Manager"
    destination: "State & Session Store"
    description: "Reads and updates application state during navigation"
  - source: "API Client"
    destination: "API Gateway / Envoy"
    description: "Sends API requests via HTTPS/REST"
  - source: "Telemetry & Event Tracker"
    destination: "Analytics & Event Tracking Container"
    description: "Streams behavioral data via navigator.sendBeacon to AWS Kinesis"