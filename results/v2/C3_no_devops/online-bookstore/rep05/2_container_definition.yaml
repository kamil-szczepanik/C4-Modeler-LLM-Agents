level: container
scope: "Container diagram for Online Bookstore Software System"
system:
  name: "Online Bookstore Software System"
elements:
  - type: "person"
    name: "Customer"
    description: "Shopper who browses, purchases, and reviews physical and electronic books."
  - type: "person"
    name: "Bookstore Administrator"
    description: "Administrator who manages the bookstore operations and catalog."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processor such as Stripe or PayPal."
  - type: "externalSystem"
    name: "Third-Party Shipping"
    description: "External partner responsible for shipping logistics and tracking."
  - type: "externalSystem"
    name: "Tax Service"
    description: "External service handling tax calculations."
  - type: "container"
    name: "Single Page Application (SPA)"
    technology: "React, AWS S3, CloudFront"
    description: "Global low-latency frontend delivery providing user interface for customers and administrators."
  - type: "container"
    name: "API Gateway / Envoy"
    technology: "AWS API Gateway, Envoy"
    description: "Provides OWASP Top-10 defense, rate limiting, and JWT validation."
  - type: "container"
    name: "Core Microservices"
    technology: "Node.js / Go / Python, AWS ECS/Fargate, AWS App Mesh"
    description: "Scalable microservices execution handling catalog, checkout, and recommendation."
  - type: "container"
    name: "Analytics & Event Tracking Container"
    technology: "AWS Kinesis, Firehose, S3/Snowflake"
    description: "Real-time telemetry ingestion with edge data masking."
  - type: "container"
    name: "Async Event Bus"
    technology: "Amazon EventBridge, SNS, SQS"
    description: "Handles asynchronous event distribution for fulfillment and system messaging."
  - type: "container"
    name: "Data Stores"
    technology: "AWS RDS PostgreSQL, DynamoDB, Identity & Compliance DB, Elasticsearch"
    description: "Transactional, high-throughput NoSQL, identity, and search data persistence."
relationships:
  - source: "Customer"
    destination: "Single Page Application (SPA)"
    description: "Browses, purchases, and reviews books"
    technology: "HTTPS / React & AWS CloudFront (<2s load time)"
  - source: "Bookstore Administrator"
    destination: "Single Page Application (SPA)"
    description: "Manages bookstore operations and catalog"
    technology: "HTTPS / React & AWS CloudFront"
  - source: "Single Page Application (SPA)"
    destination: "API Gateway / Envoy"
    description: "Sends API requests"
    technology: "HTTPS/REST"
  - source: "API Gateway / Envoy"
    destination: "Core Microservices"
    description: "Routes authenticated requests securely"
    technology: "mTLS (AWS App Mesh)"
  - source: "Core Microservices"
    destination: "Payment Gateway"
    description: "Processes payments via Checkout Service"
    technology: "HTTPS/JSON"
  - source: "Core Microservices"
    destination: "Tax Service"
    description: "Calculates taxes via Checkout Service"
    technology: "HTTPS/JSON"
  - source: "Core Microservices"
    destination: "Async Event Bus"
    description: "Publishes and consumes events"
    technology: "AMQP/HTTPS"
  - source: "Core Microservices"
    destination: "Data Stores"
    description: "Reads and writes transactional and operational data"
    technology: "PostgreSQL protocol / DynamoDB API / Elasticsearch API"
  - source: "Analytics & Event Tracking Container"
    destination: "Data Stores"
    description: "Persists masked telemetry and analytics data"
    technology: "S3 / Snowflake ingestion"
  - source: "Async Event Bus"
    destination: "Third-Party Shipping"
    description: "Triggers fulfillment and shipping processes"
    technology: "HTTPS/REST"