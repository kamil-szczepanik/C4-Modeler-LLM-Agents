level: context
scope: "System Context diagram for Online Bookstore Software System"
system:
  name: "Online Bookstore Software System"
  description: "An Amazon-style global e-commerce platform for physical and electronic books with recommendations, reviews, and multi-currency support, deployed across three global AWS regions for high availability, sub-2-second performance, and GDPR/CCPA compliance."
elements:
  - type: "person"
    name: "Customer"
    description: "Shopper who browses, purchases, and reviews physical and electronic books."
  - type: "person"
    name: "Bookstore Administrator"
    description: "Administrator who manages the bookstore operations and catalog."
  - type: "externalSystem"
    name: "Third-Party Fulfillment Partner"
    description: "Partner responsible for fulfilling book orders and shipping."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processor such as Stripe or PayPal."
  - type: "externalSystem"
    name: "Third-Party Shipping Provider APIs"
    description: "External APIs used for shipping logistics and tracking."
  - type: "externalSystem"
    name: "Identity Provider / Auth Service"
    description: "Authentication and identity service such as Auth0 or AWS Cognito."
  - type: "externalSystem"
    name: "Tax & Compliance Service"
    description: "External service handling tax calculations and regulatory compliance."
relationships:
  - source: "Customer"
    destination: "Online Bookstore Software System"
    description: "Uses the bookstore platform to browse, purchase, and review books"
    technology: "HTTPS (TLS 1.3)"
  - source: "Bookstore Administrator"
    destination: "Online Bookstore Software System"
    description: "Accesses bookstore management functions securely"
    technology: "ZTNA-secured HTTPS sessions"
  - source: "Third-Party Fulfillment Partner"
    destination: "Online Bookstore Software System"
    description: "Accesses fulfillment data and updates order status"
    technology: "ZTNA-secured HTTPS sessions"
  - source: "Online Bookstore Software System"
    destination: "Payment Gateway"
    description: "Processes payments and receives payment webhooks"
    technology: "HTTPS/REST with HMAC SHA-256 webhooks"
  - source: "Online Bookstore Software System"
    destination: "Third-Party Shipping Provider APIs"
    description: "Sends shipping requests and receives tracking webhooks"
    technology: "HTTPS/REST with HMAC SHA-256 webhooks"
  - source: "Online Bookstore Software System"
    destination: "Identity Provider / Auth Service"
    description: "Authenticates users and verifies sessions"
    technology: "OIDC/OAuth2"
  - source: "Online Bookstore Software System"
    destination: "Tax & Compliance Service"
    description: "Calculates taxes and checks compliance regulations"
    technology: "HTTPS/REST using OAuth 2.0 client credentials and mTLS"