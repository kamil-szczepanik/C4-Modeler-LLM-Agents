level: component
scope: "Component diagram for the Migration Control & Routing Engine container"
parentContainer:
  name: "Migration Control & Routing Engine"
elements:
  - type: "component"
    name: "Routing Rules Evaluator"
    technology: "Azure Function"
    description: "Evaluates claim destination and delegates canary and temporal cohorts."
  - type: "component"
    name: "Migration Registry Store"
    technology: "Azure Cosmos DB"
    description: "Stores active routing flags, schedules, and migration registry state."
  - type: "component"
    name: "Control Plane API"
    technology: "Azure Function"
    description: "Manages routing rules, feature flags, and emergency rollbacks."
  - type: "component"
    name: "Traffic Splitter & Scheduler"
    technology: "Azure Function"
    description: "Handles canary traffic splitting and temporal cohorts."
  - type: "component"
    name: "Azure API Management"
    technology: "Azure API Management (APIM)"
    description: "Exposes endpoints for evaluating claim destinations."
  - type: "component"
    name: "Azure Key Vault"
    technology: "Azure Key Vault"
    description: "Secure storage for salts and customer-managed keys."
  - type: "component"
    name: "Azure Monitor / Sentinel"
    technology: "Azure Monitor / Sentinel"
    description: "Provides monitoring and security logging."
  - type: "component"
    name: "Operations/Migration Managers"
    technology: "Person"
    description: "Manages routing rules and emergency rollbacks using HTTPS / Azure AD RBAC."
relationships:
  - source: "Operations/Migration Managers"
    destination: "Control Plane API"
    description: "Manages routing rules and emergency rollbacks [HTTPS / Azure AD RBAC]"
  - source: "Azure API Management"
    destination: "Routing Rules Evaluator"
    description: "Evaluates claim destination [REST / HTTPS]"
  - source: "Routing Rules Evaluator"
    destination: "Migration Registry Store"
    description: "Reads active routing flags [Cosmos DB SDK / TLS 1.3]"
  - source: "Routing Rules Evaluator"
    destination: "Traffic Splitter & Scheduler"
    description: "Delegates canary and temporal cohorts [Internal Function-to-Function / VNet Integration]"
  - source: "Control Plane API"
    destination: "Migration Registry Store"
    description: "Persists schedules and feature flags [Cosmos DB SDK]"