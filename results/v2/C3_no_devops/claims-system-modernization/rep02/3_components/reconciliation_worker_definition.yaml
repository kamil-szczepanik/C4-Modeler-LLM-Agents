level: component
scope: "Component diagram for the Reconciliation Worker container"
parentContainer:
  name: "Reconciliation Worker"
elements:
  - type: "component"
    name: "Mainframe Data Extractor"
    technology: "C# / .NET Worker Service"
    description: "Streams raw records from the legacy mainframe system."
  - type: "component"
    name: "Platform State Comparator"
    technology: "C# / .NET Worker Service"
    description: "Compares platform and mainframe state snapshots."
  - type: "component"
    name: "Fallback Rule Evaluator"
    technology: "C# / .NET Worker Service"
    description: "Evaluates fallback rules and risk thresholds."
  - type: "component"
    name: "Reconciliation Worker"
    technology: "Azure Container Apps Background Jobs"
    description: "Pulls state snapshots from the legacy mainframe system and manages background reconciliation."
  - type: "component"
    name: "Legacy Mainframe System"
    technology: "Mainframe / SFTP / Flat File"
    description: "Legacy system providing state snapshots."
  - type: "component"
    name: "Audit & Reconciliation Ledger"
    technology: "Azure SQL Ledger"
    description: "Logs state comparisons with cryptographic verification."
  - type: "component"
    name: "Azure App Configuration"
    technology: "HTTPS / Managed Identity"
    description: "Stores and provides risk thresholds."
  - type: "component"
    name: "Discrepancy Notifier"
    technology: "Azure Service Bus"
    description: "Publishes enriched discrepancy alerts."
  - type: "component"
    name: "Azure Key Vault"
    technology: "HTTPS / Managed Identity"
    description: "Retrieves encryption keys and secrets."
relationships:
  - source: "Reconciliation Worker"
    destination: "Legacy Mainframe System"
    description: "Pulls state snapshots [SFTP / Flat File / TLS 1.3]"
  - source: "Mainframe Data Extractor"
    destination: "Platform State Comparator"
    description: "Streams raw records [In-Memory / Internal IPC]"
  - source: "Platform State Comparator"
    destination: "Audit & Reconciliation Ledger"
    description: "Logs state comparisons [Entity Framework Core / TDS over TLS]"
  - source: "Fallback Rule Evaluator"
    destination: "Azure App Configuration"
    description: "Fetches risk thresholds [HTTPS / Managed Identity]"
  - source: "Fallback Rule Evaluator"
    destination: "Discrepancy Notifier"
    description: "Publishes enriched alerts [Azure Service Bus / AMQP]"
  - source: "Reconciliation Worker"
    destination: "Azure Key Vault"
    description: "Retrieves encryption keys and secrets [HTTPS / Managed Identity]"