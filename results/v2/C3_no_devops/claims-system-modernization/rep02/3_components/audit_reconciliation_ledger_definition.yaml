level: component
scope: "Component diagram for the Audit & Reconciliation Ledger container"
parentContainer:
  name: "Audit & Reconciliation Ledger"
elements:
  - type: "component"
    name: "Ledger Storage Engine"
    technology: "Azure SQL Ledger"
    description: "Tamper-evident tables with cryptographic hashing and append-only storage for immutable audit records."
  - type: "component"
    name: "Audit Query API"
    technology: "Azure Function"
    description: "Provides endpoints for reading immutable audit reports and discrepancy dashboards."
  - type: "component"
    name: "Discrepancy Notification Service"
    technology: "Azure Event Grid / Functions"
    description: "Handles notifications regarding discrepancies found during data processing."
  - type: "component"
    name: "Reconciliation Data Processor"
    technology: "Azure Function"
    description: "Processes reconciliation output streams and logs records into the ledger storage."
relationships:
  - source: "Reconciliation Data Processor"
    destination: "Ledger Storage Engine"
    description: "Logs reconciliation records and audit data [Database Connection with mTLS / Managed Identities]"
  - source: "Compliance & Risk Officer"
    destination: "Audit Query API"
    description: "Reads immutable audit reports and discrepancy dashboards [HTTPS/REST with OAuth2/OIDC]"
  - source: "Reconciliation Worker"
    destination: "Reconciliation Data Processor"
    description: "Sends reconciliation output streams [HTTP/JSON or Azure Service Bus Queue with Managed Identities]"
  - source: "Claims Processing Core"
    destination: "Ledger Storage Engine"
    description: "Writes audit logs [Database Connection]"