level: component
scope: "Component diagram for the Anti-Corruption Layer & Integration container"
parentContainer:
  name: "Anti-Corruption Layer & Integration"
elements:
  - type: "component"
    name: "Route Mediator"
    technology: "Apache Camel"
    description: "Handles content-based routing and domain event translation."
  - type: "component"
    name: "Mainframe Adapter"
    technology: "JCA/MQ Client"
    description: "Interfaces with the legacy mainframe system using IBM MQ over mTLS with circuit breakers."
  - type: "component"
    name: "Dead-Letter & Audit Handler"
    technology: "Azure Functions & Azure SQL Ledger"
    description: "Manages dead-letter queues and provides tamper-resistant, immutable audit logging for compliance and consistency (R-04)."
  - type: "person"
    name: "Operations/Migration Managers"
    technology: "Internal Users"
    description: "Internal users who access failure metrics via Azure AD SSO and RBAC."
  - type: "system"
    name: "Legacy Mainframe System"
    technology: "IBM MQ"
    description: "The legacy mainframe system communicating via IBM MQ."
relationships:
  - source: "Route Mediator"
    destination: "Mainframe Adapter"
    description: "Internal Reactive Streams / In-memory Queue"
  - source: "Mainframe Adapter"
    destination: "Legacy Mainframe System"
    description: "IBM MQ (AMQP/JMS) over mTLS with circuit breakers"
  - source: "Route Mediator"
    destination: "Dead-Letter & Audit Handler"
    description: "Azure Service Bus Dead-Letter Queues and Azure Event Grid"
  - source: "Operations/Migration Managers"
    destination: "Dead-Letter & Audit Handler"
    description: "Azure AD SSO (R-07) and RBAC for failure metrics"