level: component
scope: "Component diagram for the Azure API Management container"
parentContainer:
  name: "Azure API Management"
elements:
  - type: "component"
    name: "API Gateway"
    technology: "Azure API Management"
    description: "Central gateway for security, routing, and policy enforcement due to low team cloud experience."
  - type: "component"
    name: "Security & Policy Enforcer"
    technology: "Azure API Management Policies"
    description: "Handles OAuth 2.0 / OpenID Connect validation, rate limiting, and request filtering."
  - type: "component"
    name: "Routing Engine"
    technology: "Azure API Management Routes"
    description: "Forwards requests securely using HTTPS and mTLS to downstream services and the migration control engine."
relationships:
  - source: "API Gateway"
    destination: "Security & Policy Enforcer"
    description: "Enforces policies on incoming requests [HTTPS]"
  - source: "Security & Policy Enforcer"
    destination: "Routing Engine"
    description: "Passes authenticated requests for routing [Internal]"
  - source: "Routing Engine"
    destination: "Migration Control & Routing Engine"
    description: "Routes claim submissions [REST / HTTPS, mTLS]"