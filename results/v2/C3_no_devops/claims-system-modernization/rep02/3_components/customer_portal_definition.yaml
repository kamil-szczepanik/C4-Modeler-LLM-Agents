level: component
scope: "Component diagram for the Customer Portal container"
parentContainer:
  name: "Customer Portal"
elements:
  - type: "component"
    name: "Claim Submission Controller"
    technology: "React Component"
    description: "Handles the online claims submission process for end customers and brokers."
  - type: "component"
    name: "Status Dashboard View"
    technology: "React Component"
    description: "Allows users to track claim statuses and view submission histories."
  - type: "component"
    name: "Auth Client Module"
    technology: "MSAL.js"
    description: "Implements secure in-memory token handling via OAuth 2.0 Authorization Code Flow with PKCE."
  - type: "component"
    name: "Feedback & Support Widget"
    technology: "React Component / Tailwind CSS"
    description: "Provides support and feedback mechanisms for users within the portal."
relationships:
  - source: "Claim Submission Controller"
    destination: "Azure API Management"
    description: "Submits claims and synchronizes drafts via HTTPS/REST (OAuth 2.0 / OpenID Connect with PKCE)."
  - source: "Status Dashboard View"
    destination: "Azure API Management"
    description: "Fetches status updates via HTTPS/REST (OAuth 2.0 / OpenID Connect with PKCE)."
  - source: "Auth Client Module"
    destination: "Azure API Management"
    description: "Authenticates requests and manages tokens securely."