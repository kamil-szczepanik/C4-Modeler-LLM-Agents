level: component
scope: "Component diagram for the Claims Processing Core container"
parentContainer:
  name: "Claims Processing Core"
elements:
  - type: "component"
    name: "Claim Ingestion & Validation Component"
    technology: "Spring Boot container"
    description: "Handling payload validation against domain schemas."
  - type: "component"
    name: "Workflow Orchestrator"
    technology: "Java / Spring Boot"
    description: "Manages multi-step claim lifecycles and idempotent processing."
  - type: "component"
    name: "Claim State Service"
    technology: "Spring Data JPA"
    description: "Managing domain aggregates and exposing transaction state markers."
  - type: "component"
    name: "Legacy Adapter Component"
    technology: "Apache Camel and Spring Integration"
    description: "Translating domain models and synchronizing with the Enterprise Service Bus."
  - type: "component"
    name: "Audit & Reconciliation Ledger"
    technology: "Database / Transaction Log"
    description: "Records immutable state transition events and synchronization logs."
relationships:
  - source: "Claim Ingestion & Validation Component"
    destination: "Workflow Orchestrator"
    description: "Triggers process initiation [gRPC with mTLS]"
  - source: "Workflow Orchestrator"
    destination: "Claim State Service"
    description: "Persists and queries domain aggregates [JPA / JDBC]"
  - source: "Claim State Service"
    destination: "Audit & Reconciliation Ledger"
    description: "Emits immutable state transition events [Database Write / Transaction Log]"
  - source: "Workflow Orchestrator"
    destination: "Legacy Adapter Component"
    description: "Dispatches asynchronous synchronization payloads [Azure Service Bus via AMQP with digital signatures]"