level: component
scope: "Component diagram for the Azure Key Vault container"
parentContainer:
  name: "Azure Key Vault"
elements:
  - type: "component"
    name: "DevOps & Security Engineers"
    technology: "Human Actor"
    description: "Personnel responsible for configuring, managing, and monitoring security policies and access controls within the Azure Key Vault system."
  - type: "component"
    name: "Secrets Management Component"
    technology: "Azure Key Vault Secrets"
    description: "Provides secure secret management for the Insurance Claims Modernization platform, protecting sensitive customer PII and legacy mainframe hybrid integration."
  - type: "component"
    name: "Keys (HSM) Management Component"
    technology: "Azure Key Vault Managed HSM"
    description: "Manages cryptographic keys backed by hardware security modules (HSMs)."
  - type: "component"
    name: "Certificates Management Component"
    technology: "Azure Key Vault Certificates"
    description: "Automates and manages SSL/TLS certificates and lifecycle operations."
  - type: "component"
    name: "Telemetry & Audit Logging Component"
    technology: "Azure Monitor Diagnostic Settings"
    description: "Streams audit logs and telemetry for compliance, alerting, and operational safety."
relationships:
  - source: "Claims Processing Core"
    destination: "Secrets Management Component"
    description: "HTTPS (REST API) using Azure Managed Identities"
  - source: "Audit & Reconciliation Ledger"
    destination: "Keys (HSM) Management Component"
    description: "Azure RBAC for Customer-Managed Keys (CMK)"
  - source: "Customer Portal"
    destination: "Certificates Management Component"
    description: "TLS 1.3"
  - source: "Adjuster Workspace"
    destination: "Certificates Management Component"
    description: "TLS 1.3"
  - source: "Telemetry & Audit Logging Component"
    destination: "Azure Monitor / Sentinel"
    description: "HTTPS/AMQP"