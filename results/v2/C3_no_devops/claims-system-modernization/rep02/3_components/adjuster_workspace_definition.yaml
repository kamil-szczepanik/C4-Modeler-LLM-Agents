level: component
scope: "Component diagram for the Adjuster Workspace container"
parentContainer:
  name: "Adjuster Workspace"
elements:
  - type: "component"
    name: "Adjuster UI"
    technology: "React SPA, Azure Static Web Apps"
    description: "Frontend framework providing a responsive UI rendering for claims adjusters and support agents."
  - type: "component"
    name: "Adjuster BFF / API Gateway"
    technology: "Node.js, Express"
    description: "Backend-for-Frontend (BFF) handling session management, aggregation, and security."
  - type: "component"
    name: "Claim View Cache"
    technology: "Azure Redis Cache"
    description: "In-memory caching layer to meet strict performance targets by pre-fetching data."
  - type: "component"
    name: "Integration Client"
    technology: "gRPC / HTTP Client"
    description: "Client handling communication with external services and integration endpoints."
relationships:
  - source: "Adjuster UI"
    destination: "Adjuster BFF / API Gateway"
    description: "HTTPS / REST"
  - source: "Adjuster BFF / API Gateway"
    destination: "Claim View Cache"
    description: "Redis Protocol over TLS"
  - source: "Adjuster BFF / API Gateway"
    destination: "Azure API Management"
    description: "HTTPS / gRPC with OAuth 2.0"