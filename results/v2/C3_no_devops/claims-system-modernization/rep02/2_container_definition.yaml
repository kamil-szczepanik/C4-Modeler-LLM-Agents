level: container
scope: "Container diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
elements:
  - type: "person"
    name: "End Customers"
    description: "Policyholders who submit online self-service claims."
  - type: "person"
    name: "Brokers"
    description: "Partners who assist with claims and submit information on behalf of customers."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff who use the modern adjuster web application to review and process claims."
  - type: "person"
    name: "Customer Support Agents"
    description: "Support staff who assist users and manage claim inquiries."
  - type: "person"
    name: "Operations/Migration Managers"
    description: "Managers overseeing the incremental claim type migration and system operations."
  - type: "externalSystem"
    name: "Legacy Mainframe System"
    description: "On-premises 30-year-old COBOL/DB2 mainframe acting as the system of record."
  - type: "externalSystem"
    name: "Azure Active Directory / Identity Provider"
    description: "Provides Single Sign-On (SSO) and RBAC authorization."
  - type: "container"
    name: "Customer Portal"
    technology: "React SPA / Azure Static Web Apps"
    description: "Allows end customers and brokers to submit online claims and view status."
  - type: "container"
    name: "Adjuster Workspace"
    technology: "Node.js/Spring Boot BFF + React"
    description: "Provides adjusters and support agents a modern web application to review and process claims."
  - type: "container"
    name: "Azure API Management"
    technology: "Azure API Management"
    description: "API Gateway that secures, manages, and routes incoming traffic to backend containers."
  - type: "container"
    name: "Migration Control & Routing Engine"
    technology: "Azure Functions & Azure Cosmos DB"
    description: "Dynamically directs claim payloads to either the Claims Processing Core or the Anti-Corruption Layer."
  - type: "container"
    name: "Claims Processing Core"
    technology: "Azure Container Apps"
    description: "Handles modern claims processing workflows and microservices."
  - type: "container"
    name: "Anti-Corruption Layer & Integration"
    technology: "Azure Service Bus & Apache Camel"
    description: "Translates and communicates with the legacy mainframe via enterprise messaging."
  - type: "container"
    name: "Reconciliation Worker"
    technology: "Azure Container Apps Background Jobs"
    description: "Cross-checks state changes with the Legacy Mainframe during the nightly batch window."
  - type: "container"
    name: "Audit & Reconciliation Ledger"
    technology: "Azure SQL Ledger"
    description: "Stores tamper-evident audit logs and reconciliation records."
  - type: "container"
    name: "Azure Key Vault"
    technology: "Azure Key Vault"
    description: "Manages secrets, certificates, and keys securely."
relationships:
  - source: "End Customers"
    destination: "Customer Portal"
    description: "Interacts via HTTPS (TLS 1.3)"
    technology: "HTTPS (TLS 1.3)"
  - source: "Brokers"
    destination: "Customer Portal"
    description: "Interacts via HTTPS (TLS 1.3)"
    technology: "HTTPS (TLS 1.3)"
  - source: "Claims Adjusters"
    destination: "Adjuster Workspace"
    description: "Interacts via HTTPS"
    technology: "HTTPS"
  - source: "Customer Support Agents"
    destination: "Adjuster Workspace"
    description: "Interacts via HTTPS"
    technology: "HTTPS"
  - source: "Operations/Migration Managers"
    destination: "Migration Control & Routing Engine"
    description: "Monitors and manages migration routes"
    technology: "HTTPS"
  - source: "Customer Portal"
    destination: "Azure API Management"
    description: "Consumes services"
    technology: "OAuth 2.0 / OpenID Connect"
  - source: "Adjuster Workspace"
    destination: "Azure API Management"
    description: "Consumes services"
    technology: "OAuth 2.0 / OpenID Connect"
  - source: "Azure API Management"
    destination: "Migration Control & Routing Engine"
    description: "Routes claim submissions"
    technology: "REST / HTTPS"
  - source: "Migration Control & Routing Engine"
    destination: "Claims Processing Core"
    description: "Directs payloads for modern processing"
    technology: "Internal API"
  - source: "Migration Control & Routing Engine"
    destination: "Anti-Corruption Layer & Integration"
    description: "Directs payloads destined for legacy integration"
    technology: "Azure Service Bus"
  - source: "Anti-Corruption Layer & Integration"
    destination: "Legacy Mainframe System"
    description: "Communicates with legacy system"
    technology: "Enterprise Service Bus / Message Queue with mTLS"
  - source: "Reconciliation Worker"
    destination: "Legacy Mainframe System"
    description: "Cross-checks state changes during nightly batch window"
    technology: "Batch Processing / mTLS"
  - source: "Reconciliation Worker"
    destination: "Audit & Reconciliation Ledger"
    description: "Logs reconciliation records"
    technology: "Database Connection"
  - source: "Claims Processing Core"
    destination: "Audit & Reconciliation Ledger"
    description: "Writes audit logs"
    technology: "Database Connection"