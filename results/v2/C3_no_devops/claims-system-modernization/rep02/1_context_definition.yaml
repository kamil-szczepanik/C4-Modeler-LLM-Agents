level: context
scope: "System Context diagram for Insurance Claims Modernization Platform"
system:
  name: "Modern Claims Platform"
  description: "Insurance claims modernization platform gradually replacing a 30-year-old on-premises COBOL/DB2 mainframe with a hybrid Azure cloud architecture, enabling online self-service claim submissions and a modern adjuster web application."
elements:
  - type: "person"
    name: "End Customers"
    description: "Policyholders who submit online self-service claims."
  - type: "person"
    name: "Brokers"
    description: "Partners who assist with claims and submit information on behalf of customers."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff who use the modern adjuster web application to review and process claims."
  - type: "person"
    name: "Customer Support Agents"
    description: "Support staff who assist users and manage claim inquiries."
  - type: "person"
    name: "Operations/Migration Managers"
    description: "Managers overseeing the incremental claim type migration and system operations."
  - type: "externalSystem"
    name: "Legacy Mainframe System"
    description: "On-premises 30-year-old COBOL/DB2 mainframe acting as the system of record."
  - type: "externalSystem"
    name: "Enterprise Service Bus / Message Queue"
    description: "ESB/MQ facilitating asynchronous messaging between Azure and the legacy mainframe."
  - type: "externalSystem"
    name: "Azure Active Directory / Identity Provider"
    description: "Provides Single Sign-On (SSO) and RBAC authorization."
  - type: "externalSystem"
    name: "Notification Service"
    description: "SendGrid / Azure Communication Services delivering secure external notifications."
  - type: "externalSystem"
    name: "Azure Monitor / Sentinel"
    description: "Provides monitoring and security oversight for the cloud platform."
relationships:
  - source: "End Customers"
    destination: "Modern Claims Platform"
    description: "Uses for online self-service claim submissions"
    technology: "HTTPS/TLS"
  - source: "Brokers"
    destination: "Modern Claims Platform"
    description: "Uses for claim submissions and management"
    technology: "HTTPS/TLS"
  - source: "Claims Adjusters"
    destination: "Modern Claims Platform"
    description: "Uses the modern adjuster web application"
    technology: "HTTPS/TLS"
  - source: "Customer Support Agents"
    destination: "Modern Claims Platform"
    description: "Uses to assist users and manage claims"
    technology: "HTTPS/TLS"
  - source: "Operations/Migration Managers"
    destination: "Modern Claims Platform"
    description: "Monitors and manages incremental claim type migration"
    technology: "HTTPS/TLS"
  - source: "Modern Claims Platform"
    destination: "Enterprise Service Bus / Message Queue"
    description: "Syncs claims data asynchronously"
    technology: "mTLS"
  - source: "Enterprise Service Bus / Message Queue"
    destination: "Legacy Mainframe System"
    description: "Syncs claims data respecting batch windows"
    technology: "Asynchronous Messaging"
  - source: "Modern Claims Platform"
    destination: "Notification Service"
    description: "Sends secure external notifications"
    technology: "HTTPS/TLS with API Key"
  - source: "Modern Claims Platform"
    destination: "Azure Active Directory / Identity Provider"
    description: "Authenticates users and authorizes access"
    technology: "OpenID Connect / OAuth 2.0"
  - source: "Modern Claims Platform"
    destination: "Azure Monitor / Sentinel"
    description: "Sends telemetry and security logs"
    technology: "Azure Diagnostics"