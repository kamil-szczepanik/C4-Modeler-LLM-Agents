level: container
scope: "Container diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
elements:
  - type: "person"
    name: "End Customers"
    description: "Insured individuals submitting and tracking claims."
  - type: "person"
    name: "Brokers"
    description: "Intermediaries assisting customers with claims processing."
  - type: "person"
    name: "Claims Adjusters"
    description: "Professionals reviewing, investigating, and settling claims."
  - type: "person"
    name: "Business Operations Managers"
    description: "Managers overseeing claims operations, dashboards, and workflows."
  - type: "person"
    name: "Migration Admins"
    description: "Administrators managing the hybrid migration process."
  - type: "externalSystem"
    name: "Azure Entra ID"
    description: "Identity provider handling Single Sign-On and Role-Based Access Control."
  - type: "externalSystem"
    name: "On-Premises COBOL/DB2 Mainframe"
    description: "Legacy System of Record acting as the backend during the 3-year migration phase."
  - type: "container"
    name: "Azure Static Web Apps"
    technology: "Angular/React Single Page Application"
    description: "Hosts the SPA frontend for fast global delivery and user interactions."
  - type: "container"
    name: "Azure API Management"
    technology: "Azure API Management (APIM)"
    description: "Enforces OIDC/OAuth2 authentication and dynamic routing for claim-type migration."
  - type: "container"
    name: "Azure Kubernetes Service"
    technology: "Node.js/Java microservices"
    description: "Runs containerized microservices and backend-for-frontend (BFF) components."
  - type: "container"
    name: "Azure Service Bus"
    technology: "Azure Service Bus"
    description: "Provides reliable asynchronous messaging for the Anti-Corruption Layer (ACL)."
  - type: "container"
    name: "Azure SQL Database"
    technology: "Azure SQL Database"
    description: "Stores modern claim types with encryption at rest."
  - type: "container"
    name: "Analytics Platform"
    technology: "Azure Event Hubs, Stream Analytics, Synapse Analytics, Power BI Embedded"
    description: "Ingests CDC streams and operational metrics for auditing and reporting."
relationships:
  - source: "End Customers"
    destination: "Azure Static Web Apps"
    description: "Accesses UI and interacts with the platform"
    technology: "HTTPS"
  - source: "Brokers"
    destination: "Azure Static Web Apps"
    description: "Accesses UI and manages client claims"
    technology: "HTTPS"
  - source: "Claims Adjusters"
    destination: "Azure Static Web Apps"
    description: "Accesses UI to review and process claims"
    technology: "HTTPS"
  - source: "Business Operations Managers"
    destination: "Azure Static Web Apps"
    description: "Accesses Dashboard Container and operational metrics"
    technology: "HTTPS"
  - source: "Migration Admins"
    destination: "Azure Static Web Apps"
    description: "Manages migration administration"
    technology: "HTTPS"
  - type: "container"
    source: "Azure Static Web Apps"
    destination: "Azure API Management"
    description: "Routes API requests"
    technology: "HTTPS / REST APIs"
  - type: "container"
    source: "Azure API Management"
    destination: "Azure Kubernetes Service"
    description: "Forwards requests to backend microservices"
    technology: "HTTPS / REST APIs"
  - type: "container"
    source: "Azure Kubernetes Service"
    destination: "Azure SQL Database"
    description: "Reads and writes modern claim data"
    technology: "TDS / SQL"
  - type: "container"
    source: "Azure Kubernetes Service"
    destination: "Azure Service Bus"
    description: "Publishes and consumes asynchronous messages via ACL"
    technology: "AMQP"
  - type: "container"
    source: "Azure API Management"
    destination: "Azure Service Bus"
    description: "Sends asynchronous integration messages"
    technology: "AMQP"
  - type: "container"
    source: "Azure Service Bus"
    destination: "On-Premises COBOL/DB2 Mainframe"
    description: "Communicates with legacy system securely"
    technology: "mTLS over IPsec VPN / ExpressRoute"
  - type: "container"
    source: "Azure API Management"
    destination: "On-Premises COBOL/DB2 Mainframe"
    description: "Integrates with legacy backend"
    technology: "mTLS over IPsec VPN / ExpressRoute"
  - type: "container"
    source: "Azure Kubernetes Service"
    destination: "Analytics Platform"
    description: "Streams operational events and CDC data"
    technology: "Internal event streaming"
  - type: "container"
    source: "Azure SQL Database"
    destination: "Analytics Platform"
    description: "Feeds data for auditing and reporting"
    technology: "Internal data streams"