level: component
scope: "Component diagram for the Azure SQL Database container"
parentContainer:
  name: "Azure SQL Database"
elements:
  - type: "component"
    name: "Claim Transactional Store"
    technology: "Azure SQL Database"
    description: "Stores active claims and transactions, executing parameterized SQL queries via TDS / SQL over TLS 1.3."
  - type: "component"
    name: "Integration Staging Store"
    technology: "Azure SQL Database"
    description: "Staging area that syncs delta changes asynchronously with the legacy mainframe via Change Data Capture (CDC)."
  - type: "component"
    name: "Row-Level Security & Access Management"
    technology: "Azure SQL Database Security"
    description: "Manages fine-grained data access and integrates with Microsoft Entra ID."
  - type: "component"
    name: "Temporal Tables (System-Versioned)"
    technology: "Azure SQL Database Feature"
    description: "Tracks historical changes automatically to satisfy strict auditability requirements."
  - type: "component"
    name: "Azure SQL Database-Level Auditing"
    technology: "Azure Storage / Log Analytics"
    description: "Writes security and operational logs for auditing purposes."
relationships:
  - source: "Claim Transactional Store"
    destination: "Row-Level Security & Access Management"
    description: "Enforces access control and authentication via Microsoft Entra ID managed identities"
  - source: "Claim Transactional Store"
    destination: "Temporal Tables (System-Versioned)"
    description: "Automatically records historical versioning of claim data"
  - source: "Claim Transactional Store"
    destination: "Azure SQL Database-Level Auditing"
    description: "Writes security logs"
  - source: "Integration Staging Store"
    destination: "Claim Transactional Store"
    description: "Provides delta changes via Change Data Capture (CDC) for synchronization"