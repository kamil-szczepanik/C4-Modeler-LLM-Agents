    destination: "Azure Entra ID"
    description: "Validates OIDC/OAuth2 tokens [HTTPS / REST]"
  - source: "Policy Engine Component"
    destination: "Azure Application Insights"
    description: "Streams sanitized telemetry and metrics [HTTPS]"