level: component
scope: "Component diagram for the Azure Kubernetes Service container"
parentContainer:
  name: "Azure Kubernetes Service"
elements:
  - type: "component"
    name: "API Gateway / BFF"
    technology: "Node.js"
    description: "Handles UI composition and forwards requests from Azure API Management."
  - type: "component"
    name: "Claim Processing Domain Services"
    technology: "Java / Spring Boot"
    description: "Implements CQRS domain services for claim processing and interacts with data stores."
  - type: "component"
    name: "Mainframe Anti-Corruption Layer (ACL) Adapter"
    technology: "Microservices / Custom Adapter"
    description: "Decouples legacy mainframe latency and handles asynchronous messaging."
relationships:
  - source: "API Gateway / BFF"
    destination: "Claim Processing Domain Services"
    description: "Internal communication [gRPC / HTTP/2]"
  - source: "Claim Processing Domain Services"
    destination: "Mainframe Anti-Corruption Layer (ACL) Adapter"
    description: "Asynchronous messaging [AMQP / AMQPS]"