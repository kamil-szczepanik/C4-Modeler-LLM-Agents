level: component
scope: "Component diagram for the Analytics Platform container"
parentContainer:
  name: "Analytics Platform"
elements:
  - type: "component"
    name: "Azure Event Hubs"
    technology: "Azure Event Hubs"
    description: "Ingests real-time CDC streams using AMQP for high throughput."
  - type: "component"
    name: "Azure Stream Analytics"
    technology: "Azure Stream Analytics"
    description: "Processes in-transit validation checks to satisfy R-04."
  - type: "component"
    name: "Azure Synapse Analytics"
    technology: "Azure Synapse Analytics (Dedicated SQL Pool)"
    description: "Stores historical claim metrics with Row-Level Security and dynamic data masking."
  - type: "component"
    name: "Power BI Embedded"
    technology: "Power BI Embedded"
    description: "Renders the Migration Executive Dashboard with Azure Entra ID SSO."
  - type: "component"
    name: "Azure Functions"
    technology: "Azure Functions"
    description: "Executes serverless reconciliation logic without custom ETL infrastructure."
  - type: "component"
    name: "Azure Key Vault"
    technology: "Azure Key Vault and Log Analytics"
    description: "Secures secrets and provides logging capabilities."
relationships:
  - source: "Azure Kubernetes Service / Azure SQL Database"
    destination: "Azure Event Hubs"
    description: "AMQP over TLS 1.3"
  - source: "Azure Functions"
    destination: "Azure Synapse Analytics"
    description: "T-SQL via TDS/TLS 1.3"
  - source: "Azure Synapse Analytics"
    destination: "Power BI Embedded"
    description: "Direct Query / HTTPS via TLS 1.3"
  - source: "Analytics Platform"
    destination: "Azure Key Vault"
    description: "Managed Identity / HTTPS"