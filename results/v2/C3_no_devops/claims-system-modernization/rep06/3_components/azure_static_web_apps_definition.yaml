level: component
scope: "Component diagram for the Azure Static Web Apps container"
parentContainer:
  name: "Azure Static Web Apps"
elements:
  - type: "component"
    name: "SPA Router & View Modules"
    technology: "Angular/React"
    description: "Powers dynamic single-page application interfaces and role-based routing."
  - type: "component"
    name: "Auth & Session Manager"
    technology: "Azure Entra ID / SWA Authentication"
    description: "Provides single sign-on (SSO) integration and manages user sessions."
  - type: "component"
    name: "API Proxy / Fallback"
    technology: "HTTPS / REST"
    description: "Proxies requests from the frontend to backend APIs and fallback mechanisms."
  - type: "component"
    name: "Configuration & Feature Flag Service"
    technology: "Client-side configuration"
    description: "Manages application configuration and feature flags for gradual migration."
  - type: "component"
    name: "Telemetry Client"
    technology: "Azure Application Insights"
    description: "Tracks real-user metrics (RUM) and performance for adjuster screens."
relationships:
  - source: "SPA Router & View Modules"
    destination: "Auth & Session Manager"
    description: "Validates sessions and tokens"
  - source: "SPA Router & View Modules"
    destination: "API Proxy / Fallback"
    description: "Sends API requests"
  - source: "Auth & Session Manager"
    destination: "Azure Entra ID"
    description: "Authenticates users via OAuth / OIDC"
  - source: "API Proxy / Fallback"
    destination: "Azure API Management"
    description: "Forwards requests to REST APIs via HTTPS"
  - source: "Telemetry Client"
    destination: "Azure Application Insights"
    description: "Sends telemetry data via HTTPS"