level: context
scope: "System Context diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
  description: "A hybrid system modernizing a regional insurer's claims platform by gradually migrating claim types from a legacy mainframe to Azure while maintaining seamless coexistence."
elements:
  - type: "person"
    name: "End Customers"
    description: "Insured individuals submitting and tracking claims."
  - type: "person"
    name: "Brokers"
    description: "Intermediaries assisting customers with claims processing."
  - type: "person"
    name: "Claims Adjusters"
    description: "Professionals reviewing, investigating, and settling claims."
  - type: "person"
    name: "Business Operations Managers"
    description: "Managers overseeing claims operations and workflows."
  - type: "person"
    name: "Migration Admins"
    description: "Administrators managing the hybrid migration process."
  - type: "externalSystem"
    name: "Insurer Active Directory / Azure Entra ID"
    description: "Identity provider handling user authentication and single sign-on."
  - type: "externalSystem"
    name: "Legacy Payment Gateway"
    description: "External system responsible for executing claim payouts."
  - type: "externalSystem"
    name: "Legacy Mainframe (On-Premises)"
    description: "COBOL/DB2 System of Record acting as the backend system during the 3-year migration phase."
relationships:
  - source: "End Customers"
    destination: "Modern Claims Platform"
    description: "Accesses and interacts with the claims platform"
    technology: "HTTPS/TLS 1.3 with OAuth 2.0 / OIDC"
  - source: "Brokers"
    destination: "Modern Claims Platform"
    description: "Manages and tracks client claims"
    technology: "HTTPS/TLS 1.3 with OAuth 2.0 / OIDC"
  - source: "Claims Adjusters"
    destination: "Modern Claims Platform"
    description: "Reviews and processes claims"
    technology: "HTTPS/TLS 1.3 with OAuth 2.0 / OIDC"
  - source: "Business Operations Managers"
    destination: "Modern Claims Platform"
    description: "Monitors operations and reports"
    technology: "HTTPS/TLS 1.3 with OAuth 2.0 / OIDC"
  - source: "Migration Admins"
    destination: "Modern Claims Platform"
    description: "Configures and manages the migration"
    technology: "HTTPS/TLS 1.3 with OAuth 2.0 / OIDC"
  - source: "Modern Claims Platform"
    destination: "Insurer Active Directory / Azure Entra ID"
    description: "Authenticates users via SSO"
    technology: "OIDC"
  - source: "Modern Claims Platform"
    destination: "Legacy Mainframe (On-Premises)"
    description: "Communicates asynchronously and securely for data synchronization"
    technology: "Azure Service Bus with encrypted payloads and mTLS"