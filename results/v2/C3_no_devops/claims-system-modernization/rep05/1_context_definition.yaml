level: context
scope: "System Context diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
  description: "A hybrid system gradually replacing a 30-year-old COBOL/DB2 mainframe claims system with a modern Azure-hosted platform while maintaining uninterrupted legacy operations."
elements:
  - type: "person"
    name: "Customers"
    description: "End users submitting claims online."
  - type: "person"
    name: "Brokers"
    description: "Intermediaries submitting and managing claims on behalf of customers."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff responsible for claim management."
  - type: "person"
    name: "Migration Operations Managers"
    description: "Personnel overseeing the hybrid migration process."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premises 30-year-old COBOL/DB2 mainframe claims system."
  - type: "externalSystem"
    name: "Anti-Corruption Layer (ACL)"
    description: "Integration layer isolating mainframe dependencies and decoupling the legacy system."
  - type: "externalSystem"
    name: "Active Directory"
    description: "Identity provider for single sign-on."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Service handling asynchronous notifications."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service handling secure payment transactions."
  - type: "container"
    name: "Web Application"
    description: "Frontend interface hosted in Azure West Europe."
    technology: "Azure PaaS"
  - type: "container"
    name: "API Gateway"
    description: "Azure API Management gateway for routing and security."
    technology: "Azure API Management"
  - type: "container"
    name: "Microservices"
    description: "Azure managed PaaS microservices handling business logic."
    technology: "Azure Managed PaaS"
  - type: "container"
    name: "Azure Service Bus"
    description: "Asynchronous event-driven messaging backbone."
    technology: "Azure Service Bus"
  - type: "container"
    name: "Azure Key Vault"
    description: "Secret and credential management service."
    technology: "Azure Key Vault"
relationships:
  - source: "Customers"
    destination: "Modern Claims Platform"
    description: "Online claim submission"
    technology: "HTTPS/REST"
  - source: "Brokers"
    destination: "Modern Claims Platform"
    description: "Online claim submission and management"
    technology: "HTTPS/REST"
  - source: "Claims Adjusters"
    destination: "Modern Claims Platform"
    description: "Claim management and processing"
    technology: "HTTPS/REST"
  - source: "Modern Claims Platform"
    destination: "Active Directory"
    description: "Single sign-on authentication"
    technology: "OAuth2/OIDC via Azure API Management"
  - source: "Modern Claims Platform"
    destination: "Legacy Mainframe"
    description: "Secure data and operation calls through the integration layer"
    technology: "Secure API calls via ACL"
  - source: "Modern Claims Platform"
    destination: "Notification Service"
    description: "Trigger asynchronous event-driven messaging"
    technology: "Azure Service Bus"
  - source: "Modern Claims Platform"
    destination: "Payment Gateway"
    description: "Process financial transactions"
    technology: "Synchronous HTTPS/REST with idempotency keys"