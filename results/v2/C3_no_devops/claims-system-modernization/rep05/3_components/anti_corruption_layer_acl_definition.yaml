level: component
scope: "Component diagram for the Anti-Corruption Layer (ACL) container"
parentContainer:
  name: "Anti-Corruption Layer (ACL)"
elements:
  - type: "component"
    name: "Translation Engine"
    technology: "[e.g., .NET Core / Custom Mapper]"
    description: "Translates modern domain models to legacy mainframe data structures and vice versa."
  - type: "component"
    name: "Reconciliation Worker"
    technology: "[e.g., .NET Core Background Service]"
    description: "Ensures data consistency between the cloud database and the legacy mainframe, guaranteeing zero claim loss."
  - type: "component"
    name: "ACL Admin & Audit API"
    technology: "[e.g., .NET Core Web API]"
    description: "Provides endpoints for metrics and audit queries interacting with the ACL Data Store."
  - type: "component"
    name: "Metrics Aggregator"
    technology: "[e.g., .NET Core / Azure Service Bus Consumer]"
    description: "Aggregates metrics and streams events from the Claims Processing Service."
  - type: "component"
    name: "ACL Data Store"
    technology: "[e.g., Azure SQL / EF Core]"
    description: "Persistence store for metrics, audit logs, and reconciliation tracking."
relationships:
  - source: "Translation Engine"
    destination: "COBOL/DB2 Mainframe"
    description: "Legacy system integration [IBM MQ / TCP via ExpressRoute with mTLS]"
  - source: "ACL Admin & Audit API"
    destination: "ACL Data Store"
    description: "Metrics and audit queries [EF Core / SQL]"
  - source: "Claims Processing Service"
    destination: "Metrics Aggregator"
    description: "Event streaming [Azure Service Bus / Kafka Topic]"