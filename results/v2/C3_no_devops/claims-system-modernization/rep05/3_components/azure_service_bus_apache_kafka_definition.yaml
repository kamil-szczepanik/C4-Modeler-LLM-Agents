level: component
scope: "Component diagram for the Azure Service Bus / Apache Kafka container"
parentContainer:
  name: "Azure Service Bus / Apache Kafka"
elements:
  - type: "component"
    name: "Claim Events Topic"
    technology: "Azure Service Bus Topic (Premium Tier)"
    description: "Publishes and routes asynchronous claim events ('claim-events') across the hybrid platform."
  - type: "component"
    name: "Claims Processing Subscription"
    technology: "Azure Service Bus Subscription"
    description: "Subscribes ('claims-processing-sub') to claim-events for processing by the Claims Processing Service."
  - type: "component"
    name: "ACL Sync Subscription"
    technology: "Azure Service Bus Subscription"
    description: "Subscribes ('acl-sync-sub') to claim-events for synchronization with the Anti-Corruption Layer."
  - type: "component"
    name: "Dead-Letter Queues (DLQ)"
    technology: "Azure Service Bus DLQ"
    description: "Captures and stores failed or unprocessable messages for operational review and compliance."
relationships:
  - source: "Claim Events Topic"
    destination: "Claims Processing Subscription"
    description: "Routes asynchronous messages to"
  - source: "Claim Events Topic"
    destination: "ACL Sync Subscription"
    description: "Routes asynchronous messages to"
  - source: "Claims Processing Subscription"
    destination: "Dead-Letter Queues (DLQ)"
    description: "Forwards failed messages to"
  - source: "ACL Sync Subscription"
    destination: "Dead-Letter Queues (DLQ)"
    description: "Forwards failed messages to"