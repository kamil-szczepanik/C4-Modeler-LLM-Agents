level: component
scope: "Component diagram for the Azure Key Vault & Managed Identities container"
parentContainer:
  name: "Azure Key Vault & Managed Identities"
elements:
  - type: "component"
    name: "Azure Key Vault"
    technology: "Azure Key Vault"
    description: "Secures cryptographic keys, database connection strings, and certificates without hardcoding."
  - type: "component"
    name: "User-Assigned Managed Identities"
    technology: "Azure IAM / Managed Identities"
    description: "Decouples service identity lifecycles from container lifecycles for secure, passwordless authentication."
  - type: "component"
    name: "Azure Private Endpoints"
    technology: "Azure Private Link"
    description: "Eliminates public internet exposure by routing secure traffic entirely within the Azure Virtual Network."
  - type: "component"
    name: "Azure RBAC Engine"
    technology: "Azure RBAC"
    description: "Enforces least-privilege access permissions specifically tailored per container microservice."
  - type: "component"
    name: "Key Rotation & Automated Alerting Engine"
    technology: "Azure Event Grid & Azure Functions"
    description: "Automates zero-touch key rotation and expiration alerting."
relationships:
  - source: "Claims API Gateway & Claims Processing Service"
    destination: "Azure Key Vault"
    description: "Connects via HTTPS (TLS 1.3 via Azure SDK) over Azure Private Endpoints"
  - source: "Claims API Gateway & Claims Processing Service"
    destination: "User-Assigned Managed Identities"
    description: "Authenticates against Azure Key Vault via token exchange"
  - source: "Azure Key Vault"
    destination: "Log Analytics Workspace"
    description: "Streams audit logs and metrics via Azure Monitor Diagnostic Settings"
  - source: "Key Rotation & Automated Alerting Engine"
    destination: "Azure Key Vault"
    description: "Automates zero-touch key rotation and expiration alerting"