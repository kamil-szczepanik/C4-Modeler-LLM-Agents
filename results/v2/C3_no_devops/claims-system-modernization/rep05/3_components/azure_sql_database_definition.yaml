level: component
scope: "Component diagram for the Azure SQL Database container"
parentContainer:
  name: "Azure SQL Database"
elements:
  - type: "component"
    name: "Claims Schema"
    technology: "SQL Server Engine"
    description: "Provides relational storage for migrated claim types ensuring rapid rollback capability."
  - type: "component"
    name: "Temporal Audit Tables"
    technology: "System-Versioned Temporal Tables"
    description: "Maintains historical audit data for claims."
  - type: "component"
    name: "Change Feed Engine"
    technology: "Change Data Capture"
    description: "Captures and streams entity deltas."
  - type: "component"
    name: "Maintenance & Index Manager"
    technology: "Azure SQL Elastic Jobs"
    description: "Manages database maintenance and indexes."
  - type: "component"
    name: "Geo-Replication Controller"
    technology: "Azure SQL Active Geo-Replication"
    description: "Replicates encrypted storage blocks to the secondary region via Azure Backbone Network."
relationships:
  - source: "Claims Processing Service"
    destination: "Claims Schema"
    description: "Reads/writes transactional claim data via TDS over TLS 1.3"
  - source: "Change Feed Engine"
    destination: "Azure Service Bus"
    description: "Streams entity deltas via AMQP"
  - source: "Geo-Replication Controller"
    destination: "Secondary Region Azure SQL"
    description: "Replicates encrypted storage blocks via Azure Backbone Network"