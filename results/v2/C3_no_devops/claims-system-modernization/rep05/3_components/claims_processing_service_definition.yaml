level: component
scope: "Component diagram for the Claims Processing Service container"
parentContainer:
  name: "Claims Processing Service"
elements:
  - type: "component"
    name: "Claim State Machine & Orchestrator"
    technology: ".NET Core (C#), MassTransit"
    description: "Orchestrates claim lifecycles and manages distributed process workflows."
  - type: "component"
    name: "Idempotency & Deduplication Filter"
    technology: ".NET Core (C#)"
    description: "Filters duplicate requests and ensures transactional consistency using deduplication hashes."
  - type: "component"
    name: "Payment & Notification Integrator"
    technology: ".NET Core (C#)"
    description: "Integrates with external payment gateways and notification services."
  - type: "component"
    name: "Mainframe Sync Adapter"
    technology: ".NET Core (C#), AMQP"
    description: "Synchronizes hybrid state with the legacy mainframe via the Anti-Corruption Layer."
  - type: "component"
    name: "Claim Type Policy Engine"
    technology: ".NET Core (C#)"
    description: "Applies business rules and policies tailored to different claim types."
relationships:
  - source: "Claim State Machine & Orchestrator"
    destination: "Claim Type Policy Engine"
    description: "Evaluates policies for processing claims."
  - source: "Claim State Machine & Orchestrator"
    destination: "Idempotency & Deduplication Filter"
    description: "Checks incoming requests for deduplication."
  - source: "Claim State Machine & Orchestrator"
    destination: "Payment & Notification Integrator"
    description: "Triggers payments and alerts."
  - source: "Claim State Machine & Orchestrator"
    destination: "Mainframe Sync Adapter"
    description: "Synchronizes unmigrated claim states."