level: component
scope: "Component diagram for the Claims API Gateway / Backend-for-Frontend container"
parentContainer:
  name: "Claims API Gateway / Backend-for-Frontend"
elements:
  - type: "component"
    name: "API Router & Orchestrator"
    technology: "Yarp"
    description: "Reverse proxy for API routing and SSL termination."
  - type: "component"
    name: "Claim Type Routing Registry"
    technology: "Azure SQL Database"
    description: "Stores routing configuration for hybrid claim type migration."
  - type: "component"
    name: "BFF Aggregator Service"
    technology: "HotChocolate GraphQL"
    description: "GraphQL implementation for optimized UI payloads and sub-2s UI performance."
  - type: "component"
    name: "Circuit Breaker & Fallback Manager"
    technology: "Polly"
    description: "Circuit breaker and fault tolerance framework for managing downstream failures."
  - type: "component"
    name: "Telemetry Interceptor"
    technology: ".NET Core"
    description: "Captures telemetry and monitors request flow across services."
relationships:
  - source: "API Router & Orchestrator"
    destination: "Claim Type Routing Registry"
    description: "Queries routing configuration [SQL]"
  - source: "BFF Aggregator Service"
    destination: "API Router & Orchestrator"
    description: "Orchestrates API requests [Internal]"
  - source: "Circuit Breaker & Fallback Manager"
    destination: "API Router & Orchestrator"
    description: "Protects routing endpoints against failures [Polly]"