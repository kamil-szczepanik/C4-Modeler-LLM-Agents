# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
elements:
  - type: "person"
    name: "Customers"
    description: "End users submitting claims online."
  - type: "person"
    name: "Brokers"
    description: "Intermediaries submitting and managing claims on behalf of customers."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff responsible for claim management."
  - type: "person"
    name: "Migration Operations Managers"
    description: "Personnel overseeing the hybrid migration process."
  - type: "externalSystem"
    name: "COBOL/DB2 Legacy Mainframe"
    description: "On-premises 30-year-old COBOL/DB2 mainframe claims system."
  - type: "externalSystem"
    name: "Azure Active Directory"
    description: "Identity provider enforcing SSO, RBAC, and JIT privileged access."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service handling secure payment transactions."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Service handling asynchronous notifications."
  - type: "container"
    name: "Web Application"
    technology: "React/Next.js on Azure App Service"
    description: "Frontend interface for customers, brokers, and adjusters ensuring sub-2-second user load times."
  - type: "container"
    name: "Operations BFF & Admin Portal"
    technology: ".NET Core / React"
    description: "Operations and administration portal for managing the platform and migration."
  - type: "container"
    name: "Claims API Gateway / Backend-for-Frontend"
    technology: ".NET Core on Azure Container Apps"
    description: "API Gateway and Backend-for-Frontend routing and isolating requests."
  - type: "container"
    name: "Claims Processing Service"
    technology: ".NET Core Web API on Azure Container Apps"
    description: "Core service handling business logic for claims processing."
  - type: "container"
    name: "Anti-Corruption Layer (ACL)"
    technology: "Azure Container Apps / On-Prem VM"
    description: "Integration layer isolating mainframe dependencies and decoupling the legacy system."
  - type: "container"
    name: "Azure Service Bus / Apache Kafka"
    technology: "Azure Service Bus / Apache Kafka"
    description: "Asynchronous event-driven messaging backbone ensuring zero data loss across hybrid boundaries."
  - type: "container"
    name: "Azure SQL Database"
    technology: "Azure SQL Database"
    description: "Relational storage for migrated claim types ensuring rapid rollback capability."
  - type: "container"
    name: "Azure Key Vault & Managed Identities"
    technology: "Azure Key Vault"
    description: "Secures credentials and secrets without hardcoding."
relationships:
  - source: "Customers"
    destination: "Web Application"
    description: "Submits and manages claims online"
    technology: "HTTPS/TLS 1.3 (OIDC/OAuth2 SSO via Azure AD)"
  - source: "Brokers"
    destination: "Web Application"
    description: "Submits and manages claims on behalf of customers"
    technology: "HTTPS/TLS 1.3 (OIDC/OAuth2 SSO via Azure AD)"
  - source: "Claims Adjusters"
    destination: "Web Application"
    description: "Performs claim management and processing"
    technology: "HTTPS/TLS 1.3 (OIDC/OAuth2 SSO via Azure AD)"
  - source: "Migration Operations Managers"
    destination: "Operations BFF & Admin Portal"
    description: "Oversees migration operations and administration"
    technology: "HTTPS/TLS 1.3 (OIDC/OAuth2 SSO via Azure AD)"
  - source: "Web Application"
    destination: "Claims API Gateway / Backend-for-Frontend"
    description: "Sends API and UI requests"
    technology: "HTTPS REST/GraphQL"
  - source: "Operations BFF & Admin Portal"
    destination: "Claims API Gateway / Backend-for-Frontend"
    description: "Sends operations and admin requests"
    technology: "HTTPS REST/GraphQL"
  - source: "Claims API Gateway / Backend-for-Frontend"
    destination: "Claims Processing Service"
    description: "Forwards business requests"
    technology: "gRPC with mTLS"
  - source: "Claims Processing Service"
    destination: "Azure SQL Database"
    description: "Reads and writes claim data"
    technology: "TDS/SQL over TLS 1.3"
  - source: "Claims Processing Service"
    destination: "Azure Service Bus / Apache Kafka"
    description: "Publishes and consumes asynchronous event streams"
    technology: "AMQP/Kafka Protocol"
  - source: "Claims Processing Service"
    destination: "Anti-Corruption Layer (ACL)"
    description: "Communicates with legacy systems"
    technology: "AMQP/Kafka Protocol"
  - source: "Anti-Corruption Layer (ACL)"
    destination: "COBOL/DB2 Legacy Mainframe"
    description: "Integrates with legacy mainframe operations"
    technology: "IBM MQ / TCP over ExpressRoute/VPN hybrid link with mTLS"
  - source: "Web Application"
    destination: "Azure Active Directory"
    description: "Authenticates users via SSO"
    technology: "OIDC/OAuth2"
  - source: "Claims Processing Service"
    destination: "Payment Gateway"
    description: "Processes financial claim transactions"
    technology: "HTTPS/REST"
  - source: "Claims Processing Service"
    destination: "Notification Service"
    description: "Triggers notifications"
    technology: "Azure Service Bus / HTTPS"