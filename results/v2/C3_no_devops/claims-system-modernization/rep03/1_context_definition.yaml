# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
  description: "A hybrid insurance claims modernization platform that gradually replaces a legacy COBOL/DB2 mainframe while maintaining data consistency, enabling online submissions, fast adjuster processing, and incremental claim type migration."
elements:
  - type: "person"
    name: "Customer"
    description: "Policyholders who submit online claims via the web portal."
  - type: "person"
    name: "Broker"
    description: "Insurance brokers who submit and assist with claims on behalf of customers."
  - type: "person"
    name: "Claims Adjuster"
    description: "Internal staff responsible for fast claim handling and processing."
  - type: "person"
    name: "Finance/Compliance Auditor"
    description: "Auditors who review audit logs and ensure compliance."
  - type: "externalSystem"
    name: "Legacy Mainframe Claims System"
    description: "On-premises COBOL/DB2 system acting as the enduring system of record."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Insurer's Active Directory / Azure AD providing Single Sign-On and MFA."
relationships:
  - source: "Customer"
    destination: "Modern Claims Platform"
    description: "Submits online claims"
    technology: "HTTPS (Web/UI)"
  - source: "Broker"
    destination: "Modern Claims Platform"
    description: "Submits and manages claims"
    technology: "HTTPS (Web/UI)"
  - source: "Claims Adjuster"
    destination: "Modern Claims Platform"
    description: "Handles claims with sub-2s response times"
    technology: "HTTPS"
  - source: "Finance/Compliance Auditor"
    destination: "Modern Claims Platform"
    description: "Reviews compliance and audit logs"
    technology: "HTTPS"
  - source: "Modern Claims Platform"
    destination: "Legacy Mainframe Claims System"
    description: "Synchronizes claims and data consistency asynchronously"
    technology: "MQ/Kafka via Site-to-Site VPN / Azure ExpressRoute (mTLS)"
  - source: "Modern Claims Platform"
    destination: "Identity Provider"
    description: "Authenticates users via SSO and MFA"
    technology: "OIDC/OAuth 2.0"