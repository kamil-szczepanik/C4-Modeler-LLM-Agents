level: component
scope: "Component diagram for the Claims Audit Store container"
parentContainer:
  name: "Claims Audit Store"
elements:
  - type: "component"
    name: "Audit Event Writer"
    technology: ".NET Core / Cosmos SDK"
    description: "Component handling PII tokenization and persistence into the immutable database container."
  - type: "component"
    name: "Compliance Query Service"
    technology: ".NET Core"
    description: "Component providing secure, role-based query endpoints for auditors."
  - type: "component"
    name: "Cosmos DB Change Feed Processor"
    technology: ".NET Core"
    description: "Component powering asynchronous projections and archival triggers."
  - type: "component"
    name: "Audit Archival Worker"
    technology: "Azure Function / .NET Core"
    description: "Component moving historical logs to cold storage."
  - type: "component"
    name: "Claims Audit Database"
    technology: "Azure Cosmos DB"
    description: "Append-only, immutable database container for audit events."
  - type: "component"
    name: "Azure Blob Storage"
    technology: "Azure Blob Storage (WORM)"
    description: "Long-term WORM-compliant storage tier for 7-year retention."
  - type: "component"
    name: "Azure Key Vault"
    technology: "Azure Key Vault"
    description: "Manages Customer-Managed Keys (CMK) and encryption keys."
  - type: "component"
    name: "Claims Domain Services"
    technology: "Microservice"
    description: "External system or container representing the domain services writing claims events."
  - type: "component"
    name: "Finance/Compliance Auditors"
    technology: "User / External Actor"
    description: "External users querying audit reports via HTTPS with Azure Active Directory SSO."
relationships:
  - source: "Claims Domain Services"
    destination: "Audit Event Writer"
    description: "Writes domain events via HTTPS (Document API)"
  - source: "Finance/Compliance Auditors"
    destination: "Compliance Query Service"
    description: "Queries audit reports via HTTPS with Azure Active Directory SSO (R-07)"
  - source: "Cosmos DB Change Feed Processor"
    destination: "Audit Archival Worker"
    description: "Triggers historical data offloading via internal Azure messaging"
  - source: "Audit Archival Worker"
    destination: "Azure Blob Storage"
    description: "Archives immutable logs via HTTPS (Blob REST API)"
  - source: "Audit Event Writer"
    destination: "Claims Audit Database"
    description: "Persists tokenized audit events"
  - source: "Compliance Query Service"
    destination: "Claims Audit Database"
    description: "Queries audit logs"
  - source: "Audit Event Writer"
    destination: "Azure Key Vault"
    description: "Retrieves encryption keys and CMK"