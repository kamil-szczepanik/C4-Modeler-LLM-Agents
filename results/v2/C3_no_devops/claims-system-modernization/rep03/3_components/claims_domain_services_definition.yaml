level: component
scope: "Component diagram for the Claims Domain Services container"
parentContainer:
  name: "Claims Domain Services"
elements:
  - type: "component"
    name: "Claim Orchestrator"
    technology: ".NET Core / Mediator pattern"
    description: "Orchestrates claim processing workflows and coordinates domain logic execution."
  - type: "component"
    name: "Claim Domain Model"
    technology: ".NET Core"
    description: "Encapsulates the core business logic and rules for claims handling."
  - type: "component"
    name: "Rollback Switch"
    technology: ".NET Core / Feature Flag pattern"
    description: "Controls the traffic routing and enables rapid one-day rollback capabilities to the mainframe."
  - type: "component"
    name: "Claim Audit & Event Publisher"
    technology: ".NET Core / Outbox Pattern"
    description: "Handles audit logging and dispatches domain and integration events reliably."
relationships:
  - source: "Claim Orchestrator"
    destination: "Claim Domain Model"
    description: "In-memory domain method calls"
  - source: "Claim Orchestrator"
    destination: "Integration & Anti-Corruption Layer"
    description: "Publishes domain events [AMQP (Azure Service Bus)]"
  - source: "Rollback Switch"
    destination: "Mainframe Adapter"
    description: "Forwards unmigrated claim traffic [gRPC with payload signing]"
  - source: "Claim Domain Model"
    destination: "Claim Audit & Event Publisher"
    description: "Raises domain events [In-memory / MediatR]"
  - source: "Claim Audit & Event Publisher"
    destination: "Claims Audit Store"
    description: "Persists audit records [HTTPS (Document API)]"
  - source: "Claim Audit & Event Publisher"
    destination: "Integration & Anti-Corruption Layer"
    description: "Dispatches integration events [AMQP]"