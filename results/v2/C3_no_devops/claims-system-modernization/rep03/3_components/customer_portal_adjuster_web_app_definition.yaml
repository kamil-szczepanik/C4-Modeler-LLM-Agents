level: component
scope: "Component diagram for the Customer Portal & Adjuster Web App container"
parentContainer:
  name: "Customer Portal & Adjuster Web App"
elements:
  - type: "component"
    name: "SPA Shell & Routing Engine"
    technology: "React / TypeScript"
    description: "Modernizes user interactions for customers, brokers, and claims adjusters while hiding legacy mainframe latencies, hosted in Azure Container Apps."
  - type: "component"
    name: "Dynamic Form Engine"
    technology: "React Hook Form / JSON Schema"
    description: "Enables dynamic, metadata-driven form rendering to support iterative claim type migration without frontend deployments."
  - type: "component"
    name: "Optimistic UI & Local State Cache"
    technology: "TanStack Query"
    description: "Manages local state and caching to meet sub-2-second performance requirements despite mainframe lag."
  - type: "component"
    name: "Telemetry & Error Boundary Handler"
    technology: "Azure Application Insights SDK"
    description: "Streams anonymized performance metrics and error logs via HTTPS."
relationships:
  - source: "SPA Shell & Routing Engine"
    destination: "Azure API Management Gateway"
    description: "Routes client traffic [HTTPS / TLS 1.3]"
  - source: "SPA Shell & Routing Engine"
    destination: "Azure Active Directory"
    description: "Authenticates users and manages sessions [OpenID Connect / OIDC]"
  - source: "Telemetry & Error Boundary Handler"
    destination: "Azure Application Insights"
    description: "Streams anonymized performance metrics and error logs [HTTPS]"