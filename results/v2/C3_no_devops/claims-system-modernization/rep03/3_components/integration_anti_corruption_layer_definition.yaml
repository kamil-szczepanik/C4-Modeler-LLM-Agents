level: component
scope: "Component diagram for the Integration & Anti-Corruption Layer container"
parentContainer:
  name: "Integration & Anti-Corruption Layer"
elements:
  - type: "component"
    name: "Message Router Component"
    technology: ".NET Core / Azure Service Bus Topics"
    description: "Publishes domain events and handles asynchronous messaging."
  - type: "component"
    name: "Translation & Mapping Component"
    technology: ".NET Core"
    description: "Transforms payloads between modern and legacy schemas."
  - type: "component"
    name: "Crypto-Proxy Middleware"
    technology: ".NET Core"
    description: "Encrypts and decrypts sensitive payloads."
  - type: "component"
    name: "Dead Letter & Audit Store Component"
    technology: "Azure Cosmos DB"
    description: "Provides immutable storage for auditability and dead-letter management."
  - type: "component"
    name: "Replay & Reconciliation Component"
    technology: ".NET Core / Azure Functions"
    description: "Re-queues corrected messages and handles reconciliation."
  - type: "component"
    name: "Mainframe Adapter"
    technology: "Azure Container Apps / .NET Core"
    description: "Dispatches legacy messages to the mainframe."
relationships:
  - source: "Message Router Component"
    destination: "Translation & Mapping Component"
    description: "Transforms payloads [In-memory / .NET]"
  - source: "Translation & Mapping Component"
    destination: "Crypto-Proxy Middleware"
    description: "Encrypts/decrypts sensitive payloads [In-memory / .NET]"
  - source: "Translation & Mapping Component"
    destination: "Mainframe Adapter"
    description: "Dispatches legacy messages [AMQP]"
  - source: "Replay & Reconciliation Component"
    destination: "Message Router Component"
    description: "Re-queues corrected messages [AMQP]"