level: container
scope: "Container diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
elements:
  - type: "person"
    name: "Customer"
    description: "Policyholders who submit online claims via the web portal."
  - type: "person"
    name: "Broker"
    description: "Insurance brokers who submit and assist with claims on behalf of customers."
  - type: "person"
    name: "Claims Adjuster"
    description: "Internal staff responsible for fast claim handling and processing."
  - type: "person"
    name: "Finance/Compliance Auditor"
    description: "Auditors who review audit logs and ensure compliance."
  - type: "externalSystem"
    name: "Legacy Mainframe Claims System"
    description: "On-premises COBOL/DB2 system acting as the enduring system of record."
  - type: "externalSystem"
    name: "Azure Active Directory"
    description: "Identity Provider providing Single Sign-On and RBAC enforcement."
  - type: "container"
    name: "API Gateway"
    technology: "Azure API Management"
    description: "Manages incoming requests and secures access with OIDC JWT tokens."
  - type: "container"
    name: "Customer Portal & Adjuster Web App"
    technology: "Azure Container Apps / React"
    description: "Responsive UI for customers, brokers, and adjusters meeting sub-2s performance constraint."
  - type: "container"
    name: "Claims Domain Services"
    technology: "Azure Container Apps / .NET Core"
    description: "Domain microservices for incremental claim type migration."
  - type: "container"
    name: "Integration & Anti-Corruption Layer"
    technology: "Azure Service Bus"
    description: "Handles asynchronous messaging with transactional outbox pattern to ensure zero data loss."
  - type: "container"
    name: "Claims Audit Store"
    technology: "Azure Cosmos DB"
    description: "Append-only, immutable business event auditing and PII encryption."
  - type: "container"
    name: "Mainframe Adapter"
    technology: "Azure Container Apps / .NET Core"
    description: "Bridges integration layer messages to the legacy mainframe via custom TCP/LU6.2."
relationships:
  - source: "Customer"
    destination: "API Gateway"
    description: "Sends API requests and accesses portals"
    technology: "HTTPS (TLS 1.3) with OIDC JWT tokens"
  - source: "Broker"
    destination: "API Gateway"
    description: "Sends API requests and accesses portals"
    technology: "HTTPS (TLS 1.3) with OIDC JWT tokens"
  - source: "Claims Adjuster"
    destination: "API Gateway"
    description: "Sends API requests and accesses web app"
    technology: "HTTPS (TLS 1.3) with OIDC JWT tokens"
  - source: "Finance/Compliance Auditor"
    destination: "API Gateway"
    description: "Accesses audit logs and compliance views"
    technology: "HTTPS (TLS 1.3) with OIDC JWT tokens"
  - source: "API Gateway"
    destination: "Customer Portal & Adjuster Web App"
    description: "Routes traffic to frontend applications"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Claims Domain Services"
    description: "Routes traffic to backend domain services"
    technology: "HTTPS"
  - source: "Claims Domain Services"
    destination: "Claims Audit Store"
    description: "Writes audit events and business data"
    technology: "HTTPS (Document API)"
  - source: "Claims Domain Services"
    destination: "Integration & Anti-Corruption Layer"
    description: "Publishes domain events"
    technology: "AMQP (Azure Service Bus)"
  - source: "Integration & Anti-Corruption Layer"
    destination: "Mainframe Adapter"
    description: "Transfers integration messages"
    technology: "AMQP"
  - source: "Mainframe Adapter"
    destination: "Legacy Mainframe Claims System"
    description: "Bridges traffic over Azure ExpressRoute/IPsec VPN with mTLS"
    technology: "Custom TCP/LU6.2 bridging"