level: container
scope: "Container diagram for Hybrid Insurance Claims Modernization Platform"
system:
  name: "Hybrid Insurance Claims Modernization Platform"
elements:
  - type: "person"
    name: "End Customers"
    description: "External end users submitting claims."
  - type: "person"
    name: "Brokers"
    description: "External partners interacting with the platform."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users reviewing and managing claims."
  - type: "person"
    name: "Compliance/Audit Officers"
    description: "Internal users monitoring compliance and audit trails."
  - type: "person"
    name: "Migration Support/Operations Team"
    description: "Internal team managing system operations and migration support."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "Corporate Active Directory"
    description: "Entra ID used for authentication and authorization."
  - type: "externalSystem"
    name: "Enterprise Service Bus"
    description: "ESB facilitating integration across networks."
  - type: "externalSystem"
    name: "Audit & Compliance System"
    description: "External system for audit logs and compliance verification."
  - type: "container"
    name: "Web Application"
    technology: "React / Node.js on Azure App Service"
    description: "Provides the user interface for customers, brokers, and adjusters."
  - type: "container"
    name: "API Gateway"
    technology: ".NET / YARP on Azure Container Apps"
    description: "Handles dynamic routing, feature flagging, and edge security."
  - type: "container"
    name: "Claims Core Domain Service"
    technology: ".NET Core"
    description: "Implements business logic for claims processing."
  - type: "container"
    name: "Read-Model & Caching Store"
    technology: "Azure Cosmos DB / Redis"
    description: "Provides asynchronous read-models and caching for fast screen loads."
  - type: "container"
    name: "Integration & Sync Worker"
    technology: "Azure Functions"
    description: "Delivers reliable asynchronous eventing and mainframe synchronization."
  - type: "container"
    name: "Azure SQL Database"
    technology: "Azure SQL"
    description: "Modern transactional data store for migrated claims."
  - type: "container"
    name: "Azure Key Vault"
    technology: "Azure Key Vault"
    description: "Manages secrets dynamically via managed identities."
relationships:
  - source: "End Customers"
    destination: "Web Application"
    description: "Accesses via public internet"
    technology: "HTTPS/JSON"
  - source: "Brokers"
    destination: "Web Application"
    description: "Accesses via public internet"
    technology: "HTTPS/JSON"
  - source: "Claims Adjusters"
    destination: "Web Application"
    description: "Accesses claims screens"
    technology: "HTTPS/JSON"
  - source: "Compliance/Audit Officers"
    destination: "Web Application"
    description: "Reviews audit data"
    technology: "HTTPS/JSON"
  - source: "Migration Support/Operations Team"
    destination: "Web Application"
    description: "Monitors operations"
    technology: "HTTPS/JSON"
  - source: "Web Application"
    destination: "Corporate Active Directory"
    description: "Authenticates users"
    technology: "OpenID Connect / OAuth 2.0"
  - source: "Web Application"
    destination: "API Gateway"
    description: "Forwards requests with token propagation"
    technology: "HTTPS/JSON"
  - source: "API Gateway"
    destination: "Claims Core Domain Service"
    description: "Routes requests to core services"
    technology: "gRPC/REST with mTLS"
  - source: "Claims Core Domain Service"
    destination: "Azure SQL Database"
    description: "Reads and writes transactional data"
    technology: "TCP/TLS"
  - source: "Claims Core Domain Service"
    destination: "Read-Model & Caching Store"
    description: "Queries read-models and cache"
    technology: "TCP/TLS"
  - source: "Integration & Sync Worker"
    destination: "Enterprise Service Bus"
    description: "Sends and receives asynchronous messages"
    technology: "Azure Service Bus via IPsec VPN/ExpressRoute"
  - source: "Enterprise Service Bus"
    destination: "Legacy Mainframe"
    description: "Synchronizes legacy data"
    technology: "COBOL/DB2 Messaging"
  - source: "Claims Core Domain Service"
    destination: "Azure Key Vault"
    description: "Retrieves secrets and keys"
    technology: "Managed Identity / HTTPS"