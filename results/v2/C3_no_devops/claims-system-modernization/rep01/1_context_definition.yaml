level: context
scope: "System Context diagram for Hybrid Insurance Claims Modernization Platform"
system:
  name: "Hybrid Insurance Claims Modernization Platform"
  description: "A hybrid insurance claims modernization platform that gradually migrates functionality from a legacy mainframe to Azure cloud services to maintain business continuity."
elements:
  - type: "person"
    name: "End Customers & Brokers"
    description: "External users submitting online claims."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users utilizing the web application for claims processing."
  - type: "person"
    name: "Compliance/Audit Officers"
    description: "Internal users reviewing audit and compliance logs."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "Corporate Active Directory"
    description: "Identity Provider for Single Sign-On."
  - type: "externalSystem"
    name: "Integration / ESB Layer"
    description: "On-premise secure gateway for hybrid communication."
  - type: "externalSystem"
    name: "Audit & Compliance System"
    description: "Hybrid log aggregator with WORM storage for immutable compliance logs."
relationships:
  - source: "End Customers & Brokers"
    destination: "Hybrid Insurance Claims Modernization Platform"
    description: "Submit online claims"
    technology: "HTTPS (REST/GraphQL)"
  - source: "Claims Adjusters"
    destination: "Hybrid Insurance Claims Modernization Platform"
    description: "Access the claims web application"
    technology: "HTTPS"
  - source: "Hybrid Insurance Claims Modernization Platform"
    destination: "Corporate Active Directory"
    description: "Authenticate users via Single Sign-On"
    technology: "OIDC/OAuth2"
  - source: "Hybrid Insurance Claims Modernization Platform"
    destination: "Integration / ESB Layer"
    description: "Send and receive asynchronous messages securely"
    technology: "AMQP/HTTPS over mTLS"
  - source: "Integration / ESB Layer"
    destination: "Legacy Mainframe"
    description: "Process data via optimized batch/MQ protocols"
    technology: "Batch/MQ protocols"
  - source: "Hybrid Insurance Claims Modernization Platform"
    destination: "Audit & Compliance System"
    description: "Stream audit events"
    technology: "Syslog/Audit event streams"
  - source: "Legacy Mainframe"
    destination: "Audit & Compliance System"
    description: "Stream audit events"
    technology: "Syslog/Audit event streams"