level: component
scope: "Component diagram for the Azure SQL Database container"
parentContainer:
  name: "Azure SQL Database"
elements:
  - type: "component"
    name: "Schema Domain Partitioning Engine"
    technology: "Azure SQL Database Schemas"
    description: "Partitions the domain data to isolate legacy and modern claims structures."
  - type: "component"
    name: "Temporal Data Tables"
    technology: "System-Versioned Temporal Tables"
    description: "Automates audit tracking natively without application-level overhead."
  - type: "component"
    name: "Change Data Capture (CDC) Component"
    technology: "Azure SQL CDC"
    description: "Exposes low-latency transaction logs for reliable data synchronization."
  - type: "component"
    name: "Row-Level Security (RLS) Policy Engine"
    technology: "Azure SQL RLS"
    description: "Enforces data jurisdiction boundaries directly at the database layer."
  - type: "component"
    name: "Elastic Pool Management Component"
    technology: "Azure SQL Elastic Pools"
    description: "Manages database resources dynamically across multi-tenant workloads."
relationships:
  - source: "Claims Core Domain Service"
    destination: "Row-Level Security (RLS) Policy Engine"
    description: "Queries transactional data [Tabular Data Stream (TDS) over TLS 1.3 via Managed Identity]"
  - source: "Integration & Sync Worker"
    destination: "Change Data Capture (CDC) Component"
    description: "Streams delta changes [TDS over TLS 1.3 via Managed Identity]"
  - source: "Azure SQL Database"
    destination: "Azure Key Vault"
    description: "Retrieves customer-managed encryption keys [HTTPS / REST]"