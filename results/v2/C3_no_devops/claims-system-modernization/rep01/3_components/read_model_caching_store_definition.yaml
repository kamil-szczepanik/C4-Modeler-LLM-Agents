level: component
scope: "Component diagram for the Read-Model & Caching Store container"
parentContainer:
  name: "Read-Model & Caching Store"
elements:
  - type: "component"
    name: "Projection Consumer Component"
    technology: ".NET Background Service"
    description: "Consumes domain events from the integration worker for event processing."
  - type: "component"
    name: "Query API Component"
    technology: ".NET Minimal API"
    description: "Exposes optimized query endpoints for the claims core domain service."
  - type: "component"
    name: "Distributed Cache Component"
    technology: "Azure Redis Cache"
    description: "Handles ephemeral sessions and hot read-models with strict TTLs."
  - type: "component"
    name: "Document Store Component"
    technology: "Azure Cosmos DB - SQL API"
    description: "Persists schema-less JSON read models to handle mixed data structures."
relationships:
  - source: "Projection Consumer Component"
    destination: "Document Store Component"
    description: "Persists projected events into the document store"
  - source: "Query API Component"
    destination: "Distributed Cache Component"
    description: "Retrieves cached hot read-models"
  - source: "Query API Component"
    destination: "Document Store Component"
    description: "Queries persistent read-models"