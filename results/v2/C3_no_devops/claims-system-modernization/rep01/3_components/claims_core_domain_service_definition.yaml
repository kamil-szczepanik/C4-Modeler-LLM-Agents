level: component
scope: "Component diagram for the Claims Core Domain Service container"
parentContainer:
  name: "Claims Core Domain Service"
elements:
  - type: "component"
    name: "Claim Management Controller"
    technology: "REST / gRPC (.NET 8)"
    description: "Exposes REST/gRPC endpoints secured via mTLS for handling write and read operations."
  - type: "component"
    name: "Claim Domain Model & Engine"
    technology: "C# / .NET 8 (Domain-Driven Design)"
    description: "Implements tactical Domain-Driven Design aggregates and value objects for insurance logic."
  - type: "component"
    name: "Claim Routing & Policy Engine"
    technology: "C# / .NET 8"
    description: "Evaluates feature flags and rules per claim type to dynamically route execution paths."
  - type: "component"
    name: "Data Access Repository"
    technology: "Entity Framework Core (.NET 8)"
    description: "Abstracts persistence over Azure SQL Database using Entity Framework Core."
  - type: "component"
    name: "Telemetry & Domain Event Dispatcher"
    technology: "OpenTelemetry / .NET ILogger"
    description: "Emits sanitized structured domain events and telemetry."
  - type: "container"
    name: "API Gateway"
    technology: "Azure Gateway"
    description: "Routes incoming validated JWT requests via gRPC/REST with mTLS."
  - type: "container"
    name: "Azure SQL Database"
    technology: "Azure SQL"
    description: "Stores transactional data using TCP/TLS 1.3 with TDE."
  - type: "container"
    name: "Azure Key Vault"
    technology: "Azure Key Vault"
    description: "Retrieves encryption keys and secrets via Managed Identity and HTTPS."
  - type: "container"
    name: "Azure Monitor"
    technology: "Azure Monitor / OpenTelemetry"
    description: "Ships scrubbed operational metrics and audit logs via OpenTelemetry."
relationships:
  - source: "API Gateway"
    destination: "Claim Management Controller"
    description: "Routes incoming validated JWT requests via gRPC/REST with mTLS."
  - source: "Claim Management Controller"
    destination: "Claim Domain Model & Engine"
    description: "Delegates core insurance logic processing."
  - source: "Claim Management Controller"
    destination: "Claim Routing & Policy Engine"
    description: "Evaluates feature flags and dynamic routing rules."
  - source: "Claim Domain Model & Engine"
    destination: "Data Access Repository"
    description: "Persists and retrieves domain aggregates."
  - source: "Data Access Repository"
    destination: "Azure SQL Database"
    description: "Reads and writes transactional data using TCP/TLS 1.3 with TDE."
  - source: "Claims Core Domain Service"
    destination: "Azure Key Vault"
    description: "Retrieves encryption keys and secrets via Managed Identity and HTTPS."
  - source: "Telemetry & Domain Event Dispatcher"
    destination: "Azure Monitor"
    description: "Ships scrubbed operational metrics and audit logs via OpenTelemetry."