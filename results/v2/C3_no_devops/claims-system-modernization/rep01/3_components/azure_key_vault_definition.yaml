level: component
scope: "Component diagram for the Azure Key Vault container"
parentContainer:
  name: "Azure Key Vault"
elements:
  - type: "component"
    name: "Secrets Management Component"
    technology: "Azure Key Vault Secrets"
    description: "Manages and provides access to database and API credentials securely."
  - type: "component"
    name: "Key Management Component"
    technology: "Azure Key Vault Premium HSM-backed"
    description: "Provides HSM-backed cryptographic keys for PII encryption at rest."
  - type: "component"
    name: "Access Control & Audit Component"
    technology: "Azure RBAC & Azure Monitor"
    description: "Enforces least-privilege access and monitors audit logs."
  - type: "component"
    name: "Secret Rotation Component"
    technology: "Azure Event Grid & Azure Functions"
    description: "Automates zero-downtime secret rotation based on expiration events."
relationships:
  - source: "Claims Core Domain Service"
    destination: "Secrets Management Component"
    description: "Retrieves database and API credentials via HTTPS / Managed Identity (TLS 1.3)"
  - source: "Claims Core Domain Service"
    destination: "Key Management Component"
    description: "Requests cryptographic keys for PII encryption at rest via HTTPS / Managed Identity (TLS 1.3)"
  - source: "Secrets Management Component"
    destination: "Azure Event Grid"
    description: "Emits secret expiration events"
  - source: "Azure Event Grid"
    destination: "Secret Rotation Component"
    description: "Triggers automated credential rotation via Managed Identity"
  - source: "Azure Monitor"
    destination: "Audit & Compliance System"
    description: "Exports security and audit logs via syslog / Event Hubs"