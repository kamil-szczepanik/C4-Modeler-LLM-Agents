level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "YARP Router"
    technology: ".NET / YARP on Azure Container Apps"
    description: "Forwards incoming HTTPS/JSON requests from the web application and routes internal requests via gRPC/mTLS."
  - type: "component"
    name: "Authentication Middleware"
    technology: ".NET Middleware"
    description: "Validates JWTs against Corporate Active Directory over HTTPS."
relationships:
  - source: "YARP Router"
    destination: "Authentication Middleware"
    description: "Delegates token validation [HTTPS]"
  - source: "Authentication Middleware"
    destination: "YARP Router"
    description: "Returns validation result"