level: component
scope: "Component diagram for the Integration & Sync Worker container"
parentContainer:
  name: "Integration & Sync Worker"
elements:
  - type: "component"
    name: "Mainframe Adapter Component"
    technology: ".NET Isolated Worker (.NET)"
    description: "Handles legacy payload transmission and interfaces with the mainframe."
  - type: "component"
    name: "Sync Orchestrator Component"
    technology: ".NET Isolated Worker (.NET)"
    description: "Orchestrates transactional state and idempotency tracking."
  - type: "component"
    name: "Dead-Letter & Audit Handler Component"
    technology: ".NET Isolated Worker (.NET)"
    description: "Manages failed messages and audit logging."
  - type: "component"
    name: "Replay API Controller Component"
    technology: ".NET Isolated Worker (.NET)"
    description: "Handles manual transaction recovery requests from the support team."
  - type: "component"
    name: "State & Deduplication Store"
    technology: "Azure SQL Database"
    description: "Tracks transactional state, outbox pattern, and idempotency deduplication."
relationships:
  - source: "Mainframe Adapter Component"
    destination: "Enterprise Service Bus"
    description: "Legacy payload transmission [mTLS, IPsec encryption]"
  - source: "Support Team"
    destination: "Replay API Controller Component"
    description: "Manual transaction recovery [HTTPS via TLS 1.3, Azure Entra ID token validation]"
  - source: "Sync Orchestrator Component"
    destination: "State & Deduplication Store"
    description: "Transactional state and idempotency tracking [ADO.NET / Entity Framework Core]"