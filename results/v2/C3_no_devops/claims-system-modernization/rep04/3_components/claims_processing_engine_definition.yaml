level: component
scope: "Component diagram for the Claims Processing Engine container"
parentContainer:
  name: "Claims Processing Engine"
elements:
  - type: "component"
    name: "Claim State Orchestrator"
    technology: "ASP.NET Core / MediatR"
    description: "Orchestrates claim processing states, workflows, and in-memory dispatching for incoming claims."
  - type: "component"
    name: "Migration Routing Component"
    technology: "ASP.NET Core / Strangler Fig Router"
    description: "Routes claim types gradually between the modern platform and the legacy mainframe system."
  - type: "component"
    name: "Reconciliation Worker"
    technology: "ASP.NET Core Background Service"
    description: "Ensures zero data loss and validates state synchronization between the modern database and legacy systems."
relationships:
  - source: "Claim State Orchestrator"
    destination: "Migration Routing Component"
    description: "Delegates claim-type specific routing paths"
  - source: "Migration Routing Component"
    destination: "Reconciliation Worker"
    description: "Sends transaction records for audit and parity checking"