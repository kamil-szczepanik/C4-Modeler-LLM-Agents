level: component
scope: "Component diagram for the Azure API Management container"
parentContainer:
  name: "Azure API Management"
elements:
  - type: "component"
    name: "Strangler Fig Router Policy"
    technology: "APIM Policy XML / Azure API Management Policy Engine"
    description: "Evaluates incoming requests against dynamic routing rules to direct traffic to either the modern Claims Processing Engine or the Legacy Mainframe."
  - type: "component"
    name: "Routing Configuration Store"
    technology: "Azure App Configuration"
    description: "Stores live feature-flag routing rules for zero-downtime, dynamic routing and instant claim-type rollbacks."
  - type: "component"
    name: "Gateway Security Enforcer"
    technology: "Azure Active Directory & Key Vault"
    description: "Validates OAuth 2.0 / OpenID Connect tokens, handles SSO integration, and manages mTLS certificates for secure routing."
relationships:
  - source: "Strangler Fig Router Policy"
    destination: "Routing Configuration Store"
    description: "Queries live routing rules [HTTPS/REST]"
  - source: "Strangler Fig Router Policy"
    destination: "Claims Processing Engine"
    description: "Routes migrated claims [gRPC / HTTPS]"
  - source: "Strangler Fig Router Policy"
    destination: "Legacy Mainframe"
    description: "Proxies unmigrated claims [site-to-site VPN/ExpressRoute with mTLS]"
  - source: "Gateway Security Enforcer"
    destination: "Strangler Fig Router Policy"
    description: "Provides security validation and credentials [HTTPS/OAuth 2.0]"