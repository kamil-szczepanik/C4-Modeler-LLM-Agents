level: component
scope: "Component diagram for the Customer Portal container"
parentContainer:
  name: "Customer Portal"
elements:
  - type: "component"
    name: "Claim Submission Wizard"
    technology: "React & TypeScript, Zod & React Hook Form, TanStack Query, IndexedDB"
    description: "Submits claim payloads and ensures robust draft data integrity with offline-resilient persistence."
  - type: "component"
    name: "Claim Tracking Dashboard"
    technology: "React & TypeScript, TanStack Query"
    description: "Provides policyholders with an interface for online claim tracking."
  - type: "component"
    name: "Broker Portfolio Manager"
    technology: "React & TypeScript, TanStack Query"
    description: "Fetches authorized client claims for brokers."
  - type: "component"
    name: "Auth & Session Manager"
    technology: "React & TypeScript, Azure Static Web Apps Built-in Auth"
    description: "Manages secure session cookies and acquires tokens via Azure Active Directory."
relationships:
  - source: "Auth & Session Manager"
    destination: "Azure Static Web Apps Auth"
    description: "Manages secure session cookies [HTTPS]"
  - source: "Claim Submission Wizard"
    destination: "Azure API Management"
    description: "Submits claim payloads [HTTPS / REST]"
  - source: "Broker Portfolio Manager"
    destination: "Azure API Management"
    description: "Fetches authorized client claims [HTTPS / REST with JWT]"
  - source: "Auth & Session Manager"
    destination: "Azure Active Directory"
    description: "Acquires tokens [OAuth 2.0 / OpenID Connect]"