level: component
scope: "Component diagram for the Azure Cache for Redis container"
parentContainer:
  name: "Azure Cache for Redis"
elements:
  - type: "component"
    name: "Claim State Cache"
    technology: "Azure Cache for Redis Standard Tier"
    description: "Caches active claim states to meet sub-2s SLA and buffers slow mainframe responses."
  - type: "component"
    name: "Reference Data Cache"
    technology: "Azure Cache for Redis Standard Tier"
    description: "Stores reference and lookup data refreshed using the cache-aside pattern."
relationships:
  - source: "Adjuster Web Application"
    destination: "Claim State Cache"
    description: "Queries cached claims to meet sub-2s SLA [TCP/Redis Protocol over TLS 1.2/1.3]"
  - source: "Anti-Corruption Layer"
    destination: "Claim State Cache"
    description: "Invalidates/updates cache via Pub/Sub on mainframe changes [TCP/Redis Protocol over TLS 1.2/1.3]"
  - source: "Claims Processing Engine"
    destination: "Reference Data Cache"
    description: "Refreshes lookup data using cache-aside pattern [TCP/Redis Protocol over TLS 1.2/1.3]"