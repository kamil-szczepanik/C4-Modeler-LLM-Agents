level: component
scope: "Component diagram for the Adjuster Web Application container"
parentContainer:
  name: "Adjuster Web Application"
elements:
  - type: "component"
    name: "SPA UI Components"
    technology: "React SPA"
    description: "Provides a responsive user interface with local session storage draft auto-saving."
  - type: "component"
    name: "Auth Guard Component"
    technology: "React SPA"
    description: "Enforces Single Sign-On and route protection within the client application."
  - type: "component"
    name: "Claim Management Controller"
    technology: "ASP.NET Core BFF"
    description: "Implements server-side token management, FluentValidation, and API orchestration."
  - type: "component"
    name: "Read Model Projections Cache Service"
    technology: "ASP.NET Core BFF"
    description: "Caches claims data to guarantee sub-2-second screen loads."
  - type: "component"
    name: "Mainframe Anti-Corruption Client"
    technology: "ASP.NET Core BFF"
    description: "Communicates with the Anti-Corruption Layer to bridge the modern microservices and the legacy mainframe."
  - type: "component"
    name: "Audit Trail Service"
    technology: "ASP.NET Core BFF"
    description: "Handles auditing and tracking of adjuster actions within the application."
relationships:
  - source: "SPA UI Components"
    destination: "Claim Management Controller"
    description: "HTTPS / JSON"
  - source: "Claim Management Controller"
    destination: "Read Model Projections Cache Service"
    description: ".NET In-Memory / TCP over TLS"
  - source: "Claim Management Controller"
    destination: "Audit Trail Service"
    description: ".NET In-Memory"
  - source: "Audit Trail Service"
    destination: "Mainframe Anti-Corruption Client"
    description: "gRPC / HTTPS"
  - source: "Claim Management Controller"
    destination: "Mainframe Anti-Corruption Client"
    description: "Orchestrates calls"