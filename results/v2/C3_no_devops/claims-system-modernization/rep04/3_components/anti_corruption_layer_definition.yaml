level: component
scope: "Component diagram for the Anti-Corruption Layer container"
parentContainer:
  name: "Anti-Corruption Layer"
elements:
  - type: "component"
    name: "Translation Component"
    technology: "Azure Function, Mapster/AutoMapper"
    description: "Maps domain models to legacy COBOL schemas."
  - type: "component"
    name: "Buffering & Routing Component"
    technology: "Azure Service Bus Topics/Queues"
    description: "Manages asynchronous ingestion and message routing."
  - type: "component"
    name: "Audit & Reconciliation Component"
    technology: "Cosmos DB, Azure Function"
    description: "Captures immutable payloads and writes execution logs."
  - type: "component"
    name: "Reconciliation & Alerting Component"
    technology: "Timer-triggered Azure Function, Azure Monitor API"
    description: "Executes discrepancy checks and emits operational alerts."
relationships:
  - source: "Claims Processing Engine"
    destination: "Translation Component"
    description: "Publishes and consumes events via Azure Service Bus, AMQP."
  - source: "Translation Component"
    destination: "Legacy Mainframe"
    description: "Synchronizes data via HTTPS/SOAP, SFTP, and mTLS."
  - source: "Translation Component"
    destination: "Audit & Reconciliation Component"
    description: "Writes execution logs via Internal .NET SDK / Cosmos DB API."
  - source: "Reconciliation & Alerting Component"
    destination: "Azure Monitor"
    description: "Emits operational alerts via HTTPS / Azure Monitor API."