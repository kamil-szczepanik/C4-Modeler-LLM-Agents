# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization"
elements:
  - type: "person"
    name: "Customers & Brokers"
    description: "External users submitting claims via web browser."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff handling claims via web application."
  - type: "person"
    name: "Customer Support Agents"
    description: "Support staff assisting users with claims."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premises COBOL/DB2 system of record."
  - type: "container"
    name: "Azure API Management"
    technology: "Azure API Management (Strangler Fig Router)"
    description: "Manages routing and Strangler Fig pattern for incremental claim migration."
  - type: "container"
    name: "Customer Portal"
    technology: "React SPA in Azure Static Web Apps"
    description: "Provides customer-facing claims submission interface."
  - type: "container"
    name: "Adjuster Web Application"
    technology: "React SPA + ASP.NET Core BFF"
    description: "Provides adjuster-facing interface and backend-for-frontend service."
  - type: "container"
    name: "Claims Processing Engine"
    technology: "ASP.NET Core Microservices on Azure Kubernetes Service"
    description: "Hosts scalable microservices for processing claims."
  - type: "container"
    name: "Anti-Corruption Layer"
    technology: "Azure Functions & Azure Service Bus"
    description: "Insulates against legacy schema changes and handles event-driven messaging."
  - type: "container"
    name: "Azure Cache for Redis"
    technology: "Azure Cache for Redis"
    description: "Buffers slow mainframe responses to meet performance SLAs."
  - type: "container"
    name: "Azure Active Directory & Key Vault"
    technology: "Azure Active Directory & Key Vault"
    description: "Centralizes single sign-on, RBAC, and secrets management."
relationships:
  - source: "Customers & Brokers"
    destination: "Azure API Management"
    description: "Accesses portals and submits claims"
    technology: "HTTPS/REST"
  - source: "Claims Adjusters"
    destination: "Azure API Management"
    description: "Accesses adjuster application"
    technology: "HTTPS/REST"
  - source: "Customer Support Agents"
    destination: "Azure API Management"
    description: "Accesses system interfaces"
    technology: "HTTPS/REST"
  - source: "Azure API Management"
    destination: "Customer Portal"
    description: "Routes traffic"
    technology: "HTTPS"
  - source: "Azure API Management"
    destination: "Adjuster Web Application"
    description: "Routes traffic"
    technology: "HTTPS"
  - source: "Azure API Management"
    destination: "Legacy Mainframe"
    description: "Proxies unmigrated requests"
    technology: "site-to-site VPN/ExpressRoute with mTLS and TLS 1.3"
  - source: "Adjuster Web Application"
    destination: "Azure Cache for Redis"
    description: "Queries cached claims to serve requests within SLA"
    technology: "TCP/Redis Protocol"
  - source: "Claims Processing Engine"
    destination: "Anti-Corruption Layer"
    description: "Publishes and consumes events"
    technology: "Azure Service Bus topics"
  - source: "Anti-Corruption Layer"
    destination: "Legacy Mainframe"
    description: "Synchronizes data via restricted protocols"
    technology: "Restricted batch/interface protocols"
  - source: "Customer Portal"
    destination: "Azure Active Directory & Key Vault"
    description: "Authenticates users"
    technology: "OAuth 2.0 / OpenID Connect"
  - source: "Adjuster Web Application"
    destination: "Azure Active Directory & Key Vault"
    description: "Authenticates users and retrieves secrets"
    technology: "OAuth 2.0 / OpenID Connect"