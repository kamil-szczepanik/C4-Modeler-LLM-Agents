level: context
scope: "System Context diagram for New Claims Platform"
system:
  name: "New Claims Platform"
  description: "Modernized Azure-hosted claims platform that gradually migrates claim types from a 30-year-old regional insurer's legacy mainframe while maintaining uninterrupted core operations."
elements:
  - type: "person"
    name: "Customers & Brokers"
    description: "External users submitting claims via web browser."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff handling claims via web application."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premises IBM z/OS COBOL/DB2 system of record retained per 3-year migration constraint."
  - type: "externalSystem"
    name: "Active Directory"
    description: "On-premises identity provider."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External SaaS (Twilio SendGrid/Azure Communication Services) for SMS and Email dispatch."
  - type: "externalSystem"
    name: "Telemetry & Monitoring"
    description: "Azure Application Insights/Azure Monitor for metrics and logs."
relationships:
  - source: "Customers & Brokers"
    destination: "New Claims Platform"
    description: "Online claim submission (R-01)"
    technology: "HTTPS"
  - source: "Claims Adjusters"
    destination: "New Claims Platform"
    description: "Claim management (<2s load time, R-02)"
    technology: "HTTPS"
  - source: "New Claims Platform"
    destination: "Legacy Mainframe"
    description: "Claim data proxying"
    technology: "TLS via VPN/ExpressRoute with mTLS"
  - source: "New Claims Platform"
    destination: "Active Directory"
    description: "Single sign-on via Azure AD Connect (R-07)"
    technology: "OIDC/OAuth 2.0"
  - source: "New Claims Platform"
    destination: "Notification Service"
    description: "SMS/Email dispatch"
    technology: "HTTPS REST API"
  - source: "New Claims Platform"
    destination: "Telemetry & Monitoring"
    description: "Metrics and logs collection"
    technology: "HTTPS/Native Diagnostics"