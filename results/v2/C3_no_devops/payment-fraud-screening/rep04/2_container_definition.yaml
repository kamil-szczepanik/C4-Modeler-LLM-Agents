level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analyst & Risk Manager"
    description: "Accesses case management and rule update interfaces."
  - type: "person"
    name: "Compliance / Auditor"
    description: "Queries audit logs for merchant support and compliance."
  - type: "externalSystem"
    name: "Payment Processor"
    description: "Sends transaction authorizations via gRPC."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Manages user authentication via AWS Cognito (OIDC)."
  - type: "container"
    name: "AWS Application Load Balancer"
    technology: "AWS ALB"
    description: "Ingress point for incoming payment authorizations and analyst traffic."
  - type: "container"
    name: "Scoring Engine"
    technology: "Go container on Amazon ECS on AWS Fargate"
    description: "Evaluates card-not-present payment authorizations for fraud at scale with sub-50ms latency."
  - type: "container"
    name: "Case Management Backend"
    technology: "Node.js / TypeScript container on Amazon ECS on AWS Fargate"
    description: "Provides case management features for analysts."
  - type: "container"
    name: "Auditor Query Service"
    technology: "AWS Athena over Amazon S3"
    description: "Queries immutable 7-year audit logs."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Handles low-latency feature lookups and case state management."
  - type: "container"
    name: "Amazon Aurora Serverless v2 PostgreSQL"
    technology: "Amazon Aurora Serverless v2 PostgreSQL"
    description: "Stores tamper-evident audit logs with immutable append-only tables."
  - type: "container"
    name: "Amazon SQS / SNS"
    technology: "Amazon SQS / SNS"
    description: "Provides asynchronous messaging between services."
relationships:
  - source: "Payment Processor"
    destination: "AWS Application Load Balancer"
    description: "Sends payment authorizations"
    technology: "gRPC/HTTPS with mTLS"
  - type: "Fraud Analyst & Risk Manager"
    destination: "AWS Application Load Balancer"
    description: "Accesses case management and rule updates"
    technology: "HTTPS"
  - type: "Compliance / Auditor"
    destination: "Auditor Query Service"
    description: "Queries audit logs"
    technology: "HTTPS"
  - type: "AWS Application Load Balancer"
    destination: "Scoring Engine"
    description: "Routes authorization requests"
    technology: "HTTP/2"
  - type: "AWS Application Load Balancer"
    destination: "Case Management Backend"
    description: "Routes analyst traffic"
    technology: "HTTPS"
  - type: "Scoring Engine"
    destination: "Amazon DynamoDB"
    description: "Performs feature lookups and case state updates"
    technology: "AWS PrivateLink"
  - type: "Scoring Engine"
    destination: "Amazon Aurora Serverless v2 PostgreSQL"
    description: "Writes audit logs"
    technology: "TLS"
  - type: "Case Management Backend"
    destination: "Amazon Aurora Serverless v2 PostgreSQL"
    description: "Reads and writes case audit data"
    technology: "TLS"