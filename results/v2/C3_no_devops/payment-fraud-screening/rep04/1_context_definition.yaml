level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Screens card-not-present payment authorizations for fraud within strict latency limits while providing case management for analysts, ensuring PCI-DSS Level 1 compliance and 7-year tamper-evident auditability."
elements:
  - type: "person"
    name: "Fraud Analyst & Risk Manager"
    description: "Accesses case management and rule update interfaces."
  - type: "person"
    name: "Compliance / Auditor"
    description: "Queries audit logs for merchant support and compliance."
  - type: "externalSystem"
    name: "Payment Processor"
    description: "Sends transaction authorizations via gRPC."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Manages user authentication via AWS Cognito (OIDC)."
relationships:
  - source: "Payment Processor"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Sends authorization requests"
    technology: "gRPC over mTLS"
  - source: "Fraud Analyst & Risk Manager"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Accesses case management, rule updates, and reporting"
    technology: "HTTPS"
  - source: "Compliance / Auditor"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Queries audit logs"
    technology: "HTTPS"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OIDC / AWS Cognito"