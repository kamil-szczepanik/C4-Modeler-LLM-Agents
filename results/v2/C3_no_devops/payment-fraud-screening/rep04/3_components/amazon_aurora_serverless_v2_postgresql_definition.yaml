level: component
scope: "Component diagram for the Amazon Aurora Serverless v2 PostgreSQL container"
parentContainer:
  name: "Amazon Aurora Serverless v2 PostgreSQL"
elements:
  - type: "component"
    name: "Audit Ledger Schema"
    technology: "PostgreSQL tables with cryptographic extensions"
    description: "PostgreSQL tables with cryptographic extensions for R-06 ensuring 7-year tamper-evident auditability."
  - type: "component"
    name: "Case Management Schema"
    technology: "Relational PostgreSQL tables"
    description: "Relational tables for analyst workflows via R-02."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer Sidecar"
    description: "PgBouncer Sidecar for traffic management, DoS mitigation, and resource efficiency."
  - type: "component"
    name: "PostgreSQL RLS Enforcement Component"
    technology: "PostgreSQL Row-Level Security"
    description: "Tenant and analyst isolation enforcement."
  - type: "component"
    name: "AWS IAM Database Authentication Plugin"
    technology: "AWS IAM"
    description: "Provides zero static credentials and database authentication."
  - type: "component"
    name: "AWS KMS Custom Managed Key"
    technology: "AWS KMS"
    description: "Customer Managed Key (CMK) for encryption at rest for PCI-DSS Level 1 compliance."
relationships:
  - source: "Case Management Backend"
    destination: "PostgreSQL RLS Enforcement Component"
    description: "Validates isolation via PostgreSQL wire protocol [TLS]"
  - source: "Auditor Query Service"
    destination: "Audit Ledger Schema"
    description: "Reads immutable audit logs via PostgreSQL wire protocol [TLS]"
  - source: "Amazon Aurora Serverless v2 PostgreSQL"
    destination: "AWS KMS (CMK)"
    description: "Encrypts storage and backups [AWS API]"