level: component
scope: "Component diagram for the Auditor Query Service container"
parentContainer:
  name: "Auditor Query Service"
elements:
  - type: "component"
    name: "API Controller"
    technology: "Node.js / TypeScript container on AWS Fargate"
    description: "Receives secure queries from compliance officers and validates JWTs."
  - type: "component"
    name: "Query Translator"
    technology: "Stateless TypeScript component"
    description: "Translates audit queries into parameterized SQL."
  - type: "component"
    name: "Athena Client"
    technology: "AWS SDK"
    description: "Executes parameterized SQL queries against AWS Athena."
relationships:
  - source: "API Controller"
    destination: "Query Translator"
    description: "Invoke report generation via In-process calls"
  - source: "Query Translator"
    destination: "Athena Client"
    description: "Execute parameterized SQL via AWS SDK / HTTPS"