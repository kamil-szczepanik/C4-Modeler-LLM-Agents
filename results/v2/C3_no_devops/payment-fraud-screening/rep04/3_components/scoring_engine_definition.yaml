level: component
scope: "Component diagram for the Scoring Engine container"
parentContainer:
  name: "Scoring Engine"
elements:
  - type: "component"
    name: "API Handler"
    technology: "Go"
    description: "Manages ingress traffic via HTTP/2, tokenization boundary checks, and circuit-breaker fallback logic."
  - type: "component"
    name: "Model Evaluator"
    technology: "Go with WebAssembly/ONNX runtime"
    description: "Executes in-memory fraud scoring and computes explainability feature weights."
  - type: "component"
    name: "Model Hot-Swapper"
    technology: "Go"
    description: "Background loader that verifies cryptographic signatures and hot-swaps ONNX models without downtime."
  - type: "component"
    name: "Feature Store Cache"
    technology: "In-memory/Go LRU"
    description: "Retrieves real-time velocity counters for transaction evaluation."
  - type: "component"
    name: "Audit Dispatcher"
    technology: "Go"
    description: "Cryptographically signs decision payloads and dispatches them asynchronously."
  - type: "container"
    name: "Amazon SQS / SNS"
    technology: "AWS Messaging Services"
    description: "Receives published signed, tamper-evident audit payloads."
relationships:
  - source: "API Handler"
    destination: "Model Evaluator"
    description: "Executes synchronous calls [HTTP/2]"
  - source: "API Handler"
    destination: "Feature Store Cache"
    description: "Fetches velocity data [In-Memory]"
  - source: "Model Hot-Swapper"
    destination: "Model Evaluator"
    description: "Securely loads cryptographically verified model binaries into memory [Function Call]"
  - source: "Model Evaluator"
    destination: "Audit Dispatcher"
    description: "Passes explainability feature vectors and decision inputs [In-Memory]"
  - source: "Audit Dispatcher"
    destination: "Amazon SQS / SNS"
    description: "Publishes signed, tamper-evident audit payloads [AWS SDK / HTTPS]"