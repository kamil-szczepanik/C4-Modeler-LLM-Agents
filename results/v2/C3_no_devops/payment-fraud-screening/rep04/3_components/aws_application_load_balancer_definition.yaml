level: component
scope: "Component diagram for the AWS Application Load Balancer container"
parentContainer:
  name: "AWS Application Load Balancer"
elements:
  - type: "component"
    name: "Ingress Router and TLS Terminator"
    technology: "AWS ALB Listener"
    description: "Terminates mTLS and HTTPS traffic from payment processors and fraud analysts, performing initial edge checks."
  - type: "component"
    name: "Scoring Traffic Router"
    technology: "HTTP/2 Path-Based Router"
    description: "Routes payment authorization scoring traffic to the Scoring Engine via HTTP/2 on /v1/score."
  - type: "component"
    name: "Administrative Traffic Router"
    technology: "HTTP/1.1 Path-Based Router"
    description: "Routes case management and rule update traffic to the Case Management Backend on /v1/cases/*."
relationships:
  - source: "Ingress Router and TLS Terminator"
    destination: "Scoring Traffic Router"
    description: "Forwards validated scoring requests"
  - source: "Ingress Router and TLS Terminator"
    destination: "Administrative Traffic Router"
    description: "Forwards validated administrative and case management requests"