level: component
scope: "Component diagram for the Case Management Backend container"
parentContainer:
  name: "Case Management Backend"
elements:
  - type: "component"
    name: "Case API Controller"
    technology: "Node.js / TypeScript, OIDC Token Validation, Data Masking Middleware"
    description: "Entry point handling HTTPS requests with OIDC token validation and Data Masking Middleware."
  - type: "component"
    name: "Case Service"
    technology: "Node.js / TypeScript"
    description: "Orchestrates business workflow logic, state transitions, and SLA/workload metrics."
  - type: "component"
    name: "Audit & Export Service"
    technology: "Node.js / TypeScript, AWS SDK"
    description: "Manages asynchronous report generation and publishing to Amazon SQS and Amazon S3."
  - type: "component"
    name: "Data Access Repository"
    technology: "Node.js / TypeScript, Parameterized Queries"
    description: "Interfaces with Amazon Aurora Serverless v2 PostgreSQL using parameterized queries."
  - type: "component"
    name: "Amazon Aurora Serverless v2 PostgreSQL"
    technology: "PostgreSQL, Amazon Aurora Serverless v2"
    description: "Persistent storage for case metadata and operational records."
  - type: "component"
    name: "Amazon S3 & Amazon SQS"
    technology: "AWS S3, Amazon SQS"
    description: "Staging storage for secure audit exports and asynchronous message queuing."
relationships:
  - source: "Fraud Analyst"
    destination: "Case API Controller"
    description: "Accesses review queues and case details via [HTTPS]."
  - source: "Case API Controller"
    destination: "Case Service"
    description: "Invokes workflow operations internally."
  - source: "Audit & Export Service"
    destination: "Amazon SQS"
    description: "Publishes asynchronous export jobs via [AWS SDK / HTTPS]."
  - source: "Data Access Repository"
    destination: "Amazon Aurora Serverless v2 PostgreSQL"
    description: "Persists and retrieves encrypted case data via [TLS / TCP 5432]."
  - source: "Audit & Export Service"
    destination: "Amazon S3"
    description: "Stages exported audit reports via [AWS SDK / HTTPS]."