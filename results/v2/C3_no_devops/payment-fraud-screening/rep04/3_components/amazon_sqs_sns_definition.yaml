level: component
scope: "Component diagram for the Amazon SQS / SNS container"
parentContainer:
  name: "Amazon SQS / SNS"
elements:
  - type: "component"
    name: "FraudEventTopic"
    technology: "Amazon SNS"
    description: "Publishes authorization and decision events from the Scoring Engine."
  - type: "component"
    name: "AuditLogQueue"
    technology: "Amazon SQS"
    description: "Receives payloads from FraudEventTopic for audit logging via AWS PrivateLink."
  - type: "component"
    name: "CaseRoutingQueue"
    technology: "Amazon SQS"
    description: "Receives review tasks from FraudEventTopic to route to the Case Management Backend."
  - type: "component"
    name: "Dead-Letter Queues (DLQ)"
    technology: "Amazon SQS DLQ"
    description: "Prevents poison-pill message processing loops with a maximum receive count limit."
relationships:
  - source: "FraudEventTopic"
    destination: "AuditLogQueue"
    description: "Pushes payloads to"
  - source: "FraudEventTopic"
    destination: "CaseRoutingQueue"
    description: "Pushes payloads to"