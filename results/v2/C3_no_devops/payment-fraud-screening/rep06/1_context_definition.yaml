level: context
scope: "System Context diagram for Fraud Screening System"
system:
  name: "Fraud Screening System"
  description: "Screens card-not-present payment authorizations for fraud in real-time while providing a case management UI for analysts, delivering sub-50ms decisions and 7-year tamper-evident auditability."
elements:
  - type: "person"
    name: "Payer (End Customer)"
    description: "Initiates checkouts."
  - type: "person"
    name: "Merchant"
    description: "Receives transaction approvals."
  - type: "person"
    name: "Fraud Analyst"
    description: "Reviews suspicious cases via Case Management UI."
  - type: "person"
    name: "Risk Operations Manager"
    description: "Oversees audit logs and compliance."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "External system sending authorization payloads."
  - type: "externalSystem"
    name: "Card Networks / Tokenization Service"
    description: "External system providing PAN tokenization."
  - type: "externalSystem"
    name: "ML Model / Rule Provider"
    description: "External service supplying fraud models."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "Fraud Screening System"
    description: "Sends real-time authorization payloads for synchronous scoring"
    technology: "HTTPS/gRPC"
  - source: "Fraud Screening System"
    destination: "ML Model / Rule Provider"
    description: "Fetches updated risk models asynchronously for zero-downtime updates"
    technology: "HTTPS/S3"