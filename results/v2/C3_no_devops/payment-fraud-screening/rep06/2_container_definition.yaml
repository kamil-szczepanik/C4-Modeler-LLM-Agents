level: container
scope: "Container diagram for Real-Time Payment Fraud Screening system"
system:
  name: "Real-Time Payment Fraud Screening system"
elements:
  - type: "person"
    name: "Fraud Analysts & Risk Operations Managers"
    description: "Internal human users reviewing cases and managing rules."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment gateway sending card-not-present payment authorization requests."
  - type: "externalSystem"
    name: "Amazon S3"
    description: "External object storage hosting rule bundles and frontend assets."
  - type: "container"
    name: "API Gateway / Ingress Router"
    description: "Amazon API Gateway / ALB terminating TLS."
    technology: "Amazon API Gateway / ALB"
  - type: "container"
    name: "Scoring Engine"
    description: "Stateless container evaluating rules and ML models in-memory."
    technology: "Java/Spring Boot or Go / ECS Fargate"
  - type: "container"
    name: "Case Management API"
    description: "Container handling analyst workflows and review queues."
    technology: "Node.js or Python/FastAPI / ECS Fargate"
  - type: "container"
    name: "Fraud Analyst SPA"
    description: "React single-page application hosted in Amazon S3 / CloudFront."
    technology: "React / Amazon S3 / Amazon CloudFront"
  - type: "container"
    name: "Rule & Model Distribution Service"
    description: "Container handling zero-downtime rule/model updates."
    technology: "Java/Spring Boot or Go / ECS Fargate"
  - type: "container"
    name: "Audit & Persistence Store"
    description: "Amazon Aurora PostgreSQL with cryptographic chaining."
    technology: "Amazon Aurora PostgreSQL"
  - type: "container"
    name: "Feature Store"
    description: "Amazon ElastiCache Redis."
    technology: "Amazon ElastiCache Redis"
  - type: "container"
    name: "Asynchronous Event Bus"
    description: "Amazon EventBridge / MSK Lite."
    technology: "Amazon EventBridge / MSK Lite"
relationships:
  - source: "Payment Gateway"
    destination: "API Gateway / Ingress Router"
    description: "Processing authorization requests"
    technology: "HTTPS/gRPC over TLS 1.3"
  - source: "API Gateway / Ingress Router"
    destination: "Scoring Engine"
    description: "Enforcing mTLS within private subnets"
    technology: "gRPC/HTTP2 over TLS"
  - source: "Scoring Engine"
    destination: "Feature Store"
    description: "Accessing low-latency feature stores"
    technology: "RESP protocol over private VPC"
  - source: "Scoring Engine"
    destination: "Asynchronous Event Bus"
    description: "Asynchronous decision streaming"
    technology: "HTTPS via AWS SDK"
  - source: "Fraud Analyst SPA"
    destination: "Case Management API"
    description: "Managing analyst workflows and review queues"
    technology: "HTTPS/REST with OAuth2/OIDC via AWS Cognito"
  - source: "Rule & Model Distribution Service"
    destination: "Amazon S3"
    description: "Polling cryptographically signed rule bundles (Ed25519)"
    technology: "HTTPS"