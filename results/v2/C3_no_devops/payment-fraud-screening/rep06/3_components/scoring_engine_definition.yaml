level: component
scope: "Component diagram for the Scoring Engine container"
parentContainer:
  name: "Scoring Engine"
elements:
  - type: "component"
    name: "Scoring API Controller"
    technology: "Go / net/http"
    description: "Handles ingress gRPC/HTTP2, token stripping, and circuit breaking."
  - type: "component"
    name: "Feature Aggregator Component"
    technology: "Go / Amazon ElastiCache Redis"
    description: "Concurrently fetches real-time features from Amazon ElastiCache Redis."
  - type: "component"
    name: "Evaluation Engine Component"
    technology: "Go / In-memory"
    description: "Evaluates rules and ML models in-memory using atomic pointer swaps."
  - type: "component"
    name: "Audit Dispatcher Component"
    technology: "Go / AWS KMS / Amazon EventBridge"
    description: "Signs decision payloads via AWS KMS and publishes to Amazon EventBridge."
  - type: "component"
    name: "Rule Synchronizer Sub-Component"
    technology: "Go / Rule & Model Distribution Service"
    description: "Cryptographically verifies and hot-reloads models from the Rule & Model Distribution Service."
relationships:
  - source: "API Gateway / Ingress Router"
    destination: "Scoring API Controller"
    description: "Enforces mTLS within private subnets via gRPC/HTTP2 over TLS 1.3."
  - source: "Feature Aggregator Component"
    destination: "Amazon ElastiCache Redis"
    description: "Fetches low-latency features using RESP protocol over private VPC with TLS and IAM auth."
  - source: "Audit Dispatcher Component"
    destination: "Amazon EventBridge"
    description: "Streams cryptographically signed audit payloads asynchronously using HTTPS via AWS SDK with SigV4."
  - source: "Rule Synchronizer Sub-Component"
    destination: "Rule & Model Distribution Service"
    description: "Ingests signed scoring rules and models in the background."