level: component
scope: "Component diagram for the Asynchronous Event Bus container"
parentContainer:
  name: "Asynchronous Event Bus"
elements:
  - type: "component"
    name: "Event Router"
    technology: "Amazon EventBridge Bus"
    description: "Screens card-not-present payment authorizations for fraud prior to approval and routes events."
  - type: "component"
    name: "Event Archive"
    technology: "Amazon EventBridge Archive with Amazon S3 Object Lock"
    description: "Archives events and enforces tamper-evident 7-year audit retention to comply with PCI-DSS Level 1 constraints."
  - type: "component"
    name: "Dead-Letter Queue (DLQ)"
    technology: "Amazon SQS"
    description: "Guarantees zero data loss and at-least-once delivery for unroutable or failed events."
  - type: "component"
    name: "Rule Dispatcher"
    technology: "Amazon EventBridge Rule Subscriptions"
    description: "Dispatches events to appropriate downstream rule subscriptions."
  - type: "component"
    name: "Audit & Persistence Store"
    technology: "Amazon Aurora PostgreSQL"
    description: "Stores audit data and provides a 7-year tamper-evident audit trail."
relationships:
  - source: "Scoring Engine"
    destination: "Event Router"
    description: "Asynchronous event publishing via HTTPS using AWS SDK v2 and AWS Signature Version 4 (PutEvents)."
  - source: "Event Router"
    destination: "Case Management SQS Queue"
    description: "Event push delivery via HTTPS using AWS KMS CMK encryption."
  - source: "Event Router"
    destination: "Event Archive"
    description: "Native SQS/S3 integration with Object Lock enabled for 7-year retention."