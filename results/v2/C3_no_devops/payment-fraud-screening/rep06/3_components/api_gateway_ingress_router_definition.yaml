level: component
scope: "Component diagram for the API Gateway / Ingress Router container"
parentContainer:
  name: "API Gateway / Ingress Router"
elements:
  - type: "component"
    name: "Payment Ingress Router"
    technology: "AWS Application Load Balancer"
    description: "Handles high-throughput B2B payment authorization requests via HTTPS/gRPC over TLS 1.3 and mTLS."
  - type: "component"
    name: "Management API Gateway"
    technology: "Amazon API Gateway"
    description: "Routes management traffic, providing built-in AWS Cognito JWT validation and AWS WAF integration."
relationships:
  - source: "Payment Ingress Router"
    destination: "Scoring Engine"
    description: "Forwards payload requests via gRPC over mTLS within private subnets via VPC Endpoints."
  - source: "Management API Gateway"
    destination: "Case Management API"
    description: "Routes case management operations via HTTPS over mTLS."