level: component
scope: "Component diagram for the Rule & Model Distribution Service container"
parentContainer:
  name: "Rule & Model Distribution Service"
elements:
  - type: "component"
    name: "Admin API Controller"
    technology: "Spring MVC"
    description: "Handles administrative API requests for rule and model distribution."
  - type: "component"
    name: "Bundle Signer & Validator"
    technology: "AWS KMS / Ed25519"
    description: "Cryptographically signs and validates rule bundles without secret exfiltration."
  - type: "component"
    name: "Storage Sync Agent"
    technology: "AWS SDK for Java"
    description: "Synchronizes rule bundles with storage and emits audit events."
  - type: "component"
    name: "Rule Syntax Linter"
    technology: "JSON Schema Validator / ANTLR"
    description: "Performs static rule syntax validation protecting against DoS and injection."
relationships:
  - source: "Admin API Controller"
    destination: "Rule Syntax Linter"
    description: "In-process method call"
  - source: "Admin API Controller"
    destination: "Bundle Signer & Validator"
    description: "In-process call utilizing AWS KMS via HTTPS/AWS SDK"
  - source: "Storage Sync Agent"
    destination: "Amazon S3"
    description: "HTTPS / AWS SDK for rule bundle distribution"
  - source: "Storage Sync Agent"
    destination: "Amazon EventBridge"
    description: "HTTPS / AWS SDK for audit events"