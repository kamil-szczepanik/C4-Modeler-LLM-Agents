level: component
scope: "Component diagram for the Fraud Analyst SPA container"
parentContainer:
  name: "Fraud Analyst SPA"
elements:
  - type: "component"
    name: "Case Review Workspace Module"
    technology: "React Component"
    description: "Fetches transaction context and explainability payloads from the Case Management API."
  - type: "component"
    name: "Analytics Dashboard Module"
    technology: "React Component"
    description: "Fetches aggregated metrics and audit logs from the Case Management API and reporting services."
  - type: "component"
    name: "Explainability Renderer"
    technology: "React Sub-component / Chart.js / Tailwind CSS"
    description: "Renders lightweight visualization and explainability metrics for fraud analysts."
relationships:
  - source: "Case Review Workspace Module"
    destination: "Case Management API"
    description: "Fetching transaction context and explainability payloads [HTTPS/REST via AWS Cognito]"
  - source: "Analytics Dashboard Module"
    destination: "Case Management API"
    description: "Fetching aggregated metrics and audit logs [HTTPS/REST via AWS Cognito]"