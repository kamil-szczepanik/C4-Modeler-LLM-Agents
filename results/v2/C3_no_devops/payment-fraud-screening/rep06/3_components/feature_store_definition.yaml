level: component
scope: "Component diagram for the Feature Store container"
parentContainer:
  name: "Feature Store"
elements:
  - type: "component"
    name: "Low-Latency Read Component"
    technology: "Amazon ElastiCache Redis"
    description: "Provides sub-10ms key-value lookups for real-time feature retrieval within budget."
  - type: "component"
    name: "Ingestion Worker"
    technology: "Python/FastAPI / Amazon ECS Fargate"
    description: "Lightweight processing for ingestion workers handling feature schemas and batch/streaming feature updates."
  - type: "component"
    name: "State & Metadata Registry"
    technology: "Amazon DynamoDB"
    description: "Serverless metadata registry for tracking feature definitions and provenance metadata securely."
relationships:
  - source: "Ingestion Worker"
    destination: "State & Metadata Registry"
    description: "Stores feature definitions and provenance metadata"