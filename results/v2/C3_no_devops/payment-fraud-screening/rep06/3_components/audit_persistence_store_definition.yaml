level: component
scope: "Component diagram for the Audit & Persistence Store container"
parentContainer:
  name: "Audit & Persistence Store"
elements:
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL, PL/pgSQL, JDBC over TLS 1.3, mTLS, AWS IAM"
    description: "Primary relational database with cryptographic chaining for tamper-evident storage, supporting operational transaction states, case management, and native partitioning."
  - type: "component"
    name: "Audit Ledger Writer"
    technology: "PL/pgSQL, SHA-256"
    description: "Append-only component using SHA-256 cryptographic hashing to ensure tamper-evident audit logs."
  - type: "component"
    name: "Data Retention Manager"
    technology: "AWS SDK, VPC endpoints"
    description: "Automated monthly table partitioning and lifecycle policies targeting cold storage."
  - type: "component"
    name: "Transaction & Case Repository"
    technology: "Amazon Aurora PostgreSQL"
    description: "Stores operational transaction states and case management data."
  - type: "component"
    name: "Audit Query & Retrieval Gateway"
    technology: "Read-replica routing service, Amazon ElastiCache Redis, Batch hydration APIs"
    description: "Read-replica routing service with an internal Redis caching layer and batch hydration APIs."
  - type: "component"
    name: "AWS S3 Glacier Flexible Retrieval"
    technology: "AWS S3 Glacier, AWS S3 Object Lock, WORM immutability"
    description: "Cold storage tier featuring AWS S3 Object Lock for WORM immutability and 7-year retention."
relationships:
  - source: "Scoring Engine"
    destination: "Amazon Aurora PostgreSQL"
    description: "Connects via JDBC over TLS 1.3 with mutual TLS (mTLS) and AWS IAM database authentication."
  - source: "Case Management API"
    destination: "Amazon Aurora PostgreSQL"
    description: "Connects via JDBC over TLS 1.3 with mTLS and IAM database authentication, restricted by Row-Level Security (RLS)."
  - source: "Data Retention Manager"
    destination: "AWS S3 Glacier Flexible Retrieval"
    description: "Archives aged partitions via AWS SDK using VPC endpoints with WORM Object Lock."
  - source: "Audit Query & Retrieval Gateway"
    destination: "AWS S3 Glacier Flexible Retrieval"
    description: "Fetches cold data asynchronously using pre-signed S3 URLs with 15-minute expiration windows."