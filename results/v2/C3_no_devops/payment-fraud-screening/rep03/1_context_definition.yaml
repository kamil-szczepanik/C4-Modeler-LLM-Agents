level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening system"
system:
  name: "Real-Time Payment Fraud Screening"
  description: "Screens card-not-present payment authorizations for fraud prior to approval and provides case management for analyst reviews."
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Internal users reviewing flagged transactions via case management."
  - type: "person"
    name: "Risk & Compliance Officers"
    description: "Internal users auditing tamper-evident decision logs."
  - type: "person"
    name: "Fraud Engineers"
    description: "Internal users updating rules and models without downtime."
  - type: "externalSystem"
    name: "Payment Processor Systems / Payment Gateway"
    description: "External actor sending authorization requests."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "AWS IAM Identity Center handling SSO and MFA."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Amazon SES for analyst review alerts."
  - type: "externalSystem"
    name: "Audit Ledger"
    description: "AWS QLDB or WORM-configured S3 storing tamper-evident logs."
relationships:
  - source: "Payment Processor Systems / Payment Gateway"
    destination: "Real-Time Payment Fraud Screening"
    description: "Sends authorization requests for fraud screening"
    technology: "REST/gRPC over mTLS and TLS 1.3 via AWS API Gateway"
  - source: "Fraud Analysts"
    destination: "Real-Time Payment Fraud Screening"
    description: "Reviews flagged transactions via case management"
    technology: "HTTPS via SSO/OIDC and RBAC"
  - source: "Real-Time Payment Fraud Screening"
    destination: "Audit Ledger"
    description: "Writes tamper-evident decision logs for 7-year retention"
    technology: "Encrypted write operations"
  - source: "Real-Time Payment Fraud Screening"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OIDC/SAML"