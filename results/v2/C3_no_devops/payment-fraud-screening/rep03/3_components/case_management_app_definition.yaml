level: component
scope: "Component diagram for the Case Management App container"
parentContainer:
  name: "Case Management App"
elements:
  - type: "component"
    name: "API Router & Auth Middleware"
    technology: "Node.js / Express"
    description: "Routes incoming requests and handles authentication middleware."
  - type: "component"
    name: "Case Business Logic Component"
    technology: "Node.js"
    description: "Executes business logic for case management and fraud review workflows."
  - type: "component"
    name: "Analyst SPA Frontend"
    technology: "React"
    description: "Provides the analyst SPA frontend and productivity dashboard."
relationships:
  - source: "Analyst SPA Frontend"
    destination: "API Router & Auth Middleware"
    description: "Transmits API requests [HTTPS/REST]"
  - source: "API Router & Auth Middleware"
    destination: "Case Business Logic Component"
    description: "Forwards validated requests [In-memory / REST]"
  - source: "Case Business Logic Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists case and transaction data [TLS/SQL]"
  - source: "Case Business Logic Component"
    destination: "Audit Ledger"
    description: "Sends signed analyst actions [HTTPS / signed requests]"
  - source: "Case Business Logic Component"
    destination: "Amazon SQS"
    description: "Offloads asynchronous SLA checks and notifications [AWS SDK / TLS]"