level: component
scope: "Component diagram for the Scoring Engine container"
parentContainer:
  name: "Scoring Engine"
elements:
  - type: "component"
    name: "API Router / HTTP Listener"
    technology: "Rust"
    description: "Handles ingress payment authorization requests and exposes HTTP/gRPC endpoints."
  - type: "component"
    name: "In-Memory Rule & Model Evaluator"
    technology: "Rust, WebAssembly"
    description: "Evaluates transactions in real-time with sub-50ms latency using a memory-bounded Wasmtime sandbox."
  - type: "component"
    name: "Hot-Reload Coordinator"
    technology: "Rust"
    description: "Fetches signed WebAssembly modules and model weights for dynamic updates."
  - type: "component"
    name: "Audit Dispatcher"
    technology: "Rust"
    description: "Publishes signed tamper-evident decision logs."
  - type: "component"
    name: "Telemetry Emitter"
    technology: "Rust"
    description: "Flushes aggregated decision metrics for system monitoring."
relationships:
  - source: "API Gateway / Application Load Balancer"
    destination: "API Router / HTTP Listener"
    description: "Ingress payment authorization requests [Synchronous gRPC/REST, mTLS]"
  - source: "Hot-Reload Coordinator"
    destination: "Amazon S3"
    description: "Fetches signed WebAssembly modules and model weights [HTTPS, TLS 1.3]"
  - source: "Audit Dispatcher"
    destination: "Amazon SQS"
    description: "Publishes signed tamper-evident decision logs [Asynchronous JSON, HTTPS/TLS 1.3]"
  - source: "Audit Dispatcher"
    destination: "Audit Ledger"
    description: "Publishes signed tamper-evident decision logs [Asynchronous JSON, HTTPS/TLS 1.3]"
  - source: "Telemetry Emitter"
    destination: "Amazon SQS"
    description: "Flushes aggregated decision metrics [Asynchronous event streaming]"