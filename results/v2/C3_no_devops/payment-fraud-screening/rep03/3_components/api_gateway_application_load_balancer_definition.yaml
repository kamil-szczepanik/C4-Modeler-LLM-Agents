level: component
scope: "Component diagram for the API Gateway / Application Load Balancer container"
parentContainer:
  name: "API Gateway / Application Load Balancer"
elements:
  - type: "component"
    name: "AWS Application Load Balancer (ALB) with AWS WAF and AWS Shield"
    technology: "AWS ALB, AWS WAF, AWS Shield"
    description: "Provides low-latency, cost-effective edge routing, DDoS protection, and edge request sanitization."
  - type: "component"
    name: "Listener & TLS Terminator Component"
    technology: "AWS ALB Listener, TLS 1.3"
    description: "Terminates TLS connections and handles incoming secure traffic."
  - type: "component"
    name: "Path-Based Routing Router Component"
    technology: "AWS ALB Routing Rules"
    description: "Routes traffic based on request paths to appropriate downstream services."
  - type: "component"
    name: "Authentication/Authorization Filter Component"
    technology: "OAuth2 / OIDC, IdP Integration"
    description: "Authenticates and authorizes incoming requests."
  - type: "component"
    name: "Rate Limiting & Throttling Filter Component"
    technology: "AWS WAF Rate-based Rules"
    description: "Protects against overload and enforces rate limits."
  - type: "component"
    name: "Telemetry & Tracing Injector Component"
    technology: "OpenTelemetry, AWS CloudWatch"
    description: "Injects tracing headers and streams access logs and metrics."
  - type: "component"
    name: "Edge Request Sanitization Component"
    technology: "AWS WAF Schema Validation"
    description: "Ensures edge request sanitization and schema validation for PCI-DSS Level 1 compliance."
relationships:
  - source: "Listener & TLS Terminator Component"
    destination: "Path-Based Routing Router Component"
    description: "Passes decrypted requests"
  - source: "Path-Based Routing Router Component"
    destination: "Authentication/Authorization Filter Component"
    description: "Forwards requests for validation"
  - source: "Authentication/Authorization Filter Component"
    destination: "Rate Limiting & Throttling Filter Component"
    description: "Forwards authenticated requests"
  - source: "Rate Limiting & Throttling Filter Component"
    destination: "Edge Request Sanitization Component"
    description: "Forwards throttled requests for inspection"
  - source: "Edge Request Sanitization Component"
    destination: "Telemetry & Tracing Injector Component"
    description: "Enriches requests with telemetry metadata"