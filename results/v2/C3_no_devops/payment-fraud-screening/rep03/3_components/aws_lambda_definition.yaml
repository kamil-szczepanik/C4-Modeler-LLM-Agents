level: component
scope: "Component diagram for the AWS Lambda container"
parentContainer:
  name: "AWS Lambda"
elements:
  - type: "component"
    name: "Event Consumer Component"
    technology: "AWS Lambda"
    description: "Triggers audit event processing via Event Source Mapping from Amazon SQS."
  - type: "component"
    name: "Crypto Signer Component"
    technology: "AWS Lambda, AWS KMS, AWS Encryption SDK"
    description: "Requests cryptographic signatures and performs payload-level encryption ensuring no cleartext PAN data touches memory or logs."
  - type: "component"
    name: "Ledger Writer Component"
    technology: "AWS Lambda"
    description: "Writes cryptographically signed audit logs to the Audit Ledger via HTTPS/TLS 1.3."
  - type: "component"
    name: "Error Handling & DLQ Component"
    technology: "AWS Lambda, Amazon SQS"
    description: "Forwards unprocessable poison messages using encrypted queues to Amazon SQS DLQ."
relationships:
  - source: "Event Consumer Component"
    destination: "Crypto Signer Component"
    description: "Passes consumed audit events for encryption and signing"
  - source: "Crypto Signer Component"
    destination: "Ledger Writer Component"
    description: "Sends signed and encrypted audit payloads"
  - source: "Event Consumer Component"
    destination: "Error Handling & DLQ Component"
    description: "Forwards unprocessable messages on failure"