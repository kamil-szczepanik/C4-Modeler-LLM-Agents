level: component
scope: "Component diagram for the Model & Rule Management Service container"
parentContainer:
  name: "Model & Rule Management Service"
elements:
  - type: "component"
    name: "Rule API Router"
    technology: "Python/FastAPI"
    description: "Exposes endpoints for fraud engineers and risk officers to manage and create rules and models."
  - type: "component"
    name: "Rule Management Engine"
    technology: "Python"
    description: "Validates, processes, and cryptographically signs rule bundles before distribution."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Python"
    description: "Writes audit events to the external Audit Ledger to maintain tamper-evident compliance."
relationships:
  - source: "Rule API Router"
    destination: "Rule Management Engine"
    description: "Routes rule and model payloads for processing"
  - source: "Rule Management Engine"
    destination: "Audit Logger Component"
    description: "Triggers immutable audit logging for administrative actions"