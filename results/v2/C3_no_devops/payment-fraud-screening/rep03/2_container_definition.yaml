level: container
scope: "Container diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Internal users reviewing suspicious transactions."
  - type: "person"
    name: "Risk & Compliance Officers"
    description: "Internal users auditing compliance and historical logs."
  - type: "externalSystem"
    name: "Payment Gateway / Processor Systems"
    description: "External system sending payment authorizations for fraud screening."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system providing authentication and short-lived JWTs."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External service used for notifications."
  - type: "externalSystem"
    name: "Audit Ledger"
    description: "S3 WORM / Amazon QLDB storing 7-year audit records."
  - type: "container"
    name: "API Gateway / Application Load Balancer"
    technology: "AWS API Gateway / ALB"
    description: "Ingress point for incoming requests."
  - type: "container"
    name: "Scoring Engine"
    technology: "Rust, AWS ECS Fargate"
    description: "Performs low-latency fraud scoring on payment authorizations."
  - type: "container"
    name: "Case Management App"
    technology: "Node.js/Python backend + React SPA, AWS ECS Fargate"
    description: "Provides a case management interface for analysts to review suspicious transactions."
  - type: "container"
    name: "Model & Rule Management Service"
    technology: "AWS ECS Fargate"
    description: "Manages fraud detection models and rules."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Primary transactional database for the application."
  - type: "container"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Messaging queue for decoupling the latency-critical scoring path from audit logging."
  - type: "container"
    name: "AWS Lambda"
    technology: "AWS Lambda"
    description: "Processes audit events and performs cryptographic signing."
relationships:
  - source: "Payment Gateway / Processor Systems"
    destination: "API Gateway / Application Load Balancer"
    description: "Sends payment authorizations for fraud screening"
    technology: "Synchronous REST/gRPC, TLS 1.3"
  - source: "Fraud Analysts"
    destination: "Case Management App"
    description: "Reviews suspicious transactions"
    technology: "HTTPS, OAuth2/OIDC"
  - source: "Risk & Compliance Officers"
    destination: "Case Management App"
    description: "Audits historical data and compliance logs"
    technology: "HTTPS, OAuth2/OIDC"
  - code: null
    source: "API Gateway / Application Load Balancer"
    destination: "Scoring Engine"
    description: "Forwards payment authorization requests for evaluation"
    technology: "Synchronous REST/gRPC, mTLS"
  - source: "Case Management App"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OAuth2/OIDC with short-lived JWTs"
  - source: "Scoring Engine"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes transactional data"
    technology: "Synchronous SQL, TLS 1.3"
  - source: "Scoring Engine"
    destination: "Amazon SQS"
    description: "Publishes audit events asynchronously"
    technology: "Asynchronous event streaming"
  - source: "Amazon SQS"
    destination: "AWS Lambda"
    description: "Triggers audit log processing"
    technology: "Event-driven invocation"
  - source: "AWS Lambda"
    destination: "Audit Ledger"
    description: "Writes cryptographically signed audit logs"
    technology: "Encrypted writes"