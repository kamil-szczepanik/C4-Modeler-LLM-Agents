level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Screens card-not-present payment authorizations for fraud within sub-50ms latency while supporting secure case management and 7-year tamper-evident audits."
elements:
  - type: "person"
    name: "Fraud Analyst, ML Engineer / Data Scientist, and Finance / Operations Manager"
    description: "Internal users who manage cases, monitor models, and oversee financial operations."
  - type: "externalSystem"
    name: "Payment Gateway / Core Processing Engine"
    description: "Processes payment authorizations and communicates transaction events."
  - type: "externalSystem"
    name: "Card Schemes / Identity Providers"
    description: "Provide external payment network data and identity services."
  - type: "externalSystem"
    name: "Archival Storage / Compliance Ledger"
    description: "Stores cryptographically signed event streams ensuring 7-year tamper-evident auditability."
relationships:
  - source: "Payment Gateway / Core Processing Engine"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Sends payment authorizations for fraud screening"
    technology: "Synchronous gRPC over mTLS"
  - source: "Fraud Analyst, ML Engineer / Data Scientist, and Finance / Operations Manager"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Accesses case management and monitoring tools"
    technology: "HTTPS via OIDC/OAuth2 with RBAC/MFA"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Archival Storage / Compliance Ledger"
    description: "Streams event data for long-term compliance storage"
    technology: "Asynchronous, cryptographically signed event streams (AWS Kinesis to S3 Object Lock)"