level: component
scope: "Component diagram for the AWS API Gateway / NLB container"
parentContainer:
  name: "AWS API Gateway / NLB"
elements:
  - type: "component"
    name: "AWS Network Load Balancer"
    technology: "AWS NLB"
    description: "Forwards raw incoming traffic securely via TCP/TLS."
  - type: "component"
    name: "AWS WAF"
    technology: "AWS WAF"
    description: "Inspects and filters incoming HTTP traffic for malicious requests."
  - type: "component"
    name: "AWS API Gateway"
    technology: "AWS API Gateway (HTTP API)"
    description: "Decapsulates requests and routes them to downstream internal services via VPC Link."
relationships:
  - source: "AWS Network Load Balancer"
    destination: "AWS WAF"
    description: "Forwards traffic for security inspection"
  - source: "AWS WAF"
    destination: "AWS API Gateway"
    description: "Forwards filtered requests"