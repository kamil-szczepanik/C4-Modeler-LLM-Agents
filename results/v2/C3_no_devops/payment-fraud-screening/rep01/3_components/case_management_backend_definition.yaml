level: component
scope: "Component diagram for the Case Management Backend container"
parentContainer:
  name: "Case Management Backend"
elements:
  - type: "component"
    name: "Case Query Controller"
    technology: "Java / Spring MVC"
    description: "Accesses API and dashboards, handling incoming HTTPS/REST requests."
  - type: "component"
    name: "Case Domain Service"
    technology: "Java / Spring"
    description: "Invokes business logic and forwards immutable audit logs."
  - type: "component"
    name: "Bulk Action Processor"
    technology: "Spring Batch / SQS Consumer"
    description: "Consumes bulk jobs asynchronously from the message queue."
  - type: "component"
    name: "Data Access Repository"
    technology: "Spring Data JPA"
    description: "Handles data access and persistence operations for case states."
  - type: "component"
    name: "Metrics Aggregator"
    technology: "Spring Boot / Redis cache"
    description: "Provides low-latency metric aggregation using in-memory caching."
  - type: "component"
    name: "React UI"
    technology: "React / AWS Cognito OAuth2/OIDC"
    description: "Frontend interface accessed via AWS Cognito for user authentication and authorization."
relationships:
  - source: "React UI"
    destination: "Case Query Controller"
    description: "Accesses API and dashboards [HTTPS/REST]"
  - source: "Case Query Controller"
    destination: "Case Domain Service"
    description: "Invokes business logic [Java Method Calls]"
  - source: "Case Domain Service"
    destination: "Relational Store"
    description: "Reads/writes case states [PostgreSQL/JDBC, TLS 1.3]"
  - source: "Bulk Action Processor"
    destination: "Message Queue"
    description: "Consumes bulk jobs [AWS SDK/SQS]"
  - source: "Case Domain Service"
    destination: "Tamper-Evident Storage"
    description: "Forwards immutable audit logs [AWS SDK/HTTPS]"