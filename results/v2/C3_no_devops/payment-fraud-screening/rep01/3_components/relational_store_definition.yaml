level: component
scope: "Component diagram for the Relational Store container"
parentContainer:
  name: "Relational Store"
elements:
  - type: "component"
    name: "Case Repository Component"
    technology: "Amazon RDS for PostgreSQL"
    description: "Persists and retrieves case state for managed case reviews."
  - type: "component"
    name: "Audit Ledger Index Component"
    technology: "Amazon RDS for PostgreSQL"
    description: "Indexes advanced audit logs for 7-year auditability."
  - type: "component"
    name: "Database Migration Manager"
    technology: "Flyway / TCP/IP"
    description: "Executes schema migrations supporting rule and model evolution."
relationships:
  - source: "Case Management Backend"
    destination: "Case Repository Component"
    description: "Persists and retrieves case state [PostgreSQL wire protocol (TCP/IP) via TLS 1.3]"
  - source: "Audit Logger"
    destination: "Audit Ledger Index Component"
    description: "Streams advanced audit logs [PostgreSQL wire protocol (TCP/IP) via TLS 1.3]"
  - source: "Database Migration Manager"
    destination: "Case Repository Component"
    description: "Executes schema migrations [Flyway / TCP/IP]"