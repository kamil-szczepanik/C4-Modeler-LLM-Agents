level: component
scope: "Component diagram for the Feature Store container"
parentContainer:
  name: "Feature Store"
elements:
  - type: "component"
    name: "Feature API Handler"
    technology: "Go, gRPC"
    description: "Provides low-latency real-time and historical feature data to power payment fraud screening."
  - type: "component"
    name: "Feature Aggregator"
    technology: "Go"
    description: "Aggregates real-time payment events and updates the feature cache."
  - type: "component"
    name: "Feature Cache"
    technology: "AWS ElastiCache for Redis"
    description: "In-memory store providing sub-millisecond retrieval and AES-256 encryption at rest."
  - type: "component"
    name: "Feature Backfill Worker"
    technology: "Go"
    description: "Queries baseline historical features and seeds historical aggregates."
  - type: "component"
    name: "Amazon RDS for PostgreSQL"
    technology: "Amazon RDS for PostgreSQL"
    description: "Durable relational storage for baseline historical features."
  - type: "component"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Message queue for processing real-time payment event streams."
  - type: "component"
    name: "Fraud Scoring Engine"
    technology: "External Container"
    description: "Consumes real-time features to score payment fraud."
relationships:
  - source: "Fraud Scoring Engine"
    destination: "Feature API Handler"
    description: "Fetches real-time features [gRPC / Low-latency TCP with mTLS]"
  - source: "Feature Aggregator"
    destination: "Feature Cache"
    description: "Updates real-time features [Redis RESP over TLS]"
  - source: "Feature API Handler"
    destination: "Feature Cache"
    description: "Reads feature values [Redis RESP over TLS]"
  - source: "Feature Backfill Worker"
    destination: "Amazon RDS for PostgreSQL"
    description: "Queries baseline historical features [JDBC over TLS]"
  - source: "Feature Backfill Worker"
    destination: "Feature Cache"
    description: "Seeds historical aggregates [Redis RESP over TLS]"
  - source: "Feature Aggregator"
    destination: "Amazon SQS"
    description: "Consumes real-time payment events [AWS SDK over HTTPS]"