level: component
scope: "Component diagram for the Audit Logger container"
parentContainer:
  name: "Audit Logger"
elements:
  - type: "component"
    name: "Queue Consumer Component"
    technology: "Go"
    description: "Polls payloads from the Message Queue using AWS SDK over HTTPS."
  - type: "component"
    name: "Canonical Formatter Component"
    technology: "Go"
    description: "Normalizes data using in-memory Go structs."
  - type: "component"
    name: "Storage Writer Component"
    technology: "Go"
    description: "Writes audit logs with Object Lock and signs payloads for cryptographic non-repudiation."
relationships:
  - source: "Queue Consumer Component"
    destination: "Message Queue"
    description: "Polls payloads [AWS SDK over HTTPS]"
  - source: "Queue Consumer Component"
    destination: "Canonical Formatter Component"
    description: "Normalizes data [In-memory Go structs]"
  - source: "Canonical Formatter Component"
    destination: "Storage Writer Component"
    description: "Passes formatted payload [In-memory function call]"
  - source: "Storage Writer Component"
    destination: "Tamper-Evident Storage"
    description: "Writes audit logs with Object Lock [HTTPS / S3 API]"
  - source: "Storage Writer Component"
    destination: "AWS KMS"
    description: "Signs payloads for cryptographic non-repudiation [AWS KMS API]"