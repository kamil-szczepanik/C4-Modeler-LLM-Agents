level: component
scope: "Component diagram for the Fraud Scoring Engine container"
parentContainer:
  name: "Fraud Scoring Engine"
elements:
  - type: "component"
    name: "API Router & Fallback Handler"
    technology: "Go net/http"
    description: "Invokes scoring evaluation and handles graceful outages to protect merchant revenue."
  - type: "component"
    name: "Feature Aggregator"
    technology: "Go concurrent routines"
    description: "Concurrently fetches features using Go channels and in-memory function calls."
  - type: "component"
    name: "Scoring Evaluator with Feature Contribution Formatter"
    technology: "Go in-memory engine"
    description: "Evaluates transactions in real time and generates explainable risk scores."
  - type: "component"
    name: "Audit Publisher"
    technology: "Go SDK with HMAC-SHA256"
    description: "Dispatches decision metadata and risk drivers securely using envelope encryption and tamper-evident signing."
  - type: "component"
    name: "AWS API Gateway / NLB"
    technology: "AWS Gateway / NLB"
    description: "External system that invokes scoring evaluation."
  - type: "component"
    name: "AWS ElastiCache for Redis"
    technology: "AWS ElastiCache for Redis"
    description: "External system serving as the Feature Store for real-time features."
  - type: "component"
    name: "Amazon SQS"
    technology: "Amazon SQS with AWS KMS"
    description: "External message queue for asynchronous audit logs."
relationships:
  - source: "AWS API Gateway / NLB"
    destination: "API Router & Fallback Handler"
    description: "Invokes scoring evaluation [mTLS / gRPC or HTTP/2]"
  - source: "API Router & Fallback Handler"
    destination: "Feature Aggregator"
    description: "Concurrently fetches features [Go channels / In-memory function calls]"
  - source: "Feature Aggregator"
    destination: "AWS ElastiCache for Redis"
    description: "Queries real-time features [Low-latency TCP / Redis Protocol]"
  - source: "Scoring Evaluator with Feature Contribution Formatter"
    destination: "Audit Publisher"
    description: "Dispatches decision metadata and risk drivers [Buffered Go channel]"
  - source: "Audit Publisher"
    destination: "Amazon SQS"
    description: "Publishes signed decision payloads [AWS SDK for Go over HTTPS]"