# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analyst, ML Engineer / Data Scientist, Finance / Operations Manager, Merchant / Merchant Success Manager, and Compliance / Risk Officer"
    description: "Internal users and stakeholders who manage fraud cases, review alerts, monitor models, and oversee compliance."
  - type: "externalSystem"
    name: "Payment Gateway / Core Processing Engine"
    description: "External system that processes payment authorizations and routes transaction traffic."
  - type: "externalSystem"
    name: "Card Schemes / Identity Providers"
    description: "External networks and identity services providing additional verification data."
  - type: "container"
    name: "AWS API Gateway / NLB"
    technology: "AWS API Gateway / Network Load Balancer"
    description: "Edge ingress and tokenization for PCI-DSS scope reduction."
  - type: "container"
    name: "Fraud Scoring Engine"
    technology: "Go"
    description: "High-performance microservice that evaluates authorization traffic for fraud within <50ms P99 latency."
  - type: "container"
    name: "Case Management Backend"
    technology: "Java / Spring Boot with React UI"
    description: "Robust backend and frontend for case management, merchant analytics, and review operations."
  - type: "container"
    name: "Audit Logger"
    technology: "AWS Lambda / Worker"
    description: "Processes queued decisions and writes tamper-evident audit logs."
  - type: "container"
    name: "Feature Store"
    technology: "AWS ElastiCache for Redis"
    description: "Low-latency feature store providing real-time data for model scoring."
  - type: "container"
    name: "Relational Store"
    technology: "Amazon RDS for PostgreSQL"
    description: "Relational persistence layer for case management data."
  - type: "container"
    name: "Tamper-Evident Storage"
    technology: "Amazon S3 with Object Lock in Compliance Mode"
    description: "WORM storage guaranteeing 7-year tamper-evident auditability."
  - type: "container"
    name: "Message Queue"
    technology: "Amazon SQS with AWS KMS encryption"
    description: "Asynchronous message decoupling layer to protect scoring latency."
relationships:
  - source: "Payment Gateway / Core Processing Engine"
    destination: "AWS API Gateway / NLB"
    description: "Routes authorization traffic"
    technology: "HTTPS"
  - source: "AWS API Gateway / NLB"
    destination: "Fraud Scoring Engine"
    description: "Invokes scoring evaluation"
    technology: "gRPC"
  - source: "Fraud Scoring Engine"
    destination: "Feature Store"
    description: "Queries real-time features"
    technology: "Low-latency TCP"
  - source: "Fraud Scoring Engine"
    destination: "Message Queue"
    description: "Asynchronously publishes decision payloads"
    technology: "Amazon SQS API"
  - source: "Message Queue"
    destination: "Audit Logger"
    description: "Consumes decision payloads"
    technology: "Event-driven consumption"
  - source: "Audit Logger"
    destination: "Tamper-Evident Storage"
    description: "Writes tamper-evident audit logs"
    technology: "AWS S3 API"
  - source: "Fraud Analyst, ML Engineer / Data Scientist, Finance / Operations Manager, Merchant / Merchant Success Manager, and Compliance / Risk Officer"
    destination: "Case Management Backend"
    description: "Accesses Analyst UI and case management"
    technology: "HTTPS/REST"
  - source: "Case Management Backend"
    destination: "Relational Store"
    description: "Persists and retrieves case state"
    technology: "PostgreSQL protocol"