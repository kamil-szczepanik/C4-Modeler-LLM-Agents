level: component
scope: "Component diagram for the Model & Rule Registry container"
parentContainer:
  name: "Model & Rule Registry"
elements:
  - type: "component"
    name: "Registry API Service"
    technology: "Python, FastAPI"
    description: "Exposes endpoints for Risk Managers to upload and approve rules via HTTPS/REST with MFA authentication."
  - type: "component"
    name: "Registry Core Engine"
    technology: "Python, FastAPI"
    description: "Executes validation and publishing workflows, interacts with storage, metadata catalogs, event dispatchers, and secrets management."
  - type: "component"
    name: "Metadata Catalog"
    technology: "PostgreSQL, AWS RDS"
    description: "Manages version lineage, metadata catalogs, and active-state pointers."
  - type: "component"
    name: "Artifact Storage"
    technology: "Amazon S3 with Object Lock"
    description: "Provides immutable, tamper-evident artifact storage to meet auditability constraints."
  - type: "component"
    name: "Event Dispatcher"
    technology: "Amazon SQS / EventBridge"
    description: "Publishes model release notifications."
  - type: "component"
    name: "Supporting Services"
    technology: "AWS Cognito, AWS Secrets Manager, AWS KMS"
    description: "Handles multi-factor authentication, code-signing certificates, and artifact encryption at rest."
relationships:
  - source: "Registry API Service"
    destination: "Registry Core Engine"
    description: "Invokes validation and publishing workflow via internal Python function calls"
  - source: "Registry Core Engine"
    destination: "Artifact Storage"
    description: "Writes immutable artifacts using S3 API"
  - source: "Registry Core Engine"
    destination: "Metadata Catalog"
    description: "Persists version lineage and active-state pointers via SQL/JDBC"
  - source: "Registry Core Engine"
    destination: "Event Dispatcher"
    description: "Publishes model release notifications via SQS API"
  - source: "Registry Core Engine"
    destination: "Supporting Services"
    description: "Retrieves code-signing certificates and secures data via AWS SDK"