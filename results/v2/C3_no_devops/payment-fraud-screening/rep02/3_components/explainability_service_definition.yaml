level: component
scope: "Component diagram for the Explainability Service container"
parentContainer:
  name: "Explainability Service"
elements:
  - type: "component"
    name: "Event Consumer Component"
    technology: "Python, Celery/FastAPI background worker"
    description: "Consumes scoring events asynchronously from Amazon SQS."
  - type: "component"
    name: "SHAP Calculator Component"
    technology: "Python, shap library + ONNX Runtime"
    description: "Calculates feature attribution weights for fraud scoring events."
  - type: "component"
    name: "Feature Formatter Component"
    technology: "Python"
    description: "Formats features into human-readable explanations and audit trails."
  - type: "component"
    name: "Audit & Indexing Dispatcher"
    technology: "Python, AWS SDK"
    description: "Dispatches explanations to storage and updates metadata databases."
  - type: "component"
    name: "Amazon SQS"
    technology: "AWS SQS"
    description: "Asynchronous message decoupling queue to protect P99 scoring latency."
  - type: "component"
    name: "Amazon S3 Object Lock"
    technology: "AWS S3"
    description: "Tamper-evident audit retention storage in Compliance Mode."
  - type: "component"
    name: "Feature Store & Metadata DB"
    technology: "PostgreSQL RDS"
    description: "Secure metadata storage and database access."
relationships:
  - source: "Event Consumer Component"
    destination: "Amazon SQS"
    description: "Consumes scoring events [Pull via AWS SDK]"
  - source: "Audit & Indexing Dispatcher"
    destination: "Amazon S3 Object Lock"
    description: "Writes tamper-readable explanations [HTTPS / AWS SDK]"
  - source: "Audit & Indexing Dispatcher"
    destination: "Feature Store & Metadata DB"
    description: "Updates explanation metadata [SQL over psycopg2]"