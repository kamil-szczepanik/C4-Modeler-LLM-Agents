level: component
scope: "Component diagram for the Security & Infrastructure Services container"
parentContainer:
  name: "Security & Infrastructure Services"
elements:
  - type: "component"
    name: "Authentication & Identity Component"
    technology: "AWS Cognito"
    description: "Manages user access with mandatory MFA to protect analysts and satisfy PCI-DSS."
  - type: "component"
    name: "Secrets & Vault Component"
    technology: "AWS Secrets Manager"
    description: "Stores and rotates database/service credentials every 90 days via Lambda templates."
  - type: "component"
    name: "Audit & Tamper-Evident Storage Component"
    technology: "Amazon S3 Object Lock (Compliance Mode) and Glacier Flexible Archive"
    description: "Guarantees tamper-evident 7-year audit storage and reduces long-term storage costs."
  - type: "component"
    name: "Asynchronous Ingestion Bus"
    technology: "Amazon SQS with AWS KMS SSE"
    description: "Decouples the scoring engine to preserve the <50ms latency constraint and provides secure message transport."
  - type: "component"
    name: "Monitoring & Alerting"
    technology: "AWS CloudTrail and Amazon EventBridge"
    description: "Triggers anomaly alerts and monitors system activities."
  - type: "component"
    name: "Fraud Analysts"
    technology: "HTTPS/TLS 1.3 [OIDC/OAuth2]"
    description: "External actors interacting with authentication."
  - type: "component"
    name: "Real-Time Scoring Engine"
    technology: "AWS SDK / IAM Signed SQS"
    description: "External scoring engine interacting with the ingestion bus and secrets."
  - type: "component"
    name: "Case Management Backend"
    technology: "Secure Local IPC"
    description: "Backend service consuming injected credentials."
  - type: "component"
    name: "Engineering Team"
    technology: "Amazon EventBridge"
    description: "Receives anomaly alerts."
relationships:
  - source: "Fraud Analysts"
    destination: "Authentication & Identity Component"
    description: "Authenticates via HTTPS/TLS 1.3 [OIDC/OAuth2]"
  - source: "Real-Time Scoring Engine"
    destination: "Asynchronous Ingestion Bus"
    description: "Publishes asynchronous audit logs [HTTPS/TLS 1.3, IAM Signed SQS]"
  - source: "Asynchronous Ingestion Bus"
    destination: "Audit & Tamper-Evident Storage Component"
    description: "Persists immutable transaction payloads [AWS SDK]"
  - source: "Secrets & Vault Component"
    destination: "Real-Time Scoring Engine & Case Management Backend"
    description: "Injects credentials [Secure Local IPC]"
  - source: "Monitoring & Alerting"
    destination: "Engineering Team"
    description: "Triggers anomaly alerts [Amazon EventBridge]"