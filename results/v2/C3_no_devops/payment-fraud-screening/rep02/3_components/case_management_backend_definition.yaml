# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Case Management Backend container"
parentContainer:
  name: "Case Management Backend"
elements:
  - type: "component"
    name: "Case API Router"
    technology: "NestJS / TypeScript"
    description: "Enforces JWT validation, RBAC, rate limiting, and input sanitization for incoming API requests."
  - type: "component"
    name: "Data Masking Interceptor"
    technology: "NestJS Interceptor / TypeScript"
    description: "Strips Primary Account Numbers (PAN) to ensure analysts never see full card data."
  - type: "component"
    name: "Case Workflow Engine"
    technology: "NestJS Service / TypeScript"
    description: "Manages state transitions, bulk resolutions, and analyst SLA tracking."
  - type: "component"
    name: "Audit & Compliance Exporter"
    technology: "NestJS Service / TypeScript"
    description: "Generates cryptographically signed compliance extracts for 7-year auditability."
relationships:
  - source: "Case Management Backend"
    destination: "Case API Router"
    description: "Routes incoming API requests through [HTTPS / REST, AWS Cognito OAuth 2.0 / OIDC]"
  - source: "Case API Router"
    destination: "Data Masking Interceptor"
    description: "Passes sanitized request data for security enforcement"
  - source: "Data Masking Interceptor"
    destination: "Case Workflow Engine"
    description: "Forwards masked payload to workflow logic"
  - source: "Case Workflow Engine"
    destination: "Feature Store & Metadata DB"
    description: "Persists case states, analyst notes, and SLA timestamps [TCP / PostgreSQL Wire Protocol]"
  - source: "Audit & Compliance Exporter"
    destination: "Amazon S3 Object Lock"
    description: "Reads tamper-evident decision logs [HTTPS / AWS SDK]"
  - source: "Audit & Compliance Exporter"
    destination: "Regulators / Audit & Compliance System"
    description: "Pushes cryptographically signed compliance extracts [HTTPS / REST]"