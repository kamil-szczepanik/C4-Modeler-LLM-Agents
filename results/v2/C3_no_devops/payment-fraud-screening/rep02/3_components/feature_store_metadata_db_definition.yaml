level: component
scope: "Component diagram for the Feature Store & Metadata DB container"
parentContainer:
  name: "Feature Store & Metadata DB"
elements:
  - type: "component"
    name: "Redis Feature Cache Component"
    technology: "AWS ElastiCache Redis"
    description: "Provides sub-millisecond in-memory feature retrieval for low-latency scoring."
  - type: "component"
    name: "PostgreSQL Transaction & Metadata Store Component"
    technology: "PostgreSQL (RDS), AWS KMS, pgcrypto"
    description: "Manages relational metadata, case mappings, and structured audit logs with AES-256 storage encryption."
  - type: "component"
    name: "Audit Ledger Component"
    technology: "SHA-256 Cryptographic Chaining, AWS S3 Object Lock"
    description: "Ensures tamper-evident audit logging for 7-year retention via immutable WORM storage."
  - type: "component"
    name: "Feature Ingestion Worker Component"
    technology: "Backend Worker Service"
    description: "Updates relational metadata and ingests new features into the storage layer."
  - type: "component"
    name: "Real-Time Scoring Engine"
    technology: "External System / Engine"
    description: "Retrieves features via TCP/Redis Protocol."
  - type: "component"
    name: "Amazon S3 Object Lock"
    technology: "AWS S3"
    description: "Guarantees immutable, write-once-read-many (WORM) long-term storage."
  - type: "component"
    name: "Case Management Backend"
    technology: "Backend Service"
    description: "Queries case-to-feature snapshots via TCP/PostgreSQL Protocol."
relationships:
  - source: "Real-Time Scoring Engine"
    destination: "Redis Feature Cache Component"
    description: "Retrieves features via TCP/Redis Protocol"
  - source: "Feature Ingestion Worker Component"
    destination: "PostgreSQL Transaction & Metadata Store Component"
    description: "Updates relational metadata via TCP/PostgreSQL Protocol"
  - source: "Audit Ledger Component"
    destination: "Amazon S3 Object Lock"
    description: "Syncs immutable logs via AWS SDK"
  - source: "Case Management Backend"
    destination: "PostgreSQL Transaction & Metadata Store Component"
    description: "Queries case-to-feature snapshots via TCP/PostgreSQL Protocol"