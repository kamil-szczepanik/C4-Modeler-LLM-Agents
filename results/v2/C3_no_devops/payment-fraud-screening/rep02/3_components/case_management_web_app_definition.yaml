level: component
scope: "Component diagram for the Case Management Web App container"
parentContainer:
  name: "Case Management Web App"
elements:
  - type: "component"
    name: "Authentication & Session Manager Component"
    technology: "TypeScript, AWS Amplify / Cognito SDK"
    description: "Handles OIDC token exchange, authentication, RBAC, and session management via HTTPS."
  - type: "component"
    name: "Case Queue & Review Dashboard Component"
    technology: "React, TanStack Table"
    description: "Provides high-throughput case feeds and review interface for fraud analysts and risk managers."
  - type: "component"
    name: "Audit & Reporting Portal Component"
    technology: "React, Recharts"
    description: "Provides audit and reporting visualizations for compliance and risk tracking."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios/Fetch Wrapper"
    description: "Implements centralized API interception and secure token injection for backend communication."
relationships:
  - source: "Authentication & Session Manager Component"
    destination: "AWS Cognito"
    description: "Handles OIDC token exchange and authentication via HTTPS"
  - source: "Case Queue & Review Dashboard Component"
    destination: "API Client Layer"
    description: "Sends API requests through"
  - source: "Audit & Reporting Portal Component"
    destination: "API Client Layer"
    description: "Sends API requests through"
  - source: "API Client Layer"
    destination: "Case Management Backend"
    description: "Sends API requests via HTTPS / REST using JWTs"
  - source: "Case Management Web App"
    destination: "Amazon S3 / CloudFront"
    description: "Hosted and delivered securely via HTTPS"