# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Real-Time Scoring Engine container"
parentContainer:
  name: "Real-Time Scoring Engine"
elements:
  - type: "component"
    name: "gRPC Inbound Listener"
    technology: "Tonic / Rust"
    description: "Handling incoming screening requests."
  - type: "component"
    name: "Decision Logic Coordinator"
    technology: "Rust"
    description: "Orchestrates execution flow, rules, and circuit-breaker fallback logic."
  - type: "component"
    name: "Feature Assembler"
    technology: "Async Redis client over TCP / Rust"
    description: "Retrieves features using async Redis client over TCP."
  - type: "component"
    name: "Model Evaluator"
    technology: "ONNX Runtime with C-bindings (`ort` crate) / Rust"
    description: "Executes ONNX Runtime models via C-bindings with memory zeroization."
  - type: "component"
    name: "Audit Dispatcher"
    technology: "AWS SDK / Rust"
    description: "Signs SQS audit payloads via HMAC-SHA256 and dispatches logs."
  - type: "component"
    name: "API Gateway / Ingestion Service"
    technology: "External Gateway"
    description: "Forwards screening requests via gRPC with mTLS (TLS 1.3)."
  - type: "component"
    name: "Explainability Service"
    technology: "External Service"
    description: "Provides SHAP values."
  - type: "component"
    name: "Amazon SQS"
    technology: "AWS SQS"
    description: "Publishes tamper-evident audit logs."
relationships:
  - source: "API Gateway / Ingestion Service"
    destination: "gRPC Inbound Listener"
    description: "Forwards screening requests via gRPC with mTLS (TLS 1.3)"
  - source: "gRPC Inbound Listener"
    destination: "Decision Logic Coordinator"
    description: "Passes parsed screening requests"
  - source: "Decision Logic Coordinator"
    destination: "Feature Assembler"
    description: "Retrieves features via Async TCP (Redis)"
  - source: "Decision Logic Coordinator"
    destination: "Model Evaluator"
    description: "Evaluates models via FFI / C-bindings"
  - source: "Decision Logic Coordinator"
    destination: "Explainability Service"
    description: "Requests SHAP values via gRPC / REST"
  - source: "Decision Logic Coordinator"
    destination: "Audit Dispatcher"
    description: "Triggers audit log dispatch"
  - source: "Audit Dispatcher"
    destination: "Amazon SQS"
    description: "Publishes tamper-evident audit logs via AWS SDK"