level: component
scope: "Component diagram for the API Gateway / Ingestion Service container"
parentContainer:
  name: "API Gateway / Ingestion Service"
elements:
  - type: "component"
    name: "Load Balancer & Perimeter Controller"
    technology: "AWS ALB, AWS WAF"
    description: "Enforces perimeter security, rate limiting, and distributes incoming HTTPS traffic with inbound mTLS."
  - type: "component"
    name: "Ingestion Router & API Handler"
    technology: "Go, Fiber/Chi Router"
    description: "Processes incoming payment authorization requests, handles routing, and executes high-concurrency request validation."
  - type: "component"
    name: "Telemetry & Metrics Publisher"
    technology: "OpenTelemetry, AWS CloudWatch"
    description: "Emits telemetry metrics and traces for real-time monitoring and observability."
relationships:
  - source: "Load Balancer & Perimeter Controller"
    destination: "Ingestion Router & API Handler"
    description: "Forwards verified HTTPS requests [HTTPS / JSON, inbound mTLS]"
  - source: "Ingestion Router & API Handler"
    destination: "Telemetry & Metrics Publisher"
    description: "Emits OpenTelemetry metrics and traces [OTLP / HTTPS]"