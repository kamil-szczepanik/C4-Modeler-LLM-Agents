level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analysts & Risk Managers"
    description: "Human users reviewing cases and managing models."
  - type: "externalSystem"
    name: "Payment Gateway / Core Processing Platform & Card Networks"
    description: "External systems submitting authorizations and receiving decisions."
  - type: "container"
    name: "API Gateway / Ingestion Service"
    technology: "Go, AWS ALB"
    description: "Handles 3,000 req/sec incoming payment screening authorizations."
  - type: "container"
    name: "Real-Time Scoring Engine"
    technology: "Python, FastAPI, ONNX Runtime"
    description: "Evaluates card-not-present payment authorizations for fraud at scale."
  - type: "container"
    name: "Explainability Service"
    technology: "Python, FastAPI"
    description: "Generates SHAP values for model explainability."
  - type: "container"
    name: "Case Management Backend"
    technology: "Node.js, Go"
    description: "Provides backend services for fraud case management and analyst tools."
  - type: "container"
    name: "Case Management Web App"
    technology: "React SPA, S3, CloudFront"
    description: "Web interface for analysts and risk managers to review cases."
  - type: "container"
    name: "Model & Rule Registry"
    technology: "Amazon S3"
    description: "Stores models, rules, and artifacts."
  - type: "container"
    name: "Feature Store & Metadata DB"
    technology: "PostgreSQL (RDS), AWS ElastiCache Redis"
    description: "Provides real-time features and relational metadata/audit logs."
  - type: "container"
    name: "Security & Infrastructure Services"
    technology: "AWS Cognito, AWS Secrets Manager, Amazon S3 Object Lock, Amazon SQS"
    description: "Handles authentication, secrets management, asynchronous audit logging, and secure storage."
relationships:
  - source: "Payment Gateway / Core Processing Platform & Card Networks"
    destination: "API Gateway / Ingestion Service"
    description: "Sends payment authorization requests for fraud screening"
    technology: "HTTPS / JSON"
  - source: "Fraud Analysts & Risk Managers"
    destination: "Case Management Web App"
    description: "Accesses case management UI to review cases and manage models"
    technology: "HTTPS"
  - source: "Case Management Web App"
    destination: "Case Management Backend"
    description: "Sends API requests for case management and review workflows"
    technology: "HTTPS / REST or GraphQL, AWS Cognito OAuth 2.0 / OIDC"
  - source: "API Gateway / Ingestion Service"
    destination: "Real-Time Scoring Engine"
    description: "Forwards screening requests for low-latency scoring"
    technology: "gRPC with mTLS"
  - source: "Real-Time Scoring Engine"
    destination: "Feature Store & Metadata DB"
    description: "Retrieves features and performs offline logging"
    technology: "TCP (Redis and PostgreSQL)"
  - source: "Real-Time Scoring Engine"
    destination: "Model & Rule Registry"
    description: "Loads models and rules"
    technology: "S3 API"
  - source: "Real-Time Scoring Engine"
    destination: "Explainability Service"
    description: "Requests SHAP values for decisions"
    technology: "gRPC / REST"
  - source: "Real-Time Scoring Engine"
    destination: "Security & Infrastructure Services"
    description: "Publishes asynchronous audit logs"
    technology: "Amazon SQS"
  - source: "Security & Infrastructure Services"
    destination: "Feature Store & Metadata DB"
    description: "Stores immutable audit logs"
    technology: "S3 Object Lock"