level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Evaluates card-not-present payment authorizations for fraud in under 50 milliseconds while providing a secure case management interface for analysts within a PCI-DSS Level 1 compliance framework."
elements:
  - type: "person"
    name: "Fraud Analysts & Risk Managers"
    description: "Users who access the secure case management interface to review fraud decisions and manage cases."
  - type: "externalSystem"
    name: "Payment Gateway / Core Processing Platform"
    description: "External system that sends authorization requests to the fraud screening system."
  - type: "externalSystem"
    name: "Card Networks & Issuers"
    description: "External systems that receive final routing decisions from the fraud screening system."
  - type: "externalSystem"
    name: "Regulators / Audit & Compliance System"
    description: "External systems and entities that benefit from tamper-evident, 7-year immutable audit retention."
relationships:
  - source: "Payment Gateway / Core Processing Platform"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Sends authorization requests for fraud evaluation"
    technology: "gRPC/REST over TLS 1.3"
  - source: "Fraud Analysts & Risk Managers"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Accesses Case Management UI to review and manage fraud cases"
    technology: "HTTPS with OAuth2/OIDC IAM"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Card Networks & Issuers"
    description: "Routes authorization decisions"
    technology: "TLS"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Regulators / Audit & Compliance System"
    description: "Streams immutable audit logs and analytics"
    technology: "AWS S3 Object Lock, AWS KMS, AWS EventBridge/Kinesis"