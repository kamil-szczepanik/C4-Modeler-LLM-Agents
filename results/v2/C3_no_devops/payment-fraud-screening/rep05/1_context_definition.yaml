level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Processes card-not-present authorizations for a mid-size payment processor to detect fraud in real time while providing a secure case management interface for analysts."
elements:
  - type: "person"
    name: "Fraud Analyst & Risk/Compliance Officer"
    description: "Internal users who access the secure case management interface for fraud review and compliance tasks."
  - type: "person"
    name: "Users"
    description: "Enterprise users authenticating via Identity Provider."
  - type: "externalSystem"
    name: "Payment Processor Systems"
    description: "External API Consumer sending card-not-present authorizations."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "AWS IAM / OIDC providing Enterprise SSO and hardware-token MFA."
  - type: "externalSystem"
    name: "Model Registry / Feature Store"
    description: "AWS SageMaker / S3 with AWS Signer providing dynamic rule and model fetching."
  - type: "externalSystem"
    name: "Immutable Audit Storage"
    description: "AWS S3 Object Lock with AWS KMS CMK providing WORM-compliant decision logging."
relationships:
  - source: "Payment Processor Systems"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Synchronous authorization scoring at 3,000 TPS"
    technology: "HTTPS / gRPC"
  - source: "Fraud Analyst & Risk/Compliance Officer"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Secure browser access for case management and review"
    technology: "HTTPS"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Model Registry / Feature Store"
    description: "Zero-downtime dynamic rule and model fetching"
    technology: "HTTPS / S3 API"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Immutable Audit Storage"
    description: "WORM-compliant decision logging"
    technology: "AWS SDK / S3 API"
  - source: "Users"
    destination: "Identity Provider"
    description: "Enterprise SSO and hardware-token MFA"
    technology: "HTTPS / OpenID Connect"