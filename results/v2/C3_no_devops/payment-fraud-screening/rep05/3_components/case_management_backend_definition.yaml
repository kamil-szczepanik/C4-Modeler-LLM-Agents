level: component
scope: "Component diagram for the Case Management Backend container"
parentContainer:
  name: "Case Management Backend"
elements:
  - type: "component"
    name: "API Router / Controller"
    technology: "NestJS Controller (TypeScript)"
    description: "Handles REST requests and JWT validation."
  - type: "component"
    name: "Case Service"
    technology: "NestJS Service (TypeScript)"
    description: "Implements case lifecycle logic, bulk actions, and SLA-based routing."
  - type: "component"
    name: "SLA Worker / Scheduler Component"
    technology: "NestJS Scheduler (@nestjs/schedule)"
    description: "Manages background timers and auto-escalations."
  - type: "component"
    name: "Audit Logger Component"
    technology: "NestJS Component (TypeScript)"
    description: "Records cryptographically signed analyst actions."
  - type: "component"
    name: "Data Access Layer"
    technology: "ORM (TypeScript)"
    description: "Utilizes an ORM to manage relational data."
  - type: "component"
    name: "Case Management UI"
    technology: "Frontend Application"
    description: "Sends API requests for case operations."
  - type: "component"
    name: "Identity Provider"
    technology: "External IAM Service"
    description: "Validates JWTs and enforces RBAC."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Managed Relational Database with AES-256 encryption"
    description: "Reads and writes case state and search indexes."
  - type: "component"
    name: "Immutable Audit Storage"
    technology: "Secure Storage Target"
    description: "Writes signed analyst action logs."
relationships:
  - source: "Case Management UI"
    destination: "API Router / Controller"
    description: "Sends API requests for case operations [HTTPS/REST, TLS 1.3]"
  - source: "API Router / Controller"
    destination: "Identity Provider"
    description: "Validates JWTs and enforces RBAC [HTTPS/REST]"
  - source: "Case Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes case state and search indexes [TCP/TLS, Port 5432]"
  - source: "Audit Logger Component"
    destination: "Immutable Audit Storage"
    description: "Writes signed analyst action logs [HTTPS/REST]"