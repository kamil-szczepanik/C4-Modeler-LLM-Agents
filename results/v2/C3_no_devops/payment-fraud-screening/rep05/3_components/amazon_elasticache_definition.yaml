level: component
scope: "Component diagram for the Amazon ElastiCache container"
parentContainer:
  name: "Amazon ElastiCache"
elements:
  - type: "component"
    name: "In-Memory Feature Store"
    technology: "Redis OSS, cache.m6g.large, volatile-lru"
    description: "Stores features in-memory for sub-millisecond retrieval to meet P99 latency requirements and controls memory usage."
  - type: "component"
    name: "Security & Encryption Module"
    technology: "TLS 1.3, Redis AUTH, AWS KMS"
    description: "Enforces data-in-transit security via TLS and Redis AUTH tokens, and encrypts data at rest using AWS KMS for PCI-DSS Level 1 compliance."
  - type: "component"
    name: "Telemetry & Logging Emitter"
    technology: "AWS CloudWatch"
    description: "Emits performance metrics and slow logs to monitor cluster health and operational performance."
relationships:
  - source: "Scoring Engine Container"
    destination: "In-Memory Feature Store"
    description: "Performs feature lookups via TCP/Redis with TLS 1.3 and Redis AUTH tokens."
  - source: "Model Registry / Feature Store"
    destination: "In-Memory Feature Store"
    description: "Synchronizes features via asynchronous worker over TCP/Redis."
  - source: "In-Memory Feature Store"
    destination: "AWS CloudWatch & SNS"
    description: "Emits performance metrics and slow logs."