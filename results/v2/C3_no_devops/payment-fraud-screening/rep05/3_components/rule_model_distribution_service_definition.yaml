level: component
scope: "Component diagram for the Rule & Model Distribution Service container"
parentContainer:
  name: "Rule & Model Distribution Service"
elements:
  - type: "component"
    name: "Model Validation & Compilation Worker"
    technology: "Python/Pydantic"
    description: "Validates and compiles models due to strong typing and schema enforcement, and stores signed artifacts in Amazon S3."
  - type: "component"
    name: "Distribution Coordinator"
    technology: "Go"
    description: "Triggers hot-reloading in the scoring engine container for high performance and low resource consumption."
  - type: "component"
    name: "Distribution API"
    technology: "REST/JSON"
    description: "Receives publish requests from the Model Registry."
relationships:
  - source: "Model Validation & Compilation Worker"
    destination: "Amazon S3"
    description: "Stores signed artifacts [HTTPS/TLS]"
  - source: "Distribution Coordinator"
    destination: "Scoring Engine Container"
    description: "Triggers hot-reloading [gRPC/AWS SQS]"
  - source: "Distribution API"
    destination: "Model Registry"
    description: "Receives publish requests [REST/JSON]"