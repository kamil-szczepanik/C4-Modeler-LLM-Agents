level: component
scope: "Component diagram for the Scoring Engine Container container"
parentContainer:
  name: "Scoring Engine Container"
elements:
  - type: "component"
    name: "Wasm Execution Runtime"
    technology: "Rust, WebAssembly"
    description: "Executes cryptographically verified Wasm rules and scoring models with zero downtime."
  - type: "component"
    name: "Feature Fetcher"
    technology: "Rust, TLS-encrypted TCP"
    description: "Retrieves real-time transaction features from Amazon ElastiCache Redis."
  - type: "component"
    name: "Audit Dispatcher"
    technology: "Rust, HTTPS/REST"
    description: "Asynchronously flushes signed decision and explainability payloads to immutable audit storage."
relationships:
  - source: "Wasm Execution Runtime"
    destination: "Feature Fetcher"
    description: "Requests transaction features [TLS-encrypted TCP/Redis]"
  - source: "Wasm Execution Runtime"
    destination: "Audit Dispatcher"
    description: "Sends signed decision payloads for async persistence [HTTPS/REST]"