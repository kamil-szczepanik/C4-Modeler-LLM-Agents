# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Audit Writer Sidecar / Async Worker container"
parentContainer:
  name: "Audit Writer Sidecar / Async Worker"
elements:
  - type: "component"
    name: "Audit Event Consumer"
    technology: "Go"
    description: "Consumes high-throughput, low-latency audit events via local IPC / UNIX Domain Socket from the Scoring Engine."
  - type: "component"
    name: "Tamper-Evident Formatter & Signer"
    technology: "Go, Ed25519, AWS KMS"
    description: "Formats audit events and performs cryptographic signing using envelope encryption via AWS KMS."
  - type: "component"
    name: "Immutable Storage Client"
    technology: "HTTPS / TLS 1.3, AWS SDK"
    description: "Sends signed, tamper-evident audit logs to write-once, append-only immutable storage."
  - type: "component"
    name: "DLQ & Metric Forwarder"
    technology: "AWS SDK"
    description: "Forwards failed messages to Dead Letter Queues and pushes operational metrics to CloudWatch."
  - type: "component"
    name: "Local Ring Buffer & Persistence Manager"
    technology: "Go, mmap"
    description: "Provides local persistence and buffering using memory-mapped files to guarantee durability during outages."
relationships:
  - source: "Audit Event Consumer"
    destination: "Tamper-Evident Formatter & Signer"
    description: "Passes raw consumed audit events for formatting and cryptographic signing"
  - source: "Tamper-Evident Formatter & Signer"
    destination: "Immutable Storage Client"
    description: "Sends signed tamper-evident records for persistence"
  - source: "Tamper-Evident Formatter & Signer"
    destination: "Local Ring Buffer & Persistence Manager"
    description: "Backs up uncommitted events locally using mmap"
  - source: "Immutable Storage Client"
    destination: "DLQ & Metric Forwarder"
    description: "Forwards failed write requests to DLQ on transmission errors"