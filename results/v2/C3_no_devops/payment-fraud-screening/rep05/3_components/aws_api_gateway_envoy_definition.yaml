level: component
scope: "Component diagram for the AWS API Gateway / Envoy container"
parentContainer:
  name: "AWS API Gateway / Envoy"
elements:
  - type: "component"
    name: "Edge Router & Ingestion Handler"
    technology: "AWS API Gateway / Envoy Proxy"
    description: "Handles high-throughput secure edge routing, TLS termination, and ingress traffic validation."
  - type: "component"
    name: "Wasm Tokenization Engine"
    technology: "WebAssembly (Wasm)"
    description: "Tokenizes sensitive payment card data and strips PII before internal routing for PCI-DSS compliance."
relationships:
  - source: "Edge Router & Ingestion Handler"
    destination: "Wasm Tokenization Engine"
    description: "Inspects and tokenizes incoming payment authorizations [Wasm Filter]"
  - source: "Wasm Tokenization Engine"
    destination: "Scoring Engine Container"
    description: "Routes tokenized scoring requests [gRPC over internal VPC mTLS]"