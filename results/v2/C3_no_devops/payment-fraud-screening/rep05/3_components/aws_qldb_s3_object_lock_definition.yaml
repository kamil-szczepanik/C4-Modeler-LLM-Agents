level: component
scope: "Component diagram for the AWS QLDB / S3 Object Lock container"
parentContainer:
  name: "AWS QLDB / S3 Object Lock"
elements:
  - type: "component"
    name: "Audit Ingestion Service"
    technology: "AWS Lambda (Go)"
    description: "Receives batched decision logs, storing structured metadata in QLDB and raw payloads in S3."
  - type: "component"
    name: "QLDB Journal Ledger"
    technology: "Amazon QLDB"
    description: "Stores structured decision metadata, model versions, and cryptographic inclusion proofs."
  - type: "component"
    name: "S3 Compliance Vault"
    technology: "Amazon S3 with Object Lock (Compliance Mode)"
    description: "Stores raw payload inputs with WORM enforcement and lifecycle rules."
  - type: "component"
    name: "AWS KMS"
    technology: "AWS KMS"
    description: "Manages Customer Managed Keys (CMKs) for data encryption at rest."
  - type: "component"
    name: "Risk & Compliance Officers / Fraud Analysts"
    technology: "External User Persona"
    description: "Accesses audit logs and compliance reports for verification."
relationships:
  - source: "Audit Ingestion Service"
    destination: "QLDB Journal Ledger"
    description: "Stores structured journal entries using QLDB Driver (DQL/PartiQL)."
  - source: "Audit Ingestion Service"
    destination: "S3 Compliance Vault"
    description: "Stores raw payloads using AWS SDK (HTTPS) over AWS PrivateLink."
  - source: "Audit Ingestion Service"
    destination: "AWS KMS"
    description: "Encrypts and decrypts data via AWS SDK (HTTPS)."
  - source: "Risk & Compliance Officers / Fraud Analysts"
    destination: "QLDB Journal Ledger"
    description: "Executes cryptographic verification via AWS Console / AWS SDK (HTTPS)."
  - source: "Risk & Compliance Officers / Fraud Analysts"
    destination: "S3 Compliance Vault"
    description: "Executes compliance audits via AWS Console / AWS SDK (HTTPS)."