level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analysts and Merchant Risk Managers"
    description: "Internal users who access the secure case management interface for fraud review and compliance tasks."
  - type: "externalSystem"
    name: "Payment Processor"
    description: "External API Consumer sending card-not-present authorizations."
  - type: "externalSystem"
    name: "Model Registry / Feature Store"
    description: "AWS SageMaker / S3 with AWS Signer providing dynamic rule and model fetching."
  - type: "container"
    name: "AWS API Gateway / Envoy"
    technology: "AWS API Gateway / Envoy"
    description: "Ingestion layer handling incoming payment authorizations securely."
  - type: "container"
    name: "Scoring Engine Container"
    technology: "Go/Rust on AWS ECS Fargate"
    description: "Processes payment scoring to guarantee sub-50ms P99 decision latency."
  - type: "container"
    name: "Case Management Backend"
    technology: "Node.js/Python on ECS Fargate"
    description: "Manages analyst reviews and case management APIs."
  - type: "container"
    name: "Case Management UI"
    technology: "React on AWS S3 + CloudFront"
    description: "Delivers zero-infrastructure-overhead frontend for case management."
  - type: "container"
    name: "Rule & Model Distribution Service"
    technology: "AWS SQS + S3"
    description: "Distributes rules and models for zero-downtime config updates."
  - type: "container"
    name: "Audit Writer Sidecar / Async Worker"
    technology: "Go/Lambda"
    description: "Handles asynchronous event streaming and decision logging."
  - type: "container"
    name: "Amazon ElastiCache"
    technology: "Redis Feature Store"
    description: "Enables low-latency in-memory feature lookups."
  - type: "container"
    name: "AWS QLDB / S3 Object Lock"
    technology: "AWS QLDB / S3 Object Lock"
    description: "Immutable Audit Storage providing tamper-evident storage to satisfy 7-year auditability requirements."
relationships:
  - source: "Payment Processor"
    destination: "AWS API Gateway / Envoy"
    description: "Sends card-not-present authorizations for screening"
    technology: "HTTPS/gRPC"
  - source: "Fraud Analysts and Merchant Risk Managers"
    destination: "Case Management UI"
    description: "Accesses secure case management interface for fraud review"
    technology: "HTTPS"
  - source: "Case Management UI"
    destination: "Case Management Backend"
    description: "Sends API requests for case management operations"
    technology: "HTTPS/REST"
  - source: "Scoring Engine Container"
    destination: "Amazon ElastiCache"
    description: "Performs feature lookups via VPC peering"
    technology: "TCP/Redis"
  - source: "Scoring Engine Container"
    destination: "AWS QLDB / S3 Object Lock"
    description: "Sends asynchronous event streaming for decision logging"
    technology: "Amazon SQS"
  - source: "Rule & Model Distribution Service"
    destination: "Scoring Engine Container"
    description: "Performs zero-downtime config updates"
    technology: "gRPC/S3"