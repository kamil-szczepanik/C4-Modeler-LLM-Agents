level: component
scope: "Component diagram for the Circulation Service container"
parentContainer:
  name: "Circulation Service"
elements:
  - type: "component"
    name: "Circulation API Controller"
    technology: "Express.js"
    description: "Routes circulation requests received from the API Gateway."
  - type: "component"
    name: "Loan Management Engine"
    technology: "TypeScript / Domain Services with BullMQ"
    description: "Handles strongly typed domain logic for loans and automated grace periods."
  - type: "component"
    name: "Fine & Payment Manager"
    technology: "Node.js Service with Payment Webhook Handler"
    description: "Processes fines and handles payment webhook interactions."
  - type: "component"
    name: "Event Publisher"
    technology: "KafkaJS Client"
    description: "Publishes check-out and reminder events to the event broker."
  - type: "component"
    name: "Data Access Repository"
    technology: "Prisma ORM"
    description: "Persists circulation data ensuring secure data access and EU residency compliance."
  - type: "component"
    name: "Notification Scheduler Component"
    technology: "node-cron / BullMQ"
    description: "Manages background scheduling for automated notifications."
relationships:
  - source: "API Gateway"
    destination: "Circulation API Controller"
    description: "Routes circulation requests [mTLS via Istio Service Mesh]"
  - source: "Data Access Repository"
    destination: "PostgreSQL Database"
    description: "Persists circulation data [AES-256 encryption, EU-hosted]"
  - source: "Event Publisher"
    destination: "Apache Kafka Event Broker"
    description: "Publishes check-out and reminder events [TLS-encrypted event streams]"
  - source: "Fine & Payment Manager"
    destination: "Third-Party Payment Gateway"
    description: "Processes fines [REST/HTTPS with mTLS and HMAC webhook verification]"