level: component
scope: "Component diagram for the Catalogue Service container"
parentContainer:
  name: "Catalogue Service"
elements:
  - type: "component"
    name: "Item Controller & Service"
    technology: "Java / Spring Boot, Spring Data JPA, JDBC"
    description: "Manages physical and digital item cataloguing, reading and writing catalogue data to the PostgreSQL Database with AES-256 encryption."
  - type: "component"
    name: "Search & Indexing Engine"
    technology: "Java / Spring Boot, Spring Data Elasticsearch"
    description: "Indexes search data and interacts with Elasticsearch to ensure high-performance search capabilities."
  - type: "component"
    name: "Facet & Recommendation Service"
    technology: "Java / Spring Boot, Elasticsearch Aggregations API"
    description: "Powers faceted navigation and recommendations using Elasticsearch with AES-256 encryption."
  - type: "component"
    name: "Digital Content Adapter"
    technology: "Java / Spring Boot, Spring WebClient, Resilience4j"
    description: "Fulfills digital items using REST/LTI with circuit breakers for external digital content repositories."
  - type: "component"
    name: "Event Publisher"
    technology: "Java / Spring Boot, Spring Cloud Stream"
    description: "Publishes domain events to the Event Broker over TLS."
relationships:
  - source: "Item Controller & Service"
    destination: "PostgreSQL Database"
    description: "Reads and writes catalogue data using Spring Data JPA and JDBC with AES-256 encryption"
  - source: "Search & Indexing Engine"
    destination: "Elasticsearch"
    description: "Indexes search data using Spring Data Elasticsearch with AES-256 encryption"
  - source: "Facet & Recommendation Service"
    destination: "Elasticsearch"
    description: "Powers faceted navigation using Elasticsearch Aggregations API with AES-256 encryption"
  - source: "Event Publisher"
    destination: "Event Broker"
    description: "Publishes domain events via Spring Cloud Stream over TLS"
  - source: "Digital Content Adapter"
    destination: "Digital Content Repositories"
    description: "Fulfills digital items using Spring WebClient over REST/LTI with Resilience4j circuit breakers"