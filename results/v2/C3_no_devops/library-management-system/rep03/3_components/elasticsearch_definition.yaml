level: component
scope: "Component diagram for the Elasticsearch container"
parentContainer:
  name: "Elasticsearch"
elements:
  - type: "component"
    name: "Search Engine Core"
    technology: "Lucene"
    description: "Core search engine capability executing indexing and searching operations."
  - type: "component"
    name: "Inverted Index & Document Store"
    technology: "Elasticsearch Storage"
    description: "Stores documents and maintains inverted indices for high-performance retrieval."
  - type: "component"
    name: "REST API / Query DSL Interface"
    technology: "HTTP / JSON REST API"
    description: "Provides query DSL interface and REST endpoints for catalog and search operations."
  - type: "component"
    name: "Search Analytics & Logging Engine"
    technology: "Elasticsearch Analytics"
    description: "Collects and exports search analytics, metrics, and logs."
relationships:
  - source: "Catalogue Service"
    destination: "REST API / Query DSL Interface"
    description: "Executes search & indexing requests over HTTPS with mTLS (TLS 1.3)"
  - source: "Search Analytics & Logging Engine"
    destination: "Event Broker"
    description: "Exports metrics via Filebeat / OpenTelemetry over TLS 1.3 with mTLS"