level: component
scope: "Component diagram for the Librarian Back-office container"
parentContainer:
  name: "Librarian Back-office"
elements:
  - type: "component"
    name: "Circulation Workspace Component"
    technology: "Next.js / React Component"
    description: "Handles circulation workflows, sends commands, and manages real-time alerts."
  - type: "component"
    name: "Cataloguing Management Component"
    technology: "Next.js / React Component"
    description: "Manages library asset cataloguing and uploads."
  - type: "component"
    name: "Admin Dashboard Component"
    technology: "Next.js / React Component"
    description: "Fetches analytics and administrative reports."
  - type: "component"
    name: "Auth Session Handler Component"
    technology: "Next.js / Server Actions"
    description: "Manages OIDC authorization code flow and session storage securely."
relationships:
  - source: "Auth Session Handler Component"
    destination: "External Identity Provider (IdP)"
    description: "Manages OIDC authorization code flow [HTTPS]"
  - source: "Circulation Workspace Component"
    destination: "API Gateway"
    description: "Sends commands and real-time alerts [HTTPS/REST, WebSockets with token authentication]"
  - source: "Cataloguing Management Component"
    destination: "API Gateway"
    description: "Uploads assets [HTTPS/Multipart REST]"
  - source: "Admin Dashboard Component"
    destination: "API Gateway"
    description: "Fetches analytics and reports [HTTPS/REST]"