level: component
scope: "Component diagram for the PostgreSQL Database container"
parentContainer:
  name: "PostgreSQL Database"
elements:
  - type: "component"
    name: "Primary Master"
    technology: "PostgreSQL"
    description: "Manages read-write transactions for circulation and catalogue data."
  - type: "component"
    name: "Read Replica"
    technology: "PostgreSQL"
    description: "Handles read-only queries to offload traffic from the primary master."
  - type: "component"
    name: "PgBouncer"
    technology: "Connection Pooler"
    description: "Provides efficient connection pooling for database clients."
  - type: "component"
    name: "pg_audit"
    technology: "PostgreSQL Extension"
    description: "Enforces detailed auditing and security logging for EU data compliance."
relationships:
  - source: "PgBouncer"
    destination: "Primary Master"
    description: "Routes read-write transactions"
  - source: "PgBouncer"
    destination: "Read Replica"
    description: "Routes read-only queries"
  - source: "Primary Master"
    destination: "pg_audit"
    description: "Audits transactions"