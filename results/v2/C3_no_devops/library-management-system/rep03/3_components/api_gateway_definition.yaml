# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "WAF Filter"
    technology: "ModSecurity"
    description: "Inspects incoming HTTP traffic for malicious patterns and protects backend services from web exploits."
  - type: "component"
    name: "Authentication Filter"
    technology: "Envoy Filter / JWT"
    description: "Performs JWT cryptographic verification and integrates with the External Identity Provider for user authentication."
  - type: "component"
    name: "Rate Limiting Filter"
    technology: "Envoy Rate Limiting"
    description: "Enforces rate limiting quotas utilizing the Distributed Cache (Redis)."
  - type: "component"
    name: "Route & Load Balancing Engine"
    technology: "Envoy Engine"
    description: "Routes verified API requests to internal backend services like the Catalogue Service and Circulation Service."
  - type: "component"
    name: "Fault Translation & Transformation Filter"
    technology: "Envoy Filter"
    description: "Standardizes error codes, translates faults, and propagates user claims (User ID, Roles) in HTTP headers."
relationships:
  - source: "WAF Filter"
    destination: "Authentication Filter"
    description: "Forwards inspected HTTP requests [HTTPS]"
  - source: "Authentication Filter"
    destination: "Rate Limiting Filter"
    description: "Checks request quotas against rate limits [Redis]"
  - source: "Authentication Filter"
    destination: "Route & Load Balancing Engine"
    description: "Passes authenticated requests with propagated claims"
  - source: "Route & Load Balancing Engine"
    destination: "Fault Translation & Transformation Filter"
    description: "Applies fault handling and transforms outgoing/incoming payloads"