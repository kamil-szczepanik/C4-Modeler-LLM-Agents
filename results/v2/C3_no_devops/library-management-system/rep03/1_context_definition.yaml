level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Provides cataloguing, circulation, and self-service portals for public and academic libraries while ensuring strict EU data residency compliance and high-performance search."
elements:
  - type: "person"
    name: "Library Patrons (Members)"
    description: "Library members who interact with the self-service portals to borrow items and manage their accounts."
  - type: "person"
    name: "Librarians / Circulation Staff"
    description: "Staff members who manage circulation, cataloguing, and patron assistance."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators responsible for managing system configuration, users, and overall library operations."
  - type: "externalSystem"
    name: "External Identity Provider (IdP)"
    description: "External system used for authenticating users via OIDC."
  - type: "externalSystem"
    name: "Third-Party Payment Gateway"
    description: "External service used for processing fines securely."
  - type: "externalSystem"
    name: "Digital Content Repositories"
    description: "External repositories used for fulfilling digital items."
relationships:
  - source: "Library Patrons (Members)"
    destination: "Library Management System"
    description: "Interacts with the LMS via self-service portals"
    technology: "HTTPS (TLS 1.3), OAuth 2.0 / OIDC"
  - source: "Librarians / Circulation Staff"
    destination: "Library Management System"
    description: "Interacts with the LMS for circulation and cataloguing"
    technology: "HTTPS (TLS 1.3), OAuth 2.0 / OIDC"
  - source: "Library Administrators"
    destination: "Library Management System"
    description: "Interacts with the LMS for administrative tasks"
    technology: "HTTPS (TLS 1.3), OAuth 2.0 / OIDC"
  - source: "Library Management System"
    destination: "External Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OIDC over HTTPS"
  - source: "Library Management System"
    destination: "Third-Party Payment Gateway"
    description: "Processes fines"
    technology: "REST/HTTPS with mTLS"
  - source: "Library Management System"
    destination: "Digital Content Repositories"
    description: "Fulfills digital items"
    technology: "LTI/API"