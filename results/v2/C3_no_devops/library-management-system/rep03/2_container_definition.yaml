level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons (Members)"
    description: "Library members who interact with the self-service portals to borrow items and manage their accounts."
  - type: "person"
    name: "Librarians / Circulation Staff"
    description: "Staff members who manage circulation, cataloguing, and patron assistance."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators responsible for managing system configuration, users, and overall library operations."
  - type: "externalSystem"
    name: "External Identity Provider (IdP)"
    description: "External system used for authenticating users via OIDC."
  - type: "externalSystem"
    name: "Third-Party Payment Gateway"
    description: "External service used for processing fines securely."
  - type: "externalSystem"
    name: "Digital Content Repositories"
    description: "External repositories used for fulfilling digital items."
  - type: "container"
    name: "Patron Portal"
    technology: "React.js SPA"
    description: "Self-service portal for library patrons to search catalogues and manage accounts."
  - type: "container"
    name: "Librarian Back-office"
    technology: "Next.js Web App"
    description: "Back-office web application for librarians and circulation staff."
  - type: "container"
    name: "API Gateway"
    technology: "NGINX / Envoy"
    description: "Manages incoming traffic, routing requests to appropriate backend services."
  - type: "container"
    name: "Catalogue Service"
    technology: "Java / Spring Boot"
    description: "Manages physical and digital item cataloguing and search functionalities."
  - type: "container"
    name: "Circulation Service"
    technology: "Node.js / Express"
    description: "Manages check-outs, returns, and transactional circulation data."
  - type: "container"
    name: "Event Broker"
    technology: "Apache Kafka / RabbitMQ"
    description: "Provides asynchronous event-driven messaging to decouple workflows."
  - type: "container"
    name: "PostgreSQL Database"
    technology: "PostgreSQL (EU-hosted)"
    description: "Stores transactional circulation data."
  - type: "container"
    name: "Elasticsearch"
    technology: "Elasticsearch (EU-hosted)"
    description: "Provides high-performance search capabilities with sub-800ms response times."
relationships:
  - source: "Library Patrons (Members)"
    destination: "Patron Portal"
    description: "Interacts with the self-service portal"
    technology: "HTTPS"
  - source: "Librarians / Circulation Staff"
    destination: "Librarian Back-office"
    description: "Interacts with the back-office application"
    technology: "HTTPS"
  - source: "Library Administrators"
    destination: "Librarian Back-office"
    description: "Manages system via back-office application"
    technology: "HTTPS"
  - source: "Patron Portal"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS, OAuth2/OIDC with JWTs"
  - source: "Librarian Back-office"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS, OAuth2/OIDC with JWTs"
  - source: "API Gateway"
    destination: "Catalogue Service"
    description: "Routes catalogue queries"
    technology: "mTLS via Istio Service Mesh"
  - source: "API Gateway"
    destination: "Circulation Service"
    description: "Routes circulation requests"
    technology: "mTLS via Istio Service Mesh"
  - source: "Catalogue Service"
    destination: "PostgreSQL Database"
    description: "Reads and writes catalogue data"
    technology: "Encrypted connection with AES-256"
  - source: "Circulation Service"
    destination: "PostgreSQL Database"
    description: "Reads and writes circulation data"
    technology: "Encrypted connection with AES-256"
  - source: "Catalogue Service"
    destination: "Elasticsearch"
    description: "Indexes search data"
    technology: "Encrypted connection with AES-256"
  - source: "Catalogue Service"
    destination: "Event Broker"
    description: "Publishes search and cataloguing events"
    technology: "TLS-encrypted event streams"
  - source: "Circulation Service"
    destination: "Event Broker"
    description: "Publishes check-out workflows"
    technology: "TLS-encrypted event streams"
  - source: "API Gateway"
    destination: "External Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OIDC over HTTPS"
  - source: "Circulation Service"
    destination: "Third-Party Payment Gateway"
    description: "Processes fines"
    technology: "REST/HTTPS with mTLS"
  - source: "Catalogue Service"
    destination: "Digital Content Repositories"
    description: "Fulfills digital items"
    technology: "LTI/API"