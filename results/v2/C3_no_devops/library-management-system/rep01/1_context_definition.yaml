level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A cloud-hosted SaaS Library Management System providing item cataloguing, circulation management, and self-service portals with EU-only data residency and sub-800ms search performance."
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public users accessing self-service portals."
  - type: "person"
    name: "Librarians / Circulation Staff"
    description: "Users managing inventory cataloguing and circulation."
  - type: "person"
    name: "Library Administrators"
    description: "Users handling reporting, analytics, and compliance."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe EU / SEPA for payment processing."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "EU Shibboleth / OAuth2 for authentication and identity management."
  - type: "externalSystem"
    name: "Notification Service"
    description: "SendGrid EU / Twilio for sending notifications."
relationships:
  - source: "Library Patrons"
    destination: "Library Management System"
    description: "Accesses self-service portals"
    technology: "HTTPS (TLS 1.3)"
  - source: "Librarians / Circulation Staff"
    destination: "Library Management System"
    description: "Manages inventory cataloguing and circulation"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Administrators"
    destination: "Library Management System"
    description: "Handles reporting, analytics, and compliance"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Processes payments"
    technology: "HTTPS/REST (PCI-DSS compliant EU endpoints)"
  - source: "Library Management System"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OIDC / SAML 2.0 over HTTPS"
  - source: "Library Management System"
    destination: "Notification Service"
    description: "Sends notifications to users"
    technology: "HTTPS/REST API"