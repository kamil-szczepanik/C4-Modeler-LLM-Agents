level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public users accessing self-service portals."
  - type: "person"
    name: "Librarians / Circulation Staff"
    description: "Users managing inventory cataloguing and circulation."
  - type: "person"
    name: "Library Administrators"
    description: "Users handling reporting, analytics, and compliance."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe EU / SEPA for payment processing."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "EU Shibboleth / OAuth2 for authentication and identity management."
  - type: "externalSystem"
    name: "Notification Service"
    description: "SendGrid EU / Twilio for sending notifications."
  - type: "container"
    name: "Web Frontend"
    technology: "React/TypeScript hosted on an EU-region CDN"
    description: "Provides the user interface for patrons, librarians, and administrators."
  - type: "container"
    name: "API Gateway"
    technology: "Kong or Nginx"
    description: "Handles reverse proxy, rate limiting, and request routing."
  - type: "container"
    name: "Core Business Service"
    technology: "Spring Boot (Java)"
    description: "Handles circulation and cataloging logic."
  - type: "container"
    name: "Search Service"
    technology: "Elasticsearch"
    description: "Provides optimized sub-800ms search capabilities."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL with AES-256 encryption-at-rest"
    description: "Stores system data enforcing EU data residency."
  - type: "container"
    name: "Notification Dispatcher"
    technology: "Python/Celery worker container"
    description: "Dispatches notifications asynchronously."
  - type: "container"
    name: "Audit Logging Service"
    technology: "Go-based microservice with WORM storage"
    description: "Handles compliance and append-only audit logging."
  - type: "container"
    name: "Message Broker"
    technology: "RabbitMQ / AWS SQS"
    description: "Facilitates asynchronous messaging between services."
relationships:
  - source: "Library Patrons"
    destination: "Web Frontend"
    description: "Accesses self-service portals"
    technology: "HTTPS (TLS 1.3)"
  - source: "Librarians / Circulation Staff"
    destination: "Web Frontend"
    description: "Manages inventory cataloguing and circulation"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Administrators"
    destination: "Web Frontend"
    description: "Handles reporting, analytics, and compliance"
    technology: "HTTPS (TLS 1.3)"
  - source: "Web Frontend"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "Core Business Service"
    description: "Routes business requests"
    technology: "Internal REST/gRPC secured via mTLS"
  - source: "API Gateway"
    destination: "Search Service"
    description: "Routes search queries"
    technology: "Internal REST/gRPC secured via mTLS"
  - source: "Core Business Service"
    destination: "Database"
    description: "Reads and writes data"
    technology: "JDBC (PostgreSQL)"
  - source: "Core Business Service"
    destination: "Message Broker"
    description: "Publishes asynchronous events"
    technology: "AMQP"
  - source: "Notification Dispatcher"
    destination: "Message Broker"
    description: "Consumes messages"
    technology: "AMQP"
  - source: "Notification Dispatcher"
    destination: "Notification Service"
    description: "Sends external notifications"
    technology: "Outbound HTTPS"
  - source: "Core Business Service"
    destination: "Payment Gateway"
    description: "Processes payments"
    technology: "OAuth2/TLS 1.3 with webhook signature verification"
  - source: "Core Business Service"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OAuth2/TLS 1.3"