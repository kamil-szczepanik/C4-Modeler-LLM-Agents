level: component
scope: "Component diagram for the Core Business Service container"
parentContainer:
  name: "Core Business Service"
elements:
  - type: "component"
    name: "Cataloging Component"
    technology: "Spring Data JPA"
    description: "Manages physical and digital item inventories."
  - type: "component"
    name: "Circulation Component"
    technology: "JDBC"
    description: "Handles lending, returns, and holds logic."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Spring Events, RabbitMQ"
    description: "Decouples domain events."
  - type: "component"
    name: "Policy Evaluation Component"
    technology: "Java"
    description: "Evaluates variable institutional loan policies and rules."
  - type: "component"
    name: "Catalog Indexer Component"
    technology: "Elasticsearch client"
    description: "Pushes asynchronous inventory updates to Elasticsearch."
relationships:
  - source: "Cataloging Component"
    destination: "Database (PostgreSQL)"
    description: "Reads and writes data via JDBC"
  - source: "Circulation Component"
    destination: "Database (PostgreSQL)"
    description: "Reads and writes data via JDBC"
  - source: "Event Publisher Component"
    destination: "Message Broker (RabbitMQ)"
    description: "Publishes asynchronous events via AMQP"
  - source: "Catalog Indexer Component"
    destination: "Search Service (Elasticsearch)"
    description: "Updates search indices via AMQP"
  - source: "Event Publisher Component"
    destination: "Audit Logging Service"
    description: "Emits structured security events synchronously"