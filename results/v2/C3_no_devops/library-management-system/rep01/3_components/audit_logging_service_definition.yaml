level: component
scope: "Component diagram for the Audit Logging Service container"
parentContainer:
  name: "Audit Logging Service"
elements:
  - type: "component"
    name: "Ingest API Handler"
    technology: "Go (Fiber or Gin)"
    description: "Ingests audit log events via AMQP/JSON with mTLS."
  - type: "component"
    name: "Event Normalizer & Enricher"
    technology: "Go"
    description: "Normalizes and enriches audit log events."
  - type: "component"
    name: "Log Integrity Verifier"
    technology: "Go with SHA-256 Merkle Trees"
    description: "Verifies log integrity and tamper-evidence."
  - type: "component"
    name: "WORM Storage Adapter"
    technology: "Go, AWS S3 Object Lock API, SSE-KMS"
    description: "Interfaces with WORM storage to ensure immutability and EU data residency."
  - type: "component"
    name: "Query & Export API"
    technology: "Go, HTTPS with RBAC/MFA"
    description: "Provides query and export capabilities for compliance officers."
relationships:
  - source: "Message Broker"
    destination: "Ingest API Handler"
    description: "Sends audit messages via AMQP/JSON with mTLS"
  - source: "Ingest API Handler"
    destination: "Event Normalizer & Enricher"
    description: "Passes raw events via Go channels/interfaces"
  - source: "Event Normalizer & Enricher"
    destination: "WORM Storage Adapter"
    description: "Persists normalized logs via AWS S3 Object Lock API"
  - source: "Log Integrity Verifier"
    destination: "WORM Storage Adapter"
    description: "Validates logs using Go interfaces"
  - source: "Compliance Officers"
    destination: "Query & Export API"
    description: "Queries and exports logs via HTTPS with RBAC/MFA"