level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Exchange"
    technology: "Direct/Topic"
    description: "Routes published events to appropriate durable queues."
  - type: "component"
    name: "Durable Queues"
    technology: "RabbitMQ Queues"
    description: "Stores notification.queue and audit.queue messages persistently."
  - type: "component"
    name: "Dead Letter Exchange & Queue"
    technology: "RabbitMQ DLX/DLQ"
    description: "Handles and stores poisoned messages from notification.dlq."
  - type: "component"
    name: "Management API/UI"
    technology: "RabbitMQ Management"
    description: "Provides monitoring and management capabilities for the message broker."
relationships:
  - source: "Exchange"
    destination: "Durable Queues"
    description: "Routes messages [AMQP over TLS 1.3]"
  - source: "Durable Queues"
    destination: "Dead Letter Exchange & Queue"
    description: "Forward poisoned messages [AMQP]"