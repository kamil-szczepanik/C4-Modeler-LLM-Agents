level: component
scope: "Component diagram for the Notification Dispatcher container"
parentContainer:
  name: "Notification Dispatcher"
elements:
  - type: "component"
    name: "Consumer Component"
    technology: "Python/Celery worker"
    description: "Processing raw events."
  - type: "component"
    name: "Routing & Preference Engine"
    technology: "Python component"
    description: "Selecting delivery channels (Email, SMS, Push)."
  - type: "component"
    name: "Template Renderer"
    technology: "Jinja2 component"
    description: "Merging localized templates and sanitizing PII."
  - type: "component"
    name: "Channel Adapters"
    technology: "Python/Requests components"
    description: "Communicating with external services."
  - type: "component"
    name: "Message Broker"
    technology: "RabbitMQ / AWS SQS"
    description: "Supplying event payloads."
  - type: "component"
    name: "External Notification Service"
    technology: "Third-party gateway"
    description: "Delivering external notifications."
  - type: "component"
    name: "PostgreSQL State Store"
    technology: "Database"
    description: "Tracking notification state with AES-256 encryption."
relationships:
  - source: "Consumer Component"
    destination: "Message Broker"
    description: "Consumes raw event payloads [AMQP]."
  - source: "Consumer Component"
    destination: "Message Broker"
    description: "Validates HMAC authentication tokens [AMQP]."
  - source: "Channel Adapters"
    destination: "External Notification Service"
    description: "Sends rendered payloads and receives delivery receipts [Outbound HTTPS via TLS 1.3/mTLS]."
  - source: "Routing & Preference Engine"
    destination: "PostgreSQL State Store"
    description: "Tracks notification states and delivery attempts [SQL]."