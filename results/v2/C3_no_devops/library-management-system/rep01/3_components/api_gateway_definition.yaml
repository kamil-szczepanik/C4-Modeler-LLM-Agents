level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Proxy Router"
    technology: "Kong API Gateway"
    description: "Handles traffic routing and reverse proxying for incoming requests."
  - type: "component"
    name: "Authentication & Authorization Plugin"
    technology: "Lua/Go plugins"
    description: "Validates tokens and enforces security policies at the perimeter."
  - type: "component"
    name: "Rate Limiting Plugin"
    technology: "Kong API Gateway"
    description: "Protects backend services by limiting request rates."
  - type: "component"
    name: "Response Caching Plugin"
    technology: "Kong API Gateway"
    description: "Caches responses to optimize performance and meet SLAs."
  - type: "component"
    name: "Log Transport Plugin"
    technology: "Lua/Go plugins"
    description: "Emits access logs to the audit logging service."
relationships:
  - source: "Proxy Router"
    destination: "Authentication & Authorization Plugin"
    description: "Passes incoming requests for token validation"
  - source: "Authentication & Authorization Plugin"
    destination: "Rate Limiting Plugin"
    description: "Forwards authenticated requests for rate checking"
  - source: "Rate Limiting Plugin"
    destination: "Response Caching Plugin"
    description: "Checks cache for response availability"
  - source: "Response Caching Plugin"
    destination: "Log Transport Plugin"
    description: "Triggers log emission for handled requests"