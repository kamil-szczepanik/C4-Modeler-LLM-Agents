level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Transactional Data Store"
    technology: "PostgreSQL 15+ / Row-Level Security"
    description: "Internal component utilizing row-level security and cryptographic erasure for GDPR compliance."
  - type: "component"
    name: "Audit Schema"
    technology: "PostgreSQL Schema"
    description: "Isolated schema for compliance interfacing with the Audit Logging Service."
  - type: "component"
    name: "Primary Database Instance"
    technology: "PostgreSQL 15+"
    description: "Dedicated PostgreSQL node handling write-heavy operations."
  - type: "component"
    name: "Read Replica Cluster"
    technology: "PostgreSQL 15+ Read Replicas"
    description: "Scaled-out read-only nodes servicing non-critical analytical queries."
relationships:
  - source: "Primary Database Instance"
    destination: "Read Replica Cluster"
    description: "Replicates data streams using TLS 1.3 with certificate validation."
  - source: "Audit Schema"
    destination: "Audit Logging Service"
    description: "Interfaces directly for immutable WORM storage."