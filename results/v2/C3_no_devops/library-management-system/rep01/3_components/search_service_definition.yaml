level: component
scope: "Component diagram for the Search Service container"
parentContainer:
  name: "Search Service"
elements:
  - type: "component"
    name: "Query Parsing & NLP Component"
    technology: "Lucene Query Parser / ES Analysis Modules"
    description: "Parses search queries and implements fuzzy matching, NLP, and autocomplete."
  - type: "component"
    name: "Indexing & Synchronization Component"
    technology: "Elasticsearch Core"
    description: "Handles catalog updates and synchronizes real-time inventory and availability states."
  - type: "component"
    name: "Search Execution Engine"
    technology: "Elasticsearch Core"
    description: "Delivers sub-800ms item discovery with faceted filtering."
  - type: "component"
    name: "Ranking & Aggregation Component"
    technology: "Elasticsearch Core"
    description: "Executes relevance ranking and aggregations for search results."
  - type: "component"
    name: "Analytics Publisher Component"
    technology: "Go / AMQP"
    description: "Streams pseudonymized query analytics via AMQP."
relationships:
  - source: "API Gateway"
    destination: "Query Parsing & NLP Component"
    description: "Routes search queries via internal REST/gRPC secured with mTLS"
  - source: "Message Broker"
    destination: "Indexing & Synchronization Component"
    description: "Streams catalog updates via TLS-encrypted AMQP"
  - source: "Indexing & Synchronization Component"
    destination: "Ranking & Aggregation Component"
    description: "Updates availability state via internal Java API"
  - source: "Analytics Publisher Component"
    destination: "Message Broker"
    description: "Streams pseudonymized query analytics via AMQP"