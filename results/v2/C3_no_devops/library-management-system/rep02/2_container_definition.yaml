# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Member (Patron)"
    description: "End-user accessing the self-service portal."
  - type: "person"
    name: "Librarian / Library Staff"
    description: "Operational staff managing circulation and inventory."
  - type: "person"
    name: "Library Administrator"
    description: "Management personnel handling configuration and reporting."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External SaaS (Stripe EU / Adyen) for fines and fees."
  - type: "externalSystem"
    name: "Digital Content Providers"
    description: "External APIs for e-book and digital catalog syncing."
  - type: "externalSystem"
    name: "Notification System"
    description: "External communication provider (SendGrid EU) for automated alerts."
  - type: "container"
    name: "Web Application"
    technology: "React/TypeScript SPA with IndexedDB/Service Workers"
    description: "Provides cataloging, circulation management, and self-service portals."
  - type: "container"
    name: "API Gateway"
    technology: "NGINX / Spring Cloud Gateway, OAuth 2.0 / OpenID Connect with JWT"
    description: "Routes and secures incoming requests."
  - type: "container"
    name: "Core Business Services"
    technology: "Java with Spring Boot"
    description: "Executes core business logic and circulation management."
  - type: "container"
    name: "Search Engine"
    technology: "Elasticsearch / OpenSearch cluster"
    description: "Provides high-performance search capabilities with <800ms response."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL managed service (EU-hosted)"
    description: "Stores persistent application data ensuring EU data residency."
  - type: "container"
    name: "Analytics Worker"
    technology: "Python/Spring + Apache Kafka/RabbitMQ"
    description: "Processes event streaming and analytics workloads."
relationships:
  - source: "Library Member (Patron)"
    destination: "Web Application"
    description: "Accesses self-service portal for browsing and account management"
    technology: "HTTPS / REST and WebSockets"
  - source: "Librarian / Library Staff"
    destination: "Web Application"
    description: "Manages circulation and inventory via web UI"
    technology: "HTTPS / REST and WebSockets"
  - source: "Library Administrator"
    destination: "Web Application"
    description: "Handles system configuration and reporting via web UI"
    technology: "HTTPS / REST and WebSockets"
  - source: "Web Application"
    destination: "API Gateway"
    description: "Sends user requests to backend services"
    technology: "HTTPS / REST and WebSockets"
  - source: "API Gateway"
    destination: "Core Business Services"
    description: "Forwards core API requests"
    technology: "gRPC / internal REST with mTLS"
  - source: "API Gateway"
    destination: "Search Engine"
    description: "Queries search index"
    technology: "gRPC / internal REST with mTLS"
  - source: "Core Business Services"
    destination: "Database"
    description: "Reads and writes business data"
    technology: "Secure PostgreSQL protocol"
  - source: "Core Business Services"
    destination: "Analytics Worker"
    description: "Streams business events"
    technology: "Apache Kafka / RabbitMQ with mTLS"
  - source: "Core Business Services"
    destination: "Payment Gateway"
    description: "Processes fines and fees"
    technology: "HTTPS/REST with tokenization"
  - source: "Core Business Services"
    destination: "Digital Content Providers"
    description: "Syncs e-book and digital catalogs"
    technology: "OAuth2 and mTLS over HTTPS"
  - source: "Core Business Services"
    destination: "Notification System"
    description: "Sends automated alerts"
    technology: "HTTPS/REST with mTLS"