# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  # Components within the parent container's boundary
  - type: "component"
    name: "Routing & Load Balancer"
    technology: "NGINX / Spring Cloud Gateway"
    description: "Routes incoming requests and balances load across backend services."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "OAuth 2.0 / OpenID Connect with JWT"
    description: "Validates and enforces security tokens for incoming requests."
  - type: "component"
    name: "Rate Limiting & Throttling Component"
    technology: "Redis-backed token bucket"
    description: "Enforces user-persona quotas and limits request rates."
  - type: "component"
    name: "WAF / Payload Inspection Filter"
    technology: "ModSecurity WAF"
    description: "Performs perimeter defense and payload inspection."
  - type: "component"
    name: "API Analytics Emitter"
    technology: "Messaging / Event Emitter"
    description: "Streams usage metrics to the analytics worker."
relationships:
  - source: "API Analytics Emitter"
    destination: "Analytics Worker"
    description: "Streams usage metrics [Apache Kafka / RabbitMQ]"