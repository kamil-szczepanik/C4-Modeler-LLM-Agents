level: component
scope: "Component diagram for the Core Business Services container"
parentContainer:
  name: "Core Business Services"
elements:
  - type: "component"
    name: "Search Orchestrator Component"
    technology: "Java / Spring WebFlux"
    description: "Reactive component for non-blocking search aggregation providing sub-second search performance."
  - type: "component"
    name: "Circulation Engine Component"
    technology: "Java / Spring Boot with Spring Data JPA"
    description: "Manages loans, fines, and transactional safety for library circulation."
  - type: "component"
    name: "Fulfillment & Reservation Component"
    technology: "Java / Spring Boot"
    description: "Manages waitlists and hold expirations for library items."
  - type: "component"
    name: "Integration Component"
    technology: "Spring Integration"
    description: "Handles asynchronous event streams and messaging."
relationships:
  - source: "Search Orchestrator Component"
    destination: "Circulation Engine Component"
    description: "Coordinates search queries and inventory data"
  - source: "Circulation Engine Component"
    destination: "Fulfillment & Reservation Component"
    description: "Updates hold and reservation statuses"
  - source: "Integration Component"
    destination: "Search Orchestrator Component"
    description: "Streams asynchronous events for indexing"