level: component
scope: "Component diagram for the Analytics Worker container"
parentContainer:
  name: "Analytics Worker"
elements:
  - type: "component"
    name: "Event Consumer Component"
    technology: "Python / Spring + Apache Kafka"
    description: "Streams business events and passes validated event payloads."
  - type: "component"
    name: "Aggregation Engine Component"
    technology: "Python / Spring"
    description: "Passes validated event payloads and transfers structured metric payloads."
  - type: "component"
    name: "Analytics Datastore Writer Component"
    technology: "Python / Spring"
    description: "Transfers structured metric payloads and persists aggregated reporting metrics to the database."
relationships:
  - source: "Event Consumer Component"
    destination: "Aggregation Engine Component"
    description: "Passes validated event payloads [In-memory]"
  - source: "Aggregation Engine Component"
    destination: "Analytics Datastore Writer Component"
    description: "Transfers structured metric payloads [In-memory / Method Call]"