level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Managed SQL Database"
    technology: "PostgreSQL with automated table partitioning"
    description: "Stores library system data, user information, and catalog records with EU hosting and ACID compliance."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Manages database connections to prevent exhaustion under peak loads."
  - type: "component"
    name: "Schema Versioning"
    technology: "Flyway"
    description: "Handles database schema versioning integrated into the CI/CD pipeline."
  - type: "component"
    name: "Compliance Auditing"
    technology: "pgaudit"
    description: "PostgreSQL extension for compliance auditing and PII tracking."
relationships:
  - source: "Connection Pooler"
    destination: "Managed SQL Database"
    description: "Proxies and pools database connections"
  - type: "component"
    name: "Schema Versioning"
    destination: "Managed SQL Database"
    description: "Applies schema migrations"
  - type: "component"
    name: "Compliance Auditing"
    destination: "Managed SQL Database"
    description: "Monitors and logs database activity and PII access"