level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "JWT Validation Component"
    technology: "Kong/Nginx Plugin with JWT"
    description: "Validates incoming tokens and checks revocation against the EU Identity Provider."
  - type: "component"
    name: "WAF & Security Header Component"
    technology: "Kong/Nginx WAF"
    description: "Provides Web Application Firewall protection, payload limiting, and security headers."
  - type: "component"
    name: "Redis Cache Component"
    technology: "Redis RESP Plugin"
    description: "Checks token blacklist, rate limits, and persona-based quotas."
relationships:
  - source: "JWT Validation Component"
    destination: "EU Identity Provider (IdP)"
    description: "Validates tokens and checks revocation [OAuth2/OIDC]"
  - source: "Redis Cache Component"
    destination: "Redis Cache"
    description: "Checks token blacklist and rate limits [RESP]"