level: component
scope: "Component diagram for the Databases container"
parentContainer:
  name: "Databases"
elements:
  - type: "component"
    name: "PostgreSQL Primary Node"
    technology: "PostgreSQL 16"
    description: "Core transactional database for performance and ACID compliance, handling transactional reads/writes."
  - type: "component"
    name: "PostgreSQL Read Replica"
    technology: "PostgreSQL 16"
    description: "Read replica supporting high availability and sub-800ms search/query performance."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "pgAudit"
    description: "Structured tamper-evident logging for GDPR compliance."
  - type: "component"
    name: "Backup & PITR Agent"
    technology: "Barman / pgBackRest"
    description: "Continuous backup and Point-in-Time Recovery (PITR) agent."
  - type: "component"
    name: "Data Anonymization Views"
    technology: "PostgreSQL Row-Level Security (RLS) & Secure Views"
    description: "Data isolation and anonymization views for de-identified reporting queries."
relationships:
  - source: "Circulation & Member Service"
    destination: "PostgreSQL Primary Node"
    description: "Transactional reads/writes [TCP/IP via mTLS 1.3]"
  - source: "Analytics & Reporting Container"
    destination: "Data Anonymization Views"
    description: "De-identified reporting queries [TCP/IP via TLS 1.3]"
  - source: "PostgreSQL Primary Node"
    destination: "PostgreSQL Read Replica"
    description: "Asynchronous WAL streaming [Internal streaming replication protocol via mTLS]"
  - source: "Backup & PITR Agent"
    destination: "PostgreSQL Primary Node"
    description: "Continuous WAL archiving [Filesystem / Storage API]"