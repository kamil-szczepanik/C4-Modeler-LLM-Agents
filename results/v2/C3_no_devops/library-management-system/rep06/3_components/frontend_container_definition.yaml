level: component
scope: "Component diagram for the Frontend Container container"
parentContainer:
  name: "Frontend Container"
elements:
  - type: "component"
    name: "Routing & View Layer"
    technology: "React Router"
    description: "Manages client-side navigation and role-based UI hydration."
  - type: "component"
    name: "State & Offline Manager"
    technology: "Zustand + IndexedDB"
    description: "Handles volatile session state and offline-resilient non-PII digital catalog caching."
  - type: "component"
    name: "API Communication Layer"
    technology: "Axios with interceptors and Zod validation"
    description: "Provides strict runtime input validation mirrored from backend expectations and handles HTTP communications."
  - type: "component"
    name: "Design System & i18n Component"
    technology: "Tailwind CSS / Radix UI + i18next"
    description: "Enforces WCAG 2.1 AA accessibility, responsive design, municipal white-labeling, and multi-language localization."
relationships:
  - source: "Routing & View Layer"
    destination: "State & Offline Manager"
    description: "Reads and writes session state and cached catalog data"
  - source: "Routing & View Layer"
    destination: "Design System & i18n Component"
    description: "Renders localized accessible UI elements"
  - source: "Routing & View Layer"
    destination: "API Communication Layer"
    description: "Triggers data fetching and mutations"
  - source: "API Communication Layer"
    destination: "API Gateway"
    description: "Forwards REST API calls [HTTPS]"
  - source: "API Communication Layer"
    destination: "EU Identity Provider"
    description: "Manages authentication flows and token exchange [HTTPS]"