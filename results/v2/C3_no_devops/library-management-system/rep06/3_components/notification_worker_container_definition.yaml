level: component
scope: "Component diagram for the Notification Worker Container container"
parentContainer:
  name: "Notification Worker Container"
elements:
  - type: "component"
    name: "Event Consumer Engine"
    technology: "Go / Sarama/Segmentio"
    description: "Consumes domain events from the message broker using TLS-secured protocols."
  - type: "component"
    name: "Notification Preferences & Consent Manager"
    technology: "Go"
    description: "Validates patron consent and filters payloads to ensure GDPR compliance."
  - type: "component"
    name: "Template & Personalization Engine"
    technology: "Go"
    description: "Formats and personalizes notification templates with filtered payloads."
  - type: "component"
    name: "Dispatch Router & Circuit Breaker"
    technology: "Go"
    description: "Routes messages to external EU email/SMS gateways safely with circuit-breaker protection."
  - type: "component"
    name: "Retry & Dead-Letter Queue (DLQ) Manager"
    technology: "Go"
    description: "Audits failed messages, handles retries, and drops unconsented events to EU-hosted PostgreSQL."
  - type: "component"
    name: "Message Broker"
    technology: "Apache Kafka / RabbitMQ"
    description: "Reliable, decoupled asynchronous event streaming for domain events."
  - type: "component"
    name: "EU-hosted PostgreSQL & Redis Cache"
    technology: "PostgreSQL & Redis"
    description: "Utilized for consent caching and DLQ auditing, secured with AES-256 encryption-at-rest and EU-only residency."
  - type: "component"
    name: "External EU Email/SMS Gateways"
    technology: "SendGrid/Twilio EU endpoints"
    description: "Delivers external email and SMS notifications via TLS 1.3 HTTPS/REST."
relationships:
  - source: "Event Consumer Engine"
    destination: "Message Broker"
    description: "Consumes domain events [TLS-secured gRPC/AMQP with SASL/SCRAM-V5 and mTLS]"
  - source: "Event Consumer Engine"
    destination: "Notification Preferences & Consent Manager"
    description: "Validates consent [In-Process Function Call / gRPC]"
  - source: "Notification Preferences & Consent Manager"
    destination: "Template & Personalization Engine"
    description: "Forwards filtered payloads [In-Process Function Call]"
  - source: "Dispatch Router & Circuit Breaker"
    destination: "External EU Email/SMS Gateways"
    description: "Sends notifications [TLS 1.3 HTTPS/REST with certificate pinning]"
  - source: "Retry & Dead-Letter Queue (DLQ) Manager"
    destination: "EU-hosted PostgreSQL & Redis Cache"
    description: "Audits failed messages and drops unconsented events [AES-256 encrypted connection]"