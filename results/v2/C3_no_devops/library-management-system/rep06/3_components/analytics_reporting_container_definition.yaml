level: component
scope: "Component diagram for the Analytics & Reporting Container container"
parentContainer:
  name: "Analytics & Reporting Container"
elements:
  - type: "component"
    name: "Report Orchestrator Component"
    technology: "FastAPI Router"
    description: "Routes reporting requests received from the API Gateway."
  - type: "component"
    name: "Aggregation & Analytics Engine Component"
    technology: "Pandas / NumPy"
    description: "Performs efficient in-memory data processing for analytics and trend calculations."
  - type: "component"
    name: "Data Anonymization Component"
    technology: "Python"
    description: "Passes and sanitizes raw query results to strictly isolate and protect patron PII."
  - type: "component"
    name: "Export Generation Component"
    technology: "ReportLab / WeasyPrint"
    description: "Generates secure CSV and PDF exports."
  - type: "component"
    name: "Alert Evaluation Component"
    technology: "Python"
    description: "Evaluates and streams computed metrics for anomaly events."
relationships:
  - source: "Report Orchestrator Component"
    destination: "Data Anonymization Component"
    description: "Passes raw query results [In-memory]"
  - source: "Aggregation & Analytics Engine Component"
    destination: "Export Generation Component"
    description: "Passes processed data [In-memory]"
  - source: "Aggregation & Analytics Engine Component"
    destination: "Alert Evaluation Component"
    description: "Streams computed metrics [In-memory]"