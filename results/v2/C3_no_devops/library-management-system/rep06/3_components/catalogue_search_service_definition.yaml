level: component
scope: "Component diagram for the Catalogue & Search Service container"
parentContainer:
  name: "Catalogue & Search Service"
elements:
  - type: "component"
    name: "Search Controller"
    technology: "Spring MVC"
    description: "Processes search and catalogue requests."
  - type: "component"
    name: "Catalogue Manager"
    technology: "Spring Data JPA"
    description: "Manages catalogue metadata persistence."
  - type: "component"
    name: "Index Synchronizer"
    technology: "Spring Integration + Kafka Consumer"
    description: "Consumes item mutation events for index synchronization."
  - type: "component"
    name: "Analytics Publisher"
    technology: "Spring Cloud Stream"
    description: "Dispatches asynchronous search telemetry and publishes anonymized search event streams."
  - type: "component"
    name: "Elasticsearch Cluster"
    technology: "Elasticsearch"
    description: "Powers fast, facet-filtered, fuzzy-matched searches."
  - type: "component"
    name: "PostgreSQL Database"
    technology: "PostgreSQL"
    description: "Provides transactional relational storage for catalogue metadata."
  - type: "component"
    name: "Apache Kafka Message Broker"
    technology: "Apache Kafka"
    description: "Enables decoupled, asynchronous event streaming."
relationships:
  - source: "API Gateway"
    destination: "Search Controller"
    description: "Routes search and catalogue requests [gRPC over mTLS]"
  - source: "Search Controller"
    destination: "Elasticsearch Cluster"
    description: "Queries index [Elasticsearch Native Transport / TCP]"
  - source: "Catalogue Manager"
    destination: "PostgreSQL Database"
    description: "Persists catalogue metadata [JDBC over TLS]"
  - source: "Index Synchronizer"
    destination: "Apache Kafka Message Broker"
    description: "Consumes item mutation events [Kafka protocol over TLS]"
  - source: "Search Controller"
    destination: "Analytics Publisher"
    description: "Dispatches asynchronous search telemetry [In-process Spring ApplicationEvent]"
  - source: "Analytics Publisher"
    destination: "Apache Kafka Message Broker"
    description: "Publishes anonymized search event streams [Kafka protocol over TLS]"