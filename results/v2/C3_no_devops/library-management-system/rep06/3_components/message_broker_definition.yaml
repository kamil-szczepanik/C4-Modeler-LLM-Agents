level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Kafka Broker Cluster"
    technology: "Apache Kafka"
    description: "High-throughput, fault-tolerant event streaming engine handling domain and historical events."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent/Apicurio Schema Registry"
    description: "Enforces strict data contracts and blocks unmasked PII."
  - type: "component"
    name: "DLQ Manager"
    technology: "Dead Letter Queue Manager"
    description: "Manages failed message routing and error handling for the event pipeline."
relationships:
  - source: "Kafka Broker Cluster"
    destination: "Schema Registry"
    description: "Validates message schemas [REST]"
  - source: "Kafka Broker Cluster"
    destination: "DLQ Manager"
    description: "Routes poison pill messages [Internal Routing]"