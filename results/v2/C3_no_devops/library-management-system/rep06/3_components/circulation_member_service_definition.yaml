level: component
scope: "Component diagram for the Circulation & Member Service container"
parentContainer:
  name: "Circulation & Member Service"
elements:
  - type: "component"
    name: "Loan Management Controller & Service"
    technology: "TypeScript / NestJS"
    description: "Manages library loans, item check-outs, check-ins, and renewals."
  - type: "component"
    name: "Fine & Payment Processor Component"
    technology: "TypeScript / NestJS"
    description: "Calculates and processes fines, interacting with the external EU-compliant Payment Gateway using tokenized payments."
  - type: "component"
    name: "Event Publisher & Notification Event Dispatcher"
    technology: "TypeScript / NestJS"
    description: "Publishes domain events to the message broker and dispatches notification alerts."
  - type: "component"
    name: "Member Profile & PII Manager"
    technology: "TypeScript / NestJS"
    description: "Manages patron PII with application-level AES-256 encryption ensuring EU data residency and GDPR compliance."
  - type: "component"
    name: "Dispute Management Handler"
    technology: "TypeScript / NestJS"
    description: "Handles patron disputes regarding fines, loans, and account status."
relationships:
  - source: "Fine & Payment Processor Component"
    destination: "EU-compliant Payment Gateway"
    description: "Processes tokenized payments [HTTPS/TLS 1.3]"
  - source: "Event Publisher & Notification Event Dispatcher"
    destination: "Notification Worker Container"
    description: "Triggers alerts [gRPC/AMQP]"
  - source: "Circulation & Member Service"
    destination: "Database"
    description: "Reads/writes transactional data and PII [SQL over TLS with AES-256]"
  - source: "Circulation & Member Service"
    destination: "Message Broker"
    description: "Emits domain events [AMQP/TLS with SASL/SCRAM]"