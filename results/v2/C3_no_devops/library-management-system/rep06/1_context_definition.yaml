level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Provides cataloguing, circulation, and self-service portals for public and academic libraries, ensuring EU-only data residency and high-performance search requirements."
elements:
  - type: "person"
    name: "Library Patrons (Students, Public)"
    description: "End users who access the library services for cataloguing, circulation, and self-service portals."
  - type: "person"
    name: "Librarians / Circulation Staff"
    description: "Staff members who manage circulation, cataloguing, and day-to-day library operations."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators responsible for system configuration, management, and oversight."
  - type: "externalSystem"
    name: "EU Identity Provider (IdP)"
    description: "Handles user authentication using Keycloak and OAuth2/OIDC."
  - type: "externalSystem"
    name: "EU-compliant Payment Gateway"
    description: "Processes financial transactions securely within compliance guidelines."
  - type: "externalSystem"
    name: "EU Cloud Hosting Provider (Frankfurt)"
    description: "Provides regional cloud infrastructure (AWS or Azure Frankfurt Region) ensuring EU data residency."
relationships:
  - source: "Library Patrons (Students, Public)"
    destination: "Library Management System"
    description: "Interact with the system for self-service portals and circulation"
    technology: "HTTPS"
  - source: "Librarians / Circulation Staff"
    destination: "Library Management System"
    description: "Manage circulation and cataloguing via the system"
    technology: "HTTPS"
  - source: "Library Administrators"
    destination: "Library Management System"
    description: "Administer and configure the system"
    technology: "HTTPS"
  - source: "Library Management System"
    destination: "EU Identity Provider (IdP)"
    description: "Authenticates users and verifies identity"
    technology: "HTTPS/OIDC"
  - source: "Library Management System"
    destination: "EU-compliant Payment Gateway"
    description: "Processes payments and verifies financial webhooks using HMAC signatures"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "EU Cloud Hosting Provider (Frankfurt)"
    description: "Runs on regional infrastructure to ensure EU data residency compliance"
    technology: "Cloud Infrastructure (AWS/Azure Frankfurt)"