level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons (Students, Public)"
    description: "End users who access the library services for cataloguing, circulation, and self-service portals."
  - type: "person"
    name: "Librarians / Circulation Staff"
    description: "Staff members who manage circulation, cataloguing, and day-to-day library operations."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators responsible for system configuration, management, and oversight."
  - type: "externalSystem"
    name: "EU Identity Provider (IdP)"
    description: "Handles user authentication using OAuth2/OIDC token introspection."
  - type: "externalSystem"
    name: "EU-compliant Payment Gateway"
    description: "Processes financial transactions securely within compliance guidelines."
  - type: "externalSystem"
    name: "EU Cloud Hosting Provider (Frankfurt)"
    description: "Provides regional cloud infrastructure ensuring EU data residency."
  - type: "container"
    name: "Frontend Container"
    technology: "React/TypeScript SPA"
    description: "Powers the interactive patron and staff self-service portal served via CDN."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx/Kong"
    description: "Acts as a secure, high-performance single entry point handling routing, rate limiting, and JWT/OAuth2 validation."
  - type: "container"
    name: "Catalogue & Search Service"
    technology: "Spring Boot / Java with Elasticsearch"
    description: "Delivers sub-second catalogue searches meeting performance requirements."
  - type: "container"
    name: "Circulation & Member Service"
    technology: "Node.js / NestJS"
    description: "Secures transactional circulation data, loans, fines, and PII under strict EU residency."
  - type: "container"
    name: "Analytics & Reporting Container"
    technology: "Python / FastAPI"
    description: "Isolates heavy administrative reporting queries via a read-optimized PostgreSQL replica."
  - type: "container"
    name: "Notification Worker Container"
    technology: "Go"
    description: "Handles asynchronous notifications and event-driven decoupled workflows."
  - type: "container"
    name: "Message Broker"
    technology: "Apache Kafka / RabbitMQ"
    description: "Enables asynchronous event-driven messaging between services."
  - type: "container"
    name: "Databases"
    technology: "EU-hosted PostgreSQL with AES-256 encryption-at-rest"
    description: "Provides encrypted persistent storage for circulation, member data, and read replicas."
relationships:
  - source: "Library Patrons (Students, Public)"
    destination: "Frontend Container"
    description: "Accesses self-service portals"
    technology: "HTTPS"
  - source: "Librarians / Circulation Staff"
    destination: "Frontend Container"
    description: "Accesses staff portal and circulation tools"
    technology: "HTTPS"
  - source: "Library Administrators"
    destination: "Frontend Container"
    description: "Accesses administrative portal"
    technology: "HTTPS"
  - source: "Frontend Container"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "EU Identity Provider (IdP)"
    description: "Validates and introspects tokens"
    technology: "OAuth2/OIDC token introspection"
  - source: "API Gateway"
    destination: "Catalogue & Search Service"
    description: "Routes search and catalogue requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Circulation & Member Service"
    description: "Routes circulation and member requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Analytics & Reporting Container"
    description: "Routes reporting and analytics requests"
    technology: "gRPC over mTLS"
  - source: "Circulation & Member Service"
    destination: "Databases"
    description: "Reads and writes transactional circulation data and PII"
    technology: "TLS with AES-256 encryption-at-rest"
  - source: "Catalogue & Search Service"
    destination: "Databases"
    description: "Accesses catalogue data"
    technology: "Internal cluster protocol"
  - source: "Analytics & Reporting Container"
    destination: "Databases"
    description: "Queries read-optimized PostgreSQL replica"
    technology: "TLS"
  - source: "Circulation & Member Service"
    destination: "Message Broker"
    description: "Publishes and consumes circulation events"
    technology: "TLS-secured gRPC/AMQP with SASL/SCRAM"
  - source: "Notification Worker Container"
    destination: "Message Broker"
    description: "Consumes async events for notifications"
    technology: "TLS-secured gRPC/AMQP with SASL/SCRAM"
  - source: "Circulation & Member Service"
    destination: "EU-compliant Payment Gateway"
    description: "Processes fines and payments"
    technology: "HTTPS/TLS 1.3"
  - source: "Circulation & Member Service"
    destination: "EU Cloud Hosting Provider (Frankfurt)"
    description: "Runs within Frankfurt VPC infrastructure"
    technology: "Cloud Infrastructure"