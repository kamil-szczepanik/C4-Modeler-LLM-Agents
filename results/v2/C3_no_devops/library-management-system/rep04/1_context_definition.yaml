level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A cloud-native enterprise solution that enables public and academic libraries to catalogue physical and digital items, manage circulation, and provide self-service portals with EU-only data residency."
elements:
  - type: "person"
    name: "Library Patron (Member)"
    description: "A library user who accesses self-service portals to borrow and manage items."
  - type: "person"
    name: "Librarian / Circulation Staff"
    description: "Staff members who manage circulation, cataloguing, and library operations with mandatory MFA."
  - type: "person"
    name: "Library Administrator"
    description: "Administrators responsible for managing the system configuration and oversight."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Handles authentication for users and staff using OIDC / OAuth2."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Processes fines and payments via HTTPS/REST."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Sends alerts and notifications to patrons via HTTPS/SMTP."
  - type: "externalSystem"
    name: "Inter-Library Loan (ILL) Network"
    description: "Enables sharing and borrowing of items across regional consortium APIs."
relationships:
  - source: "Library Patron (Member)"
    destination: "Library Management System"
    description: "Accesses web/mobile client UI for self-service portal"
    technology: "HTTPS via TLS 1.3"
  - source: "Librarian / Circulation Staff"
    destination: "Library Management System"
    description: "Manages circulation and cataloguing via web/mobile client UI"
    technology: "HTTPS via TLS 1.3"
  - source: "Library Administrator"
    destination: "Library Management System"
    description: "Administers the system via web/mobile client UI"
    technology: "HTTPS via TLS 1.3"
  - source: "Library Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users and staff"
    technology: "OIDC / OAuth2"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Processes patron fines"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "Notification Service"
    description: "Sends alerts and notifications to patrons"
    technology: "HTTPS/SMTP"
  - source: "Library Management System"
    destination: "Inter-Library Loan (ILL) Network"
    description: "Connects with regional consortium APIs for loans"
    technology: "HTTPS REST/SOAP with mTLS and OAuth2 client credentials"