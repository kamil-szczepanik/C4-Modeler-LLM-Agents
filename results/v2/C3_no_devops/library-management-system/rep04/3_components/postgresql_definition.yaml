level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "PostgreSQL 16 Primary Database"
    technology: "PostgreSQL 16, Table Partitioning, Row-Level Security, pgaudit"
    description: "Primary database satisfying EU-only data residency, GDPR compliance, and auditability."
  - type: "component"
    name: "PostgreSQL Read Replica"
    technology: "PostgreSQL"
    description: "Read replica for executing aggregated analytical queries."
  - type: "component"
    name: "PgBouncer Connection Pooler"
    technology: "PgBouncer, TLS 1.3"
    description: "Connection pooling with TLS 1.3 termination to mitigate handshake latency."
  - type: "component"
    name: "EU-Resident Object Store"
    technology: "Object Store"
    description: "Continuous Write-Ahead Log (WAL) archiving for Point-In-Time Recovery (PITR)."
relationships:
  - source: "PgBouncer Connection Pooler"
    destination: "PostgreSQL 16 Primary Database"
    description: "Routes transactional queries [JDBC over mTLS / TLS 1.3]"
  - source: "PostgreSQL 16 Primary Database"
    destination: "PostgreSQL Read Replica"
    description: "Asynchronous replication [Encrypted Replication Stream]"
  - source: "PostgreSQL 16 Primary Database"
    destination: "EU-Resident Object Store"
    description: "Continuous WAL archiving for PITR"