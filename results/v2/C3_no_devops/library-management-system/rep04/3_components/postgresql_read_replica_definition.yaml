level: component
scope: "Component diagram for the PostgreSQL Read Replica container"
parentContainer:
  name: "PostgreSQL Read Replica"
elements:
  - type: "component"
    name: "PostgreSQL Engine (Read-Only)"
    technology: "PostgreSQL 15+"
    description: "Provides native streaming replication and read-only database capabilities for analytical queries."
  - type: "component"
    name: "Streaming Replication Receiver"
    technology: "PostgreSQL Binary Streaming"
    description: "Receives asynchronous replication data via TCP with mTLS from the Primary PostgreSQL."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Manages analytical connection spikes and prevents connection exhaustion."
  - type: "component"
    name: "Write-Ahead Log (WAL) Replayer"
    technology: "PostgreSQL Process"
    description: "Applies incoming WAL segments to maintain the read-only database state."
  - type: "component"
    name: "Prometheus PostgreSQL Exporter"
    technology: "Prometheus Exporter"
    description: "Exposes database performance and replication lag metrics."
relationships:
  - source: "Streaming Replication Receiver"
    destination: "Write-Ahead Log (WAL) Replayer"
    description: "Feeds WAL data"
  - source: "Write-Ahead Log (WAL) Replayer"
    destination: "PostgreSQL Engine (Read-Only)"
    description: "Updates database state"
  - source: "Connection Pooler"
    destination: "PostgreSQL Engine (Read-Only)"
    description: "Routes analytical queries"
  - source: "Prometheus PostgreSQL Exporter"
    destination: "PostgreSQL Engine (Read-Only)"
    description: "Scrapes metrics"