level: component
scope: "Component diagram for the Patron Portal container"
parentContainer:
  name: "Patron Portal"
elements:
  - type: "component"
    name: "Authentication & Session Manager"
    technology: "React / HttpOnly Cookies"
    description: "Manages OIDC tokens and secures refresh tokens against XSS vulnerabilities."
  - type: "component"
    name: "Account & Loan Dashboard"
    technology: "React SPA / Material-UI / Radix UI"
    description: "Manages loans and preferences, providing a modern, mobile-responsive self-accessible frontend interface with WCAG 2.1 AA compliance."
  - type: "component"
    name: "Catalog & Search Interface"
    technology: "React SPA / GraphQL"
    description: "Queries the item catalog and ensures sub-800ms search responses."
  - type: "component"
    name: "Billing & Payment Widget"
    technology: "React SDK / Payment Gateway SDK"
    description: "Processes self-service fine settlements and maintains PCI-DSS compliance."
relationships:
  - source: "Authentication & Session Manager"
    destination: "Identity Provider"
    description: "Manages OIDC tokens [HTTPS/OIDC]"
  - source: "Account & Loan Dashboard"
    destination: "Core Circulation Service"
    description: "Manages loans and preferences [REST/JSON, HTTPS]"
  - source: "Catalog & Search Interface"
    destination: "Search Service"
    description: "Queries item catalog [GraphQL/HTTPS]"
  - source: "Billing & Payment Widget"
    destination: "Payment Gateway"
    description: "Processes self-service fine settlements [HTTPS/SDK]"