level: component
scope: "Component diagram for the Notification Worker container"
parentContainer:
  name: "Notification Worker"
elements:
  - type: "component"
    name: "Task Consumer Component"
    technology: "Python & Celery"
    description: "Celery Worker Core for asynchronous background task processing and consumer management."
  - type: "component"
    name: "Notification Dispatcher Component"
    technology: "Python, Pydantic, HashiCorp Vault"
    description: "Invokes processing logic, sanitizes payloads, and dispatches alerts using securely injected API keys."
  - type: "component"
    name: "Delivery Audit Component"
    technology: "SQLAlchemy"
    description: "Persists delivery state and audit trails with least-privilege roles."
  - type: "component"
    name: "RabbitMQ Message Broker"
    technology: "RabbitMQ"
    description: "External message broker supplying background tasks via AMQP."
  - type: "component"
    name: "PostgreSQL Database"
    technology: "PostgreSQL"
    description: "Persists audit trails securely."
  - type: "component"
    name: "External Notification Services"
    technology: "Email/SMS gateways"
    description: "External gateways for dispatching alerts to patrons and staff."
relationships:
  - source: "Task Consumer Component"
    destination: "RabbitMQ Message Broker"
    description: "Consumes background tasks [AMQP over TLS 1.3 with mTLS/SASL-SCRAM]"
  - source: "Task Consumer Component"
    destination: "Notification Dispatcher Component"
    description: "Invokes processing logic [In-memory function call]"
  - source: "Notification Dispatcher Component"
    destination: "Delivery Audit Component"
    description: "Persists delivery state [SQL over TLS]"
  - source: "Delivery Audit Component"
    destination: "PostgreSQL Database"
    description: "Persists audit trails with least-privilege roles [SQL over TLS 1.3]"
  - source: "Notification Dispatcher Component"
    destination: "External Notification Services"
    description: "Dispatches alerts [TLS 1.3 with certificate pinning]"