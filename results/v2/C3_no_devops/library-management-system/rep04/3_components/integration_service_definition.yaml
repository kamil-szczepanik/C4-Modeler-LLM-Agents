level: component
scope: "Component diagram for the Integration Service container"
parentContainer:
  name: "Integration Service"
elements:
  - type: "component"
    name: "Webhook Ingress & Reconciliation Controller"
    technology: "Express.js"
    description: "Handles incoming webhooks and reconciliation requests from external systems."
  - type: "component"
    name: "Outbound Sync Worker"
    technology: "BullMQ"
    description: "Manages asynchronous outbox message processing and synchronization queues."
  - type: "component"
    name: "External Adapter Layer"
    technology: "Axios with opossum"
    description: "Interfaces with external systems using circuit breakers for resilience."
  - type: "component"
    name: "Transaction State Repository"
    technology: "Prisma/Knex"
    description: "Persists transaction states and integration data."
  - type: "component"
    name: "Secrets Management"
    technology: "HashiCorp Vault"
    description: "Secures and manages credentials, tokens, and encryption keys."
relationships:
  - source: "Webhook Ingress & Reconciliation Controller"
    destination: "Transaction State Repository"
    description: "Persists transaction state"
  - source: "Outbound Sync Worker"
    destination: "External Adapter Layer"
    description: "Triggers outbound calls using"
  - source: "External Adapter Layer"
    destination: "Secrets Management"
    description: "Retrieves credentials from"