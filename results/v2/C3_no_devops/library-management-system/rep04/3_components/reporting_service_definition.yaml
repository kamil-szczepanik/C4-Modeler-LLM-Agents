level: component
scope: "Component diagram for the Reporting Service container"
parentContainer:
  name: "Reporting Service"
elements:
  - type: "component"
    name: "Report Generator Component"
    technology: "Python, FastAPI"
    description: "Handles on-demand requests and API endpoints."
  - type: "component"
    name: "Export Worker Component"
    technology: "Python, Celery, Pandas, ReportLab"
    description: "Processes asynchronous export jobs and renders structured CSV and PDF exports."
  - type: "component"
    name: "Scheduler Component"
    technology: "APScheduler"
    description: "Manages timezone-aware automated reports."
  - type: "component"
    name: "Staff Dashboard"
    technology: "Web Browser / UI"
    description: "External staff interface for requesting and downloading reports."
  - type: "component"
    name: "RabbitMQ"
    technology: "Message Broker"
    description: "Message broker for asynchronous task distribution."
  - type: "component"
    name: "PostgreSQL Read Replica"
    technology: "PostgreSQL"
    description: "Dedicated database for heavy analytics queries."
  - type: "component"
    name: "MinIO"
    technology: "S3-compatible Object Storage"
    description: "Sovereign, local object storage for temporary file staging and downloading."
relationships:
  - source: "Staff Dashboard"
    destination: "Report Generator Component"
    description: "Requests on-demand reports and schedules via REST/JSON over mTLS."
  - source: "Report Generator Component"
    destination: "Export Worker Component"
    description: "Dispatches background export tasks via RabbitMQ using AMQP over TLS."
  - source: "Export Worker Component"
    destination: "PostgreSQL Read Replica"
    description: "Fetches large datasets for aggregation via SQL over mTLS."
  - source: "Export Worker Component"
    destination: "MinIO"
    description: "Persists generated CSV/PDF files temporarily via HTTPS over TLS."
  - source: "Staff Dashboard"
    destination: "MinIO"
    description: "Downloads generated reports securely via time-limited cryptographically signed HTTPS URLs."