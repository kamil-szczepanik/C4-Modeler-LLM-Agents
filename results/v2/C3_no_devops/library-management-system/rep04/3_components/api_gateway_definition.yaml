level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "API Gateway"
    technology: "Kong configured with Redis"
    description: "Serves as the entry point for API requests from the Patron Portal and Staff Dashboard."
  - type: "component"
    name: "Routing Engine"
    technology: "Lua/Kong Router"
    description: "Proxies requests to internal services securely."
  - type: "component"
    name: "Authentication & Authorization Plugin"
    technology: "OAuth2/JWT"
    description: "Validates JWT tokens against the Identity Provider."
  - type: "component"
    name: "Rate Limiting & Throttling Module"
    technology: "Redis-backed"
    description: "Protects availability and supports performance goals via rate-limiting."
  - type: "component"
    name: "SSL Termination Module with WAF / OWASP Core Rule Set"
    technology: "OpenSSL/Nginx core"
    description: "Provides perimeter WAF protection and SSL termination."
  - type: "component"
    name: "Analytics & Transformation Plugin"
    technology: "Lua/Kong"
    description: "Publishes anonymized usage metrics to the Reporting Service."
relationships:
  - source: "API Gateway"
    destination: "Authentication & Authorization Plugin"
    description: "Validates JWT tokens"
  - source: "Routing Engine"
    destination: "Core Circulation & Cataloguing Service"
    description: "Proxies requests [gRPC over mTLS]"
  - source: "Routing Engine"
    destination: "Search Service"
    description: "Proxies search queries [gRPC over mTLS]"
  - source: "Analytics & Transformation Plugin"
    destination: "Reporting Service"
    description: "Publishes anonymized usage metrics [HTTP/REST over TLS 1.3]"