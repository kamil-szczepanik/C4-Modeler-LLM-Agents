level: component
scope: "Component diagram for the Core Circulation & Cataloguing Service container"
parentContainer:
  name: "Core Circulation & Cataloguing Service"
elements:
  - type: "component"
    name: "Security Context Interceptor"
    technology: "Spring Boot Interceptor"
    description: "Delegates validated execution contexts and forwards authenticated requests."
  - type: "component"
    name: "Circulation Engine"
    technology: "Spring Boot Service"
    description: "Manages loans, fines, inventory check-outs, and applies pessimistic locking."
  - type: "component"
    name: "Cataloguing Manager"
    technology: "Spring Boot Service"
    description: "Manages library inventories and metadata."
  - type: "component"
    name: "Transaction Event Publisher"
    technology: "Spring AMQP"
    description: "Publishes signed domain events like ItemCheckedOut to the message broker."
relationships:
  - source: "Security Context Interceptor"
    destination: "Circulation Engine"
    description: "Delegates validated execution contexts [In-process method calls]"
  - source: "Security Context Interceptor"
    destination: "Cataloguing Manager"
    description: "Delegates validated execution contexts [In-process method calls]"
  - source: "Circulation Engine"
    destination: "PostgreSQL"
    description: "Persists transactional state and applies pessimistic locking [JDBC over TLS 1.3]"
  - source: "Transaction Event Publisher"
    destination: "RabbitMQ"
    description: "Publishes signed domain events like ItemCheckedOut [AMQP over TLS 1.3]"