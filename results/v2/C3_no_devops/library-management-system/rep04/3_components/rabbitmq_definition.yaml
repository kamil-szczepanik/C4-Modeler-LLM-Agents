level: component
scope: "Component diagram for the RabbitMQ container"
parentContainer:
  name: "RabbitMQ"
elements:
  - type: "component"
    name: "Notification Queue"
    technology: "Quorum Queue"
    description: "Reliable storage for background tasks and notifications ensuring zero data loss."
  - type: "component"
    name: "Audit & Analytics Queue"
    technology: "Quorum Queue"
    description: "Durable queue implementation for guaranteed message persistence in EU-bound volumes."
  - type: "component"
    name: "Exchange (Direct/Topic)"
    technology: "Erlang-based Message Router"
    description: "Routes domain and integration events across the messaging infrastructure."
  - type: "component"
    name: "Audit Topic Exchange"
    technology: "Erlang-based Message Router"
    description: "Routes audit and analytics messages securely within the broker."
  - type: "component"
    name: "Dead-Letter Exchange (DLX)"
    technology: "RabbitMQ Exchange"
    description: "Failed delivery capture component for handling undeliverable messages."
relationships:
  - source: "Core Circulation Service"
    destination: "Exchange (Direct/Topic)"
    description: "Publishes domain events [AMQP 0-9-1 over TLS 1.3]"
  - source: "Integration Service"
    destination: "Exchange (Direct/Topic)"
    description: "Publishes integration events [AMQP 0-9-1 over TLS 1.3]"
  - source: "Notification Worker"
    destination: "Notification Queue"
    description: "Consumes background tasks [AMQP over TLS 1.3]"