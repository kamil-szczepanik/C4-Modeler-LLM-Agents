level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patron"
    description: "A library user who accesses self-service portals to borrow and manage items."
  - type: "person"
    name: "Librarian/Circulation Staff"
    description: "Staff members who manage circulation, cataloguing, and library operations."
  - type: "person"
    name: "Library Administrator"
    description: "Administrators responsible for managing the system configuration and oversight."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Handles authentication for users and staff."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Processes fines and payments."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Sends alerts and notifications."
  - type: "externalSystem"
    name: "Inter-Library Loan (ILL) Network"
    description: "Enables sharing and borrowing of items across external consortiums."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx/Kong"
    description: "Centralized ingress, routing, and OAuth 2.0 validation."
  - type: "container"
    name: "Patron Portal"
    technology: "React SPA"
    description: "Self-service patron portal frontend."
  - type: "container"
    name: "Staff Dashboard"
    technology: "Angular SPA"
    description: "Staff dashboard frontend for circulation and operations."
  - type: "container"
    name: "Core Circulation & Cataloguing Service"
    technology: "Spring Boot"
    description: "Handles core circulation workflows and strict ACID transaction compliance."
  - type: "container"
    name: "Search Service"
    technology: "Elasticsearch"
    description: "Provides sub-800ms search response times."
  - type: "container"
    name: "Integration Service"
    technology: "Node.js"
    description: "Handles asynchronous external API payloads with external systems."
  - type: "container"
    name: "Notification Worker"
    technology: "Python/Celery"
    description: "Asynchronous background task processing for notifications."
  - type: "container"
    name: "Reporting Service"
    technology: "Python/FastAPI"
    description: "Generates reports and analytics."
  - type: "container"
    name: "PostgreSQL"
    technology: "PostgreSQL"
    description: "Primary relational database with column-level encryption."
  - type: "container"
    name: "PostgreSQL Read Replica"
    technology: "PostgreSQL"
    description: "Read replica used for analytics and reporting."
  - type: "container"
    name: "RabbitMQ"
    technology: "RabbitMQ"
    description: "Message broker for asynchronous background task processing."
relationships:
  - source: "Library Patron"
    destination: "Patron Portal"
    description: "Accesses self-service portal"
    technology: "HTTPS (TLS 1.3)"
  - source: "Librarian/Circulation Staff"
    destination: "Staff Dashboard"
    description: "Accesses staff dashboard"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Administrator"
    destination: "Staff Dashboard"
    description: "Administers system via dashboard"
    technology: "HTTPS (TLS 1.3)"
  - source: "Patron Portal"
    destination: "API Gateway"
    description: "Makes API requests"
    technology: "HTTPS (TLS 1.3)"
  - source: "Staff Dashboard"
    destination: "API Gateway"
    description: "Makes API requests"
    technology: "HTTPS (TLS 1.3)"
  - source: "API Gateway"
    destination: "Core Circulation & Cataloguing Service"
    description: "Routes circulation requests"
    technology: "gRPC/REST over TLS 1.3"
  - source: "API Gateway"
    destination: "Search Service"
    description: "Routes search queries"
    technology: "gRPC/REST over TLS 1.3"
  - source: "Core Circulation & Cataloguing Service"
    destination: "PostgreSQL"
    description: "Persists transactional data"
    technology: "JDBC (TLS 1.3)"
  - source: "PostgreSQL"
    destination: "PostgreSQL Read Replica"
    description: "Asynchronous replication"
    technology: "Asynchronous Replication"
  - source: "Integration Service"
    destination: "External Systems"
    description: "Interacts with external systems"
    technology: "REST/Webhooks over mTLS"
  - source: "Notification Worker"
    destination: "RabbitMQ"
    description: "Consumes background tasks"
    technology: "AMQP over TLS 1.3"
  - source: "Staff Dashboard"
    destination: "Reporting Service"
    description: "Requests reports and analytics"
    technology: "REST/JSON over mTLS"
  - source: "Reporting Service"
    destination: "PostgreSQL Read Replica"
    description: "Queries analytics data"
    technology: "SQL over mTLS"