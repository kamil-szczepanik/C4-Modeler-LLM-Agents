level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "Primary Database Instance"
    technology: "PostgreSQL 15, AWS RDS"
    description: "Relational datastore ensuring EU data residency, transactional integrity, and handling write operations."
  - type: "component"
    name: "Read Replica Instance"
    technology: "PostgreSQL 15, AWS RDS"
    description: "Read replica instance offloading query read operations."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Manages and optimizes connections between core services and database instances."
relationships:
  - source: "Connection Pooler"
    destination: "Primary Database Instance"
    description: "Routes queries via PostgreSQL Wire Protocol over TLS 1.3"
  - source: "Connection Pooler"
    destination: "Read Replica Instance"
    description: "Routes queries via PostgreSQL Wire Protocol over TLS 1.3"
  - source: "Primary Database Instance"
    destination: "Read Replica Instance"
    description: "Asynchronous replication via SSL/TLS"