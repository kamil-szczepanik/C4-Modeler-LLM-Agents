level: component
scope: "Component diagram for the Core Services Container container"
parentContainer:
  name: "Core Services Container"
elements:
  - type: "component"
    name: "Catalogue Management Component"
    technology: "Spring Boot @Service, Java"
    description: "Provides item cataloging functionality and publishes item state changes."
  - type: "component"
    name: "Circulation Component"
    technology: "Spring Boot @Service, Java"
    description: "Manages circulation processes and workflows for libraries."
  - type: "component"
    name: "Notification & Payment Facade"
    technology: "Spring Boot @Component, Java"
    description: "Handles external communications and payment processing."
  - type: "component"
    name: "Search Synchronization Component"
    technology: "Spring Boot @Service, Java"
    description: "Synchronizes and indexes item data into the search container."
relationships:
  - source: "Catalogue Management Component"
    destination: "PostgreSQL"
    description: "Reads/writes relational data via JDBC, mTLS"
  - source: "Circulation Component"
    destination: "PostgreSQL"
    description: "Reads/writes relational data via JDBC, mTLS"
  - source: "Catalogue Management Component"
    destination: "Message Broker"
    description: "Publishes item state changes via Kafka, AMQP"
  - source: "Search Synchronization Component"
    destination: "Search Container"
    description: "Indexes item data via TCP/gRPC with mTLS"
  - source: "Notification & Payment Facade"
    destination: "Stripe EU & SendGrid EU"
    description: "Processes payments and notifications via HTTPS (REST)"