# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  # Components within the parent container's boundary
  - type: "component"
    name: "Spring Cloud Gateway Router"
    technology: "Spring Cloud Gateway, Java"
    description: "Handles robust routing, edge security, and protocol translation."
  - type: "component"
    name: "Rate Limiter Component"
    technology: "Redis Token Bucket"
    description: "Enforces rate limiting using low-latency in-memory data store."
relationships:
  - source: "Spring Cloud Gateway Router"
    destination: "Rate Limiter Component"
    description: "Queries for rate limit enforcement via in-memory RESP protocol over TLS"