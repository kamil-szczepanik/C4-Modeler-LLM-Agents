level: component
scope: "Component diagram for the Web Application container"
parentContainer:
  name: "Web Application"
elements:
  - type: "component"
    name: "Routing & Auth Module"
    technology: "React Router, OIDC client"
    description: "Manages application routing and user authentication using OIDC."
  - type: "component"
    name: "Catalogue & Search Component"
    technology: "React, TanStack Query"
    description: "Handles catalogue views and server-state caching for search optimization."
  - type: "component"
    name: "Circulation Portal Component"
    technology: "React"
    description: "Provides the circulation management interface for patrons and librarians."
  - type: "component"
    name: "Localization & Accessibility Module"
    technology: "React-i18next, Aria components"
    description: "Provides multi-language support and ensures WCAG 2.1 AA compliance."
  - type: "component"
    name: "API Client Service"
    technology: "Axios"
    description: "Facilitates communication with backend services via HTTP requests."
  - type: "component"
    name: "Web Server"
    technology: "Nginx"
    description: "Serves the single-page application and enforces security hardening via CSP and HSTS headers."
relationships:
  - source: "Routing & Auth Module"
    destination: "Keycloak/Auth0 EU tenant"
    description: "Authenticates users [OIDC]"
  - source: "Web Application"
    destination: "API Gateway"
    description: "Sends REST/GraphQL API requests [HTTPS, TLS 1.3]"
  - source: "Library Patrons, Librarians, Administrators"
    destination: "Web Application"
    description: "Accesses portals [HTTPS, TLS 1.3]"