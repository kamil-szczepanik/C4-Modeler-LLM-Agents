level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public users accessing the system via self-service portals."
  - type: "person"
    name: "Librarians / Circulation Staff"
    description: "Personnel managing inventory, loans, and daily operations."
  - type: "person"
    name: "Library Administrators"
    description: "Users overseeing reporting and user management."
  - type: "externalSystem"
    name: "Stripe EU"
    description: "External payment processing system restricted to EU endpoints."
  - type: "externalSystem"
    name: "Keycloak/Auth0 EU tenant"
    description: "External identity and authentication provider (OAuth 2.0 / OIDC)."
  - type: "externalSystem"
    name: "SendGrid EU"
    description: "External notification and email delivery service restricted to EU endpoints."
  - type: "container"
    name: "Web Application"
    technology: "React, TypeScript, Nginx"
    description: "Single Page Application (SPA) providing self-service portals and user interfaces."
  - type: "container"
    name: "API Gateway"
    technology: "Spring Cloud Gateway, Java"
    description: "Routes and secures incoming traffic to core services and search containers."
  - type: "container"
    name: "Core Services Container"
    technology: "Spring Boot, Java"
    description: "Contains core business logic for catalogue, circulation, and management."
  - type: "container"
    name: "Search Container"
    technology: "Elasticsearch / OpenSearch"
    description: "Provides sub-second search performance for physical and digital items."
  - type: "container"
    name: "PostgreSQL"
    technology: "PostgreSQL (AWS RDS EU)"
    description: "Stores persistent relational data for the library management system."
  - type: "container"
    name: "Message Broker"
    technology: "Apache Kafka / RabbitMQ"
    description: "Handles event-driven messaging and asynchronous data processing."
relationships:
  - source: "Library Patrons"
    destination: "Web Application"
    description: "Accesses self-service portals"
    technology: "HTTPS (REST/GraphQL, TLS 1.3)"
  - source: "Librarians / Circulation Staff"
    destination: "Web Application"
    description: "Manages inventory, loans, and daily operations"
    technology: "HTTPS (REST/GraphQL, TLS 1.3)"
  - source: "Library Administrators"
    destination: "Web Application"
    description: "Oversees reporting and user management"
    technology: "HTTPS (REST/GraphQL, TLS 1.3)"
  - source: "Web Application"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS (REST/GraphQL, TLS 1.3)"
  - source: "API Gateway"
    destination: "Core Services Container"
    description: "Routes traffic to core business logic"
    technology: "gRPC/HTTPS using mTLS"
  - source: "API Gateway"
    destination: "Search Container"
    description: "Routes search queries"
    technology: "gRPC/HTTPS using mTLS"
  - source: "Core Services Container"
    destination: "PostgreSQL"
    description: "Reads and writes relational data"
    technology: "TCP/gRPC with mTLS"
  - source: "Core Services Container"
    destination: "Search Container"
    description: "Indexes and queries search items"
    technology: "TCP/gRPC with mTLS"
  - source: "Core Services Container"
    destination: "Message Broker"
    description: "Publishes and consumes events"
    technology: "AMQP/Kafka with mTLS and SASL/SCRAM"
  - source: "Core Services Container"
    destination: "Stripe EU"
    description: "Processes payments"
    technology: "HTTPS (REST)"
  - source: "Core Services Container"
    destination: "SendGrid EU"
    description: "Sends emails and notifications"
    technology: "HTTPS (REST)"
  - source: "Core Services Container"
    destination: "Keycloak/Auth0 EU tenant"
    description: "Authenticates users and validates tokens"
    technology: "OIDC/OAuth2"