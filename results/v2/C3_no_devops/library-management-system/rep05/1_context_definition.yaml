level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Provides self-service portals and catalogue/circulation management for academic and public libraries, strictly enforcing EU-only data residency while delivering high-performance cataloguing and search capabilities."
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public users accessing the system via self-service portals."
  - type: "person"
    name: "Librarians / Circulation Staff"
    description: "Personnel managing inventory, loans, and daily operations."
  - type: "person"
    name: "Library Administrators"
    description: "Users overseeing reporting and user management."
  - type: "externalSystem"
    name: "Stripe EU"
    description: "External payment processing system restricted to EU endpoints."
  - type: "externalSystem"
    name: "Keycloak/Auth0 EU tenant"
    description: "External identity and authentication provider (OAuth 2.0 / OIDC)."
  - type: "externalSystem"
    name: "SendGrid EU"
    description: "External notification and email delivery service restricted to EU endpoints."
relationships:
  - source: "Library Patrons"
    destination: "Library Management System"
    description: "Interact with the web/mobile app via self-service portals"
    technology: "HTTPS (REST/GraphQL) over TLS 1.3"
  - source: "Librarians / Circulation Staff"
    destination: "Library Management System"
    description: "Manage inventory, loans, and daily operations"
    technology: "HTTPS (REST/GraphQL) over TLS 1.3"
  - source: "Library Administrators"
    destination: "Library Management System"
    description: "Oversee reporting and user management"
    technology: "HTTPS (REST/GraphQL) over TLS 1.3"
  - source: "Library Management System"
    destination: "Stripe EU"
    description: "Integrates for payment processing via EU endpoints"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "Keycloak/Auth0 EU tenant"
    description: "Integrates for authentication and token validation"
    technology: "OAuth 2.0 / OIDC"
  - source: "Library Management System"
    destination: "SendGrid EU"
    description: "Integrates for email and notification delivery via EU endpoints"
    technology: "HTTPS/REST"