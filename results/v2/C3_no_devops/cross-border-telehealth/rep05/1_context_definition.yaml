level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides secure video consultations, e-prescriptions, and an AI symptom checker for patients across the EU and US, ensuring strict regional data residency and regulatory compliance."
elements:
  - type: "person"
    name: "Patients"
    description: "Patients accessing secure video consultations, e-prescriptions, and the AI symptom checker via Web/Mobile Clients."
  - type: "person"
    name: "Licensed Clinicians and Compliance Officers"
    description: "Medical professionals conducting consultations and officers ensuring regulatory compliance."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways"
    description: "National gateways for e-prescriptions across the EU."
  - type: "externalSystem"
    name: "US Pharmacy Networks"
    description: "Pharmacy networks in the US utilizing HL7 FHIR APIs."
  - type: "externalSystem"
    name: "Third-Party Video Relay/TURN Infrastructure"
    description: "Infrastructure supporting video media streaming for telehealth sessions."
relationships:
  - source: "Patients"
    destination: "Cross-Border Telehealth Platform"
    description: "Interacts with the platform for consultations and symptom checking"
    technology: "HTTPS/TLS 1.3"
  - source: "Licensed Clinicians and Compliance Officers"
    destination: "Cross-Border Telehealth Platform"
    description: "Interacts with the platform to provide care and manage compliance"
    technology: "HTTPS/TLS 1.3"
  - source: "Cross-Border Telehealth Platform"
    destination: "EU National E-Prescription Gateways"
    description: "Connects to EU national gateways for e-prescriptions"
    technology: "SOAP/REST with mTLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "US Pharmacy Networks"
    description: "Connects to US pharmacy networks"
    technology: "HL7 FHIR REST APIs with mTLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Third-Party Video Relay/TURN Infrastructure"
    description: "Streams video media during consultations"
    technology: "WebRTC with DTLS-SRTP over UDP/TCP"