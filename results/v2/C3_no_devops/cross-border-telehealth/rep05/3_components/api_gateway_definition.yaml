level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Router"
    technology: "Envoy Proxy"
    description: "Terminates TLS and enforces claims-based geo-routing."
  - type: "component"
    name: "Auth/Policy Enforcement Filter"
    technology: "Envoy Wasm/Lua Plugin"
    description: "Validates JWTs, verifies consent scopes, and injects secure headers."
  - type: "component"
    name: "Rate Limiter & Circuit Breaker"
    technology: "Envoy / Custom Filter"
    description: "Protects downstream services during unstable connection spikes."
  - type: "component"
    name: "Telemetry & Usage Analytics Header Injector"
    technology: "Envoy Plugin"
    description: "Appends anonymized usage metrics without exposing PHI."
  - type: "component"
    name: "Web Application Firewall (WAF)"
    technology: "Security Module"
    description: "Inspects inbound HTTPS payloads for OWASP Top 10 vulnerabilities."
  - type: "component"
    name: "SPIFFE/SPIRE Sidecar Integration"
    technology: "SPIFFE/SPIRE"
    description: "Manages automated short-lived mTLS certificate rotation."
relationships:
  - source: "Client Apps"
    destination: "Edge Router"
    description: "Sends API requests and data over HTTPS / WebSockets."
  - source: "Edge Router"
    destination: "Auth/Policy Enforcement Filter"
    description: "Passes requests for JWT validation and scope verification."
  - source: "Auth/Policy Enforcement Filter"
    destination: "Core Telehealth Service"
    description: "Routes validated requests via gRPC with mTLS."
  - source: "Auth/Policy Enforcement Filter"
    destination: "AI Symptom Checker Container"
    description: "Routes symptom check requests via gRPC with mTLS."
  - source: "Auth/Policy Enforcement Filter"
    destination: "Patient Consent Service"
    description: "Routes consent and compliance queries via gRPC with mTLS."
  - source: "Auth/Policy Enforcement Filter"
    destination: "Pharmacy Integration Gateway"
    description: "Routes e-prescription requests via gRPC with mTLS."