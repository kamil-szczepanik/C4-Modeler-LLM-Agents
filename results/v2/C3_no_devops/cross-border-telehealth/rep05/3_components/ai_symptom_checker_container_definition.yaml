# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the AI Symptom Checker Container container"
parentContainer:
  name: "AI Symptom Checker Container"
elements:
  - type: "component"
    name: "API Router / Controller"
    technology: "Python / FastAPI"
    description: "Exposes endpoints and handles request routing for the symptom checker."
  - type: "component"
    name: "Consent & Scope Validator"
    technology: "Python / Middleware"
    description: "Middleware that validates patient consent and API scopes."
  - type: "component"
    name: "Triage Engine"
    technology: "Python/PyTorch or LangChain"
    description: "AI inference engine performing symptom-to-urgency assessments."
  - type: "component"
    name: "Audit & Traceability Logger"
    technology: "Python / Asynchronous Logger"
    description: "Captures model inputs, versions, outputs, and clinician overrides."
relationships:
  - source: "Consent & Scope Validator"
    destination: "API Router / Controller"
    description: "Forwards validated requests [Internal function call]"
  - source: "API Router / Controller"
    destination: "Triage Engine"
    description: "Initiates urgency assessment [In-memory function call]"
  - source: "Triage Engine"
    destination: "Audit & Traceability Logger"
    description: "Captures model inputs, versions, and outputs [Asynchronous event]"