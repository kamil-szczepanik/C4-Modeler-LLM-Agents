level: component
scope: "Component diagram for the Video Media Server container"
parentContainer:
  name: "Video Media Server"
elements:
  - type: "component"
    name: "Media Ingestion & Routing Component"
    technology: "LiveKit SFU Router (Go/Rust)"
    description: "Powers real-time WebRTC media routing and simulcast handling for low-bandwidth optimization."
  - type: "component"
    name: "ABR Controller"
    technology: "Adaptive Bitrate Control"
    description: "Triggers simulcast layer switching on bandwidth drops."
  - type: "component"
    name: "Egress Recording Worker"
    technology: "Node.js/FFmpeg"
    description: "Powers secure media composition and writes encrypted media chunks."
  - type: "component"
    name: "Session Telemetry Publisher"
    technology: "gRPC"
    description: "Forwards real-time session health stats to the core service."
relationships:
  - source: "Media Ingestion & Routing Component"
    destination: "ABR Controller"
    description: "Triggers simulcast layer switching on bandwidth drops [Internal gRPC/Channels]"
  - source: "Session Telemetry Publisher"
    destination: "Core Telehealth Service"
    description: "Forwards real-time session health stats [gRPC]"
  - source: "Media Ingestion & Routing Component"
    destination: "TURN Infrastructure"
    description: "Relays media over unstable connections [WebRTC / TURN-TLS]"
  - source: "Egress Recording Worker"
    destination: "Regional Cloud Storage"
    description: "Writes encrypted media chunks [HTTPS/TLS 1.3]"