level: component
scope: "Component diagram for the Core Telehealth Service container"
parentContainer:
  name: "Core Telehealth Service"
elements:
  - type: "component"
    name: "Consultation Manager"
    technology: "Go"
    description: "Manages video consultations and coordinates session flows."
  - type: "component"
    name: "Prescription Coordinator"
    technology: "Go"
    description: "Handles e-prescriptions and routes data to external pharmacy gateways."
  - type: "component"
    name: "Consent Verifier"
    technology: "Go"
    description: "Verifies patient consent against privacy regulations before treatment."
  - type: "component"
    name: "Telemetry & Adaptation Engine"
    technology: "Go"
    description: "Monitors connection quality and adapts streaming for low-bandwidth environments."
relationships:
  - source: "Consultation Manager"
    destination: "Consent Verifier"
    description: "Verifies patient consent via gRPC with mTLS"
  - source: "Consultation Manager"
    destination: "Telemetry & Adaptation Engine"
    description: "Tracks telemetry and network adaptation"
  - source: "Prescription Coordinator"
    destination: "Consent Verifier"
    description: "Validates consent before prescription generation"