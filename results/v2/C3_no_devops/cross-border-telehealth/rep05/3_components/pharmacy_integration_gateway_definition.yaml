level: component
scope: "Component diagram for the Pharmacy Integration Gateway container"
parentContainer:
  name: "Pharmacy Integration Gateway"
elements:
  - type: "component"
    name: "Prescription Orchestrator"
    technology: "Go"
    description: "Orchestrates e-prescription workflows and manages internal routing using in-memory Go channels."
  - type: "component"
    name: "Adapter Engine"
    technology: "Go / Apache Camel"
    description: "Handles protocol mapping and submits e-prescriptions to external EU and US networks."
  - type: "component"
    name: "Status & Audit Publisher"
    technology: "Go / Apache Camel"
    description: "Publishes event-driven status delivery acknowledgments to GCP Pub/Sub."
  - type: "component"
    name: "Regional State Store"
    technology: "Google Cloud Memorystore for Redis"
    description: "Reads and writes idempotency state with strict TTLs over TLS via internal VPC."
relationships:
  - source: "Prescription Orchestrator"
    destination: "Adapter Engine"
    description: "Internal routing [In-memory Go channels]"
  - source: "Prescription Orchestrator"
    destination: "Regional State Store"
    description: "Read/Write idempotency state [Redis Protocol over TLS via internal VPC]"
  - source: "Adapter Engine"
    destination: "Status & Audit Publisher"
    description: "Triggers status updates upon external prescription submission"