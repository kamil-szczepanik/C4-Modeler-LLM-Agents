level: component
scope: "Component diagram for the Patient Consent Service container"
parentContainer:
  name: "Patient Consent Service"
elements:
  - type: "component"
    name: "Consent API Controller"
    technology: "Go"
    description: "Manages granular, purpose-based data sharing consents for cross-border telehealth operations."
  - type: "component"
    name: "Consent Evaluation Engine"
    technology: "Go"
    description: "Evaluates policies for low-latency consent decisions."
  - type: "component"
    name: "Audit & Ledger Writer"
    technology: "Go"
    description: "Triggers async audit events and writes immutable logs for compliance."
  - type: "component"
    name: "Cache Invalidation & Event Dispatcher"
    technology: "Go"
    description: "Publishes and subscribes to revocation events."
  - type: "component"
    name: "Ledger Storage Adapter"
    technology: "Go"
    description: "Interfaces with storage to write immutable audit logs."
  - type: "component"
    name: "Redis Cache"
    technology: "Redis (In-memory storage)"
    description: "Provides in-memory lookups to eliminate database round-trips."
  - type: "component"
    name: "GCP Pub/Sub"
    technology: "GCP Pub/Sub"
    description: "Messaging service for distributed cache invalidation and revocation event broadcasting."
  - type: "component"
    name: "Google Cloud Storage"
    technology: "Google Cloud Storage (WORM Object Storage)"
    description: "Guarantees tamper-proof compliance audit logging."
relationships:
  - source: "Consent API Controller"
    destination: "Consent Evaluation Engine"
    description: "Evaluates policies [In-process Go function calls]"
  - source: "Consent Evaluation Engine"
    destination: "Redis Cache"
    description: "Reads/writes cached consent states [RESP protocol over TLS]"
  - source: "Redis Cache"
    destination: "Consent Evaluation Engine"
    description: "Reads/writes cached consent states [RESP protocol over TLS]"
  - source: "Consent API Controller"
    destination: "Audit & Ledger Writer"
    description: "Triggers async audit events [Go channels]"
  - source: "Audit & Ledger Writer"
    destination: "Ledger Storage Adapter"
    description: "Writes immutable logs [HTTPS / Storage API]"
  - source: "Cache Invalidation & Event Dispatcher"
    destination: "GCP Pub/Sub"
    description: "Publishes/subscribes to revocation events [gRPC]"