level: component
scope: "Component diagram for the Data Storage container"
parentContainer:
  name: "Data Storage"
elements:
  - type: "component"
    name: "Google Cloud SQL PostgreSQL EU"
    technology: "PostgreSQL with FHIR extensions"
    description: "Regional isolated database deployed in europe-west3 for EU data residency, clinical records, and consent data."
  - type: "component"
    name: "Google Cloud SQL PostgreSQL US"
    technology: "PostgreSQL with FHIR extensions"
    description: "Regional isolated database deployed in us-central1 for US data residency, clinical records, and consent data."
  - type: "component"
    name: "Google Memorystore for Redis"
    technology: "Redis"
    description: "Regional caching tier providing low-latency session and consent state retrieval during consultations."
  - type: "component"
    name: "GCP Cloud Storage"
    technology: "Cloud Storage with Object Versioning"
    description: "Stores immutable WORM audit logs of inputs and model versions."
relationships:
  - source: "Core Telehealth Service"
    destination: "Google Cloud SQL PostgreSQL EU"
    description: "Reads and writes clinical and consent data via Cloud SQL Auth Proxy [Encrypted SQL]"
  - source: "Patient Consent Service"
    destination: "Google Cloud SQL PostgreSQL EU"
    description: "Reads and writes clinical and consent data via Cloud SQL Auth Proxy [Encrypted SQL]"
  - source: "Core Telehealth Service"
    destination: "Google Cloud SQL PostgreSQL US"
    description: "Reads and writes clinical and consent data via Cloud SQL Auth Proxy [Encrypted SQL]"
  - source: "Patient Consent Service"
    destination: "Google Cloud SQL PostgreSQL US"
    description: "Reads and writes clinical and consent data via Cloud SQL Auth Proxy [Encrypted SQL]"
  - source: "Core Telehealth Service"
    destination: "Google Memorystore for Redis"
    description: "Caches session and consent states [RESP protocol, TLS]"
  - source: "Patient Consent Service"
    destination: "Google Memorystore for Redis"
    description: "Caches session and consent states [RESP protocol, TLS]"
  - source: "AI Symptom Checker Container"
    destination: "GCP Cloud Storage"
    description: "Writes immutable audit logs of inputs and model versions [gRPC / HTTPS]"