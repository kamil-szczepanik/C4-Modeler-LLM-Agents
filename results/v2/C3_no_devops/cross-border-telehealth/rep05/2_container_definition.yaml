level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients accessing secure video consultations, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals conducting consultations."
  - type: "person"
    name: "Compliance Officers"
    description: "Officers ensuring regulatory compliance."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways"
    description: "National gateways for e-prescriptions across the EU."
  - type: "externalSystem"
    name: "US Pharmacy Networks"
    description: "Pharmacy networks in the US utilizing HL7 FHIR APIs."
  - type: "externalSystem"
    name: "TURN Infrastructure"
    description: "Infrastructure supporting video media streaming for telehealth sessions."
  - type: "container"
    name: "Client Apps"
    technology: "Flutter / Web application"
    description: "Cross-platform client application for patients, clinicians, and compliance officers."
  - type: "container"
    name: "API Gateway"
    technology: "Google Cloud API Gateway / Envoy"
    description: "Manages and routes incoming client traffic to internal microservices securely."
  - type: "container"
    name: "Core Telehealth Service"
    technology: "Node.js / Go container"
    description: "Handles core telehealth business logic, consultations, and operations."
  - type: "container"
    name: "AI Symptom Checker Container"
    technology: "Python / FastAPI"
    description: "Provides AI-driven symptom checking capabilities for patients."
  - type: "container"
    name: "Patient Consent Service"
    technology: "Node.js / Go container"
    description: "Manages patient consent and regional regulatory data residency compliance."
  - type: "container"
    name: "Pharmacy Integration Gateway"
    technology: "Go / Apache Camel container"
    description: "Integrates with external e-prescription gateways and US pharmacy networks."
  - type: "container"
    name: "Video Media Server"
    technology: "LiveKit / WebRTC SFU"
    description: "Handles real-time video streaming and WebRTC sessions for consultations."
  - type: "container"
    name: "Data Storage"
    technology: "Google Cloud SQL (PostgreSQL with FHIR extensions)"
    description: "Regional isolated databases storing patient records and health data."
relationships:
  - source: "Patients"
    destination: "Client Apps"
    description: "Accesses telehealth services, video consultations, and symptom checker"
    technology: "HTTPS / WebSockets"
  - source: "Licensed Clinicians"
    destination: "Client Apps"
    description: "Conducts video consultations and manages care"
    technology: "HTTPS / WebSockets"
  - source: "Compliance Officers"
    destination: "Client Apps"
    description: "Monitors compliance and consent management"
    technology: "HTTPS / WebSockets"
  - source: "Client Apps"
    destination: "API Gateway"
    description: "Sends API requests and data"
    technology: "HTTPS / WebSockets"
  - source: "Client Apps"
    destination: "Video Media Server"
    description: "Streams video during consultations"
    technology: "WebRTC (SRTP with DTLS-SRTP)"
  - source: "API Gateway"
    destination: "Core Telehealth Service"
    description: "Routes internal service requests"
    technology: "gRPC (internal service-to-service with mTLS)"
  - source: "API Gateway"
    destination: "AI Symptom Checker Container"
    description: "Routes symptom check requests"
    technology: "gRPC (internal service-to-service with mTLS)"
  - source: "API Gateway"
    destination: "Patient Consent Service"
    description: "Routes consent and compliance queries"
    technology: "gRPC (internal service-to-service with mTLS)"
  - source: "API Gateway"
    destination: "Pharmacy Integration Gateway"
    description: "Routes e-prescription requests"
    technology: "gRPC (internal service-to-service with mTLS)"
  - source: "Core Telehealth Service"
    destination: "Data Storage"
    description: "Reads and writes consultation data"
    technology: "Encrypted SQL connections"
  - source: "Patient Consent Service"
    destination: "Data Storage"
    description: "Reads and writes consent records"
    technology: "Encrypted SQL connections"
  - source: "Pharmacy Integration Gateway"
    destination: "EU National E-Prescription Gateways"
    description: "Submits e-prescriptions"
    technology: "mTLS over HTTPS"
  - source: "Pharmacy Integration Gateway"
    destination: "US Pharmacy Networks"
    description: "Submits e-prescriptions"
    technology: "mTLS over HTTPS"
  - source: "Video Media Server"
    destination: "TURN Infrastructure"
    description: "Relays video media over unstable connections"
    technology: "WebRTC / TURN"