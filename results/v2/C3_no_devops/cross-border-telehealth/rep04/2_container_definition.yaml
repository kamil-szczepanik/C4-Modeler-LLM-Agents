level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU/US)"
    description: "Utilize video care, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Conduct secure cross-border video consultations."
  - type: "person"
    name: "Local Pharmacies"
    description: "Receive national-standard e-prescriptions."
  - type: "person"
    name: "Regulators"
    description: "Access audit logs and ensure compliance."
  - type: "person"
    name: "System Administrators"
    description: "Manage system infrastructure and operations."
  - type: "person"
    name: "Caregivers/Guardians"
    description: "Assist patients with platform access and care."
  - type: "externalSystem"
    name: "National E-Prescription Gateways and Pharmacy Networks"
    description: "External systems for e-prescription delivery using national standards."
  - type: "container"
    name: "Flutter/React Native Web and Mobile Apps"
    technology: "Flutter / React Native"
    description: "Client applications for patients, clinicians, and administrators."
  - type: "container"
    name: "Kong API Gateway/BFF"
    technology: "Kong API Gateway"
    description: "Acts as the Backend-for-Frontend and API Gateway routing requests."
  - type: "container"
    name: "Spring Boot Core Telehealth Service"
    technology: "Java, Spring Boot"
    description: "Handles core telehealth workflows, video consultations, and business logic."
  - type: "container"
    name: "FastAPI AI Symptom Checker"
    technology: "Python, FastAPI"
    description: "Provides AI symptom checking capabilities."
  - type: "container"
    name: "Node.js E-Prescription Service"
    technology: "Node.js"
    description: "Manages e-prescription creation and routing."
  - type: "container"
    name: "Java Consent Management Service"
    technology: "Java"
    description: "Enforces privacy consents and signed PASETO/JWT token validation."
  - type: "container"
    name: "Node.js/Go Billing & Localization Container"
    technology: "Node.js / Go"
    description: "Handles billing, payments, and regional localization logic."
  - type: "container"
    name: "GCP Cloud SQL (PostgreSQL)"
    technology: "PostgreSQL, GCP Cloud SQL"
    description: "Relational database providing regional data storage."
  - type: "container"
    name: "GCP Cloud Storage"
    technology: "GCP Cloud Storage"
    description: "Object storage for unstructured medical and media data."
  - type: "container"
    name: "GCP Cloud Pub/Sub"
    technology: "GCP Cloud Pub/Sub"
    description: "Messaging backbone for cross-service asynchronous events."
  - type: "container"
    name: "Cloud KMS"
    technology: "GCP Cloud KMS"
    description: "Manages encryption keys with CMEK for data protection."
relationships:
  - source: "Patients (EU/US)"
    destination: "Flutter/React Native Web and Mobile Apps"
    description: "Interacts with the telehealth platform via web and mobile apps"
    technology: "HTTPS / WebSockets (TLS 1.3)"
  - source: "Licensed Clinicians"
    destination: "Flutter/React Native Web and Mobile Apps"
    description: "Conducts consultations and manages patient care"
    technology: "HTTPS / WebSockets (TLS 1.3)"
  - source: "System Administrators"
    destination: "Flutter/React Native Web and Mobile Apps"
    description: "Manages platform configurations and infrastructure"
    technology: "HTTPS / WebSockets (TLS 1.3)"
  - source: "Caregivers/Guardians"
    destination: "Flutter/React Native Web and Mobile Apps"
    description: "Supports patient access and interactions"
    technology: "HTTPS / WebSockets (TLS 1.3)"
  - source: "Flutter/React Native Web and Mobile Apps"
    destination: "Kong API Gateway/BFF"
    description: "Sends API requests and handles authentication"
    technology: "HTTPS / WebSockets with OAuth2/OIDC"
  - source: "Kong API Gateway/BFF"
    destination: "Spring Boot Core Telehealth Service"
    description: "Routes core telehealth requests securely"
    technology: "gRPC / Anthos Service Mesh (mTLS)"
  - source: "Kong API Gateway/BFF"
    destination: "FastAPI AI Symptom Checker"
    description: "Routes symptom check requests"
    technology: "gRPC / Anthos Service Mesh (mTLS)"
  - source: "Kong API Gateway/BFF"
    destination: "Node.js E-Prescription Service"
    description: "Routes e-prescription requests"
    technology: "gRPC / Anthos Service Mesh (mTLS)"
  - source: "Kong API Gateway/BFF"
    destination: "Java Consent Management Service"
    description: "Validates consent and tokens"
    technology: "gRPC / Anthos Service Mesh (mTLS)"
  - source: "Kong API Gateway/BFF"
    destination: "Node.js/Go Billing & Localization Container"
    description: "Processes billing and localization workflows"
    technology: "gRPC / Anthos Service Mesh (mTLS)"
  - source: "Spring Boot Core Telehealth Service"
    destination: "GCP Cloud SQL (PostgreSQL)"
    description: "Reads and writes relational health data"
    technology: "PostgreSQL Protocol with CMEK"
  - source: "Spring Boot Core Telehealth Service"
    destination: "GCP Cloud Storage"
    description: "Stores clinical documents and media"
    technology: "HTTPS / GCP API with CMEK"
  - source: "Spring Boot Core Telehealth Service"
    destination: "GCP Cloud Pub/Sub"
    description: "Publishes and consumes cross-service events"
    technology: "GCP Pub/Sub API with payload encryption"
  - source: "Node.js E-Prescription Service"
    destination: "National E-Prescription Gateways and Pharmacy Networks"
    description: "Transmits e-prescriptions externally"
    technology: "HL7 FHIR and national standards over mTLS"
  - source: "Node.js E-Prescription Service"
    destination: "GCP Cloud Pub/Sub"
    description: "Publishes prescription events"
    technology: "GCP Pub/Sub API"
  - source: "Java Consent Management Service"
    destination: "GCP Cloud SQL (PostgreSQL)"
    description: "Stores consent records and audit metadata"
    technology: "PostgreSQL Protocol with CMEK"
  - source: "Node.js/Go Billing & Localization Container"
    destination: "GCP Cloud SQL (PostgreSQL)"
    description: "Persists billing and regional configurations"
    technology: "PostgreSQL Protocol with CMEK"
  - source: "Spring Boot Core Telehealth Service"
    destination: "Cloud KMS"
    description: "Encrypts and decrypts sensitive data fields using CMEK"
    technology: "Cloud KMS API"