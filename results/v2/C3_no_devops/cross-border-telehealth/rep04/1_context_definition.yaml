level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US while ensuring strict cross-border regional data isolation and compliance with GDPR, HIPAA, and EU MDR."
elements:
  - type: "person"
    name: "Patients (EU/US)"
    description: "Utilize video care, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Conduct secure cross-border video consultations."
  - type: "person"
    name: "Local Pharmacies"
    description: "Receive national-standard e-prescriptions."
  - type: "person"
    name: "Compliance / Regulatory Officers & External Regulatory Auditors"
    description: "Access audit logs for accountability."
  - type: "externalSystem"
    name: "Third-Party AI Model Provider"
    description: "External service for symptom checking via HTTPS/REST."
  - type: "externalSystem"
    name: "National E-Prescription Gateways / Pharmacy Networks"
    description: "External systems using mTLS APIs."
relationships:
  - source: "Patients (EU/US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Use video care, e-prescriptions, and AI symptom checker"
    technology: "HTTPS / WebRTC"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Conduct secure cross-border video consultations"
    technology: "HTTPS / WebRTC"
  - source: "Cross-Border Telehealth Platform"
    destination: "Third-Party AI Model Provider"
    description: "Sends pseudonymized payloads for AI symptom checking"
    technology: "HTTPS/REST"
  - source: "Cross-Border Telehealth Platform"
    destination: "National E-Prescription Gateways / Pharmacy Networks"
    description: "Sends national-standard e-prescriptions"
    technology: "mTLS APIs using HL7 FHIR and national standards"
  - source: "Compliance / Regulatory Officers & External Regulatory Auditors"
    destination: "Cross-Border Telehealth Platform"
    description: "Access audit logs for accountability"
    technology: "HTTPS/SFTP"