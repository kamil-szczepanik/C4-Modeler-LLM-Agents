level: component
scope: "Component diagram for the Spring Boot Core Telehealth Service container"
parentContainer:
  name: "Spring Boot Core Telehealth Service"
elements:
  - type: "component"
    name: "Telehealth Controller"
    technology: "Spring MVC / REST"
    description: "Exposes secure endpoints for telehealth consultations and video session management."
  - type: "component"
    name: "Telehealth Service"
    technology: "Java / Spring Boot"
    description: "Implements core enterprise workflows and business logic for telehealth operations."
  - type: "component"
    name: "Security Manager"
    technology: "Spring Security & OAuth2"
    description: "Enforces token-based authentication, role-based access control, and mTLS verification."
relationships:
  - source: "Telehealth Controller"
    destination: "Security Manager"
    description: "Validates incoming requests via OAuth2"
  - source: "Telehealth Controller"
    destination: "Telehealth Service"
    description: "Delegates business logic execution"