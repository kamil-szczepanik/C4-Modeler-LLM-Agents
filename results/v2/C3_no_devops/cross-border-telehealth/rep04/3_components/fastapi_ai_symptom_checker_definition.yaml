level: component
scope: "Component diagram for the FastAPI AI Symptom Checker container"
parentContainer:
  name: "FastAPI AI Symptom Checker"
elements:
  - type: "component"
    name: "API Router / Controller"
    technology: "Python 3.11+, FastAPI, gRPC"
    description: "Handles incoming gRPC requests using protocol buffers."
  - type: "component"
    name: "Consent & Region Enforcer Middleware"
    technology: "Python 3.11+, FastAPI Middleware"
    description: "Validates data residency headers and consent tokens."
  - type: "component"
    name: "Inference Orchestrator"
    technology: "Python 3.11+"
    description: "Manages calls to the Third-Party AI Model Provider and validates response integrity."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Python 3.11+, GCP Cloud KMS"
    description: "Asynchronously writes signed immutable audit trails to GCP Cloud Pub/Sub."
  - type: "component"
    name: "Guardrail & Localization Interceptor"
    technology: "Python 3.11+"
    description: "Appends localized clinical disclaimers and urgency-based calls-to-action."
relationships:
  - source: "Kong API Gateway/BFF"
    destination: "API Router / Controller"
    description: "Routes symptom check requests via gRPC over mTLS using Anthos Service Mesh."
  - source: "Inference Orchestrator"
    destination: "Third-Party AI Model Provider"
    description: "Transmits sanitized payloads over TLS 1.3 with payload encryption."
  - source: "Audit Logger Component"
    destination: "GCP Cloud Pub/Sub"
    description: "Publishes cryptographically signed audit logs asynchronously."