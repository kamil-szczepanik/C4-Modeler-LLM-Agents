level: component
scope: "Component diagram for the Node.js/Go Billing & Localization Container container"
parentContainer:
  name: "Node.js/Go Billing & Localization Container"
elements:
  - type: "component"
    name: "API Router / Handler Module"
    technology: "Go"
    description: "High-throughput API routing and processing for billing and localization workflows."
  - type: "component"
    name: "Localization & Tax Engine"
    technology: "Node.js"
    description: "Evaluates regional tax rules and manages localization workflows."
  - type: "component"
    name: "Payment Gateway Integration Adapter"
    technology: "Go"
    description: "Processes secure charges and executes cross-border multi-currency transactions."
  - type: "component"
    name: "Billing Audit & Reconciliation Exporter"
    technology: "Go"
    description: "Publishes transaction success/failure events and handles asynchronous event processing."
  - type: "component"
    name: "Kong API Gateway/BFF"
    technology: "Kong API Gateway"
    description: "API Gateway and Backend for Frontend routing requests."
  - type: "component"
    name: "GCP Cloud SQL (PostgreSQL)"
    technology: "GCP Cloud SQL (PostgreSQL)"
    description: "Region-pinned relational data persistence with CMEK encryption."
  - type: "component"
    name: "GCP Cloud Pub/Sub"
    technology: "GCP Cloud Pub/Sub"
    description: "Asynchronous event messaging for billing audit logs."
  - type: "component"
    name: "GCP Secret Manager"
    technology: "GCP Secret Manager"
    description: "Dynamic runtime injection of API keys and webhook secrets."
  - type: "component"
    name: "External Payment Providers"
    technology: "Stripe, SEPA"
    description: "External systems for processing secure charges."
relationships:
  - source: "Kong API Gateway/BFF"
    destination: "API Router / Handler Module"
    description: "Processes billing and localization workflows [gRPC / Anthos Service Mesh (mTLS)]"
  - source: "Localization & Tax Engine"
    destination: "Payment Gateway Integration Adapter"
    description: "Forwards calculated totals for transaction execution [Internal Function Call / Channel]"
  - source: "Payment Gateway Integration Adapter"
    destination: "External Payment Providers"
    description: "Processes secure charges [HTTPS / REST with TLS 1.3]"
  - source: "Payment Gateway Integration Adapter"
    destination: "Billing Audit & Reconciliation Exporter"
    description: "Publishes transaction success/failure events [GCP Cloud Pub/Sub]"
  - source: "Billing Audit & Reconciliation Exporter"
    destination: "GCP Cloud SQL (PostgreSQL)"
    description: "Persists reconciled ledger data with CMEK [PostgreSQL Protocol]"