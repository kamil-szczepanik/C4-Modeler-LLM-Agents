level: component
scope: "Component diagram for the Java Consent Management Service container"
parentContainer:
  name: "Java Consent Management Service"
elements:
  - type: "component"
    name: "Consent Controller"
    technology: "Spring MVC / gRPC"
    description: "Handles API requests and validates PASETO tokens and consents."
  - type: "component"
    name: "Consent Policy Engine"
    technology: "Spring Domain Logic"
    description: "Enforces granular, jurisdiction-aware consent policies."
  - type: "component"
    name: "Audit & Cryptographic Proof Component"
    technology: "Spring Data JPA & Google Tink"
    description: "Generates tamper-evident audit trails and handles cryptographic operations."
  - type: "component"
    name: "Consent Rule Repository"
    technology: "Spring Cache / Redis"
    description: "Provides in-memory caching for sub-millisecond policy evaluations."
  - type: "component"
    name: "GCP Cloud SQL (PostgreSQL)"
    technology: "PostgreSQL"
    description: "Stores encrypted audit metadata and consent records with row-level security."
  - type: "component"
    name: "GCP Cloud Pub/Sub"
    technology: "Pub/Sub Protocol"
    description: "Broadcasts instant revocation events."
  - type: "component"
    name: "GCP Cloud KMS"
    technology: "Cloud KMS"
    description: "Manages cryptographic keys and token signing/verification."
relationships:
  - source: "Kong API Gateway/BFF"
    destination: "Consent Controller"
    description: "Validates tokens and consents [gRPC / Anthos Service Mesh (mTLS)]"
  - source: "Consent Policy Engine"
    destination: "GCP Cloud KMS"
    description: "Signs and verifies cryptographic PASETO tokens [gRPC / IAM]"
  - source: "Consent Policy Engine"
    destination: "GCP Cloud Pub/Sub"
    description: "Broadcasts instant revocation events [gRPC / Pub/Sub Protocol]"
  - source: "Audit & Cryptographic Proof Component"
    destination: "GCP Cloud SQL (PostgreSQL)"
    description: "Stores encrypted audit metadata and consent records [PostgreSQL Protocol with CMEK]"