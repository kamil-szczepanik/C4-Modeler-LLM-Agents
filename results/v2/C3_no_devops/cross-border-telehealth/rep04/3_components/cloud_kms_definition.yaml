level: component
scope: "Component diagram for the Cloud KMS container"
parentContainer:
  name: "Cloud KMS"
elements:
  - type: "component"
    name: "Key Management Interface"
    technology: "REST/gRPC API"
    description: "Exposes endpoints for cryptographic operations like encryption and decryption."
  - type: "component"
    name: "Regional Key Rings & CryptoKeys"
    technology: "Cloud HSM / GCP Cryptographic Material (`europe-west3-keyring`, `us-central1-keyring`)"
    description: "Manages isolated regional cryptographic keys for EU and US data residency."
  - type: "component"
    name: "IAM & Access Policy Enforcer"
    technology: "GCP IAM"
    description: "Enforces the principle of least privilege and condition-based regional access policies."
  - type: "component"
    name: "Audit Logging Emitter"
    technology: "GCP Audit Logging"
    description: "Emits immutable audit logs to ensure regulatory compliance and accountability."
  - type: "component"
    name: "Key Recovery & Rotation Manager"
    technology: "Internal GCP control plane / MPA Console"
    description: "Handles emergency key restoration and scheduled rotation requests."
relationships:
  - source: "Spring Boot Core Telehealth Service"
    destination: "Key Management Interface"
    description: "Encrypts/Decrypts PHI using CMEK [gRPC/HTTPS]"
  - type: "Compliance / Regulatory Officers"
    destination: "Key Recovery & Rotation Manager"
    description: "Approves emergency key restoration or rotation requests [GCP IAM/MPA Console/API]"
  - type: "Key Recovery & Rotation Manager"
    destination: "Regional Key Rings & CryptoKeys"
    description: "Rotates and restores cryptographic material [Internal GCP control plane]"