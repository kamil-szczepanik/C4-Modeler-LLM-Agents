level: component
scope: "Component diagram for the Node.js E-Prescription Service container"
parentContainer:
  name: "Node.js E-Prescription Service"
elements:
  - type: "component"
    name: "Prescription API Controller"
    technology: "Express.js / Fastify, Node.js & TypeScript"
    description: "Handles gRPC/HTTP traffic and routes e-prescription requests."
  - type: "component"
    name: "Prescription Domain Service"
    technology: "Node.js & TypeScript"
    description: "Invokes domain logic for prescription management."
  - type: "component"
    name: "Gateway Integration Adapter"
    technology: "Node.js & TypeScript"
    description: "Delegates external transmission to national gateways."
  - type: "component"
    name: "Outbox Event Publisher"
    technology: "Node.js & TypeScript"
    description: "Persists events for asynchronous processing."
  - type: "component"
    name: "Prescription Status Component"
    technology: "Node.js & TypeScript, Prisma / TypeORM"
    description: "Manages state and metadata."
relationships:
  - source: "Kong API Gateway"
    destination: "Prescription API Controller"
    description: "Routes e-prescription requests [gRPC / Anthos Service Mesh with mTLS]"
  - source: "Prescription API Controller"
    destination: "Prescription Domain Service"
    description: "Invokes domain logic [In-process, Function Call]"
  - source: "Prescription Domain Service"
    destination: "Gateway Integration Adapter"
    description: "Delegates external transmission [In-process]"
  - source: "Gateway Integration Adapter"
    destination: "National E-Prescription Gateways and Pharmacy Networks"
    description: "Transmits prescriptions [HL7 FHIR / National Standards over mTLS]"
  - source: "Prescription Domain Service"
    destination: "Outbox Event Publisher"
    description: "Persists events for asynchronous processing [In-process]"
  - source: "Outbox Event Publisher"
    destination: "GCP Cloud Pub/Sub"
    description: "Publishes prescription events [GCP Pub/Sub API]"
  - source: "Prescription Status Component"
    destination: "GCP Cloud SQL (PostgreSQL)"
    description: "Manages state and metadata [PostgreSQL Protocol over TLS, CMEK encrypted]"