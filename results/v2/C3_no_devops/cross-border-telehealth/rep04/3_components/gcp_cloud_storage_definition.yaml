level: component
scope: "Component diagram for the GCP Cloud Storage container"
parentContainer:
  name: "GCP Cloud Storage"
elements:
  - type: "component"
    name: "Object Storage Engine"
    technology: "GCP Cloud Storage (Regional Buckets: telehealth-eu-bucket in europe-west3, telehealth-us-bucket in us-central1)"
    description: "Object storage for medical assets, utilizing regional bucket isolation for data residency."
  - type: "component"
    name: "CMEK Encryption Manager"
    technology: "GCP Cloud KMS (Key Rings)"
    description: "Customer-Managed Encryption Keys (CMEK) for region-locked encryption and crypto-shredding."
  - type: "component"
    name: "Lifecycle & Purging Hook"
    technology: "GCS Lifecycle API"
    description: "Manages object lifecycle and data purging according to retention policies."
  - type: "component"
    name: "Resilient Upload/Download Manager"
    technology: "GCS Resumable Uploads & Signed URLs"
    description: "Enables fault-tolerant media transfers for unstable rural connections."
relationships:
  - source: "Resilient Upload/Download Manager"
    destination: "CMEK Encryption Manager"
    description: "Internal GCP IPC"
  - source: "CMEK Encryption Manager"
    destination: "Object Storage Engine"
    description: "Internal GCP IPC"
  - source: "Lifecycle & Purging Hook"
    destination: "Object Storage Engine"
    description: "GCS Lifecycle API"