level: component
scope: "Component diagram for the Kong API Gateway/BFF container"
parentContainer:
  name: "Kong API Gateway/BFF"
elements:
  - type: "component"
    name: "Geo-Routing"
    technology: "Kong Plugin / Edge Routing"
    description: "Enforces strict regional data residency by routing EU and US requests to appropriate regional endpoints."
  - type: "component"
    name: "JWT/OIDC Interceptor"
    technology: "Kong Security Plugin / OAuth2/OIDC"
    description: "Validates incoming tokens, OAuth2 credentials, and DPoP headers from client applications."
  - type: "component"
    name: "Payload Compression"
    technology: "Kong Optimization Plugin"
    description: "Optimizes payload sizes to ensure reliable telehealth access for rural patients with unstable connections."
  - type: "component"
    name: "Header Enrichment"
    technology: "Kong Transformation Plugin"
    description: "Injects and enriches request headers for downstream internal services."
relationships:
  - source: "Geo-Routing"
    destination: "JWT/OIDC Interceptor"
    description: "Passes routed requests for authentication [HTTPS]"
  - source: "JWT/OIDC Interceptor"
    destination: "Payload Compression"
    description: "Forwards authenticated requests for optimization [Internal]"
  - source: "Payload Compression"
    destination: "Header Enrichment"
    description: "Passes optimized payloads for header injection [Internal]"
  - source: "Header Enrichment"
    destination: "Spring Boot Core Telehealth Service"
    description: "Routes core telehealth requests [gRPC / mTLS via Anthos Service Mesh]"
  - source: "Header Enrichment"
    destination: "FastAPI AI Symptom Checker"
    description: "Routes symptom check requests [gRPC / mTLS via Anthos Service Mesh]"
  - source: "Header Enrichment"
    destination: "Node.js E-Prescription Service"
    description: "Routes e-prescription requests [gRPC / mTLS via Anthos Service Mesh]"
  - source: "Header Enrichment"
    destination: "Java Consent Management Service"
    description: "Validates consent and tokens [gRPC / mTLS via Anthos Service Mesh]"
  - source: "Header Enrichment"
    destination: "Node.js/Go Billing & Localization Container"
    description: "Forwards localized requests [gRPC / mTLS via Anthos Service Mesh]"