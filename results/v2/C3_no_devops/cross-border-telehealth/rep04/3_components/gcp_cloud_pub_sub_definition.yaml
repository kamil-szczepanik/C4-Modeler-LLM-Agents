level: component
scope: "Component diagram for the GCP Cloud Pub/Sub container"
parentContainer:
  name: "GCP Cloud Pub/Sub"
elements:
  - type: "component"
    name: "Regional Pub/Sub Topics & Subscriptions"
    technology: "GCP Cloud Pub/Sub"
    description: "Asynchronous messaging backbone for decoupled, at-least-once event processing across regions."
  - type: "component"
    name: "Cloud KMS Encryption Engine"
    technology: "Cloud KMS"
    description: "Customer-Managed Encryption Keys (CMEK) and 90-day rotation for regional envelope encryption."
  - type: "component"
    name: "Dead Letter Queues"
    technology: "GCP Cloud Pub/Sub DLQ"
    description: "Routes undeliverable events via internal GCP routing to ensure reliable delivery."
  - type: "component"
    name: "Schema Registry"
    technology: "GCP Pub/Sub Schema Registry"
    description: "Validates event payloads prior to publishing via gRPC, TLS 1.3."
  - type: "component"
    name: "IAM Policy Enforcement Engine"
    technology: "GCP IAM"
    description: "Role-based access control and strict regional service account segregation, authorizing subscriber pulls."
relationships:
  - source: "Regional Pub/Sub Topics & Subscriptions"
    destination: "Dead Letter Queues"
    description: "Routes undeliverable events via internal GCP routing"
  - source: "Regional Pub/Sub Topics & Subscriptions"
    destination: "IAM Policy Enforcement Engine"
    description: "Authorizes subscriber pulls via GCP IAM API"