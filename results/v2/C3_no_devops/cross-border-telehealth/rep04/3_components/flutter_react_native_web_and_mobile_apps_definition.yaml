level: component
scope: "Component diagram for the Flutter/React Native Web and Mobile Apps container"
parentContainer:
  name: "Flutter/React Native Web and Mobile Apps"
elements:
  - type: "component"
    name: "Region & Compliance Gateway Client"
    technology: "Flutter / React Native Module"
    description: "Handles regional routing, data residency enforcement, and GDPR/HIPAA compliance validation on the client side."
  - type: "component"
    name: "Offline Resilience Store"
    technology: "SQLite / MMKV with SQLCipher AES-256"
    description: "Secures local data caching backed by Android Keystore and iOS Keychain for low-bandwidth rural environments."
  - type: "component"
    name: "WebRTC Media Client"
    technology: "WebRTC, SRTP, DTLS-SRTP"
    description: "Manages adaptive video streaming and real-time communication via ICE/TURN over UDP with TCP/TLS fallback."
  - type: "component"
    name: "AI/MDR Interaction Module"
    technology: "Flutter / React Native Module"
    description: "Interfaces with the AI symptom checker and supports EU MDR traceability requirements."
  - type: "component"
    name: "State Synchronizer Component"
    technology: "Flutter / React Native Module"
    description: "Synchronizes local offline state with backend services when network connectivity is restored."
relationships:
  - source: "Region & Compliance Gateway Client"
    destination: "Kong API Gateway/BFF"
    description: "Sends API requests and auth via HTTPS / WebSockets with Certificate Pinning."
  - source: "WebRTC Media Client"
    destination: "Kong API Gateway"
    description: "Streams adaptive video via ICE/TURN over UDP with TCP/TLS fallback and SRTP/DTLS-SRTP."
  - source: "State Synchronizer Component"
    destination: "Offline Resilience Store"
    description: "Reads and writes cached offline data securely using SQLCipher AES-256."