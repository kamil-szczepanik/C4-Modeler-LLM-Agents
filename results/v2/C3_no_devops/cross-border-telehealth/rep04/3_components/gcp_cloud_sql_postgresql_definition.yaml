level: component
scope: "Component diagram for the GCP Cloud SQL (PostgreSQL) container"
parentContainer:
  name: "GCP Cloud SQL (PostgreSQL)"
elements:
  - type: "component"
    name: "EU Regional Database Instance"
    technology: "PostgreSQL v15+ with GCP Cloud SQL"
    description: "Stores isolated relational health, consent, e-prescription, and billing data for EU patients in compliance with GDPR."
  - type: "component"
    name: "US Regional Database Instance"
    technology: "PostgreSQL v15+ with GCP Cloud SQL"
    description: "Stores isolated relational health, consent, e-prescription, and billing data for US patients in compliance with HIPAA."
  - type: "component"
    name: "PgBouncer Connection Pooler"
    technology: "PgBouncer"
    description: "Manages and optimizes ephemeral microservice connections to the regional PostgreSQL instances."
  - type: "component"
    name: "Audit Logging Extension"
    technology: "PostgreSQL pgaudit Extension"
    description: "Provides detailed logging of DDL and DML operations for PHI/PII regulatory compliance."
relationships:
  - source: "Spring Boot Core Telehealth Service"
    destination: "EU Regional Database Instance"
    description: "Reads/writes relational health data [PostgreSQL Protocol with CMEK, TLS 1.3]"
  - source: "Spring Boot Core Telehealth Service"
    destination: "US Regional Database Instance"
    description: "Reads/writes relational health data [PostgreSQL Protocol with CMEK, TLS 1.3]"
  - source: "FastAPI AI Symptom Checker"
    destination: "EU Regional Database Instance"
    description: "Persists AI recommendations and inputs [PostgreSQL Protocol with TLS 1.3, CMEK]"
  - source: "FastAPI AI Symptom Checker"
    destination: "US Regional Database Instance"
    description: "Persists AI recommendations and inputs [PostgreSQL Protocol with TLS 1.3, CMEK]"
  - source: "Node.js E-Prescription Service"
    destination: "EU Regional Database Instance"
    description: "Persists e-prescription audit trails [PostgreSQL Protocol with TLS 1.3, Cloud SQL IAM Auth]"
  - source: "Node.js E-Prescription Service"
    destination: "US Regional Database Instance"
    description: "Persists e-prescription audit trails [PostgreSQL Protocol with TLS 1.3, Cloud SQL IAM Auth]"
  - source: "Java Consent Management Service"
    destination: "EU Regional Database Instance"
    description: "Stores consent records and audit metadata [PostgreSQL Protocol with CMEK]"
  - source: "Java Consent Management Service"
    destination: "US Regional Database Instance"
    description: "Stores consent records and audit metadata [PostgreSQL Protocol with CMEK]"
  - source: "Node.js/Go Billing & Localization Container"
    destination: "EU Regional Database Instance"
    description: "Persists billing and regional configs [PostgreSQL Protocol with CMEK]"
  - source: "Node.js/Go Billing & Localization Container"
    destination: "US Regional Database Instance"
    description: "Persists billing and regional configs [PostgreSQL Protocol with CMEK]"