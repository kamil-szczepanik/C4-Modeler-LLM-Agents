level: component
scope: "Component diagram for the Web & Mobile Client Apps container"
parentContainer:
  name: "Web & Mobile Client Apps"
elements:
  - type: "component"
    name: "Adaptive Media Component"
    technology: "WebRTC, SRTP, DTLS"
    description: "Handles adaptive media streaming and connects to the WebRTC SFU Media Relay for video consultations."
  - type: "component"
    name: "Consent & Routing State Manager"
    technology: "Client-side state management"
    description: "Manages regional consent and routing states to enforce strict data residency for EU and US patients."
  - type: "component"
    name: "Symptom Checker UI & Audit Logger"
    technology: "Flutter / React Native UI"
    description: "Provides the user interface for the AI symptom checker and logs audit events securely."
  - type: "component"
    name: "Offline-First Storage Engine"
    technology: "SQLCipher, iOS Keychain, Android Keystore"
    description: "Provides client-side encryption at rest, secure enclave storage, and low-bandwidth resilience for offline usage."
relationships:
  - source: "Adaptive Media Component"
    destination: "WebRTC SFU Media Relay"
    description: "Streams encrypted video consultations via WebRTC, SRTP, and DTLS"
  - source: "Consent & Routing State Manager"
    destination: "API Gateway"
    description: "Sends secure requests via HTTPS and GraphQL over TLS 1.3"
  - source: "Symptom Checker UI & Audit Logger"
    destination: "API Gateway"
    description: "Sends secure requests via HTTPS and GraphQL over TLS 1.3"
  - source: "Offline-First Storage Engine"
    destination: "API Gateway"
    description: "Syncs data securely via HTTPS and GraphQL over TLS 1.3"