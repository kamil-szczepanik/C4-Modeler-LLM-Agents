level: component
scope: "Component diagram for the Interoperability & E-Prescription Service container"
parentContainer:
  name: "Interoperability & E-Prescription Service"
elements:
  - type: "component"
    name: "FHIR & National Standard Transformer"
    technology: "TypeScript"
    description: "Transforms e-prescription data between FHIR and national standards."
  - type: "component"
    name: "Gateway Dispatcher & Circuit Breaker"
    technology: "TypeScript / Resilience4js"
    description: "Exchanges e-prescription data with external networks and provides circuit breaking."
  - type: "component"
    name: "Dispensation Event Poller / Webhook Handler"
    technology: "Node.js"
    description: "Handles dispensation event webhooks and publishes status updates to the core service."
  - type: "component"
    name: "Compliance Audit Logger"
    technology: "TypeScript"
    description: "Enforces compliance audit logging for HIPAA and GDPR accountability."
relationships:
  - source: "Gateway Dispatcher & Circuit Breaker"
    destination: "EU/US Networks"
    description: "Exchanges e-prescription data [HTTPS / REST, HL7 FHIR and EU standards with TLS 1.3 & mTLS]"
  - source: "Dispensation Event Poller / Webhook Handler"
    destination: "Core Telehealth Service"
    description: "Publishes status updates [gRPC]"