level: component
scope: "Component diagram for the Data & Security Layer container"
parentContainer:
  name: "Data & Security Layer"
elements:
  - type: "component"
    name: "Cloud SQL PostgreSQL"
    technology: "Cloud SQL with PostgreSQL"
    description: "Provides relational data storage with Row-Level Security (RLS) and encrypted connections."
  - type: "component"
    name: "Cloud Storage"
    technology: "GCP Cloud Storage"
    description: "Object storage used in conjunction with WORM Bucket Lock for tamper-proof audit logs."
  - type: "component"
    name: "GCP Cloud KMS"
    technology: "GCP Cloud KMS & CMEK"
    description: "Manages AES-256 encryption at rest with automatic 90-day key rotation."
  - type: "component"
    name: "GCP Service Mesh with Istio"
    technology: "Istio Service Mesh"
    description: "Enforces service-to-service mTLS authorization and secure communications."
  - type: "component"
    name: "OPA Engine"
    technology: "Open Policy Agent (OPA)"
    description: "Enforces real-time consent and authorization policies."
  - type: "component"
    name: "WORM Bucket Lock"
    technology: "Cloud Storage WORM"
    description: "Ensures tamper-proof audit logs for EU MDR traceability."
  - type: "component"
    name: "Data Portability Exporter"
    technology: "GCP Data Portability Exporter"
    description: "Handles data export requests to ensure data portability compliance."
relationships:
  - source: "GCP Service Mesh with Istio"
    destination: "OPA Engine"
    description: "Queries for real-time consent and authorization decisions"
  - source: "Cloud SQL PostgreSQL"
    destination: "GCP Cloud KMS"
    description: "Utilizes keys for encryption at rest"
  - source: "WORM Bucket Lock"
    destination: "Cloud Storage"
    description: "Applies compliance locks to audit log buckets"