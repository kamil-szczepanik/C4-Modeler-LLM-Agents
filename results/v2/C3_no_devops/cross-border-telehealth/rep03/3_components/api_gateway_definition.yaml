level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Geo-Routing & Context Filter"
    technology: "Google Cloud API Gateway / Apigee with Envoy"
    description: "Handles geo-routing, regional request distribution, and context filtering."
  - type: "component"
    name: "OAuth2/JWT Validator"
    technology: "Google Cloud API Gateway / Apigee"
    description: "Validates OAuth2 tokens and JSON Web Tokens for incoming requests."
  - type: "component"
    name: "Rate Limiting & Resiliency Component"
    technology: "Google Cloud API Gateway / Apigee"
    description: "Enforces rate limits and provides resiliency mechanisms for traffic management."
  - type: "component"
    name: "Localization & Header Injector Component"
    technology: "Google Cloud API Gateway / Apigee"
    description: "Injects localization settings and custom headers into requests."
  - type: "component"
    name: "Gateway Audit & Telemetry Component"
    technology: "Google Cloud API Gateway / Apigee"
    description: "Captures audit logs and telemetry data for gateway traffic."
  - type: "component"
    name: "WAF module"
    technology: "Google Cloud Armor / WAF"
    description: "Provides Web Application Firewall protection against common web threats."
relationships:
  - source: "Geo-Routing & Context Filter"
    destination: "Core Telehealth Service"
    description: "Routes requests regionally [gRPC with mTLS via Istio]"
  - source: "Geo-Routing & Context Filter"
    destination: "AI Symptom Checker Service"
    description: "Routes symptom check requests [gRPC with mTLS via Istio, with injected telemetry headers]"
  - source: "Localization & Header Injector Component"
    destination: "Interoperability & E-Prescription Service"
    description: "Routes interoperability requests [gRPC with mTLS via Istio]"