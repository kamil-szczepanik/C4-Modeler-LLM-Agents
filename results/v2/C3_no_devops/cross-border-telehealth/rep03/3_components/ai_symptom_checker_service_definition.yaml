level: component
scope: "Component diagram for the AI Symptom Checker Service container"
parentContainer:
  name: "AI Symptom Checker Service"
elements:
  - type: "component"
    name: "Symptom Analysis API Controller"
    technology: "FastAPI Router"
    description: "Handles incoming symptom analysis requests via gRPC."
  - type: "component"
    name: "Consent & Resilience Middleware"
    technology: "Python Middleware"
    description: "Validates consent tokens and ensures resilience under unstable network conditions."
  - type: "component"
    name: "Inference Orchestrator"
    technology: "Python Container"
    description: "Orchestrates regional routing to external AI inference providers."
  - type: "component"
    name: "Audit & Traceability Logger"
    technology: "SQLAlchemy / GCP Cloud KMS (CMEK)"
    description: "Logs audit trails and ensures traceability for EU MDR compliance with encrypted storage."
  - type: "component"
    name: "Clinical Handoff Formatter"
    technology: "Python / gRPC"
    description: "Formats and delivers clinical handoffs to licensed clinicians and core telehealth services."
relationships:
  - source: "Web & Mobile Client Apps"
    destination: "Symptom Analysis API Controller"
    description: "Sends symptom analysis requests via gRPC with mTLS over GCP Service Mesh"
  - source: "Consent & Resilience Middleware"
    destination: "Data & Security Layer"
    description: "Validates consent tokens"
  - source: "Inference Orchestrator"
    destination: "External AI Inference Provider"
    description: "Routes inference requests regionally (europe-west3 / us-central1)"
  - source: "Audit & Traceability Logger"
    destination: "Cloud SQL (PostgreSQL)"
    description: "Persists audit logs using SQLAlchemy with CMEK encryption"
  - source: "Clinical Handoff Formatter"
    destination: "Core Telehealth Service"
    description: "Transmits clinical handoffs via gRPC"