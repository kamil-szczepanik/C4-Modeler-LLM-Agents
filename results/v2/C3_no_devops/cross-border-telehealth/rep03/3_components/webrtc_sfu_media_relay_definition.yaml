level: component
scope: "Component diagram for the WebRTC SFU Media Relay container"
parentContainer:
  name: "WebRTC SFU Media Relay"
elements:
  - type: "component"
    name: "SFU Core Router"
    technology: "Go / LiveKit SDK"
    description: "High concurrency router handling WebRTC media streams."
  - type: "component"
    name: "Adaptive Bitrate (ABR) Controller"
    technology: "Go"
    description: "Controls adaptive bitrate for video consultations."
  - type: "component"
    name: "Media Auth & Token Validator"
    technology: "Go"
    description: "Issues and verifies session tokens for secure access."
  - type: "component"
    name: "Telemetry & Audit Exporter"
    technology: "Go"
    description: "Exports QoS metrics and anonymized session metadata."
relationships:
  - source: "Adaptive Bitrate (ABR) Controller"
    destination: "Telemetry & Audit Exporter"
    description: "Publishes QoS metrics [In-memory channel]"