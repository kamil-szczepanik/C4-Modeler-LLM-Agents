level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients in the EU and US using the platform for consultations and symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals conducting video consultations and issuing e-prescriptions."
  - type: "person"
    name: "Pharmacy Staff"
    description: "Staff fulfilling e-prescriptions securely."
  - type: "person"
    name: "Platform Administrators / Compliance Officers"
    description: "Personnel overseeing regulatory compliance, security, and administration."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways and US Pharmacy Networks"
    description: "External systems for processing cross-border e-prescriptions."
  - type: "container"
    name: "Web & Mobile Client Apps"
    technology: "Flutter / React Native"
    description: "Mobile-first, low-bandwidth optimized client applications for patients and clinicians."
  - type: "container"
    name: "API Gateway"
    technology: "Google Cloud API Gateway / Apigee"
    description: "Manages edge routing, security, and traffic to core microservices."
  - type: "container"
    name: "Core Telehealth Service"
    technology: "Spring Boot / Java"
    description: "Handles core business logic for telehealth operations."
  - type: "container"
    name: "AI Symptom Checker Service"
    technology: "FastAPI / Python"
    description: "Provides AI-powered symptom analysis for users."
  - type: "container"
    name: "Interoperability & E-Prescription Service"
    technology: "Node.js"
    description: "Translates payloads to HL7 FHIR and EU e-prescription standards."
  - type: "container"
    name: "WebRTC SFU Media Relay"
    technology: "LiveKit on GKE"
    description: "Handles real-time video and audio media streaming."
  - type: "container"
    name: "Data & Security Layer"
    technology: "Cloud SQL (PostgreSQL), Cloud Storage, GCP Cloud KMS, GCP Service Mesh (Istio)"
    description: "Provides regional data storage, encryption, and secure service mesh networking."
relationships:
  - source: "Patients"
    destination: "Web & Mobile Client Apps"
    description: "Interacts with the platform for consultations and AI symptom checking"
    technology: "HTTPS / WebSockets"
  - source: "Licensed Clinicians"
    destination: "Web & Mobile Client Apps"
    description: "Conducts consultations and manages e-prescriptions"
    technology: "HTTPS / WebSockets"
  - source: "Pharmacy Staff"
    destination: "Web & Mobile Client Apps"
    description: "Accesses prescription data"
    technology: "HTTPS"
  - source: "Platform Administrators / Compliance Officers"
    destination: "Web & Mobile Client Apps"
    description: "Monitors platform compliance and administration"
    technology: "HTTPS"
  - source: "Web & Mobile Client Apps"
    destination: "API Gateway"
    description: "Sends API requests and queries"
    technology: "HTTPS and GraphQL over TLS 1.3"
  - source: "API Gateway"
    destination: "Core Telehealth Service"
    description: "Routes requests internally"
    technology: "gRPC with mTLS via GCP Service Mesh"
  - source: "API Gateway"
    destination: "AI Symptom Checker Service"
    description: "Routes symptom check requests"
    technology: "gRPC with mTLS via GCP Service Mesh"
  - source: "API Gateway"
    destination: "Interoperability & E-Prescription Service"
    description: "Routes interoperability requests"
    technology: "gRPC with mTLS via GCP Service Mesh"
  - source: "Web & Mobile Client Apps"
    destination: "WebRTC SFU Media Relay"
    description: "Streams video consultations"
    technology: "WebRTC, SRTP, DTLS"
  - source: "Core Telehealth Service"
    destination: "Data & Security Layer"
    description: "Persists and retrieves encrypted telehealth data"
    technology: "Encrypted PostgreSQL connections via Cloud KMS"
  - source: "Interoperability & E-Prescription Service"
    destination: "EU National E-Prescription Gateways and US Pharmacy Networks"
    description: "Exchanges e-prescription data"
    technology: "HL7 FHIR (US) and EU e-prescription standards"