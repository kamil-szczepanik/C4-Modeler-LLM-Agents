level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US while ensuring strict medical and privacy compliance."
elements:
  - type: "person"
    name: "Patients and Licensed Clinicians"
    description: "Primary users who conduct video consultations, use the AI symptom checker, and manage e-prescriptions."
  - type: "externalSystem"
    name: "Pharmacies and National/State Health Authorities"
    description: "External partners handling localized prescription fulfillment and health reporting."
  - type: "externalSystem"
    name: "Regulatory Authorities"
    description: "Bodies enforcing EU MDR and US HHS compliance."
  - type: "externalSystem"
    name: "Regional Payment Gateways"
    description: "Stripe and Adyen regional instances handling payment processing."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways and US Pharmacy Networks"
    description: "External networks for cross-border e-prescription interoperability."
  - type: "externalSystem"
    name: "EU/US Identity Providers and AI Inference Provider"
    description: "External identity services for federated authentication and AI providers for symptom checking."
relationships:
  - source: "Patients and Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses consultations and platform features via low-bandwidth optimized connections"
    technology: "HTTPS and WebSockets"
  - source: "Cross-Border Telehealth Platform"
    destination: "EU National E-Prescription Gateways and US Pharmacy Networks"
    description: "Transmits e-prescription data securely"
    technology: "HTTPS / REST with mTLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Regional Payment Gateways"
    description: "Processes payments regionally"
    technology: "HTTPS / REST"