level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides secure video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and the US using a dual-region GCP architecture."
elements:
  - type: "person"
    name: "Patients (EU & US)"
    description: "Patients located in the EU and US who use the platform for video consultations and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals who conduct secure video consultations and issue e-prescriptions via the platform."
  - type: "externalSystem"
    name: "Pharmacies (EU & US)"
    description: "External partner systems receiving regional e-prescriptions."
  - type: "externalSystem"
    name: "External AI Inference Provider / LLM API"
    description: "Provides symptom-checker recommendations and AI triage."
  - type: "externalSystem"
    name: "Identity Providers (IDPs)"
    description: "Regional Auth0 and GCP IAM services for authentication and MFA."
  - type: "externalSystem"
    name: "Billing & Insurance Providers"
    description: "External payment and claims systems."
  - type: "externalSystem"
    name: "Regulatory / Compliance Auditors"
    description: "External stakeholders accessing compliance logs."
relationships:
  - source: "Patients (EU & US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Conduct video consultations and use AI symptom checker"
    technology: "HTTPS / WebSockets"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    destination: "Cross-Border Telehealth Platform"
    description: "Conduct video consultations and manage patient care"
    technology: "HTTPS / WebSockets"
  - source: "Cross-Border Telehealth Platform"
    destination: "Pharmacies (EU & US)"
    description: "Transmit regional e-prescriptions"
    technology: "HL7 FHIR (US) and national standards (EU)"
  - source: "Cross-Border Telehealth Platform"
    destination: "External AI Inference Provider / LLM API"
    description: "Request symptom analysis and urgency recommendations"
    technology: "Secure API calls"
  - source: "Cross-Border Telehealth Platform"
    destination: "Billing & Insurance Providers"
    description: "Process payments and claims"
    technology: "Regional REST APIs with mTLS"
  - source: "Regulatory / Compliance Auditors"
    destination: "Cross-Border Telehealth Platform"
    description: "Access compliance logs for audit purposes"
    technology: "Scoped OAuth tokens and mTLS"