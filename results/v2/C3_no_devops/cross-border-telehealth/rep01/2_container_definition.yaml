level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients located in the EU and US who use the platform for video consultations and the AI symptom checker."
  - type: "person"
    name: "Caregivers"
    description: "Caregivers assisting patients on the platform."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals who conduct secure video consultations and issue e-prescriptions."
  - type: "person"
    name: "Regulatory / Compliance Auditors"
    description: "External stakeholders accessing compliance reports."
  - type: "externalSystem"
    name: "Pharmacies (EU & US)"
    description: "External partner systems receiving regional e-prescriptions."
  - type: "externalSystem"
    name: "External AI Inference Provider / LLM API"
    description: "Provides symptom-checker recommendations and AI triage."
  - type: "externalSystem"
    name: "Identity Providers (IDPs)"
    description: "Regional Auth0 and GCP IAM services for authentication and MFA."
  - type: "externalSystem"
    name: "Billing & Insurance Providers"
    description: "External payment and claims systems."
  - type: "container"
    name: "API Gateway"
    technology: "Cloud Endpoints / Envoy"
    description: "Manages and routes incoming API requests with mTLS via Istio Service Mesh."
  - type: "container"
    name: "Web & Mobile Apps"
    technology: "React / Flutter"
    description: "Provides user interfaces for patients, caregivers, and clinicians with offline-first capabilities."
  - type: "container"
    name: "Core Telehealth Service"
    technology: "Go / Spring Boot"
    description: "Handles core telehealth business logic and coordinates services."
  - type: "container"
    name: "Video Media Server"
    technology: "WebRTC / LiveKit SFU"
    description: "Facilitates real-time secure video consultations."
  - type: "container"
    name: "AI Inference & Audit Service"
    technology: "Python / FastAPI"
    description: "Handles AI symptom checking and audit processing."
  - type: "container"
    name: "Prescription Integration Service"
    technology: "Node.js"
    description: "Manages integration with external pharmacies and e-prescription standards."
  - type: "container"
    name: "Audit & Compliance Reporting Service"
    technology: "Python / BigQuery"
    description: "Generates compliance reports and immutable audit logs."
  - type: "container"
    name: "Regional Databases"
    technology: "Cloud Spanner / Cloud SQL"
    description: "Provides regional data persistence in europe-west3 and us-central1."
relationships:
  - source: "Patients"
    destination: "Web & Mobile Apps"
    description: "Access video consultations and AI symptom checker"
    technology: "HTTPS / REST"
  - source: "Caregivers"
    destination: "Web & Mobile Apps"
    description: "Assist patients using the platform"
    technology: "HTTPS / REST"
  - source: "Licensed Clinicians"
    destination: "Web & Mobile Apps"
    description: "Conduct consultations and manage prescriptions"
    technology: "HTTPS / REST"
  - source: "Web & Mobile Apps"
    destination: "API Gateway"
    description: "Send requests via API Gateway"
    technology: "HTTPS / REST and gRPC over TLS"
  - source: "API Gateway"
    destination: "Core Telehealth Service"
    description: "Route API requests"
    technology: "mTLS via Istio Service Mesh"
  - source: "Core Telehealth Service"
    destination: "Regional Databases"
    description: "Persist and retrieve data"
    technology: "Secure TCP / PostgreSQL via internal VPC connectors"
  - source: "Prescription Integration Service"
    destination: "Pharmacies (EU & US)"
    description: "Transmit e-prescriptions"
    technology: "Cloud Pub/Sub and national e-prescription standards / HL7 FHIR over HTTPS"
  - source: "Video Media Server"
    destination: "Patients"
    description: "Stream video consultations"
    technology: "WebRTC over UDP/TCP"
  - source: "Video Media Server"
    destination: "Licensed Clinicians"
    description: "Stream video consultations"
    technology: "WebRTC over UDP/TCP"
  - source: "AI Inference & Audit Service"
    destination: "External AI Inference Provider / LLM API"
    description: "Request AI symptom analysis"
    technology: "HTTPS API"