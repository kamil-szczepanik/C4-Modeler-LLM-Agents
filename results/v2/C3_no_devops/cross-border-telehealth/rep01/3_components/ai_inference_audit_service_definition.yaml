level: component
scope: "Component diagram for the AI Inference & Audit Service container"
parentContainer:
  name: "AI Inference & Audit Service"
elements:
  - type: "component"
    name: "Inference Orchestrator"
    technology: "Python / FastAPI"
    description: "Handles prompt construction, regional routing, and fallbacks."
  - type: "component"
    name: "Model Version & Metadata Manager"
    technology: "Python"
    description: "Tracks model identifiers, weight hashes, and prompts."
  - type: "component"
    name: "Audit Log Formatter & Writer"
    technology: "Python"
    description: "Generates cryptographically signed audit payloads."
  - type: "component"
    name: "Circuit Breaker & Fallback Policy Engine"
    technology: "Python"
    description: "Manages latency thresholds and deterministic clinical fallbacks."
relationships:
  - source: "Inference Orchestrator"
    destination: "External AI Inference Provider / LLM API"
    description: "Request AI symptom analysis [HTTPS REST with TLS 1.3/mTLS]"
  - source: "Audit Log Formatter & Writer"
    destination: "Regional Local Vault / Buffer"
    description: "Persist signed logs [In-process / SQL]"