level: component
scope: "Component diagram for the Video Media Server container"
parentContainer:
  name: "Video Media Server"
elements:
  - type: "component"
    name: "SFU Core Router"
    technology: "Go / LiveKit component"
    description: "Powers real-time media routing and low-latency handling."
  - type: "component"
    name: "Adaptive Bitrate (ABR) Controller"
    technology: "Go component"
    description: "Manages subscription changes and bandwidth optimization for rural users."
  - type: "component"
    name: "Room & Session Manager"
    technology: "Go component"
    description: "Validates session tokens and manages consultation sessions."
  - type: "component"
    name: "Media Compliance Logger"
    technology: "Go component"
    description: "Writes anonymized session metadata to regional databases."
relationships:
  - source: "ABR Controller"
    destination: "SFU Core Router"
    description: "Command layer subscription changes [Internal Go Channel]"
  - source: "Room & Session Manager"
    destination: "Core Telehealth Service"
    description: "Validate session token [gRPC]"
  - source: "Media Compliance Logger"
    destination: "Regional Databases"
    description: "Write anonymized session metadata [SQL over TLS]"