level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Envoy Lua/Wasm Regional Routing Filter"
    technology: "Envoy / Lua / Wasm"
    description: "Handles regional routing logic for compliance with GDPR and HIPAA."
  - type: "component"
    name: "JWT & Consent Validation Filter"
    technology: "Envoy Filter"
    description: "Validates JSON Web Tokens and user consent at the edge."
  - type: "component"
    name: "Regional Rate Limiter"
    technology: "Envoy / Cloud Memorystore Redis"
    description: "Enforces local rate-limiting using regional cache stores."
  - type: "component"
    name: "Circuit Breaker & Fallback Filter"
    technology: "Envoy Filter"
    description: "Maintains system availability for unstable connections."
  - type: "component"
    name: "Access Log Exporter"
    technology: "Fluent Bit / Cloud Logging API"
    description: "Streams sanitized, PHI-stripped access logs asynchronously."
relationships:
  - source: "Envoy Lua/Wasm Regional Routing Filter"
    destination: "JWT & Consent Validation Filter"
    description: "Passes routed requests for validation [Internal]"
  - source: "JWT & Consent Validation Filter"
    destination: "Regional Rate Limiter"
    description: "Checks rate limits [RESP / TCP]"
  - source: "Regional Rate Limiter"
    destination: "Circuit Breaker & Fallback Filter"
    description: "Evaluates circuit state [Internal]"
  - source: "Circuit Breaker & Fallback Filter"
    destination: "Access Log Exporter"
    description: "Triggers log export [HTTPS]"