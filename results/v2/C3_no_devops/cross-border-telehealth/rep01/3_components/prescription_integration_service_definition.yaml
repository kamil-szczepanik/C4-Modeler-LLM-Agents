level: component
scope: "Component diagram for the Prescription Integration Service container"
parentContainer:
  name: "Prescription Integration Service"
elements:
  - type: "component"
    name: "Prescription API Controller"
    technology: "Node.js / Express"
    description: "Receives prescription commands via gRPC with OAuth 2.0 token propagation and mTLS."
  - type: "component"
    name: "Translation & Mapping Engine"
    technology: "Node.js"
    description: "Translates and maps e-prescriptions for international pharmacies."
  - type: "component"
    name: "Outbound Dispatcher & Adapter Worker"
    technology: "Node.js with BullMQ and opossum Circuit Breaker"
    description: "Transmits mapped payloads over HTTPS with mTLS and TLS 1.3, managing queueing, retries, and circuit-breaking."
  - type: "component"
    name: "Status Webhook Handler"
    technology: "Node.js / Express"
    description: "Handles delivery state changes and publishes events using HMAC/cert-validated webhooks."
  - type: "component"
    name: "Regional Dead-Letter Queue"
    technology: "Cloud SQL with Cloud KMS CMEK"
    description: "Persists failed payloads encrypted with Cloud KMS CMEK."
  - type: "component"
    name: "Cloud Pub/Sub"
    technology: "GCP Cloud Pub/Sub"
    description: "Enables asynchronous event streaming for status updates and failure logging."
  - type: "component"
    name: "Core Telehealth Service"
    technology: "External Container"
    description: "Dispatches prescription commands to the Prescription API Controller."
  - type: "component"
    name: "Pharmacies (EU & US)"
    technology: "External Systems"
    description: "International pharmacies receiving prescription transmissions."
  - type: "component"
    name: "Audit & Compliance Reporting Service"
    technology: "BigQuery"
    description: "Receives immutable audit events for security tracking."
relationships:
  - source: "Core Telehealth Service"
    destination: "Prescription API Controller"
    description: "Dispatches prescription commands via gRPC with OAuth 2.0 token propagation and mTLS"
  - source: "Outbound Dispatcher & Adapter Worker"
    destination: "Pharmacies (EU & US)"
    description: "Transmits mapped payloads over HTTPS with mTLS and TLS 1.3"
  - source: "Status Webhook Handler"
    destination: "Cloud Pub/Sub"
    description: "Publishes delivery state change events using HMAC/cert-validated webhooks"
  - source: "Outbound Dispatcher & Adapter Worker"
    destination: "Regional Dead-Letter Queue"
    description: "Persists failed payloads encrypted with Cloud KMS CMEK"
  - source: "Outbound Dispatcher & Adapter Worker"
    destination: "Audit & Compliance Reporting Service"
    description: "Dispatches immutable audit events for security tracking"