level: component
scope: "Component diagram for the Regional Databases container"
parentContainer:
  name: "Regional Databases"
elements:
  - type: "component"
    name: "EU Regional Database"
    technology: "Google Cloud SQL for PostgreSQL (europe-west3)"
    description: "Stores EU patient data, prescriptions, and audit logs while strictly enforcing regional data residency and isolation for GDPR compliance."
  - type: "component"
    name: "US Regional Database"
    technology: "Google Cloud SQL for PostgreSQL (us-central1)"
    description: "Stores US patient data, prescriptions, and audit logs while strictly enforcing regional data residency and isolation for HIPAA compliance."
relationships:
  - source: "EU Regional Database"
    destination: "US Regional Database"
    description: "No direct runtime replication to maintain strict regional data isolation."