level: component
scope: "Component diagram for the Core Telehealth Service container"
parentContainer:
  name: "Core Telehealth Service"
elements:
  - type: "component"
    name: "Consent & Policy Engine"
    technology: "Embedded Open Policy Agent / OPA library"
    description: "Performs zero-latency, dynamic consent and policy evaluation."
  - type: "component"
    name: "Session Manager"
    technology: "Go component"
    description: "Manages session states and controls media streams and bandwidth thresholds."
  - type: "component"
    name: "Appointment & Routing Coordinator"
    technology: "Go component"
    description: "Coordinates appointments, routing, and triggers prescription alerts."
  - type: "component"
    name: "Notification & Dispatcher Component"
    technology: "Go worker pools"
    description: "Dispatches alerts and prescription notifications via asynchronous channels."
relationships:
  - source: "API Gateway"
    destination: "Consent & Policy Engine"
    description: "Validate incoming requests [gRPC / mTLS]"
  - source: "Session Manager"
    destination: "Video Media Server"
    description: "Control media streams and bandwidth thresholds [gRPC]"
  - source: "Appointment & Routing Coordinator"
    destination: "Notification & Dispatcher Component"
    description: "Trigger prescription alerts [Asynchronous Go channels / Cloud Pub/Sub]"
  - source: "Notification & Dispatcher Component"
    destination: "External Notification Providers"
    description: "Deliver alerts [HTTPS / REST]"
  - source: "Core Telehealth Service"
    destination: "Regional Databases"
    description: "Persist and retrieve data [Secure TCP / PostgreSQL via internal VPC connectors using SPIFFE/SPIRE Workload Identities]"