level: component
scope: "Component diagram for the Audit & Compliance Reporting Service container"
parentContainer:
  name: "Audit & Compliance Reporting Service"
elements:
  - type: "component"
    name: "Audit Event Collector Component"
    technology: "Python / FastAPI"
    description: "Provides immutable audit logging and ingests telemetry from core services via mTLS and gRPC."
  - type: "component"
    name: "Compliance Data Store Component"
    technology: "Google BigQuery"
    description: "Stores audit trails using partitioned datasets with WORM policies for tamper-proof storage and regional data residency."
  - type: "component"
    name: "Report Generation & Dashboard API Component"
    technology: "Python / FastAPI"
    description: "Provides reporting and dashboard APIs accessed by auditors and operations via HTTPS/REST with OAuth2/OIDC."
  - type: "component"
    name: "Compliance Anomaly Detection Component"
    technology: "Python / Cloud Functions"
    description: "Performs real-time anomaly detection to guarantee GDPR, HIPAA, and EU MDR compliance."
relationships:
  - source: "Audit Event Collector Component"
    destination: "Compliance Data Store Component"
    description: "Persists audit events"
  - source: "Report Generation & Dashboard API Component"
    destination: "Compliance Data Store Component"
    description: "Executes regional SQL queries with CMEK"
  - source: "Compliance Anomaly Detection Component"
    destination: "Compliance Data Store Component"
    description: "Analyzes compliance data"