level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides secure video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US, enforcing strict regional data residency and compliance."
elements:
  - type: "person"
    name: "Patients and Licensed Clinicians"
    description: "System users who conduct video consultations, manage e-prescriptions, and use the platform for telehealth services."
  - type: "externalSystem"
    name: "Local Pharmacies and EU National E-Prescription Networks"
    description: "External systems for processing and dispensing prescriptions across the EU and US."
  - type: "externalSystem"
    name: "Third-party Video Provider"
    description: "External system providing low-bandwidth WebRTC video consultations."
  - type: "externalSystem"
    name: "AI Symptom Checker Model Registry"
    description: "External system hosting the AI symptom checker models."
  - type: "externalSystem"
    name: "Identity Verification Services and Regional Payment Gateways"
    description: "External services for user identity verification and processing payments."
relationships:
  - source: "Patients and Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Interact with the Platform for video consultations, e-prescriptions, and symptom checking"
    technology: "HTTPS and WebSockets (WebRTC)"
  - source: "Cross-Border Telehealth Platform"
    destination: "Local Pharmacies and EU National E-Prescription Networks"
    description: "Communicates prescription data and interoperability standards"
    technology: "HL7 FHIR over HTTPS, REST/SOAP over HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Third-party Video Provider"
    description: "Streams video consultations"
    technology: "WebRTC"
  - source: "Cross-Border Telehealth Platform"
    destination: "AI Symptom Checker Model Registry"
    description: "Accesses AI symptom checker models"
    technology: "gRPC/HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity Verification Services and Regional Payment Gateways"
    description: "Verifies user identities and processes regional payments"
    technology: "HTTPS/REST"