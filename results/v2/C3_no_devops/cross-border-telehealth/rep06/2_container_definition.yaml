level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients utilizing the platform for video consultations, e-prescriptions, and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Healthcare professionals conducting consultations and managing patient treatments."
  - type: "person"
    name: "Platform Administrators"
    description: "Administrators managing platform operations and settings."
  - type: "person"
    name: "Pharmacy/Compliance Auditors"
    description: "Auditors reviewing system compliance and prescription flows."
  - type: "externalSystem"
    name: "Local Pharmacies"
    description: "External systems for processing and dispensing prescriptions."
  - type: "externalSystem"
    name: "EU National E-Prescription Networks"
    description: "External systems handling cross-border e-prescriptions within the EU."
  - type: "externalSystem"
    name: "Third-Party Video Provider"
    description: "External video provider supporting WebRTC video consultations."
  - type: "externalSystem"
    name: "AI Symptom Checker Model Registry"
    description: "External registry hosting the AI symptom checker models."
  - type: "externalSystem"
    name: "Identity Verification"
    description: "External services for verifying user identities."
  - type: "externalSystem"
    name: "Regional Payment Gateways"
    description: "External services for processing payments regionally."
  - type: "container"
    name: "Web Application & Mobile Apps"
    technology: "Flutter / React"
    description: "Client applications providing multi-platform access for users."
  - type: "container"
    name: "Regional API Gateways"
    technology: "Google Cloud API Gateway (europe-west3, us-central1)"
    description: "Gateways routing and handling regional API traffic and data residency enforcement."
  - type: "container"
    name: "Core Telehealth Service"
    technology: "Go / Spring Boot"
    description: "Core backend service handling telehealth business logic."
  - type: "container"
    name: "Video Mediation Service"
    technology: "Twilio / WebRTC"
    description: "Service managing real-time video and audio consultations."
  - type: "container"
    name: "E-Prescription Integrator"
    technology: "Node.js"
    description: "Service integrating with local pharmacies and national e-prescription networks."
  - type: "container"
    name: "AI Orchestrator & Audit Logger"
    technology: "Python"
    description: "Service orchestrating AI symptom checker models and maintaining immutable audit logs."
  - type: "container"
    name: "Google Cloud Pub/Sub"
    technology: "Google Cloud Pub/Sub"
    description: "Messaging system for asynchronous event publishing across services."
  - type: "container"
    name: "Cloud SQL for PostgreSQL"
    technology: "PostgreSQL"
    description: "Relational database storing structured system and user data."
  - type: "container"
    name: "Memorystore for Redis"
    technology: "Redis"
    description: "In-memory data store for caching and state management."
relationships:
  - source: "Patients"
    destination: "Web Application & Mobile Apps"
    description: "Accesses telehealth services, video consultations, and AI symptom checker"
    technology: "HTTPS and WSS"
  - source: "Licensed Clinicians"
    destination: "Web Application & Mobile Apps"
    description: "Manages consultations, patients, and e-prescriptions"
    technology: "HTTPS and WSS"
  - source: "Platform Administrators"
    destination: "Web Application & Mobile Apps"
    description: "Administers platform configurations and oversight"
    technology: "HTTPS"
  - source: "Pharmacy/Compliance Auditors"
    destination: "Web Application & Mobile Apps"
    description: "Audits logs and compliance data"
    technology: "HTTPS"
  - source: "Web Application & Mobile Apps"
    destination: "Regional API Gateways"
    description: "Sends client requests and receives data"
    technology: "HTTPS and WSS"
  - source: "Regional API Gateways"
    destination: "Core Telehealth Service"
    description: "Routes API requests"
    technology: "gRPC over mTLS"
  - source: "Regional API Gateways"
    destination: "Video Mediation Service"
    description: "Mediates video sessions"
    technology: "HTTPS / WebRTC"
  - source: "Regional API Gateways"
    destination: "E-Prescription Integrator"
    description: "Routes prescription-related requests"
    technology: "gRPC over mTLS"
  - source: "Regional API Gateways"
    destination: "AI Orchestrator & Audit Logger"
    description: "Routes AI symptom checks and audit requests"
    technology: "gRPC over mTLS"
  - source: "Core Telehealth Service"
    destination: "Google Cloud Pub/Sub"
    description: "Publishes asynchronous domain events"
    technology: "Cloud Pub/Sub API"
  - source: "E-Prescription Integrator"
    destination: "Google Cloud Pub/Sub"
    description: "Publishes e-prescription events"
    technology: "Cloud Pub/Sub API"
  - source: "AI Orchestrator & Audit Logger"
    destination: "Google Cloud Pub/Sub"
    description: "Publishes AI and audit events"
    technology: "Cloud Pub/Sub API"
  - source: "Core Telehealth Service"
    destination: "Cloud SQL for PostgreSQL"
    description: "Reads and writes relational data"
    technology: "PostgreSQL Protocol"
  - source: "Core Telehealth Service"
    destination: "Memorystore for Redis"
    description: "Caches session and transient state data"
    technology: "Redis Protocol"
  - source: "Video Mediation Service"
    destination: "Third-Party Video Provider"
    description: "Streams video consultations"
    technology: "WebRTC"
  - source: "E-Prescription Integrator"
    destination: "Local Pharmacies"
    description: "Transmits prescription data"
    technology: "HL7 FHIR / REST / SOAP over HTTPS"
  - source: "E-Prescription Integrator"
    destination: "EU National E-Prescription Networks"
    description: "Interoperates with national e-prescription standards"
    technology: "HL7 FHIR / REST / SOAP over HTTPS"
  - source: "AI Orchestrator & Audit Logger"
    destination: "AI Symptom Checker Model Registry"
    description: "Accesses and loads AI symptom checker models"
    technology: "gRPC / HTTPS"
  - source: "Core Telehealth Service"
    destination: "Identity Verification"
    description: "Verifies user identities during registration/login"
    technology: "HTTPS / REST"
  - source: "Core Telehealth Service"
    destination: "Regional Payment Gateways"
    description: "Processes consultation and service payments"
    technology: "HTTPS / REST"