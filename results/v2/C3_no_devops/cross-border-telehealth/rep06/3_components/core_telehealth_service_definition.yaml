level: component
scope: "Component diagram for the Core Telehealth Service container"
parentContainer:
  name: "Core Telehealth Service"
elements:
  - type: "component"
    name: "Session & Consent Manager"
    technology: "Go"
    description: "Handles business logic, session management, and features a Consent Evaluation Engine for strict data residency enforcement."
  - type: "component"
    name: "Integration Anti-Corruption Layer"
    technology: "Go"
    description: "Manages integration boundaries and communicates with external Identity Verification and Regional Payment Gateways."
  - type: "component"
    name: "Event Dispatcher"
    technology: "Go"
    description: "Publishes asynchronous domain events."
  - type: "component"
    name: "Idempotent Sync Coordinator"
    technology: "Go"
    description: "Coordinates secure synchronization and offline resilience for cross-border telemedicine."
  - type: "component"
    name: "Cloud SQL for PostgreSQL"
    technology: "Cloud SQL for PostgreSQL"
    description: "Provides persistent regional relational data storage."
  - type: "component"
    name: "Memorystore for Redis"
    technology: "Memorystore for Redis"
    description: "Caches transient state for the core service."
  - type: "component"
    name: "Google Cloud Pub/Sub"
    technology: "Google Cloud Pub/Sub"
    description: "Enables asynchronous, decoupled event-driven messaging."
  - type: "component"
    name: "Regional API Gateways"
    technology: "Google Cloud Platform"
    description: "Routes API requests via gRPC over mTLS."
  - type: "component"
    name: "Identity Verification & Regional Payment Gateways"
    technology: "External Systems"
    description: "External gateways for identity and payments."
relationships:
  - source: "Regional API Gateways"
    destination: "Session & Consent Manager"
    description: "Routes API requests via gRPC over mTLS"
  - source: "Event Dispatcher"
    destination: "Google Cloud Pub/Sub"
    description: "Publishes asynchronous domain events via Cloud Pub/Sub API"
  - source: "Session & Consent Manager"
    destination: "Cloud SQL for PostgreSQL"
    description: "Reads/writes relational data via PostgreSQL Protocol"
  - source: "Idempotent Sync Coordinator"
    destination: "Memorystore for Redis"
    description: "Caches transient state via Redis Protocol"
  - source: "Integration Anti-Corruption Layer"
    destination: "Identity Verification & Regional Payment Gateways"
    description: "Communicates via HTTPS/REST with circuit breakers"