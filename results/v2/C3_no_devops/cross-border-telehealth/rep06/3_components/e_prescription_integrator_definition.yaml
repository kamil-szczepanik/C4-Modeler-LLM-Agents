level: component
scope: "Component diagram for the E-Prescription Integrator container"
parentContainer:
  name: "E-Prescription Integrator"
elements:
  - type: "component"
    name: "Prescription Transformation Engine"
    technology: "Node.js / TypeScript"
    description: "Transforms prescription data formats for integration."
  - type: "component"
    name: "Gateway Adapter Client"
    technology: "Node.js / TypeScript"
    description: "Transmits e-prescriptions to local pharmacies and EU national networks."
  - type: "component"
    name: "Status Polling & Event Handler"
    technology: "Node.js / TypeScript"
    description: "Publishes fulfillment events and broadcasts transmission state changes."
  - type: "component"
    name: "Resilience & Queue Manager"
    technology: "Node.js / TypeScript, BullMQ"
    description: "Buffers reference IDs and state metadata to handle transient network failures."
relationships:
  - source: "E-Prescription Integrator"
    destination: "Cloud SQL for PostgreSQL"
    description: "Fetches encrypted payloads on-demand [PostgreSQL Wire Protocol over TLS]"
  - source: "Resilience & Queue Manager"
    destination: "Memorystore for Redis"
    description: "Buffers reference IDs and state metadata [Redis Protocol over TLS]"
  - source: "Status Polling & Event Handler"
    destination: "Google Cloud Pub/Sub"
    description: "Publishes fulfillment events [Cloud Pub/Sub API]"
  - source: "Status Polling & Event Handler"
    destination: "Regional API Gateways"
    description: "Broadcasts transmission state changes [Server-Sent Events / WebSockets with short-lived JWTs]"
  - source: "Gateway Adapter Client"
    destination: "Local Pharmacies and EU National E-Prescription Networks"
    description: "Transmits e-prescriptions [HL7 FHIR / REST / SOAP over HTTPS with mTLS]"