level: component
scope: "Component diagram for the Regional API Gateways container"
parentContainer:
  name: "Regional API Gateways"
elements:
  - type: "component"
    name: "Global HTTPS Load Balancer"
    technology: "Envoy-based, GCP Global HTTPS Load Balancer"
    description: "Provides low-latency edge TLS termination and regional routing."
  - type: "component"
    name: "Gateway Authorization Filter"
    technology: "Custom HTTP Filter"
    description: "Forwards terminated HTTP/HTTPS requests and validates authorization."
  - type: "component"
    name: "Rate Limiting & Cost-Control Throttle"
    technology: "Memorystore for Redis Token Bucket"
    description: "Checks quota and rate limits to prevent API exhaustion."
  - type: "component"
    name: "gRPC Reverse Proxy / Router"
    technology: "gRPC over mTLS"
    description: "Routes external traffic internally using gRPC."
  - type: "component"
    name: "GCP Cloud Armor"
    technology: "Google Cloud Armor WAF"
    description: "Enforces OWASP Top 10 protection, geo-fencing, and bot mitigation."
relationships:
  - source: "Web Application & Mobile Apps"
    destination: "Global HTTPS Load Balancer"
    description: "Sends client requests and receives data [HTTPS / WSS, TLS 1.3]"
  - source: "Global HTTPS Load Balancer"
    destination: "Gateway Authorization Filter"
    description: "Forwards terminated HTTP/HTTPS requests [HTTP/2]"
  - source: "Gateway Authorization Filter"
    destination: "Rate Limiting & Cost-Control Throttle"
    description: "Checks quota and rate limits [In-memory / Redis lookup]"
  - source: "Gateway Authorization Filter"
    destination: "gRPC Reverse Proxy / Router"
    description: "Passes authenticated and authorized requests [Internal IPC]"
  - source: "Rate Limiting & Cost-Control Throttle"
    destination: "gRPC Reverse Proxy / Router"
    description: "Passes authenticated and authorized requests [Internal IPC]"
  - source: "gRPC Reverse Proxy / Router"
    destination: "Core Telehealth Service"
    description: "Routes external traffic internally [gRPC over mTLS]"
  - source: "gRPC Reverse Proxy / Router"
    destination: "AI Orchestrator"
    description: "Routes external traffic internally [gRPC over mTLS]"