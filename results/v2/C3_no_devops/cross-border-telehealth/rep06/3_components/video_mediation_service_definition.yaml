level: component
scope: "Component diagram for the Video Mediation Service container"
parentContainer:
  name: "Video Mediation Service"
elements:
  - type: "component"
    name: "Session Signaling Controller"
    technology: "Go / WebSockets"
    description: "Initiates call setup, routes cryptographically signed JWTs, and persists ephemeral signaling state."
  - type: "component"
    name: "Bandwidth Adaptation Engine"
    technology: "Go"
    description: "Dynamically adjusts streams and prioritizes audio to guarantee continuous care under unstable network conditions."
  - type: "component"
    name: "Telemetry & Audit Collector"
    technology: "Go"
    description: "Streams scrubbed session quality metrics and compliance logs."
  - type: "component"
    name: "Media Quality Policy Enforcer"
    technology: "Go"
    description: "Enforces media quality policies and dynamically adjusts video/audio streams."
relationships:
  - source: "Session Signaling Controller"
    destination: "Memorystore for Redis"
    description: "Persists ephemeral signaling state and session tokens [Redis Protocol]"
  - source: "Bandwidth Adaptation Engine"
    destination: "Third-Party Video Provider"
    description: "Dynamically adjusts streams and prioritizes audio [WebRTC / SRTP / DTLS]"
  - source: "Media Quality Policy Enforcer"
    destination: "Third-Party Video Provider"
    description: "Enforces media quality policies on streams [WebRTC / SRTP / DTLS]"
  - source: "Telemetry & Audit Collector"
    destination: "Google Cloud Pub/Sub"
    description: "Streams scrubbed session quality metrics and compliance logs [gRPC]"