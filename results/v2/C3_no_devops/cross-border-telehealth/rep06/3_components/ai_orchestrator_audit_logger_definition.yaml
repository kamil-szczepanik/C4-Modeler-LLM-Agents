level: component
scope: "Component diagram for the AI Orchestrator & Audit Logger container"
parentContainer:
  name: "AI Orchestrator & Audit Logger"
elements:
  - type: "component"
    name: "AI Gateway Router"
    technology: "Python / FastAPI"
    description: "Routes AI symptom checks and audit requests."
  - type: "component"
    name: "Model Execution Engine"
    technology: "PyTorch / ONNX Runtime"
    description: "Executes localized regional AI symptom checker models efficiently."
  - type: "component"
    name: "Audit Logger Interceptor"
    technology: "Python / gRPC Interceptor"
    description: "Interprets and intercepts calls for audit logging."
  - type: "component"
    name: "Immutable Ledger Writer"
    technology: "Python / Google Cloud Storage & PostgreSQL Client"
    description: "Writes audit events to persistent storage securely."
  - type: "component"
    name: "Clinician Feedback Collector"
    technology: "Python / FastAPI"
    description: "Collects doctor validation inputs."
  - type: "component"
    name: "Telemetry & Metrics Publisher"
    technology: "OpenTelemetry SDK"
    description: "Publishes telemetry and metrics."
relationships:
  - source: "AI Gateway Router"
    destination: "Model Execution Engine"
    description: "Invokes model execution for symptom checks [gRPC / HTTPS]"
  - source: "Audit Logger Interceptor"
    destination: "Immutable Ledger Writer"
    description: "Passes audit events for persistence [Internal]"
  - source: "AI Orchestrator & Audit Logger"
    destination: "Google Cloud Pub/Sub"
    description: "Publishes signed audit events asynchronously [Cloud Pub/Sub API over mTLS]"