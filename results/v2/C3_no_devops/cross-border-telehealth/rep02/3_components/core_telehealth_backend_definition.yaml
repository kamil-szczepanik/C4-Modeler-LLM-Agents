level: component
scope: "Component diagram for the Core Telehealth Backend container"
parentContainer:
  name: "Core Telehealth Backend"
elements:
  - type: "component"
    name: "Transaction Ingestion Component"
    technology: "Go / gRPC"
    description: "Ingests transaction payloads securely with idempotency keys."
  - type: "component"
    name: "Resilient Sync Orchestrator"
    technology: "Go / Temporal on GKE"
    description: "Manages offline-resilient transactions and workflow orchestration."
  - type: "component"
    name: "Session & State Manager"
    technology: "Go / Redis Memorystore"
    description: "Handles real-time session and state management."
  - type: "component"
    name: "Clinical Exception & Audit Notifier"
    technology: "Go / GCP Pub/Sub"
    description: "Dispatches failure events and audit notifications via regional topics."
relationships:
  - source: "Transaction Ingestion Component"
    destination: "Resilient Sync Orchestrator"
    description: "Passes idempotency-keyed payloads securely"
  - source: "Resilient Sync Orchestrator"
    destination: "Clinical Exception & Audit Notifier"
    description: "Dispatches failure events via GCP Pub/Sub regional topics"