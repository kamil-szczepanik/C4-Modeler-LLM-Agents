level: component
scope: "Component diagram for the Patient Consent & Preference Service Container container"
parentContainer:
  name: "Patient Consent & Preference Service Container"
elements:
  - type: "component"
    name: "Consent API Router"
    technology: "Go, chi framework"
    description: "Handles incoming consent queries and updates via gRPC over mTLS with JWTs."
  - type: "component"
    name: "Consent Policy Engine"
    technology: "Go"
    description: "Evaluates and persists consent states, enforcing fine-grained, time-bound data access policies."
  - type: "component"
    name: "Audit Logger"
    technology: "Go, Cryptographic Chaining"
    description: "Writes tamper-evident logs for GDPR and HIPAA compliance."
  - type: "component"
    name: "PostgreSQL Repository Layer"
    technology: "Go, pgx"
    description: "Manages data persistence and retrieval utilizing PostgreSQL wire protocol with CMEK."
  - type: "component"
    name: "Consent Expiry Background Worker"
    technology: "Go"
    description: "Handles automated lifecycle management and expiry of patient privacy consents."
relationships:
  - source: "API Gateway"
    destination: "Consent API Router"
    description: "Queries and updates consent [gRPC over mTLS with JWTs]"
  - source: "Consent Policy Engine"
    destination: "PostgreSQL Repository Layer"
    description: "Persists and evaluates consent states [PostgreSQL wire protocol with CMEK]"
  - source: "Audit Logger"
    destination: "Cloud Storage"
    description: "Writes tamper-evident logs [Google Cloud Storage APIs]"
  - source: "Consent Policy Engine"
    destination: "Pub/Sub"
    description: "Broadcasts state changes for cache invalidation [GCP Pub/Sub]"