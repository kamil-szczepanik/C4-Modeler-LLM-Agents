level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Claims-Driven Geo-Routing Filter"
    technology: "Envoy-based Cloud Endpoints / Apigee"
    description: "Routes client requests based on geographic claims and regional data residency constraints."
  - type: "component"
    name: "Consent & Policy Enforcement Filter"
    technology: "Envoy-based Cloud Endpoints / Apigee"
    description: "Enforces consent validation and policy checks for cross-border health data access."
  - type: "component"
    name: "Telemetry & Resilience Proxy"
    technology: "Envoy-based Cloud Endpoints / Apigee"
    description: "Handles telemetry tracking and resilience proxying for downstream microservices."
relationships:
  - source: "Claims-Driven Geo-Routing Filter"
    destination: "Consent & Policy Enforcement Filter"
    description: "Internal gRPC"
  - source: "Consent & Policy Enforcement Filter"
    destination: "Telemetry & Resilience Proxy"
    description: "Internal gRPC"