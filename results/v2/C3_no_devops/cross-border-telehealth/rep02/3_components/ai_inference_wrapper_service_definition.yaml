level: component
scope: "Component diagram for the AI Inference Wrapper Service container"
parentContainer:
  name: "AI Inference Wrapper Service"
elements:
  - type: "component"
    name: "API Router & Validation Component"
    technology: "FastAPI, Python"
    description: "Handles incoming API requests and performs payload validation."
  - type: "component"
    name: "Pseudonymization & Redaction Component"
    technology: "Python"
    description: "Sanitizes and pseudonymizes raw payloads to enforce data privacy and compliance."
  - type: "component"
    name: "Regional AI Gateway Client"
    technology: "gRPC, Python"
    description: "Executes inference requests against the regional AI gateway."
  - type: "component"
    name: "Circuit Breaker & Fallback Component"
    technology: "Python"
    description: "Ensures high availability by handling failures and executing fallback mechanisms."
  - type: "component"
    name: "Audit & Traceability Logger"
    technology: "Python, TCP/mTLS"
    description: "Writes comprehensive audit logs to ensure complete traceability."
  - type: "component"
    name: "GCP Cloud SQL (PostgreSQL) and Cloud Storage"
    technology: "Cloud KMS, Cloud Storage, PostgreSQL"
    description: "Provides secure, encrypted storage with WORM policies for compliance and audit logs."
relationships:
  - source: "API Router & Validation Component"
    destination: "Pseudonymization & Redaction Component"
    description: "Passes raw payloads via in-memory Python calls"
  - source: "Pseudonymization & Redaction Component"
    destination: "Regional AI Gateway Client"
    description: "Passes sanitized payloads via in-memory Python calls"
  - source: "Regional AI Gateway Client"
    destination: "Circuit Breaker & Fallback Component"
    description: "Executes inference via gRPC"
  - source: "Audit & Traceability Logger"
    destination: "GCP Cloud SQL (PostgreSQL) and Cloud Storage"
    description: "Writes audit logs via TCP/mTLS with CMEK and WORM policies"