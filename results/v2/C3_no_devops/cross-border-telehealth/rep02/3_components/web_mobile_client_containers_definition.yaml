level: component
scope: "Component diagram for the Web & Mobile Client Containers container"
parentContainer:
  name: "Web & Mobile Client Containers"
elements:
  - type: "component"
    name: "UI Presentation & Routing Module"
    technology: "Flutter / React Native"
    description: "Handles cross-platform UI presentation and navigation for patients and clinicians."
  - type: "component"
    name: "Offline-First State & Caching Manager"
    technology: "SQLCipher & Secure Enclaves"
    description: "Manages local at-rest encryption for cached PHI/PII on mobile devices and offline data persistence."
  - type: "component"
    name: "API & Sync Client"
    technology: "gRPC over mTLS"
    description: "Handles bandwidth-efficient offline queue synchronization with the API Gateway."
  - type: "component"
    name: "WebRTC Media Client"
    technology: "WebRTC"
    description: "Manages low-latency video streaming for degraded connections under 300 kbit/s."
relationships:
  - source: "UI Presentation & Routing Module"
    destination: "Offline-First State & Caching Manager"
    description: "Persists and retrieves cached state and PHI/PII data"
  - source: "UI Presentation & Routing Module"
    destination: "API & Sync Client"
    description: "Triggers API requests and offline queue synchronization"
  - source: "UI Presentation & Routing Module"
    destination: "WebRTC Media Client"
    description: "Initiates video consultation media streams"
  - source: "API & Sync Client"
    destination: "API Gateway"
    description: "Sends HTTPS/gRPC requests via mTLS"
  - source: "WebRTC Media Client"
    destination: "Video Streaming Gateway"
    description: "Streams WebRTC media streams with SRTP/DTLS"