level: component
scope: "Component diagram for the Cloud SQL (PostgreSQL) and Cloud Storage container"
parentContainer:
  name: "Cloud SQL (PostgreSQL) and Cloud Storage"
elements:
  - type: "component"
    name: "PostgreSQL Audit Ledger"
    technology: "Cloud SQL PostgreSQL + pgaudit"
    description: "Relational database with tamper-evident logging for system audits."
  - type: "component"
    name: "Object Versioning & Retention Manager"
    technology: "Cloud Storage with Object Lock"
    description: "Immutable storage for AI model versions and session audits ensuring WORM compliance."
  - type: "component"
    name: "Partitioned Data Access Layer"
    technology: "PostgreSQL Table Partitioning"
    description: "Manages partitioned data access for high availability and fast consent verification."
  - type: "component"
    name: "PITR Snapshot Scheduler and Automated Cross-Zone Replication Manager"
    technology: "Internal GCP APIs and Cloud Scheduler"
    description: "Manages automated backups, point-in-time recovery, and cross-zone replication."
relationships:
  - source: "PITR Snapshot Scheduler and Automated Cross-Zone Replication Manager"
    destination: "PostgreSQL Audit Ledger"
    description: "Triggers automated backups and PITR snapshots"
  - source: "PITR Snapshot Scheduler and Automated Cross-Zone Replication Manager"
    destination: "Object Versioning & Retention Manager"
    description: "Manages snapshots and replicated backups"
  - source: "Partitioned Data Access Layer"
    destination: "PostgreSQL Audit Ledger"
    description: "Queries and writes partitioned operational data"