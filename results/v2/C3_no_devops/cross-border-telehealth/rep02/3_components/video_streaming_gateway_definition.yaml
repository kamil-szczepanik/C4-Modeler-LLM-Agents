level: component
scope: "Component diagram for the Video Streaming Gateway container"
parentContainer:
  name: "Video Streaming Gateway"
elements:
  - type: "component"
    name: "SFU Media Router Component"
    technology: "MediaSoup C++/Node.js"
    description: "Core SFU media routing for high-performance packet forwarding and WebRTC media transport."
  - type: "component"
    name: "Adaptive Bitrate & Transcoding Controller Component"
    technology: "Internal IPC / gRPC"
    description: "Handles dynamic media layer adjustments to maintain consultations in degraded network conditions."
  - type: "component"
    name: "Signaling & Session Manager Component"
    technology: "Node.js/Go"
    description: "Manages WSS signaling and real-time room orchestration using short-lived JWTs."
  - type: "component"
    name: "Media Telemetry Exporter Component"
    technology: "Prometheus scrape protocol"
    description: "Exports session quality metrics for real-time telemetry."
relationships:
  - source: "Adaptive Bitrate & Transcoding Controller Component"
    destination: "SFU Media Router Component"
    description: "Dynamic media layer adjustments via Internal IPC / gRPC"
  - source: "Media Telemetry Exporter Component"
    destination: "Core Telehealth Backend"
    description: "HTTP Prometheus scrape protocol for session quality metrics"