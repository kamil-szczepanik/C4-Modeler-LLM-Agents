level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Cross-Border Telehealth Platform providing video consultations, e-prescriptions, and an internal AI symptom checker for EU and US patients with strict regional data residency, GDPR/HIPAA compliance, and regulatory traceability across distributed GCP deployments."
elements:
  - type: "person"
    name: "Patients (EU & US)"
    description: "Patients located in the EU and US seeking video consultations, e-prescriptions, and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed medical professionals providing video consultations and managing patient treatments."
  - type: "person"
    name: "Pharmacies (EU & US)"
    description: "Regional pharmacies fulfilling e-prescriptions for patients."
  - type: "person"
    name: "Compliance & Regulatory Officers"
    description: "Officers responsible for overseeing regulatory traceability, GDPR, and HIPAA compliance."
  - type: "externalSystem"
    name: "Internal AI Symptom Checker Engine"
    description: "Internal AI engine operating natively within regional GCP clusters for symptom checking and audit logging."
  - type: "externalSystem"
    name: "National Identity Providers"
    description: "EU eID and US OAuth Providers handling user authentication."
  - type: "externalSystem"
    name: "Third-Party Payment Gateways"
    description: "Stripe and regional processors handling secure payment transactions via tokenization."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways & US Pharmacy Networks"
    description: "External gateways and networks for processing e-prescriptions using HL7 FHIR and national standards."
relationships:
  - source: "Patients (EU & US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Interacts with regional Platform instances for video consultations and platform features"
    technology: "HTTPS (REST/GraphQL), WebRTC"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Interacts with regional Platform instances to conduct video consultations and manage care"
    technology: "HTTPS (REST/GraphQL), WebRTC"
  - source: "Cross-Border Telehealth Platform"
    destination: "EU National E-Prescription Gateways & US Pharmacy Networks"
    description: "Connects to transmit e-prescriptions and health data exchange"
    technology: "HTTPS/REST (HL7 FHIR in US, national standards in EU)"
  - source: "Cross-Border Telehealth Platform"
    destination: "National Identity Providers"
    description: "Authenticates users via OIDC with PKCE and MFA"
    technology: "OpenID Connect (OIDC) over HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Third-Party Payment Gateways"
    description: "Integrates with payment processors using tokenization"
    technology: "HTTPS/REST"
  - source: "Cross-Border Telehealth Platform"
    destination: "Internal AI Symptom Checker Engine"
    description: "Executes symptom checking natively within regional GCP clusters with audit logging"
    technology: "GCP Internal Network"