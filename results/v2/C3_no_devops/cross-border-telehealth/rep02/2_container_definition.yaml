level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU/US)"
    description: "Patients located in the EU and US seeking video consultations, e-prescriptions, and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed medical professionals providing video consultations and managing patient treatments."
  - type: "person"
    name: "Pharmacies (EU/US)"
    description: "Regional pharmacies fulfilling e-prescriptions for patients."
  - type: "person"
    name: "Compliance Officers"
    description: "Officers responsible for overseeing regulatory traceability, GDPR, and HIPAA compliance."
  - type: "container"
    name: "Web & Mobile Client Containers"
    technology: "Flutter / React Native with offline-first caching"
    description: "Client applications for web and mobile platforms used by patients and clinicians."
  - type: "container"
    name: "API Gateway"
    technology: "Cloud Endpoints / Apigee"
    description: "Manages, routes, and secures incoming traffic to the microservices."
  - type: "container"
    name: "Core Telehealth Backend"
    technology: "Node.js / Go in GKE"
    description: "Handles core business logic for video consultations, e-prescriptions, and platform operations."
  - type: "container"
    name: "Patient Consent & Preference Service Container"
    technology: "Go in GKE"
    description: "Manages patient consent and preference data under strict regional isolation."
  - type: "container"
    name: "Video Streaming Gateway"
    technology: "WebRTC SFU / MediaSoup on GCE/GKE"
    description: "Handles real-time video streaming for consultations."
  - type: "container"
    name: "AI Inference Wrapper Service"
    technology: "Python / FastAPI"
    description: "Provides AI symptom checker inference capabilities."
  - type: "container"
    name: "Cloud SQL (PostgreSQL) and Cloud Storage"
    technology: "GCP Cloud SQL (PostgreSQL), Cloud Storage with Cloud KMS"
    description: "Regionally isolated relational databases and object storage with CMEK encryption."
relationships:
  - source: "Patients (EU/US)"
    destination: "Web & Mobile Client Containers"
    description: "Accesses telehealth services, video consultations, and AI symptom checker"
    technology: "HTTPS, WebRTC"
  - source: "Licensed Clinicians"
    destination: "Web & Mobile Client Containers"
    description: "Manages consultations, patient treatments, and e-prescriptions"
    technology: "HTTPS, WebRTC"
  - source: "Web & Mobile Client Containers"
    destination: "API Gateway"
    description: "Sends API requests and queries"
    technology: "HTTPS/gRPC via mTLS"
  - source: "Web & Mobile Client Containers"
    destination: "Video Streaming Gateway"
    description: "Streams live video consultations"
    technology: "WebRTC media streams with SRTP/DTLS (E2EE)"
  - source: "API Gateway"
    destination: "Core Telehealth Backend"
    description: "Routes authenticated requests to core microservices"
    technology: "gRPC over mTLS with cryptographically signed JWTs"
  - source: "API Gateway"
    destination: "Patient Consent & Preference Service Container"
    description: "Queries and updates patient consent and preferences"
    technology: "gRPC over mTLS with cryptographically signed JWTs"
  - source: "API Gateway"
    destination: "AI Inference Wrapper Service"
    description: "Sends requests for AI symptom analysis"
    technology: "gRPC over mTLS with cryptographically signed JWTs"
  - source: "Core Telehealth Backend"
    destination: "Cloud SQL (PostgreSQL) and Cloud Storage"
    description: "Reads and writes core application data and files securely"
    technology: "Regional GCP Cloud SQL and Cloud Storage using CMEK via Cloud KMS"
  - source: "Patient Consent & Preference Service Container"
    destination: "Cloud SQL (PostgreSQL) and Cloud Storage"
    description: "Persists patient consent and preference records securely"
    technology: "Regional GCP Cloud SQL and Cloud Storage using CMEK via Cloud KMS"
  - source: "AI Inference Wrapper Service"
    destination: "Cloud SQL (PostgreSQL) and Cloud Storage"
    description: "Accesses data and audit logs securely"
    technology: "Regional GCP Cloud SQL and Cloud Storage using CMEK via Cloud KMS"