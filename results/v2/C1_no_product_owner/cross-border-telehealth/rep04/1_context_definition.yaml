level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US while enforcing strict regional data residency."
elements:
  - type: "person"
    name: "Patients"
    description: "Patients in the EU and US using mobile and web apps for video consultations, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Clinicians using mobile and web apps to conduct video consultations and manage patient care."
  - type: "externalSystem"
    name: "EU Telehealth System"
    description: "Regional telehealth system deployed in europe-west3 for EU data residency."
  - type: "externalSystem"
    name: "US Telehealth System"
    description: "Regional telehealth system deployed in us-central1 for US data residency."
  - type: "externalSystem"
    name: "Global Management Plane"
    description: "Oversees metadata synchronization, AI versioning, and governance."
  - type: "externalSystem"
    name: "National E-Prescription Gateways (EU)"
    description: "External gateways for transmitting e-prescriptions in the EU."
  - type: "externalSystem"
    name: "HL7 FHIR Interoperability Services (US)"
    description: "External interoperability services for US healthcare data exchange."
  - type: "externalSystem"
    name: "Regional IAM Services"
    description: "Identity Providers utilizing OAuth2/OIDC for authentication."
  - type: "externalSystem"
    name: "Local EU/US Pharmacies"
    description: "Pharmacies receiving prescriptions locally."
relationships:
  - source: "Patients"
    destination: "Cross-Border Telehealth Platform"
    description: "Connects via mobile/web apps for APIs and video consultations"
    technology: "HTTPS/WebRTC"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Connects via mobile/web apps for consultations and prescriptions"
    technology: "HTTPS/WebRTC"
  - source: "Cross-Border Telehealth Platform"
    destination: "EU Telehealth System"
    description: "Routes EU traffic to region-locked infrastructure"
    technology: "HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "US Telehealth System"
    description: "Routes US traffic to region-locked infrastructure"
    technology: "HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Global Management Plane"
    description: "Syncs metadata, AI versions, and governance"
    technology: "mTLS / Scoped OAuth2"
  - source: "EU Telehealth System"
    destination: "National E-Prescription Gateways (EU)"
    description: "Transmits e-prescriptions via national gateways"
    technology: "HTTPS/REST"
  - source: "US Telehealth System"
    destination: "HL7 FHIR Interoperability Services (US)"
    description: "Exchanges healthcare data using interoperability services"
    technology: "HL7 FHIR / HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Regional IAM Services"
    description: "Validates tokens via regional identity providers"
    technology: "OAuth2/OIDC"
  - source: "EU Telehealth System"
    destination: "Local EU/US Pharmacies"
    description: "Sends prescriptions to local pharmacies"
    technology: "HTTPS/REST"
  - source: "US Telehealth System"
    destination: "Local EU/US Pharmacies"
    description: "Sends prescriptions to local pharmacies"
    technology: "HTTPS/REST"