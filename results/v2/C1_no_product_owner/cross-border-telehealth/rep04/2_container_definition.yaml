level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients in the EU and US using mobile and web apps for video consultations, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Clinicians using mobile and web apps to conduct video consultations and manage patient care."
  - type: "externalSystem"
    name: "National E-Prescription Gateways (EU) & HL7 FHIR Interoperability Services (US)"
    description: "External national gateways and interoperability services."
  - type: "externalSystem"
    name: "Global Management Plane"
    description: "Oversees metadata synchronization, AI versioning, and governance via Istio service mesh."
  - type: "container"
    name: "API Gateway"
    technology: "Cloud Endpoints / Envoy"
    description: "Routes incoming client traffic to appropriate backend services."
  - type: "container"
    name: "Video Consultation Service"
    technology: "WebRTC SFU via LiveKit"
    description: "Handles video consultations supporting degraded bandwidth under 300 kbit/s."
  - type: "container"
    name: "AI Symptom Checker"
    technology: "Python / FastAPI"
    description: "Hosts AI symptom checker with model version logging."
  - type: "container"
    name: "Interoperability Adapter"
    technology: "Node.js"
    description: "Adapter for HL7 FHIR and EU e-prescriptions."
  - type: "container"
    name: "Consent Management Service"
    technology: "Go / gRPC"
    description: "Manages granular data sharing and inline consent checks."
  - type: "container"
    name: "Data Storage"
    technology: "Cloud SQL PostgreSQL + Cloud Storage"
    description: "Region-locked persistence with CMEK encryption."
  - type: "container"
    name: "Regional GKE Clusters"
    technology: "GCP GKE (europe-west3, us-central1)"
    description: "Isolated regional clusters for data residency compliance."
relationships:
  - source: "Patients"
    destination: "API Gateway"
    description: "Connects for API requests and video consultations"
    technology: "HTTPS/REST and WebSockets/WebRTC"
  - source: "Licensed Clinicians"
    destination: "API Gateway"
    description: "Connects for consultations and prescriptions"
    technology: "HTTPS/REST and WebSockets/WebRTC"
  - source: "API Gateway"
    destination: "Video Consultation Service"
    description: "Routes video session requests"
    technology: "HTTPS/gRPC"
  - source: "API Gateway"
    destination: "AI Symptom Checker"
    description: "Routes symptom check requests"
    technology: "HTTPS/gRPC"
  - source: "API Gateway"
    destination: "Interoperability Adapter"
    description: "Routes prescription and data exchange requests"
    technology: "HTTPS/gRPC"
  - source: "API Gateway"
    destination: "Consent Management Service"
    description: "Validates consent"
    technology: "gRPC"
  - source: "Video Consultation Service"
    destination: "Data Storage"
    description: "Persists session data"
    technology: "gRPC/SQL"
  - source: "AI Symptom Checker"
    destination: "Data Storage"
    description: "Persists symptom analysis logs"
    technology: "gRPC/SQL"
  - source: "Consent Management Service"
    destination: "Data Storage"
    description: "Persists consent records"
    technology: "gRPC/SQL"
  - source: "Interoperability Adapter"
    destination: "National E-Prescription Gateways (EU) & HL7 FHIR Interoperability Services (US)"
    description: "Exchanges health data and prescriptions"
    technology: "HTTPS/REST"
  - source: "Global Management Plane"
    destination: "Regional GKE Clusters"
    description: "Manages global policies and synchronization"
    technology: "Istio service mesh / mTLS"