level: component
scope: "Component diagram for the Regional GKE Clusters container"
parentContainer:
  name: "Regional GKE Clusters"
elements:
  - type: "component"
    name: "Ingress Controller"
    technology: "Envoy / GKE Ingress"
    description: "Handles geo-routing and TLS 1.3 termination for incoming traffic."
  - type: "component"
    name: "Service Mesh Control Plane"
    technology: "Istio"
    description: "Manages mTLS and internal traffic isolation for zero-trust boundaries."
  - type: "component"
    name: "External Secrets Operator"
    technology: "External Secrets Operator / Workload Identity"
    description: "Manages PHI keys securely via GCP Secret Manager."
  - type: "component"
    name: "Security & Observability Agents"
    technology: "Falco, Argo Rollouts, Prometheus, Grafana, Cloud Logging"
    description: "Enforces security runtime policies, progressive delivery, and monitoring."
relationships:
  - source: "External Secrets Operator"
    destination: "GCP Secret Manager"
    description: "Fetches secrets securely via HTTPS/OIDC federation."
  - source: "Ingress Controller"
    destination: "API Gateway"
    description: "Routes HTTP/2 and gRPC traffic internally via ClusterIP services."
  - source: "Global Management Plane"
    destination: "Regional GKE Clusters"
    description: "Drives declarative cluster state via GitOps (ArgoCD)."