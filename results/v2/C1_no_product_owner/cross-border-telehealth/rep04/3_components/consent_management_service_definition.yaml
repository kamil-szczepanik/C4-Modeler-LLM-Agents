level: component
scope: "Component diagram for the Consent Management Service container"
parentContainer:
  name: "Consent Management Service"
elements:
  - type: "component"
    name: "Consent API Handler"
    technology: "Go / gRPC server"
    description: "Managing ingress and validation requests"
  - type: "component"
    name: "Consent Policy Engine"
    technology: "Go"
    description: "Evaluates RBAC, ABAC, and GDPR/HIPAA compliance rules"
  - type: "component"
    name: "Audit Logger Component"
    technology: "Go / gRPC"
    description: "Emits cryptographically verifiable immutable access logs"
  - type: "component"
    name: "Consent Repository Adapter"
    technology: "Go / pgx / SQL"
    description: "Interfaces with regional Cloud SQL PostgreSQL instances"
  - type: "component"
    name: "Cache Invalidation Subsystem"
    technology: "Ristretto / Go"
    description: "Manages eventual consistency for the local Ristretto cache"
  - type: "component"
    name: "GCP Pub/Sub"
    technology: "GCP Pub/Sub"
    description: "Relays regional cache invalidation events securely"
relationships:
  - source: "API Gateway"
    destination: "Consent API Handler"
    description: "Validates inline consent via [gRPC over mTLS]"
  - source: "Consent API Handler"
    destination: "Consent Policy Engine"
    description: "Evaluates rules via [In-memory Go function calls]"
  - source: "Consent Policy Engine"
    destination: "Consent Repository Adapter"
    description: "Reads and writes policies via [gRPC/SQL]"
  - source: "Consent Repository Adapter"
    destination: "Cloud SQL PostgreSQL"
    description: "Executes region-isolated queries via [pgx / TLS-secured SQL]"
  - source: "Consent API Handler"
    destination: "Audit Logger Component"
    description: "Emits security audit logs via [gRPC]"
  - source: "Cache Invalidation Subsystem"
    destination: "GCP Pub/Sub"
    description: "Publishes and consumes hashed revocation events via [Pub/Sub protocol]"