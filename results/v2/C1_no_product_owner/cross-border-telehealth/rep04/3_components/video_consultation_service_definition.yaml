level: component
scope: "Component diagram for the Video Consultation Service container"
parentContainer:
  name: "Video Consultation Service"
elements:
  - type: "component"
    name: "Signaling Controller"
    technology: "Node.js / WebSockets"
    description: "Manages low-latency session signaling and SDP exchanges."
  - type: "component"
    name: "SFU Media Router"
    technology: "LiveKit Core / Go"
    description: "Powers the SFU media routing container for real-time video."
  - type: "component"
    name: "Adaptive Quality Manager"
    technology: "Go"
    description: "Enforces bitrate limits and ensures reliable video consultations under degraded rural bandwidth constraints."
  - type: "component"
    name: "Session Audit Logger"
    technology: "Go / gRPC"
    description: "Emits and persists signed session lifecycle events."
  - type: "component"
    name: "Regional IAM Services"
    technology: "Google Cloud IAM"
    description: "Validates JWT tokens securely."
  - type: "component"
    name: "Data Storage"
    technology: "SQL / Google Cloud Memorystore for Redis"
    description: "Persists signed audit logs and maintains decoupled, regional ephemeral room state."
relationships:
  - source: "Signaling Controller"
    destination: "SFU Media Router"
    description: "Controls media streams [gRPC]"
  - source: "Adaptive Quality Manager"
    destination: "SFU Media Router"
    description: "Enforces bitrate limits [Internal API]"
  - source: "Signaling Controller"
    destination: "Regional IAM Services"
    description: "Validates JWT tokens [gRPC/mTLS]"
  - source: "Signaling Controller"
    destination: "Session Audit Logger"
    description: "Emits session lifecycle events [gRPC]"
  - source: "Session Audit Logger"
    destination: "Data Storage"
    description: "Persists signed audit logs [SQL]"