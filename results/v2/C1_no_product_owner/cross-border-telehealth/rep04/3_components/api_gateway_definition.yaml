level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "GCP External HTTP(S) Load Balancer & TLS Termination Edge Policy Component"
    technology: "GCP Cloud Load Balancing, WAF"
    description: "Handles global geo-routing, edge WAF protection, HTTPS/TLS 1.3, and WebSockets/WebRTC session handling."
  - type: "component"
    name: "Auth & Consent Enforcement Component"
    technology: "Envoy Ext-Authz, OAuth2, JWT"
    description: "Enforces authentication with token binding and validates purpose-limitation consent."
  - type: "component"
    name: "Traffic Routing & Mesh Proxy Component"
    technology: "Envoy Sidecar/Gateway, GCP Service Mesh, SPIFFE/SPIRE"
    description: "Manages edge routing, circuit breaking, and strict mTLS for internal communication."
relationships:
  - source: "GCP External HTTP(S) Load Balancer & TLS Termination Edge Policy Component"
    destination: "Auth & Consent Enforcement Component"
    description: "Forwards incoming client traffic for authentication and authorization check [HTTPS/TLS]"
  - source: "Auth & Consent Enforcement Component"
    destination: "Traffic Routing & Mesh Proxy Component"
    description: "Passes authorized traffic for internal routing [gRPC]"
  - source: "Traffic Routing & Mesh Proxy Component"
    destination: "Consent Management Service"
    description: "Validates purpose-limitation consent and forwards regional requests [gRPC / strict mTLS]"