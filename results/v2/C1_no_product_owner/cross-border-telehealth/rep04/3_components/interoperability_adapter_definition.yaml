level: component
scope: "Component diagram for the Interoperability Adapter container"
parentContainer:
  name: "Interoperability Adapter"
elements:
  - type: "component"
    name: "FHIR Translation Service"
    technology: "TypeScript/Fastify"
    description: "Translates internal domain models into external US HL7 FHIR interoperability standards."
  - type: "component"
    name: "EU E-Prescription Adapter"
    technology: "TypeScript"
    description: "Translates internal domain models into EU E-Prescription standards and interacts with national gateways."
  - type: "component"
    name: "Egress Policy Enforcer"
    technology: "Rust/WebAssembly"
    description: "Powers high-performance deterministic payload inspection and enforces strict regional data residency and compliance."
  - type: "component"
    name: "Resilience & Queue Manager"
    technology: "Node.js/BullMQ"
    description: "Manages asynchronous retries and offloads failing egress messages."
  - type: "component"
    name: "Data Residency Enforcer"
    technology: "Rust/Node.js"
    description: "Ensures health data never crosses borders without explicit consent."
relationships:
  - source: "Egress Policy Enforcer"
    destination: "FHIR Translation Service"
    description: "Forwards sanitized payloads [Internal]"
  - source: "Egress Policy Enforcer"
    destination: "EU E-Prescription Adapter"
    description: "Forwards sanitized payloads [Internal]"
  - source: "Resilience & Queue Manager"
    destination: "GCP Pub/Sub"
    description: "Offloads failing egress messages [gRPC/HTTPS]"