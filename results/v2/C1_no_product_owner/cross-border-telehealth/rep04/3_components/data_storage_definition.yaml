level: component
scope: "Component diagram for the Data Storage container"
parentContainer:
  name: "Data Storage"
elements:
  - type: "component"
    name: "Relational Database Component"
    technology: "Cloud SQL PostgreSQL"
    description: "Stores transactional data, metadata, and audit logs with row-level security (RLS)."
  - type: "component"
    name: "Object Storage Component"
    technology: "Google Cloud Storage"
    description: "Stores unstructured blobs and consultation recordings with regional bucket locks."
  - type: "component"
    name: "Audit & Traceability Ledger Component"
    technology: "Append-only ledgers and cryptographic hashing"
    description: "Guarantees medical accountability and tamper-proof traceability for AI symptom-checker outputs."
  - type: "component"
    name: "DataAccess Router"
    technology: "Internal Library/Sidecar"
    description: "Routes data access requests securely within the storage container."
  - type: "component"
    name: "HL7/FHIR Mapping Schema layer"
    technology: "Schema mapping layer"
    description: "Maps data to HL7/FHIR standards for interoperability."
  - type: "component"
    name: "Customer-Managed Encryption Keys"
    technology: "CMEK"
    description: "Enforces data-at-rest encryption across regions."
  - type: "component"
    name: "Google Cloud IAM Database Authentication"
    technology: "IAM Authentication"
    description: "Eliminates static credentials using short-lived tokens."
relationships:
  - source: "Video Consultation Service"
    destination: "Relational Database Component"
    description: "Persists session data [gRPC/SQL via mTLS/TLS 1.3]"
  - source: "AI Symptom Checker"
    destination: "Relational Database Component"
    description: "Persists symptom analysis logs and inputs [gRPC/SQL via mTLS/TLS 1.3]"
  - source: "Consent Management Service"
    destination: "Relational Database Component"
    description: "Persists consent records [gRPC/SQL via mTLS/TLS 1.3]"
  - source: "Relational Database Component"
    destination: "Cloud Audit Logs"
    description: "Streams audit and access logs [Cloud Logging API]"