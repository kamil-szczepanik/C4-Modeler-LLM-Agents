level: component
scope: "Component diagram for the AI Symptom Checker container"
parentContainer:
  name: "AI Symptom Checker"
elements:
  - type: "component"
    name: "Symptom API Controller"
    technology: "Python / FastAPI"
    description: "Routes authenticated ingress requests and validates user consent."
  - type: "component"
    name: "PHI Sanitization Middleware"
    technology: "Python"
    description: "Sanitizes Protected Health Information before processing."
  - type: "component"
    name: "Clinical NLP Pipeline"
    technology: "spaCy / Hugging Face"
    description: "Performs tokenization and clinical natural language processing."
  - type: "component"
    name: "Triage Inference Engine"
    technology: "PyTorch / Triton Inference Server"
    description: "Handles urgency classification and inference."
  - type: "component"
    name: "Audit & Traceability Logger"
    technology: "Python"
    description: "Emits signed audit records via an in-memory queue."
  - type: "component"
    name: "Istio Service Mesh Circuit Breaker"
    technology: "Istio"
    description: "Manages traffic and provides resilience for unstable connections."
relationships:
  - source: "Symptom API Controller"
    destination: "PHI Sanitization Middleware"
    description: "Passes ingress request data for sanitization [In-process]"
  - source: "PHI Sanitization Middleware"
    destination: "Clinical NLP Pipeline"
    description: "Forwards sanitized text for tokenization [In-process]"
  - source: "Clinical NLP Pipeline"
    destination: "Triage Inference Engine"
    description: "Sends processed tokens for urgency classification [Internal data flow]"
  - source: "Triage Inference Engine"
    destination: "Audit & Traceability Logger"
    description: "Emits signed audit records [In-memory queue]"
  - source: "Symptom API Controller"
    destination: "Istio Service Mesh Circuit Breaker"
    description: "Manages network traffic and fault tolerance [mTLS / Mesh]"