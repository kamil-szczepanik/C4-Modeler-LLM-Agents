level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Route Router"
    technology: "Envoy Proxy"
    description: "Handles external edge routing and ingress traffic for the platform."
  - type: "component"
    name: "Auth & Token Translation Filter"
    technology: "Go, OAuth2/OIDC, JWT"
    description: "Authenticates users via OAuth2/OIDC and translates stateless short-lived tokens containing region and consent scopes."
  - type: "component"
    name: "Consent Enforcement Interceptor"
    technology: "Go"
    description: "Enforces real-time consent revocation and regulatory checks on incoming requests."
  - type: "component"
    name: "Telemetry & Audit Sidecar"
    technology: "OpenTelemetry Collector"
    description: "Captures distributed traces and request metadata with persistent disk buffering."
relationships:
  - source: "Edge Route Router"
    destination: "Auth & Token Translation Filter"
    description: "Forwards incoming HTTPS requests for token validation"
  - source: "Auth & Token Translation Filter"
    destination: "Consent Enforcement Interceptor"
    description: "Passes authenticated context for consent verification"
  - source: "Consent Enforcement Interceptor"
    destination: "Telemetry & Audit Sidecar"
    description: "Asynchronously forwards cryptographically verified access logs and telemetry"