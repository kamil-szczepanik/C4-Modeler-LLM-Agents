level: component
scope: "Component diagram for the Regional Message Broker container"
parentContainer:
  name: "Regional Message Broker"
elements:
  - type: "component"
    name: "Event Ingestion Gateway"
    technology: "Envoy Proxy sidecar"
    description: "Handles event ingestion, terminates gRPC over mTLS connections using SPIFFE/SPIRE, and routes validated messages."
  - type: "component"
    name: "Regional Topic Router"
    technology: "GCP Pub/Sub Topics"
    description: "Regionally isolated message brokering with region-scoped IAM policies ensuring strict regional data residency."
  - type: "component"
    name: "Dead-Letter & Retry Controller"
    technology: "GCP Pub/Sub Dead-Letter Topics with Cloud Monitoring"
    description: "Routes and manages unacknowledged messages after max retries."
  - type: "component"
    name: "Immutable Audit Logging Service"
    technology: "Node.js / GCP Cloud KMS"
    description: "Provides application-layer envelope encryption restricted to regional keys for immutable audit logging."
relationships:
  - source: "Consultation Service"
    destination: "Event Ingestion Gateway"
    description: "Publishes regional telemetry and chat events via gRPC over mTLS"
  - source: "Clinical & Prescription Service"
    destination: "Event Ingestion Gateway"
    description: "Publishes prescription events via gRPC over mTLS"
  - source: "Event Ingestion Gateway"
    destination: "Regional Topic Router"
    description: "Routes validated messages via Pub/Sub API"
  - source: "Regional Topic Router"
    destination: "Dead-Letter & Retry Controller"
    description: "Routes unacknowledged messages after max retries via Pub/Sub API"