level: component
scope: "Component diagram for the Clinical & Prescription Service container"
parentContainer:
  name: "Clinical & Prescription Service"
elements:
  - type: "component"
    name: "Clinical Core Component"
    technology: "Java, Spring Boot"
    description: "Provides secure video consultations and core clinical service logic."
  - type: "component"
    name: "Prescription Workflow Orchestrator"
    technology: "Java, Spring Boot / Temporal SDK"
    description: "Provides durable execution and resilient retries for prescription workflows."
  - type: "component"
    name: "FHIR US Adapter Component"
    technology: "Java, Spring Boot / HAPI FHIR"
    description: "Facilitates standards-compliant HL7 FHIR data translation for US interoperability."
  - type: "component"
    name: "EU e-Prescription Adapter Component"
    technology: "Java, Spring Boot"
    description: "Handles EU e-prescription adapter logic and transmissions."
  - type: "component"
    name: "Consent Enforcer Component"
    technology: "Java, Spring Boot / Interceptor"
    description: "Validates patient consent via in-process interceptors."
  - type: "component"
    name: "Cloud SQL"
    technology: "PostgreSQL with GCP CMEK"
    description: "Stores clinical data with region-isolated cryptographic boundaries."
  - type: "component"
    name: "Regional Message Broker"
    technology: "GCP Pub/Sub"
    description: "Handles regional messaging and event distribution."
  - type: "component"
    name: "National e-Prescription Gateways and US Pharmacy Systems"
    technology: "REST/gRPC, HL7 FHIR over mTLS"
    description: "External systems for national e-prescriptions and pharmacy integration."
relationships:
  - source: "Clinical Core Component"
    destination: "Consent Enforcer Component"
    description: "Validates patient consent [In-process Java method call]"
  - source: "Clinical Core Component"
    destination: "Cloud SQL"
    description: "Reads and writes clinical data [JDBC, PostgreSQL Protocol / KMS]"
  - source: "Prescription Workflow Orchestrator"
    destination: "EU e-Prescription Adapter Component"
    description: "Delegates external transmissions [gRPC]"
  - source: "Prescription Workflow Orchestrator"
    destination: "FHIR US Adapter Component"
    description: "Delegates external transmissions [gRPC]"
  - source: "EU e-Prescription Adapter Component"
    destination: "National e-Prescription Gateways and US Pharmacy Systems"
    description: "Transmits prescriptions [REST/gRPC, HL7 FHIR over mTLS]"
  - source: "FHIR US Adapter Component"
    destination: "National e-Prescription Gateways and US Pharmacy Systems"
    description: "Transmits prescriptions [REST/gRPC, HL7 FHIR over mTLS]"