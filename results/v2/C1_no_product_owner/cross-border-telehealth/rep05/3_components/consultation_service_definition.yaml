level: component
scope: "Component diagram for the Consultation Service container"
parentContainer:
  name: "Consultation Service"
elements:
  - type: "component"
    name: "Session Controller"
    technology: "Node.js, TypeScript, NestJS"
    description: "Manages video consultations, WebRTC signaling, and session lifecycles."
  - type: "component"
    name: "Signaling Manager"
    technology: "Node.js"
    description: "Handles WebRTC signaling and exchanges SDP offers/answers."
  - type: "component"
    name: "Data Residency Enforcer"
    technology: "Middleware"
    description: "Enforces regional data compliance across GCP regions."
  - type: "component"
    name: "Degraded-Mode Monitor"
    technology: "Component"
    description: "Ensures graceful degradation on low-bandwidth connections."
  - type: "component"
    name: "Consent Enforcer Interceptor"
    technology: "Component"
    description: "Validates secure patient consent."
  - type: "component"
    name: "Telemetry Adaptor"
    technology: "OpenTelemetry SDK"
    description: "Enables distributed tracing and metric collection."
  - type: "component"
    name: "SFU Media Relay"
    technology: "Mediasoup, C++"
    description: "Manages room allocations and orchestrates media streams."
  - type: "component"
    name: "Regional Message Broker"
    technology: "GCP Pub/Sub"
    description: "Publishes session state changes and metrics."
relationships:
  - source: "API Gateway"
    destination: "Session Controller"
    description: "Routes incoming consultation requests [gRPC over mTLS]"
  - source: "Session Controller"
    destination: "Consent & Policy Engine"
    description: "Validates regional data sharing consent [gRPC over mTLS]"
  - source: "Session Controller"
    destination: "Regional Message Broker"
    description: "Publishes session state changes and metrics [gRPC over mTLS]"
  - source: "Signaling Manager"
    destination: "SFU Media Relay"
    description: "Manages room allocations and orchestrates media streams [gRPC]"
  - source: "Signaling Manager"
    destination: "Client"
    description: "Exchanges SDP offers/answers [WebSockets with short-lived JWTs]"