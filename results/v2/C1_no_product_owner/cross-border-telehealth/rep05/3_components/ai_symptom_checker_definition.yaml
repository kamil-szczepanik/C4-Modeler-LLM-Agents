level: component
scope: "Component diagram for the AI Symptom Checker container"
parentContainer:
  name: "AI Symptom Checker"
elements:
  - type: "component"
    name: "API Router"
    technology: "FastAPI / Python"
    description: "API Router / Controller Component handling high-throughput async gRPC execution."
  - type: "component"
    name: "Clinical NLP"
    technology: "spaCy / Hugging Face Transformers"
    description: "Clinical NLP / Feature Extraction Component for tokenization and feature extraction."
  - type: "component"
    name: "Inference Orchestrator"
    technology: "Python"
    description: "Inference Orchestrator Component managing AI model inference."
  - type: "component"
    name: "Audit & Traceability Component"
    technology: "Python SDK, Cloud KMS"
    description: "Audit & Traceability Component for cryptographic signing, model integrity verification, and audit logging."
  - type: "component"
    name: "Terminology Mapping Component"
    technology: "Python"
    description: "Terminology Mapping Component for standardizing clinical terms."
relationships:
  - source: "API Gateway"
    destination: "API Router"
    description: "Routes requests via gRPC over mTLS"
  - source: "Inference Orchestrator"
    destination: "Regional GCS Buckets"
    description: "Fetches model weights via HTTPS"
  - source: "Audit & Traceability Component"
    destination: "Immutable Audit Logging Service"
    description: "Pushes signed audit logs via gRPC"