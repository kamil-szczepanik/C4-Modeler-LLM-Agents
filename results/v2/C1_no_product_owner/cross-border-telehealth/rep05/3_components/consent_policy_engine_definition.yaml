level: component
scope: "Component diagram for the Consent & Policy Engine container"
parentContainer:
  name: "Consent & Policy Engine"
elements:
  - type: "component"
    name: "Policy Decision Point (PDP)"
    technology: "Go, Open Policy Agent / OPA"
    description: "Evaluates access tokens and scopes, queries patient consents, and requests capability tokens."
  - type: "component"
    name: "Consent Manager"
    technology: "Go, BigCache"
    description: "Manages granular patient consents and persists consent state in-memory and via PostgreSQL."
  - type: "component"
    name: "Regional Residency Enforcer"
    technology: "Go"
    description: "Enforces data residency constraints and publishes policy violation alerts."
  - type: "component"
    name: "Residency Token Issuer"
    technology: "Go"
    description: "Issues cryptographically signed capability tokens for validated requests."
  - type: "component"
    name: "GCP Cloud SQL (PostgreSQL)"
    technology: "PostgreSQL / Cloud SQL with GCP KMS"
    description: "Secures persistent storage of regional consent records."
  - type: "component"
    name: "GCP Pub/Sub"
    technology: "GCP Pub/Sub"
    description: "Regional message broker used for publishing policy violation alerts."
  - type: "component"
    name: "API Gateway"
    technology: "API Gateway"
    description: "External entry point that evaluates access tokens and scopes."
  - type: "component"
    name: "Immutable Audit Logging Service"
    technology: "gRPC over mTLS"
    description: "Receives cryptographically signed audit logs."
  - type: "component"
    name: "Regional Message Broker"
    technology: "GCP Pub/Sub"
    description: "Receives policy violation alerts from the Regional Residency Enforcer."
relationships:
  - source: "API Gateway"
    destination: "Policy Decision Point (PDP)"
    description: "Evaluates access tokens and scopes [gRPC over mTLS]"
  - source: "Policy Decision Point (PDP)"
    destination: "Consent Manager"
    description: "Queries active patient consents [In-process Go function call]"
  - source: "Consent Manager"
    destination: "GCP Cloud SQL (PostgreSQL)"
    description: "Persists consent state [PostgreSQL Protocol / TLS with GCP KMS]"
  - source: "Policy Decision Point (PDP)"
    destination: "Residency Token Issuer"
    description: "Requests scoped capability token [In-process Go function call]"
  - source: "Consent & Policy Engine"
    destination: "Immutable Audit Logging Service"
    description: "Publishes cryptographically signed logs [gRPC over mTLS]"
  - source: "Regional Residency Enforcer"
    destination: "Regional Message Broker"
    description: "Publishes policy violation alerts [GCP Pub/Sub]"