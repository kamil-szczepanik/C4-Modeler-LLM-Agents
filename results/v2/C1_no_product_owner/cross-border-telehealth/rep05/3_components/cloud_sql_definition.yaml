level: component
scope: "Component diagram for the Cloud SQL container"
parentContainer:
  name: "Cloud SQL"
elements:
  - type: "component"
    name: "Primary DB Instance"
    technology: "PostgreSQL 15"
    description: "Stores regional clinical records, prescriptions, and consent records with schema isolation and RLS."
  - type: "component"
    name: "PgBouncer"
    technology: "PostgreSQL Connection Pooler"
    description: "Manages and optimizes high concurrency database connection pooling."
relationships:
  - source: "PgBouncer"
    destination: "Primary DB Instance"
    description: "Routes queries over local loopback [PostgreSQL Protocol / TLS 1.3]"