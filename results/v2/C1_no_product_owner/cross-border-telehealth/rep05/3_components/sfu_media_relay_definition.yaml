level: component
scope: "Component diagram for the SFU Media Relay container"
parentContainer:
  name: "SFU Media Relay"
elements:
  - type: "component"
    name: "RTP/RTCP Packet Processor"
    technology: "C++, Mediasoup"
    description: "Processes and routes RTP/RTCP packets for video and audio streams."
  - type: "component"
    name: "Simulcast & Layer Manager"
    technology: "C++, Mediasoup"
    description: "Manages simulcast layers to adapt video quality for low-bandwidth conditions."
  - type: "component"
    name: "Regional Egress Controller"
    technology: "C++, Mediasoup"
    description: "Enforces regional boundary drops and data residency policies."
  - type: "component"
    name: "Token Validation & Signaling Agent"
    technology: "C++, Mediasoup"
    description: "Validates session tokens and handles WebRTC signaling."
relationships:
  - source: "Token Validation & Signaling Agent"
    destination: "Simulcast & Layer Manager"
    description: "Passes authorized session context [In-memory C++ API]"
  - source: "Simulcast & Layer Manager"
    destination: "RTP/RTCP Packet Processor"
    description: "Stream routing rules [In-memory C++ API]"
  - source: "SFU Media Relay"
    destination: "Regional Egress Controller"
    description: "Enforces regional boundary drops [Internal C++ policy hook]"