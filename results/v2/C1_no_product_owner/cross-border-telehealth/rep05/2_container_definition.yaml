level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU/US)"
    description: "Patients located in the EU or US seeking video consultations, e-prescriptions, and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed medical professionals conducting video consultations and prescribing treatments."
  - type: "externalSystem"
    name: "National e-Prescription Gateways (EU) and Pharmacy Systems (US)"
    description: "External national gateways and pharmacy systems connected via HL7 FHIR."
  - type: "externalSystem"
    name: "Identity Providers (OAuth2/OIDC)"
    description: "External identity providers handling authentication with MFA."
  - type: "container"
    name: "API Gateway"
    technology: "Go, Envoy"
    description: "Handles external ingress, zero-trust mTLS service mesh routing, and OAuth2/OIDC authentication."
  - type: "container"
    name: "Consultation Service"
    technology: "Node.js, WebRTC"
    description: "Manages video consultations and coordinates with the SFU Media Relay."
  - type: "container"
    name: "SFU Media Relay"
    technology: "Mediasoup, C++"
    description: "WebRTC SFU media relay for low-bandwidth video resilience (<300 kbit/s)."
  - type: "container"
    name: "Clinical & Prescription Service"
    technology: "Java, Spring Boot"
    description: "Manages clinical data and interfaces with HL7 FHIR (US) and EU e-Prescription Gateways."
  - type: "container"
    name: "AI Symptom Checker"
    technology: "Python, FastAPI"
    description: "Provides local AI-powered symptom checking capabilities per region."
  - type: "container"
    name: "Consent & Policy Engine"
    technology: "Go"
    description: "Enforces strict regional data residency, GDPR, and HIPAA compliance policies."
  - type: "container"
    name: "Regional Message Broker"
    technology: "GCP Pub/Sub"
    description: "Regionally isolated message brokering ensuring strict data residency."
  - type: "container"
    name: "Cloud SQL"
    technology: "PostgreSQL"
    description: "Isolated regional data storage with KMS encryption."
relationships:
  - source: "Patients (EU/US)"
    destination: "API Gateway"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS (TLS 1.3), OAuth2/OIDC"
  - source: "Licensed Clinicians"
    destination: "API Gateway"
    description: "Conducts video consultations and manages patient care"
    technology: "HTTPS (TLS 1.3), OAuth2/OIDC"
  - source: "API Gateway"
    destination: "Identity Providers (OAuth2/OIDC)"
    description: "Authenticates users"
    technology: "OAuth2/OIDC"
  - source: "API Gateway"
    destination: "Consultation Service"
    description: "Routes consultation requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Clinical & Prescription Service"
    description: "Routes clinical and prescription requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "AI Symptom Checker"
    description: "Routes symptom check requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Consent & Policy Engine"
    description: "Validates access and consent policies"
    technology: "gRPC over mTLS"
  - source: "Consultation Service"
    destination: "SFU Media Relay"
    description: "Relays video and audio streams"
    technology: "WebRTC/UDP (DTLS-SRTP)"
  - source: "Clinical & Prescription Service"
    destination: "National e-Prescription Gateways (EU) and Pharmacy Systems (US)"
    description: "Transmits prescriptions and health records"
    technology: "REST/gRPC, HL7 FHIR"
  - source: "Consultation Service"
    destination: "Regional Message Broker"
    description: "Publishes and consumes consultation events"
    technology: "gRPC over mTLS"
  - source: "Clinical & Prescription Service"
    destination: "Regional Message Broker"
    description: "Publishes and consumes clinical events"
    technology: "gRPC over mTLS"
  - source: "Clinical & Prescription Service"
    destination: "Cloud SQL"
    description: "Reads and writes clinical data"
    technology: "PostgreSQL Protocol / KMS"
  - source: "Consent & Policy Engine"
    destination: "Cloud SQL"
    description: "Reads and writes consent records"
    technology: "PostgreSQL Protocol / KMS"