level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and the US while strictly enforcing regional data residency and compliance."
elements:
  - type: "person"
    name: "Patients (EU/US)"
    description: "Patients located in the EU or US seeking video consultations, e-prescriptions, and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed medical professionals conducting video consultations and prescribing treatments."
  - type: "externalSystem"
    name: "Global Control Plane"
    description: "Global control plane managing cross-border operations."
  - type: "externalSystem"
    name: "National e-Prescription Gateways (EU) and Pharmacy Systems (US)"
    description: "External national gateways and pharmacy systems connected via HL7 FHIR."
  - type: "externalSystem"
    name: "Identity Providers (OAuth2/OIDC)"
    description: "External identity providers handling authentication with MFA."
  - type: "externalSystem"
    name: "AI Model Registry"
    description: "Locally deployed AI model registry per region."
  - type: "externalSystem"
    name: "Immutable Audit Logging Service"
    description: "Service providing cryptographically signed audit logs for compliance."
relationships:
  - source: "Patients (EU/US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS / WebRTC"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Conducts video consultations and manages patient care"
    technology: "HTTPS / WebRTC"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity Providers (OAuth2/OIDC)"
    description: "Authenticates users with MFA"
    technology: "OIDC / OAuth2"
  - source: "Cross-Border Telehealth Platform"
    destination: "National e-Prescription Gateways (EU) and Pharmacy Systems (US)"
    description: "Transmits prescriptions and health records"
    technology: "HTTPS / HL7 FHIR"
  - source: "Cross-Border Telehealth Platform"
    destination: "Global Control Plane"
    description: "Coordinates cross-border operations"
    technology: "Mutual TLS (mTLS)"
  - source: "Cross-Border Telehealth Platform"
    destination: "AI Model Registry"
    description: "Runs AI symptom checking locally per region"
    technology: "Local API"
  - source: "Cross-Border Telehealth Platform"
    destination: "Immutable Audit Logging Service"
    description: "Records immutable audit trails"
    technology: "Secure API"