level: component
scope: "Component diagram for the BigQuery container"
parentContainer:
  name: "BigQuery"
elements:
  - type: "component"
    name: "Log Ingestion Service"
    technology: "GCP BigQuery & BigQuery Storage Write API"
    description: "Streams audit trails via gRPC / BigQuery Storage Write API."
  - type: "component"
    name: "Compliance Analytics View Layer"
    technology: "BigQuery SQL Views"
    description: "Provides query access to audit data for compliance users."
  - type: "component"
    name: "Partition & Retention Manager"
    technology: "BigQuery Internal Storage Engine"
    description: "Manages automated partitioning, data retention, and streaming writes into regional datasets."
relationships:
  - source: "Log Ingestion Service"
    destination: "Partition & Retention Manager"
    description: "Writes streaming data"
  - source: "Compliance Analytics View Layer"
    destination: "Log Ingestion Service"
    description: "Queries audit data"