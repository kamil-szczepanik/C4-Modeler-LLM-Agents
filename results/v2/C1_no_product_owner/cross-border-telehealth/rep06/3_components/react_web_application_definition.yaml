level: component
scope: "Component diagram for the React Web Application container"
parentContainer:
  name: "React Web Application"
elements:
  - type: "person"
    name: "Patients and Clinicians"
    technology: "Web Browser / End User"
    description: "Accesses the telehealth platform via HTTPS and WSS."
  - type: "component"
    name: "Routing & State Management"
    technology: "React Router / Redux Toolkit"
    description: "Manages routing, ephemeral session state in volatile memory, and delegates authorization checks."
  - type: "component"
    name: "Authentication & Consent Module"
    technology: "OIDC/OAuth2 Client"
    description: "Handles authentication and consent management."
  - type: "component"
    name: "Telehealth Interface Component"
    technology: "WebRTC / LiveKit SDK"
    description: "Powers adaptive-bitrate video consultations for low-bandwidth connections."
  - type: "component"
    name: "AI Symptom Checker UI Component"
    technology: "React / Tailwind"
    description: "Provides the user interface for AI symptom checks."
  - type: "component"
    name: "API Client & Localization Layer"
    technology: "Axios / i18next"
    description: "Routes all network traffic with injected regional context and handles localization."
  - type: "container"
    name: "GCP Cloud Endpoints / Envoy API Gateway"
    technology: "GCP Cloud Endpoints / Envoy"
    description: "Gateway that receives metadata, consent, and WSS signaling via HTTPS/WSS."
  - type: "container"
    name: "GCP Cloud CDN / Regional GCP Buckets"
    technology: "GCP Cloud CDN / Google Cloud Storage"
    description: "Enforces regional asset isolation for data residency in europe-west3 and us-central1."
relationships:
  - source: "Patients and Clinicians"
    destination: "React Web Application"
    description: "Accesses telehealth platform via HTTPS (JSON/REST) and WSS (WebSockets/QUIC)"
  - source: "Routing & State Management"
    destination: "Authentication & Consent Module"
    description: "Delegates authorization checks on route entry"
  - source: "Telehealth Interface Component"
    destination: "API Client & Localization Layer"
    description: "Routes all network traffic with injected regional context"
  - source: "AI Symptom Checker UI Component"
    destination: "API Client & Localization Layer"
    description: "Routes all network traffic with injected regional context"
  - source: "React Web Application"
    destination: "GCP Cloud Endpoints / Envoy API Gateway"
    description: "Transmits metadata, consent, and WSS signaling via HTTPS/WSS with TLS 1.3"