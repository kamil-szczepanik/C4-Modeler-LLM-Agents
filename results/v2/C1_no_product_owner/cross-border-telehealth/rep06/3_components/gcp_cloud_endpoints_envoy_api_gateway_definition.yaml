level: component
scope: "Component diagram for the GCP Cloud Endpoints / Envoy API Gateway container"
parentContainer:
  name: "GCP Cloud Endpoints / Envoy API Gateway"
elements:
  - type: "component"
    name: "Envoy Proxy Core"
    technology: "Envoy / GCP Cloud Endpoints"
    description: "Handles edge API routing, security, and traffic control for HTTPS and WSS protocols."
  - type: "component"
    name: "JWT/Auth Validation Filter"
    technology: "Envoy Filter / Auth Plugin"
    description: "Validates JSON Web Tokens and enforces authentication before request processing."
  - type: "component"
    name: "Region Routing Module"
    technology: "Envoy Routing Module / Anthos Service Mesh"
    description: "Routes internal logic and AI checks to regional containers using gRPC over mTLS."
  - type: "component"
    name: "Rate Limiting & Throttling Module"
    technology: "Redis (Memorystore)"
    description: "Executes token bucket rate limiting to handle unstable rural connections."
  - type: "component"
    name: "Telemetry & Audit Interceptor"
    technology: "OpenTelemetry & Fluent Bit"
    description: "Emits regional distributed tracing and immutable audit events without cross-border leaks."
relationships:
  - source: "Clients"
    destination: "Envoy Proxy Core"
    description: "Sends requests [HTTPS (JSON/REST) and WSS (WebSockets/QUIC)]"
  - source: "Envoy Proxy Core"
    destination: "Rate Limiting & Throttling Module"
    description: "Checks limits [Local gRPC]"
  - source: "JWT/Auth Validation Filter"
    destination: "Telemetry & Audit Interceptor"
    description: "Emits audit events [Internal channel]"
  - source: "Region Routing Module"
    destination: "Core Services Container"
    description: "Routes internal logic [gRPC over mTLS via Anthos Service Mesh]"
  - source: "Region Routing Module"
    destination: "AI Symptom Checker Container"
    description: "Routes AI checks [gRPC over mTLS via Anthos Service Mesh]"