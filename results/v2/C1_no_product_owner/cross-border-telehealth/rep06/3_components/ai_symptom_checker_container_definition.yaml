level: component
scope: "Component diagram for the AI Symptom Checker Container container"
parentContainer:
  name: "AI Symptom Checker Container"
elements:
  - type: "component"
    name: "API Router"
    technology: "FastAPI / Pydantic"
    description: "Handles API endpoints, input validation, and schema sanitization."
  - type: "component"
    name: "Model Orchestrator"
    technology: "Python"
    description: "Region-aware orchestrator managing model execution and data routing."
  - type: "component"
    name: "Clinical Rules Engine"
    technology: "Python / Pydantic"
    description: "Executes deterministic clinical validation rules."
  - type: "component"
    name: "Traceability Logger"
    technology: "Python"
    description: "Asynchronously emits audit events."
  - type: "component"
    name: "GCP Cloud Storage"
    technology: "GCP Cloud Storage"
    description: "Stores immutable, version-tagged model weights with cryptographic verification."
  - type: "component"
    name: "GCP BigQuery"
    technology: "GCP BigQuery"
    description: "Securely stores pseudonymized, timestamped audit payloads for EU MDR traceability."
relationships:
  - source: "API Router"
    destination: "Model Orchestrator"
    description: "Direct function calls"
  - source: "Model Orchestrator"
    destination: "Clinical Rules Engine"
    description: "In-memory data passing [In-memory]"
  - source: "Clinical Rules Engine"
    destination: "API Router"
    description: "In-memory data passing [In-memory]"
  - source: "Model Orchestrator"
    destination: "Traceability Logger"
    description: "Asynchronous audit event emission [In-memory / Async Queue]"
  - source: "Traceability Logger"
    destination: "GCP BigQuery"
    description: "Audit log export [HTTPS / GCP BigQuery API]"
  - source: "Model Orchestrator"
    destination: "GCP Cloud Storage"
    description: "Model weight retrieval with SHA-256 verification [HTTPS]"