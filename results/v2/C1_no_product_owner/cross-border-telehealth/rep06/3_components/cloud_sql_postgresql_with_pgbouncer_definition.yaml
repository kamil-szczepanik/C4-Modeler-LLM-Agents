level: component
scope: "Component diagram for the Cloud SQL (PostgreSQL with PgBouncer) container"
parentContainer:
  name: "Cloud SQL (PostgreSQL with PgBouncer)"
elements:
  - type: "component"
    name: "PgBouncer"
    technology: "Connection Pooler"
    description: "Manages high-concurrency Node.js connections using transaction pooling."
  - type: "component"
    name: "PostgreSQL Database Engine"
    technology: "Google Cloud SQL for PostgreSQL 15+"
    description: "Core transactional RDBMS ensuring strict ACID guarantees and region isolation."
  - type: "component"
    name: "Audit & Traceability Subsystem"
    technology: "PostgreSQL native audit extensions (pgaudit)"
    description: "Satisfies HIPAA audit logging and EU MDR traceability."
  - type: "component"
    name: "Regional Schema Partition Manager"
    technology: "PostgreSQL Schemas & RLS"
    description: "Enforces context-aware queries and region isolation via Row-Level Security."
relationships:
  - source: "PgBouncer"
    destination: "PostgreSQL Database Engine"
    description: "Relays pooled queries [TCP / Unix Domain Sockets]"
  - source: "Regional Schema Partition Manager"
    destination: "PostgreSQL Database Engine"
    description: "Executes partitioned and isolation-enforced data operations"
  - source: "Audit & Traceability Subsystem"
    destination: "PostgreSQL Database Engine"
    description: "Captures audit logs and traceability data from database operations"