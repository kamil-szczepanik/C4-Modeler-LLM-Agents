level: component
scope: "Component diagram for the React Native Mobile App container"
parentContainer:
  name: "React Native Mobile App"
elements:
  - type: "component"
    name: "UI Layer"
    technology: "React Navigation & Native UI"
    description: "Cross-platform client UI for patients and clinicians."
  - type: "component"
    name: "State & Offline Sync Engine"
    technology: "WatermelonDB / Redux Toolkit"
    description: "Manages offline data caching and synchronization over unstable connections."
  - type: "component"
    name: "Video Module"
    technology: "LiveKit React Native Client"
    description: "Handles low-bandwidth WebRTC video streaming for consultations."
  - type: "component"
    name: "Secure Storage"
    technology: "react-native-encrypted-storage"
    description: "Provides secure local client-side encryption of health tokens."
  - type: "component"
    name: "Local Biometric & Auth Module"
    technology: "react-native-biometrics"
    description: "Manages local biometric authentication and security."
  - type: "component"
    name: "Telemetry & Diagnostics Agent"
    technology: "Sentry RN / OpenTelemetry"
    description: "Tracks edge-anonymized crash and WebRTC telemetry."
  - type: "component"
    name: "Anti-Tampering & RASP Module"
    technology: "react-native-jailbreak-detection"
    description: "Ensures security against device tampering and jailbreaking."
relationships:
  - source: "UI Layer"
    destination: "State & Offline Sync Engine"
    description: "In-App Events"
  - source: "UI Layer"
    destination: "Local Biometric & Auth Module"
    description: "In-App Events"
  - source: "State & Offline Sync Engine"
    destination: "GCP Cloud Endpoints / Envoy API Gateway"
    description: "HTTPS (JSON/REST) and WSS (WebSockets/QUIC)"
  - source: "Video Module"
    destination: "Video Media Server (LiveKit SFU)"
    description: "WebRTC/QUIC"
  - source: "Telemetry & Diagnostics Agent"
    destination: "GCP Cloud Endpoints / Envoy API Gateway"
    description: "HTTPS - Anonymized Telemetry"