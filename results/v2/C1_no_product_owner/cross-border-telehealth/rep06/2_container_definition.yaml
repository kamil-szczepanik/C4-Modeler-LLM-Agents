level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU/US)"
    description: "Patients from the EU and US using mobile and web clients for video consultations and symptom checking."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals conducting consultations and issuing e-prescriptions."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways"
    description: "External EU gateways for managing e-prescriptions."
  - type: "externalSystem"
    name: "US Pharmacy Systems"
    description: "External US systems for processing prescriptions and pharmacy workflows."
  - type: "externalSystem"
    name: "National Health Registries"
    description: "External health registries for patient and medical record verification."
  - type: "externalSystem"
    name: "External Identity Providers"
    description: "Identity providers such as Login.gov and eIDAS for secure authentication."
  - type: "container"
    name: "React Web Application"
    technology: "React"
    description: "Web client application for patients and clinicians."
  - type: "container"
    name: "React Native Mobile App"
    technology: "React Native"
    description: "Mobile client application for patients and clinicians."
  - type: "container"
    name: "GCP Cloud Endpoints / Envoy API Gateway"
    technology: "GCP Cloud Endpoints / Envoy"
    description: "Entry point managing API routing, security, and traffic control."
  - type: "container"
    name: "Core Services Container"
    technology: "Node.js / NestJS"
    description: "Handles core business logic, consultations, and e-prescriptions."
  - type: "container"
    name: "AI Symptom Checker Container"
    technology: "Python / FastAPI"
    description: "Performs AI inference for symptom checking."
  - type: "container"
    name: "Video Media Server"
    technology: "LiveKit / WebRTC SFU"
    description: "Handles low-bandwidth real-time video consultations."
  - type: "container"
    name: "Cloud SQL (PostgreSQL with PgBouncer)"
    technology: "PostgreSQL, PgBouncer, FHIR/national schemas"
    description: "Transactional database for storing patient and clinical data."
  - type: "container"
    name: "BigQuery"
    technology: "GCP BigQuery"
    description: "Stores immutable, pseudonymized audit logs."
relationships:
  - source: "Patients (EU/US)"
    destination: "React Web Application"
    description: "Accesses telehealth platform features"
    technology: "HTTPS (JSON/REST) and WSS (WebSockets/QUIC)"
  - source: "Patients (EU/US)"
    destination: "React Native Mobile App"
    description: "Accesses telehealth platform features"
    technology: "HTTPS (JSON/REST) and WSS (WebSockets/QUIC)"
  - source: "Clinicians"
    destination: "React Web Application"
    description: "Conducts consultations and manages prescriptions"
    technology: "HTTPS (JSON/REST) and WSS (WebSockets/QUIC)"
  - source: "React Web Application"
    destination: "GCP Cloud Endpoints / Envoy API Gateway"
    description: "Sends metadata, consent, and media requests"
    technology: "HTTPS (JSON/REST) and WSS (WebSockets/QUIC)"
  - source: "React Native Mobile App"
    destination: "GCP Cloud Endpoints / Envoy API Gateway"
    description: "Sends metadata, consent, and media requests"
    technology: "HTTPS (JSON/REST) and WSS (WebSockets/QUIC)"
  - source: "GCP Cloud Endpoints / Envoy API Gateway"
    destination: "Core Services Container"
    description: "Routes metadata and business logic requests"
    technology: "gRPC over mTLS (Anthos Service Mesh)"
  - source: "GCP Cloud Endpoints / Envoy API Gateway"
    destination: "AI Symptom Checker Container"
    description: "Routes AI symptom check requests"
    technology: "gRPC over mTLS (Anthos Service Mesh)"
  - source: "GCP Cloud Endpoints / Envoy API Gateway"
    destination: "Video Media Server"
    description: "Routes video and media stream connections"
    technology: "WebRTC / WSS"
  - source: "Core Services Container"
    destination: "Cloud SQL (PostgreSQL with PgBouncer)"
    description: "Reads and writes transactional data"
    technology: "SSL/TLS-encrypted PostgreSQL connections"
  - source: "AI Symptom Checker Container"
    destination: "BigQuery"
    description: "Emits pseudonymized audit payloads"
    technology: "HTTPS / GCP BigQuery API"
  - source: "Cross-Border Telehealth Platform"
    destination: "EU National E-Prescription Gateways"
    description: "Transmits and processes e-prescriptions"
    technology: "HTTPS/REST and HL7 FHIR with mTLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "US Pharmacy Systems"
    description: "Transmits and processes e-prescriptions"
    technology: "HTTPS/REST and HL7 FHIR with mTLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "National Health Registries"
    description: "Queries health registries"
    technology: "HTTPS/REST and HL7 FHIR with mTLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "External Identity Providers"
    description: "Federates user authentication"
    technology: "OAuth 2.0 / OIDC"