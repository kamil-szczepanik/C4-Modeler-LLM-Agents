level: component
scope: "Component diagram for the Consent & Audit Service container"
parentContainer:
  name: "Consent & Audit Service"
elements:
  - type: "component"
    name: "Consent Controller"
    technology: "Spring MVC"
    description: "Handling fine-grained REST/gRPC consent management endpoints."
  - type: "component"
    name: "Compliance Enforcement Engine"
    technology: "Java domain logic / OPA policy bundles"
    description: "Evaluating cross-region data access."
  - type: "component"
    name: "Consent Token Issuer"
    technology: "Nimbus JOSE+JWT"
    description: "Generating cryptographically signed, short-lived JWT consent assertions."
  - type: "component"
    name: "Audit Logger"
    technology: "Spring Cloud Stream listener"
    description: "Capturing immutable audit trails for AI recommendations and access requests."
  - type: "component"
    name: "Data Retention Manager"
    technology: "Spring Batch"
    description: "Enforcing jurisdictional data purging and residency policies."
  - type: "component"
    name: "Google Cloud SQL & GCS"
    technology: "Google Cloud SQL (PostgreSQL) & GCS"
    description: "Regional data stores with secure local drivers."
  - type: "component"
    name: "Google Cloud SQL"
    technology: "Google Cloud SQL (PostgreSQL)"
    description: "Append-only audit logging via secure local drivers with INSERT-only database privileges."
  - type: "component"
    name: "API Gateway / BFF"
    technology: "gRPC over TLS"
    description: "External entry point receiving signed consent assertions."
relationships:
  - source: "Consent Controller"
    destination: "Google Cloud SQL & GCS"
    description: "Regional data access via Spring Data JPA using secure local drivers."
  - source: "Compliance Enforcement Engine"
    destination: "Google Cloud SQL & GCS"
    description: "Regional data access via Spring Data JPA using secure local drivers."
  - source: "Audit Logger"
    destination: "Google Cloud SQL"
    description: "Append-only audit logging via secure local drivers with INSERT-only database privileges."
  - source: "Compliance Enforcement Engine"
    destination: "Consent Token Issuer"
    description: "Internal handoff of validated consent state for token generation."
  - source: "Consent Token Issuer"
    destination: "API Gateway / BFF"
    description: "Issues signed consent assertions via gRPC over TLS."