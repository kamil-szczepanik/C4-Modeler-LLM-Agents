level: component
scope: "Component diagram for the Consultation Service container"
parentContainer:
  name: "Consultation Service"
elements:
  - type: "component"
    name: "Signaling Manager"
    technology: "Go, WebSockets"
    description: "Handles WebSocket connections and WebRTC signaling exchange."
  - type: "component"
    name: "Session Controller"
    technology: "Go, JWT"
    description: "Manages consultation lifecycle states and cryptographically signed JWT authorization tokens."
  - type: "component"
    name: "Media Relay Proxy"
    technology: "Go/C++ binding, SFU, WebRTC"
    description: "SFU-based media router featuring a Degraded Mode Fallback Controller for low-bandwidth environments."
  - type: "component"
    name: "Audit Logger Interceptor & Event Publisher"
    technology: "Go, gRPC"
    description: "Captures sanitized lifecycle events and streams them asynchronously."
  - type: "component"
    name: "API Gateway / BFF"
    technology: "gRPC over TLS"
    description: "External entry point for internal routing."
  - type: "component"
    name: "Google Memorystore (Redis)"
    technology: "Redis"
    description: "Stores real-time peer connection states."
  - type: "component"
    name: "Clients"
    technology: "WebRTC / DTLS-SRTP"
    description: "End users consuming WebRTC media streams."
  - type: "component"
    name: "Cloud Storage (GCS)"
    technology: "HTTPS"
    description: "Stores session recording chunks."
  - type: "component"
    name: "Consent & Audit Service"
    technology: "gRPC"
    description: "Receives asynchronous telemetry via region-bound topics."
relationships:
  - source: "API Gateway / BFF"
    destination: "Session Controller"
    description: "Internal routing [gRPC over TLS via Istio mTLS]"
  - source: "Signaling Manager"
    destination: "Google Memorystore (Redis)"
    description: "Real-time peer connection states [TCP]"
  - source: "Media Relay Proxy"
    destination: "Clients"
    description: "WebRTC media streams [DTLS-SRTP over UDP]"
  - source: "Media Relay Proxy"
    destination: "Cloud Storage (GCS)"
    description: "Session recording chunks [HTTPS]"
  - source: "Audit Logger Interceptor & Event Publisher"
    destination: "Consent & Audit Service"
    description: "Asynchronous telemetry [gRPC with region-bound topics]"