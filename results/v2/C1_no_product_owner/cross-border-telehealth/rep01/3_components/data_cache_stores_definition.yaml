level: component
scope: "Component diagram for the Data & Cache Stores container"
parentContainer:
  name: "Data & Cache Stores"
elements:
  - type: "component"
    name: "Regional Relational Database"
    technology: "Google Cloud SQL - PostgreSQL 15, pgBouncer"
    description: "Stores structured clinical records, e-prescriptions, and consents with row-level security."
  - type: "component"
    name: "Ephemeral Session Cache"
    technology: "Google Memorystore - Redis Cluster"
    description: "Handles real-time WebRTC session states and fast session tokens."
  - type: "component"
    name: "Medical Document Store"
    technology: "Google Cloud Storage - GCS"
    description: "Immutable WORM storage for unstructured artifacts, AI audit logs, and recordings."
relationships:
  - source: "Application Services"
    destination: "Regional Relational Database"
    description: "Structured clinical records, e-prescriptions, and consents via TCP over TLS 1.3 with IAM authentication and pgBouncer"
  - source: "Application Services"
    destination: "Ephemeral Session Cache"
    description: "Real-time WebRTC session states and fast session tokens via Redis TCP protocol using AUTH and TLS"
  - source: "AI Symptom Orchestrator & Consultation Service"
    destination: "Medical Document Store"
    description: "Unstructured artifacts, AI audit logs, and recordings via HTTPS (TLS 1.3) within VPC Service Controls"