level: component
scope: "Component diagram for the Security & Infrastructure container"
parentContainer:
  name: "Security & Infrastructure"
elements:
  - type: "component"
    name: "Identity-Aware Proxy (IAP)"
    technology: "Google Cloud IAP"
    description: "Provides edge authentication and zero-trust perimeter enforcement."
  - type: "component"
    name: "Istio Service Mesh"
    technology: "Istio with Envoy"
    description: "Secures service-to-service communication with strict mTLS and SPIFFE/SPIRE workload identities."
  - type: "component"
    name: "Policy Enforcement Engine"
    technology: "OPA-Gatekeeper"
    description: "Integrated with Istio via Envoy for runtime data residency validation."
  - type: "component"
    name: "Audit Logging Collector"
    technology: "Fluentbit and Google Cloud Audit Logs"
    description: "Pipelines routing audit logs to region-locked WORM storage."
  - type: "component"
    name: "ArgoCD"
    technology: "Hub-and-Spoke ArgoCD"
    description: "Localized GitOps control planes per region (europe-west3 and us-central1)."
  - type: "component"
    name: "External Secrets Operator"
    technology: "Kubernetes Operator"
    description: "Manages dynamic secrets retrieval from regional GCP Secret Manager instances."
  - type: "component"
    name: "GCP KMS & Secret Manager"
    technology: "Google Cloud KMS and Secret Manager"
    description: "Manages regional Customer-Managed Encryption Keys (CMEK) and cryptographic erasure."
relationships:
  - source: "Identity-Aware Proxy (IAP)"
    destination: "Istio Service Mesh"
    description: "Forwards authenticated traffic to the service mesh"
  - source: "Policy Enforcement Engine"
    destination: "Istio Service Mesh"
    description: "Uses Envoy Ext-Authz to inspect inter-service traffic headers for regional compliance"
  - source: "Istio Service Mesh"
    destination: "GCP KMS & Secret Manager"
    description: "Validates workload identities against SPIFFE/SPIRE via gRPC"
  - source: "Audit Logging Collector"
    destination: "GCP KMS & Secret Manager"
    description: "Writes to Regional GCS Buckets using regional GCP KMS keys for WORM-compliant encryption"
  - source: "ArgoCD"
    destination: "External Secrets Operator"
    description: "Deploys and manages regional Kubernetes applications and operators"
  - source: "External Secrets Operator"
    destination: "GCP KMS & Secret Manager"
    description: "Reads from GCP Secret Manager via IAM Workload Identity for regional secret synchronization"