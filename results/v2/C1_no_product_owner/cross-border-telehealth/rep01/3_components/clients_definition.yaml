parentContainer:
  name: "Clients"
elements:
  - type: "component"
    name: "Patient Web App"
    technology: "React (TypeScript)"
    description: "Provides the web user interface for patients in the EU and US to access video consultations and e-prescriptions."
  - type: "component"
    name: "Patient Mobile App"
    technology: "Flutter (Dart)"
