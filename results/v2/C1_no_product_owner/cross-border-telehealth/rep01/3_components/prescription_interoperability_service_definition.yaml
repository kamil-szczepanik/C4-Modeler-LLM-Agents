level: component
scope: "Component diagram for the Prescription & Interoperability Service container"
parentContainer:
  name: "Prescription & Interoperability Service"
elements:
  - type: "component"
    name: "Prescription Domain Controller"
    technology: "Java, Spring Boot"
    description: "Manages prescription business logic and orchestrates consent validation and dispatch."
  - type: "component"
    name: "FHIR Adapter Component"
    technology: "Java / HAPI FHIR"
    description: "Adapts and fulfills US prescriptions using HL7 FHIR standards."
  - type: "component"
    name: "EU E-Prescription Gateway Component"
    technology: "Java / Apache Camel"
    description: "Handles EU e-prescription protocols and integrates with national pharmacies."
  - type: "component"
    name: "Circuit Breaker / Resilience Interceptor"
    technology: "Resilience4j"
    description: "Provides fault tolerance and circuit breaking for external pharmacy invocations."
  - type: "component"
    name: "Data Access Repository"
    technology: "Spring Data JPA"
    description: "Handles regional data persistence with strict data residency."
  - type: "component"
    name: "Consent & Audit Service"
    technology: "Java, Spring Boot"
    description: "Validates patient consent and records audit logs."
  - type: "component"
    name: "Google Cloud SQL and Pub/Sub"
    technology: "Google Cloud SQL (PostgreSQL) and Google Cloud Pub/Sub"
    description: "Provides regional data persistence and dead-letter queues with CMEK encryption."
  - type: "component"
    name: "Infrastructure & Security Services"
    technology: "Istio Service Mesh, GCP KMS, GCP Secret Manager, ArgoCD"
    description: "Ensures zero-trust mTLS, cryptographic isolation, and deployment management."
  - type: "component"
    name: "US Pharmacies"
    technology: "REST over TLS 1.3 / mTLS, HL7 FHIR"
    description: "External US pharmacy endpoints for prescription fulfillment."
  - type: "component"
    name: "National Pharmacies (EU)"
    technology: "Secure APIs over mTLS, national standards"
    description: "External EU national pharmacy endpoints for prescription fulfillment."
relationships:
  - source: "Prescription Domain Controller"
    destination: "Consent & Audit Service"
    description: "Validates patient consent [gRPC over TLS]"
  - source: "Prescription Domain Controller"
    destination: "Circuit Breaker / Resilience Interceptor"
    description: "Triggers dispatch [In-memory Java calls]"
  - source: "Circuit Breaker / Resilience Interceptor"
    destination: "FHIR Adapter Component"
    description: "Invokes external dispatch [Java method calls]"
  - source: "Circuit Breaker / Resilience Interceptor"
    destination: "EU E-Prescription Gateway Component"
    description: "Invokes external dispatch [Java method calls]"
  - source: "FHIR Adapter Component"
    destination: "US Pharmacies"
    description: "Fulfills US prescriptions [REST over TLS 1.3 / mTLS, HL7 FHIR]"
  - source: "EU E-Prescription Gateway Component"
    destination: "National Pharmacies (EU)"
    description: "Fulfills EU prescriptions [Secure APIs over mTLS, national standards]"
  - source: "Prescription Domain Controller"
    destination: "Google Cloud SQL and Pub/Sub"
    description: "Regional data persistence and DLQ [Secure local drivers and CMEK encryption]"
  - source: "Consent & Audit Service"
    destination: "Google Cloud SQL and Pub/Sub"
    description: "Regional data persistence and DLQ [Secure local drivers and CMEK encryption]"