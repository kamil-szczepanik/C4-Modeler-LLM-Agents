level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients & Clinicians"
    description: "End-users accessing the platform via Web/Mobile clients for video consultations and symptom checking."
  - type: "externalSystem"
    name: "AI Symptom Checker Engine"
    description: "Versioned AI/ML model for care urgency recommendations."
  - type: "externalSystem"
    name: "National Pharmacies (EU) & US Pharmacies"
    description: "External fulfillment systems via interoperability gateways for e-prescriptions."
  - type: "externalSystem"
    name: "Identity Providers"
    description: "External OAuth2/OIDC services for authentication."
  - type: "externalSystem"
    name: "GCP KMS"
    description: "Customer-Managed Encryption Keys (CMEK) with separate key rings per region."
  - type: "container"
    name: "Clients"
    technology: "Web/Mobile"
    description: "Patient and Clinician applications providing user interfaces."
  - type: "container"
    name: "API Gateway / BFF"
    technology: "Node.js, GraphQL"
    description: "Container handling client routing and requests via HTTPS and WebSockets."
  - type: "container"
    name: "Consultation Service"
    technology: "Go"
    description: "Container managing WebRTC signaling for video calls."
  - type: "container"
    name: "Prescription & Interoperability Service"
    technology: "Java, Spring Boot"
    description: "Container handling HL7 FHIR (US) and EU e-prescription standards."
  - type: "container"
    name: "AI Symptom Orchestrator"
    technology: "Python, FastAPI"
    description: "Container managing AI engine requests and immutable logging."
  - type: "container"
    name: "Consent & Audit Service"
    technology: "Java, Spring Boot"
    description: "Container managing user permissions and compliance audits."
  - type: "container"
    name: "Data & Cache Stores"
    technology: "Google Cloud SQL (PostgreSQL), Google Memorystore (Redis), Google Cloud Storage (GCS)"
    description: "Persistent storage and caching layers for regional data."
  - type: "container"
    name: "Security & Infrastructure"
    technology: "Istio Service Mesh, GCP KMS, GCP Secret Manager, ArgoCD"
    description: "Infrastructure components ensuring zero-trust networking, encryption, and GitOps delivery."
relationships:
  - source: "Patients & Clinicians"
    destination: "Clients"
    description: "Interacts with"
    technology: "Web/Mobile UI"
  - source: "Clients"
    destination: "API Gateway / BFF"
    description: "Client-facing traffic and real-time communication"
    technology: "HTTPS and WebSockets"
  - source: "API Gateway / BFF"
    destination: "Consultation Service"
    description: "Internal routing"
    technology: "gRPC over TLS via Istio Service Mesh (mTLS)"
  - source: "API Gateway / BFF"
    destination: "Prescription & Interoperability Service"
    description: "Internal routing"
    technology: "gRPC over TLS via Istio Service Mesh (mTLS)"
  - source: "API Gateway / BFF"
    destination: "AI Symptom Orchestrator"
    description: "Internal routing"
    technology: "gRPC over TLS via Istio Service Mesh (mTLS)"
  - source: "API Gateway / BFF"
    destination: "Consent & Audit Service"
    description: "Internal routing"
    technology: "gRPC over TLS via Istio Service Mesh (mTLS)"
  - source: "Consultation Service"
    destination: "Data & Cache Stores"
    description: "WebRTC session states and caching"
    technology: "Internal TCP (Google Memorystore Redis)"
  - source: "Consultation Service"
    destination: "Data & Cache Stores"
    description: "Regional data persistence"
    technology: "Secure local drivers (Google Cloud SQL & GCS)"
  - source: "Prescription & Interoperability Service"
    destination: "Data & Cache Stores"
    description: "Regional data persistence"
    technology: "Secure local drivers (Google Cloud SQL & GCS)"
  - source: "AI Symptom Orchestrator"
    destination: "Data & Cache Stores"
    description: "Regional data persistence"
    technology: "Secure local drivers (Google Cloud SQL & GCS)"
  - source: "Consent & Audit Service"
    destination: "Data & Cache Stores"
    description: "Regional data persistence"
    technology: "Secure local drivers (Google Cloud SQL & GCS)"
  - source: "AI Symptom Orchestrator"
    destination: "AI Symptom Checker Engine"
