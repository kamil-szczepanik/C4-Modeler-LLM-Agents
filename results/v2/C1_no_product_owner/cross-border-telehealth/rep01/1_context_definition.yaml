level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US while enforcing strict regional data residency, HIPAA, GDPR, and EU MDR compliance."
elements:
  - type: "person"
    name: "Patients & Clinicians"
    description: "End-users accessing the platform via Web/Mobile clients for video consultations and symptom checking."
  - type: "externalSystem"
    name: "AI Symptom Checker Engine"
    description: "Versioned AI/ML model for care urgency recommendations."
  - type: "externalSystem"
    name: "National Pharmacies (EU) & US Pharmacies"
    description: "External fulfillment systems via interoperability gateways for e-prescriptions."
  - type: "externalSystem"
    name: "Identity Providers"
    description: "External OAuth2/OIDC services for authentication."
  - type: "externalSystem"
    name: "GCP KMS"
    description: "Customer-Managed Encryption Keys (CMEK) with separate key rings per region."
relationships:
  - source: "Patients & Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses consultations and symptom checking"
    technology: "HTTPS and WebRTC (with DTLS-SRTP)"
  - source: "Cross-Border Telehealth Platform"
    destination: "AI Symptom Checker Engine"
    description: "Requests care urgency recommendations"
    technology: "HTTPS APIs with immutable version pinning and input/output logging"
  - source: "Cross-Border Telehealth Platform"
    destination: "National Pharmacies (EU) & US Pharmacies"
    description: "Fulfills e-prescriptions"
    technology: "Secure APIs utilizing mTLS, HL7 FHIR (US), and national standards (EU)"
  - source: "Cross-Border Telehealth Platform"
    destination: "GCP KMS"
    description: "Manages encryption keys with separate key rings per region"
    technology: "CMEK"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity Providers"
    description: "Authenticates users"
    technology: "OAuth2/OIDC"