level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides secure video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US, enforcing strict regional data isolation to comply with GDPR, HIPAA, and EU MDR."
elements:
  - type: "person"
    name: "Patients"
    description: "Patients interacting via Mobile/Web clients to receive video consultations, e-prescriptions, and use the AI symptom checker."
  - type: "person"
    name: "Clinicians"
    description: "Clinicians interacting via Mobile/Web clients to provide secure video consultations and manage patient care."
  - type: "externalSystem"
    name: "EU National e-Prescription Gateways"
    description: "External national gateways for e-prescriptions in the EU."
  - type: "externalSystem"
    name: "US Pharmacy Networks"
    description: "External pharmacy networks in the US."
  - type: "externalSystem"
    name: "Regional Identity Providers (IdPs)"
    description: "External regional identity providers for authentication."
  - type: "container"
    name: "EU Telehealth System"
    description: "Container deployment in GCP europe-west3 ensuring regional data isolation."
    technology: "Google Cloud Platform (GCP), Kubernetes/Containers"
  - type: "container"
    name: "US Telehealth System"
    description: "Container deployment in GCP us-central1 ensuring regional data isolation."
    technology: "Google Cloud Platform (GCP), Kubernetes/Containers"
relationships:
  - source: "Patients"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses data management and video consultations"
    technology: "HTTPS (REST/GraphQL), WebRTC"
  - source: "Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses data management and video consultations"
    technology: "HTTPS (REST/GraphQL), WebRTC"
  - source: "Cross-Border Telehealth Platform"
    destination: "EU National e-Prescription Gateways"
    description: "Exchanges e-prescriptions using national standards"
    technology: "Secure mTLS APIs"
  - source: "Cross-Border Telehealth Platform"
    destination: "US Pharmacy Networks"
    description: "Exchanges e-prescriptions using HL7 FHIR"
    technology: "Secure mTLS APIs"
  - source: "Cross-Border Telehealth Platform"
    destination: "Regional Identity Providers (IdPs)"
    description: "Authenticates users"
    technology: "HTTPS"
  - source: "EU Telehealth System"
    destination: "US Telehealth System"
    description: "Asynchronous, cryptographically signed consent-based API handshakes for data portability"
    technology: "HTTPS / APIs"