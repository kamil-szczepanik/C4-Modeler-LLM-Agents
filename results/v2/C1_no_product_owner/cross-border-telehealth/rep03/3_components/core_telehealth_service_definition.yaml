level: component
scope: "Component diagram for the Core Telehealth Service container"
parentContainer:
  name: "Core Telehealth Service"
elements:
  - type: "component"
    name: "Consultation Orchestrator"
    technology: "Go (Golang)"
    description: "Manages session lifecycles and workflow coordination."
  - type: "component"
    name: "E-Prescription Workflow Engine"
    technology: "Go (Golang)"
    description: "Coordinates regional pharmacy routing."
  - type: "component"
    name: "Consent & Privacy Manager"
    technology: "Go (Golang)"
    description: "Evaluates granular patient consent policies."
  - type: "component"
    name: "Audit & Traceability Logger"
    technology: "Go (Golang)"
    description: "Captures immutable compliance and AI logs."
relationships:
  - source: "Consultation Orchestrator"
    destination: "Consent & Privacy Manager"
    description: "Queries active consent [Internal gRPC via mTLS]"
  - source: "E-Prescription Workflow Engine"
    destination: "Audit & Traceability Logger"
    description: "Emits compliance events [In-memory channel / internal event bus]"
  - source: "Core Telehealth Service"
    destination: "Cloud SQL PostgreSQL"
    description: "Persists operational state and PHI [pgx driver over TLS]"
  - source: "Core Telehealth Service"
    destination: "Video Consultation Service"
    description: "Manages video sessions [WebRTC / gRPC]"