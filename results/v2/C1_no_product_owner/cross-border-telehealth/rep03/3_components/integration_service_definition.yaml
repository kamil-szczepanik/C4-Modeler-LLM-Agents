level: component
scope: "Component diagram for the Integration Service container"
parentContainer:
  name: "Integration Service"
elements:
  - type: "component"
    name: "Prescription Router Component"
    technology: "Spring Integration"
    description: "Handles protocol routing and orchestration for e-prescriptions."
  - type: "component"
    name: "EU Gateway Adapter Component"
    technology: "Spring WebClient"
    description: "Exchanges e-prescriptions with EU National e-Prescription Gateways."
  - type: "component"
    name: "US Pharmacy Adapter Component"
    technology: "Spring WebClient"
    description: "Exchanges e-prescriptions with US Pharmacy Networks."
  - type: "component"
    name: "Data Residency Enforcer Component"
    technology: "Java / Spring Boot"
    description: "Enforces regional data residency for external communications."
  - type: "component"
    name: "Audit Logging Component"
    technology: "Java / Spring Boot with GCP KMS"
    description: "Handles cryptographic signing and audit logging."
relationships:
  - source: "Prescription Router Component"
    destination: "EU Gateway Adapter Component"
    description: "Routes EU-bound e-prescriptions"
  - source: "Prescription Router Component"
    destination: "US Pharmacy Adapter Component"
    description: "Routes US-bound e-prescriptions"
  - source: "EU Gateway Adapter Component"
    destination: "Data Residency Enforcer Component"
    description: "Validates regional data compliance"
  - source: "US Pharmacy Adapter Component"
    destination: "Data Residency Enforcer Component"
    description: "Validates regional data compliance"
  - source: "Prescription Router Component"
    destination: "Audit Logging Component"
    description: "Logs prescription dispatch events"