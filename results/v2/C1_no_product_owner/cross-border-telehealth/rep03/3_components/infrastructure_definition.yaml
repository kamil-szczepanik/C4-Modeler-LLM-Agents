# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Infrastructure container"
parentContainer:
  name: "Infrastructure"
elements:
  - type: "component"
    name: "Regional GKE Clusters"
    technology: "Google Kubernetes Engine (europe-west3, us-central1)"
    description: "Orchestrates containerized workloads across regional boundaries."
  - type: "component"
    name: "Istio Service Mesh"
    technology: "Istio (Ingress and Egress Gateways)"
    description: "Manages zero-trust service mesh networking, mTLS, and cross-border traffic governance."
  - type: "component"
    name: "Google Cloud VPC Service Controls"
    technology: "GCP VPC Service Controls"
    description: "Establishes hard network perimeters to prevent cross-region data exfiltration."
  - type: "component"
    name: "External Secrets Operator"
    technology: "External Secrets Operator & GCP Secret Manager"
    description: "Manages external secrets integration securely within the cluster."
  - type: "component"
    name: "ArgoCD"
    technology: "ArgoCD (Regional GitOps instances)"
    description: "Handles regional GitOps deployments and continuous delivery."
  - type: "component"
    name: "Observability Suite"
    technology: "Prometheus & Google Cloud Operations Suite"
    description: "Provides monitoring, logging, and metrics collection."
  - type: "component"
    name: "Cloud KMS"
    technology: "Cloud KMS (Customer-Managed Encryption Keys)"
    description: "Provides region-isolated Customer-Managed Encryption Keys (CMEK) for data-at-rest."
  - type: "component"
    name: "Cert-Manager"
    technology: "cert-manager & Private CA"
    description: "Automates short-lived X.509 certificate management for mesh security."
  - type: "component"
    name: "GKE Workload Identity"
    technology: "GKE Workload Identity"
    description: "Manages secure IAM identities for Kubernetes workloads."
  - type: "component"
    name: "Falco"
    technology: "Falco Runtime Security"
    description: "Delivers real-time kernel-level runtime threat detection within Kubernetes."
relationships:
  - source: "API Gateway"
    destination: "Istio Service Mesh"
    description: "Routes external client traffic into regional GKE clusters (HTTPS/REST/gRPC)."
  - source: "Istio Service Mesh"
    destination: "Regional GKE Clusters"
    description: "Secures internal container-to-container communication (mTLS/gRPC)."
  - source: "Regional GKE Clusters"
    destination: "Cloud KMS"
    description: "Performs region-locked cryptographic operations for data-at-rest encryption (BYOK) via VPC-SC."
  - source: "Istio Service Mesh"
    destination: "External Consent Validator"
    description: "Inspects and authorizes cross-region (EU-US) payloads using patient consent tokens (mTLS/gRPC)."