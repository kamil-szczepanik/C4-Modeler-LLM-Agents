level: component
scope: "Component diagram for the Video Consultation Service container"
parentContainer:
  name: "Video Consultation Service"
elements:
  - type: "component"
    name: "Signaling Component"
    technology: "Node.js / WebSocket"
    description: "Manages peer connection negotiation and room states."
  - type: "component"
    name: "Media Routing Component"
    technology: "Mediasoup SFU / C++"
    description: "Handles real-time packet routing, simulcast, and bitrate scaling."
  - type: "component"
    name: "Bandwidth Adaptation Component"
    technology: "Go"
    description: "Dynamically downscales streams for degraded mode (<300 kbit/s)."
  - type: "component"
    name: "Compliance Recording Component"
    technology: "C++ / Python"
    description: "Encrypts and streams session audit logs."
  - type: "component"
    name: "Telemetry Collector Component"
    technology: "Node.js"
    description: "Gathers WebRTC stats and exposes Prometheus metrics."
relationships:
  - source: "Signaling Component"
    destination: "Media Routing Component"
    description: "Controls SFU worker threads [In-Process IPC]."
  - source: "Bandwidth Adaptation Component"
    destination: "Media Routing Component"
    description: "Adjusts bitrates based on telemetry [gRPC]."
  - source: "Telemetry Collector Component"
    destination: "Bandwidth Adaptation Component"
    description: "Feeds real-time network metrics [In-Process IPC]."
  - source: "Media Routing Component"
    destination: "Cloud Storage"
    description: "Stores encrypted session artifacts regionally [HTTPS/SRTP]."