level: component
scope: "Component diagram for the Web & Mobile Client Apps container"
parentContainer:
  name: "Web & Mobile Client Apps"
elements:
  - type: "component"
    name: "UI Layer"
    technology: "Flutter / React Native"
    description: "Provides cross-platform UI consistency and native-like performance for patients and clinicians."
  - type: "component"
    name: "Local State & Storage Manager"
    technology: "SQLite/Hive with AES-256 / iOS Keychain / Android Keystore"
    description: "Secures offline data cache and credentials for GDPR/HIPAA compliance."
  - type: "component"
    name: "Video Client SDK Wrapper"
    technology: "WebRTC (Adaptive Bitrate)"
    description: "Enables degraded-mode video streaming below 300 kbit/s for unstable rural connections."
  - type: "component"
    name: "API & Sync Client"
    technology: "HTTPS (TLS 1.3) with Certificate Pinning"
    description: "Handles secure communication and synchronization with the regional API gateway."
  - type: "component"
    name: "Region-Aware Routing & Localization Module"
    technology: "Localization Module"
    description: "Ensures compliance with regional data constraints and localization requirements across the EU and US."
  - type: "component"
    name: "Client-Side Feature Flagging / Kill Switch SDK"
    technology: "Cryptographically Signed Feature Flags"
    description: "Ensures secure, remote kill-switch capabilities for regulatory compliance."
relationships:
  - source: "UI Layer"
    destination: "Local State & Storage Manager"
    description: "Reads and writes encrypted local state and offline data"
  - source: "UI Layer"
    destination: "Video Client SDK Wrapper"
    description: "Initiates and manages video consultations"
  - source: "UI Layer"
    destination: "API & Sync Client"
    description: "Requests data and synchronizes state"
  - source: "API & Sync Client"
    destination: "Region-Aware Routing & Localization Module"
    description: "Routes requests based on region"
  - source: "Client-Side Feature Flagging / Kill Switch SDK"
    destination: "UI Layer"
    description: "Enables or disables features dynamically"