level: component
scope: "Component diagram for the AI Symptom Checker Container container"
parentContainer:
  name: "AI Symptom Checker Container"
elements:
  - type: "component"
    name: "API Router / Controller"
    technology: "FastAPI"
    description: "FastAPI component handling internal gRPC endpoints."
  - type: "component"
    name: "Preprocessing & NLP Component"
    technology: "spaCy / Hugging Face"
    description: "Component for clinical entity extraction."
  - type: "component"
    name: "Inference Engine"
    technology: "PyTorch"
    description: "Execution engine for care urgency prediction."
  - type: "component"
    name: "Audit & Traceability Logger"
    technology: "Python"
    description: "Component capturing inputs, predictions, and model versions."
  - type: "component"
    name: "Model Registry Client"
    technology: "Python"
    description: "Component fetching version-pinned models from regional GCP Artifact Registry."
relationships:
  - source: "API Router / Controller"
    destination: "Preprocessing & NLP Component"
    description: "Sanitizes and extracts entities [In-memory function calls]"
  - source: "Preprocessing & NLP Component"
    destination: "Inference Engine"
    description: "Passes clinical tokens [PyTorch tensors]"
  - source: "Inference Engine"
    destination: "Audit & Traceability Logger"
    description: "Dispatches traceability events [Asynchronous event dispatch]"
  - source: "Inference Engine"
    destination: "Model Registry Client"
    description: "Loads model weights [Local cache read]"