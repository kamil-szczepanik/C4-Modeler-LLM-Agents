level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing & Regional Affinity Controller"
    technology: "Envoy Proxy / Google Cloud API Gateway"
    description: "Sends client requests, manages WebRTC signaling, and handles edge routing and localized multi-region deployment."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "JWT with Token-Embedded Consent"
    description: "Enables local cryptographic authorization without synchronous database lookups."
  - type: "component"
    name: "Resilience & Rate Limiting Module"
    technology: "Envoy Proxy / WAF"
    description: "Secures the platform with circuit breaking and rate limiting to preserve availability for unstable connections."
  - type: "component"
    name: "Payload Inspection & Schema Validator"
    technology: "Native Protobuf Schema Validator"
    description: "Passes ingress traffic for validation and minimizes CPU overhead for low-bandwidth connections."
relationships:
  - source: "Routing & Regional Affinity Controller"
    destination: "Payload Inspection & Schema Validator"
    description: "Passes ingress traffic for validation [Internal gRPC]"
  - source: "Payload Inspection & Schema Validator"
    destination: "Core Telehealth Service"
    description: "Forwards sanitized requests via service mesh [gRPC over Istio mTLS]"
  - source: "Routing & Regional Affinity Controller"
    destination: "External Systems"
    description: "Connects to regional e-prescription gateways and pharmacy networks [HTTPS/REST]"