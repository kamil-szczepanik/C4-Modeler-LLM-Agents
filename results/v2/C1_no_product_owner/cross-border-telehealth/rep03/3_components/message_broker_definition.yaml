level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Regional Topics"
    technology: "Google Cloud Pub/Sub (`eu-events`, `us-events`)"
    description: "Manages regional message partitioning for strict data residency and asynchronous event distribution."
  - type: "component"
    name: "Schema Registry"
    technology: "Google Cloud Pub/Sub Schema Registry"
    description: "Validates message payloads to ensure data consistency across cross-border services."
  - type: "component"
    name: "Dead Letter Queues"
    technology: "Google Cloud Pub/Sub DLQ"
    description: "Captures undelivered or failed messages like e-prescriptions for manual replay and inspection."
relationships:
  - source: "Core Telehealth Service"
    destination: "Regional Topics"
    description: "Publishes asynchronous events and e-prescription messages via gRPC"
  - source: "Regional Topics"
    destination: "Integration Service"
    description: "Delivers payloads via push/pull subscriptions using HTTPS/gRPC"
  - source: "Integration Service"
    destination: "Dead Letter Queues"
    description: "Manages manual replay and inspection of failed e-prescriptions via Cloud Pub/Sub API"