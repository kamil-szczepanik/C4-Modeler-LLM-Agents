level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients interacting via Mobile/Web clients to receive video consultations, e-prescriptions, and use the AI symptom checker."
  - type: "person"
    name: "Clinicians"
    description: "Clinicians interacting via Mobile/Web clients to provide secure video consultations and manage patient care."
  - type: "externalSystem"
    name: "EU National e-Prescription Gateways"
    description: "External national gateways for e-prescriptions in the EU."
  - type: "externalSystem"
    name: "US Pharmacy Networks"
    description: "External pharmacy networks in the US."
  - type: "externalSystem"
    name: "Regional Identity Providers (IdPs)"
    description: "External regional identity providers for authentication."
  - type: "container"
    name: "Web & Mobile Client Apps"
    technology: "Flutter / React Native"
    description: "Client applications for patients and clinicians to access video consultations, e-prescriptions, and AI symptom checking."
  - type: "container"
    name: "API Gateway"
    technology: "Google Cloud API Gateway / Envoy"
    description: "Manages incoming client traffic, routing, and security enforcement."
  - type: "container"
    name: "Core Telehealth Service"
    technology: "Go / gRPC & REST"
    description: "Handles core telehealth business logic, orchestration, and service coordination."
  - type: "container"
    name: "Video Consultation Service"
    technology: "Mediasoup SFU on GCE"
    description: "Handles real-time adaptive WebRTC video streaming for consultations."
  - type: "container"
    name: "AI Symptom Checker Container"
    technology: "Python / FastAPI + PyTorch"
    description: "Provides AI-driven symptom analysis for patients."
  - type: "container"
    name: "Integration Service"
    technology: "Java / Spring Boot"
    description: "Integrates with external EU gateways and US pharmacy networks."
  - type: "container"
    name: "Databases"
    technology: "Cloud SQL PostgreSQL & Cloud Storage"
    description: "Persists regional data securely with CMEK encryption."
  - type: "container"
    name: "Message Broker"
    technology: "Google Cloud Pub/Sub"
    description: "Facilitates asynchronous messaging and resilience for e-prescriptions and regional data flows."
  - type: "container"
    name: "Infrastructure"
    technology: "Google Kubernetes Engine (GKE) & Istio Service Mesh"
    description: "Orchestrates zero-downtime containers and zero-trust mTLS networking."
relationships:
  - source: "Patients"
    destination: "Web & Mobile Client Apps"
    description: "Interacts with the platform for consultations and symptom checking"
    technology: "HTTPS (TLS 1.3) and WebRTC"
  - source: "Clinicians"
    destination: "Web & Mobile Client Apps"
    description: "Interacts with the platform to provide care and consultations"
    technology: "HTTPS (TLS 1.3) and WebRTC"
  - source: "Web & Mobile Client Apps"
    destination: "API Gateway"
    description: "Sends client requests and streams video"
    technology: "HTTPS and WebRTC"
  - source: "API Gateway"
    destination: "Core Telehealth Service"
    description: "Routes API requests"
    technology: "gRPC over mTLS (Istio service mesh)"
  - source: "Core Telehealth Service"
    destination: "Video Consultation Service"
    description: "Initiates and manages video sessions"
    technology: "WebRTC / gRPC"
  - source: "Core Telehealth Service"
    destination: "AI Symptom Checker Container"
    description: "Sends symptom data for AI analysis"
    technology: "Internal gRPC"
  - source: "Core Telehealth Service"
    destination: "Message Broker"
    description: "Publishes asynchronous events and e-prescription messages"
    technology: "Google Cloud Pub/Sub"
  - source: "Core Telehealth Service"
    destination: "Databases"
    description: "Reads and writes encrypted patient data"
    technology: "PostgreSQL protocol / Cloud Storage API"
  - source: "Message Broker"
    destination: "Integration Service"
    description: "Consumes asynchronous messages for external integration"
    technology: "Google Cloud Pub/Sub"
  - source: "Integration Service"
    destination: "EU National e-Prescription Gateways"
    description: "Exchanges e-prescriptions"
    technology: "REST/SOAP over mTLS"
  - source: "Integration Service"
    destination: "US Pharmacy Networks"
    description: "Exchanges e-prescriptions"
    technology: "REST/SOAP over mTLS"
  - source: "Web & Mobile Client Apps"
    destination: "Regional Identity Providers (IdPs)"
    description: "Authenticates users"
    technology: "HTTPS"