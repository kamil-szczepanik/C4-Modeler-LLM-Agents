level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients across the EU and US while enforcing strict regional data residency and regulatory compliance."
elements:
  - type: "person"
    name: "Patients and Licensed Clinicians"
    description: "External users who participate in video consultations, use the AI symptom checker, and manage e-prescriptions across the EU and US."
  - type: "externalSystem"
    name: "National e-Prescription Gateways and US Pharmacies/EHRs"
    description: "External healthcare systems and networks used for fulfilling prescriptions and accessing electronic health records."
  - type: "externalSystem"
    name: "Regional Identity Providers"
    description: "eIDAS-compliant IdPs for the EU and OAuth/OIDC IdPs for the US handling user authentication."
relationships:
  - source: "Patients and Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Interact with regional GCP platforms via HTTPS and WebSockets for video consultations and symptom checking."
    technology: "HTTPS, WebSockets"
  - source: "Cross-Border Telehealth Platform"
    destination: "National e-Prescription Gateways and US Pharmacies/EHRs"
    description: "Communicate with prescription networks using secure REST and HL7 FHIR over TLS 1.3/mTLS."
    technology: "REST, HL7 FHIR, TLS 1.3, mTLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Regional Identity Providers"
    description: "Authenticate users using regional identity providers (eIDAS, OAuth/OIDC)."
    technology: "OAuth 2.0, OIDC, eIDAS"