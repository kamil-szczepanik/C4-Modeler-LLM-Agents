level: component
scope: "Component diagram for the AI Symptom Checker Service container"
parentContainer:
  name: "AI Symptom Checker Service"
elements:
  - type: "component"
    name: "API Router & Auth Middleware"
    technology: "Python, FastAPI"
    description: "Handles lightweight routing, validation, and middleware logic, receiving requests via mTLS with OAuth2/JWT tokens."
  - type: "component"
    name: "Input Sanitization & Guardrail Component"
    technology: "Python, FastAPI"
    description: "Sanitizes patient inputs and strips PII from validated payloads."
  - type: "component"
    name: "Clinical Inference Proxy"
    technology: "GCP Vertex AI endpoints, gRPC"
    description: "Forwards sanitized prompts via internal VPC to invoke regionally isolated ML models."
  - type: "component"
    name: "Output Validation Guardrail"
    technology: "Python, FastAPI"
    description: "Validates model outputs before returning recommendations to patients."
  - type: "component"
    name: "Traceability & Audit Component"
    technology: "Google Cloud Pub/Sub, WORM storage, Google Cloud KMS"
    description: "Pushes audit logs via TLS and stores cryptographically signed, CMEK-encrypted immutable records."
  - type: "component"
    name: "Data Residency Validator"
    technology: "GCP VPC Service Controls"
    description: "Enforces data residency and regional isolation at the network layer for EU and US compliance."
  - type: "system"
    name: "Core Telehealth Backend"
    technology: "External Backend"
    description: "Requests AI symptom analysis via mTLS with OAuth2/JWT tokens."
  - type: "system"
    name: "GCP Vertex AI"
    technology: "Cloud AI Service"
    description: "Hosts regionally isolated model endpoints in `europe-west3` and `us-central1`."
  - type: "system"
    name: "Google Cloud Pub/Sub"
    technology: "Cloud Messaging Service"
    description: "Enables asynchronous, reliable audit logging."
  - type: "system"
    name: "WORM Buckets"
    technology: "Cloud Storage"
    description: "Stores cryptographically signed, CMEK-encrypted audit records."
relationships:
  - source: "Core Telehealth Backend"
    destination: "API Router & Auth Middleware"
    description: "Requests AI symptom analysis via mTLS with OAuth2/JWT tokens"
  - source: "API Router & Auth Middleware"
    destination: "Input Sanitization & Guardrail Component"
    description: "Forwards validated payloads for PII stripping"
  - source: "Input Sanitization & Guardrail Component"
    destination: "Clinical Inference Proxy"
    description: "Forwards sanitized prompts via internal VPC"
  - source: "Clinical Inference Proxy"
    destination: "GCP Vertex AI"
    description: "Invokes ML models via gRPC across `europe-west3` and `us-central1`"
  - source: "Traceability & Audit Component"
    destination: "Google Cloud Pub/Sub"
    description: "Pushes audit logs via TLS"
  - source: "Traceability & Audit Component"
    destination: "WORM Buckets"
    description: "Stores cryptographically signed, CMEK-encrypted records"