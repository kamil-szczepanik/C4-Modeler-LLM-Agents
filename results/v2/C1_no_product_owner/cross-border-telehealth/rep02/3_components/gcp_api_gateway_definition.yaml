level: component
scope: "Component diagram for the GCP API Gateway container"
parentContainer:
  name: "GCP API Gateway"
elements:
  - type: "component"
    name: "ESPv2 Gateway Proxy"
    technology: "Managed Google Cloud API Gateway / ESPv2"
    description: "Handles regional routing, protocol translation, schema validation, and ingress traffic management at regional edges (`europe-west3` and `us-central1`)."
  - type: "component"
    name: "Cloud Armor WAF"
    technology: "Google Cloud Armor"
    description: "Provides Web Application Firewall (WAF) protection and threat mitigation at regional edges."
relationships:
  - source: "ESPv2 Gateway Proxy"
    destination: "Cloud Armor WAF"
    description: "Inspects incoming regional client traffic for threats"