level: component
scope: "Component diagram for the US Healthcare Interoperability Service container"
parentContainer:
  name: "US Healthcare Interoperability Service"
elements:
  - type: "component"
    name: "FHIR API Router"
    technology: "Node.js / Express"
    description: "Routes incoming US healthcare interoperability requests."
  - type: "component"
    name: "US Transformation Engine"
    technology: "Node.js / Smart-on-FHIR SDK"
    description: "Transforms and handles US health interoperability logic using Smart-on-FHIR."
  - type: "component"
    name: "HIPAA Audit & Compliance Logger"
    technology: "Node.js"
    description: "Intercepts payloads for compliance logging to satisfy HIPAA regulations."
  - type: "component"
    name: "US E-Prescription Dispatcher"
    technology: "Node.js / Axios"
    description: "Passes validated FHIR e-prescription bundles and dispatches them to external US pharmacies/EHRs."
relationships:
  - source: "FHIR API Router"
    destination: "US Transformation Engine"
    description: "Internal method calls [TypeScript]"
  - source: "US Transformation Engine"
    destination: "HIPAA Audit & Compliance Logger"
    description: "Intercepts payload for compliance logging [Async/Await]"
  - source: "US Transformation Engine"
    destination: "US E-Prescription Dispatcher"
    description: "Passes validated FHIR e-prescription bundles [Internal Event/Queue]"