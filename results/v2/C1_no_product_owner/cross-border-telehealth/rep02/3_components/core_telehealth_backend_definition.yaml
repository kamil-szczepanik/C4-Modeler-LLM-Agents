level: component
scope: "Component diagram for the Core Telehealth Backend container"
parentContainer:
  name: "Core Telehealth Backend"
elements:
  - type: "component"
    name: "Consent & Policy Engine"
    technology: "Go"
    description: "Handles ABAC/RBAC and regional tenant isolation."
  - type: "component"
    name: "Consultation Coordinator"
    technology: "Go"
    description: "Manages session states and workflows for consultations."
  - type: "component"
    name: "Resiliency & Fallback Manager"
    technology: "Go, Protobuf"
    description: "Handles low-bandwidth modes and compact binary data serialization."
  - type: "component"
    name: "Audit Logging Daemon"
    technology: "Fluentbit, OTel sidecar container"
    description: "Performs tamper-resistant log shipping."
relationships:
  - source: "GCP API Gateway"
    destination: "Core Telehealth Backend"
    description: "Routes validated client requests via mTLS and Anthos Service Mesh (Istio)."
  - source: "Core Telehealth Backend"
    destination: "AI Symptom Checker Service"
    description: "Sends analysis requests via gRPC over mTLS."
  - source: "Core Telehealth Backend"
    destination: "EU E-Prescriptions Adapter & US Interoperability Service"
    description: "Integrates with regional healthcare gateways via gRPC over mTLS."
  - source: "Core Telehealth Backend"
    destination: "GCP Cloud SQL & WORM Storage"
    description: "Persists transactional data and compliance logs using CMEK encryption."