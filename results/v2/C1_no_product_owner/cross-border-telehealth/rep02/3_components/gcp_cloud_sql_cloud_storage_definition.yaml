level: component
scope: "Component diagram for the GCP Cloud SQL & Cloud Storage container"
parentContainer:
  name: "GCP Cloud SQL & Cloud Storage"
elements:
  - type: "component"
    name: "Regional Cloud SQL Instances"
    technology: "PostgreSQL 15 with Row-Level Security"
    description: "Provides regional transactional persistence with Row-Level Security for multi-tenant data isolation."
  - type: "component"
    name: "Regional Cloud Storage WORM Buckets"
    technology: "GCP Cloud Storage with COMPLIANCE mode bucket locks"
    description: "Stores immutable decision traces and audit logs with object versioning and strict regulatory audit trails."
relationships:
  - source: "Core Telehealth Backend"
