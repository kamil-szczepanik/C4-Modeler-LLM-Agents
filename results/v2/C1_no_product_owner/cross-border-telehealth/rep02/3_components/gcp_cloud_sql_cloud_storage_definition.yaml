    description: "Read/write transactional data and logs [TCP/PostgreSQL, TLS 1.3, IAM Auth]"
  - source: "AI Symptom Checker Service"
    destination: "Regional Cloud SQL Instances"
    description: "Read/write transactional data and logs [TCP/PostgreSQL, TLS 1.3, IAM Auth]"
  - source: "Interoperability Adapters"
    destination: "Regional Cloud SQL Instances"
    description: "Read/write transactional data and logs [TCP/PostgreSQL, TLS 1.3, IAM Auth]"
  - source: "AI Symptom Checker Service"
    destination: "Regional Cloud Storage WORM Buckets"
    description: "Writes immutable decision traces and audit logs [HTTPS/REST, CMEK]"