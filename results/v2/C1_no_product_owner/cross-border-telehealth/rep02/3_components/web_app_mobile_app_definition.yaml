level: component
scope: "Component diagram for the Web App & Mobile App container"
parentContainer:
  name: "Web App & Mobile App"
elements:
  - type: "component"
    name: "Client UI Layer"
    technology: "Flutter / React"
    description: "Provides cross-platform mobile and web interfaces for patients and clinicians."
  - type: "component"
    name: "Offline State Manager"
    technology: "Local Storage Engine"
    description: "Manages local caching of data for offline availability."
  - type: "component"
    name: "Security & Cryptography Module"
    technology: "Platform Crypto API"
    description: "Handles encryption and decryption of cached data."
  - type: "component"
    name: "Client Telemetry"
    technology: "Telemetry Logger"
    description: "Collects and batches client-side telemetry logs."
relationships:
  - source: "Client UI Layer"
    destination: "Security & Cryptography Module"
    description: "Requests data encryption/decryption"
  - source: "Offline State Manager"
    destination: "Security & Cryptography Module"
    description: "Encrypts/decrypts cached data"
  - source: "Client Telemetry"
    destination: "GCP API Gateway"
    description: "Flushes batched telemetry logs [HTTPS]"