level: component
scope: "Component diagram for the Video Streaming Server container"
parentContainer:
  name: "Video Streaming Server"
elements:
  - type: "component"
    name: "SFU Core"
    technology: "WebRTC / Mediasoup SFU"
    description: "Handles media streams, routing, and distribution for video consultations."
  - type: "component"
    name: "ABR Controller"
    technology: "Internal API"
    description: "Performs bitrate throttling and downmixing based on network conditions."
  - type: "component"
    name: "Signaling Handler"
    technology: "WebSocket / JSON"
    description: "Manages session setup and provisions credentials for media relay."
  - type: "component"
    name: "TURN/STUN Relay Agent"
    technology: "Coturn / TURN over UDP/TCP"
    description: "Provides NAT traversal and relays media packets for rural patients with unstable connections."
relationships:
  - source: "ABR Controller"
    destination: "SFU Core"
    description: "Bitrate throttling and downmixing [Internal API]"
  - source: "Signaling Handler"
    destination: "TURN/STUN Relay Agent"
    description: "Provisions HMAC credentials [REST API]"