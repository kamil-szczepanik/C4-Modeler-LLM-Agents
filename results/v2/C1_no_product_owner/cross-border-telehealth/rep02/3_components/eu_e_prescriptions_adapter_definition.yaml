level: component
scope: "Component diagram for the EU E-Prescriptions Adapter container"
parentContainer:
  name: "EU E-Prescriptions Adapter"
elements:
  - type: "component"
    name: "Prescription Transformation Engine"
    technology: "Java / MapStruct"
    description: "Translates canonical prescription models to meet diverse national standards."
  - type: "component"
    name: "Gateway Resilience & Routing Module"
    technology: "Spring Cloud OpenFeign / Resilience4j"
    description: "Handles dynamic routing and circuit breaking against unstable endpoints."
  - type: "component"
    name: "Security & Cryptography Interceptor"
    technology: "Spring Security / GCP Secret Manager"
    description: "Provides dynamic mTLS certificate injection and security enforcement."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "Spring AOP / SLF4J"
    description: "Ensures strict GDPR compliance and regional data logging."
  - type: "component"
    name: "Core Telehealth Backend"
    technology: "Java / Spring Boot"
    description: "Submits canonical prescription DTOs."
  - type: "component"
    name: "National e-Prescription Gateways"
    technology: "Egress-filtered HTTPS / mTLS"
    description: "External national infrastructures processing electronic prescriptions."
  - type: "component"
    name: "GCP Pub/Sub Dead-Letter Queue (DLQ)"
    technology: "GCP Pub/Sub / Cloud KMS"
    description: "Manages persistent asynchronous queuing for failed transmissions with Cloud KMS."
relationships:
  - source: "Core Telehealth Backend"
    destination: "Prescription Transformation Engine"
    description: "Submits canonical prescription DTOs [gRPC]"
  - source: "Prescription Transformation Engine"
    destination: "Gateway Resilience & Routing Module"
    description: "Passes validated payloads [In-memory]"
  - source: "Gateway Resilience & Routing Module"
    destination: "National e-Prescription Gateways"
    description: "Dispatches prescriptions [Egress-filtered HTTPS / mTLS]"
  - source: "Gateway Resilience & Routing Module"
    destination: "GCP Pub/Sub Dead-Letter Queue (DLQ)"
    description: "Queues failed transmissions [Encrypted Pub/Sub Protocol]"