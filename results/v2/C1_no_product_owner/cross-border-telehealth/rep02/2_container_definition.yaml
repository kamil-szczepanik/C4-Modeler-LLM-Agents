level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients and Licensed Clinicians"
    description: "External users who participate in video consultations, use the AI symptom checker, and manage e-prescriptions across the EU and US."
  - type: "externalSystem"
    name: "National e-Prescription Gateways and US Pharmacies/EHRs"
    description: "External healthcare systems and networks used for fulfilling prescriptions and accessing electronic health records."
  - type: "externalSystem"
    name: "Regional Identity Providers"
    description: "eIDAS-compliant IdPs for the EU and OAuth/OIDC IdPs for the US handling user authentication."
  - type: "container"
    name: "Web App & Mobile App"
    technology: "Flutter / React"
    description: "Client applications providing user interfaces for video consultations, e-prescriptions, and the AI symptom checker."
  - type: "container"
    name: "GCP API Gateway"
    technology: "GCP API Gateway"
    description: "Edge routing and entry point for client traffic into the platform."
  - type: "container"
    name: "Core Telehealth Backend"
    technology: "Go / Spring Boot"
    description: "Core business logic, handling user consent validation and service coordination."
  - type: "container"
    name: "AI Symptom Checker Service"
    technology: "Python / FastAPI"
    description: "AI-powered service for checking patient symptoms."
  - type: "container"
    name: "Video Streaming Server"
    technology: "WebRTC / SFU (Mediasoup)"
    description: "Handles adaptive bitrate video streaming for consultations."
  - type: "container"
    name: "EU E-Prescriptions Adapter"
    technology: "Java / Spring Boot"
    description: "Integration adapter for national e-prescription gateways in the EU."
  - type: "container"
    name: "US Healthcare Interoperability Service"
    technology: "Node.js / FHIR SDK"
    description: "Integration service for US healthcare interoperability and HL7 FHIR endpoints."
  - type: "container"
    name: "GCP Cloud SQL & Cloud Storage"
    technology: "PostgreSQL, WORM buckets, Cloud KMS, GCP Secret Manager"
    description: "Provides regional transactional persistence, encrypted storage, and secret management."
relationships:
  - source: "Patients and Licensed Clinicians"
    destination: "Web App & Mobile App"
    description: "Interact with the platform via client applications"
    technology: "HTTPS, WebSockets"
  - source: "Web App & Mobile App"
    destination: "GCP API Gateway"
    description: "Sends API requests and establishes real-time connections"
    technology: "HTTPS, WebSockets"
  - source: "Web App & Mobile App"
    destination: "Video Streaming Server"
    description: "Streams video consultations"
    technology: "WebRTC"
  - source: "GCP API Gateway"
    destination: "Core Telehealth Backend"
    description: "Routes validated requests to the core backend"
    technology: "mTLS, Anthos Service Mesh (Istio)"
  - source: "Core Telehealth Backend"
    destination: "AI Symptom Checker Service"
    description: "Requests AI symptom analysis"
    technology: "mTLS"
  - source: "Core Telehealth Backend"
    destination: "EU E-Prescriptions Adapter"
    description: "Communicates for EU prescription processing"
    technology: "mTLS"
  - source: "Core Telehealth Backend"
    destination: "US Healthcare Interoperability Service"
    description: "Communicates for US health interoperability"
    technology: "mTLS"
  - source: "EU E-Prescriptions Adapter"
    destination: "National e-Prescription Gateways and US Pharmacies/EHRs"
    description: "Sends egress-filtered prescription requests to EU national gateways"
    technology: "Egress-filtered HTTPS"
  - source: "US Healthcare Interoperability Service"
    destination: "National e-Prescription Gateways and US Pharmacies/EHRs"
    description: "Sends egress-filtered HL7 FHIR requests to US endpoints"
    technology: "Egress-filtered HTTPS, HL7 FHIR"
  - source: "Core Telehealth Backend"
    destination: "GCP Cloud SQL & Cloud Storage"
    description: "Persists transactional and compliance data with CMEK encryption"
    technology: "PostgreSQL, Cloud KMS"