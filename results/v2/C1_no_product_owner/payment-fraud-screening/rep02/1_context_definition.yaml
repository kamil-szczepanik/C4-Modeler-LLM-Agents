level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Screens card-not-present payment authorizations for fraud prior to approval and provides a case management interface for fraud analysts."
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Users reviewing suspicious transactions and updating rules."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer Systems"
    description: "External system initiating payment authorization requests."
  - type: "externalSystem"
    name: "Card Networks / Tokenization Vaults"
    description: "External system providing token resolution and cardholder data."
  - type: "externalSystem"
    name: "Audit / Compliance Archive"
    description: "External WORM storage retaining immutable decision logs for 7 years."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system managing analyst credentials and multi-factor authentication."
relationships:
  - source: "Payment Gateway / Acquirer Systems"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Submits tokenized authorization requests"
    technology: "REST/gRPC over TLS 1.3"
  - source: "Fraud Analysts"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Reviews cases and updates rules"
    technology: "HTTPS"
  - source: "Fraud Analysts"
    destination: "Identity Provider (IdP)"
    description: "Authenticates using OIDC/OAuth 2.0 and FIDO2/WebAuthn MFA"
    technology: "HTTPS"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Audit / Compliance Archive"
    description: "Stores tamper-evident decision logs"
    technology: "AWS S3 Object Lock"