level: component
scope: "Component diagram for the AWS KMS (Key Management Service) container"
parentContainer:
  name: "AWS KMS (Key Management Service)"
elements:
  - type: "component"
    name: "Key Management API Component"
    technology: "AWS SDK, HTTPS/TLS 1.3, SigV4"
    description: "Processes cryptographic requests from application containers via the AWS SDK."
  - type: "component"
    name: "Hardware Security Module (HSM) Interface Component"
    technology: "FIPS 140-2 Level 3 Hardware Security Modules"
    description: "Interfaces with FIPS 140-2 Level 3 validated dedicated HSMs for secure key storage and cryptographic operations."
  - type: "component"
    name: "Key Policy & Access Control Component"
    technology: "AWS IAM, SigV4, Resource-based policies, KMS Grant constraints"
    description: "Enforces IAM, SigV4 authentication, resource-based policies, and KMS Grant constraints."
  - type: "component"
    name: "Key Rotation & Lifecycle Manager Component"
    technology: "AWS KMS automated lifecycle controls"
    description: "Manages automated annual rotation of Customer Master Keys (CMKs) without downtime."
relationships:
  - source: "Fraud Scoring Engine and Case Management Service"
    destination: "Key Management API Component"
    description: "Invokes via AWS SDK over HTTPS/TLS 1.3 with SigV4 authentication for envelope encryption and data key generation."
  - source: "AWS KMS"
    destination: "AWS CloudTrail & S3 Object Lock"
    description: "Exports tamper-evident audit logs via AWS CloudTrail for 7-year retention."