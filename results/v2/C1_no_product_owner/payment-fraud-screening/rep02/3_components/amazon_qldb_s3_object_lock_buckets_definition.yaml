level: component
scope: "Component diagram for the Amazon QLDB / S3 Object Lock buckets container"
parentContainer:
  name: "Amazon QLDB / S3 Object Lock buckets"
elements:
  - type: "component"
    name: "Fraud Scoring Engine"
    technology: "Go/Rust on Amazon ECS Fargate"
    description: "Screens card-not-present payment authorizations to detect fraud and appends decision journals."
  - type: "component"
    name: "Case Management Service"
    technology: "Node.js/Python on Amazon ECS Fargate"
    description: "Manages review cases and uploads case artifacts."
  - type: "component"
    name: "Transaction Ledger Component"
    technology: "Amazon QLDB"
    description: "Provides cryptographically verifiable immutability for decision journals."
  - type: "component"
    name: "Evidence Archive Component"
    technology: "Amazon S3 with Object Lock"
    description: "Enforces Write-Once-Read-Many (WORM) compliance storage for 7 years."
  - type: "component"
    name: "Audit Export & Verification Worker"
    technology: "AWS Lambda"
    description: "Executes serverless audit verification, verifies hash chains, manages retention, and exports data."
  - type: "component"
    name: "Infrastructure Security & Storage"
    technology: "AWS KMS, Amazon CloudWatch, Amazon SQS"
    description: "Secures data encryption, manages alerts, and provides supporting infrastructure services."
relationships:
  - source: "Fraud Scoring Engine"
    destination: "Transaction Ledger Component"
    description: "Appends decision journal [AWS SDK / QLDB Driver over TLS 1.3]"
  - source: "Case Management Service"
    destination: "Evidence Archive Component"
    description: "Uploads case artifacts [AWS SDK over HTTPS]"
  - source: "Audit Export & Verification Worker"
    destination: "Transaction Ledger Component"
    description: "Verifies hash chains [AWS SDK / QLDB Driver]"
  - source: "Audit Export & Verification Worker"
    destination: "Evidence Archive Component"
    description: "Manages retention and exports [AWS SDK / S3 API]"
  - source: "Audit Export & Verification Worker"
    destination: "Amazon CloudWatch / Amazon SNS"
    description: "Triggers alerts on verification failures [AWS SDK / HTTPS]"