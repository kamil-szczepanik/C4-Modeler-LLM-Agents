level: component
scope: "Component diagram for the Fraud Scoring Engine container"
parentContainer:
  name: "Fraud Scoring Engine"
elements:
  - type: "component"
    name: "Request Handler Component"
    technology: "Rust, Axum/Tonic"
    description: "Ingresses scoring requests via gRPC over mTLS and passes masked payloads."
  - type: "component"
    name: "Evaluation Pipeline Component"
    technology: "Rust, Wasm/AST rule evaluator"
    description: "Evaluates real-time card-not-present payment authorizations and syncs models and rules."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Rust"
    description: "Dispatches cryptographically signed decision payloads for compliance and auditability."
relationships:
  - source: "Amazon API Gateway / ALB"
    destination: "Request Handler Component"
    description: "Ingresses scoring requests via gRPC over mTLS"
  - source: "Request Handler Component"
    destination: "Evaluation Pipeline Component"
    description: "Passes masked payloads via lock-free crossbeam channels"
  - source: "Evaluation Pipeline Component"
    destination: "Amazon ElastiCache Serverless"
    description: "Syncs models and rules via Redis protocol over mTLS"
  - source: "Audit Logger Component"
    destination: "Amazon QLDB / S3 Object Lock"
    description: "Dispatches cryptographically signed decision payloads via AWS SDK over TLS"