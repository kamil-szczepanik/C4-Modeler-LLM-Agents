level: component
scope: "Component diagram for the Case Management Service container"
parentContainer:
  name: "Case Management Service"
elements:
  - type: "component"
    name: "Case API Handler"
    technology: "Python (FastAPI)"
    description: "Exposes REST/JSON endpoints and enforces strict RBAC and token masking."
  - type: "component"
    name: "Token Masking Filter"
    technology: "Python"
    description: "Programmatically strips and masks card details at the serialization boundary."
  - type: "component"
    name: "Case Workflow Engine"
    technology: "Python"
    description: "Manages payment review states (Pending, Approved, Declined)."
  - type: "component"
    name: "Encryption Middleware"
    technology: "Python / AWS SDK"
    description: "Enforces client-side envelope encryption via AWS KMS."
  - type: "component"
    name: "Audit Trail Emitter"
    technology: "Python"
    description: "Formats, cryptographically signs, and emits immutable action logs."
  - type: "component"
    name: "SQS DLQ"
    technology: "Amazon SQS"
    description: "Decouples audit logging to ensure uninterrupted analyst workflows."
relationships:
  - source: "Amazon API / Application Load Balancer (ALB)"
    destination: "Case API Handler"
    description: "Routes case management requests [gRPC over mTLS]."
  - source: "Case API Handler"
    destination: "Token Masking Filter"
    description: "Passes case data for sanitization [In-memory Python objects]."
  - source: "Token Masking Filter"
    destination: "Case Workflow Engine"
    description: "Passes sanitized case data [In-memory Python objects]."
  - source: "Case Workflow Engine"
    destination: "Encryption Middleware"
    description: "Passes case states for encryption [In-memory Python objects]."
  - source: "Encryption Middleware"
    destination: "Amazon DynamoDB"
    description: "Persists encrypted case states [AWS SDK over TLS, port 443]."
  - source: "Audit Trail Emitter"
    destination: "SQS DLQ"
    description: "Enqueues audit logs asynchronously [AWS SDK]."
  - source: "SQS DLQ"
    destination: "Amazon QLDB"
    description: "Asynchronously flushes tamper-evident audit logs [AWS SDK over TLS, port 443]."