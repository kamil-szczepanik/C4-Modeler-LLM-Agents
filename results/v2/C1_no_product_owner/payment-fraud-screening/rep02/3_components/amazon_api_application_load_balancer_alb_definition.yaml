# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Amazon API / Application Load Balancer (ALB) container"
parentContainer:
  name: "Amazon Application Load Balancer (ALB)"
elements:
  - type: "component"
    name: "HTTPS Listener and Edge Router"
    technology: "AWS Application Load Balancer (ALB) Listener"
    description: "Accepts incoming payment authorization requests and analyst traffic via HTTPS."
  - type: "component"
    name: "gRPC Routing and TLS Termination Module"
    technology: "ALB gRPC Routing with mTLS"
