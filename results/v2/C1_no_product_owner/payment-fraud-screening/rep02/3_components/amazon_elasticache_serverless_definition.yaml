level: component
scope: "Component diagram for the Amazon ElastiCache Serverless container"
parentContainer:
  name: "Amazon ElastiCache Serverless"
elements:
  - type: "component"
    name: "Rule & Model Cache Manager"
    technology: "Amazon ElastiCache Serverless (Redis)"
    description: "Provides sub-millisecond in-memory lookups for rules and models to meet strict latency goals."
  - type: "component"
    name: "Data Replication & Sharding Engine"
    technology: "Amazon ElastiCache Serverless (Redis)"
    description: "Handles data replication and sharding for high availability and performance."
  - type: "component"
    name: "Encryption & Auth Gateway"
    technology: "Amazon ElastiCache Serverless (Redis)"
    description: "Secures in-memory reads/writes using RESP over TLS 1.3 with mTLS and Redis AUTH."
relationships:
  - source: "Encryption & Auth Gateway"
    destination: "Rule & Model Cache Manager"
    description: "Routes authenticated and encrypted read/write requests"
  - source: "Rule & Model Cache Manager"
    destination: "Data Replication & Sharding Engine"
    description: "Persists and synchronizes cached rule and model data across shards"