level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Users reviewing suspicious transactions and updating rules."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer Systems"
    description: "External system initiating payment authorization requests."
  - type: "externalSystem"
    name: "Card Networks / Tokenization Vaults"
    description: "External system providing token resolution and cardholder data."
  - type: "externalSystem"
    name: "Audit / Compliance Archive"
    description: "External WORM storage retaining immutable decision logs for 7 years."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system managing analyst credentials and multi-factor authentication."
  - type: "container"
    name: "Amazon API / Application Load Balancer (ALB)"
    technology: "AWS API Gateway / ALB"
    description: "Entry point for incoming traffic, routing requests to internal microservices."
  - type: "container"
    name: "Fraud Scoring Engine"
    technology: "Go or Rust, ECS Fargate"
    description: "Evaluates card-not-present payment authorizations in real-time."
  - type: "container"
    name: "Case Management Service"
    technology: "Node.js/Python, ECS Fargate"
    description: "Manages fraud cases and analyst reviews."
  - type: "container"
    name: "Amazon ElastiCache Serverless"
    technology: "Redis"
    description: "In-memory model and rule caching sidecar."
  - type: "container"
    name: "Amazon DynamoDB and Amazon Aurora Serverless v2"
    technology: "DynamoDB, Aurora Serverless v2"
    description: "Managed data stores for operational persistence."
  - type: "container"
    name: "Amazon QLDB / S3 Object Lock buckets"
    technology: "Amazon QLDB, S3"
    description: "Immutable, tamper-evident audit storage."
  - type: "container"
    name: "AWS KMS (Key Management Service)"
    technology: "AWS KMS"
    description: "Provides customer-managed encryption keys for data security."
relationships:
  - source: "Payment Gateway / Acquirer Systems"
    destination: "Amazon API / Application Load Balancer (ALB)"
    description: "Submits payment authorization requests"
    technology: "HTTPS (REST/JSON)"
  - source: "Amazon API / Application Load Balancer (ALB)"
    destination: "Fraud Scoring Engine"
    description: "Routes scoring requests"
    technology: "gRPC over mTLS"
  - source: "Amazon API / Application Load Balancer (ALB)"
    destination: "Case Management Service"
    description: "Routes case management requests"
    technology: "gRPC over mTLS"
  - source: "Fraud Scoring Engine"
    destination: "Amazon ElastiCache Serverless"
    description: "Retrieves models and rules from cache"
    technology: "Redis protocol over mTLS"
  - source: "Case Management Service"
    destination: "Amazon DynamoDB and Amazon Aurora Serverless v2"
    description: "Persists case data"
    technology: "TLS"
  - source: "Fraud Scoring Engine"
    destination: "Amazon DynamoDB and Amazon Aurora Serverless v2"
    description: "Accesses operational data"
    technology: "AWS SDK over TLS"
  - source: "Fraud Scoring Engine"
    destination: "Amazon QLDB / S3 Object Lock buckets"
    description: "Writes audit logs"
    technology: "AWS SDK over TLS"
  - source: "Case Management Service"
    destination: "Amazon QLDB / S3 Object Lock buckets"
    description: "Writes audit logs"
    technology: "AWS SDK over TLS"
  - source: "Fraud Analysts"
    destination: "Amazon API / Application Load Balancer (ALB)"
    description: "Reviews cases and updates rules"
    technology: "HTTPS"
  - source: "Fraud Analysts"
    destination: "Identity Provider (IdP)"
    description: "Authenticates using OIDC/SAML"
    technology: "HTTPS using AWS IAM Identity Center"