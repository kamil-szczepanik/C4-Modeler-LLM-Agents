level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Evaluates card-not-present payment authorizations for fraud prior to approval and provides a case management interface for fraud analysts."
elements:
  - type: "person"
    name: "Fraud Analyst & Risk Engineer"
    description: "Performs case management and review of flagged payment transactions."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "Sends payment authorization requests for fraud evaluation."
  - type: "externalSystem"
    name: "Payment Network / Card Schemes"
    description: "External payment card networks involved in transaction processing."
  - type: "externalSystem"
    name: "Audit / Compliance Archive"
    description: "Tamper-evident 7-year log storage using AWS S3 Object Lock."
  - type: "externalSystem"
    name: "External Notification / Alerting Service"
    description: "Receives operational incident webhooks via PagerDuty."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Real-time authorization requests"
    technology: "gRPC / HTTPS with mTLS (TLS 1.3)"
  - source: "Fraud Analyst & Risk Engineer"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Case management and review"
    technology: "HTTPS (OIDC / OAuth 2.0)"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Audit / Compliance Archive"
    description: "Tamper-evident 7-year log storage"
    technology: "AWS S3 Object Lock (Compliance Mode)"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "External Notification / Alerting Service"
    description: "Operational incident webhooks"
    technology: "HTTPS"