level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analyst & Risk Engineer"
    description: "Performs case management and review of flagged payment transactions."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "Sends payment authorization requests for fraud evaluation."
  - type: "externalSystem"
    name: "Audit / Compliance Archive"
    description: "Tamper-evident 7-year log storage using AWS S3 Object Lock."
  - type: "container"
    name: "AWS API Gateway"
    technology: "AWS API Gateway"
    description: "Ingress layer for handling incoming API requests and payment authorizations."
  - type: "container"
    name: "Go Fraud Scoring Engine"
    technology: "AWS ECS Fargate, Go, gRPC"
    description: "Evaluates card-not-present payment authorizations in real-time."
  - type: "container"
    name: "Case Management Backend"
    technology: "AWS ECS Fargate, Go, AWS Cognito"
    description: "Manages analyst reviews and case management for flagged transactions."
  - type: "container"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache (Redis)"
    description: "Low-latency in-memory data store for real-time velocity checks."
  - type: "container"
    name: "Amazon Aurora Serverless v2"
    technology: "Amazon Aurora Serverless v2"
    description: "Relational database with append-only ledger tables for tamper-evident 7-year audit logs."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "AWS API Gateway"
    description: "Sends payment authorization requests"
    technology: "HTTPS / HTTP/2"
  - source: "Fraud Analyst & Risk Engineer"
    destination: "Case Management Backend"
    description: "Manages cases and reviews flagged transactions"
    technology: "HTTPS (OIDC/OAuth2 via AWS Cognito)"
  - source: "AWS API Gateway"
    destination: "Go Fraud Scoring Engine"
    description: "Forwards payment authorization requests for scoring"
    technology: "gRPC over mTLS (AWS VPC Lattice)"
  - source: "Go Fraud Scoring Engine"
    destination: "Amazon ElastiCache (Redis)"
    description: "Performs real-time velocity checks"
    technology: "TCP"
  - source: "Go Fraud Scoring Engine"
    destination: "Amazon Aurora Serverless v2"
    description: "Reads and writes transaction and audit data"
    technology: "TLS"
  - source: "Case Management Backend"
    destination: "Amazon Aurora Serverless v2"
    description: "Reads and writes case and analyst review data"
    technology: "TLS"
  - source: "Amazon Aurora Serverless v2"
    destination: "Audit / Compliance Archive"
    description: "Exports tamper-evident logs for 7-year retention"
    technology: "AWS S3 Object Lock (Compliance Mode)"