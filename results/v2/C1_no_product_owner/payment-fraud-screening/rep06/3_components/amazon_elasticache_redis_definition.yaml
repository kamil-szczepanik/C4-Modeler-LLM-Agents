level: component
scope: "Component diagram for the Amazon ElastiCache (Redis) container"
parentContainer:
  name: "Amazon ElastiCache (Redis)"
elements:
  - type: "component"
    name: "Velocity Counter Store"
    technology: "Redis HyperLogLog and Sorted Sets"
    description: "Tracks transaction velocities for fraud detection and counting."
  - type: "component"
    name: "Feature Cache"
    technology: "Redis In-Memory Key-Value Store"
    description: "Stores pre-computed risk scores for fast retrieval."
  - type: "component"
    name: "Session State & Token Map"
    technology: "Redis Transient Storage"
    description: "Manages transient risk session metadata and token mapping."
relationships:
  - source: "Go Fraud Scoring Engine"
    destination: "Velocity Counter Store"
    description: "Increments and reads counters via RESP protocol over TCP (TLS-encrypted)"
  - source: "Go Fraud Scoring Engine"
    destination: "Feature Cache"
    description: "Fetches cached risk features via RESP protocol over TCP (TLS-encrypted)"
  - source: "Go Fraud Scoring Engine"
    destination: "Session State & Token Map"
    description: "Resolves risk session tokens via RESP protocol over TCP (TLS-encrypted)"