level: component
scope: "Component diagram for the Go Fraud Scoring Engine container"
parentContainer:
  name: "Go Fraud Scoring Engine"
elements:
  - type: "component"
    name: "API Handler Component"
    technology: "Go / gRPC"
    description: "Screens card-not-present payment authorizations in real-time to detect fraud before approval."
  - type: "component"
    name: "Rule Engine Component"
    technology: "Go / Embedded DSL"
    description: "Evaluates business rules against transaction data."
  - type: "component"
    name: "Velocity Counter Component"
    technology: "Go / Redis Client"
    description: "Evaluates sliding-window rate limits and tracks transaction velocity."
  - type: "component"
    name: "Model Scorer Component"
    technology: "Go / ONNX Runtime C bindings"
    description: "Executes pre-compiled machine learning models efficiently in-memory."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Go / Async Batch Writer"
    description: "Provides audit trails for analysts and persists transaction records."
  - type: "component"
    name: "Config & Model Synchronizer Component"
    technology: "Go / S3 Sync"
    description: "Fetches rules and ONNX models from storage."
  - type: "component"
    name: "Circuit Breaker Wrapper"
    technology: "Go / Memory"
    description: "Ensures resilience and fault tolerance in-memory."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Redis"
    description: "Enables real-time velocity checks and sliding-window rate limits."
  - type: "component"
    name: "Amazon Aurora Serverless v2"
    technology: "Aurora Serverless v2"
    description: "Persists audit data and transaction records."
  - type: "component"
    name: "Amazon S3"
    technology: "S3"
    description: "Stores rules and ONNX models."
relationships:
  - source: "API Handler Component"
    destination: "Rule Engine Component"
    description: "In-process function calls via Go channels/memory"
  - source: "API Handler Component"
    destination: "Model Scorer Component"
    description: "In-process function calls via Go channels/memory"
  - source: "Velocity Counter Component"
    destination: "Amazon ElastiCache (Redis)"
    description: "Evaluates sliding-window rate limits via TCP"
  - source: "Audit Logger Component"
    destination: "Amazon Aurora Serverless v2"
    description: "Persists audit data and transaction records via TLS"
  - source: "Config & Model Synchronizer Component"
    destination: "Amazon S3"
    description: "Fetches rules and ONNX models via HTTPS with AWS SigV4"