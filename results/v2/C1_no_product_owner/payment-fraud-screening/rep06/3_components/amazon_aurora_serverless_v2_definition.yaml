level: component
scope: "Component diagram for the Amazon Aurora Serverless v2 container"
parentContainer:
  name: "Amazon Aurora Serverless v2"
elements:
  - type: "component"
    name: "Fraud Scoring Data Store"
    technology: "PostgreSQL, pgcrypto, Table Partitioning"
    description: "Handles write-heavy fraud scoring records and column-level encryption for audit compliance."
  - type: "component"
    name: "Case Management Data Store"
    technology: "PostgreSQL"
    description: "Stores case data and audit histories accessed via read replica routing."
relationships:
  - source: "Fraud Scoring Data Store"
    destination: "Case Management Data Store"
    description: "Replicates data for read operations and audit history queries"