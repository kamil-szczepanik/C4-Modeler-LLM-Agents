level: component
scope: "Component diagram for the Case Management Backend container"
parentContainer:
  name: "Case Management Backend"
elements:
  - type: "component"
    name: "Case API Controller"
    technology: "AWS ECS Fargate, Go net/http"
    description: "Manages analyst reviews and case workflows for flagged payment transactions."
  - type: "component"
    name: "Workflow & Assignment Service"
    technology: "Go business logic, AWS Cognito JWT/RBAC"
    description: "Handles business logic, authorization, and dispatches audit events."
  - type: "component"
    name: "Masking Middleware"
    technology: "Go sanitization component"
    description: "Delegates serialization and sanitization to isolate card data before analyst interaction."
  - type: "component"
    name: "Audit Logging Adapter"
    technology: "Go, crypto/SHA-256, AWS KMS"
    description: "Dispatches audit events and streams cryptographically signed audit bundles."
  - type: "component"
    name: "Persistence Repository"
    technology: "Go database/sql, pgx"
    description: "Interacts with relational database to persist case state."
relationships:
  - source: "Case Analyst"
    destination: "AWS API Gateway"
    description: "Submits HTTPS requests [HTTPS / TLS 1.3]"
  - source: "AWS API Gateway"
    destination: "Case API Controller"
    description: "Forwards requests to the backend"
  - source: "Case API Controller"
    destination: "Masking Middleware"
    description: "Delegates serialization and sanitization [In-memory]"
  - source: "Masking Middleware"
    destination: "Case Analyst"
    description: "Returns sanitized payloads [HTTPS]"
  - source: "Case API Controller"
    destination: "Workflow & Assignment Service"
    description: "Invokes business logic [In-memory]"
  - source: "Workflow & Assignment Service"
    destination: "Audit Logging Adapter"
    description: "Dispatches audit events [In-memory]"
  - source: "Audit Logging Adapter"
    destination: "Amazon S3 (Object Lock)"
    description: "Streams cryptographically signed audit bundles [TLS / AWS SDK]"
  - source: "Workflow & Assignment Service"
    destination: "Amazon Aurora Serverless v2"
    description: "Persists case state [TLS / PostgreSQL protocol]"
  - source: "Case Management Backend"
    destination: "AWS Secrets Manager"
    description: "Fetches secrets at startup [HTTPS / AWS SDK via IAM Task Role]"