level: component
scope: "Component diagram for the Model Registry container"
parentContainer:
  name: "Model Registry"
elements:
  - type: "component"
    name: "Model Storage Manager"
    technology: "Python, boto3, S3 Object Lock"
    description: "Applies Object Lock Compliance Mode and versioning to securely manage model artifacts."
  - type: "component"
    name: "Registry REST API"
    technology: "FastAPI, AWS ECS Fargate"
    description: "Provides REST endpoints to serve model metadata and version pointers."
  - type: "component"
    name: "MLflow Client Library"
    technology: "Python, serverless logging"
    description: "Handles serverless logging and interaction with model metadata."
  - type: "component"
    name: "Amazon S3"
    technology: "KMS-encrypted model artifact repository, S3 Object Lock"
    description: "Immutable storage satisfying 7-year audit retention and artifact storage."
  - type: "component"
    name: "Scoring Engine"
    technology: "Consumer of model artifacts"
    description: "Consumes model artifacts and fetches active model metadata."
relationships:
  - source: "Scoring Engine"
    destination: "Registry REST API"
    description: "Fetches active model metadata and pointers [gRPC over TLS 1.3]"
  - source: "Registry REST API"
    destination: "Amazon S3"
    description: "Reads model artifacts and version pointers [boto3 / HTTPS]"
  - source: "Model Storage Manager"
    destination: "Amazon S3"
    description: "Applies Object Lock Compliance Mode and versioning [boto3 / HTTPS]"