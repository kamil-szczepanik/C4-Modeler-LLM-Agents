level: component
scope: "Component diagram for the Case Management container"
parentContainer:
  name: "Case Management"
elements:
  - type: "component"
    name: "Case API Controller"
    technology: "NestJS (Node.js/TypeScript)"
    description: "NestJS-based entry point handling HTTPS/REST requests from analysts."
  - type: "component"
    name: "Masking Interceptor Component"
    technology: "In-process middleware"
    description: "In-process middleware that sanitizes payloads and enforces R-05 data masking."
  - type: "component"
    name: "Case Workflow Engine"
    technology: "NestJS / AWS SQS Consumer"
    description: "Manages review states and consumes asynchronous messages from Amazon SQS."
  - type: "component"
    name: "Audit Logger Component"
    technology: "AWS SDK / AWS KMS / Amazon Aurora PostgreSQL"
    description: "Generates tamper-evident cryptographic signatures using AWS KMS and persists data to Amazon Aurora PostgreSQL."
relationships:
  - source: "Fraud Analyst"
    destination: "Case API Controller"
    description: "Manages cases via HTTPS/REST [JSON, OIDC/OAuth2, TLS 1.3]."
  - source: "Case API Controller"
    destination: "Masking Interceptor Component"
    description: "Sanitizes payloads [In-process]."
  - source: "Case Workflow Engine"
    destination: "Amazon SQS"
    description: "Consumes review-routed events [HTTPS/SQS Protocol]."
  - source: "Case Workflow Engine"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists case states and audit logs [TLS/JDBC]."
  - source: "Audit Logger Component"
    destination: "AWS KMS"
    description: "Generates cryptographic signatures [AWS SDK / TLS]."