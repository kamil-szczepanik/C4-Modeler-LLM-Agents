level: component
scope: "Component diagram for the Scoring Engine container"
parentContainer:
  name: "Scoring Engine"
elements:
  - type: "component"
    name: "API Ingress Controller"
    technology: "Go"
    description: "Handles incoming gRPC requests and schema validation."
  - type: "component"
    name: "Feature Fetcher"
    technology: "Go"
    description: "Queries Redis with strict timeouts."
  - type: "component"
    name: "Circuit Breaker & Fallback Manager"
    technology: "Go"
    description: "Enforces 15ms timeouts and provides local default feature profiles."
  - type: "component"
    name: "Inference Executor"
    technology: "Go, WebAssembly (Wasm)"
    description: "Executes Wasm-compiled scoring models with cryptographic signature verification."
  - type: "component"
    name: "Audit Logger"
    technology: "Go"
    description: "Batches decisions using ring-buffers, hash-chaining, and AWS KMS envelope signing."
  - type: "component"
    name: "API Gateway"
    technology: "AWS API Gateway"
    description: "Routes payment authorization requests."
  - type: "component"
    name: "Redis / Amazon ElastiCache"
    technology: "Amazon ElastiCache (Redis)"
    description: "Stores feature data for lookups."
  - type: "component"
    name: "Model Registry"
    technology: "Amazon S3"
    description: "Stores Wasm scoring model bytecode."
  - type: "component"
    name: "Aurora PostgreSQL"
    technology: "Amazon Aurora Serverless v2"
    description: "Persists hash-chained, KMS-signed audit logs."
relationships:
  - source: "API Gateway"
    destination: "API Ingress Controller"
    description: "Routes payment authorization requests [gRPC over HTTP/2 with mTLS, TLS 1.3]"
  - source: "API Ingress Controller"
    destination: "Feature Fetcher"
    description: "Requests account velocity features [In-memory Go channels]"
  - source: "Feature Fetcher"
    destination: "Circuit Breaker & Fallback Manager"
    description: "Delegates feature resolution [In-memory Go interface]"
  - source: "Circuit Breaker & Fallback Manager"
    destination: "Redis / Amazon ElastiCache"
    description: "Performs feature lookups [TCP with aggressive timeouts]"
  - source: "Model Registry"
    destination: "Inference Executor"
    description: "Feeds Wasm bytecode and hydrated context [In-memory]"
  - source: "Feature Fetcher"
    destination: "Inference Executor"
    description: "Feeds Wasm bytecode and hydrated context [In-memory]"
  - source: "Inference Executor"
    destination: "Audit Logger"
    description: "Dispatches decision payload [In-memory Go channels]"
  - source: "Audit Logger"
    destination: "Aurora PostgreSQL"
    description: "Persists hash-chained, KMS-signed audit logs [Encrypted TCP]"