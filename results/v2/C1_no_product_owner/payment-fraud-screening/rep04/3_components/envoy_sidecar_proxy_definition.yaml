level: component
scope: "Component diagram for the Envoy Sidecar Proxy container"
parentContainer:
  name: "Envoy Sidecar Proxy"
elements:
  - type: "component"
    name: "Listener & TLS Termination Component"
    technology: "BoringSSL"
    description: "Handles incoming traffic using BoringSSL and manages mTLS termination."
  - type: "component"
    name: "Routing & Load Balancing Component"
    technology: "HTTP/2 & gRPC"
    description: "Forwards gRPC/HTTP2 traffic to scoring containers."
  - type: "component"
    name: "Circuit Breaker & Retry Component"
    technology: "Envoy C++"
    description: "Provides outlier detection, active health checks, and circuit breaking."
  - type: "component"
    name: "Telemetry & Tracing Component"
    technology: "Prometheus"
    description: "Emits metrics and distributed trace headers, and exports metrics to Prometheus via /stats/prometheus."
  - type: "component"
    name: "Envoy Sidecar Proxy"
    technology: "Envoy C++"
    description: "Manages mTLS termination, routing, and circuit breaking for the real-time fraud screening system."
relationships:
  - source: "API Gateway"
    destination: "Listener & TLS Termination Component"
    description: "Sends HTTPS traffic to"
  - source: "Listener & TLS Termination Component"
    destination: "Routing & Load Balancing Component"
    description: "Passes decrypted traffic to"
  - source: "Routing & Load Balancing Component"
    destination: "Scoring Engine"
    description: "Routes gRPC/HTTP2 traffic to"
  - source: "Circuit Breaker & Retry Component"
    destination: "Routing & Load Balancing Component"
    description: "Applies outlier detection and active health checks to"
  - source: "Telemetry & Tracing Component"
    destination: "Prometheus"
    description: "Exports metrics to via /stats/prometheus"