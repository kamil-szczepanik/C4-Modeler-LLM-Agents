level: component
scope: "Component diagram for the Aurora PostgreSQL container"
parentContainer:
  name: "Aurora PostgreSQL"
elements:
  - type: "component"
    name: "Audit Ledger Table"
    technology: "PostgreSQL relation with database triggers and pgcrypto"
    description: "PostgreSQL relation with database triggers blocking updates/deletes for tamper-evidence."
  - type: "component"
    name: "Case Management Store"
    technology: "Relational tables with PostgreSQL Row-Level Security (RLS)"
    description: "Relational tables with PostgreSQL Row-Level Security (RLS) for analyst data segregation."
  - type: "component"
    name: "Audit Ingestion Worker"
    technology: "Asynchronous consumer"
    description: "Asynchronous consumer executing batch upserts."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Connection pooling proxy preventing thread exhaustion."
  - type: "component"
    name: "AWS KMS"
    technology: "AWS KMS"
    description: "Key management service for Transparent Data Encryption (TDE)."
relationships:
  - source: "Amazon MSK / Kafka"
    destination: "Audit Ingestion Worker"
    description: "Streams batched audit records [TCP / SSL]"
  - source: "Audit Ingestion Worker"
    destination: "Audit Ledger Table"
    description: "Appends immutable records [Internal SQL]"
  - source: "Case Management"
    destination: "Case Management Store"
    description: "Reads and updates analyst review workflows [TCP / SSL]"
  - source: "Aurora PostgreSQL"
    destination: "Amazon S3"
    description: "Archives detached monthly table partitions for long-term retention [HTTPS]"