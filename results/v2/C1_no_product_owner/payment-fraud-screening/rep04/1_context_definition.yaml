level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Evaluates card-not-present payment authorizations for fraud in under 50 milliseconds while providing case management for analysts, adhering to PCI-DSS Level 1 compliance."
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Reviews cases and manages fraud investigations."
  - type: "externalSystem"
    name: "Payment Gateway / Core Ledger"
    description: "Sends payment authorizations for real-time fraud evaluation."
  - type: "externalSystem"
    name: "Card Schemes / Identity Providers"
    description: "External services called via REST APIs for additional verification."
  - type: "externalSystem"
    name: "Compliance / Auditor"
    description: "Reviews tamper-evident audit logs for regulatory compliance."
relationships:
  - source: "Payment Gateway / Core Ledger"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Sends payment authorizations for screening"
    technology: "gRPC over TLS 1.3 (mTLS)"
  - source: "Fraud Analyst"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Manages fraud cases and reviews alerts"
    technology: "HTTPS (OIDC/SAML)"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Card Schemes / Identity Providers"
    description: "Queries external APIs for enrichment"
    technology: "HTTPS REST"
  - source: "Compliance / Auditor"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Accesses audit logs for compliance verification"
    technology: "HTTPS / AWS IAM"