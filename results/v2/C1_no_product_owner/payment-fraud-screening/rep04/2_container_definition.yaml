level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Reviews cases and manages fraud investigations."
  - type: "externalSystem"
    name: "Payment Gateway / Core Ledger"
    description: "Sends payment authorizations for real-time fraud evaluation."
  - type: "externalSystem"
    name: "Card Schemes / Identity Providers"
    description: "External services called via REST APIs for additional verification."
  - type: "externalSystem"
    name: "Compliance / Auditor"
    description: "Reviews tamper-evident audit logs for regulatory compliance."
  - type: "container"
    name: "API Gateway (AWS API Gateway / ALB)"
    technology: "AWS API Gateway / ALB"
    description: "Ingests payment authorizations and routes incoming traffic."
  - type: "container"
    name: "Scoring Engine"
    technology: "Go"
    description: "Evaluates card-not-present payment authorizations with strict sub-50ms latency."
  - type: "container"
    name: "Case Management"
    technology: "Node.js / Spring Boot"
    description: "Provides case management capabilities for fraud analysts."
  - type: "container"
    name: "Model Registry"
    technology: "Python / MLflow / Amazon S3"
    description: "Stores and manages machine learning models used for scoring."
  - type: "container"
    name: "Envoy Sidecar Proxy"
    technology: "Envoy"
    description: "Enforces mTLS and provides circuit breaking."
  - type: "container"
    name: "Redis / Amazon ElastiCache"
    technology: "Redis / Amazon ElastiCache"
    description: "Provides low-latency data storage for feature lookups."
  - type: "container"
    name: "Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Stores tamper-evident, encrypted audit logs with long-term retention."
  - type: "container"
    name: "Amazon MSK / Kafka"
    technology: "Amazon MSK / Kafka"
    description: "Decouples high-throughput ingestion from audit writes."
relationships:
  - source: "Fraud Analyst"
    destination: "Case Management"
    description: "Interacts with Case Management for investigations"
    technology: "HTTPS/REST"
  - source: "Payment Gateway / Core Ledger"
    destination: "API Gateway (AWS API Gateway / ALB)"
    description: "Sends payment authorizations for real-time fraud evaluation"
    technology: "HTTPS/REST (3,000 TPS)"
  - source: "API Gateway (AWS API Gateway / ALB)"
    destination: "Scoring Engine"
    description: "Routes payment authorization requests"
    technology: "gRPC over HTTP/2 with mTLS"
  - source: "Scoring Engine"
    destination: "Redis / Amazon ElastiCache"
    description: "Performs feature lookups"
    technology: "TCP"
  - source: "Scoring Engine"
    destination: "Aurora PostgreSQL"
    description: "Writes audit logs"
    technology: "TCP"
  - source: "Scoring Engine"
    destination: "Model Registry"
    description: "Consumes models"
    technology: "Amazon S3"