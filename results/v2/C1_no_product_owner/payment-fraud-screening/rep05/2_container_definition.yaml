level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analysts and ML Engineers"
    description: "Users who manage cases, review flagged transactions, and monitor the fraud screening system."
  - type: "externalSystem"
    name: "Payment Gateway / Core Processing System"
    description: "External system submitting payment authorizations for fraud screening."
  - type: "container"
    name: "AWS API Gateway / ALB (Ingress)"
    technology: "AWS API Gateway / ALB"
    description: "Ingress point for incoming payment authorization requests."
  - type: "container"
    name: "Fraud Scoring Engine"
    technology: "Go microservice on ECS Fargate"
    description: "Scores transactions for fraud in real-time."
  - type: "container"
    name: "ONNX Model Sidecar"
    technology: "ONNX Runtime"
    description: "Lightweight model serving sidecar container for seamless fraud model updates."
  - type: "container"
    name: "Case Management App"
    technology: "Node.js/React monolith on ECS Fargate"
    description: "Application used by fraud analysts to manage flagged cases."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Feature store and audit logs data store."
  - type: "container"
    name: "Amazon RDS PostgreSQL"
    technology: "Amazon RDS PostgreSQL"
    description: "Data store for case management data."
  - type: "container"
    name: "Amazon S3 with Object Lock"
    technology: "Amazon S3"
    description: "7-year tamper-evident audit storage."
  - type: "container"
    name: "Amazon EventBridge"
    technology: "Amazon EventBridge"
    description: "Asynchronous event bus for decision events."
relationships:
  - source: "Payment Gateway / Core Processing System"
    destination: "AWS API Gateway / ALB (Ingress)"
    description: "Calls ingress via gRPC over TLS"
    technology: "gRPC over TLS"
  - source: "AWS API Gateway / ALB (Ingress)"
    destination: "Fraud Scoring Engine"
    description: "Routes payment authorization requests"
    technology: "HTTP/gRPC"
  - source: "Fraud Scoring Engine"
    destination: "ONNX Model Sidecar"
    description: "Queries for model inference"
    technology: "localhost gRPC"
  - source: "Fraud Scoring Engine"
    destination: "Amazon DynamoDB"
    description: "Reads and writes features and audit logs"
    technology: "AWS SDK"
  - source: "Fraud Scoring Engine"
    destination: "Amazon EventBridge"
    description: "Emits decision events"
    technology: "API / Event Bus"
  - source: "Fraud Analysts and ML Engineers"
    destination: "Case Management App"
    description: "Accesses for case management and review"
    technology: "HTTPS"
  - source: "Case Management App"
    destination: "Amazon RDS PostgreSQL"
    description: "Reads and writes case management data"
    technology: "Database Connection"