level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Screens card-not-present payment authorizations for fraud at 3,000 TPS while supporting analyst case management within a 25,000 EUR monthly budget, meeting PCI-DSS Level 1 compliance and 7-year audit retention."
elements:
  - type: "person"
    name: "Fraud Analysts and ML Engineers"
    description: "Users who manage cases and monitor the fraud screening system."
  - type: "externalSystem"
    name: "Payment Gateway / Core Processing System"
    description: "External system submitting payment authorizations for fraud screening."
  - type: "externalSystem"
    name: "Card Schemes / Tokenization Service"
    description: "External system providing PAN tokenization."
relationships:
  - source: "Payment Gateway / Core Processing System"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Sends payment authorizations for fraud screening"
    technology: "synchronous gRPC over TLS with mTLS and AWS IAM Signature v4"
  - source: "Fraud Analysts and ML Engineers"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Accesses case management and system monitoring"
    technology: "HTTPS with RBAC, IAM/OIDC, and mandatory MFA"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Card Schemes / Tokenization Service"
    description: "Requests PAN tokenization"
    technology: "secure API"