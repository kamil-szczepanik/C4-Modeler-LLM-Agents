level: component
scope: "Component diagram for the Amazon DynamoDB container"
parentContainer:
  name: "Amazon DynamoDB"
elements:
  - type: "component"
    name: "FeatureStore Table"
    technology: "Amazon DynamoDB (Provisioned Capacity with Auto-Scaling)"
    description: "DynamoDB table optimized for low-latency point reads, serving as a low-latency feature store."
  - type: "component"
    name: "AuditLogs Table"
    technology: "Amazon DynamoDB (Append-only)"
    description: "DynamoDB table capturing append-only decision logs synced via DynamoDB Streams."
relationships:
  - source: "Fraud Scoring Engine"
    destination: "FeatureStore Table"
    description: "Executes single-digit millisecond GetItem and BatchGetItem calls via AWS SDK over HTTPS / VPC Endpoint."
  - source: "AuditLogs Table"
    destination: "Amazon S3 (Object Lock)"
    description: "Streams tamper-evident decision logs asynchronously via DynamoDB Streams using AWS SDK."
  - source: "Case Management App"
    destination: "FeatureStore Table"
    description: "Executes restricted Query operations via AWS SDK governed by ABAC IAM policies."
  - source: "Case Management App"
    destination: "AuditLogs Table"
    description: "Executes restricted Query operations via AWS SDK governed by ABAC IAM policies."