level: component
scope: "Component diagram for the Amazon RDS PostgreSQL container"
parentContainer:
  name: "Amazon RDS PostgreSQL"
elements:
  - type: "component"
    name: "Case Management Schema"
    technology: "PostgreSQL 15 Relational Tables"
    description: "Relational tables storing analyst reviews, investigation notes, and case statuses."
  - type: "component"
    name: "pgBouncer Connection Pooler"
    technology: "pgBouncer"
    description: "Manages database connections from ephemeral ECS Fargate tasks."
  - type: "component"
    name: "pgaudit Extension"
    technology: "pgaudit"
    description: "Logs all DDL, DCL, and privileged DML statements for compliance."
relationships:
  - source: "Case Management App"
    destination: "pgBouncer Connection Pooler"
    description: "Reads and writes case data via TCP/SSL (Port 5432)"
  - type: "pgBouncer Connection Pooler"
    destination: "Case Management Schema"
    description: "Routes queries to relational tables"
  - type: "Amazon RDS PostgreSQL"
    destination: "AWS Backup"
    description: "Performs automated snapshots and WAL archiving via AWS API for 7-year retention"