level: component
scope: "Component diagram for the Amazon EventBridge container"
parentContainer:
  name: "Amazon EventBridge"
elements:
  - type: "component"
    name: "Rule Evaluation Bus"
    technology: "Amazon EventBridge custom event bus"
    description: "Evaluates and routes payment decision events and review decisions."
  - type: "component"
    name: "Event Archive & Replay Component"
    technology: "EventBridge Archive"
    description: "Archives events and supports event replay functionality."
  - type: "component"
    name: "Dead Letter Queue Handler"
    technology: "SQS + EventBridge DLQ"
    description: "Handles failed event deliveries and dead-letter queue management."
  - type: "component"
    name: "Event Schema Registry"
    technology: "EventBridge Schema Registry"
    description: "Enforces payload validation using JSON Schema."
relationships:
  - source: "Fraud Scoring Engine"
    destination: "Rule Evaluation Bus"
    description: "Publishes payment decision events via PutEvents [HTTPS / JSON]"
  - source: "Rule Evaluation Bus"
    destination: "Case Management App"
    description: "Routes review decisions [HTTPS / EventBridge Target]"
  - source: "Rule Evaluation Bus"
    destination: "Amazon S3 with Object Lock"
    description: "Forwards audit events [Firehose / HTTPS]"
  - source: "Rule Evaluation Bus"
    destination: "Event Schema Registry"
    description: "Enforces payload validation [EventBridge API / JSON Schema]"