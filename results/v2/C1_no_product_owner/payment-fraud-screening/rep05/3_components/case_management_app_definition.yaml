level: component
scope: "Component diagram for the Case Management App container"
parentContainer:
  name: "Case Management App"
elements:
  - type: "component"
    name: "API Controller Component"
    technology: "Express.js"
    description: "Handles routing, OIDC/MFA authentication, rate limiting, and RBAC."
  - type: "component"
    name: "Case Service Component"
    technology: "TypeScript"
    description: "Manages case workflows, business logic, and Prisma ORM interactions."
  - type: "component"
    name: "UI SPA Component"
    technology: "React / Tailwind CSS"
    description: "Renders the analyst dashboard with masked card data."
  - type: "component"
    name: "Audit & Compliance Component"
    technology: "TypeScript"
    description: "Generates structured, immutable audit logs."
  - type: "component"
    name: "Tokenization Gateway Client"
    technology: "TypeScript"
    description: "Communicates with external tokenization services via mTLS."
  - type: "component"
    name: "Amazon RDS Proxy"
    technology: "Amazon RDS Proxy"
    description: "Pools database connections and enforces TLS."
  - type: "component"
    name: "Amazon RDS PostgreSQL"
    technology: "Amazon RDS PostgreSQL"
    description: "Persists relational case data."
  - type: "component"
    name: "Amazon CloudWatch Logs & S3 with Object Lock"
    technology: "AWS CloudWatch & S3"
    description: "Stores tamper-evident, KMS-encrypted audit trails."
  - type: "component"
    name: "AWS ECS Fargate & Application Load Balancer"
    technology: "AWS ECS Fargate / ALB"
    description: "Runs containers with autoscaling, managed by a three-engineer team."
relationships:
  - source: "Fraud Analysts"
    destination: "API Controller Component"
    description: "Views and updates case statuses [HTTPS/TLS 1.3 with MFA]"
  - source: "API Controller Component"
    destination: "Case Service Component"
    description: "Delegates business logic [In-memory]"
  - source: "Case Service Component"
    destination: "Tokenization Gateway Client"
    description: "Requests masked card data [HTTPS/REST with mTLS]"
  - source: "Case Service Component"
    destination: "Amazon RDS Proxy"
    description: "Persists case data [TCP/TLS]"
  - source: "Case Service Component"
    destination: "Audit & Compliance Component"
    description: "Dispatches audit events [In-memory]"
  - source: "Audit & Compliance Component"
    destination: "Amazon CloudWatch Logs & S3 with Object Lock"
    description: "Streams structured JSON logs [AWS Firelens/HTTPS]"
  - source: "Amazon CloudWatch Logs & S3 with Object Lock"
    destination: "Amazon CloudWatch Logs & S3 with Object Lock"
    description: "Archives immutable logs [Subscription Filter]"