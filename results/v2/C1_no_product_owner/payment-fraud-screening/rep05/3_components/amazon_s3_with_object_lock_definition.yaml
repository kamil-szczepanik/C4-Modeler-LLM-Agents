level: component
scope: "Component diagram for the Amazon S3 with Object Lock container"
parentContainer:
  name: "Amazon S3 with Object Lock"
elements:
  - type: "component"
    name: "Amazon S3 Bucket"
    technology: "Amazon S3 Object Lock (Compliance Mode)"
    description: "Core storage configured with Object Lock for unalterable 7-year retention ensuring PCI-DSS Level 1 compliance."
  - type: "component"
    name: "AWS KMS"
    technology: "AWS Key Management Service"
    description: "Manages customer-managed encryption keys (CMK) for server-side encryption-at-rest."
  - type: "component"
    name: "Amazon S3 Gateway VPC Endpoint"
    technology: "AWS VPC Gateway Endpoint"
    description: "Enforces private, zero-trust network routing from the Fraud Scoring Engine using HTTPS (TLS 1.3)."
  - type: "component"
    name: "S3 Lifecycle Management Engine"
    technology: "Amazon S3 Lifecycle Policies"
    description: "Automatically transitions aged audit records to S3 Glacier Flexible Archive for cost optimization."
  - type: "component"
    name: "Cross-Region Replication (CRR)"
    technology: "S3 Cross-Region Replication"
    description: "Replicates encrypted audit payloads to a secondary region (eu-central-1) for disaster recovery."
relationships:
  - source: "Fraud Scoring Engine"
    destination: "Amazon S3 Gateway VPC Endpoint"
    description: "Sends audit payloads via HTTPS (TLS 1.3)"
  - source: "Amazon S3 Gateway VPC Endpoint"
    destination: "Amazon S3 Bucket"
    description: "Routes audit payloads to"
  - source: "Amazon S3 Bucket"
    destination: "AWS KMS"
    description: "Uses for encryption-at-rest"
  - source: "S3 Lifecycle Management Engine"
    destination: "Amazon S3 Bucket"
    description: "Transitions aged audit objects from"
  - source: "Amazon S3 Bucket"
    destination: "Cross-Region Replication (CRR)"
    description: "Replicates encrypted data to secondary region via"