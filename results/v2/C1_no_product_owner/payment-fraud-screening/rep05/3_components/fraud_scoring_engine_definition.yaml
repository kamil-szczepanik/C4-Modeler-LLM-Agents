level: component
scope: "Component diagram for the Fraud Scoring Engine container"
parentContainer:
  name: "Fraud Scoring Engine"
elements:
  - type: "component"
    name: "API Handler"
    technology: "Go"
    description: "Manages ingress validation, sanitization, and mTLS termination."
  - type: "component"
    name: "Feature Assembler"
    technology: "Go"
    description: "Fetches real-time behavioral features concurrently with built-in circuit breakers."
  - type: "component"
    name: "Rule Engine"
    technology: "Go"
    description: "Evaluates deterministic business rules in-memory to bypass ML inference."
  - type: "component"
    name: "Inference Client"
    technology: "Go"
    description: "Interfaces with the ONNX Model Sidecar via localhost gRPC."
  - type: "component"
    name: "Audit Logger"
    technology: "Go"
    description: "Asynchronously signs and records decision payloads via AWS KMS."
  - type: "component"
    name: "ONNX Model Sidecar"
    technology: "ONNX Runtime"
    description: "Executes machine learning model scoring."
  - type: "component"
    name: "AWS API Gateway / ALB"
    technology: "HTTPS/mTLS"
    description: "Routes incoming payment requests."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "AWS SDK / TLS"
    description: "Queries behavioral features and audit logs."
  - type: "component"
    name: "Amazon S3 with Object Lock"
    technology: "AWS SDK / TLS"
    description: "Persists signed audit trails."
  - type: "component"
    name: "Amazon EventBridge"
    technology: "API / Event Bus"
    description: "Emits decision events."
relationships:
  - source: "AWS API Gateway / ALB"
    destination: "API Handler"
    description: "Routes incoming payment requests [HTTPS/mTLS]"
  - source: "API Handler"
    destination: "Rule Engine"
    description: "Passes sanitized transaction data [In-memory function calls]"
  - source: "API Handler"
    destination: "Feature Assembler"
    description: "Passes sanitized transaction data [In-memory function calls]"
  - source: "Feature Assembler"
    destination: "Amazon DynamoDB"
    description: "Queries behavioral features and audit logs [AWS SDK / TLS]"
  - source: "Inference Client"
    destination: "ONNX Model Sidecar"
    description: "Executes model inference queries [localhost gRPC]"
  - source: "Audit Logger"
    destination: "Amazon S3 with Object Lock"
    description: "Persists signed audit trails [AWS SDK / TLS]"
  - source: "Fraud Scoring Engine"
    destination: "Amazon EventBridge"
    description: "Emits decision events [API / Event Bus]"