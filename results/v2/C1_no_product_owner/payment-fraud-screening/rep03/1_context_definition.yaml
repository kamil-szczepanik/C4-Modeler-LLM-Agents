level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Processes card-not-present payment authorizations in AWS to evaluate fraud risks and manage suspicious transaction reviews."
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Internal persona reviewing flagged transactions via case management."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "External source sending authorization requests."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External OIDC service handling SSO and MFA."
  - type: "externalSystem"
    name: "Audit Sink"
    description: "Write-only Amazon S3 bucket with Object Lock for tamper-evident storage."
  - type: "externalSystem"
    name: "Secrets Manager"
    description: "AWS Secrets Manager storing mTLS certificates and IdP secrets."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Ingests traffic using gRPC over TLS 1.3 with mutual TLS (mTLS)."
    technology: "gRPC over TLS 1.3 (mTLS)"
  - source: "Fraud Analyst"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Accesses case management interfaces via HTTPS using OpenID Connect (OIDC)."
    technology: "HTTPS / OIDC"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Audit Sink"
    description: "Streams cryptographic audit logs via HTTPS/TLS with AWS KMS encryption."
    technology: "HTTPS / TLS / AWS KMS"