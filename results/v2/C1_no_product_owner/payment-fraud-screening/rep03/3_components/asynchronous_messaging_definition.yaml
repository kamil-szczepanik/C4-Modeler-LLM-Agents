# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Asynchronous Messaging container"
parentContainer:
  name: "Asynchronous Messaging"
elements:
  - type: "component"
    name: "Audit Event Ingestion Queue"
    technology: "Amazon SQS"
    description: "Receives decoupled asynchronous audit events from the Fraud Scoring Engine and Case Management API via AWS VPC Endpoints."
  - type: "component"
    name: "Audit Dispatcher Worker"
    technology: "Go on Amazon ECS"
    description: "Processes messages from the ingestion queue, handles retries, and forwards logs to the external Audit Sink or Dead-Letter Queue."
  - type: "component"
    name: "Audit Dead-Letter Queue (DLQ)"
    technology: "Amazon SQS"
    description: "Captures failed audit event messages after they breach the retry threshold for manual investigation."
relationships:
  - source: "Fraud Scoring Engine"
    destination: "Audit Event Ingestion Queue"
    description: "Publishes audit events [SQS API]"
  - source: "Case Management API"
    destination: "Audit Event Ingestion Queue"
    description: "Publishes audit events [SQS API]"
  - source: "Audit Event Ingestion Queue"
    destination: "Audit Dispatcher Worker"
    description: "Dispatches messages for processing"
  - source: "Audit Dispatcher Worker"
    destination: "Audit Dead-Letter Queue (DLQ)"
    description: "Forwards failed messages after retry threshold breach [SQS API]"
  - source: "Audit Dispatcher Worker"
    destination: "Audit Sink"
    description: "Streams tamper-evident audit logs using mutual TLS or AWS SigV4 [HTTPS / AWS API]"