level: component
scope: "Component diagram for the Case Management API container"
parentContainer:
  name: "Case Management API"
elements:
  - type: "component"
    name: "HTTP Router / Controller"
    technology: "Express.js (Node.js/TypeScript)"
    description: "Handles ingress routing and request validation."
  - type: "component"
    name: "Auth & RBAC Middleware"
    technology: "Node.js/TypeScript Middleware"
    description: "Validates JWTs from the IdP and enforces least-privilege roles."
  - type: "component"
    name: "Case Service"
    technology: "Node.js/TypeScript"
    description: "Core business logic orchestrating case assignment and status transitions."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "Node.js/TypeScript"
    description: "Generates HMAC-SHA256 signed, tamper-evident audit trails."
relationships:
  - source: "HTTP Router / Controller"
    destination: "Auth & RBAC Middleware"
    description: "Passes incoming requests for authentication and authorization"
  - source: "Auth & RBAC Middleware"
    destination: "Case Service"
    description: "Forwards validated requests to business logic"
  - source: "Case Service"
    destination: "Audit & Compliance Logger"
    description: "Sends case transition events for audit logging"