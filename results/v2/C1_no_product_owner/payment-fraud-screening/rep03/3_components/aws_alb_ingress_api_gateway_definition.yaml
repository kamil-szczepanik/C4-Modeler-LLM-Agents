# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the AWS ALB (Ingress / API Gateway) container"
parentContainer:
  name: "AWS ALB (Ingress / API Gateway)"
elements:
  - type: "component"
    name: "Path-Based Routing and TLS Controller"
    technology: "AWS Application Load Balancer / AWS Certificate Manager (ACM)"
    description: "Terminates TLS 1.3, enforces strict path-based separation, and routes incoming traffic to meet the 50ms P99 latency SLA."
  - type: "component"
    name: "Web Application Firewall (WAF) Inspector"
    technology: "AWS WAF"
    description: "Inspects incoming HTTP/HTTPS analyst traffic using core OWASP rules while bypassing the gRPC payment path to preserve performance."
  - type: "component"
    name: "Payment Gateway Ingress Router"
    technology: "gRPC over mTLS"
    description: "Receives payment authorizations from the Payment Gateway / Acquirer and forwards screening requests directly to the Fraud Scoring Engine."
  - type: "component"
    name: "Case Management Ingress Router"
    technology: "HTTPS / OAuth 2.0 / OIDC"
    description: "Receives case management requests from Fraud Analysts and securely forwards them to the Case Management API."
relationships:
  - source: "Payment Gateway Ingress Router"
    destination: "Fraud Scoring Engine"
    description: "Forwards screening requests [gRPC over mTLS]"
  - source: "Case Management Ingress Router"
    destination: "Case Management API"
    description: "Forwards case management requests [HTTPS]"
  - source: "Case Management Ingress Router"
    destination: "Web Application Firewall (WAF) Inspector"
    description: "Inspects incoming HTTP/HTTPS traffic [Internal AWS API]"
  - source: "Path-Based Routing and TLS Controller"
    destination: "Payment Gateway Ingress Router"
    description: "Routes payment authorization traffic"
  - source: "Path-Based Routing and TLS Controller"
    destination: "Case Management Ingress Router"
    description: "Routes analyst workflow traffic"