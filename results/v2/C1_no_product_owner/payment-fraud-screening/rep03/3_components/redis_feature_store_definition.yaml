level: component
scope: "Component diagram for the Redis Feature Store container"
parentContainer:
  name: "Redis Feature Store"
elements:
  - type: "component"
    name: "Feature Data Engine"
    technology: "In-Memory KV Store / Redis"
    description: "Handles low-latency feature lookups and in-memory feature retrieval."
  - type: "component"
    name: "Rule & Model Cache"
    technology: "Redis Core Engine / Strings/JSON"
    description: "Powers dynamic rule fetching and zero-downtime hot-reloading of scoring models."
  - type: "component"
    name: "Replication & Persistence Manager"
    technology: "Amazon ElastiCache Multi-AZ Redis"
    description: "Manages replication, persistence, and automated daily encrypted snapshots."
  - type: "component"
    name: "Session & Rate-Limiting Store"
    technology: "Redis Core Engine"
    description: "Updates sliding-window transaction velocity counters and manages analyst session states."
  - type: "component"
    name: "Amazon ElastiCache Multi-AZ Redis"
    technology: "AWS ElastiCache Redis"
    description: "Delivers low-latency feature lookups and rule caching with high availability."
  - type: "component"
    name: "Fraud Scoring Engine"
    technology: "Scoring Engine Service"
    description: "Executes fraud screening logic by interfacing with feature stores, rule caches, and rate limiters."
  - type: "component"
    name: "Case Management API"
    technology: "API Service"
    description: "Manages analyst session states and secure reviews for suspicious transactions."
  - type: "component"
    name: "AWS CloudWatch & AWS Secrets Manager"
    technology: "AWS Management Services"
    description: "Monitors performance metrics, audit logs, and automates Redis AUTH token rotation."
relationships:
  - source: "Fraud Scoring Engine"
    destination: "Feature Data Engine"
    description: "In-memory feature retrieval [TCP / RESP over TLS]"
  - source: "Fraud Scoring Engine"
    destination: "Rule & Model Cache"
    description: "Dynamic rule fetching [TCP / RESP over TLS]"
  - source: "Fraud Scoring Engine"
    destination: "Session & Rate-Limiting Store"
    description: "Updates sliding-window transaction velocity counters [TCP / RESP over TLS]"
  - source: "Case Management API"
    destination: "Session & Rate-Limiting Store"
    description: "Manages analyst session states [TCP / RESP over TLS]"
  - source: "Amazon ElastiCache Multi-AZ Redis"
    destination: "Amazon S3 Glacier"
    description: "Archives automated daily encrypted snapshots [HTTPS]"