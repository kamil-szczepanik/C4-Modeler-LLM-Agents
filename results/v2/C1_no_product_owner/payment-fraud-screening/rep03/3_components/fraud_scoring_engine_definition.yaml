level: component
scope: "Component diagram for the Fraud Scoring Engine container"
parentContainer:
  name: "Fraud Scoring Engine"
elements:
  - type: "component"
    name: "API Handler Component"
    technology: "Go (Golang)"
    description: "Ingress validation, serialization, and PAN tokenization/sanitization gate."
  - type: "component"
    name: "Feature Aggregator Component"
    technology: "Go (Golang)"
    description: "Asynchronously fetches real-time velocity counters with Redis timeout fallback."
  - type: "component"
    name: "Scoring Executor Component"
    technology: "Go (Golang), WebAssembly (WASM)"
    description: "Evaluates rules and executes local WASM models within strict latency bounds."
  - type: "component"
    name: "Audit Dispatcher Component"
    technology: "Go (Golang)"
    description: "Signs audit payloads and pushes events asynchronously to SQS."
  - type: "component"
    name: "In-Memory Model Cache Component"
    technology: "Go (Golang)"
    description: "Hot-swaps cryptographically verified WASM binaries atomically."
relationships:
  - source: "API Handler Component"
    destination: "Feature Aggregator Component"
    description: "Passes sanitized payloads via in-memory Go channels."
  - source: "API Handler Component"
    destination: "Scoring Executor Component"
    description: "Passes sanitized payloads via in-memory Go channels."
  - source: "Scoring Executor Component"
    destination: "In-Memory Model Cache Component"
    description: "Hot-swaps compiled WASM binaries via atomic background tickers."