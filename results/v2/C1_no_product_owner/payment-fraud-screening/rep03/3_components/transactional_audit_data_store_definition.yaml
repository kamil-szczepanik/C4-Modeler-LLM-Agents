level: component
scope: "Component diagram for the Transactional & Audit Data Store container"
parentContainer:
  name: "Transactional & Audit Data Store"
elements:
  - type: "component"
    name: "Case Management Repository"
    technology: "Relational tables with pgx driver"
    description: "Stores active review cases and evaluation results, read and updated by the Case Management API."
  - type: "component"
    name: "Audit Log Subsystem"
    technology: "PostgreSQL Append-Only Tables, RLS, and pgcrypto"
    description: "Appends immutable decision logs with INSERT-only access via Row-Level Security."
  - type: "component"
    name: "Partition Manager"
    technology: "pg_partman"
    description: "Automates time-based table partitioning for 7-year data retention."
  - type: "component"
    name: "Read Replica"
    technology: "Amazon RDS PostgreSQL Read Replica"
    description: "Isolates analytics workloads and provides read scalability."
relationships:
  - source: "Fraud Scoring Engine"
    destination: "Case Management Repository"
    description: "Writes evaluation results and initial case state [PostgreSQL Wire Protocol over TLS 1.3]"
  - source: "Case Management API"
    destination: "Case Management Repository"
    description: "Reads and updates active review cases [PostgreSQL Wire Protocol over TLS 1.3]"
  - source: "Case Management API"
    destination: "Audit Log Subsystem"
    description: "Appends immutable decision logs [PostgreSQL Wire Protocol, INSERT-only via RLS]"
  - source: "Audit Log Subsystem"
    destination: "S3 Glacier Vault"
    description: "Delegates cold partition export [AWS SDK via IAM Role]"