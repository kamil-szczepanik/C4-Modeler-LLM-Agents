level: container
scope: "Container diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Internal personnel reviewing flagged transactions via case management."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "External source sending card-not-present payment authorization requests."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External OIDC service handling SSO and MFA for analysts."
  - type: "externalSystem"
    name: "Audit Sink"
    description: "Write-only destination for tamper-evident audit logs."
  - type: "externalSystem"
    name: "Secrets Manager"
    description: "AWS Secrets Manager storing database credentials and encryption keys."
  - type: "container"
    name: "AWS ALB (Ingress / API Gateway)"
    description: "Routes inbound traffic and terminates TLS/mTLS."
    technology: "AWS Application Load Balancer"
  - type: "container"
    name: "Fraud Scoring Engine"
    description: "Screens card-not-present payment authorizations for fraud under tight latency constraints."
    technology: "Go container on Amazon ECS on EC2"
  - type: "container"
    name: "Case Management API"
    description: "Manages analyst review cases and user workflows."
    technology: "Node.js/TypeScript container on Amazon ECS on EC2"
  - type: "container"
    name: "Redis Feature Store"
    description: "Low-latency feature store and rule caching with automatic failover."
    technology: "Amazon ElastiCache Multi-AZ Redis"
  - type: "container"
    name: "Transactional & Audit Data Store"
    description: "Stores transactional cases and append-only audit logs with IAM auth."
    technology: "Amazon RDS PostgreSQL"
  - type: "container"
    name: "Asynchronous Messaging"
    description: "Buffers and distributes audit events asynchronously."
    technology: "Amazon SQS"
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "AWS ALB (Ingress / API Gateway)"
    description: "Sends payment authorization requests"
    technology: "gRPC over mTLS"
  - source: "Fraud Analysts"
    destination: "AWS ALB (Ingress / API Gateway)"
    description: "Accesses case management workflows"
    technology: "HTTPS / OAuth 2.0 / OIDC"
  - source: "AWS ALB (Ingress / API Gateway)"
    destination: "Fraud Scoring Engine"
    description: "Forwards screening requests"
    technology: "gRPC over mTLS"
  - source: "AWS ALB (Ingress / API Gateway)"
    destination: "Case Management API"
    description: "Forwards case management requests"
    technology: "HTTPS"
  - source: "Fraud Scoring Engine"
    destination: "Redis Feature Store"
    description: "Reads/writes features and rules"
    technology: "Redis Protocol"
  - source: "Fraud Scoring Engine"
    destination: "Transactional & Audit Data Store"
    description: "Reads/writes transactional data"
    technology: "PostgreSQL Wire Protocol with IAM"
  - source: "Fraud Scoring Engine"
    destination: "Asynchronous Messaging"
    description: "Publishes audit events"
    technology: "SQS API"
  - source: "Case Management API"
    destination: "Redis Feature Store"
    description: "Reads/writes cache and state data"
    technology: "Redis Protocol"
  - source: "Case Management API"
    destination: "Transactional & Audit Data Store"
    description: "Reads/writes case storage and audit logs"
    technology: "PostgreSQL Wire Protocol with IAM"
  - source: "Case Management API"
    destination: "Asynchronous Messaging"
    description: "Publishes audit events"
    technology: "SQS API"
  - source: "Fraud Scoring Engine"
    destination: "Secrets Manager"
    description: "Retrieves runtime secrets and certificates"
    technology: "AWS SDK / Secrets Manager API"
  - source: "Case Management API"
    destination: "Secrets Manager"
    description: "Retrieves database credentials and keys"
    technology: "AWS SDK / Secrets Manager API"
  - source: "Asynchronous Messaging"
    destination: "Audit Sink"
    description: "Streams tamper-evident audit logs"
    technology: "HTTPS / AWS API"
  - source: "Case Management API"
    destination: "Identity Provider (IdP)"
    description: "Authenticates analyst sessions"
    technology: "OAuth 2.0 / OIDC"