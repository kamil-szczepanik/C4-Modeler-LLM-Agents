level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Fraud analyst responsible for investigating suspicious transactions and managing fraud cases using MFA and RBAC."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "External payment gateway sending card-not-present payment authorizations for real-time scoring."
  - type: "externalSystem"
    name: "Card Networks & Tokenization Vault"
    description: "External vault used for token resolution."
  - type: "externalSystem"
    name: "Core-Banking / Ledger System"
    description: "External core-banking ledger system used for final transaction disposition."
  - type: "externalSystem"
    name: "Model Training Environment"
    description: "External environment for training machine learning models and providing model artifacts."
  - type: "container"
    name: "API Gateway & Routing Layer"
    description: "Handles ingress, tokenization hand-offs, and routes incoming requests."
    technology: "AWS API Gateway and ALB"
  - type: "container"
    name: "Real-Time Scoring Service"
    description: "Processes synchronous authorizations and fraud scoring via gRPC."
    technology: "Go container on Amazon ECS on EC2"
  - type: "container"
    name: "Case Management Backend"
    description: "Manages analyst review workflows and fraud cases."
    technology: "Java Spring Boot container on Amazon ECS on Fargate"
  - type: "container"
    name: "Data & Audit Stores"
    description: "Provides tamper-evident audit logs, feature store, and case management storage."
    technology: "Amazon DynamoDB with AWS KMS, DynamoDB Streams, and Amazon RDS PostgreSQL"
  - type: "container"
    name: "Messaging & Eventing"
    description: "Decouples real-time scoring from asynchronous auditing and case creation."
    technology: "Amazon SQS, SNS, and EventBridge"
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "API Gateway & Routing Layer"
    description: "Ingests authorization requests over HTTPS"
    technology: "HTTPS"
  - source: "API Gateway & Routing Layer"
    destination: "Real-Time Scoring Service"
    description: "Forwards requests for low-latency evaluation"
    technology: "gRPC"
  - source: "Real-Time Scoring Service"
    destination: "Data & Audit Stores"
    description: "Writes cryptographically hashed, immutable decision payloads and reads/writes features"
    technology: "AWS KMS / DynamoDB API"
  - source: "Real-Time Scoring Service"
    destination: "Messaging & Eventing"
    description: "Asynchronously publishes review cases and audit events"
    technology: "Amazon SQS / SNS"
  - source: "Messaging & Eventing"
    destination: "Case Management Backend"
    description: "Triggers analyst workflows for suspicious transactions"
    technology: "Amazon SQS"
  - source: "Case Management Backend"
    destination: "Data & Audit Stores"
    description: "Persists case management and review data"
    technology: "Amazon RDS PostgreSQL"
  - source: "Fraud Analyst"
    destination: "Case Management Backend"
    description: "Reviews and manages fraud cases"
    technology: "HTTPS with MFA and RBAC"
  - source: "Real-Time Scoring Service"
    destination: "Card Networks & Tokenization Vault"
    description: "Performs token resolution"
    technology: "mTLS / HTTPS"
  - source: "Real-Time Scoring Service"
    destination: "Core-Banking / Ledger System"
    description: "Sends transaction disposition"
    technology: "HTTPS / REST"
  - source: "Model Training Environment"
    destination: "Real-Time Scoring Service"
    description: "Ingests secure model artifacts"
    technology: "AWS Signer / KMS cryptographic verification"