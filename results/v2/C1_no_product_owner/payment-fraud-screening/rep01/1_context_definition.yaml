level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Screens card-not-present payment authorizations and provides case management for fraud analysts, maintaining sub-50ms latency at 3,000 TPS with PCI-DSS Level 1 compliance."
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Fraud analyst responsible for investigating suspicious transactions and managing fraud cases using MFA and RBAC."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "External payment gateway sending card-not-present payment authorizations for real-time scoring."
  - type: "externalSystem"
    name: "Card Networks & Tokenization Vault"
    description: "External vault used for token resolution."
  - type: "externalSystem"
    name: "Core-Banking / Ledger System"
    description: "External core-banking ledger system used for final transaction disposition."
  - type: "externalSystem"
    name: "Model Training Environment"
    description: "External environment for training machine learning models and providing model artifacts."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "Real-Time Payment Fraud Screening System"
    description: "for real-time scoring"
    technology: "gRPC over HTTP/2"
  - source: "Fraud Analyst"
    destination: "Real-Time Payment Fraud Screening System"
    description: "for case management and investigations"
    technology: "HTTPS with MFA and RBAC"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Card Networks & Tokenization Vault"
    description: "for token resolution"
    technology: "mTLS / HTTPS"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Core-Banking / Ledger System"
    description: "for transaction disposition"
    technology: "HTTPS / REST"
  - source: "Model Training Environment"
    destination: "Real-Time Payment Fraud Screening System"
    description: "for secure model artifact ingestion"
    technology: "AWS Signer / KMS cryptographic verification"