level: component
scope: "Component diagram for the Data & Audit Stores container"
parentContainer:
  name: "Data & Audit Stores"
elements:
  - type: "component"
    name: "Audit & Decision Log Store"
    technology: "Amazon DynamoDB with AWS KMS and DynamoDB Streams"
    description: "Appends immutable decision records and provides tamper-evident 7-year audit logging."
  - type: "component"
    name: "Feature Store"
    technology: "Amazon DynamoDB"
    description: "Provides secure, low-latency feature storage for real-time fraud screening."
  - type: "component"
    name: "Case Management Database"
    technology: "Amazon RDS PostgreSQL"
    description: "Handles relational case management data persistence for complex analyst workflows."
  - type: "component"
    name: "Audit Archival Worker"
    technology: "AWS Lambda"
    description: "Processes change records from DynamoDB Streams with minimal operational overhead."
  - type: "component"
    name: "Long-Term Audit Archive"
    technology: "Amazon S3 Glacier Flexible Retrieval with S3 Object Lock"
    description: "Stores tamper-evident 7-year audit archives meeting budget and compliance constraints."
relationships:
  - source: "Real-Time Scoring Service"
    destination: "Feature Store"
    description: "Read/write fraud features via DynamoDB SDK (HTTPS/TLS 1.3)"
  - source: "Real-Time Scoring Service"
    destination: "Audit & Decision Log Store"
    description: "Appends immutable decision records via DynamoDB API (HTTPS/TLS 1.3)"
  - source: "Case Management Backend"
    destination: "Case Management Database"
    description: "Relational data persistence via PostgreSQL JDBC (TLS 1.3)"
  - source: "Audit & Decision Log Store"
    destination: "Audit Archival Worker"
    description: "Streams change records via DynamoDB Streams (Internal AWS Event Source)"
  - source: "Audit Archival Worker"
    destination: "Long-Term Audit Archive"
    description: "Writes tamper-evident archives via S3 API (HTTPS/TLS 1.3)"