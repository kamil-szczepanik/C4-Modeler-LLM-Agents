level: component
scope: "Component diagram for the Case Management Backend container"
parentContainer:
  name: "Case Management Backend"
elements:
  - type: "component"
    name: "Workflow Engine Component"
    technology: "Spring State Machine"
    description: "Manages analyst review workflows and fraud cases using state machines."
  - type: "component"
    name: "Analyst Portal API Controller"
    technology: "Spring MVC/REST"
    description: "Provides REST endpoints for the analyst portal and invokes workflow operations."
  - type: "component"
    name: "Case Repository Layer"
    technology: "Spring Data JPA"
    description: "Handles data persistence and retrieval of case state via Amazon RDS PostgreSQL."
  - type: "component"
    name: "Tokenization & Masking Service Client"
    technology: "Spring Cloud OpenFeign with Resilience4j"
    description: "Retrieves masked payload data for rendering case details and communicates with external vaults."
relationships:
  - source: "Analyst Portal API Controller"
    destination: "Workflow Engine Component"
    description: "Invokes via direct method calls"
  - source: "Analyst Portal API Controller"
    destination: "Case Repository Layer"
    description: "Persists and retrieves state via Amazon RDS PostgreSQL"
  - source: "Workflow Engine Component"
    destination: "Case Repository Layer"
    description: "Persists state using optimistic locking via Amazon RDS PostgreSQL"
  - source: "Analyst Portal API Controller"
    destination: "Tokenization & Masking Service Client"
    description: "Retrieves masked payload data for rendering case details"
  - source: "Tokenization & Masking Service Client"
    destination: "Card Networks & Tokenization Vault"
    description: "Fetches tokenized card data via mTLS and IAM authentication"