level: component
scope: "Component diagram for the Real-Time Scoring Service container"
parentContainer:
  name: "Real-Time Scoring Service"
elements:
  - type: "component"
    name: "API Handler Component"
    technology: "Go (net/http + gRPC)"
    description: "Forwards low-latency evaluation requests and handles API routing."
  - type: "component"
    name: "Token Resolution Client Component"
    technology: "Go (net/http)"
    description: "Fetches tokenized attributes from card networks and tokenization vaults."
  - type: "component"
    name: "Feature Store Cache Component"
    technology: "Embedded Go LRU Cache / Redis Client"
    description: "Provides fast caching for feature store retrieval."
  - type: "component"
    name: "Scoring Engine Component"
    technology: "Go WebAssembly / ONNX runtime"
    description: "Executes lightweight machine learning models in-memory for fraud scoring."
  - type: "component"
    name: "Audit & Event Dispatcher Component"
    technology: "Go AWS SDK"
    description: "Writes immutable decision payloads and audit logs."
  - type: "component"
    name: "Circuit Breaker / Fallback Component"
    technology: "Go (gobreaker)"
    description: "Provides resilience and fallback mechanisms during downstream failures."
relationships:
  - source: "API Gateway & Routing Layer"
    destination: "API Handler Component"
    description: "Forwards low-latency evaluation requests [gRPC]"
  - source: "Token Resolution Client Component"
    destination: "Card Networks & Tokenization Vault"
    description: "Fetches tokenized attributes [mTLS / HTTPS]"
  - source: "Audit & Event Dispatcher Component"
    destination: "Amazon DynamoDB"
    description: "Writes immutable decision payloads and audit logs [AWS KMS / DynamoDB API]"
  - source: "Scoring Engine Component"
    destination: "Model Training Environment"
    description: "Ingests signed model artifacts [AWS Signer / KMS]"