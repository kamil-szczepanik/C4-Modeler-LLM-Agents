level: component
scope: "Component diagram for the Messaging & Eventing container"
parentContainer:
  name: "Messaging & Eventing"
elements:
  - type: "component"
    name: "Audit Event Publisher"
    technology: "Lightweight Go client with asynchronous batching"
    description: "Publishes audit logs asynchronously to the Audit SNS Topic."
  - type: "component"
    name: "Case Queue"
    technology: "Amazon SQS FIFO Queue"
    description: "Ensures strict message ordering per account for review workflows, featuring content-based deduplication and a DLQ."
  - type: "component"
    name: "Model Event Bus"
    technology: "Amazon EventBridge"
    description: "Broadcasts model hot-reloading signals to the scoring service."
  - type: "component"
    name: "Audit SNS Topic"
    technology: "Amazon SNS"
    description: "Provides reliable fan-out pattern for audit logs with encryption."
relationships:
  - source: "Audit Event Publisher"
    destination: "Audit SNS Topic"
    description: "Publishes audit logs [HTTPS, AWS KMS CMK encryption]"
  - source: "Model Event Bus"
    destination: "Real-Time Scoring Service"
    description: "Broadcasts model hot-reloading signals [HTTPS]"
  - source: "Real-Time Scoring Service"
    destination: "Case Queue"
    description: "Sends review cases for suspicious transactions [Amazon SQS FIFO API, HTTPS, AWS KMS CMK encryption]"
  - source: "Case Queue"
    destination: "Case Management Backend"
    description: "Long-polling for review workflows [AWS SDK, HTTPS]"