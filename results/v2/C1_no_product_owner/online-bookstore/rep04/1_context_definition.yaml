# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "Core multi-region e-commerce platform built on AWS to sell physical and electronic books with recommendations and reviews, providing secure browsing, purchasing, and fulfillment."
elements:
  - type: "person"
    name: "Customer"
    description: "End-user browsing, purchasing, and reviewing books."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe or PayPal for secure PCI-DSS compliant checkout."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "FedEx or UPS for order fulfillment."
  - type: "externalSystem"
    name: "Tax & Compliance Service"
    description: "Avalara for regional tax calculation and GDPR/CCPA requests."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "AWS Cognito or Auth0 for authentication and MFA."
  - type: "externalSystem"
    name: "Notification Service"
    description: "AWS SES or SendGrid for transactional emails."
  - type: "externalSystem"
    name: "CDN / Global Traffic Manager"
    description: "AWS CloudFront and Route 53 for edge caching and geo-routing."
  - type: "externalSystem"
    name: "APM & Monitoring Provider"
    description: "Datadog or AWS CloudWatch for distributed tracing and logs."
  - type: "externalSystem"
    name: "Secrets Manager"
    description: "AWS Secrets Manager for credential storage and rotation."
relationships:
  - source: "Customer"
    destination: "CDN / Global Traffic Manager"
    description: "Accesses platform via HTTPS"
    technology: "HTTPS (TLS 1.3)"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Processes transactions"
    technology: "REST/HTTPS"
  - source: "Online Bookstore System"
    destination: "Shipping Provider APIs"
    description: "Generates labels"
    technology: "REST/JSON over HTTPS"
  - source: "Online Bookstore System"
    destination: "Tax & Compliance Service"
    description: "Validates taxes"
    technology: "REST/HTTPS"
  - source: "Online Bookstore System"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OAuth2/OIDC using short-lived JWTs"
  - source: "Online Bookstore System"
    destination: "Notification Service"
    description: "Dispatches emails"
    technology: "SMTP/HTTPS"