level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Customer"
    description: "End-user browsing, purchasing, and reviewing books."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "AWS Cognito or Auth0 for authentication and MFA."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "FedEx or UPS for order fulfillment."
  - type: "container"
    name: "Amazon CloudFront & AWS S3"
    technology: "React / TypeScript SPA, AWS CloudFront, AWS S3"
    description: "SPA hosting CDN providing fast client-side rendering for catalog browsing, shopping cart/checkout, recommendations, and reviews."
  - type: "container"
    name: "AWS API Gateway"
    technology: "AWS API Gateway with WAF"
    description: "Entry point providing secure routing and web application firewall protection."
  - type: "container"
    name: "Core E-Commerce Service"
    technology: "Node.js, TypeScript, AWS ECS Fargate"
    description: "Handles core business logic, shopping cart, checkout, and order fulfillment integration."
  - type: "container"
    name: "Recommendation & Search Service"
    technology: "Python, FastAPI, AWS ECS, Amazon OpenSearch"
    description: "Provides product search and personalized recommendations."
  - type: "container"
    name: "Background Worker Service"
    technology: "Node.js, TypeScript, AWS ECS"
    description: "Processes asynchronous tasks and third-party shipping/payment integrations."
  - type: "container"
    name: "Amazon Aurora PostgreSQL Global Database"
    technology: "Amazon Aurora PostgreSQL"
    description: "Multi-region transactional database ensuring high availability and low-latency failover."
  - type: "container"
    name: "Amazon ElastiCache Redis"
    technology: "Amazon ElastiCache Redis"
    description: "In-memory session and cart state management."
  - type: "container"
    name: "Amazon SQS / SNS"
    technology: "Amazon SQS, Amazon SNS with DLQs"
    description: "Asynchronous messaging backbone for decoupled processing."
  - type: "container"
    name: "AWS Secrets Manager & KMS"
    technology: "AWS Secrets Manager, AWS KMS"
    description: "Manages credentials, secrets, and encryption keys securely."
relationships:
  - source: "Customer"
    destination: "Amazon CloudFront & AWS S3"
    description: "Browses and interacts with the SPA"
    technology: "HTTPS"
  - source: "Amazon CloudFront & AWS S3"
    destination: "AWS API Gateway"
    description: "Makes API requests with JWT validation"
    technology: "HTTPS/REST"
  - source: "AWS API Gateway"
    destination: "Core E-Commerce Service"
    description: "Routes core business and checkout requests"
    technology: "gRPC over internal VPC"
  - source: "AWS API Gateway"
    destination: "Recommendation & Search Service"
    description: "Routes search and recommendation queries"
    technology: "gRPC over internal VPC"
  - source: "Core E-Commerce Service"
    destination: "Amazon SQS / SNS"
    description: "Publishes asynchronous messages for background tasks and shipping"
    technology: "TLS / IAM authenticated messaging"
  - source: "Background Worker Service"
    destination: "Amazon SQS / SNS"
    description: "Consumes asynchronous messages and handles DLQs"
    technology: "TLS / IAM authenticated messaging"
  - source: "Core E-Commerce Service"
    destination: "Amazon Aurora PostgreSQL Global Database"
    description: "Reads and writes transactional data"
    technology: "mTLS with IAM least-privilege roles"
  - source: "Core E-Commerce Service"
    destination: "Amazon ElastiCache Redis"
    description: "Manages session and cart state"
    technology: "mTLS with IAM least-privilege roles"
  - source: "Recommendation & Search Service"
    destination: "Amazon OpenSearch"
    description: "Queries book catalog and search indexes"
    technology: "mTLS with IAM least-privilege roles"
  - source: "Core E-Commerce Service"
    destination: "Identity Provider"
    description: "Validates and authenticates user sessions"
    technology: "HTTPS / JWT"
  - source: "Core E-Commerce Service"
    destination: "AWS Secrets Manager & KMS"
    description: "Retrieves secrets and encryption keys"
    technology: "AWS API / TLS"
  - source: "Background Worker Service"
    destination: "Shipping Provider APIs"
    description: "Integrates with third-party shipping providers"
    technology: "REST/JSON over HTTPS"