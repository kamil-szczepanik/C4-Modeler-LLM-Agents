level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL Global Database container"
parentContainer:
  name: "Amazon Aurora PostgreSQL Global Database"
elements:
  - type: "component"
    name: "Primary DB Cluster"
    technology: "Amazon Aurora PostgreSQL"
    description: "Handles primary write operations, transactional consistency, and orchestrates cross-region replication."
  - type: "component"
    name: "Secondary DB Clusters"
    technology: "Amazon Aurora PostgreSQL"
    description: "Provides sub-10ms regional read operations across eu-west-1 and ap-southeast-1."
  - type: "component"
    name: "Regional Storage Subsystem"
    technology: "Amazon Aurora Storage"
    description: "Persists encrypted transaction logs locally using region-bound AWS KMS CMKs."
relationships:
  - source: "Primary DB Cluster"
    destination: "Secondary DB Clusters"
    description: "Replicates transactional data cross-region via dedicated AWS backbone infrastructure"
  - source: "Primary DB Cluster"
    destination: "Regional Storage Subsystem"
    description: "Persists encrypted transaction logs locally"