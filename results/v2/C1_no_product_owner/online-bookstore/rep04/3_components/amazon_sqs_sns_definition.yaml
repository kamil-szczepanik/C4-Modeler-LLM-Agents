level: component
scope: "Component diagram for the Amazon SQS / SNS container"
parentContainer:
  name: "Amazon SQS / SNS"
elements:
  - type: "component"
    name: "Order Events SNS Topic"
    technology: "Amazon SNS"
    description: "Fan-out broker utilizing HTTPS and IAM to distribute order events."
  - type: "component"
    name: "Checkout SQS Queue"
    technology: "Amazon SQS Standard"
    description: "Buffers checkout orders asynchronously."
  - type: "component"
    name: "Shipping SQS FIFO Queue"
    technology: "Amazon SQS FIFO"
    description: "Handles strictly ordered third-party shipping payloads."
  - type: "component"
    name: "Processing DLQs"
    technology: "Amazon SQS Dead Letter Queues"
    description: "Captures poisoned messages after max receives."
  - type: "component"
    name: "Event Publisher Component"
    technology: "AWS SDK for JavaScript"
    description: "Embedded in the Core E-Commerce Service to publish standardized JSON event payloads."
  - type: "component"
    name: "Subscription Filter Component"
    technology: "SNS Subscription Filters"
    description: "Routes messages conditionally via HTTPS."
