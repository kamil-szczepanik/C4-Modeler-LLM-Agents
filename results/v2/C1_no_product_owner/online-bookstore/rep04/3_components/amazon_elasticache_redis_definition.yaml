level: component
scope: "Component diagram for the Amazon ElastiCache Redis container"
parentContainer:
  name: "Amazon ElastiCache Redis"
elements:
  - type: "component"
    name: "Session Store Module"
    technology: "Redis RESP over TLS, Redis ACLs"
    description: "Manages high-performance in-memory user sessions for fast page loads."
  - type: "component"
    name: "Distributed Shopping Cart Module"
    technology: "Redis RESP over TLS, Redis ACLs"
    description: "Handles shopping cart persistence and rapid item updates."
  - type: "component"
    name: "Cache-Aside / Eviction Management Module"
    technology: "Redis RESP over TLS, cache.m6g.xlarge"
    description: "Configures TTLs and invalidations to support global scaling and low-latency data access."
  - type: "component"
    name: "Core E-Commerce Service"
    technology: "Application Service"
    description: "Interacts with Redis modules for sessions, carts, and cache management."
  - type: "component"
    name: "Amazon CloudWatch & AWS KMS"
    technology: "AWS Management & Security Services"
    description: "Provides metrics monitoring, slow log analysis, and encryption."
relationships:
  - source: "Core E-Commerce Service"
    destination: "Session Store Module"
    description: "Read/Write user sessions via Redis RESP protocol over TLS"
  - source: "Core E-Commerce Service"
    destination: "Distributed Shopping Cart Module"
    description: "Read/Write cart items via Redis RESP protocol over TLS"
  - source: "Core E-Commerce Service"
    destination: "Cache-Aside / Eviction Management Module"
    description: "Configure TTLs and invalidations via Redis RESP protocol over TLS"
  - source: "Amazon ElastiCache Redis"
    destination: "Amazon S3"
    description: "Automated daily snapshots and AOF persistence"
  - source: "Amazon ElastiCache Redis"
    destination: "Amazon CloudWatch"
    description: "Metrics monitoring (EngineCPUUtilization, DatabaseMemoryUsagePercentage, Slow Log)"