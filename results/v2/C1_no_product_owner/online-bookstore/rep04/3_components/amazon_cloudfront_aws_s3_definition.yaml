level: component
scope: "Component diagram for the Amazon CloudFront & AWS S3 container"
parentContainer:
  name: "Amazon CloudFront & AWS S3"
elements:
  - type: "component"
    name: "Amazon CloudFront"
    technology: "AWS CloudFront"
    description: "Global CDN and edge router providing SSL/TLS termination, global caching, and routing of static assets and API requests."
  - type: "component"
    name: "AWS S3 Bucket"
    technology: "AWS S3"
    description: "Static asset storage with server-side encryption via AWS KMS and Block Public Access."
  - type: "component"
    name: "CloudFront Functions"
    technology: "CloudFront Functions JavaScript"
    description: "Executes URL rewrites and header injections at edge runtime with sub-2ms transformations."
  - type: "component"
    name: "AWS WAF"
    technology: "AWS WAF"
    description: "Inspects incoming client traffic for security threats and provides OWASP Top-10 mitigations."
relationships:
  - source: "Amazon CloudFront"
    destination: "CloudFront Functions"
    description: "Executes URL rewrites and header injections"
  - source: "Amazon CloudFront"
    destination: "AWS S3 Bucket"
    description: "Fetches uncached static assets using Origin Access Control (OAC)"
  - source: "AWS WAF"
    destination: "Amazon CloudFront"
    description: "Inspects incoming client traffic for security threats"