level: component
scope: "Component diagram for the Background Worker Service container"
parentContainer:
  name: "Background Worker Service"
elements:
  - type: "component"
    name: "Queue Consumer Component"
    technology: "TypeScript, aws-sdk, sqs-consumer"
    description: "Polls asynchronous jobs from Amazon SQS"
  - type: "component"
    name: "Order Processing Engine"
    technology: "TypeScript"
    description: "Executes transactional database writes and processes core orders"
  - type: "component"
    name: "Shipping Integrator Component"
    technology: "TypeScript, axios"
    description: "Manages external API calls to shipping providers"
  - type: "component"
    name: "Task Scheduler Component"
    technology: "TypeScript, node-cron, AWS EventBridge"
    description: "Schedules and triggers periodic background tasks"
  - type: "component"
    name: "Outbox Dispatcher Component"
    technology: "TypeScript"
    description: "Polls and clears outbox tables and publishes domain events"
  - type: "component"
    name: "Amazon SQS"
    technology: "AWS SQS"
    description: "Enables decoupled, asynchronous messaging with DLQs"
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "PostgreSQL"
    description: "Transactional database for storing state and outbox tables"
  - type: "component"
    name: "Shipping Provider APIs"
    technology: "REST/JSON over HTTPS"
    description: "External APIs for managing shipments"
  - type: "component"
    name: "Amazon SNS"
    technology: "AWS SNS"
    description: "Publishes domain events securely"
relationships:
  - source: "Queue Consumer Component"
    destination: "Amazon SQS"
    description: "Polls asynchronous jobs [HTTPS / IAM]"
  - source: "Order Processing Engine"
    destination: "Amazon Aurora PostgreSQL"
    description: "Executes transactional database writes [PostgreSQL Wire Protocol / TLS]"
  - source: "Shipping Integrator Component"
    destination: "Shipping Provider APIs"
    description: "Manages external API calls [REST/JSON over HTTPS with mTLS]"
  - source: "Outbox Dispatcher Component"
    destination: "Amazon SNS"
    description: "Publishes domain events [HTTPS / IAM]"
  - source: "Outbox Dispatcher Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "Polls and clears outbox tables [PostgreSQL Wire Protocol / TLS]"