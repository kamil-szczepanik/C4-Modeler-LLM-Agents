level: component
scope: "Component diagram for the AWS Secrets Manager & KMS container"
parentContainer:
  name: "AWS Secrets Manager & KMS"
elements:
  - type: "component"
    name: "Secrets Engine Component"
    technology: "AWS Secrets Manager"
    description: "Manages automated database credential rotation, API keys, and fetches runtime DB credentials."
  - type: "component"
    name: "Key Management Component"
    technology: "AWS Key Management Service (KMS)"
    description: "Provides Customer Managed Keys (CMKs) for envelope encryption of PII at rest and encrypts/decrypts sensitive customer PII fields."
  - type: "component"
    name: "IAM Policy Enforcement Component"
    technology: "AWS IAM & Resource-Based Policies"
    description: "Enforces strict IAM and resource-based policies for access control and compliance."
  - type: "component"
    name: "VPC Endpoint Integration Component"
    technology: "AWS PrivateLink / Interface VPC Endpoints"
    description: "Routes API calls internally and forwards requests securely without public internet exposure."
  - type: "component"
    name: "Core E-Commerce Service"
    technology: "Node.js, TypeScript, AWS ECS Fargate"
    description: "Core e-commerce service executing API calls, managing customer interactions, and utilizing AWS SDK client-side caching."
relationships:
  - source: "Core E-Commerce Service"
    destination: "VPC Endpoint Integration Component"
    description: "Routes API calls internally [AWS PrivateLink / TLS 1.3]"
  - source: "VPC Endpoint Integration Component"
    destination: "Secrets Engine Component"
    description: "Forwards requests securely [AWS internal network]"
  - source: "VPC Endpoint Integration Component"
    destination: "Key Management Component"
    description: "Forwards requests securely [AWS internal network]"
  - source: "Core E-Commerce Service"
    destination: "Secrets Engine Component"
    description: "Fetches runtime DB credentials [HTTPS/TLS via AWS SDK]"
  - source: "Core E-Commerce Service"
    destination: "Key Management Component"
    description: "Encrypts/decrypts sensitive customer PII fields [AWS KMS API / TLS]"