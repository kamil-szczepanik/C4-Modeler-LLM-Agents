level: component
scope: "Component diagram for the Core E-Commerce Service container"
parentContainer:
  name: "Core E-Commerce Service"
elements:
  - type: "component"
    name: "Checkout Orchestrator Component"
    technology: "Node.js, TypeScript, AWS ECS Fargate"
    description: "Manages the checkout process and coordinates payment gateway integration."
  - type: "component"
    name: "Fulfillment Coordinator Component"
    technology: "Node.js, TypeScript, AWS ECS Fargate"
    description: "Coordinates order fulfillment and communicates with messaging queues."
  - type: "component"
    name: "Data Access Repository Component"
    technology: "Node.js, TypeScript, AWS ECS Fargate"
    description: "Handles data access and persistence operations for transactional data."
relationships:
  - source: "Checkout Orchestrator Component"
    destination: "Payment Gateway"
    description: "Secure payment processing via HTTPS"
  - source: "Fulfillment Coordinator Component"
    destination: "Amazon SQS / SNS"
    description: "Publishes asynchronous fulfillment events via TLS / IAM"
  - source: "Data Access Repository Component"
    destination: "Amazon Aurora PostgreSQL Global Database"
    description: "Transactional data persistence via gRPC over mTLS"
  - source: "Checkout Orchestrator Component"
    destination: "Amazon ElastiCache Redis"
    description: "Cart and session state management via mTLS"
  - source: "Checkout Orchestrator Component"
    destination: "Fulfillment Coordinator Component"
    description: "East-West communication via gRPC over mTLS using AWS App Mesh"