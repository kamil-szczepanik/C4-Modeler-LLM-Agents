level: component
scope: "Component diagram for the Recommendation & Search Service container"
parentContainer:
  name: "Recommendation & Search Service"
elements:
  - type: "component"
    name: "API Controller Component"
    technology: "Python, FastAPI, gRPC"
    description: "FastAPI app handling incoming gRPC requests, JWT validation, and schema checks."
  - type: "component"
    name: "Search Engine Component"
    technology: "Python, OpenSearch DSL"
    description: "Translates user queries into OpenSearch DSL queries with input sanitization."
  - type: "component"
    name: "Recommendation Engine Component"
    technology: "Python, NumPy, SciPy"
    description: "Computes collaborative filtering heuristics and manages a circuit breaker."
  - type: "component"
    name: "Catalog Sync Consumer Component"
    technology: "Python, AWS SDK"
    description: "Processes domain events asynchronously from SQS to update search indices."
  - type: "component"
    name: "Amazon OpenSearch"
    technology: "Managed Search Cluster"
    description: "Managed search cluster storing book catalog and search indexes."
  - type: "component"
    name: "Amazon ElastiCache Redis"
    technology: "In-memory Data Store"
    description: "In-memory data store caching precomputed recommendation vectors."
  - type: "component"
    name: "Amazon SQS / SNS"
    technology: "Messaging Infrastructure"
    description: "Messaging infrastructure with Dead Letter Queues (DLQs) for asynchronous catalog synchronization."
relationships:
  - source: "API Gateway"
    destination: "API Controller Component"
    description: "Routes search and recommendation queries [gRPC with JWT over internal VPC]"
  - source: "API Controller Component"
    destination: "Search Engine Component"
    description: "Delegates execution flows [In-process async calls via Python asyncio]"
  - source: "API Controller Component"
    destination: "Recommendation Engine Component"
    description: "Delegates execution flows [In-process async calls via Python asyncio]"
  - source: "Search Engine Component"
    destination: "Amazon OpenSearch"
    description: "Queries index [HTTPS/REST with SigV4 and mTLS]"
  - source: "Recommendation Engine Component"
    destination: "Amazon ElastiCache Redis"
    description: "Fetches cached vectors [Redis Protocol with TLS via redis-py]"
  - source: "Catalog Sync Consumer Component"
    destination: "Amazon SQS / SNS"
    description: "Consumes catalog update events [AWS SDK]"
  - source: "Catalog Sync Consumer Component"
    destination: "Amazon OpenSearch"
    description: "Updates document indices [HTTPS/REST]"