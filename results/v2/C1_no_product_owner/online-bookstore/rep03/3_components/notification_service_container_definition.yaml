level: component
scope: "Component diagram for the Notification Service Container container"
parentContainer:
  name: "Notification Service Container"
elements:
  - type: "component"
    name: "Event Consumer Component"
    technology: "Go, AWS SDK for Go"
    description: "Consumes asynchronous events from Amazon SQS and Amazon EventBridge."
  - type: "component"
    name: "Notification Dispatcher Component"
    technology: "Go"
    description: "Orchestrates the dispatching of multi-channel notifications."
  - type: "component"
    name: "Template Engine Component"
    technology: "Go, text/template"
    description: "Renders notification content using predefined templates."
  - type: "component"
    name: "Third-Party Provider Adapter Component"
    technology: "Go, HTTP Client"
    description: "Adapts and sends final messages to external APIs."
  - type: "component"
    name: "DLQ Handler Component"
    technology: "Go"
    description: "Handles poison-pill messages and forwards them to the dead-letter queue."
  - type: "component"
    name: "Secrets Manager Client Component"
    technology: "Go, AWS SDK for Go"
    description: "Retrieves API credentials and secrets securely."
relationships:
  - source: "Event Consumer Component"
    destination: "Notification Dispatcher Component"
    description: "Forwards raw event payloads [In-memory function call]"
  - source: "Event Consumer Component"
    destination: "DLQ Handler Component"
    description: "Forwards poison-pill messages [In-memory function call]"
  - source: "Notification Dispatcher Component"
    destination: "Template Engine Component"
    description: "Requests rendered content [In-memory function call]"
  - source: "Notification Dispatcher Component"
    destination: "Third-Party Provider Adapter Component"
    description: "Dispatches final messages [REST over HTTPS]"
  - source: "Third-Party Provider Adapter Component"
    destination: "Secrets Manager Client Component"
    description: "Retrieves API credentials [In-memory cache lookup]"
  - source: "Third-Party Provider Adapter Component"
    destination: "SendGrid & Twilio APIs"
    description: "Sends notifications [REST over HTTPS with mTLS]"