level: component
scope: "Component diagram for the Recommendations Container container"
parentContainer:
  name: "Recommendations Container"
elements:
  - type: "component"
    name: "Recommendation API Router"
    technology: "FastAPI, Pydantic"
    description: "FastAPI component handling REST endpoints and Pydantic input validation."
  - type: "component"
    name: "Cache Manager"
    technology: "Python"
    description: "Orchestrates cache-aside logic for high-performance data retrieval."
  - type: "component"
    name: "Scoring Engine"
    technology: "Python, NumPy"
    description: "Python and NumPy component executing co-purchase algorithms."
  - type: "component"
    name: "Recommendation Repository"
    technology: "SQLAlchemy, psycopg3"
    description: "SQLAlchemy-based data access layer."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Redis"
    description: "In-memory cache for hot co-purchase lists."
  - type: "component"
    name: "Amazon Aurora PostgreSQL Read Replica"
    technology: "PostgreSQL"
    description: "Dedicated database read-replica for offline-computed associations."
  - type: "component"
    name: "Amazon ECS (AWS Fargate)"
    technology: "AWS Fargate"
    description: "Serverless container deployment platform with auto-scaling."
relationships:
  - source: "API Gateway"
    destination: "Recommendation API Router"
    description: "Routes recommendation requests [gRPC/REST over VPC internal load balancers]."
  - source: "Recommendation API Router"
    destination: "Cache Manager"
    description: "Delegates validated requests [In-memory / TCP]."
  - source: "Cache Manager"
    destination: "Amazon ElastiCache (Redis)"
    description: "Reads and writes cached recommendation payloads [TCP]."
  - source: "Cache Manager"
    destination: "Scoring Engine"
    description: "Executes fallback scoring on cache misses [In-process]."
  - source: "Cache Manager"
    destination: "Recommendation Repository"
    description: "Populates cache on misses [SQL via psycopg3]."
  - source: "Recommendation Repository"
    destination: "Amazon Aurora PostgreSQL Read Replica"
    description: "Fetches pre-aggregated associations [TLS 1.3]."