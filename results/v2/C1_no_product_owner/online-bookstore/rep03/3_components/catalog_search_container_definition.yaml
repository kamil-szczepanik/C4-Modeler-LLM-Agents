level: component
scope: "Component diagram for the Catalog & Search Container container"
parentContainer:
  name: "Catalog & Search Container"
elements:
  - type: "component"
    name: "Search Controller"
    technology: "Spring MVC Controller"
    description: "Handles search requests and routes them to internal services."
  - type: "component"
    name: "Search Service"
    technology: "Spring Boot Service"
    description: "Performs keyword and faceted searches utilizing Amazon OpenSearch Service."
  - type: "component"
    name: "Product Query Service"
    technology: "Spring Boot Service"
    description: "Retrieves product metadata from read replicas in Amazon Aurora PostgreSQL."
  - type: "component"
    name: "Search Index Client"
    technology: "Java HTTP Client"
    description: "Client used to interact with search indexing endpoints."
  - type: "component"
    name: "Catalog Synchronization Worker"
    technology: "Spring Batch"
    description: "Keeps search indexes eventually consistent between Aurora PostgreSQL and OpenSearch."
relationships:
  - source: "Search Controller"
    destination: "Search Service"
    description: "In-memory Java Method Calls"
  - source: "Search Controller"
    destination: "Product Query Service"
    description: "In-memory Java Method Calls"
  - source: "Search Service"
    destination: "Amazon OpenSearch Service"
    description: "Keyword and faceted searches [HTTPS]"
  - source: "Product Query Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Retrieves product metadata from read replicas [JDBC/TLS]"
  - source: "Catalog Synchronization Worker"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads product data for synchronization [JDBC]"
  - source: "Catalog Synchronization Worker"
    destination: "Amazon OpenSearch Service"
    description: "Updates search indexes [HTTPS]"