level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Schema & Protocol Translation"
    technology: "Perimeter filter / JSON/GraphQL parser"
    description: "Perimeter filter validating incoming JSON/GraphQL payloads against strict schemas."
  - type: "component"
    name: "Rate Limiting & Throttling"
    technology: "Token bucket limiter / Amazon ElastiCache (Redis)"
    description: "Token bucket limiter backed by Amazon ElastiCache (Redis) Global Datastores."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Edge validator / JWT / IAM"
    description: "Edge validator integrating with external Identity & Access Management via JWTs."
  - type: "component"
    name: "Routing & Dispatcher"
    technology: "gRPC / VPC Load Balancers / Envoy"
    description: "Traffic forwarder using gRPC and internal VPC load balancers."
relationships:
  - source: "SPA"
    destination: "Schema & Protocol Translation"
    description: "Sends ingress traffic [HTTPS, TLS 1.3]"
  - source: "Schema & Protocol Translation"
    destination: "Rate Limiting & Throttling"
    description: "Passes validated payloads [In-memory]"
  - source: "Rate Limiting & Throttling"
    destination: "Authentication & Authorization Filter"
    description: "Passes rate-checked requests [In-memory]"
  - source: "Authentication & Authorization Filter"
    destination: "Routing & Dispatcher"
    description: "Passes authorized requests [In-memory]"
  - source: "Routing & Dispatcher"
    destination: "Catalog, Order & Recommendations Containers"
    description: "Forwards optimized traffic [gRPC/HTTP2, mTLS]"