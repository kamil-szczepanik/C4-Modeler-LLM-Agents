level: component
scope: "Component diagram for the Order & Checkout Container container"
parentContainer:
  name: "Order & Checkout Container"
elements:
  - type: "component"
    name: "Cart Management Component"
    technology: "Node.js, Express, Amazon DynamoDB"
    description: "Manages shopping carts and session carts using a single-table design."
  - type: "component"
    name: "Checkout Orchestrator Component"
    technology: "Node.js, Express, Amazon DynamoDB"
    description: "Orchestrates transaction workflows and ensures idempotency."
  - type: "component"
    name: "Order Processing Component"
    technology: "Node.js, Express, Amazon Aurora PostgreSQL"
    description: "Handles ACID-compliant transactional persistence for financial order records."
  - type: "component"
    name: "Shipping Integrator Component"
    technology: "Node.js, Express"
    description: "Fetches rates and generates labels from external shipping provider APIs."
relationships:
  - source: "Cart Management Component"
    destination: "Checkout Orchestrator Component"
    description: "Validates JWT tokens and enforces Object-Level Authorization [HTTPS/REST]"
  - source: "Checkout Orchestrator Component"
    destination: "Order Processing Component"
    description: "Initiates order creation [Internal Function Call / TypeScript Interface]"
  - source: "Order Processing Component"
    destination: "Amazon EventBridge"
    description: "Publishes `OrderPlaced` events [AWS SDK]"
  - source: "Shipping Integrator Component"
    destination: "Shipping Provider APIs"
    description: "Fetches rates and generates labels [REST/JSON]"