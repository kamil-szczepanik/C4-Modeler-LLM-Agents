level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "An Amazon-style e-commerce online bookstore for physical and electronic books with reviews, recommendations, and multi-currency support, designed for high availability and global scalability."
elements:
  - type: "person"
    name: "Customer"
    description: "End user who browses, purchases, and reviews physical and electronic books."
  - type: "person"
    name: "Admin / Support Staff"
    description: "Personnel responsible for managing bookstore operations, content, and customer support."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processor (Stripe) for handling transactions."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "External shipping services (FedEx, DHL) for order fulfillment and tracking."
  - type: "externalSystem"
    name: "Tax & Compliance Service"
    description: "External service (Avalara) for tax calculation and compliance."
  - type: "externalSystem"
    name: "Identity & Access Management"
    description: "External identity provider (Auth0 / AWS Cognito) for authentication and authorization."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External communication service (SendGrid / AWS SES) for sending notifications and emails."
relationships:
  - source: "Customer"
    destination: "Online Bookstore System"
    description: "Browses books, manages account, and makes purchases"
    technology: "HTTPS / TLS 1.3"
  - source: "Admin / Support Staff"
    destination: "Online Bookstore System"
    description: "Manages bookstore operations and support"
    technology: "HTTPS / TLS 1.3"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Processes customer payments"
    technology: "TLS/REST"
  - source: "Online Bookstore System"
    destination: "Shipping Provider APIs"
    description: "Coordinates order shipping and tracking"
    technology: "TLS/REST"
  - source: "Online Bookstore System"
    destination: "Tax & Compliance Service"
    description: "Calculates taxes and verifies compliance"
    technology: "HTTPS/REST"
  - source: "Online Bookstore System"
    destination: "Identity & Access Management"
    description: "Authenticates users and manages sessions"
    technology: "OIDC/OAuth2 over TLS 1.3"
  - source: "Online Bookstore System"
    destination: "Notification Service"
    description: "Sends transactional emails and notifications"
    technology: "TLS/SMTP"