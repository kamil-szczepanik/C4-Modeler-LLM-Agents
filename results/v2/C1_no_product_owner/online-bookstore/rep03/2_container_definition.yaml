level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Customer"
    description: "End user who browses, purchases, and reviews books."
  - type: "person"
    name: "Admin / Support Staff"
    description: "Personnel responsible for managing bookstore operations and support."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processor for handling transactions."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "External shipping services for order fulfillment and tracking."
  - type: "externalSystem"
    name: "Tax & Compliance Service"
    description: "External service for tax calculation and compliance."
  - type: "externalSystem"
    name: "Identity & Access Management"
    description: "External identity provider for authentication and authorization."
  - type: "container"
    name: "SPA"
    technology: "React, TypeScript, Amazon CloudFront, Amazon S3"
    description: "Frontend application for catalog browsing, checkout, recommendations, and reviews."
  - type: "container"
    name: "API Gateway"
    technology: "Amazon API Gateway REST/GraphQL"
    description: "Entry point for frontend and client requests into the backend services."
  - type: "container"
    name: "Catalog & Search Container"
    technology: "Spring Boot, Amazon OpenSearch Service, Amazon Aurora PostgreSQL"
    description: "Handles catalog browsing, book searching, and querying product data."
  - type: "container"
    name: "Order & Checkout Container"
    technology: "Node.js, Express, Amazon DynamoDB"
    description: "Manages shopping carts, order placement, and checkout processes."
  - type: "container"
    name: "Recommendations Container"
    technology: "Python, FastAPI"
    description: "Provides personalized book recommendations to users."
  - type: "container"
    name: "Notification Service Container"
    technology: "Go, Amazon SQS, Amazon EventBridge"
    description: "Worker service for consuming events and sending notifications."
relationships:
  - source: "Customer"
    destination: "SPA"
    description: "Browses bookstore, manages account, and makes purchases"
    technology: "HTTPS / TLS 1.3"
  - source: "Admin / Support Staff"
    destination: "SPA"
    description: "Manages bookstore operations and support"
    technology: "HTTPS / TLS 1.3"
  - source: "SPA"
    destination: "API Gateway"
    description: "Sends API requests for data and actions"
    technology: "HTTPS/WSS"
  - source: "API Gateway"
    destination: "Catalog & Search Container"
    description: "Routes catalog and search requests"
    technology: "gRPC/REST over VPC internal load balancers"
  - source: "API Gateway"
    destination: "Order & Checkout Container"
    description: "Routes order and checkout requests"
    technology: "gRPC/REST over VPC internal load balancers"
  - source: "API Gateway"
    destination: "Recommendations Container"
    description: "Routes recommendation requests"
    technology: "gRPC/REST over VPC internal load balancers"
  - source: "Order & Checkout Container"
    destination: "Amazon EventBridge"
    description: "Publishes order events asynchronously"
    technology: "HTTPS"
  - source: "Notification Service Container"
    destination: "Amazon EventBridge/SQS"
    description: "Consumes asynchronous events for notifications"
    technology: "Asynchronous event consumption"
  - source: "Catalog & Search Container"
    destination: "Amazon Aurora PostgreSQL"
    description: "Queries product data from read replicas"
    technology: "JDBC/TLS"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Processes customer payments"
    technology: "TLS/REST"
  - source: "Online Bookstore System"
    destination: "Shipping Provider APIs"
    description: "Coordinates order shipping and tracking"
    technology: "TLS/REST"
  - source: "Online Bookstore System"
    destination: "Tax & Compliance Service"
    description: "Calculates taxes and verifies compliance"
    technology: "HTTPS/REST"
  - source: "Online Bookstore System"
    destination: "Identity & Access Management"
    description: "Authenticates users and manages sessions"
    technology: "OIDC/OAuth2 over TLS 1.3"