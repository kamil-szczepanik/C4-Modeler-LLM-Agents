level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "A cloud-native, multi-region Online Bookstore system designed on AWS to deliver scalable book retail services, recommendations, and reviews with global availability and secure third-party integrations."
elements:
  - type: "person"
    name: "Customer"
    description: "Web or mobile user browsing, managing cart, checking out, and leaving reviews."
  - type: "person"
    name: "Admin/Operations"
    description: "Operations personnel managing the bookstore system and administration tasks."
  - type: "externalSystem"
    name: "Stripe"
    description: "Payment Gateway for secure payment processing."
  - type: "externalSystem"
    name: "FedEx/UPS"
    description: "Shipping Provider API for fulfillment and tracking."
  - type: "externalSystem"
    name: "Avalara"
    description: "Tax Calculation Service."
  - type: "externalSystem"
    name: "Auth0/AWS Cognito"
    description: "Identity Provider for authentication tokens and offloaded identity management."
  - type: "externalSystem"
    name: "SendGrid/AWS SES"
    description: "Communication Provider for asynchronous transactional alerts."
  - type: "externalSystem"
    name: "AWS Route 53"
    description: "Global Traffic Manager for latency-based global traffic routing and health checks."
  - type: "externalSystem"
    name: "AWS CloudWatch/Datadog"
    description: "Observability, SIEM telemetry, and GDPR/CCPA audit logging."
  - type: "externalSystem"
    name: "AWS Secrets Manager"
    description: "Infrastructure service for least-privilege credential rotation."
relationships:
  - source: "Customer"
    destination: "Online Bookstore"
    description: "Browsing, cart, checkout, and reviews"
    technology: "HTTPS/TLS"
  - source: "Admin/Operations"
    destination: "Online Bookstore"
    description: "System administration and management"
    technology: "HTTPS/TLS"
  - source: "Online Bookstore"
    destination: "Stripe"
    description: "Secure payment processing"
    technology: "HTTPS/REST via TLS 1.3"
  - source: "Online Bookstore"
    destination: "FedEx/UPS"
    description: "Fulfillment and tracking with circuit-breakers"
    technology: "HTTPS/REST"
  - source: "Online Bookstore"
    destination: "Auth0/AWS Cognito"
    description: "Authentication tokens and identity management"
    technology: "HTTPS/OIDC"
  - source: "Online Bookstore"
    destination: "SendGrid/AWS SES"
    description: "Transactional alerts"
    technology: "Asynchronous HTTPS/REST"
  - source: "AWS Route 53"
    destination: "Online Bookstore"
    description: "Latency-based global traffic routing across regions"
    technology: "DNS / Global Traffic Management"