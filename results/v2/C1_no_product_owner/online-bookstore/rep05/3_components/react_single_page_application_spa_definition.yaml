level: component
scope: "Component diagram for the React Single-Page Application (SPA) container"
parentContainer:
  name: "React Single-Page Application (SPA)"
elements:
  - type: "component"
    name: "Router Component"
    technology: "React Router"
    description: "Handles client-side routing and navigation between views."
  - type: "component"
    name: "Catalog & Search Module"
    technology: "React"
    description: "Provides browsing and search functionalities for the bookstore catalog."
  - type: "component"
    name: "Checkout & Cart Module"
    technology: "React"
    description: "Manages shopping cart state and checkout processes."
  - type: "component"
    name: "Recommendation & Review Module"
    technology: "React"
    description: "Displays product recommendations and user reviews."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios REST Client & Apollo GraphQL Client"
    description: "Sends REST and GraphQL queries with JWT injection to the backend."
  - type: "component"
    name: "State Management Store"
    technology: "Zustand"
    description: "Manages client-side state for instant UI feedback without persisting PII locally."
relationships:
  - source: "API Client Layer"
    destination: "Amazon API Gateway"
    description: "Sends REST and GraphQL queries with JWT injection [HTTPS/REST and GraphQL]"