level: component
scope: "Component diagram for the Catalog Service container"
parentContainer:
  name: "Catalog Service"
elements:
  - type: "component"
    name: "API Controller"
    technology: "Express Router"
    description: "Handles inbound gRPC/HTTP routing, payload validation, and request mapping."
  - type: "component"
    name: "Catalog Business Logic / Domain Core"
    technology: "Node.js"
    description: "Encapsulates rules for category management, book metadata, and inventory linking."
  - type: "component"
    name: "Search & Indexing Adapter"
    technology: "HTTPS/REST"
    description: "Interfaces with Amazon OpenSearch Service for keyword search and faceting."
  - type: "component"
    name: "Data Access Repository"
    technology: "AWS SDK v3"
    description: "Interfaces with Amazon DynamoDB for CRUD operations."
  - type: "component"
    name: "Cache-Aside Repository Wrapper"
    technology: "Amazon ElastiCache (Redis)"
    description: "Manages read-through/write-through caching strategy."
  - type: "component"
    name: "Event Publisher/Consumer"
    technology: "Amazon EventBridge, SNS, SQS"
    description: "Interacts with messaging services to broadcast catalog updates."
relationships:
  - source: "API Controller"
    destination: "Catalog Business Logic / Domain Core"
    description: "Invokes core domain rules via dependency injection."
  - source: "Search & Indexing Adapter"
    destination: "Amazon OpenSearch Service"
    description: "Indexes and queries catalog data via HTTPS/REST [TLS 1.3, IAM roles]."
  - source: "Data Access Repository"
    destination: "Amazon DynamoDB"
    description: "Executes high-throughput CRUD operations [TLS, IAM roles, regional KMS CMKs]."
  - source: "Cache-Aside Repository Wrapper"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches catalog data [in-transit TLS, at-rest KMS CMKs, LRU eviction]."
  - source: "Event Publisher/Consumer"
    destination: "Amazon EventBridge, SQS, SNS"
    description: "Publishes and consumes domain events [JSON over HTTPS]."