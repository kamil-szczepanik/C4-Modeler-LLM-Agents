level: component
scope: "Component diagram for the Amazon ElastiCache (Redis) container"
parentContainer:
  name: "Amazon ElastiCache (Redis)"
elements:
  - type: "component"
    name: "Session Store Engine"
    technology: "Redis Hash"
    description: "Managing user authentication tokens and preferences."
  - type: "component"
    name: "Cart Cache Engine"
    technology: "Redis String/Hash"
    description: "Persisting transient shopping carts during checkout."
  - type: "component"
    name: "Recommendation Cache Engine"
    technology: "Redis Sorted Sets (ZSET)"
    description: "Storing precomputed 'Customers also bought' data."
relationships:
  - source: "Order & Checkout Service"
    destination: "Session Store Engine"
    description: "Reads/writes user session data via RESP protocol over TLS 1.3 [TCP 6379]."
  - source: "Order & Checkout Service"
    destination: "Cart Cache Engine"
    description: "Manages active shopping cart state via RESP protocol over TLS 1.3 [TCP 6379]."
  - source: "Recommendation Service"
    destination: "Recommendation Cache Engine"
    description: "Queries cached recommendations via RESP protocol over TLS 1.3 [TCP 6379]."