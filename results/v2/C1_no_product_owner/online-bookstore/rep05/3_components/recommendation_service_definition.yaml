level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "API Controller"
    technology: "Python FastAPI, gRPC"
    description: "Handles incoming gRPC routing and input sanitization."
  - type: "component"
    name: "Recommendation Engine"
    technology: "Python"
    description: "Core component running collaborative filtering logic and fallback mechanisms."
  - type: "component"
    name: "Model Gateway"
    technology: "Python, AWS SDK"
    description: "Abstraction layer managing interactions with Amazon SageMaker."
  - type: "component"
    name: "Event Consumer"
    technology: "Celery"
    description: "Background worker to ingest asynchronous events."
  - type: "component"
    name: "Cache & Storage Adapter"
    technology: "Redis-py"
    description: "Interfaces with Amazon ElastiCache (Redis) for cached responses and static fallback data."
  - type: "system"
    name: "Amazon API Gateway"
    technology: "AWS App Mesh"
    description: "Routes recommendation requests via gRPC over TLS."
  - type: "system"
    name: "SQS"
    technology: "JSON over HTTPS"
    description: "Queues asynchronous purchase/browsing events."
  - type: "system"
    name: "Amazon SageMaker"
    technology: "AWS SageMaker"
    description: "Provides machine learning inference predictions."
  - type: "system"
    name: "Amazon ElastiCache (Redis)"
    technology: "Redis"
    description: "Provides sub-millisecond cached responses and static fallback data."
relationships:
  - source: "Amazon API Gateway"
    destination: "API Controller"
    description: "Routes recommendation requests via gRPC over TLS [AWS App Mesh]."
  - source: "Event Consumer"
    destination: "SQS"
    description: "Pulls asynchronous purchase/browsing events [JSON over HTTPS]."
  - source: "Recommendation Engine"
    destination: "Cache & Storage Adapter"
    description: "Reads/writes recommendation caches [RESP over TCP with TLS]."
  - source: "Model Gateway"
    destination: "Amazon SageMaker"
    description: "Fetches model inference predictions [HTTPS / AWS SDK via SigV4]."
  - source: "Cache & Storage Adapter"
    destination: "Amazon ElastiCache (Redis)"
    description: "Interfaces with cache storage."