level: component
scope: "Component diagram for the Amazon DynamoDB container"
parentContainer:
  name: "Amazon DynamoDB"
elements:
  - type: "component"
    name: "Request Router / API Frontend"
    technology: "AWS API Frontend / IAM SigV4"
    description: "Routes data read and write operations from clients."
  - type: "component"
    name: "Storage Node Engine (Partition Storage)"
    technology: "Distributed B-Tree Storage Engine, SSD"
    description: "Manages partition storage and executes data read/write operations."
  - type: "component"
    name: "Request Router / Transaction Coordinator"
    technology: "Distributed Coordinator"
    description: "Coordinates transactions and request routing."
  - type: "component"
    name: "Replication Manager (Paxos Group Manager)"
    technology: "Multi-Paxos Consensus"
    description: "Synchronizes partition state across replicas."
  - type: "component"
    name: "Catalog Service"
    technology: "ECS Fargate client"
    description: "Queries and mutates item attributes."
relationships:
  - source: "Catalog Service"
    destination: "Request Router / API Frontend"
    description: "Queries and mutates item attributes [HTTPS/TLS, IAM SigV4]"
  - source: "Request Router / API Frontend"
    destination: "Storage Node Engine (Partition Storage)"
    description: "Routes data read/write operations [Internal RPC]"
  - source: "Storage Node Engine (Partition Storage)"
    destination: "Replication Manager (Paxos Group Manager)"
    description: "Synchronizes partition state across replicas [Multi-Paxos]"