level: component
scope: "Component diagram for the Amazon OpenSearch Service container"
parentContainer:
  name: "Amazon OpenSearch Service"
elements:
  - type: "component"
    name: "OpenSearch REST API / Routing Layer"
    technology: "OpenSearch Core HTTP REST interface"
    description: "Handles incoming HTTP REST requests and routes payloads and queries."
  - type: "component"
    name: "Search & Query Engine"
    technology: "Apache Lucene / OpenSearch Query DSL"
    description: "Powers full-text search, fuzzy matching, and executes review and keyword search queries."
  - type: "component"
    name: "Indexing & Analysis Pipeline"
    technology: "OpenSearch Index Modules"
    description: "Manages inverted indices and processes data ingestion."
  - type: "component"
    name: "Index State Management (ISM) Controller"
    technology: "OpenSearch ISM Engine"
    description: "Automates index lifecycles and exports automated snapshots."
  - type: "component"
    name: "Dedicated Master Nodes"
    technology: "OpenSearch Cluster Nodes"
    description: "Manages cluster state, routing, and high availability."
relationships:
  - source: "Catalog Service"
    destination: "OpenSearch REST API / Routing Layer"
    description: "Submits payloads and queries [HTTPS, TLS 1.3, AWS SigV4]"
  - source: "Search & Query Engine"
    destination: "Indexing & Analysis Pipeline"
    description: "Manages inverted indices [Internal Transport, EBS]"
  - source: "ISM Controller"
    destination: "Amazon S3"
    description: "Exports automated snapshots [HTTPS, AWS KMS]"