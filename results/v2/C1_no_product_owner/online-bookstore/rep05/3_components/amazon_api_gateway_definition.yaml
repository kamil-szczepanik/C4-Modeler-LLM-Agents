level: component
scope: "Component diagram for the Amazon API Gateway container"
parentContainer:
  name: "Amazon API Gateway"
elements:
  - type: "component"
    name: "Edge Request Router"
    technology: "Amazon API Gateway"
    description: "Routes incoming HTTPS and REST requests from the React SPA to appropriate backend services."
  - type: "component"
    name: "Auth & Authorizer"
    technology: "AWS Lambda"
    description: "Handles authentication and authorization for incoming client requests."
  - type: "component"
    name: "Rate Limiter"
    technology: "Amazon API Gateway"
    description: "Enforces rate limiting to protect backend services from excessive traffic."
  - type: "component"
    name: "GraphQL Proxy"
    technology: "AWS AppSync / Amazon API Gateway"
    description: "Proxies GraphQL requests from the client to the underlying microservices."
relationships:
  - source: "Edge Request Router"
    destination: "Auth & Authorizer"
    description: "Validates request tokens"
  - source: "Edge Request Router"
    destination: "Rate Limiter"
    description: "Checks request quotas"
  - source: "Edge Request Router"
    destination: "GraphQL Proxy"
    description: "Forwards GraphQL queries"