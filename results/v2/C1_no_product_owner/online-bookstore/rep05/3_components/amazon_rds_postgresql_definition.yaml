level: component
scope: "Component diagram for the Amazon RDS (PostgreSQL) container"
parentContainer:
  name: "Amazon RDS (PostgreSQL)"
elements:
  - type: "component"
    name: "Relational Storage Engine"
    technology: "PostgreSQL 15"
    description: "ACID-compliant transactional data storage for catalogs, orders, and PII."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Manages database connections to prevent connection exhaustion."
  - type: "component"
    name: "Backup & Replication Manager"
    technology: "AWS Backup / Amazon S3"
    description: "Manages encrypted snapshot exports and replication across regions."
relationships:
  - source: "Connection Pooler"
    destination: "Relational Storage Engine"
    description: "Internal TCP socket"
  - source: "Backup & Replication Manager"
    destination: "Relational Storage Engine"
    description: "Encrypted snapshot exports [AWS KMS, TLS 1.3]"