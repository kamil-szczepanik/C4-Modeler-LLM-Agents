level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Cart Management Component"
    technology: "Spring Bean / Redis Client"
    description: "Manages shopping carts and session data."
  - type: "component"
    name: "Checkout Orchestrator"
    technology: "Spring State Machine / Saga pattern with Resilience4j"
    description: "Orchestrates secure, multi-step transactions and external fulfillment workflows."
  - type: "component"
    name: "Order Processing Component"
    technology: "Spring Data JPA"
    description: "Manages data persistence for transactional orders."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Spring Cloud Stream"
    description: "Emits asynchronous domain events."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache (Redis)"
    description: "Delivers low-latency shopping cart and session management."
  - type: "component"
    name: "Amazon RDS (PostgreSQL)"
    technology: "Amazon RDS (PostgreSQL)"
    description: "Ensures durable persistence for transactional orders and externalized state machine states."
  - type: "component"
    name: "Stripe, Avalara, Shipping APIs"
    technology: "HTTPS / REST"
    description: "External systems for payments, tax calculations, and fulfillment."
  - type: "component"
    name: "Amazon EventBridge / SQS"
    technology: "AWS SDK v2 over HTTPS"
    description: "Messaging infrastructure for asynchronous domain events."
relationships:
  - source: "Cart Management Component"
    destination: "Amazon ElastiCache (Redis)"
    description: "Reads/writes cart sessions [Redis Protocol over TLS]"
  - source: "Checkout Orchestrator"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Persists workflow state [JDBC over TLS]"
  - source: "Checkout Orchestrator"
    destination: "Stripe, Avalara, Shipping APIs"
    description: "Executes payments, tax calculations, and fulfillment [HTTPS / REST]"
  - source: "Order Processing Component"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Commits final order line items [Spring Data JPA over TLS]"
  - source: "Event Publisher Component"
    destination: "Amazon EventBridge / SQS"
    description: "Emits asynchronous OrderPlaced domain events [AWS SDK v2 over HTTPS]"