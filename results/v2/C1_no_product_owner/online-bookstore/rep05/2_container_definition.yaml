level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Customer"
    description: "Customers purchasing physical and electronic books, reading reviews, and getting recommendations."
  - type: "person"
    name: "Admin/Operations"
    description: "Operations personnel managing the bookstore system and administration tasks."
  - type: "externalSystem"
    name: "AWS CloudFront & S3"
    description: "Content delivery network and storage for hosting the frontend application."
  - type: "externalSystem"
    name: "AWS Route 53"
    description: "Global Traffic Manager for latency-based global traffic routing and health checks."
  - type: "externalSystem"
    name: "AWS Secrets Manager & KMS"
    description: "Security services for credential management and encryption key storage."
  - type: "container"
    name: "React Single-Page Application (SPA)"
    technology: "React, hosted on AWS S3, distributed via Amazon CloudFront"
    description: "Provides the user interface for browsing, cart management, checkout, and reviews."
  - type: "container"
    name: "Amazon API Gateway"
    technology: "Amazon API Gateway"
    description: "Ingress point handling HTTPS/REST and GraphQL requests from the frontend."
  - type: "container"
    name: "Catalog Service"
    technology: "Node.js / Express, AWS ECS (Fargate)"
    description: "Manages book catalog data, categories, and inventory metadata."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Spring Boot, AWS ECS (Fargate)"
    description: "Handles orders, transactions, shopping carts, and checkout workflows."
  - type: "container"
    name: "Recommendation Service"
    technology: "Python FastAPI, AWS ECS (Fargate)"
    description: "Provides personalized book recommendations using Python."
  - type: "container"
    name: "Amazon RDS (PostgreSQL)"
    technology: "Amazon RDS (PostgreSQL)"
    description: "Stores transactional and relational data."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "NoSQL database for high-throughput catalog and search backing data."
  - type: "container"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache (Redis)"
    description: "In-memory cache for user sessions and active shopping carts."
  - type: "container"
    name: "Amazon OpenSearch Service"
    technology: "Amazon OpenSearch Service"
    description: "Search engine for fast querying of books and reviews."
  - type: "container"
    name: "Amazon EventBridge, SQS, SNS"
    technology: "Amazon EventBridge, SQS, SNS"
    description: "Event bus and messaging queues for asynchronous inter-service communication."
relationships:
  - source: "Customer"
    destination: "AWS CloudFront & S3"
    description: "Accesses frontend SPA"
    technology: "HTTPS"
  - source: "Admin/Operations"
    destination: "AWS CloudFront & S3"
    description: "Accesses administrative UI views"
    technology: "HTTPS"
  - source: "AWS Route 53"
    destination: "AWS CloudFront & S3"
    description: "Routes global traffic"
    technology: "DNS"
  - source: "React Single-Page Application (SPA)"
    destination: "Amazon API Gateway"
    description: "Sends API requests and queries"
    technology: "HTTPS/REST and GraphQL"
  - source: "Amazon API Gateway"
    destination: "Catalog Service"
    description: "Routes catalog requests via service mesh"
    technology: "gRPC over TLS via AWS App Mesh"
  - source: "Amazon API Gateway"
    destination: "Order & Checkout Service"
    description: "Routes order and checkout requests via service mesh"
    technology: "gRPC over TLS via AWS App Mesh"
  - source: "Amazon API Gateway"
    destination: "Recommendation Service"
    description: "Routes recommendation requests via service mesh"
    technology: "gRPC over TLS via AWS App Mesh"
  - source: "Catalog Service"
    destination: "Amazon DynamoDB"
    description: "Reads and writes catalog data"
    technology: "TLS, IAM roles, regional KMS CMKs"
  - source: "Catalog Service"
    destination: "Amazon OpenSearch Service"
    description: "Indexes catalog for searching"
    technology: "TLS, IAM roles, regional KMS CMKs"
  - source: "Order & Checkout Service"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Persists transactional order data"
    technology: "TLS, IAM roles, regional KMS CMKs"
  - source: "Order & Checkout Service"
    destination: "Amazon ElastiCache (Redis)"
    description: "Manages sessions and active shopping carts"
    technology: "TLS, IAM roles"
  - source: "Catalog Service"
    destination: "Amazon EventBridge, SQS, SNS"
    description: "Publishes and consumes domain events"
    technology: "JSON over HTTPS"
  - source: "Order & Checkout Service"
    destination: "Amazon EventBridge, SQS, SNS"
    description: "Publishes order and checkout events"
    technology: "JSON over HTTPS"
  - source: "Recommendation Service"
    destination: "Amazon EventBridge, SQS, SNS"
    description: "Consumes events for recommendation updates"
    technology: "JSON over HTTPS"
  - source: "Catalog Service"
    destination: "AWS Secrets Manager & KMS"
    description: "Fetches secrets and decrypts data"
    technology: "HTTPS / AWS API"
  - source: "Order & Checkout Service"
    destination: "AWS Secrets Manager & KMS"
    description: "Fetches secrets and decrypts data"
    technology: "HTTPS / AWS API"
  - source: "Recommendation Service"
    destination: "AWS Secrets Manager & KMS"
    description: "Fetches secrets and decrypts data"
    technology: "HTTPS / AWS API"