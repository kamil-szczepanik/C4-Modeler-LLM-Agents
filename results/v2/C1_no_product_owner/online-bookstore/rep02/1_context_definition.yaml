level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "A scaled-down Amazon-style e-commerce platform for purchasing books, providing personalized recommendations, and managing customer reviews globally."
elements:
  - type: "person"
    name: "Customer"
    description: "End-user browsing, purchasing, and reviewing books."
  - type: "person"
    name: "Administrator"
    description: "Manages catalogue, orders, and content moderation."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe/PayPal for secure checkout and multi-currency support."
  - type: "externalSystem"
    name: "Shipping Provider"
    description: "FedEx/UPS APIs for fulfillment and tracking."
  - type: "externalSystem"
    name: "Email/Notification Service"
    description: "SendGrid/AWS SES for transactional emails."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "AWS Cognito for OIDC/OAuth 2.0 authentication."
relationships:
  - source: "Customer"
    destination: "Online Bookstore System"
    description: "Interacts for browsing, purchasing, and reviewing books"
    technology: "HTTPS (TLS 1.3) through AWS CloudFront/WAF edge"
  - source: "Administrator"
    destination: "Online Bookstore System"
    description: "Manages catalogue, orders, and content moderation"
    technology: "HTTPS (TLS 1.3) through AWS CloudFront/WAF edge"
  - source: "Online Bookstore System"
    destination: "Identity Provider"
    description: "Authenticates users and sessions"
    technology: "OIDC/HTTPS"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Executes tokenized payments"
    technology: "HTTPS/REST"
  - source: "Online Bookstore System"
    destination: "Shipping Provider"
    description: "Manages fulfillment and tracking"
    technology: "HTTPS/REST"
  - source: "Online Bookstore System"
    destination: "Email/Notification Service"
    description: "Sends transactional emails"
    technology: "HTTPS/API"