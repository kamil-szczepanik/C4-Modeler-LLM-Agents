level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Checkout Orchestrator Component"
    technology: "Spring @Service"
    description: "Manages multi-step checkout workflows and distributed transaction sagas."
  - type: "component"
    name: "Payment Integration Component"
    technology: "Java / Spring"
    description: "Handles tokenized payment interactions with the external Payment Gateway."
  - type: "component"
    name: "Fulfillment Client Component"
    technology: "Java / Spring"
    description: "Integrates with third-party Shipping Provider APIs for label generation and tracking."
  - type: "component"
    name: "Order Repository Component"
    technology: "Spring Data JPA"
    description: "Interfaces with data persistence using Spring Data JPA."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Spring Cloud Stream and AWS SDK"
    description: "Dispatches asynchronous domain events."
  - type: "component"
    name: "AWS API Gateway"
    technology: "AWS"
    description: "Routes order requests via gRPC over mTLS and ECS Service Connect, validating inbound JWTs."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Relational database for ACID-compliant order data persistence."
  - type: "component"
    name: "AWS EventBridge / SQS"
    technology: "AWS"
    description: "Receives asynchronous domain events via HTTPS."
relationships:
  - source: "AWS API Gateway"
    destination: "Checkout Orchestrator Component"
    description: "Routes order requests via gRPC over mTLS and ECS Service Connect, validating inbound JWTs."
  - source: "Checkout Orchestrator Component"
    destination: "Payment Integration Component"
    description: "Invokes payment processing synchronously via direct Java method calls."
  - source: "Checkout Orchestrator Component"
    destination: "Fulfillment Client Component"
    description: "Invokes fulfillment operations synchronously via direct Java method calls."
  - source: "Order Repository Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists order and transaction data using TCP/TLS."
  - source: "Event Publisher Component"
    destination: "AWS EventBridge / SQS"
    description: "Publishes asynchronous domain events via HTTPS."