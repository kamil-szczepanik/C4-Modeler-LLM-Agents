level: component
scope: "Component diagram for the Amazon ElastiCache container"
parentContainer:
  name: "Amazon ElastiCache"
elements:
  - type: "component"
    name: "Cache Router / Cluster Manager"
    technology: "Redis Cluster-Mode Enabled"
    description: "Manages slot allocation and routes queries."
  - type: "component"
    name: "In-Memory Datastore"
    technology: "Redis In-Memory Datastore"
    description: "Stores in-memory recommendation cache data for sub-millisecond retrieval."
  - type: "component"
    name: "Persistence & Replication Engine"
    technology: "AWS Multi-AZ Replication & Snapshot Engine"
    description: "Backs up data asynchronously via RDB/AOF snapshots and handles replication."
relationships:
  - source: "Cache Router / Cluster Manager"
    destination: "In-Memory Datastore"
    description: "Manages slot allocation and routes queries [Internal Redis Protocol]"
  - source: "In-Memory Datastore"
    destination: "Persistence & Replication Engine"
    description: "Backs up data asynchronously via RDB/AOF snapshots [Internal AWS Network]"