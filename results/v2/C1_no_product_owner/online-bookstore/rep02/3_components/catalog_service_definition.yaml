level: component
scope: "Component diagram for the Catalog Service container"
parentContainer:
  name: "Catalog Service"
elements:
  - type: "component"
    name: "Catalog API Controller"
    technology: "Node.js/Express"
    description: "Handles incoming gRPC requests, schema validation, and JWT-based role authorization."
  - type: "component"
    name: "Search & Browse Engine"
    technology: "Node.js & Amazon OpenSearch"
    description: "Manages complex keyword searching, filtering, and query sanitization."
  - type: "component"
    name: "Catalog Data Repository"
    technology: "Node.js ODM/Mongoose"
    description: "Manages book metadata CRUD operations against Amazon DocumentDB."
  - type: "component"
    name: "Catalog Sync Worker"
    technology: "Node.js background process"
    description: "Consumes asynchronous update events via Amazon SQS to synchronize search indices."
  - type: "component"
    name: "AWS API Gateway"
    technology: "AWS Gateway"
    description: "Routes catalog requests."
  - type: "component"
    name: "Amazon DocumentDB"
    technology: "AWS NoSQL Database"
    description: "Persists catalog data."
  - type: "component"
    name: "Amazon SQS"
    technology: "AWS Messaging"
    description: "Publishes and holds domain events."
  - type: "component"
    name: "Amazon OpenSearch Service"
    technology: "AWS Search Engine"
    description: "Updates search indices for sub-2-second page load performance."
relationships:
  - source: "AWS API Gateway"
    destination: "Catalog API Controller"
    description: "Routes catalog requests [gRPC over mTLS]"
  - source: "Catalog API Controller"
    destination: "Catalog Data Repository"
    description: "Executes metadata operations [In-memory function calls]"
  - source: "Catalog Data Repository"
    destination: "Amazon DocumentDB"
    description: "Persists catalog data [TCP/TLS]"
  - source: "Catalog Data Repository"
    destination: "Amazon SQS"
    description: "Publishes CatalogItemUpdated domain events [HTTPS]"
  - source: "Catalog Sync Worker"
    destination: "Amazon SQS"
    description: "Polls and consumes update messages [HTTPS]"
  - source: "Catalog Sync Worker"
    destination: "Amazon OpenSearch Service"
    description: "Updates search indices [HTTPS with AWS SigV4]"