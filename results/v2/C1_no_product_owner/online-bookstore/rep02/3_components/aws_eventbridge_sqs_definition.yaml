level: component
scope: "Component diagram for the AWS EventBridge / SQS container"
parentContainer:
  name: "AWS EventBridge / SQS"
elements:
  - type: "component"
    name: "Event Bus"
    technology: "AWS EventBridge"
    description: "Central event router utilizing JSON-based rules."
  - type: "component"
    name: "Event Archive"
    technology: "AWS EventBridge Archive"
    description: "Retains historical domain events for 30 days for disaster recovery."
  - type: "component"
    name: "Order Processing Queue"
    technology: "Amazon SQS"
    description: "Buffers order-related events."
  - type: "component"
    name: "Recommendation Queue"
    technology: "Amazon SQS"
    description: "Decouples the Recommendation Service from traffic spikes."
  - type: "component"
    name: "Catalog Update Queue"
    technology: "Amazon SQS"
    description: "Decouples inventory and product updates."
  - type: "component"
    name: "Dead-Letter Queues"
    technology: "Amazon SQS DLQ"
    description: "Attached to SQS queues for isolating failed messages."
relationships:
  - source: "Order & Checkout Service"
    destination: "Event Bus"
    description: "Publishes domain events [HTTPS]"
  - source: "Event Bus"
    destination: "Recommendation Queue"
    description: "Forwards filtered events [AWS API / IAM]"
  - source: "Event Bus"
    destination: "Catalog Update Queue"
    description: "Routes inventory events [AWS API]"
  - source: "Recommendation Service"
    destination: "Recommendation Queue"
    description: "Polls for asynchronous events [HTTPS/Long Polling]"
  - source: "Catalog Service"
    destination: "Catalog Update Queue"
    description: "Consumes inventory events [HTTPS/Long Polling]"