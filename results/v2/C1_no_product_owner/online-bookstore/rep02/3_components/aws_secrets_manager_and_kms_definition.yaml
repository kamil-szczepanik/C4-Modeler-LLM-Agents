level: component
scope: "Component diagram for the AWS Secrets Manager and KMS container"
parentContainer:
  name: "AWS Secrets Manager and KMS"
elements:
  - type: "component"
    name: "Secrets Engine Component"
    technology: "AWS Secrets Manager"
    description: "Manages dynamic database credentials and third-party API keys with automatic rotation."
  - type: "component"
    name: "Key Management Component"
    technology: "AWS Key Management Service (KMS)"
    description: "Secures Customer Master Keys (CMKs) with FIPS 140-2 Level 3 hardware security modules."
  - type: "component"
    name: "Secrets Caching Wrapper"
    technology: "AWS Secrets Manager Caching Library"
    description: "Provides local in-memory credential caching embedded in ECS Fargate services to prevent API throttling."
  - type: "component"
    name: "KMS Crypto Client"
    technology: "AWS Encryption SDK"
    description: "Handles client-side envelope encryption and local data key caching."
  - type: "component"
    name: "Order & Checkout Service"
    technology: "Amazon ECS Fargate"
    description: "Handles order processing and secure checkout operations."
  - type: "component"
    name: "Catalog Service"
    technology: "Amazon ECS Fargate"
    description: "Manages the product catalog operations."
relationships:
  - source: "Order & Checkout Service"
    destination: "Secrets Engine Component"
    description: "Invokes via AWS SDK (HTTPS) through the Secrets Caching Wrapper."
  - source: "Catalog Service"
    destination: "Secrets Engine Component"
    description: "Invokes via AWS SDK (HTTPS) through the Secrets Caching Wrapper."
  - source: "Order & Checkout Service"
    destination: "Key Management Component"
    description: "Invokes via AWS SDK (HTTPS) using the KMS Crypto Client."
  - source: "Catalog Service"
    destination: "Key Management Component"
    description: "Invokes via AWS SDK (HTTPS) using the KMS Crypto Client."
  - source: "Secrets Engine Component"
    destination: "Secrets Engine Component"
    description: "Performs automatic secret rotation via AWS Lambda over HTTPS/TLS 1.3."