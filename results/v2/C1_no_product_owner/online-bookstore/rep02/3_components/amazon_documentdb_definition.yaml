level: component
scope: "Component diagram for the Amazon DocumentDB container"
parentContainer:
  name: "Amazon DocumentDB"
elements:
  - type: "component"
    name: "Query Router & Protocol Engine"
    technology: "TCP/TLS"
    description: "Handles incoming MongoDB wire protocol requests over TCP/TLS."
  - type: "component"
    name: "Storage Subsystem"
    technology: "Distributed SSD Storage"
    description: "Manages distributed SSD storage volumes across 3 Availability Zones."
  - type: "component"
    name: "Replication Manager"
    technology: "AWS Multi-AZ Replication"
    description: "Synchronizes writes across primary and up to 15 replica instances."
  - type: "component"
    name: "Transaction & Index Manager"
    technology: "B-tree Indexing / ACID Engine"
    description: "Handles document-level ACID transactions and maintains B-tree indexing."
relationships:
  - source: "Catalog Service"
    destination: "Query Router & Protocol Engine"
    description: "Sends MongoDB wire protocol requests via [TCP/TLS]."
  - source: "Amazon DocumentDB"
    destination: "AWS KMS"
    description: "Uses customer-managed keys for storage-at-rest encryption."
  - source: "Amazon DocumentDB"
    destination: "Amazon CloudWatch Logs"
    description: "Streams advanced audit logs."