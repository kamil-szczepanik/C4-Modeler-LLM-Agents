level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL container"
parentContainer:
  name: "Amazon Aurora PostgreSQL"
elements:
  - type: "component"
    name: "Database Engine"
    technology: "PostgreSQL 15+"
    description: "Provides relational core for ACID compliance and transactional data, utilizing PL/pgSQL extensions (pg_trgm, uuid-ossp) for fuzzy text searching and native UUID generation."
  - type: "component"
    name: "Aurora Storage Volume"
    technology: "AWS proprietary low-latency storage fabric"
    description: "Replicates and persists blocks securely with AWS KMS encryption."
  - type: "component"
    name: "Aurora Read Replica"
    technology: "PostgreSQL 15+ Read Replica"
    description: "Handles read-heavy workloads and scales read capacity."
  - type: "component"
    name: "Amazon RDS Proxy"
    technology: "Amazon RDS Proxy"
    description: "Prevents connection spikes, routes pooled connections, and ensures sub-30-second failovers."
  - type: "component"
    name: "Order & Checkout Service"
    technology: "ECS Fargate Task"
    description: "Proxies transactional queries via TCP/TLS 1.3."
  - type: "component"
    name: "Catalog Service"
    technology: "ECS Fargate Task"
    description: "Proxies read queries to the replica via TCP/TLS 1.3."
relationships:
  - source: "Order & Checkout Service"
    destination: "Amazon RDS Proxy"
    description: "Proxies transactional queries [TCP/TLS 1.3]"
  - source: "Catalog Service"
    destination: "Amazon RDS Proxy"
    description: "Proxies read queries to replica [TCP/TLS 1.3]"
  - source: "Amazon RDS Proxy"
    destination: "Database Engine"
    description: "Routes pooled connections [TCP/TLS 1.3]"
  - source: "Database Engine"
    destination: "Aurora Storage Volume"
    description: "Replicates and persists blocks [AWS proprietary low-latency storage fabric]"