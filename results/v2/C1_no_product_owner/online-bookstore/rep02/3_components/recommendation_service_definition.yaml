level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "API Controller"
    technology: "FastAPI / Python"
    description: "FastAPI endpoints handling gRPC/REST requests from the API Gateway."
  - type: "component"
    name: "Recommendation Engine"
    technology: "Python"
    description: "Core logic implementing collaborative filtering, algorithms, and fallback heuristics."
  - type: "component"
    name: "Model Loader / Feature Store Client"
    technology: "Python / AWS S3 Client"
    description: "Fetches and cryptographically verifies ML models from Amazon S3."
  - type: "component"
    name: "Cache Manager"
    technology: "Redis Py-Client / Python"
    description: "Manages interactions with Amazon ElastiCache (Redis) with circuit breaker patterns."
  - type: "component"
    name: "Telemetry Publisher"
    technology: "Python / Async Queue"
    description: "Emits sanitised asynchronous interaction events to AWS EventBridge."
  - type: "component"
    name: "Fallback Heuristic Provider"
    technology: "Python"
    description: "Invokes local defaults on circuit breaker trip."
  - type: "component"
    name: "Amazon S3"
    technology: "AWS S3"
    description: "Object storage for batch ML artifacts."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache"
    description: "Provides low-latency caching with TLS encryption in transit and KMS at rest."
  - type: "component"
    name: "AWS EventBridge"
    technology: "AWS EventBridge"
    description: "Handles asynchronous event publishing for telemetry data."
relationships:
  - source: "API Controller"
    destination: "Recommendation Engine"
    description: "In-process method calls [Python]"
  - source: "Recommendation Engine"
    destination: "Cache Manager"
    description: "Checks pre-computed results [Redis Py-Client over TCP/TLS]"
  - source: "Model Loader / Feature Store Client"
    destination: "Amazon S3"
    description: "Fetches batch ML artifacts asynchronously [HTTPS with AWS KMS]"
  - source: "Cache Manager"
    destination: "Fallback Heuristic Provider"
    description: "Invokes local defaults on circuit breaker trip [In-process]"
  - source: "API Controller"
    destination: "Telemetry Publisher"
    description: "Dispatches user interaction events [Async queue with bounded buffer]"
  - source: "Telemetry Publisher"
    destination: "AWS EventBridge"
    description: "Emits sanitised asynchronous interaction events"
  - source: "Cache Manager"
    destination: "Amazon ElastiCache (Redis)"
    description: "Manages interactions with caching layer"