level: component
scope: "Component diagram for the Amazon Route 53 container"
parentContainer:
  name: "Amazon Route 53"
elements:
  - type: "component"
    name: "DNS Resolver Engine"
    technology: "Anycast DNS Infrastructure"
    description: "Resolves bookstore.com via HTTPS/UDP 53, providing low-latency routing."
  - type: "component"
    name: "Traffic Flow Engine"
    technology: "AWS Route 53 Traffic Flow"
    description: "Directs validated client traffic using HTTPS across us-east-1, eu-west-1, and ap-southeast-1."
  - type: "component"
    name: "Health Checking Probe Fleet"
    technology: "Route 53 Health Checkers"
    description: "Performs multi-region health checks to ensure high availability and sub-second performance."
  - type: "component"
    name: "Hosted Zone Management Component"
    technology: "Route 53 Public Hosted Zone"
    description: "Supplies authoritative DNS records and routing policies."
  - type: "component"
    name: "Change Batch Synchronization Auditor"
    technology: "AWS Config and Amazon EventBridge"
    description: "Provides automated drift detection and remediation."
relationships:
  - source: "Customer"
    destination: "DNS Resolver Engine"
    description: "Resolves bookstore.com via HTTPS/UDP 53"
  - source: "Hosted Zone Management Component"
    destination: "Traffic Flow Engine"
    description: "Supplies authoritative DNS records and routing policies"
  - source: "Traffic Flow Engine"
    destination: "AWS API Gateway"
    description: "Directs validated client traffic using HTTPS across us-east-1, eu-west-1, and ap-southeast-1"