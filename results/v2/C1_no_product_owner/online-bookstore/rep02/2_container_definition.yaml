# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Customer"
    description: "End-user browsing, purchasing, and reviewing books."
  - type: "person"
    name: "Administrator"
    description: "Manages catalogue, orders, and content moderation."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe/PayPal for secure checkout and multi-currency support."
  - type: "externalSystem"
    name: "Shipping Provider"
    description: "FedEx/UPS APIs for fulfillment and tracking."
  - type: "externalSystem"
    name: "Email/Notification Service"
    description: "SendGrid/AWS SES for transactional emails."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "AWS Cognito for OIDC/OAuth 2.0 authentication."
  - type: "container"
    name: "Single Page Application"
    technology: "React/TypeScript, AWS S3, AWS CloudFront"
    description: "Frontend client application providing user interface for shopping and browsing."
  - type: "container"
    name: "Amazon Route 53"
    technology: "AWS Route 53"
    description: "Latency-based global traffic management and DNS."
  - type: "container"
    name: "AWS API Gateway"
    technology: "AWS API Gateway"
    description: "API management and entry point for backend services."
  - type: "container"
    name: "Catalog Service"
    technology: "Node.js, Amazon ECS Fargate"
    description: "Manages book catalog metadata."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Spring Boot, Amazon ECS Fargate"
    description: "Handles checkout workflows, orders, and multi-currency transactions."
  - type: "container"
    name: "Recommendation Service"
    technology: "Python/FastAPI, Amazon ECS Fargate"
    description: "Provides personalized book recommendations."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Relational database for ACID compliance and transactional data."
  - type: "container"
    name: "Amazon DocumentDB"
    technology: "Amazon DocumentDB"
    description: "NoSQL database for flexible catalog metadata."
  - type: "container"
    name: "Amazon ElastiCache"
    technology: "Amazon ElastiCache (Redis)"
    description: "Low-latency cache for fast recommendations."
  - type: "container"
    name: "AWS EventBridge / SQS"
    technology: "AWS EventBridge, Amazon SQS"
    description: "Handles asynchronous event-driven messaging across services."
  - type: "container"
    name: "AWS Secrets Manager and KMS"
    technology: "AWS Secrets Manager, AWS KMS"
    description: "Manages secrets, tokens, and AES-256 encryption."
relationships:
  - source: "Customer"
    destination: "Single Page Application"
    description: "Browses catalog, shops, and interacts with the store"
    technology: "HTTPS/TLS 1.3 via AWS CloudFront"
  - source: "Administrator"
    destination: "Single Page Application"
    description: "Administers catalog, orders, and moderation"
    technology: "HTTPS/TLS 1.3 via AWS CloudFront"
  - source: "Single Page Application"
    destination: "AWS API Gateway"
    description: "Sends REST and GraphQL requests"
    technology: "HTTPS/JSON REST/GraphQL"
  - source: "AWS API Gateway"
    destination: "Catalog Service"
    description: "Routes catalog requests"
    technology: "gRPC over mTLS (AWS ECS Service Connect)"
  - source: "AWS API Gateway"
    destination: "Order & Checkout Service"
    description: "Routes order and checkout requests"
    technology: "gRPC over mTLS (AWS ECS Service Connect)"
  - source: "AWS API Gateway"
    destination: "Recommendation Service"
    description: "Routes recommendation requests"
    technology: "gRPC over mTLS (AWS ECS Service Connect)"
  - source: "Catalog Service"
    destination: "Amazon DocumentDB"
    description: "Reads and writes catalog metadata"
    technology: "TCP/TLS"
  - source: "Order & Checkout Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists order and transaction data"
    technology: "TCP/TLS"
  - source: "Order & Checkout Service"
    destination: "Payment Gateway"
    description: "Executes tokenized payments"
    technology: "HTTPS APIs"
  - source: "Order & Checkout Service"
    destination: "Shipping Provider"
    description: "Manages fulfillment and tracking"
    technology: "HTTPS APIs"
  - source: "Recommendation Service"
    destination: "Amazon ElastiCache"
    description: "Fetches recommendation cache data"
    technology: "TCP/TLS"
  - source: "Catalog Service"
    destination: "AWS EventBridge / SQS"
    description: "Publishes asynchronous events"
    technology: "HTTPS"
  - source: "Order & Checkout Service"
    destination: "AWS EventBridge / SQS"
    description: "Publishes asynchronous events"
    technology: "HTTPS"
  - source: "Recommendation Service"
    destination: "AWS EventBridge / SQS"
    description: "Publishes asynchronous events"
    technology: "HTTPS"