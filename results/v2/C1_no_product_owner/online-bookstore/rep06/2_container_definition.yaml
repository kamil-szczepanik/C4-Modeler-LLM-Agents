level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Customer"
    description: "End-user browsing, purchasing, and reviewing physical and electronic books."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Third-party system processing secure tokenized transactions."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "Third-party systems calculating rates and fulfillment."
  - type: "container"
    name: "Single Page Application"
    technology: "React / TypeScript, AWS S3, CloudFront"
    description: "Frontend interface providing catalogue browsing, secure checkout, reviews, and recommendations."
  - type: "container"
    name: "API Gateway / ALB"
    technology: "AWS ALB / API Gateway"
    description: "Routes and manages incoming web and API traffic."
  - type: "container"
    name: "Catalog & Search"
    technology: "Amazon ECS Fargate, Amazon OpenSearch"
    description: "Handles catalogue management and search capabilities."
  - type: "container"
    name: "Order & Checkout"
    technology: "Amazon ECS Fargate, Amazon Aurora PostgreSQL, Amazon DynamoDB"
    description: "Manages orders, checkouts, carts, and sessions."
  - type: "container"
    name: "Engagement Service"
    technology: "Amazon ECS Fargate"
    description: "Handles reviews, recommendations, and customer engagement features."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL, AWS RDS Proxy"
    description: "Multi-region transactional database."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Database storing carts and sessions."
  - type: "container"
    name: "Amazon OpenSearch"
    technology: "Amazon OpenSearch"
    description: "Search engine for catalogue search."
  - type: "container"
    name: "Message Bus"
    technology: "Amazon SQS / SNS"
    description: "Handles asynchronous inter-service communication."
relationships:
  - source: "Customer"
    destination: "Single Page Application"
    description: "Browses catalogue and interacts with the application"
    technology: "HTTPS/TLS 1.3"
  - source: "Single Page Application"
    destination: "API Gateway / ALB"
    description: "Sends API requests"
    technology: "HTTPS/TLS 1.3"
  - source: "API Gateway / ALB"
    destination: "Catalog & Search"
    description: "Routes search and catalog requests"
    technology: "mTLS via AWS App Mesh / OAuth2.0/JWT"
  - source: "API Gateway / ALB"
    destination: "Order & Checkout"
    description: "Routes order and checkout requests"
    technology: "mTLS via AWS App Mesh / OAuth2.0/JWT"
  - source: "API Gateway / ALB"
    destination: "Engagement Service"
    description: "Routes engagement and review requests"
    technology: "mTLS via AWS App Mesh / OAuth2.0/JWT"
  - source: "Catalog & Search"
    destination: "Amazon OpenSearch"
    description: "Queries and indexes catalog data"
    technology: "TLS-encrypted TCP via AWS RDS Proxy"
  - source: "Order & Checkout"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes transactional order data"
    technology: "TLS-encrypted TCP via AWS RDS Proxy"
  - source: "Order & Checkout"
    destination: "Amazon DynamoDB"
    description: "Reads and writes cart and session data"
    technology: "TLS-encrypted TCP"
  - source: "Order & Checkout"
    destination: "Payment Gateway"
    description: "Processes secure payments"
    technology: "HTTPS/REST"
  - source: "Order & Checkout"
    destination: "Shipping Provider APIs"
    description: "Calculates shipping rates and fulfillment"
    technology: "HTTPS/REST"
  - source: "Catalog & Search"
    destination: "Message Bus"
    description: "Publishes and subscribes to asynchronous events"
    technology: "AMQP/HTTPS"
  - source: "Order & Checkout"
    destination: "Message Bus"
    description: "Publishes and subscribes to asynchronous events"
    technology: "AMQP/HTTPS"
  - source: "Engagement Service"
    destination: "Message Bus"
    description: "Publishes and subscribes to asynchronous events"
    technology: "AMQP/HTTPS"