level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "An Amazon-style e-commerce Online Bookstore system for browsing, purchasing, and reviewing physical and electronic books, built for global scale."
elements:
  - type: "person"
    name: "Customer"
    description: "End-user browsing, purchasing, and reviewing physical and electronic books."
  - type: "externalSystem"
    name: "AWS CloudFront + AWS WAF"
    description: "CDN and Edge Security providing edge caching and OWASP Top-10 security mitigations."
  - type: "externalSystem"
    name: "AWS Route 53"
    description: "DNS & Latency-Based Routing with health checks for automatic failover."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "AWS Cognito or Auth0 handling centralized authentication supporting MFA via OIDC."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe or PayPal processing secure tokenized transactions."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "FedEx or UPS calculating rates and fulfillment."
  - type: "externalSystem"
    name: "Email / Notification Service"
    description: "AWS SES or SendGrid dispatching transactional emails."
relationships:
  - source: "Customer"
    destination: "AWS CloudFront + AWS WAF"
    description: "Routes web requests"
    technology: "HTTPS"
  - source: "AWS Route 53"
    destination: "Online Bookstore"
    description: "Directs latency-based traffic across regions (us-east-1, eu-west-1, ap-southeast-1)"
    technology: "DNS"
  - source: "Online Bookstore"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OIDC/OAuth2/HTTPS"
  - source: "Online Bookstore"
    destination: "Payment Gateway"
    description: "Processes secure tokenized transactions"
    technology: "REST/TLS 1.3"
  - source: "Online Bookstore"
    destination: "Shipping Provider APIs"
    description: "Calculates rates and fulfillment"
    technology: "REST/TLS"
  - source: "Online Bookstore"
    destination: "Email / Notification Service"
    description: "Dispatches transactional emails"
    technology: "SMTP/REST"