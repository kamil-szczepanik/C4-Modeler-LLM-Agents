level: component
scope: "Component diagram for the Message Bus container"
parentContainer:
  name: "Message Bus"
elements:
  - type: "component"
    name: "Event Publisher"
    technology: "AWS SNS Topics"
    description: "Handles fan-out messaging and broadcast of domain events."
  - type: "component"
    name: "Event Queue"
    technology: "AWS SQS Queues"
    description: "Provides reliable, durable queuing with SQS Long Polling."
  - type: "component"
    name: "Schema Validator"
    technology: "Application-level validation"
    description: "Enforces JSON schema contracts before publishing."
  - type: "component"
    name: "Dead-Letter Queues"
    technology: "AWS SQS DLQ"
    description: "Isolates and stores failed messages."
  - type: "component"
    name: "Monitoring & Security Controls"
    technology: "AWS KMS, IAM least-privilege, AWS CloudWatch, AWS CloudTrail"
    description: "Secures and monitors message bus operations and compliance."
relationships:
  - source: "Schema Validator"
    destination: "Event Publisher"
    description: "Forwards validated domain events [AWS Internal]"
  - source: "Event Publisher"
    destination: "Event Queue"
    description: "Fans out messages [AWS Internal]"