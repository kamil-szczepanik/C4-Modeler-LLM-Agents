level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL container"
parentContainer:
  name: "Amazon Aurora PostgreSQL"
elements:
  - type: "component"
    name: "AWS RDS Proxy"
    technology: "AWS RDS Proxy"
    description: "Provides connection pooling and transaction management for database queries."
  - type: "component"
    name: "Primary Writer Instance"
    technology: "PostgreSQL Engine"
    description: "Handles write operations and transactional updates for the database."
  - type: "component"
    name: "Global Read Replicas"
    technology: "PostgreSQL Engine"
    description: "Serves read traffic across global regions to ensure low-latency performance."
  - type: "component"
    name: "Aurora Distributed Storage Volume"
    technology: "Amazon Aurora Storage"
    description: "Underlying distributed storage layer handling automated storage replication."
relationships:
  - source: "AWS RDS Proxy"
    destination: "Primary Writer Instance"
    description: "Routes connection-pooled write queries via TCP"
  - source: "Primary Writer Instance"
    destination: "Global Read Replicas"
    description: "Replicates data via storage-level replication log stream"