level: component
scope: "Component diagram for the Order & Checkout container"
parentContainer:
  name: "Order & Checkout"
elements:
  - type: "component"
    name: "Cart Manager"
    technology: "Spring Boot"
    description: "Manages ephemeral shopping cart and session state."
  - type: "component"
    name: "Checkout Orchestrator"
    technology: "Spring Boot"
    description: "Coordinates payment and fulfillment workflows."
  - type: "component"
    name: "Order Processor"
    technology: "Spring Boot"
    description: "Handles persistent order state and domain events."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "AWS DynamoDB"
    description: "Stores cart and session data."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL / AWS RDS Proxy"
    description: "Stores transactional order data via AWS RDS Proxy."
  - type: "component"
    name: "Payment Gateway & Shipping Provider APIs"
    technology: "HTTPS/REST"
    description: "External financial and logistics systems."
  - type: "component"
    name: "API Gateway / ALB"
    technology: "AWS Cloud Map"
    description: "Handles ingress requests via HTTPS."
  - type: "component"
    name: "Message Bus"
    technology: "AWS SQS/SNS"
    description: "Publishes asynchronous events."
relationships:
  - source: "API Gateway / ALB"
    destination: "Checkout Orchestrator"
    description: "Ingress requests via HTTPS / AWS Cloud Map"
  - source: "API Gateway / ALB"
    destination: "Cart Manager"
    description: "Ingress requests via HTTPS / AWS Cloud Map"
  - source: "Checkout Orchestrator"
    destination: "Cart Manager"
    description: "Cart item retrieval via gRPC (Protobuf over HTTP/2) with mTLS"
  - source: "Checkout Orchestrator"
    destination: "Payment Gateway & Shipping Provider APIs"
    description: "Processes payments and fulfillment via HTTPS/REST"
  - source: "Order Processor"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists order data via TLS-encrypted JDBC / AWS RDS Proxy"
  - source: "Cart Manager"
    destination: "Amazon DynamoDB"
    description: "Reads/writes cart state via AWS SDK (TLS)"
  - source: "Order Processor"
    destination: "Message Bus"
    description: "Publishes asynchronous events via AWS SQS/SNS"