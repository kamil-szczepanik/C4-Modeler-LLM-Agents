level: component
scope: "Component diagram for the API Gateway / ALB container"
parentContainer:
  name: "API Gateway / ALB"
elements:
  - type: "component"
    name: "Routing & SSL Termination Proxy"
    technology: "AWS ALB"
    description: "Sends incoming web/API traffic and passes raw requests."
  - type: "component"
    name: "API Authentication & Authorization Filter"
    technology: "AWS Lambda / API Gateway"
    description: "Validates JWT signatures."
  - type: "component"
    name: "Rate Limiting & Throttling Module"
    technology: "Amazon ElastiCache Redis"
    description: "Provides distributed rate limiting and throttling support."
  - type: "component"
    name: "Request Transformation & Masking Filter"
    technology: "Custom Filter"
    description: "Forwards sanitized payloads."
  - type: "component"
    name: "AWS WAF"
    technology: "AWS WAF with AWS Managed Rules"
    description: "Inspects and filters web traffic for OWASP Top-10 mitigations and bot protection."
relationships:
  - source: "Single Page Application"
    destination: "Routing & SSL Termination Proxy"
    description: "Sends incoming web/API traffic [HTTPS/TLS 1.3]"
  - source: "AWS WAF"
    destination: "Routing & SSL Termination Proxy"
    description: "Inspects and filters web traffic [HTTP/HTTPS]"
  - source: "API Authentication & Authorization Filter"
    destination: "Identity Provider"
    description: "Validates JWT signatures [HTTPS]"
  - source: "Routing & SSL Termination Proxy"
    destination: "Request Transformation & Masking Filter"
    description: "Passes raw requests [Internal HTTP/2]"
  - source: "Request Transformation & Masking Filter"
    destination: "Catalog & Search"
    description: "Forwards sanitized payloads [mTLS via AWS App Mesh]"
  - source: "Request Transformation & Masking Filter"
    destination: "Order & Checkout"
    description: "Forwards sanitized payloads [mTLS via AWS App Mesh]"
  - source: "Request Transformation & Masking Filter"
    destination: "Engagement Service"
    description: "Forwards sanitized payloads [mTLS via AWS App Mesh]"