level: component
scope: "Component diagram for the Amazon DynamoDB container"
parentContainer:
  name: "Amazon DynamoDB"
elements:
  - type: "component"
    name: "Request Router & Coordinator"
    technology: "AWS Distributed Request Router"
    description: "Routes and coordinates incoming low-latency cart and session operations."
  - type: "component"
    name: "Storage Node Engine"
    technology: "B-tree / LSM-tree on AWS Nitro"
    description: "Provides scalable, low-latency persistence for cart and session data."
  - type: "component"
    name: "Replication & Consensus Manager"
    technology: "AWS Multi-AZ Paxos Consensus"
    description: "Manages multi-region replication and consensus for high availability."
  - type: "component"
    name: "DynamoDB Streams Processor"
    technology: "DynamoDB Streams API"
    description: "Captures and processes change data events asynchronously."
  - type: "component"
    name: "AWS PrivateLink"
    technology: "VPC Endpoints"
    description: "Provides zero-trust network isolation preventing public internet exposure."
  - type: "component"
    name: "AWS KMS"
    technology: "Customer Managed Keys"
    description: "Handles encryption at rest and across global table replicas for compliance."
  - type: "component"
    name: "Order & Checkout"
    technology: "AWS SDK"
    description: "External caller container executing low-latency cart operations."
  - type: "component"
    name: "Message Bus"
    technology: "AWS SDK / HTTPS"
    description: "External messaging infrastructure receiving CDC events."
relationships:
  - source: "Order & Checkout"
    destination: "Request Router & Coordinator"
    description: "Executes low-latency cart operations via AWS SDK [HTTPS / TLS]"
  - source: "Order & Checkout"
    destination: "Request Router & Coordinator"
    description: "Connects via VPC Endpoints [AWS PrivateLink]"
  - source: "Request Router & Coordinator"
    destination: "DynamoDB Streams Processor"
    description: "Triggers change events [Internal AWS IPC / TCP]"
  - source: "DynamoDB Streams Processor"
    destination: "Message Bus"
    description: "Publishes CDC events [HTTPS / AWS SDK]"