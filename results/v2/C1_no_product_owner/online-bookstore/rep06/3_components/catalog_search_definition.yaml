level: component
scope: "Component diagram for the Catalog & Search container"
parentContainer:
  name: "Catalog & Search"
elements:
  - type: "component"
    name: "Catalog API Controller"
    technology: "Node.js / Express"
    description: "Handles incoming HTTP browsing and filtering requests."
  - type: "component"
    name: "Search Service Engine"
    technology: "Node.js / TypeScript"
    description: "Executes sanitized domain queries."
  - type: "component"
    name: "Caching Layer"
    technology: "Amazon ElastiCache / Redis"
    description: "Caches frequent queries and catalog metadata."
  - type: "component"
    name: "Catalog Synchronization Consumer"
    technology: "Node.js"
    description: "Processes asynchronous inventory and price updates."
  - type: "component"
    name: "Amazon OpenSearch"
    technology: "Managed Search Engine"
    description: "Indexes catalog data for search and fast filtering."
  - type: "component"
    name: "Amazon SQS / SNS"
    technology: "Message Bus"
    description: "Message bus for asynchronous event distribution."
relationships:
  - source: "Catalog API Controller"
    destination: "Caching Layer"
    description: "Internal Redis protocol via TCP"
  - source: "Caching Layer"
    destination: "Search Service Engine"
    description: "Fallback on cache miss via internal function calls"
  - source: "Catalog API Controller"
    destination: "Search Service Engine"
    description: "Internal function calls / gRPC"
  - source: "Search Service Engine"
    destination: "Amazon OpenSearch"
    description: "REST/HTTPS queries over TLS 1.3"
  - source: "Amazon SQS / SNS"
    destination: "Catalog Synchronization Consumer"
    description: "AMQP/HTTPS event consumption with payload signing (HMAC)"
  - source: "Catalog Synchronization Consumer"
    destination: "Caching Layer"
    description: "Redis pub/sub for event-driven cache invalidation"