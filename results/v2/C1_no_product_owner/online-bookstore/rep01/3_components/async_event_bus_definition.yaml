level: component
scope: "Component diagram for the Async Event Bus container"
parentContainer:
  name: "Async Event Bus"
elements:
  - type: "component"
    name: "Topic Router"
    technology: "AWS SNS"
    description: "Fan-out for domain events like OrderPlaced and InventoryUpdated."
  - type: "component"
    name: "Queue Dispatcher"
    technology: "AWS SQS"
    description: "Durable point-to-point buffering for consuming services."
  - type: "component"
    name: "Dead Letter Queue"
    technology: "AWS SQS DLQ"
    description: "Captures failed or poisoned messages after max retries."
  - type: "component"
    name: "Event Schema Registry"
    technology: "AWS EventBridge"
    description: "Validates and versions event JSON schemas."
  - type: "component"
    name: "Idempotency Store"
    technology: "Amazon ElastiCache Redis"
    description: "Handles deduplication for at-least-once delivery."
  - type: "component"
    name: "KMS"
    technology: "AWS KMS"
    description: "Provides encryption keys for data-at-rest protection."
relationships:
  - source: "Topic Router"
    destination: "Queue Dispatcher"
    description: "Forwards messages to subscribed queues [AWS SNS Subscription/JSON over HTTPS]"
  - source: "Topic Router"
    destination: "KMS"
    description: "Encrypts and decrypts payloads at rest [AWS KMS API]"