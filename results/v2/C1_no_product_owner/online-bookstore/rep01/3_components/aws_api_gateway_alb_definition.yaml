level: component
scope: "Component diagram for the AWS API Gateway & ALB container"
parentContainer:
  name: "AWS API Gateway & ALB"
elements:
  - type: "component"
    name: "Edge Router & WAF"
    technology: "AWS WAF & Application Load Balancer"
    description: "Handles edge security, traffic sanitization, and OWASP protections."
  - type: "component"
    name: "API Management & Routing"
    technology: "Amazon API Gateway"
    description: "Manages API routing and forwards sanitized traffic."
  - type: "component"
    name: "Request Transformation & Caching"
    technology: "AWS Lambda / API Gateway Caching"
    description: "Validates schemas and checks cache for API requests."
  - type: "component"
    name: "Service Mesh Proxy"
    technology: "AWS App Mesh (Envoy)"
    description: "Forwards backend calls securely using gRPC over mTLS."
relationships:
  - source: "Edge Router & WAF"
    destination: "API Management & Routing"
    description: "Forwards sanitized traffic [HTTPS]"
  - source: "API Management & Routing"
    destination: "Request Transformation & Caching"
    description: "Validates schemas and checks cache [Internal API]"
  - source: "Request Transformation & Caching"
    destination: "Service Mesh Proxy"
    description: "Forwards backend calls [gRPC over mTLS]"