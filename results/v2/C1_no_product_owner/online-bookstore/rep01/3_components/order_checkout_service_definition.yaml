level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Order API Controller"
    technology: "Node.js / TypeScript, gRPC"
    description: "Exposes gRPC endpoints for inbound requests."
  - type: "component"
    name: "Checkout Orchestrator"
    technology: "AWS Step Functions, Node.js / TypeScript"
    description: "Manages multi-step checkout sagas using AWS Step Functions."
  - type: "component"
    name: "Payment Client"
    technology: "Node.js / TypeScript, HTTPS"
    description: "Integrates securely with external Payment Gateways via HTTPS."
  - type: "component"
    name: "Fulfillment Adapter"
    technology: "Node.js / TypeScript, HTTPS"
    description: "Interfaces with third-party Shipping Provider APIs via HTTPS."
  - type: "component"
    name: "Order Repository"
    technology: "Prisma ORM, Node.js / TypeScript"
    description: "Handles transactional persistence using Prisma ORM."
  - type: "container"
    name: "AWS API Gateway & ALB"
    technology: "AWS"
    description: "External ingress and load balancing."
  - type: "container"
    name: "AWS Secrets Manager"
    technology: "AWS"
    description: "Stores and rotates API keys."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "PostgreSQL"
    description: "Multi-region relational data store persisting saga state and order data."
relationships:
  - source: "AWS API Gateway & ALB"
    destination: "Order API Controller"
    description: "Routes incoming requests via App Mesh sidecars [gRPC over mTLS]"
  - source: "Order API Controller"
    destination: "Checkout Orchestrator"
    description: "Delegates workflow execution [Internal method calls]"
  - source: "Checkout Orchestrator"
    destination: "Payment Client"
    description: "Executes external API calls [HTTPS/REST]"
  - source: "Checkout Orchestrator"
    destination: "Fulfillment Adapter"
    description: "Executes external API calls [HTTPS/REST]"
  - source: "Checkout Orchestrator"
    destination: "AWS Secrets Manager"
    description: "Fetches rotated API keys [AWS SDK/HTTPS]"
  - source: "Checkout Orchestrator"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists saga state [PostgreSQL Protocol via TLS]"
  - source: "Order Repository"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists order data [PostgreSQL Protocol via TLS]"