level: component
scope: "Component diagram for the Catalog Service container"
parentContainer:
  name: "Catalog Service"
elements:
  - type: "component"
    name: "API Controller"
    technology: "Go, net/http"
    description: "Validates inputs and routes gRPC/mTLS requests"
  - type: "component"
    name: "Catalog Manager"
    technology: "Go"
    description: "Handles core business logic for book metadata and inventory"
  - type: "component"
    name: "Search Indexer / Query Engine"
    technology: "Go"
    description: "Optimizes keyword search and indexing"
  - type: "component"
    name: "Cache Manager Component"
    technology: "Go"
    description: "Manages hot book details and search caching"
  - type: "component"
    name: "Data Access Repository"
    technology: "Go, pgx"
    description: "Executes persistence operations via pgx driver"
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Relational Database"
    description: "Stores persistent catalog data"
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "In-memory Data Store"
    description: "Caches catalog data and search results globally"
relationships:
  - source: "API Controller"
    destination: "Cache Manager Component"
    description: "Checks read-through cache [In-memory]"
  - source: "Cache Manager Component"
    destination: "Data Access Repository"
    description: "Fallback on cache miss [In-memory]"
  - source: "Catalog Manager"
    destination: "Search Indexer / Query Engine"
    description: "Queries search indexes [In-memory]"
  - source: "Data Access Repository"
    destination: "Amazon Aurora PostgreSQL"
    description: "SQL queries [PostgreSQL Protocol, TLS 1.3]"
  - source: "Catalog Service"
    destination: "Amazon ElastiCache (Redis)"
    description: "Reads/writes cached data [Redis Protocol, TLS]"