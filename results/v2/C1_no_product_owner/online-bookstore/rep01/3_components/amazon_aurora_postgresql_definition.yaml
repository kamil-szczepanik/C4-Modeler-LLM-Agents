level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL container"
parentContainer:
  name: "Amazon Aurora PostgreSQL"
elements:
  - type: "component"
    name: "AWS RDS Proxy"
    technology: "AWS RDS Proxy"
    description: "Connection pooling proxy managing database traffic from microservices."
  - type: "component"
    name: "Database Engine Instance - Writer"
    technology: "PostgreSQL 15+"
    description: "PostgreSQL instance handling transactional writes."
  - type: "component"
    name: "Database Engine Instance - Reader"
    technology: "PostgreSQL 15+"
    description: "PostgreSQL instance handling read-only queries."
  - type: "component"
    name: "Distributed Storage Volume"
    technology: "Amazon Aurora Storage"
    description: "Replicates 6 copies across 3 Availability Zones."
  - type: "component"
    name: "AWS Secrets Manager"
    technology: "AWS Secrets Manager"
    description: "Secret management system for credential handling."
  - type: "component"
    name: "Amazon CloudWatch"
    technology: "Amazon CloudWatch"
    description: "Monitoring tool for performance metrics and auto-scaling alarms."
relationships:
  - source: "Catalog Service"
    destination: "AWS RDS Proxy"
    description: "Sends read-only catalog queries [PostgreSQL Protocol over TCP/5432]"
  - source: "Order & Checkout Service"
    destination: "AWS RDS Proxy"
    description: "Sends ACID transaction queries [PostgreSQL Protocol over TCP/5432]"
  - source: "AWS RDS Proxy"
    destination: "Database Engine Instance - Writer"
    description: "Multiplexes pooled connections [PostgreSQL Protocol over TCP/5432]"
  - source: "AWS RDS Proxy"
    destination: "Database Engine Instance - Reader"
    description: "Multiplexes pooled connections [PostgreSQL Protocol over TCP/5432]"
  - source: "Database Engine Instance - Writer"
    destination: "Distributed Storage Volume"
    description: "Performs block-level log replication [AWS Proprietary Protocol]"