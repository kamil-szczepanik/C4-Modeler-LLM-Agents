level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "API Router"
    technology: "FastAPI"
    description: "Component handling incoming gRPC/HTTP routing."
  - type: "component"
    name: "Model Loader"
    technology: "AWS SDK"
    description: "Component fetching artifacts from AWS S3 using AWS SDK."
  - type: "component"
    name: "Recommendation Engine"
    technology: "NumPy, Pandas"
    description: "Core logic for collaborative filtering using NumPy and Pandas."
  - type: "component"
    name: "Cache & Persistence Repository"
    technology: "Amazon ElastiCache (Redis)"
    description: "Stores pre-computed recommendations."
  - type: "component"
    name: "Event Consumer"
    technology: "Python Background Worker, AWS SDK"
    description: "Background worker processing clickstream and purchase events from AWS SQS."
relationships:
  - source: "API Router"
    destination: "Cache & Persistence Repository"
    description: "Reads pre-computed lists [Redis Protocol over TLS]"
  - source: "Model Loader"
    destination: "Model Loader"
    description: "Fetches model artifacts [HTTPS / AWS SDK]"
  - source: "Event Consumer"
    destination: "Event Consumer"
    description: "Consumes user events [AWS SDK / HTTPS]"