level: component
scope: "Component diagram for the Amazon ElastiCache container"
parentContainer:
  name: "Amazon ElastiCache"
elements:
  - type: "component"
    name: "Cache Router / Cluster Manager"
    technology: "Redis Cluster"
    description: "Routes data across multi-AZ topology and manages Redis Shards."
  - type: "component"
    name: "In-Memory Recommendation Store"
    technology: "Redis Hash & Sorted Set"
    description: "Stores pre-computed collaborative filtering data and low-latency product recommendations."
  - type: "component"
    name: "Session & Token Cache"
    technology: "Redis String / Key-Value Store"
    description: "Manages transient shopping cart states, user sessions, and checkout locks."
relationships:
  - source: "Cache Router / Cluster Manager"
    destination: "In-Memory Recommendation Store"
    description: "Routes data across multi-AZ topology [Redis Protocol]"
  - source: "Cache Router / Cluster Manager"
    destination: "Session & Token Cache"
    description: "Routes data across multi-AZ topology [Redis Protocol]"