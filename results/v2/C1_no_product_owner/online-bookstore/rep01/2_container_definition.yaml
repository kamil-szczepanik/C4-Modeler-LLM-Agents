level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Customer & Admin Staff"
    description: "End-users and internal operators accessing the platform via Web/Mobile clients to browse, purchase, and manage books, reviews, and recommendations."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External Stripe/PayPal system for secure financial transactions."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "External FedEx/UPS systems for fulfillment and shipping label generation."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Auth0/AWS Cognito handling OAuth2/OIDC authentication and session management."
  - type: "container"
    name: "Single Page Application"
    technology: "React, TypeScript, AWS S3, CloudFront"
    description: "Provides the user interface for browsing books, managing cart, and viewing recommendations."
  - type: "container"
    name: "AWS API Gateway & ALB"
    technology: "AWS API Gateway, Application Load Balancer"
    description: "Routes and manages incoming HTTPS traffic from the frontend to core services."
  - type: "container"
    name: "Catalog Service"
    technology: "Go, AWS ECS Fargate"
    description: "Manages book inventory, details, and search capabilities."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Node.js, AWS ECS Fargate"
    description: "Processes customer orders, payments, and fulfillment workflows."
  - type: "container"
    name: "Recommendation Service"
    technology: "Python FastAPI, AWS ECS Fargate"
    description: "Generates personalized book recommendations for users."
  - type: "container"
    name: "Async Event Bus"
    technology: "AWS SQS, AWS SNS"
    description: "Handles decoupled asynchronous messaging between core microservices."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Relational database for storing core transactional and catalog data."
  - type: "container"
    name: "Amazon ElastiCache"
    technology: "Amazon ElastiCache (Redis)"
    description: "In-memory data store for low-latency recommendations and caching."
relationships:
  - source: "Customer & Admin Staff"
    destination: "Single Page Application"
    description: "Accesses the platform"
    technology: "HTTPS"
  - source: "Single Page Application"
    destination: "AWS API Gateway & ALB"
    description: "Sends API requests"
    technology: "HTTPS"
  - source: "AWS API Gateway & ALB"
    destination: "Catalog Service"
    description: "Routes requests via App Mesh sidecars"
    technology: "gRPC over mTLS"
  - source: "AWS API Gateway & ALB"
    destination: "Order & Checkout Service"
    description: "Routes requests via App Mesh sidecars"
    technology: "gRPC over mTLS"
  - source: "AWS API Gateway & ALB"
    destination: "Recommendation Service"
    description: "Routes requests via App Mesh sidecars"
    technology: "gRPC over mTLS"
  - source: "Order & Checkout Service"
    destination: "Payment Gateway"
    description: "Processes payments"
    technology: "HTTPS/REST"
  - source: "Order & Checkout Service"
    destination: "Shipping Provider APIs"
    description: "Initiates fulfillment"
    technology: "HTTPS/REST"
  - source: "Catalog Service"
    destination: "Async Event Bus"
    description: "Publishes and consumes events"
    technology: "AWS SDK/HTTPS"
  - source: "Order & Checkout Service"
    destination: "Async Event Bus"
    description: "Publishes and consumes events"
    technology: "AWS SDK/HTTPS"
  - source: "Recommendation Service"
    destination: "Async Event Bus"
    description: "Publishes and consumes events"
    technology: "AWS SDK/HTTPS"
  - source: "Catalog Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes catalog data"
    technology: "PostgreSQL Protocol"
  - source: "Order & Checkout Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes order data"
    technology: "PostgreSQL Protocol"
  - source: "Recommendation Service"
    destination: "Amazon ElastiCache"
    description: "Reads recommendation cache"
    technology: "Redis Protocol"