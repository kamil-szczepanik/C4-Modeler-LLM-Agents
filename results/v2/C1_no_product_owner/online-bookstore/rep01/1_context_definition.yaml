level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "An Amazon-style global e-commerce platform for physical and electronic books with recommendations and reviews, delivering high availability and multi-region scalability across AWS."
elements:
  - type: "person"
    name: "Customer & Admin Staff"
    description: "End-users and internal operators accessing the platform via Web/Mobile clients to browse, purchase, and manage books, reviews, and recommendations."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External Stripe/PayPal system for secure financial transactions."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "External FedEx/UPS systems for fulfillment and shipping label generation."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Auth0/AWS Cognito handling OAuth2/OIDC authentication and session management."
relationships:
  - source: "Customer & Admin Staff"
    destination: "Online Bookstore System"
    description: "Browses, purchases, and reviews books via web and mobile clients."
    technology: "HTTPS and TLS 1.3"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Processes secure transactions using idempotency keys."
    technology: "REST/JSON with mTLS"
  - source: "Online Bookstore System"
    destination: "Shipping Provider APIs"
    description: "Generates shipping labels and handles fulfillment asynchronously."
    technology: "AWS SQS and REST/JSON APIs"
  - source: "Online Bookstore System"
    destination: "Identity Provider"
    description: "Authenticates user sessions."
    technology: "OAuth2/OIDC over HTTPS"