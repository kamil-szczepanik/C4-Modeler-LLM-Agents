level: context
scope: "System Context diagram for New Insurance Platform"
system:
  name: "New Insurance Platform"
  description: "Modernizes a regional insurer's claims platform by gradually replacing a 30-year-old mainframe system with a cloud-native solution while maintaining hybrid operations."
elements:
  - type: "person"
    name: "Customers & Brokers"
    description: "External actors who submit online claims via the Web UI."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal actors who manage workflows using the platform."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "30-year-old COBOL/DB2 on-premises System of Record acting as the legacy backend."
  - type: "externalSystem"
    name: "Azure Active Directory"
    description: "Enforces single sign-on (SSO) and hybrid identity management."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service handling financial transactions via REST/HTTPS."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External service sending notifications via REST/HTTPS."
relationships:
  - source: "Customers & Brokers"
    destination: "New Insurance Platform"
    description: "Interact for online submissions"
    technology: "HTTPS / Web UI"
  - source: "Claims Adjusters"
    destination: "New Insurance Platform"
    description: "Interact for internal workflows"
    technology: "HTTPS"
  - source: "New Insurance Platform"
    destination: "Legacy Mainframe"
    description: "Integrates via asynchronous messaging through Integration Gateway"
    technology: "Asynchronous Messaging"
  - source: "New Insurance Platform"
    destination: "Azure Active Directory"
    description: "Authenticates users via OpenID Connect / OAuth 2.1"
    technology: "OpenID Connect / OAuth 2.1"
  - source: "New Insurance Platform"
    destination: "Payment Gateway"
    description: "Communicates for processing payments"
    technology: "REST/HTTPS APIs with mTLS"
  - source: "New Insurance Platform"
    destination: "Notification Service"
    description: "Communicates for sending notifications"
    technology: "REST/HTTPS APIs with mTLS"