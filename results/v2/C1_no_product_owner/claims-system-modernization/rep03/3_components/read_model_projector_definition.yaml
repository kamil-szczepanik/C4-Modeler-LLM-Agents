level: component
scope: "Component diagram for the Read Model Projector container"
parentContainer:
  name: "Read Model Projector"
elements:
  - type: "component"
    name: "Event Consumer Component"
    technology: "Azure Functions / .NET"
    description: "Pulls domain events with Checkpoint & Idempotency Filter."
  - type: "component"
    name: "Projection Handler Component"
    technology: ".NET Class Library"
    description: "Dispatches raw payloads and transforms read models."
  - type: "component"
    name: "Database Writer Component"
    technology: ".NET / Cosmos DB SDK"
    description: "Persists state and secures private connectivity."
  - type: "component"
    name: "Message Broker"
    technology: "IBM MQ"
    description: "Handles reliable enterprise messaging and event distribution."
  - type: "component"
    name: "Adjuster Read Database"
    technology: "Azure Cosmos DB"
    description: "Provides partitioned storage for adjuster screens."
relationships:
  - source: "Message Broker"
    destination: "Event Consumer Component"
    description: "Pulls domain events [AMQP / IBM MQ]"
  - source: "Event Consumer Component"
    destination: "Projection Handler Component"
    description: "Dispatches raw payloads [In-memory C# calls]"
  - source: "Projection Handler Component"
    destination: "Database Writer Component"
    description: "Sends transformed read models [In-memory C# calls]"
  - source: "Database Writer Component"
    destination: "Adjuster Read Database"
    description: "Persists state and secures private connectivity [HTTPS / Cosmos DB SDK over Private Endpoints]"