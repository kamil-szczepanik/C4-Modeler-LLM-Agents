level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Authentication Validator"
    technology: "Azure API Management Policy / OpenID Connect"
    description: "Validates JWT tokens against Azure Active Directory."
  - type: "component"
    name: "Dynamic Route Orchestrator"
    technology: "Azure API Management Routing"
    description: "Routes frontend traffic to appropriate downstream containers."
  - type: "component"
    name: "Rate Limiter & Circuit Breaker"
    technology: "Azure API Management Policy"
    description: "Protects the fragile legacy mainframe and downstream services by enforcing rate limits and circuit breaker patterns."
  - type: "component"
    name: "Claim-Type Feature Flag Evaluator"
    technology: "Azure API Management Policy"
    description: "Evaluates claim-type feature flags to determine if requests should go to modern or legacy systems."
relationships:
  - source: "Authentication Validator"
    destination: "Dynamic Route Orchestrator"
    description: "Enforces security before routing [HTTPS]"
  - source: "Dynamic Route Orchestrator"
    destination: "Rate Limiter & Circuit Breaker"
    description: "Checks limits and system health [HTTPS]"
  - source: "Dynamic Route Orchestrator"
    destination: "Claim-Type Feature Flag Evaluator"
    description: "Evaluates migration status for claims [HTTPS]"