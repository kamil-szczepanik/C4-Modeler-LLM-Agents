level: component
scope: "Component diagram for the Claims Core Container container"
parentContainer:
  name: "Claims Core Container"
elements:
  - type: "component"
    name: "Claim Intake Controller"
    technology: "ASP.NET Core API"
    description: "Receives claim data and handles API requests."
  - type: "component"
    name: "Claim Workflow Engine"
    technology: "MassTransit / .NET"
    description: "Orchestrates claim processing and routes messages."
  - type: "component"
    name: "Legacy Anti-Corruption Layer (ACL) Adapter"
    technology: "IBM MQ"
    description: "Adapts and communicates with the legacy on-premise mainframe."
  - type: "component"
    name: "Claim Domain Service"
    technology: "C# / Domain-Driven Design"
    description: "Implements domain logic for claims using DDD."
  - type: "component"
    name: "Data Storage"
    technology: "Azure SQL Database"
    description: "Provides persistent transactional storage."
relationships:
  - source: "Claim Intake Controller"
    destination: "Claim Workflow Engine"
    description: "Dispatches commands"
  - source: "Claim Workflow Engine"
    destination: "Legacy Anti-Corruption Layer (ACL) Adapter"
    description: "Delegates unmigrated types"
  - source: "Claim Workflow Engine"
    destination: "Message Broker"
    description: "Emits domain events"
  - source: "Claim Domain Service"
    destination: "Data Storage"
    description: "Reads/Writes domain state"