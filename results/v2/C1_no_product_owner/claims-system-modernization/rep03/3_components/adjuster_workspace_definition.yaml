level: component
scope: "Component diagram for the Adjuster Workspace container"
parentContainer:
  name: "Adjuster Workspace"
elements:
  - type: "component"
    name: "React SPA UI"
    technology: "React"
    description: "Responsive user interface for claims adjusters to manage workflows and interact with the system."
  - type: "component"
    name: "Authentication Client"
    technology: "OpenID Connect / OAuth 2.0 with PKCE"
    description: "Handles user authentication and security tokens via Azure Active Directory."
  - type: "component"
    name: "API Client"
    technology: "HTTPS/REST / TLS 1.3"
    description: "Routes state-changing intents and communicates with the API Gateway."
  - type: "component"
    name: "Optimized Read Store Client"
    technology: "HTTPS"
    description: "Queries cached projections directly using ephemeral resource tokens."
relationships:
  - source: "React SPA UI"
    destination: "Authentication Client"
    description: "Authenticates users [OpenID Connect / OAuth 2.0 with PKCE]"
  - source: "React SPA UI"
    destination: "API Client"
    description: "Routes state-changing intents [HTTPS/TLS 1.3]"
  - source: "Optimized Read Store Client"
    destination: "Azure Cosmos DB"
    description: "Queries cached projections directly using ephemeral resource tokens [HTTPS]"