level: component
scope: "Component diagram for the Customer Portal container"
parentContainer:
  name: "Customer Portal"
elements:
  - type: "component"
    name: "Customer Portal"
    technology: "React SPA / Azure Static Web Apps / CDN"
    description: "Provides a modern React-based web interface for customers and brokers to submit insurance claims online and serves static frontend assets."
  - type: "component"
    name: "Authentication Controller"
    technology: "TypeScript / MSAL.js"
    description: "Authenticates users and acquires tokens using Auth Code Flow + PKCE and in-memory token management."
  - type: "component"
    name: "Claim Submission Wizard"
    technology: "React Component / Formik"
    description: "Guides users through claim submissions and submits claim payloads."
  - type: "component"
    name: "Document Uploader Component"
    technology: "React"
    description: "Initiates file attachments and uploads binaries directly to storage."
  - type: "component"
    name: "API Client Service"
    technology: "Axios / Fetch"
    description: "Handles HTTP/REST communication for submitting claim payloads."
  - type: "component"
    name: "Azure Static Web Apps / CDN"
    technology: "Azure Static Web Apps / CDN"
    description: "Serves static frontend assets."
  - type: "component"
    name: "Azure Active Directory"
    technology: "Azure Active Directory"
    description: "Authenticates users and acquires tokens."
  - type: "component"
    name: "Azure Blob Storage"
    technology: "Azure Blob Storage"
    description: "Securely stores binary file attachments using pre-signed URLs."
relationships:
  - source: "Customers & Brokers"
    destination: "Customer Portal"
    description: "Interacts for online submissions [HTTPS/REST]"
  - source: "Authentication Controller"
    destination: "Azure Active Directory"
    description: "Authenticates users and acquires tokens [OpenID Connect / OAuth 2.0]"
  - source: "Claim Submission Wizard"
    destination: "API Client Service"
    description: "Submits claim payloads [HTTPS/REST]"
  - source: "Claim Submission Wizard"
    destination: "Document Uploader Component"
    description: "Initiates file attachments [HTTPS]"
  - source: "Document Uploader Component"
    destination: "Azure Blob Storage"
    description: "Uploads binaries directly [HTTPS/PUT via Pre-signed URLs]"
  - source: "Customer Portal"
    destination: "Azure Static Web Apps / CDN"
    description: "Serves static frontend assets [HTTPS]"