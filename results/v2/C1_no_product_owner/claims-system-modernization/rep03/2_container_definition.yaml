level: container
scope: "Container diagram for New Insurance Platform"
system:
  name: "New Insurance Platform"
elements:
  - type: "person"
    name: "Customers & Brokers"
    description: "External actors who submit online claims via the Web UI."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal actors who manage workflows using the platform."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "30-year-old COBOL/DB2 on-premises System of Record acting as the legacy backend."
  - type: "externalSystem"
    name: "Azure Active Directory"
    description: "Enforces single sign-on (SSO) and hybrid identity management."
  - type: "container"
    name: "Customer Portal"
    technology: "SPA React"
    description: "Frontend interface for online submissions by customers and brokers."
  - type: "container"
    name: "Adjuster Workspace"
    technology: "SPA React"
    description: "Frontend interface for fast adjuster workflows."
  - type: "container"
    name: "API Gateway"
    technology: "Azure API Management"
    description: "Secures and routes external traffic with OAuth 2.0 and RBAC."
  - type: "container"
    name: "Claims Core Container"
    technology: ".NET / Azure Container Apps"
    description: "Runs backend core services and handles business logic."
  - type: "container"
    name: "Read Model Projector"
    technology: "Azure Functions / .NET"
    description: "Executes asynchronous event projections for read storage."
  - type: "container"
    name: "Integration & ACL Container"
    technology: "Azure Functions"
    description: "Handles data translation and communicates with the legacy mainframe."
  - type: "container"
    name: "Adjuster Read Database"
    technology: "Azure Cosmos DB"
    description: "Provides low-latency CQRS read storage for sub-2s UI loads."
  - type: "container"
    name: "Message Broker"
    technology: "IBM MQ"
    description: "Manages asynchronous message exchange across the hybrid cloud-to-mainframe perimeter."
relationships:
  - source: "Customers & Brokers"
    destination: "Customer Portal"
    description: "Interacts for online submissions"
    technology: "HTTPS/REST"
  - source: "Claims Adjusters"
    destination: "Adjuster Workspace"
    description: "Interacts for internal workflows"
    technology: "HTTPS/REST"
  - source: "Customer Portal"
    destination: "Azure Active Directory"
    description: "Authenticates users"
    technology: "OpenID Connect / OAuth 2.0"
  - source: "Adjuster Workspace"
    destination: "Azure Active Directory"
    description: "Authenticates users"
    technology: "OpenID Connect / OAuth 2.0"
  - source: "Customer Portal"
    destination: "API Gateway"
    description: "Routes frontend traffic"
    technology: "HTTPS"
  - source: "Adjuster Workspace"
    destination: "API Gateway"
    description: "Routes frontend traffic"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Claims Core Container"
    description: "Forwards requests"
    technology: "HTTPS"
  - source: "Claims Core Container"
    destination: "Message Broker"
    description: "Publishes events"
    technology: "IBM MQ"
  - source: "Read Model Projector"
    destination: "Adjuster Read Database"
    description: "Updates read database via internal messaging"
    technology: "Internal Messaging"
  - source: "Integration & ACL Container"
    destination: "Legacy Mainframe"
    description: "Communicates with legacy system"
    technology: "IBM MQ with mTLS"