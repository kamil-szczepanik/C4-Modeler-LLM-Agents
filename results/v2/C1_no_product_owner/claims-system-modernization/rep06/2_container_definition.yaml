level: container
scope: "Container diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "End users who submit claims online and interact with the regional insurer."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff who manage and process claims workflows."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "30-year-old on-premises COBOL/DB2 system serving as the system of record."
  - type: "externalSystem"
    name: "Insurer's Active Directory"
    description: "Identity management system satisfying single sign-on and MFA requirements."
  - type: "externalSystem"
    name: "Core Payment Gateway"
    description: "External system used for processing insurance payments."
  - type: "container"
    name: "Web Portal (SPA)"
    technology: "React, TypeScript, Azure Static Web Apps"
    description: "Online claims submission interface for customers and brokers."
  - type: "container"
    name: "Adjuster Workspace"
    technology: "Node.js, React, Azure App Service"
    description: "Backend-for-Frontend (BFF) and user interface for claims adjusters."
  - type: "container"
    name: "Claims Core API"
    technology: "Spring Boot, Java, Azure Kubernetes Service (AKS)"
    description: "Microservices handling core domain logic for claims management."
  - type: "container"
    name: "Integration & Sync Engine"
    technology: "Azure Event Hubs (Kafka interface)"
    description: "Asynchronous integration engine with transactional outbox for reliable event streaming."
  - type: "container"
    name: "Identity & Access Proxy"
    technology: "Azure API Management, OAuth2, OIDC"
    description: "Centralized credentials and Zero-Trust access proxy federating with on-premise Active Directory."
  - type: "container"
    name: "Claims Read Model & Cache"
    technology: "Azure Cosmos DB (SQL API)"
    description: "Low-latency materialized views for sub-2 second reads."
  - type: "container"
    name: "Security & Infrastructure Services"
    technology: "Azure Key Vault, CSI secret store drivers, Azure Monitor, Azure ExpressRoute"
    description: "Provides secrets management, monitoring, and secure hybrid connectivity."
relationships:
  - source: "Customers and Brokers"
    destination: "Identity & Access Proxy"
    description: "Authenticates and submits claims via web portal"
    technology: "HTTPS/OIDC"
  - source: "Claims Adjusters"
    destination: "Identity & Access Proxy"
    description: "Authenticates and accesses adjuster workspace"
    technology: "HTTPS/OIDC"
  - source: "Identity & Access Proxy"
    destination: "Web Portal (SPA)"
    description: "Routes authenticated traffic to web portal"
    technology: "HTTPS"
  - source: "Identity & Access Proxy"
    destination: "Adjuster Workspace"
    description: "Routes authenticated traffic to adjuster workspace"
    technology: "HTTPS"
  - source: "Web Portal (SPA)"
    destination: "Claims Core API"
    description: "Submits online claims"
    technology: "gRPC/HTTPS"
  - source: "Adjuster Workspace"
    destination: "Claims Core API"
    description: "Processes claims and executes core logic"
    technology: "gRPC/HTTPS"
  - source: "Adjuster Workspace"
    destination: "Claims Read Model & Cache"
    description: "Queries claims read model and cache"
    technology: "HTTPS/SQL API"
  - source: "Claims Core API"
    destination: "Integration & Sync Engine"
    description: "Publishes claims events for synchronization"
    technology: "Kafka native protocol over mTLS"
  - source: "Integration & Sync Engine"
    destination: "Legacy Mainframe"
    description: "Syncs data to on-premise mainframe"
    technology: "Azure ExpressRoute"
  - source: "Identity & Access Proxy"
    destination: "Insurer's Active Directory"
    description: "Federates user identity and validates credentials"
    technology: "OIDC/OAuth2"