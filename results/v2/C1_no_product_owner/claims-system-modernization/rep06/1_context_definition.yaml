level: context
scope: "System Context diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
  description: "A hybrid cloud-native platform on Azure that modernizes a regional insurer's legacy mainframe claims system, enabling online claim submissions and adjuster workflows."
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "End users who submit claims online and interact with the regional insurer."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff who manage and process claims workflows."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "30-year-old on-premises COBOL/DB2 system serving as the system of record."
  - type: "externalSystem"
    name: "Insurer's Active Directory"
    description: "Identity management system satisfying single sign-on and MFA requirements."
  - type: "externalSystem"
    name: "Core Payment Gateway"
    description: "External system used for processing insurance payments."
relationships:
  - source: "Customers and Brokers"
    destination: "Modern Claims Platform"
    description: "Submits online claims and interacts with the platform"
    technology: "HTTPS (TLS 1.3)"
  - source: "Claims Adjusters"
    destination: "Modern Claims Platform"
    description: "Performs adjuster workflows and authentication"
    technology: "HTTPS (TLS 1.3) and OIDC/OAuth2 SSO"
  - source: "Modern Claims Platform"
    destination: "Insurer's Active Directory"
    description: "Authenticates users and validates credentials"
    technology: "OIDC/OAuth2"
  - source: "Modern Claims Platform"
    destination: "Core Payment Gateway"
    description: "Processes financial transactions and payments"
    technology: "REST/JSON over HTTPS"
  - source: "Modern Claims Platform"
    destination: "Legacy Mainframe"
    description: "Syncs claims data and bridges systems via Anti-Corruption Layer / Integration Gateway"
    technology: "Azure ExpressRoute, mTLS over HTTPS/AMQP, Azure Service Bus"