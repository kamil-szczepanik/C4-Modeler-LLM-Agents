level: component
scope: "Component diagram for the Integration & Sync Engine container"
parentContainer:
  name: "Integration & Sync Engine"
elements:
  - type: "component"
    name: "Outbox Event Dispatcher"
    technology: "Spring Boot"
    description: "Lightweight Spring Boot poller streaming database outbox events."
  - type: "component"
    name: "Mainframe Adapter Service"
    technology: "Apache Camel / Azure Functions"
    description: "Container translating events for the mainframe."
  - type: "component"
    name: "Reconciliation & Rollback Worker"
    technology: "Spring Batch"
    description: "Spring Batch worker ensuring dual-write parity and one-day fallback capability (R-06)."
  - type: "component"
    name: "Azure Event Hubs"
    technology: "Azure Event Hubs"
    description: "Managed event streaming broker with AMQP 1.0 and native capture capabilities."
  - type: "component"
    name: "Azure Key Vault"
    technology: "Azure Key Vault"
    description: "Secrets and certificate management storage integrated with managed identities."
  - type: "component"
    name: "Azure ExpressRoute"
    technology: "Azure ExpressRoute"
    description: "Dedicated hybrid network connection securing on-premise to cloud transit."
  - type: "component"
    name: "Azure Monitor"
    technology: "Azure Monitor"
    description: "Observability platform tracking consumer lag, DLQs, and immutable audit logs."
  - type: "component"
    name: "Claims Core API"
    technology: "JDBC"
    description: "External system component writing transactional sync state."
  - type: "component"
    name: "Legacy Mainframe"
    technology: "SFTP / Mainframe"
    description: "External legacy system receiving delta files and batch payloads."
relationships:
  - source: "Claims Core API"
    destination: "Outbox Event Dispatcher"
    description: "Writes transactional sync state [JDBC]"
  - source: "Outbox Event Dispatcher"
    destination: "Azure Event Hubs"
    description: "Publishes CDC events [AMQP 1.0 / HTTPS]"
  - source: "Mainframe Adapter Service"
    destination: "Azure Key Vault"
    description: "Retrieves SFTP/mTLS credentials [Managed Identity / REST]"
  - source: "Mainframe Adapter Service"
    destination: "Legacy Mainframe"
    description: "Pushes delta files and batch payloads [SFTP over Azure ExpressRoute with mTLS]"
  - source: "Integration & Sync Engine"
    destination: "Azure Monitor"
    description: "Streams operational metrics and audit logs [HTTPS / Azure Diagnostics]"