level: component
scope: "Component diagram for the Adjuster Workspace container"
parentContainer:
  name: "Adjuster Workspace"
elements:
  - type: "component"
    name: "Claims UI Router & View Controller"
    technology: "React, TypeScript"
    description: "Type-safe single-page application framework for UI components."
  - type: "component"
    name: "BFF Session & State Manager"
    technology: "Node.js, Express"
    description: "Lightweight backend runtime for BFF aggregation and fast I/O."
  - type: "component"
    name: "Claims Query Aggregator"
    technology: "Node.js"
    description: "Aggregates queries and performs parallel Cosmos DB reads."
  - type: "component"
    name: "Command Dispatcher"
    technology: "Node.js"
    description: "Dispatches commands to the core API."
  - type: "component"
    name: "Session Cache Client"
    technology: "Node.js ioredis"
    description: "Distributed session cache client ensuring stateless scaling."
  - type: "component"
    name: "Azure App Service"
    technology: "Azure App Service"
    description: "Managed PaaS hosting for containerized BFF deployment."
  - type: "component"
    name: "Azure Cache for Redis"
    technology: "Azure Cache for Redis"
    description: "Distributed session cache ensuring stateless scaling."
  - type: "component"
    name: "Azure Cosmos DB"
    technology: "Azure Cosmos DB (SQL API)"
    description: "NoSQL database for fast data retrieval."
  - type: "component"
    name: "Claims Core API"
    technology: "AKS"
    description: "Backend claims core API service."
  - type: "component"
    name: "Azure Key Vault"
    technology: "Azure Key Vault"
    description: "Secure secrets management via CSI secret store drivers."
relationships:
  - source: "Claims UI Router & View Controller"
    destination: "BFF Session & State Manager"
    description: "HTTPS"
  - source: "BFF Session & State Manager"
    destination: "Session Cache Client"
    description: "TCP/Redis Protocol with TLS"
  - source: "Claims Query Aggregator"
    destination: "Azure Cosmos DB"
    description: "HTTPS/SQL API"
  - source: "Command Dispatcher"
    destination: "Claims Core API"
    description: "gRPC with TLS 1.3"
  - source: "BFF Session & State Manager"
    destination: "Azure Key Vault"
    description: "HTTPS via CSI Secret Store Drivers"