level: component
scope: "Component diagram for the Claims Core API container"
parentContainer:
  name: "Claims Core API"
elements:
  - type: "component"
    name: "Claim Submission Controller"
    technology: "Spring gRPC / Spring Boot"
    description: "Handles incoming claim submission requests via gRPC and REST/HTTPS."
  - type: "component"
    name: "Claim Management Service"
    technology: "Spring Service / Domain Model"
    description: "Core domain service managing business logic and orchestrating workflow."
  - type: "component"
    name: "Mainframe Anti-Corruption Layer"
    technology: "Spring Integration / WebClient"
    description: "Isolates brittle legacy mainframe dependencies and handles external communication."
  - type: "component"
    name: "Event Publisher"
    technology: "Spring Kafka"
    description: "Publishes domain events to Kafka for downstream consumers."
  - type: "component"
    name: "Claim Read Model Updater"
    technology: "Spring Data Cosmos / Kafka Consumer"
    description: "Consumes Kafka events and updates the read model asynchronously."
  - type: "component"
    name: "Claims Read Model & Cache"
    technology: "Azure Cosmos DB"
    description: "External database providing low-latency read models and asynchronous caching."
  - type: "component"
    name: "Integration & Sync Engine"
    technology: "Kafka native protocol over mTLS"
    description: "External engine handling integration and synchronization."
relationships:
  - source: "Claim Submission Controller"
    destination: "Claim Management Service"
    description: "In-process Java Method Call"
  - source: "Claim Management Service"
    destination: "Mainframe Anti-Corruption Layer"
    description: "In-process Java Method Call"
  - source: "Claim Management Service"
    destination: "Event Publisher"
    description: "In-process Java Method Call"
  - source: "Claim Management Service"
    destination: "Claim Read Model Updater"
    description: "In-process Application Event"
  - source: "Claim Read Model Updater"
    destination: "Claims Read Model & Cache"
    description: "HTTPS/TCP"
  - source: "Event Publisher"
    destination: "Integration & Sync Engine"
    description: "Kafka native protocol over mTLS"