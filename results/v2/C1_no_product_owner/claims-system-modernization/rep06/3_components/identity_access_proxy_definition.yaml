level: component
scope: "Component diagram for the Identity & Access Proxy container"
parentContainer:
  name: "Identity & Access Proxy"
elements:
  - type: "component"
    name: "Token Validator Component"
    technology: "APIM Policy, OAuth2, OIDC"
    description: "Validates OIDC tokens and caches validation states."
  - type: "component"
    name: "Claims API Gateway Router"
    technology: "APIM Policies, Backend Pools"
    description: "Routes secured requests over container networks."
  - type: "component"
    name: "Rate Limiter & Throttling Policy"
    technology: "APIM Built-in Policy"
    description: "Enforces rate limiting and throttling policies."
  - type: "component"
    name: "Token Exchange & Claims Transformation Component"
    technology: "APIM Liquid Templates"
    description: "Passes verified identity context and transforms tokens."
relationships:
  - source: "Token Validator Component"
    destination: "Insurer's Active Directory"
    description: "Validates OIDC tokens and caches validation states [HTTPS/OIDC]"
  - source: "Token Validator Component"
    destination: "Token Exchange & Claims Transformation Component"
    description: "Passes verified identity context [Internal]"
  - source: "Token Exchange & Claims Transformation Component"
    destination: "Claims API Gateway Router"
    description: "Forwards requests with transformed internal JWTs [Internal]"
  - source: "Claims API Gateway Router"
    destination: "Claims Core API"
    description: "Routes secured requests over container networks [HTTPS/mTLS]"