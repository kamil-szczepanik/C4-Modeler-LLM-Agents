level: component
scope: "Component diagram for the API Gateway & BFF container"
parentContainer:
  name: "API Gateway & BFF"
elements:
  - type: "component"
    name: "YARP API Router"
    technology: "YARP (Yet Another Reverse Proxy)"
    description: "Manages cross-cutting routing, rate limiting, and JWT validation."
  - type: "component"
    name: "Claims BFF Service"
    technology: ".NET 8"
    description: "Provides high-throughput runtime performance for the BFF under strict latency constraints."
  - type: "component"
    name: "Routing Dispatcher Component"
    technology: ".NET 8 / Polly"
    description: "Orchestrates routing and implements circuit breakers and fallback handlers."
relationships:
  - source: "YARP API Router"
    destination: "Claims BFF Service"
    description: "Routes verified requests [In-process / gRPC]"
  - source: "Claims BFF Service"
    destination: "Routing Dispatcher Component"
    description: "Orchestrates routing [In-process]"