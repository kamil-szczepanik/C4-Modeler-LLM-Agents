level: component
scope: "Component diagram for the New Claims Database container"
parentContainer:
  name: "New Claims Database"
elements:
  - type: "component"
    name: "Claims Schema"
    technology: "Relational Tables with Temporal Tables"
    description: "Stores relational claims data with temporal table capabilities."
  - type: "component"
    name: "Outbox Schema"
    technology: "Outbox Pattern Tables"
    description: "Implements the Outbox pattern for reliable message dispatch."
  - type: "component"
    name: "Sync Tracking Schema"
    technology: "Relational Tables"
    description: "Tracks and reconciles migrated records using SQL bulk operations."
  - type: "component"
    name: "Read Model Projections"
    technology: "Dedicated Projection Tables"
    description: "Provides dedicated tables for optimized read model projections."
  - type: "component"
    name: "Azure SQL Database"
    technology: "Serverless compute tier with Geo-Replication, TDE, and Always Encrypted"
    description: "Provides managed relational storage supporting the database schemas."
relationships:
  - source: "API Gateway & BFF"
    destination: "Claims Schema"
    description: "Queries and mutates data via ADO.NET and Entity Framework Core (TCP/1433 with TLS 1.2 and Azure AD authentication)"
  - source: "Integration & Anti-Corruption Layer"
    destination: "Sync Tracking Schema"
    description: "Reconciles migrated records using SQL bulk operations"
  - source: "Outbox Schema"
    destination: "Azure Service Bus"
    description: "Drained by Azure Functions via managed identity polling"