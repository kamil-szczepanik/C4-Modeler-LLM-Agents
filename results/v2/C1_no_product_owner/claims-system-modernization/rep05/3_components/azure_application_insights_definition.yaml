level: component
scope: "Component diagram for the Azure Application Insights container"
parentContainer:
  name: "Azure Application Insights"
elements:
  - type: "component"
    name: "Telemetry Ingestion Engine"
    technology: "Azure Application Insights"
    description: "Ingests telemetry and distributed traces via OpenTelemetry."
  - type: "component"
    name: "Log Analytics Workspace Storage"
    technology: "Azure Log Analytics"
    description: "Stores telemetry data and supports rapid querying using KQL."
  - type: "component"
    name: "Application Map Generator"
    technology: "Azure Application Insights"
    description: "Generates application maps from ingested telemetry streams."
  - type: "component"
    name: "Live Metrics Stream"
    technology: "Azure Application Insights"
    description: "Provides in-memory telemetry broadcast for live metrics."
  - type: "component"
    name: "Availability and Alerting Sub-component"
    technology: "Azure Monitor Alerts"
    description: "Handles synthetic monitoring and alerting via KQL queries."
  - type: "component"
    name: "Diagnostic Export & Archive Sub-component"
    technology: "Azure Blob Storage, Azure Key Vault"
    description: "Manages long-term telemetry archiving with Customer-Managed Keys."
relationships:
  - source: "Telemetry Ingestion Engine"
    destination: "Log Analytics Workspace Storage"
    description: "Sends telemetry data [Internal Azure Storage Protocol]"
  - source: "Telemetry Ingestion Engine"
    destination: "Application Map Generator"
    description: "Feeds telemetry streams [Internal Stream Processing]"
  - source: "Telemetry Ingestion Engine"
    destination: "Live Metrics Stream"
    description: "Broadcasts metrics [In-Memory Telemetry Broadcast]"
  - source: "Availability and Alerting Sub-component"
    destination: "Log Analytics Workspace Storage"
    description: "Queries log data [KQL Queries]"
  - source: "Log Analytics Workspace Storage"
    destination: "Diagnostic Export & Archive Sub-component"
    description: "Exports diagnostic data [Azure Storage SDK]"