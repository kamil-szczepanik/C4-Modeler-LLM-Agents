    name: "Auth & RBAC Routing Component"
    technology: "React Router & Azure Static Web Apps"
    description: "Validates session state and fetches permissions via HTTPS/JSON."
  - type: "component"
    name: "Telemetry & Security"
    technology: "Azure Application Insights Browser SDK"
    description: "Enables Real User Monitoring (RUM) and error tracking."
relationships:
  - source: "Claims Web Application"
    destination: "API Gateway & BFF"
    description: "Communicates via HTTPS/JSON"
  - source: "Claims Web Application"
    destination: "Azure Application Insights"
    description: "Forwards telemetry via OpenTelemetry headers"
  - source: "Auth & RBAC Routing Component"
    destination: "API Gateway & BFF"
    description: "Validates session state and fetches permissions via HTTPS/JSON"