level: component
scope: "Component diagram for the Integration & Anti-Corruption Layer container"
parentContainer:
  name: "Integration & Anti-Corruption Layer"
elements:
  - type: "component"
    name: "Claim Translation Component"
    technology: ".NET 8 Azure Function"
    description: "Translates modern claim payloads and coordinates routing via the routing registry."
  - type: "component"
    name: "Mainframe Adapter"
    technology: ".NET 8 Azure Function with Polly"
    description: "Adapts messages for the legacy mainframe, handling latency and faults using Polly retry policies and circuit-breakers."
  - type: "component"
    name: "Sync & Reconciliation Router"
    technology: "Azure Service Bus & Event Grid"
    description: "Manages asynchronous messaging, event routing, and dead-letter queues to guarantee consistency."
  - type: "component"
    name: "Routing Registry Component"
    technology: "Azure App Configuration"
    description: "Provides dynamic feature flags for one-day claim-type rollbacks."
  - type: "component"
    name: "Legacy Mainframe"
    technology: "On-premise COBOL/DB2 system of record"
    description: "The underlying legacy system of record for claims."
  - type: "component"
    name: "API Gateway & BFF"
    technology: "API Gateway / BFF"
    description: "Entry point for client requests interacting with the migration platform."
relationships:
  - source: "API Gateway & BFF"
    destination: "Claim Translation Component"
    description: "mTLS and HTTPS/JSON"
  - source: "Claim Translation Component"
    destination: "Sync & Reconciliation Router"
    description: "AMQP"
  - source: "Sync & Reconciliation Router"
    destination: "Mainframe Adapter"
    description: "AMQP"
  - source: "Mainframe Adapter"
    destination: "Legacy Mainframe"
    description: "HTTPS over Secure VPN/ExpressRoute"
  - source: "Claim Translation Component"
    destination: "Routing Registry Component"
    description: "REST/HTTPS"