level: context
scope: "System Context diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization"
  description: "Gradually replaces a legacy 30-year-old mainframe claims platform with a modern, cloud-native hybrid architecture to enable online claim submissions and adjuster workflows while maintaining seamless integration with the on-premise system of record."
elements:
  - type: "person"
    name: "Customers"
    description: "End users who submit online claims."
  - type: "person"
    name: "Brokers"
    description: "Intermediaries who submit and manage online claims on behalf of customers."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff who handle claims workflows."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise legacy system of record (COBOL/DB2)."
  - type: "externalSystem"
    name: "Active Directory"
    description: "On-premise identity provider for authentication."
relationships:
  - source: "Customers"
    destination: "Insurance Claims Modernization"
    description: "Submit online claims"
    technology: "HTTPS"
  - source: "Brokers"
    destination: "Insurance Claims Modernization"
    description: "Submit online claims"
    technology: "HTTPS"
  - source: "Claims Adjusters"
    destination: "Insurance Claims Modernization"
    description: "Perform claims handling workflows"
    technology: "HTTPS"
  - source: "Insurance Claims Modernization"
    destination: "Active Directory"
    description: "Authenticate users for Single Sign-On (SSO) and MFA"
    technology: "OIDC/SAML over HTTPS"
  - source: "Insurance Claims Modernization"
    destination: "Legacy Mainframe"
    description: "Sync claims data and route messages"
    technology: "Asynchronous messaging/ETL via Azure API Management over secure VPN/ExpressRoute with mTLS"
  - source: "Legacy Mainframe"
    destination: "Insurance Claims Modernization"
    description: "Provide system of record data"
    technology: "Asynchronous messaging/ETL via Azure API Management over secure VPN/ExpressRoute with mTLS"