level: container
scope: "Container diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization"
elements:
  - type: "person"
    name: "Customers"
    description: "External users who submit online claims."
  - type: "person"
    name: "Brokers"
    description: "External users who submit and manage claims on behalf of customers."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users who handle claims workflows."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise legacy system of record (COBOL/DB2)."
  - type: "externalSystem"
    name: "Active Directory"
    description: "Identity Provider for authentication."
  - type: "container"
    name: "Claims Web Application"
    technology: "Azure Static Web Apps / React"
    description: "Hosts the React-based frontend for fast UI delivery."
  - type: "container"
    name: "API Gateway & BFF"
    technology: "Azure Container Apps / Node.js or .NET"
    description: "Hosts containerized services providing KEDA scaling and API coordination."
  - type: "container"
    name: "Integration & Anti-Corruption Layer"
    technology: "Azure Functions & Service Bus"
    description: "Powers the Anti-Corruption Layer with dead-letter queues and circuit-breakers."
  - type: "container"
    name: "New Claims Database"
    technology: "Azure SQL Database"
    description: "Stores migrated claim types with Transparent Data Encryption."
  - type: "container"
    name: "Azure Application Insights"
    technology: "Azure Application Insights"
    description: "Provides centralized distributed tracing and observability via OpenTelemetry."
  - type: "container"
    name: "Azure Key Vault"
    technology: "Azure Key Vault"
    description: "Manages runtime secrets using managed identities."
relationships:
  - source: "Customers"
    destination: "Claims Web Application"
    description: "Interacts with claims web application via HTTPS/JSON"
    technology: "HTTPS/JSON"
  - source: "Brokers"
    destination: "Claims Web Application"
    description: "Interacts with claims web application via HTTPS/JSON"
    technology: "HTTPS/JSON"
  - source: "Claims Adjusters"
    destination: "Claims Web Application"
    description: "Interacts with claims web application via HTTPS/JSON"
    technology: "HTTPS/JSON"
  - source: "Claims Web Application"
    destination: "API Gateway & BFF"
    description: "Communicates with API Gateway & BFF via HTTPS/JSON"
    technology: "HTTPS/JSON"
  - source: "API Gateway & BFF"
    destination: "Active Directory"
    description: "Authenticates users via Azure Active Directory"
    technology: "OpenID Connect/OAuth2"
  - source: "API Gateway & BFF"
    destination: "Integration & Anti-Corruption Layer"
    description: "Communicates with Integration & ACL"
    technology: "mTLS and HTTPS/JSON"
  - source: "API Gateway & BFF"
    destination: "New Claims Database"
    description: "Communicates with New Claims Database"
    technology: "mTLS and HTTPS/JSON"
  - source: "Integration & Anti-Corruption Layer"
    destination: "Legacy Mainframe"
    description: "Connects to Legacy Mainframe via secure VPN/ExpressRoute"
    technology: "Secure VPN/ExpressRoute with on-premise API Security Gateway"
  - source: "Claims Web Application"
    destination: "Azure Application Insights"
    description: "Forwards telemetry"
    technology: "OpenTelemetry headers"
  - source: "API Gateway & BFF"
    destination: "Azure Application Insights"
    description: "Forwards telemetry"
    technology: "OpenTelemetry headers"
  - source: "Integration & Anti-Corruption Layer"
    destination: "Azure Application Insights"
    description: "Forwards telemetry"
    technology: "OpenTelemetry headers"
  - source: "API Gateway & BFF"
    destination: "Azure Key Vault"
    description: "Manages runtime secrets"
    technology: "Managed Identities"