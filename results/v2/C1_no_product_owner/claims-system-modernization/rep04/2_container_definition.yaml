level: container
scope: "Container diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization"
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "External users submitting online claims and interacting with the platform."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users reviewing and processing adjuster workflows."
  - type: "externalSystem"
    name: "Insurer's Active Directory / Microsoft Entra ID"
    description: "Enterprise identity provider for single sign-on and authentication."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premises COBOL/DB2 system acting as the legacy system of record."
  - type: "container"
    name: "Customer Portal"
    technology: "React SPA on Azure Static Web Apps"
    description: "Hosts the React single-page application for customers."
  - type: "container"
    name: "Adjuster Workspace"
    technology: "React SPA on Azure Static Web Apps"
    description: "Hosts the React single-page application for adjusters."
  - type: "container"
    name: "Claims API Gateway"
    technology: "Azure API Management"
    description: "Provides centralized routing, security enforcement, and token validation."
  - type: "container"
    name: "Claims BFF"
    technology: "Node.js/Express on Azure App Service"
    description: "Backend-for-frontend service supporting the client applications."
  - type: "container"
    name: "Claims Core Service"
    technology: "Java/Spring Boot on Azure App Service"
    description: "Core business logic processing service for migrated claim types."
  - type: "container"
    name: "Mainframe Integration Adapter"
    technology: "Azure App Service Worker"
    description: "Adapts and bridges traffic to the legacy mainframe."
  - type: "container"
    name: "Message Broker"
    technology: "Azure Service Bus"
    description: "Handles reliable, transactional asynchronous messaging between cloud and mainframe."
  - type: "container"
    name: "Database"
    technology: "Azure SQL Database"
    description: "Provides relational storage with AES-256 encryption-at-rest for migrated claim types."
relationships:
  - source: "Customers and Brokers"
    destination: "Customer Portal"
    description: "Interacts with and uses"
    technology: "HTTPS"
  - source: "Claims Adjusters"
    destination: "Adjuster Workspace"
    description: "Interacts with and uses"
    technology: "HTTPS"
  - source: "Customer Portal"
    destination: "Claims API Gateway"
    description: "Sends requests to"
    technology: "HTTPS/REST"
  - source: "Adjuster Workspace"
    destination: "Claims BFF"
    description: "Sends requests to"
    technology: "HTTPS/REST"
  - source: "Claims API Gateway"
    destination: "Claims BFF"
    description: "Routes requests to"
    technology: "HTTPS/OIDC/OAuth2"
  - source: "Claims API Gateway"
    destination: "Claims Core Service"
    description: "Routes requests to"
    technology: "HTTPS/OIDC/OAuth2"
  - source: "Claims BFF"
    destination: "Database"
    description: "Reads and writes data"
    technology: "TDS/Managed Identities"
  - source: "Claims Core Service"
    destination: "Database"
    description: "Reads and writes data"
    technology: "TDS/Managed Identities"
  - source: "Mainframe Integration Adapter"
    destination: "Legacy Mainframe"
    description: "Integrates with legacy system of record"
    technology: "Site-to-Site VPN/ExpressRoute with mTLS"
  - source: "Claims Core Service"
    destination: "Message Broker"
    description: "Sends and receives asynchronous messages"
    technology: "AMQP/Managed Identities"
  - source: "Mainframe Integration Adapter"
    destination: "Message Broker"
    description: "Sends and receives asynchronous messages"
    technology: "AMQP/Managed Identities"