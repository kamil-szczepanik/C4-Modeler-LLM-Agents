level: context
scope: "System Context diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization"
  description: "A modern cloud-native platform in Azure West Europe gradually replacing a 30-year-old on-premises mainframe claims system using a hybrid architecture."
elements:
  - type: "person"
    name: "Customers"
    description: "External users submitting online claims."
  - type: "person"
    name: "Brokers"
    description: "External users assisting with claim submissions and management."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users reviewing and processing adjuster workflows."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premises COBOL/DB2 system acting as the system of record."
  - type: "externalSystem"
    name: "Insurer’s Active Directory"
    description: "Enterprise identity provider for single sign-on."
relationships:
  - source: "Customers"
    destination: "Insurance Claims Modernization"
    description: "Submits online claims and interacts with the platform"
    technology: "HTTPS (Web/API)"
  - source: "Brokers"
    destination: "Insurance Claims Modernization"
    description: "Submits online claims and interacts with the platform"
    technology: "HTTPS (Web/API)"
  - source: "Claims Adjusters"
    destination: "Insurance Claims Modernization"
    description: "Performs adjuster workflows and authenticates"
    technology: "HTTPS (Web/API with OAuth2/OIDC)"
  - source: "Insurance Claims Modernization"
    destination: "Legacy Mainframe"
    description: "Bridges traffic and syncs claims data via gateway"
    technology: "IBM MQ over ExpressRoute with mTLS"
  - source: "Insurance Claims Modernization"
    destination: "Insurer’s Active Directory"
    description: "Authenticates users for single sign-on"
    technology: "OIDC / OAuth2"