level: component
scope: "Component diagram for the Adjuster Workspace container"
parentContainer:
  name: "Adjuster Workspace"
elements:
  - type: "component"
    name: "Authentication Component"
    technology: "MSAL.js"
    description: "Implements OIDC/OAuth2 authentication with secure in-memory token storage."
  - type: "component"
    name: "Claim Management Module"
    technology: "React Router & Form Libraries"
    description: "Manages claims processing views and form interactions."
  - type: "component"
    name: "Local State & Caching Component"
    technology: "TanStack Query"
    description: "Manages server-state caching and volatile in-memory data persistence."
  - type: "component"
    name: "API Client"
    technology: "Axios"
    description: "Sends REST requests to the backend."
relationships:
  - source: "Claims Adjusters"
    destination: "Authentication Component"
    description: "Authenticates via [HTTPS/OIDC]"
  - source: "Authentication Component"
    destination: "Insurer’s Active Directory"
    description: "Validates credentials via [HTTPS]"
  - source: "Claim Management Module"
    destination: "Local State & Caching Component"
    description: "Reads/writes cached claim data via [In-Memory]"
  - source: "Local State & Caching Component"
    destination: "API Client"
    description: "Requests fresh data on cache miss via [Async/Await]"
  - source: "API Client"
    destination: "Claims BFF"
    description: "Sends REST requests via [HTTPS/REST]"