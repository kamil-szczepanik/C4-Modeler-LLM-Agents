level: component
scope: "Component diagram for the Claims BFF container"
parentContainer:
  name: "Claims BFF"
elements:
  - type: "component"
    name: "Routing & Auth Controller"
    technology: "TypeScript / Node.js"
    description: "Handles incoming requests, routing, and authentication."
  - type: "component"
    name: "Claim Aggregator Service"
    technology: "TypeScript / Node.js"
    description: "Aggregates claim data and coordinates service workflows."
  - type: "component"
    name: "UI Adaptation Layer"
    technology: "TypeScript / Node.js"
    description: "Adapts data structures for UI consumption."
  - type: "component"
    name: "Feature Flag & Routing Dispatcher"
    technology: "TypeScript / Node.js"
    description: "Evaluates feature flags and dispatches requests to modern or legacy core services."
relationships:
  - source: "Routing & Auth Controller"
    destination: "Claim Aggregator Service"
    description: "Invokes [In-memory]"
  - source: "Claim Aggregator Service"
    destination: "Feature Flag & Routing Dispatcher"
    description: "Evaluates [In-memory]"