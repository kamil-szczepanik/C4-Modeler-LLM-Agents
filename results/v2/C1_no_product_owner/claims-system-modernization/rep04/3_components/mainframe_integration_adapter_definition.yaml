level: component
scope: "Component diagram for the Mainframe Integration Adapter container"
parentContainer:
  name: "Mainframe Integration Adapter"
elements:
  - type: "component"
    name: "COBOL Gateway Client"
    technology: "Java/Spring Integration TCP/IP adapter"
    description: "Connects securely to the legacy mainframe and retrieves credentials from Azure Key Vault."
  - type: "component"
    name: "Message Translator"
    technology: "Apache Camel"
    description: "Translates and routes messages for the integration adapter."
  - type: "component"
    name: "Resilience & Queue Manager"
    technology: "Resilience4j"
    description: "Manages resilience, strict retry policies, dead-lettering, and deduplication."
  - type: "component"
    name: "Azure App Service Worker"
    technology: "Hosting infrastructure"
    description: "Hosts the application infrastructure."
  - type: "component"
    name: "Azure Service Bus"
    technology: "Message Broker"
    description: "Provides asynchronous buffering to mitigate mainframe latency."
  - type: "component"
    name: "Legacy Mainframe"
    technology: "COBOL/DB2 System of Record"
    description: "The legacy system of record."
relationships:
  - source: "Claims Core Service"
    destination: "Message Translator"
    description: "Inbound commands via Azure Service Bus / AMQP"
  - source: "COBOL Gateway Client"
    destination: "Legacy Mainframe"
    description: "Socket communication via TCP/IP over Site-to-Site VPN with mTLS"
  - source: "Message Translator"
    destination: "Azure Monitor"
    description: "Audit logging via HTTPS/TLS"
  - source: "COBOL Gateway Client"
    destination: "Azure Key Vault"
    description: "Credential retrieval via Managed Identities / REST API"