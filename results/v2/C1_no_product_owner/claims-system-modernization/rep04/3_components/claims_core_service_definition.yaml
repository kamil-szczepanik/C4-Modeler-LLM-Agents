  - source: "Integration Router"
    destination: "Claim State Cache"
    description: "Redis / TCP"
  - source: "Claim Processing Engine"
    destination: "Claim State Cache"
    description: "Redis / TCP"
  - source: "Claim Processing Engine"
    destination: "Database"
    description: "JDBC / TDS / Managed Identities"
  - source: "Asynchronous Event Handler"
    destination: "Message Broker"
    description: "AMQP / Managed Identities"