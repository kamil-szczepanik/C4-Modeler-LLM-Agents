level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "MigratedClaims Schema"
    technology: "Azure SQL Database"
    description: "Stores incrementally migrated claims data from the legacy system."
  - type: "component"
    name: "SyncBuffer Schema"
    technology: "Azure SQL Database"
    description: "Buffers synchronization data between the cloud platform and the mainframe."
  - type: "component"
    name: "AuditLog Schema"
    technology: "Azure SQL Database"
    description: "Maintains immutable audit logs for security and compliance."
relationships:
  - source: "Claims Core Service"
    destination: "MigratedClaims Schema"
    description: "Reads and writes claim data via TDS and Azure Managed Identity"
  - source: "Mainframe Integration Adapter"
    destination: "SyncBuffer Schema"
    description: "Synchronizes records via TDS and Azure Managed Identity"
  - source: "Claims Core Service"
    destination: "AuditLog Schema"
    description: "Writes audit logs via TDS and Azure Managed Identity"