level: component
scope: "Component diagram for the Customer Portal container"
parentContainer:
  name: "Customer Portal"
elements:
  - type: "component"
    name: "Customer / Broker"
    technology: "Human / External Actor"
    description: "End users including customers and brokers who interact with the system."
  - type: "component"
    name: "Authentication Component"
    technology: "MSAL.js with PKCE and Azure Active Directory / Entra ID"
    description: "Handles user authentication using Authorization Code Flow with PKCE and in-memory token storage."
  - type: "component"
    name: "Claim Submission Module"
    technology: "React multi-step form"
    description: "Multi-step React form for online claims (R-01)."
  - type: "component"
    name: "Claim Status Tracker"
    technology: "React BFF integration"
    description: "Real-time status display via BFF."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios"
    description: "Axios-based communication module."
  - type: "component"
    name: "Telemetry Component"
    technology: "Azure Application Insights React plugin"
    description: "Telemetry and error tracking tool with custom PII scrubbing interceptors."
  - type: "component"
    name: "State & Routing Core"
    technology: "React Router"
    description: "React Router for protected route guarding and navigation coordination."
  - type: "component"
    name: "Error Boundaries"
    technology: "React Error Boundary"
    description: "Top-level React crash fallback handlers."
  - type: "component"
    name: "Claims API Gateway"
    technology: "Azure API Management & App Service"
    description: "Backend integration tier supporting legacy migration constraints."
  - type: "component"
    name: "Azure Monitor / Application Insights"
    technology: "Azure Cloud Service"
    description: "Receives sanitized traces and telemetry."
relationships:
  - source: "Customer / Broker"
    destination: "Authentication Component"
    description: "Authenticates via [HTTPS]"
  - source: "State & Routing Core"
    destination: "Claim Submission Module"
    description: "Coordinates navigation via [Internal React Context]"
  - source: "API Client Layer"
    destination: "Claims API Gateway"
    description: "Sends REST payloads via [HTTPS/REST]"
  - source: "Telemetry Component"
    destination: "Azure Monitor / Application Insights"
    description: "Streams sanitized traces via [HTTPS]"