level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Claim Event Topic"
    technology: "Azure Service Bus Topic"
    description: "Pub-sub distribution of domain events for migrated claim types."
  - type: "component"
    name: "Mainframe Outbox Queue"
    technology: "Azure Service Bus Queue with Sessions"
    description: "Handles ordered transactions and sync commands using Session IDs."
  - type: "component"
    name: "Dead-Letter Handler"
    technology: "Azure Service Bus DLQ with Azure Monitor"
    description: "Built-in Service Bus DLQ with automated alerting via PagerDuty for poisoned messages."
  - type: "component"
    name: "Retry & Backoff Policy Engine"
    technology: "Azure Service Bus Native Retry Policy"
    description: "Configured with an exponential backoff and a MaxDeliveryCount ceiling of 5 retries."
relationships:
  - source: "Claims Core Service"
    destination: "Claim Event Topic"
    description: "Publishes domain events [AMQP over TLS, Azure RBAC Managed Identity]"
  - source: "Mainframe Integration Adapter"
    destination: "Mainframe Outbox Queue"
    description: "Consumes ordered sync commands using Session IDs [AMQP over TLS, Azure RBAC Managed Identity]"
  - source: "Mainframe Integration Adapter"
    destination: "Dead-Letter Handler"
    description: "Inspects and re-queues poisoned messages [AMQP over TLS]"