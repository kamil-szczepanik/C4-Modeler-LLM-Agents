level: component
scope: "Component diagram for the Claims API Gateway container"
parentContainer:
  name: "Claims API Gateway"
elements:
  - type: "component"
    name: "Routing & Policy Engine"
    technology: "APIM Policy XML / Policy Fragments"
    description: "Handles centralized routing, policy enforcement, and request transformation."
  - type: "component"
    name: "Token Validation & Claims Enriched Policy"
    technology: "APIM Policy XML"
    description: "Validates security tokens and enriches requests with claims information."
  - type: "component"
    name: "Dynamic Migration Router"
    technology: "APIM Named Values & Policy Fragments"
    description: "Dynamically routes claim types between modern and legacy systems during the migration phase."
relationships:
  - source: "Routing & Policy Engine"
    destination: "Token Validation & Claims Enriched Policy"
    description: "Validates incoming tokens"
  - source: "Token Validation & Claims Enriched Policy"
    destination: "Dynamic Migration Router"
    description: "Forwards validated requests for migration routing"