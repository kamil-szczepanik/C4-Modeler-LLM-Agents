level: context
scope: "System Context diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization Platform"
  description: "A cloud-native system hosted in Azure that gradually replaces a 30-year-old mainframe claims system, maintaining hybrid operations while incrementally migrating claim types over a three-year period."
elements:
  - type: "person"
    name: "Customers & Brokers"
    description: "External users submitting claims via HTTPS."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff managing claims via a modern web application."
  - type: "externalSystem"
    name: "Legacy Mainframe System"
    description: "On-premises COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "Active Directory"
    description: "On-premises identity provider used for Single Sign-On."
relationships:
  - source: "Customers & Brokers"
    destination: "Insurance Claims Modernization Platform"
    description: "Submit claims"
    technology: "HTTPS"
  - source: "Claims Adjusters"
    destination: "Insurance Claims Modernization Platform"
    description: "Manage claims via modern web application"
    technology: "HTTPS"
  - source: "Insurance Claims Modernization Platform"
    destination: "Legacy Mainframe System"
    description: "Interfaces for hybrid operations and asynchronous messaging"
    technology: "Azure-to-On-Premises Hybrid Connection (VPN/ExpressRoute) using mTLS (TLS 1.3) and Azure Service Bus"
  - source: "Insurance Claims Modernization Platform"
    destination: "Active Directory"
    description: "Federates for Single Sign-On"
    technology: "OIDC/SAML"