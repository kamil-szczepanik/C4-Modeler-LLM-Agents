# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Claims Modernization Core container"
parentContainer:
  name: "Claims Modernization Core"
elements:
  - type: "component"
    name: "Claim Ingestion Component"
    technology: "Spring MVC"
    description: "Handles incoming claim requests and validations."
  - type: "component"
    name: "Migration Router Component"
    technology: "Spring Cloud Gateway / custom bean"
    description: "Routes claims to either modern processing or legacy integration based on migration rules."
  - type: "component"
    name: "Legacy Mainframe Adapter Component"
    technology: "Spring Integration / SOAP-over-HTTP with Resilience4j"
    description: "Adapts and communicates with the legacy mainframe system using SOAP over HTTP with resilience patterns."
  - type: "component"
    name: "Claim Management Component"
    technology: "Spring Data JPA"
    description: "Manages modern claim data processing and persistence."
  - type: "component"
    name: "Security Policy Component"
    technology: "RBAC/ABAC"
    description: "Enforces security policies and access controls."
  - type: "component"
    name: "Outbox Pattern Component"
    technology: "Outbox Pattern implementation"
    description: "Persists domain events transactionally before publishing."
relationships:
  - source: "Claim Ingestion Component"
    destination: "Migration Router Component"
    description: "Forwards validated claims [Internal Method Call]"
  - source: "Migration Router Component"
    destination: "Claim Management Component"
    description: "Processes modern claims [Internal Method Call]"
  - source: "Migration Router Component"
    destination: "Legacy Mainframe Adapter Component"
    description: "Routes to legacy [Internal Method Call]"
  - source: "Claim Management Component"
    destination: "Outbox Pattern Component"
    description: "Persists domain events transactionally [Internal Method Call]"