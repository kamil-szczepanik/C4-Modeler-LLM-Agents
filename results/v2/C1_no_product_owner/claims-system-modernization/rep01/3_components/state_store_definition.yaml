level: component
scope: "Component diagram for the State Store container"
parentContainer:
  name: "State Store"
elements:
  - type: "component"
    name: "Claim Operational Table"
    technology: "Azure SQL Relational Table"
    description: "Stores claim aggregates and operational data."
  - type: "component"
    name: "Sync Ledger Table"
    technology: "Azure SQL Relational Table"
    description: "Maintains sync watermarks and ledger state."
  - type: "component"
    name: "Audit & Fallback Log"
    technology: "Azure SQL Relational Table"
    description: "Records audit logs and fallback information."
  - type: "component"
    name: "Stored Procedure Gateway"
    technology: "Azure SQL Database mechanisms"
    description: "Provides database mechanisms for ACID compliance."
  - type: "component"
    name: "Temporal Tables / Change Tracking"
    technology: "Native Azure SQL history retention"
    description: "Handles historical audits natively and supports rollbacks."
  - type: "component"
    name: "Resource Governor"
    technology: "Azure SQL Resource Governor"
    description: "CPU and memory throttling mechanism to isolate batch workloads."
relationships:
  - source: "Claims Modernization Core"
    destination: "Claim Operational Table"
    description: "Read/Write claim aggregates [ADO.NET / JDBC via TDS over TLS 1.3]"
  - source: "Integration & Sync Engine"
    destination: "Sync Ledger Table"
    description: "Update sync watermarks [ADO.NET / JDBC via TDS over TLS 1.3]"
  - source: "Claims Modernization Core"
    destination: "State Store"
    description: "Authenticated via Azure AD Managed Identities"