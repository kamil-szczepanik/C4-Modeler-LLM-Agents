level: container
scope: "Container diagram for Insurance Claims Modernization Platform"
system:
  name: "Insurance Claims Modernization Platform"
elements:
  - type: "person"
    name: "Customers & Brokers"
    description: "External users submitting and checking claims."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff managing claims via a modern web application."
  - type: "externalSystem"
    name: "Legacy Mainframe System"
    description: "On-premises COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "Active Directory"
    description: "Identity provider used for centralized single sign-on (SSO) and role-based access control."
  - type: "container"
    name: "Claims Portal"
    technology: "React on Azure App Service"
    description: "Web frontend ensuring <2s page load performance for users."
  - type: "container"
    name: "Azure API Management"
    technology: "Azure API Management (BFF)"
    description: "Acts as a Backend for Frontend (BFF) routing requests securely using OAuth 2.0 / OpenID Connect."
  - type: "container"
    name: "Claims Modernization Core"
    technology: "Java Spring Boot on Azure Kubernetes Service"
    description: "Runs microservices for elastic scalability and blue/green deployments."
  - type: "container"
    name: "Integration & Sync Engine"
    technology: "Azure Service Bus"
    description: "Manages asynchronous message queuing to decouple modern services from mainframe batch windows."
  - type: "container"
    name: "State Store"
    technology: "Azure SQL Database Managed Instance"
    description: "Provides transactional persistence and point-in-time recovery."
relationships:
  - source: "Customers & Brokers"
    destination: "Claims Portal"
    description: "Interacts with Claims Portal"
    technology: "HTTPS / TLS 1.3"
  - source: "Claims Adjusters"
    destination: "Claims Portal"
    description: "Interacts with Claims Portal"
    technology: "HTTPS / TLS 1.3"
  - source: "Claims Portal"
    destination: "Azure API Management"
    description: "Routes requests through API Management"
    technology: "OAuth 2.0 / OpenID Connect"
  - source: "Azure API Management"
    destination: "Claims Modernization Core"
    description: "Forwards requests to core microservices"
    technology: "HTTPS"
  - source: "Claims Modernization Core"
    destination: "State Store"
    description: "Communicates for transactional persistence"
    technology: "TDS over TLS"
  - source: "Claims Modernization Core"
    destination: "Integration & Sync Engine"
    description: "Exchanges asynchronous messages"
    technology: "Azure Service Bus"
  - source: "Integration & Sync Engine"
    destination: "Legacy Mainframe System"
    description: "Exchanges asynchronous messages with Legacy Mainframe"
    technology: "IPsec VPN / ExpressRoute with mTLS"
  - source: "Claims Portal"
    destination: "Active Directory"
    description: "Authenticates users"
    technology: "OAuth 2.0 / OpenID Connect"