level: component
scope: "Component diagram for the Azure Key Vault container"
parentContainer:
  name: "Azure Key Vault"
elements:
  - type: "component"
    name: "Secrets Management Component"
    technology: "Azure Key Vault Secrets"
    description: "Stores connection strings and API keys for the Adjuster Backend Service and Azure SQL Database."
  - type: "component"
    name: "Certificates Management Component"
    technology: "Azure Key Vault Certificates"
    description: "Manages non-exportable mTLS certificates for the Mainframe Integration Adapter."
  - type: "component"
    name: "Access Policy / RBAC Engine"
    technology: "Azure RBAC & Managed Identities"
    description: "Enforces least-privilege access using Azure Managed Identities and Azure RBAC roles."
  - type: "component"
    name: "Network Ingress Layer"
    technology: "Azure Private Endpoint"
    description: "Secures traffic via Azure Private Endpoint with public internet access disabled."
  - type: "component"
    name: "Audit & Monitoring Module"
    technology: "Azure Diagnostics / SIEM"
    description: "Streams diagnostic logs to a SIEM and monitors throttling metrics."
relationships:
  - source: "Adjuster Backend Service"
    destination: "Secrets Management Component"
    description: "Fetches DB credentials and API keys via HTTPS over Private Link using Azure Managed Identity."
  - source: "Mainframe Integration Adapter"
    destination: "Certificates Management Component"
    description: "Retrieves mTLS client certificates via HTTPS over Private Link using Azure Managed Identity."
  - source: "Azure Key Vault"
    destination: "SIEM"
    description: "Streams AuditEvent logs in real-time via Azure Diagnostics."