level: component
scope: "Component diagram for the Azure SQL Database container"
parentContainer:
  name: "Azure SQL Database"
elements:
  - type: "component"
    name: "Claim Entity Store"
    technology: "Relational Tables, Temporal Tables, Azure SQL Database"
    description: "Stores insurance claims data with relational tables and temporal tables for point-in-time auditing and rollbacks."
  - type: "component"
    name: "Migration & Audit Sync Component"
    technology: "SQL Stored Procedures, Change Data Capture"
    description: "Tracks data changes for migration synchronization and reconciliation, reading and writing audit logs and temporal history."
relationships:
  - source: "Migration & Audit Sync Component"
    destination: "Claim Entity Store"
    description: "Reads/writes audit logs and temporal history [Internal SQL]"