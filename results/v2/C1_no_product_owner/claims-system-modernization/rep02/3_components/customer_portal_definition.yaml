level: component
scope: "Component diagram for the Customer Portal container"
parentContainer:
  name: "Customer Portal"
elements:
  - type: "component"
    name: "Authentication Component"
    technology: "MSAL.js / OpenID Connect"
    description: "Integrates SSO with Active Directory and provides Bearer tokens."
  - type: "component"
    name: "Claim Submission UI Component"
    technology: "React Components"
    description: "Enables secure online claim submissions for customers and brokers."
  - type: "component"
    name: "API Client Component"
    technology: "Axios/Fetch"
    description: "Handles API calls and submits claim data to the API Gateway."
  - type: "component"
    name: "Telemetry & Error Boundary Component"
    technology: "Application Insights React SDK"
    description: "Captures client-side exceptions and performance metrics, reporting errors and telemetry."
relationships:
  - source: "Claim Submission UI Component"
    destination: "API Client Component"
    description: "Invoke API calls"
  - source: "API Client Component"
    destination: "API Gateway"
    description: "Submit claim data"
  - source: "Claim Submission UI Component"
    destination: "Telemetry & Error Boundary Component"
    description: "Report errors/telemetry"
  - source: "Authentication Component"
    destination: "API Client Component"
    description: "Provide Bearer token"