level: component
scope: "Component diagram for the Azure Redis Cache container"
parentContainer:
  name: "Azure Redis Cache"
elements:
  - type: "component"
    name: "Redis Master-Replica Engine"
    technology: "Redis Enterprise (Premium Tier P1)"
    description: "Provides master-replica high availability, VNet integration, and persistent memory caching to satisfy sub-second latency requirements."
  - type: "component"
    name: "Session Cache Manager"
    technology: "RESP Protocol / TLS"
    description: "Caches user session data and materialized claim views for fast retrieval by the Adjuster Backend Service."
relationships:
  - source: "Session Cache Manager"
    destination: "Redis Master-Replica Engine"
    description: "Persists cached data and replicates state"