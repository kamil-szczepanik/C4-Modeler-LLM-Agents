level: component
scope: "Component diagram for the Mainframe Integration Adapter container"
parentContainer:
  name: "Mainframe Integration Adapter"
elements:
  - type: "component"
    name: "Adapter API Controller"
    technology: "Spring Boot, REST"
    description: "Receives requests from the adjuster backend service and handles internal API routing."
  - type: "component"
    name: "Mainframe Translation Engine"
    technology: "Java, Apache Camel"
    description: "Translates modern data models into legacy formats like fixed-width EBCDIC/COBOL copybooks."
  - type: "component"
    name: "Legacy Protocol Gateway"
    technology: "TCP/IP with mTLS"
    description: "Provides secure legacy transport to the mainframe using TCP over mTLS via VPN/ExpressRoute."
  - type: "component"
    name: "Integration Queue Router"
    technology: "Spring Integration / Azure Service Bus SDK"
    description: "Manages asynchronous event-driven dispatch and message routing."
  - type: "component"
    name: "Azure Key Vault"
    technology: "Azure Key Vault"
    description: "Provides dynamic certificate injection via Managed Identity."
  - type: "component"
    name: "Azure Monitor / Microsoft Sentinel"
    technology: "Azure Monitor"
    description: "Handles telemetry and audit streaming over HTTPS."
relationships:
  - source: "Adapter API Controller"
    destination: "Integration Queue Router"
    description: "Asynchronous handover [AMQP]"
  - source: "Adapter API Controller"
    destination: "Mainframe Translation Engine"
    description: "In-memory validation [Java]"
  - source: "Integration Queue Router"
    destination: "Mainframe Translation Engine"
    description: "Event-driven dispatch [Internal]"
  - source: "Mainframe Translation Engine"
    destination: "Legacy Protocol Gateway"
    description: "Internal routing [Direct]"
  - source: "Mainframe Integration Adapter"
    destination: "Azure Key Vault"
    description: "Dynamic certificate injection [Managed Identity]"
  - source: "Mainframe Integration Adapter"
    destination: "Azure Monitor / Microsoft Sentinel"
    description: "Telemetry and audit streaming [HTTPS]"