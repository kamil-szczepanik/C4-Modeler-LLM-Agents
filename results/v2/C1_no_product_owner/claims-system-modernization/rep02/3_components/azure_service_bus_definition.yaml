# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Azure Service Bus container"
parentContainer:
  name: "Azure Service Bus"
elements:
  - type: "component"
    name: "Topic Router Component"
    technology: "Azure Service Bus Topics"
    description: "Inspects incoming claim messages and routes them to type-specific subscriptions using Azure Service Bus Topics."
  - type: "component"
    name: "Modernization Switcher Component"
    technology: "In-Memory / Azure App Configuration"
    description: "Evaluates dynamic routing rules to direct migrated claim types to cloud handlers and unmigrated types to the mainframe."
  - type: "component"
    name: "Mainframe Sync Queue Component"
    technology: "Azure Service Bus Queues"
    description: "Buffers messages destined for the mainframe to handle backpressure during the batch window."
  - type: "component"
    name: "Dead-Letter Handler Component"
    technology: "Azure Service Bus Dead-Letter Queue"
    description: "Captures poisoned messages exceeding max delivery retries into a secure Dead-Letter Queue (DLQ)."
  - type: "component"
    name: "Azure App Configuration"
    technology: "Azure App Configuration"
    description: "Stores migration feature flags for the Modernization Switcher."
relationships:
  - source: "Adjuster Backend Service"
    destination: "Topic Router Component"
    description: "Publishes claim events via AMQP over TLS."
  - source: "Topic Router Component"
    destination: "Modernization Switcher Component"
    description: "Evaluates claim type migration status via In-Memory calls."
  - source: "Topic Router Component"
    destination: "Mainframe Sync Queue Component"
    description: "Forwards unmigrated claim payloads via AMQP."
  - source: "Mainframe Sync Queue Component"
    destination: "Mainframe Integration Adapter"
    description: "Delivers buffered payloads via AMQP."