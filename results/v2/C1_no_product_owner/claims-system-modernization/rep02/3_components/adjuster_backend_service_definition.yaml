level: component
scope: "Component diagram for the Adjuster Backend Service container"
parentContainer:
  name: "Adjuster Backend Service"
elements:
  - type: "component"
    name: "Claims Controller"
    technology: "Spring MVC / REST API"
    description: "Handles and exposes adjuster operations via REST/HTTPS over TLS 1.3."
  - type: "component"
    name: "Claims Domain Service"
    technology: "Java / Spring Boot"
    description: "Contains business logic for processing claim data and managing domain operations."
  - type: "component"
    name: "Mainframe ACL Adapter"
    technology: "Legacy translation layer"
    description: "Acts as an Anti-Corruption Layer to bridge cloud-native components with the legacy mainframe system."
  - type: "component"
    name: "Persistence Repository"
    technology: "Spring Data JPA"
    description: "Persists and retrieves claim data from the persistent storage database."
  - type: "component"
    name: "Messaging Publisher"
    technology: "Azure Service Bus integration"
    description: "Emits asynchronous domain events via AMQP to ensure zero claim loss."
  - type: "component"
    name: "Cache Manager Component"
    technology: "Azure Redis Cache interface"
    description: "Reads and writes transient claim views to reduce load times."
relationships:
  - source: "Claims Controller"
    destination: "Claims Domain Service"
    description: "Delegates request processing"
  - source: "Claims Domain Service"
    destination: "Persistence Repository"
    description: "Persists and retrieves claim data [Spring Data JPA / TDS]"
  - source: "Claims Domain Service"
    destination: "Cache Manager Component"
    description: "Reads/writes transient claim views [Redis Protocol]"
  - source: "Claims Domain Service"
    destination: "Messaging Publisher"
    description: "Emits asynchronous domain events [AMQP]"
  - source: "Mainframe ACL Adapter"
    destination: "Claims Domain Service"
    description: "Bridges legacy mainframe data to domain models"