level: component
scope: "Component diagram for the Adjuster Workspace container"
parentContainer:
  name: "Adjuster Workspace"
elements:
  - type: "component"
    name: "Workspace UI Shell"
    technology: "React, TypeScript"
    description: "Provides the user interface for claims adjusters to manage claims securely."
  - type: "component"
    name: "Claim Processing Controller"
    technology: "Node.js, Express"
    description: "Handles REST API calls and coordinates claim data processing."
  - type: "component"
    name: "Distributed Cache Client"
    technology: "Node.js Redis client"
    description: "Manages read/write operations for claim view models with TTL."
  - type: "component"
    name: "Circuit Breaker / Fallback Manager"
    technology: "Opossum"
    description: "Manages downstream mainframe latency spikes to guarantee UI responsiveness."
  - type: "component"
    name: "Azure Redis Cache"
    technology: "Azure Redis Cache"
    description: "Centralized external caching with TLS and managed identity for sub-2s claim screen rendering."
  - type: "component"
    name: "Adjuster Backend Service"
    technology: "Java, Spring Boot, ACL"
    description: "Fetches and updates claim data bridging the hybrid architecture."
relationships:
  - source: "Claims Adjusters"
    destination: "Workspace UI Shell"
    description: "Interacts to manage claims [HTTPS]"
  - source: "Workspace UI Shell"
    destination: "Claim Processing Controller"
    description: "REST API calls [HTTPS/JSON]"
  - source: "Claim Processing Controller"
    destination: "Adjuster Backend Service"
    description: "Fetches/updates claim data [REST/HTTPS/mTLS]"
  - source: "Claim Processing Controller"
    destination: "Distributed Cache Client"
    description: "Read/Write claim view models [Redis Protocol/TLS]"
  - source: "Distributed Cache Client"
    destination: "Azure Redis Cache"
    description: "External caching with TTL [Redis Protocol/TLS]"