level: context
scope: "System Context diagram for Hybrid Cloud Insurance Claims Modernization Platform"
system:
  name: "Hybrid Cloud Insurance Claims Modernization Platform"
  description: "A hybrid cloud insurance claims modernization platform that gradually replaces a 30-year-old mainframe while ensuring continuous operations, enabling modern online submissions and adjuster workflows."
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "Users who submit and manage online insurance claims."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff who interact with the new insurance platform web UI to process claims."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premises COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "On-premises Active Directory / Entra ID providing OIDC/SAML authentication."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External SaaS used for sending notifications."
relationships:
  - source: "Customers and Brokers"
    destination: "Hybrid Cloud Insurance Claims Modernization Platform"
    description: "Online claim submissions"
    technology: "HTTPS/REST"
  - source: "Claims Adjusters"
    destination: "Hybrid Cloud Insurance Claims Modernization Platform"
    description: "Web UI interactions with anti-corruption layer"
    technology: "HTTPS"
  - source: "Hybrid Cloud Insurance Claims Modernization Platform"
    destination: "Legacy Mainframe"
    description: "Asynchronous messaging and data synchronization"
    technology: "MQ Gateway with mTLS"
  - source: "Hybrid Cloud Insurance Claims Modernization Platform"
    destination: "Identity Provider"
    description: "Authentication and token propagation"
    technology: "OIDC/SAML, OAuth2/JWT"
  - source: "Hybrid Cloud Insurance Claims Modernization Platform"
    destination: "Notification Service"
    description: "Sending notifications via dead-letter queues and circuit breakers"
    technology: "HTTPS/API"