level: container
scope: "Container diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization"
elements:
  - type: "person"
    name: "Customers"
    description: "External users who submit online insurance claims."
  - type: "person"
    name: "Brokers"
    description: "External partners who manage and submit claims on behalf of customers."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff who process claims and interact with the adjuster workspace."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise system of record containing historical claims data."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Active Directory system providing OAuth2/OIDC authentication."
  - type: "container"
    name: "Customer Portal"
    technology: "Azure Static Web Apps, React"
    description: "Provides a web interface for customers and brokers to submit claims."
  - type: "container"
    name: "Adjuster Workspace"
    technology: "Azure Container Apps, Node.js/React"
    description: "Provides a user interface for internal claims adjusters."
  - type: "container"
    name: "API Gateway"
    technology: "Azure Container Apps"
    description: "Validates OAuth2/OIDC tokens and routes traffic to backend services."
  - type: "container"
    name: "Adjuster Backend Service"
    technology: "Java/Spring Boot, Anti-Corruption Layer (ACL)"
    description: "Encapsulates business logic for claims processing and isolates the legacy backend."
  - type: "container"
    name: "Azure SQL Database"
    technology: "Azure SQL Database, Spring Data JPA"
    description: "Persists migrated claim types locally."
  - type: "container"
    name: "Azure Redis Cache"
    technology: "Azure Redis Cache"
    description: "Stores session and temporary data for fast screen load times."
  - type: "container"
    name: "Azure Service Bus"
    technology: "Azure Service Bus with Dead-Letter Queues"
    description: "Manages asynchronous queues and ensures zero claim loss."
  - type: "container"
    name: "Mainframe Integration Adapter"
    technology: "mTLS Integration Adapter"
    description: "Connects securely to the on-premise Legacy Mainframe."
  - type: "container"
    name: "Azure Key Vault"
    technology: "Azure Key Vault"
    description: "Centralizes secrets, mTLS certificates, and API keys securely."
relationships:
  - source: "Customers"
    destination: "Customer Portal"
    description: "Submit claims"
    technology: "HTTPS/JSON"
  - source: "Brokers"
    destination: "Customer Portal"
    description: "Submit and manage claims"
    technology: "HTTPS/JSON"
  - source: "Customer Portal"
    destination: "API Gateway"
    description: "Routes requests"
    technology: "HTTPS/JSON"
  - source: "Claims Adjusters"
    destination: "Adjuster Workspace"
    description: "Interacts to process claims"
    technology: "HTTPS"
  - source: "Adjuster Workspace"
    destination: "Adjuster Backend Service"
    description: "Communicates for adjuster operations"
    technology: "REST/HTTPS"
  - source: "API Gateway"
    destination: "Identity Provider"
    description: "Validates OAuth2/OIDC tokens"
    technology: "OAuth2/OIDC"
  - source: "Adjuster Backend Service"
    destination: "Azure Redis Cache"
    description: "Caches session and performance data"
    technology: "Redis Protocol"
  - source: "Adjuster Backend Service"
    destination: "Azure Service Bus"
    description: "Sends asynchronous messages for background processing"
    technology: "AMQP"
  - source: "Adjuster Backend Service"
    destination: "Azure SQL Database"
    description: "Persists claim data"
    technology: "Spring Data JPA / TDS"
  - source: "Adjuster Backend Service"
    destination: "Mainframe Integration Adapter"
    description: "Integrates with legacy backend"
    technology: "Internal API"
  - source: "Mainframe Integration Adapter"
    destination: "Legacy Mainframe"
    description: "Synchronizes data securely"
    technology: "mTLS"
  - source: "Adjuster Backend Service"
    destination: "Azure Key Vault"
    description: "Retrieves secrets and certificates"
    technology: "Managed Identities / HTTPS"