level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Relational Storage Engine"
    technology: "PostgreSQL 15"
    description: "Provides secure, highly available, and EU-compliant relational data storage with ACID compliance, Row-Level Security (RLS), and pgcrypto."
  - type: "component"
    name: "Connection Pool Manager"
    technology: "HikariCP"
    description: "Handles high-performance connection pooling to meet concurrency and performance targets."
  - type: "component"
    name: "Read Replica Engine"
    technology: "PostgreSQL 15"
    description: "Handles read scaling and query offloading."
  - type: "component"
    name: "Secrets Management Agent"
    technology: "HashiCorp Vault Agent"
    description: "Manages dynamic credential generation, key management, and automated rotation."
  - type: "component"
    name: "Security & Encryption Engine"
    technology: "pgcrypto / mTLS"
    description: "Provides encrypted persistence and security controls like row-level security and mTLS."
  - type: "component"
    name: "Automated Backup & PITR Engine"
    technology: "PostgreSQL PITR / Cloud Native Tools"
    description: "Handles automated backups and Point-In-Time Recovery to EU-only object storage."
  - type: "component"
    name: "Replica Sync Monitor"
    technology: "Custom Monitoring Script"
    description: "Monitors synchronization status between primary and read replicas."
  - type: "component"
    name: "Audit & Replication Log"
    technology: "pgaudit"
    description: "Deployed for comprehensive security auditing and log management."
relationships:
  - source: "Core Domain Microservice"
    destination: "Connection Pool Manager"
    description: "JDBC / TCP with TLS 1.3 and mTLS"
  - source: "Connection Pool Manager"
    destination: "Relational Storage Engine"
    description: "Internal IPC"
  - source: "Secure Vault"
    destination: "Secrets Management Agent"
    description: "HTTPS / REST"
  - source: "Secrets Management Agent"
    destination: "Relational Storage Engine"
    description: "Internal IPC"
  - source: "Security & Encryption Engine"
    destination: "OpenTelemetry Collector"
    description: "OTLP"
  - source: "Automated Backup & PITR Engine"
    destination: "EU-Only Object Storage Bucket"
    description: "HTTPS"