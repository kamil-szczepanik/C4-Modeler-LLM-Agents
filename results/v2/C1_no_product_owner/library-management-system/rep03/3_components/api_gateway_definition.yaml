level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "TLS Termination"
    technology: "Envoy Filter"
    description: "Terminates incoming HTTPS connections from the Web Application."
  - type: "component"
    name: "WAF"
    technology: "Envoy Security Filter"
    description: "Provides Web Application Firewall protection against malicious traffic."
  - type: "component"
    name: "Token Exchange"
    technology: "Envoy Authentication Filter"
    description: "Handles token validation and claim injection for incoming requests."
  - type: "component"
    name: "Routing Engine"
    technology: "Envoy Routing Filter"
    description: "Manages edge routing of requests to downstream microservices."
  - type: "component"
    name: "Rate Limiting"
    technology: "Envoy Rate Limit Filter"
    description: "Enforces traffic rate limits to ensure system stability and performance."
  - type: "component"
    name: "Telemetry"
    technology: "OpenTelemetry Filter"
    description: "Collects and propagates standardized telemetry data."
relationships:
  - source: "TLS Termination"
    destination: "WAF"
    description: "Passes decrypted traffic for security inspection"
  - source: "WAF"
    destination: "Token Exchange"
    description: "Forwards validated traffic for authentication and claim injection"
  - source: "Token Exchange"
    destination: "Routing Engine"
    description: "Sends enriched requests with injected claims"
  - source: "Routing Engine"
    destination: "Rate Limiting"
    description: "Checks request quotas before dispatching"