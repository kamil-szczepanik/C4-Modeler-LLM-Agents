level: component
scope: "Component diagram for the Web Application container"
parentContainer:
  name: "Web Application"
elements:
  - type: "component"
    name: "Routing & Shell"
    technology: "React Router"
    description: "Orchestrates UI layouts and roles."
  - type: "component"
    name: "State Management"
    technology: "Zustand / React Query"
    description: "Manages server-state caching and UI state."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios / Fetch"
    description: "Communicates with external APIs and services."
  - type: "component"
    name: "Feature Modules"
    technology: "React 18, TypeScript"
    description: "Patron Portal & Staff Portal functionality."
relationships:
  - source: "Routing & Shell"
    destination: "Feature Modules"
    description: "Orchestrates UI layouts and roles"
  - source: "Feature Modules"
    destination: "State Management"
    description: "Retrieves and caches data"
  - source: "Feature Modules"
    destination: "API Client Layer"
    description: "Retrieves and caches data"