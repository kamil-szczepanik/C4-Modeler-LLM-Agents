level: component
scope: "Component diagram for the Secure Vault container"
parentContainer:
  name: "Secure Vault"
elements:
  - type: "component"
    name: "Secrets Engine"
    technology: "HashiCorp Vault KV & Database"
    description: "Manages static and dynamic secrets, including dynamic database credentials for PostgreSQL via encrypted connections."
  - type: "component"
    name: "PKI Engine"
    technology: "HashiCorp Vault PKI Secrets Engine"
    description: "Handles PKI certificate generation."
  - type: "component"
    name: "Transit Encryption Engine"
    technology: "HashiCorp Vault Transit Engine"
    description: "Provides transit encryption for the system."
  - type: "component"
    name: "Auth Method / Seal Manager"
    technology: "AppRole, JWT/OIDC, Cloud Auto-Unseal"
    description: "Implements strict least-privilege authentication, short token TTLs, and automated zero-touch recovery."
  - type: "component"
    name: "Audit Logging & Telemetry Engine"
    technology: "HashiCorp Vault Audit & Telemetry Devices"
    description: "Exports encrypted telemetry and metrics to the OpenTelemetry Collector and Prometheus/Grafana stack."
  - type: "component"
    name: "Secret Sidecar Cache"
    technology: "Automated sidecar injector with circuit breaking"
    description: "Provides automated secret injection and caching with circuit breaking to prevent cascading failures."
  - type: "component"
    name: "Core Domain Microservice"
    technology: "Microservice"
    description: "External microservice communicating with Secure Vault via mTLS."
  - type: "component"
    name: "Database"
    technology: "PostgreSQL"
    description: "Database storing system data with credentials managed dynamically."
  - type: "component"
    name: "Observability Stack"
    technology: "OpenTelemetry Collector and Prometheus/Grafana"
    description: "Receives encrypted telemetry and metrics export."
relationships:
  - source: "Core Domain Microservice"
    destination: "Secret Sidecar Cache"
    description: "Communicates via mTLS (TLS 1.3) using Vault API and sidecar caching."
  - source: "Secret Sidecar Cache"
    destination: "Secrets Engine"
    description: "Injects runtime secrets and retrieves configurations."
  - source: "Audit Logging & Telemetry Engine"
    destination: "Observability Stack"
    description: "Exports encrypted telemetry and metrics."
  - source: "Secrets Engine"
    destination: "Database"
    description: "Manages dynamic database credentials for PostgreSQL via encrypted connections."