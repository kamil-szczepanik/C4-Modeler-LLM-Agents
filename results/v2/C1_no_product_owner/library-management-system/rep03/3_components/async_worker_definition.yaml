level: component
scope: "Component diagram for the Async Worker container"
parentContainer:
  name: "Async Worker"
elements:
  - type: "component"
    name: "Task Router"
    technology: "Python / Celery App"
    description: "Consumes background jobs and routes tasks."
  - type: "component"
    name: "Task Validation Interceptor"
    technology: "Celery Pipeline"
    description: "Validates raw messages before execution."
  - type: "component"
    name: "Payment Processor Task"
    technology: "Python"
    description: "Executes financial transactions and interacts with secure services."
  - type: "component"
    name: "Notification Dispatcher Task"
    technology: "Python"
    description: "Dispatches alerts and notifications to external services."
  - type: "component"
    name: "Message Broker"
    technology: "RabbitMQ with DLQs"
    description: "Handles fault-tolerant task routing and metric-based autoscaling."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Manages database connection limits."
  - type: "component"
    name: "Database"
    technology: "PostgreSQL / SQLAlchemy / AsyncPG"
    description: "Persists state and idempotency keys."
  - type: "component"
    name: "External Services"
    technology: "Payment Gateway, Notification Service"
    description: "External systems for payment execution and notification dispatch."
  - type: "component"
    name: "Secure Vault"
    technology: "HashiCorp Vault"
    description: "Provides secret management for dynamic credentials and AppRole authentication."
relationships:
  - source: "Task Router"
    destination: "Message Broker"
    description: "Consumes background jobs [AMQPS with mTLS]"
  - source: "Task Router"
    destination: "Task Validation Interceptor"
    description: "Passes raw messages [In-memory]"
  - source: "Payment Processor Task"
    destination: "Secure Vault"
    description: "Fetches API credentials [HTTPS (REST)]"
  - source: "Payment Processor Task"
    destination: "External Services"
    description: "Executes transactions [HTTPS (TLS 1.3)]"
  - source: "Notification Dispatcher Task"
    destination: "External Services"
    description: "Dispatches alerts [gRPC with TLS 1.3]"
  - source: "Payment Processor Task"
    destination: "Connection Pooler"
    description: "Persists state/idempotency keys [TCP via TLS]"
  - source: "Notification Dispatcher Task"
    destination: "Connection Pooler"
    description: "Persists state/idempotency keys [TCP via TLS]"
  - source: "Connection Pooler"
    destination: "Database"
    description: "Forwards database queries [TCP]"