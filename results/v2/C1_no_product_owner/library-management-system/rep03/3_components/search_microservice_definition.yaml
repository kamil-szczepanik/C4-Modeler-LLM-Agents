level: component
scope: "Component diagram for the Search Microservice container"
parentContainer:
  name: "Search Microservice"
elements:
  - type: "component"
    name: "Search API Controller"
    technology: "Java 17, Spring Boot"
    description: "Exposes the Search API endpoints for catalogue and item retrieval."
  - type: "component"
    name: "Search Query Engine"
    technology: "Java 17, Spring Boot, Elasticsearch High-Level REST Client"
    description: "Executes search queries against Elasticsearch and interacts with the cache manager."
  - type: "component"
    name: "Index Synchronizer"
    technology: "Java 17, Spring Boot, RabbitMQ Consumer"
    description: "Synchronizes index data between PostgreSQL and Elasticsearch via RabbitMQ."
  - type: "component"
    name: "Search Cache Manager"
    technology: "Java 17, Spring Boot, Redis"
    description: "Manages in-memory caching for frequent search queries to reduce database and engine load."
  - type: "component"
    name: "Elasticsearch"
    technology: "Search Engine & Data Store"
    description: "Dedicated search engine ensuring sub-800ms search responses."
  - type: "component"
    name: "PostgreSQL"
    technology: "Primary Relational Database"
    description: "Stores primary relational data for index synchronization."
  - type: "component"
    name: "Message Broker"
    technology: "RabbitMQ"
    description: "Asynchronous message broker for reliable index synchronization."
  - type: "component"
    name: "Secure Vault"
    technology: "HashiCorp Vault"
    description: "Provides secure credential management using short-lived tokens."
relationships:
  - source: "API Gateway"
    destination: "Search API Controller"
    description: "mTLS, REST/JSON"
  - source: "Search API Controller"
    destination: "Secure Vault"
    description: "HTTPS/Token"
  - source: "Search Query Engine"
    destination: "Search Cache Manager"
    description: "In-Memory/TCP"
  - source: "Search Query Engine"
    destination: "Elasticsearch"
    description: "TLS/mTLS, TCP/Transport"
  - source: "Index Synchronizer"
    destination: "Message Broker"
    description: "AMQP"
  - source: "Index Synchronizer"
    destination: "PostgreSQL"
    description: "JDBC"
  - source: "Index Synchronizer"
    destination: "Elasticsearch"
    description: "TLS/mTLS, TCP/Transport"
  - source: "Search Cache Manager"
    destination: "Secure Vault"
    description: "HTTPS/Token"