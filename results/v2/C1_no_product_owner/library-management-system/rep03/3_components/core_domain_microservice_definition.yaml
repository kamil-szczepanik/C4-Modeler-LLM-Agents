# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Core Domain Microservice container"
parentContainer:
  name: "Core Domain Microservice"
elements:
  - type: "component"
    name: "CirculationController"
    technology: "Spring MVC"
    description: "Handling REST ingress, JWT claims verification, and Bean Validation."
  - type: "component"
    name: "CatalogDomainService"
    technology: "Spring @Service"
    description: "Managing core circulation rules and audit logging."
  - type: "component"
    name: "LoanRepository"
    technology: "Spring Data JPA"
    description: "Managing relational persistence."
  - type: "component"
    name: "OutboxDispatcher"
    technology: "Scheduled Spring component"
    description: "Processing reliable event dispatching."
  - type: "component"
    name: "EventPublisher"
    technology: "Spring AMQP"
    description: "Emitting messages to RabbitMQ."
  - type: "component"
    name: "PostgreSQL"
    technology: "Relational database"
    description: "Storing catalog data, loan states, and outbox tables with TLS 1.3 and column-level PII encryption."
  - type: "component"
    name: "RabbitMQ"
    technology: "Message broker"
    description: "Receiving asynchronous domain events via AMQPS."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "Secrets manager"
    description: "Providing dynamic credentials and transit encryption keys."
  - type: "component"
    name: "OpenTelemetry Collector / Grafana"
    technology: "Observability stack"
    description: "Tracking W3C trace contexts and metrics."
relationships:
  - source: "API Gateway"
    destination: "CirculationController"
    description: "Routes HTTP requests with RBAC [mTLS, REST/JSON]"
  - source: "CirculationController"
    destination: "CatalogDomainService"
    description: "Invokes business rules [Java Method Call]"
  - source: "CatalogDomainService"
    destination: "LoanRepository"
    description: "Persists domain entities and outbox records in a single database transaction [JPA/JDBC]"
  - source: "CatalogDomainService"
    destination: "EventPublisher"
    description: "Triggers asynchronous event emission [Java Method Call]"
  - source: "OutboxDispatcher"
    destination: "EventPublisher"
    description: "Relays pending outbox messages with Resilience4j circuit breaking [Java Method Call]"
  - source: "EventPublisher"
    destination: "RabbitMQ Message Broker"
    description: "Publishes catalog and circulation state-change events [AMQPS]"
  - source: "Core Domain Microservice"
    destination: "PostgreSQL"
    description: "Reads and writes relational data [JDBC, TLS 1.3]"