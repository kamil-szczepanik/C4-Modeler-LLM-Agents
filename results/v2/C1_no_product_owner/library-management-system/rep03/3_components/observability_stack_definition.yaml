level: component
scope: "Component diagram for the Observability Stack container"
parentContainer:
  name: "Observability Stack"
elements:
  - type: "component"
    name: "OpenTelemetry Collector"
    technology: "OpenTelemetry Collector"
    description: "Ingests, filters, and forwards traces and metrics, ensuring strict EU data residency compliance."
  - type: "component"
    name: "Prometheus"
    technology: "Prometheus TSDB"
    description: "Scrapes and stores high-performance time-series metrics."
  - type: "component"
    name: "Grafana Loki"
    technology: "Grafana Loki"
    description: "Aggregates structured logs for scalable, cost-effective log management."
  - type: "component"
    name: "Grafana"
    technology: "Grafana with OIDC-backed RBAC"
    description: "Visualizes metrics, traces, and logs for operator visualization."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Manages encryption keys for data at rest."
relationships:
  - source: "OpenTelemetry Collector"
    destination: "Grafana Loki"
    description: "Forwards structured logs via OTLP/HTTP"
  - source: "Grafana"
    destination: "Prometheus"
    description: "Queries metrics via PromQL/TLS 1.3"
  - source: "Grafana"
    destination: "Grafana Loki"
    description: "Queries logs via LogQL/TLS 1.3"