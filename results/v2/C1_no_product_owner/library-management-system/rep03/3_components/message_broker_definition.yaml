# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Exchange Router"
    technology: "RabbitMQ Core Exchange Engine"
    description: "Routes incoming catalog events and background jobs."
  - type: "component"
    name: "Queue Manager"
    technology: "Erlang ETS / Mnesia with Quorum Queues"
    description: "Manages message durability and high availability using quorum queues."
  - type: "component"
    name: "Connection & Security Handler"
    technology: "RabbitMQ SSL/TLS Plugin with mTLS"
    description: "Handles secure connections and mutual TLS authentication."
  - type: "component"
    name: "Dead Letter Exchange & Retry Component"
    technology: "Quarantine queue mechanism"
    description: "Handles failed messages and retries via quarantine queues."
  - type: "component"
    name: "Management & Telemetry Exporter"
    technology: "RabbitMQ Prometheus Plugin"
    description: "Exposes system metrics for telemetry and monitoring."
relationships:
  - source: "Core Domain Microservice"
    destination: "Exchange Router"
    description: "Publishes catalog events [AMQPS over TLS / mTLS]"
  - source: "Async Worker"
    destination: "Queue Manager"
    description: "Consumes background jobs [AMQPS over TLS / mTLS]"
  - source: "Queue Manager"
    destination: "Secure Vault"
    description: "Fetches TLS credentials [HTTPS]"
  - source: "Observability Stack"
    destination: "Management & Telemetry Exporter"
    description: "Scrapes metrics [HTTP/S]"