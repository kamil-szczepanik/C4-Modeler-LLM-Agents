level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Provides self-service portals and circulation management for public and academic libraries, cataloguing physical and digital items while strictly adhering to EU data residency mandates."
elements:
  - type: "person"
    name: "Library Patron"
    description: "Library user who searches for and borrows physical and digital items."
  - type: "person"
    name: "Librarian / Staff"
    description: "Library staff member who catalogues items and manages circulation."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system that processes fines with tokenized payments."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External service that sends due date reminders."
  - type: "externalSystem"
    name: "Digital Content Provider"
    description: "External provider that supplies e-books and digital media."
relationships:
  - source: "Library Patron"
    destination: "Library Management System"
    description: "Searches and borrows items"
    technology: "HTTPS"
  - source: "Librarian / Staff"
    destination: "Library Management System"
    description: "Catalogues items and manages circulation"
    technology: "HTTPS"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Processes fines with tokenized payments"
    technology: "REST over TLS 1.3"
  - source: "Library Management System"
    destination: "Notification Service"
    description: "Sends due date reminders"
    technology: "SMTP/REST"
  - source: "Library Management System"
    destination: "Digital Content Provider"
    description: "Accesses e-books and digital media"
    technology: "REST and OAuth2"