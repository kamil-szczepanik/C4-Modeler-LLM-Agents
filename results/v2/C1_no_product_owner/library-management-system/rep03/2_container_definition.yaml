# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patron"
    description: "Library user who searches for and borrows physical and digital items."
  - type: "person"
    name: "Librarian / Staff"
    description: "Library staff member who catalogues items and manages circulation."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system that processes fines with tokenized payments."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External service that sends due date reminders."
  - type: "externalSystem"
    name: "Digital Content Provider"
    description: "External provider that supplies e-books and digital media."
  - type: "container"
    name: "Web Application"
    technology: "React, Nginx"
    description: "Powers self-service portals for low latency."
  - type: "container"
    name: "API Gateway"
    technology: "Envoy"
    description: "Handles high-performance routing, mTLS termination, and tracing."
  - type: "container"
    name: "Core Domain Microservice"
    technology: "Java 17, Spring Boot"
    description: "Delivers reliable core domain circulation logic."
  - type: "container"
    name: "Search Microservice"
    technology: "Elasticsearch"
    description: "Satisfies R-05 (<800ms P99 search) via dedicated indexing."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL"
    description: "Stores relational data with enforced EU data residency."
  - type: "container"
    name: "Async Worker"
    technology: "Python, Celery"
    description: "Manages asynchronous workloads and event-driven updates."
  - type: "container"
    name: "Message Broker"
    technology: "RabbitMQ"
    description: "Facilitates asynchronous catalog indexing events and background jobs."
  - type: "container"
    name: "Observability Stack"
    technology: "Prometheus, Grafana, OpenTelemetry Collector"
    description: "Centralizes tracing and metrics."
  - type: "container"
    name: "Secure Vault"
    technology: "HashiCorp Vault"
    description: "Securely injects dynamic runtime secrets and TLS certificates."
relationships:
  - source: "Library Patron"
    destination: "Web Application"
    description: "Accesses self-service portal"
    technology: "HTTPS"
  - source: "Librarian / Staff"
    destination: "Web Application"
    description: "Accesses management portal"
    technology: "HTTPS"
  - source: "Web Application"
    destination: "API Gateway"
    description: "Forwards client requests"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Core Domain Microservice"
    description: "Routes domain requests with RBAC"
    technology: "mTLS, REST/JSON"
  - source: "API Gateway"
    destination: "Search Microservice"
    description: "Routes search queries"
    technology: "mTLS, REST/JSON"
  - source: "Core Domain Microservice"
    destination: "Database"
    description: "Reads and writes relational data"
    technology: "JDBC"
  - source: "Core Domain Microservice"
    destination: "Message Broker"
    description: "Publishes asynchronous catalog indexing events"
    technology: "AMQPS"
  - source: "Async Worker"
    destination: "Message Broker"
    description: "Consumes background payment and notification jobs"
    technology: "AMQPS"
  - source: "Observability Stack"
    destination: "Core Domain Microservice"
    description: "Scrapes metrics and telemetry"
    technology: "Prometheus/OpenTelemetry"