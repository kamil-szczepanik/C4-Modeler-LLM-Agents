# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Provides cataloging, circulation, and self-service portals for public and academic libraries within EU data residency constraints, ensuring high-performance search capabilities while securing external payment and digital content integrations."
elements:
  - type: "person"
    name: "Library Patron"
    description: "End-user accessing self-service portals to search and borrow items."
  - type: "person"
    name: "Librarian / Library Staff"
    description: "Administrative users managing inventory and circulation desk operations."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system handling fines and fees."
  - type: "externalSystem"
    name: "Digital Content Provider"
    description: "Third-party APIs for streaming and downloading digital assets."
relationships:
  - source: "Library Patron"
    destination: "Library Management System"
    description: "Catalog search and loan management"
    technology: "HTTPS (Web/Mobile)"
  - source: "Librarian / Library Staff"
    destination: "Library Management System"
    description: "Inventory and circulation control"
    technology: "HTTPS"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Fine payments processing"
    technology: "REST/HTTPS with mutual TLS (mTLS)"
  - source: "Library Management System"
    destination: "Digital Content Provider"
    description: "Digital asset access"
    technology: "REST/HTTPS with mutual TLS (mTLS)"