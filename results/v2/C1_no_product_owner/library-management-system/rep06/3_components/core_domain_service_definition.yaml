# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Core Domain Service container"
parentContainer:
  name: "Core Domain Service"
elements:
  - type: "component"
    name: "CatalogManager"
    technology: "Spring Boot / Java"
    description: "Manages the cataloguing of physical and digital items within the library system."
  - type: "component"
    name: "CatalogQueryFacade"
    technology: "Spring Boot / Java, jOOQ"
    description: "Provides read-optimized queries for catalog and search operations."
  - type: "component"
    name: "CirculationEngine"
    technology: "Spring Boot / Java, Resilience4j"
    description: "Manages circulation processes and coordinates payment transactions."
  - type: "component"
    name: "DomainEventPublisher"
    technology: "Spring Boot / Java, Kafka"
    description: "Publishes domain events to the managed Kafka event bus."
relationships:
  - source: "CirculationEngine"
    destination: "Payment Gateway"
    description: "Processes transactions via REST/HTTPS with mTLS and Resilience4j circuit breakers"
  - source: "CatalogQueryFacade"
    destination: "PostgreSQL Database"
    description: "Executes read-optimized queries via jOOQ"
  - source: "DomainEventPublisher"
    destination: "Managed Kafka Event Bus"
    description: "Publishes domain events using the Kafka protocol with payload encryption"