level: component
scope: "Component diagram for the Search Service container"
parentContainer:
  name: "Search Service"
elements:
  - type: "component"
    name: "Search REST Controller"
    technology: "Java / Spring REST Controller"
    description: "Handles incoming HTTP/REST search requests from the API Gateway."
  - type: "component"
    name: "Query Parser & Builder"
    technology: "Java In-memory"
    description: "Parses and constructs search queries."
  - type: "component"
    name: "Resilience & Caching Proxy"
    technology: "Java In-memory / RESP"
    description: "Manages caching, resilience patterns, and secure communication."
  - type: "component"
    name: "Indexing Worker"
    technology: "Java Kafka Consumer"
    description: "Consumes asynchronous events from Kafka to index catalogue items."
  - type: "component"
    name: "OpenSearch Index"
    technology: "OpenSearch"
    description: "Underlying data store for scalable search queries and EU data residency compliance."
  - type: "component"
    name: "Redis Cache"
    technology: "Redis"
    description: "Distributed cache to guarantee sub-800ms response SLAs under heavy load."
  - type: "component"
    name: "Async Event Bus"
    technology: "Managed Kafka"
    description: "Asynchronous event bus for decoupled catalogue ingestion."
relationships:
  - source: "API Gateway"
    destination: "Search REST Controller"
    description: "HTTP/REST"
  - source: "Async Event Bus"
    destination: "Indexing Worker"
    description: "Kafka Consumer Protocol"
  - source: "Search REST Controller"
    destination: "Query Parser & Builder"
    description: "In-memory"
  - source: "Query Parser & Builder"
    destination: "Resilience & Caching Proxy"
    description: "In-memory / RESP"
  - source: "Resilience & Caching Proxy"
    destination: "OpenSearch Index"
    description: "HTTPS / mTLS"
  - source: "Resilience & Caching Proxy"
    destination: "Redis Cache"
    description: "RESP over TLS"