level: component
scope: "Component diagram for the Async Event Bus container"
parentContainer:
  name: "Async Event Bus"
elements:
  - type: "component"
    name: "Topic Manager"
    technology: "Managed Kafka Topics"
    description: "Manages Kafka topics (item-events, circulation-events) for partitioned event publishing."
  - type: "component"
    name: "Access Control & Auth Component"
    technology: "Kafka ACLs, SASL/SCRAM-SHA-512 & mTLS"
    description: "Secures service authentication and data in transit."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry with Avro"
    description: "Ensures safe contract evolution and payload-level PII encryption."
  - type: "component"
    name: "Event Router / Partition Key Strategist"
    technology: "Kafka Partition Strategy"
    description: "Routes events using partition keys to ensure ordered event streams."
  - type: "component"
    name: "Dead Letter Queue (DLQ) & Poison Pill Handler"
    technology: "Kafka DLQ Pattern"
    description: "Handles malformed messages and operational integrity."
relationships:
  - source: "Topic Manager"
    destination: "Schema Registry"
    description: "Validates event schemas [HTTP/REST]"
  - source: "Topic Manager"
    destination: "Event Router / Partition Key Strategist"
    description: "Routes and partitions events [Kafka protocol]"
  - source: "Topic Manager"
    destination: "Dead Letter Queue (DLQ) & Poison Pill Handler"
    description: "Redirects poison pill messages"
  - source: "Access Control & Auth Component"
    destination: "Topic Manager"
    description: "Secures access via Kafka ACLs"