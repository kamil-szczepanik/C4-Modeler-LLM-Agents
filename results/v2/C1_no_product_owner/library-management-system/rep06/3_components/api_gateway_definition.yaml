level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing & Load Balancer"
    technology: "Spring Cloud Gateway"
    description: "Routes incoming API requests and balances load across backend services."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Spring Security"
    description: "Validates OAuth2 tokens and enforces role-based access control."
  - type: "component"
    name: "Rate Limiting & Throttling"
    technology: "Spring Cloud Gateway & Redis"
    description: "Controls request rates and enforces traffic limits."
  - type: "component"
    name: "Caching & Response Transformation"
    technology: "Spring Cloud Gateway & Redis"
    description: "Evaluates cached responses and transforms payloads for efficient delivery."
relationships:
  - source: "Routing & Load Balancer"
    destination: "Caching & Response Transformation"
    description: "Evaluates cached responses [Redis RESP / TLS]"