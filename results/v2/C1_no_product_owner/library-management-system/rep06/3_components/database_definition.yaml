level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Enterprise connection pooler to prevent backend worker exhaustion."
  - type: "component"
    name: "Relational Tables"
    technology: "PostgreSQL SQL / PostgreSQL RLS / pgcrypto"
    description: "ACID-compliant relational persistence with row-level security and column-level encryption for patron isolation."
  - type: "component"
    name: "Audit Logging Module"
    technology: "pgAudit extension"
    description: "Database event tracking for EU regulatory compliance."
relationships:
  - source: "Connection Pooler"
    destination: "Relational Tables"
    description: "Forwards pooled connections via PostgreSQL Native Protocol over TLS 1.3"
  - source: "Relational Tables"
    destination: "Audit Logging Module"
    description: "Captures security events via Internal PostgreSQL Hook"