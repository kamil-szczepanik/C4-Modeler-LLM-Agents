level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patron"
    description: "End-user accessing self-service portals to search and borrow items."
  - type: "person"
    name: "Librarian / Library Staff"
    description: "Administrative users managing inventory and circulation desk operations."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system handling fines and fees."
  - type: "externalSystem"
    name: "Digital Content Provider"
    description: "Third-party APIs for streaming and downloading digital assets."
  - type: "container"
    name: "Web Application"
    technology: "React / TypeScript, EU CDN"
    description: "Single-page application powering the user interface for patrons and staff."
  - type: "container"
    name: "API Gateway"
    technology: "NGINX / Spring Cloud Gateway"
    description: "Entry point managing and routing external requests with TLS 1.3 and mTLS."
  - type: "container"
    name: "Core Domain Service"
    technology: "Spring Boot / Java"
    description: "Implements core cataloguing and circulation business logic."
  - type: "container"
    name: "Search Service"
    technology: "Elasticsearch / OpenSearch"
    description: "Provides high-performance search capabilities with sub-800ms response times."
  - type: "container"
    name: "Async Event Bus"
    technology: "Managed Kafka"
    description: "Decouples core transactions from search indexing asynchronously."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL"
    description: "Managed EU-hosted transactional persistence with AES-256 encryption."
relationships:
  - source: "Library Patron"
    destination: "Web Application"
    description: "Accesses portal features"
    technology: "HTTPS"
  - source: "Librarian / Library Staff"
    destination: "Web Application"
    description: "Manages inventory and circulation"
    technology: "HTTPS"
  - source: "Web Application"
    destination: "API Gateway"
    description: "Makes API requests"
    technology: "HTTPS / TLS 1.3"
  - source: "API Gateway"
    destination: "Core Domain Service"
    description: "Routes requests"
    technology: "gRPC/REST with mTLS"
  - source: "Core Domain Service"
    destination: "Database"
    description: "Persists and retrieves transaction data"
    technology: "JDBC (AES-256 encrypted)"
  - source: "Core Domain Service"
    destination: "Async Event Bus"
    description: "Publishes domain events"
    technology: "Kafka protocol"
  - source: "Search Service"
    destination: "Async Event Bus"
    description: "Consumes events for search indexing"
    technology: "Kafka protocol"
  - source: "Core Domain Service"
    destination: "Payment Gateway"
    description: "Processes fine payments"
    technology: "REST/HTTPS with mTLS"
  - source: "Core Domain Service"
    destination: "Digital Content Provider"
    description: "Accesses digital assets"
    technology: "REST/HTTPS with mTLS"