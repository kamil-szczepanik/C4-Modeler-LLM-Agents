level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A public and academic platform for cataloguing physical and digital items, managing circulation, and providing self-service portals, enforcing strict EU-only data residency and high-performance search requirements."
elements:
  - type: "person"
    name: "Library Patron"
    description: "External actor accessing self-service portals to search and borrow items."
  - type: "person"
    name: "Librarian"
    description: "External actor managing cataloguing, inventory, and circulation."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system for SSO authentication using OAuth2/OIDC."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system for processing fines and fees via REST/HTTPS."
  - type: "externalSystem"
    name: "Notification Provider"
    description: "External system for sending circulation alerts via SMTPS/HTTPS."
relationships:
  - source: "Library Patron"
    destination: "Library Management System"
    description: "Accesses self-service portals and interacts with the system"
    technology: "HTTPS, TLS 1.3"
  - source: "Librarian"
    destination: "Library Management System"
    description: "Manages cataloguing and circulation through the platform"
    technology: "HTTPS, TLS 1.3"
  - source: "Library Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users via delegated authentication"
    technology: "OAuth2/OIDC, HTTPS"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Processes fines and fees"
    technology: "REST/HTTPS"
  - source: "Library Management System"
    destination: "Notification Provider"
    description: "Sends circulation alerts to patrons and staff"
    technology: "SMTPS/HTTPS"