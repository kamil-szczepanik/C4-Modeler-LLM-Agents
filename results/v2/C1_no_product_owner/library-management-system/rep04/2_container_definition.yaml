level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patron"
    description: "External actor accessing self-service portals to search and borrow items."
  - type: "person"
    name: "Librarian"
    description: "External actor managing cataloguing, inventory, and circulation."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system for SSO authentication using OAuth2/OIDC."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system for processing fines and fees."
  - type: "externalSystem"
    name: "Notification Provider"
    description: "External system for sending circulation alerts."
  - type: "container"
    name: "Web Frontend"
    technology: "React SPA, Nginx"
    description: "Provides cataloging, circulation, and self-service portals for users."
  - type: "container"
    name: "API Gateway"
    technology: "Spring Cloud Gateway"
    description: "Handles ingress routing, rate limiting, and OAuth2/OIDC validation."
  - type: "container"
    name: "Catalogue Service"
    technology: "Spring Boot, Java 21"
    description: "Manages catalog data and search capabilities."
  - type: "container"
    name: "Circulation Service"
    technology: "Spring Boot, Java 21"
    description: "Manages borrowing, returns, and circulation workflows."
  - type: "container"
    name: "Notification Service"
    technology: "Spring Boot, Java 21"
    description: "Handles internal notification processing and messaging."
  - type: "container"
    name: "PostgreSQL"
    technology: "PostgreSQL"
    description: "Relational data store for structured catalogue and circulation data."
  - type: "container"
    name: "Elasticsearch"
    technology: "Elasticsearch"
    description: "Dedicated search engine ensuring sub-800ms search responses."
  - type: "container"
    name: "RabbitMQ"
    technology: "RabbitMQ"
    description: "Asynchronous message broker with dead-letter exchanges."
relationships:
  - source: "Library Patron"
    destination: "Web Frontend"
    description: "Accesses self-service portals"
    technology: "HTTPS/REST, WebSockets"
  - source: "Librarian"
    destination: "Web Frontend"
    description: "Manages cataloging and circulation"
    technology: "HTTPS/REST, WebSockets"
  - source: "Web Frontend"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "Catalogue Service"
    description: "Routes catalogue requests"
    technology: "gRPC with mTLS, propagated JWTs"
  - source: "API Gateway"
    destination: "Circulation Service"
    description: "Routes circulation requests"
    technology: "gRPC with mTLS, propagated JWTs"
  - source: "API Gateway"
    destination: "Notification Service"
    description: "Routes notification requests"
    technology: "gRPC with mTLS, propagated JWTs"
  - source: "Catalogue Service"
    destination: "PostgreSQL"
    description: "Reads and writes catalogue data"
    technology: "Encrypted database protocols (AES-256)"
  - source: "Catalogue Service"
    destination: "Elasticsearch"
    description: "Indexes and searches catalogue items"
    technology: "Encrypted database protocols (AES-256)"
  - source: "Circulation Service"
    destination: "PostgreSQL"
    description: "Reads and writes circulation data"
    technology: "Encrypted database protocols (AES-256)"
  - source: "Circulation Service"
    destination: "RabbitMQ"
    description: "Publishes asynchronous messages"
    technology: "AMQP over TLS"
  - source: "Notification Service"
    destination: "RabbitMQ"
    description: "Consumes messages for alerts"
    technology: "AMQP over TLS"
  - source: "Catalogue Service"
    destination: "Identity Provider (IdP)"
    description: "Validates authentication and tokens"
    technology: "TLS 1.3"
  - source: "Circulation Service"
    destination: "Payment Gateway"
    description: "Processes fines and fees"
    technology: "TLS 1.3"
  - source: "Notification Service"
    destination: "Notification Provider"
    description: "Sends external notifications"
    technology: "TLS 1.3"