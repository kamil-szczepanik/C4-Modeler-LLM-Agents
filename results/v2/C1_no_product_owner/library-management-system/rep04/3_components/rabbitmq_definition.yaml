level: component
scope: "Component diagram for the RabbitMQ container"
parentContainer:
  name: "RabbitMQ"
elements:
  - type: "component"
    name: "AMQP Protocol Adapter"
    technology: "Erlang/RabbitMQ Core, AMQP 0-9-1, TLS"
    description: "Accepts incoming AMQP connections, secures communication via mTLS, and parses protocol frames."
  - type: "component"
    name: "Exchanges Component"
    technology: "Erlang/RabbitMQ Core"
    description: "Routes incoming messages from the protocol adapter to appropriate queues based on bindings and routing keys."
  - type: "component"
    name: "Queues Component"
    technology: "RabbitMQ Quorum Queues, Raft consensus"
    description: "Holds message payloads in persistent queues across three availability zones for zero data loss."
  - type: "component"
    name: "DLX & Routing Component"
    technology: "Erlang/RabbitMQ Core"
    description: "Forwards failed, rejected, or expired messages to dead-letter queues."
  - type: "component"
    name: "Persistent Storage Volume"
    technology: "Containerized EU-bound persistent volumes"
    description: "Provides durable, EU-compliant disk storage for message persistence."
  - type: "component"
    name: "Alerting and Log Forwarding Component"
    technology: "Erlang/RabbitMQ Core, Log forwarder"
    description: "Monitors broker health, collects operational metrics, and forwards logs for system observability."
relationships:
  - source: "AMQP Protocol Adapter"
    destination: "Exchanges Component"
    description: "Routes messages [Internal Erlang messaging]"
  - source: "Exchanges Component"
    destination: "Queues Component"
    description: "Routes messages to persistent queues [Internal Erlang messaging]"
  - source: "Queues Component"
    destination: "DLX & Routing Component"
    description: "Forwards failed/expired messages [Internal Erlang messaging]"
  - source: "DLX & Routing Component"
    destination: "Queues Component"
    description: "Routes to dead-letter queues [Internal Erlang messaging]"