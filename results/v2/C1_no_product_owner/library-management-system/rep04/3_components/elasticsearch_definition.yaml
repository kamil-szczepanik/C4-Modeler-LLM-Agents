level: component
scope: "Component diagram for the Elasticsearch container"
parentContainer:
  name: "Elasticsearch"
elements:
  - type: "component"
    name: "Search API"
    technology: "Java/Lucene REST API"
    description: "Powers the search endpoint implementation."
  - type: "component"
    name: "Security Interceptor"
    technology: "Java"
    description: "Validates JWT and permissions."
  - type: "component"
    name: "Query Caching Layer"
    technology: "In-memory Java API"
    description: "Caches query results for performance optimization."
  - type: "component"
    name: "Lucene Index Engine"
    technology: "Apache Lucene"
    description: "Provides core indexing and full-text retrieval."
  - type: "component"
    name: "Cluster Coordinator"
    technology: "Zen Discovery"
    description: "Manages cluster coordination and state."
relationships:
  - source: "Catalogue Service"
    destination: "Search API"
    description: "Indexes and searches catalogue items [HTTP/REST over TLS 1.3 with mTLS]"
  - source: "Search API"
    destination: "Search API"
    description: "Validates JWT and permissions before cache check [In-memory]"
  - source: "Search API"
    destination: "Lucene Index Engine"
    description: "Executes uncached queries [In-memory Java API]"
  - source: "Cluster Coordinator"
    destination: "Cluster Coordinator"
    description: "Manages node communication [TLS 1.3]"