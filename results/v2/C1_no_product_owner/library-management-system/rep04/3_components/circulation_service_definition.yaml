level: component
scope: "Component diagram for the Circulation Service container"
parentContainer:
  name: "Circulation Service"
elements:
  - type: "component"
    name: "Circulation Controller"
    technology: "Java/gRPC"
    description: "Exposes gRPC endpoints."
  - type: "component"
    name: "Borrowing Engine"
    technology: "Spring Service / Java 21"
    description: "Manages loan logic including the Loan Rule Engine using the Specification Pattern."
  - type: "component"
    name: "Fine Management Component"
    technology: "Resilience4j"
    description: "Handles fee calculations with circuit breaking."
  - type: "component"
    name: "Circulation DAO"
    technology: "Spring Data JPA / Hibernate"
    description: "Manages persistence."
  - type: "component"
    name: "Outbox Pattern Component"
    technology: "Java"
    description: "Guarantees reliable messaging via local transactions."
  - type: "component"
    name: "Event Publisher"
    technology: "Spring AMQP"
    description: "Publishes domain events."
  - type: "component"
    name: "API Gateway"
    technology: "gRPC with mTLS, JWT"
    description: "External system routing requests."
  - type: "component"
    name: "PostgreSQL"
    technology: "Encrypted database protocols, AES-256"
    description: "Primary transactional data store."
  - type: "component"
    name: "RabbitMQ"
    technology: "AMQP over TLS"
    description: "Message broker for asynchronous event distribution."
  - type: "component"
    name: "Payment Gateway"
    technology: "TLS 1.3"
    description: "Processes fees."
relationships:
  - source: "API Gateway"
    destination: "Circulation Controller"
    description: "Routes requests [gRPC with mTLS, JWT]"
  - source: "Circulation DAO"
    destination: "PostgreSQL"
    description: "Persists data [Encrypted database protocols, AES-256]"
  - source: "Event Publisher"
    destination: "RabbitMQ"
    description: "Publishes messages [AMQP over TLS]"
  - source: "Fine Management Component"
    destination: "Payment Gateway"
    description: "Processes fees [TLS 1.3]"