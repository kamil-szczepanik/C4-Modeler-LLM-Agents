level: component
scope: "Component diagram for the Catalogue Service container"
parentContainer:
  name: "Catalogue Service"
elements:
  - type: "component"
    name: "Catalogue Controller"
    technology: "Spring Boot / Java 21"
    description: "Handles incoming gRPC requests from the API Gateway with mTLS and propagated JWTs."
  - type: "component"
    name: "Catalogue Manager"
    technology: "Spring Boot / Java 21"
    description: "Manages core business logic and dispatches domain events."
  - type: "component"
    name: "Search Component"
    technology: "Spring Boot / Java 21"
    description: "Handles high-performance search queries and consumes events from RabbitMQ."
  - type: "component"
    name: "Repository Component"
    technology: "Spring Data JPA / Java 21"
    description: "Manages relational persistence with PostgreSQL using encrypted database protocols."
  - type: "component"
    name: "Outbox Publisher Component"
    technology: "Spring Boot / Java 21"
    description: "Publishes domain events asynchronously using the outbox pattern."
relationships:
  - source: "Catalogue Controller"
    destination: "Catalogue Manager"
    description: "Delegates requests"
  - source: "Catalogue Manager"
    destination: "Search Component"
    description: "In-memory Java method calls"
  - source: "Catalogue Manager"
    destination: "Outbox Publisher Component"
    description: "In-memory domain event dispatch"
  - source: "Outbox Publisher Component"
    destination: "RabbitMQ"
    description: "AMQP over TLS 1.3"
  - source: "RabbitMQ"
    destination: "Search Component"
    description: "Event consumer listener over TLS 1.3"
  - source: "Search Component"
    destination: "Elasticsearch"
    description: "Bolt/REST over TLS 1.3"
  - source: "Repository Component"
    destination: "PostgreSQL"
    description: "Encrypted database protocols (AES-256)"
  - source: "Catalogue Controller"
    destination: "Identity Provider (IdP)"
    description: "TLS 1.3"