level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "Relational Engine"
    technology: "PostgreSQL 16, Kubernetes StatefulSets, CloudNativePG"
    description: "Core relational engine for ACID transactions, data storage, high availability, and automated failover."
  - type: "component"
    name: "Storage Subspace"
    technology: "File I/O, AES-256, TDE"
    description: "Manages encrypted physical file storage while enforcing strict EU data residency constraints."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Manages database connections to prevent thread exhaustion from microservices."
  - type: "component"
    name: "Schema Partitioning Component"
    technology: "Logical isolation"
    description: "Provides logical schema separation within the database."
  - type: "component"
    name: "Audit Logging Component"
    technology: "pgaudit, pgcrypto"
    description: "Handles compliance auditing and column-level encryption for GDPR."
  - type: "component"
    name: "Catalogue Service"
    technology: "Microservice"
    description: "External service querying the catalogue data."
  - type: "component"
    name: "Circulation Service"
    technology: "Microservice"
    description: "External service managing circulation data."
relationships:
  - source: "Catalogue Service"
    destination: "Connection Pooler"
    description: "SQL/TCP [TLS 1.3, mTLS, SCRAM-SHA-256]"
  - source: "Circulation Service"
    destination: "Connection Pooler"
    description: "SQL/TCP [TLS 1.3, mTLS, SCRAM-SHA-256]"
  - source: "Connection Pooler"
    destination: "Relational Engine"
    description: "Inter-process socket [TLS 1.3]"
  - source: "Relational Engine"
    destination: "Storage Subspace"
    description: "File I/O [AES-256, TDE]"
  - source: "Relational Engine"
    destination: "Schema Partitioning Component"
    description: "Logical isolation [Internal]"