level: component
scope: "Component diagram for the Notification Service container"
parentContainer:
  name: "Notification Service"
elements:
  - type: "component"
    name: "Notification Controller"
    technology: "Spring Web/gRPC"
    description: "Handles incoming gRPC requests with mTLS and propagated JWTs."
  - type: "component"
    name: "Event Consumer / Listener"
    technology: "Spring AMQP"
    description: "Consumes asynchronous events from RabbitMQ over TLS."
  - type: "component"
    name: "Template Engine"
    technology: "Thymeleaf"
    description: "Secure template engine enforcing strict escaping to prevent SSTI."
  - type: "component"
    name: "Dispatch Engine"
    technology: "Java 21 Service Layer"
    description: "Core service layer managing the dispatch logic and transactional rules."
  - type: "component"
    name: "Provider Integration Client"
    technology: "Spring WebClient with Resilience4j"
    description: "Communicates with external notification providers using circuit breakers."
  - type: "component"
    name: "Outbox Table"
    technology: "PostgreSQL with JPA/Hibernate"
    description: "Relational database utilizing the Outbox Pattern for reliable transactional messaging."
  - type: "component"
    name: "RabbitMQ"
    technology: "Message Broker"
    description: "Asynchronous message broker for handling event-driven alerts."
  - type: "component"
    name: "Notification Provider"
    technology: "External API"
    description: "External API for delivering notifications via outbound REST over TLS 1.3."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "Secret Management"
    description: "Secure secret retrieval service for managing credentials."
relationships:
  - source: "API Gateway"
    destination: "Notification Controller"
    description: "gRPC with mTLS and propagated JWTs"
  - source: "Event Consumer / Listener"
    destination: "RabbitMQ"
    description: "AMQP over TLS"
  - source: "Notification Controller"
    destination: "Outbox Table"
    description: "JDBC over TLS"
  - source: "Event Consumer / Listener"
    destination: "Outbox Table"
    description: "JDBC over TLS"
  - source: "Dispatch Engine"
    destination: "Provider Integration Client"
    description: "In-process Java method calls"
  - source: "Provider Integration Client"
    destination: "Notification Provider"
    description: "Outbound REST over TLS 1.3"
  - source: "Provider Integration Client"
    destination: "HashiCorp Vault"
    description: "Secure secret retrieval"