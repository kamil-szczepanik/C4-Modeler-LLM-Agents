level: component
scope: "Component diagram for the Web Frontend container"
parentContainer:
  name: "Web Frontend"
elements:
  - type: "component"
    name: "Routing & Shell Component"
    technology: "React Router, React"
    description: "Provides UI framework, client-side routing, and shell components for the application."
  - type: "component"
    name: "Catalog Component"
    technology: "React, TanStack Query"
    description: "Handles cataloging interfaces and ensures search responses remain under 800 ms via client-side caching and pagination."
  - type: "component"
    name: "Circulation Component"
    technology: "React"
    description: "Manages circulation and self-service portal workflows."
  - type: "component"
    name: "API Client Component"
    technology: "Axios"
    description: "Handles HTTP and WebSocket transport, injecting W3C Trace Context headers and managing HttpOnly cookies."
  - type: "component"
    name: "Auth & Session Component"
    technology: "React"
    description: "Manages user sessions, authentication, and secure cookie management."
relationships:
  - source: "Routing & Shell Component"
    destination: "Catalog Component"
    description: "Renders"
  - source: "Routing & Shell Component"
    destination: "Circulation Component"
    description: "Renders"
  - source: "Catalog Component"
    destination: "API Client Component"
    description: "Sends API requests"
  - source: "Circulation Component"
    destination: "API Client Component"
    description: "Sends API requests"
  - source: "Auth & Session Component"
    destination: "API Client Component"
    description: "Manages credentials/tokens for"