# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing & Dispatcher Component"
    technology: "Spring Cloud Gateway Core, Java 21"
    description: "Enforces security policies and high-performance request dispatching to satisfy strict EU data residency and sub-800ms search latency requirements."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Spring Security OAuth2 Resource Server, Java 21"
    description: "Validates user sessions and handles OIDC token validation and audience checks."
  - type: "component"
    name: "Rate Limiting & Throttling Filter"
    technology: "Redis-backed Token Bucket, Java 21"
    description: "Provides traffic throttling and rate limiting using a localized Redis cluster instance for EU nodes."
  - type: "component"
    name: "Resilience & Circuit Breaker Filter"
    technology: "Resilience4j, Java 21"
    description: "Implements circuit breakers and bulkheading for downstream fault tolerance."
  - type: "container"
    name: "Web Frontend"
    technology: "Web Technologies"
    description: "Sends API requests via HTTPS/REST with TLS 1.3."
  - type: "container"
    name: "Catalogue Service"
    technology: "Microservice"
    description: "Downstream service receiving protected calls via gRPC with mTLS."
  - type: "container"
    name: "Circulation Service"
    technology: "Microservice"
    description: "Downstream service receiving protected calls via gRPC with mTLS."
  - type: "container"
    name: "Notification Service"
    technology: "Microservice"
    description: "Downstream service receiving protected calls via gRPC with mTLS."
  - type: "system"
    name: "IdP"
    technology: "Identity Provider"
    description: "Provides authentication and tokens."
relationships:
  - source: "Web Frontend"
    destination: "Authentication & Authorization Filter"
    description: "Validates user sessions via [HTTPS/REST]"
  - source: "Authentication & Authorization Filter"
    destination: "Routing & Dispatcher Component"
    description: "Forwards validated requests via [Internal Java Method Call]"
  - source: "Routing & Dispatcher Component"
    destination: "Resilience & Circuit Breaker Filter"
    description: "Passes requests for fault-tolerance checks via [Internal Java Method Call]"
  - source: "Resilience & Circuit Breaker Filter"
    destination: "Catalogue Service"
    description: "Routes protected calls via [gRPC with mTLS, propagated JWTs, OpenTelemetry headers]"
  - source: "Resilience & Circuit Breaker Filter"
    destination: "Circulation Service"
    description: "Routes protected calls via [gRPC with mTLS, propagated JWTs, OpenTelemetry headers]"
  - source: "Resilience & Circuit Breaker Filter"
    destination: "Notification Service"
    description: "Routes protected calls via [gRPC with mTLS, propagated JWTs, OpenTelemetry headers]"