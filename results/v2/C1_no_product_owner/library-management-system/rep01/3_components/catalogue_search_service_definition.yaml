level: component
scope: "Component diagram for the Catalogue & Search Service container"
parentContainer:
  name: "Catalogue & Search Service"
elements:
  - type: "component"
    name: "Catalogue Management Component"
    technology: "Spring Data JPA / PostgreSQL"
    description: "Service for item CRUD operations."
  - type: "component"
    name: "Search Query Component"
    technology: "High-level REST client service / Elasticsearch"
    description: "Executes low-latency searches against Elasticsearch."
  - type: "component"
    name: "Search Indexer Component"
    technology: "Spring Kafka consumer"
    description: "Handles asynchronous event synchronization with a Dead-Letter Queue (DLQ)."
relationships:
  - source: "API Gateway"
    destination: "Catalogue Management Component"
    description: "gRPC with mTLS and JWT claims"
  - source: "API Gateway"
    destination: "Search Query Component"
    description: "gRPC with mTLS"
  - source: "Search Indexer Component"
    destination: "Apache Kafka (AWS MSK)"
    description: "Consumes domain events [Avro over mTLS with DLQ]"
  - source: "Search Query Component"
    destination: "Elasticsearch"
    description: "Executes search queries [Internal VPC TCP with TLS 1.3]"
  - source: "Catalogue Management Component"
    destination: "Database"
    description: "Reads/writes relational data [JDBC over Internal VPC TCP with TLS 1.3]"