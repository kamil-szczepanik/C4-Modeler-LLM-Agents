level: component
scope: "Component diagram for the Web Application container"
parentContainer:
  name: "Web Application"
elements:
  - type: "component"
    name: "Router & Layout Component"
    technology: "React Router"
    description: "Renders patron and staff views."
  - type: "component"
    name: "Authentication & Session Manager"
    technology: "OAuth2/OIDC, HttpOnly cookies"
    description: "Manages user authentication and session security."
  - type: "component"
    name: "Catalogue & Search UI Module"
    technology: "TanStack Query / React Query"
    description: "Handles high-performance catalog searches and client-side caching."
  - type: "component"
    name: "Circulation & Self-Service Portal Module"
    technology: "TanStack Query"
    description: "Manages circulation and self-service portal functionality."
  - type: "component"
    name: "API Client"
    technology: "Axios / Fetch with Zod validation"
    description: "Sends validated payloads to the backend API Gateway."
  - type: "component"
    name: "Performance Monitoring and Real User Monitoring"
    technology: "OpenTelemetry, AWS CloudWatch Synthetics"
    description: "Tracks Real User Monitoring and Core Web Vitals."
  - type: "component"
    name: "AWS CloudFront Frankfurt"
    technology: "CDN edge"
    description: "Serves static assets and application ensuring EU-only data residency."
relationships:
  - source: "AWS CloudFront Frankfurt"
    destination: "Router & Layout Component"
    description: "Serves static assets and application [HTTPS / TLS 1.3]"
  - source: "Router & Layout Component"
    destination: "Catalogue & Search UI Module"
    description: "Renders patron and staff views [React Context/Props]"
  - source: "Router & Layout Component"
    destination: "Circulation & Self-Service Portal Module"
    description: "Renders patron and staff views [React Context/Props]"
  - source: "Catalogue & Search UI Module"
    destination: "API Client"
    description: "Sends validated payloads [TypeScript function calls]"
  - source: "Circulation & Self-Service Portal Module"
    destination: "API Client"
    description: "Sends validated payloads [TypeScript function calls]"
  - source: "API Client"
    destination: "API Gateway"
    description: "Communicates with backend [HTTPS / REST, Frankfurt endpoints]"