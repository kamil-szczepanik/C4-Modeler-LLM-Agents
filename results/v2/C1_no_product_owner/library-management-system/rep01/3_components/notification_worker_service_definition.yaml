level: component
scope: "Component diagram for the Notification Worker Service container"
parentContainer:
  name: "Notification Worker Service"
elements:
  - type: "component"
    name: "Kafka Consumer Component"
    technology: "Go, segmentio/kafka-go"
    description: "Consumes alert events from Apache Kafka via Avro/JSON over TLS."
  - type: "component"
    name: "Template Engine Component"
    technology: "Go, text/template"
    description: "Processes and renders raw events in-memory."
  - type: "component"
    name: "Dispatch Adapter Component"
    technology: "Go, net/http"
    description: "Dispatches outbound HTTPS notifications to external services via egress proxy."
  - type: "component"
    name: "Retry & DLQ Manager Component"
    technology: "Go"
    description: "Manages retry logic and publishes PII-scrubbed poison-pill events to DLQ topic."
  - type: "container"
    name: "Apache Kafka (AWS MSK)"
    technology: "Apache Kafka / AWS MSK"
    description: "Provides reliable asynchronous event streaming."
  - type: "container"
    name: "External Notification Service"
    technology: "HTTPS"
    description: "External service delivering notifications to patrons and staff."
  - type: "container"
    name: "AWS Secrets Manager"
    technology: "AWS"
    description: "Stores secrets and credentials securely."
relationships:
  - source: "Kafka Consumer Component"
    destination: "Apache Kafka (AWS MSK)"
    description: "Consumes alert events via Avro/JSON over TLS (mTLS + SCRAM-SHA-512)"
  - source: "Kafka Consumer Component"
    destination: "Template Engine Component"
    description: "Passes raw events in-memory"
  - source: "Template Engine Component"
    destination: "Dispatch Adapter Component"
    description: "Passes rendered payloads in-memory"
  - source: "Dispatch Adapter Component"
    destination: "External Notification Service"
    description: "Dispatches outbound HTTPS notifications via egress proxy"
  - source: "Retry & DLQ Manager Component"
    destination: "Apache Kafka (AWS MSK)"
    description: "Publishes PII-scrubbed poison-pill events to DLQ topic over TLS"