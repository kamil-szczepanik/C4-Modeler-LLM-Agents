level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing Engine"
    technology: "Kong Core (Node.js)"
    description: "Path-based gRPC routing to downstream services."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Lua / Kong Plugin"
    description: "Stateless cryptographic JWT validation via cached JWKS."
  - type: "component"
    name: "Rate Limiting & Throttling Module"
    technology: "Redis-backed Kong Plugin"
    description: "Multi-AZ Redis instance enforcing traffic thresholds in AWS Frankfurt."
  - type: "component"
    name: "Observability & Tracing Agent"
    technology: "Kong OTel Plugin"
    description: "Injects W3C Trace Context headers."
relationships:
  - source: "Web Application"
    destination: "Routing Engine"
    description: "Sends API requests [HTTPS / REST]"
  - source: "Routing Engine"
    destination: "Catalogue & Search Service"
    description: "Routes search queries [gRPC with mTLS]"
  - source: "Routing Engine"
    destination: "Circulation & User Service"
    description: "Routes user requests [gRPC with mTLS]"
  - source: "Routing Engine"
    destination: "Apache Kafka (AWS MSK)"
    description: "Publishes audit logs and access metrics [TCP / SASL_SSL]"
  - source: "Observability & Tracing Agent"
    destination: "AWS CloudWatch / OpenTelemetry Collector"
    description: "Exports traces and metrics [OTLP / gRPC]"