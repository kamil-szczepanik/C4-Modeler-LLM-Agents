level: component
scope: "Component diagram for the Apache Kafka (AWS MSK) container"
parentContainer:
  name: "Apache Kafka (AWS MSK)"
elements:
  - type: "component"
    name: "Zookeeper / KRaft Metadata Controller Quorum"
    technology: "Apache Zookeeper / KRaft"
    description: "Manages cluster metadata and broker coordination."
  - type: "component"
    name: "Kafka Broker Nodes (Managed MSK)"
    technology: "AWS MSK"
    description: "Stateless/Stateful message storage nodes handling partition leaders across 3 Availability Zones."
  - type: "component"
    name: "Schema Registry"
    technology: "AWS Glue / Managed"
    description: "Enforces Avro schema validation for domain events."
  - type: "component"
    name: "Catalogue & Search Service"
    technology: "Event Producer/Consumer"
    description: "Publishes and consumes event streams for library cataloging and search."
  - type: "component"
    name: "Circulation & User Service"
    technology: "Event Producer/Consumer"
    description: "Publishes and consumes event streams for library circulation and user management."
  - type: "component"
    name: "Notification Worker Service"
    technology: "Event Consumer"
    description: "Consumes event streams to dispatch notifications."
relationships:
  - source: "Catalogue & Search Service"
    destination: "Kafka Broker Nodes (Managed MSK)"
    description: "Publishes and consumes event streams via Apache Kafka Binary Protocol over TLS 1.3 [TCP Port 9094]"
  - source: "Circulation & User Service"
    destination: "Kafka Broker Nodes (Managed MSK)"
    description: "Publishes and consumes event streams via Apache Kafka Binary Protocol over TLS 1.3 [TCP Port 9094]"
  - source: "Notification Worker Service"
    destination: "Kafka Broker Nodes (Managed MSK)"
    description: "Publishes and consumes event streams via Apache Kafka Binary Protocol over TLS 1.3 [TCP Port 9094]"
  - source: "Kafka Broker Nodes (Managed MSK)"
    destination: "Schema Registry"
    description: "Validates event schemas dynamically during serialization [HTTPS/REST over TLS]"
  - source: "Kafka Broker Nodes (Managed MSK)"
    destination: "Zookeeper / KRaft Metadata Controller Quorum"
    description: "Internal cluster state synchronization [TCP]"