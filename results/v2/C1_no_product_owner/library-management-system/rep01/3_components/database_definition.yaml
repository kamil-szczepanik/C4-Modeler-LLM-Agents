level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Manages incoming TCP connections, routing transactional queries and preventing starvation to meet P99 latency <800ms."
  - type: "component"
    name: "Relational Data Store"
    technology: "PostgreSQL 15, AWS RDS (Frankfurt), AWS Secrets Manager, Terraform/OpenTofu, Flyway/Liquibase"
    description: "Securely stores and manages relational data for inventory and user transactions, ensuring ACID compliance and strict EU data residency."
relationships:
  - source: "Connection Pooler"
    destination: "Relational Data Store"
    description: "Forwards pooled queries [Encrypted Local TCP, Unix Domain Sockets]"