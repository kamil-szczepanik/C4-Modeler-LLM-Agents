level: component
scope: "Component diagram for the Circulation & User Service container"
parentContainer:
  name: "Circulation & User Service"
elements:
  - type: "component"
    name: "Loan Management Component"
    technology: "Go, Chi/standard library"
    description: "Manages high-throughput loan operations."
  - type: "component"
    name: "Patron Profile Component"
    technology: "Go"
    description: "Manages patron profiles and user details."
  - type: "component"
    name: "Fine & Fee Component"
    technology: "Go"
    description: "Handles fines, fees, and external payment processing."
  - type: "component"
    name: "Circulation Event Publisher/Consumer Component"
    technology: "Go, segmentio/kafka-go"
    description: "Publishes and consumes domain events using Avro over Kafka."
relationships:
  - source: "Loan Management Component"
    destination: "PostgreSQL Database"
    description: "Reads/writes relational data via pgx over Internal VPC TCP with TLS"
  - source: "Patron Profile Component"
    destination: "PostgreSQL Database"
    description: "Reads/writes relational data via pgx over Internal VPC TCP with TLS"
  - source: "Fine & Fee Component"
    destination: "PostgreSQL Database"
    description: "Reads/writes relational data via pgx over Internal VPC TCP with TLS"
  - source: "Circulation Event Publisher/Consumer Component"
    destination: "Apache Kafka (AWS MSK)"
    description: "Publishes and consumes domain events using Avro over TLS with SASL/SCRAM and ACLs"
  - source: "Fine & Fee Component"
    destination: "External Payment Gateway"
    description: "Executes transactions via HTTPS/REST using tokenized payment methods over TLS 1.3"