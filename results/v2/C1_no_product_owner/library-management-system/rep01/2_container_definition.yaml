level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons & Staff"
    description: "End-users interacting via self-service portals and staff interfaces."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "Handles payment processing securely."
  - type: "externalSystem"
    name: "Digital Repository / DRM Provider"
    description: "Provides digital assets and DRM management."
  - type: "externalSystem"
    name: "External Notification Service"
    description: "Sends asynchronous alerts to users."
  - type: "externalSystem"
    name: "AWS CloudFront Frankfurt"
    description: "CDN serving the Single Page Application."
  - type: "container"
    name: "Web Application"
    technology: "React, TypeScript, AWS CloudFront Frankfurt"
    description: "Single Page Application providing client interfaces for patrons and staff."
  - type: "container"
    name: "API Gateway"
    technology: "Kong, Node.js"
    description: "Reverse proxy handling client entry, token validation, and secure traffic."
  - type: "container"
    name: "Catalogue & Search Service"
    technology: "Java, Spring Boot, Elasticsearch"
    description: "High-throughput service for cataloging and searching items."
  - type: "container"
    name: "Circulation & User Service"
    technology: "Go, Spring Boot"
    description: "Service managing loans and patrons."
  - type: "container"
    name: "Notification Worker Service"
    technology: "Go"
    description: "Background worker processing asynchronous alerts."
  - type: "container"
    name: "Apache Kafka (AWS MSK)"
    technology: "Apache Kafka, AWS MSK"
    description: "Event-driven broker for decoupled domain events."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL"
    description: "Managed relational database cluster."
relationships:
  - source: "Library Patrons & Staff"
    destination: "AWS CloudFront Frankfurt"
    description: "Interacts with user interfaces"
    technology: "HTTPS"
  - source: "AWS CloudFront Frankfurt"
    destination: "Web Application"
    description: "Serves static assets and application"
    technology: "HTTPS"
  - source: "Web Application"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS / REST"
  - source: "API Gateway"
    destination: "Catalogue & Search Service"
    description: "Routes catalogue and search queries"
    technology: "gRPC with mTLS"
  - source: "API Gateway"
    destination: "Circulation & User Service"
    description: "Routes circulation and user requests"
    technology: "gRPC with mTLS"
  - source: "Catalogue & Search Service"
    destination: "Apache Kafka (AWS MSK)"
    description: "Publishes and consumes domain events"
    technology: "Avro/JSON over TLS"
  - source: "Circulation & User Service"
    destination: "Apache Kafka (AWS MSK)"
    description: "Publishes and consumes domain events"
    technology: "Avro/JSON over TLS"
  - source: "Notification Worker Service"
    destination: "Apache Kafka (AWS MSK)"
    description: "Consumes asynchronous alert events"
    technology: "Avro/JSON over TLS"
  - source: "Catalogue & Search Service"
    destination: "Database"
    description: "Reads and writes relational data"
    technology: "Internal VPC TCP"
  - source: "Circulation & User Service"
    destination: "Database"
    description: "Reads and writes relational data"
    technology: "Internal VPC TCP"
  - source: "Catalogue & Search Service"
    destination: "Database"
    description: "Backs search capabilities with Elasticsearch"
    technology: "Internal VPC TCP"
  - source: "Notification Worker Service"
    destination: "External Notification Service"
    description: "Dispatches external notifications with strict egress filtering"
    technology: "Outbound HTTPS"
  - source: "Circulation & User Service"
    destination: "External Payment Gateway"
    description: "Processes payments"
    technology: "HTTPS / REST"
  - source: "Catalogue & Search Service"
    destination: "Digital Repository / DRM Provider"
    description: "Manages digital assets and DRM"
    technology: "HTTPS / REST"