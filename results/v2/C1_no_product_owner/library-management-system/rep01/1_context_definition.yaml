level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Provides cataloging, circulation, and self-service portals for public and academic libraries, hosted exclusively within the EU for data residency compliance."
elements:
  - type: "person"
    name: "Library Patrons & Staff"
    description: "Users who interact with the library catalog, circulation, and self-service portals."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "Handles payment processing securely, PCI-DSS scoped."
  - type: "externalSystem"
    name: "Digital Repository / DRM Provider"
    description: "Provides digital assets and DRM management asynchronously."
  - type: "externalSystem"
    name: "External Notification Service"
    description: "Sends notifications to users using mTLS and API keys."
  - type: "externalSystem"
    name: "AWS CloudFront Frankfurt"
    description: "CDN and edge service providing edge caching, WAF protection, and DDoS mitigation."
relationships:
  - source: "Library Patrons & Staff"
    destination: "AWS CloudFront Frankfurt"
    description: "Accesses the system securely via edge"
    technology: "HTTPS/TLS 1.3, OAuth 2.0/OIDC"
  - source: "AWS CloudFront Frankfurt"
    destination: "Library Management System"
    description: "Forwards requests to the core system"
    technology: "HTTPS/TLS 1.3"
  - source: "Library Management System"
    destination: "External Payment Gateway"
    description: "Processes transactions"
    technology: "REST/TLS, PCI-DSS scoped"
  - source: "Library Management System"
    destination: "Digital Repository / DRM Provider"
    description: "Retrieves digital assets"
    technology: "Asynchronous REST/TLS"
  - source: "Library Management System"
    destination: "External Notification Service"
    description: "Dispatches notifications"
    technology: "mTLS and API keys"