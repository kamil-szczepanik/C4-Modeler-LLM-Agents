# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Core software system for public and academic libraries handling cataloging, circulation, search, and self-service portals with strict EU-only data residency and sub-800ms 99th-percentile search performance."
elements:
  - type: "person"
    name: "Patron"
    description: "End-user interacting via self-service portals to access library services."
  - type: "person"
    name: "Librarian / Staff"
    description: "Internal users managing inventory and circulation desk operations."
  - type: "externalSystem"
    name: "Authentication Provider"
    description: "External SaaS/IDP managing OIDC/OAuth2 federation, MFA for staff, and cryptographically signed JWTs."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "Handles fines and fees processing via tokenization and secure iframes."
  - type: "externalSystem"
    name: "National Library Registry"
    description: "External authority for ISBN and metadata syncing with local fallback mechanisms."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Manages transactional emails and SMS via REST/HTTPS."
relationships:
  - source: "Patron"
    destination: "Library Management System"
    description: "Uses self-service portals and catalogs"
    technology: "HTTPS"
  - source: "Librarian / Staff"
    destination: "Library Management System"
    description: "Manages inventory and circulation desk operations"
    technology: "HTTPS"
  - source: "Library Management System"
    destination: "Authentication Provider"
    description: "Integrates for identity federation"
    technology: "OIDC/HTTPS"
  - source: "Library Management System"
    destination: "External Payment Gateway"
    description: "Processes fines and fees via tokenization and secure iframes"
    technology: "REST/HTTPS with mTLS and TLS 1.3"
  - source: "Library Management System"
    destination: "Notification Service"
    description: "Manages transactional emails and SMS"
    technology: "REST/HTTPS with mTLS and TLS 1.3"
  - source: "Library Management System"
    destination: "National Library Registry"
    description: "Synchronizes ISBN and metadata with local fallback capabilities"
    technology: "HTTPS"