# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Patron"
    description: "End-user interacting via self-service portals to access library services."
  - type: "person"
    name: "Librarian / Staff"
    description: "Internal users managing inventory and circulation desk operations."
  - type: "externalSystem"
    name: "Authentication Provider"
    description: "External SaaS/IDP managing OIDC/OAuth2 federation, MFA for staff, and cryptographically signed JWTs."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "Handles fines and fees processing via tokenization and secure iframes."
  - type: "externalSystem"
    name: "National Library Registry"
    description: "External authority for ISBN and metadata syncing with local fallback mechanisms."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Manages transactional emails and SMS via REST/HTTPS."
  - type: "container"
    name: "Web App"
    technology: "React/TypeScript, Nginx"
    description: "Frontend UI delivery providing cataloguing, circulation, and self-service portals."
  - type: "container"
    name: "API Gateway"
    technology: "Kong/Spring Cloud Gateway"
    description: "Single entry point providing routing, rate limiting, and JWT validation."
  - type: "container"
    name: "Core Domain Service"
    technology: "Java/Spring Boot"
    description: "Handles core circulation, inventory, and cataloguing logic."
  - type: "container"
    name: "Search Service"
    technology: "Elasticsearch"
    description: "Fulfills high-performance search requirements (<800ms 99th-percentile)."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL"
    description: "Relational data storage with read replicas and automated failover."
  - type: "container"
    name: "Async Event Broker"
    technology: "Apache Kafka/RabbitMQ"
    description: "Asynchronous event publishing and decoupling with Dead Letter Queues (DLQs)."
  - type: "container"
    name: "Background Worker"
    technology: "Python/Celery or Node.js"
    description: "Processes background tasks and asynchronous worker workloads."
relationships:
  - source: "Patron"
    destination: "Web App"
    description: "Accesses self-service portals and catalogs"
    technology: "HTTPS"
  - source: "Librarian / Staff"
    destination: "Web App"
    description: "Manages inventory and circulation desk operations"
    technology: "HTTPS"
  - source: "Web App"
    destination: "API Gateway"
    description: "Sends API requests and page traffic"
    technology: "HTTPS/JSON"
  - source: "API Gateway"
    destination: "Core Domain Service"
    description: "Routes domain API requests"
    technology: "gRPC/Internal REST over mTLS"
  - source: "API Gateway"
    destination: "Search Service"
    description: "Routes search queries"
    technology: "gRPC/Internal REST over mTLS"
  - source: "Core Domain Service"
    destination: "Database"
    description: "Reads and writes relational data"
    technology: "JDBC/TLS 1.3 with mTLS"
  - source: "Core Domain Service"
    destination: "Async Event Broker"
    description: "Publishes domain events"
    technology: "AMQP/Kafka Protocol + TLS 1.3"
  - source: "Async Event Broker"
    destination: "Search Service"
    description: "Consumes events to update search indices"
    technology: "Consumer subscription over mTLS"
  - source: "Async Event Broker"
    destination: "Background Worker"
    description: "Consumes asynchronous background tasks"
    technology: "Consumer subscription over mTLS"
  - source: "Core Domain Service"
    destination: "Authentication Provider"
    description: "Validates and exchanges authentication tokens"
    technology: "OIDC/HTTPS"
  - source: "Core Domain Service"
    destination: "External Payment Gateway"
    description: "Processes fines and fees"
    technology: "REST/HTTPS with mTLS and TLS 1.3"
  - source: "Core Domain Service"
    destination: "Notification Service"
    description: "Triggers notifications"
    technology: "REST/HTTPS with mTLS and TLS 1.3"
  - source: "Core Domain Service"
    destination: "National Library Registry"
    description: "Syncs metadata and ISBNs"
    technology: "HTTPS"