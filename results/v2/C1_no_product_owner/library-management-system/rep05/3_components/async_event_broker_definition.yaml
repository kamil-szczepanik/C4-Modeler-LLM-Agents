level: component
scope: "Component diagram for the Async Event Broker container"
parentContainer:
  name: "Async Event Broker"
elements:
  - type: "component"
    name: "Event Router / Exchange"
    technology: "Apache Kafka Topics"
    description: "Routes events with replication factor 3 for reliable asynchronous processing."
  - type: "component"
    name: "Message Queue / Log Storage"
    technology: "Apache Kafka Clustered Brokers"
    description: "Appends messages to distributed commit logs for persistent event streams."
  - type: "component"
    name: "Dead Letter Queue (DLQ) Handler"
    technology: "Kafka DLQ Topic"
    description: "Dedicated Kafka DLQ topic with retention policies for failed event processing."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry"
    description: "Enforces backward and forward compatibility contracts and validates message schema compliance."
  - type: "component"
    name: "Core Domain Service"
    technology: "Java / Spring Boot"
    description: "Produces domain events and validates payload structure."
  - type: "component"
    name: "Search Service"
    technology: "Elasticsearch"
    description: "Consumes events to update search indices to meet performance targets."
  - type: "component"
    name: "Background Worker"
    technology: "Python/Celery or Node.js"
    description: "Consumes asynchronous background tasks."
relationships:
  - source: "Core Domain Service"
    destination: "Schema Registry"
    description: "Validates event payload structure [HTTP/2 + mTLS]"
  - source: "Core Domain Service"
    destination: "Event Router / Exchange"
    description: "Publishes domain events [Kafka Producer API / TCP + TLS 1.3]"
  - source: "Event Router / Exchange"
    destination: "Schema Registry"
    description: "Verifies message schema compliance on ingestion [Internal Protocol]"
  - source: "Event Router / Exchange"
    destination: "Message Queue / Log Storage"
    description: "Appends messages to distributed commit logs [Internal Broker Protocol]"
  - source: "Message Queue / Log Storage"
    destination: "Search Service"
    description: "Consumes events to update search indices [Kafka Consumer API over mTLS]"
  - source: "Message Queue / Log Storage"
    destination: "Background Worker"
    description: "Consumes asynchronous background tasks [Kafka Consumer API over mTLS]"