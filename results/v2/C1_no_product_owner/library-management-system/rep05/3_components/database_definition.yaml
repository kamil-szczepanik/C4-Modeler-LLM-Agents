level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Primary Database Instance"
    technology: "PostgreSQL 16"
    description: "Executes transactions and critical reads, providing ACID compliance and JSONB support."
  - type: "component"
    name: "Read Replica Instances"
    technology: "PostgreSQL 16 Standbys"
    description: "Executes catalog search and read-heavy queries."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Routes SQL queries and transactions and forwards pooled connections."
  - type: "component"
    name: "Kubernetes Operator"
    technology: "CloudNativePG"
    description: "Automates high-availability, failover, and EU region multi-AZ deployments."
  - type: "component"
    name: "Secrets Manager"
    technology: "HashiCorp Vault"
    description: "Manages short-lived dynamic database credentials and AES-256 TDE encryption keys."
  - type: "component"
    name: "Monitoring Tools"
    technology: "Prometheus, Grafana, PagerDuty"
    description: "Provides monitoring and alerting for the database architecture."
relationships:
  - source: "Connection Pooler"
    destination: "Primary Database Instance"
    description: "Forwards pooled connections [TCP/mTLS]"
  - source: "Connection Pooler"
    destination: "Read Replica Instances"
    description: "Forwards pooled connections [TCP/mTLS]"