level: component
scope: "Component diagram for the Web App container"
parentContainer:
  name: "Web App"
elements:
  - type: "component"
    name: "UI Router & State Management"
    technology: "React Router, Zustand"
    description: "Handles client-side routing with role-based guards, state management, and in-memory JWT storage."
  - type: "component"
    name: "Catalogue & Circulation Modules"
    technology: "React Components"
    description: "Components handling item browsing, search, checkouts, and renewals."
  - type: "component"
    name: "API Client"
    technology: "Axios"
    description: "Client for Kong/Spring Cloud Gateway communication with interceptors and CSRF mitigation."
  - type: "component"
    name: "Telemetry & Error Boundary Module"
    technology: "Sentry SDK"
    description: "Captures performance metrics and sanitizes errors for Sentry."
relationships:
  - source: "UI Router & State Management"
    destination: "Catalogue & Circulation Modules"
    description: "Delegates views [In-memory / React Props]"
  - source: "Catalogue & Circulation Modules"
    destination: "API Client"
    description: "Sends requests [In-memory]"
  - source: "API Client"
    destination: "API Gateway"
    description: "Communicates with backend [HTTPS/JSON]"
  - source: "Telemetry & Error Boundary Module"
    destination: "Sentry"
    description: "Transmits sanitized telemetry [HTTPS/JSON, EU region only]"