level: component
scope: "Component diagram for the Search Service container"
parentContainer:
  name: "Search Service"
elements:
  - type: "component"
    name: "Search API Controller"
    technology: "Java, Spring Data Elasticsearch"
    description: "Routes and handles incoming search queries."
  - type: "component"
    name: "Query Builder Component"
    technology: "Java, Spring Data Elasticsearch"
    description: "Builds and processes DSL queries from validated DTOs."
  - type: "component"
    name: "Index Synchronizer Component"
    technology: "Java, Spring Data Elasticsearch"
    description: "Consumes lifecycle events and synchronizes the search index."
  - type: "component"
    name: "Elasticsearch Client Wrapper"
    technology: "Java, Spring Data Elasticsearch with Resilience4j"
    description: "Wraps Elasticsearch client calls with resilience and error handling."
  - type: "component"
    name: "Elasticsearch Cluster"
    technology: "EU-hosted, encrypted-at-rest with CMK"
    description: "Stores and indexes library items for high-performance search."
relationships:
  - source: "API Gateway"
    destination: "Search API Controller"
    description: "Routes search queries via gRPC over mTLS"
  - source: "Async Event Broker"
    destination: "Index Synchronizer Component"
    description: "Consumes item lifecycle events via Apache Kafka consumer protocol"
  - source: "Search API Controller"
    destination: "Query Builder Component"
    description: "Passes validated DTOs via method calls"
  - source: "Query Builder Component"
    destination: "Elasticsearch Client Wrapper"
    description: "Executes DSL queries via Java method calls"
  - source: "Index Synchronizer Component"
    destination: "Elasticsearch Client Wrapper"
    description: "Executes bulk index operations via Java method calls"
  - source: "Elasticsearch Client Wrapper"
    destination: "Elasticsearch Cluster"
    description: "Executes read and write operations"