level: component
scope: "Component diagram for the Background Worker container"
parentContainer:
  name: "Background Worker"
elements:
  - type: "component"
    name: "Task Consumer"
    technology: "Celery Worker"
    description: "Consumes asynchronous background tasks, processes batch operations, and orchestrates workflows."
  - type: "component"
    name: "Task Router"
    technology: "Celery Router"
    description: "Dispatches incoming broker events based on task type."
  - type: "component"
    name: "Data Access Layer"
    technology: "SQLAlchemy"
    description: "Reads/Writes task state and domain data enforcing EU-only data residency."
  - type: "component"
    name: "External Integration Client"
    technology: "HTTPX"
    description: "Triggers external notifications and syncs with external systems."
  - type: "component"
    name: "Async Event Broker"
    technology: "RabbitMQ / Kafka"
    description: "Queues and brokers asynchronous tasks and messages."
  - type: "component"
    name: "Primary Database"
    technology: "PostgreSQL"
    description: "Stores task state and domain data."
  - type: "component"
    name: "External Systems"
    technology: "Notification Service, National Library Registry"
    description: "External systems for notifications and registry synchronization."
relationships:
  - source: "Async Event Broker"
    destination: "Task Consumer"
    description: "Consumes asynchronous background tasks [Consumer subscription over mTLS with AMQP]"
  - source: "Task Consumer"
    destination: "Task Router"
    description: "Dispatches incoming broker events based on task type [Internal Python routing]"
  - source: "Task Consumer"
    destination: "Data Access Layer"
    description: "Reads/Writes task state and domain data [SQLAlchemy]"
  - source: "Data Access Layer"
    destination: "Primary Database"
    description: "Persists domain data and task state"
  - source: "Task Consumer"
    destination: "External Integration Client"
    description: "Triggers external notifications and syncs [Async HTTP/REST over TLS 1.3]"
  - source: "External Integration Client"
    destination: "External Systems"
    description: "Sends notifications and syncs registry data"
  - source: "Task Consumer"
    destination: "Async Event Broker"
    description: "Acknowledges task completion or routes poisoned messages to DLQ [AMQP/mTLS]"