level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "WAF / Input Sanitization Plugin"
    technology: "OWASP CRS"
    description: "Inspects incoming HTTPS/JSON traffic and performs input sanitization."
  - type: "component"
    name: "Authentication Filter / Interceptor"
    technology: "OAuth2/JWT Plugin"
    description: "Enforces perimeter security and validates tokens for incoming requests."
  - type: "component"
    name: "Routing Engine & Request Transformation Module"
    technology: "Kong / Spring Cloud Gateway"
    description: "Handles dynamic routing and request transformation, forwarding validated requests."
  - type: "component"
    name: "Rate Limiting & Throttling Module"
    technology: "Redis-backed"
    description: "Provides distributed rate-limiting with strict EU-only deployment compliance."
relationships:
  - source: "WAF / Input Sanitization Plugin"
    destination: "Authentication Filter / Interceptor"
    description: "Forwards sanitized payload"
  - source: "Authentication Filter / Interceptor"
    destination: "Routing Engine & Request Transformation Module"
    description: "Forwards validated requests"
  - source: "Routing Engine & Request Transformation Module"
    destination: "Rate Limiting & Throttling Module"
    description: "Consults for rate limiting and throttling"