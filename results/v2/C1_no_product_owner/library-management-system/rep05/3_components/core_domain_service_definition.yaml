level: component
scope: "Component diagram for the Core Domain Service container"
parentContainer:
  name: "Core Domain Service"
elements:
  - type: "component"
    name: "Catalog Management Component"
    technology: "Java/Spring Boot"
    description: "Manages library items and cataloguing within the Core Domain Service."
  - type: "component"
    name: "Circulation Component"
    technology: "Java/Spring Boot"
    description: "Manages the circulation and borrowing processes of library items."
  - type: "component"
    name: "Fine & Fee Component"
    technology: "Java/Spring Boot"
    description: "Handles fines, fees, and integrates with payment gateways."
  - type: "component"
    name: "Patron Management Component"
    technology: "Java/Spring Boot"
    description: "Manages patron records and user-related domain logic."
relationships:
  - source: "Catalog Management Component"
    destination: "Search Service"
    description: "Publishes change-data-capture (CDC) events [Apache Kafka (AMQP/TLS 1.3)]"