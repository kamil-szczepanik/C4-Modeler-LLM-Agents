# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Staff"
    description: "Person using the system for cataloging and circulation."
  - type: "person"
    name: "Library Patrons"
    description: "Person using the self-service portal for search and borrowing."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External system handling centralized OIDC/OAuth 2.0 authentication."
  - type: "container"
    name: "Web Application"
    technology: "React, TypeScript"
    description: "Provides cataloging, circulation, and self-service portals hosted via CDN."
  - type: "container"
    name: "API Gateway"
    technology: "Spring Cloud Gateway / Envoy"
    description: "Handles ingress and security with OAuth2/OIDC JWT validation."
  - type: "container"
    name: "Core Domain Service"
    technology: "Java / Spring Boot"
    description: "Manages core business and transactional logic."
  - type: "container"
    name: "Search Service"
    technology: "Java / Elasticsearch / OpenSearch"
    description: "Handles high-performance search capabilities to satisfy <800ms search latency."
  - type: "container"
    name: "Notification Service"
    technology: "Node.js / TypeScript"
    description: "Handles asynchronous notifications."
  - type: "container"
    name: "PostgreSQL Database"
    technology: "PostgreSQL with AES-256 encryption"
    description: "Stores transactional data securely with EU-only residency."
  - type: "container"
    name: "Managed Event Bus"
    technology: "Kafka / EventBridge"
    description: "Handles event streaming with TLS-encrypted TCP and SASL/OAuth2 authentication."
  - type: "container"
    name: "Search Index"
    technology: "Elasticsearch / OpenSearch"
    description: "Index synchronized from PostgreSQL via Change Data Capture."
relationships:
  - source: "Library Staff"
    destination: "Web Application"
    description: "Accesses for cataloging and circulation"
    technology: "HTTPS/REST"
  - source: "Library Patrons"
    destination: "Web Application"
    description: "Accesses for search and borrowing"
    technology: "HTTPS/REST"
  - source: "Web Application"
    destination: "API Gateway"
    description: "Makes API requests"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "Core Domain Service"
    description: "Routes internal service requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Search Service"
    description: "Routes search queries"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Notification Service"
    description: "Routes notification requests"
    technology: "gRPC over mTLS"
  - source: "Core Domain Service"
    destination: "PostgreSQL Database"
    description: "Reads and writes transactional data"
    technology: "JDBC / TLS"
  - source: "Core Domain Service"
    destination: "Managed Event Bus"
    description: "Publishes and consumes domain events"
    technology: "TLS-encrypted TCP with SASL/OAuth2"
  - source: "Search Service"
    destination: "Search Index"
    description: "Queries search index"
    technology: "REST / gRPC"
  - source: "PostgreSQL Database"
    destination: "Search Index"
    description: "Synchronizes data via Change Data Capture"
    technology: "Debezium"