level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "An enterprise platform enabling public and academic libraries to catalogue physical and digital items, manage circulation, and provide self-service portals, enforcing strict EU-only data residency and sub-800ms search performance."
elements:
  - type: "person"
    name: "Library Staff"
    description: "Person using the system for cataloging and circulation."
  - type: "person"
    name: "Library Patrons"
    description: "Person using the self-service portal for search and borrowing."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system processing tokenized fines and fees over HTTPS/REST."
  - type: "externalSystem"
    name: "National Library Registry"
    description: "External system syncing bibliographic data via SOAP/REST."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External/internal system handling centralized OIDC/OAuth 2.0 authentication."
  - type: "externalSystem"
    name: "EU Cloud Hosting Provider"
    description: "Infrastructure boundary utilizing ISO 27001-certified EU data centers."
relationships:
  - source: "Library Staff"
    destination: "Library Management System"
    description: "Accesses Web UI for cataloging and circulation"
    technology: "HTTPS, OAuth 2.0/OpenID Connect MFA"
  - source: "Library Patrons"
    destination: "Library Management System"
    description: "Accesses Mobile/Web App for search and borrowing"
    technology: "HTTPS, OIDC"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Processes tokenized fines and fees"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "National Library Registry"
    description: "Syncs bibliographic data"
    technology: "SOAP/REST with mTLS"
  - source: "Library Management System"
    destination: "Identity Provider"
    description: "Performs token validation and authentication"
    technology: "HTTPS/OIDC"