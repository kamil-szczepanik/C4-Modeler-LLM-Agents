level: component
scope: "Component diagram for the PostgreSQL Database container"
parentContainer:
  name: "PostgreSQL Database"
elements:
  - type: "component"
    name: "Relational Data Store"
    technology: "PostgreSQL 16 with pgcrypto, pgaudit, and PgBouncer"
    description: "Manages transactional data storage with strict transactional integrity, EU-only residency enforcement, AES-256 data-at-rest encryption, compliance logging, and connection pooling."
  - type: "component"
    name: "CDC Publisher"
    technology: "Debezium PostgreSQL Connector via Kafka Connect"
    description: "Streams raw database change events for decoupled search synchronization by reading the WAL stream using the Logical Replication Protocol."
  - type: "component"
    name: "Backup and Compliance Agent"
    technology: "pgBackRest"
    description: "Handles automated backups supporting EU-only data residency requirements."
relationships:
  - source: "Core Domain Service"
    destination: "Relational Data Store"
    description: "Executes SQL queries via JDBC with TLS 1.3 / mTLS"
  - source: "CDC Publisher"
    destination: "Relational Data Store"
    description: "Reads WAL stream using Logical Replication Protocol over TCP with mTLS"
  - source: "CDC Publisher"
    destination: "Managed Event Bus"
    description: "Streams raw database change events via Kafka Protocol"