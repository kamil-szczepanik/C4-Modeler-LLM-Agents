level: component
scope: "Component diagram for the Search Service container"
parentContainer:
  name: "Search Service"
elements:
  - type: "component"
    name: "Search Controller"
    technology: "Spring gRPC"
    description: "Exposes gRPC endpoints for searching items."
  - type: "component"
    name: "Query Parser & Validator"
    technology: "Apache Lucene Query Parser"
    description: "Sanitizes user inputs and validates query syntax."
  - type: "component"
    name: "Index Synchronizer"
    technology: "Spring Kafka"
    description: "Consumes domain events to keep the search index synchronized."
  - type: "component"
    name: "Search Client"
    technology: "OpenSearch Java Client with Resilience4j"
    description: "Executes queries against the search index and prevents cascading failures."
  - type: "component"
    name: "Reindexing Worker"
    technology: "Spring Batch"
    description: "Handles batch reindexing operations."
  - type: "component"
    name: "Telemetry Interceptor"
    technology: "Micrometer and OpenTelemetry"
    description: "Collects metrics and ensures observability for latency SLAs."
relationships:
  - source: "API Gateway"
    destination: "Search Controller"
    description: "gRPC over mTLS"
  - source: "Index Synchronizer"
    destination: "Managed Event Bus"
    description: "Kafka consumption"
  - source: "Search Client"
    destination: "Search Index"
    description: "REST over HTTPS, mTLS, AWS SigV4"
  - source: "Reindexing Worker"
    destination: "Search Index"
    description: "REST over HTTPS Bulk API"
  - source: "Search Controller"
    destination: "Query Parser & Validator"
    description: "In-process validation"
  - source: "Query Parser & Validator"
    destination: "Search Client"
    description: "In-process execution"