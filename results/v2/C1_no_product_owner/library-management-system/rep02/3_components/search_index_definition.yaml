level: component
scope: "Component diagram for the Search Index container"
parentContainer:
  name: "Search Index"
elements:
  - type: "component"
    name: "Primary Data Node"
    technology: "OpenSearch/Elasticsearch Core (Apache Lucene)"
    description: "Provides distributed, horizontally scalable search capabilities, low-latency index querying, and automated encrypted snapshots to EU-Region Immutable Object Storage."
  - type: "component"
    name: "Query Parsing & Caching Component"
    technology: "OpenSearch Query DSL & Node-level cache"
    description: "Parses queries and caches results to optimize read performance and fulfill the sub-800ms search SLA."
  - type: "component"
    name: "Bulk Ingestion Buffer"
    technology: "OpenSearch Bulk API / Ingest Node"
    description: "Buffers and processes bulk ingestion streams via asynchronous batch updates."
relationships:
  - source: "Search Service"
    destination: "Query Parsing & Caching Component"
    description: "Submits search queries via REST over HTTP/2 with mTLS"
  - source: "Debezium CDC"
    destination: "Bulk Ingestion Buffer"
    description: "Streams asynchronous batch updates via REST/JSON over HTTP/2 with mTLS"
  - source: "Primary Data Node"
    destination: "EU-Region Immutable Object Storage"
    description: "Automated encrypted snapshots"