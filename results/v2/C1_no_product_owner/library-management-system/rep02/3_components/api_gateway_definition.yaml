level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Ingress Listener & TLS Termination Component"
    technology: "Spring Cloud Gateway / Envoy"
    description: "Handles inbound HTTPS (TLS 1.3) and IP geolocation."
  - type: "component"
    name: "Security & Authentication Filter"
    technology: "Spring Cloud Security"
    description: "Validates OAuth2/OIDC JWTs locally."
  - type: "component"
    name: "Rate Limiter Component"
    technology: "Spring Cloud Gateway Filter / Redis"
    description: "Coordinates rate-limiting via Redis Cache."
  - type: "component"
    name: "Routing & Resilience Mediator"
    technology: "Resilience4j"
    description: "Applies circuit breakers to prevent cascading failures."
  - type: "component"
    name: "gRPC Upstream Client"
    technology: "gRPC over mTLS"
    description: "Forwards requests downstream to internal services."
relationships:
  - source: "Ingress Listener & TLS Termination Component"
    destination: "Security & Authentication Filter"
    description: "Passes decrypted requests for token validation [Internal]"
  - source: "Security & Authentication Filter"
    destination: "Rate Limiter Component"
    description: "Checks rate limits and JWT blacklists [TCP/RESP]"
  - source: "Rate Limiter Component"
    destination: "Routing & Resilience Mediator"
    description: "Routes validated requests [Internal]"
  - source: "Routing & Resilience Mediator"
    destination: "gRPC Upstream Client"
    description: "Dispatches requests to upstream handlers [gRPC]"