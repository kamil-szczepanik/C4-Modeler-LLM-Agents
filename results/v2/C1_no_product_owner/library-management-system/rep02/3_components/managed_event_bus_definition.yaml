# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Managed Event Bus container"
parentContainer:
  name: "Managed Event Bus"
elements:
  - type: "component"
    name: "Event Broker Engine"
    technology: "Apache Kafka via Strimzi operator on Kubernetes"
    description: "Handles asynchronous event streaming and change data capture for the Library Management System."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry"
    description: "Enforces payload validation and backward compatibility using Avro/JSON."
  - type: "component"
    name: "Kafka Connect"
    technology: "Kafka Connect with Debezium"
    description: "Implements reliable change data capture for outbox pattern delivery."
  - type: "component"
    name: "Topic Management Operator"
    technology: "Topic Management Operator"
    description: "Provisions and configures topics and ACLs."
  - type: "component"
    name: "Consumers"
    technology: "Notification Service, Search Service"
    description: "Consume domain events and catalogue mutation events for synchronization and alerts."
  - type: "component"
    name: "Producers"
    technology: "Core Domain Service, PostgreSQL Database"
    description: "Publish domain events and emit database transaction logs."
relationships:
  - source: "Core Domain Service"
    destination: "Event Broker Engine"
    description: "Publishes and consumes domain events [TLS-encrypted TCP, SASL/OAuth2]"
  - source: "Core Domain Service"
    destination: "Kafka Connect"
    description: "Emits database transaction logs [JDBC/TLS]"
  - source: "Notification Service"
    destination: "Event Broker Engine"
    description: "Consumes domain events for patron alerts [TLS-encrypted TCP, SASL/OAuth2]"
  - source: "Search Service"
    destination: "Event Broker Engine"
    description: "Consumes catalogue mutation events for synchronization [TLS-encrypted TCP, SASL/OAuth2]"
  - source: "Topic Management Operator"
    destination: "Event Broker Engine"
    description: "Provisions and configures topics and ACLs [Kubernetes API]"