level: component
scope: "Component diagram for the Notification Service container"
parentContainer:
  name: "Notification Service"
elements:
  - type: "component"
    name: "Notification Router Component"
    technology: "TypeScript / gRPC"
    description: "Ingress handler for gRPC requests with token scope validation and payload sanitization."
  - type: "component"
    name: "Delivery Consumer Component"
    technology: "KafkaJS / TypeScript"
    description: "Consumes asynchronous messages from the Managed Event Bus."
  - type: "component"
    name: "Template Engine Component"
    technology: "Handlebars / TypeScript"
    description: "Renders localized notification templates with ephemeral memory handling for PII."
  - type: "component"
    name: "Dispatch Adapter Component"
    technology: "Node.js"
    description: "Manages external channel egress with W3C Trace Context propagation."
  - type: "component"
    name: "Retry & Resilience Policy Engine Component"
    technology: "Opossum / TypeScript"
    description: "Implements circuit breaking and exponential backoff."
  - type: "component"
    name: "External Providers"
    technology: "SendGrid and Twilio"
    description: "External email and SMS notification providers."
  - type: "component"
    name: "API Gateway"
    technology: "Gateway"
    description: "External API Gateway routing requests to the notification router."
  - type: "component"
    name: "Managed Event Bus"
    technology: "Kafka"
    description: "Asynchronous event bus for delivering background processing messages."
relationships:
  - source: "API Gateway"
    destination: "Notification Router Component"
    description: "gRPC over mTLS with scope authorization"
  - source: "Managed Event Bus"
    destination: "Delivery Consumer Component"
    description: "Kafka Protocol (TCP/SSL)"
  - source: "Notification Router Component"
    destination: "Template Engine Component"
    description: "In-memory function call with string sanitization"
  - source: "Delivery Consumer Component"
    destination: "Template Engine Component"
    description: "In-memory data passing (Async/Await)"
  - source: "Template Engine Component"
    destination: "Dispatch Adapter Component"
    description: "In-memory data passing"
  - source: "Dispatch Adapter Component"
    destination: "External Providers"
    description: "HTTPS / TLS 1.3 with egress whitelisting"