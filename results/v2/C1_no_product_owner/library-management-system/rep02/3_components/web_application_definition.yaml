level: component
scope: "Component diagram for the Web Application container"
parentContainer:
  name: "Web Application"
elements:
  - type: "component"
    name: "Router/View Controller"
    technology: "React Router, TypeScript"
    description: "Manages client-side routing and page views."
  - type: "component"
    name: "Catalog Component"
    technology: "React, TypeScript"
    description: "UI modules for searching and viewing physical and digital items."
  - type: "component"
    name: "Circulation Component"
    technology: "React, TypeScript"
    description: "UI modules for managing checkouts, returns, and renewals."
  - type: "component"
    name: "Authentication Client"
    technology: "OIDC Client, TypeScript"
    description: "Handles login flows and OIDC token validation."
  - type: "component"
    name: "API Client"
    technology: "TypeScript, HTTPS/REST"
    description: "Encapsulates communication with the API Gateway."
  - type: "component"
    name: "State Management Component"
    technology: "Zustand / React Context"
    description: "Manages transient application state in memory."
relationships:
  - source: "Library Staff / Patrons"
    destination: "Web Application"
    description: "Accesses via HTTPS/REST."
  - source: "Catalog Component"
    destination: "State Management Component"
    description: "Interacts for transient state management."
  - source: "Circulation Component"
    destination: "State Management Component"
    description: "Interacts for transient state management."
  - source: "Catalog Component"
    destination: "API Client"
    description: "Queries the API Gateway via HTTPS/REST."
  - source: "Circulation Component"
    destination: "API Client"
    description: "Queries the API Gateway via HTTPS/REST."
  - source: "Authentication Client"
    destination: "Identity Provider"
    description: "Manages session tokens via OAuth2/OIDC over HTTPS."