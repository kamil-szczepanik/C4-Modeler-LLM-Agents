level: component
scope: "Component diagram for the Core Domain Service container"
parentContainer:
  name: "Core Domain Service"
elements:
  - type: "component"
    name: "Domain Controller"
    technology: "Java / Spring Boot"
    description: "Handles incoming HTTP and gRPC requests for domain operations."
  - type: "component"
    name: "Domain Business Logic"
    technology: "Java / Spring Boot"
    description: "Implements the core business and transactional logic for the library management system."
  - type: "component"
    name: "Data Access Repository"
    technology: "JDBC / Spring Data JPA"
    description: "Manages reads and writes of transactional data to the PostgreSQL database."
  - type: "component"
    name: "Event Publisher"
    technology: "Kafka / EventBridge Client"
    description: "Publishes and consumes asynchronous domain events via the managed event bus."
relationships:
  - source: "Domain Controller"
    destination: "Domain Business Logic"
    description: "Delegates request processing [Direct Method Invocation]"
  - source: "Domain Business Logic"
    destination: "Data Access Repository"
    description: "Persists and retrieves transactional data [JDBC / TLS]"
  - source: "Domain Business Logic"
    destination: "Event Publisher"
    description: "Dispatches domain events [TLS-encrypted TCP with SASL/OAuth2]"