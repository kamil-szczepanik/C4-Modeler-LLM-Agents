level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patient"
    description: "Interacts with the system for scheduling and managing healthcare appointments and records."
  - type: "person"
    name: "Clinician"
    description: "Accesses and manages electronic medical records and patient admissions."
  - type: "person"
    name: "Receptionist"
    description: "Manages scheduling and patient admissions."
  - type: "person"
    name: "Billing Specialist"
    description: "Handles billing and financial transactions."
  - type: "externalSystem"
    name: "Third-Party Payment Gateway"
    description: "External service for processing payments."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing laboratory and imaging results via HL7 FHIR."
  - type: "externalSystem"
    name: "Insurance Clearinghouse"
    description: "External service for verifying and processing insurance claims."
  - type: "externalSystem"
    name: "Enterprise IdP"
    description: "External identity provider for authentication and user management."
  - type: "container"
    name: "API Gateway"
    technology: "Traefik/NGINX"
    description: "Handles incoming routing, SSL termination, and security enforcement."
  - type: "container"
    name: "EMR Service"
    technology: "Node.js/TypeScript (Fastify)"
    description: "Manages electronic medical records and patient admissions."
  - type: "container"
    name: "Patient & Scheduling Service"
    technology: "Node.js/TypeScript (Fastify)"
    description: "Manages patient information and appointment scheduling."
  - type: "container"
    name: "Billing & Claims Service"
    technology: "Java/Spring Boot"
    description: "Handles billing, financial transactions, and insurance claims."
  - type: "container"
    name: "FHIR Interoperability Service"
    technology: ".NET"
    description: "Integrates with external lab and imaging systems using HL7 FHIR APIs."
  - type: "container"
    name: "CockroachDB"
    technology: "CockroachDB"
    description: "Distributed, ACID-compliant transactional and document database."
  - type: "container"
    name: "RabbitMQ"
    technology: "RabbitMQ"
    description: "Message broker for asynchronous communication between services and external entities."
  - type: "container"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Provides dynamic secrets and credential management."
  - type: "container"
    name: "ArgoCD"
    technology: "ArgoCD / Helm"
    description: "GitOps continuous delivery tool for hybrid Kubernetes deployments."
  - type: "container"
    name: "OpenTelemetry Collector"
    technology: "OpenTelemetry"
    description: "Collects and exports unified traces, metrics, and logs."
relationships:
  - source: "Patient"
    destination: "API Gateway"
    description: "Secure access for scheduling and managing records"
    technology: "HTTPS/REST, OAuth2/OIDC with MFA"
  - source: "Clinician"
    destination: "API Gateway"
    description: "Accesses EMR and patient admissions"
    technology: "HTTPS/REST, OAuth2/OIDC with MFA"
  - source: "Receptionist"
    destination: "API Gateway"
    description: "Manages patient scheduling and admissions"
    technology: "HTTPS/REST, OAuth2/OIDC with MFA"
  - source: "Billing Specialist"
    destination: "API Gateway"
    description: "Handles billing and financial transactions"
    technology: "HTTPS/REST, OAuth2/OIDC with MFA"
  - source: "API Gateway"
    destination: "EMR Service"
    description: "Routes internal API requests"
    technology: "gRPC over mTLS (SPIFFE/SPIRE)"
  - source: "API Gateway"
    destination: "Patient & Scheduling Service"
    description: "Routes internal API requests"
    technology: "gRPC over mTLS (SPIFFE/SPIRE)"
  - source: "API Gateway"
    destination: "Billing & Claims Service"
    description: "Routes internal API requests"
    technology: "gRPC over mTLS (SPIFFE/SPIRE)"
  - source: "API Gateway"
    destination: "FHIR Interoperability Service"
    description: "Routes internal API requests"
    technology: "gRPC over mTLS (SPIFFE/SPIRE)"
  - source: "Billing & Claims Service"
    destination: "RabbitMQ"
    description: "Sends and receives asynchronous billing messages"
    technology: "AMQP"
  - source: "RabbitMQ"
    destination: "Third-Party Payment Gateway"
    description: "Integrates payment processing asynchronously"
    technology: "Asynchronous Messaging"
  - source: "RabbitMQ"
    destination: "Insurance Clearinghouse"
    description: "Integrates insurance claims processing asynchronously"
    technology: "Asynchronous Messaging"
  - source: "FHIR Interoperability Service"
    destination: "External Lab & Imaging Systems"
    description: "Communicates lab and imaging data via HL7 FHIR APIs"
    technology: "HL7 FHIR over HTTPS"