level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed for medium-sized hospitals and clinics to securely manage patient admissions, electronic medical records, scheduling, and billing with high availability, stringent compliance, and robust interoperability."
elements:
  - type: "person"
    name: "Patient"
    description: "Interacts with the system for scheduling and managing healthcare appointments and records."
  - type: "person"
    name: "Clinician"
    description: "Accesses and manages electronic medical records and patient admissions."
  - type: "person"
    name: "Receptionist"
    description: "Manages scheduling and patient admissions."
  - type: "person"
    name: "Billing Specialist"
    description: "Handles billing and financial transactions."
  - type: "externalSystem"
    name: "Third-Party Payment Gateway"
    description: "External service for processing payments."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing laboratory and imaging results via HL7 FHIR."
  - type: "externalSystem"
    name: "Insurance Clearinghouse"
    description: "External service for verifying and processing insurance claims."
  - type: "externalSystem"
    name: "Enterprise IdP"
    description: "External identity provider for authentication and user management."
relationships:
  - source: "Patient"
    destination: "Clinic Management System"
    description: "Connects to manage healthcare records and scheduling"
    technology: "HTTPS/REST, OAuth2/OIDC with MFA"
  - source: "Clinician"
    destination: "Clinic Management System"
    description: "Accesses medical records and patient information"
    technology: "HTTPS/REST, OAuth2/OIDC with MFA"
  - source: "Receptionist"
    destination: "Clinic Management System"
    description: "Manages front-desk admissions and appointments"
    technology: "HTTPS/REST, OAuth2/OIDC with MFA"
  - source: "Billing Specialist"
    destination: "Clinic Management System"
    description: "Processes patient billing and payments"
    technology: "HTTPS/REST, OAuth2/OIDC with MFA"
  - source: "External Lab & Imaging Systems"
    destination: "Clinic Management System"
    description: "Integrates lab and imaging data"
    technology: "HL7 FHIR over HTTPS"
  - source: "Third-Party Payment Gateway"
    destination: "Clinic Management System"
    description: "Processes financial transactions"
    technology: "REST/SFTP"
  - source: "Insurance Clearinghouse"
    destination: "Clinic Management System"
    description: "Handles insurance claims processing"
    technology: "REST/SFTP"