level: component
scope: "Component diagram for the OpenTelemetry Collector container"
parentContainer:
  name: "OpenTelemetry Collector"
elements:
  - type: "component"
    name: "OpenTelemetry Receiver"
    technology: "OpenTelemetry Protocol (OTLP)"
    description: "Receives metrics, traces, and logs from backend services via OTLP/gRPC with mTLS."
  - type: "component"
    name: "PII/PHI Redaction Processor"
    technology: "Custom Filtering Processor"
    description: "Redacts personally identifiable information (PII) and protected health information (PHI) to ensure HIPAA/GDPR compliance."
  - type: "component"
    name: "Telemetry Exporter"
    technology: "OpenTelemetry Exporter"
    description: "Transmits unified metrics, traces, and logs to observability backends."
relationships:
  - source: "OpenTelemetry Receiver"
    destination: "PII/PHI Redaction Processor"
    description: "Passes raw telemetry data for redaction"
  - source: "PII/PHI Redaction Processor"
    destination: "Telemetry Exporter"
    description: "Sends sanitized telemetry data for export"