level: component
scope: "Component diagram for the ArgoCD container"
parentContainer:
  name: "ArgoCD"
elements:
  - type: "component"
    name: "API Server"
    technology: "Go"
    description: "Manages Web UI, CLI, webhook receivers, and OIDC/MFA authentication."
  - type: "component"
    name: "Repository Server"
    technology: "Go"
    description: "Clones Git repositories and renders Helm charts without caching unencrypted data."
  - type: "component"
    name: "Application Controller"
    technology: "Go"
    description: "Core reconciliation engine executing state synchronization with Kubernetes API servers."
  - type: "component"
    name: "Redis Cache"
    technology: "Redis"
    description: "In-memory data store providing HA state caching and session management."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Secure secret management and dynamic runtime decryption provider."
relationships:
  - source: "API Server"
    destination: "Repository Server"
    description: "Commands via Internal gRPC"
  - source: "API Server"
    destination: "Application Controller"
    description: "Commands via Internal gRPC"
  - source: "API Server"
    destination: "Redis Cache"
    description: "Interacts via TCP/TLS"
  - source: "Application Controller"
    destination: "Redis Cache"
    description: "Interacts via TCP/TLS"
  - source: "Application Controller"
    destination: "on-prem-k8s and eu-central-1 clusters"
    description: "Communicates via HTTPS/Kubernetes API"
  - source: "API Server"
    destination: "Enterprise IdP"
    description: "Delegates user authentication via HTTPS/OIDC"
  - source: "Repository Server"
    destination: "HashiCorp Vault"
    description: "Integrates for runtime secret injection"