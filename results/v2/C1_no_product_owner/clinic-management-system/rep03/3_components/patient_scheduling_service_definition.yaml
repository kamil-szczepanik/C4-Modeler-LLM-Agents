level: component
scope: "Component diagram for the Patient & Scheduling Service container"
parentContainer:
  name: "Patient & Scheduling Service"
elements:
  - type: "component"
    name: "Patient Registry Component"
    technology: "Fastify / TypeScript"
    description: "Manages demographic capture and Zod input validation."
  - type: "component"
    name: "Scheduling Engine Component"
    technology: "Fastify / TypeScript"
    description: "Handles temporal and spatial resource clash checks with in-memory indexing."
  - type: "component"
    name: "Secrets & Encryption Component"
    technology: "Fastify Plugin"
    description: "Integrates HashiCorp Vault for field-level PHI encryption and automated key rotation."
  - type: "component"
    name: "Event Dispatcher Component"
    technology: "Dedicated Wrapper"
    description: "Isolates RabbitMQ AMQP messaging from domain logic."
  - type: "component"
    name: "Audit & Compliance Interceptor"
    technology: "Fastify Middleware"
    description: "Writes cryptographically hashed, immutable audit logs to a WORM sink."
  - type: "container"
    name: "API Gateway"
    technology: "gRPC / mTLS"
    description: "Routes internal API requests via gRPC over mTLS using SPIFFE/SPIRE."
  - type: "container"
    name: "CockroachDB"
    technology: "PostgreSQL wire protocol / TLS 1.3"
    description: "Provides distributed, highly available SQL data persistence."
  - type: "container"
    name: "RabbitMQ"
    technology: "AMQP 0-9-1"
    description: "Asynchronous message broker for decoupled event-driven workflows."
  - type: "container"
    name: "HashiCorp Vault"
    technology: "HTTPS / TLS 1.3"
    description: "Secures PHI via field-level encryption and manages credential lifecycle."
relationships:
  - source: "API Gateway"
    destination: "Patient & Scheduling Service"
    description: "Routes internal API requests via gRPC over mTLS using SPIFFE/SPIRE"
  - source: "Patient Registry Component"
    destination: "CockroachDB"
    description: "Reads and writes state via PostgreSQL wire protocol over TLS 1.3"
  - source: "Scheduling Engine Component"
    destination: "CockroachDB"
    description: "Reads and writes state via PostgreSQL wire protocol over TLS 1.3"
  - source: "Event Dispatcher Component"
    destination: "RabbitMQ"
    description: "Publishes envelope-encrypted appointment events using AMQP 0-9-1"
  - source: "Secrets & Encryption Component"
    destination: "HashiCorp Vault"
    description: "Fetches encryption keys and secrets over HTTPS/TLS 1.3"