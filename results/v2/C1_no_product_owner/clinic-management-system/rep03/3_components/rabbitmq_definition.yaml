level: component
scope: "Component diagram for the RabbitMQ container"
parentContainer:
  name: "RabbitMQ"
elements:
  - type: "component"
    name: "RabbitMQ Message Broker"
    technology: "RabbitMQ / Erlang"
    description: "Handles asynchronous messaging for patient admissions, electronic medical records, scheduling, and billing."
  - type: "component"
    name: "RabbitMQ Cluster Operator for Kubernetes"
    technology: "Kubernetes Operator"
    description: "Manages the RabbitMQ deployment across a 3-node topology with anti-affinity rules for high availability."
  - type: "component"
    name: "Direct and Topic Exchanges"
    technology: "RabbitMQ Exchanges (billing.direct, claims.topic, dlx.direct)"
    description: "Routes published events to appropriate queues based on routing keys and exchange types."
  - type: "component"
    name: "Quorum Queues & Dead-Letter Component"
    technology: "Raft-based Quorum Queues"
    description: "Ensures zero message loss, high availability, and quarantines invalid or poison messages."
  - type: "component"
    name: "RabbitMQ Federation Plugin"
    technology: "RabbitMQ Federation"
    description: "Enables hybrid cloud federation for message distribution and high availability."
  - type: "component"
    name: "TLS Termination & mTLS Component"
    technology: "TLS 1.3 & mTLS"
    description: "Enforces in-transit encryption to satisfy HIPAA and GDPR security mandates."
  - type: "component"
    name: "HashiCorp Vault Secrets Engine"
    technology: "HashiCorp Vault"
    description: "Provides dynamic credential rotation and secret management for the messaging architecture."
relationships:
  - source: "Billing & Claims Service"
    destination: "Direct and Topic Exchanges"
    description: "Publishes encrypted payload events [AMQP 0-9-1 over TLS 1.3]"
  - source: "Quorum Queues & Dead-Letter Component"
    destination: "Insurance Clearinghouse"
    description: "Forwards claims asynchronously via outbound connectors [AMQP/HTTPS]"
  - source: "Dead-Letter Exchange"
    destination: "Forensic Audit Queue"
    description: "Quarantines invalid or poison messages [AMQP]"