level: component
scope: "Component diagram for the Billing & Claims Service container"
parentContainer:
  name: "Billing & Claims Service"
elements:
  - type: "component"
    name: "Claim Processing Engine"
    technology: "Java / Spring State Machine"
    description: "Manages insurance claim processing states and workflows."
  - type: "component"
    name: "Invoice & Ledger Manager"
    technology: "Java / Spring Data JPA"
    description: "Manages financial transactions, invoices, and ledger records."
  - type: "component"
    name: "Clearinghouse Adapter"
    technology: "Java / Spring Integration"
    description: "Handles secure integrations with external insurance clearinghouses."
  - type: "component"
    name: "Outbox Publisher Component"
    technology: "Spring Integration / JDBC"
    description: "Publishes domain events reliably using the outbox pattern."
  - type: "component"
    name: "CockroachDB"
    technology: "CockroachDB"
    description: "Distributed SQL database for multi-region ACID guarantees."
  - type: "component"
    name: "RabbitMQ"
    technology: "RabbitMQ"
    description: "Asynchronous message broker providing outbox durability and DLQs."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Secret management for encryption keys and external credentials."
  - type: "component"
    name: "Insurance Clearinghouse"
    technology: "External Service"
    description: "External insurance clearinghouse for claims processing."
relationships:
  - source: "Claim Processing Engine"
    destination: "Clearinghouse Adapter"
    description: "Direct Java method calls"
  - source: "Clearinghouse Adapter"
    destination: "Insurance Clearinghouse"
    description: "SFTP / AS2 with TLS 1.3 / AES-256"
  - source: "Invoice & Ledger Manager"
    destination: "CockroachDB"
    description: "JDBC over TLS with ACID guarantees"
  - source: "Claim Processing Engine"
    destination: "Outbox Publisher Component"
    description: "Internal transactional method call"
  - source: "Outbox Publisher Component"
    destination: "RabbitMQ"
    description: "AMQP with cryptographically signed domain events"
  - source: "Invoice & Ledger Manager"
    destination: "HashiCorp Vault"
    description: "HTTPS/REST via Spring Cloud Vault"