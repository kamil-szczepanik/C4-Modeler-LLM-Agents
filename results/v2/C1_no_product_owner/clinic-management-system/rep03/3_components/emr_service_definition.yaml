level: component
scope: "Component diagram for the EMR Service container"
parentContainer:
  name: "EMR Service"
elements:
  - type: "component"
    name: "EMR API Controller"
    technology: "Fastify Routing/Validation"
    description: "Routes and validates internal API requests."
  - type: "component"
    name: "Medical Record Manager"
    technology: "Domain Service"
    description: "Manages core business logic for medical records and patient admissions."
  - type: "component"
    name: "Audit Logger Interceptor"
    technology: "Middleware"
    description: "Triggers and handles audit events for HIPAA and GDPR compliance."
  - type: "component"
    name: "Data Access Repository"
    technology: "Prisma ORM / Node.js"
    description: "Persists and retrieves encrypted patient data."
  - type: "component"
    name: "FHIR Mapping Adapter"
    technology: "Translation Layer"
    description: "Transforms internal schemas to standardized FHIR resources."
  - type: "component"
    name: "Redis Cache Sidecar"
    technology: "Redis"
    description: "Caches FHIR resources and demographics to maintain performance SLAs."
  - type: "component"
    name: "CockroachDB"
    technology: "CockroachDB"
    description: "Stores encrypted patient data with high availability."
  - type: "component"
    name: "RabbitMQ / Local Buffer"
    technology: "RabbitMQ"
    description: "Audit queue for asynchronous event emission."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Manages secrets, dynamic column-level encryption keys, and cryptographic signing secrets."
relationships:
  - source: "API Gateway"
    destination: "EMR API Controller"
    description: "Routes internal API requests [gRPC over mTLS]"
  - source: "EMR API Controller"
    destination: "Medical Record Manager"
    description: "Invokes business logic [In-memory function calls]"
  - source: "Medical Record Manager"
    destination: "Data Access Repository"
    description: "Persists and retrieves records [SQL via TLS]"
  - source: "Medical Record Manager"
    destination: "Audit Logger Interceptor"
    description: "Triggers audit events [Async Event Emission via Durable Audit Queue]"
  - source: "Medical Record Manager"
    destination: "FHIR Mapping Adapter"
    description: "Transforms internal schemas [In-memory mapping]"
  - source: "FHIR Interoperability Service"
    destination: "FHIR Mapping Adapter"
    description: "Exchanges standardized resources [gRPC with Circuit Breakers]"
  - source: "Data Access Repository"
    destination: "CockroachDB"
    description: "Stores encrypted patient data [Encrypted SQL]"