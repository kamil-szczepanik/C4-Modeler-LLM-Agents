# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the HashiCorp Vault container"
parentContainer:
  name: "HashiCorp Vault"
elements:
  - type: "component"
    name: "Secrets Engine"
    technology: "HashiCorp Vault KV/Database Secrets Engines"
    description: "Manages and provides dynamic credentials and data encryption."
  - type: "component"
    name: "Auth Methods"
    technology: "HashiCorp Vault AppRole, Kubernetes Auth"
    description: "Handles client authentication and mTLS token acquisition."
  - type: "component"
    name: "Audit Log"
    technology: "HashiCorp Vault Audit Component"
    description: "Tracks and exports system audit logs for SIEM ingestion."
  - type: "component"
    name: "Storage Backend Integration"
    technology: "HashiCorp Vault Raft storage, AWS KMS/HSM auto-unseal"
    description: "Manages persistent encrypted storage and disaster recovery snapshots."
relationships:
  - source: "Auth Methods"
    destination: "Secrets Engine"
    description: "Grants access after authentication"
  - source: "Audit Log"
    destination: "Storage Backend Integration"
    description: "Persists audit data"