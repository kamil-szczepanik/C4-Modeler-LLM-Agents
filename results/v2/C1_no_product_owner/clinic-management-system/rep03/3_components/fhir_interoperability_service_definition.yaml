level: component
scope: "Component diagram for the FHIR Interoperability Service container"
parentContainer:
  name: "FHIR Interoperability Service"
elements:
  - type: "component"
    name: "Security Enforcement Middleware"
    technology: "ASP.NET Core Middleware"
    description: "Enforces security policies, zero-trust patterns, and micro-segmentation."
  - type: "component"
    name: "FHIR API Controller"
    technology: "ASP.NET Core"
    description: "Handles FHIR API requests for clinical data exchange."
  - type: "component"
    name: "Resource Transformer Engine"
    technology: ".NET"
    description: "Transforms resource payloads for clinical interoperability."
  - type: "component"
    name: "HL7 Client Adapter"
    technology: "HttpClient / Polly"
    description: "Manages resilient outbound calls to external lab and imaging systems."
  - type: "component"
    name: "Audit & Compliance Interceptor"
    technology: ".NET Interceptor"
    description: "Intercepts requests for auditing and ensures compliance with PHI masking."
relationships:
  - source: "API Gateway"
    destination: "Security Enforcement Middleware"
    description: "gRPC over mTLS [SPIFFE/SPIRE]"
  - source: "Security Enforcement Middleware"
    destination: "FHIR API Controller"
    description: "Method calls [In-process]"
  - source: "FHIR API Controller"
    destination: "Resource Transformer Engine"
    description: "Method calls [In-process]"
  - source: "Resource Transformer Engine"
    destination: "HL7 Client Adapter"
    description: "Method calls [In-process]"
  - source: "HL7 Client Adapter"
    destination: "External Lab & Imaging Systems"
    description: "HL7 FHIR over HTTPS [REST/JSON]"
  - source: "HL7 Client Adapter"
    destination: "RabbitMQ"
    description: "Failed payload streaming [AMQP]"
  - source: "Audit & Compliance Interceptor"
    destination: "OpenTelemetry Collector"
    description: "Telemetry with PHI masking [OTLP over gRPC]"