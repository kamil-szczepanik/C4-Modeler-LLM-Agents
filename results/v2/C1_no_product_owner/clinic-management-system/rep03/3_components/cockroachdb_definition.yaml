level: component
scope: "Component diagram for the CockroachDB container"
parentContainer:
  name: "CockroachDB"
elements:
  - type: "component"
    name: "SQL Layer"
    technology: "Go"
    description: "Go-based parser, planner, and executor for distributed SQL."
  - type: "component"
    name: "Transaction Engine"
    technology: "MVCC & Raft consensus"
    description: "ACID transaction manager ensuring data consistency and consensus."
  - type: "component"
    name: "Storage Engine"
    technology: "RocksDB"
    description: "Embedded key-value store managing local disk persistence."
  - type: "component"
    name: "Dist_SQL"
    technology: "Distributed execution engine"
    description: "Distributed execution engine for parallelized queries."
  - type: "component"
    name: "EMR Service"
    technology: "Container"
    description: "Application service handling electronic medical records."
  - type: "component"
    name: "Billing Service"
    technology: "Container"
    description: "Application service handling financial claims and billing."
  - type: "component"
    name: "Scheduling Service"
    technology: "Container"
    description: "Application service handling patient appointments and schedules."
  - type: "component"
    name: "OpenTelemetry Collector"
    technology: "OpenTelemetry"
    description: "Collects metrics and streams audit logs for compliance."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault / PKI"
    description: "Provides automated certificate rotation and AES-256 key management."
relationships:
  - source: "EMR Service"
    destination: "SQL Layer"
    description: "Connects via PostgreSQL wire protocol over TLS 1.3"
  - source: "Billing Service"
    destination: "SQL Layer"
    description: "Connects via PostgreSQL wire protocol over TLS 1.3"
  - source: "Scheduling Service"
    destination: "SQL Layer"
    description: "Connects via PostgreSQL wire protocol over TLS 1.3"
  - source: "SQL Layer"
    destination: "Transaction Engine"
    description: "Executes ACID transactions using"
  - source: "Transaction Engine"
    destination: "Storage Engine"
    description: "Persists data using"
  - source: "SQL Layer"
    destination: "Dist_SQL"
    description: "Offloads parallelized queries to"
  - source: "OpenTelemetry Collector"
    destination: "SQL Layer"
    description: "Scrapes metrics and audit logs from"
  - source: "HashiCorp Vault"
    destination: "SQL Layer"
    description: "Integrates via PKI engine for automated certificate rotation and encryption"