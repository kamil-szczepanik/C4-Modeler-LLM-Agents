level: context
scope: "System Context diagram for Clinic Management System (CMS)"
system:
  name: "Clinic Management System (CMS)"
  description: "Manages patient admissions, EMRs, scheduling, and billing for healthcare providers."
elements:
  - type: "person"
    name: "Patient"
    description: "Interacts via Web/Mobile to manage appointments and view records."
  - type: "person"
    name: "Clinician/Staff"
    description: "Interacts via Secure Workstation to manage patient care, EMRs, and operations."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing laboratory and medical imaging data."
  - type: "externalSystem"
    name: "Payment Gateway / Insurance Clearinghouse"
    description: "External systems processing billing and insurance claims."
relationships:
  - source: "Patient"
    destination: "Clinic Management System (CMS)"
    description: "Interacts with CMS via web and mobile interfaces"
    technology: "HTTPS (TLS 1.3, OIDC, MFA)"
  - source: "Clinician/Staff"
    destination: "Clinic Management System (CMS)"
    description: "Accesses CMS from secure workstations"
    technology: "HTTPS (TLS 1.3, OIDC, MFA)"
  - source: "Clinic Management System (CMS)"
    destination: "External Lab & Imaging Systems"
    description: "Integrates for clinical data exchange"
    technology: "HL7 FHIR RESTful APIs over mTLS"
  - source: "Clinic Management System (CMS)"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Processes payments and insurance claims"
    technology: "HTTPS REST/SOAP APIs"