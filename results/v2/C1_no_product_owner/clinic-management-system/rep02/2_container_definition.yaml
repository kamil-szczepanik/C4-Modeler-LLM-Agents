level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients and Clinicians/Staff"
    description: "Users interacting with the clinic management system for records, scheduling, and billing."
  - type: "externalSystem"
    name: "External Lab, Imaging Systems, and Payment Gateways/Insurance Clearinghouses"
    description: "External systems providing laboratory data, medical imaging, and payment processing."
  - type: "container"
    name: "Envoy"
    technology: "API Gateway / Reverse Proxy"
    description: "Chosen for rate limiting, TLS termination, and OAuth2/MFA validation."
  - type: "container"
    name: "Istio"
    technology: "Service Mesh"
    description: "Selected for zero-trust segmentation and mTLS enforcement."
  - type: "container"
    name: "Patient & Scheduling Service"
    technology: "Node.js/Go"
    description: "Manages patient information and scheduling."
  - type: "container"
    name: "EMR Core Service"
    technology: "Java/Spring Boot"
    description: "Core service for managing electronic medical records."
  - type: "container"
    name: "Billing & Integration Service"
    technology: "Python/FastAPI"
    description: "Handles billing and integrations with external systems."
  - type: "container"
    name: "PostgreSQL with Patroni"
    technology: "PostgreSQL, Patroni"
    description: "Primary datastore with active-passive failover."
  - type: "container"
    name: "NATS / RabbitMQ and AWS Kafka"
    technology: "NATS, RabbitMQ, AWS Kafka"
    description: "Edge and event brokers for messaging."
  - type: "container"
    name: "WORM-compliant S3 / MinIO"
    technology: "S3, MinIO"
    description: "Object storage archive."
  - type: "container"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Centralized secret management for dynamic token generation."
relationships:
  - source: "Patients and Clinicians/Staff"
    destination: "Envoy"
    description: "Clients access API Gateway"
    technology: "HTTPS / JSON"
  - source: "Envoy"
    destination: "Patient & Scheduling Service"
    description: "Routes requests to microservices over service mesh"
    technology: "gRPC over Istio mTLS"
  - source: "Envoy"
    destination: "EMR Core Service"
    description: "Routes requests to microservices over service mesh"
    technology: "gRPC over Istio mTLS"
  - source: "Envoy"
    destination: "Billing & Integration Service"
    description: "Routes requests to microservices over service mesh"
    technology: "gRPC over Istio mTLS"
  - source: "Billing & Integration Service"
    destination: "External Lab, Imaging Systems, and Payment Gateways/Insurance Clearinghouses"
    description: "Integrates with external systems"
    technology: "HTTPS / HL7 FHIR"
  - source: "Patient & Scheduling Service"
    destination: "NATS / RabbitMQ and AWS Kafka"
    description: "Publishes and consumes events"
    technology: "TLS 1.3"
  - source: "EMR Core Service"
    destination: "NATS / RabbitMQ and AWS Kafka"
    description: "Publishes and consumes events"
    technology: "TLS 1.3"
  - source: "Billing & Integration Service"
    destination: "NATS / RabbitMQ and AWS Kafka"
    description: "Publishes and consumes events"
    technology: "TLS 1.3"
  - source: "Patient & Scheduling Service"
    destination: "PostgreSQL with Patroni"
    description: "Reads and writes relational data"
    technology: "Encrypted SQL connections"
  - source: "EMR Core Service"
    destination: "PostgreSQL with Patroni"
    description: "Reads and writes relational data"
    technology: "Encrypted SQL connections"
  - source: "Billing & Integration Service"
    destination: "PostgreSQL with Patroni"
    description: "Reads and writes relational data"
    technology: "Encrypted SQL connections"