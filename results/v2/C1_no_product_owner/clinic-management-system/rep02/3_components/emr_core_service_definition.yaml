level: component
scope: "Component diagram for the EMR Core Service container"
parentContainer:
  name: "EMR Core Service"
elements:
  - type: "component"
    name: "EMR Rest Controller Layer"
    technology: "Spring MVC, gRPC, OAuth2/JWT"
    description: "Handles REST/gRPC endpoints, input validation, and OAuth2/JWT security context."
  - type: "component"
    name: "Clinical Record Manager"
    technology: "Spring Service, Resilience4j"
    description: "Contains core domain logic, utilizing resilience4j circuit breakers and HashiCorp Vault."
  - type: "component"
    name: "Audit Trail Engine"
    technology: "Spring AOP, Spring WebFlux"
    description: "Reactive outbox processor and cryptographic signing pipeline for audit trails."
  - type: "component"
    name: "Data Access Repository"
    technology: "Spring Data JPA, Hibernate, PostgreSQL"
    description: "Data access interface utilizing PostgreSQL read-replicas."
relationships:
  - source: "EMR Rest Controller Layer"
    destination: "Clinical Record Manager"
    description: "In-process method calls [Java/Spring Beans]"
  - source: "Clinical Record Manager"
    destination: "Data Access Repository"
    description: "Encrypted SQL queries [Encrypted SQL]"
  - source: "Clinical Record Manager"
    destination: "HashiCorp Vault"
    description: "Dynamic secret retrieval [HTTPS/TLS 1.3 with Istio/SPIFFE workload identity]"
  - source: "Audit Trail Engine"
    destination: "Kafka/RabbitMQ"
    description: "Asynchronous event publishing [TLS 1.3]"
  - source: "Audit Trail Engine"
    destination: "WORM-compliant S3 / MinIO"
    description: "Immutable audit log archival [HTTPS/TLS 1.3]"