level: component
scope: "Component diagram for the Patient & Scheduling Service container"
parentContainer:
  name: "Patient & Scheduling Service"
elements:
  - type: "component"
    name: "Patient Registry Controller"
    technology: "Go, chi/gRPC"
    description: "Handles REST/gRPC endpoints and JWT-based RBAC for patient demographics."
  - type: "component"
    name: "Scheduling Engine"
    technology: "Go"
    description: "Executes resource clash checks using an in-memory interval tree and atomic DB locks."
  - type: "component"
    name: "Audit Interceptor"
    technology: "Go middleware"
    description: "Provides cryptographic audit logging signed via HashiCorp Vault."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Go worker pool"
    description: "Manages asynchronous patient reminders and appointment alerts."
  - type: "component"
    name: "PostgreSQL with Patroni"
    technology: "PostgreSQL"
    description: "Relational database providing ACID-compliant storage with encrypted connections."
  - type: "component"
    name: "NATS / RabbitMQ"
    technology: "NATS / RabbitMQ"
    description: "Message broker handling domain events with DLQ configuration."
relationships:
  - source: "API Gateway (Envoy)"
    destination: "Patient Registry Controller"
    description: "Routes external client requests [gRPC over Istio mTLS]."
  - source: "Scheduling Engine"
    destination: "PostgreSQL with Patroni"
    description: "Executes booking transactions and clash checks [Encrypted SQL]."
  - source: "Patient Registry Controller"
    destination: "NATS / RabbitMQ"
    description: "Publishes domain events [TLS 1.3]."
  - source: "Scheduling Engine"
    destination: "Notification Dispatcher"
    description: "Triggers async notifications [Internal channels / TLS 1.3]."
  - source: "Notification Dispatcher"
    destination: "External Notification Gateway"
    description: "Sends patient alerts with PII masking [HTTPS / TLS 1.3 with certificate pinning]."