level: component
scope: "Component diagram for the NATS / RabbitMQ and AWS Kafka container"
parentContainer:
  name: "NATS / RabbitMQ and AWS Kafka"
elements:
  - type: "component"
    name: "AWS MSK"
    technology: "Apache Kafka"
    description: "Cloud-based event broker handling high-throughput event streaming and cross-site data replication in AWS."
  - type: "component"
    name: "Strimzi"
    technology: "Apache Kafka on Kubernetes"
    description: "On-premise event broker handling high-throughput event streaming in local Kubernetes clusters."
  - type: "component"
    name: "Confluent Schema Registry"
    technology: "Schema Registry"
    description: "Enforces strict Avro/Protobuf data governance and prevents breaking API changes."
  - type: "component"
    name: "Kafka MirrorMaker 2"
    technology: "MirrorMaker 2"
    description: "Handles cross-site data replication between on-premise Strimzi Kafka and AWS MSK."
relationships:
  - source: "Strimzi"
    destination: "AWS MSK"
    description: "Cross-site data replication [Kafka MirrorMaker 2 over TLS 1.3 and IPsec/WireGuard]"
  - source: "AWS MSK"
    destination: "Confluent Schema Registry"
    description: "Validates event schemas [HTTPS over TLS 1.3]"
  - source: "Strimzi"
    destination: "Confluent Schema Registry"
    description: "Validates event schemas [HTTPS over TLS 1.3]"