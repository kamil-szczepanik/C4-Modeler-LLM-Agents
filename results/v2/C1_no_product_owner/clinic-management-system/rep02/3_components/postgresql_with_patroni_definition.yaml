level: component
scope: "Component diagram for the PostgreSQL with Patroni container"
parentContainer:
  name: "PostgreSQL with Patroni"
elements:
  - type: "component"
    name: "PostgreSQL Instance"
    technology: "PostgreSQL 15+"
    description: "Primary datastore ensuring active-passive high availability failover and handling encrypted SQL queries."
  - type: "component"
    name: "Patroni Daemon"
    technology: "Patroni Daemon"
    description: "Manages high availability failover and coordinates cluster state."
  - type: "component"
    name: "Distributed Configuration Store (Etcd)"
    technology: "Etcd"
    description: "Maintains cluster consensus and leader lock."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Connection pooling to handle high concurrent service loads from microservices."
  - type: "component"
    name: "pgBackRest"
    technology: "pgBackRest"
    description: "Backup and disaster recovery tool for continuous WAL archiving and backups."
  - type: "component"
    name: "Prometheus Exporters"
    technology: "Prometheus Exporters"
    description: "Sidecar components for monitoring replication lag and connection pool saturation."
relationships:
  - source: "Patient & Scheduling Service, EMR Core Service, Billing & Integration Service"
    destination: "PgBouncer"
    description: "Encrypted SQL queries over TLS [TCP 6432]"
  - source: "PgBouncer"
    destination: "PostgreSQL Instance"
    description: "Local socket or TLS-encrypted SQL [TCP 5432]"
  - source: "Patroni Daemon"
    destination: "Etcd"
    description: "Consensus and leader lock [HTTPS/gRPC]"
  - source: "Etcd"
    destination: "Patroni Daemon"
    description: "Consensus and leader lock [HTTPS/gRPC]"
  - source: "PostgreSQL Instance"
    destination: "pgBackRest"
    description: "Continuous WAL archiving and backups [Encrypted File Transfer]"
  - source: "pgBackRest"
    destination: "WORM-compliant S3 / MinIO"
    description: "Stores encrypted backups for 10-year retention [HTTPS/S3 API]"