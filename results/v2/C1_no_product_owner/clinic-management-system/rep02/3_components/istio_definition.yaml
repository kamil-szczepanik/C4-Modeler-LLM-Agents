level: component
scope: "Component diagram for the Istio container"
parentContainer:
  name: "Istio"
elements:
  - type: "component"
    name: "Istiod (Control Plane)"
    technology: "Go"
    description: "Manages configuration, cert issuance, and xDS policy pushes."
  - type: "component"
    name: "Istio CNI Plugin"
    technology: "Kubernetes CNI"
    description: "Manages pod network redirection without privileged init containers."
  - type: "component"
    name: "Envoy Sidecar Proxies"
    technology: "Envoy C++"
    description: "Injected alongside microservices for traffic management and telemetry."
  - type: "component"
    name: "East-West Gateway"
    technology: "Envoy Gateway"
    description: "Handles cross-network mTLS and service discovery between hybrid clusters."
  - type: "component"
    name: "Telemetry Provider"
    technology: "Prometheus, OpenTelemetry Collector"
    description: "Aggregates metrics and distributed traces."
relationships:
  - source: "Istiod (Control Plane)"
    destination: "Envoy Sidecar Proxies"
    description: "Configures via gRPC (xDS API)"
  - source: "Envoy Sidecar Proxies"
    destination: "Envoy Sidecar Proxies"
    description: "Enforces mTLS between internal microservices via Mutual TLS over TCP"
  - source: "Envoy Sidecar Proxies"
    destination: "East-West Gateway"
    description: "Route cross-cluster traffic through via mTLS over TCP"
  - source: "Envoy Sidecar Proxies"
    destination: "Telemetry Provider"
    description: "Export metrics and traces via OTLP / gRPC (TLS encrypted)"