level: component
scope: "Component diagram for the HashiCorp Vault container"
parentContainer:
  name: "HashiCorp Vault"
elements:
  - type: "component"
    name: "Secrets Engine Component"
    technology: "HashiCorp Vault Engine"
    description: "Manages secrets and sensitive data storage."
  - type: "component"
    name: "Auth Method Component"
    technology: "HashiCorp Vault Auth"
    description: "Handles authentication and identity verification."
  - type: "component"
    name: "Audit Device Component"
    technology: "HashiCorp Vault Audit"
    description: "Maintains immutable audit logs of interactions."
  - type: "component"
    name: "Transit Secrets Engine Component"
    technology: "HashiCorp Vault Transit"
    description: "Provides cryptographic operations as a service."
  - type: "component"
    name: "Raft Storage Manager Component"
    technology: "Integrated Raft Storage"
    description: "Manages distributed consensus and encrypted state replication."
relationships:
  - source: "EMR Core Service"
    destination: "Auth Method Component"
    description: "Authenticates via HTTPS/REST (JWT/Token) over mTLS"
  - source: "EMR Core Service"
    destination: "Transit Secrets Engine Component"
    description: "Requests cryptographic operations via mTLS/HTTPS"
  - source: "Vault Nodes"
    destination: "Vault Nodes (Raft)"
    description: "Replicates encrypted state via mTLS gRPC/TCP"
  - source: "Audit Device Component"
    destination: "WORM-compliant S3 / MinIO"
    description: "Streams immutable audit logs via HTTPS"