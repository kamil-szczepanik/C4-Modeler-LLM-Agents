level: component
scope: "Component diagram for the WORM-compliant S3 / MinIO container"
parentContainer:
  name: "WORM-compliant S3 / MinIO"
elements:
  - type: "component"
    name: "Object Storage Engine"
    technology: "MinIO Server in Erasure Coding mode"
    description: "Provides secure, highly available, and immutable object storage for electronic medical records and medical imaging files."
  - type: "component"
    name: "Object Locking & Retention Manager"
    technology: "AWS-compatible Object Lock in COMPLIANCE mode"
    description: "Enforces immutable 10-year data retention to prevent deletion or tampering."
  - type: "component"
    name: "IAM & Policy Enforcer"
    technology: "MinIO IAM / Open Policy Agent with HashiCorp Vault"
    description: "Manages identity, access policies, and integrates with Vault for security controls."
  - type: "component"
    name: "Replication & Tiering Controller"
    technology: "MinIO Replication & Lifecycle Engine"
    description: "Handles cross-site replication and lifecycle management for hybrid multi-site deployments."
  - type: "component"
    name: "EMR Core Service"
    technology: "S3 API over TLS 1.3"
    description: "External service that uploads and reads encrypted medical objects."
  - type: "component"
    name: "AWS S3"
    technology: "External AWS S3 (eu-central-1)"
    description: "External storage destination for cross-site replication of immutable payloads."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "Vault Transit Secrets Engine API over HTTPS"
    description: "Provides dynamic KMS keys for encryption."
relationships:
  - source: "EMR Core Service"
    destination: "Object Locking & Retention Manager"
    description: "Uploads and reads encrypted medical objects via S3 API over TLS 1.3"
  - source: "Object Storage Engine"
    destination: "AWS S3"
    description: "Replicates immutable payloads via S3 API over TLS 1.3 (Cross-Site Replication)"
  - source: "IAM & Policy Enforcer"
    destination: "HashiCorp Vault"
    description: "Fetches dynamic KMS keys via Vault Transit Secrets Engine API over HTTPS"