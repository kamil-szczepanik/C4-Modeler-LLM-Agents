level: component
scope: "Component diagram for the Billing & Integration Service container"
parentContainer:
  name: "Billing & Integration Service"
elements:
  - type: "component"
    name: "API Router"
    technology: "Python / FastAPI"
    description: "Routes incoming REST/gRPC traffic."
  - type: "component"
    name: "FHIR Translation Engine"
    technology: "Python, Pydantic & SQLAlchemy"
    description: "Validates and translates payloads to HL7 FHIR."
  - type: "component"
    name: "Payment & Claims Processor"
    technology: "Python / FastAPI"
    description: "Processes claims and payments asynchronously."
  - type: "component"
    name: "Integration Event Publisher"
    technology: "Python, Kafka / RabbitMQ / NATS client"
    description: "Publishes and consumes events using DLQs."
  - type: "component"
    name: "Billing Data Access Repository"
    technology: "SQLAlchemy"
    description: "Manages database operations with the relational store."
relationships:
  - source: "API Router"
    destination: "FHIR Translation Engine"
    description: "Forwards requests for FHIR validation [Pydantic]"
  - source: "FHIR Translation Engine"
    destination: "Payment & Claims Processor"
    description: "Passes validated payloads for processing"
  - source: "Payment & Claims Processor"
    destination: "Integration Event Publisher"
    description: "Dispatches asynchronous events [TLS 1.3]"
  - source: "Payment & Claims Processor"
    destination: "Billing Data Access Repository"
    description: "Reads and writes relational data [Encrypted SQL connections]"