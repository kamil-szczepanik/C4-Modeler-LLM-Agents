level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "TLS Termination & Edge Firewall"
    technology: "Kong Edge Security Module"
    description: "Handles incoming TLS termination, edge firewall rules, and perimeter security."
  - type: "component"
    name: "Auth Interceptor Plugin"
    technology: "Kong OAuth2/OIDC Plugin with local JWKS caching"
    description: "Validates tokens and authenticates users at the edge."
  - type: "component"
    name: "Routing & Load Balancer Engine"
    technology: "Kong Core Router"
    description: "Routes incoming API requests to downstream microservices and manages load balancing."
  - type: "component"
    name: "Rate Limiting & Throttling Engine"
    technology: "Kong Rate Limiting Plugin with Redis Cluster"
    description: "Enforces rate limits and request throttling to protect backend services."
  - type: "component"
    name: "Request Transformation Plugin"
    technology: "Kong Transformation Plugin"
    description: "Modifies headers, injects propagated JWTs, and adapts requests before forwarding."
relationships:
  - source: "TLS Termination & Edge Firewall"
    destination: "Auth Interceptor Plugin"
    description: "Passes decrypted traffic for authentication"
  - source: "Auth Interceptor Plugin"
    destination: "Rate Limiting & Throttling Engine"
    description: "Enforces limits for authenticated requests"
  - source: "Rate Limiting & Throttling Engine"
    destination: "Request Transformation Plugin"
    description: "Passes allowed requests for transformation"
  - source: "Request Transformation Plugin"
    destination: "Routing & Load Balancer Engine"
    description: "Routes transformed requests to backend services"