level: component
scope: "Component diagram for the EMR Core Service container"
parentContainer:
  name: "EMR Core Service"
elements:
  - type: "component"
    name: "EMR Facade / Controller"
    technology: "Spring gRPC / Protobuf"
    description: "Handles incoming gRPC requests and schema validation."
  - type: "component"
    name: "Policy Enforcement Component"
    technology: "Spring Security filter/aspect"
    description: "Evaluates Attribute-Based Access Control (ABAC) rules."
  - type: "component"
    name: "Clinical Record Manager"
    technology: "Java Spring Boot"
    description: "Manages core business logic and ACID transactions."
  - type: "component"
    name: "Audit Trail Interceptor"
    technology: "In-process eventing and Kafka producer"
    description: "Signs and logs PHI access for compliance."
  - type: "component"
    name: "KMS Client Adapter"
    technology: "HashiCorp Vault & AWS KMS with Resilience4j"
    description: "Handles envelope encryption and key management with resilience fallbacks."
  - type: "component"
    name: "PostgreSQL Database"
    technology: "PostgreSQL with PgBouncer"
    description: "Persistent storage utilizing PgBouncer connection pooling and column-level encryption."
relationships:
  - source: "API Gateway"
    destination: "EMR Facade / Controller"
    description: "Routes electronic medical records requests [gRPC with Istio mTLS and propagated JWTs]"
  - source: "EMR Facade / Controller"
    destination: "Policy Enforcement Component"
    description: "Processes and authorizes requests [In-process Spring Security filter/aspect and method calls]"
  - source: "Policy Enforcement Component"
    destination: "Clinical Record Manager"
    description: "Authorizes and passes requests to business logic"
  - source: "Clinical Record Manager"
    destination: "KMS Client Adapter"
    description: "Encrypts sensitive PHI fields [gRPC/HTTPS]"
  - source: "Clinical Record Manager"
    destination: "PostgreSQL Database"
    description: "Persists clinical records [JDBC over TLS with AES-256]"
  - source: "Clinical Record Manager"
    destination: "Audit Trail Interceptor"
    description: "Triggers compliance audit logging"
  - source: "Audit Trail Interceptor"
    destination: "Apache Kafka"
    description: "Publishes cryptographically signed compliance audit events [In-process eventing and Kafka producer]"