level: component
scope: "Component diagram for the Identity & Access Management Service container"
parentContainer:
  name: "Identity & Access Management Service"
elements:
  - type: "component"
    name: "Authentication Engine"
    technology: "Keycloak SPI"
    description: "Handles credential verification, WebAuthn/TOTP MFA, and session management."
  - type: "component"
    name: "Federation Broker"
    technology: "Keycloak Broker Service"
    description: "Manages SAML/OIDC federation with Enterprise IdP."
  - type: "component"
    name: "Token Issuance Service"
    technology: "Keycloak JWT Provider"
    description: "Issues RS256-signed short-lived JWTs."
  - type: "component"
    name: "Session & Revocation Component"
    technology: "Infinispan Distributed Cache Grid"
    description: "Handles cross-region session replication and back-channel logout."
  - type: "component"
    name: "Audit Event Dispatcher"
    technology: "Keycloak Event SPI"
    description: "Streams security events with a persistent Write-Ahead Log (WAL)."
  - type: "component"
    name: "IAM Database Repository"
    technology: "Multi-region PostgreSQL cluster with AES-256 encryption"
    description: "Stores credentials and audit logs securely."
  - type: "component"
    name: "API Gateway"
    technology: "API Gateway"
    description: "External API gateway validating tokens via JWKS."
relationships:
  - source: "Authentication Engine"
    destination: "IAM Database Repository"
    description: "Synchronous queries via JDBC over TLS."
  - source: "Token Issuance Service"
    destination: "API Gateway"
    description: "JWKS endpoint exposed over HTTPS for decentralized token validation."
  - source: "Authentication Engine"
    destination: "Session & Revocation Component"
    description: "In-memory cache replication via Infinispan TCP over mTLS."
  - source: "Authentication Engine"
    destination: "Audit Event Dispatcher"
    description: "Non-blocking event emission using local queues."