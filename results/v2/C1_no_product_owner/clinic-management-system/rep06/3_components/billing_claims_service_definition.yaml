level: component
scope: "Component diagram for the Billing & Claims Service container"
parentContainer:
  name: "Billing & Claims Service"
elements:
  - type: "component"
    name: "Billing API Controller"
    technology: "FastAPI router"
    description: "Handling incoming requests and validating scoped JWT claims."
  - type: "component"
    name: "Claim Engine"
    technology: "Python domain logic"
    description: "Processing insurance claim rules and formatting payloads."
  - type: "component"
    name: "Payment Processor Client"
    technology: "Secure integration client"
    description: "Utilizing idempotency keys and tokenized vault storage."
  - type: "component"
    name: "Billing Data Access Layer (DAL)"
    technology: "SQLAlchemy ORM"
    description: "Enforcing AES-256 encryption, column-level encryption, and immutable audit logs."
  - type: "component"
    name: "Claims Event Publisher"
    technology: "Apache Kafka producer"
    description: "Broadcasting asynchronous billing status events."
  - type: "component"
    name: "API Gateway"
    technology: "Gateway"
    description: "External dependency routing billing and claims requests."
  - type: "component"
    name: "Payment Gateway"
    technology: "External Gateway"
    description: "Processes tokenized patient payments."
  - type: "component"
    name: "Insurance Payer APIs"
    technology: "External API"
    description: "Submits claims and verifies insurance."
  - type: "component"
    name: "Apache Kafka"
    technology: "Event Streaming"
    description: "Handles reliable event streaming with dead-letter queues and KEDA autoscaling."
relationships:
  - source: "API Gateway"
    destination: "Billing API Controller"
    description: "Routes billing and claims requests [gRPC / Istio mTLS]"
  - source: "Payment Processor Client"
    destination: "Payment Gateway"
    description: "Processes tokenized patient payments [HTTPS / TLS 1.3]"
  - source: "Claim Engine"
    destination: "Insurance Payer APIs"
    description: "Submits claims and verifies insurance [HTTPS / TLS 1.3 with certificate pinning]"
  - source: "Claims Event Publisher"
    destination: "Apache Kafka"
    description: "Emits asynchronous events [Kafka / TLS]"