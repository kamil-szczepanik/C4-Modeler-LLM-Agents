level: component
scope: "Component diagram for the Patient & Scheduling Service container"
parentContainer:
  name: "Patient & Scheduling Service"
elements:
  - type: "component"
    name: "Patient Management Component"
    technology: "Go, Chi router"
    description: "Manages patient admissions and records within the Clinic Management System."
  - type: "component"
    name: "Scheduling Engine Component"
    technology: "Go"
    description: "Handles appointment scheduling logic for the Clinic Management System."
  - type: "component"
    name: "Data Access Repository"
    technology: "Go pgx driver"
    description: "Interfaces with the database using native Go pgx over TLS 1.3."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Watermill Go library"
    description: "Publishes asynchronous domain events to the message broker."
  - type: "component"
    name: "API Gateway"
    technology: "Istio"
    description: "External entry point routing requests to internal components using gRPC, mTLS, and JWT."
  - type: "component"
    name: "External State Store"
    technology: "PostgreSQL / Redis Enterprise"
    description: "Centralized external state management for active-active deployments."
  - type: "component"
    name: "Message Broker"
    technology: "Apache Kafka"
    description: "Event-driven decoupling for downstream EMR and FHIR brokers."
relationships:
  - source: "API Gateway"
    destination: "Patient Management Component"
    description: "gRPC with Istio mTLS and JWT"
  - source: "API Gateway"
    destination: "Scheduling Engine Component"
    description: "gRPC with Istio mTLS and JWT"
  - source: "Scheduling Engine Component"
    destination: "External State Store"
    description: "PostgreSQL Wire Protocol over TLS 1.3"
  - source: "Patient Management Component"
    destination: "Data Access Repository"
    description: "Native Go pgx over TLS 1.3"
  - source: "Event Publisher Component"
    destination: "Message Broker"
    description: "Apache Kafka / AMQP over TLS 1.3 with client-side payload encryption"