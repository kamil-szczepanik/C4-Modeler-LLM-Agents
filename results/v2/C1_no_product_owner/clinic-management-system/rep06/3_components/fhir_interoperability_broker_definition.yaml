level: component
scope: "Component diagram for the FHIR Interoperability Broker container"
parentContainer:
  name: "FHIR Interoperability Broker"
elements:
  - type: "component"
    name: "FHIR API Route Controller"
    technology: "Apache Camel / REST DSL"
    description: "Exposes standard RESTful FHIR endpoints, validates incoming payloads, and triggers audit event captures."
  - type: "component"
    name: "Transformation Engine"
    technology: "Apache Camel"
    description: "Maps internal domain models to HL7 FHIR resources (R4/STU3)."
  - type: "component"
    name: "External Connector Client"
    technology: "Apache Camel / Resilience4j"
    description: "Manages outbound mTLS connections, retries, and circuit-breaking for external dependencies."
  - type: "component"
    name: "Audit & Compliance Interceptor"
    technology: "Spring AOP / Apache Camel Interceptor"
    description: "Captures immutable audit logs and streams redacted events."
relationships:
  - source: "FHIR API Route Controller"
    destination: "Transformation Engine"
    description: "Passes raw payloads [In-memory Java objects]"
  - source: "Transformation Engine"
    destination: "External Connector Client"
    description: "Sends mapped FHIR bundles [In-memory]"
  - source: "FHIR API Route Controller"
    destination: "Audit & Compliance Interceptor"
    description: "Triggers audit event capture [In-memory]"
  - source: "Audit & Compliance Interceptor"
    destination: "Central SIEM/Audit Store"
    description: "Streams redacted audit logs [Syslog over TLS / Kafka]"
  - source: "External Connector Client"
    destination: "External Lab / Imaging Systems"
    description: "Exchanges lab and imaging data [HL7 FHIR APIs over HTTPS with mTLS]"