# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Doctor"
    description: "Medical professional who accesses and manages electronic medical records and patient schedules."
  - type: "person"
    name: "Receptionist"
    description: "Front-desk staff who handles patient admissions and scheduling."
  - type: "person"
    name: "Patient"
    description: "End user who interacts with the system for appointments and records."
  - type: "person"
    name: "Billing Administrator"
    description: "Staff member responsible for managing billing, payments, and insurance claims."
  - type: "person"
    name: "System Administrator"
    description: "IT professional responsible for managing and maintaining the hybrid cloud platform."
  - type: "externalSystem"
    name: "External Lab / Imaging Systems"
    description: "Third-party diagnostic systems providing laboratory and imaging results."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service processing financial transactions and credit card payments."
  - type: "externalSystem"
    name: "Insurance Payer APIs"
    description: "External APIs used for insurance verification and claims processing."
  - type: "externalSystem"
    name: "Enterprise Identity Provider (IdP)"
    description: "Centralized identity provider for authentication and user management."
  - type: "container"
    name: "API Gateway"
    technology: "Kong/NGINX"
    description: "Handles TLS termination, rate limiting, and routing."
  - type: "container"
    name: "Identity & Access Management Service"
    technology: "Keycloak"
    description: "Manages OAuth2/OIDC, MFA, and integration with Enterprise IdP."
  - type: "container"
    name: "Patient & Scheduling Service"
    technology: "Go / Java Spring Boot"
    description: "Manages patient admissions, appointments, and scheduling."
  - type: "container"
    name: "EMR Core Service"
    technology: "Java Spring Boot"
    description: "Manages electronic medical records core business logic."
  - type: "container"
    name: "Billing & Claims Service"
    technology: "Node.js / Python"
    description: "Handles billing, payments, and insurance claims."
  - type: "container"
    name: "FHIR Interoperability Broker"
    technology: "Apache Camel / Azure Health Data Services"
    description: "Translates and brokers HL7 FHIR data to external systems."
relationships:
  - source: "Doctor"
    destination: "API Gateway"
    description: "Accesses patient records and schedules"
    technology: "HTTPS / JSON / OAuth2/OIDC with MFA"
  - source: "Receptionist"
    destination: "API Gateway"
    description: "Handles patient admissions and scheduling"
    technology: "HTTPS / JSON / OAuth2/OIDC with MFA"
  - source: "Patient"
    destination: "API Gateway"
    description: "Accesses appointments and personal records"
    technology: "HTTPS / JSON / OAuth2/OIDC with MFA"
  - source: "Billing Administrator"
    destination: "API Gateway"
    description: "Manages billing and financial data"
    technology: "HTTPS / JSON / OAuth2/OIDC with MFA"
  - source: "System Administrator"
    destination: "API Gateway"
    description: "Manages platform infrastructure and system configuration"
    technology: "HTTPS / JSON / OAuth2/OIDC with MFA"
  - source: "API Gateway"
    destination: "Identity & Access Management Service"
    description: "Authenticates users and validates tokens"
    technology: "gRPC with Istio mTLS"
  - source: "API Gateway"
    destination: "Patient & Scheduling Service"
    description: "Routes patient and scheduling requests"
    technology: "gRPC with Istio mTLS and propagated JWTs"
  - source: "API Gateway"
    destination: "EMR Core Service"
    description: "Routes electronic medical records requests"
    technology: "gRPC with Istio mTLS and propagated JWTs"
  - source: "API Gateway"
    destination: "Billing & Claims Service"
    description: "Routes billing and claims requests"
    technology: "gRPC with Istio mTLS and propagated JWTs"
  - source: "API Gateway"
    destination: "FHIR Interoperability Broker"
    description: "Routes interoperability and data exchange requests"
    technology: "gRPC with Istio mTLS and propagated JWTs"
  - source: "Identity & Access Management Service"
    destination: "Enterprise Identity Provider (IdP)"
    description: "Integrates for enterprise authentication"
    technology: "OIDC / SAML over HTTPS"
  - source: "FHIR Interoperability Broker"
    destination: "External Lab / Imaging Systems"
    description: "Exchanges lab and imaging data"
    technology: "HL7 FHIR APIs over HTTPS"
  - source: "Billing & Claims Service"
    destination: "Payment Gateway"
    description: "Processes patient payments and transactions"
    technology: "HTTPS / JSON"
  - source: "Billing & Claims Service"
    destination: "Insurance Payer APIs"
    description: "Verifies insurance and submits claims"
    technology: "HTTPS / JSON"