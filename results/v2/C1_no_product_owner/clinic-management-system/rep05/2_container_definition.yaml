level: container
scope: "Container diagram for Clinic Management System (CMS)"
system:
  name: "Clinic Management System (CMS)"
elements:
  - type: "person"
    name: "Patients, Doctors, Nurses, and Administrative Staff"
    description: "Users who interact with the clinic management system for healthcare delivery, records, scheduling, and administration."
  - type: "externalSystem"
    name: "External Laboratory & Imaging Systems"
    description: "External clinical systems used for medical testing and imaging."
  - type: "externalSystem"
    name: "Payment Gateway and Insurance Clearinghouse"
    description: "External financial systems for processing payments and insurance claims."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Provides authentication services with OIDC/SAML and Multi-Factor Authentication."
  - type: "externalSystem"
    name: "SIEM & Audit Platform"
    description: "Platform for security information, event management, and auditing."
  - type: "externalSystem"
    name: "Enterprise KMS"
    description: "Key Management Service backed by HSM for data encryption."
  - type: "externalSystem"
    name: "Global Traffic Manager / WAF"
    description: "Edge routing, active-active traffic management, and DDoS protection."
  - type: "container"
    name: "API Gateway"
    technology: "Traefik/Envoy"
    description: "Handles secure ingress routing, rate limiting, and TLS termination."
  - type: "container"
    name: "Identity & Access Management"
    technology: "Keycloak"
    description: "Manages multi-factor authentication, OAuth2/OIDC token validation, and authorization."
  - type: "container"
    name: "Core Services"
    technology: "Node.js / Spring Boot"
    description: "Domain microservices managing patient admissions, EMRs, scheduling, and billing."
  - type: "container"
    name: "FHIR Interoperability Engine"
    technology: "HAPI FHIR / Apache Camel"
    description: "Handles HL7 and FHIR transformations and external system interoperability."
  - type: "container"
    name: "Regional Databases"
    technology: "PostgreSQL / CockroachDB"
    description: "Regional instances with asynchronous encrypted replication for data residency and latency compliance."
  - type: "container"
    name: "Encrypted Object Storage"
    technology: "MinIO / S3"
    description: "Stores encrypted files, documents, and medical imaging objects."
  - type: "container"
    name: "Message Brokers"
    technology: "Kafka / NATS"
    description: "Enables cross-site synchronization and asynchronous event-driven messaging."
relationships:
  - source: "Patients, Doctors, Nurses, and Administrative Staff"
    destination: "API Gateway"
    description: "Accesses clinical workflows, EMRs, scheduling, and billing"
    technology: "HTTPS / TLS / OAuth2/OIDC"
  - source: "Global Traffic Manager / WAF"
    destination: "API Gateway"
    description: "Routes external traffic and protects against threats"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Identity & Access Management"
    description: "Validates tokens and authenticates requests"
    technology: "OAuth2/OIDC"
  - source: "API Gateway"
    destination: "Core Services"
    description: "Routes ingress traffic to domain microservices"
    technology: "gRPC over mTLS"
  - source: "Core Services"
    destination: "Identity & Access Management"
    description: "Verifies user permissions and security contexts"
    technology: "gRPC over mTLS"
  - source: "Core Services"
    destination: "FHIR Interoperability Engine"
    description: "Requests HL7/FHIR clinical data translations"
    technology: "gRPC over mTLS"
  - source: "Core Services"
    destination: "Regional Databases"
    description: "Reads and writes relational domain data"
    technology: "Encrypted SQL over TLS"
  - source: "Core Services"
    destination: "Encrypted Object Storage"
    description: "Stores and retrieves encrypted documents and images"
    technology: "HTTPS / S3 API"
  - source: "Core Services"
    destination: "Message Brokers"
    description: "Publishes and consumes asynchronous events"
    technology: "Encrypted Message Broker Protocol"
  - source: "FHIR Interoperability Engine"
    destination: "External Laboratory & Imaging Systems"
    description: "Exchanges clinical data and medical imaging results"
    technology: "HL7 FHIR APIs over HTTPS"
  - source: "Core Services"
    destination: "Payment Gateway and Insurance Clearinghouse"
    description: "Processes billing, payments, and insurance claims"
    technology: "Secure API over HTTPS"
  - source: "Identity & Access Management"
    destination: "Identity Provider (IdP)"
    description: "Federates authentication and identity management"
    technology: "OIDC / SAML"
  - source: "Core Services"
    destination: "SIEM & Audit Platform"
    description: "Ships immutable audit logs instantly"
    technology: "Encrypted Syslog / HTTPS"
  - source: "Core Services"
    destination: "Enterprise KMS"
    description: "Manages encryption keys for data security"
    technology: "PKCS#11 / Cloud KMS API over TLS 1.3"
  - source: "Message Brokers"
    destination: "Message Brokers"
    description: "Cross-site synchronization via secure tunnels"
    technology: "Encrypted Message Broker Protocol over Secure Tunnels"