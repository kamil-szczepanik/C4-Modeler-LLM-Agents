level: component
scope: "Component diagram for the Identity & Access Management container"
parentContainer:
  name: "Identity & Access Management"
elements:
  - type: "component"
    name: "Authentication Engine"
    technology: "Keycloak Auth SPI"
    description: "Manages MFA, credentials, and IdP federation."
  - type: "component"
    name: "Token Service"
    technology: "Keycloak Token Endpoint"
    description: "Issues short-lived signed JWTs with OIDC Backchannel Logout."
  - type: "component"
    name: "Authorization & RBAC Provider"
    technology: "Keycloak Authorization Services"
    description: "Evaluates clinical roles."
  - type: "component"
    name: "Session & User Store Cache"
    technology: "Embedded Infinispan"
    description: "Provides cross-site replication and JDBC-PING."
  - type: "component"
    name: "Audit Event Dispatcher"
    technology: "Keycloak Event Listener SPI"
    description: "Streams masked security events."
  - type: "component"
    name: "Identity Provider (IdP)"
    technology: "External IdP"
    description: "External identity provider for federation."
  - type: "component"
    name: "SIEM & Audit Platform"
    technology: "Kafka / Syslog over TLS"
    description: "External platform for receiving audit trails."
  - type: "component"
    name: "Enterprise KMS"
    technology: "KMS"
    description: "Provides envelope encryption for master keys, session data, and token signing."
  - type: "component"
    name: "API Gateway"
    technology: "API Gateway"
    description: "External gateway for validating short-lived JWTs."
  - type: "component"
    name: "Core Services"
    technology: "Core Services"
    description: "Internal backend services verifying permissions and validating tokens."
relationships:
  - source: "Authentication Engine"
    destination: "Identity Provider (IdP)"
    description: "Federates authentication via OIDC/SAML"
  - source: "Core Services"
    destination: "Authorization & RBAC Provider"
    description: "Verifies permissions via gRPC over mTLS"
  - source: "Audit Event Dispatcher"
    destination: "SIEM & Audit Platform"
    description: "Streams audit trails via Syslog over TLS / Kafka"
  - source: "Token Service"
    destination: "API Gateway"
    description: "Validates short-lived JWTs via OAuth2/OIDC"
  - source: "Token Service"
    destination: "Core Services"
    description: "Validates short-lived JWTs via OAuth2/OIDC"