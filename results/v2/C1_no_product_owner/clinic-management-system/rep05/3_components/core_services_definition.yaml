level: component
scope: "Component diagram for the Core Services container"
parentContainer:
  name: "Core Services"
elements:
  - type: "component"
    name: "Patient Registry Component"
    technology: "Spring Boot Runtime"
    description: "Handles patient admissions and profile management."
  - type: "component"
    name: "Scheduling Engine"
    technology: "Spring Boot Runtime"
    description: "Manages appointments and doctor schedules."
  - type: "component"
    name: "EMR Manager"
    technology: "Spring Boot Runtime"
    description: "Manages electronic medical records."
  - type: "component"
    name: "Billing Processor"
    technology: "Spring Boot Runtime"
    description: "Handles financial transactions and billing operations."
  - type: "component"
    name: "Event Dispatcher Component"
    technology: "Spring Boot Runtime"
    description: "Dispatches asynchronous events across the system."
relationships:
  - source: "Patient Registry Component"
    destination: "Event Dispatcher Component"
    description: "Publishes patient events via Encrypted Message Broker Protocol"
  - source: "Scheduling Engine"
    destination: "Event Dispatcher Component"
    description: "Publishes scheduling events via Encrypted Message Broker Protocol"
  - source: "EMR Manager"
    destination: "Event Dispatcher Component"
    description: "Publishes EMR events via Encrypted Message Broker Protocol"
  - source: "Billing Processor"
    destination: "Event Dispatcher Component"
    description: "Publishes billing events via Encrypted Message Broker Protocol"