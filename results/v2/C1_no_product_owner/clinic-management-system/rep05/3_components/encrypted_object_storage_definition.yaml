level: component
scope: "Component diagram for the Encrypted Object Storage container"
parentContainer:
  name: "Encrypted Object Storage"
elements:
  - type: "component"
    name: "S3 API Gateway Layer"
    technology: "MinIO/Ceph, HTTPS, TLS 1.3"
    description: "Handles HTTPS/S3 requests and TLS 1.3."
  - type: "component"
    name: "Key Management & Envelope Encryption Engine"
    technology: "AES-256-GCM, Enterprise KMS"
    description: "Manages per-object AES-256-GCM data encryption keys via Enterprise KMS."
  - type: "component"
    name: "Replication & Erasure Coding Manager"
    technology: "Reed-Solomon, Active-Active Replication"
    description: "Handles localized active-active replication, asynchronous geo-replication, Reed-Solomon erasure coding, and tiered storage."
  - type: "component"
    name: "Audit Logging Interceptor"
    technology: "gRPC"
    description: "Captures metadata access events and streams them via gRPC."
  - type: "component"
    name: "Policy & WORM Enforcer"
    technology: "Object Lock (WORM)"
    description: "Evaluates fine-grained access policies and enforces 10-year immutable WORM retention."
relationships:
  - source: "Core Services"
    destination: "S3 API Gateway Layer"
    description: "Uploads and downloads encrypted blobs via HTTPS / S3 API."
  - source: "S3 API Gateway Layer"
    destination: "Policy & WORM Enforcer"
    description: "Validates request authorization and retention policies via in-process gRPC."
  - source: "Key Management & Envelope Encryption Engine"
    destination: "Enterprise KMS"
    description: "Fetches Key Encryption Keys via gRPC / mTLS."
  - source: "Audit Logging Interceptor"
    destination: "SIEM & Audit Platform"
    description: "Emits access audit trails via Syslog / Kafka."