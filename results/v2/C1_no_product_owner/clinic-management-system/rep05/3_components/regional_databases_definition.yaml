level: component
scope: "Component diagram for the Regional Databases container"
parentContainer:
  name: "Regional Databases"
elements:
  - type: "component"
    name: "Distributed SQL Engine"
    technology: "CockroachDB v23+"
    description: "Handles multi-active regional nodes, automatic sharding, ACID guarantees, and geo-partitioning."
  - type: "component"
    name: "Connection Pooler & Routing Proxy"
    technology: "PgBouncer / built-in SQL proxy"
    description: "Manages client connections and routes SQL traffic."
  - type: "component"
    name: "Database Encryption Manager"
    technology: "Native KMS integration"
    description: "Manages AES-256 TDE and Column-Level Encryption (CLE) keys for PHI security."
  - type: "component"
    name: "Audit Log Exporter"
    technology: "Ring-buffer local spooling"
    description: "Asynchronously spools and streams audit logs to the SIEM platform."
relationships:
  - source: "Connection Pooler & Routing Proxy"
    destination: "Distributed SQL Engine"
    description: "Local loopback / internal mTLS"
  - type: "component"
    name: "Core Services"
    technology: "Node.js / Spring Boot"
    description: "External callers interacting with the database layer."
  - source: "Core Services"
    destination: "Connection Pooler & Routing Proxy"
    description: "Encrypted SQL over TLS via mTLS, Port 26257"
  - type: "component"
    name: "SIEM & Audit Platform"
    technology: "Enterprise KMS & SIEM & Audit Platform"
    description: "External audit platform."
  - source: "Audit Log Exporter"
    destination: "SIEM & Audit Platform"
    description: "Async TLS streaming"
  - type: "component"
    name: "Enterprise KMS"
    technology: "Enterprise KMS & SIEM & Audit Platform"
    description: "External key management service."
  - source: "Database Encryption Manager"
    destination: "Enterprise KMS"
    description: "Envelope encryption / TDE keys"