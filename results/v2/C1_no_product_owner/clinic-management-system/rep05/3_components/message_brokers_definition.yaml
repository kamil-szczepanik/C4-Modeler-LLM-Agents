level: component
scope: "Component diagram for the Message Brokers container"
parentContainer:
  name: "Message Brokers"
elements:
  - type: "component"
    name: "Event Ingestion & Routing Engine"
    technology: "Apache Kafka"
    description: "Provides high-throughput, fault-tolerant event streams for patient admissions, electronic medical records, scheduling, and billing."
  - type: "component"
    name: "Lightweight Edge Broker"
    technology: "NATS"
    description: "Handles low-latency, real-time local messaging on-premises in on-prem-k8s."
  - type: "component"
    name: "Cross-Site Replication Manager"
    technology: "Kafka MirrorMaker 2 with TLS Tunnels"
    description: "Performs multi-master synchronization between on-prem-k8s and eu-central-1."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry"
    description: "Enforces strict AVRO schema evolution and prevents breaking changes."
  - type: "component"
    name: "Access Control Enforcer"
    technology: "Apache Kafka built-in ACLs integrated with Keycloak"
    description: "Enforces fine-grained, token-based authorization and topic-level ACLs."
relationships:
  - source: "Event Ingestion & Routing Engine"
    destination: "Cross-Site Replication Manager"
    description: "Synchronizes partitioned topics via Mutual TLS over IPSec."