level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Router & WAF"
    technology: "Global Traffic Manager / WAF"
    description: "Routes external traffic and enforces perimeter security with mTLS attestation."
  - type: "component"
    name: "Envoy Proxy Engine"
    technology: "Envoy"
    description: "Provides gRPC-web support, native tracing, fine-grained rate-limiting, and ingress routing."
  - type: "component"
    name: "Authentication Filter"
    technology: "Keycloak / OAuth2 / OIDC"
    description: "Validates JWT tokens and checks scope permissions for incoming requests."
relationships:
  - source: "Edge Router & WAF"
    destination: "Envoy Proxy Engine"
    description: "Routes external traffic via [HTTPS] with mTLS attestation"
  - source: "Envoy Proxy Engine"
    destination: "Authentication Filter"
    description: "Validates JWT tokens and validates scopes via [OAuth2/OIDC]"