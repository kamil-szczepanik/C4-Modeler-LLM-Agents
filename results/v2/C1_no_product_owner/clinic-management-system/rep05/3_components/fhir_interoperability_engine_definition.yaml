level: component
scope: "Component diagram for the FHIR Interoperability Engine container"
parentContainer:
  name: "FHIR Interoperability Engine"
elements:
  - type: "component"
    name: "API Router & Validator Component"
    technology: "Apache Camel"
    description: "Evaluates OAuth2/JWT claims and SMART scopes, validating incoming clinical data payloads."
  - type: "component"
    name: "Security & Policy Enforcement Component"
    technology: "Apache Camel Policy / Keycloak Adapter"
    description: "Enforces security policies, authentication, and authorization rules."
  - type: "component"
    name: "Transformation Engine Component"
    technology: "Apache Camel / HAPI FHIR JPA"
    description: "Passes and transforms raw payloads into standardized FHIR resources."
  - type: "component"
    name: "FHIR Repository Adapter Component"
    technology: "HAPI FHIR JPA"
    description: "Persists and queries standardized FHIR resources."
relationships:
  - source: "API Router & Validator Component"
    destination: "Security & Policy Enforcement Component"
    description: "Evaluates OAuth2/JWT claims and SMART scopes [In-memory Java filter]"
  - source: "API Router & Validator Component"
    destination: "Transformation Engine Component"
    description: "Passes raw payloads for mapping [Internal Java Method / Camel Direct]"
  - source: "Transformation Engine Component"
    destination: "FHIR Repository Adapter Component"
    description: "Persists and queries standardized resources [JPA / JDBC over TLS]"