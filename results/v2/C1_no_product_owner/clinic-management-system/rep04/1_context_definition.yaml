level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed to manage patient admissions, electronic medical records (EMR), scheduling, and billing for medium-sized healthcare facilities."
elements:
  - type: "person"
    name: "Patient/Client"
    description: "End-user interacting via web/mobile portals for appointments and records."
  - type: "person"
    name: "Clinician/Medical Staff"
    description: "Medical professionals managing electronic medical records (EMR) and patient care."
  - type: "person"
    name: "Billing Admin"
    description: "Administrative staff managing billing and insurance claims."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing laboratory and medical imaging data."
  - type: "externalSystem"
    name: "Payment Gateway / Insurance Clearinghouse"
    description: "External system for processing payments and submitting insurance claims."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External identity provider handling user authentication via OIDC/SAML."
relationships:
  - source: "Patient/Client"
    destination: "Clinic Management System"
    description: "Interact via Web/Mobile portal for appointments and records"
    technology: "HTTPS"
  - source: "Clinician/Medical Staff"
    destination: "Clinic Management System"
    description: "Access and manage EMR and clinical workflows"
    technology: "HTTPS"
  - source: "Billing Admin"
    destination: "Clinic Management System"
    description: "Manage billing interfaces and financial transactions"
    technology: "HTTPS"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users via OIDC/SAML with short-lived JWTs and MFA"
    technology: "OIDC/SAML"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Integrates clinical data exchange"
    technology: "HL7 FHIR (REST/JSON over TLS)"
  - source: "Clinic Management System"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Submits payment claims"
    technology: "Secure REST APIs"