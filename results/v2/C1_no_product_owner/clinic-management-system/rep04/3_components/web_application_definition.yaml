level: component
scope: "Component diagram for the Web Application container"
parentContainer:
  name: "Web Application"
elements:
  - type: "component"
    name: "Patient Portal UI Module"
    technology: "React / Next.js"
    description: "Provides the user interface for patients and clients to access their records and portal."
  - type: "component"
    name: "Clinician Dashboard Module"
    technology: "React / Next.js"
    description: "Provides medical staff with tools to fetch EMR data and manage clinical workflows."
  - type: "component"
    name: "Billing Console Module"
    technology: "React / Next.js"
    description: "Provides billing administrators with interfaces to manage financial records and transactions."
  - type: "component"
    name: "Auth & Session Manager"
    technology: "TypeScript / OAuth2 / OIDC"
    description: "Manages user sessions, tokens, and authentication states securely."
  - type: "component"
    name: "State Management & API Client Module"
    technology: "TypeScript / gRPC-Web / HTTPS"
    description: "Handles client-side state and communicates with backend services and the API Gateway."
  - type: "component"
    name: "Client-Side Routing & RBAC Guard"
    technology: "TypeScript / React Router"
    description: "Enforces role-based access control and handles navigation within the application."
relationships:
  - source: "Clinician Dashboard Module"
    destination: "API Gateway"
    description: "Fetches EMR data via [gRPC-Web / HTTPS]"
  - source: "Auth & Session Manager"
    destination: "Identity Provider"
    description: "Validates sessions via [OpenID Connect / HTTPS]"
  - source: "Web Application"
    destination: "API Gateway"
    description: "Sends user requests [HTTPS/TLS with OAuth2/OIDC and mutual TLS]"