level: component
scope: "Component diagram for the Billing Microservice container"
parentContainer:
  name: "Billing Microservice"
elements:
  - type: "component"
    name: "Billing API Controller"
    technology: "Spring Boot REST Controller"
    description: "Handles insurance claim submissions and incoming internal requests via gRPC over mTLS."
  - type: "component"
    name: "Claim Processing Engine"
    technology: "Domain Service / Spring Bean"
    description: "Processes insurance claim submissions and payment logic using validated JWTs/OAuth2."
  - type: "component"
    name: "Payment Integration Adapter"
    technology: "Outbound Adapter"
    description: "Integrates with external payment gateways and insurance clearinghouses using resilience breakers."
  - type: "component"
    name: "Billing Data Repository"
    technology: "Spring Data JPA"
    description: "Standardized relational data access for PostgreSQL with AES-256 encryption at rest."
  - type: "component"
    name: "Audit Event Publisher"
    technology: "Spring Bean / Event Publisher"
    description: "Publishes audit events to WORM storage and the event broker over mTLS with payload signing."
relationships:
  - source: "API Gateway"
    destination: "Billing API Controller"
    description: "Routes internal requests via gRPC over mTLS"
  - source: "Billing API Controller"
    destination: "Claim Processing Engine"
    description: "In-process method calls with validated JWTs/OAuth2"
  - source: "Claim Processing Engine"
    destination: "Payment Integration Adapter"
    description: "In-process events with resilience breakers"
  - source: "Payment Integration Adapter"
    destination: "External Payment Gateway / Insurance Clearinghouse"
    description: "TLS-secured AMQP/Kafka with envelope encryption"
  - source: "Claim Processing Engine"
    destination: "Billing Data Repository"
    description: "JDBC over TLS with AES-256 encryption at rest"
  - source: "Audit Event Publisher"
    destination: "WORM Audit Log Store"
    description: "Direct immutable stream over TLS with mTLS and payload signing"
  - source: "Audit Event Publisher"
    destination: "Apache Kafka Event Broker & Istio Service Mesh"
    description: "Kafka Producer API over mTLS"