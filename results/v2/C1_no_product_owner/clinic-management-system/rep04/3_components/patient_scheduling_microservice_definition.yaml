level: component
scope: "Component diagram for the Patient & Scheduling Microservice container"
parentContainer:
  name: "Patient & Scheduling Microservice"
elements:
  - type: "component"
    name: "PatientController"
    technology: "Spring Boot / Java 21"
    description: "Handles patient and scheduling related HTTP/gRPC requests."
  - type: "component"
    name: "SecurityEnforcer / AuthInterceptor"
    technology: "In-memory"
    description: "Performs interception and authorization for incoming requests."
  - type: "component"
    name: "SchedulingService"
    technology: "Spring Boot / Java 21"
    description: "Manages scheduling business logic."
  - type: "component"
    name: "AppointmentRepository"
    technology: "JDBC / TLS"
    description: "Manages data access for appointments with AES-256 encryption."
  - type: "component"
    name: "NotificationPublisher"
    technology: "Kafka Producer API"
    description: "Asynchronously publishes notification events."
  - type: "component"
    name: "EventPayloadMasker"
    technology: "In-memory"
    description: "Sanitizes payloads for security and compliance."
relationships:
  - source: "PatientController"
    destination: "SecurityEnforcer / AuthInterceptor"
    description: "Interception / Authorization"
  - source: "PatientController"
    destination: "SchedulingService"
    description: "Local method invocation"
  - source: "SchedulingService"
    destination: "AppointmentRepository"
    description: "JDBC / TLS [AES-256 Encryption]"
  - source: "SchedulingService"
    destination: "NotificationPublisher"
    description: "Asynchronous publish"
  - source: "NotificationPublisher"
    destination: "EventPayloadMasker"
    description: "Sanitizes payload"