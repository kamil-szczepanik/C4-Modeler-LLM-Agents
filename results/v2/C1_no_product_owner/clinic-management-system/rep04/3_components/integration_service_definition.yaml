level: component
scope: "Component diagram for the Integration Service container"
parentContainer:
  name: "Integration Service"
elements:
  - type: "component"
    name: "FHIR Adapter Component"
    technology: "Spring Boot / Apache Camel"
    description: "Connects the system to external providers and standardizes clinical data streams."
  - type: "component"
    name: "Outbox Processor Component"
    technology: "Spring Boot"
    description: "Processes and hands off encrypted domain events for publishing."
  - type: "component"
    name: "Secure Transport Client Component"
    technology: "HttpClient / Netty"
    description: "Exchanges data securely with external systems."
  - type: "component"
    name: "Payload Sanitizer & Encryption Component"
    technology: "Spring Security / JOSE"
    description: "Sanitizes and encrypts clinical payloads to ensure regulatory compliance."
  - type: "component"
    name: "Event Broker"
    technology: "Apache Kafka / RabbitMQ"
    description: "Provides reliable, asynchronous event streaming."
  - type: "component"
    name: "External Lab & Imaging Systems"
    technology: "HL7 FHIR over HTTPS with mTLS"
    description: "External providers for lab and imaging data."
  - type: "component"
    name: "WORM Audit Log Store"
    technology: "HSM-backed KMS / Immutable Storage"
    description: "Ensures secure key management and immutable audit logs for compliance."
relationships:
  - source: "FHIR Adapter Component"
    destination: "Secure Transport Client Component"
    description: "Dispatches standardized payloads"
  - source: "FHIR Adapter Component"
    destination: "Payload Sanitizer & Encryption Component"
    description: "Sanitizes and encrypts clinical payloads"
  - source: "Payload Sanitizer & Encryption Component"
    destination: "Outbox Processor Component"
    description: "Hands off encrypted domain events"
  - source: "Outbox Processor Component"
    destination: "Event Broker"
    description: "Publishes domain events"
  - source: "Secure Transport Client Component"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges data via HL7 FHIR over HTTPS with mTLS"