level: component
scope: "Component diagram for the PostgreSQL Database container"
parentContainer:
  name: "PostgreSQL Database"
elements:
  - type: "component"
    name: "Primary Database Engine"
    technology: "PostgreSQL v15+"
    description: "Core transactional engine for strong consistency and relational data integrity."
  - type: "component"
    name: "Read Replica Instances"
    technology: "PostgreSQL v15+ Read Replica"
    description: "Handles read queries to optimize P95 read performance."
  - type: "component"
    name: "PgBouncer Connection Pooler"
    technology: "PgBouncer"
    description: "Connection pooling to prevent thread exhaustion under high concurrency."
  - type: "component"
    name: "Patroni / CloudNativePG"
    technology: "Patroni / CloudNativePG"
    description: "Consensus-based leader election and automated failover for 99.99% availability."
  - type: "component"
    name: "pgBackRest Backup & PITR Agent"
    technology: "pgBackRest"
    description: "Secure backups satisfying 10-year data retention and compliance mandates."
  - type: "component"
    name: "postgres-exporter"
    technology: "postgres-exporter"
    description: "Observability exporter for database metrics."
  - type: "component"
    name: "Vault Agent / Sidecar"
    technology: "HashiCorp Vault"
    description: "Supplies dynamic credentials via TLS 1.3 to eliminate hardcoded database credentials."
  - type: "component"
    name: "pgaudit Extension"
    technology: "pgaudit & Row-Level Security"
    description: "Detailed audit logging and data masking for HIPAA and GDPR compliance."
relationships:
  - source: "PgBouncer Connection Pooler"
    destination: "Primary Database Engine"
    description: "TCP/IP via Internal Mesh"
  - source: "Primary Database Engine"
    destination: "Read Replica Instances"
    description: "Streaming Replication with mTLS / IPsec"
  - source: "Primary Database Engine"
    destination: "pgBackRest Backup & PITR Agent"
    description: "Encrypted WAL streams to WORM Storage [AES-256]"
  - source: "Vault Agent / Sidecar"
    destination: "PgBouncer Connection Pooler"
    description: "Supplies dynamic credentials via TLS 1.3 [SCRAM-SHA-256]"