level: component
scope: "Component diagram for the Istio Service Mesh container"
parentContainer:
  name: "Istio Service Mesh"
elements:
  - type: "component"
    name: "Istiod Control Plane"
    technology: "Istio / Istiod, SPIFFE/SPIRE"
    description: "Replicated deployment managing xDS configuration, certificate authority duties, and SPIFFE/SPIRE workload identities."
  - type: "component"
    name: "Envoy Sidecar Proxies"
    technology: "Envoy Proxy, TLS 1.3"
    description: "Injected into microservice pods to handle traffic management, TLS 1.3 termination, and AuthorizationPolicies."
  - type: "component"
    name: "Istio Ingress/Egress Gateways"
    technology: "Envoy Proxy"
    description: "Envoy-based gateways managing traffic crossing the service mesh boundary."
  - type: "component"
    name: "Telemetry & Audit Exporter"
    technology: "Fluentbit / OTLP"
    description: "Sub-component streaming Envoy access logs and RBAC enforcement decisions to the WORM audit store."
relationships:
  - source: "Istiod Control Plane"
    destination: "Envoy Sidecar Proxies"
    description: "Configures via xDS over gRPC"
  - source: "Istiod Control Plane"
    destination: "Istio Ingress/Egress Gateways"
    description: "Configures via xDS over gRPC"
  - source: "Envoy Sidecar Proxies"
    destination: "Envoy Sidecar Proxies"
    description: "Enables inter-service communication via Mutual TLS (mTLS via TLS 1.3 over TCP)"
  - source: "API Gateway"
    destination: "Istio Ingress/Egress Gateways"
    description: "Routes traffic into the mesh using HTTPS/gRPC"
  - source: "Telemetry & Audit Exporter"
    destination: "WORM Audit Log Store"
    description: "Streams audit logs asynchronously via OTLP over gRPC"