level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "API Gateway (Kong / Nginx)"
    technology: "Kong / Nginx on Kubernetes"
    description: "Manages inbound traffic, TLS termination, and routing."
  - type: "component"
    name: "TLS Termination & Ingress Controller"
    technology: "Nginx/Kong Ingress"
    description: "Enforces TLS 1.3 and WAF policies."
  - type: "component"
    name: "Authentication & Authorization Plugin"
    technology: "Lua/Go with OIDC & Coraza/ModSecurity"
    description: "Validates JWTs, enforces RBAC, scope validation, and PHI masking."
  - type: "component"
    name: "Service Discovery & Upstream"
    technology: "Envoy / Kong Upstream"
    description: "Handles gRPC routing with circuit breakers."
relationships:
  - source: "API Gateway (Kong / Nginx)"
    destination: "TLS Termination & Ingress Controller"
    description: "Passes inbound traffic for TLS termination"
  - source: "TLS Termination & Ingress Controller"
    destination: "Authentication & Authorization Plugin"
    description: "Enforces security policies and validates tokens"
  - source: "Authentication & Authorization Plugin"
    destination: "Service Discovery & Upstream"
    description: "Routes validated requests via upstream"