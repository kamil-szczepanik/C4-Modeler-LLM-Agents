level: component
scope: "Component diagram for the WORM Audit Log Store container"
parentContainer:
  name: "WORM Audit Log Store"
elements:
  - type: "component"
    name: "Ingestion API Router"
    technology: "Go / Gin"
    description: "High-performance routing and schema validation for incoming audit logs."
  - type: "component"
    name: "Encryption & Hashing Engine"
    technology: "Tink / OpenSSL with PKCS#11 / HSM"
    description: "Performs AES-256 envelope encryption and Merkle tree generation for cryptographic sealing."
  - type: "component"
    name: "Immutability Enforcer"
    technology: "AWS Object Lock / MinIO WORM mode"
    description: "Enforces 10-year immutable storage retention on sealed logs."
  - type: "component"
    name: "Audit Query Service"
    technology: "Go / Elasticsearch with ILM tiers"
    description: "Provides search indexing with hot-warm-cold-frozen ILM tiers for audit queries."
  - type: "component"
    name: "Replication Synchronizer"
    technology: "MinIO / S3 Cross-Region Replication"
    description: "Replicates immutable objects securely across regions."
relationships:
  - source: "Microservices"
    destination: "Ingestion API Router"
    description: "Stream audit logs [gRPC over mTLS / SPIFFE/SPIRE]"
  - source: "Ingestion API Router"
    destination: "Encryption & Hashing Engine"
    description: "Passes payloads for cryptographic sealing [In-memory]"
  - source: "Encryption & Hashing Engine"
    destination: "Immutability Enforcer"
    description: "Writes sealed logs [S3 API with Object Lock]"
  - source: "Immutability Enforcer"
    destination: "Replication Synchronizer"
    description: "Replicates immutable objects [Encrypted IPsec/WireGuard tunnels]"
  - source: "Audit Query Service"
    destination: "Immutability Enforcer"
    description: "Reads objects strictly via WORM-compliant APIs [GET/LIST]"