level: component
scope: "Component diagram for the EMR Microservice container"
parentContainer:
  name: "EMR Microservice"
elements:
  - type: "component"
    name: "EMR API Controller"
    technology: "Spring Boot / Express.js"
    description: "Manages electronic medical records and clinical workflows, handling incoming requests."
  - type: "component"
    name: "Clinical Record Engine"
    technology: "Java / Node.js"
    description: "Core engine for processing clinical records and coordinating internal workflows."
  - type: "component"
    name: "FHIR Interoperability Adapter"
    technology: "Java HAPI FHIR / Node.js"
    description: "Ensures interoperability through FHIR standards."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Internal Component"
    description: "Captures and logs audit events securely."
  - type: "component"
    name: "KMS Crypto Interceptor"
    technology: "Local KMS SDK"
    description: "Performs cryptographic operations and handles encryption key management."
  - type: "component"
    name: "Clinical Caching Layer"
    technology: "Redis"
    description: "Provides low-latency caching of encrypted clinical records."
  - type: "component"
    name: "Telemetry & Circuit Breaker Sidecar"
    technology: "Istio"
    description: "Enforces strict mTLS, service mesh security, and telemetry."
relationships:
  - source: "EMR API Controller"
    destination: "Clinical Record Engine"
    description: "In-process method calls"
  - source: "Clinical Record Engine"
    destination: "FHIR Interoperability Adapter"
    description: "Internal eventing [Kafka/AMQP]"
  - source: "Audit Logger Component"
    destination: "WORM Audit Log Store"
    description: "Cryptographically signed writes [HTTPS/TLS 1.3]"
  - source: "Clinical Record Engine"
    destination: "KMS Crypto Interceptor"
    description: "Cryptographic operations [Local KMS SDK]"
  - source: "Clinical Record Engine"
    destination: "Clinical Caching Layer"
    description: "Record retrieval [Redis Protocol over mTLS]"
  - source: "KMS Crypto Interceptor"
    destination: "PostgreSQL Database"
    description: "Persists ciphertexts [AES-256]"