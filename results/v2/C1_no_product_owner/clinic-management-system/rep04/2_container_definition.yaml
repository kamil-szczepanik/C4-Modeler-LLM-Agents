# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "End-users accessing patient admissions, scheduling, and portal features."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals managing electronic medical records (EMR) and clinical workflows."
  - type: "person"
    name: "Billing Administrators"
    description: "Administrative staff managing billing and financial transactions."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing laboratory and imaging data."
  - type: "externalSystem"
    name: "Payment Gateway / Insurance Clearinghouse"
    description: "External systems for processing payments and insurance claims."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External service handling authentication."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / Nginx on Kubernetes"
    description: "Handles TLS termination, rate limiting, and JWT validation."
  - type: "container"
    name: "Web Application"
    technology: "React / Next.js"
    description: "Provides cross-platform user interfaces for patients, clinicians, and billing administrators."
  - type: "container"
    name: "Patient & Scheduling Microservice"
    technology: "Node.js / Spring Boot on Kubernetes"
    description: "Manages patient admissions and appointment scheduling."
  - type: "container"
    name: "EMR Microservice"
    technology: "Node.js / Spring Boot on Kubernetes"
    description: "Manages electronic medical records (EMR) and clinical workflows."
  - type: "container"
    name: "Billing Microservice"
    technology: "Node.js / Spring Boot on Kubernetes"
    description: "Handles billing and asynchronous payment transactions."
  - type: "container"
    name: "Integration Service"
    technology: "Node.js / Spring Boot on Kubernetes"
    description: "Connects to external lab and imaging systems via HL7 FHIR APIs."
  - type: "container"
    name: "PostgreSQL Database"
    technology: "PostgreSQL (Multi-AZ)"
    description: "Persists primary transactional data with AES-256 encryption."
  - type: "container"
    name: "WORM Audit Log Store"
    technology: "WORM Storage with HSM-backed KMS"
    description: "Stores tamper-proof audit trails with 10-year retention."
  - type: "container"
    name: "Event Broker"
    technology: "Apache Kafka / RabbitMQ"
    description: "Facilitates asynchronous event-driven messaging for billing and integration transactions."
  - type: "container"
    name: "Istio Service Mesh"
    technology: "Istio with SPIFFE/SPIRE"
    description: "Provides zero-trust mTLS, workload identity, and circuit breaking."
relationships:
  - source: "Patients"
    destination: "Web Application"
    description: "Accesses portal via browser"
    technology: "HTTPS/TLS"
  - source: "Clinicians"
    destination: "Web Application"
    description: "Accesses portal via browser"
    technology: "HTTPS/TLS"
  - source: "Billing Administrators"
    destination: "Web Application"
    description: "Accesses portal via browser"
    technology: "HTTPS/TLS"
  - source: "Web Application"
    destination: "API Gateway"
    description: "Sends user requests"
    technology: "HTTPS/TLS with OAuth2/OIDC"
  - source: "API Gateway"
    destination: "Patient & Scheduling Microservice"
    description: "Routes internal requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "EMR Microservice"
    description: "Routes internal requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Billing Microservice"
    description: "Routes internal requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Integration Service"
    description: "Routes internal requests"
    technology: "gRPC over mTLS"
  - source: "Integration Service"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical data"
    technology: "HL7 FHIR APIs over HTTPS"
  - source: "Billing Microservice"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Communicates asynchronously for payments"
    technology: "TLS-secured AMQP/Kafka with envelope encryption"
  - source: "Patient & Scheduling Microservice"
    destination: "PostgreSQL Database"
    description: "Persists relational data"
    technology: "AES-256 Encryption"
  - source: "EMR Microservice"
    destination: "PostgreSQL Database"
    description: "Persists relational data"
    technology: "AES-256 Encryption"
  - source: "Billing Microservice"
    destination: "PostgreSQL Database"
    description: "Persists relational data"
    technology: "AES-256 Encryption"
  - source: "Patient & Scheduling Microservice"
    destination: "WORM Audit Log Store"
    description: "Streams audit logs"
    technology: "Direct Stream"
  - source: "EMR Microservice"
    destination: "WORM Audit Log Store"
    description: "Streams audit logs"
    technology: "Direct Stream"
  - source: "Billing Microservice"
    destination: "WORM Audit Log Store"
    description: "Streams audit logs"
    technology: "Direct Stream"
  - source: "Billing Microservice"
    destination: "Event Broker"
    description: "Publishes and consumes billing events"
    technology: "Apache Kafka / RabbitMQ"
  - source: "Integration Service"
    destination: "Event Broker"
    description: "Publishes and consumes integration events"
    technology: "Apache Kafka / RabbitMQ"