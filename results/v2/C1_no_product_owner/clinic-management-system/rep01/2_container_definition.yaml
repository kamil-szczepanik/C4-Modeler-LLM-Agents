level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Hospital Staff"
    description: "Doctors, nurses, and admins interacting with the system to manage clinic operations."
  - type: "externalSystem"
    name: "Patient Portal"
    description: "External system or actor for patient self-service access."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "Third-party clinical systems for lab and imaging integration."
  - type: "externalSystem"
    name: "Insurance Clearinghouses"
    description: "External systems used for medical claim submissions."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Enterprise authentication system handling identity management."
  - type: "externalSystem"
    name: "Regulatory Audit System"
    description: "External system responsible for compliance log ingestion."
  - type: "container"
    name: "API Gateway & Edge Router"
    technology: "Kong/Envoy"
    description: "Edge routing, TLS termination, and mTLS enforcement."
  - type: "container"
    name: "Web Application Frontend"
    technology: "React SPA, Nginx"
    description: "Frontend delivery for hospital staff."
  - type: "container"
    name: "Patient Service"
    technology: "Spring Boot, Kubernetes"
    description: "Manages patient admission and demographic data."
  - type: "container"
    name: "Scheduling Service"
    technology: "Spring Boot, Kubernetes"
    description: "Manages hospital staff and patient appointments."
  - type: "container"
    name: "EMR Service"
    technology: "Spring Boot, Kubernetes"
    description: "Manages electronic medical records."
  - type: "container"
    name: "Billing Service"
    technology: "Spring Boot, Kubernetes"
    description: "Manages billing and insurance processing."
  - type: "container"
    name: "Integration Service"
    technology: "Apache Camel/Node.js"
    description: "Integrates external lab and imaging systems."
  - type: "container"
    name: "Data Persistence Layer"
    technology: "PostgreSQL with AES-256 and HSM-managed column encryption"
    description: "Multi-region primary and replica data storage with 10-year retention support."
  - type: "container"
    name: "Message Broker Container"
    technology: "Geo-local Apache Kafka clusters with MirrorMaker"
    description: "Asynchronous event-driven communication via geo-local clusters."
relationships:
  - source: "Hospital Staff"
    destination: "Web Application Frontend"
    description: "Accesses system functionality"
    technology: "HTTPS"
  - source: "Web Application Frontend"
    destination: "API Gateway & Edge Router"
    description: "Routes frontend requests"
    technology: "REST/JSON over HTTPS"
  - source: "API Gateway & Edge Router"
    destination: "Patient Service"
    description: "Forwards API requests"
    technology: "mTLS and service mesh (Istio/Linkerd)"
  - source: "API Gateway & Edge Router"
    destination: "Scheduling Service"
    description: "Forwards API requests"
    technology: "mTLS and service mesh (Istio/Linkerd)"
  - source: "API Gateway & Edge Router"
    destination: "EMR Service"
    description: "Forwards API requests"
    technology: "mTLS and service mesh (Istio/Linkerd)"
  - source: "API Gateway & Edge Router"
    destination: "Billing Service"
    description: "Forwards API requests"
    technology: "mTLS and service mesh (Istio/Linkerd)"
  - source: "Patient Service"
    destination: "Data Persistence Layer"
    description: "Persists patient data"
    technology: "TLS-secured JDBC"
  - source: "Scheduling Service"
    destination: "Data Persistence Layer"
    description: "Persists scheduling data"
    technology: "TLS-secured JDBC"
  - source: "EMR Service"
    destination: "Data Persistence Layer"
    description: "Persists EMR data"
    technology: "TLS-secured JDBC"
  - source: "Billing Service"
    destination: "Data Persistence Layer"
    description: "Persists billing data"
    technology: "TLS-secured JDBC"
  - source: "Patient Service"
    destination: "Message Broker Container"
    description: "Publishes and consumes events"
    technology: "TLS/mTLS and SCRAM-SHA-512"
  - source: "Scheduling Service"
    destination: "Message Broker Container"
    description: "Publishes and consumes events"
    technology: "TLS/mTLS and SCRAM-SHA-512"
  - source: "EMR Service"
    destination: "Message Broker Container"
    description: "Publishes and consumes events"
    technology: "TLS/mTLS and SCRAM-SHA-512"
  - source: "Billing Service"
    destination: "Message Broker Container"
    description: "Publishes and consumes events"
    technology: "TLS/mTLS and SCRAM-SHA-512"
  - source: "Integration Service"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical data securely"
    technology: "HL7 FHIR APIs"