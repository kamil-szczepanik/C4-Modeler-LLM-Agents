level: component
scope: "Component diagram for the Integration Service container"
parentContainer:
  name: "Integration Service"
elements:
  - type: "component"
    name: "FHIR Translator"
    technology: "Apache Camel / Node.js"
    description: "Provides enterprise integration patterns for complex FHIR R4 mapping and translates clinical data."
  - type: "component"
    name: "Message Router"
    technology: "Apache Camel / Node.js"
    description: "Routes and dispatches raw integration events to and from messaging infrastructure."
  - type: "component"
    name: "mTLS Client"
    technology: "HashiCorp Vault / cert-manager / TLS"
    description: "Handles secure mutual TLS communication with external lab and imaging systems."
relationships:
  - source: "Message Router"
    destination: "FHIR Translator"
    description: "Dispatches raw integration events [Internal Direct Route with W3C Trace Context]"
  - source: "Integration Service"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical data securely [HTTPS / mTLS / HL7 FHIR REST API with Resilience4j Circuit Breaker]"
  - source: "Message Router"
    destination: "Message Broker Container"
    description: "Consumes and publishes integration events [Kafka Protocol / TCP with Kafka Topic ACLs]"