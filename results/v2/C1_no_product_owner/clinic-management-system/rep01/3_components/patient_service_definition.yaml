level: component
scope: "Component diagram for the Patient Service container"
parentContainer:
  name: "Patient Service"
elements:
  - type: "component"
    name: "Patient API Controller"
    technology: "Spring MVC (@RestController)"
    description: "Exposes RESTful endpoints for registration, demographics, and JSR-303 input validation."
  - type: "component"
    name: "Patient Security Filter"
    technology: "Spring Security (@Component)"
    description: "Intercepts requests for OAuth2/JWT token validation and RBAC scoping."
  - type: "component"
    name: "Patient Domain Manager"
    technology: "Spring Service (@Service)"
    description: "Enforces clinical rules and propagates security context for asynchronous events."
  - type: "component"
    name: "Audit Interceptor"
    technology: "Spring AOP (@Component)"
    description: "Captures immutable access and modification events for HIPAA/GDPR compliance."
  - type: "component"
    name: "Audit Event Buffer"
    technology: "SQLite / Durable Volume (@Component)"
    description: "Provides a local encrypted SQLite file/durable volume buffer for audit resilience."
  - type: "component"
    name: "Patient Repository"
    technology: "Spring Data JPA / HikariCP (@Repository)"
    description: "Manages data access with HikariCP connection pooling and HSM-managed AES-256 column encryption."
relationships:
  - source: "Patient API Controller"
    destination: "Patient Security Filter"
    description: "Intercepts requests [Spring Security Filter Chain]"
  - source: "Patient API Controller"
    destination: "Patient Domain Manager"
    description: "Delegates requests [Java Method Call]"
  - source: "Patient Domain Manager"
    destination: "Patient Repository"
    description: "Queries and persists entity data [TLS-secured JDBC/JPA]"
  - source: "Patient Domain Manager"
    destination: "Audit Interceptor"
    description: "Triggers audit logging events [Spring AOP/Event]"
  - source: "Audit Interceptor"
    destination: "Audit Event Buffer"
    description: "Writes to local durable fallback storage on broker failure [Local File Buffer]"
  - source: "Audit Interceptor"
    destination: "Message Broker Container"
    description: "Forwards audit events asynchronously [TLS/mTLS and SCRAM-SHA-512 via Apache Kafka]"