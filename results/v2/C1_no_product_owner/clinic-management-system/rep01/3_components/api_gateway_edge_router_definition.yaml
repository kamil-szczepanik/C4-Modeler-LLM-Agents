level: component
scope: "Component diagram for the API Gateway & Edge Router container"
parentContainer:
  name: "API Gateway & Edge Router"
elements:
  - type: "component"
    name: "Edge Router & TLS Termination Plugin"
    technology: "Kong/Envoy Plugin"
    description: "Manages ingress, GeoDNS routing, and terminates TLS 1.3."
  - type: "component"
    name: "JWT/OAuth2 Authentication Filter"
    technology: "Kong/Envoy Plugin / OAuth2 / OIDC"
    description: "Enforces OIDC token introspection, MFA, and dynamic clinical role scopes."
  - type: "component"
    name: "Rate Limiting & Circuit Breaker"
    technology: "Kong/Envoy Plugin"
    description: "Protects downstream microservices from DDoS and cascading failures."
  - type: "component"
    name: "Request Routing & Transformation Engine"
    technology: "Kong/Envoy Plugin"
    description: "Translates REST/JSON to gRPC/mTLS payloads with canary splitting."
  - type: "component"
    name: "Interoperability & FHIR Proxy Component"
    technology: "Kong/Envoy Plugin / HL7 FHIR"
    description: "Validates schemas and mitigates threats for HL7 FHIR payloads."
relationships:
  - source: "Web Application Frontend"
    destination: "Edge Router & TLS Termination Plugin"
    description: "Routes requests via [REST/JSON over HTTPS]."
  - source: "JWT/OAuth2 Authentication Filter"
    destination: "Identity Provider"
    description: "Validates tokens via [OIDC over HTTPS]."
  - source: "Interoperability & FHIR Proxy Component"
    destination: "External Lab Systems"
    description: "Receives clinical data via [HL7 FHIR over HTTPS]."
  - source: "Request Routing & Transformation Engine"
    destination: "Patient Service"
    description: "Dispatches traffic via [gRPC over mTLS / Istio]."
  - source: "Request Routing & Transformation Engine"
    destination: "EMR Service"
    description: "Dispatches traffic via [gRPC over mTLS / Istio]."
  - source: "Request Routing & Transformation Engine"
    destination: "Billing Service"
    description: "Dispatches traffic via [gRPC over mTLS / Istio]."
  - source: "API Gateway & Edge Router"
    destination: "Regulatory Audit System"
    description: "Streams audit logs via [Sidecar Log Shipper]."