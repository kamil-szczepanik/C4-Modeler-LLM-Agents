level: component
scope: "Component diagram for the Scheduling Service container"
parentContainer:
  name: "Scheduling Service"
elements:
  - type: "component"
    name: "Appointment Controller"
    technology: "Spring MVC REST Controller"
    description: "Handles incoming API requests for appointment management."
  - type: "component"
    name: "Security Interceptor"
    technology: "Spring Security filter"
    description: "Validates local JWT claims and enforces RBAC."
  - type: "component"
    name: "Audit Logging Component"
    technology: "Regulatory audit trail recorder"
    description: "Records regulatory audit trails."
  - type: "component"
    name: "Scheduling Engine"
    technology: "Core domain logic"
    description: "Manages core scheduling domain logic."
  - type: "component"
    name: "Resource Clash Checker"
    technology: "Availability and conflict detection"
    description: "Performs availability and conflict detection with strict resource clash checks."
  - type: "component"
    name: "Distributed Lock Manager"
    technology: "Redisson-based concurrency control"
    description: "Provides cluster-aware locks via TLS-secured Redis for concurrency control."
  - type: "component"
    name: "Notification Publisher"
    technology: "Spring Kafka event emitter"
    description: "Publishes asynchronous domain events via TLS/mTLS and SCRAM-SHA-512."
  - type: "component"
    name: "Scheduling Repository"
    technology: "Spring Data JPA data access layer"
    description: "Provides persistent data access for appointment records via TLS-secured JDBC."
relationships:
  - source: "API Gateway & Edge Router"
    destination: "Appointment Controller"
    description: "Forwards API requests via mTLS and Istio/Linkerd service mesh"
  - source: "Security Interceptor"
    destination: "Appointment Controller"
    description: "Validates local JWT claims and enforces RBAC"
  - source: "Scheduling Engine"
    destination: "Distributed Lock Manager"
    description: "Acquires cluster-aware locks via TLS-secured Redis"
  - source: "Resource Clash Checker"
    destination: "Scheduling Repository"
    description: "Queries availability via TLS-secured JDBC"
  - source: "Notification Publisher"
    destination: "Message Broker Container"
    description: "Publishes domain events via TLS/mTLS and SCRAM-SHA-512"