level: component
scope: "Component diagram for the Web Application Frontend container"
parentContainer:
  name: "Web Application Frontend"
elements:
  - type: "component"
    name: "SPA Router and Views"
    technology: "React SPA"
    description: "Manages client-side routing and renders views for patient admissions, EMR, scheduling, and billing."
  - type: "component"
    name: "HTTP API Client"
    technology: "Axios / Fetch API"
    description: "Handles secure communication with the API Gateway using REST/JSON over HTTPS."
  - type: "component"
    name: "Web Server Container"
    technology: "Nginx Container"
    description: "Serves the static React SPA files and manages client delivery and performance."
relationships:
  - source: "SPA Router and Views"
    destination: "HTTP API Client"
    description: "Requests data and invokes backend operations"
  - source: "HTTP API Client"
    destination: "API Gateway & Edge Router"
    description: "Routes frontend requests [REST/JSON over HTTPS]"