level: component
scope: "Component diagram for the Billing Service container"
parentContainer:
  name: "Billing Service"
elements:
  - type: "component"
    name: "Billing API Controller"
    technology: "Spring MVC"
    description: "Handles billing operations and incoming API requests."
  - type: "component"
    name: "Claim Management Engine"
    technology: "Spring Service"
    description: "Core business logic for insurance claim submissions and financial processing."
  - type: "component"
    name: "Insurance Integration Adapter"
    technology: "Apache Camel / Spring Integration"
    description: "Integrates with external insurance clearinghouses using enterprise integration patterns."
  - type: "component"
    name: "Billing Data Repository"
    technology: "Spring Data JPA / PostgreSQL"
    description: "Manages relational persistence and transactional outbox writes."
  - type: "component"
    name: "External Insurance Clearinghouses"
    technology: "HTTPS with mTLS, OAuth2, and egress proxy filtering"
    description: "External systems for processing insurance claims."
  - type: "component"
    name: "Message Broker Container"
    technology: "Apache Kafka"
    description: "Event streaming container implementing the transactional outbox pattern."
relationships:
  - source: "Billing API Controller"
    destination: "Claim Management Engine"
    description: "Local Java method invocations"
  - source: "Claim Management Engine"
    destination: "Billing Data Repository"
    description: "TLS-secured JDBC for atomic outbox writes"
  - source: "Claim Management Engine"
    destination: "Message Broker Container"
    description: "TLS/mTLS and SCRAM-SHA-512 event publishing"
  - source: "Insurance Integration Adapter"
    destination: "External Insurance Clearinghouses"
    description: "HTTPS with mTLS, OAuth2, and egress proxy filtering"