level: component
scope: "Component diagram for the Data Persistence Layer container"
parentContainer:
  name: "Data Persistence Layer"
elements:
  - type: "component"
    name: "Patient Data Store"
    technology: "PostgreSQL 15 with Citus Extension and pg_partman"
    description: "Stores partitioned patient demographics."
  - type: "component"
    name: "EMR Audit Repository"
    technology: "PostgreSQL 15 with immutable append-only tables and pgaudit"
    description: "Provides tamper-proof audit trails."
  - type: "component"
    name: "Transaction Coordinator"
    technology: "PgBouncer"
    description: "Manages high-concurrency connection pooling."
  - type: "component"
    name: "Failover Orchestrator"
    technology: "Patroni"
    description: "Handles automated leader election and active-passive failover."
  - type: "component"
    name: "Replication & Backup Manager"
    technology: "Barman with PostgreSQL streaming replication"
    description: "Manages replication and backups."
  - type: "component"
    name: "Observability & Archival Agents"
    technology: "Prometheus PostgreSQL Exporter, pg_stat_statements, and Automated Compliance Archival Daemon"
    description: "Handles observability and automated compliance archival."
relationships:
  - source: "Patient, Scheduling, EMR, & Billing Services"
    destination: "Transaction Coordinator"
    description: "Transmits queries and transactions via [TLS 1.3 / JDBC with SCRAM-SHA-256]"
  - source: "Transaction Coordinator"
    destination: "Patient Data Store & EMR Audit Repository"
    description: "Routes read/write operations via [Internal mTLS / TCP]"
  - source: "Replication & Backup Manager"
    destination: "Multi-Region Infrastructure"
    description: "Synchronizes primary databases in on-prem-k8s with eu-central-1"
  - source: "Database Observability Agent"
    destination: "External SIEM"
    description: "Streams security and audit logs via [HTTPS / TLS]"