level: component
scope: "Component diagram for the EMR Service container"
parentContainer:
  name: "EMR Service"
elements:
  - type: "component"
    name: "EMR API Controller"
    technology: "Spring MVC"
    description: "Exposes RESTful endpoints for clinical documentation and payload validation."
  - type: "component"
    name: "Clinical Record Manager"
    technology: "Spring Service"
    description: "Contains domain logic, ABAC authorization, and an encrypted local Caffeine cache using AES-256 envelope encryption with memory-locking (mlock)."
  - type: "component"
    name: "FHIR Transformer"
    technology: "HAPI FHIR Library"
    description: "Maps internal clinical models to HL7 FHIR standards."
  - type: "component"
    name: "Audit Trail Publisher"
    technology: "Java / Write-Ahead Log"
    description: "Publishes cryptographically signed, non-repudiation audit events backed by a local durable write-ahead log (WAL)."
  - type: "component"
    name: "Data Persistence Layer"
    technology: "PostgreSQL & TLS-secured JDBC"
    description: "Relational data storage utilizing TLS-secured connections and HSM column encryption for 10-year data retention."
  - type: "component"
    name: "Message Broker Container"
    technology: "Apache Kafka & MirrorMaker"
    description: "Geo-local Apache Kafka clusters using MirrorMaker, secured via TLS/mTLS and SCRAM-SHA-512."
relationships:
  - source: "EMR API Controller"
    destination: "Clinical Record Manager"
    description: "In-process method calls"
  - source: "Clinical Record Manager"
    destination: "FHIR Transformer"
    description: "In-process domain-to-FHIR mapping [Java objects]"
  - source: "Clinical Record Manager"
    destination: "Data Persistence Layer"
    description: "Queries and persists clinical records [TLS-secured JDBC]"
  - source: "Audit Trail Publisher"
    destination: "Message Broker Container"
    description: "Publishes signed audit events [TLS/mTLS and SCRAM-SHA-512]"