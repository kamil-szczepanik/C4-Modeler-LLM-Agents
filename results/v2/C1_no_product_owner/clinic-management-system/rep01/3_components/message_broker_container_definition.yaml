level: component
scope: "Component diagram for the Message Broker Container container"
parentContainer:
  name: "Message Broker Container"
elements:
  - type: "component"
    name: "Broker Node Cluster"
    technology: "Apache Kafka"
    description: "Distributed partition-based messaging for high-throughput event streaming with AES-256 encryption."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry"
    description: "Enforces Avro/Protobuf schema validation for clinical events."
  - type: "component"
    name: "Kafka Connect Cluster"
    technology: "Kafka Connect"
    description: "Manages reliable integration sinks and sources, streaming audit events."
  - type: "component"
    name: "MirrorMaker 2"
    technology: "Apache Kafka MirrorMaker 2"
    description: "Handles cross-region replication between on-prem-k8s and eu-central-1."
  - type: "component"
    name: "Strimzi Operator"
    technology: "Strimzi Kubernetes Operator"
    description: "Manages Kubernetes-native Kafka deployment, automated rolling upgrades, and mTLS certificate rotation."
relationships:
  - source: "Microservices"
    destination: "Broker Node Cluster"
    description: "Produce and consume events via TCP [TLS 1.3 / mTLS & SCRAM-SHA-512]."
  - source: "Producer Services"
    destination: "Schema Registry"
    description: "Validate event schemas prior to publishing via HTTP/REST [mTLS]."
  - source: "Broker Node Cluster"
    destination: "Kafka Connect Cluster"
    description: "Stream CDC and audit data via internal TCP."
  - source: "Kafka Connect Cluster"
    destination: "Regulatory Audit System"
    description: "Export immutable audit logs via HTTPS [TLS 1.3]."
  - source: "Broker Node Cluster (On-Prem)"
    destination: "MirrorMaker 2"
    description: "Replicate cross-region topics via encrypted TCP [mTLS]."
  - source: "MirrorMaker 2"
    destination: "Broker Node Cluster (EU Cloud)"
    description: "Replicate cross-region topics via encrypted TCP [mTLS]."