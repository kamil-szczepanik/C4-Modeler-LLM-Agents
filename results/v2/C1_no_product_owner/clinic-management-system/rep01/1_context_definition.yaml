level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed to manage patient admissions, electronic medical records, appointments, and billing for medium-sized hospitals and clinics with strict HIPAA/GDPR compliance."
elements:
  - type: "person"
    name: "Hospital Staff"
    description: "Doctors, nurses, and admins interacting with the system via HTTPS and MFA to manage clinic operations."
  - type: "externalSystem"
    name: "Patient Portal"
    description: "External system or actor for patient self-service access."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "Third-party clinical systems for lab and imaging integration."
  - type: "externalSystem"
    name: "Insurance Clearinghouses"
    description: "External systems used for medical claim submissions."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Enterprise authentication system (Azure AD / Keycloak) handling identity management."
  - type: "externalSystem"
    name: "Regulatory Audit System"
    description: "External system responsible for compliance log ingestion."
relationships:
  - source: "Hospital Staff"
    destination: "Clinic Management System"
    description: "Accesses system functionality and manages patient data"
    technology: "HTTPS (TLS 1.3), OIDC/SAML 2.0, OAuth2, MFA"
  - source: "Patient Portal"
    destination: "Clinic Management System"
    description: "Performs self-service patient actions"
    technology: "HTTPS (TLS 1.3), OIDC/SAML 2.0, OAuth2"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical data securely"
    technology: "HL7 FHIR REST APIs over mTLS"
  - source: "Clinic Management System"
    destination: "Insurance Clearinghouses"
    description: "Submits claims and billing information"
    technology: "SFTP / HIPAA-compliant EDI (X12)"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users and validates tokens"
    technology: "OIDC / SAML 2.0"
  - source: "Clinic Management System"
    destination: "Regulatory Audit System"
    description: "Sends compliance audit logs and telemetry"
    technology: "Cryptographically signed webhooks/syslog over TLS"