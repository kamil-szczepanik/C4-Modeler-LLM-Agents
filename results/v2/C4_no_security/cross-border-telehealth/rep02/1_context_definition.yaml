level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides secure video consultations, e-prescriptions, and an AI symptom checker for patients across the EU and US, ensuring strict regional data residency, regulatory compliance, and resilience for low-bandwidth rural users."
elements:
  - type: "person"
    name: "Patients (EU & US)"
    description: "Patients located in the EU and US accessing telehealth services, video consultations, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals using the system to conduct video consultations and manage patient care."
  - type: "externalSystem"
    name: "External Pharmacies (EU & US)"
    description: "External pharmacy systems receiving e-prescriptions via HL7 FHIR and National Standards."
relationships:
  - source: "Patients (EU & US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS / WebRTC"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Conducts secure video consultations and manages patient interactions"
    technology: "HTTPS / WebRTC"
  - source: "Cross-Border Telehealth Platform"
    destination: "External Pharmacies (EU & US)"
    description: "Sends e-prescriptions using HL7 FHIR (US) and National Standards (EU)"
    technology: "Mutual TLS / HTTPS"