level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU & US)"
    description: "Patients located in the EU and US accessing telehealth services, video consultations, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals using the system to conduct video consultations and manage patient care."
  - type: "person"
    name: "Platform Administrators / Compliance Officers"
    description: "Administrators and compliance officers managing and auditing platform operations and regulatory compliance."
  - type: "externalSystem"
    name: "External Pharmacies (EU & US)"
    description: "External pharmacy systems receiving e-prescriptions via HL7 FHIR and National Standards."
  - type: "container"
    name: "Web Frontend (PWA)"
    technology: "Next.js / React"
    description: "Delivers a lightweight Progressive Web App for unstable rural connections and patient/clinician interactions."
  - type: "container"
    name: "API Gateway"
    technology: "Envoy and Cloud Load Balancing"
    description: "Manages secure ingress traffic and routing for client applications."
  - type: "container"
    name: "Core Backend services"
    technology: "Go / Spring Boot"
    description: "Powers robust core backend business logic and orchestration."
  - type: "container"
    name: "AI Symptom Checker"
    technology: "Python / FastAPI"
    description: "Executes AI symptom checker microservices."
  - type: "container"
    name: "Integration / Interoperability Service"
    technology: "Node.js / Java"
    description: "Handles integration and interoperability with external pharmacies and national e-prescription adapters."
  - type: "container"
    name: "Media Relaying Service"
    technology: "LiveKit (SFU/MCU)"
    description: "Provides adaptive bitrate WebRTC media streaming for video consultations and low-bandwidth resilience."
  - type: "container"
    name: "Data Storage"
    technology: "Cloud SQL (PostgreSQL) and Cloud Storage"
    description: "Secures regionalized health records per strict data residency rules in GKE clusters."
relationships:
  - source: "Patients (EU & US)"
    destination: "Web Frontend (PWA)"
    description: "Accesses telehealth features and video consultations"
    technology: "HTTPS / WSS"
  - source: "Licensed Clinicians"
    destination: "Web Frontend (PWA)"
    description: "Manages patient interactions and video consultations"
    technology: "HTTPS / WSS"
  - source: "Platform Administrators / Compliance Officers"
    destination: "Web Frontend (PWA)"
    description: "Monitors platform and compliance data"
    technology: "HTTPS"
  - source: "Web Frontend (PWA)"
    destination: "API Gateway"
    description: "Sends API requests and WebSocket traffic"
    technology: "HTTPS / WSS"
  - source: "Web Frontend (PWA)"
    destination: "Media Relaying Service"
    description: "Streams video and audio for consultations"
    technology: "WebRTC"
  - source: "API Gateway"
    destination: "Core Backend services"
    description: "Routes backend requests"
    technology: "REST / gRPC"
  - source: "Core Backend services"
    destination: "AI Symptom Checker"
    description: "Requests AI symptom analysis"
    technology: "gRPC"
  - source: "Core Backend services"
    destination: "Integration / Interoperability Service"
    description: "Triggers prescription and interoperability workflows"
    technology: "gRPC"
  - source: "Core Backend services"
    destination: "Data Storage"
    description: "Reads and writes health records and patient data"
    technology: "PostgreSQL / Cloud SQL Protocol"
  - source: "Integration / Interoperability Service"
    destination: "External Pharmacies (EU & US)"
    description: "Sends e-prescriptions using HL7 FHIR (US) and national e-prescription adapters (EU)"
    technology: "HL7 FHIR / HTTPS"