level: component
scope: "Component diagram for the Integration / Interoperability Service container"
parentContainer:
  name: "Integration / Interoperability Service"
elements:
  - type: "component"
    name: "Prescription Workflow Orchestrator"
    technology: "Java / Spring Boot"
    description: "Triggers prescription workflows received from Core Backend Services."
  - type: "component"
    name: "Interoperability Camel Router"
    technology: "Apache Camel"
    description: "Routes and transforms messages to interface with external regional pharmacy networks."
  - type: "component"
    name: "External Pharmacy Adapter"
    technology: "HL7 FHIR / HTTPS / NCPeH"
    description: "Sends e-prescriptions to US and EU National Adapters."
  - type: "component"
    name: "Audit Event Publisher"
    technology: "PubSub API / gRPC"
    description: "Publishes delivery audit events to Cloud Pub/Sub."
relationships:
  - source: "Prescription Workflow Orchestrator"
    destination: "Interoperability Camel Router"
    description: "Invokes routing workflow"
  - source: "Interoperability Camel Router"
    destination: "External Pharmacy Adapter"
    description: "Sends e-prescriptions [HL7 FHIR / HTTPS / NCPeH]"
  - source: "Interoperability Camel Router"
    destination: "Audit Event Publisher"
    description: "Publishes delivery audit events [PubSub API / gRPC]"