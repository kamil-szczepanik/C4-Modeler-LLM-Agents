# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Core Backend services container"
parentContainer:
  name: "Core Backend services"
elements:
  - type: "component"
    name: "Consent & Policy Engine"
    technology: "Go / Spring Boot"
    description: "Enforces strict regional data residency, privacy policies, and emits access and consent decisions."
  - type: "component"
    name: "Consultation Orchestrator"
    technology: "Go / Spring Boot"
    description: "Manages consultation workflows and buffers ephemeral session states for rural areas."
  - type: "component"
    name: "Clinical Record Manager"
    technology: "Go / Spring Boot"
    description: "Handles secure management and persistence of patient clinical records."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "Go / Spring Boot"
    description: "Logs access and compliance events for GDPR and HIPAA tracking."
relationships:
  - source: "Consent & Policy Engine"
    destination: "Audit & Compliance Logger"
    description: "Emits access and consent decisions [gRPC]"
  - source: "Consultation Orchestrator"
    destination: "Session State Cache"
    description: "Buffers ephemeral session states [Redis Protocol]"
  - source: "Core Backend services"
    destination: "AI Symptom Checker"
    description: "Requests AI symptom analysis [gRPC]"
  - source: "Core Backend services"
    destination: "Data Storage"
    description: "Persists records and audit logs [PostgreSQL Protocol / WORM Storage]"