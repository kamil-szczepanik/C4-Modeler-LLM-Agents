level: component
scope: "Component diagram for the Web Frontend (PWA) container"
parentContainer:
  name: "Web Frontend (PWA)"
elements:
  - type: "component"
    name: "Telehealth UI Module"
    technology: "Next.js / React"
    description: "Provides the user interface for video consultations and patient interactions."
  - type: "component"
    name: "AI Symptom Checker Module"
    technology: "React"
    description: "Interfaces with the AI symptom checker to collect inputs and display preliminary assessments."
  - type: "component"
    name: "Offline Caching Module"
    technology: "IndexedDB & Service Workers"
    description: "Enables local caching and offline payload queuing for low-bandwidth rural connections."
relationships:
  - source: "Telehealth UI Module"
    destination: "AI Symptom Checker Module"
    description: "Passes user symptom data"
  - source: "Telehealth UI Module"
    destination: "Offline Caching Module"
    description: "Queues payloads and caches data locally"