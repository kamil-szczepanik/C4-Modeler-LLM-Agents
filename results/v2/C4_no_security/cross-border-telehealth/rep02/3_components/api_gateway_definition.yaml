level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Load Balancer"
    technology: "Google Cloud Load Balancing"
    description: "Manages secure ingress traffic and distributes requests to the routing engine."
  - type: "component"
    name: "Routing & Regional Affinity Engine"
    technology: "Envoy Proxy"
    description: "Handles regional affinity and routes traffic to backend services based on data residency rules."
  - type: "component"
    name: "Security & Policy Filter"
    technology: "Envoy WASM Plugin"
    description: "Performs low-latency JWT validation and internal consent header propagation."
  - type: "component"
    name: "Resilience & Telemetry Adapter"
    technology: "Envoy Circuit Breaker & Stats Filter"
    description: "Manages resilience for unstable connections and collects telemetry metrics."
  - type: "component"
    name: "Audit & Logging Interceptor"
    technology: "Envoy gRPC Access Log Service (ALS)"
    description: "Streams asynchronous compliance auditing logs."
relationships:
  - source: "Edge Load Balancer"
    destination: "Routing & Regional Affinity Engine"
    description: "Forwards ingress traffic via gRPC"
  - source: "Routing & Regional Affinity Engine"
    destination: "Security & Policy Filter"
    description: "Applies security and policy validation"
  - source: "Security & Policy Filter"
    destination: "Resilience & Telemetry Adapter"
    description: "Applies circuit breaking and resilience controls"
  - source: "Resilience & Telemetry Adapter"
    destination: "Audit & Logging Interceptor"
    description: "Triggers asynchronous access logging"