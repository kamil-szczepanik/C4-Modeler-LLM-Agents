level: component
scope: "Component diagram for the AI Symptom Checker container"
parentContainer:
  name: "AI Symptom Checker"
elements:
  - type: "component"
    name: "Triage API Controller"
    technology: "FastAPI / Python, Protobuf / gRPC"
    description: "Exposes asynchronous endpoints for step-by-step symptom evaluation and handles requests from the Core Backend."
  - type: "component"
    name: "Inference Engine Component"
    technology: "PyTorch, LangChain"
    description: "Runs localized diagnostic models to generate urgency scores and plain-language rationales."
  - type: "component"
    name: "Audit & Traceability Logger"
    technology: "Python, OpenTelemetry, Prometheus"
    description: "Captures model versions, feature inputs, and output urgency levels for regulatory compliance, routing logs to storage and dead-letter queues."
  - type: "component"
    name: "Feedback Ingestion Component"
    technology: "FastAPI / Python"
    description: "Handles post-triage patient feedback and escalation metrics."
relationships:
  - source: "Triage API Controller"
    destination: "Inference Engine Component"
    description: "Invokes diagnostic models internally."
  - source: "Inference Engine Component"
    destination: "Audit & Traceability Logger"
    description: "Transmits structured reasoning and model version metadata."
  - source: "Audit & Traceability Logger"
    destination: "BigQuery"
    description: "Persists regional audit trails and feedback telemetry."
  - source: "Audit & Traceability Logger"
    destination: "Cloud SQL"
    description: "Persists regional audit trails and feedback telemetry."
  - source: "Audit & Traceability Logger"
    destination: "Pub/Sub"
    description: "Routes failed audit payloads to a dead-letter queue."