level: component
scope: "Component diagram for the Media Relaying Service container"
parentContainer:
  name: "Media Relaying Service"
elements:
  - type: "component"
    name: "SFU Media Router"
    technology: "Go, LiveKit server node"
    description: "Handles real-time WebRTC media forwarding and adaptive bitrate scaling."
  - type: "component"
    name: "Room & Session Manager"
    technology: "Node.js / Go"
    description: "Manages virtual rooms, authentication, and region-locked policies."
  - type: "component"
    name: "Telemetry & Audit Collector"
    technology: "Go"
    description: "Captures WebRTC stats and compliance metadata."
  - type: "component"
    name: "TURN/STUN Relay Gateway"
    technology: "Coturn / LiveKit Egress"
    description: "Handles NAT traversal and TCP fallback."
relationships:
  - source: "SFU Media Router"
    destination: "Telemetry & Audit Collector"
    description: "Streams session quality metrics [Internal gRPC]"