level: component
scope: "Component diagram for the GCP GKE Regional Clusters container"
parentContainer:
  name: "GCP GKE Regional Clusters"
elements:
  - type: "component"
    name: "Kubernetes Ingress Controllers (NGINX / Envoy)"
    technology: "NGINX / Envoy"
    description: "Manages TLS termination and ingress traffic routing for regional clusters."
  - type: "component"
    name: "Network Policy Enforcer (GKE Dataplane V2 / eBPF)"
    technology: "GKE Dataplane V2 / eBPF"
    description: "Enforces pod isolation and namespace segmentation using Layer 3/4 eBPF protocols."
  - type: "component"
    name: "Log Forwarder & OTel Collectors"
    technology: "Fluentbit / OpenTelemetry"
    description: "Streams audit logs and telemetry data to observability platforms."
  - type: "component"
    name: "Core Telehealth & AI Inference Services"
    technology: "Microservices (Containerized)"
    description: "Handles video streaming, prescriptions, and AI symptom analysis."
relationships:
  - source: "Kubernetes Ingress Controllers (NGINX / Envoy)"
    destination: "Core Telehealth & AI Inference Services"
    description: "Routes HTTPS/gRPC application traffic to internal microservices."
  - source: "Network Policy Enforcer (GKE Dataplane V2 / eBPF)"
    destination: "Core Telehealth & AI Inference Services"
    description: "Enforces workload isolation and security boundaries."
  - source: "Log Forwarder & OTel Collectors"
    destination: "Core Telehealth & AI Inference Services"
    description: "Collects logs and telemetry data from microservices."