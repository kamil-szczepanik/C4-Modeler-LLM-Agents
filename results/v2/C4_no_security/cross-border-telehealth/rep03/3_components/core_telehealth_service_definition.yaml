level: component
scope: "Component diagram for the Core Telehealth Service container"
parentContainer:
  name: "Core Telehealth Service"
elements:
  - type: "component"
    name: "Telehealth API Router"
    technology: "Go / Gin"
    description: "Handles incoming API requests routed from the GCP API Gateway."
  - type: "component"
    name: "Session & Telemetry Manager"
    technology: "Go / Gin"
    description: "Manages session state and persists telemetry data to Cloud SQL PostgreSQL."
  - type: "component"
    name: "AI Symptom-Check Coordinator"
    technology: "Go / Gin with gRPC"
    description: "Sends symptom-check requests to the AI Inference Wrapper with audit logging."
  - type: "component"
    name: "Prescription Dispatcher"
    technology: "Go / Gin with GCP Pub/Sub"
    description: "Dispatches prescriptions asynchronously to the Pharmacy Integration Gateway."
relationships:
  - source: "Telehealth API Router"
    destination: "Session & Telemetry Manager"
    description: "Delegates session state handling"
  - source: "Telehealth API Router"
    destination: "AI Symptom-Check Coordinator"
    description: "Triggers AI symptom checks"
  - source: "Telehealth API Router"
    destination: "Prescription Dispatcher"
    description: "Initiates prescription dispatch"
  - source: "Session & Telemetry Manager"
    destination: "Cloud SQL PostgreSQL"
    description: "Persists session state and telemetry [TLS]"
  - source: "AI Symptom-Check Coordinator"
    destination: "AI Inference Wrapper"
    description: "Sends symptom-check requests with audit logging [gRPC]"
  - source: "Prescription Dispatcher"
    destination: "Pharmacy Integration Gateway"
    description: "Dispatches prescriptions asynchronously [GCP Pub/Sub]"