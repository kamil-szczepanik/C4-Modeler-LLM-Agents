level: component
scope: "Component diagram for the AI Inference Wrapper container"
parentContainer:
  name: "AI Inference Wrapper"
elements:
  - type: "component"
    name: "AI Inference API Router"
    technology: "Python / FastAPI"
    description: "Handles incoming gRPC requests from the Core Telehealth Service and routes them to the symptom checker models."
  - type: "component"
    name: "Model Execution Engine"
    technology: "Python"
    description: "Executes symptom checking AI models and formats the clinical output."
  - type: "component"
    name: "Audit Log Publisher"
    technology: "Python gRPC Client"
    description: "Publishes asynchronous audit logs and traceability data to GCP Cloud Pub/Sub for EU MDR compliance."
relationships:
  - source: "AI Inference API Router"
    destination: "Model Execution Engine"
    description: "Invokes symptom analysis"
  - source: "AI Inference API Router"
    destination: "Audit Log Publisher"
    description: "Sends audit events asynchronously"