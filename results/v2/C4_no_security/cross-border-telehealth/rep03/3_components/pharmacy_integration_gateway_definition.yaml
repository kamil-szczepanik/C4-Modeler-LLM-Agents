level: component
scope: "Component diagram for the Pharmacy Integration Gateway container"
parentContainer:
  name: "Pharmacy Integration Gateway"
elements:
  - type: "component"
    name: "Routing & Mediation Engine"
    technology: "Apache Camel / Spring Integration"
    description: "Transforms canonical models to regional formats."
  - type: "component"
    name: "Adapter Registry"
    technology: "Apache Camel / Spring Integration"
    description: "Manages adapters to deliver prescriptions to regional systems."
  - type: "component"
    name: "Delivery Status Tracker"
    technology: "Apache Camel / Spring Integration"
    description: "Publishes delivery status updates back to the core service."
  - type: "component"
    name: "Error Classification & Translation Engine"
    technology: "Apache Camel / Spring Integration"
    description: "Sends categorized failure notifications."
relationships:
  - source: "Routing & Mediation Engine"
    destination: "Adapter Registry"
    description: "Transforms canonical models to regional formats [Internal Method]"
  - source: "Adapter Registry"
    destination: "US Pharmacy Systems / EU National Networks"
    description: "Delivers prescriptions [HL7 FHIR, HTTPS/REST]"
  - source: "Delivery Status Tracker"
    destination: "Core Telehealth Service"
    description: "Publishes delivery status updates [GCP Pub/Sub]"
  - source: "Error Classification & Translation Engine"
    destination: "Delivery Status Tracker"
    description: "Sends categorized failure notifications [GCP Pub/Sub]"