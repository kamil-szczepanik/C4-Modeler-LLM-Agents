level: component
scope: "Component diagram for the Consent & Profile Management Service container"
parentContainer:
  name: "Consent & Profile Management Service"
elements:
  - type: "component"
    name: "Consent Controller"
    technology: "Go / Spring Boot"
    description: "Handles incoming REST/gRPC requests regarding patient and clinician consent profiles."
  - type: "component"
    name: "Profile Manager"
    technology: "Go / Spring Boot"
    description: "Manages profile data, cross-border access validation, and low-latency consent evaluation."
  - type: "component"
    name: "Audit Event Publisher"
    technology: "Go / Spring Boot"
    description: "Streams audit events asynchronously to GCP Cloud Pub/Sub for compliance and tracking."
relationships:
  - source: "Consent Controller"
    destination: "Profile Manager"
    description: "Evaluates consent and manages user profiles"
  - source: "Profile Manager"
    destination: "Cloud SQL PostgreSQL Databases"
    description: "Reads and writes profile data using Row-Level Security (RLS)"
  - source: "Profile Manager"
    destination: "GCP Cloud Pub/Sub"
    description: "Publishes audit events"