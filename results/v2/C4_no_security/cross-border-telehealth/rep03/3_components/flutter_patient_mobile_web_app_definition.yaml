level: component
scope: "Component diagram for the Flutter Patient Mobile/Web App container"
parentContainer:
  name: "Flutter Patient Mobile/Web App"
elements:
  - type: "component"
    name: "Presentation Layer"
    technology: "Dart/Flutter UI component"
    description: "Provides the user interface for video consultations, e-prescriptions, and the AI symptom checker."
  - type: "component"
    name: "State & Local Storage Manager"
    technology: "Hive / SQLite component"
    description: "Handles client-side caching for offline resilience and low-bandwidth conditions."
  - type: "component"
    name: "API Client & Region Router"
    technology: "Dio / HTTP component"
    description: "Manages regional API routing and communication based on user geolocation."
  - type: "component"
    name: "WebRTC Video Module"
    technology: "WebRTC component"
    description: "Enables low-bandwidth video consultations with regional TURN/STUN fallback."
  - type: "component"
    name: "Feature Flag & Configuration Provider"
    technology: "Feature Flag & Configuration Provider component"
    description: "Provides feature flags and configuration settings, syncing asynchronously with backend services."
relationships:
  - source: "API Client & Region Router"
    destination: "GCP API Gateway"
    description: "Routes requests via HTTPS (REST/GraphQL) based on user geolocation."
  - source: "WebRTC Video Module"
    destination: "TURN/STUN relays"
    description: "Connects to regional relays for peer-to-peer media streams."
  - source: "Feature Flag & Configuration Provider"
    destination: "Consent & Profile Management Service"
    description: "Syncs asynchronously via HTTPS."