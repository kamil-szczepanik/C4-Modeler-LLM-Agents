level: component
scope: "Component diagram for the Cloud SQL PostgreSQL Databases container"
parentContainer:
  name: "Cloud SQL PostgreSQL Databases"
elements:
  - type: "component"
    name: "Core Telehealth Schema"
    technology: "Cloud SQL PostgreSQL 15, SQL over TLS 1.3"
    description: "Stores core telehealth consultation data, supported by PgBouncer and IAM authentication."
  - type: "component"
    name: "Consent & Audit Schema"
    technology: "Cloud SQL PostgreSQL 15, SQL over TLS 1.3"
    description: "Manages patient consent records and audit logs using least-privilege accounts."
  - type: "component"
    name: "FHIR Interoperability Schema"
    technology: "Cloud SQL PostgreSQL 15, JSONB"
    description: "Stores and indexes US FHIR resources for interoperability and pharmacy integrations."
relationships:
  - source: "Core Telehealth Service"
    destination: "Core Telehealth Schema"
    description: "SQL over TLS 1.3 with IAM authentication and PgBouncer"
  - source: "Consent & Profile Management Service"
    destination: "Consent & Audit Schema"
    description: "SQL over TLS 1.3 with least-privilege accounts"
  - source: "Pharmacy Integration Gateway"
    destination: "FHIR Interoperability Schema"
    description: "SQL over TLS 1.3 using dedicated credentials"