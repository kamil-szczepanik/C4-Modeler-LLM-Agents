level: component
scope: "Component diagram for the Clinician Portal container"
parentContainer:
  name: "Clinician Portal"
elements:
  - type: "component"
    name: "Clinician UI"
    technology: "React / TypeScript"
    description: "Low-latency user interface for licensed clinicians to manage consultations and prescriptions."
  - type: "component"
    name: "Clinician Backend Layer"
    technology: "Node.js / Express"
    description: "Backend component layer handling session management and prescription routing."
relationships:
  - source: "Clinician UI"
    destination: "Clinician Backend Layer"
    description: "Communicates via HTTPS/REST for session and prescription operations."