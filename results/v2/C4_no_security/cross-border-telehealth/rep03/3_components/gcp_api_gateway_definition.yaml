level: component
scope: "Component diagram for the GCP API Gateway container"
parentContainer:
  name: "GCP API Gateway"
elements:
  - type: "component"
    name: "Cloud Endpoints Envoy Router"
    technology: "Cloud Endpoints / Envoy"
    description: "Handles edge routing, Anycast geo-routing, and local JWT validation to minimize latency and enforce physical entry-point segregation."
  - type: "component"
    name: "Authentication and Authorization Handler"
    technology: "OIDC, HTTPS, OAuth2/JWT"
    description: "Authenticates users via Regional Identity Providers and validates security tokens."
  - type: "component"
    name: "Audit Endpoint Handler"
    technology: "mTLS, signed JWTs, HTTPS"
    description: "Manages secure access for Regional Health Authorities and Auditors to audit endpoints."
relationships:
  - source: "Cloud Endpoints Envoy Router"
    destination: "Authentication and Authorization Handler"
    description: "Validates incoming tokens and authenticates users [OIDC, HTTPS]"
  - source: "Cloud Endpoints Envoy Router"
    destination: "Audit Endpoint Handler"
    description: "Enforces mTLS and signed JWT checks for compliance [mTLS, HTTPS]"