level: component
scope: "Component diagram for the GCP Cloud Pub/Sub container"
parentContainer:
  name: "GCP Cloud Pub/Sub"
elements:
  - type: "component"
    name: "Regional Topics"
    technology: "GCP Cloud Pub/Sub"
    description: "Region-isolated messaging topics ensuring regional data residency for e-prescriptions and audit logs."
  - type: "component"
    name: "Dead Letter Topics"
    technology: "GCP Cloud Pub/Sub"
    description: "Captures undeliverable messages to ensure e-prescription reliability for unstable connections."
  - type: "component"
    name: "Schema Validator"
    technology: "Avro / Protocol Buffers"
    description: "Enforces data contracts at the Pub/Sub ingestion boundary."
relationships:
  - source: "Regional Topics"
    destination: "Dead Letter Topics"
    description: "Routes undeliverable messages"
  - source: "Schema Validator"
    destination: "Regional Topics"
    description: "Validates message payloads before ingestion"