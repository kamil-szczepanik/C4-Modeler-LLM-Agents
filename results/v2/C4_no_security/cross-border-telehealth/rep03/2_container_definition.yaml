level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients in the EU and US seeking video consultations, e-prescriptions, and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed medical professionals providing video consultations and issuing e-prescriptions."
  - type: "externalSystem"
    name: "Pharmacies and National Pharmacy Networks (EU) / US Pharmacy Systems"
    description: "National and regional pharmacy systems for fulfilling e-prescriptions."
  - type: "externalSystem"
    name: "AI Symptom Checker Engine"
    description: "Engine providing AI symptom checking with immutable audit logging sidecars."
  - type: "externalSystem"
    name: "Regional Identity Providers"
    description: "EU eIDAS-compliant and US OAuth via OIDC identity providers."
  - type: "externalSystem"
    name: "Regional Health Authorities and Auditors"
    description: "Authorities accessing regional audit endpoints for compliance and oversight."
  - type: "container"
    name: "Flutter Patient Mobile/Web App"
    technology: "Flutter"
    description: "Client-side application supporting local caching for low-bandwidth degradation used by patients across the EU and US."
  - type: "container"
    name: "Clinician Portal"
    technology: "React / Node.js"
    description: "Clinician portal web application framework used by licensed clinicians."
  - type: "container"
    name: "GCP API Gateway"
    technology: "Cloud Endpoints / Envoy"
    description: "API gateway managing incoming HTTPS, WebRTC, and OAuth2/JWT traffic."
  - type: "container"
    name: "Core Telehealth Service"
    technology: "Go / Spring Boot"
    description: "Core microservice runtime for high-throughput telehealth orchestration."
  - type: "container"
    name: "AI Inference Wrapper"
    technology: "Python / FastAPI"
    description: "AI inference wrapper for symptom checker integration."
  - type: "container"
    name: "Consent & Profile Management Service"
    technology: "Go / Spring Boot"
    description: "Manages patient consent and profile data."
  - type: "container"
    name: "Pharmacy Integration Gateway"
    technology: "Apache Camel / Spring Integration"
    description: "Translates data to HL7 FHIR (US) and EU national standards for prescription delivery."
  - type: "container"
    name: "GCP GKE Regional Clusters"
    technology: "GCP GKE (europe-west3, us-central1)"
    description: "Isolated regional container orchestration guaranteeing strict GDPR and HIPAA data residency compliance."
  - type: "container"
    name: "Cloud SQL PostgreSQL Databases"
    technology: "Cloud SQL PostgreSQL"
    description: "Region-locked primary data stores enforcing data residency."
  - type: "container"
    name: "GCP Cloud Pub/Sub"
    technology: "GCP Cloud Pub/Sub"
    description: "Asynchronous messaging buffer for prescription reliability."
relationships:
  - source: "Patients"
    destination: "GCP API Gateway"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS, WebRTC, OAuth2/JWT"
  - source: "Licensed Clinicians"
    destination: "GCP API Gateway"
    description: "Accesses clinician portal for video consultations and e-prescriptions"
    technology: "HTTPS, WebRTC, OAuth2/JWT"
  - source: "GCP API Gateway"
    destination: "Core Telehealth Service"
    description: "Routes API requests to core telehealth orchestration"
    technology: "gRPC"
  - source: "Core Telehealth Service"
    destination: "AI Inference Wrapper"
    description: "Sends requests for AI symptom checking"
    technology: "gRPC"
  - source: "Core Telehealth Service"
    destination: "Pharmacy Integration Gateway"
    description: "Sends prescription data asynchronously for pharmacy integration"
    technology: "GCP Pub/Sub"
  - source: "Core Telehealth Service"
    destination: "Cloud SQL PostgreSQL Databases"
    description: "Reads and writes regional telehealth data"
    technology: "TLS"
  - source: "Consent & Profile Management Service"
    destination: "Cloud SQL PostgreSQL Databases"
    description: "Stores and retrieves consent and profile data"
    technology: "TLS"
  - source: "Pharmacy Integration Gateway"
    destination: "Pharmacies and National Pharmacy Networks (EU) / US Pharmacy Systems"
    description: "Delivers e-prescriptions using HL7 FHIR and national standards"
    technology: "HL7 FHIR, HTTPS/REST"
  - source: "GCP API Gateway"
    destination: "Regional Identity Providers"
    description: "Authenticates users via OIDC"
    technology: "OIDC, HTTPS"
  - source: "Regional Health Authorities and Auditors"
    destination: "GCP API Gateway"
    description: "Accesses regional audit endpoints for compliance"
    technology: "mTLS, signed JWTs, HTTPS"