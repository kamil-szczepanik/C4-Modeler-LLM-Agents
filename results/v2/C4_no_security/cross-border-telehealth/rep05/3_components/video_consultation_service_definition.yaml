level: component
scope: "Component diagram for the Video Consultation Service container"
parentContainer:
  name: "Video Consultation Service"
elements:
  - type: "component"
    name: "Signaling Component"
    technology: "Node.js / WebSockets"
    description: "Manages real-time WebRTC signaling for video consultations."
  - type: "component"
    name: "SFU Media Router"
    technology: "MediaSoup / C++ / Node.js"
    description: "Handles adaptive bitrate video routing for unstable and low-bandwidth connections."
  - type: "component"
    name: "Session Management Controller"
    technology: "Node.js / Express"
    description: "Manages consultation session logic and lifecycle."
  - type: "component"
    name: "Audit & Metadata Logger Component"
    technology: "Node.js"
    description: "Emits and persists compliance audit logs and session metadata."
relationships:
  - source: "Signaling Component"
    destination: "SFU Media Router"
    description: "Manages RTP/RTCP media routing [Internal UDP/TCP]"
  - source: "Session Management Controller"
    destination: "Audit & Metadata Logger Component"
    description: "Emits session lifecycle events [Internal gRPC]"