level: component
scope: "Component diagram for the AI Symptom Checker Service container"
parentContainer:
  name: "AI Symptom Checker Service"
elements:
  - type: "component"
    name: "Triage Orchestrator"
    technology: "Python / FastAPI"
    description: "Internal component that orchestrates symptom analysis requests and dispatches payload snapshots."
  - type: "component"
    name: "Inference Adapter"
    technology: "Python / LangChain / PyTorch"
    description: "Calculates urgency using AI models and inference runtime."
  - type: "component"
    name: "Audit & Traceability Logger"
    technology: "Python Component"
    description: "Dispatches payload snapshots and writes immutable records for compliance."
  - type: "component"
    name: "Compliance Exporter"
    technology: "Python Background Worker"
    description: "Aggregates logs for compliance reports to ensure EU MDR traceability."
relationships:
  - source: "Triage Orchestrator"
    destination: "Inference Adapter"
    description: "Requests urgency calculation [In-process async / gRPC]"
  - source: "Triage Orchestrator"
    destination: "Audit & Traceability Logger"
    description: "Dispatches payload snapshots [Cloud Pub/Sub Lite]"