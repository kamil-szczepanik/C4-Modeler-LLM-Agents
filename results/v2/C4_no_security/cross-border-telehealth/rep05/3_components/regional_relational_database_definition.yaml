level: component
scope: "Component diagram for the Regional Relational Database container"
parentContainer:
  name: "Regional Relational Database"
elements:
  - type: "component"
    name: "Google Cloud SQL PostgreSQL"
    technology: "Google Cloud SQL PostgreSQL, pgAudit"
    description: "Stores transactional data and generates immutable access and transaction logs for compliance."
  - type: "component"
    name: "Regional Relational Database Read Replica"
    technology: "PostgreSQL Replication"
    description: "Replicates data asynchronously from the primary database for read-scale."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Manages connection spikes and prevents thread exhaustion."
relationships:
  - source: "Google Cloud SQL PostgreSQL"
    destination: "Regional Relational Database Read Replica"
    description: "Replicates data asynchronously for read-scale [Internal PostgreSQL Replication]"