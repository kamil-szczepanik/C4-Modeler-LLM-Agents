level: component
scope: "Component diagram for the Integration & Interoperability Service container"
parentContainer:
  name: "Integration & Interoperability Service"
elements:
  - type: "component"
    name: "API Router & Transformer Component"
    technology: "Apache Camel / Spring Integration"
    description: "Routes integration requests and handles format translation between internal formats and regional standards."
  - type: "component"
    name: "US FHIR Connector Component"
    technology: "Java / Spring Boot"
    description: "Connects to US external pharmacies and health systems using US FHIR standards."
  - type: "component"
    name: "EU National Standard Connector Component"
    technology: "Java / Spring Boot"
    description: "Connects to EU national health systems using regional European standards."
  - type: "component"
    name: "Audit & Logging Interceptor"
    technology: "OpenTelemetry"
    description: "Secures telemetry, performs PAI/PHI log scrubbing, and streams compliance logs."
  - type: "component"
    name: "Dead-Letter Queue (DLQ) Handler"
    technology: "GCP Pub/Sub"
    description: "Manages dead-letter queues and asynchronous message retries for failed delivery requests."
relationships:
  - source: "API Router & Transformer Component"
    destination: "US FHIR Connector Component"
    description: "Delegates payloads via Direct Java Method Calls"
  - source: "API Router & Transformer Component"
    destination: "EU National Standard Connector Component"
    description: "Delegates payloads via Direct Java Method Calls"
  - source: "US FHIR Connector Component"
    destination: "Dead-Letter Queue (DLQ) Handler"
    description: "Captures failed delivery messages via GCP Pub/Sub"
  - source: "EU National Standard Connector Component"
    destination: "Dead-Letter Queue (DLQ) Handler"
    description: "Captures failed delivery messages via GCP Pub/Sub"
  - source: "Audit & Logging Interceptor"
    destination: "BigQuery"
    description: "Streams scrubbed compliance logs via gRPC / TLS"