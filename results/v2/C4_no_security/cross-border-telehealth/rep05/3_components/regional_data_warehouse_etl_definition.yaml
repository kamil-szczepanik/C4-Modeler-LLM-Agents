level: component
scope: "Component diagram for the Regional Data Warehouse / ETL container"
parentContainer:
  name: "Regional Data Warehouse / ETL"
elements:
  - type: "component"
    name: "Ingestion & Anonymization Worker"
    technology: "Google Cloud Dataflow (Python)"
    description: "Performs PII-stripping and de-identification of streaming CDC events."
  - type: "component"
    name: "Regional Analytics Storage"
    technology: "Google Cloud BigQuery"
    description: "Stores regional analytics and secure data for reporting."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "Cloud Logging / Pub/Sub"
    description: "Captures immutable audit logs and compliance data."
  - type: "component"
    name: "Data Governance & RBAC Manager"
    technology: "GCP IAM"
    description: "Applies IAM and column-level security."
relationships:
  - source: "Regional Relational Database"
    destination: "Ingestion & Anonymization Worker"
    description: "Streams CDC events [gRPC/JSON via Debezium/Pub/Sub]"
  - source: "Clinical Managers & Researchers"
    destination: "Regional Analytics Storage"
    description: "Queries regional reports [HTTPS via Looker]"
  - source: "Data Governance & RBAC Manager"
    destination: "Regional Analytics Storage"
    description: "Applies IAM and column-level security [Internal GCP IAM API]"