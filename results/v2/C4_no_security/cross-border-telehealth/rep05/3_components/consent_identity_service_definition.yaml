level: component
scope: "Component diagram for the Consent & Identity Service container"
parentContainer:
  name: "Consent & Identity Service"
elements:
  - type: "component"
    name: "Auth Component"
    technology: "Keycloak"
    description: "Handles OIDC/OAuth2 authentication and user federation."
  - type: "component"
    name: "Consent Enforcement Component"
    technology: "Java / Spring Boot"
    description: "Evaluates real-time purpose-based access policies and persists purpose-based consent ledgers."
  - type: "component"
    name: "Audit & Transparency Component"
    technology: "Java / Spring Boot"
    description: "Emits and persists long-term compliance audit trails."
relationships:
  - source: "Auth Component"
    destination: "Consent Enforcement Component"
    description: "Validates user identity and OIDC tokens [gRPC / REST]"
  - source: "Consent Enforcement Component"
    destination: "Audit & Transparency Component"
    description: "Emits asynchronous access events [Google Cloud Pub/Sub]"