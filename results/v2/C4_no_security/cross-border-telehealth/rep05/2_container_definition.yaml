level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients & Clinicians"
    description: "End-users accessing secure video consultations, e-prescriptions, and the AI symptom checker."
  - type: "externalSystem"
    name: "External Pharmacies"
    description: "External facilities receiving prescriptions via regional standards and HL7 FHIR."
  - type: "externalSystem"
    name: "Identity Providers"
    description: "External identity providers integrated with regional authentication flows."
  - type: "externalSystem"
    name: "National Health Systems"
    description: "External national health and insurance systems."
  - type: "container"
    name: "API Gateway / BFF"
    technology: "Envoy / Cloud Endpoints"
    description: "Routes external requests and provides Backend-For-Frontend services."
  - type: "container"
    name: "Video Consultation Service"
    technology: "MediaSoup WebRTC SFU"
    description: "Delivers adaptive bitrate video consultations for unstable connections."
  - type: "container"
    name: "AI Symptom Checker Service"
    technology: "Python / FastAPI"
    description: "Powers the AI symptom checker with model version logging."
  - type: "container"
    name: "Integration & Interoperability Service"
    technology: "REST, HL7 FHIR"
    description: "Handles interoperability with external pharmacies and regional standards."
  - type: "container"
    name: "Consent & Identity Service"
    technology: "Keycloak"
    description: "Manages identity, authentication, and granular consents."
  - type: "container"
    name: "Regional Relational Database"
    technology: "Google Cloud SQL PostgreSQL"
    description: "Manages transactional healthcare records and granular consents."
  - type: "container"
    name: "Regional Data Warehouse / ETL"
    technology: "BigQuery"
    description: "Processes anonymized regional analytics via ETL without violating privacy laws."
relationships:
  - source: "Patients & Clinicians"
    destination: "API Gateway / BFF"
    description: "Sends client requests for consultations, prescriptions, and symptoms"
    technology: "HTTPS / WebSockets / WebRTC (UDP/TCP)"
  - source: "API Gateway / BFF"
    destination: "Video Consultation Service"
    description: "Forwards video consultation traffic"
    technology: "gRPC / REST"
  - source: "API Gateway / BFF"
    destination: "AI Symptom Checker Service"
    description: "Forwards symptom analysis requests"
    technology: "gRPC / REST"
  - source: "API Gateway / BFF"
    destination: "Consent & Identity Service"
    description: "Validates authentication and user sessions"
    technology: "gRPC / REST"
  - source: "API Gateway / BFF"
    destination: "Integration & Interoperability Service"
    description: "Routes interoperability requests"
    technology: "gRPC / REST"
  - source: "Integration & Interoperability Service"
    destination: "External Pharmacies"
    description: "Sends prescriptions and data using regional standards and HL7 FHIR"
    technology: "REST"
  - source: "AI Symptom Checker Service"
    destination: "Regional Relational Database"
    description: "Reads and writes transactional data"
    technology: "TLS"
  - source: "Video Consultation Service"
    destination: "Regional Relational Database"
    description: "Persists consultation metadata"
    technology: "TLS"
  - source: "Consent & Identity Service"
    destination: "Regional Relational Database"
    description: "Stores user identity and consent records"
    technology: "TLS"
  - source: "Integration & Interoperability Service"
    destination: "Regional Relational Database"
    description: "Persists integrated healthcare records"
    technology: "TLS"
  - source: "Regional Relational Database"
    destination: "Regional Data Warehouse / ETL"
    description: "Syncs anonymized analytics via ETL"
    technology: "Internal ETL pipeline"