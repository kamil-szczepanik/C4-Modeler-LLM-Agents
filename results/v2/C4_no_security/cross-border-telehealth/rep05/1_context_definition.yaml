level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US while enforcing strict regional data residency and compliance."
elements:
  - type: "person"
    name: "Patients & Clinicians"
    description: "End-users accessing the platform via cross-platform web and mobile clients."
  - type: "externalSystem"
    name: "External Pharmacies"
    description: "Regional facilities receiving prescriptions via local EU standards and US HL7 FHIR."
  - type: "externalSystem"
    name: "Identity Providers (IdP)"
    description: "Regional OAuth2/OIDC services for user authentication."
  - type: "externalSystem"
    name: "National Health/Insurance Systems"
    description: "External platforms for coverage validation and billing."
  - type: "externalSystem"
    name: "Regulatory Authorities"
    description: "EU/US auditors accessing immutable logs for EU MDR and HIPAA compliance."
relationships:
  - source: "Patients & Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS and WebRTC routed via Geo-DNS/Anycast"
  - source: "Cross-Border Telehealth Platform"
    destination: "External Pharmacies"
    description: "Sends prescriptions using local standards and US HL7 FHIR"
    technology: "Secure REST APIs over HTTPS with mTLS and GCP Pub/Sub"
  - source: "Cross-Border Telehealth Platform"
    destination: "National Health/Insurance Systems"
    description: "Performs coverage validation and billing"
    technology: "Secure REST APIs over HTTPS with mTLS and GCP Pub/Sub"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity Providers (IdP)"
    description: "Authenticates users"
    technology: "OAuth2/OIDC token exchange over HTTPS"
  - source: "Regulatory Authorities"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses immutable logs for compliance audits"
    technology: "Zero-Trust Network Access (ZTNA) via secure auditor portals"