level: component
scope: "Component diagram for the Patient Portal container"
parentContainer:
  name: "Patient Portal"
elements:
  - type: "component"
    name: "SPA Router & View Manager"
    technology: "React, Flutter"
    description: "Manages application views, user routing, and UI state for telehealth services."
  - type: "component"
    name: "Offline Storage Manager"
    technology: "IndexedDB, Web Crypto API (AES-GCM 256)"
    description: "Handles secure offline data persistence and encryption for resilient access."
  - type: "component"
    name: "API Communication Client"
    technology: "HTTPS, WSS, GCP Cloud CDN"
    description: "Transmits API requests, video telemetry, and real-time messaging to the region router."
relationships:
  - source: "SPA Router & View Manager"
    destination: "Offline Storage Manager"
    description: "Persists and retrieves encrypted health data locally"
  - source: "SPA Router & View Manager"
    destination: "API Communication Client"
    description: "Initiates HTTP and WebSocket requests"
  - source: "API Communication Client"
    destination: "API Gateway / Region Router"
    description: "Routes API requests and telemetry via Cloud CDN"