# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Interoperability Adapter container"
parentContainer:
  name: "Interoperability Adapter"
elements:
  - type: "component"
    name: "US FHIR Translator Component"
    technology: "Go, GKE"
    description: "Translates core telehealth payloads into US-specific FHIR formats for US pharmacy networks."
  - type: "component"
    name: "EU National Gateway Adapter Component"
    technology: "Go, GKE"
    description: "Adapts core telehealth payloads to conform with EU national e-prescription gateway requirements."
  - type: "component"
    name: "Prescription Status & Retry Queue Component"
    technology: "Google Cloud Pub/Sub"
    description: "Handles asynchronous messaging for reliable retry queues and dead-letter routing of prescription states."
  - type: "component"
    name: "Prescription Status Manager Component"
    technology: "Go"
    description: "Manages and emits standardized status updates based on transmission events."
relationships:
  - source: "US FHIR Translator Component"
    destination: "Prescription Status & Retry Queue Component"
    description: "Publishes success/failure states [Google Cloud Pub/Sub]"
  - source: "EU National Gateway Adapter Component"
    destination: "Prescription Status & Retry Queue Component"
    description: "Publishes success/failure states [Google Cloud Pub/Sub]"
  - source: "Prescription Status & Retry Queue Component"
    destination: "Prescription Status Manager Component"
    description: "Delivers transmission events [Internal Pub/Sub]"