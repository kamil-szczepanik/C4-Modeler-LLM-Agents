level: component
scope: "Component diagram for the API Gateway / Region Router container"
parentContainer:
  name: "API Gateway / Region Router"
elements:
  - type: "component"
    name: "Edge Router & TLS Terminator"
    technology: "Envoy Proxy, Anycast"
    description: "Handles edge routing, TLS termination, HTTP/3 (QUIC) and WSS connectivity for unstable rural connections."
  - type: "component"
    name: "Cloud Endpoints Gateway"
    technology: "Cloud Endpoints"
    description: "Manages API routing and request validation across EU and US regions."
  - type: "component"
    name: "Geo-fencing & Context Injector"
    technology: "Envoy Filter / Go"
    description: "Enforces strict data residency and compliance by injecting context without modifying core microservices."
relationships:
  - source: "Edge Router & TLS Terminator"
    destination: "Cloud Endpoints Gateway"
    description: "Forwards terminated HTTPS/WSS/QUIC traffic"
  - source: "Cloud Endpoints Gateway"
    destination: "Geo-fencing & Context Injector"
    description: "Injects compliance and routing context"