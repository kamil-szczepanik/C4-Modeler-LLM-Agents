level: component
scope: "Component diagram for the AI Gateway container"
parentContainer:
  name: "AI Gateway"
elements:
  - type: "component"
    name: "Policy & Data Residency Interceptor"
    technology: "Go"
    description: "Enforces regional data separation and compliance policies for incoming payloads."
  - type: "component"
    name: "Audit & Version Logger"
    technology: "Go"
    description: "Persists compliance logs, structured metadata, and summaries."
  - type: "component"
    name: "Throttling & Fallback Proxy"
    technology: "Go"
    description: "Manages request throttling and proxies sanitized requests to the external AI engine."
  - type: "component"
    name: "Triage Explanation Formatter"
    technology: "Go"
    description: "Formats upstream AI responses into finalized recommendations and structured metadata."
relationships:
  - source: "API Gateway / Region Router"
    destination: "Policy & Data Residency Interceptor"
    description: "Forwards raw symptom payload [gRPC over internal VPC]"
  - source: "Throttling & Fallback Proxy"
    destination: "AI Symptom Checker Engine"
    description: "Proxies sanitized requests [mTLS]"
  - source: "Throttling & Fallback Proxy"
    destination: "Triage Explanation Formatter"
    description: "Passes raw upstream AI responses [In-memory Go structs]"
  - source: "Triage Explanation Formatter"
    destination: "Audit & Version Logger"
    description: "Sends structured metadata and summaries [gRPC]"
  - source: "Audit & Version Logger"
    destination: "Data Layer"
    description: "Persists compliance logs [gRPC/SQL]"
  - source: "Triage Explanation Formatter"
    destination: "API Gateway / Region Router"
    description: "Returns finalized recommendations [gRPC]"