level: component
scope: "Component diagram for the Audit & Compliance Reporting Service container"
parentContainer:
  name: "Audit & Compliance Reporting Service"
elements:
  - type: "component"
    name: "Log Ingestion Engine"
    technology: "Go"
    description: "Ingests compliance and audit logs via gRPC over internal VPC."
  - type: "component"
    name: "Jurisdictional Storage Router"
    technology: "Go"
    description: "Routes logs and data to appropriate regional storage ensuring data residency."
  - type: "component"
    name: "Report Generation & Query API"
    technology: "Node.js/GraphQL"
    description: "Provides GraphQL API for compliance reporting and dashboard queries."
  - type: "component"
    name: "Compliance & Export Orchestrator"
    technology: "Node.js"
    description: "Orchestrates compliance tasks and exports via Cloud Pub/Sub."
relationships:
  - source: "Log Ingestion Engine"
    destination: "Jurisdictional Storage Router"
    description: "Passes log data via in-process calls"
  - source: "Report Generation & Query API"
    destination: "Compliance & Export Orchestrator"
    description: "Queries orchestration data and triggers reports"