level: component
scope: "Component diagram for the Core Telehealth Service container"
parentContainer:
  name: "Core Telehealth Service"
elements:
  - type: "component"
    name: "Consultation Orchestrator"
    technology: "Go"
    description: "Manages cross-border video consultations, stream parameters adjustment, and low-bandwidth resilience."
  - type: "component"
    name: "Consent & Policy Engine"
    technology: "Go, Open Policy Agent"
    description: "Validates access rights and enforces GDPR/HIPAA compliance and consent rules."
  - type: "component"
    name: "Prescription Coordinator"
    technology: "Go"
    description: "Coordinates e-prescriptions and publishes prescription status updates."
  - type: "component"
    name: "Notification Event Publisher"
    technology: "Go, Cloud Pub/Sub"
    description: "Publishes stream degradation events and asynchronous notifications with Dead Letter Queues."
relationships:
  - source: "Consultation Orchestrator"
    destination: "WebRTC SFU Media Server"
    description: "Adjusts stream parameters [gRPC / WebRTC control plane]"
  - source: "Consultation Orchestrator"
    destination: "Consent & Policy Engine"
    description: "Validates access rights [In-memory / gRPC]"
  - source: "Consultation Orchestrator"
    destination: "Notification Event Publisher"
    description: "Publishes stream degradation events [Asynchronous / Cloud Pub/Sub]"
  - source: "Prescription Coordinator"
    destination: "Notification Event Publisher"
    description: "Publishes prescription status updates [Asynchronous / Cloud Pub/Sub]"