level: component
scope: "Component diagram for the Data Layer container"
parentContainer:
  name: "Data Layer"
elements:
  - type: "component"
    name: "Cloud SQL PostgreSQL"
    technology: "Google Cloud Platform / PostgreSQL"
    description: "Stores structured patient profiles, encrypted PHI, and consent states with row-level security."
  - type: "component"
    name: "Firestore (Regional)"
    technology: "Google Cloud Platform / Firestore"
    description: "Acts as a real-time sync and caching broker for intermittent connections."
  - type: "component"
    name: "Cloud Storage"
    technology: "Google Cloud Platform / Cloud Storage"
    description: "Stores consultation recordings and clinical documents encrypted with CMEK with regional locks."
  - type: "component"
    name: "Cloud KMS"
    technology: "Google Cloud Platform / Cloud KMS"
    description: "Manages regional Customer-Managed Encryption Keys for cryptographic isolation and data purging."
relationships:
  - source: "Core Telehealth Service"
    destination: "Cloud SQL PostgreSQL"
    description: "SQL over TLS 1.3"
  - source: "Patient Portal"
    destination: "Firestore (Regional)"
    description: "Real-time sync over HTTPS/WebSockets (regional endpoints)"
  - source: "AI Gateway"
    destination: "Cloud SQL PostgreSQL"
    description: "SQL over TLS 1.3 (write-once) for Audit & Traceability Store"
  - source: "Core Telehealth Service"
    destination: "Cloud KMS"
    description: "Envelope encryption via Cloud KMS API"