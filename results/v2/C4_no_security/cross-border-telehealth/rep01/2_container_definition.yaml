level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU and US)"
    description: "Patients from the EU and US seeking secure video consultations, e-prescriptions, and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed medical professionals conducting secure video consultations and managing patient care."
  - type: "externalSystem"
    name: "AI Symptom Checker Engine"
    description: "External Medical Device providing AI-powered symptom checking via REST/gRPC."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways and US Pharmacy Networks"
    description: "External systems handling cross-border prescriptions and pharmacy network integrations."
  - type: "externalSystem"
    name: "Identity Providers"
    description: "EU eID / US OAuth/SAML providers for user authentication."
  - type: "container"
    name: "Patient Portal"
    technology: "React, Flutter, IndexedDB"
    description: "Single Page Application (SPA) providing user interface with local offline caching for resilience."
  - type: "container"
    name: "API Gateway / Region Router"
    technology: "Cloud Endpoints, Envoy"
    description: "Routes client requests to regional deployments and enforces entry security."
  - type: "container"
    name: "Core Telehealth Service"
    technology: "GKE, Node.js, Go, Python"
    description: "Handles core telehealth business logic and service execution."
  - type: "container"
    name: "AI Gateway"
    technology: "GKE, Node.js, Go, Python"
    description: "Interfaces with the external AI Symptom Checker Engine."
  - type: "container"
    name: "Interoperability Adapter"
    technology: "GKE, Node.js, Go, Python"
    description: "Integrates with external EU e-prescription gateways and US pharmacy networks."
  - type: "container"
    name: "Audit & Compliance Reporting Service"
    technology: "GKE, Node.js, Go, Python"
    description: "Monitors and logs activity to ensure adherence to GDPR, HIPAA, and data residency."
  - type: "container"
    name: "WebRTC SFU Media Server"
    technology: "LiveKit, Janus"
    description: "Manages real-time video consultations with dynamic bitrate scaling."
  - type: "container"
    name: "Data Layer"
    technology: "Cloud SQL PostgreSQL, Firestore, Cloud Storage"
    description: "Provides transactional data storage, state caching, and secure file storage."
relationships:
  - source: "Patients (EU and US)"
    destination: "Patient Portal"
    description: "Interact with the patient portal for consultations and health services"
    technology: "HTTPS and WSS"
  - source: "Licensed Clinicians"
    destination: "Patient Portal"
    description: "Interact with the patient portal to conduct consultations"
    technology: "HTTPS and WSS"
  - source: "Patient Portal"
    destination: "API Gateway / Region Router"
    description: "Communicates with API gateway for routing requests"
    technology: "HTTPS/WSS"
  - source: "API Gateway / Region Router"
    destination: "Core Telehealth Service"
    description: "Routes calls to core microservices internally"
    technology: "gRPC over internal VPC networks"
  - source: "API Gateway / Region Router"
    destination: "AI Gateway"
    description: "Routes AI symptom check requests"
    technology: "gRPC over internal VPC networks"
  - source: "API Gateway / Region Router"
    destination: "Interoperability Adapter"
    description: "Routes prescription and pharmacy network tasks"
    technology: "gRPC over internal VPC networks"
  - source: "API Gateway / Region Router"
    destination: "Audit & Compliance Reporting Service"
    description: "Sends audit logs for compliance monitoring"
    technology: "gRPC over internal VPC networks"
  - source: "Core Telehealth Service"
    destination: "WebRTC SFU Media Server"
    description: "Coordinates real-time video session streaming"
    technology: "WebRTC"
  - source: "Core Telehealth Service"
    destination: "Data Layer"
    description: "Reads and writes transactional and state data"
    technology: "PostgreSQL, Firestore, Cloud Storage"
  - source: "AI Gateway"
    destination: "AI Symptom Checker Engine"
    description: "Connects to external AI symptom checker engine"
    technology: "mTLS"
  - source: "Interoperability Adapter"
    destination: "EU National E-Prescription Gateways and US Pharmacy Networks"
    description: "Integrates with external prescription and pharmacy networks"
    technology: "mTLS"
  - source: "API Gateway / Region Router"
    destination: "Identity Providers"
    description: "Authenticates users against regional identity providers"
    technology: "HTTPS"