level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides secure video consultations, e-prescriptions, and AI symptom checking for EU and US patients while strictly enforcing regional data residency and compliance with GDPR, HIPAA, and EU MDR."
elements:
  - type: "person"
    name: "Patients (EU and US)"
    description: "Patients from the EU and US seeking secure video consultations, e-prescriptions, and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed medical professionals conducting secure video consultations and managing patient care."
  - type: "externalSystem"
    name: "AI Symptom Checker Engine"
    description: "External Medical Device providing AI-powered symptom checking via REST/gRPC."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways and US Pharmacy Networks"
    description: "External systems handling cross-border prescriptions and pharmacy network integrations."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Twilio/FCM service utilized via regional asynchronous message queues for notifications."
  - type: "externalSystem"
    name: "Identity Providers"
    description: "EU eID / US OAuth/SAML providers for user authentication."
relationships:
  - source: "Patients (EU and US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Interact with the Platform for video consultations and health services"
    technology: "HTTPS and WebRTC"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Interact with the Platform to conduct consultations and manage care"
    technology: "HTTPS and WebRTC"
  - source: "Cross-Border Telehealth Platform"
    destination: "EU National E-Prescription Gateways and US Pharmacy Networks"
    description: "Connects to external pharmacy networks and e-prescription gateways"
    technology: "Secured APIs (TLS 1.3)"
  - source: "Cross-Border Telehealth Platform"
    destination: "AI Symptom Checker Engine"
    description: "Integrates with external AI symptom checker engine with payload logging"
    technology: "REST/gRPC (TLS 1.3)"
  - source: "Cross-Border Telehealth Platform"
    destination: "Notification Service"
    description: "Utilizes regional asynchronous message queues for notifications"
    technology: "Twilio/FCM"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity Providers"
    description: "Authenticates users via regional identity providers"
    technology: "EU eID / US OAuth/SAML"