level: component
scope: "Component diagram for the Regional Cloud Storage container"
parentContainer:
  name: "Regional Cloud Storage"
elements:
  - type: "component"
    name: "GCP Cloud Storage"
    technology: "GCP Cloud Storage (Regional Storage Buckets in europe-west3 and us-central1) with Object Versioning and Bucket Lock"
    description: "Region-locked, immutable, and secure storage buckets providing versioned audit logs and custom metadata for AI symptom-checker outputs."
  - type: "component"
    name: "AI Symptom Service"
    technology: "Python / FastAPI"
    description: "Service that writes versioned audit logs and custom metadata to regional cloud storage."
  - type: "component"
    name: "GCP Cloud KMS"
    technology: "GCP Cloud Key Management Service"
    description: "Provides Customer-Managed Encryption Keys (CMEK) with regional key rings for strict data protection and encryption of audit logs."
  - type: "component"
    name: "Cloud Monitoring & Logging"
    technology: "GCP Cloud Monitoring API"
    description: "Monitors bucket metrics, errors, and IAM denials."
relationships:
  - source: "AI Symptom Service"
    destination: "GCP Cloud Storage"
    description: "Writes versioned audit logs and custom metadata [HTTPS / Storage API]"
  - source: "GCP Cloud Storage"
    destination: "GCP Cloud KMS"
    description: "Encrypts audit logs using Customer-Managed Encryption Keys [Internal GCP API]"
  - source: "Cloud Monitoring & Logging"
    destination: "GCP Cloud Storage"
    description: "Monitors bucket metrics, errors, and IAM denials [Cloud Monitoring API]"