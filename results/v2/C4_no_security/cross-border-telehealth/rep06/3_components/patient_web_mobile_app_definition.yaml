level: component
scope: "Component diagram for the Patient Web/Mobile App container"
parentContainer:
  name: "Patient Web/Mobile App"
elements:
  - type: "component"
    name: "UI Router & Localization Component"
    technology: "Flutter / WASM"
    description: "Handles internal application routing, UI rendering, and localization for cross-platform clients."
  - type: "component"
    name: "Offline State & Sync Manager"
    technology: "Hive / SQLite with SQLCipher"
    description: "Manages local secure client storage and synchronization for offline resilience under low bandwidth."
  - type: "component"
    name: "API Client Component"
    technology: "Flutter / WASM"
    description: "Connects to the regional API Gateway using TLS 1.3 / HTTPS to facilitate communication."
  - type: "component"
    name: "Consent & Profile Controller"
    technology: "Flutter / WASM"
    description: "Manages patient consent and profile information on the client side."
  - type: "component"
    name: "AI Transparency & Accessibility Component"
    technology: "Flutter / WASM"
    description: "Provides AI transparency and accessibility features within the client application."
  - type: "component"
    name: "Telemetry & Error Boundary Component with Data Scrubbing Middleware"
    technology: "OpenTelemetry / Firebase Crashlytics"
    description: "Handles client-side observability and automated PII scrubbing middleware."
relationships:
  - source: "UI Router & Localization Component"
    destination: "AI Transparency & Accessibility Component"
    description: "Delegates rendering and interaction using internal application routing."
  - source: "UI Router & Localization Component"
    destination: "Consent & Profile Controller"
    description: "Delegates consent management using internal application routing."
  - source: "AI Transparency & Accessibility Component"
    destination: "API Client Component"
    description: "Communicates via HTTPS/REST and WebSockets."
  - source: "Offline State & Sync Manager"
    destination: "API Client Component"
    description: "Communicates state sync via HTTPS/REST and WebSockets."
  - source: "API Client Component"
    destination: "GCP Cloud Endpoints / API Gateway"
    description: "Connects to regional API Gateway using TLS 1.3 / HTTPS."