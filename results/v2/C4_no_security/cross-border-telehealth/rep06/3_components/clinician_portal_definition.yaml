level: component
scope: "Component diagram for the Clinician Portal container"
parentContainer:
  name: "Clinician Portal"
elements:
  - type: "component"
    name: "Clinician Portal"
    technology: "React / TypeScript SPA"
    description: "Frontend single-page application for licensed clinicians to manage consultations and patient records."
  - type: "component"
    name: "Auth & Jurisdiction Context Manager"
    technology: "TypeScript"
    description: "Manages authentication and jurisdiction context for cross-border compliance."
  - type: "component"
    name: "Consultation Workspace"
    technology: "React"
    description: "Provides the interface for active video consultations and clinical notes."
  - type: "component"
    name: "AI Triage & Audit Widget"
    technology: "React / TypeScript"
    description: "Interfaces with the AI symptom service and handles audit logging."
  - type: "component"
    name: "Offline Draft Manager"
    technology: "IndexedDB"
    description: "Handles local persistence for consultation drafts during unstable connections."
  - type: "component"
    name: "E-Prescription & Record Manager"
    technology: "TypeScript"
    description: "Manages e-prescriptions and medical records within the clinician workspace."
relationships:
  - source: "Clinician Portal"
    destination: "Auth & Jurisdiction Context Manager"
    description: "Authenticates and establishes jurisdiction context"
  - source: "Clinician Portal"
    destination: "Consultation Workspace"
    description: "Renders active video consultation interface"
  - source: "Consultation Workspace"
    destination: "Third-Party Video SDK"
    description: "Integrates via WebRTC for real-time video consultations"
  - source: "Consultation Workspace"
    destination: "Offline Draft Manager"
    description: "Utilizes IndexedDB for local persistence"
  - source: "AI Triage & Audit Widget"
    destination: "API Gateway"
    description: "Communicates via HTTPS/JSON for audit logging"
  - source: "Clinician Portal"
    destination: "API Gateway"
    description: "Accesses via HTTPS/REST and gRPC-Web"