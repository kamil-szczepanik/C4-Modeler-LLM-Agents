level: component
scope: "Component diagram for the E-Prescription Integrator container"
parentContainer:
  name: "E-Prescription Integrator"
elements:
  - type: "component"
    name: "Prescription Router"
    technology: "Node.js / Express"
    description: "Routes prescription requests to appropriate regional pharmacy networks securely."
  - type: "component"
    name: "Validation Engine"
    technology: "Python / Cerberus"
    description: "Validates prescription payloads against international healthcare standards."
relationships:
  - source: "Prescription Router"
    destination: "Validation Engine"
    description: "Sends payload for schema and compliance validation"