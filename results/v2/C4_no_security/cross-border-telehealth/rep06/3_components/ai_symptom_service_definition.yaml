level: component
scope: "Component diagram for the AI Symptom Service container"
parentContainer:
  name: "AI Symptom Service"
elements:
  - type: "component"
    name: "API Router / Controller Component"
    technology: "Python / FastAPI"
    description: "Routes symptom check requests and manages HTTP/REST/gRPC entrypoints."
  - type: "component"
    name: "Localization & Normalization Engine"
    technology: "Python / Pydantic"
    description: "Contains the Clinical Semantic Normalizer sub-component to normalize raw patient inputs using regional localization dictionaries."
  - type: "component"
    name: "LLM Orchestrator Component"
    technology: "Python / FastAPI"
    description: "Coordinates diagnostic prompts and manages communication with the external AI LLM Provider."
  - type: "component"
    name: "Audit & Traceability Logger Component"
    technology: "Python / GCP Pub/Sub Lite / Local Redis"
    description: "Writes versioned inputs, outputs, and model versions asynchronously to regional cloud storage for MDR compliance."
relationships:
  - source: "API Router / Controller Component"
    destination: "Localization & Normalization Engine"
    description: "Passes raw patient inputs [In-memory Pydantic models]"
  - source: "Localization & Normalization Engine"
    destination: "LLM Orchestrator Component"
    description: "Sends normalized clinical data [In-memory Pydantic models]"
  - source: "LLM Orchestrator Component"
    destination: "AI LLM Provider"
    description: "Sends diagnostic prompts and receives AI responses [HTTPS]"
  - source: "Audit & Traceability Logger Component"
    destination: "Regional Cloud Storage"
    description: "Writes versioned inputs, outputs, and model versions [HTTPS / Direct Write]"