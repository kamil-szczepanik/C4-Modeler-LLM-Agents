level: component
scope: "Component diagram for the Core Telehealth Service container"
parentContainer:
  name: "Core Telehealth Service"
elements:
  - type: "component"
    name: "Consultation Session Manager"
    technology: "Go"
    description: "Orchestrates video consultation lifecycles and states."
  - type: "component"
    name: "Bandwidth Adaptability Controller"
    technology: "Go"
    description: "Monitors QoS and triggers network fallback modes."
  - type: "component"
    name: "Regional Routing & Audit Interceptor"
    technology: "Go / gRPC Middleware"
    description: "Enforces data residency and logs access events."
  - type: "component"
    name: "Fallback Signaling Component"
    technology: "Go"
    description: "Pushes audio/text fallback states to clients."
  - type: "component"
    name: "Consent & Audit Logger"
    technology: "Go"
    description: "Captures cross-border access attempts for compliance."
  - type: "component"
    name: "GCP GKE & Cloud SQL"
    technology: "PostgreSQL"
    description: "Regional hosting and isolated database storage."
  - type: "component"
    name: "GCP HTTP(S) Load Balancer & Redis"
    technology: "Redis, GCP HTTP(S) Load Balancer"
    description: "Manages persistent WebSocket connections and session affinity."
relationships:
  - source: "API Gateway"
    destination: "Consultation Session Manager"
    description: "Initiates session commands [gRPC]"
  - source: "Consultation Session Manager"
    destination: "Bandwidth Adaptability Controller"
    description: "Evaluates QoS metrics [Internal Go Channel]"
  - source: "Bandwidth Adaptability Controller"
    destination: "Fallback Signaling Component"
    description: "Triggers fallback state [Internal Go Channel]"
  - source: "Regional Routing & Audit Interceptor"
    destination: "Consent & Audit Logger"
    description: "Forwards access events [gRPC]"
  - source: "Fallback Signaling Component"
    destination: "Client Applications"
    description: "Pushes fallback commands [WebSocket / HTTPS]"