level: component
scope: "Component diagram for the Regional Storage & Messaging container"
parentContainer:
  name: "Regional Storage & Messaging"
elements:
  - type: "component"
    name: "GCP Cloud SQL (PostgreSQL)"
    technology: "GCP Cloud SQL (PostgreSQL)"
    description: "Provides isolated regional relational storage with row-level security and append-only audit tables."
  - type: "component"
    name: "GCP Cloud Pub/Sub"
    technology: "GCP Cloud Pub/Sub with Dead-Letter Queues (DLQ)"
    description: "Handles asynchronous event streaming and offline queuing with 7-to-14-day retention for rural resilience."
  - type: "component"
    name: "GCP Cloud KMS"
    technology: "GCP Cloud KMS"
    description: "Enforces regional compliance via Customer-Managed Encryption Keys (europe-west3 and us-central1)."
  - type: "component"
    name: "Cloud Monitoring & Cloud Functions"
    technology: "Cloud Monitoring & Cloud Functions"
    description: "Automates operational alerts and DLQ monitoring for system reliability."
relationships:
  - source: "GCP Cloud SQL (PostgreSQL)"
    destination: "GCP Cloud KMS"
    description: "Encrypts regional data using region-specific keys"
  - source: "GCP Cloud Pub/Sub"
    destination: "Cloud Monitoring & Cloud Functions"
    description: "Triggers alerting payloads on DLQ threshold breaches"