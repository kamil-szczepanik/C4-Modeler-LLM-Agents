level: component
scope: "Component diagram for the Consent & Identity Container container"
parentContainer:
  name: "Consent & Identity Container"
elements:
  - type: "component"
    name: "Token Service"
    technology: "Keycloak / GCP Identity Platform"
    description: "Manages user tokens and authentication state."
  - type: "component"
    name: "Consent Engine"
    technology: "Java / Spring Boot"
    description: "Evaluates fine-grained consent policies for the platform."
  - type: "component"
    name: "Consent Ledger Service"
    technology: "Go / gRPC"
    description: "Provides high-throughput, low-latency audit logging for user consent history."
  - type: "component"
    name: "Federated Identity Broker"
    technology: "Keycloak SPI / OAuth2 Proxy"
    description: "Authenticates users via external IdPs."
  - type: "component"
    name: "IAM Database"
    technology: "GCP Cloud SQL - PostgreSQL"
    description: "Provides isolated regional databases to satisfy data residency requirements."
  - type: "component"
    name: "GCP Cloud KMS"
    technology: "GCP Cloud HSM"
    description: "Secures regional cryptographic keys to ensure tamper-evident audit trails."
relationships:
  - source: "API Gateway"
    destination: "Consent Engine"
    description: "Evaluates fine-grained consent policies [gRPC]"
  - source: "Client Apps"
    destination: "Federated Identity Broker"
    description: "Authenticates users via external IdPs [REST/HTTPS]"
  - source: "Client Apps"
    destination: "Consent Ledger Service"
    description: "Accesses user audit history [REST/HTTPS]"
  - source: "Token Service"
    destination: "GCP Cloud KMS"
    description: "Secures signing and hashing keys [GCP Internal API]"
  - source: "Consent Ledger Service"
    destination: "GCP Cloud KMS"
    description: "Secures signing and hashing keys [GCP Internal API]"