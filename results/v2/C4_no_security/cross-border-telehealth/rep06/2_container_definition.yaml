level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU/US)"
    description: "End-users accessing services via Patient Web/Mobile App."
  - type: "person"
    name: "Clinicians & Pharmacists (EU/US)"
    description: "Healthcare providers using the Clinician Portal."
  - type: "externalSystem"
    name: "Third-Party Video Infrastructure"
    description: "External video infrastructure for consultations."
  - type: "externalSystem"
    name: "AI LLM Provider"
    description: "External LLM provider powering the AI symptom checker."
  - type: "externalSystem"
    name: "National E-Prescription Gateways & US Pharmacy Networks"
    description: "External systems handling local prescriptions."
  - type: "container"
    name: "Patient Web/Mobile App"
    technology: "Flutter / WASM"
    description: "Allows patients to access telehealth services and the AI symptom checker."
  - type: "container"
    name: "Clinician Portal"
    technology: "React / TypeScript"
    description: "Allows healthcare providers to conduct consultations and manage patient records."
  - type: "container"
    name: "API Gateway"
    technology: "GCP Cloud Endpoints / API Gateway"
    description: "Routes regional traffic and validates OAuth2/JWT tokens."
  - type: "container"
    name: "Core Telehealth Service"
    technology: "Go / gRPC & REST"
    description: "Manages consultations and integrates with third-party video infrastructure."
  - type: "container"
    name: "Consent & Identity Container"
    technology: "Independent regional IAM instances"
    description: "Enforces data residency and granular consents."
  - type: "container"
    name: "AI Symptom Service"
    technology: "Python / FastAPI"
    description: "Interfaces with AI LLM Provider and logs versioned inputs/outputs."
  - type: "container"
    name: "E-Prescription Integrator"
    technology: "Java / Spring Boot"
    description: "Translates data to HL7 FHIR (US) and national standards (EU)."
  - type: "container"
    name: "Regional Storage & Messaging"
    technology: "GCP Cloud SQL (PostgreSQL) and Pub/Sub"
    description: "Provides isolated regional relational storage and event streaming."
  - type: "container"
    name: "Regional Cloud Storage"
    technology: "GCP Cloud Storage"
    description: "Region-locked storage for immutable AI audit logs."
relationships:
  - source: "Patients (EU/US)"
    destination: "API Gateway"
    description: "Accesses telehealth services via web/mobile app"
    technology: "HTTPS / WebSockets"
  - source: "Clinicians & Pharmacists (EU/US)"
    destination: "API Gateway"
    description: "Accesses clinician portal services"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Core Telehealth Service"
    description: "Routes regional traffic and validates tokens"
    technology: "gRPC / REST"
  - source: "API Gateway"
    destination: "AI Symptom Service"
    description: "Routes symptom check requests"
    technology: "gRPC / REST"
  - source: "API Gateway"
    destination: "Consent & Identity Container"
    description: "Authenticates requests and verifies consents"
    technology: "gRPC / REST"
  - source: "Core Telehealth Service"
    destination: "Third-Party Video Infrastructure"
    description: "Facilitates video consultations"
    technology: "WebRTC / HTTPS"
  - source: "Core Telehealth Service"
    destination: "E-Prescription Integrator"
    description: "Triggers e-prescription processing asynchronously"
    technology: "GCP Pub/Sub"
  - source: "Core Telehealth Service"
    destination: "Regional Storage & Messaging"
    description: "Reads and writes relational consultation data"
    technology: "PostgreSQL"
  - source: "AI Symptom Service"
    destination: "AI LLM Provider"
    description: "Sends diagnostic prompts and receives AI responses"
    technology: "HTTPS"
  - source: "AI Symptom Service"
    destination: "Regional Cloud Storage"
    description: "Writes versioned inputs and outputs for audit logs"
    technology: "HTTPS / Direct Write"
  - source: "E-Prescription Integrator"
    destination: "National E-Prescription Gateways & US Pharmacy Networks"
    description: "Sends standardized e-prescriptions"
    technology: "HTTPS / REST"
  - source: "E-Prescription Integrator"
    destination: "Regional Storage & Messaging"
    description: "Publishes and consumes prescription events"
    technology: "GCP Pub/Sub"