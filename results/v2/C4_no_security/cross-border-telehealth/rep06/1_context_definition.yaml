level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US while ensuring strict regional data residency and compliance."
elements:
  - type: "person"
    name: "Patients (EU/US)"
    description: "End-users accessing telehealth services, managing privacy consents, and utilizing the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals conducting remote video consultations and reviewing patient records."
  - type: "person"
    name: "Pharmacists (EU/US)"
    description: "Local providers receiving standards-compliant e-prescriptions."
  - type: "externalSystem"
    name: "Third-Party Video Infrastructure"
    description: "WebRTC/Twilio API for video consultations."
  - type: "externalSystem"
    name: "National E-Prescription Gateways & US Pharmacy Networks"
    description: "External systems handling local prescriptions."
  - type: "externalSystem"
    name: "AI LLM / Diagnostic Provider"
    description: "GCP Vertex AI powering the symptom checker."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service for cross-border transactions."
  - type: "externalSystem"
    name: "Identity Providers (IdP)"
    description: "OAuth2/OIDC providers for authentication (e.g., eIDAS)."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Twilio SendGrid/SMS API for reminders and alerts."
relationships:
  - source: "Patients (EU/US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses telehealth services, privacy consents, and AI symptom checker"
    technology: "HTTPS/WSS"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Conducts remote video consultations and reviews patient records"
    technology: "HTTPS/WSS"
  - source: "Cross-Border Telehealth Platform"
    destination: "National E-Prescription Gateways & US Pharmacy Networks"
    description: "Sends e-prescriptions (HL7 FHIR for US, national standards for EU)"
    technology: "HTTPS/REST"
  - source: "Cross-Border Telehealth Platform"
    destination: "AI LLM / Diagnostic Provider"
    description: "Powers the symptom checker and AI diagnostic features"
    technology: "gRPC/HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Payment Gateway"
    description: "Processes cross-border transactions"
    technology: "HTTPS/REST"
  - source: "Cross-Border Telehealth Platform"
    destination: "Notification Service"
    description: "Sends reminders and alerts"
    technology: "HTTPS/REST"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity Providers (IdP)"
    description: "Authenticates users via OAuth2/OIDC"
    technology: "HTTPS/REST"