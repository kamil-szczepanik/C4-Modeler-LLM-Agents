level: component
scope: "Component diagram for the Notification Container container"
parentContainer:
  name: "Notification Container"
elements:
  - type: "component"
    name: "Notification Router"
    technology: "Node.js (TypeScript)"
    description: "Routes notification requests and queries user channel settings."
  - type: "component"
    name: "Template Engine"
    technology: "Node.js (TypeScript)"
    description: "Renders notification templates for multi-channel outbound messaging."
  - type: "component"
    name: "Dispatcher Adapters"
    technology: "Node.js (TypeScript)"
    description: "Adapts and dispatches payloads to external delivery providers."
  - type: "component"
    name: "Delivery Status Tracker"
    technology: "Node.js (TypeScript)"
    description: "Tracks regional delivery status and retry queues."
  - type: "component"
    name: "User Notification Preferences"
    technology: "Node.js (TypeScript)"
    description: "Manages and stores user notification preferences."
relationships:
  - source: "Notification Router"
    destination: "User Notification Preferences"
    description: "Queries user channel settings [Local DB query]"