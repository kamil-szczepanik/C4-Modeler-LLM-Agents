level: component
scope: "Component diagram for the Consent Management container"
parentContainer:
  name: "Consent Management"
elements:
  - type: "component"
    name: "Consent API Controller"
    technology: "Node.js / Go"
    description: "Exposes endpoints to manage and verify consent permissions."
  - type: "component"
    name: "Consent Evaluation Engine"
    technology: "Node.js / Go"
    description: "Evaluates consent rules and queries compliance records."
  - type: "component"
    name: "Audit Logger & Ledger"
    technology: "WORM Cloud Storage / PostgreSQL"
    description: "Maintains immutable audit ledgers and compliance records."
  - type: "component"
    name: "Consent Pub/Sub Broker"
    technology: "Redis / Memorystore"
    description: "Broadcasts revocation events via RESP."
relationships:
  - source: "API Gateway"
    destination: "Consent API Controller"
    description: "Verifies permissions via gRPC"
  - source: "Consent Evaluation Engine"
    destination: "Consent Ledger"
    description: "Queries compliance records via internal gRPC"
  - source: "Consent Evaluation Engine"
    destination: "Consent Pub/Sub Broker"
    description: "Broadcasts revocation events via RESP"
  - source: "Core Telehealth Backend"
    destination: "Consent Pub/Sub Broker"
    description: "Subscribes to revocation events via RESP"