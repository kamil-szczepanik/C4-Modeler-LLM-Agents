level: component
scope: "Component diagram for the Core Telehealth Backend container"
parentContainer:
  name: "Core Telehealth Backend"
elements:
  - type: "component"
    name: "Prescription Orchestrator"
    technology: "Go"
    description: "Orchestrates e-prescription workflows and coordinates cross-border integration."
  - type: "component"
    name: "Audit Logging Interceptor"
    technology: "Node.js/Go"
    description: "Intercepts and records append-only immutable audit logs for compliance."
  - type: "component"
    name: "Integration Adapter"
    technology: "Go"
    description: "Connects the backend to external EU National e-Prescription Gateways and US Pharmacy Networks."
relationships:
  - source: "Prescription Orchestrator"
    destination: "Audit Logging Interceptor"
    description: "Records operational and compliance events"
  - source: "Prescription Orchestrator"
    destination: "Integration Adapter"
    description: "Dispatches regional e-prescriptions"