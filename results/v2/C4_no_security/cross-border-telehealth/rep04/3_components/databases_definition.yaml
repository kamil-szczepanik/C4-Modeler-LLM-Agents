level: component
scope: "Component diagram for the Databases container"
parentContainer:
  name: "Databases"
elements:
  - type: "component"
    name: "EU Clinical Database"
    technology: "Cloud SQL for PostgreSQL"
    description: "Stores EU patient records and logs in europe-west3 with strict regional data residency."
  - type: "component"
    name: "US Clinical Database"
    technology: "Cloud SQL for PostgreSQL"
    description: "Stores US patient records in us-central1."
  - type: "component"
    name: "Blob Storage"
    technology: "Cloud Storage"
    description: "Regional blob storage buckets with regional locking in europe-west3 and us-central1."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Handles connection pooling for high concurrency to the databases."
relationships:
  - source: "PgBouncer"
    destination: "EU Clinical Database"
    description: "Pools database connections for EU services via TLS 1.3"
  - source: "PgBouncer"
    destination: "US Clinical Database"
    description: "Pools database connections for US services via TLS 1.3"