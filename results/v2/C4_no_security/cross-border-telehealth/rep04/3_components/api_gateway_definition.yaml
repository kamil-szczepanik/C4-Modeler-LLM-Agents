level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing Engine"
    technology: "Envoy proxy"
    description: "Handles path-based gRPC routing and canary traffic splitting."
  - type: "component"
    name: "Auth/Policy Enforcer"
    technology: "Cloud Endpoints / Envoy extension"
    description: "Validates JWTs, regional claims, and consent headers to enforce regional data residency."
  - type: "component"
    name: "Rate Limiting / Idempotency Filter"
    technology: "Redis"
    description: "Enforces token buckets for rate limiting and maintains idempotency state for unstable connections."
  - type: "component"
    name: "Audit & Telemetry Interceptor"
    technology: "W3C Trace Context"
    description: "Captures W3C trace context, AI traceability logs, and anonymized metrics for regulatory auditability."
relationships:
  - source: "Routing Engine"
    destination: "Auth/Policy Enforcer"
    description: "Validates incoming traffic claims and headers [JWT / Policy Check]"
  - source: "Auth/Policy Enforcer"
    destination: "Rate Limiting / Idempotency Filter"
    description: "Checks token buckets and idempotency keys [Redis / gRPC]"
  - source: "Rate Limiting / Idempotency Filter"
    destination: "Audit & Telemetry Interceptor"
    description: "Forwards telemetry and trace context [W3C Trace Context]"