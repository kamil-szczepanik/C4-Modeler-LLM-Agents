level: component
scope: "Component diagram for the Billing & Subscriptions container"
parentContainer:
  name: "Billing & Subscriptions"
elements:
  - type: "component"
    name: "Subscription Engine"
    technology: "Go"
    description: "Manages recurring revenue and subscription lifecycles."
  - type: "component"
    name: "Payment Orchestrator"
    technology: "Go"
    description: "Handles secure payment processing and interacts with external payment gateways."
  - type: "component"
    name: "Tax & Invoicing Adapter"
    technology: "Go"
    description: "Manages regional taxes and invoicing compliance."
  - type: "component"
    name: "Invoice & Receipt Generator"
    technology: "Go"
    description: "Generates regional PDF invoices and receipts."
  - type: "component"
    name: "Webhook Handler"
    technology: "Go"
    description: "Processes asynchronous webhook events from external systems like Stripe."
relationships:
  - source: "API Gateway"
    destination: "Subscription Engine"
    description: "Invokes via gRPC"
  - source: "Payment Orchestrator"
    destination: "Stripe"
    description: "Processes payments via HTTPS (TLS 1.3)"
  - source: "Stripe"
    destination: "Webhook Handler"
    description: "Sends events via HTTPS / Webhooks (secured via GCP Secret Manager)"
  - source: "Subscription Engine"
    destination: "Invoice & Receipt Generator"
    description: "Triggers via gRPC / Async"
  - source: "Invoice & Receipt Generator"
    destination: "Cloud Storage"
    description: "Stores PDF invoices via Cloud Storage API (region-locked)"