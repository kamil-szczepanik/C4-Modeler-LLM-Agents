level: component
scope: "Component diagram for the AI Symptom Checker container"
parentContainer:
  name: "AI Symptom Checker"
elements:
  - type: "component"
    name: "Triage Orchestrator Service"
    technology: "Go"
    description: "Orchestrates symptom checks, coordinates triage flow, routes clinical handoffs, and manages transactional dual-write logging."
  - type: "component"
    name: "Inference Execution Engine"
    technology: "Python / PyTorch"
    description: "Powers medical NLP models and executes AI inference."
  - type: "component"
    name: "Localization & Normalization Component"
    technology: "Python"
    description: "Normalizes and localizes data for international compatibility under regional regulations."
  - type: "component"
    name: "Clinical Handoff Router"
    technology: "Go"
    description: "Routes clinical handoffs to human practitioners when necessary."
  - type: "component"
    name: "Audit Logging & Versioning Interceptor"
    technology: "Go"
    description: "Interprets and logs model versions and audit trails securely."
relationships:
  - source: "Triage Orchestrator Service"
    destination: "Localization & Normalization Component"
    description: "Sends data for localization via gRPC"
  - source: "Localization & Normalization Component"
    destination: "Inference Execution Engine"
    description: "Sends normalized data for inference via gRPC"
  - source: "Triage Orchestrator Service"
    destination: "Clinical Handoff Router"
    description: "Routes clinical escalations via Go internal function call"