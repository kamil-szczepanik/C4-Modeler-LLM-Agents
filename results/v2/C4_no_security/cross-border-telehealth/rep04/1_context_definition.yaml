level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "A cross-border telehealth platform providing video consultations, e-prescriptions, and an AI symptom checker for EU and US patients with regional data residency and regulatory compliance."
elements:
  - type: "person"
    name: "Patients (EU & US)"
    description: "Patients in the EU and US seeking video consultations, e-prescriptions, and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals providing video consultations and healthcare services to patients."
  - type: "externalSystem"
    name: "Pharmacies (EU & US)"
    description: "Pharmacies in the EU and US fulfilling e-prescriptions."
  - type: "externalSystem"
    name: "Identity Providers (Auth0 / GCP IAM)"
    description: "Handles secure authentication via OAuth2/OIDC."
  - type: "externalSystem"
    name: "National e-Prescription Gateways (EU) and US Pharmacy Networks"
    description: "Gateways and networks for transmitting prescriptions using REST and HL7 FHIR."
  - type: "externalSystem"
    name: "Payment Gateways (Stripe)"
    description: "Processes payments for consultations and platform services."
relationships:
  - source: "Patients (EU & US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Interacts with regional telehealth platforms for consultations and symptom checking"
    technology: "HTTPS/WebRTC"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Interacts with regional telehealth platforms to conduct consultations"
    technology: "HTTPS/WebRTC"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity Providers (Auth0 / GCP IAM)"
    description: "Authenticates users and manages access"
    technology: "OAuth2/OIDC"
  - source: "Cross-Border Telehealth Platform"
    destination: "National e-Prescription Gateways (EU) and US Pharmacy Networks"
    description: "Sends and manages e-prescriptions"
    technology: "REST / HL7 FHIR"
  - source: "Cross-Border Telehealth Platform"
    destination: "Pharmacies (EU & US)"
    description: "Fulfills prescriptions and coordinates pharmacy services"
    technology: "REST / HL7 FHIR"
  - source: "Cross-Border Telehealth Platform"
    destination: "Payment Gateways (Stripe)"
    description: "Processes financial transactions"
    technology: "HTTPS"