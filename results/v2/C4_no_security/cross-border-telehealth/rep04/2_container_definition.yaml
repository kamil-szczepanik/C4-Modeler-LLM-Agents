level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU & US)"
    description: "Patients in the EU and US seeking video consultations, e-prescriptions, and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals providing video consultations and healthcare services to patients."
  - type: "externalSystem"
    name: "Pharmacies"
    description: "External pharmacies fulfilling e-prescriptions."
  - type: "externalSystem"
    name: "Identity Providers (Auth0/GCP IAM)"
    description: "Handles secure authentication and identity management."
  - type: "externalSystem"
    name: "National e-Prescription Gateways"
    description: "Gateways for transmitting and managing e-prescriptions."
  - type: "externalSystem"
    name: "Stripe"
    description: "Payment gateway for processing financial transactions."
  - type: "externalSystem"
    name: "Twilio"
    description: "API for SMS and communication alerts."
  - type: "externalSystem"
    name: "SendGrid"
    description: "API for email notifications."
  - type: "container"
    name: "Web/Mobile Client"
    technology: "Flutter / React Native"
    description: "Client application providing user interfaces for patients and clinicians with offline-first local SQLite caching."
  - type: "container"
    name: "API Gateway"
    technology: "Cloud Endpoints / Envoy"
    description: "Routes internal traffic and handles mTLS and JWT validation."
  - type: "container"
    name: "Core Telehealth Backend"
    technology: "Node.js / Go"
    description: "Stateless microservice handling core telehealth business logic and e-prescriptions."
  - type: "container"
    name: "AI Symptom Checker"
    technology: "Containerized AI Service"
    description: "Provides AI-powered symptom checking for patients."
  - type: "container"
    name: "Consent Management"
    technology: "Containerized Service"
    description: "Manages user consents and regulatory compliance records."
  - type: "container"
    name: "Billing & Subscriptions"
    technology: "Go"
    description: "Manages billing, subscriptions, and integrations with payment gateways."
  - type: "container"
    name: "Notification Container"
    technology: "Containerized Service"
    description: "Triggers SMS, email, and push notifications via external APIs."
  - type: "container"
    name: "Video Media Server"
    technology: "Janus / WebRTC on GCE"
    description: "Handles secure video consultations and real-time media streaming."
  - type: "container"
    name: "TURN/STUN Relay Tier"
    technology: "WebRTC Relay"
    description: "Provides regional TURN/STUN relay services for video calls."
  - type: "container"
    name: "Databases"
    technology: "Cloud SQL PostgreSQL & Cloud Storage"
    description: "Provides region-locked, encrypted persistent data storage."
relationships:
  - source: "Patients (EU & US)"
    destination: "Web/Mobile Client"
    description: "Interacts via HTTPS and WebRTC for consultations and symptom checking"
    technology: "HTTPS / WebRTC"
  - source: "Licensed Clinicians"
    destination: "Web/Mobile Client"
    description: "Interacts via HTTPS and WebRTC to conduct consultations"
    technology: "HTTPS / WebRTC"
  - source: "Web/Mobile Client"
    destination: "API Gateway"
    description: "Communicates using mTLS and JWT validation"
    technology: "mTLS / JWT"
  - source: "API Gateway"
    destination: "Core Telehealth Backend"
    description: "Routes internal traffic via gRPC"
    technology: "gRPC"
  - source: "API Gateway"
    destination: "Consent Management"
    description: "Routes consent management traffic via gRPC"
    technology: "gRPC"
  - source: "API Gateway"
    destination: "AI Symptom Checker"
    description: "Routes symptom checking requests via gRPC"
    technology: "gRPC"
  - source: "API Gateway"
    destination: "Billing & Subscriptions"
    description: "Routes billing requests via gRPC"
    technology: "gRPC"
  - source: "API Gateway"
    destination: "Notification Container"
    description: "Routes notification requests via gRPC"
    technology: "gRPC"
  - source: "Core Telehealth Backend"
    destination: "National e-Prescription Gateways"
    description: "Communicates with EU/US national e-prescription gateways"
    technology: "HTTPS / REST"
  - source: "Core Telehealth Backend"
    destination: "Pharmacies"
    description: "Sends prescriptions to external pharmacies"
    technology: "HTTPS / REST"
  - source: "Notification Container"
    destination: "Twilio"
    description: "Triggers SMS and push alerts"
    technology: "HTTPS / API"
  - source: "Notification Container"
    destination: "SendGrid"
    description: "Triggers email alerts"
    technology: "HTTPS / API"
  - source: "Billing & Subscriptions"
    destination: "Stripe"
    description: "Integrates with Stripe API using regional keys"
    technology: "HTTPS / API"
  - source: "Web/Mobile Client"
    destination: "Video Media Server"
    description: "Connects for video consultation media streaming"
    technology: "WebRTC"
  - source: "Core Telehealth Backend"
    destination: "Databases"
    description: "Reads and writes health and user data"
    technology: "PostgreSQL / Cloud Storage"