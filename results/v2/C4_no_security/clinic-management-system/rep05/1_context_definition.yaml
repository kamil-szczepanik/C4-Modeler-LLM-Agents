level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid, edge-first healthcare platform that manages patient admissions, electronic medical records, scheduling, and billing for medium-sized hospitals and clinics."
elements:
  - type: "person"
    name: "Receptionists / Front Desk Staff"
    description: "Front desk staff managing patient admissions, scheduling, and front-office workflows."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals managing electronic medical records and clinical operations."
  - type: "person"
    name: "Billing Specialists"
    description: "Staff handling financial operations, billing, and insurance claims."
  - type: "person"
    name: "Compliance Officers"
    description: "Personnel ensuring regulatory adherence, HIPAA/GDPR compliance, and auditing."
  - type: "person"
    name: "Patients"
    description: "Healthcare consumers interacting with clinic services and the future Patient Portal."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing laboratory results and medical imaging."
  - type: "externalSystem"
    name: "Insurance Clearinghouses"
    description: "External entities processing insurance claims and financial clearing."
  - type: "externalSystem"
    name: "Enterprise Identity Provider"
    description: "Identity provider (Azure AD/Keycloak) managing authentication and authorization."
  - type: "externalSystem"
    name: "Patient Portal"
    description: "Future scope patient portal for self-service and patient engagement."
relationships:
  - source: "Receptionists / Front Desk Staff"
    destination: "Clinic Management System"
    description: "Accesses patient admissions and scheduling"
    technology: "HTTPS (TLS 1.3 Web UI)"
  - source: "Clinicians"
    destination: "Clinic Management System"
    description: "Manages electronic medical records and clinical workflows"
    technology: "HTTPS (TLS 1.3 Web UI)"
  - source: "Billing Specialists"
    destination: "Clinic Management System"
    description: "Processes billing and financial records"
    technology: "HTTPS (TLS 1.3 Web UI)"
  - source: "Compliance Officers"
    destination: "Clinic Management System"
    description: "Reviews audit logs and compliance data"
    technology: "HTTPS (TLS 1.3 Web UI)"
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Interacts with clinical services"
    technology: "HTTPS (TLS 1.3 Web UI)"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges lab orders and imaging data"
    technology: "HL7 FHIR over HTTPS (REST/JSON)"
  - source: "Clinic Management System"
    destination: "Insurance Clearinghouses"
    description: "Submits claims and processes insurance data"
    technology: "SFTP, X12 EDI, and REST APIs"
  - source: "Clinic Management System"
    destination: "Enterprise Identity Provider"
    description: "Authenticates users and manages identity"
    technology: "OIDC and SAML 2.0"