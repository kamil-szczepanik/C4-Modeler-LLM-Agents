level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Manages and optimizes database connection pooling for client services."
  - type: "component"
    name: "Database Engine"
    technology: "PostgreSQL 16"
    description: "Core relational database engine storing clinical, billing, and audit records."
  - type: "component"
    name: "HA & Failover Manager"
    technology: "Patroni with etcd"
    description: "Ensures high availability and automated failover for the database cluster."
  - type: "component"
    name: "Audit Logging Extension"
    technology: "pgAudit"
    description: "Provides detailed session and object audit logging for HIPAA and GDPR compliance."
  - type: "component"
    name: "Partitioning & Retention Manager"
    technology: "Declarative Partitioning"
    description: "Manages table partitioning and data retention policies for long-term storage requirements."
relationships:
  - source: "Connection Pooler"
    destination: "Database Engine"
    description: "Routes and multiplexes database connections"
  - source: "HA & Failover Manager"
    destination: "Database Engine"
    description: "Monitors and orchestrates cluster state and failover"
  - source: "Audit Logging Extension"
    destination: "Database Engine"
    description: "Captures audit log events from database operations"
  - source: "Partitioning & Retention Manager"
    destination: "Database Engine"
    description: "Maintains table partitions and enforces retention cycles"