level: component
scope: "Component diagram for the Redis Cluster container"
parentContainer:
  name: "Redis Cluster"
elements:
  - type: "component"
    name: "Redis Master Nodes"
    technology: "Redis 7.x"
    description: "Handling write operations via Raft-based consensus, native TLS 1.3 support, and low-latency EMR requirements."
  - type: "component"
    name: "Redis Replica Nodes / Cluster Replicas"
    technology: "Redis 7.x Replication"
    description: "Providing synchronous/asynchronous replication for failover and zero data loss."
  - type: "component"
    name: "Redis Active-Active (CRDT)"
    technology: "Redis CRDT"
    description: "Implemented for multi-master replication across the hybrid topology."
relationships:
  - source: "Redis Master Nodes"
    destination: "Redis Replica Nodes / Cluster Replicas"
    description: "Replicates data via internal cluster replication protocols to ensure zero data loss."