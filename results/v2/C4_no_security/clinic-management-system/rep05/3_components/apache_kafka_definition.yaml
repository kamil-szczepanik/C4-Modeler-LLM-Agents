level: component
scope: "Component diagram for the Apache Kafka container"
parentContainer:
  name: "Apache Kafka"
elements:
  - type: "component"
    name: "Apache Kafka Broker Cluster"
    technology: "KRaft mode, Strimzi Operator"
    description: "Delivers scalable event streaming with high availability on Kubernetes."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry, Avro/Protobuf"
    description: "Enforces schema validation and schema evolution."
  - type: "component"
    name: "Kafka Connect"
    technology: "Kafka Connect"
    description: "Connects Kafka data with external systems like PostgreSQL."
