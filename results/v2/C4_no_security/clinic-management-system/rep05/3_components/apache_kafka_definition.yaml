    name: "Kafka Interceptor"
    technology: "Kafka Interceptor"
    description: "Intercepts and processes message streams."
  - type: "component"
    name: "Kafka ACL & RBAC Authorizer"
    technology: "Apache Ranger"
    description: "Ensures strict data governance and RBAC security."
relationships:
  - source: "Schema Registry"
