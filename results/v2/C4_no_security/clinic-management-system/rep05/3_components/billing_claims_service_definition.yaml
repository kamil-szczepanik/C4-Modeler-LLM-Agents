level: component
scope: "Component diagram for the Billing & Claims Service container"
parentContainer:
  name: "Billing & Claims Service"
elements:
  - type: "component"
    name: "Billing Controller"
    technology: "Spring MVC / WebFlux"
    description: "Manages asynchronous and synchronous endpoints for billing operations."
  - type: "component"
    name: "Payment Gateway Module"
    technology: "Spring WebFlux"
    description: "Triggers payment processing."
  - type: "component"
    name: "Claim Generation & Scrubbing Engine"
    technology: "Spring Integration / Drools"
    description: "Powers the claim scrubbing engine and handles claim generation."
  - type: "component"
    name: "Payer Rule Management Component"
    technology: "Spring Data JPA / Redis"
    description: "Fetches active rules using low-latency rule evaluation."
  - type: "component"
    name: "Insurance Clearinghouse Adapter"
    technology: "Spring Cloud OpenFeign / Resilience4j"
    description: "Handles resilient external communication for submitting claims."
  - type: "component"
    name: "SPA Frontend"
    technology: "React, TypeScript, Nginx"
    description: "External frontend requesting billing data and operations."
  - type: "component"
    name: "External Insurance Clearinghouses"
    technology: "HTTPS / REST over TLS 1.3"
    description: "Receives submitted claims."
  - type: "component"
    name: "Apache Kafka"
    technology: "TCP event streaming"
    description: "Streams billing events and handles cache invalidation messaging."
  - type: "component"
    name: "PostgreSQL"
    technology: "PostgreSQL with Patroni"
    description: "Primary-replica relational data storage with AES-256 encryption at rest."
relationships:
  - source: "SPA Frontend"
    destination: "Billing Controller"
    description: "Requests billing data and operations [HTTPS / WSS]"
  - source: "Billing Controller"
    destination: "Payment Gateway Module"
    description: "Triggers payment processing [Synchronous REST / HTTPS]"
  - source: "Claim Generation & Scrubbing Engine"
    destination: "Payer Rule Management Component"
    description: "Fetches active rules [In-memory cache read / Redis]"
  - source: "Claim Generation & Scrubbing Engine"
    destination: "Insurance Clearinghouse Adapter"
    description: "Internal handoff [In-memory / Java Method]"
  - source: "Insurance Clearinghouse Adapter"
    destination: "External Insurance Clearinghouses"
    description: "Submits claims [HTTPS / REST over TLS 1.3]"
  - source: "Billing & Claims Service"
    destination: "Apache Kafka"
    description: "Streams billing events [TCP event streaming]"
  - source: "Billing & Claims Service"
    destination: "PostgreSQL"
    description: "Reads and writes billing data [TCP with AES-256 encryption at rest]"