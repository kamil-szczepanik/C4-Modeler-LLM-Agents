level: component
scope: "Component diagram for the Audit & Compliance Service container"
parentContainer:
  name: "Audit & Compliance Service"
elements:
  - type: "component"
    name: "Audit Event Ingestion Engine"
    technology: "Spring Integration Kafka"
    description: "Handles real-time audit streams with a Dead-Letter Queue."
  - type: "component"
    name: "Compliance Rules Engine"
    technology: "Drools / Java"
    description: "Policy evaluator for detecting EMR access anomalies and tenant-specific threshold alerts."
  - type: "component"
    name: "Audit Query & Reporting API"
    technology: "Spring MVC REST"
    description: "Serves compliance dashboards to the React SPA Frontend."
  - type: "component"
    name: "Retention & Archival Manager"
    technology: "Batch scheduler"
    description: "Enforces the >= 10-year data retention and WORM offloading policy."
  - type: "component"
    name: "Report Generation Service"
    technology: "Apache PDFBox / Thymeleaf"
    description: "Service for asynchronous generation of PDF/CSV compliance exports."
  - type: "component"
    name: "Object Storage Gateway"
    technology: "AWS S3 API"
    description: "Interface managing AWS S3 storage with Object Lock configuration."
  - type: "component"
    name: "PostgreSQL Database"
    technology: "Patroni-managed PostgreSQL"
    description: "Relational database with AES-256 encryption at rest."
  - type: "component"
    name: "EMR Core Service & Billing Service"
    technology: "gRPC over mTLS with eBPF routing"
    description: "External services sending audit events."
  - type: "component"
    name: "Apache Kafka"
    technology: "Event streaming backbone"
    description: "Streaming platform consumed by the ingestion engine."
  - type: "component"
    name: "SPA Frontend"
    technology: "React SPA"
    description: "Frontend interface displaying compliance dashboards and reports."
  - type: "component"
    name: "Object Storage"
    technology: "AWS S3 Object Lock"
    description: "WORM-compliant cloud object storage for aged logs."
relationships:
  - source: "EMR Core Service & Billing Service"
    destination: "Audit Event Ingestion Engine"
    description: "Sends audit events [gRPC over mTLS with eBPF routing]"
  - source: "Audit Event Ingestion Engine"
    destination: "Apache Kafka"
    description: "Consumes streaming audit events [TCP]"
  - source: "Audit Event Ingestion Engine"
    destination: "PostgreSQL Database"
    description: "Writes immutable logs [JDBC over TLS with AES-256]"
  - source: "Compliance Rules Engine"
    destination: "PostgreSQL Database"
    description: "Queries access patterns [JDBC over TLS with AES-256]"
  - source: "Audit Query & Reporting API"
    destination: "SPA Frontend"
    description: "Serves dashboard data [HTTPS]"
  - source: "Retention & Archival Manager"
    destination: "Object Storage Gateway"
    description: "Offloads aged logs to WORM storage [HTTPS / S3 API with SigV4]"
  - source: "Object Storage Gateway"
    destination: "Object Storage"
    description: "Manages WORM storage"
  - source: "Report Generation Service"
    destination: "SPA Frontend"
    description: "Delivers generated reports via download links [HTTPS]"