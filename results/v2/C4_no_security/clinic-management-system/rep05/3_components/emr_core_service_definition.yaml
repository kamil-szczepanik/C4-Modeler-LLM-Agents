level: component
scope: "Component diagram for the EMR Core Service container"
parentContainer:
  name: "EMR Core Service"
elements:
  - type: "component"
    name: "Clinical Data Controller"
    technology: "Spring Boot (Java)"
    description: "Handles incoming requests related to clinical data and EMR operations."
  - type: "component"
    name: "EMR Business Logic Engine"
    technology: "Spring Boot (Java)"
    description: "Executes core business rules, patient admissions logic, and scheduling workflows."
  - type: "component"
    name: "Audit Interceptor"
    technology: "Spring Boot (Java)"
    description: "Intercepts operations to capture and route audit events for compliance."
  - type: "component"
    name: "Data Access Repository"
    technology: "Spring Boot (Java), Resilience4j"
    description: "Manages data persistence, retrieval, and caching interactions with resilience patterns."
  - type: "component"
    name: "Clinical Notification Dispatcher"
    technology: "Spring Boot (Java)"
    description: "Dispatches clinical notifications and alerts via event streams."
  - type: "component"
    name: "FHIR Mapping & Interoperability Component"
    technology: "Spring Boot (Java)"
    description: "Maps internal models to FHIR standards for healthcare interoperability and lab/imaging handoffs."
relationships:
  - source: "Clinical Data Controller"
    destination: "EMR Business Logic Engine"
    description: "Delegates request processing"
  - source: "EMR Business Logic Engine"
    destination: "Data Access Repository"
    description: "Queries and persists data"
  - source: "EMR Business Logic Engine"
    destination: "Audit Interceptor"
    description: "Triggers compliance audit events"
  - source: "EMR Business Logic Engine"
    destination: "Clinical Notification Dispatcher"
    description: "Triggers event dispatch"
  - source: "EMR Business Logic Engine"
    destination: "FHIR Mapping & Interoperability Component"
    description: "Transforms clinical data to FHIR standards"
  - source: "Data Access Repository"
    destination: "PostgreSQL"
    description: "Relational storage [TCP with AES-256 encryption at rest]"
  - source: "Data Access Repository"
    destination: "Redis Cluster"
    description: "Caching layer [TCP with AES-256 encryption at rest]"
  - source: "Clinical Notification Dispatcher"
    destination: "Apache Kafka"
    description: "Event streaming and lab/imaging handoffs [TCP event streaming]"
  - source: "FHIR Mapping & Interoperability Component"
    destination: "Apache Kafka"
    description: "Event streaming and lab/imaging handoffs [TCP event streaming]"