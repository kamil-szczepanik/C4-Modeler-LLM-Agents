level: component
scope: "Component diagram for the Integration Gateway container"
parentContainer:
  name: "Integration Gateway"
elements:
  - type: "component"
    name: "Routing & Load Balancer Router"
    technology: "Spring Cloud Gateway"
    description: "Manages dynamic routing and rate limiting with high performance."
  - type: "component"
    name: "Protocol Translation Engine"
    technology: "Apache Camel"
    description: "Handles complex protocol translation between internal models and external FHIR standards."
  - type: "component"
    name: "Edge Security & Audit Interceptor"
    technology: "Spring Security, OpenTelemetry"
    description: "Enforces edge security and enables distributed tracing across the hybrid boundary."
  - type: "component"
    name: "Resilience & Circuit Breaker Manager"
    technology: "Resilience4j"
    description: "Provides circuit breakers and bulkheading for outbound routes."
  - type: "component"
    name: "Telemetry Publisher"
    technology: "OpenTelemetry"
    description: "Publishes telemetry data for distributed tracing and monitoring."
relationships:
  - source: "Routing & Load Balancer Router"
    destination: "Protocol Translation Engine"
    description: "Routes requests for translation [Internal Routing]"
  - source: "Protocol Translation Engine"
    destination: "Lab & Imaging Systems"
    description: "Exchanges lab orders and imaging data [HL7 FHIR APIs over HTTPS]"
  - source: "Protocol Translation Engine"
    destination: "Insurance Clearinghouses"
    description: "Exchanges insurance claims [HL7 FHIR APIs over HTTPS]"
  - source: "Protocol Translation Engine"
    destination: "Apache Kafka"
    description: "Publishes integration events [Async / Kafka Protocol]"
  - source: "Routing & Load Balancer Router"
    destination: "Redis Cluster"
    description: "Caches OAuth2 tokens and rate-limiting counters [Redis Protocol over TCP]"
  - source: "Edge Security & Audit Interceptor"
    destination: "Redis Cluster"
    description: "Validates tokens against cache [Redis Protocol over TCP]"
  - source: "Resilience & Circuit Breaker Manager"
    destination: "Protocol Translation Engine"
    description: "Protects outbound routes [Resilience4j]"