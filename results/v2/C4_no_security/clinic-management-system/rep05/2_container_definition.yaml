level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Receptionists"
    description: "Front desk staff managing patient admissions and scheduling."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals managing electronic medical records and clinical operations."
  - type: "person"
    name: "Billing Specialists"
    description: "Staff handling financial operations, billing, and insurance claims."
  - type: "person"
    name: "Compliance Officers"
    description: "Personnel ensuring regulatory adherence, HIPAA/GDPR compliance, and auditing."
  - type: "person"
    name: "Patients"
    description: "Healthcare consumers interacting with clinic services."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "External systems providing laboratory results and medical imaging."
  - type: "externalSystem"
    name: "Insurance Clearinghouses"
    description: "External entities processing insurance claims and financial clearing."
  - type: "externalSystem"
    name: "Enterprise IdP"
    description: "Identity provider managing authentication and authorization."
  - type: "externalSystem"
    name: "Patient Portal"
    description: "External portal for self-service and patient engagement."
  - type: "container"
    name: "SPA Frontend"
    technology: "React, TypeScript, Nginx"
    description: "Provides rapid UI rendering for users to interact with the system."
  - type: "container"
    name: "EMR Core Service"
    technology: "Spring Boot, Java"
    description: "Manages electronic medical records and sub-second clinical performance."
  - type: "container"
    name: "Billing & Claims Service"
    technology: "Spring Boot, Java"
    description: "Handles financial operations, billing, and insurance claims."
  - type: "container"
    name: "Audit & Compliance Service"
    technology: "Spring Boot, Java"
    description: "Ensures strict HIPAA/GDPR compliance and handles audit logging."
  - type: "container"
    name: "Integration Gateway"
    technology: "Apache Camel, Spring Cloud Gateway"
    description: "Facilitates HL7 FHIR APIs and interoperability with external systems."
  - type: "container"
    name: "PostgreSQL"
    technology: "PostgreSQL with Patroni, primary-replica"
    description: "Primary database for persistent healthcare data and state."
  - type: "container"
    name: "Redis Cluster"
    technology: "Redis Cluster"
    description: "Provides low-latency EMR caching and data integrity."
  - type: "container"
    name: "Apache Kafka"
    technology: "Apache Kafka"
    description: "Handles asynchronous event streaming across microservices."
relationships:
  - source: "Receptionists"
    destination: "SPA Frontend"
    description: "Accesses patient admissions and scheduling"
    technology: "HTTPS / WSS"
  - source: "Clinicians"
    destination: "SPA Frontend"
    description: "Manages electronic medical records and clinical workflows"
    technology: "HTTPS / WSS"
  - source: "Billing Specialists"
    destination: "SPA Frontend"
    description: "Processes billing and financial records"
    technology: "HTTPS / WSS"
  - source: "Compliance Officers"
    destination: "SPA Frontend"
    description: "Reviews audit logs and compliance data"
    technology: "HTTPS / WSS"
  - source: "Patients"
    destination: "SPA Frontend"
    description: "Interacts with clinical services"
    technology: "HTTPS / WSS"
  - source: "SPA Frontend"
    destination: "EMR Core Service"
    description: "Requests EMR data and operations"
    technology: "HTTPS / WSS"
  - source: "SPA Frontend"
    destination: "Billing & Claims Service"
    description: "Requests billing data and operations"
    technology: "HTTPS / WSS"
  - source: "SPA Frontend"
    destination: "Audit & Compliance Service"
    description: "Sends audit and compliance queries"
    technology: "HTTPS / WSS"
  - source: "EMR Core Service"
    destination: "Billing & Claims Service"
    description: "Communicates internal service workflows"
    technology: "gRPC over mTLS with eBPF routing"
  - source: "EMR Core Service"
    destination: "Audit & Compliance Service"
    description: "Sends audit events"
    technology: "gRPC over mTLS with eBPF routing"
  - source: "Billing & Claims Service"
    destination: "Audit & Compliance Service"
    description: "Sends audit events"
    technology: "gRPC over mTLS with eBPF routing"
  - source: "Integration Gateway"
    destination: "Lab & Imaging Systems"
    description: "Exchanges lab orders and imaging data"
    technology: "HL7 FHIR APIs over HTTPS"
  - source: "Integration Gateway"
    destination: "Insurance Clearinghouses"
    description: "Exchanges insurance claims"
    technology: "HL7 FHIR APIs over HTTPS"
  - source: "EMR Core Service"
    destination: "PostgreSQL"
    description: "Reads and writes relational data"
    technology: "TCP with AES-256 encryption at rest"
  - source: "Billing & Claims Service"
    destination: "PostgreSQL"
    description: "Reads and writes billing data"
    technology: "TCP with AES-256 encryption at rest"
  - source: "Audit & Compliance Service"
    destination: "PostgreSQL"
    description: "Stores audit logs"
    technology: "TCP with AES-256 encryption at rest"
  - source: "EMR Core Service"
    destination: "Redis Cluster"
    description: "Caches EMR data for low latency"
    technology: "TCP with AES-256 encryption at rest"
  - source: "EMR Core Service"
    destination: "Apache Kafka"
    description: "Streams clinical events"
    technology: "TCP event streaming"
  - source: "Billing & Claims Service"
    destination: "Apache Kafka"
    description: "Streams billing events"
    technology: "TCP event streaming"
  - source: "Audit & Compliance Service"
    destination: "Apache Kafka"
    description: "Streams audit events"
    technology: "TCP event streaming"