level: component
scope: "Component diagram for the Audit & Compliance Log Service container"
parentContainer:
  name: "Audit & Compliance Log Service"
elements:
  - type: "component"
    name: "Event Ingestion Engine"
    technology: "Go component"
    description: "Consumes security and access events from the event bus and forwards streaming events to the anomaly detection engine."
  - type: "component"
    name: "Compliance API Handler"
    technology: "Go component"
    description: "Handles compliance API requests routed from the edge container via internal mTLS."
  - type: "component"
    name: "Retention & Archival Worker"
    technology: "Go component"
    description: "Archives historical logs to object storage using TLS with WORM Compliance Mode."
  - type: "component"
    name: "Anomaly Detection & Alerting Engine"
    technology: "Go component"
    description: "Processes streaming events to detect anomalies and dispatches webhooks or alerts over HTTPS."
  - type: "component"
    name: "Edge Container"
    technology: "Kong / Envoy"
    description: "Routes requests to the Compliance API Handler and receives alerts."
  - type: "component"
    name: "Event Bus"
    technology: "Apache Kafka / RabbitMQ"
    description: "Provides reliable event streaming for security and access events."
  - type: "component"
    name: "MongoDB"
    technology: "MongoDB"
    description: "Stores active audit logs securely with AES-256 encryption at rest."
  - type: "component"
    name: "Object Storage"
    technology: "Encrypted S3-compatible Object Storage"
    description: "Enforces AWS Object Lock in Compliance Mode for tamper-proof 10-year data retention."
relationships:
  - source: "Edge Container"
    destination: "Compliance API Handler"
    description: "Routes requests via internal mTLS [gRPC and REST over mTLS]"
  - source: "Event Bus"
    destination: "Event Ingestion Engine"
    description: "Consumes security and access events [Apache Kafka]"
  - source: "Event Ingestion Engine"
    destination: "MongoDB"
    description: "Stores audit logs [TLS-encrypted connections]"
  - source: "Event Ingestion Engine"
    destination: "Anomaly Detection & Alerting Engine"
    description: "Forwards streaming events [Internal Go Channel]"
  - source: "Retention & Archival Worker"
    destination: "Object Storage"
    description: "Archives historical logs [TLS with WORM Compliance Mode]"
  - source: "Anomaly Detection & Alerting Engine"
    destination: "Edge Container"
    description: "Dispatches webhooks/alerts [HTTPS over TLS]"