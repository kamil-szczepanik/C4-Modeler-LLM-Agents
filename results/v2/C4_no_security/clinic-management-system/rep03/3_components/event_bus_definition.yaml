level: component
scope: "Component diagram for the Event Bus container"
parentContainer:
  name: "Event Bus"
elements:
  - type: "component"
    name: "Kafka Broker Cluster"
    technology: "Apache Kafka (KRaft Mode)"
    description: "Publishes and consumes domain events using Kafka Wire Protocol for asynchronous messaging."
  - type: "component"
    name: "Schema Registry"
    technology: "Avro"
    description: "Validates event schemas for microservices."
  - type: "component"
    name: "Kafka Connect"
    technology: "Debezium"
    description: "Handles change data capture (CDC) and reliable asynchronous messaging."
  - type: "component"
    name: "DLQ & Retry Router"
    technology: "Kafka Wire Protocol"
    description: "Forwards unprocessable events from the Kafka Broker Cluster."
  - type: "component"
    name: "Event Governance & Access Control Layer"
    technology: "Apache Ranger / mTLS"
    description: "Authenticates and authorizes operations for microservices interacting with the event bus."
relationships:
  - source: "Kafka Broker Cluster"
    destination: "DLQ & Retry Router"
    description: "Forwards unprocessable events [Kafka Wire Protocol]"