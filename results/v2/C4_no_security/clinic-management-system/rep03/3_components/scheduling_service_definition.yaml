level: component
scope: "Component diagram for the Scheduling Service container"
parentContainer:
  name: "Scheduling Service"
elements:
  - type: "component"
    name: "API Router Component"
    technology: "Express.js / Fastify"
    description: "Routes requests and handles initial entry into the Scheduling Service."
  - type: "component"
    name: "Booking Engine Component"
    technology: "Node.js / TypeScript"
    description: "Manages patient and resource bookings with real-time conflict prevention."
  - type: "component"
    name: "Availability Cache Component"
    technology: "Redis Cluster"
    description: "Acquires distributed locks and checks availability using Redlock."
  - type: "component"
    name: "Notification Dispatcher Component"
    technology: "Node.js"
    description: "Publishes domain events to the event bus for notifications and analytics."
relationships:
  - source: "API Router Component"
    destination: "Booking Engine Component"
    description: "Delegates requests [In-process TypeScript interfaces]"
  - source: "Booking Engine Component"
    destination: "Availability Cache Component"
    description: "Acquires distributed locks and checks availability [TCP with TLS, rediss://]"