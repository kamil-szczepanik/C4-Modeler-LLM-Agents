level: component
scope: "Component diagram for the Frontend Container container"
parentContainer:
  name: "Frontend Container"
elements:
  - type: "component"
    name: "Authentication & Session Manager"
    technology: "TypeScript, React"
    description: "Manages multi-factor authentication, OIDC/OAuth2 sessions, and user login state."
  - type: "component"
    name: "Role-Based Router & Shell"
    technology: "TypeScript, React"
    description: "Controls navigation and UI shells based on user personas and authorization."
  - type: "component"
    name: "Clinical EMR View Component"
    technology: "TypeScript, React"
    description: "Renders electronic medical records and interacts with local persistence."
  - type: "component"
    name: "API Client Layer"
    technology: "TypeScript, Fetch / Axios"
    description: "Handles outbound HTTPS/JSON requests to the Edge Container."
  - type: "component"
    name: "Local Persistence Manager"
    technology: "IndexedDB"
    description: "Reads and writes encrypted drafts and offline data securely."
  - type: "component"
    name: "Cryptographic Vault Manager"
    technology: "Web Crypto API"
    description: "Provides client-side encryption and security operations."
relationships:
  - source: "Clinical EMR View Component"
    destination: "Local Persistence Manager"
    description: "Reads/Writes encrypted drafts [IndexedDB / Web Crypto API]"