level: component
scope: "Component diagram for the Object Storage container"
parentContainer:
  name: "Object Storage"
elements:
  - type: "component"
    name: "Storage Gateway"
    technology: "Go / S3 API"
    description: "Uploads/retrieves EMR assets and coordinates storage operations."
  - type: "component"
    name: "Encryption & Key Management"
    technology: "Vault / AWS KMS"
    description: "Applies AES-256 encryption via Internal gRPC."
  - type: "component"
    name: "Lifecycle & Tiering Engine"
    technology: "Go / Custom Engine"
    description: "Manages automated tiering and WORM locking for retention."
  - type: "component"
    name: "Audit & Compliance Guardrail"
    technology: "Go / Internal gRPC"
    description: "Validates immutability policies and compliance guardrails."
relationships:
  - source: "Storage Gateway"
    destination: "Audit & Compliance Guardrail"
    description: "Validates immutability policies via Internal gRPC"
  - source: "Storage Gateway"
    destination: "Encryption & Key Management"
    description: "Applies AES-256 via Internal gRPC"
  - source: "Storage Gateway"
    destination: "Lifecycle & Tiering Engine"
    description: "Executes retention policies via Internal gRPC"