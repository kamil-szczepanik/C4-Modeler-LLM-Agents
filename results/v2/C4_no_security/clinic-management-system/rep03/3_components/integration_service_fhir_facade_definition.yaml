level: component
scope: "Component diagram for the Integration Service / FHIR Facade container"
parentContainer:
  name: "Integration Service / FHIR Facade"
elements:
  - type: "component"
    name: "FHIR API Gateway / Router"
    technology: "Go using Gin or Fiber"
    description: "Routes incoming API requests and handles protocol translation."
  - type: "component"
    name: "Resource Mapper & Validator"
    technology: "Go using go-fhir models"
    description: "Maps and validates clinical resources against FHIR standards."
  - type: "component"
    name: "Outbound/Inbound Client Pool"
    technology: "Go HTTP/gRPC Client"
    description: "Manages client connections for external communication."
  - type: "component"
    name: "DLQ Management Handler"
    technology: "Go background worker"
    description: "Handles dead-letter queue management and message reprocessing."
relationships:
  - source: "FHIR API Gateway / Router"
    destination: "Resource Mapper & Validator"
    description: "Internal function calls [Go structs]"
  - type: "component"
    name: "Resource Mapper & Validator"
    destination: "DLQ Management Handler"
    description: "Routes failed payloads"