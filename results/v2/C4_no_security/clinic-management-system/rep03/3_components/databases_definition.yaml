level: component
scope: "Component diagram for the Databases container"
parentContainer:
  name: "Databases"
elements:
  - type: "component"
    name: "Primary OLTP Store"
    technology: "PostgreSQL with Patroni"
    description: "Active-Passive hot standby cluster managed by Patroni for ACID compliance in billing and scheduling."
  - type: "component"
    name: "Document Store"
    technology: "MongoDB"
    description: "Replica set with immutable collections for EMR and audit trails."
  - type: "component"
    name: "In-Memory Cache"
    technology: "Redis"
    description: "Clustered in-memory cache with AOF/RDB persistence for sub-second EMR screen loads."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Connection pooling for resource management and availability."
relationships:
  - source: "Primary OLTP Store"
    destination: "Object Storage"
    description: "Pipes automated, daily snapshots for 10-year retention"
  - source: "Document Store"
    destination: "Object Storage"
    description: "Pipes automated, daily snapshots for 10-year retention"
  - source: "In-Memory Cache"
    destination: "Object Storage"
    description: "Pipes automated, daily snapshots for 10-year retention"