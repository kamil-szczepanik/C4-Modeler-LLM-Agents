level: component
scope: "Component diagram for the Billing Service container"
parentContainer:
  name: "Billing Service"
elements:
  - type: "component"
    name: "Claim Management Component"
    technology: "Drools rules engine"
    description: "Powers the automated claim validation rules engine."
  - type: "component"
    name: "Payment Processing Component"
    technology: "Resilience4j circuit breakers"
    description: "Processes claims and payments while preventing cascading failures during clearinghouse outages."
  - type: "component"
    name: "Billing API & Dashboard Component"
    technology: "Dual-datasource routing"
    description: "Manages financial data requests and executes dual-datasource routing."
  - type: "component"
    name: "Security & Authorization Interceptor"
    technology: "JWT/OAuth2 validation"
    description: "Handles security and authorization via JWT and OAuth2 validation."
relationships:
  - source: "Frontend Container"
    destination: "Billing API & Dashboard Component"
    description: "Requests financial data via gRPC and REST over mTLS"
  - source: "Claim Management Component"
    destination: "Apache Kafka"
    description: "Publishes asynchronous domain events via Transactional Outbox pattern"
  - source: "Payment Processing Component"
    destination: "Payment Gateway & Insurance Clearinghouse"
    description: "Processes claims and payments via TLS-encrypted REST/SOAP APIs"
  - source: "Billing API & Dashboard Component"
    destination: "PostgreSQL Database"
    description: "Executes strict ACID transactions and read-replica queries via TLS-encrypted connections (HikariCP)"