level: component
scope: "Component diagram for the Clinical Service container"
parentContainer:
  name: "Clinical Service"
elements:
  - type: "component"
    name: "EMR Management Component"
    technology: "Go"
    description: "Manages electronic medical records, ensuring sub-second P95 performance and HIPAA/GDPR compliance."
  - type: "component"
    name: "Patient Admission & Demographics Component"
    technology: "Go"
    description: "Handles patient admissions and demographic data processing."
  - type: "component"
    name: "Clinical Data Access Repository"
    technology: "Go, PostgreSQL, Redis"
    description: "Reads and writes clinical records and cache using TLS-encrypted PostgreSQL and Redis."
  - type: "component"
    name: "Audit & Event Publisher Component"
    technology: "Go, Apache Kafka / RabbitMQ"
    description: "Publishes asynchronous domain events and maintains comprehensive audit trails."
relationships:
  - source: "EMR Management Component"
    destination: "Clinical Data Access Repository"
    description: "Reads and writes clinical records and cache [TLS-encrypted PostgreSQL, Redis]"
  - source: "Patient Admission & Demographics Component"
    destination: "Clinical Data Access Repository"
    description: "Stores and retrieves patient demographic data [TLS-encrypted PostgreSQL, Redis]"
  - source: "Clinical Data Access Repository"
    destination: "Audit & Event Publisher Component"
    description: "Triggers data modification events"
  - source: "Audit & Event Publisher Component"
    destination: "Event Bus"
    description: "Publishes asynchronous domain events [Apache Kafka / RabbitMQ]"