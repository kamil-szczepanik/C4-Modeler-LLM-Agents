level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patient"
    description: "Receives care and interacts with the clinic system for admissions and scheduling."
  - type: "person"
    name: "Clinician / Doctor"
    description: "Medical professional who manages electronic medical records and clinical workflows."
  - type: "person"
    name: "Receptionist / Admin"
    description: "Staff member handling front-desk tasks, patient admissions, and scheduling."
  - type: "person"
    name: "Billing Specialist"
    description: "Manages financial transactions, billing, and insurance claims."
  - type: "person"
    name: "Compliance / IT Auditor"
    description: "Ensures regulatory compliance and system security standards."
  - type: "person"
    name: "Hospital Executive"
    description: "Reviews business analytics, reports, and high-level hospital performance."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "Third-party systems providing laboratory and medical imaging results."
  - type: "externalSystem"
    name: "Payment Gateway & Insurance Clearinghouse"
    description: "External services processing payments and insurance verifications."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Manages user authentication and multi-factor access control."
  - type: "externalSystem"
    name: "Business Analytics / Reporting Service"
    description: "Receives sanitized telemetry and metrics for analytics and reporting."
  - type: "container"
    name: "Frontend Container"
    technology: "TypeScript, React, Nginx/CDN"
    description: "Single Page Application for client-side rendering and user interaction."
  - type: "container"
    name: "Edge Container"
    technology: "Kong / Envoy"
    description: "API Gateway handling rate limiting, circuit breaking, and mTLS routing."
  - type: "container"
    name: "Clinical Service"
    technology: "Go"
    description: "High-performance backend service handling clinical workflows and EMR."
  - type: "container"
    name: "Scheduling Service"
    technology: "Node.js"
    description: "Backend service handling patient and resource scheduling."
  - type: "container"
    name: "Billing Service"
    technology: "Java / Spring Boot"
    description: "Robust transactional service handling financial billing and insurance claims."
  - type: "container"
    name: "Audit & Compliance Log Service"
    technology: "Go"
    description: "Backend service managing strict regulatory audit logs."
  - type: "container"
    name: "Integration Service / FHIR Facade"
    technology: "Go"
    description: "Backend service handling interoperability with external lab and imaging systems."
  - type: "container"
    name: "Event Bus"
    technology: "Apache Kafka / RabbitMQ"
    description: "Infrastructure container for asynchronous domain event publishing and decoupling."
  - type: "container"
    name: "Databases"
    technology: "PostgreSQL, MongoDB, Redis"
    description: "Data storage containers for transactional clinical/scheduling data, immutable audit logs, and caching."
  - type: "container"
    name: "Object Storage"
    technology: "Encrypted S3-compatible"
    description: "Tiered archiving and secure long-term object storage."
relationships:
  - source: "Patient"
    destination: "Frontend Container"
    description: "Accesses patient portal and scheduling"
    technology: "HTTPS / JSON"
  - source: "Clinician / Doctor"
    destination: "Frontend Container"
    description: "Accesses EMR and clinical workflows"
    technology: "HTTPS / JSON"
  - source: "Receptionist / Admin"
    destination: "Frontend Container"
    description: "Manages admissions and front-desk tasks"
    technology: "HTTPS / JSON"
  - source: "Billing Specialist"
    destination: "Frontend Container"
    description: "Manages financial transactions and billing"
    technology: "HTTPS / JSON"
  - source: "Compliance / IT Auditor"
    destination: "Frontend Container"
    description: "Reviews audit logs and system compliance"
    technology: "HTTPS / JSON"
  - source: "Hospital Executive"
    destination: "Frontend Container"
    description: "Views executive reports and dashboards"
    technology: "HTTPS / JSON"
  - source: "Frontend Container"
    destination: "Edge Container"
    description: "Sends API requests"
    technology: "HTTPS / JSON"
  - source: "Edge Container"
    destination: "Clinical Service"
    description: "Routes requests via internal mTLS"
    technology: "Internal gRPC and REST over mTLS"
  - source: "Edge Container"
    destination: "Scheduling Service"
    description: "Routes requests via internal mTLS"
    technology: "Internal gRPC and REST over mTLS"
  - source: "Edge Container"
    destination: "Billing Service"
    description: "Routes requests via internal mTLS"
    technology: "Internal gRPC and REST over mTLS"
  - source: "Edge Container"
    destination: "Audit & Compliance Log Service"
    description: "Routes requests via internal mTLS"
    technology: "Internal gRPC and REST over mTLS"
  - source: "Edge Container"
    destination: "Integration Service / FHIR Facade"
    description: "Routes requests via internal mTLS"
    technology: "Internal gRPC and REST over mTLS"
  - source: "Clinical Service"
    destination: "Event Bus"
    description: "Publishes asynchronous domain events"
    technology: "Apache Kafka / RabbitMQ"
  - source: "Scheduling Service"
    destination: "Event Bus"
    description: "Publishes asynchronous domain events"
    technology: "Apache Kafka / RabbitMQ"
  - source: "Billing Service"
    destination: "Event Bus"
    description: "Publishes asynchronous domain events"
    technology: "Apache Kafka / RabbitMQ"
  - source: "Audit & Compliance Log Service"
    destination: "Event Bus"
    description: "Publishes and consumes audit events"
    technology: "Apache Kafka / RabbitMQ"
  - source: "Integration Service / FHIR Facade"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges lab and imaging interoperability data"
    technology: "HL7 FHIR APIs"
  - source: "Billing Service"
    destination: "Payment Gateway & Insurance Clearinghouse"
    description: "Processes claims and payments"
    technology: "Secure REST/SOAP APIs"
  - source: "Edge Container"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OAuth 2.0 / OIDC with MFA"
  - source: "Audit & Compliance Log Service"
    destination: "Business Analytics / Reporting Service"
    description: "Publishes sanitized telemetry and metrics"
    technology: "Kafka / Debezium message streams"
  - source: "Clinical Service"
    destination: "Databases"
    description: "Reads and writes clinical data and cache"
    technology: "TLS-encrypted connections (PostgreSQL, Redis)"
  - source: "Scheduling Service"
    destination: "Databases"
    description: "Reads and writes scheduling data and cache"
    technology: "TLS-encrypted connections (PostgreSQL, Redis)"
  - source: "Billing Service"
    destination: "Databases"
    description: "Reads and writes billing data"
    technology: "TLS-encrypted connections (PostgreSQL)"
  - source: "Audit & Compliance Log Service"
    destination: "Databases"
    description: "Stores immutable audit logs"
    technology: "TLS-encrypted connections (MongoDB)"
  - source: "Clinical Service"
    destination: "Object Storage"
    description: "Archives long-term medical records"
    technology: "Encrypted S3-compatible APIs"