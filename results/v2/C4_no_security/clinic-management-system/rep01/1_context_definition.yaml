level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid healthcare platform providing patient registration, EMR, scheduling, billing, high availability, strict regulatory compliance, and seamless clinical interoperability."
elements:
  - type: "person"
    name: "Front Desk Receptionist"
    description: "Manages patient registration, check-in, and daily appointments."
  - type: "person"
    name: "Clinician/Doctor"
    description: "Accesses and updates Electronic Medical Records (EMR) and clinical notes."
  - type: "person"
    name: "Billing Specialist"
    description: "Processes patient billing and interacts with insurance clearinghouses."
  - type: "person"
    name: "Patient"
    description: "Receives care, notifications, and views personal health information."
  - type: "person"
    name: "Compliance Officer"
    description: "Monitors audit trails and ensures HIPAA/GDPR regulatory compliance."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing laboratory test results and medical imaging."
  - type: "externalSystem"
    name: "Insurance Clearinghouse APIs"
    description: "External APIs for processing insurance claims and verification."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Handles authentication and identity management using OIDC/SAML 2.0."
  - type: "externalSystem"
    name: "SMS/Email Notification Gateway"
    description: "External service for sending appointment reminders and notifications to patients."
  - type: "container"
    name: "On-Premises Kubernetes Cluster"
    description: "Edge infrastructure providing local survivability and local breakout."
  - type: "container"
    name: "AWS EU-Central-1 Cloud Services"
    description: "Cloud-hosted services providing regional scalability and enterprise telemetry."
  - type: "container"
    name: "Hybrid VPN / Direct Connect"
    description: "Secure network tunnel connecting the on-premises cluster to AWS cloud services."
  - type: "component"
    name: "Patient Registration Engine"
    description: "Manages intake and demographic details of patients."
  - type: "component"
    name: "Appointment Scheduling Service"
    description: "Handles clinic scheduling, doctor availability, and patient booking."
  - type: "component"
    name: "EMR Module with Audit Trail"
    description: "Manages electronic medical records and maintains immutable HIPAA/GDPR audit trails."
  - type: "component"
    name: "Billing Processor"
    description: "Calculates charges, generates invoices, and coordinates with insurance clearinghouses."
  - type: "component"
    name: "HL7 FHIR API Gateway"
    description: "Provides standardized clinical data exchange and external integrations."
relationships:
  - source: "Front Desk Receptionist"
    destination: "Clinic Management System"
    description: "Interacts with the platform for registration and scheduling"
    technology: "HTTPS, TLS 1.3"
  - source: "Clinician/Doctor"
    destination: "Clinic Management System"
    description: "Accesses patient EMR and clinical tools"
    technology: "HTTPS, TLS 1.3"
  - source: "Billing Specialist"
    destination: "Clinic Management System"
    description: "Manages billing and claims processing"
    technology: "HTTPS, TLS 1.3"
  - source: "Patient"
    destination: "Clinic Management System"
    description: "Accesses portal and receives notifications"
    technology: "HTTPS, TLS 1.3"
  - source: "Compliance Officer"
    destination: "Clinic Management System"
    description: "Monitors audit trails and regulatory compliance"
    technology: "HTTPS, TLS 1.3"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical data and lab results"
    technology: "HL7 FHIR REST API"
  - source: "Clinic Management System"
    destination: "Insurance Clearinghouse APIs"
    description: "Submits and verifies insurance claims"
    technology: "Secure REST / SFTP"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users and enforces MFA"
    technology: "OIDC / SAML 2.0"
  - source: "Clinic Management System"
    destination: "SMS/Email Notification Gateway"
    description: "Triggers automated patient notifications"
    technology: "HTTPS REST"