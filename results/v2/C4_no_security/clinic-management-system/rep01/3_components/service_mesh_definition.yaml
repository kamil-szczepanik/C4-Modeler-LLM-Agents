level: component
scope: "Component diagram for the Service Mesh container"
parentContainer:
  name: "Service Mesh"
elements:
  - type: "component"
    name: "Sidecar Proxy"
    technology: "Envoy"
    description: "Intercepts network traffic to and from services, enforcing mTLS and zero-trust policies."
  - type: "component"
    name: "Control Plane"
    technology: "Istiod"
    description: "Manages and configures the sidecar proxies within the service mesh."
  - type: "component"
    name: "Telemetry Collector"
    technology: "Prometheus / OpenTelemetry"
    description: "Gathers centralized metrics and trace spans for audit trails and monitoring."
  - type: "component"
    name: "Ingress/Egress Gateways"
    technology: "Envoy"
    description: "Manages traffic entering and leaving the hybrid cloud service mesh boundary."
  - type: "component"
    name: "Resilience & Policy Engine"
    technology: "Istio"
    description: "Provides automated circuit-breaking, traffic management, and security policies."
relationships:
  - source: "Sidecar Proxy"
    destination: "Control Plane"
    description: "Receives configuration and security policies"
  - source: "Sidecar Proxy"
    destination: "Telemetry Collector"
    description: "Sends metrics and trace spans via OTLP"
  - source: "Ingress/Egress Gateways"
    destination: "Sidecar Proxy"
    description: "Routes external and cross-network traffic securely"
  - source: "Resilience & Policy Engine"
    destination: "Sidecar Proxy"
    description: "Enforces resilience and security policies"