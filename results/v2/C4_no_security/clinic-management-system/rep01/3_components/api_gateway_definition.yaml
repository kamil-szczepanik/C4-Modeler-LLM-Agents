level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "JWT Validation Plugin"
    technology: "Kong/NGINX Plugin"
    description: "Validates OAuth2 JWT tokens issued by the External IdP."
  - type: "component"
    name: "Rate Limiting & Throttling Engine"
    technology: "Kong/NGINX Module"
    description: "Manages traffic rates and prevents abuse by enforcing throttling policies."
  - type: "component"
    name: "FHIR Request Validator"
    technology: "Custom Middleware"
    description: "Validates incoming healthcare data requests against FHIR standards."
  - type: "component"
    name: "Reverse Proxy Router"
    technology: "Kong/NGINX Router"
    description: "Routes validated traffic to internal microservices via gRPC over Istio mTLS."
  - type: "component"
    name: "Usage Analytics & Audit Logging Plugin"
    technology: "Kong/NGINX Plugin"
    description: "Collects usage analytics and generates audit logs for compliance."
  - type: "component"
    name: "Audit & Analytics Transporter"
    technology: "gRPC Client"
    description: "Offloads asynchronous logs to the Audit & Compliance Service via gRPC."
  - type: "component"
    name: "W3C Trace Context Injector"
    technology: "OpenTelemetry / Middleware"
    description: "Injects W3C trace context headers into incoming requests for distributed tracing."
relationships:
  - source: "JWT Validation Plugin"
    destination: "Reverse Proxy Router"
    description: "Passes authenticated requests"
  - source: "Rate Limiting & Throttling Engine"
    destination: "Reverse Proxy Router"
    description: "Enforces traffic limits on requests"
  - source: "FHIR Request Validator"
    destination: "Reverse Proxy Router"
    description: "Ensures structural validity of health data"
  - source: "Reverse Proxy Router"
    destination: "Usage Analytics & Audit Logging Plugin"
    description: "Triggers log creation"
  - source: "Usage Analytics & Audit Logging Plugin"
    destination: "Audit & Analytics Transporter"
    description: "Sends log payloads"
  - source: "W3C Trace Context Injector"
    destination: "Reverse Proxy Router"
    description: "Enriches requests with trace headers"