level: component
scope: "Component diagram for the Audit & Compliance Service container"
parentContainer:
  name: "Audit & Compliance Service"
elements:
  - type: "component"
    name: "Audit Event Ingestion Engine"
    technology: "Spring Boot / Reactive WebFlux"
    description: "Consumes audit streams and appends hot audit log entries."
  - type: "component"
    name: "Compliance Policy Evaluator"
    technology: "Python / Celery"
    description: "Evaluates compliance policies and dispatches real-time security alerts."
  - type: "component"
    name: "Report Generator & Redactor"
    technology: "Spring Boot"
    description: "Exposes Compliance Dashboard API and queries archived immutable logs."
  - type: "component"
    name: "Retention Management Worker"
    technology: "Python"
    description: "Migrates logs for 10-year retention."
  - type: "component"
    name: "Compliance Officer and System Administrator"
    technology: "User"
    description: "Primary users ensuring HIPAA and GDPR compliance."
  - type: "component"
    name: "Apache Kafka"
    technology: "Message Broker"
    description: "Decoupled event streaming and buffering."
  - type: "component"
    name: "PostgreSQL Clusters"
    technology: "PostgreSQL with AES-256"
    description: "Hot storage with 30-day active retention."
  - type: "component"
    name: "Object Storage (S3 / WORM)"
    technology: "AWS S3 with Object Lock"
    description: "Cold-tier storage ensuring tamper-proof 10-year retention."
  - type: "component"
    name: "SMS/Email Notification Gateway"
    technology: "External Gateway"
    description: "Dispatches real-time security alerts."
  - type: "component"
    name: "API Gateway"
    technology: "API Gateway"
    description: "Exposes compliance dashboard API."
  - type: "component"
    name: "Service Mesh"
    technology: "Service Mesh"
    description: "Streams asynchronous audit events."
relationships:
  - source: "Service Mesh"
    destination: "Apache Kafka"
    description: "Streams asynchronous audit events [gRPC over mTLS]"
  - source: "Audit Event Ingestion Engine"
    destination: "Apache Kafka"
    description: "Consumes audit streams [Kafka Protocol over mTLS]"
  - source: "Audit Event Ingestion Engine"
    destination: "PostgreSQL Clusters"
    description: "Appends hot audit log entries [SQL over TLS 1.3 / AES-256]"
  - source: "Compliance Policy Evaluator"
    destination: "SMS/Email Notification Gateway"
    description: "Dispatches real-time security alerts [HTTPS]"
  - source: "Report Generator & Redactor"
    destination: "API Gateway"
    description: "Exposes Compliance Dashboard API [gRPC]"
  - source: "Report Generator & Redactor"
    destination: "Object Storage (S3 / WORM)"
    description: "Queries archived immutable logs [HTTPS / S3 API]"
  - source: "Retention Management Worker"
    destination: "Object Storage (S3 / WORM)"
    description: "Migrates logs for 10-year retention [HTTPS / S3 API]"