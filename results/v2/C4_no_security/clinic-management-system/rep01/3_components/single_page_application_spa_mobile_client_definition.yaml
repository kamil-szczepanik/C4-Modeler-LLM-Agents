level: component
scope: "Component diagram for the Single-Page Application (SPA) / Mobile Client container"
parentContainer:
  name: "Single-Page Application (SPA) / Mobile Client"
elements:
  - type: "component"
    name: "Authentication & Session Manager"
    technology: "React / TypeScript, OAuth2/OIDC"
    description: "Manages user authentication, sessions, and security contexts."
  - type: "component"
    name: "EMR Workspace"
    technology: "React / TypeScript"
    description: "Provides the primary interface for clinicians to interact with patient records and clinical workflows."
  - type: "component"
    name: "Offline Sync Engine"
    technology: "IndexedDB, TypeScript"
    description: "Handles local data storage and synchronization for offline resilience."
  - type: "component"
    name: "API Client"
    technology: "Axios/Fetch wrapper"
    description: "Facilitates HTTP/REST and WebSocket communication with backend services."
  - type: "component"
    name: "Notification & Alert UI"
    technology: "React / TypeScript, WSS"
    description: "Displays real-time notifications and system alerts to users."
  - type: "component"
    name: "Feature Flag & RBAC Context Provider"
    technology: "React / TypeScript"
    description: "Manages role-based access control and feature toggles across the client application."
relationships:
  - source: "Notification & Alert UI"
    destination: "API Client"
    description: "Establishes persistent connection via WSS."
  - source: "EMR Workspace"
    destination: "API Client"
    description: "Fetches patient data via HTTPS / REST over JSON."