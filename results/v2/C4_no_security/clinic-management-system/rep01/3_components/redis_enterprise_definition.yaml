level: component
scope: "Component diagram for the Redis Enterprise container"
parentContainer:
  name: "Redis Enterprise"
elements:
  - type: "component"
    name: "Redis Core Engine"
    technology: "In-Memory Data Store"
    description: "Handles core in-memory data storage and caching."
  - type: "component"
    name: "Encryption & Security Module"
    technology: "OpenSSL/TLS 1.3 & AES-256"
    description: "Enforces mandatory in-transit and at-rest encryption to satisfy HIPAA and GDPR."
  - type: "component"
    name: "Cluster Manager & RBAC"
    technology: "Raft Consensus & RBAC"
    description: "Manages cluster coordination, access control, and security policies."
  - type: "component"
    name: "Active-Active CRDT Sync Engine"
    technology: "CRDTs"
    description: "Ensures active-active multi-master replication and partition tolerance."
  - type: "component"
    name: "Observability & Backup Sidecar"
    technology: "Prometheus"
    description: "Streams metrics for latency, memory, and cluster health monitoring."
  - type: "component"
    name: "Cache Invalidation & Purge Controller"
    technology: "Event-driven Purge Controller"
    description: "Performs event-driven data purging to ensure compliance."
  - type: "component"
    name: "Persistence & Active-Flash Engine"
    technology: "RocksDB"
    description: "Powers Active-Flash NVMe persistence for cost-effective cold data tiering."
  - type: "component"
    name: "Hybrid Network Gateway & VPN Tunnel Manager"
    technology: "IPsec / Encrypted Mesh Peering"
    description: "Manages hybrid network connectivity and VPN tunnels."
relationships:
  - source: "Patient & EMR Services"
    destination: "Encryption & Security Module"
    description: "Protocol: RESP over mTLS/TLS 1.3"
  - source: "Cache Invalidation & Purge Controller"
    destination: "Redis Core Engine"
    description: "Protocol: RESP"
  - source: "Redis Core Engine"
    destination: "Persistence & Active-Flash Engine"
    description: "Protocol: Encrypted local storage"
  - source: "Hybrid Network Gateway & VPN Tunnel Manager"
    destination: "AWS eu-central-1 and on-prem-k8s"
    description: "Protocol: IPsec / Encrypted mesh peering"