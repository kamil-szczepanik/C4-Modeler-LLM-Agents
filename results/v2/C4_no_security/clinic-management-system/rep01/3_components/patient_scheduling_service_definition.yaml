level: component
scope: "Component diagram for the Patient & Scheduling Service container"
parentContainer:
  name: "Patient & Scheduling Service"
elements:
  - type: "component"
    name: "Patient Management Component"
    technology: "Spring Webflux / Spring MVC"
    description: "Handles patient admissions and electronic medical records requests."
  - type: "component"
    name: "Scheduling Engine"
    technology: "Java domain-driven service"
    description: "Executes scheduling logic and manages transactions with PostgreSQL and Redis."
  - type: "component"
    name: "Notification Orchestrator"
    technology: "Spring Cloud Stream / Spring Integration"
    description: "Orchestrates and dispatches alerts via external notification gateways."
relationships:
  - source: "Patient Management Component"
    destination: "Scheduling Engine"
    description: "Coordinates scheduling workflows"
  - source: "Scheduling Engine"
    destination: "Notification Orchestrator"
    description: "Triggers notifications for appointments"