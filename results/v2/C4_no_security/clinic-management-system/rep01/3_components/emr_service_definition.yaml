level: component
scope: "Component diagram for the EMR Service container"
parentContainer:
  name: "EMR Service"
elements:
  - type: "component"
    name: "EMR API Controller"
    technology: "Python / FastAPI"
    description: "Handles incoming gRPC/REST requests and enforces schema validation."
  - type: "component"
    name: "Clinical Record Manager"
    technology: "Python / FastAPI"
    description: "Executes patient chart business logic and FHIR resource mapping."
  - type: "component"
    name: "Audit Interceptor"
    technology: "Python middleware"
    description: "Captures cryptographic hashes and immutable metadata for compliance."
  - type: "component"
    name: "Local EMR Cache Manager"
    technology: "Python / Redis-py"
    description: "Implements local-first read-through and write-behind caching patterns."
  - type: "component"
    name: "Data Access Layer / Repository"
    technology: "Python"
    description: "Manages database connectivity and failover recovery."
relationships:
  - source: "API Gateway"
    destination: "EMR API Controller"
    description: "gRPC over Istio mTLS"
  - source: "EMR API Controller"
    destination: "Clinical Record Manager"
    description: "In-memory function calls"
  - source: "Clinical Record Manager"
    destination: "Audit Interceptor"
    description: "Async event dispatch"
  - source: "Clinical Record Manager"
    destination: "Local EMR Cache Manager"
    description: "In-memory async calls"
  - source: "Local EMR Cache Manager"
    destination: "Redis Enterprise"
    description: "Encrypted Redis protocol over mTLS"
  - source: "Local EMR Cache Manager"
    destination: "PostgreSQL Clusters"
    description: "Pooled async SQL with write-behind sync"