level: component
scope: "Component diagram for the PostgreSQL Clusters container"
parentContainer:
  name: "PostgreSQL Clusters"
elements:
  - type: "component"
    name: "Primary Database Engine"
    technology: "PostgreSQL 16"
    description: "Primary database engine for relational clinical and billing data."
  - type: "component"
    name: "Read Replica Engine"
    technology: "PostgreSQL 16"
    description: "Read replica engine handling read queries and cross-region replication."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Connection pooling and smart read/write routing to reduce latency."
  - type: "component"
    name: "Distributed Consensus / Fencing Manager"
    technology: "etcd / Raft"
    description: "Distributed consensus and automated leader election for zero data loss."
  - type: "component"
    name: "WAL Archiver"
    technology: "pgBackRest"
    description: "Continuous backup and recovery supporting 10-year retention."
  - type: "component"
    name: "Kubernetes Operator"
    technology: "CloudNativePG / Crunchy Data"
    description: "Kubernetes operator managing hybrid database lifecycle and automated fencing."
relationships:
  - source: "Microservices"
    destination: "PgBouncer"
    description: "TCP / TLS 1.3"
  - source: "PgBouncer"
    destination: "Primary Database Engine"
    description: "TCP"
  - source: "PgBouncer"
    destination: "Read Replica Engine"
    description: "TCP"
  - source: "Primary Database Engine"
    destination: "Read Replica Engine"
    description: "Synchronous (on-prem) / Asynchronous (cross-region to eu-central-1)"
  - source: "Primary Database Engine"
    destination: "WAL Archiver"
    description: "FileSystem / S3 API"