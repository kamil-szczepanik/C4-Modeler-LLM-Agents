level: component
scope: "Component diagram for the Integration Service container"
parentContainer:
  name: "Integration Service"
elements:
  - type: "component"
    name: "API Gateway"
    technology: "Kong / NGINX, HTTPS / TLS 1.3"
    description: "Handles ingress traffic via HTTPS / TLS 1.3."
  - type: "component"
    name: "Service Mesh"
    technology: "Istio / Linkerd, gRPC over mTLS"
    description: "Provides secure service-to-service communication via gRPC over mTLS."
  - type: "component"
    name: "Message Routing & Transformation Engine"
    technology: "Spring Integration, Enterprise Integration Patterns"
    description: "Handles core routing and splitting using Enterprise Integration Patterns."
  - type: "component"
    name: "FHIR Adapter Component"
    technology: "Apache Camel, REST/FHIR components"
    description: "Transforming payloads into HL7 FHIR."
  - type: "component"
    name: "Dead Letter Queue (DLQ) Manager"
    technology: "RabbitMQ / Kafka, AES-256 encryption"
    description: "Capturing failed messages with AES-256 encryption."
  - type: "component"
    name: "Integration Health & Replay API Component"
    technology: "Spring Boot Actuator / Camel REST DSL"
    description: "Exposing endpoints for administrative dashboards."
  - type: "component"
    name: "Audit & Compliance Service"
    technology: "Spring Boot / Python"
    description: "Collecting immutable audit trails."
  - type: "component"
    name: "Integration Operations Widget"
    technology: "Web UI"
    description: "Allows administrators to query failure statuses and trigger replays."
  - type: "component"
    name: "External Lab & Imaging Systems"
    technology: "HL7 FHIR over HTTPS, TLS 1.3"
    description: "External systems receiving submitted clinical data."
relationships:
  - source: "API Gateway"
    destination: "Message Routing & Transformation Engine"
    description: "Ingests outbound integration requests [gRPC over Istio mTLS]"
  - source: "Message Routing & Transformation Engine"
    destination: "FHIR Adapter Component"
    description: "Dispatches formatted clinical payloads [In-memory]"
  - source: "FHIR Adapter Component"
    destination: "External Lab & Imaging Systems"
    description: "Submits clinical data [HL7 FHIR over HTTPS, TLS 1.3]"
  - source: "Message Routing & Transformation Engine"
    destination: "Dead Letter Queue (DLQ) Manager"
    description: "Offloads poisoned messages [AMQP / Kafka protocol]"
  - source: "Integration Operations Widget"
    destination: "Integration Health & Replay API Component"
    description: "Queries failure statuses and triggers replays [HTTPS / REST]"
  - source: "Integration Health & Replay API Component"
    destination: "Dead Letter Queue (DLQ) Manager"
    description: "Inspects and replays failed messages [AMQP / Kafka admin API]"
  - source: "Integration Health & Replay API Component"
    destination: "Audit & Compliance Service"
    description: "Emits immutable audit logs for manual replays [gRPC / mTLS]"