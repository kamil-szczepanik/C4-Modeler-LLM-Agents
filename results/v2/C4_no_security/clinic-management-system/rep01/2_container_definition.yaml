level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Front Desk Receptionist"
    description: "Manages patient registration, check-in, and daily appointments."
  - type: "person"
    name: "Clinician/Doctor"
    description: "Accesses and updates Electronic Medical Records (EMR) and clinical notes."
  - type: "person"
    name: "Billing Specialist"
    description: "Processes patient billing and interacts with insurance clearinghouses."
  - type: "person"
    name: "Patient"
    description: "Receives care, notifications, and views personal health information."
  - type: "person"
    name: "Compliance Officer"
    description: "Monitors audit trails and ensures HIPAA/GDPR regulatory compliance."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing laboratory test results and medical imaging."
  - type: "externalSystem"
    name: "Insurance Clearinghouse APIs"
    description: "External APIs for processing insurance claims and verification."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Handles authentication and identity management using OIDC/SAML 2.0."
  - type: "externalSystem"
    name: "SMS/Email Notification Gateway"
    description: "External service for sending appointment reminders and notifications to patients."
  - type: "container"
    name: "Single-Page Application (SPA) / Mobile Client"
    technology: "React / TypeScript, CDN"
    description: "Client-side interface for patients and staff."
  - type: "container"
    name: "API Gateway"
    technology: "Kong or NGINX, HTTPS / TLS 1.3"
    description: "Manages incoming traffic, routing, and edge security."
  - type: "container"
    name: "Service Mesh"
    technology: "Istio / Linkerd, gRPC over mTLS"
    description: "Manages service-to-service communication and security."
  - type: "container"
    name: "Patient & Scheduling Service"
    technology: "Spring Boot (Java) / Node.js"
    description: "Handles patient admissions and appointment scheduling."
  - type: "container"
    name: "EMR Service"
    technology: "Python / FastAPI / Go"
    description: "Manages Electronic Medical Records with high throughput."
  - type: "container"
    name: "Billing & Claims Service"
    technology: "Spring Boot / NestJS"
    description: "Manages billing, invoicing, and insurance claims."
  - type: "container"
    name: "Integration Service"
    technology: "Apache Camel / Spring Integration"
    description: "Handles interoperability with external clinical systems via HL7 FHIR."
  - type: "container"
    name: "Audit & Compliance Service"
    technology: "Spring Boot / Python"
    description: "Monitors audit logs and ensures regulatory compliance."
  - type: "container"
    name: "PostgreSQL Clusters"
    technology: "PostgreSQL, Active-Active, AES-256"
    description: "Primary persistent data storage."
  - type: "container"
    name: "Redis Enterprise"
    technology: "Redis, Distributed Caching"
    description: "Provides distributed caching and offline read resilience."
relationships:
  - source: "Front Desk Receptionist"
    destination: "Single-Page Application (SPA) / Mobile Client"
    description: "Uses for patient registration and check-in"
    technology: "HTTPS / WSS"
  - source: "Clinician/Doctor"
    destination: "Single-Page Application (SPA) / Mobile Client"
    description: "Uses to access and update EMR"
    technology: "HTTPS / WSS"
  - source: "Billing Specialist"
    destination: "Single-Page Application (SPA) / Mobile Client"
    description: "Uses to process patient billing"
    technology: "HTTPS / WSS"
  - source: "Patient"
    destination: "Single-Page Application (SPA) / Mobile Client"
    description: "Uses to view personal health information"
    technology: "HTTPS / WSS"
  - source: "Compliance Officer"
    destination: "Single-Page Application (SPA) / Mobile Client"
    description: "Uses to monitor audit trails"
    technology: "HTTPS / WSS"
  - source: "Single-Page Application (SPA) / Mobile Client"
    destination: "API Gateway"
    description: "Sends client requests"
    technology: "HTTPS / WSS"
  - source: "API Gateway"
    destination: "Patient & Scheduling Service"
    description: "Routes patient requests"
    technology: "gRPC over Istio mTLS"
  - source: "API Gateway"
    destination: "EMR Service"
    description: "Routes EMR requests"
    technology: "gRPC over Istio mTLS"
  - source: "API Gateway"
    destination: "Billing & Claims Service"
    description: "Routes billing requests"
    technology: "gRPC over Istio mTLS"
  - source: "API Gateway"
    destination: "Integration Service"
    description: "Routes integration requests"
    technology: "gRPC over Istio mTLS"
  - source: "API Gateway"
    destination: "Audit & Compliance Service"
    description: "Routes compliance requests"
    technology: "gRPC over Istio mTLS"
  - source: "Integration Service"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical data"
    technology: "HL7 FHIR over HTTPS"
  - source: "Billing & Claims Service"
    destination: "Insurance Clearinghouse APIs"
    description: "Submits and verifies claims"
    technology: "HTTPS"
  - source: "Patient & Scheduling Service"
    destination: "SMS/Email Notification Gateway"
    description: "Triggers notifications"
    technology: "HTTPS"
  - source: "Patient & Scheduling Service"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OAuth2 / OIDC"
  - source: "EMR Service"
