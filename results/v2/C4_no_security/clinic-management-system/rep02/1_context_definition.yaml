level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform managing patient admissions, EMRs, scheduling, and billing for clinical environments while ensuring HIPAA/GDPR compliance and 99.99% availability."
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who interact via web browsers and the mobile app to manage appointments and view records."
  - type: "person"
    name: "Clinical Staff"
    description: "Medical professionals who access and update Electronic Medical Records (EMRs) and patient schedules."
  - type: "person"
    name: "Administrative Staff"
    description: "Personnel responsible for managing patient admissions, scheduling, and front-desk operations."
  - type: "person"
    name: "Billing & Finance Officers"
    description: "Staff members handling patient billing, insurance claims, and financial transactions."
  - type: "person"
    name: "System/Compliance Administrators"
    description: "IT and compliance personnel managing system configurations, security, and auditing."
  - type: "externalSystem"
    name: "Web Browsers"
    description: "Client interface used by patients, staff, and administrators to access the system."
  - type: "externalSystem"
    name: "Patient Mobile App"
    description: "Mobile client application used by patients for on-the-go access."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing laboratory test results and medical imaging data."
  - type: "externalSystem"
    name: "Third-Party Payment Gateway & Insurance Clearinghouse"
    description: "External services processing financial transactions and insurance claims."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External authentication system handling Multi-Factor Authentication (MFA) and Enterprise SSO."
  - type: "externalSystem"
    name: "Audit & Compliance SIEM"
    description: "External system receiving immutable log streaming for security auditing and compliance."
relationships:
  - source: "Web Browsers"
    destination: "Clinic Management System"
    description: "Accesses web interactions and system features securely."
    technology: "HTTPS/TLS 1.3"
  - source: "Patient Mobile App"
    destination: "Clinic Management System"
    description: "Accesses mobile services and patient portal features securely."
    technology: "HTTPS/TLS 1.3"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users via Multi-Factor Authentication and Enterprise SSO."
    technology: "OAuth2/OIDC"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical data and lab results."
    technology: "HL7 FHIR REST APIs over HTTPS"
  - source: "Clinic Management System"
    destination: "Third-Party Payment Gateway & Insurance Clearinghouse"
    description: "Processes payments and insurance claims."
    technology: "Secure REST APIs over HTTPS"
  - source: "Clinic Management System"
    destination: "Audit & Compliance SIEM"
    description: "Streams immutable logs for compliance and monitoring."
    technology: "Secure syslog/HTTPS"