level: component
scope: "Component diagram for the Notification Worker container"
parentContainer:
  name: "Notification Worker"
elements:
  - type: "component"
    name: "Kafka Event Consumer"
    technology: "Go"
    description: "Subscribes to input event streams."
  - type: "component"
    name: "Preference & Routing Engine"
    technology: "Go"
    description: "Enforces PHI redaction and maps user preferences."
  - type: "component"
    name: "Template Engine Component"
    technology: "Go"
    description: "Renders localized templates using dynamic object storage."
  - type: "component"
    name: "Channel Dispatcher Adapters"
    technology: "Go"
    description: "Interfaces for SMTP and Twilio/APNS SDKs."
  - type: "component"
    name: "DLQ & Audit Router"
    technology: "Go"
    description: "Manages retry logic and failed message persistence."
relationships:
  - source: "Kafka Event Consumer"
    destination: "Preference & Routing Engine"
    description: "Consumes raw notification events"
  - source: "Preference & Routing Engine"
    destination: "Template Engine Component"
    description: "Maps user preferences and requests templates"
  - source: "Template Engine Component"
    destination: "Channel Dispatcher Adapters"
    description: "Sends rendered messages for dispatch"
  - source: "Channel Dispatcher Adapters"
    destination: "DLQ & Audit Router"
    description: "Routes failed deliveries to DLQ"