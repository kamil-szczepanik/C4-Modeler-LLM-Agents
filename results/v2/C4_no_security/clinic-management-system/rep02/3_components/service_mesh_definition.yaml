level: component
scope: "Component diagram for the Service Mesh container"
parentContainer:
  name: "Service Mesh"
elements:
  - type: "component"
    name: "Sidecar Proxy (Envoy)"
    technology: "Envoy"
    description: "High-performance proxy for sidecar and gateway duties ensuring low latency and secure mTLS communication."
  - type: "component"
    name: "Control Plane (Istiod)"
    technology: "Istio"
    description: "Configures Sidecar Proxies via gRPC/xDS for zero-trust security and traffic management."
  - type: "component"
    name: "Telemetry Collector"
    technology: "Prometheus & OpenTelemetry Collector"
    description: "Collects metrics and distributed tracing without PII leaks, exporting logs to Audit & Compliance SIEM."
  - type: "component"
    name: "Authorization Policy Engine"
    technology: "Istio Security"
    description: "Enforces strict zero-trust security and data encryption policies to satisfy HIPAA and GDPR mandates."
  - type: "component"
    name: "Ingress/Egress Gateway"
    technology: "Envoy Gateway / cert-manager"
    description: "Manages external traffic via HTTPS/TLS 1.3 and provides automated certificate rotation."
  - type: "component"
    name: "Clinical Services"
    technology: "Java / Spring Boot"
    description: "Provides patient admissions, EMR, and clinical domain processing."
  - type: "component"
    name: "Billing Services"
    technology: "Python / FastAPI"
    description: "Handles billing domain microservices backend processing."
  - type: "component"
    name: "PostgreSQL & Apache Kafka"
    technology: "PostgreSQL, Apache Kafka"
    description: "Data persistence and event streaming infrastructure."
relationships:
  - source: "Clinical Services"
    destination: "Sidecar Proxy (Envoy)"
    description: "Communicates via HTTP/gRPC over mTLS (TLS 1.3)"
  - source: "Billing Services"
    destination: "Sidecar Proxy (Envoy)"
    description: "Communicates via HTTP/gRPC over mTLS (TLS 1.3)"
  - source: "Control Plane (Istiod)"
    destination: "Sidecar Proxy (Envoy)"
    description: "Configures via gRPC/xDS"
  - source: "Telemetry Collector"
    destination: "Sidecar Proxy (Envoy)"
    description: "Exports logs to Audit & Compliance SIEM via HTTP/gRPC"
  - source: "Ingress/Egress Gateway"
    destination: "Sidecar Proxy (Envoy)"
    description: "Manages external traffic via HTTPS/TLS 1.3"