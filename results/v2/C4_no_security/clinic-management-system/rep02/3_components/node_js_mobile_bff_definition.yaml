level: component
scope: "Component diagram for the Node.js Mobile BFF container"
parentContainer:
  name: "Node.js Mobile BFF"
elements:
  - type: "component"
    name: "Route Handler / Controller"
    technology: "Node.js & Express.js"
    description: "Handles client requests from the Patient Mobile App and coordinates processing."
  - type: "component"
    name: "Security & Sanitization Middleware"
    technology: "Express.js Middleware"
    description: "Sanitizes inputs and ensures security compliance for incoming requests."
  - type: "component"
    name: "Session & Token Cache"
    technology: "Redis (ioredis)"
    description: "Validates tokens and manages distributed sessions with TLS support."
  - type: "component"
    name: "Aggregation & Transformation Service"
    technology: "Node.js"
    description: "Delegates and processes payload transformation for optimized mobile performance."
  - type: "component"
    name: "Telemetry Interceptor"
    technology: "OpenTelemetry"
    description: "Injects tracing context and captures latency metrics across boundaries."
  - type: "component"
    name: "API Gateway"
    technology: "Nginx / Kong"
    description: "Forwards downstream calls via gRPC over HTTP/2."
relationships:
  - source: "Patient Mobile App"
    destination: "Route Handler / Controller"
    description: "Sends client requests [HTTPS/OAuth2]"
  - source: "Route Handler / Controller"
    destination: "Security & Sanitization Middleware"
    description: "Passes incoming requests [In-memory]"
  - source: "Route Handler / Controller"
    destination: "Session & Token Cache"
    description: "Validates tokens and sessions [TCP/TLS via ioredis]"
  - source: "Route Handler / Controller"
    destination: "Aggregation & Transformation Service"
    description: "Delegates payload processing [In-memory]"
  - source: "Aggregation & Transformation Service"
    destination: "Telemetry Interceptor"
    description: "Injects tracing context [In-memory]"
  - source: "Telemetry Interceptor"
    destination: "API Gateway"
    description: "Forwards downstream calls [gRPC over HTTP/2]"