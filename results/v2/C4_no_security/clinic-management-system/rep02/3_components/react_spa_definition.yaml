level: component
scope: "Component diagram for the React SPA container"
parentContainer:
  name: "React SPA"
elements:
  - type: "component"
    name: "Auth & Session Manager"
    technology: "React Context, SessionStorage, Local Caching"
    description: "Manages user authentication sessions, form-state persistence, and local caching to optimize EMR load times and maintain compliance."
  - type: "component"
    name: "Routing & RBAC Guard"
    technology: "React Router, TypeScript"
    description: "Enforces strict role-based access control (RBAC) and routing for clinical, administrative, and billing staff."
  - type: "component"
    name: "API Client"
    technology: "OpenAPI, Fetch, WSS"
    description: "Handles low-latency REST communication via OpenAPI and real-time updates via WSS with the API Gateway."
  - type: "component"
    name: "Feature Modules"
    technology: "React, Component-based UI framework"
    description: "Includes Patient Registration UI, Appointment Scheduler, EMR Viewer & Editor, and Billing Console for daily clinic operations."
  - type: "component"
    name: "Telemetry & RUM Agent"
    technology: "Sentry, Real User Monitoring (RUM)"
    description: "Provides client-side error tracking and performance monitoring to ensure high availability and sub-second interactions."
relationships:
  - source: "Auth & Session Manager"
    destination: "Identity Provider (IdP)"
    description: "Authenticates via HTTPS (OAuth2 / OIDC with PKCE)"
  - source: "API Client"
    destination: "API Gateway"
    description: "Sends HTTPS / JSON (REST) requests and maintains WSS for real-time updates"
  - source: "React SPA"
    destination: "AWS CloudFront CDN"
    description: "Fetches static asset delivery via HTTPS"