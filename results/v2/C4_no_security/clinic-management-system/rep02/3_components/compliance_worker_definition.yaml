level: component
scope: "Component diagram for the Compliance Worker container"
parentContainer:
  name: "Compliance Worker"
elements:
  - type: "component"
    name: "Audit Log Ingestion"
    technology: "Python / Celery"
    description: "Consumes audit logs from Apache Kafka for compliance processing."
  - type: "component"
    name: "Retention Policy Engine"
    technology: "Python / Celery"
    description: "Manages data retention policies and schedules compliance jobs."
  - type: "component"
    name: "Tiered Storage Archiver"
    technology: "Python / Celery"
    description: "Writes archives to S3-compatible Tiered Storage using HTTPS / S3 API with WORM headers."
  - type: "component"
    name: "Report Generation"
    technology: "Python / Celery"
    description: "Generates compliance and audit reports."
relationships:
  - source: "Audit Log Ingestion"
    destination: "Retention Policy Engine"
    description: "Feeds ingested audit logs into"
  - source: "Retention Policy Engine"
    destination: "Tiered Storage Archiver"
    description: "Triggers archiving for expired data based on retention policies"
  - source: "Retention Policy Engine"
    destination: "Report Generation"
    description: "Provides data for"