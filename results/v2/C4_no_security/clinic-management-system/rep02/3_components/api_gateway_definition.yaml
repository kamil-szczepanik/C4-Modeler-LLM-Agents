level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "JWT/OAuth2 Validator"
    technology: "Kong/Nginx Plugin"
    description: "Validates JSON Web Tokens and OAuth2 credentials for incoming requests."
  - type: "component"
    name: "Rate Limiting & Throttling"
    technology: "Kong/Nginx Plugin"
    description: "Enforces traffic limits and prevents abuse using distributed Redis state."
  - type: "component"
    name: "Routing & Transform Engine"
    technology: "Kong/Nginx Configuration"
    description: "Routes inbound traffic to the appropriate backend services and transforms payloads."
  - type: "component"
    name: "Audit Logging Interceptor"
    technology: "Kong/Nginx Interceptor"
    description: "Captures and streams HIPAA audit events to the compliance SIEM."
  - type: "component"
    name: "Priority & Policy Engine"
    technology: "Kong/Nginx Custom Policy Plugin"
    description: "Ensures emergency clinical traffic is prioritized and never throttled by batch operations."
relationships:
  - source: "JWT/OAuth2 Validator"
    destination: "Routing & Transform Engine"
    description: "Passes authenticated requests to"
  - source: "Rate Limiting & Throttling"
    destination: "Routing & Transform Engine"
    description: "Applies traffic constraints to"
  - source: "Priority & Policy Engine"
    destination: "Routing & Transform Engine"
    description: "Applies priority rules to"
  - source: "Routing & Transform Engine"
    destination: "Audit Logging Interceptor"
    description: "Triggers audit logs for"