level: component
scope: "Component diagram for the Clinical Services container"
parentContainer:
  name: "Clinical Services"
elements:
  - type: "component"
    name: "Patient Registration"
    technology: "Java / Spring Boot"
    description: "Manages patient admissions and registration workflows."
  - type: "component"
    name: "Scheduling"
    technology: "Java / Spring Boot"
    description: "Handles appointments and scheduling workflows for healthcare facilities."
  - type: "component"
    name: "EMR Management"
    technology: "Java / Spring Boot"
    description: "Manages electronic medical records (EMR) and interacts with caching and encryption layers."
  - type: "component"
    name: "Event Publisher"
    technology: "Java / Spring Boot"
    description: "Publishes asynchronous domain events to the message broker."
  - type: "component"
    name: "Caching"
    technology: "Java / Spring Boot"
    description: "Handles caching operations for performance optimization."
relationships:
  - source: "EMR Management"
    destination: "Redis"
    description: "Caches clinical views via TCP over TLS."
  - source: "EMR Management"
    destination: "AWS KMS/HSM"
    description: "Retrieves cryptographic keys via HTTPS over mTLS."
  - source: "Event Publisher"
    destination: "Apache Kafka"
    description: "Publishes asynchronous domain events via TCP."
  - source: "Patient Registration"
    destination: "PostgreSQL"
    description: "Reads and writes clinical data via JDBC over TLS."
  - source: "Scheduling"
    destination: "PostgreSQL"
    description: "Reads and writes clinical data via JDBC over TLS."
  - source: "EMR Management"
    destination: "PostgreSQL"
    description: "Reads and writes clinical data via JDBC over TLS."