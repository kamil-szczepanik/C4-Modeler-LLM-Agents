level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "Operational Database Engine"
    technology: "PostgreSQL 16"
    description: "Relational database engine chosen for robust ACID compliance and advanced partitioning features."
  - type: "component"
    name: "Row-Level Security (RLS) Enforcer"
    technology: "PostgreSQL Extension"
    description: "Enforces data access policies at the row level for HIPAA/GDPR compliance."
  - type: "component"
    name: "Partition Manager"
    technology: "PostgreSQL Native Partitioning"
    description: "Manages data partitioning to decouple hot operational data from cold archival records."
  - type: "component"
    name: "CDC Outreach Publisher"
    technology: "Debezium"
    description: "Captures and publishes audit logs and event streams to Apache Kafka."
  - type: "component"
    name: "Encryption & Masking Module"
    technology: "PostgreSQL Native / Extension"
    description: "Encrypts and masks PHI for secure access by clinical services."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Connection pooling utility implemented to protect database resources under heavy clinical loads."
  - type: "component"
    name: "Tiered Storage"
    technology: "S3-compatible"
    description: "Cost-effective storage backend chosen to meet the >= 10 years data retention mandate."
relationships:
  - source: "Clinical Services"
    destination: "Encryption & Masking Module"
    description: "Queries encrypted/masked PHI [JDBC / TLS 1.3]"
  - source: "Billing Services"
    destination: "Operational Database Engine"
    description: "Reads and writes billing data [JDBC / TLS]"
  - source: "Partition Manager"
    destination: "Tiered Storage"
    description: "Offloads cold historical records [S3 API / HTTPS]"
  - source: "CDC Outreach Publisher"
    destination: "Apache Kafka"
    description: "Publishes audit logs and event streams [TCP / Kafka Wire Protocol]"