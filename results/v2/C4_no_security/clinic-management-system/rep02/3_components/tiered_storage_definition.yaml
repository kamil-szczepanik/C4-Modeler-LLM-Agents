level: component
scope: "Component diagram for the Tiered Storage container"
parentContainer:
  name: "Tiered Storage"
elements:
  - type: "component"
    name: "Archive Manager"
    technology: "Java / Spring Boot"
    description: "Handles ingestion, compression, and AES-256 client-side encryption."
  - type: "component"
    name: "Lifecycle Policy Engine"
    technology: "Java / Spring Boot"
    description: "Manages S3 object lifecycle rules and S3 Object Lock."
  - type: "component"
    name: "Retrieval & Hydration Service"
    technology: "Java / Spring Boot"
    description: "Executes accelerated S3 restores with a <5-minute SLA."
  - type: "component"
    name: "S3-Compatible Storage"
    technology: "S3-Compatible Storage / Glacier"
    description: "Provides secure, immutable cloud object storage."
  - type: "component"
    name: "Apache Kafka"
    technology: "Apache Kafka"
    description: "Transmits asynchronous event notifications."
  - type: "component"
    name: "Notification Worker"
    technology: "Java / Spring Boot"
    description: "Dispatches alerts to clinical staff upon hydration completion."
relationships:
  - source: "Compliance Worker"
    destination: "Archive Manager"
    description: "Pushes retention archives via gRPC / HTTPS"
  - source: "Retrieval & Hydration Service"
    destination: "S3-Compatible Storage"
    description: "Initiates accelerated restores via AWS SDK / HTTPS"
  - source: "Retrieval & Hydration Service"
    destination: "Apache Kafka"
    description: "Publishes DataHydratedEvent"
  - source: "Apache Kafka"
    destination: "Notification Worker"
    description: "Consumes hydration events"
  - source: "Notification Worker"
    destination: "UI/Clinician"
    description: "Pushes in-app or email alerts"