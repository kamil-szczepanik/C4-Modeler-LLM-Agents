level: component
scope: "Component diagram for the Billing Services container"
parentContainer:
  name: "Billing Services"
elements:
  - type: "component"
    name: "Eligibility Engine Component"
    technology: "Python / FastAPI"
    description: "Handles synchronous, real-time insurance checks with external clearinghouses."
  - type: "component"
    name: "Claim Processing Component"
    technology: "Python / FastAPI"
    description: "Manages claim assembly, submission (R-04), and tracking."
  - type: "component"
    name: "Ledger & Invoicing Component"
    technology: "Python / FastAPI"
    description: "Manages transactions, itemized statements, and exports."
  - type: "component"
    name: "Dispute & Reconciliation Component"
    technology: "Python / FastAPI"
    description: "Processes Kafka failure events, rejections, and audit states."
  - type: "component"
    name: "API Gateway"
    technology: "Envoy / Istio"
    description: "Routes requests via gRPC over mTLS into Billing Services."
  - type: "component"
    name: "Apache Kafka"
    technology: "Event Streaming Broker"
    description: "Asynchronous event streaming broker for claim lifecycles and failures."
  - type: "component"
    name: "PostgreSQL"
    technology: "Relational Database"
    description: "Primary relational database with AES-256 encryption at rest."
  - type: "component"
    name: "Third-Party Payment Gateway & Insurance Clearinghouse"
    technology: "External Financial System"
    description: "External financial system for payment and eligibility checks."
  - type: "component"
    name: "Notification Worker"
    technology: "Worker Service"
    description: "Triggered by Dispute & Reconciliation for failed claims."
relationships:
  - source: "API Gateway"
    destination: "Eligibility Engine Component"
    description: "Routes requests via gRPC over mTLS [Istio]"
  - source: "Eligibility Engine Component"
    destination: "Apache Kafka"
    description: "Publishes and consumes asynchronous events [TCP]"
  - source: "Claim Processing Component"
    destination: "PostgreSQL"
    description: "Reads and writes financial data [JDBC / TLS]"
  - source: "Eligibility Engine Component"
    destination: "Third-Party Payment Gateway & Insurance Clearinghouse"
    description: "Executes eligibility checks [REST over HTTPS]"
  - source: "Dispute & Reconciliation Component"
    destination: "Notification Worker"
    description: "Triggers alerts for failed claims"