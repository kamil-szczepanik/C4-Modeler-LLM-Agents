level: component
scope: "Component diagram for the HAPI FHIR Interoperability container"
parentContainer:
  name: "HAPI FHIR Interoperability"
elements:
  - type: "component"
    name: "FHIR REST Facade"
    technology: "Java / HAPI FHIR"
    description: "Exposes standard RESTful FHIR endpoints for inbound client and external system requests."
  - type: "component"
    name: "Validation Engine"
    technology: "Java"
    description: "Validates incoming and outgoing FHIR resources against structure definitions and profiles."
  - type: "component"
    name: "Data Transformation Engine"
    technology: "Java"
    description: "Transforms data formats and maps legacy models to compliant FHIR resources."
  - type: "component"
    name: "Consent Enforcement Interceptor"
    technology: "Java"
    description: "Enforces patient consent and privacy rules to ensure HIPAA/GDPR compliance on resource access."
  - type: "component"
    name: "Outbox Pattern Worker"
    technology: "Java"
    description: "Reliably publishes domain events to the message broker using the transactional outbox pattern."
relationships:
  - source: "FHIR REST Facade"
    destination: "Validation Engine"
    description: "Passes incoming payloads for structural and profile validation"
  - source: "FHIR REST Facade"
    destination: "Consent Enforcement Interceptor"
    description: "Queries access permissions and consent rules"
  - source: "Validation Engine"
    destination: "Data Transformation Engine"
    description: "Sends validated data for mapping and transformation"
  - source: "Data Transformation Engine"
    destination: "Outbox Pattern Worker"
    description: "Triggers event generation for persisted state changes"