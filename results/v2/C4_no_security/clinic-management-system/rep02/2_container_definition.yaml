level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who interact via web browsers and the mobile app to manage appointments and view records."
  - type: "person"
    name: "Clinical Staff"
    description: "Medical professionals who access and update Electronic Medical Records (EMRs) and patient schedules."
  - type: "person"
    name: "Administrative Staff"
    description: "Personnel responsible for managing patient admissions, scheduling, and front-desk operations."
  - type: "person"
    name: "Billing Officers"
    description: "Staff members handling patient billing, insurance claims, and financial transactions."
  - type: "person"
    name: "Compliance Administrators"
    description: "IT and compliance personnel managing system configurations, security, and auditing."
  - type: "externalSystem"
    name: "Web Browsers"
    description: "Client interface used by patients, staff, and administrators to access the system."
  - type: "externalSystem"
    name: "Patient Mobile App"
    description: "Mobile client application used by patients for on-the-go access."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "External systems providing laboratory test results and medical imaging data."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service processing financial transactions."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External authentication system handling Multi-Factor Authentication and Enterprise SSO."
  - type: "externalSystem"
    name: "SIEM"
    description: "External system receiving log streaming for security auditing and compliance."
  - type: "container"
    name: "React SPA"
    technology: "React"
    description: "Frontend single page application for web users."
  - type: "container"
    name: "Node.js Mobile BFF"
    technology: "Node.js / Express"
    description: "Backend-for-frontend service handling mobile client requests."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx / Kong"
    description: "Gateway handling routing, security, and traffic management."
  - type: "container"
    name: "Service Mesh"
    technology: "Istio / Linkerd"
    description: "Infrastructure layer managing internal service-to-service communication."
  - type: "container"
    name: "Clinical Services"
    technology: "Java / Spring Boot"
    description: "Core backend services handling patient registration, EMR, and scheduling."
  - type: "container"
    name: "Billing Services"
    technology: "Python / FastAPI"
    description: "Backend services handling billing and financial operations."
  - type: "container"
    name: "HAPI FHIR Interoperability"
    technology: "Java"
    description: "Interoperability service providing FHIR standards support."
  - type: "container"
    name: "Notification Worker"
    technology: "Go"
    description: "Worker service for handling asynchronous notifications."
  - type: "container"
    name: "Compliance Worker"
    technology: "Python"
    description: "Worker service handling compliance and long-term data retention."
  - type: "container"
    name: "PostgreSQL"
    technology: "PostgreSQL with AES-256 encryption"
    description: "Relational database for operational data."
  - type: "container"
    name: "Apache Kafka"
    technology: "Apache Kafka"
    description: "Event-driven messaging broker for asynchronous decoupling."
  - type: "container"
    name: "Tiered Storage"
    technology: "S3-compatible Storage"
    description: "Long-term tiered storage for data retention and compliance archives."
relationships:
  - source: "Web Browsers"
    destination: "API Gateway"
    description: "Sends user web requests"
    technology: "HTTPS/OAuth2"
  - source: "Patient Mobile App"
    destination: "Node.js Mobile BFF"
    description: "Sends mobile client requests"
    technology: "HTTPS/OAuth2"
  - source: "Node.js Mobile BFF"
    destination: "API Gateway"
    description: "Forwards aggregated mobile requests"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Clinical Services"
    description: "Routes requests via service mesh"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Billing Services"
    description: "Routes requests via service mesh"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "HAPI FHIR Interoperability"
    description: "Routes requests via service mesh"
    technology: "gRPC over mTLS"
  - source: "Clinical Services"
    destination: "Apache Kafka"
    description: "Publishes asynchronous events"
    technology: "TCP"
  - source: "Billing Services"
    destination: "Apache Kafka"
    description: "Publishes and consumes asynchronous events"
    technology: "TCP"
  - source: "Notification Worker"
    destination: "Apache Kafka"
    description: "Consumes event notifications"
    technology: "TCP"
  - source: "Clinical Services"
    destination: "PostgreSQL"
    description: "Reads and writes clinical data"
    technology: "JDBC / TLS"
  - source: "Billing Services"
    destination: "PostgreSQL"
    description: "Reads and writes billing data"
    technology: "JDBC / TLS"
  - source: "Billing Services"
    destination: "Payment Gateway"
    description: "Processes financial transactions"
    technology: "REST"
  - source: "HAPI FHIR Interoperability"
    destination: "Lab & Imaging Systems"
    description: "Exchanges clinical and lab data"
    technology: "HL7 FHIR / REST"
  - source: "Compliance Worker"
    destination: "Tiered Storage"
    description: "Stores long-term compliance archives"
    technology: "HTTPS with AES-256"
  - source: "Clinical Services"
    destination: "Identity Provider"
    description: "Authenticates tokens and sessions"
    technology: "OAuth2/OIDC"