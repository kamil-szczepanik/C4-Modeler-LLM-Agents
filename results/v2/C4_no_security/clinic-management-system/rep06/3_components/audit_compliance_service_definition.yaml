level: component
scope: "Component diagram for the Audit & Compliance Service container"
parentContainer:
  name: "Audit & Compliance Service"
elements:
  - type: "component"
    name: "Audit Event Ingestion Engine"
    technology: "Python / FastAPI / Pydantic"
    description: "Ingests audit events and validates data structures."
  - type: "component"
    name: "Immutable Storage Writer"
    technology: "SQLAlchemy / S3 SDK"
    description: "Writes audit logs to immutable storage for compliance."
  - type: "component"
    name: "Search & Indexing Engine"
    technology: "Elasticsearch / OpenSearch"
    description: "Provides sub-second search and indexing for audit logs."
  - type: "component"
    name: "Compliance Query & Reporting API"
    technology: "Python / FastAPI"
    description: "Serves queries and reporting for internal officers and external regulators."
  - type: "component"
    name: "Report & Cryptographic Export Generator"
    technology: "Python / ReportLab / Celery / Redis"
    description: "Generates cryptographic export reports via asynchronous background processing."
  - type: "component"
    name: "Storage Tier"
    technology: "WORM Object Storage with S3 Object Lock and Glacier Deep Archive"
    description: "Cryptographically secure 10-year data retention storage."
  - type: "component"
    name: "Key Management"
    technology: "HashiCorp Vault / AWS KMS"
    description: "Secure cryptographic key management for digital signatures."
relationships:
  - source: "EMR & Scheduling Service"
    destination: "Audit Event Ingestion Engine"
    description: "gRPC / Apache Kafka"
  - source: "Audit Event Ingestion Engine"
    destination: "Search & Indexing Engine"
    description: "REST API / Bulk"
  - source: "Audit Event Ingestion Engine"
    destination: "Immutable Storage Writer"
    description: "S3 API"
  - source: "Compliance Query & Reporting API"
    destination: "Search & Indexing Engine"
    description: "REST API"
  - source: "Report & Cryptographic Export Generator"
    destination: "Storage Tier"
    description: "S3 API"
  - source: "Report & Cryptographic Export Generator"
    destination: "Key Management"
    description: "HTTPS / KMS API"