level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Broker Cluster"
    technology: "Apache Kafka Core"
    description: "Handles core event streaming and durability for decoupled microservices."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry"
    description: "Enforces data contracts and event schema validation across published events."
  - type: "component"
    name: "MirrorMaker 2 Engine"
    technology: "MirrorMaker 2"
    description: "Replicates encrypted topic streams over mutual TLS (mTLS) across the hybrid boundary to AWS MSK / Cloud Broker."
  - type: "component"
    name: "Prometheus JMX Exporter"
    technology: "Prometheus JMX Exporter"
    description: "Exports metrics from the message broker cluster for monitoring and observability."
  - type: "component"
    name: "Dead Letter Queues (DLQ)"
    technology: "Apache Kafka Topic"
    description: "Captures unprocessable or failed messages for error handling and analysis."
relationships:
  - source: "EMR & Scheduling Service / Billing Service"
    destination: "Broker Cluster"
    description: "Publishes events via TLS 1.3 using Kafka TCP Protocol (SASL_SSL)"
  - source: "Broker Cluster"
    destination: "Schema Registry"
    description: "Validates event schemas"
  - source: "Broker Cluster"
    destination: "MirrorMaker 2 Engine"
    description: "Streams topics for cross-boundary replication"
  - source: "Broker Cluster"
    destination: "Prometheus JMX Exporter"
    description: "Exposes broker metrics"
  - source: "Broker Cluster"
    destination: "Dead Letter Queues (DLQ)"
    description: "Routes failed message processing attempts"