level: component
scope: "Component diagram for the Billing Service container"
parentContainer:
  name: "Billing Service"
elements:
  - type: "component"
    name: "Invoice Controller"
    technology: "Spring MVC"
    description: "Handles REST/gRPC endpoints, invoice generation, and dispute workflows."
  - type: "component"
    name: "Claim Processor"
    technology: "Spring Batch / Integration"
    description: "Manages claim generation and batch submission."
  - type: "component"
    name: "Payment Gateway Client"
    technology: "Spring Cloud OpenFeign / Resilience4j"
    description: "Manages external communication with circuit breakers for external communication."
  - type: "component"
    name: "Dispute Manager"
    technology: "Spring Service"
    description: "Handles partial refunds and dispute tracking."
  - type: "component"
    name: "Audit Publisher"
    technology: "Spring Cloud Stream"
    description: "Emits immutable audit events."
  - type: "component"
    name: "Billing Data Repository"
    technology: "Spring Data JPA / Hibernate"
    description: "Interacts with PostgreSQL for data persistence."
relationships:
  - source: "API Gateway / Reverse Proxy"
    destination: "Invoice Controller"
    description: "Routes API requests [gRPC / REST]"
  - source: "Claim Processor"
    destination: "Message Broker"
    description: "Publishes ClaimSubmittedEvent [Apache Kafka]"
  - source: "Payment Gateway Client"
    destination: "Insurance/Payer Gateways"
    description: "Submissions and processing [HTTPS / REST / EDI X12]"
  - source: "Audit Publisher"
    destination: "Message Broker"
    description: "Publishes FinancialAuditLogEvent [Apache Kafka]"
  - source: "Dispute Manager"
    destination: "Billing Data Repository"
    description: "Persists dispute states [JPA / JDBC]"