level: component
scope: "Component diagram for the Integration & Interoperability Service container"
parentContainer:
  name: "Integration & Interoperability Service"
elements:
  - type: "component"
    name: "FHIR Translation Engine"
    technology: "Camel Routes Component"
    description: "Translates and processes health data into FHIR format."
  - type: "component"
    name: "HL7 v2/v3 Adapter"
    technology: "MLLP/TCP Component"
    description: "Handles legacy HL7 v2/v3 communication over MLLP/TCP."
  - type: "component"
    name: "Data Anonymization & Security Filter"
    technology: "Spring Security Component"
    description: "Enforces token-based OAuth2 validation and data anonymization for compliance."
  - type: "component"
    name: "Resilience & DLQ Handler"
    technology: "Resilience4j / Kafka Client Component"
    description: "Provides circuit breakers and handles dead-letter queues to prevent cascading timeouts."
relationships:
  - source: "FHIR Translation Engine"
    destination: "Message Broker"
    description: "Consumes/produces events [Apache Kafka / AMQP]"
  - source: "Data Anonymization & Security Filter"
    destination: "Audit & Compliance Service"
    description: "Offloads audit trails asynchronously [Apache Kafka]"
  - source: "Integration & Interoperability Service"
    destination: "Lab/Imaging Systems"
    description: "Exchanges health data [HTTPS/FHIR or MLLP/TCP]"
  - source: "Integration & Interoperability Service"
    destination: "Message Broker"
    description: "Publishes dead-letter and telemetry events [Kafka]"