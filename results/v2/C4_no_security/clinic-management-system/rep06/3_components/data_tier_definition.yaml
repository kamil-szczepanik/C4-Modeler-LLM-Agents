level: component
scope: "Component diagram for the Data Tier container"
parentContainer:
  name: "Data Tier"
elements:
  - type: "component"
    name: "Primary Relational DB Cluster"
    technology: "PostgreSQL"
    description: "Active-passive synchronous replication with automated fencing for secure, reliable transactional data storage."
  - type: "component"
    name: "Audit & Compliance WORM Store"
    technology: "AWS S3 Object Lock / MinIO"
    description: "WORM Object Storage with AES-256 encryption at rest to guarantee immutable 10-year data retention."
  - type: "component"
    name: "Change Data Capture Component"
    technology: "Debezium"
    description: "Real-time change data capture to decouple microservices without impacting read/write latencies."
  - type: "component"
    name: "Connection Pooling Component"
    technology: "PgBouncer"
    description: "Manages database connections for the EMR and scheduling service."
  - type: "component"
    name: "Automated PITR & Backup Controller"
    technology: "Kubernetes / Custom Controller"
    description: "Handles automated point-in-time recovery and database backups."
relationships:
  - source: "EMR & Scheduling Service"
    destination: "Connection Pooling Component"
    description: "TCP/SQL via PgBouncer (TLS 1.3)"
  - source: "Connection Pooling Component"
    destination: "Primary Relational DB Cluster"
    description: "TCP/SQL (TLS 1.3)"
  - source: "Primary Relational DB Cluster"
    destination: "Change Data Capture Component"
    description: "TCP (Database Replication Log Stream)"
  - source: "Change Data Capture Component"
    destination: "Message Broker"
    description: "TCP"
  - source: "Primary Relational DB Cluster"
    destination: "Audit & Compliance WORM Store"
    description: "HTTPS (S3 API) via WAL Archiver"