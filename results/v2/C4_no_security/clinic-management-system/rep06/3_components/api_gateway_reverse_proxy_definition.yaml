level: component
scope: "Component diagram for the API Gateway / Reverse Proxy container"
parentContainer:
  name: "API Gateway / Reverse Proxy"
elements:
  - type: "component"
    name: "Routing & Load Balancing Engine"
    technology: "Envoy"
    description: "Handles high-performance routing and load balancing of incoming traffic to internal microservices."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Envoy / OIDC / OAuth2"
    description: "Validates user identity and permissions via the External Identity Provider."
  - type: "component"
    name: "Rate Limiting & Throttling Module"
    technology: "Envoy / Redis"
    description: "Enforces rate limits and request throttling using Redis cache."
  - type: "component"
    name: "Audit & Telemetry Interceptor"
    technology: "Envoy"
    description: "Intercepts requests and forwards telemetry and audit data to the Audit & Compliance Service."
  - type: "component"
    name: "Tenant Quota & Policy Enforcer"
    technology: "Envoy"
    description: "Enforces tenant quotas and security policies across system interactions."
relationships:
  - source: "Routing & Load Balancing Engine"
    destination: "EMR & Scheduling Service"
    description: "Routes requests via gRPC / REST"
  - source: "Routing & Load Balancing Engine"
    destination: "Billing Service"
    description: "Routes requests via gRPC / REST"
  - source: "Authentication & Authorization Filter"
    destination: "External IdP"
    description: "Authenticates users via OIDC / OAuth2"
  - source: "Rate Limiting & Throttling Module"
    destination: "Redis Cache"
    description: "Queries rate limits via Redis Protocol / TLS"
  - source: "Audit & Telemetry Interceptor"
    destination: "Audit & Compliance Service"
    description: "Sends audit telemetry via gRPC"