level: component
scope: "Component diagram for the Clinical Web/Mobile App container"
parentContainer:
  name: "Clinical Web/Mobile App"
elements:
  - type: "component"
    name: "State & Local Storage Manager"
    technology: "Redux Toolkit / WatermelonDB with encrypted SQLite"
    description: "Manages state and local storage with offline resilience and AES-256 encryption."
  - type: "component"
    name: "Auth & Session Guard Component"
    technology: "OpenID Connect / JWT SDK"
    description: "Handles authentication, session security, and clears local encrypted cache upon timeout."
  - type: "component"
    name: "Clinical Workspace Module"
    technology: "React / React Native components"
    description: "Provides clinical and administrative UI features for workspace operations."
  - type: "component"
    name: "Telemetry & Error Boundary Component"
    technology: "Sentry SDK / React Error Boundaries"
    description: "Captures error boundaries and forwards scrubbed crash reports and performance metrics."
relationships:
  - source: "Clinical Workspace Module"
    destination: "API Gateway / Reverse Proxy"
    description: "Fetches and submits clinical data [HTTPS/REST]"
  - source: "Telemetry & Error Boundary Component"
    destination: "API Gateway / Reverse Proxy"
    description: "Forwards scrubbed crash reports and performance metrics [HTTPS/POST]"
  - source: "State & Local Storage Manager"
    destination: "Clinical Workspace Module"
    description: "Hydrates UI state [In-Memory]"
  - source: "Auth & Session Guard Component"
    destination: "State & Local Storage Manager"
    description: "Clears local encrypted cache upon session timeout [In-Memory]"