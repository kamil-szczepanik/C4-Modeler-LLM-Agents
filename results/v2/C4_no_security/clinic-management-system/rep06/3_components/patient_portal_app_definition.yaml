level: component
scope: "Component diagram for the Patient Portal App container"
parentContainer:
  name: "Patient Portal App"
elements:
  - type: "component"
    name: "Authentication Controller"
    technology: "NextAuth.js / OpenID Connect Client"
    description: "Manages secure login and multi-factor authentication."
  - type: "component"
    name: "Appointment & Scheduling UI Module"
    technology: "React components"
    description: "Handles self-service visit booking and resource clash visibility."
  - type: "component"
    name: "EMR Viewer Module"
    technology: "React components"
    description: "Renders medical records and lab results with data masking."
  - type: "component"
    name: "Billing & Payments Interface"
    technology: "React components"
    description: "Handles secure online payments and claim statuses."
  - type: "component"
    name: "Accessibility & Design System Module"
    technology: "React"
    description: "Enforces WCAG 2.1 AA compliance across all views."
  - type: "component"
    name: "Telemetry & Client Monitoring Agent"
    technology: "OpenTelemetry SDK"
    description: "Collects OpenTelemetry traces and RUM performance metrics."
  - type: "component"
    name: "Patients"
    technology: "Human / End-user"
    description: "Primary end-users accessing healthcare information and services."
  - type: "component"
    name: "Enterprise Identity Provider (IdP)"
    technology: "OIDC / OAuth2"
    description: "Validates credentials and issues JWT."
  - type: "component"
    name: "API Gateway / Reverse Proxy"
    technology: "Reverse Proxy"
    description: "Routes requests to backend services."
  - type: "component"
    name: "Global CDN"
    technology: "AWS CloudFront / Vercel Edge"
    description: "Delivers static assets and executes edge caching/routing."
relationships:
  - source: "Patients"
    destination: "Patient Portal App"
    description: "Manages healthcare information and scheduling [HTTPS]"
  - source: "Authentication Controller"
    destination: "Enterprise Identity Provider (IdP)"
    description: "Validates credentials & issues JWT [OIDC/HTTPS]"
  - source: "Appointment & Scheduling UI Module"
    destination: "API Gateway / Reverse Proxy"
    description: "Fetches domain data [HTTPS/REST]"
  - source: "EMR Viewer Module"
    destination: "API Gateway / Reverse Proxy"
    description: "Fetches domain data [HTTPS/REST]"
  - source: "Billing & Payments Interface"
    destination: "API Gateway / Reverse Proxy"
