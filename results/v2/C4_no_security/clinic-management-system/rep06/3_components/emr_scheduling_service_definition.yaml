level: component
scope: "Component diagram for the EMR & Scheduling Service container"
parentContainer:
  name: "EMR & Scheduling Service"
elements:
  - type: "component"
    name: "API Gateway / Reverse Proxy"
    technology: "NGINX / Envoy"
    description: "Routes incoming client requests to internal services."
  - type: "component"
    name: "Security & RBAC Middleware"
    technology: "JWT/OAuth2 enforcement layer"
    description: "Enforces security and role-based access control."
  - type: "component"
    name: "Patient Admission Component"
    technology: "NestJS demographic management module"
    description: "Manages patient admissions and demographic information."
  - type: "component"
    name: "Scheduling Engine Component"
    technology: "Redis-backed appointment and clash-check module"
    description: "Handles appointments and performs clash checks."
  - type: "component"
    name: "EMR Core Component"
    technology: "CQRS-pattern clinical records module"
    description: "Manages clinical records using the CQRS pattern."
  - type: "component"
    name: "Notification Event Publisher"
    technology: "Kafka event dispatch module"
    description: "Dispatches notification events to message brokers."
  - type: "component"
    name: "Outbox Pattern Handler"
    technology: "Transactional messaging component"
    description: "Ensures reliable transactional messaging without dual-write risks."
  - type: "component"
    name: "Data Tier"
    technology: "PostgreSQL with read-replicas and WORM Object Storage"
    description: "Persists relational data and audit trails."
  - type: "component"
    name: "Message Broker"
    technology: "Apache Kafka"
    description: "Provides reliable asynchronous messaging."
relationships:
  - source: "API Gateway / Reverse Proxy"
    destination: "Security & RBAC Middleware"
    description: "Routes requests [gRPC / REST over TLS 1.3]"
  - source: "Security & RBAC Middleware"
    destination: "Scheduling Engine Component"
    description: "Invokes internal methods [In-Memory]"
  - source: "Security & RBAC Middleware"
    destination: "EMR Core Component"
    description: "Invokes internal methods [In-Memory]"
  - source: "EMR Core Component"
    destination: "Data Tier"
    description: "Queries and persists records [SQL/TypeORM over TLS 1.3]"
  - source: "Scheduling Engine Component"
    destination: "Message Broker"
    description: "Emits appointment mutation events [Kafka/Async]"
  - source: "Notification Event Publisher"
    destination: "Integration Service"
    description: "Dispatches notification payloads [gRPC]"