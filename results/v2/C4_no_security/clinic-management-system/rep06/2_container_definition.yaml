level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "End users who interact with the system for scheduling and managing their healthcare information."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals who access and update Electronic Medical Records (EMRs) and patient admissions."
  - type: "person"
    name: "Administrative Staff"
    description: "Personnel responsible for clinic operations, scheduling, and general management within the system."
  - type: "person"
    name: "Billing Officers"
    description: "Staff members handling financial transactions, billing, and claims processing."
  - type: "externalSystem"
    name: "Insurance Gateways"
    description: "External systems for processing medical claims and insurance verifications."
  - type: "externalSystem"
    name: "Lab/Imaging Systems"
    description: "External systems providing laboratory results and medical imaging data."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system responsible for user authentication and authorization."
  - type: "container"
    name: "API Gateway / Reverse Proxy"
    technology: "NGINX / Envoy"
    description: "Entry point managing incoming traffic, routing requests, and enforcing security policies."
  - type: "container"
    name: "Clinical Web/Mobile App"
    technology: "React / React Native"
    description: "Provides interfaces for clinicians to manage patient admissions and EMRs."
  - type: "container"
    name: "Patient Portal App"
    technology: "Next.js"
    description: "Provides patients with web access to scheduling and healthcare information."
  - type: "container"
    name: "EMR & Scheduling Service"
    technology: "Node.js / NestJS"
    description: "Handles domain logic execution for patient admissions, electronic medical records, and scheduling."
  - type: "container"
    name: "Billing Service"
    technology: "Java / Spring Boot"
    description: "Ensures robust transactional integrity for financial operations and billing."
  - type: "container"
    name: "Integration & Interoperability Service"
    technology: "Apache Camel / Spring Boot"
    description: "Connects internal services with external systems like lab and imaging systems."
  - type: "container"
    name: "Audit & Compliance Service"
    technology: "Python / FastAPI"
    description: "Tracks and enforces regulatory compliance and auditing across operations."
  - type: "container"
    name: "Data Tier"
    technology: "PostgreSQL with WORM Object Storage"
    description: "Provides primary transactional data storage with AES-256 encryption at rest."
  - type: "container"
    name: "Message Broker"
    technology: "Apache Kafka"
    description: "Handles asynchronous event-driven decoupling of billing workloads and system events."
relationships:
  - source: "Clinicians"
    destination: "Clinical Web/Mobile App"
    description: "Accesses clinical features and patient records"
    technology: "HTTPS/WSS"
  - source: "Administrative Staff"
    destination: "Clinical Web/Mobile App"
    description: "Accesses administrative features and scheduling"
    technology: "HTTPS/WSS"
  - source: "Patients"
    destination: "Patient Portal App"
    description: "Manages healthcare information and scheduling"
    technology: "HTTPS"
  - source: "Clinical Web/Mobile App"
    destination: "API Gateway / Reverse Proxy"
    description: "Sends requests to backend services"
    technology: "HTTPS/WSS"
  - source: "Patient Portal App"
    destination: "API Gateway / Reverse Proxy"
    description: "Sends requests to backend services"
    technology: "HTTPS"
  - source: "API Gateway / Reverse Proxy"
    destination: "EMR & Scheduling Service"
    description: "Routes API requests"
    technology: "gRPC / REST"
  - source: "API Gateway / Reverse Proxy"
    destination: "Billing Service"
    description: "Routes API requests"
    technology: "gRPC / REST"
  - source: "API Gateway / Reverse Proxy"
    destination: "Integration & Interoperability Service"
    description: "Routes API requests"
    technology: "gRPC / REST"
  - source: "EMR & Scheduling Service"
    destination: "Audit & Compliance Service"
    description: "Sends audit logs and compliance events"
    technology: "gRPC / Kafka"
  - source: "Integration & Interoperability Service"
    destination: "Lab/Imaging Systems"
    description: "Exchanges health data"
    technology: "HTTPS/FHIR"
  - source: "Billing Service"
    destination: "Message Broker"
    description: "Publishes asynchronous events"
    technology: "Apache Kafka"