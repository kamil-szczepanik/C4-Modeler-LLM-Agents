level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform managing patient admissions, EMRs, scheduling, and billing, ensuring high availability and HIPAA/GDPR compliance for medium-sized clinics and hospitals."
elements:
  - type: "person"
    name: "Patients"
    description: "End users who interact with the system for scheduling and managing their healthcare information."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals who access and update Electronic Medical Records (EMRs) and patient admissions."
  - type: "person"
    name: "Administrative Staff"
    description: "Personnel responsible for clinic operations, scheduling, and general management within the system."
  - type: "person"
    name: "Billing Officers"
    description: "Staff members handling financial transactions, billing, and claims processing."
  - type: "externalSystem"
    name: "Insurance/Payer Gateways"
    description: "External systems for processing medical claims and insurance verifications."
  - type: "externalSystem"
    name: "External Lab/Imaging Systems"
    description: "External systems providing laboratory results and medical imaging data."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system responsible for user authentication and authorization."
  - type: "externalSystem"
    name: "Kubernetes On-Premises and AWS"
    description: "Active-active hybrid infrastructure hosting the system containers."
relationships:
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Interacts with the system for admissions, scheduling, and EMR access"
    technology: "HTTPS/TLS 1.3 with Multi-Factor Authentication"
  - source: "Clinicians"
    destination: "Clinic Management System"
    description: "Manages patient admissions and EMRs"
    technology: "HTTPS/TLS 1.3 with Multi-Factor Authentication"
  - source: "Administrative Staff"
    destination: "Clinic Management System"
    description: "Handles administrative tasks and scheduling"
    technology: "HTTPS/TLS 1.3 with Multi-Factor Authentication"
  - source: "Billing Officers"
    destination: "Clinic Management System"
    description: "Processes billing and claims"
    technology: "HTTPS/TLS 1.3 with Multi-Factor Authentication"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OIDC/OAuth2"
  - source: "Clinic Management System"
    destination: "Insurance/Payer Gateways"
    description: "Submits and manages insurance claims"
    technology: "REST/JSON over HTTPS"
  - source: "Clinic Management System"
    destination: "External Lab/Imaging Systems"
    description: "Retrieves lab and imaging results"
    technology: "HL7 FHIR APIs (RESTful)"