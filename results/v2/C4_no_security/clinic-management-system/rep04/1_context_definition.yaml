level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "System manages patient admissions, EMRs, scheduling, and billing for clinics with high availability and strict HIPAA/GDPR compliance."
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who interact with the clinic management system."
  - type: "person"
    name: "Receptionists"
    description: "Staff members managing patient admissions and scheduling."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals managing EMRs and patient care."
  - type: "person"
    name: "Billing Specialists"
    description: "Personnel handling financial transactions and insurance billing."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Authentication service such as Azure AD or Okta."
  - type: "externalSystem"
    name: "Third-Party Payment Gateway & Insurance Clearinghouse"
    description: "External services for processing payments and insurance claims."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External medical systems exchanging health data."
relationships:
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Interacts with the clinic management system"
    technology: "HTTPS / Web Protocols"
  - source: "Receptionists"
    destination: "Clinic Management System"
    description: "Interacts with the clinic management system"
    technology: "HTTPS / Web Protocols"
  - source: "Clinicians"
    destination: "Clinic Management System"
    description: "Interacts with the clinic management system"
    technology: "HTTPS / Web Protocols"
  - source: "Billing Specialists"
    destination: "Clinic Management System"
    description: "Interacts with the clinic management system"
    technology: "HTTPS / Web Protocols"
  - source: "Clinic Management System"
    destination: "Identity Provider"
    description: "Authenticates users via OpenID Connect / SAML"
    technology: "OpenID Connect / SAML"
  - source: "Clinic Management System"
    destination: "Third-Party Payment Gateway & Insurance Clearinghouse"
    description: "Processes payments and claims"
    technology: "HTTPS REST APIs"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges health data via HL7 FHIR"
    technology: "HL7 FHIR REST APIs over TLS 1.3"