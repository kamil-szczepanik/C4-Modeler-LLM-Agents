level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who interact with the clinic management system."
  - type: "person"
    name: "Receptionists"
    description: "Staff members managing patient admissions and scheduling."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals managing EMRs and patient care."
  - type: "person"
    name: "Billing Specialists"
    description: "Personnel handling financial transactions and insurance billing."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Authentication service such as Azure AD or Okta."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service for processing financial payments."
  - type: "externalSystem"
    name: "Insurance Clearinghouse"
    description: "External service for processing insurance claims."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "External medical systems exchanging health data."
  - type: "container"
    name: "API Gateway"
    technology: "Envoy / NGINX"
    description: "Routes requests to internal containers using TLS/JWT validation."
  - type: "container"
    name: "Web Application Container"
    technology: "React / Next.js"
    description: "Frontend SPA/SSR for responsive user interfaces."
  - type: "container"
    name: "Clinical & EMR Core Container"
    technology: "Spring Boot / Java"
    description: "High-performance internal EMR and scheduling services."
  - type: "container"
    name: "Billing & Claims Container"
    technology: "Node.js / Express"
    description: "Lightweight billing and third-party integration management."
  - type: "container"
    name: "HL7 FHIR Integration Container"
    technology: "Apache Camel"
    description: "Integration engine for HL7 FHIR interoperability with external systems."
  - type: "container"
    name: "Edge Sync Container"
    technology: "Go Daemon"
    description: "Synchronizes local on-prem EMR data with cloud tier via asynchronous transactional outboxes."
  - type: "container"
    name: "Primary DB & Audit Store"
    technology: "PostgreSQL with Patroni"
    description: "Reliable relational data storage with automated active-passive failover and audit logging."
relationships:
  - source: "Patients"
    destination: "Web Application Container"
    description: "Interacts with web application"
    technology: "HTTPS"
  - source: "Receptionists"
    destination: "Web Application Container"
    description: "Interacts with web application"
    technology: "HTTPS"
  - source: "Clinicians"
    destination: "Web Application Container"
    description: "Interacts with web application"
    technology: "HTTPS"
  - source: "Billing Specialists"
    destination: "Web Application Container"
    description: "Interacts with web application"
    technology: "HTTPS"
  - source: "Web Application Container"
    destination: "API Gateway"
    description: "Sends user requests via HTTPS"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Clinical & EMR Core Container"
    description: "Routes validated requests"
    technology: "TLS / JWT / gRPC"
  - source: "API Gateway"
    destination: "Billing & Claims Container"
    description: "Routes validated requests"
    technology: "TLS / JWT / HTTP"
  - source: "Clinical & EMR Core Container"
    destination: "Primary DB & Audit Store"
    description: "Reads and writes clinical data"
    technology: "PostgreSQL Protocol"
  - source: "Billing & Claims Container"
    destination: "Primary DB & Audit Store"
    description: "Reads and writes billing data"
    technology: "PostgreSQL Protocol"
  - source: "Clinical & EMR Core Container"
    destination: "HL7 FHIR Integration Container"
    description: "Communicates internally"
    technology: "gRPC"
  - source: "HL7 FHIR Integration Container"
    destination: "Lab & Imaging Systems"
    description: "Connects to external Lab & Imaging Systems"
    technology: "HL7 FHIR APIs"
  - source: "Billing & Claims Container"
    destination: "Payment Gateway"
    description: "Connects to external payment gateways"
    technology: "HTTPS / REST"
  - source: "Billing & Claims Container"
    destination: "Insurance Clearinghouse"
    description: "Connects to external insurance clearinghouses"
    technology: "HTTPS / REST"
  - source: "Edge Sync Container"
    destination: "Primary DB & Audit Store"
    description: "Synchronizes local on-prem EMR data with cloud tier"
    technology: "Asynchronous Transactional Outboxes"
  - source: "Clinical & EMR Core Container"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OIDC / SAML"