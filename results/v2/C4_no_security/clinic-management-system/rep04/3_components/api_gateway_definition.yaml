# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  # Components within the parent container's boundary
  - type: "component"
    name: "TLS Termination"
    technology: "Envoy / NGINX"
    description: "Handles secure HTTPS connections and terminates Transport Layer Security."
  - type: "component"
    name: "Auth Filter"
    technology: "Envoy / NGINX Filter"
    description: "Validates JWT tokens and authenticates incoming requests."
  - type: "component"
    name: "Rate Limiter"
    technology: "Envoy / NGINX Filter"
    description: "Checks usage counters against Redis to enforce API traffic limits."
  - type: "component"
    name: "Dynamic Router"
    technology: "Envoy / NGINX"
    description: "Routes validated and prioritized traffic to internal containers."
  - type: "component"
    name: "QOS Filter"
    technology: "Envoy / NGINX Filter"
    description: "Manages quality of service and request prioritization."
  - type: "component"
    name: "Circuit Breaker"
    technology: "Envoy / NGINX"
    description: "Prevents cascading failures by monitoring downstream container health."
relationships:
  - source: "Rate Limiter"
    destination: "Redis Cache Cluster"
    description: "Checks usage counters [gRPC / Redis Protocol, <2ms latency]"