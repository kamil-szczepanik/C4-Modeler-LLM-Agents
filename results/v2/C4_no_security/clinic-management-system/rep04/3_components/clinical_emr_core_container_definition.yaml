level: component
scope: "Component diagram for the Clinical & EMR Core Container container"
parentContainer:
  name: "Clinical & EMR Core Container"
elements:
  - type: "component"
    name: "Patient Demographic Service"
    technology: "Spring Boot / Java"
    description: "Manages and retrieves patient demographic information."
  - type: "component"
    name: "Scheduling Engine"
    technology: "Spring Boot / Java"
    description: "Handles appointment scheduling and clash checks."
  - type: "component"
    name: "EMR Management Service"
    technology: "Spring Boot / Java"
    description: "Manages electronic medical records operations."
  - type: "component"
    name: "Audit & Compliance Interceptor"
    technology: "Spring Boot / Java (AOP)"
    description: "Ensures HIPAA/GDPR compliance via asynchronous auditing."
  - type: "component"
    name: "Local State Cache & Sync Coordinator"
    technology: "Caffeine Cache & Embedded RocksDB"
    description: "Provides transient local state cache for offline resilience."
relationships:
  - source: "EMR Management Service"
    destination: "Local State Cache & Sync Coordinator"
    description: "Accesses cached patient data [In-Memory / Local IPC]"