level: component
scope: "Component diagram for the Primary DB & Audit Store container"
parentContainer:
  name: "Primary DB & Audit Store"
elements:
  - type: "component"
    name: "Transactional Data Store Component"
    technology: "PostgreSQL"
    description: "Manages patient admissions, EMRs, scheduling, and billing data."
  - type: "component"
    name: "Audit Logging Subsystem"
    technology: "pg_audit + WORM tables"
    description: "Maintains immutable audit trails for HIPAA/GDPR compliance."
  - type: "component"
    name: "High Availability Manager"
    technology: "Patroni + etcd"
    description: "Provides active-active/passive failover to meet 99.99% uptime."
  - type: "component"
    name: "Partitioning & Archival Worker"
    technology: "PostgreSQL Worker"
    description: "Handles data partitioning and archival processes for long-term retention."
  - type: "component"
    name: "Security & Access Control Component"
    technology: "PostgreSQL Row-Level Security"
    description: "Enforces database-level security and access control."
  - type: "component"
    name: "GDPR Anonymization & Retention Worker"
    technology: "PostgreSQL Worker"
    description: "Ensures compliance with GDPR anonymization and the 10-year data retention policy."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Manages database connections to prevent CPU contention and protect the <1s P95 SLA."
  - type: "component"
    name: "Log Shipper"
    technology: "Fluentbit / Vector"
    description: "Forwards logs for tamper-proof 10-year audit retention to SIEM or Object Storage."
relationships:
  - source: "Clinical & EMR Core & Billing Containers"
    destination: "Transactional Data Store Component"
    description: "PostgreSQL Protocol"
  - source: "Transactional Data Store Component"
    destination: "Audit Logging Subsystem"
    description: "Asynchronous internal triggers"
  - source: "Audit Logging Subsystem"
    destination: "SIEM / Object Storage"
    description: "Fluentbit / Vector sidecars"
  - source: "Core Containers"
    destination: "Security & Access Control Component"
    description: "Database-level RLS interception"