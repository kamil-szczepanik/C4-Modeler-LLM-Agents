level: component
scope: "Component diagram for the Billing & Claims Container container"
parentContainer:
  name: "Billing & Claims Container"
elements:
  - type: "component"
    name: "Billing Specialists"
    technology: "Human User"
    description: "Billing Specialists (Users)"
  - type: "component"
    name: "Billing & Claims Container"
    technology: "Node.js / Express"
    description: "Billing & Claims Container"
  - type: "component"
    name: "Billing API Controller"
    technology: "Express.js"
    description: "Billing API Controller"
  - type: "component"
    name: "Claim Validation & Mapping Engine"
    technology: "TypeScript / AJV"
    description: "Claim Validation & Mapping Engine"
  - type: "component"
    name: "Payment & Clearinghouse Integration Service"
    technology: "Axios / Node SDKs"
    description: "Payment & Clearinghouse Integration Service"
  - type: "component"
    name: "Idempotent Dispatcher Middleware"
    technology: "Node.js / Express Middleware"
    description: "Idempotent Dispatcher Middleware"
  - type: "component"
    name: "Transaction & DLQ Manager"
    technology: "Node.js"
    description: "Transaction & DLQ Manager"
  - type: "component"
    name: "Ledger & Audit Writer"
    technology: "TypeORM"
    description: "Ledger & Audit Writer"
  - type: "component"
    name: "Primary DB & Audit Store"
    technology: "PostgreSQL with Patroni"
    description: "Primary DB & Audit Store"
  - type: "component"
    name: "Third-Party Payment Gateway & Insurance Clearinghouse"
    technology: "External Systems"
    description: "Third-Party Payment Gateway & Insurance Clearinghouse"
  - type: "component"
    name: "API Gateway"
    technology: "Network Gateway"
    description: "API Gateway"
relationships:
  - source: "API Gateway"
    destination: "Billing API Controller"
    description: "Routes validated requests [TLS / JWT / HTTP]"
  - source: "Billing API Controller"
    destination: "Claim Validation & Mapping Engine"
    description: "Passes billing data for validation [Internal Function Call]"
  - source: "Payment & Clearinghouse Integration Service"
    destination: "Third-Party Payment Gateway & Insurance Clearinghouse"
    description: "Processes co-pays and balances [HTTPS / REST]"
  - source: "Payment & Clearinghouse Integration Service"
    destination: "Third-Party Payment Gateway & Insurance Clearinghouse"
    description: "Submits insurance claims [HTTPS / REST]"
  - source: "Transaction & DLQ Manager"
    destination: "Ledger & Audit Writer"
    description: "Logs transactions and failed payloads [Internal Function Call]"
  - source: "Ledger & Audit Writer"
    destination: "Primary DB & Audit Store"
    description: "Enforces ACID-compliant writes [PostgreSQL Protocol, AES-256]"