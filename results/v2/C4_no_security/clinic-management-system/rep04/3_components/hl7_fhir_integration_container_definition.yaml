level: component
scope: "Component diagram for the HL7 FHIR Integration Container container"
parentContainer:
  name: "HL7 FHIR Integration Container"
elements:
  - type: "component"
    name: "FHIR API Route Controller"
    technology: "Apache Camel"
    description: "Handles incoming FHIR API routes and requests."
  - type: "component"
    name: "Data Transformation & Mapping Engine"
    technology: "HAPI FHIR / Java"
    description: "Performs schema validation and resource mapping for clinical interoperability."
  - type: "component"
    name: "Dead-Letter & Retry Manager"
    technology: "Apache Camel / Resilience4j"
    description: "Manages failed message routing, retries, and dead-letter queues."
  - type: "component"
    name: "External Connector Client"
    technology: "HTTPS / TLS 1.3 / mTLS"
    description: "Communicates securely with external Lab & Imaging Systems using HL7 FHIR APIs."
  - type: "component"
    name: "Audit & Compliance Publisher Component"
    technology: "JDBC / TLS"
    description: "Publishes audit events and compliance data to the Primary DB & Audit Store."
relationships:
  - source: "FHIR API Route Controller"
    destination: "Data Transformation & Mapping Engine"
    description: "Routes payloads for validation and mapping"
  - source: "Data Transformation & Mapping Engine"
    destination: "External Connector Client"
    description: "Sends transformed FHIR resources to external labs"
  - source: "FHIR API Route Controller"
    destination: "Dead-Letter & Retry Manager"
    description: "Handles message delivery failures"
  - source: "Audit & Compliance Publisher Component"
    destination: "Primary DB & Audit Store"
    description: "Publishes audit event logs [JDBC / TLS]"