level: component
scope: "Component diagram for the Web Application Container container"
parentContainer:
  name: "Web Application Container"
elements:
  - type: "component"
    name: "Routing & Layout Component"
    technology: "React / Next.js"
    description: "Handles routing, page layouts, and responsive clinician dashboards with SSR/SSG."
  - type: "component"
    name: "Authentication & Session Component"
    technology: "React / Next.js / TypeScript"
    description: "Manages user authentication sessions and token exchange with the Identity Provider via OAuth2/OIDC."
  - type: "component"
    name: "Feature Modules"
    technology: "React / TypeScript"
    description: "Implements core patient admissions, medical records, scheduling, and billing feature logic."
  - type: "component"
    name: "API Client Component"
    technology: "TypeScript / Fetch/Axios"
    description: "Communicates securely via HTTPS with the API Gateway."
  - type: "component"
    name: "State Management & Caching Component"
    technology: "React Query / Zustand"
    description: "Manages local client state and caching to minimize network round-trips."
relationships:
  - source: "Authentication & Session Component"
    destination: "Identity Provider"
    description: "Token exchange via [OAuth2/OIDC]"
  - source: "Feature Modules"
    destination: "State Management & Caching Component"
    description: "Reads/writes state [In-Memory]"
  - source: "API Client Component"
    destination: "API Gateway"
    description: "Sends user requests via [HTTPS]"
  - source: "Routing & Layout Component"
    destination: "Feature Modules"
    description: "Renders"
  - source: "Feature Modules"
    destination: "API Client Component"
    description: "Fetches data via"