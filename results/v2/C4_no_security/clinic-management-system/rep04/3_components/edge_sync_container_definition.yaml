level: component
scope: "Component diagram for the Edge Sync Container container"
parentContainer:
  name: "Edge Sync Container"
elements:
  - type: "component"
    name: "Outbox Poller"
    technology: "Go Daemon"
    description: "Reads un-synced events from the Primary DB & Audit Store using the transactional outbox pattern."
  - type: "component"
    name: "Encryption & Transformer"
    technology: "Go Daemon"
    description: "Encrypts and transforms offline patient care and transactional data for secure transmission."
  - type: "component"
    name: "Cloud Sync Client"
    technology: "Go Daemon / gRPC over mTLS"
    description: "Syncs encrypted data to the cloud tier over secure channels."
  - type: "component"
    name: "DLQ & Spool Manager"
    technology: "Go Daemon / Local Disk Spooling"
    description: "Manages local disk spooling and dead-letter queues to ensure offline resilience and fault tolerance."
relationships:
  - source: "Outbox Poller"
    destination: "Encryption & Transformer"
    description: "Passes un-synced events"
  - source: "Encryption & Transformer"
    destination: "Cloud Sync Client"
    description: "Sends encrypted payloads"
  - source: "Cloud Sync Client"
    destination: "DLQ & Spool Manager"
    description: "Handles delivery failures and spools data"