level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analyst & Risk Manager"
    description: "Internal users managing reviews, case workflows, and fraud rules with strict RBAC."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer & Merchant Platforms"
    description: "External systems sending card-not-present payment authorization requests."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External identity provider for OAuth2/OIDC authentication."
  - type: "externalSystem"
    name: "Regulatory & Notification Sink"
    description: "External sink for exporting tamper-evident audit logs and notifications."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway / ALB"
    description: "Handles ingress routing, tokenization enforcement, and circuit breaking."
  - type: "container"
    name: "Scoring Engine Container"
    technology: "Go/Rust on Amazon ECS"
    description: "Stateless service evaluating card-not-present transactions for fraud with sub-50ms latency."
  - type: "container"
    name: "Case Management Container"
    technology: "Node.js/Python Monolith on Amazon ECS"
    description: "Provides analyst review workflows and data-masked UI."
  - type: "container"
    name: "Data Layer"
    technology: "Amazon DynamoDB & Amazon ElastiCache (Redis)"
    description: "Feature stores, tamper-evident audit logs, read replicas, and in-memory model/rule caching."
  - type: "container"
    name: "Event & Compliance Infrastructure"
    technology: "AWS SQS/SNS, AWS CloudTrail, and AWS Backup"
    description: "Handles asynchronous events, audit trails, and locked vaults for 7-year retention."
relationships:
  - source: "Payment Gateway / Acquirer & Merchant Platforms"
    destination: "API Gateway"
    description: "Forwards payment authorization requests"
    technology: "HTTPS/REST at 3,000 TPS"
  - source: "API Gateway"
    destination: "Scoring Engine Container"
    description: "Invokes real-time fraud scoring"
    technology: "gRPC/REST"
  - source: "Fraud Analyst & Risk Manager"
    destination: "Case Management Container"
    description: "Reviews suspicious payments via data-masked UI"
    technology: "HTTPS with RBAC via IdP"
  - source: "Scoring Engine Container"
    destination: "Data Layer"
    description: "Fetches cached fraud rules and scoring models, and reads/writes transaction data"
    technology: "Redis in-memory / DynamoDB"
  - source: "Case Management Container"
    destination: "Data Layer"
    description: "Reads/writes case data and immutable audit logs"
    technology: "Amazon DynamoDB"
  - source: "Data Layer"
    destination: "Event & Compliance Infrastructure"
    description: "Exports tamper-evident audit logs and tracks events"
    technology: "AWS SQS/SNS / AWS CloudTrail"
  - source: "Event & Compliance Infrastructure"
    destination: "Regulatory & Notification Sink"
    description: "Exports audit logs asynchronously"
    technology: "AWS SQS/SNS events"