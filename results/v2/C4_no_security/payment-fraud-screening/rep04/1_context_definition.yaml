level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "AWS-hosted serverless platform for scoring, case management, and auditing card-not-present payment authorizations."
elements:
  - type: "person"
    name: "Fraud Analyst & Risk Manager"
    description: "Internal users managing reviews and fraud rules."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer & Merchant Platforms"
    description: "External systems sending authorization requests."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "AWS Cognito or Okta for OAuth2/OIDC authentication."
  - type: "externalSystem"
    name: "Regulatory & Notification Sink"
    description: "Immutable AWS S3 object storage vault for audit logs."
relationships:
  - source: "Payment Gateway / Acquirer & Merchant Platforms"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Sends sub-50ms authorization requests and receives decisions"
    technology: "REST/gRPC over TLS 1.3"
  - source: "Fraud Analyst & Risk Manager"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Manages cases and updates fraud rules"
    technology: "HTTPS via IdP"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Regulatory & Notification Sink"
    description: "Sends 7-year tamper-evident audit logs"
    technology: "AWS S3 WORM policies"