level: component
scope: "Component diagram for the Case Management Container container"
parentContainer:
  name: "Case Management Container"
elements:
  - type: "component"
    name: "Case Management API"
    technology: "Node.js / Python (FastAPI)"
    description: "Routes analyst and reporting traffic and handles business logic for case reviews."
  - type: "component"
    name: "Data Access Layer"
    technology: "AWS SDK"
    description: "Reads and writes case data, audit logs, and model metadata to Amazon DynamoDB."
  - type: "component"
    name: "Event Handler"
    technology: "AWS SDK / SQS"
    description: "Handles dead-letter queues for failed asynchronous events and consumes event updates."
relationships:
  - source: "Case Management API"
    destination: "Data Access Layer"
    description: "Reads/writes case data, audit logs, and model metadata [Amazon DynamoDB via AWS SDK]"
  - source: "Event Handler"
    destination: "Data Access Layer"
    description: "Consumes asynchronous event updates [Amazon DynamoDB Streams]"
  - source: "Case Management API"
    destination: "Event Handler"
    description: "Handles dead-letter queues for failed asynchronous events [AWS SDK]"