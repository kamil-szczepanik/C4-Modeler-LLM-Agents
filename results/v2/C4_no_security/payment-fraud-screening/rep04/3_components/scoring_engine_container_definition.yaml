# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Scoring Engine Container container"
parentContainer:
  name: "Scoring Engine Container"
elements:
  - type: "component"
    name: "API Handler Component"
    technology: "Go/Fiber or Rust/Axon"
    description: "Manages inbound gRPC/REST requests."
  - type: "component"
    name: "Feature Assembler Component"
    technology: "Go / In-memory Go Channels"
    description: "Concurrently fetches contextual velocity data."
  - type: "component"
    name: "Inference Engine Component"
    technology: "Compiled decision trees / ONNX-runtime ML models"
    description: "Evaluates transactions using compiled decision trees or ONNX-runtime ML models."
  - type: "component"
    name: "Audit Dispatcher Component"
    technology: "Go / Local ring-buffer durability pattern"
    description: "Asynchronously flushes immutable decision logs using a local ring-buffer durability pattern."
  - type: "component"
    name: "Feedback Loop Receiver Component"
    technology: "Go/Fiber or Rust/Axon"
    description: "Ingests analyst review outcomes from the Case Management container."
  - type: "component"
    name: "Sidecar Model Deployment Pipeline"
    technology: "S3-backed model fetcher / Local shared volumes"
    description: "Utilizes local shared volumes for atomic hot-reloading."
relationships:
  - source: "API Gateway"
    destination: "API Handler Component"
    description: "Invokes real-time fraud scoring [gRPC/REST]."
  - source: "API Handler Component"
    destination: "Feature Assembler Component"
    description: "Passes validated request payloads [In-memory Go Channels]."
  - source: "Feature Assembler Component"
    destination: "Amazon ElastiCache (Redis)"
    description: "Fetches cached velocity data [TCP/Redis Protocol]."
  - source: "Feature Assembler Component"
    destination: "Inference Engine Component"
    description: "Passes assembled feature vectors [In-memory]."
  - source: "Sidecar S3 Volume"
    destination: "Inference Engine Component"
    description: "Provides atomic model file updates [Local Shared Volume]."
  - source: "Inference Engine Component"
    destination: "Audit Dispatcher Component"
    description: "Emits decisions and explanation payloads [In-memory Channel]."
  - source: "Audit Dispatcher Component"
    destination: "Amazon DynamoDB & AWS SQS"
    description: "Flushes tamper-evident audit logs [AWS SDK / HTTPS]."
  - source: "Case Management Container"
    destination: "Feedback Loop Receiver Component"
    description: "Sends analyst review outcomes [gRPC/REST]."