level: component
scope: "Component diagram for the Event & Compliance Infrastructure container"
parentContainer:
  name: "Event & Compliance Infrastructure"
elements:
  - type: "component"
    name: "Amazon EventBridge / SNS"
    technology: "AWS EventBridge and Amazon SNS"
    description: "Handles asynchronous event decoupling and distribution for system-wide telemetry and alerts."
  - type: "component"
    name: "Go-based Audit Logger"
    technology: "Go"
    description: "Generates and exports tamper-evident audit logs and tracking events."
  - type: "component"
    name: "Compliance Vault S3 Writer"
    technology: "AWS S3 with S3 Object Lock"
    description: "Writes and secures compliance data to S3 with Object Lock for 7-year auditability."
  - type: "component"
    name: "Alerting & Dead-Letter Monitor"
    technology: "AWS SQS and Dead-Letter Queues"
    description: "Manages backpressure and monitors failures, exporting alerts asynchronously."
relationships:
  - source: "Go-based Audit Logger"
    destination: "Compliance Vault S3 Writer"
    description: "Exports tamper-evident audit logs"
  - source: "Alerting & Dead-Letter Monitor"
    destination: "Amazon EventBridge / SNS"
    description: "Sends failure alerts asynchronously"