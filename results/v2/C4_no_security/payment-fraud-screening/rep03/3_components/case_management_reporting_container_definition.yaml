level: component
scope: "Component diagram for the Case Management & Reporting Container container"
parentContainer:
  name: "Case Management & Reporting Container"
elements:
  - type: "component"
    name: "Case Management API"
    technology: "Node.js/Express, AWS ECS Fargate"
    description: "Evaluates card-not-present transactions, provides case management interface for fraud analysts, and persists active case state."
  - type: "component"
    name: "Reporting Service"
    technology: "Node.js, AWS ECS Fargate"
    description: "Aggregates false-positive metrics and analyst SLAs for reporting and analytics."
  - type: "component"
    name: "Frontend SPA"
    technology: "React, AWS S3 / CloudFront"
    description: "Provides the user interface for fraud analysts, risk managers, and compliance auditors."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB (On-Demand)"
    description: "Persists active case state."
  - type: "component"
    name: "Amazon SQS / Kinesis"
    technology: "Amazon SQS / Kinesis"
    description: "Dispatches audit events for archival."
  - type: "component"
    name: "Amazon Athena"
    technology: "Amazon Athena & S3 Object Lock"
    description: "Aggregates false-positive metrics and analyst SLAs, providing tamper-evident 7-year audit logs."
relationships:
  - source: "Frontend SPA"
    destination: "Case Management API"
    description: "User interactions and data queries [REST/HTTPS]"
  - source: "Frontend SPA"
    destination: "Reporting Service"
    description: "User interactions and data queries [REST/HTTPS]"
  - source: "Case Management API"
    destination: "Amazon DynamoDB"
    description: "Persists active case state [AWS SDK / HTTPS]"
  - source: "Case Management API"
    destination: "Amazon SQS / Kinesis"
    description: "Dispatches audit events for archival [JSON / HTTPS]"
  - source: "Reporting Service"
    destination: "Amazon Athena"
    description: "Aggregates false-positive metrics and analyst SLAs [AWS SDK / HTTPS]"