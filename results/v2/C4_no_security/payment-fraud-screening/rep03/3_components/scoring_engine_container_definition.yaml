level: component
scope: "Component diagram for the Scoring Engine Container container"
parentContainer:
  name: "Scoring Engine Container"
elements:
  - type: "component"
    name: "API Handler Component"
    technology: "Go / Rust"
    description: "Terminates incoming HTTP/gRPC traffic from the AWS ALB."
  - type: "component"
    name: "Feature Assembler Component"
    technology: "Go / Rust"
    description: "Enriches requests using ElastiCache Redis and the Tokenization/Vault Service."
  - type: "component"
    name: "Execution Core Component"
    technology: "Go / Rust (In-memory)"
    description: "Evaluates rules and lightweight compiled scoring models in-memory."
  - type: "component"
    name: "Audit Dispatcher Component"
    technology: "Go / Rust"
    description: "Asynchronously serializes tamper-evident audit payloads to Amazon SQS / Kinesis Data Firehose."
relationships:
  - source: "API Handler Component"
    destination: "Feature Assembler Component"
    description: "Passes parsed payment authorization requests [In-memory]"
  - source: "Feature Assembler Component"
    destination: "Execution Core Component"
    description: "Supplies enriched request data and features [In-memory]"
  - source: "Execution Core Component"
    destination: "Audit Dispatcher Component"
    description: "Passes audit payloads asynchronously [In-memory Go channels / crossbeam]"