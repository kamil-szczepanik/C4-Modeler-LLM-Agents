level: component
scope: "Component diagram for the ElastiCache Redis container"
parentContainer:
  name: "ElastiCache Redis"
elements:
  - type: "component"
    name: "Redis Engine OSS 7.x"
    technology: "Amazon ElastiCache Redis OSS 7.x, cache.m6g.large"
    description: "In-memory cache providing ultra-low latency rules evaluation, feature states, and zero-downtime hot-reloads."
  - type: "component"
    name: "Multi-AZ Group with Read Replica"
    technology: "AWS ElastiCache Multi-AZ with Automatic Failover"
    description: "Ensures high availability and automatic failover within seconds."
  - type: "component"
    name: "Redis Pub/Sub Channel"
    technology: "Redis Pub/Sub"
    description: "Facilitates real-time messaging and hot-reloads for rules and feature states."
  - type: "component"
    name: "Redis AUTH / IAM Authentication"
    technology: "Redis AUTH / AWS KMS / TLS"
    description: "Protects cardholder data with in-transit and at-rest encryption to meet PCI-DSS Level 1 compliance."
  - type: "component"
    name: "Cluster Parameter Group"
    technology: "Redis volatile-lru"
    description: "Manages memory eviction policy for cached rules and feature states."
  - type: "component"
    name: "Slow Log Export"
    technology: "AWS CloudWatch API"
    description: "Exports slow logs and operational metrics like CPUUtilization, SwapUsage, and CurrConnections."
relationships:
  - source: "Redis Engine OSS 7.x"
    destination: "Multi-AZ Group with Read Replica"
    description: "Replicates data and ensures high availability"
  - source: "Redis Engine OSS 7.x"
    destination: "Redis Pub/Sub Channel"
    description: "Broadcasts hot-reload updates"
  - source: "Redis Engine OSS 7.x"
    destination: "Slow Log Export"
    description: "Exports performance logs and metrics"