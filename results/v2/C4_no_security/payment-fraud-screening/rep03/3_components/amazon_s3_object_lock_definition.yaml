level: component
scope: "Component diagram for the Amazon S3 Object Lock container"
parentContainer:
  name: "Amazon S3 Object Lock"
elements:
  - type: "component"
    name: "Compliance Archive Bucket"
    technology: "Amazon S3 Object Lock"
    description: "Stores tamper-evident audit payloads in GOVERNANCE mode for 7-year retention."
  - type: "component"
    name: "Cross-Region Replication Module"
    technology: "AWS Replication API"
