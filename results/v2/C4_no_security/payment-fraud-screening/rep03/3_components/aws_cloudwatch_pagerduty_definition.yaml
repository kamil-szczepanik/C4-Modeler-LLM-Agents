level: component
scope: "Component diagram for the AWS CloudWatch & PagerDuty container"
parentContainer:
  name: "AWS CloudWatch & PagerDuty"
elements:
  - type: "component"
    name: "Amazon CloudWatch"
    technology: "AWS CloudWatch & Log Exports"
    description: "Monitors infrastructure, aggregates logs, and manages composite alarms."
  - type: "component"
    name: "Amazon SNS"
    technology: "Amazon Simple Notification Service"
    description: "Publishes infrastructure alarms and health status to downstream alerting services."
  - type: "component"
    name: "PagerDuty Integration"
    technology: "HTTPS Webhooks"
    description: "Receives alert notifications for on-call incident response."
relationships:
  - source: "Amazon CloudWatch"
    destination: "Amazon SNS"
    description: "Triggers alarms and publishes health events"
  - source: "Amazon SNS"
    destination: "PagerDuty Integration"
    description: "Publishes alarms and health status via HTTPS webhooks"