level: container
scope: "Container diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
elements:
  - type: "person"
    name: "Fraud Analyst & Risk Manager"
    description: "Internal users handling case management, reviewing suspicious payments, and monitoring false positive rates."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system initiating payment authorization requests."
  - type: "externalSystem"
    name: "Tokenization / Vault Service"
    description: "External system handling card data encryption and tokenization."
  - type: "container"
    name: "AWS ALB"
    description: "Ingress layer with circuit breaker logic and AWS X-Ray distributed tracing."
    technology: "AWS Application Load Balancer"
  - type: "container"
    name: "Scoring Engine Container"
    description: "Processes real-time scoring for payment authorization requests."
    technology: "Go / Rust, AWS ECS Fargate"
  - type: "container"
    name: "Case Management & Reporting Container"
    description: "Provides interface for fraud analysts and risk managers to manage cases and monitor false positive rates."
    technology: "Node.js, AWS ECS Fargate"
  - type: "container"
    name: "ElastiCache Redis"
    description: "In-memory cache for ultra-low latency rules evaluation and zero-downtime hot-reloads via pub/sub."
    technology: "Amazon ElastiCache Redis"
  - type: "container"
    name: "Amazon SQS / Kinesis Data Firehose"
    description: "Buffering service for batching high-throughput audit events."
    technology: "Amazon SQS / Kinesis Data Firehose"
  - type: "container"
    name: "Amazon S3 Object Lock"
    description: "WORM-compliant tamper-evident storage for 7-year audit retention."
    technology: "Amazon S3"
  - type: "container"
    name: "Amazon Athena"
    description: "Query engine for analyzing audit logs in S3."
    technology: "Amazon Athena"
  - type: "container"
    name: "AWS CloudWatch & PagerDuty"
    description: "Monitoring, composite alarms, and alerting for scoring outages."
    technology: "AWS CloudWatch, PagerDuty"
relationships:
  - source: "Payment Gateway"
    destination: "AWS ALB"
    description: "Routes authorization requests"
    technology: "HTTPS"
  - source: "AWS ALB"
    destination: "Scoring Engine Container"
    description: "Forwards requests while applying circuit breaker fallback"
    technology: "HTTP/gRPC"
  - source: "Scoring Engine Container"
    destination: "Tokenization / Vault Service"
    description: "Requests tokenized card references"
    technology: "Secure APIs"
  - source: "Scoring Engine Container"
    destination: "ElastiCache Redis"
    description: "Fetches cached rules and scoring models in-memory"
    technology: "Redis Protocol"
  - source: "Scoring Engine Container"
    destination: "Amazon SQS / Kinesis Data Firehose"
    description: "Streams transaction inputs, model versions, and explanations asynchronously"
    technology: "HTTP"
  - source: "Amazon SQS / Kinesis Data Firehose"
    destination: "Amazon S3 Object Lock"
    description: "Batches and persists tamper-evident audit records"
    technology: "AWS API"
  - source: "Fraud Analyst & Risk Manager"
    destination: "Case Management & Reporting Container"
    description: "Reviews suspicious payments and monitors false positive rates via UI"
    technology: "HTTPS"
  - source: "Amazon Athena"
    destination: "Amazon S3 Object Lock"
    description: "Queries historical audit data for compliance audits"
    technology: "SQL / AWS API"