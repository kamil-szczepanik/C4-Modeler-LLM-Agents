level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
  description: "Screens card-not-present payment authorizations to prevent fraud while enabling analysts to review suspicious transactions, ensuring compliance, low-latency processing, and high availability."
elements:
  - type: "person"
    name: "Fraud Analyst & Risk Manager"
    description: "Internal users handling case management and rule updates."
  - type: "person"
    name: "Compliance Auditor"
    description: "External user accessing audit logs."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External upstream system submitting authorizations."
  - type: "externalSystem"
    name: "Tokenization / Vault Service"
    description: "External system handling card data."
  - type: "externalSystem"
    name: "AWS CloudWatch"
    description: "Telemetry, audit logging, and observability service."
relationships:
  - source: "Payment Gateway"
    destination: "Real-Time Payment Fraud Screening"
    description: "Submits authorizations"
    technology: "gRPC/HTTPS"
  - source: "Fraud Analyst & Risk Manager"
    destination: "Real-Time Payment Fraud Screening"
    description: "Reviews suspicious transactions and manages cases"
    technology: "HTTPS"
  - source: "Real-Time Payment Fraud Screening"
    destination: "Tokenization / Vault Service"
    description: "Queries masked/tokenized data"
    technology: "Mutual TLS (mTLS)"
  - source: "Real-Time Payment Fraud Screening"
    destination: "AWS CloudWatch"
    description: "Exports tamper-evident logs"
    technology: "OpenTelemetry"
  - source: "Compliance Auditor"
    destination: "AWS CloudWatch"
    description: "Accesses audit logs for compliance"
    technology: "HTTPS"