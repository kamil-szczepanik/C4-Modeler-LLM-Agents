level: component
scope: "Component diagram for the Feature Store container"
parentContainer:
  name: "Feature Store"
elements:
  - type: "component"
    name: "Feature Retrieval API"
    technology: "Go"
    description: "Fetches online features for the Real-Time Scoring Engine."
  - type: "component"
    name: "Feature Snapshotter"
    technology: "Python"
    description: "Flushes immutable feature vectors to Audit Log Storage."
  - type: "component"
    name: "Feature Ingestion Worker"
    technology: "Python"
    description: "Ingests and processes feature data."
  - type: "component"
    name: "Feature Definition Registry"
    technology: "PostgreSQL / AWS RDS"
    description: "Stores feature definitions and metadata."
relationships:
  - source: "Feature Snapshotter"
    destination: "Audit Log Storage"
    description: "Flushes immutable feature vectors [HTTPS / S3 API]"