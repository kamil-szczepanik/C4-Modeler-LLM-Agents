level: component
scope: "Component diagram for the Case Management Backend & UI container"
parentContainer:
  name: "Case Management Backend & UI"
elements:
  - type: "component"
    name: "React Analyst Web App"
    technology: "React, Amazon S3, Amazon CloudFront"
    description: "Single-page application hosted on Amazon S3 and distributed via Amazon CloudFront, enabling fraud analysts to review suspicious payment cases and manage workflows."
  - type: "component"
    name: "FastAPI Case Management Backend"
    technology: "Python, FastAPI, AWS ECS Fargate"
    description: "Unified container handling API routing, RBAC, data masking, and orchestration."
  - type: "component"
    name: "Audit Event Emitter"
    technology: "Python, AWS SDK (boto3)"
    description: "Internal module using AWS SDK (boto3) to stream immutable logs."
  - type: "component"
    name: "Audit Log Storage"
    technology: "Amazon S3, Object Lock"
    description: "Amazon S3 featuring Object Lock for tamper-evident retention satisfying the 7-year audit mandate."
relationships:
  - source: "React Analyst Web App"
    destination: "FastAPI Case Management Backend"
    description: "Communicates request data and queue updates via REST/HTTPS and WebSockets."
  - source: "FastAPI Case Management Backend"
    destination: "Audit Event Emitter"
    description: "Triggers audit event generation for actions."
  - source: "Audit Event Emitter"
    destination: "Audit Log Storage"
    description: "Streams append-only audit events via AWS SDK over HTTPS."