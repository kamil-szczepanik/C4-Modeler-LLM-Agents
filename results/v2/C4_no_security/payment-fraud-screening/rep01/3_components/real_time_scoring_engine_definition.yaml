level: component
scope: "Component diagram for the Real-Time Scoring Engine container"
parentContainer:
  name: "Real-Time Scoring Engine"
elements:
  - type: "component"
    name: "HTTP/gRPC Ingress Router"
    technology: "Go container component"
    description: "Evaluates card-not-present payment authorizations and handles high-throughput transactions."
  - type: "component"
    name: "Feature Assembler"
    technology: "Go container component"
    description: "Retrieves transaction features from the feature store."
  - type: "component"
    name: "Inference & Rule Executor"
    technology: "Go + ONNX Runtime C-API"
    description: "Executes compiled machine learning models and rules for fraud detection."
  - type: "component"
    name: "Audit Dispatcher"
    technology: "Go container component"
    description: "Flushes asynchronous audit payloads."
  - type: "component"
    name: "Model & Rule Synchronizer"
    technology: "Go background goroutine component"
    description: "Atomically swaps model references via atomic.Value."
  - type: "component"
    name: "Amazon ElastiCache Redis"
    technology: "Amazon ElastiCache Redis"
    description: "Provides low-latency, in-memory feature retrieval at 3,000 TPS."
  - type: "component"
    name: "Amazon S3"
    technology: "Amazon S3"
    description: "Delivers cost-effective, tamper-evident storage for audit logs and model binaries."
  - type: "component"
    name: "API Gateway"
    technology: "AWS API Gateway"
    description: "Forwards payment authorizations to the ingress router."
relationships:
  - source: "API Gateway"
    destination: "HTTP/gRPC Ingress Router"
    description: "Forwards payment authorizations [REST/HTTPS]"
  - source: "Feature Assembler"
    destination: "Amazon ElastiCache Redis"
    description: "Retrieves transaction features [Redis Protocol]"
  - source: "Inference & Rule Executor"
    destination: "Model & Rule Synchronizer"
    description: "Atomically swaps model references via atomic.Value [In-memory]"
  - source: "Audit Dispatcher"
    destination: "Amazon S3"
    description: "Flushes asynchronous audit payloads [S3 API / HTTPS]"