level: component
scope: "Component diagram for the Audit Log Storage container"
parentContainer:
  name: "Audit Log Storage"
elements:
  - type: "component"
    name: "Audit Buffer Component"
    technology: "Amazon SQS"
    description: "Decouples the scoring engine from storage spikes to protect P99 latency by buffering log events."
  - type: "component"
    name: "Audit Ingestion Component"
    technology: "AWS Lambda"
    description: "Serverless ingestion component ensuring cost efficiency for processing audit logs."
  - type: "component"
    name: "Tamper-Evident Vault Component"
    technology: "Amazon S3 with Object Lock and Lifecycle Rules"
    description: "Persists partitioned immutable logs enforcing WORM compliance mode for 7-year retention."
  - type: "component"
    name: "Query & Access Component"
    technology: "Amazon Athena"
    description: "Serverless SQL querying over partitioned data for rapid auditor reporting."
relationships:
  - source: "Audit Buffer Component"
    destination: "Audit Ingestion Component"
    description: "Consume log events via AWS internal polling"
  - source: "Audit Ingestion Component"
    destination: "Tamper-Evident Vault Component"
    description: "Persist partitioned immutable logs via S3 API"