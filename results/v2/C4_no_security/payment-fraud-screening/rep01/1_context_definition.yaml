level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Screens card-not-present payment authorizations for fraud in real-time and provides case management for analysts, built for a mid-size payment processor in AWS eu-west-1."
elements:
  - type: "person"
    name: "Fraud Analyst and Risk Operations Manager"
    description: "Performs case management and reviews flagged payment fraud transactions."
  - type: "person"
    name: "Compliance Auditor / Regulators"
    description: "Audits system logs to ensure compliance with PCI-DSS Level 1 and regulatory requirements."
  - type: "externalSystem"
    name: "Merchant / Payment Gateway"
    description: "API Client sending card-not-present payment authorizations for scoring."
  - type: "externalSystem"
    name: "External Identity Provider (IdP)"
    description: "Provides multi-factor authentication for users accessing the system."
  - type: "externalSystem"
    name: "AWS S3 / Glacier"
    description: "Cold storage for 7-year tamper-evident audit logs."
relationships:
  - source: "Merchant / Payment Gateway"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Submits payment authorizations for sub-50ms fraud scoring"
    technology: "gRPC/REST over TLS"
  - source: "Fraud Analyst and Risk Operations Manager"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Manages cases and reviews system data via Web UI"
    technology: "HTTPS"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "External Identity Provider (IdP)"
    description: "Authenticates users via multi-factor authentication"
    technology: "OAuth2/OIDC"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "AWS S3 / Glacier"
    description: "Stores 7-year tamper-evident audit logs"
    technology: "AWS SDK/IAM"