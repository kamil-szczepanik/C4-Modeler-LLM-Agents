level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Performs case management and reviews flagged payment fraud transactions."
  - type: "person"
    name: "Risk Operations Manager"
    description: "Manages risk operations and reviews system metrics."
  - type: "person"
    name: "Compliance Auditor"
    description: "Audits system logs to ensure compliance with regulatory requirements."
  - type: "externalSystem"
    name: "Merchant / Payment Gateway"
    description: "Sends card-not-present payment authorizations for fraud screening."
  - type: "externalSystem"
    name: "External Identity Provider (IdP)"
    description: "Provides multi-factor authentication for users accessing the system."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway / ALB"
    description: "Ingresses and routes incoming HTTP/REST traffic from merchants and gateways."
  - type: "container"
    name: "Real-Time Scoring Engine"
    technology: "Go, ECS Fargate, ONNX"
    description: "Evaluates transactions using embedded rules and static ML models under strict latency constraints."
  - type: "container"
    name: "Case Management Backend & UI"
    technology: "React, Node.js / Python, ECS Fargate"
    description: "Provides the case management interface and backend logic for analysts and managers."
  - type: "container"
    name: "Feature Store"
    technology: "Amazon ElastiCache Redis"
    description: "Provides sub-millisecond feature lookups for real-time scoring."
  - type: "container"
    name: "Audit Log Storage"
    technology: "Amazon S3, Amazon Athena"
    description: "Stores tamper-evident 7-year audit logs with Object Lock and query capabilities."
relationships:
  - source: "Merchant / Payment Gateway"
    destination: "API Gateway"
    description: "Sends payment authorizations for fraud screening"
    technology: "REST/HTTPS"
  - source: "API Gateway"
    destination: "Real-Time Scoring Engine"
    description: "Forwards payment authorizations for scoring"
    technology: "REST/HTTPS"
  - source: "Real-Time Scoring Engine"
    destination: "Feature Store"
    description: "Retrieves features for real-time risk assessment"
    technology: "Redis Protocol"
  - source: "Real-Time Scoring Engine"
    destination: "Audit Log Storage"
    description: "Writes audit logs for compliance"
    technology: "S3 API (HTTPS)"
  - source: "Fraud Analyst"
    destination: "Case Management Backend & UI"
    description: "Manages fraud cases and reviews flagged transactions"
    technology: "REST/HTTPS"
  - source: "Risk Operations Manager"
    destination: "Case Management Backend & UI"
    description: "Monitors and oversees risk operations"
    technology: "REST/HTTPS"
  - source: "Compliance Auditor"
    destination: "Case Management Backend & UI"
    description: "Accesses audit data and compliance reports"
    technology: "REST/HTTPS"