# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Internal user who accesses case management tools to review and manage fraud cases."
  - type: "person"
    name: "Risk Operations Manager"
    description: "Internal user who manages risk operations and oversight."
  - type: "person"
    name: "Fraud Model Data Scientist"
    description: "Internal user who develops and updates fraud detection models."
  - type: "externalSystem"
    name: "Shopper / Cardholder"
    description: "External entity initiating card-not-present payment transactions."
  - type: "externalSystem"
    name: "Merchant / Payment Gateway"
    description: "External entity submitting payment authorizations for real-time fraud scoring."
  - type: "container"
    name: "AWS ALB / API Gateway"
    description: "Ingress point for incoming traffic and API routing."
    technology: "AWS ALB / API Gateway"
  - type: "container"
    name: "Real-Time Scoring Engine"
    description: "Evaluates payment authorizations to provide sub-50ms automated fraud decisions."
    technology: "Go, Amazon ECS Fargate"
  - type: "container"
    name: "Amazon ElastiCache (Redis)"
    description: "Feature store and cache providing ultra-low latency access to feature vectors."
    technology: "Redis"
  - type: "container"
    name: "Case Management & Analytics API"
    description: "Backend service supporting case management tools for analysts and risk managers."
    technology: "Backend service"
  - type: "container"
    name: "Frontend Web App"
    description: "User interface for analysts and risk managers to review cases and metrics."
    technology: "React SPA"
  - type: "container"
    name: "Amazon RDS PostgreSQL"
    description: "Manages persistent relational data for case management and application state."
    technology: "Amazon RDS PostgreSQL"
  - type: "container"
    name: "Amazon S3 with Object Lock and AWS KMS"
    description: "Tamper-evident audit log storage ensuring 7-year auditability and PCI-DSS compliance."
    technology: "Amazon S3, AWS KMS"
  - type: "container"
    name: "AWS Kinesis Data Streams / Amazon SQS"
    description: "Handles asynchronous event processing across the system architecture."
    technology: "AWS Kinesis Data Streams / Amazon SQS"
relationships:
  - source: "Merchant / Payment Gateway"
    destination: "AWS ALB / API Gateway"
    description: "Sends payment authorizations for scoring"
    technology: "HTTPS"
  - source: "AWS ALB / API Gateway"
    destination: "Real-Time Scoring Engine"
    description: "Routes incoming scoring requests"
    technology: "HTTP/2"
  - source: "Real-Time Scoring Engine"
    destination: "Amazon ElastiCache (Redis)"
    description: "Retrieves feature vectors"
    technology: "RESP"
  - source: "Real-Time Scoring Engine"
    destination: "Amazon S3 with Object Lock and AWS KMS"
    description: "Writes tamper-evident audit logs"
    technology: "HTTPS"
  - source: "Fraud Analyst"
    destination: "Frontend Web App"
    description: "Accesses case management tools"
    technology: "HTTPS"
  - source: "Frontend Web App"
    destination: "Case Management & Analytics API"
    description: "Makes API requests for case management and analytics"
    technology: "HTTPS"
  - source: "Case Management & Analytics API"
    destination: "Amazon RDS PostgreSQL"
    description: "Reads and writes persistent case data"
    technology: "TCP/SQL"