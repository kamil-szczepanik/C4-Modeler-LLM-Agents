level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
  description: "Evaluates card-not-present payment authorizations to detect fraud and provides case management tools for analysts, processing 3,000 transactions per second."
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Internal user who accesses case management tools to review and manage fraud cases."
  - type: "externalSystem"
    name: "Shopper / Cardholder"
    description: "External entity initiating payment transactions."
  - type: "externalSystem"
    name: "Merchant / Payment Gateway"
    description: "External entity submitting payment authorizations for real-time fraud scoring."
relationships:
  - source: "Merchant / Payment Gateway"
    destination: "Real-Time Payment Fraud Screening"
    description: "Connects for real-time scoring of payment authorizations."
    technology: "gRPC/TLS"
  - source: "Fraud Analyst"
    destination: "Real-Time Payment Fraud Screening"
    description: "Accesses case management tools authenticated via AWS Cognito."
    technology: "HTTPS/TLS"