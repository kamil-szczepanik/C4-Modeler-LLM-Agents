level: component
scope: "Component diagram for the Case Management & Analytics API container"
parentContainer:
  name: "Case Management & Analytics API"
elements:
  - type: "component"
    name: "REST/GraphQL Handler"
    technology: "NestJS, Data Masking Middleware"
    description: "Handles API requests from the Frontend Web App and enforces data masking and PCI-DSS compliance."
  - type: "component"
    name: "Case Service"
    technology: "NestJS, In-Memory / TCP"
    description: "Processes transactional state updates and case reads/writes."
  - type: "component"
    name: "Analytics Query Engine"
    technology: "NestJS, TCP/SQL"
    description: "Executes reporting and analytics queries against the OLAP read replica."
  - type: "component"
    name: "Audit Logger"
    technology: "AWS SDK, HTTPS"
    description: "Generates and stores immutable 7-year audit logs."
relationships:
  - source: "REST/GraphQL Handler"
    destination: "Case Service"
    description: "Transactional state updates"
  - source: "Case Service"
    destination: "Amazon RDS PostgreSQL Primary"
    description: "Case reads and writes"
  - source: "Analytics Query Engine"
    destination: "Amazon RDS Read Replica"
    description: "Reporting queries"
  - source: "Audit Logger"
    destination: "Amazon S3 with Object Lock"
    description: "Immutable audit records"