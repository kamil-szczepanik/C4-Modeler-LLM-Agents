level: component
scope: "Component diagram for the AWS ALB / API Gateway container"
parentContainer:
  name: "AWS ALB / API Gateway"
elements:
  - type: "component"
    name: "AWS WAF Layer"
    technology: "AWS WAF"
    description: "Provides volumetric attack mitigation and Layer 7 ingress security."
  - type: "component"
    name: "ALB Ingress Router"
    technology: "AWS Application Load Balancer"
    description: "Handles TLS 1.3 termination and routes traffic to internal services and APIs."
relationships:
  - source: "AWS WAF Layer"
    destination: "ALB Ingress Router"
    description: "Inspects and passes filtered traffic"
  - source: "ALB Ingress Router"
    destination: "Real-Time Scoring Engine"
    description: "Routes scoring requests [HTTP/2 / VPC Lattice]"
  - source: "ALB Ingress Router"
    destination: "Frontend Web App"
    description: "Serves static SPA assets [HTTPS]"
  - source: "ALB Ingress Router"
    destination: "Case Management & Analytics API"
    description: "Routes management traffic [HTTPS]"
  - source: "ALB Ingress Router"
    destination: "Amazon S3 with Object Lock and AWS KMS"
    description: "Stores AWS WAF and ALB access logs [HTTPS]"