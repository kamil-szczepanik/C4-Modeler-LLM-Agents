level: component
scope: "Component diagram for the Real-Time Scoring Engine container"
parentContainer:
  name: "Real-Time Scoring Engine"
elements:
  - type: "component"
    name: "API Handler Component"
    technology: "Go / net/http"
    description: "Handles HTTP/2 scoring requests from the API gateway."
  - type: "component"
    name: "Feature Aggregator Component"
    technology: "Go"
    description: "Retrieves real-time feature vectors via RESP from Redis."
  - type: "component"
    name: "Scoring Evaluator Component"
    technology: "Go"
    description: "Evaluates transactions for fraud scoring."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Go"
    description: "Logs decision payloads and audit trails."
  - type: "component"
    name: "Fallback Circuit Breaker Component"
    technology: "Go / In-Memory"
    description: "Manages in-memory fallback routing states locally to ensure high availability."
relationships:
  - source: "Feature Aggregator Component"
    destination: "Amazon ElastiCache (Redis)"
    description: "Retrieves real-time feature vectors via RESP"
  - source: "Audit Logger Component"
    destination: "AWS Kinesis Data Streams / Amazon SQS"
    description: "Batch-streams decision payloads via HTTPS"
  - source: "Audit Logger Component"
    destination: "Amazon S3 with Object Lock and AWS KMS"
    description: "Writes tamper-evident logs via HTTPS"
  - source: "Fallback Circuit Breaker Component"
    destination: "Scoring Evaluator Component"
    description: "Manages in-memory fallback routing states locally"