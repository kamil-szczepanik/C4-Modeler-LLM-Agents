level: component
scope: "Component diagram for the Amazon S3 with Object Lock and AWS KMS container"
parentContainer:
  name: "Amazon S3 with Object Lock and AWS KMS"
elements:
  # Components within the parent container's boundary
  - type: "component"
    name: "WORM Storage Engine"
    technology: "Amazon S3 with Object Lock"
    description: "Provides immutable Write-Once-Read-Many storage ensuring 7-year tamper-evident auditability."
  - type: "component"
    name: "Encryption Service"
    technology: "AWS KMS"
    description: "Manages encryption keys to secure audit logs and sensitive payment data at rest."
relationships:
  - source: "WORM Storage Engine"
    destination: "Encryption Service"
    description: "Uses encryption keys for data security [AWS SDK]"