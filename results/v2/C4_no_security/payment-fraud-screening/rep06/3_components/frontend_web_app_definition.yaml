level: component
scope: "Component diagram for the Frontend Web App container"
parentContainer:
  name: "Frontend Web App"
elements:
  - type: "component"
    name: "Frontend Web App"
    technology: "React SPA"
    description: "Powers a responsive, modular user interface with low maintenance overhead for a 3-engineer team."
  - type: "component"
    name: "Authentication & Session Manager"
    technology: "TypeScript, OIDC/OAuth2"
    description: "Authenticates analysts and manages OIDC tokens."
  - type: "component"
    name: "Case Management Dashboard"
    technology: "React, Tailwind CSS"
    description: "Secure case management frontend for fraud analysts."
  - type: "component"
    name: "Rule & Model Configurator"
    technology: "React"
    description: "Configures rules and models, submitting dry-run simulations and rule updates."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios/Fetch"
    description: "Handles RESTful operations and communicates with backend APIs."
  - type: "component"
    name: "AWS S3 & CloudFront"
    technology: "AWS S3 & CloudFront (CDN)"
    description: "Provides secure, serverless static asset hosting."
  - type: "component"
    name: "AWS WAF & AWS Cognito"
    technology: "AWS WAF & AWS Cognito"
    description: "Secures edge distribution and delivers managed OIDC/OAuth2 authentication and RBAC."
  - type: "component"
    name: "Case Management & Analytics API"
    technology: "REST/JSON"
    description: "Backend API for case management and analytics."
relationships:
  - source: "Case Management Dashboard"
    destination: "API Client Layer"
    description: "Invokes RESTful operations [HTTPS/REST, JSON]"
  - source: "Rule & Model Configurator"
    destination: "API Client Layer"
    description: "Submits dry-run simulations and rule updates [HTTPS/REST, JSON]"
  - source: "Authentication & Session Manager"
    destination: "AWS WAF & AWS Cognito"
    description: "Authenticates analysts and manages OIDC tokens [HTTPS/OAuth2]"
  - source: "Frontend Web App"
    destination: "Case Management & Analytics API"
    description: "Communicates via strict CORS-enforced [HTTPS]"
  - source: "AWS WAF & AWS Cognito"
    destination: "AWS S3 & CloudFront"
    description: "Blocks web exploits and enforces rate-limiting at the edge [HTTPS]"