# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Amazon RDS PostgreSQL container"
parentContainer:
  name: "Amazon RDS PostgreSQL"
elements:
  - type: "component"
    name: "Case Management Schema"
    technology: "Relational database schema"
    description: "Stores active cases and operational data for fraud analysts."
  - type: "component"
    name: "Audit & Explainability Log"
    technology: "Relational database schema"
    description: "Maintains immutable-style logs for 7-year audit retention and explainability."
  - type: "component"
    name: "Partition Manager"
    technology: "pg_partman"
    description: "Manages structured data storage and table partitioning for optimal query performance."
  - type: "component"
    name: "Data Purge & TTL Worker"
    technology: "PostgreSQL Worker / Cron"
    description: "Handles data retention lifecycles and offloading of expired partitions."
relationships:
  - source: "Partition Manager"
    destination: "Amazon S3 with Object Lock"
    description: "Offloads expired partitions [HTTPS]"