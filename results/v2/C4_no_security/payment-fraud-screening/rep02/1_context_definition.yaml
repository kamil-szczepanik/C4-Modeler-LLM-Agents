level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
  description: "Processes card-not-present authorizations to detect fraud in real-time and provides case management for suspicious transactions, balancing risk mitigation, sub-50ms latency, and compliance."
elements:
  - type: "person"
    name: "Fraud Analyst & Merchant Support"
    description: "Internal users reviewing flagged cases and handling disputes."
  - type: "person"
    name: "Data Scientist / Fraud Modeler & Risk Manager"
    description: "Internal users updating rules, models, and auditing decisions."
  - type: "externalSystem"
    name: "Payment Gateway / Core Processing System"
    description: "External system sending real-time authorization requests."
relationships:
  - source: "Payment Gateway / Core Processing System"
    destination: "Real-Time Payment Fraud Screening"
    description: "Sends real-time authorization requests"
    technology: "gRPC/REST over TLS"
  - source: "Fraud Analyst & Merchant Support"
    destination: "Real-Time Payment Fraud Screening"
    description: "Accesses case management, rule updates, and audit logs"
    technology: "HTTPS/TLS"
  - source: "Data Scientist / Fraud Modeler & Risk Manager"
    destination: "Real-Time Payment Fraud Screening"
    description: "Accesses case management, rule updates, and audit logs"
    technology: "HTTPS/TLS"