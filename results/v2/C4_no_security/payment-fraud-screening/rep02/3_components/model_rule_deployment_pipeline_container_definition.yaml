level: component
scope: "Component diagram for the Model/Rule Deployment Pipeline Container container"
parentContainer:
  name: "Model/Rule Deployment Pipeline Container"
elements:
  - type: "component"
    name: "GitHub"
    technology: "Secure Git Repository"
    description: "Stores and manages fraud rules and models committed by Data Scientists and Fraud Modelers."
  - type: "component"
    name: "AWS CodePipeline"
    technology: "AWS CodePipeline & CodeBuild"
    description: "Orchestrates the deployment pipeline, triggered via webhook to validate, compile, and update tasks."
  - type: "component"
    name: "AWS CodeBuild"
    technology: "Python / FastAPI, ONNX"
    description: "Validates and compiles models into ONNX format."
  - type: "component"
    name: "Amazon S3 Audit & Feature Store"
    technology: "Amazon S3"
    description: "Stores signed model artifacts and audit metadata."
  - type: "component"
    name: "Amazon ECS Fargate"
    technology: "Amazon ECS API / HTTPS"
    description: "Runs task updates for zero-downtime model deployments."
  - type: "component"
    name: "Amazon CloudWatch"
    technology: "Amazon CloudWatch"
    description: "Monitors P99 latency and error rates for automated canary rollbacks."
relationships:
  - source: "Data Scientists / Fraud Modelers"
    destination: "GitHub"
    description: "Commits fraud rules and models via HTTPS."
  - source: "GitHub"
    destination: "AWS CodePipeline"
    description: "Triggers deployment pipeline via Webhook / HTTPS."
  - source: "AWS CodePipeline"
    destination: "AWS CodeBuild"
    description: "Validates and compiles models into ONNX format via API."
  - source: "AWS CodeBuild"
    destination: "Amazon S3 Audit & Feature Store"
    description: "Stores signed model artifacts and audit metadata via AWS SDK."
  - source: "AWS CodePipeline"
    destination: "Amazon ECS Fargate"
    description: "Orchestrates zero-downtime task updates via AWS ECS API / HTTPS."
  - source: "Amazon CloudWatch"
    destination: "AWS CodePipeline"
    description: "Monitors P99 latency and error rates for automated canary rollbacks via CloudWatch Alarms / EventBridge."