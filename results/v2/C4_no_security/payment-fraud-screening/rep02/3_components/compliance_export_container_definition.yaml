level: component
scope: "Component diagram for the Compliance Export Container container"
parentContainer:
  name: "Compliance Export Container"
elements:
  - type: "component"
    name: "Compliance Export Container"
    technology: "AWS Lambda"
    description: "Serverless execution environment that provides scheduled, automated generation of standardized CSV and JSON audit trails to satisfy 7-year regulatory retention and PCI-DSS compliance."
  - type: "component"
    name: "Athena Query Orchestrator"
    technology: "Python / boto3"
    description: "Executes scheduled audit queries against Amazon Athena."
  - type: "component"
    name: "Schema Formatter Component"
    technology: "Python / Pandas"
    description: "Handles data streaming and formatting of query results within memory limits."
  - type: "component"
    name: "Presigned URL Notifier"
    technology: "Amazon SNS"
    description: "Publishes export status and secure download links."
  - type: "component"
    name: "Amazon Athena"
    technology: "Amazon Athena"
    description: "Serverless query service used to process heavy 7-year compliance datasets without always-on compute."
  - type: "component"
    name: "Audit & Feature Store"
    technology: "Amazon S3 with Object Lock"
    description: "Tamper-evident storage ensuring immutable audit logs for regulatory compliance."
  - type: "component"
    name: "Amazon S3 Compliance Bucket"
    technology: "Amazon S3"
    description: "Stores formatted CSV/JSON audit reports."
  - type: "component"
    name: "Amazon SNS & Amazon SQS DLQ"
    technology: "Amazon SNS / Amazon SQS"
    description: "Captures unhandled execution failures for analysis and publishes notifications."
  - type: "component"
    name: "Amazon EventBridge"
    technology: "Amazon EventBridge"
    description: "Triggers scheduled compliance exports via Cron / AWS Events."
relationships:
  - source: "Compliance Export Container"
    destination: "Amazon Athena"
    description: "Executes scheduled audit queries [HTTPS / AWS SDK]"
  - source: "Compliance Export Container"
    destination: "Audit & Feature Store"
    description: "Queries tamper-evident compliance logs [Amazon Athena]"
  - source: "Compliance Export Container"
    destination: "Amazon S3 Compliance Bucket"
    description: "Writes formatted CSV/JSON audit reports [HTTPS / AWS SDK]"
  - source: "Compliance Export Container"
    destination: "Amazon SNS & Amazon SQS DLQ"
    description: "Publishes export status and secure download links [AWS SDK]"
  - source: "Amazon EventBridge"
    destination: "Compliance Export Container"
    description: "Triggers scheduled compliance exports [Cron / AWS Events]"
  - source: "Compliance Export Container"
    destination: "Amazon SNS & Amazon SQS DLQ"
    description: "Captures unhandled execution failures for analysis [AWS SDK]"