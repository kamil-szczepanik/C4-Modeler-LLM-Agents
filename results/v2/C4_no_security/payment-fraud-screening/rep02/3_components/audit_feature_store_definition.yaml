level: component
scope: "Component diagram for the Audit & Feature Store container"
parentContainer:
  name: "Audit & Feature Store"
elements:
  - type: "component"
    name: "Audit Log Store"
    technology: "Amazon S3 with Object Lock"
    description: "Ensures WORM-compliant, tamper-evident 7-year audit retention."
  - type: "component"
    name: "Feature Store"
    technology: "Amazon DynamoDB"
    description: "Provides single-digit millisecond feature reads and automated TTL pruning for cost control."
  - type: "component"
    name: "Audit Query Engine"
    technology: "Amazon Athena with AWS Glue Data Catalog"
    description: "Enables serverless SQL querying over S3 logs with zero operational overhead."
  - type: "component"
    name: "Asynchronous Ingestion"
    technology: "Amazon Kinesis Firehose"
    description: "Decouples audit writing from the critical path to protect P99 latency."
relationships:
  - source: "Asynchronous Ingestion"
    destination: "Audit Log Store"
    description: "Batched persistence of tamper-evident logs [S3 API / HTTPS]"
  - source: "Audit Query Engine"
    destination: "Audit Log Store"
    description: "Serverless SQL audits [Amazon Athena]"