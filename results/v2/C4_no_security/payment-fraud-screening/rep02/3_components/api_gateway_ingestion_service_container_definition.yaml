level: component
scope: "Component diagram for the API Gateway / Ingestion Service Container container"
parentContainer:
  name: "API Gateway / Ingestion Service Container"
elements:
  - type: "component"
    name: "Edge Router & TLS Terminator"
    technology: "Go"
    description: "Ingests payment authorizations and terminates TLS 1.3 connections."
  - type: "component"
    name: "Tokenization & Payload Scrubber"
    technology: "Go"
    description: "Tokenizes and scrubs raw incoming payloads for PCI-DSS compliance."
  - type: "component"
    name: "Local Rate Limiter & Throttle"
    technology: "Go (sync.Map)"
    description: "Enforces local per-merchant rate limiting and throttling."
  - type: "component"
    name: "Ingestion API Handler & Circuit Breaker"
    technology: "Go"
    description: "Handles validated requests and protects downstream systems with a circuit breaker."
  - type: "component"
    name: "Usage Metering Emitter"
    technology: "Go"
    description: "Asynchronously streams usage metadata for billing and SLA tracking."
  - type: "component"
    name: "AWS Distro for OpenTelemetry (ADOT) Sidecar"
    technology: "AWS ADOT"
    description: "Provides scraper-less metrics and trace export to Amazon CloudWatch."
relationships:
  - source: "Payment Gateway / Core Processing System"
    destination: "Edge Router & TLS Terminator"
    description: "Sends payment authorizations [gRPC/REST over TLS 1.3]"
  - source: "Edge Router & TLS Terminator"
    destination: "Tokenization & Payload Scrubber"
    description: "Forwards raw incoming payloads [In-memory Go channels]"
  - source: "Tokenization & Payload Scrubber"
    destination: "Local Rate Limiter & Throttle"
    description: "Passes scrubbed payloads [In-memory Go channels]"
  - source: "Local Rate Limiter & Throttle"
    destination: "Ingestion API Handler & Circuit Breaker"
    description: "Forwards validated requests [In-memory Go channels]"
  - source: "Ingestion API Handler & Circuit Breaker"
    destination: "Real-Time Scoring Engine Container"
    description: "Dispatches requests for fraud scoring [gRPC over TLS with Circuit Breaker]"
  - source: "Usage Metering Emitter"
    destination: "AWS Kinesis Data Firehose"
    description: "Asynchronously streams usage metadata for billing and SLA tracking [HTTPS]"