level: component
scope: "Component diagram for the Fraud Analyst SPA container"
parentContainer:
  name: "Fraud Analyst SPA"
elements:
  - type: "component"
    name: "Routing & Auth Module"
    technology: "TypeScript / React Router"
    description: "Manages OAuth2/OIDC sessions and application routing."
  - type: "component"
    name: "Case Management View & Feedback Component"
    technology: "React"
    description: "Provides the interface for fraud analysts to review suspicious transactions and submit feedback."
  - type: "component"
    name: "XAI Visualization Component"
    technology: "D3.js / Chart.js"
    description: "Renders explainable AI (XAI) feature-contribution graphs."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios / Fetch"
    description: "Handles secure communication with strict CORS and token-header injection."
relationships:
  - source: "Routing & Auth Module"
    destination: "Fraud Analyst SPA"
    description: "Manages OAuth2/OIDC sessions"
  - source: "Case Management View & Feedback Component"
    destination: "API Client Layer"
    description: "Triggers data payloads [HTTPS/REST]"
  - source: "API Client Layer"
    destination: "Case Management Backend Container"
    description: "Transmits API requests with OAuth2 bearer tokens [HTTPS/REST]"