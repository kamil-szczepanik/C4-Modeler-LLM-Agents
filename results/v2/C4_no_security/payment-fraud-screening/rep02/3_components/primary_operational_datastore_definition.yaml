level: component
scope: "Component diagram for the Primary Operational Datastore container"
parentContainer:
  name: "Primary Operational Datastore"
elements:
  - type: "component"
    name: "Case Management Schema & Repository Component"
    technology: "Amazon Aurora PostgreSQL Serverless v2, Native PostgreSQL Row-Level Security"
    description: "Manages transactional data, case workflows, and analyst overrides with strict PCI-DSS isolation."
  - type: "component"
    name: "Transaction & Decision Log Component"
    technology: "Amazon Aurora PostgreSQL Serverless v2"
    description: "Stores decision payloads, scores, and transactional logs, streaming aged partitions to S3."
  - type: "component"
    name: "Encryption & Masking Proxy Component"
    technology: "Native PostgreSQL pgcrypto"
    description: "Implements column-level encryption and data tokenization to meet compliance requirements."
  - type: "component"
    name: "Amazon RDS Proxy"
    technology: "Amazon RDS Proxy"
    description: "Routes and pools database connections to handle high transaction spikes."
  - type: "component"
    name: "Amazon Aurora PostgreSQL Serverless v2"
    technology: "Amazon Aurora PostgreSQL Serverless v2"
    description: "Provides auto-scaling relational database capabilities within the fixed infrastructure budget."
  - type: "component"
    name: "Audit & Feature Store (S3)"
    technology: "Amazon S3"
    description: "External audit store receiving aged partitions older than 30 days."
relationships:
  - source: "Case Management Backend Container"
    destination: "Case Management Schema Component"
    description: "Reads/writes analyst workflows and overrides via [SQL over TLS]"
  - source: "Real-Time Scoring Engine Container"
    destination: "Transaction & Decision Log Component"
    description: "Writes decision payloads and scores via [SQL over TLS / Connection Pooling]"
  - source: "Transaction & Decision Log Component"
    destination: "Audit & Feature Store (S3)"
    description: "Streams aged partitions older than 30 days via [AWS SDK / S3 API]"
  - source: "Amazon ECS Fargate Containers"
    destination: "Amazon RDS Proxy"
    description: "Routes and pools database connections via [TCP]"