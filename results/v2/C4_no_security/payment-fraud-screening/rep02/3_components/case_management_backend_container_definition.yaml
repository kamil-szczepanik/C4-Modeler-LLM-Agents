level: component
scope: "Component diagram for the Case Management Backend Container container"
parentContainer:
  name: "Case Management Backend Container"
elements:
  - type: "component"
    name: "Case API Router / Controller"
    technology: "Node.js/TypeScript"
    description: "Handles API requests for case reviews from the Fraud Analyst SPA."
  - type: "component"
    name: "Workflow & Assignment Engine"
    technology: "Node.js/TypeScript"
    description: "Manages case review workflows and writes transactional state."
  - type: "component"
    name: "Audit & Activity Logger"
    technology: "Node.js/TypeScript"
    description: "Provides audit logging for fraud analysts reviewing suspicious payment authorizations."
  - type: "component"
    name: "Metrics Publisher"
    technology: "Node.js/TypeScript, Amazon CloudWatch EMF"
    description: "Publishes EMF telemetry asynchronously for operational metrics."
relationships:
  - source: "Case API Router / Controller"
    destination: "Workflow & Assignment Engine"
    description: "Routes case review workflows"
  - source: "Workflow & Assignment Engine"
    destination: "Audit & Activity Logger"
    description: "Logs case activities and audit events"
  - source: "Workflow & Assignment Engine"
    destination: "Metrics Publisher"
    description: "Triggers telemetry emission"