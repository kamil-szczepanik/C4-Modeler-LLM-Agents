level: component
scope: "Component diagram for the Real-Time Scoring Engine Container container"
parentContainer:
  name: "Real-Time Scoring Engine Container"
elements:
  - type: "component"
    name: "Request Router & Token Masker"
    technology: "Rust"
    description: "Validates schemas and strips PCI data."
  - type: "component"
    name: "Feature Aggregator"
    technology: "Rust"
    description: "Fetches real-time velocity metrics via Amazon ElastiCache Serverless."
  - type: "component"
    name: "Inference Executioner"
    technology: "Rust with ONNX Runtime"
    description: "Evaluates pre-compiled ML models and deterministic business rules."
  - type: "component"
    name: "Circuit Breaker & Fallback Handler"
    technology: "Rust"
    description: "Enforces 40ms timeouts and fails-open to review."
  - type: "component"
    name: "Audit & Feature Store"
    technology: "Amazon S3 with Object Lock"
    description: "Stores 100% immutable audit logs and features for 7 years."
  - type: "component"
    name: "Amazon ElastiCache Serverless"
    technology: "Amazon ElastiCache Serverless"
    description: "Provides high-availability Redis caching within budget constraints."
  - type: "component"
    name: "API Gateway / Ingestion Service Container"
    technology: "Container"
    description: "Ingestion service for authorization requests."
relationships:
  - source: "API Gateway / Ingestion Service Container"
    destination: "Request Router & Token Masker"
    description: "Forwards authorization requests [gRPC over TLS]"
  - source: "Feature Aggregator"
    destination: "Amazon ElastiCache Serverless"
    description: "Fetches real-time velocity metrics [RESP over TCP]"
  - source: "Inference Executioner"
    destination: "Audit & Feature Store"
    description: "Writes audit logs, model versions, and feature explanations [AWS SDK / HTTPS]"