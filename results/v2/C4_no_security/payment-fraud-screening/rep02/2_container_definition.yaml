level: container
scope: "Container diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
elements:
  - type: "person"
    name: "Fraud Analyst & Risk Manager"
    description: "Internal users reviewing flagged cases, handling disputes, and managing rules."
  - type: "externalSystem"
    name: "Payment Gateway / Core Processing System"
    description: "External system sending card-not-present payment authorization requests."
  - type: "container"
    name: "API Gateway / Ingestion Service Container"
    technology: "Go, Amazon ECS Fargate"
    description: "Handles high-concurrency ingestion and minimal GC pauses for incoming payment authorizations."
  - type: "container"
    name: "Real-Time Scoring Engine Container"
    technology: "Rust / Java with GraalVM, Amazon ECS Fargate"
    description: "Powers ultra-low latency sub-50ms P99 responses for fraud scoring."
  - type: "container"
    name: "Case Management Backend Container"
    technology: "Amazon ECS Fargate"
    description: "Manages case workflows and interactions for fraud analysts."
  - type: "container"
    name: "Fraud Analyst SPA"
    technology: "React on Amazon S3 / CloudFront"
    description: "Provides the user interface for fraud analysts to review cases."
  - type: "container"
    name: "Model/Rule Deployment Pipeline Container"
    technology: "ArgoCD (GitOps), Amazon ECS Fargate"
    description: "Automates deployments of models and rules for the engineering team."
  - type: "container"
    name: "Compliance Export Container"
    technology: "AWS Lambda"
    description: "Handles compliance data exports via Amazon Athena."
  - type: "container"
    name: "Primary Operational Datastore"
    technology: "Amazon Aurora PostgreSQL Serverless v2"
    description: "Manages transactional data within the budget."
  - type: "container"
    name: "Audit & Feature Store"
    technology: "Amazon S3 with Object Lock"
    description: "Provides WORM-compliant, tamper-evident 7-year audit logging."
relationships:
  - source: "Payment Gateway / Core Processing System"
    destination: "API Gateway / Ingestion Service Container"
    description: "Sends payment authorizations for fraud screening"
    technology: "gRPC/REST over TLS"
  - source: "API Gateway / Ingestion Service Container"
    destination: "Real-Time Scoring Engine Container"
    description: "Forwards requests for real-time fraud scoring"
    technology: "gRPC over TLS"
  - source: "Fraud Analyst & Risk Manager"
    destination: "Fraud Analyst SPA"
    description: "Accesses case management UI"
    technology: "HTTPS/REST"
  - source: "Fraud Analyst SPA"
    destination: "Case Management Backend Container"
    description: "Sends API requests for case management and reviews"
    technology: "HTTPS/REST"
  - source: "Case Management Backend Container"
    destination: "Primary Operational Datastore"
    description: "Reads and writes transactional data"
    technology: "SQL over TLS"
  - source: "Real-Time Scoring Engine Container"
    destination: "Audit & Feature Store"
    description: "Writes audit logs and features"
    technology: "AWS SDK / HTTPS"
  - source: "Compliance Export Container"
    destination: "Audit & Feature Store"
    description: "Queries compliance data exports"
    technology: "Amazon Athena"