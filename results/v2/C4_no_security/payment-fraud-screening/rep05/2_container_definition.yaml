level: container
scope: "Container diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
elements:
  - type: "person"
    name: "Fraud Analysts and Compliance Officers"
    description: "Human analysts who review cases and ensure compliance."
  - type: "person"
    name: "Auditors and Regulators"
    description: "External entities that review compliance reports and audit logs."
  - type: "externalSystem"
    name: "Payment Gateway / Merchants"
    description: "API clients that send card-not-present payment authorization requests."
  - type: "externalSystem"
    name: "AWS S3 with Object Lock"
    description: "Provides immutable 7-year storage for regulatory audit compliance."
  - type: "container"
    name: "AWS API Gateway"
    technology: "AWS API Gateway"
    description: "Handles ingress traffic and TLS termination."
  - type: "container"
    name: "Fraud Scoring Engine"
    technology: "Go / Rust"
    description: "Evaluates transactions in real-time to detect fraud."
  - type: "container"
    name: "Case Management & Rules Service"
    technology: "Node.js / Go"
    description: "Provides case management and rules tools for fraud analysts."
  - type: "container"
    name: "Audit & Evidence Worker"
    technology: "Go"
    description: "Consumes audit events and writes them to immutable storage."
  - type: "container"
    name: "AWS ElastiCache (Redis)"
    technology: "Redis"
    description: "Provides sub-millisecond feature lookup for real-time scoring."
  - type: "container"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Buffers asynchronous audit logging events."
relationships:
  - source: "Payment Gateway / Merchants"
    destination: "AWS API Gateway"
    description: "Sends payment authorization requests"
    technology: "HTTPS/JSON"
  - source: "AWS API Gateway"
    destination: "Fraud Scoring Engine"
    description: "Routes payment requests for scoring"
    technology: "gRPC"
  - source: "Fraud Scoring Engine"
    destination: "AWS ElastiCache (Redis)"
    description: "Queries real-time features"
    technology: "Redis Protocol"
  - source: "Fraud Scoring Engine"
    destination: "Amazon SQS"
    description: "Publishes decision events"
    technology: "AWS SDK"
  - source: "Amazon SQS"
    destination: "Audit & Evidence Worker"
    description: "Delivers asynchronous audit events"
    technology: "SQS Poll"
  - source: "Audit & Evidence Worker"
    destination: "AWS S3 with Object Lock"
    description: "Writes tamper-evident audit logs"
    technology: "AWS SDK"
  - source: "Fraud Analysts and Compliance Officers"
    destination: "Case Management & Rules Service"
    description: "Accesses case management tools"
    technology: "HTTPS"