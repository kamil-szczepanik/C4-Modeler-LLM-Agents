level: component
scope: "Component diagram for the Amazon SQS container"
parentContainer:
  name: "Amazon SQS"
elements:
  - type: "component"
    name: "Standard Queue"
    technology: "AWS SQS Standard"
    description: "High-throughput message queue supporting 3,000 TPS for asynchronous audit events."
  - type: "component"
    name: "Dead Letter Queue (DLQ)"
    technology: "AWS SQS DLQ"
    description: "Captures failed audit messages and emits metric telemetry to AWS CloudWatch."
relationships:
  - source: "Standard Queue"
    destination: "Dead Letter Queue (DLQ)"
    description: "Routes failed messages upon processing exhaustion"