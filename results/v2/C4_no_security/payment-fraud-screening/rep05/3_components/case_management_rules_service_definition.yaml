level: component
scope: "Component diagram for the Case Management & Rules Service container"
parentContainer:
  name: "Case Management & Rules Service"
elements:
  - type: "component"
    name: "Case Workflow Controller"
    technology: "Go"
    description: "Manages fraud analyst reviews, case workflows, and routes HTTPS/REST requests from fraud analysts."
  - type: "component"
    name: "Rule Authoring Engine"
    technology: "Go, AWS AppConfig"
    description: "Handles zero-downtime rule updates and configuration storage using AWS AppConfig."
  - type: "component"
    name: "Audit Logger"
    technology: "Go, Amazon SQS"
    description: "Ensures tamper-evident audit logging and reliable message delivery."
  - type: "component"
    name: "Data Masking Proxy"
    technology: "Go"
    description: "Ensures strict PCI-DSS compliance and data masking."
  - type: "component"
    name: "Decision Metadata Extractor"
    technology: "Go"
    description: "Extracts decision metadata for fraud mitigation."
  - type: "component"
    name: "Approval Workflow Interceptor"
    technology: "Go"
    description: "Interceps and handles approval workflows for case management."
  - type: "component"
    name: "Fraud Analysts and Compliance Officers"
    technology: "Human / Browser"
    description: "Personas who interact with the Case Workflow Controller."
  - type: "component"
    name: "Risk Managers / Fraud Team Leads"
    technology: "Human / Browser"
    description: "Personas who oversee risk management and case workflows."
  - type: "component"
    name: "AWS AppConfig"
    technology: "AWS Managed Service"
    description: "Provides managed, zero-downtime rule configuration storage and state polling."
  - type: "component"
    name: "Amazon SQS"
    technology: "AWS SQS with DLQ"
    description: "Ensures reliable message delivery and tamper-evident audit logging."
relationships:
  - source: "Fraud Analysts and Compliance Officers"
    destination: "Case Workflow Controller"
    description: "HTTPS/REST"
  - source: "Risk Managers / Fraud Team Leads"
    destination: "Case Workflow Controller"
    description: "HTTPS/REST"
  - source: "Rule Authoring Engine"
    destination: "AWS AppConfig"
    description: "HTTPS/AWS SDK"
  - source: "Case Workflow Controller"
    destination: "Audit Logger"
    description: "Internal Go Function Call"
  - source: "Audit Logger"
    destination: "Amazon SQS"
    description: "HTTPS/AWS SDK"