level: component
scope: "Component diagram for the Fraud Scoring Engine container"
parentContainer:
  name: "Fraud Scoring Engine"
elements:
  - type: "component"
    name: "API Controller"
    technology: "Go / Rust"
    description: "Receives payment requests from the API Gateway and exposes endpoints for scoring."
  - type: "component"
    name: "Feature Assembler"
    technology: "Go / Rust"
    description: "Queries real-time features from cache to assemble the feature set for evaluation."
  - type: "component"
    name: "Evaluation Core"
    technology: "Go / Rust"
    description: "Applies rules and models to evaluate payment transactions and produce risk scores."
  - type: "component"
    name: "Telemetry Publisher"
    technology: "Go / Rust"
    description: "Publishes decision events asynchronously to downstream message queues."
relationships:
  - source: "API Controller"
    destination: "Feature Assembler"
    description: "Requests real-time feature assembly for incoming payments [Internal]"
  - source: "Feature Assembler"
    destination: "Evaluation Core"
    description: "Passes assembled features for scoring [Internal]"
  - source: "Evaluation Core"
    destination: "Telemetry Publisher"
    description: "Sends decision results for asynchronous publishing [Internal]"