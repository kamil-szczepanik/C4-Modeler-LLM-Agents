level: component
scope: "Component diagram for the Audit & Evidence Worker container"
parentContainer:
  name: "Audit & Evidence Worker"
elements:
  - type: "component"
    name: "SQS Consumer"
    technology: "Go"
    description: "Polls asynchronous audit events from Amazon SQS."
  - type: "component"
    name: "Canonicalizer & Sanitizer"
    technology: "Go"
    description: "Normalizes and sanitizes incoming audit event payloads."
  - type: "component"
    name: "S3 Batch Writer"
    technology: "Go / AWS SDK v2"
    description: "Writes immutable audit logs with metadata to AWS S3 with Object Lock."
  - type: "component"
    name: "SQS DLQ"
    technology: "Amazon SQS"
    description: "Routes failed writes on persistent errors."
relationships:
  - source: "SQS Consumer"
    destination: "Canonicalizer & Sanitizer"
    description: "Forwards polled audit events"
  - source: "Canonicalizer & Sanitizer"
    destination: "S3 Batch Writer"
    description: "Sends sanitized records"
  - source: "S3 Batch Writer"
    destination: "SQS DLQ"
    description: "Routes failed writes on persistent errors"