level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
  description: "Evaluates card-not-present payment authorizations for fraud at 3,000 transactions per second while providing case management for human analysts."
elements:
  - type: "person"
    name: "Fraud Analysts and Compliance Officers"
    description: "Human analysts who review cases and ensure compliance."
  - type: "person"
    name: "Auditors / Regulators"
    description: "External entities that review compliance reports and audit logs."
  - type: "externalSystem"
    name: "Payment Gateway / Merchants"
    description: "API clients that send card-not-present payment authorization requests."
  - type: "externalSystem"
    name: "AWS S3 with Object Lock and Glacier Deep Archive"
    description: "Provides immutable 7-year storage for regulatory audit compliance."
relationships:
  - source: "Payment Gateway / Merchants"
    destination: "Real-Time Payment Fraud Screening"
    description: "Sends authorization requests"
    technology: "gRPC/REST"
  - source: "Fraud Analysts and Compliance Officers"
    destination: "Real-Time Payment Fraud Screening"
    description: "Accesses the Case Management UI"
    technology: "HTTPS"
  - source: "Real-Time Payment Fraud Screening"
    destination: "AWS S3 with Object Lock and Glacier Deep Archive"
    description: "Stores tamper-evident audit logs"
    technology: "AWS SDK"
  - source: "Auditors / Regulators"
    destination: "Real-Time Payment Fraud Screening"
    description: "Accesses compliance reports"
    technology: "Secure export channels"