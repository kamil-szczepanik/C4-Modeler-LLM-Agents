level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A cloud-native SaaS platform designed for public and academic libraries to catalogue physical and digital items, manage circulation, provide self-service portals, and guarantee EU-only data residency with high-performance search."
elements:
  - type: "person"
    name: "Library Patrons & Library Staff"
    description: "Primary users accessing self-service and circulation tools."
  - type: "person"
    name: "Library Administrators & Library Auditors / Compliance Officers"
    description: "Stakeholders managing reporting and GDPR/EU audits."
  - type: "externalSystem"
    name: "Digital Content Vendor APIs"
    description: "External system for e-books and digital items."
  - type: "externalSystem"
    name: "EU Payment Gateway"
    description: "External system for processing fines and fees."
  - type: "externalSystem"
    name: "EU Notification Service"
    description: "External system for due date reminders via SMTP/Push."
  - type: "externalSystem"
    name: "EU Regulatory Compliance & Audit Portal"
    description: "External secure interface for auditors."
  - type: "externalSystem"
    name: "EU-Resident Log & Audit Sink"
    description: "External dependency for telemetry and compliance trails."
relationships:
  - source: "Library Patrons & Library Staff"
    destination: "Library Management System"
    description: "Interact with the system via self-service and circulation tools"
    technology: "HTTPS (Web/Mobile Clients)"
  - type: "externalSystem"
    source: "Library Management System"
    destination: "Digital Content Vendor APIs"
    description: "Connects outbound for e-books and digital items with local metadata caching"
    technology: "HTTPS/REST"
  - type: "externalSystem"
    source: "Library Management System"
    destination: "EU Payment Gateway"
    description: "Integrates for processing fines and fees over restricted EU channels"
    technology: "TLS"
  - type: "externalSystem"
    source: "Library Management System"
    destination: "EU Notification Service"
    description: "Integrates for sending due date reminders over restricted EU channels"
    technology: "SMTP/Push over TLS"
  - type: "externalSystem"
    source: "Library Administrators & Library Auditors / Compliance Officers"
    destination: "EU Regulatory Compliance & Audit Portal"
    description: "Access compliance and audit interfaces"
    technology: "HTTPS"
  - type: "externalSystem"
    source: "Library Management System"
    destination: "EU-Resident Log & Audit Sink"
    description: "Routes system telemetry and logs for compliance trails"
    technology: "Encrypted Log Stream"