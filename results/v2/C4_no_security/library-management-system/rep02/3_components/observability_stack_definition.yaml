level: component
scope: "Component diagram for the Observability Stack container"
parentContainer:
  name: "Observability Stack"
elements:
  - type: "component"
    name: "OpenTelemetry Collector"
    technology: "OpenTelemetry"
    description: "Standardized protocol for gathering metrics, logs, and traces."
  - type: "component"
    name: "Metrics Storage & Query Engine"
    technology: "Prometheus + Thanos sidecar"
    description: "Scalable time-series storage and high availability with long-term object storage."
  - type: "component"
    name: "Log Aggregator & Forwarder"
    technology: "Fluentbit / Promtail"
    description: "Lightweight log forwarding enforcing EU compliance."
  - type: "component"
    name: "Dashboard & Reporting Engine"
    technology: "Grafana"
    description: "Unified visualization for SRE technical dashboards and Administrator SLA reports."
  - type: "component"
    name: "Synthetic Monitoring Agent"
    technology: "Grafana Synthetic Monitoring / Blackbox Exporter"
    description: "Active probing to validate P99 search performance."
  - type: "component"
    name: "EU-Resident Log & Audit Sink"
    technology: "Encrypted Log Stream / HTTPS"
    description: "EU-resident log and audit sink for compliance."
  - type: "component"
    name: "EU-Region Object Storage"
    technology: "S3 API / TLS"
    description: "Long-term object storage complying with EU data residency."
relationships:
  - source: "Core Domain Services"
    destination: "OpenTelemetry Collector"
    description: "OTLP/gRPC"
  - source: "API Gateway"
    destination: "OpenTelemetry Collector"
    description: "OTLP/gRPC"
  - source: "Notification Dispatcher"
    destination: "OpenTelemetry Collector"
    description: "OTLP/gRPC"
  - source: "OpenTelemetry Collector"
    destination: "Metrics Storage & Query Engine"
    description: "Prometheus Remote Write"
  - source: "Metrics Storage & Query Engine"
    destination: "Dashboard & Reporting Engine"
    description: "PromQL/HTTP"
  - source: "Log Aggregator & Forwarder"
    destination: "EU-Resident Log & Audit Sink"
    description: "Encrypted Log Stream / HTTPS"
  - source: "Synthetic Monitoring Agent"
    destination: "API Gateway"
    description: "HTTPS/REST"
  - source: "Metrics Storage & Query Engine"
    destination: "EU-Region Object Storage"
    description: "S3 API / TLS"