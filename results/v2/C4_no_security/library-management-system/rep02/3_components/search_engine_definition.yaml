level: component
scope: "Component diagram for the Search Engine container"
parentContainer:
  name: "Search Engine"
elements:
  - type: "component"
    name: "Query Parser Component"
    technology: "Lucene Query DSL / Java"
    description: "Translates API Gateway requests, handling fuzzy matching."
  - type: "component"
    name: "Indexing & Synchronization Component"
    technology: "Kafka Connect"
    description: "Applies bulk upserts with a 1-second refresh interval."
  - type: "component"
    name: "Data Storage Nodes Component"
    technology: "Elasticsearch Index Shards"
    description: "Persists search indices on EU-localized storage with encrypted persistent volumes."
  - type: "component"
    name: "Faceted Aggregation Engine Component"
    technology: "Elasticsearch Aggregations"
    description: "Processes in-memory multi-faceted filters."
relationships:
  - source: "API Gateway"
    destination: "Query Parser Component"
    description: "Routes search queries via [gRPC / HTTPS]."
  - source: "Async Message Broker (Kafka)"
    destination: "Indexing & Synchronization Component"
    description: "Consumes catalogue mutation events via [Kafka Protocol / TCP]."