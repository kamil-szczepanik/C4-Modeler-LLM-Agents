level: component
scope: "Component diagram for the Data Storage container"
parentContainer:
  name: "Data Storage"
elements:
  - type: "component"
    name: "PostgreSQL 16 Primary"
    technology: "PostgreSQL 16"
    description: "Provides transactional persistence, native JSONB metadata support, and robust transactional integrity."
  - type: "component"
    name: "PostgreSQL 16 Read-Replicas"
    technology: "PostgreSQL 16"
    description: "Offloads non-critical read queries for staff dashboards and reporting."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Manages and pools high-concurrency client connections to prevent thread exhaustion."
  - type: "component"
    name: "Patroni"
    technology: "Patroni"
    description: "Handles automated high availability failover for the database cluster."
  - type: "component"
    name: "Debezium / Kafka Connect"
    technology: "Debezium / Apache Kafka"
    description: "Streams Write-Ahead Logs asynchronously to the audit sink."
  - type: "component"
    name: "EU-Resident Object Storage"
    technology: "Encrypted Object Storage with CMK"
    description: "Provides encrypted backups and Point-In-Time Recovery (PITR) complying with EU data residency."
  - type: "component"
    name: "Observability Stack"
    technology: "Prometheus & OpenTelemetry"
    description: "Monitors performance and operational metrics."
  - type: "component"
    name: "Core Domain Services"
    technology: "Microservice Logic"
    description: "External container that persists relational aggregates and manages connection pooling."
  - type: "component"
    name: "Staff Dashboard / Reporting"
    technology: "Web UI / Reporting Service"
    description: "External container that offloads non-critical read queries."
  - type: "component"
    name: "EU-Resident Log & Audit Sink"
    technology: "Audit Storage"
    description: "External sink receiving asynchronous Write-Ahead Logs."
relationships:
  - source: "Core Domain Services"
    destination: "PostgreSQL 16 Primary"
    description: "Persists relational aggregates [SQL / JDBC over TLS 1.3]"
  - source: "Staff Dashboard / Reporting"
    destination: "PostgreSQL 16 Read-Replicas"
    description: "Offloads non-critical read queries [SQL / JDBC over TLS 1.3]"
  - source: "PostgreSQL 16 Primary"
    destination: "EU-Resident Log & Audit Sink"
    description: "Streams Write-Ahead Logs asynchronously [Debezium / Apache Kafka]"
  - source: "Core Domain Services"
    destination: "PgBouncer"
    description: "Manages high-concurrency client connections [TCP / TLS 1.3]"