level: component
scope: "Component diagram for the Notification Dispatcher container"
parentContainer:
  name: "Notification Dispatcher"
elements:
  - type: "component"
    name: "Kafka Event Consumer Component"
    technology: "Python / FastAPI"
    description: "Consumes asynchronous events from Kafka and handles event processing."
  - type: "component"
    name: "Preference Cache Component"
    technology: "Redis"
    description: "Low-latency in-memory cache with persistence for user preferences."
  - type: "component"
    name: "Template Engine Component"
    technology: "Jinja2"
    description: "Dynamic multi-language template rendering engine."
  - type: "component"
    name: "Provider Adapter Component"
    technology: "HTTPX / SMTP Client"
    description: "Adapters for delivering messages via SMTP/HTTPS to external notification services."
  - type: "component"
    name: "Audit Emitter Component"
    technology: "Python"
    description: "Logs delivery status and forwards events for compliance auditing."
relationships:
  - source: "Kafka Event Consumer Component"
    destination: "Preference Cache Component"
    description: "Queries user settings [Redis Protocol / TLS]"
  - source: "Preference Cache Component"
    destination: "Template Engine Component"
    description: "Supplies localization context [In-Process]"
  - source: "Template Engine Component"
    destination: "Provider Adapter Component"
    description: "Forwards rendered payload [In-Process]"
  - source: "Provider Adapter Component"
    destination: "EU Notification Service"
    description: "Delivers message [SMTP/HTTPS over TLS]"
  - source: "Provider Adapter Component"
    destination: "Audit Emitter Component"
    description: "Logs delivery status [In-Process]"
  - source: "Audit Emitter Component"
    destination: "EU-Resident Log & Audit Sink"
    description: "Forwards delivery events [HTTPS/TLS]"
  - source: "Kafka Event Consumer Component"
    destination: "Observability Stack"
    description: "Traces propagation [OpenTelemetry]"