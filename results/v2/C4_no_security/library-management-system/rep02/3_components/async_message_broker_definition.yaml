level: component
scope: "Component diagram for the Async Message Broker container"
parentContainer:
  name: "Async Message Broker"
elements:
  - type: "component"
    name: "Topic Manager / Partition Coordinator"
    technology: "Apache Kafka"
    description: "Manages topic creation, partitioning, and leader election."
  - type: "component"
    name: "Event Log Storage Engine"
    technology: "Apache Kafka with LUKS"
    description: "Handles append-only disk I/O and zero-copy network transfers with LUKS volume encryption."
  - type: "component"
    name: "Consumer Group Coordinator"
    technology: "Apache Kafka"
    description: "Manages offsets and rebalances using cooperative sticky assignors."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry, Apache Avro"
    description: "Enforces Apache Avro schema validation and stores schemas in a compacted Kafka topic."
  - type: "component"
    name: "Producers & Consumers"
    technology: "Core Domain Services, Notification Dispatcher"
    description: "Core Domain Services and Notification Dispatcher interacting with the broker."
relationships:
  - source: "Producers & Consumers"
    destination: "Topic Manager / Partition Coordinator"
    description: "Publishes and consumes validated domain events [Apache Kafka Protocol]"
  - source: "Schema Registry"
    destination: "Event Log Storage Engine"
    description: "Stores schemas in a compacted Kafka topic [Apache Kafka Protocol]"
  - source: "Topic Manager / Partition Coordinator"
    destination: "Consumer Group Coordinator"
    description: "Coordinates partitions and consumer group offsets [Apache Kafka Protocol]"