level: component
scope: "Component diagram for the Patron Web/Mobile App container"
parentContainer:
  name: "Patron Web/Mobile App"
elements:
  - type: "component"
    name: "Catalogue Search UI component"
    technology: "React / React Native"
    description: "Provides the interface for searching the library catalogue while ensuring sub-800ms search performance."
  - type: "component"
    name: "Loan & Account Manager component"
    technology: "React / React Native"
    description: "Manages patron loan details and account information."
  - type: "component"
    name: "Payment & Fines Module component"
    technology: "React / React Native"
    description: "Handles payment and fines processing for library patrons."
  - type: "component"
    name: "Onboarding & Feature Flag Manager component"
    technology: "React / React Native"
    description: "Manages patron onboarding and dynamic feature flags."
relationships:
  - source: "Catalogue Search UI component"
    destination: "API Gateway"
    description: "Routes search requests and data [HTTPS / REST, WebSockets]"
  - source: "Loan & Account Manager component"
    destination: "API Gateway"
    description: "Routes loan and account requests and data [HTTPS / REST, WebSockets]"
  - source: "Payment & Fines Module component"
    destination: "API Gateway"
    description: "Routes financial and fine-related requests and data [HTTPS / REST, WebSockets]"
  - source: "Payment & Fines Module component"
    destination: "EU Payment Gateway"
    description: "Processes financial transactions [HTTPS]"
  - source: "Onboarding & Feature Flag Manager component"
    destination: "API Gateway"
    description: "Routes onboarding requests and configuration data [HTTPS / REST, WebSockets]"
  - source: "Patron Web/Mobile App"
    destination: "EU-Resident Log & Audit Sink"
    description: "Sends telemetry and error data [HTTPS]"