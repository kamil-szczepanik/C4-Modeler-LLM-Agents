level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Kong / Nginx Edge Proxy"
    technology: "Kong / Nginx"
    description: "Handles edge routing, reverse proxying, TLS/mTLS termination, and header/path-based API versioning."
  - type: "component"
    name: "Kong OAuth2 Plugin"
    technology: "Kong OAuth2 Plugin"
    description: "Performs token validation and authentication at the edge."
  - type: "component"
    name: "Kong Rate Limiting Plugin"
    technology: "Kong Rate Limiting Plugin with Redis"
    description: "Enforces dynamic request throttling backed by Redis state store."
  - type: "component"
    name: "Fluentbit Sidecar"
    technology: "Fluentbit"
    description: "Handles standardized telemetry collection, PII log scrubbing, and sidecar buffering for EU-resident audit sinks."
relationships:
  - source: "Kong / Nginx Edge Proxy"
    destination: "Kong OAuth2 Plugin"
    description: "Validates incoming requests"
  - source: "Kong / Nginx Edge Proxy"
    destination: "Kong Rate Limiting Plugin"
    description: "Checks rate limits"
  - source: "Kong / Nginx Edge Proxy"
    destination: "Fluentbit Sidecar"
    description: "Forwards logs and metrics"