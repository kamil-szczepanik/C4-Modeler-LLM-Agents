level: component
scope: "Component diagram for the Core Domain Services container"
parentContainer:
  name: "Core Domain Services"
elements:
  - type: "component"
    name: "Catalog Management Component"
    technology: "Spring Data JPA"
    description: "Manages physical and digital item cataloging."
  - type: "component"
    name: "Circulation Engine Component"
    technology: "Spring State Machine"
    description: "Handles check-in/out workflows with distributed locking."
  - type: "component"
    name: "EU Policy Enforcement Interceptor"
    technology: "Spring AOP"
    description: "Validates EU data residency rules."
  - type: "component"
    name: "Domain Event Publisher"
    technology: "Spring Kafka"
    description: "Emits cryptographically signed events."
  - type: "component"
    name: "Search Sync Synchronizer Component"
    technology: "Spring Kafka Consumer"
    description: "Transforms and buffers events for index updates."
  - type: "component"
    name: "Data Storage (PostgreSQL)"
    technology: "PostgreSQL"
    description: "Persists transactional data."
  - type: "component"
    name: "Async Message Broker (Apache Kafka)"
    technology: "Apache Kafka"
    description: "Asynchronous event broker for domain events."
  - type: "component"
    name: "Search Engine (Elasticsearch)"
    technology: "Elasticsearch"
    description: "Indexes metadata asynchronously."
relationships:
  - source: "Circulation Engine Component"
    destination: "EU Policy Enforcement Interceptor"
    description: "Intercepts commands synchronously [In-Memory Method Invocation]"
  - source: "EU Policy Enforcement Interceptor"
    destination: "Data Storage (PostgreSQL)"
    description: "Persists transactional data [SQL / JDBC]"
  - source: "Domain Event Publisher"
    destination: "Async Message Broker (Apache Kafka)"
    description: "Publishes domain events [Apache Kafka Protocol]"
  - source: "Async Message Broker (Apache Kafka)"
    destination: "Search Sync Synchronizer Component"
    description: "Consumes change events [Apache Kafka Protocol]"
  - source: "Search Sync Synchronizer Component"
    destination: "Search Engine (Elasticsearch)"
    description: "Bulk indexes metadata asynchronously [REST / HTTP with Bulk API]"