level: component
scope: "Component diagram for the Staff Dashboard container"
parentContainer:
  name: "Staff Dashboard"
elements:
  - type: "component"
    name: "Staff Dashboard (Angular SPA)"
    technology: "Angular, TypeScript"
    description: "Primary frontend container for library staff operations."
  - type: "component"
    name: "Circulation Management Module"
    technology: "Angular, TypeScript, RxJS"
    description: "Handles high-speed check-ins, check-outs, and patron lookups via reactive forms."
  - type: "component"
    name: "Cataloging & Inventory Module"
    technology: "Angular, TypeScript"
    description: "Manages physical and digital item inventories with bulk-editing and validation checks (R-01)."
  - type: "component"
    name: "API Client Service"
    technology: "Angular, TypeScript"
    description: "Encapsulates HTTP communication, JWT management, error boundaries, and interceptors."
  - type: "component"
    name: "Security & Session Manager"
    technology: "Angular, TypeScript"
    description: "Enforces auto-lockouts, rapid re-authentication, and encrypted local storage."
  - type: "component"
    name: "Telemetry Service"
    technology: "OpenTelemetry Browser SDK"
    description: "Captures Real User Monitoring (RUM) metrics using the OpenTelemetry browser SDK."
  - type: "component"
    name: "API Gateway"
    technology: "HTTPS, REST, mTLS"
    description: "External API Gateway handling backend services communication."
relationships:
  - source: "Circulation Management Module"
    destination: "Security & Session Manager"
    description: "TypeScript / Direct Method Calls"
  - source: "Cataloging & Inventory Module"
    destination: "Security & Session Manager"
    description: "TypeScript / Direct Method Calls"
  - source: "Circulation Management Module"
    destination: "API Client Service"
    description: "TypeScript / Direct Method Calls"
  - source: "Cataloging & Inventory Module"
    destination: "API Client Service"
    description: "TypeScript / Direct Method Calls"
  - source: "API Client Service"
    destination: "API Gateway"
    description: "HTTPS / REST / mTLS"
  - source: "API Client Service"
    destination: "Telemetry Service"
    description: "OpenTelemetry SDK / HTTPS"