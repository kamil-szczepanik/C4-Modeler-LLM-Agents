level: component
scope: "Component diagram for the Self-Service Check-In/Out Kiosk container"
parentContainer:
  name: "Self-Service Check-In/Out Kiosk"
elements:
  - type: "component"
    name: "UI Presentation Layer"
    technology: "React"
    description: "Provides the touch UI for patron autonomy and interaction during check-in/out."
  - type: "component"
    name: "Kiosk Core Logic Controller"
    technology: "Node.js / Electron Main Process"
    description: "Manages core application flow, orchestration, and IPC communication."
  - type: "component"
    name: "Local Sync & Cache Store"
    technology: "SQLite / IndexedDB with SQLCipher"
    description: "Provides offline-resilient circulation services and encrypted local storage for EU data residency."
  - type: "component"
    name: "Hardware Abstraction Layer"
    technology: "Node.js Addons"
    description: "Interfaces with peripherals via USB/Serial native bindings."
  - type: "component"
    name: "User-Facing Error Recovery & Assisted Fallback Component"
    technology: "Electron / React"
    description: "Handles user-facing error recovery and provides assisted fallbacks."
  - type: "component"
    name: "API Gateway"
    technology: "Kong / Nginx"
    description: "Facilitates secure communication and syncs offline transactions via HTTPS / REST over mTLS."
relationships:
  - source: "UI Presentation Layer"
    destination: "Kiosk Core Logic Controller"
    description: "Communicates via IPC"
  - source: "Kiosk Core Logic Controller"
    destination: "Hardware Abstraction Layer"
    description: "Interfaces with peripherals via USB/Serial native bindings"
  - source: "Kiosk Core Logic Controller"
    destination: "API Gateway"
    description: "Syncs offline transactions via HTTPS / REST over mTLS"