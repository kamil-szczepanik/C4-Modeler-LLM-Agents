level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons & Library Staff"
    description: "Primary users accessing self-service and circulation tools."
  - type: "person"
    name: "Library Administrators & Library Auditors / Compliance Officers"
    description: "Stakeholders managing reporting and GDPR/EU audits."
  - type: "externalSystem"
    name: "Digital Content Vendor APIs"
    description: "External system for e-books and digital items."
  - type: "externalSystem"
    name: "EU Payment Gateway"
    description: "External system for processing fines and fees."
  - type: "externalSystem"
    name: "EU Notification Service"
    description: "External system for due date reminders via SMTP/Push."
  - type: "externalSystem"
    name: "EU Regulatory Compliance & Audit Portal"
    description: "External secure interface for auditors."
  - type: "externalSystem"
    name: "EU-Resident Log & Audit Sink"
    description: "External dependency for telemetry and compliance trails."
  - type: "container"
    name: "Patron Web/Mobile App"
    technology: "React / React Native"
    description: "Frontend UI prioritizing WCAG 2.1 AA accessibility for patrons."
  - type: "container"
    name: "Staff Dashboard"
    technology: "Angular"
    description: "Administrative cataloging and branch operations interface."
  - type: "container"
    name: "Self-Service Check-In/Out Kiosk"
    technology: "Electron / React"
    description: "Lightweight container supporting offline fallback."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / Nginx"
    description: "Single entry point enforcing TLS, mTLS, and OAuth2."
  - type: "container"
    name: "Core Domain Services"
    technology: "Java / Spring Boot"
    description: "Microservices handling circulation and cataloging."
  - type: "container"
    name: "Search Engine"
    technology: "Elasticsearch"
    description: "Container guaranteeing <800ms response times (R-05)."
  - type: "container"
    name: "Data Storage"
    technology: "PostgreSQL"
    description: "Transactional database hosted exclusively in the EU."
  - type: "container"
    name: "Async Message Broker"
    technology: "Apache Kafka"
    description: "Decouples batch tasks and event distribution."
  - type: "container"
    name: "Notification Dispatcher"
    technology: "Python / FastAPI"
    description: "Service with rate-limiting and DLQ integration."
  - type: "container"
    name: "Observability Stack"
    technology: "OpenTelemetry, Prometheus, Grafana"
    description: "Centralized observability stack routed to EU-Resident Log & Audit Sink."
relationships:
  - source: "Library Patrons & Library Staff"
    destination: "Patron Web/Mobile App"
    description: "Accesses patron application via secure channels"
    technology: "HTTPS / mTLS"
  - source: "Library Patrons & Library Staff"
    destination: "Staff Dashboard"
    description: "Accesses staff operations interface"
    technology: "HTTPS / mTLS"
  - source: "Library Patrons & Library Staff"
    destination: "Self-Service Check-In/Out Kiosk"
    description: "Uses self-service kiosk for check-in/out"
    technology: "HTTPS / mTLS"
  - source: "Patron Web/Mobile App"
    destination: "API Gateway"
    description: "Routes requests through API gateway"
    technology: "HTTPS"
  - source: "Staff Dashboard"
    destination: "API Gateway"
    description: "Routes requests through API gateway"
    technology: "HTTPS"
  - source: "Self-Service Check-In/Out Kiosk"
    destination: "API Gateway"
    description: "Routes requests through API gateway"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Core Domain Services"
    description: "Routes traffic to core services"
    technology: "gRPC / HTTPS"
  - source: "API Gateway"
    destination: "Search Engine"
    description: "Routes search queries"
    technology: "gRPC / HTTPS"
  - source: "Core Domain Services"
    destination: "Data Storage"
    description: "Persists transactional data"
    technology: "SQL / JDBC"
  - source: "Core Domain Services"
    destination: "Async Message Broker"
    description: "Publishes domain events"
    technology: "Apache Kafka Protocol"
  - source: "Async Message Broker"
    destination: "Notification Dispatcher"
    description: "Consumes events for notifications"
    technology: "Apache Kafka Protocol"
  - source: "Notification Dispatcher"
    destination: "EU Notification Service"
    description: "Sends notifications via external service"
    technology: "SMTP/Push over TLS"
  - source: "Observability Stack"
    destination: "EU-Resident Log & Audit Sink"
    description: "Routes system telemetry and audit logs"
    technology: "Encrypted Log Stream"
  - source: "Core Domain Services"
    destination: "Observability Stack"
    description: "Sends metrics and traces"
    technology: "OpenTelemetry"
  - source: "Notification Dispatcher"
    destination: "Observability Stack"
    description: "Sends metrics and traces"
    technology: "OpenTelemetry"
  - source: "API Gateway"
    destination: "Observability Stack"
    description: "Sends metrics and traces"
    technology: "OpenTelemetry"