level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public users who access self-service portals."
  - type: "person"
    name: "Librarians"
    description: "Staff members who manage circulation and operations."
  - type: "person"
    name: "Circulation Staff"
    description: "Staff members who handle circulation and loans."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators who manage the system and configuration."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe/Adyen for fine processing."
  - type: "externalSystem"
    name: "Notification Service"
    description: "SendGrid/Twilio for alerts."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Keycloak / OAuth2/OIDC for authentication."
  - type: "externalSystem"
    name: "External Academic Identity Federation"
    description: "SAML/EduPerson for institutional single-sign-on."
  - type: "externalSystem"
    name: "Digital Content Repositories"
    description: "Publishers providing digital content."
  - type: "externalSystem"
    name: "Centralized Observability Platform"
    description: "Prometheus/Grafana/Loki deployed in EU infrastructure for monitoring."
  - type: "container"
    name: "Patron Web Portal"
    technology: "React, Nginx"
    description: "Provides self-service portals for library patrons."
  - type: "container"
    name: "Staff Management Portal"
    technology: "Angular, Nginx"
    description: "Provides circulation and management interfaces for staff."
  - type: "container"
    name: "Core API Gateway"
    technology: "Spring Cloud Gateway"
    description: "Handles centralized routing, rate-limiting, and JWT validation."
  - type: "container"
    name: "Catalog & Search Service"
    technology: "Spring Boot, Elasticsearch"
    description: "Dedicated search engine for high-performance catalog searches."
  - type: "container"
    name: "Circulation Service"
    technology: "Quarkus, PostgreSQL"
    description: "Transactional datastore and service for loans, fines, and circulation data."
  - type: "container"
    name: "Notification Worker"
    technology: "Node.js"
    description: "Consumes async events to process notifications."
  - type: "container"
    name: "RabbitMQ"
    technology: "RabbitMQ"
    description: "Asynchronous event broker with dead-letter exchanges for resilient messaging."
relationships:
  - source: "Library Patrons"
    destination: "Patron Web Portal"
    description: "Accesses self-service catalog and account features"
    technology: "HTTPS"
  - source: "Librarians"
    destination: "Staff Management Portal"
    description: "Manages circulation and cataloging"
    technology: "HTTPS"
  - source: "Circulation Staff"
    destination: "Staff Management Portal"
    description: "Manages circulation and operations"
    technology: "HTTPS"
  - source: "Library Administrators"
    destination: "Staff Management Portal"
    description: "Configures and manages system operations"
    technology: "HTTPS"
  - source: "Patron Web Portal"
    destination: "Core API Gateway"
    description: "Sends API requests for catalog and account actions"
    technology: "HTTPS REST/GraphQL"
  - source: "Staff Management Portal"
    destination: "Core API Gateway"
    description: "Sends API requests for staff management operations"
    technology: "HTTPS REST/GraphQL"
  - source: "Core API Gateway"
    destination: "Catalog & Search Service"
    description: "Routes search queries"
    technology: "gRPC"
  - source: "Core API Gateway"
    destination: "Circulation Service"
    description: "Routes transaction requests"
    technology: "gRPC"
  - source: "Circulation Service"
    destination: "RabbitMQ"
    description: "Publishes and synchronizes circulation events"
    technology: "AMQP over TLS"
  - source: "Catalog & Search Service"
    destination: "RabbitMQ"
    description: "Publishes and synchronizes catalog events"
    technology: "AMQP over TLS"
  - source: "Notification Worker"
    destination: "RabbitMQ"
    description: "Consumes events"
    technology: "AMQP over TLS"
  - source: "Notification Worker"
    destination: "Notification Service"
    description: "Calls external notification service"
    technology: "HTTPS"
  - source: "Patron Web Portal"
    destination: "Centralized Observability Platform"
    description: "Ships telemetry and logs"
    technology: "gRPC"
  - source: "Staff Management Portal"
    destination: "Centralized Observability Platform"
    description: "Ships telemetry and logs"
    technology: "gRPC"
  - source: "Core API Gateway"
    destination: "Centralized Observability Platform"
    description: "Ships telemetry and logs"
    technology: "gRPC"
  - source: "Catalog & Search Service"
    destination: "Centralized Observability Platform"
    description: "Ships telemetry and logs"
    technology: "gRPC"
  - source: "Circulation Service"
    destination: "Centralized Observability Platform"
    description: "Ships telemetry and logs"
    technology: "gRPC"
  - source: "Notification Worker"
    destination: "Centralized Observability Platform"
    description: "Ships telemetry and logs"
    technology: "gRPC"
  - source: "RabbitMQ"
    destination: "Centralized Observability Platform"
    description: "Ships telemetry and logs"
    technology: "gRPC"