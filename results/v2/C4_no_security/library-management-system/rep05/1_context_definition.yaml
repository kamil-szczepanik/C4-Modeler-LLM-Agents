# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Provides catalogue management, circulation, and self-service portals for public and academic libraries while ensuring high-performance operations and compliance with strict regulatory constraints."
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public users who access self-service portals."
  - type: "person"
    name: "Librarians and Circulation Staff"
    description: "Staff members who manage circulation and operations."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators who manage the system and configuration."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe/Adyen for fine processing."
  - type: "externalSystem"
    name: "Notification Service"
    description: "SendGrid/Twilio for alerts."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Keycloak / OAuth2/OIDC for authentication."
  - type: "externalSystem"
    name: "External Academic Identity Federation"
    description: "SAML/EduPerson for institutional single-sign-on."
  - type: "externalSystem"
    name: "Digital Content Repositories and Publishers"
    description: "Publishers providing digital content."
  - type: "externalSystem"
    name: "Centralized Observability Platform"
    description: "Prometheus/Grafana/Loki deployed in EU infrastructure for monitoring."
relationships:
  - source: "Library Patrons"
    destination: "Library Management System"
    description: "Interact for self-service and cataloging"
    technology: "HTTPS/REST"
  - source: "Librarians and Circulation Staff"
    destination: "Library Management System"
    description: "Interact for cataloging and circulation management"
    technology: "HTTPS/REST"
  - source: "Library Administrators"
    destination: "Library Management System"
    description: "Manage system operations"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Processes fines"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "Notification Service"
    description: "Sends alerts"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OAuth2/OIDC"
  - source: "Library Management System"
    destination: "External Academic Identity Federation"
    description: "Authenticates academic users via single-sign-on"
    technology: "SAML"
  - source: "Library Management System"
    destination: "Digital Content Repositories and Publishers"
    description: "Fetches digital content"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "Centralized Observability Platform"
    description: "Sends metrics and logs for observability"
    technology: "Prometheus/Grafana/Loki"