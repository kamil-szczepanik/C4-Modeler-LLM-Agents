level: component
scope: "Component diagram for the Circulation Service container"
parentContainer:
  name: "Circulation Service"
elements:
  - type: "component"
    name: "Circulation API Resource"
    technology: "Quarkus RESTEasy / gRPC Endpoint"
    description: "Handles incoming gRPC requests from the Core API Gateway for loans, renewals, and fines."
  - type: "component"
    name: "Loan Management Component"
    technology: "Quarkus CDI Bean"
    description: "Manages loan processing and renewals logic."
  - type: "component"
    name: "Fine & Fee Component"
    technology: "Quarkus CDI Bean"
    description: "Manages fine and fee calculations and processing."
  - type: "component"
    name: "Circulation Event Publisher"
    technology: "SmallRye Reactive Messaging"
    description: "Publishes circulation events asynchronously."
  - type: "component"
    name: "Circulation Repository Layer"
    technology: "Hibernate/Panache"
    description: "Handles data persistence and database operations."
  - type: "component"
    name: "SmallRye Fault Tolerance"
    technology: "SmallRye Fault Tolerance"
    description: "Implements circuit breakers for database and downstream resilience."
  - type: "component"
    name: "OpenTelemetry"
    technology: "OpenTelemetry"
    description: "Provides distributed tracing across API Gateway, components, and messaging."
  - type: "component"
    name: "Core API Gateway"
    technology: "External Dependency"
    description: "External API gateway routing traffic to the Circulation Service."
  - type: "component"
    name: "RabbitMQ"
    technology: "AMQP over TLS"
    description: "External message broker used for real-time, event-driven patron updates."
  - type: "component"
    name: "PostgreSQL"
    technology: "PostgreSQL (regional)"
    description: "Regional database for transactional reliability with encryption-at-rest."
  - type: "component"
    name: "Centralized Observability Platform"
    technology: "gRPC"
    description: "Platform for centralized logging, metrics, and tracing."
relationships:
  - source: "Core API Gateway"
    destination: "Circulation API Resource"
    description: "gRPC"
  - source: "Circulation API Resource"
    destination: "Loan Management Component"
    description: "In-process Method Invocation"
  - source: "Circulation API Resource"
    destination: "Fine & Fee Component"
    description: "In-process Method Invocation"
  - source: "Loan Management Component"
    destination: "Circulation Repository Layer"
    description: "JDBC over TLS"
  - source: "Fine & Fee Component"
    destination: "Circulation Repository Layer"
    description: "JDBC over TLS"
  - source: "Loan Management Component"
    destination: "Circulation Event Publisher"
    description: "SmallRye Reactive Messaging"
  - source: "Fine & Fee Component"
    destination: "Circulation Event Publisher"
    description: "SmallRye Reactive Messaging"
  - source: "Circulation Event Publisher"
    destination: "RabbitMQ"
    description: "AMQP over TLS"
  - source: "Circulation API Resource"
    destination: "Centralized Observability Platform"
    description: "gRPC"
  - source: "Loan Management Component"
    destination: "PostgreSQL"
    description: "JDBC over TLS"
  - source: "Fine & Fee Component"
    destination: "PostgreSQL"
    description: "JDBC over TLS"