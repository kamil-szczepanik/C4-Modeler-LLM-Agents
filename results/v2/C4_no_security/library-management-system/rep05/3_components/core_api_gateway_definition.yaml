level: component
scope: "Component diagram for the Core API Gateway container"
parentContainer:
  name: "Core API Gateway"
elements:
  - type: "component"
    name: "API Route Controller"
    technology: "Spring Cloud Gateway, Spring Boot"
    description: "Routes and secures all inbound HTTP/REST and GraphQL traffic from web portals."
  - type: "component"
    name: "Security and JWT Validator"
    technology: "Spring Security OAuth2"
    description: "Provides stateless JWT validation against the Identity Provider."
  - type: "component"
    name: "Rate Limiter"
    technology: "Redis"
    description: "Powers distributed rate-limiting within EU data residency constraints."
  - type: "component"
    name: "Circuit Breaker"
    technology: "Resilience4j"
    description: "Implements circuit breaking to prevent cascading downstream failures."
relationships:
  - source: "API Route Controller"
    destination: "Security and JWT Validator"
    description: "Validates incoming authentication tokens"
  - source: "API Route Controller"
    destination: "Rate Limiter"
    description: "Enforces rate limits using"
  - source: "API Route Controller"
    destination: "Circuit Breaker"
    description: "Wraps downstream calls with"