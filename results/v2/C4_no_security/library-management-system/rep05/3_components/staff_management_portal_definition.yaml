level: component
scope: "Component diagram for the Staff Management Portal container"
parentContainer:
  name: "Staff Management Portal"
elements:
  - type: "component"
    name: "Authentication & Authorization Guard"
    technology: "Angular Router Guard"
    description: "Enforces role-based access."
  - type: "component"
    name: "Core Feature Modules"
    technology: "Angular Modules: Cataloging, Circulation, Admin"
    description: "Provides role-based circulation, cataloging, and administrative interfaces."
  - type: "component"
    name: "API Client Service"
    technology: "Angular HttpClient"
    description: "Communicates via service injection."
  - type: "component"
    name: "Telemetry & Audit Interceptor"
    technology: "Angular HttpInterceptor"
    description: "Forwards requests and sends API requests with OTel and audit headers."
relationships:
  - source: "Authentication & Authorization Guard"
    destination: "Core Feature Modules"
    description: "Enforces role-based access [TypeScript Dependency]"
  - source: "Core Feature Modules"
    destination: "API Client Service"
    description: "Communicates via service injection [TypeScript Service Injection, HTTPS]"
  - source: "API Client Service"
    destination: "Telemetry & Audit Interceptor"
    description: "Forwards requests [TypeScript Dependency]"
  - source: "Telemetry & Audit Interceptor"
    destination: "Core API Gateway"
    description: "Sends API requests with OTel and audit headers [HTTPS REST/GraphQL]"
  - source: "Staff Management Portal"
    destination: "Centralized Observability Platform"
    description: "Ships browser telemetry, traces, and logs [gRPC]"