level: component
scope: "Component diagram for the Catalog & Search Service container"
parentContainer:
  name: "Catalog & Search Service"
elements:
  - type: "component"
    name: "Search API Controller"
    technology: "Spring MVC controller"
    description: "Handling gRPC requests from the Core API Gateway."
  - type: "component"
    name: "Search Query Engine"
    technology: "Spring Data Elasticsearch component"
    description: "Executing faceted search and auto-suggestion queries with typo tolerance."
  - type: "component"
    name: "Catalog Indexer"
    technology: "Spring Integration and RabbitMQ Client"
    description: "Consuming item mutation events via AMQP over TLS."
  - type: "component"
    name: "Elasticsearch Cluster"
    technology: "Kubernetes StatefulSets with persistent volumes"
    description: "Stateful search backend deployed via Kubernetes StatefulSets."
  - type: "component"
    name: "RabbitMQ"
    technology: "Message broker"
    description: "Managing event synchronization and Dead Letter Queues (DLQ)."
relationships:
  - source: "Core API Gateway"
    destination: "Search API Controller"
    description: "Routes search queries using [gRPC]."
  - source: "Search API Controller"
    destination: "Search Query Engine"
    description: "Invokes methods via internal [Java interface]."
  - source: "Catalog Indexer"
    destination: "Elasticsearch Cluster"
    description: "Synchronizes index data using [HTTP/REST over TLS]."
  - source: "RabbitMQ"
    destination: "Catalog Indexer"
    description: "Publishes mutation events using [AMQP over TLS]."
  - source: "Search Query Engine"
    destination: "Centralized Observability Platform"
    description: "Ships telemetry and metrics using [gRPC]."