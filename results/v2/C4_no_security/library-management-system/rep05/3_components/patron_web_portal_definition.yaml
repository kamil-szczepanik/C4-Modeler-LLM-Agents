level: component
scope: "Component diagram for the Patron Web Portal container"
parentContainer:
  name: "Patron Web Portal"
elements:
  - type: "component"
    name: "Routing & Shell Layout Component"
    technology: "React Router"
    description: "Handles client-side routing and page layout framing for the portal."
  - type: "component"
    name: "Catalog Search & Discovery Component"
    technology: "React"
    description: "Provides the self-service interface for searching and discovering catalog items."
  - type: "component"
    name: "Patron Account Dashboard Component"
    technology: "React"
    description: "Manages patron account details, loans, and self-service actions."
  - type: "component"
    name: "Auth & Session Management Component"
    technology: "React, OAuth2/OIDC SDK, Consent Management Sub-component"
    description: "Handles authentication, session management, and user consent compliance."
  - type: "component"
    name: "Notification Center Component"
    technology: "React"
    description: "Displays real-time notifications to the library patron."
  - type: "component"
    name: "API Client Service Component"
    technology: "TypeScript, Axios"
    description: "Manages HTTP communication and distributed tracing headers for backend API calls."
relationships:
  - source: "Routing & Shell Layout Component"
    destination: "Catalog Search & Discovery Component"
    description: "Renders within layout"
  - source: "Routing & Shell Layout Component"
    destination: "Patron Account Dashboard Component"
    description: "Renders within layout"
  - source: "Routing & Shell Layout Component"
    destination: "Notification Center Component"
    description: "Renders within layout"
  - source: "Catalog Search & Discovery Component"
    destination: "API Client Service Component"
    description: "Uses for API requests"
  - source: "Patron Account Dashboard Component"
    destination: "API Client Service Component"
    description: "Uses for API requests"
  - source: "Auth & Session Management Component"
    destination: "API Client Service Component"
    description: "Uses for authenticated API requests"