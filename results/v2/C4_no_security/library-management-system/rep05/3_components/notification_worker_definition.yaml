level: component
scope: "Component diagram for the Notification Worker container"
parentContainer:
  name: "Notification Worker"
elements:
  - type: "component"
    name: "Event Consumer Component"
    technology: "amqplib (Node.js)"
    description: "Consumes messages securely using amqplib."
  - type: "component"
    name: "Retry & Circuit Breaker Component"
    technology: "Opossum (Node.js)"
    description: "Manages transient failures using Opossum logic with exponential backoff."
  - type: "component"
    name: "DLQ Producer & Native Exchanges"
    technology: "Node.js"
    description: "Handles permanently failed messages for administrative visibility."
  - type: "component"
    name: "Notification History Store Component"
    technology: "PostgreSQL (EU-Hosted Managed)"
    description: "EU-hosted managed PostgreSQL instance for audit trails and delivery states."
  - type: "component"
    name: "Preference Cache Component"
    technology: "Redis (Replicated Cluster)"
    description: "Replicated Redis cluster caching patron communication preferences."
  - type: "component"
    name: "Telemetry Logger Component"
    technology: "OpenTelemetry SDK (Node.js)"
    description: "Ships structured logs via OpenTelemetry SDK."
relationships:
  - source: "Event Consumer Component"
    destination: "RabbitMQ"
    description: "Consumes async events [AMQP over TLS]."
  - source: "Retry & Circuit Breaker Component"
    destination: "Notification Service"
    description: "Calls external provider for delivery [HTTPS]."
  - source: "DLQ Producer & Native Exchanges"
    destination: "RabbitMQ DLQ"
    description: "Routes failed messages for administrative monitoring."
  - source: "Telemetry Logger Component"
    destination: "Centralized Observability Platform"
    description: "Ships metrics and logs [gRPC]."
  - source: "Notification Worker"
    destination: "Notification History Store Component"
    description: "Persists audit logs and history [TCP/TLS]."
  - source: "Notification Worker"
    destination: "Preference Cache Component"
    description: "Queries communication preferences [Redis Protocol/TLS]."