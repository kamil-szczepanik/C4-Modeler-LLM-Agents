level: component
scope: "Component diagram for the RabbitMQ container"
parentContainer:
  name: "RabbitMQ"
elements:
  - type: "component"
    name: "RabbitMQ Broker Container"
    technology: "RabbitMQ / Kubernetes"
    description: "Core broker container deployed with persistent volume provisioned IOPS and resource quotas."
  - type: "component"
    name: "Exchange Routing Layer"
    technology: "AMQP 0-9-1 Topic Exchanges"
    description: "Routes published events to appropriate queues based on topics."
  - type: "component"
    name: "Quorum Queue Instances"
    technology: "Raft-backed Queues"
    description: "Provides crash-safe metadata replication across availability zones and delivers notification payloads."
  - type: "component"
    name: "Publisher Confirm & Flow Control Module"
    technology: "AMQP over TLS Module"
    description: "Handles event publishing with confirms enabled for reliable messaging."
  - type: "component"
    name: "Management & Telemetry Plugin"
    technology: "RabbitMQ Plugin / HTTPS"
    description: "Ships telemetry and queue metrics to the centralized observability platform."
  - type: "component"
    name: "Dead-Letter Exchanges"
    technology: "AMQP"
    description: "Retains failed messages for auditing and re-routes them to quorum queue instances."
  - type: "component"
    name: "Circulation Service"
    technology: "Quarkus"
    description: "Publishes circulation events with confirms enabled via AMQP over TLS."
  - type: "component"
    name: "Catalog & Search Service"
    technology: "Spring Boot"
    description: "Publishes catalog events to the exchange routing layer."
  - type: "component"
    name: "Notification Worker"
    technology: "Node.js"
    description: "Consumes notification payloads delivered by quorum queue instances."
  - type: "component"
    name: "Centralized Observability Platform"
    technology: "Prometheus"
    description: "Scrapes metrics from the telemetry plugin for monitoring queue depth and consumer lag."
relationships:
  - source: "Circulation Service"
    destination: "Exchange Routing Layer"
    description: "Publishes circulation events [AMQP over TLS]"
  - source: "Circulation Service"
    destination: "Publisher Confirm & Flow Control Module"
    description: "Publishes events with confirms enabled [AMQP over TLS]"
  - source: "Catalog & Search Service"
    destination: "Exchange Routing Layer"
    description: "Publishes catalog events [AMQP over TLS]"
  - source: "Quorum Queue Instances"
    destination: "Notification Worker"
    description: "Delivers notification payloads [AMQP over TLS]"
  - source: "Dead-Letter Exchanges"
    destination: "Quorum Queue Instances"
    description: "Retains failed messages for auditing [Internal AMQP]"
  - source: "Management & Telemetry Plugin"
    destination: "Centralized Observability Platform"
    description: "Ships telemetry and queue metrics [HTTPS/Prometheus]"