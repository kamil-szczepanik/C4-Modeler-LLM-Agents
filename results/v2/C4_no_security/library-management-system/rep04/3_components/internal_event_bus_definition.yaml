level: component
scope: "Component diagram for the Internal Event Bus container"
parentContainer:
  name: "Internal Event Bus"
elements:
  - type: "component"
    name: "Kafka Broker"
    technology: "Apache Kafka"
    description: "Provides durable, append-only commit logs for at-least-once delivery and zero-blocking resilience during outages."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry with Avro/JSON Schema"
    description: "Enforces strict payload contracts via Avro/JSON Schema to prevent breaking changes."
  - type: "component"
    name: "Dead Letter Queue Topics"
    technology: "Apache Kafka Topics"
    description: "Routes failed messages after max retry attempts."
relationships:
  - source: "Circulation Service"
    destination: "Kafka Broker"
    description: "Publishes circulation events [Apache Kafka Protocol]"
  - source: "Kafka Broker"
    destination: "Notification & Integration Worker"
    description: "Consumes events for notification processing [Apache Kafka Protocol]"
  - source: "Catalog & Search Service"
    destination: "Kafka Broker"
    description: "Publishes item state change events [Apache Kafka Topics]"
  - source: "Circulation Service"
    destination: "Schema Registry"
    description: "Validates event payloads prior to publishing [HTTP/REST over TLS]"
  - source: "Kafka Broker"
    destination: "Dead Letter Queue Topics"
    description: "Routes failed messages after max retry attempts [Apache Kafka Protocol]"
  - source: "Kafka Broker"
    destination: "EU-hosted Log & Metrics Aggregator"
    description: "Forwards audit logs and metrics [Syslog/OTLP over TLS]"