level: component
scope: "Component diagram for the Catalog & Search Service container"
parentContainer:
  name: "Catalog & Search Service"
elements:
  - type: "component"
    name: "Search Controller"
    technology: "Java/Spring Boot"
    description: "Exposes endpoints for catalog search and retrieval, guaranteeing sub-800ms responses."
  - type: "component"
    name: "Search Engine Client"
    technology: "Elasticsearch REST Client"
    description: "Communicates with Elasticsearch to perform fuzzy matching, typo tolerance, and faceted search."
  - type: "component"
    name: "Event Consumer"
    technology: "Apache Kafka Consumer"
    description: "Consumes asynchronous events from the internal event bus for real-time availability projections."
  - type: "component"
    name: "Content Provider Integration Client"
    technology: "HTTPS/REST Client"
    description: "Connects to external Digital Content Providers to fetch additional catalog data."
relationships:
  - source: "Search Controller"
    destination: "Search Engine Client"
    description: "Queries index"
  - type: "component"
    source: "Event Consumer"
    destination: "Search Engine Client"
    description: "Updates index"
  - type: "component"
    source: "Search Controller"
    destination: "Content Provider Integration Client"
    description: "Fetches external content"