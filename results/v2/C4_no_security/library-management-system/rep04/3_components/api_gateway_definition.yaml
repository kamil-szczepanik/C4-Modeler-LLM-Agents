level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing & Versioning Filter"
    technology: "Spring Cloud Gateway (Java/WebFlux)"
    description: "Handles non-blocking reactive routing and versioning for incoming client requests."
  - type: "component"
    name: "Tenant Context Extractor"
    technology: "Spring Cloud Gateway (Java/WebFlux)"
    description: "Extracts and propagates tenant context to ensure secure multi-tenant operations."
  - type: "component"
    name: "Security & Rate Limiting Filter"
    technology: "Spring Cloud Gateway (Java/WebFlux)"
    description: "Enforces security policies, rate limiting, and validates OAuth2/OIDC JWT tokens."
  - type: "component"
    name: "Resilience & Tracing Filter"
    technology: "Spring Cloud Gateway (Java/WebFlux with Resilience4j)"
    description: "Provides circuit breaking, fault tolerance, and tracing telemetry for requests."
relationships:
  - source: "Routing & Versioning Filter"
    destination: "Catalog & Search Service"
    description: "Routes search and catalog requests [internal gRPC]"
  - source: "Routing & Versioning Filter"
    destination: "Circulation Service"
    description: "Routes circulation requests [internal gRPC]"
  - source: "Security & Rate Limiting Filter"
    destination: "Identity Provider"
    description: "Validates OAuth2/OIDC JWT tokens [HTTPS/REST]"
  - source: "Resilience & Tracing Filter"
    destination: "EU-hosted Log & Metrics Aggregator"
    description: "Forwards access logs and tracing metrics [OTLP/gRPC]"
  - source: "Routing & Versioning Filter"
    destination: "Internal Event Bus"
    description: "Publishes gateway audit events [Apache Kafka]"