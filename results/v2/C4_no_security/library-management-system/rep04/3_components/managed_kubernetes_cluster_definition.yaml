level: component
scope: "Component diagram for the Managed Kubernetes Cluster container"
parentContainer:
  name: "Managed Kubernetes Cluster"
elements:
  - type: "component"
    name: "Managed Kubernetes Cluster"
    technology: "Kubernetes (EKS/AKS in EU-central)"
    description: "EU-central deployment infrastructure enforcing data residency and cloud container orchestration."
  - type: "component"
    name: "GitOps Operator"
    technology: "ArgoCD"
    description: "Declarative continuous delivery and zero-downtime rolling updates."
  - type: "component"
    name: "Ingress Controller"
    technology: "Nginx Ingress"
    description: "Routes external traffic with TLS termination and edge routing."
  - type: "component"
    name: "Cluster Autoscaler & HPA"
    technology: "Kubernetes Autoscaling"
    description: "Dynamically scales nodes and pods for cost efficiency during off-peak hours."
  - type: "component"
    name: "OpenTelemetry Collector & Fluentbit"
    technology: "OpenTelemetry & Fluentbit DaemonSets"
    description: "Batch-exporting logs, metrics, and API server audit logs for observability and compliance."
  - type: "component"
    name: "Backup Tool"
    technology: "Velero"
    description: "Automated encrypted cluster-state backups targeting EU object storage for disaster recovery."
relationships:
  - source: "Managed Kubernetes Cluster"
    destination: "EU-hosted Log & Metrics Aggregator"
    description: "Streams telemetry and audit logs [OpenTelemetry/Vector over HTTPS]."
  - source: "API Gateway"
    destination: "Ingress Controller"
    description: "Routes external user and staff traffic [HTTPS]."
  - source: "GitOps Operator"
    destination: "Git Repository"
    description: "Pulls declarative manifests for continuous deployment [HTTPS]."