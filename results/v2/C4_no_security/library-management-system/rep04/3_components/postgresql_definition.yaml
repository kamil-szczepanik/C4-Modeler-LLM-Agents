level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "Core Relational Engine"
    technology: "PostgreSQL 16"
    description: "Core relational engine managing structured tables (Patrons, Inventory, Circulation_Transactions) with ACID compliance."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Connection pooler managing backend processes over TCP to prevent connection thread exhaustion."
  - type: "component"
    name: "Audit Logging Extension"
    technology: "pgaudit"
    description: "Audit logging extension for DDL/DML security activity."
  - type: "component"
    name: "Partition Manager"
    technology: "pg_partman"
    description: "Extension for time-based partitioning and efficient GDPR data purging of Circulation_Transactions."
  - type: "component"
    name: "Security & Automation"
    technology: "PL/pgSQL Triggers & RLS"
    description: "Implemented for automated PII anonymization and masking."
relationships:
  - source: "PgBouncer"
    destination: "Core Relational Engine"
    description: "Forwards queries [TCP / PostgreSQL Wire Protocol]"
  - source: "Core Relational Engine"
    destination: "Partition Manager"
    description: "Executes partition drop operations for GDPR data purging"
  - source: "Core Relational Engine"
    destination: "Audit Logging Extension"
    description: "Records DDL/DML security activity"