level: component
scope: "Component diagram for the Notification & Integration Worker container"
parentContainer:
  name: "Notification & Integration Worker"
elements:
  - type: "component"
    name: "Event Consumer Component"
    technology: "KafkaJS / Kafka-python"
    description: "Consumes domain events via TLS from the Internal Event Bus."
  - type: "component"
    name: "Routing & Template Engine"
    technology: "Nunjucks / Jinja2"
    description: "Compiles localized messages."
  - type: "component"
    name: "Dispatch & Retry Manager"
    technology: "Axios / HTTPX, Redis, Kafka DLQ"
    description: "Sends outbound alerts and manages retries/delivery status."
  - type: "component"
    name: "Audit Logger & Publisher"
    technology: "OpenTelemetry SDK"
    description: "Forwards structured logs and metrics to the EU-hosted Log & Metrics Aggregator."
relationships:
  - source: "Internal Event Bus"
    destination: "Event Consumer Component"
    description: "Consumes domain events via TLS [Apache Kafka]"
  - source: "Routing & Template Engine"
    destination: "Dispatch & Retry Manager"
    description: "Compiles localized messages [Nunjucks / Jinja2]"
  - source: "Dispatch & Retry Manager"
    destination: "Notification Service"
    description: "Sends outbound alerts [HTTPS/REST]"
  - source: "Dispatch & Retry Manager"
    destination: "Internal Event Bus"
    description: "Publishes delivery status events [Apache Kafka]"
  - source: "Audit Logger & Publisher"
    destination: "EU-hosted Log & Metrics Aggregator"
    description: "Forwards structured logs and metrics [OpenTelemetry / TLS]"