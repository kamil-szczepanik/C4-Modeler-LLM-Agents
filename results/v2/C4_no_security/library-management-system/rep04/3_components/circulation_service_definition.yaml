level: component
scope: "Component diagram for the Circulation Service container"
parentContainer:
  name: "Circulation Service"
elements:
  - type: "component"
    name: "LoanManagementComponent"
    technology: "Spring @Service"
    description: "Manages loan transactions and circulation workflows."
  - type: "component"
    name: "HoldQueueComponent"
    technology: "Spring @Service"
    description: "Handles item hold queues and reservation logic."
  - type: "component"
    name: "FineManagementComponent"
    technology: "Spring @Service"
    description: "Calculates and processes patron fines."
  - type: "component"
    name: "PolicyOverrideComponent"
    technology: "Spring @Service"
    description: "Evaluates and applies circulation policy overrides."
  - type: "component"
    name: "CirculationDataRepository"
    technology: "Spring Data JPA / HikariCP"
    description: "Manages database interactions for transactional circulation data."
  - type: "component"
    name: "CirculationEventPublisher"
    technology: "Spring Cloud Stream / Apache Kafka"
    description: "Publishes domain events to the internal event bus."
  - type: "component"
    name: "PostgreSQL"
    technology: "PostgreSQL database (EU-hosted)"
    description: "Stores transactional circulation data."
  - type: "component"
    name: "Payment Gateway"
    technology: "External REST API"
    description: "Processes fine payments."
  - type: "component"
    name: "Internal Event Bus"
    technology: "Apache Kafka"
    description: "Facilitates event-driven messaging."
  - type: "component"
    name: "EU-hosted Log & Metrics Aggregator"
    technology: "OpenTelemetry"
    description: "Collects and aggregates logs and metrics."
relationships:
  - source: "LoanManagementComponent"
    destination: "CirculationDataRepository"
    description: "Reads/writes transactional data"
  - source: "HoldQueueComponent"
    destination: "CirculationDataRepository"
    description: "Reads/writes transactional data"
  - source: "FineManagementComponent"
    destination: "CirculationDataRepository"
    description: "Reads/writes transactional data"
  - source: "PolicyOverrideComponent"
    destination: "CirculationDataRepository"
    description: "Reads/writes transactional data"
  - source: "FineManagementComponent"
    destination: "Payment Gateway"
    description: "Process fine payments via HTTPS/REST"
  - source: "CirculationEventPublisher"
    destination: "Internal Event Bus"
    description: "Publishes domain events via Kafka protocol"
  - source: "CirculationDataRepository"
    destination: "PostgreSQL"
    description: "Reads/writes transactional data via PostgreSQL wire protocol"
  - source: "LoanManagementComponent"
    destination: "EU-hosted Log & Metrics Aggregator"
    description: "Routes logs/metrics via OpenTelemetry"
  - source: "HoldQueueComponent"
    destination: "EU-hosted Log & Metrics Aggregator"
    description: "Routes logs/metrics via OpenTelemetry"
  - source: "FineManagementComponent"
    destination: "EU-hosted Log & Metrics Aggregator"
    description: "Routes logs/metrics via OpenTelemetry"
  - source: "PolicyOverrideComponent"
    destination: "EU-hosted Log & Metrics Aggregator"
    description: "Routes logs/metrics via OpenTelemetry"