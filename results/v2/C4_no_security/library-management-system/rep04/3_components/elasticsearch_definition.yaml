level: component
scope: "Component diagram for the Elasticsearch container"
parentContainer:
  name: "Elasticsearch"
elements:
  - type: "component"
    name: "Catalog & Search Service"
    technology: "Java/Spring Boot"
    description: "Handling item discovery and communicating with the search infrastructure."
  - type: "component"
    name: "Routing & Coordination Component"
    technology: "Elasticsearch Node / Java API"
    description: "Handles incoming query distribution and aggregation."
  - type: "component"
    name: "Search & Query Execution Component"
    technology: "Elasticsearch Core"
    description: "Executes full-text and faceted search queries."
  - type: "component"
    name: "Indexing & Lucene Storage Component"
    technology: "Apache Lucene / NVMe Storage"
    description: "Manages inverted indices and Lucene storage."
  - type: "component"
    name: "Analysis & Tokenization Component"
    technology: "Elasticsearch Analysis Module"
    description: "Handles text normalization, stemming, and diacritic filtering."
relationships:
  - source: "Catalog & Search Service"
    destination: "Routing & Coordination Component"
    description: "HTTP/REST or Transport Client [TCP]"
  - source: "Routing & Coordination Component"
    destination: "Analysis & Tokenization Component"
    description: "Internal In-Memory Pipeline [Java API]"
  - source: "Analysis & Tokenization Component"
    destination: "Indexing & Lucene Storage Component"
    description: "Lucene Document Ingestion [In-Memory]"
  - source: "Routing & Coordination Component"
    destination: "Search & Query Execution Component"
    description: "Inter-node Transport Protocol [TCP/9300]"
  - source: "Routing & Coordination Component"
    destination: "Indexing & Lucene Storage Component"
    description: "Inter-node Transport Protocol [TCP/9300]"