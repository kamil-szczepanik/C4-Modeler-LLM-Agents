level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public members who access the self-service portals to borrow books, search catalogs, and manage their accounts."
  - type: "person"
    name: "Librarians and Circulation Staff"
    description: "Staff members responsible for managing circulation, cataloging, and daily library operations."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators who oversee system configurations, policies, and management reporting."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe EU for secure fine and fee processing."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Auth0 EU or Keycloak handling OIDC/OAuth2 authentication and GDPR compliance."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Twilio EU / SendGrid for user notifications and alerts."
  - type: "externalSystem"
    name: "Digital Content Providers"
    description: "OverDrive/Libby APIs providing access to digital media and e-content."
  - type: "externalSystem"
    name: "EU-hosted Log & Metrics Aggregator"
    description: "OpenTelemetry / Grafana Cloud EU for EU-perimeter log and metric aggregation."
  - type: "container"
    name: "Patron Web App & Staff Portal"
    technology: "TypeScript/React SPAs"
    description: "Provides scalable self-service portals and staff management tools."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx or Spring Cloud Gateway"
    description: "Routes incoming client requests to backend microservices."
  - type: "container"
    name: "Catalog & Search Service"
    technology: "Java/Spring Boot + Elasticsearch"
    description: "Provides high-performance indexing for sub-800ms search compliance and catalog management."
  - type: "container"
    name: "Circulation Service"
    technology: "Java/Spring Boot + PostgreSQL"
    description: "Manages transactional data for inventory and circulation."
  - type: "container"
    name: "Notification & Integration Worker"
    technology: "Node.js/Python"
    description: "Handles asynchronous notifications and system integrations."
  - type: "container"
    name: "Internal Event Bus"
    technology: "Apache Kafka or RabbitMQ"
    description: "Facilitates asynchronous messaging between microservices."
  - type: "container"
    name: "Managed Kubernetes Cluster"
    technology: "EKS/AKS in EU-central"
    description: "GitOps-driven deployment infrastructure on EU-central infrastructure ensuring data residency compliance."
  - type: "container"
    name: "Elasticsearch"
    technology: "Elasticsearch"
    description: "High-performance indexing database for search queries."
  - type: "container"
    name: "PostgreSQL"
    technology: "PostgreSQL"
    description: "Relational storage for inventory and circulation data."
relationships:
  - source: "Library Patrons"
    destination: "Patron Web App & Staff Portal"
    description: "Accesses self-service portal"
    technology: "HTTPS/REST and WebSockets"
  - source: "Librarians and Circulation Staff"
    destination: "Patron Web App & Staff Portal"
    description: "Accesses staff management tools"
    technology: "HTTPS/REST and WebSockets"
  - source: "Library Administrators"
    destination: "Patron Web App & Staff Portal"
    description: "Accesses system management tools"
    technology: "HTTPS/REST and WebSockets"
  - source: "Patron Web App & Staff Portal"
    destination: "API Gateway"
    description: "Sends client requests"
    technology: "HTTPS/REST and WebSockets"
  - source: "API Gateway"
    destination: "Catalog & Search Service"
    description: "Routes search and catalog requests"
    technology: "internal gRPC"
  - source: "API Gateway"
    destination: "Circulation Service"
    description: "Routes circulation requests"
    technology: "internal gRPC"
  - source: "Catalog & Search Service"
    destination: "Elasticsearch"
    description: "Executes search queries and indexing"
    technology: "Database Protocol"
  - source: "Circulation Service"
    destination: "PostgreSQL"
    description: "Reads and writes transactional data"
    technology: "Database Protocol"
  - source: "Circulation Service"
    destination: "Payment Gateway"
    description: "Processes fine payments"
    technology: "HTTPS/REST"
  - source: "Circulation Service"
    destination: "Internal Event Bus"
    description: "Publishes circulation events"
    technology: "Apache Kafka/RabbitMQ"
  - source: "Internal Event Bus"
    destination: "Notification & Integration Worker"
    description: "Consumes events for notification processing"
    technology: "Apache Kafka/RabbitMQ"
  - source: "Notification & Integration Worker"
    destination: "Notification Service"
    description: "Sends notifications to users"
    technology: "HTTPS/REST"
  - source: "Patron Web App & Staff Portal"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OIDC/OAuth2 over HTTPS"
  - source: "Catalog & Search Service"
    destination: "Digital Content Providers"
    description: "Retrieves digital content APIs"
    technology: "HTTPS/REST"
  - source: "Managed Kubernetes Cluster"
    destination: "EU-hosted Log & Metrics Aggregator"
    description: "Aggregates logs and metrics"
    technology: "OpenTelemetry over HTTPS"