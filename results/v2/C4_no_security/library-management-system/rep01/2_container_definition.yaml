# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public citizens who access self-service portals."
  - type: "person"
    name: "Librarians / Library Staff"
    description: "Library staff who perform cataloging and management workflows."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators who manage system configurations and oversight."
  - type: "externalSystem"
    name: "EU Identity Provider"
    description: "Keycloak or EU Auth0 for identity and authentication, ensuring data remains within EU boundaries."
  - type: "externalSystem"
    name: "Digital Content Delivery Network / S3-compatible EU Object Storage"
    description: "Fulfills digital item cataloging and streaming requirements."
  - type: "externalSystem"
    name: "SEPA / Stripe EU API Payment Gateway"
    description: "Handles regulated fines and fee processing."
  - type: "externalSystem"
    name: "External Notification Service"
    description: "EU Mailgun or Twilio for sending notifications."
  - type: "externalSystem"
    name: "Centralized SIEM / Monitoring Platform"
    description: "Datadog EU or Grafana Cloud Frankfurt providing centralized audit logging and telemetry within the EU."
  - type: "container"
    name: "Web Application (SPA)"
    technology: "React / TypeScript"
    description: "Provides cataloging, circulation management, and self-service portals for public and academic libraries."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx / Envoy"
    description: "Routes and manages incoming traffic to the core services."
  - type: "container"
    name: "Core Services API"
    technology: "Node.js / NestJS (Modular Monolith)"
    description: "Contains the core business logic and modular monolith services."
  - type: "container"
    name: "Search Engine"
    technology: "Elasticsearch / OpenSearch"
    description: "Provides high-performance search capabilities and isolated search indexing."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL"
    description: "Stores transactional library data with strict EU data residency."
  - type: "container"
    name: "Async Message Broker"
    technology: "RabbitMQ / Apache Kafka"
    description: "Handles asynchronous messaging and event-driven communication."
relationships:
  - source: "Library Patrons"
    destination: "Web Application (SPA)"
    description: "Accesses self-service portals"
    technology: "HTTPS"
  - source: "Librarians / Library Staff"
    destination: "Web Application (SPA)"
    description: "Performs cataloging and management workflows"
    technology: "HTTPS"
  - source: "Library Administrators"
    destination: "Web Application (SPA)"
    description: "Performs administrative workflows"
    technology: "HTTPS"
  - source: "Web Application (SPA)"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Core Services API"
    description: "Forwards routed requests"
    technology: "REST/gRPC"
  - source: "Core Services API"
    destination: "Database"
    description: "Reads and writes transactional data"
    technology: "TCP"
  - source: "Core Services API"
    destination: "Search Engine"
    description: "Queries and indexes search data"
    technology: "TCP"
  - source: "Core Services API"
    destination: "Async Message Broker"
    description: "Publishes and consumes async messages"
    technology: "AMQP"
  - source: "Core Services API"
    destination: "EU Identity Provider"
    description: "Authenticates users and manages identity data"
    technology: "OpenID Connect / OAuth 2.0"
  - source: "Core Services API"
    destination: "Digital Content Delivery Network / S3-compatible EU Object Storage"
    description: "Stores and retrieves digital items and streaming assets"
    technology: "HTTPS"
  - source: "Core Services API"
    destination: "SEPA / Stripe EU API Payment Gateway"
    description: "Processes regulated fines and fees"
    technology: "REST API over HTTPS"
  - source: "Core Services API"
    destination: "External Notification Service"
    description: "Sends notifications to patrons and staff"
    technology: "HTTPS/TLS 1.3"
  - source: "Core Services API"
    destination: "Centralized SIEM / Monitoring Platform"
    description: "Sends audit logs and telemetry data"
    technology: "HTTPS/TLS 1.3"