level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing & Tenant Resolver"
    technology: "Nginx / Envoy"
    description: "Perimeter routing, tenant resolution, and TLS 1.3 termination for EU data residency."
  - type: "component"
    name: "Rate Limiter Filter"
    technology: "Nginx / Envoy & Redis"
    description: "Performs sliding-window rate limiting using in-memory Redis cache."
  - type: "component"
    name: "Authentication/OAuth2 Proxy"
    technology: "Nginx / Envoy & EU Identity Provider"
    description: "Handles authentication, OAuth2 proxying, and JWT validation."
  - type: "component"
    name: "Versioning & Transformation Filter"
    technology: "Nginx / Envoy"
    description: "Manages API versioning, payload transformation, and WAF protection."
relationships:
  - source: "Routing & Tenant Resolver"
    destination: "Rate Limiter Filter"
    description: "Evaluates request limits [Internal]"
  - source: "Routing & Tenant Resolver"
    destination: "Authentication/OAuth2 Proxy"
    description: "Validates incoming JWT [Internal]"
  - source: "Authentication/OAuth2 Proxy"
    destination: "Versioning & Transformation Filter"
    description: "Passes authenticated requests [Internal]"
  - source: "Rate Limiter Filter"
    destination: "Redis Cache"
    description: "Queries rate limit counters [TCP/RESP]"
  - source: "Versioning & Transformation Filter"
    destination: "Core Services API"
    description: "Forwards routed requests with W3C Trace Context [REST/gRPC]"
  - source: "Routing & Tenant Resolver"
    destination: "Centralized SIEM / Monitoring Platform"
    description: "Exports Prometheus metrics and access logs [HTTPS/Prometheus scrape]"