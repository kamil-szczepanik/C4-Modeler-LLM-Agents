# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Web Application (SPA) container"
parentContainer:
  name: "Web Application (SPA)"
elements:
  - type: "component"
    name: "Routing & Layout Manager"
    technology: "React Router"
    description: "Handles client-side routing and layout management for the single-page application."
  - type: "component"
    name: "State Management Store"
    technology: "Zustand or Redux Toolkit"
    description: "Manages application state across various features and views."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios"
    description: "Configured HTTP client for communicating with backend services."
  - type: "component"
    name: "Catalog Discovery Component"
    technology: "React / TypeScript"
    description: "Provides interface components for searching and discovering library catalog items."
  - type: "component"
    name: "Circulation Desk Component"
    technology: "React / TypeScript"
    description: "Handles circulation workflows and interacts with local persistence for offline resilience."
  - type: "component"
    name: "Admin Dashboard Component"
    technology: "React / TypeScript"
    description: "Provides administrative portals and management tools."
  - type: "component"
    name: "Local Persistence Layer"
    technology: "IndexedDB / Dexie.js / Web Crypto API"
    description: "Enables robust local persistence and offline circulation resilience with client-side encryption-at-rest."
relationships:
  - source: "Circulation Desk Component"
    destination: "Local Persistence Layer"
    description: "Reads/writes cached transaction queues [IndexedDB]"