level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "PostgreSQL 16"
    technology: "PostgreSQL 16, pg_partman, pgaudit"
    description: "Relational database storing transactional library data, handling time-series data partitioning via pg_partman, and streaming security logs via pgaudit."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Sidecar connection pooler managing high concurrent connection spikes."
  - type: "component"
    name: "secure_pii Schema"
    technology: "PostgreSQL Schema"
    description: "Isolated database schema containing patron personal profiles."
  - type: "component"
    name: "postgres_exporter"
    technology: "Prometheus Exporter Sidecar"
    description: "Sidecar exporting Prometheus metrics for query latency tracking."
relationships:
  - source: "Core Services API"
    destination: "PgBouncer"
    description: "TCP/IP via PostgreSQL Wire Protocol with TLS 1.3"
  - source: "PgBouncer"
    destination: "PostgreSQL 16"
    description: "Internal connection pooling via TCP/IP"
  - source: "PostgreSQL 16"
    destination: "Centralized SIEM Platform"
    description: "Log streaming via pgaudit"