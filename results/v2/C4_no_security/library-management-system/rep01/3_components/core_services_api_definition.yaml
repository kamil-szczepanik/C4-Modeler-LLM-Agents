# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Core Services API container"
parentContainer:
  name: "Core Services API"
elements:
  - type: "component"
    name: "Catalog Module"
    technology: "Node.js / NestJS Module"
    description: "Manages physical and digital cataloging of library items."
  - type: "component"
    name: "Circulation Module"
    technology: "Node.js / NestJS Module"
    description: "Handles circulation management including checkouts, returns, and renewals."
  - type: "component"
    name: "Fines & Fees Module"
    technology: "Node.js / NestJS Module"
    description: "Tracks and processes fines and fees for library patrons."
  - type: "component"
    name: "Search Orchestrator Module"
    technology: "Node.js / NestJS Module"
    description: "Orchestrates low-latency search queries against the search engine."
  - type: "component"
    name: "Data Governance Interceptor"
    technology: "Node.js / NestJS Interceptor"
    description: "Enforces strict EU data residency and handles audit logging."
relationships:
  - source: "Catalog Module"
    destination: "Circulation Module"
    description: "Validates item availability"
  - source: "Circulation Module"
    destination: "Fines & Fees Module"
    description: "Triggers fine assessments for overdue items"
  - source: "Search Orchestrator Module"
    destination: "Catalog Module"
    description: "Retrieves catalog metadata for indexing"
  - source: "Data Governance Interceptor"
    destination: "Catalog Module"
    description: "Intercepts and validates data access compliance"
  - source: "Data Governance Interceptor"
    destination: "Circulation Module"
    description: "Intercepts and validates data access compliance"