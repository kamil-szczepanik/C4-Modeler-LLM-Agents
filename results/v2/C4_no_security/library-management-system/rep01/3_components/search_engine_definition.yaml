level: component
scope: "Component diagram for the Search Engine container"
parentContainer:
  name: "Search Engine"
elements:
  - type: "component"
    name: "Query Parser & Router Component"
    technology: "OpenSearch / Elasticsearch Internal Engine"
    description: "Submits search DSL/queries and parses incoming search requests."
  - type: "component"
    name: "Index & Ranking Component"
    technology: "OpenSearch / Elasticsearch Internal Engine"
    description: "Delivers high-performance faceted search and relevance tuning."
  - type: "component"
    name: "Ingestion & Synchronization Component"
    technology: "OpenSearch / Elasticsearch Internal Engine"
    description: "Handles catalogue updates delivered asynchronously."
  - type: "component"
    name: "Suggest & Spellcheck Component"
    technology: "OpenSearch / Elasticsearch Built-in Suggester API"
    description: "Provides auto-suggest and spellchecking capabilities."
  - type: "component"
    name: "Search Analytics Collector Component"
    technology: "OpenSearch / Elasticsearch Internal Engine"
    description: "Dispatches and collects search query logs and telemetry."
relationships:
  - source: "Query Parser & Router Component"
    destination: "Index & Ranking Component"
    description: "Routes parsed queries for execution [In-Memory]"
  - source: "Query Parser & Router Component"
    destination: "Search Analytics Collector Component"
    description: "Dispatches search query logs [In-Memory Queue]"
  - source: "Ingestion & Synchronization Component"
    destination: "Index & Ranking Component"
    description: "Updates index data [Internal Protocol]"
  - source: "Search Analytics Collector Component"
    destination: "Async Message Broker"
    description: "Emits search telemetry [AMQP / Kafka Protocol]"