level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public users who access the self-service portals."
  - type: "person"
    name: "Library Staff"
    description: "Personnel responsible for managing circulation and operations via the staff dashboard."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators who access reporting dashboards and manage configurations."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system used for processing payments."
  - type: "externalSystem"
    name: "LDAP"
    description: "External system providing authentication and identity integration."
  - type: "externalSystem"
    name: "Digital Content Providers"
    description: "External systems providing digital content to library users."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External system for handling notifications."
  - type: "externalSystem"
    name: "APM Tool"
    description: "External tool used for application performance monitoring and metrics."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / NGINX"
    description: "Handles rate limiting and TLS termination for incoming requests."
  - type: "container"
    name: "Self-Service Portal & Staff Dashboard"
    technology: "React / TypeScript"
    description: "Frontend Single Page Applications served via CDN for user and staff interaction."
  - type: "container"
    name: "Core API Application"
    technology: "Spring Boot / Java"
    description: "Handles domain logic and business operations."
  - type: "container"
    name: "Search Engine"
    technology: "OpenSearch"
    description: "Isolates heavy catalogue queries to meet search latency requirements."
  - type: "container"
    name: "Primary Database"
    technology: "Managed PostgreSQL"
    description: "Stores relational data and ensures transactional integrity in EU regions."
  - type: "container"
    name: "Message Broker"
    technology: "Kafka / RabbitMQ"
    description: "Facilitates asynchronous event publishing and consumption."
  - type: "container"
    name: "Async Workers"
    technology: "Spring Boot / Java"
    description: "Handles background processing and asynchronous tasks."
relationships:
  - source: "Library Patrons"
    destination: "Self-Service Portal & Staff Dashboard"
    description: "Interact via portals"
    technology: "HTTPS/JSON"
  - source: "Library Staff"
    destination: "Self-Service Portal & Staff Dashboard"
    description: "Interact via portals"
    technology: "HTTPS/JSON"
  - source: "Library Administrators"
    destination: "Self-Service Portal & Staff Dashboard"
    description: "Interact via portals"
    technology: "HTTPS/JSON"
  - source: "Self-Service Portal & Staff Dashboard"
    destination: "API Gateway"
    description: "Communicates via API Gateway"
    technology: "HTTPS/TLS"
  - source: "API Gateway"
    destination: "Core API Application"
    description: "Routes requests to Core API"
    technology: "HTTPS"
  - source: "Core API Application"
    destination: "Primary Database"
    description: "Queries and updates transactional data"
    technology: "gRPC/REST over TLS"
  - source: "Core API Application"
    destination: "Search Engine"
    description: "Performs catalogue searches"
    technology: "gRPC/REST over TLS"
  - source: "Core API Application"
    destination: "Message Broker"
    description: "Publishes asynchronous events"
    technology: "AMQP/Kafka"
  - source: "Async Workers"
    destination: "Message Broker"
    description: "Consumes asynchronous events"
    technology: "AMQP/Kafka"
  - source: "Core API Application"
    destination: "Payment Gateway"
    description: "Processes payments"
    technology: "HTTPS"
  - source: "Core API Application"
    destination: "LDAP"
    description: "Authenticates users"
    technology: "LDAP/TLS"
  - source: "Core API Application"
    destination: "Digital Content Providers"
    description: "Retrieves digital content"
    technology: "HTTPS"
  - source: "Core API Application"
    destination: "Notification Service"
    description: "Triggers notifications"
    technology: "HTTPS"
  - source: "Core API Application"
    destination: "APM Tool"
    description: "Streams performance metrics"
    technology: "OpenTelemetry"