level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A cloud-native SaaS solution for public and academic libraries to catalogue items, manage circulation, and provide self-service portals with strict EU-only data residency."
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public users who access the self-service portals and interact with the library system."
  - type: "person"
    name: "Library Staff and Circulation Clerks"
    description: "Personnel responsible for managing circulation and day-to-day library operations."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators who access reporting dashboards and manage system configurations."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system used for processing payments."
  - type: "externalSystem"
    name: "Third-Party Identity Provider / LDAP"
    description: "External system providing authentication and SSO integration via SAML/OIDC."
  - type: "externalSystem"
    name: "Third-Party Digital Content Providers"
    description: "External systems providing digital content to library users."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External system for handling notifications via webhooks."
  - type: "externalSystem"
    name: "Centralized Log/Audit Aggregator"
    description: "External system for aggregating logs and audit trails."
  - type: "externalSystem"
    name: "APM and Synthetic Monitoring Tool"
    description: "External tool used to validate performance SLAs and monitor system health."
relationships:
  - source: "Library Patrons"
    destination: "Library Management System"
    description: "Interact via Web/Mobile Apps"
    technology: "HTTPS"
  - source: "Library Staff and Circulation Clerks"
    destination: "Library Management System"
    description: "Manage circulation and operations via Web/Mobile Apps"
    technology: "HTTPS"
  - source: "Library Administrators"
    destination: "Library Management System"
    description: "Access reporting dashboards"
    technology: "HTTPS"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Connects with pseudonymized data"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "Third-Party Digital Content Providers"
    description: "Connects with pseudonymized data"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "Third-Party Identity Provider / LDAP"
    description: "Integrates for authentication and SSO"
    technology: "SAML/OIDC"
  - source: "Library Management System"
    destination: "Notification Service"
    description: "Sends notification triggers"
    technology: "HTTPS/Webhooks"