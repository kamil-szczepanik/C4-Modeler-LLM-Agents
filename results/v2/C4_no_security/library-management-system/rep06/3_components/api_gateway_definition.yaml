level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "TLS Termination & SSL/TLS Certificate Manager"
    technology: "Kong/NGINX"
    description: "Handles inbound HTTPS traffic and SSL/TLS certificates."
  - type: "component"
    name: "Authentication Plugin (JWT/OAuth2 Validator)"
    technology: "Kong Plugin / OIDC"
    description: "Validates tokens against the Third-Party Identity Provider."
  - type: "component"
    name: "Rate Limiting & ACL Plugin"
    technology: "Kong Plugin"
    description: "Enforces persona-based quotas for Patrons and Clerks."
  - type: "component"
    name: "Upstream Proxy & Circuit Breaker"
    technology: "Kong Proxy"
    description: "Routes to the Core API with health checks."
  - type: "component"
    name: "Telemetry & Log Exporter"
    technology: "Prometheus / Fluentd / Syslog"
    description: "Exports Prometheus metrics and streams scrubbed logs."
  - type: "component"
    name: "Error Transformer Plugin"
    technology: "Kong Plugin"
    description: "Outputs standardized, localized error payloads."
relationships:
  - source: "Self-Service Portal & Staff Dashboard"
    destination: "TLS Termination & SSL/TLS Certificate Manager"
    description: "HTTPS/TLS"
  - source: "Authentication Plugin (JWT/OAuth2 Validator)"
    destination: "Third-Party Identity Provider"
    description: "OIDC/JWKS [HTTPS]"
  - source: "Upstream Proxy & Circuit Breaker"
    destination: "Core API Application"
    description: "HTTP/REST [HTTPS]"
  - source: "Telemetry & Log Exporter"
    destination: "APM and Synthetic Monitoring Tool"
    description: "Prometheus [HTTPS]"
  - source: "Telemetry & Log Exporter"
    destination: "Centralized Log/Audit Aggregator"
    description: "Syslog/Fluentd [HTTPS]"