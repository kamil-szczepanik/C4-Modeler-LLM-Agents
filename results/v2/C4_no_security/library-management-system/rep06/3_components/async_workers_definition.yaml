level: component
scope: "Component diagram for the Async Workers container"
parentContainer:
  name: "Async Workers"
elements:
  - type: "component"
    name: "Event Consumer Engine"
    technology: "Spring Boot / Java"
    description: "Consumes asynchronous events from the message broker."
  - type: "component"
    name: "Notification Dispatcher Component"
    technology: "Spring Boot / Java"
    description: "Dispatches alerts and notifications to external services."
  - type: "component"
    name: "Index Synchronizer Component"
    technology: "Spring Boot / Java"
    description: "Updates index data in the search engine."
  - type: "component"
    name: "Fine & Payment Processor Component"
    technology: "Spring Boot / Java"
    description: "Persists financial updates and emits immutable audit logs."
relationships:
  - source: "Event Consumer Engine"
    destination: "Message Broker"
    description: "Consumes asynchronous events [Kafka Protocol / AMQP]"
  - source: "Index Synchronizer Component"
    destination: "Search Engine"
    description: "Updates index data [HTTPS/REST]"
  - source: "Notification Dispatcher Component"
    destination: "Notification Service"
    description: "Dispatches alerts [HTTPS/REST]"
  - source: "Fine & Payment Processor Component"
    destination: "Primary Database"
    description: "Persists financial updates [JDBC/TCP]"
  - source: "Fine & Payment Processor Component"
    destination: "Centralized Log/Audit Aggregator"
    description: "Emits immutable audit logs [Syslog/HTTPS]"