level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Event Log Manager"
    technology: "Apache Kafka"
    description: "Manages durable, partitioned commit logs for asynchronous event streams."
  - type: "component"
    name: "Topic Router"
    technology: "Apache Kafka"
    description: "Routes asynchronous events to the appropriate message queues and topics."
  - type: "component"
    name: "Schema Registry"
    technology: "Avro & Schema Registry"
    description: "Enforces backward-compatible event schemas between producers and consumers."
  - type: "component"
    name: "Consumer Group Coordinator"
    technology: "Apache Kafka"
    description: "Coordinates consumer groups for parallelized and scalable message processing."
  - type: "component"
    name: "Access Control & Auth Module"
    technology: "SASL/SCRAM and TLS"
    description: "Authenticates Core API Application and Async Workers via SASL/SCRAM and TLS client certificates."
relationships:
  - source: "Event Log Manager"
    destination: "Topic Router"
    description: "Supplies partitioned logs for routing"
  - source: "Topic Router"
    destination: "Consumer Group Coordinator"
    description: "Dispatches events to consumer groups"
  - source: "Schema Registry"
    destination: "Event Log Manager"
    description: "Validates event schemas for stored messages"