level: component
scope: "Component diagram for the Core API Application container"
parentContainer:
  name: "Core API Application"
elements:
  - type: "component"
    name: "Catalog & Circulation Controller"
    technology: "Spring MVC"
    description: "Manages item management and workflows."
  - type: "component"
    name: "Security & Audit Interceptor"
    technology: "Spring Security / AOP"
    description: "Handles GDPR compliance and audit logging."
  - type: "component"
    name: "Payment & External Integration Service"
    technology: "Resilience4j / Java"
    description: "Manages third-party payment and digital content integrations."
  - type: "component"
    name: "Catalog Search Component"
    technology: "Resilience4j / Java"
    description: "Handles catalogue searches with circuit breaker and database fallback."
  - type: "component"
    name: "Data Access Repository"
    technology: "Spring Data JPA / HikariCP"
    description: "Manages connections to PostgreSQL read replicas."
relationships:
  - source: "Catalog & Circulation Controller"
    destination: "Data Access Repository"
    description: "Queries and updates transactional data"
  - source: "Catalog Search Component"
    destination: "Data Access Repository"
    description: "Executes fallback queries using connection pooling"
  - source: "Payment & External Integration Service"
    destination: "Catalog & Circulation Controller"
    description: "Supports workflows with external integrations"
  - source: "Security & Audit Interceptor"
    destination: "Catalog & Circulation Controller"
    description: "Interceps requests for GDPR compliance and audit logging"