level: component
scope: "Component diagram for the Primary Database container"
parentContainer:
  name: "Primary Database"
elements:
  - type: "component"
    name: "Catalog Module"
    technology: "Managed PostgreSQL"
    description: "Stores and manages library catalogue items and metadata."
  - type: "component"
    name: "Circulation Module"
    technology: "Managed PostgreSQL"
    description: "Manages lending, returns, and circulation records for patrons."
  - type: "component"
    name: "Identity & Access Module"
    technology: "Managed PostgreSQL"
    description: "Manages patron and staff credentials, roles, and access permissions."
  - type: "component"
    name: "Read Replica Component"
    technology: "Managed PostgreSQL"
    description: "Handles read-heavy query traffic to optimize performance."
  - type: "component"
    name: "Archival & Partitioning Module"
    technology: "Managed PostgreSQL"
    description: "Handles scheduled batch cleanup jobs and data archiving."
relationships:
  - source: "Async Workers"
    destination: "Archival & Partitioning Module"
    description: "Executes scheduled batch cleanup jobs [PostgreSQL wire protocol over TLS 1.3]"