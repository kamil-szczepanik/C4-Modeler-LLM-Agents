level: component
scope: "Component diagram for the Search Engine container"
parentContainer:
  name: "Search Engine"
elements:
  - type: "component"
    name: "Search API & Routing Component"
    technology: "REST over TLS / gRPC"
    description: "Handles incoming search requests, API routing, and ensures sub-800ms response times for complex queries."
  - type: "component"
    name: "Query Execution & Scoring Engine"
    technology: "OpenSearch"
    description: "Performs full-text search, fuzzy matching, faceting, and custom synonyms."
  - type: "component"
    name: "Index Management & Ingestion Component"
    technology: "OpenSearch / Kafka Protocol"
    description: "Manages indices and processes real-time item catalogue updates asynchronously."
  - type: "component"
    name: "Cluster Coordination & Storage Nodes"
    technology: "OpenSearch Cluster / EU Cloud Managed Storage"
    description: "Stores search data, ensures EU-only data residency, and performs automated snapshots for disaster recovery."
relationships:
  - source: "Search API & Routing Component"
    destination: "Query Execution & Scoring Engine"
    description: "Routes parsed search queries for execution and scoring"
  - source: "Index Management & Ingestion Component"
    destination: "Cluster Coordination & Storage Nodes"
    description: "Persists and indexes real-time catalogue updates"
  - source: "Cluster Coordination & Storage Nodes"
    destination: "EU-Region Object Storage"
    description: "Performs automated snapshots for disaster recovery"