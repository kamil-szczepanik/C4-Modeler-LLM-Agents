level: component
scope: "Component diagram for the Self-Service Portal & Staff Dashboard container"
parentContainer:
  name: "Self-Service Portal & Staff Dashboard"
elements:
  - type: "component"
    name: "Patron Portal Component"
    technology: "React & TypeScript"
    description: "Provides the self-service interface for patrons to browse and manage library services."
  - type: "component"
    name: "Staff Circulation Dashboard Component"
    technology: "React & TypeScript"
    description: "Enables staff to manage circulation, item cataloguing, and patron activities."
  - type: "component"
    name: "Admin Analytics Dashboard Component"
    technology: "React, TypeScript, Chart.js / Recharts"
    description: "Delivers analytics rendering and administrative control panels for system administrators."
  - type: "component"
    name: "Shared API Client & State Component"
    technology: "Axios, React Query, IndexedDB & SessionStorage"
    description: "Handles API communication, client-side caching, and local state storage for EU-compliant data handling."
  - type: "component"
    name: "Guided Onboarding Component"
    technology: "React & TypeScript"
    description: "Provides guided onboarding workflows for new users of the portal and dashboard."
  - type: "component"
    name: "API Gateway (Kong / NGINX)"
    technology: "Kong / NGINX"
    description: "Routes requests securely from the frontend application to backend services."
  - type: "component"
    name: "CDN (Cloudflare / CloudFront)"
    technology: "Cloudflare / CloudFront"
    description: "Provides global asset delivery restricted to EU regions to ensure compliance with data residency constraints."
