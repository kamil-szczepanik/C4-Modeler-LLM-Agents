level: component
scope: "Component diagram for the RabbitMQ Message Broker container"
parentContainer:
  name: "RabbitMQ Message Broker"
elements:
  - type: "component"
    name: "Notification Exchange"
    technology: "RabbitMQ Exchange"
    description: "Routes published async events to the notification queue."
  - type: "component"
    name: "DLX Exchange"
    technology: "RabbitMQ Dead Letter Exchange"
    description: "Handles routing of dead-lettered messages for later inspection and replay."
  - type: "component"
    name: "Notification Queue"
    technology: "RabbitMQ Quorum Queue"
    description: "Stores critical notifications reliably for consumption by workers."
  - type: "component"
    name: "Dead Letter Queue"
    technology: "RabbitMQ Quorum Queue"
    description: "Holds failed or unprocessable messages for administrative review."
relationships:
  - source: "Notification Exchange"
    destination: "Notification Queue"
    description: "Routes messages [AMQP]"
  - source: "Dead Letter Queue"
    destination: "Notification Exchange"
    description: "Republishes messages for retry [AMQP]"