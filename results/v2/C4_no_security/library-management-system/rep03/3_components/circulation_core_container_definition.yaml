level: component
scope: "Component diagram for the Circulation & Core Container container"
parentContainer:
  name: "Circulation & Core Container"
elements:
  - type: "component"
    name: "Loan Management Component"
    technology: "Node.js/Express, TypeScript"
    description: "Enforces circulation business rules and handles high-throughput circulation checkouts."
  - type: "component"
    name: "Fine & Fee Component"
    technology: "Node.js/Express, TypeScript"
    description: "Handles automated fine calculations and fee management."
  - type: "component"
    name: "Policy Validation Engine"
    technology: "Node.js/Express, TypeScript"
    description: "Performs policy validations for circulation rules."
  - type: "component"
    name: "Core Data Access Layer"
    technology: "TypeORM, PgBouncer, PostgreSQL"
    description: "Interfaces with the PostgreSQL Database for secure data persistence, transactional data, and audit logs."
  - type: "component"
    name: "Audit & Compliance Module"
    technology: "Node.js/Express, PostgreSQL"
    description: "Ensures EU-only data residency and immutable audit logging."
  - type: "component"
    name: "Circulation & Core Container"
    technology: "Node.js/Express"
    description: "Enforces circulation business rules, automated fine calculations, policy validations, and secure data persistence."
  - type: "component"
    name: "PostgreSQL Database"
    technology: "PostgreSQL"
    description: "Relational database enforcing EU-only data residency and immutable audit logging."
  - type: "component"
    name: "RabbitMQ Message Broker"
    technology: "RabbitMQ"
    description: "Message broker utilizing transactional outbox pattern for asynchronous event publishing."
  - type: "component"
    name: "API Gateway"
    technology: "Nginx/Kong"
    description: "Routes internal traffic via gRPC."
relationships:
  - source: "API Gateway"
    destination: "Circulation & Core Container"
    description: "Routes internal traffic [gRPC]"
  - source: "Circulation & Core Container"
    destination: "RabbitMQ Message Broker"
    description: "Publishes domain events [AMQP]"
  - source: "Circulation & Core Container"
    destination: "PostgreSQL Database"
    description: "Persists transactional data and audit logs [TCP]"
  - source: "Core Data Access Layer"
    destination: "PostgreSQL Database"
    description: "Interfaces via TypeORM with PgBouncer connection pooling"