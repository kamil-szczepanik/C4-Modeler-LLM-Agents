level: component
scope: "Component diagram for the Elasticsearch container"
parentContainer:
  name: "Elasticsearch"
elements:
  - type: "component"
    name: "REST API / Transport Layer"
    technology: "Java/Netty"
    description: "Powers the REST API and transport layer for high-throughput request handling, handling JSON search queries and bulk indexing payloads."
  - type: "component"
    name: "Query & Search Engine"
    technology: "Lucene Core"
    description: "Executes aggregations, relevancy scoring, and faceted search for catalogue items."
  - type: "component"
    name: "Index & Shard Manager"
    technology: "Elasticsearch"
    description: "Resolves targeted shards and routes document indexing requests."
  - type: "component"
    name: "Data Storage & Translog Engine"
    technology: "NVMe Storage & S3-compatible Object Storage"
    description: "Writes segments and translogs to local NVMe storage and encrypted EU-region backups."
  - type: "component"
    name: "Cluster Coordination & Discovery Module"
    technology: "Elasticsearch"
    description: "Synchronizes cluster topology and shard allocation."
relationships:
  - source: "REST API / Transport Layer"
    destination: "Query & Search Engine"
    description: "Passes parsed queries for execution"
  - source: "Query & Search Engine"
    destination: "Index & Shard Manager"
    description: "Resolves targeted shards"
  - source: "REST API / Transport Layer"
    destination: "Index & Shard Manager"
    description: "Routes document indexing requests to appropriate shards"
  - source: "Index & Shard Manager"
    destination: "Data Storage & Translog Engine"
    description: "Writes segments and translogs to local NVMe storage"
  - source: "Index & Shard Manager"
    destination: "Cluster Coordination & Discovery Module"
    description: "Synchronizes cluster topology and shard allocation"
  - source: "Cluster Coordination & Discovery Module"
    destination: "Index & Shard Manager"
    description: "Synchronizes cluster topology and shard allocation"