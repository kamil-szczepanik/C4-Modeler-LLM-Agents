level: component
scope: "Component diagram for the Notification & Payment Workers container"
parentContainer:
  name: "Notification & Payment Workers"
elements:
  - type: "component"
    name: "Payment Task Handler"
    technology: "Python/Celery + SQLAlchemy"
    description: "Handles payment processing and emits internal failure events."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Python/Celery"
    description: "Dispatches notifications and receives internal failure events."
  - type: "component"
    name: "Queue Consumer & Router"
    technology: "Celery/RabbitMQ"
    description: "Consumes messages with DLQ routing."
  - type: "component"
    name: "Audit & Ledger Component"
    technology: "Python/SQLAlchemy"
    description: "Persists state and immutable logs to the database."
relationships:
  - source: "Queue Consumer & Router"
    destination: "RabbitMQ Message Broker"
    description: "Consumes messages with DLQ routing [AMQP]"
  - source: "Payment Task Handler"
    destination: "Notification Dispatcher"
    description: "Internal failure event emission [AMQP]"
  - source: "Payment Task Handler"
    destination: "PostgreSQL Database"
    description: "Persists state and immutable logs [SQL]"
  - source: "Audit & Ledger Component"
    destination: "PostgreSQL Database"
    description: "Persists state and immutable logs [SQL]"