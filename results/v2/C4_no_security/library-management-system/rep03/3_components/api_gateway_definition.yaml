# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Kong API Gateway"
    technology: "Kong Edge Container Platform"
    description: "Core edge container handling ingress traffic, centralizing routing, authentication, and compliance."
  - type: "component"
    name: "TLS Termination & Geo-Filter Plugin"
    technology: "Kong Geo-Filter Plugin"
    description: "Inspects client IP geolocation at the edge to ensure EU data residency."
  - type: "component"
    name: "JWT Authentication Plugin"
    technology: "Kong OIDC/JWT Plugin"
    description: "Validates Identity Provider (IdP) tokens for public and academic library patrons."
  - type: "component"
    name: "Rate Limiting & Analytics Plugin"
    technology: "Kong Rate Limiting Plugin"
    description: "Enforces quotas and tiered API consumption."
  - type: "component"
    name: "Upstream Load Balancer & Router"
    technology: "Kong Router / Upstream Load Balancer"
    description: "Directs traffic to backend services with high availability."
  - type: "component"
    name: "OpenTelemetry Plugin"
    technology: "OpenTelemetry Plugin (W3C Trace Context)"
    description: "Injects distributed tracing headers to maintain low-latency performance."
  - type: "component"
    name: "Audit Logging Plugin"
    technology: "Kong Audit Logging Plugin"
    description: "Captures compliance and administrative logs."
  - type: "component"
    name: "HashiCorp Vault / Kubernetes Secrets"
    technology: "HashiCorp Vault / Kubernetes"
    description: "Manages dynamic credentials securely."
relationships:
  - source: "Web Application (SPA)"
    destination: "Kong API Gateway"
    description: "Communicates via REST/GraphQL [HTTPS]"
  - source: "Kong API Gateway"
    destination: "Catalogue & Search Container"
    description: "Routes internal traffic [gRPC over HTTP/2]"
  - source: "Kong API Gateway"
    destination: "Circulation & Core Container"
    description: "Routes internal traffic [gRPC]"
  - source: "Kong API Gateway"
    destination: "Audit Log Sink"
    description: "Streams compliance logs asynchronously [HTTPS]"