level: component
scope: "Component diagram for the Web Application (SPA) container"
parentContainer:
  name: "Web Application (SPA)"
elements:
  - type: "component"
    name: "Routing & Shell Component"
    technology: "React Router, TypeScript"
    description: "Manages client-side routing, role-based access, and offline-recovery states."
  - type: "component"
    name: "Catalog & Search Component"
    technology: "React, TypeScript"
    description: "Implements item search interfaces for physical and digital assets."
  - type: "component"
    name: "Circulation & Self-Service Component"
    technology: "React, TypeScript"
    description: "Handles patron checkouts and renewals."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios/GraphQL, Sentry"
    description: "Provides secure, typed communication with JWT interceptors and Sentry error tracking."
  - type: "component"
    name: "Telemetry & Monitoring Component"
    technology: "JavaScript, Sentry"
    description: "Captures metrics and reports exceptions/performance timings for EU-hosted analytics endpoints."
relationships:
  - source: "Routing & Shell Component"
    destination: "Catalog & Search Component"
    description: "Renders views based on authenticated roles [In-memory]"
  - source: "Routing & Shell Component"
    destination: "Circulation & Self-Service Component"
    description: "Renders views based on authenticated roles [In-memory]"
  - source: "Catalog & Search Component"
    destination: "API Client Layer"
    description: "Sends API requests [In-memory]"
  - source: "Circulation & Self-Service Component"
    destination: "API Client Layer"
    description: "Sends API requests [In-memory]"
  - source: "API Client Layer"
    destination: "Telemetry & Monitoring Component"
    description: "Reports exceptions and performance timings [In-memory asynchronous calls]"
  - source: "Telemetry & Monitoring Component"
    destination: "EU-hosted Analytics Endpoint"
    description: "Transmits payloads strictly within the EU [HTTPS]"