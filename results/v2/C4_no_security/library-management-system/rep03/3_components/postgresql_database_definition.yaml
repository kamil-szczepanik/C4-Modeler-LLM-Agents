level: component
scope: "Component diagram for the PostgreSQL Database container"
parentContainer:
  name: "PostgreSQL Database"
elements:
  - type: "component"
    name: "Relational Schema / Core Tables"
    technology: "PostgreSQL"
    description: "ACID-compliant normalization for Patrons, Items, and Loans."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Connection pooler managing concurrent connections and preventing thread exhaustion."
  - type: "component"
    name: "WAL (Write-Ahead Log) Archiver"
    technology: "PostgreSQL WAL"
    description: "Synchronous replication engine streaming replication logs."
  - type: "component"
    name: "Patroni with etcd"
    technology: "Patroni & etcd"
    description: "Automated high-availability, consensus store, and cluster state orchestration."
  - type: "component"
    name: "pgaudit"
    technology: "PostgreSQL Extension"
    description: "Extension for GDPR-compliant and tamper-evident audit logging."
  - type: "component"
    name: "Fluentbit"
    technology: "Fluentbit"
    description: "Sidecar for log and audit forwarding to centralized SIEM."
relationships:
  - source: "PgBouncer"
    destination: "Relational Schema / Core Tables"
    description: "Routes queries [TCP]"
  - source: "Relational Schema / Core Tables"
    destination: "WAL (Write-Ahead Log) Archiver"
    description: "Streams replication logs [TCP]"
  - source: "Patroni with etcd"
    destination: "Relational Schema / Core Tables"
    description: "Orchestrates cluster state & failover [TCP]"