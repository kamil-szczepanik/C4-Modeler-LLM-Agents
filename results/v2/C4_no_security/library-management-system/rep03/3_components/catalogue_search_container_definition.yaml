level: component
scope: "Component diagram for the Catalogue & Search Container container"
parentContainer:
  name: "Catalogue & Search Container"
elements:
  - type: "component"
    name: "Search Controller"
    technology: "Java/Spring Boot"
    description: "Handles incoming HTTP/gRPC search requests and routes them to the search service."
  - type: "component"
    name: "Search Service"
    technology: "Java/Spring Boot"
    description: "Implements business logic for cataloguing, searching, and telemetry event publishing."
  - type: "component"
    name: "Index Repository"
    technology: "Java/Spring Boot"
    description: "Interacts with Elasticsearch to query the search index and execute upserts."
  - type: "component"
    name: "Cataloguing Event Consumer"
    technology: "Java/Spring Boot"
    description: "Consumes item mutation events from RabbitMQ to update the search index."
relationships:
  - source: "Search Controller"
    destination: "Search Service"
    description: "Delegates search requests [Method Call]"
  - source: "Search Service"
    destination: "Index Repository"
    description: "Executes queries and upserts [Java Method]"
  - source: "Cataloguing Event Consumer"
    destination: "Index Repository"
    description: "Triggers index updates upon receiving mutation events [Java Method]"