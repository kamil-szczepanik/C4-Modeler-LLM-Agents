level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Patrons accessing self-service search and loan management."
  - type: "person"
    name: "Librarians"
    description: "Staff managing cataloguing and circulation."
  - type: "person"
    name: "Library Administrators"
    description: "Oversight users tracking reporting and usage."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system processing fines."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External provider for notifications."
  - type: "externalSystem"
    name: "Digital Content Providers"
    description: "External sources for digital content."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system handling authentication."
  - type: "container"
    name: "Web Application (SPA)"
    technology: "React and TypeScript, hosted on an EU-region CDN"
    description: "Frontend Single Page Application providing patron and staff portals."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx/Kong"
    description: "Edge container handling TLS termination, JWT validation, and rate limiting."
  - type: "container"
    name: "Catalogue & Search Container"
    technology: "Elasticsearch backed by Java/Spring Boot"
    description: "Backend container providing high-performance search capabilities."
  - type: "container"
    name: "Circulation & Core Container"
    technology: "Node.js/Express"
    description: "Backend container handling circulation business rules."
  - type: "container"
    name: "Notification & Payment Workers"
    technology: "Python/Celery"
    description: "Background workers utilizing dead-letter queues and circuit breakers."
  - type: "container"
    name: "PostgreSQL Database"
    technology: "PostgreSQL"
    description: "Transactional persistence with strict EU region-pinned volumes."
  - type: "container"
    name: "Elasticsearch"
    technology: "Elasticsearch"
    description: "Search engine supporting sub-800ms search latency."
  - type: "container"
    name: "RabbitMQ Message Broker"
    technology: "RabbitMQ"
    description: "High-availability cluster for asynchronous messaging."
relationships:
  - source: "Library Patrons"
    destination: "Web Application (SPA)"
    description: "Interacts via HTTPS"
    technology: "HTTPS"
  - source: "Librarians"
    destination: "Web Application (SPA)"
    description: "Interacts via HTTPS"
    technology: "HTTPS"
  - source: "Library Administrators"
    destination: "Web Application (SPA)"
    description: "Interacts via HTTPS"
    technology: "HTTPS"
  - source: "Web Application (SPA)"
    destination: "API Gateway"
    description: "Communicates via REST/GraphQL over HTTPS"
    technology: "REST/GraphQL over HTTPS"
  - source: "API Gateway"
    destination: "Catalogue & Search Container"
    description: "Routes internal traffic"
    technology: "gRPC"
  - source: "API Gateway"
    destination: "Circulation & Core Container"
    description: "Routes internal traffic"
    technology: "gRPC"
  - source: "Circulation & Core Container"
    destination: "RabbitMQ Message Broker"
    description: "Communicates asynchronously"
    technology: "AMQP"
  - source: "Notification & Payment Workers"
    destination: "Payment Gateway"
    description: "Integrates for payment processing"
    technology: "HTTPS"
  - source: "Notification & Payment Workers"
    destination: "Notification Service"
    description: "Integrates for sending notifications"
    technology: "HTTPS"
  - source: "Circulation & Core Container"
    destination: "PostgreSQL Database"
    description: "Persists transactional data"
    technology: "TCP"
  - source: "Catalogue & Search Container"
    destination: "Elasticsearch"
    description: "Queries search index"
    technology: "TCP"