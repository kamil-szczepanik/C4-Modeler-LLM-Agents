level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A cloud-native Library Management System that provides cataloguing, circulation, and self-service portals for public and academic libraries while enforcing strict EU data residency."
elements:
  - type: "person"
    name: "Library Patrons (Members)"
    description: "Users accessing self-service search and loan management."
  - type: "person"
    name: "Librarians"
    description: "Staff managing cataloguing and circulation."
  - type: "person"
    name: "Library Administrators"
    description: "Oversight users tracking reporting and usage."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system processing fines via Stripe/Adyen."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External provider for reminders via SMTP/APNs/FCM."
  - type: "externalSystem"
    name: "Digital Content Providers"
    description: "External sources for streaming via OverDrive/Adobe DRM."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system handling OIDC/OAuth 2.0 authentication."
relationships:
  - source: "Library Patrons (Members)"
    destination: "Library Management System"
    description: "Accesses self-service search and loan management"
    technology: "HTTPS (TLS 1.3)"
  - source: "Librarians"
    destination: "Library Management System"
    description: "Manages cataloguing and circulation"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Administrators"
    destination: "Library Management System"
    description: "Tracks reporting and usage"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Processes fines"
    technology: "REST/JSON over HTTPS"
  - source: "Library Management System"
    destination: "Notification Service"
    description: "Sends reminders"
    technology: "SMTP/APNs/FCM over EU-hosted infrastructure"
  - source: "Library Management System"
    destination: "Digital Content Providers"
    description: "Streams digital content"
    technology: "LTI and REST over HTTPS"
  - source: "Library Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OpenID Connect (OIDC) / OAuth 2.0 over HTTPS"