level: container
scope: "Container diagram for New Claims Platform"
system:
  name: "New Claims Platform"
elements:
  - type: "person"
    name: "End Customers & Brokers"
    description: "External users submitting claims online"
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users managing claims via a new web application"
  - type: "person"
    name: "Migration Operations Team"
    description: "Users monitoring data reconciliation and rollbacks"
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "COBOL/DB2 on-premise system of record"
  - type: "container"
    name: "Azure API Management"
    technology: "Azure API Management / OIDC / OAuth2"
    description: "Single entry point handling OIDC/OAuth2 Active Directory SSO and request routing"
  - type: "container"
    name: "Customer Portal & Adjuster Workspace"
    technology: "React SPA & Node.js BFF"
    description: "Frontend user interfaces and Backend-for-Frontend for performance and decoupled loading"
  - type: "container"
    name: "Claims Core Engine"
    technology: "Java Spring Boot"
    description: "Application handling domain logic and claim-type feature flagging"
  - type: "container"
    name: "Integration Mediator"
    technology: "Azure Logic Apps / Function App"
    description: "Translates events and maps JSON to COBOL copybooks for the legacy mainframe"
  - type: "container"
    name: "Azure Service Bus"
    technology: "Azure Service Bus"
    description: "Enterprise Messaging Queue with Dead-Letter Queues (DLQs)"
  - type: "container"
    name: "Polyglot Persistence Layer"
    technology: "Azure Cosmos DB / PostgreSQL"
    description: "Data storage with Change Data Capture (CDC)"
  - type: "container"
    name: "Migration Operations Dashboard"
    technology: "Web UI"
    description: "Dedicated monitoring and reconciliation UI driven by CDC"
relationships:
  - source: "End Customers & Brokers"
    destination: "Azure API Management"
    description: "Submit claims and interact with Customer Portal"
    technology: "HTTPS (REST/JSON)"
  - source: "Claims Adjusters"
    destination: "Azure API Management"
    description: "Manage claims via Adjuster Workspace"
    technology: "HTTPS (REST/JSON)"
  - source: "Azure API Management"
    destination: "Customer Portal & Adjuster Workspace"
    description: "Routes requests to BFF and frontend"
    technology: "HTTPS"
  - source: "Azure API Management"
    destination: "Claims Core Engine"
    description: "Routes API requests"
    technology: "HTTPS (gRPC)"
  - source: "Claims Core Engine"
    destination: "Azure Service Bus"
    description: "Sends and receives asynchronous messages"
    technology: "AMQP"
  - source: "Claims Core Engine"
    destination: "Integration Mediator"
    description: "Communicates domain events"
    technology: "TCP/MQ"
  - source: "Integration Mediator"
    destination: "Legacy Mainframe"
    description: "Relays transactions and maps data"
    technology: "TCP/MQ via JSON-to-COBOL copybook mapping"
  - source: "Polyglot Persistence Layer"
    destination: "Migration Operations Dashboard"
    description: "Streams data updates for reconciliation"
    technology: "Change Data Capture (CDC)"