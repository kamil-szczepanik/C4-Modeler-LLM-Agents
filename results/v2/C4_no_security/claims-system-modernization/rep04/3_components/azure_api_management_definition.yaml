level: component
scope: "Component diagram for the Azure API Management container"
parentContainer:
  name: "Azure API Management"
elements:
  - type: "component"
    name: "Token Validator Component"
    technology: "APIM Policy (OAuth2/OIDC)"
    description: "Validates incoming OAuth2 and OIDC tokens against the Active Directory / Identity Provider."
  - type: "component"
    name: "Dynamic Routing Policy Engine"
    technology: "APIM Policy Fragments & Named Values"
    description: "Enables dynamic path-based routing and rapid rollbacks using rules fetched from Azure App Configuration."
  - type: "component"
    name: "Transformation & Header Injection Component"
    technology: "APIM Policies"
    description: "Handles data transformation and header injection for requests passing through the gateway."
relationships:
  - source: "Token Validator Component"
    destination: "Dynamic Routing Policy Engine"
    description: "Passes validated security context to"
  - source: "Dynamic Routing Policy Engine"
    destination: "Transformation & Header Injection Component"
    description: "Forwards routed requests to"