level: component
scope: "Component diagram for the Integration Mediator container"
parentContainer:
  name: "Integration Mediator"
elements:
  - type: "component"
    name: "Routing Router Component"
    technology: "Azure Logic Apps"
    description: "Routes domain events from the Claims Core Engine using serverless event routing."
  - type: "component"
    name: "Circuit Breaker & Retry Policy Component"
    technology: "Azure Function middleware"
    description: "Handles throttled transformation and provides persistent exponential backpressure."
  - type: "component"
    name: "Copybook Mapper Component"
    technology: "Azure Functions, Node.js/TypeScript"
    description: "Performs JSON-to-COBOL copybook mapping for mainframe transactions."
  - type: "component"
    name: "Dead-Letter Handler Component"
    technology: "Azure Functions & Azure Storage Queue"
    description: "Manages failed messages and enriches business exceptions."
relationships:
  - source: "Claims Core Engine"
    destination: "Routing Router Component"
    description: "Domain Events [HTTP/REST or AMQP]"
  - source: "Routing Router Component"
    destination: "Circuit Breaker & Retry Policy Component"
    description: "Validated Payload [HTTP]"
  - source: "Circuit Breaker & Retry Policy Component"
    destination: "Copybook Mapper Component"
    description: "Throttled Transformation [Internal Function Call]"
  - source: "Copybook Mapper Component"
    destination: "Legacy Mainframe"
    description: "COBOL Transaction [TCP/MQ via JSON-to-COBOL copybook mapping]"
  - source: "Dead-Letter Handler Component"
    destination: "Migration Operations Dashboard"
    description: "Enriched Business Exception [REST/WebSockets with OpenTelemetry correlation ID]"