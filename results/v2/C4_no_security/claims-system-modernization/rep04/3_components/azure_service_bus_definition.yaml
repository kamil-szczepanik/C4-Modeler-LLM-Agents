level: component
scope: "Component diagram for the Azure Service Bus container"
parentContainer:
  name: "Azure Service Bus"
elements:
  - type: "component"
    name: "Claims Topic"
    technology: "Azure Service Bus Topic"
    description: "Publishes claims and handles sessions for the claims processing workflow."
  - type: "component"
    name: "Migration Routing Filters"
    technology: "Service Bus Topic Filters"
    description: "Routes messages appropriately between modern engines and legacy integration mediators."
  - type: "component"
    name: "Dead-Letter Subscriptions"
    technology: "Azure Service Bus DLQ"
    description: "Captures and isolates failed or poisoned messages for troubleshooting and reliability."
relationships:
  - source: "Claims Topic"
    destination: "Migration Routing Filters"
    description: "Evaluates message properties"
  - source: "Migration Routing Filters"
    destination: "Dead-Letter Subscriptions"
    description: "Routes unprocessable messages"