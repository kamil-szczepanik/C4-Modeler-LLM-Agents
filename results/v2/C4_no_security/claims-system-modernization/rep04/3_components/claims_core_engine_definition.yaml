level: component
scope: "Component diagram for the Claims Core Engine container"
parentContainer:
  name: "Claims Core Engine"
elements:
  - type: "component"
    name: "Claim Orchestrator"
    technology: "Spring State Machine"
    description: "Manages complex claim lifecycles across mixed states."
  - type: "component"
    name: "Feature Router Component"
    technology: "Azure App Configuration"
    description: "Externalizes feature flags for business-driven rollbacks."
  - type: "component"
    name: "Synchronization & Reconciliation Adapter"
    technology: "Java Spring Boot"
    description: "Handles data synchronization and reconciliation."
  - type: "component"
    name: "Data Access Facade"
    technology: "Spring Data JPA"
    description: "Reads and writes claim state to the persistence layer."
  - type: "component"
    name: "Resilience & Caching Proxy"
    technology: "Resilience4j"
    description: "Implements circuit breakers to isolate legacy mainframe latency."
  - type: "component"
    name: "Telemetry Interceptor"
    technology: "OpenTelemetry"
    description: "Provides distributed tracing across hybrid infrastructure."
relationships:
  - source: "Claim Orchestrator"
    destination: "Data Access Facade"
    description: "Persists claim state changes"
  - source: "Feature Router Component"
    destination: "Claim Orchestrator"
    description: "Controls feature flags for claim processing"
  - source: "Resilience & Caching Proxy"
    destination: "Synchronization & Reconciliation Adapter"
    description: "Protects communication with external systems"
  - source: "Telemetry Interceptor"
    destination: "Claim Orchestrator"
    description: "Traces execution flow"