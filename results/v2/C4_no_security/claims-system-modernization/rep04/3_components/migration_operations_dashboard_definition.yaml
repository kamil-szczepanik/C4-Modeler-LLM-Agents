level: component
scope: "Component diagram for the Migration Operations Dashboard container"
parentContainer:
  name: "Migration Operations Dashboard"
elements:
  - type: "component"
    name: "Migration Leads and Operations Managers"
    technology: "User"
    description: "Primary users who monitor migration progress and discrepancy alerts."
  - type: "component"
    name: "Dashboard UI"
    technology: "React SPA"
    description: "Provides real-time monitoring and discrepancy detection interface."
  - type: "component"
    name: "Dashboard BFF / API"
    technology: "Node.js/Express"
    description: "Fetches aggregated metrics and audit logs for the UI."
  - type: "component"
    name: "Reconciliation Processor"
    technology: "Python/Pandas"
    description: "Performs powerful data validation capabilities for cross-system comparisons."
  - type: "component"
    name: "Compliance & Audit Component"
    technology: "Node.js / Serverless"
    description: "Handles compliance and audit tracking functions."
  - type: "component"
    name: "Operations Datastore"
    technology: "Azure PostgreSQL"
    description: "Ensures robust relational integrity, audit tracking, and Row-Level Security."
  - type: "component"
    name: "Asynchronous Batch Staging Queue"
    technology: "Azure Blob Storage"
    description: "Buffers heavy mainframe batch extracts during the batch window."
  - type: "component"
    name: "Polyglot Persistence Layer"
    technology: "Database"
    description: "External persistence layer providing real-time updates via Change Data Capture (CDC)."
relationships:
  - source: "Migration Leads and Operations Managers"
    destination: "Dashboard UI"
    description: "Monitors migration progress and discrepancy alerts via HTTPS/WSS"
  - source: "Dashboard UI"
    destination: "Dashboard BFF / API"
    description: "Fetches aggregated metrics and audit logs via HTTPS/REST/GraphQL"
  - source: "Dashboard BFF / API"
    destination: "Operations Datastore"
    description: "Queries audit logs and discrepancy states via SQL/TLS"
  - source: "Reconciliation Processor"
    destination: "Operations Datastore"
    description: "Persists audit logs and discrepancy states via SQL/TLS"
  - source: "Reconciliation Processor"
    destination: "Asynchronous Batch Staging Queue"
    description: "Buffers mainframe batch dumps via Azure Blob SDK/HTTPS"
  - source: "Polyglot Persistence Layer"
    destination: "Reconciliation Processor"
    description: "Streams real-time updates via Change Data Capture (CDC)"