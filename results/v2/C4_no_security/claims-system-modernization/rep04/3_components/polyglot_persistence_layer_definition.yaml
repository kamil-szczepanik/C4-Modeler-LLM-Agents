level: component
scope: "Component diagram for the Polyglot Persistence Layer container"
parentContainer:
  name: "Polyglot Persistence Layer"
elements:
  - type: "component"
    name: "Document Store (Azure Cosmos DB)"
    technology: "Azure Cosmos DB"
    description: "Provides schema flexibility for migrating disparate claim types."
  - type: "component"
    name: "Relational Store (Azure PostgreSQL)"
    technology: "Azure PostgreSQL"
    description: "Delivers strong transactional consistency for core claims data."
  - type: "component"
    name: "Managed CDC & Audit Streamer (Azure Event Hubs)"
    technology: "Azure Event Hubs"
    description: "Powers fully managed native change data capture (CDC) to minimize operational toil and ensure zero data loss."
  - type: "component"
    name: "Claims Core Engine"
    technology: "Cosmos SDK / JDBC"
    description: "Interacts with document and relational stores for CRUD and transactional operations."
  - type: "component"
    name: "Reconciliation Service & Audit System"
    technology: "AMQP / HTTPS"
    description: "Consumes audit logs from the audit streamer for reconciliation."
  - type: "component"
    name: "Migration Operations Dashboard"
    technology: "WebSockets / HTTPS"
    description: "Provides real-time tracking of the migration."
relationships:
  - source: "Claims Core Engine"
    destination: "Document Store (Azure Cosmos DB)"
    description: "HTTPS/TCP via Cosmos SDK for CRUD operations"
  - source: "Claims Core Engine"
    destination: "Relational Store (Azure PostgreSQL)"
    description: "TCP/IP via JDBC for transactional consistency"
  - source: "Document Store (Azure Cosmos DB)"
    destination: "Managed CDC & Audit Streamer (Azure Event Hubs)"
    description: "Native change streams"
  - source: "Relational Store (Azure PostgreSQL)"
    destination: "Managed CDC & Audit Streamer (Azure Event Hubs)"
    description: "Native change streams"
  - source: "Managed CDC & Audit Streamer (Azure Event Hubs)"
    destination: "Reconciliation Service & Audit System"
    description: "AMQP/HTTPS for audit logging"
  - source: "Managed CDC & Audit Streamer (Azure Event Hubs)"
    destination: "Migration Operations Dashboard"
    description: "WebSockets/HTTPS for real-time tracking"