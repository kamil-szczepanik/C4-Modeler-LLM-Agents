# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for New Claims Platform"
system:
  name: "New Claims Platform"
  description: "Modernized claims platform operating on Azure West Europe PaaS, gradually migrating claim types while the COBOL/DB2 mainframe remains the system of record."
elements:
  - type: "person"
    name: "End Customers & Brokers"
    description: "Users who submit and track claims via web or mobile UI."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff who manage and process claims with a sub-second web experience."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise COBOL/DB2 system of record handling batch windows and core processing."
  - type: "externalSystem"
    name: "Enterprise Messaging Queue"
    description: "Anti-Corruption Layer providing asynchronous messaging and buffering to protect mainframe connection pools."
  - type: "externalSystem"
    name: "Active Directory / Identity Provider"
    description: "Provides authentication and single sign-on services."
  - type: "externalSystem"
    name: "Reconciliation Service & Audit System"
    description: "Ensures data integrity and tracks audit logs during the migration."
relationships:
  - source: "End Customers & Brokers"
    destination: "New Claims Platform"
    description: "Submit and track claims"
    technology: "HTTPS via Web/Mobile UI"
  - source: "Claims Adjusters"
    destination: "New Claims Platform"
    description: "Process and manage claims"
    technology: "HTTPS"
  - source: "New Claims Platform"
    destination: "Enterprise Messaging Queue"
    description: "Asynchronous communication and buffering"
    technology: "Enterprise Messaging Queue / DLQ"
  - source: "Enterprise Messaging Queue"
    destination: "Legacy Mainframe"
    description: "Relays messages to and from the mainframe system of record"
    technology: "Asynchronous messaging (Anti-Corruption Layer)"
  - source: "New Claims Platform"
    destination: "Active Directory / Identity Provider"
    description: "Authenticates users for single sign-on"
    technology: "OpenID Connect / SAML over HTTPS"