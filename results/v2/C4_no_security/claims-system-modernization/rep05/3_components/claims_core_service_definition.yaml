level: component
scope: "Component diagram for the Claims Core Service container"
parentContainer:
  name: "Claims Core Service"
elements:
  - type: "component"
    name: "Routing & Orchestration Component"
    technology: ".NET 8 / C# / Azure App Configuration"
    description: "Evaluates dynamic flags to route requests."
  - type: "component"
    name: "Claim Domain Model Component"
    technology: ".NET 8 / C# / DDD"
    description: "Implements core business logic for migrated claim types via DDD."
  - type: "component"
    name: "ACL Component"
    technology: ".NET 8 / C#"
    description: "Anti-Corruption Layer translating modern commands to legacy formats."
  - type: "component"
    name: "Outbox Processor Component"
    technology: ".NET 8 / C# / Entity Framework Core"
    description: "Ensures transactional consistency for event publishing."
  - type: "component"
    name: "Claim Status & Audit Projection Component"
    technology: ".NET 8 / C# / CQRS"
    description: "Aggregates state changes into read-optimized models using CQRS."
relationships:
  - source: "Routing & Orchestration Component"
    destination: "Claim Domain Model Component"
    description: "Routes requests to business logic"
  - source: "Claim Domain Model Component"
    destination: "Outbox Processor Component"
    description: "Triggers transactional outbox events"
  - source: "Claim Domain Model Component"
    destination: "ACL Component"
    description: "Forwards requests to legacy when needed"
  - source: "Outbox Processor Component"
    destination: "Claim Status & Audit Projection Component"
    description: "Updates projections via events"