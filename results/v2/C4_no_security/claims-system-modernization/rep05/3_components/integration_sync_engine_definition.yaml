level: component
scope: "Component diagram for the Integration & Sync Engine container"
parentContainer:
  name: "Integration & Sync Engine"
elements:
  - type: "component"
    name: "Ingestion Router"
    technology: ".NET 8 Worker on AKS"
    description: "Consumes events and persists payloads."
  - type: "component"
    name: "Mainframe Batch Staging Store"
    technology: "Azure SQL Database Ledger"
    description: "Tamper-evident, 90-day immutable audit staging."
  - type: "component"
    name: "SFTP Sync Agent"
    technology: "AKS container"
    description: "Queries pending batches and transfers bulk files."
  - type: "component"
    name: "Dead-Letter & Reconciliation Monitor"
    technology: "Azure Monitor"
    description: "Operational observability and alerting."
  - type: "component"
    name: "Azure Service Bus"
    technology: "Asynchronous event ingestion"
    description: "Asynchronous event ingestion and message buffering."
relationships:
  - source: "Ingestion Router"
    destination: "Azure Service Bus"
    description: "Consumes events [AMQP]"
  - source: "Ingestion Router"
    destination: "Mainframe Batch Staging Store"
    description: "Persists payloads [ADO.NET / SQL]"
  - source: "SFTP Sync Agent"
    destination: "Mainframe Batch Staging Store"
    description: "Queries pending batches [ADO.NET / SQL]"
  - source: "SFTP Sync Agent"
    destination: "Legacy Mainframe"
    description: "Transfers bulk files [SFTP]"
  - source: "Dead-Letter & Reconciliation Monitor"
    destination: "Observability Platform"
    description: "Exports metrics [OpenTelemetry / HTTPS]"