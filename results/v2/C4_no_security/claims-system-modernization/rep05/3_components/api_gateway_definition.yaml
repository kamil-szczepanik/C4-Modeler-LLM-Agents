level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Developer Portal"
    technology: "Azure API Management Built-in Portal"
    description: "Brokers authenticate for API access and provide developer onboarding."
  - type: "component"
    name: "JWT Validation Policy"
    technology: "API Management Policy"
    description: "Validates incoming JSON Web Tokens for authentication."
  - type: "component"
    name: "Dynamic Routing Policy Engine"
    technology: "API Management Policy / C#"
    description: "Evaluates claim-type routing state and directs traffic to modern or legacy systems."
  - type: "component"
    name: "App Config Lookup Component"
    technology: "API Management Policy Extension"
    description: "Interfaces with Azure App Configuration to fetch routing rules and feature flags."
  - type: "component"
    name: "Rate Limiting"
    technology: "API Management Built-in Policy"
    description: "Protects backend systems by limiting request rates."
relationships:
  - source: "Developer Portal"
    destination: "JWT Validation Policy"
    description: "Brokers authenticate for API access via [OAuth 2.0 / OpenID Connect]."
  - source: "Dynamic Routing Policy Engine"
    destination: "App Config Lookup Component"
    description: "Fetches claim-type routing state via [REST/HTTPS with 60s token-aware caching]."