level: component
scope: "Component diagram for the Modern Claims Database container"
parentContainer:
  name: "Modern Claims Database"
elements:
  - type: "component"
    name: "Relational Data Store"
    technology: "Azure SQL Database"
    description: "Provides strict ACID guarantees, relational foreign keys, and matches the legacy DB2 schema to satisfy consistency requirements."
  - type: "component"
    name: "Audit Trail Store"
    technology: "Azure SQL Temporal Tables"
    description: "Automatically captures tamper-evident row history for compliance and audit requirements without custom trigger maintenance."
relationships:
  - source: "Relational Data Store"
    destination: "Audit Trail Store"
    description: "Maintains historical row versions"