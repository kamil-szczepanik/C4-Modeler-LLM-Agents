level: component
scope: "Component diagram for the Claims Web Application container"
parentContainer:
  name: "Claims Web Application"
elements:
  - type: "component"
    name: "Claim Intake Wizard"
    technology: "React Component Bundle"
    description: "Allows customers and brokers to submit claims and interact with the intake process."
  - type: "component"
    name: "Adjuster Workspace"
    technology: "React Component Bundle"
    description: "Provides tools for claims adjusters to handle claims and monitor sync status."
  - type: "component"
    name: "Broker Portal Module"
    technology: "React Component Bundle"
    description: "Enables brokers to manage portfolios and submit claims."
  - type: "component"
    name: "Authentication Component"
    technology: "MSAL / Azure AD Wrapper"
    description: "Handles security protocol, OIDC/OAuth2 single sign-on."
  - type: "component"
    name: "API Client"
    technology: "Axios / Fetch Wrapper"
    description: "Communicates with the backend API Gateway via REST/HTTPS."
  - type: "component"
    name: "Offline State Manager"
    technology: "IndexedDB Wrapper"
    description: "Persists claims drafts locally in the browser for offline capabilities."
  - type: "component"
    name: "Sync Status Monitor"
    technology: "WebSocket / Polling Client"
    description: "Displays backend replication state and monitors synchronization."
  - type: "component"
    name: "Telemetry & Feature Flag Provider"
    technology: "App Insights & Azure App Config SDK"
    description: "Provides real-user monitoring and fetches runtime feature flags."
  - type: "component"
    name: "Client-Side Error Boundaries"
    technology: "React Error Boundary"
    description: "Captures and handles runtime UI errors gracefully."
relationships:
  - source: "Claim Intake Wizard"
    destination: "Offline State Manager"
    description: "Persists drafts [IndexedDB/Local Storage]"
  - source: "Adjuster Workspace"
    destination: "Sync Status Monitor"
    description: "Displays backend replication state [Internal State]"
  - source: "Claims Web Application"
    destination: "API Gateway"
    description: "Communicates via API client [REST/HTTPS]"
  - source: "Telemetry & Feature Flag Provider"
    destination: "Azure App Configuration"
    description: "Fetches runtime feature flags [HTTPS]"