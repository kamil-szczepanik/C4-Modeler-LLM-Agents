level: container
scope: "Container diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
elements:
  - type: "person"
    name: "End Customers & Brokers"
    description: "External users submitting online claims via the web interface."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users managing claims in the new web application."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "COBOL/DB2 on-prem system acting as the system of record."
  - type: "externalSystem"
    name: "Corporate Active Directory"
    description: "On-premises identity provider enforcing SSO."
  - type: "container"
    name: "Claims Web Application"
    technology: "React, Azure Static Web Apps"
    description: "React Single Page Application for sub-2-second UI responsiveness."
  - type: "container"
    name: "API Gateway"
    technology: "Azure API Management"
    description: "Managed entry point enforcing SSO via Corporate Active Directory."
  - type: "container"
    name: "Claims Core Service"
    technology: ".NET 8 / C#, Azure Kubernetes Service (AKS)"
    description: "Implements domain logic, Inbox/Outbox pattern, and Anti-Corruption Layer (ACL)."
  - type: "container"
    name: "Integration & Sync Engine"
    technology: "Azure Service Bus"
    description: "Bridging modern event flows with the legacy batch window."
  - type: "container"
    name: "Modern Claims Database"
    technology: "Azure SQL Database / Cosmos DB"
    description: "Providing ACID compliance and dual-run state persistence."
relationships:
  - source: "End Customers & Brokers"
    destination: "Claims Web Application"
    description: "Submit online claims"
    technology: "HTTPS"
  - source: "Claims Adjusters"
    destination: "Claims Web Application"
    description: "Manage claims in the new web application"
    technology: "HTTPS"
  - source: "Claims Web Application"
    destination: "API Gateway"
    description: "Communicates with API Gateway"
    technology: "REST/HTTPS"
  - source: "API Gateway"
    destination: "Claims Core Service"
    description: "Routes requests to the Claims Core Service"
    technology: "Internal REST/gRPC"
  - source: "Claims Core Service"
    destination: "Modern Claims Database"
    description: "Persists data and state"
    technology: "SQL/Cosmos protocols"
  - source: "Claims Core Service"
    destination: "Integration & Sync Engine"
    description: "Publishes asynchronous events"
    technology: "AMQP"
  - source: "Integration & Sync Engine"
    destination: "Legacy Mainframe"
    description: "Synchronizes data via batch file transfers and secure file protocols"
    technology: "SFTP / Batch File Transfers"
  - source: "API Gateway"
    destination: "Corporate Active Directory"
    description: "Enforces SSO integration"
    technology: "OpenID Connect / OAuth 2.0"