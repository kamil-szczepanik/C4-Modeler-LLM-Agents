level: context
scope: "System Context diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
  description: "A modern hybrid cloud platform gradually replacing a 30-year-old mainframe claims system, ensuring zero data loss and uninterrupted operations during a 3-year migration."
elements:
  - type: "person"
    name: "End Customers & Brokers"
    description: "Web users submitting claims via R-01."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users handling claims via R-02/R-05."
  - type: "person"
    name: "Migration & Operations Team"
    description: "Managing hybrid coexistence and rollbacks."
  - type: "person"
    name: "Compliance & Audit Officers"
    description: "Tracing transactions across systems."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premises COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "Corporate Active Directory"
    description: "On-premises identity provider."
  - type: "externalSystem"
    name: "Observability Platform"
    description: "Azure Monitor / App Insights for distributed tracing."
relationships:
  - source: "End Customers & Brokers"
    destination: "Modern Claims Platform"
    description: "Interact with Modern Claims Platform to submit claims"
    technology: "HTTPS/TLS"
  - source: "Claims Adjusters"
    destination: "Modern Claims Platform"
    description: "Interact with Modern Claims Platform to handle claims"
    technology: "HTTPS/TLS"
  - source: "Modern Claims Platform"
    destination: "Corporate Active Directory"
    description: "Authenticates against Corporate Active Directory"
    technology: "OpenID Connect / OAuth 2.0"
  - source: "Modern Claims Platform"
    destination: "Legacy Mainframe"
    description: "Synchronizes data via SFTP and restricted API gateway"
    technology: "SFTP / REST API"
  - source: "Modern Claims Platform"
    destination: "Observability Platform"
    description: "Streams telemetry for end-to-end distributed tracing"
    technology: "Azure Monitor / App Insights"