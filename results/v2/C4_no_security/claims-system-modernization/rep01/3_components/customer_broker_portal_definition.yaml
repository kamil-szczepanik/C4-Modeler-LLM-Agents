level: component
scope: "Component diagram for the Customer/Broker Portal container"
parentContainer:
  name: "Customer/Broker Portal"
elements:
  - type: "component"
    name: "Next.js Frontend UI"
    technology: "Node.js, TypeScript, Next.js, React Server Components"
    description: "Provides the user interface for policyholders and brokers to submit and track claims."
  - type: "component"
    name: "Session Management Service"
    technology: "Node.js, Azure Cache for Redis"
    description: "Handles distributed session caching and broker view caching."
  - type: "component"
    name: "API Integration Client"
    technology: "TypeScript, HTTPS"
    description: "Communicates securely with Azure API Management to route ingress API traffic."
relationships:
  - source: "Next.js Frontend UI"
    destination: "Session Management Service"
    description: "Stores and retrieves session data [TCP]"
  - source: "Next.js Frontend UI"
    destination: "API Integration Client"
    description: "Sends API requests for claim submission and tracking [HTTPS]"
  - source: "API Integration Client"
    destination: "Azure API Management"
    description: "Routes ingress API traffic [HTTPS]"