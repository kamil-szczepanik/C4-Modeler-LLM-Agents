level: component
scope: "Component diagram for the Azure API Management (API Gateway) container"
parentContainer:
  name: "Azure API Management (API Gateway)"
elements:
  - type: "component"
    name: "Token Validator Component"
    technology: "ASP.NET Core / OAuth2"
    description: "Validates incoming security tokens and extracts claims for authorization."
  - type: "component"
    name: "API Router & Policy Engine"
    technology: "XML-based APIM Policies"
    description: "Handles dynamic backend routing and policy enforcement."
  - type: "component"
    name: "Internal Developer Portal"
    technology: "Azure APIM Developer Portal"
    description: "Provides documentation and self-service API management for internal developers."
  - type: "component"
    name: "Rate Limiting & Quota Enforcer"
    technology: "XML-based APIM Policies"
    description: "Enforces rate limits and quotas for API consumers."
  - type: "component"
    name: "Backend Circuit Breaker & Retry Engine"
    technology: "XML-based APIM Policies"
    description: "Provides fault tolerance, retries, and circuit breaking for backend systems."
relationships:
  - source: "API Router & Policy Engine"
    destination: "Adjuster BFF"
    description: "Routes authenticated adjuster requests [HTTPS, gRPC]"
  - source: "API Router & Policy Engine"
    destination: "Anti-Corruption Layer (ACL) Gateway"
    description: "Routes unmigrated claim traffic to legacy endpoints [HTTPS, JSON]"