level: component
scope: "Component diagram for the Adjuster Workstation container"
parentContainer:
  name: "Adjuster Workstation"
elements:
  - type: "component"
    name: "Claims Dashboard Component"
    technology: "React SPA, Azure Static Web Apps"
    description: "Provides high-performance rendering for the claims adjusters dashboard."
  - type: "component"
    name: "State & Real-Time Sync Component"
    technology: "Server-Sent Events (SSE)"
    description: "Handles real-time migration status updates and synchronization without polling overhead."
  - type: "component"
    name: "Claim Action & Form Engine Component"
    technology: "React SPA"
    description: "Manages claim actions and form rendering for internal adjusters."
  - type: "component"
    name: "Auth & Session Manager Component"
    technology: "Microsoft Entra ID, OIDC/OAuth2"
    description: "Manages user authentication, session state, and Single Sign-On integration."
relationships:
  - source: "Claims Dashboard Component"
    destination: "Adjuster BFF"
    description: "Routes web requests and interacts via HTTPS"
  - source: "State & Real-Time Sync Component"
    destination: "Adjuster BFF"
    description: "Receives real-time updates via Server-Sent Events (SSE)"
  - source: "Claim Action & Form Engine Component"
    destination: "Adjuster BFF"
    description: "Submits claim actions via HTTPS"
  - source: "Auth & Session Manager Component"
    destination: "Microsoft Entra ID"
    description: "Authenticates users via OIDC/OAuth2 over HTTPS"