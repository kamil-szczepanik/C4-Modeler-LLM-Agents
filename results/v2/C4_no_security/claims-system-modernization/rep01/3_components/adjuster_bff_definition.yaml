# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Adjuster BFF container"
parentContainer:
  name: "Adjuster BFF"
elements:
  - type: "component"
    name: "API Controller"
    technology: ".NET Core, C#"
    description: "Handles incoming UI requests from the Adjuster Workstation and maps them to domain commands and queries."
  - type: "component"
    name: "Domain Service Client"
    technology: ".NET Core, C#, gRPC"
    description: "Communicates with the Core Claims Domain for domain-specific business operations."
  - type: "component"
    name: "Legacy Integration Gateway"
    technology: ".NET Core, C#, Anti-Corruption Layer (ACL)"
    description: "Interfaces with the Legacy Mainframe through the Anti-Corruption Layer Gateway for legacy integration."
  - type: "component"
    name: "Read-Model Cache Manager"
    technology: ".NET Core, C#, PostgreSQL"
    description: "Manages read-model caching and state persistence against the Operational Data Store."
  - type: "component"
    name: "Authentication Handler"
    technology: "Microsoft Entra ID, OIDC, OAuth 2.0"
    description: "Handles Single Sign-On and security validation for adjuster sessions."
relationships:
  - source: "API Controller"
    destination: "Domain Service Client"
    description: "Invokes domain queries and commands [HTTPS, gRPC]"
  - source: "API Controller"
    destination: "Legacy Integration Gateway"
    description: "Delegates legacy integration requests [HTTPS, gRPC]"
  - source: "API Controller"
    destination: "Read-Model Cache Manager"
    description: "Performs read-model caching and state persistence [TLS]"
  - source: "API Controller"
    destination: "Authentication Handler"
    description: "Validates Single Sign-On [OIDC, OAuth 2.0]"