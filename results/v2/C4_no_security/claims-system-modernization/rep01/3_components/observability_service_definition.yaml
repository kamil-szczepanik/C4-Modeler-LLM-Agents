level: component
scope: "Component diagram for the Observability Service container"
parentContainer:
  name: "Observability Service"
elements:
  - type: "component"
    name: "OpenTelemetry Collector Component"
    technology: "Azure Container Apps, OpenTelemetry (OTLP)"
    description: "Collects telemetry from .NET and Node.js containers and routes logs, traces, and metrics to downstream Azure backends."
  - type: "component"
    name: "Azure Monitor Exporter Component"
    technology: "Azure Application Insights & Azure Monitor"
    description: "Captures APM traces and application logs with reduced operational overhead."
  - type: "component"
    name: "Managed Prometheus Exporter Component"
    technology: "Azure Managed Prometheus"
    description: "Ingests operational metrics while abstracting underlying storage maintenance."
  - type: "component"
    name: "Grafana Visualization Component"
    technology: "Azure Managed Grafana"
    description: "Provides unified, business-centric dashboards for incident management by querying Azure backends via PromQL and Azure Monitor APIs."
  - type: "component"
    name: "Secure Hybrid Ingress Component"
    technology: "Azure Private Link, VPN/ExpressRoute"
    description: "Secures hybrid telemetry ingestion from on-premise components like the legacy mainframe and ACL Gateway."
relationships:
  - source: ".NET and Node.js containers"
    destination: "OpenTelemetry Collector Component"
    description: "Transmit telemetry via OTLP over gRPC/HTTP"
  - source: "OpenTelemetry Collector Component"
    destination: "Azure Monitor Exporter Component"
    description: "Routes logs and traces"
  - source: "OpenTelemetry Collector Component"
    destination: "Managed Prometheus Exporter Component"
    description: "Forwards metrics"
  - source: "Grafana Visualization Component"
    destination: "Azure Monitor Exporter Component"
    description: "Queries Azure backends via Azure Monitor APIs"
  - source: "Grafana Visualization Component"
    destination: "Managed Prometheus Exporter Component"
    description: "Queries Azure backends via PromQL"
  - source: "On-premise legacy mainframe and ACL Gateway"
    destination: "Secure Hybrid Ingress Component"
    description: "Transmit telemetry using Azure Private Link and VPN/ExpressRoute"