level: component
scope: "Component diagram for the Integration Worker container"
parentContainer:
  name: "Integration Worker"
elements:
  - type: "component"
    name: "Message Listener Component"
    technology: ".NET / C#, AMQP"
    description: "Listens for messages from Azure Service Bus to synchronize claim data."
  - type: "component"
    name: "Transformation Engine Component"
    technology: ".NET / C#"
    description: "Transforms claim data between the new cloud platform and legacy formats."
  - type: "component"
    name: "Outbox/Retry Dispatcher Component"
    technology: ".NET / C#"
    description: "Dispatches messages reliably with outbox pattern and retry logic."
  - type: "component"
    name: "Integration Audit Logger Component"
    technology: ".NET / C#"
    description: "Logs integration activities and audit trails."
  - type: "component"
    name: "Circuit Breaker Policy Manager"
    technology: ".NET / C#, Polly"
    description: "Manages resilience and circuit breaking against mainframe outages."
  - type: "component"
    name: "Feature/Kill-Switch Component"
    technology: ".NET / C#, ASP.NET Core Minimal APIs"
    description: "Provides an administrative kill-switch for fast rollbacks."
relationships:
  - source: "Message Listener Component"
    destination: "Transformation Engine Component"
    description: "In-process, Direct Method Calls"
  - source: "Transformation Engine Component"
    destination: "Outbox/Retry Dispatcher Component"
    description: "In-process, Direct Method Calls"
  - source: "Outbox/Retry Dispatcher Component"
    destination: "ACL Gateway"
    description: "HTTPS/REST"
  - source: "Integration Worker"
    destination: "Azure Service Bus"
    description: "AMQP"
  - source: "Integration Audit Logger Component"
    destination: "Azure Application Insights"
    description: "HTTPS/REST"