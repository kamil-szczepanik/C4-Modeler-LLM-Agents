level: component
scope: "Component diagram for the Operational Data Store (PostgreSQL) container"
parentContainer:
  name: "Operational Data Store (PostgreSQL)"
elements:
  - type: "component"
    name: "Claim State & Domain Store"
    technology: "Azure Database for PostgreSQL Flexible Server"
    description: "Stores core claim states and domain data with native JSONB support and high availability."
  - type: "component"
    name: "Read Model & Cache Store"
    technology: "Azure Database for PostgreSQL Read Replica"
    description: "Provides optimized read access and caching for adjuster workflows to overcome legacy latency."
  - type: "component"
    name: "Migration Metadata Store"
    technology: "Azure Database for PostgreSQL Flexible Server"
    description: "Tracks migration metadata to ensure continuous processing during mainframe transition."
  - type: "component"
    name: "Audit & Compliance Log Store"
    technology: "Azure Database for PostgreSQL with pgaudit Extension"
    description: "Maintains granular session and object audit logs for insurance regulatory compliance."
  - type: "component"
    name: "PgBouncer Connection Pooler"
    technology: "PgBouncer"
    description: "Manages and optimizes database connection pooling to prevent exhaustion during peak loads."
  - type: "component"
    name: "Azure Monitor / Log Analytics Workspace"
    technology: "Azure Monitor"
    description: "Centralizes audit and diagnostic log streaming from the operational database."
relationships:
  - source: "Core Claims Domain"
    destination: "Claim State & Domain Store"
    description: "SQL / ADO.NET [TLS]"
  - source: "Adjuster BFF"
    destination: "Read Model & Cache Store"
    description: "SQL / Entity Framework Core [TLS]"
  - source: "Core Claims Domain"
    destination: "Audit & Compliance Log Store"
    description: "Internal DB Write [TLS]"
  - source: "Azure Database for PostgreSQL"
    destination: "Azure Monitor / Log Analytics Workspace"
    description: "Native Diagnostic Log Streaming [Encrypted]"