level: container
scope: "Container diagram for Insurance Claims Modernization system"
system:
  name: "Insurance Claims Modernization system"
elements:
  - type: "person"
    name: "Policyholders"
    description: "External users submitting and checking the status of claims."
  - type: "person"
    name: "Brokers"
    description: "External intermediaries interacting with the platform on behalf of policyholders."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users performing adjuster workflows and reviewing claims."
  - type: "externalSystem"
    name: "Legacy COBOL/DB2 Mainframe"
    description: "30-year-old on-premises mainframe handling legacy batch processing and primary data storage."
  - type: "externalSystem"
    name: "Microsoft Entra ID"
    description: "Identity Provider for single sign-on and secure entry."
  - type: "container"
    name: "Azure API Management (API Gateway)"
    description: "Centralized API management, routing, and ingress security."
    technology: "Azure APIM"
  - type: "container"
    name: "Customer/Broker Portal"
    description: "Frontend portal for policyholders and brokers to interact with the platform."
    technology: "Node.js, TypeScript, Azure App Service"
  - type: "container"
    name: "Adjuster Workstation"
    description: "Frontend interface providing sub-2s performance for claims adjusters."
    technology: "Node.js, TypeScript, Azure App Service"
  - type: "container"
    name: "Adjuster BFF"
    description: "Backend-for-Frontend service for adjuster workflows."
    technology: ".NET / C#"
  - type: "container"
    name: "Claim Migration Manager / Admin Portal"
    description: "Admin portal and migration manager for executing incremental claim migrations."
    technology: ".NET / C#"
  - type: "container"
    name: "Core Claims Domain"
    description: "Core business logic and domain services for modern claims processing."
    technology: ".NET / C#"
  - type: "container"
    name: "Integration Worker"
    description: "Integration service using an Anti-Corruption Layer (ACL) for asynchronous messaging and data synchronization with the mainframe."
    technology: ".NET / C#, Azure Service Bus"
  - type: "container"
    name: "Operational Data Store (PostgreSQL)"
    description: "Operational data store for persistence and caching."
    technology: "Azure Database for PostgreSQL"
  - type: "container"
    name: "Observability Service"
    description: "Monitors system health, metrics, and logs."
    technology: "Azure Application Insights, Prometheus, Grafana"
relationships:
  - source: "Policyholders"
    destination: "Azure API Management (API Gateway)"
    description: "Single sign-on and secure entry"
    technology: "HTTPS, OIDC, OAuth2"
  - source: "Brokers"
    destination: "Azure API Management (API Gateway)"
    description: "Single sign-on and secure entry"
    technology: "HTTPS, OIDC, OAuth2"
  - source: "Claims Adjusters"
    destination: "Azure API Management (API Gateway)"
    description: "Single sign-on and secure entry"
    technology: "HTTPS, OIDC, OAuth2"
  - source: "Azure API Management (API Gateway)"
    destination: "Customer/Broker Portal"
    description: "Routes traffic to frontend portals"
    technology: "HTTPS, gRPC"
  - source: "Azure API Management (API Gateway)"
    destination: "Adjuster Workstation"
    description: "Routes traffic to frontend workstations"
    technology: "HTTPS, gRPC"
  - source: "Customer/Broker Portal"
    destination: "Core Claims Domain"
    description: "Internal domain communication"
    technology: "HTTPS, gRPC"
  - source: "Adjuster Workstation"
    destination: "Adjuster BFF"
    description: "Internal domain communication"
    technology: "HTTPS, gRPC"
  - source: "Adjuster BFF"
    destination: "Core Claims Domain"
    description: "Internal domain communication"
    technology: "HTTPS, gRPC"
  - source: "Integration Worker"
    destination: "Legacy COBOL/DB2 Mainframe"
    description: "Asynchronous event processing and data synchronization via ACL Gateway and Azure Service Bus"
    technology: "Asynchronous Messaging"
  - source: "Core Claims Domain"
    destination: "Operational Data Store (PostgreSQL)"
    description: "Operational data persistence and caching"
    technology: "TLS"
  - source: "Adjuster BFF"
    destination: "Operational Data Store (PostgreSQL)"
    description: "Operational data persistence and caching"
    technology: "TLS"