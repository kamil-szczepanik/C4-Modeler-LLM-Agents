level: context
scope: "System Context diagram for Regional Insurer Mainframe Claims Platform Modernization"
system:
  name: "New Claims Platform"
  description: "A cloud-based web application modernizing a 30-year-old regional insurer mainframe claims platform, enabling gradual, risk-mitigated claim migration while keeping the legacy system as the primary data store."
elements:
  - type: "person"
    name: "Policyholders and Brokers"
    description: "External users submitting claims and interacting with the system."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users performing adjuster workflows within the system."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "IBM z/OS, COBOL, and DB2 system serving as the primary data store and processing backbone."
  - type: "externalSystem"
    name: "Microsoft Entra ID"
    description: "Identity Provider enforcing enterprise Single Sign-On and role-based access control."
  - type: "externalSystem"
    name: "Anti-Corruption Layer (ACL) Gateway"
    description: "Gateway isolating modern user experiences from legacy latency via asynchronous messaging."
relationships:
  - source: "Policyholders and Brokers"
    destination: "New Claims Platform"
    description: "Submit claims and interact with the platform"
    technology: "HTTPS/TLS"
  - source: "Claims Adjusters"
    destination: "New Claims Platform"
    description: "Execute adjuster workflows"
    technology: "HTTPS/TLS"
  - source: "New Claims Platform"
    destination: "Microsoft Entra ID"
    description: "Authenticates users for Single Sign-On"
    technology: "OpenID Connect (OIDC) / OAuth 2.0"
  - source: "New Claims Platform"
    destination: "Anti-Corruption Layer (ACL) Gateway"
    description: "Sends and receives claim data asynchronously"
    technology: "Azure Service Bus"
  - source: "Anti-Corruption Layer (ACL) Gateway"
    destination: "Legacy Mainframe"
    description: "Syncs data and executes batch operations"
    technology: "Asynchronous Messaging and Managed File Transfer (MFT)"