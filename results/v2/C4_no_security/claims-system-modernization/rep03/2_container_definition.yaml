level: container
scope: "Container diagram for New Claims Platform"
system:
  name: "New Claims Platform"
elements:
  - type: "person"
    name: "Customers & Brokers"
    description: "External users submitting and managing claims via web portal."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff reviewing and processing claims via web application."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "Insurer's Active Directory / Azure AD"
    description: "Identity provider for authentication and authorization."
  - type: "container"
    name: "Customer & Broker Portal"
    technology: "React SPA / Azure Static Web Apps"
    description: "Web interface for customers and brokers to submit and track claims."
  - type: "container"
    name: "Adjuster Web Application"
    technology: "React SPA / Azure Static Web Apps"
    description: "Web interface for claims adjusters to process and manage claims."
  - type: "container"
    name: "API Gateway / Backend-for-Frontend"
    technology: "Node.js / NestJS"
    description: "Routes API requests and aggregates data for frontend applications."
  - type: "container"
    name: "Claims Core Processing Service"
    technology: ".NET Core / C# on Azure App Service"
    description: "Handles core business logic and claims processing workflows."
  - type: "container"
    name: "Mainframe Integration Adapter"
    technology: "Azure Functions / App Service"
    description: "Integrates with the legacy mainframe system respecting batch windows."
  - type: "container"
    name: "Azure Service Bus"
    technology: "Azure Service Bus with DLQ"
    description: "Handles asynchronous messaging and event distribution."
  - type: "container"
    name: "Azure SQL Database"
    technology: "Azure SQL Database"
    description: "Stores relational data for the new claims platform."
relationships:
  - source: "Customers & Brokers"
    destination: "Customer & Broker Portal"
    description: "Interacts with portal to submit and manage claims"
    technology: "HTTPS/JSON"
  - source: "Claims Adjusters"
    destination: "Adjuster Web Application"
    description: "Interacts with web app to process claims"
    technology: "HTTPS/JSON"
  - source: "Customer & Broker Portal"
    destination: "API Gateway / Backend-for-Frontend"
    description: "Communicates with BFF for data and operations"
    technology: "HTTPS/REST"
  - source: "Adjuster Web Application"
    destination: "API Gateway / Backend-for-Frontend"
    description: "Communicates with BFF for data and operations"
    technology: "HTTPS/REST"
  - source: "API Gateway / Backend-for-Frontend"
    destination: "Claims Core Processing Service"
    description: "Invokes core claims processing"
    technology: "gRPC/HTTPS"
  - source: "API Gateway / Backend-for-Frontend"
    destination: "Mainframe Integration Adapter"
    description: "Communicates with mainframe adapter"
    technology: "gRPC/HTTPS"
  - source: "Claims Core Processing Service"
    destination: "Azure Service Bus"
    description: "Publishes and consumes messages"
    technology: "AMQP"
  - source: "Mainframe Integration Adapter"
    destination: "Legacy Mainframe"
    description: "Synchronizes data respecting batch window"
    technology: "Legacy protocols (MQ/CICS)"
  - source: "Customer & Broker Portal"
    destination: "Insurer's Active Directory / Azure AD"
    description: "Authenticates users"
    technology: "OAuth2/OpenID Connect"
  - source: "Adjuster Web Application"
    destination: "Insurer's Active Directory / Azure AD"
    description: "Authenticates users"
    technology: "OAuth2/OpenID Connect"
  - source: "API Gateway / Backend-for-Frontend"
    destination: "Insurer's Active Directory / Azure AD"
    description: "Authenticates tokens"
    technology: "OAuth2/OpenID Connect"
  - source: "Claims Core Processing Service"
    destination: "Azure SQL Database"
    description: "Reads and writes claim data"
    technology: "T-SQL / TDS"