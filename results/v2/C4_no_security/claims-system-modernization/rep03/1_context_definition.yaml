level: context
scope: "System Context diagram for New Claims Platform"
system:
  name: "New Claims Platform"
  description: "A hybrid cloud application modernizing a regional insurer's legacy COBOL/DB2 mainframe claims platform, enabling incremental claim-type migration with zero data loss."
elements:
  - type: "person"
    name: "Customers & Brokers"
    description: "External users submitting and managing claims via web or mobile UI."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff reviewing and processing claims via web app."
  - type: "person"
    name: "Business Operations / Compliance Officers"
    description: "Internal stakeholders ensuring compliance and auditing."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise COBOL/DB2 system-of-record operations."
  - type: "externalSystem"
    name: "Insurer's Active Directory / Azure AD"
    description: "Identity provider for Single Sign-On."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Third-party SaaS for handling claim settlements."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Email/SMS provider for customer alerts."
relationships:
  - source: "Customers & Brokers"
    destination: "New Claims Platform"
    description: "Submits and tracks claims"
    technology: "HTTPS (Web/Mobile UI)"
  - source: "Claims Adjusters"
    destination: "New Claims Platform"
    description: "Processes and manages claims"
    technology: "HTTPS (Web App < 2s load time)"
  - source: "New Claims Platform"
    destination: "Legacy Mainframe"
    description: "Synchronizes claim data"
    technology: "Asynchronous messaging via Azure Service Bus and ESB"
  - source: "New Claims Platform"
    destination: "Payment Gateway"
    description: "Executes claim settlements"
    technology: "HTTPS/REST"
  - source: "New Claims Platform"
    destination: "Notification Service"
    description: "Sends customer alerts"
    technology: "HTTPS/API"
  - source: "New Claims Platform"
    destination: "Insurer's Active Directory / Azure AD"
    description: "Authenticates users"
    technology: "OIDC/OAuth2 (Single Sign-On)"