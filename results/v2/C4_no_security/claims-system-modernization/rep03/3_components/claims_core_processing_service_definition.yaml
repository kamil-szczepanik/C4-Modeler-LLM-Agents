level: component
scope: "Component diagram for the Claims Core Processing Service container"
parentContainer:
  name: "Claims Core Processing Service"
elements:
  - type: "component"
    name: "Claims Workflow Orchestrator"
    technology: "MassTransit State Machine"
    description: "Manages sagas and state machines to guarantee consistency and orchestrate the claims workflow."
  - type: "component"
    name: "Claim Domain Model"
    technology: ".NET Core"
    description: "Encapsulates the core business logic and domain model for claims."
  - type: "component"
    name: "Mainframe Sync Coordinator"
    technology: ".NET Core with Polly"
    description: "Syncs dual-writes and implements circuit breakers for resilient mainframe integration."
  - type: "component"
    name: "Payout & Ledger Engine"
    technology: ".NET Core"
    description: "Initiates and processes financial disbursements."
  - type: "component"
    name: "Azure Container Apps (ACA)"
    technology: "Azure Container Apps with KEDA"
    description: "Hosts the event-driven microservices with event-driven scaling."
  - type: "component"
    name: "Azure Service Bus with DLQ"
    technology: "Azure Service Bus"
    description: "Dispatches and manages domain events with dead-letter queues."
  - type: "component"
    name: "Azure SQL Database"
    technology: "Azure SQL Database"
    description: "Provides reliable relational persistence and audit trails."
relationships:
  - source: "Claims Workflow Orchestrator"
    destination: "Claim Domain Model"
    description: "Invokes [In-process]"
  - source: "Claims Workflow Orchestrator"
    destination: "Payout & Ledger Engine"
    description: "Initiates disbursements [In-process]"
  - source: "Claims Workflow Orchestrator"
    destination: "Azure SQL Database"
    description: "Persists state [Entity Framework Core / T-SQL]"
  - source: "Claims Workflow Orchestrator"
    destination: "Azure Service Bus with DLQ"
    description: "Dispatches domain events [AMQP]"
  - source: "Mainframe Sync Coordinator"
    destination: "Mainframe Integration Adapter"
    description: "Syncs dual-writes [gRPC/HTTPS]"