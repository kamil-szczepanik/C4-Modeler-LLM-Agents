level: component
scope: "Component diagram for the Customer & Broker Portal container"
parentContainer:
  name: "Customer & Broker Portal"
elements:
  - type: "component"
    name: "Claim Submission Controller"
    technology: "React Component"
    description: "Handles user input and validation for new claim submissions."
  - type: "component"
    name: "Claim Management UI"
    technology: "React Component"
    description: "Allows customers and brokers to view and track existing claims."
  - type: "component"
    name: "Authentication Client"
    technology: "OAuth2 / OpenID Connect Client"
    description: "Manages user login and session states via Azure AD."
relationships:
  - source: "Claim Submission Controller"
    destination: "API Gateway / BFF"
    description: "Submits new claims"
  - source: "Claim Management UI"
    destination: "API Gateway / BFF"
    description: "Fetches claim details"
  - source: "Authentication Client"
    destination: "Azure AD"
    description: "Authenticates users"