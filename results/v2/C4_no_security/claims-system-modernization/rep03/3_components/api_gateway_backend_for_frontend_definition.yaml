level: component
scope: "Component diagram for the API Gateway / Backend-for-Frontend container"
parentContainer:
  name: "API Gateway / Backend-for-Frontend"
elements:
  - type: "component"
    name: "Authentication & Authorization Component"
    technology: "Passport.js / OIDC"
    description: "Passport.js and OIDC validator for Azure AD tokens, implementing Single Sign-On integration with corporate Active Directory / Azure AD."
  - type: "component"
    name: "Customer BFF Router & Aggregator"
    technology: "NestJS"
    description: "NestJS controller handling lightweight customer and broker portals."
  - type: "component"
    name: "Adjuster BFF Router & Aggregator"
    technology: "NestJS"
    description: "NestJS controller providing parallel data fetching and caching for claims adjusters."
  - type: "component"
    name: "Migration Routing Proxy"
    technology: "NestJS Middleware / Interceptor"
    description: "NestJS middleware/interceptor dynamically routing claim types based on migration state."
  - type: "component"
    name: "API Composition & Data Shaping Service"
    technology: "RxJS"
    description: "RxJS-based service managing parallel data aggregation and partial-response fallbacks."
  - type: "component"
    name: "Audit Logging & Analytics Component"
    technology: "NestJS Interceptor"
    description: "Interceptor emitting asynchronous telemetry to Azure Application Insights."
relationships:
  - source: "Customer & Broker Portal"
    destination: "Authentication & Authorization Component"
    description: "Authenticates users [HTTPS/OAuth2/OIDC]"
  - source: "Adjuster Web Application"
    destination: "Authentication & Authorization Component"
    description: "Authenticates users [HTTPS/OAuth2/OIDC]"
  - source: "Customer BFF Router & Aggregator"
    destination: "Claims Core Processing Service"
    description: "Invokes core claims [gRPC/HTTPS]"
  - source: "Adjuster BFF Router & Aggregator"
    destination: "Mainframe Integration Adapter"
    description: "Communicates with legacy backend [gRPC/HTTPS]"
  - source: "Migration Routing Proxy"
    destination: "Azure Service Bus"
    description: "Publishes asynchronous events [AMQP]"
  - source: "Audit Logging & Analytics Component"
    destination: "Azure Application Insights"
    description: "Dispatches telemetry [HTTPS]"