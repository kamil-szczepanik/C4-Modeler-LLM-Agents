level: component
scope: "Component diagram for the Mainframe Integration Adapter container"
parentContainer:
  name: "Mainframe Integration Adapter"
elements:
  - type: "component"
    name: "Adapter API Controller"
    technology: ".NET 8 / Web API"
    description: "Handles incoming API requests and routes integration logic."
  - type: "component"
    name: "Mainframe Broker Client"
    technology: ".NET 8 with Polly circuit breakers"
    description: "Communicates with the legacy mainframe and enforces batch-window protocols."
  - type: "component"
    name: "Routing & Feature Flag Component"
    technology: ".NET 8"
    description: "Manages routing and feature flags via Azure App Configuration for claim type rollbacks."
relationships:
  - source: "Adapter API Controller"
    destination: "Mainframe Broker Client"
    description: "Delegates mainframe requests [gRPC/HTTPS]"
  - source: "Mainframe Broker Client"
    destination: "Legacy Mainframe"
    description: "Sends messages [IBM MQ / CICS over TLS]"
  - source: "Routing & Feature Flag Component"
    destination: "Azure App Configuration"
    description: "Fetches configuration [HTTPS]"