level: component
scope: "Component diagram for the Azure SQL Database container"
parentContainer:
  name: "Azure SQL Database"
elements:
  - type: "component"
    name: "Claim Data Store"
    technology: "Extensible relational tables"
    description: "Provides transactional persistence and extensible relational tables for incrementally migrated claims."
  - type: "component"
    name: "Audit & Security Subsystem"
    technology: "Row-Level Security and Azure SQL Audit"
    description: "Enforces security policies and auditing at the row level."
  - type: "component"
    name: "Change Data Capture / CDC"
    technology: "Row-level change emitter"
    description: "Emits row-level changes for synchronizing state with the mainframe integration adapter."
  - type: "component"
    name: "Partitioning & Retention Engine"
    technology: "Sliding window table partitioning"
    description: "Manages sliding window table partitioning and archives historical claims to Azure Blob Storage."
  - type: "component"
    name: "Read-Only Replica Routing"
    technology: "Secondary read endpoint"
    description: "Routes analytical queries to secondary read endpoints to protect critical performance constraints."
relationships:
  - source: "Claims Core Processing Service"
    destination: "Claim Data Store"
    description: "Reads and writes claim data via T-SQL / TDS (TLS 1.3)"
  - source: "Mainframe Integration Adapter"
    destination: "Change Data Capture / CDC"
    description: "Synchronizes state via T-SQL / TDS Change Data Capture"
  - source: "Reporting / Compliance Tools"
    destination: "Read-Only Replica Routing"
    description: "Queries analytical data via Read-Only Replica T-SQL / TDS"
  - source: "Partitioning & Retention Engine"
    destination: "Azure Blob Storage"
    description: "Archives historical claims via External Tables / Managed Backup"