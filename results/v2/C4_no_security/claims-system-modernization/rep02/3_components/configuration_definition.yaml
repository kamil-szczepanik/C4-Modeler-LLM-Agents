level: component
scope: "Component diagram for the Configuration container"
parentContainer:
  name: "Configuration"
elements:
  - type: "component"
    name: "Configuration Manager"
    technology: "Persona / ITSM Interface"
    description: "Triggers rollback and toggle requests."
  - type: "component"
    name: "Feature Flag Store"
    technology: "Azure App Configuration Native Feature Manager"
    description: "Manages feature flags for seamless transitions and rapid rollbacks."
  - type: "component"
    name: "Dynamic Routing Store"
    technology: "Azure App Configuration Key-Value Store"
    description: "Manages dynamic routing rules to ensure seamless transitions."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "Azure Monitor / Log Analytics"
    description: "Provides audit logging and alerting for synchronization drift and changes."
  - type: "component"
    name: "Configuration Sync Agent"
    technology: "Azure DevOps Pipeline / Azure Functions"
    description: "Automated synchronization and deployment of Git-backed configuration changes."
  - type: "component"
    name: "Git Repository"
    technology: "Source Control for IaC"
    description: "Version control for Infrastructure as Code (IaC) and audit trails."
relationships:
  - source: "Configuration Manager"
    destination: "ITSM Tool"
    description: "Triggers rollback and toggle requests [HTTPS]"
  - source: "ITSM Tool"
    destination: "Git Repository"
    description: "Initiates configuration updates upon approval [Webhook / REST]"
  - source: "Configuration Sync Agent"
    destination: "Feature Flag Store"
    description: "Applies validated configuration batches [Azure App Configuration SDK, HTTPS]"
  - source: "Configuration Sync Agent"
    destination: "Dynamic Routing Store"
    description: "Applies validated configuration batches [Azure App Configuration SDK, HTTPS]"
  - source: "API Gateway / Integration Container"
    destination: "Dynamic Routing Store"
    description: "Fetches routing rules and polls updates [HTTPS, SDK]"
  - source: "Claims Core Service Container"
    destination: "Feature Flag Store"
    description: "Evaluates feature flags locally with polling and caching [HTTPS, SDK]"