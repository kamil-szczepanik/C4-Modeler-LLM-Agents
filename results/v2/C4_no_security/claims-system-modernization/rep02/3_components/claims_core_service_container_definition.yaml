level: component
scope: "Component diagram for the Claims Core Service Container container"
parentContainer:
  name: "Claims Core Service Container"
elements:
  - type: "component"
    name: "Claim Orchestration Component"
    technology: "Spring State Machine"
    description: "Manages complex claim lifecycles asynchronously."
  - type: "component"
    name: "Migration Router Component"
    technology: "Java / Spring Boot with Resilience4j Circuit Breaker"
    description: "Routes claim traffic and protects against legacy mainframe outages during batch windows."
  - type: "component"
    name: "Domain Service Components"
    technology: "Spring Data JPA"
    description: "Handles core domain logic and data persistence."
  - type: "component"
    name: "Audit & Reconciliation Component"
    technology: "Spring Batch / Spring Integration"
    description: "Handles reliable asynchronous ledger checks, persists audit logs, and reconciles modern records against legacy batch exports."
  - type: "component"
    name: "Mainframe Adapter Container"
    technology: "Azure Service Bus"
    description: "Interfaces with the mainframe system for unmigrated claim traffic and batch exports."
  - type: "component"
    name: "Data & Caching Container"
    technology: "Azure Cosmos DB + Redis"
    description: "Stores transactional data, read models, audit logs, and reconciliation state."
relationships:
  - source: "Migration Router Component"
    destination: "Mainframe Adapter Container"
    description: "Forwards unmigrated claim traffic [AMQP / Azure Service Bus]"
  - source: "Claim Orchestration Component"
    destination: "Data & Caching Container"
    description: "Reads/writes transactional data and read models [TCP/TLS]"
  - source: "Audit & Reconciliation Component"
    destination: "Data & Caching Container"
    description: "Persists audit logs and reconciliation state [TCP/TLS]"
  - source: "Audit & Reconciliation Component"
    destination: "Mainframe Adapter Container"
    description: "Reconciles modern records against legacy batch exports [AMQP / REST]"