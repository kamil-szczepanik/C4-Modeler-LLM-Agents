level: component
scope: "Component diagram for the Data & Caching Container container"
parentContainer:
  name: "Data & Caching Container"
elements:
  - type: "component"
    name: "Transactional Store Component"
    technology: "Azure Cosmos DB (SQL API)"
    description: "Persists primary CRUD operations with strong session consistency and polymorphic schemas supporting incremental migration."
  - type: "component"
    name: "Read Model Cache Component"
    technology: "Azure Cache for Redis"
    description: "Caches pre-aggregated claim views ensuring sub-2s latency."
  - type: "component"
    name: "Audit & Reconciliation Log Component"
    technology: "Cosmos DB Change Feed"
    description: "Tracks state mutations for rollbacks, automated state tracking, event-driven cache invalidation, and bi-directional mainframe reconciliation."
  - type: "component"
    name: "Data Lifecycle & Compliance Worker"
    technology: "Background processor"
    description: "Processes TTLs and archiving for data lifecycle and compliance."
  - type: "container"
    name: "Claims Core Service Container"
    technology: "Containerized Service"
    description: "External consumer interacting with the transactional store and read model cache."
relationships:
  - source: "Claims Core Service Container"
    destination: "Transactional Store Component"
    description: "Persists primary CRUD operations [TCP/TLS via Azure SDK]"
  - source: "Claims Core Service Container"
    destination: "Read Model Cache Component"
    description: "Fetches read projections for sub-2s loads [TCP/TLS via Jedis]"
  - source: "Transactional Store Component"
    destination: "Audit & Reconciliation Log Component"
    description: "Tracks state mutations for rollbacks [Internal async via Change Feed]"