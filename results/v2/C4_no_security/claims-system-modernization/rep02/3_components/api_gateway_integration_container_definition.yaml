level: component
scope: "Component diagram for the API Gateway / Integration Container container"
parentContainer:
  name: "API Gateway / Integration Container"
elements:
  - type: "component"
    name: "API Router and Policy Enforcer"
    technology: "Azure API Management"
    description: "Enforces routing, security, and resilience policies, directing traffic between web frontend, cloud services, and legacy systems."
  - type: "component"
    name: "Legacy Protocol Adapter"
    technology: "Azure Service Bus with Dead Letter Queues"
    description: "Handles asynchronous message offloading and communication with the Mainframe COBOL/DB2 System."
  - type: "component"
    name: "Configuration Manager"
    technology: "Azure App Configuration"
    description: "Stores dynamic routing rules to support rapid fallback to the mainframe."
relationships:
  - source: "API Router and Policy Enforcer"
    destination: "Legacy Protocol Adapter"
    description: "Offloads asynchronous messages via AMQP / HTTPS"
  - source: "API Router and Policy Enforcer"
    destination: "Configuration Manager"
    description: "Fetches dynamic routing rules via HTTPS"