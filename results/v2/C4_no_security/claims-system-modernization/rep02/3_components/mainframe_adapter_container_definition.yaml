level: component
scope: "Component diagram for the Mainframe Adapter Container container"
parentContainer:
  name: "Mainframe Adapter Container"
elements:
  - type: "component"
    name: "Inbound Message Router"
    technology: "Java / Azure Service Bus Listener"
    description: "Routes incoming messages from the Claims Core Service to appropriate mainframe queues."
  - type: "component"
    name: "Batch Window Gatekeeper"
    technology: "Java / Quartz Scheduler"
    description: "Controls the flow of transactions during designated mainframe batch windows."
  - type: "component"
    name: "Mainframe Connector Client"
    technology: "IBM MQ Client / TCP/IP"
    description: "Connects securely to the Mainframe COBOL/DB2 System via Azure ExpressRoute."
  - type: "component"
    name: "DLQ Management Service"
    technology: "Azure Service Bus Dead Letter Queue Handler"
    description: "Manages failed message processing, error handling, and message retries."
  - type: "component"
    name: "Audit & Compliance Interceptor"
    technology: "OpenTelemetry / Java Interceptor"
    description: "Captures audit trails and compliance logs for all mainframe transactions."
  - type: "component"
    name: "DLQ Notification Publisher"
    technology: "Azure Service Bus / Event Notification"
    description: "Publishes alerts when messages are routed to the dead letter queue."
relationships:
  - source: "Inbound Message Router"
    destination: "Batch Window Gatekeeper"
    description: "Checks batch schedule constraints"
  - source: "Batch Window Gatekeeper"
    destination: "Mainframe Connector Client"
    description: "Dispatches validated messages"
  - source: "Mainframe Connector Client"
    destination: "Mainframe COBOL/DB2 System"
    description: "Transmits messages via IBM MQ / TCP/IP"
  - source: "Inbound Message Router"
    destination: "DLQ Management Service"
    description: "Routes failed messages"
  - source: "DLQ Management Service"
    destination: "DLQ Notification Publisher"
    description: "Triggers alerts for failed messages"
  - source: "Inbound Message Router"
    destination: "Audit & Compliance Interceptor"
    description: "Logs transaction metadata"