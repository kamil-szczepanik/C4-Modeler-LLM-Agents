level: container
scope: "Container diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization"
elements:
  - type: "person"
    name: "Customer"
    description: "External users who submit online claims."
  - type: "person"
    name: "Broker"
    description: "External users who submit and manage claims on behalf of customers."
  - type: "person"
    name: "Claims Adjuster"
    description: "Internal users who manage claims and review details."
  - type: "externalSystem"
    name: "Active Directory / Azure AD"
    description: "Identity provider handling Single Sign-On and authentication."
  - type: "externalSystem"
    name: "Mainframe COBOL/DB2 System"
    description: "Legacy 30-year-old on-premise claims platform and system of record."
  - type: "container"
    name: "Web Application Container"
    technology: "React / Node.js on Azure App Service"
    description: "Frontend interface supporting online claims submission and adjuster management."
  - type: "container"
    name: "API Gateway / Integration Container"
    technology: "Azure API Management"
    description: "Routes requests dynamically and acts as an anti-corruption layer protecting the mainframe."
  - type: "container"
    name: "Claims Core Service Container"
    technology: "Java / Spring Boot on Azure Container Apps"
    description: "Core processing service for claims and migration handling."
  - type: "container"
    name: "Data & Caching Container"
    technology: "Azure Cosmos DB + Redis"
    description: "Provides persistent storage and low-latency state caching for adjuster screens."
  - type: "container"
    name: "Mainframe Adapter Container"
    technology: "Azure Service Bus with Dead Letter Queues"
    description: "Bridges asynchronous messaging with the on-premise mainframe during batch windows."
  - type: "container"
    name: "Configuration"
    technology: "Azure App Configuration"
    description: "Manages feature flags and dynamic routing configuration."
relationships:
  - source: "Customer"
    destination: "Web Application Container"
    description: "Interacts with web application for online claims submission"
    technology: "HTTPS"
  - source: "Broker"
    destination: "Web Application Container"
    description: "Interacts with web application for online claims submission"
    technology: "HTTPS"
  - source: "Claims Adjuster"
    destination: "Web Application Container"
    description: "Interacts with web application for adjuster management"
    technology: "HTTPS"
  - source: "Claims Adjuster"
    destination: "Active Directory / Azure AD"
    description: "Authenticated via Single Sign-On"
    technology: "OIDC / OAuth2"
  - source: "Web Application Container"
    destination: "API Gateway / Integration Container"
    description: "Communicates requests to backend services"
    technology: "HTTPS / REST"
  - source: "API Gateway / Integration Container"
    destination: "Claims Core Service Container"
    description: "Routes requests dynamically"
    technology: "HTTPS / REST"
  - source: "API Gateway / Integration Container"
    destination: "Mainframe COBOL/DB2 System"
    description: "Routes requests dynamically to legacy system"
    technology: "TCP"
  - source: "API Gateway / Integration Container"
    destination: "Configuration"
    description: "Retrieves dynamic routing configurations"
    technology: "HTTPS"
  - source: "Claims Core Service Container"
    destination: "Data & Caching Container"
    description: "Persists data and caches read models"
    technology: "TCP/TLS"
  - source: "Mainframe Adapter Container"
    destination: "Mainframe COBOL/DB2 System"
    description: "Bridges asynchronous messaging with on-premise mainframe during batch window"
    technology: "AMQP / Batch Sync"