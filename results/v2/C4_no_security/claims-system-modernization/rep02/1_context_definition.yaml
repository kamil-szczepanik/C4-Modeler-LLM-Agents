level: container
scope: "Container diagram for Regional Insurance Claims Platform"
system:
  name: "Regional Insurance Claims Platform"
  description: "Modernized hybrid insurance claims platform migrating COBOL/DB2 workflows to Azure while keeping the mainframe as the system of record."
elements:
  - type: "person"
    name: "Customer / Broker"
    description: "External users who submit online claims and interact with the customer portal."
  - type: "person"
    name: "Claims Adjuster"
    description: "External users who perform rapid adjuster processing of claims."
  - type: "externalSystem"
    name: "Active Directory / Azure AD"
    description: "Identity Provider handling authentication and authorization."
  - type: "externalSystem"
    name: "Mainframe COBOL/DB2 System"
    description: "On-premises system of record."
  - type: "container"
    name: "Customer Portal SPA"
    description: "Frontend application for customers and brokers."
    technology: "Azure Static Web Apps"
  - type: "container"
    name: "Adjuster Web App"
    description: "Frontend application for claims adjusters."
    technology: "Azure App Service"
  - type: "container"
    name: "Claims Core API"
    description: "Microservices container runtime for core claim processing and gradual claim type migration."
    technology: "Azure Container Apps"
  - type: "container"
    name: "Integration Gateway / ACL"
    description: "Anti-Corruption Layer to protect the mainframe from frequent interface changes."
    technology: "Azure API Management / Azure Functions"
  - type: "container"
    name: "Azure Cache for Redis"
    description: "Distributed caching to achieve sub-2-second adjuster screen loads."
    technology: "Azure Cache for Redis"
  - type: "container"
    name: "Azure Service Bus"
    description: "Reliable messaging with dead-letter queues to ensure zero data loss during hybrid sync."
    technology: "Azure Service Bus"
  - type: "container"
    name: "Azure Cosmos DB / SQL Database"
    description: "Modern persistence tier for newly migrated claim types."
    technology: "Azure Cosmos DB / SQL Database"
relationships:
  - source: "Customer / Broker"
    destination: "Customer Portal SPA"
    description: "Submits claims and interacts with portal"
    technology: "HTTPS (R-01)"
  - source: "Claims Adjuster"
    destination: "Adjuster Web App"
    description: "Processes claims"
    technology: "HTTPS (R-02)"
  - source: "Customer Portal SPA"
    destination: "Claims Core API"
    description: "Requests claim data and processing"
    technology: "HTTPS/REST"
  - source: "Adjuster Web App"
    destination: "Claims Core API"
    description: "Requests adjuster workflows and data"
    technology: "HTTPS/REST"
  - source: "Claims Core API"
    destination: "Azure Cosmos DB / SQL Database"
    description: "Reads and writes modern claim data"
    technology: "TCP/TLS"
  - source: "Claims Core API"
    destination: "Integration Gateway / ACL"
    description: "Interfaces with legacy workflows"
    technology: "HTTPS/gRPC"
  - source: "Integration Gateway / ACL"
    destination: "Mainframe COBOL/DB2 System"
    description: "Syncs and retrieves legacy records"
    technology: "IBM MQ / TN3270 / TCP"
  - source: "Claims Core API"
    destination: "Azure Service Bus"
    description: "Publishes asynchronous messages"
    technology: "AMQP (R-04)"
  - source: "Adjuster Web App"
    destination: "Azure Cache for Redis"
    description: "Caches data for fast screen loads"
    technology: "TCP (R-05)"
  - source: "Customer Portal SPA"
    destination: "Active Directory / Azure AD"
    description: "Authenticates users"
    technology: "OIDC / OAuth2 (R-07)"
  - source: "Adjuster Web App"
    destination: "Active Directory / Azure AD"
    description: "Authenticates users"
    technology: "OIDC / OAuth2 (R-07)"
  - source: "Claims Core API"
    destination: "Active Directory / Azure AD"
    description: "Authenticates requests"
    technology: "OIDC / OAuth2 (R-07)"