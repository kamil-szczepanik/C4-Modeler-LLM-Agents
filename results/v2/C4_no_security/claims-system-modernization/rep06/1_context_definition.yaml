level: context
scope: "System Context diagram for New Insurance Platform"
system:
  name: "New Insurance Platform"
  description: "Modernizes a 30-year-old COBOL/DB2 mainframe claims platform into an Azure-hosted cloud solution, enabling online claim submission and adjuster processing."
elements:
  - type: "person"
    name: "Policyholders and Insurance Brokers"
    description: "Users who submit claims and interact with the insurance platform."
  - type: "person"
    name: "Claims Adjusters"
    description: "Users who process claims using the insurance platform."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premises COBOL/DB2 System of Record maintaining legacy data consistency."
  - type: "externalSystem"
    name: "Corporate Identity Provider"
    description: "On-premises Active Directory used for authentication and identity management."
  - type: "externalSystem"
    name: "Audit & Compliance Archive"
    description: "Azure Blob Storage with WORM policies for strict zero-data-loss compliance and audit retention."
relationships:
  - source: "Policyholders and Insurance Brokers"
    destination: "New Insurance Platform"
    description: "Interact with the platform for online claim submission"
    technology: "HTTPS"
  - source: "Claims Adjusters"
    destination: "New Insurance Platform"
    description: "Process claims via the platform"
    technology: "HTTPS"
  - source: "New Insurance Platform"
    destination: "Corporate Identity Provider"
    description: "Authenticates users via Microsoft Entra ID federated with On-Premises Active Directory"
    technology: "Microsoft Entra ID"
  - source: "New Insurance Platform"
    destination: "Legacy Mainframe"
    description: "Communicates asynchronously with the legacy system of record"
    technology: "Enterprise Service Bus / Message Queues"
  - source: "New Insurance Platform"
    destination: "Audit & Compliance Archive"
    description: "Streams audit logs for compliance"
    technology: "Azure Event Hubs / Azure Blob Storage"