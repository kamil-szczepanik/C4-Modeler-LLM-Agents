# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization"
elements:
  - type: "person"
    name: "Policyholders"
    description: "Users who submit claims and interact with the customer portal."
  - type: "person"
    name: "Insurance Brokers"
    description: "Users who interact with the customer portal on behalf of policyholders."
  - type: "person"
    name: "Claims Adjusters"
    description: "Users who manage and process claims within the adjuster workspace."
  - type: "person"
    name: "Operations Managers"
    description: "Users who monitor business operations via the dashboard."
  - type: "externalSystem"
    name: "COBOL/DB2 Mainframe"
    description: "On-premises system of record maintaining legacy data consistency."
  - type: "externalSystem"
    name: "Corporate Active Directory"
    description: "Identity provider used for single sign-on authentication."
  - type: "externalSystem"
    name: "Audit & Compliance Archive"
    description: "External archive for compliance and audit retention."
  - type: "container"
    name: "Azure API Management"
    technology: "Azure API Management"
    description: "API Gateway that routes traffic to frontends and microservices."
  - type: "container"
    name: "Customer Portal & Adjuster Workspace SPAs"
    technology: "Azure Static Web Apps"
    description: "Frontend Single Page Applications for policyholders, brokers, and claims adjusters."
  - type: "container"
    name: "Business Operations Dashboard SPA"
    technology: "Azure Static Web Apps"
    description: "Frontend Single Page Application for operations managers."
  - type: "container"
    name: "Claims Processing Core & Integration/Anti-Corruption Layer"
    technology: "Java / Spring Boot on Azure Container Apps"
    description: "Microservices responsible for claims business logic and interfacing with the legacy mainframe."
  - type: "container"
    name: "Azure SQL Database"
    technology: "Azure SQL Database"
    description: "Transactional database storing state and routing information."
  - type: "container"
    name: "Azure Service Bus"
    technology: "Azure Service Bus"
    description: "Message broker for asynchronous decoupling between services."
relationships:
  - source: "Policyholders"
    destination: "Azure API Management"
    description: "Interacts with the customer portal via HTTPS/TLS"
    technology: "HTTPS/TLS"
  - source: "Insurance Brokers"
    destination: "Azure API Management"
    description: "Interacts with the customer portal via HTTPS/TLS"
    technology: "HTTPS/TLS"
  - source: "Claims Adjusters"
    destination: "Azure API Management"
    description: "Interacts with the adjuster workspace via HTTPS/TLS"
    technology: "HTTPS/TLS"
  - source: "Operations Managers"
    destination: "Azure API Management"
    description: "Interacts with the business operations dashboard via HTTPS/TLS"
    technology: "HTTPS/TLS"
  - source: "Azure API Management"
    destination: "Corporate Active Directory"
    description: "Integrates for single sign-on"
    technology: "OpenID Connect / OAuth2"
  - source: "Azure API Management"
    destination: "Customer Portal & Adjuster Workspace SPAs"
    description: "Routes traffic to frontends"
    technology: "HTTPS"
  - source: "Azure API Management"
    destination: "Business Operations Dashboard SPA"
    description: "Routes traffic to dashboard frontend"
    technology: "HTTPS"
  - source: "Azure API Management"
    destination: "Claims Processing Core & Integration/Anti-Corruption Layer"
    description: "Routes API requests to microservices"
    technology: "HTTPS"
  - source: "Claims Processing Core & Integration/Anti-Corruption Layer"
    destination: "Azure Service Bus"
    description: "Communicates asynchronously using messages"
    technology: "AMQP / Azure Service Bus"
  - source: "Claims Processing Core & Integration/Anti-Corruption Layer"
    destination: "COBOL/DB2 Mainframe"
    description: "Connects securely to the on-premise system of record"
    technology: "Site-to-Site VPN / Azure ExpressRoute"
  - source: "Claims Processing Core & Integration/Anti-Corruption Layer"
    destination: "Azure SQL Database"
    description: "Reads and writes transactional state"
    technology: "JDBC / TLS"
  - source: "Claims Processing Core & Integration/Anti-Corruption Layer"
    destination: "Audit & Compliance Archive"
    description: "Archives audit and compliance logs"
    technology: "HTTPS"