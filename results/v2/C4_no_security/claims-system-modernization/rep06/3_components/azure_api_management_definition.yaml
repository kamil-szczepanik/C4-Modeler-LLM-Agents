level: component
scope: "Component diagram for the Azure API Management container"
parentContainer:
  name: "Azure API Management"
elements:
  - type: "component"
    name: "API Gateway Engine"
    technology: "Azure API Management Policy Engine"
    description: "Handles edge security, rate limiting, versioning, routing, and applies retry/circuit-breaker policies."
  - type: "component"
    name: "Authentication & Authorization Handler"
    technology: "OpenID Connect / OAuth2"
    description: "Validates tokens for SSO against Corporate Active Directory."
  - type: "component"
    name: "Diagnostic & Telemetry Publisher"
    technology: "HTTPS"
    description: "Streams diagnostic logs and telemetry to Azure Monitor and Application Insights."
relationships:
  - source: "API Gateway Engine"
    destination: "Authentication & Authorization Handler"
    description: "Validates tokens via OpenID Connect / OAuth2 [OIDC/OAuth2]"
  - source: "API Gateway Engine"
    destination: "Diagnostic & Telemetry Publisher"
    description: "Streams diagnostic logs and telemetry via HTTPS [HTTPS]"