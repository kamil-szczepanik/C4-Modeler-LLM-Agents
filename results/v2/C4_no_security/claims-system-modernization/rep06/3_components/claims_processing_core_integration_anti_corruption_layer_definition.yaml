level: component
scope: "Component diagram for the Claims Processing Core & Integration/Anti-Corruption Layer container"
parentContainer:
  name: "Claims Processing Core & Integration/Anti-Corruption Layer"
elements:
  - type: "component"
    name: "Claim Routing Component"
    technology: "Spring Cloud Gateway/Router"
    description: "Evaluates claim types against a dynamic configuration store for routing and 1-day rollbacks."
  - type: "component"
    name: "Legacy Mainframe Adapter"
    technology: "Spring Integration"
    description: "Translates JSON domain models into COBOL copybook structures via IBM MQ or CICS sockets."
  - type: "component"
    name: "New Domain Core"
    technology: "Spring Boot"
    description: "Domain service processing migrated claim types natively."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Spring Cloud Stream"
    description: "Service emitting domain events."
relationships:
  - source: "Claim Routing Component"
    destination: "Legacy Mainframe Adapter"
    description: "Routes unmigrated claims [In-process / Java Method Call]"
  - source: "Claim Routing Component"
    destination: "New Domain Core"
    description: "Routes migrated claims [In-process / Java Method Call]"
  - source: "New Domain Core"
    destination: "Event Publisher Component"
    description: "Triggers events [In-process / Spring Application Events]"