level: component
scope: "Component diagram for the Azure SQL Database container"
parentContainer:
  name: "Azure SQL Database"
elements:
  - type: "component"
    name: "Claims Transactional Store"
    technology: "Relational tables with Snapshot Isolation"
    description: "Serves as the core transactional persistence layer storing relational claim data."
  - type: "component"
    name: "Migration Routing & State Registry"
    technology: "Feature-flag tables"
    description: "Tracks claim-type ownership and enables gradual, risk-mitigated claim type migration from the legacy mainframe."
  - type: "component"
    name: "Transactional Outbox Table"
    technology: "Domain event buffer table"
    description: "Acts as a reliable domain event buffer for asynchronous messaging, replacing complex CDC."
relationships:
  - source: "Claims Processing Core & Integration/Anti-Corruption Layer"
    destination: "Claims Transactional Store"
    description: "Reads and writes transactional state [JDBC / TLS]"
  - source: "Claims Processing Core & Integration/Anti-Corruption Layer"
    destination: "Transactional Outbox Table"
    description: "Atomically writes domain events [JDBC / TLS]"
  - source: "Transactional Outbox Table"
    destination: "Azure Service Bus"
    description: "Relays synchronization and migration events [AMQP / TLS]"