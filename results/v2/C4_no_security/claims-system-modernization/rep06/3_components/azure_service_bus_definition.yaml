level: component
scope: "Component diagram for the Azure Service Bus container"
parentContainer:
  name: "Azure Service Bus"
elements:
  - type: "component"
    name: "Claims-Topic"
    technology: "Azure Service Bus Topic"
    description: "Publishes and distributes claim events across the processing core and integration layers."
  - type: "component"
    name: "Mainframe-Sync-Queue"
    technology: "Azure Service Bus Queue"
    description: "Relays batched sync payloads to the legacy mainframe via Azure Hybrid Connection."
  - type: "component"
    name: "Audit-Relay"
    technology: "Azure Service Bus Queue/Topic"
    description: "Captures and routes audit trails to the compliance archive."
  - type: "component"
    name: "DLQ-Replay-Processor"
    technology: "Azure Service Bus Dead-Letter Queue Processor"
    description: "Listens to the dead-letter queue and triggers message replays for failed claim transactions."
relationships:
  - source: "Claims Processing Core"
    destination: "Claims-Topic"
    description: "Publishes claim events [AMQP over TLS]"
  - source: "Mainframe-Sync-Queue"
    destination: "Legacy Mainframe"
    description: "Relays batched sync payloads [HTTPS / Azure Hybrid Connection]"
  - source: "DLQ-Replay-Processor"
    destination: "DLQ"
    description: "Listens and triggers replays [AMQP]"