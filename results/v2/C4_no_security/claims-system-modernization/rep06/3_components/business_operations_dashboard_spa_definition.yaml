level: component
scope: "Component diagram for the Business Operations Dashboard SPA container"
parentContainer:
  name: "Business Operations Dashboard SPA"
elements:
  - type: "component"
    name: "Dashboard Router & State Manager"
    technology: "React Router, TanStack Query"
    description: "Manages server state, routing, and polling intervals for real-time health checks."
  - type: "component"
    name: "Migration Metrics View & Switchback Alert Monitor"
    technology: "React Components"
    description: "Displays migration transaction volumes, progress, and alerts for rapid switchbacks."
  - type: "component"
    name: "Audit & Reconciliation Inspector"
    technology: "React Component"
    description: "Ensures data consistency between the legacy mainframe and Azure."
  - type: "component"
    name: "API Client Service"
    technology: "Axios, JWT-secured"
    description: "Fetches operational telemetry and reconciliation data from Azure API Management."
  - type: "component"
    name: "Telemetry Service"
    technology: "Azure Application Insights JS SDK"
    description: "Streams client-side errors and performance logs to Azure Application Insights."
relationships:
  - source: "API Client Service"
    destination: "Azure API Management"
    description: "Fetches operational telemetry and reconciliation data [HTTPS / REST, JWT-secured]"
  - source: "Telemetry Service"
    destination: "Azure Application Insights"
    description: "Streams client-side errors and performance logs [HTTPS]"