level: component
scope: "Component diagram for the Personalization Service container"
parentContainer:
  name: "Personalization Service"
elements:
  - type: "component"
    name: "Recommendation API Router"
    technology: "Python / FastAPI"
    description: "Routes synchronous queries and handles incoming recommendation requests."
  - type: "component"
    name: "Recommendation Engine"
    technology: "Python / NumPy / scikit-learn"
    description: "Triggers inference and powers collaborative filtering and recommendation heuristics."
  - type: "component"
    name: "Event Consumer Worker"
    technology: "Python / Celery"
    description: "Consumes clickstream events asynchronously."
  - type: "component"
    name: "Data Access Layer"
    technology: "Python / boto3"
    description: "Fetches user profiles, reads/writes vectors, and executes purges."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "Multi-region Global Tables"
    description: "NoSQL database utilized for fast profile lookups and global replication."
  - type: "component"
    name: "Amazon SQS"
    technology: "Event ingestion queue"
    description: "Messaging infrastructure ensuring resilient event delivery."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Region-local caching"
    description: "Caching layer minimizing cross-region latency and absorbing traffic spikes."
  - type: "component"
    name: "AWS CloudWatch / Datadog"
    technology: "Telemetry and alerts"
    description: "Emits telemetry and metrics for monitoring."
relationships:
  - source: "AWS API Gateway"
    destination: "Recommendation API Router"
    description: "Routes synchronous queries [Internal HTTPS / gRPC]"
  - source: "Recommendation API Router"
    destination: "Recommendation Engine"
    description: "Triggers inference [In-memory function call with 200ms timeout]"
  - source: "Recommendation Engine"
    destination: "Data Access Layer"
    description: "Fetches user profiles [Python / boto3]"
  - source: "Event Consumer Worker"
    destination: "Amazon SQS"
    description: "Consumes clickstream events [AWS SDK / Long-polling]"
  - source: "Data Access Layer"
    destination: "Amazon DynamoDB"
    description: "Reads/writes vectors and executes purges [HTTPS / AWS SDK]"
  - source: "Data Access Layer"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches user profiles locally [TCP / Redis Protocol]"
  - source: "Recommendation API Router"
    destination: "AWS CloudWatch / Datadog"
    description: "Emits telemetry and metrics [HTTPS]"
  - source: "Recommendation Engine"
    destination: "AWS CloudWatch / Datadog"
    description: "Emits telemetry and metrics [HTTPS]"
  - source: "Event Consumer Worker"
    destination: "AWS CloudWatch / Datadog"
    description: "Emits telemetry and metrics [HTTPS]"
  - source: "Data Access Layer"
    destination: "AWS CloudWatch / Datadog"
    description: "Emits telemetry and metrics [HTTPS]"