level: component
scope: "Component diagram for the Amazon EventBridge and Amazon SQS container"
parentContainer:
  name: "Amazon EventBridge and Amazon SQS"
elements:
  - type: "component"
    name: "Central Event Bus"
    technology: "Amazon EventBridge"
    description: "Routes asynchronous events across microservices and integrates with KMS for payload encryption."
  - type: "component"
    name: "Event Payload Sanitizer / Tokenizer"
    technology: "AWS Lambda / Custom Logic"
    description: "Enforces GDPR and CCPA compliance by sanitizing and tokenizing event payloads."
  - type: "component"
    name: "Order Processing Queue"
    technology: "Amazon SQS"
    description: "Delivers retryable fulfillment tasks using long polling."
  - type: "component"
    name: "Notification Queue"
    technology: "Amazon SQS"
    description: "Queues notification tasks for asynchronous processing."
  - type: "component"
    name: "SQS Dead-Letter Queues (DLQs)"
    technology: "Amazon SQS"
    description: "Captures failed messages for troubleshooting and fault tolerance."
relationships:
  - source: "Event Payload Sanitizer / Tokenizer"
    destination: "Central Event Bus"
    description: "Publishes sanitized events"
  - source: "Central Event Bus"
    destination: "Order Processing Queue"
    description: "Dispatches order events to queue"
  - source: "Central Event Bus"
    destination: "Notification Queue"
    description: "Dispatches notification events to queue"
  - source: "Order Processing Queue"
    destination: "SQS Dead-Letter Queues (DLQs)"
    description: "Fails over unprocessable messages"