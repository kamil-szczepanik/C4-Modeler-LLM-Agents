level: component
scope: "Component diagram for the Amazon DynamoDB container"
parentContainer:
  name: "Amazon DynamoDB"
elements:
  - type: "component"
    name: "Request Router / API Frontend"
    technology: "AWS SDK / TLS"
    description: "Handles incoming requests from personalization and review services."
  - type: "component"
    name: "Storage Nodes (Partition Engine)"
    technology: "DynamoDB On-Demand Capacity"
    description: "Provides low-latency NoSQL storage and handles data partitioning."
  - type: "component"
    name: "Replication Engine"
    technology: "Amazon DynamoDB Global Tables"
    description: "Supports multi-region active-active replication across us-east-1, eu-west-1, and ap-southeast-1."
  - type: "component"
    name: "TTL Background Evaluator"
    technology: "DynamoDB Time-to-Live (TTL)"
    description: "Automatically expires temporary data to support GDPR and CCPA compliance."
  - type: "component"
    name: "Streams Processor"
    technology: "DynamoDB Streams"
    description: "Captures real-time item modifications for asynchronous event-driven architecture integration."
  - type: "system"
    name: "Amazon EventBridge"
    technology: "AWS Service-to-Service Integration"
    description: "Receives item-level modification events."
  - type: "container"
    name: "Personalization Service"
    technology: "AWS SDK"
    description: "Reads/writes user preference and recommendation data."
  - type: "container"
    name: "Customer Review Service"
    technology: "AWS SDK"
    description: "Reads/writes review data."
relationships:
  - source: "Personalization Service"
    destination: "Request Router / API Frontend"
    description: "Reads/writes user preference and recommendation data via AWS SDK over TLS"
  - source: "Customer Review Service"
    destination: "Request Router / API Frontend"
    description: "Reads/writes review data via AWS SDK over TLS"
  - source: "Streams Processor"
    destination: "Amazon EventBridge"
    description: "Publishes item-level modification events using native AWS service-to-service integration over TLS"