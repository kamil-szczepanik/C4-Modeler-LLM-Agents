level: component
scope: "Component diagram for the Catalog & Search Service container"
parentContainer:
  name: "Catalog & Search Service"
elements:
  - type: "component"
    name: "Catalog Controller"
    technology: "Java / Spring Boot REST/gRPC"
    description: "Exposes REST/gRPC endpoints and handles multi-currency formatting (USD, EUR, GBP)."
  - type: "component"
    name: "Search Engine Client"
    technology: "AWS SDK / Java"
    description: "Integrates with Amazon OpenSearch for keyword search and faceted queries."
  - type: "component"
    name: "Inventory Manager"
    technology: "Java / Spring Boot"
    description: "Manages stock levels, pricing mutations, and includes an Audit Interceptor."
  - type: "component"
    name: "Cache Facade"
    technology: "Redis Protocol / Java"
    description: "Manages hot-key caching with Redis, utilizing distributed locks and request collapsing."
  - type: "component"
    name: "Catalog Event Listener"
    technology: "AWS SDK / Java"
    description: "Consumes events from Amazon SQS/EventBridge for cache invalidation."
  - type: "component"
    name: "Faceted Navigation Component"
    technology: "Java"
    description: "Delegates filtering and currency formatting via in-memory Java method calls."
  - type: "component"
    name: "AWS API Gateway"
    technology: "AWS Gateway"
    description: "Routes catalog and search requests via internal HTTPS/gRPC."
  - type: "component"
    name: "Amazon OpenSearch"
    technology: "Amazon OpenSearch"
    description: "Search and indexing engine deployed in multi-AZ clusters."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Primary relational database for catalog and inventory persistence."
  - type: "component"
    name: "Redis (ElastiCache)"
    technology: "Redis"
    description: "In-memory cache for high-throughput read performance."
  - type: "component"
    name: "Amazon EventBridge"
    technology: "Amazon EventBridge"
    description: "Messaging infrastructure for asynchronous event-driven synchronization."
relationships:
  - source: "AWS API Gateway"
    destination: "Catalog Controller"
    description: "Routes catalog and search requests via internal HTTPS/gRPC."
  - source: "Catalog Controller"
    destination: "Faceted Navigation Component"
    description: "Delegates filtering and currency formatting via in-memory Java method calls."
  - source: "Search Engine Client"
    destination: "Amazon OpenSearch"
    description: "Queries search data using the AWS SDK."
  - source: "Inventory Manager"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists inventory changes via JDBC."
  - source: "Cache Facade"
    destination: "Redis (ElastiCache)"
    description: "Manages hot-key caching via the Redis Protocol."
  - source: "Inventory Manager"
    destination: "Amazon EventBridge"
    description: "Publishes stock and pricing mutation events asynchronously."