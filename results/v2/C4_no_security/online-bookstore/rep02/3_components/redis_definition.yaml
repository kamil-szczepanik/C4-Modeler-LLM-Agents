level: component
scope: "Component diagram for the Redis container"
parentContainer:
  name: "Redis"
elements:
  - type: "component"
    name: "Catalog Cache Component"
    technology: "Redis Strings/Hashes"
    description: "Caches catalog data for the Catalog & Search Service."
  - type: "component"
    name: "Session & Cart Store Component"
    technology: "Redis Hashes/Sets"
    description: "Read/Write active carts for the Order & Checkout Service."
  - type: "component"
    name: "Rate Limiter Component"
    technology: "Redis Atomic Counters"
    description: "Check and increment request counters for the API Gateway."
  - type: "component"
    name: "Real-Time Recommendation Cache Component"
    technology: "Redis Sorted Sets/Hashes"
    description: "Read trending pairs for the Personalization Service."
relationships:
  - source: "Catalog & Search Service"
    destination: "Catalog Cache Component"
    description: "Caches catalog data [Redis Protocol / TCP]"
  - source: "Order & Checkout Service"
    destination: "Session & Cart Store Component"
    description: "Read/Write active carts [Redis Protocol / TCP, port 6379]"
  - source: "API Gateway"
    destination: "Rate Limiter Component"
    description: "Check and increment request counters [Redis Protocol / TCP, port 6379]"
  - source: "Personalization Service"
    destination: "Real-Time Recommendation Cache Component"
    description: "Read trending pairs [Redis Protocol / TCP, port 6379]"