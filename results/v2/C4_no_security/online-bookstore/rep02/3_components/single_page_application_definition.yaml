level: component
scope: "Component diagram for the Single Page Application container"
parentContainer:
  name: "Single Page Application"
elements:
  - type: "component"
    name: "Routing & Shell Component"
    technology: "React / TypeScript"
    description: "Manages application navigation, layout structure, and overall shell."
  - type: "component"
    name: "Consent & Localization Provider"
    technology: "React / TypeScript"
    description: "Handles multi-currency, localization, and strict GDPR/CCPA consent compliance."
  - type: "component"
    name: "Catalog & Search Component"
    technology: "React / TypeScript"
    description: "Provides lightning-fast book browsing, search, and filtering."
  - type: "component"
    name: "Checkout & Cart Component"
    technology: "React / TypeScript"
    description: "Manages secure checkout and shopping cart workflows."
  - type: "component"
    name: "Reviews & Recommendations Component"
    technology: "React / TypeScript"
    description: "Displays customer reviews and personalized book recommendations."
  - type: "component"
    name: "Admin & Author Dashboard Component"
    technology: "React / TypeScript"
    description: "Provides dashboard interfaces for store administrators, authors, and publishers."
  - type: "component"
    name: "State & Telemetry Component"
    technology: "Zustand & React Query, Datadog RUM SDK"
    description: "Manages efficient global state, server-state caching, and telemetry/RUM metrics."
relationships:
  - source: "Routing & Shell Component"
    destination: "Catalog & Search Component"
    description: "Renders and navigates to"
  - source: "Routing & Shell Component"
    destination: "Checkout & Cart Component"
    description: "Renders and navigates to"
  - source: "Routing & Shell Component"
    destination: "Reviews & Recommendations Component"
    description: "Renders and navigates to"
  - source: "Routing & Shell Component"
    destination: "Admin & Author Dashboard Component"
    description: "Renders and navigates to"
  - source: "Catalog & Search Component"
    destination: "State & Telemetry Component"
    description: "Uses for state caching and data fetching"
  - source: "Checkout & Cart Component"
    destination: "State & Telemetry Component"
    description: "Uses for state management"
  - source: "Reviews & Recommendations Component"
    destination: "State & Telemetry Component"
    description: "Uses for state management"
  - source: "Admin & Author Dashboard Component"
    destination: "State & Telemetry Component"
    description: "Uses for state management"