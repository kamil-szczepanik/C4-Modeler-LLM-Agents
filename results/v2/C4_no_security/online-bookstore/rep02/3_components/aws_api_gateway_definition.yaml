level: component
scope: "Component diagram for the AWS API Gateway container"
parentContainer:
  name: "AWS API Gateway"
elements:
  - type: "component"
    name: "REST API Router"
    technology: "AWS API Gateway REST Endpoint"
    description: "Routes incoming REST requests from the Single Page Application to appropriate backend microservices."
  - type: "component"
    name: "GraphQL API Router"
    technology: "AWS API Gateway GraphQL Endpoint"
    description: "Handles GraphQL queries and mutations from the client for flexible data fetching."
  - type: "component"
    name: "Authentication Validator"
    technology: "AWS API Gateway Lambda Authorizer / JWT"
    description: "Validates JWT tokens for authentication in conjunction with AWS Cognito/Auth0."
  - type: "component"
    name: "Regional Caching and Throttling Module"
    technology: "AWS API Gateway Native Caching & Throttling"
    description: "Manages regional response caching and request throttling to ensure high availability and performance."
relationships:
  - source: "REST API Router"
    destination: "Catalog & Search Service"
    description: "Routes search requests via internal gRPC"
  - source: "REST API Router"
    destination: "Order & Checkout Service"
    description: "Routes secure checkout payloads via internal gRPC"
  - source: "GraphQL API Router"
    destination: "Catalog & Search Service"
    description: "Forwards catalog queries via internal gRPC"
  - source: "REST API Router"
    destination: "Authentication Validator"
    description: "Delegates token validation"
  - source: "Authentication Validator"
    destination: "AWS Cognito/Auth0"
    description: "Validates JWT tokens"