level: component
scope: "Component diagram for the Customer Review Service container"
parentContainer:
  name: "Customer Review Service"
elements:
  - type: "component"
    name: "Review Controller"
    technology: "Node.js / Express Router"
    description: "Manages customer reviews, 5-star ratings, and content moderation REST/HTTPS endpoints."
  - type: "component"
    name: "Review Validation & Sanitization Engine"
    technology: "Joi / DOMPurify"
    description: "Sanitizes and validates review inputs for OWASP Top-10 XSS mitigations."
  - type: "component"
    name: "Moderation & Compliance Manager"
    technology: "Node.js"
    description: "Handles content moderation and ensures GDPR/CCPA compliance."
  - type: "component"
    name: "Review Data Access Layer"
    technology: "AWS SDK"
    description: "Interfaces with Amazon DynamoDB to read and write review records."
  - type: "component"
    name: "Event Publisher"
    technology: "AWS SDK"
    description: "Emits review-related events to Amazon EventBridge."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "NoSQL Database"
    description: "Provides single-digit millisecond latency storage for review records."
  - type: "component"
    name: "Amazon EventBridge with SQS Dead Letter Queues"
    technology: "AWS EventBridge / SQS"
    description: "Handles asynchronous event deliveries and failed message processing."
  - type: "component"
    name: "AWS ECS Fargate & Application Load Balancer"
    technology: "AWS ECS Fargate / ALB"
    description: "Hosts and scales the containerized service instances."
  - type: "component"
    name: "Redis"
    technology: "AWS ElastiCache"
    description: "Distributed cache used for API rate limiting against bot spam."
relationships:
  - source: "AWS API Gateway"
    destination: "Review Controller"
    description: "Routes review REST/HTTPS requests [HTTPS / JSON]"
  - source: "Review Controller"
    destination: "Review Validation & Sanitization Engine"
    description: "Invokes internal validation workflows [In-memory]"
  - source: "Review Controller"
    destination: "Moderation & Compliance Manager"
    description: "Invokes internal moderation workflows [In-memory]"
  - source: "Moderation & Compliance Manager"
    destination: "Review Data Access Layer"
    description: "Reads and writes review records [AWS SDK]"
  - source: "Review Controller"
    destination: "Review Data Access Layer"
    description: "Reads and writes review records [AWS SDK]"
  - source: "Review Data Access Layer"
    destination: "Amazon DynamoDB"
    description: "Persists review data [AWS SDK]"
  - source: "Event Publisher"
    destination: "Amazon EventBridge with SQS Dead Letter Queues"
    description: "Emits ReviewSubmitted, ReviewDeleted, and UserAnonymized events [AWS SDK]"
  - source: "Amazon EventBridge with SQS Dead Letter Queues"
    destination: "Amazon EventBridge with SQS Dead Letter Queues"
    description: "Handles failed asynchronous event deliveries [AWS SQS]"