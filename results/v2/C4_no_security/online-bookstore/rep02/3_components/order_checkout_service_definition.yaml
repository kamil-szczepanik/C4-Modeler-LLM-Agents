level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Order Controller"
    technology: "Spring MVC RestController"
    description: "Handles incoming HTTP/gRPC requests for cart management, checkout orchestration, and multi-currency conversion."
  - type: "component"
    name: "Order Service"
    technology: "Spring Service Bean"
    description: "Contains business logic for order processing, cart management, and coordinating payments and events."
  - type: "component"
    name: "Payment Gateway Client"
    technology: "Spring Component / Resilience4j"
    description: "Communicates with external payment processors (Stripe/PayPal) and implements circuit breakers for fault tolerance."
  - type: "component"
    name: "Persistence Adapter"
    technology: "Spring Data JPA / JDBC / AWS SDK"
    description: "Persists transactional order and cart data to Amazon Aurora PostgreSQL using HikariCP/RDS Proxy."
  - type: "component"
    name: "Cache & Idempotency Manager"
    technology: "Redis Client"
    description: "Validates idempotency keys and caches exchange rates using Redis (ElastiCache)."
  - type: "component"
    name: "Event Publisher"
    technology: "AWS SDK"
    description: "Publishes order status events asynchronously to Amazon EventBridge and Amazon SQS."
relationships:
  - source: "Order Controller"
    destination: "Order Service"
    description: "Delegates request processing"
  - source: "Order Service"
    destination: "Payment Gateway Client"
    description: "Processes payments and risk assessments [HTTPS / REST]"
  - source: "Order Service"
    destination: "Persistence Adapter"
    description: "Persists transactional order and cart data [JDBC / AWS SDK]"
  - source: "Order Service"
    destination: "Cache & Idempotency Manager"
    description: "Validates idempotency keys and caches exchange rates [TCP / Redis Protocol]"
  - source: "Order Service"
    destination: "Event Publisher"
    description: "Publishes order status events [AWS SDK]"