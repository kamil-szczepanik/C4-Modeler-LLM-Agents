level: component
scope: "Component diagram for the Notification Service container"
parentContainer:
  name: "Notification Service"
elements:
  - type: "component"
    name: "Event Consumer Component"
    technology: "Node.js / Express"
    description: "Subscribes to message queues for asynchronous domain event ingestion."
  - type: "component"
    name: "Template & Localization Engine"
    technology: "Node.js / Express"
    description: "Renders dynamic templates supporting multi-currency (USD, EUR, GBP) and localized user preferences."
  - type: "component"
    name: "Dispatch Adapter Component"
    technology: "Node.js / Express"
    description: "Interfaces with external delivery systems."
  - type: "component"
    name: "Preference Manager Component"
    technology: "Node.js / Express"
    description: "Enforces GDPR/CCPA compliance via user consent checks."
  - type: "component"
    name: "Feedback & Bounce Handler Component"
    technology: "Node.js / Express"
    description: "Ingests delivery failures and bounce metrics."
  - type: "container"
    name: "AWS API Gateway"
    technology: "AWS API Gateway"
    description: "Routes internal notification requests."
  - type: "container"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Message queue for async domain events."
  - type: "container"
    name: "Redis (ElastiCache)"
    technology: "Redis"
    description: "Fast in-memory caching to enforce message processing idempotency."
  - type: "container"
    name: "AWS SES"
    technology: "AWS SES"
    description: "Delivers cost-effective, highly scalable email notifications."
  - type: "container"
    name: "FedEx/UPS APIs"
    technology: "HTTPS"
    description: "Coordinates physical book shipping and tracking."
  - type: "container"
    name: "AWS CloudWatch / Datadog"
    technology: "HTTPS"
    description: "Receives telemetry, logs, and distributed traces."
relationships:
  - source: "AWS API Gateway"
    destination: "Notification Service"
    description: "Routes internal notification requests [Internal HTTPS / gRPC]"
  - source: "Event Consumer Component"
    destination: "Amazon SQS"
    description: "Consumes async domain events [AWS SDK]"
  - source: "Event Consumer Component"
    destination: "Redis (ElastiCache)"
    description: "Checks and stores message idempotency keys [Redis Protocol]"
  - source: "Dispatch Adapter Component"
    destination: "AWS SES"
    description: "Sends emails and system notifications [AWS SDK]"
  - source: "Dispatch Adapter Component"
    destination: "FedEx/UPS APIs"
    description: "Coordinates physical book shipping and tracking [HTTPS / Circuit Breaker]"
  - source: "AWS SES"
    destination: "Feedback & Bounce Handler Component"
    description: "Receives delivery failure and complaint webhooks [HTTPS]"
  - source: "Notification Service"
    destination: "AWS CloudWatch / Datadog"
    description: "Sends telemetry, logs, and distributed traces [HTTPS]"