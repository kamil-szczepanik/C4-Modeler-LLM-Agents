level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL container"
parentContainer:
  name: "Amazon Aurora PostgreSQL"
elements:
  - type: "component"
    name: "Primary DB Instance"
    technology: "Amazon Aurora PostgreSQL"
    description: "Handles write operations for orders and catalog updates, ensuring strict ACID compliance."
  - type: "component"
    name: "Aurora Replicas (Read-Scale)"
    technology: "Amazon Aurora PostgreSQL (Read-Only Nodes)"
    description: "1-15 read-only nodes distributed across availability zones for read-scaling."
  - type: "component"
    name: "Amazon RDS Proxy"
    technology: "AWS RDS Proxy"
    description: "Connection pooler intercepting requests from microservices to prevent connection exhaustion."
  - type: "component"
    name: "Aurora Global Database Cluster"
    technology: "AWS Aurora Global Database"
    description: "Asynchronous cross-region replication layer across us-east-1, eu-west-1, and ap-southeast-1 for low-latency reads and disaster recovery."
  - type: "component"
    name: "AWS Secrets Manager"
    technology: "AWS Secrets Manager"
    description: "Manages and rotates database credentials to meet OWASP NFRs."
  - type: "component"
    name: "AWS Backup"
    technology: "AWS Backup"
    description: "Automated backup and retention policy manager configured for 35-day retention supporting GDPR/CCPA compliance."
relationships:
  - source: "Order & Checkout Service"
    destination: "Amazon RDS Proxy"
    description: "Connects to proxy endpoint via [JDBC / TCP]"
  - source: "Catalog & Search Service"
    destination: "Amazon RDS Proxy"
    description: "Connects to proxy endpoint via [JDBC / TCP]"
  - source: "Amazon RDS Proxy"
    destination: "Primary DB Instance"
    description: "Routes write queries using [PostgreSQL Wire Protocol]"
  - source: "Amazon RDS Proxy"
    destination: "Aurora Replicas (Read-Scale)"
    description: "Routes read queries using [PostgreSQL Wire Protocol]"
  - source: "Primary DB Instance"
    destination: "Aurora Global Database Cluster"
    description: "Performs cross-region storage replication via [AWS Aurora Storage Protocol]"