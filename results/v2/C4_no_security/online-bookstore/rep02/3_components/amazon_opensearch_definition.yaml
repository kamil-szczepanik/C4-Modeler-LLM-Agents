level: component
scope: "Component diagram for the Amazon OpenSearch container"
parentContainer:
  name: "Amazon OpenSearch"
elements:
  - type: "component"
    name: "Search Engine Core"
    technology: "Apache Lucene"
    description: "Inverted-index storage powering the search engine core for keyword and faceted search queries."
  - type: "component"
    name: "Ingest Pipeline"
    technology: "OpenSearch Ingest Node"
    description: "Ingests and processes data to index and update book catalog documents."
  - type: "component"
    name: "Cluster Manager"
    technology: "OpenSearch Master Node"
    description: "Manages cluster state and coordination."
  - type: "component"
    name: "OpenSearch Dashboards"
    technology: "Web UI"
    description: "Visualization UI for store analytics and index management."
relationships:
  - source: "Catalog & Search Service"
    destination: "Ingest Pipeline"
    description: "Index/Update book catalog documents [HTTPS / JSON]"
  - source: "Catalog & Search Service"
    destination: "Search Engine Core"
    description: "Execute keyword and faceted search queries [HTTPS / JSON]"
  - source: "Store Administrator"
    destination: "OpenSearch Dashboards"
    description: "View search analytics and manage index patterns [HTTPS / TLS]"
  - source: "OpenSearch Dashboards"
    destination: "Search Engine Core"
    description: "Query internal indices for telemetry [REST / JSON over HTTPS]"
  - source: "Amazon OpenSearch"
    destination: "Amazon S3"
    description: "Automated daily snapshots and cross-region backups [AWS SDK]"