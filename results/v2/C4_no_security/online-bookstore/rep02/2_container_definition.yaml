level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Book Shopper"
    description: "End user browsing the catalog, managing a cart, purchasing books, leaving reviews, and receiving personalized recommendations."
  - type: "person"
    name: "Book Author/Publisher"
    description: "User managing book listings, inventory, and publishing content to the platform."
  - type: "person"
    name: "Store Administrator"
    description: "User managing platform operations, user accounts, system configuration, and monitoring overall system health."
  - type: "externalSystem"
    name: "Stripe/PayPal"
    description: "Payment Gateway handling secure financial transactions and checkouts."
  - type: "externalSystem"
    name: "FedEx/UPS APIs"
    description: "Shipping Carrier APIs handling physical book delivery and tracking."
  - type: "externalSystem"
    name: "AWS SES"
    description: "Email Service handling transactional and marketing notifications."
  - type: "externalSystem"
    name: "AWS Cognito/Auth0"
    description: "Identity Provider managing authentication, authorization, and user identity via OAuth2/OIDC."
  - type: "externalSystem"
    name: "AWS CloudFront/Route 53"
    description: "CDN and Traffic Manager handling global edge routing, sub-2s page loads, and TLS termination."
  - type: "externalSystem"
    name: "AWS CloudWatch/Datadog"
    description: "Telemetry and observability platform providing centralized logging and distributed tracing."
  - type: "container"
    name: "Single Page Application"
    technology: "React / TypeScript, hosted on AWS S3"
    description: "Client application delivering the user interface for shoppers, authors, and administrators."
  - type: "container"
    name: "AWS API Gateway"
    technology: "AWS API Gateway (REST / GraphQL)"
    description: "API layer routing incoming client requests to backend services."
  - type: "container"
    name: "Catalog & Search Service"
    technology: "Spring Boot (Java) / Python (FastAPI)"
    description: "Manages book catalog listings, inventory, and search functionality."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Spring Boot (Java)"
    description: "Handles shopping cart management, order processing, and checkout workflows."
  - type: "container"
    name: "Personalization Service"
    technology: "Python (FastAPI/Celery)"
    description: "Provides integrated book recommendations for users."
  - type: "container"
    name: "Customer Review Service"
    technology: "Node.js / Express"
    description: "Manages customer reviews and ratings for books."
  - type: "container"
    name: "Notification Service"
    technology: "Node.js / Express"
    description: "Handles sending emails and handling shipping coordination."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Relational database storing structured transactional data."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "NoSQL data store for low-latency operational data."
  - type: "container"
    name: "Amazon OpenSearch"
    technology: "Amazon OpenSearch"
    description: "Search and analytics engine powering catalog search."
  - type: "container"
    name: "Redis"
    technology: "Redis (ElastiCache)"
    description: "In-memory data store and cache."
  - type: "container"
    name: "Amazon EventBridge and Amazon SQS"
    technology: "Amazon EventBridge / Amazon SQS"
    description: "Inter-service messaging and event bus for asynchronous decoupling."
relationships:
  - source: "Book Shopper"
    destination: "AWS CloudFront/Route 53"
    description: "Browses catalog, places orders, and interacts with the platform"
    technology: "HTTPS via TLS 1.3"
  - source: "Book Author/Publisher"
    destination: "AWS CloudFront/Route 53"
    description: "Manages catalog listings and published content"
    technology: "HTTPS via TLS 1.3"
  - source: "Store Administrator"
    destination: "AWS CloudFront/Route 53"
    description: "Administers platform operations and monitors system health"
    technology: "HTTPS via TLS 1.3"
  - source: "AWS CloudFront/Route 53"
    destination: "Single Page Application"
    description: "Delivers static assets and frontend application"
    technology: "HTTPS"
  - source: "Single Page Application"
    destination: "AWS API Gateway"
    description: "Sends API requests for data and actions"
    technology: "HTTPS / REST / GraphQL"
  - source: "AWS API Gateway"
    destination: "Catalog & Search Service"
    description: "Routes catalog and search requests"
    technology: "Internal HTTPS / gRPC"
  - source: "AWS API Gateway"
    destination: "Order & Checkout Service"
    description: "Routes order and checkout requests"
    technology: "Internal HTTPS / gRPC"
  - source: "AWS API Gateway"
    destination: "Personalization Service"
    description: "Routes recommendation requests"
    technology: "Internal HTTPS / gRPC"
  - source: "AWS API Gateway"
    destination: "Customer Review Service"
    description: "Routes review-related requests"
    technology: "Internal HTTPS / gRPC"
  - source: "AWS API Gateway"
    destination: "Notification Service"
    description: "Routes notification requests"
    technology: "Internal HTTPS / gRPC"
  - source: "Catalog & Search Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes catalog data"
    technology: "JDBC / AWS SDK"
  - source: "Catalog & Search Service"
    destination: "Amazon OpenSearch"
    description: "Indexes and queries search data"
    technology: "AWS SDK"
  - source: "Order & Checkout Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes order data"
    technology: "JDBC / AWS SDK"
  - source: "Personalization Service"
    destination: "Amazon DynamoDB"
    description: "Reads and writes user preference and recommendation data"
    technology: "AWS SDK"
  - source: "Customer Review Service"
    destination: "Amazon DynamoDB"
    description: "Reads and writes review data"
    technology: "AWS SDK"
  - source: "Catalog & Search Service"
    destination: "Redis"
    description: "Caches catalog data"
    technology: "Redis Protocol / AWS SDK"
  - source: "Order & Checkout Service"
    destination: "Stripe/PayPal"
    description: "Processes payments and checkouts"
    technology: "HTTPS"
  - source: "Notification Service"
    destination: "AWS SES"
    description: "Sends emails and system notifications"
    technology: "AWS SDK"
  - source: "Notification Service"
    destination: "FedEx/UPS APIs"
    description: "Coordinates physical book shipping and tracking"
    technology: "AWS SDK / HTTPS"
  - source: "Order & Checkout Service"
    destination: "Amazon EventBridge and Amazon SQS"
    description: "Publishes and consumes order events"
    technology: "AWS SDK"
  - source: "Notification Service"
    destination: "Amazon EventBridge and Amazon SQS"
    description: "Consumes async messaging for notifications"
    technology: "AWS SDK"
  - source: "Single Page Application"
    destination: "AWS Cognito/Auth0"
    description: "Authenticates users and validates sessions"
    technology: "OAuth2/OIDC over HTTPS"
  - source: "Single Page Application"
    destination: "AWS CloudWatch/Datadog"
    description: "Sends telemetry and logs"
    technology: "HTTPS"
  - source: "Catalog & Search Service"
    destination: "AWS CloudWatch/Datadog"
    description: "Sends telemetry and logs"
    technology: "HTTPS"
  - source: "Order & Checkout Service"
    destination: "AWS CloudWatch/Datadog"
    description: "Sends telemetry and logs"
    technology: "HTTPS"
  - source: "Personalization Service"
    destination: "AWS CloudWatch/Datadog"
    description: "Sends telemetry and logs"
    technology: "HTTPS"
  - source: "Customer Review Service"
    destination: "AWS CloudWatch/Datadog"
    description: "Sends telemetry and logs"
    technology: "HTTPS"
  - source: "Notification Service"
    destination: "AWS CloudWatch/Datadog"
    description: "Sends telemetry and logs"
    technology: "HTTPS"