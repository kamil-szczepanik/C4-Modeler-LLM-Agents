level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Casual Shoppers"
    description: "Users who browse books, search the catalog, and view recommendations."
  - type: "person"
    name: "Buyers"
    description: "Customers who manage carts, complete multi-currency checkouts, and purchase books."
  - type: "person"
    name: "Contributors/Reviewers"
    description: "Users who write reviews and rate books on the platform."
  - type: "externalSystem"
    name: "Stripe/PayPal"
    description: "Payment Gateway Provider handling payment processing."
  - type: "externalSystem"
    name: "FedEx/UPS"
    description: "Third-Party Shipping APIs for fulfillment and tracking."
  - type: "externalSystem"
    name: "Avalara/TaxJar"
    description: "Tax Calculation Service for real-time tax estimation."
  - type: "externalSystem"
    name: "AWS SES/SendGrid"
    description: "Email and Notification Service for transactional alerts."
  - type: "container"
    name: "Client Frontend"
    technology: "React, AWS CloudFront, Amazon S3"
    description: "Single Page Application hosted on AWS CloudFront/S3 providing the user interface."
  - type: "container"
    name: "Edge & Ingress"
    technology: "Amazon Route 53, Amazon API Gateway"
    description: "Handles latency-based DNS routing, rate-limiting, and JWT validation."
  - type: "container"
    name: "Catalog & Search Container"
    technology: "Spring Boot, Go, Amazon OpenSearch"
    description: "Handles rapid catalog browsing and personalized recommendations."
  - type: "container"
    name: "Order & Checkout Container"
    technology: "Node.js, Java, Amazon Aurora PostgreSQL, Amazon DynamoDB"
    description: "Manages orders, cart sessions, and multi-currency checkout."
  - type: "container"
    name: "Review & Rating Container"
    technology: "Python, Django, Amazon Aurora PostgreSQL"
    description: "Manages user reviews and book ratings."
relationships:
  - source: "Casual Shoppers"
    destination: "Client Frontend"
    description: "Browses catalog and views recommendations"
    technology: "HTTPS"
  - source: "Buyers"
    destination: "Client Frontend"
    description: "Manages cart and completes checkout"
    technology: "HTTPS"
  - source: "Contributors/Reviewers"
    destination: "Client Frontend"
    description: "Writes reviews and rates books"
    technology: "HTTPS"
  - source: "Client Frontend"
    destination: "Edge & Ingress"
    description: "Sends client requests via DNS and API Gateway"
    technology: "HTTPS over TLS"
  - source: "Edge & Ingress"
    destination: "Catalog & Search Container"
    description: "Forwards catalog and search requests"
    technology: "gRPC over TLS"
  - source: "Edge & Ingress"
    destination: "Order & Checkout Container"
    description: "Forwards order and checkout requests"
    technology: "gRPC over TLS"
  - source: "Edge & Ingress"
    destination: "Review & Rating Container"
    description: "Forwards review and rating requests"
    technology: "gRPC over TLS"
  - source: "Order & Checkout Container"
    destination: "Stripe/PayPal"
    description: "Processes payments"
    technology: "Synchronous HTTPS via App Mesh / Envoy"
  - source: "Order & Checkout Container"
    destination: "FedEx/UPS"
    description: "Handles shipping and fulfillment"
    technology: "Synchronous HTTPS via App Mesh / Envoy"
  - source: "Order & Checkout Container"
    destination: "Avalara/TaxJar"
    description: "Calculates real-time taxes"
    technology: "Synchronous HTTPS via App Mesh / Envoy"
  - source: "Order & Checkout Container"
    destination: "AWS SES/SendGrid"
    description: "Sends transactional emails"
    technology: "HTTPS"