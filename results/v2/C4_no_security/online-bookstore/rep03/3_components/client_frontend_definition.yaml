level: component
scope: "Component diagram for the Client Frontend container"
parentContainer:
  name: "Client Frontend"
elements:
  - type: "component"
    name: "Routing & Shell Component"
    technology: "React Router"
    description: "Handles application routing and initializes core services."
  - type: "component"
    name: "Catalog & Recommendation UI"
    technology: "React, Tailwind CSS"
    description: "Displays product catalogs and personalized recommendations."
  - type: "component"
    name: "Cart & Checkout UI"
    technology: "React"
    description: "Manages shopping cart operations and secure checkout processes."
  - type: "component"
    name: "Review & Rating UI"
    technology: "React"
    description: "Allows users to submit and view product reviews and ratings."
  - type: "component"
    name: "Compliance & Localization Service"
    technology: "Client-side module"
    description: "Ensures GDPR/CCPA compliance and handles multi-currency browsing."
  - type: "component"
    name: "State & Storage Manager"
    technology: "Zustand, LocalStorage Adapter"
    description: "Manages persistent local state for carts and currency preferences."
relationships:
  - source: "Routing & Shell Component"
    destination: "Compliance & Localization Service"
    description: "Initializes services [In-memory]"
  - source: "Routing & Shell Component"
    destination: "State & Storage Manager"
    description: "Initializes services [In-memory]"
  - source: "Cart & Checkout UI"
    destination: "State & Storage Manager"
    description: "Reads and writes local cart and currency state [In-memory / LocalStorage]"