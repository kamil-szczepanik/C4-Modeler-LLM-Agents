level: component
scope: "Component diagram for the Order & Checkout Container container"
parentContainer:
  name: "Order & Checkout Container"
elements:
  - type: "component"
    name: "Cart Management Component"
    technology: "Node.js / Express"
    description: "Manages low-latency shopping sessions and ephemeral cart state."
  - type: "component"
    name: "Checkout Orchestrator Component"
    technology: "Java / Spring Boot"
    description: "Coordinates complex, multi-step transactional checkout workflows and guarantees idempotency."
  - type: "component"
    name: "Payment & Fulfillment Gateway Client"
    technology: "Java"
    description: "Invokes external payment and tax integrations securely."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Java / Spring Cloud Stream"
    description: "Dispatches domain events asynchronously."
  - type: "component"
    name: "Audit & Support Query Component"
    technology: "Node.js"
    description: "Queries order audit trails for support and administrative purposes."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Persists ephemeral shopping cart sessions with low latency."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Stores transactional records and audit logs with automated failover."
  - type: "component"
    name: "Amazon SQS / SNS"
    technology: "Amazon SQS / SNS with DLQs"
    description: "Decouples fulfillment and transactional email tasks asynchronously."
relationships:
  - source: "Edge & Ingress"
    destination: "Cart Management Component"
    description: "Forwards client requests [gRPC over TLS]"
  - source: "Edge & Ingress"
    destination: "Checkout Orchestrator Component"
    description: "Forwards client requests [gRPC over TLS]"
  - source: "Edge & Ingress"
    destination: "Audit & Support Query Component"
    description: "Queries order audit trails [gRPC over TLS]"
  - source: "Checkout Orchestrator Component"
    destination: "Payment & Fulfillment Gateway Client"
    description: "Invokes payment and tax integrations [Internal REST/gRPC]"
  - source: "Checkout Orchestrator Component"
    destination: "Event Publisher Component"
    description: "Dispatches domain events [Spring Application Events]"
  - source: "Event Publisher Component"
    destination: "Amazon SQS / SNS"
    description: "Publishes order events [AWS SDK / HTTPS]"