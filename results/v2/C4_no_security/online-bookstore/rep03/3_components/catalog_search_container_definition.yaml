level: component
scope: "Component diagram for the Catalog & Search Container container"
parentContainer:
  name: "Catalog & Search Container"
elements:
  - type: "component"
    name: "API Gateway / Router Component"
    technology: "Go"
    description: "Forwards search requests and routes internal queries."
  - type: "component"
    name: "Search & Query Component"
    technology: "Spring Boot"
    description: "Implements robust search query handling."
  - type: "component"
    name: "Indexing & Synchronization Component"
    technology: "Spring Boot"
    description: "Implements indexing logic and consumes CDC events and clickstream payloads."
  - type: "component"
    name: "Recommendation Component"
    technology: "Go"
    description: "Powers recommendation processing for low latency."
  - type: "component"
    name: "Amazon OpenSearch"
    technology: "Amazon OpenSearch"
    description: "Stores searchable catalog data and powers ML/KNN recommendations."
  - type: "component"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Buffers clickstream data to prevent ingestion saturation."
relationships:
  - source: "API Gateway / Router Component"
    destination: "Search & Query Component"
    description: "Routes internal queries [gRPC]"
  - source: "Indexing & Synchronization Component"
    destination: "Amazon SQS"
    description: "Consumes CDC events and clickstream payloads [SQS Polling]"
  - source: "Search & Query Component"
    destination: "Amazon OpenSearch"
    description: "Executes queries and retrieves indices [HTTPS / REST client]"
  - source: "Recommendation Component"
    destination: "Amazon OpenSearch"
    description: "Executes queries and retrieves indices [HTTPS / REST client]"