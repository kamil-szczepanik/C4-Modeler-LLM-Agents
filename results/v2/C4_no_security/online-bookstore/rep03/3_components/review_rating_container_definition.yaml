level: component
scope: "Component diagram for the Review & Rating Container container"
parentContainer:
  name: "Review & Rating Container"
elements:
  - type: "component"
    name: "Review API Controller"
    technology: "Django REST Framework"
    description: "Django REST Framework endpoint handling CRUD operations and filtering."
  - type: "component"
    name: "Event Consumer Component"
    technology: "Celery"
    description: "Celery worker processing OrderCompleted and UserDeletionRequested events."
  - type: "component"
    name: "Engagement Engine"
    technology: "Python module"
    description: "Python module calculating aggregate ratings and helpful votes."
  - type: "component"
    name: "Data Access Layer"
    technology: "Django ORM"
    description: "Django ORM interfacing with database storage."
relationships:
  - source: "Edge & Ingress"
    destination: "Review API Controller"
    description: "Forwards review requests via [gRPC over TLS]."
  - source: "Amazon EventBridge"
    destination: "Event Consumer Component"
    description: "Delivers `OrderCompleted` and `UserDeletionRequested` events via [AWS SQS]."
  - source: "Review API Controller"
    destination: "Amazon Aurora PostgreSQL"
    description: "Queries and persists review data via [TCP/PostgreSQL Protocol]."