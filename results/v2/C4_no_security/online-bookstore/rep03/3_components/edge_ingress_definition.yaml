level: component
scope: "Component diagram for the Edge & Ingress container"
parentContainer:
  name: "Edge & Ingress"
elements:
  - type: "component"
    name: "DNS Router"
    technology: "Amazon Route 53"
    description: "Provides latency-based global DNS routing and automatic multi-region failover."
  - type: "component"
    name: "API Gateway Service"
    technology: "Amazon API Gateway"
    description: "Handles rate-limiting, OWASP Top-10 mitigations, TLS termination, and response caching for anonymous catalog searches."
  - type: "component"
    name: "Auth & Token Verifier Component"
    technology: "In-memory validation"
    description: "Validates authentication and security tokens for incoming requests."
  - type: "component"
    name: "Request Router & Transformer Component"
    technology: "gRPC over TLS with AWS X-Ray"
    description: "Transforms and routes requests to downstream containers with localization headers and trace contexts."
  - type: "component"
    name: "Client Frontend"
    technology: "React, AWS CloudFront, Amazon S3"
    description: "Serves client interface and initiates HTTPS requests over TLS to the API Gateway."
  - type: "component"
    name: "Downstream Containers"
    technology: "Catalog, Order, Review Containers"
    description: "Microservices receiving internal gRPC traffic from the edge routing layer."
relationships:
  - source: "Client Frontend"
    destination: "API Gateway Service"
    description: "HTTPS over TLS"
  - source: "API Gateway Service"
    destination: "Auth & Token Verifier Component"
    description: "In-memory validation"
  - source: "Auth & Token Verifier Component"
    destination: "Request Router & Transformer Component"
    description: "Internal routing"
  - source: "Request Router & Transformer Component"
    destination: "Downstream Containers"
    description: "gRPC over TLS with AWS X-Ray Trace Context and localization headers"
  - source: "DNS Router"
    destination: "API Gateway Service"
    description: "Latency-based DNS routing with health-check failover"