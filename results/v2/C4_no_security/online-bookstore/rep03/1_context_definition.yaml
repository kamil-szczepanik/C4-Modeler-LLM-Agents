level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "An Amazon-style e-commerce platform delivering global book purchasing, recommendations, and reviews with high availability, GDPR compliance, and sub-second performance."
elements:
  - type: "person"
    name: "Customers and Registered Reviewers"
    description: "Web and mobile users who browse books, manage carts, make purchases, and write reviews."
  - type: "person"
    name: "Store Administrators"
    description: "Internal management users who oversee operations and platform administration."
  - type: "externalSystem"
    name: "Stripe / PayPal"
    description: "Payment Gateway Provider handling payment processing."
  - type: "externalSystem"
    name: "FedEx / UPS"
    description: "Third-Party Shipping APIs for label generation and tracking."
  - type: "externalSystem"
    name: "AWS SES / SendGrid"
    description: "Email and Notification Service for transactional alerts."
  - type: "externalSystem"
    name: "Avalara / TaxJar"
    description: "Tax Calculation Service for real-time tax estimation."
relationships:
  - source: "Customers and Registered Reviewers"
    destination: "Online Bookstore System"
    description: "Browsing, cart, and checkout operations"
    technology: "HTTPS (Web/Mobile)"
  - type: "person"
    name: "Store Administrators"
    destination: "Online Bookstore System"
    description: "Internal management and administration"
    technology: "HTTPS"
  - source: "Online Bookstore System"
    destination: "Stripe / PayPal"
    description: "Payment processing"
    technology: "HTTPS / REST API (TLS 1.3)"
  - source: "Online Bookstore System"
    destination: "FedEx / UPS"
    description: "Label generation and tracking"
    technology: "HTTPS / REST API"
  - source: "Online Bookstore System"
    destination: "Avalara / TaxJar"
    description: "Real-time tax estimation"
    technology: "HTTPS / REST API"
  - source: "Online Bookstore System"
    destination: "AWS SES / SendGrid"
    description: "Transactional alerts and notifications"
    technology: "HTTPS / SMTP"