level: component
scope: "Component diagram for the Localization Service container"
parentContainer:
  name: "Localization Service"
elements:
  - type: "component"
    name: "Localization Controller"
    technology: "Node.js / TypeScript, gRPC"
    description: "Routes requests via gRPC / REST and handles multi-region regional adaptation and formatting."
  - type: "component"
    name: "Currency Exchange Engine"
    technology: "Node.js / TypeScript"
    description: "Handles dynamic multi-currency conversion (USD, EUR, GBP) and queries cached exchange rates."
  - type: "component"
    name: "Locale Policy & Compliance Provider"
    technology: "Node.js / TypeScript"
    description: "Reads regional compliance and tax-display JSON assets from storage."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Redis"
    description: "In-memory caching for live exchange rates supporting stale-while-revalidate patterns."
  - type: "component"
    name: "Amazon S3"
    technology: "Amazon S3"
    description: "Static key-value store for fast regional compliance and tax-display JSON assets."
  - type: "component"
    name: "AWS API Gateway & Application Load Balancer"
    technology: "AWS API Gateway & ALB"
    description: "Routes external requests to the Localization Controller."
  - type: "component"
    name: "Amazon ECS on Fargate"
    technology: "AWS ECS on Fargate"
    description: "Container runtime hosting the core localization service components."
  - type: "component"
    name: "CloudWatch Canaries"
    technology: "AWS CloudWatch"
    description: "Synthetic monitoring tools for multi-region availability probing."
  - type: "component"
    name: "Upstream Rate APIs"
    technology: "HTTPS"
    description: "External APIs providing currency exchange rate updates."
relationships:
  - source: "AWS API Gateway & Application Load Balancer"
    destination: "Localization Controller"
    description: "Routes requests via [gRPC / REST]"
  - source: "Currency Exchange Engine"
    destination: "Amazon ElastiCache (Redis)"
    description: "Queries cached exchange rates via [Redis Protocol]"
  - source: "Currency Exchange Engine"
    destination: "Upstream Rate APIs"
    description: "Fetches updates via [HTTPS] with [Circuit Breaker]"
  - source: "Locale Policy & Compliance Provider"
    destination: "Amazon S3"
    description: "Reads regional rules via [HTTPS / AWS SDK]"