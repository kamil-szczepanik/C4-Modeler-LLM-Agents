level: component
scope: "Component diagram for the API Gateway & Load Balancer container"
parentContainer:
  name: "API Gateway & Load Balancer"
elements:
  - type: "component"
    name: "Amazon Route 53"
    technology: "AWS DNS"
    description: "Handles latency-based DNS routing for global traffic distribution."
  - type: "component"
    name: "AWS WAF"
    technology: "AWS Web Application Firewall"
    description: "Protects against web exploits and malicious traffic."
  - type: "component"
    name: "Application Load Balancer"
    technology: "AWS ALB"
    description: "Distributes incoming HTTP/HTTPS traffic across multiple targets."
  - type: "component"
    name: "API Gateway"
    technology: "AWS API Gateway"
    description: "Manages secure client requests and real-time streams via HTTPS/REST and WebSockets."
relationships:
  - source: "Amazon Route 53"
    destination: "AWS WAF"
    description: "Routes filtered traffic to"
  - source: "AWS WAF"
    destination: "Application Load Balancer"
    description: "Forwards inspected traffic to"
  - source: "Application Load Balancer"
    destination: "API Gateway"
    description: "Routes client requests to"