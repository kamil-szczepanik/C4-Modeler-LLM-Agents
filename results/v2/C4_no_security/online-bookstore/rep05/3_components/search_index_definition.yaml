level: component
scope: "Component diagram for the Search Index container"
parentContainer:
  name: "Search Index"
elements:
  - type: "component"
    name: "Search Coordinator"
    technology: "Java/Kotlin, OpenSearch Plugin"
    description: "Submits and coordinates search queries for shoppers and administrators."
  - type: "component"
    name: "Indexing Worker with Merchandising Rules Engine"
    technology: "OpenSearch Ingestion Engine"
    description: "Bulk-indexes documents and applies dynamic scoring and merchandising rules."
  - type: "component"
    name: "Index Shards & Storage"
    technology: "Apache Lucene Engine, Amazon OpenSearch Service"
    description: "Powers inverted indices, vector embeddings, and stores index shards with multi-AZ high availability."
relationships:
  - source: "Catalog & Search Service"
    destination: "Search Coordinator"
    description: "Submits search queries [HTTPS / REST over secure VPC]"
  - source: "Amazon SQS"
    destination: "Indexing Worker with Merchandising Rules Engine"
    description: "Delivers catalogue delta events [AWS SDK / SQS Pull]"
  - source: "Indexing Worker with Merchandising Rules Engine"
    destination: "Index Shards & Storage"
    description: "Bulk-indexes documents and applies dynamic scoring [Internal Transport Protocol]"
  - source: "Index Shards & Storage"
    destination: "Amazon S3"
    description: "Stores daily automated snapshots [AWS SDK / HTTPS]"