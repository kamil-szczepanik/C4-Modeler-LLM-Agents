level: component
scope: "Component diagram for the Database Cluster container"
parentContainer:
  name: "Database Cluster"
elements:
  - type: "component"
    name: "Primary Writer Instance"
    technology: "Amazon Aurora PostgreSQL"
    description: "Handles all write transactions, PII masking, and GDPR/CCPA requests from services."
  - type: "component"
    name: "Cross-Region Read Replicas"
    technology: "Amazon Aurora PostgreSQL Read Replicas"
    description: "Handles read queries for the catalog and search services globally."
  - type: "component"
    name: "PgBouncer Connection Pooler"
    technology: "PgBouncer"
    description: "Manages container connection spikes to the database."
  - type: "component"
    name: "Routing Proxy"
    technology: "Aurora Read-Write Endpoint"
    description: "Routes database traffic appropriately between writer and reader instances."
relationships:
  - source: "Checkout & Order Service"
    destination: "Primary Writer Instance"
    description: "Write transactions [TCP / TLS, PostgreSQL Wire Protocol]"
  - source: "Catalog & Search Service"
    destination: "Cross-Region Read Replicas"
    description: "Read queries [TCP / TLS, PostgreSQL Wire Protocol]"
  - source: "Data Privacy Service"
    destination: "Primary Writer Instance"
    description: "PII masking and GDPR/CCPA requests [TCP / TLS, PostgreSQL Wire Protocol]"
  - source: "ECS Fargate Tasks"
    destination: "Primary Writer Instance"
    description: "Authenticated via AWS Secrets Manager and IAM database authentication"