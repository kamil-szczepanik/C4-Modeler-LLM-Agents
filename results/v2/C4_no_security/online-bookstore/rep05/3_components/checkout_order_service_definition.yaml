level: component
scope: "Component diagram for the Checkout & Order Service container"
parentContainer:
  name: "Checkout & Order Service"
elements:
  - type: "component"
    name: "Checkout Orchestrator"
    technology: "Go SDK, Temporal"
    description: "Manages multi-step saga state persistence and timeout workflows for orders."
  - type: "component"
    name: "Order Management API"
    technology: "REST, gRPC"
    description: "Exposes endpoints for creating and managing customer orders."
  - type: "component"
    name: "Fulfillment & Integration Engine"
    technology: "Node.js / Go / Python"
    description: "Ingests third-party webhooks and queues asynchronous fulfillment updates."
  - type: "component"
    name: "Data Access Repository"
    technology: "SQL / ORM"
    description: "Handles data persistence operations for orders, refunds, and idempotency data."
relationships:
  - source: "Checkout Orchestrator"
    destination: "Data Access Repository"
    description: "Persists workflow state and transaction data"
  - source: "Order Management API"
    destination: "Checkout Orchestrator"
    description: "Triggers checkout saga execution"
  - source: "Fulfillment & Integration Engine"
    destination: "Checkout Orchestrator"
    description: "Updates order fulfillment status"