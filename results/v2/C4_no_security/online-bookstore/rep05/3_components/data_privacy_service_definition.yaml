level: component
scope: "Component diagram for the Data Privacy Service container"
parentContainer:
  name: "Data Privacy Service"
elements:
  - type: "component"
    name: "DSAR Orchestrator"
    technology: "Node.js / TypeScript"
    description: "Orchestrates Data Subject Access Requests (DSAR) workflows, interacts with messaging queues and notification systems."
  - type: "component"
    name: "Consent Manager"
    technology: "Go"
    description: "Manages user privacy consents and compliance preferences."
  - type: "component"
    name: "Data Anonymization Engine"
    technology: "Python / Pandas"
    description: "Handles data masking, anonymization, and processing for privacy regulations."
relationships:
  - source: "DSAR Orchestrator"
    destination: "Messaging Bus (Amazon SQS)"
    description: "Sends asynchronous DSAR workflow messages [AMQP]"
  - source: "DSAR Orchestrator"
    destination: "Notification System (External)"
    description: "Sends DSAR status notifications [Amazon SNS/HTTPS]"
  - source: "Data Privacy Service"
    destination: "Database Cluster (Amazon Aurora)"
    description: "Persists and retrieves user privacy and consent data [TCP/PostgreSQL driver]"
  - source: "DSAR Orchestrator & Consent Manager"
    destination: "S3 Temporary Staging Buckets"
    description: "Reads and writes encrypted DSAR export packages [HTTPS]"