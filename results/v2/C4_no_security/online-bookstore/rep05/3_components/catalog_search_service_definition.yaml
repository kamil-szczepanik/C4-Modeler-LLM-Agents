level: component
scope: "Component diagram for the Catalog & Search Service container"
parentContainer:
  name: "Catalog & Search Service"
elements:
  - type: "component"
    name: "Search Facade Component"
    technology: "Amazon OpenSearch query builder"
    description: "Handles keyword searches, facet filtering, fuzzy matching, synonyms, and ranking boosts."
  - type: "component"
    name: "Inventory Manager Component"
    technology: "Express.js service"
    description: "Handles stock mutations and catalog updates."
  - type: "component"
    name: "Catalog Event Publisher"
    technology: "Amazon SNS/SQS"
    description: "Emits state-change and low-stock events asynchronously."
  - type: "component"
    name: "Stock Event Notifier"
    technology: "Amazon SNS/SQS"
    description: "Notifies system of stock and inventory events."
relationships:
  - source: "Search Facade Component"
    destination: "Amazon OpenSearch"
    description: "Queries keyword, facet, and fuzzy data [TCP / HTTPS]"
  - source: "Inventory Manager Component"
    destination: "Amazon Aurora"
    description: "Reads and writes stock/catalog mutations [PostgreSQL Wire Protocol]"
  - source: "Catalog Event Publisher"
    destination: "Amazon SNS/SQS"
    description: "Emits state-change and low-stock events [AMQP / JSON]"