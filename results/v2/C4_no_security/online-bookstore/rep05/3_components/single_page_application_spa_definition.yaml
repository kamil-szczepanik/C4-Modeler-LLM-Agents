level: component
scope: "Component diagram for the Single Page Application (SPA) container"
parentContainer:
  name: "Single Page Application (SPA)"
elements:
  - type: "component"
    name: "Router Component"
    technology: "React Router"
    description: "Managing client-side navigation and lazy loading."
  - type: "component"
    name: "Authentication & User Context Component"
    technology: "React / TypeScript"
    description: "Handles JWT tokens and role-based access."
  - type: "component"
    name: "Catalog & Search UI Component"
    technology: "React / TypeScript"
    description: "Renders book search and recommendation widgets."
  - type: "component"
    name: "Cart & Checkout UI Component"
    technology: "React / TypeScript"
    description: "Manages local cart state and multi-step checkout."
  - type: "component"
    name: "API Client Component"
    technology: "TypeScript / HTTPS / WebSocket"
    description: "Encapsulates HTTPS/REST and WebSocket communication."
relationships:
  - source: "Router Component"
    destination: "Catalog & Search UI Component"
    description: "Lazy-loads catalogue views [Client-side routing]"
  - source: "Router Component"
    destination: "Cart & Checkout UI Component"
    description: "Lazy-loads checkout workflows [Client-side routing]"
  - source: "Catalog & Search UI Component"
    destination: "API Client Component"
    description: "Requests book data and search indices [Internal method call]"
  - source: "Cart & Checkout UI Component"
    destination: "API Client Component"
    description: "Sends cart mutations and orders [Internal method call]"
  - source: "API Client Component"
    destination: "AWS API Gateway & Load Balancer"
    description: "Communicates via HTTPS/REST and WebSockets [TLS 1.3]"