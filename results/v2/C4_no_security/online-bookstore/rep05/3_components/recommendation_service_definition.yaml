level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "Recommendation API Router"
    technology: "Python, FastAPI"
    description: "Routes incoming recommendation requests from the API Gateway."
  - type: "component"
    name: "A/B Experimentation Evaluator"
    technology: "Python"
    description: "Evaluates A/B testing variants for users."
  - type: "component"
    name: "Algorithm Engine"
    technology: "Python, NumPy, PyTorch"
    description: "Generates collaborative filtering and recommendations using ML models."
  - type: "component"
    name: "Circuit Breaker"
    technology: "Python"
    description: "Prevents cascading failures by stopping traffic to failing dependencies."
  - type: "component"
    name: "Fallback Manager"
    technology: "Python"
    description: "Provides fallback responses when the algorithm engine or dependencies fail."
  - type: "component"
    name: "Clickstream Publisher"
    technology: "Python, Amazon SQS/SNS"
    description: "Asynchronously publishes telemetry and clickstream events."
  - type: "component"
    name: "Data Access Client"
    technology: "Python, SQL/ORM"
    description: "Fetches user history, metadata, cached vectors, and session data."
relationships:
  - source: "Recommendation API Router"
    destination: "A/B Experimentation Evaluator"
    description: "Evaluates experiment variants"
  - source: "A/B Experimentation Evaluator"
    destination: "Algorithm Engine"
    description: "Requests model inference"
  - source: "Recommendation API Router"
    destination: "Circuit Breaker"
    description: "Guards requests through"
  - source: "Circuit Breaker"
    destination: "Fallback Manager"
    description: "Triggers fallback on failure"
  - source: "Algorithm Engine"
    destination: "Data Access Client"
    description: "Reads vectors and metadata"
  - source: "Recommendation API Router"
    destination: "Clickstream Publisher"
    description: "Publishes clickstream telemetry"