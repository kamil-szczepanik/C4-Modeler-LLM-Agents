level: component
scope: "Component diagram for the Messaging Bus container"
parentContainer:
  name: "Messaging Bus"
elements:
  - type: "component"
    name: "Topic Router"
    technology: "Amazon SNS"
    description: "Publishes and fans out order events to downstream event queues."
  - type: "component"
    name: "Command & Event Queues"
    technology: "Amazon SQS"
    description: "Buffers asynchronous messages for processing by consuming microservices."
  - type: "component"
    name: "Dead Letter Queues"
    technology: "Amazon SQS DLQ"
    description: "Captures and stores failed or poisoned messages for troubleshooting."
  - type: "component"
    name: "Telemetry SDK"
    technology: "AWS X-Ray SDK"
    description: "Injects and propagates trace context across messaging boundaries."
  - type: "component"
    name: "Idempotency Deduplication Handler"
    technology: "Amazon DynamoDB"
    description: "Verifies transaction uniqueness and prevents duplicate message processing."
relationships:
  - source: "Topic Router"
    destination: "Command & Event Queues"
    description: "Fans out messages via push subscriptions"
  - source: "Command & Event Queues"
    destination: "Idempotency Deduplication Handler"
    description: "Verifies transaction uniqueness during message processing"
  - source: "Command & Event Queues"
    destination: "Dead Letter Queues"
    description: "Routes failed messages after max retries"