level: component
scope: "Component diagram for the Session Cache Store container"
parentContainer:
  name: "Session Cache Store"
elements:
  - type: "component"
    name: "ShoppingCartsTable"
    technology: "Amazon DynamoDB"
    description: "Core Amazon DynamoDB table storing session and cart items."
  - type: "component"
    name: "UserIndex"
    technology: "Global Secondary Index (GSI)"
    description: "Global Secondary Index on UserID for efficient user-specific data lookups."
  - type: "component"
    name: "SessionRepository"
    technology: "AWS SDK v3 for Node.js/Go"
    description: "Data access layer utilizing AWS SDK v3 for Node.js/Go."
  - type: "component"
    name: "Checkout & Order Service"
    technology: "AWS PrivateLink, TLS 1.3"
    description: "Primary client writing and reading session states."
  - type: "component"
    name: "Data Privacy Service"
    technology: "AWS PrivateLink, TLS 1.3"
    description: "External consumer handling GDPR/CCPA requests via UserIndex."
relationships:
  - source: "Checkout & Order Service"
    destination: "ShoppingCartsTable"
    description: "Manages cart and session data [HTTPS, TLS 1.3, AWS PrivateLink]"
  - source: "Data Privacy Service"
    destination: "UserIndex"
    description: "Queries and purges user session data for compliance [HTTPS, TLS 1.3, AWS PrivateLink]"
  - source: "ShoppingCartsTable"
    destination: "ShoppingCartsTable"
    description: "Replicates global data across regions [AWS DynamoDB Global Tables Protocol]"