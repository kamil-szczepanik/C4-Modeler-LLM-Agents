level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Customer (Shopper)"
    description: "End-user browsing books, managing cart, executing secure checkouts, writing reviews, and viewing recommendations."
  - type: "person"
    name: "Book Author/Publisher"
    description: "Publishers and authors managing catalog entries and monitoring sales performance."
  - type: "person"
    name: "Store Administrator"
    description: "Platform operators managing system configurations, users, and store catalogs."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processors handling secure payment transactions."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "External logistics providers handling shipping and fulfillment tracking."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Authentication services providing identity verification and user management."
  - type: "externalSystem"
    name: "Notification System"
    description: "Messaging services sending transactional notifications and alerts."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "Tax services calculating applicable sales and regional taxes."
  - type: "container"
    name: "Single Page Application (SPA)"
    technology: "React, TypeScript, Amazon CloudFront, S3"
    description: "Frontend interface providing book search, reviews, and e-commerce workflows."
  - type: "container"
    name: "API Gateway & Load Balancer"
    technology: "AWS API Gateway, Application Load Balancer (ALB)"
    description: "Entry point for client traffic routing requests to core microservices."
  - type: "container"
    name: "Catalog & Search Service"
    technology: "Node.js, Amazon ECS on Fargate"
    description: "Manages book inventory and search capabilities."
  - type: "container"
    name: "Checkout & Order Service"
    technology: "Go/Java, Amazon ECS on Fargate"
    description: "Handles secure checkouts, order processing, and transaction workflows."
  - type: "container"
    name: "Recommendation Service"
    technology: "Python, FastAPI, Amazon ECS on Fargate"
    description: "Provides personalized book recommendations to customers."
  - type: "container"
    name: "Data Privacy Service"
    technology: "Amazon ECS on Fargate"
    description: "Ensures global regulatory compliance such as GDPR and CCPA."
  - type: "container"
    name: "Localization Service"
    technology: "Amazon ECS on Fargate"
    description: "Handles multi-region localization and formatting."
  - type: "container"
    name: "Database Cluster"
    technology: "Amazon Aurora (PostgreSQL)"
    description: "Primary relational data store with global databases for transactional safety."
  - type: "container"
    name: "Session Cache Store"
    technology: "Amazon DynamoDB"
    description: "NoSQL data store for cart sessions and rapid data access."
  - type: "container"
    name: "Search Index"
    technology: "Amazon OpenSearch"
    description: "Search engine data store for catalogue indexing and search queries."
  - type: "container"
    name: "Messaging Bus"
    technology: "Amazon SQS, Amazon SNS, Dead Letter Queues"
    description: "Asynchronous event-driven messaging backbone for microservices."
relationships:
  - source: "Customer (Shopper)"
    destination: "Single Page Application (SPA)"
    description: "Browses books, manages cart, and views recommendations"
    technology: "HTTPS via Web/Mobile browsers"
  - source: "Book Author/Publisher"
    destination: "Single Page Application (SPA)"
    description: "Manages catalog items and monitors publication data"
    technology: "HTTPS via Web browsers"
  - source: "Store Administrator"
    destination: "Single Page Application (SPA)"
    description: "Administers platform configurations and operations"
    technology: "HTTPS via Web browsers"
  - source: "Single Page Application (SPA)"
    destination: "API Gateway & Load Balancer"
    description: "Sends API requests and establishes real-time streams"
    technology: "HTTPS/REST and WebSockets"
  - source: "API Gateway & Load Balancer"
    destination: "Catalog & Search Service"
    description: "Routes catalog and search requests"
    technology: "gRPC / REST"
  - source: "API Gateway & Load Balancer"
    destination: "Checkout & Order Service"
    description: "Routes checkout and order processing requests"
    technology: "gRPC / REST"
  - source: "API Gateway & Load Balancer"
    destination: "Recommendation Service"
    description: "Routes recommendation requests"
    technology: "gRPC / REST"
  - source: "API Gateway & Load Balancer"
    destination: "Data Privacy Service"
    description: "Routes compliance and privacy requests"
    technology: "gRPC / REST"
  - source: "API Gateway & Load Balancer"
    destination: "Localization Service"
    description: "Routes localization requests"
    technology: "gRPC / REST"
  - source: "Catalog & Search Service"
    destination: "Database Cluster"
    description: "Reads and writes catalog data"
    technology: "Secure VPC / Amazon Aurora Global Databases"
  - source: "Checkout & Order Service"
    destination: "Database Cluster"
    description: "Reads and writes order data"
    technology: "Secure VPC / Amazon Aurora Global Databases"
  - source: "Catalog & Search Service"
    destination: "Search Index"
    description: "Indexes and queries catalogue search"
    technology: "Secure VPC connections"
  - source: "Checkout & Order Service"
    destination: "Session Cache Store"
    description: "Manages cart and session data"
    technology: "Secure VPC connections"
  - source: "Checkout & Order Service"
    destination: "Messaging Bus"
    description: "Publishes and consumes order events"
    technology: "Amazon SQS/SNS"
  - source: "Checkout & Order Service"
    destination: "Payment Gateway"
    description: "Processes secure customer payments"
    technology: "Secure REST integration with circuit breakers"
  - source: "Checkout & Order Service"
    destination: "Shipping Provider APIs"
    description: "Manages shipping and fulfillment"
    technology: "Secure REST integration with circuit breakers"
  - source: "Catalog & Search Service"
    destination: "Identity Provider"
    description: "Verifies user identity"
    technology: "Secure REST integration with circuit breakers"
  - source: "Checkout & Order Service"
    destination: "Notification System"
    description: "Dispatches transactional alerts and emails"
    technology: "Secure REST integration with circuit breakers"
  - source: "Checkout & Order Service"
    destination: "Tax Calculation Service"
    description: "Calculates applicable sales taxes"
    technology: "Secure REST integration with circuit breakers"