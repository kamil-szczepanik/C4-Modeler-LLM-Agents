level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore System"
  description: "A globally scaled e-commerce platform built on AWS providing book browsing, secure checkout, reviews, and recommendations for 1M MAU."
elements:
  - type: "person"
    name: "Customer (Shopper)"
    description: "End user browsing books, managing cart, executing secure checkouts, writing reviews, and viewing recommendations."
  - type: "person"
    name: "Book Author/Publisher"
    description: "Publishers and authors managing catalog entries and monitoring sales performance."
  - type: "person"
    name: "Store Administrator"
    description: "Platform operators managing system configurations, users, and store catalogs."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processors like Stripe and PayPal handling secure payment transactions."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "External logistics providers like FedEx and UPS handling shipping and fulfillment tracking."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Authentication services like Auth0 and AWS Cognito providing identity verification and user management."
  - type: "externalSystem"
    name: "Notification System"
    description: "Messaging services like AWS SES and SNS sending transactional notifications and alerts."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "Tax services like Avalara and TaxJar calculating applicable sales and regional taxes."
relationships:
  - source: "Customer (Shopper)"
    destination: "Online Bookstore System"
    description: "Browses books, manages cart, and executes secure checkout"
    technology: "HTTPS via Web/Mobile browsers"
  - source: "Book Author/Publisher"
    destination: "Online Bookstore System"
    description: "Manages catalog items and monitors publication data"
    technology: "HTTPS via Web browsers"
  - source: "Store Administrator"
    destination: "Online Bookstore System"
    description: "Administers platform configurations and operations"
    technology: "HTTPS via Web browsers"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Processes secure customer payments"
    technology: "REST/JSON over TLS 1.3"
  - source: "Online Bookstore System"
    destination: "Shipping Provider APIs"
    description: "Calculates shipping rates and manages fulfillment"
    technology: "REST/JSON over TLS 1.3"
  - source: "Online Bookstore System"
    destination: "Identity Provider"
    description: "Authenticates users and verifies identity"
    technology: "REST/JSON over TLS 1.3"
  - source: "Online Bookstore System"
    destination: "Notification System"
    description: "Dispatches transactional emails and notifications"
    technology: "REST/JSON over TLS 1.3"
  - source: "Online Bookstore System"
    destination: "Tax Calculation Service"
    description: "Calculates applicable sales and regional taxes"
    technology: "REST/JSON over TLS 1.3"