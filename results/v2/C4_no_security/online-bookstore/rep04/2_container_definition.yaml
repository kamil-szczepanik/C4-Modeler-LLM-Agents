# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Shopper"
    description: "End-user browsing, purchasing, and reviewing books globally."
  - type: "person"
    name: "Customer Support Agent"
    description: "Internal user managing GDPR data erasure and fulfillment."
  - type: "person"
    name: "Catalog Manager / Administrator"
    description: "Internal user managing book catalog and system administration."
  - type: "person"
    name: "Compliance Officer"
    description: "Internal user overseeing GDPR and CCPA regulatory compliance."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External PCI-compliant checkout service."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "External fulfillment and tracking service."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External OIDC/OAuth2 authentication service."
  - type: "externalSystem"
    name: "Third-Party Recommendation Engine"
    description: "External SaaS for advanced product recommendations."
  - type: "container"
    name: "AWS Route 53"
    description: "Global DNS and routing layer."
    technology: "AWS Route 53"
  - type: "container"
    name: "AWS CloudFront & Amazon S3"
    description: "Global Content Delivery Network and static hosting for the Single Page Application."
    technology: "AWS CloudFront, Amazon S3"
  - type: "container"
    name: "Single Page Application (SPA)"
    description: "User interface enabling global book discovery, secure checkout, and multi-currency purchasing."
    technology: "React, TypeScript"
  - type: "container"
    name: "AWS API Gateway"
    description: "API gateway routing requests to backend microservices."
    technology: "AWS API Gateway"
  - type: "container"
    name: "Catalog Service"
    description: "Microservice responsible for managing book catalog data."
    technology: "Spring Boot / Node.js on Amazon ECS/Fargate"
  - type: "container"
    name: "Order & Checkout Service"
    description: "Microservice managing orders, payments, and checkout workflows."
    technology: "Spring Boot / Node.js on Amazon ECS/Fargate"
  - type: "container"
    name: "User & Compliance Service"
    description: "Microservice handling user profiles and GDPR/CCPA compliance."
    technology: "Spring Boot / Node.js on Amazon ECS/Fargate"
  - type: "container"
    name: "Notification Service"
    description: "Microservice responsible for sending notifications asynchronously."
    technology: "Spring Boot / Node.js on Amazon ECS/Fargate"
  - type: "container"
    name: "Recommendation Worker"
    description: "Worker service handling asynchronous event ingestion and recommendation processing."
    technology: "Spring Boot / Node.js on Amazon ECS/Fargate"
  - type: "container"
    name: "Amazon RDS PostgreSQL"
    description: "Primary relational database with cross-region read replicas and geo-partitioning."
    technology: "Amazon RDS PostgreSQL"
  - type: "container"
    name: "Amazon DynamoDB"
    description: "NoSQL database for low-latency promotional data."
    technology: "Amazon DynamoDB"
  - type: "container"
    name: "Amazon ElastiCache (Redis)"
    description: "In-memory caching layer to absorb read spikes."
    technology: "Amazon ElastiCache (Redis)"
  - type: "container"
    name: "AWS SQS/SNS with DLQs"
    description: "Messaging system for asynchronous processing and event decoupling."
    technology: "AWS SQS, AWS SNS"
relationships:
  - source: "Shopper"
    destination: "AWS Route 53"
    description: "Resolves domain and routes globally"
    technology: "DNS"
  - source: "Shopper"
    destination: "AWS CloudFront & Amazon S3"
    description: "Accesses the React SPA via HTTPS"
    technology: "HTTPS"
  - source: "Catalog Manager / Administrator"
    destination: "AWS CloudFront & Amazon S3"
    description: "Accesses admin interfaces via HTTPS"
    technology: "HTTPS"
  - source: "Single Page Application (SPA)"
    destination: "AWS API Gateway"
    description: "Communicates with API Gateway"
    technology: "HTTPS, REST/GraphQL"
  - source: "AWS API Gateway"
    destination: "Catalog Service"
    description: "Routes requests via private VPC subnets"
    technology: "gRPC over TLS"
  - source: "AWS API Gateway"
    destination: "Order & Checkout Service"
    description: "Routes requests via private VPC subnets"
    technology: "gRPC over TLS"
  - source: "AWS API Gateway"
    destination: "User & Compliance Service"
    description: "Routes requests via private VPC subnets"
    technology: "gRPC over TLS"
  - source: "Order & Checkout Service"
    destination: "Payment Gateway"
    description: "Integrates for payment processing"
    technology: "HTTPS/REST"
  - source: "Order & Checkout Service"
    destination: "Shipping Provider APIs"
    description: "Integrates for order fulfillment"
    technology: "HTTPS/REST"
  - source: "User & Compliance Service"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OIDC/OAuth2"
  - source: "Catalog Service"
    destination: "Amazon RDS PostgreSQL"
    description: "Persists and queries catalog data"
    technology: "SQL"
  - source: "Order & Checkout Service"
    destination: "Amazon RDS PostgreSQL"
    description: "Persists order data"
    technology: "SQL"
  - source: "User & Compliance Service"
    destination: "Amazon RDS PostgreSQL"
    description: "Persists user and compliance data"
    technology: "SQL"
  - source: "Catalog Service"
    destination: "Amazon DynamoDB"
    description: "Reads/writes promotional data"
    technology: "NoSQL"
  - source: "Catalog Service"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches catalog data"
    technology: "Redis Protocol"
  - source: "Order & Checkout Service"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches session and order state"
    technology: "Redis Protocol"
  - source: "Order & Checkout Service"
    destination: "AWS SQS/SNS with DLQs"
    description: "Publishes order events"
    technology: "AWS SQS/SNS"
  - source: "Notification Service"
    destination: "AWS SQS/SNS with DLQs"
    description: "Consumes notification events"
    technology: "AWS SQS"
  - source: "Recommendation Worker"
    destination: "AWS SQS/SNS with DLQs"
    description: "Consumes recommendation events"
    technology: "AWS SQS"
  - source: "Recommendation Worker"
    destination: "Third-Party Recommendation Engine"
    description: "Ingests recommendation data"
    technology: "HTTPS/REST"