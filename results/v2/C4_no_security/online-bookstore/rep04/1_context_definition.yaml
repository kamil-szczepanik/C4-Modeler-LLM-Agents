level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "Global e-commerce platform providing physical and electronic book sales with integrated reviews, recommendations, and multi-currency support."
elements:
  - type: "person"
    name: "Shopper"
    description: "End-user browsing, purchasing, and reviewing via web/mobile."
  - type: "person"
    name: "Customer Support Agent"
    description: "Internal user managing GDPR data erasure and fulfillment."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External PCI-compliant checkout service (Stripe/PayPal)."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "External fulfillment and tracking service (FedEx/UPS)."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External OIDC/OAuth2 authentication service (Auth0/AWS Cognito)."
  - type: "externalSystem"
    name: "Third-Party Recommendation Engine"
    description: "External SaaS for product recommendations (AWS Personalize)."
  - type: "externalSystem"
    name: "AWS Route 53"
    description: "Global DNS and Anycast routing layer."
relationships:
  - source: "Shopper"
    destination: "Online Bookstore System"
    description: "Browsing, cart, and checkout"
    technology: "HTTPS (Web/Mobile)"
  - source: "Customer Support Agent"
    destination: "Online Bookstore System"
    description: "Support and compliance workflows"
    technology: "HTTPS (Admin Portal)"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Financial transactions"
    technology: "HTTPS/REST"
  - source: "Online Bookstore System"
    destination: "Shipping Provider APIs"
    description: "Order fulfillment and labels"
    technology: "HTTPS/REST"
  - source: "Online Bookstore System"
    destination: "Identity Provider"
    description: "Authentication and profile management"
    technology: "OIDC/OAuth2"
  - source: "Online Bookstore System"
    destination: "Third-Party Recommendation Engine"
    description: "Asynchronous event ingestion and local region caching"
    technology: "HTTPS/REST"