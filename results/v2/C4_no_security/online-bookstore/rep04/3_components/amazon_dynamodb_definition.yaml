level: component
scope: "Component diagram for the Amazon DynamoDB container"
parentContainer:
  name: "Amazon DynamoDB"
elements:
  - type: "component"
    name: "Shopping Cart Table"
    technology: "AWS DynamoDB Table"
    description: "Manages ephemeral shopping cart state with single-digit millisecond latency."
  - type: "component"
    name: "Promotions & Deals Table"
    technology: "AWS DynamoDB Table"
    description: "Stores promotional metadata and deals data."
  - type: "component"
    name: "User Activity Stream Table"
    technology: "AWS DynamoDB Table with DynamoDB Streams"
    description: "Captures user activity streams and browse history for asynchronous processing."
relationships:
  - source: "Order & Checkout Service"
    destination: "Shopping Cart Table"
    description: "Reads/writes ephemeral cart data via AWS SDK [HTTPS / IAM]"
  - source: "Catalog Service"
    destination: "Promotions & Deals Table"
    description: "Reads promotional metadata via AWS SDK [HTTPS / IAM]"
  - source: "User Activity Stream Table"
    destination: "Recommendation Worker"
    description: "Streams browse history via AWS SDK [HTTPS]"