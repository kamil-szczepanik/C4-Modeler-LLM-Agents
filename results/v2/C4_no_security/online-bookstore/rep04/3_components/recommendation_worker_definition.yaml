level: component
scope: "Component diagram for the Recommendation Worker container"
parentContainer:
  name: "Recommendation Worker"
elements:
  - type: "component"
    name: "Event Consumer Component"
    technology: "Spring Boot / Node.js"
    description: "Polls SQS queues to consume recommendation events."
  - type: "component"
    name: "Recommendation Processor Component"
    technology: "Spring Boot / Node.js"
    description: "Core logic for external synchronization and fallbacks."
  - type: "component"
    name: "Cache / State Sync Component"
    technology: "Spring Boot / Node.js"
    description: "Manages local data in Amazon ElastiCache (Redis)."
  - type: "component"
    name: "Compliance Enforcement Component"
    technology: "Spring Boot / Node.js"
    description: "Handles GDPR/CCPA data deletion events."
  - type: "component"
    name: "Shopper"
    technology: "Human User"
    description: "Primary human user benefiting from personalized recommendations."
  - type: "container"
    name: "Recommendation Worker"
    technology: "Amazon ECS / Fargate"
    description: "Parent container running on Amazon ECS/Fargate."
  - type: "system"
    name: "Third-Party Recommendation Engine"
    technology: "HTTPS/REST"
    description: "External system providing recommendation data."
  - type: "container"
    name: "AWS SQS/SNS with DLQs"
    technology: "AWS SQS/SNS"
    description: "Message broker for asynchronous event ingestion."
  - type: "container"
    name: "Amazon ElastiCache (Redis)"
    technology: "Redis"
    description: "In-memory cache for fast retrieval of recommendation snippets."
relationships:
  - source: "Recommendation Worker"
    destination: "AWS SQS/SNS with DLQs"
    description: "Consumes recommendation events [AWS SQS protocol]"
  - source: "Event Consumer Component"
    destination: "Recommendation Processor Component"
    description: "Invokes processing pipeline [Internal Method Call]"
  - source: "Recommendation Processor Component"
    destination: "Third-Party Recommendation Engine"
    description: "Syncs interaction data and fetches recommendations [HTTPS/REST]"
  - source: "Recommendation Processor Component"
    destination: "Amazon ElastiCache (Redis)"
    description: "Updates cache, retrieves defaults, and purges user profiles [RESP protocol]"
  - source: "Compliance Enforcement Component"
    destination: "Amazon ElastiCache (Redis)"
    description: "Purges user recommendation profiles on deletion requests [RESP protocol]"