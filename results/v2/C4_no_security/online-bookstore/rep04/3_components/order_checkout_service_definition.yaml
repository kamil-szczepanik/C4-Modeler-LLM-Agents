level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Cart Controller & Manager"
    technology: "Spring Boot / Node.js"
    description: "Manages shopping cart operations and session states."
  - type: "component"
    name: "Checkout Orchestrator"
    technology: "Spring Boot / Node.js"
    description: "Orchestrates the checkout workflow across services and adapters."
  - type: "component"
    name: "Promotions Component"
    technology: "Spring Boot / Node.js"
    description: "Evaluates and applies promo codes and discounts."
  - type: "component"
    name: "Payment Adapter"
    technology: "Spring Boot / Node.js"
    description: "Integrates with external payment gateways for secure transactions."
  - type: "component"
    name: "Fulfillment Adapter"
    technology: "Spring Boot / Node.js"
    description: "Integrates with shipping provider APIs to manage fulfillment."
  - type: "component"
    name: "Order Repository Component"
    technology: "Spring Boot / Node.js"
    description: "Handles data persistence for transactional order data."
  - type: "component"
    name: "Event Dispatcher Component"
    technology: "Spring Boot / Node.js"
    description: "Publishes domain events using the Transactional Outbox Pattern."
  - type: "component"
    name: "Resilience Layer"
    technology: "Resilience4j"
    description: "Protects adapters and external calls from downstream outages."
relationships:
  - source: "Checkout Orchestrator"
    destination: "Payment Adapter"
    description: "Processes secure transactions via HTTPS/REST"
  - source: "Checkout Orchestrator"
    destination: "Fulfillment Adapter"
    description: "Manages fulfillment via HTTPS/REST"
  - source: "Order Repository Component"
    destination: "Amazon RDS PostgreSQL"
    description: "Persists transactional order data via JDBC/SQL"
  - source: "Cart Controller & Manager"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches sessions and cart state via Redis Protocol"
  - source: "Promotions Component"
    destination: "Amazon ElastiCache (Redis)"
    description: "Performs promo lookups via Redis Protocol"
  - source: "Event Dispatcher Component"
    destination: "AWS SQS/SNS"
    description: "Publishes domain events using AWS SDK with Transactional Outbox Pattern"