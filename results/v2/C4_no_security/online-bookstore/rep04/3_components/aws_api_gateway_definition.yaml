level: component
scope: "Component diagram for the AWS API Gateway container"
parentContainer:
  name: "AWS API Gateway"
elements:
  - type: "component"
    name: "Authorizer"
    technology: "Amazon API Gateway v2/HTTP API Authorizer"
    description: "Validates OAuth2/JWT tokens for incoming requests."
  - type: "component"
    name: "Throttling"
    technology: "Amazon API Gateway Rate-Limiting"
    description: "Manages rate-limiting and protects backend services from high traffic loads."
  - type: "component"
    name: "Routing"
    technology: "Amazon API Gateway HTTP API Routing"
    description: "Routes incoming HTTPS REST/JSON and gRPC-Web requests to backend ECS/Fargate microservices via AWS VPC Link."
relationships:
  - source: "Authorizer"
    destination: "Throttling"
    description: "Passes authenticated requests to"
  - source: "Throttling"
    destination: "Routing"
    description: "Forwards rate-limited requests to"