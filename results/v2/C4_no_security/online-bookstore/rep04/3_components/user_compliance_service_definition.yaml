level: component
scope: "Component diagram for the User & Compliance Service container"
parentContainer:
  name: "User & Compliance Service"
elements:
  - type: "component"
    name: "Profile Controller"
    technology: "Spring MVC / Express.js"
    description: "Manages user profiles and authentication requests."
  - type: "component"
    name: "Compliance Manager"
    technology: "Spring Boot / Node.js"
    description: "Handles GDPR/CCPA data compliance workflows."
  - type: "component"
    name: "Audit Logger"
    technology: "Spring Data JPA / TypeORM"
    description: "Persists immutable audit logs for compliance tracking."
  - type: "component"
    name: "Erasure Event Publisher"
    technology: "AWS SDK"
    description: "Publishes UserDeletedEvent for asynchronous event-driven data erasure."
relationships:
  - source: "Profile Controller"
    destination: "Compliance Manager"
    description: "Delegates compliance requests"
  - source: "Compliance Manager"
    destination: "Audit Logger"
    description: "Records audit logs"
  - source: "Compliance Manager"
    destination: "Erasure Event Publisher"
    description: "Triggers data erasure events"