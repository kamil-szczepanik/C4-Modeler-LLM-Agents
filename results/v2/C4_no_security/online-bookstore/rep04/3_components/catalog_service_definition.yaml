level: component
scope: "Component diagram for the Catalog Service container"
parentContainer:
  name: "Catalog Service"
elements:
  - type: "component"
    name: "Product API Controller"
    technology: "Spring Boot / Node.js"
    description: "Handles incoming product-related API requests and routes them to internal components."
  - type: "component"
    name: "Search & Filter Engine"
    technology: "In-memory / Java/Node.js"
    description: "Provides search and filter capabilities for catalog items."
  - type: "component"
    name: "Catalog Management Domain Logic"
    technology: "Spring Boot / Node.js"
    description: "Contains core business logic for managing the product catalog."
  - type: "component"
    name: "Cache-Aside Proxy"
    technology: "Redis Protocol"
    description: "Manages caching for top-selling books and promotional banners with circuit breakers."
  - type: "component"
    name: "Data Access Layer"
    technology: "JDBC"
    description: "Handles database interactions with Amazon RDS PostgreSQL."
  - type: "component"
    name: "Localized Pricing Service"
    technology: "In-memory / Microservice logic"
    description: "Manages multi-currency and regional pricing logic."
  - type: "component"
    name: "Search Analytics Collector"
    technology: "AWS SDK"
    description: "Collects search analytics and publishes events asynchronously to Amazon SQS."
relationships:
  - source: "Product API Controller"
    destination: "Search & Filter Engine"
    description: "In-memory"
  - source: "Catalog Management Domain Logic"
    destination: "Localized Pricing Service"
    description: "In-memory"
  - source: "Catalog Management Domain Logic"
    destination: "Cache-Aside Proxy"
    description: "In-memory"
  - source: "Catalog Management Domain Logic"
    destination: "Data Access Layer"
    description: "JDBC"
  - source: "Search & Filter Engine"
    destination: "Amazon SQS"
    description: "AWS SDK"