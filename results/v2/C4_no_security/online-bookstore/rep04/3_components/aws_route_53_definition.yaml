level: component
scope: "Component diagram for the AWS Route 53 container"
parentContainer:
  name: "AWS Route 53"
elements:
  - type: "component"
    name: "Hosted Zone"
    technology: "AWS Route 53 Public Hosted Zone"
    description: "Manages authoritative DNS records and emits anonymized query logs."
  - type: "component"
    name: "Routing Policies Engine"
    technology: "AWS Route 53 Latency-Based and Geoproximity Routing"
    description: "Routes traffic globally based on latency and geoproximity."
  - type: "component"
    name: "Health Check Probes"
    technology: "AWS Route 53 global HTTP/HTTPS probes"
    description: "Monitors edge availability."
  - type: "component"
    name: "DNS Failover Controller"
    technology: "AWS Route 53 Failover & Weighted Routing"
    description: "Manages active-passive/active-active failover and weighted routing."
  - type: "component"
    name: "Query Logging & Auditing Component"
    technology: "Route 53 Query Logging with Amazon CloudWatch"
    description: "Captures anonymized DNS query metrics for traffic analysis and DDoS detection while ensuring GDPR/CCPA compliance."
relationships:
  - source: "Shopper"
    destination: "Hosted Zone"
    description: "Resolves domain [DNS]"
  - source: "Routing Policies Engine"
    destination: "AWS CloudFront & Amazon S3"
    description: "Routes traffic globally [HTTPS]"
  - source: "Health Check Probes"
    destination: "AWS CloudFront"
    description: "Monitors edge availability [HTTPS GET]"
  - source: "Hosted Zone"
    destination: "Query Logging & Auditing Component"
    description: "Emits anonymized query logs [Internal AWS Stream]"