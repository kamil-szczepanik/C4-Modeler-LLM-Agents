level: component
scope: "Component diagram for the Amazon RDS PostgreSQL container"
parentContainer:
  name: "Amazon RDS PostgreSQL"
elements:
  - type: "component"
    name: "Primary Database Instance"
    technology: "PostgreSQL"
    description: "Handles write operations and ensures transactional integrity for orders and user data."
  - type: "component"
    name: "Read Replicas"
    technology: "PostgreSQL Read Replicas"
    description: "Handles read-heavy workloads such as catalog browsing and reviews to reduce load on the primary database."
relationships:
  - source: "Primary Database Instance"
    destination: "Read Replicas"
    description: "Replicates transactional data [PostgreSQL Replication]"