level: component
scope: "Component diagram for the Amazon ElastiCache (Redis) container"
parentContainer:
  name: "Amazon ElastiCache (Redis)"
elements:
  - type: "component"
    name: "Catalog Cache Component"
    technology: "Amazon ElastiCache for Redis (Cluster Mode Enabled)"
    description: "Stores serialized book metadata, search facets, and cached third-party recommendations."
  - type: "component"
    name: "Session & Cart Cache Component"
    technology: "Amazon ElastiCache for Redis (Cluster Mode Enabled)"
    description: "Stores ephemeral user session tokens and active shopping cart hashes with strict non-eviction policies."
  - type: "component"
    name: "Inventory Counter Component"
    technology: "Amazon ElastiCache for Redis (Cluster Mode Enabled)"
    description: "Stores atomic integer counters for real-time stock levels during flash sales."
relationships:
  - source: "Catalog Service"
    destination: "Catalog Cache Component"
    description: "Retrieves book metadata and recommendations via Redis Protocol (rediss://)."
  - source: "Order & Checkout Service"
    destination: "Session & Cart Cache Component"
    description: "Manages session state and active carts via Redis Protocol (rediss://)."
  - source: "Order & Checkout Service"
    destination: "Inventory Counter Component"
    description: "Executes atomic inventory decrements via Redis Protocol (rediss://)."