level: component
scope: "Component diagram for the Notification Service container"
parentContainer:
  name: "Notification Service"
elements:
  - type: "component"
    name: "Shoppers & Customer Support Agents"
    technology: "End-user / Client"
    description: "End-users receiving alerts and internal staff auditing sent notifications."
  - type: "component"
    name: "Event Consumer Component"
    technology: "Spring Boot / Node.js"
    description: "Service ingesting messages from AWS SQS."
  - type: "component"
    name: "Notification Router Component"
    technology: "Amazon ElastiCache (Redis)"
    description: "Internal orchestrator managing message flow and idempotency."
  - type: "component"
    name: "Preference & Compliance Manager Component"
    technology: "REST / HTTPS"
    description: "Validator querying the User & Compliance Service."
  - type: "component"
    name: "Template Engine Component"
    technology: "Compiled resource bundles"
    description: "Localized rendering engine."
  - type: "component"
    name: "Channel Dispatcher Components"
    technology: "Resilience4j"
    description: "Adapters using circuit breakers for SendGrid (Email) and Twilio (SMS)."
  - type: "component"
    name: "Notification Repository Component"
    technology: "Amazon DynamoDB"
    description: "Data access layer persisting audit trails."
  - type: "component"
    name: "AWS SQS"
    technology: "AWS SQS"
    description: "Asynchronous messaging backbone ensuring message durability."
  - type: "component"
    name: "User & Compliance Service"
    technology: "REST/HTTPS"
    description: "External compliance and user service."
  - type: "component"
    name: "SendGrid/Twilio APIs"
    technology: "HTTPS"
    description: "External third-party notification providers."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "TCP / NoSQL"
    description: "Storage for audit trails and support lookup histories."
relationships:
  - source: "Event Consumer Component"
    destination: "AWS SQS"
    description: "Consumes asynchronous notification requests [AMQP/SQS]."
  - source: "Preference & Compliance Manager Component"
    destination: "User & Compliance Service"
    description: "Verifies GDPR/CCPA consent and suppression lists [REST/HTTPS]."
  - source: "Channel Dispatcher Components"
    destination: "SendGrid/Twilio APIs"
    description: "Dispatches final payloads to external providers [HTTPS]."
  - source: "Notification Repository Component"
    destination: "Amazon DynamoDB"
    description: "Persists delivery states and audit logs [TCP]."