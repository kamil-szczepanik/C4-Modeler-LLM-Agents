level: component
scope: "Component diagram for the Single Page Application (SPA) container"
parentContainer:
  name: "Single Page Application (SPA)"
elements:
  - type: "component"
    name: "Routing & Shell Component"
    technology: "React & React Router"
    description: "Client-side routing and module lazy-loading for navigation and shell layout."
  - type: "component"
    name: "Catalog & Search Module"
    technology: "React & TypeScript"
    description: "Enables book discovery and search functionality."
  - type: "component"
    name: "Cart & Checkout Module"
    technology: "React, Zustand, Local Storage & IndexedDB"
    description: "Manages shopping cart items and secure multi-currency checkout with local persistence."
  - type: "component"
    name: "Reviews & Recommendations Module"
    technology: "React & TypeScript"
    description: "Displays book reviews and recommendations."
  - type: "component"
    name: "API Client & State Manager"
    technology: "Zustand & TanStack Query (React Query)"
    description: "Handles server-state management, caching, request deduplication, and offline retry logic."
  - type: "component"
    name: "AWS API Gateway"
    technology: "AWS"
    description: "Gateway handling HTTPS REST/GraphQL requests from the SPA."
  - type: "component"
    name: "Amazon CloudFront & Amazon S3"
    technology: "AWS"
    description: "Edge caching, content delivery, and hosting for SPA artifacts."
relationships:
  - source: "Routing & Shell Component"
    destination: "Catalog & Search Module"
    description: "In-memory state and props"
  - source: "Routing & Shell Component"
    destination: "Cart & Checkout Module"
    description: "In-memory state and props"
  - source: "Routing & Shell Component"
    destination: "Reviews & Recommendations Module"
    description: "In-memory state and props"
  - source: "Catalog & Search Module"
    destination: "API Client & State Manager"
    description: "In-memory function calls"
  - source: "Cart & Checkout Module"
    destination: "API Client & State Manager"
    description: "In-memory function calls"
  - source: "Reviews & Recommendations Module"
    destination: "API Client & State Manager"
    description: "In-memory function calls"
  - source: "API Client & State Manager"
    destination: "AWS API Gateway"
    description: "HTTPS, REST/GraphQL"
  - source: "Cart & Checkout Module"
    destination: "Local Storage & IndexedDB"
    description: "Zustand Persist Middleware"
  - source: "SPA Artifacts"
    destination: "Amazon CloudFront & Amazon S3"
    description: "AWS CodePipeline deployment"