level: component
scope: "Component diagram for the AWS SQS/SNS with DLQs container"
parentContainer:
  name: "AWS SQS/SNS with DLQs"
elements:
  - type: "component"
    name: "Amazon SNS"
    technology: "AWS SNS"
    description: "Pubsub messaging service used to broadcast order and system events."
  - type: "component"
    name: "Amazon SQS Notification Queue"
    technology: "AWS SQS"
    description: "Message queue holding asynchronous events for the Notification Service."
  - type: "component"
    name: "Amazon SQS Recommendation Queue"
    technology: "AWS SQS"
    description: "Message queue holding asynchronous events for the Recommendation Worker."
  - type: "component"
    name: "Dead Letter Queues (DLQs)"
    technology: "AWS SQS"
    description: "Queues for capturing failed or unprocessable messages for troubleshooting."
relationships:
  - source: "Amazon SNS"
    destination: "Amazon SQS Notification Queue"
    description: "Broadcasts order events to"
  - source: "Amazon SNS"
    destination: "Amazon SQS Recommendation Queue"
    description: "Broadcasts order events to"
  - source: "Amazon SQS Notification Queue"
    destination: "Dead Letter Queues (DLQs)"
    description: "Routes failed messages to"
  - source: "Amazon SQS Recommendation Queue"
    destination: "Dead Letter Queues (DLQs)"
    description: "Routes failed messages to"