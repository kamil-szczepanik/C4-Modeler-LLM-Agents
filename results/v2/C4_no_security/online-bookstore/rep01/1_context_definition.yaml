level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "An Amazon-style online bookstore designed to provide scalable catalogue browsing, secure checkout, and recommendations for 1M MAU across multiple AWS regions."
elements:
  - type: "person"
    name: "Guest Shopper"
    description: "An unauthenticated user browsing the catalogue and interacting with the bookstore."
  - type: "person"
    name: "Registered Customer"
    description: "An authenticated user performing secure checkout, managing carts, and purchasing books."
  - type: "person"
    name: "Store Administrator"
    description: "An administrator managing inventory and moderation via the Admin Portal."
  - type: "person"
    name: "Customer Support Agent"
    description: "An agent assisting customers with support requests."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system handling secure synchronous payments with Circuit Breaker and TLS 1.3."
  - type: "externalSystem"
    name: "Shipping Provider API"
    description: "External system handling order shipments via asynchronous event-driven messaging."
  - type: "externalSystem"
    name: "Tax/Compliance Service"
    description: "External system ensuring GDPR, CCPA, and multi-currency compliance."
  - type: "externalSystem"
    name: "AWS Route 53"
    description: "Infrastructure container providing global DNS health-checking and latency-based routing."
  - type: "externalSystem"
    name: "AWS SQS/EventBridge"
    description: "Infrastructure container handling asynchronous event-driven messaging and decoupling."
  - type: "externalSystem"
    name: "Amazon DynamoDB"
    description: "Infrastructure container for idempotency storage and safe transaction retries."
relationships:
  - source: "Guest Shopper"
    destination: "Online Bookstore"
    description: "HTTPS (Web/Mobile) for catalogue browsing, cart, and checkout."
    technology: "HTTPS"
  - source: "Registered Customer"
    destination: "Online Bookstore"
    description: "HTTPS (Web/Mobile) for catalogue browsing, cart, and checkout."
    technology: "HTTPS"
  - source: "Store Administrator"
    destination: "Online Bookstore"
    description: "HTTPS (Admin Portal) for inventory and moderation."
    technology: "HTTPS"
  - source: "Customer Support Agent"
    destination: "Online Bookstore"
    description: "HTTPS (Web/Mobile) for customer support interactions."
    technology: "HTTPS"
  - source: "Online Bookstore"
    destination: "Payment Gateway"
    description: "Synchronous payment processing with Circuit Breaker and TLS 1.3."
    technology: "HTTPS / REST"
  - source: "Online Bookstore"
    destination: "Shipping Provider API"
    description: "Asynchronous event-driven messaging for shipping."
    technology: "AWS SQS/EventBridge"
  - source: "Online Bookstore"
    destination: "Tax/Compliance Service"
    description: "Asynchronous event-driven messaging for tax and compliance."
    technology: "AWS SQS/EventBridge"