level: component
scope: "Component diagram for the Recommendation container"
parentContainer:
  name: "Recommendation"
elements:
  - type: "component"
    name: "Recommendation API Controller"
    technology: "Python, FastAPI"
    description: "Handles incoming recommendation requests and routes them to the algorithm engine."
  - type: "component"
    name: "Algorithm Engine"
    technology: "Python, FastAPI"
    description: "Executes similarity logic and processes item recommendations."
  - type: "component"
    name: "Model Cache"
    technology: "Amazon ElastiCache Global Datastore (Redis)"
    description: "Caches pre-computed scores to deliver fast response times."
  - type: "component"
    name: "Event Publisher"
    technology: "Python, AWS SDK"
    description: "Emits telemetry and domain events."
  - type: "component"
    name: "Event Consumer"
    technology: "Python, AWS SQS Protocol"
    description: "Polls asynchronous domain events to invalidate or update cached scores."
relationships:
  - source: "Recommendation API Controller"
    destination: "Algorithm Engine"
    description: "Executes similarity logic [In-process]"
  - source: "Algorithm Engine"
    destination: "Model Cache"
    description: "Fetches pre-computed scores [Redis Protocol / TCP]"
  - source: "Algorithm Engine"
    destination: "Amazon DynamoDB"
    description: "Falls back for deep item similarity graphs on cache misses [HTTPS / boto3]"
  - source: "Event Publisher"
    destination: "AWS EventBridge"
    description: "Emits telemetry events [HTTPS / AWS SDK]"
  - source: "AWS SQS"
    destination: "Event Consumer"
    description: "Polls asynchronous domain events [AWS SQS Protocol]"
  - source: "Event Consumer"
    destination: "Model Cache"
    description: "Invalidates or updates cached scores [Redis Protocol / TCP]"