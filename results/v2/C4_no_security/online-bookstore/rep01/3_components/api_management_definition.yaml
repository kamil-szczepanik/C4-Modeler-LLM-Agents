level: component
scope: "Component diagram for the API Management container"
parentContainer:
  name: "API Management"
elements:
  - type: "component"
    name: "Authentication & Authorization Component"
    technology: "AWS Lambda Authorizer"
    description: "Executes edge-based JWT validation for GDPR/CCPA compliance and validates tokens."
  - type: "component"
    name: "Request Router & Transformation Component"
    technology: "API Gateway Mappings / VTL"
    description: "Routes transformed payloads to downstream services."
  - type: "component"
    name: "Telemetry & Analytics Proxy Component"
    technology: "Amazon CloudWatch, AWS X-Ray"
    description: "Provides telemetry, active tracing, and 5xx error monitoring."
  - type: "component"
    name: "Rate Limiting & Usage Metering Component"
    technology: "API Gateway Usage Plans & API Keys"
    description: "Applies throttling and API key validation."
relationships:
  - source: "Frontend Container"
    destination: "Authentication & Authorization Component"
    description: "Validates tokens [HTTPS]"
  - source: "Request Router & Transformation Component"
    destination: "Catalog & Search"
    description: "Routes transformed payloads [HTTPS / JSON]"
  - source: "Request Router & Transformation Component"
    destination: "Checkout & Order"
    description: "Routes transformed payloads [HTTPS / JSON]"
  - source: "Request Router & Transformation Component"
    destination: "Recommendation"
    description: "Routes transformed payloads [HTTPS / JSON]"
  - source: "Rate Limiting & Usage Metering Component"
    destination: "API Management"
    description: "Applies throttling and API key validation [Internal API]"
  - source: "API Management"
    destination: "Analytics Ingestion"
    description: "Streams clickstream data [Amazon Kinesis]"