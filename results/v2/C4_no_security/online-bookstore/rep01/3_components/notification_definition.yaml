level: component
scope: "Component diagram for the Notification container"
parentContainer:
  name: "Notification"
elements:
  - type: "component"
    name: "Event Consumer Component"
    technology: "Java, Spring Boot"
    description: "Polls AWS SQS to consume asynchronous transactional messaging."
  - type: "component"
    name: "Priority Router Component"
    technology: "Java"
    description: "Routes critical transactional payloads past bulk queues."
  - type: "component"
    name: "Template Engine Component"
    technology: "Handlebars.js"
    description: "Performs dynamic, localized message rendering."
  - type: "component"
    name: "Dispatch Adapter Component"
    technology: "HTTPS REST API"
    description: "Integrates with external messaging services for email and SMS delivery."
  - type: "component"
    name: "Preference & Audit Repository Component"
    technology: "Amazon RDS PostgreSQL, JDBC over TLS"
    description: "Manages GDPR/CCPA compliance logging and user preferences."
relationships:
  - source: "AWS SQS"
    destination: "Event Consumer Component"
    description: "AMQP/HTTPS polling"
  - source: "Event Consumer Component"
    destination: "Priority Router Component"
    description: "In-Memory Java method call"
  - source: "Priority Router Component"
    destination: "Template Engine Component"
    description: "In-Memory Java method call"
  - source: "Template Engine Component"
    destination: "Dispatch Adapter Component"
    description: "HTTPS REST API"
  - source: "Dispatch Adapter Component"
    destination: "Amazon SES / Amazon SNS"
    description: "HTTPS REST API"
  - source: "Event Consumer Component"
    destination: "Preference & Audit Repository Component"
    description: "JDBC over TLS"
  - source: "Dispatch Adapter Component"
    destination: "Preference & Audit Repository Component"
    description: "JDBC over TLS"