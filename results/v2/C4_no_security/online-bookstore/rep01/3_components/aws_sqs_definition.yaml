level: component
scope: "Component diagram for the AWS SQS container"
parentContainer:
  name: "AWS SQS"
elements:
  - type: "component"
    name: "Amazon SQS Standard Queues"
    technology: "Amazon SQS Standard"
    description: "Publishes event notifications via AWS SDK v2 (HTTPS) for Catalog & Search and Recommendation containers."
  - type: "component"
    name: "Amazon SQS FIFO Queues"
    technology: "Amazon SQS FIFO"
    description: "Sends transaction events via AWS SDK v2 (HTTPS) using message group IDs for Checkout & Order container, ensuring strictly ordered payment workflows."
  - type: "component"
    name: "Amazon SQS Dead-Letter Queues (DLQs)"
    technology: "Amazon SQS DLQ"
    description: "Captures failed payloads and triggers processing via long-polling (HTTPS)."
