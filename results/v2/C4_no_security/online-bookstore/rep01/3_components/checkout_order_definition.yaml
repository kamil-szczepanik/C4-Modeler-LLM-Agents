level: component
scope: "Component diagram for the Checkout & Order container"
parentContainer:
  name: "Checkout & Order"
elements:
  - type: "component"
    name: "Checkout Controller"
    technology: "Express.js router"
    description: "Express.js router for API Gateway requests."
  - type: "component"
    name: "Order Orchestrator"
    technology: "Node.js & TypeScript"
    description: "Core domain logic and state machine."
  - type: "component"
    name: "Cart Manager"
    technology: "Node.js & TypeScript"
    description: "DynamoDB session and cart state handler."
  - type: "component"
    name: "Fulfillment Publisher"
    technology: "AWS EventBridge/SQS"
    description: "AWS EventBridge/SQS event emitter."
  - type: "component"
    name: "Order Repository"
    technology: "TypeORM"
    description: "TypeORM-based PostgreSQL mapper."
  - type: "component"
    name: "Consent Auditor"
    technology: "Node.js & TypeScript"
    description: "GDPR/CCPA compliance middleware."
  - type: "component"
    name: "Payment Gateway Client"
    technology: "mTLS REST adapter"
    description: "mTLS REST adapter with circuit breakers."
relationships:
  - source: "Checkout Controller"
    destination: "API Management"
    description: "Receives HTTPS / JSON requests with JWT validation"
  - source: "Cart Manager"
    destination: "Amazon DynamoDB"
    description: "Manages active shopping sessions over TCP"
  - source: "Order Orchestrator"
    destination: "Payment Gateway"
    description: "Processes secure payments via HTTPS / REST with mTLS"
  - source: "Fulfillment Publisher"
    destination: "AWS SQS"
    description: "Publishes asynchronous events for shipping and tax"
  - source: "Fulfillment Publisher"
    destination: "AWS EventBridge"
    description: "Publishes asynchronous events for shipping and tax"
  - source: "Order Repository"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Persists transactional data via TLS-encrypted JDBC/TCP"