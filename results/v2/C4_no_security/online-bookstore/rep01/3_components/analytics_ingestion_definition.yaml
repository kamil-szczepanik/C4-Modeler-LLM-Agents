level: component
scope: "Component diagram for the Analytics Ingestion container"
parentContainer:
  name: "Analytics Ingestion"
elements:
  - type: "component"
    name: "Ingestion API Handler"
    technology: "Go, HTTP/JSON"
    description: "Handles incoming HTTP/JSON clickstream requests."
  - type: "component"
    name: "Sanitization & Validation Middleware"
    technology: "Go"
    description: "Sanitizes and validates raw event payloads to enforce GDPR/CCPA compliance and prevent PII leakage."
  - type: "component"
    name: "Buffer & Retry Manager"
    technology: "Go, In-memory ring-buffer"
    description: "Manages in-memory ring-buffer and channels to offload validated events during throttling and execute exponential backoff."
  - type: "component"
    name: "Kinesis Producer Client"
    technology: "Go, AWS SDK for Go"
    description: "Publishes event streams to Amazon Kinesis using the AWS SDK."
  - type: "component"
    name: "Amazon Kinesis"
    technology: "AWS Streaming Service"
    description: "Receives real-time event streaming and clickstream processing data."
  - type: "component"
    name: "AWS SQS"
    technology: "AWS SQS"
    description: "Acts as a dead-letter queue fallback to store overflow events during prolonged outages."
relationships:
  - source: "API Management"
    destination: "Ingestion API Handler"
    description: "Forwards clickstream requests [HTTPS/JSON]"
  - source: "Ingestion API Handler"
    destination: "Sanitization & Validation Middleware"
    description: "Passes raw event payloads [In-memory Go structs]"
  - source: "Sanitization & Validation Middleware"
    destination: "Buffer & Retry Manager"
    description: "Offloads validated events during throttling [In-memory Go channels]"
  - source: "Buffer & Retry Manager"
    destination: "Amazon Kinesis"
    description: "Publishes event streams with exponential backoff [AWS Kinesis API over HTTPS/TCP]"
  - source: "Buffer & Retry Manager"
    destination: "AWS SQS"
    description: "Stores overflow events during prolonged outages [AWS SQS API over HTTPS]"