level: component
scope: "Component diagram for the Catalog & Search container"
parentContainer:
  name: "Catalog & Search"
elements:
  - type: "component"
    name: "Search Controller & Facade"
    technology: "Spring MVC"
    description: "Handling REST search requests."
  - type: "component"
    name: "Catalog Management Service"
    technology: "Spring Boot"
    description: "Admin service for CRUD book metadata operations."
  - type: "component"
    name: "Index Synchronization Worker"
    technology: "Spring Batch / Event Listener"
    description: "Processing async updates."
  - type: "component"
    name: "OpenSearch Client Repository"
    technology: "Java Library"
    description: "Repository interacting with search indexes."
  - type: "component"
    name: "Circuit Breaker & Fallback Manager"
    technology: "Resilience4j"
    description: "Resilience component for graceful degradation."
  - type: "component"
    name: "Amazon OpenSearch"
    technology: "Amazon OpenSearch"
    description: "Managed search engine for catalog indexing."
  - type: "component"
    name: "Amazon RDS (PostgreSQL)"
    technology: "PostgreSQL"
    description: "Relational database for transactional records."
  - type: "component"
    name: "AWS EventBridge & SQS"
    technology: "AWS EventBridge & SQS"
    description: "Event bus and message queue with DLQ support."
relationships:
  - source: "Search Controller & Facade"
    destination: "Amazon OpenSearch"
    description: "Queries search indices over HTTPS."
  - source: "Catalog Management Service"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Persists transactional data via TLS-encrypted JDBC/TCP."
  - source: "AWS EventBridge & SQS"
    destination: "Index Synchronization Worker"
    description: "Delivers domain events via AWS SQS using JSON over HTTPS."
  - source: "Index Synchronization Worker"
    destination: "Amazon OpenSearch"
    description: "Applies document upserts using the OpenSearch REST Client over HTTPS."