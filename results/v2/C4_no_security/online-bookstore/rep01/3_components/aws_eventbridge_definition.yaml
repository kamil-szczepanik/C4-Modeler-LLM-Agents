level: component
scope: "Component diagram for the AWS EventBridge container"
parentContainer:
  name: "AWS EventBridge"
elements:
  - type: "component"
    name: "Default & Custom Event Buses"
    technology: "AWS EventBridge"
    description: "Receives and routes domain events across the system."
  - type: "component"
    name: "Event Rules"
    technology: "EventBridge Rules"
    description: "Evaluates incoming events and routes them to appropriate targets."
  - type: "component"
    name: "Input Transformers"
    technology: "EventBridge Transformers"
    description: "Transforms event payloads before they are dispatched to targets."
  - type: "component"
    name: "API Destinations"
    technology: "EventBridge API Destinations"
    description: "Dispatches external shipping events via HTTPS with connection throttling."
relationships:
  - source: "Default & Custom Event Buses"
    destination: "Event Rules"
    description: "Evaluates events against"
  - source: "Event Rules"
    destination: "Input Transformers"
    description: "Transforms payloads for"
  - source: "Event Rules"
    destination: "API Destinations"
    description: "Dispatches external shipping events via"