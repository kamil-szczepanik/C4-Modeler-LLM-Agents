level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Guest Shopper"
    description: "An unauthenticated user browsing the catalogue and interacting with the bookstore."
  - type: "person"
    name: "Registered Customer"
    description: "An authenticated user performing secure checkout, managing carts, and purchasing books."
  - type: "person"
    name: "Store Administrator"
    description: "An administrator managing inventory and moderation via the Admin Portal."
  - type: "person"
    name: "Customer Support Agent"
    description: "An agent assisting customers with support requests."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system handling secure synchronous payments with Circuit Breaker and TLS 1.3."
  - type: "externalSystem"
    name: "Shipping Provider API"
    description: "External system handling order shipments via asynchronous event-driven messaging."
  - type: "externalSystem"
    name: "Tax/Compliance Service"
    description: "External system ensuring GDPR, CCPA, and multi-currency compliance."
  - type: "externalSystem"
    name: "AWS Route 53"
    description: "Infrastructure container providing global DNS health-checking and latency-based routing."
  - type: "externalSystem"
    name: "AWS SQS/EventBridge"
    description: "Infrastructure container handling asynchronous event-driven messaging and decoupling."
  - type: "externalSystem"
    name: "Amazon DynamoDB"
    description: "Infrastructure container for session/cart state, idempotency storage, and safe transaction retries."
  - type: "container"
    name: "Frontend Container"
    technology: "React, TypeScript, Amazon CloudFront, S3"
    description: "Single-Page Application (SPA) for fast global content delivery and user interaction."
  - type: "container"
    name: "API Management"
    technology: "Amazon API Gateway"
    description: "Manages ingress, JSON routing, rate limiting, and JWT validation."
  - type: "container"
    name: "Catalog & Search"
    technology: "Java, Spring Boot, Amazon OpenSearch"
    description: "Handles book catalog management and fast search capabilities."
  - type: "container"
    name: "Checkout & Order"
    technology: "Node.js, Amazon RDS (PostgreSQL)"
    description: "Handles secure checkout, orders, and transactional data."
  - type: "container"
    name: "Recommendation"
    technology: "Python, FastAPI"
    description: "Provides personalized recommendations for users."
  - type: "container"
    name: "Analytics Ingestion"
    technology: "Go, Amazon Kinesis"
    description: "Performs real-time clickstream streaming and analytics ingestion."
  - type: "container"
    name: "Notification"
    technology: "Asynchronous messaging"
    description: "Handles asynchronous user notifications."
  - type: "container"
    name: "Amazon RDS (PostgreSQL)"
    technology: "PostgreSQL"
    description: "Transactional database for core services."
  - type: "container"
    name: "AWS SQS"
    technology: "Amazon SQS"
    description: "Asynchronous messaging queue for inter-container communication."
  - type: "container"
    name: "AWS EventBridge"
    technology: "Amazon EventBridge"
    description: "Event bus for asynchronous inter-container communication."
relationships:
  - source: "Guest Shopper"
    destination: "Frontend Container"
    description: "Browses catalogue and interacts with the application."
    technology: "HTTPS"
  - source: "Registered Customer"
    destination: "Frontend Container"
    description: "Performs secure checkout, manages carts, and purchases books."
    technology: "HTTPS"
  - source: "Store Administrator"
    destination: "Frontend Container"
    description: "Manages inventory and moderation."
    technology: "HTTPS"
  - source: "Customer Support Agent"
    destination: "Frontend Container"
    description: "Assists customers with support requests."
    technology: "HTTPS"
  - source: "Frontend Container"
    destination: "API Management"
    description: "Sends API requests for data and actions."
    technology: "HTTPS / REST & GraphQL"
  - source: "API Management"
    destination: "Catalog & Search"
    description: "Routes catalog and search requests with rate limiting and JWT validation."
    technology: "HTTPS / JSON"
  - source: "API Management"
    destination: "Checkout & Order"
    description: "Routes checkout and order requests with rate limiting and JWT validation."
    technology: "HTTPS / JSON"
  - source: "API Management"
    destination: "Recommendation"
    description: "Routes recommendation requests with rate limiting and JWT validation."
    technology: "HTTPS / JSON"
  - source: "API Management"
    destination: "Analytics Ingestion"
    description: "Streams clickstream data."
    technology: "Amazon Kinesis"
  - source: "Catalog & Search"
    destination: "AWS SQS"
    description: "Publishes and consumes asynchronous messages."
    technology: "AWS SQS"
  - source: "Catalog & Search"
    destination: "AWS EventBridge"
    description: "Publishes and consumes events."
    technology: "AWS EventBridge"
  - source: "Checkout & Order"
    destination: "AWS SQS"
    description: "Publishes and consumes asynchronous messages."
    technology: "AWS SQS"
  - source: "Checkout & Order"
    destination: "AWS EventBridge"
    description: "Publishes and consumes events."
    technology: "AWS EventBridge"
  - source: "Recommendation"
    destination: "AWS SQS"
    description: "Publishes and consumes asynchronous messages."
    technology: "AWS SQS"
  - source: "Recommendation"
    destination: "AWS EventBridge"
    description: "Publishes and consumes events."
    technology: "AWS EventBridge"
  - source: "Catalog & Search"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Stores and retrieves transactional data."
    technology: "TLS-encrypted JDBC/TCP"
  - source: "Checkout & Order"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Stores and retrieves transactional data."
    technology: "TLS-encrypted JDBC/TCP"
  - source: "Checkout & Order"
    destination: "Amazon DynamoDB"
    description: "Stores session and cart state."
    technology: "TCP"
  - source: "Checkout & Order"
    destination: "Payment Gateway"
    description: "Processes secure payments."
    technology: "HTTPS / REST"
  - source: "Checkout & Order"
    destination: "Shipping Provider API"
    description: "Dispatches shipping orders via asynchronous messaging."
    technology: "AWS SQS/EventBridge"
  - source: "Checkout & Order"
    destination: "Tax/Compliance Service"
    description: "Validates tax and compliance requirements."
    technology: "AWS SQS/EventBridge"