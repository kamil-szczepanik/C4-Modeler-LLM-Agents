level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore Platform"
  description: "A cloud-native, multi-region e-commerce platform enabling customers to browse catalogues, securely purchase books, and access personalized recommendations and reviews."
elements:
  - type: "person"
    name: "Customers (Shoppers)"
    description: "End users who browse catalogues, purchase physical and electronic books, and access personalized recommendations and reviews."
  - type: "person"
    name: "Store Staff & Administrators"
    description: "Internal staff who manage the bookstore platform, catalogues, and operations."
  - type: "person"
    name: "Customer Support Representatives"
    description: "Support staff who assist customers with inquiries, orders, and platform issues."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system handling secure multi-currency transactions."
  - type: "externalSystem"
    name: "Third-Party Shipping Provider"
    description: "External system handling logistics and fulfillment."
  - type: "externalSystem"
    name: "Tax & Currency Provider"
    description: "External system providing tax rates and exchange rates."
relationships:
  - source: "Customers (Shoppers)"
    destination: "Online Bookstore Platform"
    description: "Interact with the platform to browse, purchase, and review books"
    technology: "HTTPS (TLS 1.3)"
  - source: "Store Staff & Administrators"
    destination: "Online Bookstore Platform"
    description: "Manage platform operations and administration"
    technology: "HTTPS (TLS 1.3)"
  - source: "Customer Support Representatives"
    destination: "Online Bookstore Platform"
    description: "Provide customer support and manage support workflows"
    technology: "HTTPS (TLS 1.3)"
  - source: "Online Bookstore Platform"
    destination: "Payment Gateway"
    description: "Integrates for multi-currency transactions"
    technology: "HTTPS / REST APIs"
  - source: "Online Bookstore Platform"
    destination: "Third-Party Shipping Provider"
    description: "Connects for logistics and fulfillment"
    technology: "HTTPS / REST or SOAP APIs"
  - source: "Online Bookstore Platform"
    destination: "Tax & Currency Provider"
    description: "Queries for exchange rates and tax information with caching and circuit breakers"
    technology: "HTTPS / REST APIs"