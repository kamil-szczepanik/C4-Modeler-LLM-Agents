level: container
scope: "Container diagram for Online Bookstore Platform"
system:
  name: "Online Bookstore Platform"
elements:
  - type: "person"
    name: "Casual Shoppers"
    description: "End users who browse catalogues and purchase physical and electronic books."
  - type: "person"
    name: "Book Enthusiasts"
    description: "Engaged users who leave reviews, read content, and look for recommendations."
  - type: "person"
    name: "Store Administrators"
    description: "Internal staff who manage the platform, catalogues, and operations via the back-office."
  - type: "person"
    name: "Customer Support"
    description: "Support staff who assist customers with inquiries and orders."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system handling secure multi-currency transactions."
  - type: "externalSystem"
    name: "Third-Party Shipping Provider"
    description: "External system handling logistics and fulfillment."
  - type: "externalSystem"
    name: "Tax & Currency Provider"
    description: "External system providing tax rates and exchange rates."
  - type: "container"
    name: "Frontend Container"
    technology: "React, Amazon CloudFront, Amazon S3"
    description: "Single Page Application served to users for browsing and interacting with the store."
  - type: "container"
    name: "API Gateway"
    technology: "Amazon API Gateway"
    description: "Provides REST/GraphQL entry points, rate limiting, and JWT validation."
  - type: "container"
    name: "Catalog & Search"
    technology: "Spring Boot, Amazon OpenSearch"
    description: "Manages book catalogs and provides search capabilities."
  - type: "container"
    name: "Order & Checkout"
    technology: "Spring Boot"
    description: "Handles transaction integrity, orders, and integration with shipping and payment providers."
  - type: "container"
    name: "Recommendation"
    technology: "Spring Boot / Python"
    description: "Provides personalized book recommendations to users."
  - type: "container"
    name: "Localization & Tax"
    technology: "Spring Boot"
    description: "Manages multi-currency support, localization, and tax computations."
  - type: "container"
    name: "Content & Review"
    technology: "Node.js, Amazon DocumentDB"
    description: "Manages content, book reviews, and user feedback."
  - type: "container"
    name: "Admin Back-Office"
    technology: "Spring Boot / React"
    description: "Provides administrative interfaces for store managers and support."
relationships:
  - source: "Casual Shoppers"
    destination: "Frontend Container"
    description: "Interacts with the SPA via HTTPS to browse and shop"
    technology: "HTTPS"
  - source: "Book Enthusiasts"
    destination: "Frontend Container"
    description: "Interacts with the SPA to read and write reviews and view recommendations"
    technology: "HTTPS"
  - source: "Store Administrators"
    destination: "Frontend Container"
    description: "Manages platform administration and catalogues"
    technology: "HTTPS"
  - source: "Customer Support"
    destination: "Frontend Container"
    description: "Accesses back-office tools to assist customers"
    technology: "HTTPS"
  - source: "Frontend Container"
    destination: "API Gateway"
    description: "Calls API endpoints for data and operations"
    technology: "HTTPS / REST / GraphQL"
  - source: "API Gateway"
    destination: "Catalog & Search"
    description: "Routes internal traffic via VPC links"
    technology: "gRPC"
  - source: "API Gateway"
    destination: "Order & Checkout"
    description: "Routes internal traffic via VPC links"
    technology: "gRPC"
  - source: "API Gateway"
    destination: "Recommendation"
    description: "Routes internal traffic via VPC links"
    technology: "gRPC"
  - source: "API Gateway"
    destination: "Localization & Tax"
    description: "Routes internal traffic via VPC links"
    technology: "gRPC"
  - source: "API Gateway"
    destination: "Content & Review"
    description: "Routes internal traffic via VPC links"
    technology: "gRPC"
  - source: "API Gateway"
    destination: "Admin Back-Office"
    description: "Routes internal traffic via VPC links"
    technology: "gRPC"
  - source: "Order & Checkout"
    destination: "Payment Gateway"
    description: "Integrates for payment processing"
    technology: "HTTPS"
  - source: "Order & Checkout"
    destination: "Third-Party Shipping Provider"
    description: "Integrates for logistics and fulfillment"
    technology: "HTTPS"
  - source: "Localization & Tax"
    destination: "Tax & Currency Provider"
    description: "Queries for exchange rates and tax info"
    technology: "HTTPS"