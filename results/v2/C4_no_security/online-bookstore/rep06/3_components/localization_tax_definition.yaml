level: component
scope: "Component diagram for the Localization & Tax container"
parentContainer:
  name: "Localization & Tax"
elements:
  - type: "component"
    name: "LocalizationController"
    technology: "Spring MVC RestController, gRPC"
    description: "Exposes gRPC endpoints for internal communication and routes requests."
  - type: "component"
    name: "TaxRuleResolver"
    technology: "Spring Component"
    description: "Encapsulates regional tax classifications and B2B exemptions."
  - type: "component"
    name: "TaxCalculationEngine"
    technology: "Spring Component, Resilience4j"
    description: "Manages external tax queries and Resilience4j circuit breakers."
  - type: "component"
    name: "CurrencyConverter"
    technology: "Spring Component"
    description: "Handles multi-currency conversion with hourly refresh."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache (Redis)"
    description: "Regional distributed cache for exchange rates and tax jurisdictions."
  - type: "component"
    name: "Tax & Currency Provider"
    technology: "External API"
    description: "External API for real-time exchange rates and tax rates."
relationships:
  - source: "API Gateway"
    destination: "LocalizationController"
    description: "Routes internal traffic via VPC links [gRPC]"
  - source: "LocalizationController"
    destination: "TaxRuleResolver"
    description: "Executes internal logic [In-process Java method calls]"
  - source: "TaxRuleResolver"
    destination: "TaxCalculationEngine"
    description: "Executes internal logic [In-process Java method calls]"
  - source: "TaxCalculationEngine"
    destination: "Tax & Currency Provider"
    description: "Queries exchange rates and tax info [HTTPS]"
  - source: "TaxCalculationEngine"
    destination: "Amazon S3"
    description: "Streams scrubbed audit logs [AWS Kinesis Firehose]"