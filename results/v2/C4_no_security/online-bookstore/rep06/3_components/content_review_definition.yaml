level: component
scope: "Component diagram for the Content & Review container"
parentContainer:
  name: "Content & Review"
elements:
  - type: "component"
    name: "Content & Review Container"
    technology: "Node.js, Express.js"
    description: "Manages customer ratings and reviews, processing high-throughput read operations and supporting moderation."
  - type: "component"
    name: "Customers (Shoppers)"
    technology: "External User"
    description: "Browses and submits reviews."
  - type: "component"
    name: "Store Staff & Administrators"
    technology: "External User"
    description: "Manages content compliance."
  - type: "component"
    name: "Amazon API Gateway"
    technology: "AWS API Gateway"
    description: "Routes internal traffic via VPC links."
  - type: "component"
    name: "Amazon DocumentDB"
    technology: "Amazon DocumentDB (MongoDB wire protocol)"
    description: "Persists and retrieves reviews."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Redis Protocol"
    description: "Caches reviews and metadata."
  - type: "component"
    name: "Amazon SQS"
    technology: "AWS SQS with Dead Letter Queue"
    description: "Publishes review payloads for async moderation."
  - type: "component"
    name: "AWS Comprehend"
    technology: "AWS SDK / HTTPS"
    description: "Analyzes text toxicity and sentiment."
  - type: "component"
    name: "Admin Back-Office"
    technology: "External Container"
    description: "Administrative interface for back-office operations."
relationships:
  - source: "Amazon API Gateway"
    destination: "Content & Review Container"
    description: "Routes internal traffic via VPC links [gRPC]"
  - source: "Content & Review Container"
    destination: "Amazon ElastiCache (Redis)"
    description: "Reads cached reviews and metadata [Redis Protocol]"
  - source: "Content & Review Container"
    destination: "Amazon DocumentDB"
    description: "Persists and retrieves reviews [MongoDB wire protocol via TLS]"
  - source: "Content & Review Container"
    destination: "Amazon SQS"
    description: "Publishes review payloads for async moderation [AWS SDK / HTTPS]"
  - source: "Content & Review Container"
    destination: "AWS Comprehend"
    description: "Analyzes text toxicity and sentiment [AWS SDK / HTTPS]"