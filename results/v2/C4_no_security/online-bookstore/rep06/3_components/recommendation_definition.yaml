level: component
scope: "Component diagram for the Recommendation container"
parentContainer:
  name: "Recommendation"
elements:
  - type: "component"
    name: "Recommendation API Controller"
    technology: "Spring Boot"
    description: "Handles incoming recommendation requests and serves pre-computed suggestions."
  - type: "component"
    name: "Algorithm Engine"
    technology: "Python / AWS ECS / SageMaker"
    description: "Executes offline collaborative filtering and co-purchase analysis via scheduled batch machine learning jobs."
  - type: "component"
    name: "Telemetry Publisher Component"
    technology: "Spring Boot"
    description: "Dispatches interaction events and emits anonymous usage telemetry."
relationships:
  - source: "Recommendation API Controller"
    destination: "Model Data Store"
    description: "Fetches pre-computed recommendations [Redis Protocol]"
  - source: "Recommendation API Controller"
    destination: "Telemetry Publisher Component"
    description: "Dispatches interaction events [In-process async]"
  - source: "Telemetry Publisher Component"
    destination: "Amazon Kinesis"
    description: "Emits anonymous usage telemetry [HTTPS]"
  - source: "Algorithm Engine"
    destination: "Model Data Store"
    description: "Writes pre-computed co-purchase matrices [Redis Protocol]"
  - source: "Catalog & Search"
    destination: "Recommendation Container"
    description: "Syncs product metadata asynchronously [Amazon SQS]"