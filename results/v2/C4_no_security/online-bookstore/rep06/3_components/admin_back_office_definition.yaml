level: component
scope: "Component diagram for the Admin Back-Office container"
parentContainer:
  name: "Admin Back-Office"
elements:
  - type: "component"
    name: "Admin UI"
    technology: "React, Amazon S3, Amazon CloudFront"
    description: "Delivers the internal management single-page application for administrative and customer support tools."
  - type: "component"
    name: "Auth & RBAC Controller"
    technology: "Spring Security, OAuth2/OIDC"
    description: "Enforces granular role-based access control and secure authentication."
  - type: "component"
    name: "Operations & Support API"
    technology: "Spring Boot"
    description: "Provides scalable microservice logic for customer support and operational tooling."
  - type: "component"
    name: "Catalog Management Component"
    technology: "Spring Boot"
    description: "Handles catalog operations and offloads bulk updates."
  - type: "component"
    name: "Dispute & Refund Component"
    technology: "Spring Boot"
    description: "Manages disputes and refund workflows securely."
  - type: "component"
    name: "Audit Logger"
    technology: "Spring AOP, Amazon CloudWatch, Amazon S3 Object Lock"
    description: "Records security and audit events to ensure compliance and WORM storage."
  - type: "component"
    name: "Asynchronous Processing Queue"
    technology: "Amazon SQS"
    description: "Enables asynchronous processing for bulk catalog updates."
relationships:
  - source: "Admin UI"
    destination: "Auth & RBAC Controller"
    description: "Communicates via REST over HTTPS through Amazon API Gateway VPC links"
  - source: "Admin UI"
    destination: "Operations & Support API"
    description: "Communicates via REST over HTTPS through Amazon API Gateway VPC links"
  - source: "Admin UI"
    destination: "Catalog Management Component"
    description: "Communicates via REST over HTTPS through Amazon API Gateway VPC links"
  - source: "Operations & Support API"
    destination: "Dispute & Refund Component"
    description: "Coordinates administrative workflows"
  - source: "Catalog Management Component"
    destination: "Asynchronous Processing Queue"
    description: "Offloads bulk operations to"
  - source: "Operations & Support API"
    destination: "Audit Logger"
    description: "Sends audit events to"
  - source: "Catalog Management Component"
    destination: "Audit Logger"
    description: "Sends audit events to"