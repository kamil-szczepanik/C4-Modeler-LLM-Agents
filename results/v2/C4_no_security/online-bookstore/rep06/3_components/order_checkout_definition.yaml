level: component
scope: "Component diagram for the Order & Checkout container"
parentContainer:
  name: "Order & Checkout"
elements:
  - type: "component"
    name: "Checkout Orchestrator"
    technology: "Spring Boot / Spring State Machine"
    description: "Manages complex saga workflows, calculates totals, and coordinates payments and idempotency."
  - type: "component"
    name: "Order Management"
    technology: "Spring Data JPA"
    description: "Handles ACID-compliant order state persistence and fulfillment workflows."
  - type: "component"
    name: "Payment Integration"
    technology: "Java / HTTPS"
    description: "Processes secure transactions with external payment gateways."
  - type: "component"
    name: "Event Publisher"
    technology: "AWS SDK"
    description: "Emits domain events such as OrderPlaced to messaging infrastructure."
  - type: "component"
    name: "Order Modification"
    technology: "Spring Boot"
    description: "Handles updates and modifications to existing orders."
  - type: "component"
    name: "Idempotency Manager"
    technology: "Amazon ElastiCache (Redis)"
    description: "Tracks transaction states and request keys to prevent double-charging."
relationships:
  - source: "Checkout Orchestrator"
    destination: "Localization & Tax"
    description: "Calculates local taxes and totals [gRPC]"
  - source: "Checkout Orchestrator"
    destination: "Payment Integration"
    description: "Processes secure transactions [Internal REST/gRPC]"
  - source: "Checkout Orchestrator"
    destination: "Idempotency Manager"
    description: "Tracks transaction states and request keys [Redis Protocol]"
  - source: "Payment Integration"
    destination: "Payment Gateway"
    description: "Executes payment processing [HTTPS]"
  - source: "Order & Checkout"
    destination: "Third-Party Shipping Provider"
    description: "Handles logistics and fulfillment [HTTPS]"
  - source: "Event Publisher"
    destination: "Amazon SQS/SNS"
    description: "Emits domain events (OrderPlaced) [AWS SDK]"