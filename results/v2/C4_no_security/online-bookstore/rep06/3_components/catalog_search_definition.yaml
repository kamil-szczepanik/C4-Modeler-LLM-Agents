level: component
scope: "Component diagram for the Catalog & Search container"
parentContainer:
  name: "Catalog & Search"
elements:
  - type: "component"
    name: "Search Controller & Facade"
    technology: "Spring Boot"
    description: "Handles high-performance product discovery and faceted filtering requests."
  - type: "component"
    name: "Catalog Management Service"
    technology: "Spring Boot"
    description: "Manages catalog metadata and persists the source of truth."
  - type: "component"
    name: "Sync Worker"
    technology: "Spring Boot / AWS Lambda"
    description: "Synchronizes catalog mutations and updates search indices."
  - type: "component"
    name: "Search Analytics Collector"
    technology: "Spring Boot"
    description: "Collects and dispatches telemetry and metrics for search usage."
relationships:
  - source: "Catalog Management Service"
    destination: "Sync Worker"
    description: "Publishes mutations via [Amazon EventBridge (JSON)]"
  - source: "Sync Worker"
    destination: "Search Controller & Facade"
    description: "Updates indices via [HTTPS / REST]"
  - source: "Search Controller & Facade"
    destination: "Search Analytics Collector"
    description: "Dispatches telemetry via [Spring ApplicationEvent]"