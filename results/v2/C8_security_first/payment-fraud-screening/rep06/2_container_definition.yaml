level: container
scope: "Container diagram for Fraud Screening Engine"
system:
  name: "Fraud Screening Engine"
elements:
  - type: "person"
    name: "Merchant / Payment Gateway"
    description: "Upstream client system sending payment authorizations."
  - type: "person"
    name: "Fraud Analyst"
    description: "Internal user managing reviews and rules."
  - type: "person"
    name: "Merchant Risk Manager"
    description: "Internal user managing risk configuration and rules."
  - type: "person"
    name: "Compliance Auditor"
    description: "Internal user reviewing compliance and tamper-evident audit logs."
  - type: "externalSystem"
    name: "Card Schemes / External Enrichment APIs"
    description: "External risk data sources fetching auxiliary risk signals."
  - type: "externalSystem"
    name: "AWS QLDB / S3 Object Lock"
    description: "Tamper-evident audit archive for WORM-compliant storage."
  - type: "container"
    name: "API Gateway / Tokenization Proxy"
    technology: "Envoy / AWS API Gateway"
    description: "Handles incoming authorization requests and tokenization securely."
  - type: "container"
    name: "Real-Time Scoring Engine"
    technology: "Go / AWS ECS on Fargate, Redis"
    description: "Executes real-time fraud scoring and risk evaluation within strict latency constraints."
  - type: "container"
    name: "Case Management API"
    technology: "Node.js / Java Spring Boot"
    description: "Manages suspicious payment reviews, fraud analyst workflows, and case investigation data."
  - type: "container"
    name: "Audit Log Sitter"
    technology: "Rust"
    description: "Collects and securely routes audit logs to immutable storage."
  - type: "container"
    name: "Rule & Model Distribution Service"
    technology: "Python / FastAPI + S3"
    description: "Distributes fraud detection models and rule updates to scoring engines."
  - type: "container"
    name: "Event Broker"
    technology: "AWS MSK / Managed Kafka or AWS SQS"
    description: "Decouples asynchronous events between system services."
relationships:
  - source: "Merchant / Payment Gateway"
    destination: "API Gateway / Tokenization Proxy"
    description: "Sends payment authorizations"
    technology: "HTTPS (TLS 1.3)"
  - source: "API Gateway / Tokenization Proxy"
    destination: "Real-Time Scoring Engine"
    description: "Routes requests for scoring"
    technology: "gRPC over AWS VPC private subnets with native TLS"
  - source: "Real-Time Scoring Engine"
    destination: "Event Broker"
    description: "Publishes scoring events and telemetry"
    technology: "TCP/TLS"
  - source: "Event Broker"
    destination: "Audit Log Sitter"
    description: "Streams events for audit logging"
    technology: "TCP/TLS"
  - source: "Event Broker"
    destination: "Case Management API"
    description: "Streams events for case creation and review"
    technology: "TCP/TLS"
  - source: "Fraud Analyst"
    destination: "Case Management API"
    description: "Accesses case management workflows"
    technology: "HTTPS (OAuth2/OIDC, MFA)"
  - source: "Compliance Auditor"
    destination: "Case Management API"
    description: "Accesses audit and compliance records"
    technology: "HTTPS (OAuth2/OIDC, MFA)"