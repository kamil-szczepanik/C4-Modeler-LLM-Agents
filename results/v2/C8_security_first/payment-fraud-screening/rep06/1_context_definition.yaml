level: context
scope: "System Context diagram for Real-time Payment Fraud Screening System"
system:
  name: "Fraud Screening Engine"
  description: "Real-time payment fraud screening system for card-not-present transactions on AWS, ensuring strict PCI-DSS compliance."
elements:
  - type: "person"
    name: "Merchant / Payment Gateway"
    description: "Upstream client system sending payment authorizations."
  - type: "person"
    name: "Fraud Analyst"
    description: "Internal user managing reviews and rules."
  - type: "externalSystem"
    name: "Card Schemes / External Enrichment APIs"
    description: "External risk data sources fetching auxiliary risk signals."
  - type: "externalSystem"
    name: "AWS QLDB / S3 Object Lock"
    description: "Tamper-evident audit archive for WORM-compliant storage."
relationships:
  - source: "Merchant / Payment Gateway"
    destination: "Fraud Screening Engine"
    description: "Sends payment authorizations"
    technology: "HTTPS/JSON over TLS 1.3 / mTLS"
  - source: "Fraud Analyst"
    destination: "Fraud Screening Engine"
    description: "Accesses case management"
    technology: "HTTPS with RBAC and MFA"
  - source: "Fraud Screening Engine"
    destination: "Card Schemes / External Enrichment APIs"
    description: "Fetches auxiliary risk signals"
    technology: "HTTPS"
  - source: "Fraud Screening Engine"
    destination: "AWS QLDB / S3 Object Lock"
    description: "Asynchronously writes audit logs and decision metadata"
    technology: "AWS SDK / API"