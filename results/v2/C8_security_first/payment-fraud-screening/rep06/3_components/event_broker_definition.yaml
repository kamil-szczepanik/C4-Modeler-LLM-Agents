level: component
scope: "Component diagram for the Event Broker container"
parentContainer:
  name: "Event Broker"
elements:
  - type: "component"
    name: "Topic Router & Partition Manager"
    technology: "AWS MSK / Kafka Partition Manager"
    description: "Manages topic creation, partition assignment, and high-throughput routing using hashed card ID keys."
  - type: "component"
    name: "Access Control & Auth Enforcer"
    technology: "mTLS, Kafka ACLs, AWS Secrets Manager"
    description: "Validates mutual TLS (mTLS) certificates and enforces Kafka ACLs to isolate the audit-log topic."
  - type: "component"
    name: "Storage & Replication Engine"
    technology: "AWS MSK 3-AZ Storage, AWS KMS CMK"
    description: "Handles 3-AZ log replication and encrypted-at-rest persistence via AWS KMS CMKs."
relationships:
  - source: "Real-Time Scoring Engine"
    destination: "Topic Router & Partition Manager"
    description: "Publishes authorization events and telemetry [TCP/TLS 1.3, Kafka Protocol]"
  - source: "Topic Router & Partition Manager"
    destination: "Audit Log Sitter"
    description: "Streams audit events via dedicated consumer group [TCP/TLS 1.3, Kafka Protocol]"
  - source: "Topic Router & Partition Manager"
    destination: "Case Management API"
    description: "Streams events for case creation [TCP/TLS 1.3, Kafka Protocol]"
  - source: "Access Control & Auth Enforcer"
    destination: "AWS Secrets Manager"
    description: "Validates mTLS certificates and credentials [HTTPS/TLS 1.3]"
  - source: "Storage & Replication Engine"
    destination: "S3 Object Lock Bucket"
    description: "Offloads tamper-evident audit streams asynchronously [AWS PrivateLink]"