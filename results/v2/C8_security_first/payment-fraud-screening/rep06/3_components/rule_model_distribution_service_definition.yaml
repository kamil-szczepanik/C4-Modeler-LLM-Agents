level: component
scope: "Component diagram for the Rule & Model Distribution Service container"
parentContainer:
  name: "Rule & Model Distribution Service"
elements:
  - type: "component"
    name: "Model Ingestion API"
    technology: "Python / FastAPI + Pydantic"
    description: "Handles model ingestion, validation, and dry-run execution for updates."
  - type: "component"
    name: "Distribution Publisher"
    technology: "AWS SQS"
    description: "Publishes update notifications and rule hashes to the scoring engines."
  - type: "component"
    name: "Artifact Storage Client"
    technology: "AWS S3"
    description: "Fetches and stores versioned rules and machine learning models securely."
relationships:
  - source: "Model Ingestion API"
    destination: "Artifact Storage Client"
    description: "Saves validated models and rules"
  - source: "Model Ingestion API"
    destination: "Distribution Publisher"
    description: "Triggers update notifications"