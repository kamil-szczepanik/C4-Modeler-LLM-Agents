level: component
scope: "Component diagram for the API Gateway / Tokenization Proxy container"
parentContainer:
  name: "API Gateway / Tokenization Proxy"
elements:
  - type: "component"
    name: "Edge Router Component"
    technology: "Envoy Proxy"
    description: "Manages incoming traffic routing and TLS termination at the edge."
  - type: "component"
    name: "Tokenization Filter Component"
    technology: "Native Envoy C++/Lua configuration with Format-Preserving Encryption"
    description: "Performs low-latency stateless PAN tokenization without expensive HSM round-trips."
  - type: "component"
    name: "Payload Sanitizer Component"
    technology: "Envoy Proxy filter"
    description: "Sanitizes and validates incoming payment authorization payloads."
relationships:
  - source: "Edge Router Component"
    destination: "Payload Sanitizer Component"
    description: "Forwards traffic for payload validation"
  - source: "Payload Sanitizer Component"
    destination: "Tokenization Filter Component"
    description: "Sends sanitized data for tokenization"