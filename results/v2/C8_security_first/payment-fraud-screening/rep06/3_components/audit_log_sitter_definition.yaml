level: component
scope: "Component diagram for the Audit Log Sitter container"
parentContainer:
  name: "Audit Log Sitter"
elements:
  - type: "component"
    name: "Kafka Consumer Component"
    technology: "Rust, rdkafka"
    description: "Consumes real-time payment audit events from AWS MSK."
  - type: "component"
    name: "Payload Normalizer & Signer Component"
    technology: "Rust, AWS KMS"
    description: "Normalizes audit payloads and cryptographically signs them using AWS KMS."
  - type: "component"
    name: "WORM Storage Batcher Component"
    technology: "Rust"
    description: "Batches normalized and signed payloads for persistent WORM storage."
  - type: "component"
    name: "Resilience & DLQ Router Component"
    technology: "Rust, In-memory channel"
    description: "Handles failed or poisoned payloads and routes them to a Dead-Letter Queue."
relationships:
  - source: "Kafka Consumer Component"
    destination: "Resilience & DLQ Router Component"
    description: "Passes failed/poisoned payloads [In-memory channel]"
  - source: "Payload Normalizer & Signer Component"
    destination: "WORM Storage Batcher Component"
    description: "Passes normalized signed payloads [In-memory channel]"