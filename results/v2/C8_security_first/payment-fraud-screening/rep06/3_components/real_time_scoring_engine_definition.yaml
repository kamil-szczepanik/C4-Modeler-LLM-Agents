level: component
scope: "Component diagram for the Real-Time Scoring Engine container"
parentContainer:
  name: "Real-Time Scoring Engine"
elements:
  - type: "component"
    name: "API Gateway / Tokenization Proxy"
    technology: "Envoy / AWS API Gateway"
    description: "Routes requests for scoring using gRPC over AWS VPC private subnets with mTLS."
  - type: "component"
    name: "Real-Time Scoring Engine"
    technology: "Go / AWS ECS on Fargate, Redis"
    description: "Evaluates card-not-present payment authorizations for fraud within strict latency constraints."
  - type: "component"
    name: "Rule & Model Distribution Service"
    technology: "Python / FastAPI + S3"
    description: "Delivers rules and models via S3 with cryptographic verification."
  - type: "component"
    name: "Event Broker"
    technology: "AWS MSK / Managed Kafka"
    description: "Publishes cryptographically signed scoring events using Kafka protocol over TLS with SASL/IAM."
  - type: "component"
    name: "Fraud Analyst"
    technology: "Human / Case Management Tools"
    description: "Reviews cases and manages fraud analysis workflows."
relationships:
  - source: "API Gateway / Tokenization Proxy"
    destination: "Real-Time Scoring Engine"
    description: "Routes requests for scoring using gRPC over AWS VPC private subnets with mTLS"
  - source: "Real-Time Scoring Engine"
    destination: "Redis Cluster"
    description: "Fetches sliding-window velocity counters using Redis RESP protocol over TLS"
  - source: "Real-Time Scoring Engine"
    destination: "Event Broker"
    description: "Publishes cryptographically signed scoring events using Kafka protocol over TLS with SASL/IAM"
  - source: "Rule & Model Distribution Service"
    destination: "Real-Time Scoring Engine"
    description: "Delivers rules and models via S3 with cryptographic verification"