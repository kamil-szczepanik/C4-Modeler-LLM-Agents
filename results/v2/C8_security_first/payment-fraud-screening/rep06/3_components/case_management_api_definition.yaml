# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Case Management API container"
parentContainer:
  name: "Case Management API"
elements:
  - type: "component"
    name: "Case Management Controller"
    technology: "Java 21 / Spring Boot 3.x"
    description: "Exposes HTTPS endpoints for Fraud Analysts and Compliance Auditors to access case management workflows, bulk actions, and metrics."
  - type: "component"
    name: "Case Service"
    technology: "Java 21 / Spring Boot 3.x"
    description: "Encapsulates business logic for case states, SLA tracking, and audit data management."
  - type: "component"
    name: "Batch Processor"
    technology: "Spring Batch"
    description: "Handles parallelized batch state transitions for bulk case operations."
  - type: "component"
    name: "Event Consumer"
    technology: "Java 21 / Spring Boot 3.x / Kafka Client"
    description: "Streams review events and case data from the Event Broker via mTLS."
  - type: "component"
    name: "Persistence Repository"
    technology: "Spring Data JPA / JDBC"
    description: "Persists case states, SLA tracking, and audit data to AWS RDS PostgreSQL via TLS 1.3."
  - type: "component"
    name: "Audit Dispatcher"
    technology: "Java 21 / Spring Boot 3.x"
    description: "Sends cryptographically signed action records to the Audit Log Sitter via TCP/TLS [mTLS]."
relationships:
  - source: "Case Management Controller"
    destination: "Case Service"
    description: "Invokes business logic and workflows"
  - source: "Case Service"
    destination: "Batch Processor"
    description: "Triggers parallelized bulk actions"
  - source: "Event Consumer"
    destination: "Case Service"
    description: "Updates case data from streamed events"
  - source: "Case Service"
    destination: "Persistence Repository"
    description: "Persists case states and SLA data"
  - source: "Case Service"
    destination: "Audit Dispatcher"
    description: "Dispatches action records for audit logging"