level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Operations Analysts & Risk Managers"
    description: "Human actors reviewing suspicious transactions, updating rules, and managing cases."
  - type: "externalSystem"
    name: "Payment Gateway / Merchant Systems"
    description: "External actors sending authorization requests."
  - type: "externalSystem"
    name: "Model Registry / Feature Store"
    description: "Repository supplying ML models and features."
  - type: "container"
    name: "AWS Application Load Balancer (ALB) / Ingress Router"
    technology: "AWS ALB"
    description: "Routes incoming payment gateway and analyst traffic securely."
  - type: "container"
    name: "Scoring Engine Container (Rust)"
    technology: "Rust, Axum, Tokio"
    description: "Powers high-throughput, sub-50ms fraud score evaluations."
  - type: "container"
    name: "Case Management Container (Python / FastAPI)"
    technology: "Python, FastAPI"
    description: "Provides secure case management and analyst workflow tools."
  - type: "container"
    name: "Audit Logger Sidecar Container"
    technology: "Container Sidecar"
    description: "Handles internal message passing and forwards audit logs."
  - type: "container"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache (Redis)"
    description: "Provides low-latency feature store lookups."
  - type: "container"
    name: "Amazon Aurora Serverless v2"
    technology: "Amazon Aurora Serverless v2, SQL/TLS"
    description: "Automatically scales relational database resources for analyst workflows."
  - type: "container"
    name: "Amazon S3 with Object Lock"
    technology: "Amazon S3 with Object Lock (Compliance Mode)"
    description: "Enforces tamper-evident, 7-year retention compliance audits."
relationships:
  - source: "Payment Gateway / Merchant Systems"
    destination: "AWS Application Load Balancer (ALB) / Ingress Router"
    description: "Sends authorization requests"
    technology: "HTTPS (TLS 1.3, HMAC-SHA256, mTLS)"
  - source: "Fraud Operations Analysts & Risk Managers"
    destination: "AWS Application Load Balancer (ALB) / Ingress Router"
    description: "Accesses case management workflows"
    technology: "HTTPS (OAuth 2.0 / OIDC, RBAC, MFA)"
  - source: "AWS Application Load Balancer (ALB) / Ingress Router"
    destination: "Scoring Engine Container (Rust)"
    description: "Routes real-time scoring requests"
    technology: "HTTP/REST or gRPC"
  - source: "AWS Application Load Balancer (ALB) / Ingress Router"
    destination: "Case Management Container (Python / FastAPI)"
    description: "Routes analyst traffic"
    technology: "HTTPS"
  - source: "Scoring Engine Container (Rust)"
    destination: "Amazon ElastiCache (Redis)"
    description: "Performs feature store lookups"
    technology: "gRPC / TCP"
  - source: "Scoring Engine Container (Rust)"
    destination: "Audit Logger Sidecar Container"
    description: "Sends audit logs via internal message passing"
    technology: "Internal Message Passing"
  - source: "Audit Logger Sidecar Container"
    destination: "Amazon S3 with Object Lock"
    description: "Stores tamper-evident audit logs"
    technology: "AWS SDK (HTTPS)"
  - source: "Case Management Container (Python / FastAPI)"
    destination: "Amazon Aurora Serverless v2"
    description: "Queries and updates case data"
    technology: "SQL/TLS"