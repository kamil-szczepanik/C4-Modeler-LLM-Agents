level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Evaluates card-not-present payment authorizations for fraud at 3,000 TPS, providing real-time approve/decline/review decisions and case management for analysts."
elements:
  - type: "person"
    name: "Fraud Operations Analysts & Risk Managers"
    description: "Human actors reviewing suspicious transactions, updating rules, and managing cases."
  - type: "externalSystem"
    name: "Payment Gateway / Merchant Systems"
    description: "External actors sending authorization requests."
  - type: "externalSystem"
    name: "Model Registry / Feature Store"
    description: "Repository supplying ML models and features."
relationships:
  - source: "Payment Gateway / Merchant Systems"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Sends authorization requests"
    technology: "gRPC / HTTPS with mTLS"
  - source: "Fraud Operations Analysts & Risk Managers"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Reviews cases and updates rules/models"
    technology: "HTTPS (TLS 1.3) with OAuth2/OIDC and MFA"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Model Registry / Feature Store"
    description: "Fetches scoring models and features"
    technology: "HTTPS"