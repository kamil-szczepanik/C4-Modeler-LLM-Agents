level: component
scope: "Component diagram for the Audit Logger Sidecar Container container"
parentContainer:
  name: "Audit Logger Sidecar Container"
elements:
  - type: "component"
    name: "gRPC Receiver"
    technology: "Rust (Tokio, Tonic)"
    description: "Receives audit payloads securely from the Scoring Engine Container via UNIX domain sockets."
  - type: "component"
    name: "In-Memory Ring Buffer"
    technology: "Rust"
    description: "Temporarily holds audit logs in memory for high-throughput buffering."
  - type: "component"
    name: "Spill-to-Disk Buffer"
    technology: "Encrypted emptyDir (LUKS)"
    description: "Provides overflow storage for audit logs using encrypted local host disk storage."
  - type: "component"
    name: "Signer & Uploader"
    technology: "Rust (aws-sdk-s3)"
    description: "Cryptographically signs audit logs and streams them to Amazon S3 with Object Lock."
relationships:
  - source: "gRPC Receiver"
    destination: "In-Memory Ring Buffer"
    description: "Forwards received audit payloads"
  - source: "In-Memory Ring Buffer"
    destination: "Spill-to-Disk Buffer"
    description: "Spills overflow logs to disk when memory buffer is full"
  - source: "In-Memory Ring Buffer"
    destination: "Signer & Uploader"
    description: "Streams logs for signing and uploading"
  - source: "Spill-to-Disk Buffer"
    destination: "Signer & Uploader"
    description: "Reads back buffered logs for processing"