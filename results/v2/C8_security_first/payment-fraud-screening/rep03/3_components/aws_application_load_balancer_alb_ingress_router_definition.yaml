level: component
scope: "Component diagram for the AWS Application Load Balancer (ALB) / Ingress Router container"
parentContainer:
  name: "AWS Application Load Balancer (ALB) / Ingress Router"
elements:
  - type: "component"
    name: "Path-Based Routing Engine"
    technology: "AWS ALB Native Routing"
    description: "Routes high-throughput real-time payment authorization traffic and low-volume fraud analyst workflows based on URL path."
  - type: "component"
    name: "TLS Termination & mTLS Validator"
    technology: "AWS Certificate Manager (ACM)"
    description: "Enforces strict TLS termination and validates client certificates for PCI-DSS Level 1 compliance."
  - type: "component"
    name: "Web Application Firewall"
    technology: "AWS WAF v2"
    description: "Enforces rate-limiting, DDoS protection, and OWASP Top 10 rule enforcement."
relationships:
  - source: "Path-Based Routing Engine"
    destination: "Scoring Target Group (Scoring Engine Container - Rust)"
    description: "Routes real-time scoring requests via gRPC over internal TLS"
  - source: "Path-Based Routing Engine"
    destination: "Case Management Target Group (Case Management Container - Python)"
    description: "Routes analyst traffic via HTTPS (HTTP/1.1)"
  - source: "TLS Termination & mTLS Validator"
    destination: "Path-Based Routing Engine"
    description: "Passes decrypted and authenticated requests"
  - source: "Web Application Firewall"
    destination: "Path-Based Routing Engine"
    description: "Filters incoming HTTP/HTTPS requests"