level: component
scope: "Component diagram for the Scoring Engine Container (Rust) container"
parentContainer:
  name: "Scoring Engine Container (Rust)"
elements:
  - type: "component"
    name: "API Router"
    technology: "Rust, Axum, Tokio"
    description: "Routes incoming real-time scoring requests and handles API communication."
  - type: "component"
    name: "Feature Aggregator"
    technology: "Rust, Tokio"
    description: "Performs feature store lookups to gather necessary transaction data."
  - type: "component"
    name: "Scoring Engine Core"
    technology: "Rust"
    description: "Evaluates transactions against scoring models to assess fraud risk."
  - type: "component"
    name: "Model Manager"
    technology: "Rust"
    description: "Manages and fetches secure zero-downtime model updates."
  - type: "component"
    name: "Audit Dispatcher"
    technology: "Rust"
    description: "Sends audit logs securely to the audit logger sidecar."
relationships:
  - source: "API Router"
    destination: "Feature Aggregator"
    description: "Requests aggregated features for transaction evaluation"
  - source: "Feature Aggregator"
    destination: "Scoring Engine Core"
    description: "Provides features to"
  - source: "Scoring Engine Core"
    destination: "Model Manager"
    description: "Uses scoring models managed by"
  - source: "Scoring Engine Core"
    destination: "Audit Dispatcher"
    description: "Dispatches audit logs for compliance"