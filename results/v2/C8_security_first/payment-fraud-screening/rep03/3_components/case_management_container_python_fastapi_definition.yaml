level: component
scope: "Component diagram for the Case Management Container (Python / FastAPI) container"
parentContainer:
  name: "Case Management Container (Python / FastAPI)"
elements:
  - type: "component"
    name: "API / Routing Layer"
    technology: "FastAPI Routers"
    description: "Routes incoming requests and exposes API endpoints for fraud analysts."
  - type: "component"
    name: "Authentication / RBAC Middleware"
    technology: "Python Middleware"
    description: "Validates requests, ensures secure access control, and enforces PCI-DSS compliance."
  - type: "component"
    name: "Business Logic / Case Service"
    technology: "Python / FastAPI"
    description: "Handles case management workflows, business logic, and orchestrates state changes."
  - type: "component"
    name: "Data Access Layer"
    technology: "SQLAlchemy ORM with asyncpg"
    description: "Manages database interactions and state persistence with Amazon Aurora Serverless v2."
  - type: "component"
    name: "Event Publisher / Webhook Component"
    technology: "Python"
    description: "Dispatches model feedback loops and integrates with external systems."
  - type: "component"
    name: "Audit Logger Sidecar Container"
    technology: "structlog and AWS FireLens / Sidecar"
    description: "Dispatches tamper-evident audit events and structured JSON telemetry."
relationships:
  - source: "AWS Application Load Balancer (ALB)"
    destination: "Case Management Container (Python / FastAPI)"
    description: "Routes analyst traffic [HTTPS]"
  - source: "API / Routing Layer"
    destination: "Authentication / RBAC Middleware"
    description: "Validates requests [In-process Function Call]"
  - source: "Business Logic / Case Service"
    destination: "Amazon Aurora Serverless v2"
    description: "Persists state changes [SQL/TLS]"
  - source: "Business Logic / Case Service"
    destination: "Audit Logger Sidecar Container"
    description: "Dispatches audit events [gRPC/Local IPC]"
  - source: "Business Logic / Case Service"
    destination: "Event Publisher / Webhook Component"
    description: "Dispatches model feedback [In-process Function Call]"
  - source: "Event Publisher / Webhook Component"
    destination: "Model Registry / Feature Store"
    description: "Forwards feedback loops [HTTPS/TLS]"