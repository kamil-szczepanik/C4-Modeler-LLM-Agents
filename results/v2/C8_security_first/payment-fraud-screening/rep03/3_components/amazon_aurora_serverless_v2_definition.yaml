level: component
scope: "Component diagram for the Amazon Aurora Serverless v2 container"
parentContainer:
  name: "Amazon Aurora Serverless v2"
elements:
  - type: "component"
    name: "Relational Database Engine"
    technology: "PostgreSQL"
    description: "Stores and manages relational case data, fraud rules, and system state with automated multi-AZ high availability."
  - type: "component"
    name: "Connection Pool & Security Manager"
    technology: "PostgreSQL Extension / IAM Auth Handler"
    description: "Handles secure connections, TLS 1.3 encryption, and IAM-based authentication coming through the AWS RDS Proxy."
relationships:
  - source: "Connection Pool & Security Manager"
    destination: "Relational Database Engine"
    description: "Routes authenticated queries and manages connection state"