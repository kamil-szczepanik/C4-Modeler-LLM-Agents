level: container
scope: "Container diagram for Real-Time Payment Fraud Screening Platform"
system:
  name: "Real-Time Payment Fraud Screening Platform"
elements:
  - type: "person"
    name: "Fraud Analyst & Risk Manager"
    description: "Internal users reviewing cases and monitoring fraud metrics."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "Upstream actor submitting authorization requests."
  - type: "externalSystem"
    name: "Corporate Identity Provider (IdP)"
    description: "Authenticates analysts via OIDC/SAML."
  - type: "externalSystem"
    name: "Card Tokenization Provider"
    description: "External vault for PCI-DSS scope reduction."
  - type: "externalSystem"
    name: "Notification Gateway"
    description: "External SMS/Email service (Amazon SES/Twilio) for alerts."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway - HTTP APIs"
    description: "Ingresses and routes incoming requests."
  - type: "container"
    name: "Scoring Engine Container"
    technology: "Go, ONNX runtime, Amazon ECS on AWS Fargate"
    description: "Executes real-time fraud scoring models."
  - type: "container"
    name: "Case Management Container"
    technology: "Next.js / Node.js, Amazon ECS on AWS Fargate"
    description: "Manages analyst case reviews and operational workflows."
  - type: "container"
    name: "Amazon RDS PostgreSQL"
    technology: "Amazon RDS PostgreSQL"
    description: "Relational data store for cases and transaction metadata."
  - type: "container"
    name: "Amazon S3 WORM Bucket & Model Bucket"
    technology: "Amazon S3 with WORM Object Lock"
    description: "Secure storage for machine learning models and tamper-evident audit logs."
  - type: "container"
    name: "Amazon SQS / EventBridge"
    technology: "Amazon SQS / EventBridge"
    description: "Messaging and event backbone for asynchronous communication."
  - type: "container"
    name: "Amazon Athena & S3 Data Lake"
    technology: "Amazon Athena, Amazon Kinesis, Amazon S3"
    description: "Analytics engine and data lake for compliance and audit reporting."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "API Gateway"
    description: "Sends payment authorization requests"
    technology: "mTLS"
  - source: "Fraud Analyst & Risk Manager"
    destination: "API Gateway"
    description: "Accesses Case Management UI and reviews cases"
    technology: "HTTPS via ALB"
  - source: "API Gateway"
    destination: "Scoring Engine Container"
    description: "Routes authorization scoring requests"
    technology: "gRPC over HTTP/2"
  - source: "API Gateway"
    destination: "Case Management Container"
    description: "Routes analyst and management requests"
    technology: "HTTPS"
  - source: "Scoring Engine Container"
    destination: "Amazon S3 WORM Bucket & Model Bucket"
    description: "Loads fraud screening models"
    technology: "HTTPS with digital signature verification"
  - source: "Case Management Container"
    destination: "Amazon RDS PostgreSQL"
    description: "Reads and writes case data"
    technology: "TLS"
  - source: "Case Management Container"
    destination: "Amazon SQS / EventBridge"
    description: "Publishes and consumes asynchronous events"
    technology: "AWS SDK"
  - source: "Fraud Analyst & Risk Manager"
    destination: "Corporate Identity Provider (IdP)"
    description: "Authenticates via OIDC/SAML"
    technology: "OIDC/SAML"
  - source: "Case Management Container"
    destination: "Notification Gateway"
    description: "Dispatches operational alerts"
    technology: "HTTPS"
  - source: "Amazon Athena & S3 Data Lake"
    destination: "Amazon S3 WORM Bucket & Model Bucket"
    description: "Queries data for compliance audit reports"
    technology: "SQL queries"