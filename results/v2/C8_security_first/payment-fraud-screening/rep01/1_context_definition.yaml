level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening Platform"
system:
  name: "Real-Time Payment Fraud Screening Platform"
  description: "Screens card-not-present payment authorizations for fraud at 3,000 TPS while enabling analysts to review suspicious transactions, ensuring sub-50ms latency, PCI-DSS compliance, and a 7-year tamper-evident audit trail within a €25k monthly AWS budget."
elements:
  - type: "person"
    name: "Fraud Analyst & Risk Manager"
    description: "Internal users reviewing cases and monitoring fraud metrics."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "Upstream actor submitting authorization requests."
  - type: "externalSystem"
    name: "Corporate Identity Provider (IdP)"
    description: "Authenticates analysts via OIDC/SAML."
  - type: "externalSystem"
    name: "Card Tokenization Provider"
    description: "External vault for PCI-DSS scope reduction."
  - type: "externalSystem"
    name: "Notification Gateway"
    description: "External SMS/Email service (Amazon SES/Twilio) for alerts."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "Real-Time Payment Fraud Screening Platform"
    description: "Sends Authorization Requests"
    technology: "gRPC/HTTPS via AWS PrivateLink and NLB"
  - source: "Fraud Analyst & Risk Manager"
    destination: "Real-Time Payment Fraud Screening Platform"
    description: "Reviews cases and tunes rules"
    technology: "HTTPS via ALB"
  - source: "Real-Time Payment Fraud Screening Platform"
    destination: "Corporate Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OIDC/SAML"
  - source: "Real-Time Payment Fraud Screening Platform"
    destination: "Notification Gateway"
    description: "Sends operational alerts"
    technology: "HTTPS"