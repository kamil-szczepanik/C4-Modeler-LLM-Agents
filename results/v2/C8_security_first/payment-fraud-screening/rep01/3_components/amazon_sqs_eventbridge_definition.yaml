# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Amazon SQS / EventBridge container"
parentContainer:
  name: "Amazon SQS / EventBridge"
elements:
  # Components within the parent container's boundary
  - type: "component"
    name: "Amazon SQS Case Queue"
    technology: "Amazon SQS (Standard/FIFO)"
    description: "Handles asynchronous, point-to-point case queuing with Dead Letter Queues to guarantee at-least-once delivery."
  - type: "component"
    name: "EventBridge Audit Bus"
    technology: "Amazon EventBridge (Custom Event Bus with Archive and Replay)"
    description: "Manages fan-out event distribution and immutable 7-year audit logging via Archive and Replay."
relationships:
  - source: "Scoring Engine Container"
    destination: "Amazon SQS Case Queue"
    description: "SendMessage [AWS SDK / HTTPS]"
  - source: "Amazon SQS Case Queue"
    destination: "Case Management Container"
    description: "ReceiveMessage [AWS SDK / HTTPS]"
  - source: "Scoring Engine Container"
    destination: "EventBridge Audit Bus"
    description: "PutEvents [AWS SDK / HTTPS]"
  - source: "EventBridge Audit Bus"
    destination: "Amazon Athena & S3 Data Lake"
    description: "Firehose / S3 Target [AWS Native / HTTPS]"