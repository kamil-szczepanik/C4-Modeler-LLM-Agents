level: component
scope: "Component diagram for the Amazon Athena & S3 Data Lake container"
parentContainer:
  name: "Amazon Athena & S3 Data Lake"
elements:
  - type: "component"
    name: "Amazon Kinesis Data Firehose"
    technology: "Amazon Kinesis Data Firehose"
    description: "Ingests transaction logs and batch-writes logs in Apache Parquet format."
  - type: "component"
    name: "Amazon S3 Data Lake Storage"
    technology: "Amazon S3 (Raw and Curated Zones with S3 Object Lock)"
    description: "Provides immutable storage for compliance auditing, risk reporting, and fraud trend analysis with 7-year retention."
  - type: "component"
    name: "AWS Glue Data Catalog"
    technology: "AWS Glue Data Catalog"
    description: "Maintains schema definitions for analytical datasets."
  - type: "component"
    name: "Amazon Athena Query Engine"
    technology: "Amazon Athena"
    description: "Executes serverless, pay-per-query SQL for compliance audits and trend queries."
  - type: "component"
    name: "AWS Lake Formation"
    technology: "AWS Lake Formation"
    description: "Enforces column-level data masking and fine-grained access control for PCI-DSS compliance."
  - type: "component"
    name: "Scoring Engine & Case Management Containers"
    technology: "Containerized Applications"
    description: "External callers that ingest transaction logs into the data lake."
  - type: "component"
    name: "Risk Managers & BI Tools"
    technology: "Client Applications / BI Tools"
    description: "Users and tools executing compliance audits and trend queries."
relationships:
  - source: "Scoring Engine & Case Management Containers"
    destination: "Amazon Kinesis Data Firehose"
    description: "Ingests transaction logs [HTTPS / AWS SDK]"
  - source: "Amazon Kinesis Data Firehose"
    destination: "Amazon S3 Data Lake Storage"
    description: "Batch-writes logs in Apache Parquet format [S3 API]"
  - source: "AWS Glue Data Catalog"
    destination: "Amazon S3 Data Lake Storage"
    description: "Maintains schema definitions [Internal AWS API]"
  - source: "Amazon Athena Query Engine"
    destination: "AWS Glue Data Catalog"
    description: "Reads metadata for query execution [Internal AWS API]"
  - source: "Risk Managers & BI Tools"
    destination: "Amazon Athena Query Engine"
    description: "Executes compliance audits and trend queries [JDBC/ODBC / HTTPS]"