level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Ingress and TLS Termination Controller"
    technology: "AWS API Gateway (HTTP APIs)"
    description: "Manages ingress, TLS termination, and mTLS verification for external payment gateways."
  - type: "component"
    name: "Path Segregation Router"
    technology: "AWS API Gateway Routing Rules"
    description: "Routes authorization scoring requests to the scoring engine and analyst requests to the case management container."
  - type: "component"
    name: "Audit Logging Publisher"
    technology: "AWS API Gateway Native Integration"
    description: "Streams compressed access logs to Amazon Kinesis Data Firehose for auditability."
relationships:
  - source: "Ingress and TLS Termination Controller"
    destination: "Path Segregation Router"
    description: "Forwards authenticated and terminated HTTP requests"
  - source: "Path Segregation Router"
    destination: "Audit Logging Publisher"
    description: "Triggers log emission for all processed traffic"