level: component
scope: "Component diagram for the Amazon RDS PostgreSQL container"
parentContainer:
  name: "Amazon RDS PostgreSQL"
elements:
  - type: "component"
    name: "Cases DB Schema"
    technology: "PostgreSQL Database Schema"
    description: "Stores case management data and audit logs for fraud analyst review."
  - type: "component"
    name: "Audit Log Schema"
    technology: "PostgreSQL Database Schema with pgaudit & Trigger-Based RLS"
    description: "Maintains immutable audit records supporting PCI-DSS compliance."
  - type: "component"
    name: "PgBouncer / RDS Proxy"
    technology: "AWS RDS Proxy / PgBouncer"
    description: "Provides connection pooling to handle high-concurrency connection spikes and prevent backend exhaustion."
relationships:
  - source: "PgBouncer / RDS Proxy"
    destination: "Cases DB Schema"
    description: "Routes and pools database connections for case management"
  - source: "PgBouncer / RDS Proxy"
    destination: "Audit Log Schema"
    description: "Routes and pools database connections for audit logging"