level: component
scope: "Component diagram for the Case Management Container container"
parentContainer:
  name: "Case Management Container"
elements:
  - type: "component"
    name: "Case Management Frontend"
    technology: "Static SPA on Amazon S3 and Amazon CloudFront"
    description: "Provides the user interface for fraud analysts and risk managers to manage cases and review alerts."
  - type: "component"
    name: "Case Management Backend"
    technology: "Node.js API on Amazon ECS on Amazon Fargate"
    description: "Processes analyst requests, manages business logic, and coordinates data persistence and notifications."
relationships:
  - source: "Case Management Frontend"
    destination: "Case Management Backend"
    description: "Invokes REST API [HTTPS]"