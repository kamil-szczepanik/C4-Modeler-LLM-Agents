level: component
scope: "Component diagram for the Scoring Engine Container container"
parentContainer:
  name: "Scoring Engine Container"
elements:
  - type: "component"
    name: "API Router Component"
    technology: "Go (net/http)"
    description: "Handles gRPC-over-HTTP/2 requests and timeouts."
  - type: "component"
    name: "Feature Enrichment Component"
    technology: "Go interface"
    description: "Fetches velocity features via AWS ElastiCache (Redis cache.t4g.micro)."
  - type: "component"
    name: "Model Execution Engine"
    technology: "Go struct / ONNX Runtime (C-Bindings)"
    description: "Evaluates transactions using concurrent double-buffered models."
  - type: "component"
    name: "Fallback & Circuit Breaker Component"
    technology: "Go context"
    description: "Enforces R-07 availability constraints."
  - type: "component"
    name: "Audit & Telemetry Dispatcher"
    technology: "Go asynchronous routines"
    description: "Asynchronously flushes tamper-evident audit logs."
relationships:
  - source: "API Router Component"
    destination: "Feature Enrichment Component"
    description: "Invokes feature lookup via Go interface"
  - source: "Feature Enrichment Component"
    destination: "Model Execution Engine"
    description: "Passes enriched feature vector via Go struct"
  - source: "Model Execution Engine"
    destination: "Fallback & Circuit Breaker Component"
    description: "Intercepts timeouts and errors via Go context"