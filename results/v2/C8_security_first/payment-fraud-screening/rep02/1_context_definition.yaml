level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Evaluates card-not-present payment authorizations for fraud before approval and provides case management for suspicious transactions, delivering sub-50ms fraud decisions at 3,000 TPS while maintaining PCI-DSS Level 1 compliance and 7-year auditability."
elements:
  - type: "person"
    name: "Fraud Analyst & Risk Manager"
    description: "Evaluates suspicious transactions and manages fraud cases using the system."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "Sends card-not-present payment authorizations for fraud screening."
  - type: "externalSystem"
    name: "Payment Network / Card Brands (Visa/Mastercard)"
    description: "Interacts with the payment ecosystem and transaction flow."
  - type: "externalSystem"
    name: "Core Ledger / Compliance Archive"
    description: "Receives immutable audit records for 7-year retention."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Evaluates payment authorizations for fraud"
    technology: "gRPC/REST over mTLS"
  - source: "Fraud Analyst & Risk Manager"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Manages suspicious transactions and cases"
    technology: "HTTPS and OAuth 2.0 / OIDC"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Core Ledger / Compliance Archive"
    description: "Stores tamper-evident 7-year audit retention data"
    technology: "AWS S3 Object Lock / QLDB"