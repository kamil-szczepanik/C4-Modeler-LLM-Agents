level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analyst & Risk Manager"
    description: "Evaluates suspicious transactions and manages fraud cases."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "Sends card-not-present payment authorizations for fraud screening."
  - type: "externalSystem"
    name: "Payment Network / Card Brands"
    description: "Interacts with the payment ecosystem and transaction flow."
  - type: "externalSystem"
    name: "Core Ledger"
    description: "Receives immutable audit records for retention."
  - type: "container"
    name: "AWS API Gateway"
    technology: "AWS API Gateway (Ingress/TLS Termination)"
    description: "Provides ingress and TLS termination for incoming requests."
  - type: "container"
    name: "Go Scoring Engine"
    technology: "Go (Golang), AWS ECS on Fargate"
    description: "High-performance scoring engine for real-time fraud detection."
  - type: "container"
    name: "Node.js Case Management"
    technology: "Node.js (TypeScript), AWS ECS on Fargate"
    description: "Provides rapid development framework for the case management API."
  - type: "container"
    name: "Amazon SQS / EventBridge"
    technology: "Amazon SQS / EventBridge"
    description: "Handles asynchronous audit stream."
  - type: "container"
    name: "Amazon Aurora PostgreSQL Serverless v2"
    technology: "Amazon Aurora PostgreSQL Serverless v2"
    description: "Case state database."
  - type: "container"
    name: "AWS QLDB"
    technology: "Amazon QLDB"
    description: "Cryptographic ledger ensuring tamper-evident audit retention."
  - type: "container"
    name: "AWS Cognito & AWS Secrets Manager"
    technology: "AWS Cognito, AWS Secrets Manager"
    description: "Handles authentication and secrets management."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "AWS API Gateway"
    description: "Sends payment authorizations"
    technology: "HTTPS (TLS 1.3)"
  - source: "AWS API Gateway"
    destination: "Go Scoring Engine"
    description: "Routes scoring requests"
    technology: "gRPC over mTLS"
  - source: "Go Scoring Engine"
    destination: "Amazon SQS / EventBridge"
    description: "Publishes asynchronous audit stream"
    technology: "AWS SDK"
  - source: "Amazon SQS / EventBridge"
    destination: "AWS QLDB"
    description: "Stores tamper-evident audit logs"
    technology: "AWS SDK / API"
  - source: "Fraud Analyst & Risk Manager"
    destination: "Node.js Case Management"
    description: "Manages suspicious transactions and cases"
    technology: "HTTPS (OAuth2/OIDC via AWS Cognito)"
  - source: "Node.js Case Management"
    destination: "Amazon Aurora PostgreSQL Serverless v2"
    description: "Reads and writes case state"
    technology: "TLS"