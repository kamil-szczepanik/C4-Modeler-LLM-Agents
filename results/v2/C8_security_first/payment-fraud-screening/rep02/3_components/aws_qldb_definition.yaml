level: component
scope: "Component diagram for the AWS QLDB container"
parentContainer:
  name: "AWS QLDB"
elements:
  - type: "component"
    name: "Ledger Core"
    technology: "Amazon QLDB"
    description: "Provides native cryptographic immutability and tamper-evident audit trails for PCI-DSS compliance."
  - type: "component"
    name: "Audit Ingestion Service"
    technology: "AWS Lambda (Python)"
    description: "Consumes audit payloads asynchronously and writes tamper-evident audit logs using PartQL."
  - type: "component"
    name: "Verification & Export Worker"
    technology: "AWS Lambda (Python)"
    description: "Executes cryptographic digest verifications and exports periodic cryptographic proofs to Amazon S3."
relationships:
  - source: "Audit Ingestion Service"
    destination: "Ledger Core"
    description: "Writes tamper-evident audit logs using PartQL [AWS SDK / HTTPS]"
  - source: "Verification & Export Worker"
    destination: "Ledger Core"
    description: "Executes cryptographic digest verifications [AWS SDK / HTTPS]"