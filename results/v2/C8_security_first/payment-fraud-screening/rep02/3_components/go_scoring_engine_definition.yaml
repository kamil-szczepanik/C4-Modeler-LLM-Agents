level: component
scope: "Component diagram for the Go Scoring Engine container"
parentContainer:
  name: "Go Scoring Engine"
elements:
  - type: "component"
    name: "HTTP/gRPC Ingress Handler"
    technology: "Go HTTP/gRPC Server"
    description: "Handles incoming payment authorizations and routes requests under strict latency constraints."
  - type: "component"
    name: "Feature Extractor Component"
    technology: "Go Feature Extraction Logic"
    description: "Extracts and aggregates features required for real-time fraud scoring."
  - type: "component"
    name: "Scoring & Evaluation Core"
    technology: "Go Evaluation Engine"
    description: "Processes payment authorizations to return approve, decline, or review decisions."
  - type: "component"
    name: "Rule Engine Hot-Reloader Component"
    technology: "Go Dynamic Loader"
    description: "Dynamically reloads fraud rules without restarting the engine."
  - type: "component"
    name: "Audit Signer Component"
    technology: "Go Cryptographic Signer"
    description: "Provides cryptographic signing for tamper-evident auditability."
  - type: "component"
    name: "Memory Sanitizer Middleware"
    technology: "Go Memory Middleware"
    description: "Sanitizes memory to ensure compliance and security."
relationships:
  - source: "AWS API Gateway & NLB"
    destination: "HTTP/gRPC Ingress Handler"
    description: "gRPC over mTLS"
  - source: "Feature Extractor Component"
    destination: "Amazon ElastiCache (Redis OSS)"
    description: "TCP"
  - source: "Audit Signer Component"
    destination: "AWS KMS"
    description: "AWS SDK"
  - source: "Go Scoring Engine"
    destination: "Amazon SQS / EventBridge"
    description: "AWS SDK"