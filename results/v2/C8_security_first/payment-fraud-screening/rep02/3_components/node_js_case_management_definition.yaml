level: component
scope: "Component diagram for the Node.js Case Management container"
parentContainer:
  name: "Node.js Case Management"
elements:
  - type: "component"
    name: "API Router / Controller"
    technology: "Express/Fastify"
    description: "Handles incoming HTTPS requests from fraud analysts and routes them to internal services."
  - type: "component"
    name: "Case Workflow Service"
    technology: "Node.js/TypeScript"
    description: "Manages the business logic and workflow states for case reviews."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "Node.js/TypeScript"
    description: "Collects audit data and emits events for compliance."
  - type: "component"
    name: "Data Access Repository"
    technology: "Prisma/TypeORM"
    description: "Handles reads and writes to the database with parameterization."
  - type: "component"
    name: "Decision Feedback Publisher"
    technology: "Node.js/TypeScript"
    description: "Dispatches decision feedback events upon case resolution."
relationships:
  - source: "API Router / Controller"
    destination: "Case Workflow Service"
    description: "In-process function calls"
  - source: "Case Workflow Service"
    destination: "Data Access Repository"
    description: "In-process calls"
  - source: "Case Workflow Service"
    destination: "Audit & Compliance Logger"
    description: "Asynchronous event emission"
  - source: "Case Workflow Service"
    destination: "Decision Feedback Publisher"
    description: "In-process event dispatch upon resolution"