level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL Serverless v2 container"
parentContainer:
  name: "Amazon Aurora PostgreSQL Serverless v2"
elements:
  - type: "component"
    name: "Case State Repository"
    technology: "PostgreSQL"
    description: "Manages read and write operations for case state data with Row Level Security (RLS)."
  - type: "component"
    name: "Audit and Compliance Storage"
    technology: "PostgreSQL Schema"
    description: "Maintains relational data structures supporting compliance requirements."
relationships:
  - source: "Case State Repository"
    destination: "Audit and Compliance Storage"
    description: "Persists transactional state updates [PostgreSQL wire protocol over TLS 1.3 with IAM Auth]"