level: component
scope: "Component diagram for the AWS API Gateway container"
parentContainer:
  name: "AWS API Gateway"
elements:
  - type: "component"
    name: "Edge Router & WAF Integrator"
    technology: "AWS API Gateway Component"
    description: "Handles native edge routing and WAF integration for low latency and DDoS protection."
  - type: "component"
    name: "Request Validator & Sanitizer"
    technology: "AWS API Gateway Component"
    description: "Validates and sanitizes incoming payment authorization requests."
  - type: "component"
    name: "Upstream Router"
    technology: "AWS API Gateway Component"
    description: "Routes requests to internal services such as the Go Scoring Engine and Node.js Case Management."
relationships:
  - source: "Edge Router & WAF Integrator"
    destination: "Request Validator & Sanitizer"
    description: "Passes incoming traffic for validation"
  - source: "Request Validator & Sanitizer"
    destination: "Upstream Router"
    description: "Passes sanitized requests for routing"