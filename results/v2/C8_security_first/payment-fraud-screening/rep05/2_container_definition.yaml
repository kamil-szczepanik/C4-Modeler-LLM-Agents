level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analysts & Risk Managers"
    description: "Users who interact with the system using case management tools for fraud analysis."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Upstream system that submits card-not-present payment authorizations for fraud screening."
  - type: "container"
    name: "AWS API Gateway & Internal Network Load Balancer (NLB)"
    technology: "AWS API Gateway / NLB"
    description: "Ingresses and routes traffic from the payment gateway to internal services."
  - type: "container"
    name: "Scoring Engine Container"
    technology: "Rust or Go"
    description: "Provides automated fraud scoring with <50ms P99 latency."
  - type: "container"
    name: "Case Management API Container"
    technology: "Node.js or Python"
    description: "Handles case management logic for fraud analysts."
  - type: "container"
    name: "Fraud Analyst SPA"
    technology: "Single Page Application"
    description: "Provides the user interface for fraud analysts to manage cases."
  - type: "container"
    name: "S3 Model Registry & S3 Object Lock"
    technology: "AWS S3"
    description: "Stores fraud models and ensures 7-year tamper-evident retention."
  - type: "container"
    name: "Amazon SQS (Audit Queue)"
    technology: "Amazon SQS"
    description: "Asynchronously buffers audit events for compliance logging."
  - type: "container"
    name: "AWS QLDB"
    technology: "AWS QLDB"
    description: "Quantum Ledger Database persisting tamper-evident compliance records."
  - type: "container"
    name: "AWS KMS & AWS Secrets Manager"
    technology: "AWS KMS / Secrets Manager"
    description: "Manages encryption keys and application secrets."
relationships:
  - source: "Payment Gateway"
    destination: "AWS API Gateway & Internal Network Load Balancer (NLB)"
    description: "Interacts for payment authorization screening"
    technology: "HTTPS/TLS 1.3"
  - source: "AWS API Gateway & Internal Network Load Balancer (NLB)"
    destination: "Scoring Engine Container"
    description: "Receives payloads and routes traffic"
    technology: "gRPC"
  - source: "Fraud Analyst SPA"
    destination: "Case Management API Container"
    description: "Communicates for case workflows and management"
    technology: "REST/JSON over HTTPS"
  - source: "Fraud Analysts & Risk Managers"
    destination: "Fraud Analyst SPA"
    description: "Accesses user interface for fraud analysis"
    technology: "HTTPS"
  - source: "Scoring Engine Container"
    destination: "Amazon SQS (Audit Queue)"
    description: "Pushes audit events asynchronously"
    technology: "AWS SDK / SQS"
  - source: "Amazon SQS (Audit Queue)"
    destination: "AWS QLDB"
    description: "Persists tamper-evident records via triggers"
    technology: "SQS Triggers"
  - source: "Scoring Engine Container"
    destination: "S3 Model Registry & S3 Object Lock"
    description: "Retrieves fraud scoring models"
    technology: "AWS S3 API"
  - source: "Case Management API Container"
    destination: "AWS KMS & AWS Secrets Manager"
    description: "Retrieves secrets and encryption configuration"
    technology: "AWS IAM / TLS"
  - source: "Scoring Engine Container"
    destination: "AWS KMS & AWS Secrets Manager"
    description: "Retrieves secrets and encryption configuration"
    technology: "AWS IAM / TLS"