level: component
scope: "Component diagram for the AWS KMS & AWS Secrets Manager container"
parentContainer:
  name: "AWS KMS & AWS Secrets Manager"
elements:
  - type: "component"
    name: "Key Management Service (KMS) Component"
    technology: "AWS KMS"
    description: "Manages customer-managed CMKs with annual rotation for envelope encryption."
  - type: "component"
    name: "Secrets Manager Component"
    technology: "AWS Secrets Manager"
    description: "Manages encrypted database credentials with 30-day automated rotation."
relationships:
  - source: "Scoring Engine Container"
    destination: "Key Management Service (KMS) Component"
    description: "Requests Data Keys via local in-memory cache [AWS IAM, AWS PrivateLink, TLS 1.3]"
  - source: "Case Management API Container"
    destination: "Secrets Manager Component"
    description: "Fetches and temporarily caches database credentials [AWS IAM, AWS PrivateLink, TLS 1.3]"
  - source: "Secrets Manager Component"
    destination: "AWS Lambda"
    description: "Triggers automated credential rotation [AWS Internal]"