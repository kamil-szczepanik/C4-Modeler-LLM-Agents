level: component
scope: "Component diagram for the Amazon SQS (Audit Queue) container"
parentContainer:
  name: "Amazon SQS (Audit Queue)"
elements:
  - type: "component"
    name: "audit-events-queue"
    technology: "Amazon SQS"
    description: "Primary asynchronous buffer for audit payloads operating at 3000 TPS."
