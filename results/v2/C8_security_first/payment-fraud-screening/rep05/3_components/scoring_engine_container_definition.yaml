level: component
scope: "Component diagram for the Scoring Engine Container container"
parentContainer:
  name: "Scoring Engine Container"
elements:
  - type: "component"
    name: "API Listener Component"
    technology: "Tonic gRPC server (Rust)"
    description: "Tonic gRPC server handling inbound TLS/mTLS traffic and zero-copy parsing."
  - type: "component"
    name: "Rule Engine Component"
    technology: "WebAssembly (Wasm) (Rust)"
    description: "In-memory WebAssembly (Wasm) evaluation engine for low-latency fraud scoring."
  - type: "component"
    name: "Fallback Heuristics Component"
    technology: "Rust"
    description: "Embedded static ruleset executing securely upon primary engine failure."
  - type: "component"
    name: "Model Manager Component"
    technology: "Rust, AWS S3 API"
    description: "Background worker handling zero-downtime model hot-reloads from AWS S3."
  - type: "component"
    name: "Telemetry & Version Injector Component"
    technology: "OpenTelemetry, Rust"
    description: "Injects model version metadata and OpenTelemetry traces."
  - type: "component"
    name: "Audit Dispatcher Component"
    technology: "Buffered channel, AWS SDK / SQS"
    description: "Non-blocking, buffered channel pushing events to Amazon SQS."
  - type: "component"
    name: "AWS ECS Fargate"
    technology: "AWS ECS Fargate, AWS Application Auto Scaling, Fargate Spot"
    description: "Compute environment running containers with AWS Application Auto Scaling and Fargate Spot."
  - type: "component"
    name: "S3 Model Registry & S3 Object Lock"
    technology: "AWS S3"
    description: "External storage for fraud scoring models with tamper-evident retention."
  - type: "component"
    name: "Amazon SQS (Audit Queue)"
    technology: "Amazon SQS"
    description: "Handles reliable, asynchronous audit event decoupling."
  - type: "component"
    name: "AWS KMS & AWS Secrets Manager"
    technology: "AWS IAM / TLS"
    description: "Retrieves secrets and encryption config."
  - type: "component"
    name: "AWS X-Ray"
    technology: "gRPC"
    description: "Exports OpenTelemetry traces."
relationships:
  - source: "API Listener Component"
    destination: "Rule Engine Component"
    description: "Evaluates requests via In-memory function call [Rust/gRPC]"
  - source: "API Listener Component"
    destination: "Fallback Heuristics Component"
    description: "Evaluates requests via In-memory function call [Rust/gRPC]"
  - source: "Rule Engine Component"
    destination: "Telemetry & Version Injector Component"
    description: "Passes scoring results and metadata [In-memory]"
  - source: "Fallback Heuristics Component"
    destination: "Telemetry & Version Injector Component"
    description: "Passes scoring results and metadata [In-memory]"
  - source: "Scoring Engine Container"
    destination: "Amazon SQS (Audit Queue)"
    description: "Pushes audit events asynchronously [AWS SDK / SQS]"
  - source: "Model Manager Component"
    destination: "S3 Model Registry & S3 Object Lock"
    description: "Retrieves fraud scoring models [AWS S3 API]"
  - source: "Scoring Engine Container"
    destination: "AWS KMS & AWS Secrets Manager"
    description: "Retrieves secrets and encryption config [AWS IAM / TLS]"
  - source: "Scoring Engine Container"
    destination: "AWS X-Ray"
    description: "Exports OpenTelemetry traces [gRPC]"