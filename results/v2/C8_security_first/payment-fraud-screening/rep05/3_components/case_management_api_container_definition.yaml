level: component
scope: "Component diagram for the Case Management API Container container"
parentContainer:
  name: "Case Management API Container"
elements:
  - type: "component"
    name: "Case Controller Component"
    technology: "Node.js / TypeScript, Express/Fastify"
    description: "Handles REST/JSON endpoints for fraud analyst reviews and investigations."
  - type: "component"
    name: "Data Masking Middleware Component"
    technology: "Node.js / TypeScript Middleware"
    description: "Enforces strict data masking to ensure PCI-DSS Level 1 compliance."
  - type: "component"
    name: "Audit & Event Publisher Component"
    technology: "Node.js / TypeScript, AWS SDK"
    description: "Publishes cryptographically signed audit trails and events."
  - type: "component"
    name: "Case Repository Component"
    technology: "Node.js / TypeScript, AWS SDK"
    description: "Manages persistence and interaction with tamper-evident ledger storage."
  - type: "component"
    name: "Batch Action & Workflow Engine Component"
    technology: "Node.js / TypeScript"
    description: "Processes in-memory event emissions for batch actions and case workflows."
relationships:
  - source: "Fraud Analyst SPA"
    destination: "Case Controller Component"
    description: "REST/JSON over HTTPS via TLS 1.3"
  - source: "Case Controller Component"
    destination: "Data Masking Middleware Component"
    description: "Middleware intercept"
  - source: "Case Controller Component"
    destination: "Batch Action & Workflow Engine Component"
    description: "In-memory event emission"
  - source: "Case Repository Component"
    destination: "AWS QLDB"
    description: "AWS SDK over TLS"
  - source: "Audit & Event Publisher Component"
    destination: "Amazon SQS (Audit Queue)"
    description: "AWS SDK over TLS"
  - source: "Case Management API Container"
    destination: "AWS KMS & AWS Secrets Manager"
    description: "AWS IAM / TLS"