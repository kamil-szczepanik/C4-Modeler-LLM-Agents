level: component
scope: "Component diagram for the AWS API Gateway & Internal Network Load Balancer (NLB) container"
parentContainer:
  name: "AWS API Gateway & Internal Network Load Balancer (NLB)"
elements:
  - type: "component"
    name: "AWS Network Load Balancer (NLB)"
    technology: "AWS NLB"
    description: "Ingests raw payment authorizations via TCP/TLS 1.3 and routes payloads to the scoring engine."
  - type: "component"
    name: "AWS API Gateway (HTTP API)"
    technology: "AWS API Gateway"
    description: "Accepts management actions from the Fraud Analyst SPA and forwards authenticated HTTPS/REST traffic."
relationships:
  - source: "AWS Network Load Balancer (NLB)"
    destination: "Scoring Engine Container"
    description: "Routes raw payloads using TCP over TLS 1.3 with mTLS"
  - source: "AWS API Gateway (HTTP API)"
    destination: "Case Management API Container"
    description: "Forwards authenticated traffic via HTTPS/REST"