level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Screens card-not-present payment authorizations in the AWS eu-west-1 region, enabling automated fraud scoring and providing case management tools for fraud analysts."
elements:
  - type: "person"
    name: "Fraud Analysts & Risk Managers"
    description: "Users who interact with the system using case management tools for fraud analysis."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Upstream system that submits card-not-present payment authorizations for fraud screening."
  - type: "externalSystem"
    name: "Identity Provider (AWS Cognito/Okta)"
    description: "Handles authentication and OAuth2/OIDC enforcement."
  - type: "externalSystem"
    name: "AWS ECS Fargate"
    description: "Container orchestration platform for predictable low-latency scaling."
  - type: "externalSystem"
    name: "AWS QLDB and S3 Object Lock"
    description: "Tamper-evident, append-only data stores for audit compliance."
  - type: "externalSystem"
    name: "AWS KMS"
    description: "Provides AES-256 encryption at rest."
relationships:
  - source: "Payment Gateway"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Interacts for payment authorization screening"
    technology: "mTLS and gRPC"
  - source: "Fraud Analysts & Risk Managers"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Accesses case management tools"
    technology: "HTTPS, TLS 1.3, OAuth2/OIDC"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Identity Provider (AWS Cognito/Okta)"
    description: "Authenticates users and enforces security"
    technology: "OAuth2/OIDC"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "AWS ECS Fargate"
    description: "Runs containerized workloads"
    technology: "AWS ECS"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "AWS QLDB and S3 Object Lock"
    description: "Stores audit and transaction data"
    technology: "AWS IAM and TLS"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "AWS KMS"
    description: "Encrypts data at rest"
    technology: "AWS IAM and TLS"