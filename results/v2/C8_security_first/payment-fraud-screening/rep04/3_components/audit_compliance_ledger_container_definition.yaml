level: component
scope: "Component diagram for the Audit & Compliance Ledger Container container"
parentContainer:
  name: "Audit & Compliance Ledger Container"
elements:
  - type: "component"
    name: "Ledger Ingestion Service"
    technology: "Go"
    description: "Consumes decision payloads from message queues and formats them for ledger ingestion."
  - type: "component"
    name: "Tamper-Evident Journal Manager"
    technology: "Go / AWS SDK"
    description: "Commits cryptographically verifiable audit records to AWS QLDB."
  - type: "component"
    name: "Compliance API Controller"
    technology: "Go / REST"
    description: "Provides endpoints for Compliance & Audit Officers to query decision histories and export reports."
relationships:
  - source: "Ledger Ingestion Service"
    destination: "Tamper-Evident Journal Manager"
    description: "Passes formatted records"
  - source: "Compliance API Controller"
    destination: "Tamper-Evident Journal Manager"
    description: "Queries audit logs"