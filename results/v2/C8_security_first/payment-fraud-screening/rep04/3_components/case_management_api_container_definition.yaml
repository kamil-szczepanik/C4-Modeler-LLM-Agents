level: component
scope: "Component diagram for the Case Management API Container container"
parentContainer:
  name: "Case Management API Container"
elements:
  - type: "component"
    name: "Case Management API Controller"
    technology: "Node.js with NestJS"
    description: "Handles HTTP requests from Fraud Analysts and provides case management endpoints with DTO validation."
  - type: "component"
    name: "Case Workflow Service"
    technology: "Node.js with NestJS"
    description: "Processes case lifecycles and forwards immutable audit trails to the Audit & Compliance Ledger Container."
  - type: "component"
    name: "Audit Query Component"
    technology: "Node.js with NestJS"
    description: "Queries decision histories and audit records for compliance and reporting."
relationships:
  - source: "Case Management API Controller"
    destination: "Case Workflow Service"
    description: "Delegates workflow actions"
  - source: "Case Workflow Service"
    destination: "Audit & Compliance Ledger Container"
    description: "Forwards immutable audit trails [gRPC / TLS]"
  - source: "Audit Query Component"
    destination: "AWS QLDB"
    description: "Queries decision histories for compliance [AWS SDK / TLS]"
  - source: "Case Management API Controller"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads/writes operational state and queries read replicas [TLS / Prisma ORM]"
  - source: "Case Management API Controller"
    destination: "Amazon SQS"
    description: "Publishes bulk decision jobs [AWS SDK / TLS]"