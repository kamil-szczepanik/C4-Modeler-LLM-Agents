level: component
scope: "Component diagram for the Scoring Engine Container container"
parentContainer:
  name: "Scoring Engine Container"
elements:
  - type: "component"
    name: "API Router Component"
    technology: "Go gRPC Server"
    description: "Handles synchronous gRPC scoring requests, invoking model evaluation or falling back on timeout/error."
  - type: "component"
    name: "Model Evaluator Component"
    technology: "Go In-Memory Evaluator"
    description: "Executes compiled fraud models in memory with atomic pointer-swapping."
  - type: "component"
    name: "Model Loader & Verifier Component"
    technology: "Go Background Worker"
    description: "Fetches, verifies, and prepares model artifacts, triggering atomic pointer swaps."
  - type: "component"
    name: "Local Heuristic Fallback Component"
    technology: "Go Rule-Based Engine"
    description: "Rule-based fallback engine invoked for timeouts or errors."
relationships:
  - source: "API Router Component"
    destination: "Model Evaluator Component"
    description: "Invokes model evaluation [In-memory function call]"
  - source: "API Router Component"
    destination: "Local Heuristic Fallback Component"
    description: "Invokes fallback on timeout/error [In-memory fallback]"
  - source: "Model Loader & Verifier Component"
    destination: "Model Evaluator Component"
    description: "Triggers atomic pointer swap [In-memory pointer update]"