level: component
scope: "Component diagram for the AWS QLDB container"
parentContainer:
  name: "AWS QLDB"
elements:
  - type: "component"
    name: "Ledger Journal Storage Component"
    technology: "AWS QLDB Journal"
    description: "Provides managed, cryptographically secure, append-only journal storage for R-06 auditability."
  - type: "component"
    name: "Ion Document Storage Component"
    technology: "Amazon Ion"
    description: "Stores immutable document revisions securely within the ledger."
  - type: "component"
    name: "QLDB PartiQL API Component"
    technology: "PartiQL API"
    description: "Exposes interfaces for writing and querying tamper-evident records securely."
relationships:
  - source: "Ledger Journal Storage Component"
    destination: "Ion Document Storage Component"
    description: "Persists document revisions"
  - source: "QLDB PartiQL API Component"
    destination: "Ledger Journal Storage Component"
    description: "Executes queries and transactions"