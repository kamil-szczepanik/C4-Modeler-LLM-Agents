level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Users who review suspicious payments via the case management interface."
  - type: "person"
    name: "Compliance & Audit Officer"
    description: "Users who verify tamper-evident audit logs and system decisions."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External platform sending payment authorization requests for real-time screening."
  - type: "externalSystem"
    name: "Corporate IdP"
    description: "Handles authentication and identity federation for analysts and officers."
  - type: "container"
    name: "Envoy Proxy"
    description: "Ingress container handling external TLS 1.3 termination and gRPC routing."
    technology: "Envoy Proxy"
  - type: "container"
    name: "Scoring Engine Container"
    description: "Stateless microservice executing real-time fraud models with a local heuristic fallback engine."
    technology: "Go"
  - type: "container"
    name: "Case Management API Container"
    description: "Handles analyst workflows and review queues."
    technology: "Node.js with NestJS"
  - type: "container"
    name: "Audit & Compliance Ledger Container"
    description: "Captures immutable decision payloads, inputs, and model versions."
    technology: "Containerized Service"
  - type: "container"
    name: "Amazon ElastiCache / SQS"
    description: "Buffers audit data and decouples real-time payment ingestion."
    technology: "Amazon ElastiCache / SQS"
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    description: "Managed database for operational data."
    technology: "Amazon Aurora PostgreSQL"
  - type: "container"
    name: "AWS QLDB"
    description: "Managed database for tamper-evident audit trails."
    technology: "AWS QLDB"
relationships:
  - source: "Payment Gateway"
    destination: "Envoy Proxy"
    description: "Real-time payment authorization screening"
    technology: "TLS 1.3"
  - source: "Envoy Proxy"
    destination: "Scoring Engine Container"
    description: "Routes authorization requests"
    technology: "Internal gRPC over mTLS"
  - source: "Scoring Engine Container"
    destination: "Amazon ElastiCache / SQS"
    description: "Publishes asynchronous audit events"
    technology: "Queue API"
  - source: "Audit & Compliance Ledger Container"
    destination: "AWS QLDB"
    description: "Writes tamper-evident records"
    technology: "Database API"
  - source: "Fraud Analysts"
    destination: "Case Management API Container"
    description: "Review flagged transactions"
    technology: "Corporate IdP Authentication / HTTPS"
  - source: "Case Management API Container"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes operational state"
    technology: "TLS"
  - source: "Amazon ElastiCache / SQS"
    destination: "Audit & Compliance Ledger Container"
    description: "Consumes audit events from queue"
    technology: "Queue Protocol"