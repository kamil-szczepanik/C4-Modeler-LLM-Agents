level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Evaluates card-not-present payment authorizations for a mid-size payment processor to prevent fraud while enabling manual case reviews."
elements:
  - type: "person"
    name: "Fraud Analysts & Risk Operations"
    description: "Analysts who perform manual case reviews and manage fraud operations."
  - type: "person"
    name: "Compliance & Audit Officer"
    description: "Officers responsible for reviewing audit logs and ensuring PCI-DSS Level 1 compliance."
  - type: "externalSystem"
    name: "Payment Gateway / Core Processing Platform"
    description: "Sends payment authorization requests for real-time fraud evaluation."
  - type: "externalSystem"
    name: "Card Networks / Tokenization Service"
    description: "Provides token resolution and verification services."
  - type: "externalSystem"
    name: "Corporate Identity Provider (OIDC/SAML)"
    description: "Handles authentication and identity federation for analysts and compliance officers."
  - type: "externalSystem"
    name: "AWS KMS & Secrets Manager"
    description: "Provides key management, encryption, and cryptographic hashing services."
relationships:
  - source: "Payment Gateway / Core Processing Platform"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Synchronous API requests for sub-50ms scoring"
    technology: "HTTPS/mTLS (REST/gRPC)"
  - source: "Fraud Analysts & Risk Operations"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Secure case reviews and operations"
    technology: "HTTPS via OIDC/SAML"
  - source: "Compliance & Audit Officer"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Audit log access and compliance checks"
    technology: "HTTPS via OIDC/SAML"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Card Networks / Tokenization Service"
    description: "Token resolution and verification"
    technology: "HTTPS API"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "AWS KMS & Secrets Manager"
    description: "Encryption, key rotation, and data-key caching"
    technology: "Internal AWS API"