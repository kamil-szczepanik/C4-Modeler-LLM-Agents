level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Cart Component"
    technology: "Redis-backed"
    description: "Manages secure shopping cart states and idempotency keys."
  - type: "component"
    name: "Checkout Orchestrator & Idempotency Manager"
    technology: "Java 21, Spring Boot"
    description: "Orchestrates the checkout process and manages transaction idempotency."
  - type: "component"
    name: "Payment Integration Component"
    technology: "Java 21, Spring Boot"
    description: "Handles secure financial transactions and payment captures with external gateways."
  - type: "component"
    name: "Fulfillment Component"
    technology: "Java 21, Spring Boot"
    description: "Processes fulfillment data and interfaces with third-party shipping APIs and queues."
  - type: "component"
    name: "Order Repository"
    technology: "Amazon Aurora PostgreSQL"
    description: "Persists orders and state via JDBC and AWS RDS Proxy."
relationships:
  - source: "Checkout Orchestrator & Idempotency Manager"
    destination: "Payment Integration Component"
    description: "Processes financial transactions and payment captures [HTTPS with TLS 1.3]"
  - source: "Checkout Orchestrator & Idempotency Manager"
    destination: "Fulfillment Component"
    description: "Transmits fulfillment data for processing"
  - source: "Checkout Orchestrator & Idempotency Manager"
    destination: "Cart Component"
    description: "Manages cart state and idempotency keys [Redis Protocol]"
  - source: "Checkout Orchestrator & Idempotency Manager"
    destination: "Order Repository"
    description: "Persists orders and state [JDBC via AWS RDS Proxy]"
  - source: "Fulfillment Component"
    destination: "Order Repository"
    description: "Updates fulfillment status in database [JDBC via AWS RDS Proxy]"