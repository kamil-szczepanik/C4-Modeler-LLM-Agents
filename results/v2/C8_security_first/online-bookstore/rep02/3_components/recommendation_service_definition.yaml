level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "API Router / Controller"
    technology: "FastAPI / Python"
    description: "FastAPI component handling gRPC requests, Pydantic input validation, and OAuth2/JWT scope checks."
  - type: "component"
    name: "Recommendation Engine"
    technology: "Python, NumPy, Scikit-learn"
    description: "Core Python component utilizing collaborative filtering and popularity heuristics."
  - type: "component"
    name: "Model Cache Layer"
    technology: "Amazon ElastiCache (Redis)"
    description: "Stores pre-computed vector embeddings and itemsets with sub-50ms read latency."
  - type: "component"
    name: "Data Ingestion Worker & Event Consumer"
    technology: "Python Celery, Amazon SQS/Kafka"
    description: "Processes asynchronous clickstream events and triggers asynchronous feature updates."
relationships:
  - source: "API Router / Controller"
    destination: "Model Cache Layer"
    description: "Fetches cached recommendations [Redis Protocol with TLS]"
  - source: "API Router / Controller"
    destination: "Recommendation Engine"
    description: "Computes fallback and tail recommendations [In-process Python call]"
  - source: "Data Ingestion Worker & Event Consumer"
    destination: "Model Cache Layer"
    description: "Updates cached embeddings [Redis Protocol]"
  - source: "API Router / Controller"
    destination: "Data Ingestion Worker & Event Consumer"
    description: "Triggers asynchronous feature updates [In-process Celery task dispatch]"