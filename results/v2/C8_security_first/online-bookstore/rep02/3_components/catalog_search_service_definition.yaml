level: component
scope: "Component diagram for the Catalog & Search Service container"
parentContainer:
  name: "Catalog & Search Service"
elements:
  - type: "component"
    name: "Search & Catalog API Router"
    technology: "Express.js, TypeScript"
    description: "Routes catalogue and search requests and validates JWT claims."
  - type: "component"
    name: "Catalog Business Logic"
    technology: "Node.js"
    description: "Handles core business logic, delegates requests, and executes sanitized queries."
  - type: "component"
    name: "Elasticsearch Client"
    technology: "@elastic/elasticsearch"
    description: "Executes sanitized, typo-tolerant DSL queries against the search backend."
  - type: "component"
    name: "Distributed Cache Client"
    technology: "ioredis"
    description: "Fetches cached multi-currency search payloads from the in-memory cache."
relationships:
  - source: "Search & Catalog API Router"
    destination: "Catalog Business Logic"
    description: "Delegates HTTP/gRPC requests and validates JWT claims [Internal Function Call]"
  - source: "Catalog Business Logic"
    destination: "Distributed Cache Client"
    description: "Fetches cached multi-currency search payloads [TCP / Redis Protocol over TLS]"
  - source: "Catalog Business Logic"
    destination: "Elasticsearch Client"
    description: "Executes sanitized, typo-tolerant DSL queries [Internal Function Call]"