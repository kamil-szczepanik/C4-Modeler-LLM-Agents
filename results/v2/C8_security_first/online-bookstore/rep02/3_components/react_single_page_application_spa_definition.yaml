level: component
scope: "Component diagram for the React Single Page Application (SPA) container"
parentContainer:
  name: "React Single Page Application (SPA)"
elements:
  - type: "component"
    name: "Routing & Shell Component"
    technology: "React, React Router"
    description: "Manages application navigation and shell layout, loading other UI components dynamically in-memory."
  - type: "component"
    name: "Catalogue & Search UI Component"
    technology: "React, Zustand"
    description: "Provides secure catalogue browsing and search capabilities with client-side state management."
  - type: "component"
    name: "Checkout & Cart UI Component"
    technology: "React, React Hook Form"
    description: "Handles cart management and checkout forms."
  - type: "component"
    name: "API Client Component"
    technology: "Axios / Fetch API"
    description: "Communicates via TypeScript interfaces and async calls to send API requests to backend services."
  - type: "component"
    name: "Localization & Session Context Provider"
    technology: "React Context"
    description: "Manages localization (USD, EUR, GBP) and session context."
  - type: "component"
    name: "Telemetry & Analytics Wrapper"
    technology: "React"
    description: "Handles telemetry and analytics with centralized sanitization ensuring GDPR and CCPA compliance."
relationships:
  - source: "Routing & Shell Component"
    destination: "Catalogue & Search UI Component"
    description: "Loads dynamically in-memory"
  - source: "Routing & Shell Component"
    destination: "Checkout & Cart UI Component"
    description: "Loads dynamically in-memory"
  - source: "Catalogue & Search UI Component"
    destination: "API Client Component"
    description: "Communicates via TypeScript interfaces and async calls"
  - source: "Checkout & Cart UI Component"
    destination: "API Client Component"
    description: "Communicates via TypeScript interfaces and async calls"