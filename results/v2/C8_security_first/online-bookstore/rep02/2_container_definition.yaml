level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Shoppers / Customers"
    description: "End-users browsing catalogues and executing checkouts."
  - type: "person"
    name: "Book Publishers / Administrators"
    description: "Internal actors managing inventory and content moderation."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system for processing financial transactions."
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "External system managing logistics and fulfillment."
  - type: "container"
    name: "React Single Page Application (SPA)"
    technology: "React, Amazon S3, Amazon CloudFront"
    description: "Provides catalogue browsing, secure checkout, 5-star reviews, and recommendations interface."
  - type: "container"
    name: "AWS API Gateway & Edge Lambda"
    technology: "AWS API Gateway, AWS Lambda"
    description: "Entry point for client requests, handling routing and edge security."
  - type: "container"
    name: "Catalog & Search Service"
    technology: "Node.js, Express, Elasticsearch"
    description: "Manages book catalogue browsing, search, and indexing."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Java, Spring Boot, Amazon Aurora PostgreSQL, Redis"
    description: "Handles secure checkout, orders, and cart caching."
  - type: "container"
    name: "Recommendation Service"
    technology: "Python, FastAPI"
    description: "Provides personalized book recommendations to shoppers."
relationships:
  - source: "Shoppers / Customers"
    destination: "React Single Page Application (SPA)"
    description: "Browse catalogue, checkout, review, and view recommendations"
    technology: "HTTPS"
  - source: "Book Publishers / Administrators"
    destination: "React Single Page Application (SPA)"
    description: "Manage inventory and content"
    technology: "HTTPS"
  - source: "React Single Page Application (SPA)"
    destination: "AWS API Gateway & Edge Lambda"
    description: "Sends API requests"
    technology: "HTTPS/JSON"
  - source: "AWS API Gateway & Edge Lambda"
    destination: "Catalog & Search Service"
    description: "Routes catalogue and search requests"
    technology: "gRPC over mTLS with JWT"
  - source: "AWS API Gateway & Edge Lambda"
    destination: "Order & Checkout Service"
    description: "Routes order and checkout requests"
    technology: "gRPC over mTLS with JWT"
  - source: "AWS API Gateway & Edge Lambda"
    destination: "Recommendation Service"
    description: "Routes recommendation requests"
    technology: "gRPC over mTLS with JWT"
  - source: "Order & Checkout Service"
    destination: "Payment Gateway"
    description: "Processes financial transactions"
    technology: "HTTPS"
  - source: "Order & Checkout Service"
    destination: "Third-Party Shipping APIs"
    description: "Transmits fulfillment data"
    technology: "HTTPS"