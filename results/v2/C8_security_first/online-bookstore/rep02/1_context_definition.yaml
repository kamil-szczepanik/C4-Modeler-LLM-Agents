level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "A globally distributed e-commerce platform built to provide fast, secure book purchasing, personalized recommendations, and reviews, handling high-scale retail operations while enforcing multi-region availability and data privacy compliance."
elements:
  - type: "person"
    name: "Shoppers / Customers"
    description: "End-users browsing catalogues and executing checkouts."
  - type: "person"
    name: "Book Publishers / Administrators"
    description: "Internal actors managing inventory and content moderation."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system for processing financial transactions."
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "External system managing logistics and fulfillment."
relationships:
  - source: "Shoppers / Customers"
    destination: "Online Bookstore System"
    description: "Browse, cart, checkout, and review"
    technology: "HTTPS (TLS 1.3)"
  - source: "Book Publishers / Administrators"
    destination: "Online Bookstore System"
    description: "Manage catalogue and moderation"
    technology: "HTTPS with MFA"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Process financial transactions"
    technology: "REST/JSON APIs"
  - source: "Online Bookstore System"
    destination: "Third-Party Shipping APIs"
    description: "Transmit fulfillment data with circuit breakers"
    technology: "REST/JSON APIs"