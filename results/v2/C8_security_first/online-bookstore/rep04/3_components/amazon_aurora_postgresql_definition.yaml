level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL container"
parentContainer:
  name: "Amazon Aurora PostgreSQL"
elements:
  - type: "component"
    name: "Primary Writer Database Instance"
    technology: "PostgreSQL"
    description: "Handles write operations and primary data persistence for orders and transactions."
  - type: "component"
    name: "Read Replica Database Instances"
    technology: "PostgreSQL"
    description: "Handles read-only queries for catalog browsing and product details across multiple regions."
relationships:
  - source: "Order & Checkout Service"
    destination: "Primary Writer Database Instance"
    description: "Performs write operations using PostgreSQL wire protocol via TLS 1.3"
  - source: "Catalog Service"
    destination: "Read Replica Database Instances"
    description: "Performs read operations using PostgreSQL wire protocol via TLS 1.3"