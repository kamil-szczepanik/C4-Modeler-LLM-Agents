level: component
scope: "Component diagram for the Amazon OpenSearch container"
parentContainer:
  name: "Amazon OpenSearch"
elements:
  - type: "component"
    name: "REST API Handler Component"
    technology: "HTTPS REST API with SigV4"
    description: "Receives secure HTTPS requests via SigV4."
  - type: "component"
    name: "Search Engine Component"
    technology: "Apache Lucene Core"
    description: "Executes inverted-index searches and multi-language tokenization."
  - type: "component"
    name: "Index Management Component"
    technology: "OpenSearch Index Manager"
    description: "Manages shard allocation, replica sync, and snapshots."
  - type: "component"
    name: "Data Storage Component"
    technology: "EBS gp3 block storage with AWS KMS"
    description: "Provides encrypted block storage for search indices."
  - type: "component"
    name: "Async Event Emitter Component"
    technology: "In-memory queue"
    description: "Offloads search telemetry."
  - type: "component"
    name: "Catalog Service"
    technology: "Microservice"
    description: "Queries catalogue items."
  - type: "component"
    name: "Amazon Kinesis Data Streams"
    technology: "AWS Kinesis"
    description: "Exports search telemetry for merchandising analytics."
relationships:
  - source: "Catalog Service"
    destination: "REST API Handler Component"
    description: "Queries catalogue items [HTTPS/JSON, TLS 1.3, SigV4]"
  - source: "Search Engine Component"
    destination: "Data Storage Component"
    description: "Reads and writes data [POSIX block I/O]"
  - source: "Search Engine Component"
    destination: "Async Event Emitter Component"
    description: "Offloads metrics [In-memory queue]"
  - source: "Async Event Emitter Component"
    destination: "Amazon Kinesis Data Streams"
    description: "Exports search telemetry [HTTPS/JSON]"