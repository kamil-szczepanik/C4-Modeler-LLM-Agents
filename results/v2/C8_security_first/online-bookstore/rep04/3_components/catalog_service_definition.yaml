level: component
scope: "Component diagram for the Catalog Service container"
parentContainer:
  name: "Catalog Service"
elements:
  - type: "component"
    name: "Catalog API Controller"
    technology: "Express.js / Node.js"
    description: "Manages book discovery, search, pricing, and inventory status requests."
  - type: "component"
    name: "Search & Query Engine"
    technology: "TypeScript"
    description: "Processes search and query operations."
  - type: "component"
    name: "Pricing & Inventory Adapter"
    technology: "TypeScript"
    description: "Handles pricing and inventory status integrations."
  - type: "component"
    name: "Catalog Cache Manager"
    technology: "Redis / Amazon ElastiCache"
    description: "Caches frequent queries and pricing to meet performance goals."
  - type: "component"
    name: "Amazon OpenSearch"
    technology: "Amazon OpenSearch"
    description: "Delivers scalable keyword search and indexing."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Stores relational book metadata securely."
  - type: "component"
    name: "Order & Checkout Service"
    technology: "gRPC"
    description: "External service interacting with the Pricing & Inventory Adapter."
relationships:
  - source: "Catalog API Controller"
    destination: "Search & Query Engine"
    description: "In-memory TypeScript function calls"
  - source: "Search & Query Engine"
    destination: "Amazon OpenSearch"
    description: "HTTPS with TLS and IAM authentication"
  - source: "Search & Query Engine"
    destination: "Amazon Aurora PostgreSQL"
    description: "TCP with TLS and IAM authentication"
  - source: "Catalog API Controller"
    destination: "Catalog Cache Manager"
    description: "RESP over TLS to Amazon ElastiCache"
  - source: "Pricing & Inventory Adapter"
    destination: "Order & Checkout Service"
    description: "gRPC over mTLS"