level: component
scope: "Component diagram for the Frontend App container"
parentContainer:
  name: "Frontend App"
elements:
  - type: "component"
    name: "React Router"
    technology: "react-router"
    description: "Manages single-page application routing and navigation."
  - type: "component"
    name: "Localization Module"
    technology: "react-i18next"
    description: "Handles multi-language support and localization headers."
  - type: "component"
    name: "API Client"
    technology: "axios"
    description: "Sends HTTPS/JSON requests to the Amazon API Gateway."
  - type: "component"
    name: "UI Components"
    technology: "React SPA, Tailwind/CSS-in-JS"
    description: "Renders the user interface for shoppers and administrators."
relationships:
  - source: "React Router"
    destination: "UI Components"
    description: "Renders views based on route"
  - source: "UI Components"
    destination: "Localization Module"
    description: "Applies multi-currency and language formatting"
  - source: "UI Components"
    destination: "API Client"
    description: "Triggers API requests"
  - source: "API Client"
    destination: "Amazon API Gateway"
    description: "Sends API requests and localization headers [HTTPS/JSON]"