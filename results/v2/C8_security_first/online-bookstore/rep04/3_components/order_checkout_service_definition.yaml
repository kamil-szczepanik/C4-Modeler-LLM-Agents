level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Checkout Controller / Facade"
    technology: "Java, Spring Boot"
    description: "Handles incoming checkout requests and exposes endpoints for order processing."
  - type: "component"
    name: "Order Management Engine"
    technology: "Java, Spring Boot"
    description: "Core business logic engine managing the lifecycle and processing of orders."
  - type: "component"
    name: "Payment & Currency Gateway Client"
    technology: "Java, Spring Boot"
    description: "Client responsible for communicating with third-party payment gateways and currency services."
  - type: "component"
    name: "Fulfillment Coordinator"
    technology: "Java, Spring Boot"
    description: "Coordinates order fulfillment with third-party shipping providers."
  - type: "component"
    name: "Order Repository"
    technology: "JDBC, Spring Data"
    description: "Manages persistence of order and transactional data to Amazon Aurora PostgreSQL."
  - type: "component"
    name: "Transactional Outbox Processor"
    technology: "Java, Spring Boot"
    description: "Processes the outbox pattern to reliably publish domain events to AWS EventBridge."
relationships:
  - source: "Order Management Engine"
    destination: "Order Repository"
    description: "Manages persistence [JDBC over TLS/IAM]"
  - source: "Payment & Currency Gateway Client"
    destination: "Third-Party Payment Gateway"
    description: "Processes payments [HTTPS/REST]"
  - source: "Fulfillment Coordinator"
    destination: "Third-Party Shipping Provider"
    description: "Coordinates fulfillment [HTTPS/REST]"
  - source: "Transactional Outbox Processor"
    destination: "AWS EventBridge"
    description: "Publishes domain events [HTTPS/AWS SDK]"