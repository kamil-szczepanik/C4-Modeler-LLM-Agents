level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "API Router Component"
    technology: "Python, FastAPI"
    description: "Handles incoming HTTP requests from the API Gateway and routes validated requests."
  - type: "component"
    name: "Recommendation Orchestrator Component"
    technology: "Python"
    description: "Orchestrates recommendation logic and coordinates between the external engine client and analytics components."
  - type: "component"
    name: "External Engine Client Component"
    technology: "Python, Envoy"
    description: "Queries the third-party recommendation engine with circuit breakers and secure egress."
  - type: "component"
    name: "Recommendation Analytics & Feedback Component"
    technology: "Python, Amazon SQS / AWS EventBridge"
    description: "Emits interaction events asynchronously for non-blocking analytics."
relationships:
  - source: "API Router Component"
    destination: "Recommendation Orchestrator Component"
    description: "Forwards validated requests [Internal Python function call]"
  - source: "Recommendation Orchestrator Component"
    destination: "External Engine Client Component"
    description: "Queries external engine [Internal Python function call]"
  - source: "Recommendation Orchestrator Component"
    destination: "Recommendation Analytics & Feedback Component"
    description: "Emits interaction events [JSON over Amazon SQS / AWS EventBridge]"