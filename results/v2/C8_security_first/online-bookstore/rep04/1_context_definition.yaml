level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "A globally distributed, Amazon-style e-commerce platform designed to support physical and electronic book sales, personalized recommendations, and reviews."
elements:
  - type: "person"
    name: "Shopper"
    description: "End-user browsing catalogues, managing carts, purchasing books, and leaving reviews."
  - type: "person"
    name: "Administrator"
    description: "Staff managing catalogue inventory, pricing, and content moderation."
  - type: "externalSystem"
    name: "Third-Party Payment Gateway"
    description: "External PCI-DSS compliant system for secure checkout and tokenized payments."
  - type: "externalSystem"
    name: "Third-Party Shipping Provider"
    description: "External logistics service handling fulfillment dispatch and tracking."
  - type: "externalSystem"
    name: "Third-Party Currency Exchange Service"
    description: "External provider supplying real-time conversion rates for USD, EUR, and GBP."
  - type: "externalSystem"
    name: "Third-Party Recommendation Engine"
    description: "External service powering 'Customers also bought' cross-selling features."
relationships:
  - source: "Shopper"
    destination: "Online Bookstore System"
    description: "Browsing, authentication, and purchasing"
    technology: "HTTPS (TLS 1.2/1.3)"
  - source: "Administrator"
    destination: "Online Bookstore System"
    description: "Inventory, pricing, and content management"
    technology: "HTTPS (TLS 1.2/1.3)"
  - source: "Online Bookstore System"
    destination: "Third-Party Payment Gateway"
    description: "Tokenized payment processing"
    technology: "HTTPS/REST"
  - source: "Online Bookstore System"
    destination: "Third-Party Shipping Provider"
    description: "Fulfillment and tracking"
    technology: "HTTPS/REST/Webhooks"
  - source: "Online Bookstore System"
    destination: "Third-Party Currency Exchange Service"
    description: "FX rates acquisition"
    technology: "HTTPS/REST"
  - source: "Online Bookstore System"
    destination: "Third-Party Recommendation Engine"
    description: "Product recommendations"
    technology: "HTTPS/REST"