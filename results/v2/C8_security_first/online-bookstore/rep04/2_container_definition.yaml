level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Shopper"
    description: "End-user browsing catalogues, managing carts, purchasing books, and leaving reviews."
  - type: "person"
    name: "Administrator"
    description: "Staff managing catalogue inventory, pricing, and content moderation."
  - type: "externalSystem"
    name: "Third-Party Payment Gateway"
    description: "External PCI-DSS compliant system for secure checkout and tokenized payments."
  - type: "externalSystem"
    name: "Third-Party Shipping Provider"
    description: "External logistics service handling fulfillment dispatch and tracking."
  - type: "externalSystem"
    name: "Third-Party Currency Exchange Service"
    description: "External provider supplying real-time conversion rates."
  - type: "externalSystem"
    name: "Third-Party Recommendation Engine"
    description: "External service powering cross-selling features."
  - type: "container"
    name: "Frontend App"
    technology: "React SPA, Amazon CloudFront, Amazon S3"
    description: "Delivers the user interface for shoppers and administrators."
  - type: "container"
    name: "Amazon API Gateway"
    technology: "Amazon API Gateway"
    description: "Single entry point and rate limiter for backend services."
  - type: "container"
    name: "Catalog Service"
    technology: "Node.js, AWS ECS Fargate"
    description: "Manages book catalog data and retrieval."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Java, Spring Boot, AWS ECS Fargate"
    description: "Handles secure global checkout and order processing."
  - type: "container"
    name: "Recommendation Service"
    technology: "Python, FastAPI, AWS ECS Fargate"
    description: "Provides personalized recommendations to shoppers."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Multi-region transactional database persistence."
  - type: "container"
    name: "Amazon OpenSearch"
    technology: "Amazon OpenSearch"
    description: "Provides keyword search capabilities."
relationships:
  - source: "Shopper"
    destination: "Frontend App"
    description: "Browses and interacts with the store"
    technology: "HTTPS/JSON via browser"
  - source: "Administrator"
    destination: "Frontend App"
    description: "Administers the platform"
    technology: "HTTPS/JSON via browser"
  - source: "Frontend App"
    destination: "Amazon API Gateway"
    description: "Sends API requests with edge currency routing"
    technology: "HTTPS/JSON"
  - source: "Amazon API Gateway"
    destination: "Catalog Service"
    description: "Forwards catalog requests with JWT validation"
    technology: "HTTPS via AWS App Mesh"
  - source: "Amazon API Gateway"
    destination: "Order & Checkout Service"
    description: "Forwards order and checkout requests with JWT validation"
    technology: "HTTPS via AWS App Mesh"
  - source: "Amazon API Gateway"
    destination: "Recommendation Service"
    description: "Forwards recommendation requests with JWT validation"
    technology: "HTTPS via AWS App Mesh"
  - source: "Catalog Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists and retrieves catalog data"
    technology: "TLS with IAM authentication"
  - source: "Catalog Service"
    destination: "Amazon OpenSearch"
    description: "Indexes and searches catalog items"
    technology: "TLS with IAM authentication"
  - source: "Order & Checkout Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists order and transactional data"
    technology: "TLS with IAM authentication"
  - source: "Order & Checkout Service"
    destination: "Third-Party Payment Gateway"
    description: "Processes secure payments"
    technology: "HTTPS/REST"
  - source: "Order & Checkout Service"
    destination: "Third-Party Shipping Provider"
    description: "Coordinates fulfillment dispatch"
    technology: "HTTPS/REST"
  - source: "Recommendation Service"
    destination: "Third-Party Currency Exchange Service"
    description: "Retrieves real-time currency conversion rates"
    technology: "HTTPS/REST"
  - source: "Recommendation Service"
    destination: "Third-Party Recommendation Engine"
    description: "Fetches advanced recommendation data with circuit breakers"
    technology: "HTTPS API calls with Envoy"
  - source: "Catalog Service"
    destination: "Order & Checkout Service"
    description: "Communicates internally between microservices"
    technology: "gRPC over mTLS"
  - source: "Order & Checkout Service"
    destination: "Recommendation Service"
    description: "Communicates internally between microservices"
    technology: "gRPC over mTLS"