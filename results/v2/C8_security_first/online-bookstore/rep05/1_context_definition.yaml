level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore System"
  description: "A cloud-native e-commerce platform built to serve 1 million active users globally with high availability and regulatory compliance, providing secure catalogue browsing, multi-currency checkout, AI-driven recommendations, and automated customer data management."
elements:
  - type: "person"
    name: "Customers"
    description: "Shoppers/Readers browsing the catalogue and purchasing books globally."
  - type: "person"
    name: "Store Administrators"
    description: "Administrators managing the online bookstore system with MFA."
  - type: "externalSystem"
    name: "Stripe / PayPal"
    description: "Payment Gateway for processing secure multi-currency transactions."
  - type: "externalSystem"
    name: "FedEx / UPS"
    description: "Shipping Provider APIs for managing order deliveries."
  - type: "externalSystem"
    name: "AWS Cognito / Auth0"
    description: "Identity Provider for user authentication and authorization."
  - type: "externalSystem"
    name: "AWS SES / SendGrid"
    description: "Notification Service for sending transactional and system emails."
relationships:
  - source: "Customers"
    destination: "Online Bookstore System"
    description: "Interacts via Web/Mobile for browsing and purchasing"
    technology: "HTTPS (TLS 1.3)"
  - source: "Store Administrators"
    destination: "Online Bookstore System"
    description: "Manages the system using administrative interfaces with MFA"
    technology: "HTTPS (TLS 1.3, MFA)"
  - source: "Online Bookstore System"
    destination: "Stripe / PayPal"
    description: "Processes payments and handles financial transactions securely"
    technology: "HTTPS/REST (OAuth 2.0, Tokenization)"
  - source: "Online Bookstore System"
    destination: "FedEx / UPS"
    description: "Calculates shipping rates and manages order fulfillment"
    technology: "HTTPS/REST (API Key/HMAC)"
  - source: "Online Bookstore System"
    destination: "AWS Cognito / Auth0"
    description: "Authenticates users and manages identity sessions"
    technology: "HTTPS/REST (OIDC / OAuth 2.0)"
  - source: "Online Bookstore System"
    destination: "AWS SES / SendGrid"
    description: "Dispatches notifications and emails to users"
    technology: "HTTPS/REST"