level: component
scope: "Component diagram for the Amazon CloudFront / API Gateway / ALB container"
parentContainer:
  name: "Amazon CloudFront / API Gateway / ALB"
elements:
  - type: "component"
    name: "Route 53 DNS & Geo-Resolver"
    technology: "AWS Route 53"
    description: "Handles latency-based global DNS routing and geo-resolution for multi-currency localization."
  - type: "component"
    name: "CDN & Edge Caching"
    technology: "AWS CloudFront with Origin Shield"
    description: "Provides global CDN with TLS 1.3 termination, Origin Shield, and regional caching policies."
  - type: "component"
    name: "API Gateway & Edge Auth"
    technology: "AWS API Gateway, AWS Lambda Authorizer, AWS Cognito/Auth0"
    description: "Performs JWT validation, OAuth scope checking (`checkout:write`), and edge authentication."
  - type: "component"
    name: "Internal Application Load Balancer"
    technology: "AWS ALB"
    description: "Distributes internal traffic to microservices using gRPC health checks and forwards authorized traffic."
  - type: "component"
    name: "Security & Traffic Controls"
    technology: "AWS WAF, AWS Shield Advanced"
    description: "Handles OWASP Top-10 mitigation, rate-limiting, and bot control at the edge."
relationships:
  - source: "CDN & Edge Caching"
    destination: "API Gateway & Edge Auth"
    description: "Routes validated and WAF-inspected traffic [HTTPS]"
  - source: "API Gateway & Edge Auth"
    destination: "Internal Application Load Balancer"
    description: "Forwards authorized traffic with injected user context [HTTPS]"