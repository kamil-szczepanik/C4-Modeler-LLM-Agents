level: component
scope: "Component diagram for the Catalog & Search Service container"
parentContainer:
  name: "Catalog & Search Service"
elements:
  - type: "component"
    name: "API Router / Controller"
    technology: "Go / Node.js / Python FastAPI"
    description: "Routes incoming requests and dispatches internal queries and business logic execution."
  - type: "component"
    name: "Search Engine Component"
    technology: "Go / Node.js / Python FastAPI"
    description: "Indexes and retrieves search documents."
  - type: "component"
    name: "Catalog Management Component"
    technology: "Go / Node.js / Python FastAPI"
    description: "Manages product metadata and publishes inventory and pricing mutation events."
  - type: "component"
    name: "Event Consumer / Publisher Component"
    technology: "Go / Node.js / Python FastAPI"
    description: "Publishes and consumes catalog update events asynchronously."
relationships:
  - source: "API Router / Controller"
    destination: "Search Engine Component"
    description: "Internal query dispatch and business logic execution [REST / gRPC]"
  - source: "API Router / Controller"
    destination: "Catalog Management Component"
    description: "Internal query dispatch and business logic execution [REST / gRPC]"
  - source: "Catalog Management Component"
    destination: "Amazon Aurora PostgreSQL Global Database"
    description: "Persists product metadata [SQL over TLS]"
  - source: "Search Engine Component"
    destination: "AWS OpenSearch Service"
    description: "Indexes and retrieves search documents [HTTP over TLS, AWS SigV4]"
  - source: "Catalog Management Component"
    destination: "Amazon SNS"
    description: "Publishes inventory and pricing mutation events [HTTPS]"
  - source: "Amazon SQS"
    destination: "Event Consumer / Publisher Component"
    description: "Ingests catalog update events via polling [SQS Polling]"