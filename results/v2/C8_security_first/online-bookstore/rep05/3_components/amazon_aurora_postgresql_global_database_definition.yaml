level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL Global Database container"
parentContainer:
  name: "Amazon Aurora PostgreSQL Global Database"
elements:
  - type: "component"
    name: "Primary Database Instance (Writer)"
    technology: "Amazon Aurora PostgreSQL-Compatible Edition"
    description: "Handles transactional writes and maintains data consistency in us-east-1."
  - type: "component"
    name: "Cross-Region Read Replica Instance (EU)"
    technology: "Amazon Aurora PostgreSQL-Compatible Edition"
    description: "Supports local read-only traffic and low-latency catalog browsing in eu-west-1."
  - type: "component"
    name: "Cross-Region Read Replica Instance (AP)"
    technology: "Amazon Aurora PostgreSQL-Compatible Edition"
    description: "Supports local read-only traffic and low-latency catalog browsing in ap-southeast-1."
  - type: "component"
    name: "Global Database Proxy"
    technology: "AWS RDS Proxy"
    description: "Manages connection pooling and backend routing across all active regions."
relationships:
  - source: "Global Database Proxy"
    destination: "Primary Database Instance (Writer)"
    description: "Manages connection pooling and backend routing [Pooled PostgreSQL connections]"
  - source: "Global Database Proxy"
    destination: "Cross-Region Read Replica Instance (EU)"
    description: "Manages connection pooling and backend routing [Pooled PostgreSQL connections]"
  - source: "Global Database Proxy"
    destination: "Cross-Region Read Replica Instance (AP)"
    description: "Manages connection pooling and backend routing [Pooled PostgreSQL connections]"
  - source: "Primary Database Instance (Writer)"
    destination: "Cross-Region Read Replica Instance (EU)"
    description: "Replicates storage data [AWS proprietary high-speed backbone using default encryption]"
  - source: "Primary Database Instance (Writer)"
    destination: "Cross-Region Read Replica Instance (AP)"
    description: "Replicates storage data [AWS proprietary high-speed backbone using default encryption]"