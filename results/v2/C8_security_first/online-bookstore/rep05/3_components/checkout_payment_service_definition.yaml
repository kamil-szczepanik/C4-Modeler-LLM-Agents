level: component
scope: "Component diagram for the Checkout & Payment Service container"
parentContainer:
  name: "Checkout & Payment Service"
elements:
  - type: "component"
    name: "Cart Manager"
    technology: "Go, Redis"
    description: "Manages shopping cart persistence and state using in-memory Redis."
  - type: "component"
    name: "Checkout Orchestrator"
    technology: "Go"
    description: "Orchestrates the secure checkout and payment transaction workflow."
  - type: "component"
    name: "Payment Gateway Adapter"
    technology: "Go, HTTPS"
    description: "Adapts and communicates with external payment gateways like Stripe and PayPal."
  - type: "component"
    name: "Fulfillment Integration Component"
    technology: "Go, AWS SDK, AMQP"
    description: "Integrates with external shipping providers and message queues for order fulfillment."
relationships:
  - source: "Checkout Orchestrator"
    destination: "Cart Manager"
    description: "Redis protocol / In-memory"
  - source: "Checkout Orchestrator"
    destination: "Payment Gateway Adapter"
    description: "Internal Function Call"
  - source: "Checkout Orchestrator"
    destination: "Fulfillment Integration Component"
    description: "Internal Function Call"
  - source: "Checkout Orchestrator"
    destination: "Amazon Aurora PostgreSQL Global Database"
    description: "SQL over TLS"
  - source: "Payment Gateway Adapter"
    destination: "Stripe / PayPal"
    description: "HTTPS"
  - source: "Fulfillment Integration Component"
    destination: "FedEx / UPS"
    description: "HTTPS"
  - source: "Fulfillment Integration Component"
    destination: "Amazon SQS / SNS"
    description: "AWS SDK / AMQP"