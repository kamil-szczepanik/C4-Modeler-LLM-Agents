level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "API Handler"
    technology: "Python / FastAPI"
    description: "Handles incoming API requests and forwards validated recommendation requests."
  - type: "component"
    name: "Recommendation Engine"
    technology: "Python / FastAPI"
    description: "Processes recommendation logic and reads pre-computed recommendation vectors."
  - type: "component"
    name: "Cache & Ingestion Worker"
    technology: "Go"
    description: "Processes asynchronous clickstream and order events to update cached recommendation data."
relationships:
  - source: "API Handler"
    destination: "Recommendation Engine"
    description: "Forwards validated recommendation requests [gRPC]"
  - source: "Recommendation Engine"
    destination: "Amazon ElastiCache (Redis)"
    description: "Reads pre-computed recommendation vectors [RESP over TLS, <10ms]"
  - source: "Amazon SQS"
    destination: "Cache & Ingestion Worker"
    description: "Delivers asynchronous clickstream and order events [HTTPS/SQS SDK]"
  - source: "Cache & Ingestion Worker"
    destination: "Amazon ElastiCache (Redis)"
    description: "Updates cached recommendation data [RESP over TLS]"
  - source: "Recommendation Service"
    destination: "Amazon Aurora PostgreSQL Global Database"
    description: "Reads necessary transactional metadata [SQL over TLS]"