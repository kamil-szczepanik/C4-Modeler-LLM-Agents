level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Customers"
    description: "Shoppers/Readers browsing the catalogue and purchasing books globally."
  - type: "person"
    name: "Store Administrators"
    description: "Administrators managing the online bookstore system with MFA."
  - type: "person"
    name: "Content/Marketing Managers"
    description: "Managers overseeing content and marketing within the bookstore system."
  - type: "externalSystem"
    name: "Stripe / PayPal"
    description: "Payment Gateway for processing secure multi-currency transactions."
  - type: "externalSystem"
    name: "FedEx / UPS"
    description: "Shipping Provider APIs for managing order deliveries."
  - type: "externalSystem"
    name: "AWS Cognito / Auth0"
    description: "Identity Provider for user authentication and authorization."
  - type: "externalSystem"
    name: "AWS SES / SendGrid"
    description: "Notification Service for sending transactional and system emails."
  - type: "container"
    name: "Single Page Application"
    technology: "React / TypeScript, Amazon S3 + CloudFront CDN"
    description: "Provides catalogue browsing, secure checkout, customer reviews, and personalized recommendations."
  - type: "container"
    name: "Amazon CloudFront / API Gateway / ALB"
    technology: "AWS CloudFront, AWS API Gateway, ALB, Route 53"
    description: "Edge layer routing incoming traffic and securing entry points."
  - type: "container"
    name: "Catalog & Search Service"
    technology: "Go, Node.js, Python / FastAPI, AWS ECS Fargate, Elasticsearch"
    description: "Handles catalogue browsing and keyword catalogue search."
  - type: "container"
    name: "Checkout & Payment Service"
    technology: "Go, Node.js, Python / FastAPI, AWS ECS Fargate, Redis"
    description: "Manages secure checkout, multi-currency transactions, and cart state locking."
  - type: "container"
    name: "Recommendation Service"
    technology: "Go, Node.js, Python / FastAPI, AWS ECS Fargate"
    description: "Provides personalized recommendations to customers."
  - type: "container"
    name: "Amazon Aurora PostgreSQL Global Database"
    technology: "Amazon Aurora PostgreSQL"
    description: "Provides multi-region active-active replication and persistent data storage."
  - type: "container"
    name: "Amazon SQS / SNS"
    technology: "Amazon SQS, Amazon SNS"
    description: "Handles asynchronous messaging for shipping events and service decoupling."
relationships:
  - source: "Customers"
    destination: "Single Page Application"
    description: "Browses catalogue, manages cart, and places orders"
    technology: "HTTPS (REST / GraphQL)"
  - source: "Store Administrators"
    destination: "Single Page Application"
    description: "Manages store settings and catalogue data"
    technology: "HTTPS (REST / GraphQL)"
  - source: "Content/Marketing Managers"
    destination: "Single Page Application"
    description: "Manages content and marketing campaigns"
    technology: "HTTPS (REST / GraphQL)"
  - source: "Single Page Application"
    destination: "Amazon CloudFront / API Gateway / ALB"
    description: "Sends API requests through edge routing"
    technology: "HTTPS (REST / GraphQL)"
  - source: "Amazon CloudFront / API Gateway / ALB"
    destination: "Catalog & Search Service"
    description: "Routes requests to catalogue and search backend"
    technology: "HTTPS, gRPC (internal service mesh)"
  - source: "Amazon CloudFront / API Gateway / ALB"
    destination: "Checkout & Payment Service"
    description: "Routes requests to checkout backend"
    technology: "HTTPS, gRPC (internal service mesh)"
  - source: "Amazon CloudFront / API Gateway / ALB"
    destination: "Recommendation Service"
    description: "Routes requests to recommendation backend"
    technology: "HTTPS, gRPC (internal service mesh)"
  - source: "Catalog & Search Service"
    destination: "Amazon Aurora PostgreSQL Global Database"
    description: "Reads and writes catalogue data"
    technology: "SQL over TLS"
  - source: "Checkout & Payment Service"
    destination: "Amazon Aurora PostgreSQL Global Database"
    description: "Reads and writes order and transaction data"
    technology: "SQL over TLS"
  - source: "Recommendation Service"
    destination: "Amazon Aurora PostgreSQL Global Database"
    description: "Reads user interaction and product data"
    technology: "SQL over TLS"
  - source: "Checkout & Payment Service"
    destination: "Amazon SQS / SNS"
    description: "Publishes asynchronous shipping and order events"
    technology: "AMQP / AWS SQS/SNS"
  - source: "Checkout & Payment Service"
    destination: "Stripe / PayPal"
    description: "Processes secure payments"
    technology: "HTTPS"
  - source: "Checkout & Payment Service"
    destination: "FedEx / UPS"
    description: "Coordinates order fulfillment and shipping"
    technology: "HTTPS"
  - source: "Checkout & Payment Service"
    destination: "AWS Cognito / Auth0"
    description: "Validates authentication and authorization tokens"
    technology: "OAuth2/OIDC"
  - source: "Checkout & Payment Service"
    destination: "AWS SES / SendGrid"
    description: "Sends transactional emails"
    technology: "HTTPS"