level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Customer"
    description: "Customer browsing, purchasing, and interacting with the bookstore."
  - type: "person"
    name: "Book Author / Publisher"
    description: "Provider of book inventory and publishing content."
  - type: "person"
    name: "Customer Support Agent"
    description: "Support staff handling customer inquiries and disputes."
  - type: "person"
    name: "Shipping Partner"
    description: "Logistics personnel interacting with fulfillment data."
  - type: "person"
    name: "Site Administrator"
    description: "Administrator managing platform content and configurations."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processing service handling tokenized transactions."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "External shipping services providing automated fulfillment."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External service for sending transactional emails and alerts."
  - type: "externalSystem"
    name: "Currency Exchange API"
    description: "External API providing real-time currency conversion."
  - type: "container"
    name: "Single-Page Application"
    technology: "React, Amazon S3, Amazon CloudFront"
    description: "Frontend user interface hosted globally for low-latency delivery."
  - type: "container"
    name: "AWS API Gateway"
    technology: "AWS API Gateway"
    description: "Ingress gateway securing and managing incoming API requests."
  - type: "container"
    name: "Envoy Service Mesh"
    technology: "Envoy, SPIFFE/SPIRE"
    description: "Manages internal service communication via mTLS."
  - type: "container"
    name: "Catalog Service"
    technology: "Node.js, Express, AWS ECS on Fargate"
    description: "Manages book catalog browsing and search."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Java, Spring Boot, AWS ECS on Fargate"
    description: "Handles secure checkout and order processing."
  - type: "container"
    name: "Recommendation Service"
    technology: "Python, FastAPI, AWS ECS on Fargate"
    description: "Provides personalized book recommendations."
  - type: "container"
    name: "Customer Service"
    technology: "Go, AWS ECS on Fargate"
    description: "Manages customer-related operations."
  - type: "container"
    name: "Admin & Support Service"
    technology: "Node.js, GraphQL, AWS ECS on Fargate"
    description: "Provides backend support for administrative and support tasks."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL, AWS KMS"
    description: "Primary transactional database with multi-region replication."
  - type: "container"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache (Redis)"
    description: "Caches shopping cart state and improves performance."
  - type: "container"
    name: "Amazon S3"
    technology: "Amazon S3"
    description: "Object storage for application assets and backups."
  - type: "container"
    name: "Amazon EventBridge"
    technology: "Amazon EventBridge, AWS KMS"
    description: "Event bus for asynchronous messaging."
  - type: "container"
    name: "Amazon SQS"
    technology: "Amazon SQS, AWS KMS"
    description: "Message queue for asynchronous processing."
relationships:
  - source: "Customer"
    destination: "Single-Page Application"
    description: "Browses catalog, manages cart, and places orders"
    technology: "HTTPS (TLS 1.3)"
  - source: "Site Administrator"
    destination: "Single-Page Application"
    description: "Manages platform configuration and content"
    technology: "HTTPS (TLS 1.3)"
  - source: "Customer Support Agent"
    destination: "Single-Page Application"
    description: "Handles customer support inquiries"
    technology: "HTTPS (TLS 1.3)"
  - source: "Single-Page Application"
    destination: "AWS API Gateway"
    description: "Makes API requests"
    technology: "HTTPS (TLS 1.3)"
  - source: "AWS API Gateway"
    destination: "Envoy Service Mesh"
    description: "Routes ingress traffic to internal microservices"
    technology: "gRPC over mTLS"
  - source: "Envoy Service Mesh"
    destination: "Catalog Service"
    description: "Routes catalog requests"
    technology: "gRPC over mTLS"
  - source: "Envoy Service Mesh"
    destination: "Order & Checkout Service"
    description: "Routes order and checkout requests"
    technology: "gRPC over mTLS"
  - source: "Envoy Service Mesh"
    destination: "Recommendation Service"
    description: "Routes recommendation requests"
    technology: "gRPC over mTLS"
  - source: "Envoy Service Mesh"
    destination: "Customer Service"
    description: "Routes customer requests"
    technology: "gRPC over mTLS"
  - source: "Envoy Service Mesh"
    destination: "Admin & Support Service"
    description: "Routes admin and support requests"
    technology: "gRPC over mTLS"
  - source: "Order & Checkout Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes order data"
    technology: "PostgreSQL Wire Protocol over TLS"
  - source: "Catalog Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes catalog data"
    technology: "PostgreSQL Wire Protocol over TLS"
  - source: "Order & Checkout Service"
    destination: "Amazon ElastiCache (Redis)"
    description: "Stores shopping cart state"
    technology: "Redis Protocol over TLS"
  - source: "Order & Checkout Service"
    destination: "Amazon SQS"
    description: "Publishes order events asynchronously"
    technology: "AWS SDK / HTTPS"
  - source: "Order & Checkout Service"
    destination: "Amazon EventBridge"
    description: "Publishes domain events"
    technology: "AWS SDK / HTTPS"
  - source: "Order & Checkout Service"
    destination: "Payment Gateway"
    description: "Processes tokenized payments"
    technology: "REST/JSON over HTTPS"
  - source: "Order & Checkout Service"
    destination: "Shipping Provider APIs"
    description: "Coordinates fulfillment and tracking"
    technology: "REST/JSON over HTTPS"
  - source: "Customer Service"
    destination: "Notification Service"
    description: "Sends transactional emails and alerts"
    technology: "REST/JSON over HTTPS"
  - source: "Catalog Service"
    destination: "Currency Exchange API"
    description: "Fetches multi-currency conversion rates"
    technology: "REST/JSON over HTTPS"