level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "A globally scaled e-commerce platform built on AWS to provide book purchasing, recommendations, and reviews, delivering a secure, multi-currency retail experience supporting 1 million monthly active users across multiple regions."
elements:
  - type: "person"
    name: "Customer"
    description: "End user who browses, searches, and purchases books, leaves reviews, and manages their account."
  - type: "person"
    name: "Book Author / Publisher"
    description: "Provider of book inventory, metadata, and publishing content."
  - type: "person"
    name: "Customer Support Agent"
    description: "Support staff handling customer inquiries, order issues, and dispute resolutions."
  - type: "person"
    name: "Shipping Partner"
    description: "Logistics personnel interacting with fulfillment and tracking data."
  - type: "person"
    name: "Site Administrator / Content Manager"
    description: "Administrator managing platform content, configuration, and security controls."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processing service handling tokenized transactions securely."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "External shipping services providing automated fulfillment and logistics."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External service for sending transactional emails and alerts."
  - type: "externalSystem"
    name: "Currency Exchange API"
    description: "External API providing real-time multi-currency conversion rates."
  - type: "container"
    name: "AWS Route 53"
    description: "Provides latency-based routing and DNS failover for global multi-region scalability."
    technology: "AWS Route 53"
  - type: "container"
    name: "AWS WAF"
    description: "Web Application Firewall for security and OWASP Top-10 mitigation."
    technology: "AWS WAF"
  - type: "container"
    name: "AWS API Gateway"
    description: "Manages and secures incoming API requests."
    technology: "AWS API Gateway"
  - type: "container"
    name: "AWS Secrets Manager"
    description: "Secures and rotates application secrets and credentials."
    technology: "AWS Secrets Manager"
  - type: "container"
    name: "AWS KMS"
    description: "Provides encryption at rest (AES-256) and key management."
    technology: "AWS KMS"
  - type: "container"
    name: "AWS ElastiCache (Redis)"
    description: "Provides local caching for high availability and low latency."
    technology: "AWS ElastiCache (Redis)"
relationships:
  - source: "Customer"
    destination: "Online Bookstore"
    description: "Browsing, search, and checkout"
    technology: "HTTPS (TLS 1.3) with OAuth 2.0/OIDC and MFA"
  - source: "Site Administrator / Content Manager"
    destination: "Online Bookstore"
    description: "Administrative access and content management"
    technology: "HTTPS (TLS 1.3) restricted via RBAC and AWS IAM"
  - source: "Online Bookstore"
    destination: "Payment Gateway"
    description: "Tokenized transactions"
    technology: "HTTPS/REST"
  - source: "Online Bookstore"
    destination: "Shipping Provider APIs"
    description: "Automated fulfillment"
    technology: "HTTPS/REST"
  - source: "Online Bookstore"
    destination: "Notification Service"
    description: "Transactional emails"
    technology: "HTTPS/SMTP"
  - source: "Online Bookstore"
    destination: "Currency Exchange API"
    description: "Multi-currency conversion"
    technology: "HTTPS/REST"