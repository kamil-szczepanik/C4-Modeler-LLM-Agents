level: component
scope: "Component diagram for the Envoy Service Mesh container"
parentContainer:
  name: "Envoy Service Mesh"
elements:
  - type: "component"
    name: "Envoy Proxy Edge Router"
    technology: "Envoy, C++"
    description: "Handles edge ingress routing, TLS termination, and forwards authenticated traffic to internal services."
  - type: "component"
    name: "SPIFFE/SPIRE Workload Attestation Agent"
    technology: "SPIFFE/SPIRE"
    description: "Provides automated workload identity and issues X.509 certificates for mTLS communication."
  - type: "component"
    name: "Authorization Policy Enforcer"
    technology: "Open Policy Agent (OPA), ext_authz"
    description: "Enforces strict RBAC and fine-grained access control policies for inter-service traffic."
relationships:
  - source: "Envoy Proxy Edge Router"
    destination: "Authorization Policy Enforcer"
    description: "Validates ingress and inter-service requests via ext_authz"
  - source: "Envoy Proxy Edge Router"
    destination: "SPIFFE/SPIRE Workload Attestation Agent"
    description: "Retrieves mTLS certificates for secure workload identification"