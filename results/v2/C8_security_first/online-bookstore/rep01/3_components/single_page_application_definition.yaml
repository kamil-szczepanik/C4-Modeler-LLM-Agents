level: component
scope: "Component diagram for the Single-Page Application container"
parentContainer:
  name: "Single-Page Application"
elements:
  - type: "component"
    name: "Routing & Shell Component"
    technology: "React Router"
    description: "Client-side routing and route-based code splitting."
  - type: "component"
    name: "State Management Component"
    technology: "Redux Toolkit / React Query"
    description: "Client-side caching and state synchronization."
  - type: "component"
    name: "API Client Component"
    technology: "Axios / Fetch wrapper"
    description: "Communicates with backend APIs and manages HTTP requests."
  - type: "component"
    name: "Error Boundary Component"
    technology: "React Error Boundary"
    description: "Catches JavaScript errors anywhere in their child component tree and displays fallback UI."
  - type: "component"
    name: "Localization & Currency Component"
    technology: "i18next"
    description: "Multi-currency and multi-language internationalization."
  - type: "component"
    name: "AWS API Gateway"
    technology: "Amazon Web Services"
    description: "API Gateway for routing client requests to backend services."
  - type: "component"
    name: "Amazon CloudFront"
    technology: "Amazon Web Services"
    description: "Global CDN for low-latency edge delivery and cache invalidation of SPA assets."
relationships:
  - source: "Routing & Shell Component"
    destination: "State Management Component"
    description: "Renders [In-memory]"
  - source: "Routing & Shell Component"
    destination: "API Client Component"
    description: "Renders [In-memory]"
  - source: "Routing & Shell Component"
    destination: "Error Boundary Component"
    description: "Renders [In-memory]"
  - source: "Routing & Shell Component"
    destination: "Localization & Currency Component"
    description: "Renders [In-memory]"
  - source: "API Client Component"
    destination: "AWS API Gateway"
    description: "Interacts with [HTTPS (TLS 1.3)]"
  - source: "Single-Page Application"
    destination: "Amazon CloudFront"
    description: "Assets served globally via [HTTPS (TLS 1.3)]"