level: component
scope: "Component diagram for the Admin & Support Service container"
parentContainer:
  name: "Admin & Support Service"
elements:
  - type: "component"
    name: "GraphQL Gateway & Schema Engine"
    technology: "Node.js, Apollo Server"
    description: "Provides flexible GraphQL querying to minimize round-trips for support agents while enforcing query complexity limits."
  - type: "component"
    name: "Authorization & Context Middleware"
    technology: "Node.js Middleware"
    description: "Handles strict RBAC/ABAC and security context enforcement."
  - type: "component"
    name: "Admin Core Domain Module"
    technology: "Node.js"
    description: "Enables catalog moderation and regional pricing management."
  - type: "component"
    name: "Support Core Domain Module"
    technology: "Node.js"
    description: "Handles customer support capabilities and dispute resolution."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "Node.js, AWS KMS"
    description: "Ships immutable audit logs ensuring strict compliance with GDPR and CCPA."
relationships:
  - source: "Envoy Service Mesh"
    destination: "GraphQL Gateway & Schema Engine"
    description: "Routes inbound requests [gRPC over mTLS]"
  - source: "Admin Core Domain Module"
    destination: "Amazon Aurora PostgreSQL"
    description: "Executes transactional queries [PostgreSQL over TLS with IAM Auth]"
  - source: "Support Core Domain Module"
    destination: "Amazon Aurora PostgreSQL"
    description: "Executes transactional queries [PostgreSQL over TLS with IAM Auth]"
  - source: "Admin Core Domain Module"
    destination: "Catalog Service"
    description: "Synchronous RPC [gRPC over mTLS]"
  - source: "Support Core Domain Module"
    destination: "Order & Checkout Service"
    description: "Synchronous RPC [gRPC over mTLS]"
  - source: "Audit & Compliance Logger"
    destination: "Amazon CloudWatch"
    description: "Ships immutable audit logs [HTTPS with AWS KMS]"