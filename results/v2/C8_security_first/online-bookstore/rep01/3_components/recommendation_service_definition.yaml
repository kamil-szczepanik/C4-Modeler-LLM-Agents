level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "API Controller"
    technology: "FastAPI module"
    description: "Manages incoming gRPC/REST traffic from the Envoy Service Mesh."
  - type: "component"
    name: "Recommendation Engine"
    technology: "Python module"
    description: "Processes suggestion algorithms and personalization."
  - type: "component"
    name: "Recommendation Formatter / Explainer"
    technology: "Python module"
    description: "Appends transparency context tags (e.g., 'Because you bought X')."
  - type: "component"
    name: "Event Consumer"
    technology: "Asynchronous background component"
    description: "Processes real-time events."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "In-memory data store"
    description: "In-memory data store for pre-computed recommendation vectors and feature caching."
  - type: "component"
    name: "Amazon SQS & Amazon EventBridge"
    technology: "Messaging infrastructure"
    description: "Messaging infrastructure for asynchronous event streaming."
relationships:
  - source: "API Controller"
    destination: "Recommendation Engine"
    description: "Executes in-process logic [Python]."
  - source: "Recommendation Engine"
    destination: "Amazon ElastiCache (Redis)"
    description: "Reads/writes cached vectors [RESP over TCP with TLS]."
  - source: "Amazon SQS & Amazon EventBridge"
    destination: "Event Consumer"
    description: "Delivers domain events [HTTPS/SQS API]."
  - source: "Event Consumer"
    destination: "Amazon ElastiCache (Redis)"
    description: "Updates feature cache [RESP over TCP with TLS]."