level: component
scope: "Component diagram for the Customer Service container"
parentContainer:
  name: "Customer Service"
elements:
  - type: "component"
    name: "Profile Handler"
    technology: "Go"
    description: "Managing user account details and communication preferences."
  - type: "component"
    name: "Support Ticket Manager"
    technology: "Go"
    description: "Handling inquiry lifecycles and agent interactions."
  - type: "component"
    name: "Data Access Repository"
    technology: "Go, pgx"
    description: "Utilizing pgx for database persistence."
  - type: "component"
    name: "Cache Manager"
    technology: "Go"
    description: "Interfacing with Amazon ElastiCache (Redis)."
  - type: "component"
    name: "Event Publisher"
    technology: "Go"
    description: "Emitting domain events to Amazon EventBridge."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Primary relational database with AWS KMS encryption."
  - type: "component"
    name: "Envoy Service Mesh"
    technology: "Envoy"
    description: "Ingress and mesh proxy enforcing mTLS (SPIFFE/SPIRE)."
  - type: "component"
    name: "Notification Service"
    technology: "External Service"
    description: "External service handling ticket updates and emails."
  - type: "component"
    name: "Amazon EventBridge"
    technology: "Amazon EventBridge"
    description: "AWS event bus for asynchronous domain events."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache (Redis)"
    description: "In-memory cache for read-heavy customer profile metadata."
relationships:
  - source: "Envoy Service Mesh"
    destination: "Profile Handler"
    description: "Routes validated external/internal requests [gRPC/REST over mTLS]."
  - source: "Support Ticket Manager"
    destination: "Notification Service"
    description: "Triggers ticket updates and emails [REST over HTTPS]."
  - source: "Data Access Repository"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists and queries customer data [PostgreSQL wire protocol over TLS 1.3 with IAM authentication]."
  - source: "Event Publisher"
    destination: "Amazon EventBridge"
    description: "Emits asynchronous domain events [JSON over HTTPS]."
  - source: "Cache Manager"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches read-heavy customer profile metadata [Redis wire protocol over TLS]."