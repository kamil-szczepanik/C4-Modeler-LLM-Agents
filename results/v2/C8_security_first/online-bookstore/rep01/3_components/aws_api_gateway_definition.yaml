level: component
scope: "Component diagram for the AWS API Gateway container"
parentContainer:
  name: "AWS API Gateway"
elements:
  - type: "component"
    name: "Amazon API Gateway"
    technology: "Amazon API Gateway REST/HTTP APIs"
    description: "Handles incoming API requests from clients and manages routing."
  - type: "component"
    name: "AWS WAF"
    technology: "AWS WAF"
    description: "Provides global rate-limiting and OWASP Top-10 rule sets for security."
  - type: "component"
    name: "AWS Lambda"
    technology: "AWS Lambda"
    description: "Executes token validation and RBAC checks."
  - type: "component"
    name: "Amazon CloudWatch"
    technology: "Amazon CloudWatch"
    description: "Monitors API performance, logging, and metrics."
  - type: "component"
    name: "AWS X-Ray"
    technology: "AWS X-Ray"
    description: "Provides active tracing and SLA tracking for requests."
relationships:
  - source: "AWS WAF"
    destination: "Amazon API Gateway"
    description: "Inspects and filters incoming traffic"
  - source: "Amazon API Gateway"
    destination: "AWS Lambda"
    description: "Invokes token verification"
  - source: "Amazon API Gateway"
    destination: "Amazon CloudWatch"
    description: "Emits logs and metrics"
  - source: "Amazon API Gateway"
    destination: "AWS X-Ray"
    description: "Traces request lifecycle"