level: component
scope: "Component diagram for the Amazon SQS container"
parentContainer:
  name: "Amazon SQS"
elements:
  - type: "component"
    name: "Order & Checkout Service"
    technology: "Java, Spring Boot, AWS ECS on Fargate"
    description: "Enqueues order payloads using AWS SDK / HTTPS."
  - type: "component"
    name: "Queue Manager Engine"
    technology: "AWS SQS Managed"
    description: "Manages message queues for asynchronous decoupling and reliability."
  - type: "component"
    name: "Access Control & Encryption Module"
    technology: "AWS IAM, AWS KMS"
    description: "Validates policy and decrypts/encrypts data, enforcing least-privilege access and encryption at rest."
  - type: "component"
    name: "Dead Letter Queue (DLQ) Routing Component"
    technology: "Amazon SQS DLQ"
    description: "Offloads failed messages for error handling and analysis."
  - type: "component"
    name: "Inventory & Fulfillment Service"
    technology: "AWS ECS on Fargate"
    description: "Dispatches queued order events via SQS Long Polling."
  - type: "component"
    name: "Observability & Monitoring"
    technology: "Amazon CloudWatch, AWS X-Ray, AWS CloudTrail"
    description: "Provides scalability metrics, queue depth monitoring, and distributed tracing."
relationships:
  - source: "Order & Checkout Service"
    destination: "Queue Manager Engine"
    description: "Enqueues order payloads [AWS SDK / HTTPS]"
  - source: "Queue Manager Engine"
    destination: "Access Control & Encryption Module"
    description: "Validates policy and decrypts/encrypts [Internal AWS API]"
  - source: "Queue Manager Engine"
    destination: "Dead Letter Queue (DLQ) Routing Component"
    description: "Offloads failed messages [Internal AWS API]"
  - source: "Queue Manager Engine"
    destination: "Inventory & Fulfillment Service"
    description: "Dispatches queued order events [AWS SDK / SQS Long Polling]"