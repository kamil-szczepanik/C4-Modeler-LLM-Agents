level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL container"
parentContainer:
  name: "Amazon Aurora PostgreSQL"
elements:
  - type: "component"
    name: "Aurora Writer Node"
    technology: "AWS Aurora PostgreSQL Engine"
    description: "Handles database write operations and transactions for the order, checkout, and administrative services."
  - type: "component"
    name: "Aurora Reader Nodes"
    technology: "AWS Aurora PostgreSQL Engine"
    description: "Provides read-replica capabilities for scalable read operations, serving the catalog and recommendation services."
  - type: "component"
    name: "Aurora Storage Volume"
    technology: "Distributed Shared Storage"
    description: "Multi-AZ distributed storage volume backing the Aurora cluster for fault-tolerant persistence."
  - type: "component"
    name: "PgBouncer Connection Pooler"
    technology: "PgBouncer Sidecar"
    description: "Connection pooling sidecar managing incoming database connections and preventing connection exhaustion."
relationships:
  - source: "PgBouncer Connection Pooler"
    destination: "Aurora Writer Node"
    description: "Routes write requests over PostgreSQL Wire Protocol"
  - source: "PgBouncer Connection Pooler"
    destination: "Aurora Reader Nodes"
    description: "Routes read requests over PostgreSQL Wire Protocol"
  - source: "Aurora Writer Node"
    destination: "Aurora Storage Volume"
    description: "Persists transaction data"
  - source: "Aurora Reader Nodes"
    destination: "Aurora Storage Volume"
    description: "Reads replicated data"