level: component
scope: "Component diagram for the Amazon ElastiCache (Redis) container"
parentContainer:
  name: "Amazon ElastiCache (Redis)"
elements:
  - type: "component"
    name: "Session & Cart Store"
    technology: "Amazon ElastiCache (Redis) with Redis 6+ RBAC and AOF Persistence"
    description: "Manages session state and shopping carts, utilizing AWS KMS for encryption-at-rest of temporary PII."
  - type: "component"
    name: "Catalog Cache Manager"
    technology: "Amazon ElastiCache (Redis) with Redis 6+ RBAC"
    description: "Queries and updates cached catalog data with keyspace isolation."
  - type: "component"
    name: "Recommendation Cache Component"
    technology: "Amazon ElastiCache (Redis) with Redis 6+ RBAC"
    description: "Fetches pre-computed recommendations with keyspace isolation."
  - type: "component"
    name: "Order & Checkout Service"
    technology: "External Client"
    description: "Reads and writes cart state."
  - type: "component"
    name: "Catalog Service"
    technology: "External Client"
    description: "Queries and updates cached catalog data."
  - type: "component"
    name: "Recommendation Service"
    technology: "External Client"
    description: "Fetches pre-computed recommendations."
relationships:
  - source: "Order & Checkout Service"
    destination: "Session & Cart Store"
    description: "Reads and writes cart state [Redis Protocol over TLS]"
  - source: "Catalog Service"
    destination: "Catalog Cache Manager"
    description: "Queries and updates cached catalog data [Redis Protocol over TLS]"
  - source: "Recommendation Service"
    destination: "Recommendation Cache Component"
    description: "Fetches pre-computed recommendations [Redis Protocol over TLS]"