level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Order Controller"
    technology: "Java, Spring Boot"
    description: "Exposes REST and gRPC endpoints to handle incoming order placement and checkout requests."
  - type: "component"
    name: "Checkout Service"
    technology: "Java, Spring Boot"
    description: "Encapsulates business logic for validating carts, calculating totals, and coordinating payments."
  - type: "component"
    name: "Payment Integration Client"
    technology: "Java, Spring Boot, HTTPS"
    description: "Communicates with the external Payment Gateway to process tokenized payments."
  - type: "component"
    name: "Shipping Integration Client"
    technology: "Java, Spring Boot, HTTPS"
    description: "Coordinates fulfillment operations with external Shipping Provider APIs."
  - type: "component"
    name: "Event Publisher"
    technology: "Java, Spring Boot, AWS SDK"
    description: "Publishes domain events to Amazon SQS and Amazon EventBridge."
relationships:
  - source: "Order Controller"
    destination: "Checkout Service"
    description: "Delegates request processing [Method Call]"
  - source: "Checkout Service"
    destination: "Payment Integration Client"
    description: "Requests payment processing [REST/JSON over HTTPS]"
  - source: "Checkout Service"
    destination: "Shipping Integration Client"
    description: "Coordinates fulfillment [REST/JSON over HTTPS]"
  - source: "Checkout Service"
    destination: "Event Publisher"
    description: "Publishes domain events [AWS SDK / HTTPS]"