level: component
scope: "Component diagram for the Amazon EventBridge container"
parentContainer:
  name: "Amazon EventBridge"
elements:
  - type: "component"
    name: "Store Domain Event Bus"
    technology: "AWS EventBridge Custom Bus"
    description: "Receives and routes domain events from the Order & Checkout Service and other microservices."
  - type: "component"
    name: "Event Schema Registry"
    technology: "Amazon EventBridge Schema Registry"
    description: "Validates and manages event schemas for decoupled event-driven integration."
relationships:
  - source: "Store Domain Event Bus"
    destination: "Event Schema Registry"
    description: "Validates event payloads against registered schemas via AWS API"