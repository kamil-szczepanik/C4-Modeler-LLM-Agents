level: component
scope: "Component diagram for the Catalog Service container"
parentContainer:
  name: "Catalog Service"
elements:
  - type: "component"
    name: "Catalog Controller"
    technology: "Express Router"
    description: "Handles incoming HTTP/gRPC requests, input validation, and asynchronous event dispatch."
  - type: "component"
    name: "Search & Browse Engine"
    technology: "TypeScript"
    description: "Manages keyword search, input sanitization, SQL queries, and metadata faceting."
  - type: "component"
    name: "Currency Conversion Client"
    technology: "TypeScript / Opossum"
    description: "Integrates with the external Currency Exchange API using a circuit breaker and Amazon ElastiCache (Redis) for cached rates."
  - type: "component"
    name: "Event Publisher"
    technology: "AWS SDK"
    description: "Emits domain events using the AWS SDK."
  - type: "component"
    name: "Envoy Service Mesh"
    technology: "Envoy"
    description: "Routes incoming catalog requests [gRPC over mTLS / HTTPS over TLS]."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "PostgreSQL"
    description: "Queries catalog and faceted data [PostgreSQL Wire Protocol over TLS 1.3]."
  - type: "component"
    name: "Currency Exchange API"
    technology: "REST/JSON"
    description: "External API that fetches live exchange rates."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Redis"
    description: "Reads and writes cached rates [RESP over TLS]."
  - type: "component"
    name: "Amazon EventBridge"
    technology: "AWS EventBridge"
    description: "Emits book view events [HTTPS over TLS with AWS KMS]."
relationships:
  - source: "Envoy Service Mesh"
    destination: "Catalog Controller"
    description: "Routes incoming catalog requests [gRPC over mTLS / HTTPS over TLS]"
  - source: "Catalog Controller"
    destination: "Search & Browse Engine"
    description: "Executes internal operations [TypeScript]"
  - source: "Catalog Controller"
    destination: "Event Publisher"
    description: "Dispatches domain events [TypeScript]"
  - source: "Search & Browse Engine"
    destination: "Amazon Aurora PostgreSQL"
    description: "Queries catalog and faceted data [PostgreSQL Wire Protocol over TLS 1.3]"
  - source: "Currency Conversion Client"
    destination: "Currency Exchange API"
    description: "Fetches live exchange rates [REST/JSON over HTTPS]"
  - source: "Currency Conversion Client"
    destination: "Amazon ElastiCache (Redis)"
    description: "Reads and writes cached rates [RESP over TLS]"
  - source: "Event Publisher"
    destination: "Amazon EventBridge"
    description: "Emits book view events [HTTPS over TLS with AWS KMS]"