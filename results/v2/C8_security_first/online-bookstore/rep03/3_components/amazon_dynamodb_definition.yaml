level: component
scope: "Component diagram for the Amazon DynamoDB container"
parentContainer:
  name: "Amazon DynamoDB"
elements:
  - type: "component"
    name: "Request Router"
    technology: "DynamoDB Frontend Fleet"
    description: "Handles request parsing, IAM SigV4 authorization, and partition key hashing."
  - type: "component"
    name: "Storage Engine"
    technology: "Distributed B-tree/SSD storage"
    description: "Distributed B-tree/SSD storage partitions managed via AWS multi-AZ replication."
  - type: "component"
    name: "Stream Publisher Component"
    technology: "DynamoDB Streams"
    description: "Captures item-level modifications for asynchronous change data capture."
  - type: "component"
    name: "Global Tables"
    technology: "Multi-region replication"
    description: "Multi-region replication across us-east-1, eu-west-1, and ap-southeast-1."
relationships:
  - source: "Catalogue & Shopping Cart Services"
    destination: "Request Router"
    description: "Invoke CRUD operations using HTTPS / JSON over AWS PrivateLink VPC Endpoints."
  - source: "Request Router"
    destination: "Storage Engine"
    description: "Route partition-hashed requests via internal TCP/RPC over the AWS backbone."
  - source: "Stream Publisher Component"
    destination: "Recommendation Engine"
    description: "Push CDC change events securely using AWS Lambda and Amazon DynamoDB Streams."