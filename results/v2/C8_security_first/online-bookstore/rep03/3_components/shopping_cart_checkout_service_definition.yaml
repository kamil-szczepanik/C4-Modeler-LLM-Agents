level: component
scope: "Component diagram for the Shopping Cart & Checkout Service container"
parentContainer:
  name: "Shopping Cart & Checkout Service"
elements:
  - type: "component"
    name: "Cart Management Component"
    technology: "Node.js/TypeScript"
    description: "Manages shopping cart operations and interacts with persistence and caching layers."
  - type: "component"
    name: "Checkout Orchestrator Component"
    technology: "Node.js/TypeScript"
    description: "Orchestrates transactional orders and queues asynchronous fulfillment tasks."
  - type: "component"
    name: "Payment & Shipping Integration Component"
    technology: "Node.js/TypeScript"
    description: "Integrates with external payment gateways and shipping provider APIs to process payments and fulfillment."
  - type: "component"
    name: "Currency & Tax Adapter Component"
    technology: "Node.js/TypeScript"
    description: "Fetches multi-currency and tax data by communicating with the Localization & Currency Service."
relationships:
  - source: "Cart Management Component"
    destination: "Amazon DynamoDB & Amazon ElastiCache"
    description: "Persists and caches cart data [Internal VPC Connection]"
  - source: "Checkout Orchestrator Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "Stores transactional orders [Internal VPC Connection]"
  - source: "Checkout Orchestrator Component"
    destination: "Amazon SQS"
    description: "Queues asynchronous fulfillment tasks [Internal AWS API]"
  - source: "Payment & Shipping Integration Component"
    destination: "Payment Gateway & Shipping Provider APIs"
    description: "Processes payments and fulfillment [HTTPS/REST via AWS NAT Gateway]"
  - source: "Currency & Tax Adapter Component"
    destination: "Localization & Currency Service"
    description: "Fetches multi-currency and tax data [gRPC with mTLS]"