level: component
scope: "Component diagram for the Localization & Currency Service container"
parentContainer:
  name: "Localization & Currency Service"
elements:
  - type: "component"
    name: "Currency Conversion Component"
    technology: "Node.js / TypeScript, AWS ECS Fargate"
    description: "Handles secure, real-time multi-currency conversion and uses circuit breakers and stale-rate caching to isolate third-party dependencies from checkout traffic."
  - type: "component"
    name: "Exchange Rate Sync Worker"
    technology: "Node.js / TypeScript, AWS ECS Fargate"
    description: "Pulls rates from third-party financial APIs and retrieves credentials from AWS Secrets Manager."
  - type: "component"
    name: "Localization Mapping Component"
    technology: "Node.js / TypeScript, AWS ECS Fargate"
    description: "Performs localization mapping with zero-persistence in-memory handling to guarantee strict GDPR and CCPA compliance."
  - type: "component"
    name: "API Gateway & Security"
    technology: "AWS API Gateway, AWS WAF"
    description: "Routes internal traffic to the Localization & Currency Service via gRPC with mTLS."
  - type: "component"
    name: "Amazon ElastiCache"
    technology: "Amazon ElastiCache (Redis) Global Datastore"
    description: "Enables low-latency cross-region caching, rate fallbacks, and multi-region replication across us-east-1, eu-west-1, and ap-southeast-1."
  - type: "component"
    name: "AWS Secrets Manager"
    technology: "AWS Secrets Manager"
    description: "Secures external financial API credentials with automated rotation."
  - type: "component"
    name: "Third-Party Financial APIs"
    technology: "Third-Party API"
    description: "External APIs providing exchange rates and financial data."
relationships:
  - source: "API Gateway & Security"
    destination: "Currency Conversion Component"
    description: "Routes internal traffic via [gRPC with mTLS]"
  - source: "API Gateway & Security"
    destination: "Localization Mapping Component"
    description: "Routes internal traffic via [gRPC with mTLS]"
  - source: "Currency Conversion Component"
    destination: "Amazon ElastiCache"
    description: "Performs lookups via [Internal VPC Connection]"
  - source: "Localization Mapping Component"
    destination: "Amazon ElastiCache"
    description: "Performs lookups via [Internal VPC Connection]"
  - source: "Exchange Rate Sync Worker"
    destination: "Third-Party Financial APIs"
    description: "Pulls rates via [HTTPS]"
  - source: "Exchange Rate Sync Worker"
    destination: "AWS Secrets Manager"
    description: "Retrieves credentials via [AWS SDK / Internal API]"