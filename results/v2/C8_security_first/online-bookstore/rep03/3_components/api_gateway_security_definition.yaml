level: component
scope: "Component diagram for the API Gateway & Security container"
parentContainer:
  name: "API Gateway & Security"
elements:
  - type: "component"
    name: "API Gateway Router"
    technology: "AWS API Gateway"
    description: "Routes client requests to backend ECS Fargate services and manages entry points."
  - type: "component"
    name: "Perimeter Defense Filter"
    technology: "AWS WAF"
    description: "Protects the perimeter against common web exploits and OWASP Top-10 vulnerabilities."
  - type: "component"
    name: "Authorizer"
    technology: "AWS Lambda Authorizer"
    description: "Performs JWT validation and RBAC enforcement for incoming requests."
relationships:
  - source: "Perimeter Defense Filter"
    destination: "API Gateway Router"
    description: "Inspects and filters incoming HTTP/REST requests"
  - source: "API Gateway Router"
    destination: "Authorizer"
    description: "Invokes for token validation and access control"