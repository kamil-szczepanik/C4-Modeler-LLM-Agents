level: component
scope: "Component diagram for the Catalogue Service container"
parentContainer:
  name: "Catalogue Service"
elements:
  - type: "component"
    name: "Catalogue API Controller"
    technology: "Node.js (NestJS) or Go (Gin)"
    description: "Handles high-throughput, non-blocking I/O incoming requests from the API Gateway."
  - type: "component"
    name: "Search and Query Engine"
    technology: "Amazon ElastiCache Redis, Amazon DynamoDB"
    description: "Serves low-latency keyword searches and fast catalogue read models."
relationships:
  - source: "Catalogue API Controller"
    destination: "Search and Query Engine"
    description: "Queries fast catalogue read models and serves low-latency searches [Internal VPC Connection]"