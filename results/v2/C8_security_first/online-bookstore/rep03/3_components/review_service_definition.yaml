level: component
scope: "Component diagram for the Review Service container"
parentContainer:
  name: "Review Service"
elements:
  - type: "component"
    name: "Review Controller"
    technology: "Node.js/Express Component"
    description: "Handles incoming routing, gRPC traffic, and role-based JWT validation for review submissions."
  - type: "component"
    name: "Moderation & Sanitization Engine"
    technology: "Node.js Component"
    description: "Handles moderation workflows and sanitization of customer reviews and ratings."
  - type: "component"
    name: "Review Repository"
    technology: "TypeORM Component"
    description: "Manages data models and executes secure queries against Amazon Aurora PostgreSQL."
  - type: "component"
    name: "Rating Aggregator"
    technology: "Background Worker Component"
    description: "Processes background operations and aggregates ratings for the review system."
relationships:
  - source: "API Gateway & Security"
    destination: "Review Controller"
    description: "Routes gRPC traffic [gRPC with mTLS]"
  - source: "Review Repository"
    destination: "Amazon Aurora PostgreSQL"
    description: "Executes SQL queries [TCP/5432 via VPC, TLS 1.3]"
  - source: "Review Service"
    destination: "Notification Service"
    description: "Publishes review prompt events [Amazon SNS/SQS, JSON]"
  - source: "Review Service"
    destination: "Amazon EventBridge"
    description: "Publishes ReviewCreated and RatingUpdated domain events [JSON via AWS SDK]"
  - source: "Amazon EventBridge"
    destination: "Catalogue Service"
    description: "Dispatches rating updates [JSON over SQS/EventBridge]"