level: component
scope: "Component diagram for the Amazon ElastiCache container"
parentContainer:
  name: "Amazon ElastiCache"
elements:
  - type: "component"
    name: "Cache Management Engine"
    technology: "Redis OSS v7.0+"
    description: "In-memory cache engine for ultra-fast multi-currency exchange rate lookups and ephemeral session tokens."
  - type: "component"
    name: "Cache Data Store"
    technology: "In-Memory Key-Value Store"
    description: "Stores session state, cart tokens, and frequently accessed localization data for low-latency retrieval."
relationships:
  - source: "Cache Management Engine"
    destination: "Cache Data Store"
    description: "Executes GET/SET commands over TCP/TLS [RESP]"