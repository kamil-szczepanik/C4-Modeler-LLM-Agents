level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Shopper / Reviewer"
    description: "External users browsing catalogues, managing carts, submitting reviews, and purchasing books."
  - type: "person"
    name: "Store Administrator"
    description: "Internal users managing inventory, order disputes, and sales metrics."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe or PayPal handling PCI-DSS compliant transactions."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "FedEx or UPS for order fulfillment."
  - type: "externalSystem"
    name: "Recommendation Engine"
    description: "AWS Personalize providing machine-learning personalization."
  - type: "externalSystem"
    name: "Notification Service"
    description: "SendGrid or Twilio managing transactional emails, SMS, and MFA codes."
  - type: "container"
    name: "Single Page Application"
    technology: "React, TypeScript, Amazon CloudFront, Amazon S3"
    description: "Client-side user experience hosted on Amazon CloudFront and S3."
  - type: "container"
    name: "API Gateway & Security"
    technology: "AWS API Gateway, AWS WAF"
    description: "Manages and secures incoming API traffic."
  - type: "container"
    name: "Catalogue Service"
    technology: "AWS ECS Fargate"
    description: "Manages book catalogues and product data."
  - type: "container"
    name: "Shopping Cart & Checkout Service"
    technology: "AWS ECS Fargate"
    description: "Manages user shopping carts and processes checkout and orders."
  - type: "container"
    name: "Review Service"
    technology: "AWS ECS Fargate"
    description: "Handles user review submissions and ratings."
  - type: "container"
    name: "Localization & Currency Service"
    technology: "AWS ECS Fargate"
    description: "Manages multiple currencies and localization requirements."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Transactional database for checkout data."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Low-latency database for catalogue and cart reads."
  - type: "container"
    name: "Amazon ElastiCache"
    technology: "Amazon ElastiCache (Redis)"
    description: "Caching layer for ultra-fast multi-currency exchange rate lookups."
relationships:
  - source: "Shopper / Reviewer"
    destination: "Single Page Application"
    description: "Accesses static assets and interacts with the UI"
    technology: "HTTPS"
  - source: "Store Administrator"
    destination: "Single Page Application"
    description: "Accesses admin features via the UI"
    technology: "HTTPS"
  - source: "Single Page Application"
    destination: "API Gateway & Security"
    description: "Communicates via REST APIs"
    technology: "HTTPS/REST"
  - source: "API Gateway & Security"
    destination: "Catalogue Service"
    description: "Routes internal traffic"
    technology: "gRPC with mTLS"
  - source: "API Gateway & Security"
    destination: "Shopping Cart & Checkout Service"
    description: "Routes internal traffic"
    technology: "gRPC with mTLS"
  - source: "API Gateway & Security"
    destination: "Review Service"
    description: "Routes internal traffic"
    technology: "gRPC with mTLS"
  - source: "API Gateway & Security"
    destination: "Localization & Currency Service"
    description: "Routes internal traffic"
    technology: "gRPC with mTLS"
  - source: "Shopping Cart & Checkout Service"
    destination: "Payment Gateway"
    description: "Connects for secure payment processing"
    technology: "HTTPS/REST through AWS NAT Gateway"
  - source: "Shopping Cart & Checkout Service"
    destination: "Shipping Provider APIs"
    description: "Connects for order fulfillment"
    technology: "HTTPS/REST through AWS NAT Gateway"
  - source: "Catalogue Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Queries transactional data"
    technology: "Internal VPC Connection"
  - source: "Shopping Cart & Checkout Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Queries transactional checkout data"
    technology: "Internal VPC Connection"
  - source: "Review Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Queries review data"
    technology: "Internal VPC Connection"
  - source: "Catalogue Service"
    destination: "Amazon DynamoDB"
    description: "Queries low-latency catalogue reads"
    technology: "Internal VPC Connection"
  - source: "Shopping Cart & Checkout Service"
    destination: "Amazon DynamoDB"
    description: "Queries cart reads"
    technology: "Internal VPC Connection"
  - source: "Localization & Currency Service"
    destination: "Amazon ElastiCache"
    description: "Performs multi-currency exchange rate lookups"
    technology: "Internal VPC Connection"