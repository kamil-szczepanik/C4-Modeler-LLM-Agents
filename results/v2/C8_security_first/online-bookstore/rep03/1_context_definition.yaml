level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "A scaled-down Amazon-style e-commerce site for physical and electronic books with recommendations, reviews, and multi-currency support, providing high availability and global scalability for 1 million monthly active users."
elements:
  - type: "person"
    name: "Shopper / Reviewer"
    description: "External users browsing catalogues, managing carts, submitting reviews, and purchasing books."
  - type: "person"
    name: "Store Administrator"
    description: "Internal users managing inventory, order disputes, and sales metrics."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe or PayPal handling PCI-DSS compliant transactions."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "FedEx or UPS for order fulfillment."
  - type: "externalSystem"
    name: "Recommendation Engine"
    description: "AWS Personalize providing machine-learning personalization."
  - type: "externalSystem"
    name: "Notification Service"
    description: "SendGrid or Twilio managing transactional emails, SMS, and MFA codes."
relationships:
  - source: "Shopper / Reviewer"
    destination: "Online Bookstore System"
    description: "Browsing, checkout, and reviews"
    technology: "HTTPS (TLS 1.3)"
  - source: "Store Administrator"
    destination: "Online Bookstore System"
    description: "Backend management"
    technology: "HTTPS (TLS 1.3) with OAuth 2.0/OIDC and MFA"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Secure payments with tokenization"
    technology: "Outbound HTTPS/REST"
  - source: "Online Bookstore System"
    destination: "Shipping Provider APIs"
    description: "Fulfillment data"
    technology: "Outbound HTTPS with mutual TLS (mTLS)"
  - source: "Online Bookstore System"
    destination: "Recommendation Engine"
    description: "Personalization payloads"
    technology: "Outbound HTTPS/REST"
  - source: "Online Bookstore System"
    destination: "Notification Service"
    description: "Customer alerts"
    technology: "Outbound HTTPS/REST"