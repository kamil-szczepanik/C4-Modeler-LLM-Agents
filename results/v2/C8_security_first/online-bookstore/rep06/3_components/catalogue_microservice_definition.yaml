# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Catalogue Microservice container"
parentContainer:
  name: "Catalogue Microservice"
elements:
  - type: "component"
    name: "Catalogue API Controller"
    technology: "Node.js/Spring Boot"
    description: "Processes search and catalog queries to drive user engagement while ensuring strict regulatory compliance."
  - type: "component"
    name: "Search & Indexing Engine"
    technology: "Java/Python"
    description: "Handles fast, typo-tolerant search and indexing capabilities."
  - type: "component"
    name: "Inventory Management Service"
    technology: "Spring Boot"
    description: "Manages book inventory, details, and relational persistence."
  - type: "component"
    name: "Event Synchronization Worker"
    technology: "Node.js/Java"
    description: "Synchronizes events to balance search performance with near-real-time inventory accuracy."
  - type: "component"
    name: "Amazon OpenSearch"
    technology: "AWS OpenSearch Service"
    description: "Stores search indexes for fast, typo-tolerant search capabilities."
  - type: "component"
    name: "PostgreSQL"
    technology: "Amazon RDS PostgreSQL"
    description: "Provides relational persistence for structured inventory data."
  - type: "component"
    name: "Amazon SQS"
    technology: "AWS SQS"
    description: "Provides reliable asynchronous event queuing."
relationships:
  - source: "API Gateway"
    destination: "Catalogue API Controller"
    description: "gRPC/HTTPS"
  - source: "Catalogue API Controller"
    destination: "Search & Indexing Engine"
    description: "HTTP/REST"
  - source: "Catalogue API Controller"
    destination: "Inventory Management Service"
    description: "In-process"
  - source: "Inventory Management Service"
    destination: "PostgreSQL"
    description: "JDBC/TCP, TLS 1.3"
  - source: "Inventory Management Service"
    destination: "Amazon SQS"
    description: "HTTPS"
  - source: "Event Synchronization Worker"
    destination: "Search & Indexing Engine"
    description: "In-process"
  - source: "Search & Indexing Engine"
    destination: "Amazon OpenSearch"
    description: "HTTPS"