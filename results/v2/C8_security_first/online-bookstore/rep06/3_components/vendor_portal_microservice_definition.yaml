level: component
scope: "Component diagram for the Vendor Portal Microservice container"
parentContainer:
  name: "Vendor Portal Microservice"
elements:
  - type: "component"
    name: "API Gateway & WAF"
    technology: "AWS API Gateway & WAF"
    description: "Entry point handling mutual TLS and JWT validation."
  - type: "component"
    name: "Ingestion & Processing Component"
    technology: "Node.js/Python stream worker pool"
    description: "Handles bulk uploads asynchronously."
  - type: "component"
    name: "Catalog & Inventory Management Component"
    technology: "NestJS"
    description: "Handling CRUD operations via gRPC."
  - type: "component"
    name: "Analytics Query Component"
    technology: "Read-optimized service"
    description: "Serving real-time sales KPIs from materialized views."
  - type: "component"
    name: "Async Error Publisher Component"
    technology: "AWS SDK module"
    description: "Generating S3 pre-signed error reports."
  - type: "component"
    name: "Notification Dispatcher Component"
    technology: "Module with circuit breakers"
    description: "Handling low-stock alerts."
  - type: "component"
    name: "Amazon SQS & DLQ"
    technology: "Amazon SQS"
    description: "Buffers bulk upload jobs and traps poison-pill messages."
  - type: "component"
    name: "Amazon S3"
    technology: "AWS S3"
    description: "Stores temporary structured error reports with 7-day lifecycles."
  - type: "component"
    name: "PostgreSQL"
    technology: "PostgreSQL"
    description: "Dedicated database with row-level security (RLS) and table partitioning."
  - type: "component"
    name: "AWS Secrets Manager & KMS"
    technology: "AWS Secrets Manager & KMS"
    description: "Manages encrypted secrets and data-at-rest encryption."
relationships:
  - source: "API Gateway & WAF"
    destination: "Ingestion & Processing Component"
    description: "HTTPS [REST/Multipart]"
  - source: "API Gateway & WAF"
    destination: "Catalog & Inventory Management Component"
    description: "gRPC"
  - source: "Ingestion & Processing Component"
    destination: "Amazon SQS & DLQ"
    description: "AWS SDK [Poll/Acknowledge]"
  - source: "Ingestion & Processing Component"
    destination: "Amazon S3"
    description: "HTTPS [PutObject/Presigned URLs]"
  - source: "Catalog & Inventory Management Component"
    destination: "PostgreSQL"
    description: "TLS 1.3 [SQL with RLS]"
  - source: "Catalog & Inventory Management Component"
    destination: "Notification Dispatcher Component"
    description: "gRPC [Low-Stock Event]"