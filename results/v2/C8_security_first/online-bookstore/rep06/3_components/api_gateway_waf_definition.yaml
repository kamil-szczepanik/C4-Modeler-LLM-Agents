level: component
scope: "Component diagram for the API Gateway & WAF container"
parentContainer:
  name: "API Gateway & WAF"
elements:
  - type: "component"
    name: "AWS WAF Rule Engine"
    technology: "AWS WAF & Shield Advanced"
    description: "Inspects incoming HTTPS requests for malicious traffic, bot protection, and OWASP vulnerabilities."
  - type: "component"
    name: "API Gateway Router"
    technology: "Amazon API Gateway"
    description: "Routes valid requests to downstream ECS Fargate microservices and injects context headers."
  - type: "component"
    name: "Service Mesh Proxy"
    technology: "AWS App Mesh (Envoy)"
    description: "Manages zero-trust mTLS and secure gRPC routing between the gateway and core microservices."
relationships:
  - source: "AWS WAF Rule Engine"
    destination: "API Gateway Router"
    description: "Filters and forwards clean HTTPS requests [TLS 1.3]"
  - source: "API Gateway Router"
    destination: "Service Mesh Proxy"
    description: "Routes requests with context headers [gRPC over mTLS]"