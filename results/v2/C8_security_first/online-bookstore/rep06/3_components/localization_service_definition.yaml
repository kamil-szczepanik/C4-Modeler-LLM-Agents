level: component
scope: "Component diagram for the Localization Service container"
parentContainer:
  name: "Localization Service"
elements:
  - type: "component"
    name: "Geo-Router Component"
    technology: "AWS Lambda@Edge (Node.js/JavaScript)"
    description: "Handles regional routing and geolocation-based user identification."
  - type: "component"
    name: "Currency & Translation Resolver Component"
    technology: "AWS Lambda@Edge (Node.js/JavaScript)"
    description: "Manages multi-currency conversion and language localization logic."
  - type: "component"
    name: "Cookie & Preference Manager Component"
    technology: "AWS Lambda@Edge (Node.js/JavaScript)"
    description: "Processes and manages user preference cookies and locale states."
  - type: "component"
    name: "Origin Request Transformer Component"
    technology: "AWS Lambda@Edge (Node.js/JavaScript)"
    description: "Injects custom headers like X-User-Currency and X-User-Locale into downstream requests."
relationships:
  - source: "Geo-Router Component"
    destination: "Cookie & Preference Manager Component"
    description: "Reads and updates user preferences and cookies"
  - source: "Cookie & Preference Manager Component"
    destination: "Currency & Translation Resolver Component"
    description: "Provides resolved context for currency and translation"
  - source: "Currency & Translation Resolver Component"
    destination: "Origin Request Transformer Component"
    description: "Passes resolved locale and currency data for header injection"