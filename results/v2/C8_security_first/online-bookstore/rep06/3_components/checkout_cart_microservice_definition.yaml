level: component
scope: "Component diagram for the Checkout & Cart Microservice container"
parentContainer:
  name: "Checkout & Cart Microservice"
elements:
  - type: "component"
    name: "Cart Management Component"
    technology: "Node.js/Express, PostgreSQL"
    description: "Handles shopping carts and cart persistence."
  - type: "component"
    name: "Checkout Orchestrator Component"
    technology: "Node.js/Express, PostgreSQL, Transaction Ledger"
    description: "Processes secure transactions and order fulfillment."
  - type: "component"
    name: "Fulfillment & Payment Publisher Component"
    technology: "Node.js/Express, AWS SDK"
    description: "Publishes payment and fulfillment events asynchronously."
  - type: "component"
    name: "Amazon SQS & Dead Letter Queues"
    technology: "Amazon SQS, DLQ"
    description: "Provides asynchronous message decoupling and resilience."
  - type: "component"
    name: "External Payment Gateway & Third-Party Shipping APIs"
    technology: "REST/HTTPS"
    description: "Handles external payment processing and shipping."
  - type: "component"
    name: "API Gateway"
    technology: "gRPC, HTTPS with mTLS"
    description: "Routes incoming traffic to the internal components."
  - type: "component"
    name: "PostgreSQL"
    technology: "PostgreSQL with Multi-AZ deployment"
    description: "Relational database providing ACID guarantees for order ledgers."
relationships:
  - source: "API Gateway"
    destination: "Cart Management Component"
    description: "gRPC and HTTPS with mTLS"
  - source: "API Gateway"
    destination: "Checkout Orchestrator Component"
    description: "gRPC and HTTPS with mTLS"
  - source: "Checkout Orchestrator Component"
    destination: "PostgreSQL"
    description: "TLS and SQL with connection pooling via PgBouncer"
  - source: "Fulfillment & Payment Publisher Component"
    destination: "Amazon SQS & Dead Letter Queues"
    description: "AWS SDK and HTTPS with AWS KMS CMK encryption"
  - source: "Fulfillment & Payment Publisher Component"
    destination: "External Payment Gateway & Third-Party Shipping APIs"
    description: "REST/HTTPS via SQS async queues"