level: component
scope: "Component diagram for the Review & Rating Microservice container"
parentContainer:
  name: "Review & Rating Microservice"
elements:
  - type: "component"
    name: "Review Controller"
    technology: "gRPC Server (HTTP/2, mTLS)"
    description: "Handles incoming gRPC requests for reviews and ratings from the API Gateway and downstream services."
  - type: "component"
    name: "Review Service"
    technology: "AWS ECS Fargate Container"
    description: "Contains business logic for processing reviews, ratings, and coordinating asynchronous messaging."
  - type: "component"
    name: "DynamoDB Client"
    technology: "AWS SDK (HTTPS)"
    description: "Interfaces with Amazon DynamoDB Global Tables and Amazon DAX for data persistence and caching."
  - type: "component"
    name: "Messaging Publisher"
    technology: "AWS SDK (HTTPS)"
    description: "Publishes asynchronous events to Amazon SQS and SNS."
relationships:
  - source: "Review Controller"
    destination: "Review Service"
    description: "Invokes business logic"
  - source: "Review Service"
    destination: "DynamoDB Client"
    description: "Reads and writes review data"
  - source: "Review Service"
    destination: "Messaging Publisher"
    description: "Dispatches asynchronous events"