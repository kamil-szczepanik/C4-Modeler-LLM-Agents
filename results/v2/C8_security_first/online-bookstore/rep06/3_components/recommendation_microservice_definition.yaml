level: component
scope: "Component diagram for the Recommendation Microservice container"
parentContainer:
  name: "Recommendation Microservice"
elements:
  - type: "component"
    name: "Recommendation API Controller"
    technology: "Go"
    description: "Handles incoming recommendation requests and coordinates the workflow."
  - type: "component"
    name: "Experiment Router"
    technology: "Go"
    description: "Evaluates variant context and routes requests to the appropriate model variant."
  - type: "component"
    name: "Scoring Engine"
    technology: "Python, NumPy"
    description: "Executes collaborative filtering algorithms for personalized scoring."
  - type: "component"
    name: "Cache & Fallback Manager"
    technology: "Go, go-redis"
    description: "Manages user-state caching and fallback logic for high availability."
  - type: "component"
    name: "Cold-Start Handler"
    technology: "Go"
    description: "Handles recommendations for new users with limited historical data."
  - type: "component"
    name: "Analytics Publisher"
    technology: "Go, AWS Kinesis Producer"
    description: "Emits click-through and conversion metrics asynchronously."
relationships:
  - source: "Recommendation API Controller"
    destination: "Experiment Router"
    description: "Evaluates variant context [In-memory Go function call]"
  - source: "Experiment Router"
    destination: "Scoring Engine"
    description: "Invokes selected model variant [gRPC over IPC]"
  - source: "Recommendation API Controller"
    destination: "Cache & Fallback Manager"
    description: "Fetches and updates user state [TCP, Redis AUTH, TLS]"
  - source: "Scoring Engine"
    destination: "Cache & Fallback Manager"
    description: "Fetches and updates user state [TCP, Redis AUTH, TLS]"
  - source: "Recommendation API Controller"
    destination: "Analytics Publisher"
    description: "Emits click-through and conversion metrics [AWS SDK, HTTPS]"