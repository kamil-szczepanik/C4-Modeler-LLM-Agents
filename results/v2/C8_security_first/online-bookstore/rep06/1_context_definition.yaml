level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "Globally scaled e-commerce platform designed to support catalogue browsing, secure checkout, 5-star reviews, and personalized recommendations for 1 million monthly active users."
elements:
  - type: "person"
    name: "Shoppers"
    description: "End-users browsing catalogues, managing carts, and purchasing books."
  - type: "person"
    name: "Vendors & Admins"
    description: "Internal users managing inventory, catalogue listings, and order disputes."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External PCI-compliant payment processor (Stripe/PayPal)."
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "External fulfillment and tracking providers (FedEx/UPS)."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External transactional email SaaS provider (AWS SES/SendGrid)."
  - type: "system"
    name: "Recommendation Engine"
    description: "Internal subsystem handling real-time 'Customers also bought' suggestions."
relationships:
  - source: "Shoppers"
    destination: "Online Bookstore"
    description: "Browse catalogues, search, and checkout"
    technology: "HTTPS via AWS CloudFront and WAF"
  - source: "Vendors & Admins"
    destination: "Online Bookstore"
    description: "Access management console for inventory and order disputes"
    technology: "HTTPS with enforced MFA"
  - source: "Online Bookstore"
    destination: "Payment Gateway"
    description: "Secure tokenized checkout transactions"
    technology: "REST/HTTPS"
  - source: "Online Bookstore"
    destination: "Third-Party Shipping APIs"
    description: "Fulfillment and tracking integration"
    technology: "REST/HTTPS"
  - source: "Online Bookstore"
    destination: "Notification Service"
    description: "Asynchronous transactional emails"
    technology: "REST/HTTPS over TLS 1.3"