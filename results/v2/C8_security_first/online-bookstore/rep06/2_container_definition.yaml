level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Shoppers"
    description: "End-users browsing catalogues, managing carts, and purchasing books."
  - type: "person"
    name: "Vendors & Admins"
    description: "Internal users managing inventory, catalogue listings, and order disputes."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External PCI-compliant payment processor (Stripe/PayPal)."
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "External fulfillment and tracking providers (FedEx/UPS)."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External transactional email SaaS provider (AWS SES/SendGrid)."
  - type: "container"
    name: "Single Page Application"
    technology: "React, AWS S3, CloudFront"
    description: "Frontend interface for shoppers and vendors hosted at the edge."
  - type: "container"
    name: "API Gateway & WAF"
    technology: "AWS API Gateway, AWS ALB, AWS WAF"
    description: "Entry point for all client requests providing security and routing."
  - type: "container"
    name: "Localization Service"
    technology: "AWS Lambda@Edge"
    description: "Edge service handling localization and regional routing."
  - type: "container"
    name: "Catalogue Microservice"
    technology: "AWS ECS Fargate, PostgreSQL, Amazon OpenSearch"
    description: "Manages book inventory, details, and search capabilities."
  - type: "container"
    name: "Checkout & Cart Microservice"
    technology: "AWS ECS Fargate, PostgreSQL, Amazon SQS"
    description: "Handles shopping carts, order processing, and payment/shipping queues."
  - type: "container"
    name: "Recommendation Microservice"
    technology: "AWS ECS Fargate, Redis"
    description: "Generates real-time personalized book recommendations."
  - type: "container"
    name: "Vendor Portal Microservice"
    technology: "AWS ECS Fargate, PostgreSQL"
    description: "Provides vendors and admins management tools for inventory and listings."
  - type: "container"
    name: "Review & Rating Microservice"
    technology: "AWS ECS Fargate, Amazon DynamoDB"
    description: "Manages user reviews, ratings, and feedback."
relationships:
  - source: "Shoppers"
    destination: "Single Page Application"
    description: "Browses catalogue, manages cart, and places orders"
    technology: "HTTPS via AWS CloudFront"
  - source: "Vendors & Admins"
    destination: "Single Page Application"
    description: "Accesses management portal for inventory and operations"
    technology: "HTTPS via AWS CloudFront"
  - source: "Single Page Application"
    destination: "API Gateway & WAF"
    description: "Sends API requests for data and transactions"
    technology: "HTTPS / REST"
  - source: "API Gateway & WAF"
    destination: "Catalogue Microservice"
    description: "Routes catalogue and search queries"
    technology: "gRPC and HTTPS"
  - source: "API Gateway & WAF"
    destination: "Checkout & Cart Microservice"
    description: "Routes cart and checkout operations"
    technology: "gRPC and HTTPS"
  - source: "API Gateway & WAF"
    destination: "Recommendation Microservice"
    description: "Requests personalized recommendations"
    technology: "gRPC and HTTPS"
  - source: "API Gateway & WAF"
    destination: "Vendor Portal Microservice"
    description: "Routes vendor management operations"
    technology: "gRPC and HTTPS"
  - source: "API Gateway & WAF"
    destination: "Review & Rating Microservice"
    description: "Routes review submissions and retrieval"
    technology: "gRPC and HTTPS"
  - source: "Checkout & Cart Microservice"
    destination: "Payment Gateway"
    description: "Processes secure tokenized transactions asynchronously"
    technology: "Amazon SQS and REST/HTTPS"
  - source: "Checkout & Cart Microservice"
    destination: "Third-Party Shipping APIs"
    description: "Dispatches order fulfillment data asynchronously"
    technology: "Amazon SQS and REST/HTTPS"