level: context
scope: "System Context diagram for Modern Insurance Platform"
system:
  name: "Modern Insurance Platform"
  description: "Gradually replaces a 30-year-old on-premise mainframe claims system with a modern cloud-native platform in Azure, maintaining business continuity and data consistency during a three-year hybrid migration period."
elements:
  - type: "person"
    name: "End Customers & Brokers"
    description: "Users who submit and manage online claims."
  - type: "person"
    name: "Claims Adjusters"
    description: "Users who review and process insurance claims."
  - type: "person"
    name: "Operations & Migration Team"
    description: "Team responsible for managing the hybrid migration and system operations."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise COBOL/DB2 system handling legacy claims and strict nightly batch windows."
  - type: "externalSystem"
    name: "Microsoft Entra ID"
    description: "Identity Provider for authentication and authorization using OIDC/OAuth 2.0."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Third-party SendGrid/Twilio service for sending out notifications."
relationships:
  - source: "End Customers & Brokers"
    destination: "Modern Insurance Platform"
    description: "Submit online claims"
    technology: "HTTPS (REST/GraphQL)"
  - source: "Claims Adjusters"
    destination: "Modern Insurance Platform"
    description: "Authenticate and process claims"
    technology: "HTTPS (OIDC/OAuth 2.0 via Entra ID)"
  - source: "Modern Insurance Platform"
    destination: "Legacy Mainframe"
    description: "Synchronize data and process claims via secure API Gateway and asynchronous messaging"
    technology: "mTLS over hybrid VPN/ExpressRoute"
  - source: "Legacy Mainframe"
    destination: "Modern Insurance Platform"
    description: "Send legacy system updates and maintain data consistency"
    technology: "mTLS over hybrid VPN/ExpressRoute"
  - source: "Modern Insurance Platform"
    destination: "Notification Service"
    description: "Trigger outbound notifications"
    technology: "HTTPS (REST API) via event-driven messaging"