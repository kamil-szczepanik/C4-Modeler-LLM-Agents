level: container
scope: "Container diagram for Modern Insurance Platform"
system:
  name: "Modern Insurance Platform"
elements:
  - type: "person"
    name: "End Customers & Brokers"
    description: "End users who submit and manage online claims."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff who review and process insurance claims."
  - type: "person"
    name: "Operations & Migration Team"
    description: "Team responsible for managing hybrid migration, monitoring, and operations."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "30-year-old on-premise COBOL/DB2 system handling legacy claims and nightly batch windows."
  - type: "externalSystem"
    name: "Microsoft Entra ID"
    description: "Identity Provider for authentication and authorization using OIDC."
  - type: "externalSystem"
    name: "Azure Service Bus"
    description: "Messaging service to queue messages during the mainframe batch window."
  - type: "externalSystem"
    name: "Azure Key Vault"
    description: "Stores customer-managed encryption keys (CMK) and secrets."
  - type: "container"
    name: "Customer Portal Container"
    description: "Web frontend allowing customers and brokers to interact with the claims system."
    technology: "Next.js / React"
  - type: "container"
    name: "Adjuster Web App Container"
    description: "Web frontend for claims adjusters to process and review claims."
    technology: "Next.js / React"
  - type: "container"
    name: "API Gateway"
    description: "Entry point managing external traffic, routing, and token validation."
    technology: "Azure Front Door / APIM"
  - type: "container"
    name: "Claims Orchestrator Container"
    description: "Core backend service handling claims workflow logic and orchestration."
    technology: "Node.js / .NET Core"
  - type: "container"
    name: "Legacy Mainframe Adapter Container"
    description: "Anti-corruption layer adapting modern requests to legacy mainframe protocols."
    technology: "Azure Container Apps"
  - type: "container"
    name: "Claims State Database"
    description: "Enterprise-grade transactional data store supporting Transactional Outbox pattern."
    technology: "Azure SQL / Azure Cosmos DB"
relationships:
  - source: "End Customers & Brokers"
    destination: "Customer Portal Container"
    description: "Submit and manage online claims"
    technology: "HTTPS/REST over TLS 1.3"
  - source: "Claims Adjusters"
    destination: "Adjuster Web App Container"
    description: "Review and process claims"
    technology: "HTTPS/REST over TLS 1.3"
  - source: "Customer Portal Container"
    destination: "API Gateway"
    description: "API requests with OIDC token validation"
    technology: "HTTPS/REST"
  - source: "Adjuster Web App Container"
    destination: "API Gateway"
    description: "API requests with OIDC token validation"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "Claims Orchestrator Container"
    description: "Routes requests to core backend"
    technology: "HTTPS/REST and gRPC"
  - source: "Claims Orchestrator Container"
    destination: "Claims State Database"
    description: "Reads and writes transactional state"
    technology: "Database Protocol"
  - source: "Claims Orchestrator Container"
    destination: "Legacy Mainframe Adapter Container"
    description: "Asynchronous messaging and synchronous requests"
    technology: "Azure Service Bus and gRPC"
  - source: "Legacy Mainframe Adapter Container"
    destination: "Legacy Mainframe"
    description: "Communicates with legacy CICS/MQ protocols"
    technology: "mTLS over Site-to-Site VPN / Azure ExpressRoute"
  - source: "Customer Portal Container"
    destination: "Microsoft Entra ID"
    description: "Validates OIDC tokens"
    technology: "OpenID Connect"
  - source: "Adjuster Web App Container"
    destination: "Microsoft Entra ID"
    description: "Validates OIDC tokens"
    technology: "OpenID Connect"
  - source: "Claims Orchestrator Container"
    destination: "Azure Key Vault"
    description: "Retrieves secrets and encryption keys"
    technology: "HTTPS / REST"