level: component
scope: "Component diagram for the Claims State Database container"
parentContainer:
  name: "Claims State Database"
elements:
  - type: "component"
    name: "Transactional Store Component"
    technology: "Azure SQL Database (PaaS)"
    description: "Manages ACID compliance and relational integrity."
  - type: "component"
    name: "Outbox Table Component"
    technology: "Azure SQL Database (PaaS)"
    description: "Implements the Transactional Outbox pattern for zero data loss."
  - type: "component"
    name: "Audit Log Component"
    technology: "Azure SQL Database (PaaS)"
    description: "Captures immutable change history for compliance."
  - type: "component"
    name: "Versioned State Schema Component"
    technology: "Azure SQL Database (PaaS)"
    description: "Tracks metadata like source system and version for 1-day rollbacks."
  - type: "component"
    name: "Change Data Capture (CDC) Component"
    technology: "Azure SQL Database (PaaS)"
    description: "Streams state changes for downstream event publishing."
relationships:
  - source: "Claims Orchestrator Container"
    destination: "Transactional Store Component"
    description: "Reads and writes claim aggregates [T-SQL via TDS / Azure Managed Identity, Port 1433]"
  - source: "Claims Orchestrator Container"
    destination: "Outbox Table Component"
    description: "Writes transactional events atomically [T-SQL]"
  - source: "Claims Orchestrator Container"
    destination: "Versioned State Schema Component"
    description: "Reads and updates claim aggregates [T-SQL via TDS]"