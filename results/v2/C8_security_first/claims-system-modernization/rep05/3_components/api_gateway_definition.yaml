level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Routing Engine"
    technology: "Azure API Management"
    description: "Acts as the entry point and trust boundary, performing edge routing, policy enforcement, and WAF protection."
  - type: "component"
    name: "Authentication Validator"
    technology: "Microsoft Entra ID / OIDC"
    description: "Validates incoming OIDC tokens for single sign-on and security enforcement."
  - type: "component"
    name: "Routing Rules Manager"
    technology: "Azure App Configuration"
    description: "Fetches externalized declarative routing rules for zero-downtime migrations."
  - type: "component"
    name: "Reference Data Cache Client"
    technology: "Azure Cache for Redis"
    description: "Reads and writes cached reference data to mitigate mainframe latency and achieve sub-2-second screen loads."
relationships:
  - source: "Edge Routing Engine"
    destination: "Authentication Validator"
    description: "Validates OIDC tokens from incoming API requests [HTTPS/REST]"
  - source: "Edge Routing Engine"
    destination: "Routing Rules Manager"
    description: "Fetches dynamic routing rules [HTTPS]"
  - source: "Edge Routing Engine"
    destination: "Reference Data Cache Client"
    description: "Reads/writes cached reference data [TCP]"
  - source: "Edge Routing Engine"
    destination: "Claims Orchestrator Container"
    description: "Routes requests to core backend [HTTPS/REST and gRPC]"
  - source: "Edge Routing Engine"
    destination: "Legacy Mainframe Adapter Container"
    description: "Routes unmigrated claim types [HTTPS/REST]"