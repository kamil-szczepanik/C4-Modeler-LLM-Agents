level: component
scope: "Component diagram for the Legacy Mainframe Adapter Container container"
parentContainer:
  name: "Legacy Mainframe Adapter Container"
elements:
  - type: "component"
    name: "Mainframe Protocol Adapter"
    technology: "Azure Container Apps / Node.js or .NET Core"
    description: "Handles translation between modern API requests/messages and legacy CICS/MQ protocols."
  - type: "component"
    name: "mTLS Security Handler"
    technology: "Azure Key Vault / TLS"
    description: "Manages secure mTLS connections and injects RACF/SAF mainframe credentials over Site-to-Site VPN / Azure ExpressRoute."
  - type: "component"
    name: "State & Idempotency Manager"
    technology: "Azure Cosmos DB Client"
    description: "Interacts with Azure Cosmos DB to track transaction state and ensure idempotency for legacy calls."
relationships:
  - source: "Mainframe Protocol Adapter"
    destination: "mTLS Security Handler"
    description: "Secures outgoing transactions using certificates"
  - source: "Mainframe Protocol Adapter"
    destination: "State & Idempotency Manager"
    description: "Persists transaction state and idempotency tracking"