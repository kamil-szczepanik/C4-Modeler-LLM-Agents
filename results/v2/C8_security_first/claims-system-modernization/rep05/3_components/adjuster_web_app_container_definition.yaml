level: component
scope: "Component diagram for the Adjuster Web App Container container"
parentContainer:
  name: "Adjuster Web App Container"
elements:
  - type: "component"
    name: "UI Presentation Layer"
    technology: "Next.js / React 18"
    description: "Dynamic adjuster views and optimistic UI patterns for reviewing and processing claims."
  - type: "component"
    name: "BFF API Route Handlers"
    technology: "Next.js API Routes"
    description: "Handles session state and token-exchange proxying."
  - type: "component"
    name: "Client-Side Cache & State Manager"
    technology: "TanStack Query (React Query) and IndexedDB"
    description: "Provides memory-only ephemeral caching and draft persistence."
  - type: "component"
    name: "Draft Persistence Manager"
    technology: "TypeScript"
    description: "Manages saving and restoring draft state."
relationships:
  - source: "UI Presentation Layer"
    destination: "BFF API Route Handlers"
    description: "Internal RPC [HTTPS]"
  - source: "UI Presentation Layer"
    destination: "Draft Persistence Manager"
    description: "Save/Restore draft state [TypeScript Function Calls]"
  - source: "Draft Persistence Manager"
    destination: "BFF API Route Handlers"
    description: "Sync draft state [HTTPS/REST]"