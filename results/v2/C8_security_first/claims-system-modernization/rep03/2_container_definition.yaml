level: container
scope: "Container diagram for Insurance Claims Modernization Platform"
system:
  name: "Insurance Claims Modernization Platform"
elements:
  - type: "person"
    name: "Customers & Brokers"
    description: "External actors who submit online claims and interact with the platform."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal actors who process and manage insurance claims."
  - type: "externalSystem"
    name: "Legacy Mainframe System"
    description: "On-Premises COBOL/DB2 System of Record representing the 30-year-old claims system."
  - type: "externalSystem"
    name: "Azure Active Directory / Entra ID"
    description: "Identity Provider for Single Sign-On and MFA."
  - type: "externalSystem"
    name: "Azure API Gateway with Rate Limiter"
    description: "Hybrid Boundary Protector isolating mainframe dependencies and handling rate limiting."
  - type: "container"
    name: "Customer Portal & Adjuster Web Apps"
    technology: "Azure Static Web Apps, Single Page App"
    description: "Frontends providing online claim submission and adjuster workflows."
  - type: "container"
    name: "Claim Management API"
    technology: "Azure Container Apps, .NET 8"
    description: "Backend microservice handling core claim management logic."
  - type: "container"
    name: "Claim Router / Anti-Corruption Layer (ACL)"
    technology: "Azure Container Apps, .NET 8"
    description: "Isolates modern components from mainframe latency and batch constraints."
  - type: "container"
    name: "Audit & Reconciliation Service"
    technology: "Azure Container Apps, .NET 8"
    description: "Handles audit logging and reconciliation with internal data stores."
  - type: "container"
    name: "Azure Service Bus"
    technology: "Azure Service Bus"
    description: "Messaging platform for decoupled, reliable eventing during mainframe batch windows."
  - type: "container"
    name: "Azure App Configuration"
    technology: "Azure App Configuration"
    description: "Centralized configuration management."
  - type: "container"
    name: "Azure SQL Database"
    technology: "Azure SQL Database"
    description: "Modern platform data store."
  - type: "container"
    name: "Azure Key Vault"
    technology: "Azure Key Vault"
    description: "Secret management via managed identities."
relationships:
  - source: "Customers & Brokers"
    destination: "Customer Portal & Adjuster Web Apps"
    description: "Accesses portal and web apps to submit claims"
    technology: "HTTPS/OIDC with MFA"
  - source: "Claims Adjusters"
    destination: "Customer Portal & Adjuster Web Apps"
    description: "Accesses web apps for adjuster workflows"
    technology: "HTTPS/OIDC with MFA"
  - source: "Customer Portal & Adjuster Web Apps"
    destination: "Azure API Gateway with Rate Limiter"
    description: "Routes frontend requests to backend services"
    technology: "HTTPS REST APIs"
  - source: "Azure API Gateway with Rate Limiter"
    destination: "Claim Management API"
    description: "Forwards API requests to claim management"
    technology: "HTTPS REST APIs"
  - source: "Azure API Gateway with Rate Limiter"
    destination: "Claim Router / Anti-Corruption Layer (ACL)"
    description: "Routes legacy-bound requests through ACL"
    technology: "HTTPS REST APIs"
  - source: "Claim Management API"
    destination: "Azure Service Bus"
    description: "Publishes asynchronous messages"
    technology: "AMQP over TLS"
  - source: "Claim Router / Anti-Corruption Layer (ACL)"
    destination: "Legacy Mainframe System"
    description: "Communicates with mainframe enforcing rate limiting and circuit breakers"
    technology: "mTLS over dedicated ExpressRoute / IPsec VPN tunnel"
  - source: "Audit & Reconciliation Service"
    destination: "Azure SQL Database"
    description: "Persists audit and reconciliation data"
    technology: "Entity Framework Core"
  - source: "Claim Management API"
    destination: "Azure SQL Database"
    description: "Reads and writes claim data"
    technology: "Entity Framework Core"
  - source: "Customer Portal & Adjuster Web Apps"
    destination: "Azure Active Directory / Entra ID"
    description: "Authenticates users"
    technology: "OIDC / OAuth 2.0"
  - source: "Claim Management API"
    destination: "Azure Key Vault"
    description: "Retrieves secrets and configuration"
    technology: "Managed Identities over HTTPS"
  - source: "Claim Router / Anti-Corruption Layer (ACL)"
    destination: "Azure Key Vault"
    description: "Retrieves secrets and configuration"
    technology: "Managed Identities over HTTPS"
  - source: "Audit & Reconciliation Service"
    destination: "Azure Key Vault"
    description: "Retrieves secrets and configuration"
    technology: "Managed Identities over HTTPS"