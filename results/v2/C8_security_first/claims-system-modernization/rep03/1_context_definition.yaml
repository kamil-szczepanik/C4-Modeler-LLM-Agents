level: context
scope: "System Context diagram for Insurance Claims Modernization Platform"
system:
  name: "Insurance Claims Modernization Platform"
  description: "A modern hybrid cloud platform on Azure gradually replacing a 30-year-old on-premise mainframe claims system while maintaining uninterrupted legacy processing, zero claim loss, and high availability."
elements:
  - type: "person"
    name: "Customers & Brokers"
    description: "External actors who submit online claims and interact with the platform."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal actors who process and manage insurance claims."
  - type: "externalSystem"
    name: "Legacy Mainframe System"
    description: "On-Premises COBOL/DB2 System of Record representing the 30-year-old claims system."
  - type: "externalSystem"
    name: "Azure Active Directory / Entra ID"
    description: "Identity Provider for Single Sign-On and MFA."
  - type: "externalSystem"
    name: "Azure API Gateway with Rate Limiter"
    description: "Hybrid Boundary Protector isolating mainframe dependencies and handling rate limiting."
relationships:
  - source: "Customers & Brokers"
    destination: "Insurance Claims Modernization Platform"
    description: "Submit online claims and interact with the system"
    technology: "HTTPS (TLS 1.3), REST/GraphQL, OAuth 2.0 / OIDC"
  - source: "Claims Adjusters"
    destination: "Insurance Claims Modernization Platform"
    description: "Process and manage claims"
    technology: "HTTPS (TLS 1.3), REST/GraphQL, OAuth 2.0 / OIDC"
  - source: "Insurance Claims Modernization Platform"
    destination: "Azure Active Directory / Entra ID"
    description: "Authenticate users and manage Single Sign-On and MFA"
    technology: "OIDC / Graph API"
  - source: "Insurance Claims Modernization Platform"
    destination: "Legacy Mainframe System"
    description: "Sync claims data and process legacy transactions"
    technology: "Azure ExpressRoute/VPN, mTLS, synchronous REST or asynchronous queues"