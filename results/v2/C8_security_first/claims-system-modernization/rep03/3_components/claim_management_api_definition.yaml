level: component
scope: "Component diagram for the Claim Management API container"
parentContainer:
  name: "Claim Management API"
elements:
  - type: "component"
    name: "API Controller Layer"
    technology: "ASP.NET Core Security & FluentValidation"
    description: "Handles incoming HTTP REST API requests, performs input validation, and secures endpoints."
  - type: "component"
    name: "MediatR Domain / Command Handlers"
    technology: ".NET 8 / MediatR"
    description: "Implements business logic and orchestrates commands and queries in-process."
  - type: "component"
    name: "Internal Routing Service & Anti-Corruption Layer (ACL)"
    technology: "HTTP/REST with Polly"
    description: "Routes requests and isolates the legacy mainframe using Polly resilience policies."
  - type: "component"
    name: "Entity Framework Core"
    technology: "EF Core with TDE"
    description: "Manages relational data persistence and interactions with the Azure SQL Database."
relationships:
  - source: "API Controller Layer"
    destination: "MediatR Domain / Command Handlers"
    description: "MediatR In-Process"
  - source: "MediatR Domain / Command Handlers"
    destination: "Internal Routing Service & Anti-Corruption Layer (ACL)"
    description: "HTTP/REST with Polly resilience policies"
  - source: "MediatR Domain / Command Handlers"
    destination: "Entity Framework Core"
    description: "Entity Framework Core with TDE"
  - source: "MediatR Domain / Command Handlers"
    destination: "Azure Service Bus"
    description: "AMQP over TLS"
  - source: "Claim Management API"
    destination: "Azure Key Vault"
    description: "Managed Identities over HTTPS"