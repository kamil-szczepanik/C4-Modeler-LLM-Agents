level: component
scope: "Component diagram for the Customer Portal & Adjuster Web Apps container"
parentContainer:
  name: "Customer Portal & Adjuster Web Apps"
elements:
  - type: "component"
    name: "Authentication Handler Component"
    technology: ".NET 8 / JavaScript"
    description: "Handles user authentication and security flows via OIDC / OAuth 2.0."
  - type: "component"
    name: "Dynamic Form Engine Component"
    technology: "JavaScript / SPA"
    description: "Powers dynamic form rendering and fetches feature flags from Azure App Configuration."
  - type: "component"
    name: "API Client & Caching Component"
    technology: "JavaScript"
    description: "Manages HTTP communications with the API Gateway and provides aggressive caching."
  - type: "component"
    name: "Broker Context Manager Component"
    technology: "JavaScript"
    description: "Manages broker-specific contexts and states within the web application."
  - type: "component"
    name: "Local Persistence Queue Component"
    technology: "IndexedDB"
    description: "Provides local persistence queue for offline-resilient claim submissions."
  - type: "component"
    name: "Telemetry & RUM Component"
    technology: "JavaScript / Application Insights SDK"
    description: "Enables Real User Monitoring (RUM) and streams performance metrics to Azure Application Insights."
relationships:
  - source: "Dynamic Form Engine Component"
    destination: "Azure App Configuration"
    description: "Fetches feature flags via HTTPS/TLS"
  - source: "Telemetry & RUM Component"
    destination: "Azure Application Insights"
    description: "Streams performance metrics via HTTPS"