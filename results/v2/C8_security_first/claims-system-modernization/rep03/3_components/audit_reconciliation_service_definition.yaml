level: component
scope: "Component diagram for the Audit & Reconciliation Service container"
parentContainer:
  name: "Audit & Reconciliation Service"
elements:
  - type: "component"
    name: "Reconciliation Engine"
    technology: ".NET 8, Hangfire / .NET Hosted Services"
    description: "Scheduled background execution for reconciliation jobs comparing Azure SQL Database and Legacy Mainframe extracts."
  - type: "component"
    name: "Audit Logger"
    technology: ".NET 8"
    description: "Captures and records immutable audit logs into Azure SQL Database with SQL Ledger."
  - type: "component"
    name: "Discrepancy API"
    technology: ".NET 8, MediatR"
    description: "Exposes discrepancy data to the Finance Operations Dashboard via HTTPS using OAuth2 / OIDC and handles CQRS discrepancy resolution workflows."
  - type: "component"
    name: "Discrepancy Manager"
    technology: ".NET 8, MediatR"
    description: "Manages discrepancy resolution workflows using the CQRS pattern."
relationships:
  - source: "Reconciliation Engine"
    destination: "Azure SQL Database"
    description: "Queries data for reconciliation via HTTPS"
  - source: "Reconciliation Engine"
    destination: "Legacy Mainframe System"
    description: "Extracts data via HTTPS"
  - source: "Audit Logger"
    destination: "Azure SQL Database"
    description: "Stores tamper-resistant audit logs via Entity Framework Core"
  - source: "Discrepancy API"
    destination: "Discrepancy Manager"
    description: "Invokes workflows using MediatR"
  - source: "Discrepancy API"
    destination: "Finance Operations Dashboard"
    description: "Sends discrepancy data via HTTPS (OAuth2 / OIDC)"