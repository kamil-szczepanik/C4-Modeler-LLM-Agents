level: component
scope: "Component diagram for the Azure Service Bus container"
parentContainer:
  name: "Azure Service Bus"
elements:
  - type: "component"
    name: "Claim Domain Topics"
    technology: "Azure Service Bus Topics (Standard/Premium Tier)"
    description: "Publishes domain events from the Claim Management API for decoupled asynchronous processing."
  - type: "component"
    name: "Mainframe-Outbox Queue"
    technology: "Azure Service Bus Queue"
    description: "Buffers messages during batch windows to safely integrate with the legacy mainframe system."
  - type: "component"
    name: "DLQ Subscriptions"
    technology: "Azure Service Bus Dead-Letter Queue"
    description: "Consumes poisoned and failed messages for auditing, reconciliation, and analysis."
relationships:
  - source: "Claim Management API"
    destination: "Claim Domain Topics"
    description: "Publishes domain events [AMQP over TLS with User-Assigned Managed Identities]"
  - source: "Claim Router/ACL"
    destination: "Mainframe-Outbox Queue"
    description: "Buffers messages during batch windows [AMQP over TLS]"
  - source: "Audit & Reconciliation Service"
    destination: "DLQ Subscriptions"
    description: "Consumes poisoned messages for analysis [AMQP over TLS]"