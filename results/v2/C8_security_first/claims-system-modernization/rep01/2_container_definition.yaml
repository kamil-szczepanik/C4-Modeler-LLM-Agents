level: container
scope: "Container diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "External users submitting and managing insurance claims."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff reviewing, processing, and settling insurance claims."
  - type: "externalSystem"
    name: "Legacy Mainframe System (COBOL/DB2)"
    description: "30-year-old regional insurer backend containing historical and core legacy claims data."
  - type: "externalSystem"
    name: "Active Directory / Identity Provider"
    description: "Provides identity management, OIDC, and OAuth 2.0 authentication."
  - type: "container"
    name: "Customer Portal"
    technology: "React, TypeScript, Azure Static Web Apps"
    description: "Allows customers and brokers to interact with the system via a modern SPA."
  - type: "container"
    name: "Adjuster Web App"
    technology: "React, TypeScript, Azure Static Web Apps"
    description: "Allows claims adjusters to review, process, and settle claims via a modern SPA."
  - type: "container"
    name: "Claims API Gateway"
    technology: "Azure API Management"
    description: "Enforces security, federation, and routing for incoming client requests."
  - type: "container"
    name: "Claims Core Services"
    technology: "Azure Container Apps"
    description: "Handles core business logic for claims processing."
  - type: "container"
    name: "Notification Service"
    technology: "Azure Container Apps"
    description: "Handles system notifications and alerts."
  - type: "container"
    name: "Feature/Routing Service"
    technology: "Azure Container Apps"
    description: "Handles routing and feature toggles during hybrid migration."
  - type: "container"
    name: "Integration / Anti-Corruption Layer (ACA Worker)"
    technology: "Azure Container Apps, Worker"
    description: "Isolates legacy mainframe latency and translates data structures for hybrid operations."
  - type: "container"
    name: "Database"
    technology: "Azure SQL Database"
    description: "Provides scalable relational data storage with transactional outbox pattern."
  - type: "container"
    name: "Messaging"
    technology: "Azure Service Bus with DLQs"
    description: "Handles asynchronous messaging and event distribution."
relationships:
  - source: "Customers and Brokers"
    destination: "Customer Portal"
    description: "Interacts with and manages insurance claims"
    technology: "HTTPS / REST"
  - source: "Claims Adjusters"
    destination: "Adjuster Web App"
    description: "Reviews, processes, and settles claims"
    technology: "HTTPS / REST"
  - source: "Customer Portal"
    destination: "Claims API Gateway"
    description: "Sends API requests"
    technology: "HTTPS / REST (TLS 1.3, OAuth 2.0 / OIDC)"
  - source: "Adjuster Web App"
    destination: "Claims API Gateway"
    description: "Sends API requests"
    technology: "HTTPS / REST (TLS 1.3, OAuth 2.0 / OIDC)"
  - source: "Claims API Gateway"
    destination: "Claims Core Services"
    description: "Routes API requests"
    technology: "HTTPS / JSON"
  - source: "Claims API Gateway"
    destination: "Notification Service"
    description: "Routes API requests"
    technology: "HTTPS / JSON"
  - source: "Claims API Gateway"
    destination: "Feature/Routing Service"
    description: "Routes API requests"
    technology: "HTTPS / JSON"
  - source: "Integration / Anti-Corruption Layer (ACA Worker)"
    destination: "Legacy Mainframe System (COBOL/DB2)"
    description: "Interfaces with legacy backend for hybrid operations"
    technology: "mTLS over IPsec VPN / ExpressRoute"
  - source: "Claims Core Services"
    destination: "Messaging"
    description: "Publishes and consumes asynchronous messages"
    technology: "AMQP"
  - source: "Claims Core Services"
    destination: "Database"
    description: "Reads and writes claim data"
    technology: "T-SQL / TDS"