level: component
scope: "Component diagram for the Claims API Gateway container"
parentContainer:
  name: "Claims API Gateway"
elements:
  - type: "component"
    name: "Edge Security Component"
    technology: "Azure API Management WAF & JWT Policy"
    description: "Handles edge security, WAF, and JWT validation."
  - type: "component"
    name: "Authorization & Context Injection Component"
    technology: "Azure API Management CBAC Policy"
    description: "Performs authorization and context injection using CBAC policies."
  - type: "component"
    name: "Dynamic Routing & Transformation Component"
    technology: "Azure API Management Policy Engine"
    description: "Executes dynamic routing and request transformations."
  - type: "component"
    name: "Resiliency Component"
    technology: "Azure API Management Circuit Breaker & Diagnostics"
    description: "Provides resiliency through circuit breakers and diagnostics."
relationships:
  - source: "Edge Security Component"
    destination: "Authorization & Context Injection Component"
    description: "Passes authenticated requests"
  - source: "Authorization & Context Injection Component"
    destination: "Dynamic Routing & Transformation Component"
    description: "Passes authorized context"
  - source: "Dynamic Routing & Transformation Component"
    destination: "Resiliency Component"
    description: "Routes filtered traffic"