level: component
scope: "Component diagram for the Feature/Routing Service container"
parentContainer:
  name: "Feature/Routing Service"
elements:
  - type: "component"
    name: "Routing Controller"
    technology: ".NET 8 / C# REST API"
    description: "REST API entry point handling inbound API Gateway requests, JSON schema validation, and audit logging."
  - type: "component"
    name: "Feature Toggle Engine"
    technology: ".NET 8 / C# In-Memory Cache"
    description: "In-memory cache evaluating claim types against migration flags."
  - type: "component"
    name: "Routing Dispatcher"
    technology: ".NET 8 / C# with Polly"
    description: "Forwards requests using Polly policies and circuit breakers."
  - type: "component"
    name: "Audit Logger Component"
    technology: ".NET 8 / C# Middleware"
    description: "Middleware emitting routing decisions to Azure Monitor."
  - type: "component"
    name: "Azure App Configuration"
    technology: "Azure App Configuration with Managed Identity"
    description: "Stores migration flags using Managed Identity sync."
  - type: "component"
    name: "Claims API Gateway"
    technology: "API Gateway"
    description: "External entry point routing API requests."
  - type: "component"
    name: "Claims Core Services"
    technology: "Microservices"
    description: "Downstream processing target for modern claims."
  - type: "component"
    name: "Integration / Anti-Corruption Layer (ACA Worker)"
    technology: "Worker Service"
    description: "Downstream processing target for legacy claims."
relationships:
  - source: "Claims API Gateway"
    destination: "Routing Controller"
    description: "Routes API requests [HTTPS / JSON, TLS 1.3, JWT]"
  - source: "Routing Controller"
    destination: "Feature Toggle Engine"
    description: "Checks claim status [In-Process]"
  - source: "Feature Toggle Engine"
    destination: "Azure App Configuration"
    description: "Syncs migration flags [HTTPS, Managed Identity]"
  - source: "Routing Dispatcher"
    destination: "Claims Core Services"
    description: "Forwards modern claims [HTTPS / JSON, mTLS]"
  - source: "Routing Dispatcher"
    destination: "Integration / Anti-Corruption Layer (ACA Worker)"
    description: "Forwards legacy claims [HTTPS / JSON, mTLS]"
  - source: "Routing Controller"
    destination: "Audit Logger Component"
    description: "Emits routing decisions [In-Process]"