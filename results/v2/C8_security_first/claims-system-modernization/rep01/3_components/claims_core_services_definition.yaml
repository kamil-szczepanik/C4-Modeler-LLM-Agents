level: component
scope: "Component diagram for the Claims Core Services container"
parentContainer:
  name: "Claims Core Services"
elements:
  - type: "component"
    name: "Claim Domain Model / Business Engine"
    technology: ".NET 8, C#"
    description: "Core business logic and domain model for modern claims processing."
  - type: "component"
    name: "Migration Router & Feature Toggles Component"
    technology: ".NET 8"
    description: "Routes claim types and manages feature toggles for gradual migration from the mainframe."
  - type: "component"
    name: "Idempotency & Outbox Processor"
    technology: ".NET 8, EF Core"
    description: "Ensures strict idempotency and manages transactional outbox messaging."
  - type: "component"
    name: "Event-Sourced State Store Component"
    technology: ".NET 8, Azure SQL"
    description: "Stores event-sourced state for claims data with auditability."
  - type: "component"
    name: "Resilience & Circuit Breaker Component"
    technology: ".NET 8, Polly"
    description: "Provides resilience, circuit breaking, and graceful degradation during mainframe latency."
relationships:
  - source: "Claims API Gateway"
    destination: "Resilience & Circuit Breaker Component"
    description: "HTTPS / JSON"
  - source: "Resilience & Circuit Breaker Component"
    destination: "Claim Domain Model / Business Engine"
    description: "In-Process"
  - source: "Migration Router & Feature Toggles Component"
    destination: "Integration / Anti-Corruption Layer (ACA Worker)"
    description: "AMQP via Azure Service Bus"
  - source: "Claim Domain Model / Business Engine"
    destination: "Event-Sourced State Store Component"
    description: "T-SQL / TDS"
  - source: "Claim Domain Model / Business Engine"
    destination: "Idempotency & Outbox Processor"
    description: "In-Process"
  - source: "Idempotency & Outbox Processor"
    destination: "Messaging"
    description: "AMQP"