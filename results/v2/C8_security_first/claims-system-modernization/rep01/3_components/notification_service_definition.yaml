level: component
scope: "Component diagram for the Notification Service container"
parentContainer:
  name: "Notification Service"
elements:
  - type: "component"
    name: "Notification API Controller"
    technology: "ASP.NET Core / C#"
    description: "Receives routed requests using validated JWTs or mTLS."
  - type: "component"
    name: "Notification Dispatcher Worker"
    technology: "ASP.NET Core Background Service"
    description: "Consumes outbound events from Azure Service Bus and invokes the Provider Adapter Layer."
  - type: "component"
    name: "Template Engine"
    technology: "Fluid / C#"
    description: "Renders multi-channel notification templates."
  - type: "component"
    name: "Provider Adapter Layer"
    technology: "C#"
    description: "Interfaces internally with the dispatcher and externally with third-party gateways."
  - type: "component"
    name: "Notification Repository"
    technology: "Entity Framework Core"
    description: "Handles data persistence for audit logs and states."
  - type: "component"
    name: "Preference Manager Component"
    technology: "C#"
    description: "Manages customer, broker, and adjuster notification preferences."
  - type: "component"
    name: "Audit & Telemetry Component"
    technology: "OpenTelemetry / C#"
    description: "Centralizes distributed tracing and structured JSON logging."
  - type: "component"
    name: "Azure Service Bus with DLQs"
    technology: "Azure Service Bus"
    description: "Ensures asynchronous, reliable message delivery with Dead-Letter Queues."
  - type: "component"
    name: "Azure SQL Database"
    technology: "Azure SQL Database"
    description: "Stores structured audit data and state."
  - type: "component"
    name: "Azure Key Vault"
    technology: "Azure Key Vault"
    description: "Manages external provider API secrets securely via managed identities."
  - type: "component"
    name: "External Gateways"
    technology: "Twilio / SendGrid"
    description: "Delivers external SMS and email messages via HTTPS / TLS 1.3."
relationships:
  - source: "Claims API Gateway"
    destination: "Notification API Controller"
    description: "Routes requests [HTTPS / JSON] using validated JWTs / mTLS"
  - source: "Notification Dispatcher Worker"
    destination: "Azure Service Bus with DLQs"
    description: "Consumes outbound events [AMQP]"
  - source: "Notification Dispatcher Worker"
    destination: "Provider Adapter Layer"
    description: "Internal invocation [C#]"
  - source: "Provider Adapter Layer"
    destination: "External Gateways"
    description: "Outbound API calls [HTTPS / TLS 1.3]"
  - source: "Notification Repository"
    destination: "Azure SQL Database"
    description: "Persists audit logs and states [T-SQL / TDS]"