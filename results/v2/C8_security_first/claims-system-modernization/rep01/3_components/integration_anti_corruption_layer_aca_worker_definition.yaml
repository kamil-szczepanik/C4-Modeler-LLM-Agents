# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Integration / Anti-Corruption Layer (ACA Worker) container"
parentContainer:
  name: "Integration / Anti-Corruption Layer (ACA Worker)"
elements:
  - type: "component"
    name: "Message Consumer Component"
    technology: ".NET Worker Service (C#)"
    description: "Consumes messages from Azure Service Bus to drive asynchronous processing."
  - type: "component"
    name: "Translation / Mapper Component"
    technology: ".NET Worker Service (C#)"
    description: "Translates and maps modern data models to legacy formats and vice versa."
  - type: "component"
    name: "Legacy Adaptor Component"
    technology: ".NET Worker Service (C#)"
    description: "Interfaces with the legacy mainframe system via custom TCP sockets encapsulated in mTLS over IPsec VPN / ExpressRoute."
  - type: "component"
    name: "Outbox / Audit Dispatcher Component"
    technology: ".NET Worker Service (C#)"
    description: "Dispatches messages and persists transaction states to ensure zero data loss."
relationships:
  - source: "Message Consumer Component"
    destination: "Azure Service Bus"
    description: "Consumes messages via AMQP over TLS 1.3"
  - source: "Outbox / Audit Dispatcher Component"
    destination: "Azure Service Bus"
    description: "Dispatches messages via AMQP over TLS 1.3"
  - source: "Outbox / Audit Dispatcher Component"
    destination: "Azure SQL Database"
    description: "Persists transaction states via TDS using Managed Identity"
  - source: "Legacy Adaptor Component"
    destination: "Legacy Mainframe System (COBOL/DB2)"
    description: "Interfaces with legacy backend for hybrid operations via custom TCP sockets in mTLS over IPsec VPN / ExpressRoute"
  - source: "Message Consumer Component"
    destination: "Azure Key Vault"
    description: "Retrieves certificates and secrets using Azure Container Apps Managed Identities"
  - source: "Translation / Mapper Component"
    destination: "Azure Key Vault"
    description: "Retrieves certificates and secrets using Azure Container Apps Managed Identities"
  - source: "Legacy Adaptor Component"
    destination: "Azure Key Vault"
    description: "Retrieves certificates and secrets using Azure Container Apps Managed Identities"
  - source: "Outbox / Audit Dispatcher Component"
    destination: "Azure Key Vault"
    description: "Retrieves certificates and secrets using Azure Container Apps Managed Identities"