level: component
scope: "Component diagram for the Messaging container"
parentContainer:
  name: "Messaging"
elements:
  - type: "component"
    name: "Claim Events Topic"
    technology: "Azure Service Bus"
    description: "Publishes claim events to downstream subscribers (`topic/claims-events`)."
  - type: "component"
    name: "Mainframe Sync Queue"
    technology: "Azure Service Bus"
    description: "Queues messages for synchronization with the legacy mainframe (`queue/mainframe-sync`)."
  - type: "component"
    name: "Notification Queue"
    technology: "Azure Service Bus"
    description: "Queues notification messages for processing (`queue/notifications`)."
  - type: "component"
    name: "Schema Validation Filter"
    technology: "Azure Schema Registry"
    description: "Enforces payload validation to prevent poison pills from crashing legacy systems."
  - type: "component"
    name: "DLQ Manager"
    technology: "Azure Functions"
    description: "Automates DLQ triage and operational alerting for failed synchronization attempts."
relationships:
  - source: "Claims Core Services"
    destination: "Schema Validation Filter"
    description: "AMQP"
  - source: "Schema Validation Filter"
    destination: "Claim Events Topic"
    description: "AMQP"
  - source: "Schema Validation Filter"
    destination: "Mainframe Sync Queue"
    description: "AMQP"
  - source: "Claims Core Services"
    destination: "Claim Events Topic"
    description: "AMQP"
  - source: "Mainframe Sync Queue"
    destination: "DLQ Manager"
    description: "AMQP"
  - source: "Integration ACA Worker"
    destination: "Mainframe Sync Queue"
    description: "AMQP"