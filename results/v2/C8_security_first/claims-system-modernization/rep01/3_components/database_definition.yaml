level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Claims Relational Tables"
    technology: "Azure SQL Database (Provisioned Tier), Entity Framework Core"
    description: "Stores relational claim data ensuring predictable performance and sub-2-second query response times."
  - type: "component"
    name: "Transactional Outbox Table"
    technology: "Azure SQL Database Table"
    description: "Implements the transactional outbox pattern to ensure reliable asynchronous messaging and zero lost or duplicated claims."
  - type: "component"
    name: "Audit and Reconciliation Log Table"
    technology: "Azure SQL Database Table"
    description: "Logs auditing and diagnostic data, streaming logs to Azure Monitor to support rapid 1-day rollbacks."
relationships:
  - source: "Claims Core Services"
    destination: "Claims Relational Tables"
    description: "Reads and writes claim data [T-SQL / TDS over Private Endpoint]"
  - source: "Integration / Anti-Corruption Layer (ACA Worker)"
    destination: "Transactional Outbox Table"
    description: "Synchronizes legacy data and updates outbox state [T-SQL / TDS over Private Endpoint]"
  - source: "Claims Relational Tables"
    destination: "Azure Monitor"
    description: "Streams auditing and diagnostic logs [HTTPS / TLS]"