level: component
scope: "Component diagram for the Adjuster Web App container"
parentContainer:
  name: "Adjuster Web App"
elements:
  - type: "component"
    name: "Claim Workspace Shell"
    technology: "React, TypeScript"
    description: "Main application layout and container for claim processing."
  - type: "component"
    name: "BFF Proxy Layer"
    technology: "Azure Static Web Apps Managed Functions"
    description: "Backend-for-Frontend proxy layer for secure data fetching."
  - type: "component"
    name: "Optimized Claim View & Form Engine"
    technology: "React, Formik, Zod"
    description: "High-performance claim view and form validation engine."
  - type: "component"
    name: "Local Draft Cache"
    technology: "IndexedDB, Dexie.js, Web Crypto API"
    description: "Client-side storage and encryption for offline resilience and draft caching."
  - type: "component"
    name: "Telemetry & RUM Collector"
    technology: "OpenTelemetry, App Insights JS SDK"
    description: "Collects and reports performance metrics and real user monitoring data."
  - type: "component"
    name: "Mainframe Latency Handler"
    technology: "React Hooks, RxJS"
    description: "Manages asynchronous status states and bridges slow legacy mainframe responses."
relationships:
  - source: "Claim Workspace Shell"
    destination: "BFF Proxy Layer"
    description: "Fetches claims [HTTPS / REST]"
  - source: "Optimized Claim View & Form Engine"
    destination: "Local Draft Cache"
    description: "Auto-saves drafts [IndexedDB]"
  - source: "Claim Workspace Shell"
    destination: "Telemetry & RUM Collector"
    description: "Reports performance metrics [OpenTelemetry SDK]"
  - source: "Optimized Claim View & Form Engine"
    destination: "Mainframe Latency Handler"
    description: "Manages async status states [React State / RxJS]"