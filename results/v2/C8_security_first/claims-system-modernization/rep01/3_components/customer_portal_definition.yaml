level: component
scope: "Component diagram for the Customer Portal container"
parentContainer:
  name: "Customer Portal"
elements:
  - type: "component"
    name: "Customer Portal SPA"
    technology: "React, TypeScript, Azure Static Web Apps"
    description: "Hosts the Single Page Application for fast global distribution and CI/CD integration, enabling customers and brokers to interact with and manage claims."
  - type: "component"
    name: "Azure Blob Storage"
    technology: "Azure Blob Storage"
    description: "Stores uploaded claim documents securely via presigned URLs to offload binary payloads from the API gateway."
  - type: "component"
    name: "Claims API Gateway"
    technology: "HTTPS / REST (TLS 1.3, OAuth 2.0 / OIDC)"
    description: "Receives API requests from the Customer Portal."
relationships:
  - source: "Customer Portal SPA"
    destination: "Claims API Gateway"
    description: "Sends API requests [HTTPS / REST (TLS 1.3, OAuth 2.0 / OIDC)]"
  - source: "Customer Portal SPA"
    destination: "Azure Blob Storage"
    description: "Uploads documents securely via presigned URLs [HTTPS]"