level: context
scope: "System Context diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
  description: "Modernizes a 30-year-old regional insurer claims platform by gradually migrating claim types to a hybrid cloud architecture while maintaining continuous core operations."
elements:
  - type: "person"
    name: "Customers & Brokers"
    description: "External users submitting and managing insurance claims."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff reviewing, processing, and settling insurance claims."
  - type: "externalSystem"
    name: "Legacy Mainframe System"
    description: "COBOL and DB2 backend containing historical and core legacy data."
  - type: "externalSystem"
    name: "Core Banking / Payment Gateway"
    description: "External payment system for issuing claim settlements."
  - type: "externalSystem"
    name: "Active Directory / Identity Provider"
    description: "Provides identity management, OIDC, and OAuth 2.0 authentication."
  - type: "softwareSystem"
    name: "Azure Kubernetes Service"
    description: "Hosts modern cloud-native microservices."
  - type: "softwareSystem"
    name: "Azure PostgreSQL"
    description: "Provides scalable, managed relational data storage."
  - type: "softwareSystem"
    name: "Azure API Gateway"
    description: "Enforces security, federation, RBAC, and dynamic routing."
relationships:
  - source: "Customers & Brokers"
    destination: "Modern Claims Platform"
    description: "Interacts with the modern claims platform to submit and track claims"
    technology: "HTTPS / TLS 1.3"
  - source: "Claims Adjusters"
    destination: "Modern Claims Platform"
    description: "Manages claims and ensures sub-2-second response times"
    technology: "HTTPS / TLS 1.3"
  - source: "Modern Claims Platform"
    destination: "Active Directory / Identity Provider"
    description: "Authenticates users and enforces federation"
    technology: "OIDC / OAuth 2.0"
  - source: "Modern Claims Platform"
    destination: "Legacy Mainframe System"
    description: "Interfaces with legacy backend for hybrid operations"
    technology: "TLS 1.3 with mTLS and Azure ExpressRoute"
  - source: "Modern Claims Platform"
    destination: "Core Banking / Payment Gateway"
    description: "Processes payouts and financial transactions"
    technology: "HTTPS / REST"