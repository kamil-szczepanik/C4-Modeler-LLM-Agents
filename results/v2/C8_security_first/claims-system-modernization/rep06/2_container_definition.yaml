level: container
scope: "Container diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
elements:
  - type: "person"
    name: "Policyholders and Brokers"
    description: "Customers and brokers who submit and track online claims."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff who handle and process claims."
  - type: "externalSystem"
    name: "Legacy Mainframe System"
    description: "30-year-old on-premise COBOL / DB2 system of record."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Azure AD / Entra ID providing SSO authentication."
  - type: "container"
    name: "API Gateway"
    technology: "Azure Front Door / Azure API Management"
    description: "Provides dynamic routing and API management."
  - type: "container"
    name: "Claims Web Application"
    technology: "React / Azure App Service"
    description: "Fast adjuster UI rendering for claim handling."
  - type: "container"
    name: "Audit & Reporting Dashboard"
    technology: "React / Azure App Service"
    description: "Provides reporting and audit trails for claims."
  - type: "container"
    name: "Claims Core Service"
    technology: "Node.js/TypeScript on Azure Container Apps"
    description: "Handles core business logic using CQRS and Event Sourcing."
  - type: "container"
    name: "Integration/Sync Service & Read-Model Sync Worker"
    technology: "Azure Service Bus, Azure Functions / .NET"
    description: "Manages event streaming and hybrid data synchronization."
relationships:
  - source: "Policyholders and Brokers"
    destination: "API Gateway"
    description: "Online claim submission"
    technology: "HTTPS/REST"
  - source: "Claims Adjusters"
    destination: "Claims Web Application"
    description: "Claim handling and processing"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "Claims Core Service"
    description: "Dynamic routing of requests"
    technology: "gRPC / HTTPS"
  - source: "Claims Core Service"
    destination: "Legacy Mainframe System"
    description: "Hybrid data sync"
    technology: "MQ/AMQP and mTLS over IPsec VPN / Azure ExpressRoute"
  - source: "Claims Core Service"
    destination: "Integration/Sync Service & Read-Model Sync Worker"
    description: "Event streaming"
    technology: "AMQP (Azure Service Bus)"
  - source: "Claims Web Application"
    destination: "Identity Provider"
    description: "Single Sign-On (SSO)"
    technology: "OpenID Connect / OAuth 2.0"
  - source: "Audit & Reporting Dashboard"
    destination: "Identity Provider"
    description: "Single Sign-On (SSO)"
    technology: "OpenID Connect / OAuth 2.0"