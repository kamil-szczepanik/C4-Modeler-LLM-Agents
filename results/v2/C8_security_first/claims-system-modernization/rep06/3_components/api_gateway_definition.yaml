level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Authentication & WAF Component"
    technology: "APIM Policies"
    description: "Handles security, WAF protection, rate-limiting, and authentication for incoming traffic."
  - type: "component"
    name: "Routing Configuration Loader"
    technology: "Azure App Configuration"
    description: "Fetches and stores version-controlled routing rules to support rapid one-day fallback."
  - type: "component"
    name: "Transformation & Caching Component"
    technology: "APIM Liquid Templates / Response Cache"
    description: "Transforms request and response payloads and caches frequent queries."
  - type: "component"
    name: "Circuit Breaker Policy Engine"
    technology: "APIM native policies"
    description: "Manages fallback routing and failure handling between the Azure service and legacy mainframe."
relationships:
  - source: "Routing Configuration Loader"
    destination: "Authentication & WAF Component"
    description: "Supplies routing rules [HTTPS]"
  - source: "Authentication & WAF Component"
    destination: "Transformation & Caching Component"
    description: "Passes authenticated requests for transformation"
  - source: "Transformation & Caching Component"
    destination: "Circuit Breaker Policy Engine"
    description: "Routes processed requests through circuit breaker policies"