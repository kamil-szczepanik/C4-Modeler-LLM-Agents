level: component
scope: "Component diagram for the Integration/Sync Service & Read-Model Sync Worker container"
parentContainer:
  name: "Integration/Sync Service & Read-Model Sync Worker"
elements:
  - type: "component"
    name: "Inbound Event Router"
    technology: ".NET 8 Isolated Worker"
    description: "Consumes messages from Azure Service Bus and coordinates processing."
  - type: "component"
    name: "Read-Model Projection Engine"
    technology: ".NET 8"
    description: "Builds and updates read-models for fast adjuster user experiences."
  - type: "component"
    name: "Legacy Sync Bridge & Mainframe Adapter"
    technology: ".NET 8 / Azure Container Apps"
    description: "Handles bi-directional state synchronization with the on-premise mainframe via IPSec VPN / Azure ExpressRoute."
relationships:
  - source: "Inbound Event Router"
    destination: "Read-Model Projection Engine"
    description: "Forwards processed event data for projection updates"
  - source: "Legacy Sync Bridge & Mainframe Adapter"
    destination: "Inbound Event Router"
    description: "Sends synchronized legacy state updates"