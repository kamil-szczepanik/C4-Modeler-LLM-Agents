level: component
scope: "Component diagram for the Claims Core Service container"
parentContainer:
  name: "Claims Core Service"
elements:
  - type: "component"
    name: "Command Router & Validation Component"
    technology: "Node.js / TypeScript"
    description: "Routes and validates incoming requests dispatched to the domain model."
  - type: "component"
    name: "Aggregate Root & Business Logic Engine"
    technology: "Node.js / TypeScript"
    description: "Executes core business logic and dispatches validated commands."
  - type: "component"
    name: "Event Store Repository"
    technology: "Azure Cosmos DB SDK"
    description: "Appends immutable domain events to the event store."
  - type: "component"
    name: "Outbox Publisher Worker"
    technology: "Node.js / TypeScript"
    description: "Streams uncommitted events from the database change feed."
  - type: "component"
    name: "Saga & Compensation Coordinator"
    technology: "Node.js / TypeScript"
    description: "Triggers compensation flows on integration failure and handles routing of failed business events."
relationships:
  - source: "Command Router & Validation Component"
    destination: "Aggregate Root & Business Logic Engine"
    description: "Dispatches validated commands [In-memory]"
  - source: "Aggregate Root & Business Logic Engine"
    destination: "Event Store Repository"
    description: "Appends immutable domain events [HTTPS via Azure Cosmos DB SDK]"
  - source: "Event Store Repository"
    destination: "Outbox Publisher Worker"
    description: "Streams uncommitted events [Database Change Feed]"
  - source: "Outbox Publisher Worker"
    destination: "Saga & Compensation Coordinator"
    description: "Triggers compensation flows on integration failure [Async callback]"
  - source: "Saga & Compensation Coordinator"
    destination: "Azure Service Bus (DLQ)"
    description: "Routes failed business events [AMQP]"