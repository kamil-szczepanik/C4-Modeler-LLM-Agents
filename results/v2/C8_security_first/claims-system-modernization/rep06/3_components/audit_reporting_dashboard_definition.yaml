level: component
scope: "Component diagram for the Audit & Reporting Dashboard container"
parentContainer:
  name: "Audit & Reporting Dashboard"
elements:
  - type: "component"
    name: "Dashboard UI Component"
    technology: "React / TypeScript"
    description: "Renders responsive adjuster and compliance user interfaces."
  - type: "component"
    name: "Reporting API Component"
    technology: ".NET 8 Web API / Azure App Service"
    description: "Handles reporting logic, queries audit logs, and interfaces with the Read-Model DB and Enterprise Notification System."
  - type: "component"
    name: "Audit Trail Logger Component"
    technology: ".NET 8 / Azure Functions"
    description: "Logs audit trail information asynchronously."
  - type: "component"
    name: "Alerting & Notification Component"
    technology: ".NET background worker / Azure Functions"
    description: "Dispatches threshold alerts and manages notifications."
  - type: "component"
    name: "Export Worker Component"
    technology: ".NET 8 Isolated Worker / Azure Function"
    description: "Writes immutable reports and generates secure download links using Azure Blob Storage."
relationships:
  - source: "Dashboard UI Component"
    destination: "Reporting API Component"
    description: "Queries audit logs and KPI metrics [HTTPS / REST, JWT Bearer]"
  - source: "Reporting API Component"
    destination: "Read-Model DB"
    description: "Reads denormalized audit and reporting views [TCP / TLS]"
  - source: "Reporting API Component"
    destination: "Enterprise Notification System"
    description: "Dispatches threshold alerts [HTTPS / REST]"
  - source: "Export Worker Component"
    destination: "Azure Blob Storage"
    description: "Writes immutable reports and generates SAS download links [HTTPS, Azure SDK]"
  - source: "Audit & Reporting Dashboard"
    destination: "Identity Provider (Entra ID)"
    description: "Single Sign-On (SSO) [OpenID Connect / OAuth 2.0]"