level: component
scope: "Component diagram for the Claims Web Application container"
parentContainer:
  name: "Claims Web Application"
elements:
  - type: "component"
    name: "Claims Web Application"
    technology: "React SPA / Azure App Service"
    description: "Unified hosting for React SPA and Node.js BFF to minimize operational complexity for cloud-novice teams."
  - type: "component"
    name: "BFF Routing & Session Controller"
    technology: "Node.js/Express"
    description: "Manages routing and session control."
  - type: "component"
    name: "Claim Workspace UI"
    technology: "React/TypeScript"
    description: "Supports WCAG 2.1 AA accessibility and rapid adjuster workflows."
  - type: "component"
    name: "Local State & Sync Manager"
    technology: "IndexedDB / Workbox / Web Crypto API"
    description: "Client-side storage with encrypted payload caching to handle intermittent connectivity."
  - type: "component"
    name: "Client-Side Validation & Mapping Engine"
    technology: "TypeScript / Zod"
    description: "Performs client-side validation and mapping."
  - type: "component"
    name: "Telemetry & Error Boundary Component"
    technology: "React / OpenTelemetry Web"
    description: "Distributed tracing and proactive health monitoring across hybrid lag."
  - type: "component"
    name: "Microsoft Entra ID"
    technology: "Azure"
    description: "External system for authentication and identity management."
  - type: "component"
    name: "API Gateway"
    technology: "Azure"
    description: "External system acting as the gateway for backend communication."
  - type: "component"
    name: "Legacy Mainframe"
    technology: "Mainframe"
    description: "External system representing the 30-year-old regional insurer mainframe claims system."
relationships:
  - source: "Claims Adjusters"
    destination: "Claims Web Application"
    description: "HTTPS/REST"
  - source: "Claim Workspace UI"
    destination: "BFF Routing & Session Controller"
    description: "HTTPS/REST"
  - source: "BFF Routing & Session Controller"
    destination: "API Gateway"
    description: "HTTPS/REST"
  - source: "Claim Workspace UI"
    destination: "Client-Side Validation & Mapping Engine"
    description: "In-memory TS"