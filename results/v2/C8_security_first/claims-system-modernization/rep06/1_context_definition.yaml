level: context
scope: "System Context diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
  description: "Modernizes a regional insurer's claims platform by gradually migrating claim types from a 30-year-old legacy mainframe to a cloud-native architecture over a three-year period, ensuring seamless online submissions and business continuity."
elements:
  - type: "person"
    name: "Policyholders and Brokers"
    description: "Customers and brokers who submit and track online claims."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff who handle and process claims."
  - type: "externalSystem"
    name: "Legacy Mainframe System of Record"
    description: "30-year-old on-premise COBOL/DB2 system handling legacy claim types and dual-run sync."
  - type: "externalSystem"
    name: "Insurer Active Directory / Entra ID"
    description: "Provides identity and access management for Single Sign-On."
  - type: "externalSystem"
    name: "Enterprise Notification System"
    description: "Sends claim status updates via HTTPS/SMTP."
relationships:
  - source: "Policyholders and Brokers"
    destination: "Modern Claims Platform"
    description: "Online claim submissions and status checking"
    technology: "HTTPS (REST/GraphQL)"
  - source: "Claims Adjusters"
    destination: "Modern Claims Platform"
    description: "Claim handling and processing"
    technology: "HTTPS"
  - source: "Modern Claims Platform"
    destination: "Legacy Mainframe System of Record"
    description: "Claim type migration and dual-run sync"
    technology: "Hybrid VPN, mTLS, and Azure Service Bus"
  - source: "Modern Claims Platform"
    destination: "Insurer Active Directory / Entra ID"
    description: "Single Sign-On authentication"
    technology: "OIDC/OAuth 2.0"
  - source: "Modern Claims Platform"
    destination: "Enterprise Notification System"
    description: "Send claim status updates"
    technology: "HTTPS/SMTP"