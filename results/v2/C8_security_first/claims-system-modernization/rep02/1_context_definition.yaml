level: context
scope: "System Context diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
  description: "A hybrid architecture gradually modernizing a legacy insurance claims platform over three years, decoupling the new cloud-based user experience from the on-premises mainframe system of record."
elements:
  - type: "person"
    name: "Policyholders and Brokers"
    description: "External users interacting with the cloud-based user experience."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users utilizing high-performance adjuster screens."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premises COBOL/DB2 System of Record."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Azure Active Directory / Entra ID handling authentication with MFA and OAuth2/JWT tokens."
  - type: "externalSystem"
    name: "Anti-Corruption Layer"
    description: "Azure Service Bus and Azure API Management insulating the mainframe and handling messaging."
relationships:
  - source: "Policyholders and Brokers"
    destination: "Modern Claims Platform"
    description: "Accesses user experience and submits insurance claims"
    technology: "HTTPS (REST/GraphQL) with OIDC/OAuth2"
  - source: "Claims Adjusters"
    destination: "Modern Claims Platform"
    description: "Uses high-performance adjuster screens to manage claims"
    technology: "HTTPS (REST/GraphQL) with OIDC/OAuth2"
  - source: "Modern Claims Platform"
    destination: "Legacy Mainframe"
    description: "Synchronizes and processes data securely"
    technology: "mTLS (TLS 1.3) over secure hybrid connection"
  - source: "Modern Claims Platform"
    destination: "Anti-Corruption Layer"
    description: "Routes requests and manages integration via Strangler Fig pattern"
    technology: "Azure Service Bus and Azure API Management"
  - source: "Modern Claims Platform"
    destination: "Identity Provider"
    description: "Authenticates users and validates tokens"
    technology: "Azure AD / Entra ID with OAuth2/JWT"