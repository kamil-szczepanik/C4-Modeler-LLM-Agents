# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
elements:
  - type: "person"
    name: "Policyholders and Brokers"
    description: "External users interacting with the cloud-based user experience to submit insurance claims."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users utilizing high-performance adjuster screens to manage and process claims."
  - type: "externalSystem"
    name: "On-Premises COBOL/DB2 Mainframe"
    description: "On-premises System of Record maintaining core insurance data."
  - type: "externalSystem"
    name: "Azure Active Directory"
    description: "Identity Provider handling authentication via OIDC/OAuth2 and Azure Managed Identities."
  - type: "container"
    name: "Customer Portal"
    technology: "React SPA / Azure Container Apps"
    description: "Provides a responsive, modern frontend for customer claim submissions."
  - type: "container"
    name: "Adjuster Workspace"
    technology: "Node.js/Java / Azure Container Apps"
    description: "Delivers adjuster workspaces for managing and processing claims."
  - type: "container"
    name: "Anti-Corruption Layer"
    technology: "ACA Integration Service"
    description: "Insulates the legacy mainframe and integrates communication services."
  - type: "container"
    name: "Migration Analytics Container"
    technology: "Node.js/Python / Azure Container Apps"
    description: "Monitors and analyzes the step-by-step migration of claim types."
  - type: "container"
    name: "Azure Service Bus"
    technology: "Azure Service Bus"
    description: "Ensures asynchronous, guaranteed event delivery and message brokering."
relationships:
  - source: "Policyholders and Brokers"
    destination: "Customer Portal"
    description: "Interacts with and submits claims"
    technology: "HTTPS/TLS 1.3"
  - source: "Claims Adjusters"
    destination: "Adjuster Workspace"
    description: "Interacts with and manages claims"
    technology: "HTTPS"
  - source: "Customer Portal"
    destination: "Azure Service Bus"
    description: "Publishes and subscribes to events"
    technology: "AMQP"
  - source: "Adjuster Workspace"
    destination: "Azure Service Bus"
    description: "Publishes and subscribes to events"
    technology: "AMQP"
  - source: "Anti-Corruption Layer"
    destination: "Azure Service Bus"
    description: "Integrates messaging events"
    technology: "AMQP"
  - source: "Anti-Corruption Layer"
    destination: "On-Premises COBOL/DB2 Mainframe"
    description: "Integrates services securely"
    technology: "Mutual TLS (mTLS) over Azure ExpressRoute"
  - source: "Customer Portal"
    destination: "Azure Active Directory"
    description: "Authenticates users"
    technology: "OIDC/OAuth2"
  - source: "Adjuster Workspace"
    destination: "Azure Active Directory"
    description: "Authenticates users"
    technology: "OIDC/OAuth2"