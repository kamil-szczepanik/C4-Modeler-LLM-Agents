level: component
scope: "Component diagram for the Anti-Corruption Layer container"
parentContainer:
  name: "Anti-Corruption Layer"
elements:
  - type: "component"
    name: "Routing Mediator"
    technology: "Spring Cloud Gateway / .NET Yarp"
    description: "Handles dynamic traffic steering, routing, and circuit breaking for incoming requests."
  - type: "component"
    name: "Domain Translator"
    technology: "Apache Camel / custom mapping engine"
    description: "Translates JSON payloads to COBOL copybooks and vice versa."
  - type: "component"
    name: "Outbox Processor"
    technology: "Azure Service Bus / Custom Processor"
    description: "Enforces transactional outbox patterns for reliable message publishing."
  - type: "component"
    name: "DLQ Management"
    technology: "Azure Service Bus / DLQ Handler"
    description: "Processes poisoned messages and manages dead-letter queues."
  - type: "component"
    name: "Telemetry Publisher"
    technology: "OpenTelemetry & Azure Monitor"
    description: "Publishes centralized hybrid observability and business metric telemetry."
relationships:
  - source: "Routing Mediator"
    destination: "Domain Translator"
    description: "Forwards requests [gRPC]"
  - source: "Domain Translator"
    destination: "On-Premises COBOL/DB2 Mainframe"
    description: "Translates and sends requests [Mutual TLS over Azure ExpressRoute / CICS Transaction Gateway]"
  - source: "DLQ Management"
    destination: "Azure Service Bus"
    description: "Processes poisoned messages [AMQP]"