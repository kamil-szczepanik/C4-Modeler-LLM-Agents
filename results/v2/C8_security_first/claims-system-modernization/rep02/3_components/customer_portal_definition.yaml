level: component
scope: "Component diagram for the Customer Portal container"
parentContainer:
  name: "Customer Portal"
elements:
  - type: "component"
    name: "Claims UI"
    technology: "React SPA / TypeScript"
    description: "Powers the Customer Portal frontend for high responsiveness and maintainability."
  - type: "component"
    name: "Auth Manager"
    technology: "OIDC/OAuth2 with PKCE"
    description: "Centralizes single sign-on security and authenticates users via Azure Active Directory."
  - type: "component"
    name: "API Client"
    technology: "HTTPS"
    description: "Routes requests and submits data to the Azure API Gateway."
  - type: "component"
    name: "State & Storage Components"
    technology: "Local Storage API"
    description: "Manages local state and storage internally within the portal."
relationships:
  - source: "Claims UI"
    destination: "API Client"
    description: "Invokes API requests to submit online claims [HTTPS/TLS 1.3]"
  - source: "Auth Manager"
    destination: "Azure Active Directory"
    description: "Authenticates users [OIDC/OAuth2 with PKCE]"
  - source: "API Client"
    destination: "Azure API Gateway"
    description: "Routes requests and submits data [HTTPS]"
  - source: "Claims UI"
    destination: "State & Storage Components"
    description: "Reads and writes local state [Local Storage API / TypeScript]"