level: component
scope: "Component diagram for the Migration Analytics Container container"
parentContainer:
  name: "Migration Analytics Container"
elements:
  - type: "component"
    name: "Reconciliation Engine Component"
    technology: "Node.js/TypeScript"
    description: "Performs automated data reconciliation and comparison against the legacy DB2 database."
  - type: "component"
    name: "Metrics Aggregator Component"
    technology: "Python/Pandas"
    description: "Aggregates migration metrics and telemetry data."
  - type: "component"
    name: "Discrepancy Triage Service Component"
    technology: "Node.js"
    description: "Triages data discrepancies identified during reconciliation."
  - type: "component"
    name: "Analytics API & UI Component"
    technology: "Express/React"
    description: "Provides executive visibility and user interfaces for monitoring the migration."
relationships:
  - source: "Migration Analytics Container"
    destination: "Anti-Corruption Layer"
    description: "Communicates via gRPC over mTLS"
  - source: "Reconciliation Engine Component"
    destination: "Azure Service Bus"
    description: "Consumes events via AMQP"
  - source: "Analytics API & UI Component"
    destination: "Management Clients"
    description: "Serves traffic via HTTPS/REST"
  - source: "Reconciliation Engine Component"
    destination: "Anti-Corruption Layer"
    description: "Accesses legacy DB2 for data comparison via"