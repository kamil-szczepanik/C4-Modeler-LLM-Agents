# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Azure Service Bus container"
parentContainer:
  name: "Azure Service Bus"
elements:
  # Components within the parent container's boundary
  - type: "component"
    name: "Claim Event Publisher"
    technology: "AMQP 1.0 / Azure Service Bus Sessions"
    description: "Publishes claim submission events from the Customer Portal."
  - type: "component"
    name: "Claim Processing Manager"
    technology: "AMQP 1.0 / VNet Integration"
    description: "Handles publish and subscribe operations for claim processing events with the Adjuster Workspace."
  - type: "component"
    name: "Integration Queue Relay"
    technology: "AMQP 1.0 / ExpressRoute"
    description: "Relays synchronous and asynchronous messaging events to the On-Premises Mainframe via the Anti-Corruption Layer."
relationships:
  - source: "Claim Event Publisher"
    destination: "Claim Processing Manager"
    description: "Routes claim events for FIFO processing"
  - source: "Claim Processing Manager"
    destination: "Integration Queue Relay"
    description: "Forwards events to hybrid integration layer"