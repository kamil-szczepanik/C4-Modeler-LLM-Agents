level: component
scope: "Component diagram for the Backend-for-Frontend (BFF) container"
parentContainer:
  name: "Backend-for-Frontend (BFF)"
elements:
  - type: "component"
    name: "API Router & Auth Middleware"
    technology: "Node.js (Fastify) or Go (Gin)"
    description: "Validates JWT tokens, enforces RBAC, and routes incoming requests."
  - type: "component"
    name: "Aggregation & Orchestration Service"
    technology: "Node.js (Fastify) or Go (Gin)"
    description: "Orchestrates claim data requests and aggregates responses for the frontend."
  - type: "component"
    name: "Caching & Resilience Layer"
    technology: "Azure Cache for Redis"
    description: "Implements caching and circuit-breaker fallbacks to ensure fast screen loads."
  - type: "component"
    name: "Feature-Flag Evaluation Engine"
    technology: "Azure App Configuration"
    description: "Evaluates claim-type migration state and enables rapid rollbacks."
  - type: "component"
    name: "Telemetry & Correlation Middleware"
    technology: "OpenTelemetry"
    description: "Provides distributed tracing and observability for cross-service calls."
relationships:
  - source: "API Router & Auth Middleware"
    destination: "Aggregation & Orchestration Service"
    description: "Forwards authenticated and authorized requests"
  - source: "Aggregation & Orchestration Service"
    destination: "Caching & Resilience Layer"
    description: "Reads/writes cached claim data using Cache-Aside pattern"
  - source: "Feature-Flag Evaluation Engine"
    destination: "Aggregation & Orchestration Service"
    description: "Provides feature flag states for routing decisions"
  - source: "Aggregation & Orchestration Service"
    destination: "Telemetry & Correlation Middleware"
    description: "Propagates tracing context"