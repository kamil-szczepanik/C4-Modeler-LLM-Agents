level: component
scope: "Component diagram for the Claim Processing Core container"
parentContainer:
  name: "Claim Processing Core"
elements:
  - type: "component"
    name: "Claim Intake Router"
    technology: "Azure Functions"
    description: "Routes incoming claims and interfaces with Azure API Management."
  - type: "component"
    name: "Workflow Orchestrator"
    technology: "Azure Durable Functions"
    description: "Serverless state orchestration ensuring idempotent claim processing and preventing duplicate payouts."
  - type: "component"
    name: "Integration Adapter"
    technology: "C# Class Library with Polly"
    description: "Handles integration with the legacy mainframe utilizing circuit breakers and retries to handle latency."
  - type: "component"
    name: "Domain Model Engine"
    technology: "DDD Class Library"
    description: "Contains the core domain models and business logic for claim processing."
  - type: "component"
    name: "Azure Service Bus"
    technology: "Azure Service Bus"
    description: "Asynchronous message broker handling ingestion spikes without impacting the batch window."
  - type: "component"
    name: "Azure Cosmos DB"
    technology: "Azure Cosmos DB"
    description: "Multi-model database providing state storage and WORM ledger mode for immutable audit events."
  - type: "component"
    name: "Azure Key Vault"
    technology: "Azure Key Vault"
    description: "Secures secrets and credentials using Managed Identities and HTTPS."
  - type: "component"
    name: "Azure Container Apps"
    technology: "Azure Container Apps"
    description: "Container hosting platform reducing day-2 operational overhead."
relationships:
  - source: "Azure API Management"
    destination: "Claim Intake Router"
    description: "mTLS / HTTPS"
  - source: "Claim Intake Router"
    destination: "Azure Service Bus"
    description: "AMQP"
  - source: "Workflow Orchestrator"
    destination: "Azure Cosmos DB"
    description: "HTTPS / TLS 1.3"
  - source: "Integration Adapter"
    destination: "Legacy Mainframe"
    description: "mTLS via VPN/ExpressRoute"
  - source: "Claim Processing Core"
    destination: "Azure Key Vault"
    description: "Managed Identities / HTTPS"