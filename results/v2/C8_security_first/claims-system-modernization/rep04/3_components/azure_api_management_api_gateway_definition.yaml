level: component
scope: "Component diagram for the Azure API Management (API Gateway) container"
parentContainer:
  name: "Azure API Management (API Gateway)"
elements:
  - type: "component"
    name: "API Proxy and Routing Manager"
    technology: "Azure API Management Policy"
    description: "Manages API proxying, path-based routing, and endpoint exposure for external and internal clients."
  - type: "component"
    name: "Rate Limiting and Throttling Engine"
    technology: "Azure API Management Policy"
    description: "Enforces rate-limiting and traffic quotas to protect backend services, including the legacy mainframe."
  - type: "component"
    name: "Payload Transformation Module"
    technology: "Azure API Management Policy (Liquid/XSLT)"
    description: "Transforms request and response payloads to bridge modern JSON interfaces with legacy formats."
  - type: "component"
    name: "Security and Authentication Validator"
    technology: "OAuth 2.0 / OpenID Connect (Entra ID) & Mutual TLS (mTLS)"
    description: "Validates incoming OAuth 2.0 tokens from clients and secures hybrid connectivity to the legacy mainframe using mTLS."
relationships:
  - source: "API Proxy and Routing Manager"
    destination: "Rate Limiting and Throttling Engine"
    description: "Passes incoming requests for validation and traffic control"
  - source: "Rate Limiting and Throttling Engine"
    destination: "Payload Transformation Module"
    description: "Routes allowed requests for format adaptation"
  - source: "Payload Transformation Module"
    destination: "Security and Authentication Validator"
    description: "Applies security policies and mTLS certificates managed by Azure Key Vault"