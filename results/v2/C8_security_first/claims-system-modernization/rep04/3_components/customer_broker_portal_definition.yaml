level: component
scope: "Component diagram for the Customer/Broker Portal container"
parentContainer:
  name: "Customer/Broker Portal"
elements:
  - type: "component"
    name: "SPA Frontend"
    technology: "TypeScript / React on Azure Static Web Apps"
    description: "Provides a modern, responsive, mobile-friendly web interface for online claim submissions, document uploads, and real-time status tracking."
  - type: "component"
    name: "Portal BFF"
    technology: "Node.js / Express on Azure Container Apps"
    description: "Lightweight backend for handling API routing, session management, and forwarding domain commands."
  - type: "component"
    name: "Document Uploader"
    technology: "Node.js component"
    description: "Handles direct secure binary streaming of claim attachments to cloud storage."
  - type: "component"
    name: "Azure API Management"
    technology: "API Gateway"
    description: "Acts as the API gateway managing secure access and routing."
  - type: "component"
    name: "Azure Blob Storage"
    technology: "Azure Blob Storage"
    description: "Secure binary object storage for claim attachments using SAS tokens."
  - type: "component"
    name: "Active Directory / Entra ID"
    technology: "OAuth 2.0 / OpenID Connect"
    description: "Manages user authentication and identity enforcement."
relationships:
  - source: "SPA Frontend"
    destination: "Portal BFF"
    description: "Authenticated API calls [HTTPS / REST, JSON]"
  - source: "Portal BFF"
    destination: "Backend-for-Frontend (System Container)"
    description: "Forwards domain commands [HTTPS / gRPC]"
  - source: "Document Uploader"
    destination: "Azure Blob Storage"
    description: "Direct secure binary streaming [HTTPS / SAS]"
  - source: "Active Directory / Entra ID"
    destination: "SPA Frontend"
    description: "User authentication [OAuth 2.0 / OpenID Connect]"