level: component
scope: "Component diagram for the Adjuster Web App container"
parentContainer:
  name: "Adjuster Web App"
elements:
  - type: "component"
    name: "React SPA Presentation Layer"
    technology: "React / TypeScript"
    description: "Component architecture for high performance, maintainability, and sub-second UI rendering."
  - type: "component"
    name: "Authentication Client"
    technology: "OIDC / OAuth2"
    description: "Authenticates users via Azure Active Directory / Entra ID and manages the SSO lifecycle."
  - type: "component"
    name: "Telemetry Integration"
    technology: "HTTPS"
    description: "Transmits distributed traces and client telemetry to Azure Application Insights and Azure Monitor."
  - type: "component"
    name: "Configuration Manager"
    technology: "Azure App Configuration"
    description: "Handles dynamic feature flagging for rapid rollback requirements."
relationships:
  - source: "Claims Adjuster"
    destination: "React SPA Presentation Layer"
    description: "Reviews and processes claims [HTTPS]"
  - source: "React SPA Presentation Layer"
    destination: "Backend-for-Frontend (BFF)"
    description: "Requests claim data and workflows [HTTPS / gRPC via Azure Managed Identities]"
  - source: "Authentication Client"
    destination: "Azure Active Directory / Entra ID"
    description: "Authenticates users and manages SSO/OIDC lifecycle [OIDC / OAuth2]"
  - source: "Telemetry Integration"
    destination: "Azure Application Insights & Azure Monitor"
    description: "Transmits distributed traces and client telemetry [HTTPS]"
  - source: "Configuration Manager"
    destination: "React SPA Presentation Layer"
    description: "Provides dynamic feature flags"