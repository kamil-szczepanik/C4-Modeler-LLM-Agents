level: component
scope: "Component diagram for the Notification Service container"
parentContainer:
  name: "Notification Service"
elements:
  - type: "component"
    name: "API Controller / Event Consumer Component"
    technology: "Node.js / TypeScript (Azure Container Apps)"
    description: "Handles incoming HTTP requests from the BFF and consumes events from Azure Service Bus."
  - type: "component"
    name: "Preference Manager Component"
    technology: "Node.js / TypeScript (Azure Container Apps)"
    description: "Manages customer, broker, and adjuster communication preferences."
  - type: "component"
    name: "Template Engine Component"
    technology: "Node.js / TypeScript (Azure Container Apps)"
    description: "Generates multi-channel communication templates for Email, SMS, and Push."
  - type: "component"
    name: "Dispatch Adapter Component"
    technology: "Node.js / TypeScript with Opossum Circuit Breaker"
    description: "Dispatches notifications to external gateways with built-in circuit breaker resilience."
  - type: "component"
    name: "Notification State Repository"
    technology: "Azure Cosmos DB NoSQL"
    description: "Stores notification metadata and delivery status for auditability."
relationships:
  - source: "API Controller / Event Consumer Component"
    destination: "Preference Manager Component"
    description: "Checks delivery preferences"
  - source: "API Controller / Event Consumer Component"
    destination: "Template Engine Component"
    description: "Requests message rendering"
  - source: "Template Engine Component"
    destination: "Dispatch Adapter Component"
    description: "Sends rendered payload for delivery"
  - source: "Dispatch Adapter Component"
    destination: "Notification State Repository"
    description: "Persists delivery status and metadata"