    name: "Integration Route Processor"
    technology: "Apache Camel"
    description: "Handles protocol translation and routing between modern cloud services and legacy systems."
  - type: "component"
    name: "Mainframe Sync Client"
    technology: "gRPC / Spring Boot"
    description: "Manages secure gRPC communication over ExpressRoute to interact with the legacy mainframe."
  - type: "component"
    name: "Event Publisher"
    technology: "Azure Service Bus SDK"
    description: "Publishes synchronized claim updates and events to the Azure Service Bus."
relationships:
  - source: "Integration Route Processor"
    destination: "Mainframe Sync Client"
    description: "Delegates legacy data extraction to"
  - source: "Mainframe Sync Client"
    destination: "Legacy Mainframe System"
    description: "Syncs data via gRPC/mTLS over ExpressRoute"
  - source: "Integration Route Processor"
    destination: "Event Publisher"
    description: "Triggers message publishing via"
  - source: "Event Publisher"
    destination: "Claim Processing Core"
    description: "Sends asynchronous messages via"