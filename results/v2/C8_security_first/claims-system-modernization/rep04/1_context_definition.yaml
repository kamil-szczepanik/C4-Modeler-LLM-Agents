level: context
scope: "System Context diagram for Modernized Insurance Claims Platform"
system:
  name: "Modernized Insurance Claims Platform"
  description: "A hybrid system that gradually modernizes a legacy insurance claims platform by migrating claim types incrementally to Azure while the on-premise mainframe remains the system of record, ensuring continuous processing via an asynchronous architecture."
elements:
  - type: "person"
    name: "Customer / Policyholder"
    description: "An end-user who submits claims and interacts with the insurance platform."
  - type: "person"
    name: "Broker"
    description: "An intermediary who assists policyholders and manages claims."
  - type: "person"
    name: "Claims Adjuster"
    description: "A professional who reviews and processes insurance claims using modern web applications requiring sub-2-second screen loads."
  - type: "externalSystem"
    name: "Legacy Mainframe System"
    description: "On-premises COBOL and DB2 database system acting as the system of record."
  - type: "externalSystem"
    name: "Active Directory / Entra ID"
    description: "Identity Provider used for Federated SSO and authentication."
  - type: "container"
    name: "Modern Claims Platform"
    description: "Cloud-hosted web applications and APIs running on Azure Container Apps / App Service."
    technology: "Azure Container Apps / App Service"
  - type: "container"
    name: "Azure API Management (APIM) Gateway"
    description: "Ingress gateway enforcing WAF policies, rate-limiting, and payload inspection."
    technology: "Azure API Management"
relationships:
  - source: "Customer / Policyholder"
    destination: "Azure API Management (APIM) Gateway"
    description: "Interacts with the system via web applications"
    technology: "HTTPS / TLS 1.3"
  - source: "Broker"
    destination: "Azure API Management (APIM) Gateway"
    description: "Interacts with the system via web applications"
    technology: "HTTPS / TLS 1.3"
  - source: "Claims Adjuster"
    destination: "Azure API Management (APIM) Gateway"
    description: "Interacts with the system via web applications"
    technology: "HTTPS / TLS 1.3"
  - source: "Modern Claims Platform"
    destination: "Azure API Management (APIM) Gateway"
    description: "Routes internal API requests"
    technology: "internal HTTPS/REST"
  - source: "Modern Claims Platform"
    destination: "Legacy Mainframe System"
    description: "Asynchronous data processing and synchronization across the hybrid boundary"
    technology: "Asynchronous Message Queues / Secure File Drops over Azure ExpressRoute or IPsec VPN (mTLS)"
  - source: "Modern Claims Platform"
    destination: "Active Directory / Entra ID"
    description: "Authenticates users and provides federated SSO"
    technology: "OAuth 2.0 / OpenID Connect"