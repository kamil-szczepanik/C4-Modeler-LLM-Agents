level: container
scope: "Container diagram for Modernized Insurance Claims Platform"
system:
  name: "Modernized Insurance Claims Platform"
elements:
  - type: "person"
    name: "Customer / Policyholder"
    description: "An end-user who submits claims and interacts with the insurance platform."
  - type: "person"
    name: "Broker"
    description: "An intermediary who assists policyholders and manages claims."
  - type: "person"
    name: "Claims Adjuster"
    description: "A professional who reviews and processes insurance claims using modern web applications requiring sub-2-second screen loads."
  - type: "externalSystem"
    name: "Legacy Mainframe System (COBOL/DB2)"
    description: "On-premises COBOL and DB2 database system acting as the system of record."
  - type: "externalSystem"
    name: "Active Directory / Entra ID"
    description: "Identity Provider used for Federated SSO and authentication."
  - type: "container"
    name: "Azure API Management (API Gateway)"
    technology: "Azure API Management"
    description: "Ingress gateway enforcing WAF policies, rate-limiting, and hybrid decoupling."
  - type: "container"
    name: "Customer/Broker Portal"
    technology: "Azure Container Apps"
    description: "Portal enabling online claims submission for customers and brokers."
  - type: "container"
    name: "Adjuster Web App"
    technology: "Azure Container Apps"
    description: "Web application used by claims adjusters for claims workflows."
  - type: "container"
    name: "Backend-for-Frontend (BFF)"
    technology: "Azure Container Apps / Azure Cache for Redis"
    description: "BFF service optimizing data payloads and caching claim data for sub-2-second screen loads."
  - type: "container"
    name: "Claim Processing Core"
    technology: "Azure Container Apps / Azure Service Bus"
    description: "Core service processing insurance claims using asynchronous messaging."
  - type: "container"
    name: "Notification Service"
    technology: "Azure Container Apps"
    description: "Service responsible for handling system notifications."
  - type: "container"
    name: "Data Synchronization Worker"
    technology: "Azure Container Apps"
    description: "Worker handling batch and sync integration protocols with the legacy mainframe."
  - type: "container"
    name: "Audit & Event Store"
    technology: "Azure Cosmos DB / Azure SQL"
    description: "Operational store and immutable audit trail."
relationships:
  - source: "Customer / Policyholder"
    destination: "Azure API Management (API Gateway)"
    description: "Submits claims and interacts with portal"
    technology: "HTTPS via OAuth 2.0 / OpenID Connect (Azure AD)"
  - source: "Broker"
    destination: "Azure API Management (API Gateway)"
    description: "Manages claims and interacts with portal"
    technology: "HTTPS via OAuth 2.0 / OpenID Connect (Azure AD)"
  - source: "Claims Adjuster"
    destination: "Adjuster Web App"
    description: "Reviews and processes insurance claims"
    technology: "HTTPS"
  - source: "Adjuster Web App"
    destination: "Backend-for-Frontend (BFF)"
    description: "Requests claim data and workflows"
    technology: "HTTPS / gRPC via Azure Managed Identities"
  - source: "BFF"
    destination: "Azure API Management (API Gateway)"
    description: "Routes backend API requests"
    technology: "HTTPS"
  - source: "Azure API Management (API Gateway)"
    destination: "Legacy Mainframe System (COBOL/DB2)"
    description: "Bridges Azure and on-premise legacy system"
    technology: "Mutual TLS (mTLS)"
  - source: "Claim Processing Core"
    destination: "Azure API Management (API Gateway)"
    description: "Sends asynchronous messages and processes core logic"
    technology: "AMQP / HTTPS"
  - source: "Data Synchronization Worker"
    destination: "Legacy Mainframe System (COBOL/DB2)"
    description: "Synchronizes data across the hybrid boundary"
    technology: "Batch/Sync integration protocols"
  - source: "Active Directory / Entra ID"
    destination: "Customer/Broker Portal"
    description: "Authenticates users"
    technology: "OAuth 2.0 / OpenID Connect"