level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patron"
    description: "Library patron using the self-service portals and system features."
  - type: "person"
    name: "Library Staff / Librarian"
    description: "Library staff managing item cataloging and circulation."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processing service."
  - type: "externalSystem"
    name: "Notification Provider"
    description: "External service for sending notifications."
  - type: "externalSystem"
    name: "EU Cloud Infrastructure Provider"
    description: "Cloud infrastructure provider enforcing EU data residency."
  - type: "externalSystem"
    name: "Audit Log Stream"
    description: "Centralized stream for audit logs."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / NGINX, OAuth 2.0 / OIDC"
    description: "Handles edge routing, authentication, and external client requests."
  - type: "container"
    name: "Search & Catalog Service"
    technology: "Java / Spring Boot, Elasticsearch"
    description: "Manages catalog search workloads to satisfy sub-second SLAs."
  - type: "container"
    name: "Core Circulation Service"
    technology: "Node.js / Go, PostgreSQL"
    description: "Manages core relational circulation data and operations."
  - type: "container"
    name: "Analytics Service"
    technology: "Python / FastAPI, ClickHouse"
    description: "Processes analytical circulation trends."
  - type: "container"
    name: "Notification Worker"
    technology: "Python / Celery or Go"
    description: "Asynchronously processes and dispatches notifications."
  - type: "container"
    name: "Message Broker"
    technology: "Apache Kafka / RabbitMQ"
    description: "Handles event-driven asynchronous messaging between services."
  - type: "container"
    name: "Audit Logging Sidecar"
    technology: "Fluentbit / Vector"
    description: "Collects and forwards system logs and audit data securely."
  - type: "container"
    name: "EU Kubernetes Cluster and EU Cloud Provider's HSM"
    technology: "Kubernetes, OpenTelemetry, Hardware Security Module"
    description: "Orchestrates containers and secures cryptographic keys within the EU cloud."
relationships:
  - source: "Library Patron"
    destination: "API Gateway"
    description: "Accesses self-service portals and system features"
    technology: "HTTPS / TLS 1.3"
  - source: "Library Staff / Librarian"
    destination: "API Gateway"
    description: "Manages cataloging and circulation"
    technology: "HTTPS / TLS 1.3 with OAuth 2.0 / OIDC"
  - source: "API Gateway"
    destination: "Search & Catalog Service"
    description: "Routes catalog and search requests"
    technology: "Internal mTLS and gRPC"
  - source: "API Gateway"
    destination: "Core Circulation Service"
    description: "Routes circulation requests"
    technology: "Internal mTLS and gRPC"
  - source: "API Gateway"
    destination: "Analytics Service"
    description: "Routes analytics queries"
    technology: "Internal mTLS and gRPC"
  - source: "Core Circulation Service"
    destination: "Message Broker"
    description: "Publishes circulation events"
    technology: "AMQP / gRPC"
  - source: "Message Broker"
    destination: "Notification Worker"
    description: "Consumes event messages for notifications"
    technology: "Kafka topics"
  - source: "Message Broker"
    destination: "Analytics Service"
    description: "Consumes event messages for analytical processing"
    technology: "Kafka topics"
  - source: "Audit Logging Sidecar"
    destination: "Audit Log Stream"
    description: "Streams audit logs externally"
    technology: "TLS"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Processes payments"
    technology: "REST/TLS 1.3 with circuit breakers"
  - source: "Library Management System"
    destination: "Notification Provider"
    description: "Sends notifications"
    technology: "SMTP/API with HMAC-verified webhooks"
  - source: "Library Management System"
    destination: "EU Cloud Infrastructure Provider"
    description: "Utilizes infrastructure ensuring EU data residency"
    technology: "Cloud native APIs"