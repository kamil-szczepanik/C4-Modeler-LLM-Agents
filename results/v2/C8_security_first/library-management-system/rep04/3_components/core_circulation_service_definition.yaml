level: component
scope: "Component diagram for the Core Circulation Service container"
parentContainer:
  name: "Core Circulation Service"
elements:
  - type: "component"
    name: "Circulation API Controller"
    technology: "Go"
    description: "Handles catalogue circulation and self-service portal requests."
  - type: "component"
    name: "Transaction Manager"
    technology: "Go"
    description: "Manages circulation states and transactional persistence."
  - type: "component"
    name: "Loan & Policy Engine"
    technology: "Go"
    description: "Evaluates loan policies and rules."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Go"
    description: "Publishes circulation events asynchronously."
  - type: "component"
    name: "PostgreSQL"
    technology: "PostgreSQL (Primary & Read-Replicas, AES-256 encrypted via EU Cloud HSM)"
    description: "Persists circulation states and stores loan rules."
  - type: "component"
    name: "Message Broker"
    technology: "Apache Kafka / RabbitMQ"
    description: "Message broker for downstream circulation events."
relationships:
  - source: "API Gateway"
    destination: "Circulation API Controller"
    description: "Routes circulation requests [Internal mTLS and gRPC]"
  - source: "Circulation API Controller"
    destination: "Transaction Manager"
    description: "Internal function calls [Go interfaces]"
  - source: "Circulation API Controller"
    destination: "Loan & Policy Engine"
    description: "Internal function calls [Go interfaces]"
  - source: "Transaction Manager"
    destination: "PostgreSQL"
    description: "Persists circulation states [SQL over TLS 1.3]"
  - source: "Loan & Policy Engine"
    destination: "PostgreSQL"
    description: "Queries loan rules [SQL over TLS 1.3]"
  - source: "Transaction Manager"
    destination: "Event Publisher Component"
    description: "Internal handoff [Go channels / interfaces]"
  - source: "Event Publisher Component"
    destination: "Message Broker"
    description: "Publishes circulation events [AMQP / gRPC over TLS 1.3]"