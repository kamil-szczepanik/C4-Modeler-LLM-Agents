level: component
scope: "Component diagram for the Search & Catalog Service container"
parentContainer:
  name: "Search & Catalog Service"
elements:
  - type: "component"
    name: "SearchController"
    technology: "Spring Boot / Spring WebFlux"
    description: "Handles external search and catalog queries with reactive, non-blocking execution."
  - type: "component"
    name: "CatalogQueryService"
    technology: "Spring Boot"
    description: "Processes catalog queries and interacts with Elasticsearch for discovery and faceted search."
  - type: "component"
    name: "IndexSyncWorker"
    technology: "Spring Boot / Asynchronous Worker"
    description: "Consumes catalog mutation events from Apache Kafka to maintain real-time indexing."
  - type: "component"
    name: "SearchTelemetryPublisher"
    technology: "Spring Boot / OpenTelemetry"
    description: "Emits query metrics and zero-result tracking to the Analytics Service."
  - type: "component"
    name: "SearchAnalyzerConfigurator"
    technology: "Spring Boot"
    description: "Configures multi-lingual tokenization and search analyzers for Elasticsearch."
relationships:
  - source: "IndexSyncWorker"
    destination: "Apache Kafka"
    description: "Consumes catalog mutation events [mTLS or SCRAM-SHA-512]"
  - source: "SearchTelemetryPublisher"
    destination: "Analytics Service"
    description: "Emits query metrics and zero-result tracking [OpenTelemetry]"
  - source: "SearchController"
    destination: "CatalogQueryService"
    description: "Delegates search and query requests"
  - source: "CatalogQueryService"
    destination: "Elasticsearch"
    description: "Executes faceted searches and typo-tolerant discovery"