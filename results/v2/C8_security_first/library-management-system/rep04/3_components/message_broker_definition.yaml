level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Kafka Broker Nodes"
    technology: "Apache Kafka"
    description: "Handles distributed commit log architecture, at-least-once delivery, and configurable retention for asynchronous event-driven communication."
  - type: "component"
    name: "KRaft Controller Quorum"
    technology: "Apache Kafka KRaft"
    description: "Replaces ZooKeeper for cluster metadata coordination and streamlined Kubernetes deployment."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry / Avro"
    description: "Enforces payload contracts and backward compatibility for event messages."
relationships:
  - source: "Kafka Broker Nodes"
    destination: "KRaft Controller Quorum"
    description: "Coordinates cluster metadata [KRaft Protocol]"
  - source: "Kafka Broker Nodes"
    destination: "Schema Registry"
    description: "Fetches and validates Avro schemas [HTTPS]"