# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Router"
    technology: "Kong / NGINX"
    description: "Handles edge routing, WAF, and geo-blocking to enforce EU data residency."
  - type: "component"
    name: "Auth Filter"
    technology: "OAuth 2.0 / OIDC"
    description: "Provides secure authentication and SSO for patrons and staff."
  - type: "component"
    name: "Rate Limiter"
    technology: "Kong / NGINX Plugin with Redis"
    description: "Manages rate-limiting counters for API requests."
  - type: "component"
    name: "Telemetry Exporter"
    technology: "Kong / NGINX Plugin"
    description: "Publishes telemetry metrics to the analytics service."
  - type: "component"
    name: "Schema Validator"
    technology: "Kong / NGINX Plugin"
    description: "Validates incoming request schemas."
relationships:
  - source: "Edge Router"
    destination: "Auth Filter"
    description: "Authenticates requests using OAuth 2.0 / OIDC"
  - source: "Auth Filter"
    destination: "Rate Limiter"
    description: "Checks request rate limits"
  - source: "Rate Limiter"
    destination: "Schema Validator"
    description: "Validates request payload schema"