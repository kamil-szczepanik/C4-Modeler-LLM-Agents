level: component
scope: "Component diagram for the Notification Worker container"
parentContainer:
  name: "Notification Worker"
elements:
  - type: "component"
    name: "Kafka Consumer Component"
    technology: "Go, segmentio/kafka-go"
    description: "Uses segmentio/kafka-go for safe JSON event consumption from Apache Kafka."
  - type: "component"
    name: "Preference & Template Engine Component"
    technology: "Go, text/template"
    description: "Uses Go text/template for channel opt-ins and PII sanitization."
  - type: "component"
    name: "Dispatcher & Rate-Limiter Component"
    technology: "Go, net/http, golang.org/x/time/rate"
    description: "Uses net/http and golang.org/x/time/rate for outbound API calls to notification providers."
  - type: "component"
    name: "DLQ & Audit Forwarder Component"
    technology: "Go"
    description: "Routes failed messages to Dead-Letter Queue and emits delivery events."
relationships:
  - source: "Kafka Consumer Component"
    destination: "Preference & Template Engine Component"
    description: "Passes consumed JSON events for sanitization and template processing."
  - source: "Preference & Template Engine Component"
    destination: "Dispatcher & Rate-Limiter Component"
    description: "Forwards processed messages for outbound delivery."
  - source: "Dispatcher & Rate-Limiter Component"
    destination: "DLQ & Audit Forwarder Component"
    description: "Reports delivery outcomes and failures."