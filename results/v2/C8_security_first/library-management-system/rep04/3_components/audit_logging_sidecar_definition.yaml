level: component
scope: "Component diagram for the Audit Logging Sidecar container"
parentContainer:
  name: "Audit Logging Sidecar"
elements:
  - type: "component"
    name: "Log Collector Component"
    technology: "Unix Domain Sockets"
    description: "Ingests raw logs via local Unix domain sockets."
  - type: "component"
    name: "Processor & Redaction Engine"
    technology: "HMAC-SHA256"
    description: "Strips PII and applies HMAC-SHA256 pseudonymization."
  - type: "component"
    name: "Buffer & Encryption Manager"
    technology: "AES-256 / LUKS"
    description: "Handles local disk buffering with AES-256 encryption."
  - type: "component"
    name: "Log Egress Client"
    technology: "gRPC / TLS with SPIFFE/SPIRE"
    description: "Streams signed log batches to external storage."
relationships:
  - source: "Application Containers"
    destination: "Log Collector Component"
    description: "Streams raw logs locally [Unix Domain Sockets]"
  - source: "Buffer & Encryption Manager"
    destination: "EU Cloud Provider's HSM"
    description: "Retrieves keys for at-rest encryption [HTTPS/TLS]"
  - source: "Log Egress Client"
    destination: "Audit Log Stream"
    description: "Streams encrypted, signed payloads [gRPC/TLS with SPIFFE/SPIRE mTLS]"