level: component
scope: "Component diagram for the Analytics Service container"
parentContainer:
  name: "Analytics Service"
elements:
  - type: "component"
    name: "Ingestion Worker"
    technology: "Python / Faust or Celery"
    description: "Consumes event messages via Kafka Consumer API and bulk inserts events into ClickHouse storage."
  - type: "component"
    name: "Query API"
    technology: "Python / FastAPI"
    description: "Routes analytics queries, executes read queries against ClickHouse, and delegates export tasks."
  - type: "component"
    name: "Aggregation Engine"
    technology: "ClickHouse Materialized Views"
    description: "Provides high-performance aggregations and transparent data encryption (TDE)."
  - type: "component"
    name: "Report Generation Worker"
    technology: "Python / Celery"
    description: "Queries historical aggregates and handles background report generation tasks."
relationships:
  - source: "Ingestion Worker"
    destination: "Aggregation Engine"
    description: "Bulk inserts events via ClickHouse Native Protocol"
  - source: "Query API"
    destination: "Aggregation Engine"
    description: "Executes read queries via ClickHouse SQL over HTTP/Native"
  - source: "Query API"
    destination: "Report Generation Worker"
    description: "Delegates export tasks via Redis / Message Broker queue"
  - source: "Report Generation Worker"
    destination: "Aggregation Engine"
    description: "Queries historical aggregates via ClickHouse SQL over HTTP"