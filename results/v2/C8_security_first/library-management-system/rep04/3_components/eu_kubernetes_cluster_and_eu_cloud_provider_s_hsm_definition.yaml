level: component
scope: "Component diagram for the EU Kubernetes Cluster and HSM container"
parentContainer:
  name: "EU Kubernetes Cluster and EU Cloud Provider's HSM"
elements:
  - type: "component"
    name: "Kubernetes Control Plane and Worker Nodes"
    technology: "Kubernetes, Containerd, Bare-metal"
    description: "Orchestrates resilient microservices hosted in EU region for strict data residency compliance."
  - type: "component"
    name: "Istio Service Mesh"
    technology: "Istio, Cilium, Sidecars"
    description: "Provides zero-trust mTLS and network policy enforcement for internal microservices communication."
  - type: "component"
    name: "HSM Crypto-Plugin and PKCS#11 Daemon"
    technology: "PKCS#11, KMIP"
    description: "Cryptographic interface for secure envelope encryption and key wrapping."
  - type: "component"
    name: "External Secrets Operator"
    technology: "External Secrets Operator"
    description: "Manages secrets injection by connecting to the Cloud HSM using KMIP/PKCS#11 over TLS 1.3."
  - type: "component"
    name: "SPIRE Agent and Server DaemonSet"
    technology: "SPIFFE/SPIRE"
    description: "Provisions workload identities to pods securely."
  - type: "component"
    name: "OpenTelemetry Collector"
    technology: "OpenTelemetry"
    description: "Gathers telemetry metrics and traces to monitor cryptographic latency and protect the search SLA."
  - type: "component"
    name: "KEDA"
    technology: "KEDA"
    description: "Handles event-driven autoscaling to maintain the < 800 ms search SLA under peak loads."
  - type: "component"
    name: "EU Cloud Provider's Hardware Security Module (HSM)"
    technology: "Hardware Security Module (HSM)"
    description: "Secures cryptographic keys exclusively within EU data centers."
relationships:
  - source: "Kubernetes Control Plane and Worker Nodes"
    destination: "Istio Service Mesh"
    description: "Routes and secures microservices traffic using mTLS via gRPC"
  - source: "External Secrets Operator"
    destination: "EU Cloud Provider's Hardware Security Module (HSM)"
    description: "Connects to the Cloud HSM using KMIP/PKCS#11 over TLS 1.3"
  - source: "SPIRE Agent and Server DaemonSet"
    destination: "Kubernetes Control Plane and Worker Nodes"
    description: "Provisions workload identities to pods using SPIFFE/SPIRE protocols"
  - source: "OpenTelemetry Collector"
    destination: "KEDA"
    description: "Feeds telemetry metrics and traces to drive autoscaling"
  - source: "OpenTelemetry Collector"
    destination: "HSM Crypto-Plugin and PKCS#11 Daemon"
    description: "Monitors cryptographic latency to protect the search SLA"