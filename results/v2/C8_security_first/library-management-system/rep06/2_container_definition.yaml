level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Self-service users accessing the library system for cataloging and circulation services."
  - type: "person"
    name: "Librarians/Catalogers"
    description: "Inventory managers responsible for cataloging and managing library resources."
  - type: "person"
    name: "Library Administrators"
    description: "System configurers responsible for managing system settings and security."
  - type: "externalSystem"
    name: "EU Payment Gateway"
    description: "External gateway handling payment transactions."
  - type: "externalSystem"
    name: "National Library Database"
    description: "External national database for library records and synchronization."
  - type: "container"
    name: "Patron Portal"
    technology: "Next.js"
    description: "Self-service portal for library patrons."
  - type: "container"
    name: "Librarian Dashboard"
    technology: "React"
    description: "Dashboard for librarians and catalogers."
  - type: "container"
    name: "API Gateway"
    technology: "Kong/Envoy"
    description: "API Gateway handling routing and entry to core services."
  - type: "container"
    name: "Search & Catalogue Service"
    technology: "Elasticsearch/OpenSearch"
    description: "Service for searching and cataloging library items."
  - type: "container"
    name: "Circulation Service"
    technology: "Node.js/Go"
    description: "Service managing circulation and loans."
  - type: "container"
    name: "Notification Service"
    technology: "Node.js/Go"
    description: "Service handling notifications to users."
  - type: "container"
    name: "Integration Service"
    technology: "Python/Go"
    description: "Service integrating with external systems like payment gateways and national databases."
  - type: "container"
    name: "Message Broker"
    technology: "Kafka/RabbitMQ"
    description: "Message broker for asynchronous communication between services."
  - type: "container"
    name: "PostgreSQL Database"
    technology: "PostgreSQL with Read Replicas"
    description: "Transactional storage for system data."
  - type: "container"
    name: "Identity Provider"
    technology: "OAuth 2.0 / OIDC"
    description: "Handles authentication and authorization."
  - type: "container"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Manages secrets and sensitive data."
relationships:
  - source: "Library Patrons"
    destination: "Patron Portal"
    description: "Accesses self-service features"
    technology: "HTTPS"
  - source: "Librarians/Catalogers"
    destination: "Librarian Dashboard"
    description: "Manages catalog and circulation"
    technology: "HTTPS"
  - source: "Library Administrators"
    destination: "Librarian Dashboard"
    description: "Configures system settings"
    technology: "HTTPS"
  - source: "Patron Portal"
    destination: "API Gateway"
    description: "Makes API requests"
    technology: "HTTPS (REST/GraphQL) with OAuth 2.0 / OIDC tokens"
  - source: "Librarian Dashboard"
    destination: "API Gateway"
    description: "Makes API requests"
    technology: "HTTPS (REST/GraphQL) with OAuth 2.0 / OIDC tokens"
  - source: "API Gateway"
    destination: "Search & Catalogue Service"
    description: "Queries catalogue"
    technology: "gRPC with mTLS"
  - source: "Circulation Service"
    destination: "Message Broker"
    description: "Publishes and consumes messages"
    technology: "AMQP"
  - source: "Notification Service"
    destination: "Message Broker"
    description: "Publishes and consumes messages"
    technology: "AMQP"
  - source: "Integration Service"
    destination: "Message Broker"
    description: "Publishes and consumes messages"
    technology: "AMQP"
  - source: "Integration Service"
    destination: "EU Payment Gateway"
    description: "Processes payments"
    technology: "REST with circuit breakers"
  - source: "Integration Service"
    destination: "National Library Database"
    description: "Synchronizes library records"
    technology: "REST with circuit breakers"
  - source: "Circulation Service"
    destination: "PostgreSQL Database"
    description: "Reads and writes transactional data"
    technology: "TLS 1.3 and mTLS"
  - source: "Search & Catalogue Service"
    destination: "PostgreSQL Database"
    description: "Reads and writes data"
    technology: "TLS 1.3 and mTLS"