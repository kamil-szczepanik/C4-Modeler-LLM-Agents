level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Cloud-native platform providing cataloging, circulation, and self-service portals for public and academic libraries while adhering to strict EU data residency constraints."
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Self-service users accessing the library system for cataloging and circulation services."
  - type: "person"
    name: "Librarians/Catalogers"
    description: "Inventory managers responsible for cataloging and managing library resources."
  - type: "person"
    name: "Library Administrators"
    description: "System configurers responsible for managing system settings and security."
  - type: "externalSystem"
    name: "EU Payment Gateway"
    description: "External gateway handling payment transactions."
  - type: "externalSystem"
    name: "National Library Database"
    description: "External national database for library records and synchronization."
relationships:
  - source: "Library Patrons"
    destination: "Library Management System"
    description: "Accesses self-service portals and circulation features"
    technology: "HTTPS/TLS 1.3 (OAuth2/OIDC)"
  - source: "Librarians/Catalogers"
    destination: "Library Management System"
    description: "Manages inventory and cataloging"
    technology: "HTTPS/TLS 1.3 (MFA/RBAC)"
  - source: "Library Administrators"
    destination: "Library Management System"
    description: "Configures and manages system settings"
    technology: "HTTPS/TLS 1.3 (MFA/RBAC)"
  - source: "Library Management System"
    destination: "EU Payment Gateway"
    description: "Processes payments"
    technology: "HTTPS/REST with mTLS"
  - source: "Library Management System"
    destination: "National Library Database"
    description: "Queries and synchronizes library records"
    technology: "SOAP/REST over HTTPS with mTLS"