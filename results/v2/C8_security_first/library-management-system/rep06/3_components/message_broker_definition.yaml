level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Exchange Routing Engine"
    technology: "RabbitMQ Exchange"
    description: "Provides flexible AMQP routing and topic ACLs for event distribution."
  - type: "component"
    name: "Queue Manager"
    technology: "RabbitMQ Quorum Queues"
    description: "Manages mirrored quorum queues across EU zones for zero data loss."
  - type: "component"
    name: "Consumer Delivery Manager"
    technology: "AMQP 0-9-1"
    description: "Handles event delivery and consumption for services like Circulation, Notification, and Integration."
  - type: "component"
    name: "Dead-Letter Routing & Policy Engine"
    technology: "RabbitMQ Dead-Lettering"
    description: "Provides per-queue dead-lettering and failure management."
  - type: "component"
    name: "Access Control & TLS Termination Proxy"
    technology: "TLS 1.3 & mTLS"
    description: "Enforces strict transport security, service authentication, and fine-grained topic ACLs."
relationships:
  - source: "Circulation Service"
    destination: "Exchange Routing Engine"
    description: "Publishes/consumes events [AMQP 0-9-1 via TLS 1.3]"
  - source: "Notification Service"
    destination: "Consumer Delivery Manager"
    description: "Consumes events [AMQP 0-9-1 via TLS 1.3]"
  - source: "Integration Service"
    destination: "Exchange Routing Engine"
    description: "Publishes/consumes events [AMQP 0-9-1 via TLS 1.3]"