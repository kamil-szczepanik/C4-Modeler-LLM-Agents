level: component
scope: "Component diagram for the Integration Service container"
parentContainer:
  name: "Integration Service"
elements:
  - type: "component"
    name: "API Client Component"
    technology: "Go SDK"
    description: "Communicates securely with external services like the EU Payment Gateway and National Library Database using REST over TLS 1.3."
  - type: "component"
    name: "Message Consumer/Producer Component"
    technology: "Go"
    description: "Publishes and consumes asynchronous messages with the Message Broker using AMQP with mTLS."
  - type: "component"
    name: "Synchronization Orchestrator"
    technology: "Go"
    description: "Coordinates the synchronization of library records with external national databases while adhering to EU data residency rules."
  - type: "component"
    name: "Idempotency Manager Component"
    technology: "Go, Redis"
    description: "Powers transaction deduplication to prevent duplicate processing and handles asynchronous retry queues."
  - type: "component"
    name: "Vault Integration Client"
    technology: "Go, HashiCorp Vault"
    description: "Dynamically fetches runtime credentials using short-lived tokens, eliminating local credential storage."
relationships:
  - source: "API Client Component"
    destination: "EU Payment Gateway"
    description: "Processes payments and webhooks [REST over TLS 1.3 with circuit breakers]"
  - source: "API Client Component"
    destination: "National Library Database"
    description: "Synchronizes library records [REST over TLS 1.3 with rate limiting]"
  - source: "Message Consumer/Producer Component"
    destination: "Message Broker"
    description: "Publishes and consumes messages [AMQP with mTLS]"
  - source: "Vault Integration Client"
    destination: "HashiCorp Vault"
    description: "Dynamically fetches runtime credentials [REST via short-lived tokens]"
  - source: "Idempotency Manager Component"
    destination: "Redis"
    description: "Stores transaction state to prevent duplicate transactions"