# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the PostgreSQL Database container"
parentContainer:
  name: "PostgreSQL Database"
elements:
  - type: "component"
    name: "Primary Transaction Engine"
    technology: "PostgreSQL Primary, Row-Level Security, pgaudit"
    description: "Handles all write operations, enforcing Row-Level Security and pgaudit logging."
  - type: "component"
    name: "Read Replica Instances"
    technology: "PostgreSQL Replicas"
    description: "Offloads read-heavy operations and hosts the dedicated Reporting & Analytics Schema."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Manages incoming database connections and terminates mTLS."
  - type: "component"
    name: "Reporting & Analytics Schema"
    technology: "PostgreSQL Schema"
    description: "Serves isolated analytical queries for Library Administrators."
  - type: "component"
    name: "High-Availability Standby"
    technology: "Streaming Replication, WAL-shipping"
    description: "Synchronizes state with the Primary Transaction Engine."
relationships:
  - source: "Connection Pooler"
    destination: "Primary Transaction Engine"
    description: "Proxies write operations via TCP with inner-node TLS 1.3"
  - source: "Connection Pooler"
    destination: "Read Replica Instances"
    description: "Routes read-only reports via TCP with inner-node TLS 1.3"
  - source: "Primary Transaction Engine"
    destination: "High-Availability Standby"
    description: "Synchronizes state via WAL-shipping (Streaming Replication)"
  - source: "Read Replica Instances"
    destination: "Reporting & Analytics Schema"
    description: "Serves isolated analytical queries for Library Administrators"