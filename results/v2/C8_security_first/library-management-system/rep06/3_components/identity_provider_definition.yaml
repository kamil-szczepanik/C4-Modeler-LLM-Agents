level: component
scope: "Component diagram for the Identity Provider container"
parentContainer:
  name: "Identity Provider"
elements:
  - type: "component"
    name: "Authentication Engine"
    technology: "Keycloak / Java/Quarkus"
    description: "Handles OIDC/OAuth2 protocols and PKCE."
  - type: "component"
    name: "User Management & RBAC Service"
    technology: "Keycloak / Java/Quarkus"
    description: "Manages profiles and maps roles to JWT claims."
  - type: "component"
    name: "Session & Token Management Service"
    technology: "Keycloak / Java/Quarkus"
    description: "Manages active user sessions and token revocation."
  - type: "component"
    name: "Adaptive MFA & Policy Engine"
    technology: "Keycloak / Java/Quarkus"
    description: "Evaluates risk signals for step-up authentication."
  - type: "component"
    name: "Federation & JIT Provisioning Component"
    technology: "Keycloak / Java/Quarkus"
    description: "Manages external IdPs (Google, Shibboleth SAML)."
  - type: "component"
    name: "UI & Localization Component"
    technology: "Keycloak / Java/Quarkus"
    description: "Renders multi-language login and consent pages."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Stores cryptographic key material."
  - type: "component"
    name: "PostgreSQL Database"
    technology: "PostgreSQL"
    description: "Persists identity state."
  - type: "component"
    name: "Patron Portal"
    technology: "Web Frontend"
    description: "Client portal interacting with the Identity Provider."
  - type: "component"
    name: "Librarian Dashboard"
    technology: "Web Frontend"
    description: "Staff dashboard interacting with the Identity Provider."
  - type: "component"
    name: "Infinispan"
    technology: "Infinispan"
    description: "Distributed session clustering and replication across Keycloak replicas."
relationships:
  - source: "Patron Portal"
    destination: "Authentication Engine"
    description: "HTTPS (OIDC Authorization Code Flow with PKCE)"
  - source: "Librarian Dashboard"
    destination: "Authentication Engine"
    description: "HTTPS (OIDC Authorization Code Flow with PKCE)"
  - source: "Session & Token Management Service"
    destination: "HashiCorp Vault"
    description: "HTTPS/REST (Transit Secrets Engine)"
  - source: "Authentication Engine"
    destination: "PostgreSQL Database"
    description: "JDBC (TLS)"
  - source: "Session & Token Management Service"
    destination: "PostgreSQL Database"
    description: "JDBC (TLS)"
  - source: "Session & Token Management Service"
    destination: "Infinispan"
    description: "Inter-node session replication (ENCRYPT_TCP)"