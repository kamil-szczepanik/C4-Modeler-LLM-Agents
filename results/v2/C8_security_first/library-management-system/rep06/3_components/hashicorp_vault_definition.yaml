level: component
scope: "Component diagram for the HashiCorp Vault container"
parentContainer:
  name: "HashiCorp Vault"
elements:
  - type: "component"
    name: "Core/HTTP API Layer"
    technology: "HashiCorp Vault Go-based API engine"
    description: "Handles secure REST/HTTPS requests, policy enforcement, and core secrets management operations."
  - type: "component"
    name: "Integrated Raft Storage Backend"
    technology: "Raft Consensus Algorithm Storage"
    description: "Persists encrypted data locally within the container ensuring strict EU data residency compliance."
  - type: "component"
    name: "Vault Agent Sidecar"
    technology: "HashiCorp Vault Agent"
    description: "Provides client-side caching, automated authentication, and transit security via Unix Domain Sockets or localhost TCP."
relationships:
  - source: "Vault Agent Sidecar"
    destination: "Core/HTTP API Layer"
    description: "Communicates via HTTPS (REST) over mTLS on Port 8200"
  - source: "Core/HTTP API Layer"
    destination: "Integrated Raft Storage Backend"
    description: "Persists encrypted data using Raft internal RPC over TLS"