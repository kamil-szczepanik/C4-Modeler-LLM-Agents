level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Envoy Proxy Router"
    technology: "Envoy Proxy, xDS dynamic control planes"
    description: "Handles routing, ingress security, gRPC-web support, and low memory footprint traffic management."
  - type: "component"
    name: "Rate Limiting Module"
    technology: "Envoy Proxy Rate Limit Service"
    description: "Enforces strict rate-limiting policies for incoming public and academic library requests."
  - type: "component"
    name: "Security & Wasm Filter"
    technology: "WebAssembly (Wasm) filters, TLS 1.3"
    description: "Executes custom security checks, handles mTLS certificate rotation integration with HashiCorp Vault, and validates EU-only data residency constraints."
relationships:
  - source: "Envoy Proxy Router"
    destination: "Rate Limiting Module"
    description: "Inspects incoming requests against rate-limiting rules"
  - source: "Envoy Proxy Router"
    destination: "Security & Wasm Filter"
    description: "Passes ingress traffic through Wasm filters for inspection and token handling"
  - source: "Security & Wasm Filter"
    destination: "Search & Catalogue Service"
    description: "Routes queries via gRPC with mTLS"