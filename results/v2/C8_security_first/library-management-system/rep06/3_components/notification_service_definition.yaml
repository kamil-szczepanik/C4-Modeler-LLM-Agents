level: component
scope: "Component diagram for the Notification Service container"
parentContainer:
  name: "Notification Service"
elements:
  - type: "component"
    name: "Event Consumer Component"
    technology: "Go"
    description: "Consumes domain events from the message broker."
  - type: "component"
    name: "Preference & Template Engine"
    technology: "Node.js/Go"
    description: "Queries preferences and opt-out flags from the database."
  - type: "component"
    name: "Dispatch Adapter Component"
    technology: "Go"
    description: "Sends notifications to external providers and fetches secrets."
  - type: "component"
    name: "Audit & Logging Component"
    technology: "Go"
    description: "Records delivery timestamps."
  - type: "component"
    name: "Message Broker"
    technology: "Kafka/RabbitMQ"
    description: "Provides asynchronous queuing and dead-letter queues."
  - type: "component"
    name: "PostgreSQL Database"
    technology: "PostgreSQL"
    description: "Stores anonymized delivery logs and patron channel preferences."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Manages dynamic credentials with AppRole authentication."
  - type: "component"
    name: "External EU-hosted Email/SMS Providers"
    technology: "HTTPS/TLS 1.3"
    description: "Sends external notifications."
relationships:
  - source: "Event Consumer Component"
    destination: "Message Broker"
    description: "Consumes domain events [AMQP/mTLS]"
  - source: "Preference & Template Engine"
    destination: "PostgreSQL Database"
    description: "Queries preferences and opt-out flags [SQL/TLS]"
  - source: "Dispatch Adapter Component"
    destination: "HashiCorp Vault"
    description: "Fetches provider secrets [HTTPS/Token Auth with AppRole]"
  - source: "Dispatch Adapter Component"
    destination: "External EU-hosted Email/SMS Providers"
    description: "Sends notifications [HTTPS/TLS 1.3]"
  - source: "Dispatch Adapter Component"
    destination: "Audit & Logging Component"
    description: "Records delivery timestamps [In-memory/gRPC]"