level: component
scope: "Component diagram for the Patron Portal container"
parentContainer:
  name: "Patron Portal"
elements:
  - type: "component"
    name: "UI Presentation Layer"
    technology: "React / Tailwind CSS"
    description: "Powers server-rendered UI for performance and WCAG 2.1 AA accessibility."
  - type: "component"
    name: "BFF / Route Handler Layer"
    technology: "Next.js Node.js runtime"
    description: "Isolates sensitive session tokens and handles proxied requests with OIDC tokens."
  - type: "component"
    name: "Patron Portal Container"
    technology: "Next.js"
    description: "Secure self-service web interface enabling library patrons to catalogue items, manage accounts, and handle circulation tasks."
relationships:
  - source: "UI Presentation Layer"
    destination: "BFF / Route Handler Layer"
    description: "Internal React Server Actions [Direct IPC]"
  - source: "BFF / Route Handler Layer"
    destination: "Patron Portal Container"
    description: "Serves application logic and handles routing"