level: component
scope: "Component diagram for the Circulation Service container"
parentContainer:
  name: "Circulation Service"
elements:
  - type: "component"
    name: "Loan API Controller"
    technology: "REST/gRPC, Go"
    description: "Validates incoming JWTs from the API Gateway and enforces RBAC."
  - type: "component"
    name: "Loan Domain Engine"
    technology: "Go"
    description: "Core business logic handling checkouts, renewals, returns, and grace periods."
  - type: "component"
    name: "Circulation Repository & Outbox Store"
    technology: "Go, pgx Driver"
    description: "Data access layer managing transactional state and reliable event publishing."
  - type: "component"
    name: "Event Publisher/Subscriber"
    technology: "Go, AMQP"
    description: "Asynchronous message handler interfacing with the message broker."
  - type: "component"
    name: "PostgreSQL Database"
    technology: "PostgreSQL"
    description: "Persistent transactional store utilizing read replicas."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "Vault"
    description: "Dynamic secrets and encryption key manager."
  - type: "component"
    name: "API Gateway"
    technology: "Gateway"
    description: "Forwards authenticated requests via JWT/OAuth 2.0."
  - type: "component"
    name: "Message Broker"
    technology: "AMQP"
    description: "Receives published domain events using the Outbox Pattern."
relationships:
  - source: "API Gateway"
    destination: "Loan API Controller"
    description: "Forwards authenticated requests via JWT/OAuth 2.0."
  - source: "Loan Domain Engine"
    destination: "Circulation Repository & Outbox Store"
    description: "Executes transactional reads/writes."
  - source: "Circulation Repository & Outbox Store"
    destination: "PostgreSQL Database"
    description: "Persists data securely via TLS 1.3 and mTLS."
  - source: "Event Publisher/Subscriber"
    destination: "Message Broker"
    description: "Publishes domain events using AMQP with the Outbox Pattern."
  - source: "Loan API Controller"
    destination: "HashiCorp Vault"
    description: "Fetches dynamic secrets via Kubernetes Service Account token exchange."