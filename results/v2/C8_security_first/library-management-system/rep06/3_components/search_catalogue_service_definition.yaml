level: component
scope: "Component diagram for the Search & Catalogue Service container"
parentContainer:
  name: "Search & Catalogue Service"
elements:
  - type: "component"
    name: "Search API Controller"
    technology: "Go, Gin/gRPC"
    description: "Handles high-throughput, low-latency search query handling and offloads anonymized query metrics."
  - type: "component"
    name: "Catalog Management Engine"
    technology: "Python, FastAPI"
    description: "Efficiently handles complex metadata ingestion and synchronizes metadata updates."
  - type: "component"
    name: "Search Index Client"
    technology: "OpenSearch wrapper with Facet Configuration Component"
    description: "Manages multi-format indexing, faceting, and relevance scoring."
  - type: "component"
    name: "Analytics & Logging Collector"
    technology: "Async Worker"
    description: "Offloads and collects anonymized query metrics via message queues."
  - type: "component"
    name: "OpenSearch Cluster"
    technology: "Kubernetes StatefulSet with EU-localized Persistent Volumes"
    description: "Provides multi-format physical and digital asset discovery compliant with EU data residency."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Provides secure, dynamic credential management and TDE encryption keys via sidecars."
relationships:
  - source: "API Gateway"
    destination: "Search API Controller"
    description: "Queries catalogue via gRPC with mTLS"
  - source: "Search API Controller"
    destination: "Search Index Client"
    description: "Executes search queries via OpenSearch REST API over TLS 1.3"
  - source: "Catalog Management Engine"
    destination: "Search Index Client"
    description: "Synchronizes metadata updates via OpenSearch Bulk API over TLS 1.3"
  - source: "Search API Controller"
    destination: "Analytics & Logging Collector"
    description: "Offloads anonymized query metrics via Kafka/RabbitMQ"
  - source: "Search API Controller"
    destination: "HashiCorp Vault"
    description: "Dynamic secret injection via HashiCorp Vault sidecars"
  - source: "Catalog Management Engine"
    destination: "HashiCorp Vault"
    description: "Dynamic secret injection via HashiCorp Vault sidecars"
  - source: "Search Index Client"
    destination: "OpenSearch Cluster"
    description: "Reads and writes index data via REST API"