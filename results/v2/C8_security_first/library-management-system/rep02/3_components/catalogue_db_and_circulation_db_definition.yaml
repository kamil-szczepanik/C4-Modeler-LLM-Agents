level: component
scope: "Component diagram for the Catalogue DB and Circulation DB container"
parentContainer:
  name: "Catalogue DB and Circulation DB"
elements:
  - type: "component"
    name: "PostgreSQL"
    technology: "Relational database with AES-256 encrypted EU persistent volumes"
    description: "Primary and Replica instances providing relational storage for catalogue and circulation data."
  - type: "component"
    name: "Patroni"
    technology: "High-availability template for PostgreSQL"
    description: "Manages high availability and automated failover for PostgreSQL across availability zones."
  - type: "component"
    name: "PgBouncer"
    technology: "Connection pooling sidecar"
    description: "Manages persistent database connections and prevents saturation via connection pooling."
  - type: "component"
    name: "Flyway/Liquibase"
    technology: "Migration runner container"
    description: "Executes CI/CD-driven, zero-downtime, backward-compatible schema changes."
  - type: "component"
    name: "Prometheus"
    technology: "Observability and monitoring"
    description: "Scrapes metrics via Prometheus exporters from PostgreSQL and PgBouncer."
relationships:
  - source: "Catalogue Service"
    destination: "PostgreSQL"
    description: "Reads catalogue data via TCP/Postgres wire protocol over mTLS and PgBouncer"
  - source: "Circulation & Loan Service"
    destination: "PostgreSQL"
    description: "Reads/writes circulation data via TCP/Postgres wire protocol over mTLS and PgBouncer"
  - source: "Prometheus"
    destination: "PostgreSQL"
    description: "Scrapes metrics via Prometheus exporters"
  - source: "Prometheus"
    destination: "PgBouncer"
    description: "Scrapes metrics via Prometheus exporters"