level: component
scope: "Component diagram for the Circulation & Loan Service container"
parentContainer:
  name: "Circulation & Loan Service"
elements:
  - type: "component"
    name: "Loan API Controller"
    technology: "Express.js"
    description: "Handling gRPC routing and Zod schema validation."
  - type: "component"
    name: "Circulation Workflow Engine"
    technology: "Node.js service layer"
    description: "Managing transactional states, grace periods, and hold expiry."
  - type: "component"
    name: "Data Access Layer"
    technology: "Repository component"
    description: "Enforcing column-level encryption and least-privilege connection pooling."
  - type: "component"
    name: "Outbox Pattern Component"
    technology: "Node.js"
    description: "Transactional outbox processor for reliable asynchronous messaging."
  - type: "component"
    name: "Event Publisher/Subscriber"
    technology: "AMQP"
    description: "Publishing domain events over AMQP to the Message Broker."
  - type: "component"
    name: "Payment Client"
    technology: "HTTPS with REST/JSON"
    description: "Encapsulating integration logic with the Payment Gateway over HTTPS with idempotency keys."
  - type: "component"
    name: "Envoy Proxy"
    technology: "Envoy"
    description: "Routes gRPC/Protobuf requests with mTLS and forwarded JWT claims."
  - type: "component"
    name: "Circulation DB"
    technology: "PostgreSQL"
    description: "Persistent storage for encrypted circulation data."
  - type: "component"
    name: "Message Broker"
    technology: "RabbitMQ"
    description: "Message broker supporting transactional outbox patterns."
  - type: "component"
    name: "Payment Gateway"
    technology: "HTTPS/REST"
    description: "External gateway for processing fine settlements."
relationships:
  - source: "Envoy Proxy"
    destination: "Loan API Controller"
    description: "Routes gRPC/Protobuf requests with mTLS and forwarded JWT claims"
  - source: "Data Access Layer"
    destination: "Circulation DB"
    description: "Reads and writes encrypted circulation data using gRPC/Protobuf"
  - source: "Event Publisher/Subscriber"
    destination: "Message Broker"
    description: "Publishes and consumes domain events using AMQP"
  - source: "Payment Client"
    destination: "Payment Gateway"
    description: "Processes fine settlements using HTTPS with REST/JSON"