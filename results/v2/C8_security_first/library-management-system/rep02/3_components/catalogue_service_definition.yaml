level: component
scope: "Component diagram for the Catalogue Service container"
parentContainer:
  name: "Catalogue Service"
elements:
  - type: "component"
    name: "API Controller"
    technology: "Spring MVC/gRPC"
    description: "Handles incoming cataloguing requests and API calls."
  - type: "component"
    name: "Catalogue Management Domain"
    technology: "Java"
    description: "Encapsulates the core business logic for catalogue management."
  - type: "component"
    name: "Search & Query Component"
    technology: "Java"
    description: "Processes search queries and interacts with the search indexer."
  - type: "component"
    name: "Event Publisher"
    technology: "Java"
    description: "Publishes signed domain events via RabbitMQ."
  - type: "component"
    name: "Catalogue Analytics Component"
    technology: "Java"
    description: "Provides analytics and metadata reporting for the catalogue."
relationships:
  - source: "API Controller"
    destination: "Catalogue Management Domain"
    description: "Delegates requests to"
  - source: "Catalogue Management Domain"
    destination: "Search & Query Component"
    description: "Updates search models via"
  - source: "Catalogue Management Domain"
    destination: "Event Publisher"
    description: "Triggers domain events through"
  - source: "Catalogue Analytics Component"
    destination: "Catalogue Management Domain"
    description: "Reads analytics data from"