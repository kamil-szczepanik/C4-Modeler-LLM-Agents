# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Web Application Container container"
parentContainer:
  name: "Web Application Container"
elements:
  # Components within the parent container's boundary
  - type: "component"
    name: "Frontend Router and UI Engine"
    technology: "React"
    description: "Delivers high-performance UI rendering and manages client-side routing for self-service and management portals."
  - type: "component"
    name: "Web Server & Security Layer"
    technology: "NGINX"
    description: "Serves static assets, enforces strict security headers, and handles reverse proxying for the React frontend."
relationships:
  - source: "Web Server & Security Layer"
    destination: "Frontend Router and UI Engine"
    description: "Serves rendered UI assets and routes incoming web traffic"