level: component
scope: "Component diagram for the Search Indexer container"
parentContainer:
  name: "Search Indexer"
elements:
  - type: "component"
    name: "Indexing Worker Component"
    technology: "Python / Celery"
    description: "Asynchronous worker handling payload sanitization and bulk-writes."
  - type: "component"
    name: "Index Management API Component"
    technology: "Python FastAPI"
    description: "Exposes administrative health checks and re-index triggers."
  - type: "component"
    name: "Elasticsearch Engine Component"
    technology: "Elasticsearch v8"
    description: "Provides inverted indices with AES-256 encryption at rest."
  - type: "component"
    name: "Message Broker"
    technology: "RabbitMQ"
    description: "Manages asynchronous ingestion queues with AMQP over TLS 1.3."
  - type: "component"
    name: "Web Application Container"
    technology: "HTTPS/JSON with JWT RBAC"
    description: "Web application interacting with administrative controls."
  - type: "component"
    name: "Library Staff & Administrators"
    technology: "JWT role-based access control"
    description: "Authenticated users accessing monitoring dashboards."
relationships:
  - source: "Message Broker"
    destination: "Indexing Worker Component"
    description: "Consumes catalogue events [AMQP over TLS 1.3]"
  - source: "Indexing Worker Component"
    destination: "Elasticsearch Engine Component"
    description: "Bulk-writes and searches [HTTP/REST over mTLS]"
  - source: "Index Management API Component"
    destination: "Elasticsearch Engine Component"
    description: "Bulk-writes and searches [HTTP/REST over mTLS]"
  - source: "Web Application Container"
    destination: "Index Management API Component"
    description: "Exposes administrative controls [HTTPS/JSON with JWT RBAC]"