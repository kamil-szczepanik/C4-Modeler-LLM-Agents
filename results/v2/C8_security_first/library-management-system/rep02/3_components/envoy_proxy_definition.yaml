level: component
scope: "Component diagram for the Envoy Proxy container"
parentContainer:
  name: "Envoy Proxy"
elements:
  - type: "component"
    name: "Listener Subsystem"
    technology: "Envoy Core"
    description: "Accepts incoming network connections and handles initial connection setup."
  - type: "component"
    name: "HTTP Connection Manager (HCM)"
    technology: "Envoy HCM"
    description: "Manages HTTP-level routing, request transformations, and connection management."
  - type: "component"
    name: "JWT Authentication Filter"
    technology: "Envoy Auth Filter"
    description: "Validates JSON Web Tokens issued by the Enterprise Identity Provider at the edge."
  - type: "component"
    name: "Rate Limit Filter"
    technology: "Envoy Filter"
    description: "Enforces token-bucket rate limiting to safeguard system performance."
  - type: "component"
    name: "Cluster Manager"
    technology: "Envoy Cluster Manager"
    description: "Manages upstream clusters, load balancing, and routing via mTLS and gRPC/Protobuf."
relationships:
  - source: "Listener Subsystem"
    destination: "HTTP Connection Manager (HCM)"
    description: "Passes raw network traffic for HTTP processing"
  - source: "HTTP Connection Manager (HCM)"
    destination: "JWT Authentication Filter"
    description: "Inspects requests to validate security tokens"
  - source: "HTTP Connection Manager (HCM)"
    destination: "Rate Limit Filter"
    description: "Evaluates request traffic against rate limits"
  - source: "HTTP Connection Manager (HCM)"
    destination: "Cluster Manager"
    description: "Routes processed requests to downstream services"