level: component
scope: "Component diagram for the Notification Service Worker container"
parentContainer:
  name: "Notification Service Worker"
elements:
  - type: "component"
    name: "RabbitMQ Message Consumer"
    technology: "Python FastAPI / AMQP with TLS"
    description: "Internal component listening to the message broker over AMQP with TLS."
  - type: "component"
    name: "Notification Dispatcher Engine"
    technology: "Python FastAPI"
    description: "Internal component coordinating payload validation and routing."
  - type: "component"
    name: "Preference & Localization Filter"
    technology: "Python FastAPI"
    description: "Internal component verifying patron notification preferences, localization, and quiet-hours."
  - type: "component"
    name: "External API Client (Httpx)"
    technology: "Python Httpx"
    description: "Internal component managing outbound HTTPS requests with circuit breakers and exponential backoff."
  - type: "component"
    name: "Dead-Letter Handler"
    technology: "Python FastAPI / RabbitMQ DLQ"
    description: "Internal component routing permanently failed messages to RabbitMQ DLQ."
  - type: "component"
    name: "External Notification Service"
    technology: "External System / HTTPS (REST/JSON) with TLS 1.3 and mTLS"
    description: "External system receiving dispatched notifications."
relationships:
  - source: "RabbitMQ Message Consumer"
    destination: "Notification Dispatcher Engine"
    description: "Internal function call [AMQP with TLS]"
  - source: "Notification Dispatcher Engine"
    destination: "Preference & Localization Filter"
    description: "Internal async call"
  - source: "Preference & Localization Filter"
    destination: "External API Client (Httpx)"
    description: "Internal payload passing"
  - source: "External API Client (Httpx)"
    destination: "External Notification Service"
    description: "Sends messages [HTTPS (REST/JSON) with TLS 1.3 and mTLS]"