level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Exchange Router"
    technology: "RabbitMQ"
    description: "Routes asynchronous loan and payment events published by the Circulation & Loan Service."
  - type: "component"
    name: "Persistence Store"
    technology: "Mnesia"
    description: "Provides durable persistence for message broker state."
  - type: "component"
    name: "Dead Letter & Retry Manager"
    technology: "RabbitMQ"
    description: "Manages failed messages, retries, and dead-letter queues."
  - type: "component"
    name: "Event Fanout Router"
    technology: "RabbitMQ"
    description: "Forwards item check-in/out inventory updates to the Search Indexer."
relationships:
  - source: "Exchange Router"
    destination: "Event Fanout Router"
    description: "Routes and fans out events"
  - source: "Event Fanout Router"
    destination: "Search Indexer"
    description: "Forwards item check-in/out inventory updates [AMQP over TLS 1.3]"