# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A cloud-hosted solution for public and academic libraries to catalogue physical and digital items, manage circulation, and provide self-service portals with strict EU data residency."
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public users who search for and borrow library items via self-service portals."
  - type: "person"
    name: "Library Staff and Cataloguers"
    description: "Personnel responsible for managing inventory, cataloguing items, and assisting patrons."
  - type: "person"
    name: "Library Administrators"
    description: "Personnel responsible for system administration and management."
  - type: "externalSystem"
    name: "Enterprise Identity Provider"
    description: "Auth0/Keycloak EU used to federate user identity and enforce Role-Based Access Control."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe EU used for processing payments securely."
  - type: "externalSystem"
    name: "Notification Service"
    description: "SendGrid/Twilio EU used for asynchronous notification delivery."
relationships:
  - source: "Library Patrons"
    destination: "Enterprise Identity Provider"
    description: "Authenticate against the Enterprise IdP"
    technology: "OIDC over HTTPS (TLS 1.3)"
  - source: "Library Staff and Cataloguers"
    destination: "Enterprise Identity Provider"
    description: "Authenticate against the Enterprise IdP"
    technology: "OIDC over HTTPS (TLS 1.3)"
  - source: "Library Patrons"
    destination: "Library Management System"
    description: "Interact with the LMS via self-service portal"
    technology: "HTTPS"
  - source: "Library Staff and Cataloguers"
    destination: "Library Management System"
    description: "Interact with the LMS for cataloguing and circulation"
    technology: "HTTPS"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Connects synchronously to process payments"
    technology: "HTTPS and mTLS"
  - source: "Library Management System"
    destination: "Notification Service"
    description: "Connects asynchronously to deliver notifications"
    technology: "Message Queues"