level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public users who search for and borrow library items via self-service portals."
  - type: "person"
    name: "Library Staff and Cataloguers"
    description: "Personnel responsible for managing inventory, cataloguing items, and assisting patrons."
  - type: "person"
    name: "Library Administrators"
    description: "Personnel responsible for system administration and management."
  - type: "externalSystem"
    name: "Enterprise Identity Provider"
    description: "Auth0/Keycloak EU used to federate user identity and enforce Role-Based Access Control."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe EU used for processing payments securely."
  - type: "externalSystem"
    name: "Notification Service"
    description: "SendGrid/Twilio EU used for asynchronous notification delivery."
  - type: "container"
    name: "Envoy Proxy"
    description: "API Gateway handling external ingress, rate limiting, and TLS termination."
    technology: "Envoy Proxy"
  - type: "container"
    name: "Web Application Container"
    description: "Frontend self-service portals."
    technology: "React with NGINX"
  - type: "container"
    name: "Catalogue Service"
    description: "Provides robust enterprise processing for item cataloguing."
    technology: "Spring Boot (Java)"
  - type: "container"
    name: "Circulation & Loan Service"
    description: "Manages circulation and loan operations."
    technology: "Node.js/Express"
  - type: "container"
    name: "Notification Service Worker"
    description: "Handles asynchronous notification processing."
    technology: "Python FastAPI"
  - type: "container"
    name: "Search Indexer"
    description: "Provides sub-800ms catalogue search performance."
    technology: "Elasticsearch"
  - type: "container"
    name: "Catalogue DB and Circulation DB"
    description: "Relational databases with AES-256 encrypted EU persistent volumes."
    technology: "PostgreSQL"
  - type: "container"
    name: "Message Broker"
    description: "Handles asynchronous messaging and circuit-breaking payment processing."
    technology: "RabbitMQ"
relationships:
  - source: "Library Patrons"
    destination: "Web Application Container"
    description: "Accesses self-service portals"
    technology: "HTTPS (REST/JSON)"
  - source: "Library Staff and Cataloguers"
    destination: "Web Application Container"
    description: "Accesses cataloguing and circulation interfaces"
    technology: "HTTPS (REST/JSON)"
  - source: "Library Administrators"
    destination: "Web Application Container"
    description: "Accesses management interfaces"
    technology: "HTTPS (REST/JSON)"
  - source: "Web Application Container"
    destination: "Envoy Proxy"
    description: "Forwards web requests"
    technology: "HTTPS (TLS 1.3)"
  - source: "Envoy Proxy"
    destination: "Catalogue Service"
    description: "Routes cataloguing requests"
    technology: "mTLS and gRPC/Protobuf"
  - source: "Envoy Proxy"
    destination: "Circulation & Loan Service"
    description: "Routes circulation requests"
    technology: "mTLS and gRPC/Protobuf"
  - source: "Catalogue Service"
    destination: "Search Indexer"
    description: "Indexes and searches catalogue data"
    technology: "gRPC/Protobuf"
  - source: "Catalogue Service"
    destination: "Catalogue DB and Circulation DB"
    description: "Reads and writes catalogue data"
    technology: "gRPC/Protobuf"
  - source: "Circulation & Loan Service"
    destination: "Catalogue DB and Circulation DB"
    description: "Reads and writes circulation data"
    technology: "gRPC/Protobuf"
  - source: "Circulation & Loan Service"
    destination: "Message Broker"
    description: "Publishes and consumes asynchronous messages"
    technology: "AMQP"
  - source: "Circulation & Loan Service"
    destination: "Payment Gateway"
    description: "Processes payments"
    technology: "HTTPS (REST/JSON)"
  - source: "Notification Service Worker"
    destination: "Notification Service"
    description: "Sends notifications"
    technology: "HTTPS (REST/JSON)"