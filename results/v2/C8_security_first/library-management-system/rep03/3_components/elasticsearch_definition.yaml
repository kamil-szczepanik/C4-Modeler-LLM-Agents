level: component
scope: "Component diagram for the Elasticsearch container"
parentContainer:
  name: "Elasticsearch"
elements:
  - type: "component"
    name: "Routing and Coordination Node"
    technology: "Java / Netty"
    description: "Handles client requests, query distribution, security filtering, and cluster-state management."
  - type: "component"
    name: "Data Nodes"
    technology: "Lucene Engine"
    description: "Store index shards, doc-values, and execute distributed matching across EU availability zones."
  - type: "component"
    name: "Inverted Index & Analyzer Pipeline"
    technology: "Elasticsearch Analyzer"
    description: "Implements custom tokenizers, stemmers, fuzzy matching, and domain-specific synonyms."
  - type: "component"
    name: "Search Microservice"
    technology: "Java / Spring Boot"
    description: "Acts as the sole intermediary between API gateways and Elasticsearch, issuing search/indexing queries over REST / JSON over TLS 1.3."
relationships:
  - source: "Search Microservice"
    destination: "Routing and Coordination Node"
    description: "Issues search/indexing queries over REST / JSON over TLS 1.3"
  - source: "Routing and Coordination Node"
    destination: "Data Nodes"
    description: "Distributes search/index operations over Transport Protocol over TLS 1.3 (mTLS)"