level: component
scope: "Component diagram for the Circulation & Catalogue Microservice container"
parentContainer:
  name: "Circulation & Catalogue Microservice"
elements:
  - type: "component"
    name: "REST Controllers"
    technology: "Spring MVC & Spring Security"
    description: "Handles REST endpoints and method-level @PreAuthorize RBAC."
  - type: "component"
    name: "Service Layer"
    technology: "Java / Spring Boot"
    description: "Implements business logic for inventory and checkout operations."
  - type: "component"
    name: "Persistence Layer"
    technology: "Spring Data JPA & HikariCP"
    description: "Manages database persistence, optimistic locking, and secure connection pooling."
  - type: "component"
    name: "Event Publisher"
    technology: "Spring Cloud Stream & Apache Kafka"
    description: "Publishes signed asynchronous events via AMQP / Kafka Protocol with HMAC payload signing."
  - type: "component"
    name: "Resilience Handler"
    technology: "Resilience4j"
    description: "Implements circuit breakers and rate limiters for fault tolerance."
  - type: "component"
    name: "Telemetry Manager"
    technology: "OpenTelemetry"
    description: "Provides distributed tracing with agent-level PII scrubbing."
relationships:
  - source: "REST Controllers"
    destination: "Service Layer"
    description: "Invokes business logic"
  - source: "Service Layer"
    destination: "Persistence Layer"
    description: "Persists data via JDBC over TLS 1.3"
  - source: "Service Layer"
    destination: "Event Publisher"
    description: "Publishes signed asynchronous events"
  - source: "Service Layer"
    destination: "Resilience Handler"
    description: "Applies circuit breakers and rate limiters"
  - source: "Service Layer"
    destination: "Telemetry Manager"
    description: "Sends telemetry with PII scrubbing"