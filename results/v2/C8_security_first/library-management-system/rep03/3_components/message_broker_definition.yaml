level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Ingestion Engine"
    technology: "TLS, mTLS, SASL/SCRAM"
    description: "Component handling TLS termination, mTLS authentication, and SASL/SCRAM authorization."
  - type: "component"
    name: "Event Log Manager"
    technology: "Apache Kafka"
    description: "Component managing append-only commit logs, 7-day retention, and consumer offsets."
  - type: "component"
    name: "Replication Controller"
    technology: "Kafka Replication"
    description: "Component synchronizing partition replicas across EU nodes."
  - type: "component"
    name: "Circulation & Catalogue Microservice"
    technology: "SASL_SSL / Kafka Protocol"
    description: "Producer of asynchronous circulation events."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Kafka Protocol"
    description: "Consumer of events for alerts and notifications."
relationships:
  - source: "Circulation & Catalogue Microservice"
    destination: "Ingestion Engine"
    description: "Publishes events using SASL_SSL [Kafka Protocol]"
  - source: "Ingestion Engine"
    destination: "Event Log Manager"
    description: "Appends verified payloads to topic partitions [Internal IPC]"
  - source: "Event Log Manager"
    destination: "Notification Dispatcher"
    description: "Streams unacknowledged events and routes failures to DLQ [Kafka Protocol]"