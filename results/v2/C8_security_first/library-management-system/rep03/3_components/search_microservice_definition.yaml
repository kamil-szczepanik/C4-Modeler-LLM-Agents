level: component
scope: "Component diagram for the Search Microservice container"
parentContainer:
  name: "Search Microservice"
elements:
  - type: "component"
    name: "Search Controller"
    technology: "Spring MVC"
    description: "Handles incoming search requests from patrons and librarians."
  - type: "component"
    name: "Search Query Builder & Sanitizer"
    technology: "Java / Spring"
    description: "Builds and sanitizes search queries to protect against injection and ensure safety."
  - type: "component"
    name: "Catalogue Sync Consumer"
    technology: "Spring AMQP"
    description: "Consumes messages for real-time catalogue synchronization."
  - type: "component"
    name: "Elasticsearch Client Adapter"
    technology: "Java / Spring"
    description: "Adapts calls to the Elasticsearch backend for search and indexing."
  - type: "component"
    name: "Elasticsearch (EU-hosted)"
    technology: "Elasticsearch"
    description: "Search engine backend ensuring fast full-text search capabilities under 800ms."
  - type: "component"
    name: "Message Broker"
    technology: "RabbitMQ / Kafka"
    description: "Message broker for event-driven catalogue synchronization."
relationships:
  - source: "Search Controller"
    destination: "Search Query Builder & Sanitizer"
    description: "In-memory Java Method Call"
  - source: "Search Query Builder & Sanitizer"
    destination: "Elasticsearch Client Adapter"
    description: "In-memory Java Method Call"
  - source: "Elasticsearch Client Adapter"
    destination: "Elasticsearch (EU-hosted)"
    description: "REST over TLS 1.3"
  - source: "Catalogue Sync Consumer"
    destination: "Message Broker"
    description: "AMQP over TLS 1.3"
  - source: "Catalogue Sync Consumer"
    destination: "Elasticsearch Client Adapter"
    description: "In-memory Java Method Call"