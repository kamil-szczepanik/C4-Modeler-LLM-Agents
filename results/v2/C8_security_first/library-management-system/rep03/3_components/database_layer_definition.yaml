  - type: "component"
    name: "PgBouncer Connection Pooler Sidecar"
    technology: "PgBouncer"
    description: "Manages and pools database connections to prevent connection exhaustion under peak patron load."
  - type: "component"
    name: "Partitioned Storage Engine"
    technology: "PostgreSQL Partitioned Storage"
    description: "Optimizes catalogue and circulation data storage."
relationships:
