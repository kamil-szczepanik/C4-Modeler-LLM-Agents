level: component
scope: "Component diagram for the Patron Self-Service Portal container"
parentContainer:
  name: "Patron Self-Service Portal"
elements:
  - type: "component"
    name: "Auth & Session Manager Component"
    technology: "TypeScript / OIDC Client"
    description: "Manages authentication and user sessions using OAuth 2.0 / OIDC and secure token storage."
  - type: "component"
    name: "Dashboard & Notification UI Component"
    technology: "React"
    description: "Provides the user dashboard and notification interface."
  - type: "component"
    name: "Catalogue & Search Client Component"
    technology: "React / Axios with Circuit Breaker"
    description: "Enables catalogue search capabilities for patrons with robust failure handling."
  - type: "component"
    name: "Checkout & Payment UI Component"
    technology: "React with Payment Gateway iFrame SDK"
    description: "Handles secure checkouts and payment processing isolating PCI-DSS scope."
relationships:
  - source: "Auth & Session Manager Component"
    destination: "External Academic Identity Providers & Payment Gateway"
    description: "Authenticates users via OAuth 2.0 / OIDC [HTTPS]"
  - source: "Catalogue & Search Client Component"
    destination: "API Gateway"
    description: "Sends REST / JSON requests over HTTPS [TLS 1.3]"
  - source: "Dashboard & Notification UI Component"
    destination: "API Gateway"
    description: "Sends GraphQL / REST requests over HTTPS [TLS 1.3]"
  - source: "Checkout & Payment UI Component"
    destination: "External Academic Identity Providers & Payment Gateway"
    description: "Processes payments via Tokenized iFrame SDK [HTTPS]"