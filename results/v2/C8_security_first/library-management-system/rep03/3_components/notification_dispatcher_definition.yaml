level: component
scope: "Component diagram for the Notification Dispatcher container"
parentContainer:
  name: "Notification Dispatcher"
elements:
  - type: "component"
    name: "Message Consumer Component"
    technology: "Node.js / TypeScript"
    description: "Consumes system events from the message broker for asynchronous processing."
  - type: "component"
    name: "Preference Router Component"
    technology: "Node.js / TypeScript"
    description: "Retrieves patron preferences and PII from the database layer."
  - type: "component"
    name: "Gateway Adapter Component"
    technology: "Node.js / TypeScript"
    description: "Dispatches outbound alerts to the EU Notification Gateway."
  - type: "component"
    name: "Retry & Fallback Manager"
    technology: "Node.js / TypeScript"
    description: "Manages retries, circuit breakers, and dead-letter queues to ensure reliability."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Node.js / TypeScript"
    description: "Publishes delivery status and failure events back to the message broker."
  - type: "component"
    name: "Message Broker"
    technology: "RabbitMQ / Kafka"
    description: "Message broker for asynchronous event consumption and status publishing."
  - type: "component"
    name: "Database Layer"
    technology: "PostgreSQL with EU-pinned JDBC"
    description: "Relational database with EU-pinned storage for patron preferences and masked PII logs."
  - type: "component"
    name: "EU Notification Gateway"
    technology: "External System"
    description: "External system responsible for final delivery of outbound alerts."
  - type: "component"
    name: "Patron Self-Service Portal"
    technology: "React / TypeScript SPA"
    description: "Portal for patrons to access notification history logs via downstream microservices."
relationships:
  - source: "Message Broker"
    destination: "Message Consumer Component"
    description: "Delivers system events [AMQP / Kafka Protocol with mTLS / SASL]"
  - source: "Preference Router Component"
    destination: "Database Layer"
    description: "Retrieves patron preferences and PII [PostgreSQL JDBC with TLS 1.3]"
  - source: "Gateway Adapter Component"
    destination: "EU Notification Gateway"
    description: "Dispatches outbound alerts [HTTPS / REST with TLS 1.3, Certificate Pinning, Egress Filtering]"
  - source: "Event Publisher Component"
    destination: "Message Broker"
    description: "Publishes delivery status and failure events [AMQP / Kafka Protocol]"
  - source: "Patron Self-Service Portal"
    destination: "Message Broker"
    description: "Accesses notification history logs via downstream microservices"