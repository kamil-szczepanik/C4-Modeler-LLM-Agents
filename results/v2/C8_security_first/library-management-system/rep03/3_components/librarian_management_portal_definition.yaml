level: component
scope: "Component diagram for the Librarian Management Portal container"
parentContainer:
  name: "Librarian Management Portal"
elements:
  - type: "component"
    name: "Authentication & Session Manager"
    technology: "React, TypeScript, Zustand, Axios, OIDC/MFA"
    description: "Manages user sessions, JWT injection via Axios interceptors, and OIDC/MFA federation via Academic Identity Providers."
  - type: "component"
    name: "Cataloguing & Inventory UI Module"
    technology: "React, TypeScript, React Router, Design System"
    description: "Provides interfaces for managing catalogue entries and inventory management."
  - type: "component"
    name: "Circulation Desk Module"
    technology: "React, TypeScript, REST/JSON over HTTPS"
    description: "Handles circulation workflows with offline queueing fallback capabilities."
  - type: "component"
    name: "Audit Logging Service"
    technology: "TypeScript, HTTPS"
    description: "Captures audit logs and security telemetry for compliance."
  - type: "component"
    name: "Accessibility Wrapper & Design System"
    technology: "React, TypeScript, CSS"
    description: "Ensures compliance with accessibility standards and applies the UI design system."
  - type: "component"
    name: "Batch Processing State Controller"
    technology: "TypeScript, Zustand, REST/JSON over HTTPS"
    description: "Controls state for chunked batch uploads to the API Gateway."
relationships:
  - source: "Authentication & Session Manager"
    destination: "API Gateway"
    description: "Sends authenticated HTTPS requests with JWT headers"
  - source: "Cataloguing & Inventory UI Module"
    destination: "API Gateway"
    description: "Sends cataloguing and inventory queries via HTTPS"
  - source: "Circulation Desk Module"
    destination: "API Gateway"
    description: "Executes circulation operations via REST/JSON over HTTPS with offline queueing fallback"
  - source: "Batch Processing State Controller"
    destination: "API Gateway"
    description: "Performs chunked uploads via REST/JSON over HTTPS"