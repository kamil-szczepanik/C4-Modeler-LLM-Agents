# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Patrons"
    description: "Students, Researchers, and the Public who use web and mobile clients to search and borrow physical and digital items."
  - type: "person"
    name: "Librarians"
    description: "Library staff who manage circulation and catalogue items via web and mobile clients."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators who configure and oversee the library management system."
  - type: "externalSystem"
    name: "Academic Identity Providers"
    description: "Shibboleth/SAML/OIDC providers used for user authentication and federation."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "PCI-DSS compliant payment gateway for handling financial transactions."
  - type: "externalSystem"
    name: "Digital Content Providers"
    description: "External providers supplying digital content items accessible through the system."
  - type: "externalSystem"
    name: "EU Notification Gateway"
    description: "Gateway handling asynchronous notifications and alerts."
  - type: "container"
    name: "Patron Self-Service Portal"
    technology: "React/TypeScript SPA"
    description: "Web application container providing patron self-service capabilities."
  - type: "container"
    name: "Librarian Management Portal"
    technology: "React/TypeScript SPA"
    description: "Web application container for librarian management tasks."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / Envoy"
    description: "Manages ingress routing, rate limiting, and security enforcement."
  - type: "container"
    name: "Search Microservice"
    technology: "Java / Spring Boot"
    description: "Microservice responsible for high-performance search capabilities."
  - type: "container"
    name: "Circulation & Catalogue Microservice"
    technology: "Java / Spring Boot"
    description: "Microservice managing item circulation and cataloguing."
  - type: "container"
    name: "Notification Dispatcher"
    technology: "Node.js / TypeScript"
    description: "Dispatches system notifications asynchronously."
  - type: "container"
    name: "Message Broker"
    technology: "RabbitMQ / Kafka"
    description: "Asynchronous decoupling and event distribution."
  - type: "container"
    name: "Database Layer"
    technology: "PostgreSQL with EU-pinned TLS 1.3/JDBC"
    description: "Relational persistence compliant with EU-only data residency."
  - type: "container"
    name: "Elasticsearch"
    technology: "Elasticsearch (EU-hosted)"
    description: "Provides sub-800ms search performance."
relationships:
  - source: "Patrons"
    destination: "Patron Self-Service Portal"
    description: "Uses"
    technology: "HTTPS (TLS 1.3)"
  - source: "Librarians"
    destination: "Librarian Management Portal"
    description: "Uses"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Administrators"
    destination: "API Gateway"
    description: "Manages system configuration"
    technology: "HTTPS (TLS 1.3)"
  - source: "Patron Self-Service Portal"
    destination: "API Gateway"
    description: "Communicates via HTTPS"
    technology: "HTTPS"
  - source: "Librarian Management Portal"
    destination: "API Gateway"
    description: "Communicates via HTTPS"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Search Microservice"
    description: "Routes ingress requests"
    technology: "OAuth 2.0 / OIDC and mTLS"
  - source: "API Gateway"
    destination: "Circulation & Catalogue Microservice"
    description: "Routes ingress requests"
    technology: "OAuth 2.0 / OIDC and mTLS"
  - source: "Search Microservice"
    destination: "Circulation & Catalogue Microservice"
    description: "Communicates between microservices"
    technology: "gRPC over mTLS"
  - source: "Circulation & Catalogue Microservice"
    destination: "Message Broker"
    description: "Publishes asynchronous events"
    technology: "AMQP / Kafka Protocol"
  - source: "Message Broker"
    destination: "Notification Dispatcher"
    description: "Delivers events"
    technology: "AMQP / Kafka Protocol"
  - source: "Notification Dispatcher"
    destination: "EU Notification Gateway"
    description: "Calls notification gateway"
    technology: "HTTPS/REST"
  - source: "Search Microservice"
    destination: "Elasticsearch"
    description: "Queries search index"
    technology: "REST over TLS 1.3"
  - source: "Circulation & Catalogue Microservice"
    destination: "Database Layer"
    description: "Persists and retrieves data"
    technology: "JDBC over TLS 1.3"
  - source: "Search Microservice"
    destination: "Database Layer"
    description: "Persists and retrieves data"
    technology: "JDBC over TLS 1.3"
  - source: "API Gateway"
    destination: "Academic Identity Providers"
    description: "Federates authentication"
    technology: "OIDC and SAML over HTTPS"
  - source: "API Gateway"
    destination: "Payment Gateway"
    description: "Processes payments"
    technology: "REST/JSON over HTTPS with mTLS and OAuth2"
  - source: "API Gateway"
    destination: "Digital Content Providers"
    description: "Retrieves digital content"
    technology: "REST/JSON over HTTPS with mTLS and OAuth2"