level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A cloud-hosted EU solution designed to catalogue physical and digital items, manage circulation, and provide self-service portals with strict EU-only data residency and sub-800ms search response times."
elements:
  - type: "person"
    name: "Patrons"
    description: "Students, Researchers, and the Public who use web and mobile clients to search and borrow physical and digital items."
  - type: "person"
    name: "Librarians"
    description: "Library staff who manage circulation and catalogue items via web and mobile clients."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators who configure and oversee the library management system."
  - type: "externalSystem"
    name: "Academic Identity Providers"
    description: "Shibboleth/SAML/OIDC providers used for user authentication and federation."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "PCI-DSS compliant payment gateway for handling financial transactions."
  - type: "externalSystem"
    name: "Digital Content Providers"
    description: "External providers supplying digital content items accessible through the system."
  - type: "externalSystem"
    name: "EU Notification Gateway"
    description: "Gateway handling asynchronous notifications and alerts."
relationships:
  - source: "Patrons"
    destination: "Library Management System"
    description: "Interacts via Web and Mobile clients to catalogue, search, and manage circulation."
    technology: "HTTPS (TLS 1.3)"
  - source: "Librarians"
    destination: "Library Management System"
    description: "Interacts via Web and Mobile clients to catalogue, search, and manage circulation."
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Administrators"
    destination: "Library Management System"
    description: "Manages system configuration and administrative tasks."
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Management System"
    destination: "Academic Identity Providers"
    description: "Federates user authentication."
    technology: "OIDC and SAML over HTTPS"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Processes secure payments."
    technology: "REST/JSON over HTTPS with mTLS and OAuth2"
  - source: "Library Management System"
    destination: "Digital Content Providers"
    description: "Retrieves and accesses digital content."
    technology: "REST/JSON over HTTPS with mTLS and OAuth2"
  - source: "Library Management System"
    destination: "EU Notification Gateway"
    description: "Sends asynchronous notifications."
    technology: "Asynchronous webhooks and REST APIs over HTTPS (TLS 1.3)"