level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Patrons & Library Staff"
    description: "End-users accessing self-service portals, circulation, and cataloguing tools."
  - type: "externalSystem"
    name: "EU-bound API Gateway"
    description: "Perimeter element enforcing rate-limiting, TLS termination, and payload sanitization."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system processing fines and fees."
  - type: "externalSystem"
    name: "Digital Content Providers"
    description: "External system supplying e-books and digital media licenses."
  - type: "externalSystem"
    name: "Inter-Library Loan Networks"
    description: "External system enabling resource sharing and partner catalogue exchange."
  - type: "container"
    name: "Patron Self-Service Portal (Web/Mobile App)"
    technology: "Web/Mobile"
    description: "Enables 24/7 self-service access for patrons."
  - type: "container"
    name: "Staff Management Console"
    technology: "Web"
    description: "Provides management and cataloguing tools for library staff."
  - type: "container"
    name: "Search & Catalogue Service"
    technology: "Java / Spring Boot, Elasticsearch"
    description: "Powers sub-800ms item search and catalogue management."
  - type: "container"
    name: "Circulation & Loan Engine"
    technology: "Python (FastAPI / Pandas)"
    description: "Manages circulation workflows and connects to external payment and loan systems."
  - type: "container"
    name: "Analytics & Reporting Service"
    technology: "Python (FastAPI / Pandas)"
    description: "Handles reporting and queries PostgreSQL read-replicas."
  - type: "container"
    name: "Notification Engine"
    technology: "Go"
    description: "Lightweight engine that consumes events asynchronously to send notifications."
  - type: "container"
    name: "Primary Database & Read-Replica"
    technology: "PostgreSQL"
    description: "Stores core transactional data with AES-256 encryption at rest."
  - type: "container"
    name: "Message Broker"
    technology: "RabbitMQ/Kafka"
    description: "Facilitates asynchronous event-driven communication across services."
relationships:
  - source: "Patrons & Library Staff"
    destination: "EU-bound API Gateway"
    description: "Interacts via portals routed through the EU-bound API Gateway"
    technology: "HTTPS/REST, OAuth2/OIDC with JWTs"
  - source: "EU-bound API Gateway"
    destination: "Patron Self-Service Portal (Web/Mobile App)"
    description: "Routes traffic to portals"
    technology: "REST/HTTPS"
  - source: "EU-bound API Gateway"
    destination: "Staff Management Console"
    description: "Routes traffic to consoles"
    technology: "REST/HTTPS"
  - source: "Patron Self-Service Portal (Web/Mobile App)"
    destination: "Search & Catalogue Service"
    description: "Communicates internally"
    technology: "gRPC, mTLS (TLS 1.3)"
  - source: "Staff Management Console"
    destination: "Search & Catalogue Service"
    description: "Communicates internally"
    technology: "gRPC, mTLS (TLS 1.3)"
  - source: "Patron Self-Service Portal (Web/Mobile App)"
    destination: "Circulation & Loan Engine"
    description: "Communicates internally"
    technology: "gRPC, mTLS (TLS 1.3)"
  - source: "Staff Management Console"
    destination: "Circulation & Loan Engine"
    description: "Communicates internally"
    technology: "gRPC, mTLS (TLS 1.3)"
  - source: "Circulation & Loan Engine"
    destination: "Payment Gateway"
    description: "Processes transactions for fines and fees"
    technology: "REST/JSON over TLS 1.3"
  - source: "Circulation & Loan Engine"
    destination: "Inter-Library Loan Networks"
    description: "Exchanges resource sharing requests"
    technology: "REST/JSON over TLS 1.3"
  - source: "Notification Engine"
    destination: "Message Broker"
    description: "Consumes events asynchronously"
    technology: "AMQP/Kafka"
  - source: "Analytics & Reporting Service"
    destination: "Primary Database & Read-Replica"
    description: "Queries read-replicas for reporting"
    technology: "SQL over TLS 1.3"