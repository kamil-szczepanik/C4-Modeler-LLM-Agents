level: component
scope: "Component diagram for the Notification Engine container"
parentContainer:
  name: "Notification Engine"
elements:
  - type: "component"
    name: "Event Consumer"
    technology: "Go (Sarama or amqp091-go)"
    description: "Consumes asynchronous events from the message broker for message ingestion."
  - type: "component"
    name: "Preference Router"
    technology: "Go Module"
    description: "Evaluates patron communication rules using a local cache."
  - type: "component"
    name: "Preference Cache"
    technology: "Go Ristretto"
    description: "In-memory store for patron preferences to prevent database bottlenecks."
  - type: "component"
    name: "Template Engine"
    technology: "Go html/template"
    description: "Generates localized, PII-safe messaging."
  - type: "component"
    name: "Dispatchers"
    technology: "Go Modules (sony/gobreaker)"
    description: "Handles external channel delivery using circuit breakers."
  - type: "component"
    name: "Audit & History Logger"
    technology: "Asynchronous Writer (Go)"
    description: "Asynchronously logs delivery states."
  - type: "component"
    name: "Message Broker"
    technology: "RabbitMQ / Kafka"
    description: "External message broker for decoupled event-driven architecture."
  - type: "component"
    name: "External Gateways"
    technology: "SMTP, Twilio/SMPP, Firebase/APNs"
    description: "External gateways for Email, SMS, and Push notifications."
  - type: "component"
    name: "Primary Database"
    technology: "SQL / TCP"
    description: "Database for persisting delivery audit logs."
relationships:
  - source: "Event Consumer"
    destination: "Message Broker"
    description: "Consumes asynchronous events [AMQP/Kafka]"
  - source: "Event Consumer"
    destination: "Preference Router"
    description: "Forwards event payloads [Go Channel]"
  - source: "Preference Router"
    destination: "Preference Cache"
    description: "Queries cached patron preferences [In-Memory]"
  - source: "Preference Router"
    destination: "Template Engine"
    description: "Requests compiled, localized messages [In-Memory]"
  - source: "Template Engine"
    destination: "Dispatchers"
    description: "Passes rendered payloads [Go Structs]"
  - source: "Dispatchers"
    destination: "External Gateways"
    description: "Delivers notifications [TLS 1.3 / HTTPS / SMTP]"
  - source: "Dispatchers"
    destination: "Audit & History Logger"
    description: "Reports delivery status [Go Channel]"
  - source: "Audit & History Logger"
    destination: "Primary Database"
    description: "Persists delivery audit logs [SQL/TCP]"