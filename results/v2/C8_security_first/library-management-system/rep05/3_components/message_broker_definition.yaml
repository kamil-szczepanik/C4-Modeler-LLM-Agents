level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Exchange & Routing Engine"
    technology: "RabbitMQ / Kafka Broker"
    description: "Routes incoming domain events to appropriate consumers and manages message distribution."
  - type: "component"
    name: "Persistent Storage & Log Manager"
    technology: "Cluster Disk Storage / Quorum Queues"
    description: "Ensures reliable, durable storage and logging for messages to guarantee at-least-once delivery."
  - type: "component"
    name: "Connection & ACL Manager"
    technology: "SASL/SCRAM-SHA-512 / mTLS"
    description: "Handles secure client connections, authentication, and access control lists."
  - type: "component"
    name: "DLQ & Retry Manager"
    technology: "Dead Letter Queue & Retry Logic"
    description: "Routes unacknowledged or poisoned messages for later inspection and retry handling."
  - type: "component"
    name: "Analytics Event Router"
    technology: "Event Streaming"
    description: "Streams anonymized domain events to the analytics and reporting service."
relationships:
  - source: "Circulation & Loan Engine"
    destination: "Exchange & Routing Engine"
    description: "Publishes domain events [AMQP/Kafka over TLS 1.3]"
  - source: "Exchange & Routing Engine"
    destination: "Notification Engine"
    description: "Consumes events asynchronously [AMQP/Kafka]"
  - source: "Exchange & Routing Engine"
    destination: "Analytics Event Router"
    description: "Streams anonymized domain events [AMQP/Kafka over TLS 1.3]"
  - source: "Notification Engine"
    destination: "DLQ & Retry Manager"
    description: "Routes unacknowledged or poisoned messages [AMQP/Kafka]"