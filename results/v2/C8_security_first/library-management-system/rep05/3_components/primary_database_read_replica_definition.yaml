# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Primary Database & Read-Replica container"
parentContainer:
  name: "Primary Database & Read-Replica"
elements:
  - type: "component"
    name: "PostgreSQL Primary"
    technology: "PostgreSQL, AES-256 encryption, Patroni, pgaudit"
    description: "Core transactional storage handling writes, executing loans, and maintaining GDPR-compliant audit logs."
  - type: "component"
    name: "PostgreSQL Read-Replica"
    technology: "PostgreSQL, Streaming Replication"
    description: "Read-only replica serving search, catalogue, and analytics queries to guarantee sub-800ms performance."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer connection pooling sidecar (Ports 6432/6433)"
    description: "Routes write traffic to the primary and read traffic to the read-replica with connection pooling."
relationships:
  - source: "PostgreSQL Primary"
    destination: "PostgreSQL Read-Replica"
    description: "Streams replication [Streaming Replication in asynchronous mode]"