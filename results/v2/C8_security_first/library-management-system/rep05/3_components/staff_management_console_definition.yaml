level: component
scope: "Component diagram for the Staff Management Console container"
parentContainer:
  name: "Staff Management Console"
elements:
  - type: "component"
    name: "Console Router / UI Shell"
    technology: "TypeScript / React, TanStack Query"
    description: "Single Page Application providing rapid dashboard rendering, role-based adaptability, and 15-minute inactivity timeout."
  - type: "component"
    name: "Auth & RBAC Client"
    technology: "TypeScript / React"
    description: "Manages OIDC/OAuth2 authentication, MFA, and role-based access control for Librarians and Administrators."
  - type: "component"
    name: "Catalogue & Inventory Controller"
    technology: "Node.js / TypeScript BFF"
    description: "BFF microservice handling item management and schema validation via Zod."
  - type: "component"
    name: "Circulation Desk Interface"
    technology: "Node.js / TypeScript BFF"
    description: "BFF microservice optimized for low-latency check-outs and graceful degradation."
  - type: "component"
    name: "EU-bound API Gateway"
    technology: "Kubernetes, Istio"
    description: "Routes traffic and validates short-lived JWTs, ensuring strict EU-only data residency."
  - type: "component"
    name: "Search & Catalogue Service"
    technology: "Backend core service, gRPC"
    description: "Backend core service for searching and cataloging items."
  - type: "component"
    name: "Circulation & Loan Engine"
    technology: "Backend core service, gRPC"
    description: "Backend core engine optimized for low-latency check-outs and loans."
relationships:
  - source: "EU-bound API Gateway"
    destination: "Console Router / UI Shell"
    description: "Routes traffic [REST/HTTPS]"
  - source: "Console Router / UI Shell"
    destination: "Auth & RBAC Client"
    description: "Verifies permissions [In-memory]"
  - source: "Console Router / UI Shell"
    destination: "Catalogue & Inventory Controller"
    description: "Communicates [HTTP/JSON over HTTPS]"
  - source: "Console Router / UI Shell"
    destination: "Circulation Desk Interface"
    description: "Communicates [HTTP/JSON over HTTPS]"
  - source: "Catalogue & Inventory Controller"
    destination: "Search & Catalogue Service"
    description: "Communicates internally [gRPC, mTLS (TLS 1.3)]"
  - source: "Circulation Desk Interface"
    destination: "Circulation & Loan Engine"
    description: "Communicates internally [gRPC, mTLS (TLS 1.3)]"