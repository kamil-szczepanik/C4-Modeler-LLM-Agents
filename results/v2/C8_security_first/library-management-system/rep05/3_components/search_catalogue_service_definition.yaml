level: component
scope: "Component diagram for the Search & Catalogue Service container"
parentContainer:
  name: "Search & Catalogue Service"
elements:
  - type: "component"
    name: "Search Controller"
    technology: "Spring Boot Controller"
    description: "Handles incoming search requests from client interfaces."
  - type: "component"
    name: "Search Query Engine"
    technology: "Java / Spring Boot"
    description: "Processes search queries and interacts with Elasticsearch using a circuit breaker."
  - type: "component"
    name: "Catalogue Synchronization Worker"
    technology: "Java / Spring Boot Worker"
    description: "Consumes asynchronous events from the message broker to synchronize the catalogue."
  - type: "component"
    name: "Catalogue Repository"
    technology: "Spring Data JDBC"
    description: "Manages data access and persistence operations against PostgreSQL."
relationships:
  - source: "Search Controller"
    destination: "Search Query Engine"
    description: "Delegates search requests"
  - source: "Search Query Engine"
    destination: "Catalogue Repository"
    description: "Fetches catalogue data"
  - source: "Catalogue Synchronization Worker"
    destination: "Catalogue Repository"
    description: "Updates catalogue records"