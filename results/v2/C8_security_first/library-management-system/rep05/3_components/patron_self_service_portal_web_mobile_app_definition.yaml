level: component
scope: "Component diagram for the Patron Self-Service Portal (Web/Mobile App) container"
parentContainer:
  name: "Patron Self-Service Portal (Web/Mobile App)"
elements:
  - type: "component"
    name: "SPA/Mobile Client Router & UI Layer"
    technology: "React / React Native"
    description: "Powers cross-platform web and mobile interfaces supporting WCAG 2.1 AA accessibility."
  - type: "component"
    name: "Authentication Client"
    technology: "OAuth 2.0/OIDC SDK with PKCE, biometric bridge"
    description: "Secures authentication and token handling in volatile memory."
  - type: "component"
    name: "API Client Gateway"
    technology: "TypeScript/Axios with gRPC-web mapping"
    description: "Manages type-safe communication and low-latency API transit."
  - type: "component"
    name: "Local Secure Storage & Sync Manager"
    technology: "Encrypted SQLite / IndexedDB"
    description: "Provides secure local caching for offline cryptographic library cards."
  - type: "component"
    name: "EU-bound API Gateway"
    technology: "Global CDN (EU-restricted)"
    description: "Enforces data residency and rapid static asset delivery."
  - type: "component"
    name: "CDN Edge Nodes"
    technology: "CDN"
    description: "Delivers rapid static assets."
  - type: "component"
    name: "Notification Engine"
    technology: "Notification Engine Service"
    description: "Handles notifications for patrons."
relationships:
  - source: "SPA/Mobile Client Router & UI Layer"
    destination: "Authentication Client"
    description: "Uses for OIDC flows [HTTPS]"
  - source: "SPA/Mobile Client Router & UI Layer"
    destination: "API Client Gateway"
    description: "Uses for data retrieval [gRPC, mTLS]"
  - source: "SPA/Mobile Client Router & UI Layer"
    destination: "Local Secure Storage & Sync Manager"
    description: "Uses for offline digital card rendering [Local Encryption]"
  - source: "API Client Gateway"
    destination: "EU-bound API Gateway"
    description: "Communicates with [gRPC-Web/HTTPS, mTLS (TLS 1.3)]"