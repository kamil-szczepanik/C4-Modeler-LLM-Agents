level: component
scope: "Component diagram for the Circulation & Loan Engine container"
parentContainer:
  name: "Circulation & Loan Engine"
elements:
  - type: "component"
    name: "Patron Self-Service Portal"
    technology: "Web/Mobile App"
    description: "Allows patrons to manage their loans and self-service workflows."
  - type: "component"
    name: "Staff Management Console"
    technology: "Web Application"
    description: "Allows staff to manage circulation workflows and overrides."
  - type: "component"
    name: "Loan Workflow Controller"
    technology: "Python / FastAPI"
    description: "Controls the main loan workflows and routing."
  - type: "component"
    name: "Loan Policy Evaluator"
    technology: "Python"
    description: "Evaluates dynamic circulation and loan policies."
  - type: "component"
    name: "Fine & Payment Processor"
    technology: "Python"
    description: "Processes financial fines and communicates with payment gateways."
  - type: "component"
    name: "ILL Coordinator"
    technology: "Python"
    description: "Coordinates inter-library loan networks."
  - type: "component"
    name: "Notification Trigger Component"
    technology: "Python"
    description: "Triggers notifications via the message broker."
  - type: "component"
    name: "Data Access Repository"
    technology: "SQLAlchemy ORM"
    description: "Handles data access and encrypted queries."
  - type: "component"
    name: "Primary PostgreSQL Database & Read-Replica"
    technology: "PostgreSQL with AES-256"
    description: "Provides relational persistence with encryption at rest."
  - type: "component"
    name: "Message Broker"
    technology: "RabbitMQ/Kafka"
    description: "Handles asynchronous messaging and audit event streaming."
  - type: "component"
    name: "Payment Gateway"
    technology: "External REST Service"
    description: "Processes secure payment transactions."
  - type: "component"
    name: "Inter-Library Loan Networks"
    technology: "External REST Service"
    description: "External networks for inter-library loans."
relationships:
  - source: "Patron Self-Service Portal"
    destination: "Loan Workflow Controller"
    description: "gRPC over mTLS (TLS 1.3)"
  - source: "Staff Management Console"
    destination: "Loan Workflow Controller"
    description: "gRPC over mTLS (TLS 1.3)"
  - source: "Fine & Payment Processor"
    destination: "Payment Gateway"
    description: "REST/JSON over TLS 1.3"
  - source: "ILL Coordinator"
    destination: "Inter-Library Loan Networks"
    description: "REST/JSON over TLS 1.3"
  - source: "Notification Trigger Component"
    destination: "Message Broker"
    description: "Async event publishing"
  - source: "Data Access Repository"
    destination: "Primary PostgreSQL Database & Read-Replica"
    description: "SQLAlchemy ORM with encrypted queries"