level: component
scope: "Component diagram for the Analytics & Reporting Service container"
parentContainer:
  name: "Analytics & Reporting Service"
elements:
  - type: "component"
    name: "API Router"
    technology: "Python / FastAPI"
    description: "Handles operational reporting, dashboards, and GDPR-compliant data export requests."
  - type: "component"
    name: "Aggregation & Processing Engine"
    technology: "Pandas"
    description: "In-memory data processing and aggregation for complex analytics."
  - type: "component"
    name: "Export Generator"
    technology: "Python / Celery"
    description: "Generates encrypted PDF/CSV reports."
  - type: "component"
    name: "Scheduler & Task Dispatcher"
    technology: "Celery / Redis"
    description: "Manages scheduled tasks and worker queues with distributed locking."
  - type: "component"
    name: "Notification & Delivery Dispatcher"
    technology: "Python"
    description: "Dispatches scheduled report alerts."
  - type: "component"
    name: "Data Access Repository"
    technology: "Python / SQL"
    description: "Executes queries against the PostgreSQL read-replica with read-only roles."
  - type: "component"
    name: "Staff Management Console"
    technology: "External System / Client"
    description: "Queries dashboards and requests reports."
  - type: "component"
    name: "PostgreSQL (Read-Replica)"
    technology: "PostgreSQL"
    description: "Relational database utilizing read-replicas to isolate analytics from transactions."
  - type: "component"
    name: "Redis"
    technology: "Redis"
    description: "Backing store for Celery worker queues and distributed locking (Redlock)."
  - type: "component"
    name: "Object Storage"
    technology: "Cloud Object Storage"
    description: "Stores encrypted PDF/CSV reports with EU region-locked residency mandates."
  - type: "component"
    name: "Notification Engine"
    technology: "External System"
    description: "Receives dispatched scheduled report alerts."
relationships:
  - source: "Staff Management Console"
    destination: "API Router"
    description: "Queries dashboards and requests reports [HTTPS / REST over TLS 1.3]"
  - source: "API Router"
    destination: "Data Access Repository"
    description: "Executes queries with read-only roles [SQL over mTLS / TLS 1.3]"
  - source: "Export Generator"
    destination: "Object Storage"
    description: "Uploads encrypted PDF/CSV reports [HTTPS / TLS 1.3]"
  - source: "Notification & Delivery Dispatcher"
    destination: "Notification Engine"
    description: "Dispatches scheduled report alerts [AMQP over TLS]"