level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Cloud-native platform providing self-service portals, circulation management, and cataloguing for public and academic libraries while ensuring strict EU data residency."
elements:
  - type: "person"
    name: "Patrons & Library Staff"
    description: "End-users accessing self-service portals, circulation, and cataloguing tools."
  - type: "externalSystem"
    name: "EU-bound API Gateway"
    description: "Perimeter element enforcing rate-limiting, TLS termination, and payload sanitization."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system processing fines and fees."
  - type: "externalSystem"
    name: "Digital Content Providers"
    description: "External system supplying e-books and digital media licenses."
  - type: "externalSystem"
    name: "Inter-Library Loan Networks"
    description: "External system enabling resource sharing and partner catalogue exchange."
relationships:
  - source: "Patrons & Library Staff"
    destination: "Library Management System"
    description: "Interacts via self-service portals, circulation, and cataloguing tools."
    technology: "HTTPS, TLS 1.3, OIDC/MFA"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Processes transactions for fines and fees."
    technology: "REST/JSON over TLS 1.3, mTLS, circuit breakers"
  - source: "Library Management System"
    destination: "Digital Content Providers"
    description: "Syncs inventory and digital media licenses."
    technology: "REST/JSON over TLS 1.3, async caching"
  - source: "Library Management System"
    destination: "Inter-Library Loan Networks"
    description: "Exchanges metadata and resource sharing requests."
    technology: "REST/JSON over TLS 1.3, mTLS, asynchronous webhooks"