level: component
scope: "Component diagram for the Patron BFF Container container"
parentContainer:
  name: "Patron BFF Container"
elements:
  - type: "component"
    name: "GraphQL/REST API Layer"
    technology: "NestJS / TypeScript"
    description: "Exposes optimized endpoints for UI clients to aggregate data in a single round-trip, supporting the <800 ms search performance requirement."
  - type: "component"
    name: "JWT/ABAC Middleware"
    technology: "NestJS Guards and Interceptors"
    description: "Handles token validation, attribute-based access control, and request authentication."
  - type: "component"
    name: "Catalogue Client"
    technology: "gRPC over mTLS"
    description: "Queries the Catalogue & Search Service container for search discovery and catalogue data."
  - type: "component"
    name: "Circulation Client"
    technology: "gRPC over mTLS"
    description: "Fetches active loans and holds from the Circulation & Loan Service container."
  - type: "component"
    name: "Notification Client"
    technology: "gRPC over mTLS"
    description: "Triggers asynchronous patron notices via the Notification Dispatcher container."
  - type: "component"
    name: "Session Manager"
    technology: "RESP over TLS, Redis"
    description: "Manages distributed patron session caching in the EU-hosted Redis instance."
relationships:
  - source: "GraphQL/REST API Layer"
    destination: "JWT/ABAC Middleware"
    description: "Validates requests using"
  - source: "JWT/ABAC Middleware"
    destination: "Session Manager"
    description: "Caches and validates session state in"
  - source: "GraphQL/REST API Layer"
    destination: "Catalogue Client"
    description: "Queries catalogue data via"
  - source: "GraphQL/REST API Layer"
    destination: "Circulation Client"
    description: "Fetches active loans via"
  - source: "GraphQL/REST API Layer"
    destination: "Notification Client"
    description: "Triggers notices via"