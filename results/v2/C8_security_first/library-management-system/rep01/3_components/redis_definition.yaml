level: component
scope: "Component diagram for the Redis container"
parentContainer:
  name: "Redis"
elements:
  - type: "component"
    name: "Session Cache Component"
    technology: "Redis 7.x, RESP3, TLS 1.3"
    description: "Manages active session states securely for the Circulation & Loan Service."
  - type: "component"
    name: "Search Cache Component"
    technology: "Redis 7.x, RESP3, TLS 1.3"
    description: "Optimizes catalogue search performance for the Catalogue & Search Service."
  - type: "component"
    name: "Redis Sentinel"
    technology: "Redis Sentinel"
    description: "Provides high availability and failover for the Redis tier."
  - type: "component"
    name: "redis_exporter"
    technology: "Prometheus & redis_exporter"
    description: "Exports Redis Prometheus metrics to the monitoring infrastructure."
relationships:
  - source: "Circulation & Loan Service Container"
    destination: "Session Cache Component"
    description: "Manages active session states via RESP3 over TLS 1.3"
  - source: "Catalogue & Search Service Container"
    destination: "Search Cache Component"
    description: "Optimizes catalogue searches via RESP3 over TLS 1.3"
  - source: "Redis Sentinel"
    destination: "Session Cache Component"
    description: "Monitors and manages failover"
  - source: "Redis Sentinel"
    destination: "Search Cache Component"
    description: "Monitors and manages failover"
  - source: "redis_exporter"
    destination: "Session Cache Component"
    description: "Scrapes cache metrics"
  - source: "redis_exporter"
    destination: "Search Cache Component"
    description: "Scrapes cache metrics"