level: component
scope: "Component diagram for the Staff Workflow Container container"
parentContainer:
  name: "Staff Workflow Container"
elements:
  - type: "component"
    name: "Workflow Orchestrator Component"
    technology: "Spring MVC / REST Controllers"
    description: "Manages administrative operations and routes staff traffic."
  - type: "component"
    name: "Audit Logging Interceptor Component"
    technology: "Spring AOP"
    description: "Implements immutable audit logging for staff operations."
  - type: "component"
    name: "Catalogue Integration Client"
    technology: "gRPC Stub"
    description: "Queries and updates the catalogue."
  - type: "component"
    name: "Batch Job Manager Component"
    technology: "Spring Batch"
    description: "Executes asynchronous bulk item processing and batch mutations."
relationships:
  - source: "Workflow Orchestrator Component"
    destination: "External Identity Provider (IdP)"
    description: "Validates OAuth2/OIDC JWTs [HTTPS]"
  - source: "Workflow Orchestrator Component"
    destination: "Batch Job Manager Component"
    description: "Submits asynchronous jobs [In-Process]"
  - source: "Catalogue Integration Client"
    destination: "Catalogue & Search Service Container"
    description: "Queries and updates catalogue [gRPC over mTLS]"
  - source: "Batch Job Manager Component"
    destination: "Circulation & Loan Service Container"
    description: "Executes batch mutations [gRPC over mTLS]"