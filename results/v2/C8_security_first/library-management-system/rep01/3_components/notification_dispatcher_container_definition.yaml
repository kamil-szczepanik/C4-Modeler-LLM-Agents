level: component
scope: "Component diagram for the Notification Dispatcher Container container"
parentContainer:
  name: "Notification Dispatcher Container"
elements:
  - type: "component"
    name: "API Handler Component"
    technology: "Go"
    description: "Handles incoming API requests and enqueues workflows into the Temporal workflow engine."
  - type: "component"
    name: "Notification Workflow Engine"
    technology: "Temporal SDK"
    description: "Manages durable state, retry policies, and orchestration of multi-channel notification workflows."
  - type: "component"
    name: "Routing & Preference Resolver Component"
    technology: "Go"
    description: "Fetches patron channel preferences and passes localized context to the template engine."
  - type: "component"
    name: "Template Engine Component"
    technology: "Go"
    description: "Renders notification payloads using localized context in-memory."
  - type: "component"
    name: "External Connector Component"
    technology: "Go"
    description: "Dispatches messages securely to external notification services using HTTPS/REST, mTLS, and OAuth2."
  - type: "component"
    name: "External Notification Service"
    technology: "External Service"
    description: "External system responsible for delivering alerts to patrons and staff."
relationships:
  - source: "API Handler Component"
    destination: "Notification Workflow Engine"
    description: "Enqueues workflow [Temporal SDK / internal RPC]"
  - source: "Notification Workflow Engine"
    destination: "Routing & Preference Resolver Component"
    description: "Fetches channel preferences [Internal gRPC]"
  - source: "Routing & Preference Resolver Component"
    destination: "Template Engine Component"
    description: "Passes localized context [In-memory]"
  - source: "Notification Workflow Engine"
    destination: "Template Engine Component"
    description: "Renders payload [In-memory]"
  - source: "Notification Workflow Engine"
    destination: "External Connector Component"
    description: "Dispatches message [Internal channel]"
  - source: "External Connector Component"
    destination: "External Notification Service"
    description: "Sends alerts [HTTPS / REST, mTLS, OAuth2]"