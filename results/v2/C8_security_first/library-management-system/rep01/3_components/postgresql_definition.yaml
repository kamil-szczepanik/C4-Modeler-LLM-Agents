level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "PostgreSQL 16 Primary & Standby"
    technology: "PostgreSQL 16"
    description: "Relational storage engine managing ACID-compliant circulation, loans, and structured catalogue metadata."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Connection pooler managing client connections from Spring Boot microservices."
  - type: "component"
    name: "Patroni / etcd"
    technology: "Patroni / etcd"
    description: "Replication manager providing automated leader election and streaming replication."
  - type: "component"
    name: "CloudNativePG Operator"
    technology: "CloudNativePG"
    description: "Kubernetes-based deployment manager for PostgreSQL."
  - type: "component"
    name: "pgaudit Extension"
    technology: "pgaudit"
    description: "Module generating structured audit logs for patron PII access."
relationships:
  - source: "Circulation & Loan Service Container"
    destination: "PgBouncer"
    description: "Transactional queries and updates via [JDBC / TLS 1.3]."
  - source: "PgBouncer"
    destination: "PostgreSQL 16 Primary & Standby"
    description: "Backend database connections via [TLS 1.3]."
  - source: "PostgreSQL 16 Primary & Standby"
    destination: "PostgreSQL 16 Primary & Standby"
    description: "Asynchronous/Synchronous streaming replication via [TCP]."
  - source: "PostgreSQL 16 Primary & Standby"
    destination: "Centralized SIEM"
    description: "Out-of-band audit log streaming via [Syslog / TLS]."