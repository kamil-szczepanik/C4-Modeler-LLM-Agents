level: component
scope: "Component diagram for the Circulation & Loan Service Container container"
parentContainer:
  name: "Circulation & Loan Service Container"
elements:
  - type: "component"
    name: "Loan Management Controller"
    technology: "Spring MVC"
    description: "Manages library circulation, loans, and related transactions, exposing REST APIs."
  - type: "component"
    name: "Circulation Policy Engine"
    technology: "Java / Spring Bean"
    description: "Enforces circulation policies and business rules."
  - type: "component"
    name: "Transaction & Persistence Service"
    technology: "Spring Data JPA, PostgreSQL, HikariCP"
    description: "Handles relational data management for loan states and ACID transactions with connection pooling."
  - type: "component"
    name: "Event Publisher"
    technology: "Spring Cloud Stream"
    description: "Publishes asynchronous events for circulation and loan transactions."
  - type: "component"
    name: "Event Consumer"
    technology: "Spring Cloud Stream"
    description: "Consumes asynchronous events related to circulation and loans."
  - type: "component"
    name: "Fallback Handler / Offline Cache Component"
    technology: "Resilience4j"
    description: "Provides circuit breaking and fallback handling to isolate downstream notification dependencies during peak loads."
relationships:
  - source: "API Gateway"
    destination: "Loan Management Controller"
    description: "Routes checkout requests [mTLS, OAuth2/JWT]"
  - source: "Loan Management Controller"
    destination: "Circulation Policy Engine"
    description: "Evaluates loan policies [In-process]"
  - source: "Circulation Policy Engine"
    destination: "Transaction & Persistence Service"
    description: "Persists loan states [In-process]"
  - source: "Transaction & Persistence Service"
    destination: "PostgreSQL"
    description: "Executes database queries [JDBC with TLS 1.3]"
  - source: "Transaction & Persistence Service"
    destination: "Event Publisher"
    description: "Triggers domain events [In-process]"
  - source: "Event Publisher"
    destination: "Notification Dispatcher Container"
    description: "Publishes messages [TLS-secured message broker, SASL/SCRAM]"
  - source: "Loan Management Controller"
    destination: "Fallback Handler / Offline Cache Component"
    description: "Applies circuit breaking [In-process]"