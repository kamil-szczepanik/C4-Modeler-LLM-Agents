level: component
scope: "Component diagram for the API Gateway / Ingress container"
parentContainer:
  name: "API Gateway / Ingress"
elements:
  - type: "component"
    name: "Envoy Proxy Route Manager"
    technology: "Envoy Proxy / Kubernetes Ingress Controller"
    description: "Handles traffic routing, TLS termination, and mTLS enforcement for incoming requests."
  - type: "component"
    name: "Security and Authentication Engine"
    technology: "Envoy WAF and JWT Validation"
    description: "Validates JSON Web Tokens, applies Web Application Firewall rules, and enforces EU data residency constraints."
  - type: "component"
    name: "Rate Limiting and Policy Module"
    technology: "Lua / WASM Rate-Limiting"
    description: "Enforces tiered rate-limiting and prioritization policies for patrons and staff."
relationships:
  - source: "Envoy Proxy Route Manager"
    destination: "Security and Authentication Engine"
    description: "Passes incoming requests for JWT validation and WAF inspection"
  - source: "Security and Authentication Engine"
    destination: "Rate Limiting and Policy Module"
    description: "Evaluates rate limits and priority rules"