level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A cloud-native software solution providing catalogue management, circulation services, and self-service portals for public and academic libraries with EU-only data residency and sub-800ms search latency."
elements:
  - type: "person"
    name: "Library Patrons"
    description: "End users who access self-service portals for library services."
  - type: "person"
    name: "Library Staff/Cataloguers"
    description: "Staff members who manage catalogue and circulation services."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators who manage the Library Management System configuration and users."
  - type: "externalSystem"
    name: "External Identity Provider (IdP)"
    description: "External system used for federated authentication via OIDC/OAuth 2.0."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "External system handling payment processing via REST APIs."
  - type: "externalSystem"
    name: "External Notification Service"
    description: "External system handling notifications via REST APIs."
  - type: "container"
    name: "API Gateway"
    description: "Entry point for client traffic with circuit breakers and fallback caching."
    technology: "HTTPS / TLS 1.3"
  - type: "container"
    name: "Self-Service Portals"
    description: "Web and Mobile applications used by patrons and staff."
    technology: "Web/Mobile Apps"
  - type: "container"
    name: "Transactional Core"
    description: "Core backend processing transactional workloads."
    technology: "Cloud-native services"
  - type: "container"
    name: "Asynchronous Event Bus"
    description: "Message broker for decoupling analytics from transactional workloads."
    technology: "Message Broker"
  - type: "container"
    name: "Reporting/Analytics Engine"
    description: "Engine for generating reports and analytics."
    technology: "Analytics Engine"
relationships:
  - source: "Library Patrons"
    destination: "Library Management System"
    description: "Uses via Web/Mobile Apps"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Staff/Cataloguers"
    destination: "Library Management System"
    description: "Uses via Web/Mobile Apps"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Administrators"
    destination: "Library Management System"
    description: "Uses via Web/Mobile Apps"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Management System"
    destination: "External Identity Provider (IdP)"
    description: "Redirects for authentication"
    technology: "OIDC / OAuth 2.0"
  - source: "Library Management System"
    destination: "External Payment Gateway"
    description: "Integrates for payment processing"
    technology: "Outbound HTTPS/REST APIs with mTLS"
  - source: "Library Management System"
    destination: "External Notification Service"
    description: "Integrates for sending notifications"
    technology: "Outbound HTTPS/REST APIs with mTLS"