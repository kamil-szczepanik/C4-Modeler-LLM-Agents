level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "End users who access self-service portals for library services."
  - type: "person"
    name: "Library Staff/Cataloguers"
    description: "Staff members who manage catalogue and circulation services."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators who manage the Library Management System configuration and users."
  - type: "externalSystem"
    name: "External Identity Provider (IdP)"
    description: "External system used for federated authentication."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "External system handling payment processing."
  - type: "externalSystem"
    name: "External Notification Service"
    description: "External system handling notifications."
  - type: "container"
    name: "API Gateway / Ingress"
    technology: "Traefik or Envoy"
    description: "Entry point for client traffic providing routing and TLS termination."
  - type: "container"
    name: "Patron BFF Container"
    technology: "Node.js/Express or NestJS"
    description: "Backend-for-Frontend service for library patrons."
  - type: "container"
    name: "Staff Workflow Container"
    technology: "Spring Boot or Python/Django"
    description: "Handles library staff workflows and management operations."
  - type: "container"
    name: "Catalogue & Search Service Container"
    technology: "Java / Elasticsearch"
    description: "Manages item cataloguing and provides sub-800ms search queries."
  - type: "container"
    name: "Circulation & Loan Service Container"
    technology: "Spring Boot"
    description: "Manages circulation, loans, and related transactions."
  - type: "container"
    name: "Notification Dispatcher Container"
    technology: "Go / Temporal"
    description: "Dispatches notifications through external services."
  - type: "container"
    name: "PostgreSQL"
    technology: "PostgreSQL"
    description: "Relational database tier for persistent data storage."
  - type: "container"
    name: "Redis"
    technology: "Redis"
    description: "Cache tier for search caching and performance optimization."
relationships:
  - source: "Library Patrons"
    destination: "API Gateway / Ingress"
    description: "Accesses via REST/JSON with JWT validation"
    technology: "REST / JSON over HTTPS"
  - source: "Library Staff/Cataloguers"
    destination: "API Gateway / Ingress"
    description: "Accesses staff workflows"
    technology: "REST / JSON over HTTPS"
  - source: "Library Administrators"
    destination: "API Gateway / Ingress"
    description: "Accesses system administration"
    technology: "REST / JSON over HTTPS"
  - source: "API Gateway / Ingress"
    destination: "Patron BFF Container"
    description: "Routes patron traffic"
    technology: "HTTP"
  - source: "API Gateway / Ingress"
    destination: "Staff Workflow Container"
    description: "Routes staff traffic"
    technology: "HTTP"
  - source: "Patron BFF Container"
    destination: "Catalogue & Search Service Container"
    description: "Queries catalogue and search"
    technology: "gRPC over mTLS"
  - source: "Staff Workflow Container"
    destination: "Catalogue & Search Service Container"
    description: "Queries catalogue and search"
    technology: "gRPC over mTLS"
  - source: "Circulation & Loan Service Container"
    destination: "PostgreSQL"
    description: "Queries relational data"
    technology: "JDBC"
  - source: "Notification Dispatcher Container"
    destination: "External Notification Service"
    description: "Integrates to send notifications"
    technology: "HTTPS / REST"