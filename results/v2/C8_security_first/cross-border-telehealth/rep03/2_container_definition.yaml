level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU & US)"
    description: "End users seeking secure video consultations and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals providing consultations and e-prescriptions."
  - type: "externalSystem"
    name: "National E-Prescription Networks (EU)"
    description: "EU national systems for processing digital prescriptions."
  - type: "externalSystem"
    name: "US Pharmacy Systems"
    description: "US external pharmacy systems for medication fulfillment."
  - type: "externalSystem"
    name: "Immutable Storage"
    description: "GCP Cloud Storage WORM storing cryptographically signed AI audit logs."
  - type: "container"
    name: "Web/Mobile Client Application"
    technology: "Flutter / React"
    description: "Cross-platform client supporting degraded-mode video and low-bandwidth adaptation."
  - type: "container"
    name: "Cloud Load Balancing & Envoy API Gateway"
    technology: "Envoy & GCP Cloud Load Balancing"
    description: "Edge routing, zero-trust network architecture (ZTNA), and low-bandwidth optimization."
  - type: "container"
    name: "Core Telehealth & Consent Container"
    technology: "Go"
    description: "Manages core telehealth workflows, consent, and orchestration within regional GKE clusters."
  - type: "container"
    name: "AI Symptom Checker Container"
    technology: "Python / FastAPI"
    description: "Executes AI symptom checker inference, logging, and audit metrics."
  - type: "container"
    name: "Prescription Integration Container"
    technology: "Go"
    description: "Handles integration with external pharmacy systems and national networks via HL7 FHIR / EU standards."
relationships:
  - source: "Patients (EU & US)"
    destination: "Web/Mobile Client Application"
    description: "Interacts with platform for video consultations and AI symptom checking"
    technology: "HTTPS / WebRTC"
  - source: "Licensed Clinicians"
    destination: "Web/Mobile Client Application"
    description: "Conducts consultations and manages e-prescriptions"
    technology: "HTTPS / WebRTC"
  - source: "Web/Mobile Client Application"
    destination: "Cloud Load Balancing & Envoy API Gateway"
    description: "Sends requests to backend services with low-bandwidth adaptation"
    technology: "HTTPS / gRPC (<300 kbit/s)"
  - source: "Cloud Load Balancing & Envoy API Gateway"
    destination: "Core Telehealth & Consent Container"
    description: "Routes API requests to core telehealth logic"
    technology: "gRPC"
  - source: "Core Telehealth & Consent Container"
    destination: "AI Symptom Checker Container"
    description: "Forwards symptom check requests for inference"
    technology: "gRPC"
  - source: "AI Symptom Checker Container"
    destination: "Immutable Storage"
    description: "Writes cryptographically signed AI audit logs with local write-ahead buffering"
    technology: "HTTPS"
  - source: "Prescription Integration Container"
    destination: "National E-Prescription Networks (EU)"
    description: "Transmits e-prescriptions for EU patients"
    technology: "mTLS and HTTPS (HL7 FHIR / EU standards)"
  - source: "Prescription Integration Container"
    destination: "US Pharmacy Systems"
    description: "Transmits pharmacy requests for US patients"
    technology: "mTLS and HTTPS (HL7 FHIR)"