level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides secure video consultations, e-prescriptions, and an AI symptom checker for patients across the EU and US while guaranteeing strict regional data residency and compliance with GDPR, HIPAA, and EU MDR."
elements:
  - type: "person"
    name: "Patients (EU & US)"
    description: "End users seeking secure video consultations and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals providing consultations and e-prescriptions."
  - type: "externalSystem"
    name: "National E-Prescription Networks (EU)"
    description: "EU national systems for processing digital prescriptions."
  - type: "externalSystem"
    name: "US Pharmacy Systems"
    description: "US external pharmacy systems for medication fulfillment."
  - type: "externalSystem"
    name: "WebRTC SFU Media Relay"
    description: "Selective Forwarding Unit handling real-time video and audio consultations with bandwidth adaptation."
  - type: "externalSystem"
    name: "Break-Glass Identity Provider (IdP)"
    description: "Handles secure clinician and patient access, MFA, and emergency authorization."
  - type: "externalSystem"
    name: "Immutable Storage"
    description: "GCP Bucket Lock storing cryptographically signed AI audit logs."
relationships:
  - source: "Patients (EU & US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses telehealth services, video consultations, and AI symptom checker"
    technology: "HTTPS / WebRTC (TLS 1.3)"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Conducts consultations and manages e-prescriptions"
    technology: "HTTPS / WebRTC (TLS 1.3)"
  - source: "Cross-Border Telehealth Platform"
    destination: "National E-Prescription Networks (EU)"
    description: "Transmits e-prescriptions for EU patients"
    technology: "mTLS over REST/SOAP"
  - source: "Cross-Border Telehealth Platform"
    destination: "US Pharmacy Systems"
    description: "Transmits pharmacy requests and patient data for US patients"
    technology: "HL7 FHIR over HTTPS (OAuth 2.0)"
  - source: "Cross-Border Telehealth Platform"
    destination: "Immutable Storage"
    description: "Writes cryptographically signed AI audit logs"
    technology: "GCP Bucket Lock"