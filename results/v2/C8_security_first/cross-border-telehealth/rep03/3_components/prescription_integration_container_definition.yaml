level: component
scope: "Component diagram for the Prescription Integration Container container"
parentContainer:
  name: "Prescription Integration Container"
elements:
  - type: "component"
    name: "Prescription Router"
    technology: "Go"
    description: "Routes prescription requests to the correct regional destination (EU National E-Prescription Networks or US Pharmacy Systems)."
  - type: "component"
    name: "FHIR Transformer"
    technology: "Go"
    description: "Translates internal prescription payloads into HL7 FHIR standards for EU and US interoperability."
  - type: "component"
    name: "mTLS Transport Client"
    technology: "Go / mTLS / HTTPS"
    description: "Secures external network transport to external national networks and pharmacies using mutual TLS and HTTPS."
  - type: "component"
    name: "Idempotency Manager"
    technology: "Go / GCP Memorystore (Redis)"
    description: "Tracks idempotency keys via the Redis protocol to prevent duplicate prescription dispatches."
  - type: "component"
    name: "Async Queue Publisher"
    technology: "Go / GCP Pub/Sub"
    description: "Manages asynchronous message queuing for retry handling during unstable network conditions."
relationships:
  - source: "Prescription Router"
    destination: "FHIR Transformer"
    description: "Transforms payload formats"
  - source: "FHIR Transformer"
    destination: "mTLS Transport Client"
    description: "Sends secured requests"
  - source: "Prescription Router"
    destination: "Idempotency Manager"
    description: "Checks and records idempotency keys"
  - source: "Prescription Router"
    destination: "Async Queue Publisher"
    description: "Offloads failed requests for retry"