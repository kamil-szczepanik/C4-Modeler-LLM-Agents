level: component
scope: "Component diagram for the Core Telehealth & Consent Container container"
parentContainer:
  name: "Core Telehealth & Consent Container"
elements:
  - type: "component"
    name: "Consent Management Component"
    technology: "Go"
    description: "Manages patient consent and regulatory compliance requirements."
  - type: "component"
    name: "Consultation Workflow Orchestrator"
    technology: "Go"
    description: "Orchestrates the telehealth consultation workflows."
  - type: "component"
    name: "Regional Data Router"
    technology: "Go"
    description: "Routes data to appropriate regional data stores ensuring compliance."
  - type: "component"
    name: "Consent Event Bus"
    technology: "Go / NATS"
    description: "Publishes and distributes consent-related events internally."
relationships:
  - source: "Consent Management Component"
    destination: "Consent Event Bus"
    description: "Publishes events to"
  - source: "Consent Event Bus"
    destination: "Consultation Workflow Orchestrator"
    description: "Triggers workflows via"
  - source: "Regional Data Router"
    destination: "Regional Cloud SQL"
    description: "SQL / TLS with regional CMEK"