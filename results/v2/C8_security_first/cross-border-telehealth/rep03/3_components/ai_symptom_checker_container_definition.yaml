level: component
scope: "Component diagram for the AI Symptom Checker Container container"
parentContainer:
  name: "AI Symptom Checker Container"
elements:
  - type: "component"
    name: "API Router Component"
    technology: "FastAPI, Python"
    description: "High-performance asynchronous API routing, payload validation, and gRPC ingestion."
  - type: "component"
    name: "Inference Engine Component"
    technology: "PyTorch / ONNX Runtime"
    description: "Localized symptom analysis model execution providing automated urgency recommendations."
  - type: "component"
    name: "Audit & Traceability Component"
    technology: "Python, In-process queue"
    description: "Dispatches and manages audit payloads to ensure regulatory compliance under EU MDR and HIPAA."
  - type: "component"
    name: "Fallback Cache Component"
    technology: "Redis / Local LRU"
    description: "Queries cached profiles for high availability and low-latency responses."
  - type: "component"
    name: "Immutable Storage"
    technology: "Regional GCP Cloud Storage, GCP Cloud KMS"
    description: "Stores cryptographically signed audit logs with region-locked encryption for data residency compliance."
relationships:
  - source: "API Router Component"
    destination: "Inference Engine Component"
    description: "In-process [Python function call] via gRPC ingestion"
  - source: "API Router Component"
    destination: "Fallback Cache Component"
    description: "Queries cached profiles [In-process LRU / Redis client]"
  - source: "Inference Engine Component"
    destination: "Audit & Traceability Component"
    description: "Dispatches audit payload [In-process queue]"
  - source: "Audit & Traceability Component"
    destination: "Immutable Storage"
    description: "Writes cryptographically signed audit logs [HTTPS, regional GCP Cloud Storage]"