level: component
scope: "Component diagram for the Cloud Load Balancing & Envoy API Gateway container"
parentContainer:
  name: "Cloud Load Balancing & Envoy API Gateway"
elements:
  - type: "component"
    name: "GCP External HTTP(S) Load Balancer"
    technology: "GCP Cloud Load Balancing"
    description: "Sends client requests with low-bandwidth adaptation and routes ingress traffic."
  - type: "component"
    name: "GCP Cloud Armor Security Policy"
    technology: "GCP Cloud Armor"
    description: "Evaluates security rules and provides DDoS mitigation for regional separation."
  - type: "component"
    name: "Envoy Edge Proxy"
    technology: "Envoy Proxy (WASM/Lua filters)"
    description: "Handles traffic shaping, W3C trace injection, localization, Ext-Authz, and TLS 1.3 termination."
relationships:
  - source: "GCP External HTTP(S) Load Balancer"
    destination: "GCP Cloud Armor Security Policy"
    description: "Evaluates security rules [HTTPS]"
  - source: "GCP Cloud Armor Security Policy"
    destination: "Envoy Edge Proxy"
    description: "Forwards filtered traffic [HTTPS]"