level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides secure video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and the US while ensuring strict regional data residency and regulatory compliance."
elements:
  - type: "person"
    name: "Patients and Clinicians"
    description: "EU and US users interacting with the platform for consultations and healthcare services."
  - type: "person"
    name: "Compliance Officer"
    description: "Auditor managing regional consent and AI traceability logs."
  - type: "externalSystem"
    name: "National E-Prescription Gateways (EU)"
    description: "External EU gateway systems for handling electronic prescriptions."
  - type: "externalSystem"
    name: "US Pharmacy Networks"
    description: "External US pharmacy networks for prescription fulfillment."
  - type: "externalSystem"
    name: "Identity Providers (IdP)"
    description: "External identity providers used for user authentication."
relationships:
  - source: "Patients and Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Interacts for video consultations and platform features"
    technology: "HTTPS, WebSockets, WebRTC"
  - source: "Compliance Officer"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses audit logs and regional consent data"
    technology: "HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "National E-Prescription Gateways (EU)"
    description: "Connects to process electronic prescriptions"
    technology: "REST/SOAP over HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "US Pharmacy Networks"
    description: "Connects to process prescriptions"
    technology: "HL7 FHIR over HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity Providers (IdP)"
    description: "Authenticates users"
    technology: "OAuth 2.0 / OIDC"