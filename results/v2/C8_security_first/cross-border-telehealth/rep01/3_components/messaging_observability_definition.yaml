level: component
scope: "Component diagram for the Messaging & Observability container"
parentContainer:
  name: "Messaging & Observability"
elements:
  - type: "component"
    name: "Event Broker Component"
    technology: "Google Cloud Pub/Sub"
    description: "Manages regional event-driven messaging and Dead-Letter Queues with CMEK."
  - type: "component"
    name: "Telemetry Collector Component"
    technology: "OpenTelemetry Collector"
    description: "Handles distributed tracing, metrics, and telemetry data masking."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Cloud Audit Logs"
    description: "Sinks immutable audit trails via HTTPS API to Cloud Storage or BigQuery."
relationships:
  - source: "Telemetry Collector Component"
    destination: "Event Broker Component"
    description: "Publishes operational telemetry events"
  - source: "Audit Logger Component"
    destination: "Event Broker Component"
    description: "Publishes security and audit events"