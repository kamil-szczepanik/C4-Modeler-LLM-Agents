level: component
scope: "Component diagram for the E-Prescription Integration Container container"
parentContainer:
  name: "E-Prescription Integration Container"
elements:
  - type: "component"
    name: "Prescription Router Component"
    technology: "Node.js, TypeScript"
    description: "Routes and dispatches prescription payloads to regional adapters."
  - type: "component"
    name: "EU National Gateway Adapter"
    technology: "Node.js, TypeScript, europe-west3"
    description: "Dispatches regional EU formats via outbound mTLS with pinned IPs and certificates."
  - type: "component"
    name: "US Pharmacy Network Adapter"
    technology: "Node.js, TypeScript, us-central1, HL7 FHIR"
    description: "Transmits HL7 FHIR payloads via outbound mTLS to US pharmacy networks."
  - type: "component"
    name: "Outbox Pattern / Reliability Component"
    technology: "Node.js, TypeScript, Google Cloud Pub/Sub"
    description: "Handles reliable message queuing for transactional outbox pattern and event publishing."
relationships:
  - source: "Prescription Router Component"
    destination: "EU National Gateway Adapter"
    description: "Dispatches regional EU formats via outbound mTLS with pinned IPs and certificates"
  - source: "Prescription Router Component"
    destination: "US Pharmacy Network Adapter"
    description: "Transmits HL7 FHIR payloads via outbound mTLS"