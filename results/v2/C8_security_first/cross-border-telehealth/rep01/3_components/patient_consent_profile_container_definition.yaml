level: component
scope: "Component diagram for the Patient Consent & Profile Container container"
parentContainer:
  name: "Patient Consent & Profile Container"
elements:
  - type: "component"
    name: "Consent Controller"
    technology: "Go / Fiber"
    description: "Handles incoming HTTP/gRPC requests for consent management and profile operations."
  - type: "component"
    name: "Revocation Manager"
    technology: "Go Service"
    description: "Manages revocation events and updates regional token blocklists."
  - type: "component"
    name: "Consent Cryptography Service"
    technology: "Go / GCP Cloud KMS"
    description: "Signs JWT consent receipts using regional cryptographic keys."
relationships:
  - source: "Consent Controller"
    destination: "Consent Cryptography Service"
    description: "Requests cryptographic signing for consent receipts"
  - source: "Revocation Manager"
    destination: "Data Tier"
    description: "Persists consent revocation states"
  - source: "Revocation Manager"
    destination: "Messaging & Observability"
    description: "Publishes and consumes revocation events"