level: component
scope: "Component diagram for the AI Symptom Checker Container container"
parentContainer:
  name: "AI Symptom Checker Container"
elements:
  - type: "component"
    name: "Resilience & Fallback Middleware"
    technology: "Python / FastAPI Middleware"
    description: "Provides circuit-breaking, high availability, and graceful fallback responses for unstable connections."
  - type: "component"
    name: "Inference API Router"
    technology: "FastAPI"
    description: "Routes inference requests received via gRPC over mTLS from the API Gateway."
  - type: "component"
    name: "Clinical NLP & Preprocessing Engine"
    technology: "Python"
    description: "Processes and prepares clinical text data for symptom analysis."
  - type: "component"
    name: "PyTorch Inference Core & Explainability Module"
    technology: "PyTorch / Python"
    description: "Executes isolated neural network inference on GPU node pools and provides explainability."
  - type: "component"
    name: "Asynchronous Event Publisher"
    technology: "Google Cloud Pub/Sub Client"
    description: "Publishes asynchronous, guaranteed-delivery immutable audit logs to external messaging infrastructure."
relationships:
  - source: "Resilience & Fallback Middleware"
    destination: "Inference API Router"
    description: "Intercepts and manages request resilience and fallbacks"
  - source: "Inference API Router"
    destination: "Clinical NLP & Preprocessing Engine"
    description: "Passes routed requests for text preprocessing"
  - source: "Clinical NLP & Preprocessing Engine"
    destination: "PyTorch Inference Core & Explainability Module"
    description: "Sends preprocessed data for model inference"
  - source: "PyTorch Inference Core & Explainability Module"
    destination: "Asynchronous Event Publisher"
    description: "Triggers audit log events for inference transactions"