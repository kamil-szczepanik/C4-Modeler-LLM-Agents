level: component
scope: "Component diagram for the Video Consultation Service container"
parentContainer:
  name: "Video Consultation Service"
elements:
  - type: "component"
    name: "Signaling & Room Manager Component"
    technology: "Node.js"
    description: "Manages WebRTC signaling and rooms, forwarding WebSocket signaling from the API gateway and provisioning transport channels."
  - type: "component"
    name: "SFU Media Worker Component"
    technology: "Mediasoup / C++ core"
    description: "Handles media routing and Selective Forwarding Unit (SFU) capabilities for video consultations."
  - type: "component"
    name: "Bandwidth Adaptability Controller Component"
    technology: "Go"
    description: "Dynamically adjusts Simulcast and SVC layers based on network conditions for low-bandwidth resilience."
relationships:
  - source: "Signaling & Room Manager Component"
    destination: "SFU Media Worker Component"
    description: "Provisions transport channels [IPC]"
  - source: "Bandwidth Adaptability Controller Component"
    destination: "SFU Media Worker Component"
    description: "Adjusts Simulcast/SVC layers dynamically [In-memory API]"