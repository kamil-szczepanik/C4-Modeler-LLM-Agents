level: component
scope: "Component diagram for the API Gateway / Ingress container"
parentContainer:
  name: "API Gateway / Ingress"
elements:
  - type: "component"
    name: "Edge Router and WAF"
    technology: "Envoy / GCP HTTPS Load Balancer with Cloud Armor WAF"
    description: "Handles ingress routing, rate-limiting, TLS termination, and Anycast IP routing protection."
  - type: "component"
    name: "Authentication Handler"
    technology: "OAuth 2.0 / OIDC, FIDO2/WebAuthn"
    description: "Authenticates users and validates token blacklists against Google Cloud Memorystore."
  - type: "component"
    name: "Service Mesh Proxy"
    technology: "Istio gRPC xDS / SPIFFE"
    description: "Manages dynamic control plane configuration and secures internal microservice communication via mTLS."
relationships:
  - source: "Edge Router and WAF"
    destination: "Authentication Handler"
    description: "Validates incoming user sessions and tokens [OAuth 2.0 / OIDC]"
  - source: "Authentication Handler"
    destination: "Service Mesh Proxy"
    description: "Routes authorized traffic securely [gRPC over mTLS with SPIFFE IDs]"
  - source: "Service Mesh Proxy"
    destination: "Video Consultation Service"
    description: "Routes video traffic [gRPC over mTLS with SPIFFE IDs]"
  - source: "Service Mesh Proxy"
    destination: "AI Symptom Checker Container"
    description: "Routes AI inference requests [gRPC over mTLS with SPIFFE IDs]"
  - source: "Service Mesh Proxy"
    destination: "E-Prescription Integration Container"
    description: "Routes prescriptions [gRPC over mTLS with SPIFFE IDs]"
  - source: "Service Mesh Proxy"
    destination: "Patient Consent & Profile Container"
    description: "Routes consent management [gRPC over mTLS with SPIFFE IDs]"
  - source: "Authentication Handler"
    destination: "Google Cloud Memorystore (Redis)"
    description: "Validates token blacklists [RESP over TLS]"