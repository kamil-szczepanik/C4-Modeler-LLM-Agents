level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients in the EU and US utilizing secure video consultations, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals conducting video consultations and managing patient treatments."
  - type: "person"
    name: "Compliance Officer"
    description: "Officer overseeing regulatory compliance under GDPR and HIPAA."
  - type: "externalSystem"
    name: "National E-Prescription Gateways (EU)"
    description: "External national e-prescription gateways for the EU."
  - type: "externalSystem"
    name: "US Pharmacy Networks"
    description: "External US pharmacy networks for prescription fulfillment."
  - type: "externalSystem"
    name: "Identity Providers (IdP)"
    description: "External identity providers used for user authentication."
  - type: "container"
    name: "API Gateway / Ingress"
    technology: "Envoy / GCP HTTPS Load Balancer"
    description: "Enforces regional entry, TLS 1.3, and routing in europe-west3 and us-central1."
  - type: "container"
    name: "Video Consultation Service"
    technology: "Mediasoup WebRTC SFU containers"
    description: "Handles adaptive bitrate video streaming for consultations."
  - type: "container"
    name: "AI Symptom Checker Container"
    technology: "Python / FastAPI, PyTorch"
    description: "Inference engine for patient symptom checking."
  - type: "container"
    name: "E-Prescription Integration Container"
    technology: "Node.js, FHIR protocol adapters"
    description: "Manages e-prescriptions and integrations with external gateways and networks."
  - type: "container"
    name: "Patient Consent & Profile Container"
    technology: "Go"
    description: "Microservice for consent management (R-04) and event-driven revocations."
  - type: "container"
    name: "Data Tier"
    technology: "Cloud SQL PostgreSQL, Memorystore with CMEK"
    description: "Region-locked data storage ensuring strict data residency."
  - type: "container"
    name: "Messaging & Observability"
    technology: "Google Cloud Pub/Sub, OpenTelemetry, Cloud Audit Logs"
    description: "Handles event-driven messaging, telemetry, and audit logging."
relationships:
  - source: "Patients"
    destination: "API Gateway / Ingress"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS / TLS 1.3, OAuth 2.0 / OIDC, FIDO2/WebAuthn"
  - source: "Clinicians"
    destination: "API Gateway / Ingress"
    description: "Accesses consultations and patient profiles"
    technology: "HTTPS / TLS 1.3, OAuth 2.0 / OIDC, FIDO2/WebAuthn"
  - source: "Compliance Officer"
    destination: "API Gateway / Ingress"
    description: "Audits compliance, logs, and consents"
    technology: "HTTPS / TLS 1.3, OAuth 2.0 / OIDC"
  - source: "API Gateway / Ingress"
    destination: "Video Consultation Service"
    description: "Routes video consultation traffic"
    technology: "gRPC over mTLS"
  - source: "API Gateway / Ingress"
    destination: "AI Symptom Checker Container"
    description: "Routes AI inference requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway / Ingress"
    destination: "E-Prescription Integration Container"
    description: "Routes prescription requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway / Ingress"
    destination: "Patient Consent & Profile Container"
    description: "Routes consent and profile management requests"
    technology: "gRPC over mTLS"
  - source: "Video Consultation Service"
    destination: "Data Tier"
    description: "Reads and writes session data"
    technology: "SQL with CMEK over internal GCP network"
  - source: "AI Symptom Checker Container"
    destination: "Data Tier"
    description: "Reads and writes symptom check logs"
    technology: "SQL with CMEK over internal GCP network"
  - source: "E-Prescription Integration Container"
    destination: "Data Tier"
    description: "Persists prescription records"
    technology: "SQL with CMEK over internal GCP network"
  - source: "Patient Consent & Profile Container"
    destination: "Data Tier"
    description: "Persists consent states and user profiles"
    technology: "SQL with CMEK over internal GCP network"
  - source: "E-Prescription Integration Container"
    destination: "National E-Prescription Gateways (EU)"
    description: "Transmits electronic prescriptions"
    technology: "Outbound mTLS with pinned IPs and client certificates"
  - source: "E-Prescription Integration Container"
    destination: "US Pharmacy Networks"
    description: "Transmits prescription fulfillments"
    technology: "Outbound mTLS with pinned IPs and client certificates"
  - source: "API Gateway / Ingress"
    destination: "Identity Providers (IdP)"
    description: "Authenticates users"
    technology: "OAuth 2.0 / OIDC"
  - source: "Patient Consent & Profile Container"
    destination: "Messaging & Observability"
    description: "Publishes event-driven revocation events"
    technology: "Google Cloud Pub/Sub"
  - source: "Messaging & Observability"
    destination: "Video Consultation Service"
    description: "Propagates revocation events and telemetry"
    technology: "Google Cloud Pub/Sub, OpenTelemetry"
  - source: "Messaging & Observability"
    destination: "AI Symptom Checker Container"
    description: "Propagates events and telemetry"
    technology: "Google Cloud Pub/Sub, OpenTelemetry"
  - source: "Messaging & Observability"
    destination: "E-Prescription Integration Container"
    description: "Propagates events and telemetry"
    technology: "Google Cloud Pub/Sub, OpenTelemetry"