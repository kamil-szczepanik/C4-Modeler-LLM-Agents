level: component
scope: "Component diagram for the Consent & Policy Engine container"
parentContainer:
  name: "Consent & Policy Engine"
elements:
  - type: "component"
    name: "Policy Evaluation Service"
    technology: "Go, OPA Embedded"
    description: "Evaluates context-aware policies and handles policy validation requests."
  - type: "component"
    name: "Consent Management API"
    technology: "Go, Gin"
    description: "Manages consent updates and interactions with the regional consent store."
  - type: "component"
    name: "Bundle Signer & Publisher"
    technology: "Go"
    description: "Distributes signed OPA policy bundles to client apps."
relationships:
  - source: "Policy Evaluation Service"
    destination: "Consent Management API"
    description: "Queries consent states and policy data [Go internal/gRPC]"
  - source: "Bundle Signer & Publisher"
    destination: "Policy Evaluation Service"
    description: "Publishes signed policy bundles [Internal]"