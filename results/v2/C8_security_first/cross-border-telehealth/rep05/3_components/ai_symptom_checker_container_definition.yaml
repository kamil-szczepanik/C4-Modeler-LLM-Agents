# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the AI Symptom Checker Container container"
parentContainer:
  name: "AI Symptom Checker Container"
elements:
  - type: "component"
    name: "Symptom Analysis API Handler"
    technology: "Python / FastAPI"
    description: "Exposes endpoints to receive patient symptom inputs and coordinate the preliminary diagnostic triage."
  - type: "component"
    name: "Policy Validation Middleware"
    technology: "Opa / Go"
    description: "Validates consent and regional privacy policies before processing symptom data."
  - type: "component"
    name: "Diagnostic Integration Service"
    technology: "gRPC Client"
    description: "Communicates securely with the external AI Diagnostic Service with regional isolation."
  - type: "component"
    name: "Audit Log Writer"
    technology: "Python I/O"
    description: "Writes append-only audit and compliance logs to the local secure volume."
relationships:
  - source: "Symptom Analysis API Handler"
    destination: "Policy Validation Middleware"
    description: "Validates requests against"
  - source: "Symptom Analysis API Handler"
    destination: "Diagnostic Integration Service"
    description: "Forwards sanitized payload via"
  - source: "Symptom Analysis API Handler"
    destination: "Audit Log Writer"
    description: "Records interaction traces via"