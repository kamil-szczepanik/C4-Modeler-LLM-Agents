level: component
scope: "Component diagram for the E-Prescription Integration Service container"
parentContainer:
  name: "E-Prescription Integration Service"
elements:
  - type: "component"
    name: "Prescription API Controller"
    technology: "Node.js / Express"
    description: "Handles incoming e-prescription requests routed from the API Gateway."
  - type: "component"
    name: "Regional Adapter Engine"
    technology: "TypeScript"
    description: "Invokes translation and dispatch for secure fulfillment to regional networks."
  - type: "component"
    name: "Async Status Poller / Webhook Receiver"
    technology: "Node.js / Express"
    description: "Receives and polls fulfillment updates and publishes them to messaging queues."
  - type: "component"
    name: "DLQ Management & Retry Worker"
    technology: "Node.js / Express"
    description: "Manages dead-letter queues and re-dispatches corrected payloads."
  - type: "component"
    name: "Audit & Telemetry Middleware"
    technology: "TypeScript"
    description: "Emits immutable audit trails and telemetry data."
relationships:
  - source: "Prescription API Controller"
    destination: "Regional Adapter Engine"
    description: "Invokes translation and dispatch [In-process, TypeScript]"
  - source: "DLQ Management & Retry Worker"
    destination: "Regional Adapter Engine"
    description: "Re-dispatches corrected payloads [In-process]"