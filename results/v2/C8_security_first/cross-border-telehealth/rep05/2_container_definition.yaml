level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU & US)"
    description: "End users managing consent, participating in telehealth sessions, and using the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Healthcare providers delivering remote care, reviewing symptoms, and issuing e-prescriptions."
  - type: "person"
    name: "Compliance Officers"
    description: "Internal stakeholders auditing platform safety, policy enforcement, and regulatory adherence."
  - type: "externalSystem"
    name: "AI Diagnostic Service"
    description: "External service for advanced patient triage and urgency recommendations."
  - type: "externalSystem"
    name: "EU National e-Prescription Gateways & US Pharmacy Networks"
    description: "External systems for localized prescription fulfillment."
  - type: "container"
    name: "Frontend Client Apps"
    technology: "Flutter"
    description: "Cross-platform web and mobile support for patients, clinicians, and compliance officers."
  - type: "container"
    name: "API Gateway / BFF"
    technology: "Envoy / gRPC-Web"
    description: "Routes client traffic to internal containers, protected by mTLS via Anthos Service Mesh."
  - type: "container"
    name: "Video Consultation Service"
    technology: "WebRTC / SFU - Mediasoup"
    description: "Provides secure video consultations with adaptive streaming for low-bandwidth rural users."
  - type: "container"
    name: "AI Symptom Checker Container"
    technology: "Python / FastAPI"
    description: "Hosts the AI symptom checking logic for patient triage."
  - type: "container"
    name: "E-Prescription Integration Service"
    technology: "Node.js / Express"
    description: "Securely connects to external EU Gateways and US Pharmacy Networks for e-prescriptions."
  - type: "container"
    name: "Consent & Policy Engine"
    technology: "Opa / Go"
    description: "Validates data access against regional GDPR and HIPAA policies before granting access to data."
  - type: "container"
    name: "Data Layer"
    technology: "PostgreSQL / Cloud SQL"
    description: "Stores regionalized persistent data ensuring strict data residency."
relationships:
  - source: "Patients (EU & US)"
    destination: "Frontend Client Apps"
    description: "Interacts via HTTPS and WebRTC"
    technology: "HTTPS, WebRTC"
  - source: "Licensed Clinicians"
    destination: "Frontend Client Apps"
    description: "Interacts via HTTPS and WebRTC"
    technology: "HTTPS, WebRTC"
  - source: "Compliance Officers"
    destination: "Frontend Client Apps"
    description: "Interacts via HTTPS"
    technology: "HTTPS"
  - source: "Frontend Client Apps"
    destination: "API Gateway / BFF"
    description: "Communicates via gRPC-Web and HTTPS"
    technology: "gRPC-Web, HTTPS"
  - source: "API Gateway / BFF"
    destination: "Video Consultation Service"
    description: "Routes video traffic and requests"
    technology: "gRPC, mTLS"
  - source: "API Gateway / BFF"
    destination: "AI Symptom Checker Container"
    description: "Routes AI symptom checking requests"
    technology: "gRPC, mTLS"
  - source: "API Gateway / BFF"
    destination: "E-Prescription Integration Service"
    description: "Routes e-prescription requests"
    technology: "gRPC, mTLS"
  - source: "API Gateway / BFF"
    destination: "Consent & Policy Engine"
    description: "Requests policy validation and consent enforcement"
    technology: "gRPC, mTLS"
  - source: "Consent & Policy Engine"
    destination: "Data Layer"
    description: "Validates data access against regional policies"
    technology: "PostgreSQL protocol, mTLS"
  - source: "AI Symptom Checker Container"
    destination: "AI Diagnostic Service"
    description: "Sends triage requests with audit logging"
    technology: "gRPC"
  - source: "E-Prescription Integration Service"
    destination: "EU National e-Prescription Gateways & US Pharmacy Networks"
    description: "Securely connects for prescription fulfillment"
    technology: "HTTPS / Mutual TLS"