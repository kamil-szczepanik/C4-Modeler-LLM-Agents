level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides secure video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US, enforcing strict regional data residency while enabling compliant cross-border clinician access."
elements:
  - type: "person"
    name: "Patients (EU & US)"
    description: "End users managing consent and participating in telehealth sessions."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Healthcare providers delivering remote care and issuing e-prescriptions."
  - type: "person"
    name: "Compliance & Quality Assurance Officers"
    description: "Internal stakeholders auditing platform safety and regulatory adherence."
  - type: "externalSystem"
    name: "AI Diagnostic Service"
    description: "Containerized/external service for patient triage and urgency recommendations."
  - type: "externalSystem"
    name: "EU National e-Prescription Gateways & US Pharmacy Networks"
    description: "External systems for localized prescription fulfillment."
relationships:
  - source: "Patients (EU & US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses web UI/API and participates in video streaming"
    technology: "HTTPS, WebRTC"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses platform to deliver remote care and issue e-prescriptions"
    technology: "HTTPS, WebRTC"
  - source: "Compliance & Quality Assurance Officers"
    destination: "Cross-Border Telehealth Platform"
    description: "Audits platform safety and regulatory adherence"
    technology: "HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "AI Diagnostic Service"
    description: "Sends low-latency triage requests with WORM audit logging"
    technology: "gRPC"
  - source: "Cross-Border Telehealth Platform"
    destination: "EU National e-Prescription Gateways & US Pharmacy Networks"
    description: "Localized prescription fulfillment"
    technology: "REST / HL7 FHIR with mTLS"