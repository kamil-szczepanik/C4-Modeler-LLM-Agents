level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU and US)"
    description: "Patients located in the EU and US utilizing video consultations, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Clinicians who conduct video consultations and issue e-prescriptions."
  - type: "externalSystem"
    name: "External Identity Providers (OAuth2/OIDC)"
    description: "External identity providers managing authentication."
  - type: "externalSystem"
    name: "National e-Prescription Gateways & US Pharmacy Networks (HL7 FHIR)"
    description: "External national gateways and pharmacy networks for routing prescriptions."
  - type: "container"
    name: "API Gateway & BFF"
    technology: "Go, Envoy Proxy"
    description: "Routes internal traffic, enforces token validation and purpose-based consent."
  - type: "container"
    name: "Video Consultation Container"
    technology: "WebRTC SFU, MediaSoup"
    description: "Handles video consultation media streams with adaptive bitrate down to 150 kbit/s."
  - type: "container"
    name: "E-Prescription Integration Container"
    technology: "Node.js, Express"
    description: "Manages e-prescription integration with external networks and national gateways."
  - type: "container"
    name: "AI Symptom Checker Container"
    technology: "Python, FastAPI"
    description: "Processes AI symptom checks and logs inputs, outputs, and signed model versions."
  - type: "container"
    name: "Cloud SQL (PostgreSQL)"
    technology: "Cloud SQL, PostgreSQL"
    description: "Relational database for structured application data."
  - type: "container"
    name: "Cloud Storage (WORM enabled)"
    technology: "Google Cloud Storage"
    description: "Regional secure storage with WORM policies for logs, signed models, and compliance data."
relationships:
  - source: "Patients (EU and US)"
    destination: "API Gateway & BFF"
    description: "Connects to API Gateway for telehealth services"
    technology: "HTTPS / WebSocket over TLS 1.3"
  - source: "Licensed Clinicians"
    destination: "API Gateway & BFF"
    description: "Connects to API Gateway for consultations and management"
    technology: "HTTPS / WebSocket over TLS 1.3"
  - source: "Patients (EU and US)"
    destination: "Video Consultation Container"
    description: "Streams video consultations via WebRTC"
    technology: "DTLS-SRTP"
  - source: "Licensed Clinicians"
    destination: "Video Consultation Container"
    description: "Streams video consultations via WebRTC"
    technology: "DTLS-SRTP"
  - source: "API Gateway & BFF"
    destination: "E-Prescription Integration Container"
    description: "Routes e-prescription requests"
    technology: "mTLS over gRPC/REST"
  - source: "API Gateway & BFF"
    destination: "AI Symptom Checker Container"
    description: "Routes symptom checking requests"
    technology: "mTLS over gRPC/REST"
  - source: "API Gateway & BFF"
    destination: "Video Consultation Container"
    description: "Routes consultation management requests"
    technology: "mTLS over gRPC/REST"
  - source: "E-Prescription Integration Container"
    destination: "National e-Prescription Gateways & US Pharmacy Networks (HL7 FHIR)"
    description: "Connects to pharmacy networks and national gateways"
    technology: "HL7 FHIR / REST"
  - source: "AI Symptom Checker Container"
    destination: "Cloud Storage (WORM enabled)"
    description: "Logs inputs, outputs, and signed model versions"
    technology: "Cloud Storage APIs"
  - source: "E-Prescription Integration Container"
    destination: "Cloud SQL (PostgreSQL)"
    description: "Persists prescription data"
    technology: "PostgreSQL Protocol"
  - source: "AI Symptom Checker Container"
    destination: "Cloud SQL (PostgreSQL)"
    description: "Persists symptom check data"
    technology: "PostgreSQL Protocol"
  - source: "API Gateway & BFF"
    destination: "External Identity Providers (OAuth2/OIDC)"
    description: "Validates tokens and authenticates users"
    technology: "OAuth2 / OIDC"