level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and the US while ensuring strict regional data residency, regulatory compliance, and resilience for unstable rural connections."
elements:
  - type: "person"
    name: "Patients (EU/US)"
    description: "Patients located in the EU and US utilizing video consultations, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Clinicians who conduct video consultations and issue e-prescriptions."
  - type: "person"
    name: "Compliance / Quality Assurance Auditors"
    description: "Auditors who review platform activities and compliance logs via read-only APIs."
  - type: "externalSystem"
    name: "External Pharmacy / Partner Network"
    description: "External network for fulfilling prescriptions."
  - type: "externalSystem"
    name: "National e-Prescription Gateways (EU) & US Pharmacy Networks (HL7 FHIR)"
    description: "External national gateways and pharmacy networks for routing prescriptions."
  - type: "externalSystem"
    name: "Third-Party Video Relay / TURN Network"
    description: "External relay and TURN network for handling video consultation media streams."
  - type: "externalSystem"
    name: "External Identity Providers (OAuth2/OIDC)"
    description: "Identity providers managing authentication and multi-factor authentication."
  - type: "externalSystem"
    name: "Localized AI Model Registries"
    description: "Registries containing AI model artifacts secured for EU MDR compliance."
relationships:
  - source: "Patients (EU/US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses telehealth services via global Anycast Load Balancing"
    technology: "HTTPS / WSS (TLS 1.3)"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Conducts consultations and manages patient care"
    technology: "HTTPS / WSS (TLS 1.3)"
  - source: "Compliance / Quality Assurance Auditors"
    destination: "Cross-Border Telehealth Platform"
    description: "Reviews audit and compliance data"
    technology: "IAM-restricted Read-Only APIs (R-04, R-07)"
  - source: "Cross-Border Telehealth Platform"
    destination: "National e-Prescription Gateways (EU) & US Pharmacy Networks (HL7 FHIR)"
    description: "Submits and manages e-prescriptions"
    technology: "HTTPS / REST with mTLS and signed JWTs (R-02, R-08)"
  - source: "Cross-Border Telehealth Platform"
    destination: "Third-Party Video Relay / TURN Network"
    description: "Relays video consultation media streams"
    technology: "WebRTC / SRTP over DTLS with ephemeral tokens (R-06)"
  - source: "Cross-Border Telehealth Platform"
    destination: "External Identity Providers (OAuth2/OIDC)"
    description: "Authenticates users and verifies clinician MFA"
    technology: "OAuth2 / OIDC over HTTPS"