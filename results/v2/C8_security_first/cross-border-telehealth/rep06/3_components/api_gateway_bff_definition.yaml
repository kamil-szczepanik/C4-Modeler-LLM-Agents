# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the API Gateway & BFF container"
parentContainer:
  name: "API Gateway & BFF"
elements:
  - type: "component"
    name: "Geo-Enforcement & Routing Proxy"
    technology: "Envoy Proxy"
    description: "Handles edge termination, TLS 1.3, regional geo-routing, rate limiting, and connection resilience."
  - type: "component"
    name: "Consent & Auth Middleware"
    technology: "Go"
    description: "Validates user authentication tokens and manages user consent policies."
  - type: "component"
    name: "BFF Aggregator & Transformer"
    technology: "Go"
    description: "Aggregates and transforms requests, routing them to downstream microservices."
  - type: "component"
    name: "Telemetry & Resilience Interceptor"
    technology: "Go"
    description: "Monitors rural network latencies, applies payload compression, circuit breaking, and distributed tracing."
relationships:
  - source: "Geo-Enforcement & Routing Proxy"
    destination: "Consent & Auth Middleware"
    description: "Forwards incoming traffic for token validation"
  - source: "Consent & Auth Middleware"
    destination: "BFF Aggregator & Transformer"
    description: "Passes authenticated and authorized requests"
  - source: "BFF Aggregator & Transformer"
    destination: "Telemetry & Resilience Interceptor"
    description: "Intercepts requests for tracing and resilience"