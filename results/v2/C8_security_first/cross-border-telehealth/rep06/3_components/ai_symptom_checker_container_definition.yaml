# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the AI Symptom Checker Container container"
parentContainer:
  name: "AI Symptom Checker Container"
elements:
  - type: "component"
    name: "API Router / Triage Controller"
    technology: "Python, FastAPI"
    description: "Provides lightweight, high-performance API endpoints for rapid request handling of patient symptom inputs."
  - type: "component"
    name: "Deterministic Validation Layer"
    technology: "Python"
    description: "Enforces clinical safety guardrails and validates input data prior to inference."
  - type: "component"
    name: "Inference Engine"
    technology: "PyTorch, ONNX Runtime"
    description: "Executes localized AI models efficiently for fast inference to deliver care-urgency recommendations."
  - type: "component"
    name: "Traceability & Audit Interceptor"
    technology: "Python with Cryptographic HSM-Backed Keys"
    description: "Ensures secure, tamper-proof signing of audit logs for regulatory compliance and EU MDR traceability."
  - type: "component"
    name: "Localized AI Model Registries"
    technology: "Model Registry Storage"
    description: "Stores localized AI models ensuring strict regional data isolation."
  - type: "component"
    name: "Cloud Storage (WORM enabled)"
    technology: "Cloud Storage APIs"
    description: "Provides WORM-enabled cloud storage for immutable audit logs."
relationships:
  - source: "API Router / Triage Controller"
    destination: "Deterministic Validation Layer"
    description: "In-process Python call"
  - source: "Deterministic Validation Layer"
    destination: "Inference Engine"
    description: "In-process Python call"
  - source: "Inference Engine"
    destination: "Localized AI Model Registries"
    description: "HTTPS / gRPC"
  - source: "Inference Engine"
    destination: "Traceability & Audit Interceptor"
    description: "In-process hook"
  - source: "Traceability & Audit Interceptor"
    destination: "Cloud Storage (WORM enabled)"
    description: "Cloud Storage APIs"