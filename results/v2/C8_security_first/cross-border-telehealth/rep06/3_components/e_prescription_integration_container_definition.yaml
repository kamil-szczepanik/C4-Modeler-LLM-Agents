level: component
scope: "Component diagram for the E-Prescription Integration Container container"
parentContainer:
  name: "E-Prescription Integration Container"
elements:
  - type: "component"
    name: "Prescription Router"
    technology: "Node.js, Express"
    description: "Routes incoming e-prescription requests within the integration container."
  - type: "component"
    name: "National Gateway Adapter"
    technology: "Node.js, Express"
    description: "Dispatches prescriptions to National e-Prescription Gateways and US Pharmacy Networks using HL7 FHIR and REST over mTLS."
  - type: "component"
    name: "Prescription State & Event Manager"
    technology: "Node.js, Express"
    description: "Manages prescription states and persists audit logs to Cloud SQL and publishes lifecycle events to Cloud Pub/Sub."
  - type: "component"
    name: "Prescription Outbox & Retry Processor"
    technology: "Node.js, Express, BullMQ"
    description: "Handles reliable messaging and transactional outbox queues for asynchronous event processing."
relationships:
  - source: "Prescription Router"
    destination: "National Gateway Adapter"
    description: "Forwards prescription payloads"
  - source: "Prescription Router"
    destination: "Prescription State & Event Manager"
    description: "Updates state and tracks lifecycle"
  - source: "Prescription State & Event Manager"
    destination: "Prescription Outbox & Retry Processor"
    description: "Queues messages for reliable delivery"