level: component
scope: "Component diagram for the Cloud SQL (PostgreSQL) container"
parentContainer:
  name: "Cloud SQL (PostgreSQL)"
elements:
  - type: "component"
    name: "PgBouncer Connection Pooler"
    technology: "PgBouncer"
    description: "Manages and optimizes database connection pooling for incoming requests from backend containers."
  - type: "component"
    name: "User and Consent Management Engine"
    technology: "PostgreSQL 15+ Database Engine"
    description: "Stores and retrieves relational user profiles and consent management data securely with Row-Level Security."
  - type: "component"
    name: "E-Prescription Data Store"
    technology: "PostgreSQL 15+ Database Engine"
    description: "Persists structured e-prescription data with strict data isolation."
  - type: "component"
    name: "AI Symptom Logs Store"
    technology: "PostgreSQL 15+ Database Engine"
    description: "Persists symptom logs and AI model version metadata."
relationships:
  - source: "PgBouncer Connection Pooler"
    destination: "User and Consent Management Engine"
    description: "Routes pooled queries for user profiles and consent management [PostgreSQL Protocol over TLS 1.3]"
  - source: "PgBouncer Connection Pooler"
    destination: "E-Prescription Data Store"
    description: "Routes queries to persist structured e-prescription data [PostgreSQL Protocol over TLS 1.3]"
  - source: "PgBouncer Connection Pooler"
    destination: "AI Symptom Logs Store"
    description: "Routes queries to persist symptom logs and model metadata [PostgreSQL Protocol over TLS 1.3]"