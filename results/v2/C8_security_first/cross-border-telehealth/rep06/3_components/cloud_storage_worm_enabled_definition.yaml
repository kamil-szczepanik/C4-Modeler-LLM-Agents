level: component
scope: "Component diagram for the Cloud Storage (WORM enabled) container"
parentContainer:
  name: "Cloud Storage (WORM enabled)"
elements:
  - type: "component"
    name: "Object Retention Lock Engine"
    technology: "Google Cloud Storage Object Retention Lock"
    description: "Enforces Write Once, Read Many (WORM) immutability policies for compliance and audit logs."
  - type: "component"
    name: "CMEK Key Management Module"
    technology: "Cloud KMS"
    description: "Manages Customer-Managed Encryption Keys (CMEK) to secure regional data at rest."
  - type: "component"
    name: "Storage API Interface"
    technology: "Google Cloud Storage APIs, HTTPS (REST)"
    description: "Handles asynchronous log ingestion requests and model retrieval queries from internal services."
relationships:
  - source: "Storage API Interface"
    destination: "Object Retention Lock Engine"
    description: "Persists immutable logs"
  - source: "Storage API Interface"
    destination: "CMEK Key Management Module"
    description: "Encrypts and decrypts stored objects"