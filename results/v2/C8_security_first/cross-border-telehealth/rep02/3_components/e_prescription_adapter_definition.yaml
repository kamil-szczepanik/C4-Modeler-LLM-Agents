level: component
scope: "Component diagram for the E-Prescription Adapter container"
parentContainer:
  name: "E-Prescription Adapter"
elements:
  - type: "component"
    name: "Prescription Router"
    technology: "Node.js / TypeScript"
    description: "Routes prescription requests and enqueues messages."
  - type: "component"
    name: "Outbox Processor"
    technology: "Node.js / TypeScript"
    description: "Enqueues messages, dispatches queued payloads, dispatches delivery state changes, and forwards immutable event logs using the Transactional Outbox pattern."
  - type: "component"
    name: "Gateway Client"
    technology: "Node.js / TypeScript"
    description: "Dispatches queued payloads to local pharmacies."
  - type: "component"
    name: "Status Notification"
    technology: "Node.js / TypeScript"
    description: "Dispatches delivery state changes and pushes status receipts and error codes."
  - type: "component"
    name: "Audit Logging"
    technology: "Node.js / TypeScript"
    description: "Forwards immutable event logs to regional WORM storage."
relationships:
  - source: "Prescription Router"
    destination: "Outbox Processor"
    description: "Enqueues messages [Internal Async]"
  - source: "Outbox Processor"
    destination: "Gateway Client"
    description: "Dispatches queued payloads [Internal Event]"
  - source: "Gateway Client"
    destination: "Local Pharmacies"
    description: "Transmits signed payloads [TLS 1.3, HL7 FHIR/REST/SOAP]"
  - source: "Outbox Processor"
    destination: "Status Notification"
    description: "Dispatches delivery state changes [Internal Event]"
  - source: "Status Notification"
    destination: "Backend-for-Frontend (BFF)"
    description: "Pushes status receipts and error codes [gRPC Stream]"
  - source: "Outbox Processor"
    destination: "Audit Logging"
    description: "Forwards immutable event logs [Internal Async]"
  - source: "Audit Logging"
    destination: "Regional WORM Storage"
    description: "Writes compliance logs [GCP Storage API, TLS 1.3]"