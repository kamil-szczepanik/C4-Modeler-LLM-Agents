level: component
scope: "Component diagram for the AI Triage Service container"
parentContainer:
  name: "AI Triage Service"
elements:
  - type: "component"
    name: "API Controller"
    technology: "Node.js"
    description: "Handles incoming triage requests and routes them within the AI Triage Service."
  - type: "component"
    name: "Consent & Policy Enforcer"
    technology: "OPA/Rego"
    description: "Verifies regional permissions and enforces consent policies."
  - type: "component"
    name: "Inference Orchestrator"
    technology: "Python/LangChain"
    description: "Queries symptoms and orchestrates AI triage inference."
  - type: "component"
    name: "Audit & Cryptographic Signer"
    technology: "Python/Tink"
    description: "Writes and cryptographically signs audit logs."
  - type: "component"
    name: "Fallback & Circuit Breaker Manager"
    technology: "Python"
    description: "Manages resilience and handles async timeouts for rural fallback."
relationships:
  - source: "API Controller"
    destination: "Consent & Policy Enforcer"
    description: "Validates request permissions [OPA/Rego]"
  - source: "Consent & Policy Enforcer"
    destination: "Inference Orchestrator"
    description: "Approves execution for symptom processing"
  - source: "Inference Orchestrator"
    destination: "Audit & Cryptographic Signer"
    description: "Sends inference events for signing"
  - source: "Audit & Cryptographic Signer"
    destination: "Regional WORM Storage"
    description: "Writes signed logs [HTTPS, GCP IAM]"