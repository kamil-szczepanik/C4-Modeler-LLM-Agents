level: component
scope: "Component diagram for the Regional WORM Storage container"
parentContainer:
  name: "Regional WORM Storage"
elements:
  - type: "component"
    name: "Access Control & Policy Enforcer"
    technology: "GCP Storage / Policy Engine"
    description: "Handles read/write operation requests and rejects legacy ACLs entirely."
  - type: "component"
    name: "Uniform Access Enforcer"
    technology: "GCP API"
    description: "Ensures uniform access enforcement by rejecting legacy ACLs entirely."
  - type: "component"
    name: "Encryption & Key Manager Interface"
    technology: "Internal GCP API / Google Cloud KMS"
    description: "Applies regional CMEK for data at rest."
  - type: "component"
    name: "Immutability & Retention Engine"
    technology: "Internal GCP API / GCP Cloud Storage"
    description: "Applies WORM lock on write and triggers object purging post-retention expiration."
  - type: "component"
    name: "Lifecycle & Disposal Engine"
    technology: "Internal API"
    description: "Triggers object purging post-retention expiration."
relationships:
  - source: "Access Control & Policy Enforcer"
    destination: "Uniform Access Enforcer"
    description: "Rejects legacy ACLs entirely"
  - source: "Access Control & Policy Enforcer"
    destination: "Encryption & Key Manager Interface"
    description: "Applies regional CMEK for data at rest"
  - source: "Access Control & Policy Enforcer"
    destination: "Immutability & Retention Engine"
    description: "Applies WORM lock on write"
  - source: "Immutability & Retention Engine"
    destination: "Lifecycle & Disposal Engine"
    description: "Triggers object purging post-retention expiration"