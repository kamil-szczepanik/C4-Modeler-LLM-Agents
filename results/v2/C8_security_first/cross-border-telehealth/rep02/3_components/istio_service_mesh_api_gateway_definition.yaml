level: component
scope: "Component diagram for the Istio Service Mesh & API Gateway container"
parentContainer:
  name: "Istio Service Mesh & API Gateway"
elements:
  - type: "component"
    name: "Envoy Ingress Proxy"
    technology: "Envoy proxy"
    description: "Handles edge routing, TLS termination, geo-restrictions, and mTLS enforcement."
  - type: "component"
    name: "Ext_Authz Authorization Filter"
    technology: "Istio Extension"
    description: "Interfacing with the Consent Manager for request authorization."
  - type: "component"
    name: "Traffic Management Router"
    technology: "Istio Service Mesh"
    description: "Manages multi-region traffic routing and rate limiting."
relationships:
  - source: "Envoy Ingress Proxy"
    destination: "Ext_Authz Authorization Filter"
    description: "Delegates request authorization"
  - source: "Envoy Ingress Proxy"
    destination: "Traffic Management Router"
    description: "Routes traffic to regional BFFs and services"