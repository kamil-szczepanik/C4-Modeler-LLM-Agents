level: component
scope: "Component diagram for the Backend-for-Frontend (BFF) container"
parentContainer:
  name: "Backend-for-Frontend (BFF)"
elements:
  - type: "component"
    name: "GraphQL API Gateway Layer (Apollo Server)"
    technology: "Apollo Server, Zod / Joi"
    description: "Handles query parsing, schema validation, depth limiting, and complexity analysis."
  - type: "component"
    name: "Authentication & Token Translator"
    technology: "Node.js"
    description: "Terminates client JWTs, validates scopes, and issues internal mTLS tokens."
  - type: "component"
    name: "Resilience & Batching Middleware"
    technology: "Node.js"
    description: "Manages query batching, optimistic mutations, and connectivity status for rural users."
  - type: "component"
    name: "Resolver & Aggregator Engine"
    technology: "Node.js"
    description: "Orchestrates domain-specific data fetching and field-level authorization."
  - type: "component"
    name: "Telemetry & Audit Interceptor"
    technology: "OpenTelemetry"
    description: "Injects OpenTelemetry context and regional audit headers for EU MDR traceability."
  - type: "component"
    name: "Clients"
    technology: "HTTPS"
    description: "Cross-border telehealth patients and clinicians."
  - type: "component"
    name: "Domain Microservices (Consent Manager, AI Triage, E-Prescription)"
    technology: "gRPC over mTLS (Istio)"
    description: "Downstream domain services accessed via gRPC."
relationships:
  - source: "Clients"
    destination: "GraphQL API Gateway Layer (Apollo Server)"
    description: "Sends aggregated queries and mutations over HTTPS."
  - source: "GraphQL API Gateway Layer (Apollo Server)"
    destination: "Authentication & Token Translator"
    description: "Delegates user session validation [In-process]."
  - source: "Authentication & Token Translator"
    destination: "Resilience & Batching Middleware"
    description: "Passes validated operations [In-process middleware]."
  - source: "Resilience & Batching Middleware"
    destination: "Resolver & Aggregator Engine"
    description: "Forwards batched requests [In-process function call]."
  - source: "Resolver & Aggregator Engine"
    destination: "Domain Microservices (Consent Manager, AI Triage, E-Prescription)"
    description: "Dispatches calls via gRPC over mTLS (Istio)."