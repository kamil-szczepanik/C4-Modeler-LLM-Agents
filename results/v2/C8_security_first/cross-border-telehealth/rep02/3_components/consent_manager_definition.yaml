level: component
scope: "Component diagram for the Consent Manager container"
parentContainer:
  name: "Consent Manager"
elements:
  - type: "component"
    name: "Consent API Router"
    technology: "Go, Gin framework"
    description: "Routes incoming gRPC compliance and consent requests."
  - type: "component"
    name: "OPA Engine"
    technology: "Open Policy Agent"
    description: "Evaluates dynamic GDPR/HIPAA compliance rules in real-time."
  - type: "component"
    name: "Fallback Policy Cache"
    technology: "SQLite, In-Memory / Local Disk"
    description: "Powers the local fallback policy cache for unstable rural connections."
  - type: "component"
    name: "Break-Glass Mediator"
    technology: "Go, Gin framework"
    description: "Handles immutable emergency access justifications."
relationships:
  - source: "Consent API Router"
    destination: "OPA Engine"
    description: "Evaluates compliance policies"
  - source: "Consent API Router"
    destination: "Fallback Policy Cache"
    description: "Reads cached local consent states"
  - source: "Break-Glass Mediator"
    destination: "Regional WORM Storage"
    description: "Persists immutable emergency access justifications via HTTPS"