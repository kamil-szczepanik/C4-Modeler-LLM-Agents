level: component
scope: "Component diagram for the Mediasoup SFU container"
parentContainer:
  name: "Mediasoup SFU"
elements:
  - type: "component"
    name: "Worker Pool"
    technology: "C++ / Node.js"
    description: "Manages underlying media workers, controls transport and producer/consumer creation."
  - type: "component"
    name: "Room & Signaling Manager"
    technology: "Node.js"
    description: "Handles signaling and coordinates transport and producer/consumer creation."
  - type: "component"
    name: "Simulcast & Adaptation Controller"
    technology: "C++"
    description: "Controls low-bandwidth adaptation and feeds bitrate and packet loss metrics."
  - type: "component"
    name: "Telemetry & Stats Exporter"
    technology: "Node.js / Prometheus"
    description: "Exports QoE telemetry, connection state changes, and performance stats."
relationships:
  - source: "Room & Signaling Manager"
    destination: "Worker Pool"
    description: "Controls transport and producer/consumer creation [IPC]"
  - source: "Simulcast & Adaptation Controller"
    destination: "Telemetry & Stats Exporter"
    description: "Feeds bitrate and packet loss metrics [Internal IPC]"