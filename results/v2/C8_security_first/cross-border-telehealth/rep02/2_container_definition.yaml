# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "EU and US mobile/web clients seeking video consultations and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Healthcare professionals conducting video consultations and issuing e-prescriptions."
  - type: "externalSystem"
    name: "Local Pharmacies"
    description: "EU and US pharmacies receiving e-prescription orders."
  - type: "externalSystem"
    name: "External Identity Providers (IdP)"
    description: "External identity providers handling user authentication."
  - type: "container"
    name: "Istio Service Mesh & API Gateway"
    description: "Manages mTLS, traffic splitting, VPC Service Controls, and routes incoming traffic."
    technology: "Istio"
  - type: "container"
    name: "Backend-for-Frontend (BFF)"
    description: "Powers the regional BFF to abstract regional data formats."
    technology: "Node.js, GraphQL"
  - type: "container"
    name: "Mediasoup SFU"
    description: "WebRTC SFU container for video/audio streaming with sub-300 kbit/s bandwidth degradation."
    technology: "Mediasoup WebRTC"
  - type: "container"
    name: "AI Triage Service"
    description: "Performs AI symptom checking and triage."
    technology: "Containerized Service"
  - type: "container"
    name: "Consent Manager"
    description: "Manages regional data privacy, consent, and regulatory compliance (GDPR/HIPAA)."
    technology: "Containerized Service"
  - type: "container"
    name: "E-Prescription Adapter"
    description: "Transmits e-prescriptions to US Pharmacies via HL7 FHIR and to EU Pharmacies via national standards (REST/SOAP)."
    technology: "Containerized Service"
  - type: "container"
    name: "Regional WORM Storage"
    description: "Enforces strict regional data residency for secure data storage."
    technology: "GCP Storage"
relationships:
  - source: "Patients"
    destination: "Istio Service Mesh & API Gateway"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS (TLS 1.3)"
  - source: "Licensed Clinicians"
    destination: "Istio Service Mesh & API Gateway"
    description: "Conducts video consultations and manages prescriptions"
    technology: "HTTPS (TLS 1.3)"
  - source: "Istio Service Mesh & API Gateway"
    destination: "Backend-for-Frontend (BFF)"
    description: "Routes client requests to regional BFF"
    technology: "gRPC over mTLS"
  - source: "Istio Service Mesh & API Gateway"
    destination: "Mediasoup SFU"
    description: "Routes video and audio streams"
    technology: "DTLS-SRTP"
  - source: "Backend-for-Frontend (BFF)"
    destination: "AI Triage Service"
    description: "Sends triage and symptom check requests"
    technology: "gRPC over mTLS (Istio)"
  - source: "Backend-for-Frontend (BFF)"
    destination: "Consent Manager"
    description: "Validates user consent and compliance policies"
    technology: "gRPC over mTLS (Istio)"
  - source: "Backend-for-Frontend (BFF)"
    destination: "E-Prescription Adapter"
    description: "Sends e-prescription generation requests"
    technology: "gRPC over mTLS (Istio)"
  - source: "E-Prescription Adapter"
    destination: "Local Pharmacies"
    description: "Transmits e-prescriptions to US and EU pharmacies"
    technology: "HL7 FHIR, REST/SOAP"
  - source: "Backend-for-Frontend (BFF)"
    destination: "Regional WORM Storage"
    description: "Persists patient data and records enforcing data residency"
    technology: "HTTPS"
  - source: "AI Triage Service"
    destination: "Regional WORM Storage"
    description: "Logs immutable inference records"
    technology: "HTTPS"
  - source: "Consent Manager"
    destination: "Regional WORM Storage"
    description: "Persists consent records"
    technology: "HTTPS"
  - source: "Istio Service Mesh & API Gateway"
    destination: "External Identity Providers (IdP)"
    description: "Authenticates users"
    technology: "OAuth 2.0 / OIDC"