level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients across the EU and US under a single provider while enforcing regional data residency and compliance."
elements:
  - type: "person"
    name: "Patients"
    description: "EU and US mobile/web clients seeking video consultations and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Healthcare professionals conducting video consultations and issuing e-prescriptions."
  - type: "externalSystem"
    name: "Local Pharmacies"
    description: "EU and US pharmacies receiving e-prescription orders."
  - type: "externalSystem"
    name: "Identity Providers (IdP)"
    description: "External identity providers handling user authentication via OAuth 2.0 / OIDC."
  - type: "externalSystem"
    name: "AI Triage Engine"
    description: "AI engine providing symptom checks and logging immutable inference records."
relationships:
  - source: "Patients"
    destination: "Cross-Border Telehealth Platform"
    description: "Interacts with the platform for video consultations and AI symptom checking"
    technology: "HTTPS, WebRTC (DTLS-SRTP)"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Interacts with the platform to conduct consultations and manage patient care"
    technology: "HTTPS, WebRTC (DTLS-SRTP)"
  - source: "Cross-Border Telehealth Platform"
    destination: "Local Pharmacies"
    description: "Connects to transmit e-prescriptions using national standards and HL7 FHIR APIs"
    technology: "mTLS, payload-level digital signatures"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity Providers (IdP)"
    description: "Authenticates users via federated authentication"
    technology: "OAuth 2.0 / OIDC"
  - source: "Cross-Border Telehealth Platform"
    destination: "AI Triage Engine"
    description: "Sends triage requests and logs immutable inference records"
    technology: "Cloud Audit Logs"