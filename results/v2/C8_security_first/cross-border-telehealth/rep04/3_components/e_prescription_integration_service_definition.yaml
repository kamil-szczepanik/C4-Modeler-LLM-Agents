level: component
scope: "Component diagram for the E-Prescription Integration Service container"
parentContainer:
  name: "E-Prescription Integration Service"
elements:
  - type: "component"
    name: "Prescription Workflow Coordinator"
    technology: "Java / Spring Boot"
    description: "Coordinates prescription workflows and manages core prescription logic."
  - type: "component"
    name: "EU Gateway Adapter"
    technology: "Apache Camel / Java"
    description: "Submits translated prescriptions to EU National E-Prescription Gateways via REST/SOAP APIs."
  - type: "component"
    name: "US Interoperability Adapter"
    technology: "HAPI FHIR / Java"
    description: "Exchanges prescription data with US Healthcare Networks using HL7 FHIR APIs over HTTPS."
  - type: "component"
    name: "Event & DLQ Handler"
    technology: "Google Cloud Pub/Sub Client / Java"
    description: "Manages failed dispatches, failure events, and regional DLQs."
  - type: "component"
    name: "Circuit Breaker Manager"
    technology: "Resilience4j / Java"
    description: "Handles external network circuit-breaking to maintain care continuity during gateway failures."
relationships:
  - source: "Prescription Workflow Coordinator"
    destination: "EU Gateway Adapter"
    description: "Routes EU prescriptions for translation and submission"
  - source: "Prescription Workflow Coordinator"
    destination: "US Interoperability Adapter"
    description: "Routes US prescriptions for FHIR formatting and exchange"
  - source: "Prescription Workflow Coordinator"
    destination: "Event & DLQ Handler"
    description: "Publishes failure events and failed dispatches"
  - source: "US Interoperability Adapter"
    destination: "Circuit Breaker Manager"
    description: "Wraps external network calls with resilience policies"