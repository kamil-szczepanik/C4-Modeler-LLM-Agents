level: component
scope: "Component diagram for the AI Symptom Checker Service container"
parentContainer:
  name: "AI Symptom Checker Service"
elements:
  - type: "component"
    name: "Symptom Router API"
    technology: "FastAPI / Python"
    description: "Handles incoming client requests via gRPC over mTLS and routes symptom checking workloads."
  - type: "component"
    name: "Inference Coordinator"
    technology: "Python"
    description: "Manages regional inference requests and communicates securely with Vertex AI endpoints."
  - type: "component"
    name: "Audit Logger"
    technology: "Python / Google Cloud KMS"
    description: "Records compliance and audit logs utilizing WORM Object Lock Storage and CMEK protection."
relationships:
  - source: "Symptom Router API"
    destination: "Inference Coordinator"
    description: "Delegates inference tasks"
  - source: "Inference Coordinator"
    destination: "Audit Logger"
    description: "Triggers audit logging for inference actions"