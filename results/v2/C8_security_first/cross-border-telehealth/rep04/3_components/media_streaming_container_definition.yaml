level: component
scope: "Component diagram for the Media Streaming Container container"
parentContainer:
  name: "Media Streaming Container"
elements:
  - type: "component"
    name: "Signaling & Session Manager Component"
    technology: "Node.js / WebSockets"
    description: "Manages media signaling, session state, and authenticated room commands."
  - type: "component"
    name: "Adaptive Bitrate (ABR) Controller Component"
    technology: "C++ / WebRTC ABR"
    description: "Monitors real-time network conditions and controls video bitrate and audio-first fallback."
  - type: "component"
    name: "Media Relay & Encryption Engine Component"
    technology: "Janus WebRTC SFU / BoringSSL / libsrtp"
    description: "Handles media transport and enforces mandatory DTLS-SRTP encryption with AES-256 ciphers."
relationships:
  - source: "Adaptive Bitrate (ABR) Controller Component"
    destination: "DevOps Monitoring Stack"
    description: "Real-time RTT, packet loss, and bitrate metrics [Prometheus / HTTP]"
  - source: "Media Relay & Encryption Engine Component"
    destination: "GKE UDP NodePorts"
    description: "ICE/STUN/TURN media transport [DTLS-SRTP / AES-256]"
  - source: "Media Relay & Encryption Engine Component"
    destination: "Regional GCP Cloud Storage"
    description: "Optional clinical audit recordings [HTTPS / CMEK]"