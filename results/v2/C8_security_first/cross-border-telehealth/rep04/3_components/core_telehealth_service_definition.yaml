level: component
scope: "Component diagram for the Core Telehealth Service container"
parentContainer:
  name: "Core Telehealth Service"
elements:
  - type: "component"
    name: "Appointment Orchestrator Component"
    technology: "Temporal SDK"
    description: "Powers the appointment orchestrator for resilient, long-running workflow state management over unstable networks."
  - type: "component"
    name: "Jurisdiction & Consent Engine Component"
    technology: "Go"
    description: "Validates jurisdictional rules and consents for cross-border compliance."
  - type: "component"
    name: "Audit & Traceability Logger Component"
    technology: "Go / OpenTelemetry"
    description: "Logs and traces operations for regional compliance and observability."
  - type: "component"
    name: "Notification Dispatcher Component"
    technology: "Go / Cloud Pub/Sub"
    description: "Triggers fallback alerts and notifications."
  - type: "component"
    name: "Timezone & Localization Engine Component"
    technology: "Go package"
    description: "Resolves schedules, timezones, and localization requirements."
relationships:
  - source: "Appointment Orchestrator Component"
    destination: "Jurisdiction & Consent Engine Component"
    description: "Validates rules [In-memory / gRPC]"
  - source: "Appointment Orchestrator Component"
    destination: "Notification Dispatcher Component"
    description: "Triggers fallback alerts [gRPC / Cloud Pub/Sub]"
  - source: "Appointment Orchestrator Component"
    destination: "Timezone & Localization Engine Component"
    description: "Resolves schedules [In-memory Go package call]"