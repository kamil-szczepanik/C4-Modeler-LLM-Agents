level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Envoy Proxy"
    technology: "Envoy Proxy"
    description: "Handles edge routing, TLS termination, WAF protection, and internal routing to microservices."
  - type: "component"
    name: "Wasm/Lua Auth Filter"
    technology: "Wasm / Lua"
    description: "Provides in-memory synchronous validation, edge authentication, JWT validation, and dynamic consent enforcement."
  - type: "component"
    name: "Rate Limiter"
    technology: "Redis"
    description: "Performs fast edge-based rate limiting and quota checks to protect downstream AI services."
relationships:
  - source: "Envoy Proxy"
    destination: "Wasm/Lua Auth Filter"
    description: "In-memory synchronous validation [Function Call]"
  - source: "Envoy Proxy"
    destination: "Rate Limiter"
    description: "Quota checks [gRPC / Local Loopback]"