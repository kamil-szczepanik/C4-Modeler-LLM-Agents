level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides secure video consultations, e-prescriptions, and an AI symptom checker for patients across the EU and US while ensuring strict data residency and regulatory compliance."
elements:
  - type: "person"
    name: "Patients (EU/US)"
    description: "Patients located in the EU and US seeking secure video consultations, e-prescriptions, and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed medical professionals providing consultations and prescriptions to patients."
  - type: "person"
    name: "Regulatory Auditors"
    description: "Auditors reviewing system compliance, audit logs, and data handling practices."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways"
    description: "External national gateways for managing e-prescriptions across EU nations."
  - type: "externalSystem"
    name: "US Healthcare Networks/Pharmacies"
    description: "External US healthcare networks and pharmacies for prescription fulfillment and health data exchange."
  - type: "externalSystem"
    name: "Federated Identity Providers (IdP)"
    description: "External identity providers handling federated authentication via OAuth 2.0 / OIDC."
  - type: "externalSystem"
    name: "AI Model Providers"
    description: "External providers powering the AI symptom checker."
  - type: "externalSystem"
    name: "Regional API Gateways"
    description: "Regional API gateways managing application traffic and consent."
  - type: "externalSystem"
    name: "WebRTC/SFU Media Nodes"
    description: "Media nodes handling video consultations via WebRTC and DTLS-SRTP."
relationships:
  - source: "Patients (EU/US)"
    destination: "Cross-Border Telehealth Platform"
    description: "HTTPS / TLS 1.3 for application traffic, consent management, and video consultations"
    technology: "HTTPS / TLS 1.3, WebRTC"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "HTTPS / TLS 1.3 for application traffic, consent management, and video consultations"
    technology: "HTTPS / TLS 1.3, WebRTC"
  - source: "Cross-Border Telehealth Platform"
    destination: "EU National E-Prescription Gateways"
    description: "REST / SOAP APIs for national e-prescriptions"
    technology: "REST / SOAP APIs"
  - source: "Cross-Border Telehealth Platform"
    destination: "US Healthcare Networks/Pharmacies"
    description: "HL7 FHIR APIs over HTTPS"
    technology: "HL7 FHIR APIs over HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Federated Identity Providers (IdP)"
    description: "OAuth 2.0 / OIDC for federated authentication"
    technology: "OAuth 2.0 / OIDC"