level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients & Clinicians"
    description: "End-users accessing the platform via web and mobile frontends for secure video consultations, e-prescriptions, and AI symptom checking."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways"
    description: "External national gateways for managing e-prescriptions across EU nations."
  - type: "externalSystem"
    name: "US Healthcare Networks/Pharmacies"
    description: "External US healthcare networks and pharmacies for prescription fulfillment and health data exchange."
  - type: "container"
    name: "API Gateway"
    technology: "Envoy and Google Cloud Load Balancing"
    description: "Regional entry point acting as the reverse proxy and load balancer."
  - type: "container"
    name: "Core Telehealth Service"
    technology: "Node.js / Go container"
    description: "Manages appointments, clinician jurisdictions, and patient consent profiles."
  - type: "container"
    name: "E-Prescription Integration Service"
    technology: "Java / Spring Boot container"
    description: "Handles HL7 FHIR and EU national standard translations."
  - type: "container"
    name: "AI Symptom Checker Service"
    technology: "Python / FastAPI container"
    description: "Manages inference and WORM audit logging."
  - type: "container"
    name: "Media Streaming Container"
    technology: "Janus WebRTC SFU"
    description: "Handles adaptive video transcoding and DTLS-SRTP encryption."
relationships:
  - source: "Patients & Clinicians"
    destination: "API Gateway"
    description: "Secure client-to-container communication for application traffic and video consultations"
    technology: "HTTPS and WSS"
  - source: "API Gateway"
    destination: "Core Telehealth Service"
    description: "Internal routing and API requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "E-Prescription Integration Service"
    description: "Internal routing for e-prescriptions"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "AI Symptom Checker Service"
    description: "Internal routing for AI inference"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Media Streaming Container"
    description: "Media signaling and streaming"
    technology: "WSS / WebRTC"
  - source: "Core Telehealth Service"
    destination: "E-Prescription Integration Service"
    description: "Coordinates prescription workflows"
    technology: "gRPC over mTLS"
  - source: "Core Telehealth Service"
    destination: "AI Symptom Checker Service"
    description: "Requests symptom analysis"
    technology: "gRPC over mTLS"
  - source: "E-Prescription Integration Service"
    destination: "EU National E-Prescription Gateways"
    description: "Translates and submits e-prescriptions to EU national gateways"
    technology: "REST / SOAP APIs"
  - source: "E-Prescription Integration Service"
    destination: "US Healthcare Networks/Pharmacies"
    description: "Exchanges prescription data with US networks"
    technology: "HL7 FHIR APIs over HTTPS"