level: component
scope: "Component diagram for the Patient Intake Container container"
parentContainer:
  name: "Patient Intake Container"
elements:
  - type: "component"
    name: "Intake API Router"
    technology: "Python / FastAPI with Pydantic"
    description: "Routes intake requests and provides strict schema validation for intake payloads and FHIR compliance."
  - type: "component"
    name: "Patient Intake Service"
    technology: "Python business logic"
    description: "Manages patient admissions, demographic capture, and audit logging workflows."
  - type: "component"
    name: "Data Access Repository"
    technology: "SQLAlchemy / asyncpg"
    description: "Handles asynchronous relational database persistence."
  - type: "component"
    name: "Event Publisher"
    technology: "Redpanda Client"
    description: "Dispatches audit events and intake events."
  - type: "component"
    name: "Envoy / NGINX API Gateway"
    technology: "API Gateway"
    description: "Routes incoming requests to the Intake API Router over mTLS."
  - type: "component"
    name: "Primary Database"
    technology: "PostgreSQL with Citus"
    description: "Stores patient records and relational data."
  - type: "component"
    name: "Event Broker"
    technology: "Redpanda"
    description: "Publishes and brokers intake and audit events."
relationships:
  - source: "Envoy / NGINX API Gateway"
    destination: "Intake API Router"
    description: "Routes intake requests [HTTP/2 / gRPC over mTLS]"
  - source: "Intake API Router"
    destination: "Patient Intake Service"
    description: "Invokes workflow [In-memory / Python function call]"
  - source: "Patient Intake Service"
    destination: "Data Access Repository"
    description: "Persists patient records [Async TCP with envelope encryption]"
  - source: "Patient Intake Service"
    destination: "Event Publisher"
    description: "Dispatches audit events [Async TCP]"
  - source: "Data Access Repository"
    destination: "Primary Database"
    description: "Reads and writes data [Encrypted internal TCP]"
  - source: "Event Publisher"
    destination: "Event Broker"
    description: "Publishes intake events [Encrypted internal TCP]"