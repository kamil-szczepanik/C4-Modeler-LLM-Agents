level: component
scope: "Component diagram for the Integration & FHIR Mediator container"
parentContainer:
  name: "Integration & FHIR Mediator"
elements:
  - type: "component"
    name: "Inbound Gateway Component"
    technology: "Apache Camel K / Java"
    description: "Securely receives and authenticates inbound data exchanges from external clinical systems via HTTPS with mTLS and SMART-on-FHIR JWT tokens."
  - type: "component"
    name: "Transformation Engine Component"
    technology: "Apache Camel / HAPI FHIR Java Library"
    description: "Performs standardized parsing and schema validation of HL7 FHIR R4 resources."
  - type: "component"
    name: "Outbound Dispatcher Component"
    technology: "Apache Camel K Route"
    description: "Dispatches and routes standardized data payloads and publishes domain events."
  - type: "component"
    name: "Audit & Compliance Logger Component"
    technology: "Java / OpenTelemetry"
    description: "Ensures HIPAA/GDPR compliance by logging and streaming sanitized telemetry."
  - type: "component"
    name: "Secret & Credential Management Store"
    technology: "HashiCorp Vault via CSI Secrets Store"
    description: "Secures retrieval of external API keys and client certificates."
  - type: "component"
    name: "Event Broker"
    technology: "Redpanda"
    description: "High-performance event broker supporting Kafka-backed Dead Letter Queues (DLQ)."
  - type: "component"
    name: "Observability Stack"
    technology: "OpenTelemetry, Grafana Mimir/Tempo"
    description: "Collects and visualizes telemetry and logs."
relationships:
  - source: "Inbound Gateway Component"
    destination: "Transformation Engine Component"
    description: "Forwards payloads to"
  - source: "Outbound Dispatcher Component"
    destination: "Event Broker"
    description: "Publishes domain events to using Kafka protocol"
  - source: "Audit & Compliance Logger Component"
    destination: "Observability Stack"
    description: "Streams sanitized telemetry to via OpenTelemetry Protocol (OTLP)"
  - source: "Inbound Gateway Component"
    destination: "Secret & Credential Management Store"
    description: "Retrieves client certificates and API keys from"