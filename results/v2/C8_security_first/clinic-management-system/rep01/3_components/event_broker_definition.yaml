level: component
scope: "Component diagram for the Event Broker container"
parentContainer:
  name: "Event Broker"
elements:
  - type: "component"
    name: "Kafka API Frontend"
    technology: "Redpanda (C++ thread-per-core)"
    description: "Handles high-performance streaming and client connections using the Kafka API protocol."
  - type: "component"
    name: "Storage & Raft Consensus Engine"
    technology: "Raft Consensus Protocol with S3-compatible Tiered Storage"
    description: "Manages distributed consensus logs and long-term data retention across hybrid cloud infrastructure."
  - type: "component"
    name: "Schema Registry"
    technology: "Integrated Schema Registry"
    description: "Validates Apache Avro and JSON schemas for event data integrity."
  - type: "component"
    name: "Partition Manager"
    technology: "C++ Thread-per-Core Engine"
    description: "Manages stream partitions to ensure low-latency event processing for critical clinical workflows."
  - type: "component"
    name: "Tiered Storage Encryption Interceptor"
    technology: "AES-256 with AWS KMS/on-prem HSM"
    description: "Applies client-side envelope encryption and manages encryption-in-transit and at-rest for tiered storage."
  - type: "component"
    name: "GDPR Purge & Tombstone Controller"
    technology: "Custom Compliance Controller"
    description: "Ensures strict GDPR compliance by handling data purges and tombstone records for long-term retention."
relationships:
  - source: "Kafka API Frontend"
    destination: "Storage & Raft Consensus Engine"
    description: "Routes incoming event streams to the Raft consensus logs"
  - source: "Kafka API Frontend"
    destination: "Schema Registry"
    description: "Validates event payloads against Apache Avro/JSON schemas"
  - source: "Storage & Raft Consensus Engine"
    destination: "Tiered Storage Encryption Interceptor"
    description: "Encrypts data before offloading to S3-compatible tiered storage for 10-year retention"
  - source: "GDPR Purge & Tombstone Controller"
    destination: "Storage & Raft Consensus Engine"
    description: "Executes data purging and tombstone creation to satisfy GDPR mandates"