level: component
scope: "Component diagram for the Primary Database container"
parentContainer:
  name: "Primary Database"
elements:
  - type: "component"
    name: "Coordinator Node"
    technology: "PostgreSQL with Citus"
    description: "Manages metadata, query routing, and distributed transactions."
  - type: "component"
    name: "Worker Nodes (Shard Replicas)"
    technology: "Distributed PostgreSQL instances with synchronous replication"
    description: "Stores distributed shards with synchronous replication."
  - type: "component"
    name: "Connection Pooling Proxy (PgBouncer)"
    technology: "PgBouncer"
    description: "Handles connection spikes and query routing."
  - type: "component"
    name: "Analytical Read Replicas"
    technology: "Asynchronous PostgreSQL read replicas"
    description: "Handles read-only queries for billing and reporting."
relationships:
  - source: "Connection Pooling Proxy (PgBouncer)"
    destination: "Coordinator Node"
    description: "Queries and transactions [pgJDBC/libpq over mTLS]"
  - source: "Coordinator Node"
    destination: "Worker Nodes (Shard Replicas)"
    description: "Inter-node operations [PostgreSQL wire protocol over TLS]"
  - source: "Coordinator Node"
    destination: "Analytical Read Replicas"
    description: "Data replication [PostgreSQL streaming protocol over TLS]"