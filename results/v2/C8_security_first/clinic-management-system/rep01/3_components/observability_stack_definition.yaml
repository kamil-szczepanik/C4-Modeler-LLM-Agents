level: component
scope: "Component diagram for the Observability Stack container"
parentContainer:
  name: "Observability Stack"
elements:
  - type: "component"
    name: "OpenTelemetry Collector"
    technology: "OpenTelemetry"
    description: "Receives telemetry data from microservices and forwards metrics and traces."
  - type: "component"
    name: "Grafana Mimir"
    technology: "Grafana Mimir"
    description: "Stores and queries metrics data."
  - type: "component"
    name: "Grafana Tempo"
    technology: "Grafana Tempo"
    description: "Stores and queries distributed traces."
  - type: "component"
    name: "Falco"
    technology: "Falco"
    description: "Streams kernel-level security events to the SIEM sink."
  - type: "component"
    name: "Grafana UI"
    technology: "Grafana"
    description: "Provides end-to-end metrics, traces, and compliance reporting dashboards."
relationships:
  - source: "OpenTelemetry Collector"
    destination: "Grafana Mimir"
    description: "Forwards metrics via HTTP/RemoteWrite"
  - source: "OpenTelemetry Collector"
    destination: "Grafana Tempo"
    description: "Forwards traces via HTTP/RemoteWrite"
  - source: "Grafana UI"
    destination: "Grafana Mimir"
    description: "Queries metrics"
  - source: "Grafana UI"
    destination: "Grafana Tempo"
    description: "Queries traces"