# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Envoy / NGINX API Gateway container"
parentContainer:
  name: "Envoy / NGINX API Gateway"
elements:
  - type: "component"
    name: "Listener & TLS Termination Component"
    technology: "Envoy / TLS 1.3"
    description: "Terminates incoming HTTPS traffic and enforces forward-secrecy cipher suites."
  - type: "component"
    name: "Authentication Filter Component"
    technology: "Envoy / OAuth 2.0 / OIDC"
    description: "Validates authentication tokens against the Identity Provider."
  - type: "component"
    name: "Rate Limiting & WAF Filter Component"
    technology: "Envoy Filter"
    description: "Protects platform workflows against abuse and ensures strict compliance."
  - type: "component"
    name: "Routing & Load Balancing Component"
    technology: "Envoy Router / gRPC"
    description: "Routes validated traffic to internal containers over mTLS."
  - type: "component"
    name: "Telemetry & Tracing Export Component"
    technology: "OpenTelemetry / gRPC"
    description: "Exports telemetry and access logs to the Observability Stack."
relationships:
  - source: "Listener & TLS Termination Component"
    destination: "Authentication Filter Component"
    description: "Passes decrypted requests for token validation [HTTPS / mTLS]"
  - source: "Authentication Filter Component"
    destination: "Rate Limiting & WAF Filter Component"
    description: "Forwards authenticated traffic for security policy enforcement"
  - source: "Rate Limiting & WAF Filter Component"
    destination: "Routing & Load Balancing Component"
    description: "Passes cleared traffic for internal routing"
  - source: "Routing & Load Balancing Component"
    destination: "Telemetry & Tracing Export Component"
    description: "Triggers telemetry collection during request routing"