level: component
scope: "Component diagram for the EMR Workspace Container container"
parentContainer:
  name: "EMR Workspace Container"
elements:
  - type: "component"
    name: "gRPC API Handler"
    technology: "Go / gRPC"
    description: "Routes incoming requests and handles gRPC communication for the EMR workspace."
  - type: "component"
    name: "EMR Business Logic Engine"
    technology: "Go"
    description: "Executes core business rules and workflow logic for electronic medical records."
  - type: "component"
    name: "PHI Crypto Middleware"
    technology: "Tink Crypto Library & Cloud KMS"
    description: "Applies application-layer AES-256 column-level encryption and envelope encryption for PHI data."
  - type: "component"
    name: "Distributed L2 Cache"
    technology: "Redis Enterprise"
    description: "Caches hot session state supporting active-active geo-replication."
  - type: "component"
    name: "Audit & Event Emitter"
    technology: "Go / Redpanda Client"
    description: "Publishes EMR events and immutable audit logs to the event broker."
relationships:
  - source: "EMR Business Logic Engine"
    destination: "Distributed L2 Cache"
    description: "Reads/writes hot session state [RESP over TLS]"
  - source: "PHI Crypto Middleware"
    destination: "Cloud KMS / HSM"
    description: "Fetches data encryption keys [gRPC over mTLS]"