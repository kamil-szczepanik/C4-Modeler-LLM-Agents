level: component
scope: "Component diagram for the Scheduling Engine Container container"
parentContainer:
  name: "Scheduling Engine Container"
elements:
  - type: "component"
    name: "Booking API Controller"
    technology: "Java / Spring Boot"
    description: "Manages appointment bookings and routes incoming requests."
  - type: "component"
    name: "Conflict Resolution Service"
    technology: "Java / Spring Boot"
    description: "Resolves scheduling conflicts and consumes cancellation events for waitlist backfilling."
  - type: "component"
    name: "Calendar & Slot Manager"
    technology: "Java / Spring Boot"
    description: "Manages clinician calendars and available slots."
  - type: "component"
    name: "Resource Allocation Coordinator"
    technology: "Java / Spring Boot"
    description: "Optimizes and coordinates resource allocation with atomic multi-resource locking."
  - type: "component"
    name: "Notification Publisher"
    technology: "Java / Spring Boot"
    description: "Publishes encrypted domain events related to scheduling notifications."
  - type: "component"
    name: "Envoy / NGINX API Gateway"
    technology: "Envoy / NGINX"
    description: "Routes HTTP/2 and gRPC requests over mTLS."
  - type: "component"
    name: "Primary Database"
    technology: "PostgreSQL with Citus"
    description: "Relational data storage supporting horizontal scaling and secure data persistence."
  - type: "component"
    name: "Event Broker"
    technology: "Redpanda"
    description: "Event streaming platform enabling reliable, asynchronous domain event publishing."
  - type: "component"
    name: "Observability Stack"
    technology: "OpenTelemetry, Grafana Mimir/Tempo, Falco"
    description: "Ensures distributed tracing, custom metrics tracking, and compliance monitoring."
relationships:
  - source: "Envoy / NGINX API Gateway"
    destination: "Booking API Controller"
    description: "Routes HTTP/2 and gRPC requests over mTLS"
  - source: "Booking API Controller"
    destination: "Primary Database"
    description: "Executes transactional reads and writes over encrypted internal TCP"
  - source: "Notification Publisher"
    destination: "Event Broker"
    description: "Publishes encrypted domain events using Kafka/Redpanda Spring Boot starter over encrypted internal TCP"
  - source: "Conflict Resolution Service"
    destination: "Event Broker"
    description: "Consumes cancellation events for waitlist backfilling over encrypted internal TCP"
  - source: "Resource Allocation Coordinator"
    destination: "Primary Database"
    description: "Manages atomic multi-resource locking using database-level advisory locks over encrypted internal TCP"