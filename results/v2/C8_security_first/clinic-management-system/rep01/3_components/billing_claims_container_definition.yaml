level: component
scope: "Component diagram for the Billing & Claims Container container"
parentContainer:
  name: "Billing & Claims Container"
elements:
  - type: "component"
    name: "API Controller"
    technology: "Node.js / TypeScript"
    description: "Handles incoming routing and API requests for billing and claims."
  - type: "component"
    name: "Claims & Invoicing Engine"
    technology: "Node.js / TypeScript"
    description: "Manages the creation and processing of claims and invoices."
  - type: "component"
    name: "Denial & Exception Handler"
    technology: "Node.js / TypeScript"
    description: "Handles claim denials and execution exceptions."
  - type: "component"
    name: "Payment & Clearinghouse Adapter"
    technology: "Node.js / TypeScript"
    description: "Integrates with external payment gateways and insurance clearinghouses."
  - type: "component"
    name: "Outbox Processor"
    technology: "Node.js / TypeScript"
    description: "Guarantees transactional integrity by publishing events reliably."
  - type: "component"
    name: "Fee Estimation Service"
    technology: "Node.js / TypeScript"
    description: "Provides real-time fee estimations for clinical workflows."
  - type: "component"
    name: "Audit & Event Publisher"
    technology: "Node.js / TypeScript"
    description: "Publishes audit logs and domain events to the event broker."
  - type: "component"
    name: "Data Access Layer"
    technology: "Node.js / TypeScript"
    description: "Interacts securely with the primary database for persistence."
relationships:
  - source: "API Controller"
    destination: "Claims & Invoicing Engine"
    description: "Delegates billing workflows"
  - source: "Claims & Invoicing Engine"
    destination: "Outbox Processor"
    description: "Saves events for reliable publishing"
  - source: "Claims & Invoicing Engine"
    destination: "Data Access Layer"
    description: "Queries and updates financial records"
  - source: "Denial & Exception Handler"
    destination: "Outbox Processor"
    description: "Publishes denial events"
  - source: "Payment & Clearinghouse Adapter"
    destination: "Claims & Invoicing Engine"
    description: "Updates payment statuses"
  - source: "Fee Estimation Service"
    destination: "Data Access Layer"
    description: "Fetches pricing data"
  - source: "Outbox Processor"
    destination: "Audit & Event Publisher"
    description: "Dispatches domain events"
  - source: "Audit & Event Publisher"
    destination: "Data Access Layer"
    description: "Persists audit logs"