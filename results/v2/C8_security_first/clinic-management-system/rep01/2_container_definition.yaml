level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Clinic Receptionist / Admin"
    description: "Manages patient admissions, scheduling, and front-desk workflows."
  - type: "person"
    name: "Clinician (Doctor / Nurse)"
    description: "Accesses and updates electronic medical records (EMR) and clinical workflows."
  - type: "person"
    name: "Billing Specialist"
    description: "Handles billing, payments, and financial interactions."
  - type: "person"
    name: "Patient"
    description: "Interacts with the clinic for appointments, care, and billing."
  - type: "person"
    name: "Hospital / Clinic Administrator"
    description: "Oversees system administration and clinic operations."
  - type: "person"
    name: "External Auditors / Compliance Officers"
    description: "Reviews system logs and compliance data for regulatory standards."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "Provides laboratory results and medical imaging data."
  - type: "externalSystem"
    name: "Insurance Claim Processors / Payment Gateways"
    description: "Processes insurance claims and electronic payments."
  - type: "externalSystem"
    name: "Identity Provider (IdP) with local on-premise cache proxy"
    description: "Handles authentication, authorization, and token caching."
  - type: "container"
    name: "Envoy / NGINX API Gateway"
    description: "Acts as the primary entry point, terminating TLS and routing incoming client requests."
    technology: "Envoy / NGINX"
  - type: "container"
    name: "Patient Intake Container"
    description: "Handles patient registration and intake workflows."
    technology: "Python / FastAPI"
  - type: "container"
    name: "Scheduling Engine Container"
    description: "Manages appointment bookings, calendars, and scheduling logic."
    technology: "Java / Spring Boot"
  - type: "container"
    name: "EMR Workspace Container"
    description: "Manages electronic medical records with high performance and sub-second loads."
    technology: "Go / gRPC"
  - type: "container"
    name: "Billing & Claims Container"
    description: "Processes billing, invoices, and insurance claims."
    technology: "Node.js / TypeScript"
  - type: "container"
    name: "Integration & FHIR Mediator"
    description: "Mediates and standardizes data exchange using HL7 FHIR APIs."
    technology: "Apache Camel K / Java"
  - type: "container"
    name: "Primary Database"
    description: "Stores core relational and distributed operational data."
    technology: "PostgreSQL with Citus"
  - type: "container"
    name: "Event Broker"
    description: "Handles asynchronous event streaming across microservices."
    technology: "Redpanda"
  - type: "container"
    name: "Observability Stack"
    description: "Provides monitoring, metrics, tracing, and runtime security."
    technology: "OpenTelemetry, Grafana Mimir/Tempo, Falco"
relationships:
  - source: "Clinic Receptionist / Admin"
    destination: "Envoy / NGINX API Gateway"
    description: "Manages admissions and scheduling"
    technology: "HTTPS / TLS 1.3"
  - source: "Clinician (Doctor / Nurse)"
    destination: "Envoy / NGINX API Gateway"
    description: "Accesses and updates EMR and clinical workflows"
    technology: "HTTPS / TLS 1.3"
  - source: "Billing Specialist"
    destination: "Envoy / NGINX API Gateway"
    description: "Manages billing and financial processes"
    technology: "HTTPS / TLS 1.3"
  - source: "Patient"
    destination: "Envoy / NGINX API Gateway"
    description: "Views appointments and health records"
    technology: "HTTPS / TLS 1.3"
  - source: "Hospital / Clinic Administrator"
    destination: "Envoy / NGINX API Gateway"
    description: "Administers platform operations"
    technology: "HTTPS / TLS 1.3"
  - source: "External Auditors / Compliance Officers"
    destination: "Envoy / NGINX API Gateway"
    description: "Audits compliance and logs"
    technology: "HTTPS / TLS 1.3"
  - source: "Envoy / NGINX API Gateway"
    destination: "Patient Intake Container"
    description: "Routes intake requests"
    technology: "HTTP/2 / gRPC over mTLS"
  - source: "Envoy / NGINX API Gateway"
    destination: "Scheduling Engine Container"
    description: "Routes scheduling requests"
    technology: "HTTP/2 / gRPC over mTLS"
  - source: "Envoy / NGINX API Gateway"
    destination: "EMR Workspace Container"
    description: "Routes EMR requests"
    technology: "HTTP/2 / gRPC over mTLS"
  - source: "Envoy / NGINX API Gateway"
    destination: "Billing & Claims Container"
    description: "Routes billing requests"
    technology: "HTTP/2 / gRPC over mTLS"
  - source: "Patient Intake Container"
    destination: "Primary Database"
    description: "Reads and writes patient intake data"
    technology: "Encrypted internal TCP"
  - source: "Scheduling Engine Container"
    destination: "Primary Database"
    description: "Reads and writes appointment data"
    technology: "Encrypted internal TCP"
  - source: "EMR Workspace Container"
    destination: "Primary Database"
    description: "Reads and writes EMR data"
    technology: "Encrypted internal TCP"
  - source: "Billing & Claims Container"
    destination: "Primary Database"
    description: "Reads and writes billing data"
    technology: "Encrypted internal TCP"
  - source: "Patient Intake Container"
    destination: "Redpanda"
    description: "Publishes intake events"
    technology: "Encrypted internal TCP"
  - source: "Scheduling Engine Container"
    destination: "Redpanda"
    description: "Publishes scheduling events"
    technology: "Encrypted internal TCP"
  - source: "EMR Workspace Container"
    destination: "Redpanda"
    description: "Publishes EMR events"
    technology: "Encrypted internal TCP"
  - source: "Billing & Claims Container"
    destination: "Redpanda"
    description: "Publishes billing events"
    technology: "Encrypted internal TCP"
  - source: "EMR Workspace Container"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges lab and imaging data"
    technology: "HL7 FHIR APIs over HTTPS"
  - source: "Billing & Claims Container"
    destination: "Insurance Claim Processors / Payment Gateways"
    description: "Submits insurance claims and processes payments"
    technology: "HTTPS"
  - source: "Envoy / NGINX API Gateway"
    destination: "Identity Provider (IdP) with local on-premise cache proxy"
    description: "Validates authentication and tokens"
    technology: "OAuth 2.0/OIDC"