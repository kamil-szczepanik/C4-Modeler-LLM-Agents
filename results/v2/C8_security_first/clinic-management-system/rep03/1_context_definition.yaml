level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed for medium-sized hospitals and clinics to securely manage patient admissions, electronic medical records (EMR), scheduling, and billing while ensuring high availability, strict compliance, and uninterrupted clinical workflows."
elements:
  - type: "person"
    name: "Receptionists"
    description: "Manages patient admissions and front-desk scheduling."
  - type: "person"
    name: "Clinicians"
    description: "Doctors and nurses who access and update electronic medical records (EMR) and clinical workflows."
  - type: "person"
    name: "Billing Officers"
    description: "Manages patient billing, claims, and financial transactions."
  - type: "person"
    name: "Patients"
    description: "End users who interact with the system for scheduling and personal health records."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing laboratory results and medical imaging data."
  - type: "externalSystem"
    name: "Third-Party Payment Gateway & Insurance Clearinghouses"
    description: "External financial and insurance systems for processing payments and claims."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Handles identity federation, authentication, and OAuth 2.0 / OIDC services."
  - type: "container"
    name: "API Gateway"
    description: "Envoy or Kong container for token validation, rate limiting, and circuit breaking."
  - type: "container"
    name: "Clinical & EMR Core Service"
    description: "Backend service built on Java/Spring Boot or Go for managing core clinical records."
  - type: "container"
    name: "Sync & Store-and-Forward Worker"
    description: "Handles local caching and bi-directional replication for offline clinical survivability."
  - type: "container"
    name: "Billing & Claims Service"
    description: "Manages financial processing and insurance claims."
  - type: "container"
    name: "Audit Sidecar"
    description: "Ensures immutable audit logging for HIPAA and GDPR compliance."
relationships:
  - source: "Receptionists"
    destination: "API Gateway"
    description: "Interacts with the system via adaptive Multi-Factor Authentication"
    technology: "HTTPS, OAuth 2.0, OpenID Connect"
  - source: "Clinicians"
    destination: "API Gateway"
    description: "Accesses EMR and clinical workflows securely"
    technology: "HTTPS, OAuth 2.0, OpenID Connect"
  - source: "Billing Officers"
    destination: "API Gateway"
    description: "Manages billing and claims operations"
    technology: "HTTPS, OAuth 2.0, OpenID Connect"
  - source: "Patients"
    destination: "API Gateway"
    description: "Interacts for scheduling and personal records"
    technology: "HTTPS, OAuth 2.0, OpenID Connect"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Integrates for lab and imaging data exchange"
    technology: "HL7 FHIR REST APIs over HTTPS with mTLS"
  - source: "Clinic Management System"
    destination: "Third-Party Payment Gateway & Insurance Clearinghouses"
    description: "Integrates for payment and insurance claims processing"
    technology: "REST/SOAP APIs over TLS 1.3"
  - source: "On-Premise Nodes"
    destination: "Cloud (eu-central-1)"
    description: "Synchronizes via secure bi-directional replication with store-and-forward local caching"
    technology: "TLS 1.3"