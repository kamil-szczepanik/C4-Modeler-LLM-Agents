level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Receptionists"
    description: "Manages patient admissions and front-desk scheduling."
  - type: "person"
    name: "Clinicians"
    description: "Doctors and nurses who access and update electronic medical records (EMR) and clinical workflows."
  - type: "person"
    name: "Billing Officers"
    description: "Manages patient billing, claims, and financial transactions."
  - type: "person"
    name: "Patients"
    description: "End users who interact with the system for scheduling and personal health records."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing laboratory results and medical imaging data."
  - type: "externalSystem"
    name: "Third-Party Payment Gateway & Insurance Clearinghouses"
    description: "External financial and insurance systems for processing payments and claims."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Handles identity federation, authentication, and OAuth 2.0 / OIDC services."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / Nginx"
    description: "Edge routing, WAF, rate-limiting, and JWT validation."
  - type: "container"
    name: "Patient-Facing UI"
    technology: "React / Next.js"
    description: "User interface for patients to access the portal and personal health records."
  - type: "container"
    name: "Patient Portal"
    technology: "Web"
    description: "Portal interface enabling patient interactions."
  - type: "container"
    name: "Clinical Core Services"
    technology: "Spring Boot / Java"
    description: "Manages core clinical records and EMR workflows."
  - type: "container"
    name: "Interoperability Service"
    technology: "Apache Camel / Node.js"
    description: "Connects to external Lab & Imaging systems via HL7 FHIR REST APIs."
  - type: "container"
    name: "Billing & Claims Service"
    technology: "Spring Boot / Java"
    description: "Manages patient billing, insurance claims, and financial workflows."
relationships:
  - source: "Patients"
    destination: "API Gateway"
    description: "Accesses the system via HTTPS/TLS through the API Gateway validating JWTs"
    technology: "HTTPS/TLS, JWT"
  - source: "Receptionists"
    destination: "API Gateway"
    description: "Accesses the system via HTTPS/TLS through the API Gateway validating JWTs"
    technology: "HTTPS/TLS, JWT"
  - source: "Clinicians"
    destination: "API Gateway"
    description: "Accesses the system via HTTPS/TLS through the API Gateway validating JWTs"
    technology: "HTTPS/TLS, JWT"
  - source: "Billing Officers"
    destination: "API Gateway"
    description: "Accesses the system via HTTPS/TLS through the API Gateway validating JWTs"
    technology: "HTTPS/TLS, JWT"
  - source: "Patient-Facing UI"
    destination: "API Gateway"
    description: "Communicates with backend containers via OAuth2 authorization code flow with PKCE"
    technology: "OAuth2, PKCE"
  - source: "Clinical Core Services"
    destination: "Billing & Claims Service"
    description: "Communicates internally using gRPC over mTLS"
    technology: "gRPC, mTLS"
  - source: "Clinical Core Services"
    destination: "Interoperability Service"
    description: "Communicates internally using gRPC over mTLS"
    technology: "gRPC, mTLS"
  - source: "Billing & Claims Service"
    destination: "Interoperability Service"
    description: "Communicates internally using gRPC over mTLS"
    technology: "gRPC, mTLS"
  - source: "Interoperability Service"
    destination: "External Lab & Imaging Systems"
    description: "Connects to external Lab & Imaging systems using mTLS and SMART-on-FHIR scopes"
    technology: "HL7 FHIR REST APIs, mTLS, SMART-on-FHIR"
  - source: "Billing & Claims Service"
    destination: "Third-Party Payment Gateway & Insurance Clearinghouses"
    description: "Interacts asynchronously via message queues"
    technology: "RabbitMQ / Kafka"