level: component
scope: "Component diagram for the Patient-Facing UI container"
parentContainer:
  name: "Patient-Facing UI"
elements:
  - type: "component"
    name: "Patient-Facing UI Container"
    technology: "React / Next.js"
    description: "Mobile-first responsive UI container providing WCAG 2.1 AA accessibility."
  - type: "component"
    name: "Next.js BFF Server"
    technology: "Node.js API Routes"
    description: "Backend-for-Frontend server handling API proxies, token abstraction, and encrypted HTTP-only cookies."
  - type: "component"
    name: "Client-Side SPA Shell"
    technology: "React"
    description: "Client-side Single Page Application shell for patient interactions."
  - type: "component"
    name: "Appointment, EMR & Billing Viewer, and Self-Service Onboarding Modules"
    technology: "React / Next.js"
    description: "Functional modules for viewing appointments, EMR, billing, and self-service onboarding."
  - type: "component"
    name: "State Management & Session Guard Utility"
    technology: "JavaScript / TypeScript"
    description: "Manages application state and guards user sessions securely."
  - type: "component"
    name: "API Gateway"
    technology: "Kong / Nginx"
    description: "Proxies API requests and manages ingress traffic."
  - type: "component"
    name: "Identity Provider"
    technology: "OpenID Connect"
    description: "Handles user authentication and redirects for identity verification."
relationships:
  - source: "Client-Side SPA Shell"
    destination: "Next.js BFF Server"
    description: "Internal AJAX/Fetch [HTTPS, REST/JSON]"
  - source: "Next.js BFF Server"
    destination: "API Gateway"
    description: "Proxies API requests [HTTPS, REST/JSON]"
  - source: "Client-Side SPA Shell"
    destination: "Identity Provider"
    description: "Redirects for authentication [OpenID Connect]"