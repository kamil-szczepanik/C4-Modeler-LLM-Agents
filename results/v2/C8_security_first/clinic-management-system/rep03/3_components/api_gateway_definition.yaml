level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Router & Reverse Proxy"
    technology: "Kong Enterprise / Nginx core"
    description: "Handles edge routing and reverse proxying for incoming traffic."
  - type: "component"
    name: "Security & Auth Plugin Module"
    technology: "Kong Plugin / JWT"
    description: "Performs JWT validation and enforces authentication."
  - type: "component"
    name: "WAF & Rate Limiting Engine"
    technology: "Kong WAF / Redis"
    description: "Provides web application firewall protection and distributed rate limiting."
  - type: "component"
    name: "FHIR Mediator Route"
    technology: "Kong Gateway Route"
    description: "Routes and mediates HL7 FHIR API traffic."
  - type: "component"
    name: "Policy Enforcement Hook"
    technology: "Kong Enterprise"
    description: "Enforces security policies and compliance rules."
  - type: "component"
    name: "Telemetry & Audit Forwarder"
    technology: "OpenTelemetry / HTTPS"
    description: "Streams sanitized OpenTelemetry traces and tamper-evident audit logs."
relationships:
  - source: "Edge Router & Reverse Proxy"
    destination: "Security & Auth Plugin Module"
    description: "Passes requests for JWT validation"
  - source: "Security & Auth Plugin Module"
    destination: "WAF & Rate Limiting Engine"
    description: "Forwards authenticated requests for rate limiting and WAF check"
  - source: "WAF & Rate Limiting Engine"
    destination: "Policy Enforcement Hook"
    description: "Checks policies before routing"
  - source: "Policy Enforcement Hook"
    destination: "FHIR Mediator Route"
    description: "Routes valid traffic to backend services"
  - source: "Telemetry & Audit Forwarder"
    destination: "SIEM/Observability Platform"
    description: "Streams telemetry and audit logs asynchronously [OpenTelemetry, HTTPS]"