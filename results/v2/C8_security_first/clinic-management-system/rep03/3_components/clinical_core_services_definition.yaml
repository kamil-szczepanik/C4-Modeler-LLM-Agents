level: component
scope: "Component diagram for the Clinical Core Services container"
parentContainer:
  name: "Clinical Core Services"
elements:
  - type: "component"
    name: "EMR Engine"
    technology: "Spring Boot / Java"
    description: "Manages electronic medical records, patient data storage, and sub-second clinical data access."
  - type: "component"
    name: "Scheduling Engine"
    technology: "Spring Boot / Java"
    description: "Handles patient appointments, calendars, and resource scheduling for healthcare facilities."
  - type: "component"
    name: "Authorization Interceptor"
    technology: "Spring Boot / Java"
    description: "Enforces role-based and attribute-based access control (RBAC/ABAC) and security policies."
  - type: "component"
    name: "Audit Logger"
    technology: "Spring Boot / Java"
    description: "Provides WORM (Write Once, Read Many) audit logging for regulatory compliance like HIPAA and GDPR."
  - type: "component"
    name: "Event Dispatcher"
    technology: "Spring Boot / Java"
    description: "Dispatches domain events across services and integrates with external communication layers."
relationships:
  - source: "Authorization Interceptor"
    destination: "EMR Engine"
    description: "Validates access before processing EMR read/write requests"
  - source: "Authorization Interceptor"
    destination: "Scheduling Engine"
    description: "Validates access before scheduling operations"
  - source: "EMR Engine"
    destination: "Audit Logger"
    description: "Logs access and modifications to medical records"
  - source: "Scheduling Engine"
    destination: "Audit Logger"
    description: "Logs scheduling transactions and access events"
  - source: "EMR Engine"
    destination: "Event Dispatcher"
    description: "Publishes EMR-related domain events"