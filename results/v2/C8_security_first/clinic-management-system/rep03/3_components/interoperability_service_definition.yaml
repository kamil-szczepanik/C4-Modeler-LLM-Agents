level: component
scope: "Component diagram for the Interoperability Service container"
parentContainer:
  name: "Interoperability Service"
elements:
  - type: "component"
    name: "Route Orchestrator"
    technology: "Apache Camel / Node.js"
    description: "Orchestrates enterprise integration patterns and routing for interoperability messages."
  - type: "component"
    name: "FHIR Transformer & Validator"
    technology: "Apache Camel / Node.js"
    description: "Transforms and validates clinical data to ensure adherence to HL7 FHIR standards."
  - type: "component"
    name: "Outbound Security & Auth Agent"
    technology: "HashiCorp Vault / OAuth2"
    description: "Secures outbound requests and manages OAuth2 client credentials and runtime API keys."
  - type: "component"
    name: "Resiliency & DLQ Handler"
    technology: "RabbitMQ / Kafka"
    description: "Powers the Dead-Letter Queue (DLQ) for resilient failure handling and message retries."
  - type: "component"
    name: "Idempotency Store"
    technology: "Redis"
    description: "Provides fast-lookup caching ensuring request idempotency via unique accession numbers."
  - type: "component"
    name: "Operational Metrics Exporter"
    technology: "OpenTelemetry & Prometheus"
    description: "Delivers distributed tracing, metrics scraping, and alerting for the service."
relationships:
  - source: "Route Orchestrator"
    destination: "Idempotency Store"
    description: "Cache lookup [Redis RESP, TLS]"
  - source: "Operational Metrics Exporter"
    destination: "Monitoring Stack"
    description: "Metrics scraping [Prometheus, HTTP]"