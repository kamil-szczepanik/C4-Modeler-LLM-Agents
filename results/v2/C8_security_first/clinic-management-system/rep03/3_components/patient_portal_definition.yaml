level: component
scope: "Component diagram for the Patient Portal container"
parentContainer:
  name: "Patient Portal"
elements:
  - type: "component"
    name: "Patient-Facing UI"
    technology: "Node.js / TypeScript"
    description: "End-user interface allowing patients to access self-service health management features."
  - type: "component"
    name: "Patient Auth Delegator"
    technology: "Node.js / TypeScript, OIDC/OAuth 2.1, httpOnly JWT"
    description: "Component handling OIDC/OAuth 2.1 authentication, adaptive MFA, and httpOnly JWT session management."
  - type: "component"
    name: "Appointment & Scheduling Facade"
    technology: "Node.js / TypeScript, gRPC"
    description: "Component managing patient appointment rescheduling and real-time slot validation."
  - type: "component"
    name: "Record Retrieval Component"
    technology: "Node.js / TypeScript, REST/JSON"
    description: "Component fetching EMR subsets with server-side tenant isolation and IDOR checks."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Node.js / TypeScript, Socket.io, WebSockets"
    description: "Component pushing real-time appointment reminders and alerts."
  - type: "component"
    name: "External Identity Provider (IdP)"
    technology: "OIDC / OAuth 2.1"
    description: "Manages primary user authentication credentials."
  - type: "component"
    name: "Clinical Core Services"
    technology: "Backend Infrastructure, gRPC"
    description: "Downstream backend infrastructure handling core clinic operations."
relationships:
  - source: "Patients"
    destination: "Patient-Facing UI"
    description: "Interacts via TLS 1.3"
  - source: "Patient Auth Delegator"
    destination: "External Identity Provider (IdP)"
    description: "Communicates using OpenID Connect (OIDC) / OAuth 2.1"
  - source: "Appointment & Scheduling Facade"
    destination: "Clinical Core Services"
    description: "Connects via gRPC over mTLS"
  - source: "Record Retrieval Component"
    destination: "Clinical Core Services"
    description: "Queries EMR data via REST/JSON"
  - source: "Notification Dispatcher"
    destination: "Patient-Facing UI"
    description: "Pushes alerts via WebSockets (TLS 1.3)"