level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid healthcare platform that manages patient admissions, electronic medical records, scheduling, and billing for medium-sized hospitals, ensuring HIPAA and GDPR compliance with high availability."
elements:
  - type: "person"
    name: "Patients"
    description: "Patients interacting with the clinic system for appointments, records, and billing."
  - type: "person"
    name: "Clinical Staff"
    description: "Doctors and Nurses managing patient admissions and electronic medical records."
  - type: "person"
    name: "Administrative & Billing Staff"
    description: "Staff managing hospital administration, scheduling, and billing operations."
  - type: "person"
    name: "Hospital IT / Compliance Officers"
    description: "Personnel overseeing system compliance, security, and infrastructure."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External IdP handling authentication and authorization."
  - type: "externalSystem"
    name: "Third-Party Payment Gateway"
    description: "External system processing financial transactions and billing."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External clinical systems providing lab results and medical imaging."
relationships:
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Interacts for appointments, medical records, and billing"
    technology: "HTTPS / TLS 1.3 with mandatory MFA"
  - source: "Clinical Staff"
    destination: "Clinic Management System"
    description: "Manages patient admissions and electronic medical records"
    technology: "HTTPS / TLS 1.3 with mandatory MFA"
  - source: "Administrative & Billing Staff"
    destination: "Clinic Management System"
    description: "Handles scheduling and billing operations"
    technology: "HTTPS / TLS 1.3 with mandatory MFA"
  - source: "Hospital IT / Compliance Officers"
    destination: "Clinic Management System"
    description: "Monitors system compliance and configuration"
    technology: "HTTPS / TLS 1.3 with mandatory MFA"
  - source: "Clinic Management System"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OIDC / SAML"
  - source: "Clinic Management System"
    destination: "Third-Party Payment Gateway"
    description: "Processes payments and financial transactions"
    technology: "HTTPS / REST"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges lab results and imaging data"
    technology: "HL7 FHIR APIs (HTTPS / REST over mTLS)"