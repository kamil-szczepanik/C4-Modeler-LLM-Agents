level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients interacting with the clinic system for appointments, records, and billing."
  - type: "person"
    name: "Clinical Staff"
    description: "Doctors and Nurses managing patient admissions and electronic medical records."
  - type: "person"
    name: "Administrative & Billing Staff"
    description: "Staff managing hospital administration, scheduling, and billing operations."
  - type: "person"
    name: "Hospital IT / Compliance Officers"
    description: "Personnel overseeing system compliance, security, and infrastructure."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External IdP handling authentication and authorization."
  - type: "externalSystem"
    name: "Third-Party Payment Gateway"
    description: "External system processing financial transactions and billing."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External clinical systems providing lab results and medical imaging."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / Envoy / Istio"
    description: "Perimeter security, rate-limiting, routing, and mTLS internal traffic security."
  - type: "container"
    name: "EMR & Scheduling Service"
    technology: "Java Spring Boot / Node.js NestJS"
    description: "Microservice handling patient admissions, EMRs, and appointment scheduling."
  - type: "container"
    name: "Billing & Claims Service"
    technology: "Java Spring Boot"
    description: "Microservice handling financial transactions, billing, and insurance claims."
  - type: "container"
    name: "Integration Engine"
    technology: "HAPI FHIR"
    description: "Integration engine for standardized healthcare interoperability with external systems."
  - type: "container"
    name: "Data Tier"
    technology: "PostgreSQL"
    description: "Primary database with row-level security and asynchronous replication."
  - type: "container"
    name: "Event Broker"
    technology: "Apache Kafka"
    description: "Event broker for decoupled, resilient asynchronous messaging."
relationships:
  - source: "Patients"
    destination: "API Gateway"
    description: "Accesses patient portal, appointments, and records"
    technology: "HTTPS (TLS 1.3)"
  - source: "Clinical Staff"
    destination: "API Gateway"
    description: "Manages patient admissions and EMRs"
    technology: "HTTPS (TLS 1.3)"
  - source: "Administrative & Billing Staff"
    destination: "API Gateway"
    description: "Handles scheduling and billing operations"
    technology: "HTTPS (TLS 1.3)"
  - source: "Hospital IT / Compliance Officers"
    destination: "API Gateway"
    description: "Monitors system compliance, security, and configuration"
    technology: "HTTPS (TLS 1.3)"
  - source: "API Gateway"
    destination: "EMR & Scheduling Service"
    description: "Routes client requests to EMR backend"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Billing & Claims Service"
    description: "Routes client requests to Billing backend"
    technology: "gRPC over mTLS"
  - source: "EMR & Scheduling Service"
    destination: "Data Tier"
    description: "Reads and writes EMR and scheduling data"
    technology: "TCP/SQL with read/write segregation"
  - source: "Billing & Claims Service"
    destination: "Data Tier"
    description: "Reads and writes billing data"
    technology: "TCP/SQL"
  - source: "Billing & Claims Service"
    destination: "Third-Party Payment Gateway"
    description: "Processes payments and financial claims"
    technology: "HTTPS"
  - source: "Billing & Claims Service"
    destination: "Event Broker"
    description: "Publishes asynchronous financial events"
    technology: "Apache Kafka"
  - source: "Integration Engine"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges lab results and medical imaging"
    technology: "HL7 FHIR APIs"
  - source: "EMR & Scheduling Service"
    destination: "Integration Engine"
    description: "Integrates clinical data and external results"
    technology: "Internal API / HL7 FHIR"