level: component
scope: "Component diagram for the Data Tier container"
parentContainer:
  name: "Data Tier"
elements:
  - type: "component"
    name: "Primary Write Instance"
    technology: "PostgreSQL Cluster"
    description: "Primary PostgreSQL instance handling write operations for patient records, scheduling, and billing."
  - type: "component"
    name: "Read Replica Instances"
    technology: "PostgreSQL (Local Synchronous & Cross-Region Read Replicas)"
    description: "Provides read-only access to data with session consistency."
  - type: "component"
    name: "PgBouncer Connection Pooler"
    technology: "PgBouncer"
    description: "Manages and pools database connections to handle high concurrency and prevent saturation."
  - type: "component"
    name: "PostgreSQL Audit Log Collector"
    technology: "pgAudit Extension"
    description: "Collects native, tamper-evident data access logs for comprehensive compliance auditing."
  - type: "component"
    name: "CloudNativePG Operator"
    technology: "CloudNativePG"
    description: "Kubernetes operator managing automated failover and health checks."
  - type: "component"
    name: "WORM Storage / SIEM"
    technology: "WORM Storage"
    description: "Stores immutable compliance logs meeting long-term retention requirements."
relationships:
  - source: "EMR & Scheduling Service"
    destination: "Primary Write Instance"
    description: "Writes transactional data [TCP/SQL via mTLS]"
  - source: "EMR & Scheduling Service"
    destination: "Read Replica Instances"
    description: "Reads data with session consistency [TCP/SQL via mTLS]"
  - source: "Billing & Claims Service"
    destination: "Primary Write Instance"
    description: "Writes financial data [TCP/SQL via mTLS]"
  - source: "PostgreSQL Audit Log Collector"
    destination: "Event Broker (Kafka)"
    description: "Streams compliance audit events [Async / PubSub]"