level: component
scope: "Component diagram for the EMR & Scheduling Service container"
parentContainer:
  name: "EMR & Scheduling Service"
elements:
  - type: "component"
    name: "Patient Management Component"
    technology: "Java Spring Boot 3.x"
    description: "Handles patient admissions and demographic records."
  - type: "component"
    name: "Scheduling Engine Component"
    technology: "Java Spring Boot 3.x with Redisson"
    description: "Manages appointment scheduling with distributed locking for clash-free scheduling."
  - type: "component"
    name: "EMR Core Component"
    technology: "Java Spring Boot 3.x with Hibernate Envers"
    description: "Tracks EMR records and automated, immutable audit trails."
  - type: "component"
    name: "Audit Log Interceptor"
    technology: "Java Spring Boot 3.x"
    description: "Ensures strict security and regulatory compliance logging."
relationships:
  - source: "Patient Management Component"
    destination: "EMR Core Component"
    description: "Coordinates patient data tracking"
  - source: "Scheduling Engine Component"
    destination: "Patient Management Component"
    description: "Schedules appointments for patients"
  - source: "EMR Core Component"
    destination: "Audit Log Interceptor"
    description: "Triggers audit logs for EMR changes"