level: component
scope: "Component diagram for the Event Broker container"
parentContainer:
  name: "Event Broker"
elements:
  - type: "component"
    name: "Kafka Broker Core"
    technology: "Apache Kafka in KRaft mode"
    description: "Provides asynchronous, decoupled messaging and eliminates ZooKeeper overhead for lower latency."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry"
    description: "Enforces strict Avro/Protobuf contracts to prevent schema drift and consumer breakage."
  - type: "component"
    name: "Kafka Connect"
    technology: "Kafka Connect with S3 Tiered Storage"
    description: "Streams events for long-term retention and offloads aged log segments to cloud storage."
  - type: "component"
    name: "MirrorMaker 2"
    technology: "MirrorMaker 2"
    description: "Handles asynchronous cross-site replication between hybrid environments."
  - type: "component"
    name: "S3 / Object Storage"
    technology: "AWS S3"
    description: "Stores 10-year audit logs offloaded via Tiered Storage."
  - type: "component"
    name: "Billing & Claims Service"
    technology: "Microservice"
    description: "Publishes billing events and validates event schemas."
  - type: "component"
    name: "EMR & Scheduling Service"
    technology: "Microservice"
    description: "Publishes clinical events and validates EMR event schemas."
relationships:
  - source: "Billing & Claims Service"
    destination: "Schema Registry"
    description: "Validates event schemas [HTTP/REST]"
  - source: "Billing & Claims Service"
    destination: "Kafka Broker Core"
    description: "Publishes billing events [TCP / mTLS / SASL]"
  - source: "EMR & Scheduling Service"
    destination: "Schema Registry"
    description: "Validates EMR event schemas [HTTP/REST]"
  - source: "EMR & Scheduling Service"
    destination: "Kafka Broker Core"
    description: "Publishes clinical events [TCP / mTLS / SASL]"
  - source: "Kafka Broker Core"
    destination: "Kafka Connect"
    description: "Streams events for long-term retention [TCP / mTLS]"
  - source: "Kafka Connect"
    destination: "S3 / Object Storage"
    description: "Offloads aged log segments via Tiered Storage [HTTPS / TLS 1.3]"
  - source: "MirrorMaker 2"
    destination: "Kafka Broker Core"
    description: "Replicates cross-site events between on-prem-k8s and eu-central-1 [TCP / mTLS]"