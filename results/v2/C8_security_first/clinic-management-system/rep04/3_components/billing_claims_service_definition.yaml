level: component
scope: "Component diagram for the Billing & Claims Service container"
parentContainer:
  name: "Billing & Claims Service"
elements:
  - type: "component"
    name: "Claim Submission Engine"
    technology: "Java Spring Boot"
    description: "Submits insurance claims and processes billing logic."
  - type: "component"
    name: "Invoice & Ledger Controller"
    technology: "Java Spring Boot"
    description: "Manages invoices and ledger entries for patient billing."
  - type: "component"
    name: "Payment & Adjudication Listener"
    technology: "Java Spring Boot / Apache Kafka"
    description: "Consumes payment and claim status updates asynchronously."
  - type: "component"
    name: "Billing Data Repository"
    technology: "Spring Data JPA / PostgreSQL"
    description: "Handles data persistence for financial records."
  - type: "component"
    name: "DLQ Routing & Fallback Handler"
    technology: "Java Spring Boot / Resilience4j"
    description: "Routes failures to DLQ and manages fault tolerance."
relationships:
  - source: "Claim Submission Engine"
    destination: "Billing Data Repository"
    description: "Reads/writes financial records"
  - source: "Invoice & Ledger Controller"
    destination: "Billing Data Repository"
    description: "Reads/writes financial records"
  - source: "Payment & Adjudication Listener"
    destination: "Billing Data Repository"
    description: "Updates financial records upon event consumption"
  - source: "Claim Submission Engine"
    destination: "DLQ Routing & Fallback Handler"
    description: "Routes processing failures"