level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge TLS Termination & Router"
    technology: "Kong / Envoy / Istio proxy"
    description: "Handles perimeter routing and edge-terminated mTLS."
  - type: "component"
    name: "Auth & Policy Enforcement"
    technology: "OAuth2/OIDC + OPA"
    description: "Validates tokens and enforces security and compliance policies."
  - type: "component"
    name: "Rate Limiting & Traffic Shaping"
    technology: "Redis"
    description: "Checks quotas and manages rate-limiting states."
  - type: "component"
    name: "Telemetry & Audit Component"
    technology: "OpenTelemetry / Prometheus"
    description: "Handles hybrid-cloud telemetry and PHI-sanitized audit logging."
  - type: "component"
    name: "Circuit Breaker & Resilience Component"
    technology: "Kong / Envoy / Istio"
    description: "Ensures resilience and fault tolerance for routed traffic."
relationships:
  - source: "Edge TLS Termination & Router"
    destination: "Auth & Policy Enforcement"
    description: "Forwards requests for validation"
  - source: "Auth & Policy Enforcement"
    destination: "Rate Limiting & Traffic Shaping"
    description: "Checks quotas and token revocation blacklist"