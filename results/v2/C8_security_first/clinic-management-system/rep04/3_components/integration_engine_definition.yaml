level: component
scope: "Component diagram for the Integration Engine container"
parentContainer:
  name: "Integration Engine"
elements:
  - type: "component"
    name: "FHIR Endpoint API"
    technology: "Java / HAPI FHIR JPA Server"
    description: "Exposes FHIR compliant APIs and persists normalized resources."
  - type: "component"
    name: "Transformation & Mapping"
    technology: "Apache Camel"
    description: "Handles protocol translation and persists normalized resources."
  - type: "component"
    name: "Outbound Dispatcher"
    technology: "Spring Integration"
    description: "Dispatches outbound payloads securely."
  - type: "component"
    name: "Provenance & Audit Interceptor"
    technology: "Java"
    description: "Monitors and logs data provenance and audit trails."
  - type: "component"
    name: "Metrics Exporter"
    technology: "Micrometer / Prometheus"
    description: "Exports operational metrics for monitoring."
relationships:
  - source: "Transformation & Mapping"
    destination: "FHIR Endpoint API"
    description: "Persists normalized resources [JDBC / TLS]"
  - source: "Outbound Dispatcher"
    destination: "External Lab & Imaging Systems"
    description: "Dispatches outbound payloads [HTTPS / mTLS with HashiCorp Vault certificates]"