level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Receptionist / Front Desk"
    description: "Manages patient admissions and scheduling."
  - type: "person"
    name: "Clinician / Doctor"
    description: "Accesses and updates Electronic Medical Records (EMRs)."
  - type: "person"
    name: "Billing Specialist"
    description: "Handles billing and insurance claims."
  - type: "person"
    name: "Patient"
    description: "Interacts with clinic services and receives care."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "Provides diagnostic results and imaging data."
  - type: "externalSystem"
    name: "Insurance Clearinghouses"
    description: "Processes automated billing claims."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Validates authentication and multi-factor authentication for users."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / Envoy, TLS, mTLS, OIDC"
    description: "Handles TLS, mTLS, and OIDC validation, routing requests to internal services."
  - type: "container"
    name: "EMR & Scheduling Service"
    technology: "Java / Spring Boot, Encrypted PostgreSQL"
    description: "Manages patient admissions, electronic medical records, and scheduling."
  - type: "container"
    name: "Billing & Claims Service"
    technology: "Node.js / TypeScript, Redis, RabbitMQ"
    description: "Handles billing operations and claims processing."
  - type: "container"
    name: "Interoperability Service"
    technology: ".NET Core / Apache Camel"
    description: "Translates and handles HL7 FHIR messages for external lab and imaging systems."
  - type: "container"
    name: "Audit Logger Sidecar"
    technology: "Lightweight container"
    description: "Streams immutable logs for security, compliance, and auditing."
relationships:
  - source: "Receptionist / Front Desk"
    destination: "API Gateway"
    description: "Authenticate and request routing"
    technology: "HTTPS / OAuth 2.0 / OIDC"
  - source: "Clinician / Doctor"
    destination: "API Gateway"
    description: "Authenticate and request routing"
    technology: "HTTPS / OAuth 2.0 / OIDC"
  - source: "Billing Specialist"
    destination: "API Gateway"
    description: "Authenticate and request routing"
    technology: "HTTPS / OAuth 2.0 / OIDC"
  - source: "Patient"
    destination: "API Gateway"
    description: "Authenticate and request routing"
    technology: "HTTPS / OAuth 2.0 / OIDC"
  - source: "API Gateway"
    destination: "EMR & Scheduling Service"
    description: "Route requests via service mesh"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Billing & Claims Service"
    description: "Route billing requests"
    technology: "HTTPS"
  - source: "EMR & Scheduling Service"
    destination: "Identity Provider (IdP)"
    description: "Validate OIDC tokens"
    technology: "OIDC"
  - source: "Billing & Claims Service"
    destination: "Insurance Clearinghouses"
    description: "Submit automated billing claims"
    technology: "REST / HL7 FHIR over HTTPS"
  - source: "Interoperability Service"
    destination: "External Lab & Imaging Systems"
    description: "Exchange lab and imaging data"
    technology: "HL7 FHIR APIs over HTTPS"