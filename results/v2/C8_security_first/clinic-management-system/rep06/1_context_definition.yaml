level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "Manages patient admissions, EMRs, scheduling, and billing for healthcare clinics via a hybrid cloud architecture."
elements:
  - type: "person"
    name: "Receptionist / Front Desk"
    description: "Manages patient admissions and scheduling."
  - type: "person"
    name: "Clinician / Doctor"
    description: "Accesses and updates Electronic Medical Records (EMRs)."
  - type: "person"
    name: "Billing Specialist"
    description: "Handles billing and insurance claims."
  - type: "person"
    name: "Patient"
    description: "Interacts with clinic services and receives care."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "Provides diagnostic results and imaging data."
  - type: "externalSystem"
    name: "Insurance Clearinghouses"
    description: "Processes automated billing claims."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Validates authentication and multi-factor authentication for users."
relationships:
  - source: "Receptionist / Front Desk"
    destination: "Clinic Management System"
    description: "Authenticate and access services via Edge WAF"
    technology: "HTTPS, OAuth 2.0 / OIDC"
  - source: "Clinician / Doctor"
    destination: "Clinic Management System"
    description: "Authenticate and access EMRs and scheduling"
    technology: "HTTPS, OAuth 2.0 / OIDC"
  - source: "Billing Specialist"
    destination: "Clinic Management System"
    description: "Access billing services"
    technology: "HTTPS, OAuth 2.0 / OIDC"
  - source: "Patient"
    destination: "Clinic Management System"
    description: "Access clinic services"
    technology: "HTTPS, OAuth 2.0 / OIDC"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Ingest diagnostic results"
    technology: "HL7 FHIR REST APIs over TLS 1.3"
  - source: "Clinic Management System"
    destination: "Insurance Clearinghouses"
    description: "Submit automated billing claims"
    technology: "HTTPS/REST APIs"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Validate step-up Multi-Factor Authentication"
    technology: "OAuth 2.0 / OIDC & MFA"