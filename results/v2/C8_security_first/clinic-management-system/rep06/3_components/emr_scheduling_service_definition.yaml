level: component
scope: "Component diagram for the EMR & Scheduling Service container"
parentContainer:
  name: "EMR & Scheduling Service"
elements:
  - type: "component"
    name: "Appointment Scheduler"
    technology: "Java / Spring Boot"
    description: "Manages clinic appointments and communicates with Redis for schedule locks."
  - type: "component"
    name: "EMR Management"
    technology: "Java / Spring Boot"
    description: "Manages electronic medical records and persists PHI to PostgreSQL."
  - type: "component"
    name: "Audit Dispatcher"
    technology: "Java / Spring Boot"
    description: "Dispatches audit logs to ensure compliance."
  - type: "component"
    name: "Event Publisher"
    technology: "Java / Spring Boot"
    description: "Emits domain events to Apache Kafka."
relationships:
  - source: "Appointment Scheduler"
    destination: "Redis"
    description: "Read/Write schedule locks [Redis Protocol over TLS]"
  - source: "EMR Management"
    destination: "PostgreSQL"
    description: "Persist PHI [JDBC over TLS 1.3]"
  - source: "Event Publisher"
    destination: "Interoperability Service"
    description: "Emit domain events [Apache Kafka / AMQP over TLS 1.3]"