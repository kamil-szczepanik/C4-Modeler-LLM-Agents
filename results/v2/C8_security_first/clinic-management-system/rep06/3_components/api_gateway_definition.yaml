level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Kong / Envoy Router"
    technology: "Kong / Envoy"
    description: "Handles incoming client requests, routing, and load balancing across internal services."
  - type: "component"
    name: "WAF"
    technology: "Coraza"
    description: "Performs payload inspection and threat mitigation for inbound traffic."
  - type: "component"
    name: "Rate Limiter"
    technology: "Redis"
    description: "Implements token-bucket rate limiting for API requests."
  - type: "component"
    name: "Telemetry Sidecar"
    technology: "Fluentbit"
    description: "Collects and pushes async batch telemetry and logs."
relationships:
  - source: "Kong / Envoy Router"
    destination: "WAF"
    description: "Inspects requests"
  - source: "Kong / Envoy Router"
    destination: "Rate Limiter"
    description: "Checks rate limits"
  - source: "Kong / Envoy Router"
    destination: "Telemetry Sidecar"
    description: "Emits telemetry data"