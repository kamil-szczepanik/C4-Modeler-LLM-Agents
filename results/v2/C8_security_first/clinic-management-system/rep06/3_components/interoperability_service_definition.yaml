level: component
scope: "Component diagram for the Interoperability Service container"
parentContainer:
  name: "Interoperability Service"
elements:
  - type: "component"
    name: "API Gateway"
    technology: ".NET Core YARP"
    description: "Handles inbound TLS termination, mTLS validation, rate limiting, and request routing."
  - type: "component"
    name: "FHIR Transformer Engine"
    technology: "Apache Camel / .NET worker"
    description: "Performs asynchronous message translation and JSON schema validation."
  - type: "component"
    name: "Integration Queue"
    technology: "RabbitMQ"
    description: "Buffers inbound and outbound payloads with envelope encryption (AES-256) and DLQ support."
  - type: "component"
    name: "Outbound Dispatcher"
    technology: ".NET Core HttpClient"
    description: "Manages outbound notifications using Polly circuit breakers and exponential backoff."
  - type: "component"
    name: "Audit & Compliance Interceptor"
    technology: ".NET Middleware"
    description: "Captures metadata and invokes the Audit Logger Sidecar."
  - type: "component"
    name: "External Lab & Imaging Systems"
    technology: "Third-party diagnostic systems"
    description: "External partners receiving FHIR notifications."
relationships:
  - source: "API Gateway"
    destination: "FHIR Transformer Engine"
    description: "Forwards validated requests [In-process / gRPC with mTLS metadata]"
  - source: "FHIR Transformer Engine"
    destination: "Integration Queue"
    description: "Queues asynchronous payloads [AMQP]"
  - source: "FHIR Transformer Engine"
    destination: "Outbound Dispatcher"
    description: "Passes processed payloads [In-process / gRPC]"
  - source: "Outbound Dispatcher"
    destination: "External Lab & Imaging Systems"
    description: "Sends FHIR notifications [HTTPS / mTLS]"
  - source: "API Gateway"
    destination: "Audit & Compliance Interceptor"
    description: "Logs ingress requests [In-process middleware]"