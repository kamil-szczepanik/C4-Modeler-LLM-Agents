level: component
scope: "Component diagram for the Audit Logger Sidecar container"
parentContainer:
  name: "Audit Logger Sidecar"
elements:
  - type: "component"
    name: "Log Ingestor Component"
    technology: "Unix Domain Socket / Localhost"
    description: "Local Unix Domain Socket receiver for high-performance, non-blocking local inter-container communication from main application containers."
  - type: "component"
    name: "Scrubbing & Hashing Component"
    technology: "VRL (Vector Remap Language)"
    description: "PII/PHI redaction and SHA-256 Merkle tree framing module for real-time regex scrubbing and cryptographic tamper-evidence."
  - type: "component"
    name: "Buffer & Batching Component"
    technology: "Ephemeral disk-backed buffer (emptyDir)"
    description: "Ephemeral disk-backed buffer ensuring zero latency impact on core clinical workflows through asynchronous, non-blocking buffering."
  - type: "component"
    name: "Log Exporter Component"
    technology: "TLS 1.3 over HTTPS"
    description: "TLS 1.3 streaming mechanism for secure log transmission to the Central SIEM."
relationships:
  - source: "Log Ingestor Component"
    destination: "Scrubbing & Hashing Component"
    description: "Passes raw logs for PII/PHI redaction and hashing"
  - source: "Scrubbing & Hashing Component"
    destination: "Buffer & Batching Component"
    description: "Stores scrubbed and framed logs in ephemeral disk buffer"
  - source: "Buffer & Batching Component"
    destination: "Log Exporter Component"
    description: "Batches and supplies logs for secure export"