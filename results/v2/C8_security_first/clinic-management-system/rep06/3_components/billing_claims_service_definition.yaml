level: component
scope: "Component diagram for the Billing & Claims Service container"
parentContainer:
  name: "Billing & Claims Service"
elements:
  - type: "component"
    name: "Billing Controller"
    technology: "Node.js / TypeScript"
    description: "Handles incoming billing requests and routes them appropriately."
  - type: "component"
    name: "Claims Processor"
    technology: "Node.js / TypeScript"
    description: "Processes automated claims and appeals to insurance clearinghouses."
  - type: "component"
    name: "Payment Reconciliation Worker"
    technology: "Node.js / TypeScript"
    description: "Processes payment status updates via message broker."
relationships:
  - source: "Billing Controller"
    destination: "Claims Processor"
    description: "Invokes claims processing logic [Internal function call]"
  - source: "Claims Processor"
    destination: "Payment Reconciliation Worker"
    description: "Pushes payment status updates [AMQP via RabbitMQ]"