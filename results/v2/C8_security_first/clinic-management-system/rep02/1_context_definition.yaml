level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed for medium-sized hospitals and clinics to securely manage patient admissions, electronic medical records, appointment scheduling, and insurance billing."
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who interact with the system for scheduling and appointments."
  - type: "person"
    name: "Receptionists / Front Desk Staff"
    description: "Administrative staff managing patient admissions and front desk operations."
  - type: "person"
    name: "Clinicians / Doctors"
    description: "Medical professionals managing electronic medical records and patient care."
  - type: "person"
    name: "Billing Specialists"
    description: "Financial staff handling insurance billing and claims."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system handling authentication and identity management."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "External clinical systems providing laboratory and imaging data."
  - type: "externalSystem"
    name: "Insurance Clearinghouse"
    description: "External system for processing insurance claims and billing."
relationships:
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Accesses appointments and admissions"
    technology: "HTTPS (TLS 1.3), Web/Mobile UI"
  - source: "Receptionists / Front Desk Staff"
    destination: "Clinic Management System"
    description: "Manages patient front desk operations"
    technology: "HTTPS (TLS 1.3), Web/Mobile UI"
  - source: "Clinicians / Doctors"
    destination: "Clinic Management System"
    description: "Updates electronic medical records and manages care"
    technology: "HTTPS (TLS 1.3), Web/Mobile UI"
  - source: "Billing Specialists"
    destination: "Clinic Management System"
    description: "Processes billing and claims"
    technology: "HTTPS (TLS 1.3), Web/Mobile UI"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OIDC / SAML over HTTPS"
  - source: "Clinic Management System"
    destination: "Lab & Imaging Systems"
    description: "Exchanges clinical data"
    technology: "HL7 FHIR over mTLS"
  - source: "Lab & Imaging Systems"
    destination: "Clinic Management System"
    description: "Returns clinical data and results"
    technology: "HL7 FHIR over mTLS"
  - source: "Clinic Management System"
    destination: "Insurance Clearinghouse"
    description: "Submits insurance claims"
    technology: "REST over HTTPS with OAuth 2.0"