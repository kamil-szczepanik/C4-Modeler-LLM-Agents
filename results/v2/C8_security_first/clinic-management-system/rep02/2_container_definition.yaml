level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who interact with the system for scheduling and appointments."
  - type: "person"
    name: "Receptionists / Front Desk Staff"
    description: "Administrative staff managing patient admissions and front desk operations."
  - type: "person"
    name: "Clinicians / Doctors"
    description: "Medical professionals managing electronic medical records and patient care."
  - type: "person"
    name: "Billing Specialists"
    description: "Financial staff handling insurance billing and claims."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system handling authentication and identity management."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "External clinical systems providing laboratory and imaging data."
  - type: "externalSystem"
    name: "Insurance Clearinghouse"
    description: "External system for processing insurance claims and billing."
  - type: "container"
    name: "API Gateway"
    technology: "Kong/Envoy, Rust/Go"
    description: "Handles rate-limiting, OAuth2/OIDC validation, and routing for incoming traffic."
  - type: "container"
    name: "Patient Portal Container"
    technology: "Node.js/NestJS, Go"
    description: "Provides interface for patient interactions and scheduling."
  - type: "container"
    name: "EMR Core Service"
    technology: "Java/Spring Boot, .NET 8"
    description: "Manages electronic medical records and clinical data operations."
  - type: "container"
    name: "Billing Integration Service"
    technology: "Java/Spring Boot"
    description: "Handles transactional billing and insurance claims processing."
  - type: "container"
    name: "Audit & Compliance Daemon"
    technology: "Go"
    description: "Manages cryptographically hashed immutable audit logging for WORM storage."
  - type: "container"
    name: "Data Tier"
    technology: "PostgreSQL with Citus/Multi-Master"
    description: "Relational storage providing active-active and read replica support."
  - type: "container"
    name: "Message Broker"
    technology: "NATS JetStream / Kafka"
    description: "Durable message broker for reliable asynchronous processing and transactional outbox patterns."
relationships:
  - source: "Patients"
    destination: "API Gateway"
    description: "Accesses appointments and admissions via portal"
    technology: "HTTPS (REST/JSON)"
  - source: "Receptionists / Front Desk Staff"
    destination: "API Gateway"
    description: "Manages patient front desk operations"
    technology: "HTTPS (REST/JSON)"
  - source: "Clinicians / Doctors"
    destination: "API Gateway"
    description: "Updates electronic medical records and manages care"
    technology: "HTTPS (REST/JSON)"
  - source: "Billing Specialists"
    destination: "API Gateway"
    description: "Processes billing and claims"
    technology: "HTTPS (REST/JSON)"
  - source: "API Gateway"
    destination: "Identity Provider (IdP)"
    description: "Validates OAuth2/OIDC tokens"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Patient Portal Container"
    description: "Routes client requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "EMR Core Service"
    description: "Routes clinical requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Billing Integration Service"
    description: "Routes billing requests"
    technology: "gRPC over mTLS"
  - source: "Patient Portal Container"
    destination: "Message Broker"
    description: "Publishes asynchronous events"
    technology: "NATS/Kafka protocol"
  - source: "EMR Core Service"
    destination: "Message Broker"
    description: "Publishes transactional outbox events"
    technology: "NATS/Kafka protocol"
  - source: "Billing Integration Service"
    destination: "Message Broker"
    description: "Publishes billing events"
    technology: "NATS/Kafka protocol"
  - source: "EMR Core Service"
    destination: "Data Tier"
    description: "Reads and writes clinical data"
    technology: "SQL over encrypted connections"
  - source: "Billing Integration Service"
    destination: "Data Tier"
    description: "Reads and writes billing data"
    technology: "SQL over encrypted connections"
  - source: "EMR Core Service"
    destination: "Lab & Imaging Systems"
    description: "Exchanges clinical data and results"
    technology: "HL7 FHIR APIs"
  - source: "Billing Integration Service"
    destination: "Insurance Clearinghouse"
    description: "Submits insurance claims"
    technology: "Secure APIs over HTTPS"
  - source: "Audit & Compliance Daemon"
    destination: "Data Tier"
    description: "Monitors and records audit logs"
    technology: "SQL / WORM Storage"