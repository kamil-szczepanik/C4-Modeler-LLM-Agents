level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Connection & Auth Manager"
    technology: "NATS JetStream / Kafka"
    description: "Handles connection management and authentication for message broker clients."
  - type: "component"
    name: "Routing & Delivery Engine"
    technology: "NATS JetStream / Kafka"
    description: "Routes and delivers message frames across the messaging infrastructure."
  - type: "component"
    name: "Replication & Persistence Engine"
    technology: "NATS JetStream / Kafka"
    description: "Persists message streams and commits offsets using distributed consensus."
relationships:
  - source: "Connection & Auth Manager"
    destination: "Routing & Delivery Engine"
    description: "Forwards authenticated client frames [gRPC]"
  - source: "Routing & Delivery Engine"
    destination: "Replication & Persistence Engine"
    description: "Persists message streams and commits offsets [Raft consensus protocol / JetStream API]"
  - source: "Routing & Delivery Engine"
    destination: "Audit & Compliance Daemon"
    description: "Streams real-time telemetry logs [Syslog over TLS]"