level: component
scope: "Component diagram for the Audit & Compliance Daemon container"
parentContainer:
  name: "Audit & Compliance Daemon"
elements:
  - type: "component"
    name: "Audit & Compliance Daemon"
    technology: "Go container"
    description: "Manages compliance logging, audit event publishing, and cryptographic validation."
  - type: "component"
    name: "Ingestion Worker"
    technology: "Go"
    description: "Consumes audit streams and validates JWT scopes."
  - type: "component"
    name: "Immutable Log Engine"
    technology: "Go"
    description: "Writes hash-chained audit logs."
  - type: "component"
    name: "Compliance Query API"
    technology: "Go / REST"
    description: "Serves audit reports and compliance certificates."
  - type: "component"
    name: "Report Generator"
    technology: "Go"
    description: "Verifies cryptographic chain-of-custody and generates PDFs."
  - type: "component"
    name: "Key Management Integrator"
    technology: "Go / gRPC"
    description: "Integrates with key management services for cryptographic verification."
  - type: "component"
    name: "Message Broker"
    technology: "NATS JetStream"
    description: "Publishes and consumes cryptographically signed audit events."
  - type: "component"
    name: "WORM Storage"
    technology: "AWS S3 Object Lock / MinIO"
    description: "Enforces tamper-proof 10-year data retention in Compliance Mode."
  - type: "component"
    name: "Compliance Officers"
    technology: "Person / DPO"
    description: "Requests audit reports and compliance certificates."
relationships:
  - source: "Audit & Compliance Daemon"
    destination: "Message Broker"
    description: "Publishes cryptographically signed audit events [NATS/TCP, mTLS]"
  - source: "Ingestion Worker"
    destination: "Message Broker"
    description: "Consumes audit streams and validates JWT scopes [NATS/TCP]"
  - source: "Immutable Log Engine"
    destination: "WORM Storage"
    description: "Writes hash-chained audit logs [S3 API / HTTPS, Compliance Mode]"
  - source: "Compliance Officers"
    destination: "Compliance Query API"
    description: "Requests audit reports and compliance certificates [HTTPS / REST, mTLS, OAuth2/OIDC]"
  - source: "Report Generator"
    destination: "Key Management Integrator"
    description: "Verifies cryptographic chain-of-custody [gRPC / mTLS]"