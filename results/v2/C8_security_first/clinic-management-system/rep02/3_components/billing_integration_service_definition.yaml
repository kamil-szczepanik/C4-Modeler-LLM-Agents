level: component
scope: "Component diagram for the Billing Integration Service container"
parentContainer:
  name: "Billing Integration Service"
elements:
  - type: "component"
    name: "Claim Management Controller"
    technology: "gRPC/REST, Spring Boot"
    description: "Exposes gRPC/REST endpoints for the API Gateway and handles OAuth token extraction."
  - type: "component"
    name: "Validation & Rules Engine"
    technology: "Java / Spring Boot"
    description: "Executes pre-submission payer rules and payload sanitization."
  - type: "component"
    name: "Clearinghouse Adapter"
    technology: "HTTPS/mTLS, Secure APIs"
    description: "Communicates with the Insurance Clearinghouse via secure HTTPS/mTLS."
  - type: "component"
    name: "Billing Event Publisher"
    technology: "NATS JetStream / Kafka"
    description: "Emits asynchronous claim-state events to the Message Broker."
  - type: "component"
    name: "Data Access Repository"
    technology: "Spring Data JPA, SQL"
    description: "Handles persistence using Spring Data JPA with field-level encryption."
  - type: "component"
    name: "Reconciliation & Batch Job Scheduler"
    technology: "Spring Batch"
    description: "Executes scheduled syncs to reconcile out-of-sync claim statuses."
  - type: "component"
    name: "DLQ & Notification Router"
    technology: "Java / Spring Boot"
    description: "Manages exhausted retry events and triggers manual intervention alerts."
  - type: "component"
    name: "Resilience & Circuit Breaker Wrapper"
    technology: "Resilience4j"
    description: "Enforces fault tolerance around external vendor integrations."
  - type: "component"
    name: "API Gateway"
    technology: "Istio/Envoy"
    description: "Routes billing requests [gRPC over mTLS, OAuth 2.0]"
  - type: "component"
    name: "Insurance Clearinghouse"
    technology: "External Vendor System"
    description: "Receives claim submissions."
  - type: "component"
    name: "Message Broker"
    technology: "NATS JetStream / Kafka"
    description: "Receives billing and retry events."
  - type: "component"
    name: "Data Tier"
    technology: "Encrypted SQL Database"
    description: "Stores encrypted records."
relationships:
  - source: "API Gateway"
    destination: "Claim Management Controller"
    description: "Routes billing requests [gRPC over mTLS, OAuth 2.0]"
  - source: "Clearinghouse Adapter"
    destination: "Insurance Clearinghouse"
    description: "Submits claims [Secure APIs over HTTPS, mTLS, OAuth]"
  - source: "Billing Event Publisher"
    destination: "Message Broker"
    description: "Publishes billing and retry events [NATS JetStream / Kafka protocol]"
  - source: "Data Access Repository"
    destination: "Data Tier"
    description: "Reads and writes encrypted records [SQL over encrypted connections]"