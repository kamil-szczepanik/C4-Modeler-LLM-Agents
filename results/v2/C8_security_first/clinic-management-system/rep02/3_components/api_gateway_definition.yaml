level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Listener Component"
    technology: "Kong / Envoy (Golang/Lua/WASM plugins)"
    description: "Handles edge routing and initial request entry for incoming traffic."
  - type: "component"
    name: "Auth & Policy Enforcement Component"
    technology: "Kong / Envoy (Golang/Lua/WASM plugins)"
    description: "Validates OAuth2/OIDC tokens and enforces security policies."
  - type: "component"
    name: "Transformation & Policy Component"
    technology: "Kong / Envoy (Golang/Lua/WASM plugins)"
    description: "Transforms requests and applies policies such as Redis-backed Token Bucket rate limiting."
  - type: "component"
    name: "Traffic Management Component"
    technology: "Kong / Envoy (Golang/Lua/WASM plugins)"
    description: "Manages priority-based traffic management and routing behavior."
  - type: "component"
    name: "Upstream Router Component"
    technology: "Kong / Envoy (Golang/Lua/WASM plugins)"
    description: "Routes requests to internal backend containers using gRPC over mTLS."
relationships:
  - source: "Edge Listener Component"
    destination: "Auth & Policy Enforcement Component"
    description: "Passes incoming requests for token validation"
  - source: "Auth & Policy Enforcement Component"
    destination: "Transformation & Policy Component"
    description: "Forwards authenticated requests for transformation and rate limiting"
  - source: "Transformation & Policy Component"
    destination: "Traffic Management Component"
    description: "Passes processed requests for traffic prioritization"
  - source: "Traffic Management Component"
    destination: "Upstream Router Component"
    description: "Dispatches requests to the appropriate upstream container"