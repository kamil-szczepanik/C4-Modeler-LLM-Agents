level: component
scope: "Component diagram for the Data Tier container"
parentContainer:
  name: "Data Tier"
elements:
  - type: "component"
    name: "Primary Relational Store"
    technology: "PostgreSQL with Patroni and Citus sharding"
    description: "Primary relational database providing ACID compliance, Row-Level Security, and automated high availability."
  - type: "component"
    name: "Read Replica Cluster"
    technology: "PostgreSQL Read Replicas"
    description: "Handles read-heavy workloads to ensure fast EMR load times and support data export operations."
  - type: "component"
    name: "Audit & Compliance WORM Store"
    technology: "AWS S3 Object Lock / MinIO"
    description: "WORM storage implementation for immutable audit logs and 10-year archival retention complying with HIPAA and GDPR."
  - type: "component"
    name: "Cold Data Archival Engine"
    technology: "Archival Engine"
    description: "Manages long-term cold data storage and archival retention."
  - type: "component"
    name: "PgBouncer Connection Pooling Proxy"
    technology: "PgBouncer"
    description: "Connection pooling to handle heavy hospital shift traffic spikes."
  - type: "component"
    name: "Data Export Worker Component"
    technology: "Data Export Worker"
    description: "Generates GDPR data portability bundles using the read replica cluster and cold archival engine."
relationships:
  - source: "EMR Core Service"
    destination: "Primary Relational Store"
    description: "Reads and writes clinical data [SQL over TLS 1.3 with mTLS]"
  - source: "Billing Integration Service"
    destination: "Primary Relational Store"
    description: "Reads and writes billing data [SQL over TLS 1.3 with mTLS]"
  - source: "Audit & Compliance Daemon"
    destination: "Audit & Compliance WORM Store"
    description: "Records immutable audit logs [WORM Storage protocols]"
  - source: "Data Export Worker Component"
    destination: "Read Replica Cluster"
    description: "Generates GDPR data portability bundles [Internal API / SQL]"
  - source: "Data Export Worker Component"
    destination: "Cold Data Archival Engine"
    description: "Accesses archived data for GDPR bundles [Internal API / SQL]"