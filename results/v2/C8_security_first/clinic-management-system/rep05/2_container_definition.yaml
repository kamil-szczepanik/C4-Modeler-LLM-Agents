level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patient"
    description: "End users who interact with the system via the Patient Portal to manage registrations and view records."
  - type: "person"
    name: "Clinic Staff"
    description: "Staff members who manage front-desk operations, appointments, and patient intake."
  - type: "person"
    name: "Clinician"
    description: "Medical professionals who access and update Electronic Medical Records (EMRs)."
  - type: "person"
    name: "Billing Specialist"
    description: "Administrative users who handle financial transactions and insurance claims."
  - type: "externalSystem"
    name: "Enterprise Identity Provider (IdP)"
    description: "Handles authentication and OAuth 2.0 / OIDC integrations."
  - type: "externalSystem"
    name: "Insurance Claim Clearinghouse"
    description: "External clearinghouse for processing insurance claims."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "External diagnostic systems providing lab results and medical imaging."
  - type: "externalSystem"
    name: "Notification System"
    description: "External notification service for dispatching appointment reminders and alerts."
  - type: "container"
    name: "Envoy Proxy API Gateway"
    technology: "Envoy Proxy"
    description: "Ingress and routing, TLS 1.3 termination, and rate limiting."
  - type: "container"
    name: "OAuth2-Proxy / Keycloak Sidecar"
    technology: "OAuth2-Proxy / Keycloak"
    description: "Handles authentication and identity verification alongside the API gateway."
  - type: "container"
    name: "EMR & Patient Service"
    technology: "Node.js / Fastify"
    description: "Manages patient admissions, scheduling, and electronic medical records (EMR)."
  - type: "container"
    name: "Billing & Claims Service"
    technology: "Java Spring Boot"
    description: "Manages billing and financial workflows."
  - type: "container"
    name: "FHIR Interoperability Gateway"
    technology: "HAPI FHIR"
    description: "Ensures HL7 FHIR standards compliance for interoperability."
  - type: "container"
    name: "PostgreSQL"
    technology: "CloudNativePG, PostgreSQL with AES-256 encryption"
    description: "Core persistence store for structured patient and billing data."
  - type: "container"
    name: "Apache Kafka"
    technology: "Apache Kafka"
    description: "Asynchronous event streaming and message queuing platform."
relationships:
  - source: "Patient"
    destination: "Envoy Proxy API Gateway"
    description: "Interacts securely to manage registrations and view records"
    technology: "HTTPS / TLS 1.3"
  - source: "Clinic Staff"
    destination: "Envoy Proxy API Gateway"
    description: "Manages front-desk operations and patient intake"
    technology: "HTTPS / TLS 1.3"
  - source: "Clinician"
    destination: "Envoy Proxy API Gateway"
    description: "Accesses and updates EMRs and clinical data"
    technology: "HTTPS / TLS 1.3"
  - source: "Billing Specialist"
    destination: "Envoy Proxy API Gateway"
    description: "Handles financial transactions and insurance claims"
    technology: "HTTPS / TLS 1.3"
  - source: "Envoy Proxy API Gateway"
    destination: "OAuth2-Proxy / Keycloak Sidecar"
    description: "Internal traffic authentication and routing"
    technology: "Internal HTTP / mTLS"
  - source: "EMR & Patient Service"
    destination: "Billing & Claims Service"
    description: "Communicates for billing integration and workflows"
    technology: "gRPC over mTLS"
  - source: "Billing & Claims Service"
    destination: "Insurance Claim Clearinghouse"
    description: "Asynchronous queue-based integration for claims processing"
    technology: "Asynchronous queue-based integration via Apache Kafka"
  - source: "FHIR Interoperability Gateway"
    destination: "Lab & Imaging Systems"
    description: "Integrates for lab and imaging data exchange"
    technology: "HL7 FHIR APIs"
  - source: "EMR & Patient Service"
    destination: "PostgreSQL"
    description: "Reads and writes encrypted patient and EMR data"
    technology: "Encrypted Database Connection"
  - source: "Billing & Claims Service"
    destination: "PostgreSQL"
    description: "Reads and writes billing data"
    technology: "Encrypted Database Connection"