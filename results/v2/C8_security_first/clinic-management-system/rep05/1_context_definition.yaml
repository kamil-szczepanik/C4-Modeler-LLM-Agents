level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid, highly available platform that securely manages patient registrations, appointments, Electronic Medical Records (EMRs), and billing while ensuring strict HIPAA and GDPR compliance."
elements:
  - type: "person"
    name: "Patient / Consumer"
    description: "End users who interact with the system via the Patient Portal to manage registrations and view records."
  - type: "person"
    name: "Clinic Staff / Receptionist"
    description: "Staff members who manage front-desk operations, appointments, and patient intake."
  - type: "person"
    name: "Clinician / Doctor"
    description: "Medical professionals who access and update Electronic Medical Records (EMRs)."
  - type: "person"
    name: "Billing Specialist / Administrator"
    description: "Administrative users who handle financial transactions and insurance claims."
  - type: "externalSystem"
    name: "Patient Portal Interface"
    description: "External portal interface allowing patients to access services."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External diagnostic systems providing lab results and medical imaging."
  - type: "externalSystem"
    name: "Insurance Claim Clearinghouse"
    description: "External clearinghouse for processing insurance claims via secure EDI/HTTPS APIs."
  - type: "externalSystem"
    name: "Enterprise Identity Provider (IdP)"
    description: "Handles authentication and OAuth 2.0 / OIDC integrations with mandatory MFA."
  - type: "externalSystem"
    name: "SMS/Email Notification System"
    description: "External notification service for dispatching appointment reminders."
relationships:
  - source: "Patient / Consumer"
    destination: "Clinic Management System"
    description: "Interacts securely to manage registrations and appointments"
    technology: "HTTPS, OAuth 2.0 / OIDC"
  - source: "Clinic Staff / Receptionist"
    destination: "Clinic Management System"
    description: "Manages clinical operations and patient intake"
    technology: "HTTPS, OAuth 2.0 / OIDC"
  - source: "Clinician / Doctor"
    destination: "Clinic Management System"
    description: "Accesses and updates EMRs and clinical data"
    technology: "HTTPS, OAuth 2.0 / OIDC"
  - source: "Billing Specialist / Administrator"
    destination: "Clinic Management System"
    description: "Manages billing and insurance claims"
    technology: "HTTPS, OAuth 2.0 / OIDC"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Integrates for lab and imaging data exchange"
    technology: "HL7 FHIR APIs over HTTPS with mTLS and signed JWT assertions"
  - source: "Clinic Management System"
    destination: "Insurance Claim Clearinghouse"
    description: "Submits and processes insurance claims"
    technology: "Secure EDI / HTTPS APIs"
  - source: "Clinic Management System"
    destination: "SMS/Email Notification System"
    description: "Dispatches appointment reminders and notifications"
    technology: "HTTPS / REST webhooks"
  - source: "Clinic Management System"
    destination: "Enterprise Identity Provider (IdP)"
    description: "Authenticates users via single sign-on and MFA"
    technology: "OAuth 2.0 / OIDC"