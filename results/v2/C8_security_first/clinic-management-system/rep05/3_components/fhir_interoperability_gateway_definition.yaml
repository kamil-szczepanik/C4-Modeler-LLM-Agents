level: component
scope: "Component diagram for the FHIR Interoperability Gateway container"
parentContainer:
  name: "FHIR Interoperability Gateway"
elements:
  - type: "component"
    name: "HAPI FHIR JPA Server Engine"
    technology: "Java / Spring Boot, HAPI FHIR JPA Server"
    description: "Handles standards-compliant clinical endpoints and HL7 FHIR API requests."
  - type: "component"
    name: "Kafka Event Producer"
    technology: "Apache Kafka Producer API"
    description: "Publishes clinical and operational events to Apache Kafka asynchronously."
  - type: "component"
    name: "Data Persistence Manager"
    technology: "JDBC, HikariCP"
    description: "Manages data persistence connections to the PostgreSQL database with AES-256 encryption."
  - type: "component"
    name: "Session and Token Caching Manager"
    technology: "Redis Protocol Client"
    description: "Handles distributed token caching and session state management via Redis."
relationships:
  - source: "HAPI FHIR JPA Server Engine"
    destination: "Kafka Event Producer"
    description: "Publishes event messages"
  - source: "HAPI FHIR JPA Server Engine"
    destination: "Data Persistence Manager"
    description: "Reads and writes clinical data"
  - source: "HAPI FHIR JPA Server Engine"
    destination: "Session and Token Caching Manager"
    description: "Caches tokens and session state"