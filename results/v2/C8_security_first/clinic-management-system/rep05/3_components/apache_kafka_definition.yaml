level: component
scope: "Component diagram for the Apache Kafka container"
parentContainer:
  name: "Apache Kafka"
elements:
  - type: "component"
    name: "Kafka Broker"
    technology: "Java/Scala with KRaft"
    description: "Handles distributed event streaming and message brokering using KRaft mode."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent"
    description: "Provides Avro and Protobuf schema validation and data masking."
  - type: "component"
    name: "Tiered Storage Manager"
    technology: "Native plug-in API over TLS 1.3"
    description: "Offloads logs to AWS S3 for long-term data retention."
  - type: "component"
    name: "Kafka MirrorMaker 2 (MM2)"
    technology: "Kafka Connect / MM2"
    description: "Manages asynchronous cross-site replication between on-prem-k8s and AWS."
relationships:
  - source: "Kafka Broker"
    destination: "Schema Registry"
    description: "Validates Avro and Protobuf schemas and masks data via HTTPS."
  - source: "Kafka Broker"
    destination: "Tiered Storage Manager"
    description: "Offloads logs to AWS S3 using AWS IRSA over TLS 1.3."
  - source: "Kafka Broker"
    destination: "Kafka MirrorMaker 2 (MM2)"
    description: "Replicates event streams asynchronously across sites."