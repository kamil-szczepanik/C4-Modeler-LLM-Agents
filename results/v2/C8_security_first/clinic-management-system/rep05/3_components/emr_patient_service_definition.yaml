level: component
scope: "Component diagram for the EMR & Patient Service container"
parentContainer:
  name: "EMR & Patient Service"
elements:
  - type: "component"
    name: "API Router & Auth Middleware"
    technology: "TypeScript / Fastify"
    description: "Manages patient admissions, scheduling, routing, and authentication for clinics."
  - type: "component"
    name: "Patient & Scheduling Engine"
    technology: "TypeScript"
    description: "Handles patient admission workflows and clinic scheduling logic."
  - type: "component"
    name: "EMR Core & Audit Service"
    technology: "TypeScript"
    description: "Manages electronic medical records and maintains audit trails for HIPAA and GDPR compliance."
  - type: "component"
    name: "Data Access Repository"
    technology: "Knex.js / node-postgres"
    description: "Interfaces with relational storage and caching layers for data retrieval and persistence."
  - type: "component"
    name: "In-Memory Caching Layer"
    technology: "Redis"
    description: "Caches clinic schedules and patient lookups for low-latency access."
  - type: "component"
    name: "Billing & Claims Service"
    technology: "Java Spring Boot"
    description: "Handles billing integration and claims workflows."
  - type: "component"
    name: "PostgreSQL with CloudNativePG"
    technology: "PostgreSQL / CloudNativePG"
    description: "Relational persistence with AES-256 encryption at rest."
  - type: "component"
    name: "Apache Kafka"
    technology: "Apache Kafka"
    description: "Event broker for asynchronous messaging using SASL/SCRAM and TLS."
relationships:
  - source: "EMR Core & Audit Service"
    destination: "Billing & Claims Service"
    description: "Billing integration and workflows via gRPC over mTLS"
  - source: "EMR Core & Audit Service"
    destination: "Apache Kafka"
    description: "Publishes domain events (e.g., PatientAdmitted) via TLS and SASL/SCRAM"
  - source: "Data Access Repository"
    destination: "PostgreSQL with CloudNativePG"
    description: "Reads and writes encrypted records via TLS and AES-256"
  - source: "Data Access Repository"
    destination: "In-Memory Caching Layer"
    description: "Caches clinic schedules and patient lookups via TCP"