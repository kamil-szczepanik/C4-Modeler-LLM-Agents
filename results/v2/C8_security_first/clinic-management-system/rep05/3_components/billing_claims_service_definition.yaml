level: component
scope: "Component diagram for the Billing & Claims Service container"
parentContainer:
  name: "Billing & Claims Service"
elements:
  - type: "component"
    name: "Billing Controller"
    technology: "Java Spring Boot REST/gRPC Controller"
    description: "Handles incoming billing and claims requests, routing them to the core service layer."
  - type: "component"
    name: "Claims Processor Service"
    technology: "Java Spring Boot Service with Resilience4j"
    description: "Manages business logic for insurance claims, applying circuit breaking for outbound calls."
  - type: "component"
    name: "Tokenization & Security Manager"
    technology: "Java Spring Boot / Cryptographic Utility"
    description: "Performs field-level tokenization and enforces RBAC for HIPAA/GDPR compliance."
  - type: "component"
    name: "Kafka Outbox Publisher"
    technology: "Apache Kafka Client with Transactional Outbox"
    description: "Publishes asynchronous events to Apache Kafka for communication with external clearinghouses."
relationships:
  - source: "Billing Controller"
    destination: "Claims Processor Service"
    description: "Delegates business logic execution"
  - source: "Claims Processor Service"
    destination: "Tokenization & Security Manager"
    description: "Encrypts and tokenizes sensitive patient and billing data"
  - source: "Claims Processor Service"
    destination: "Kafka Outbox Publisher"
    description: "Queues asynchronous insurance claim events"