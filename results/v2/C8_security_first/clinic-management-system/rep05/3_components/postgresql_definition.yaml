level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "PostgreSQL 16 Engine"
    technology: "PostgreSQL 16 with RLS and pgaudit"
    description: "Core relational database managing clinical and billing data with row-level security and auditing."
  - type: "component"
    name: "PgBouncer Sidecar"
    technology: "PgBouncer"
    description: "Connection pooler optimizing throughput and preventing thread exhaustion."
  - type: "component"
    name: "WAL-G Sidecar"
    technology: "WAL-G"
    description: "Backup manager for archiving encrypted WAL logs to object storage supporting 10-year retention."
  - type: "component"
    name: "CloudNativePG Operator"
    technology: "CloudNativePG Kubernetes Controller"
    description: "Kubernetes controller managing replication, automated failover, and high availability."
relationships:
  - source: "PgBouncer Sidecar"
    destination: "PostgreSQL 16 Engine"
    description: "Pools and routes database connections over TCP with TLS 1.3"
  - source: "WAL-G Sidecar"
    destination: "PostgreSQL 16 Engine"
    description: "Reads WAL logs for backup archiving"
  - source: "CloudNativePG Operator"
    destination: "PostgreSQL 16 Engine"
    description: "Manages replication and failover"