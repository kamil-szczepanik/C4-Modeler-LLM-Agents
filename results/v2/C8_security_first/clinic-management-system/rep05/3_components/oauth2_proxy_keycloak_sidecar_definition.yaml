level: component
scope: "Component diagram for the OAuth2-Proxy / Keycloak Sidecar container"
parentContainer:
  name: "OAuth2-Proxy / Keycloak Sidecar"
elements:
  - type: "component"
    name: "OAuth2-Proxy Authentication Handler"
    technology: "Go (OAuth2-Proxy)"
    description: "Lightweight, stateless authentication sidecar handling token validation, session management, and intercepting requests from the Envoy Proxy."
  - type: "component"
    name: "Local JWKS Caching Module"
    technology: "In-Memory Go Cache"
    description: "Caches JSON Web Key Sets locally to validate tokens swiftly and minimize latency against the Enterprise IdP."
relationships:
  - source: "OAuth2-Proxy Authentication Handler"
    destination: "Local JWKS Caching Module"
    description: "Queries cached public keys for JWT validation"