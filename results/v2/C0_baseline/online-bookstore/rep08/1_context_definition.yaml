# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "A cloud-native, multi-region e-commerce platform designed to provide a secure, high-performance shopping experience for physical and electronic books."
elements:
  - type: "person"
    name: "Customer"
    description: "End-user shopping, browsing, reviewing, and checking out."
  - type: "person"
    name: "Store Administrator"
    description: "Internal user managing inventory, catalogue, and fulfillment."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External financial transaction processor (e.g., Stripe/PayPal)."
  - type: "externalSystem"
    name: "Shipping Provider"
    description: "External physical logistics partner (e.g., FedEx/UPS)."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External authentication service (e.g., Auth0/AWS Cognito)."
relationships:
  - source: "Customer"
    destination: "Online Bookstore"
    description: "Shopping, browsing, reviewing, and checking out"
    technology: "HTTPS via AWS CloudFront CDN, TLS 1.3, OAuth 2.0 / OIDC"
  - source: "Store Administrator"
    destination: "Online Bookstore"
    description: "Managing inventory, catalogue, and fulfillment"
    technology: "HTTPS via AWS CloudFront CDN, TLS 1.3, OAuth 2.0 / OIDC"
  - source: "Online Bookstore"
    destination: "Payment Gateway"
    description: "Processing financial transactions"
    technology: "HTTPS / REST API via TLS 1.3 with mTLS and HMAC webhook verification"
  - source: "Online Bookstore"
    destination: "Shipping Provider"
    description: "Managing physical logistics and fulfillment"
    technology: "HTTPS / REST API via TLS 1.3 with circuit breakers"
  - source: "Online Bookstore"
    destination: "Identity Provider (IdP)"
    description: "Authenticating users and managing identities"
    technology: "OIDC / OAuth 2.0 over HTTPS"