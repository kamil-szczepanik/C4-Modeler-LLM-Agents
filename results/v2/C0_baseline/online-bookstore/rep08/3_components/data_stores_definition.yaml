level: component
scope: "Component diagram for the Data Stores container"
parentContainer:
  name: "Data Stores"
elements:
  - type: "component"
    name: "Catalog & Transaction DB"
    technology: "Amazon Aurora PostgreSQL (Multi-AZ, Global Database)"
    description: "Stores catalog and ACID-compliant transactional data with multi-currency support and global read replicas."
  - type: "component"
    name: "Compliance & Audit Store"
    technology: "Amazon DynamoDB with DynamoDB Streams"
    description: "Manages compliance and right-to-be-forgotten data, rapid compliance data handling, and TTL-based purging."
  - type: "component"
    name: "Recommendation Cache"
    technology: "Amazon ElastiCache for Redis (Global Datastore)"
    description: "Provides pre-computed recommendations for sub-millisecond retrieval."
  - type: "component"
    name: "Security & Governance"
    technology: "AWS KMS, AWS Secrets Manager, IAM, AWS Organizations"
    description: "Handles encryption at rest, secrets management, passwordless database authentication, and SCPs."
relationships:
  - source: "Catalog & Search Service"
    destination: "Catalog & Transaction DB"
    description: "Reads/writes catalog data via JDBC over TLS"
  - source: "Checkout & Order Service"
    destination: "Catalog & Transaction DB"
    description: "Persists ACID-compliant transactional data via JDBC over TLS"
  - source: "Recommendation Service"
    destination: "Recommendation Cache"
    description: "Retrieves pre-computed recommendations via RESP protocol"
  - source: "User Privacy & Compliance Service"
    destination: "Compliance & Audit Store"
    description: "Manages compliance and right-to-be-forgotten data via AWS SDK over HTTPS"
  - source: "Global Regions"
    destination: "Catalog & Transaction DB"
    description: "Replicates data globally using encrypted inter-region transit and VPC peering"
  - source: "Global Regions"
    destination: "Recommendation Cache"
    description: "Replicates data globally using encrypted inter-region transit and VPC peering"