level: component
scope: "Component diagram for the Single Page Application (SPA) container"
parentContainer:
  name: "Single Page Application (SPA)"
elements:
  - type: "component"
    name: "Catalog & Search UI Component"
    technology: "React, TypeScript"
    description: "Handles product browsing and keyword search interfaces."
  - type: "component"
    name: "Checkout & Cart UI Component"
    technology: "React, TypeScript"
    description: "Manages shopping cart state and secure checkout workflows."
  - type: "component"
    name: "Recommendation & Review UI Component"
    technology: "React, TypeScript"
    description: "Displays ratings, reviews, and product recommendations."
  - type: "component"
    name: "Admin Management UI Component"
    technology: "React, TypeScript, Lazily-loaded"
    description: "Provides store administration interfaces for authorized users."
  - type: "component"
    name: "API Client & Auth Component"
    technology: "Axios, OpenID Connect SDK"
    description: "Manages secure communication, API requests, and authentication flows."
relationships:
  - source: "Catalog & Search UI Component"
    destination: "API Client & Auth Component"
    description: "Internal modular calls"
  - source: "Checkout & Cart UI Component"
    destination: "API Client & Auth Component"
    description: "Internal modular calls"
  - source: "Recommendation & Review UI Component"
    destination: "API Client & Auth Component"
    description: "Internal modular calls"
  - source: "Admin Management UI Component"
    destination: "API Client & Auth Component"
    description: "Internal modular calls"
  - source: "API Client & Auth Component"
    destination: "Identity Provider (IdP)"
    description: "Authenticates via [OAuth 2.0 / PKCE]"
  - source: "API Client & Auth Component"
    destination: "Amazon API Gateway"
    description: "Sends API requests via [HTTPS/TLS 1.3]"