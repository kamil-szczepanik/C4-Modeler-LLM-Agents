level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Entry Router"
    technology: "Amazon API Gateway"
    description: "Manages entry routing, rate limiting, and initial request distribution."
  - type: "component"
    name: "WAF Protection"
    technology: "AWS WAF"
    description: "Mitigates DDoS attacks and bot scraping to protect system uptime."
  - type: "component"
    name: "Token Authorizer"
    technology: "AWS Lambda Authorizers"
    description: "Performs custom token exchange, JWT validation, and claims enrichment."
relationships:
  - source: "Entry Router"
    destination: "WAF Protection"
    description: "Filters incoming client traffic"
  - source: "Entry Router"
    destination: "Token Authorizer"
    description: "Delegates authentication and token validation"