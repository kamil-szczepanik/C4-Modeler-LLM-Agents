level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "RecommendationEngine"
    technology: "FastAPI / Python"
    description: "FastAPI core component handling collaborative filtering and input validation."
  - type: "component"
    name: "CacheManager"
    technology: "Amazon ElastiCache (Redis)"
    description: "Manages low-latency retrieval using Amazon ElastiCache (Redis)."
  - type: "component"
    name: "FallbackManager"
    technology: "Amazon Aurora PostgreSQL"
    description: "Implements circuit breakers to query Amazon Aurora PostgreSQL for genre-specific best-sellers during cache failures."
  - type: "component"
    name: "ABTestRouter"
    technology: "Python"
    description: "Evaluates request headers to assign algorithm variants and campaign IDs."
  - type: "component"
    name: "EventPublisher"
    technology: "AWS SDK (Boto3) / Amazon SQS"
    description: "Asynchronously logs pseudonymized impression and click events to Amazon SQS via AWS SDK (Boto3)."
relationships:
  - source: "API Gateway"
    destination: "RecommendationEngine"
    description: "Routes recommendation requests via REST/gRPC using mTLS."
  - source: "RecommendationEngine"
    destination: "CacheManager"
    description: "Reads and writes recommendation data using the Redis Protocol with TLS."
  - source: "FallbackManager"
    destination: "Amazon Aurora PostgreSQL"
    description: "Queries fallback best-sellers using PostgreSQL Protocol over TLS 1.3."
  - source: "EventPublisher"
    destination: "Amazon SQS"
    description: "Publishes pseudonymized events using HTTPS and AWS KMS encryption with IAM least privilege."