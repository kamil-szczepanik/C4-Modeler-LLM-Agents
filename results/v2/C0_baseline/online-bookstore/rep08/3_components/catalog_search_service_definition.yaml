level: component
scope: "Component diagram for the Catalog & Search Service container"
parentContainer:
  name: "Catalog & Search Service"
elements:
  - type: "component"
    name: "Search Controller"
    technology: "Spring MVC"
    description: "Routes search requests via mTLS and AWS IAM."
  - type: "component"
    name: "Search Indexer / Sync Worker"
    technology: "Spring Cloud Stream, Elasticsearch Java Client"
    description: "Performs near-real-time index updates using AWS SigV4 over HTTPS."
  - type: "component"
    name: "Catalog Management Service"
    technology: "Spring Data JPA"
    description: "Persists source-of-truth data using IAM Database Authentication and publishes mutation events."
  - type: "component"
    name: "Currency Conversion Processor"
    technology: "Spring Boot"
    description: "Handles multi-currency pricing conversions."
  - type: "component"
    name: "Catalog Event Publisher"
    technology: "Spring Cloud Stream"
    description: "Publishes catalog and inventory mutation events."
  - type: "component"
    name: "Amazon OpenSearch Service"
    technology: "Amazon OpenSearch"
    description: "Executes search and aggregation queries over HTTPS with TLS 1.3."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Persists source-of-truth data providing ACID compliance."
  - type: "component"
    name: "Amazon SQS"
    technology: "Amazon SQS (with Dead Letter Queues)"
    description: "Decouples write operations from search indexing and holds mutation events."
relationships:
  - source: "Search Controller"
    destination: "Amazon OpenSearch Service"
    description: "Executes search and aggregation queries over HTTPS with TLS 1.3"
  - source: "Catalog Management Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists source-of-truth data using IAM Database Authentication"
  - source: "Catalog Management Service"
    destination: "Amazon SQS"
    description: "Publishes catalog and inventory mutation events via AWS SDK"
  - source: "Search Indexer / Sync Worker"
    destination: "Amazon OpenSearch Service"
    description: "Performs near-real-time index updates using AWS SigV4 over HTTPS"