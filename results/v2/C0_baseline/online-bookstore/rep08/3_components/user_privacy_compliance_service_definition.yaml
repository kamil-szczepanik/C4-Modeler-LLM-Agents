level: component
scope: "Component diagram for the User Privacy & Compliance Service container"
parentContainer:
  name: "User Privacy & Compliance Service"
elements:
  - type: "component"
    name: "Compliance API Controller"
    technology: "Python, FastAPI"
    description: "Exposes endpoints to handle privacy requests, data access, and account deletion."
  - type: "component"
    name: "Data Extraction Engine"
    technology: "Python"
    description: "Gathers user data across data stores and generates encrypted exports."
  - type: "component"
    name: "Anonymization & Purging Worker"
    technology: "Python"
    description: "Executes purging and anonymization of user records in transactional and NoSQL databases."
  - type: "component"
    name: "Compliance Event Publisher / Notification Dispatcher"
    technology: "Python, AWS SES"
    description: "Publishes domain events for asynchronous workflows and dispatches notifications."
relationships:
  - source: "Compliance API Controller"
    destination: "Data Extraction Engine"
    description: "Triggers data extraction for export requests [Internal]"
  - source: "Compliance API Controller"
    destination: "Anonymization & Purging Worker"
    description: "Triggers user data anonymization and deletion [Internal]"
  - source: "Data Extraction Engine"
    destination: "Amazon S3"
    description: "Stores encrypted data exports with 15-minute presigned URLs [HTTPS, AWS KMS]"
  - source: "Anonymization & Purging Worker"
    destination: "Amazon Aurora PostgreSQL & DynamoDB"
    description: "Executes purging and anonymization [SSL/TLS]"
  - source: "Compliance Event Publisher / Notification Dispatcher"
    destination: "Amazon SQS"
    description: "Publishes domain events for asynchronous workflows [AMQP/SQS Protocol]"