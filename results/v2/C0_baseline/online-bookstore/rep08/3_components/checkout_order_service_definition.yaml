level: component
scope: "Component diagram for the Checkout & Order Service container"
parentContainer:
  name: "Checkout & Order Service"
elements:
  - type: "component"
    name: "Checkout Orchestrator"
    technology: "Node.js, Express, Zod"
    description: "Express router handling multi-step workflows, currency conversion, idempotency, and Zod input validation."
  - type: "component"
    name: "Payment Gateway Client"
    technology: "Node.js, TLS-HTTPS, Circuit Breaker"
    description: "Encapsulates external payment processing via TLS-HTTPS with circuit breakers."
  - type: "component"
    name: "Shipping Integrator"
    technology: "Node.js, Resilience Patterns"
    description: "Manages third-party shipping API calls using resilience patterns."
  - type: "component"
    name: "Order Repository"
    technology: "Prisma, PgBouncer, Amazon Aurora PostgreSQL"
    description: "Handles transactional persistence via Prisma/PgBouncer with Amazon Aurora PostgreSQL."
  - type: "component"
    name: "Order/Compliance Event Publisher"
    technology: "Amazon SQS"
    description: "Emits asynchronous domain and PII-masking events to Amazon SQS."
relationships:
  - source: "API Gateway"
    destination: "Checkout Orchestrator"
    description: "Routes authenticated checkout requests via mTLS and AWS IAM using OAuth2/JWT."
  - source: "Checkout Orchestrator"
    destination: "Order Repository"
    description: "Stores orders, idempotency keys, and column-level encrypted PII in Amazon Aurora PostgreSQL."
  - source: "Order/Compliance Event Publisher"
    destination: "Amazon SQS"
    description: "Sends asynchronous order-placed and compliance events with Dead Letter Queue backups."
  - source: "Payment Gateway Client"
    destination: "Third-Party Payment Gateway"
    description: "Processes tokenized card transactions over TLS-secured HTTPS."
  - source: "Shipping Integrator"
    destination: "Shipping Provider"
    description: "Manages fulfillment operations via TLS-secured HTTPS."