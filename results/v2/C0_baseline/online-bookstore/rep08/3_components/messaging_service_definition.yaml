level: component
scope: "Component diagram for the Messaging Service container"
parentContainer:
  name: "Messaging Service"
elements:
  - type: "component"
    name: "OrderEventsQueue"
    technology: "Amazon SQS"
    description: "Decouples asynchronous workflows and ensures at-least-once delivery for orders."
  - type: "component"
    name: "ComplianceExportQueue"
    technology: "Amazon SQS FIFO"
    description: "Triggers audit log and data export pipelines for compliance."
  - type: "component"
    name: "Dead-Letter Queues"
    technology: "Amazon SQS"
    description: "Captures failed messages for error handling and recovery."
  - type: "component"
    name: "Event Archive"
    technology: "Amazon S3"
    description: "Persists processed event logs for long-term GDPR/CCPA audit logging."
relationships:
  - source: "OrderEventsQueue"
    destination: "Order & Fulfillment Workers"
    description: "Dispatches asynchronous fulfillment tasks via SQS Long Polling"
  - source: "ComplianceExportQueue"
    destination: "Compliance Processor"
    description: "Triggers audit log and data export pipelines"
  - source: "Dead-Letter Queues"
    destination: "DLQ Redrive Lambda"
    description: "Invokes recovery workflow"
  - source: "OrderEventsQueue"
    destination: "Event Archive"
    description: "Persists processed event logs for auditing"