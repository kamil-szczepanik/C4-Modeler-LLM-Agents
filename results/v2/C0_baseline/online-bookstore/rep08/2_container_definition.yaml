level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Customer"
    description: "End-users interacting via web/mobile interfaces to browse, shop, and checkout."
  - type: "person"
    name: "Store Administrator"
    description: "Back-office staff managing inventory, catalog, and fulfillment."
  - type: "externalSystem"
    name: "Third-Party Payment Gateway"
    description: "External financial transaction processor."
  - type: "externalSystem"
    name: "Shipping Provider"
    description: "External physical logistics and fulfillment partner."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External authentication service."
  - type: "container"
    name: "Single Page Application (SPA)"
    technology: "React, TypeScript, Amazon CloudFront, Amazon S3"
    description: "Frontend interface for high-performance client rendering."
  - type: "container"
    name: "API Gateway"
    technology: "Amazon API Gateway"
    description: "Provides entry routing, rate limiting, and JWT validation."
  - type: "container"
    name: "Catalog & Search Service"
    technology: "AWS ECS Fargate, Spring Boot, Elasticsearch"
    description: "Handles catalog management and fast keyword search."
  - type: "container"
    name: "Checkout & Order Service"
    technology: "AWS ECS Fargate, Node.js, Express"
    description: "Manages orders, checkout workflows, and integrations with external payment and shipping."
  - type: "container"
    name: "Recommendation Service"
    technology: "AWS ECS Fargate, FastAPI, Redis"
    description: "Provides personalized recommendations with low-latency caching."
  - type: "container"
    name: "User Privacy & Compliance Service"
    technology: "AWS ECS Fargate"
    description: "Manages isolated user privacy workflows and compliance data."
  - type: "container"
    name: "Data Stores"
    technology: "Amazon Aurora PostgreSQL, Amazon DynamoDB"
    description: "Persists transactional, session, and compliance data."
  - type: "container"
    name: "Messaging Service"
    technology: "Amazon SQS"
    description: "Handles asynchronous event handling and data export requests."
relationships:
  - source: "Customer"
    destination: "Single Page Application (SPA)"
    description: "Interacts with web/mobile interfaces"
    technology: "HTTPS/TLS"
  - source: "Store Administrator"
    destination: "Single Page Application (SPA)"
    description: "Manages store via web/mobile interfaces"
    technology: "HTTPS/TLS"
  - source: "Single Page Application (SPA)"
    destination: "API Gateway"
    description: "Sends client API requests"
    technology: "HTTPS/TLS"
  - source: "API Gateway"
    destination: "Catalog & Search Service"
    description: "Routes catalog and search requests"
    technology: "mTLS and AWS IAM"
  - source: "API Gateway"
    destination: "Checkout & Order Service"
    description: "Routes checkout and order requests"
    technology: "mTLS and AWS IAM"
  - source: "API Gateway"
    destination: "Recommendation Service"
    description: "Routes recommendation requests"
    technology: "mTLS and AWS IAM"
  - source: "API Gateway"
    destination: "User Privacy & Compliance Service"
    description: "Routes user privacy and compliance requests"
    technology: "mTLS and AWS IAM"
  - source: "Catalog & Search Service"
    destination: "Data Stores"
    description: "Reads and writes catalog data"
    technology: "PostgreSQL / Elasticsearch"
  - source: "Checkout & Order Service"
    destination: "Data Stores"
    description: "Reads and writes transactional data"
    technology: "Amazon Aurora PostgreSQL"
  - source: "Recommendation Service"
    destination: "Data Stores"
    description: "Caches and retrieves recommendations"
    technology: "Redis"
  - source: "User Privacy & Compliance Service"
    destination: "Data Stores"
    description: "Reads and writes privacy and compliance data"
    technology: "Amazon DynamoDB"
  - source: "Checkout & Order Service"
    destination: "Messaging Service"
    description: "Sends asynchronous events and data export requests"
    technology: "Amazon SQS"
  - source: "Checkout & Order Service"
    destination: "Third-Party Payment Gateway"
    description: "Processes payments"
    technology: "TLS-secured HTTPS"
  - source: "Checkout & Order Service"
    destination: "Shipping Provider"
    description: "Manages shipping and fulfillment"
    technology: "TLS-secured HTTPS"
  - source: "API Gateway"
    destination: "Identity Provider (IdP)"
    description: "Validates authentication and tokens"
    technology: "HTTPS / OIDC / OAuth 2.0"