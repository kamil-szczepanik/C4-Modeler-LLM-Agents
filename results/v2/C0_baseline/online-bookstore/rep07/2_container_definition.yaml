# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Shopper"
    description: "Browses the product catalog and purchases items."
  - type: "person"
    name: "Registered Customer"
    description: "Manages account, writes reviews, and makes purchases."
  - type: "person"
    name: "Site Administrator"
    description: "Manages site content, administration, and moderation."
  - type: "person"
    name: "Business Analyst"
    description: "Analyzes business metrics and data."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "Handles secure payment processing."
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "Manages fulfillment and shipping logistics."
  - type: "container"
    name: "Single Page Application (SPA)"
    technology: "React, TypeScript, Amazon CloudFront, S3"
    description: "Provides catalog browsing, secure checkout, reviews, and recommendations for users."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway"
    description: "Routes requests from the SPA to internal containers using secure protocols."
  - type: "container"
    name: "Catalog & Search Container"
    technology: "Go, gRPC, Amazon OpenSearch, Aurora PostgreSQL"
    description: "Handles product catalog browsing, search functionality, and related data storage."
  - type: "container"
    name: "Order & Checkout Container"
    technology: "Node.js, Spring Boot, Aurora PostgreSQL"
    description: "Manages secure checkout, orders, and isolated transactional data."
  - type: "container"
    name: "Recommendation Engine"
    technology: "Python, FastAPI"
    description: "Generates product recommendations by asynchronously consuming order events."
  - type: "container"
    name: "Customer Reviews & Ratings Container"
    technology: "Python, FastAPI, Amazon DynamoDB"
    description: "Manages customer reviews and ratings."
relationships:
  - source: "Shopper"
    destination: "Single Page Application (SPA)"
    description: "Browses catalog and interacts with UI"
    technology: "HTTPS / JSON"
  - source: "Registered Customer"
    destination: "Single Page Application (SPA)"
    description: "Manages account, writes reviews, and checkouts"
    technology: "HTTPS / JSON"
  - source: "Site Administrator"
    destination: "Single Page Application (SPA)"
    description: "Administers platform features"
    technology: "HTTPS / JSON"
  - source: "Business Analyst"
    destination: "Single Page Application (SPA)"
    description: "Views analytics and business reports"
    technology: "HTTPS / JSON"
  - source: "Single Page Application (SPA)"
    destination: "API Gateway"
    description: "Sends client requests"
    technology: "HTTPS / JSON"
  - source: "API Gateway"
    destination: "Catalog & Search Container"
    description: "Routes catalog and search requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Order & Checkout Container"
    description: "Routes order and checkout requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Recommendation Engine"
    description: "Routes recommendation queries"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Customer Reviews & Ratings Container"
    description: "Routes review and rating requests"
    technology: "gRPC over mTLS"
  - source: "Order & Checkout Container"
    destination: "External Payment Gateway"
    description: "Processes payments"
    technology: "HTTPS / REST"
  - source: "Order & Checkout Container"
    destination: "Third-Party Shipping APIs"
    description: "Coordinates fulfillment and shipping"
    technology: "HTTPS / REST"
  - source: "Order & Checkout Container"
    destination: "Recommendation Engine"
    description: "Emits order events asynchronously"
    technology: "Event Stream"