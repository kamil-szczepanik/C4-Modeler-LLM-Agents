level: component
scope: "Component diagram for the Customer Reviews & Ratings Container container"
parentContainer:
  name: "Customer Reviews & Ratings Container"
elements:
  - type: "component"
    name: "Review API Router"
    technology: "FastAPI, Pydantic, JWT"
    description: "Handles HTTP/gRPC requests, JWT validation, and Pydantic input sanitization."
  - type: "component"
    name: "Moderation Service"
    technology: "Python, AWS Comprehend, NLP"
    description: "Automated NLP pipeline for profanity and sentiment filtering."
  - type: "component"
    name: "Vote Processor"
    technology: "Python"
    description: "Isolated component handling atomic helpful votes and anti-sybil checks."
  - type: "component"
    name: "Rating Aggregator"
    technology: "AWS SQS, Python"
    description: "Asynchronous background worker using AWS SQS."
  - type: "component"
    name: "Review Data Access Layer"
    technology: "Boto3, Amazon DynamoDB, Amazon ElastiCache (Redis)"
    description: "Interfaces with Amazon DynamoDB and Amazon ElastiCache for data persistence and read-through caching."
  - type: "component"
    name: "Read Caching Layer"
    technology: "Amazon ElastiCache (Redis)"
    description: "In-memory caching cluster for aggregated ratings to maintain low-latency page loads."
relationships:
  - source: "API Gateway"
    destination: "Review API Router"
    description: "Routes requests via gRPC over mTLS"
  - source: "Review API Router"
    destination: "Moderation Service"
    description: "Internal in-memory calls"
  - source: "Review API Router"
    destination: "Vote Processor"
    description: "Internal in-memory calls"
  - source: "Vote Processor"
    destination: "Amazon DynamoDB"
    description: "TCP over AWS PrivateLink with KMS encryption"
  - source: "Review Data Access Layer"
    destination: "Amazon DynamoDB"
    description: "TCP over AWS PrivateLink with KMS encryption"
  - source: "Rating Aggregator"
    destination: "AWS SQS"
    description: "Asynchronous messaging"
  - source: "Review Data Access Layer"
    destination: "Amazon ElastiCache (Redis)"
    description: "Read-through caching over TLS"