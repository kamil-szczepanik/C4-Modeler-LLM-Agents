level: component
scope: "Component diagram for the Order & Checkout Container container"
parentContainer:
  name: "Order & Checkout Container"
elements:
  - type: "component"
    name: "Checkout Controller"
    technology: "Java 21 / Spring Boot"
    description: "Manages secure transactions and handles incoming checkout requests."
  - type: "component"
    name: "Cart & Pricing Engine"
    technology: "Java 21 / Spring Boot"
    description: "Calculates multi-currency pricing and manages cart state."
  - type: "component"
    name: "Order Orchestrator"
    technology: "Java 21 / Spring Boot"
    description: "Coordinates the checkout workflow and distributed transactions."
  - type: "component"
    name: "Payment Gateway Client"
    technology: "Java 21 / Spring Boot / HTTPS"
    description: "Integrates with external payment gateways for secure transaction processing."
  - type: "component"
    name: "Shipping & Fulfillment Client"
    technology: "Java 21 / Spring Boot / HTTPS"
    description: "Communicates with fulfillment services to handle shipping."
  - type: "component"
    name: "Event Publisher"
    technology: "Java 21 / Spring Boot"
    description: "Publishes asynchronous domain events using the Transactional Outbox pattern."
  - type: "component"
    name: "Order Repository"
    technology: "JDBC / JPA / Aurora PostgreSQL"
    description: "Provides persistence and transactional data integrity for orders."
  - type: "component"
    name: "API Gateway"
    technology: "External Gateway"
    description: "Entry point routing requests to the checkout controller via gRPC over mTLS."
  - type: "component"
    name: "AWS EventBridge / Kafka"
    technology: "Asynchronous Messaging"
    description: "Message broker for asynchronous event distribution with DLQ."
relationships:
  - source: "API Gateway"
    destination: "Checkout Controller"
    description: "gRPC over mTLS"
  - source: "Checkout Controller"
    destination: "Cart & Pricing Engine"
    description: "In-process Java method calls"
  - source: "Checkout Controller"
    destination: "Order Orchestrator"
    description: "In-process Java method calls"
  - source: "Order Orchestrator"
    destination: "Payment Gateway Client"
    description: "HTTPS / REST with Resilience4j Circuit Breakers"
  - source: "Order Orchestrator"
    destination: "Shipping & Fulfillment Client"
    description: "HTTPS / REST with Resilience4j Circuit Breakers"
  - source: "Order Orchestrator"
    destination: "Order Repository"
    description: "JDBC / JPA over TLS 1.3"
  - source: "Event Publisher"
    destination: "Order Repository"
    description: "JDBC / JPA over TLS 1.3"
  - source: "Event Publisher"
    destination: "AWS EventBridge / Kafka"
    description: "HTTPS"