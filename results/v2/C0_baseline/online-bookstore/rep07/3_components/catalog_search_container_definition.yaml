level: component
scope: "Component diagram for the Catalog & Search Container container"
parentContainer:
  name: "Catalog & Search Container"
elements:
  - type: "component"
    name: "Search API Handler"
    technology: "Go"
    description: "Powers high-performance product browsing, keyword search, and localized pricing, handling requests from the API Gateway."
  - type: "component"
    name: "Catalog Management Service"
    technology: "Go"
    description: "Manages catalog data and interacts directly with Aurora PostgreSQL."
  - type: "component"
    name: "Index Synchronizer"
    technology: "Go / AWS Lambda"
    description: "Synchronizes data between Aurora PostgreSQL and Amazon OpenSearch using CDC/Debezium."
  - type: "component"
    name: "Product Read Model Cache"
    technology: "Redis"
    description: "Powers low-latency product read caching and currency rate lookups."
  - type: "component"
    name: "Localization & Currency Resolver"
    technology: "Go"
    description: "Resolves localized pricing and currency details for users."
  - type: "component"
    name: "Search Analytics Emitter"
    technology: "Go"
    description: "Emits search analytics and telemetry asynchronously to Amazon Kinesis."
  - type: "component"
    name: "Amazon OpenSearch"
    technology: "Amazon OpenSearch"
    description: "Provides typo-tolerant keyword search and advanced filtering."
  - type: "component"
    name: "Aurora PostgreSQL"
    technology: "Aurora PostgreSQL"
    description: "Acts as the primary relational source of truth with multi-region replication."
  - type: "component"
    name: "Amazon Kinesis"
    technology: "Amazon Kinesis"
    description: "Enables asynchronous, non-blocking telemetry and search analytics streaming."
relationships:
  - source: "API Gateway"
    destination: "Search API Handler"
    description: "gRPC over mTLS"
  - source: "Search API Handler"
    destination: "Amazon OpenSearch"
    description: "REST/HTTPS"
  - source: "Catalog Management Service"
    destination: "Aurora PostgreSQL"
    description: "SQL/TCP"
  - source: "Index Synchronizer"
    destination: "Aurora PostgreSQL & Amazon OpenSearch"
    description: "CDC/Debezium"
  - source: "Search API Handler"
    destination: "Product Read Model Cache"
    description: "TCP/Redis Protocol"
  - source: "Search API Handler"
    destination: "Localization & Currency Resolver"
    description: "Internal gRPC"
  - source: "Search Analytics Emitter"
    destination: "Amazon Kinesis"
    description: "Async/TCP"