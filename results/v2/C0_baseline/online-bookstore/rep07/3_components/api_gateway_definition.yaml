level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Router / Reverse Proxy"
    technology: "Amazon CloudFront"
    description: "Handles TLS 1.3 termination, caching, and OpenAPI schema validation."
  - type: "component"
    name: "Auth & Policy Enforcer"
    technology: "AWS API Gateway Custom Authorizer"
    description: "Validates JWT tokens, manages rate limiting, and enforces OWASP Top-10 security controls (R-08)."
  - type: "component"
    name: "Request Transformer / Geo-Resolver"
    technology: "AWS Lambda / Edge Lambda"
    description: "Extracts client geo-location and injects multi-currency headers (USD, EUR, GBP)."
  - type: "component"
    name: "Resiliency & Fallback Orchestrator"
    technology: "AWS API Gateway / Lambda"
    description: "Handling circuit breaking, timeouts, and fallback payloads."
relationships:
  - source: "Edge Router / Reverse Proxy"
    destination: "Auth & Policy Enforcer"
    description: "Forwards validated traffic for security and token validation."
  - source: "Auth & Policy Enforcer"
    destination: "Request Transformer / Geo-Resolver"
    description: "Passes authenticated requests for context enhancement."
  - source: "Request Transformer / Geo-Resolver"
    destination: "Resiliency & Fallback Orchestrator"
    description: "Routes enriched requests through resiliency wrappers."
  - source: "Resiliency & Fallback Orchestrator"
    destination: "Catalog & Search Container"
    description: "Routes catalogue and search requests via gRPC over mTLS."
  - source: "Resiliency & Fallback Orchestrator"
    destination: "Order & Checkout Container"
    description: "Routes order and checkout requests via gRPC over mTLS."
  - source: "Resiliency & Fallback Orchestrator"
    destination: "Recommendation Engine"
    description: "Routes recommendation queries via gRPC over mTLS."
  - source: "Resiliency & Fallback Orchestrator"
    destination: "Customer Reviews & Ratings Container"
    description: "Routes review and rating requests via gRPC over mTLS."
  - source: "Resiliency & Fallback Orchestrator"
    destination: "External Systems"
    description: "Integrates with payment gateways and third-party shipping APIs via secure REST/HTTPS protocols."