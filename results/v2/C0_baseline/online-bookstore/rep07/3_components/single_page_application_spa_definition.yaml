level: component
scope: "Component diagram for the Single Page Application (SPA) container"
parentContainer:
  name: "Single Page Application (SPA)"
elements:
  - type: "component"
    name: "Routing & Shell Component"
    technology: "React Router, Zustand"
    description: "Manages application routing, shell layout, and decoupled global state management including local cart persistence."
  - type: "component"
    name: "Catalog & Search Component"
    technology: "React & TypeScript"
    description: "Delivers catalog browsing and search capabilities."
  - type: "component"
    name: "Checkout & Cart Component"
    technology: "React & TypeScript"
    description: "Handles secure checkout and cart management with resilient handling."
  - type: "component"
    name: "Recommendation & Reviews Component"
    technology: "React & TypeScript"
    description: "Displays product recommendations and user reviews."
  - type: "component"
    name: "Admin & Analytics Dashboard Component"
    technology: "React & TypeScript"
    description: "Provides administrative views and analytics dashboards."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios/Fetch with OpenAPI SDK"
    description: "Executes remote operations and communicates with backend services."
  - type: "person"
    name: "Shopper / Registered Customer / Admin"
    technology: "Browser"
    description: "Users who interact with the UI."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway"
    description: "Receives client requests and API calls from the SPA."
relationships:
  - source: "Shopper / Registered Customer / Admin"
    destination: "Single Page Application (SPA)"
    description: "Interacts with UI [HTTPS / JSON]"
  - source: "Single Page Application (SPA)"
    destination: "API Gateway"
    description: "Sends client requests and API calls [HTTPS / JSON]"
  - source: "Routing & Shell Component"
    destination: "Catalog & Search Component"
    description: "Renders views [In-memory]"
  - source: "Routing & Shell Component"
    destination: "Checkout & Cart Component"
    description: "Renders views [In-memory]"
  - source: "Routing & Shell Component"
    destination: "Recommendation & Reviews Component"
    description: "Renders views [In-memory]"
  - source: "Routing & Shell Component"
    destination: "Admin & Analytics Dashboard Component"
    description: "Renders views [In-memory]"
  - source: "Catalog & Search Component"
    destination: "API Client Layer"
    description: "Executes remote operations [HTTPS / JSON]"
  - source: "Checkout & Cart Component"
    destination: "API Client Layer"
    description: "Executes remote operations [HTTPS / JSON]"
  - source: "Recommendation & Reviews Component"
    destination: "API Client Layer"
    description: "Executes remote operations [HTTPS / JSON]"
  - source: "Admin & Analytics Dashboard Component"
    destination: "API Client Layer"
    description: "Executes remote operations [HTTPS / JSON]"