level: component
scope: "Component diagram for the Recommendation Engine container"
parentContainer:
  name: "Recommendation Engine"
elements:
  - type: "component"
    name: "API Router"
    technology: "Python FastAPI"
    description: "Exposes gRPC endpoints for recommendation queries with Pydantic schema validation."
  - type: "component"
    name: "Inference Pipeline"
    technology: "Python PyTorch"
    description: "Computes personalized matrix factorization models with signed artifact integrity."
  - type: "component"
    name: "Event Consumer"
    technology: "Python Kafka Consumer"
    description: "Ingests anonymized order events via Amazon MSK."
  - type: "component"
    name: "Fallback & Caching Manager"
    technology: "Redis"
    description: "Caches global trending sets and handles fallback states."
  - type: "component"
    name: "Business Rules & Merchandising Filter"
    technology: "Python"
    description: "Evaluates local stock state replicas and suppression rules."
relationships:
  - source: "API Gateway"
    destination: "API Router"
    description: "Routes recommendation queries via gRPC over mTLS."
  - source: "Order & Checkout Container"
    destination: "Event Consumer"
    description: "Emits asynchronous order events via Amazon MSK."
  - source: "API Router"
    destination: "Business Rules & Merchandising Filter"
    description: "Evaluates candidate lists via in-process calls."
  - source: "Business Rules & Merchandising Filter"
    destination: "Fallback & Caching Manager"
    description: "Queries fallback and trending data via Redis protocol."
  - source: "Business Rules & Merchandising Filter"
    destination: "Local Stock Cache"
    description: "Validates item availability using asynchronously replicated state."