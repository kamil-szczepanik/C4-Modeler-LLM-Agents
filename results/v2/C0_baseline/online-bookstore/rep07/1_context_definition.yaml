level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "A globally distributed e-commerce platform built to handle physical and electronic book sales, recommendations, and reviews with high scalability, strict security compliance, and multi-currency support."
elements:
  - type: "person"
    name: "Customer (Shopper)"
    description: "Browses and purchases physical and electronic books."
  - type: "person"
    name: "Registered Customer/Reviewer"
    description: "Manages account, writes reviews, and interacts with the platform."
  - type: "person"
    name: "Site Administrator/Content Moderator"
    description: "Manages site content, moderation, and administrative tasks."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Handles payment processing (Stripe/PayPal)."
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "Manages fulfillment and shipping logistics (FedEx/UPS)."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Handles authentication and identity services (Auth0/AWS Cognito)."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Sends notifications and alerts to users."
  - type: "externalSystem"
    name: "Supplier Feeds/ERP"
    description: "Provides inventory and supplier batch data."
relationships:
  - source: "Customer (Shopper)"
    destination: "Online Bookstore"
    description: "Browses and purchases books via CDN/Edge"
    technology: "HTTPS / TLS 1.3"
  - source: "Registered Customer/Reviewer"
    destination: "Online Bookstore"
    description: "Manages account, writes reviews, and authenticates"
    technology: "OAuth2 / OIDC over HTTPS"
  - source: "Site Administrator/Content Moderator"
    destination: "Online Bookstore"
    description: "Moderates content and manages site operations"
    technology: "HTTPS"
  - source: "Online Bookstore"
    destination: "Payment Gateway"
    description: "Processes transactions"
    technology: "HTTPS / REST"
  - source: "Online Bookstore"
    destination: "Third-Party Shipping APIs"
    description: "Coordinates shipping and fulfillment"
    technology: "HTTPS / REST"
  - source: "Online Bookstore"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OAuth2 / OIDC over HTTPS"
  - source: "Online Bookstore"
    destination: "Notification Service"
    description: "Triggers user notifications"
    technology: "HTTPS / REST Webhooks"
  - source: "Supplier Feeds/ERP"
    destination: "Online Bookstore"
    description: "Provides inventory and product updates"
    technology: "Secure SFTP / S3 Batch Drops"