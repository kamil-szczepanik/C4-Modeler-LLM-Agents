level: component
scope: "Component diagram for the Notification Service container"
parentContainer:
  name: "Notification Service"
elements:
  - type: "component"
    name: "Event Consumer Component"
    technology: "Node.js with AWS SQS SDK"
    description: "Consumes asynchronous notification events."
  - type: "component"
    name: "Preference Engine Component"
    technology: "Node.js with Memory Cache and Amazon Aurora PostgreSQL"
    description: "Evaluates user consent and communication settings."
  - type: "component"
    name: "Dispatcher Router Component"
    technology: "Node.js"
    description: "Routes allowed messages."
  - type: "component"
    name: "Template Engine Component"
    technology: "Node.js with Handlebars and MJML"
    description: "Renders localized message templates."
  - type: "component"
    name: "Provider Integration Adapters"
    technology: "Node.js with Axios"
    description: "Sends formatted payloads to external providers."
  - type: "component"
    name: "Webhook Receiver Component"
    technology: "Node.js with Express and Amazon ElastiCache Redis"
    description: "Receives delivery status and engagement webhooks."
relationships:
  - source: "Amazon SQS"
    destination: "Event Consumer Component"
    description: "Consumes asynchronous notification events [AMQP / Event Stream]"
  - source: "Event Consumer Component"
    destination: "Preference Engine Component"
    description: "Evaluates user consent and communication settings [In-memory call]"
  - source: "Preference Engine Component"
    destination: "Dispatcher Router Component"
    description: "Routes allowed messages [In-memory call]"
  - source: "Dispatcher Router Component"
    destination: "Template Engine Component"
    description: "Renders localized message templates [In-memory call]"
  - source: "Template Engine Component"
    destination: "Provider Integration Adapters"
    description: "Sends formatted payloads [In-memory call]"
  - source: "Provider Integration Adapters"
    destination: "SendGrid/Twilio"
    description: "Dispatches emails and SMS [REST / HTTPS]"
  - source: "SendGrid/Twilio"
    destination: "Webhook Receiver Component"
    description: "Sends delivery status and engagement webhooks [REST / HTTPS via Amazon API Gateway]"
  - source: "Webhook Receiver Component"
    destination: "Segment/Snowflake"
    description: "Streams engagement analytics [SDK / HTTPS]"