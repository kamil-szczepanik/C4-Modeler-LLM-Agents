level: component
scope: "Component diagram for the Checkout Service container"
parentContainer:
  name: "Checkout Service"
elements:
  - type: "component"
    name: "Cart & Pricing Engine Component"
    technology: "Spring Service"
    description: "Managing localized tax calculations and pricing."
  - type: "component"
    name: "Payment Orchestrator Component"
    technology: "Spring Integration"
    description: "Managing Stripe/PayPal, Apple Pay, and SEPA."
  - type: "component"
    name: "Fulfillment Coordinator Component"
    technology: "Spring Cloud OpenFeign"
    description: "Handling FedEx/DHL shipping integrations."
  - type: "component"
    name: "Order Event Publisher Component"
    technology: "Spring Cloud Stream"
    description: "Emitting domain events to Amazon EventBridge."
  - type: "component"
    name: "Amazon Aurora (PostgreSQL)"
    technology: "PostgreSQL"
    description: "Transactional data store with regional read replicas."
  - type: "component"
    name: "AWS Secrets Manager"
    technology: "AWS Service"
    description: "Secure injection of API keys and webhook secrets."
  - type: "component"
    name: "Amazon API Gateway"
    technology: "AWS Service"
    description: "Routes checkout requests [mTLS via AWS App Mesh and internal VPC endpoints]."
  - type: "component"
    name: "Stripe/PayPal"
    technology: "External API"
    description: "Processes tokenized payments and webhooks."
  - type: "component"
    name: "FedEx/DHL"
    technology: "External API"
    description: "Coordinates physical book fulfillment."
  - type: "component"
    name: "Amazon EventBridge / SQS"
    technology: "AWS Service"
    description: "Publishes domain events (OrderCreated, OrderCompleted, CartAbandoned)."
relationships:
  - source: "Amazon API Gateway"
    destination: "Checkout Service"
    description: "Routes checkout requests [mTLS via AWS App Mesh and internal VPC endpoints]"
  - source: "Payment Orchestrator Component"
    destination: "Stripe/PayPal"
    description: "Processes tokenized payments and webhooks [Synchronous HTTPS with HMAC verification]"
  - source: "Fulfillment Coordinator Component"
    destination: "FedEx/DHL"
    description: "Coordinates physical book fulfillment [REST / HTTPS]"
  - source: "Order Event Publisher Component"
    destination: "Amazon EventBridge / SQS"
    description: "Publishes domain events (OrderCreated, OrderCompleted, CartAbandoned) [AMQP / Event Stream]"
  - source: "Cart & Pricing Engine Component"
    destination: "Amazon Aurora (PostgreSQL)"
    description: "Reads and writes transactional data [TLS-encrypted connection over JDBC]"