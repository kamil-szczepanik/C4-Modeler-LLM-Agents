level: component
scope: "Component diagram for the Amazon EventBridge / SQS container"
parentContainer:
  name: "Amazon EventBridge / SQS"
elements:
  - type: "component"
    name: "Event Bus"
    technology: "Amazon EventBridge"
    description: "Central JSON-based router for publishing and filtering domain events."
  - type: "component"
    name: "Order Processing Queue"
    technology: "Amazon SQS"
    description: "Decouples checkout services from downstream fulfillment and buffers order payloads."
  - type: "component"
    name: "Notification Queue"
    technology: "Amazon SQS"
    description: "Queues alerts and messages for customer notifications."
  - type: "component"
    name: "Dead-Letter Queue"
    technology: "Amazon SQS"
    description: "Captures poisoned or failed messages for administrative debugging."
relationships:
  - source: "Event Bus"
    destination: "Order Processing Queue"
    description: "Routes filtered domain events via EventBridge Rule targets [AWS SQS API]"