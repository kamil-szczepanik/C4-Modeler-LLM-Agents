level: component
scope: "Component diagram for the Amazon API Gateway container"
parentContainer:
  name: "Amazon API Gateway"
elements:
  - type: "component"
    name: "Edge Router & SSL Terminus"
    technology: "AWS Edge locations / Amazon API Gateway"
    description: "Handles TLS termination and global traffic distribution via AWS Edge locations."
  - type: "component"
    name: "JWT Validator Authorizer"
    technology: "Auth0 / AWS Cognito / AWS Lambda Authorizer"
    description: "Evaluates OAuth2/JWT tokens against Auth0/AWS Cognito with strict claim validation and guest session support."
  - type: "component"
    name: "WAF & Rate Limiter Component"
    technology: "AWS WAF & AWS Shield"
    description: "Enforces AWS WAF managed rules, OWASP Top-10 mitigations, and tier-based throttling with custom fallback responses."
  - type: "component"
    name: "API Route Dispatcher"
    technology: "AWS App Mesh & Private VPC Links"
    description: "Forwards validated traffic to internal backend containers via private VPC links using mTLS."
relationships:
  - source: "Single Page App (SPA)"
    destination: "Edge Router & SSL Terminus"
    description: "Client-to-backend communication via HTTPS / REST."
  - source: "Store Administrators"
    destination: "Edge Router & SSL Terminus"
    description: "Accesses management operations via HTTPS with mTLS."
  - source: "Edge Router & SSL Terminus"
    destination: "WAF & Rate Limiter Component"
    description: "Inspects incoming traffic for security rules and rate limiting."
  - source: "WAF & Rate Limiter Component"
    destination: "JWT Validator Authorizer"
    description: "Passes filtered requests for token validation."
  - source: "JWT Validator Authorizer"
    destination: "Amazon API Gateway"
    description: "Authenticates requests via OAuth2/OpenID Connect with Auth0/AWS Cognito."
  - source: "JWT Validator Authorizer"
    destination: "API Route Dispatcher"
    description: "Forwards authenticated and authorized requests."
  - source: "API Route Dispatcher"
    destination: "Node.js BFF"
    description: "Routes public and dynamic catalogue traffic via mTLS and internal VPC endpoints."
  - source: "API Route Dispatcher"
    destination: "Checkout Service"
    description: "Routes secure transaction requests via mTLS and internal VPC endpoints."
  - source: "API Route Dispatcher"
    destination: "Recommendations Service"
    description: "Routes recommendation requests via mTLS and internal VPC endpoints."