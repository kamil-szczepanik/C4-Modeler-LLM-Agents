level: component
scope: "Component diagram for the Amazon ElastiCache (Redis) container"
parentContainer:
  name: "Amazon ElastiCache (Redis)"
elements:
  - type: "component"
    name: "In-Memory Data Store Engine"
    technology: "Redis OSS / Valkey"
    description: "Executes high-throughput key-value operations and data structures for session management, fast catalog caching, shopping cart persistence, and distributed locking."
  - type: "component"
    name: "Replication Manager"
    technology: "AWS ElastiCache Multi-AZ"
    description: "Manages multi-AZ replication with automatic failover to guarantee high availability and uptime requirements."
  - type: "component"
    name: "Cluster Node Manager"
    technology: "AWS ElastiCache"
    description: "Manages cluster nodes, scaling, and private subnet isolation."
  - type: "component"
    name: "Session Store Data Structure"
    technology: "Redis Hash maps (`user:session:<id>`)"
    description: "Stores user session data for fast retrieval by the Node.js BFF."
  - type: "component"
    name: "Cart and Distributed Lock Store Data Structure"
    technology: "Redis Strings/Keys (`cart:<id>`, `lock:item:<id>`)"
    description: "Handles shopping cart persistence and distributed locking for the Checkout Service."
relationships:
  - source: "Node.js BFF"
    destination: "In-Memory Data Store Engine"
    description: "Reads and writes session data and cache via RESP v3 over TLS 1.3 [TLS-encrypted connection / Port 6379]"
  - source: "Checkout Service"
    destination: "In-Memory Data Store Engine"
    description: "Manages distributed locking and shopping cart persistence via RESP v3 over TLS 1.3 [TCP / Port 6379]"