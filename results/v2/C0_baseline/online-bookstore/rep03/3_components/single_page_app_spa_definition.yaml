level: component
scope: "Component diagram for the Single Page App (SPA) container"
parentContainer:
  name: "Single Page App (SPA)"
elements:
  - type: "component"
    name: "Customers (Shoppers) & Guest Shoppers"
    technology: "End User"
    description: "End users browsing catalogs, managing carts, and purchasing books."
  - type: "component"
    name: "Catalog & Search Module"
    technology: "React, Redux Toolkit"
    description: "Component handling keyword searches and local caching."
  - type: "component"
    name: "Cart & Multi-Currency State Manager"
    technology: "React Context, Zustand"
    description: "Component managing local cart state and currency display (USD, EUR, GBP)."
  - type: "component"
    name: "Checkout & Auth Client"
    technology: "React Router, Auth0 SDK"
    description: "Component handling authentication and checkout handoffs."
  - type: "component"
    name: "Recommendation & Review Widget"
    technology: "React"
    description: "Component rendering asynchronous product recommendations and 5-star ratings."
  - type: "component"
    name: "Promotions & Discount Client"
    technology: "Zustand"
    description: "Component managing coupon codes and promotional banners."
  - type: "component"
    name: "Consent & Privacy Module"
    technology: "React"
    description: "Component gating tracking initialization for GDPR and CCPA compliance."
  - type: "component"
    name: "Amazon API Gateway"
    technology: "Amazon API Gateway"
    description: "Backend API gateway for client-to-backend communication."
  - type: "component"
    name: "Auth0"
    technology: "Auth0"
    description: "Identity provider for user authentication."
relationships:
  - source: "Customers (Shoppers) & Guest Shoppers"
    destination: "Single Page App (SPA)"
    description: "Browses store, manages cart, and views recommendations via [HTTPS]"
  - source: "Single Page App (SPA)"
    destination: "Amazon API Gateway"
    description: "Client-to-backend communication via [HTTPS / REST]"
  - source: "Checkout & Auth Client"
    destination: "Auth0"
    description: "User authentication via [OAuth 2.0 / OIDC]"