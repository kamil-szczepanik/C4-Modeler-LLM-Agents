level: component
scope: "Component diagram for the Amazon Aurora (PostgreSQL) container"
parentContainer:
  name: "Amazon Aurora (PostgreSQL)"
elements:
  - type: "component"
    name: "Order Management Schema"
    technology: "PostgreSQL Logical Schema"
    description: "Isolates and manages order data ensuring zero-loss financial transactions."
  - type: "component"
    name: "Inventory Catalog Schema"
    technology: "PostgreSQL Logical Schema"
    description: "Manages secure inventory data and catalog information."
  - type: "component"
    name: "User Identity Schema"
    technology: "PostgreSQL Logical Schema"
    description: "Isolates user identity and authentication data."
  - type: "component"
    name: "Primary Writer"
    technology: "Amazon Aurora PostgreSQL Writer"
    description: "Handles primary write traffic and receives automated CI/CD schema migrations."
  - type: "component"
    name: "Read Replicas"
    technology: "Amazon Aurora PostgreSQL Read Replicas"
    description: "Handles regional read-heavy queries and inventory checks."
relationships:
  - source: "Order Management Schema"
    destination: "Primary Writer"
    description: "Persists transactional order data"
  - source: "Inventory Catalog Schema"
    destination: "Primary Writer"
    description: "Persists inventory updates"
  - source: "User Identity Schema"
    destination: "Primary Writer"
    description: "Persists user identity records"
  - source: "Primary Writer"
    destination: "Read Replicas"
    description: "Replicates data for read-heavy operations"