level: component
scope: "Component diagram for the Node.js BFF container"
parentContainer:
  name: "Node.js BFF"
elements:
  - type: "component"
    name: "API Router"
    technology: "Express.js"
    description: "Routes incoming client requests and enforces mTLS and TLS 1.3."
  - type: "component"
    name: "GraphQL Federation / Aggregator"
    technology: "Apollo Server, GraphQL"
    description: "Aggregates downstream microservice data to minimize client payload sizes."
  - type: "component"
    name: "Session & State Manager"
    technology: "Node.js, Amazon ElastiCache Redis"
    description: "Manages user session and cart data via TLS-encrypted connections."
  - type: "component"
    name: "Event Dispatcher"
    technology: "Node.js SDK"
    description: "Publishes domain events to Amazon EventBridge and SQS."
relationships:
  - source: "API Router"
    destination: "GraphQL Federation / Aggregator"
    description: "Internal routing via HTTP/2"
  - source: "GraphQL Federation / Aggregator"
    destination: "Session & State Manager"
    description: "Fetches session/cart data via TCP+TLS"
  - source: "GraphQL Federation / Aggregator"
    destination: "Checkout Service"
    description: "Federated queries with circuit breakers via gRPC or HTTP/2"
  - source: "GraphQL Federation / Aggregator"
    destination: "Recommendations Service"
    description: "Federated queries with circuit breakers via gRPC or HTTP/2"
  - source: "GraphQL Federation / Aggregator"
    destination: "Notification Service"
    description: "Federated queries with circuit breakers via gRPC or HTTP/2"
  - source: "Event Dispatcher"
    destination: "Amazon EventBridge / SQS"
    description: "Publishes domain events via HTTPS"