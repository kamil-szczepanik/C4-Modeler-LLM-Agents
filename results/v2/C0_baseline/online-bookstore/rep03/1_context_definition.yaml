level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore System"
  description: "Global e-commerce platform designed to sell physical and electronic books with recommendations, reviews, and high-scale secure retail operations."
elements:
  - type: "person"
    name: "Customers (Shoppers)"
    description: "End users browsing books, managing carts, and completing checkouts via web and mobile interfaces."
  - type: "person"
    name: "Book Authors/Publishers"
    description: "Stakeholders who provide content and manage book listings within the ecosystem."
  - type: "person"
    name: "Store Administrators"
    description: "System managers accessing the platform to oversee operations using strict security protocols."
  - type: "externalSystem"
    name: "Stripe/PayPal"
    description: "External payment gateway handling secure checkout and financial transactions."
  - type: "externalSystem"
    name: "FedEx/DHL"
    description: "External shipping providers handling physical book delivery."
  - type: "externalSystem"
    name: "Auth0/AWS Cognito"
    description: "Identity provider managing authentication and user identity."
  - type: "externalSystem"
    name: "SendGrid/Twilio"
    description: "Notification provider sending alerts and messages to users."
  - type: "externalSystem"
    name: "Segment/Snowflake"
    description: "Analytics and BI tools processing event streams for business intelligence."
relationships:
  - source: "Customers (Shoppers)"
    destination: "Online Bookstore System"
    description: "Browse, manage cart, and checkout"
    technology: "HTTPS (Web/Mobile)"
  - source: "Store Administrators"
    destination: "Online Bookstore System"
    description: "Access system for administration and management"
    technology: "HTTPS with mTLS and hardware-backed MFA"
  - source: "Online Bookstore System"
    destination: "Stripe/PayPal"
    description: "Process checkout and payments"
    technology: "HTTPS/REST APIs"
  - source: "Online Bookstore System"
    destination: "FedEx/DHL"
    description: "Coordinate shipping and fulfillment"
    technology: "REST/Webhooks with HMAC signature verification"
  - source: "Online Bookstore System"
    destination: "SendGrid/Twilio"
    description: "Send notifications to users"
    technology: "REST/Webhooks with HMAC signature verification"
  - source: "Online Bookstore System"
    destination: "Segment/Snowflake"
    description: "Push event data for analytics"
    technology: "Kinesis/Kafka"