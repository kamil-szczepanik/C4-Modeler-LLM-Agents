level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Customers (Shoppers)"
    description: "End users browsing books, managing carts, and completing checkouts via web and mobile interfaces."
  - type: "person"
    name: "Book Authors/Publishers"
    description: "Stakeholders who provide content and manage book listings within the ecosystem."
  - type: "person"
    name: "Store Administrators"
    description: "System managers accessing the platform to oversee operations using strict security protocols."
  - type: "externalSystem"
    name: "Stripe/PayPal"
    description: "External payment gateway handling secure checkout and financial transactions."
  - type: "externalSystem"
    name: "FedEx/DHL"
    description: "External shipping providers handling physical book delivery."
  - type: "externalSystem"
    name: "Auth0/AWS Cognito"
    description: "Identity provider managing authentication and user identity."
  - type: "externalSystem"
    name: "SendGrid/Twilio"
    description: "Notification provider sending alerts and messages to users."
  - type: "externalSystem"
    name: "Segment/Snowflake"
    description: "Analytics and BI tools processing event streams for business intelligence."
  - type: "container"
    name: "Single Page App (SPA)"
    technology: "React, Amazon CloudFront, S3"
    description: "Frontend container for static asset delivery and low-latency global rendering."
  - type: "container"
    name: "Amazon API Gateway"
    technology: "Amazon API Gateway"
    description: "Routing container for rate limiting, SSL termination, and OAuth2/JWT authentication."
  - type: "container"
    name: "Node.js BFF"
    technology: "Node.js, AWS ECS (Fargate)"
    description: "Backend for Frontend service coordinating client requests."
  - type: "container"
    name: "Checkout Service"
    technology: "Java, Spring Boot, AWS ECS (Fargate)"
    description: "Backend service handling secure payment processing and orders."
  - type: "container"
    name: "Recommendations Service"
    technology: "Python, FastAPI, AWS ECS (Fargate)"
    description: "Backend service providing personalized book recommendations."
  - type: "container"
    name: "Notification Service"
    technology: "Node.js, AWS ECS (Fargate)"
    description: "Dedicated service running on AWS ECS to send user alerts."
  - type: "container"
    name: "Amazon Aurora (PostgreSQL)"
    technology: "Amazon Aurora PostgreSQL"
    description: "Transactional data store with Aurora Global Databases."
  - type: "container"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache Redis"
    description: "In-memory data store for sessions and caching."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "NoSQL data store for recommendations."
  - type: "container"
    name: "Amazon EventBridge / SQS"
    technology: "Amazon EventBridge, SQS"
    description: "Event broker for asynchronous event publishing and consumption."
relationships:
  - source: "Customers (Shoppers)"
    destination: "Single Page App (SPA)"
    description: "Browses store, manages cart, and views recommendations"
    technology: "HTTPS"
  - source: "Store Administrators"
    destination: "Amazon API Gateway"
    description: "Accesses management operations"
    technology: "HTTPS with mTLS"
  - source: "Single Page App (SPA)"
    destination: "Amazon API Gateway"
    description: "Client-to-backend communication"
    technology: "HTTPS / REST"
  - source: "Amazon API Gateway"
    destination: "Node.js BFF"
    description: "Routes client requests"
    technology: "mTLS via AWS App Mesh and internal VPC endpoints"
  - source: "Amazon API Gateway"
    destination: "Checkout Service"
    description: "Routes checkout requests"
    technology: "mTLS via AWS App Mesh and internal VPC endpoints"
  - source: "Amazon API Gateway"
    destination: "Recommendations Service"
    description: "Routes recommendation requests"
    technology: "mTLS via AWS App Mesh and internal VPC endpoints"
  - source: "Checkout Service"
    destination: "Stripe/PayPal"
    description: "Secure payment processing"
    technology: "Synchronous HTTPS"
  - source: "Node.js BFF"
    destination: "Amazon EventBridge / SQS"
    description: "Publishes asynchronous events"
    technology: "AMQP / Event Stream"
  - source: "Checkout Service"
    destination: "Amazon EventBridge / SQS"
    description: "Publishes order events"
    technology: "AMQP / Event Stream"
  - source: "Recommendations Service"
    destination: "Amazon EventBridge / SQS"
    description: "Consumes and publishes recommendation events"
    technology: "AMQP / Event Stream"
  - source: "Notification Service"
    destination: "Amazon EventBridge / SQS"
    description: "Consumes notification events"
    technology: "AMQP / Event Stream"
  - source: "Checkout Service"
    destination: "Amazon Aurora (PostgreSQL)"
    description: "Reads and writes transactional data"
    technology: "TLS-encrypted connection"
  - source: "Node.js BFF"
    destination: "Amazon ElastiCache (Redis)"
    description: "Reads and writes session data and cache"
    technology: "TLS-encrypted connection"
  - source: "Recommendations Service"
    destination: "Amazon DynamoDB"
    description: "Reads and writes recommendation data"
    technology: "TLS-encrypted connection"
  - source: "Notification Service"
    destination: "SendGrid/Twilio"
    description: "Sends notifications to users"
    technology: "REST / HTTPS"
  - source: "Checkout Service"
    destination: "FedEx/DHL"
    description: "Coordinates physical book fulfillment"
    technology: "REST / HTTPS"
  - source: "Checkout Service"
    destination: "Segment/Snowflake"
    description: "Pushes event data for analytics"
    technology: "Kinesis / Kafka / HTTPS"
  - source: "Amazon API Gateway"
    destination: "Auth0/AWS Cognito"
    description: "Authenticates requests via OAuth2/JWT"
    technology: "HTTPS / OpenID Connect"