level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Shopper"
    description: "External human user interacting with the platform for browsing, cart management, checkout, and reviews."
  - type: "person"
    name: "Author/Publisher"
    description: "External human user interacting with the platform."
  - type: "person"
    name: "Administrator"
    description: "External human user administering the platform."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system processing secure financial transactions."
  - type: "externalSystem"
    name: "Third-Party Shipping API"
    description: "External system handling order fulfillment and shipping logistics."
  - type: "externalSystem"
    name: "Tax & Compliance Service"
    description: "External system calculating regional taxes and ensuring compliance."
  - type: "container"
    name: "Single Page Application (SPA)"
    technology: "React / TypeScript, Amazon S3, Amazon CloudFront"
    description: "Frontend frontend hosted globally for catalogue browsing, cart management, checkout, reviews, and recommendations."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway"
    description: "Single secure entry point providing rate limiting and JWT validation."
  - type: "container"
    name: "Catalog & Search Container"
    technology: "Spring Boot, Java, Amazon ECS Fargate"
    description: "Service handling catalog searches and browse functionality."
  - type: "container"
    name: "Checkout & Order Container"
    technology: "Spring Boot, Java, Amazon ECS Fargate"
    description: "Service managing checkout and order processes."
  - type: "container"
    name: "Recommendation Service"
    technology: "Python, FastAPI, Amazon ECS Fargate"
    description: "Service providing personalized book recommendations."
  - type: "container"
    name: "Shipping & Payment Integration Worker"
    technology: "AWS Lambda, Amazon SQS"
    description: "Background workers for asynchronous shipping and payment processing."
  - type: "container"
    name: "Data Stores"
    technology: "Amazon Aurora PostgreSQL, Amazon DynamoDB, AWS KMS"
    description: "Persists transactional data and recommendations securely."
relationships:
  - source: "Shopper"
    destination: "Single Page Application (SPA)"
    description: "Accesses frontend application"
    technology: "HTTPS/REST"
  - source: "Author/Publisher"
    destination: "Single Page Application (SPA)"
    description: "Accesses platform interface"
    technology: "HTTPS/REST"
  - source: "Administrator"
    destination: "Single Page Application (SPA)"
    description: "Accesses management interface"
    technology: "HTTPS/REST"
  - source: "Single Page Application (SPA)"
    destination: "API Gateway"
    description: "Communicates via REST and gRPC"
    technology: "HTTPS/REST and gRPC"
  - source: "API Gateway"
    destination: "Catalog & Search Container"
    description: "Routes synchronously"
    technology: "REST"
  - source: "API Gateway"
    destination: "Checkout & Order Container"
    description: "Routes synchronously"
    technology: "REST"
  - source: "API Gateway"
    destination: "Recommendation Service"
    description: "Routes synchronously"
    technology: "gRPC"
  - source: "Checkout & Order Container"
    destination: "Shipping & Payment Integration Worker"
    description: "Communicates asynchronously for background processing"
    technology: "AWS SQS"
  - source: "Checkout & Order Container"
    destination: "Tax & Compliance Service"
    description: "Calls for tax calculation and compliance"
    technology: "HTTPS over AWS PrivateLink"
  - source: "Catalog & Search Container"
    destination: "Data Stores"
    description: "Persists state"
    technology: "AWS KMS encryption"
  - source: "Checkout & Order Container"
    destination: "Data Stores"
    description: "Persists state"
    technology: "AWS KMS encryption"
  - source: "Recommendation Service"
    destination: "Data Stores"
    description: "Persists state"
    technology: "AWS KMS encryption"
  - source: "Shipping & Payment Integration Worker"
    destination: "Payment Gateway"
    description: "Integrates for payment processing"
    technology: "HTTPS"
  - source: "Shipping & Payment Integration Worker"
    destination: "Third-Party Shipping API"
    description: "Integrates for shipping logistics"
    technology: "HTTPS"