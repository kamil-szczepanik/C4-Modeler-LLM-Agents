level: component
scope: "Component diagram for the Data Stores container"
parentContainer:
  name: "Data Stores"
elements:
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL (Multi-AZ / Multi-Region)"
    description: "Handles ACID transactional data, orders, and reviews with Multi-AZ and Multi-Region capabilities."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB (Global Tables)"
    description: "Provides ultra-low latency storage for shopping carts, sessions, and recommendation vectors using Global Tables."
  - type: "component"
    name: "Amazon RDS Proxy"
    technology: "Amazon RDS Proxy"
    description: "Manages and pools database connections to prevent connection exhaustion during traffic surges."
  - type: "component"
    name: "AWS Secrets Manager"
    technology: "AWS Secrets Manager"
    description: "Manages and retrieves database credentials and system secrets securely."
  - type: "component"
    name: "AWS KMS & CloudTrail"
    technology: "AWS KMS / Amazon CloudTrail"
    description: "Handles encryption at rest/transit, Customer Managed Key (CMK) management, and audit logging."
relationships:
  - source: "Amazon Aurora PostgreSQL"
    destination: "AWS KMS & CloudTrail"
    description: "API Calls for Encryption/Decryption and CMK Management"
  - source: "Amazon DynamoDB"
    destination: "AWS KMS & CloudTrail"
    description: "API Calls for Encryption/Decryption and CMK Management"
  - source: "Amazon RDS Proxy"
    destination: "Amazon Aurora PostgreSQL"
    description: "Proxies TLS 1.3 / SQL connections via IAM Database Authentication"