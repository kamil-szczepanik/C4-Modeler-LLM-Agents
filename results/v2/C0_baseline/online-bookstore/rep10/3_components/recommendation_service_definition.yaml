level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "API Router / Controller"
    technology: "FastAPI, Pydantic"
    description: "FastAPI component handling incoming gRPC requests and Pydantic input validation."
  - type: "component"
    name: "Recommendation Engine"
    technology: "Python"
    description: "Python-based algorithmic component executing collaborative filtering and matrix calculations."
  - type: "component"
    name: "Event Consumer"
    technology: "Kafka, SQS"
    description: "Asynchronous Kafka/SQS client ingesting real-time clickstream and cart events."
  - type: "component"
    name: "Data Access Repository"
    technology: "SQLAlchemy, Asyncpg"
    description: "SQLAlchemy/Asyncpg interface to regional data stores."
  - type: "component"
    name: "Inventory & Pricing Filter Interceptor"
    technology: "Python Middleware"
    description: "Middleware filtering out-of-stock items and multi-currency pricing flags (USD, EUR, GBP)."
  - type: "component"
    name: "Data Stores"
    technology: "Amazon DynamoDB, Amazon S3"
    description: "Amazon DynamoDB global tables and Amazon S3 for model weights."
  - type: "component"
    name: "API Gateway"
    technology: "gRPC, mTLS"
    description: "Routes incoming traffic synchronously via gRPC (mTLS)."
  - type: "component"
    name: "Event Bus"
    technology: "AMQP, Kafka"
    description: "Ingests real-time clickstream events via AMQP/Kafka protocol."
relationships:
  - source: "API Gateway"
    destination: "API Router / Controller"
    description: "Routes incoming traffic synchronously via gRPC (mTLS)."
  - source: "Event Bus"
    destination: "Event Consumer"
    description: "Ingests real-time clickstream events via AMQP/Kafka protocol."
  - source: "API Router / Controller"
    destination: "Recommendation Engine"
    description: "Executes in-process method calls [Python]."
  - source: "Recommendation Engine"
    destination: "Inventory & Pricing Filter Interceptor"
    description: "Passes raw candidate lists [Python]."
  - source: "Inventory & Pricing Filter Interceptor"
    destination: "Data Access Repository"
    description: "Fetches localized stock status [TCP/TLS]."
  - source: "Recommendation Engine"
    destination: "Data Access Repository"
    description: "Queries embeddings and historical interactions [TCP/TLS]."