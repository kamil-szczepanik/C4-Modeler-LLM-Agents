level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "WAF and Edge Security Router"
    technology: "AWS WAF, Amazon CloudFront, Amazon Route 53"
    description: "Inspects incoming traffic for OWASP Top-10 vulnerabilities, applies rate-limiting, and routes DNS queries globally."
  - type: "component"
    name: "API Routing and Validation Engine"
    technology: "AWS API Gateway"
    description: "Validates JWT tokens, enforces request schemas, and routes requests to downstream microservices."
  - type: "component"
    name: "Asynchronous Integration Dispatcher"
    technology: "AWS Lambda, Amazon SQS"
    description: "Handles asynchronous calls to third-party payment, shipping, and tax APIs via message queues."
relationships:
  - source: "WAF and Edge Security Router"
    destination: "API Routing and Validation Engine"
    description: "Forwards filtered HTTPS requests"
  - source: "API Routing and Validation Engine"
    destination: "Asynchronous Integration Dispatcher"
    description: "Offloads third-party API traffic using"