level: component
scope: "Component diagram for the Single Page Application (SPA) container"
parentContainer:
  name: "Single Page Application (SPA)"
elements:
  - type: "component"
    name: "Router & Auth Guard Component"
    technology: "React Router"
    description: "Role-based route protection and navigation management."
  - type: "component"
    name: "Catalog & Search Component"
    technology: "Redux Toolkit"
    description: "Browsing and keyword search functionality for books (R-01)."
  - type: "component"
    name: "Cart & Checkout Component"
    technology: "React / Redux"
    description: "Manages shopping cart state and secure checkout (R-02)."
  - type: "component"
    name: "Recommendation & Review Component"
    technology: "React"
    description: "Displays 5-star ratings and recommendations (R-03, R-04)."
  - type: "component"
    name: "Admin & Publisher Dashboard Component"
    technology: "React Lazy-loaded Chunk"
    description: "Back-office interface chunk for administrators and publishers."
  - type: "component"
    name: "Localization & Currency Provider Component"
    technology: "React Context API / formatjs"
    description: "Multi-currency handling (USD, EUR, GBP) and internationalization formatting."
relationships:
  - source: "Router & Auth Guard Component"
    destination: "Admin & Publisher Dashboard Component"
    description: "Lazy loads"
  - source: "Catalog & Search Component"
    destination: "AWS API Gateway"
    description: "Fetches data and mutates state via HTTPS/REST"
  - source: "Cart & Checkout Component"
    destination: "AWS API Gateway"
    description: "Fetches data and mutates state via HTTPS/REST"
  - source: "Recommendation & Review Component"
    destination: "AWS API Gateway"
    description: "Fetches data and mutates state via HTTPS/REST"