level: component
scope: "Component diagram for the Checkout & Order Container container"
parentContainer:
  name: "Checkout & Order Container"
elements:
  - type: "component"
    name: "Checkout Orchestrator Component"
    technology: "Spring Boot (Java) / Amazon ECS Fargate"
    description: "Coordinates REST transaction flows from the API Gateway."
  - type: "component"
    name: "Order Management Component"
    technology: "Spring Boot (Java) / Amazon Aurora PostgreSQL / AWS KMS"
    description: "Manages order state persistence using Amazon Aurora PostgreSQL with AWS KMS encryption."
  - type: "component"
    name: "Tax & Currency Engine Component"
    technology: "Spring Boot (Java) / AWS PrivateLink"
    description: "Integrates synchronously with the Tax & Compliance Service via AWS PrivateLink."
  - type: "component"
    name: "Event Dispatcher Component"
    technology: "Spring Boot (Java) / Amazon SQS / Amazon EventBridge"
    description: "Asynchronously handles audit, compliance, and business telemetry publishing."
  - type: "component"
    name: "Shipping & Payment Integration Worker"
    technology: "Spring Boot (Java) / Amazon SQS"
    description: "Processes background payment and shipping workflows via AWS SQS."
  - type: "component"
    name: "Analytics Sink"
    technology: "Amazon EventBridge / Kinesis Data Streams"
    description: "Receives decoupled funnel metrics via Amazon EventBridge or Kinesis Data Streams."
  - type: "component"
    name: "API Gateway"
    technology: "AWS API Gateway"
    description: "Routes synchronous HTTP/REST requests to the Checkout Orchestrator Component."
  - type: "component"
    name: "Tax & Compliance Service"
    technology: "External Service"
    description: "External compliance service called via HTTPS over AWS PrivateLink."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Persists data via TLS 1.3 with AWS KMS encryption."
relationships:
  - source: "API Gateway"
    destination: "Checkout Orchestrator Component"
    description: "Routes synchronous HTTP/REST requests."
  - source: "Tax & Currency Engine Component"
    destination: "Tax & Compliance Service"
    description: "Calls via HTTPS over AWS PrivateLink."
  - source: "Order Management Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists data via TLS 1.3 with AWS KMS encryption."
  - source: "Event Dispatcher Component"
    destination: "Shipping & Payment Integration Worker"
    description: "Publishes asynchronous events via Amazon SQS."
  - source: "Event Dispatcher Component"
    destination: "Analytics Sink"
    description: "Emits operational telemetry via Amazon EventBridge / Kinesis Data Streams."