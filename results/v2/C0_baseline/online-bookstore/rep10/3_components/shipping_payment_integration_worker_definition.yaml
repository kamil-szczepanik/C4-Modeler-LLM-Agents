level: component
scope: "Component diagram for the Shipping & Payment Integration Worker container"
parentContainer:
  name: "Shipping & Payment Integration Worker"
elements:
  - type: "component"
    name: "SQS Event Consumer"
    technology: "AWS Lambda Handler, Python/Java"
    description: "Processes asynchronous orders via serverless infrastructure."
  - type: "component"
    name: "Idempotency Manager"
    technology: "Amazon DynamoDB Global Tables with 7-day TTL"
    description: "Manages idempotency for order processing."
  - type: "component"
    name: "Payment Processor Client"
    technology: "HTTP Client"
    description: "Communicates with external payment gateways."
  - type: "component"
    name: "Fulfillment Integrator"
    technology: "HTTP Client"
    description: "Integrates with third-party shipping APIs."
  - type: "component"
    name: "DLQ Handler"
    technology: "Amazon SQS Dead-Letter Queue"
    description: "Handles failed messages and retries."
  - type: "component"
    name: "Audit Event Emitter"
    technology: "Amazon EventBridge"
    description: "Emits audit events for logging and compliance."
  - type: "component"
    name: "Secrets & Currency Context Injector"
    technology: "AWS Lambda Powertools"
    description: "Injects secrets and currency context securely."
relationships:
  - source: "Checkout & Order Container"
    destination: "SQS Event Consumer"
    description: "AWS SQS"
  - source: "Payment Processor Client"
    destination: "Payment Gateway"
    description: "HTTPS"
  - source: "Fulfillment Integrator"
    destination: "Third-Party Shipping API"
    description: "HTTPS"
  - source: "Audit Event Emitter"
    destination: "Amazon EventBridge"
    description: "AWS SDK"
  - source: "Secrets & Currency Context Injector"
    destination: "AWS Secrets Manager"
    description: "HTTPS/AWS SDK"