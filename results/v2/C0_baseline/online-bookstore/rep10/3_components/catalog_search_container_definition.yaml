level: component
scope: "Component diagram for the Catalog & Search Container container"
parentContainer:
  name: "Catalog & Search Container"
elements:
  - type: "component"
    name: "Search API Controller"
    technology: "Spring MVC"
    description: "Handles book discovery, faceted filtering, and search functionality."
  - type: "component"
    name: "Catalog Query Service"
    technology: "Spring Data / Domain Logic"
    description: "Executes core search and query domain logic."
  - type: "component"
    name: "Product Detail Repository"
    technology: "Spring Data JPA"
    description: "Queries canonical book metadata from the database."
  - type: "component"
    name: "Cache Manager Component"
    technology: "Spring Data Redis"
    description: "Manages distributed caching for low-latency query results."
  - type: "component"
    name: "Recommendation Integration Client"
    technology: "Spring Cloud OpenFeign"
    description: "Fetches personalized recommendations from external services."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Primary data store for catalog persistence."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache (Redis)"
    description: "Distributed caching layer for low-latency multi-currency query results."
relationships:
  - source: "API Gateway"
    destination: "Search API Controller"
    description: "Routes search requests [REST over HTTPS, AWS SigV4]"
  - source: "Catalog Query Service"
    destination: "Cache Manager Component"
    description: "Reads/writes query results [In-memory / Redis protocol over TLS]"
  - source: "Product Detail Repository"
    destination: "Amazon Aurora PostgreSQL"
    description: "Queries canonical book metadata [JDBC over TLS 1.3]"
  - source: "Recommendation Integration Client"
    destination: "Recommendation Service Container"
    description: "Fetches personalized recommendations [REST over HTTPS, OAuth2 / SigV4]"