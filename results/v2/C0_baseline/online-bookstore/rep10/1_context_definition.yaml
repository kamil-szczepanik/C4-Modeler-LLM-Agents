level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "A multi-region e-commerce platform providing catalog browsing, secure checkout, reviews, and personalized book recommendations."
elements:
  - type: "person"
    name: "Customer (Shopper)"
    description: "End users browsing the catalog, making secure purchases, and leaving reviews."
  - type: "person"
    name: "Book Author/Publisher"
    description: "Stakeholders managing book listings and metadata."
  - type: "person"
    name: "Store Administrator"
    description: "Operations personnel managing the bookstore system and configurations."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system processing secure financial transactions."
  - type: "externalSystem"
    name: "Third-Party Shipping API"
    description: "External system handling order fulfillment and shipping logistics."
  - type: "externalSystem"
    name: "Tax & Compliance Service"
    description: "External system calculating regional taxes and ensuring compliance."
  - type: "externalSystem"
    name: "Edge Routing & CDN Layer"
    description: "AWS CloudFront and Route 53 providing global content delivery and Anycast DNS."
relationships:
  - source: "Customer (Shopper)"
    destination: "Edge Routing & CDN Layer"
    description: "Accesses catalog, checkout, and recommendations"
    technology: "HTTPS (TLS 1.3)"
  - source: "Book Author/Publisher"
    destination: "Edge Routing & CDN Layer"
    description: "Manages catalog content and publishing details"
    technology: "HTTPS (TLS 1.3)"
  - source: "Store Administrator"
    destination: "Edge Routing & CDN Layer"
    description: "Administers the bookstore platform"
    technology: "HTTPS (TLS 1.3)"
  - source: "Edge Routing & CDN Layer"
    destination: "Online Bookstore"
    description: "Routes global traffic to the core system"
    technology: "HTTPS"
  - source: "Online Bookstore"
    destination: "Payment Gateway"
    description: "Processes customer payments"
    technology: "HTTPS/REST webhooks"
  - source: "Online Bookstore"
    destination: "Third-Party Shipping API"
    description: "Coordinates order fulfillment and shipping"
    technology: "HTTPS/REST webhooks"
  - source: "Online Bookstore"
    destination: "Tax & Compliance Service"
    description: "Calculates taxes and ensures regulatory compliance"
    technology: "gRPC/HTTPS"