level: component
scope: "Component diagram for the Amazon RDS PostgreSQL container"
parentContainer:
  name: "Amazon RDS PostgreSQL"
elements:
  - type: "component"
    name: "PostgreSQL Relational Engine"
    technology: "PostgreSQL Relational Engine (v15+)"
    description: "Provides ACID-compliant transactional storage for orders and payments."
  - type: "component"
    name: "PgBouncer Connection Pooler"
    technology: "PgBouncer"
    description: "Manages connection pooling to prevent exhaustion under high traffic."
  - type: "component"
    name: "AWS Backup & PITR Manager"
    technology: "AWS Backup & PITR Manager"
    description: "Synchronizes encrypted snapshots across regions using AWS internal backbone and KMS."
  - type: "component"
    name: "Cross-Region Read Replicas"
    technology: "PostgreSQL Read Replica"
    description: "Provides read-only replicas across regions for performance and high availability."
  - type: "component"
    name: "PostgreSQL Row-Level Security (RLS) Policies"
    technology: "PostgreSQL RLS"
    description: "Enforces fine-grained access control for data residency and compliance."
  - type: "component"
    name: "pgaudit Extension"
    technology: "pgaudit"
    description: "Provides detailed audit logging for security and compliance."
relationships:
  - source: "PgBouncer Connection Pooler"
    destination: "PostgreSQL Relational Engine"
    description: "Multiplexed backend connections [TCP, UNIX domain socket]"
  - source: "AWS Backup & PITR Manager"
    destination: "Cross-Region Read Replicas"
    description: "Synchronizes encrypted snapshots [AWS internal backbone, KMS]"