level: component
scope: "Component diagram for the AWS API Gateway container"
parentContainer:
  name: "AWS API Gateway"
elements:
  - type: "component"
    name: "Edge Request Router"
    technology: "AWS API Gateway HTTP/REST APIs"
    description: "Manages geo-routing, rate limiting, and HTTP/REST traffic."
  - type: "component"
    name: "Security & Validation Filter"
    technology: "AWS WAF"
    description: "Mitigates OWASP Top-10 vulnerabilities and provides DDoS protection."
  - type: "component"
    name: "Token Authorizer"
    technology: "AWS Lambda Authorizer with Auth0/AWS Cognito"
    description: "Executes lightweight JWT token authorization."
  - type: "component"
    name: "API Response Cache"
    technology: "API Gateway Managed Cache"
    description: "Caches API responses to ensure fast page loads."
  - type: "component"
    name: "Telemetry & Metering Filter"
    technology: "Amazon CloudWatch & AWS X-Ray"
    description: "Handles distributed tracing, telemetry, and metrics monitoring."
relationships:
  - source: "Security & Validation Filter"
    destination: "Edge Request Router"
    description: "Internal Routing"
  - source: "Edge Request Router"
    destination: "Token Authorizer"
    description: "gRPC / Lambda Invocation"
  - source: "Edge Request Router"
    destination: "API Response Cache"
    description: "Internal Cache Read/Write"
  - source: "Edge Request Router"
    destination: "Telemetry & Metering Filter"
    description: "Async / CloudWatch API"