level: component
scope: "Component diagram for the Recommendations Service container"
parentContainer:
  name: "Recommendations Service"
elements:
  - type: "component"
    name: "API Controller Component"
    technology: "Python FastAPI Router"
    description: "Handling incoming REST/gRPC traffic."
  - type: "component"
    name: "Experimentation & Variant Router Component"
    technology: "Python"
    description: "Manages A/B testing and algorithm variants."
  - type: "component"
    name: "Recommendation Engine Component"
    technology: "Python"
    description: "Executes collaborative filtering and item-to-item similarity logic."
  - type: "component"
    name: "Event Ingestion Consumer Component"
    technology: "Python"
    description: "Subscribes to events for dynamic updates."
  - type: "component"
    name: "Telemetry Publisher Component"
    technology: "Python"
    description: "Emits impression and click-through metrics."
  - type: "component"
    name: "Book Buyer"
    technology: "Person"
    description: "Primary end-user consuming personalized recommendations."
  - type: "component"
    name: "AWS API Gateway"
    technology: "AWS API Gateway"
    description: "Routes incoming recommendation requests."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "NoSQL database for low-latency, high-throughput retrieval."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache (Redis)"
    description: "Caching hot recommendation items."
  - type: "component"
    name: "AWS EventBridge"
    technology: "AWS EventBridge"
    description: "Decoupled, asynchronous event ingestion and telemetry publishing."
relationships:
  - source: "AWS API Gateway"
    destination: "API Controller Component"
    description: "Routes incoming recommendation requests [mTLS / REST and gRPC]"
  - source: "API Controller Component"
    destination: "Experimentation & Variant Router Component"
    description: "Delegates user context [Internal Python method calls]"
  - source: "Experimentation & Variant Router Component"
    destination: "Recommendation Engine Component"
    description: "Routes requests to specific algorithm handlers [Python]"
  - source: "Recommendation Engine Component"
    destination: "Amazon DynamoDB"
    description: "Reads cached recommendations [HTTPS / TCP, Sub-10ms query latency]"
  - source: "Recommendation Engine Component"
    destination: "Amazon ElastiCache (Redis)"
    description: "Reads cached recommendations [HTTPS / TCP, Sub-10ms query latency]"
  - source: "AWS EventBridge"
    destination: "Event Ingestion Consumer Component"
    description: "Publishes asynchronous clickstream and order events [Asynchronous event subscription]"
  - source: "Telemetry Publisher Component"
    destination: "AWS EventBridge"
    description: "Publishes sanitized impression and click metrics [Asynchronous event publishing]"
  - source: "Book Buyer"
    destination: "AWS API Gateway"
    description: "Requests personalized recommendations"