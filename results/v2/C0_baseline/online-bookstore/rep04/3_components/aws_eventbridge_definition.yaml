level: component
scope: "Component diagram for the AWS EventBridge container"
parentContainer:
  name: "AWS EventBridge"
elements:
  - type: "component"
    name: "Custom Event Buses"
    technology: "AWS EventBridge Custom Buses"
    description: "Domain-isolated event buses preventing cascading failures for decoupled microservice communication."
  - type: "component"
    name: "Event Rules"
    technology: "AWS EventBridge Rules"
    description: "Internal event routing rules to match and direct events to appropriate targets."
  - type: "component"
    name: "Target Dispatchers"
    technology: "AWS Lambda / EventBridge Targets"
    description: "Dispatchers responsible for forwarding routed events to downstream buffers and queues."
relationships:
  - source: "Custom Event Buses"
    destination: "Event Rules"
    description: "Routes published events based on defined rule patterns"
  - source: "Event Rules"
    destination: "Target Dispatchers"
    description: "Triggers dispatchers to forward matched events"