level: component
scope: "Component diagram for the React / TypeScript SPA container"
parentContainer:
  name: "React / TypeScript SPA"
elements:
  - type: "component"
    name: "Routing & Layout Component"
    technology: "React Router"
    description: "Handles client-side routing and application layout structure."
  - type: "component"
    name: "Catalog & Search Feature Module"
    technology: "React, Zustand"
    description: "Manages book catalog browsing, filtering, and search functionality."
  - type: "component"
    name: "Cart & Checkout Feature Module"
    technology: "React, React Hook Form"
    description: "Manages shopping cart state, user forms, and checkout processing."
  - type: "component"
    name: "Social Proof & Recommendations Module"
    technology: "React Query"
    description: "Fetches and caches product recommendations and social proof data."
  - type: "component"
    name: "Admin Management Module"
    technology: "React, Lazy-Loaded"
    description: "Provides administrative management tools and is lazily loaded."
  - type: "component"
    name: "API Client Wrapper"
    technology: "Axios"
    description: "Handles HTTP communication, interceptors, and secure API requests."
relationships:
  - source: "Catalog & Search Feature Module"
    destination: "API Client Wrapper"
    description: "Invokes"
  - source: "Cart & Checkout Feature Module"
    destination: "API Client Wrapper"
    description: "Invokes"
  - source: "Social Proof & Recommendations Module"
    destination: "API Client Wrapper"
    description: "Invokes"
  - source: "Admin Management Module"
    destination: "API Client Wrapper"
    description: "Invokes"