level: component
scope: "Component diagram for the Review Service container"
parentContainer:
  name: "Review Service"
elements:
  - type: "component"
    name: "Review Controller"
    technology: "Express.js"
    description: "Handles incoming HTTP requests related to reviews via REST and gRPC."
  - type: "component"
    name: "Review Business Logic Component"
    technology: "Node.js"
    description: "Contains core business logic for processing and validating reviews."
  - type: "component"
    name: "Data Access Layer & ElastiCache Read-Aside"
    technology: "Prisma ORM + Redis"
    description: "Manages persistence in PostgreSQL and caches rating summaries using Redis."
  - type: "component"
    name: "Event Publisher Component"
    technology: "AWS SDK v3"
    description: "Publishes asynchronous events like ReviewCreated and GDPR anonymization to AWS EventBridge."
relationships:
  - source: "Review Controller"
    destination: "Review Business Logic Component"
    description: "Delegates request processing"
  - source: "Review Business Logic Component"
    destination: "Data Access Layer & ElastiCache Read-Aside"
    description: "Queries and persists data"
  - source: "Review Business Logic Component"
    destination: "Event Publisher Component"
    description: "Triggers domain events"