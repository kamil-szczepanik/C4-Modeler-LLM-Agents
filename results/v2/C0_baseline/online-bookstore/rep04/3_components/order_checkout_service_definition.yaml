level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Cart Controller & Manager"
    technology: "Node.js, Express, Redis"
    description: "Handling cart lifecycle and Redis persistence."
  - type: "component"
    name: "Checkout Orchestrator"
    technology: "Node.js"
    description: "Manages transactions, idempotency, data masking, and orchestration."
  - type: "component"
    name: "Payment & Fulfillment Client"
    technology: "Node.js, Stripe, PayPal, FedEx, UPS, Circuit Breakers"
    description: "Integrates with payment gateways and shipping providers using circuit breakers."
  - type: "component"
    name: "Order Event Publisher"
    technology: "Node.js, AWS SDK"
    description: "Emits domain events to the event bus."
  - type: "component"
    name: "Notification Adapter"
    technology: "Node.js"
    description: "Triggers notifications for order lifecycle events."
  - type: "component"
    name: "Amazon RDS PostgreSQL"
    technology: "PostgreSQL, PgBouncer, gRPC/TLS 1.3"
    description: "Persists transactional state with ACID compliance."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Redis, Encrypted TCP"
    description: "Caches cart data with low latency."
  - type: "component"
    name: "AWS EventBridge"
    technology: "AWS EventBridge, JSON over HTTPS"
    description: "Enables asynchronous, decoupled event-driven workflows and notifications."
relationships:
  - source: "Checkout Orchestrator"
    destination: "Cart Controller & Manager"
    description: "Manages cart lifecycle [In-memory function call]"
  - source: "Checkout Orchestrator"
    destination: "Payment & Fulfillment Client"
    description: "Executes transactions [Async/Await REST via HTTPS]"
  - source: "Payment & Fulfillment Client"
    destination: "Stripe/PayPal"
    description: "Processes payments [HTTPS / REST with TLS 1.3]"
  - source: "Payment & Fulfillment Client"
    destination: "FedEx/UPS"
    description: "Calculates shipping [HTTPS / REST with TLS 1.3]"
  - source: "Checkout Orchestrator"
    destination: "Amazon RDS PostgreSQL"
    description: "Persists transactional state [Encrypted TCP with gRPC/TLS 1.3 and PgBouncer]"
  - source: "Cart Controller & Manager"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches cart data [Encrypted TCP]"
  - source: "Order Event Publisher"
    destination: "AWS EventBridge"
    description: "Publishes domain events [JSON over AWS SDK / HTTPS]"