level: component
scope: "Component diagram for the Amazon ElastiCache (Redis) container"
parentContainer:
  name: "Amazon ElastiCache (Redis)"
elements:
  - type: "component"
    name: "Session & Cart Engine"
    technology: "In-memory Hashes/Strings (Redis)"
    description: "Ensures sub-millisecond cart persistence and active user shopping cart management."
  - type: "component"
    name: "Catalog Query Cache"
    technology: "String/JSON cache with TTL (Redis)"
    description: "Caches search and catalog data as well as pre-computed recommendations."
  - type: "component"
    name: "Pub/Sub Notification Manager"
    technology: "Redis Pub/Sub"
    description: "Manages cache eviction and invalidation triggered by external events."
  - type: "component"
    name: "Order & Checkout Service"
    technology: "Node.js"
    description: "Persists cart data via Encrypted TCP with strict Redis ACLs."
  - type: "component"
    name: "Catalog & Search Service"
    technology: "Java Spring Boot, Elasticsearch"
    description: "Caches search and catalog data via Encrypted TCP."
  - type: "component"
    name: "Recommendations Service"
    technology: "Python FastAPI"
    description: "Reads and writes pre-computed recommendations via Encrypted TCP."
  - type: "component"
    name: "AWS EventBridge"
    technology: "AWS EventBridge"
    description: "Triggers cache eviction via Redis PUBLISH."
relationships:
  - source: "Order & Checkout Service"
    destination: "Session & Cart Engine"
    description: "Persists cart data via Encrypted TCP (RESP over TLS) with strict Redis ACLs"
  - source: "Catalog & Search Service"
    destination: "Catalog Query Cache"
    description: "Caches search and catalog data via Encrypted TCP"
  - source: "Recommendations Service"
    destination: "Catalog Query Cache"
    description: "Reads/writes pre-computed recommendations via Encrypted TCP (RESP over TLS)"
  - source: "AWS EventBridge"
    destination: "Pub/Sub Notification Manager"
    description: "Triggers cache eviction via Redis PUBLISH"