level: component
scope: "Component diagram for the Catalog & Search Service container"
parentContainer:
  name: "Catalog & Search Service"
elements:
  - type: "component"
    name: "Search Controller & Faceted Query Engine"
    technology: "Java Spring Boot"
    description: "Handles faceted search and catalog queries, communicating with Elasticsearch."
  - type: "component"
    name: "Catalog Management Component"
    technology: "Java Spring Boot"
    description: "Manages catalog state and persists data to Amazon RDS PostgreSQL."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Java Spring Boot"
    description: "Publishes ProductUpdated and StockChanged events to AWS EventBridge."
  - type: "component"
    name: "Cache-Aside Manager"
    technology: "Java Spring Boot / Redis"
    description: "Manages query TTLs and caching via Amazon ElastiCache."
  - type: "component"
    name: "Localization & Currency Resolver Component"
    technology: "Java Spring Boot"
    description: "Resolves localization and currency data."
  - type: "component"
    name: "Bulk Index Synchronization Component"
    technology: "Java Spring Boot"
    description: "Reads bulk catalog updates from PostgreSQL Read Replicas and bulk upserts to Elasticsearch."
relationships:
  - source: "Search Controller & Faceted Query Engine"
    destination: "Elasticsearch"
    description: "Executes DSL queries via Transport over TCP"
  - source: "Catalog Management Component"
    destination: "Amazon RDS PostgreSQL"
    description: "Persists catalog state via JDBC / Encrypted TCP"
  - source: "Cache-Aside Manager"
    destination: "Amazon ElastiCache (Redis)"
    description: "Manages query TTLs via RESP over TCP"
  - source: "Event Publisher Component"
    destination: "AWS EventBridge"
    description: "Publishes ProductUpdated and StockChanged events via Asynchronous event publishing"
  - source: "Bulk Index Synchronization Component"
    destination: "Amazon RDS PostgreSQL Read Replicas"
    description: "Reads bulk catalog updates via JDBC / Encrypted TCP"
  - source: "Bulk Index Synchronization Component"
    destination: "Elasticsearch"
    description: "Bulk upserts documents via REST/HTTPs"