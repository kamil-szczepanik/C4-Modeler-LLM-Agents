level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Book Buyer"
    description: "End-user interacting via Web/Mobile clients to browse, purchase, and review books."
  - type: "person"
    name: "Registered Reviewer"
    description: "User contributing reviews and 5-star ratings."
  - type: "person"
    name: "Store Administrator"
    description: "Manages catalog integrity, pricing, and content moderation."
  - type: "externalSystem"
    name: "Stripe/PayPal"
    description: "External payment gateway for secure checkout and PCI-DSS offloading."
  - type: "externalSystem"
    name: "FedEx/UPS"
    description: "External shipping APIs for rate calculation and fulfillment."
  - type: "externalSystem"
    name: "Auth0/Cognito"
    description: "External Identity Provider handling authentication, MFA, and GDPR consent."
  - type: "externalSystem"
    name: "AWS SES"
    description: "External notification service for transactional emails."
  - type: "externalSystem"
    name: "Currency Exchange Rate Service"
    description: "External provider for daily multi-currency conversion rates."
  - type: "container"
    name: "React / TypeScript SPA"
    description: "Single Page Application hosted on AWS S3 & CloudFront for fast, responsive client-side rendering."
    technology: "React, TypeScript, AWS S3, AWS CloudFront"
  - type: "container"
    name: "AWS API Gateway"
    description: "API & Routing Container handling requests from the frontend."
    technology: "AWS API Gateway"
  - type: "container"
    name: "Order & Checkout Service"
    description: "Backend service managing orders and checkout processes."
    technology: "Node.js"
  - type: "container"
    name: "Catalog & Search Service"
    description: "Backend service handling rapid keyword queries and catalog management."
    technology: "Java Spring Boot, Elasticsearch"
  - type: "container"
    name: "Recommendations Service"
    description: "Backend service providing personalized book recommendations."
    technology: "Python FastAPI"
  - type: "container"
    name: "Review Service"
    description: "Backend service managing user reviews and ratings."
    technology: "Node.js"
  - type: "container"
    name: "Amazon RDS PostgreSQL"
    description: "Relational database for structured data storage with multi-region durability."
    technology: "Amazon RDS PostgreSQL"
  - type: "container"
    name: "Amazon DynamoDB"
    description: "NoSQL database with Global Tables for multi-region durability."
    technology: "Amazon DynamoDB"
  - type: "container"
    name: "Amazon ElastiCache (Redis)"
    description: "Caching layer for sub-millisecond cart persistence."
    technology: "Amazon ElastiCache (Redis)"
  - type: "container"
    name: "AWS EventBridge"
    description: "Event bus for asynchronous event-driven communication between microservices."
    technology: "AWS EventBridge"
relationships:
  - source: "Book Buyer"
    destination: "React / TypeScript SPA"
    description: "Browses books, manages cart, and initiates checkout"
    technology: "HTTPS"
  - source: "Registered Reviewer"
    destination: "React / TypeScript SPA"
    description: "Submits reviews and ratings"
    technology: "HTTPS"
  - source: "Store Administrator"
    destination: "React / TypeScript SPA"
    description: "Manages catalog, pricing, and content moderation"
    technology: "HTTPS"
  - source: "React / TypeScript SPA"
    destination: "AWS API Gateway"
    description: "Sends API requests"
    technology: "HTTPS / JSON"
  - source: "AWS API Gateway"
    destination: "Order & Checkout Service"
    description: "Routes checkout and order requests"
    technology: "mTLS / REST and gRPC"
  - source: "AWS API Gateway"
    destination: "Catalog & Search Service"
    description: "Routes catalog and search queries"
    technology: "mTLS / REST and gRPC"
  - source: "AWS API Gateway"
    destination: "Recommendations Service"
    description: "Routes recommendation requests"
    technology: "mTLS / REST and gRPC"
  - source: "AWS API Gateway"
    destination: "Review Service"
    description: "Routes review-related requests"
    technology: "mTLS / REST and gRPC"
  - source: "Order & Checkout Service"
    destination: "Stripe/PayPal"
    description: "Processes payments"
    technology: "HTTPS / REST"
  - source: "Order & Checkout Service"
    destination: "FedEx/UPS"
    description: "Calculates shipping rates and fulfillment"
    technology: "HTTPS / REST"
  - source: "Order & Checkout Service"
    destination: "AWS EventBridge"
    description: "Publishes order events asynchronously"
    technology: "Asynchronous event publishing"
  - source: "Catalog & Search Service"
    destination: "AWS EventBridge"
    description: "Publishes catalog events asynchronously"
    technology: "Asynchronous event publishing"
  - source: "Recommendations Service"
    destination: "AWS EventBridge"
    description: "Publishes recommendation events asynchronously"
    technology: "Asynchronous event publishing"
  - source: "Review Service"
    destination: "AWS EventBridge"
    description: "Publishes review events asynchronously"
    technology: "Asynchronous event publishing"
  - source: "Order & Checkout Service"
    destination: "Amazon RDS PostgreSQL"
    description: "Reads and writes relational data"
    technology: "Encrypted TCP"
  - source: "Catalog & Search Service"
    destination: "Amazon RDS PostgreSQL"
    description: "Reads and writes catalog data"
    technology: "Encrypted TCP"
  - source: "Order & Checkout Service"
    destination: "Amazon DynamoDB"
    description: "Reads and writes NoSQL data"
    technology: "Encrypted TCP"
  - source: "Order & Checkout Service"
    destination: "Amazon ElastiCache (Redis)"
    description: "Persists cart data and caches information"
    technology: "Encrypted TCP"
  - source: "Catalog & Search Service"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches search and catalog data"
    technology: "Encrypted TCP"