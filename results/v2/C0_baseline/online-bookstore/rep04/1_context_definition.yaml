level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "An Amazon-style global online bookstore system providing catalog browsing, secure checkout, reviews, and personalized recommendations with GDPR/CCPA compliance."
elements:
  - type: "person"
    name: "Book Buyer / Customer"
    description: "End-user interacting via Web/Mobile clients over HTTPS to browse and purchase books."
  - type: "person"
    name: "Registered Reviewer"
    description: "User contributing reviews and 5-star ratings."
  - type: "person"
    name: "Store Administrator / Content Manager"
    description: "Manages catalog integrity, pricing, and content moderation."
  - type: "externalSystem"
    name: "Stripe / PayPal"
    description: "External payment gateway for secure checkout and PCI-DSS offloading."
  - type: "externalSystem"
    name: "FedEx / UPS"
    description: "External shipping APIs for rate calculation and fulfillment."
  - type: "externalSystem"
    name: "Auth0 / AWS Cognito"
    description: "External Identity Provider handling authentication, MFA, and GDPR consent."
  - type: "externalSystem"
    name: "AWS SES"
    description: "External notification service for transactional emails."
  - type: "externalSystem"
    name: "Currency Exchange Rate Service"
    description: "External provider for daily multi-currency conversion rates."
relationships:
  - source: "Book Buyer / Customer"
    destination: "Online Bookstore System"
    description: "Interacts via Web/Mobile clients for catalog browsing, checkout, and reviews"
    technology: "HTTPS, TLS 1.3, AWS Route 53 Geo-DNS"
  - type: "Registered Reviewer"
    destination: "Online Bookstore System"
    description: "Contributes reviews and ratings"
    technology: "HTTPS"
  - type: "Store Administrator / Content Manager"
    destination: "Online Bookstore System"
    description: "Manages catalog, pricing, and moderation"
    technology: "HTTPS"
  - source: "Online Bookstore System"
    destination: "Stripe / PayPal"
    description: "Secure payment processing"
    technology: "REST/HTTPS"
  - source: "Online Bookstore System"
    destination: "FedEx / UPS"
    description: "Rate calculation and fulfillment"
    technology: "REST/HTTPS with circuit breakers"
  - source: "Online Bookstore System"
    destination: "Auth0 / AWS Cognito"
    description: "Identity management, authentication, and MFA"
    technology: "Scoped OAuth2/JWT tokens and mTLS"
  - source: "Online Bookstore System"
    destination: "AWS SES"
    description: "Sends transactional emails"
    technology: "HTTPS/SMTP"
  - source: "Online Bookstore System"
    destination: "Currency Exchange Rate Service"
    description: "Retrieves daily multi-currency conversion rates"
    technology: "REST/HTTPS with Redis caching"