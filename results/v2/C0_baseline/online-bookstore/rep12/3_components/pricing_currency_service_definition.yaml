level: component
scope: "Component diagram for the Pricing & Currency Service container"
parentContainer:
  name: "Pricing & Currency Service"
elements:
  - type: "component"
    name: "Pricing Controller"
    technology: "Go, Fiber"
    description: "Handles incoming routing and request management via gRPC."
  - type: "component"
    name: "Currency Conversion Engine"
    technology: "Go"
    description: "Provides real-time multi-currency conversion calculations."
  - type: "component"
    name: "Rule Evaluation Engine"
    technology: "Go"
    description: "Evaluates promotional pricing and business rules."
  - type: "component"
    name: "Rate Syncer Worker"
    technology: "Go"
    description: "Background worker responsible for syncing and updating currency rates."
  - type: "component"
    name: "Pricing Repository"
    technology: "Go, Amazon Aurora PostgreSQL"
    description: "Persists pricing data and immutable audit logs."
  - type: "component"
    name: "Rate Cache Manager"
    technology: "Go, Redis"
    description: "Delivers sub-millisecond caching for pre-computed price matrices."
relationships:
  - source: "API Gateway"
    destination: "Pricing Controller"
    description: "Routes requests via gRPC over mTLS"
  - source: "Pricing Controller"
    destination: "Rule Evaluation Engine"
    description: "Passes context via gRPC metadata"
  - source: "Currency Conversion Engine"
    destination: "Rate Cache Manager"
    description: "Queries rates via in-memory Redis TLS"
  - source: "Pricing Repository"
    destination: "Amazon Aurora"
    description: "Persists audit logs via PostgreSQL wire protocol"
  - source: "Rate Syncer Worker"
    destination: "AWS Secrets Manager"
    description: "Retrieves credentials via HTTPS"