level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing & Proxy Component"
    technology: "AWS API Gateway"
    description: "Routes incoming requests to appropriate backend microservices."
  - type: "component"
    name: "Authentication & Authorization Component"
    technology: "AWS API Gateway, AWS Lambda"
    description: "Validates JWT tokens via External Identity Provider and handles authentication."
  - type: "component"
    name: "Rate Limiting & Throttling Component"
    technology: "AWS API Gateway, AWS WAF"
    description: "Enforces rate limits and protects against malicious traffic and OWASP Top-10 threats."
  - type: "component"
    name: "Transformation & Error Handling Component"
    technology: "AWS API Gateway, AWS Lambda"
    description: "Transforms requests and responses and provides centralized error handling."
relationships:
  - source: "Routing & Proxy Component"
    destination: "Catalog & Search Service"
    description: "Routes search requests via mTLS"
  - source: "Routing & Proxy Component"
    destination: "Order & Checkout Service"
    description: "Routes checkout requests via mTLS"
  - source: "Routing & Proxy Component"
    destination: "Recommendation Service"
    description: "Routes recommendation requests via mTLS"
  - source: "Routing & Proxy Component"
    destination: "Customer Privacy Service"
    description: "Routes privacy requests via mTLS"
  - source: "Routing & Proxy Component"
    destination: "Pricing & Currency Service"
    description: "Routes pricing requests via mTLS"
  - source: "Authentication & Authorization Component"
    destination: "External Identity Provider"
    description: "Validates JWT tokens via HTTPS"