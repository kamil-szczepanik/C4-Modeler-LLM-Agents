level: component
scope: "Component diagram for the Storefront container"
parentContainer:
  name: "Storefront"
elements:
  - type: "component"
    name: "Catalog UI Module"
    technology: "React 18 with TypeScript and Tailwind CSS"
    description: "Provides the user interface for browsing and searching the product catalog."
  - type: "component"
    name: "Checkout & Cart Module"
    technology: "React 18 with TypeScript and Redux/Context"
    description: "Manages shopping cart state, multi-currency cart handling, and secure checkout workflows."
  - type: "component"
    name: "Authentication & Session Manager"
    technology: "React 18 with OAuth 2.0/PKCE"
    description: "Handles user authentication sessions and integrates with the external identity provider."
  - type: "component"
    name: "Promotional Banner & Campaign Module"
    technology: "React 18 with Tailwind CSS"
    description: "Displays promotional banners and campaign modules to users."
  - type: "component"
    name: "Abandoned Cart Recovery Trigger"
    technology: "React 18"
    description: "Triggers mechanisms for abandoned cart recovery."
  - type: "component"
    name: "Localization & Currency Module"
    technology: "React 18"
    description: "Manages localization settings and fetches multi-currency rates via the API gateway."
  - type: "component"
    name: "Review & Rating UI Module"
    technology: "React 18 with Tailwind CSS"
    description: "Renders user reviews and ratings interfaces."
relationships:
  - source: "Authentication & Session Manager"
    destination: "External Identity Provider"
    description: "Authenticates users via OAuth 2.0 with PKCE [HTTPS]"
  - source: "Localization & Currency Module"
    destination: "Pricing & Currency Service"
    description: "Fetches multi-currency rates via API Gateway [HTTPS/REST]"
  - source: "Storefront"
    destination: "API Gateway"
    description: "Communicates UI actions and data requests via HTTPS/REST [HTTPS/REST]"