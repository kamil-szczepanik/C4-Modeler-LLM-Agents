level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "API Handler"
    technology: "FastAPI"
    description: "Exposes asynchronous REST endpoints and validates user consent tokens."
  - type: "component"
    name: "Inference Engine"
    technology: "Python / NumPy"
    description: "Computes collaborative filtering and Customers also bought scores."
  - type: "component"
    name: "Clickstream Consumer"
    technology: "Kafka / Python Worker"
    description: "Ingests real-time event streams asynchronously from Amazon MSK."
  - type: "component"
    name: "Recommendation Datastore"
    technology: "Amazon DynamoDB"
    description: "Stores precomputed and real-time affinity models with global replication."
  - type: "component"
    name: "Metrics Emitter"
    technology: "Python Worker"
    description: "Asynchronously publishes CTR and attributed revenue analytics."
relationships:
  - source: "API Gateway"
    destination: "API Handler"
    description: "REST over mTLS [HTTPS/mTLS]"
  - source: "Clickstream Consumer"
    destination: "Amazon MSK (Kafka)"
    description: "Subscribes to user click events [TCP/TLS]"
  - source: "Inference Engine"
    destination: "Recommendation Datastore"
    description: "Reads/Writes vectors [AWS SDK / HTTPS]"
  - source: "Recommendation Datastore"
    destination: "Inference Engine"
    description: "Reads/Writes vectors [AWS SDK / HTTPS]"
  - source: "API Handler"
    destination: "Metrics Emitter"
    description: "Asynchronous event dispatch [Internal Queue / Memory]"
  - source: "Metrics Emitter"
    destination: "Amazon Kinesis Data Firehose"
    description: "Streams analytics payloads [HTTPS/TLS]"