level: component
scope: "Component diagram for the Customer Privacy Service container"
parentContainer:
  name: "Customer Privacy Service"
elements:
  - type: "component"
    name: "Privacy API Controller"
    technology: "Node.js / Express"
    description: "Handles REST endpoints and RBAC/ABAC authorization for privacy features."
  - type: "component"
    name: "GDPR/CCPA Workflow Engine"
    technology: "Node.js / BullMQ"
    description: "Orchestrates asynchronous tasks, workflows, and dead-letter queues."
  - type: "component"
    name: "Data Exporter Worker"
    technology: "Node.js"
    description: "Packages PII into encrypted ZIP archives."
  - type: "component"
    name: "Audit & Retention Logger"
    technology: "Node.js"
    description: "Writes compliance trails and audit logs."
relationships:
  - source: "API Gateway"
    destination: "Privacy API Controller"
    description: "Routes requests via [mTLS]."
  - source: "Privacy API Controller"
    destination: "GDPR/CCPA Workflow Engine"
    description: "Enqueues jobs via [Redis/BullMQ]."
  - source: "GDPR/CCPA Workflow Engine"
    destination: "Redis"
    description: "Manages async queues via [TCP with TLS]."
  - source: "Data Exporter Worker"
    destination: "Amazon S3"
    description: "Uploads encrypted archives via [AWS SDK / HTTPS]."
  - source: "Audit & Retention Logger"
    destination: "Amazon DynamoDB"
    description: "Persists audit trails via [AWS SDK / HTTPS]."
  - source: "GDPR/CCPA Workflow Engine"
    destination: "External Notification Service"
    description: "Dispatches alerts via [HTTPS / REST]."