level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Checkout Orchestrator"
    technology: "Spring Boot"
    description: "Orchestrates secure, multi-currency retail transactions and order fulfillment workflows."
  - type: "component"
    name: "Payment Integration Adapter"
    technology: "Spring Cloud OpenFeign / HTTPS"
    description: "Communicates with the external payment gateway to process payments synchronously while ensuring zero cardholder data storage."
  - type: "component"
    name: "Fulfillment Adapter"
    technology: "AWS SDK / HTTPS"
    description: "Queues fulfillment handoffs asynchronously to external shipping providers."
  - type: "component"
    name: "Order Management API"
    technology: "Spring Boot"
    description: "Provides interfaces for managing order state, logs, and retrieval."
  - type: "component"
    name: "Order Repository"
    technology: "Spring Data JPA / PostgreSQL"
    description: "Persists transactional state and audit logs into Amazon RDS PostgreSQL."
  - type: "component"
    name: "Idempotency & Token Manager"
    technology: "AWS ElastiCache Redis"
    description: "Backs distributed idempotency checks and manages tokenization for PCI-DSS compliance."
relationships:
  - source: "Checkout Orchestrator"
    destination: "Idempotency & Token Manager"
    description: "Validates idempotency [Local Method Call]"
  - source: "Checkout Orchestrator"
    destination: "Payment Integration Adapter"
    description: "Processes payments synchronously [Spring Cloud OpenFeign / HTTPS]"
  - source: "Fulfillment Adapter"
    destination: "Order Management API"
    description: "Queues fulfillment handoffs asynchronously [AWS SDK / HTTPS]"
  - source: "Order Management API"
    destination: "Order Repository"
    description: "Persists state and logs [Spring Data JPA / PostgreSQL]"