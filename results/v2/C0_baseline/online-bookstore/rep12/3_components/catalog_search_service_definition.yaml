level: component
scope: "Component diagram for the Catalog & Search Service container"
parentContainer:
  name: "Catalog & Search Service"
elements:
  - type: "component"
    name: "Search API Controller"
    technology: "Node.js"
    description: "Handles incoming HTTP/2 over mTLS requests from the API Gateway for catalog search and retrieval."
  - type: "component"
    name: "Search Engine Client"
    technology: "Node.js, gRPC/Async"
    description: "Communicates via in-process calls with the Search API Controller and connects to Amazon OpenSearch."
  - type: "component"
    name: "Pricing Aggregator Client"
    technology: "Node.js"
    description: "Performs in-process calls to aggregate pricing data and communicates with the Pricing & Currency Service."
relationships:
  - source: "Search API Controller"
    destination: "Search Engine Client"
    description: "In-process calls (gRPC/Async)"
  - source: "Search Engine Client"
    destination: "Amazon OpenSearch"
    description: "HTTPS [TLS 1.3]"
  - source: "Search API Controller"
    destination: "Pricing Aggregator Client"
    description: "In-process calls"
  - source: "Pricing Aggregator Client"
    destination: "Pricing & Currency Service"
    description: "HTTP/2 [mTLS] within internal VPC"