level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Customer"
    description: "Shopper who browses, searches, and checks out products."
  - type: "person"
    name: "Store Administrator"
    description: "Content Manager who manages inventory and catalog."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "Stripe/PayPal service used to process and authorize payments."
  - type: "externalSystem"
    name: "External Shipping Provider"
    description: "FedEx/UPS APIs used to dispatch physical orders."
  - type: "externalSystem"
    name: "External Identity Provider"
    description: "Auth0/AWS Cognito service used for authentication and validating sessions."
  - type: "externalSystem"
    name: "External Notification Service"
    description: "AWS SES used to trigger transactional emails."
  - type: "container"
    name: "Storefront"
    technology: "React SPA, Amazon S3, Amazon CloudFront CDN"
    description: "Provides the user interface for multi-currency browsing and real-time checkout."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway, RBAC, JWT validation"
    description: "Routes requests securely to internal backend microservices."
  - type: "container"
    name: "Catalog & Search Service"
    technology: "Node.js, Amazon OpenSearch"
    description: "Handles product catalog and real-time search functionality."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Spring Boot, isolated private VPC"
    description: "Processes real-time orders and integrates with fulfillment providers."
  - type: "container"
    name: "Recommendation Service"
    technology: "Python, FastAPI, Amazon DynamoDB"
    description: "Generates automated product recommendations."
  - type: "container"
    name: "Customer Privacy Service"
    technology: "Node.js, Amazon DynamoDB"
    description: "Ensures strict GDPR and CCPA compliance for user data."
  - type: "container"
    name: "Pricing & Currency Service"
    technology: "Go, Redis cache"
    description: "Manages multi-currency pricing and fast retrieval."
relationships:
  - source: "Customer"
    destination: "Storefront"
    description: "Interacts via HTTPS/TLS 1.3"
    technology: "HTTPS"
  - source: "Store Administrator"
    destination: "Storefront"
    description: "Manages content and catalog"
    technology: "HTTPS"
  - source: "Storefront"
    destination: "API Gateway"
    description: "Communicates via HTTPS/REST"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "Catalog & Search Service"
    description: "Routes search requests via mTLS"
    technology: "mTLS"
  - source: "API Gateway"
    destination: "Order & Checkout Service"
    description: "Routes checkout requests via mTLS"
    technology: "mTLS"
  - source: "API Gateway"
    destination: "Recommendation Service"
    description: "Routes recommendation requests via mTLS"
    technology: "mTLS"
  - source: "API Gateway"
    destination: "Customer Privacy Service"
    description: "Routes privacy requests via mTLS"
    technology: "mTLS"
  - source: "API Gateway"
    destination: "Pricing & Currency Service"
    description: "Routes pricing requests via mTLS"
    technology: "mTLS"
  - source: "Order & Checkout Service"
    destination: "External Payment Gateway"
    description: "Integrates for payment processing"
    technology: "HTTPS/REST"
  - source: "Order & Checkout Service"
    destination: "External Shipping Provider"
    description: "Integrates for order fulfillment"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "External Identity Provider"
    description: "Validates JWT tokens"
    technology: "HTTPS"
  - source: "Order & Checkout Service"
    destination: "External Notification Service"
    description: "Triggers transactional emails"
    technology: "HTTPS"