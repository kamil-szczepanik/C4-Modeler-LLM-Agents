level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "An Amazon-style online bookstore designed to handle 1M MAU across three global AWS regions, providing scalable catalog browsing, secure multi-currency checkout, and fulfillment."
elements:
  - type: "person"
    name: "Customer"
    description: "Shopper who browses, searches, and checks out products."
  - type: "person"
    name: "Store Administrator"
    description: "Administrator who manages inventory and orders."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "Stripe/PayPal service used to process and authorize payments."
  - type: "externalSystem"
    name: "External Shipping Provider"
    description: "FedEx/UPS APIs used to dispatch physical orders."
  - type: "externalSystem"
    name: "External Identity Provider"
    description: "Auth0/AWS Cognito service used for authentication and validating sessions."
  - type: "externalSystem"
    name: "External Notification Service"
    description: "AWS SES used to trigger transactional emails."
relationships:
  - source: "Customer"
    destination: "Online Bookstore System"
    description: "Browses, searches, and checks out"
    technology: "HTTPS (Web/Mobile)"
  - source: "Store Administrator"
    destination: "Online Bookstore System"
    description: "Manages inventory and orders"
    technology: "HTTPS"
  - source: "Online Bookstore System"
    destination: "External Payment Gateway"
    description: "Authorizes payments"
    technology: "REST/TLS"
  - source: "Online Bookstore System"
    destination: "External Shipping Provider"
    description: "Dispatches physical orders"
    technology: "REST/TLS"
  - source: "Online Bookstore System"
    destination: "External Identity Provider"
    description: "Validates sessions"
    technology: "OIDC/OAuth2 over HTTPS"
  - source: "Online Bookstore System"
    destination: "External Notification Service"
    description: "Triggers transactional emails"
    technology: "REST API/TLS"