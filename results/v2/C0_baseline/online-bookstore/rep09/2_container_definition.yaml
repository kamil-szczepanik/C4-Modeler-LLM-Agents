level: container
scope: "Container diagram for Online Bookstore Software System"
system:
  name: "Online Bookstore Software System"
elements:
  - type: "person"
    name: "Book Buyer / Registered Reviewer"
    description: "Web/Mobile users purchasing books and leaving reviews."
  - type: "person"
    name: "Store Administrator"
    description: "Admin portal users managing bookstore operations."
  - type: "externalSystem"
    name: "Payment Gateway Provider"
    description: "External SaaS handling payment processing."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "External logistics managing order fulfillment and shipping."
  - type: "externalSystem"
    name: "Identity Provider / Notification Service"
    description: "Third-party SaaS handling identity and notifications."
  - type: "externalSystem"
    name: "Recommendation Engine"
    description: "External SaaS/ML service providing book recommendations."
  - type: "externalSystem"
    name: "Tax & Localization API"
    description: "External service providing tax calculations and localization data."
  - type: "container"
    name: "Single Page Application (SPA)"
    technology: "React / TypeScript, AWS S3 & CloudFront"
    description: "Frontend client application for browsing, searching, and managing purchases."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway"
    description: "Entry point for routing, JWT validation, and rate limiting."
  - type: "container"
    name: "Catalogue Service"
    technology: "Node.js (Express), Amazon OpenSearch"
    description: "Handles product catalogue browsing and fast keyword searches."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Java (Spring Boot), Amazon Aurora PostgreSQL"
    description: "Manages secure, transactional orders and checkout processes."
  - type: "container"
    name: "Recommendation & Review Service"
    technology: "Python (FastAPI), Amazon SQS/SNS"
    description: "Handles asynchronous event publishing for recommendations and reviews."
relationships:
  - source: "Book Buyer / Registered Reviewer"
    destination: "Single Page Application (SPA)"
    description: "Browses bookstore, places orders, and leaves reviews"
    technology: "HTTPS/JSON via AWS CloudFront/S3"
  - source: "Store Administrator"
    destination: "Single Page Application (SPA)"
    description: "Manages store operations via admin interface"
    technology: "HTTPS/JSON via AWS CloudFront/S3"
  - source: "Single Page Application (SPA)"
    destination: "API Gateway"
    description: "Sends API requests for catalogue, orders, and recommendations"
    technology: "HTTPS / REST"
  - source: "API Gateway"
    destination: "Catalogue Service"
    description: "Routes catalogue and search queries"
    technology: "mTLS and gRPC"
  - source: "API Gateway"
    destination: "Order & Checkout Service"
    description: "Routes order and checkout transactions"
    technology: "mTLS and gRPC"
  - source: "API Gateway"
    destination: "Recommendation & Review Service"
    description: "Routes recommendation and review requests"
    technology: "mTLS and gRPC"
  - source: "Catalogue Service"
    destination: "Amazon OpenSearch"
    description: "Performs fast keyword lookups and queries"
    technology: "Internal query protocol"
  - source: "Order & Checkout Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Executes transactional database queries"
    technology: "Transactional database queries"
  - source: "Order & Checkout Service"
    destination: "Payment Gateway Provider"
    description: "Processes secure payments"
    technology: "Outbound HTTPS"
  - source: "Order & Checkout Service"
    destination: "Shipping Provider APIs"
    description: "Dispatches shipping orders"
    technology: "Outbound HTTPS"
  - source: "Recommendation & Review Service"
    destination: "Amazon SQS/SNS"
    description: "Publishes and consumes asynchronous events"
    technology: "Asynchronous event publishing"