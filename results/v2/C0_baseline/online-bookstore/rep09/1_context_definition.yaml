level: context
scope: "System Context diagram for Online Bookstore Software System"
system:
  name: "Online Bookstore Software System"
  description: "An Amazon-style online bookstore providing physical and electronic book sales, recommendations, and reviews. Designed for global scale, regulatory compliance, and high availability."
elements:
  - type: "person"
    name: "Book Buyer / Registered Reviewer"
    description: "Web/Mobile users purchasing books and leaving reviews."
  - type: "person"
    name: "Store Administrator"
    description: "Admin portal users managing bookstore operations."
  - type: "externalSystem"
    name: "Payment Gateway Provider"
    description: "External SaaS handling payment processing."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "External logistics managing order fulfillment and shipping."
  - type: "externalSystem"
    name: "Identity Provider / Notification Service"
    description: "Third-party SaaS handling identity and notifications."
  - type: "externalSystem"
    name: "Recommendation Engine"
    description: "External SaaS/ML service providing book recommendations."
  - type: "externalSystem"
    name: "Tax & Localization API"
    description: "External service providing tax calculations and localization data."
relationships:
  - source: "Book Buyer / Registered Reviewer"
    destination: "Online Bookstore Software System"
    description: "Interacts with the web/mobile store for browsing, purchasing, and reviewing"
    technology: "HTTPS, TLS 1.3, mTLS perimeter, OAuth2/OIDC"
  - source: "Store Administrator"
    destination: "Online Bookstore Software System"
    description: "Manages the store via the admin portal"
    technology: "HTTPS, TLS 1.3, mTLS perimeter, OAuth2/OIDC"
  - source: "Online Bookstore Software System"
    destination: "Payment Gateway Provider"
    description: "Processes payments securely"
    technology: "REST API via secure iframe/redirect"
  - source: "Online Bookstore Software System"
    destination: "Shipping Provider APIs"
    description: "Dispatches shipping orders asynchronously"
    technology: "REST/SOAP APIs via AWS SQS"
  - source: "Online Bookstore Software System"
    destination: "Identity Provider / Notification Service"
    description: "Authenticates users and sends notifications"
    technology: "HTTPS / OAuth2/OIDC"
  - source: "Online Bookstore Software System"
    destination: "Recommendation Engine"
    description: "Retrieves book recommendations using pseudonymized data"
    technology: "gRPC/REST over HTTPS with JWT"
  - source: "Online Bookstore Software System"
    destination: "Tax & Localization API"
    description: "Calculates taxes and localization with cached fallbacks"
    technology: "REST over HTTPS with signed audit logs"