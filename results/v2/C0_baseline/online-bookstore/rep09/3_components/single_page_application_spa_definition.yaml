level: component
scope: "Component diagram for the Single Page Application (SPA) container"
parentContainer:
  name: "Single Page Application (SPA)"
elements:
  - type: "component"
    name: "Router and View Controller"
    technology: "React Router"
    description: "Handles client-side routing and view rendering."
  - type: "component"
    name: "State and Localization Store"
    technology: "Zustand + i18next"
    description: "Manages lightweight client state, themes, and multi-currency preferences."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios/Fetch with Interceptors"
    description: "Sends REST API requests for catalogue, orders, and recommendations."
  - type: "component"
    name: "Consent and Compliance Manager"
    technology: "React / TypeScript"
    description: "Ensures GDPR and CCPA privacy compliance."
  - type: "component"
    name: "Auth and Session Interceptor"
    technology: "HttpOnly Cookies / TypeScript"
    description: "Secures session management against XSS exfiltration."
relationships:
  - source: "Router and View Controller"
    destination: "State and Localization Store"
    description: "Reads and updates UI state and localization preferences"
  - source: "Router and View Controller"
    destination: "Consent and Compliance Manager"
    description: "Renders privacy and consent controls"
  - source: "API Client Layer"
    destination: "Auth and Session Interceptor"
    description: "Attaches session credentials to requests"
  - source: "Router and View Controller"
    destination: "API Client Layer"
    description: "Triggers data fetching for catalogue, orders, and recommendations"