# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Checkout Orchestrator Component"
    technology: "Java Spring Boot, Spring State Machine"
    description: "Orchestrates the order fulfillment and checkout workflow using the Saga pattern."
  - type: "component"
    name: "Payment Integration Component"
    technology: "Java Spring Boot, Resilience4j"
    description: "Interfaces with the external Payment Gateway Provider using outbound HTTPS with mTLS."
  - type: "component"
    name: "Fulfillment Client Component"
    technology: "Java Spring Boot"
    description: "Dispatches shipping orders to external Shipping Provider APIs via outbound HTTPS with mTLS."
  - type: "component"
    name: "Order Repository Component"
    technology: "Java Spring Boot, JDBC"
    description: "Executes transactional queries against Amazon Aurora PostgreSQL with AWS KMS encryption."
  - type: "component"
    name: "Notification Publisher Component"
    technology: "Java Spring Boot, Amazon SNS/SQS"
    description: "Triggers order confirmation emails and publishes encrypted payloads to the Identity Provider / Notification Service."
relationships:
  - source: "Checkout Orchestrator Component"
    destination: "Payment Integration Component"
    description: "Delegates payment processing requests [Outbound HTTPS with mTLS and Resilience4j circuit breakers]"
  - source: "Checkout Orchestrator Component"
    destination: "Fulfillment Client Component"
    description: "Delegates shipping and dispatch requests [Outbound HTTPS with mTLS]"
  - source: "Checkout Orchestrator Component"
    destination: "Order Repository Component"
    description: "Persists transactional order data [JDBC with AWS KMS encryption]"
  - source: "Checkout Orchestrator Component"
    destination: "Notification Publisher Component"
    description: "Triggers order confirmation notifications [Amazon SNS/SQS with encrypted payloads]"