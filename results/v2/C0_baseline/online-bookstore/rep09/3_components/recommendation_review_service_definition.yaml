# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Recommendation & Review Service container"
parentContainer:
  name: "Recommendation & Review Service"
elements:
  - type: "component"
    name: "Review API Controller"
    technology: "Python FastAPI"
    description: "Handles incoming review submissions and routes processing tasks."
  - type: "component"
    name: "Recommendation API Controller"
    technology: "Python FastAPI"
    description: "Handles requests for personalized book recommendations."
  - type: "component"
    name: "Moderation Pipeline Component"
    technology: "Python / AWS SQS"
    description: "Offloads and processes review moderation asynchronously."
  - type: "component"
    name: "Review Aggregator Component"
    technology: "Python"
    description: "Updates rating caches and aggregates product ratings."
  - type: "component"
    name: "Notification Dispatcher Component"
    technology: "Python"
    description: "Triggers external review emails and notifications."
relationships:
  - source: "Review API Controller"
    destination: "Moderation Pipeline Component"
    description: "Offloads moderation via Amazon SQS"
  - source: "Review API Controller"
    destination: "Review Aggregator Component"
    description: "Updates rating cache via local method call"
  - source: "Catalogue Service"
    destination: "Review Aggregator Component"
    description: "Fetches product ratings via mTLS and gRPC"
  - source: "Notification Dispatcher Component"
    destination: "External Notification Service"
    description: "Triggers review emails via REST/HTTPS"