level: component
scope: "Component diagram for the Catalogue Service container"
parentContainer:
  name: "Catalogue Service"
elements:
  - type: "component"
    name: "Search & Filter Component"
    technology: "Node.js / Express"
    description: "Manages product browsing, fast keyword searches, and filters."
  - type: "component"
    name: "Pricing & Localization Component"
    technology: "Node.js / Express"
    description: "Manages multi-currency pricing, localized shopping experiences, and FX rates."
  - type: "component"
    name: "Amazon OpenSearch"
    technology: "Amazon OpenSearch"
    description: "Performs fast keyword lookups and DSL query execution."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache (Redis)"
    description: "Provides low-latency caching for multi-currency pricing."
  - type: "component"
    name: "Tax & Localization API"
    technology: "External API"
    description: "Fetches real-time FX rates."
relationships:
  - source: "API Gateway"
    destination: "Search & Filter Component"
    description: "Routes catalogue and search requests [mTLS, gRPC]"
  - source: "Search & Filter Component"
    destination: "Amazon OpenSearch"
    description: "Performs fast keyword lookups and queries [Internal query protocol]"
  - source: "Search & Filter Component"
    destination: "Pricing & Localization Component"
    description: "Injects localized pricing into payloads [In-memory / Function call]"
  - source: "Pricing & Localization Component"
    destination: "Amazon ElastiCache (Redis)"
    description: "Reads cached FX rates [TCP]"
  - source: "Pricing & Localization Component"
    destination: "Tax & Localization API"
    description: "Fetches real-time FX rates [HTTPS / REST, asynchronous background sync]"