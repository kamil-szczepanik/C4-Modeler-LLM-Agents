level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "AWS API Gateway Custom Authorizer"
    description: "Component validating JWTs and scopes"
  - type: "component"
    name: "Rate Limiting & Throttling Engine"
    technology: "AWS WAF / API Gateway Throttling"
    description: "Component enforcing tiered WAF policies"
  - type: "component"
    name: "Routing & Protocol Translationer"
    technology: "AWS API Gateway REST to gRPC Mappings"
    description: "Component converting REST to gRPC"
  - type: "component"
    name: "Context & Localization Injector"
    technology: "AWS Lambda / API Gateway Request Transformer"
    description: "Component adding currency and geo-context"
relationships:
  - source: "Authentication & Authorization Filter"
    destination: "Routing & Protocol Translationer"
    description: "Validates requests before routing [HTTPS / gRPC]"
  - source: "Rate Limiting & Throttling Engine"
    destination: "Authentication & Authorization Filter"
    description: "Enforces policies at the edge"
  - source: "Context & Localization Injector"
    destination: "Routing & Protocol Translationer"
    description: "Enriches payload with geo and currency data"
  - source: "Routing & Protocol Translationer"
    destination: "Catalogue Service"
    description: "Routes search and browse queries [mTLS / gRPC]"
  - source: "Routing & Protocol Translationer"
    destination: "Order & Checkout Service"
    description: "Routes transactions [mTLS / gRPC]"
  - source: "Routing & Protocol Translationer"
    destination: "Recommendation & Review Service"
    description: "Routes recommendations [mTLS / gRPC]"