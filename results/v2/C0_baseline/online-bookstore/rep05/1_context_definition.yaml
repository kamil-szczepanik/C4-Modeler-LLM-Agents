level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "A secure, multi-region e-commerce platform designed to sell physical and electronic books with integrated reviews, recommendations, and GDPR/CCPA compliance."
elements:
  - type: "person"
    name: "Customer (Shopper)"
    description: "Shoppers who browse, purchase physical and electronic books, and interact with the store."
  - type: "person"
    name: "Book Reviewer"
    description: "Users who provide reviews and feedback on books."
  - type: "person"
    name: "Store Administrator"
    description: "Administrators who manage retail operations and store configurations."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processor like Stripe or PayPal for PCI-DSS secure checkout."
  - type: "externalSystem"
    name: "Third-Party Shipping Provider"
    description: "External logistics provider like FedEx or UPS for fulfillment and shipping."
  - type: "externalSystem"
    name: "Tax & Compliance Service"
    description: "External service like Avalara for tax calculations and compliance."
  - type: "externalSystem"
    name: "Email/Notification Service"
    description: "External notification service like AWS SES or SendGrid for asynchronous emails."
relationships:
  - source: "Customer (Shopper)"
    destination: "Online Bookstore System"
    description: "Interacts with the online bookstore to browse and purchase books"
    technology: "HTTPS over TLS 1.3"
  - source: "Book Reviewer"
    destination: "Online Bookstore System"
    description: "Submits and reads book reviews"
    technology: "HTTPS over TLS 1.3"
  - source: "Store Administrator"
    destination: "Online Bookstore System"
    description: "Manages store operations and administrative tasks"
    technology: "HTTPS over TLS 1.3"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Processes secure checkouts and payments"
    technology: "REST/TLS"
  - source: "Online Bookstore System"
    destination: "Third-Party Shipping Provider"
    description: "Coordinates order fulfillment and shipping"
    technology: "REST/TLS APIs with circuit breakers"
  - source: "Online Bookstore System"
    destination: "Tax & Compliance Service"
    description: "Calculates taxes and ensures compliance"
    technology: "REST/TLS APIs with circuit breakers"
  - source: "Online Bookstore System"
    destination: "Email/Notification Service"
    description: "Sends asynchronous notifications and emails"
    technology: "AWS SQS"