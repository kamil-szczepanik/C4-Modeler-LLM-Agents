level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Customer (Shopper)"
    description: "Shoppers who browse, purchase physical and electronic books, and interact with the store."
  - type: "person"
    name: "Book Reviewer"
    description: "Users who provide reviews and feedback on books."
  - type: "person"
    name: "Store Administrator"
    description: "Administrators who manage retail operations and store configurations."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processor like Stripe or PayPal for PCI-DSS secure checkout."
  - type: "externalSystem"
    name: "Third-Party Shipping Provider"
    description: "External logistics provider like FedEx or UPS for fulfillment and shipping."
  - type: "externalSystem"
    name: "Tax & Compliance Service"
    description: "External service like Avalara for tax calculations and compliance."
  - type: "externalSystem"
    name: "Email/Notification Service"
    description: "External notification service like AWS SES or SendGrid for asynchronous emails."
  - type: "container"
    name: "Single-Page Application (SPA)"
    technology: "React, hosted on Amazon S3 / CloudFront"
    description: "Customer-facing web application for browsing books, reading reviews, and purchasing."
  - type: "container"
    name: "Admin Back-Office App"
    technology: "React"
    description: "Back-office application for store administrators to manage retail operations."
  - type: "container"
    name: "API Gateway"
    technology: "Amazon API Gateway"
    description: "Entry point for frontend applications, routing requests to backend services."
  - type: "container"
    name: "Core Services"
    technology: "Node.js/NestJS, Amazon ECS (Fargate)"
    description: "Microservices handling core business logic, orders, and user data."
  - type: "container"
    name: "Recommendation Engine"
    technology: "Python/FastAPI, Amazon ECS (Fargate)"
    description: "Engine providing personalized book recommendations."
  - type: "container"
    name: "Notification Worker"
    technology: "Node.js/Python, Amazon ECS (Fargate)"
    description: "Worker processing and dispatching notifications asynchronously."
  - type: "container"
    name: "Analytics Ingestion Container"
    technology: "Amazon ECS (Fargate)"
    description: "Container for collecting and ingesting telemetry and analytics data."
  - type: "container"
    name: "Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL (Multi-AZ)"
    description: "Relational database for transactional data storage."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "NoSQL database for recommendation data and flexible storage."
  - type: "container"
    name: "Amazon S3"
    technology: "Amazon S3"
    description: "Object storage for static assets, backups, and e-book files."
  - type: "container"
    name: "Amazon EventBridge"
    technology: "Amazon EventBridge"
    description: "Event bus for asynchronous event publishing and decoupling."
  - type: "container"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Message queue for asynchronous task distribution."
relationships:
  - source: "Customer (Shopper)"
    destination: "Single-Page Application (SPA)"
    description: "Browses books and manages cart"
    technology: "HTTPS/JSON via Amazon CloudFront"
  - source: "Book Reviewer"
    destination: "Single-Page Application (SPA)"
    description: "Submits book reviews"
    technology: "HTTPS/JSON via Amazon CloudFront"
  - source: "Store Administrator"
    destination: "Admin Back-Office App"
    description: "Manages store operations"
    technology: "HTTPS/JSON"
  - source: "Single-Page Application (SPA)"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS/JSON via Amazon CloudFront"
  - source: "Admin Back-Office App"
    destination: "API Gateway"
    description: "Sends administrative API requests"
    technology: "HTTPS/gRPC with mTLS"
  - source: "API Gateway"
    destination: "Core Services"
    description: "Routes backend requests"
    technology: "HTTPS/gRPC with mTLS via AWS Service Connect"
  - source: "API Gateway"
    destination: "Admin Back-Office App"
    destination_fallback: "API Gateway to Admin App"
    description: "Routes admin requests"
    technology: "HTTPS/gRPC with mTLS via AWS Service Connect"
  - source: "API Gateway"
    destination: "Recommendation Engine"
    description: "Requests recommendations"
    technology: "HTTPS/gRPC with mTLS via AWS Service Connect"
  - source: "Core Services"
    destination: "Aurora PostgreSQL"
    description: "Reads and writes transactional data"
    technology: "TCP/TLS"
  - source: "Core Services"
    destination: "Amazon EventBridge"
    description: "Publishes asynchronous events"
    technology: "Async Event Publishing (JSON)"
  - source: "Amazon EventBridge"
    destination: "Notification Worker"
    description: "Triggers notification tasks"
    technology: "HTTPS/SQS"
  - source: "Amazon EventBridge"
    destination: "Third-Party Shipping Provider"
    description: "Triggers shipping fulfillment events"
    technology: "HTTPS/SQS"
  - source: "Customer (Shopper)"
    destination: "Payment Gateway"
    description: "Completes checkout payment"
    technology: "REST/TLS"
  - source: "Core Services"
    destination: "Tax & Compliance Service"
    description: "Calculates taxes"
    technology: "REST/TLS"
  - source: "Notification Worker"
    destination: "Email/Notification Service"
    description: "Sends notifications"
    technology: "REST/TLS"