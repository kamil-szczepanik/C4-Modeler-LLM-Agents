level: component
scope: "Component diagram for the Amazon EventBridge container"
parentContainer:
  name: "Amazon EventBridge"
elements:
  - type: "component"
    name: "Bookstore Domain Bus"
    technology: "AWS EventBridge Custom Bus"
    description: "Publishes asynchronous domain events such as OrderPlaced and InventoryUpdated."
  - type: "component"
    name: "Schema Registry & Validation"
    technology: "AWS EventBridge Schema Registry"
    description: "Validates asynchronous events for consistency across decoupled services."
relationships:
  - source: "Bookstore Domain Bus"
    destination: "Schema Registry & Validation"
    description: "Validates event payloads against registered schemas [HTTPS]"