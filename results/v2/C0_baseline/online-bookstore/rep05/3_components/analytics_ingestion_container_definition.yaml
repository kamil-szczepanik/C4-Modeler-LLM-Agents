level: component
scope: "Component diagram for the Analytics Ingestion Container container"
parentContainer:
  name: "Analytics Ingestion Container"
elements:
  - type: "component"
    name: "Ingestion API Endpoint"
    technology: "Node.js / Fastify REST/WebSocket Server"
    description: "Receives incoming real-time telemetry from clients."
  - type: "component"
    name: "Consent & PII Sanitizer Middleware"
    technology: "Node.js Middleware"
    description: "Validating cryptographic consent proofs and masking PII."
  - type: "component"
    name: "Event Validator & Enricher"
    technology: "Node.js Component"
    description: "Schema validation and timestamp appending component."
  - type: "component"
    name: "Telemetry Dispatcher"
    technology: "Node.js AWS SDK"
    description: "Forwards events to streaming storage with SQS DLQ overflow."
relationships:
  - source: "Single-Page Application (SPA)"
    destination: "Amazon API Gateway"
    description: "Sends telemetry (HTTPS/WSS)"
  - source: "Amazon API Gateway"
    destination: "Ingestion API Endpoint"
    description: "Forwards authenticated telemetry (HTTPS/WSS, AWS IAM SigV4)"
  - source: "Telemetry Dispatcher"
    destination: "Amazon Kinesis Data Stream"
    description: "Streams sanitized events (TCP/AWS SDK)"
  - source: "Telemetry Dispatcher"
    destination: "Amazon SQS (DLQ)"
    description: "Offloads failed ingestion events (TCP/AWS SDK)"