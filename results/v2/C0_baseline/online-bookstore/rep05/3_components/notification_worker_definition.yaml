level: component
scope: "Component diagram for the Notification Worker container"
parentContainer:
  name: "Notification Worker"
elements:
  - type: "component"
    name: "Event Consumer Component"
    technology: "Node.js with TypeScript"
    description: "Polls events asynchronously from dual SQS queues."
  - type: "component"
    name: "Routing & Prioritization Component"
    technology: "Node.js with TypeScript"
    description: "Inspects and routes event payloads based on priority."
  - type: "component"
    name: "Preference & Consent Validator Component"
    technology: "Node.js with TypeScript"
    description: "Queries user opt-in and GDPR flags from Amazon DynamoDB."
  - type: "component"
    name: "Localization & Template Engine Component"
    technology: "Node.js with TypeScript"
    description: "Renders localized multi-currency content."
  - type: "component"
    name: "Dispatcher Component"
    technology: "Node.js with TypeScript"
    description: "Sends notifications via exponential backoff with circuit breaking."
  - type: "component"
    name: "Notification Worker Container"
    technology: "Node.js with TypeScript, Amazon ECS Fargate"
    description: "Asynchronous containerized system responsible for reliably dispatching transactional alerts and marketing notifications."
  - type: "component"
    name: "Amazon SQS"
    technology: "Amazon SQS (Dual Queues: Transactional & Marketing, with Dead Letter Queue)"
    description: "Ensures resilient asynchronous message decoupling with queue-level isolation and DLQ support."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Offers low-latency access for real-time consent and preference validation."
  - type: "component"
    name: "AWS Secrets Manager"
    technology: "AWS Secrets Manager"
    description: "Injects API keys securely at container startup without environment variables."
  - type: "component"
    name: "Email/Notification Service"
    technology: "External REST API"
    description: "External service that receives rendered notifications."
  - type: "component"
    name: "Amazon EventBridge"
    technology: "Amazon EventBridge"
    description: "Publishes domain events to Amazon SQS."
relationships:
  - source: "Amazon EventBridge"
    destination: "Amazon SQS"
    description: "Publishes domain events [HTTPS/SQS]"
  - source: "Event Consumer Component"
    destination: "Amazon SQS"
    description: "Polls events asynchronously [HTTPS/SQS]"
  - source: "Routing & Prioritization Component"
    destination: "Preference & Consent Validator Component"
    description: "Inspects and routes event payloads [In-memory typed interface]"
  - source: "Preference & Consent Validator Component"
    destination: "Amazon DynamoDB"
    description: "Queries user opt-in and GDPR flags [HTTPS/TLS]"
  - source: "Localization & Template Engine Component"
    destination: "Email/Notification Service"
    description: "Renders localized multi-currency content [In-memory]"
  - source: "Dispatcher Component"
    destination: "Email/Notification Service"
    description: "Sends notifications via exponential backoff with circuit breaking [REST/TLS]"