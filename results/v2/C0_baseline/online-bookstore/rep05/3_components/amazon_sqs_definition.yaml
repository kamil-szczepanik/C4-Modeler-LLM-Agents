level: component
scope: "Component diagram for the Amazon SQS container"
parentContainer:
  name: "Amazon SQS"
elements:
  - type: "component"
    name: "OrderQueue"
    technology: "Amazon SQS FIFO"
    description: "Buffers checkout events and prevents duplicate fulfillment."
  - type: "component"
    name: "NotificationQueue"
    technology: "Amazon SQS Standard"
    description: "Buffers asynchronous email and alert dispatches."
  - type: "component"
    name: "AnalyticsQueue"
    technology: "Amazon SQS Standard"
    description: "Buffers clickstream and inventory events."
  - type: "component"
    name: "OrderDLQ"
    technology: "Amazon SQS FIFO"
    description: "Captures poisoned messages from OrderQueue exceeding maxReceiveCount."
  - type: "component"
    name: "NotificationDLQ"
    technology: "Amazon SQS Standard"
    description: "Captures poisoned messages from NotificationQueue exceeding maxReceiveCount."
  - type: "component"
    name: "AnalyticsDLQ"
    technology: "Amazon SQS Standard"
    description: "Captures poisoned messages from AnalyticsQueue exceeding maxReceiveCount."
relationships:
  - source: "Core Services"
    destination: "OrderQueue"
    description: "Sends messages to via AWS SDK (HTTPS/TLS 1.3)"
  - source: "Notification Worker"
    destination: "NotificationQueue"
    description: "Polls via Long Polling (HTTPS/TLS 1.3)"
  - source: "Analytics Ingestion Container"
    destination: "AnalyticsQueue"
    description: "Polls via Long Polling (HTTPS/TLS 1.3)"
  - source: "OrderQueue"
    destination: "OrderDLQ"
    description: "Routes failed messages exceeding maxReceiveCount"
  - source: "NotificationQueue"
    destination: "NotificationDLQ"
    description: "Routes failed messages exceeding maxReceiveCount"
  - source: "AnalyticsQueue"
    destination: "AnalyticsDLQ"
    description: "Routes failed messages exceeding maxReceiveCount"