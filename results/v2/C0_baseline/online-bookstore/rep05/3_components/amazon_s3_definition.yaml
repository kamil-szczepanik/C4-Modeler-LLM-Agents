level: component
scope: "Component diagram for the Amazon S3 container"
parentContainer:
  name: "Amazon S3"
elements:
  - type: "component"
    name: "Frontend Bucket"
    technology: "Amazon S3"
    description: "Stores static assets for the React Single-Page Application (SPA)."
  - type: "component"
    name: "E-Book Asset Bucket"
    technology: "Amazon S3"
    description: "Stores electronic book assets accessed securely via pre-signed URLs."
  - type: "component"
    name: "Backup & Analytics Bucket"
    technology: "Amazon S3"
    description: "Stores operational logs, backups, and analytics data written by the Analytics Ingestion Container."
relationships:
  - source: "Frontend Bucket"
    destination: "Amazon CloudFront"
    description: "Distributes static assets globally"
  - source: "Core Services"
    destination: "E-Book Asset Bucket"
    description: "Interacts via AWS SDK (HTTPS) using pre-signed URLs"
  - source: "Analytics Ingestion Container"
    destination: "Backup & Analytics Bucket"
    description: "Writes operational logs via AWS internal APIs"