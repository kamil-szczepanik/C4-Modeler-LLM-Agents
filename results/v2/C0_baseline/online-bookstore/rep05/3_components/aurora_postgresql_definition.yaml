level: component
scope: "Component diagram for the Aurora PostgreSQL container"
parentContainer:
  name: "Aurora PostgreSQL"
elements:
  - type: "component"
    name: "PostgreSQL Storage Engine"
    technology: "PostgreSQL Storage Engine"
    description: "Handles physical data storage and retrieval for transactional data."
  - type: "component"
    name: "Aurora Query Processing Engine"
    technology: "Aurora Query Processing Engine"
    description: "Processes and optimizes incoming SQL queries and manages transactions."
  - type: "component"
    name: "Aurora Replication Agent"
    technology: "Aurora Replication Agent"
    description: "Manages data replication across Multi-AZ deployment and read replicas."
  - type: "component"
    name: "Logical Replication / CDC Publisher"
    technology: "PostgreSQL Logical Decoding"
    description: "Streams change events asynchronously for analytics ingestion without impacting primary performance."
relationships:
  - source: "Aurora Query Processing Engine"
    destination: "PostgreSQL Storage Engine"
    description: "Reads and writes transactional data"
  - source: "Aurora Replication Agent"
    destination: "PostgreSQL Storage Engine"
    description: "Replicates storage data across Multi-AZ and read replicas"
  - source: "Logical Replication / CDC Publisher"
    destination: "PostgreSQL Storage Engine"
    description: "Decodes WAL changes from storage"