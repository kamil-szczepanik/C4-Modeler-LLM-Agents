level: component
scope: "Component diagram for the Core Services container"
parentContainer:
  name: "Core Services"
elements:
  - type: "component"
    name: "Catalog & Search Component"
    technology: "Node.js / NestJS"
    description: "Handles product discovery and catalog queries via NestJS modules."
  - type: "component"
    name: "Cart & Checkout Component"
    technology: "Node.js / NestJS"
    description: "Manages shopping carts, multi-currency conversion, and payment orchestration."
  - type: "component"
    name: "User & Compliance Component"
    technology: "Node.js / NestJS"
    description: "Enforces GDPR/CCPA data access, audit logging, and profile management."
  - type: "component"
    name: "Inventory Reservation Component"
    technology: "Node.js / NestJS"
    description: "Manages decoupled, eventual consistency inventory locks via Amazon SQS."
  - type: "component"
    name: "Outbox Dispatcher Component"
    technology: "Node.js / NestJS"
    description: "Publishes reliable transactional events from the database outbox table."
  - type: "component"
    name: "Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Relational database providing transactional integrity and global replication."
  - type: "component"
    name: "Tax & Compliance Service"
    technology: "External REST Service"
    description: "Calculates taxes and validates payments."
  - type: "component"
    name: "Amazon EventBridge"
    technology: "AWS EventBridge"
    description: "Publishes asynchronous domain events."
  - type: "component"
    name: "Amazon SQS"
    technology: "AWS SQS"
    description: "Processes asynchronous inventory locks."
relationships:
  - source: "Core Services"
    destination: "Aurora PostgreSQL"
    description: "Reads and writes transactional data [TCP/TLS with IAM DB Auth]"
  - source: "Cart & Checkout Component"
    destination: "Tax & Compliance Service"
    description: "Calculates taxes and validates payments [REST/TLS with circuit breakers]"
  - source: "Outbox Dispatcher Component"
    destination: "Amazon EventBridge"
    description: "Publishes asynchronous domain events [Async Event Publishing (JSON)]"
  - source: "Inventory Reservation Component"
    destination: "Amazon SQS"
    description: "Processes asynchronous inventory locks [AMQP/HTTPS]"