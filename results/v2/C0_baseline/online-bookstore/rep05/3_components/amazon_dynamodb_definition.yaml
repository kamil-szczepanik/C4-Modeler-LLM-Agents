level: component
scope: "Component diagram for the Amazon DynamoDB container"
parentContainer:
  name: "Amazon DynamoDB"
elements:
  - type: "component"
    name: "ShoppingCarts Table"
    technology: "DynamoDB NoSQL Table"
    description: "Stores user cart items with CustomerID partition key, ItemID sort key, and TTL."
  - type: "component"
    name: "Recommendations Table"
    technology: "DynamoDB NoSQL Table"
    description: "Stores book associations with BookID partition key and RecommendedBookID sort key."
relationships:
  - source: "Core Services"
    destination: "ShoppingCarts Table"
    description: "Queries and manages user cart items via HTTPS/TCP over port 443 using BatchGetItem and Query APIs."
  - source: "Recommendation Engine"
    destination: "Recommendations Table"
    description: "Performs asynchronous writes to update book associations via HTTPS/TCP."
  - source: "ShoppingCarts Table"
    destination: "Amazon EventBridge"
    description: "Streams change-data-capture events via DynamoDB Streams."
  - source: "Recommendations Table"
    destination: "Amazon EventBridge"
    description: "Streams change-data-capture events via DynamoDB Streams."
  - source: "ShoppingCarts Table"
    destination: "AWS CloudWatch"
    description: "Sends operational metrics and Contributor Insights telemetry via native AWS integration."
  - source: "Recommendations Table"
    destination: "AWS CloudWatch"
    description: "Sends operational metrics and Contributor Insights telemetry via native AWS integration."