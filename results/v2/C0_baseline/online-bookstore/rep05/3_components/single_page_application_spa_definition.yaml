level: component
scope: "Component diagram for the Single-Page Application (SPA) container"
parentContainer:
  name: "Single-Page Application (SPA)"
elements:
  - type: "component"
    name: "Catalog Browser Component"
    technology: "React"
    description: "Allows customers to browse the secure multi-currency book catalog."
  - type: "component"
    name: "Checkout Controller Component"
    technology: "React"
    description: "Manages the book checkout and payment process for shoppers."
  - type: "component"
    name: "Recommendation UI Component"
    technology: "React"
    description: "Displays personalized book recommendations and reviews to customers."
relationships:
  - source: "Catalog Browser Component"
    destination: "Checkout Controller Component"
    description: "Passes selected book items for purchase"
  - source: "Checkout Controller Component"
    destination: "Recommendation UI Component"
    description: "Triggers updated recommendation fetch based on purchase history"