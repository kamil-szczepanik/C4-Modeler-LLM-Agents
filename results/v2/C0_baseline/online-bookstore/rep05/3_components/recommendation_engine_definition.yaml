level: component
scope: "Component diagram for the Recommendation Engine container"
parentContainer:
  name: "Recommendation Engine"
elements:
  - type: "component"
    name: "API Controller"
    technology: "FastAPI Router, Pydantic"
    description: "Validates inputs and handles incoming API requests."
  - type: "component"
    name: "Privacy Filter Middleware"
    technology: "Python"
    description: "Scrubs PII and verifies GDPR/CCPA consent flags."
  - type: "component"
    name: "Experimentation Router"
    technology: "Python"
    description: "Evaluates A/B testing variant weights."
  - type: "component"
    name: "Recommendation Logic Service"
    technology: "scikit-learn, pandas"
    description: "Executes collaborative filtering for personalized suggestions."
  - type: "component"
    name: "Model & Feature Store Client"
    technology: "Python"
    description: "Fetches cached features with a fallback circuit breaker."
  - type: "component"
    name: "Amazon ElastiCache"
    technology: "Redis"
    description: "In-memory cache providing low-latency feature storage."
relationships:
  - source: "API Controller"
    destination: "Privacy Filter Middleware"
    description: "In-process call"
  - source: "Privacy Filter Middleware"
    destination: "Experimentation Router"
    description: "In-process call"
  - source: "Experimentation Router"
    destination: "Recommendation Logic Service"
    description: "In-process call"
  - source: "Recommendation Logic Service"
    destination: "Model & Feature Store Client"
    description: "In-process call"
  - source: "Model & Feature Store Client"
    destination: "Amazon ElastiCache"
    description: "TCP/Redis with TLS and RedisAUTH"