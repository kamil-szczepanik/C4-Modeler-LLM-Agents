# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Single Page Application (SPA) container"
parentContainer:
  name: "Single Page Application (SPA)"
elements:
  - type: "component"
    name: "Routing & Shell Component"
    technology: "React Router, TypeScript"
    description: "Manages client-side navigation, layout shells, and UX-level role-based access control (RBAC)."
  - type: "component"
    name: "Catalogue & Search Module"
    technology: "React, TypeScript, Local State Caching"
    description: "Handles browsing and instant filtering with local state caching."
  - type: "component"
    name: "Cart & Checkout Module"
    technology: "React, TypeScript"
    description: "Manages session cart state and purchase flows."
  - type: "component"
    name: "Localization & Personalization Context"
    technology: "React Context, TypeScript"
    description: "Manages currency formatting (USD, EUR, GBP) and user locale state."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios/Fetch, OpenAPI"
    description: "Communicates securely with the backend using OpenAPI generated types."
  - type: "component"
    name: "Infrastructure"
    technology: "Amazon S3, Amazon CloudFront, AWS WAF"
    description: "Provides static hosting, content delivery, and edge security."
relationships:
  - source: "Routing & Shell Component"
    destination: "Catalogue & Search Module"
    description: "Renders and navigates to"
  - source: "Routing & Shell Component"
    destination: "Cart & Checkout Module"
    description: "Renders and navigates to"
  - source: "Catalogue & Search Module"
    destination: "API Client Layer"
    description: "Fetches catalogue and search data via"
  - source: "Cart & Checkout Module"
    destination: "API Client Layer"
    description: "Submits purchase flows and cart state via"
  - source: "Localization & Personalization Context"
    destination: "Routing & Shell Component"
    description: "Provides locale and currency state to"
  - source: "API Client Layer"
    destination: "API Gateway"
    description: "Routes all client traffic securely via HTTPS (TLS 1.3) with JWT bearer tokens or secure cookies"
  - source: "Infrastructure"
    destination: "Single Page Application (SPA)"
    description: "Enforces security policies, DDoS protection, CSP headers, and hosts static assets"