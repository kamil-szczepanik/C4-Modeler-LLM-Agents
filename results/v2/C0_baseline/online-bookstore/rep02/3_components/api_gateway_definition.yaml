level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing & Edge Component"
    technology: "Amazon API Gateway, Amazon CloudFront, AWS WAF"
    description: "Routes, secures, and optimizes client traffic, managing edge routing, rate limiting, request validation, and global content delivery."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "AWS Lambda Authorizer"
    description: "Executes token authorization and header enrichment to validate security credentials."
  - type: "component"
    name: "Service Mesh Proxy"
    technology: "AWS App Mesh / Envoy sidecar"
    description: "Manages service-to-service communication and enforces internal routing and mTLS."
  - type: "component"
    name: "Client Context & Localization Component"
    technology: "Integrated within API Gateway"
    description: "Provides localized multi-currency context propagation and context handling."
relationships:
  - source: "Single Page Application"
    destination: "Routing & Edge Component"
    description: "Routes client traffic [HTTPS (TLS 1.3)]"
  - source: "Routing & Edge Component"
    destination: "Authentication & Authorization Filter"
    description: "Validates tokens [HTTPS/JSON]"
  - source: "Routing & Edge Component"
    destination: "Service Mesh Proxy"
    description: "Forwards internal requests [HTTP/2 or gRPC]"
  - source: "Service Mesh Proxy"
    destination: "Backend Microservices"
    description: "Enforces east-west traffic [mTLS via gRPC]"
  - source: "Authentication & Authorization Filter"
    destination: "Identity Provider"
    description: "Authenticates users [OAuth 2.0 / OIDC over HTTPS]"