level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "Recommendation Controller"
    technology: "Python, FastAPI"
    description: "Routes REST/GraphQL requests."
  - type: "component"
    name: "Recommendation Aggregator"
    technology: "Python, FastAPI"
    description: "Delegates logic, reads/writes vectors, persists history, and fetches ML suggestions."
  - type: "component"
    name: "User Preference Cache"
    technology: "AWS ElastiCache Redis"
    description: "Reads/writes vectors for user preferences."
relationships:
  - source: "Recommendation Controller"
    destination: "Recommendation Aggregator"
    description: "Delegates logic [In-process calls]"
  - source: "Recommendation Aggregator"
    destination: "User Preference Cache"
    description: "Reads/writes vectors [Redis TCP via TLS]"
  - source: "Recommendation Aggregator"
    destination: "Amazon DynamoDB"
    description: "Persists history [AWS SDK / HTTPS]"
  - source: "Recommendation Aggregator"
    destination: "Recommendation Engine"
    description: "Fetches ML suggestions [HTTPS]"