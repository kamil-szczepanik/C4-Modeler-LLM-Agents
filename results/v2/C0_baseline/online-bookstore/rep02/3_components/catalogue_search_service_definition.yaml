level: component
scope: "Component diagram for the Catalogue & Search Service container"
parentContainer:
  name: "Catalogue & Search Service"
elements:
  - type: "component"
    name: "Search API Controller"
    technology: "Go"
    description: "Exposes search endpoints, processes client requests, and interacts with the query normalizer and OpenSearch."
  - type: "component"
    name: "Indexing Worker"
    technology: "Go"
    description: "Updates document indices in Amazon OpenSearch and handles pricing synchronization events."
  - type: "component"
    name: "Query Normalizer & Spellcheck Component"
    technology: "Go"
    description: "Parses raw search terms and provides spellchecking capabilities."
  - type: "component"
    name: "Pricing & Currency Sync Handler"
    technology: "Go"
    description: "Handles pricing and currency synchronization events for catalogue items."
relationships:
  - source: "Search API Controller"
    destination: "Amazon OpenSearch"
    description: "Executes search queries [HTTPS]"
  - source: "Indexing Worker"
    destination: "Amazon OpenSearch"
    description: "Updates document indices [HTTPS]"
  - source: "Search API Controller"
    destination: "Query Normalizer & Spellcheck Component"
    description: "Parses raw terms [In-process Go call]"
  - source: "Indexing Worker"
    destination: "Pricing & Currency Sync Handler"
    description: "Routes pricing events [In-process Go call]"
  - source: "Catalogue & Search Service"
    destination: "Amazon SQS/SNS"
    description: "Publishes and consumes events [HTTPS]"