level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Checkout Controller"
    technology: "REST/GraphQL via mTLS"
    description: "Exposes REST/GraphQL endpoints via mTLS."
  - type: "component"
    name: "Order Management Manager"
    technology: "Java (Spring Boot)"
    description: "Handles domain logic, state transitions, and cart mapping."
  - type: "component"
    name: "Payment Client"
    technology: "Resilience4j"
    description: "Integrates with external payment gateways using Resilience4j circuit breakers."
  - type: "component"
    name: "Shipping Client"
    technology: "Resilience4j"
    description: "Integrates with external shipping gateways using Resilience4j circuit breakers."
  - type: "component"
    name: "Order Repository"
    technology: "Spring Data JPA"
    description: "Manages data persistence via Spring Data JPA."
  - type: "component"
    name: "Domain Event Mapper"
    technology: "Java"
    description: "Transforms JPA entities into versioned event schemas."
  - type: "component"
    name: "Event Publisher"
    technology: "AWS SDK"
    description: "Publishes messages to the Messaging Bus."
  - type: "component"
    name: "Amazon Aurora (PostgreSQL)"
    technology: "PostgreSQL with Outbox Pattern"
    description: "Stores transactional order data using Outbox Pattern tables."
  - type: "component"
    name: "Amazon ECS (Fargate)"
    technology: "Amazon ECS"
    description: "Hosts the containerized microservice."
relationships:
  - source: "API Gateway"
    destination: "Checkout Controller"
    description: "Routes secure client requests [REST/GraphQL via mTLS over HTTPS]"
  - source: "Order Management Manager"
    destination: "Payment Client"
    description: "Executes payment processing [REST/JSON over HTTPS]"
  - source: "Order Management Manager"
    destination: "Shipping Client"
    description: "Integrates for order fulfillment [REST/SOAP over HTTPS]"
  - source: "Order Repository"
    destination: "Amazon Aurora (PostgreSQL)"
    description: "Persists transactional data [Dedicated database driver with AWS KMS encryption]"
  - source: "Event Publisher"
    destination: "Messaging Bus"
    description: "Publishes asynchronous order events [SQS/SNS protocols]"