level: component
scope: "Component diagram for the Messaging Bus container"
parentContainer:
  name: "Messaging Bus"
elements:
  - type: "component"
    name: "Event Publisher / SNS Topics"
    technology: "AWS SNS"
    description: "Publishes checkout, catalogue, and moderation domain events using JSON over HTTPS."
  - type: "component"
    name: "Subscription Queues / SQS Buffers"
    technology: "AWS SQS"
    description: "Buffers asynchronous events and dispatches transactional alerts to the Notification Service."
  - type: "component"
    name: "Payload Sanitizer Middleware"
    technology: "Claims-Check pattern"
    description: "Handles payload sanitization and optimization to ensure GDPR and CCPA compliance."
  - type: "component"
    name: "Schema Registry & Validation Middleware"
    technology: "AWS Glue Schema Registry"
    description: "Enforces strict contract versioning using JSON Schema."
  - type: "component"
    name: "DLQ Routing & Lambda Redrive Component"
    technology: "AWS Lambda"
    description: "Powers automated redrive and error handling for dead-letter queues."
relationships:
  - source: "Order & Checkout Service"
    destination: "Event Publisher / SNS Topics"
    description: "Publishes checkout domain events using JSON over HTTPS"
  - source: "Catalogue & Search Service"
    destination: "Event Publisher / SNS Topics"
    description: "Publishes catalogue events using JSON over HTTPS"
  - source: "Review & Moderation Service"
    destination: "Event Publisher / SNS Topics"
    description: "Publishes moderation events using JSON over HTTPS"
  - source: "Subscription Queues / SQS Buffers"
    destination: "Notification Service"
    description: "Dispatches transactional alerts using REST/JSON over HTTPS"