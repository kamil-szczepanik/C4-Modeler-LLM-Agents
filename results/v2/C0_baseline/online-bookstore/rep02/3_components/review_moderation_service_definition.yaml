level: component
scope: "Component diagram for the Review & Moderation Service container"
parentContainer:
  name: "Review & Moderation Service"
elements:
  - type: "component"
    name: "Review API Controller"
    technology: "Node.js / Express, Joi / Zod, JWT"
    description: "Handles incoming REST/GraphQL traffic and JWT-validated RBAC."
  - type: "component"
    name: "Moderation Engine"
    technology: "Node.js / Express, NLP libraries"
    description: "Executes automated NLP/toxicity checks and quarantines abusive content."
  - type: "component"
    name: "Compliance Manager"
    technology: "Node.js / Express"
    description: "Handles GDPR/CCPA data deletions, anonymization, and Right of Access exports."
  - type: "component"
    name: "Event Publisher"
    technology: "Node.js / Express, Outbox Pattern"
    description: "Dispatches domain events asynchronously to the messaging bus."
  - type: "component"
    name: "Export Aggregator"
    technology: "Node.js / Express"
    description: "Streams user review history securely to cloud storage."
  - type: "component"
    name: "Review Data Access Layer"
    technology: "Node.js / Express, Amazon DocumentDB Driver"
    description: "Interfaces with the primary database."
  - type: "component"
    name: "Primary Database"
    technology: "Amazon DocumentDB (MongoDB-compatible)"
    description: "Stores semi-structured review schemas with encryption at rest via AWS KMS."
  - type: "component"
    name: "Messaging Bus"
    technology: "Amazon SQS / SNS with DLQ"
    description: "Asynchronous messaging bus ensuring event delivery resilience and error isolation."
  - type: "component"
    name: "Amazon S3"
    technology: "Amazon S3"
    description: "Cloud storage for export payloads and secure presigned-url generation."
relationships:
  - source: "Review API Controller"
    destination: "Moderation Engine"
    description: "Passes submitted reviews [In-process function call]"
  - source: "Moderation Engine"
    destination: "Review Data Access Layer"
    description: "Persists approved and quarantined statuses [TCP via TLS 1.3]"
  - source: "Review Data Access Layer"
    destination: "Primary Database"
    description: "Reads and writes review schemas [Encrypted TCP]"
  - source: "Compliance Manager"
    destination: "Messaging Bus"
    description: "Consumes user-deletion events and publishes exports [Amazon SQS/SNS]"
  - source: "Event Publisher"
    destination: "Messaging Bus"
    description: "Publishes moderation and export events [Amazon SNS/SQS via outbox pattern]"
  - source: "Export Aggregator"
    destination: "Amazon S3"
    description: "Streams export payloads for secure presigned-url generation [HTTPS]"