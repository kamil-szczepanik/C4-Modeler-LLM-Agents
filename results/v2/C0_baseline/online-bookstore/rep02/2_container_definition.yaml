level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Customers"
    description: "Shoppers browsing catalogues and executing secure checkouts."
  - type: "person"
    name: "Book Authors / Publishers"
    description: "Stakeholders tracking sales performance and customer reviews."
  - type: "person"
    name: "Store Administrators"
    description: "Staff managing catalogue integrity, pricing, and moderation."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External authentication service managing OAuth 2.0/OIDC and privacy consents."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system processing multi-currency transactions."
  - type: "externalSystem"
    name: "Shipping Provider"
    description: "External partner managing physical order fulfillment."
  - type: "externalSystem"
    name: "Recommendation Engine"
    description: "External SaaS machine learning service for personalized suggestions."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External SaaS handling transactional emails and alerts."
  - type: "container"
    name: "Single Page Application (SPA)"
    technology: "React, TypeScript, Amazon CloudFront, Amazon S3"
    description: "Client-side user interface delivering high-performance catalogue browsing and checkout."
  - type: "container"
    name: "API Gateway"
    technology: "Amazon API Gateway, AWS App Mesh"
    description: "Routes client traffic, enforces mTLS, and handles security and routing."
  - type: "container"
    name: "Catalogue & Search Service"
    technology: "Go, Amazon OpenSearch"
    description: "Handles high-throughput catalogue browsing and search capabilities."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Node.js / Java (Spring Boot), Amazon Aurora (PostgreSQL)"
    description: "Manages orders, secure checkout processes, and transactional data."
  - type: "container"
    name: "Recommendation Service"
    technology: "Python (FastAPI), Amazon DynamoDB"
    description: "Provides personalized book recommendations."
  - type: "container"
    name: "Review & Moderation Service"
    technology: "Node.js"
    description: "Manages compliance-heavy customer reviews and moderation workflows."
  - type: "container"
    name: "Messaging Bus"
    technology: "Amazon SQS / SNS"
    description: "Decouples microservices using asynchronous event-driven messaging."
relationships:
  - source: "Customers"
    destination: "Single Page Application (SPA)"
    description: "Interacts with the online store"
    technology: "HTTPS (TLS 1.3)"
  - source: "Book Authors / Publishers"
    destination: "Single Page Application (SPA)"
    description: "Views sales and reviews"
    technology: "HTTPS (TLS 1.3)"
  - source: "Store Administrators"
    destination: "Single Page Application (SPA)"
    description: "Manages catalogue and moderation"
    technology: "HTTPS (TLS 1.3)"
  - source: "Single Page Application (SPA)"
    destination: "API Gateway"
    description: "Routes all client traffic"
    technology: "HTTPS (TLS 1.3)"
  - source: "API Gateway"
    destination: "Catalogue & Search Service"
    description: "Routes search and browse requests"
    technology: "REST/GraphQL via mTLS"
  - source: "API Gateway"
    destination: "Order & Checkout Service"
    description: "Routes checkout and order requests"
    technology: "REST/GraphQL via mTLS"
  - source: "API Gateway"
    destination: "Recommendation Service"
    description: "Routes recommendation requests"
    technology: "REST/GraphQL via mTLS"
  - source: "API Gateway"
    destination: "Review & Moderation Service"
    description: "Routes review requests"
    technology: "REST/GraphQL via mTLS"
  - source: "Catalogue & Search Service"
    destination: "Amazon OpenSearch"
    description: "Reads and writes catalogue search data"
    technology: "Dedicated database driver"
  - source: "Order & Checkout Service"
    destination: "Amazon Aurora (PostgreSQL)"
    description: "Reads and writes transactional order data"
    technology: "Dedicated database driver"
  - source: "Recommendation Service"
    destination: "Amazon DynamoDB"
    description: "Reads and writes recommendation data"
    technology: "Dedicated database driver"
  - source: "Order & Checkout Service"
    destination: "Messaging Bus"
    description: "Publishes and consumes asynchronous checkout events"
    technology: "Amazon SQS/SNS"
  - source: "Catalogue & Search Service"
    destination: "Messaging Bus"
    description: "Publishes and consumes catalogue events"
    technology: "Amazon SQS/SNS"
  - source: "Review & Moderation Service"
    destination: "Messaging Bus"
    description: "Publishes and consumes moderation events"
    technology: "Amazon SQS/SNS"
  - source: "Order & Checkout Service"
    destination: "Payment Gateway"
    description: "Integrates securely for payment processing"
    technology: "REST/JSON over HTTPS"
  - source: "Order & Checkout Service"
    destination: "Shipping Provider"
    description: "Integrates securely for order fulfillment"
    technology: "REST/SOAP over HTTPS"
  - source: "API Gateway"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OAuth 2.0 / OIDC over HTTPS"
  - source: "Recommendation Service"
    destination: "Recommendation Engine"
    description: "Fetches machine learning suggestions"
    technology: "REST/JSON over HTTPS"
  - source: "Messaging Bus"
    destination: "Notification Service"
    description: "Dispatches transactional alerts"
    technology: "AWS SQS and REST/JSON over HTTPS"