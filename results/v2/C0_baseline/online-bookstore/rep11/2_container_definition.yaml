level: container
scope: "Container diagram for Online Bookstore Software System"
system:
  name: "Online Bookstore Software System"
elements:
  - type: "person"
    name: "Customer (Shopper)"
    description: "End user browsing books, making purchases, and leaving reviews."
  - type: "person"
    name: "Reviewer"
    description: "Community member participating in reviews and discussions."
  - type: "person"
    name: "Store Administrator"
    description: "Staff member managing content, moderation, and store operations."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processing service."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "External shipping and logistics providers."
  - type: "externalSystem"
    name: "Identity & Notification Service"
    description: "External identity and notification service powered by AWS SES."
  - type: "container"
    name: "Single Page Application (SPA)"
    technology: "React / TypeScript, Amazon S3, Amazon CloudFront"
    description: "Frontend client application providing physical and electronic book sales, personalized recommendations, and reviews."
  - type: "container"
    name: "API Gateway / Load Balancer"
    technology: "Amazon API Gateway / Application Load Balancer"
    description: "Edge and routing service for incoming client traffic."
  - type: "container"
    name: "Catalogue & Search Service"
    technology: "AWS ECS / Fargate, Amazon OpenSearch"
    description: "Manages book catalogue and handles search queries."
  - type: "container"
    name: "Checkout & Cart Service"
    technology: "AWS ECS / Fargate, Amazon SQS / SNS"
    description: "Handles shopping cart operations and secure checkout processing."
  - type: "container"
    name: "Recommendation Service"
    technology: "AWS ECS / Fargate, Amazon ElastiCache (Redis), Amazon Kinesis"
    description: "Provides personalized book recommendations using streaming event capture and caching."
  - type: "container"
    name: "Review Service"
    technology: "AWS ECS / Fargate"
    description: "Manages customer reviews and ratings."
  - type: "container"
    name: "Database"
    technology: "Amazon RDS (PostgreSQL with read replicas)"
    description: "Persistent storage for core transactional data with regional data residency."
relationships:
  - source: "Customer (Shopper)"
    destination: "Single Page Application (SPA)"
    description: "Browses books, manages cart, and makes purchases"
    technology: "HTTPS / JSON"
  - source: "Reviewer"
    destination: "Single Page Application (SPA)"
    description: "Writes and reads reviews"
    technology: "HTTPS / JSON"
  - source: "Store Administrator"
    destination: "Single Page Application (SPA)"
    description: "Administers store operations and content"
    technology: "HTTPS / JSON"
  - source: "Single Page Application (SPA)"
    destination: "API Gateway / Load Balancer"
    description: "Sends API requests"
    technology: "HTTPS / JSON"
  - source: "API Gateway / Load Balancer"
    destination: "Catalogue & Search Service"
    description: "Routes catalogue and search queries"
    technology: "HTTPS / REST"
  - source: "API Gateway / Load Balancer"
    destination: "Checkout & Cart Service"
    description: "Routes cart and checkout requests"
    technology: "HTTPS / REST"
  - source: "API Gateway / Load Balancer"
    destination: "Recommendation Service"
    description: "Fetches recommendations"
    technology: "HTTPS / REST"
  - source: "API Gateway / Load Balancer"
    destination: "Review Service"
    description: "Routes review operations"
    technology: "HTTPS / REST"
  - source: "Checkout & Cart Service"
    destination: "Database"
    description: "Reads and writes transactional data"
    technology: "PostgreSQL protocol"
  - source: "Catalogue & Search Service"
    destination: "Database"
    description: "Reads catalogue data"
    technology: "PostgreSQL protocol"
  - source: "Review Service"
    destination: "Database"
    description: "Reads and writes reviews"
    technology: "PostgreSQL protocol"
  - source: "Recommendation Service"
    destination: "Amazon ElastiCache (Redis)"
    description: "Performs sub-50ms recommendation lookups"
    technology: "Redis protocol"
  - source: "Checkout & Cart Service"
    destination: "Payment Gateway"
    description: "Processes payments"
    technology: "HTTPS / REST via Outbox Pattern"
  - source: "Checkout & Cart Service"
    destination: "Shipping Provider APIs"
    description: "Dispatches shipping orders"
    technology: "Amazon SQS / SNS"
  - source: "Checkout & Cart Service"
    destination: "Identity & Notification Service"
    description: "Triggers notifications"
    technology: "HTTPS / REST"