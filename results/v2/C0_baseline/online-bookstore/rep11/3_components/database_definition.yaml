level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Core Transaction Engine"
    technology: "Amazon RDS PostgreSQL"
    description: "Executes ACID writes, user data management, and transactional processing."
  - type: "component"
    name: "Catalog & JSONB Store"
    technology: "PostgreSQL JSONB"
    description: "Manages multi-currency catalogs and flexible product metadata storage."
  - type: "component"
    name: "CDC Publisher"
    technology: "AWS DMS / Debezium"
    description: "Facilitates low-latency change data capture using PostgreSQL Logical Decoding."
  - type: "component"
    name: "Amazon Kinesis"
    technology: "Amazon Kinesis"
    description: "Streams transaction events asynchronously for recommendations."
  - type: "component"
    name: "AWS Secrets Manager"
    technology: "AWS Secrets Manager"
    description: "Secures database credentials with automatic rotation."
  - type: "component"
    name: "Amazon CloudWatch"
    technology: "Amazon CloudWatch"
    description: "Routes audit logs and performance metrics."
relationships:
  - source: "Checkout & Cart Service"
    destination: "Core Transaction Engine"
    description: "Executes ACID writes [PostgreSQL protocol, TLS 1.3, IAM Auth]"
  - source: "Catalogue & Search Service"
    destination: "Catalog & JSONB Store"
    description: "Queries product details [PostgreSQL protocol, TLS 1.3]"
  - source: "Core Transaction Engine"
    destination: "Amazon Kinesis"
    description: "Streams transaction events for recommendations [CDC / PostgreSQL Logical Decoding]"
  - source: "Core Transaction Engine"
    destination: "Amazon CloudWatch"
    description: "Routes audit logs and performance metrics [AWS API]"