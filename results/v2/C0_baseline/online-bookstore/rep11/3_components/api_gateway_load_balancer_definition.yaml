level: component
scope: "Component diagram for the API Gateway / Load Balancer container"
parentContainer:
  name: "API Gateway / Load Balancer"
elements:
  - type: "component"
    name: "Amazon API Gateway"
    technology: "AWS API Gateway"
    description: "Manages API routing, JWT validation via cached JWKS, and rate-limiting."
  - type: "component"
    name: "Application Load Balancer"
    technology: "AWS ALB"
    description: "Distributes incoming dynamic API traffic across backend microservices."
  - type: "component"
    name: "AWS WAF and Shield"
    technology: "AWS WAF / AWS Shield"
    description: "Provides automated OWASP Top-10 mitigations, rate-based rules, and DDoS protection."
relationships:
  - source: "Amazon API Gateway"
    destination: "Application Load Balancer"
    description: "Routes and balances validated API requests [HTTPS]"
  - source: "AWS WAF and Shield"
    destination: "Amazon API Gateway"
    description: "Inspects and filters incoming traffic for security threats [HTTPS]"