level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "Recommendation API Container"
    technology: "Node.js / Express"
    description: "Powers the lightweight Recommendation API for high-throughput reads."
  - type: "component"
    name: "Background Worker Container"
    technology: "Python / FastAPI"
    description: "Implements the background worker for scoring, ranking, and merchandising logic."
relationships:
  - source: "Recommendation API Container"
    destination: "Amazon ElastiCache (Redis)"
    description: "Reads pre-computed or fallback lists [Redis protocol, <50ms]"
  - source: "Background Worker Container"
    destination: "Amazon Kinesis"
    description: "Consumes clickstream events [TCP]"
  - source: "Background Worker Container"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Manages promotional rules and audit logs [TCP / SQL]"
  - source: "Background Worker Container"
    destination: "Amazon ElastiCache (Redis)"
    description: "Writes merged recommendation payloads [Redis protocol]"