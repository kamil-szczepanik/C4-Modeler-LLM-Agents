    name: "Routing & Shell Component"
    technology: "React Router"
    description: "Handles client-side routing and overall application layout shell."
  - type: "component"
    name: "Catalog & Search Module"
    technology: "React, TypeScript"
    description: "Provides catalog browsing and search capabilities."
  - type: "component"
    name: "Cart & Checkout State Machine"
