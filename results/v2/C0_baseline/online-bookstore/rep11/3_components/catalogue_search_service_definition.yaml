level: component
scope: "Component diagram for the Catalogue & Search Service container"
parentContainer:
  name: "Catalogue & Search Service"
elements:
  - type: "component"
    name: "Search API Controller"
    technology: "Node.js / Express"
    description: "Routes search queries via HTTPS / REST and delegates query processing."
  - type: "component"
    name: "Search Query Engine"
    technology: "Node.js"
    description: "Processes search queries and interacts with OpenSearch and fallback handlers."
  - type: "component"
    name: "Database Fallback Handler"
    technology: "Node.js"
    description: "Triggers fallback on circuit breaker trip and retrieves cached search payloads."
  - type: "component"
    name: "Catalogue Sync Worker"
    technology: "Node.js"
    description: "Synchronizes catalogue index via asynchronous events."
relationships:
  - source: "Search API Controller"
    destination: "Search Query Engine"
    description: "Delegates query processing via in-memory function call"
  - source: "Search Query Engine"
    destination: "Database Fallback Handler"
    description: "Triggers fallback on circuit breaker trip via internal function call"