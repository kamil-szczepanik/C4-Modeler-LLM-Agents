level: context
scope: "System Context diagram for Online Bookstore Software System"
system:
  name: "Online Bookstore Software System"
  description: "Cloud-native, Amazon-style online bookstore offering physical and electronic books, reviews, and recommendations, designed for global scale, high availability, strict security, and GDPR/CCPA compliance."
elements:
  - type: "person"
    name: "Customer (Shopper)"
    description: "End user browsing books, making purchases, and leaving reviews."
  - type: "person"
    name: "Registered Reviewer / Community Member"
    description: "Community member participating in reviews and discussions."
  - type: "person"
    name: "Store Administrator / Content Moderator"
    description: "Staff member managing content, moderation, and store operations."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processing service such as Stripe or PayPal."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "External shipping and logistics providers like FedEx and UPS."
  - type: "externalSystem"
    name: "Identity & Notification Service"
    description: "External identity and notification service powered by AWS SES."
relationships:
  - source: "Customer (Shopper)"
    destination: "Online Bookstore Software System"
    description: "Browses, purchases, and interacts with the bookstore"
    technology: "HTTPS (TLS 1.3)"
  - type: "source"
    name: "Registered Reviewer / Community Member"
    destination: "Online Bookstore Software System"
    description: "Writes reviews and participates in community features"
    technology: "HTTPS (TLS 1.3)"
  - type: "source"
    name: "Store Administrator / Content Moderator"
    destination: "Online Bookstore Software System"
    description: "Administers content and moderates the platform"
    technology: "HTTPS (TLS 1.3)"
  - source: "Online Bookstore Software System"
    destination: "Payment Gateway"
    description: "Processes payments securely"
    technology: "HTTPS/REST with mTLS"
  - source: "Online Bookstore Software System"
    destination: "Shipping Provider APIs"
    description: "Handles shipping and logistics asynchronously"
    technology: "HTTPS/REST via AWS SQS async queuing"
  - source: "Online Bookstore Software System"
    destination: "Identity & Notification Service"
    description: "Sends user notifications and manages identities"
    technology: "HTTPS/SMTP"