level: container
scope: "Container diagram for Online Bookstore Web/Mobile Application"
system:
  name: "Online Bookstore Web/Mobile Application"
elements:
  - type: "person"
    name: "Book Buyers"
    description: "End users who purchase physical and electronic books, read reviews, and receive personalized recommendations."
  - type: "person"
    name: "Registered Reviewers"
    description: "Users who leave reviews and interact with the book catalog."
  - type: "person"
    name: "Store Administrators"
    description: "Administrators who manage the bookstore system."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processing service."
  - type: "externalSystem"
    name: "Shipping APIs"
    description: "External fulfillment and delivery partners."
  - type: "externalSystem"
    name: "Tax & Compliance Service"
    description: "Services for tax and compliance management."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Managed identity and authentication service."
  - type: "container"
    name: "Frontend SPA"
    technology: "React, Next.js, AWS S3, CloudFront CDN"
    description: "High-performance single-page application delivering catalogue browsing, reviews, and secure checkout UI."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway"
    description: "Handles routing, rate-limiting, and JWT validation."
  - type: "container"
    name: "Catalog & Search Service"
    technology: "ECS Fargate, Node.js/Go"
    description: "Manages book catalogue and high-speed search operations."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "ECS Fargate, Java/Spring Boot"
    description: "Handles ACID-compliant order processing and secure checkout."
  - type: "container"
    name: "Recommendation Service"
    technology: "ECS Fargate, Python/FastAPI"
    description: "Generates personalized user recommendations."
  - type: "container"
    name: "Pricing & Localization Service"
    technology: "ECS Fargate, Polyglot backend"
    description: "Manages multi-region pricing and localization."
  - type: "container"
    name: "Relational Database"
    technology: "AWS RDS PostgreSQL"
    description: "ACID-compliant relational storage with strict isolation for GDPR/CCPA."
  - type: "container"
    name: "Search Index"
    technology: "AWS OpenSearch"
    description: "High-speed catalogue search engine."
  - type: "container"
    name: "Cache & Session Store"
    technology: "AWS ElastiCache (Redis)"
    description: "High-speed session and rate caching."
  - type: "container"
    name: "Event Bus / Messaging"
    technology: "AWS EventBridge, SNS, SQS"
    description: "Event-driven messaging backbone for asynchronous operations."
relationships:
  - source: "Book Buyers"
    destination: "Frontend SPA"
    description: "Interacts with the online bookstore via browser/client"
    technology: "HTTPS, REST, GraphQL"
  - source: "Registered Reviewers"
    destination: "Frontend SPA"
    description: "Browses catalogue and writes reviews"
    technology: "HTTPS, REST, GraphQL"
  - source: "Store Administrators"
    destination: "Frontend SPA"
    description: "Manages store settings and administration"
    technology: "HTTPS, REST, GraphQL"
  - source: "Frontend SPA"
    destination: "API Gateway"
    description: "Sends API requests for catalogue, checkout, and user actions"
    technology: "HTTPS, REST, GraphQL"
  - source: "API Gateway"
    destination: "Catalog & Search Service"
    description: "Routes catalogue and search queries"
    technology: "gRPC over HTTP/2, mTLS"
  - source: "API Gateway"
    destination: "Order & Checkout Service"
    description: "Routes checkout and order actions"
    technology: "gRPC over HTTP/2, mTLS"
  - source: "API Gateway"
    destination: "Recommendation Service"
    description: "Routes recommendation requests"
    technology: "gRPC over HTTP/2, mTLS"
  - source: "API Gateway"
    destination: "Pricing & Localization Service"
    description: "Routes pricing and localization requests"
    technology: "gRPC over HTTP/2, mTLS"
  - source: "Catalog & Search Service"
    destination: "Relational Database"
    description: "Reads and writes catalogue relational data"
    technology: "TCP/TLS"
  - source: "Catalog & Search Service"
    destination: "Search Index"
    description: "Queries search index"
    technology: "TCP/TLS"
  - source: "Order & Checkout Service"
    destination: "Relational Database"
    description: "Persists transactional order data"
    technology: "TCP/TLS"
  - source: "Order & Checkout Service"
    destination: "Cache & Session Store"
    description: "Manages sessions and rate limits"
    technology: "Encrypted TCP"
  - source: "Recommendation Service"
    destination: "Cache & Session Store"
    description: "Retrieves cached recommendation data"
    technology: "Encrypted TCP"
  - source: "Pricing & Localization Service"
    destination: "Relational Database"
    description: "Queries pricing and localization records"
    technology: "TCP/TLS"
  - source: "Order & Checkout Service"
    destination: "Event Bus / Messaging"
    description: "Publishes order and checkout events"
    technology: "HTTPS"
  - source: "Catalog & Search Service"
    destination: "Event Bus / Messaging"
    description: "Publishes catalogue update events"
    technology: "HTTPS"
  - source: "Order & Checkout Service"
    destination: "Payment Gateway"
    description: "Processes secure payments"
    technology: "HTTPS / REST API"
  - source: "Order & Checkout Service"
    destination: "Shipping APIs"
    description: "Dispatches shipping orders"
    technology: "HTTPS / REST API"
  - source: "Order & Checkout Service"
    destination: "Tax & Compliance Service"
    description: "Calculates taxes and compliance rules"
    technology: "HTTPS / REST API"
  - source: "API Gateway"
    destination: "Identity Provider"
    description: "Validates JWT tokens and authenticates users"
    technology: "HTTPS / OIDC / OAuth2"