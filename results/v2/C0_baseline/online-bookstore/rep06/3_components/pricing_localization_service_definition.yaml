# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Pricing & Localization Service container"
parentContainer:
  name: "Pricing & Localization Service"
elements:
  - type: "component"
    name: "Pricing API Controller"
    technology: "Node.js / TypeScript (Fastify)"
    description: "Handles gRPC/HTTP requests and routes localization requests."
  - type: "component"
    name: "Currency Exchange Engine"
    technology: "Node.js / TypeScript"
    description: "Translates base prices into USD, EUR, and GBP using cached rates."
  - type: "component"
    name: "Localization Rule Resolver"
    technology: "Node.js / TypeScript"
    description: "Fetches regional tax and compliance rules, and queries fallback rules on cache miss."
  - type: "component"
    name: "Price Cache Manager"
    technology: "Node.js / TypeScript"
    description: "Manages caching logic, cache invalidation, and reads/populates localized pricing."
  - type: "component"
    name: "Exchange Rate Sync Worker"
    technology: "Node.js / TypeScript (Fastify)"
    description: "Background worker fetching third-party currency rates and retrieving API keys."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "Node.js / TypeScript"
    description: "Captures administrative pricing updates."
  - type: "component"
    name: "AWS ElastiCache (Redis)"
    technology: "AWS ElastiCache (Redis)"
    description: "Regional cache and session store with read-replicas providing sub-10ms localized pricing reads."
  - type: "component"
    name: "AWS RDS PostgreSQL"
    technology: "AWS RDS PostgreSQL"
    description: "Relational database for persistent pricing records and regional tax rules."
  - type: "component"
    name: "AWS EventBridge"
    technology: "AWS EventBridge"
    description: "Pub/sub event bus for real-time cache invalidation across regions."
  - type: "component"
    name: "AWS Secrets Manager"
    technology: "AWS Secrets Manager"
    description: "Secure storage for external API credentials."
relationships:
  - source: "API Gateway"
    destination: "Pricing API Controller"
    description: "Routes localization requests [gRPC over HTTP/2, mTLS]"
  - source: "Pricing API Controller"
    destination: "Price Cache Manager"
    description: "Reads localized pricing [Redis protocol over TCP/TLS]"
  - source: "Price Cache Manager"
    destination: "AWS ElastiCache (Redis)"
    description: "Populates and invalidates cache [TCP/TLS with Encryption at Rest/Transit]"
  - source: "Localization Rule Resolver"
    destination: "AWS RDS PostgreSQL"
    description: "Fetches fallback rules on cache miss [TCP/TLS]"
  - source: "AWS EventBridge"
    destination: "Price Cache Manager"
    description: "Triggers instant cache invalidation on admin updates [Pub/Sub]"
  - source: "Exchange Rate Sync Worker"
    destination: "AWS Secrets Manager"
    description: "Retrieves API keys [IAM-authenticated task roles]"