level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "API Router"
    technology: "FastAPI"
    description: "Routes incoming gRPC over HTTP/2 requests with mTLS."
  - type: "component"
    name: "Recommendation Engine"
    technology: "Python, PyTorch/Scikit-learn runtime"
    description: "Executes collaborative filtering and recommendation models."
  - type: "component"
    name: "Feature Store Client"
    technology: "Python"
    description: "Interacts with feature stores for model inputs."
  - type: "component"
    name: "Cache Manager"
    technology: "Python"
    description: "Manages data retrieval and caching."
  - type: "component"
    name: "Experimentation & Telemetry Client"
    technology: "Python"
    description: "Publishes pseudonymized interaction events asynchronously."
  - type: "component"
    name: "AWS ElastiCache (Redis)"
    technology: "Redis"
    description: "Caches recommendation outputs and user context for sub-200ms response times."
  - type: "component"
    name: "AWS RDS PostgreSQL"
    technology: "PostgreSQL"
    description: "Stores historical purchase graphs."
  - type: "component"
    name: "AWS EventBridge / SQS"
    technology: "AWS EventBridge / SQS"
    description: "Handles asynchronous event publishing."
relationships:
  - source: "API Gateway"
    destination: "API Router"
    description: "Routes gRPC over HTTP/2 requests with mTLS"
  - source: "Cache Manager"
    destination: "AWS ElastiCache (Redis)"
    description: "Retrieves cached recommendation data via Encrypted TCP"
  - source: "Recommendation Engine"
    destination: "AWS RDS PostgreSQL"
    description: "Reads historical purchase graphs via SQL over TLS"
  - source: "Experimentation & Telemetry Client"
    destination: "AWS EventBridge / SQS"
    description: "Publishes pseudonymized interaction events asynchronously"