level: component
scope: "Component diagram for the Event Bus / Messaging container"
parentContainer:
  name: "Event Bus / Messaging"
elements:
  - type: "component"
    name: "Event Router"
    technology: "AWS EventBridge"
    description: "Central event bus using JSON-based rules for core event routing and schema validation."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "AWS SNS"
    description: "Pub/sub topic for broadcast notifications."
  - type: "component"
    name: "Order Queue"
    technology: "AWS SQS"
    description: "Durable, at-least-once processing queue with Dead Letter Queues (DLQs)."
  - type: "component"
    name: "Analytics Stream"
    technology: "AWS Kinesis"
    description: "High-throughput clickstream and review event ingestion."
  - type: "component"
    name: "EventBridge Schema Registry"
    technology: "AWS EventBridge Schema Registry"
    description: "JSON schema validation and contract enforcement."
relationships:
  - source: "Order & Checkout Service"
    destination: "Event Router"
    description: "Publishes OrderPlaced [HTTPS / AWS SDK]"
  - source: "Event Router"
    destination: "Order Queue"
    description: "Routes OrderPlaced for downstream fulfillment [AWS Native]"
  - source: "Event Router"
    destination: "Notification Dispatcher"
    description: "Broadcasts async triggers for emails [AWS Native]"
  - source: "Catalog & Search Service"
    destination: "Event Router"
    description: "Publishes ItemViewed and ReviewSubmitted [HTTPS / AWS SDK]"
  - source: "Event Router"
    destination: "Recommendation Service"
    description: "Streams engagement data asynchronously [AWS SQS / Kinesis]"