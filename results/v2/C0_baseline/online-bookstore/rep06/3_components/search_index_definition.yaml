level: component
scope: "Component diagram for the Search Index container"
parentContainer:
  name: "Search Index"
elements:
  - type: "component"
    name: "Query Processor"
    technology: "AWS OpenSearch / Lucene Analysis Pipeline"
    description: "Handles incoming search requests, typo-tolerance, analysis pipelines, and input sanitization."
  - type: "component"
    name: "Indexing Engine"
    technology: "AWS OpenSearch Bulk API"
    description: "Consumes catalogue mutation events for near-real-time index updates."
  - type: "component"
    name: "Cluster State & Storage"
    technology: "AWS OpenSearch, EBS NVMe, AWS S3"
    description: "Manages primary-replica shards, EBS NVMe storage, and backup tiers across availability zones."
  - type: "component"
    name: "Catalog & Search Service"
    technology: "External Container"
    description: "External container generating search queries."
  - type: "component"
    name: "Event Bus"
    technology: "AWS SQS / EventBridge"
    description: "External messaging service delivering catalogue mutation events."
  - type: "component"
    name: "AWS S3"
    technology: "AWS S3"
    description: "Cloud storage for Cross-Region Snapshots."
relationships:
  - source: "Catalog & Search Service"
    destination: "Query Processor"
    description: "HTTP/REST [TLS 1.3, AWS IAM SigV4]"
  - source: "Event Bus"
    destination: "Indexing Engine"
    description: "HTTP/REST [TLS 1.3, AWS IAM SigV4 via OpenSearch Bulk API]"
  - source: "Cluster State & Storage"
    destination: "AWS S3"
    description: "HTTPS [TLS 1.3 for Cross-Region Snapshots]"