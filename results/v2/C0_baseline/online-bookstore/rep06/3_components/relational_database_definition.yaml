level: component
scope: "Component diagram for the Relational Database container"
parentContainer:
  name: "Relational Database"
elements:
  - type: "component"
    name: "PgBouncer Connection Pooler"
    technology: "PgBouncer"
    description: "Handles and optimizes database connection pooling to support high scaling requirements."
  - type: "component"
    name: "PostgreSQL Primary Instance"
    technology: "AWS RDS PostgreSQL (Multi-AZ)"
    description: "Manages ACID-compliant persistent queries and transactions for financial orders and multi-currency data."
  - type: "component"
    name: "PostgreSQL Read Replicas"
    technology: "AWS RDS PostgreSQL Read Replicas"
    description: "Provides scalable read operations to guarantee high availability and performance."
relationships:
  - source: "PgBouncer Connection Pooler"
    destination: "PostgreSQL Primary Instance"
    description: "Routes pooled write and transaction traffic [TCP/TLS 1.3]"
  - source: "PgBouncer Connection Pooler"
    destination: "PostgreSQL Read Replicas"
    description: "Routes pooled read traffic [TCP/TLS 1.3]"