level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Router & WAF Integration"
    technology: "AWS WAF & CloudFront"
    description: "Enforces OWASP Top-10 mitigations, SSL termination, and schema validation."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "AWS API Gateway"
    description: "Validates incoming tokens and secures client interactions."
  - type: "component"
    name: "Rate Limiting & Throttling Engine"
    technology: "AWS API Gateway / ElastiCache (Redis)"
    description: "Manages traffic rates and synchronizes distributed rate limits."
  - type: "component"
    name: "Service-Discovery & Routing Proxy"
    technology: "AWS API Gateway / ECS Fargate"
    description: "Routes internal traffic to downstream microservices."
relationships:
  - source: "Edge Router & WAF Integration"
    destination: "Authentication & Authorization Filter"
    description: "Forwards incoming HTTPS/REST/GraphQL requests"
  - source: "Authentication & Authorization Filter"
    destination: "Rate Limiting & Throttling Engine"
    description: "Passes requests through in-memory pipeline"
  - source: "Rate Limiting & Throttling Engine"
    destination: "Service-Discovery & Routing Proxy"
    description: "Passes verified and throttled requests for internal routing"
  - source: "Authentication & Authorization Filter"
    destination: "AWS ElastiCache (Redis)"
    description: "Validates token blacklists [TCP]"
  - source: "Rate Limiting & Throttling Engine"
    destination: "AWS ElastiCache (Redis)"
    description: "Synchronizes distributed rate limits [TCP]"