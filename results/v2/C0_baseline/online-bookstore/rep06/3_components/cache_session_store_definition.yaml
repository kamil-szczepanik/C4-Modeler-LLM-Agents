level: component
scope: "Component diagram for the Cache & Session Store container"
parentContainer:
  name: "Cache & Session Store"
elements:
  - type: "component"
    name: "Session Manager Component"
    technology: "AWS ElastiCache (Redis)"
    description: "Manages user sessions and authentication states."
  - type: "component"
    name: "Catalog & Pricing Cache Component"
    technology: "AWS ElastiCache (Redis)"
    description: "Caches product details and pricing information for fast retrieval."
  - type: "component"
    name: "Rate Limiter & Throttle Component"
    technology: "AWS ElastiCache (Redis)"
    description: "Tracks and enforces rate limits and request throttling."
relationships:
  - source: "Order & Checkout Service"
    destination: "Session Manager Component"
    description: "Encrypted TCP via Redis Protocol"
  - source: "Catalog & Search Service"
    destination: "Catalog & Pricing Cache Component"
    description: "Read/Write product details [Encrypted TCP via Redis Protocol]"
  - source: "Pricing & Localization Service"
    destination: "Catalog & Pricing Cache Component"
    description: "Read exchange rates [Encrypted TCP]"
  - source: "API Gateway"
    destination: "Rate Limiter & Throttle Component"
    description: "Check rate limits [Encrypted TCP]"