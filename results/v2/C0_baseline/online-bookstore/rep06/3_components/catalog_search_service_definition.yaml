level: component
scope: "Component diagram for the Catalog & Search Service container"
parentContainer:
  name: "Catalog & Search Service"
elements:
  - type: "component"
    name: "Search & Browse Router"
    technology: "Node.js/Go"
    description: "Handles gRPC input validation and sanitization."
  - type: "component"
    name: "OpenSearch Query Builder"
    technology: "Node.js/Go"
    description: "Translates domain queries into AWS OpenSearch DSL."
  - type: "component"
    name: "Ingestion & Indexing Worker"
    technology: "Node.js/Go"
    description: "Consumes event bus updates for bulk index synchronization."
  - type: "component"
    name: "AWS OpenSearch"
    technology: "AWS OpenSearch"
    description: "Managed search index storing denormalized documents with localized pricing."
  - type: "component"
    name: "AWS RDS PostgreSQL"
    technology: "AWS RDS PostgreSQL"
    description: "Primary relational database for catalogue persistence."
  - type: "component"
    name: "AWS EventBridge / SQS"
    technology: "AWS EventBridge / SQS"
    description: "Messaging infrastructure with Dead Letter Queues for sync events."
  - type: "component"
    name: "AWS Secrets Manager"
    technology: "AWS Secrets Manager"
    description: "Secure injection of database and search credentials."
relationships:
  - source: "API Gateway"
    destination: "Search & Browse Router"
    description: "Routes catalogue queries via gRPC over HTTP/2 with mTLS."
  - source: "Search & Browse Router"
    destination: "OpenSearch Query Builder"
    description: "Delegates parsed queries via in-memory function calls."
  - source: "OpenSearch Query Builder"
    destination: "AWS OpenSearch"
    description: "Executes search queries via HTTPS/TCP."
  - source: "Ingestion & Indexing Worker"
    destination: "AWS OpenSearch"
    description: "Bulk updates index documents via HTTPS/TCP."
  - source: "Event Bus"
    destination: "Ingestion & Indexing Worker"
    description: "Consumes catalogue change events via HTTPS."