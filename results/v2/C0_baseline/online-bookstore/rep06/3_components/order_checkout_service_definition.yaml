level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Checkout Orchestrator Component"
    technology: "Spring Boot / Spring State Machine"
    description: "Manages distributed transaction sagas and idempotent API calls."
  - type: "component"
    name: "Order Management API Component"
    technology: "Spring MVC / REST"
    description: "Exposes secure endpoints for Customer Support Agent refunds and cancellations."
  - type: "component"
    name: "Order Persistence Component"
    technology: "Spring Data JPA / AWS RDS PostgreSQL"
    description: "Manages relational data and provides strict ACID compliance."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Spring Cloud Stream / AWS SDK"
    description: "Dispatches asynchronous events to AWS EventBridge."
  - type: "component"
    name: "Payment Gateway"
    technology: "External Systems / HTTPS"
    description: "Handles payment processing integration."
  - type: "component"
    name: "Third-Party Shipping APIs"
    technology: "External Systems / HTTPS"
    description: "Handles fulfillment and shipping logistics."
  - type: "component"
    name: "Tax & Compliance Service"
    technology: "External Systems / HTTPS"
    description: "Calculates taxes and ensures regulatory compliance."
  - type: "component"
    name: "AWS Secrets Manager"
    technology: "AWS Secrets Manager / KMS"
    description: "Ensures zero hardcoded secrets and envelope encryption."
  - type: "component"
    name: "AWS EventBridge"
    technology: "AWS EventBridge / SQS"
    description: "Decouples domain event publishing with dead-letter queue support."
relationships:
  - source: "Checkout Orchestrator Component"
    destination: "Payment Gateway"
    description: "HTTPS / REST API"
  - source: "Checkout Orchestrator Component"
    destination: "Third-Party Shipping APIs"
    description: "HTTPS / REST API"
  - source: "Checkout Orchestrator Component"
    destination: "Tax & Compliance Service"
    description: "HTTPS / REST API"
  - source: "Checkout Orchestrator Component"
    destination: "Order Persistence Component"
    description: "JPA/JDBC over TLS"
  - source: "Order Management API Component"
    destination: "Order Persistence Component"
    description: "JPA/JDBC over TLS"
  - source: "Checkout Orchestrator Component"
    destination: "Event Publisher Component"
    description: "In-process Spring Events"
  - source: "Order Management API Component"
    destination: "Event Publisher Component"
    description: "In-process Spring Events"
  - source: "Event Publisher Component"
    destination: "AWS EventBridge"
    description: "HTTPS / AWS SDK"