level: component
scope: "Component diagram for the Frontend SPA container"
parentContainer:
  name: "Frontend SPA"
elements:
  - type: "component"
    name: "Catalog & Search UI Component"
    technology: "Next.js, React"
    description: "Provides the user interface for browsing books, searching the catalog, and viewing product details."
  - type: "component"
    name: "Cart & Checkout UI Component"
    technology: "Next.js, React"
    description: "Manages the shopping cart interactions and secure checkout workflows."
  - type: "component"
    name: "Social Proof & Recommendation UI Component"
    technology: "Next.js, React"
    description: "Renders user reviews, ratings, and personalized book recommendations."
  - type: "component"
    name: "Auth & Session Handler Component"
    technology: "NextAuth.js, React"
    description: "Handles user authentication, session management, and secure cookie handling."
  - type: "component"
    name: "Localization & Consent Manager Component"
    technology: "React, Polyglot frontend modules"
    description: "Manages multi-currency display, regional localization settings, and GDPR/CCPA consent compliance."
relationships:
  - source: "Catalog & Search UI Component"
    destination: "API Gateway"
    description: "Sends catalog and search API requests"
  - source: "Cart & Checkout UI Component"
    destination: "API Gateway"
    description: "Sends cart and checkout actions"
  - source: "Social Proof & Recommendation UI Component"
    destination: "API Gateway"
    description: "Fetches reviews and recommendation data"
  - source: "Auth & Session Handler Component"
    destination: "API Gateway"
    description: "Authenticates users and manages sessions"
  - source: "Localization & Consent Manager Component"
    destination: "API Gateway"
    description: "Synchronizes localization and consent preferences"