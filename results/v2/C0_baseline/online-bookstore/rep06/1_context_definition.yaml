level: context
scope: "System Context diagram for Online Bookstore Web/Mobile Application"
system:
  name: "Online Bookstore Web/Mobile Application"
  description: "A global, cloud-native e-commerce platform delivering physical and electronic book sales, reviews, and personalized recommendations to 1 million monthly active users."
elements:
  - type: "person"
    name: "Book Buyers"
    description: "End users who purchase physical and electronic books, read reviews, and receive personalized recommendations."
  - type: "person"
    name: "Registered Reviewers"
    description: "Users who leave reviews and interact with the book catalog."
  - type: "person"
    name: "Store Administrators"
    description: "Administrators who manage the bookstore system."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processing service such as Stripe or PayPal."
  - type: "externalSystem"
    name: "Shipping Providers"
    description: "External fulfillment and delivery partners such as UPS, FedEx, or DHL."
  - type: "externalSystem"
    name: "Tax & Compliance Service"
    description: "Services for tax and compliance management such as Avalara or OneTrust."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Managed identity and authentication service such as AWS Cognito or Auth0."
  - type: "externalSystem"
    name: "CDN / Edge WAF"
    description: "Content delivery network and web application firewall such as Cloudflare or AWS CloudFront."
  - type: "externalSystem"
    name: "Marketing & Email Service"
    description: "Communication and marketing platform such as SendGrid or Klaviyo."
  - type: "externalSystem"
    name: "Observability & APM"
    description: "Monitoring and telemetry platform such as Datadog or CloudWatch."
relationships:
  - source: "Book Buyers"
    destination: "CDN / Edge WAF"
    description: "Sends web and mobile traffic"
    technology: "HTTPS, TLS 1.3"
  - source: "Registered Reviewers"
    destination: "CDN / Edge WAF"
    description: "Sends web and mobile traffic"
    technology: "HTTPS, TLS 1.3"
  - source: "Store Administrators"
    destination: "CDN / Edge WAF"
    description: "Sends administrative traffic with MFA"
    technology: "HTTPS, TLS 1.3"
  - source: "CDN / Edge WAF"
    destination: "Online Bookstore Web/Mobile Application"
    description: "Routes traffic via reverse proxy and DNS routing"
    technology: "Reverse proxy / DNS routing"
  - source: "Online Bookstore Web/Mobile Application"
    destination: "Payment Gateway"
    description: "Processes payments"
    technology: "HTTPS / REST API"
  - source: "Online Bookstore Web/Mobile Application"
    destination: "Shipping Providers"
    description: "Dispatches shipping orders"
    technology: "Asynchronous event-driven queues / HTTPS REST API"
  - source: "Online Bookstore Web/Mobile Application"
    destination: "Tax & Compliance Service"
    description: "Calculates taxes and ensures compliance"
    technology: "HTTPS / REST API"
  - source: "Online Bookstore Web/Mobile Application"
    destination: "Identity Provider"
    description: "Authenticates users and administrators"
    technology: "HTTPS / OIDC / OAuth2"
  - source: "Online Bookstore Web/Mobile Application"
    destination: "Marketing & Email Service"
    description: "Sends marketing communications and webhooks"
    technology: "HTTPS / REST API & Webhooks"
  - source: "Online Bookstore Web/Mobile Application"
    destination: "Observability & APM"
    description: "Sends metrics, logs, and traces"
    technology: "HTTPS / OTLP"