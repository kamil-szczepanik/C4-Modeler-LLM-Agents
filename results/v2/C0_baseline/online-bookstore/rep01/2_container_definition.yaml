level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Book Buyer"
    description: "End user who browses, purchases books, and receives AI-driven recommendations."
  - type: "person"
    name: "Site Administrator"
    description: "User responsible for managing the bookstore platform and system settings."
  - type: "person"
    name: "Customer Support Representative"
    description: "User responsible for assisting book buyers with orders and support inquiries."
  - type: "person"
    name: "Content Provider/Publisher"
    description: "User responsible for supplying catalog data and digital book assets."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service for tokenized, PCI-DSS compliant checkout."
  - type: "externalSystem"
    name: "Third-Party Shipping API"
    description: "External service for handling order dispatch and shipping."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "External service for real-time multi-currency tax calculations."
  - type: "externalSystem"
    name: "Marketing/Email Service Provider"
    description: "External service for handling email marketing triggers."
  - type: "externalSystem"
    name: "Recommendation Engine/ML Service"
    description: "External machine learning service for personalized recommendations."
  - type: "container"
    name: "Single Page Application (SPA)"
    technology: "React, AWS S3, CloudFront"
    description: "Provides the frontend user interface for catalog browsing, checkout, and account management."
  - type: "container"
    name: "API Gateway"
    technology: "Node.js / Reverse Proxy with JWT validation and rate-limiting"
    description: "Routes client requests securely to internal backend containers with mTLS."
  - type: "container"
    name: "Catalog & Search Container"
    technology: "Spring Boot, Amazon OpenSearch, PostgreSQL"
    description: "Handles book catalog management, metadata, and high-performance keyword search."
  - type: "container"
    name: "Order & Checkout Container"
    technology: "Node.js/Express, PostgreSQL"
    description: "Processes shopping carts, secure payments, and order fulfillment workflows."
  - type: "container"
    name: "Recommendation Container"
    technology: "Python/FastAPI"
    description: "Generates personalized book recommendations for users."
  - type: "container"
    name: "Localization Container"
    technology: "Node.js/Express"
    description: "Manages multi-language, multi-currency, and regional localization settings."
  - type: "container"
    name: "Analytics & Event Ingestion Container"
    technology: "Go, AWS Kinesis Firehose, Amazon SQS/SNS"
    description: "Ingests high-throughput asynchronous telemetry, event streams, and scrubs PII data."
relationships:
  - source: "Book Buyer"
    destination: "Single Page Application (SPA)"
    description: "Accesses book browsing, checkout, and recommendations"
    technology: "HTTPS via AWS CloudFront and Route 53 latency-based routing"
  - source: "Site Administrator"
    destination: "Single Page Application (SPA)"
    description: "Manages platform configuration and administration"
    technology: "HTTPS via AWS CloudFront"
  - source: "Customer Support Representative"
    destination: "Single Page Application (SPA)"
    description: "Assists buyers with support inquiries and order statuses"
    technology: "HTTPS via AWS CloudFront"
  - source: "Content Provider/Publisher"
    destination: "API Gateway"
    description: "Uploads and updates catalog and content assets"
    technology: "HTTPS with JWT validation"
  - source: "Single Page Application (SPA)"
    destination: "API Gateway"
    description: "Sends API requests with JWT validation and rate-limiting"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Catalog & Search Container"
    description: "Routes catalog and search requests"
    technology: "gRPC over mTLS via AWS App Mesh"
  - source: "API Gateway"
    destination: "Order & Checkout Container"
    description: "Routes order and payment transactions"
    technology: "gRPC over mTLS via AWS App Mesh"
  - source: "API Gateway"
    destination: "Recommendation Container"
    description: "Requests personalized recommendations"
    technology: "gRPC over mTLS via AWS App Mesh"
  - source: "API Gateway"
    destination: "Localization Container"
    description: "Requests localization and currency data"
    technology: "gRPC over mTLS via AWS App Mesh"
  - source: "API Gateway"
    destination: "Analytics & Event Ingestion Container"
    description: "Forwards telemetry and events"
    technology: "gRPC over mTLS via AWS App Mesh"
  - source: "Order & Checkout Container"
    destination: "Payment Gateway"
    description: "Processes secure cardholder data and transactions"
    technology: "HTTPS with strict in-memory ephemeral processing"
  - source: "Order & Checkout Container"
    destination: "Third-Party Shipping API"
    description: "Dispatches shipping requests"
    technology: "HTTPS/REST"
  - source: "Order & Checkout Container"
    destination: "Tax Calculation Service"
    description: "Calculates real-time order taxes"
    technology: "HTTPS/REST"
  - source: "Analytics & Event Ingestion Container"
    destination: "Marketing/Email Service Provider"
    description: "Triggers marketing emails and event notifications"
    technology: "Amazon SQS/SNS"
  - source: "Analytics & Event Ingestion Container"
    destination: "Analytics & Event Ingestion Container"
    description: "Streams high-throughput asynchronous telemetry with PII scrubbing"
    technology: "AWS Kinesis Firehose"