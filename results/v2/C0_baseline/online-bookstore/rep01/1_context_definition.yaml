level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "An Amazon-style e-commerce online bookstore built on AWS to serve 1M MAU across three global regions, enabling secure book browsing, purchasing, and AI-driven recommendations."
elements:
  - type: "person"
    name: "Book Buyer"
    description: "End user who browses, purchases books, and receives AI-driven recommendations."
  - type: "person"
    name: "Site Administrator"
    description: "User responsible for managing the bookstore platform and system settings."
  - type: "person"
    name: "Customer Support Representative"
    description: "User responsible for assisting book buyers with orders and support inquiries."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service (Stripe/PayPal) for tokenized, PCI-DSS compliant checkout."
  - type: "externalSystem"
    name: "Third-Party Shipping API"
    description: "External service (FedEx/UPS) for handling order dispatch and shipping."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "External service (Avalara) for real-time multi-currency tax calculations."
  - type: "externalSystem"
    name: "Marketing/Email Service Provider"
    description: "External service (SendGrid/Klaviyo) for handling email marketing triggers."
relationships:
  - source: "Book Buyer"
    destination: "Online Bookstore System"
    description: "Accesses book browsing, purchasing, and recommendations via secure authentication"
    technology: "HTTPS (TLS 1.3), AWS Cognito OAuth2/OIDC"
  - source: "Site Administrator"
    destination: "Online Bookstore System"
    description: "Manages platform configuration and administrative tasks"
    technology: "HTTPS (TLS 1.3), AWS Cognito OAuth2/OIDC"
  - source: "Customer Support Representative"
    destination: "Online Bookstore System"
    description: "Handles customer support tickets and order inquiries"
    technology: "HTTPS (TLS 1.3), AWS Cognito OAuth2/OIDC"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Processes tokenized checkout transactions"
    technology: "HTTPS/REST"
  - source: "Online Bookstore System"
    destination: "Third-Party Shipping API"
    description: "Dispatches order fulfillment requests asynchronously"
    technology: "AWS SQS/EventBridge"
  - source: "Online Bookstore System"
    destination: "Tax Calculation Service"
    description: "Calculates real-time multi-currency taxes during checkout"
    technology: "HTTPS/REST"
  - source: "Online Bookstore System"
    destination: "Marketing/Email Service Provider"
    description: "Triggers marketing emails and notifications"
    technology: "AWS SQS/EventBridge"