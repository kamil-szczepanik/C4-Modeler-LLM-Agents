level: component
scope: "Component diagram for the Catalog & Search Container container"
parentContainer:
  name: "Catalog & Search Container"
elements:
  - type: "component"
    name: "Catalog API Controller"
    technology: "Spring MVC"
    description: "Exposing endpoints for browsing and metadata retrieval."
  - type: "component"
    name: "Search Engine Service"
    technology: "Spring Data / Amazon OpenSearch"
    description: "Handling fuzzy matching and auto-complete via Amazon OpenSearch."
  - type: "component"
    name: "Product Metadata Repository"
    technology: "Spring Data JPA / PostgreSQL"
    description: "Managing book details and inventory via PostgreSQL."
  - type: "component"
    name: "Review & Rating Aggregator"
    technology: "Spring Service"
    description: "Aggregating customer ratings."
  - type: "component"
    name: "Catalog Management Service"
    technology: "Spring Service"
    description: "Processing admin-initiated updates."
  - type: "component"
    name: "Sync & Resilience Pipeline"
    technology: "Debezium with AWS MSK (Kafka)"
    description: "Asynchronous Change Data Capture for decoupled data synchronization."
relationships:
  - source: "API Gateway"
    destination: "Catalog API Controller"
    description: "Routes inbound requests [gRPC over mTLS via AWS App Mesh]"
  - source: "Search Engine Service"
    destination: "Amazon OpenSearch"
    description: "Queries indices [HTTPS / REST]"
  - source: "Product Metadata Repository"
    destination: "PostgreSQL"
    description: "Reads/Writes transactional data [JDBC / TCP]"
  - source: "Catalog Management Service"
    destination: "AWS MSK / Kafka"
    description: "Publishes catalog change events [TCP]"