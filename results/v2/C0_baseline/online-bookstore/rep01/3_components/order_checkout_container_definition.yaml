level: component
scope: "Component diagram for the Order & Checkout Container container"
parentContainer:
  name: "Order & Checkout Container"
elements:
  - type: "component"
    name: "Book Buyer"
    technology: "User Persona"
    description: "Primary persona executing purchases, guest checkouts, and multi-currency transactions."
  - type: "component"
    name: "Cart & Checkout Orchestrator"
    technology: "Node.js / Express / TypeScript"
    description: "Component managing state transitions, BOLA authorization, and the Outbox Pattern."
  - type: "component"
    name: "Payment Processor Client"
    technology: "Node.js / TypeScript"
    description: "Handles secure, PCI-DSS compliant ephemeral card tokenization and interacts with the Payment Gateway."
  - type: "component"
    name: "Fulfillment & Tax Broker"
    technology: "Node.js / TypeScript / AWS SDK"
    description: "Handles asynchronous dispatch of shipping and tax events."
  - type: "component"
    name: "Guest Session Manager"
    technology: "Node.js / TypeScript"
    description: "Manages transient guest tokens and ephemeral session state."
  - type: "component"
    name: "Payment Error Normalizer"
    technology: "Node.js / TypeScript"
    description: "Maps raw gateway exceptions to localized error codes."
  - type: "component"
    name: "Order Database"
    technology: "PostgreSQL"
    description: "PostgreSQL instance storing orders and encrypted PII."
  - type: "component"
    name: "Session Cache"
    technology: "Amazon ElastiCache (Redis)"
    description: "Amazon ElastiCache (Redis) managing high-availability guest sessions."
  - type: "component"
    name: "Payment Gateway"
    technology: "External System"
    description: "External payment processing gateway."
  - type: "component"
    name: "Third-Party Shipping API"
    technology: "External System"
    description: "External fulfillment and shipping API."
  - type: "component"
    name: "Tax Calculation Service"
    technology: "External System"
    description: "External tax calculation service."
  - type: "component"
    name: "API Gateway"
    technology: "AWS App Mesh / gRPC"
    description: "Routes transactions via gRPC over mTLS using AWS App Mesh."
  - type: "component"
    name: "AWS SQS"
    technology: "Amazon SQS"
    description: "Enables asynchronous decoupling of shipping and tax calculations."
relationships:
  - source: "API Gateway"
    destination: "Cart & Checkout Orchestrator"
    description: "Routes transactions via gRPC over mTLS using AWS App Mesh."
  - source: "Cart & Checkout Orchestrator"
    destination: "Order Database"
    description: "Persists relational data via TCP/SQL."
  - source: "Cart & Checkout Orchestrator"
    destination: "AWS SQS"
    description: "Dispatches asynchronous fulfillment events via AWS SDK / HTTPS."
  - source: "Payment Processor Client"
    destination: "Payment Gateway"
    description: "Processes card data via HTTPS with TLS 1.3."
  - source: "Cart & Checkout Orchestrator"
    destination: "Session Cache"
    description: "Manages guest sessions via TCP/RESP."
  - source: "Book Buyer"
    destination: "API Gateway"
    description: "Initiates purchase, guest checkout, and multi-currency transactions."
  - source: "Fulfillment & Tax Broker"
    destination: "Third-Party Shipping API"
    description: "Dispatches shipping events via HTTPS."
  - source: "Fulfillment & Tax Broker"
    destination: "Tax Calculation Service"
    description: "Dispatches tax events via HTTPS."
  - source: "Guest Session Manager"
    destination: "Session Cache"
    description: "Reads and writes transient guest session state."
  - source: "Payment Processor Client"
    destination: "Payment Error Normalizer"
    description: "Sends raw gateway exceptions for error code mapping."