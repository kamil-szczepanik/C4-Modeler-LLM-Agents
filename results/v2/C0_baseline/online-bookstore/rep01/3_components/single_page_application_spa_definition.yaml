level: component
scope: "Component diagram for the Single Page Application (SPA) container"
parentContainer:
  name: "Single Page Application (SPA)"
elements:
  - type: "component"
    name: "Catalog & Search Module"
    technology: "React Component"
    description: "Provides browsing and search capabilities for physical and electronic books."
  - type: "component"
    name: "Checkout & Cart Module"
    technology: "React Component"
    description: "Manages the shopping cart and checkout process."
  - type: "component"
    name: "Localization Context Provider"
    technology: "React Component"
    description: "Provides multi-currency and regional localization context across the application."
  - type: "component"
    name: "Compliance & Consent Banner"
    technology: "React Component"
    description: "Displays GDPR/CCPA compliance and consent banners."
  - type: "component"
    name: "Analytics & Event Ingestion Client"
    technology: "React Component"
    description: "Dispatches telemetry and funnel events asynchronously."
relationships:
  - source: "Catalog & Search Module"
    destination: "API Gateway"
    description: "Fetches book data [HTTPS / REST]"
  - source: "Localization Context Provider"
    destination: "Localization Container"
    description: "Fetches currency rates and dictionaries [HTTPS / REST]"
  - source: "Analytics & Event Ingestion Client"
    destination: "Analytics & Event Ingestion Container"
    description: "Dispatches telemetry and funnel events asynchronously [HTTPS / REST]"