level: component
scope: "Component diagram for the Analytics & Event Ingestion Container container"
parentContainer:
  name: "Analytics & Event Ingestion Container"
elements:
  - type: "component"
    name: "Event Ingestion Receiver"
    technology: "Go"
    description: "Receives incoming telemetry and events from the API Gateway via gRPC."
  - type: "component"
    name: "PII Scrubber and Processor"
    technology: "Go"
    description: "Scrubs sensitive PII data at the boundary to ensure GDPR and CCPA compliance."
  - type: "component"
    name: "Local Buffer Manager"
    technology: "Go, SQLite/WAL"
    description: "Manages encrypted local buffering of events and telemetry for reliable processing."
  - type: "component"
    name: "Stream Publisher"
    technology: "Go, AWS Kinesis Firehose"
    description: "Streams telemetry data securely via HTTPS using the AWS SDK."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Go, Amazon SQS/SNS"
    description: "Triggers marketing emails and asynchronous event notifications to external providers."
relationships:
  - source: "Event Ingestion Receiver"
    destination: "PII Scrubber and Processor"
    description: "Forwards raw events for scrubbing and validation."
  - source: "PII Scrubber and Processor"
    destination: "Local Buffer Manager"
    description: "Persists scrubbed events locally using SQLite with WAL."
  - source: "Local Buffer Manager"
    destination: "Stream Publisher"
    description: "Reads buffered data to stream via AWS Kinesis Firehose."
  - source: "Local Buffer Manager"
    destination: "Notification Dispatcher"
    description: "Sends asynchronous messages via Amazon SQS/SNS."