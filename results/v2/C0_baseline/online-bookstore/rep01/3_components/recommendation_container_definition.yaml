# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Recommendation Container container"
parentContainer:
  name: "Recommendation Container"
elements:
  - type: "component"
    name: "Recommendation API Router"
    technology: "FastAPI, Pydantic"
    description: "FastAPI component handling incoming gRPC/REST requests and Pydantic validation."
  - type: "component"
    name: "Personalization Engine"
    technology: "Python"
    description: "Computes collaborative filtering and Customers also bought logic."
  - type: "component"
    name: "Cold-Start & Fallback Engine"
    technology: "Python"
    description: "Serves trending books for new users or GDPR/CCPA opt-outs."
  - type: "component"
    name: "Data Access Layer"
    technology: "boto3, AWS SDK"
    description: "Interfaces with storage using boto3."
  - type: "component"
    name: "Telemetry Event Emitter"
    technology: "Python, AWS SQS/SNS"
    description: "Asynchronously dispatches impression and click events."
relationships:
  - source: "Recommendation API Router"
    destination: "Personalization Engine"
    description: "Delegates requests based on user history and privacy flags"
  - source: "Recommendation API Router"
    destination: "Cold-Start & Fallback Engine"
    description: "Delegates requests for new users or opted-out users"
  - source: "Personalization Engine"
    destination: "Data Access Layer"
    description: "Reads recommendation data via AWS SDK"
  - source: "Cold-Start & Fallback Engine"
    destination: "Data Access Layer"
    description: "Reads trending books data via AWS SDK"
  - source: "Telemetry Event Emitter"
    destination: "AWS SQS/SNS"
    description: "Dispatches events asynchronously via AWS SQS/SNS"