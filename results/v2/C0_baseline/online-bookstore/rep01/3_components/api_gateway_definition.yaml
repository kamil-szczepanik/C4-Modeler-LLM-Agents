level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Router & TLS Termination"
    technology: "AWS API Gateway / Envoy"
    description: "Offloads TLS termination and routes incoming global latency-based traffic."
  - type: "component"
    name: "Auth & Token Validator"
    technology: "Amazon Cognito / OAuth 2.0 / JWT"
    description: "Validates JWT tokens and OAuth 2.0 credentials for incoming requests."
  - type: "component"
    name: "Request Transformer"
    technology: "AWS API Gateway"
    description: "Performs JSON schema validation and transforms incoming requests."
  - type: "component"
    name: "Traffic Policy & Throttling Component"
    technology: "AWS WAF / API Gateway"
    description: "Enforces rate-limiting and OWASP Top-10 mitigations."
  - type: "component"
    name: "Internal Routing & mTLS Dispatcher"
    technology: "AWS App Mesh / Envoy"
    description: "Dispatches internal requests securely to backend containers using gRPC over mTLS."
  - type: "component"
    name: "Service Mesh Proxy"
    technology: "AWS App Mesh"
    description: "Manages service-to-service communication and security policies."
relationships:
  - source: "Edge Router & TLS Termination"
    destination: "Auth & Token Validator"
    description: "Forwards authenticated traffic"
  - source: "Auth & Token Validator"
    destination: "Request Transformer"
    description: "Passes validated tokens for"
  - source: "Request Transformer"
    destination: "Traffic Policy & Throttling Component"
    description: "Applies traffic and security policies to"
  - source: "Traffic Policy & Throttling Component"
    destination: "Internal Routing & mTLS Dispatcher"
    description: "Routes approved traffic to"
  - source: "Internal Routing & mTLS Dispatcher"
    destination: "Service Mesh Proxy"
    description: "Dispatches via"