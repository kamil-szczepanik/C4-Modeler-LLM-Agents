level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "Manages patient registration, scheduling, electronic medical records (EMR), and billing for medium-sized hospitals and clinics across a hybrid cloud architecture."
elements:
  - type: "person"
    name: "Patients / Consumers"
    description: "Receive care and interact with the system via secure web portals."
  - type: "person"
    name: "Receptionists / Front Desk"
    description: "Manage patient registration and scheduling."
  - type: "person"
    name: "Clinicians / Doctors"
    description: "Access and update electronic medical records (EMR) and clinical data."
  - type: "person"
    name: "Billing Specialists"
    description: "Manage patient billing and submit insurance claims."
  - type: "person"
    name: "Clinic Administrators"
    description: "Oversee clinic operations and management."
  - type: "person"
    name: "Compliance Auditors / Data Protection Officers (DPOs)"
    description: "Audit compliance with HIPAA and GDPR regulations."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "External diagnostic systems providing lab results and medical imaging."
  - type: "externalSystem"
    name: "Insurance Payment Gateways"
    description: "External payment systems for processing insurance claims."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Handles multi-factor authentication and identity management."
  - type: "externalSystem"
    name: "AWS Cloud Infrastructure"
    description: "Cloud environment in eu-central-1 for data replication, compliance log archiving, and WORM storage."
relationships:
  - source: "Patients / Consumers"
    destination: "Clinic Management System"
    description: "Interacts via secure web portals for healthcare services"
    technology: "HTTPS / Secure Web Portals"
  - source: "Receptionists / Front Desk"
    destination: "Clinic Management System"
    description: "Performs patient registration and scheduling"
    technology: "HTTPS / Secure Web Portals"
  - source: "Clinicians / Doctors"
    destination: "Clinic Management System"
    description: "Manages patient EMR and clinical workflows"
    technology: "HTTPS / Secure Web Portals"
  - source: "Billing Specialists"
    destination: "Clinic Management System"
    description: "Manages billing operations"
    technology: "HTTPS / Secure Web Portals"
  - source: "Clinic Administrators"
    destination: "Clinic Management System"
    description: "Manages administrative clinic operations"
    technology: "HTTPS / Secure Web Portals"
  - source: "Compliance Auditors / Data Protection Officers (DPOs)"
    destination: "Clinic Management System"
    description: "Reviews audit logs and verifies regulatory compliance"
    technology: "HTTPS / Secure Web Portals"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users via multi-factor authentication"
    technology: "OIDC / SAML 2.0"
  - source: "Clinic Management System"
    destination: "Lab & Imaging Systems"
    description: "Integrates clinical diagnostic data"
    technology: "HL7 FHIR REST APIs over TLS 1.3"
  - source: "Clinic Management System"
    destination: "Insurance Payment Gateways"
    description: "Submits insurance claims"
    technology: "HTTPS / REST using OAuth 2.0"
  - source: "Clinic Management System"
    destination: "AWS Cloud Infrastructure"
    description: "Replicates data and archives compliance logs"
    technology: "mTLS and S3 APIs"