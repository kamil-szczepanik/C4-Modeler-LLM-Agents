level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Receive care and interact with the system via secure self-service portals."
  - type: "person"
    name: "Receptionists"
    description: "Manage patient admissions and scheduling."
  - type: "person"
    name: "Clinicians"
    description: "Access and update electronic medical records (EMR) and clinical workflows."
  - type: "person"
    name: "Billing Specialists"
    description: "Manage patient billing and payment processing."
  - type: "person"
    name: "Clinic Administrators"
    description: "Oversee clinic operations and management."
  - type: "person"
    name: "Compliance Auditors"
    description: "Audit compliance with HIPAA and GDPR regulations."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "External diagnostic systems providing lab results and medical imaging."
  - type: "externalSystem"
    name: "Insurance Payment Gateways"
    description: "External payment systems for processing insurance claims."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Handles authentication and identity management via OAuth2/OIDC."
  - type: "container"
    name: "API Gateway / Reverse Proxy"
    technology: "Kong / NGINX Ingress"
    description: "Routes incoming traffic and handles reverse proxying for the system."
  - type: "container"
    name: "Patient Portal"
    technology: "Next.js (TypeScript)"
    description: "Provides isolated patient self-service functionalities."
  - type: "container"
    name: "Core Clinical Service"
    technology: "Java (Spring Boot)"
    description: "Manages robust, high-performance clinical logic and EMR."
  - type: "container"
    name: "Billing & Scheduling Service"
    technology: "Node.js / TypeScript"
    description: "Handles patient scheduling, billing operations, and messaging."
  - type: "container"
    name: "Integration / Interoperability Service"
    technology: "Apache Camel / Spring Boot"
    description: "Performs HL7 FHIR data transformation and external system integration."
  - type: "container"
    name: "Data Storage Layer"
    technology: "PostgreSQL (AES-256 at rest) with WORM audit storage"
    description: "Stores relational clinical data with primary-replica replication and immutable audit trails."
  - type: "container"
    name: "Messaging & Observability Infrastructure"
    technology: "Apache Kafka, Prometheus, Grafana, OpenTelemetry, Istio, HashiCorp Vault, ArgoCD"
    description: "Provides asynchronous messaging, service mesh, secrets management, GitOps, and monitoring."
relationships:
  - source: "Patients"
    destination: "API Gateway / Reverse Proxy"
    description: "Accesses patient portal and services"
    technology: "HTTPS/REST via OAuth2/OIDC"
  - source: "Receptionists"
    destination: "API Gateway / Reverse Proxy"
    description: "Accesses administrative and scheduling workflows"
    technology: "HTTPS/REST via OAuth2/OIDC"
  - source: "Clinicians"
    destination: "API Gateway / Reverse Proxy"
    description: "Accesses clinical workflows and EMR"
    technology: "HTTPS/REST via OAuth2/OIDC"
  - source: "Billing Specialists"
    destination: "API Gateway / Reverse Proxy"
    description: "Accesses billing operations"
    technology: "HTTPS/REST via OAuth2/OIDC"
  - source: "Clinic Administrators"
    destination: "API Gateway / Reverse Proxy"
    description: "Oversees operations and compliance"
    technology: "HTTPS/REST via OAuth2/OIDC"
  - source: "Compliance Auditors"
    destination: "API Gateway / Reverse Proxy"
    description: "Reviews compliance and audit logs"
    technology: "HTTPS/REST via OAuth2/OIDC"
  - source: "API Gateway / Reverse Proxy"
    destination: "Patient Portal"
    description: "Reverse proxy routing to frontend"
    technology: "HTTP"
  - source: "API Gateway / Reverse Proxy"
    destination: "Core Clinical Service"
    description: "Reverse proxy routing to core clinical logic"
    technology: "HTTP"
  - source: "API Gateway / Reverse Proxy"
    destination: "Billing & Scheduling Service"
    description: "Reverse proxy routing to billing and scheduling"
    technology: "HTTP"
  - source: "Core Clinical Service"
    destination: "Integration / Interoperability Service"
    description: "Exchanges interoperability data"
    technology: "gRPC with mTLS via Istio"
  - source: "Billing & Scheduling Service"
    destination: "Integration / Interoperability Service"
    description: "Exchanges interoperability data"
    technology: "gRPC with mTLS via Istio"
  - source: "Integration / Interoperability Service"
    destination: "Core Clinical Service"
    description: "Exchanges interoperability data"
    technology: "gRPC with mTLS via Istio"
  - source: "Integration / Interoperability Service"
    destination: "Billing & Scheduling Service"
    description: "Exchanges interoperability data"
    technology: "gRPC with mTLS via Istio"
  - source: "Billing & Scheduling Service"
    destination: "Insurance Payment Gateways"
    description: "Submits insurance claims asynchronously"
    technology: "Asynchronous messaging via Apache Kafka"
  - source: "Integration / Interoperability Service"
    destination: "Lab & Imaging Systems"
    description: "Integrates diagnostic and imaging data"
    technology: "HL7 FHIR APIs"
  - source: "Core Clinical Service"
    destination: "Data Storage Layer"
    description: "Reads and writes clinical data"
    technology: "TLS-encrypted SQL"
  - source: "Billing & Scheduling Service"
    destination: "Data Storage Layer"
    description: "Reads and writes billing and schedule data"
    technology: "TLS-encrypted SQL"