level: component
scope: "Component diagram for the Billing & Scheduling Service container"
parentContainer:
  name: "Billing & Scheduling Service"
elements:
  - type: "component"
    name: "Scheduling Engine Component"
    technology: "Node.js / TypeScript"
    description: "Handles appointment scheduling, rescheduling, and waitlist management."
  - type: "component"
    name: "Rescheduling & Waitlist Sub-component"
    technology: "Node.js / TypeScript"
    description: "Sub-component managing appointment changes and patient waitlists."
  - type: "component"
    name: "Billing & Estimation Engine Component"
    technology: "Node.js / TypeScript"
    description: "Processes billing logic and cost estimations."
  - type: "component"
    name: "Notification Dispatcher Component"
    technology: "Node.js / TypeScript"
    description: "Dispatches notifications to the patient portal and external systems."
relationships:
  - source: "Scheduling Engine Component"
    destination: "Billing & Estimation Engine Component"
    description: "In-process TypeScript function calls"
  - source: "Notification Dispatcher Component"
    destination: "Patient Portal"
    description: "Server-Sent Events / WebSocket via API Gateway"