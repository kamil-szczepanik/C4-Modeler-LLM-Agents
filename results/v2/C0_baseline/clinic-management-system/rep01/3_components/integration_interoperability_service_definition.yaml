level: component
scope: "Component diagram for the Integration / Interoperability Service container"
parentContainer:
  name: "Integration / Interoperability Service"
elements:
  - type: "component"
    name: "FHIR Ingress/Egress Router"
    technology: "Apache Camel / Spring Boot"
    description: "Routes HL7 FHIR REST over HTTPS requests to external lab and imaging systems."
  - type: "component"
    name: "Data Transformation Engine"
    technology: "Apache Camel"
    description: "Executes HL7 FHIR data transformations and streams cryptographic audit metadata."
  - type: "component"
    name: "DLQ Manager"
    technology: "Apache Camel"
    description: "Streams failure events to the messaging and observability infrastructure."
  - type: "component"
    name: "Audit Interceptor"
    technology: "Spring Boot"
    description: "Intercepts requests and messages for compliance auditing."
  - type: "component"
    name: "Consent & Policy Enforcement"
    technology: "Open Policy Agent"
    description: "Validates consent scopes and enforces zero-trust policies."
relationships:
  - source: "FHIR Ingress/Egress Router"
    destination: "Lab & Imaging Systems"
    description: "External data exchange [HL7 FHIR REST over HTTPS]"
  - source: "FHIR Ingress/Egress Router"
    destination: "Consent & Policy Enforcement"
    description: "Validates consent scopes [gRPC]"
  - source: "DLQ Manager"
    destination: "Messaging & Observability Infrastructure"
    description: "Streams failure events [Apache Kafka]"
  - source: "Data Transformation Engine"
    destination: "WORM Audit Storage"
    description: "Streams cryptographic audit metadata [gRPC/TLS]"