level: component
scope: "Component diagram for the Messaging & Observability Infrastructure container"
parentContainer:
  name: "Messaging & Observability Infrastructure"
elements:
  - type: "component"
    name: "Event Broker Component"
    technology: "Apache Kafka (KRaft mode)"
    description: "Asynchronous event streaming ensuring zero data loss and high availability."
  - type: "component"
    name: "Service Mesh"
    technology: "Istio Envoy sidecars"
    description: "Enforcing zero-trust networking and strict mTLS communication."
  - type: "component"
    name: "Secrets Management Component"
    technology: "HashiCorp Vault"
    description: "Dynamic secrets and encryption keys management."
  - type: "component"
    name: "Telemetry Collector & Monitoring"
    technology: "OpenTelemetry Collector, Prometheus, and Grafana"
    description: "Service mesh telemetry, system metrics collection, and monitoring."
  - type: "component"
    name: "GitOps Engine"
    technology: "ArgoCD"
    description: "Declarative deployments and cluster synchronization."
relationships:
  - source: "Service Mesh"
    destination: "Event Broker Component"
    description: "Istio mTLS (strict mode) securing service communication."
  - source: "Secrets Management Component"
    destination: "Event Broker Component"
    description: "Provides AES-256 keys and encryption for Kafka application-layer envelope encryption."
  - source: "Telemetry Collector & Monitoring"
    destination: "Service Mesh"
    description: "Collects metrics and traces routed through OpenTelemetry scrubbing filters."
  - source: "GitOps Engine"
    destination: "Service Mesh"
    description: "HTTPS via Kubernetes API for cluster synchronization and deployments."