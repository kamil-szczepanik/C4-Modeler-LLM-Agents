level: component
scope: "Component diagram for the Core Clinical Service container"
parentContainer:
  name: "Core Clinical Service"
elements:
  - type: "component"
    name: "EMR Management Component"
    technology: "Java Spring Boot"
    description: "Manages electronic medical records, reads/writes encrypted session views, and persists data."
  - type: "component"
    name: "Clinical Workflow & Decision Component"
    technology: "Java Spring Boot"
    description: "Handles clinical workflows, decision support, and persists operational data."
  - type: "component"
    name: "Audit & Compliance Component"
    technology: "Java Spring Boot"
    description: "Publishes audit events asynchronously to enforce compliance."
  - type: "component"
    name: "Clinical Session Cache Component"
    technology: "Spring Data Redis (AES-GCM)"
    description: "Caches decrypted EMR view models with in-memory encryption and short TTLs."
relationships:
  - source: "EMR Management Component"
    destination: "Data Storage Layer"
    description: "Persists data [TLS-encrypted SQL]"
  - source: "Clinical Workflow & Decision Component"
    destination: "Data Storage Layer"
    description: "Persists data [TLS-encrypted SQL]"
  - source: "Audit & Compliance Component"
    destination: "Apache Kafka"
    description: "Publishes audit events asynchronously [TCP]"
  - source: "EMR Management Component"
    destination: "Clinical Session Cache Component"
    description: "Reads/writes encrypted session views [In-Memory TLS]"
  - source: "Core Clinical Service"
    destination: "Integration / Interoperability Service"
    description: "Exchanges interoperability data [gRPC with mTLS]"