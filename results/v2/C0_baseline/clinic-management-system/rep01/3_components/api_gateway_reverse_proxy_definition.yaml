level: component
scope: "Component diagram for the API Gateway / Reverse Proxy container"
parentContainer:
  name: "API Gateway / Reverse Proxy"
elements:
  - type: "component"
    name: "WAF & Security Inspector"
    technology: "OWASP WAF module"
    description: "Inspects inbound traffic for threats and vulnerabilities."
  - type: "component"
    name: "OIDC/JWT Validation Engine"
    technology: "OAuth2/OIDC"
    description: "Validates JSON Web Tokens and handles authentication."
  - type: "component"
    name: "Rate Limiting & Tenant Throttling"
    technology: "Kong / NGINX with Redis"
    description: "Controls request rates and enforces tenant throttling."
  - type: "component"
    name: "Routing & Upstream Load Balancer"
    technology: "Kong / NGINX Ingress"
    description: "Routes requests to appropriate upstream microservices and balances load."
  - type: "component"
    name: "Telemetry & Trace Injector"
    technology: "OpenTelemetry"
    description: "Injects telemetry and trace headers for observability."
relationships:
  - source: "WAF & Security Inspector"
    destination: "OIDC/JWT Validation Engine"
    description: "Forwards inspected requests"
  - source: "OIDC/JWT Validation Engine"
    destination: "Rate Limiting & Tenant Throttling"
    description: "Passes authenticated requests"
  - source: "Rate Limiting & Tenant Throttling"
    destination: "Routing & Upstream Load Balancer"
    description: "Forwards throttled requests"
  - source: "Routing & Upstream Load Balancer"
    destination: "Telemetry & Trace Injector"
    description: "Passes routed requests for trace injection"