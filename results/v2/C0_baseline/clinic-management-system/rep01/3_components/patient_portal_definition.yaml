# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Patient Portal container"
parentContainer:
  name: "Patient Portal"
elements:
  - type: "component"
    name: "Patient Authentication Controller"
    technology: "NextAuth.js, TypeScript"
    description: "Utilized for secure multi-factor authentication, token management, and integration with external Identity Providers."
  - type: "component"
    name: "Registration & Profile Manager"
    technology: "React Component, TypeScript"
    description: "Empowers patients with self-service registration and profile management."
  - type: "component"
    name: "Appointment Self-Service UI"
    technology: "React Component, TypeScript"
    description: "Provides the user interface for appointment self-service scheduling."
  - type: "component"
    name: "Localization & Preference Module"
    technology: "React Component, TypeScript"
    description: "Manages user localization and preference settings."
  - type: "component"
    name: "BFF API Router"
    technology: "Next.js API Routes, TypeScript"
    description: "Backend-for-Frontend API router handling secure communication with backend services."
  - type: "component"
    name: "Patient Portal Container"
    technology: "Next.js, TypeScript"
    description: "Secure, highly available frontend container ensuring strict HIPAA and GDPR compliance."
relationships:
  - source: "Patient Authentication Controller"
    destination: "External Identity Provider (IdP)"
    description: "HTTPS/OIDC"
  - source: "BFF API Router"
    destination: "API Gateway / Reverse Proxy"
    description: "HTTPS/REST via Istio mTLS"
  - source: "Registration & Profile Manager"
    destination: "BFF API Router"
    description: "Internal TypeScript Calls"
  - source: "Appointment Self-Service UI"
    destination: "BFF API Router"
    description: "Internal TypeScript Calls"
  - source: "Localization & Preference Module"
    destination: "BFF API Router"
    description: "Internal TypeScript Calls"
  - source: "Patient Portal Container"
    destination: "HashiCorp Vault"
    description: "Encrypted API"