level: component
scope: "Component diagram for the Data Storage Layer container"
parentContainer:
  name: "Data Storage Layer"
elements:
  - type: "component"
    name: "Relational Database"
    technology: "PostgreSQL v15+ with CloudNativePG"
    description: "Stores clinical, billing, and schedule data with automated failover."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Manages connection pooling for high-throughput concurrency."
  - type: "component"
    name: "Object Storage"
    technology: "AWS S3 WORM Storage (Object Lock)"
    description: "Ensures 10-year retention for compliance audit logs."
  - type: "component"
    name: "Secret Management"
    technology: "HashiCorp Vault"
    description: "Provides dynamic secret management and AES-256 envelope encryption at rest."
relationships:
  - source: "Core Clinical Service"
    destination: "Relational Database"
    description: "Reads and writes clinical data via TLS-encrypted SQL"
  - source: "Billing & Scheduling Service"
    destination: "Relational Database"
    description: "Reads and writes billing and schedule data via TLS-encrypted SQL"
  - source: "Services"
    destination: "Connection Pooler"
    description: "Connects securely via Istio mTLS and PgBouncer connection pooler"