level: context
scope: "System Context diagram for Clinic Management System (CMS)"
system:
  name: "Clinic Management System (CMS)"
  description: "Manages patient admissions, EMRs, scheduling, and billing for medium-sized hospitals and clinics with 99.99% availability and strict HIPAA/GDPR compliance."
elements:
  - type: "person"
    name: "Patient"
    description: "End user receiving care, accessing personal health records, scheduling, and billing via web or mobile."
  - type: "person"
    name: "Clinician (Doctor/Nurse)"
    description: "Medical staff managing patient EMRs, admissions, and clinical workflows."
  - type: "person"
    name: "Receptionist/Front Desk"
    description: "Staff handling patient check-ins, scheduling, and front desk operations."
  - type: "person"
    name: "Billing Specialist"
    description: "Staff managing financial transactions, billing, and insurance claims."
  - type: "person"
    name: "Hospital Administrator"
    description: "Management staff overseeing system administration and hospital operations."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External diagnostic systems for lab results and medical imaging."
  - type: "externalSystem"
    name: "Payment Gateway / Insurance Clearinghouse"
    description: "External financial systems for processing payments and insurance claims."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External identity management system handling authentication and MFA."
relationships:
  - source: "Patient"
    destination: "Clinic Management System (CMS)"
    description: "Accesses patient portal and scheduling"
    technology: "HTTPS (Web/Mobile) through WAF"
  - source: "Clinician (Doctor/Nurse)"
    destination: "Clinic Management System (CMS)"
    description: "Manages EMRs, admissions, and clinical workflows"
    technology: "HTTPS (Web/Mobile) through WAF"
  - source: "Receptionist/Front Desk"
    destination: "Clinic Management System (CMS)"
    description: "Manages patient admissions and scheduling"
    technology: "HTTPS (Web/Mobile) through WAF"
  - source: "Billing Specialist"
    destination: "Clinic Management System (CMS)"
    description: "Processes billing and financial records"
    technology: "HTTPS (Web/Mobile) through WAF"
  - source: "Hospital Administrator"
    destination: "Clinic Management System (CMS)"
    description: "Oversees system administration"
    technology: "HTTPS (Web/Mobile) through WAF"
  - source: "Clinic Management System (CMS)"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users with OIDC/SAML 2.0 and MFA"
    technology: "OIDC / SAML 2.0, TLS 1.3"
  - source: "Clinic Management System (CMS)"
    destination: "External Lab & Imaging Systems"
    description: "Integrates lab and imaging data"
    technology: "HL7 FHIR APIs, TLS 1.3, mTLS"
  - source: "Clinic Management System (CMS)"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Processes payments and insurance claims"
    technology: "REST, TLS 1.3, mTLS"