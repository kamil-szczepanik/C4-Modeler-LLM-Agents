level: container
scope: "Container diagram for Clinic Management System (CMS)"
system:
  name: "Clinic Management System (CMS)"
elements:
  - type: "person"
    name: "Patient"
    description: "End user receiving care, accessing personal health records, scheduling, and billing via web or mobile."
  - type: "person"
    name: "Clinician (Doctor/Nurse)"
    description: "Medical staff managing patient EMRs, admissions, and clinical workflows."
  - type: "person"
    name: "Receptionist/Front Desk"
    description: "Staff handling patient check-ins, scheduling, and front desk operations."
  - type: "person"
    name: "Billing Specialist"
    description: "Staff managing financial transactions, billing, and insurance claims."
  - type: "person"
    name: "Hospital Administrator"
    description: "Management staff overseeing system administration and hospital operations."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External identity management system handling authentication and MFA."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External diagnostic systems for lab results and medical imaging."
  - type: "externalSystem"
    name: "Payment Gateway / Insurance Clearinghouse"
    description: "External financial systems for processing payments and insurance claims."
  - type: "container"
    name: "Frontend SPAs"
    technology: "React, Nginx"
    description: "Delivers responsive static UI containers for clinical and administrative workflows."
  - type: "container"
    name: "Envoy API Gateway"
    technology: "Envoy"
    description: "Manages ingress routing, rate limiting, circuit breaking, and strict mTLS service mesh security."
  - type: "container"
    name: "Domain Microservices"
    technology: "Spring Boot, Kubernetes, Istio"
    description: "Powers core domain microservices including Patient Registry, Scheduling, EMR, and Billing."
  - type: "container"
    name: "Integration Service"
    technology: "Node.js"
    description: "Integrates internal core services with external lab and imaging systems."
  - type: "container"
    name: "Decoupled Data Tier"
    technology: "AWS RDS PostgreSQL, On-premise clusters, WORM Storage"
    description: "Ensures secure, encrypted relational data storage and 10-year audit retention."
relationships:
  - source: "Patient"
    destination: "Frontend SPAs"
    description: "Accesses patient portal and scheduling"
    technology: "HTTPS (TLS 1.3)"
  - source: "Clinician (Doctor/Nurse)"
    destination: "Frontend SPAs"
    description: "Manages EMRs, admissions, and clinical workflows"
    technology: "HTTPS (TLS 1.3)"
  - source: "Receptionist/Front Desk"
    destination: "Frontend SPAs"
    description: "Manages patient admissions and scheduling"
    technology: "HTTPS (TLS 1.3)"
  - source: "Billing Specialist"
    destination: "Frontend SPAs"
    description: "Processes billing and financial records"
    technology: "HTTPS (TLS 1.3)"
  - source: "Hospital Administrator"
    destination: "Frontend SPAs"
    description: "Oversees system administration"
    technology: "HTTPS (TLS 1.3)"
  - source: "Frontend SPAs"
    destination: "Envoy API Gateway"
    description: "Routes requests from client applications"
    technology: "HTTPS / REST / JSON"
  - source: "Envoy API Gateway"
    destination: "Domain Microservices"
    description: "Routes internal API traffic to microservices"
    technology: "gRPC over mTLS (Istio)"
  - source: "Domain Microservices"
    destination: "Decoupled Data Tier"
    description: "Reads and writes relational data securely"
    technology: "Encrypted database drivers (AES-256)"
  - source: "Integration Service"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges diagnostic data and lab results"
    technology: "HL7 FHIR APIs"
  - source: "Domain Microservices"
    destination: "Identity Provider (IdP)"
    description: "Authenticates and authorizes users"
    technology: "OAuth2/OIDC"