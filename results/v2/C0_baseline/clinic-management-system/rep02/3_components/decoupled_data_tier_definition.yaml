level: component
scope: "Component diagram for the Decoupled Data Tier container"
parentContainer:
  name: "Decoupled Data Tier"
elements:
  - type: "component"
    name: "Primary Operational Database"
    technology: "AWS RDS PostgreSQL & On-premise PostgreSQL"
    description: "Primary transactional storage for sub-second EMR performance."
  - type: "component"
    name: "Reporting & Analytics Read Replica"
    technology: "PostgreSQL Read Replica"
    description: "Offloads read-only queries for reporting and analytics."
  - type: "component"
    name: "Audit & Archive Manager"
    technology: "Apache Kafka & Debezium"
    description: "Streams change logs via CDC for audit streaming without operational locking."
  - type: "component"
    name: "WORM Storage Vault"
    technology: "AWS S3 Object Lock / MinIO"
    description: "Immutable WORM storage satisfying greater than or equal to 10-year retention."
relationships:
  - source: "Primary Operational Database"
    destination: "Audit & Archive Manager"
    description: "Streams change logs via Debezium CDC (TCP/IP)"
  - source: "Audit & Archive Manager"
    destination: "WORM Storage Vault"
    description: "Writes immutable object archives via HTTPS"