level: component
scope: "Component diagram for the Domain Microservices container"
parentContainer:
  name: "Domain Microservices"
elements:
  - type: "component"
    name: "Patient Registry Component"
    technology: "Spring Boot, JPA"
    description: "Manages patient admissions and records."
  - type: "component"
    name: "Scheduling Engine"
    technology: "Spring Boot, Redis"
    description: "Handles scheduling and real-time resource clash checks using distributed locking."
  - type: "component"
    name: "EMR Core Component"
    technology: "Spring Boot"
    description: "Manages electronic medical records and writes audit logs."
  - type: "component"
    name: "Billing Component"
    technology: "Spring Boot"
    description: "Manages billing for healthcare providers."
  - type: "component"
    name: "Event Bus Publisher"
    technology: "Spring Cloud Stream, Apache Kafka"
    description: "Publishes payload-encrypted events for asynchronous event messaging."
  - type: "component"
    name: "Authorization & Policy Enforcement Component"
    technology: "OPA sidecar, Spring Security"
    description: "Enforces strict security compliance and least-privilege RBAC/ABAC policies."
relationships:
  - source: "Patient Registry Component"
    destination: "Event Bus Publisher"
    description: "Publishes domain events"
  - source: "Scheduling Engine"
    destination: "Event Bus Publisher"
    description: "Publishes scheduling events"
  - source: "EMR Core Component"
    destination: "Event Bus Publisher"
    description: "Publishes EMR update events"
  - source: "Billing Component"
    destination: "Event Bus Publisher"
    description: "Publishes billing events"