level: component
scope: "Component diagram for the Frontend SPAs container"
parentContainer:
  name: "Frontend SPAs"
elements:
  - type: "component"
    name: "Role-Based UI Modules"
    technology: "React, Redux Toolkit"
    description: "Provides lazy-loaded, role-tailored feature bundles to meet performance requirements for patients, clinicians, and administrative staff."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios, in-memory OIDC state"
    description: "Secures authentication tokens without vulnerable browser storage and communicates with backend services."
  - type: "component"
    name: "Telemetry & Monitoring Module"
    technology: "OpenTelemetry, RUM"
    description: "Captures Real User Monitoring data and tracks P95 load times."
  - type: "component"
    name: "Nginx Web Server"
    technology: "Nginx"
    description: "Serves immutable static assets with strict Content Security Policy headers and TLS 1.3 encryption."
relationships:
  - source: "Role-Based UI Modules"
    destination: "API Client Layer"
    description: "Fetches data and authenticates via"
  - source: "API Client Layer"
    destination: "Envoy API Gateway"
    description: "Authenticates and fetches data [HTTPS / REST & GraphQL / JSON]"
  - source: "Role-Based UI Modules"
    destination: "Telemetry & Monitoring Module"
    description: "Sends telemetry and performance metrics to"
  - source: "Nginx Web Server"
    destination: "Role-Based UI Modules"
    description: "Serves static assets for"