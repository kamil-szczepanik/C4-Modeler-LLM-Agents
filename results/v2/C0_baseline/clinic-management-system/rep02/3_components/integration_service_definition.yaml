level: component
scope: "Component diagram for the Integration Service container"
parentContainer:
  name: "Integration Service"
elements:
  - type: "component"
    name: "FHIR Adapter"
    technology: "NestJS, TypeScript"
    description: "Interfaces with external lab and imaging systems using HL7 FHIR with mTLS and OAuth2."
  - type: "component"
    name: "Outbox Message Relay"
    technology: "BullMQ, Redis"
    description: "Executes the reliable outbox pattern and dispatches events asynchronously."
  - type: "component"
    name: "Audit Logger"
    technology: "Winston, OpenTelemetry"
    description: "Handles secure audit logging for compliance and monitoring."
  - type: "component"
    name: "DLQ Alert Dispatcher"
    technology: "NestJS Event Emitter"
    description: "Dispatches alerts for dead-letter queue messages."
relationships:
  - source: "Outbox Message Relay"
    destination: "FHIR Adapter"
    description: "Internal Function Call / Event Dispatch"
  - source: "Outbox Message Relay"
    destination: "DLQ Alert Dispatcher"
    description: "Internal Event [Pub/Sub]"
  - source: "DLQ Alert Dispatcher"
    destination: "Internal Notification Service"
    description: "REST/gRPC [Internal API]"