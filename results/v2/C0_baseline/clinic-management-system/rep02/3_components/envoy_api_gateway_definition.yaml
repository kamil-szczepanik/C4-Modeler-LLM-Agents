level: component
scope: "Component diagram for the Envoy API Gateway container"
parentContainer:
  name: "Envoy API Gateway"
elements:
  - type: "component"
    name: "Router Component"
    technology: "Envoy Routing Engine"
    description: "Handles dynamic ingress routing and virtual hosts."
  - type: "component"
    name: "External Authorization Filter"
    technology: "Envoy Ext-Authz / OPA"
    description: "Validates JWT tokens and scopes against the Identity Provider."
  - type: "component"
    name: "Traffic Priority & Rate Limiting Filter"
    technology: "Envoy Filter / Redis Backend"
    description: "Enforces tiered quotas using a Redis backend."
  - type: "component"
    name: "WASM Security & Sanitization Filter"
    technology: "Rust / WASM"
    description: "Performs real-time PII masking and sanitization."
  - type: "component"
    name: "Telemetry & Metrics Emitter"
    technology: "OpenTelemetry"
    description: "Exports traces and audit logs to the observability stack."
relationships:
  - source: "Router Component"
    destination: "External Authorization Filter"
    description: "Passes ingress requests for validation"
  - source: "External Authorization Filter"
    destination: "Traffic Priority & Rate Limiting Filter"
    description: "Passes authenticated requests for rate limiting"
  - source: "Traffic Priority & Rate Limiting Filter"
    destination: "WASM Security & Sanitization Filter"
    description: "Passes rate-limited requests for PII masking"
  - source: "WASM Security & Sanitization Filter"
    destination: "Domain Microservices"
    description: "Forwards sanitized traffic via gRPC over mTLS"
  - source: "Traffic Priority & Rate Limiting Filter"
    destination: "Redis Rate Limit Store"
    description: "Fetches token counts via Redis Protocol / TCP"
  - source: "External Authorization Filter"
    destination: "Identity Provider"
    description: "Validates tokens via gRPC"
  - source: "Telemetry & Metrics Emitter"
    destination: "Observability Stack"
    description: "Exports logs and metrics via OTLP / gRPC"