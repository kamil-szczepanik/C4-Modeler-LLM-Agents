level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Interacts with the system for scheduling and managing healthcare services."
  - type: "person"
    name: "Receptionists"
    description: "Manages patient admissions, scheduling, and front-desk operations."
  - type: "person"
    name: "Clinicians"
    description: "Accesses and updates Electronic Medical Records (EMRs) and clinical data."
  - type: "person"
    name: "Billing Specialists"
    description: "Handles billing, payments, and insurance claims processing."
  - type: "person"
    name: "Clinic Administrators"
    description: "Manages administrative operations and system oversight."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "Provides diagnostic results and medical imaging data via interoperability standards."
  - type: "externalSystem"
    name: "Payment Gateways"
    description: "Processes secure financial transactions and credit card payments."
  - type: "externalSystem"
    name: "Insurance Clearinghouses"
    description: "Handles healthcare insurance claims processing."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Handles Multi-Factor Authentication (MFA) and session management using OIDC/SAML 2.0."
  - type: "container"
    name: "React SPA & Patient Portal BFF"
    technology: "React & Node.js/NestJS"
    description: "Responsive client interfaces and backend-for-frontend for web client interactions."
  - type: "container"
    name: "Kong API Gateway"
    technology: "Kong"
    description: "API routing, rate limiting, and zero-trust security enforcement."
  - type: "container"
    name: "Istio Service Mesh"
    technology: "Istio"
    description: "Enforces zero-trust mTLS encryption across hybrid clusters."
  - type: "container"
    name: "Spring Boot Core Services"
    technology: "Spring Boot (Java)"
    description: "Handles core business logic for patient admissions, EMRs, scheduling, and billing."
  - type: "container"
    name: "Apache Camel Integration Service"
    technology: "Apache Camel"
    description: "Connects to external Lab, Imaging, and Payment systems using HL7 FHIR and HTTPS."
  - type: "container"
    name: "Go Audit Logging Container"
    technology: "Go"
    description: "High-throughput write-optimized audit logging for compliance."
  - type: "container"
    name: "Apache Superset Reporting Container"
    technology: "Apache Superset"
    description: "Executes analytics and reporting workloads."
  - type: "container"
    name: "PostgreSQL"
    technology: "PostgreSQL (Primary & Read-Replica)"
    description: "ACID-compliant transactional persistence and read-replicas for CQRS."
  - type: "container"
    name: "Redis"
    technology: "Redis"
    description: "Distributed caching layer for high-performance data access."
  - type: "container"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Centralized secret management."
relationships:
  - source: "Patients"
    destination: "React SPA & Patient Portal BFF"
    description: "Interacts with portal for scheduling and EMR access"
    technology: "HTTPS/REST"
  - source: "Receptionists"
    destination: "React SPA & Patient Portal BFF"
    description: "Manages admissions and scheduling"
    technology: "HTTPS/REST"
  - source: "Clinicians"
    destination: "React SPA & Patient Portal BFF"
    description: "Accesses and updates EMRs and clinical data"
    technology: "HTTPS/REST"
  - source: "Billing Specialists"
    destination: "React SPA & Patient Portal BFF"
    description: "Handles billing and financial transactions"
    technology: "HTTPS/REST"
  - source: "Clinic Administrators"
    destination: "React SPA & Patient Portal BFF"
    description: "Accesses system management interfaces"
    technology: "HTTPS/REST"
  - source: "React SPA & Patient Portal BFF"
    destination: "Kong API Gateway"
    description: "Sends client requests through API gateway"
    technology: "HTTPS"
  - source: "Kong API Gateway"
    destination: "Istio Service Mesh"
    description: "Routes and validates traffic using JWT, enforcing mTLS"
    technology: "mTLS"
  - source: "Istio Service Mesh"
    destination: "Spring Boot Core Services"
    description: "Routes secured traffic to core business logic"
    technology: "gRPC/HTTP"
  - source: "Istio Service Mesh"
    destination: "Apache Camel Integration Service"
    description: "Routes integration traffic"
    technology: "gRPC/HTTP"
  - source: "Istio Service Mesh"
    destination: "Go Audit Logging Container"
    description: "Sends audit events"
    technology: "gRPC/HTTP"
  - source: "Istio Service Mesh"
    destination: "Apache Superset Reporting Container"
    description: "Accesses reporting and analytics data"
    technology: "HTTP"
  - source: "Spring Boot Core Services"
    destination: "PostgreSQL"
    description: "Reads and writes transactional data"
    technology: "JDBC"
  - source: "Spring Boot Core Services"
    destination: "Redis"
    description: "Caches and retrieves session/data cache"
    technology: "TCP"
  - source: "Apache Superset Reporting Container"
    destination: "PostgreSQL"
    description: "Queries data from read-replicas for analytics"
    technology: "JDBC"
  - source: "Apache Camel Integration Service"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges diagnostic results and medical imaging"
    technology: "HL7 FHIR over HTTPS"
  - source: "Apache Camel Integration Service"
    destination: "Payment Gateways"
    description: "Processes payment transactions"
    technology: "HTTPS"
  - source: "Apache Camel Integration Service"
    destination: "Insurance Clearinghouses"
    description: "Handles claims processing"
    technology: "HTTPS"
  - source: "Kong API Gateway"
    destination: "Identity Provider"
    description: "Authenticates and authorizes users"
    technology: "OIDC / SAML 2.0"
  - source: "Spring Boot Core Services"
    destination: "HashiCorp Vault"
    description: "Retrieves secrets and configuration"
    technology: "HTTPS"