level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "PostgreSQL Primary Instance"
    technology: "PostgreSQL 16"
    description: "Handles transactional data, ACID compliance, and multi-tenant data isolation using Row-Level Security."
  - type: "component"
    name: "PostgreSQL Read-Replica Cluster"
    technology: "PostgreSQL 16"
    description: "Handles heavy analytical queries to isolate them from the primary instance and guarantee sub-second EMR performance."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Provides connection pooling with session mode for safe context propagation."
  - type: "component"
    name: "Backup Daemon"
    technology: "pgBackRest"
    description: "Manages AES-256 encrypted backups and WAL archiving for 10-year retention."
  - type: "component"
    name: "HA Orchestration"
    technology: "Patroni with etcd"
    description: "Provides automated leader election and high availability for 99.99% uptime."
  - type: "component"
    name: "Audit & Monitoring"
    technology: "pgaudit, postgres_exporter"
    description: "Handles database activity monitoring and audit logging for HIPAA and GDPR compliance."
relationships:
  - source: "Spring Boot Core Services"
    destination: "Connection Pooler"
    description: "Writes transactional data [JDBC/TLS 1.3]"
  - source: "Apache Superset"
    destination: "PostgreSQL Read-Replica Cluster"
    description: "Queries analytics data [JDBC/TLS 1.3]"
  - source: "PostgreSQL Primary Instance"
    destination: "PostgreSQL Read-Replica Cluster"
    description: "Streams WAL replication [TCP/mTLS]"
  - source: "PostgreSQL Primary Instance"
    destination: "Go Audit Logging Container"
    description: "Sends audit events [pgaudit/Async]"