level: component
scope: "Component diagram for the Go Audit Logging Container container"
parentContainer:
  name: "Go Audit Logging Container"
elements:
  - type: "component"
    name: "API Ingestion Handler"
    technology: "Go, net/http, gRPC"
    description: "Ingests audit events via gRPC over mTLS (Strict) from the Istio Service Mesh."
  - type: "component"
    name: "Event Validation & Sanitizer"
    technology: "Go"
    description: "Performs validation and PHI/PII scrubbing on incoming audit events."
  - type: "component"
    name: "Batch Writer Engine"
    technology: "Go routines, channels, pgx"
    description: "Processes events through Go routines and channels, writing them in batches using pgx connection pooling."
  - type: "component"
    name: "Archival & Policy Manager"
    technology: "Go"
    description: "Manages lifecycle and retention policies, archiving data securely to WORM storage."
  - type: "component"
    name: "Local Disk-Backed Queue / WAL"
    technology: "Local Disk, Go"
    description: "Acts as a backpressure buffer using Write-Ahead Logging."
relationships:
  - source: "Istio Service Mesh"
    destination: "API Ingestion Handler"
    description: "gRPC over mTLS (Strict)"
  - source: "API Ingestion Handler"
    destination: "Event Validation & Sanitizer"
    description: "Passes raw events for validation"
  - source: "Event Validation & Sanitizer"
    destination: "Batch Writer Engine"
    description: "Internal Go Channels"
  - source: "Batch Writer Engine"
    destination: "PostgreSQL"
    description: "TCP/SSL with pgx connection pooling"
  - source: "Archival & Policy Manager"
    destination: "WORM Object Storage (MinIO/S3)"
    description: "HTTPS with Object Lock API"
  - source: "Batch Writer Engine"
    destination: "Apache Superset"
    description: "Read-only PostgreSQL replica queries"