level: component
scope: "Component diagram for the Spring Boot Core Services container"
parentContainer:
  name: "Spring Boot Core Services"
elements:
  - type: "component"
    name: "Patient Management"
    technology: "Spring Boot, Java"
    description: "Handles patient admissions and profile data."
  - type: "component"
    name: "Scheduling Engine"
    technology: "Spring Boot, Java"
    description: "Manages appointment scheduling utilizing Redis for distributed locking."
  - type: "component"
    name: "EMR Core"
    technology: "Spring Boot, Java"
    description: "Manages Electronic Medical Records with sub-second latency requirements."
  - type: "component"
    name: "Billing & Claims"
    technology: "Spring Boot, Java"
    description: "Handles billing processing and claims management."
  - type: "component"
    name: "Security/Masking Interceptor"
    technology: "Spring Boot, Java"
    description: "Enforces stringent security and data masking protocols for HIPAA and GDPR compliance."
  - type: "component"
    name: "Event-Driven Audit Component"
    technology: "Spring Boot, Java"
    description: "Processes asynchronous event processing for auditing operations."
  - type: "component"
    name: "Data-Access Encryption Interceptor"
    technology: "Spring Data JPA, Hibernate, Java"
    description: "Handles transactional persistence and data encryption using custom JPA AttributeConverters."
relationships:
  - source: "Patient Management"
    destination: "Data-Access Encryption Interceptor"
    description: "Persists and retrieves encrypted patient data"
  - source: "Scheduling Engine"
    destination: "Data-Access Encryption Interceptor"
    description: "Persists appointment data"
  - source: "EMR Core"
    destination: "Data-Access Encryption Interceptor"
    description: "Persists EMR records securely"
  - source: "Billing & Claims"
    destination: "Data-Access Encryption Interceptor"
    description: "Persists billing transactions"