level: component
scope: "Component diagram for the Istio Service Mesh container"
parentContainer:
  name: "Istio Service Mesh"
elements:
  - type: "component"
    name: "Istio Ingress Gateway"
    technology: "Istio, Envoy Proxy"
    description: "Routes external traffic and forwards ingress traffic securely via mTLS."
  - type: "component"
    name: "Envoy Proxy"
    technology: "Envoy Proxy"
    description: "Handles low-latency traffic interception and sidecar security."
  - type: "component"
    name: "Istiod"
    technology: "Istiod"
    description: "Manages automated certificate authority issuance via HashiCorp Vault and distributes xDS configuration."
relationships:
  - source: "Istio Ingress Gateway"
    destination: "Envoy Proxy"
    description: "Forwards ingress traffic [mTLS]"
  - source: "Istiod"
    destination: "Envoy Proxy"
    description: "Distributes X.509 certs and xDS configuration [gRPC]"