level: component
scope: "Component diagram for the Redis container"
parentContainer:
  name: "Redis"
elements:
  - type: "component"
    name: "Session & Rate-Limiting Engine"
    technology: "Redis Core"
    description: "Manages user authentication tokens and API throttling."
  - type: "component"
    name: "Distributed Lock Manager"
    technology: "Redlock Algorithm"
    description: "Executes atomic operations to prevent appointment resource clashes."
  - type: "component"
    name: "Data Caching Module"
    technology: "Redis Caching"
    description: "Retrieves non-PHI reference datasets and provides state management for high performance."
relationships:
  - source: "Spring Boot Core Services"
    destination: "Session & Rate-Limiting Engine"
    description: "Manages user authentication tokens and API throttling [RESP3 over TLS via Istio mTLS]"
  - source: "Spring Boot Core Services"
    destination: "Distributed Lock Manager"
    description: "Executes atomic operations to prevent appointment resource clashes [RESP3 over TLS via Istio mTLS]"
  - source: "Spring Boot Core Services"
    destination: "Data Caching Module"
    description: "Retrieves non-PHI reference datasets [RESP3 over TLS via Istio mTLS]"
  - source: "Session & Rate-Limiting Engine"
    destination: "Go Audit Logging Container"
    description: "Ships security events and audit logs [Syslog over TCP/TLS]"