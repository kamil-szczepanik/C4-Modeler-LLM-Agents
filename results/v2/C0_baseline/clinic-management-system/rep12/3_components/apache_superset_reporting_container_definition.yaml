level: component
scope: "Component diagram for the Apache Superset Reporting Container container"
parentContainer:
  name: "Apache Superset Reporting Container"
elements:
  - type: "component"
    name: "Superset Web Server & UI"
    technology: "Python/Flask"
    description: "Provides secure business intelligence and analytical reporting UI for hospital administrators and clinical operations managers."
  - type: "component"
    name: "Superset Celery Worker"
    technology: "Python/Celery"
    description: "Handles asynchronous task management and executes sanitized analytical queries."
  - type: "component"
    name: "Superset Metadata DB Connector"
    technology: "SQLAlchemy"
    description: "Manages database connections and schema abstraction."
  - type: "component"
    name: "Semantic Layer & RLS Engine"
    technology: "Python/SQLAlchemy"
    description: "Applies data models, embedded Row-Level Security, and security filters enforcing HIPAA and GDPR compliance."
  - type: "component"
    name: "PostgreSQL Read-Replica"
    technology: "PostgreSQL"
    description: "Stores and provides access to operational read-replica data."
  - type: "component"
    name: "Redis"
    technology: "Redis"
    description: "Manages broker and cache operations for ephemeral caching and message brokering."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Provides dynamic runtime injection of secrets to avoid plain-text storage."
  - type: "component"
    name: "Go Audit Logging Container"
    technology: "Go"
    description: "Receives forwarded dashboard data export events for compliance and tracking."
relationships:
  - source: "Superset Web Server & UI"
    destination: "Semantic Layer & RLS Engine"
    description: "Applies data models and security filters [In-process Python Method Call]"
  - source: "Superset Web Server & UI"
    destination: "Redis"
    description: "Manages broker/cache operations [Redis/TLS]"
  - source: "Superset Celery Worker"
    destination: "Redis"
    description: "Manages broker/cache operations [Redis/TLS]"
  - source: "Superset Celery Worker"
    destination: "PostgreSQL Read-Replica"
    description: "Executes sanitized analytical queries [JDBC/TLS]"
  - source: "Semantic Layer & RLS Engine"
    destination: "Go Audit Logging Container"
    description: "Forwards dashboard data export events [HTTPS]"