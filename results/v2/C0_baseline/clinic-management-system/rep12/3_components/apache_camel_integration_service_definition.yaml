level: component
scope: "Component diagram for the Apache Camel Integration Service container"
parentContainer:
  name: "Apache Camel Integration Service"
elements:
  - type: "component"
    name: "FHIR Ingestion Route Component"
    technology: "Apache Camel / Spring DSL"
    description: "Ingests and routes HL7 FHIR messages from external lab and imaging systems."
  - type: "component"
    name: "EIP Mediator Component"
    technology: "Apache Camel"
    description: "Applies Enterprise Integration Patterns for message routing, transformation, and protocol bridging."
  - type: "component"
    name: "Dead-Letter & Resilience Handler Component"
    technology: "Apache Camel Circuit Breaker / Kafka"
    description: "Handles failures, providing resilience via circuit breakers and Kafka-backed dead-letter queues."
  - type: "component"
    name: "Payment & Clearinghouse Adapter Component"
    technology: "Apache Camel"
    description: "Adapts and communicates with third-party payment gateways and insurance clearinghouses."
  - type: "component"
    name: "Idempotency & Deduplication Engine"
    technology: "Apache Camel Idempotent Consumer"
    description: "Checks and records message execution IDs to ensure message processing idempotency."
  - type: "component"
    name: "Redis Container"
    technology: "Redis"
    description: "Transient data store for high-performance message idempotency tracking."
  - type: "component"
    name: "Apache Superset Reporting Container"
    technology: "Apache Superset"
    description: "Publishes real-time transaction metrics."
  - type: "component"
    name: "Go Audit Logging Container"
    technology: "Go"
    description: "Emits tamper-evident audit events."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Dynamic secrets management for OAuth2 credentials and client certificates."
relationships:
  - source: "Istio Service Mesh"
    destination: "Apache Camel Integration Service"
    description: "Routes integration traffic [gRPC/HTTP]"
  - source: "FHIR Ingestion Route Component"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges diagnostic results and medical imaging [HL7 FHIR over HTTPS, mTLS]"
  - source: "Payment & Clearinghouse Adapter Component"
    destination: "Third-Party Payment Gateways"
    description: "Processes payment transactions [HTTPS, OAuth2]"
  - source: "Payment & Clearinghouse Adapter Component"
    destination: "Insurance Clearinghouses"
    description: "Handles claims processing [HTTPS, OAuth2]"
  - source: "Idempotency & Deduplication Engine"
    destination: "Redis Container"
    description: "Checks and records message execution IDs for idempotency [Redis TCP/RESP]"
  - source: "EIP Mediator Component"
    destination: "Go Audit Logging Container"
    description: "Emits tamper-evident audit events [gRPC]"
  - source: "EIP Mediator Component"
    destination: "Apache Superset Reporting Container"
    description: "Publishes real-time transaction metrics [Prometheus/OpenTelemetry]"