level: component
scope: "Component diagram for the Kong API Gateway container"
parentContainer:
  name: "Kong API Gateway"
elements:
  - type: "component"
    name: "Proxy Router"
    technology: "Kong Core / NGINX"
    description: "Centralized perimeter routing, SSL termination, and client request handling."
  - type: "component"
    name: "Auth Plugin"
    technology: "Kong Plugin / OIDC / SAML 2.0"
    description: "Authenticates and authorizes users in conjunction with the Identity Provider."
  - type: "component"
    name: "Transform and Masking Plugin"
    technology: "Kong Plugin"
    description: "Transforms payloads and masks sensitive HIPAA/GDPR data."
  - type: "component"
    name: "Rate Limiting"
    technology: "Kong Plugin / Redis"
    description: "Enforces distributed API rate-limiting backed by Redis Cluster."
  - type: "component"
    name: "Analytics Exporter"
    technology: "Kong Plugin"
    description: "Exports metrics, telemetry, and structured audit logs."
relationships:
  - source: "Proxy Router"
    destination: "Auth Plugin"
    description: "Delegates incoming requests for authentication and authorization [OIDC / SAML 2.0]"
  - source: "Proxy Router"
    destination: "Transform and Masking Plugin"
    description: "Passes payloads for data transformation and masking"
  - source: "Proxy Router"
    destination: "Rate Limiting"
    description: "Queries rate-limiting status [RESP over TLS]"
  - source: "Analytics Exporter"
    destination: "Go Audit Logging Container"
    description: "Streams structured audit logs [gRPC]"
  - source: "Proxy Router"
    destination: "Istio Service Mesh"
    description: "Routes and validates outbound traffic [mTLS]"