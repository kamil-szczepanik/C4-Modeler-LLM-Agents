level: component
scope: "Component diagram for the HashiCorp Vault container"
parentContainer:
  name: "HashiCorp Vault"
elements:
  - type: "component"
    name: "Transit Secrets Engine Component"
    technology: "HashiCorp Vault Transit Engine"
    description: "Encryption-as-a-service for EMR data at rest."
  - type: "component"
    name: "Database Secrets Engine Component"
    technology: "HashiCorp Vault Database Engine"
    description: "Manages dynamic PostgreSQL credentials."
  - type: "component"
    name: "Kubernetes Auth Method Component"
    technology: "HashiCorp Vault Kubernetes Auth"
    description: "Validates service accounts and issues short-lived tokens."
  - type: "component"
    name: "Enterprise Replication Component"
    technology: "HashiCorp Vault Enterprise Replication"
    description: "Asynchronous state replication across clusters."
  - type: "component"
    name: "Consul Storage Backend / Raft Consensus Component"
    technology: "Raft Consensus / Consul Storage"
    description: "Local storage and high availability."
relationships:
  - source: "Spring Boot Core Services"
    destination: "Kubernetes Auth Method Component"
    description: "Authenticates via JWT [HTTPS]"
  - source: "Spring Boot Core Services"
    destination: "Transit Secrets Engine Component"
    description: "Encrypts/decrypts PHI data [HTTPS/REST]"
  - source: "Spring Boot Core Services"
    destination: "Database Secrets Engine Component"
    description: "Fetches short-lived DB credentials [HTTPS/REST]"
  - source: "Vault (eu-central-1)"
    destination: "Vault (on-prem-k8s)"
    description: "Replicates state asynchronously [TLS/TCP 8201]"