level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "Manages patient admissions, EMRs, scheduling, and billing for healthcare providers on a secure, highly available hybrid cloud platform ensuring strict HIPAA and GDPR compliance."
elements:
  - type: "person"
    name: "Patient"
    description: "Interacts with the system for scheduling and managing healthcare services."
  - type: "person"
    name: "Receptionist / Administrative Staff"
    description: "Manages patient admissions, scheduling, and front-desk operations."
  - type: "person"
    name: "Clinician / Doctor"
    description: "Accesses and updates Electronic Medical Records (EMRs) and clinical data."
  - type: "person"
    name: "Billing Specialist"
    description: "Handles billing, payments, and insurance claims processing."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "Provides diagnostic results and medical imaging data via interoperability standards."
  - type: "externalSystem"
    name: "Third-Party Payment Gateway & Insurance Clearinghouses"
    description: "Processes payments and handles healthcare insurance claims."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Handles Multi-Factor Authentication (MFA) and session management using OIDC/SAML 2.0."
relationships:
  - source: "Patient"
    destination: "Clinic Management System"
    description: "Accesses user interface and web client for interactions"
    technology: "HTTPS / TLS 1.3"
  - source: "Receptionist / Administrative Staff"
    destination: "Clinic Management System"
    description: "Manages admissions and scheduling via web client"
    technology: "HTTPS / TLS 1.3"
  - source: "Clinician / Doctor"
    destination: "Clinic Management System"
    description: "Accesses EMRs and patient care data"
    technology: "HTTPS / TLS 1.3"
  - source: "Billing Specialist"
    destination: "Clinic Management System"
    description: "Manages financial transactions and billing"
    technology: "HTTPS / TLS 1.3"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users via MFA and manages sessions"
    technology: "OpenID Connect (OIDC) / SAML 2.0"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Retrieves diagnostic results and medical imaging"
    technology: "HL7 FHIR over HTTPS (REST/JSON)"
  - source: "Clinic Management System"
    destination: "Third-Party Payment Gateway & Insurance Clearinghouses"
    description: "Processes billing and claims"
    technology: "Secure HTTPS API"