level: component
scope: "Component diagram for the HashiCorp Vault container"
parentContainer:
  name: "HashiCorp Vault"
elements:
  - type: "component"
    name: "Transit Secrets Engine"
    technology: "HashiCorp Vault Engine"
    description: "Provides cryptographic services for data encryption and decryption (AES-256) used by core services."
  - type: "component"
    name: "Database Secrets Engines"
    technology: "HashiCorp Vault Engine"
    description: "Generates dynamic credentials for PostgreSQL databases on-demand."
  - type: "component"
    name: "Secrets Management API"
    technology: "HTTPS (REST/gRPC)"
    description: "Handles secure secret retrieval and authentication requests from core services via Kubernetes Service Accounts (JWT/AppRole) and mTLS."
relationships:
  - source: "Secrets Management API"
    destination: "Transit Secrets Engine"
    description: "Invokes cryptographic operations"
  - source: "Secrets Management API"
    destination: "Database Secrets Engines"
    description: "Requests dynamic database credentials"