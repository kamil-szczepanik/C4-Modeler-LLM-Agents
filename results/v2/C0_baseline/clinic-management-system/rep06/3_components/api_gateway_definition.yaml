level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge TLS Termination & WAF Proxy"
    technology: "Kong/NGINX/Envoy Proxy"
    description: "Handles edge TLS termination, web application firewall (WAF) protection, and edge PHI scrubbing."
  - type: "component"
    name: "Authentication & JWT Validation Filter"
    technology: "Kong/NGINX/Envoy Plugin"
    description: "Validates incoming JSON Web Tokens and handles token introspection with the Identity Provider."
  - type: "component"
    name: "Routing & Rate-Limiting Engine"
    technology: "Kong/NGINX/Envoy Engine"
    description: "Executes routing rules, tenant-aware rate limiting, and traffic direction to upstream microservices."
  - type: "component"
    name: "API Developer Portal & Consumer Registry"
    technology: "Kong/NGINX/Envoy Portal"
    description: "Manages API consumers, developer documentation, and credential registries."
  - type: "component"
    name: "Dynamic Service Discovery & Upstream Resolver"
    technology: "Kong/NGINX/Envoy Resolver"
    description: "Resolves upstream microservice endpoints dynamically for secure mTLS routing."
relationships:
  - source: "Edge TLS Termination & WAF Proxy"
    destination: "Authentication & JWT Validation Filter"
    description: "Passes decrypted requests for token validation"
  - source: "Authentication & JWT Validation Filter"
    destination: "Routing & Rate-Limiting Engine"
    description: "Passes authenticated requests for rate limiting and routing"
  - source: "Routing & Rate-Limiting Engine"
    destination: "Dynamic Service Discovery & Upstream Resolver"
    description: "Queries for upstream service locations"