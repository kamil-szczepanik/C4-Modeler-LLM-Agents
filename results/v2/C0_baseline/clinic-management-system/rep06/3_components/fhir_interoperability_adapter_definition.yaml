level: component
scope: "Component diagram for the FHIR Interoperability Adapter container"
parentContainer:
  name: "FHIR Interoperability Adapter"
elements:
  - type: "component"
    name: "FHIR REST Facade"
    technology: "Java Spring Boot / HAPI FHIR"
    description: "Exchanges lab/imaging data via HL7 FHIR API over mTLS and exposes REST endpoints."
  - type: "component"
    name: "Security & Auth Enforcer"
    technology: "In-process Java / OAuth 2.0 / OIDC"
    description: "Validates credentials and handles token introspection & JWT verification."
  - type: "component"
    name: "Transformation Engine"
    technology: "Java"
    description: "Transforms FHIR payloads and invokes outbound dispatching or message publishing."
  - type: "component"
    name: "Outbound Dispatcher"
    technology: "Java"
    description: "Dispatches transformed messages externally or internally."
  - type: "component"
    name: "Audit Logger Interceptor"
    technology: "Java / gRPC over mTLS"
    description: "Intercepts operations and emits audit trails to the compliance service."
relationships:
  - source: "FHIR REST Facade"
    destination: "Security & Auth Enforcer"
    description: "Validates credentials [In-process Java]"
  - source: "Security & Auth Enforcer"
    destination: "Identity Provider (IdP)"
    description: "Token introspection & JWT verification [OAuth 2.0 / OIDC]"
  - source: "FHIR REST Facade"
    destination: "Transformation Engine"
    description: "Direct method calls [Java]"
  - source: "Transformation Engine"
    destination: "Message Broker (Kafka)"
    description: "Publishes clinical events asynchronously [Kafka Protocol]"
  - source: "FHIR Interoperability Adapter"
    destination: "Audit & Compliance Service"
    description: "Emits audit trails [gRPC over mTLS]"