level: component
scope: "Component diagram for the PostgreSQL databases container"
parentContainer:
  name: "PostgreSQL databases"
elements:
  - type: "component"
    name: "PostgreSQL Primary Instance"
    technology: "AWS RDS / On-Prem StatefulSet"
    description: "Primary relational database handling write operations and maintaining enterprise data integrity for patient admissions, EMR, scheduling, and billing."
  - type: "component"
    name: "Read Replica Cluster"
    technology: "PostgreSQL Streaming Replication"
    description: "Cluster of read-only replicas scaling read workloads and supporting high-performance clinical workflows."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Manages high connection concurrency and prevents resource starvation."
  - type: "component"
    name: "Encryption and Backup Daemon"
    technology: "pgaudit, pgcrypto, WAL streaming"
    description: "Enforces deep audit logging, column-level encryption for HIPAA/GDPR compliance, and WAL streaming for immutable archival."
  - type: "component"
    name: "Migration Engine"
    technology: "Flyway / Liquibase"
    description: "Ensures idempotent schema updates via CI/CD pipelines across Core Clinical, Scheduling, and Billing schemas."
relationships:
  - source: "Connection Pooler"
    destination: "PostgreSQL Primary Instance"
    description: "TCP/SSL connection pooling"
  - source: "Connection Pooler"
    destination: "Read Replica Cluster"
    description: "TCP/SSL connection pooling"
  - type: "component"
  - source: "Encryption and Backup Daemon"
    destination: "PostgreSQL Primary Instance"
    description: "WAL streaming for immutable archival"
  - source: "Migration Engine"
    destination: "PostgreSQL Primary Instance"
    description: "Schema migrations and updates"