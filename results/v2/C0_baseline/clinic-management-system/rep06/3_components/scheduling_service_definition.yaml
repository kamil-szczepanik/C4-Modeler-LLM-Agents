level: component
scope: "Component diagram for the Scheduling Service container"
parentContainer:
  name: "Scheduling Service"
elements:
  - type: "component"
    name: "Appointment API Controller"
    technology: "Node.js (Fastify) or Python (FastAPI)"
    description: "Exposes REST/GraphQL endpoints for appointment management."
  - type: "component"
    name: "Clash Detection Engine"
    technology: "Node.js / Python with Redis and PostgreSQL OCC"
    description: "Persists appointments, checks availability, and manages distributed locks to prevent race conditions."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Node.js / Python"
    description: "Sends SMS and email reminders via the External Notification Gateway."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Apache Kafka / RabbitMQ Client"
    description: "Streams asynchronous lifecycle and audit events."
relationships:
  - source: "Appointment API Controller"
    destination: "Clash Detection Engine"
    description: "Delegates appointment scheduling and validation requests [In-process / Internal]"
  - source: "Clash Detection Engine"
    destination: "Notification Dispatcher"
    description: "Triggers notifications upon successful scheduling [In-process / Internal]"
  - source: "Clash Detection Engine"
    destination: "Event Publisher Component"
    description: "Publishes appointment lifecycle events [In-process / Internal]"