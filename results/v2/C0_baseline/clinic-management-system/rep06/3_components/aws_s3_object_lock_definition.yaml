level: component
scope: "Component diagram for the AWS S3 Object Lock container"
parentContainer:
  name: "AWS S3 Object Lock"
elements:
  - type: "component"
    name: "Bucket Policy Manager"
    technology: "AWS S3 / Bucket Policy Engine"
    description: "Manages and enforces access policies, retention parameters, and compliance rules for immutable WORM storage."
  - type: "component"
    name: "Retention Mode Engine"
    technology: "Java / AWS SDK"
    description: "Enforces Compliance and Governance retention modes to prevent accidental or malicious deletion or modification of clinical and audit records."
  - type: "component"
    name: "Legal Hold Controller"
    technology: "Java / AWS SDK"
    description: "Applies and removes legal holds on medical records and audit trails independently of retention periods."
  - type: "component"
    name: "Lifecycle Transition Manager"
    technology: "AWS S3 Lifecycle / AWS SDK"
    description: "Automates the transition of immutable objects from standard storage to AWS S3 Glacier Flexible/Deep Archive for long-term retention."
relationships:
  - source: "Bucket Policy Manager"
    destination: "Retention Mode Engine"
    description: "Enforces retention configurations based on bucket compliance policies."
  - source: "Retention Mode Engine"
    destination: "Legal Hold Controller"
    description: "Coordinates protection states with legal hold requirements."
  - source: "Retention Mode Engine"
    destination: "Lifecycle Transition Manager"
    description: "Triggers archival transitions respecting active retention and hold states."