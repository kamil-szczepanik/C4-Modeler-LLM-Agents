level: component
scope: "Component diagram for the Patient Portal Frontend container"
parentContainer:
  name: "Patient Portal Frontend"
elements:
  - type: "component"
    name: "Authentication & Session Manager"
    technology: "React, TypeScript, React Query"
    description: "Manages user authentication, session state, and secure token storage for patients accessing the portal."
  - type: "component"
    name: "Appointment & Scheduling Module"
    technology: "React, TypeScript, Tailwind CSS"
    description: "Provides the user interface for patients to view, book, and manage clinic appointments."
  - type: "component"
    name: "Demographics & Profile Form"
    technology: "React, TypeScript, Tailwind CSS"
    description: "Allows patients to view and update their personal demographics and profile information."
  - type: "component"
    name: "Accessibility & Localization Module"
    technology: "React, TypeScript"
    description: "Ensures compliance with accessibility standards and supports multi-language localization."
  - type: "component"
    name: "API Client Layer"
    technology: "TypeScript, React Query, HTTPS/REST"
    description: "Handles HTTP/REST communication and data fetching with the API Gateway."
relationships:
  - source: "Appointment & Scheduling Module"
    destination: "API Client Layer"
    description: "Uses to send scheduling requests"
  - source: "Demographics & Profile Form"
    destination: "API Client Layer"
    description: "Uses to update patient profile data"
  - source: "Authentication & Session Manager"
    destination: "API Client Layer"
    description: "Uses for authentication and token validation requests"
  - source: "API Client Layer"
    destination: "API Gateway"
    description: "Makes API requests [HTTPS/REST]"