level: component
scope: "Component diagram for the Audit & Compliance Service container"
parentContainer:
  name: "Audit & Compliance Service"
elements:
  - type: "component"
    name: "Event Ingestion Controller"
    technology: "Go gRPC Server"
    description: "Streams and processes audit events from the asynchronous buffer."
  - type: "component"
    name: "Compliance Reporting Engine"
    technology: "Go Native Package"
    description: "Provides secure reporting tools for compliance officers."
  - type: "component"
    name: "Retention Policy Enforcer"
    technology: "Go Worker"
    description: "Applies WORM policies and manages data retention."
  - type: "component"
    name: "DSAR Query Processor"
    technology: "Go Native Package"
    description: "Processes data subject access requests and queries metadata."
  - type: "component"
    name: "Report Scheduler"
    technology: "Go Cron/Worker"
    description: "Schedules compliance report generation."
relationships:
  - source: "Asynchronous Buffer"
    destination: "Event Ingestion Controller"
    description: "Streams audit events [gRPC]"
  - source: "Retention Policy Enforcer"
    destination: "AWS S3 Object Lock"
    description: "Applies WORM policies [HTTPS, IAM]"
  - source: "Compliance Officer"
    destination: "Compliance Reporting Engine"
    description: "Accesses reports [HTTPS, JWT/RBAC]"
  - source: "Compliance Officer"
    destination: "DSAR Query Processor"
    description: "Accesses queries [HTTPS, JWT/RBAC]"
  - source: "DSAR Query Processor"
    destination: "Audit Data Repository"
    description: "Queries metadata [SQL over TLS]"