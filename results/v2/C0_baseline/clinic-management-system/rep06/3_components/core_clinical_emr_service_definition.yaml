level: component
scope: "Component diagram for the Core Clinical & EMR Service container"
parentContainer:
  name: "Core Clinical & EMR Service"
elements:
  - type: "component"
    name: "EMR Orchestrator Component"
    technology: "Java/Spring MVC"
    description: "Manages REST requests and clinical workflow coordination."
  - type: "component"
    name: "CDR Access Component"
    technology: "Spring Data JPA"
    description: "Interacts with PostgreSQL via PgBouncer for data persistence."
  - type: "component"
    name: "Audit Interceptor Component"
    technology: "AspectJ / Spring AOP"
    description: "Emits asynchronous gRPC audit events."
  - type: "component"
    name: "Security Enforcement Component"
    technology: "Spring Security"
    description: "Handles ABAC/RBAC and dynamic HashiCorp Vault tokenization."
  - type: "component"
    name: "PostgreSQL Databases"
    technology: "PostgreSQL"
    description: "Primary datastore featuring column-level encryption and active-passive replication."
  - type: "component"
    name: "Audit & Compliance Service"
    technology: "Go/Spring Boot"
    description: "External service receiving audit logs."
  - type: "component"
    name: "API Gateway"
    technology: "Gateway"
    description: "Routes incoming EMR REST requests."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Provides dynamic secret injection, ephemeral credentials, and key management."
relationships:
  - source: "API Gateway"
    destination: "EMR Orchestrator Component"
    description: "Routes incoming EMR REST requests [OAuth2/OIDC, mTLS]"
  - source: "CDR Access Component"
    destination: "PostgreSQL Databases"
    description: "Executes optimized queries and reads [PostgreSQL Protocol, mTLS]"
  - source: "Audit Interceptor Component"
    destination: "Audit & Compliance Service"
    description: "Emits cryptographic audit events [gRPC, mTLS]"
  - source: "Security Enforcement Component"
    destination: "HashiCorp Vault"
    description: "Retrieves dynamic, short-lived database credentials and encryption keys [HTTPS/REST, mTLS]"