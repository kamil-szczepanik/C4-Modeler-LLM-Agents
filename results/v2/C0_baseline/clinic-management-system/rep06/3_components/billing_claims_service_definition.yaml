level: component
scope: "Component diagram for the Billing & Claims Service container"
parentContainer:
  name: "Billing & Claims Service"
elements:
  - type: "component"
    name: "Claim Scrubbing Component"
    technology: "Drools / Spring Component"
    description: "Local rules engine for offline claim scrubbing and error prevention."
  - type: "component"
    name: "Claim Management Component"
    technology: "Spring MVC/Data"
    description: "Manages claims processing, data access, and interactions with external payment gateways."
  - type: "component"
    name: "Payment Processing Component"
    technology: "Java Spring Boot"
    description: "Processes payments and financial transactions."
  - type: "component"
    name: "Dispute Management Component"
    technology: "Spring REST"
    description: "Handles billing disputes and logs actions to audit services."
  - type: "component"
    name: "Billing Archive Component"
    technology: "Java Spring Boot"
    description: "Manages encrypted long-term retention of billing data."
  - type: "component"
    name: "Third-Party Payment & Insurance Gateway"
    technology: "External Gateway"
    description: "Handles real-time eligibility and submissions via REST/JSON, mTLS, and Async Message Broker."
  - type: "component"
    name: "AWS S3 Object Lock"
    technology: "WORM Storage / AWS SDK"
    description: "Provides immutable 10-year data retention with encryption."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "Secret Management"
    description: "Handles secret management for envelope encryption and PHI data protection."
  - type: "component"
    name: "Patient Portal Frontend"
    technology: "React"
    description: "Frontend interface allowing patients to submit billing disputes."
  - type: "component"
    name: "Audit & Compliance Service"
    technology: "Microservice"
    description: "Logs compliance and dispute actions securely."
relationships:
  - source: "Claim Scrubbing Component"
    destination: "Claim Management Component"
    description: "Passes validated claims [In-memory Java Method Call]"
  - source: "Claim Management Component"
    destination: "Third-Party Payment & Insurance Gateway"
    description: "Real-time eligibility & submission [REST/JSON, mTLS, Async Message Broker]"
  - source: "Dispute Management Component"
    destination: "Audit & Compliance Service"
    description: "Logs dispute actions [gRPC, mTLS]"
  - source: "Patient Portal Frontend"
    destination: "Dispute Management Component"
    description: "Submits billing disputes [REST/JSON, OAuth2, mTLS]"
  - source: "Billing Archive Component"
    destination: "AWS S3 Object Lock"
    description: "Encrypted long-term retention [HTTPS, AWS SDK]"