level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "Manages patient admissions, EMRs, scheduling, and billing for healthcare facilities while delivering high-availability clinical operations and strict HIPAA and GDPR compliance."
elements:
  - type: "person"
    name: "Front-Desk Receptionist"
    description: "Manages front-desk patient admissions and scheduling."
  - type: "person"
    name: "Clinician/Doctor"
    description: "Accesses and updates EMRs and provides clinical care."
  - type: "person"
    name: "Billing Specialist"
    description: "Handles billing and insurance claims."
  - type: "person"
    name: "Patient"
    description: "Interacts with the clinic for healthcare services and scheduling."
  - type: "person"
    name: "Hospital Administrator"
    description: "Oversees hospital operations and management."
  - type: "person"
    name: "Compliance Officer"
    description: "Ensures adherence to HIPAA, GDPR, and security regulations."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing lab results and medical imaging."
  - type: "externalSystem"
    name: "Third-Party Payment & Insurance Gateway"
    description: "External gateway for processing payments and insurance claims."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Handles authentication, MFA, and identity management."
  - type: "container"
    name: "API Gateway / Edge Proxy"
    description: "Edge proxy for TLS termination, JWT validation, rate limiting, and edge caching."
  - type: "container"
    name: "Centralized KMS"
    description: "Manages encryption keys for data protection and compliance."
  - type: "container"
    name: "Hybrid Kubernetes Clusters"
    description: "Core software system hosted on hybrid Kubernetes for active-active high availability."
relationships:
  - source: "Front-Desk Receptionist"
    destination: "API Gateway / Edge Proxy"
    description: "Accesses clinical operations and patient admissions"
    technology: "HTTPS / TLS 1.3 with OAuth 2.0 / OpenID Connect MFA"
  - source: "Clinician/Doctor"
    destination: "API Gateway / Edge Proxy"
    description: "Accesses EMRs and clinical tools"
    technology: "HTTPS / TLS 1.3 with OAuth 2.0 / OpenID Connect MFA"
  - source: "Billing Specialist"
    destination: "API Gateway / Edge Proxy"
    description: "Processes billing operations"
    technology: "HTTPS / TLS 1.3 with OAuth 2.0 / OpenID Connect MFA"
  - source: "Patient"
    destination: "API Gateway / Edge Proxy"
    description: "Interacts with clinic services"
    technology: "HTTPS / TLS 1.3 with OAuth 2.0 / OpenID Connect MFA"
  - source: "Hospital Administrator"
    destination: "API Gateway / Edge Proxy"
    description: "Manages administrative tasks"
    technology: "HTTPS / TLS 1.3 with OAuth 2.0 / OpenID Connect MFA"
  - source: "Compliance Officer"
    destination: "API Gateway / Edge Proxy"
    description: "Reviews audit logs and compliance metrics"
    technology: "HTTPS / TLS 1.3 with OAuth 2.0 / OpenID Connect MFA"
  - source: "Hybrid Kubernetes Clusters"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges lab and imaging data"
    technology: "HL7 FHIR REST APIs over HTTPS"
  - source: "Hybrid Kubernetes Clusters"
    destination: "Third-Party Payment & Insurance Gateway"
    description: "Processes transactions and claims"
    technology: "Secure REST/SOAP APIs"