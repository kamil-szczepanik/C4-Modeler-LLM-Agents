level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Front-Desk Receptionist"
    description: "Manages patient admissions and front-desk scheduling."
  - type: "person"
    name: "Clinician/Doctor"
    description: "Accesses and updates electronic medical records and clinical workflows."
  - type: "person"
    name: "Billing Specialist"
    description: "Handles billing and insurance claims."
  - type: "person"
    name: "Patient"
    description: "Interacts via the patient portal for appointments and records."
  - type: "person"
    name: "Hospital Administrator"
    description: "Oversees hospital operations and management."
  - type: "person"
    name: "Compliance Officer"
    description: "Ensures compliance and reviews audit logs."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing lab results and medical imaging."
  - type: "externalSystem"
    name: "Third-Party Payment & Insurance Gateway"
    description: "External gateway for processing payments and insurance claims."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Handles authentication and access control."
  - type: "container"
    name: "API Gateway"
    technology: "Kong/NGINX (Envoy)"
    description: "Edge proxy for routing, rate limiting, and security enforcement."
  - type: "container"
    name: "Patient Portal Frontend"
    technology: "React"
    description: "Single page application for patient interactions."
  - type: "container"
    name: "Staff Web Application"
    technology: "React"
    description: "Web application for staff and clinicians."
  - type: "container"
    name: "Core Clinical & EMR Service"
    technology: "Java Spring Boot"
    description: "Manages electronic medical records and core clinical workflows."
  - type: "container"
    name: "Scheduling Service"
    technology: "Node.js/Python"
    description: "Handles appointments and scheduling."
  - type: "container"
    name: "Billing & Claims Service"
    technology: "Java Spring Boot"
    description: "Manages billing operations and insurance claims."
  - type: "container"
    name: "FHIR Interoperability Adapter"
    technology: "HAPI FHIR"
    description: "Adapts data for HL7 FHIR interoperability."
  - type: "container"
    name: "Audit & Compliance Service"
    technology: "Go/Spring Boot"
    description: "Logs audit trails and enforces compliance requirements."
  - type: "container"
    name: "PostgreSQL databases"
    technology: "PostgreSQL"
    description: "Persistent relational storage with encryption at rest."
  - type: "container"
    name: "AWS S3 Object Lock"
    technology: "AWS S3"
    description: "WORM storage for audit compliance."
  - type: "container"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Secrets management and encryption key storage."
relationships:
  - source: "Patient"
    destination: "Patient Portal Frontend"
    description: "Accesses patient portal"
    technology: "HTTPS/REST"
  - source: "Front-Desk Receptionist"
    destination: "Staff Web Application"
    description: "Manages admissions and scheduling"
    technology: "HTTPS/REST"
  - source: "Clinician/Doctor"
    destination: "Staff Web Application"
    description: "Accesses EMRs and clinical tools"
    technology: "HTTPS/REST"
  - source: "Billing Specialist"
    destination: "Staff Web Application"
    description: "Manages billing operations"
    technology: "HTTPS/REST"
  - source: "Hospital Administrator"
    destination: "Staff Web Application"
    description: "Views administrative dashboards"
    technology: "HTTPS/REST"
  - source: "Compliance Officer"
    destination: "Staff Web Application"
    description: "Reviews compliance reports"
    technology: "HTTPS/REST"
  - source: "Patient Portal Frontend"
    destination: "API Gateway"
    description: "Makes API requests"
    technology: "HTTPS/REST"
  - source: "Staff Web Application"
    destination: "API Gateway"
    description: "Makes API requests"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "Core Clinical & EMR Service"
    description: "Routes EMR requests"
    technology: "OAuth2/OIDC, mTLS"
  - source: "API Gateway"
    destination: "Scheduling Service"
    description: "Routes scheduling requests"
    technology: "OAuth2/OIDC, mTLS"
  - source: "API Gateway"
    destination: "Billing & Claims Service"
    description: "Routes billing requests"
    technology: "OAuth2/OIDC, mTLS"
  - source: "Core Clinical & EMR Service"
    destination: "Audit & Compliance Service"
    description: "Sends audit events"
    technology: "gRPC, mTLS"
  - source: "Billing & Claims Service"
    destination: "Audit & Compliance Service"
    description: "Sends audit events"
    technology: "gRPC, mTLS"
  - source: "FHIR Interoperability Adapter"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges lab and imaging data"
    technology: "HL7 FHIR API"
  - source: "Billing & Claims Service"
    destination: "Third-Party Payment & Insurance Gateway"
    description: "Processes payments and claims"
    technology: "mTLS, Async Messaging"