level: component
scope: "Component diagram for the Billing & Claims Service container"
parentContainer:
  name: "Billing & Claims Service"
elements:
  - type: "component"
    name: "Claim Management Component"
    technology: "Spring MVC/Data with Drools Rules Engine"
    description: "Automates insurance claim submissions and high-speed automated claim scrubbing."
  - type: "component"
    name: "Payment Processing Component"
    technology: "Spring Integration with Tokenization Vault"
    description: "Handles payment processing and submits transactions securely."
  - type: "component"
    name: "Billing Engine / Ledger Component"
    technology: "PostgreSQL with AES-256 and TDE"
    description: "Manages financial ledger data and itemized statements with strict auditing."
  - type: "component"
    name: "Audit & Retention Publisher"
    technology: "Java / Spring Boot"
    description: "Streams cryptographically signed audit logs to SIEM and immutable cold storage."
relationships:
  - source: "Claim Management Component"
    destination: "RabbitMQ Message Broker"
    description: "Publishes scrubbed insurance claims [AMQP with message-level envelope encryption]"
  - source: "Payment Processing Component"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Submits transactions [Asynchronous messaging via RabbitMQ]"
  - source: "Billing Engine / Ledger Component"
    destination: "PostgreSQL"
    description: "Persists ledger data and itemized statements [JDBC with column-level AES-256]"
  - source: "Audit & Retention Publisher"
    destination: "SIEM & Immutable Cold Storage"
    description: "Streams cryptographically signed audit logs [TLS 1.3]"