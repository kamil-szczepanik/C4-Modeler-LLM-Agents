level: component
scope: "Component diagram for the API Gateway / Reverse Proxy container"
parentContainer:
  name: "API Gateway / Reverse Proxy"
elements:
  - type: "component"
    name: "Edge Listener"
    technology: "Envoy / NGINX"
    description: "Handles incoming network traffic and manages TLS termination."
  - type: "component"
    name: "Authentication"
    technology: "Envoy / NGINX Filter"
    description: "Validates incoming tokens and introspects sessions with the Identity Provider."
  - type: "component"
    name: "Rate Limiting"
    technology: "Envoy / Redis"
    description: "Enforces edge rate limits using edge caching and rate limit storage."
  - type: "component"
    name: "Routing"
    technology: "Envoy Configuration"
    description: "Routes internal traffic to appropriate microservices like Clinical Core and Billing."
  - type: "component"
    name: "Token Transformation"
    technology: "Envoy Filter"
    description: "Transforms security tokens before forwarding requests internally."
  - type: "component"
    name: "Error Formatting"
    technology: "Envoy / NGINX"
    description: "Standardizes error responses returned to client applications."
  - type: "component"
    name: "WAF"
    technology: "Web Application Firewall Module"
    description: "Protects against common web exploits and malicious traffic."
relationships:
  - source: "Edge Listener"
    destination: "Authentication"
    description: "Passes incoming requests for session validation [HTTPS / OIDC]"
  - source: "Authentication"
    destination: "Rate Limiting"
    description: "Checks rate limits for authenticated requests [Redis]"
  - source: "Rate Limiting"
    destination: "Routing"
    description: "Forwards validated traffic to routing logic"
  - source: "Routing"
    destination: "Token Transformation"
    description: "Transforms tokens before dispatching to backend services"
  - source: "Token Transformation"
    destination: "Clinical Core Service"
    description: "Routes internal traffic and enforces schema validation [gRPC over mTLS]"
  - source: "Routing"
    destination: "Billing & Claims Service"
    description: "Routes billing traffic [gRPC over mTLS]"
  - source: "Authentication"
    destination: "Identity Provider"
    description: "Validates tokens and introspects sessions [HTTPS / OIDC]"
  - source: "Routing"
    destination: "SIEM & Immutable Cold Storage"
    description: "Exports sanitized access logs [OTLP / gRPC]"
  - source: "Routing"
    destination: "Administrative Dashboard"
    description: "Serves telemetry metrics [Prometheus / HTTPS]"