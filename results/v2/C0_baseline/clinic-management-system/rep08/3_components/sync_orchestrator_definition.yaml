level: component
scope: "Component diagram for the Sync Orchestrator container"
parentContainer:
  name: "Sync Orchestrator"
elements:
  - type: "component"
    name: "Sync State Engine"
    technology: "Go, RocksDB, SQLite, Raft"
    description: "Manages local queues, delta tracking, active-active reconciliation, and embedded Raft storage."
  - type: "component"
    name: "Conflict Resolver"
    technology: "Go"
    description: "Executes deterministic merge strategies using Last-Write-Wins with vector clocks and routes exceptions."
  - type: "component"
    name: "Sync API Controller"
    technology: "Go, REST, gRPC"
    description: "Exposes REST/gRPC endpoints with mTLS, adaptive backpressure, and payload cryptographic verification."
  - type: "component"
    name: "Dashboard Backend"
    technology: "Go, REST"
    description: "Serves the Administrative Staff Conflict Resolution Dashboard with RBAC, secure REST endpoints, and automated notification triggers."
relationships:
  - source: "Edge Nodes"
    destination: "Sync API Controller"
    description: "Transmits encrypted payloads via mTLS with short-lived OAuth2/JWT tokens."
  - source: "Sync API Controller"
    destination: "Sync State Engine"
    description: "Internal communication using gRPC."
  - source: "Sync State Engine"
    destination: "Conflict Resolver"
    description: "Processes state and queue data using internal function calls."
  - source: "Conflict Resolver"
    destination: "Dashboard Backend"
    description: "Routes exceptions and publishes events via Kafka/NATS."
  - source: "Dashboard Backend"
    destination: "SIEM / Immutable Cold Storage"
    description: "Streams cryptographically signed audit logs for compliance."