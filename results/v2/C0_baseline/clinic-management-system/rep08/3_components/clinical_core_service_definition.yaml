level: component
scope: "Component diagram for the Clinical Core Service container"
parentContainer:
  name: "Clinical Core Service"
elements:
  - type: "component"
    name: "EMR Management Component"
    technology: "Go / Spring Boot, PostgreSQL, RocksDB"
    description: "Manages electronic medical records, executes local DB queries, and pulls diagnostic payloads."
  - type: "component"
    name: "Clinical Workflow Engine"
    technology: "Go / Spring Boot, Temporal"
    description: "Handles clinical workflows, execution of commands, and state consistency."
  - type: "component"
    name: "Edge Cache & Sync Component"
    technology: "Redis, RocksDB, Vector Clocks"
    description: "Provides edge caching and performs asynchronous eventual-consistency sync."
  - type: "component"
    name: "Audit Interceptor"
    technology: "Go / Spring Boot"
    description: "Intercepts operations and streams signed, tamper-evident audit events."
relationships:
  - source: "Clinical Workflow Engine"
    destination: "EMR Management Component"
    description: "Executes local DB queries [JDBC over SSL]"
  - source: "Edge Cache & Sync Component"
    destination: "EMR Management Component"
    description: "Performs asynchronous eventual-consistency sync [gRPC]"
  - source: "Audit Interceptor"
    destination: "SIEM & Immutable Cold Storage"
    description: "Streams signed, tamper-evident audit events [TLS syslog / gRPC stream]"
  - source: "EMR Management Component"
    destination: "External Lab & Imaging Systems"
    description: "Pulls diagnostic payloads [HL7 FHIR REST over HTTPS]"