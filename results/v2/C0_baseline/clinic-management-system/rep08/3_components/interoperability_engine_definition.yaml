level: component
scope: "Component diagram for the Interoperability Engine container"
parentContainer:
  name: "Interoperability Engine"
elements:
  - type: "component"
    name: "FHIR API Gateway & Validator"
    technology: "HAPI FHIR JPA Server"
    description: "Standards-compliant HL7 FHIR resource validation and processing for external data ingestion."
  - type: "component"
    name: "Integration Router & Message Processor"
    technology: "Apache Camel"
    description: "Flexible enterprise routing, message transformation, and dead-letter queue management."
  - type: "component"
    name: "Audit & Export Dispatcher"
    technology: "Camel ActiveMQ/Kafka sink"
    description: "Handles audit log exports and event dispatching to SIEM and immutable cold storage."
  - type: "component"
    name: "Exception Management Controller"
    technology: "Spring Boot"
    description: "Manages robust exception handling and administrative management endpoints with role-based access control."
  - type: "component"
    name: "Persistent Dead-Letter Queue"
    technology: "Apache Kafka / ActiveMQ with AES-256"
    description: "Provides high-throughput event messaging and persistent DLQ storage with encryption."
relationships:
  - source: "External Lab Systems"
    destination: "FHIR API Gateway & Validator"
    description: "HTTP/REST (mTLS, SMART-on-FHIR OAuth2) [Submit Lab Results]"
  - source: "Integration Router & Message Processor"
    destination: "Clinical Core Service"
    description: "gRPC (TLS 1.3) [Internal EMR Sync]"
  - source: "Exception Management Controller"
    destination: "Integration Router & Message Processor"
    description: "AMQP/Kafka [Re-inject Corrected Payload]"
  - source: "Audit & Export Dispatcher"
    destination: "SIEM & Immutable Cold Storage"
    description: "TLS/Encrypted Stream [Audit Log Export]"
  - source: "Administrative Staff"
    destination: "Exception Management Controller"
    description: "HTTPS (MFA, RBAC) [Review and Re-queue Payloads]"