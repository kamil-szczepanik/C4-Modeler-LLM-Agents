level: component
scope: "Component diagram for the Patient Portal App container"
parentContainer:
  name: "Patient Portal App"
elements:
  - type: "component"
    name: "Presentation Controller"
    technology: "React SPA Component"
    description: "Powers the WCAG 2.1 AA accessible, mobile-responsive client-side SPA."
  - type: "component"
    name: "BFF Router"
    technology: "Node.js/Express Component"
    description: "Implements the Backend-for-Frontend (BFF) pattern for secure aggregation and routing."
  - type: "component"
    name: "Auth & Session Manager"
    technology: "Node.js/Passport.js Component"
    description: "Handles multi-factor authentication and token exchange."
  - type: "component"
    name: "Appointment & Profile Client"
    technology: "Node.js Component"
    description: "Manages appointment and profile operations."
  - type: "component"
    name: "Telemetry & Audit Interceptor"
    technology: "Node.js Middleware Component"
    description: "Facilitates distributed tracing and HIPAA/GDPR-compliant audit logging."
relationships:
  - source: "Presentation Controller"
    destination: "BFF Router"
    description: "HTTPS / TLS 1.3"
  - source: "BFF Router"
    destination: "Auth & Session Manager"
    description: "Internal Function Call"
  - source: "BFF Router"
    destination: "Appointment & Profile Client"
    description: "Internal Function Call"
  - source: "Appointment & Profile Client"
    destination: "API Gateway / Reverse Proxy"
    description: "gRPC over TLS 1.3"
  - source: "Telemetry & Audit Interceptor"
    destination: "SIEM / Logging Sidecar"
    description: "Syslog / OTLP"