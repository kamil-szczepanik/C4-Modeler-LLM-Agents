level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Interacts with the patient portal for scheduling and health records."
  - type: "person"
    name: "Clinicians"
    description: "Manages patient admissions and EMRs."
  - type: "person"
    name: "Administrative Staff"
    description: "Manages scheduling and billing workflows."
  - type: "person"
    name: "Compliance Officers / Auditors"
    description: "Monitors system audit trails and enforces security compliance."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Handles user authentication."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "Provides diagnostic data exchange."
  - type: "externalSystem"
    name: "Payment Gateway / Insurance Clearinghouse"
    description: "Processes insurance claims and payment transactions."
  - type: "externalSystem"
    name: "SIEM & Immutable Cold Storage"
    description: "Receives audit logs and compliance data."
  - type: "container"
    name: "API Gateway / Reverse Proxy"
    technology: "Envoy/NGINX"
    description: "Manages incoming traffic and routing to internal services."
  - type: "container"
    name: "Patient Portal App"
    technology: "React/Node.js"
    description: "Provides patient-facing interface for portal and scheduling."
  - type: "container"
    name: "Clinical Core Service"
    technology: "Go/Spring Boot with Redis/RocksDB edge cache"
    description: "Manages EMRs, patient admissions, and clinical workflows with offline edge cache."
  - type: "container"
    name: "Interoperability Engine"
    technology: "HAPI FHIR/Apache Camel"
    description: "Handles healthcare data integration and HL7 FHIR messaging."
  - type: "container"
    name: "Billing & Claims Service"
    technology: "Spring Boot"
    description: "Manages billing and insurance claims processing."
  - type: "container"
    name: "Sync Orchestrator"
    technology: "Custom Go/Java"
    description: "Maintains offline capabilities and synchronizes data during network partitions."
relationships:
  - source: "Patients"
    destination: "Patient Portal App"
    description: "Accesses portal and clinical records"
    technology: "HTTPS / TLS 1.3"
  - source: "Patient Portal App"
    destination: "API Gateway / Reverse Proxy"
    description: "Sends API requests"
    technology: "HTTPS / TLS 1.3"
  - source: "API Gateway / Reverse Proxy"
    destination: "Clinical Core Service"
    description: "Routes internal traffic securely"
    technology: "gRPC over mTLS (Istio service mesh)"
  - source: "API Gateway / Reverse Proxy"
    destination: "Billing & Claims Service"
    description: "Routes billing traffic"
    technology: "gRPC over mTLS (Istio service mesh)"
  - source: "Clinical Core Service"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges diagnostic data"
    technology: "HL7 FHIR APIs"
  - source: "Billing & Claims Service"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Sends payment transactions and claims"
    technology: "Asynchronous messaging via RabbitMQ"
  - source: "Clinical Core Service"
    destination: "SIEM & Immutable Cold Storage"
    description: "Streams encrypted audit logs"
    technology: "Encrypted audit log streaming"
  - source: "Billing & Claims Service"
    destination: "SIEM & Immutable Cold Storage"
    description: "Streams encrypted audit logs"
    technology: "Encrypted audit log streaming"
  - source: "Interoperability Engine"
    destination: "SIEM & Immutable Cold Storage"
    description: "Streams encrypted audit logs"
    technology: "Encrypted audit log streaming"