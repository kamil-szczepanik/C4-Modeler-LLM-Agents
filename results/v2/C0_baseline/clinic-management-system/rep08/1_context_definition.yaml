level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed to manage patient admissions, electronic medical records, scheduling, and billing for medium-sized hospitals and clinics, delivering high-availability clinical workflows while strictly enforcing healthcare data security and regulatory compliance."
elements:
  - type: "person"
    name: "Patient"
    description: "Interacts with the system for scheduling, portals, and accessing medical records."
  - type: "person"
    name: "Clinician"
    description: "Accesses electronic medical records, manages patient admissions, and executes clinical workflows."
  - type: "person"
    name: "Administrative Staff"
    description: "Manages scheduling, billing, and general clinic operations."
  - type: "person"
    name: "Compliance Officer / Auditor"
    description: "Monitors system audit trails, enforces regulatory compliance, and reviews security logs."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Handles user authentication and enforces RBAC/ABAC policies."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "Provides diagnostic data exchange for medical tests and imaging."
  - type: "externalSystem"
    name: "Payment Gateway / Insurance Clearinghouse"
    description: "Processes insurance claims and payment transactions."
  - type: "externalSystem"
    name: "SIEM & Immutable Cold Storage"
    description: "Stores audit trails and logs for HIPAA/GDPR compliance."
relationships:
  - source: "Patient"
    destination: "Clinic Management System"
    description: "Accesses portals and manages appointments via Multi-Factor Authentication"
    technology: "HTTPS/TLS 1.3, OIDC/SAML 2.0"
  - source: "Clinician"
    destination: "Clinic Management System"
    description: "Manages clinical workflows and electronic medical records"
    technology: "HTTPS/TLS 1.3, OIDC/SAML 2.0"
  - source: "Administrative Staff"
    destination: "Clinic Management System"
    description: "Handles billing, admissions, and scheduling"
    technology: "HTTPS/TLS 1.3, OIDC/SAML 2.0"
  - source: "Compliance Officer / Auditor"
    destination: "Clinic Management System"
    description: "Monitors compliance and reviews audit logs"
    technology: "HTTPS/TLS 1.3, OIDC/SAML 2.0"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users and enforces RBAC/ABAC"
    technology: "OIDC/SAML 2.0"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges diagnostic data"
    technology: "HL7 FHIR (REST/JSON)"
  - source: "Clinic Management System"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Submits insurance claims and processes payments"
    technology: "HTTPS/REST"
  - source: "Clinic Management System"
    destination: "SIEM & Immutable Cold Storage"
    description: "Sends audit trails for HIPAA/GDPR compliance"
    technology: "Syslog/TLS, Cloud-native object storage APIs"