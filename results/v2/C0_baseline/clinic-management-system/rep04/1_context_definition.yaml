level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed for medium-sized hospitals and clinics to manage patient admissions, EMRs, scheduling, and billing while ensuring HIPAA/GDPR compliance and 99.99% availability."
elements:
  - type: "person"
    name: "Patient"
    description: "End user accessing the platform for scheduling and personal medical data."
  - type: "person"
    name: "Clinic Staff/Receptionist"
    description: "Administrative staff managing patient admissions and scheduling."
  - type: "person"
    name: "Clinician/Doctor"
    description: "Medical professional managing EMRs and patient care."
  - type: "person"
    name: "Billing Specialist"
    description: "Staff member handling invoices, payments, and financial processing."
  - type: "person"
    name: "Hospital Administrator"
    description: "System manager overseeing platform operations, compliance, and user roles."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External authentication service providing OIDC / SAML 2.0 and MFA."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems for clinical diagnostics and imaging data exchange."
  - type: "externalSystem"
    name: "External Payment Gateway & Insurance Clearinghouse"
    description: "External systems handling payment processing and insurance claims."
  - type: "container"
    name: "API Gateway / Edge Proxy"
    description: "Edge proxy handling incoming traffic, routing, and audit tracking."
    technology: "OpenTelemetry / API Gateway"
  - type: "container"
    name: "Clinic Management System Core"
    description: "Core hybrid cloud microservices deployed across on-premise Kubernetes and AWS eu-central-1."
    technology: "Kubernetes, Docker, Microservices"
relationships:
  - source: "Patient"
    destination: "API Gateway / Edge Proxy"
    description: "Accesses web and mobile interfaces for scheduling and EMR review"
    technology: "HTTPS / TLS 1.3 with OIDC / SAML 2.0 and MFA"
  - source: "Clinic Staff/Receptionist"
    destination: "API Gateway / Edge Proxy"
    description: "Manages patient admissions and appointments"
    technology: "HTTPS / TLS 1.3 with OIDC / SAML 2.0 and MFA"
  - source: "Clinician/Doctor"
    destination: "API Gateway / Edge Proxy"
    description: "Views and updates Electronic Medical Records (EMRs)"
    technology: "HTTPS / TLS 1.3 with OIDC / SAML 2.0 and MFA"
  - source: "Billing Specialist"
    destination: "API Gateway / Edge Proxy"
    description: "Processes patient billing and insurance claims"
    technology: "HTTPS / TLS 1.3 with OIDC / SAML 2.0 and MFA"
  - source: "Hospital Administrator"
    destination: "API Gateway / Edge Proxy"
    description: "Monitors system performance and manages administrative settings"
    technology: "HTTPS / TLS 1.3 with OIDC / SAML 2.0 and MFA"
  - source: "API Gateway / Edge Proxy"
    destination: "Clinic Management System Core"
    description: "Routes client requests to backend containerized microservices"
    technology: "HTTPS / TLS 1.3"
  - source: "Clinic Management System Core"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges standardized clinical data"
    technology: "HL7 FHIR over HTTPS with Mutual TLS (mTLS)"
  - source: "Clinic Management System Core"
    destination: "External Payment Gateway & Insurance Clearinghouse"
    description: "Processes financial transactions and insurance verification"
    technology: "REST over TLS 1.3 with mTLS"
  - source: "Clinic Management System Core"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users via OIDC and SAML 2.0"
    technology: "OIDC / SAML 2.0 over HTTPS"