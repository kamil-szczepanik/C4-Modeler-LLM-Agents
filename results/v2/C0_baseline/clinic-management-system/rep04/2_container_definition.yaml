level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patient"
    description: "End user accessing the platform for scheduling and personal medical data."
  - type: "person"
    name: "Clinic Staff/Receptionist"
    description: "Administrative staff managing patient admissions and scheduling."
  - type: "person"
    name: "Clinician/Doctor"
    description: "Medical professional managing EMRs and patient care."
  - type: "person"
    name: "Billing Specialist"
    description: "Staff member handling invoices, payments, and financial processing."
  - type: "person"
    name: "Hospital Administrator"
    description: "System manager overseeing platform operations, compliance, and user roles."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External authentication service providing OIDC / SAML 2.0 and MFA."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems for clinical diagnostics and imaging data exchange."
  - type: "externalSystem"
    name: "External Payment Gateway & Insurance Clearinghouse"
    description: "External systems handling payment processing and insurance claims."
  - type: "container"
    name: "Kong/Envoy API Gateway"
    description: "Edge proxy handling incoming traffic, routing, and audit tracking."
    technology: "Kong/Envoy"
  - type: "container"
    name: "React SPA Web Application"
    description: "Frontend web application served via Nginx containers for clinic staff UI."
    technology: "React, Nginx"
  - type: "container"
    name: "Patient Portal BFF"
    description: "Backend-for-Frontend service for the patient portal."
    technology: "Node.js / Spring Boot"
  - type: "container"
    name: "Core Services"
    description: "Modular core services managing patient admissions, EMRs, and scheduling."
    technology: "Java, Spring Boot"
  - type: "container"
    name: "Billing Service"
    description: "Service responsible for billing, invoices, and financial transactions."
    technology: "Java / Node.js"
  - type: "container"
    name: "Apache Camel/MuleSoft Integration Engine"
    description: "Integration engine for HL7 FHIR translation and external connectivity."
    technology: "Apache Camel, MuleSoft"
  - type: "container"
    name: "Apache Kafka Event Stream"
    description: "Event stream for local event-driven telemetry."
    technology: "Apache Kafka"
  - type: "container"
    name: "PostgreSQL clusters"
    description: "Relational database with AES-256 encryption at rest for ACID compliance."
    technology: "PostgreSQL"
  - type: "container"
    name: "Redis Enterprise caching layer"
    description: "Caching layer for low-latency session and reference data caching."
    technology: "Redis Enterprise"
  - type: "container"
    name: "WORM object storage"
    description: "Secure storage ensuring 10-year data retention policy."
    technology: "Object Storage"
relationships:
  - source: "Patient"
    destination: "Kong/Envoy API Gateway"
    description: "Accesses patient portal via web interface"
    technology: "HTTPS/TLS 1.3"
  - source: "Clinic Staff/Receptionist"
    destination: "Kong/Envoy API Gateway"
    description: "Interacts with clinic staff UI"
    technology: "HTTPS/TLS 1.3"
  - source: "Clinician/Doctor"
    destination: "Kong/Envoy API Gateway"
    description: "Manages EMRs and patient care"
    technology: "HTTPS/TLS 1.3"
  - source: "Billing Specialist"
    destination: "Kong/Envoy API Gateway"
    description: "Processes billing and claims"
    technology: "HTTPS/TLS 1.3"
  - source: "Hospital Administrator"
    destination: "Kong/Envoy API Gateway"
    description: "Oversees platform operations and compliance"
    technology: "HTTPS/TLS 1.3"
  - source: "Kong/Envoy API Gateway"
    destination: "Patient Portal BFF"
    description: "Routes patient requests"
    technology: "HTTPS/TLS 1.3"
  - source: "Kong/Envoy API Gateway"
    destination: "React SPA Web Application"
    description: "Serves clinic staff frontend"
    technology: "HTTPS/TLS 1.3"
  - source: "Kong/Envoy API Gateway"
    destination: "Core Services"
    description: "Communicates with core services"
    technology: "gRPC/REST over mTLS (Istio)"
  - source: "Kong/Envoy API Gateway"
    destination: "Billing Service"
    description: "Communicates with billing service"
    technology: "gRPC/REST over mTLS (Istio)"
  - source: "Patient Portal BFF"
    destination: "Core Services"
    description: "Queries core business logic"
    technology: "gRPC/REST over mTLS"
  - source: "Core Services"
    destination: "PostgreSQL clusters"
    description: "Reads and writes relational data"
    technology: "Encrypted database protocols"
  - source: "Core Services"
    destination: "Redis Enterprise caching layer"
    description: "Caches session and reference data"
    technology: "Encrypted cache protocols"
  - source: "Core Services"
    destination: "Apache Kafka Event Stream"
    description: "Publishes and consumes events"
    technology: "Kafka Protocol"
  - source: "Billing Service"
    destination: "PostgreSQL clusters"
    description: "Stores financial records"
    technology: "Encrypted database protocols"
  - source: "Billing Service"
    destination: "External Payment Gateway & Insurance Clearinghouse"
    description: "Processes payments and insurance verification"
    technology: "HTTPS"
  - source: "Apache Camel/MuleSoft Integration Engine"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical data"
    technology: "HL7 FHIR APIs over TLS"
  - source: "Core Services"
    destination: "Apache Camel/MuleSoft Integration Engine"
    description: "Sends and receives integration messages"
    technology: "Internal Messaging / API"
  - source: "Core Services"
    destination: "WORM object storage"
    description: "Persists long-term data for 10-year retention"
    technology: "Secure Object Storage API"
  - source: "Kong/Envoy API Gateway"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OAuth2 / OIDC"