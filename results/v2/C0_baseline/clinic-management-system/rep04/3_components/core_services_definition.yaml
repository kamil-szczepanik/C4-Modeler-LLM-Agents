level: component
scope: "Component diagram for the Core Services container"
parentContainer:
  name: "Core Services"
elements:
  - type: "component"
    name: "Patient Registry Component"
    technology: "Spring Data JPA, Java & Spring Boot"
    description: "Manages demographic capture using Spring Data JPA."
  - type: "component"
    name: "Scheduling Engine Component"
    technology: "Redis Enterprise, Java & Spring Boot"
    description: "Handles resource clash checks leveraging Redis Enterprise for real-time slot locking."
  - type: "component"
    name: "EMR Manager Component"
    technology: "PostgreSQL clusters, WORM object storage, Java & Spring Boot"
    description: "Manages clinical records with an immutable audit trail using PostgreSQL clusters and WORM object storage."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Apache Kafka, Java & Spring Boot"
    description: "Emits domain and audit events asynchronously via Apache Kafka."
  - type: "component"
    name: "Resilience4j Circuit Breaker"
    technology: "Resilience4j"
    description: "Protects system availability and performance."
  - type: "component"
    name: "Encrypted Local Disk Buffer"
    technology: "AES-256 local disk"
    description: "Stores audit logs locally prior to Kafka dispatch."
relationships:
  - source: "Patient Registry Component"
    destination: "PostgreSQL"
    description: "Reads and writes relational data using encrypted JDBC"
  - source: "Scheduling Engine Component"
    destination: "Redis Enterprise"
    description: "Caches sessions, authorization scopes, and scheduling locks"
  - source: "EMR Manager Component"
    destination: "PostgreSQL"
    description: "Stores clinical record data"
  - source: "EMR Manager Component"
    destination: "WORM Object Storage"
    description: "Persists long-term data for 10-year retention"
  - source: "Event Publisher Component"
    destination: "Apache Kafka"
    description: "Publishes domain and audit events using Kafka Protocol with SASL/SCRAM"
  - source: "Encrypted Local Disk Buffer"
    destination: "Event Publisher Component"
    description: "Buffers audit logs prior to Kafka dispatch"