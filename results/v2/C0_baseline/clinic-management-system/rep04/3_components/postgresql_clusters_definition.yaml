level: component
scope: "Component diagram for the PostgreSQL clusters container"
parentContainer:
  name: "PostgreSQL clusters"
elements:
  - type: "component"
    name: "Primary Database Instance"
    technology: "PostgreSQL Engine"
    description: "Primary relational database engine chosen for ACID compliance and structured clinical data storage."
  - type: "component"
    name: "Read Replica Instances"
    technology: "PostgreSQL Read Replicas"
    description: "Read replica instances handling read-only queries for clinical data."
  - type: "component"
    name: "High Availability Manager"
    technology: "Patroni / etcd"
    description: "HA management for automated leader election and zero data loss failovers."
  - type: "component"
    name: "Backup & Archival Agent"
    technology: "Barman / pgBackRest"
    description: "Backup agents for continuous WAL streaming to WORM object storage."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Connection pooler for handling high concurrency during peak clinical hours."
  - type: "component"
    name: "Audit Log Collector"
    technology: "pgAudit"
    description: "Extension for capturing security-relevant DDL/DML events for HIPAA compliance."
relationships:
  - source: "Core Services"
    destination: "Connection Pooler"
    description: "SQL / TLS 1.3"
  - source: "Core Services"
    destination: "Read Replica Instances"
    description: "SQL / TLS 1.3 (Read-only)"
  - source: "Connection Pooler"
    destination: "Primary Database Instance"
    description: "Internal TCP"
  - source: "Primary Database Instance"
    destination: "Backup & Archival Agent"
    description: "WAL streaming"
  - source: "Primary Database Instance"
    destination: "Audit Log Collector"
    description: "Internal Hook"