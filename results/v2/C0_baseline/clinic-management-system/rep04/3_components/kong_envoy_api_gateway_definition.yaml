level: component
scope: "Component diagram for the Kong/Envoy API Gateway container"
parentContainer:
  name: "Kong/Envoy API Gateway"
elements:
  - type: "component"
    name: "Routing & Upstream Matcher"
    technology: "Envoy Router with Coraza/ModSecurity WAF"
    description: "Handles request routing, upstream matching, and OWASP Top 10 mitigation via WAF."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Kong Auth Plugin / Envoy WASM/Lua"
    description: "Validates incoming tokens and performs authentication and authorization checks."
  - type: "component"
    name: "Rate Limiting & Throttling Engine"
    technology: "Kong Rate Limiting"
    description: "Enforces rate limits and request throttling using Redis Enterprise."
  - type: "component"
    name: "Audit & Telemetry Logger"
    technology: "Kong Logging / Envoy Access Log Service"
    description: "Logs access events and telemetry data, publishing them to Apache Kafka."
relationships:
  - source: "Routing & Upstream Matcher"
    destination: "Authentication & Authorization Filter"
    description: "Passes authenticated requests for routing and upstream dispatch"
  - source: "Authentication & Authorization Filter"
    destination: "Rate Limiting & Throttling Engine"
    description: "Triggers rate limit checks for authorized traffic"
  - source: "Routing & Upstream Matcher"
    destination: "Audit & Telemetry Logger"
    description: "Emits access logs and telemetry spans"