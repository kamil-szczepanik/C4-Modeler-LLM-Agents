level: component
scope: "Component diagram for the Billing Service container"
parentContainer:
  name: "Billing Service"
elements:
  - type: "component"
    name: "Billing API Controller"
    technology: "Spring MVC / REST / gRPC"
    description: "Exposes REST/gRPC endpoints for invoice retrieval and copay settlements."
  - type: "component"
    name: "Invoice & Ledger Component"
    technology: "Java / Spring Boot"
    description: "Manages core billing logic, patient invoices, and immutable ledger entries."
  - type: "component"
    name: "Claim Processing Engine"
    technology: "Java / Spring Boot"
    description: "Handles insurance claim validation and clearinghouse submissions."
  - type: "component"
    name: "Dispute & Adjustment Workflow Component"
    technology: "Java / Spring Boot"
    description: "Manages claim rejections, appeals, and state-machine dispute workflows."
  - type: "component"
    name: "Apache Kafka"
    technology: "Event Streaming Platform"
    description: "Used for outbox pattern, async event publishing, and Dead Letter Queues (DLQ)."
  - type: "component"
    name: "PostgreSQL Clusters"
    technology: "PostgreSQL with TDE"
    description: "Encrypted primary data store with append-only audit tables."
  - type: "component"
    name: "Redis Enterprise"
    technology: "Redis Enterprise"
    description: "Caching and deduplication tracking layer."
  - type: "component"
    name: "WORM Object Storage"
    technology: "WORM Object Storage"
    description: "Storage for cryptographically signed, immutable financial audit logs."
  - type: "component"
    name: "Kong/Envoy API Gateway"
    technology: "Kong/Envoy / mTLS (Istio)"
    description: "Routes incoming external traffic via gRPC/REST."
  - type: "component"
    name: "Patient Portal BFF"
    technology: "HTTPS"
    description: "Requests patient-facing invoices and copay settlements."
  - type: "component"
    name: "External Payment Gateway & Insurance Clearinghouse"
    technology: "HTTPS (REST/SOAP)"
    description: "Receives claim submissions and insurance verifications."
relationships:
  - source: "Kong/Envoy API Gateway"
    destination: "Billing API Controller"
    description: "Routes incoming external traffic via gRPC/REST over mTLS (Istio)."
  - source: "Patient Portal BFF"
    destination: "Billing API Controller"
    description: "Requests patient-facing invoices and copay settlements via HTTPS."
  - source: "Invoice & Ledger Component"
    destination: "PostgreSQL Clusters"
    description: "Stores encrypted financial records via JPA/JDBC."
  - source: "Claim Processing Engine"
    destination: "External Payment Gateway & Insurance Clearinghouse"
    description: "Submits claims and verifies insurance via HTTPS (REST/SOAP)."
  - source: "Claim Processing Engine"
    destination: "Apache Kafka"
    description: "Publishes and consumes domain events and outbox messages."
  - source: "Dispute & Adjustment Workflow Component"
    destination: "Apache Kafka"
    description: "Publishes and consumes claim rejections and domain events."
  - source: "Dispute & Adjustment Workflow Component"
    destination: "WORM Object Storage"
    description: "Writes cryptographically signed audit logs via secure object storage protocols."