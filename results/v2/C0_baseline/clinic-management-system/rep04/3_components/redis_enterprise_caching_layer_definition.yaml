level: component
scope: "Component diagram for the Redis Enterprise caching layer container"
parentContainer:
  name: "Redis Enterprise caching layer"
elements:
  - type: "component"
    name: "Active-Active CRDT Sync Engine"
    technology: "Redis Enterprise CRDTs"
    description: "Synchronizes session and reference data across multi-region active-active deployments to ensure sub-second response times."
  - type: "component"
    name: "In-Memory Data Store"
    technology: "Redis Enterprise Memory Store"
    description: "Provides low-latency read and write access for session data and reference information over mTLS."
relationships:
  - source: "Active-Active CRDT Sync Engine"
    destination: "In-Memory Data Store"
    description: "Replicates and synchronizes data states"