level: component
scope: "Component diagram for the Patient Portal BFF container"
parentContainer:
  name: "Patient Portal BFF"
elements:
  - type: "component"
    name: "API Router"
    technology: "Node.js / TypeScript / Fastify"
    description: "Routes patient requests and publishes compliance audit logs to Apache Kafka via Async TCP."
  - type: "component"
    name: "Session and Rate Limit Manager"
    technology: "Redis Enterprise"
    description: "Caches session state and manages distributed rate limits over TLS 1.3."
relationships:
  - source: "API Router"
    destination: "Apache Kafka"
    description: "Publishes compliance audit logs [Async TCP]"
  - source: "API Router"
    destination: "Session and Rate Limit Manager"
    description: "Caches session state and rate limits [TLS 1.3]"
  - source: "API Router"
    destination: "Core Services"
    description: "Queries business logic [gRPC over mTLS]"