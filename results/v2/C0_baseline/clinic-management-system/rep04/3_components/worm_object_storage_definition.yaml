level: component
scope: "Component diagram for the WORM object storage container"
parentContainer:
  name: "WORM object storage"
elements:
  - type: "component"
    name: "Object Gateway API"
    technology: "MinIO / AWS S3 API"
    description: "Exposes S3-compatible REST API endpoints for data ingestion and retrieval."
  - type: "component"
    name: "Immutability Enforcement Engine"
    technology: "AWS S3 Object Lock (Compliance Mode)"
    description: "Enforces unalterable 10-year data retention policies and prevents premature deletion."
  - type: "component"
    name: "Replication & Tiering Controller"
    technology: "Terraform / Crossplane, Prometheus"
    description: "Manages asynchronous hybrid replication, automated cold tiering, and metric scraping."
  - type: "component"
    name: "Cryptographic Envelope & Key Manager Integration Module"
    technology: "AES-256-GCM, On-Prem HSM"
    description: "Handles envelope encryption and integrates with the on-premise HSM for zero-knowledge storage."
relationships:
  - source: "Core Services"
    destination: "Object Gateway API"
    description: "Persists encrypted EMR objects and metadata [HTTPS, TLS 1.3, S3 REST Protocol, mTLS, STS tokens]"
  - source: "Replication & Tiering Controller"
    destination: "AWS S3 in eu-central-1"
    description: "Asynchronously replicates and tier-transitions EMR blobs [AWS S3 API]"
  - source: "Cryptographic Envelope & Key Manager Integration Module"
    destination: "On-Prem HSM"
    description: "Wraps and manages object encryption keys [PKCS#11 / Secure Key Management API]"