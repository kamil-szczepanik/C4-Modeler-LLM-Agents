level: component
scope: "Component diagram for the React SPA Web Application container"
parentContainer:
  name: "React SPA Web Application"
elements:
  - type: "component"
    name: "Routing & Shell Component"
    technology: "React Router, Tailwind CSS"
    description: "Dynamic role-based UI segregation for clinic staff, clinicians, and billing specialists."
  - type: "component"
    name: "State Management & Offline Persistence"
    technology: "Redux Toolkit, encrypted IndexedDB, Web Crypto API"
    description: "Local data caching and secure offline storage providing offline resilience."
  - type: "component"
    name: "API Client & Interceptor Module"
    technology: "Axios, OpenTelemetry"
    description: "Secure communication with real-user monitoring and tracing."
  - type: "component"
    name: "EMR & Scheduling View Modules"
    technology: "TanStack Table"
    description: "Optimized interfaces guaranteeing sub-second P95 render times for EMR workflows."
  - type: "component"
    name: "Sync & Conflict Resolution Manager"
    technology: "Background Queue Manager, Exponential Backoff and Jitter"
    description: "Manages offline queue synchronization and provides a recovery dashboard."
  - type: "component"
    name: "Kong/Envoy API Gateway"
    technology: "Kong/Envoy"
    description: "External API gateway handling REST/JSON over HTTPS with TLS 1.3."
  - type: "component"
    name: "Nginx Containers"
    technology: "Nginx"
    description: "Static asset delivery and container serving for client-side rendering."
  - type: "component"
    name: "Global CDN (AWS CloudFront / On-Prem)"
    technology: "AWS CloudFront / On-Prem Proxies"
    description: "Global CDN strategy for low-latency static asset delivery."
relationships:
  - source: "Sync & Conflict Resolution Manager"
    destination: "API Client & Interceptor Module"
    description: "Internal dispatch of queued payloads [In-memory]."
  - source: "API Client & Interceptor Module"
    destination: "Kong/Envoy API Gateway"
    description: "REST/JSON over HTTPS [TLS 1.3]."
  - source: "Nginx Containers"
    destination: "Global CDN (AWS CloudFront / On-Prem)"
    description: "Static asset delivery [HTTPS/TLS 1.3, Cache-Control]."