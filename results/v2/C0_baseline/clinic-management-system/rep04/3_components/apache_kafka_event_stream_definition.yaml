level: component
scope: "Component diagram for the Apache Kafka Event Stream container"
parentContainer:
  name: "Apache Kafka Event Stream"
elements:
  - type: "component"
    name: "Apache Kafka Event Broker"
    technology: "Apache Kafka (KRaft mode)"
    description: "Manages event streaming without ZooKeeper to meet high availability and process Clinical and Financial Events."
  - type: "component"
    name: "Strimzi Operator"
    technology: "Strimzi Kubernetes Operator"
    description: "Automates Kafka lifecycle, MM2, and cert-manager integration on Kubernetes."
  - type: "component"
    name: "Confluent Schema Registry"
    technology: "Confluent Schema Registry"
    description: "Enforces Avro/Protobuf schemas for data integrity and HIPAA compliance."
  - type: "component"
    name: "Kafka Connect"
    technology: "Kafka Connect"
    description: "Handles reliable CDC and sinks audit/billing data to PostgreSQL and WORM storage."
  - type: "component"
    name: "MirrorMaker 2"
    technology: "MirrorMaker 2"
    description: "Manages asynchronous cross-site replication between on-prem-k8s and eu-central-1."
  - type: "component"
    name: "Tiered Storage Manager"
    technology: "Tiered Storage"
    description: "Offloads historical data to WORM object storage to meet retention mandates without local disk exhaustion."
relationships:
  - source: "Apache Kafka Event Broker"
    destination: "Confluent Schema Registry"
    description: "Validates Avro/Protobuf event payloads [HTTP/REST]"
  - source: "Apache Kafka Event Broker"
    destination: "Tiered Storage Manager"
    description: "Offloads historical data via Tiered Storage Manager [HTTPS / S3 API]"
  - source: "MirrorMaker 2"
    destination: "Apache Kafka Event Broker"
    description: "Replicates topics securely across clusters [Kafka Protocol over mTLS]"
  - source: "Kafka Connect"
    destination: "Apache Kafka Event Broker"
    description: "Executes CDC and sinks audit/billing data [Kafka Protocol / S3 API]"