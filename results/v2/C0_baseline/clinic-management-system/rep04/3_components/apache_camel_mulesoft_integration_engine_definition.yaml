level: component
scope: "Component diagram for the Apache Camel/MuleSoft Integration Engine container"
parentContainer:
  name: "Apache Camel/MuleSoft Integration Engine"
elements:
  - type: "component"
    name: "FHIR Transformer"
    technology: "Apache Camel / MuleSoft"
    description: "Transforms clinical data into HL7 FHIR standards for interoperability."
  - type: "component"
    name: "Routing Router"
    technology: "Apache Camel / MuleSoft"
    description: "Routes integration messages between core services and external systems."
  - type: "component"
    name: "DLQ Handler"
    technology: "Apache Camel / MuleSoft and Apache Kafka"
    description: "Handles dead-letter queue payloads with encryption for compliance."
  - type: "component"
    name: "Audit Interceptor"
    technology: "Apache Camel / MuleSoft"
    description: "Intercepts and logs requests to maintain the 10-year data retention audit trail."
relationships:
  - source: "Routing Router"
    destination: "FHIR Transformer"
    description: "Routes payloads for"
  - source: "FHIR Transformer"
    destination: "Audit Interceptor"
    description: "Sends audit logs to"
  - source: "DLQ Handler"
    destination: "Audit Interceptor"
    description: "Reports failed messages to"