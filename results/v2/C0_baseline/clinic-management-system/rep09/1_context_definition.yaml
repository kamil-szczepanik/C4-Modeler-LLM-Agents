# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed to manage patient admissions, electronic medical records, scheduling, and billing for medium-sized healthcare facilities, ensuring high availability, strict regulatory compliance, and seamless interoperability."
elements:
  - type: "person"
    name: "Patient"
    description: "End user of the healthcare facility who interacts with the system for admissions, scheduling, and viewing medical records."
  - type: "person"
    name: "Clinician/Doctor"
    description: "Medical professional who accesses and updates electronic medical records and manages patient care."
  - type: "person"
    name: "Receptionist/Admin"
    description: "Administrative staff responsible for patient admissions, scheduling, and front-desk clinic operations."
  - type: "person"
    name: "Billing Specialist"
    description: "Staff member responsible for managing billing, invoices, and insurance claims."
  - type: "person"
    name: "Compliance Officer"
    description: "Officer responsible for monitoring system audit logs, security, and ensuring HIPAA and GDPR compliance."
  - type: "externalSystem"
    name: "Enterprise Identity Provider (IdP)"
    description: "External identity provider used for enterprise single sign-on via OIDC/SAML."
  - type: "externalSystem"
    name: "External Labs & Imaging Systems"
    description: "External clinical systems integrated for exchanging medical lab and imaging data."
  - type: "externalSystem"
    name: "Insurance Claim Gateways"
    description: "External gateways used for processing and submitting insurance claims."
relationships:
  - source: "Patient"
    destination: "Clinic Management System"
    description: "Interacts with via Web/Mobile for admissions, scheduling, and records"
    technology: "HTTPS"
  - source: "Clinician/Doctor"
    destination: "Clinic Management System"
    description: "Manages electronic medical records and patient care"
    technology: "HTTPS"
  - source: "Receptionist/Admin"
    destination: "Clinic Management System"
    description: "Manages patient admissions and scheduling"
    technology: "HTTPS"
  - source: "Billing Specialist"
    destination: "Clinic Management System"
    description: "Manages billing and financial processes"
    technology: "HTTPS"
  - source: "Compliance Officer"
    destination: "Clinic Management System"
    description: "Monitors system compliance and audit logs"
    technology: "HTTPS"
  - source: "Clinic Management System"
    destination: "Enterprise Identity Provider (IdP)"
    description: "Authenticates users via enterprise SSO"
    technology: "OIDC/SAML"
  - source: "Clinic Management System"
    destination: "External Labs & Imaging Systems"
    description: "Exchanges standardized healthcare data"
    technology: "HL7 FHIR / REST over TLS with mTLS"
  - source: "Clinic Management System"
    destination: "Insurance Claim Gateways"
    description: "Communicates for insurance claim processing"
    technology: "HTTPS/REST with asynchronous queuing and circuit breakers"