level: component
scope: "Component diagram for the Billing & Claims Container container"
parentContainer:
  name: "Billing & Claims Container"
elements:
  - type: "component"
    name: "Billing API Controller"
    technology: "Spring Boot / Java 17"
    description: "Manages financial transactions, claim validation, and insurance submissions."
  - type: "component"
    name: "Claim Validation Engine"
    technology: "Java 17"
    description: "Validates incoming claims against compliance and business rules."
  - type: "component"
    name: "Claim Processing Service"
    technology: "Spring Boot / Java 17"
    description: "Processes insurance claims and coordinates external gateway submissions."
  - type: "component"
    name: "Patient Invoice Generator"
    technology: "Spring Boot / Java 17"
    description: "Generates patient invoices based on billing records."
  - type: "component"
    name: "Billing Data Access Layer"
    technology: "PostgreSQL"
    description: "Persists billing data using JDBC with TLS and AES-256 column-level encryption."
  - type: "component"
    name: "Audit Sidecar Container"
    technology: "HashiCorp Vault / OpenTelemetry"
    description: "Emits immutable logs, provides distributed tracing, and retrieves secrets."
  - type: "component"
    name: "Insurance Claim Gateways"
    technology: "External Network"
    description: "External insurance networks for claim submissions."
  - type: "component"
    name: "API Gateway"
    technology: "API Gateway / Istio/Linkerd"
    description: "Routes external billing requests into the container."
  - type: "component"
    name: "PostgreSQL"
    technology: "PostgreSQL Database"
    description: "Provides secure, persistent relational storage for financial records."
relationships:
  - source: "API Gateway"
    destination: "Billing API Controller"
    description: "Routes billing requests via gRPC over mTLS (Istio/Linkerd)"
  - source: "Claim Processing Service"
    destination: "Insurance Claim Gateways"
    description: "Submits claims via mTLS with certificate pinning, OAuth2, and JWE envelope encryption"
  - source: "Claim Processing Service"
    destination: "Audit Sidecar Container"
    description: "Emits immutable logs and retrieves secrets via gRPC"
  - source: "Billing Data Access Layer"
    destination: "PostgreSQL"
    description: "Persists billing data using JDBC / TLS with AES-256 column-level encryption"