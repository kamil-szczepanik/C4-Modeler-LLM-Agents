level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "API Gateway"
    technology: "Kong Enterprise / Envoy Proxy"
    description: "High-performance edge routing and security enforcement."
  - type: "component"
    name: "Authentication & Token Validation Filter"
    technology: "Kong / Envoy Plugin"
    description: "Validates tokens against the Enterprise IdP."
  - type: "component"
    name: "Rate Limiting & Throttling Engine"
    technology: "Kong / Envoy Plugin"
    description: "Manages rate limits using a distributed token-bucket store."
  - type: "component"
    name: "Circuit Breaker & Routing Proxy"
    technology: "Envoy Proxy"
    description: "Routes service requests and implements resilience patterns."
  - type: "component"
    name: "Consent & Audit Logging Interceptor"
    technology: "Envoy WASM / OpenTelemetry"
    description: "Streams asynchronous audit logs without impacting performance."
  - type: "component"
    name: "Enterprise Identity Provider (IdP)"
    technology: "OIDC / OAuth2"
    description: "Provides authentication and token validation services."
  - type: "component"
    name: "Redis Distributed Token-Bucket Store"
    technology: "Redis"
    description: "Stores and manages distributed, low-latency rate counters."
  - type: "component"
    name: "Audit Sidecar Container"
    technology: "OpenTelemetry Collector / Sidecar"
    description: "Receives asynchronous audit logs from the audit interceptor."
relationships:
  - source: "Authentication & Token Validation Filter"
    destination: "Enterprise Identity Provider (IdP)"
    description: "Validates tokens [HTTPS / OIDC via TLS]"
  - source: "Rate Limiting & Throttling Engine"
    destination: "Redis Distributed Token-Bucket Store"
    description: "Reads/writes rate counters [RESP over TLS]"
  - source: "API Gateway"
    destination: "Core Clinical & EMR Container"
    description: "Routes service requests [gRPC over mTLS]"
  - source: "Consent & Audit Logging Interceptor"
    destination: "Audit Sidecar Container"
    description: "Streams asynchronous audit logs [gRPC]"