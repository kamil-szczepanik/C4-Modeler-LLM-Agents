level: component
scope: "Component diagram for the Nginx Web App container"
parentContainer:
  name: "Nginx Web App"
elements:
  - type: "component"
    name: "Nginx Reverse Proxy & Static File Server"
    technology: "Nginx Alpine"
    description: "Provides a minimal attack surface, low resource footprint, robust static caching, and reverse proxy capabilities."
  - type: "component"
    name: "Single Page Application (SPA) Runtime"
    technology: "React / TypeScript"
    description: "Provides a dynamic, type-safe Single Page Application runtime for staff workflows."
  - type: "component"
    name: "Client-Side Router / State Manager Component"
    technology: "TypeScript"
    description: "Manages client-side routing and application state for clinical and administrative workflows."
  - type: "component"
    name: "Kubernetes Ingress Controller"
    technology: "Kubernetes Ingress"
    description: "Routes external traffic using mTLS to the Nginx Web App."
  - type: "component"
    name: "Kubernetes Deployment & HPA"
    technology: "Kubernetes & HPA"
    description: "Guarantees 99.99% availability with a minimum of 3 replicas across hybrid targets."
relationships:
  - source: "Kubernetes Ingress Controller"
    destination: "Nginx Reverse Proxy & Static File Server"
    description: "Routes external traffic using mTLS"
  - source: "Nginx Reverse Proxy & Static File Server"
    destination: "Single Page Application (SPA) Runtime"
    description: "Serves static HTML/JS/CSS assets via local disk read"
  - source: "Single Page Application (SPA) Runtime"
    destination: "Client-Side Router / State Manager Component"
    description: "Manages navigation and state"
  - source: "Single Page Application (SPA) Runtime"
    destination: "API Gateway"
    description: "Forwards authenticated API calls via HTTPS / REST / JSON over TLS"