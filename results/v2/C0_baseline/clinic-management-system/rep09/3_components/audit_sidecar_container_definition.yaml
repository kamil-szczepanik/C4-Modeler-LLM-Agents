level: component
scope: "Component diagram for the Audit Sidecar Container container"
parentContainer:
  name: "Audit Sidecar Container"
elements:
  - type: "component"
    name: "Log Interceptor"
    technology: "Fluentbit / Envoy sidecar proxy"
    description: "Captures local access logs and traces via Shared Volume and Unix Socket (gRPC)."
  - type: "component"
    name: "Cryptographic Signer"
    technology: "Go / Rust micro-service using Merkle trees"
    description: "Encrypts and cryptographically signs core clinical application telemetry and access logs to guarantee a 10-year audit trail."
  - type: "component"
    name: "Vault Agent"
    technology: "HashiCorp Vault Agent"
    description: "Handles dynamic secret injection and AES-256-GCM encryption key management."
  - type: "component"
    name: "Compliance Query Proxy"
    technology: "Go REST API"
    description: "Serves audit integrity and proof-of-custody reports to compliance officers."
  - type: "component"
    name: "Local Disk Buffer"
    technology: "AES-256-GCM encrypted volume"
    description: "Stores backpressure spillover for the log interceptor."
  - type: "component"
    name: "Compliance Officer"
    technology: "User role"
    description: "Queries audit integrity and proof-of-custody reports."
  - type: "component"
    name: "Central SIEM / Immutable Storage"
    technology: "External storage"
    description: "Receives asynchronously streamed signed audit bundles."
  - type: "component"
    name: "Core Clinical & EMR Container"
    technology: "Container"
    description: "Sends local access logs and traces to the log interceptor."
relationships:
  - source: "Core Clinical & EMR Container"
    destination: "Log Interceptor"
    description: "Sends local access logs and traces via Shared Volume / Unix Socket (gRPC)"
  - source: "Log Interceptor"
    destination: "Local Disk Buffer"
    description: "Stores backpressure spillover via AES-256-GCM encrypted volume"
  - source: "Cryptographic Signer"
    destination: "Central SIEM / Immutable Storage"
    description: "Streams signed audit bundles asynchronously via HTTPS (TLS 1.3)"
  - source: "Compliance Officer"
    destination: "Compliance Query Proxy"
    description: "Queries audit integrity and proof-of-custody reports via HTTPS (TLS 1.3) with OAuth2/JWT"