level: component
scope: "Component diagram for the Core Clinical & EMR Container container"
parentContainer:
  name: "Core Clinical & EMR Container"
elements:
  - type: "component"
    name: "Admission & Demographics Component"
    technology: "Spring Boot 3 / Java 21"
    description: "Manages patient admissions and demographic information."
  - type: "component"
    name: "EMR Clinical Core Component"
    technology: "Spring Boot 3 / Java 21"
    description: "Handles electronic medical records and core clinical workflows."
  - type: "component"
    name: "Audit Trail Manager"
    technology: "Spring Boot 3 / Java 21"
    description: "Manages tamper-proof audit trails and asynchronous event publishing."
  - type: "component"
    name: "Data Access Layer / Encryption Engine"
    technology: "Hibernate with custom types, AES-256"
    description: "Handles database transactions and field-level encryption at rest."
  - type: "component"
    name: "Redis L2 Cache Layer"
    technology: "Redis, TCP/RESP over mTLS"
    description: "Accelerates active EMR reads while maintaining encrypted PHI."
  - type: "component"
    name: "Audit Sidecar Container"
    technology: "Container Sidecar, gRPC"
    description: "Receives batched cryptographic logs from the Audit Trail Manager."
  - type: "component"
    name: "External PostgreSQL"
    technology: "PostgreSQL, mTLS and IAM authentication"
    description: "External database for persistent storage."
relationships:
  - source: "Admission & Demographics Component"
    destination: "Data Access Layer / Encryption Engine"
    description: "In-process method calls [Java]"
  - source: "EMR Clinical Core Component"
    destination: "Data Access Layer / Encryption Engine"
    description: "In-process method calls [Java]"
  - source: "EMR Clinical Core Component"
    destination: "Redis L2 Cache Layer"
    description: "Read/Write active clinical data [TCP/RESP over mTLS]"
  - source: "EMR Clinical Core Component"
    destination: "Audit Trail Manager"
    description: "Async event publishing [Spring Application Events]"
  - source: "Audit Trail Manager"
    destination: "Audit Sidecar Container"
    description: "Push batched cryptographic logs [gRPC]"
  - source: "Core Clinical & EMR Container"
    destination: "External PostgreSQL"
    description: "Database transactions [mTLS and IAM authentication]"