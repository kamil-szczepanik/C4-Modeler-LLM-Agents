level: component
scope: "Component diagram for the Sync/Replication Container container"
parentContainer:
  name: "Sync/Replication Container"
elements:
  - type: "component"
    name: "Transactional Outbox Poller"
    technology: "Go / Java"
    description: "Polls transactional outbox for database changes."
  - type: "component"
    name: "Payload Encryption Interceptor"
    technology: "Go / Java"
    description: "Encrypts payloads using HashiCorp Vault REST/TLS 1.3."
  - type: "component"
    name: "Conflict Resolution Engine"
    technology: "Go / Java"
    description: "Resolves synchronization conflicts and communicates with the audit sidecar."
  - type: "component"
    name: "Quarantine & Audit Manager"
    technology: "Go / Java"
    description: "Manages quarantine and audit processes for hybrid replication."
relationships:
  - source: "Transactional Outbox Poller"
    destination: "Payload Encryption Interceptor"
    description: "Passes outbox messages for encryption"
  - source: "Payload Encryption Interceptor"
    destination: "HashiCorp Vault"
    description: "REST / TLS 1.3 for DEK management"
  - source: "Conflict Resolution Engine"
    destination: "Audit Sidecar"
    description: "gRPC over localhost"