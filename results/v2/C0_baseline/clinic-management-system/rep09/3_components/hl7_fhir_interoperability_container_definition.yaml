level: component
scope: "Component diagram for the HL7 FHIR Interoperability Container container"
parentContainer:
  name: "HL7 FHIR Interoperability Container"
elements:
  - type: "component"
    name: "FHIR API Router"
    technology: "Node.js (Express/NestJS)"
    description: "Routes incoming FHIR API requests to appropriate internal handlers."
  - type: "component"
    name: "SMART-on-FHIR Authorizer"
    technology: "OAuth2 / SMART-on-FHIR Middleware"
    description: "Authorizes requests using SMART-on-FHIR and OAuth2 protocols."
  - type: "component"
    name: "FHIR Validation & Transformation Engine"
    technology: "Node.js / Apache Camel"
    description: "Validates and transforms FHIR payloads to ensure standard compliance."
  - type: "component"
    name: "Outbox Event Publisher"
    technology: "Apache Kafka Client"
    description: "Publishes domain events via an outbox pattern for reliable messaging."
  - type: "component"
    name: "External TLS Client Connector"
    technology: "Node.js TLS/HTTPS Client"
    description: "Handles outbound secure connections to external systems."
  - type: "component"
    name: "Circuit Breaker Proxy"
    technology: "Resilience4j"
    description: "Protects outbound calls to external labs and imaging systems using circuit breaking."
  - type: "component"
    name: "PHI Sanitization Middleware"
    technology: "Node.js Middleware"
    description: "Sanitizes protected health information (PHI) to maintain security compliance."
relationships:
  - source: "FHIR API Router"
    destination: "SMART-on-FHIR Authorizer"
    description: "In-memory middleware"
  - source: "Validation & Transformation Engine"
    destination: "Outbox Event Publisher"
    description: "Internal message queue"
  - source: "External TLS Client Connector"
    destination: "Circuit Breaker Proxy"
    description: "In-memory invocation"