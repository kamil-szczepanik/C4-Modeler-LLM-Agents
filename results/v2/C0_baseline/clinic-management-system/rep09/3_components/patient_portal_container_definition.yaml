level: component
scope: "Component diagram for the Patient Portal Container container"
parentContainer:
  name: "Patient Portal Container"
elements:
  - type: "component"
    name: "Patient"
    technology: "End-user"
    description: "End-user interacting with the portal for healthcare services."
  - type: "component"
    name: "Portal UI Component"
    technology: "React and Tailwind CSS"
    description: "Interface ensuring WCAG 2.1 AA accessibility."
  - type: "component"
    name: "Patient BFF Component"
    technology: "Next.js API Routes and Node.js server runtime"
    description: "Manages sessions and data aggregation."
  - type: "component"
    name: "Session & Token Manager Component"
    technology: "OAuth2/OIDC"
    description: "Handles OAuth2/OIDC token exchange and multi-factor authentication."
  - type: "component"
    name: "Client-Side State & Cache Component"
    technology: "React Query and React Context"
    description: "Managing localized UI state and non-sensitive cache."
  - type: "component"
    name: "API Gateway"
    technology: "Kong or Envoy"
    description: "Routing requests between services."
  - type: "component"
    name: "Enterprise IdP"
    technology: "External identity provider"
    description: "External identity provider for authentication."
relationships:
  - source: "Patient"
    destination: "Portal UI Component"
    description: "Interacts with portal for health records and scheduling [HTTPS / TLS]"
  - source: "Portal UI Component"
    destination: "Patient BFF Component"
    description: "Internal API calls [HTTPS]"
  - source: "Patient BFF Component"
    destination: "API Gateway"
    description: "Proxies backend requests [HTTPS / REST / GraphQL, TLS]"
  - source: "Patient BFF Component"
    destination: "Enterprise IdP"
    description: "Exchanges and validates tokens [OAuth2/OIDC via HTTPS]"
  - source: "Portal UI Component"
    destination: "Client-Side State & Cache Component"
    description: "Manages local data flow [In-Memory]"