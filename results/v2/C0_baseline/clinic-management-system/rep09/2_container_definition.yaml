# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patient"
    description: "End user of the healthcare facility who interacts with the system for admissions, scheduling, and viewing medical records."
  - type: "person"
    name: "Clinician"
    description: "Medical professional who accesses and updates electronic medical records and manages patient care."
  - type: "person"
    name: "Receptionist/Admin"
    description: "Administrative staff responsible for patient admissions, scheduling, and front-desk clinic operations."
  - type: "person"
    name: "Billing Specialist"
    description: "Staff member responsible for managing billing, invoices, and insurance claims."
  - type: "person"
    name: "Compliance Officer"
    description: "Officer responsible for monitoring system audit logs, security, and ensuring HIPAA and GDPR compliance."
  - type: "externalSystem"
    name: "Enterprise Identity Provider (IdP)"
    description: "External identity provider used for enterprise single sign-on via OIDC/SAML."
  - type: "externalSystem"
    name: "External Labs & Imaging Systems"
    description: "External clinical systems integrated for exchanging medical lab and imaging data."
  - type: "externalSystem"
    name: "Insurance Claim Gateways"
    description: "External gateways used for processing and submitting insurance claims."
  - type: "container"
    name: "Nginx Web App"
    technology: "Nginx / Single Page Application"
    description: "Serves the web application frontend for staff users."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / Envoy"
    description: "Routes, secures, and manages API requests across core clinical and auxiliary containers."
  - type: "container"
    name: "Core Clinical & EMR Container"
    technology: "Spring Boot / Go / PostgreSQL"
    description: "Manages core clinical workflows, patient admissions, and EMR data with AES-256 encryption."
  - type: "container"
    name: "Billing & Claims Container"
    technology: "Spring Boot / Go"
    description: "Handles billing, invoices, and communicates with insurance claim gateways."
  - type: "container"
    name: "HL7 FHIR Interoperability Container"
    technology: "Node.js / Apache Camel"
    description: "Integrates with external labs and imaging systems using HL7 FHIR standards."
  - type: "container"
    name: "Patient Portal Container"
    technology: "Next.js / React"
    description: "Provides a secure portal for patients to view records, schedule, and interact with the clinic."
  - type: "container"
    name: "Sync/Replication Container"
    technology: "Apache Kafka / Outbox pattern"
    description: "Handles offline resilience, data synchronization, and multi-region replication."
  - type: "container"
    name: "Audit Sidecar Container"
    technology: "OpenTelemetry / HashiCorp Vault"
    description: "Captures distributed tracing, secrets management, and immutable audit logs for compliance."
relationships:
  - source: "Patient"
    destination: "Patient Portal Container"
    description: "Interacts with portal for health records and scheduling"
    technology: "HTTPS (TLS)"
  - source: "Clinician"
    destination: "Nginx Web App"
    description: "Accesses clinical workflows and EMR"
    technology: "HTTPS (TLS)"
  - source: "Receptionist/Admin"
    destination: "Nginx Web App"
    description: "Manages admissions and scheduling"
    technology: "HTTPS (TLS)"
  - source: "Billing Specialist"
    destination: "Nginx Web App"
    description: "Manages billing and financial processes"
    technology: "HTTPS (TLS)"
  - source: "Compliance Officer"
    destination: "Nginx Web App"
    description: "Monitors audit logs and security compliance"
    technology: "HTTPS (TLS)"
  - source: "Nginx Web App"
    destination: "API Gateway"
    description: "Sends API requests and queries"
    technology: "HTTPS / REST / GraphQL via TLS"
  - source: "Patient Portal Container"
    destination: "API Gateway"
    description: "Sends patient-facing API requests and queries"
    technology: "HTTPS / REST / GraphQL via TLS"
  - source: "API Gateway"
    destination: "Core Clinical & EMR Container"
    description: "Routes internal service requests"
    technology: "gRPC over mTLS (Istio/Linkerd)"
  - source: "API Gateway"
    destination: "Billing & Claims Container"
    description: "Routes billing service requests"
    technology: "gRPC over mTLS (Istio/Linkerd)"
  - source: "API Gateway"
    destination: "HL7 FHIR Interoperability Container"
    description: "Routes interoperability requests"
    technology: "gRPC over mTLS (Istio/Linkerd)"
  - source: "Core Clinical & EMR Container"
    destination: "Sync/Replication Container"
    description: "Replicates and syncs transaction events"
    technology: "Apache Kafka"
  - source: "Billing & Claims Container"
    destination: "Insurance Claim Gateways"
    description: "Sends and receives insurance claims"
    technology: "HTTPS / TLS with message queues"
  - source: "HL7 FHIR Interoperability Container"
    destination: "External Labs & Imaging Systems"
    description: "Exchanges clinical and lab data"
    technology: "HL7 FHIR APIs over TLS"