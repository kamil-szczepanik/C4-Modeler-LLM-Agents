level: component
scope: "Component diagram for the EMR & Scheduling Service container"
parentContainer:
  name: "EMR & Scheduling Service"
elements:
  - type: "component"
    name: "Patient Registry"
    technology: "Node.js / Java"
    description: "Manages patient demographic records, admissions, and master patient index."
  - type: "component"
    name: "Scheduling Engine"
    technology: "Node.js / Java"
    description: "Handles appointments, resource clash checks, and slot caching using Redis."
  - type: "component"
    name: "EMR Core"
    technology: "Node.js / Java"
    description: "Processes electronic medical records and clinical notes with optimistic locking against PostgreSQL."
  - type: "component"
    name: "Access Control & Policy Enforcer (OPA)"
    technology: "Open Policy Agent (OPA)"
    description: "Enforces fine-grained ABAC/RBAC policies, cryptographic context checks, and break-glass auditing."
  - type: "component"
    name: "Audit Interceptor"
    technology: "Node.js / Java"
    description: "Streams PHI-masked telemetry and immutable audit records to SIEM and WORM storage."
relationships:
  - source: "Access Control & Policy Enforcer (OPA)"
    destination: "EMR Core"
    description: "Forwards authorized requests with cryptographic context"
  - source: "Access Control & Policy Enforcer (OPA)"
    destination: "Patient Registry"
    description: "Forwards authorized requests with cryptographic context"
  - source: "Scheduling Engine"
    destination: "Redis Cache"
    description: "Executes sub-100ms resource clash checks"
  - source: "EMR Core"
    destination: "Region-local PostgreSQL"
    description: "Reads and writes operational data with optimistic locking"
  - source: "Patient Registry"
    destination: "Region-local PostgreSQL"
    description: "Reads and writes operational data"
  - source: "EMR Core"
    destination: "Apache Kafka/RabbitMQ"
    description: "Publishes asynchronous events"
  - source: "Audit Interceptor"
    destination: "AWS S3 / on-prem WORM Object Storage"
    description: "Archives immutable audit records"
  - source: "EMR Core"
    destination: "HashiCorp Vault"
    description: "Retrieves dynamic database credentials"
  - source: "Audit Interceptor"
    destination: "Centralized SIEM & Observability Platform"
    description: "Streams PHI-masked telemetry"