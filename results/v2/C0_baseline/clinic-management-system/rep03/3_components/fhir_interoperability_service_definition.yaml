level: component
scope: "Component diagram for the FHIR Interoperability Service container"
parentContainer:
  name: "FHIR Interoperability Service"
elements:
  - type: "component"
    name: "FHIR API Controller"
    technology: "HAPI FHIR REST Framework, Java"
    description: "Handles incoming FHIR API requests and provides validation for payloads."
  - type: "component"
    name: "Transformation Engine"
    technology: "Apache Camel, Java"
    description: "Transforms validated payloads and performs atomic outbox writes."
  - type: "component"
    name: "Async Event Dispatcher"
    technology: "Spring Cloud Stream / Kafka Client"
    description: "Publishes outbox events to message brokers."
relationships:
  - source: "FHIR API Controller"
    destination: "Transformation Engine"
    description: "Validated FHIR payload [Java interface]"