level: component
scope: "Component diagram for the Region-local PostgreSQL databases container"
parentContainer:
  name: "Region-local PostgreSQL databases"
elements:
  - type: "component"
    name: "Primary Database Engine"
    technology: "PostgreSQL, CNPG operator, Amazon RDS"
    description: "Stores operational data, EMR records, and billing details with Row-Level Security (RLS) and automated failover."
  - type: "component"
    name: "PgBouncer Connection Pooler"
    technology: "PgBouncer"
    description: "Manages high connection concurrency from microservices to the PostgreSQL database."
  - type: "component"
    name: "Audit Logging Engine"
    technology: "pgaudit"
    description: "Generates and forwards audit logs to the centralized SIEM."
relationships:
  - source: "PgBouncer Connection Pooler"
    destination: "Primary Database Engine"
    description: "Routes and pools database connections"
  - source: "Primary Database Engine"
    destination: "Audit Logging Engine"
    description: "Generates audit events"