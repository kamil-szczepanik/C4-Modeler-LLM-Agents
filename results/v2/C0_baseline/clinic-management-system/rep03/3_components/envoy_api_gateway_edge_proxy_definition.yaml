level: component
scope: "Component diagram for the Envoy API Gateway / Edge Proxy container"
parentContainer:
  name: "Envoy API Gateway / Edge Proxy"
elements:
  - type: "component"
    name: "Listener & TLS Termination Component"
    technology: "C++"
    description: "Handles TLS 1.3 termination and WAF filtering for incoming traffic."
  - type: "component"
    name: "Auth & Authorization Filter"
    technology: "Lua / External"
    description: "Validates OAuth2/OIDC JWTs, scopes, and enforces persona-based rate limits."
  - type: "component"
    name: "Routing & Load Balancing Engine"
    technology: "Envoy Proxy Core"
    description: "Manages circuit breaking and mTLS to backend services."
  - type: "component"
    name: "Telemetry & Audit Emitter"
    technology: "OpenTelemetry / gRPC"
    description: "Streams PII-sanitized OpenTelemetry logs to the centralized SIEM."
relationships:
  - source: "Listener & TLS Termination Component"
    destination: "Auth & Authorization Filter"
    description: "Passes authenticated requests for token and policy validation"
  - source: "Auth & Authorization Filter"
    destination: "Routing & Load Balancing Engine"
    description: "Forwards authorized requests for upstream routing"
  - source: "Routing & Load Balancing Engine"
    destination: "Telemetry & Audit Emitter"
    description: "Emits request metrics and sanitized audit logs"