level: component
scope: "Component diagram for the Localized Apache Kafka/RabbitMQ message brokers container"
parentContainer:
  name: "Localized Apache Kafka/RabbitMQ message brokers"
elements:
  - type: "component"
    name: "Event Streaming Core"
    technology: "Apache Kafka"
    description: "Publishes and consumes domain events for EMR and scheduling services."
  - type: "component"
    name: "Task & Routing Broker"
    technology: "RabbitMQ"
    description: "Dispatches task commands for billing and claims services."
  - type: "component"
    name: "Broker Encryption & Access Manager"
    technology: "HashiCorp Vault / TLS 1.3 / SCRAM-SHA-512"
    description: "Manages encryption, certificate rotation, and access control for message brokers."
  - type: "component"
    name: "Local Edge Buffer Component"
    technology: "Kafka/AMQP Buffer"
    description: "Provides local edge buffering to ensure zero data loss during network partitions."
  - type: "component"
    name: "Dead-Letter & Quarantine Router"
    technology: "Kafka/AMQP DLQ"
    description: "Routes undeliverable or erroneous messages for isolation and analysis."
relationships:
  - source: "EMR & Scheduling Service"
    destination: "Event Streaming Core"
    description: "Publishes/consumes domain events [TCP / Kafka Protocol, TLS 1.3]"
  - source: "Billing & Claims Service"
    destination: "Task & Routing Broker"
    description: "Dispatches task commands [AMQP 0-9-1, TLS 1.3]"
  - source: "Event Streaming Core"
    destination: "Centralized SIEM & Observability Platform"
    description: "Streams audit logs and metrics [OTLP / HTTPS, TLS 1.3]"
  - source: "FHIR Interoperability Service"
    destination: "Event Streaming Core"
    description: "Exchanges clinical data [Kafka/AMQP protocol]"