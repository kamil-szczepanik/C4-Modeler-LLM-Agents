level: component
scope: "Component diagram for the Billing & Claims Service container"
parentContainer:
  name: "Billing & Claims Service"
elements:
  - type: "component"
    name: "Claim Submission Controller"
    technology: "Spring WebMVC"
    description: "Handles incoming claim submission requests and routes validation to third-party gateways."
  - type: "component"
    name: "Clearinghouse Adapter"
    technology: "Spring Cloud OpenFeign"
    description: "Adapts communication with external clearinghouses and fetches dynamic API keys."
  - type: "component"
    name: "Billing Event Publisher"
    technology: "Apache Kafka"
    description: "Publishes financial events for billing and ledger lifecycles."
  - type: "component"
    name: "WORM Archival Service"
    technology: "Spring Batch / AWS S3"
    description: "Archives records for long-term compliant data retention."
  - type: "component"
    name: "Billing Audit & Ledger Component"
    technology: "Spring Data JDBC / Axon Framework"
    description: "Persists audit trails and manages ledger transactions."
  - type: "component"
    name: "Envoy API Gateway"
    technology: "Istio/Linkerd"
    description: "Routes requests via internal mTLS to the claim submission controller."
  - type: "component"
    name: "Region-local PostgreSQL databases"
    technology: "PostgreSQL"
    description: "Relational storage with table partitioning and encryption at rest."
  - type: "component"
    name: "Third-Party Payment Gateway & Insurance Clearinghouse"
    technology: "External REST Service"
    description: "External payment gateway and insurance clearinghouse system."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Provides dynamic secrets and cryptographic key management."
  - type: "component"
    name: "AWS S3 / Object Storage"
    technology: "AWS S3"
    description: "Object storage used for compliant long-term data retention."
relationships:
  - source: "Envoy API Gateway"
    destination: "Claim Submission Controller"
    description: "Routes requests via internal mTLS [Istio/Linkerd]"
  - source: "Claim Submission Controller"
    destination: "Third-Party Payment Gateway & Insurance Clearinghouse"
    description: "Synchronous validation [REST over HTTPS]"
  - source: "Billing Event Publisher"
    destination: "Apache Kafka"
    description: "Publishes financial events [Kafka Protocol with mTLS]"
  - source: "WORM Archival Service"
    destination: "AWS S3 / Object Storage"
    description: "Archives records [HTTPS / S3 API with Object Lock]"
  - source: "Clearinghouse Adapter"
    destination: "HashiCorp Vault"
    description: "Fetches dynamic API keys [HTTPS / Vault API]"
  - source: "Billing Audit & Ledger Component"
    destination: "Region-local PostgreSQL databases"
    description: "Persists audit trails [Encrypted TCP / TLS 1.3]"