level: component
scope: "Component diagram for the HashiCorp Vault container"
parentContainer:
  name: "HashiCorp Vault"
elements:
  - type: "component"
    name: "HTTP API / Core Engine"
    technology: "HTTP API / Core Engine"
    description: "Handles core request processing and API interactions for Vault."
  - type: "component"
    name: "Authentication Engine"
    technology: "Auth Engine"
    description: "Manages authentication methods such as AppRole and Kubernetes Auth."
  - type: "component"
    name: "Secret Engines"
    technology: "Secret Engines"
    description: "Secures and manages dynamic credentials, secrets, and token leases."
  - type: "component"
    name: "Transit Secrets Engine"
    technology: "Transit Secrets Engine"
    description: "Provides encryption-as-a-service and envelope encryption for applications."
  - type: "component"
    name: "Audit Device Subsystem"
    technology: "Audit Subsystem"
    description: "Logs all requests and responses to Vault and streams audit logs to the SIEM."
  - type: "component"
    name: "Replication Manager"
    technology: "Replication Manager"
    description: "Manages regional enterprise performance replication for high availability."
relationships:
  - source: "EMR & Scheduling Service, Billing & Claims Service, FHIR Interoperability Service, and Envoy API Gateway"
    destination: "HTTP API / Core Engine"
    description: "Authenticates and communicates via AppRole / Kubernetes Auth [mTLS / HTTPS]"
  - source: "Audit Device Subsystem"
    destination: "Centralized SIEM & Observability Platform"
    description: "Streams audit logs [Syslog / TLS]"
  - source: "HTTP API / Core Engine"
    destination: "AWS S3 / WORM Object Storage"
    description: "Ships encrypted Raft daily snapshots [HTTPS]"