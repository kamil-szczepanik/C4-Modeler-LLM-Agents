level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Front Desk Staff"
    description: "Manages patient admissions, scheduling, and front-desk workflows."
  - type: "person"
    name: "Clinicians"
    description: "Accesses and updates electronic medical records (EMR) and patient care details."
  - type: "person"
    name: "Billing Officers"
    description: "Handles patient billing and financial transactions."
  - type: "person"
    name: "Patients"
    description: "Interacts with the system for scheduling, medical records, and billing."
  - type: "person"
    name: "Regulatory Auditors"
    description: "Audits system logs and compliance data for regulatory standards."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Handles multi-factor authentication and identity federation via OIDC/SAML."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing laboratory and imaging data via HL7 FHIR."
  - type: "externalSystem"
    name: "Third-Party Payment Gateway & Insurance Clearinghouse"
    description: "Handles financial transactions and insurance claims."
  - type: "externalSystem"
    name: "Centralized SIEM & Observability Platform"
    description: "Receives telemetry and audit logs with PHI masking."
  - type: "externalSystem"
    name: "Global Traffic Manager / Anycast DNS"
    description: "Provides traffic routing and DDoS mitigation using DNSSEC."
  - type: "externalSystem"
    name: "Distributed Network Interconnect / SD-WAN"
    description: "Manages hybrid boundary networking and secure connectivity."
  - type: "container"
    name: "React Single-Page Application (SPA) / React Native Mobile Client"
    technology: "React, React Native, CDN"
    description: "Client-side frontend for web and mobile users delivering optimized rendering."
  - type: "container"
    name: "Envoy API Gateway / Edge Proxy"
    technology: "Envoy"
    description: "Edge layer routing incoming traffic, handling TLS 1.3 and OAuth2/OIDC validation."
  - type: "container"
    name: "EMR & Scheduling Service"
    technology: "Node.js / Java"
    description: "Core service managing patient admissions, electronic medical records, and scheduling."
  - type: "container"
    name: "Billing & Claims Service"
    technology: "Java / Spring Boot"
    description: "Core service managing patient billing, financial transactions, and insurance claims."
  - type: "container"
    name: "FHIR Interoperability Service"
    technology: "HAPI FHIR, Java"
    description: "Core service managing FHIR-based interoperability and asynchronous message exchanges."
  - type: "container"
    name: "Region-local PostgreSQL databases"
    technology: "PostgreSQL"
    description: "Regional operational storage for patient and system data."
  - type: "container"
    name: "Localized Apache Kafka/RabbitMQ message brokers"
    technology: "Apache Kafka / RabbitMQ"
    description: "Message brokers for asynchronous, decoupled data exchanges."
  - type: "container"
    name: "AWS S3 / on-prem object storage (WORM)"
    technology: "AWS S3 / WORM Object Storage"
    description: "Object storage enforcing WORM policies for 10-year audit retention."
  - type: "container"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Secrets management system for dynamic secret retrieval."
relationships:
  - source: "Front Desk Staff"
    destination: "React Single-Page Application (SPA) / React Native Mobile Client"
    description: "Interacts with admissions and scheduling features"
    technology: "HTTPS"
  - source: "Clinicians"
    destination: "React Single-Page Application (SPA) / React Native Mobile Client"
    description: "Accesses EMR and patient care details"
    technology: "HTTPS"
  - source: "Billing Officers"
    destination: "React Single-Page Application (SPA) / React Native Mobile Client"
    description: "Manages patient billing"
    technology: "HTTPS"
  - source: "Patients"
    destination: "React Single-Page Application (SPA) / React Native Mobile Client"
    description: "Interacts via portal for appointments and records"
    technology: "HTTPS"
  - source: "Regulatory Auditors"
    destination: "React Single-Page Application (SPA) / React Native Mobile Client"
    description: "Reviews audit logs and compliance data"
    technology: "HTTPS"
  - source: "Global Traffic Manager / Anycast DNS"
    destination: "Envoy API Gateway / Edge Proxy"
    description: "Routes external traffic to edge"
    technology: "DNS / HTTPS"
  - source: "React Single-Page Application (SPA) / React Native Mobile Client"
    destination: "Envoy API Gateway / Edge Proxy"
    description: "Sends API requests with OAuth2/OIDC validation"
    technology: "HTTPS / TLS 1.3"
  - source: "Envoy API Gateway / Edge Proxy"
    destination: "EMR & Scheduling Service"
    description: "Routes internal requests securely"
    technology: "Internal mTLS via Istio/Linkerd"
  - source: "Envoy API Gateway / Edge Proxy"
    destination: "Billing & Claims Service"
    description: "Routes billing requests securely"
    technology: "Internal mTLS via Istio/Linkerd"
  - source: "Envoy API Gateway / Edge Proxy"
    destination: "FHIR Interoperability Service"
    description: "Routes interoperability requests securely"
    technology: "Internal mTLS via Istio/Linkerd"
  - source: "EMR & Scheduling Service"
    destination: "Region-local PostgreSQL databases"
    description: "Reads and writes operational data"
    technology: "Encrypted TCP"
  - source: "Billing & Claims Service"
    destination: "Region-local PostgreSQL databases"
    description: "Reads and writes billing data"
    technology: "Encrypted TCP"
  - source: "FHIR Interoperability Service"
    destination: "Localized Apache Kafka/RabbitMQ message brokers"
    description: "Communicates asynchronously using W3C Trace Context headers"
    technology: "Kafka/AMQP protocol"
  - source: "EMR & Scheduling Service"
    destination: "Localized Apache Kafka/RabbitMQ message brokers"
    description: "Publishes and consumes events asynchronously"
    technology: "Kafka/AMQP protocol"
  - source: "Billing & Claims Service"
    destination: "Localized Apache Kafka/RabbitMQ message brokers"
    description: "Publishes and consumes billing events asynchronously"
    technology: "Kafka/AMQP protocol"
  - source: "EMR & Scheduling Service"
    destination: "AWS S3 / on-prem object storage (WORM)"
    description: "Archives immutable audit and compliance records"
    technology: "HTTPS / S3 API"
  - source: "Billing & Claims Service"
    destination: "AWS S3 / on-prem object storage (WORM)"
    description: "Archives billing records"
    technology: "HTTPS / S3 API"
  - source: "EMR & Scheduling Service"
    destination: "HashiCorp Vault"
    description: "Retrieves secrets dynamically"
    technology: "HTTPS / Vault API"
  - source: "Billing & Claims Service"
    destination: "HashiCorp Vault"
    description: "Retrieves secrets dynamically"
    technology: "HTTPS / Vault API"
  - source: "FHIR Interoperability Service"
    destination: "HashiCorp Vault"
    description: "Retrieves secrets dynamically"
    technology: "HTTPS / Vault API"
  - source: "Envoy API Gateway / Edge Proxy"
    destination: "HashiCorp Vault"
    description: "Retrieves secrets dynamically"
    technology: "HTTPS / Vault API"
  - source: "Clinic Management System"
    destination: "Identity Provider"
    description: "Validates and federates user identities"
    technology: "OIDC/SAML"
  - source: "FHIR Interoperability Service"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges lab and imaging data"
    technology: "HL7 FHIR over HTTPS"
  - source: "Billing & Claims Service"
    destination: "Third-Party Payment Gateway & Insurance Clearinghouse"
    description: "Processes payments and claims"
    technology: "REST over HTTPS"
  - source: "EMR & Scheduling Service"
    destination: "Centralized SIEM & Observability Platform"
    description: "Streams telemetry and audit logs with PHI masking"
    technology: "Secure syslog/OTLP"
  - source: "Billing & Claims Service"
    destination: "Centralized SIEM & Observability Platform"
    destination: "Streams telemetry and audit logs with PHI masking"
    technology: "Secure syslog/OTLP"
  - source: "Distributed Network Interconnect / SD-WAN"
