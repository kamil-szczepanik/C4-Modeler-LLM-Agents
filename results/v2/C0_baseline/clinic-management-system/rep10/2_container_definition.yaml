level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care, managing appointments, and viewing their medical records."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals responsible for patient diagnosis, treatment, and EMR management."
  - type: "person"
    name: "Administrative Staff"
    description: "Staff members handling patient admissions and scheduling."
  - type: "person"
    name: "Billing Officers"
    description: "Personnel managing patient billing and insurance claims."
  - type: "person"
    name: "Auditors"
    description: "Personnel ensuring regulatory compliance and reviewing audit logs."
  - type: "externalSystem"
    name: "External Insurance Clearinghouses"
    description: "External systems used for real-time claim adjudication."
  - type: "externalSystem"
    name: "External Labs/Imaging"
    description: "External systems providing lab results and medical imaging data."
  - type: "container"
    name: "Web Application"
    technology: "React / TypeScript"
    description: "Responsive web interface for patients, clinicians, and staff."
  - type: "container"
    name: "API Gateway"
    technology: "NGINX / Envoy"
    description: "Edge ingress handling rate limiting, routing, and JWT validation."
  - type: "container"
    name: "EMR Service"
    technology: "Node.js / Go"
    description: "Manages electronic medical records and clinical workflows."
  - type: "container"
    name: "Billing & Claims Service"
    technology: "Java / Spring Boot"
    description: "Handles patient billing and insurance claims."
  - type: "container"
    name: "Scheduling Service"
    technology: "Node.js / Go"
    description: "Manages patient admissions and appointment scheduling."
  - type: "container"
    name: "Notification Service"
    technology: "Python / FastAPI"
    description: "Handles system notifications and alerts."
  - type: "container"
    name: "Integration Service"
    technology: "Java / Spring Boot"
    description: "Connects via HL7 FHIR APIs to external lab systems and clearinghouses."
  - type: "container"
    name: "PostgreSQL"
    technology: "PostgreSQL with AES-256"
    description: "Persistent relational data storage for core services."
  - type: "container"
    name: "Redis"
    technology: "Redis"
    description: "Caching layer for scheduling and real-time data."
  - type: "container"
    name: "RabbitMQ"
    technology: "RabbitMQ Message Broker"
    description: "Asynchronous messaging backbone for microservices."
  - type: "container"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Secrets management and secure credential storage."
relationships:
  - source: "Patients"
    destination: "Web Application"
    description: "Accesses appointments and records"
    technology: "HTTPS"
  - source: "Clinicians"
    destination: "Web Application"
    description: "Manages EMR and clinical workflows"
    technology: "HTTPS"
  - source: "Administrative Staff"
    destination: "Web Application"
    description: "Manages admissions and scheduling"
    technology: "HTTPS"
  - source: "Billing Officers"
    destination: "Web Application"
    description: "Manages billing and claims"
    technology: "HTTPS"
  - source: "Auditors"
    destination: "Web Application"
    description: "Reviews compliance and logs"
    technology: "HTTPS"
  - source: "Web Application"
    destination: "API Gateway"
    description: "Sends client requests"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "EMR Service"
    description: "Routes EMR requests"
    technology: "REST / JSON over HTTPS"
  - source: "API Gateway"
    destination: "Billing & Claims Service"
    description: "Routes billing requests"
    technology: "REST / JSON over HTTPS"
  - source: "API Gateway"
    destination: "Scheduling Service"
    description: "Routes scheduling requests"
    technology: "REST / JSON over HTTPS"
  - source: "API Gateway"
    destination: "Notification Service"
    description: "Routes notification requests"
    technology: "REST / JSON over HTTPS"
  - source: "API Gateway"
    destination: "Integration Service"
    description: "Routes integration requests"
    technology: "REST / JSON over HTTPS"
  - source: "EMR Service"
    destination: "RabbitMQ"
    description: "Publishes and consumes clinical events"
    technology: "AMQP"
  - source: "Billing & Claims Service"
    destination: "RabbitMQ"
    description: "Publishes and consumes billing events"
    technology: "AMQP"
  - source: "Scheduling Service"
    destination: "RabbitMQ"
    description: "Publishes and consumes scheduling events"
    technology: "AMQP"
  - source: "Notification Service"
    destination: "RabbitMQ"
    description: "Consumes notification events"
    technology: "AMQP"
  - source: "EMR Service"
    destination: "PostgreSQL"
    description: "Reads and writes EMR data"
    technology: "SQL / TLS"
  - source: "Billing & Claims Service"
    destination: "PostgreSQL"
    description: "Reads and writes billing data"
    technology: "SQL / TLS"
  - source: "Scheduling Service"
    destination: "PostgreSQL"
    description: "Reads and writes scheduling data"
    technology: "SQL / TLS"
  - source: "Scheduling Service"
    destination: "Redis"
    description: "Caches scheduling data"
    technology: "Redis Protocol"
  - source: "Integration Service"
    destination: "External Labs/Imaging"
    description: "Exchanges lab and imaging data"
    technology: "HL7 FHIR over mTLS"
  - source: "Integration Service"
    destination: "External Insurance Clearinghouses"
    description: "Performs real-time claim adjudication"
    technology: "HL7 FHIR over mTLS"
  - source: "EMR Service"
    destination: "HashiCorp Vault"
    description: "Fetches secrets"
    technology: "API / TLS"
  - source: "Billing & Claims Service"
    destination: "HashiCorp Vault"
    description: "Fetches secrets"
    technology: "API / TLS"
  - source: "Scheduling Service"
    destination: "HashiCorp Vault"
    description: "Fetches secrets"
    technology: "API / TLS"
  - source: "Notification Service"
    destination: "HashiCorp Vault"
    description: "Fetches secrets"
    technology: "API / TLS"
  - source: "Integration Service"
    destination: "HashiCorp Vault"
    description: "Fetches secrets"
    technology: "API / TLS"