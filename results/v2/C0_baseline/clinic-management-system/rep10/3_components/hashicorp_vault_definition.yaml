level: component
scope: "Component diagram for the HashiCorp Vault container"
parentContainer:
  name: "HashiCorp Vault"
elements:
  - type: "component"
    name: "Auth Method"
    technology: "Kubernetes JWT/AppRole & mTLS"
    description: "Handles authentication for users and services connecting to Vault."
  - type: "component"
    name: "HTTP API / Request Router"
    technology: "Vault HTTP API"
    description: "Routes incoming requests to the appropriate backend and engine."
  - type: "component"
    name: "Secrets Engine"
    technology: "Dynamic DB & KV"
    description: "Manages dynamic database credentials and key-value secrets storage."
  - type: "component"
    name: "Transit Secrets Engine"
    technology: "Vault Transit"
    description: "Provides encryption as a service for data protection."
  - type: "component"
    name: "Audit Device"
    technology: "Vault Audit"
    description: "Logs all requests and responses for security and compliance."
  - type: "component"
    name: "Built-in Raft Storage Backend"
    technology: "Raft Consensus Storage"
    description: "Provides highly available storage for Vault's data backend."
relationships:
  - source: "HTTP API / Request Router"
    destination: "Secrets Engine"
    description: "Forwards secret retrieval requests"
  - source: "HTTP API / Request Router"
    destination: "Transit Secrets Engine"
    description: "Forwards encryption and decryption requests"
  - source: "HTTP API / Request Router"
    destination: "Audit Device"
    description: "Streams interaction logs"
  - source: "Auth Method"
    destination: "HTTP API / Request Router"
    description: "Authenticates incoming requests"
  - source: "Secrets Engine"
    destination: "Built-in Raft Storage Backend"
    description: "Persists and retrieves secret data"