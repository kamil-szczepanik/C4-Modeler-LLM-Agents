level: component
scope: "Component diagram for the Redis container"
parentContainer:
  name: "Redis"
elements:
  - type: "component"
    name: "In-Memory Data Store Component"
    technology: "Redis Enterprise / OSS (Redis Protocol)"
    description: "Manages ephemeral caching for high-performance appointment booking and resource locks."
  - type: "component"
    name: "TLS Termination & Encryption Proxy Component"
    technology: "Redis Stunnel / Envoy sidecar"
    description: "Enforces mTLS and AES-256 encryption in transit."
relationships:
  - source: "Scheduling Service"
    destination: "In-Memory Data Store Component"
    description: "Checks and acquires resource locks [Redis Protocol over TLS, TCP 6379]"
  - source: "In-Memory Data Store Component"
    destination: "PostgreSQL Database"
    description: "Cache-aside fallback for persistent scheduling misses [SQL/TCP]"