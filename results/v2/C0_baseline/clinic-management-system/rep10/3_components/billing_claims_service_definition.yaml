level: component
scope: "Component diagram for the Billing & Claims Service container"
parentContainer:
  name: "Billing & Claims Service"
elements:
  - type: "component"
    name: "Claim Generation Component"
    technology: "Spring MVC / Domain Model"
    description: "Manages patient financial transactions and generates insurance claims."
  - type: "component"
    name: "Claim Tracking Component"
    technology: "Spring Data JPA"
    description: "Tracks insurance claim lifecycles and queries status updates."
  - type: "component"
    name: "Audit Trail Component"
    technology: "Spring AOP / JDBC with Transactional Outbox"
    description: "Writes immutable audit logs ensuring compliance and traceability."
  - type: "component"
    name: "Patient Payment Portal Component"
    technology: "Spring MVC / REST"
    description: "Handles patient payment transactions and statement reviews."
  - type: "component"
    name: "PostgreSQL Database"
    technology: "PostgreSQL (AES-256 encrypted at rest)"
    description: "Persists billing records, PHI, audit logs, and payment transactions."
  - type: "component"
    name: "RabbitMQ Message Broker"
    technology: "AMQP"
    description: "Publishes claim status update events and payment success events."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "AppRole authentication"
    description: "Fetches secrets and API keys securely."
  - type: "component"
    name: "Redis"
    technology: "RESP / TLS"
    description: "Validates idempotency keys for patient payment operations."
relationships:
  - source: "Claim Generation Component"
    destination: "PostgreSQL Database"
    description: "Persists billing records and PHI [JDBC / TLS]"
  - source: "Claim Tracking Component"
    destination: "RabbitMQ Message Broker"
    description: "Publishes claim status update events [AMQP]"
  - source: "Audit Trail Component"
    destination: "PostgreSQL Database"
    description: "Writes immutable audit logs via Transactional Outbox [JDBC / TLS]"
  - source: "Patient Payment Portal Component"
    destination: "PostgreSQL Database"
    description: "Reads statements and records payment transactions [JDBC / TLS]"
  - source: "Patient Payment Portal Component"
    destination: "RabbitMQ Message Broker"
    description: "Publishes payment success events [AMQP]"
  - source: "Patient Payment Portal Component"
    destination: "Redis"
    description: "Validates idempotency keys [RESP / TLS]"
  - source: "Billing & Claims Service"
    destination: "HashiCorp Vault"
    description: "Fetches secrets and API keys [API / TLS]"