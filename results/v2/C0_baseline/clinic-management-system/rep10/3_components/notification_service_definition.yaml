level: component
scope: "Component diagram for the Notification Service container"
parentContainer:
  name: "Notification Service"
elements:
  - type: "component"
    name: "API Router Component"
    technology: "FastAPI"
    description: "Routes notification requests via REST / JSON over HTTPS via mTLS."
  - type: "component"
    name: "Event Consumer Component"
    technology: "Python background worker"
    description: "Consumes asynchronous tasks from RabbitMQ."
  - type: "component"
    name: "Notification Orchestrator Component"
    technology: "Python core logic"
    description: "Orchestrates notification dispatch, preference checks, state management, and audit logging."
  - type: "component"
    name: "Preference Manager Component"
    technology: "Python module"
    description: "Queries communication flags via in-process calls."
  - type: "component"
    name: "Retry & State Store Component"
    technology: "Redis / PostgreSQL"
    description: "Manages persistent retries and DLQ with TCP / Redis Protocol with TLS and AES-256."
  - type: "component"
    name: "Channel Adapters Component"
    technology: "Twilio SDK / SendGrid SDK / Firebase Admin"
    description: "Abstracts dispatch and delivers SMS, Email, and Push via external providers."
relationships:
  - source: "API Router Component"
    destination: "Notification Orchestrator Component"
    description: "Triggers notification workflows [In-process call]"
  - source: "Event Consumer Component"
    destination: "Notification Orchestrator Component"
    description: "Dispatches consumed asynchronous tasks [In-process call]"
  - source: "Notification Orchestrator Component"
    destination: "Preference Manager Component"
    description: "Queries communication flags [In-process call]"
  - source: "Notification Orchestrator Component"
    destination: "Retry & State Store Component"
    description: "Manages persistent retries and DLQ [TCP / Redis Protocol with TLS and AES-256]"
  - source: "Notification Orchestrator Component"
    destination: "Channel Adapters Component"
    description: "Abstracts dispatch [In-process call]"
  - source: "Channel Adapters Component"
    destination: "External Providers (Twilio/SendGrid)"
    description: "Delivers SMS, Email, and Push [HTTPS / TLS 1.3]"
  - source: "Notification Orchestrator Component"
    destination: "WORM Storage"
    description: "Ships audit logs [HTTPS]"