level: component
scope: "Component diagram for the EMR Service container"
parentContainer:
  name: "EMR Service"
elements:
  - type: "component"
    name: "EMR API Controller"
    technology: "Go / Fiber"
    description: "Routes EMR requests and coordinates validations."
  - type: "component"
    name: "Clinical Workflow Engine"
    technology: "Go"
    description: "Handles validated clinical notes and orchestrates workflow processes."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "Go"
    description: "Generates immutable audit trails for compliance."
  - type: "component"
    name: "Data Access Repository"
    technology: "Go with pgx"
    description: "Interfaces with storage using the Transactional Outbox Pattern."
  - type: "component"
    name: "Patient Consent & Preference Manager"
    technology: "Go"
    description: "Evaluates consent policies and patient preferences."
  - type: "component"
    name: "FHIR Serialization Mapper"
    technology: "Go"
    description: "Transforms clinical models into FHIR format."
  - type: "component"
    name: "PostgreSQL"
    technology: "PostgreSQL (Encrypted with AES-256)"
    description: "Persists relational data securely."
  - type: "component"
    name: "RabbitMQ Message Broker"
    technology: "RabbitMQ"
    description: "Publishes and brokers FHIR clinical events."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Injects secrets and manages cryptographic keys."
relationships:
  - source: "API Gateway"
    destination: "EMR API Controller"
    description: "Routes EMR requests [mTLS / REST / JSON over HTTPS]"
  - source: "EMR API Controller"
    destination: "Patient Consent & Preference Manager"
    description: "Evaluates consent policies [Go interface]"
  - source: "EMR API Controller"
    destination: "Clinical Workflow Engine"
    description: "Handles validated clinical notes [In-process function calls]"
  - source: "Clinical Workflow Engine"
    destination: "Audit & Compliance Logger"
    description: "Generates immutable audit trails [Asynchronous event emission / Go channels]"
  - source: "Clinical Workflow Engine"
    destination: "Data Access Repository"
    description: "Interfaces with storage [SQL over TLS 1.3]"
  - source: "Clinical Workflow Engine"
    destination: "FHIR Serialization Mapper"
    description: "Transforms clinical models [In-process transformation]"
  - source: "FHIR Serialization Mapper"
    destination: "RabbitMQ Message Broker"
    description: "Publishes FHIR clinical events [AMQP over TLS 1.3]"
  - source: "Data Access Repository"
    destination: "PostgreSQL"
    description: "Persists data via Transactional Outbox Pattern [SQL / TLS 1.3]"
  - source: "Pods"
    destination: "HashiCorp Vault"
    description: "Injects secrets via Kubernetes CSI Secrets Store Provider [API / TLS]"