level: component
scope: "Component diagram for the Integration Service container"
parentContainer:
  name: "Integration Service"
elements:
  - type: "component"
    name: "FHIR Translation Engine"
    technology: "Java / Apache Camel, Resilience4j"
    description: "Performs HL7 FHIR transformation and integrates with external labs, imaging, and insurance clearinghouses using circuit breakers."
  - type: "component"
    name: "Integration Persistence Manager"
    technology: "Spring Data JPA"
    description: "Manages persistence with field-level envelope encryption."
  - type: "component"
    name: "Admin Integration API & Dashboard Controller"
    technology: "Spring MVC"
    description: "Provides administration interface with RBAC and data masking."
  - type: "component"
    name: "Retry & DLQ Worker"
    technology: "Spring Batch / RabbitMQ"
    description: "Handles automated backoff and dead-letter queues."
relationships:
  - source: "FHIR Translation Engine"
    destination: "Integration Persistence Manager"
    description: "Persists translated medical data and audit logs"
  - source: "FHIR Translation Engine"
    destination: "Retry & DLQ Worker"
    description: "Sends failed communication events for retry processing"
  - source: "Admin Integration API & Dashboard Controller"
    destination: "Integration Persistence Manager"
    description: "Queries integration logs and audit trails"