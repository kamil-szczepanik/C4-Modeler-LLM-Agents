level: component
scope: "Component diagram for the RabbitMQ container"
parentContainer:
  name: "RabbitMQ"
elements:
  - type: "component"
    name: "Exchange Router"
    technology: "RabbitMQ Exchange"
    description: "Routes published events from microservices to the appropriate downstream queues."
  - type: "component"
    name: "Quorum Queues"
    technology: "RabbitMQ Quorum Queue"
    description: "Provides reliable at-least-once messaging for asynchronous event-driven integration."
  - type: "component"
    name: "Dead Letter Exchange"
    technology: "RabbitMQ DLX"
    description: "Receives and forwards failed messages upon consumer rejection for audit and review."
relationships:
  - source: "Exchange Router"
    destination: "Quorum Queues"
    description: "Routes messages [AMQP]"
  - source: "Quorum Queues"
    destination: "Dead Letter Exchange"
    description: "Forwards failed messages on consumer rejection [AMQP]"