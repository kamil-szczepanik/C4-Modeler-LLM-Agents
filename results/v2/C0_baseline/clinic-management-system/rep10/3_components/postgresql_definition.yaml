level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "PostgreSQL Engine"
    technology: "PostgreSQL 15+ / Patroni / PgBouncer"
    description: "Core relational database handling current partition tables and transaction processing with high availability."
  - type: "component"
    name: "PostgreSQL Archive"
    technology: "PostgreSQL 15+ / Foreign Data Wrapper"
    description: "Stores historical data accessed via read-only foreign tables (FDW) to meet data retention mandates."
  - type: "component"
    name: "Security and Audit Extensions"
    technology: "pgaudit / pgcrypto / CloudNativePG"
    description: "Provides immutable audit trails, column-level encryption for HIPAA/GDPR compliance, and automated backups/PITR."
relationships:
  - source: "EMR Service"
    destination: "PostgreSQL Engine"
    description: "Reads/writes current partition tables via PgBouncer [SQL / mTLS]"
  - source: "EMR Service"
    destination: "PostgreSQL Archive"
    description: "Reads historical data via read-only foreign tables (FDW) [SQL / mTLS]"
  - source: "Billing & Claims Service"
    destination: "PostgreSQL Engine"
    description: "Reads and writes billing data via PgBouncer [SQL / mTLS]"
  - source: "Scheduling Service"
    destination: "PostgreSQL Engine"
    description: "Reads and writes scheduling data via PgBouncer [SQL / mTLS]"