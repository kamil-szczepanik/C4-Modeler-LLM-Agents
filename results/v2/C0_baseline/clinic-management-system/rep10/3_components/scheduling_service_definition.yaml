level: component
scope: "Component diagram for the Scheduling Service container"
parentContainer:
  name: "Scheduling Service"
elements:
  - type: "component"
    name: "API Controller"
    technology: "Go HTTP Server"
    description: "Handles incoming REST requests over HTTPS from the API Gateway."
  - type: "component"
    name: "Clash Service"
    technology: "Go Business Logic"
    description: "Executes sub-millisecond clash evaluation to prevent appointment race conditions and double-bookings."
  - type: "component"
    name: "Broker Client"
    technology: "Go AMQP Client"
    description: "Publishes audit and domain events asynchronously to RabbitMQ."
relationships:
  - source: "API Controller"
    destination: "Clash Service"
    description: "Delegates appointment booking and clash evaluation"
  - source: "Clash Service"
    destination: "Broker Client"
    description: "Triggers domain events upon scheduling actions"