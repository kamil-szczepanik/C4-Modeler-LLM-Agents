level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Ingress Router"
    technology: "Envoy Proxy"
    description: "Handles edge ingress and routes incoming client requests from the Web Application."
  - type: "component"
    name: "WAF Protection Module"
    technology: "Envoy Proxy WAF Module"
    description: "Provides security filtering and web application firewall protection for low latency and security."
  - type: "component"
    name: "Local JWT Validation Module"
    technology: "Envoy Proxy / HashiCorp Vault"
    description: "Validates local JWT tokens using public keys distributed by HashiCorp Vault."
relationships:
  - source: "Edge Ingress Router"
    destination: "WAF Protection Module"
    description: "Inspects requests"
  - source: "WAF Protection Module"
    destination: "Local JWT Validation Module"
    description: "Authenticates requests"