# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Web Application container"
parentContainer:
  name: "Web Application"
elements:
  # Components within the parent container's boundary
  - type: "component"
    name: "Persona-based UI Composition Engine"
    technology: "React / TypeScript SPA"
    description: "Renders high-performance dynamic interfaces for patients, clinicians, staff, billing officers, and auditors."
  - type: "component"
    name: "EMR Rendering Module"
    technology: "React / TypeScript SPA"
    description: "Handles high-performance EMR rendering ensuring sub-second P95 load times."
  - type: "component"
    name: "Session and Auth Handler"
    technology: "TypeScript"
    description: "Manages secure session handling using HttpOnly, SameSite=Strict cookies without client-side token exposure."
relationships:
  - source: "Persona-based UI Composition Engine"
    destination: "Session and Auth Handler"
    description: "Uses for authentication state and secure session management"
  - source: "EMR Rendering Module"
    destination: "Persona-based UI Composition Engine"
    description: "Feeds rendered clinical workflows into the main UI"