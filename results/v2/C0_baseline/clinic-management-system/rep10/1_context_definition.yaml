level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed for medium-sized hospitals and clinics to manage patient admissions, electronic medical records (EMR), scheduling, and billing with 99.99% high availability and strict HIPAA/GDPR compliance."
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care, managing appointments, and viewing their medical records."
  - type: "person"
    name: "Clinicians/Doctors"
    description: "Medical professionals responsible for patient diagnosis, treatment, and electronic medical records (EMR)."
  - type: "person"
    name: "Administrative Staff"
    description: "Staff members handling patient admissions and scheduling."
  - type: "person"
    name: "Billing Officers"
    description: "Personnel managing patient billing and insurance claims."
  - type: "person"
    name: "Compliance Officers/Auditors"
    description: "Personnel ensuring regulatory compliance and reviewing immutable audit logs."
  - type: "externalSystem"
    name: "External Insurance/Clearinghouse System"
    description: "External system used for real-time claim adjudication."
  - type: "externalSystem"
    name: "External Laboratory & Imaging System"
    description: "External systems providing lab results and medical imaging data."
relationships:
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Accesses medical records and scheduling"
    technology: "HTTPS/TLS 1.3 with OAuth 2.0/OIDC step-up MFA"
  - source: "Clinicians/Doctors"
    destination: "Clinic Management System"
    description: "Manages EMR, patient admissions, and scheduling"
    technology: "HTTPS/TLS 1.3 with OAuth 2.0/OIDC step-up MFA and RBAC/ABAC"
  - source: "Administrative Staff"
    destination: "Clinic Management System"
    description: "Manages patient admissions and scheduling"
    technology: "HTTPS/TLS 1.3 with OAuth 2.0/OIDC step-up MFA and RBAC/ABAC"
  - source: "Billing Officers"
    destination: "Clinic Management System"
    description: "Handles financial operations and billing"
    technology: "HTTPS/TLS 1.3 with OAuth 2.0/OIDC step-up MFA and RBAC/ABAC"
  - source: "Compliance Officers/Auditors"
    destination: "Clinic Management System"
    description: "Reviews audit logs and ensures compliance"
    technology: "HTTPS/TLS 1.3 with OAuth 2.0/OIDC step-up MFA and RBAC/ABAC"
  - source: "Clinic Management System"
    destination: "External Insurance/Clearinghouse System"
    description: "Real-time claim adjudication"
    technology: "HTTPS / REST (HL7 FHIR)"
  - source: "Clinic Management System"
    destination: "External Laboratory & Imaging System"
    description: "Exchanges lab and imaging data"
    technology: "HL7 FHIR over mutual TLS (mTLS)"