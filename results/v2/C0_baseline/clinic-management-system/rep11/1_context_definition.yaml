level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "Core software system that manages patient admissions, EMRs, scheduling, and billing for medium-sized clinics in a hybrid cloud environment."
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care at the clinic who interact with the system for scheduling and admissions."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals who manage patient EMRs and clinical workflows."
  - type: "person"
    name: "Receptionists"
    description: "Front-desk staff who handle patient scheduling and intake."
  - type: "person"
    name: "Billing Specialists"
    description: "Administrative staff responsible for processing payments and managing billing."
  - type: "person"
    name: "Hospital Administrators"
    description: "Management personnel overseeing clinic operations and reporting."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "Third-party systems providing laboratory results and medical imaging data."
  - type: "externalSystem"
    name: "Payment Gateway / Insurance Clearinghouse"
    description: "External financial services processing payments and insurance claims."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External or integrated identity service providing authentication and MFA."
relationships:
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Accesses scheduling and admissions"
    technology: "HTTPS (TLS 1.3)"
  - source: "Clinicians"
    destination: "Clinic Management System"
    description: "Manages patient EMRs and clinic workflows"
    technology: "HTTPS (TLS 1.3)"
  - source: "Receptionists"
    destination: "Clinic Management System"
    description: "Handles patient scheduling and intake"
    technology: "HTTPS (TLS 1.3)"
  - source: "Billing Specialists"
    destination: "Clinic Management System"
    description: "Manages billing and financial records"
    technology: "HTTPS (TLS 1.3)"
  - source: "Hospital Administrators"
    destination: "Clinic Management System"
    description: "Oversees clinic operations and reporting"
    technology: "HTTPS (TLS 1.3)"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges lab and imaging data"
    technology: "HL7 FHIR REST APIs over mTLS"
  - source: "Clinic Management System"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Processes payments and insurance claims"
    technology: "HTTPS / TLS 1.3"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users and validates tokens"
    technology: "OIDC / OAuth 2.0 with MFA"