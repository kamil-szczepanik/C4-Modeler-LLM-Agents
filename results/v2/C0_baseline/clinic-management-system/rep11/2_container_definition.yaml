level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care at the clinic who interact with the system for scheduling and admissions."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals who manage patient EMRs and clinical workflows."
  - type: "person"
    name: "Receptionists"
    description: "Front-desk staff who handle patient scheduling and intake."
  - type: "person"
    name: "Billing Specialists"
    description: "Administrative staff responsible for processing payments and managing billing."
  - type: "person"
    name: "Hospital Administrators"
    description: "Management personnel overseeing clinic operations and reporting."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "Third-party systems providing laboratory results and medical imaging data."
  - type: "externalSystem"
    name: "Payment Gateway / Insurance Clearinghouse"
    description: "External financial services processing payments and insurance claims."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External or integrated identity service providing authentication and MFA."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx / Envoy"
    description: "Handles TLS termination, routing, and OAuth2 validation."
  - type: "container"
    name: "Patient Web/Mobile App"
    technology: "React / Flutter"
    description: "Client application for patients to manage scheduling and admissions."
  - type: "container"
    name: "Clinical Workstation App"
    technology: "Angular / Electron"
    description: "Client application for clinicians, receptionists, and administrators."
  - type: "container"
    name: "Core Services Container"
    technology: "Java / Spring Boot"
    description: "Manages core clinical workflows, patient admissions, EMRs, and billing."
  - type: "container"
    name: "Integration Service"
    technology: "Node.js / Apache Camel"
    description: "Handles integration and HL7 FHIR communication with external health systems."
  - type: "container"
    name: "Notification Container"
    technology: "Python / Celery"
    description: "Manages asynchronous notification workflows and event consumption."
  - type: "container"
    name: "Reporting & Analytics Container"
    technology: "Analytics Platform"
    description: "Processes OLAP data for clinic reporting and analytics."
  - type: "container"
    name: "PostgreSQL"
    technology: "PostgreSQL (OLTP with AES-256)"
    description: "Primary relational database for transactional operational data."
  - type: "container"
    name: "ClickHouse"
    technology: "ClickHouse (OLAP)"
    description: "Analytical database for reporting and analytics."
  - type: "container"
    name: "Redis"
    technology: "Redis"
    description: "In-memory data store used for scheduling locks and caching."
  - type: "container"
    name: "Apache Kafka"
    technology: "Apache Kafka"
    description: "Message broker for asynchronous event-driven microservices decoupling."
relationships:
  - source: "Patients"
    destination: "Patient Web/Mobile App"
    description: "Interacts with scheduling, admissions, and EMR features"
    technology: "HTTPS/JSON"
  - source: "Clinicians"
    destination: "Clinical Workstation App"
    description: "Manages patient EMRs and clinical workflows"
    technology: "HTTPS/JSON"
  - source: "Receptionists"
    destination: "Clinical Workstation App"
    description: "Handles patient scheduling and intake"
    technology: "HTTPS/JSON"
  - source: "Billing Specialists"
    destination: "Clinical Workstation App"
    description: "Manages billing and financial records"
    technology: "HTTPS/JSON"
  - source: "Hospital Administrators"
    destination: "Clinical Workstation App"
    description: "Oversees clinic operations and reporting"
    technology: "HTTPS/JSON"
  - source: "Patient Web/Mobile App"
    destination: "API Gateway"
    description: "Sends client requests"
    technology: "HTTPS/JSON and gRPC"
  - source: "Clinical Workstation App"
    destination: "API Gateway"
    description: "Sends client requests"
    technology: "HTTPS/JSON and gRPC"
  - source: "API Gateway"
    destination: "Core Services Container"
    description: "Routes authenticated requests"
    technology: "mTLS via Istio service mesh"
  - source: "Core Services Container"
    destination: "PostgreSQL"
    description: "Reads and writes transactional data"
    technology: "JDBC / SQL"
  - source: "Core Services Container"
    destination: "Redis"
    description: "Manages scheduling locks and caching"
    technology: "Redis Protocol"
  - source: "Core Services Container"
    destination: "Apache Kafka"
    description: "Publishes asynchronous domain events"
    technology: "Kafka Protocol"
  - source: "Integration Service"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical data"
    technology: "HL7 FHIR APIs over HTTPS"
  - source: "Integration Service"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Processes insurance claims and payments"
    technology: "HTTPS"
  - source: "Notification Container"
    destination: "Apache Kafka"
    description: "Consumes asynchronous notification events"
    technology: "Kafka Protocol"
  - source: "Reporting & Analytics Container"
    destination: "Apache Kafka"
    description: "Consumes analytics events"
    technology: "Kafka Protocol"
  - source: "Reporting & Analytics Container"
    destination: "ClickHouse"
    description: "Queries and stores analytics data"
    technology: "TCP / SQL"
  - source: "API Gateway"
    destination: "Identity Provider (IdP)"
    description: "Validates OAuth2 tokens and authentication"
    technology: "OIDC / OAuth2"