level: component
scope: "Component diagram for the Integration Service container"
parentContainer:
  name: "Integration Service"
elements:
  - type: "component"
    name: "FHIR Ingress/Egress"
    technology: "Node.js / Apache Camel"
    description: "Exchanges clinical data using HL7 FHIR APIs over HTTPS with mTLS."
  - type: "component"
    name: "Claims Translation"
    technology: "Node.js / Apache Camel"
    description: "Submits insurance claims and processes payments via HTTPS with OAuth 2.0."
  - type: "component"
    name: "Dead Letter & Audit Publisher"
    technology: "Node.js / Apache Camel"
    description: "Publishes asynchronous domain events, audit logs, and alerts using JSON to Apache Kafka."
  - type: "component"
    name: "Retry & Backoff Orchestrator"
    technology: "Node.js / Apache Camel"
    description: "Persists retry states and durable transactional data using AES-256 encryption to PostgreSQL."
relationships:
  - source: "FHIR Ingress/Egress"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical data using HL7 FHIR APIs over HTTPS with mTLS"
  - source: "Claims Translation"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Submits insurance claims and processes payments via HTTPS with OAuth 2.0"
  - source: "Dead Letter & Audit Publisher"
    destination: "Apache Kafka"
    description: "Publishes asynchronous domain events, audit logs, and alerts using JSON"
  - source: "Retry & Backoff Orchestrator"
    destination: "PostgreSQL"
    description: "Persists retry states and durable transactional data using AES-256 encryption"