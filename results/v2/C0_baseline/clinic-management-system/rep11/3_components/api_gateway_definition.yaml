# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Router & TLS Terminator"
    technology: "Envoy Proxy"
    description: "Edge container handling TLS termination and routing."
  - type: "component"
    name: "Auth & Token Introspection Filter"
    technology: "Envoy Proxy Plugin"
    description: "Validates opaque tokens and performs OAuth2 validation."
  - type: "component"
    name: "Rate Limiting & Throttling Engine"
    technology: "Envoy with Redis"
    description: "Handles distributed rate-limiting and session state caching."
  - type: "component"
    name: "API Schema Validation & Sanitization Filter"
    technology: "Envoy WebAssembly (Wasm)/Lua"
    description: "Performs high-performance routing and lightweight schema validation."
relationships:
  - source: "Auth & Token Introspection Filter"
    destination: "Identity Provider (IdP)"
    description: "Validates opaque tokens [HTTPS/OIDC]"
  - source: "Edge Router & TLS Terminator"
    destination: "Core Services Container"
    description: "Forwards validated requests [gRPC/mTLS via Istio]"
  - source: "Edge Router & TLS Terminator"
    destination: "Integration Service"
    description: "Routes FHIR requests [gRPC/mTLS]"