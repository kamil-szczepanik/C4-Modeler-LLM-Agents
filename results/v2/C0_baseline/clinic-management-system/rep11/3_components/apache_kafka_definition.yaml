level: component
scope: "Component diagram for the Apache Kafka container"
parentContainer:
  name: "Apache Kafka"
elements:
  - type: "component"
    name: "Kafka Broker Cluster"
    technology: "Java/Scala"
    description: "Manages asynchronous event-driven microservices decoupling with acks=all and MirrorMaker 2."
  - type: "component"
    name: "Schema Registry"
    technology: "Java/Confluent"
    description: "Validates event schemas prior to publishing."
  - type: "component"
    name: "Kafka Connect"
    technology: "Java"
    description: "Streams raw events to persistent sinks and offloads sanitized historical data."
relationships:
  - source: "Schema Registry"
    destination: "Kafka Broker Cluster"
    description: "Provides schema validation for events [HTTP/REST over TLS 1.3]"
  - source: "Kafka Broker Cluster"
    destination: "Kafka Connect"
    description: "Streams raw events to persistent sinks [Kafka Protocol]"