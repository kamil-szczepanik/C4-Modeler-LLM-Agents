level: component
scope: "Component diagram for the Clinical Workstation App container"
parentContainer:
  name: "Clinical Workstation App"
elements:
  - type: "component"
    name: "Workspace Shell Component"
    technology: "Angular / Electron"
    description: "Provides the desktop application frame and dynamic UI composition."
  - type: "component"
    name: "EMR & Scheduling Module Components"
    technology: "Angular"
    description: "Handles patient records, scheduling, and billing workflows."
  - type: "component"
    name: "Local Persistence Store"
    technology: "IndexedDB / SQLite"
    description: "Provides local persistence for offline resilience and EMR caching."
  - type: "component"
    name: "Sync Engine Component"
    technology: "Electron IPC / TypeScript"
    description: "Manages offline queue, state, and synchronization with the cloud backend."
  - type: "component"
    name: "Conflict Resolution Manager Component"
    technology: "TypeScript"
    description: "Resolves synchronization conflicts during data reconciliation."
  - type: "component"
    name: "IPC Security Bridge Component"
    technology: "Electron IPC"
    description: "Secures inter-process communication between the UI and local store."
relationships:
  - source: "Sync Engine Component"
    destination: "Local Persistence Store"
    description: "Manages offline queue and state via [SQLite/IndexedDB IPC]"
  - source: "Clinical Workstation App"
    destination: "API Gateway"
    description: "Sends requests and syncs data via [gRPC-Web / HTTPS]"