level: component
scope: "Component diagram for the Notification Container container"
parentContainer:
  name: "Notification Container"
elements:
  - type: "component"
    name: "Event Consumer"
    technology: "Python / Celery"
    description: "Consumes asynchronous events from Apache Kafka."
  - type: "component"
    name: "Template Sanitizer"
    technology: "Python"
    description: "Sanitizes message templates for notification generation."
  - type: "component"
    name: "Dispatch Engine"
    technology: "Python"
    description: "Manages the dispatch of notifications to various channel adapters."
  - type: "component"
    name: "Channel Adapters"
    technology: "Python / Twilio / SendGrid / Firebase"
    description: "Adapters for delivering messages via SMS, Email, and Push."
  - type: "component"
    name: "Delivery Status Webhook Receiver"
    technology: "Python"
    description: "Receives status callbacks from channel adapters."
  - type: "component"
    name: "Event Producer"
    technology: "Python / Celery"
    description: "Publishes anonymized telemetry and events."
relationships:
  - source: "Notification Container"
    destination: "Apache Kafka"
    description: "Consumes async events and publishes anonymized telemetry [Kafka Protocol with mTLS / SASL/SCRAM]"
  - source: "Dispatch Engine"
    destination: "Channel Adapters"
    description: "Message delivery [HTTPS]"
  - source: "Channel Adapters"
    destination: "Delivery Status Webhook Receiver"
    description: "Status callbacks [HTTPS]"