level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "PostgreSQL Primary Instance"
    technology: "PostgreSQL 16 on Kubernetes"
    description: "Handles core transactional queries and operational data integrity."
  - type: "component"
    name: "PostgreSQL Standby Instances"
    technology: "Streaming Replication, Patroni on Kubernetes"
    description: "Provides high availability and synchronous data replication for zero data loss."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Optimizes throughput and routes transactional queries to maintain low latency."
  - type: "component"
    name: "Audit Extension Module"
    technology: "pg_audit"
    description: "Implements tamper-proof audit trails to satisfy security mandates."
  - type: "component"
    name: "Encryption Manager"
    technology: "pgcrypto / Transparent Data Encryption"
    description: "Provides AES-256 encryption at rest."
  - type: "component"
    name: "Data Masking & Purging Component"
    technology: "PostgreSQL RLS & PL/pgSQL functions"
    description: "Executes GDPR compliance queries and manages data retention."
  - type: "component"
    name: "Archiving Service"
    technology: "pgBackRest with cold object storage"
    description: "Manages continuous WAL archiving and automated backups for the 10-year retention policy."
relationships:
  - source: "Connection Pooler"
    destination: "PostgreSQL Primary Instance"
    description: "Forwards operational queries [TCP]"
  - source: "PostgreSQL Primary Instance"
    destination: "PostgreSQL Standby Instances"
    description: "Synchronous data replication [TCP]"
  - source: "PostgreSQL Primary Instance"
    destination: "Archiving Service"
    description: "Continuous WAL archiving [TCP / Object Storage API]"