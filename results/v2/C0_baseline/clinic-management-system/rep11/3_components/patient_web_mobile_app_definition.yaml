level: component
scope: "Component diagram for the Patient Web/Mobile App container"
parentContainer:
  name: "Patient Web/Mobile App"
elements:
  - type: "component"
    name: "Auth Client Module"
    technology: "OAuth2/OIDC, Biometrics, Platform-Native Secure Enclaves / Keychain, Play Integrity / App Attest"
    description: "Handles OAuth2/OIDC token exchange, multi-factor authentication, biometrics, and device integrity checks."
  - type: "component"
    name: "Scheduling & Intake UI"
    technology: "React / Flutter, WCAG 2.1 AA"
    description: "Manages client-side state for patient registration and appointment booking under WCAG 2.1 AA standards."
  - type: "component"
    name: "API Client Layer"
    technology: "HTTPS/JSON and gRPC, TLS 1.3, Encrypted Local Storage"
    description: "Manages secure communication with certificate pinning and encrypted local storage."
  - type: "component"
    name: "Push Notification Handler"
    technology: "APNs / FCM"
    description: "Manages device registration tokens and receives push payloads (APNs/FCM)."
  - type: "system"
    name: "Identity Provider"
    technology: "OIDC"
    description: "External identity provider for user authentication and session management."
  - type: "container"
    name: "Notification Container"
    technology: "APNs / FCM"
    description: "Sends push alerts and notifications."
  - type: "container"
    name: "API Gateway"
    technology: "HTTPS/JSON and gRPC"
    description: "Proxies business requests from the client layer."
relationships:
  - source: "Auth Client Module"
    destination: "Identity Provider"
    description: "Authenticates users and manages sessions via [HTTPS/OIDC]."
  - source: "Push Notification Handler"
    destination: "Notification Container"
    description: "Receives push alerts via [APNs/FCM]."
  - source: "Scheduling & Intake UI"
    destination: "API Client Layer"
    description: "Sends domain actions locally."
  - source: "API Client Layer"
    destination: "API Gateway"
    description: "Proxies business requests via [HTTPS/JSON and gRPC] with TLS 1.3."