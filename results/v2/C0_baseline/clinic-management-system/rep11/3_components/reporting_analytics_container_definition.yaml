level: component
scope: "Component diagram for the Reporting & Analytics Container container"
parentContainer:
  name: "Reporting & Analytics Container"
elements:
  - type: "component"
    name: "Report Query Engine"
    technology: "Apache Superset / Python"
    description: "Powers real-time operational dashboards and the ad-hoc query semantic layer."
  - type: "component"
    name: "Batch ETL Worker"
    technology: "Apache Spark / Python"
    description: "Handles heavy, scheduled historical aggregation jobs for long-term trends."
  - type: "component"
    name: "Data Anonymization & Governance Proxy"
    technology: "Python"
    description: "Enforces secure, HIPAA/GDPR-compliant data filtering and masking."
  - type: "component"
    name: "Ad-Hoc Query Planner"
    technology: "Python"
    description: "Plans and optimizes ad-hoc analytical queries."
  - type: "component"
    name: "ClickHouse OLAP Database"
    technology: "ClickHouse"
    description: "Stores high-volume OLAP data for fast analytics queries."
  - type: "component"
    name: "Apache Kafka"
    technology: "Apache Kafka"
    description: "Streaming platform for ingestion and event processing."
  - type: "component"
    name: "Redis"
    technology: "Redis"
    description: "Caches policy-filtered query payloads securely with AES-256 encryption."
  - type: "component"
    name: "Hospital Administrators & Billing Specialists"
    technology: "Human User"
    description: "Users who access reports and operational dashboards."
relationships:
  - source: "Hospital Administrators & Billing Specialists"
    destination: "Report Query Engine"
    description: "Accesses reports and dashboards via [HTTPS]"
  - source: "Report Query Engine"
    destination: "Data Anonymization & Governance Proxy"
    description: "Routes queries through governance proxy via [gRPC]"
  - source: "Report Query Engine"
    destination: "ClickHouse OLAP Database"
    description: "Queries data via [TCP / SQL]"
  - source: "Batch ETL Worker"
    destination: "Apache Kafka"
    description: "Consumes data via [Kafka Protocol]"