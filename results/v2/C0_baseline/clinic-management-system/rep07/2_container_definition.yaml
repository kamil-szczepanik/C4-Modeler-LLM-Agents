level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patient"
    description: "Uses the system for self-service scheduling and billing."
  - type: "person"
    name: "Clinician"
    description: "Manages patient admissions and electronic medical records."
  - type: "person"
    name: "Receptionist/Admin"
    description: "Manages scheduling, admissions, and administrative tasks."
  - type: "person"
    name: "Billing Specialist"
    description: "Manages claims, payments, and billing processes."
  - type: "person"
    name: "Compliance Auditor"
    description: "Monitors strict HIPAA/GDPR compliance and system security."
  - type: "externalSystem"
    name: "Patient Portal App"
    description: "Client application for patient self-service scheduling and billing."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Handles authentication, MFA, and SSO using OIDC/SAML 2.0."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External medical systems interacting via HL7 FHIR over mTLS."
  - type: "externalSystem"
    name: "Payment Gateway / Insurance Clearinghouse"
    description: "Processes payments and insurance claims asynchronously."
  - type: "container"
    name: "API Gateway"
    technology: "NGINX / Kong, HTTPS/REST/gRPC"
    description: "Handles rate limiting, JWT validation, TLS termination, and canary deployments."
  - type: "container"
    name: "EMR Service"
    technology: "Node.js / Go, HTTPS/gRPC"
    description: "Manages electronic medical records with sub-second response times."
  - type: "container"
    name: "Appointment Service"
    technology: "Node.js / Go, HTTPS/gRPC"
    description: "Manages clinic scheduling and patient admissions."
  - type: "container"
    name: "Billing Container"
    technology: "Node.js / Go / TLS 1.3"
    description: "Handles billing, payments, and insurance integration."
  - type: "container"
    name: "Audit & Compliance Container"
    technology: "Node.js / Go, Apache Kafka"
    description: "Monitors and logs activity for strict HIPAA/GDPR compliance."
  - type: "container"
    name: "HL7 FHIR Interoperability Service"
    technology: "Python / FastAPI, HL7 FHIR APIs"
    description: "Connects to external lab and imaging systems using HL7 FHIR."
  - type: "container"
    name: "PostgreSQL"
    technology: "PostgreSQL with Redis caching and AES-256 envelope encryption"
    description: "Primary database for persisting core clinic and patient data."
  - type: "container"
    name: "Apache Kafka"
    technology: "Apache Kafka"
    description: "Asynchronous event streaming bus for decoupling services."
relationships:
  - source: "Patient"
    destination: "API Gateway"
    description: "Interacts for scheduling and billing"
    technology: "HTTPS / REST / gRPC"
  - source: "Clinician"
    destination: "API Gateway"
    description: "Accesses EMR and appointments"
    technology: "HTTPS / REST / gRPC"
  - source: "Receptionist/Admin"
    destination: "API Gateway"
    description: "Manages administrative tasks and admissions"
    technology: "HTTPS / REST / gRPC"
  - source: "Billing Specialist"
    destination: "API Gateway"
    description: "Manages billing and claims"
    technology: "HTTPS / REST / gRPC"
  - source: "Compliance Auditor"
    destination: "API Gateway"
    description: "Audits system access and logs"
    technology: "HTTPS / REST / gRPC"
  - source: "Patient Portal App"
    destination: "API Gateway"
    description: "Integrates via API"
    technology: "HTTPS / REST / gRPC"
  - source: "API Gateway"
    destination: "EMR Service"
    description: "Routes requests to EMR Service"
    technology: "HTTPS / gRPC with mTLS"
  - source: "API Gateway"
    destination: "Appointment Service"
    description: "Routes requests to Appointment Service"
    technology: "HTTPS / gRPC with mTLS"
  - source: "API Gateway"
    destination: "Billing Container"
    description: "Routes billing requests"
    technology: "HTTPS / gRPC with mTLS"
  - source: "EMR Service"
    destination: "PostgreSQL"
    description: "Reads and writes patient records"
    technology: "PostgreSQL with Redis caching"
  - source: "Appointment Service"
    destination: "PostgreSQL"
    description: "Reads and writes appointment data"
    technology: "PostgreSQL"
  - source: "EMR Service"
    destination: "Apache Kafka"
    description: "Publishes EMR events asynchronously"
    technology: "Apache Kafka"
  - source: "Apache Kafka"
    destination: "Audit & Compliance Container"
    description: "Streams events for auditing"
    technology: "Apache Kafka"
  - source: "Apache Kafka"
    destination: "HL7 FHIR Interoperability Service"
    description: "Streams data for interoperability"
    technology: "Apache Kafka"
  - source: "HL7 FHIR Interoperability Service"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical data"
    technology: "HL7 FHIR APIs over mTLS"
  - source: "Billing Container"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Processes payments and insurance claims"
    technology: "TLS 1.3"