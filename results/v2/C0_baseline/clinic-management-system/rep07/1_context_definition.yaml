level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid-cloud platform designed for medium-sized hospitals and clinics to manage patient admissions, electronic medical records, scheduling, and billing while ensuring high availability and compliance."
elements:
  - type: "person"
    name: "Patient"
    description: "Uses the system for self-service scheduling and billing."
  - type: "person"
    name: "Clinician/Doctor"
    description: "Manages patient admissions and electronic medical records."
  - type: "person"
    name: "Receptionist/Admin"
    description: "Manages scheduling, admissions, and administrative tasks."
  - type: "person"
    name: "Billing Specialist"
    description: "Manages claims, payments, and billing processes."
  - type: "person"
    name: "Compliance/IT Auditor"
    description: "Monitors strict HIPAA/GDPR compliance and system security."
  - type: "externalSystem"
    name: "Patient Portal App"
    description: "Client application for patient self-service scheduling and billing."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Handles authentication, MFA, and SSO using OIDC/SAML 2.0."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External medical systems interacting via HL7 FHIR over mTLS."
  - type: "externalSystem"
    name: "Payment Gateway / Insurance Clearinghouse"
    description: "Processes payments and insurance claims asynchronously."
relationships:
  - source: "Patient"
    destination: "Clinic Management System"
    description: "Interacts via Web/Mobile UI"
    technology: "HTTPS / TLS 1.3"
  - source: "Clinician/Doctor"
    destination: "Clinic Management System"
    description: "Interacts via Web/Mobile UI"
    technology: "HTTPS / TLS 1.3"
  - source: "Receptionist/Admin"
    destination: "Clinic Management System"
    description: "Interacts via Web/Mobile UI"
    technology: "HTTPS / TLS 1.3"
  - source: "Billing Specialist"
    destination: "Clinic Management System"
    description: "Interacts via Web/Mobile UI"
    technology: "HTTPS / TLS 1.3"
  - source: "Compliance/IT Auditor"
    destination: "Clinic Management System"
    description: "Interacts via Web/Mobile UI"
    technology: "HTTPS / TLS 1.3"
  - source: "Patient Portal App"
    destination: "Clinic Management System"
    description: "Requests self-service scheduling and billing"
    technology: "HTTPS REST/GraphQL"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Performs authentication, MFA, and SSO"
    technology: "OIDC / SAML 2.0 with OAuth2"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical data"
    technology: "HL7 FHIR over mTLS"
  - source: "External Lab & Imaging Systems"
    destination: "Clinic Management System"
    description: "Exchanges clinical data"
    technology: "HL7 FHIR over mTLS"
  - source: "Clinic Management System"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Processes claims and billing asynchronously"
    technology: "Asynchronous REST APIs via Kafka/RabbitMQ"