level: component
scope: "Component diagram for the EMR Service container"
parentContainer:
  name: "EMR Service"
elements:
  - type: "component"
    name: "EMR API Controller"
    technology: "Go"
    description: "Handles incoming API requests for the EMR service."
  - type: "component"
    name: "Access Policy Enforcer"
    technology: "Go"
    description: "Evaluates ABAC rules in-process for request authorization."
  - type: "component"
    name: "Clinical Record Manager"
    technology: "Go"
    description: "Manages clinical record business logic and data processing."
  - type: "component"
    name: "Audit Trail Interceptor"
    technology: "Go"
    description: "Intercepts requests and actions to generate audit trails for compliance."
  - type: "component"
    name: "Data Access Layer"
    technology: "Go"
    description: "Executes SQL and Redis queries for data persistence and caching."
  - type: "component"
    name: "Local Emergency Cache"
    technology: "Redis / In-Memory"
    description: "Provides fast local caching for emergency access to EMR records."
relationships:
  - source: "EMR API Controller"
    destination: "Access Policy Enforcer"
    description: "Evaluates ABAC rules in-process"
  - source: "Access Policy Enforcer"
    destination: "Clinical Record Manager"
    description: "Forwards validated requests in-process"
  - source: "Clinical Record Manager"
    destination: "Data Access Layer"
    description: "Executes SQL / Redis queries"