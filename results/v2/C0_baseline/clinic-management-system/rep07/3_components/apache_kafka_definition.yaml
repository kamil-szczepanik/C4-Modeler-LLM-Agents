level: component
scope: "Component diagram for the Apache Kafka container"
parentContainer:
  name: "Apache Kafka"
elements:
  - type: "component"
    name: "Kafka Brokers"
    technology: "Apache Kafka"
    description: "Handles event streaming and message transport across microservices."
  - type: "component"
    name: "KRaft Quorum"
    technology: "Apache Kafka KRaft"
    description: "Manages metadata and consensus without relying on ZooKeeper."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry"
    description: "Enforces data governance using Avro and Protobuf schemas."
  - type: "component"
    name: "Kafka Connect Sink"
    technology: "Kafka Connect"
    description: "Streams encrypted data from Kafka to S3/MinIO Object Storage via HTTPS."
relationships:
  - source: "Kafka Brokers"
    destination: "Schema Registry"
    description: "Streams data to and validates against"
  - source: "Kafka Brokers"
    destination: "Kafka Connect Sink"
    description: "Sends event data to"