level: component
scope: "Component diagram for the Billing Container container"
parentContainer:
  name: "Billing Container"
elements:
  - type: "component"
    name: "Billing Specialist"
    technology: "User Persona"
    description: "User persona initiating claim submissions and managing financial records."
  - type: "component"
    name: "Billing API Controller"
    technology: "Node.js/Go"
    description: "Node.js/Go component handling incoming REST/gRPC requests via mTLS."
  - type: "component"
    name: "Claim Validation Engine"
    technology: "Node.js/Go"
    description: "Node.js/Go component executing real-time business rule validation against cached schemas."
  - type: "component"
    name: "Payment & Claims Service"
    technology: "Node.js/Go"
    description: "Node.js/Go component managing secure outbound integrations."
  - type: "component"
    name: "Remittance Ingestion Worker"
    technology: "Node.js/Go"
    description: "Node.js/Go background worker processing asynchronous ERA/835 payloads."
  - type: "component"
    name: "Billing Data Access Layer"
    technology: "Node.js/Go"
    description: "Node.js/Go component interacting with PostgreSQL and Redis."
  - type: "component"
    name: "Apache Kafka"
    technology: "Event Broker"
    description: "Event broker utilized for the Outbox Pattern and Dead Letter Queue (DLQ)."
  - type: "component"
    name: "External Payment Gateway / Insurance Clearinghouse"
    technology: "External System"
    description: "External system handling financial transactions and claims."
relationships:
  - source: "API Gateway"
    destination: "Billing API Controller"
    description: "Routes billing requests [HTTPS / gRPC with mTLS]"
  - source: "Billing API Controller"
    destination: "Claim Validation Engine"
    description: "Internal function call"
  - source: "Claim Validation Engine"
    destination: "Payment & Claims Service"
    description: "Validated claim payload [Internal via Apache Kafka]"
  - source: "Payment & Claims Service"
    destination: "External Payment Gateway / Insurance Clearinghouse"
    description: "Submits claims and processes payments [TLS 1.3 with mTLS]"
  - source: "External Payment Gateway / Insurance Clearinghouse"
    destination: "Remittance Ingestion Worker"
    description: "Delivers ERA/835 payloads [HTTPS / SFTP over TLS 1.3]"
  - source: "Remittance Ingestion Worker"
    destination: "Billing Data Access Layer"
    description: "Reconciles and updates patient ledger [SQL over TLS]"