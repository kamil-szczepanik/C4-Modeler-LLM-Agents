level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "TLS Termination & Edge Firewall"
    technology: "NGINX / Kong"
    description: "Handles edge routing, TLS 1.3 termination, and edge firewall protection."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "NGINX / Kong Plugin"
    description: "Enforces zero-trust JWT/OAuth2 scopes and validates identity."
  - type: "component"
    name: "Rate Limiting & Traffic Shaping Engine"
    technology: "NGINX / Kong"
    description: "Protects backend services by limiting request rates and shaping traffic."
  - type: "component"
    name: "Reverse Proxy & Load Balancer"
    technology: "NGINX / Kong"
    description: "Routes validated requests to backend services securely."
  - type: "component"
    name: "Telemetry & Audit Interceptor"
    technology: "NGINX / Kong"
    description: "Captures access logs and forwards telemetry data asynchronously."
  - type: "component"
    name: "API Version Router"
    technology: "NGINX / Kong"
    description: "Directs incoming requests to the correct API version endpoints."
  - type: "component"
    name: "Tenant Resolution Filter"
    technology: "NGINX / Kong"
    description: "Identifies and resolves multi-tenant contexts for incoming requests."
relationships:
  - source: "TLS Termination & Edge Firewall"
    destination: "Authentication & Authorization Filter"
    description: "Passes decrypted traffic for authorization"
  - source: "Authentication & Authorization Filter"
    destination: "Rate Limiting & Traffic Shaping Engine"
    description: "Forwards authenticated requests"
  - source: "Rate Limiting & Traffic Shaping Engine"
    destination: "API Version Router"
    description: "Passes rate-limited requests"
  - source: "API Version Router"
    destination: "Tenant Resolution Filter"
    description: "Resolves tenant context"
  - source: "Tenant Resolution Filter"
    destination: "Reverse Proxy & Load Balancer"
    description: "Dispatches validated requests to backend containers"
  - source: "Authentication & Authorization Filter"
    destination: "Telemetry & Audit Interceptor"
    description: "Triggers security and access events"
  - source: "Telemetry & Audit Interceptor"
    destination: "Apache Kafka"
    description: "Forwards asynchronous access logs [Apache Kafka Protocol]"