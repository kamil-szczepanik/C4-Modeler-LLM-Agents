level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "Relational Storage Engine (PostgreSQL 16)"
    technology: "PostgreSQL 16"
    description: "Core persistence engine with table partitioning for ACID compliance."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Connection pooling for managing high concurrency and preventing exhaustion."
  - type: "component"
    name: "pg_audit extension"
    technology: "pg_audit"
    description: "Provides immutable audit logs for compliance."
  - type: "component"
    name: "Vault + pgcrypto"
    technology: "Vault, pgcrypto"
    description: "Handles AES-256 envelope encryption at rest."
  - type: "component"
    name: "Redis 7 caching layer"
    technology: "Redis 7"
    description: "Provides low-latency EMR retrieval (<1s P95)."
  - type: "component"
    name: "Row-Level Security Policies Engine"
    technology: "PostgreSQL RLS"
    description: "Enforces strict data access control and HIPAA/GDPR compliance."
relationships:
  - source: "PgBouncer"
    destination: "Relational Storage Engine (PostgreSQL 16)"
    description: "Routes TCP/PostgreSQL Wire Protocol (TLS 1.3) traffic"
  - source: "Relational Storage Engine (PostgreSQL 16)"
    destination: "pg_audit extension"
    description: "Generates immutable audit logs"
  - source: "Relational Storage Engine (PostgreSQL 16)"
    destination: "Vault + pgcrypto"
    description: "Applies envelope encryption at rest"
  - source: "Relational Storage Engine (PostgreSQL 16)"
    destination: "Row-Level Security Policies Engine"
    description: "Evaluates access policies"