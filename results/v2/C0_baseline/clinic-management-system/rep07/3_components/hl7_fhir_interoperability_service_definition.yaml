level: component
scope: "Component diagram for the HL7 FHIR Interoperability Service container"
parentContainer:
  name: "HL7 FHIR Interoperability Service"
elements:
  - type: "component"
    name: "FHIR API Router"
    technology: "Python / FastAPI"
    description: "Routes incoming RESTful API requests and enforces mTLS security policies."
  - type: "component"
    name: "Pydantic Schema Validator"
    technology: "Pydantic"
    description: "Performs strict runtime data validation against HL7 FHIR resource schemas."
  - type: "component"
    name: "External Lab Integration Client"
    technology: "Python HTTP Client / mTLS"
    description: "Handles outbound communication with External Lab & Imaging Systems using HL7 FHIR APIs."
relationships:
  - source: "FHIR API Router"
    destination: "Pydantic Schema Validator"
    description: "Validates incoming request payloads"
  - source: "FHIR API Router"
    destination: "External Lab Integration Client"
    description: "Dispatches authenticated FHIR requests"