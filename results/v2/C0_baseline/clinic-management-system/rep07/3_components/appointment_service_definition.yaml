level: component
scope: "Component diagram for the Appointment Service container"
parentContainer:
  name: "Appointment Service"
elements:
  - type: "component"
    name: "Appointment API Controller"
    technology: "Node.js / Go"
    description: "Handles incoming API requests for appointments and invokes core domain logic."
  - type: "component"
    name: "Scheduling Engine"
    technology: "Node.js / Go"
    description: "Executes core domain logic, resource clash checks, and atomic writes."
  - type: "component"
    name: "Waitlist Manager"
    technology: "Node.js / Go"
    description: "Manages waitlists and handles slot-freed events."
  - type: "component"
    name: "Notification Publisher"
    technology: "Node.js / Go"
    description: "Publishes domain events and analytics tags to messaging infrastructure."
relationships:
  - source: "Appointment API Controller"
    destination: "Scheduling Engine"
    description: "Invokes core domain logic [In-Process]"
  - source: "Scheduling Engine"
    destination: "Notification Publisher"
    description: "Publishes domain events and analytics tags [Kafka Producer]"
  - source: "Notification Publisher"
    destination: "Waitlist Manager"
    description: "Triggers slot-freed events [In-Process / Event Handler]"