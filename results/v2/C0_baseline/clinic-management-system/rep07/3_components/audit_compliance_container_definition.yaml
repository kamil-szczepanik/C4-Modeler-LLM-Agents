level: component
scope: "Component diagram for the Audit & Compliance Container container"
parentContainer:
  name: "Audit & Compliance Container"
elements:
  - type: "component"
    name: "Event Ingestion Engine"
    technology: "Go"
    description: "Go-based Kafka consumer for raw security and access events."
  - type: "component"
    name: "Log Integrity & Hash Chain Service"
    technology: "Go"
    description: "Go component implementing cryptographic hash-chains for tamper-evident logs."
  - type: "component"
    name: "Anomaly Detection & Alert Engine"
    technology: "Go"
    description: "Go stream-processing component evaluating real-time threat thresholds."
  - type: "component"
    name: "Compliance Storage Repository"
    technology: "PostgreSQL / S3 Glacier Vault Lock"
    description: "PostgreSQL paired with S3 Glacier Vault Lock using WORM controls."
  - type: "component"
    name: "Audit Reporting API"
    technology: "Node.js / Go"
    description: "Node.js/Go REST/gRPC service for generating cryptographically signed compliance reports."
  - type: "component"
    name: "Apache Kafka"
    technology: "Apache Kafka"
    description: "Scalable, fault-tolerant event streaming platform."
  - type: "component"
    name: "Compliance/IT Auditor"
    technology: "Human User"
    description: "Primary human user role enforcing regulatory oversight."
relationships:
  - source: "Event Ingestion Engine"
    destination: "Apache Kafka"
    description: "Consumes from [Kafka Protocol over mTLS with SASL/SCRAM]"
  - source: "Event Ingestion Engine"
    destination: "Anomaly Detection & Alert Engine"
    description: "Feeds [Internal IPC / Go Channels]"
  - source: "Log Integrity & Hash Chain Service"
    destination: "Compliance Storage Repository"
    description: "Persists to [SQL / S3 API with AES-256 and Field-Level Encryption]"
  - source: "Audit Reporting API"
    destination: "Compliance/IT Auditor"
    description: "Serves [HTTPS / REST with RBAC, ABAC, and KMS Digital Signatures]"