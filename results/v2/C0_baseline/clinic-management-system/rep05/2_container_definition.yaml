# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patient"
    description: "Patients accessing the platform for scheduling, admissions, and viewing EMR or billing details."
  - type: "person"
    name: "Receptionist / Front Desk"
    description: "Front desk staff managing patient check-ins, admissions, and basic scheduling."
  - type: "person"
    name: "Clinician / Doctor"
    description: "Medical professionals managing patient health records, examinations, and clinical notes."
  - type: "person"
    name: "Billing Specialist"
    description: "Staff members handling insurance claims, invoices, and payment processing."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Manages authentication and IAM via OAuth2/OIDC."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing medical lab results and imaging data."
  - type: "externalSystem"
    name: "Insurance Clearinghouses"
    description: "External networks for transmitting medical insurance claims."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service provider for processing patient co-pays and payments."
  - type: "externalSystem"
    name: "Centralized Vault"
    description: "Secret management system for dynamic secrets."
  - type: "externalSystem"
    name: "SIEM / Observability System"
    description: "Centralized system for OpenTelemetry metrics, logs, and audit trails."
  - type: "container"
    name: "API Gateway"
    technology: "NGINX / Kong"
    description: "Handles incoming requests, TLS termination, token validation, and routing."
  - type: "container"
    name: "Web Application"
    technology: "React SPA"
    description: "Provides the high-performance user interface for users."
  - type: "container"
    name: "Core Services"
    technology: "Spring Boot / Java"
    description: "Manages patient admissions, electronic medical records (EMR), and scheduling."
  - type: "container"
    name: "Billing Service"
    technology: "Node.js / Express"
    description: "Handles billing and insurance claim workflows."
  - type: "container"
    name: "Integration Service"
    technology: "Apache Camel"
    description: "Handles HL7 FHIR translation and communication with external lab and imaging systems."
  - type: "container"
    name: "Data & Infrastructure Tier"
    technology: "PostgreSQL with Citus, Redis, Kafka/RabbitMQ, Istio, ArgoCD"
    description: "Provides database persistence, caching, message brokering, and infrastructure orchestration."
relationships:
  - source: "Patient"
    destination: "API Gateway"
    description: "Accesses clinical IT capabilities"
    technology: "HTTPS / WSS, TLS 1.3, OAuth2 token validation, MFA"
  - source: "Receptionist / Front Desk"
    destination: "API Gateway"
    description: "Manages patient check-ins and admissions"
    technology: "HTTPS / WSS, TLS 1.3, OAuth2 token validation, MFA"
  - source: "Clinician / Doctor"
    destination: "API Gateway"
    description: "Accesses EMR and clinical tools"
    technology: "HTTPS / WSS, TLS 1.3, OAuth2 token validation, MFA"
  - source: "Billing Specialist"
    destination: "API Gateway"
    description: "Manages billing and claims"
    technology: "HTTPS / WSS, TLS 1.3, OAuth2 token validation, MFA"
  - source: "API Gateway"
    destination: "Web Application"
    description: "Serves React SPA"
    technology: "NGINX"
  - source: "Web Application"
    destination: "Core Services"
    description: "Performs EMR interactions"
    technology: "gRPC over mTLS (Istio)"
  - source: "Core Services"
    destination: "Billing Service"
    description: "Asynchronous event streaming for billing workflows"
    technology: "Kafka/RabbitMQ with payload-level message encryption"
  - source: "Core Services"
    destination: "Integration Service"
    description: "Asynchronous event streaming for integration workflows"
    technology: "Kafka/RabbitMQ with payload-level message encryption"
  - source: "Integration Service"
    destination: "External Lab & Imaging Systems"
    description: "Integrates lab orders and imaging results"
    technology: "HL7 FHIR APIs"
  - source: "Billing Service"
    destination: "Payment Gateway"
    description: "Processes patient payments"
    technology: "Secure HTTPS"
  - source: "Billing Service"
    destination: "Insurance Clearinghouses"
    description: "Transmits insurance claims"
    technology: "Secure HTTPS"
  - source: "API Gateway"
    destination: "Centralized Vault"
    description: "Fetches dynamic secrets"
    technology: "AppRole tokens"
  - source: "Core Services"
    destination: "Centralized Vault"
    description: "Fetches dynamic secrets"
    technology: "AppRole tokens"
  - source: "Billing Service"
    destination: "Centralized Vault"
    description: "Fetches dynamic secrets"
    technology: "AppRole tokens"
  - source: "Integration Service"
    destination: "Centralized Vault"
    description: "Fetches dynamic secrets"
    technology: "AppRole tokens"
  - source: "API Gateway"
    destination: "SIEM / Observability System"
    description: "Sends tracing telemetry"
    technology: "OpenTelemetry"
  - source: "Core Services"
    destination: "SIEM / Observability System"
    description: "Sends tracing telemetry"
    technology: "OpenTelemetry"
  - source: "Billing Service"
    destination: "SIEM / Observability System"
    description: "Sends tracing telemetry"
    technology: "OpenTelemetry"
  - source: "Integration Service"
    destination: "SIEM / Observability System"
    description: "Sends tracing telemetry"
    technology: "OpenTelemetry"
  - source: "Core Services"
    destination: "Data & Infrastructure Tier"
    description: "Persists and caches operational data"
    technology: "PostgreSQL with Citus, Redis"
  - source: "Core Services"
    destination: "Data & Infrastructure Tier"
    description: "Publishes and consumes asynchronous messages"
    technology: "Kafka/RabbitMQ"