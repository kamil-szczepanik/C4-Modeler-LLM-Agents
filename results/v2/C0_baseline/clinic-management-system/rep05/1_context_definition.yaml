level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed for medium-sized clinics and hospitals to manage patient admissions, EMRs, scheduling, and billing while ensuring HIPAA/GDPR compliance, 99.99% availability, and local-first sub-second performance."
elements:
  - type: "person"
    name: "Patient"
    description: "Patients accessing the platform for scheduling, admissions, and viewing EMR or billing details."
  - type: "person"
    name: "Receptionist / Front Desk"
    description: "Front desk staff managing patient check-ins, admissions, and basic scheduling."
  - type: "person"
    name: "Clinician / Doctor"
    description: "Medical professionals managing patient health records, examinations, and clinical notes."
  - type: "person"
    name: "Billing Specialist"
    description: "Staff members handling insurance claims, invoices, and payment processing."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Manages authentication and IAM via OAuth2/OIDC."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing medical lab results and imaging data."
  - type: "externalSystem"
    name: "Insurance Clearinghouses"
    description: "External networks for transmitting medical insurance claims."
  - type: "externalSystem"
    name: "Payment Gateway / Merchant Services"
    description: "External service provider for processing patient co-pays and payments."
  - type: "externalSystem"
    name: "Secure Hybrid Gateway/VPN Interconnect"
    description: "Secures communication between on-premise infrastructure and AWS cloud."
  - type: "externalSystem"
    name: "SIEM / Observability System"
    description: "Centralized system for OpenTelemetry metrics, logs, and HIPAA-compliant audit trails."
  - type: "externalSystem"
    name: "Centralized Vault"
    description: "Secret management system (HashiCorp Vault / AWS Secrets Manager) for dynamic secrets."
relationships:
  - source: "Patient"
    destination: "Clinic Management System"
    description: "Accessed for scheduling and viewing records"
    technology: "HTTPS, OAuth2/OIDC, MFA"
  - source: "Receptionist / Front Desk"
    destination: "Clinic Management System"
    description: "Manages admissions, scheduling, and front-desk workflows"
    technology: "HTTPS, OAuth2/OIDC, MFA"
  - source: "Clinician / Doctor"
    destination: "Clinic Management System"
    description: "Accesses and updates EMRs and patient clinical data"
    technology: "HTTPS, OAuth2/OIDC, MFA"
  - source: "Billing Specialist"
    destination: "Clinic Management System"
    description: "Manages patient billing, invoices, and insurance claims"
    technology: "HTTPS, OAuth2/OIDC, MFA"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users and manages IAM"
    technology: "OAuth2/OIDC"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Integrates lab orders and imaging results"
    technology: "HL7 FHIR APIs over HTTPS/REST"
  - source: "Clinic Management System"
    destination: "Insurance Clearinghouses"
    description: "Transmits insurance claims"
    technology: "EDI/HTTPS"
  - source: "Clinic Management System"
    destination: "Payment Gateway / Merchant Services"
    description: "Processes patient co-pays and transactions"
    technology: "HTTPS/REST"
  - source: "Clinic Management System"
    destination: "Secure Hybrid Gateway/VPN Interconnect"
    description: "Communicates across hybrid infrastructure securely"
    technology: "mTLS/IPsec"
  - source: "Clinic Management System"
    destination: "SIEM / Observability System"
    description: "Sends telemetry data and audit logs for compliance"
    technology: "OpenTelemetry, Structured JSON Logging"
  - source: "Clinic Management System"
    destination: "Centralized Vault"
    description: "Fetches dynamic secrets and configuration credentials"
    technology: "Secure API, TLS 1.3"