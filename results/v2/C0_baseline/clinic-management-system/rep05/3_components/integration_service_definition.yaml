level: component
scope: "Component diagram for the Integration Service container"
parentContainer:
  name: "Integration Service"
elements:
  - type: "component"
    name: "Route Orchestrator"
    technology: "Apache Camel"
    description: "Enterprise integration patterns and workflow orchestration for the Integration Service."
  - type: "component"
    name: "FHIR Transformer"
    technology: "HAPI FHIR"
    description: "Standardized HL7 FHIR resource transformation."
  - type: "component"
    name: "Data Anonymization Interceptor"
    technology: "Custom Interceptor"
    description: "Anonymizes data payloads to ensure HIPAA/GDPR compliance."
  - type: "component"
    name: "Vault Client"
    technology: "Spring Cloud Vault"
    description: "Handles dynamic secrets and X.509 certs via AppRole tokens."
  - type: "component"
    name: "Dead Letter Channel"
    technology: "Kafka"
    description: "Encrypted Dead Letter Queue for reliability and message retry handling."
  - type: "component"
    name: "Payload Cryptography Processor"
    technology: "Java Cryptography / JWE"
    description: "Handles payload-level JWE/AES-256 encryption."
relationships:
  - source: "Route Orchestrator"
    destination: "FHIR Transformer"
    description: "Transforms messages to FHIR format"
  - source: "Route Orchestrator"
    destination: "Data Anonymization Interceptor"
    description: "Passes payload through anonymization"
  - source: "Route Orchestrator"
    destination: "Payload Cryptography Processor"
    description: "Encrypts/decrypts payloads"
  - source: "Vault Client"
    destination: "Route Orchestrator"
    description: "Provides dynamic secrets and certs"
  - source: "Route Orchestrator"
    destination: "Dead Letter Channel"
    description: "Routes failed messages"