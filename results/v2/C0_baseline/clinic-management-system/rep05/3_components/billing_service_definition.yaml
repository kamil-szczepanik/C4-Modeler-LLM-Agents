level: component
scope: "Component diagram for the Billing Service container"
parentContainer:
  name: "Billing Service"
elements:
  - type: "component"
    name: "Claim Management Component"
    technology: "Node.js module"
    description: "Automates insurance claims and validates them against clearinghouses."
  - type: "component"
    name: "Payment Processing Component"
    technology: "Node.js module"
    description: "Processes patient credit card and digital wallet transactions."
  - type: "component"
    name: "Ledger & Invoicing Component"
    technology: "Node.js module"
    description: "Persists financial ledgers and manages patient billing records."
  - type: "component"
    name: "Billing Event Handler Component"
    technology: "Node.js / Kafka Consumer"
    description: "Handles event-driven messaging and Dead Letter Queues (DLQ)."
  - type: "component"
    name: "Patient Billing Portal API Component"
    technology: "Express router"
    description: "Exposes lightweight API routing for the billing portal."
relationships:
  - source: "Billing Event Handler Component"
    destination: "Core Services"
    description: "Consumes asynchronous event streams via Kafka"
  - source: "Payment Processing Component"
    destination: "Payment Gateway"
    description: "Processes patient credit card and digital wallet transactions via HTTPS and TLS 1.3"
  - source: "Claim Management Component"
    destination: "Insurance Clearinghouses"
    description: "Transmits and validates insurance claims via HTTPS and TLS 1.3"
  - source: "Ledger & Invoicing Component"
    destination: "Centralized Vault"
    description: "Fetches dynamic runtime secrets via AppRole tokens"
  - source: "Patient Billing Portal API Component"
    destination: "SIEM / Observability System"
    description: "Sends tracing telemetry using W3C Trace Context and OpenTelemetry"