level: component
scope: "Component diagram for the Web Application container"
parentContainer:
  name: "Web Application"
elements:
  - type: "component"
    name: "React SPA Router and Views"
    technology: "React, TypeScript"
    description: "Handles client-side routing and renders user interfaces for patient admissions, EMR, scheduling, and billing."
  - type: "component"
    name: "Authentication Client"
    technology: "OIDC / PKCE Library"
    description: "Manages user login and token exchange with the Identity Provider."
  - type: "component"
    name: "API Client"
    technology: "Fetch / Axios over HTTPS"
    description: "Communicates with the NGINX API Gateway to send and retrieve data via JSON REST."
relationships:
  - source: "React SPA Router and Views"
    destination: "Authentication Client"
    description: "Triggers authentication and token management"
  - source: "React SPA Router and Views"
    destination: "API Client"
    description: "Requests business data and operations"
  - source: "Authentication Client"
    destination: "Identity Provider"
    description: "Authenticates via OIDC with PKCE over HTTPS"
  - source: "API Client"
    destination: "NGINX API Gateway / CDN"
    description: "Sends HTTPS / JSON REST requests via TLS 1.3"