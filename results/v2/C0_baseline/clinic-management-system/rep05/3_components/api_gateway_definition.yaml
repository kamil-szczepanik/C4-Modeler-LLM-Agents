level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "TLS Termination Module"
    technology: "NGINX / Kong Module"
    description: "Terminates TLS 1.3 connections from clients."
  - type: "component"
    name: "Auth & JWT Validation Filter"
    technology: "OAuth2 / JWT Filter"
    description: "Validates OAuth2 tokens and enforces authentication."
  - type: "component"
    name: "Rate Limiting Middleware"
    technology: "Redis-backed Middleware"
    description: "Enforces rate limiting using Redis for distributed control."
  - type: "component"
    name: "Dynamic Router & Load Balancer"
    technology: "Kong / NGINX Router"
    description: "Routes requests dynamically and balances load across backend services."
  - type: "component"
    name: "Telemetry Exporter"
    technology: "OpenTelemetry / Prometheus Exporter"
    description: "Exports telemetry and observability data."
  - type: "component"
    name: "Async Audit & Compliance Logger"
    technology: "Asynchronous Logger"
    description: "Dispatches redacted access events asynchronously via an in-memory channel."
relationships:
  - source: "Auth & JWT Validation Filter"
    destination: "Async Audit & Compliance Logger"
    description: "Dispatches redacted access events asynchronously"