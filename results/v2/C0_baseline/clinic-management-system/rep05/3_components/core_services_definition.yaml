level: component
scope: "Component diagram for the Core Services container"
parentContainer:
  name: "Core Services"
elements:
  - type: "component"
    name: "Patient Administration Component"
    technology: "Spring Boot / Java"
    description: "Manages patient admissions, demographics, and profile data."
  - type: "component"
    name: "Scheduling Engine"
    technology: "Spring Boot / Java, Temporal Java SDK, Redis"
    description: "Handles appointments, multi-resource scheduling sagas, and low-latency scheduling clash checks using distributed locking."
  - type: "component"
    name: "EMR Manager"
    technology: "Spring Boot / Java, Spring Data JPA, PostgreSQL with Citus"
    description: "Manages electronic medical records, clinical documentation, and long-term data retention."
  - type: "component"
    name: "Workflow Orchestrator"
    technology: "Temporal Java SDK"
    description: "Implements complex multi-resource scheduling sagas and clinical workflow orchestrations."
relationships:
  - source: "Scheduling Engine"
    destination: "Redis"
    description: "Utilizes Redlock algorithm over TLS for distributed resource locking"
  - source: "EMR Manager"
    destination: "PostgreSQL (Citus)"
    description: "Connects via JDBC / Spring Data JPA with HikariCP over TLS"
  - source: "Core Services"
    destination: "Kafka/RabbitMQ"
    description: "Publishes asynchronous domain mutation events using Spring Cloud Stream with payload-level envelope encryption"
  - source: "Core Services"
    destination: "Centralized Vault"
    description: "Fetches dynamic secrets via AppRole tokens and Spring Cloud Vault"