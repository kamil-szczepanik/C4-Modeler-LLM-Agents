level: component
scope: "Component diagram for the Data & Infrastructure Tier container"
parentContainer:
  name: "Data & Infrastructure Tier"
elements:
  - type: "component"
    name: "PostgreSQL with Citus"
    technology: "PostgreSQL with Citus, JDBC/TCP, TLS 1.3, AES-256"
    description: "Sharded relational storage chosen for horizontal scalability and AES-256 at-rest encryption, persisting operational data with Row-Level Security."
  - type: "component"
    name: "Redis Enterprise"
    technology: "Redis Enterprise, RESP, TLS 1.3"
    description: "Distributed active-active cache selected to guarantee sub-second EMR screen loads and check schedules."
  - type: "component"
    name: "Apache Kafka"
    technology: "Apache Kafka, TCP, Payload-level encryption"
    description: "Event broker utilized for reliable, decoupled asynchronous messaging and integration."
  - type: "component"
    name: "Istio & ArgoCD"
    technology: "Istio, ArgoCD, Kubernetes, mTLS"
    description: "Service mesh and GitOps tooling chosen for mTLS and declarative hybrid cluster management."
  - type: "component"
    name: "Backup & PITR Manager"
    technology: "Velero/Barman, HTTPS, TLS 1.3, WORM locks"
    description: "Performs WAL archiving and snapshots to fulfill 10-year retention and PITR mandates."
  - type: "component"
    name: "Centralized Vault"
    technology: "HashiCorp Vault, AES-256"
    description: "Provides automated credentials, envelope encryption keys, and ephemeral access tokens."
  - type: "component"
    name: "Encrypted Object Storage (S3/MinIO)"
    technology: "S3/MinIO, HTTPS/TLS 1.3, WORM"
    description: "Object storage stack for long-term retention and backup data."
relationships:
  - source: "Core Services"
    destination: "PostgreSQL with Citus"
    description: "Persists operational data via JDBC/TCP with TLS 1.3 and native Row-Level Security (RLS)"
  - source: "Core Services"
    destination: "Redis Enterprise"
    description: "Caches data and checks schedules via RESP with TLS 1.3"
  - source: "Core Services"
    destination: "Apache Kafka"
    description: "Publishes asynchronous messages using TCP with payload-level encryption"
  - source: "Istio & ArgoCD"
    destination: "Hybrid Kubernetes Clusters"
    description: "Manages mTLS service-to-service encryption and declarative deployments"
  - source: "Backup & PITR Manager"
    destination: "Encrypted Object Storage (S3/MinIO)"
    description: "Performs WAL archiving and snapshots via HTTPS/TLS 1.3 with WORM locks"
  - source: "Centralized Vault"
    destination: "Data & Infrastructure Tier"
    description: "Provides automated credentials, envelope encryption keys (AES-256), and ephemeral access tokens"