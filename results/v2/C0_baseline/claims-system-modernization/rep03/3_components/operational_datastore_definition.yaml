level: component
scope: "Component diagram for the Operational Datastore container"
parentContainer:
  name: "Operational Datastore"
elements:
  - type: "component"
    name: "Claims Registry Table"
    technology: "PostgreSQL / Azure SQL"
    description: "Relational tables for core state tracking and data persistence."
  - type: "component"
    name: "Operational Read-Model Cache"
    technology: "Denormalized tables"
    description: "Optimized cache providing low-latency reads for UI performance."
  - type: "component"
    name: "Sync-State Ledger"
    technology: "Transactional tables"
    description: "Transactional ledger ensuring zero data loss and exact claim routing during migration."
  - type: "component"
    name: "Audit Logging Subsystem"
    technology: "PostgreSQL pgaudit / Azure SQL Ledger / Temporal Tables"
    description: "Enforces immutable compliance audit logs and secure state tracking."
relationships:
  - source: "Integration & Sync Service"
    destination: "Sync-State Ledger"
    description: "Syncs state via ADO.NET / pgsql over TLS via Azure Private Endpoints"
  - source: "Integration & Sync Service"
    destination: "Claims Registry Table"
    description: "Updates claims via ADO.NET / pgsql over TLS via Azure Private Endpoints"
  - source: "Claims API Gateway / BFF"
    destination: "Operational Read-Model Cache"
    description: "Queries data via SQL queries via Azure Private Endpoints"
  - source: "Claims Registry Table"
    destination: "Audit & Event Store"
    description: "Replicates data via PostgreSQL logical replication / Azure SQL Change Data Capture over TLS"