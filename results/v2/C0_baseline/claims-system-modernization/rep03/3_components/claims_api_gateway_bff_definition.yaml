level: component
scope: "Component diagram for the Claims API Gateway / BFF container"
parentContainer:
  name: "Claims API Gateway / BFF"
elements:
  - type: "component"
    name: "Claim Routing & Proxy Controller"
    technology: ".NET 8 / YARP"
    description: "Handles dynamic claim-type routing and rate-limiting policies for incoming traffic from the frontends."
  - type: "component"
    name: "Authentication Middleware"
    technology: ".NET 8 / OpenID Connect"
    description: "Authenticates users via integration with Corporate Active Directory using OpenID Connect and OAuth2."
  - type: "component"
    name: "Resilience & Integration Handler"
    technology: ".NET 8 / Polly"
    description: "Manages circuit breaking, timeouts, and fallback resilience patterns when communicating with downstream services and the legacy mainframe."
relationships:
  - source: "Claim Routing & Proxy Controller"
    destination: "Resilience & Integration Handler"
    description: "Delegates requests for legacy mainframe or sync service"
  - source: "Authentication Middleware"
    destination: "Claim Routing & Proxy Controller"
    description: "Secures incoming requests"