level: component
scope: "Component diagram for the Integration & Sync Service container"
parentContainer:
  name: "Integration & Sync Service"
elements:
  - type: "component"
    name: "Sync Orchestrator Component"
    technology: ".NET 8"
    description: "Orchestrates the synchronization workflow and coordinates between adapters and validators."
  - type: "component"
    name: "Mainframe Adapter Component"
    technology: ".NET 8 with Polly"
    description: "Interfaces with the legacy mainframe system using resilience patterns like circuit breakers and rate-limiting."
  - type: "component"
    name: "Reconciliation & DLQ Manager Component"
    technology: ".NET 8 / Azure Functions"
    description: "Inspects and replays failed messages, and manages reconciliation states."
  - type: "component"
    name: "Business Rule Validator Component"
    technology: ".NET 8"
    description: "Validates business rules for incoming and outgoing claim data."
  - type: "component"
    name: "Messaging Consumer/Publisher Component"
    technology: "Azure Service Bus SDK"
    description: "Handles asynchronous messaging operations, enqueuing and deconstructing events."
relationships:
  - source: "Sync Orchestrator Component"
    destination: "Mainframe Adapter Component"
    description: "Internal [In-Process / C# interface calls]"
  - source: "Sync Orchestrator Component"
    destination: "Business Rule Validator Component"
    description: "Internal [In-Process / C#]"
  - source: "Sync Orchestrator Component"
    destination: "Messaging Consumer/Publisher Component"
    description: "Enqueues/Deconstructs events via [Azure Service Bus SDK]"
  - source: "Reconciliation & DLQ Manager Component"
    destination: "Messaging Consumer/Publisher Component"
    description: "Inspects and replays failed messages via [AMQP]"
  - source: "Reconciliation & DLQ Manager Component"
    destination: "Audit & Event Store"
    description: "Reads/Writes reconciliation states via [TCP / Cosmos DB SDK]"
  - source: "Mainframe Adapter Component"
    destination: "Legacy Mainframe System"
    description: "Synchronizes data via [IPsec VPN or Azure ExpressRoute using mTLS / TLS 1.3]"