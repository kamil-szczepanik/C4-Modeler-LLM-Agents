level: context
scope: "System Context diagram for Insurance Claims Modernization Platform"
system:
  name: "Insurance Claims Modernization Platform"
  description: "Cloud-native target system hosted in Azure West Europe that gradually replaces a legacy mainframe claims system by migrating claim types incrementally."
elements:
  - type: "person"
    name: "End Customers & Brokers"
    description: "External users submitting claims online."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users processing claims via the new web application."
  - type: "person"
    name: "Migration Operations Lead"
    description: "Specialized user monitoring incremental cutovers and rollbacks."
  - type: "externalSystem"
    name: "Legacy Mainframe System"
    description: "On-premises COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "Corporate Active Directory"
    description: "On-premises identity provider."
  - type: "externalSystem"
    name: "Third-Party Payment Gateway"
    description: "External system handling outbound payouts."
relationships:
  - source: "End Customers & Brokers"
    destination: "Insurance Claims Modernization Platform"
    description: "Online claim submission"
    technology: "HTTPS/REST"
  - source: "Claims Adjusters"
    destination: "Insurance Claims Modernization Platform"
    description: "Web UI access"
    technology: "HTTPS"
  - source: "Insurance Claims Modernization Platform"
    destination: "Legacy Mainframe System"
    description: "Dual-run synchronization"
    technology: "MQ/Batch/API with mTLS"
  - source: "Legacy Mainframe System"
    destination: "Insurance Claims Modernization Platform"
    description: "Dual-run synchronization"
    technology: "MQ/Batch/API with mTLS"
  - source: "Insurance Claims Modernization Platform"
    destination: "Corporate Active Directory"
    description: "Single Sign-On authentication"
    technology: "OIDC/SAML"
  - source: "Insurance Claims Modernization Platform"
    destination: "Third-Party Payment Gateway"
    description: "Outbound payouts"
    technology: "HTTPS/REST with OAuth 2.0"