level: container
scope: "Container diagram for Insurance Claims Modernization System"
system:
  name: "Insurance Claims Modernization System"
elements:
  - type: "person"
    name: "End Customers & Brokers"
    description: "External users submitting and managing claims 24/7."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users reviewing and processing high-performance adjuster workflows."
  - type: "externalSystem"
    name: "Legacy Mainframe System"
    description: "On-premises COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "Corporate Active Directory"
    description: "External IDP providing identity services."
  - type: "container"
    name: "Customer Portal"
    technology: "React / TypeScript SPA, Azure Static Web Apps"
    description: "Enables 24/7 digital claim submissions for customers and brokers."
  - type: "container"
    name: "Adjuster Web Application"
    technology: "React / TypeScript SPA"
    description: "Provides high-performance workflows for claims adjusters."
  - type: "container"
    name: "Claims API Gateway / BFF"
    technology: "Node.js or .NET Core, Azure Container Apps"
    description: "Backend-for-Frontend handling routing, security, and client requests."
  - type: "container"
    name: "Integration & Sync Service"
    technology: "Azure Container Apps worker, Azure Service Bus"
    description: "Synchronizes data and handles messaging with the legacy mainframe system."
  - type: "container"
    name: "Audit & Event Store"
    technology: "Azure Cosmos DB"
    description: "Maintains append-only immutability for audit trails."
  - type: "container"
    name: "Operational Datastore"
    technology: "Azure SQL Database / PostgreSQL on Azure"
    description: "Stores operational sync-state data."
relationships:
  - source: "End Customers & Brokers"
    destination: "Customer Portal"
    description: "Interacts with"
    technology: "HTTPS (REST)"
  - source: "Claims Adjusters"
    destination: "Adjuster Web Application"
    description: "Interacts with"
    technology: "HTTPS (REST)"
  - source: "Customer Portal"
    destination: "Claims API Gateway / BFF"
    description: "Communicates with"
    technology: "HTTPS/JSON"
  - source: "Adjuster Web Application"
    destination: "Claims API Gateway / BFF"
    description: "Communicates with"
    technology: "HTTPS/JSON"
  - source: "Claims API Gateway / BFF"
    destination: "Integration & Sync Service"
    description: "Communicates with"
    technology: "HTTPS/JSON and Azure Service Bus"
  - source: "Integration & Sync Service"
    destination: "Legacy Mainframe System"
    description: "Synchronizes data with"
    technology: "IPsec VPN or Azure ExpressRoute (mTLS / TLS 1.3)"
  - source: "Corporate Active Directory"
    destination: "Claims API Gateway / BFF"
    description: "Authenticates users against"
    technology: "OpenID Connect (OIDC) / OAuth2"