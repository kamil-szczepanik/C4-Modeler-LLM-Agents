level: component
scope: "Component diagram for the Azure Application Insights container"
parentContainer:
  name: "Azure Application Insights"
elements:
  - type: "component"
    name: "Application Insights SDK / Auto-collection agents"
    technology: "Application Insights SDK, Auto-collection agents"
    description: "Collects and transmits telemetry data from the Claims Processing Service and Migration Dashboard."
  - type: "component"
    name: "Log Analytics Workspace"
    technology: "Azure Log Analytics, Kusto Query Language"
    description: "Stores and indexes telemetry, logs, and trace data for querying and analysis."
  - type: "component"
    name: "Application Insights Alert Rules"
    technology: "Azure Monitor alerts, Webhook/Action Groups"
    description: "Monitors telemetry metrics and triggers alerts based on predefined thresholds."
  - type: "component"
    name: "Application Insights Workbooks"
    technology: "Azure Workbooks, JSON/KQL"
    description: "Provides visual dashboards and interactive reports for system operators."
  - type: "component"
    name: "Application Insights Metrics Explorer"
    technology: "Azure Monitor, Time-series DB"
    description: "Analyzes time-series metrics for performance and health monitoring."
relationships:
  - source: "Application Insights SDK / Auto-collection agents"
    destination: "Log Analytics Workspace"
    description: "Sends telemetry data to"
  - source: "Log Analytics Workspace"
    destination: "Application Insights Workbooks"
    description: "Supplies data for queries and visualization in"
  - source: "Application Insights Metrics Explorer"
    destination: "Log Analytics Workspace"
    description: "Queries time-series data from"
  - source: "Application Insights Alert Rules"
    destination: "Log Analytics Workspace"
    description: "Evaluates metrics and logs stored in"