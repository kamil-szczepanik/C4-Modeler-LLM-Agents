level: component
scope: "Component diagram for the Migration Dashboard container"
parentContainer:
  name: "Migration Dashboard"
elements:
  - type: "component"
    name: "Migration Dashboard UI"
    technology: "React"
    description: "Frontend UI framework for the Migration Dashboard providing user interaction, leveraging team familiarity and component reusability."
  - type: "component"
    name: "Migration Dashboard Backend"
    technology: "Node.js"
    description: "Backend runtime for handling API requests, RBAC middleware, and reconciliation aggregation."
  - type: "component"
    name: "Rollback Controller Component"
    technology: "Node.js / Azure Container Apps"
    description: "Triggers feature flag switches to handle rapid rollbacks."
  - type: "component"
    name: "Reconciliation Viewer Component & Data Aggregator"
    technology: "Node.js / Azure Container Apps"
    description: "Queries reconciliation metrics and audit logs from the database."
  - type: "component"
    name: "RBAC & Authorization Middleware"
    technology: "Node.js Middleware"
    description: "Enforces security, access control, and safety-critical governance."
  - type: "component"
    name: "Audit Logging Service"
    technology: "Node.js / Azure Container Apps"
    description: "Provides immutable audit logging to satisfy strict compliance constraints."
relationships:
  - source: "Migration Dashboard UI"
    destination: "Migration Dashboard Backend"
    description: "Sends API requests [HTTPS]"
  - source: "Migration Dashboard Backend"
    destination: "RBAC & Authorization Middleware"
    description: "Validates permissions via"
  - source: "Migration Dashboard Backend"
    destination: "Rollback Controller Component"
    description: "Invokes feature flag switches"
  - source: "Migration Dashboard Backend"
    destination: "Reconciliation Viewer Component & Data Aggregator"
    description: "Aggregates reconciliation metrics"
  - source: "Migration Dashboard Backend"
    destination: "Audit Logging Service"
    description: "Records audit events"