level: component
scope: "Component diagram for the Claims Processing Service container"
parentContainer:
  name: "Claims Processing Service"
elements:
  - type: "component"
    name: "Claims Routing Controller"
    technology: "Spring Boot, Spring MVC"
    description: "Receives routed requests from Azure API Management and exposes endpoints for claim-type processing."
  - type: "component"
    name: "Claim Processing Service"
    technology: "Java, Spring Boot"
    description: "Implements business logic for claim-type processing and orchestrates outbox pattern transactions."
  - type: "component"
    name: "Outbox Data Repository"
    technology: "Spring Data JPA, Azure SQL Database"
    description: "Handles ACID-compliant transaction persistence and local outbox table support."
  - type: "component"
    name: "Event Publisher"
    technology: "Azure Service Bus SDK, AMQP"
    description: "Publishes asynchronous events to Azure Service Bus."
  - type: "component"
    name: "Resilience Adapter"
    technology: "Resilience4j"
    description: "Implements circuit breakers and caching adapters to mitigate mainframe latency."
  - type: "component"
    name: "Secret Manager Client"
    technology: "Azure Key Vault SDK, Managed Identity"
    description: "Retrieves secrets and credentials securely from Azure Key Vault."
relationships:
  - source: "Claims Routing Controller"
    destination: "Claim Processing Service"
    description: "Delegates claim requests [In-memory]"
  - source: "Claim Processing Service"
    destination: "Outbox Data Repository"
    description: "Persists claims and outbox messages [TDS]"
  - source: "Claim Processing Service"
    destination: "Event Publisher"
    description: "Sends asynchronous domain events [AMQP]"
  - source: "Claim Processing Service"
    destination: "Resilience Adapter"
    description: "Wraps external calls with circuit breakers [In-memory]"
  - source: "Claim Processing Service"
    destination: "Secret Manager Client"
    description: "Fetches secrets and credentials [HTTPS / Managed Identity]"