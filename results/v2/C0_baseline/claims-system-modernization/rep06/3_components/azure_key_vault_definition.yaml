level: component
scope: "Component diagram for the Azure Key Vault container"
parentContainer:
  name: "Azure Key Vault"
elements:
  - type: "component"
    name: "Secrets Management Component"
    technology: "Azure Key Vault SDK / REST API"
    description: "Manages and retrieves sensitive financial data and connection strings securely."
  - type: "component"
    name: "Keys Management Component"
    technology: "Azure Key Vault Managed HSM / TDE"
    description: "Performs Transparent Data Encryption (TDE) operations using Customer-Managed Keys (CMK)."
  - type: "component"
    name: "Access Control Component"
    technology: "Azure Active Directory (Entra ID) Managed Identities"
    description: "Handles credential-free authentication and zero-trust access control."
  - type: "component"
    name: "Caching & Event Listener Component"
    technology: "In-memory short-TTL cache (5-15 minutes)"
    description: "Caches secrets temporarily to balance performance and security against transient outages."
relationships:
  - source: "Claims Processing Service"
    destination: "Secrets Management Component"
    description: "Retrieves connection strings via Azure SDK over HTTPS (REST) via Azure Private Endpoint."
  - source: "Azure SQL Database"
    destination: "Keys Management Component"
    description: "Performs Transparent Data Encryption (TDE) operations via Azure internal secure channel."
  - source: "Claims Processing Service & Migration Dashboard"
    destination: "Access Control Component"
    description: "Authenticates using Azure Active Directory (Entra ID) Managed Identities."