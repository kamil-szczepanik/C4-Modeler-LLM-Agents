level: component
scope: "Component diagram for the Azure API Management container"
parentContainer:
  name: "Azure API Management"
elements:
  - type: "component"
    name: "API Gateway"
    technology: "Azure API Management (Internal VNet mode)"
    description: "Acts as the single secure entry point, handling routing, rate limiting, and dynamic claim-type routing."
  - type: "component"
    name: "Security Validator"
    technology: "OAuth 2.0 / OpenID Connect & mTLS"
    description: "Validates JWT tokens via Azure Active Directory (Entra ID) and secures service-to-service communication."
  - type: "component"
    name: "Telemetry Publisher"
    technology: "HTTPS"
    description: "Publishes telemetry and metrics to Azure Application Insights."
relationships:
  - source: "API Gateway"
    destination: "Security Validator"
    description: "Validates incoming JWT tokens and secures routing via mTLS"
  - source: "API Gateway"
    destination: "Telemetry Publisher"
    description: "Publishes metrics and telemetry"