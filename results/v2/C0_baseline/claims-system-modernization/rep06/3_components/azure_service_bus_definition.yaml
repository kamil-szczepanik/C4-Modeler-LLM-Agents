level: component
scope: "Component diagram for the Azure Service Bus container"
parentContainer:
  name: "Azure Service Bus"
elements:
  - type: "component"
    name: "Service Bus Premium Messaging Engine"
    technology: "Azure Service Bus Premium Tier, AMQP 1.0, TLS 1.3"
    description: "Provides dedicated resources, geo-disaster recovery, and native AMQP 1.0 messaging backbone supporting asynchronous event publishing, queuing, and handling batch processing buffers."
  - type: "component"
    name: "Private Endpoint Network Perimeter"
    technology: "Azure Private Endpoints"
    description: "Restricts network perimeter security by prohibiting public internet access to the message broker."
  - type: "component"
    name: "Access Control and Identity Manager"
    technology: "Azure RBAC, Managed Identities, Azure Active Directory (Entra ID)"
    description: "Enforces least-privilege access across services, replacing SAS keys for secure interactions."
relationships:
  - source: "Private Endpoint Network Perimeter"
    destination: "Service Bus Premium Messaging Engine"
    description: "Secures network access [Private IP, TLS 1.3]"
  - source: "Access Control and Identity Manager"
    destination: "Service Bus Premium Messaging Engine"
    description: "Authenticates and authorizes access [Azure RBAC, Managed Identities]"