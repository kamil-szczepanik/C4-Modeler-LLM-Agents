level: component
scope: "Component diagram for the Azure Active Directory (Entra ID) container"
parentContainer:
  name: "Azure Active Directory (Entra ID)"
elements:
  - type: "component"
    name: "Token Service (STS)"
    technology: "OAuth 2.0 / OpenID Connect (OIDC)"
    description: "Issues and validates security tokens, and provides public JWKS endpoints."
  - type: "component"
    name: "Directory & Graph API Component"
    technology: "Microsoft Graph API"
    description: "Manages directory data and user identity information."
  - type: "component"
    name: "B2C / External Identity Federation Gateway"
    technology: "Azure AD B2C"
    description: "Handles external identity federation for customers and brokers."
  - type: "component"
    name: "Audit & Reporting Component"
    technology: "Azure Monitor / Log Analytics"
    description: "Monitors sign-in and audit telemetry."
relationships:
  - source: "Token Service (STS)"
    destination: "Claims Processing Service"
    description: "Provides JWT tokens and public JWKS endpoints via HTTPS."
  - source: "Token Service (STS)"
    destination: "Azure API Management"
    description: "Provides OIDC metadata and JWKS for edge token validation via HTTPS."
  - source: "Audit & Reporting Component"
    destination: "Azure Application Insights"
    description: "Ingests telemetry via HTTPS using Azure Diagnostic Settings."