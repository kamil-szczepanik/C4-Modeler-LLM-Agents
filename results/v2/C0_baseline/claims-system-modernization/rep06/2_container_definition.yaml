level: container
scope: "Container diagram for Hybrid Insurance Claims Modernization Platform"
system:
  name: "Hybrid Insurance Claims Modernization Platform"
elements:
  - type: "person"
    name: "Customer"
    description: "End users who interact with the platform for online claim submission."
  - type: "person"
    name: "Broker"
    description: "Intermediaries who interact with the platform for online claim submission."
  - type: "person"
    name: "Claims Adjuster"
    description: "Internal staff who interact with the platform for claim handling."
  - type: "person"
    name: "Business Operations / Migration Manager"
    description: "Internal staff who manage migration tasks and operations via the migration dashboard."
  - type: "externalSystem"
    name: "On-premise COBOL/DB2 Legacy Mainframe"
    description: "The existing on-premise system of record processing legacy insurance data."
  - type: "container"
    name: "Azure API Management"
    description: "Gateways and routing layer for dynamic claim-type routing and feature-flag routing."
    technology: "Azure API Management"
  - type: "container"
    name: "Claims Processing Service"
    description: "Backend service for processing claims workloads."
    technology: "Java, Spring Boot, Azure Container Apps"
  - type: "container"
    name: "Migration Dashboard"
    description: "Web application for business operations and migration management."
    technology: "React, Node.js, Azure Container Apps"
  - type: "container"
    name: "Azure Service Bus"
    description: "Asynchronous event publishing, messaging, and queuing around the strict nightly batch window."
    technology: "Azure Service Bus"
  - type: "container"
    name: "Azure Logic Apps / Functions"
    description: "Integration and workflow automation supporting hybrid messaging."
    technology: "Azure Logic Apps, Azure Functions"
  - type: "container"
    name: "Azure SQL Database"
    description: "ACID-compliant transaction persistence storage for claims."
    technology: "Azure SQL Database, TDS"
  - type: "container"
    name: "Azure Key Vault"
    description: "Secret retrieval and management using Managed Identity."
    technology: "Azure Key Vault"
  - type: "container"
    name: "Azure Active Directory (Entra ID)"
    description: "Identity and access management providing SSO and authentication."
    technology: "Azure Active Directory (Entra ID), OAuth 2.0, OpenID Connect"
  - type: "container"
    name: "Azure Application Insights"
    description: "Security and observability monitoring for the platform."
    technology: "Azure Application Insights"
relationships:
  - source: "Customer"
    destination: "Azure API Management"
    description: "Online claim submission via HTTPS / REST"
    technology: "HTTPS / REST"
  - source: "Broker"
    destination: "Azure API Management"
    description: "Online claim submission via HTTPS / REST"
    technology: "HTTPS / REST"
  - source: "Claims Adjuster"
    destination: "Azure API Management"
    description: "Web application access for claim handling via OAuth 2.0 / OpenID Connect"
    technology: "HTTPS / OAuth 2.0"
  - source: "Business Operations / Migration Manager"
    destination: "Azure API Management"
    description: "Web application access for migration management via OAuth 2.0 / OpenID Connect"
    technology: "HTTPS / OAuth 2.0"
  - source: "Azure API Management"
    destination: "Claims Processing Service"
    description: "Dynamic claim-type routing via internal VNet"
    technology: "HTTPS / VNet"
  - source: "Azure API Management"
    destination: "Migration Dashboard"
    description: "Routes traffic to the migration dashboard via internal VNet"
    technology: "HTTPS / VNet"
  - source: "Claims Processing Service"
    destination: "Azure SQL Database"
    description: "ACID-compliant transaction persistence"
    technology: "TDS"
  - source: "Claims Processing Service"
    destination: "Azure Service Bus"
    description: "Asynchronous event publishing and queuing"
    technology: "AMQP / Messaging"
  - source: "Azure Service Bus"
    destination: "On-premise COBOL/DB2 Legacy Mainframe"
    description: "Hybrid integration bridge via TLS 1.3 / mTLS and Site-to-Site VPN / ExpressRoute"
    technology: "TLS 1.3 / mTLS, VPN / ExpressRoute"
  - source: "Claims Processing Service"
    destination: "Azure Key Vault"
    description: "Managed Identity secret retrieval"
    technology: "HTTPS"
  - source: "Migration Dashboard"
    destination: "Azure Key Vault"
    description: "Managed Identity secret retrieval"
    technology: "HTTPS"