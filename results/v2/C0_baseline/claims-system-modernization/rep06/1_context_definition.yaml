level: context
scope: "System Context diagram for Hybrid Insurance Claims Modernization Platform"
system:
  name: "Hybrid Insurance Claims Modernization Platform"
  description: "A hybrid insurance claims modernization platform that gradually replaces a legacy COBOL/DB2 mainframe while maintaining continuous claim processing by coupling a cloud-hosted web interface with asynchronous integration patterns."
elements:
  - type: "person"
    name: "Customer"
    description: "End users who interact with the platform for online claim submission."
  - type: "person"
    name: "Broker"
    description: "Intermediaries who interact with the platform for online claim submission."
  - type: "person"
    name: "Claims Adjuster"
    description: "Internal staff who interact with the platform for claim handling."
  - type: "externalSystem"
    name: "On-premise COBOL/DB2 Legacy Mainframe"
    description: "The existing system of record processing legacy insurance data."
relationships:
  - source: "Customer"
    destination: "Hybrid Insurance Claims Modernization Platform"
    description: "Interacts for online claim submission"
    technology: "HTTPS"
  - source: "Broker"
    destination: "Hybrid Insurance Claims Modernization Platform"
    description: "Interacts for online claim submission"
    technology: "HTTPS"
  - source: "Claims Adjuster"
    destination: "Hybrid Insurance Claims Modernization Platform"
    description: "Interacts for claim handling"
    technology: "HTTPS"
  - source: "Hybrid Insurance Claims Modernization Platform"
    destination: "On-premise COBOL/DB2 Legacy Mainframe"
    description: "Synchronous queries and asynchronous claim state updates"
    technology: "REST/HTTPS and AMQP/HTTPS via Azure API Management and Azure Service Bus"