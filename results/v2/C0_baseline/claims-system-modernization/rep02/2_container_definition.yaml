# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Insurance Claims Modernization Platform"
system:
  name: "Insurance Claims Modernization Platform"
elements:
  - type: "person"
    name: "Customers / Brokers"
    description: "External users submitting and managing claims via the customer portal."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff processing claims in the adjuster workspace."
  - type: "person"
    name: "Migration Product Managers"
    description: "Users overseeing the gradual migration of claims from legacy to cloud."
  - type: "person"
    name: "Customer Support Agents"
    description: "Support staff assisting users with platform operations."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "Microsoft Entra ID"
    description: "Identity provider for Single Sign-On and OIDC token validation."
  - type: "container"
    name: "Azure API Management"
    technology: "Azure API Management"
    description: "API Gateway and OIDC validation for secure tenant entry."
  - type: "container"
    name: "Customer Portal"
    technology: "React / Azure Static Web Apps"
    description: "Frontend interface for customers and brokers."
  - type: "container"
    name: "Adjuster Workspace"
    technology: "Angular / Azure App Service"
    description: "Frontend interface for claims adjusters and support agents."
  - type: "container"
    name: "Claims Core Engine"
    technology: "Java / Spring Boot / Azure Container Apps"
    description: "Microservice handling core claim processing logic."
  - type: "container"
    name: "Routing & Integration Service"
    technology: "Azure Functions"
    description: "Evaluates claim types and routes integrations."
  - type: "container"
    name: "Business Analytics & Reporting"
    technology: "Azure SQL / Power BI"
    description: "Storage and reporting for business analytics."
  - type: "container"
    name: "Azure SQL Database"
    technology: "Azure SQL Database"
    description: "CQRS read-model storage ensuring sub-2 second adjuster screen loads."
  - type: "container"
    name: "Azure Service Bus Topics"
    technology: "Azure Service Bus Topics"
    description: "Reliable asynchronous messaging with session IDs for data consistency."
relationships:
  - source: "Customers / Brokers"
    destination: "Azure API Management"
    description: "Submits claims via API gateway"
    technology: "HTTPS / TLS"
  - source: "Claims Adjusters"
    destination: "Azure API Management"
    description: "Accesses adjuster workspace via API gateway"
    technology: "HTTPS / TLS"
  - source: "Customer Support Agents"
    destination: "Azure API Management"
    description: "Accesses support tools via API gateway"
    technology: "HTTPS / TLS"
  - source: "Migration Product Managers"
    destination: "Azure API Management"
    description: "Monitors migration workflows via portal"
    technology: "HTTPS / TLS"
  - source: "Azure API Management"
    destination: "Customer Portal"
    description: "Routes traffic to portal"
    technology: "HTTPS"
  - source: "Azure API Management"
    destination: "Adjuster Workspace"
    description: "Routes traffic to workspace"
    technology: "HTTPS"
  - source: "Azure API Management"
    destination: "Microsoft Entra ID"
    description: "Validates OIDC tokens"
    technology: "OIDC / OAuth 2.0"
  - source: "Adjuster Workspace"
    destination: "Azure SQL Database"
    description: "Queries data for sub-2s reads"
    technology: "ADO.NET / TLS"
  - source: "Claims Core Engine"
    destination: "Azure Service Bus Topics"
    description: "Publishes claim events"
    technology: "AMQP over TLS"
  - source: "Routing & Integration Service"
    destination: "Claims Core Engine"
    description: "Evaluates and routes claim types"
    technology: "Internal API"
  - source: "Claims Core Engine"
    destination: "Legacy Mainframe"
    description: "Connects to legacy mainframe via hybrid connection"
    technology: "Azure ExpressRoute with IPsec VPN"