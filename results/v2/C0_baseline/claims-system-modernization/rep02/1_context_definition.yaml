level: context
scope: "System Context diagram for Insurance Claims Modernization Platform"
system:
  name: "Insurance Claims Modernization Platform"
  description: "Hybrid solution that gradually replaces a legacy mainframe system while ensuring uninterrupted operations, secure digital claim submissions, and high-performance adjuster workflows."
elements:
  - type: "person"
    name: "Customers / Brokers"
    description: "External users submitting claims online via web interfaces."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff processing claims in the new web application."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "30-year-old COBOL/DB2 system of record (IBM z/OS)."
  - type: "externalSystem"
    name: "Active Directory / Microsoft Entra ID"
    description: "Identity provider for Single Sign-On and federated authentication."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system handling claim payouts."
relationships:
  - source: "Customers / Brokers"
    destination: "Insurance Claims Modernization Platform"
    description: "Submit claims"
    technology: "HTTPS / TLS 1.3, OIDC/OAuth 2.0"
  - source: "Claims Adjusters"
    destination: "Insurance Claims Modernization Platform"
    description: "Process claims"
    technology: "HTTPS / TLS 1.3, OIDC/OAuth 2.0"
  - source: "Insurance Claims Modernization Platform"
    destination: "Legacy Mainframe"
    description: "Synchronize claims and process transactions"
    technology: "SFTP / MQ via On-Premises Gateway"
  - source: "Insurance Claims Modernization Platform"
    destination: "Active Directory / Microsoft Entra ID"
    description: "Federated authentication"
    technology: "SAML/OIDC"
  - source: "Insurance Claims Modernization Platform"
    destination: "Payment Gateway"
    description: "Process payouts"
    technology: "REST / HTTPS API"