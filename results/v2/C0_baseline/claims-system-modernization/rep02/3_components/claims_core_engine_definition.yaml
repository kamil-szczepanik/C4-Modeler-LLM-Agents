level: component
scope: "Component diagram for the Claims Core Engine container"
parentContainer:
  name: "Claims Core Engine"
elements:
  - type: "component"
    name: "Claim Processing Service"
    technology: "Spring MVC/WebFlux"
    description: "Replaces legacy workflows using microservices and processes claims incrementally."
  - type: "component"
    name: "Anti-Corruption Layer (ACL) Component"
    technology: "Java / Spring Boot, Resilience4j"
    description: "Safely bridges modern cloud components with the legacy mainframe, transmitting tokenized payloads."
  - type: "component"
    name: "Parameterized Business Rules"
    technology: "Azure SQL"
    description: "Manages parameterized business rules and stateless transactions."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Spring Cloud Stream"
    description: "Publishes fine-grained domain audit events."
relationships:
  - source: "Claim Processing Service"
    destination: "Microsoft Entra ID"
    description: "Validates OAuth2/OIDC JWT tokens [HTTPS]"
  - source: "Claims Core Engine"
    destination: "Azure SQL Database"
    description: "Manages stateless transactions and parameterized rules [TDS over TLS 1.3]"
  - source: "Anti-Corruption Layer (ACL) Component"
    destination: "Legacy Mainframe"
    description: "Transmits tokenized payloads [Azure ExpressRoute with IPsec VPN, mTLS]"
  - source: "Event Publisher Component"
    destination: "Azure Service Bus Topics"
    description: "Publishes fine-grained domain audit events [AMQP over TLS]"