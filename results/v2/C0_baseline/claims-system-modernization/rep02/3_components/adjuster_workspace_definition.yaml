level: component
scope: "Component diagram for the Adjuster Workspace container"
parentContainer:
  name: "Adjuster Workspace"
elements:
  - type: "component"
    name: "Claim Submission UI"
    technology: "Angular"
    description: "Provides responsive user interfaces for online claim submissions and adjuster workflows."
  - type: "component"
    name: "API Client Service"
    technology: "TypeScript / REST/HTTPS"
    description: "Routes all reads, commands, and document previews to the API management gateway."
  - type: "component"
    name: "Authentication Client"
    technology: "OIDC / PKCE"
    description: "Authenticates users via Microsoft Entra ID using Authorization Code Flow with PKCE."
relationships:
  - source: "Claim Submission UI"
    destination: "API Client Service"
    description: "Invokes REST/HTTPS requests"
  - source: "API Client Service"
    destination: "Azure API Management"
    description: "Routes reads, commands, and document previews via REST/HTTPS (TLS 1.3)"
  - source: "Claim Submission UI"
    destination: "Authentication Client"
    description: "Triggers user authentication"
  - source: "Authentication Client"
    destination: "Microsoft Entra ID"
    description: "Authenticates users via OIDC"