level: component
scope: "Component diagram for the Business Analytics & Reporting container"
parentContainer:
  name: "Business Analytics & Reporting"
elements:
  - type: "component"
    name: "ETL Ingestion Worker"
    technology: "Azure Functions / Python"
    description: "Executes lightweight event ingestion and mainframe batch extraction workers."
  - type: "component"
    name: "Transform & Load Component"
    technology: "Azure Data Factory"
    description: "Manages declarative data pipelines to ensure processing finishes within the 23:00-05:00 batch window."
  - type: "component"
    name: "Data Warehouse Store"
    technology: "Azure SQL Database"
    description: "Provides relational storage and star schema for unified reporting with minimal cloud learning curve."
  - type: "component"
    name: "Semantic & Reporting Model"
    technology: "Power BI Embedded"
    description: "Delivers role-based executive dashboards with Entra ID pass-through RLS."
relationships:
  - source: "ETL Ingestion Worker"
    destination: "Data Warehouse Store"
    description: "Writes to Azure SQL Staging Schema via T-SQL"
  - source: "Transform & Load Component"
    destination: "Data Warehouse Store"
    description: "Updates Data Warehouse Store via T-SQL Stored Procedures"
  - source: "Semantic & Reporting Model"
    destination: "Data Warehouse Store"
    description: "Queries Data Warehouse Store via T-SQL with Row-Level Security"