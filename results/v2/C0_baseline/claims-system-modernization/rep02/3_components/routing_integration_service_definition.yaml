level: component
scope: "Component diagram for the Routing & Integration Service container"
parentContainer:
  name: "Routing & Integration Service"
elements:
  - type: "component"
    name: "Router Dispatcher"
    technology: ".NET isolated worker"
    description: "Orchestrates claim routing and queries routing rules from configuration."
  - type: "component"
    name: "Configuration Cache"
    technology: "Azure App Configuration"
    description: "Stores claim-type routing toggles for instant runtime switching."
  - type: "component"
    name: "Legacy Adapter"
    technology: "HTTP Client"
    description: "Forwards unmigrated claims to the legacy mainframe via secure tunnel."
  - type: "component"
    name: "Audit Logger Component"
    technology: ".NET Background Service"
    description: "Performs background logging and auditing for routing operations."
relationships:
  - source: "Router Dispatcher"
    destination: "Configuration Cache"
    description: "Queries routing rules [Azure App Configuration SDK]"
  - source: "Router Dispatcher"
    destination: "Azure Service Bus Topics"
    description: "Publishes claim events [AMQP / TLS 1.3]"
  - source: "Legacy Adapter"
    destination: "Legacy Mainframe"
    description: "Forwards unmigrated claims [Mutual TLS (mTLS) / Secure Hybrid Tunnel / VPN]"
  - source: "Legacy Adapter"
    destination: "Azure Key Vault"
    description: "Retrieves rotating credentials and certificates [Managed Identity / REST]"