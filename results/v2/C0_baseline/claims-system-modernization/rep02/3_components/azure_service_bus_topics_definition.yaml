level: component
scope: "Component diagram for the Azure Service Bus Topics container"
parentContainer:
  name: "Azure Service Bus Topics"
elements:
  - type: "component"
    name: "Topic Router"
    technology: "Azure Service Bus Topics"
    description: "Publishes and routes claim events with Session IDs for data consistency and duplicate detection."
  - type: "component"
    name: "Subscription Filters"
    technology: "Azure Service Bus Subscriptions"
    description: "Dispatches events using peek-lock mode to downstream services."
  - type: "component"
    name: "Dead-Letter Manager"
    technology: "Azure Service Bus Dead-Letter Queue"
    description: "Handles message failures and alerts on issues."
relationships:
  - source: "Claims Core Engine"
    destination: "Topic Router"
    description: "Publishes claim events with Session IDs [AMQP over TLS]"
  - source: "Subscription Filters"
    destination: "Routing & Integration Service"
    description: "Dispatches events using peek-lock mode [AMQP over TLS]"
  - source: "Dead-Letter Manager"
    destination: "Claims Core Engine"
    description: "Alerts on message failures [AMQP over TLS]"