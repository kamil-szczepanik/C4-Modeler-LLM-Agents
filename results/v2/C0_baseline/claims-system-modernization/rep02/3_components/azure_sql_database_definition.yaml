level: component
scope: "Component diagram for the Azure SQL Database container"
parentContainer:
  name: "Azure SQL Database"
elements:
  - type: "component"
    name: "Claims Read-Model Store"
    technology: "Relational tables with isolated schemas by claim type"
    description: "CQRS read-model storage providing sub-2s adjuster views and isolated schemas by claim type."
  - type: "component"
    name: "Azure SQL Database Serverless"
    technology: "Azure SQL Database Serverless with geo-replication"
    description: "Cost-effective scaling and high availability engine supporting the read-model store."
relationships:
  - source: "Claims Core Engine"
    destination: "Claims Read-Model Store"
    description: "Writes projector updates [JDBC / TLS 1.3 over Private Endpoint]"
  - source: "Adjuster Workspace"
    destination: "Claims Read-Model Store"
    description: "Executes low-latency read queries [ADO.NET / TLS 1.3 over Private Endpoint]"
  - source: "Azure SQL Database"
    destination: "Azure Key Vault"
    description: "Manages encryption keys [HTTPS / REST over Private Endpoint]"