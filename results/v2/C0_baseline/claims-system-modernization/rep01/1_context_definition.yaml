level: context
scope: "System Context diagram for New Claims Platform"
system:
  name: "New Claims Platform"
  description: "Cloud-native containerized application modernizing a 30-year-old COBOL/DB2 mainframe claims platform by gradually migrating claim types to a cloud-native Azure architecture."
elements:
  - type: "person"
    name: "Policyholders and Brokers"
    description: "External users submitting claims online via mobile/web UI."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users managing claims via a high-performance web application."
  - type: "externalSystem"
    name: "API Gateway / Integration Layer"
    description: "Hybrid routing and abstraction barrier managing legacy decoupling."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premises COBOL/DB2 system remaining the system of record."
  - type: "externalSystem"
    name: "Insurer Active Directory / Microsoft Entra ID"
    description: "Identity provider managing authentication and SSO."
relationships:
  - source: "Policyholders and Brokers"
    destination: "New Claims Platform"
    description: "Interact with the New Claims Platform online"
    technology: "HTTPS"
  - source: "Claims Adjusters"
    destination: "New Claims Platform"
    description: "Manage claims via high-performance web application"
    technology: "HTTPS"
  - source: "New Claims Platform"
    destination: "API Gateway / Integration Layer"
    description: "Communicates with the API Gateway for hybrid routing"
    technology: "REST over HTTPS"
  - source: "API Gateway / Integration Layer"
    destination: "Legacy Mainframe"
    description: "Interfaces with the legacy system of record"
    technology: "native TCP/SNA/DB2 protocols via mTLS"
  - source: "New Claims Platform"
    destination: "Insurer Active Directory / Microsoft Entra ID"
    description: "Integrates for federated single sign-on"
    technology: "OIDC/OAuth2"