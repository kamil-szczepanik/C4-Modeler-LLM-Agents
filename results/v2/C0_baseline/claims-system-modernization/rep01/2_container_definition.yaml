level: container
scope: "Container diagram for New Claims Platform"
system:
  name: "New Claims Platform"
elements:
  - type: "person"
    name: "Policyholders and Brokers"
    description: "External users submitting claims online via mobile/web UI."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users managing claims via a high-performance web application."
  - type: "externalSystem"
    name: "API Gateway / On-Premise Mainframe"
    description: "On-premises COBOL/DB2 system remaining the system of record with API gateway routing."
  - type: "externalSystem"
    name: "Microsoft Entra ID"
    description: "Identity provider enforcing Single Sign-On (SSO) and RBAC/ABAC security controls."
  - type: "container"
    name: "Customer Portal"
    technology: "React SPA hosted in Azure Static Web Apps"
    description: "Allows policyholders and brokers to interact with the claims platform."
  - type: "container"
    name: "Adjuster Web Application"
    technology: "Node.js / ASP.NET Core BFF"
    description: "Backend-for-Frontend application supporting claims adjusters."
  - type: "container"
    name: "PostgreSQL Read-Cache"
    technology: "PostgreSQL"
    description: "Delivers sub-2s read-model caching to decouple from mainframe latency."
  - type: "container"
    name: "Claims Processing Service"
    technology: ".NET Core microservices"
    description: "Handling core domain logic and claims modernization."
  - type: "container"
    name: "Anti-Corruption Layer (ACL)"
    technology: "Integration service"
    description: "Translates modern events to legacy formats for mainframe integration."
  - type: "container"
    name: "Migration Operations Dashboard"
    technology: "React SPA and .NET Core API"
    description: "Used for business reconciliation and migration monitoring."
  - type: "container"
    name: "Messaging & Infrastructure"
    technology: "Azure Service Bus, Azure Container Apps, Azure Key Vault"
    description: "Provides asynchronous messaging, container hosting, and secret management."
relationships:
  - source: "Policyholders and Brokers"
    destination: "Customer Portal"
    description: "Accesses portal to submit and manage claims"
    technology: "HTTPS (TLS 1.3)"
  - source: "Claims Adjusters"
    destination: "Adjuster Web Application"
    description: "Manages claims and views operational data"
    technology: "HTTPS (TLS 1.3) with OpenID Connect / OAuth 2.0"
  - source: "Adjuster Web Application"
    destination: "PostgreSQL Read-Cache"
    description: "Reads and caches claims data for low latency"
    technology: "TCP / TLS"
  - source: "Claims Processing Service"
    destination: "Messaging & Infrastructure"
    description: "Publishes and consumes asynchronous messages"
    technology: "AMQP / HTTPS"
  - source: "Anti-Corruption Layer (ACL)"
    destination: "API Gateway / On-Premise Mainframe"
    description: "Translates and communicates with legacy system of record"
    technology: "gRPC over mTLS and secure IP whitelisting"
  - source: "Claims Adjusters"
    destination: "Microsoft Entra ID"
    description: "Authenticates via SSO"
    technology: "OpenID Connect / OAuth 2.0"