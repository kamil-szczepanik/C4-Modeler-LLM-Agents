level: component
scope: "Component diagram for the Adjuster Web Application container"
parentContainer:
  name: "Adjuster Web Application"
elements:
  - type: "component"
    name: "Auth & Session Component"
    technology: "ASP.NET Core / Microsoft Entra ID"
    description: "Authenticates users and manages sessions via OpenID Connect and OAuth 2.0."
  - type: "component"
    name: "Claim Presentation & Triage Component"
    technology: "ASP.NET Core BFF"
    description: "Queries optimized view models from the PostgreSQL Read-Cache to deliver sub-2-second screen loads."
  - type: "component"
    name: "Command & Workflow Component"
    technology: "ASP.NET Core / Azure Service Bus"
    description: "Dispatches asynchronous commands to the messaging infrastructure."
  - type: "component"
    name: "Telemetry Component"
    technology: "OpenTelemetry & Prometheus"
    description: "Provides hybrid observability and telemetry tracking."
relationships:
  - source: "Claims Adjusters"
    destination: "Auth & Session Component"
    description: "Authenticates and exchanges tokens [HTTPS / OIDC]"
  - source: "Auth & Session Component"
    destination: "Microsoft Entra ID"
    description: "Validates credentials and tokens [HTTPS / OIDC]"
  - source: "Claim Presentation & Triage Component"
    destination: "PostgreSQL Read-Cache"
    description: "Queries optimized view models [TCP / TLS]"
  - source: "Command & Workflow Component"
    destination: "Azure Service Bus"
    description: "Dispatches asynchronous commands [AMQP / TLS]"
  - source: "Telemetry Component"
    destination: "Adjuster Web Application"
    description: "Monitors and tracks application telemetry"