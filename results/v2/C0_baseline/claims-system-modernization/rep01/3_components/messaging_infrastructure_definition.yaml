level: component
scope: "Component diagram for the Messaging & Infrastructure container"
parentContainer:
  name: "Messaging & Infrastructure"
elements:
  - type: "component"
    name: "Message Broker Interface"
    technology: "Azure Service Bus (AMQP 1.0)"
    description: "Provides reliable asynchronous messaging and Dead-Letter Queues to ensure zero claim loss during migration."
  - type: "component"
    name: "Container Runtime Host"
    technology: "Azure Container Apps with KEDA"
    description: "Hosts microservices and provides event-driven scaling."
  - type: "component"
    name: "Secret & Config Store"
    technology: "Azure Key Vault"
    description: "Handles credentials, connection strings, and automated secret rotation."
  - type: "component"
    name: "Audit & Telemetry Forwarder"
    technology: "Azure Monitor and OpenTelemetry"
    description: "Emits and forwards traces and audit logs."
  - type: "component"
    name: "Storage Sink"
    technology: "Azure Blob Storage with WORM policies"
    description: "Stores immutable audit logs to satisfy insurance compliance standards."
relationships:
  - source: "Claims Processing Service"
    destination: "Message Broker Interface"
    description: "Publishes and consumes claim events [AMQP 1.0]."
  - source: "Container Runtime Host"
    destination: "Audit & Telemetry Forwarder"
    description: "Emits traces and audit logs [HTTPS]."
  - source: "Container Runtime Host"
    destination: "Message Broker Interface"
    description: "Authenticates via Microsoft Entra ID Managed Identities [mTLS / Private Endpoints]."
  - source: "Container Runtime Host"
    destination: "Secret & Config Store"
    description: "Authenticates via Microsoft Entra ID Managed Identities [mTLS / Private Endpoints]."