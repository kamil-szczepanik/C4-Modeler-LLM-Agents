level: component
scope: "Component diagram for the Claims Processing Service container"
parentContainer:
  name: "Claims Processing Service"
elements:
  - type: "component"
    name: "Claim Orchestrator Component"
    technology: ".NET Core"
    description: "Orchestrates claim processing workflows and coordinates business transactions."
  - type: "component"
    name: "Claim Domain Model Component"
    technology: ".NET Core"
    description: "Encapsulates the core business logic and domain rules for claims."
  - type: "component"
    name: "Exception Handler Component"
    technology: ".NET Core"
    description: "Handles exceptions, failures, and manages dead-letter routing."
  - type: "component"
    name: "Integration Client Component"
    technology: ".NET Core with Polly"
    description: "Manages communication with external systems and the Anti-Corruption Layer."
relationships:
  - source: "Claim Orchestrator Component"
    destination: "Claim Domain Model Component"
    description: "Executes business logic"
  - source: "Claim Orchestrator Component"
    destination: "Exception Handler Component"
    description: "Delegates error handling"
  - source: "Claim Orchestrator Component"
    destination: "Integration Client Component"
    description: "Dispatches external calls and messaging"