level: component
scope: "Component diagram for the Anti-Corruption Layer (ACL) container"
parentContainer:
  name: "Anti-Corruption Layer (ACL)"
elements:
  - type: "component"
    name: "Service Bus Message Listener"
    technology: ".NET Core / Azure Service Bus SDK"
    description: "Listens for claim migration and processing events from the Azure Service Bus."
  - type: "component"
    name: "JSON-to-COBOL Mapper"
    technology: ".NET Core Library"
    description: "Translates modern JSON payloads into mainframe-compatible COBOL structures."
  - type: "component"
    name: "Replay Coordinator"
    technology: ".NET Core API Controller"
    description: "Manages claim replays and coordinates with the Migration Operations Dashboard via REST over HTTPS with Entra ID JWT validation."
  - type: "component"
    name: "gRPC Mainframe Client"
    technology: "gRPC / .NET Core"
    description: "Communicates securely with the Legacy Mainframe using gRPC over mTLS, utilizing secrets from Azure Key Vault."
relationships:
  - source: "Service Bus Message Listener"
    destination: "JSON-to-COBOL Mapper"
    description: "Forwards incoming messages for translation"
  - source: "JSON-to-COBOL Mapper"
    destination: "gRPC Mainframe Client"
    description: "Passes mapped COBOL data for legacy processing"
  - source: "Replay Coordinator"
    destination: "JSON-to-COBOL Mapper"
    description: "Triggers data mapping for claim replays"