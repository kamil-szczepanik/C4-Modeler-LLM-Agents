level: component
scope: "Component diagram for the PostgreSQL Read-Cache container"
parentContainer:
  name: "PostgreSQL Read-Cache"
elements:
  - type: "component"
    name: "Cache Storage Engine"
    technology: "Azure Database for PostgreSQL Flexible Server"
    description: "Managed database instance that caches mainframe data for modern adjusters to ensure sub-2-second response times."
  - type: "component"
    name: "Sync Consumer Component"
    technology: ".NET worker hosted in Azure Container Apps"
    description: "Ingests delta change events from the messaging broker and writes updates to the cache storage engine via connection pooling."
  - type: "component"
    name: "Audit & Versioning Manager"
    technology: ".NET Library / Service Layer"
    description: "Manages audit trails and versioning for data synchronization and compliance."
relationships:
  - source: "Sync Consumer Component"
    destination: "Cache Storage Engine"
    description: "Writes updates via connection pooling [TCP / TLS 1.3]"
  - source: "Cache Storage Engine"
    destination: "Audit & Versioning Manager"
    description: "Invokes audit and versioning checks for data modifications"