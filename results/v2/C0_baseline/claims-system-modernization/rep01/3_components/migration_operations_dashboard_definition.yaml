level: component
scope: "Component diagram for the Migration Operations Dashboard container"
parentContainer:
  name: "Migration Operations Dashboard"
elements:
  - type: "component"
    name: "Dashboard UI"
    technology: "React SPA"
    description: "Provides real-time visibility, reconciliation alerts, and kill-switch controls for the migration transition."
  - type: "component"
    name: "Dashboard API Controller"
    technology: ".NET Core Web API"
    description: "Exposes endpoints for the UI and invokes backend domain logic via MediatR."
  - type: "component"
    name: "Reconciliation Engine"
    technology: ".NET Core Component"
    description: "Queries the PostgreSQL Read-Cache and Legacy Mainframe to compare data and generate reconciliation metrics."
  - type: "component"
    name: "Kill-Switch Orchestrator"
    technology: ".NET Core Component"
    description: "Manages kill-switch controls and publishes operational commands."
  - type: "component"
    name: "Reconciliation Report Generator"
    technology: ".NET Core Component"
    description: "Generates reconciliation reports and manages file storage."
  - type: "component"
    name: "Discrepancy Translation Service"
    technology: ".NET Core Component"
    description: "Translates and processes discrepancy data between systems."
relationships:
  - source: "Dashboard UI"
    destination: "Dashboard API Controller"
    description: "Interacts via HTTPS/REST and SignalR"
  - source: "Dashboard API Controller"
    destination: "Reconciliation Engine"
    description: "Invokes via MediatR domain events"
  - source: "Reconciliation Engine"
    destination: "PostgreSQL Read-Cache"
    description: "Queries via EF Core"
  - source: "Reconciliation Engine"
    destination: "Anti-Corruption Layer (ACL)"
    description: "Queries Legacy Mainframe data via"
  - source: "Kill-Switch Orchestrator"
    destination: "Azure Service Bus"
    description: "Publishes domain events to"
  - source: "Reconciliation Report Generator"
    destination: "Azure Blob Storage"
    description: "Stores and retrieves files in"