# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Insurance Claims Modernization Platform"
system:
  name: "Insurance Claims Modernization Platform"
elements:
  - type: "person"
    name: "End Customers & Brokers"
    description: "External users who submit and manage insurance claims."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users who review, process, and manage insurance claims."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "30-year-old z/OS, DB2, and CICS system acting as the system of record."
  - type: "externalSystem"
    name: "Corporate Active Directory"
    description: "Microsoft Entra ID / AD providing centralized IAM for SSO and RBAC."
  - type: "container"
    name: "API Gateway"
    technology: "Azure API Management / NGINX"
    description: "Provides dynamic routing, rate-limiting, and SSO validation."
  - type: "container"
    name: "Customer Portal"
    technology: "React / Node.js"
    description: "Enables online customer submissions and management."
  - type: "container"
    name: "Adjuster Workspace"
    technology: "React / .NET Core API"
    description: "Low-latency adjuster workflows including Operations Dashboard."
  - type: "container"
    name: "Integration & Anti-Corruption Layer"
    technology: ".NET Core / MassTransit"
    description: "Decouples legacy dependencies and ensures zero lost claims."
  - type: "container"
    name: "Claim Read Model Database"
    technology: "Azure Cosmos DB"
    description: "Low-latency read models supporting sub-2-second UI requirements."
  - type: "container"
    name: "Configuration & Feature Store"
    technology: "Azure App Configuration / Redis"
    description: "Managing feature flags and one-day claim-type fallbacks."
relationships:
  - source: "End Customers & Brokers"
    destination: "API Gateway"
    description: "Accesses customer portal and submits claims"
    technology: "HTTPS/REST"
  - source: "Claims Adjusters"
    destination: "API Gateway"
    description: "Accesses adjuster workspace and processes claims"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "Customer Portal"
    description: "Routes customer traffic"
    technology: "Internal HTTPS"
  - source: "API Gateway"
    destination: "Adjuster Workspace"
    description: "Routes adjuster traffic"
    technology: "Internal HTTPS"
  - source: "API Gateway"
    destination: "Corporate Active Directory"
    description: "Validates SSO and authentication"
    technology: "OIDC/OAuth2"
  - source: "Customer Portal"
    destination: "API Gateway"
    description: "Calls backend APIs"
    technology: "HTTPS/REST"
  - source: "Adjuster Workspace"
    destination: "API Gateway"
    description: "Calls backend APIs"
    technology: "HTTPS/REST"
  - source: "Adjuster Workspace"
    destination: "Claim Read Model Database"
    description: "Reads claim data for low-latency views"
    technology: "TCP/NoSQL"
  - source: "Integration & Anti-Corruption Layer"
    destination: "Legacy Mainframe"
    description: "Synchronizes data and migrates secure claim-types"
    technology: "MQ/Enterprise Service Bus over mTLS"
  - source: "API Gateway"
    destination: "Integration & Anti-Corruption Layer"
    description: "Forwards integration requests"
    technology: "Internal HTTPS/gRPC"