level: context
scope: "System Context diagram for Insurance Claims Modernization Platform"
system:
  name: "Insurance Claims Modernization Platform"
  description: "A modern Azure-hosted web application that gradually replaces a 30-year-old COBOL/DB2 mainframe, enabling incremental claim-type migration while the legacy system maintains the system of record."
elements:
  - type: "person"
    name: "End Customers & Brokers"
    description: "External users who submit and manage insurance claims."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users who review, process, and manage insurance claims."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "30-year-old z/OS, DB2, and CICS system acting as the system of record."
  - type: "externalSystem"
    name: "Corporate Active Directory"
    description: "Microsoft Entra ID / AD providing centralized IAM for SSO and RBAC."
  - type: "externalSystem"
    name: "Notification Service"
    description: "SendGrid / Azure Communication Services for handling notifications."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Regional Banking API for processing financial transactions."
relationships:
  - source: "End Customers & Brokers"
    destination: "Insurance Claims Modernization Platform"
    description: "Submit and manage claims"
    technology: "HTTPS"
  - source: "Claims Adjusters"
    destination: "Insurance Claims Modernization Platform"
    description: "Review and process claims"
    technology: "HTTPS"
  - source: "Insurance Claims Modernization Platform"
    destination: "Legacy Mainframe"
    description: "Synchronize claims data and maintain system of record"
    technology: "Asynchronous messaging / ETL via secure gateway with mTLS"
  - source: "Insurance Claims Modernization Platform"
    destination: "Corporate Active Directory"
    description: "Authenticate users and authorize roles"
    technology: "OIDC/SAML"
  - source: "Insurance Claims Modernization Platform"
    destination: "Notification Service"
    description: "Send notifications to users"
    technology: "HTTPS"
  - source: "Insurance Claims Modernization Platform"
    destination: "Payment Gateway"
    description: "Process claim payments"
    technology: "REST/JSON over mTLS with payload signatures"