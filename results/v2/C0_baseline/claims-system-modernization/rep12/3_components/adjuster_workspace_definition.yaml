level: component
scope: "Component diagram for the Adjuster Workspace container"
parentContainer:
  name: "Adjuster Workspace"
elements:
  - type: "component"
    name: "Adjuster UI"
    technology: "React"
    description: "Provides the user interface for claims adjusters to review and manage claim data."
  - type: "component"
    name: "Adjuster API Backend"
    technology: ".NET Core API"
    description: "Orchestrates adjuster workflows and validates Single Sign-On against Corporate Active Directory."
relationships:
  - source: "Adjuster UI"
    destination: "Adjuster API Backend"
    description: "Routes adjuster traffic [Internal HTTPS]"
  - source: "Adjuster API Backend"
    destination: "Corporate Active Directory"
    description: "Validates Single Sign-On [OIDC / OAuth2 / TLS 1.3]"
  - source: "Adjuster API Backend"
    destination: "Claim Read Model Database"
    description: "Reads claim data [TCP / Cosmos DB Direct Mode]"