level: component
scope: "Component diagram for the Integration & Anti-Corruption Layer container"
parentContainer:
  name: "Integration & Anti-Corruption Layer"
elements:
  - type: "component"
    name: "Translation Engine"
    technology: ".NET Core / FluentValidation"
    description: "Validates and translates modern claims data formats into legacy-compatible payloads."
  - type: "component"
    name: "Outbox Processor"
    technology: "MassTransit / Entity Framework Core / Azure SQL Serverless"
    description: "Implements the Transactional Outbox pattern to ensure reliable message delivery and prevent lost claims."
  - type: "component"
    name: "Async Sync Worker"
    technology: "MassTransit / Polly"
    description: "Handles asynchronous synchronization workflows with retry policies and resilience."
  - type: "component"
    name: "Routing & Feature Router"
    technology: "Azure App Configuration"
    description: "Manages dynamic feature flags and routing for gradual claim-type migration and rollbacks."
relationships:
  - source: "Translation Engine"
    destination: "Outbox Processor"
    description: "Passes validated and translated payloads for reliable outbox persistence."
  - source: "Outbox Processor"
    destination: "Async Sync Worker"
    description: "Dispatches asynchronous messages for synchronization."
  - source: "Routing & Feature Router"
    destination: "Translation Engine"
    description: "Provides feature flags and routing rules to guide translation and processing."