level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Azure API Management"
    technology: "Azure API Management / NGINX"
    description: "Provides dynamic path-based routing, WAF integration, and rate limiting."
  - type: "component"
    name: "Authentication & SSO Handler"
    technology: "OIDC/OAuth2"
    description: "Validates SSO and authentication against Corporate Active Directory."
  - type: "component"
    name: "Routing & Configuration Engine"
    technology: "Internal HTTPS/REST, Redis"
    description: "Fetches active routing rules from the Configuration & Feature Store, cached locally."
  - type: "component"
    name: "Secrets Management Client"
    technology: "Azure Managed Identity / HTTPS"
    description: "Retrieves certificates and OAuth secrets from Azure Key Vault."
relationships:
  - source: "Azure API Management"
    destination: "Authentication & SSO Handler"
    description: "Validates SSO and authentication [OIDC/OAuth2]"
  - source: "Azure API Management"
    destination: "Routing & Configuration Engine"
    description: "Fetches active routing rules [Internal HTTPS/REST, cached locally]"
  - source: "Azure API Management"
    destination: "Secrets Management Client"
    description: "Retrieves certificates and OAuth secrets [Azure Managed Identity / HTTPS]"