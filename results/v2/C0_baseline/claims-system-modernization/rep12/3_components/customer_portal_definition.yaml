level: component
scope: "Component diagram for the Customer Portal container"
parentContainer:
  name: "Customer Portal"
elements:
  - type: "component"
    name: "Claims SPA Component"
    technology: "React, TypeScript"
    description: "Frontend user interface for customer and broker claim submissions."
  - type: "component"
    name: "Claim Validation & Mapping Component"
    technology: "Node.js, Zod"
    description: "Handles server-side schema validation for input sanitization and payload mapping."
  - type: "component"
    name: "BFF Routing & Session Component"
    technology: "Node.js, Express"
    description: "Backend-for-Frontend (BFF) handling sessions, API aggregation, and proxying authenticated requests."
relationships:
  - source: "Claims SPA Component"
    destination: "Claim Validation & Mapping Component"
    description: "Validates payloads locally [In-process]"
  - source: "Claim Validation & Mapping Component"
    destination: "BFF Routing & Session Component"
    description: "Passes validated claim data [In-process]"
  - source: "BFF Routing & Session Component"
    destination: "API Gateway"
    description: "Proxies authenticated requests [HTTPS / REST]"