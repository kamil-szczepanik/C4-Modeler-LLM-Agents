level: component
scope: "Component diagram for the Web Frontend (SPA) container"
parentContainer:
  name: "Web Frontend (SPA)"
elements:
  - type: "component"
    name: "React SPA UI"
    technology: "React, Azure Static Web Apps"
    description: "Renders user interfaces for end customers, brokers, claims adjusters, and migration product owners."
  - type: "component"
    name: "Authentication Manager"
    technology: "MSAL.react, OIDC/OAuth2, PKCE"
    description: "Implements authentication and Azure AD integration via Authorization Code Flow with PKCE."
  - type: "component"
    name: "State Caching Manager"
    technology: "TanStack Query"
    description: "Provides local state caching to meet sub-2s performance requirements despite slow mainframe responses."
  - type: "component"
    name: "Offline Draft Storage"
    technology: "IndexedDB, Web Crypto API (AES-GCM)"
    description: "Secures offline claim drafts locally on the client."
  - type: "component"
    name: "Telemetry & Monitoring"
    technology: "Azure Application Insights"
    description: "Tracks client-side performance and telemetry with automated PII scrubbing."
relationships:
  - source: "React SPA UI"
    destination: "Authentication Manager"
    description: "Authenticates users and handles tokens [OIDC/OAuth2]"
  - source: "React SPA UI"
    destination: "State Caching Manager"
    description: "Caches API responses and local state [TanStack Query]"
  - source: "React SPA UI"
    destination: "Offline Draft Storage"
    description: "Persists encrypted claim drafts locally [IndexedDB / AES-GCM]"
  - source: "React SPA UI"
    destination: "Telemetry & Monitoring"
    description: "Sends telemetry and performance metrics [HTTPS]"