level: component
scope: "Component diagram for the Integration & Transformation Worker container"
parentContainer:
  name: "Integration & Transformation Worker"
elements:
  - type: "component"
    name: "Kafka Event Consumer"
    technology: "Apache Kafka / AMQP (SASL/SCRAM or mTLS)"
    description: "Reads events from the Mainframe Anti-Corruption Layer."
  - type: "component"
    name: "Schema & Policy Mapper"
    technology: "gRPC/HTTPS, OpenTelemetry SDK"
    description: "Maps schemas and policies, queries state, dispatches protocols, and emits telemetry."
  - type: "component"
    name: "Idempotency & State Manager"
    technology: "TLS-encrypted TCP (port 6380), Azure Cache for Redis"
    description: "Provides high-performance state storage for idempotency and duplicate prevention."
  - type: "component"
    name: "Mainframe Protocol Dispatcher"
    technology: "gRPC/HTTPS, Polly (Circuit Breaker)"
    description: "Sends payloads to the mainframe integration with circuit breaking protection."
  - type: "component"
    name: "Reconciliation & Audit Publisher"
    technology: "OpenTelemetry SDK, HTTPS"
    description: "Exports metrics and audit data to operational observability."
relationships:
  - source: "Kafka Event Consumer"
    destination: "Mainframe Anti-Corruption Layer (ACL)"
    description: "Reads from via Apache Kafka / AMQP"
  - source: "Schema & Policy Mapper"
    destination: "Idempotency & State Manager"
    description: "Queries via TLS-encrypted TCP"
  - source: "Schema & Policy Mapper"
    destination: "Mainframe Protocol Dispatcher"
    description: "Sends payloads via gRPC/HTTPS"
  - source: "Schema & Policy Mapper"
    destination: "Reconciliation & Audit Publisher"
    description: "Emits telemetry via OpenTelemetry SDK"
  - source: "Reconciliation & Audit Publisher"
    destination: "Operational Observability & Dead-Letter Container"
    description: "Exports metrics via HTTPS"
  - source: "Integration & Transformation Worker"
    destination: "Azure Key Vault"
    description: "Retrieves secrets via Managed Identities (HTTPS)"