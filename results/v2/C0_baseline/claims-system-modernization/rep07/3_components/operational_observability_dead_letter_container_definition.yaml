level: component
scope: "Component diagram for the Operational Observability & Dead-Letter Container container"
parentContainer:
  name: "Operational Observability & Dead-Letter Container"
elements:
  - type: "component"
    name: "Dead-Letter Consumer Component"
    technology: ".NET 8 Worker"
    description: "Consumes failed messages from Azure Service Bus / Event Hubs DLQs via AMQP."
  - type: "component"
    name: "Re-drive Engine Component"
    technology: ".NET 8 Minimal API"
    description: "Manages and re-drives failed message delivery."
  - type: "component"
    name: "Metrics & Tracing Collector"
    technology: "OpenTelemetry / Azure Monitor exporter"
    description: "Exports telemetry to Azure Monitor over HTTPS for centralized system health and distributed tracing."
  - type: "component"
    name: "Operations API Component"
    technology: ".NET 8 Minimal API"
    description: "Exposes secure HTTPS endpoints for the Claims API Gateway and Operations Managers."
  - type: "component"
    name: "Payload Normalization & Enrichment Component"
    technology: ".NET 8"
    description: "Stores enriched payloads in Azure Blob Storage with HTTPS."
relationships:
  - source: "Dead-Letter Consumer Component"
    destination: "Azure Service Bus / Event Hubs DLQs"
    description: "Consumes failed messages via AMQP."
  - source: "Operations API Component"
    destination: "Claims API Gateway"
    description: "Exposes secure HTTPS endpoints for."
  - source: "Payload Normalization & Enrichment Component"
    destination: "Azure Blob Storage"
    description: "Stores enriched payloads with HTTPS."
  - source: "Metrics & Tracing Collector"
    destination: "Azure Monitor"
    description: "Exports telemetry over HTTPS."