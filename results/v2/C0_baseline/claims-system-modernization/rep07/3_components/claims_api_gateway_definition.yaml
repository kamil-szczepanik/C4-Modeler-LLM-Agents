level: component
scope: "Component diagram for the Claims API Gateway container"
parentContainer:
  name: "Claims API Gateway"
elements:
  - type: "component"
    name: "JWT Validation Policy Component"
    technology: "Azure API Management Policy / Azure AD"
    description: "Validates tokens against Azure AD / Entra ID."
  - type: "component"
    name: "Rate Limiting & Throttling Component"
    technology: "Azure API Management Policy"
    description: "Enforces persona-based quotas."
  - type: "component"
    name: "Claims-Based Authorization Policy Component"
    technology: "Azure API Management Policy"
    description: "Enforces RBAC separation."
  - type: "component"
    name: "mTLS & Secure Connector Component"
    technology: "Azure API Management TLS Profiles"
    description: "Manages certificate-based outbound trust."
  - type: "component"
    name: "Distributed Tracing Injector Component"
    technology: "OpenTelemetry"
    description: "Injects OpenTelemetry correlation headers."
  - type: "component"
    name: "Health Probing & Automated Failover Component"
    technology: "Azure API Management Backend Probes / Circuit Breaker"
    description: "Provides backend health probes and circuit breaker patterns."
  - type: "component"
    name: "API Security Gateway Policies"
    technology: "Azure API Management Policy"
    description: "OWASP Top 10 payload validation and sanitization."
relationships:
  - source: "Web Frontend (SPA)"
    destination: "JWT Validation Policy Component"
    description: "Sends API requests via [HTTPS / REST]"
  - source: "JWT Validation Policy Component"
    destination: "Rate Limiting & Throttling Component"
    description: "Passes authenticated requests"
  - source: "Rate Limiting & Throttling Component"
    destination: "Claims-Based Authorization Policy Component"
    description: "Evaluates rate-limited requests"
  - source: "Claims-Based Authorization Policy Component"
    destination: "API Security Gateway Policies"
    description: "Enforces RBAC before security validation"
  - source: "API Security Gateway Policies"
    destination: "Distributed Tracing Injector Component"
    description: "Injects correlation headers into validated requests"
  - source: "Distributed Tracing Injector Component"
    destination: "Health Probing & Automated Failover Component"
    description: "Routes requests through health probes and circuit breakers"
  - source: "Health Probing & Automated Failover Component"
    destination: "mTLS & Secure Connector Component"
    description: "Establishes secure outbound connections"
  - source: "mTLS & Secure Connector Component"
    destination: "Core Claims Service"
    description: "Routes authenticated requests via [gRPC / internal HTTPS with mTLS]"
  - source: "mTLS & Secure Connector Component"
    destination: "Mainframe ACL"
    description: "Forwards fallback requests via [HTTPS with mTLS]"
  - source: "Claims API Gateway"
    destination: "Azure AD / Entra ID"
    description: "Validates tokens via [OAuth2 / OpenID Connect]"
  - source: "Claims API Gateway"
    destination: "Azure App Configuration"
    description: "Evaluates cached feature flags via [HTTPS]"