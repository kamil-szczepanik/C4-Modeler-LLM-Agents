level: component
scope: "Component diagram for the Core Claims Service container"
parentContainer:
  name: "Core Claims Service"
elements:
  - type: "component"
    name: "Claim Orchestrator Component"
    technology: "Java / Spring Boot"
    description: "Orchestrates online submissions, adjuster workflows, and incremental claim type migrations."
  - type: "component"
    name: "Claim Domain Model Component"
    technology: "Java / DDD"
    description: "Encapsulates the core business logic and domain rules for claims."
  - type: "component"
    name: "ACL Publisher Component"
    technology: "Apache Kafka Client"
    description: "Publishes asynchronous events to the Mainframe Anti-Corruption Layer."
  - type: "component"
    name: "Validation & Policy Engine Component"
    technology: "Spring Validation / Drools"
    description: "Executes validation rules and policy checks for claims."
  - type: "component"
    name: "SLA & Metrics Telemetry Component"
    technology: "Micrometer / OpenTelemetry"
    description: "Captures distributed traces and business metrics without leaking PII."
relationships:
  - source: "Claim Orchestrator Component"
    destination: "Claim Domain Model Component"
    description: "Executes direct in-process method calls [In-Memory]"
  - source: "Claim Orchestrator Component"
    destination: "Validation & Policy Engine Component"
    description: "Executes direct in-process method calls [In-Memory]"
  - source: "Claim Orchestrator Component"
    destination: "ACL Publisher Component"
    description: "Publishes asynchronous events [Apache Kafka / Azure Event Hubs]"
  - source: "Core Claims Service"
    destination: "Mainframe Anti-Corruption Layer"
    description: "Publishes asynchronous events [Apache Kafka / Azure Event Hubs]"
  - source: "Core Claims Service"
    destination: "Azure Key Vault & Active Directory"
    description: "Retrieves secrets and validates tokens [Managed Identities / OAuth2 / HTTPS]"