level: component
scope: "Component diagram for the Mainframe Anti-Corruption Layer (ACL) container"
parentContainer:
  name: "Mainframe Anti-Corruption Layer (ACL)"
elements:
  - type: "component"
    name: "Mainframe Anti-Corruption Layer (Azure Event Hubs / Kafka)"
    technology: "Azure Event Hubs (Kafka)"
    description: "Asynchronously decouples the modern platform from the legacy mainframe."
  - type: "component"
    name: "Ingress Event Router (Kafka Connect / Azure Functions)"
    technology: "Kafka Connect / Azure Functions"
    description: "Minimizes custom integration code for teams with low cloud experience."
  - type: "component"
    name: "Schema & State Registry (Confluent Schema Registry)"
    technology: "Confluent Schema Registry"
    description: "Enforces data contracts to limit mainframe changes to max one per quarter."
  - type: "component"
    name: "Protocol Adapter (Apache Camel)"
    technology: "Apache Camel"
    description: "Provides enterprise integration patterns, circuit breaking, and retry logic."
relationships:
  - source: "Mainframe Anti-Corruption Layer (Azure Event Hubs / Kafka)"
    destination: "Ingress Event Router (Kafka Connect / Azure Functions)"
    description: "Routes events through the ingress router"
  - source: "Ingress Event Router (Kafka Connect / Azure Functions)"
    destination: "Schema & State Registry (Confluent Schema Registry)"
    description: "Validates payloads via Confluent Schema Registry"
  - source: "Schema & State Registry (Confluent Schema Registry)"
    destination: "Protocol Adapter (Apache Camel)"
    description: "Dispatches validated transformation payloads"