# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for New Insurance Claims Platform"
system:
  name: "New Insurance Claims Platform"
elements:
  - type: "person"
    name: "End Customers & Brokers"
    description: "External users who submit and manage insurance claims online."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users responsible for reviewing and managing claims."
  - type: "person"
    name: "Migration Product Owners"
    description: "Internal users responsible for overseeing incremental claim-type migration and rollbacks."
  - type: "externalSystem"
    name: "Legacy COBOL/DB2 Mainframe"
    description: "30-year-old legacy system of record running claims processing."
  - type: "externalSystem"
    name: "Azure Key Vault & Active Directory (Entra ID)"
    description: "Provides secrets management, customer-managed keys, and identity authentication."
  - type: "container"
    name: "Web Frontend (SPA)"
    technology: "Azure Static Web Apps, React"
    description: "Provides the online claim submission and adjuster management user interface."
  - type: "container"
    name: "Claims API Gateway"
    technology: "Azure API Management"
    description: "Enforces AD authentication and routes requests to core services."
  - type: "container"
    name: "Core Claims Service"
    technology: "Azure Container Apps"
    description: "Processes core business logic and claims management."
  - type: "container"
    name: "Mainframe Anti-Corruption Layer (ACL)"
    technology: "Azure Event Hubs (Kafka)"
    description: "Asynchronously decouples the modern platform from the legacy mainframe."
  - type: "container"
    name: "Integration & Transformation Worker"
    technology: "Azure Container Apps"
    description: "Transforms and worker processes messages bridging the new platform and legacy systems."
  - type: "container"
    name: "Operational Observability & Dead-Letter Container"
    technology: "Azure Container Apps, Azure Monitor"
    description: "Monitors system health and handles failed message delivery."
relationships:
  - source: "End Customers & Brokers"
    destination: "Web Frontend (SPA)"
    description: "Submit and manage claims"
    technology: "HTTPS / REST / WebSockets"
  - source: "Claims Adjusters"
    destination: "Web Frontend (SPA)"
    description: "Manage claims and adjusters"
    technology: "HTTPS / REST / WebSockets"
  - source: "Migration Product Owners"
    destination: "Web Frontend (SPA)"
    description: "Monitor migration and rollbacks"
    technology: "HTTPS / REST / WebSockets"
  - source: "Web Frontend (SPA)"
    destination: "Claims API Gateway"
    description: "Sends API requests"
    technology: "HTTPS / REST"
  - source: "Claims API Gateway"
    destination: "Core Claims Service"
    description: "Routes authenticated requests"
    technology: "gRPC / internal HTTPS"
  - source: "Core Claims Service"
    destination: "Mainframe Anti-Corruption Layer (ACL)"
    description: "Publishes asynchronous events"
    technology: "Azure Event Hubs (Kafka)"
  - source: "Mainframe Anti-Corruption Layer (ACL)"
    destination: "Legacy COBOL/DB2 Mainframe"
    description: "Communicates data across hybrid boundaries"
    technology: "IPsec VPN / Azure ExpressRoute (SFTP, MQ, Batch)"
  - source: "Claims API Gateway"
    destination: "Azure Key Vault & Active Directory (Entra ID)"
    description: "Authenticates requests"
    technology: "Managed Identities (HTTPS)"
  - source: "Core Claims Service"
    destination: "Azure Key Vault & Active Directory (Entra ID)"
    description: "Retrieves secrets and keys"
    technology: "Managed Identities (HTTPS)"
  - source: "Integration & Transformation Worker"
    destination: "Azure Key Vault & Active Directory (Entra ID)"
    description: "Retrieves secrets and keys"
    technology: "Managed Identities (HTTPS)"