level: context
scope: "System Context diagram for Regional Insurer's Claims Platform"
system:
  name: "New Insurance Claims Platform"
  description: "Modern cloud-native claims platform gradually migrating claim types from a 30-year-old mainframe to a hybrid Azure environment."
elements:
  - type: "person"
    name: "End Customers & Brokers"
    description: "External users who interact with the system to submit and manage insurance claims."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users responsible for reviewing, processing, and handling insurance claims."
  - type: "person"
    name: "Operations Managers & Migration Auditors"
    description: "Users who monitor system performance, audit migrations, and ensure compliance."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "30-year-old legacy system of record running COBOL and DB2."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "On-premises Active Directory and Azure Entra ID providing authentication services."
  - type: "externalSystem"
    name: "Centralized Audit Sink"
    description: "Azure Application Insights and Azure Immutable Blob Storage for compliance and audit logging."
relationships:
  - source: "End Customers & Brokers"
    destination: "New Insurance Claims Platform"
    description: "Interact with the web application to submit and track claims"
    technology: "HTTPS / REST"
  - source: "Claims Adjusters"
    destination: "New Insurance Claims Platform"
    description: "Process and manage claims through the new UI"
    technology: "HTTPS / REST"
  - source: "Operations Managers & Migration Auditors"
    destination: "New Insurance Claims Platform"
    description: "Monitor migration metrics and audit logs"
    technology: "HTTPS / REST"
  - source: "New Insurance Claims Platform"
    destination: "Legacy Mainframe"
    description: "Communicates asynchronously across hybrid boundaries"
    technology: "Azure Service Bus / Enterprise API Gateway"
  - source: "New Insurance Claims Platform"
    destination: "Identity Provider"
    description: "Authenticates users and validates tokens"
    technology: "OpenID Connect / OAuth 2.0 / mTLS"
  - source: "New Insurance Claims Platform"
    destination: "Centralized Audit Sink"
    description: "Logs claim state transitions using WORM policies"
    technology: "Azure Immutable Blob Storage"