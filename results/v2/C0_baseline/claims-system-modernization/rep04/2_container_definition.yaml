level: container
scope: "Container diagram for Insurance Claims Modernization Platform"
system:
  name: "Insurance Claims Modernization Platform"
elements:
  - type: "person"
    name: "Customers"
    description: "Policyholders submitting claims online."
  - type: "person"
    name: "Brokers"
    description: "External partners submitting and tracking claims."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users processing claims via the web application."
  - type: "person"
    name: "Customer Support Agents"
    description: "Support agents assisting with claims and inquiries."
  - type: "person"
    name: "Migration Product Managers"
    description: "Managers overseeing the transition and feature flag routing."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premises COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Azure Active Directory providing OIDC/OAuth2 authentication."
  - type: "container"
    name: "Frontend SPA"
    technology: "React / TypeScript, Azure Static Web Apps"
    description: "Single Page Application providing online claim submissions and adjuster processing interfaces."
  - type: "container"
    name: "API Gateway"
    technology: ".NET Core / Envoy, CQRS"
    description: "Backend-for-Frontend (BFF) routing and handling API requests."
  - type: "container"
    name: "Backend Service"
    technology: "Modular Monolith .NET Core, Azure App Service"
    description: "Core business logic service running on PaaS containers."
  - type: "container"
    name: "Mainframe Integration Adapter"
    technology: "Azure Functions, Polly"
    description: "Integration layer handling mainframe protocol translation and retry logic."
  - type: "container"
    name: "Database"
    technology: "Azure SQL Database"
    description: "Relational storage with temporal tables and feature-flag routing."
  - type: "container"
    name: "Secrets Management"
    technology: "Azure Key Vault"
    description: "Centralized management for secrets, connection strings, and certificates."
  - type: "container"
    name: "Monitoring Service"
    technology: "Azure Application Insights"
    description: "Distributed tracing and monitoring for latency tracking."
relationships:
  - source: "Customers"
    destination: "Frontend SPA"
    description: "Submits claims online"
    technology: "HTTPS over TLS 1.3"
  - source: "Brokers"
    destination: "Frontend SPA"
    description: "Submits and tracks claims"
    technology: "HTTPS over TLS 1.3"
  - source: "Claims Adjusters"
    destination: "Frontend SPA"
    description: "Processes claims"
    technology: "HTTPS over TLS 1.3"
  - source: "Customer Support Agents"
    destination: "Frontend SPA"
    description: "Assists with claims"
    technology: "HTTPS over TLS 1.3"
  - source: "Migration Product Managers"
    destination: "Frontend SPA"
    description: "Manages migration and feature flags"
    technology: "HTTPS over TLS 1.3"
  - source: "Frontend SPA"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS/REST with OAuth2 JWT validation"
  - source: "API Gateway"
    destination: "Backend Service"
    description: "Routes requests to business logic"
    technology: "HTTPS and internal VNet routing"
  - source: "Backend Service"
    destination: "Database"
    description: "Reads and writes claim data"
    technology: "T-SQL / Internal VNet"
  - source: "Backend Service"
    destination: "Mainframe Integration Adapter"
    description: "Triggers data synchronization and coexistence tasks"
    technology: "Internal VNet routing"
  - source: "Mainframe Integration Adapter"
    destination: "Legacy Mainframe"
    description: "Integrates with legacy system"
    technology: "Secured site-to-site VPN/ExpressRoute with TLS 1.3"
  - source: "Frontend SPA"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OIDC / OAuth2 SSO"
  - source: "Backend Service"
    destination: "Secrets Management"
    description: "Retrieves secrets and connection strings"
    technology: "Azure SDK / Managed Identity"
  - source: "Backend Service"
    destination: "Monitoring Service"
    description: "Sends telemetry and traces"
    technology: "Application Insights SDK"