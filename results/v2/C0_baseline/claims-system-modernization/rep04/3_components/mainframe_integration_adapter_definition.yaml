level: component
scope: "Component diagram for the Mainframe Integration Adapter container"
parentContainer:
  name: "Mainframe Integration Adapter"
elements:
  - type: "component"
    name: "Adapter API Controller"
    technology: "Azure Container Apps / App Service"
    description: "Receives internal routing requests from the backend service and exposes endpoints for integration."
  - type: "component"
    name: "Polly Resilience Pipeline"
    technology: "Polly"
    description: "Handles circuit breaking, retries, and exponential backoff for unstable legacy connections."
  - type: "component"
    name: "Mainframe Communication Client"
    technology: "mTLS / TLS 1.3"
    description: "Manages secure mTLS communication over Site-to-Site VPN/ExpressRoute with the legacy mainframe."
  - type: "component"
    name: "Database Integration Manager"
    technology: "T-SQL / VNet"
    description: "Manages database interactions and persistence with the Azure SQL Database."
  - type: "component"
    name: "Queue Publisher"
    technology: "Azure Service Bus Queue (AMQP)"
    description: "Buffers traffic and publishes messages to prevent data loss during mainframe unresponsiveness."
  - type: "component"
    name: "Secrets and Identity Manager"
    technology: "Azure Key Vault / Managed Identity"
    description: "Secures mTLS certificates and credentials securely via Managed Identities."
relationships:
  - source: "Adapter API Controller"
    destination: "Polly Resilience Pipeline"
    description: "Passes outgoing legacy requests through"
  - source: "Polly Resilience Pipeline"
    destination: "Mainframe Communication Client"
    description: "Invokes secure calls to"
  - source: "Adapter API Controller"
    destination: "Database Integration Manager"
    description: "Reads and writes data via"
  - source: "Adapter API Controller"
    destination: "Queue Publisher"
    description: "Buffers offline requests via"
  - source: "Mainframe Communication Client"
    destination: "Secrets and Identity Manager"
    description: "Retrieves mTLS certificates from"