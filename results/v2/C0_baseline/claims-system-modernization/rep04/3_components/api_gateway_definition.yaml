level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "API Management Gateway"
    technology: "Azure API Management"
    description: "Managed API gateway for policy routing, rate limiting, OAuth2 JWT validation, and TLS termination, routing modern traffic to the backend service and legacy traffic to the mainframe integration adapter while streaming telemetry to application insights."
relationships:
  - source: "API Management Gateway"
    destination: "Backend Service"
    description: "Routes modern traffic via HTTPS over mTLS/VNet"
  - source: "API Management Gateway"
    destination: "Mainframe Integration Adapter"
    description: "Routes legacy traffic via HTTPS over mTLS/VNet"
  - source: "API Management Gateway"
    destination: "Azure Application Insights"
    description: "Streams telemetry via HTTPS"