level: component
scope: "Component diagram for the Secrets Management container"
parentContainer:
  name: "Secrets Management"
elements:
  - type: "component"
    name: "Azure Key Vault"
    technology: "Azure Key Vault"
    description: "Centralizes secure credential management and stores active secret versions."
  - type: "component"
    name: "Azure App Configuration SDK"
    technology: "Azure App Configuration"
    description: "Handles configuration refresh and webhook-driven cache invalidation to prevent stale connection pooling."
  - type: "component"
    name: "Secret Rotator Function"
    technology: "Azure Functions (.NET / C#)"
    description: "Executes automated, zero-downtime credential rotation for Azure SQL Database and external APIs."
relationships:
  - source: "Backend Service / Integration Adapter"
    destination: "Azure Key Vault"
    description: "Retrieves active secret versions via Private Endpoint using Managed Identity"
  - source: "Backend Service / Integration Adapter"
    destination: "Azure App Configuration SDK"
    description: "Polls or receives webhooks for secret version changes"
  - source: "Secret Rotator Function"
    destination: "Azure Key Vault"
    description: "Updates and rotates credentials"