level: component
scope: "Component diagram for the Monitoring Service container"
parentContainer:
  name: "Monitoring Service"
elements:
  - type: "component"
    name: "Telemetry Collector Component"
    technology: "Application Insights SDK / OpenTelemetry"
    description: "Gathers application traces and metrics from backend services via HTTPS."
  - type: "component"
    name: "Telemetry Processor Component"
    technology: "Application Insights Telemetry Initializer"
    description: "Passes raw telemetry for sanitization in-memory."
  - type: "component"
    name: "Log Analytics Workspace"
    technology: "Azure Log Analytics"
    description: "Persists sanitized logs and metrics via Azure Internal Storage API."
  - type: "component"
    name: "Alert Action Groups"
    technology: "Azure Monitor Action Groups"
    description: "Evaluates KQL rules to trigger notifications via Azure Event Grid."
  - type: "component"
    name: "Mainframe Integration Webtest"
    technology: "Azure Application Insights Availability Tests"
    description: "Periodically pings integration path via HTTPS."
relationships:
  - source: "Backend Service"
    destination: "Telemetry Collector Component"
    description: "Forwards application traces and metrics via HTTPS / OpenTelemetry"
  - source: "Telemetry Collector Component"
    destination: "Telemetry Processor Component"
    description: "Passes raw telemetry for sanitization in-memory"
  - source: "Telemetry Processor Component"
    destination: "Log Analytics Workspace"
    description: "Persists sanitized logs and metrics via Azure Internal Storage API"
  - source: "Log Analytics Workspace"
    destination: "Alert Action Groups"
    description: "Evaluates KQL rules to trigger notifications via Azure Event Grid"
  - source: "Mainframe Integration Webtest"
    destination: "Mainframe Integration Adapter"
    description: "Periodically pings integration path via HTTPS"