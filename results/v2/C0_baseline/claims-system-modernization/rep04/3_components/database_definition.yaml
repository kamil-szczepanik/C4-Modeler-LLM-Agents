level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Claim Operational Store"
    technology: "Azure SQL Tables"
    description: "Provides relational storage and transactional consistency for the legacy insurance claims system."
  - type: "component"
    name: "Audit & History Engine"
    technology: "System-Versioned Temporal Tables"
    description: "Tracks history and changes for claims data to support data consistency and targeted rollbacks."
  - type: "component"
    name: "Integration Staging Store"
    technology: "Azure SQL"
    description: "Handles bulk inserts and data staging from mainframe integration adapters."
  - type: "component"
    name: "Archival & Purging Component"
    technology: "Azure SQL Elastic Jobs"
    description: "Manages data archival and purging according to phased migration and lifecycle policies."
relationships:
  - source: "Backend Service"
    destination: "Claim Operational Store"
    description: "T-SQL / ADO.NET [Encrypted VNet connection]"
  - source: "Backend Service"
    destination: "Audit & History Engine"
    description: "T-SQL / ADO.NET [Encrypted VNet connection]"
  - source: "Mainframe Integration Adapter"
    destination: "Integration Staging Store"
    description: "Bulk Insert / T-SQL [VNet Peering]"
  - source: "Claim Operational Store"
    destination: "Azure Key Vault"
    description: "Managed Identity / HTTPS [Key Vault REST API]"