level: component
scope: "Component diagram for the Frontend SPA container"
parentContainer:
  name: "Frontend SPA"
elements:
  - type: "component"
    name: "Routing & Shell Component"
    technology: "React / TypeScript"
    description: "Provides layout, navigation, and shell structure for the application."
  - type: "component"
    name: "Claim Submission Module"
    technology: "React / TypeScript / TanStack Query"
    description: "Allows customers and brokers to submit and track insurance claims."
  - type: "component"
    name: "Adjuster Workbench Module"
    technology: "React / TypeScript / TanStack Query"
    description: "Provides tools for claims adjusters and support agents to process claims."
  - type: "component"
    name: "Feature Flag & Migration Service"
    technology: "TypeScript"
    description: "Manages incremental claim type migration and feature toggles."
  - type: "component"
    name: "Auth Client Module"
    technology: "MSAL.js"
    description: "Handles OIDC / OAuth2 SSO authentication with the Identity Provider."
  - type: "component"
    name: "API Client Service"
    technology: "TypeScript / HTTPS / WebSockets"
    description: "Communicates with the API Gateway for REST requests and real-time updates."
