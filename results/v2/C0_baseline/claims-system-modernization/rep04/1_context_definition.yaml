level: context
scope: "System Context diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization Platform"
  description: "A modern Azure-hosted platform gradually replacing a legacy mainframe while maintaining continuous operations, zero data loss, and rapid rollbacks."
elements:
  - type: "person"
    name: "Customers (Policyholders)"
    description: "External users submitting claims online."
  - type: "person"
    name: "Brokers"
    description: "External partners submitting and tracking claims."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users processing claims via the web application."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premises COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Active Directory / Microsoft Entra ID for authentication."
relationships:
  - source: "Customers (Policyholders)"
    destination: "Insurance Claims Modernization Platform"
    description: "Submits claims online"
    technology: "HTTPS / TLS 1.3 via Azure Front Door and Web UI"
  - source: "Brokers"
    destination: "Insurance Claims Modernization Platform"
    description: "Submits and tracks claims"
    technology: "HTTPS / TLS 1.3 via Azure Front Door and Web UI"
  - source: "Claims Adjusters"
    destination: "Insurance Claims Modernization Platform"
    description: "Processes claims via web application"
    technology: "HTTPS / TLS 1.3 via Azure Front Door and Web UI"
  - source: "Insurance Claims Modernization Platform"
    destination: "Identity Provider"
    description: "Authenticates users and provides Single Sign-On (SSO)"
    technology: "OIDC / OAuth 2.0"
  - source: "Insurance Claims Modernization Platform"
    destination: "Legacy Mainframe"
    description: "Synchronizes and migrates claim data via Anti-Corruption Layer"
    technology: "Azure ExpressRoute and mutual TLS (mTLS)"