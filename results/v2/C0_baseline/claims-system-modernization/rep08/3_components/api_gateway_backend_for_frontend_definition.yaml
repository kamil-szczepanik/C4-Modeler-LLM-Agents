level: component
scope: "Component diagram for the API Gateway / Backend-for-Frontend container"
parentContainer:
  name: "API Gateway / Backend-for-Frontend"
elements:
  - type: "component"
    name: "Routing & Feature Flag Router Component"
    technology: "Azure App Configuration"
    description: "Fetches feature flags and handles routing with local memory fallback."
  - type: "component"
    name: "Aggregator / Composition Service Component"
    technology: ".NET 8 Web API"
    description: "Composes and aggregates data from multiple domain services for the BFF."
  - type: "component"
    name: "Authentication & Token Exchange Middleware Component"
    technology: "OpenID Connect / OAuth2"
    description: "Validates tokens against Corporate Active Directory & Azure Entra ID."
  - type: "component"
    name: "Resilience & Telemetry Component"
    technology: "Polly & OpenTelemetry"
    description: "Implements circuit breakers, resilience policies, and distributed tracing."
relationships:
  - source: "Authentication & Token Exchange Middleware Component"
    destination: "Corporate Active Directory & Azure Entra ID"
    description: "Validates tokens [OpenID Connect / OAuth2]"
  - source: "Routing & Feature Flag Router Component"
    destination: "Azure App Configuration"
    description: "Fetches feature flags [HTTPS with local memory fallback]"
  - source: "Aggregator / Composition Service Component"
    destination: "Claims Domain Services"
    description: "Invokes domain services [gRPC with strict mTLS]"
  - source: "API Gateway / Backend-for-Frontend"
    destination: "Azure Redis Cache"
    description: "Reads and writes encrypted response data [TLS with field-level encryption]"
  - source: "API Gateway / Backend-for-Frontend"
    destination: "Azure Key Vault"
    description: "Retrieves secrets using Azure Managed Identities [HTTPS]"