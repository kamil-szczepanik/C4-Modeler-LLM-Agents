level: component
scope: "Component diagram for the Claims Domain Services container"
parentContainer:
  name: "Claims Domain Services"
elements:
  - type: "component"
    name: "Claim Processing Controller"
    technology: ".NET 8 Web API"
    description: "Invokes domain logic via gRPC over mTLS in Azure VNet."
  - type: "component"
    name: "Idempotency Filter & Middleware"
    technology: "Azure Cache for Redis"
    description: "Validates idempotency keys."
  - type: "component"
    name: "Feature Flag Evaluator"
    technology: "Azure App Configuration"
    description: "Reads feature flags and routing rules using Managed Identities."
  - type: "component"
    name: "Claim Domain Model & Handlers"
    technology: ".NET 8"
    description: "Core runtime for high-performance microservices and domain logic."
  - type: "component"
    name: "Data Access Repository"
    technology: "Azure SQL Database, Entity Framework Core"
    description: "Persists claim data securely with TLS 1.3 and Entra ID Authentication."
  - type: "component"
    name: "Audit & Telemetry Interceptor"
    technology: "Azure Application Insights"
    description: "Writes tamper-evident audit logs."
  - type: "component"
    name: "Integration Publisher"
    technology: "Azure Service Bus"
    description: "Publishes encrypted claim events via AMQP."
relationships:
  - source: "API Gateway"
    destination: "Claim Processing Controller"
    description: "Invokes domain logic via gRPC over mTLS in Azure VNet"
  - source: "Idempotency Filter & Middleware"
    destination: "Azure Cache for Redis"
    description: "Validates idempotency keys [TCP/TLS]"
  - source: "Feature Flag Evaluator"
    destination: "Azure App Configuration"
    description: "Reads feature flags and routing rules [HTTPS / Managed Identities]"
  - source: "Data Access Repository"
    destination: "Azure SQL Database"
    description: "Persists claim data securely [TLS 1.3 / Entra ID Authentication]"
  - source: "Integration Publisher"
    destination: "Azure Service Bus"
    description: "Publishes encrypted claim events [AMQP / Managed Identities]"
  - source: "Audit & Telemetry Interceptor"
    destination: "Azure Monitor"
    description: "Writes tamper-evident audit logs [HTTPS]"