level: component
scope: "Component diagram for the Integration & Sync Engine container"
parentContainer:
  name: "Integration & Sync Engine"
elements:
  - type: "component"
    name: "Sync Orchestrator Function"
    technology: "Azure Functions - Durable Functions"
    description: "Serverless event orchestration and stateful saga management for hybrid data replication."
  - type: "component"
    name: "Mainframe Adapter Component"
    technology: "C# class library with Polly circuit breaker"
    description: "Interfaces with the legacy mainframe, providing resilience and circuit-breaking for legacy timeouts."
  - type: "component"
    name: "Reconciliation Worker"
    technology: "Azure Functions - Timer Trigger"
    description: "Periodically reconciles data consistency between the mainframe and Azure cloud platform."
  - type: "component"
    name: "Change Data Capture (CDC) Consumer"
    technology: "Azure Functions"
    description: "Consumes change data capture events to maintain data synchronization."
  - type: "component"
    name: "Feature Flag Router Component"
    technology: "C# middleware"
    description: "Evaluates migration streams via in-memory caching and managed identities for incremental claim migrations."
  - type: "component"
    name: "Enterprise Integration Bus"
    technology: "Enterprise Integration Bus (EIB) / Azure Service Bus"
    description: "Asynchronous message brokering and AMQP/HTTPS communication backbone."
  - type: "component"
    name: "Azure App Configuration"
    technology: "Azure App Configuration & Managed Identities"
    description: "Provides dynamic feature flag routing and credential-less authentication."
  - type: "component"
    name: "Azure Key Vault"
    technology: "Azure Key Vault"
    description: "Secures and supplies secrets using Azure Managed Identities."
relationships:
  - source: "Integration & Sync Engine"
    destination: "Enterprise Integration Bus"
    description: "Replicates hybrid data via AMQP and HTTPS/mTLS"
  - source: "Sync Orchestrator Function"
    destination: "Azure Key Vault"
    description: "Retrieves secrets using Azure Managed Identities"
  - source: "Feature Flag Router Component"
    destination: "Azure App Configuration"
    description: "Evaluates migration streams via in-memory caching and managed identities"
  - source: "Mainframe Adapter Component"
    destination: "Enterprise Integration Bus"
    description: "Transmits cryptographically signed payloads using TLS 1.3"