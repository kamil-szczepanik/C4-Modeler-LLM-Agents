level: component
scope: "Component diagram for the Adjuster Workspace container"
parentContainer:
  name: "Adjuster Workspace"
elements:
  - type: "component"
    name: "Workspace Shell & Router"
    technology: "React & TypeScript"
    description: "Core frontend shell and router for the Adjuster Workspace."
  - type: "component"
    name: "Unified Claim Dashboard"
    technology: "React & TypeScript"
    description: "Displays a unified view of claims for adjusters."
  - type: "component"
    name: "Claim Detail View"
    technology: "React & TypeScript"
    description: "Detailed view for processing hybrid insurance claims."
  - type: "component"
    name: "Integration Client"
    technology: "TypeScript"
    description: "Client for integrating with backend and legacy systems."
  - type: "component"
    name: "Audit & Telemetry Interceptor"
    technology: "Application Insights / OpenTelemetry"
    description: "Wraps write operations for auditing and telemetry tracking."
  - type: "component"
    name: "Feature Flag Provider"
    technology: "Azure App Configuration"
    description: "Consumes dynamic configuration and feature flags."
  - type: "external_system"
    name: "API Gateway / Backend-for-Frontend"
    technology: "HTTPS / REST"
    description: "External API gateway for backend services."
relationships:
  - source: "Workspace Shell & Router"
    destination: "Unified Claim Dashboard"
    description: "Renders components [In-memory]"
  - source: "Workspace Shell & Router"
    destination: "Claim Detail View"
    description: "Renders components [In-memory]"
  - source: "Integration Client"
    destination: "Audit & Telemetry Interceptor"
    description: "Wraps write operations [HTTPS]"
  - source: "Workspace Shell & Router"
    destination: "Feature Flag Provider"
    description: "Consumes dynamic configuration [In-memory]"
  - source: "Adjuster Workspace"
    destination: "API Gateway / Backend-for-Frontend"
    description: "Makes API requests [HTTPS / REST]"