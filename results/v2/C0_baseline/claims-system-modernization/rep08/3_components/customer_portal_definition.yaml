level: component
scope: "Component diagram for the Customer Portal container"
parentContainer:
  name: "Customer Portal"
elements:
  - type: "component"
    name: "Customer Portal"
    technology: "React, TypeScript, Azure CDN"
    description: "Delivers secure online claim submissions and self-service tracking for customers and brokers."
  - type: "component"
    name: "API Gateway / Backend-for-Frontend"
    technology: ".NET 8 Web API"
    description: "Isolates complex legacy mainframe dependencies and handles API requests."
  - type: "component"
    name: "Corporate Active Directory & Azure Entra ID"
    technology: "OAuth 2.0 / OIDC / MSAL.js"
    description: "Handles user authentication and Single Sign-On."
  - type: "component"
    name: "Azure Application Insights"
    technology: "Browser SDK"
    description: "Sends client-side telemetry and monitors performance/errors."
  - type: "component"
    name: "Azure Web Application Firewall (WAF)"
    technology: "Azure WAF"
    description: "Inspects and filters incoming traffic for edge protection against bots and web attacks."
  - type: "component"
    name: "Customers and Brokers"
    technology: "External User"
    description: "Accesses portal to submit and track claims."
relationships:
  - source: "Customers and Brokers"
    destination: "Customer Portal"
    description: "Accesses portal to submit and track claims [HTTPS / Azure CDN]"
  - source: "Customer Portal"
    destination: "API Gateway / Backend-for-Frontend"
    description: "Makes API requests [HTTPS / REST]"
  - source: "Customer Portal"
    destination: "Corporate Active Directory & Azure Entra ID"
    description: "Authenticates via Single Sign-On [OAuth 2.0 / OIDC / MSAL.js]"
  - source: "Customer Portal"
    destination: "Azure Application Insights"
    description: "Sends client-side telemetry [HTTPS]"
  - source: "Azure Web Application Firewall (WAF)"
    destination: "Customer Portal"
    description: "Inspects and filters incoming traffic [HTTPS]"