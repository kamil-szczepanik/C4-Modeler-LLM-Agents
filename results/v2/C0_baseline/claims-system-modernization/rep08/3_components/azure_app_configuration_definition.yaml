level: component
scope: "Component diagram for the Azure App Configuration container"
parentContainer:
  name: "Azure App Configuration"
elements:
  - type: "component"
    name: "Key-Value Store"
    technology: "Azure App Configuration Service"
    description: "Persists environment-specific settings and routing endpoints."
  - type: "component"
    name: "Feature Management Engine"
    technology: "Azure App Configuration Service"
    description: "Evaluates percentage-based rollouts and claim-type filters for gradual migration (R-03)."
  - type: "component"
    name: "Configuration Refresh Handler"
    technology: "Microsoft.Extensions.Configuration.AzureAppConfiguration (.NET 8)"
    description: "Exposes push-notification endpoints to invalidate downstream service caches."
  - type: "component"
    name: "Local Snapshot Cache & Fallback Provider"
    technology: "Ephemeral Storage JSON Snapshots"
    description: "Persists read-only JSON backups in ephemeral storage for resilience."
relationships:
  - source: "Claims Domain Services"
    destination: "Key-Value Store"
    description: "Reads configuration and feature flags via HTTPS (TLS 1.3) using Microsoft Entra ID Managed Identities and Azure Private Link"
  - source: "Integration & Sync Engine"
    destination: "Feature Management Engine"
    description: "Reads feature flags and routing rules via HTTPS (TLS 1.3) using Managed Identities and Azure Private Link"
  - source: "Configuration Refresh Handler"
    destination: "Azure Key Vault"
    description: "Resolves sensitive connection strings and secrets via Key Vault references"
  - source: "Configuration Refresh Handler"
    destination: "Azure Event Grid"
    description: "Publishes push-notification events for cache invalidation"