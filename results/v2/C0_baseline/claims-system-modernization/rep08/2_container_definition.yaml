# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Hybrid Insurance Claims Modernization Platform"
system:
  name: "Hybrid Insurance Claims Modernization Platform"
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "External users submitting claims online."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users handling claims via the workspace."
  - type: "person"
    name: "Migration Operations Manager"
    description: "Manager overseeing the parallel processing and migration operations."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "Enterprise Integration Bus"
    description: "Decoupling and buffering layer for hybrid data exchange."
  - type: "externalSystem"
    name: "Corporate Active Directory & Azure Entra ID"
    description: "Identity provider for single sign-on and managed security."
  - type: "externalSystem"
    name: "Azure Key Vault"
    description: "Centralized secret and certificate management."
  - type: "container"
    name: "Customer Portal"
    technology: "React, TypeScript, Azure CDN"
    description: "Web application allowing customers and brokers to submit and track claims."
  - type: "container"
    name: "Adjuster Workspace"
    technology: "React, TypeScript"
    description: "Web application used by claims adjusters to process and manage claims."
  - type: "container"
    name: "API Gateway / Backend-for-Frontend"
    technology: ".NET 8 Web API"
    description: "Handles routing, composition, and backend-for-frontend logic for the client portals."
  - type: "container"
    name: "Claims Domain Services"
    technology: ".NET 8, Azure Container Apps"
    description: "Microservices implementing core claims business logic and domain processing."
  - type: "container"
    name: "Integration & Sync Engine"
    technology: "Azure Functions, Azure Service Bus"
    description: "Handles asynchronous event processing and data synchronization with legacy systems."
  - type: "container"
    name: "Azure App Configuration"
    technology: "Azure App Configuration"
    description: "Centralized configuration and feature flagging management."
relationships:
  - source: "Customers and Brokers"
    destination: "Customer Portal"
    description: "Accesses portal to submit and view claims"
    technology: "HTTPS / Azure CDN"
  - source: "Claims Adjusters"
    destination: "Adjuster Workspace"
    description: "Uses workspace to manage and process claims"
    technology: "HTTPS"
  - source: "Customer Portal"
    destination: "API Gateway / Backend-for-Frontend"
    description: "Makes API requests"
    technology: "HTTPS / REST"
  - source: "Adjuster Workspace"
    destination: "API Gateway / Backend-for-Frontend"
    description: "Makes API requests"
    technology: "HTTPS / REST"
  - source: "API Gateway / Backend-for-Frontend"
    destination: "Claims Domain Services"
    description: "Invokes domain services"
    technology: "gRPC / HTTPS"
  - source: "Integration & Sync Engine"
    destination: "Enterprise Integration Bus"
    description: "Synchronizes data with legacy systems securely"
    technology: "mTLS"
  - source: "Enterprise Integration Bus"
    destination: "Legacy Mainframe"
    description: "Exchanges data with COBOL/DB2 system of record"
    technology: "Secure asynchronous messaging / APIs"
  - source: "Claims Domain Services"
    destination: "Azure Key Vault"
    description: "Retrieves secrets and certificates"
    technology: "Managed Identities"
  - source: "Claims Domain Services"
    destination: "Azure App Configuration"
    description: "Reads configuration and feature flags"
    technology: "Managed Identities"
  - source: "Integration & Sync Engine"
    destination: "Azure Key Vault"
    description: "Retrieves secrets and certificates"
    technology: "Managed Identities"
  - source: "Integration & Sync Engine"
    destination: "Azure App Configuration"
    description: "Reads configuration and feature flags"
    technology: "Managed Identities"
  - source: "Customers and Brokers"
    destination: "Corporate Active Directory & Azure Entra ID"
    description: "Authenticates via SSO"
    technology: "OAuth 2.0 / OpenID Connect"
  - source: "Claims Adjusters"
    destination: "Corporate Active Directory & Azure Entra ID"
    description: "Authenticates via SSO"
    technology: "OAuth 2.0 / OpenID Connect"