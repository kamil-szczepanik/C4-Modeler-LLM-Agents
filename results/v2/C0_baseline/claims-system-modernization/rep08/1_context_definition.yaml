level: context
scope: "System Context diagram for Hybrid Insurance Claims Modernization Platform"
system:
  name: "Hybrid Insurance Claims Modernization Platform"
  description: "A hybrid insurance claims modernization platform that gradually replaces a 30-year-old COBOL/DB2 mainframe while maintaining continuous core operations, enabling online claim submissions and adjuster workflows in Azure."
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "External users submitting claims online."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users handling claims via a web application."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "Enterprise Integration Bus"
    description: "Decoupling and buffering layer for hybrid data exchange."
  - type: "externalSystem"
    name: "Corporate Active Directory & Azure Entra ID"
    description: "Identity providers for single sign-on."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External provider (SendGrid/Twilio/SMTP) for customer alerts."
  - type: "externalSystem"
    name: "Azure Key Vault"
    description: "Centralized secret and certificate management."
relationships:
  - source: "Customers and Brokers"
    destination: "Hybrid Insurance Claims Modernization Platform"
    description: "Submits claims online"
    technology: "HTTPS via TLS 1.3 / OAuth 2.0 / OpenID Connect"
  - source: "Claims Adjusters"
    destination: "Hybrid Insurance Claims Modernization Platform"
    description: "Handles claims via web application"
    technology: "HTTPS via TLS 1.3 / OAuth 2.0 / OpenID Connect"
  - source: "Hybrid Insurance Claims Modernization Platform"
    destination: "Enterprise Integration Bus"
    description: "Asynchronous messaging and data exchange"
    technology: "Secure asynchronous messaging / APIs"
  - source: "Enterprise Integration Bus"
    destination: "Legacy Mainframe"
    description: "Syncs legacy data securely"
    technology: "Encrypted queues with mTLS and rate-limiting"
  - source: "Hybrid Insurance Claims Modernization Platform"
    destination: "Notification Service"
    description: "Sends automated alerts to customers"
    technology: "HTTPS"
  - source: "Customers and Brokers"
    destination: "Corporate Active Directory & Azure Entra ID"
    description: "Authenticates via SSO"
    technology: "Azure AD Connect"
  - source: "Claims Adjusters"
    destination: "Corporate Active Directory & Azure Entra ID"
    description: "Authenticates via SSO"
    technology: "Azure AD Connect"