    destination: "Secrets Engine Component"
    description: "Accesses exclusively via Azure Private Link (ExpressRoute/VPN)"
  - source: "Secrets Engine Component"
    destination: "Audit & Diagnostics Component"
    description: "Streams diagnostic logs and secret lifecycle events"
  - source: "Access Control Component"
