level: component
scope: "Component diagram for the Azure API Management / Migration Router container"
parentContainer:
  name: "Azure API Management / Migration Router"
elements:
  - type: "component"
    name: "API Gateway / Proxy"
    technology: "Azure API Management"
    description: "Acts as the edge gateway, routing inbound traffic from policyholders, brokers, and adjusters."
  - type: "component"
    name: "Migration Policy Engine"
    technology: "Azure API Management Policy / .NET"
    description: "Evaluates dynamic routing flags to split traffic between the legacy mainframe and the new cloud platform."
  - type: "component"
    name: "Analytics & Monitoring Publisher"
    technology: "Azure Monitor / Application Insights"
    description: "Publishes analytics and telemetry data regarding traffic splitting and API performance."
relationships:
  - source: "API Gateway / Proxy"
    destination: "Migration Policy Engine"
    description: "Evaluates migration and routing rules for incoming requests"
  - source: "Migration Policy Engine"
    destination: "Analytics & Monitoring Publisher"
    description: "Sends metrics and routing decisions for logging and analytics"