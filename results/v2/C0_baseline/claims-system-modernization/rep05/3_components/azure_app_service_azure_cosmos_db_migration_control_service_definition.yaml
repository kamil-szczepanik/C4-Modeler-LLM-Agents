level: component
scope: "Component diagram for the Azure App Service & Azure Cosmos DB (Migration Control Service) container"
parentContainer:
  name: "Azure App Service & Azure Cosmos DB (Migration Control Service)"
elements:
  - type: "component"
    name: "Migration API Controller"
    technology: ".NET 8 / REST"
    description: "Exposes REST endpoints for routing rules."
  - type: "component"
    name: "Reconciliation Engine"
    technology: ".NET 8"
    description: "Compares Cosmos DB state with DB2 audit logs."
  - type: "component"
    name: "Control Dashboard Backend"
    technology: ".NET 8"
    description: "Serves APIs for live monitoring and rollbacks."
  - type: "component"
    name: "State Store"
    technology: "Azure Cosmos DB"
    description: "Stores routing tables and migration state."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: ".NET 8"
    description: "Captures rule modifications with user context."
  - type: "component"
    name: "Alert Dispatcher"
    technology: ".NET 8"
    description: "Translates sync drifts into operational incidents."
relationships:
  - source: "Migration Router & Integration Service"
    destination: "Migration API Controller"
    description: "HTTPS (REST) via Private Endpoints"
  - source: "Reconciliation Engine"
    destination: "State Store"
    description: "Cosmos DB Change Feed over TLS 1.3"
  - source: "Control Dashboard Backend"
    destination: "Azure Entra ID"
    description: "HTTPS (OAuth 2.0 / OIDC) for RBAC"
  - source: "Migration Control Service"
    destination: "Azure Key Vault"
    description: "HTTPS for secret/key retrieval"