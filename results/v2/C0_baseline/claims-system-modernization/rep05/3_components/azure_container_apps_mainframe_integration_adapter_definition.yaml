level: component
scope: "Component diagram for the Azure Container Apps (Mainframe Integration Adapter) container"
parentContainer:
  name: "Azure Container Apps (Mainframe Integration Adapter)"
elements:
  - type: "component"
    name: "Mainframe Adapter API Router"
    technology: "Azure Container Apps / ASP.NET Core"
    description: "Receives dynamically routed traffic from Azure API Management and handles request processing."
  - type: "component"
    name: "Transformation & Mapping Engine"
    technology: ".NET Core"
    description: "Transforms modern requests into legacy mainframe formats and maps responses."
  - type: "component"
    name: "Mainframe Secure Connector"
    technology: "TLS 1.3 with mTLS"
    description: "Establishes secure, authenticated connections to the legacy mainframe."
  - type: "component"
    name: "Mapping Audit Publisher"
    technology: ".NET Async Client"
    description: "Forwards validation errors and audit events asynchronously."
relationships:
  - source: "Mainframe Adapter API Router"
    destination: "Transformation & Mapping Engine"
    description: "Delegates payload transformation [In-memory]"
  - source: "Transformation & Mapping Engine"
    destination: "Mainframe Secure Connector"
    description: "Sends formatted requests [TLS 1.3 with mTLS]"
  - source: "Transformation & Mapping Engine"
    destination: "Mapping Audit Publisher"
    description: "Forwards validation errors [In-memory / Async]"
  - source: "Mapping Audit Publisher"
    destination: "Azure Service Bus"
    description: "Publishes audit events [AMQP]"