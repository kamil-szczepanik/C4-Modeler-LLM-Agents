level: component
scope: "Component diagram for the Azure Container Apps (Adjuster Backend) container"
parentContainer:
  name: "Azure Container Apps (Adjuster Backend)"
elements:
  - type: "component"
    name: "Claim Management Component"
    technology: "ASP.NET Core Minimal APIs / Entity Framework Core"
    description: "Implements adjuster business logic and handles core domain events."
  - type: "component"
    name: "Read-Side Query Component"
    technology: "CQRS Pattern / ASP.NET Core"
    description: "Queries local projections to guarantee sub-2-second responses."
  - type: "component"
    name: "Integration Adapter Component"
    technology: "MassTransit / .NET"
    description: "Dispatches domain events and syncs claim data with the legacy mainframe."
  - type: "component"
    name: "Security & Context Middleware"
    technology: "ASP.NET Core Middleware / Azure Entra ID / JWT"
    description: "Enforces single sign-on, role-based access control, and passes authenticated context."
relationships:
  - source: "Security & Context Middleware"
    destination: "Claim Management Component"
    description: "Passes authenticated context [In-Process]"
  - source: "Claim Management Component"
    destination: "Integration Adapter Component"
    description: "Dispatches domain events [In-Process]"