level: context
scope: "System Context diagram for Insurance Claims Modernization Platform"
system:
  name: "Insurance Claims Modernization Platform"
  description: "A modern cloud-native platform on Microsoft Azure West Europe replacing a legacy COBOL/DB2 mainframe claims system using a hybrid architecture and Strangler Fig pattern."
elements:
  - type: "person"
    name: "Policyholder / Broker"
    description: "Users who submit online claims."
  - type: "person"
    name: "Claims Adjuster"
    description: "Internal users who handle claims via the new web application."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise COBOL/DB2 system acting as the system of record."
  - type: "externalSystem"
    name: "Active Directory / Entra ID"
    description: "Corporate identity provider for Single Sign-On."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Third-party email and SMS gateway."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Enterprise financial system for payouts."
  - type: "container"
    name: "Azure API Management"
    description: "Manages inbound/outbound API traffic, circuit breakers, and OAuth 2.0 enforcement."
    technology: "Azure API Management"
  - type: "container"
    name: "Azure Key Vault"
    description: "Secures secrets and API keys using managed identities."
    technology: "Azure Key Vault"
relationships:
  - source: "Policyholder / Broker"
    destination: "Insurance Claims Modernization Platform"
    description: "Submit online claims."
    technology: "HTTPS/TLS"
  - source: "Claims Adjuster"
    destination: "Insurance Claims Modernization Platform"
    description: "Handle claims via the new web application."
    technology: "HTTPS/TLS"
  - source: "Insurance Claims Modernization Platform"
    destination: "Legacy Mainframe"
    description: "Asynchronous messaging/ETL during batch window."
    technology: "mTLS"
  - source: "Legacy Mainframe"
    destination: "Insurance Claims Modernization Platform"
    description: "Asynchronous messaging/ETL during batch window."
    technology: "mTLS"
  - source: "Insurance Claims Modernization Platform"
    destination: "Active Directory / Entra ID"
    description: "Single Sign-On authentication."
    technology: "OIDC/OAuth 2.0"
  - source: "Insurance Claims Modernization Platform"
    destination: "Notification Service"
    description: "Customer updates via API Management."
    technology: "HTTPS/REST"
  - source: "Insurance Claims Modernization Platform"
    destination: "Payment Gateway"
    description: "Disbursement tracking via API Management."
    technology: "HTTPS/REST"