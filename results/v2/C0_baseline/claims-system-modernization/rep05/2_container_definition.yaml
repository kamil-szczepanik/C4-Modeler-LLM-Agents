level: container
scope: "Container diagram for Insurance Claims Modernization Platform"
system:
  name: "Insurance Claims Modernization Platform"
elements:
  - type: "person"
    name: "Policyholder / Broker"
    description: "Users who submit online claims."
  - type: "person"
    name: "Claims Adjuster"
    description: "Internal users who handle claims via the new web application."
  - type: "externalSystem"
    name: "Legacy Mainframe (COBOL/DB2)"
    description: "On-premise 30-year-old system acting as the system of record."
  - type: "externalSystem"
    name: "Active Directory / Entra ID"
    description: "Corporate identity provider for Single Sign-On."
  - type: "container"
    name: "Azure API Management / Migration Router"
    technology: "Azure API Management"
    description: "Single entry point and dynamic claim-type routing."
  - type: "container"
    name: "Azure Static Web Apps / React Claims Web App"
    technology: "React / Azure Static Web Apps"
    description: "Modern, responsive frontend for claims submission and handling."
  - type: "container"
    name: "Azure Container Apps (Adjuster Backend)"
    technology: "Azure Container Apps"
    description: "Scalable hosting for backend microservices."
  - type: "container"
    name: "Azure Container Apps (Mainframe Integration Adapter)"
    technology: "Azure Container Apps"
    description: "Adapter to connect securely to the legacy mainframe."
  - type: "container"
    name: "Azure App Service & Azure Cosmos DB (Migration Control Service)"
    technology: "Azure App Service & Azure Cosmos DB"
    description: "Manages routing rules and audit reconciliation tracking."
  - type: "container"
    name: "Azure Service Bus & Azure Functions (Integration & Sync Service)"
    technology: "Azure Service Bus & Azure Functions"
    description: "Event-driven asynchronous synchronization."
  - type: "container"
    name: "Azure Key Vault"
    technology: "Azure Key Vault"
    description: "Secure secrets management."
relationships:
  - source: "Policyholder / Broker"
    destination: "Azure API Management / Migration Router"
    description: "Accesses Claims Web App via HTTPS"
    technology: "HTTPS"
  - source: "Claims Adjuster"
    destination: "Azure Static Web Apps / React Claims Web App"
    description: "Interacts with Claims Web App using OAuth 2.0 / OIDC"
    technology: "REST/GraphQL / OAuth 2.0 / OIDC"
  - source: "Azure API Management / Migration Router"
    destination: "Azure Container Apps (Mainframe Integration Adapter)"
    description: "Dynamically routes traffic"
    technology: "HTTPS"
  - source: "Azure API Management / Migration Router"
    destination: "Azure Container Apps (Adjuster Backend)"
    description: "Dynamically routes traffic"
    technology: "HTTPS"
  - source: "Azure Container Apps (Mainframe Integration Adapter)"
    destination: "Legacy Mainframe (COBOL/DB2)"
    description: "Connects securely with IP whitelisting"
    technology: "TLS 1.3 with mTLS"
  - source: "Azure Service Bus & Azure Functions (Integration & Sync Service)"
    destination: "Azure Container Apps (Adjuster Backend)"
    description: "Communicates asynchronously"
    technology: "Azure Service Bus"
  - source: "Migration Control Service"
    destination: "Azure Cosmos DB"
    description: "Manages routing rules stored in database"
    technology: "Cosmos DB SDK"