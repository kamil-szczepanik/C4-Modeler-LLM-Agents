level: component
scope: "Component diagram for the Claim Routing & Feature Service container"
parentContainer:
  name: "Claim Routing & Feature Service"
elements:
  - type: "component"
    name: "Routing Engine Component"
    technology: ".NET Core / MediatR"
    description: "Orchestrates hybrid cloud claim processing and routes claims based on feature flags."
  - type: "component"
    name: "Feature Flag Manager Component"
    technology: ".NET Core / Microsoft Feature Management"
    description: "Manages the gradual migration of claim types using dynamic feature flags."
  - type: "component"
    name: "Context & Auth Validator Component"
    technology: ".NET Core Middleware"
    description: "Validates context and authentication for incoming requests."
  - type: "component"
    name: "Telemetry Publisher Component"
    technology: ".NET Core / Azure Monitor & Event Hubs"
    description: "Exports distributed traces, metrics, and security audit logs."
relationships:
  - source: "Feature Flag Manager Component"
    destination: "Azure App Configuration"
    description: "Fetches feature states [HTTPS via Managed Identity]"
  - source: "Routing Engine Component"
    destination: "Claims Integration Service"
    description: "Sends asynchronous messages for mainframe synchronization [AMQP via Azure Service Bus]"
  - source: "Telemetry Publisher Component"
    destination: "Azure Monitor"
    description: "Exports distributed traces, metrics, and security audit logs [OpenTelemetry / OTLP]"