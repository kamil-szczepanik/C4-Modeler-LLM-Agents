level: component
scope: "Component diagram for the Audit & Compliance Data Store container"
parentContainer:
  name: "Audit & Compliance Data Store"
elements:
  - type: "component"
    name: "Audit Ingestion Function"
    technology: "Azure Function / .NET Core"
    description: "Ingests audit events and writes immutable records to the audit data store."
  - type: "component"
    name: "Compliance Indexing & Query API"
    technology: "Azure Function / .NET Core"
    description: "Queries compliance data and audit reports for compliance and audit officers."
  - type: "component"
    name: "Audit Export & Retention Worker"
    technology: "Azure Function / .NET Core"
    description: "Reads expired logs via change feed and archives immutable snapshots to blob storage."
  - type: "component"
    name: "Audit Data Store"
    technology: "Azure Cosmos DB - SQL API"
    description: "Stores immutable audit events utilizing time-to-live and change feeds."
  - type: "component"
    name: "Azure Blob Storage"
    technology: "Azure Blob Storage"
    description: "Provides cost-effective cold storage with immutable time-based retention policies for long-term archiving."
  - type: "component"
    name: "Claims Integration Service"
    technology: "External Service"
    description: "Sends audit events via POST /api/audit."
  - type: "component"
    name: "Compliance & Audit Officers"
    technology: "User"
    description: "Queries audit reports via HTTPS and Azure Front Door."
relationships:
  - source: "Claims Integration Service"
    destination: "Audit Ingestion Function"
    description: "POST /api/audit via HTTPS/JSON"
  - source: "Audit Ingestion Function"
    destination: "Audit Data Store"
    description: "Writes immutable audit events via Cosmos DB SDK / TCP"
  - source: "Compliance & Audit Officers"
    destination: "Compliance Indexing & Query API"
    description: "Queries audit reports via HTTPS / Azure Front Door"
  - source: "Audit Export & Retention Worker"
    destination: "Audit Data Store"
    description: "Reads expired logs via Cosmos DB Change Feed / TCP"
  - source: "Audit Export & Retention Worker"
    destination: "Azure Blob Storage"
    description: "Archives immutable snapshots via HTTPS / Azure Blob SDK"
  - source: "Compliance Indexing & Query API"
    destination: "Audit Data Store"
    description: "Queries hot compliance data via Cosmos DB SQL API / TCP"