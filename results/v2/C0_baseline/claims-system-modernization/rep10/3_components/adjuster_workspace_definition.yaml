level: component
scope: "Component diagram for the Adjuster Workspace container"
parentContainer:
  name: "Adjuster Workspace"
elements:
  - type: "component"
    name: "Workspace UI Controller"
    technology: ".NET Core / Azure Container Apps"
    description: "Manages claim workflows and user interactions."
  - type: "component"
    name: "Claim Presentation Service"
    technology: ".NET Core / Azure Container Apps"
    description: "Validates JWT claims and processes claim presentation logic."
  - type: "component"
    name: "Dynamic Workflow Engine"
    technology: ".NET Core / Azure Container Apps"
    description: "Orchestrates dynamic claim workflows and emits audit events."
relationships:
  - source: "Claim Adjusters"
    destination: "Workspace UI Controller"
    description: "Manages claim workflows [HTTPS via TLS 1.3, OAuth 2.0 / OpenID Connect]"
  - source: "Workspace UI Controller"
    destination: "Claim Presentation Service"
    description: "Validates JWT claims [In-process / Internal invocation]"
  - source: "Claim Presentation Service"
    destination: "Azure Redis Cache"
    description: "Fetches UI metadata [Encrypted gRPC]"
  - source: "Claim Presentation Service"
    destination: "Claim Routing & Feature Service"
    description: "Requests raw claim data and feature flags [gRPC over VNet with mTLS]"
  - source: "Dynamic Workflow Engine"
    destination: "Audit & Compliance Data Store"
    description: "Emits audit events [Asynchronous via Azure Service Bus]"