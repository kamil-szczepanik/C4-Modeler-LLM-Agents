level: component
scope: "Component diagram for the Customer Portal container"
parentContainer:
  name: "Customer Portal"
elements:
  - type: "component"
    name: "Authentication Wrapper"
    technology: "MSAL.js"
    description: "Component handling OIDC/OAuth2 SSO and secure Azure AD integration."
  - type: "component"
    name: "Claim Submission Form"
    technology: "React component"
    description: "React component managing multi-step claim wizards."
  - type: "component"
    name: "Document Uploader"
    technology: "React component"
    description: "React component interacting with Azure Blob Storage for attachments."
  - type: "component"
    name: "Claim Tracker View"
    technology: "React component"
    description: "React component using HTTP Polling to check claim status."
relationships:
  - source: "Authentication Wrapper"
    destination: "Azure Active Directory"
    description: "Authenticates users [OIDC over HTTPS]"
  - source: "Claim Submission Form"
    destination: "Claim Routing & Feature Service"
    description: "Submits claim data [HTTP/REST over HTTPS]"
  - source: "Document Uploader"
    destination: "Azure Blob Storage"
    description: "Uploads attachments [HTTPS PUT via short-lived SAS tokens]"
  - source: "Claim Tracker View"
    destination: "Claim Routing & Feature Service"
    description: "Polls claim status [HTTP Polling over HTTPS]"