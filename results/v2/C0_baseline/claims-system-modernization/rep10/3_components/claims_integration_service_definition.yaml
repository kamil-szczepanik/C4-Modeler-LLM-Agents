level: component
scope: "Component diagram for the Claims Integration Service container"
parentContainer:
  name: "Claims Integration Service"
elements:
  - type: "component"
    name: "Routing & Translation Component"
    technology: ".NET Core / JSON-based Rules"
    description: "Handles dynamic claim routing rules and translation."
  - type: "component"
    name: "Mainframe Adapter Component"
    technology: ".NET Core / MQ Client with Polly Circuit Breaker"
    description: "Interfaces with the legacy mainframe via MQ client and Polly circuit breaker."
  - type: "component"
    name: "Synchronization & State Worker"
    technology: ".NET Core Background Service"
    description: "Processes asynchronous claim messages and manages state."
  - type: "component"
    name: "Integration API Controller"
    technology: ".NET Core Minimal API"
    description: "Serves synchronization health and routing status to the Adjuster Workspace."
  - type: "component"
    name: "State & Outbox Store"
    technology: "Azure Database for PostgreSQL - Flexible Server"
    description: "Persists transactional outbox data using Entity Framework Core with TDE."
  - type: "component"
    name: "Configuration Store"
    technology: "Azure App Configuration"
    description: "Stores dynamic routing rules securely with zero-code fallback triggers."
  - type: "component"
    name: "Secret Management"
    technology: "Azure Key Vault with Managed Identities"
    description: "Manages secrets securely using managed identities."
relationships:
  - source: "Synchronization & State Worker"
    destination: "State & Outbox Store"
    description: "Persists transactional outbox data [Entity Framework Core with TDE]"
  - source: "Mainframe Adapter Component"
    destination: "Legacy Mainframe"
    description: "Synchronizes data [Secure FTP / MQ over ExpressRoute/IPSec VPN with mTLS]"
  - source: "Integration API Controller"
    destination: "Adjuster Workspace"
    description: "Serves synchronization health and routing status [HTTPS / REST with Azure AD RBAC]"
  - source: "Routing & Translation Component"
    destination: "Azure App Configuration"
    description: "Retrieves dynamic claim routing rules [HTTPS with Azure RBAC]"