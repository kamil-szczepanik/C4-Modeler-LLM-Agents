level: context
scope: "System Context diagram for Hybrid Insurance Claims Modernization Platform"
system:
  name: "Hybrid Insurance Claims Modernization Platform"
  description: "A hybrid insurance claims modernization platform that gradually replaces a 30-year-old COBOL/DB2 mainframe while maintaining continuous legacy processing, providing modern cloud capabilities for customers, brokers, and adjusters."
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "External users submitting claims online."
  - type: "person"
    name: "Claim Adjusters"
    description: "Internal users managing claims via the new web application."
  - type: "person"
    name: "Compliance & Audit Officers"
    description: "Internal users accessing read-only audit trails."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise 30-year-old COBOL/DB2 system acting as the system of record."
  - type: "externalSystem"
    name: "Azure Service Bus"
    description: "Managed message broker in Azure acting as a decoupled integration buffer."
  - type: "externalSystem"
    name: "Active Directory"
    description: "On-premise enterprise identity provider."
relationships:
  - source: "Customers and Brokers"
    destination: "Hybrid Insurance Claims Modernization Platform"
    description: "Submit claims online"
    technology: "HTTPS (Web/Mobile UI)"
  - source: "Claim Adjusters"
    destination: "Hybrid Insurance Claims Modernization Platform"
    description: "Manage claims via the new web application"
    technology: "HTTPS (Web/Mobile UI)"
  - source: "Compliance & Audit Officers"
    destination: "Hybrid Insurance Claims Modernization Platform"
    description: "Access read-only audit trails"
    technology: "HTTPS (Web/Mobile UI)"
  - source: "Hybrid Insurance Claims Modernization Platform"
    destination: "Azure Service Bus"
    description: "Asynchronous claims synchronization"
    technology: "AMQP / HTTPS"
  - source: "Hybrid Insurance Claims Modernization Platform"
    destination: "Legacy Mainframe"
    description: "Asynchronous messaging / ETL via integration buffer"
    technology: "Asynchronous messaging / ETL"
  - source: "Legacy Mainframe"
    destination: "Hybrid Insurance Claims Modernization Platform"
    description: "Legacy system synchronization"
    technology: "Asynchronous messaging / ETL"
  - source: "Hybrid Insurance Claims Modernization Platform"
    destination: "Active Directory"
    description: "Authentication and authorization via Azure AD Connect with Hybrid Conditional Access"
    technology: "OAuth2 / OpenID Connect"