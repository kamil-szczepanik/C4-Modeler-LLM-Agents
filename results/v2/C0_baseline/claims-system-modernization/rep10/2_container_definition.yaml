level: container
scope: "Container diagram for Hybrid Insurance Claims Modernization Platform"
system:
  name: "Hybrid Insurance Claims Modernization Platform"
elements:
  - type: "person"
    name: "Customer/Broker"
    description: "External users submitting claims online."
  - type: "person"
    name: "Claim Adjuster"
    description: "Internal users managing claims via the new workspace."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "30-year-old COBOL/DB2 on-premises system of record."
  - type: "externalSystem"
    name: "Azure Service Bus"
    description: "Asynchronous message broker guaranteeing reliable processing and consistency."
  - type: "externalSystem"
    name: "Azure Key Vault"
    description: "Secure storage for secrets and certificates."
  - type: "externalSystem"
    name: "Application Insights"
    description: "Monitoring and telemetry service."
  - type: "container"
    name: "Customer Portal"
    technology: "React Single Page Application / Azure Static Web Apps"
    description: "Frontend interface for customers and brokers to submit claims."
  - type: "container"
    name: "Adjuster Workspace"
    technology: ".NET Core web application / Azure Container Apps"
    description: "Internal workspace for claim adjusters to manage workflows."
  - type: "container"
    name: "Claim Routing & Feature Service"
    technology: ".NET Core API / Azure Container Apps"
    description: "Lightweight API managing claim type migration via feature flags."
  - type: "container"
    name: "Claims Integration Service"
    technology: ".NET Core worker/API / Azure Container Apps"
    description: "Handles data synchronization with the legacy mainframe."
  - type: "container"
    name: "Audit & Compliance Data Store"
    technology: "Azure Cosmos DB / Azure Functions"
    description: "Unified audit trails and compliance data management."
relationships:
  - source: "Customer/Broker"
    destination: "Customer Portal"
    description: "Submits and views claims"
    technology: "HTTPS over Internet"
  - source: "Claim Adjuster"
    destination: "Adjuster Workspace"
    description: "Manages claim workflows"
    technology: "HTTPS (OAuth 2.0 / OpenID Connect via Microsoft Entra ID)"
  - source: "Adjuster Workspace"
    destination: "Claim Routing & Feature Service"
    description: "Routes claims and checks feature flags"
    technology: "gRPC over internal VNet"
  - source: "Claim Routing & Feature Service"
    destination: "Claims Integration Service"
    description: "Sends asynchronous messages for mainframe synchronization"
    technology: "Azure Service Bus"
  - source: "Claims Integration Service"
    destination: "Legacy Mainframe"
    description: "Synchronizes data with legacy system"
    technology: "Secure FTP / MQ over ExpressRoute/IPSec VPN with mTLS"
  - source: "Claims Integration Service"
    destination: "Audit & Compliance Data Store"
    description: "Records audit logs and compliance data"
    technology: "HTTPS / Azure Functions"