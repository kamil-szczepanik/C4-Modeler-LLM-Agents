level: container
scope: "Container diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
elements:
  - type: "person"
    name: "Customers & Brokers"
    description: "External users submitting and tracking claims online."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users managing claims via the new web application."
  - type: "externalSystem"
    name: "Azure API Management (APIM)"
    description: "Secure gateway managing traffic and enforcing mTLS with the on-premise mainframe."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise COBOL/DB2 system of record."
  - type: "container"
    name: "Customer Portal"
    technology: "React, Azure Static Web Apps"
    description: "Frontend application allowing external users to submit and track claims online."
  - type: "container"
    name: "Adjuster Workspace"
    technology: "React, Azure Static Web Apps"
    description: "Frontend application enabling internal adjusters to manage claims."
  - type: "container"
    name: "Backend APIs"
    technology: ".NET, Azure Container Apps"
    description: "Unified serverless container runtime hosting core backend APIs."
  - type: "container"
    name: "Migration & Sync Engine"
    technology: ".NET, Azure Container Apps"
    description: "Engine managing data synchronization and gradual migration with the legacy mainframe."
  - type: "container"
    name: "Integration Workers"
    technology: ".NET, Azure Container Apps"
    description: "Background workers handling asynchronous event processing."
  - type: "container"
    name: "Azure Service Bus"
    technology: "Azure Service Bus"
    description: "Messaging backbone supporting asynchronous CQRS and reliable event streaming."
  - type: "container"
    name: "Azure SQL Database"
    technology: "SQL Server, Entity Framework Core"
    description: "Modern datastore for modern claim types utilizing Transparent Data Encryption (TDE)."
relationships:
  - source: "Customers & Brokers"
    destination: "Azure API Management (APIM)"
    description: "Interact with the Customer Portal via HTTPS/JSON routed through APIM"
    technology: "HTTPS/JSON"
  - source: "Claims Adjusters"
    destination: "Azure API Management (APIM)"
    description: "Interact with the Adjuster Workspace via HTTPS/JSON routed through APIM"
    technology: "HTTPS/JSON"
  - source: "Azure API Management (APIM)"
    destination: "Customer Portal"
    description: "Routes external traffic to"
    technology: "HTTPS"
  - source: "Azure API Management (APIM)"
    destination: "Adjuster Workspace"
    description: "Routes external traffic to"
    technology: "HTTPS"
  - source: "Customer Portal"
    destination: "Backend APIs"
    description: "Calls backend APIs for data and operations"
    technology: "HTTPS/JSON"
  - source: "Adjuster Workspace"
    destination: "Backend APIs"
    description: "Calls backend APIs for data and operations"
    technology: "HTTPS/JSON"
  - source: "Backend APIs"
    destination: "Azure SQL Database"
    description: "Reads and writes modern claim types"
    technology: "Entity Framework Core"
  - source: "Backend APIs"
    destination: "Azure Service Bus"
    description: "Publishes and consumes asynchronous messages"
    technology: "AMQP"
  - source: "Integration Workers"
    destination: "Azure Service Bus"
    description: "Processes asynchronous messages"
    technology: "AMQP"
  - source: "Migration & Sync Engine"
    destination: "Azure Service Bus"
    description: "Publishes and consumes sync events"
    technology: "AMQP"
  - source: "Migration & Sync Engine"
    destination: "Azure API Management (APIM)"
    description: "Connects to the legacy system via APIM"
    technology: "mTLS and IP whitelisting"
  - source: "Azure API Management (APIM)"
    destination: "Legacy Mainframe"
    description: "Enforces mTLS and manages traffic to the on-premise system of record"
    technology: "mTLS / HTTPS"