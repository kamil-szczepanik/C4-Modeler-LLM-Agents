level: component
scope: "Component diagram for the Adjuster Workspace container"
parentContainer:
  name: "Adjuster Workspace"
elements:
  - type: "component"
    name: "Claim Management Module"
    technology: "React / Redux"
    description: "Core UI component managing state, keyboard-first navigation, and optimistic UI updates."
  - type: "component"
    name: "Hybrid Data Adapter"
    technology: "TypeScript / Data Abstraction Layer"
    description: "Data abstraction layer handling mixed data sourcing from Azure SQL and the Legacy Mainframe."
  - type: "component"
    name: "Auth Integration Client"
    technology: "MSAL.js"
    description: "Authentication component enforcing Azure Active Directory single sign-on (R-07)."
  - type: "component"
    name: "Offline Sync Manager"
    technology: "IndexedDB / TypeScript"
    description: "Component intercepting mutations during network drops, utilizing IndexedDB for local caching and auto-syncing."
  - type: "component"
    name: "Audit Banner Component"
    technology: "React"
    description: "Persistent UI element indicating whether an active claim resides in Azure or the Legacy Mainframe."
  - type: "component"
    name: "React Error Boundaries"
    technology: "React"
    description: "Operational wrapper catching client-side rendering and IndexedDB errors."
relationships:
  - source: "Azure API Management (APIM)"
    destination: "Adjuster Workspace"
    description: "Routes external traffic securely [HTTPS]"
  - source: "Claim Management Module"
    destination: "Hybrid Data Adapter"
    description: "Fetches and mutates claim records [TypeScript]"
  - source: "Hybrid Data Adapter"
    destination: "Backend APIs"
    description: "Communicates for data operations via APIM [HTTPS/JSON]"
  - source: "Auth Integration Client"
    destination: "External Identity Provider"
    description: "Validates tokens via Azure Active Directory [OpenID Connect]"
  - source: "Claim Management Module"
    destination: "Offline Sync Manager"
    description: "Delegates offline mutations during network disconnection [TypeScript]"
  - source: "Claim Management Module"
    destination: "Audit Banner Component"
    description: "Renders truth-status metadata [React Props]"