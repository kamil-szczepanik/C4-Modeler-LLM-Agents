level: component
scope: "Component diagram for the Azure SQL Database container"
parentContainer:
  name: "Azure SQL Database"
elements:
  - type: "component"
    name: "Claims Core Module"
    technology: "Relational tables with Temporal Tables"
    description: "Handles core claim types, domain logic, and provides auditability via built-in temporal features."
  - type: "component"
    name: "Sync & Integration Module"
    technology: "Idempotency and outbox pattern tables"
    description: "Manages sync states and mirrored data to bridge the modern Azure environment with the legacy mainframe."
  - type: "component"
    name: "Performance Views"
    technology: "Indexed views"
    description: "Provides optimized data access to ensure sub-2-second adjuster screen loads."
relationships:
  - source: "Backend APIs"
    destination: "Claims Core Module"
    description: "Reads and writes modern claim types [Entity Framework Core / T-SQL]"
  - source: "Migration & Sync Engine"
    destination: "Sync & Integration Module"
    description: "Reads/Writes sync states and mirrored data [T-SQL / EF Core]"
  - source: "Integration Workers"
    destination: "Claims Core Module"
    description: "Updates claim processing status [EF Core / T-SQL]"