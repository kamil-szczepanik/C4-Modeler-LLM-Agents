level: component
scope: "Component diagram for the Backend APIs container"
parentContainer:
  name: "Backend APIs"
elements:
  - type: "component"
    name: "Claim Routing Component"
    technology: ".NET / MediatR / Azure App Configuration"
    description: "Routes claims and handles dynamic feature flags for gradual migration."
  - type: "component"
    name: "Read Model & Caching Component"
    technology: ".NET / Redis / Azure SQL"
    description: "Provides high-performance caching and relational persistence for sub-2s response times."
  - type: "component"
    name: "Command Processing Component"
    technology: ".NET / FluentValidation"
    description: "Processes commands and ensures data validation."
  - type: "component"
    name: "API Gateway Controller Layer"
    technology: ".NET / ASP.NET Core"
    description: "Core application framework for unified backend APIs."
  - type: "component"
    name: "Mainframe Anti-Corruption Layer (ACL) Client"
    technology: ".NET / Polly"
    description: "Manages integration with the legacy mainframe using resilience policies."
relationships:
  - source: "Claim Routing Component"
    destination: "Read Model & Caching Component"
    description: "In-Process / MediatR"
  - source: "Claim Routing Component"
    destination: "Command Processing Component"
    description: "In-Process / MediatR"
  - source: "Command Processing Component"
    destination: "Azure Service Bus"
    description: "AMQP"
  - source: "Backend APIs"
    destination: "Azure SQL Database"
    description: "Entity Framework Core / Managed Identity"