level: component
scope: "Component diagram for the Azure Service Bus container"
parentContainer:
  name: "Azure Service Bus"
elements:
  - type: "component"
    name: "Azure Service Bus Premium Namespace"
    technology: "Azure Service Bus Premium Tier"
    description: "Serves as the asynchronous messaging backbone providing guaranteed resource isolation, throughput, and disaster recovery."
  - type: "component"
    name: "Claim Events Topic"
    technology: "Azure Service Bus Topic with SQL-filter rules"
    description: "Routes domain events and commands with SQL-filter rules per claim type."
  - type: "component"
    name: "Legacy Sync Queue"
    technology: "Azure Service Bus Queue with FIFO Sessions"
    description: "Manages legacy synchronization using FIFO Session IDs mapping to Claim IDs."
  - type: "component"
    name: "System Dead-Letter Sub-system"
    technology: "Azure Service Bus DLQ with auto-forwarding"
    description: "Handles poisoned messages and processing failures with DLQs and auto-forwarding."
  - type: "component"
    name: "Private Endpoints and VNet Integration"
    technology: "Azure Private Link & Private Endpoints"
    description: "Secures network traffic across the hybrid boundary, blocking public internet access."
relationships:
  - source: "Backend APIs"
    destination: "Claim Events Topic"
    description: "Publishes domain events and commands [AMQP 1.0 over TLS 1.3]"
  - source: "Migration & Sync Engine"
    destination: "Legacy Sync Queue"
    description: "Publishes and consumes sync events [AMQP 1.0 over TLS 1.3]"
  - source: "Integration Workers"
    destination: "Legacy Sync Queue"
    description: "Consumes FIFO claim messages via sessions [AMQP 1.0 over TLS 1.3]"
  - source: "Migration Operators"
    destination: "System Dead-Letter Sub-system"
    description: "Tries, purges, and resubmits poisoned messages [Azure Portal / CLI]"