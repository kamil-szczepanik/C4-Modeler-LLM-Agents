level: component
scope: "Component diagram for the Customer Portal container"
parentContainer:
  name: "Customer Portal"
elements:
  - type: "component"
    name: "Customer Portal (Authentication Client)"
    technology: "MSAL.js"
    description: "Client-side authentication and role-aware session management via Azure AD."
  - type: "component"
    name: "Customer Portal (Claim Submission Controller)"
    technology: "React & React Hook Form with Zod"
    description: "Frontend UI and multi-step claim validation for submitting claim payloads."
  - type: "component"
    name: "Customer Portal (Document Upload Manager)"
    technology: "React"
    description: "Uploads binaries via server-brokered SAS tokens to Azure Blob Storage."
  - type: "component"
    name: "Customer Portal (Claim Tracker Dashboard)"
    technology: "React"
    description: "Fetches claim status via polling."
relationships:
  - source: "Customer Portal (Authentication Client)"
    destination: "Azure AD"
    description: "Authenticates users [OIDC/OAuth2 via HTTPS]"
  - source: "Customer Portal (Claim Submission Controller)"
    destination: "Backend APIs"
    description: "Submits claim payloads [HTTPS/JSON]"
  - source: "Customer Portal (Document Upload Manager)"
    destination: "Azure Blob Storage"
    description: "Uploads binaries via server-brokered SAS tokens [HTTPS]"
  - source: "Customer Portal (Claim Tracker Dashboard)"
    destination: "Backend APIs"
    description: "Fetches claim status via polling [HTTPS/JSON]"