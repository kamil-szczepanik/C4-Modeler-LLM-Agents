level: component
scope: "Component diagram for the Migration & Sync Engine container"
parentContainer:
  name: "Migration & Sync Engine"
elements:
  - type: "component"
    name: "Sync Coordinator"
    technology: ".NET, MassTransit, Microsoft.FeatureManagement, Entity Framework Core"
    description: "Manages data synchronization and robust messaging patterns with outbox pattern for zero-loss transactions."
  - type: "component"
    name: "Transformation Adapter"
    technology: "AutoMapper, Polly"
    description: "Handles schema transformations and provides resilient circuit breakers for fragile mainframe calls."
  - type: "component"
    name: "Reconciliation Worker"
    technology: ".NET background service"
    description: "Performs reconciliation processes to ensure consistency between systems."
  - type: "component"
    name: "Routing & Policy Engine"
    technology: "Azure App Configuration"
    description: "Enables dynamic runtime claim-type routing and rapid rollbacks."
  - type: "component"
    name: "Migration Operator Dashboard"
    technology: "React, Azure Static Web Apps"
    description: "Exposes sync metrics and rollback controls to operations teams."
relationships:
  - source: "Sync Coordinator"
    destination: "Transformation Adapter"
    description: "Sends payloads for transformation"
  - source: "Transformation Adapter"
    destination: "Reconciliation Worker"
    description: "Provides processed data for consistency checks"
  - source: "Routing & Policy Engine"
    destination: "Sync Coordinator"
    description: "Supplies dynamic routing policies and feature flags"
  - source: "Migration Operator Dashboard"
    destination: "Sync Coordinator"
    description: "Exposes sync metrics and triggers rollback controls"