level: component
scope: "Component diagram for the Integration Workers container"
parentContainer:
  name: "Integration Workers"
elements:
  - type: "component"
    name: "Message Router Component"
    technology: ".NET / MassTransit"
    description: "Consumes and publishes asynchronous messages and evaluates claim type routing rules."
  - type: "component"
    name: "Mainframe Sync Adaptor Component"
    technology: ".NET / Polly"
    description: "Synchronizes legacy payloads, enforces rate-limiting, and retrieves mTLS certificates and credentials."
  - type: "component"
    name: "Audit & Reconciliation Component"
    technology: ".NET / EF Core"
    description: "Writes cryptographically hashed, append-only audit logs to Azure SQL Database."
  - type: "component"
    name: "Claim State Evaluator Component"
    technology: ".NET"
    description: "Evaluates claim type routing rules in-process."
  - type: "component"
    name: "Telemetry Publisher Component"
    technology: ".NET / OpenTelemetry"
    description: "Exports worker lag, metrics, and structured logs to Azure Application Insights."
  - type: "component"
    name: "Azure Service Bus"
    technology: "Azure Messaging"
    description: "Facilitates asynchronous messaging for the message router."
  - type: "component"
    name: "Azure SQL Database"
    technology: "Azure SQL"
    description: "Stores cryptographically hashed, append-only audit logs."
  - type: "component"
    name: "Azure Key Vault"
    technology: "Azure Security"
    description: "Provides secure secret management via Managed Identities."
  - type: "component"
    name: "Azure Application Insights"
    technology: "Azure Monitoring"
    description: "Collects telemetry, metrics, and structured logs."
  - type: "component"
    name: "Legacy Mainframe"
    technology: "Mainframe"
    description: "System of record for legacy insurance data."
relationships:
  - source: "Message Router Component"
    destination: "Azure Service Bus"
    description: "Consumes and publishes asynchronous messages [AMQP]"
  - source: "Message Router Component"
    destination: "Claim State Evaluator Component"
    description: "Evaluates claim type routing rules [In-process]"
  - source: "Mainframe Sync Adaptor Component"
    destination: "Legacy Mainframe"
    description: "Synchronizes legacy payloads and enforces rate-limiting [mTLS/HTTPS]"
  - source: "Mainframe Sync Adaptor Component"
    destination: "Azure Key Vault"
    description: "Retrieves mTLS certificates and credentials [Managed Identity]"
  - source: "Audit & Reconciliation Component"
    destination: "Azure SQL Database"
    description: "Writes cryptographically hashed, append-only audit logs [EF Core/T-SQL]"
  - source: "Telemetry Publisher Component"
    destination: "Azure Application Insights"
    description: "Exports worker lag, metrics, and structured logs [OpenTelemetry]"