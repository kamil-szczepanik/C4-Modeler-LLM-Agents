level: context
scope: "System Context diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
  description: "A modern cloud-native platform gradually replacing a 30-year-old COBOL/DB2 mainframe claims system in a hybrid environment, ensuring business continuity, data consistency, and single sign-on."
elements:
  - type: "person"
    name: "Customers & Brokers"
    description: "External users submitting claims online."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users handling claims via the modern web application."
  - type: "person"
    name: "Migration Operators"
    description: "Risk and operations staff managing data consistency and rollbacks."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premise COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "External Identity Provider"
    description: "On-premises Active Directory managing single sign-on and identity federation."
  - type: "externalSystem"
    name: "Azure API Management (APIM)"
    description: "Gateway acting as the single secure entry point, centralizing ingress, mTLS enforcement, OAuth2 token validation, and rate-limiting."
  - type: "externalSystem"
    name: "Azure Service Bus"
    description: "Asynchronous integration broker handling reliable messaging and dead-letter queuing to respect the mainframe batch window."
  - type: "externalSystem"
    name: "Azure Application Insights"
    description: "Provides centralized logging and distributed tracing for operational observability."
relationships:
  - source: "Customers & Brokers"
    destination: "Azure API Management (APIM)"
    description: "Submit claims online"
    technology: "HTTPS"
  - source: "Claims Adjusters"
    destination: "Azure API Management (APIM)"
    description: "Handle claims via the modern web application"
    technology: "HTTPS"
  - source: "Migration Operators"
    destination: "Modern Claims Platform"
    description: "Manage data consistency and rollbacks"
    technology: "HTTPS"
  - source: "Azure API Management (APIM)"
    destination: "Modern Claims Platform"
    description: "Integrates with the modern claims platform"
    technology: "REST/gRPC"
  - source: "Modern Claims Platform"
    destination: "Legacy Mainframe"
    description: "Connects via asynchronous messaging"
    technology: "Azure Service Bus over TLS 1.3 and mTLS"
  - source: "Modern Claims Platform"
    destination: "External Identity Provider"
    description: "Authenticates users against Active Directory"
    technology: "OIDC/SAML"