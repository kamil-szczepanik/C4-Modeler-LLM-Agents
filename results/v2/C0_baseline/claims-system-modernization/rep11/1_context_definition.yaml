level: context
scope: "System Context diagram for Insurance Claims Modernization Platform"
system:
  name: "Insurance Claims Modernization Platform"
  description: "A hybrid platform that gradually replaces a legacy mainframe, providing online claims submission, adjuster web applications, and incremental claim type migration."
elements:
  - type: "person"
    name: "Customers"
    description: "End users who submit online claims."
  - type: "person"
    name: "Brokers"
    description: "Intermediaries who submit and manage claims on behalf of customers."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff who access web applications to review and process claims."
  - type: "person"
    name: "Underwriters"
    description: "Internal staff reviewing claim risk and policy implications."
  - type: "person"
    name: "Finance Operations"
    description: "Internal staff managing financial payouts and reconciliations."
  - type: "externalSystem"
    name: "Legacy Mainframe System"
    description: "On-premises 30-year-old COBOL/DB2 mainframe acting as the system of record."
  - type: "externalSystem"
    name: "Active Directory / Azure AD"
    description: "Identity provider handling SSO authentication."
  - type: "externalSystem"
    name: "Third-Party Payment Gateway"
    description: "External service processing financial transactions and payouts."
  - type: "externalSystem"
    name: "Business Analytics System"
    description: "System receiving anonymized data exports for analytics."
  - type: "container"
    name: "Azure API Gateway"
    description: "Entry point featuring caching and circuit breakers."
    technology: "Azure PaaS / API Gateway"
  - type: "container"
    name: "Claims Web Application"
    description: "Web application used by customers, brokers, and adjusters."
    technology: "Modern Web Application Framework"
  - type: "container"
    name: "Abstraction-Layer Gateway / Message Queue"
    description: "Asynchronous messaging abstraction to isolate legacy mainframe interface changes."
    technology: "Enterprise Message Queue"
  - type: "container"
    name: "Azure Database"
    description: "Cloud database supporting the modernization platform."
    technology: "Azure Database / PaaS"
relationships:
  - source: "Customers"
    destination: "Claims Web Application"
    description: "Interact for online claim submission"
    technology: "HTTPS (TLS 1.3)"
  - source: "Brokers"
    destination: "Claims Web Application"
    description: "Interact for online claim submission"
    technology: "HTTPS (TLS 1.3)"
  - source: "Claims Adjusters"
    destination: "Claims Web Application"
    description: "Access web applications with SSO authentication"
    technology: "HTTPS, Active Directory SSO"
  - source: "Insurance Claims Modernization Platform"
    destination: "Legacy Mainframe System"
    description: "Communicates via asynchronous messaging through an abstraction-layer gateway"
    technology: "Asynchronous Messaging"
  - source: "Insurance Claims Modernization Platform"
    destination: "Third-Party Payment Gateway"
    description: "Integrates for payment processing"
    technology: "REST / HTTPS, OAuth 2.0"
  - source: "Insurance Claims Modernization Platform"
    destination: "Business Analytics System"
    description: "Exports anonymized data via secure batch file drops"
    technology: "Secure Batch File Drops"