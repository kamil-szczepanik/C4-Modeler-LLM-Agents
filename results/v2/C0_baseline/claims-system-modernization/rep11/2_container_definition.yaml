level: container
scope: "Container diagram for Insurance Claims Modernization Platform"
system:
  name: "Insurance Claims Modernization Platform"
elements:
  - type: "person"
    name: "Customers"
    description: "End users who submit online claims."
  - type: "person"
    name: "Brokers"
    description: "Intermediaries who submit and manage claims on behalf of customers."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff who access web applications to review and process claims."
  - type: "person"
    name: "Operations Managers"
    description: "Internal staff managing operations and tracking dispute & exception dashboards."
  - type: "externalSystem"
    name: "Legacy COBOL/DB2 Mainframe"
    description: "On-premises 30-year-old COBOL/DB2 mainframe acting as the system of record."
  - type: "externalSystem"
    name: "Azure AD"
    description: "Identity provider handling OAuth 2.0 / OIDC authentication."
  - type: "container"
    name: "Web Portal (SPA)"
    technology: "React hosted on Azure Static Web Apps"
    description: "Responsive user interface for customers and brokers."
  - type: "container"
    name: "Adjuster Portal (SPA)"
    technology: "React hosted on Azure Static Web Apps"
    description: "Responsive user interface for claims adjusters."
  - type: "container"
    name: "Dispute & Exception Dashboard"
    technology: "React hosted on Azure Static Web Apps"
    description: "User interface for tracking disputes and exceptions."
  - type: "container"
    name: "Claims API (BFF)"
    technology: "Node.js / TypeScript in Azure Kubernetes Service (AKS)"
    description: "Backend-for-Frontend service managing requests and routing rules."
  - type: "container"
    name: "Mainframe Adapter"
    technology: "Node.js / TypeScript in Azure Kubernetes Service (AKS)"
    description: "Adapter service communicating securely with the on-premise legacy mainframe."
  - type: "container"
    name: "Feature Flag / Routing Service"
    technology: "Azure App Configuration"
    description: "Service managing dynamic claim-type routing and feature flags."
  - type: "container"
    name: "Azure Service Bus"
    technology: "Azure Service Bus"
    description: "Asynchronous event-driven messaging platform."
  - type: "container"
    name: "Azure Cosmos DB"
    technology: "Azure Cosmos DB"
    description: "Low-latency read-model caching database."
  - type: "container"
    name: "Audit Trail Storage"
    technology: "Azure Blob Storage / SQL"
    description: "Storage for consuming immutable business audit trail events."
  - type: "container"
    name: "Azure Key Vault"
    technology: "Azure Key Vault with Managed Identities"
    description: "Secret management service."
relationships:
  - source: "Customers"
    destination: "Web Portal (SPA)"
    description: "Interact via HTTPS"
    technology: "HTTPS (TLS 1.3)"
  - source: "Brokers"
    destination: "Web Portal (SPA)"
    description: "Interact via HTTPS"
    technology: "HTTPS (TLS 1.3)"
  - source: "Claims Adjusters"
    destination: "Adjuster Portal (SPA)"
    description: "Interact via HTTPS"
    technology: "HTTPS (TLS 1.3)"
  - source: "Operations Managers"
    destination: "Dispute & Exception Dashboard"
    description: "Interact via HTTPS"
    technology: "HTTPS (TLS 1.3)"
  - source: "Web Portal (SPA)"
    destination: "Claims API (BFF)"
    description: "Communicate via REST"
    technology: "REST over HTTPS with OAuth 2.0 / OIDC (Azure AD)"
  - source: "Adjuster Portal (SPA)"
    destination: "Claims API (BFF)"
    description: "Communicate via REST"
    technology: "REST over HTTPS with OAuth 2.0 / OIDC (Azure AD)"
  - source: "Dispute & Exception Dashboard"
    destination: "Claims API (BFF)"
    description: "Communicate via REST"
    technology: "REST over HTTPS with OAuth 2.0 / OIDC (Azure AD)"
  - source: "Claims API (BFF)"
    destination: "Azure Cosmos DB"
    description: "Read-model caching"
    technology: "TCP/TLS"
  - source: "Claims API (BFF)"
    destination: "Feature Flag / Routing Service"
    description: "Fetches routing rules"
    technology: "HTTPS"
  - source: "Claims API (BFF)"
    destination: "Azure Service Bus"
    description: "Publishes messages"
    technology: "AMQP/HTTPS"
  - source: "Mainframe Adapter"
    destination: "Azure Service Bus"
    description: "Syncs data"
    technology: "AMQP/HTTPS"
  - source: "Mainframe Adapter"
    destination: "Legacy COBOL/DB2 Mainframe"
    description: "Communicates with on-premise legacy mainframe"
    technology: "Mutually authenticated TLS (mTLS) over Azure ExpressRoute/VPN"
  - source: "Claims API (BFF)"
    destination: "Audit Trail Storage"
    description: "Consumes immutable events"
    technology: "HTTPS / Internal Protocol"
  - source: "Mainframe Adapter"
    destination: "Audit Trail Storage"
    description: "Consumes immutable events"
    technology: "HTTPS / Internal Protocol"
  - source: "Claims API (BFF)"
    destination: "Azure Key Vault"
    description: "Retrieves secrets"
    technology: "Managed Identities"
  - source: "Mainframe Adapter"
    destination: "Azure Key Vault"
    description: "Retrieves secrets"
    technology: "Managed Identities"