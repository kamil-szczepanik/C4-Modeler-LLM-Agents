level: component
scope: "Component diagram for the Audit Trail Storage container"
parentContainer:
  name: "Audit Trail Storage"
elements:
  - type: "component"
    name: "Audit Trail Storage Container"
    technology: "Azure Blob Storage (Immutable WORM storage with 7+ year Time-Based Retention)"
    description: "Stores immutable audit logs to ensure non-repudiation, regulatory compliance, and prevent data loss or tampering during migration."
  - type: "component"
    name: "Event Ingestion Route"
    technology: "Azure Event Grid and Azure Service Bus"
    description: "Serverless ingestion pipeline (AMQP / Managed Azure Integration) that minimizes custom code for the team."
  - type: "component"
    name: "Security & Access Management"
    technology: "Azure Key Vault and Azure AD RBAC"
    description: "Provides encryption-at-rest using Customer-Managed Keys (CMK) and strict least-privilege access control with network isolation."
  - type: "component"
    name: "Compliance Officers and External Auditors"
    technology: "Human / External"
    description: "Perform auditing activities using read-only access."
relationships:
  - source: "Claims API and Mainframe Adapter"
    destination: "Event Ingestion Route"
    description: "Publishes business audit events [AMQP]"
  - source: "Event Ingestion Route"
    destination: "Audit Trail Storage Container"
    description: "Writes immutable audit logs [HTTPS / Blob REST API]"
  - source: "Compliance Officers and External Auditors"
    destination: "Audit Trail Storage Container"
    description: "Read-only access for auditing [Azure AD RBAC / HTTPS]"