level: component
scope: "Component diagram for the Azure Service Bus container"
parentContainer:
  name: "Azure Service Bus"
elements:
  - type: "component"
    name: "Claim Submission Topic"
    technology: "Azure Service Bus Topic (Premium Tier)"
    description: "Enterprise messaging topic that receives published claim events from the Claims API."
  - type: "component"
    name: "Mainframe Sync Queue"
    technology: "Azure Service Bus Queue (Premium Tier)"
    description: "Queues synchronization payloads forwarded from the claim submission topic for consumption by the mainframe adapter."
  - type: "component"
    name: "Audit Archive Subscription"
    technology: "Azure Service Bus Subscription"
    description: "Fans out event copies from the claim submission topic for archiving."
relationships:
  - source: "Claim Submission Topic"
    destination: "Mainframe Sync Queue"
    description: "Forwards messages via subscriptions [AMQP]"
  - source: "Claim Submission Topic"
    destination: "Audit Archive Subscription"
    description: "Fans out event copies [AMQP]"