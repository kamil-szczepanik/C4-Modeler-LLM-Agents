level: component
scope: "Component diagram for the Mainframe Adapter container"
parentContainer:
  name: "Mainframe Adapter"
elements:
  - type: "component"
    name: "API Routing and Middleware"
    technology: "Node.js, Express.js"
    description: "Implements routing, simulation modes, and circuit breaker resiliency patterns for incoming BFF requests."
  - type: "component"
    name: "Feature Flag Manager"
    technology: "Azure App Configuration"
    description: "Provides real-time feature toggling for instant claim type rollbacks during the transition."
  - type: "component"
    name: "Mainframe Integration Client"
    technology: "Node.js/TypeScript, mTLS, ExpressRoute"
    description: "Communicates with the on-premise legacy COBOL/DB2 mainframe securely via mutually authenticated TLS."
  - type: "component"
    name: "Event Publisher"
    technology: "Azure Service Bus, AMQP/HTTPS"
    description: "Offloads shadow traffic and asynchronous events to the Azure Service Bus."
  - type: "component"
    name: "Audit Logger"
    technology: "Azure Blob Storage, HTTPS"
    description: "Streams immutable audit logs for transactions and state changes."
  - type: "component"
    name: "Secrets Manager Client"
    technology: "Azure Key Vault, Managed Identities"
    description: "Retrieves secrets securely for authenticating with external and internal services."
relationships:
  - source: "API Routing and Middleware"
    destination: "Feature Flag Manager"
    description: "Checks real-time feature toggles for claim type routing [REST]"
  - source: "API Routing and Middleware"
    destination: "Mainframe Integration Client"
    description: "Forwards requests to legacy system [gRPC/REST via Azure AD JWT/OAuth2]"
  - source: "Mainframe Integration Client"
    destination: "Event Publisher"
    description: "Offloads shadow traffic and events [AMQP/HTTPS]"
  - source: "API Routing and Middleware"
    destination: "Secrets Manager Client"
    description: "Retrieves required secrets [Managed Identities]"
  - source: "API Routing and Middleware"
    destination: "Audit Logger"
    description: "Streams immutable audit logs [HTTPS]"