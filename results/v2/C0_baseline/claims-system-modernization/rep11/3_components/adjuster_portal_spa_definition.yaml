level: component
scope: "Component diagram for the Adjuster Portal (SPA) container"
parentContainer:
  name: "Adjuster Portal (SPA)"
elements:
  - type: "component"
    name: "Routing & Shell Component"
    technology: "React Router / TypeScript"
    description: "Component managing OIDC navigation and Azure AD SSO."
  - type: "component"
    name: "Feature Toggle Context"
    technology: "React Context / TypeScript"
    description: "Dynamic module consuming routing and feature metadata from the BFF."
  - type: "component"
    name: "Claims Management Module"
    technology: "React Query / Zustand"
    description: "Reactive forms handling optimistic UI updates and local caching."
  - type: "component"
    name: "API Client Layer"
    technology: "REST / JSON Module"
    description: "Communication module injecting correlation IDs for OAuth 2.0 / OIDC bearer tokens."
  - type: "component"
    name: "Error Boundary Component"
    technology: "React Error Boundary"
    description: "Global component capturing API timeouts and mainframe degradation events."
relationships:
  - source: "Routing & Shell Component"
    destination: "Feature Toggle Context"
    description: "Consumes routing and feature metadata"
  - source: "Claims Management Module"
    destination: "API Client Layer"
    description: "Sends API requests"
  - source: "Error Boundary Component"
    destination: "Claims Management Module"
    description: "Monitors and catches runtime errors"