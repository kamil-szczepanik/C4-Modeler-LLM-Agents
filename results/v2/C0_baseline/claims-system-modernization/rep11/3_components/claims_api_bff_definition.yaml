level: component
scope: "Component diagram for the Claims API (BFF) container"
parentContainer:
  name: "Claims API (BFF)"
elements:
  - type: "component"
    name: "Routing Mediator"
    technology: "Node.js / TypeScript"
    description: "Routes requests between React portals and legacy mainframe systems."
  - type: "component"
    name: "Aggregator / ViewModel Builder"
    technology: "Node.js / TypeScript"
    description: "Aggregates data and builds view models for frontend portals."
  - type: "component"
    name: "Authentication Middleware"
    technology: "OIDC / Azure AD"
    description: "Handles secure authentication and validation against Azure AD."
  - type: "component"
    name: "Session & Token Manager"
    technology: "HTTPS / HttpOnly Cookies"
    description: "Manages user sessions and secure tokens using HttpOnly cookies."
  - type: "component"
    name: "Payload Schema Validator"
    technology: "Zod"
    description: "Performs strict inbound payload sanitization and schema validation."
  - type: "component"
    name: "Outbound Resilience Policy Engine"
    technology: "Opossum"
    description: "Applies circuit breaker patterns and resilience policies for outbound mainframe requests."
  - type: "component"
    name: "Fallback & Graceful Degradation Handler"
    technology: "Node.js / TypeScript"
    description: "Handles fallbacks and graceful degradation utilizing Cosmos DB cache."
  - type: "component"
    name: "Lifecycle & Health Management Component"
    technology: "Node.js / TypeScript"
    description: "Manages container lifecycle and health checks within Azure Kubernetes Service."
  - type: "component"
    name: "Azure Application Insights"
    technology: "Azure Application Insights"
    description: "Provides native telemetry and distributed tracing monitoring."
  - type: "component"
    name: "Web / Adjuster Portals"
    technology: "React SPA"
    description: "External modern portals interacting with the Claims API."
  - type: "component"
    name: "Azure Cosmos DB"
    technology: "Azure Cosmos DB"
    description: "Database used for caching and data storage via TCP/TLS."
relationships:
  - source: "Web / Adjuster Portals"
    destination: "Session & Token Manager"
    description: "Sends requests using HTTPS / HttpOnly Cookies"
  - source: "Session & Token Manager"
    destination: "Authentication Middleware"
    description: "Validates sessions using OIDC / Azure AD"
  - source: "Routing Mediator"
    destination: "Outbound Resilience Policy Engine"
    description: "Invokes outbound calls over Internal API / HTTPS"
  - source: "Aggregator / ViewModel Builder"
    destination: "Fallback & Graceful Degradation Handler"
    description: "Retrieves cached data via TCP/TLS"
  - source: "Claims API (BFF)"
    destination: "Azure Cosmos DB"
    description: "Persists and retrieves data via TCP/TLS"