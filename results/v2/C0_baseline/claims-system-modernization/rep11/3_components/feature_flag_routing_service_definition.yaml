level: component
scope: "Component diagram for the Feature Flag / Routing Service container"
parentContainer:
  name: "Feature Flag / Routing Service"
elements:
  - type: "component"
    name: "Routing Evaluation Engine"
    technology: "Azure App Configuration / Node.js"
    description: "Fetches dynamic claim-type routing rules and feature flags with atomic snapshot swaps for instant rollbacks."
  - type: "component"
    name: "Configuration Management UI"
    technology: "Node.js / TypeScript"
    description: "Allows Business Operations Managers to manage routing rules and view telemetry."
  - type: "component"
    name: "Metrics Aggregator"
    technology: "Azure Monitor / Node.js"
    description: "Collects and aggregates system metrics and telemetry data."
  - type: "component"
    name: "Circuit Breaker"
    technology: "Node.js"
    description: "Monitors downstream health and handles fallback mechanisms to the legacy mainframe system."
relationships:
  - source: "Configuration Management UI"
    destination: "Routing Evaluation Engine"
    description: "Updates routing rules and configurations [HTTPS]"
  - source: "Routing Evaluation Engine"
    destination: "Circuit Breaker"
    description: "Evaluates request routing and checks service health"
  - source: "Metrics Aggregator"
    destination: "Configuration Management UI"
    description: "Provides telemetry data [HTTPS]"