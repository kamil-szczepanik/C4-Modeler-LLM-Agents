level: component
scope: "Component diagram for the Azure Key Vault container"
parentContainer:
  name: "Azure Key Vault"
elements:
  - type: "component"
    name: "Secrets Engine"
    technology: "Azure Key Vault Secret Management"
    description: "Stores connection strings and API keys for the Claims API and Mainframe Adapter."
  - type: "component"
    name: "Certificates Engine"
    technology: "Azure Key Vault Certificate Management"
    description: "Manages TLS/SSL certificates for secure ingress."
  - type: "component"
    name: "Access Policy & RBAC Enforcer"
    technology: "Azure RBAC & Managed Identities"
    description: "Restricts access using Azure RBAC and Managed Identities with the principle of least privilege."
  - type: "component"
    name: "Private Endpoint Connector"
    technology: "Azure Private Link"
    description: "Isolates network traffic within the AKS Virtual Network."
  - type: "component"
    name: "Diagnostic Log Forwarder"
    technology: "Azure Monitor / Log Analytics"
    description: "Streams audit events and telemetry to Azure Monitor / Log Analytics."
relationships:
  - source: "Claims API"
    destination: "Secrets Engine"
    description: "Reads database secrets via [HTTPS via Private Endpoint / TLS 1.3]"
  - source: "Mainframe Adapter"
    destination: "Secrets Engine"
    description: "Reads integration credentials via [HTTPS via Private Endpoint / TLS 1.3]"
  - source: "Azure Key Vault"
    destination: "Log Analytics"
    description: "Emits audit and access logs via [Internal Azure Diagnostics]"