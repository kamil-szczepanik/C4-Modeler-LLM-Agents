# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Web Portal (SPA) container"
parentContainer:
  name: "Web Portal (SPA)"
elements:
  - type: "component"
    name: "Dynamic Form Renderer"
    technology: "React / TypeScript"
    description: "Renders dynamic claims forms and user interfaces for customers and brokers."
  - type: "component"
    name: "Authentication Client"
    technology: "React / TypeScript / OIDC"
    description: "Manages user authentication sessions and integrates with Azure AD."
  - type: "component"
    name: "API Client"
    technology: "Axios / Fetch API"
    description: "Communicates securely with the Claims API (BFF) over REST and HTTPS."
relationships:
  - source: "Dynamic Form Renderer"
    destination: "API Client"
    description: "Sends user input and claims data"
  - source: "Authentication Client"
    destination: "API Client"
    description: "Attaches OAuth 2.0 / OIDC tokens"