level: component
scope: "Component diagram for the Case Management Backend container"
parentContainer:
  name: "Case Management Backend"
elements:
  - type: "component"
    name: "Case API Controller"
    technology: "AWS ECS Fargate, Node.js/Express/Fastify"
    description: "Provides high-performance REST/GraphQL APIs for processing fraud review workflows."
  - type: "component"
    name: "Workflow Engine Component"
    technology: "Node.js/TypeScript"
    description: "Executes state transitions and manages the core fraud review workflow logic."
  - type: "component"
    name: "Batch Processing Worker Component"
    technology: "AWS ECS Fargate"
    description: "Handles asynchronous bulk processing and decisioning without causing gateway timeouts."
  - type: "component"
    name: "Notification & Telemetry Component"
    technology: "Node.js/TypeScript"
    description: "Pushes job status updates via WebSockets and handles system telemetry."
  - type: "component"
    name: "Audit Dispatcher Component"
    technology: "Node.js/TypeScript"
    description: "Streams immutable audit events to maintain strict PCI-DSS compliance and auditability."
  - type: "component"
    name: "PostgreSQL Database"
    technology: "AWS RDS with AWS KMS encryption"
    description: "Relational storage for transactional case states, protected via AWS KMS and AWS Secrets Manager."
  - type: "component"
    name: "Asynchronous Job Queue"
    technology: "Amazon SQS / Redis on Amazon ElastiCache with DLQ"
    description: "Enqueues bulk requests and manages asynchronous job queuing."
relationships:
  - source: "Analyst & Rules Portal"
    destination: "Case API Controller"
    description: "Submits REST/GraphQL requests [HTTPS/REST/GraphQL]"
  - source: "Case API Controller"
    destination: "Asynchronous Job Queue"
    description: "Enqueues bulk requests [AWS SQS / Redis protocol]"
  - source: "Batch Processing Worker Component"
    destination: "Workflow Engine Component"
    description: "Executes state transitions [In-process function calls]"
  - source: "Workflow Engine Component"
    destination: "PostgreSQL Database"
    description: "Persists case state [PostgreSQL wire protocol over TLS 1.3]"
  - source: "Audit Dispatcher Component"
    destination: "Audit & Event Stream"
    description: "Streams immutable audit events [Amazon EventBridge]"
  - source: "Notification & Telemetry Component"
    destination: "Analyst & Rules Portal"
    description: "Pushes job status updates [WebSockets]"