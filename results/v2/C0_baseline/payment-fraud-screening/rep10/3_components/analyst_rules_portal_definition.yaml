level: component
scope: "Component diagram for the Analyst & Rules Portal container"
parentContainer:
  name: "Analyst & Rules Portal"
elements:
  - type: "component"
    name: "SPA Frontend Core"
    technology: "React, TypeScript, AWS S3, CloudFront"
    description: "Lightweight SPA framework providing a secure React-based interface for analysts and risk managers."
  - type: "component"
    name: "Case Review UI Module"
    technology: "React"
    description: "Module for analysts and risk managers to review suspicious payment cases."
  - type: "component"
    name: "Rule Authoring & Simulation Module"
    technology: "React, AWS SDK"
    description: "Module for configuring fraud rules and triggering simulations."
  - type: "component"
    name: "Simulation Results Visualizer"
    technology: "Recharts, Chart.js"
    description: "Minimal bundle-size charting library for rendering simulation impact metrics."
  - type: "component"
    name: "AWS WAF & Amazon SQS"
    technology: "AWS WAF, Amazon SQS"
    description: "Edge security protecting authentication endpoints and asynchronous queue to decouple heavy rule-backtesting jobs."
  - type: "component"
    name: "Identity Provider"
    technology: "AWS Cognito, Okta"
    description: "Handles authentication and identity management using OIDC/OAuth2."
relationships:
  - source: "Manual Analyst"
    destination: "SPA Frontend Core"
    description: "Accesses via HTTPS [OIDC/OAuth2]"
  - source: "Merchant Risk Manager"
    destination: "SPA Frontend Core"
    description: "Accesses via HTTPS [OIDC/OAuth2]"
  - source: "Rule Authoring & Simulation Module"
    destination: "Amazon SQS"
    description: "Sends simulation jobs via JSON [AWS SDK]"
  - source: "SPA Frontend Core"
    destination: "Case Management Backend"
    description: "Communicates via REST/HTTPS"
  - source: "SPA Frontend Core"
    destination: "Identity Provider"
    description: "Authenticates via OIDC/OAuth2 [PKCE flow]"