level: component
scope: "Component diagram for the Real-Time Scoring Engine container"
parentContainer:
  name: "Real-Time Scoring Engine"
elements:
  - type: "component"
    name: "Rule Evaluation Component"
    technology: "Go + expr-lang/expr"
    description: "Lightweight evaluation engine for fast in-memory fraud rule execution."
  - type: "component"
    name: "ML Inference Component"
    technology: "ONNX Runtime C++ bindings wrapped in Go"
    description: "Optimized machine learning inference engine for fast model execution."
  - type: "component"
    name: "Decision Orchestrator Component"
    technology: "Go"
    description: "Orchestrates rule evaluation and ML inference to produce the final payment screening decision."
  - type: "component"
    name: "Rule Compiler & Validator Component"
    technology: "Go"
    description: "Validates and compiles rules before hot-reloading."
relationships:
  - source: "Decision Orchestrator Component"
    destination: "Rule Evaluation Component"
    description: "Evaluates transaction payloads against fraud rules"
  - source: "Decision Orchestrator Component"
    destination: "ML Inference Component"
    description: "Invokes model inference for risk scoring"
  - source: "Rule Compiler & Validator Component"
    destination: "Rule Evaluation Component"
    description: "Provides compiled and validated rules"