level: component
scope: "Component diagram for the Audit & Event Stream container"
parentContainer:
  name: "Audit & Event Stream"
elements:
  - type: "component"
    name: "Event Ingestion Router"
    technology: "Amazon EventBridge"
    description: "Component routing schema-validated events with Dead Letter Queues to minimize operational overhead."
  - type: "component"
    name: "Buffer & Batcher"
    technology: "Amazon Kinesis Data Firehose"
    description: "Component aggregating and compressing high-throughput events into Parquet batches."
relationships:
  - source: "Event Ingestion Router"
    destination: "Buffer & Batcher"
    description: "Forwards filtered events via Kinesis Firehose direct integration over HTTPS."