level: container
scope: "Container diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
elements:
  - type: "person"
    name: "Manual Analyst"
    description: "Reviews flagged payment cases and handles manual fraud investigations."
  - type: "person"
    name: "Merchant Risk Manager"
    description: "Configures rules, thresholds, and risk parameters."
  - type: "person"
    name: "Compliance / Auditor Officer"
    description: "Ensures adherence to PCI-DSS Level 1 and accesses audit logs."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer Systems"
    description: "Sends payment authorization requests to be evaluated for fraud."
  - type: "externalSystem"
    name: "Third-Party Fraud Intelligence Feeds"
    description: "Provides external fraud intelligence data used by the scoring engine."
  - type: "externalSystem"
    name: "Case Management SaaS"
    description: "Manages manual review workflows and cases for analysts."
  - type: "externalSystem"
    name: "Identity Provider (AWS Cognito / Okta)"
    description: "Handles user authentication and identity management."
  - type: "externalSystem"
    name: "Decision Audit Store (AWS S3 Object Lock & AWS KMS)"
    description: "Provides tamper-evident, write-once-read-many storage for audit logs."
  - type: "container"
    name: "API Gateway & Routing Layer"
    description: "Handles incoming routing and entry points for authorization traffic."
    technology: "AWS API Gateway / ALB"
  - type: "container"
    name: "Real-Time Scoring Engine"
    description: "Evaluates payment authorization requests against fraud models and rules to meet sub-50ms P99 latency SLA."
    technology: "AWS ECS Fargate, Go/Java, ONNX Runtime"
  - type: "container"
    name: "Analyst & Rules Portal"
    description: "Single-page application for manual analysts and risk managers to review cases and configure rules."
    technology: "AWS Amplify / S3 + CloudFront"
  - type: "container"
    name: "Case Management Backend"
    description: "Processes and manages fraud cases and analyst workflows."
    technology: "AWS ECS Fargate"
  - type: "container"
    name: "Audit & Event Stream"
    description: "Streams events and audit logs asynchronously for compliance and traceability."
    technology: "Amazon SQS / EventBridge + Kinesis Data Firehose"
relationships:
  - source: "Payment Gateway / Acquirer Systems"
    destination: "API Gateway & Routing Layer"
    description: "Sends payment authorization requests"
    technology: "HTTPS/JSON"
  - source: "API Gateway & Routing Layer"
    destination: "Real-Time Scoring Engine"
    description: "Routes authorization payloads for scoring"
    technology: "mTLS / HTTPS"
  - source: "Manual Analyst"
    destination: "Analyst & Rules Portal"
    description: "Accesses portal to review cases and manage rules"
    technology: "HTTPS"
  - source: "Merchant Risk Manager"
    destination: "Analyst & Rules Portal"
    description: "Configures rules and thresholds"
    technology: "HTTPS"
  - source: "Analyst & Rules Portal"
    destination: "Case Management Backend"
    description: "Interacts with case management backend APIs"
    technology: "REST/GraphQL"
  - source: "Real-Time Scoring Engine"
    destination: "Audit & Event Stream"
    description: "Streams scoring decisions and audit events"
    technology: "Amazon SQS / EventBridge"
  - source: "Case Management Backend"
    destination: "Audit & Event Stream"
    description: "Streams case workflow events"
    technology: "Amazon SQS / EventBridge"
  - source: "Audit & Event Stream"
    destination: "Decision Audit Store (AWS S3 Object Lock & AWS KMS)"
    description: "Persists immutable audit logs"
    technology: "Kinesis Data Firehose"
  - source: "Real-Time Scoring Engine"
    destination: "Third-Party Fraud Intelligence Feeds"
    description: "Queries external threat intelligence"
    technology: "AWS PrivateLink"
  - source: "Analyst & Rules Portal"
    destination: "Identity Provider (AWS Cognito / Okta)"
    description: "Authenticates users"
    technology: "OIDC / OAuth2"