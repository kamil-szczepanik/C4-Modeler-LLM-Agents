level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
  description: "Evaluates card-not-present payment authorizations for fraud at scale while enabling manual analyst reviews, ensuring low-latency decisions, strict PCI-DSS compliance, and tamper-evident auditing."
elements:
  - type: "person"
    name: "Manual Analyst"
    description: "Reviews flagged payment cases and handles manual fraud investigations."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer Systems"
    description: "Sends payment authorization requests to be evaluated for fraud."
  - type: "externalSystem"
    name: "Third-Party Fraud Intelligence Feeds"
    description: "Provides external fraud intelligence data used by the scoring engine."
  - type: "externalSystem"
    name: "Case Management SaaS"
    description: "Manages manual review workflows and cases for analysts."
  - type: "externalSystem"
    name: "Identity Provider (AWS Cognito / Okta)"
    description: "Handles user authentication and identity management."
  - type: "externalSystem"
    name: "Decision Audit Store (AWS S3 Object Lock & AWS KMS)"
    description: "Provides tamper-evident, write-once-read-many storage for audit logs."
relationships:
  - source: "Payment Gateway / Acquirer Systems"
    destination: "Real-Time Payment Fraud Screening"
    description: "Sends payment authorizations for real-time fraud evaluation"
    technology: "gRPC/HTTPS"
  - source: "Real-Time Payment Fraud Screening"
    destination: "Third-Party Fraud Intelligence Feeds"
    description: "Queries external threat intelligence"
    technology: "HTTPS"
  - source: "Real-Time Payment Fraud Screening"
    destination: "Case Management SaaS"
    description: "Sends fraud cases for manual review"
    technology: "secure REST APIs/Webhooks"
  - source: "Real-Time Payment Fraud Screening"
    destination: "Decision Audit Store (AWS S3 Object Lock & AWS KMS)"
    description: "Streams cryptographically signed decision logs asynchronously"
    technology: "AWS KMS signing / Asynchronous log streaming"
  - source: "Manual Analyst"
    destination: "Case Management SaaS"
    description: "Reviews and manages fraud cases"
    technology: "HTTPS"