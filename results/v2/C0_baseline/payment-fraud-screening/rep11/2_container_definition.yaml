level: container
scope: "Container diagram for Real-Time Payment Fraud Screening system"
system:
  name: "Real-Time Payment Fraud Screening system"
elements:
  - type: "person"
    name: "Fraud Analyst & Compliance Officer"
    description: "Internal users reviewing suspicious transactions and auditing historical decisions."
  - type: "person"
    name: "Merchant Operations Manager & End-Customer"
    description: "Secondary business stakeholders monitoring false positives and ensuring transaction privacy."
  - type: "externalSystem"
    name: "Merchant / Payment Gateway"
    description: "Sends payment authorizations for real-time fraud screening."
  - type: "container"
    name: "AWS API Gateway / Ingress"
    description: "Handles ingress traffic with mTLS via AWS ACM Private CA and circuit breaking."
    technology: "AWS API Gateway, AWS ACM Private CA"
  - type: "container"
    name: "Fraud Screening Engine"
    description: "Containerized stateless service performing high-throughput scoring."
    technology: "Go/Rust, Amazon ECS on EC2"
  - type: "container"
    name: "Case Management & Reporting Frontend"
    description: "Single-page application for fraud analysts to review cases and query compliance reports."
    technology: "Amazon React SPA, Amazon CloudFront, Amazon S3"
  - type: "container"
    name: "Case Management & Reporting Backend"
    description: "Backend service supporting case management workflows and compliance queries."
    technology: "Python FastAPI"
  - type: "container"
    name: "Audit & Compliance Worker"
    description: "Asynchronous worker processing events for tamper-evident logging."
    technology: "Python, Amazon SQS"
  - type: "container"
    name: "Amazon ElastiCache for Redis"
    description: "In-memory data store for low-latency feature queries."
    technology: "Redis, Amazon ElastiCache"
  - type: "container"
    name: "AWS S3 Object Lock"
    description: "Cryptographically signed audit log storage ensuring 7-year retention."
    technology: "AWS S3 Object Lock, AWS KMS"
  - type: "container"
    name: "Amazon Athena"
    description: "Serverless analytics for compliance queries and merchant reporting."
    technology: "Amazon Athena"
  - type: "container"
    name: "AWS Secrets Manager"
    description: "Manages dynamic credentials and secrets securely."
    technology: "AWS Secrets Manager"
  - type: "container"
    name: "Amazon ECR"
    description: "Container registry for storing service images."
    technology: "Amazon ECR"
relationships:
  - source: "Merchant / Payment Gateway"
    destination: "AWS API Gateway / Ingress"
    description: "Forwards authorization requests"
    technology: "HTTPS/REST"
  - source: "Fraud Analyst & Compliance Officer"
    destination: "Case Management & Reporting Frontend"
    description: "Reviews suspicious transactions and audits historical decisions"
    technology: "HTTPS"
  - source: "Case Management & Reporting Frontend"
    destination: "Case Management & Reporting Backend"
    description: "API calls for case management and reports"
    technology: "HTTPS/REST"
  - source: "AWS API Gateway / Ingress"
    destination: "Fraud Screening Engine"
    description: "Invokes real-time scoring"
    technology: "mTLS over private VPC subnets"
  - source: "Fraud Screening Engine"
    destination: "Amazon ElastiCache for Redis"
    description: "Queries cached features in-memory"
    technology: "Redis Protocol"
  - source: "Fraud Screening Engine"
    destination: "Amazon ElastiCache for Redis"
    description: "Reads/Writes cached features"
    technology: "Redis Protocol"
  - source: "Fraud Screening Engine"
    destination: "Amazon SQS"
    description: "Publishes decision events asynchronously"
    technology: "AWS SDK / SQS API"
  - source: "Amazon SQS"
    destination: "Audit & Compliance Worker"
    description: "Delivers decision payloads for tamper-evident logging"
    technology: "AWS SDK / SQS API"
  - source: "Audit & Compliance Worker"
    destination: "AWS S3 Object Lock"
    description: "Stores cryptographically signed audit logs"
    technology: "AWS SDK / S3 API with AWS KMS"
  - source: "Case Management & Reporting Backend"
    destination: "Amazon Athena"
    description: "Queries historical audit logs for compliance and reporting"
    technology: "AWS SDK / Athena API"