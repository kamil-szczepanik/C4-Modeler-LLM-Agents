level: context
scope: "System Context diagram for Real-Time Fraud Screening System"
system:
  name: "Real-Time Fraud Screening System"
  description: "A real-time card-not-present fraud screening system processing payment authorizations with sub-50ms latency, automated scoring, analyst case management, and tamper-evident 7-year audit logging."
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Analyst responsible for case management and reviewing flagged fraud transactions."
  - type: "person"
    name: "Risk / Compliance Officer"
    description: "Officer responsible for overseeing risk policies, compliance retention, and audit trails."
  - type: "externalSystem"
    name: "Merchant / Payment Gateway"
    description: "Sends payment authorizations for real-time fraud screening."
  - type: "externalSystem"
    name: "Tokenization Provider"
    description: "Provides secure token resolution via HTTPS API."
  - type: "externalSystem"
    name: "Audit Archive (AWS S3 Object Lock)"
    description: "Tamper-evident long-term storage enforcing 7-year compliance retention."
relationships:
  - source: "Merchant / Payment Gateway"
    destination: "Real-Time Fraud Screening System"
    description: "Sends payment authorizations for scoring"
    technology: "HTTPS / gRPC with mutual TLS (mTLS)"
  - source: "Fraud Analyst"
    destination: "Real-Time Fraud Screening System"
    description: "Performs case management"
    technology: "HTTPS with OIDC/MFA"
  - source: "Real-Time Fraud Screening System"
    destination: "Tokenization Provider"
    description: "Resolves secure tokens"
    technology: "HTTPS API"
  - source: "Real-Time Fraud Screening System"
    destination: "Audit Archive (AWS S3 Object Lock)"
    description: "Stores immutable decision trail"
    technology: "AWS SDK / S3 API"