level: component
scope: "Component diagram for the Fraud Screening Engine container"
parentContainer:
  name: "Fraud Screening Engine"
elements:
  - type: "component"
    name: "API Routing and Auth Handler"
    technology: "Go / Rust, AWS API Gateway Integration"
    description: "Handles incoming mTLS requests from API Gateway, authenticates payloads, and routes them to the scoring pipeline."
  - type: "component"
    name: "Feature Retrieval Component"
    technology: "Go / Rust, Amazon ElastiCache Client"
    description: "Queries and updates cached features from Redis to support sub-50ms P99 feature retrieval."
  - type: "component"
    name: "Scoring Engine Worker"
    technology: "Go / Rust, AWS Fargate"
    description: "Executes high-throughput, low-latency fraud evaluation rules and algorithms against transaction payloads."
  - type: "component"
    name: "Event Publisher"
    technology: "Go / Rust, AWS SDK for SQS"
    description: "Publishes decision and audit events asynchronously to Amazon SQS."
relationships:
  - source: "API Routing and Auth Handler"
    destination: "Scoring Engine Worker"
    description: "Passes validated transaction authorization payload"
  - source: "Scoring Engine Worker"
    destination: "Feature Retrieval Component"
    description: "Queries and updates cached features"
  - source: "Scoring Engine Worker"
    destination: "Event Publisher"
    description: "Sends final transaction decisions and audit events"