level: component
scope: "Component diagram for the Case Management & Reporting Backend container"
parentContainer:
  name: "Case Management & Reporting Backend"
elements:
  - type: "component"
    name: "Case API Controller"
    technology: "FastAPI Router"
    description: "Handles incoming HTTP requests for fraud analyst case reviews and compliance workflows."
  - type: "component"
    name: "Case Service & Business Logic Layer"
    technology: "Python"
    description: "Implements business logic for case management, coordinating data access and external API calls."
  - type: "component"
    name: "Case Repository"
    technology: "SQLAlchemy ORM"
    description: "Manages database interactions and operations for cases within PostgreSQL."
  - type: "component"
    name: "Compliance & Audit Service"
    technology: "Python"
    description: "Executes historical compliance queries and manages audit reporting requirements."
  - type: "component"
    name: "Tokenization Gateway Client"
    technology: "HTTPS/REST"
    description: "Retrieves masked card data securely from the tokenization gateway."
  - type: "component"
    name: "Amazon RDS PostgreSQL"
    technology: "Provisioned Instance"
    description: "Stores persistent case data with AWS KMS encryption."
  - type: "component"
    name: "Amazon ElastiCache for Redis"
    technology: "RESP Protocol"
    description: "Caches frequent report data to reduce query costs and latency."
  - type: "component"
    name: "Amazon Athena"
    technology: "AWS SDK / Athena API"
    description: "Runs asynchronous, batch-oriented compliance reports for 7-year audit data."
relationships:
  - source: "Case API Controller"
    destination: "Case Service & Business Logic Layer"
    description: "Internal function calls [Python]"
  - source: "Case Service & Business Logic Layer"
    destination: "Case Repository"
    description: "Database queries and updates [SQLAlchemy / PostgreSQL Protocol]"
  - source: "Case Service & Business Logic Layer"
    destination: "Tokenization Gateway Client"
    description: "Retrieves masked card data [HTTPS/REST]"
  - source: "Compliance & Audit Service"
    destination: "Amazon Athena"
    description: "Executes historical compliance queries [AWS SDK / Athena API]"
  - source: "Compliance & Audit Service"
    destination: "Amazon ElastiCache for Redis"
    description: "Caches frequent report data [RESP Protocol]"