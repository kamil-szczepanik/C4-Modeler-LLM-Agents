level: component
scope: "Component diagram for the Amazon Athena container"
parentContainer:
  name: "Amazon Athena"
elements:
  - type: "component"
    name: "Query Engine"
    technology: "Amazon Athena"
    description: "Executes serverless analytics queries for historical audit logs."
  - type: "component"
    name: "Data Catalog"
    technology: "AWS Glue Data Catalog"
    description: "Maintains metadata schemas for audit logs and compliance data."
  - type: "component"
    name: "Query Result Cache"
    technology: "S3 Query Result Cache"
    description: "Caches historical query results to optimize performance and reduce costs."
  - type: "component"
    name: "Saved Queries & Templates"
    technology: "Athena Saved Queries"
    description: "Stores predefined compliance and audit reporting templates."
relationships:
  - source: "Query Engine"
    destination: "Data Catalog"
    description: "Retrieves metadata schemas via [AWS SDK]"
  - source: "Query Engine"
    destination: "Query Result Cache"
    description: "Reads and writes cached results via [S3 API]"
  - source: "Query Engine"
    destination: "Saved Queries & Templates"
    description: "Executes predefined templates via [Athena API]"