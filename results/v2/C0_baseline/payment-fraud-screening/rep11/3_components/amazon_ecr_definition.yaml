level: component
scope: "Component diagram for the Amazon ECR container"
parentContainer:
  name: "Amazon ECR"
elements:
  - type: "component"
    name: "Registry Repository Store"
    technology: "AWS ECR, AES-256, AWS KMS"
    description: "AWS ECR repository storing Docker image layers encrypted with AES-256 via AWS KMS customer-managed keys."
  - type: "component"
    name: "Vulnerability Scanning Engine"
    technology: "Amazon Inspector"
    description: "Amazon Inspector integration scanning images upon push to enforce security gates."
  - type: "component"
    name: "Lifecycle & Immutability Manager"
    technology: "AWS ECR Lifecycle Policies"
    description: "Enforces image immutability tags and retention policies to prune old artifacts."
relationships:
  - source: "Registry Repository Store"
    destination: "Vulnerability Scanning Engine"
    description: "Triggers image vulnerability scanning upon push"
  - source: "Lifecycle & Immutability Manager"
    destination: "Registry Repository Store"
    description: "Enforces tag immutability and retention policies"