level: component
scope: "Component diagram for the Case Management App container"
parentContainer:
  name: "Case Management App"
elements:
  - type: "component"
    name: "API Controller Component"
    technology: "Express.js / Fastify, Node.js, TypeScript"
    description: "Routes authenticated API requests from Amazon API Gateway."
  - type: "component"
    name: "Case Service Component"
    technology: "Node.js, TypeScript"
    description: "Manages business logic and case management workflows."
  - type: "component"
    name: "Audit Client Component"
    technology: "AWS SDK, Node.js, TypeScript"
    description: "Emits cryptographically signed case resolution events to the immutable audit sink."
  - type: "component"
    name: "Data Repository Component"
    technology: "TypeORM / Prisma, Node.js, TypeScript"
    description: "Reads and writes relational case state."
  - type: "component"
    name: "Dashboard & Metrics Component"
    technology: "Node.js, TypeScript"
    description: "Provides operational metrics and dashboard capabilities for fraud analysts."
relationships:
  - source: "API Controller Component"
    destination: "Case Service Component"
    description: "Delegates requests [HTTP / JSON]"
  - source: "Case Service Component"
    destination: "Data Repository Component"
    description: "Reads and writes relational case state [TypeORM / Prisma]"
  - source: "Case Service Component"
    destination: "Audit Client Component"
    description: "Triggers audit events upon case resolution"
  - source: "Data Repository Component"
    destination: "Amazon Aurora PostgreSQL Serverless v2"
    description: "Persists case data [IAM DB Auth / TLS]"
  - source: "Audit Client Component"
    destination: "Immutable Audit Sink (Amazon S3 with Object Lock)"
    description: "Emits cryptographically signed case resolution events [AWS SDK / HTTPS]"
  - source: "API Controller Component"
    destination: "Identity Provider"
    description: "Validates OIDC/OAuth2 tokens and RBAC claims [HTTPS]"