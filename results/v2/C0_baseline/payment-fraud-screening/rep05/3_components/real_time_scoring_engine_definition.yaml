level: component
scope: "Component diagram for the Real-Time Scoring Engine container"
parentContainer:
  name: "Real-Time Scoring Engine"
elements:
  - type: "component"
    name: "HTTP Request Handler"
    technology: "Go (net/http)"
    description: "Receives authorization scoring requests via HTTPS/REST with mTLS from Amazon API Gateway."
  - type: "component"
    name: "Fraud Scoring Orchestrator"
    technology: "Go"
    description: "Evaluates transactions against real-time constraints, delivering sub-50ms P99 latency."
  - type: "component"
    name: "Model Inference Engine"
    technology: "ONNX Runtime"
    description: "Executes cryptographically signed models retrieved from the Model Registry."
relationships:
  - source: "HTTP Request Handler"
    destination: "Fraud Scoring Orchestrator"
    description: "Forwards incoming authorization requests for evaluation"
  - source: "Fraud Scoring Orchestrator"
    destination: "Model Inference Engine"
    description: "Invokes model scoring using loaded machine learning models"