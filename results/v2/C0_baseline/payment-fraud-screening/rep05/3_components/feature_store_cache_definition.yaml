level: component
scope: "Component diagram for the Feature Store & Cache container"
parentContainer:
  name: "Feature Store & Cache"
elements:
  - type: "component"
    name: "Feature Retrieval API / Client Layer"
    technology: "API Client Layer"
    description: "Provides sub-millisecond feature lookups for the Real-Time Payment Fraud Screening system."
  - type: "component"
    name: "In-Memory Cache & Store"
    technology: "Amazon ElastiCache Redis (Standard Tier)"
    description: "Maintains aggregated user and card behavioral data to ensure high-performance fraud scoring."
  - type: "component"
    name: "Feature Ingestion Worker"
    technology: "Worker Process"
    description: "Writes feature updates asynchronously to the cache."
  - type: "component"
    name: "Amazon ElastiCache Redis (Standard Tier)"
    technology: "Redis"
    description: "Chosen for sub-millisecond latency and high throughput."
  - type: "component"
    name: "Real-Time Scoring Engine"
    technology: "Application Engine"
    description: "Reads features via RESP over TCP."
  - type: "component"
    name: "AWS Secrets Manager"
    technology: "AWS SDK (HTTPS)"
    description: "Fetches authentication tokens securely."
relationships:
  - source: "Real-Time Scoring Engine"
    destination: "Feature Retrieval API / Client Layer"
    description: "Reads features via RESP over TCP (with TLS 1.3)"
  - source: "Feature Ingestion Worker"
    destination: "In-Memory Cache & Store"
    description: "Writes feature updates asynchronously via Redis commands over TLS"
  - source: "Feature Store & Cache"
    destination: "AWS Secrets Manager"
    description: "Fetches authentication tokens via AWS SDK (HTTPS)"