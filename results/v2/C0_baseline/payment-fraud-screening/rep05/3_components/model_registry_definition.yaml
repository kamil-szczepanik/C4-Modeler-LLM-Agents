level: component
scope: "Component diagram for the Model Registry container"
parentContainer:
  name: "Model Registry"
elements:
  - type: "component"
    name: "Model Governance API"
    technology: "HTTPS REST API"
    description: "Handles model registration requests and triggers state transition events."
  - type: "component"
    name: "Amazon SageMaker Model Registry"
    technology: "AWS Managed Service"
    description: "Manages model lifecycle and versioning under IAM/ABAC governance."
  - type: "component"
    name: "Artifact Cryptographic Signer"
    technology: "AWS Lambda & AWS KMS"
    description: "Automates cryptographic signing of model artifacts stored in Amazon S3."
  - type: "component"
    name: "Model Event Dispatcher"
    technology: "Amazon SNS & Amazon EventBridge"
    description: "Pub/sub messaging for distributing model updates with zero downtime."
  - type: "component"
    name: "Object Lock Storage"
    technology: "Amazon S3 with Object Lock"
    description: "Enforces secure, 7-year tamper-evident retention for model artifacts."
relationships:
  - source: "Data Scientist"
    destination: "Model Governance API"
    description: "Registers models via HTTPS"
  - source: "Risk Officer"
    destination: "Amazon SageMaker Model Registry"
    description: "Approves models via IAM/ABAC"
  - source: "Model Governance API"
    destination: "Amazon EventBridge"
    description: "Triggers on state transition"
  - source: "Artifact Cryptographic Signer"
    destination: "Amazon S3 with Object Lock"
    description: "Uses AWS KMS to sign artifacts stored in S3"
  - source: "Model Event Dispatcher"
    destination: "Real-Time Scoring Engine"
    description: "Notifies via authenticated HTTPS"