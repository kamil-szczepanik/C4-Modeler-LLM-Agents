level: component
scope: "Component diagram for the Messaging & Audit Pipeline container"
parentContainer:
  name: "Messaging & Audit Pipeline"
elements:
  - type: "component"
    name: "Message Queue"
    technology: "Amazon SQS"
    description: "Buffers asynchronous events and logs generated by the Real-Time Scoring Engine."
  - type: "component"
    name: "Audit Logger"
    technology: "Amazon S3 with Object Lock"
    description: "Writes tamper-evident, 7-year audit logs in Compliance Mode."
relationships:
  - source: "Message Queue"
    destination: "Audit Logger"
    description: "Forwards asynchronous events and logs for persistent immutable storage"