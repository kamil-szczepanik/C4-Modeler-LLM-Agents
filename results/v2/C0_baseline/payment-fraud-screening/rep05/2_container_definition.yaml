level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analyst & Risk/Compliance Officer"
    description: "Reviews flagged suspicious transactions and ensures compliance with regulatory standards."
  - type: "externalSystem"
    name: "Payment Gateway / Merchants"
    description: "API Client that sends card-not-present payment authorization requests."
  - type: "externalSystem"
    name: "Immutable Audit Sink"
    description: "AWS S3 Object Lock storage for WORM compliance and secure record retention."
  - type: "externalSystem"
    name: "Amazon CloudWatch & Route 53"
    description: "Provides real-time health metrics, heartbeats, and circuit-breaker fallback mechanisms."
  - type: "container"
    name: "Real-Time Scoring Engine"
    technology: "Go on Amazon ECS Fargate"
    description: "Screens card-not-present payment authorizations for fraud before approval."
  - type: "container"
    name: "Case Management App"
    technology: "Node.js/TypeScript on Amazon ECS Fargate"
    description: "Provides case management for suspicious payment reviews."
  - type: "container"
    name: "Feature Store & Cache"
    technology: "Amazon ElastiCache Redis"
    description: "Provides sub-millisecond feature lookups."
  - type: "container"
    name: "Database"
    technology: "Amazon Aurora PostgreSQL Serverless v2"
    description: "Stores relational case and transaction data."
  - type: "container"
    name: "Messaging & Audit Pipeline"
    technology: "Amazon SQS/SNS and Amazon S3 with Object Lock"
    description: "Handles decoupled asynchronous processing and tamper-evident compliance audit logs."
  - type: "container"
    name: "Model Registry"
    technology: "Amazon SageMaker Model Registry"
    description: "Stores and manages fraud detection models."
  - type: "container"
    name: "Network & Security"
    technology: "AWS WAF, Amazon API Gateway, AWS Secrets Manager, AWS KMS"
    description: "Handles mTLS, routing, credential rotation, and encryption."
relationships:
  - source: "Payment Gateway / Merchants"
    destination: "Real-Time Scoring Engine"
    description: "Invokes authorization scoring requests via HTTPS/REST with mTLS"
    technology: "Amazon API Gateway / HTTPS"
  - source: "Real-Time Scoring Engine"
    destination: "Feature Store & Cache"
    description: "Reads features for scoring"
    technology: "Amazon ElastiCache Redis"
  - source: "Real-Time Scoring Engine"
    destination: "Messaging & Audit Pipeline"
    description: "Publishes asynchronous events and compliance audit logs"
    technology: "Amazon SQS/SNS"
  - source: "Messaging & Audit Pipeline"
    destination: "Immutable Audit Sink"
    description: "Writes compliance audit logs to WORM storage"
    technology: "Amazon S3 with Object Lock and AWS KMS"
  - source: "Fraud Analyst & Risk/Compliance Officer"
    destination: "Case Management App"
    description: "Accesses case management for suspicious payment reviews"
    technology: "Amazon API Gateway / HTTPS"
  - source: "Case Management App"
    destination: "Database"
    description: "Reads and writes relational case data"
    technology: "Amazon Aurora PostgreSQL Serverless v2"
  - source: "Real-Time Scoring Engine"
    destination: "Amazon CloudWatch & Route 53"
    description: "Provides circuit-breaker fallback mechanisms and health checks"
    technology: "Route 53 / API Gateway"