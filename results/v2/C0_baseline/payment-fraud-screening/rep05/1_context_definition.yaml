level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Evaluates card-not-present payment authorizations to approve, decline, or flag suspicious transactions while managing analyst reviews."
elements:
  - type: "person"
    name: "Fraud Analyst & Risk/Compliance Officer"
    description: "Reviews flagged suspicious transactions and ensures compliance with regulatory standards."
  - type: "externalSystem"
    name: "Payment Gateway / Merchants"
    description: "API Client that sends card-not-present payment authorization requests."
  - type: "externalSystem"
    name: "Card Tokenization Vault"
    description: "External service interfaced for tokenized data validation."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "AWS IAM / Cognito service handling authentication and Role-Based Access Control."
  - type: "externalSystem"
    name: "Immutable Audit Sink"
    description: "AWS S3 Object Lock storage for WORM compliance and secure record retention."
  - type: "externalSystem"
    name: "Amazon CloudWatch & Route 53"
    description: "Provides real-time health metrics, heartbeats, and boundary monitoring."
relationships:
  - source: "Payment Gateway / Merchants"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Sends authorization requests"
    technology: "gRPC and HTTPS using TLS 1.3 with mTLS"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Card Tokenization Vault"
    description: "Validates tokenized data"
    technology: "outbound HTTPS APIs"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Immutable Audit Sink"
    description: "Ingests decision inputs, model versions, and explanations into WORM storage"
    technology: "AWS KMS CMK encryption"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Amazon CloudWatch & Route 53"
    description: "Emits real-time health metrics and heartbeats for boundary monitoring"
    technology: "AWS telemetry"
  - source: "Fraud Analyst & Risk/Compliance Officer"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Manages analyst reviews and compliance"
    technology: "AWS IAM / Cognito"