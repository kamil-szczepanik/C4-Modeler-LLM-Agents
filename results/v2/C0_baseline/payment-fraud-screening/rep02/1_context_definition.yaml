level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Fraud Screening System"
  description: "Screens card-not-present payment authorizations in AWS eu-west-1 for PCI-DSS Level 1 compliance, delivering sub-50ms fraud decisions and a case management UI for fraud analysts."
elements:
  - type: "person"
    name: "Fraud Analysts and Risk Operations Managers"
    description: "Users who interact with the case management UI and provide feedback loops for fraud screening."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "External system that sends payment authorization requests for fraud screening."
  - type: "externalSystem"
    name: "Card Schemes / Tokenization Service"
    description: "External system providing tokenized card data."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External system handling OAuth2 / OIDC authentication for strict RBAC and MFA."
  - type: "externalSystem"
    name: "Audit / Compliance Archive"
    description: "External system providing tamper-evident logs and cryptographic storage for compliance."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "Real-Time Fraud Screening System"
    description: "Authorization screening requests"
    technology: "gRPC/HTTPS"
  - source: "Real-Time Fraud Screening System"
    destination: "Card Schemes / Tokenization Service"
    description: "Tokenized card data retrieval"
    technology: "HTTPS"
  - source: "Fraud Analysts and Risk Operations Managers"
    destination: "Real-Time Fraud Screening System"
    description: "Case management & feedback loop"
    technology: "HTTPS/OIDC"
  - source: "Real-Time Fraud Screening System"
    destination: "Audit / Compliance Archive"
    description: "Tamper-evident logs and 7-year retention"
    technology: "AWS KMS / S3 Object Lock"