level: component
scope: "Component diagram for the Case Management & Rule UI container"
parentContainer:
  name: "Case Management & Rule UI"
elements:
  - type: "component"
    name: "API Router / BFF"
    technology: "Node.js, Express, tRPC"
    description: "Handles user authentication via OIDC and routes requests for analyst reviews and rule management."
  - type: "component"
    name: "Case Management Service Component"
    technology: "Node.js with TypeScript"
    description: "Manages active case states and interacts with data storage."
  - type: "component"
    name: "Rule Authoring & Validation Engine"
    technology: "Node.js with TypeScript"
    description: "Enables risk managers to update and validate fraud rules without downtime."
  - type: "component"
    name: "Audit Dispatcher Component"
    technology: "Node.js with TypeScript"
    description: "Dispatches sanitized audit events for compliance tracking."
  - type: "component"
    name: "Serverless Sandbox & Audit Lambda Functions"
    technology: "AWS Lambda"
    description: "Executes rule sandboxing and asynchronous audit log persistence."
relationships:
  - source: "API Router / BFF"
    destination: "Case Management Service Component"
    description: "Invokes case operations [HTTPS / tRPC]"
  - source: "API Router / BFF"
    destination: "Rule Authoring & Validation Engine"
    description: "Invokes rule authoring and validation [HTTPS / tRPC]"
  - source: "Case Management Service Component"
    destination: "Amazon DynamoDB"
    description: "Reads and writes active case states [AWS SDK / TCP]"
  - source: "Rule Authoring & Validation Engine"
    destination: "Amazon SQS"
    description: "Publishes validated rules [AWS SDK]"
  - source: "Audit Dispatcher Component"
    destination: "Amazon SQS"
    description: "Forwards sanitized audit events [AWS SDK]"
  - source: "Amazon SQS"
    destination: "Serverless Sandbox & Audit Lambda Functions"
    description: "Asynchronous log processing [AWS Lambda Event Source]"
  - source: "Serverless Sandbox & Audit Lambda Functions"
    destination: "Amazon S3 with Object Lock"
    description: "Writes immutable audit logs [HTTPS]"