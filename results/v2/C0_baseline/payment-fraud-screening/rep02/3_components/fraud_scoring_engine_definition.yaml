  - type: "component"
    name: "Decision Explanation Assembler Component"
    technology: "Java"
    description: "Merges rule triggers and feature importance vectors."
  - type: "component"
    name: "Audit Payload Assembler Component"
    technology: "Java with AWS SDK & AWS KMS"
    description: "Appends cryptographic HMAC via AWS KMS and emits audit payloads."
