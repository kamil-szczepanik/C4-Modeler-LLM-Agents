level: component
scope: "Component diagram for the Fraud Scoring Engine container"
parentContainer:
  name: "Fraud Scoring Engine"
elements:
  - type: "component"
    name: "Decision Orchestrator Component"
    technology: "Spring Bean"
    description: "Coordinating the request lifecycle."
  - type: "component"
    name: "Feature Aggregator Component"
    technology: "Java with Caffeine Cache"
