level: container
scope: "Container diagram for Real-Time Fraud Screening System"
system:
  name: "Real-Time Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analysts and Risk Operations Managers"
    description: "Users who interact with the case management UI and provide feedback loops for fraud screening."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "External system that sends payment authorization requests for fraud screening."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External system handling user authentication."
  - type: "externalSystem"
    name: "Audit / Compliance Archive"
    description: "Long-term tamper-evident storage destination."
  - type: "container"
    name: "API Gateway & Tokenization Proxy"
    technology: "Java / Spring Cloud Gateway"
    description: "Container performing TLS termination, circuit breaking, and PAN tokenization."
  - type: "container"
    name: "Fraud Scoring Engine"
    technology: "Java / Spring Boot"
    description: "Container executing in-memory fraud evaluation via gRPC."
  - type: "container"
    name: "Case Management & Rule UI"
    technology: "Node.js / TypeScript"
    description: "Container handling analyst reviews and self-service rule management."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "AWS DynamoDB"
    description: "Data store for rule metadata and active case states."
  - type: "container"
    name: "Amazon S3 with Object Lock"
    technology: "Amazon S3"
    description: "Storage container with AWS IAM SCPs for 7-year tamper-evident audit logs and rule distribution."
  - type: "container"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Asynchronous message broker for audit logging and rule update notifications."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "API Gateway & Tokenization Proxy"
    description: "Authorization requests"
    technology: "HTTPS/TLS 1.3"
  - source: "Identity Provider"
    destination: "Case Management & Rule UI"
    description: "User authentication"
    technology: "HTTPS"
  - source: "Fraud Analysts and Risk Operations Managers"
    destination: "Case Management & Rule UI"
    description: "Analyst reviews and rule management"
    technology: "HTTPS/REST"
  - source: "API Gateway & Tokenization Proxy"
    destination: "Fraud Scoring Engine"
    description: "Fraud evaluation requests"
    technology: "gRPC over internal VPC security groups with mTLS"
  - source: "API Gateway & Tokenization Proxy"
    destination: "Case Management & Rule UI"
    description: "Routing requests"
    technology: "HTTPS/REST"
  - source: "Fraud Scoring Engine"
    destination: "Amazon DynamoDB"
    description: "Reads and writes rule metadata and active cases"
    technology: "AWS SDK"
  - source: "Case Management & Rule UI"
    destination: "Amazon DynamoDB"
    description: "Reads and writes active case states"
    technology: "AWS SDK"
  - source: "Fraud Scoring Engine"
    destination: "Amazon S3 with Object Lock"
    description: "Rule distribution and audit logs"
    technology: "HTTPS"
  - source: "Case Management & Rule UI"
    destination: "Amazon S3 with Object Lock"
    description: "Audit logs storage"
    technology: "HTTPS"
  - source: "Case Management & Rule UI"
    destination: "Amazon SQS"
    description: "Asynchronous messaging for audit logging and rule updates"
    technology: "AWS SDK"
  - source: "Fraud Scoring Engine"
    destination: "Audit / Compliance Archive"
    description: "Sends audit logs for long-term retention"
    technology: "HTTPS"