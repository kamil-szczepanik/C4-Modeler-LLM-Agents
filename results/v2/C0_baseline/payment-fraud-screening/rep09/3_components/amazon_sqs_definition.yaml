level: component
scope: "Component diagram for the Amazon SQS container"
parentContainer:
  name: "Amazon SQS"
elements:
  - type: "component"
    name: "fraud-audit-events-queue"
    technology: "Amazon SQS Standard Queue"
    description: "Decouples scoring from audit logging to protect P99 latency and buffer audit events."
  - type: "component"
    name: "fraud-audit-events-dlq"
    technology: "Amazon SQS Dead Letter Queue"
    description: "Captures and stores undeliverable or failed audit events for troubleshooting and compliance."
relationships:
  - source: "fraud-audit-events-queue"
    destination: "fraud-audit-events-dlq"
    description: "Routes permanently failed messages after max retries"