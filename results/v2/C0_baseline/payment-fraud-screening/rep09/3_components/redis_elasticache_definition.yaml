level: component
scope: "Component diagram for the Redis (ElastiCache) container"
parentContainer:
  name: "Redis (ElastiCache)"
elements:
  - type: "component"
    name: "Feature Cache"
    technology: "Redis Hash and String Data Structures"
    description: "Caches low-latency features and behavioral data using volatile-lru eviction policy."
  - type: "component"
    name: "Snapshot Exporter"
    technology: "AWS ElastiCache RDB Export"
    description: "Exports automated daily RDB snapshots to AWS S3."
relationships:
  - source: "Feature Cache"
    destination: "Snapshot Exporter"
    description: "Triggers automated daily backups"