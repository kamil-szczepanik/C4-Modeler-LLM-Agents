level: component
scope: "Component diagram for the Audit Log Worker container"
parentContainer:
  name: "Audit Log Worker"
elements:
  - type: "component"
    name: "SQS Message Consumer"
    technology: "Go, AWS SDK"
    description: "Polls Amazon SQS for asynchronous decision and audit events."
  - type: "component"
    name: "Log Canonicalizer and Hash Chainer"
    technology: "Go, AWS KMS"
    description: "Canonically formats audit logs and applies cryptographic SHA-256 hash chaining using AWS KMS for tamper-evident verification."
  - type: "component"
    name: "Database Persistence Worker"
    technology: "Go, PostgreSQL Wire Protocol"
    description: "Persists canonicalized, hash-chained logs into append-only partitioned tables in AWS Aurora PostgreSQL."
  - type: "component"
    name: "SIEM Exporter and Spooler"
    technology: "Go, HTTPS, Local Disk"
    description: "Batches audit logs, provides local disk spooling for reliability, and forwards logs to the SIEM / Compliance Archive."
relationships:
  - source: "SQS Message Consumer"
    destination: "Log Canonicalizer and Hash Chainer"
    description: "Passes raw asynchronous audit and decision events for processing [In-memory]"
  - source: "Log Canonicalizer and Hash Chainer"
    destination: "Database Persistence Worker"
    description: "Sends processed, hash-chained logs for database insertion [In-memory]"
  - source: "Database Persistence Worker"
    destination: "SIEM Exporter and Spooler"
    description: "Triggers batched export of audit logs [In-memory]"