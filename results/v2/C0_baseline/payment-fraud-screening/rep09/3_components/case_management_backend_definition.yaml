level: component
scope: "Component diagram for the Case Management Backend container"
parentContainer:
  name: "Case Management Backend"
elements:
  - type: "component"
    name: "Case Management API Controller"
    technology: "Spring MVC"
    description: "Handles incoming REST/JSON requests over HTTPS from the Web Application."
  - type: "component"
    name: "Workflow & Assignment Service"
    technology: "Spring Boot / Java"
    description: "Manages SLA-driven queues, case states, and core business logic."
  - type: "component"
    name: "Data Access Repository"
    technology: "Spring Data JPA"
    description: "Executes queries and persists case states to the database."
  - type: "component"
    name: "Audit Ledger Client"
    technology: "Spring Boot / Java"
    description: "Dispatches audit records for tamper-evident logging."
  - type: "component"
    name: "Metrics & Telemetry Interceptor"
    technology: "Micrometer/Prometheus"
    description: "Collects metrics and telemetry data for monitoring."
  - type: "component"
    name: "Web Application"
    technology: "Web Frontend"
    description: "Sends REST/JSON requests over HTTPS to the Case Management API Controller."
  - type: "component"
    name: "AWS Aurora PostgreSQL"
    technology: "Database"
    description: "Relational storage persisting case states with KMS encryption for PCI-DSS compliance."
  - type: "component"
    name: "Amazon SQS"
    technology: "Message Queue"
    description: "Receives cryptographically chained audit events published by the Audit Ledger Client."
relationships:
  - source: "Web Application"
    destination: "Case Management API Controller"
    description: "Sends REST/JSON requests over HTTPS"
  - source: "Case Management API Controller"
    destination: "Workflow & Assignment Service"
    description: "Invokes business logic [In-process]"
  - source: "Workflow & Assignment Service"
    destination: "Data Access Repository"
    description: "Executes queries [JPA/JDBC over TLS 1.3]"
  - source: "Data Access Repository"
    destination: "AWS Aurora PostgreSQL"
    description: "Persists case states [JDBC/TLS with AWS IAM Auth]"
  - source: "Workflow & Assignment Service"
    destination: "Audit Ledger Client"
    description: "Dispatches audit records [In-process]"
  - source: "Audit Ledger Client"
    destination: "Amazon SQS"
    description: "Publishes cryptographically chained audit events [AWS SDK over HTTPS]"