level: component
scope: "Component diagram for the AWS Aurora PostgreSQL container"
parentContainer:
  name: "AWS Aurora PostgreSQL"
elements:
  - type: "component"
    name: "Transaction & Case Repository"
    technology: "PostgreSQL relational tables"
    description: "Stores relational data for real-time transactions and high-performance case management."
  - type: "component"
    name: "Audit Ledger"
    technology: "Append-only WORM tables with pg_audit"
    description: "Provides tamper-evident audit logging and strict PCI-DSS Level 1 compliance."
  - type: "component"
    name: "Partition Manager"
    technology: "pg_partman extension"
    description: "Automates time-based partitioning and offloads historical audit partitions older than 90 days to Amazon S3."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer / Aurora Proxy"
    description: "Manages connection spikes and prevents connection exhaustion from ECS Fargate tasks."
  - type: "component"
    name: "Aurora Read Replica"
    technology: "Amazon Aurora PostgreSQL Read Replica"
    description: "Dedicated for case management and analytical queries to protect P99 scoring latency."
relationships:
  - source: "Real-Time Scoring Engine"
    destination: "Connection Pooler"
    description: "Persists decision metrics and audit logs [IAM-authenticated TLS 1.3]"
  - source: "Connection Pooler"
    destination: "Transaction & Case Repository"
    description: "Routes pooled database connections for transaction writes"
  - source: "Case Management Backend"
    destination: "Aurora Read Replica"
    description: "Queries active fraud cases and analyst workloads [SQL/JDBC over TLS 1.3]"
  - source: "Partition Manager"
    destination: "Amazon S3"
    description: "Offloads historical audit partitions older than 90 days [AWS KMS encrypted S3 API]"
  - source: "Audit Ledger"
    destination: "Amazon CloudWatch / SIEM"
    description: "Streams pgaudit activity logs [Encrypted CloudWatch Log Stream]"