level: component
scope: "Component diagram for the Real-Time Scoring Engine container"
parentContainer:
  name: "Real-Time Scoring Engine"
elements:
  - type: "component"
    name: "Scoring Orchestrator"
    technology: "Go"
    description: "Coordinates feature fetch, model execution, rule evaluation, and audit telemetry."
  - type: "component"
    name: "Feature Assembler"
    technology: "Go"
    description: "Retrieves features needed for transaction scoring."
  - type: "component"
    name: "Inference Executor"
    technology: "ONNX Runtime / CGO"
    description: "Executes the machine learning model for fraud scoring."
  - type: "component"
    name: "Model Hot-Loader"
    technology: "Go"
    description: "Dynamically loads and updates machine learning models without downtime."
  - type: "component"
    name: "Rule Evaluator"
    technology: "Go"
    description: "Evaluates business overrides and rules."
  - type: "component"
    name: "Audit Telemetry Emitter"
    technology: "Go"
    description: "Enqueues and publishes audit logs and telemetry events."
relationships:
  - source: "Scoring Orchestrator"
    destination: "Feature Assembler"
    description: "Coordinates feature fetch [In-memory Go function call]"
  - source: "Scoring Orchestrator"
    destination: "Inference Executor"
    description: "Executes model [In-memory CGO/ONNX]"
  - source: "Scoring Orchestrator"
    destination: "Rule Evaluator"
    description: "Evaluates overrides [In-memory]"
  - source: "Scoring Orchestrator"
    destination: "Audit Telemetry Emitter"
    description: "Enqueues audit log [Local channel / ring buffer]"