level: component
scope: "Component diagram for the API Gateway (Envoy) container"
parentContainer:
  name: "API Gateway (Envoy)"
elements:
  - type: "component"
    name: "mTLS Termination and Routing"
    technology: "Envoy C++"
    description: "Handles mTLS termination, local rate limiting, and circuit breaking for incoming traffic."
  - type: "component"
    name: "gRPC Proxy"
    technology: "Envoy HTTP/2"
    description: "Forwards scoring requests to the Real-Time Scoring Engine via gRPC/HTTP2."
  - type: "component"
    name: "HTTPS Proxy"
    technology: "Envoy HTTPS"
    description: "Routes administrative and analyst traffic to the Case Management Backend."
relationships:
  - source: "mTLS Termination and Routing"
    destination: "gRPC Proxy"
    description: "Forwards payment scoring requests"
  - source: "mTLS Termination and Routing"
    destination: "HTTPS Proxy"
    description: "Forwards analyst traffic"