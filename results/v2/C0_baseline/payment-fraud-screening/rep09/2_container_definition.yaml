level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Internal user who manages cases and reviews suspicious transactions."
  - type: "person"
    name: "Risk Officer"
    description: "Internal user who oversees risk management rules and policies."
  - type: "person"
    name: "Fraud Operations Manager"
    description: "Internal user who monitors fraud operations metrics and team workflows."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Upstream external system that submits payment authorization requests."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External authentication provider for user authentication and authorization."
  - type: "externalSystem"
    name: "SIEM / Compliance Archive"
    description: "External storage sink for compliance and audit logs."
  - type: "container"
    name: "API Gateway (Envoy)"
    technology: "Envoy"
    description: "Routes incoming requests and terminates mTLS from the Payment Gateway."
  - type: "container"
    name: "Real-Time Scoring Engine"
    technology: "Go, ONNX Runtime, AWS ECS Fargate"
    description: "Executes high-performance stateless fraud scoring on payment authorizations."
  - type: "container"
    name: "Case Management Backend"
    technology: "Node.js / Spring Boot"
    description: "Handles fraud cases, workflows, and analyst review operations."
  - type: "container"
    name: "Web Application"
    technology: "React SPA, AWS S3, CloudFront"
    description: "Provides the user interface for fraud analysts and operations managers."
  - type: "container"
    name: "Audit Log Worker"
    technology: "Go"
    description: "Processes audit logs asynchronously and writes them to immutable storage."
  - type: "container"
    name: "Redis (ElastiCache)"
    technology: "Redis, AWS ElastiCache"
    description: "Provides low-latency feature caching for real-time scoring."
  - type: "container"
    name: "AWS Aurora PostgreSQL"
    technology: "PostgreSQL, AWS Aurora"
    description: "Stores immutable 7-year tamper-evident audit and case records."
  - type: "container"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Queues audit log messages between the scoring engine and audit worker."
relationships:
  - source: "Payment Gateway"
    destination: "API Gateway (Envoy)"
    description: "Submits payment authorization requests"
    technology: "mTLS/HTTPS"
  - source: "API Gateway (Envoy)"
    destination: "Real-Time Scoring Engine"
    description: "Forwards scoring requests"
    technology: "gRPC/HTTP2"
  - source: "Real-Time Scoring Engine"
    destination: "Redis (ElastiCache)"
    description: "Retrieves cached features"
    technology: "TCP/RESP"
  - source: "Real-Time Scoring Engine"
    destination: "Amazon SQS"
    description: "Publishes audit events"
    technology: "AWS SDK / SQS API"
  - source: "Amazon SQS"
    destination: "Audit Log Worker"
    description: "Delivers audit events"
    technology: "SQS Polling"
  - source: "Audit Log Worker"
    destination: "AWS Aurora PostgreSQL"
    description: "Persists audit logs to immutable tables"
    technology: "IAM-authenticated TLS"
  - source: "Web Application"
    destination: "Case Management Backend"
    description: "Sends API requests for case workflows"
    technology: "REST/GraphQL over HTTPS"
  - source: "Case Management Backend"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OAuth 2.0 / OIDC"
  - source: "Fraud Analyst"
    destination: "Web Application"
    description: "Interacts with the fraud review UI"
    technology: "HTTPS"
  - source: "Risk Officer"
    destination: "Web Application"
    description: "Reviews risk rules and metrics"
    technology: "HTTPS"
  - source: "Fraud Operations Manager"
    destination: "Web Application"
    description: "Monitors operations and team activity"
    technology: "HTTPS"
  - source: "Audit Log Worker"
    destination: "SIEM / Compliance Archive"
    description: "Exports compliance archive logs"
    technology: "HTTPS / TLS"