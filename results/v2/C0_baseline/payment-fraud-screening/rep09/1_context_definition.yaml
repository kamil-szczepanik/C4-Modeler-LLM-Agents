level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Screens card-not-present payment authorizations for a mid-size payment processor and provides case management for suspicious payments."
elements:
  - type: "person"
    name: "Fraud Analyst & Risk Officer"
    description: "Internal actors who manage cases and review suspicious transactions."
  - type: "externalSystem"
    name: "Payment Gateway / Core Processing Platform"
    description: "Upstream external system that submits payment authorization requests."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External authentication provider for user authentication."
  - type: "externalSystem"
    name: "SIEM / Compliance Archive"
    description: "External storage sink for compliance and audit logs."
relationships:
  - source: "Payment Gateway / Core Processing Platform"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Submits authorization requests"
    technology: "gRPC over mTLS"
  - source: "Fraud Analyst & Risk Officer"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Manages cases and reviews transactions"
    technology: "HTTPS over TLS 1.3 / AWS WAF"
  - source: "Identity Provider (IdP)"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Authenticates users"
    technology: "OIDC / OAuth2"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "SIEM / Compliance Archive"
    description: "Exports compliance and audit logs asynchronously"
    technology: "AWS EventBridge / Kinesis"