level: component
scope: "Component diagram for the Data Store container"
parentContainer:
  name: "Data Store"
elements:
  - type: "component"
    name: "Feature Store"
    technology: "Amazon ElastiCache Serverless Redis"
    description: "High-velocity transaction features providing sub-millisecond reads for the Fraud Scoring Engine."
  - type: "component"
    name: "Operational & Audit Database"
    technology: "AWS Aurora PostgreSQL Multi-AZ"
    description: "Relational storage for compliance, transaction history, and case management analyst reviews."
  - type: "component"
    name: "Audit Archive Exporter"
    technology: "AWS Lambda with Amazon EventBridge"
    description: "Automated serverless component for scheduling and transferring immutable audit logs."
  - type: "component"
    name: "Security Controls"
    technology: "AWS KMS Customer-Managed Keys (CMKs) and AWS Security Groups"
    description: "Enforces column-level encryption and AES-256 data protection."
  - type: "component"
    name: "External Storage"
    technology: "Amazon S3 Glacier Vault"
    description: "Tamper-evident, cost-effective 7-year audit retention vault with Object Lock."
relationships:
  - source: "Fraud Scoring Engine"
    destination: "Feature Store"
    description: "Fetches real-time transaction features via RESP / TLS 1.3"
  - source: "Case Management Service"
    destination: "Operational & Audit Database"
    description: "Persists analyst reviews via PostgreSQL Wire Protocol / TLS 1.3"
  - source: "Audit Archive Exporter"
    destination: "External Storage"
    description: "Transfers immutable audit logs via HTTPS / TLS 1.3"