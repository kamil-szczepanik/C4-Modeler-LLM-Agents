level: component
scope: "Component diagram for the Audit & Compliance Ledger container"
parentContainer:
  name: "Audit & Compliance Ledger"
elements:
  - type: "component"
    name: "Ledger Ingestion Component"
    technology: "Rust"
    description: "Ingests decision payloads sent from the Fraud Scoring Engine."
  - type: "component"
    name: "Cryptographic Sealer Component"
    technology: "Rust"
    description: "Builds Merkle trees and interacts with AWS KMS to sign Merkle root hashes."
  - type: "component"
    name: "Storage & Export Component"
    technology: "Rust"
    description: "Persists metadata and Merkle blocks to AWS Aurora PostgreSQL and writes daily Merkle roots to Amazon S3."
  - type: "component"
    name: "Compliance Query & Export Component"
    technology: "Rust"
    description: "Handles queries and exports audit bundles for Compliance Officers and Regulators."
relationships:
  - source: "Ledger Ingestion Component"
    destination: "Cryptographic Sealer Component"
    description: "Passes payloads for cryptographic batching and sealing"
  - source: "Cryptographic Sealer Component"
    destination: "Storage & Export Component"
    description: "Sends sealed Merkle blocks and metadata"
  - source: "Compliance Query & Export Component"
    destination: "Storage & Export Component"
    description: "Queries stored ledger data for audit bundles"