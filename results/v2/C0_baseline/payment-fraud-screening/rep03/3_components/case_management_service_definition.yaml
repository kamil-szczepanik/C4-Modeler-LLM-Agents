level: component
scope: "Component diagram for the Case Management Service container"
parentContainer:
  name: "Case Management Service"
elements:
  - type: "component"
    name: "Case API Controller"
    technology: "Node.js, Express"
    description: "Handles HTTP requests from fraud analysts and risk managers, enforcing OAuth2/OIDC authentication and strict JSON schema validation."
  - type: "component"
    name: "Case Business Logic & Orchestration Service"
    technology: "Node.js, TypeScript"
    description: "Orchestrates case management workflows, bulk overrides, and rule feedback processing, including the Bulk Operation Processor."
  - type: "component"
    name: "Card Masking / Tokenizer Integration Client"
    technology: "Node.js, TypeScript"
    description: "Integrates with payment card networks and tokenization vaults via HTTPS to ingest tokenized references without exposing raw PAN data."
  - type: "component"
    name: "Audit & Immutable Ledger Publisher"
    technology: "Node.js, TypeScript"
    description: "Publishes signed audit logs via gRPC/HTTPS to ensure 7-year operational auditability and compliance."
  - type: "component"
    name: "Rule Feedback Publisher"
    technology: "Node.js, TypeScript"
    description: "Submits rule adjustment flags and feedback via gRPC/HTTPS to the Fraud Scoring Engine."
relationships:
  - source: "Case API Controller"
    destination: "Case Business Logic & Orchestration Service"
    description: "Invokes internal business logic and case management workflows via TypeScript."
  - source: "Case Business Logic & Orchestration Service"
    destination: "Card Masking / Tokenizer Integration Client"
    description: "Requests tokenized references and masking validation via secure API calls."
  - source: "Case Business Logic & Orchestration Service"
    destination: "Audit & Immutable Ledger Publisher"
    description: "Triggers audit event publishing for system operations."
  - source: "Case Business Logic & Orchestration Service"
    destination: "Rule Feedback Publisher"
    description: "Sends analyst feedback and rule adjustments."