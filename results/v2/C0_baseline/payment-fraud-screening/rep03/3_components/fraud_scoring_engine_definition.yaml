level: component
scope: "Component diagram for the Fraud Scoring Engine container"
parentContainer:
  name: "Fraud Scoring Engine"
elements:
  - type: "component"
    name: "Scoring API Controller"
    technology: "Java / Quarkus"
    description: "Receives incoming gRPC scoring requests from the API Gateway."
  - type: "component"
    name: "Feature Lookup Module"
    technology: "Java / Quarkus"
    description: "Performs feature lookups against Amazon Redis."
  - type: "component"
    name: "Inference Execution Engine"
    technology: "ONNX Runtime"
    description: "Executes machine learning models locally without network hops."
  - type: "component"
    name: "Audit Dispatcher"
    technology: "Java / Quarkus gRPC Client"
    description: "Emits signed audit payloads to the Audit & Compliance Ledger."
  - type: "component"
    name: "Event Publisher"
    technology: "Java / Quarkus Event Stream Client"
    description: "Feeds review decisions and risk factor summaries to the Case Management Service."
relationships:
  - source: "Scoring API Controller"
    destination: "Feature Lookup Module"
    description: "Fetches user and transaction features"
  - source: "Feature Lookup Module"
    destination: "Inference Execution Engine"
    description: "Supplies feature data for prediction"
  - source: "Inference Execution Engine"
    destination: "Audit Dispatcher"
    description: "Passes scoring results for audit logging"
  - source: "Inference Execution Engine"
    destination: "Event Publisher"
    description: "Sends final decisions and risk summaries"