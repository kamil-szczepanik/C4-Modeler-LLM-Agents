level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Core scoring and case management platform that evaluates card-not-present transactions for fraud, and provides case management for analysts."
elements:
  - type: "person"
    name: "Fraud Analyst / Risk Manager"
    description: "Performs case reviews and updates fraud rules."
  - type: "externalSystem"
    name: "Payment Gateway / Processing Engine"
    description: "External actor that submits authorization requests."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Manages OIDC/OAuth2 authentication and MFA."
  - type: "externalSystem"
    name: "Payment Card Network / Tokenization Vault"
    description: "Provides tokenized card data."
  - type: "externalSystem"
    name: "Secure Audit Archive"
    description: "Cold storage for tamper-evident retention."
relationships:
  - source: "Payment Gateway / Processing Engine"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Submits card-not-present authorizations for sub-50ms scoring"
    technology: "gRPC over TLS (mTLS)"
  - source: "Fraud Analyst / Risk Manager"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Interacts for case management and rule updates"
    technology: "HTTPS (Web UI) / OIDC/OAuth2"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Payment Card Network / Tokenization Vault"
    description: "Resolves payment tokens to enforce PCI-DSS scope reduction"
    technology: "mTLS/HTTPS"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Secure Audit Archive"
    description: "Writes decisions, model versions, and inputs"
    technology: "AWS SDK/S3 API using S3 Object Lock"
  - source: "Fraud Analyst / Risk Manager"
    destination: "Identity Provider"
    description: "Authenticates with mandatory MFA"
    technology: "OIDC/OAuth2 over HTTPS"