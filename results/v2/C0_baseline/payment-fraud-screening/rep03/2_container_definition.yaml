level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analyst / Risk Manager"
    description: "Performs case reviews and updates fraud rules."
  - type: "person"
    name: "Merchant Operations Manager"
    description: "Monitors merchant operations and transaction metrics."
  - type: "person"
    name: "Compliance Officer"
    description: "Reviews audit trails and compliance reports."
  - type: "externalSystem"
    name: "Payment Gateway / Processing Engine"
    description: "External actor that submits authorization requests."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Manages OIDC/OAuth2 authentication and MFA."
  - type: "externalSystem"
    name: "Payment Card Network / Tokenization Vault"
    description: "Provides tokenized card data."
  - type: "externalSystem"
    name: "Secure Audit Archive"
    description: "Cold storage for tamper-evident retention."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx / AWS ALB"
    description: "Routes incoming requests and handles edge security."
  - type: "container"
    name: "Fraud Scoring Engine"
    technology: "Java/Quarkus or Go with embedded ONNX Runtime"
    description: "Screens card-not-present payment authorizations for fraud prior to approval."
  - type: "container"
    name: "Case Management Service"
    technology: "Node.js / TypeScript"
    description: "Provides a case management interface for fraud analysts."
  - type: "container"
    name: "Audit & Compliance Ledger"
    technology: "Rust or Go with AWS KMS-backed signing"
    description: "Maintains a tamper-evident audit trail and cryptographic non-repudiation."
  - type: "container"
    name: "Analytics Export Stream"
    technology: "Fluent Bit sidecar"
    description: "Scrubs PII and streams anonymized metrics."
  - type: "container"
    name: "Data Store"
    technology: "AWS Aurora PostgreSQL & Amazon Redis"
    description: "Provides relational storage for cases/audit and in-memory storage for low-latency feature stores."
relationships:
  - source: "Payment Gateway / Processing Engine"
    destination: "API Gateway"
    description: "Submits card-not-present payment authorizations"
    technology: "HTTPS (REST/JSON)"
  - source: "API Gateway"
    destination: "Fraud Scoring Engine"
    description: "Forwards scoring requests over internal ALB"
    technology: "gRPC over TLS (mTLS)"
  - source: "Fraud Scoring Engine"
    destination: "Data Store"
    description: "Performs feature lookup"
    technology: "TCP (TLS)"
  - source: "Case Management Service"
    destination: "Identity Provider"
    description: "Authenticates users via OAuth2/OIDC"
    technology: "HTTPS"
  - source: "Fraud Analyst / Risk Manager"
    destination: "Case Management Service"
    description: "Interacts for case management and rule updates"
    technology: "HTTPS (Web UI)"
  - source: "Audit & Compliance Ledger"
    destination: "Secure Audit Archive"
    description: "Writes tamper-evident audit logs and ledgers"
    technology: "HTTPS (TLS)"
  - source: "Analytics Export Stream"
    destination: "Secure Audit Archive"
    description: "Streams anonymized metrics and scrubbed data"
    technology: "HTTPS"