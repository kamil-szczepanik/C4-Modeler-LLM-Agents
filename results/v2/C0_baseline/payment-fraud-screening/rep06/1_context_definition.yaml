level: context
scope: "System Context diagram for Fraud Screening Engine"
system:
  name: "Fraud Screening Engine"
  description: "Processes real-time card-not-present payment authorizations in AWS for fraud screening, provides an analyst review interface, delivers sub-50ms fraud decisions while maintaining PCI-DSS Level 1 compliance and 7-year tamper-evident auditability."
elements:
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "External system sending transaction requests."
  - type: "externalSystem"
    name: "Tokenization Vault"
    description: "External system resolving card tokens for secure data handling."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system managing OIDC/SAML authentication and MFA."
  - type: "externalSystem"
    name: "WORM Compliance Storage"
    description: "External AWS S3 storage for 7-year audit logs."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "Fraud Screening Engine"
    description: "Sends real-time payment events"
    technology: "HTTPS/gRPC with mTLS"
  - source: "Fraud Screening Engine"
    destination: "Tokenization Vault"
    description: "Resolves tokens"
    technology: "HTTPS REST API"
  - source: "Fraud Screening Engine"
    destination: "Identity Provider (IdP)"
    description: "Authenticates analysts"
    technology: "OIDC/SAML"
  - source: "Fraud Screening Engine"
    destination: "WORM Compliance Storage"
    description: "Sends cryptographically signed decision logs"
    technology: "AWS S3 APIs"