level: component
scope: "Component diagram for the Scoring Engine container"
parentContainer:
  name: "Scoring Engine"
elements:
  - type: "component"
    name: "API Router & Validator"
    technology: "Go"
    description: "Validates incoming gRPC payloads and enforces schema integrity."
  - type: "component"
    name: "Feature Assembler"
    technology: "Go"
    description: "Queries DynamoDB for user and card velocity features with parallelized execution."
  - type: "component"
    name: "Inference & Rules Evaluator"
    technology: "Rust"
    description: "Executes compiled machine learning models and dynamic rule sets concurrently."
  - type: "component"
    name: "Model Loader Component"
    technology: "Rust"
    description: "Handles S3 event notifications, cryptographic signature verification, and atomic in-memory model hot-swapping."
  - type: "component"
    name: "Audit Dispatcher"
    technology: "Go"
    description: "Asynchronously emits cryptographically signed, tamper-evident audit records."
relationships:
  - source: "AWS API Gateway / ALB"
    destination: "API Router & Validator"
    description: "Routes incoming authorization requests via [mTLS / gRPC]."
  - source: "Feature Assembler"
    destination: "Amazon DynamoDB"
    description: "Reads and writes feature stores and transaction data using [AWS SDK]."
  - source: "Model Loader Component"
    destination: "Rule & Model Registry"
    description: "Receives S3 event notifications and fetches model artifacts via [HTTPS / AWS SDK]."
  - source: "Audit Dispatcher"
    destination: "Amazon Kinesis Data Streams & AWS S3 Firehose"
    description: "Streams audit logs via [AWS SDK]."
  - source: "Audit Dispatcher"
    destination: "WORM Compliance Storage"
    description: "Persists immutable compliance logs via [S3 Firehose]."