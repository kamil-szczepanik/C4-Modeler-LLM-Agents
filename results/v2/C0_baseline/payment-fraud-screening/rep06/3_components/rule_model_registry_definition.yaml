level: component
scope: "Component diagram for the Rule & Model Registry container"
parentContainer:
  name: "Rule & Model Registry"
elements:
  - type: "component"
    name: "Registry API"
    technology: "AWS Lambda / Python FastAPI"
    description: "Administrative REST interface for model uploads, schema validation, and RBAC."
  - type: "component"
    name: "Amazon S3"
    technology: "Amazon S3"
    description: "Immutable binary artifact storage for models and rules (.onnx / .json)."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Stores version tags, access controls, and audit logs with KMS encryption."
relationships:
  - source: "Registry API"
    destination: "Amazon S3"
    description: "Persists immutable binary model files and rule definitions via AWS SDK."
  - source: "Registry API"
    destination: "Amazon DynamoDB"
    description: "Reads and writes version tags, access controls, and audit logs via AWS SDK."