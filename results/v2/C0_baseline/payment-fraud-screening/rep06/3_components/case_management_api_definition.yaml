level: component
scope: "Component diagram for the Case Management API container"
parentContainer:
  name: "Case Management API"
elements:
  - type: "component"
    name: "Case Controller"
    technology: "Node.js / TypeScript"
    description: "Handles incoming HTTP requests from Fraud Analysts and manages alert reviews."
  - type: "component"
    name: "Case Workflow Service"
    technology: "Node.js / TypeScript"
    description: "Implements business logic for managing case states and workflows."
  - type: "component"
    name: "Note & Tagging Service"
    technology: "Node.js / TypeScript"
    description: "Manages analyst tags and case annotations, emitting events asynchronously."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "Node.js / TypeScript"
    description: "Prepares cryptographically signed audit payloads for compliance storage."
  - type: "component"
    name: "Data Access Repository"
    technology: "Node.js / TypeScript / AWS SDK"
    description: "Persists and retrieves active cases and data from Amazon DynamoDB."
relationships:
  - source: "Case Controller"
    destination: "Case Workflow Service"
    description: "Delegates case management operations"
  - source: "Case Workflow Service"
    destination: "Note & Tagging Service"
    description: "Updates tags and annotations"
  - source: "Case Workflow Service"
    destination: "Data Access Repository"
    description: "Persists and retrieves case state"
  - source: "Note & Tagging Service"
    destination: "Audit & Compliance Logger"
    description: "Sends audit events for logging"