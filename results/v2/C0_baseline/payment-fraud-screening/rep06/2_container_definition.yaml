# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Fraud Screening Engine"
system:
  name: "Fraud Screening Engine"
elements:
  - type: "person"
    name: "Cardholder / End Customer"
    description: "Performs card-not-present transactions."
  - type: "person"
    name: "Fraud Analyst"
    description: "Reviews cases and performs fraud investigation."
  - type: "person"
    name: "Risk / Fraud Manager"
    description: "Manages fraud strategies and policies."
  - type: "externalSystem"
    name: "External Identity Provider (IdP)"
    description: "Manages authentication."
  - type: "externalSystem"
    name: "Tokenization Vault"
    description: "Resolves card tokens for secure data handling."
  - type: "externalSystem"
    name: "WORM Compliance Storage"
    description: "Amazon S3 with Object Lock for tamper-evident audit compliance."
  - type: "container"
    name: "AWS API Gateway / ALB"
    technology: "AWS API Gateway / ALB"
    description: "Ingresses and routes incoming HTTP traffic."
  - type: "container"
    name: "Scoring Engine"
    technology: "Go / Rust, AWS ECS Fargate"
    description: "Evaluates card-not-present transactions in real time with low latency."
  - type: "container"
    name: "Case Management API"
    technology: "AWS ECS Fargate"
    description: "Provides case management functionalities for fraud analysts."
  - type: "container"
    name: "Rule & Model Registry"
    technology: "Amazon S3"
    description: "Stores scoring rules and machine learning models."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Delivers low-latency storage for feature stores and case data."
  - type: "container"
    name: "Amazon Kinesis Data Streams & AWS S3 Firehose"
    technology: "Amazon Kinesis Data Streams / AWS S3 Firehose"
    description: "Handles high-throughput, durable audit log streaming."
relationships:
  - source: "Cardholder / End Customer"
    destination: "AWS API Gateway / ALB"
    description: "Initiates transactions"
    technology: "HTTPS/JSON"
  - source: "AWS API Gateway / ALB"
    destination: "Scoring Engine"
    description: "Routes scoring requests"
    technology: "mTLS / gRPC"
  - source: "Scoring Engine"
    destination: "Amazon DynamoDB"
    description: "Reads/Writes feature stores and transaction data"
    technology: "AWS SDK"
  - source: "Scoring Engine"
    destination: "Amazon Kinesis Data Streams & AWS S3 Firehose"
    description: "Streams audit logs"
    technology: "AWS SDK"
  - source: "Scoring Engine"
    destination: "Rule & Model Registry"
    description: "Fetches rules and models"
    technology: "HTTPS"
  - source: "Fraud Analyst"
    destination: "Case Management API"
    description: "Reviews cases and manages alerts"
    technology: "HTTPS/OAuth2"
  - source: "Scoring Engine"
    destination: "WORM Compliance Storage"
    description: "Persists immutable compliance logs"
    technology: "S3 Firehose"
  - source: "Case Management API"
    destination: "WORM Compliance Storage"
    description: "Persists audit trail"
    technology: "S3 Firehose"