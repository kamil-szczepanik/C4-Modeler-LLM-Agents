level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
  description: "A cloud-native system that screens card-not-present payment authorizations for fraud and manages analyst review cases to protect merchant revenue while enforcing security mandates."
elements:
  - type: "person"
    name: "Shopper / Cardholder"
    description: "End user initiating card-not-present payment authorizations."
  - type: "person"
    name: "Merchant"
    description: "Business entity processing payments whose revenue is protected by the screening system."
  - type: "person"
    name: "Fraud Analyst"
    description: "User reviewing fraud cases and managing manual decisions."
  - type: "person"
    name: "Risk / Compliance Officer"
    description: "User overseeing compliance mandates, risk policies, and audits."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "External system routing payment authorization requests."
  - type: "externalSystem"
    name: "Card Networks / Identity Providers"
    description: "External entities providing card payment rails and identity verification."
  - type: "externalSystem"
    name: "Compliance & Audit Archival Storage"
    description: "External storage system for immutable log streaming and 7-year retention."
  - type: "externalSystem"
    name: "Identity Provider / IdP"
    description: "External service handling authentication for analysts and officers."
  - type: "externalSystem"
    name: "Notification / Alerting Service"
    description: "External service handling operational alerts."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "Real-Time Payment Fraud Screening"
    description: "Sends authorization requests and receives synchronous decisions"
    technology: "REST/gRPC with mTLS"
  - source: "Real-Time Payment Fraud Screening"
    destination: "Compliance & Audit Archival Storage"
    description: "Streams immutable logs for audit compliance"
    technology: "TLS"
  - source: "Fraud Analyst"
    destination: "Real-Time Payment Fraud Screening"
    description: "Reviews cases and manages screening workflows via IdP authentication"
    technology: "HTTPS/OIDC/SAML"
  - source: "Risk / Compliance Officer"
    destination: "Real-Time Payment Fraud Screening"
    description: "Monitors compliance and risk rules via IdP authentication"
    technology: "HTTPS/OIDC/SAML"
  - source: "Real-Time Payment Fraud Screening"
    destination: "Notification / Alerting Service"
    description: "Sends operational alerts"
    technology: "HTTPS/SMTP"