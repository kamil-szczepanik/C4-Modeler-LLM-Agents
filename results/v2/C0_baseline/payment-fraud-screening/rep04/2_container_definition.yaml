level: container
scope: "Container diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
elements:
  - type: "person"
    name: "Shopper / Cardholder"
    description: "End user initiating card-not-present payment authorizations."
  - type: "person"
    name: "Merchant"
    description: "Business entity processing payments whose revenue is protected by the screening system."
  - type: "person"
    name: "Fraud Analyst"
    description: "User reviewing fraud cases and managing manual decisions."
  - type: "externalSystem"
    name: "External IdP"
    description: "OAuth2/OIDC service for analyst authentication."
  - type: "container"
    name: "AWS API Gateway"
    technology: "Low-overhead HTTP/2 ingress, AWS API Gateway"
    description: "Ingress and edge tokenization boundary for PAN data."
  - type: "container"
    name: "Scoring Engine"
    technology: "Rust (Tokio), Amazon ECS Fargate"
    description: "Real-time payment fraud screening engine providing sub-50ms latency scoring."
  - type: "container"
    name: "Case Management App"
    technology: "Node.js/Python, Amazon ECS Fargate"
    description: "Backend application for managing review cases."
  - type: "container"
    name: "Feature Store & Cache"
    technology: "Amazon ElastiCache Redis, Amazon DynamoDB"
    description: "In-memory caching and data storage for low-latency feature lookups."
  - type: "container"
    name: "Audit & Streaming Pipeline"
    technology: "Amazon Kinesis Data Streams, Amazon Kinesis Firehose"
    description: "Streaming pipeline for tamper-evident audit logs."
  - type: "container"
    name: "Audit Storage"
    technology: "Amazon S3 with Object Lock in Compliance Mode"
    description: "Tamper-evident 7-year compliance audit log storage."
relationships:
  - source: "Shopper / Cardholder"
    destination: "AWS API Gateway"
    description: "Sends payment transactions for fraud screening"
    technology: "REST/JSON over HTTPS (TLS 1.3)"
  - source: "Merchant"
    destination: "AWS API Gateway"
    description: "Sends card-not-present transactions for screening"
    technology: "REST/JSON over HTTPS (TLS 1.3)"
  - source: "Fraud Analyst"
    destination: "Case Management App"
    description: "Reviews cases and manages screening workflows"
    technology: "HTTPS"
  - source: "Fraud Analyst"
    destination: "External IdP"
    description: "Authenticates for analyst access"
    technology: "OAuth2/OIDC over HTTPS"
  - source: "AWS API Gateway"
    destination: "Scoring Engine"
    description: "Routes screening requests"
    technology: "Internal ALB / gRPC"
  - source: "Scoring Engine"
    destination: "Feature Store & Cache"
    description: "Performs low-latency feature lookups"
    technology: "TCP/TLS"
  - source: "Case Management App"
    destination: "Audit & Streaming Pipeline"
    description: "Streams review and case events"
    technology: "HTTPS"
  - source: "Audit & Streaming Pipeline"
    destination: "Audit Storage"
    description: "Persists immutable logs"
    technology: "AWS internal storage APIs"