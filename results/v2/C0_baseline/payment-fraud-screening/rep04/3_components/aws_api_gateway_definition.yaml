level: component
scope: "Component diagram for the AWS API Gateway container"
parentContainer:
  name: "AWS API Gateway"
elements:
  - type: "component"
    name: "HTTP Route Resolver"
    technology: "AWS API Gateway (HTTP API v2)"
    description: "Receives screening payloads via REST/JSON over HTTPS and handles low-overhead HTTP/2 ingress."
  - type: "component"
    name: "Native JWT Authorizer"
    technology: "AWS API Gateway Native JWT Authorizer"
    description: "Validates bearer tokens at the edge without custom compute overhead."
  - type: "component"
    name: "VPC Link Integration"
    technology: "AWS API Gateway VPC Link"
    description: "Forwards sanitized payloads via gRPC over HTTP/2 to internal services."
relationships:
  - source: "HTTP Route Resolver"
    destination: "Native JWT Authorizer"
    description: "Validates bearer tokens [Internal Evaluation]"
  - source: "HTTP Route Resolver"
    destination: "VPC Link Integration"
    description: "Forwards sanitized payloads [gRPC over HTTP/2]"