level: component
scope: "Component diagram for the Case Management App container"
parentContainer:
  name: "Case Management App"
elements:
  - type: "person"
    name: "Fraud Analyst"
    technology: "Human User"
    description: "Reviews cases and manages screening workflows."
  - type: "person"
    name: "Risk / Compliance Officer"
    technology: "Human User"
    description: "Inspects audit trails and logs read-only."
  - type: "component"
    name: "Case API Controller"
    technology: "TypeScript / NestJS"
    description: "Handles API requests for case management and screening workflows."
  - type: "component"
    name: "Case Orchestrator Service"
    technology: "TypeScript"
    description: "Dispatches workflow commands and manages case states."
  - type: "component"
    name: "Audit & Evidence Proxy"
    technology: "TypeScript"
    description: "Queries tamper-evident decision logs and model explanations."
  - type: "component"
    name: "Feedback & Telemetry Emitter"
    technology: "TypeScript"
    description: "Streams analyst feedback tags for offline model retraining."
  - type: "container"
    name: "Case & Audit Read Store"
    technology: "Amazon DynamoDB"
    description: "Indexed read store for fast, secure audit retrieval and case caching."
  - type: "container"
    name: "Audit Storage"
    technology: "Amazon S3 with Object Lock"
    description: "Secure storage for tamper-evident audit data."
  - type: "container"
    name: "Audit & Streaming Pipeline"
    technology: "Amazon Kinesis Data Streams / Firehose"
    description: "Pipeline for streaming feedback and telemetry data."
  - type: "system"
    name: "Identity Provider / IdP"
    technology: "OIDC/OAuth2"
    description: "Handles authentication and authorization."
relationships:
  - source: "Fraud Analyst"
    destination: "Case API Controller"
    description: "Reviews cases and manages screening workflows [HTTPS / mTLS]"
  - source: "Risk / Compliance Officer"
    destination: "Case API Controller"
    description: "Inspects audit trails and logs read-only [HTTPS / mTLS]"
  - source: "Case API Controller"
    destination: "Case Orchestrator Service"
    description: "Dispatches workflow commands [In-memory function calls]"
  - source: "Case Orchestrator Service"
    destination: "Case & Audit Read Store"
    description: "Reads and updates case state [HTTPS / AWS SDK via VPC Endpoints]"
  - source: "Audit & Evidence Proxy"
    destination: "Case & Audit Read Store"
    description: "Queries tamper-evident decision logs and model explanations [HTTPS / AWS SDK via VPC Endpoints]"
  - source: "Feedback & Telemetry Emitter"
    destination: "Audit & Streaming Pipeline"
    description: "Streams analyst feedback tags for offline model retraining [HTTPS / Kinesis API]"