level: component
scope: "Component diagram for the Feature Store & Cache container"
parentContainer:
  name: "Feature Store & Cache"
elements:
  - type: "component"
    name: "Feature Retrieval API / Router"
    technology: "Rust / Node.js"
    description: "Provides real-time, low-latency feature lookups and profile storage for the payment fraud scoring engine, ensuring sub-50ms transaction evaluations."
  - type: "component"
    name: "Hot Cache Layer"
    technology: "Amazon ElastiCache Serverless Redis"
    description: "Provides sub-millisecond hot feature retrieval with zero operational scaling toil to meet the R-04 performance SLA within budget."
  - type: "component"
    name: "Historical Feature Store"
    technology: "Amazon DynamoDB on-demand"
    description: "Stores historical entity profiles with automated point-in-time recovery (PITR) to satisfy reliability constraints without cluster sizing overhead."
  - type: "component"
    name: "Cache Invalidation & Sync Worker"
    technology: "Rust"
    description: "Ingests feature/rule state updates via Amazon Kinesis Consumer in under 1 second to keep the cache synchronized."
relationships:
  - source: "Scoring Engine"
    destination: "Hot Cache Layer"
    description: "Retrieves real-time aggregates and hot features via TCP / RESP with TLS 1.3"
  - source: "Scoring Engine"
    destination: "Historical Feature Store"
    description: "Queries wider entity profiles via AWS SDK over HTTPS/2"
  - source: "Audit & Streaming Pipeline"
    destination: "Cache Invalidation & Sync Worker"
    description: "Ingests feature/rule state updates via Amazon Kinesis Consumer (TCP/HTTP) in under 1 second"