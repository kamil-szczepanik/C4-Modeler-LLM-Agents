level: component
scope: "Component diagram for the Audit & Streaming Pipeline container"
parentContainer:
  name: "Audit & Streaming Pipeline"
elements:
  - type: "component"
    name: "Amazon Kinesis Data Streams"
    technology: "Amazon Kinesis Data Streams"
    description: "Ingests real-time pre-redacted audit events."
  - type: "component"
    name: "Amazon Kinesis Firehose"
    technology: "Amazon Kinesis Firehose"
    description: "Batches and streams audit logs to persistent storage."
  - type: "component"
    name: "AWS Lambda"
    technology: "AWS Lambda"
    description: "Processes and routes audit events within the streaming pipeline."
relationships:
  - source: "Amazon Kinesis Data Streams"
    destination: "Amazon Kinesis Firehose"
    description: "Batches and forwards stream data"
  - source: "Amazon Kinesis Firehose"
    destination: "AWS Lambda"
    description: "Invokes processing functions or handles error routing"