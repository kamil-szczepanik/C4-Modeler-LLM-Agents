level: component
scope: "Component diagram for the Audit Storage container"
parentContainer:
  name: "Audit Storage"
elements:
  - type: "component"
    name: "S3 Bucket (Data Partition)"
    technology: "Amazon S3"
    description: "Data partition storing immutable audit records for 7-year retention."
  - type: "component"
    name: "S3 Object Lock Policy Engine"
    technology: "Amazon S3 Object Lock (Compliance Mode)"
    description: "Ensures tamper-evident retention for R-06 compliance."
  - type: "component"
    name: "AWS Glue Data Catalog"
    technology: "AWS Glue"
    description: "Catalogs partitioned audit logs for querying."
  - type: "component"
    name: "Athena Query Interface"
    technology: "Amazon Athena"
    description: "Enables serverless SQL querying over partitioned audit logs."
  - type: "component"
    name: "S3 Glacier Flexible Retrieval"
    technology: "Amazon S3 Glacier"
    description: "Optimizes long-term storage costs to fit the monthly budget."
  - type: "person"
    name: "Risk / Compliance Officer"
    technology: "Human / Analyst"
    description: "Queries historical audit logs."
relationships:
  - source: "Risk / Compliance Officer"
    destination: "Athena Query Interface"
    description: "Queries historical audit logs [HTTPS/Console, SQL]"
  - type: "Athena Query Interface"
    source: "Athena Query Interface"
    destination: "S3 Bucket (Data Partition)"
    description: "Scans immutable audit records [AWS internal storage APIs]"