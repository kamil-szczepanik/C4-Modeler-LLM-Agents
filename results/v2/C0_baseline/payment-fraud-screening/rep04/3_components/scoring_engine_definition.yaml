level: component
scope: "Component diagram for the Scoring Engine container"
parentContainer:
  name: "Scoring Engine"
elements:
  - type: "component"
    name: "Ingress Coordinator"
    technology: "Rust, tonic, axum"
    description: "Evaluates card-not-present payment authorizations for fraud under strict latency constraints before approval."
  - type: "component"
    name: "Feature Assembler"
    technology: "redis-rs, Amazon ElastiCache Redis, Amazon DynamoDB"
    description: "Performs low-latency feature lookups and feature assembly for transactions."
  - type: "component"
    name: "Model Executor"
    technology: "Wasmtime sandbox, WebAssembly"
    description: "Executes scoring models securely with zero-downtime hot-reloading."
  - type: "component"
    name: "Audit Dispatcher"
    technology: "aws-sdk-rust, Amazon Kinesis Data Streams, Amazon Kinesis Firehose"
    description: "Emits decision payloads and streaming audit data."
  - type: "component"
    name: "Model Registry Client"
    technology: "AWS KMS, Amazon S3"
    description: "Fetches signed Wasm binaries from model storage securely."
  - type: "component"
    name: "Container Infrastructure"
    technology: "Amazon ECS Fargate, AWS API Gateway, Internal ALB"
    description: "Provides managed container runtime and routes screening requests."
relationships:
  - source: "Ingress Coordinator"
    destination: "Feature Assembler"
    description: "Performs low-latency feature lookups"
  - source: "Ingress Coordinator"
    destination: "Model Executor"
    description: "Invokes WebAssembly scoring models"
  - source: "Model Executor"
    destination: "Audit Dispatcher"
    description: "Emits decision payloads after evaluation"
  - source: "Model Registry Client"
    destination: "Model Executor"
    description: "Supplies signed Wasm binaries"