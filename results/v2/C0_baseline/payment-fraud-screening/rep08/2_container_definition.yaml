# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
elements:
  - type: "person"
    name: "Fraud Analysts & Risk Managers"
    description: "Internal users reviewing suspicious payments and updating models."
  - type: "externalSystem"
    name: "Payment Gateway / Merchants"
    description: "External API clients submitting authorization requests."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "AWS Cognito / Okta providing OIDC/OAuth2 authentication."
  - type: "externalSystem"
    name: "BI / Analytics Tool"
    description: "Amazon QuickSight for aggregated metric reporting via isolated data pipelines."
  - type: "container"
    name: "API Gateway & Routing Layer"
    description: "Ingress & Routing layer handling incoming API requests with built-in circuit breaker."
    technology: "AWS API Gateway / ALB"
  - type: "container"
    name: "Scoring Engine Container"
    description: "Evaluates card-not-present payment authorizations with sub-50 ms P99 latencies."
    technology: "Go or Rust on AWS Fargate Spot"
  - type: "container"
    name: "Case Management Container"
    description: "Provides case management for fraud analysts with relational state and row-level encryption."
    technology: "Node.js / React SPA backend with Amazon RDS (PostgreSQL)"
  - type: "container"
    name: "Audit & Event Store Container"
    description: "Stores tamper-evident logs secured with AWS KMS Customer Managed Keys and S3 Object Lock."
    technology: "Amazon DynamoDB & S3"
  - type: "container"
    name: "Messaging Backbone"
    description: "Serverless, low-maintenance event publishing backbone."
    technology: "Amazon SQS / SNS"
  - type: "container"
    name: "Model Storage & Management"
    description: "Stores dynamic model weights and secrets for the system."
    technology: "Amazon S3 & AWS Secrets Manager"
relationships:
  - source: "Payment Gateway / Merchants"
    destination: "API Gateway & Routing Layer"
    description: "Submits payment authorizations"
    technology: "HTTPS (REST/JSON)"
  - source: "API Gateway & Routing Layer"
    destination: "Scoring Engine Container"
    description: "Routes scoring requests"
    technology: "gRPC with mTLS"
  - source: "Scoring Engine Container"
    destination: "Model Storage & Management"
    description: "Retrieves dynamic model weights"
    technology: "HTTPS (S3 API)"
  - source: "Scoring Engine Container"
    destination: "Messaging Backbone"
    description: "Publishes scoring events"
    technology: "HTTPS (SQS/SNS)"
  - source: "Case Management Container"
    destination: "Messaging Backbone"
    description: "Publishes case events"
    technology: "HTTPS (SQS/SNS)"
  - source: "Fraud Analysts & Risk Managers"
    destination: "Case Management Container"
    description: "Reviews cases and manages fraud workflow"
    technology: "HTTPS (OAuth2/OIDC)"
  - source: "Case Management Container"
    destination: "Audit & Event Store Container"
    description: "Writes audit logs and events"
    technology: "AWS SDK (DynamoDB API)"