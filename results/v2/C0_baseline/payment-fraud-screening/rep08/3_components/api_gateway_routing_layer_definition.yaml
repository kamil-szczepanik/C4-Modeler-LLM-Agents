level: component
scope: "Component diagram for the API Gateway & Routing Layer container"
parentContainer:
  name: "API Gateway & Routing Layer"
elements:
  - type: "component"
    name: "API Gateway Authorizer"
    technology: "AWS API Gateway"
    description: "Validates incoming payment authorization requests and integrates with AWS WAF."
  - type: "component"
    name: "AWS WAF / Edge Terminator"
    technology: "AWS WAF"
    description: "Provides edge termination and security filtering for incoming traffic."
  - type: "component"
    name: "Routing & Circuit Breaker Proxy"
    technology: "AWS API Gateway Routing Proxy"
    description: "Routes validated requests to backend scoring engines and implements circuit breaking."
relationships:
  - source: "API Gateway Authorizer"
    destination: "Routing & Circuit Breaker Proxy"
    description: "Transmits validated requests via [Internal TLS / HTTP/2]"