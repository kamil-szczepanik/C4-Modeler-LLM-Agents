level: component
scope: "Component diagram for the Scoring Engine Container container"
parentContainer:
  name: "Scoring Engine Container"
elements:
  - type: "component"
    name: "Inbound API Handler"
    technology: "Go or Rust"
    description: "Handles incoming routing requests and API validation."
  - type: "component"
    name: "Feature Assembler"
    technology: "Go or Rust"
    description: "Performs profile lookups and assembles features for scoring."
  - type: "component"
    name: "Execution Core"
    technology: "Wasmtime (WebAssembly)"
    description: "Executes compiled scoring models securely within a metered runtime sandbox."
  - type: "component"
    name: "Audit Publisher"
    technology: "Go or Rust"
    description: "Dispatches signed audit payloads via non-blocking channels and SQS."
relationships:
  - source: "Inbound API Handler"
    destination: "Feature Assembler"
    description: "Forwards requests to assemble required features [In-memory]"
  - source: "Feature Assembler"
    destination: "Execution Core"
    description: "Provides assembled features to scoring models [In-memory]"
  - source: "Execution Core"
    destination: "Audit Publisher"
    description: "Triggers audit event generation upon scoring completion [In-memory]"