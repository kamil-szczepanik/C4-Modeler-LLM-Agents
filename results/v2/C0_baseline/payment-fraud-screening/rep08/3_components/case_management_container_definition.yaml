level: component
scope: "Component diagram for the Case Management Container container"
parentContainer:
  name: "Case Management Container"
elements:
  - type: "component"
    name: "Case API Service"
    technology: "Node.js/Express"
    description: "Exposes case management APIs and handles fraud workflow integration."
  - type: "component"
    name: "Case Workflow Controller"
    technology: "Node.js"
    description: "Manages case states and workflow transitions."
  - type: "component"
    name: "Data Access Repository"
    technology: "TypeScript/Prisma"
    description: "Provides type-safe database access and persists relational case histories."
  - type: "component"
    name: "Masking & Tokenization Service"
    technology: "Node.js utility"
    description: "Strips and masks sensitive PAN data to maintain compliance."
relationships:
  - source: "Case API Service"
    destination: "Masking & Tokenization Service"
    description: "Strips/masks sensitive PAN data [In-process function call]"
  - source: "Case API Service"
    destination: "Data Access Repository"
    description: "Reads/writes case state [Prisma Client over TCP/TLS 1.3]"
  - source: "Data Access Repository"
    destination: "Aurora Serverless v2 (PostgreSQL)"
    description: "Encrypted state persistence [TCP/TLS (Prisma, pgcrypto)]"
  - source: "Case Workflow Controller"
    destination: "Messaging Backbone"
    description: "Publishes case resolution events [AWS SDK (SNS/SQS)]"
  - source: "Case Workflow Controller"
    destination: "Audit & Event Store Container"
    description: "Emits signed state-change audit logs [AWS SDK (DynamoDB API)]"