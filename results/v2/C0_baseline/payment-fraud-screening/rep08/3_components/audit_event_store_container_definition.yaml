level: component
scope: "Component diagram for the Audit & Event Store Container container"
parentContainer:
  name: "Audit & Event Store Container"
elements:
  - type: "component"
    name: "Audit Event Ingestion Service"
    technology: "Node.js / AWS SDK"
    description: "Processes audit events from the Messaging Backbone and records them."
  - type: "component"
    name: "Audit Query API"
    technology: "Node.js / REST API"
    description: "Exposes endpoints for compliance officers and external auditors to query historical decisions and export reports."
  - type: "component"
    name: "Audit Storage Manager"
    technology: "Amazon DynamoDB & Amazon S3 with Object Lock"
    description: "Manages 7-year tamper-evident immutable storage and real-time event capture."
relationships:
  - source: "Audit Event Ingestion Service"
    destination: "Audit Storage Manager"
    description: "Writes audit logs and events [AWS SDK (DynamoDB API)]"
  - source: "Audit Query API"
    destination: "Audit Storage Manager"
    description: "Queries historical decisions and exports reports [REST API / HTTPS]"