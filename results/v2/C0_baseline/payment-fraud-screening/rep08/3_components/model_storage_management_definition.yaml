level: component
scope: "Component diagram for the Model Storage & Management container"
parentContainer:
  name: "Model Storage & Management"
elements:
  - type: "component"
    name: "Model Registry"
    technology: "Amazon S3 with Object Lock in Compliance Mode"
    description: "Stores immutable model binaries ensuring write-once immutability for 7-year audit compliance."
  - type: "component"
    name: "Model Metadata Store"
    technology: "Amazon DynamoDB"
    description: "Maintains atomic state tracking and model metadata for zero-downtime model promotion."
  - type: "component"
    name: "Model Validation Function"
    technology: "AWS Lambda"
    description: "Automates schema validation, baseline checks, and updates deployment states."
  - type: "component"
    name: "Model Sync Agent"
    technology: "Background thread within Scoring Engine"
    description: "Polls active model pointers and fetches immutable model binaries into local memory."
  - type: "component"
    name: "Security & Secrets"
    technology: "AWS Secrets Manager & AWS KMS Customer Managed Keys"
    description: "Encrypts model artifacts and metadata with strict IAM role bindings."
relationships:
  - source: "Model Validation Function"
    destination: "Model Registry"
    description: "Validates and stores binaries [HTTPS via AWS PrivateLink]"
  - source: "Model Validation Function"
    destination: "Model Metadata Store"
    description: "Updates deployment state [HTTPS via AWS PrivateLink]"
  - source: "Model Sync Agent"
    destination: "Model Metadata Store"
    description: "Polls active model pointers [HTTPS via AWS PrivateLink]"
  - source: "Model Sync Agent"
    destination: "Model Registry"
    description: "Fetches immutable model binaries into local memory [HTTPS via VPC Gateway Endpoints]"