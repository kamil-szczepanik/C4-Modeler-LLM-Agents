level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
  description: "Real-Time Payment Fraud Screening system providing instant sub-50ms risk scoring for card-not-present transactions and case management for fraud analysts, ensuring PCI-DSS Level 1 compliance and 7-year tamper-evident auditability."
elements:
  - type: "person"
    name: "Fraud Analysts & Risk Managers"
    description: "Internal users reviewing suspicious payments and updating models."
  - type: "externalSystem"
    name: "Payment Gateway / Merchants"
    description: "External API clients submitting authorization requests."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "AWS Cognito / Okta providing OIDC/OAuth2 authentication."
  - type: "externalSystem"
    name: "BI / Analytics Tool"
    description: "Amazon QuickSight for aggregated metric reporting via isolated data pipelines."
relationships:
  - source: "Payment Gateway / Merchants"
    destination: "Real-Time Payment Fraud Screening"
    description: "Submits real-time scoring requests for card-not-present transactions"
    technology: "Synchronous gRPC/REST over mTLS"
  - source: "Fraud Analysts & Risk Managers"
    destination: "Real-Time Payment Fraud Screening"
    description: "Reviews suspicious payments and manages cases"
    technology: "HTTPS (TLS 1.3) with MFA and RBAC/ABAC"
  - source: "Real-Time Payment Fraud Screening"
    destination: "Identity Provider"
    description: "Authenticates users via OIDC/OAuth2"
    technology: "HTTPS / OIDC"
  - source: "Real-Time Payment Fraud Screening"
    destination: "BI / Analytics Tool"
    description: "Sends pseudonymized data for aggregated metric reporting"
    technology: "Asynchronous data pipeline (AWS DMS / S3 triggers)"