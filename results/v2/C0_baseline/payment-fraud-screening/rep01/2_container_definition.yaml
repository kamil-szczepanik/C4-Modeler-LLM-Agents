level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Human persona managing suspicious payments and reviewing flagged cases."
  - type: "person"
    name: "Compliance & Risk Officer"
    description: "Officer overseeing compliance, auditing, and risk management."
  - type: "externalSystem"
    name: "Merchant / Payment Gateway"
    description: "External system submitting payment authorizations."
  - type: "externalSystem"
    name: "AWS KMS"
    description: "External AWS service for encryption keys and edge tokenization."
  - type: "externalSystem"
    name: "AWS S3 Object Lock"
    description: "External AWS WORM storage providing 7-year tamper-evident audit logs."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system managing OAuth2/OIDC authentication and RBAC."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway"
    description: "Handles edge tokenization and routes incoming payment authorizations."
  - type: "container"
    name: "Scoring Engine"
    technology: "AWS Lambda with Provisioned Concurrency, Go runtime"
    description: "Evaluates card-not-present payment authorizations for fraud with sub-50ms P99 latency."
  - type: "container"
    name: "Case Management"
    technology: "Node.js / React on ECS Fargate"
    description: "Provides case management and review interfaces for fraud analysts."
  - type: "container"
    name: "Data Layer"
    technology: "Amazon Aurora Serverless v2 PostgreSQL"
    description: "Stores transactional and audit data for cases and reviews."
  - type: "container"
    name: "Async Messaging"
    technology: "AWS SQS"
    description: "Handles decoupled asynchronous audit event streaming."
  - type: "container"
    name: "Observability"
    technology: "AWS X-Ray"
    description: "Provides distributed tracing and latency monitoring."
relationships:
  - source: "Merchant / Payment Gateway"
    destination: "API Gateway"
    description: "Calls API Gateway for real-time payment authorization"
    technology: "HTTPS/TLS"
  - source: "API Gateway"
    destination: "Scoring Engine"
    description: "Communicates scoring requests securely"
    technology: "gRPC using mTLS"
  - source: "Scoring Engine"
    destination: "Async Messaging"
    description: "Asynchronously enqueues audit logs"
    technology: "AWS SQS API"
  - source: "Fraud Analyst"
    destination: "Case Management"
    description: "Reviews suspicious transactions and managed cases"
    technology: "HTTPS/TLS with OAuth2/OIDC"
  - source: "Case Management"
    destination: "Data Layer"
    description: "Reads and writes case review data"
    technology: "PostgreSQL Wire Protocol"
  - source: "Scoring Engine"
    destination: "AWS KMS"
    description: "Retrieves secrets and handles cryptographic operations"
    technology: "AWS SDK / IAM"
  - source: "Case Management"
    destination: "AWS KMS"
    description: "Retrieves secrets and cryptographic keys"
    technology: "AWS SDK / IAM"
  - source: "Scoring Engine"
    destination: "Observability"
    description: "Sends trace and latency data"
    technology: "AWS X-Ray SDK"
  - source: "Case Management"
    destination: "Observability"
    description: "Sends trace and latency data"
    technology: "AWS X-Ray SDK"
  - source: "Compliance & Risk Officer"
    destination: "AWS S3 Object Lock"
    description: "Accesses 7-year tamper-evident audit logs"
    technology: "AWS SDK / HTTPS"