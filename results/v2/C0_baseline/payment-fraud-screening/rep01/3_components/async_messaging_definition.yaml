level: component
scope: "Component diagram for the Async Messaging container"
parentContainer:
  name: "Async Messaging"
elements:
  - type: "component"
    name: "SQS FIFO Queue"
    technology: "Amazon SQS FIFO"
    description: "High-throughput message queue with message group IDs for ordered, exactly-once audit event processing."
  - type: "component"
    name: "Dead-Letter Queue"
    technology: "Amazon SQS DLQ"
    description: "Captures unprocessable messages for failure analysis and isolation."
  - type: "component"
    name: "VPC Interface Endpoint"
    technology: "AWS VPC Interface Endpoint"
    description: "Secures internal communication with the messaging service."
relationships:
  - source: "SQS FIFO Queue"
    destination: "Dead-Letter Queue"
    description: "Forwards failed messages"
  - source: "VPC Interface Endpoint"
    destination: "SQS FIFO Queue"
    description: "Routes private network traffic"