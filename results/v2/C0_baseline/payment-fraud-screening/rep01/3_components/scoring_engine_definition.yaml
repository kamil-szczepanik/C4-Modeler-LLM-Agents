level: component
scope: "Component diagram for the Scoring Engine container"
parentContainer:
  name: "Scoring Engine"
elements:
  - type: "component"
    name: "API Handler"
    technology: "Go, gRPC"
    description: "Inbound validation, correlation ID injection, and PAN data stripping for scoring requests."
  - type: "component"
    name: "Rule Evaluator"
    technology: "Go, In-Memory Bytecodes"
    description: "Executes in-memory deterministic fraud rules."
  - type: "component"
    name: "Model Runner"
    technology: "Go, ONNX Runtime, AWS KMS"
    description: "Evaluates lightweight probabilistic models with cryptographically signed artifact verification."
  - type: "component"
    name: "Audit Logger"
    technology: "Go Channels, AWS SDK for Go"
    description: "Asynchronously batches and sends tamper-evident JSON audit payloads."
  - type: "component"
    name: "Infrastructure Services"
    technology: "AWS ECS Fargate, Graviton2, Amazon SQS, AWS Firehose, Amazon S3"
    description: "Container orchestration, queueing, and immutable storage services."
relationships:
  - source: "API Gateway"
    destination: "API Handler"
    description: "Communicates scoring requests securely using gRPC with mTLS."
  - source: "Model Runner"
    destination: "AWS KMS"
    description: "Verifies cryptographic signatures of model artifacts retrieved from S3 prior to execution."
  - source: "Audit Logger"
    destination: "AWS SQS"
    description: "Asynchronously dispatches audit payloads using the AWS SDK for Go."
  - source: "AWS SQS"
    destination: "AWS Firehose"
    description: "Transports audit payloads for archiving."
  - source: "AWS Firehose"
    destination: "Amazon S3"
    description: "Archives immutable audit logs with S3 Object Lock compliance mode."