level: component
scope: "Component diagram for the Case Management container"
parentContainer:
  name: "Case Management"
elements:
  - type: "component"
    name: "Analyst SPA"
    technology: "React hosted in S3 and served via Amazon CloudFront"
    description: "Lightweight frontend SPA for rapid analyst workflows."
  - type: "component"
    name: "API Router & Auth Component"
    technology: "Express.js"
    description: "Manages cases, submits overrides, and injects secrets at startup."
  - type: "component"
    name: "Case Workflow Engine with Prioritization Queue"
    technology: "Node.js"
    description: "Processes state transitions and prioritizes queues."
  - type: "component"
    name: "Audit Logger Component with AWS KMS integration"
    technology: "Node.js"
    description: "Triggers audit events for analyst actions and generates cryptographic signatures."
relationships:
  - source: "Analyst SPA"
    destination: "API Router & Auth Component"
    description: "Manages cases and submits overrides [HTTPS/REST with OAuth2/OIDC JWT]"
  - source: "API Router & Auth Component"
    destination: "Case Workflow Engine with Prioritization Queue"
    description: "Processes state transitions and prioritizes queues [In-memory function calls]"
  - source: "Case Workflow Engine with Prioritization Queue"
    destination: "Audit Logger Component with AWS KMS integration"
    description: "Triggers audit events for analyst actions [In-memory function calls]"