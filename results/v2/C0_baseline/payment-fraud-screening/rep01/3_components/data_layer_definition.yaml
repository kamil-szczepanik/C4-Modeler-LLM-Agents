level: component
scope: "Component diagram for the Data Layer container"
parentContainer:
  name: "Data Layer"
elements:
  - type: "component"
    name: "Transactional Store"
    technology: "Amazon Aurora Serverless v2 PostgreSQL"
    description: "Manages ACID-compliant relational data, analyst cases, and reviews."
  - type: "component"
    name: "Feature Store"
    technology: "Amazon ElastiCache Serverless (Redis)"
    description: "Provides sub-5ms real-time velocity features for the scoring engine."
  - type: "component"
    name: "Audit Ingestion Queue"
    technology: "Amazon SQS with Dead Letter Queue (DLQ)"
    description: "Decouples synchronous scoring from database writes for decision audit payloads."
  - type: "component"
    name: "Compliance Storage"
    technology: "Amazon S3 Object Lock"
    description: "Streams audit logs for tamper-evident 7-year retention."
relationships:
  - source: "Scoring Engine"
    destination: "Feature Store"
    description: "Reads velocity features [RESP, <5ms]"
  - source: "Scoring Engine"
    destination: "Audit Ingestion Queue"
    description: "Enqueues decision audit payloads [AWS SDK, HTTP/S]"
  - source: "Case Management"
    destination: "Transactional Store"
    description: "Reads and writes analyst cases and reviews [PostgreSQL Wire Protocol, TLS 1.3]"
  - source: "Transactional Store"
    destination: "Compliance Storage"
    description: "Streams audit logs for tamper-evident 7-year retention [HTTPS]"