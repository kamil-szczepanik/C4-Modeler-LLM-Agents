# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Observability container"
parentContainer:
  name: "Observability"
elements:
  - type: "component"
    name: "AWS X-Ray"
    technology: "AWS X-Ray SDK"
    description: "Delivers distributed tracing and telemetry data for system operations."
  - type: "component"
    name: "Amazon CloudWatch"
    technology: "CloudWatch Agent"
    description: "Collects infrastructure metrics and logs, powering the Fraud Operations View."
  - type: "component"
    name: "Amazon SNS"
    technology: "AWS SNS"
    description: "Sends notifications and alerts regarding system status and security events."
  - type: "component"
    name: "S3 Object Lock"
    technology: "AWS S3 API / WORM Storage"
    description: "Exports and securely stores tamper-evident audit logs for 7-year retention."
relationships:
  - source: "AWS X-Ray"
    destination: "Amazon CloudWatch"
    description: "Sends traces and sanitized telemetry"
  - source: "Amazon CloudWatch"
    destination: "Amazon SNS"
    description: "Triggers alerts based on metrics and logs"
  - source: "Amazon CloudWatch"
    destination: "S3 Object Lock"
    description: "Exports audit logs for tamper-evident 7-year storage"