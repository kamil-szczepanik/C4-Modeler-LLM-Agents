level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Evaluates card-not-present payment authorizations for fraud at 3,000 TPS while supporting analyst reviews, ensuring strict PCI-DSS Level 1 compliance and 7-year tamper-evident auditability within a €25k monthly AWS budget."
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Human persona managing suspicious payments and reviewing flagged cases."
  - type: "externalSystem"
    name: "Merchant / Payment Gateway"
    description: "External system submitting payment authorizations."
  - type: "externalSystem"
    name: "AWS KMS / S3 Object Lock"
    description: "Infrastructure providing WORM storage and encryption."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system managing OIDC/SAML authentication."
relationships:
  - source: "Merchant / Payment Gateway"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Submits auth requests"
    technology: "gRPC over TLS 1.3 (<50ms P99)"
  - source: "Fraud Analyst"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Reviews flagged cases"
    technology: "HTTPS/TLS with OIDC/SAML MFA"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "AWS KMS / S3 Object Lock"
    description: "Persists tamper-evident decisions"
    technology: "AWS SDK and IAM via AWS KMS"