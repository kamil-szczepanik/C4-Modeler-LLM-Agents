level: component
scope: "Component diagram for the Messaging Bus container"
parentContainer:
  name: "Messaging Bus"
elements:
  - type: "component"
    name: "SQS Standard Queue"
    technology: "Amazon SQS Standard"
    description: "Handles high-throughput, at-least-once delivery of scoring decisions and telemetry events."
  - type: "component"
    name: "SQS FIFO Queue"
    technology: "Amazon SQS FIFO"
    description: "Ensures guaranteed ordering for audit and analyst override events."
  - type: "component"
    name: "Dead-Letter Queues"
    technology: "Amazon SQS DLQ"
    description: "Captures and isolates failed message processing attempts for error analysis."
relationships:
  - source: "SQS Standard Queue"
    destination: "SQS FIFO Queue"
    description: "Routes ordered processing events"
  - source: "SQS FIFO Queue"
    destination: "Dead-Letter Queues"
    description: "Forwards unprocessable messages"