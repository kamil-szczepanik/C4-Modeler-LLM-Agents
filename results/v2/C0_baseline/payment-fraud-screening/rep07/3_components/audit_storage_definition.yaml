level: component
scope: "Component diagram for the Audit Storage container"
parentContainer:
  name: "Audit Storage"
elements:
  - type: "component"
    name: "Audit Writer"
    technology: "Go, AWS Lambda"
    description: "Persists immutable decision records to Amazon S3."
  - type: "component"
    name: "Audit Query API"
    technology: "Go, AWS Lambda"
    description: "Queries indexed decision metadata from Amazon DynamoDB."
  - type: "component"
    name: "Report Generator"
    technology: "Go, AWS Lambda"
    description: "Generates signed export packages and stages them in Amazon S3."
relationships:
  - source: "Audit Writer"
    destination: "Amazon S3"
    description: "Persists immutable decision records [HTTPS / AWS SDK]"
  - source: "Audit Query API"
    destination: "Amazon DynamoDB"
    description: "Queries indexed decision metadata [HTTPS]"
  - source: "Report Generator"
    destination: "Amazon S3 (Staging)"
    description: "Generates signed export packages [HTTPS / AWS SDK]"