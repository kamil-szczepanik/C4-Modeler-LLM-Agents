level: component
scope: "Component diagram for the Real-Time Scoring Engine container"
parentContainer:
  name: "Real-Time Scoring Engine"
elements:
  - type: "component"
    name: "API Handler Component"
    technology: "Go net/http"
    description: "Handles incoming authorization requests and coordinates the scoring workflow."
  - type: "component"
    name: "Feature Aggregator Component"
    technology: "Go"
    description: "Fetches and aggregates user behavioral features for scoring."
  - type: "component"
    name: "In-Memory Scoring Engine Component"
    technology: "WASM models"
    description: "Executes fraud scoring using WebAssembly models and includes an Explainability Formatter."
  - type: "component"
    name: "Audit Publisher Component"
    technology: "Go"
    description: "Publishes tamper-evident logs and telemetry."
  - type: "component"
    name: "Circuit Breaker Fallback Controller"
    technology: "Go"
    description: "Provides fallback mechanisms and local circuit breaking for resilience."
relationships:
  - source: "API Handler Component"
    destination: "Feature Aggregator Component"
    description: "Requests behavioral features for incoming payloads"
  - source: "Feature Aggregator Component"
    destination: "Redis Cache"
    description: "Performs sub-millisecond feature lookups using Redis Protocol over TLS 1.3"
  - source: "API Handler Component"
    destination: "In-Memory Scoring Engine Component"
    description: "Passes aggregated features to evaluate fraud risk"
  - source: "In-Memory Scoring Engine Component"
    destination: "Audit Publisher Component"
    description: "Sends scoring decisions and logs for publishing"
  - source: "Audit Publisher Component"
    destination: "Messaging Bus"
    description: "Streams tamper-evident logs and telemetry via Amazon SQS / AMQP"
  - source: "Audit Publisher Component"
    destination: "Audit Storage"
    description: "Writes cryptographically signed, encrypted decision logs using AWS SDK / HTTPS"
  - source: "API Handler Component"
    destination: "Circuit Breaker Fallback Controller"
    description: "Monitors availability and triggers fallbacks when needed"