level: component
scope: "Component diagram for the Redis Cache container"
parentContainer:
  name: "Redis Cache"
elements:
  - type: "component"
    name: "In-Memory Data Store"
    technology: "Redis Engine (Redis 7.x, Graviton2 cache.m6g.large)"
    description: "Performs sub-millisecond feature lookups using RESP over TCP with mTLS and TLS 1.3, enforcing least-privilege access via native ACLs."
  - type: "component"
    name: "Persistence/Backup Worker"
    technology: "AWS ElastiCache Managed Snapshot & AWS KMS"
    description: "Handles daily automated backups with a 7-day retention period and at-rest encryption for cached cryptographic tokens and feature sets."
relationships:
  - source: "In-Memory Data Store"
    destination: "Persistence/Backup Worker"
    description: "Stores daily automated backups with a 7-day retention period to Amazon S3"