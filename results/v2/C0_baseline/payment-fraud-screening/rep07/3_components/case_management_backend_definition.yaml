level: component
scope: "Component diagram for the Case Management Backend container"
parentContainer:
  name: "Case Management Backend"
elements:
  - type: "component"
    name: "API Router / Controller"
    technology: "TypeScript, Express/Fastify"
    description: "Handles incoming HTTP requests, invokes business logic, and sanitizes payloads."
  - type: "component"
    name: "Case Workflow Service"
    technology: "TypeScript"
    description: "Executes core case management business logic and workflow state transitions."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "TypeScript"
    description: "Triggers immutable logging and writes cryptographically signed audit logs."
  - type: "component"
    name: "Messaging Consumer/Publisher"
    technology: "TypeScript"
    description: "Consumes and publishes messages to the messaging bus."
  - type: "component"
    name: "Masking & Sanitization Middleware"
    technology: "TypeScript"
    description: "Sanitizes payloads to enforce security and compliance."
  - type: "component"
    name: "PostgreSQL Database"
    technology: "Amazon RDS PostgreSQL"
    description: "Persists transactional case data securely with encryption at rest."
  - type: "component"
    name: "Audit Storage"
    technology: "Amazon S3 with Object Lock"
    description: "Stores tamper-evident, cryptographically signed audit logs for 7-year regulatory compliance."
  - type: "component"
    name: "Messaging Bus"
    technology: "Amazon SQS / EventBridge"
    description: "Handles asynchronous messaging and event distribution."
relationships:
  - source: "API Router / Controller"
    destination: "Case Workflow Service"
    description: "Invokes business logic"
  - source: "API Router / Controller"
    destination: "Masking & Sanitization Middleware"
    description: "Sanitizes payloads"
  - source: "Case Workflow Service"
    destination: "Audit & Compliance Logger"
    description: "Triggers immutable logging"
  - source: "Case Workflow Service"
    destination: "PostgreSQL Database"
    description: "Persists case state"
  - source: "Audit & Compliance Logger"
    destination: "Audit Storage"
    description: "Writes cryptographically signed audit logs"