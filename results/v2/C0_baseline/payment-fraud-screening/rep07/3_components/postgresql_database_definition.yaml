level: component
scope: "Component diagram for the PostgreSQL Database container"
parentContainer:
  name: "PostgreSQL Database"
elements:
  - type: "component"
    name: "Case Repository Component"
    technology: "PostgreSQL / Primary RDS Instance"
    description: "Manages CRUD operations and state transitions for investigator reviews."
  - type: "component"
    name: "Audit & Compliance Log Component"
    technology: "PostgreSQL Partitioned Tables / pgaudit"
    description: "Handles append-only decision logs and analyst override histories using partitioned tables."
  - type: "component"
    name: "Database Security Manager"
    technology: "AWS KMS / PostgreSQL Row-Level Security"
    description: "Enforces AWS KMS-backed encryption and PostgreSQL Row-Level Security (RLS)."
  - type: "component"
    name: "Primary RDS Instance"
    technology: "Amazon RDS PostgreSQL"
    description: "Handles transactional case state updates."
  - type: "component"
    name: "Read Replica"
    technology: "Amazon RDS PostgreSQL Read Replica"
    description: "Dedicated to analyst reporting, audit queries, and read-heavy analytics."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Connection pooler hosted alongside the Case Management Backend."
relationships:
  - source: "Case Repository Component"
    destination: "Primary RDS Instance"
    description: "Executes transactional writes and state updates via [PostgreSQL Protocol / TLS 1.3]."
  - source: "Audit & Compliance Log Component"
    destination: "Read Replica"
    description: "Routes read-heavy analytics and case history queries via [PostgreSQL Protocol / TLS 1.3]."
  - source: "Primary RDS Instance"
    destination: "Audit Storage"
    description: "Streams audit logs using pgaudit via [AWS API / HTTPS]."