level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Evaluates card-not-present payment authorizations for fraud, providing sub-50ms decisions and case management for analysts while ensuring compliance, auditability, and high availability."
elements:
  - type: "person"
    name: "Payers"
    description: "End users initiating card-not-present payments."
  - type: "person"
    name: "Fraud Analysts"
    description: "Professionals managing and reviewing flagged fraud cases."
  - type: "person"
    name: "Risk Managers/Quants"
    description: "Personnel overseeing risk strategies and fraud rules."
  - type: "externalSystem"
    name: "Payment Gateway/Acquirer"
    description: "External system submitting payment authorizations for screening."
  - type: "externalSystem"
    name: "Core Banking/Card Network Systems"
    description: "External financial systems interacting with transaction data."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system providing authentication and RBAC."
  - type: "container"
    name: "AWS API Gateway / ALB"
    technology: "AWS API Gateway / ALB"
    description: "Ingress layer handling incoming payment and API traffic."
  - type: "container"
    name: "Real-Time Scoring Engine"
    technology: "Go or Rust, Amazon EC2"
    description: "Containerized microservice performing sub-50ms fraud scoring and feature lookups."
  - type: "container"
    name: "Case Management Backend"
    technology: "Node.js, TypeScript, AWS ECS Fargate"
    description: "Manages transactional case data and analyst workflows."
  - type: "container"
    name: "Case Management UI"
    technology: "React, Amazon S3, Amazon CloudFront"
    description: "Single-Page Application providing the user interface for fraud analysts."
  - type: "container"
    name: "Redis Cache"
    technology: "Amazon ElastiCache (Redis)"
    description: "Provides sub-millisecond feature lookups for the scoring engine."
  - type: "container"
    name: "PostgreSQL Database"
    technology: "Amazon RDS (PostgreSQL)"
    description: "Stores transactional case data and analyst overrides with row-level encryption."
  - type: "container"
    name: "Audit Storage"
    technology: "Amazon S3 with KMS and Object Lock"
    description: "Stores scoring decisions, model versions, explanations, and logs for 7-year audit retention."
  - type: "container"
    name: "Messaging Bus"
    technology: "Amazon SQS / EventBridge"
    description: "Streams scoring decisions and audit events asynchronously."
relationships:
  - source: "Payers"
    destination: "Payment Gateway/Acquirer"
    description: "Initiates transactions evaluated for fraud"
    technology: "HTTPS"
  - source: "Payment Gateway/Acquirer"
    destination: "AWS API Gateway / ALB"
    description: "Forwards authorization requests"
    technology: "HTTPS/gRPC"
  - source: "AWS API Gateway / ALB"
    destination: "Real-Time Scoring Engine"
    description: "Communicates scoring requests using mTLS with local circuit breaker"
    technology: "mTLS"
  - source: "Real-Time Scoring Engine"
    destination: "Redis Cache"
    description: "Performs sub-millisecond feature lookups"
    technology: "Redis Protocol"
  - source: "Fraud Analysts"
    destination: "Case Management UI"
    description: "Accesses case management interface"
    technology: "HTTPS"
  - source: "Risk Managers/Quants"
    destination: "Case Management UI"
    description: "Monitors risk rules and metrics"
    technology: "HTTPS"
  - source: "Case Management UI"
    destination: "Case Management Backend"
    description: "Communicates API requests"
    technology: "HTTPS/OAuth2/OIDC"
  - source: "Case Management Backend"
    destination: "PostgreSQL Database"
    description: "Reads and writes transactional case data"
    technology: "PostgreSQL Protocol"
  - source: "Real-Time Scoring Engine"
    destination: "Messaging Bus"
    description: "Streams scoring decisions, model versions, and explanations"
    technology: "Amazon SQS / EventBridge"
  - source: "Case Management Backend"
    destination: "Messaging Bus"
    description: "Streams analyst overrides and case updates"
    technology: "Amazon SQS / EventBridge"
  - source: "Messaging Bus"
    destination: "Audit Storage"
    description: "Persists immutable audit logs and decisions"
    technology: "AWS KMS / Amazon S3 Object Lock"
  - source: "Fraud Analysts"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OAuth2/OIDC"