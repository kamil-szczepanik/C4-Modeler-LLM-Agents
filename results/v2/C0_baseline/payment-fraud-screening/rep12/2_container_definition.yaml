level: container
scope: "Container diagram for Real-Time Payment Fraud Screening Engine"
system:
  name: "Real-Time Payment Fraud Screening Engine"
elements:
  - type: "person"
    name: "Fraud Analysts & Risk Managers"
    description: "Users who perform case management review and analyze fraud alerts."
  - type: "externalSystem"
    name: "Amazon S3 with Object Lock"
    description: "Storage service used for cost-effective, 7-year tamper-evident audit log storage."
  - type: "externalSystem"
    name: "AWS KMS"
    description: "AWS Key Management Service for data encryption and envelope encryption."
  - type: "externalSystem"
    name: "AWS Secrets Manager"
    description: "Service used to securely store and retrieve runtime credentials."
  - type: "container"
    name: "Amazon API Gateway"
    description: "Provides ingress and WAF protection for incoming traffic."
    technology: "Amazon API Gateway"
  - type: "container"
    name: "Real-Time Scoring Engine"
    description: "Processes card-not-present transactions for real-time fraud scoring."
    technology: "Go microservice on AWS ECS EC2"
  - type: "container"
    name: "Case Management System Frontend"
    description: "Provides the user interface for case management review capabilities."
    technology: "React SPA on S3 + CloudFront"
  - type: "container"
    name: "Case Management System API"
    description: "Provides backend APIs for case management operations."
    technology: "Node.js / Express API on ECS"
  - type: "container"
    name: "Compliance Reporting Worker"
    description: "Executes scheduled compliance reporting tasks."
    technology: "AWS Lambda"
  - type: "container"
    name: "Amazon DynamoDB"
    description: "Stores feature data and case information for low-latency lookups."
    technology: "Amazon DynamoDB"
  - type: "container"
    name: "Amazon SQS / Kinesis"
    description: "Handles asynchronous event publishing and message buffering."
    technology: "Amazon SQS / Amazon Kinesis"
  - type: "container"
    name: "Amazon CloudWatch"
    description: "Provides security monitoring, logging, and observability."
    technology: "Amazon CloudWatch"
relationships:
  - source: "Fraud Analysts & Risk Managers"
    destination: "Amazon API Gateway"
    description: "Accesses case management and review capabilities"
    technology: "HTTPS / TLS 1.3"
  - source: "Amazon API Gateway"
    destination: "Real-Time Scoring Engine"
    description: "Forwards payment transactions for fraud scoring"
    technology: "Internal gRPC over mTLS"
  - source: "Real-Time Scoring Engine"
    destination: "Amazon DynamoDB"
    description: "Performs feature lookups and case data retrievals"
    technology: "AWS SDK over TLS 1.3"
  - source: "Real-Time Scoring Engine"
    destination: "Amazon SQS / Kinesis"
    description: "Publishes asynchronous events"
    technology: "AWS SDK over TLS 1.3"
  - source: "Compliance Reporting Worker"
    destination: "Amazon S3 with Object Lock"
    description: "Stores tamper-evident audit logs"
    technology: "HTTPS via AWS SDK"
  - source: "Real-Time Scoring Engine"
    destination: "AWS KMS"
    description: "Requests data encryption keys"
    technology: "AWS SDK"
  - source: "Real-Time Scoring Engine"
    destination: "AWS Secrets Manager"
    description: "Retrieves runtime credentials"
    technology: "AWS SDK"
  - source: "Real-Time Scoring Engine"
    destination: "Amazon CloudWatch"
    description: "Sends logs and metrics"
    technology: "AWS SDK"