level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening Engine"
system:
  name: "Real-Time Payment Fraud Screening Engine"
  description: "A real-time payment fraud screening engine that evaluates payment authorizations and provides case management for fraud analysts to prevent fraudulent transactions while maintaining strict latency and compliance standards."
elements:
  - type: "person"
    name: "Fraud Analysts and Risk Managers"
    description: "Users who perform case management and review fraud alerts."
  - type: "externalSystem"
    name: "Payment Processor Systems / Acquirer"
    description: "External systems that send payment authorizations for fraud evaluation."
  - type: "externalSystem"
    name: "AWS KMS"
    description: "AWS Key Management Service for data encryption and envelope encryption."
  - type: "externalSystem"
    name: "Amazon S3 with Object Lock"
    description: "Storage service used for cost-effective, 7-year tamper-evident audit log storage."
relationships:
  - source: "Payment Processor Systems / Acquirer"
    destination: "Real-Time Payment Fraud Screening Engine"
    description: "Sends payment authorizations for fraud screening"
    technology: "gRPC over mTLS"
  - source: "Fraud Analysts and Risk Managers"
    destination: "Real-Time Payment Fraud Screening Engine"
    description: "Accesses case management and reviews alerts"
    technology: "HTTPS over TLS 1.3"
  - source: "Real-Time Payment Fraud Screening Engine"
    destination: "AWS KMS"
    description: "Requests data encryption keys for data-at-rest protection"
    technology: "AWS SDK"
  - source: "Real-Time Payment Fraud Screening Engine"
    destination: "Amazon S3 with Object Lock"
    description: "Stores tamper-evident audit logs"
    technology: "AWS SDK"