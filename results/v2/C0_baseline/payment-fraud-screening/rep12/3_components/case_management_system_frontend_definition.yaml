level: component
scope: "Component diagram for the Case Management System Frontend container"
parentContainer:
  name: "Case Management System Frontend"
elements:
  - type: "component"
    name: "Case Queue Component"
    technology: "React Component"
    description: "Displays and manages the queue of flagged cases for fraud analysts and risk managers."
  - type: "component"
    name: "Transaction Details Component"
    technology: "React Component"
    description: "Renders transaction details with strict data masking to ensure PCI-DSS compliance."
  - type: "component"
    name: "Rule Management Component"
    technology: "React Component"
    description: "Enables zero-downtime rule updates for risk management."
  - type: "component"
    name: "Audit Log Viewer Component"
    technology: "React Component"
    description: "Provides visibility into system and user audit logs."
relationships:
  - source: "Case Queue Component"
    destination: "Case Management System API"
    description: "Fetches and updates case data using HTTPS / JSON REST API via React Query"
  - source: "Transaction Details Component"
    destination: "Case Management System API"
    description: "Retrieves transaction details using HTTPS / JSON REST API via React Query"
  - source: "Rule Management Component"
    destination: "Case Management System API"
    description: "Submits rule updates using HTTPS / JSON REST API via React Query"
  - source: "Audit Log Viewer Component"
    destination: "Case Management System API"
    description: "Retrieves audit logs using HTTPS / JSON REST API via React Query"