level: component
scope: "Component diagram for the Amazon CloudWatch container"
parentContainer:
  name: "Amazon CloudWatch"
elements:
  - type: "component"
    name: "Log Groups"
    technology: "AWS CloudWatch Logs"
    description: "Collects and stores redacted logs from the scoring engine and case management API."
  - type: "component"
    name: "Metric Filters"
    technology: "CloudWatch Metric Filters"
    description: "Extracts EMF metrics from log streams for monitoring."
  - type: "component"
    name: "Alarms"
    technology: "CloudWatch Alarms"
    description: "Evaluates operational and business thresholds to trigger alerts."
  - type: "component"
    name: "Logs Insights"
    technology: "CloudWatch Logs Insights"
    description: "Provides query capabilities for analyzing log data."
  - type: "component"
    name: "Synthetics"
    technology: "CloudWatch Synthetics"
    description: "Monitors availability and performance via canary scripts."
relationships:
  - source: "Log Groups"
    destination: "Metric Filters"
    description: "Feeds log data for metric extraction"
  - source: "Metric Filters"
    destination: "Alarms"
    description: "Provides metric data for threshold evaluation"