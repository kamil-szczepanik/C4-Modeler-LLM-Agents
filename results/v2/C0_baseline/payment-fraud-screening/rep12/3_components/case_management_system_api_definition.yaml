level: component
scope: "Component diagram for the Case Management System API container"
parentContainer:
  name: "Case Management System API"
elements:
  - type: "component"
    name: "Case Controller / Router"
    technology: "Node.js, Express, TypeScript"
    description: "Express-based routing layer handling HTTP requests and JWT authentication."
  - type: "component"
    name: "Masking & Security Interceptor"
    technology: "Node.js Middleware"
    description: "Middleware layer stripping PANs and validating RBAC scopes."
  - type: "component"
    name: "Case Service"
    technology: "TypeScript, Node.js"
    description: "Core domain logic managing case states, analyst assignments, and aggregated DTO payloads."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "Node.js, AWS SDK"
    description: "Component dispatching batched audit payloads asynchronously."
  - type: "component"
    name: "Data Access Layer"
    technology: "TypeScript, AWS SDK"
    description: "Interfacing with Amazon DynamoDB for persistence using AWS KMS."
  - type: "component"
    name: "Amazon SQS"
    technology: "AWS SQS"
    description: "Decouples audit logging and guarantees tamper-evident delivery."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Low-latency scalable persistence of case data."
relationships:
  - source: "Case Controller / Router"
    destination: "Case Service"
    description: "Invokes via internal TypeScript interfaces."
  - source: "Audit & Compliance Logger"
    destination: "Amazon SQS"
    description: "Dispatches payloads asynchronously using AWS SDK."
  - source: "Data Access Layer"
    destination: "Amazon DynamoDB"
    description: "Reads and writes encrypted data using AWS KMS."