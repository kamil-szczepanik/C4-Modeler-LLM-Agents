level: component
scope: "Component diagram for the Real-Time Scoring Engine container"
parentContainer:
  name: "Real-Time Scoring Engine"
elements:
  - type: "component"
    name: "API Handler Component"
    technology: "Go (Gin)"
    description: "Receives forwarded payment transactions from Amazon API Gateway via internal gRPC over mTLS."
  - type: "component"
    name: "Feature Evaluator Component"
    technology: "Go Goroutines"
    description: "Performs feature lookups by querying Amazon DynamoDB."
  - type: "component"
    name: "Rules Engine Core"
    technology: "Go / WebAssembly (Wasm)"
    description: "Evaluates business rules and scoring models with secure sandboxing and hot-reloading."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Go SDK"
    description: "Publishes signed decision payloads to Amazon SQS / Amazon Kinesis."
  - type: "component"
    name: "Shadow Evaluator Component"
    technology: "Go Goroutines"
    description: "Runs shadow evaluations concurrently for model validation and testing."
  - type: "component"
    name: "Model Registry Loader"
    technology: "Go SDK"
    description: "Polls Amazon S3 for WebAssembly (Wasm) models."
relationships:
  - source: "API Handler Component"
    destination: "Rules Engine Core"
    description: "Passes incoming transactions for real-time scoring"
  - source: "Feature Evaluator Component"
    destination: "Amazon DynamoDB"
    description: "Performs feature lookups [AWS SDK over TLS 1.3]"
  - source: "Audit Logger Component"
    destination: "Amazon SQS / Amazon Kinesis"
    description: "Publishes signed decision payloads [AWS SDK over TLS 1.3]"
  - source: "Model Registry Loader"
    destination: "Amazon S3"
    description: "Polls for Wasm models [AWS SDK over TLS 1.3]"
  - source: "Real-Time Scoring Engine"
    destination: "AWS KMS & Secrets Manager"
    description: "Requests keys and credentials [AWS SDK over TLS 1.3]"
  - source: "Real-Time Scoring Engine"
    destination: "Amazon CloudWatch"
    description: "Sends metrics and logs [AWS SDK over TLS 1.3]"