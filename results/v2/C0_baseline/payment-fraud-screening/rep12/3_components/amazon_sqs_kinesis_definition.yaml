level: component
scope: "Component diagram for the Amazon SQS / Kinesis container"
parentContainer:
  name: "Amazon SQS / Kinesis"
elements:
  - type: "component"
    name: "Standard Queues"
    technology: "Amazon SQS Standard"
    description: "Handles high-throughput asynchronous case and audit events from the Real-Time Scoring Engine."
  - type: "component"
    name: "FIFO Queues"
    technology: "Amazon SQS FIFO"
    description: "Ensures strict audit sequencing for compliance and reporting workflows."
  - type: "component"
    name: "Dead-Letter Queues"
    technology: "Amazon SQS DLQ"
    description: "Captures failed messages for robust fail-open resilience and troubleshooting."
relationships:
  - source: "Real-Time Scoring Engine"
    destination: "Standard Queues"
    description: "Publishes asynchronous case and audit events [AWS SDK over TLS 1.3]"
  - source: "Standard Queues"
    destination: "FIFO Queues"
    description: "Routes ordered events for compliance tracking"
  - source: "FIFO Queues"
    destination: "Compliance Reporting Worker"
    description: "Invokes processing [AWS Lambda event source mapping]"
  - source: "Standard Queues"
    destination: "Dead-Letter Queues"
    description: "Offloads unprocessed or failed messages"