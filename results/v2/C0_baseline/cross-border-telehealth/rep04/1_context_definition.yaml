level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "A cross-border telehealth platform providing video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US."
elements:
  - type: "person"
    name: "Patients"
    description: "Patients in the EU and US seeking video consultations, e-prescriptions, and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals providing consultations and prescriptions."
  - type: "person"
    name: "Compliance & Audit Officers"
    description: "Officers responsible for reviewing audit logs and regulatory compliance."
  - type: "externalSystem"
    name: "Global Identity Provider (IdP)"
    description: "Provides authentication and MFA services via OIDC/OAuth 2.0."
  - type: "externalSystem"
    name: "Third-Party National E-Prescription Gateways (EU)"
    description: "External national gateways for handling e-prescriptions in the EU."
  - type: "externalSystem"
    name: "Pharmacy Networks (US)"
    description: "External pharmacy networks for processing prescriptions in the US."
  - type: "externalSystem"
    name: "Video Relay/Codec Service"
    description: "Service supporting low-bandwidth video consultations and WebRTC."
  - type: "externalSystem"
    name: "Clinician Accreditation Validator"
    description: "Service used to validate the credentials and accreditation of clinicians."
relationships:
  - source: "Patients"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses video consultations and AI symptom checker via web or mobile."
    technology: "HTTPS / WebRTC"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Conducts consultations and manages patient prescriptions."
    technology: "HTTPS / WebRTC"
  - source: "Compliance & Audit Officers"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses restricted regional systems for audit log review."
    technology: "Restricted HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Global Identity Provider (IdP)"
    description: "Authenticates users via OIDC/OAuth 2.0 with MFA."
    technology: "OIDC/OAuth 2.0 over HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Third-Party National E-Prescription Gateways (EU)"
    description: "Transmits e-prescriptions for EU patients."
    technology: "mTLS REST / HL7 FHIR"
  - source: "Cross-Border Telehealth Platform"
    destination: "Pharmacy Networks (US)"
    description: "Transmits prescriptions for US patients."
    technology: "mTLS REST / HL7 FHIR"