level: component
scope: "Component diagram for the Video Session Manager container"
parentContainer:
  name: "Video Session Manager"
elements:
  - type: "component"
    name: "SFU Media Router"
    technology: "Mediasoup / C++ & Node.js"
    description: "High-performance WebRTC packet forwarding with simulcast and adaptive bitrate support."
  - type: "component"
    name: "Session Signaling Controller"
    technology: "Go"
    description: "Low-latency signaling control and session management."
  - type: "component"
    name: "Session Audit & Metadata Logger"
    technology: "Go"
    description: "Audit logging and telemetry persistence for compliance and metadata."
  - type: "component"
    name: "Session State Cache"
    technology: "Redis / GCP Memorystore"
    description: "In-memory ephemeral session caching with automated 60-second TTL."
  - type: "component"
    name: "Web/Mobile Frontend App"
    technology: "React / Flutter"
    description: "Frontend interface handling user WebRTC streaming and WebSocket signaling."
relationships:
  - source: "Web/Mobile Frontend App"
    destination: "Session Signaling Controller"
    description: "WebSocket signaling and authentication [WSS over TLS 1.3, JSON]"
  - source: "Web/Mobile Frontend App"
    destination: "SFU Media Router"
    description: "Video/audio streaming and adaptive bitrate controls [WebRTC, UDP/SRTP, DTLS-SRTP]"
  - source: "Session Signaling Controller"
    destination: "Session State Cache"
    description: "Ephemeral session and reconnection state management [TCP, Redis Protocol]"
  - source: "SFU Media Router"
    destination: "Session State Cache"
    description: "Transport state verification for ICE restarts [TCP, Redis Protocol]"
  - source: "Session Audit & Metadata Logger"
    destination: "Regional GCP Databases"
    description: "Telemetry and metadata persistence [TCP, SQL]"