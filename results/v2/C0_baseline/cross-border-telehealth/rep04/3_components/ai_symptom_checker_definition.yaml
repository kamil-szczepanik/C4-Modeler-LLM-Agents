level: component
scope: "Component diagram for the AI Symptom Checker container"
parentContainer:
  name: "AI Symptom Checker"
elements:
  - type: "component"
    name: "Triage API Controller"
    technology: "Python / FastAPI"
    description: "Requests AI symptom analysis, manages routing, and coordinates inference, fallback, and auditing."
  - type: "component"
    name: "Inference Engine"
    technology: "Python / PyTorch or ONNX Runtime"
    description: "Executes the clinical model for symptom analysis."
  - type: "component"
    name: "Clinical Fallback Engine"
    technology: "Python / Rule-based Logic"
    description: "Invokes fallback procedures on model failure or timeout."
  - type: "component"
    name: "Audit & Cryptographic Signer"
    technology: "Python / GCP KMS / Cloud HSM Client"
    description: "Offloads and cryptographically signs event logs using GCP Cloud HSM / KMS."
relationships:
  - source: "Triage API Controller"
    destination: "Inference Engine"
    description: "Executes clinical model [In-memory / gRPC]"
  - source: "Triage API Controller"
    destination: "Clinical Fallback Engine"
    description: "Invokes fallback on model failure/timeout [In-memory]"
  - source: "Triage API Controller"
    destination: "Audit & Cryptographic Signer"
    description: "Offloads event logs [Async Message Queue]"