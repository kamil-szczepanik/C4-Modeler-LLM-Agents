level: component
scope: "Component diagram for the Web/Mobile Frontend App container"
parentContainer:
  name: "Web/Mobile Frontend App"
elements:
  - type: "component"
    name: "Routing & Shell Component"
    technology: "React / Flutter"
    description: "Builds a responsive Progressive Web App and mobile interface supporting low-bandwidth conditions."
  - type: "component"
    name: "Consent & Privacy Manager Component"
    technology: "React / Flutter"
    description: "Manages privacy preferences and ensures strict GDPR and HIPAA compliance."
  - type: "component"
    name: "AI Symptom Checker UI Component"
    technology: "React / Flutter"
    description: "Provides the user interface for the AI symptom checker."
  - type: "component"
    name: "Video Streaming Interface Component"
    technology: "WebRTC SDKs"
    description: "Enables video streaming with adaptive bitrate controls for connections under 300 kbit/s."
  - type: "component"
    name: "API Client & Local Storage Adapter"
    technology: "AES-GCM / Secure Hardware"
    description: "Encrypts cached patient health data bound to device Keychain/Keystore and handles communication."
relationships:
  - source: "Routing & Shell Component"
    destination: "Consent & Privacy Manager Component"
    description: "Manages UI state [In-Memory]"
  - source: "Consent & Privacy Manager Component"
    destination: "API Client & Local Storage Adapter"
    description: "Syncs consent states [HTTPS/REST]"
  - source: "AI Symptom Checker UI Component"
    destination: "API Client & Local Storage Adapter"
    description: "Sends symptom payloads [HTTPS/gRPC]"
  - source: "Video Streaming Interface Component"
    destination: "Video Session Manager"
    description: "Establishes media streams [WebRTC]"
  - source: "API Client & Local Storage Adapter"
    destination: "API Gateway / Core Backend"
    description: "Sends API requests [HTTPS/gRPC]"