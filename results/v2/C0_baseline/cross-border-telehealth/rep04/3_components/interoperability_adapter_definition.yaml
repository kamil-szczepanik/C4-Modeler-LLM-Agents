level: component
scope: "Component diagram for the Interoperability Adapter container"
parentContainer:
  name: "Interoperability Adapter"
elements:
  - type: "component"
    name: "Interoperability Adapter Container"
    technology: "Go"
    description: "Manages cross-border prescription routing and external gateway communication."
  - type: "component"
    name: "EU Gateway Plugin"
    technology: "Go"
    description: "Translates core payloads to national EU standards using Go."
  - type: "component"
    name: "US FHIR Translator"
    technology: "Go, HAPI FHIR Java"
    description: "Maps payloads to US HL7 FHIR resources using Go and HAPI FHIR Java."
  - type: "component"
    name: "Regional Routing Engine"
    technology: "Go"
    description: "Enforces data residency by directing traffic to regional endpoints."
  - type: "component"
    name: "Delivery Status Notifier"
    technology: "GCP Pub/Sub, Go"
    description: "Asynchronously pushes delivery acknowledgements via GCP Pub/Sub."
  - type: "component"
    name: "Audit Ledger & Receipt Signer"
    technology: "Google Cloud KMS, Go"
    description: "Signs payloads and receipts using Google Cloud KMS."
  - type: "component"
    name: "EU E-Prescription Gateways"
    technology: "REST, SOAP, HL7 FHIR over mTLS"
    description: "External EU gateway for transmitting prescriptions."
  - type: "component"
    name: "US Pharmacy Networks"
    technology: "REST, SOAP, HL7 FHIR over mTLS"
    description: "External US network for transmitting prescriptions."
  - type: "component"
    name: "API Gateway / Core Backend"
    technology: "Go / Cloud Run"
    description: "Triggers e-prescription routing via mTLS and Internal API."
relationships:
  - source: "API Gateway / Core Backend"
    destination: "Interoperability Adapter Container"
    description: "Triggers e-prescription routing via mTLS and Internal API."
  - source: "Regional Routing Engine"
    destination: "EU Gateway Plugin"
    description: "Delegates payload transformation via in-memory communication or gRPC."
  - source: "Regional Routing Engine"
    destination: "US FHIR Translator"
    description: "Delegates payload transformation via in-memory communication or gRPC."
  - source: "EU Gateway Plugin"
    destination: "Audit Ledger & Receipt Signer"
    description: "Requests cryptographic signatures via in-memory communication or gRPC."
  - source: "US FHIR Translator"
    destination: "Audit Ledger & Receipt Signer"
    description: "Requests cryptographic signatures via in-memory communication or gRPC."
  - source: "Delivery Status Notifier"
    destination: "API Gateway / Core Backend"
    description: "Publishes signed delivery receipts via GCP Pub/Sub."
  - source: "Interoperability Adapter Container"
    destination: "EU E-Prescription Gateways"
    description: "Transmits EU prescriptions using REST, SOAP, and HL7 FHIR over mTLS."
  - source: "Interoperability Adapter Container"
    destination: "US Pharmacy Networks"
    description: "Transmits US prescriptions using REST, SOAP, and HL7 FHIR over mTLS."