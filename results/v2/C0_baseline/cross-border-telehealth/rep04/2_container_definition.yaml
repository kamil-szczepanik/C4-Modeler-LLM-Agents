level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients (EU and US) seeking video consultations, e-prescriptions, and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals providing video consultations and managing patient prescriptions."
  - type: "externalSystem"
    name: "Global Identity Provider (IdP)"
    description: "External system providing authentication services via OIDC/OAuth 2.0."
  - type: "externalSystem"
    name: "EU E-Prescription Gateways"
    description: "External national gateways for handling e-prescriptions in the EU."
  - type: "externalSystem"
    name: "US Pharmacy Networks"
    description: "External pharmacy networks for processing prescriptions in the US."
  - type: "externalSystem"
    name: "Video Relay Service"
    description: "External service supporting video consultations."
  - type: "container"
    name: "Web/Mobile Frontend App"
    technology: "React / Flutter"
    description: "Frontend application accessed by patients and clinicians."
  - type: "container"
    name: "API Gateway / Core Backend"
    technology: "Go / Node.js"
    description: "Routes requests and handles core backend logic, securing regional data residency."
  - type: "container"
    name: "AI Symptom Checker"
    technology: "Python / FastAPI"
    description: "Provides AI-driven symptom checking with GCP Cloud HSM cryptographic output signing."
  - type: "container"
    name: "Interoperability Adapter"
    technology: "Plugin architecture, REST / SOAP, HL7 FHIR"
    description: "Interfaces with external EU E-Prescription Gateways and US Pharmacy Networks."
  - type: "container"
    name: "Video Session Manager"
    technology: "WebRTC SFU"
    description: "Manages real-time video sessions for consultations."
relationships:
  - source: "Patients"
    destination: "Web/Mobile Frontend App"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker."
    technology: "HTTPS"
  - source: "Licensed Clinicians"
    destination: "Web/Mobile Frontend App"
    description: "Conducts consultations and manages prescriptions."
    technology: "HTTPS"
  - source: "Web/Mobile Frontend App"
    destination: "API Gateway / Core Backend"
    description: "Sends API requests and calls core services."
    technology: "HTTPS / gRPC"
  - source: "Web/Mobile Frontend App"
    destination: "Video Session Manager"
    description: "Streams video consultations."
    technology: "WebRTC"
  - source: "API Gateway / Core Backend"
    destination: "AI Symptom Checker"
    description: "Requests AI symptom analysis."
    technology: "mTLS / Internal API"
  - source: "API Gateway / Core Backend"
    destination: "Interoperability Adapter"
    description: "Triggers e-prescription routing."
    technology: "mTLS / Internal API"
  - source: "Interoperability Adapter"
    destination: "EU E-Prescription Gateways"
    description: "Transmits EU e-prescriptions."
    technology: "REST / SOAP / HL7 FHIR"
  - source: "Interoperability Adapter"
    destination: "US Pharmacy Networks"
    description: "Transmits US prescriptions."
    technology: "REST / SOAP / HL7 FHIR"
  - source: "API Gateway / Core Backend"
    destination: "Global Identity Provider (IdP)"
    description: "Authenticates users."
    technology: "OAuth 2.0 / OIDC"
  - source: "Video Session Manager"
    destination: "Video Relay Service"
    description: "Relays video session data."
    technology: "WebRTC"