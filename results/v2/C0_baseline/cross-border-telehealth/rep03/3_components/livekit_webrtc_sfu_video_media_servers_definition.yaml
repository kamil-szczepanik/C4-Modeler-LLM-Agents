level: component
scope: "Component diagram for the LiveKit / WebRTC SFU Video Media Servers container"
parentContainer:
  name: "LiveKit / WebRTC SFU Video Media Servers"
elements:
  - type: "component"
    name: "LiveKit SFU Core"
    technology: "Go / LiveKit SFU"
    description: "Powers real-time video sessions with Simulcast support for degraded-mode operations and handles media and signaling streaming."
  - type: "component"
    name: "SFU Webhook Handler"
    technology: "Go / HTTPS"
    description: "Handles session lifecycle events and quality telemetry, communicating with core telehealth backends."
  - type: "component"
    name: "Adaptive Bitrate Engine"
    technology: "Go"
    description: "Ensures reliable consultations and low-bandwidth resilience for rural connectivity."
  - type: "component"
    name: "SFU Telemetry Aggregator"
    technology: "Go"
    description: "Aggregates quality telemetry and metrics from video sessions."
relationships:
  - source: "LiveKit SFU Core"
    destination: "Global TURN/STUN Edge Relays"
    description: "Media relay through edge nodes [STUN/TURN]"
  - source: "SFU Webhook Handler"
    destination: "Go / Spring Boot Core Telehealth Backends"
    description: "Sends session lifecycle events and quality telemetry [HTTPS POST, HMAC-SHA256, mTLS]"