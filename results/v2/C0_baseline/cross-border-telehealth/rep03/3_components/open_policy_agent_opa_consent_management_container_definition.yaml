level: component
scope: "Component diagram for the Open Policy Agent (OPA) Consent Management Container container"
parentContainer:
  name: "Open Policy Agent (OPA) Consent Management Container"
elements:
  - type: "component"
    name: "OPA Policy Engine"
    technology: "Open Policy Agent (OPA)"
    description: "Evaluates real-time authorization and consent policies for telehealth workflows."
  - type: "component"
    name: "OPA Bundle Manager"
    technology: "HTTPS Client"
    description: "Fetches policy bundles and configurations from Google Cloud Storage."
  - type: "component"
    name: "Consent Evaluator API"
    technology: "gRPC Server"
    description: "Provides local loopback gRPC endpoints for core telehealth backends."
relationships:
  - source: "Consent Evaluator API"
    destination: "OPA Policy Engine"
    description: "Evaluates requests against consent rules"
  - source: "OPA Policy Engine"
    destination: "Google Cloud SQL"
    description: "Executes read-only SQL queries via Istio mTLS"
  - source: "OPA Bundle Manager"
    destination: "Google Cloud Storage"
    description: "Downloads policy bundles via HTTPS over Istio mTLS"