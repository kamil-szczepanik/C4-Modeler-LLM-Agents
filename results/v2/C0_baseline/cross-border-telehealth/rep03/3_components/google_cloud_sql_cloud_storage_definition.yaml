level: component
scope: "Component diagram for the Google Cloud SQL & Cloud Storage container"
parentContainer:
  name: "Google Cloud SQL & Cloud Storage"
elements:
  - type: "component"
    name: "PostgreSQL 15 Cloud SQL Instance"
    technology: "PostgreSQL 15"
    description: "Provides Row-Level Security (RLS) for multi-tenant data isolation and schema mapping per jurisdiction."
  - type: "component"
    name: "Google Cloud Storage"
    technology: "Google Cloud Storage (Standard Tier)"
    description: "Stores binary artifacts and export packages with automatic lifecycle management and 24-hour purge rules."
  - type: "component"
    name: "Cloud KMS & Cloud HSM"
    technology: "Google Cloud KMS / Cloud HSM"
    description: "Secures regional data via CMEK and enables cryptographic erasure."
  - type: "component"
    name: "PostgreSQL Soft-Delete & Tombstone Manager"
    technology: "PostgreSQL / SQL"
    description: "Handles soft-delete records and tombstone management for database rows."
relationships:
  - source: "PostgreSQL 15 Cloud SQL Instance"
    destination: "Cloud KMS & Cloud HSM"
    description: "Secures regional data via CMEK and cryptographic keys [Encryption / TLS 1.3]"
  - source: "Google Cloud Storage"
    destination: "Cloud KMS & Cloud HSM"
    description: "Encrypts binary payloads and export packages with CMEK [Encryption / TLS 1.3]"
  - source: "PostgreSQL Soft-Delete & Tombstone Manager"
    destination: "PostgreSQL 15 Cloud SQL Instance"
    description: "Manages soft-deletes and tombstones for compliance [SQL]"