level: component
scope: "Component diagram for the E-Prescription Integration Service container"
parentContainer:
  name: "E-Prescription Integration Service"
elements:
  - type: "component"
    name: "Prescription Orchestrator Component"
    technology: "Go"
    description: "Orchestrates prescription dispatch workflows to EU national gateways and US Surescripts networks."
  - type: "component"
    name: "US FHIR Adapter Component"
    technology: "Go"
    description: "Adapts and translates prescription data for US Surescripts networks using HL7 FHIR over HTTPS/REST."
  - type: "component"
    name: "EU National Gateway Adapter Component"
    technology: "Go"
    description: "Adapts and dispatches prescriptions to EU national e-prescription gateways via mutual TLS and REST."
  - type: "component"
    name: "Audit & Compliance Logger Component"
    technology: "Go"
    description: "Logs compliance and audit events to ensure adherence to regional data residency regulations."
  - type: "component"
    name: "Event Dispatcher Component"
    technology: "Go"
    description: "Handles resilient asynchronous message processing and event dispatching via Google Cloud Pub/Sub."
  - type: "component"
    name: "Circuit Breaker & Retry Middleware"
    technology: "Go"
    description: "Provides resilience and fault tolerance across unstable cross-border networks."
relationships:
  - source: "Prescription Orchestrator Component"
    destination: "US FHIR Adapter Component"
    description: "Dispatches US prescriptions via internal Go interfaces"
  - source: "Prescription Orchestrator Component"
    destination: "EU National Gateway Adapter Component"
    description: "Dispatches EU prescriptions via internal Go interfaces"
  - source: "US FHIR Adapter Component"
    destination: "Circuit Breaker & Retry Middleware"
    description: "Uses middleware for network calls to Surescripts / US Pharmacy Networks"
  - source: "EU National Gateway Adapter Component"
    destination: "Circuit Breaker & Retry Middleware"
    description: "Uses middleware for network calls to National E-Prescription Gateways (EU)"
  - source: "Event Dispatcher Component"
    destination: "Audit & Compliance Logger Component"
    description: "Publishes asynchronous events for logging and tracking"