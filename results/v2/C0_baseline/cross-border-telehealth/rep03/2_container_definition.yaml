level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients across the EU and US seeking video consultations, e-prescriptions, and AI symptom checks."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed medical professionals delivering cross-border care to patients."
  - type: "externalSystem"
    name: "National E-Prescription Gateways (EU) & Surescripts/Pharmacy Networks (US)"
    description: "External gateways and pharmacy networks for dispatching e-prescriptions."
  - type: "externalSystem"
    name: "Regional Identity Providers (IDP)"
    description: "External regional IDPs handling authentication and identity."
  - type: "externalSystem"
    name: "External Payment Gateways (Stripe / Insurance APIs)"
    description: "External systems handling payments and insurance integrations."
  - type: "externalSystem"
    name: "Global TURN/STUN Edge Relays"
    description: "Edge relays supporting WebRTC video consultations."
  - type: "container"
    name: "React / Flutter Web and Mobile Apps"
    technology: "React, Flutter"
    description: "Frontend web and mobile application frameworks providing user interfaces for patients and clinicians."
  - type: "container"
    name: "Google Cloud API Gateway / Region Router"
    technology: "Google Cloud API Gateway"
    description: "Routes incoming traffic to regional VPCs using geo-routing."
  - type: "container"
    name: "Go / Spring Boot Core Telehealth Backends"
    technology: "Go, Spring Boot"
    description: "Core microservices for high-performance backend logic and handling medical workflows in EU/US regional VPCs."
  - type: "container"
    name: "LiveKit / WebRTC SFU Video Media Servers"
    technology: "LiveKit, WebRTC SFU"
    description: "Video streaming servers supporting degraded-mode (<300 kbit/s) video consultations."
  - type: "container"
    name: "Python / FastAPI + TensorFlow AI Symptom Checker Container"
    technology: "Python, FastAPI, TensorFlow"
    description: "AI Symptom Checker implementation for processing patient symptoms."
  - type: "container"
    name: "Open Policy Agent (OPA) Consent Management Container"
    technology: "Open Policy Agent (OPA)"
    description: "Real-time authorization and consent evaluation for regional privacy mandates."
  - type: "container"
    name: "E-Prescription Integration Service"
    technology: "REST, HL7 FHIR"
    description: "Integrates with national EU standards and US Surescripts networks to dispatch e-prescriptions."
  - type: "container"
    name: "Google Cloud SQL & Cloud Storage"
    technology: "Google Cloud SQL, Google Cloud Storage, Cloud KMS"
    description: "Regional databases and object storage with CMEK encryption for immutable AI audit logging and patient data."
relationships:
  - source: "Patients"
    destination: "React / Flutter Web and Mobile Apps"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS and WebSockets"
  - source: "Licensed Clinicians"
    destination: "React / Flutter Web and Mobile Apps"
    description: "Delivers care and manages patient consultations"
    technology: "HTTPS and WebSockets"
  - source: "React / Flutter Web and Mobile Apps"
    destination: "Google Cloud API Gateway / Region Router"
    description: "Sends API requests and traffic"
    technology: "HTTPS"
  - source: "Google Cloud API Gateway / Region Router"
    destination: "Go / Spring Boot Core Telehealth Backends"
    description: "Routes incoming traffic to regional backends"
    technology: "gRPC over Istio mTLS mesh"
  - source: "Go / Spring Boot Core Telehealth Backends"
    destination: "Google Cloud SQL & Cloud Storage"
    description: "Queries regional databases and logs data"
    technology: "SQL / HTTPS"
  - source: "Go / Spring Boot Core Telehealth Backends"
    destination: "Open Policy Agent (OPA) Consent Management Container"
    description: "Enforces rules and evaluates authorization"
    technology: "gRPC over Istio mTLS mesh"
  - source: "Go / Spring Boot Core Telehealth Backends"
    destination: "Python / FastAPI + TensorFlow AI Symptom Checker Container"
    description: "Requests AI symptom analysis"
    technology: "gRPC over Istio mTLS mesh"
  - source: "Go / Spring Boot Core Telehealth Backends"
    destination: "E-Prescription Integration Service"
    description: "Triggers e-prescription dispatch"
    technology: "gRPC over Istio mTLS mesh"
  - source: "Go / Spring Boot Core Telehealth Backends"
    destination: "LiveKit / WebRTC SFU Video Media Servers"
    description: "Initiates video session streams"
    technology: "WebRTC"
  - source: "Python / FastAPI + TensorFlow AI Symptom Checker Container"
    destination: "Google Cloud SQL & Cloud Storage"
    description: "Logs inputs and model versions with CMEK"
    technology: "HTTPS"
  - source: "E-Prescription Integration Service"
    destination: "National E-Prescription Gateways (EU) & Surescripts/Pharmacy Networks (US)"
    description: "Dispatches e-prescriptions and integrates with pharmacies"
    technology: "REST and HL7 FHIR"
  - source: "Go / Spring Boot Core Telehealth Backends"
    destination: "Regional Identity Providers (IDP)"
    description: "Authenticates users"
    technology: "OIDC and OAuth2"
  - source: "Go / Spring Boot Core Telehealth Backends"
    destination: "External Payment Gateways (Stripe / Insurance APIs)"
    description: "Processes payments and insurance claims"
    technology: "HTTPS and REST"
  - source: "LiveKit / WebRTC SFU Video Media Servers"
    destination: "Global TURN/STUN Edge Relays"
    description: "Relays video traffic through edge nodes"
    technology: "STUN/TURN"