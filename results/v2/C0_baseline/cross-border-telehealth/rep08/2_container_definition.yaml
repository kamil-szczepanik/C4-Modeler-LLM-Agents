level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients and Clinicians (EU & US)"
    description: "Patients and clinicians accessing video consultations, e-prescriptions, and AI symptom checker."
  - type: "externalSystem"
    name: "Pharmacies and Platform Administrators"
    description: "External systems and administrative roles interacting with the platform."
  - type: "externalSystem"
    name: "National E-Prescription Gateways (EU) & US Pharmacy Systems"
    description: "External systems for processing e-prescriptions using national formats and HL7 FHIR."
  - type: "container"
    name: "Client Applications"
    technology: "Flutter / Web"
    description: "Client applications providing user interfaces for patients and clinicians."
  - type: "container"
    name: "API Gateway"
    technology: "Envoy / Google Cloud Endpoints"
    description: "Routes and manages incoming client requests to internal microservices."
  - type: "container"
    name: "Core Telehealth Service"
    technology: "Go"
    description: "Handles core telehealth business logic and backend services."
  - type: "container"
    name: "AI Inference Service"
    technology: "Python / FastAPI"
    description: "Provides AI symptom checking and processes regional model artifacts."
  - type: "container"
    name: "Interoperability Service"
    technology: "Java / Spring Boot"
    description: "Handles integration with national e-prescription gateways and pharmacy systems."
  - type: "container"
    name: "Containerized SFUs"
    technology: "mediasoup"
    description: "Manages real-time video streams for consultations with low-bandwidth resilience."
  - type: "container"
    name: "Google Kubernetes Engine (GKE)"
    technology: "GCP (europe-west3, us-central1), Istio"
    description: "Orchestration platform and service mesh enforcing mTLS and secure regional workloads."
  - type: "container"
    name: "PostgreSQL Databases"
    technology: "PostgreSQL with CMEK"
    description: "Stores relational data securely with Customer-Managed Encryption Keys."
relationships:
  - source: "Patients and Clinicians (EU & US)"
    destination: "Client Applications"
    description: "Accesses telehealth platform capabilities"
    technology: "HTTPS / WebRTC"
  - source: "Client Applications"
    destination: "API Gateway"
    description: "Sends requests to the backend"
    technology: "gRPC and HTTPS"
  - source: "API Gateway"
    destination: "Core Telehealth Service"
    description: "Routes core business requests"
    technology: "gRPC over Istio mTLS mesh"
  - source: "API Gateway"
    destination: "AI Inference Service"
    description: "Routes AI symptom check requests"
    technology: "gRPC over Istio mTLS mesh"
  - source: "API Gateway"
    destination: "Interoperability Service"
    description: "Routes interoperability and prescription requests"
    technology: "gRPC over Istio mTLS mesh"
  - source: "API Gateway"
    destination: "Containerized SFUs"
    description: "Routes video stream control and media handling"
    technology: "gRPC over Istio mTLS mesh"
  - source: "Interoperability Service"
    destination: "National E-Prescription Gateways (EU) & US Pharmacy Systems"
    description: "Transmits and retrieves prescription data"
    technology: "National formats and HL7 FHIR"
  - source: "AI Inference Service"
    destination: "PostgreSQL Databases"
    description: "Persists and retrieves data securely"
    technology: "CMEK encrypted connection"
  - source: "Core Telehealth Service"
    destination: "PostgreSQL Databases"
    description: "Persists and retrieves data securely"
    technology: "CMEK encrypted connection"