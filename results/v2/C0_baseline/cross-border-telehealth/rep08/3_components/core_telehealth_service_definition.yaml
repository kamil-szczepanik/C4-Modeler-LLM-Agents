level: component
scope: "Component diagram for the Core Telehealth Service container"
parentContainer:
  name: "Core Telehealth Service"
elements:
  - type: "component"
    name: "Consultation & Scheduling Component"
    technology: "Go"
    description: "Manages video consultation sessions and appointment scheduling workflows."
  - type: "component"
    name: "Consent & Audit Engine"
    technology: "Go"
    description: "Handles patient consent tracking and rigorous audit logging for compliance."
  - type: "component"
    name: "Data Residency Proxy"
    technology: "Go"
    description: "Enforces strict regional data residency rules for EU and US patient data."
  - type: "component"
    name: "Prescription & Interoperability Orchestrator"
    technology: "Go"
    description: "Orchestrates e-prescriptions and coordinates data exchange with external interoperability systems."
relationships:
  - source: "Prescription & Interoperability Orchestrator"
    destination: "Interoperability Service"
    description: "Sends prescription data [gRPC over Istio mTLS]"
  - source: "Consultation & Scheduling Component"
    destination: "Regional PostgreSQL Databases"
    description: "Persists and retrieves encrypted data [CMEK and FLE encrypted connections]"
  - source: "Consent & Audit Engine"
    destination: "Regional PostgreSQL Databases"
    description: "Persists and retrieves encrypted data [CMEK and FLE encrypted connections]"
  - source: "Data Residency Proxy"
    destination: "Regional PostgreSQL Databases"
    description: "Persists and retrieves encrypted data [CMEK and FLE encrypted connections]"
  - source: "Prescription & Interoperability Orchestrator"
    destination: "Regional PostgreSQL Databases"
    description: "Persists and retrieves encrypted data [CMEK and FLE encrypted connections]"