level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Envoy Proxy"
    technology: "Envoy / Google Cloud Endpoints"
    description: "Handles TLS termination, global routing, rate limiting, and resilience at the gateway edge."
  - type: "component"
    name: "Routing Manager"
    technology: "Envoy Route Configuration"
    description: "Directs incoming gRPC and HTTPS traffic to appropriate backend microservices over the Istio mesh."
relationships:
  - source: "Envoy Proxy"
    destination: "Routing Manager"
    description: "Forwards verified requests"
  - source: "Routing Manager"
    destination: "Core Telehealth Service"
    description: "Routes gRPC requests over Istio mTLS"
  - source: "Routing Manager"
    destination: "AI Inference Service"
    description: "Routes gRPC requests over Istio mTLS"
  - source: "Routing Manager"
    destination: "Interoperability Service"
    description: "Routes gRPC requests over Istio mTLS"
  - source: "Routing Manager"
    destination: "Containerized SFUs"
    description: "Routes gRPC requests over Istio mTLS"