level: component
scope: "Component diagram for the Google Kubernetes Engine (GKE) container"
parentContainer:
  name: "Google Kubernetes Engine (GKE)"
elements:
  - type: "component"
    name: "Ingress Controller & API Gateway"
    technology: "Envoy / Istio Ingress"
    description: "Manages incoming external client traffic via HTTPS/WSS and routes to internal services."
  - type: "component"
    name: "Workload Pods"
    technology: "Go, Python, Java"
    description: "Executes core telehealth business logic, e-prescriptions, and media handling."
  - type: "component"
    name: "Policy & Admission Controller"
    technology: "OPA Gatekeeper / Kubernetes ValidatingWebhook"
    description: "Programmatically enforces regional data residency and compliance constraints."
  - type: "component"
    name: "Autoscalers"
    technology: "Cluster Autoscaler & Kubernetes HPA"
    description: "Ensures automated scaling and high availability for continuous service."
  - type: "component"
    name: "Runtime Security Component"
    technology: "Falco DaemonSet"
    description: "Provides runtime kernel monitoring for security enforcement."
  - type: "component"
    name: "OpenTelemetry Collectors"
    technology: "OpenTelemetry DaemonSet"
    description: "Collects and streams telemetry data to cloud logging."
  - type: "component"
    name: "Secret Store CSI Driver"
    technology: "Google Secret Manager / HashiCorp Vault"
    description: "Secures and injects sensitive configuration and credentials."
relationships:
  - source: "Ingress Controller & API Gateway"
    destination: "Workload Pods"
    description: "Routes external client traffic via gRPC/mTLS over Istio service mesh"
  - source: "Workload Pods"
    destination: "Secret Store CSI Driver"
    description: "Retrieves secrets and keys securely"
  - source: "OpenTelemetry Collectors"
    destination: "Workload Pods"
    description: "Streams telemetry from workloads"