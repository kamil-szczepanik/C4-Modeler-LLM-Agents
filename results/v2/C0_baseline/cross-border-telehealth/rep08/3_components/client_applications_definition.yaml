level: component
scope: "Component diagram for the Client Applications container"
parentContainer:
  name: "Client Applications"
elements:
  - type: "component"
    name: "UI Layer"
    technology: "Flutter / Web"
    description: "Handles user presentation, captures inputs, and displays platform capabilities for patients and clinicians."
  - type: "component"
    name: "Local State & Storage Manager"
    technology: "Hive / SQLite with SQLCipher"
    description: "Secures cached PHI and consent preferences at rest using device-derived encryption keys."
  - type: "component"
    name: "Network & Sync Engine"
    technology: "gRPC-Web / HTTPS with Certificate Pinning"
    description: "Communicates with dynamic region endpoints and manages data synchronization."
  - type: "component"
    name: "WebRTC Client SDK"
    technology: "ICE / DTLS / SRTP"
    description: "Streams real-time video and audio for low-latency consultations."
  - type: "component"
    name: "Localization & Accessibility Engine"
    technology: "Flutter Localization"
    description: "Supports multilingual capabilities and accessibility features across regions."
relationships:
  - source: "UI Layer"
    destination: "API Gateway"
    description: "Sends structured API requests [gRPC-Web / HTTPS]"
  - source: "Network & Sync Engine"
    destination: "API Gateway"
    description: "Communicates with dynamic region endpoints [gRPC-Web / HTTPS with Certificate Pinning]"
  - source: "WebRTC Client SDK"
    destination: "Containerized SFUs (mediasoup)"
    description: "Streams video and audio [ICE / DTLS / SRTP]"
  - source: "UI Layer"
    destination: "Local State & Storage Manager"
    description: "Reads and writes cached data [Encrypted Local I/O]"