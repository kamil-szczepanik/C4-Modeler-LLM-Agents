level: component
scope: "Component diagram for the Interoperability Service container"
parentContainer:
  name: "Interoperability Service"
elements:
  - type: "component"
    name: "FHIR Translation Engine"
    technology: "Java / Spring Boot"
    description: "Translates regional health data formats into standard FHIR representations."
  - type: "component"
    name: "EU Gateway Adapter Module"
    technology: "Java / Spring Boot"
    description: "Adapts payloads for integration with external National E-Prescription Gateways in the EU."
  - type: "component"
    name: "Consent & Policy Enforcement Interceptor"
    technology: "Java / Spring Boot"
    description: "Validates consent and enforces regional data access policies."
  - type: "component"
    name: "Async Dispatch & DLQ Manager"
    technology: "Java / Spring Boot, Resilience4j"
    description: "Manages asynchronous dispatch and persistent dead-letter queues for unrecoverable payloads."
relationships:
  - source: "Consent & Policy Enforcement Interceptor"
    destination: "FHIR Translation Engine"
    description: "Dispatches validated payloads [Spring Application Events]"
  - source: "Consent & Policy Enforcement Interceptor"
    destination: "EU Gateway Adapter Module"
    description: "Dispatches validated payloads [Spring Application Events]"