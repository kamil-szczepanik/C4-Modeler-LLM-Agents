level: component
scope: "Component diagram for the PostgreSQL Databases container"
parentContainer:
  name: "PostgreSQL Databases"
elements:
  - type: "component"
    name: "Cloud SQL for PostgreSQL"
    technology: "Relational storage engine"
    description: "Managed relational database ensuring enterprise availability and point-in-time recovery, region-isolated in europe-west3 and us-central1."
  - type: "component"
    name: "Cloud SQL Auth Proxy"
    technology: "Sidecar proxy"
    description: "Secures database transport without static passwords using mTLS."
  - type: "component"
    name: "PgBouncer"
    technology: "Connection pooler"
    description: "Manages and optimizes database connections."
  - type: "component"
    name: "Schemas"
    technology: "PostgreSQL Schemas (core_domain, consent_ledger, ai_audit)"
    description: "Organizes data for core domain, consent tracking, and AI audit logging."
relationships:
  - source: "Core Telehealth Service"
    destination: "Cloud SQL Auth Proxy"
    description: "Persists and retrieves patient and consultation data via TCP port 5432 using TLS 1.3"
  - source: "AI Inference Service"
    destination: "Cloud SQL Auth Proxy"
    description: "Stores symptom checker inputs, outputs, and model versions via TCP port 5432 using TLS 1.3"