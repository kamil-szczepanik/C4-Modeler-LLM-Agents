level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US while ensuring strict data residency, regulatory compliance, and high availability."
elements:
  - type: "person"
    name: "Patients (EU & US)"
    description: "Patients using Mobile/Web Clients to access video consultations, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Clinicians using the Clinician Portal to conduct video consultations and manage patient care."
  - type: "externalSystem"
    name: "National E-Prescription Gateways (EU) & US Pharmacy Systems"
    description: "External systems for processing e-prescriptions via HL7 FHIR."
  - type: "externalSystem"
    name: "Identity Providers (EU eIDAS / US OAuth2)"
    description: "External identity providers for authentication using OIDC."
  - type: "externalSystem"
    name: "EU/US Regulatory & Auditing Bodies"
    description: "Bodies receiving secure export data for regulatory and auditing purposes."
relationships:
  - source: "Patients (EU & US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS / WebRTC (TLS 1.3) with regional Anycast edge routing"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Manages patient consultations and clinical workflows via Clinician Portal"
    technology: "HTTPS / WebRTC (TLS 1.3) with regional Anycast edge routing"
  - source: "Cross-Border Telehealth Platform"
    destination: "National E-Prescription Gateways (EU) & US Pharmacy Systems"
    description: "Transmits and retrieves e-prescription data"
    technology: "REST / HL7 FHIR over mutual TLS (mTLS)"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity Providers (EU eIDAS / US OAuth2)"
    description: "Authenticates users"
    technology: "OIDC over HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "EU/US Regulatory & Auditing Bodies"
    description: "Exports audit logs and compliance data"
    technology: "Secure export API (HTTPS/SFTP) with regional data-residency filters"