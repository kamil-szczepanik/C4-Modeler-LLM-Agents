level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and the US with strict data residency, regulatory compliance, and low-bandwidth resilience."
elements:
  - type: "person"
    name: "Patients (EU & US)"
    description: "Patients in the EU and US seeking video consultations, e-prescriptions, and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed medical professionals providing video consultations and issuing e-prescriptions."
  - type: "externalSystem"
    name: "Pharmacy Partners (EU & US)"
    description: "EU National E-Prescription Gateways and US Pharmacy Networks handling prescription fulfillment."
  - type: "externalSystem"
    name: "Compliance / Regulatory Officers"
    description: "Officers ensuring adherence to GDPR, HIPAA, and regional healthcare regulations."
  - type: "externalSystem"
    name: "Third-Party WebRTC SFU"
    description: "External SFU handling video/media streams with active-active edge routing and circuit-breaker patterns."
  - type: "externalSystem"
    name: "AI Model Registry / Inference Service"
    description: "External service providing triage recommendations via secure HTTPS/REST."
relationships:
  - source: "Patients (EU & US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Interact via regional platform containers for consultations, prescriptions, and symptom checks."
    technology: "HTTPS (TLS 1.3) and WebRTC (E2EE)"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Interact via regional platform containers to consult patients and manage prescriptions."
    technology: "HTTPS (TLS 1.3) and WebRTC (E2EE)"
  - source: "Cross-Border Telehealth Platform"
    destination: "Pharmacy Partners (EU & US)"
    description: "Connect to national e-prescription gateways and pharmacy networks."
    technology: "REST/HL7 FHIR over mTLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Third-Party WebRTC SFU"
    description: "Integrate using active-active edge routing for low-bandwidth resilience."
    technology: "WebRTC"
  - source: "Cross-Border Telehealth Platform"
    destination: "AI Model Registry / Inference Service"
    description: "Interface with AI inference services for triage recommendations."
    technology: "HTTPS/REST"