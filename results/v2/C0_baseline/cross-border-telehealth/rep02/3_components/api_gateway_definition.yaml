level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "WAF"
    technology: "Envoy / Cloud Endpoints"
    description: "Web Application Firewall for edge security and filtering."
  - type: "component"
    name: "Geo-Router"
    technology: "Envoy Routing"
    description: "Routes client requests based on geographic location to enforce data residency."
  - type: "component"
    name: "xDS Client"
    technology: "Envoy gRPC Client"
    description: "Fetches dynamic routing updates from the Control Plane."
relationships:
  - source: "WAF"
    destination: "Geo-Router"
    description: "Forwards inspected client traffic"
  - source: "Geo-Router"
    destination: "xDS Client"
    description: "Uses configuration for dynamic routing"