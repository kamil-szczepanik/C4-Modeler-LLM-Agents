level: component
scope: "Component diagram for the AI Symptom Service container"
parentContainer:
  name: "AI Symptom Service"
elements:
  - type: "component"
    name: "Triage Orchestrator Component"
    technology: "Python / FastAPI"
    description: "Orchestrates the symptom check workflow and coordinates internal inference and explanation steps."
  - type: "component"
    name: "Inference Adapter"
    technology: "gRPC client"
    description: "Executes symptom evaluation via gRPC against the AI Model Registry / Inference Service."
  - type: "component"
    name: "Explanation Generator"
    technology: "Python / FastAPI"
    description: "Generates clinical explanations for the AI symptom evaluation results."
  - type: "component"
    name: "De-identification Middleware"
    technology: "Python middleware"
    description: "Ensures local de-identification of patient data for regulatory compliance before logging or processing."
  - type: "component"
    name: "Fluentbit sidecar container"
    technology: "Fluentbit"
    description: "Offloads audit payloads via local ephemeral volumes with LUKS encryption."
relationships:
  - source: "Triage Orchestrator Component"
    destination: "Inference Adapter"
    description: "Executes symptom evaluation"
  - source: "Triage Orchestrator Component"
    destination: "Explanation Generator"
    description: "Requests evaluation explanations"
  - source: "Triage Orchestrator Component"
    destination: "De-identification Middleware"
    description: "Sanitizes data payloads"
  - source: "Triage Orchestrator Component"
    destination: "Fluentbit sidecar container"
    description: "Offloads audit payloads via local ephemeral volumes with LUKS encryption"