level: component
scope: "Component diagram for the Localization Service container"
parentContainer:
  name: "Localization Service"
elements:
  - type: "component"
    name: "Localization Controller"
    technology: "NestJS Controller"
    description: "Manages regional i18n, medical glossaries, and compliance disclaimers, handling incoming gRPC routes."
  - type: "component"
    name: "Translation Engine"
    technology: "Component"
    description: "Resolves localized strings and manages medical glossaries."
  - type: "component"
    name: "Regional Policy Provider"
    technology: "Component"
    description: "Fetches compliance text and regional policies under strict data residency mandates."
  - type: "component"
    name: "Localization Cache"
    technology: "Google Memorystore Redis"
    description: "Isolated regional caching to enforce data residency."
  - type: "component"
    name: "Bundle Loader & Verifier"
    technology: "Component"
    description: "Downloads and verifies signed compliance bundles."
  - type: "component"
    name: "GCP Cloud Storage WORM"
    technology: "External Storage"
    description: "Immutable, versioned storage for compliance bundles."
  - type: "component"
    name: "API Gateway"
    technology: "Gateway"
    description: "Routes localization requests via gRPC over mTLS."
relationships:
  - source: "API Gateway"
    destination: "Localization Controller"
    description: "Routes localization requests [gRPC over mTLS]"
  - source: "Localization Controller"
    destination: "Translation Engine"
    description: "Resolves localized strings [In-process / Function call]"
  - source: "Localization Controller"
    destination: "Regional Policy Provider"
    description: "Fetches compliance text [In-process]"
  - source: "Translation Engine"
    destination: "Localization Cache"
    description: "Reads cached bundles [Redis Protocol over TLS]"
  - source: "Regional Policy Provider"
    destination: "Localization Cache"
    description: "Reads cached bundles [Redis Protocol over TLS]"
  - source: "Bundle Loader & Verifier"
    destination: "GCP Cloud Storage WORM"
    description: "Downloads signed bundles [HTTPS / GCP SDK]"