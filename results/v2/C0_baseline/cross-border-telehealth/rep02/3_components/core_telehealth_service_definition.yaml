level: component
scope: "Component diagram for the Core Telehealth Service container"
parentContainer:
  name: "Core Telehealth Service"
elements:
  - type: "component"
    name: "Consultation Orchestrator"
    technology: "Node.js / NestJS"
    description: "Manages video and audio streaming sessions via the Third-Party WebRTC SFU."
  - type: "component"
    name: "Consent & Policy Enforcement"
    technology: "Node.js / NestJS with OPA Sidecar"
    description: "Validates consent records, evaluates zero-trust policies, and queries PHI securely."
  - type: "component"
    name: "Prescription Dispatcher"
    technology: "Node.js / NestJS"
    description: "Dispatches regional e-prescriptions to Pharmacy Partners in the EU and US."
  - type: "component"
    name: "Telemetry & Metrics Adapter"
    technology: "OpenTelemetry"
    description: "Captures structured audit logs and metrics without leaking PHI."
relationships:
  - source: "Consultation Orchestrator"
    destination: "Third-Party WebRTC SFU"
    description: "Manages video and audio streaming sessions [WebRTC / SRTP]"
  - source: "Consent & Policy Enforcement"
    destination: "Google Cloud SQL (PostgreSQL)"
    description: "Validates consent records and queries PHI [TCP/TLS 1.3]"
  - source: "Prescription Dispatcher"
    destination: "Pharmacy Partners (EU & US)"
    description: "Dispatches regional e-prescriptions [REST / HL7 FHIR over mTLS]"