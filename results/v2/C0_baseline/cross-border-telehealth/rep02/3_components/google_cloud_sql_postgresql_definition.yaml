level: component
scope: "Component diagram for the Google Cloud SQL (PostgreSQL) container"
parentContainer:
  name: "Google Cloud SQL (PostgreSQL)"
elements:
  - type: "component"
    name: "PostgreSQL RDBMS Engine"
    technology: "PostgreSQL with Row-Level Security (RLS)"
    description: "Enforces regional data residency and patient consent constraints directly at the data layer using Row-Level Security."
  - type: "component"
    name: "PgBouncer Connection Pooler"
    technology: "PgBouncer"
    description: "Handles connection pooling configured in session mode to securely maintain session state for RLS."
  - type: "component"
    name: "CMEK Module"
    technology: "Google Cloud KMS"
    description: "Manages regional Customer-Managed Encryption Keys for data-at-rest encryption."
  - type: "component"
    name: "Audit & Activity Logging Daemon"
    technology: "pgAudit with Google Cloud Logging / BigQuery"
    description: "Streams detailed audit trails for traceability to ensure compliance with EU MDR and HIPAA."
relationships:
  - source: "PgBouncer Connection Pooler"
    destination: "PostgreSQL RDBMS Engine"
    description: "Forwards pooled queries maintaining session state for RLS over [TCP/TLS]"
  - source: "PostgreSQL RDBMS Engine"
    destination: "CMEK Module"
    description: "Manages regional encryption keys using CMEK over [HTTPS]"
  - source: "Audit & Activity Logging Daemon"
    destination: "PostgreSQL RDBMS Engine"
    description: "Captures and streams audit logs from the database engine"