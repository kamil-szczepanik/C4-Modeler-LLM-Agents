level: component
scope: "Component diagram for the Billing / Payment Container container"
parentContainer:
  name: "Billing / Payment Container"
elements:
  - type: "component"
    name: "Billing API Controller"
    technology: "Node.js / NestJS"
    description: "Manages multi-currency transactions, regional tax calculations, and secure payment processing."
  - type: "component"
    name: "Payment Orchestrator Service"
    technology: "Node.js / NestJS"
    description: "Orchestrates payment workflows across external gateways and recovery services."
  - type: "component"
    name: "Ledger & Invoice Engine"
    technology: "Node.js / NestJS"
    description: "Manages ledgers and generates invoices for billing operations."
  - type: "component"
    name: "PCI-DSS Tokenization Adapter"
    technology: "Node.js / NestJS"
    description: "Handles secure tokenization to maintain strict PCI-DSS scope separation."
  - type: "component"
    name: "Tax & Currency Engine"
    technology: "Node.js / NestJS"
    description: "Calculates regional taxes and handles multi-currency transactions."
  - type: "component"
    name: "Checkout Recovery Service"
    technology: "Node.js / NestJS"
    description: "Recovers abandoned or failed checkouts via internal events."
relationships:
  - source: "Billing API Controller"
    destination: "Tax & Currency Engine"
    description: "Internal Function Call"
  - source: "Payment Orchestrator Service"
    destination: "Checkout Recovery Service"
    description: "Internal Event"