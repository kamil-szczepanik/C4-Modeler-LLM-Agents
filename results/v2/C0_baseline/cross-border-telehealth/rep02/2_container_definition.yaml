level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU & US)"
    description: "Patients in the EU and US seeking video consultations, e-prescriptions, and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed medical professionals providing video consultations and issuing e-prescriptions."
  - type: "person"
    name: "Platform Administrators"
    description: "Administrators managing platform infrastructure and configurations."
  - type: "person"
    name: "Support Agents"
    description: "Support agents assisting users with platform issues."
  - type: "externalSystem"
    name: "Pharmacy Partners (EU & US)"
    description: "EU National E-Prescription Gateways and US Pharmacy Networks handling prescription fulfillment."
  - type: "externalSystem"
    name: "Regulatory Officers"
    description: "Officers ensuring adherence to GDPR, HIPAA, and regional healthcare regulations."
  - type: "container"
    name: "Web / Mobile Client"
    technology: "React / React Native"
    description: "Client application used by patients and clinicians to access telehealth services."
  - type: "container"
    name: "API Gateway"
    technology: "Envoy / Cloud Endpoints"
    description: "Edge and routing service handling ingress traffic and local TURN/STUN relays."
  - type: "container"
    name: "Core Telehealth Service"
    technology: "Node.js / NestJS"
    description: "Handles core telehealth business logic and consultations."
  - type: "container"
    name: "AI Symptom Service"
    technology: "Python / FastAPI"
    description: "Provides isolated AI symptom checking and triage recommendations."
  - type: "container"
    name: "Localization Service"
    technology: "Node.js / NestJS"
    description: "Manages regional localization and compliance adaptations."
  - type: "container"
    name: "Billing / Payment Container"
    technology: "Node.js / NestJS"
    description: "Handles payment processing and financial transactions."
  - type: "container"
    name: "Google Cloud SQL (PostgreSQL)"
    technology: "PostgreSQL with CMEK"
    description: "Regional database storing localized PHI."
  - type: "container"
    name: "Cloud Storage WORM buckets"
    technology: "GCP Cloud Storage WORM"
    description: "Storage for immutable AI audit logs ensuring EU MDR traceability."
relationships:
  - source: "Patients (EU & US)"
    destination: "Web / Mobile Client"
    description: "Access telehealth services, video consultations, and AI symptom checker."
    technology: "HTTPS (TLS 1.3) and WSS"
  - source: "Licensed Clinicians"
    destination: "Web / Mobile Client"
    description: "Conduct video consultations and manage e-prescriptions."
    technology: "HTTPS (TLS 1.3) and WSS"
  - source: "Platform Administrators"
    destination: "API Gateway"
    description: "Manage and configure platform routing and services."
    technology: "HTTPS"
  - source: "Support Agents"
    destination: "API Gateway"
    description: "Access support tools and logs."
    technology: "HTTPS"
  - source: "Regulatory Officers"
    destination: "Cloud Storage WORM buckets"
    description: "Audit immutable logs for regulatory compliance."
    technology: "Secure Access"
  - source: "Web / Mobile Client"
    destination: "API Gateway"
    description: "Sends client requests and streams media via local TURN/STUN."
    technology: "HTTPS (TLS 1.3) and WSS"
  - source: "API Gateway"
    destination: "Core Telehealth Service"
    description: "Routes internal backend requests."
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "AI Symptom Service"
    description: "Routes AI symptom check requests."
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Localization Service"
    description: "Routes localization requests."
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Billing / Payment Container"
    description: "Routes billing requests."
    technology: "gRPC over mTLS"
  - source: "Core Telehealth Service"
    destination: "Google Cloud SQL (PostgreSQL)"
    description: "Persists core application data and PHI."
    technology: "TCP/TLS"
  - source: "AI Symptom Service"
    destination: "Cloud Storage WORM buckets"
    description: "Direct write of immutable audit payloads."
    technology: "HTTPS / Cloud Storage API"
  - source: "Core Telehealth Service"
    destination: "Pharmacy Partners (EU & US)"
    description: "Sends e-prescriptions to regional partners."
    technology: "REST / HL7 FHIR over mTLS"