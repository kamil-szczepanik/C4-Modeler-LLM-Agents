level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "A cross-border telehealth platform providing video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and the US while enforcing GDPR/HIPAA compliance."
elements:
  - type: "person"
    name: "Patients & Clinicians"
    description: "Users who access the platform via PWA and native mobile apps for video consultations, e-prescriptions, and AI symptom checking."
  - type: "externalSystem"
    name: "External Pharmacy Networks"
    description: "National EU e-prescription gateways and US pharmacy systems interacting via HL7 FHIR and national standards."
  - type: "externalSystem"
    name: "National Health Systems & Insurance Providers"
    description: "External systems for claims and health registry reporting using REST APIs and mutual TLS."
  - type: "externalSystem"
    name: "Identity Providers"
    description: "Regional IAM services handling OIDC/OAuth2 authentication and multi-factor authentication."
relationships:
  - source: "Patients & Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses video consultations, e-prescriptions, and symptom checks with low-bandwidth adaptive streaming and offline synchronization"
    technology: "HTTPS / WebRTC"
  - source: "Cross-Border Telehealth Platform"
    destination: "External Pharmacy Networks"
    description: "Sends e-prescriptions and prescription data"
    technology: "HL7 FHIR (US) and national standards (EU) via REST / TLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "National Health Systems & Insurance Providers"
    description: "Reports claims and health registry data"
    technology: "REST APIs and mutual TLS (mTLS)"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity Providers"
    description: "Authenticates users and inspects tokens"
    technology: "OAuth2 / OIDC"