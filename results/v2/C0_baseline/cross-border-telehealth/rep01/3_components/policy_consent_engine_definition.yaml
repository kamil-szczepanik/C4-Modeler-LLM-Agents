level: component
scope: "Component diagram for the Policy & Consent Engine container"
parentContainer:
  name: "Policy & Consent Engine"
elements:
  - type: "component"
    name: "Open Policy Agent (OPA)"
    technology: "Open Policy Agent"
    description: "Performs local policy evaluation for regional GKE services via gRPC."
  - type: "component"
    name: "Consent Sync Worker"
    technology: "GCP Pub/Sub Worker"
    description: "Handles asynchronous cross-region consent propagation."
  - type: "component"
    name: "Consent Audit Transformer"
    technology: "Audit Processing Service"
    description: "Queries regional logs for human-readable audit trails and sends them to BigQuery."
relationships:
  - source: "Consent Sync Worker"
    destination: "GCP Pub/Sub"
    description: "Propagates cross-region consent asynchronously."
  - source: "Consent Audit Transformer"
    destination: "BigQuery"
    description: "Sends regional log queries for human-readable audit trails."