level: component
scope: "Component diagram for the AI Symptom Checker container"
parentContainer:
  name: "AI Symptom Checker"
elements:
  - type: "component"
    name: "Symptom Intake API Controller"
    technology: "Python, FastAPI"
    description: "Handles symptom intake requests and interfaces with regional application services."
  - type: "component"
    name: "Inference Orchestrator"
    technology: "Python"
    description: "Orchestrates triage and executes AI model inference via Vertex AI Endpoints."
  - type: "component"
    name: "Explainability & Sanitization Engine"
    technology: "Python"
    description: "Processes and sanitizes model outputs while providing explainability."
  - type: "component"
    name: "Audit & Traceability Logger"
    technology: "Go"
    description: "Streams and persists audit data for regulatory compliance and traceability."
relationships:
  - source: "Symptom Intake API Controller"
    destination: "Inference Orchestrator"
    description: "Invokes triage [In-memory / gRPC]"
  - source: "Inference Orchestrator"
    destination: "Explainability & Sanitization Engine"
    description: "Processes outputs [In-memory]"
  - source: "Explainability & Sanitization Engine"
    destination: "Audit & Traceability Logger"
    description: "Streams logs [Cloud Pub/Sub]"