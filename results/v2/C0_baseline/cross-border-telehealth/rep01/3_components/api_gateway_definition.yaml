level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Geo-Routing Router"
    technology: "Envoy Proxy / Apigee"
    description: "Handles Anycast DNS based geo-routing and traffic direction for EU and US patients."
  - type: "component"
    name: "TLS Terminator"
    technology: "Envoy Proxy"
    description: "Terminates HTTPS and WSS connections using TLS 1.3 at the network edge."
  - type: "component"
    name: "Consent and Policy Validator"
    technology: "Open Policy Agent (OPA)"
    description: "Evaluates dynamic patient consent policies and regulatory compliance (GDPR/HIPAA)."
  - type: "component"
    name: "Schema Checker"
    technology: "Envoy Proxy / Apigee"
    description: "Validates incoming request payloads and API schemas before forwarding."
relationships:
  - source: "Geo-Routing Router"
    destination: "TLS Terminator"
    description: "Routes incoming connections to"
  - source: "TLS Terminator"
    destination: "Schema Checker"
    description: "Passes decrypted traffic to"
  - source: "Schema Checker"
    destination: "Consent and Policy Validator"
    description: "Queries policies for"