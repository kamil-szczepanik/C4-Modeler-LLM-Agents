level: component
scope: "Component diagram for the Video Consultation Service container"
parentContainer:
  name: "Video Consultation Service"
elements:
  - type: "component"
    name: "Signaling & Session Manager"
    technology: "Node.js / Go & Redis"
    description: "Handles signaling state management, short-lived session token caching, and session initialization."
  - type: "component"
    name: "Media Relay & SFU Controller"
    technology: "WebRTC SFU (Janus/Mediasoup) & DTLS-SRTP"
    description: "Powers adaptive bitrate video streaming for low-bandwidth connections with encrypted media paths."
  - type: "component"
    name: "Localization & UI Gateway"
    technology: "React/Next.js"
    description: "Provides localized waiting rooms and video UI access for patients and clinicians."
  - type: "component"
    name: "Media Quality & Audit Logger"
    technology: "Async / Cloud Pub/Sub"
    description: "Emits real-time stream quality metrics and audit logs."
relationships:
  - source: "Signaling & Session Manager"
    destination: "Media Relay & SFU Controller"
    description: "Allocates media paths [Internal API]"
  - source: "Media Relay & SFU Controller"
    destination: "Media Quality & Audit Logger"
    description: "Emits real-time stream quality metrics [Async / Cloud Pub/Sub]"
  - source: "Signaling & Session Manager"
    destination: "Data & Audit Tier"
    description: "Persists session metadata locally per region [gRPC / SQL]"
  - source: "Patients/Clinicians"
    destination: "Localization & UI Gateway"
    description: "Accesses localized waiting rooms and video UI [HTTPS / WebSockets]"