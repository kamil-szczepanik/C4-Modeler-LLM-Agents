level: component
scope: "Component diagram for the Data & Audit Tier container"
parentContainer:
  name: "Data & Audit Tier"
elements:
  - type: "component"
    name: "Cloud SQL for PostgreSQL"
    technology: "PostgreSQL / TLS 1.3"
    description: "Provides ACID compliance, row-level security for tenant data isolation, and stores access grants and transactional data."
  - type: "component"
    name: "Cloud Storage WORM"
    technology: "Cloud Storage WORM"
    description: "Stores immutable audit logs and traceability data ensuring regulatory compliance."
  - type: "component"
    name: "BigQuery"
    technology: "Google BigQuery"
    description: "Queries immutable access and AI traceability logs for compliance auditing."
relationships:
  - source: "Regional Application Services"
    destination: "Cloud SQL for PostgreSQL"
    description: "Read/write transactions via PostgreSQL Wire Protocol / TLS 1.3"
  - source: "AI Symptom Checker"
    destination: "Cloud Storage WORM"
    description: "Stream immutable logs via Cloud Pub/Sub"
  - source: "AI Symptom Checker"
    destination: "BigQuery"
    description: "Stream immutable logs via Cloud Pub/Sub"
  - source: "Policy & Consent Engine"
    destination: "Cloud SQL for PostgreSQL"
    description: "Validates and logs access grants via gRPC"
  - source: "Compliance Officer"
    destination: "Cloud Storage WORM"
    description: "Queries immutable access and AI traceability logs via Cloud Identity-Aware Proxy (IAP) over HTTPS"
  - source: "Compliance Officer"
    destination: "BigQuery"
    description: "Queries immutable access and AI traceability logs via Cloud Identity-Aware Proxy (IAP) over HTTPS"