level: component
scope: "Component diagram for the Interoperability Adapter container"
parentContainer:
  name: "Interoperability Adapter"
elements:
  - type: "component"
    name: "FHIR Translation Facade"
    technology: "GKE microservice / Apache Camel"
    description: "Handles payload transformations and schema versioning for health data."
  - type: "component"
    name: "EU National Gateway Driver"
    technology: "GKE microservice"
    description: "Communicates with EU National Systems via asynchronous Cloud Pub/Sub and synchronous HTTPS."
  - type: "component"
    name: "Transformation Pipeline Engine"
    technology: "Apache Camel"
    description: "Executes message routing, schema versioning, and payload transformations."
  - type: "component"
    name: "Audit & Traceability Logger"
    technology: "gRPC / WORM Cloud Storage"
    description: "Forwards encrypted audit logs via gRPC to Cloud Spanner and WORM Cloud Storage."
  - type: "component"
    name: "Clinical Error & Telemetry Handler"
    technology: "Prometheus / GKE"
    description: "Monitors transformation latency, payload error rates, and business-level e-prescription SLAs."
relationships:
  - source: "FHIR Translation Facade"
    destination: "Transformation Pipeline Engine"
    description: "Passes payload for schema versioning and transformation"
  - source: "EU National Gateway Driver"
    destination: "Transformation Pipeline Engine"
    description: "Routes national system payloads"
  - source: "Transformation Pipeline Engine"
    destination: "Audit & Traceability Logger"
    description: "Sends audit logs and traceability events"
  - source: "Clinical Error & Telemetry Handler"
    destination: "Transformation Pipeline Engine"
    description: "Monitors latency and error rates"