level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Urban Patients"
    description: "Patients in urban areas accessing high-bandwidth video consultations and platform features."
  - type: "person"
    name: "Rural Patients"
    description: "Patients in rural areas requiring high availability and adaptive bitrate streaming for consultations."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Healthcare professionals conducting video consultations and issuing e-prescriptions."
  - type: "person"
    name: "Pharmacists"
    description: "Pharmacy staff receiving and processing e-prescriptions."
  - type: "person"
    name: "Compliance Officers"
    description: "Officers monitoring adherence to HIPAA and GDPR regulations."
  - type: "externalSystem"
    name: "External Pharmacy Networks"
    description: "National EU e-prescription gateways and US pharmacy systems interacting via HL7 FHIR."
  - type: "container"
    name: "API Gateway"
    technology: "Cloud Endpoints / Apigee"
    description: "Handles TLS termination, JWT validation, and request routing."
  - type: "container"
    name: "Regional Application Services"
    technology: "Google Kubernetes Engine (GKE)"
    description: "Regional container execution clusters in europe-west3 and us-central1."
  - type: "container"
    name: "Video Consultation Service"
    technology: "Twilio / WebRTC Media Server"
    description: "Provides adaptive bitrate streaming for video consultations."
  - type: "container"
    name: "AI Symptom Checker"
    technology: "Vertex AI endpoints"
    description: "Isolated inference container for AI-based symptom checking."
  - type: "container"
    name: "Policy & Consent Engine"
    technology: "Open Policy Agent (OPA)"
    description: "Deployed locally on regional GKE clusters for localized authorization."
  - type: "container"
    name: "Interoperability Adapter"
    technology: "GKE microservice"
    description: "Handles integration with external health systems and pharmacies."
  - type: "container"
    name: "Data & Audit Tier"
    technology: "Cloud SQL / Cloud Spanner / WORM Cloud Storage"
    description: "Region-isolated databases and WORM storage buckets for audit logs."
relationships:
  - source: "Urban Patients"
    destination: "API Gateway"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checking"
    technology: "HTTPS and WSS via TLS 1.3"
  - source: "Rural Patients"
    destination: "API Gateway"
    description: "Accesses video consultations and platform services with adaptive streaming"
    technology: "HTTPS and WSS via TLS 1.3"
  - source: "Licensed Clinicians"
    destination: "API Gateway"
    description: "Manages consultations and issues e-prescriptions"
    technology: "HTTPS and WSS via TLS 1.3"
  - source: "Pharmacists"
    destination: "API Gateway"
    description: "Retrieves and processes e-prescriptions"
    technology: "HTTPS and WSS via TLS 1.3"
  - source: "Compliance Officers"
    destination: "API Gateway"
    description: "Reviews audit logs and policy compliance"
    technology: "HTTPS and WSS via TLS 1.3"
  - source: "API Gateway"
    destination: "Regional Application Services"
    description: "Routes validated requests to regional GKE clusters"
    technology: "gRPC over Istio mTLS"
  - source: "Regional Application Services"
    destination: "Video Consultation Service"
    description: "Initiates and manages video sessions"
    technology: "WebRTC / Adaptive Bitrate Streaming"
  - source: "Regional Application Services"
    destination: "AI Symptom Checker"
    description: "Sends inference requests to isolated endpoints"
    technology: "gRPC / REST"
  - source: "Regional Application Services"
    destination: "Policy & Consent Engine"
    description: "Validates local authorization policies"
    technology: "Local OPA evaluation"
  - source: "Regional Application Services"
    destination: "Data & Audit Tier"
    description: "Persists patient and operational data with strict regional isolation"
    technology: "Region-isolated SQL / Spanner connections"
  - source: "Interoperability Adapter"
    destination: "External Pharmacy Networks"
    description: "Exchanges e-prescription and health data"
    technology: "OAuth 2.0 mTLS and SMART on FHIR"
  - source: "AI Symptom Checker"
    destination: "Data & Audit Tier"
    description: "Streams asynchronous event and audit logs"
    technology: "Asynchronous event streams to WORM Storage and BigQuery"