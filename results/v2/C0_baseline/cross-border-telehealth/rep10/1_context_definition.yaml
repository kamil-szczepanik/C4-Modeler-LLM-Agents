level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "A cross-border telehealth platform providing video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US, ensuring strict regional data residency, regulatory compliance, and high availability."
elements:
  - type: "person"
    name: "Patients (EU / US)"
    description: "Patients located in the EU and US accessing telehealth services, video consultations, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed medical professionals providing video consultations and managing patient care."
  - type: "person"
    name: "Local Pharmacies"
    description: "Pharmacies receiving electronic prescriptions."
  - type: "person"
    name: "Compliance Auditors / Officers"
    description: "Officers responsible for auditing platform logs and ensuring regulatory compliance."
  - type: "externalSystem"
    name: "Third-Party Video Infrastructure"
    description: "Third-party WebRTC SFU / Twilio / Agora infrastructure for video consultations."
  - type: "externalSystem"
    name: "National e-Prescription Gateways (EU) and US Pharmacy Networks"
    description: "External gateways and networks (NCPDP / HL7 FHIR) for processing e-prescriptions."
  - type: "externalSystem"
    name: "Third-Party AI LLM/ML Provider / Vertex AI"
    description: "AI provider used for the symptom checker functionality."
  - type: "externalSystem"
    name: "Federated Identity Provider and Patient Consent Dashboard"
    description: "Manages federated identity and patient consent token management."
relationships:
  - source: "Patients (EU / US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses telehealth platform for video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS, WSS, TLS 1.3"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Conducts video consultations and manages patient care"
    technology: "HTTPS, WSS, TLS 1.3"
  - source: "Cross-Border Telehealth Platform"
    destination: "Third-Party Video Infrastructure"
    description: "Establishes video streams for consultations"
    technology: "WebRTC, DTLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "National e-Prescription Gateways (EU) and US Pharmacy Networks"
    description: "Sends and manages e-prescriptions"
    technology: "REST/FHIR, mTLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Third-Party AI LLM/ML Provider / Vertex AI"
    description: "Processes AI symptom checker requests"
    technology: "gRPC, HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Federated Identity Provider and Patient Consent Dashboard"
    description: "Authenticates users and verifies consent tokens"
    technology: "OAuth2/OIDC, FIDO2/WebAuthn MFA"