level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU/US)"
    description: "Patients located in the EU and US accessing telehealth services, video consultations, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed medical professionals providing video consultations and managing patient care."
  - type: "externalSystem"
    name: "Vertex AI"
    description: "Cloud-hosted AI model provider for the AI symptom checker."
  - type: "externalSystem"
    name: "National e-Prescription Gateways and Pharmacy Networks"
    description: "External systems for processing and transmitting e-prescriptions."
  - type: "container"
    name: "Regional API Gateway / BFF"
    technology: "Node.js, GraphQL"
    description: "Acts as the backend-for-frontend and entry point for client requests, routing traffic regionally."
  - type: "container"
    name: "Consent & Policy Engine"
    technology: ".NET"
    description: "Enforces strict regional data residency, consent management, and regulatory compliance."
  - type: "container"
    name: "Video Session Service"
    technology: "Go"
    description: "Manages real-time video consultations for patients and clinicians."
  - type: "container"
    name: "AI Orchestration Service"
    technology: "Python, FastAPI"
    description: "Orchestrates AI symptom checker requests and interfaces with Vertex AI."
  - type: "container"
    name: "FHIR & Prescription Integration Service"
    technology: ".NET"
    description: "Integrates with healthcare systems using FHIR standards and handles e-prescriptions."
  - type: "container"
    name: "Regional WORM Storage"
    technology: "GCP Cloud Storage, Cloud KMS"
    description: "Provides Write-Once-Read-Many storage with regional key segregation for compliance and audit logging."
relationships:
  - source: "Patients (EU/US)"
    destination: "Regional API Gateway / BFF"
    description: "Accesses telehealth platform services via GraphQL"
    technology: "HTTPS, GraphQL"
  - source: "Licensed Clinicians"
    destination: "Regional API Gateway / BFF"
    description: "Accesses telehealth platform services via GraphQL"
    technology: "HTTPS, GraphQL"
  - source: "Regional API Gateway / BFF"
    destination: "Consent & Policy Engine"
    description: "Verifies user consent and policies"
    technology: "gRPC, mTLS, Istio Service Mesh"
  - source: "Regional API Gateway / BFF"
    destination: "Video Session Service"
    description: "Initiates and manages video sessions"
    technology: "gRPC, mTLS, Istio Service Mesh"
  - source: "Regional API Gateway / BFF"
    destination: "AI Orchestration Service"
    description: "Sends AI symptom checker requests"
    technology: "gRPC, mTLS, Istio Service Mesh"
  - source: "Regional API Gateway / BFF"
    destination: "FHIR & Prescription Integration Service"
    description: "Processes e-prescriptions and health records"
    technology: "gRPC, mTLS, Istio Service Mesh"
  - source: "AI Orchestration Service"
    destination: "Vertex AI"
    description: "Sends requests for AI model inference"
    technology: "HTTPS, gRPC, VPC Service Controls"
  - source: "FHIR & Prescription Integration Service"
    destination: "National e-Prescription Gateways and Pharmacy Networks"
    description: "Transmits electronic prescriptions"
    technology: "REST/FHIR, mTLS"
  - source: "Consent & Policy Engine"
    destination: "Regional WORM Storage"
    description: "Stores compliance and policy records securely"
    technology: "TLS 1.3, Cloud KMS"
  - source: "Video Session Service"
    destination: "Regional WORM Storage"
    description: "Stores session logs securely"
    technology: "TLS 1.3, Cloud KMS"
  - source: "AI Orchestration Service"
    destination: "Regional WORM Storage"
    description: "Stores audit logs securely"
    technology: "TLS 1.3, Cloud KMS"
  - source: "FHIR & Prescription Integration Service"
    destination: "Regional WORM Storage"
    description: "Stores prescription data securely"
    technology: "TLS 1.3, Cloud KMS"