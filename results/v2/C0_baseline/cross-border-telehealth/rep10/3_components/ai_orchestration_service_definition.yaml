level: component
scope: "Component diagram for the AI Orchestration Service container"
parentContainer:
  name: "AI Orchestration Service"
elements:
  - type: "component"
    name: "API Router & Validator"
    technology: "FastAPI and Pydantic"
    description: "Validating payloads and enforcing JWT consent scopes."
  - type: "component"
    name: "Prompt & Context Assembler"
    technology: "Python"
    description: "Prepares localized prompts and strips PII/PHI."
  - type: "component"
    name: "Inference Client"
    technology: "gRPC/mTLS"
    description: "Interacts with GCP Vertex AI."
  - type: "component"
    name: "Audit Logger"
    technology: "Python / OpenTelemetry"
    description: "Captures immutable inputs, model versions, and outputs."
  - type: "component"
    name: "Resilience Handler"
    technology: "Python"
    description: "Implements circuit breaking and fallback urgency recommendations."
  - type: "component"
    name: "Regional WORM Storage"
    technology: "GCP Cloud Storage with Cloud KMS"
    description: "Secured via Cloud KMS and object retention policies."
  - type: "component"
    name: "Regional API Gateway / BFF"
    technology: "Istio Service Mesh / gRPC"
    description: "Forwards requests to the API Router."
  - type: "component"
    name: "Vertex AI"
    technology: "GCP Vertex AI"
    description: "Managed machine learning backend for symptom inference."
relationships:
  - source: "Regional API Gateway / BFF"
    destination: "API Router & Validator"
    description: "Forwards requests via gRPC, mTLS, and Istio Service Mesh."
  - source: "Inference Client"
    destination: "Vertex AI"
    description: "Executes remote model calls via gRPC/HTTPS within VPC Service Controls."
  - source: "Audit Logger"
    destination: "Regional WORM Storage"
    description: "Asynchronously flushes immutable logs via HTTPS using Cloud KMS."