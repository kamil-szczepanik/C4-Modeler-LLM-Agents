level: component
scope: "Component diagram for the FHIR & Prescription Integration Service container"
parentContainer:
  name: "FHIR & Prescription Integration Service"
elements:
  - type: "component"
    name: "Prescription Orchestrator"
    technology: ".NET Core"
    description: "Orchestrates the workflow for processing cross-border e-prescriptions."
  - type: "component"
    name: "FHIR Adapter"
    technology: ".NET Core"
    description: "Adapts and standardizes data formats to the FHIR standard."
  - type: "component"
    name: "EU Gateway Adapter"
    technology: ".NET Core"
    description: "Interfaces with National e-Prescription Gateways in the EU."
  - type: "component"
    name: "Validation & Mapping Validator"
    technology: ".NET Core"
    description: "Validates and maps payload data for regulatory compliance."
  - type: "component"
    name: "MassTransit & Notification Event Consumer"
    technology: "MassTransit / .NET Core"
    description: "Consumes asynchronous events and ensures reliable message processing."
relationships:
  - source: "Prescription Orchestrator"
    destination: "MassTransit & Notification Event Consumer"
    description: "Communicates via In-Process Bus"