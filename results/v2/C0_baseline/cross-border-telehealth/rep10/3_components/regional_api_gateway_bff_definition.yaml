level: component
scope: "Component diagram for the Regional API Gateway / BFF container"
parentContainer:
  name: "Regional API Gateway / BFF"
elements:
  - type: "component"
    name: "Routing & Geo-Enforcement Middleware"
    technology: "Node.js"
    description: "Enforces strict regional data residency and geo-compliance for incoming requests."
  - type: "component"
    name: "GraphQL Resolvers"
    technology: "Node.js, GraphQL"
    description: "Handles flexible data fetching and client requests for low-bandwidth rural clients."
  - type: "component"
    name: "Audit & Telemetry Interceptor"
    technology: "Node.js"
    description: "Captures audit logs and telemetry data, forwarding them to monitoring services."
  - type: "component"
    name: "Client Context & Policy Injector"
    technology: "Node.js"
    description: "Injects necessary client context and policy constraints into downstream service calls."
relationships:
  - source: "Routing & Geo-Enforcement Middleware"
    destination: "GraphQL Resolvers"
    description: "Routes validated requests to"
  - source: "GraphQL Resolvers"
    destination: "Audit & Telemetry Interceptor"
    description: "Triggers telemetry tracking via"
  - source: "Client Context & Policy Injector"
    destination: "GraphQL Resolvers"
    description: "Applies context to"