level: component
scope: "Component diagram for the Video Session Service container"
parentContainer:
  name: "Video Session Service"
elements:
  - type: "component"
    name: "Session Coordinator Component"
    technology: "Go"
    description: "Orchestrates media routing state."
  - type: "component"
    name: "SFU Media Proxy Component"
    technology: "Go, Pion WebRTC"
    description: "Relays encrypted streams and handles media proxying."
  - type: "component"
    name: "Quality Telemetry Logger Component"
    technology: "Go"
    description: "Persists cryptographically signed audit logs."
relationships:
  - source: "Session Coordinator Component"
    destination: "SFU Media Proxy Component"
    description: "Orchestrates media routing state [gRPC]"
  - source: "SFU Media Proxy Component"
    destination: "Third-Party Video Infrastructure"
    description: "Relays encrypted streams [WebRTC, SRTP, DTLS]"
  - source: "Quality Telemetry Logger Component"
    destination: "Regional WORM Storage"
    description: "Persists cryptographically signed audit logs [gRPC, TLS 1.3, Cloud KMS]"