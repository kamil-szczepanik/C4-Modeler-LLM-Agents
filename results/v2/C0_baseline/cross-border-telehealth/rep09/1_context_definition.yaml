level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides secure video consultations, e-prescriptions, and an AI symptom checker for patients across the EU and US while enforcing strict regional data residency."
elements:
  - type: "person"
    name: "Patients"
    description: "Patients in the EU and US accessing secure video consultations and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed medical professionals providing telehealth consultations and e-prescriptions."
  - type: "externalSystem"
    name: "National E-Prescription Gateways (EU) and US Pharmacy Networks"
    description: "External networks and gateways for processing national and regional e-prescriptions."
  - type: "externalSystem"
    name: "AI Symptom Checker Engine"
    description: "Engine providing AI-driven symptom analysis with immutable audit traceability."
  - type: "externalSystem"
    name: "Compliance / Regulatory Authorities and Medical Licensing Board Services"
    description: "External authorities and licensing boards ensuring regulatory compliance, medical licensing validation, and audit export."
relationships:
  - source: "Patients"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS/WebRTC (<300 kbit/s optimized)"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Conducts secure video consultations and manages prescriptions"
    technology: "HTTPS/WebRTC"
  - source: "Cross-Border Telehealth Platform"
    destination: "National E-Prescription Gateways (EU) and US Pharmacy Networks"
    description: "Sends e-prescription payloads"
    technology: "mTLS with REST/FHIR"
  - source: "Cross-Border Telehealth Platform"
    destination: "AI Symptom Checker Engine"
    description: "Processes symptom check requests"
    technology: "HTTPS/REST"
  - source: "Cross-Border Telehealth Platform"
    destination: "Compliance / Regulatory Authorities and Medical Licensing Board Services"
    description: "Validates medical licensing and exports secure audit logs"
    technology: "OAuth2/mTLS and REST/HTTPS"