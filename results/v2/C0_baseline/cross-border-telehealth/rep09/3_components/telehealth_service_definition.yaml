level: component
scope: "Component diagram for the Telehealth Service container"
parentContainer:
  name: "Telehealth Service"
elements:
  - type: "component"
    name: "Signaling Component"
    technology: "Go / WebRTC"
    description: "Handles signaling and session establishment for video consultations."
  - type: "component"
    name: "Media Gateway"
    technology: "SFU / Pion"
    description: "Manages media streams and relaying for video consultations."
  - type: "component"
    name: "Bandwidth Adaptation Engine"
    technology: "Go"
    description: "Adapts media bandwidth to maintain performance on unstable rural connections."
  - type: "component"
    name: "Session Audit Logger"
    technology: "Go"
    description: "Logs audit and compliance data for telehealth sessions."
  - type: "component"
    name: "Session Lifecycle Manager"
    technology: "Go"
    description: "Manages the lifecycle of telehealth sessions, triggering metadata and feedback logs."
relationships:
  - source: "Signaling Component"
    destination: "Consent & Identity Service"
    description: "Validates short-lived session tokens [gRPC / mTLS]"
  - source: "Session Lifecycle Manager"
    destination: "Prescription & Record Service"
    description: "Logs completed session metadata and feedback triggers [gRPC]"
  - source: "Telehealth Service"
    destination: "Regional TURN Relays"
    description: "Relays media streams under strict data residency constraints [TLS/DTLS/SRTP]"