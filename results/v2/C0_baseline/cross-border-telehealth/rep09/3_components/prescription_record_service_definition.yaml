level: component
scope: "Component diagram for the Prescription & Record Service container"
parentContainer:
  name: "Prescription & Record Service"
elements:
  - type: "component"
    name: "Prescription API Controller"
    technology: "Spring MVC"
    description: "Responsible for processing, translating, and securely dispatching e-prescriptions."
  - type: "component"
    name: "FHIR / National Adapter Engine"
    technology: "Spring Integration / Camel"
    description: "Bridges fragmented national e-prescription standards across the EU and US."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "Spring AOP"
    description: "Strictly enforces data residency and patient consent mandates."
  - type: "component"
    name: "Prescription State & Idempotency Manager"
    technology: "Spring Data JPA / Redis"
    description: "Manages prescription state and ensures idempotency tokens are checked and stored."
  - type: "component"
    name: "Consent & Identity Service"
    technology: "Keycloak / PostgreSQL"
    description: "Supporting service for validating patient consent and OAuth 2.0 JWT tokens."
  - type: "component"
    name: "Regional Pub/Sub"
    technology: "GCP"
    description: "Publishes asynchronous prescription payloads for decoupled dispatch."
  - type: "component"
    name: "External Gateways"
    technology: "National E-Prescription Gateways (EU) and US Pharmacy Networks"
    description: "External systems receiving HL7 FHIR and national standard payloads."
relationships:
  - source: "Prescription API Controller"
    destination: "Consent & Identity Service"
    description: "Validates patient consent and OAuth 2.0 JWT tokens via gRPC with mTLS"
  - source: "Prescription API Controller"
    destination: "Prescription State & Idempotency Manager"
    description: "Checks and stores idempotency tokens via JDBC and Redis"
  - source: "FHIR / National Adapter Engine"
    destination: "Regional Pub/Sub"
    description: "Publishes asynchronous prescription payloads for decoupled dispatch"
  - source: "FHIR / National Adapter Engine"
    destination: "External Gateways"
    description: "Sends HL7 FHIR and national standard payloads via outbound HTTPS/TLS 1.3 with mutual authentication"