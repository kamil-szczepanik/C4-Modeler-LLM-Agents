level: component
scope: "Component diagram for the Consent & Identity Service container"
parentContainer:
  name: "Consent & Identity Service"
elements:
  - type: "component"
    name: "Authentication Engine"
    technology: "Keycloak"
    description: "Handles user authentication, OAuth2/OIDC protocols, and issues short-lived tokens."
  - type: "component"
    name: "Consent Management Module"
    technology: "Keycloak Custom SPI"
    description: "Manages purpose-based GDPR and HIPAA consent records."
  - type: "component"
    name: "Identity Database"
    technology: "PostgreSQL (Cloud SQL)"
    description: "Persists user identity profiles, credentials, and consent data."
  - type: "component"
    name: "Token Cache"
    technology: "Redis (Memorystore)"
    description: "Provides low-latency token caching and revocation checks."
relationships:
  - source: "Authentication Engine"
    destination: "Identity Database"
    description: "Queries and updates user and consent data [JDBC / SQL]"
  - source: "Authentication Engine"
    destination: "Token Cache"
    description: "Checks token validity and revocation status [Redis Protocol]"
  - source: "Consent Management Module"
    destination: "Identity Database"
    description: "Stores and retrieves consent preferences [JDBC / SQL]"