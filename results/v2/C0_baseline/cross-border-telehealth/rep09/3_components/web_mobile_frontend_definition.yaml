# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Web/Mobile Frontend container"
parentContainer:
  name: "Web/Mobile Frontend"
elements:
  - type: "component"
    name: "Routing & State Component"
    technology: "Hive/SQLite"
    description: "Manages local state and offline-first data persistence using SQLite/Hive with AES-256 encrypted via device hardware keystores."
  - type: "component"
    name: "Video Consultation Component"
    technology: "WebRTC / Flutter"
    description: "Handles video and audio consultation streaming supporting adaptive bitrate scaling."
  - type: "component"
    name: "Consent & Triage UI Component"
    technology: "Flutter"
    description: "Provides user interfaces for managing granular consents and AI symptom check triage."
  - type: "component"
    name: "Region-Aware API Client"
    technology: "Flutter / HTTPS"
    description: "Executes dynamic regional API pinning and communicates with backend services via Regional Ingress."
relationships:
  - source: "Routing & State Component"
    destination: "Region-Aware API Client"
    description: "Provides locally cached data and state sync [Internal API]"
  - source: "Video Consultation Component"
    destination: "Telehealth Service"
    description: "Streams video and audio consultations [WebRTC / UDP]"
  - source: "Consent & Triage UI Component"
    destination: "AI Orchestrator & Audit Service"
    description: "Requests symptom check triage and recommendations [HTTPS/REST]"
  - source: "Region-Aware API Client"
    destination: "Regional Ingress"
    description: "Routes all API, WebSocket, and WebRTC traffic [HTTPS, WebSockets, WebRTC / TLS 1.3]"
  - source: "Consent & Triage UI Component"
    destination: "Consent & Identity Service"
    description: "Authenticates users and manages granular consents [OAuth2/OIDC]"