level: component
scope: "Component diagram for the Regional Ingress container"
parentContainer:
  name: "Regional Ingress"
elements:
  - type: "component"
    name: "GCP Cloud Armor"
    technology: "Google Cloud Platform"
    description: "Provides edge-level DDoS defense, adaptive rate limiting, and geo-detection."
  - type: "component"
    name: "Global External HTTP(S) Load Balancer"
    technology: "GCP Load Balancing"
    description: "Forwards incoming TCP/HTTPS streams via internal VPC to the edge proxy."
  - type: "component"
    name: "Envoy Edge Proxy"
    technology: "Envoy"
    description: "Handles TLS 1.3 termination, WebSocket upgrades, and traffic routing."
  - type: "component"
    name: "Envoy WASM Route & Policy Enforcer"
    technology: "WASM Extension"
    description: "Invokes in-process synchronous inspection, custom policy enforcement, JWT validation, and geo-pinning."
relationships:
  - source: "Global External HTTP(S) Load Balancer"
    destination: "Envoy Edge Proxy"
    description: "Forwards TCP/HTTPS streams via internal VPC"
  - source: "Envoy Edge Proxy"
    destination: "Envoy WASM Route & Policy Enforcer"
    description: "Invokes in-process synchronous inspection"
  - source: "Envoy WASM Route & Policy Enforcer"
    destination: "Downstream Containers"
    description: "Routes verified traffic via gRPC and mTLS (SPIFFE/SPIRE)"