level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients accessing secure video consultations, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed medical professionals providing telehealth consultations and issuing e-prescriptions."
  - type: "person"
    name: "Compliance Officers / Auditors"
    description: "Personnel responsible for monitoring compliance, regional data residency, and audit trails."
  - type: "externalSystem"
    name: "National E-Prescription Gateways (EU) and US Pharmacy Networks"
    description: "External national and regional prescription networks."
  - type: "container"
    name: "Regional Ingress"
    technology: "Cloud Load Balancing & Envoy"
    description: "Manages regional traffic ingress and secure routing."
  - type: "container"
    name: "Web/Mobile Frontend"
    technology: "Flutter"
    description: "Enables offline-first client state for low-bandwidth rural connections."
  - type: "container"
    name: "Telehealth Service"
    technology: "Go / WebRTC"
    description: "Manages low-latency media streams with global regional TURN relays."
  - type: "container"
    name: "Prescription & Record Service"
    technology: "Java / Spring Boot"
    description: "Abstracts fragmented EU and US e-prescription standards."
  - type: "container"
    name: "AI Orchestrator & Audit Service"
    technology: "Python / FastAPI"
    description: "Orchestrates AI symptom checker with immutable audit logging."
  - type: "container"
    name: "Consent & Identity Service"
    technology: "Keycloak / PostgreSQL"
    description: "Manages identity, OAuth2/OIDC, and per-purpose GDPR/HIPAA consent."
relationships:
  - source: "Patients"
    destination: "Regional Ingress"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS / WSS"
  - source: "Licensed Clinicians"
    destination: "Regional Ingress"
    description: "Conducts secure video consultations and manages prescriptions"
    technology: "HTTPS / WSS"
  - source: "Compliance Officers / Auditors"
    destination: "Regional Ingress"
    description: "Accesses audit logs and compliance controls"
    technology: "HTTPS"
  - source: "Web/Mobile Frontend"
    destination: "Telehealth Service"
    description: "Streams video consultations"
    technology: "WebRTC / UDP"
  - source: "Web/Mobile Frontend"
    destination: "Consent & Identity Service"
    description: "Authenticates users and manages consent"
    technology: "OAuth2/OIDC / HTTPS"
  - source: "Prescription & Record Service"
    destination: "National E-Prescription Gateways (EU) and US Pharmacy Networks"
    description: "Sends prescription payloads"
    technology: "HL7 FHIR / national standards"
  - source: "AI Orchestrator & Audit Service"
    destination: "Regional Ingress"
    description: "Communicates internally via secure routing"
    technology: "gRPC with mTLS"
  - source: "Telehealth Service"
    destination: "Consent & Identity Service"
    description: "Validates identity and authorization"
    technology: "gRPC with mTLS"
  - source: "Prescription & Record Service"
    destination: "Consent & Identity Service"
    description: "Validates prescription access consent"
    technology: "gRPC with mTLS"