level: component
scope: "Component diagram for the Video Consultation Service container"
parentContainer:
  name: "Video Consultation Service"
elements:
  - type: "component"
    name: "SFU Media Router"
    technology: "LiveKit Core"
    description: "Streams real-time media and powers real-time video with dynamic codec step-down for low-bandwidth resilience."
  - type: "component"
    name: "Session Signaling Controller"
    technology: "Go"
    description: "Manages session signaling and publishes emergency escalation alerts."
  - type: "component"
    name: "Clinical Integration Hook"
    technology: "Go"
    description: "Handles clinical integration hooks and interoperability."
  - type: "component"
    name: "Network Diagnostics Agent"
    technology: "Go"
    description: "Monitors and diagnoses network conditions for low-bandwidth resilience."
  - type: "component"
    name: "Post-Call Telemetry Handler"
    technology: "Go"
    description: "Handles post-call telemetry, session ratings, and QoS metrics."
relationships:
  - source: "SFU Media Router"
    destination: "Session Signaling Controller"
    description: "Coordinates media sessions with signaling [gRPC]"
  - source: "Session Signaling Controller"
    destination: "Clinical Integration Hook"
    description: "Triggers clinical hooks during sessions [Internal API]"
  - source: "Network Diagnostics Agent"
    destination: "SFU Media Router"
    description: "Provides network diagnostics for codec adjustments [Internal API]"
  - source: "Post-Call Telemetry Handler"
    destination: "Session Signaling Controller"
    description: "Collects session metrics upon call completion [Internal API]"