level: component
scope: "Component diagram for the Security & Secret Management container"
parentContainer:
  name: "Security & Secret Management"
elements:
  - type: "component"
    name: "Regional KMS Adapter"
    technology: "Cloud KMS with CMEK"
    description: "Handles regional key pinning and encryption operations to satisfy strict EU/US data residency mandates."
  - type: "component"
    name: "Secret Management Service"
    technology: "Google Secret Manager"
    description: "Stores and manages sensitive credentials and configuration secrets securely."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "Cloud Audit Logs / Google BigQuery"
    description: "Records audit trails and compliance events for GDPR, HIPAA, and MDR."
  - type: "component"
    name: "Ephemeral Credential Broker & Circuit Breaker Sidecar"
    technology: "SPIFFE/SPIRE with mTLS"
    description: "Provides local gRPC credential brokering, short-lived tokens, and circuit breaking for high availability."
relationships:
  - source: "Core Telehealth & E-Prescription"
    destination: "Ephemeral Credential Broker & Circuit Breaker Sidecar"
    description: "Local gRPC via mTLS (SPIFFE/SPIRE)"
  - source: "Ephemeral Credential Broker & Circuit Breaker Sidecar"
    destination: "Regional KMS Adapter"
    description: "HTTPS / gRPC with Workload Identity"
  - source: "Ephemeral Credential Broker & Circuit Breaker Sidecar"
    destination: "Secret Management Service"
    description: "HTTPS / gRPC with Workload Identity"
  - source: "Audit & Compliance Logger"
    destination: "Google BigQuery"
    description: "Cloud Pub/Sub / Streaming Inserts"