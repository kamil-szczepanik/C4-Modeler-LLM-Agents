level: component
scope: "Component diagram for the Notification & Messaging container"
parentContainer:
  name: "Notification & Messaging"
elements:
  - type: "component"
    name: "Notification Orchestrator"
    technology: "Node.js on Cloud Run"
    description: "Orchestrates asynchronous alerts and manages the notification workflow."
  - type: "component"
    name: "Consent Enforcer"
    technology: "Node.js on Cloud Run"
    description: "Validates recipient communication preferences and ensures regulatory compliance."
  - type: "component"
    name: "Channel Adapters"
    technology: "Node.js on Cloud Run"
    description: "Dispatches outbound alerts to external messaging gateways."
  - type: "component"
    name: "Token Signer / Deep Link Generator"
    technology: "Node.js on Cloud Run"
    description: "Generates secure tokens and deep links for notifications."
  - type: "component"
    name: "Google Cloud Pub/Sub"
    technology: "Google Cloud Pub/Sub"
    description: "Asynchronous messaging with regional topics for data residency."
  - type: "component"
    name: "Google Cloud Memorystore (Redis)"
    technology: "Google Cloud Memorystore (Redis)"
    description: "Enforces idempotent delivery and prevents duplicate alerts on unstable networks."
  - type: "component"
    name: "Google Cloud KMS / CMEK"
    technology: "Google Cloud KMS"
    description: "Provides encryption at rest via customer-managed encryption keys."
  - type: "component"
    name: "Google Secret Manager"
    technology: "Google Secret Manager"
    description: "Manages cryptographic keys and application secrets."
  - type: "component"
    name: "Firebase Cloud Messaging (FCM) / Apple Push Notification service (APNs)"
    technology: "FCM / APNs"
    description: "Multi-channel mobile push delivery."
  - type: "component"
    name: "Twilio SMS Gateway"
    technology: "Twilio"
    description: "SMS fallback and text message distribution."
  - type: "component"
    name: "Consent Management Service"
    technology: "External Service"
    description: "Manages user consent and preferences."
  - type: "component"
    name: "BigQuery"
    technology: "Google Cloud BigQuery"
    description: "Stores delivery metrics and audit logs."
relationships:
  - source: "Google Cloud Pub/Sub"
    destination: "Notification Orchestrator"
    description: "Consumes regional events via gRPC"
  - source: "Notification Orchestrator"
    destination: "Google Cloud Memorystore (Redis)"
    description: "Enforces idempotent delivery using Redis"
  - source: "Consent Enforcer"
    destination: "Consent Management Service"
    description: "Validates recipient communication preferences via HTTPS/REST"
  - source: "Channel Adapters"
    destination: "Firebase Cloud Messaging (FCM) / Apple Push Notification service (APNs)"
    description: "Dispatches outbound alerts using HTTPS/REST with TLS 1.3 and mTLS"
  - source: "Channel Adapters"
    destination: "Twilio SMS Gateway"
    description: "Dispatches outbound alerts using HTTPS/REST with TLS 1.3 and mTLS"
  - source: "Notification & Messaging"
    destination: "BigQuery"
    description: "Emits delivery metrics and audit logs"