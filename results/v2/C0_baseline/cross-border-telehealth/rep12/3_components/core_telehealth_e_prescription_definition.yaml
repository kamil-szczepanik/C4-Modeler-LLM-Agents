level: component
scope: "Component diagram for the Core Telehealth & E-Prescription container"
parentContainer:
  name: "Core Telehealth & E-Prescription"
elements:
  - type: "component"
    name: "Telehealth Workflow Manager"
    technology: "Spring Boot / Spring Security / Spring Integration"
    description: "Manages core telehealth workflows and patient-clinician interactions."
  - type: "component"
    name: "E-Prescription Engine"
    technology: "Spring Boot / Spring Security / Spring Integration"
    description: "Handles e-prescription generation and processing logic."
  - type: "component"
    name: "Consent Enforcement Interceptor"
    technology: "Spring Boot / Spring Security / Spring Integration"
    description: "Enforces JIT consent validation for requests."
  - type: "component"
    name: "Prescription Dispatcher Adapter"
    technology: "Spring Boot / Spring Security / Spring Integration"
    description: "Adapts and dispatches prescriptions to external gateways and networks."
  - type: "component"
    name: "Dead-Letter & Retry Queue Handler"
    technology: "Spring Boot / Spring Security / Spring Integration"
    description: "Handles message retries and dead-letter queueing for asynchronous operations."
  - type: "component"
    name: "Crypto & Signing Service"
    technology: "Spring Boot / BouncyCastle / Google Cloud KMS"
    description: "Provides cryptographic signing, envelope encryption, and PHI protection."
relationships:
  - source: "Consent Enforcement Interceptor"
    destination: "Consent Management Service"
    description: "gRPC with JIT validation"
  - source: "Core Telehealth & E-Prescription"
    destination: "EU National E-Prescription Gateways"
    description: "REST, HL7 FHIR over HTTPS, mTLS"
  - source: "Core Telehealth & E-Prescription"
    destination: "US Pharmacy Networks"
    description: "REST, HL7 FHIR over HTTPS, mTLS"
  - source: "Prescription Dispatcher Adapter"
    destination: "Dead-Letter & Retry Queue Handler"
    description: "In-process Java method call"
  - source: "Dead-Letter & Retry Queue Handler"
    destination: "Cloud Pub/Sub"
    description: "Google Cloud Pub/Sub with envelope encryption"
  - source: "E-Prescription Engine"
    destination: "Crypto & Signing Service"
    description: "In-process Java method call"
  - source: "Core Telehealth & E-Prescription"
    destination: "Cloud Logging & BigQuery"
    description: "Google Cloud Logging, BigQuery"