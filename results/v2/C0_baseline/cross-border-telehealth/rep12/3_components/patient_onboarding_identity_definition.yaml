level: component
scope: "Component diagram for the Patient Onboarding & Identity container"
parentContainer:
  name: "Patient Onboarding & Identity"
elements:
  - type: "component"
    name: "Edge Registration API"
    technology: "Cloud Run / Node.js or Go"
    description: "Handles lightweight edge routing and forwards authenticated onboarding requests."
  - type: "component"
    name: "Identity Core Engine"
    technology: "GKE / Spring Boot"
    description: "Processes core identity microservices logic, identity workflows, and delegates to regional data stores."
  - type: "component"
    name: "Data Residency Router & Regional Data Store Gateway"
    technology: "GKE / Regional Gateway"
    description: "Enforces geo-partitioning and routes data to ensure compliance with data residency mandates."
relationships:
  - source: "Edge Registration API"
    destination: "Identity Core Engine"
    description: "Delegates processing of identity workflows [Internal gRPC over mTLS]"
  - source: "Identity Core Engine"
    destination: "Data Residency Router & Regional Data Store Gateway"
    description: "Enforces geo-partitioning and stores profile data [gRPC over mTLS]"