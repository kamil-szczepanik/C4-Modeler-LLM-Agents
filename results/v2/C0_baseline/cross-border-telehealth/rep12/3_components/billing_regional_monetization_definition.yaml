level: component
scope: "Component diagram for the Billing & Regional Monetization container"
parentContainer:
  name: "Billing & Regional Monetization"
elements:
  - type: "component"
    name: "Transaction Router Component"
    technology: "Spring Boot on GKE"
    description: "Routes payment and billing requests, executes charges and reversals."
  - type: "component"
    name: "Tax & Invoicing Engine Component"
    technology: "Spring Boot on GKE"
    description: "Requests regional tax calculations and publishes invoice events."
  - type: "component"
    name: "Refund & Dispute Handler Component"
    technology: "Spring Boot on GKE"
    description: "Handles refunds and payment disputes."
  - type: "component"
    name: "Billing Audit Logger Component"
    technology: "Spring Boot on GKE"
    description: "Writes tamper-proof audit trails for financial transactions."
  - type: "component"
    name: "Ledger & Persistence Layer"
    technology: "PostgreSQL on GKE"
    description: "Regionally isolated relational data storage."
relationships:
  - source: "Cloud Load Balancing / API Gateway"
    destination: "Transaction Router Component"
    description: "Routes payment and billing requests [gRPC over mTLS]"
  - source: "Transaction Router Component"
    destination: "Regional Payment Gateways"
    description: "Executes charges and reversals [HTTPS]"
  - source: "Transaction Router Component"
    destination: "Tax & Invoicing Engine Component"
    description: "Requests regional tax calculations [In-process / gRPC]"
  - source: "Transaction Router Component"
    destination: "Cloud Pub/Sub"
    description: "Publishes payment and refund events [gRPC]"
  - source: "Tax & Invoicing Engine Component"
    destination: "Cloud Pub/Sub"
    description: "Consumes billing events and publishes invoice events [gRPC]"
  - source: "Billing Audit Logger Component"
    destination: "Cloud Logging & BigQuery"
    description: "Writes tamper-proof audit trails [HTTPS]"