level: component
scope: "Component diagram for the AI Symptom Checker container"
parentContainer:
  name: "AI Symptom Checker"
elements:
  - type: "component"
    name: "API Router"
    technology: "Python / FastAPI"
    description: "Routes incoming API requests to the appropriate handlers within the AI Symptom Checker."
  - type: "component"
    name: "Triage Orchestrator"
    technology: "Python / FastAPI"
    description: "Orchestrates the symptom checking and triage workflow logic."
  - type: "component"
    name: "LLM/Inference Adapter"
    technology: "Vertex AI"
    description: "Adapts and interfaces with the LLM for regional AI symptom analysis with traceable model versions."
  - type: "component"
    name: "Audit & Traceability Logger"
    technology: "Python / FastAPI"
    description: "Logs audit and traceability data asynchronously via Google Cloud Pub/Sub."
  - type: "component"
    name: "Localization & Terminology Adapter"
    technology: "Python / FastAPI"
    description: "Handles localization and medical terminology mapping for EU and US patients."
  - type: "component"
    name: "Clinical Handoff Dispatcher"
    technology: "Python / FastAPI"
    description: "Dispatches clinical handoffs for urgent consultations via Google Cloud Pub/Sub."
relationships:
  - source: "Triage Orchestrator"
    destination: "LLM/Inference Adapter"
    description: "In-Memory"
  - source: "Triage Orchestrator"
    destination: "Audit & Traceability Logger"
    description: "Async via Google Cloud Pub/Sub"
  - source: "Clinical Handoff Dispatcher"
    destination: "Google Cloud Pub/Sub"
    description: "gRPC"