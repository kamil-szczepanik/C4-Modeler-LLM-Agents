level: component
scope: "Component diagram for the Cloud Load Balancing / API Gateway container"
parentContainer:
  name: "Cloud Load Balancing / API Gateway"
elements:
  - type: "component"
    name: "Global External HTTP(S) Load Balancer"
    technology: "GCP Anycast IP, Cloud Armor"
    description: "Sends geo-routed client traffic and provides edge security."
  - type: "component"
    name: "API Gateway"
    technology: "Envoy-based"
    description: "Forwards inspected HTTP/HTTPS and WSS traffic and coordinates with rate limiting."
  - type: "component"
    name: "Distributed Rate Limiting & Quota Service"
    technology: "Cloud Memorystore for Redis"
    description: "Evaluates traffic quotas and retry legitimacy."
  - type: "component"
    name: "mTLS Termination & Upstream Router"
    technology: "Anthos Service Mesh, Envoy Proxy"
    description: "Hands off validated, rate-limited requests and routes backend requests."
relationships:
  - source: "Global External HTTP(S) Load Balancer"
    destination: "API Gateway"
    description: "Forwards inspected HTTP/HTTPS and WSS traffic [Internal HTTPS]"
  - source: "API Gateway"
    destination: "Distributed Rate Limiting & Quota Service"
    description: "Evaluates traffic quotas and retry legitimacy [gRPC]"
  - source: "API Gateway"
    destination: "mTLS Termination & Upstream Router"
    description: "Hands off validated, rate-limited requests [gRPC]"