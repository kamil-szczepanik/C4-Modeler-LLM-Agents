level: component
scope: "Component diagram for the Web/Mobile Client Applications container"
parentContainer:
  name: "Web/Mobile Client Applications"
elements:
  - type: "component"
    name: "API Client & Routing Module"
    technology: "Flutter & React Native HTTP/WebSocket Client"
    description: "Handles communication with the API Gateway, managing secure HTTPS requests and WebSocket connections."
  - type: "component"
    name: "WebRTC Video Module"
    technology: "LiveKit Client SDK"
    description: "Manages real-time video consultations, dynamic bitrate adaptation, and direct connection to the LiveKit SFU."
  - type: "component"
    name: "Offline Caching Module"
    technology: "WatermelonDB / Hive"
    description: "Provides local offline-first data caching to support rural patients with unstable connections."
  - type: "component"
    name: "Notification & Messaging Handler"
    technology: "APNS, FCM, and WebSockets Client"
    description: "Receives and handles push notifications and real-time messaging updates from backend services."
relationships:
  - source: "API Client & Routing Module"
    destination: "Cloud Load Balancing / API Gateway"
    description: "Sends API requests and establishes WebSockets via HTTPS, WSS"
  - source: "WebRTC Video Module"
    destination: "LiveKit WebRTC SFU on Google Kubernetes Engine (GKE)"
    description: "Streams live video consultations via WebRTC"
  - source: "Notification & Messaging Handler"
    destination: "Web/Mobile Client Applications"
    description: "Delivers push notifications and messages via APNS, FCM, WebSockets"