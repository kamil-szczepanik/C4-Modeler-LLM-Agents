level: component
scope: "Component diagram for the Consent Management Service container"
parentContainer:
  name: "Consent Management Service"
elements:
  - type: "component"
    name: "Consent REST Controller"
    technology: "Spring Boot & Spring Security (OAuth2/JWT)"
    description: "Handles HTTPS/REST requests from patients and mobile clients for consent management."
  - type: "component"
    name: "Consent Policy Engine"
    technology: "Spring Boot"
    description: "Performs granular policy evaluation, instant revocation, and includes the Break-Glass Protocol."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "Spring Boot with Metadata Enricher"
    description: "Generates cryptographic audit logs and pushes compliance events."
  - type: "component"
    name: "Consent Persistence Adapter"
    technology: "JPA / Hibernate"
    description: "Manages data persistence and retrieval against regional PostgreSQL instances."
  - type: "component"
    name: "Google Cloud Pub/Sub"
    technology: "Google Cloud Pub/Sub"
    description: "Asynchronous event messaging for cache invalidation and audit logging."
  - type: "component"
    name: "Regional PostgreSQL Instances"
    technology: "PostgreSQL"
    description: "Stores consent records and ensures strict regional data isolation."
  - type: "component"
    name: "Redis Cache"
    technology: "Redis / Spring Cache"
    description: "Provides low-latency local read-through caching for policy evaluation."
relationships:
  - source: "Patients and Mobile Clients"
    destination: "Consent REST Controller"
    description: "Invoke via HTTPS/REST (OAuth2/JWT)"
  - source: "Core Telehealth"
    destination: "Consent Policy Engine"
    description: "Communicates via gRPC with mTLS (Istio service mesh)"
  - source: "Consent Policy Engine"
    destination: "Consent Persistence Adapter"
    description: "Uses JPA/Hibernate"
  - source: "Consent Persistence Adapter"
    destination: "Regional PostgreSQL Instances"
    description: "Queries regional data"
  - source: "Consent Policy Engine"
    destination: "Redis Cache"
    description: "Interacts via Spring Cache for low-latency reads"
  - source: "Audit & Compliance Logger"
    destination: "Google Cloud Pub/Sub"
    description: "Pushes events"
  - source: "Audit & Compliance Logger"
    destination: "BigQuery"
    description: "Pushes audit logs"