level: component
scope: "Component diagram for the Cloud Logging & BigQuery container"
parentContainer:
  name: "Cloud Logging & BigQuery"
elements:
  - type: "component"
    name: "Log Ingestion & Routing Engine"
    technology: "Google Cloud Logging Sinks, Cloud Pub/Sub"
    description: "Ingests and routes structured logs and telemetry from GKE & Cloud Run Services, enforcing regional data residency."
  - type: "component"
    name: "Audit & Compliance Data Store"
    technology: "BigQuery Partitioned Datasets, Cloud KMS"
    description: "Stores region-segregated, pseudonymized logs with WORM retention policies and customer-managed encryption keys."
  - type: "component"
    name: "Analytics & BI Exporter"
    technology: "BigQuery Authorized Views, Column-Level Masking"
    description: "Exposes anonymized metrics and aggregated KPIs while protecting sensitive patient data."
  - type: "component"
    name: "Clinical Insights Dashboard"
    technology: "Looker Studio Enterprise"
    description: "Feeds aggregated KPIs and clinical metrics for quality monitoring via secure authenticated connections."
  - type: "component"
    name: "Security & Infrastructure"
    technology: "Cloud KMS, Cloud Monitoring"
    description: "Provides cryptographic isolation and operational monitoring for regulatory compliance."
relationships:
  - source: "Log Ingestion & Routing Engine"
    destination: "Audit & Compliance Data Store"
    description: "Stores region-segregated, pseudonymized logs [BigQuery SQL, Google Cloud Pub/Sub]"
  - source: "Audit & Compliance Data Store"
    destination: "Analytics & BI Exporter"
    description: "Exposes anonymized metrics [BigQuery Authorized Views, Column-Level Masking]"
  - source: "Analytics & BI Exporter"
    destination: "Clinical Insights Dashboard"
    description: "Feeds aggregated KPIs and clinical metrics [HTTPS, OAuth2/OIDC]"