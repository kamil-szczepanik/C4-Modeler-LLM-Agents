level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "End users who access video consultations, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals who conduct video consultations and issue e-prescriptions to patients."
  - type: "person"
    name: "Pharmacies"
    description: "Entities that receive and fulfill e-prescriptions across regional networks."
  - type: "person"
    name: "Compliance Officers/Auditors"
    description: "Personnel responsible for ensuring regulatory compliance, auditing logs, and maintaining data residency standards."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways"
    description: "External national gateways for managing e-prescriptions within the EU."
  - type: "externalSystem"
    name: "US Pharmacy Networks"
    description: "External networks used to process prescriptions in the United States."
  - type: "externalSystem"
    name: "External Identity Providers"
    description: "Identity verification systems such as eIDAS and Login.gov."
  - type: "externalSystem"
    name: "Regional Payment Gateways"
    description: "Payment processors such as Stripe EU/US for handling regional transactions."
  - type: "container"
    name: "Web/Mobile Client Applications"
    technology: "Flutter / React Native"
    description: "Cross-platform client applications providing user interfaces for video consultations, e-prescriptions, and the AI symptom checker."
  - type: "container"
    name: "Cloud Load Balancing / API Gateway"
    technology: "OAuth2/OIDC, TLS 1.3"
    description: "Manages external client-to-gateway traffic, handling authentication and routing."
  - type: "container"
    name: "Video Consultation Service"
    technology: "LiveKit WebRTC SFU on GKE"
    description: "Provides real-time video consultations with dynamic codec step-down for low-bandwidth resilience."
  - type: "container"
    name: "AI Symptom Checker"
    technology: "Python / FastAPI on Cloud Run"
    description: "Provides serverless scaling for AI-powered patient symptom analysis."
  - type: "container"
    name: "Consent Management Service"
    technology: "Spring Boot on GKE"
    description: "Handles patient consent and regulatory compliance tracking."
  - type: "container"
    name: "Patient Onboarding & Identity"
    technology: "GKE / Cloud Run"
    description: "Manages user registration, profile creation, and identity verification."
  - type: "container"
    name: "Billing & Regional Monetization"
    technology: "GKE / Cloud Run"
    description: "Handles regional transactions and integration with payment gateways."
  - type: "container"
    name: "Core Telehealth & E-Prescription"
    technology: "Spring Boot on GKE"
    description: "Manages core telehealth workflows and e-prescription processing."
  - type: "container"
    name: "Notification & Messaging"
    technology: "Node.js on Cloud Run"
    description: "Sends asynchronous push alerts and SMS notifications."
  - type: "container"
    name: "Cloud Pub/Sub"
    technology: "Google Cloud Pub/Sub"
    description: "Buffers asynchronous push alerts and messaging."
  - type: "container"
    name: "Cloud Logging & BigQuery"
    technology: "Google Cloud Logging, BigQuery"
    description: "Collects system logs and provides audit traceability and analytics."
  - type: "container"
    name: "Security & Secret Management"
    technology: "Google Cloud KMS (CMEK), Google Secret Manager"
    description: "Provides region-separated envelope encryption and secret management."
relationships:
  - source: "Patients"
    destination: "Web/Mobile Client Applications"
    description: "Accesses telehealth platform features via client applications"
    technology: "Flutter, React Native"
  - source: "Licensed Clinicians"
    destination: "Web/Mobile Client Applications"
    description: "Conducts consultations and manages prescriptions via client applications"
    technology: "Flutter, React Native"
  - source: "Web/Mobile Client Applications"
    destination: "Cloud Load Balancing / API Gateway"
    description: "Sends external client-to-gateway traffic"
    technology: "HTTPS, WebSockets (WSS)"
  - source: "Cloud Load Balancing / API Gateway"
    destination: "Video Consultation Service"
    description: "Routes real-time video session traffic"
    technology: "gRPC over mTLS"
  - source: "Cloud Load Balancing / API Gateway"
    destination: "AI Symptom Checker"
    description: "Routes symptom checking requests"
    technology: "gRPC over mTLS"
  - source: "Cloud Load Balancing / API Gateway"
    destination: "Core Telehealth & E-Prescription"
    description: "Routes core telehealth requests"
    technology: "gRPC over mTLS"
  - source: "Cloud Load Balancing / API Gateway"
    destination: "Patient Onboarding & Identity"
    description: "Routes authentication and identity requests"
    technology: "gRPC over mTLS"
  - source: "Cloud Load Balancing / API Gateway"
    destination: "Billing & Regional Monetization"
    description: "Routes payment and billing requests"
    technology: "gRPC over mTLS"
  - source: "Core Telehealth & E-Prescription"
    destination: "EU National E-Prescription Gateways"
    description: "Exchanges prescription data with EU national gateways"
    technology: "REST, HL7 FHIR over HTTPS"
  - source: "Core Telehealth & E-Prescription"
    destination: "US Pharmacy Networks"
    description: "Exchanges prescription data with US pharmacy networks"
    technology: "REST, HL7 FHIR over HTTPS"
  - source: "Patient Onboarding & Identity"
    destination: "External Identity Providers"
    description: "Authenticates users via external identity systems"
    technology: "OIDC, SAML"
  - source: "Billing & Regional Monetization"
    destination: "Regional Payment Gateways"
    description: "Processes regional payment transactions"
    technology: "HTTPS"
  - source: "Notification & Messaging"
    destination: "Web/Mobile Client Applications"
    description: "Delivers asynchronous push alerts and SMS notifications"
    technology: "Cloud Pub/Sub, WebSockets, APNS/FCM"
  - source: "Core Telehealth & E-Prescription"
    destination: "Cloud Pub/Sub"
    description: "Publishes messaging events for async processing"
    technology: "Google Cloud Pub/Sub"
  - source: "Video Consultation Service"
    destination: "Security & Secret Management"
    description: "Encrypts data using region-separated envelope encryption and secrets"
    technology: "Google Cloud KMS (CMEK), Secret Manager"
  - source: "Core Telehealth & E-Prescription"
    destination: "Cloud Logging & BigQuery"
    description: "Sends audit logs and telemetry data"
    technology: "Google Cloud Logging, BigQuery"