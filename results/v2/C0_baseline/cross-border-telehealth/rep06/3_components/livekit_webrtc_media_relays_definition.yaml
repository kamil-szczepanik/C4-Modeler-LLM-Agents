level: component
scope: "Component diagram for the LiveKit/WebRTC Media Relays container"
parentContainer:
  name: "LiveKit/WebRTC Media Relays"
elements:
  - type: "component"
    name: "TURN/STUN Server"
    technology: "Coturn"
    description: "Provides NAT traversal and connection establishment for patients and clinicians."
  - type: "component"
    name: "SFU Media Router"
    technology: "LiveKit (Go)"
    description: "Routes adaptive sub-300 kbit/s video streams for real-time telehealth consultations."
  - type: "component"
    name: "Telemetry & Stats Exporter"
    technology: "Prometheus exporter"
    description: "Emits network metrics and stream statistics for monitoring session quality."
relationships:
  - source: "SFU Media Router"
    destination: "Telemetry & Stats Exporter"
    description: "Emits network metrics [Internal IPC / Prometheus scrape]"