level: component
scope: "Component diagram for the Consent & Privacy Management Container container"
parentContainer:
  name: "Consent & Privacy Management Container"
elements:
  - type: "component"
    name: "Consent API Controller"
    technology: "Python / Go"
    description: "Exposes endpoints for managing consent and privacy calls."
  - type: "component"
    name: "Policy Decision Engine (OPA)"
    technology: "Open Policy Agent (OPA)"
    description: "Evaluates real-time access requests against stored consent rules for low-latency decisioning."
  - type: "component"
    name: "Cryptographic Token Service"
    technology: "Python / Go, Cloud KMS"
    description: "Secures regional JWT token signing, KMS rotation, and key management."
  - type: "component"
    name: "Audit & Ledger Logger"
    technology: "Python / Go"
    description: "Logs consent and privacy operations for auditing purposes."
  - type: "component"
    name: "Revocation Publisher"
    technology: "Redis Memorystore, Pub/Sub"
    description: "Publishes revocation events using Redis Pub/Sub for real-time invalidation."
relationships:
  - source: "Consent API Controller"
    destination: "Policy Decision Engine (OPA)"
    description: "Evaluates access requests via gRPC / mTLS"
  - source: "Consent API Controller"
    destination: "Cryptographic Token Service"
    description: "Requests token signing and key operations"
  - source: "Consent API Controller"
    destination: "Audit & Ledger Logger"
    description: "Sends audit logs"
  - source: "Consent API Controller"
    destination: "Revocation Publisher"
    description: "Publishes revocation events via Redis Pub/Sub"