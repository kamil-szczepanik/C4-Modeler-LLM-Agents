level: component
scope: "Component diagram for the Regional Data Storage container"
parentContainer:
  name: "Regional Data Storage"
elements:
  - type: "component"
    name: "Transaction Database"
    technology: "Cloud Spanner / Cloud SQL PostgreSQL"
    description: "Regional transaction databases ensuring ACID compliance and data residency."
  - type: "component"
    name: "Sync & Conflict Resolution Engine"
    technology: "Python / Go on GKE"
    description: "Synchronizes offline payloads and persists synchronized records."
  - type: "component"
    name: "Audit & WORM Ledger"
    technology: "Cloud Storage with Object Retention / BigQuery"
    description: "WORM ledger storage providing immutable, tamper-proof audit logs."
  - type: "component"
    name: "Key Management Module"
    technology: "Cloud KMS"
    description: "Regional Customer-Managed Encryption Keys (CMEK) ensuring cryptographic data isolation between EU and US."
  - type: "component"
    name: "Data Access Proxy"
    technology: "Go / Envoy"
    description: "High-performance proxy enforcing tenant-isolated, row-level secured queries."
relationships:
  - source: "Data Access Proxy"
    destination: "Transaction Database"
    description: "Executes tenant-isolated, row-level secured queries [SQL]"
  - source: "Data Access Proxy"
    destination: "Audit & WORM Ledger"
    description: "Asynchronously streams read/write access logs [Pub/Sub / gRPC]"
  - source: "Sync & Conflict Resolution Engine"
    destination: "Transaction Database"
    description: "Persists synchronized records [SQL]"