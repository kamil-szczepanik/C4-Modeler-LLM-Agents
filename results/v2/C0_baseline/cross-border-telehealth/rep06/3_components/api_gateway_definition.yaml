level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Regional API Gateway"
    technology: "Envoy"
    description: "Enables edge routing, WASM/Lua filters, and compression across europe-west3 and us-central1."
  - type: "component"
    name: "WAF Inspection"
    technology: "Google Cloud Armor"
    description: "Inspects incoming HTTPS traffic for security threats at the edge."
  - type: "component"
    name: "Rate Limiting Store"
    technology: "Redis"
    description: "Distributed cache supporting rate limiting and quota controls."
  - type: "component"
    name: "OpenTelemetry Collectors"
    technology: "OpenTelemetry"
    description: "Collects distributed traces and audit logs asynchronously."
relationships:
  - source: "Regional API Gateway"
    destination: "WAF Inspection"
    description: "Inspects traffic [HTTPS]"
  - source: "Regional API Gateway"
    destination: "Rate Limiting Store"
    description: "Queries rate limits and quotas"
  - source: "Regional API Gateway"
    destination: "OpenTelemetry Collectors"
    description: "Sends telemetry and audit logs [OTLP / gRPC, Async]"