level: component
scope: "Component diagram for the Patient Mobile/Web App container"
parentContainer:
  name: "Patient Mobile/Web App"
elements:
  - type: "component"
    name: "UI Presentation Layer"
    technology: "Flutter / React"
    description: "Renders the cross-platform user interface for patients across the EU and US."
  - type: "component"
    name: "State & Local Persistence Manager"
    technology: "SQLite / Secure Local Storage"
    description: "Manages encrypted local data storage and offline queuing for rural areas."
  - type: "component"
    name: "API Client & Auth Module"
    technology: "Dio / Axios with OIDC/OAuth2"
    description: "Handles secure token exchange, authentication, and API requests."
  - type: "component"
    name: "WebRTC Media Client"
    technology: "LiveKit SDK"
    description: "Manages low-bandwidth video streaming with audio-only fallback modes."
  - type: "component"
    name: "Localization & Accessibility Engine"
    technology: "i18next / Flutter Localization"
    description: "Provides localized and accessible UI components."
  - type: "component"
    name: "Post-Consultation & E-Prescription Viewer"
    technology: "Cross-platform UI Component"
    description: "Displays cached consultation summaries and prescription metadata."
relationships:
  - source: "UI Presentation Layer"
    destination: "Localization & Accessibility Engine"
    description: "Renders localized, accessible UI components [In-memory]"
  - source: "State & Local Persistence Manager"
    destination: "Post-Consultation & E-Prescription Viewer"
    description: "Supplies cached summaries and prescription metadata [In-memory]"