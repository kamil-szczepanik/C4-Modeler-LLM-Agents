level: component
scope: "Component diagram for the AI Orchestrator & Audit Service container"
parentContainer:
  name: "AI Orchestrator & Audit Service"
elements:
  - type: "component"
    name: "API Router & Sanitizer Component"
    technology: "Python/FastAPI"
    description: "Routes AI symptom checking and audit requests and provides local PII sanitization."
  - type: "component"
    name: "Orchestration Engine Component"
    technology: "Python/Go"
    description: "Orchestrates traceable AI triage and orchestrates requests."
  - type: "component"
    name: "Audit & WORM Writer Component"
    technology: "Go"
    description: "Writes immutable audit logs via WORM storage and BigQuery."
  - type: "component"
    name: "Consent-Aware Retention Worker Component"
    technology: "Python/Go"
    description: "Executes crypto-shredding of encryption keys for consent revocation."
relationships:
  - source: "API Router & Sanitizer Component"
    destination: "Orchestration Engine Component"
    description: "Forwards sanitized prompts for urgency recommendations"
  - source: "Orchestration Engine Component"
    destination: "Audit & WORM Writer Component"
    description: "Sends triage audit events"
  - source: "Audit & WORM Writer Component"
    destination: "Regional Data Storage"
    description: "Writes immutable audit logs via WORM storage / BigQuery"
  - source: "Consent-Aware Retention Worker Component"
    destination: "Google Cloud KMS"
    description: "Executes crypto-shredding of encryption keys"