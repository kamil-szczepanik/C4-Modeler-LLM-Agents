level: component
scope: "Component diagram for the Core Telehealth Service container"
parentContainer:
  name: "Core Telehealth Service"
elements:
  - type: "component"
    name: "Session Orchestrator"
    technology: "Go"
    description: "Manages telehealth sessions, coordinates video consultation streams, and handles session lifecycle."
  - type: "component"
    name: "Consent Interceptor"
    technology: "Go / gRPC"
    description: "Validates real-time patient consent tokens by communicating with the Consent & Privacy Management Container."
  - type: "component"
    name: "Audit Logger"
    technology: "Go"
    description: "Records audit logs for compliance, security tracking, and regulatory requirements (GDPR, HIPAA)."
  - type: "component"
    name: "ABAC Policy Engine"
    technology: "Open Policy Agent (OPA)"
    description: "Queries and evaluates access rights and consent scopes using attribute-based access control."
  - type: "component"
    name: "Graceful State Manager"
    technology: "Go / Redis"
    description: "Manages transient session states and provides resilience during degraded connectivity."
relationships:
  - source: "Session Orchestrator"
    destination: "LiveKit/WebRTC Media Relays"
    description: "Manages video consultation streams [SRTP / DTLS]."
  - source: "Consent Interceptor"
    destination: "Consent & Privacy Management Container"
    description: "Validates real-time patient consent tokens [gRPC / mTLS]."
  - source: "Session Orchestrator"
    destination: "ABAC Policy Engine"
    description: "Queries access rights and consent scopes [In-memory Go function call / Open Policy Agent]."
  - source: "Session Orchestrator"
    destination: "Regional Data Storage"
    description: "Reads and writes regionally-scoped patient data and session states [SQL / Redis / Cloud KMS]."
  - source: "Graceful State Manager"
    destination: "Regional Data Storage"
    description: "Persists and synchronizes transient session states [Redis]."