level: component
scope: "Component diagram for the Interoperability & E-Prescription Adapter container"
parentContainer:
  name: "Interoperability & E-Prescription Adapter"
elements:
  - type: "component"
    name: "FHIR Translation Engine"
    technology: "Python / Go"
    description: "Translates and standardizes medical data formats into HL7 FHIR for seamless cross-border interoperability."
  - type: "component"
    name: "EU Gateway Translator"
    technology: "Python / Go"
    description: "Adapts and formats prescription payloads specifically for EU National E-Prescription Gateways."
  - type: "component"
    name: "Regional Routing Dispatcher"
    technology: "Python / Go"
    description: "Validates and routes regional transactions while ensuring strict data residency compliance."
  - type: "component"
    name: "Outbox & Retry Dispatcher"
    technology: "Python / Go, Cloud Pub/Sub"
    description: "Manages asynchronous outbox queuing and reliable payload delivery to external pharmacy networks."
  - type: "component"
    name: "Secure DLQ Handler"
    technology: "Python / Go"
    description: "Handles failed message deliveries and ensures zero prescription loss via Dead-Letter Queues."
  - type: "component"
    name: "mTLS & Policy Enforcement Proxy"
    technology: "Envoy Sidecar"
    description: "Enforces mutual TLS (mTLS) and validates OIDC clinician license claims for secure communication."
relationships:
  - source: "Regional Routing Dispatcher"
    destination: "Regional Data Storage"
    description: "Validates and logs transaction audits [SQL / TLS]"
  - source: "Outbox & Retry Dispatcher"
    destination: "EU National E-Prescription Gateways & US Pharmacy Networks"
    description: "Delivers payloads [HTTPS / mTLS]"
  - source: "FHIR Translation Engine"
    destination: "EU Gateway Translator"
    description: "Transmits translated medical data payloads"