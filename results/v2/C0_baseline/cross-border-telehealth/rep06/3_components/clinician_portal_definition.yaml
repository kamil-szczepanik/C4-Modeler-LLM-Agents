level: component
scope: "Component diagram for the Clinician Portal container"
parentContainer:
  name: "Clinician Portal"
elements:
  - type: "component"
    name: "Clinician UI Router"
    technology: "React Router"
    description: "Manages client-side routing and navigation for clinician workflows."
  - type: "component"
    name: "Authentication & Session Module"
    technology: "OAuth2/OIDC, HttpOnly Cookies"
    description: "Handles secure clinician login, token management, and session enforcement for HIPAA and GDPR compliance."
  - type: "component"
    name: "Video Consultation Controller"
    technology: "React, WebRTC (SRTP/DTLS)"
    description: "Interfaces with LiveKit/WebRTC media relays to establish and manage video consultation streams."
  - type: "component"
    name: "API Integration Client"
    technology: "Axios / HTTPS"
    description: "Communicates securely with the API Gateway to manage clinician requests, workflows, and patient data."
relationships:
  - source: "Clinician UI Router"
    destination: "Authentication & Session Module"
    description: "Validates session state and permissions [OAuth2/OIDC]"
  - source: "Clinician UI Router"
    destination: "Video Consultation Controller"
    description: "Loads video consultation interface"
  - source: "Clinician UI Router"
    destination: "API Integration Client"
    description: "Triggers data fetching and workflow submissions"
  - source: "Authentication & Session Module"
    destination: "API Integration Client"
    description: "Injects auth tokens into API requests"
  - source: "Video Consultation Controller"
    destination: "LiveKit/WebRTC Media Relays"
    description: "Establishes video consultation streams [SRTP/DTLS via TURN/STEF]"
  - source: "API Integration Client"
    destination: "API Gateway"
    description: "Manages clinician workflows and requests [HTTPS/WSS via OAuth2/OIDC, mTLS]"