level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides secure video consultations, e-prescriptions, and an AI symptom checker for patients across the EU and US while enforcing strict regional data residency, regulatory compliance, and high availability."
elements:
  - type: "person"
    name: "Patients (EU & US)"
    description: "Access video consultations and manage consent."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Deliver care and review patient histories."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways & US Pharmacy Networks"
    description: "External prescription fulfillment systems."
  - type: "externalSystem"
    name: "AI Inference Service"
    description: "External system providing urgency recommendations."
relationships:
  - source: "Patients (EU & US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Access video consultations and manage consent"
    technology: "HTTPS and WebRTC (TLS 1.3 / DTLS-SRTP)"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Deliver care and review patient histories"
    technology: "HTTPS and WebRTC (TLS 1.3 / DTLS-SRTP)"
  - source: "Cross-Border Telehealth Platform"
    destination: "EU National E-Prescription Gateways & US Pharmacy Networks"
    description: "Fulfill prescriptions"
    technology: "REST/FHIR and national standards over HTTPS/mTLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "AI Inference Service"
    description: "Get urgency recommendations"
    technology: "gRPC over TLS 1.3 with sidecar interception"