level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU & US)"
    description: "Access video consultations, manage consent, and use AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Deliver care and review patient histories."
  - type: "person"
    name: "Pharmacy Partners and Platform Administrators / Compliance Officers"
    description: "Manage platform operations, pharmacy fulfillment, and regulatory compliance."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways & US Pharmacy Networks"
    description: "External prescription fulfillment networks."
  - type: "externalSystem"
    name: "AI Inference Service"
    description: "External AI system providing urgency recommendations."
  - type: "container"
    name: "Patient Mobile/Web App"
    technology: "Flutter / React"
    description: "Client application for patients to access video consultations, e-prescriptions, and AI symptom checking."
  - type: "container"
    name: "Clinician Portal"
    technology: "React"
    description: "Portal for licensed clinicians to deliver care and review patient histories."
  - type: "container"
    name: "API Gateway"
    technology: "Envoy / Kong"
    description: "Manages incoming traffic, routing, and security policies."
  - type: "container"
    name: "Core Telehealth Service"
    technology: "Python / Go on GKE"
    description: "Handles core business logic for telehealth consultations."
  - type: "container"
    name: "Interoperability & E-Prescription Adapter"
    technology: "Python / Go on GKE"
    description: "Connects with EU National E-Prescription Gateways and US Pharmacy Networks."
  - type: "container"
    name: "Consent & Privacy Management Container"
    technology: "Python / Go on GKE"
    description: "Manages patient privacy, regulatory compliance, and cryptographic consent tokens."
  - type: "container"
    name: "AI Orchestrator & Audit Service"
    technology: "Python / Go on GKE"
    description: "Orchestrates AI symptom checking requests, PII prompt sanitization, and immutable audit logging."
  - type: "container"
    name: "LiveKit/WebRTC Media Relays"
    technology: "TURN / STEF (SRTP/DTLS)"
    description: "Provides adaptive sub-300 kbit/s video streaming for telehealth consultations."
  - type: "container"
    name: "Regional Data Storage"
    technology: "Cloud SQL (PostgreSQL), Cloud Spanner, Cloud KMS"
    description: "Provides regionally-scoped data storage with Customer-Managed Encryption Keys (CMEK) and WORM/BigQuery storage for audit logs."
relationships:
  - source: "Patients (EU & US)"
    destination: "Patient Mobile/Web App"
    description: "Accesses telehealth services, video consultations, and AI symptom checker"
    technology: "HTTPS/WSS"
  - source: "Licensed Clinicians"
    destination: "Clinician Portal"
    description: "Accesses patient health records and conducts consultations"
    technology: "HTTPS/WSS"
  - source: "Patient Mobile/Web App"
    destination: "API Gateway"
    description: "Sends API requests and streams media"
    technology: "HTTPS/WSS (OAuth2/OIDC, mTLS)"
  - source: "Clinician Portal"
    destination: "API Gateway"
    description: "Sends API requests and manages clinician workflows"
    technology: "HTTPS/WSS (OAuth2/OIDC, mTLS)"
  - source: "API Gateway"
    destination: "Core Telehealth Service"
    description: "Routes core telehealth API calls"
    technology: "gRPC / mTLS (Istio Mesh)"
  - source: "API Gateway"
    destination: "Interoperability & E-Prescription Adapter"
    description: "Routes e-prescription and interoperability requests"
    technology: "gRPC / mTLS (Istio Mesh)"
  - source: "API Gateway"
    destination: "Consent & Privacy Management Container"
    description: "Routes consent and privacy management calls"
    technology: "gRPC / mTLS (Istio Mesh)"
  - source: "API Gateway"
    destination: "AI Orchestrator & Audit Service"
    description: "Routes AI symptom checking and audit requests"
    technology: "gRPC / mTLS (Istio Mesh)"
  - source: "Interoperability & E-Prescription Adapter"
    destination: "EU National E-Prescription Gateways & US Pharmacy Networks"
    description: "Fulfills prescriptions and interoperability workflows"
    technology: "REST/HL7 FHIR over HTTPS/mTLS"
  - source: "AI Orchestrator & Audit Service"
    destination: "AI Inference Service"
    description: "Sends sanitized prompts for urgency recommendations"
    technology: "gRPC with local PII prompt sanitization"
  - source: "Patient Mobile/Web App"
    destination: "LiveKit/WebRTC Media Relays"
    description: "Establishes video streams for consultations"
    technology: "SRTP/DTLS (TURN/STEF)"
  - source: "Clinician Portal"
    destination: "LiveKit/WebRTC Media Relays"
    description: "Establishes video streams for consultations"
    technology: "SRTP/DTLS (TURN/STEF)"
  - source: "Core Telehealth Service"
    destination: "Regional Data Storage"
    description: "Reads and writes regionally-scoped patient data"
    technology: "SQL / Cloud KMS"
  - source: "Consent & Privacy Management Container"
    destination: "Regional Data Storage"
    description: "Manages consent records and cryptographic keys"
    technology: "SQL / Cloud KMS"
  - source: "AI Orchestrator & Audit Service"
    destination: "Regional Data Storage"
    description: "Writes immutable audit logs"
    technology: "WORM storage / BigQuery"