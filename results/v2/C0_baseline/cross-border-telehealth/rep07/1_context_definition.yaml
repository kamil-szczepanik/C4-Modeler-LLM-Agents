level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and the US while enforcing strict regional data residency."
elements:
  - type: "person"
    name: "Patients (EU / US)"
    description: "Patients located in the EU and the US seeking video consultations, AI symptom checks, and e-prescriptions."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals providing video consultations and issuing e-prescriptions to patients."
  - type: "person"
    name: "Platform Administrator / Compliance Officer"
    description: "Personnel responsible for managing the platform, auditing, and ensuring regulatory compliance."
  - type: "externalSystem"
    name: "Local Pharmacies (EU / US)"
    description: "Regional pharmacy networks receiving and fulfilling e-prescriptions."
  - type: "externalSystem"
    name: "AI Symptom Checker Engine"
    description: "Engine providing real-time urgency assessment for patient symptoms."
  - type: "externalSystem"
    name: "Notification Gateway"
    description: "Gateway handling asynchronous alerts for low-bandwidth patients."
  - type: "externalSystem"
    name: "EU Pharmacy Networks & US Pharmacy Networks"
    description: "Standardized pharmacy networks using HL7 FHIR and NCPDP for prescription integration."
  - type: "externalSystem"
    name: "Identity Providers"
    description: "Authentication systems including EU eIDAS and US OAuth Providers."
relationships:
  - source: "Patients (EU / US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses video consultations, AI checks, and manages consent"
    technology: "HTTPS / WebRTC"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Conducts video consultations and manages patient care"
    technology: "HTTPS / WebRTC"
  - source: "Platform Administrator / Compliance Officer"
    destination: "Cross-Border Telehealth Platform"
    description: "Monitors and manages platform administration and compliance"
    technology: "HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Local Pharmacies (EU / US)"
    description: "Dispatches e-prescriptions"
    technology: "Secure REST / HL7 FHIR over mTLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "AI Symptom Checker Engine"
    description: "Performs real-time urgency assessment"
    technology: "HTTPS / gRPC"
  - source: "Cross-Border Telehealth Platform"
    destination: "Notification Gateway"
    description: "Sends asynchronous low-bandwidth patient alerts"
    technology: "Asynchronous Pub/Sub"
  - source: "Cross-Border Telehealth Platform"
    destination: "EU Pharmacy Networks & US Pharmacy Networks"
    description: "Integrates e-prescription data"
    technology: "HL7 FHIR / NCPDP"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity Providers"
    description: "Authenticates users via eIDAS and OAuth"
    technology: "OAuth / eIDAS Protocols"