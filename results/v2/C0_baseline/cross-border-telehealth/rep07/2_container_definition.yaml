level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU / US)"
    description: "Patients located in the EU and the US seeking video consultations, AI symptom checks, and e-prescriptions."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals providing video consultations and issuing e-prescriptions to patients."
  - type: "person"
    name: "Platform Administrators"
    description: "Personnel responsible for managing the platform, auditing, and ensuring regulatory compliance."
  - type: "person"
    name: "Local Pharmacy Staff"
    description: "Pharmacy personnel receiving and fulfilling e-prescriptions."
  - type: "person"
    name: "Billing Specialists"
    description: "Personnel managing platform financial transactions and billing."
  - type: "externalSystem"
    name: "Local Pharmacies"
    description: "Regional pharmacy networks receiving and fulfilling e-prescriptions."
  - type: "externalSystem"
    name: "AI Symptom Checker Engine"
    description: "Engine providing real-time urgency assessment for patient symptoms."
  - type: "externalSystem"
    name: "Notification Gateway"
    description: "Gateway handling asynchronous alerts for low-bandwidth users."
  - type: "externalSystem"
    name: "Identity Providers"
    description: "Authentication systems including EU eIDAS and US OAuth Providers."
  - type: "container"
    name: "Web Applications"
    technology: "Flutter / HTML5 / CSS"
    description: "Cross-platform web rendering for patients, clinicians, and administrators."
  - type: "container"
    name: "Native Mobile Apps"
    technology: "Flutter"
    description: "Native mobile applications for patients and clinicians."
  - type: "container"
    name: "Global External HTTP(S) Load Balancers"
    technology: "GCP Global HTTP(S) Load Balancer"
    description: "Routes global incoming traffic to regional endpoints."
  - type: "container"
    name: "Regional API Gateways"
    technology: "Kong / GCP API Gateway"
    description: "Validates OAuth2/OIDC JWTs, verifies cryptographic consent tokens, and routes regional traffic."
  - type: "container"
    name: "Consultation Service"
    technology: "Go / Node.js"
    description: "Manages consultation logic and WebRTC signaling."
  - type: "container"
    name: "Media Relay / SFU Container"
    technology: "LiveKit / Mediasoup"
    description: "Handles real-time video consultation streams and media relay."
  - type: "container"
    name: "Consent Management Service"
    technology: "Go / Node.js"
    description: "Manages patient and clinical consent records."
  - type: "container"
    name: "Prescription & Interoperability Service"
    technology: "Java / Spring Boot"
    description: "Transmits e-prescriptions using HL7 FHIR and national standards."
  - type: "container"
    name: "AI Inference Orchestrator"
    technology: "Python / FastAPI"
    description: "Orchestrates AI symptom checker interactions and logs audit data."
  - type: "container"
    name: "GKE Regional Clusters"
    technology: "Google Kubernetes Engine with SPIFFE/SPIRE mTLS"
    description: "Regional container orchestration clusters executing microservices with service mesh security."
  - type: "container"
    name: "Regional TURN/STUN Relays"
    technology: "Google Cloud TURN/STUN"
    description: "Provides media relay and bandwidth adaptation for rural and low-bandwidth users."
  - type: "container"
    name: "Regional Cloud Spanner"
    technology: "GCP Cloud Spanner"
    description: "Provides regional transactional data storage with data residency enforcement."
  - type: "container"
    name: "Regional BigQuery"
    technology: "GCP BigQuery"
    description: "Stores immutable AI audit logs and interaction histories."
relationships:
  - source: "Patients (EU / US)"
    destination: "Web Applications"
    description: "Accesses telehealth platform functionality"
    technology: "HTTPS"
  - source: "Patients (EU / US)"
    destination: "Native Mobile Apps"
    description: "Accesses telehealth platform functionality"
    technology: "HTTPS / gRPC"
  - source: "Licensed Clinicians"
    destination: "Web Applications"
    description: "Manages consultations and prescribes care"
    technology: "HTTPS"
  - source: "Platform Administrators"
    destination: "Web Applications"
    description: "Monitors and configures platform compliance and operations"
    technology: "HTTPS"
  - source: "Web Applications"
    destination: "Global External HTTP(S) Load Balancers"
    description: "Sends user requests"
    technology: "HTTPS"
  - source: "Native Mobile Apps"
    destination: "Global External HTTP(S) Load Balancers"
    description: "Sends user requests"
    technology: "HTTPS / gRPC"
  - source: "Global External HTTP(S) Load Balancers"
    destination: "Regional API Gateways"
    description: "Routes traffic to regional deployment zones"
    technology: "HTTPS"
  - source: "Regional API Gateways"
    destination: "Consultation Service"
    description: "Forwards API requests and validates tokens"
    technology: "gRPC over mTLS"
  - source: "Regional API Gateways"
    destination: "Consent Management Service"
    description: "Forwards consent requests and validates tokens"
    technology: "gRPC over mTLS"
  - source: "Regional API Gateways"
    destination: "Prescription & Interoperability Service"
    description: "Forwards prescription requests and validates tokens"
    technology: "gRPC over mTLS"
  - source: "Regional API Gateways"
    destination: "AI Inference Orchestrator"
    description: "Forwards symptom analysis requests"
    technology: "gRPC over mTLS"
  - source: "Consultation Service"
    destination: "Media Relay / SFU Container"
    description: "Manages WebRTC signaling and media flow"
    technology: "gRPC / WebRTC"
  - source: "Media Relay / SFU Container"
    destination: "Regional TURN/STUN Relays"
    description: "Routes media streams for low-bandwidth users"
    technology: "STUN / TURN / WebRTC"
  - source: "Prescription & Interoperability Service"
    destination: "Local Pharmacies"
    description: "Transmits e-prescriptions"
    technology: "HL7 FHIR / National Standards over mTLS"
  - source: "AI Inference Orchestrator"
    destination: "AI Symptom Checker Engine"
    description: "Queries symptom check logic"
    technology: "HTTPS / gRPC"
  - source: "AI Inference Orchestrator"
    destination: "Regional BigQuery"
    description: "Logs AI interactions and model versions"
    technology: "Google Cloud Client Libraries"
  - source: "Consultation Service"
    destination: "Regional Cloud Spanner"
    description: "Reads and writes transactional data"
    technology: "JDBC / Cloud Spanner API"
  - source: "Consent Management Service"
    destination: "Regional Cloud Spanner"
    description: "Persists cryptographic consent tokens"
    technology: "JDBC / Cloud Spanner API"
  - source: "Prescription & Interoperability Service"
    destination: "Regional Cloud Spanner"
    description: "Stores prescription records"
    technology: "JDBC / Cloud Spanner API"
  - source: "Regional API Gateways"
    destination: "Identity Providers"
    description: "Authenticates users via OAuth2/OIDC"
    technology: "OAuth2 / OIDC"
  - source: "Consultation Service"
    destination: "Notification Gateway"
    description: "Sends asynchronous alerts"
    technology: "Asynchronous Pub/Sub"