level: component
scope: "Component diagram for the Prescription & Interoperability Service container"
parentContainer:
  name: "Prescription & Interoperability Service"
elements:
  - type: "component"
    name: "Prescription API Controller"
    technology: "Java/Spring Boot"
    description: "Forwards prescription requests, validates tokens, and processes incoming calls."
  - type: "component"
    name: "FHIR & National Mapping Engine"
    technology: "Java with HAPI FHIR"
    description: "Validates payloads and standardizes US and international healthcare interoperability data structures."
  - type: "component"
    name: "Pharmacy Integration Client"
    technology: "Java Spring WebClient"
    description: "Transmits e-prescriptions to local pharmacies and manages integration payloads."
  - type: "component"
    name: "Prescription Outbox & Retry Processor"
    technology: "Java/Spring Boot, Resilience4j, Spring Cloud Stream"
    description: "Implements circuit breakers, retry logic, and forwards failed delivery events."
relationships:
  - source: "Prescription API Controller"
    destination: "FHIR & National Mapping Engine"
    description: "Validates payload and passes data [In-memory]"
  - source: "FHIR & National Mapping Engine"
    destination: "Pharmacy Integration Client"
    description: "Passes serialized payloads [In-memory]"
  - source: "Pharmacy Integration Client"
    destination: "Prescription Outbox & Retry Processor"
    description: "Forwards failed delivery events [In-memory / Event]"