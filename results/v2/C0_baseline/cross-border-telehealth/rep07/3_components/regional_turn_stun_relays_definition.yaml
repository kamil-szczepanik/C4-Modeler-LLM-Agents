level: component
scope: "Component diagram for the Regional TURN/STUN Relays container"
parentContainer:
  name: "Regional TURN/STUN Relays"
elements:
  - type: "component"
    name: "STUN/TURN Allocation Engine"
    technology: "Coturn / GCP Managed Service"
    description: "Handles media packet forwarding and UDP/TCP port allocation, relaying encrypted media streams via DTLS-SRTP."
  - type: "component"
    name: "Bandwidth Adaptation & Congestion Controller"
    technology: "WebRTC GCC / Simulcast/SVC Controller"
    description: "Manages dynamic bandwidth adaptation below 300 kbit/s to throttle and prioritize audio streams."
  - type: "component"
    name: "Session Auth & Quota Validator"
    technology: "Go with SPIFFE/SPIRE mTLS"
    description: "Authenticates relay sessions and validates tokens and session quotas."
  - type: "component"
    name: "Regional GCP Compute Engine MIGs"
    technology: "GCP Managed Instance Groups"
    description: "Ensures scalable and resilient regional deployments across GCP regional VPC networks."
relationships:
  - source: "Client Apps"
    destination: "Session Auth & Quota Validator"
    description: "Authenticate relay sessions [HTTPS/REST]"
  - source: "Client Apps"
    destination: "STUN/TURN Allocation Engine"
    description: "Relay encrypted media streams [DTLS-SRTP over UDP/TCP]"
  - source: "Bandwidth Adaptation & Congestion Controller"
    destination: "STUN/TURN Allocation Engine"
    description: "Throttle and prioritize audio streams [Internal IPC]"
  - source: "Session Auth & Quota Validator"
    destination: "Consultation Service"
    description: "Validate tokens and session quotas [gRPC via mTLS]"