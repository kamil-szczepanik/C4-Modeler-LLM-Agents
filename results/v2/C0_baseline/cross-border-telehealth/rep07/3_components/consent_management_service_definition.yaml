level: component
scope: "Component diagram for the Consent Management Service container"
parentContainer:
  name: "Consent Management Service"
elements:
  - type: "component"
    name: "Consent API Controller"
    technology: "Go / Node.js"
    description: "Receives forwarded consent requests from the Regional API Gateways via gRPC over mTLS."
  - type: "component"
    name: "Consent Policy Engine"
    technology: "Go / Node.js"
    description: "Evaluates consent rules and triggers policy decisions."
  - type: "component"
    name: "Consent Audit Logger"
    technology: "Go / Node.js"
    description: "Emits compliance audit trails asynchronously."
  - type: "component"
    name: "Consent Event Dispatcher"
    technology: "Go / Node.js"
    description: "Triggers revocation events internally."
  - type: "component"
    name: "Template Resolution Sub-component"
    technology: "Go / Node.js"
    description: "Resolves templates required for consent management processes."
  - type: "component"
    name: "Regional Cloud Spanner"
    technology: "GCP Cloud Spanner"
    description: "Persists consent tokens enforcing strict regional data residency."
  - type: "component"
    name: "Regional Pub/Sub"
    technology: "Regional Pub/Sub"
    description: "Publishes token invalidation events for event-driven revocation."
relationships:
  - source: "Consent API Controller"
    destination: "Consent Policy Engine"
    description: "Evaluates consent rules [In-process function call]"
  - source: "Consent Policy Engine"
    destination: "Consent Audit Logger"
    description: "Emits compliance audit trails [Async channel / gRPC]"
  - source: "Consent Policy Engine"
    destination: "Regional Cloud Spanner"
    description: "Persists consent tokens [Cloud Spanner Go Client / gRPC over mTLS]"
  - source: "Consent Policy Engine"
    destination: "Consent Event Dispatcher"
    description: "Triggers revocation events [In-process]"
  - source: "Consent Event Dispatcher"
    destination: "Regional Pub/Sub"
    description: "Publishes token invalidation events [Pub/Sub API]"