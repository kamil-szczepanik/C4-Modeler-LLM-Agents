level: component
scope: "Component diagram for the GKE Regional Clusters container"
parentContainer:
  name: "GKE Regional Clusters"
elements:
  - type: "component"
    name: "Kubernetes Control Plane"
    technology: "Regional Managed Kubernetes"
    description: "Manages cluster state and scheduling for regional workloads."
  - type: "component"
    name: "Istio Service Mesh"
    technology: "Istio with SPIFFE/SPIRE"
    description: "Enforces zero-trust service-to-service communication and mTLS identity verification."
  - type: "component"
    name: "Cilium CNI"
    technology: "Cilium Datapath V2 with eBPF"
    description: "Provides high-performance pod networking and kernel-level network security enforcement."
  - type: "component"
    name: "Cluster Ingress Controller"
    technology: "Nginx / GCP Gateway API"
    description: "Handles incoming HTTP/HTTPS traffic from Regional API Gateways."
  - type: "component"
    name: "Node Pools"
    technology: "Standard VMs and Spot VMs"
    description: "Runs clinical workloads on standard VMs and non-clinical workloads on reserved Spot VMs."
  - type: "component"
    name: "ArgoCD"
    technology: "Multi-Region GitOps"
    description: "Manages isolated regional continuous delivery and deployments."
  - type: "component"
    name: "Admission Control"
    technology: "OPA/Gatekeeper or Kyverno"
    description: "Validates and enforces security policies during resource deployment."
  - type: "component"
    name: "Falco"
    technology: "Runtime Threat Detection"
    description: "Provides kernel-level runtime threat detection across regional workloads."
relationships:
  - source: "Cluster Ingress Controller"
    destination: "Kubernetes Control Plane"
    description: "Receives ingress traffic and coordinates with"
  - source: "Istio Service Mesh"
    destination: "Kubernetes Control Plane"
    description: "Secures microservice traffic managed by"
  - source: "Cilium CNI"
    destination: "Kubernetes Control Plane"
    description: "Enforces pod networking and policies for"
  - source: "ArgoCD"
    destination: "Kubernetes Control Plane"
    description: "Deploys and synchronizes applications to"
  - source: "Admission Control"
    destination: "Kubernetes Control Plane"
    description: "Inspects and filters requests to"
  - source: "Falco"
    destination: "Node Pools"
    description: "Monitors runtime security on"