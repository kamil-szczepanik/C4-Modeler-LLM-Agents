level: component
scope: "Component diagram for the Regional Cloud Spanner container"
parentContainer:
  name: "Regional Cloud Spanner"
elements:
  - type: "component"
    name: "Transactional Data Store"
    technology: "Spanner SQL tables with row-level security"
    description: "Stores transactional telehealth data with row-level security and strict regional isolation."
  - type: "component"
    name: "Audit Log Table"
    technology: "Append-only table"
    description: "Persists immutable consent tokens and audit logs for compliance tracking."
  - type: "component"
    name: "Spanner Data Access Layer"
    technology: "Google Cloud Spanner Native Go/Java Client Libraries"
    description: "Provides low-latency transactional read/writes via gRPC over TLS 1.3."
  - type: "component"
    name: "Change Streams Processor"
    technology: "Spanner Change Streams with Pub/Sub"
    description: "Captures and streams real-time, row-level data changes asynchronously for downstream integration."
relationships:
  - source: "Consultation Service"
    destination: "Spanner Data Access Layer"
    description: "Reads and writes transactional data via gRPC over TLS 1.3"
  - source: "Consent Management Service"
    destination: "Spanner Data Access Layer"
    description: "Persists consent tokens and immutable audit logs via gRPC over TLS 1.3"
  - source: "Prescription & Interoperability Service"
    destination: "Spanner Data Access Layer"
    description: "Stores and reads prescription records via gRPC over TLS 1.3"
  - source: "Spanner Data Access Layer"
    destination: "Transactional Data Store"
    description: "Executes queries and transactions"
  - source: "Spanner Data Access Layer"
    destination: "Audit Log Table"
    description: "Appends audit logs and consent records"
  - source: "Transactional Data Store"
    destination: "Change Streams Processor"
    description: "Captures row-level data changes asynchronously"
  - source: "Change Streams Processor"
    destination: "Microservices / Pub/Sub"
    description: "Streams asynchronous data changes via gRPC and HTTPS"