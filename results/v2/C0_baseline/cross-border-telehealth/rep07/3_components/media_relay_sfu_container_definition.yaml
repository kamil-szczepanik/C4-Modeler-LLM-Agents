level: component
scope: "Component diagram for the Media Relay / SFU Container container"
parentContainer:
  name: "Media Relay / SFU Container"
elements:
  - type: "component"
    name: "Signaling and Room Manager"
    technology: "LiveKit / Go"
    description: "Handles WebRTC signaling, client connections, and room state management for video consultations."
  - type: "component"
    name: "Media Forwarding Engine"
    technology: "LiveKit / SFU"
    description: "Selective Forwarding Unit (SFU) that routes video and audio streams between participants with adaptive bitrate streaming."
  - type: "component"
    name: "Encryption and Security Handler"
    technology: "DTLS 1.3 / SRTP"
    description: "Enforces end-to-end encryption for all real-time media streams."
relationships:
  - source: "Signaling and Room Manager"
    destination: "Media Forwarding Engine"
    description: "Coordinates track publication and subscription"
  - source: "Media Forwarding Engine"
    destination: "Encryption and Security Handler"
    description: "Encrypts and decrypts real-time media packets"