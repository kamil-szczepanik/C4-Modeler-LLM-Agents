level: component
scope: "Component diagram for the Native Mobile Apps container"
parentContainer:
  name: "Native Mobile Apps"
elements:
  - type: "component"
    name: "Presentation Layer"
    technology: "Dart / Flutter UI"
    description: "Multi-platform user interface for video consultations, e-prescriptions, and AI symptom checker."
  - type: "component"
    name: "Local Secure Storage Component"
    technology: "SQLCipher / Flutter Secure Storage"
    description: "Hardware-backed encryption for secure offline PHI/PII caching."
  - type: "component"
    name: "API & Sync Client"
    technology: "Dio / gRPC Dart"
    description: "Syncs payloads and requests with regional gateways."
  - type: "component"
    name: "WebRTC Media Module"
    technology: "Flutter WebRTC plugin"
    description: "Handles real-time video consultations with adaptive bandwidth degradation."
  - type: "component"
    name: "Regional API Gateways"
    technology: "Kong / GCP API Gateway"
    description: "Regional gateways for API requests and compliance."
  - type: "component"
    name: "Regional TURN/STUN Relays"
    technology: "Google Cloud TURN/STUN"
    description: "Relays for establishing video streams."
relationships:
  - source: "Presentation Layer"
    destination: "Local Secure Storage Component"
    description: "Reads/writes encrypted cache [SQLCipher API]"
  - source: "API & Sync Client"
    destination: "Regional API Gateways"
    description: "Syncs payloads and requests [gRPC / HTTPS with TLS 1.3]"
  - source: "WebRTC Media Module"
    destination: "Regional TURN/STUN Relays"
    description: "Establishes video streams [ICE / STUN / TURN over UDP/TCP]"