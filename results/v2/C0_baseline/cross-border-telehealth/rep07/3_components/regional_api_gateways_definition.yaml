level: component
scope: "Component diagram for the Regional API Gateways container"
parentContainer:
  name: "Regional API Gateways"
elements:
  - type: "component"
    name: "JWT & OAuth2 Validator Component"
    technology: "gRPC/JWKS"
    description: "Validates incoming user tokens from Identity Providers via gRPC/JWKS."
  - type: "component"
    name: "Cryptographic Consent Verifier Plugin"
    technology: "Custom Lua/Go plugin"
    description: "Validating fine-grained consent tokens."
  - type: "component"
    name: "Rate Limiting & Traffic Prioritization Component"
    technology: "Redis-backed token bucket"
    description: "Ensuring R-03 and R-01 prioritization."
  - type: "component"
    name: "WAF & Payload Inspection Component"
    technology: "ModSecurity/Coraza integration"
    description: "Sanitizing FHIR and JSON payloads."
  - type: "component"
    name: "Localization & Fault Transformation Component"
    technology: "JSON processor"
    description: "Translates backend errors into localized, patient-friendly JSON responses."
  - type: "component"
    name: "Regional Router Component"
    technology: "Kong Enterprise / GKE"
    description: "Forwards validated traffic to internal services."
relationships:
  - source: "Regional API Gateways"
    destination: "Identity Providers"
    description: "Authenticates users [OAuth2 / OIDC]"
  - source: "Cryptographic Consent Verifier"
    destination: "Consent Management Service"
    description: "Verifies fine-grained permissions [gRPC over mTLS]"
  - source: "Regional Router"
    destination: "Consultation Service"
    description: "Forwards requests [gRPC over mTLS via SPIFFE/SPIRE]"
  - source: "Regional Router"
    destination: "AI Inference Orchestrator"
    description: "Forwards requests [gRPC over mTLS via SPIFFE/SPIRE]"
  - source: "Regional Router"
    destination: "Prescription & Interoperability Service"
    description: "Forwards requests [gRPC over mTLS via SPIFFE/SPIRE]"
  - source: "Localization & Fault Transformation"
    destination: "Global External HTTP(S) Load Balancers"
    description: "Returns localized error responses [HTTPS]"