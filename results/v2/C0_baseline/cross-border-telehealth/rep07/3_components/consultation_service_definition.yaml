level: component
scope: "Component diagram for the Consultation Service container"
parentContainer:
  name: "Consultation Service"
elements:
  - type: "component"
    name: "Signaling Controller"
    technology: "Go on GKE"
    description: "Forwards API requests, validates tokens, and relays SDP offers/answers and ICE candidates."
  - type: "component"
    name: "Session Quality Monitor"
    technology: "Go on GKE"
    description: "Monitors session quality and persists connection telemetry and audit logs."
  - type: "component"
    name: "Consultation Workflow Manager"
    technology: "Go on GKE"
    description: "Manages consultation workflows and validates patient data-sharing consent prior to session initialization."
relationships:
  - source: "Signaling Controller"
    destination: "Media Relay / SFU Container"
    description: "Relays SDP offers/answers and ICE candidates [gRPC]"
  - source: "Consultation Workflow Manager"
    destination: "Consent Management Service"
    description: "Validates patient data-sharing consent prior to session initialization [gRPC over mTLS]"
  - source: "Session Quality Monitor"
    destination: "Regional Cloud Spanner"
    description: "Persists connection telemetry and audit logs [Go Cloud Spanner Client]"