level: component
scope: "Component diagram for the Global External HTTP(S) Load Balancers container"
parentContainer:
  name: "Global External HTTP(S) Load Balancers"
elements:
  - type: "component"
    name: "Anycast IP Frontend"
    technology: "HTTP/2, gRPC, TLS 1.3"
    description: "Terminates TLS 1.3 globally and handles incoming requests from web and mobile applications."
  - type: "component"
    name: "Cloud Armor Security Policy Engine"
    technology: "Google Cloud Armor"
    description: "Mitigates DDoS attacks and enforces WAF and geo-access rules."
  - type: "component"
    name: "URL Map & Redirect Component"
    technology: "GCP Global External HTTP(S) Load Balancer Routing"
    description: "Executes geo-routing policies and directs traffic to appropriate regional destinations or edge services."
  - type: "component"
    name: "Region-Selection Edge Service"
    technology: "Cloud Storage, Cloud CDN"
    description: "Routes ambiguous or unrouted requests to static edge assets and provides graceful edge fallbacks."
relationships:
  - source: "Anycast IP Frontend"
    destination: "Cloud Armor Security Policy Engine"
    description: "Inspects incoming requests for security policies [HTTPS / gRPC]"
  - source: "Cloud Armor Security Policy Engine"
    destination: "URL Map & Redirect Component"
    description: "Passes validated traffic for routing decisions"
  - source: "URL Map & Redirect Component"
    destination: "Region-Selection Edge Service"
    description: "Routes ambiguous or unrouted requests to static edge assets [HTTPS]"