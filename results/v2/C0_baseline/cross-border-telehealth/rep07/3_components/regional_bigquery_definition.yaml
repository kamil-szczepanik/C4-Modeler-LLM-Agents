level: component
scope: "Component diagram for the Regional BigQuery container"
parentContainer:
  name: "Regional BigQuery"
elements:
  - type: "component"
    name: "EU Audit Dataset"
    technology: "GCP BigQuery Dataset (europe-west3)"
    description: "Stores EU regional health data audit logs enforcing strict data residency."
  - type: "component"
    name: "US Audit Dataset"
    technology: "GCP BigQuery Dataset (us-central1)"
    description: "Stores US regional health data audit logs enforcing strict data residency."
  - type: "component"
    name: "Regional Storage & Analytics Engine"
    technology: "GCP BigQuery"
    description: "Provides native single-region datasets to strictly enforce data residency requirements."
  - type: "component"
    name: "Audit Dataset Management & Schema Enforcement Component"
    technology: "Terraform"
    description: "Manages partitioned table schemas with autodetect = false to prevent schema corruption from AI log updates."
  - type: "component"
    name: "Access & Masking Policy Enforcer Component"
    technology: "BigQuery Row-Level Security and Dynamic Data Masking"
    description: "Restricts data visibility and masks PHI/PII for authorized compliance officers."
relationships:
  - source: "AI Inference Orchestrator"
    destination: "Regional Storage & Analytics Engine"
    description: "Streams audit logs and inputs [BigQuery Write API / gRPC over VPC]"
  - source: "Clinical Analytics & BI Tool"
    destination: "Access & Masking Policy Enforcer Component"
    description: "Queries anonymized/masked views [BigQuery SQL / JDBC]"
  - source: "Compliance Officers"
    destination: "Access & Masking Policy Enforcer Component"
    description: "Queries regional datasets for compliance reporting [BigQuery SQL / JDBC over GCP IAM]"