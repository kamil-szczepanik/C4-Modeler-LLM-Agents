level: component
scope: "Component diagram for the AI Inference Orchestrator container"
parentContainer:
  name: "AI Inference Orchestrator"
elements:
  - type: "component"
    name: "API Handler Component"
    technology: "Python / FastAPI"
    description: "Handles incoming API requests and delegates to internal validation and processing components."
  - type: "component"
    name: "Consent Validator Component"
    technology: "Python / FastAPI, gRPC"
    description: "Performs internal verification of incoming requests against patient consent policies."
  - type: "component"
    name: "Payload Sanitizer/Encryption Component"
    technology: "Python / Pydantic"
    description: "Enforces strict payload validation and sanitization across internal components."
  - type: "component"
    name: "Inference Router Component"
    technology: "Python / FastAPI"
    description: "Routes symptom check logic requests to the AI Symptom Checker Engine securely."
  - type: "component"
    name: "Audit Logging Component"
    technology: "Python / Google Cloud Client Libraries"
    description: "Manages synchronous transactional audit writes and asynchronous analytical syncs."
relationships:
  - source: "API Handler Component"
    destination: "Consent Validator Component"
    description: "Internal verification [In-memory / gRPC]"
  - source: "AI Inference Orchestrator"
    destination: "Consent Management Service"
    description: "Verifies patient consent [gRPC over mTLS]"
  - source: "Inference Router Component"
    destination: "AI Symptom Checker Engine"
    description: "Queries symptom check logic [HTTPS / gRPC with mTLS and certificate pinning]"
  - source: "Audit Logging Component"
    destination: "Regional Cloud Spanner"
    description: "Synchronous transactional audit write [Google Cloud Client Libraries]"
  - source: "Audit Logging Component"
    destination: "Regional BigQuery"
    description: "Asynchronous batch sync for analytics [Google Cloud Client Libraries]"