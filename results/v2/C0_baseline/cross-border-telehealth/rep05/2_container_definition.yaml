level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU/US)"
    description: "Patients accessing video consultations, e-prescriptions, and AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Clinicians conducting consultations and issuing treatments."
  - type: "person"
    name: "Pharmacies & Compliance Officers / AI Safety Monitors"
    description: "Entities handling fulfillment and regulatory audits."
  - type: "person"
    name: "Platform Administrators"
    description: "Administrators managing the platform infrastructure."
  - type: "externalSystem"
    name: "Regional Identity Providers"
    description: "External identity providers handling authentication."
  - type: "externalSystem"
    name: "Regional Pharmacy Networks"
    description: "External pharmacy networks for prescription fulfillment."
  - type: "container"
    name: "Web & Mobile Client Apps"
    technology: "Flutter / React Native"
    description: "Client applications enabling offline-first caching and user interactions."
  - type: "container"
    name: "API Gateway"
    technology: "GCP Cloud Endpoints / Envoy"
    description: "Routes requests using geo-DNS and validates tokens."
  - type: "container"
    name: "Core Telehealth Service"
    technology: "Go / gRPC"
    description: "Handles core telehealth business logic and consultations."
  - type: "container"
    name: "AI Symptom Checker Service"
    technology: "Python / FastAPI on Cloud Run"
    description: "Provides AI-driven symptom checking capabilities."
  - type: "container"
    name: "Video Session Manager"
    technology: "Node.js"
    description: "Manages real-time video sessions."
  - type: "container"
    name: "E-Prescription Integrator"
    technology: "Java / Spring Boot"
    description: "Integrates with regional pharmacy networks for e-prescriptions."
  - type: "container"
    name: "Regional Data Storage & Audit Layer"
    technology: "Cloud SQL, BigQuery"
    description: "Persists transactional data and immutable audit logs."
relationships:
  - source: "Patients (EU/US)"
    destination: "Web & Mobile Client Apps"
    description: "Interacts with client applications"
    technology: "HTTPS, WebSockets"
  - source: "Licensed Clinicians"
    destination: "Web & Mobile Client Apps"
    description: "Interacts with client applications"
    technology: "HTTPS, WebSockets"
  - source: "Web & Mobile Client Apps"
    destination: "API Gateway"
    description: "Communicates with API gateway"
    technology: "HTTPS/gRPC"
  - source: "API Gateway"
    destination: "Regional Identity Providers"
    description: "Validates authentication tokens"
    technology: "OAuth 2.0 / OIDC, HTTPS"
  - source: "API Gateway"
    destination: "Core Telehealth Service"
    description: "Routes requests"
    technology: "geo-DNS, gRPC"
  - source: "API Gateway"
    destination: "AI Symptom Checker Service"
    description: "Routes requests"
    technology: "geo-DNS, gRPC"
  - source: "API Gateway"
    destination: "Video Session Manager"
    description: "Routes requests"
    technology: "geo-DNS, gRPC"
  - source: "API Gateway"
    destination: "E-Prescription Integrator"
    description: "Routes requests"
    technology: "geo-DNS, gRPC"
  - source: "Core Telehealth Service"
    destination: "Regional Data Storage & Audit Layer"
    description: "Persists transactional data and audit logs"
    technology: "VPC Service Controls"
  - source: "AI Symptom Checker Service"
    destination: "Regional Data Storage & Audit Layer"
    description: "Persists audit logs and data"
    technology: "VPC Service Controls"
  - source: "Video Session Manager"
    destination: "Regional Data Storage & Audit Layer"
    description: "Persists session data and logs"
    technology: "VPC Service Controls"
  - source: "E-Prescription Integrator"
    destination: "Regional Data Storage & Audit Layer"
    description: "Persists prescription audit logs"
    technology: "VPC Service Controls"
  - source: "Core Telehealth Service"
    destination: "AI Symptom Checker Service"
    description: "Communicates internally"
    technology: "mTLS-secured gRPC"
  - source: "Core Telehealth Service"
    destination: "E-Prescription Integrator"
    description: "Communicates internally"
    technology: "mTLS-secured gRPC"
  - source: "E-Prescription Integrator"
    destination: "Regional Pharmacy Networks"
    description: "Connects to pharmacy networks"
    technology: "HL7 FHIR, national EU formats"