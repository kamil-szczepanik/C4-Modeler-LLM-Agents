level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Envoy Proxy Router"
    technology: "Envoy Proxy / GCP Cloud Endpoints"
    description: "Handles geo-routing, TLS termination, traffic shaping, and proxies requests to backend microservices."
  - type: "component"
    name: "WASM / Lua Consent Filter"
    technology: "WASM / Lua"
    description: "Custom Envoy filters used for consent metadata extraction and context handling."
relationships:
  - source: "Envoy Proxy Router"
    destination: "WASM / Lua Consent Filter"
    description: "Extracts consent metadata using [WASM / Lua]"
  - source: "Envoy Proxy Router"
    destination: "Core Telehealth Service"
    description: "Routes requests using [internal gRPC over HTTP/2, mTLS via SPIFFE/SPIRE]"
  - source: "Envoy Proxy Router"
    destination: "AI Symptom Checker Service"
    description: "Proxies requests with [W3C Trace Context and gRPC]"
  - source: "Envoy Proxy Router"
    destination: "Video Session Manager"
    description: "Routes control plane traffic using [gRPC]"
  - source: "Envoy Proxy Router"
    destination: "E-Prescription Integrator"
    description: "Routes prescription requests using [gRPC]"
  - source: "Envoy Proxy Router"
    destination: "Regional Identity Providers"
    description: "Validates authentication tokens via [OAuth 2.0 / OIDC, HTTPS]"