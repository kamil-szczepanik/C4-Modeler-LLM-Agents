level: component
scope: "Component diagram for the Video Session Manager container"
parentContainer:
  name: "Video Session Manager"
elements:
  - type: "component"
    name: "Signaling Server Component"
    technology: "Node.js / WebSockets"
    description: "Powers real-time session signaling, receives session control commands, and coordinates stream routing."
  - type: "component"
    name: "Media Gateway Controller"
    technology: "C++ / WebRTC SFU / Mediasoup"
    description: "Implements WebRTC SFU for adaptive bitrate control and media stream management."
  - type: "component"
    name: "Session Audit Logger Component"
    technology: "Node.js"
    description: "Logs session activities and persists metrics to the regional data storage layer."
  - type: "component"
    name: "Session State Coordinator"
    technology: "Memorystore for Redis"
    description: "Manages room states, tokens, and regional state caching for the 60-second reconnection grace window."
  - type: "component"
    name: "Regional Data Storage & Audit Layer"
    technology: "Cloud SQL, BigQuery"
    description: "Enforces strict regional data residency and persists session metrics and audit data."
  - type: "component"
    name: "API Gateway"
    technology: "Google Cloud"
    description: "Routes external session control commands to the signaling server."
relationships:
  - source: "Signaling Server Component"
    destination: "Media Gateway Controller"
    description: "Coordinates stream routing [In-Process / IPC]"
  - source: "Signaling Server Component"
    destination: "API Gateway"
    description: "Receives session control commands [gRPC]"
  - source: "Session Audit Logger Component"
    destination: "Regional Data Storage & Audit Layer"
    description: "Persists session metrics [gRPC over VPC]"
  - source: "Signaling Server Component"
    destination: "Session State Coordinator"
    description: "Manages room states and tokens [Redis Protocol / VPC]"
  - source: "Media Gateway Controller"
    destination: "Session State Coordinator"
    description: "Updates media states [Redis Protocol / VPC]"