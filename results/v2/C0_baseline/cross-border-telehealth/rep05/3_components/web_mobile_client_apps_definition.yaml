level: component
scope: "Component diagram for the Web & Mobile Client Apps container"
parentContainer:
  name: "Web & Mobile Client Apps"
elements:
  - type: "component"
    name: "UI Layer & State Manager"
    technology: "Flutter / React Native"
    description: "Handles cross-platform mobile and web client deployment and user interface state."
  - type: "component"
    name: "Offline Local Store"
    technology: "SQLite / WatermelonDB with SQLCipher"
    description: "Provides encrypted offline-first data caching for intermittent connectivity and rural network conditions."
  - type: "component"
    name: "API Client & Sync Engine"
    technology: "gRPC-Web / REST with OpenAPI"
    description: "Ensures low-overhead synchronization over constrained networks."
  - type: "component"
    name: "Local Consent & Session Manager"
    technology: "iOS Keychain / Android Keystore with Secure Enclave"
    description: "Secures token storage and local consent/session management."
  - type: "component"
    name: "Local Telemetry & Audit Wrapper"
    technology: "Secure Hardware-backed Cryptographic Signer"
    description: "Handles local telemetry and hardware-backed cryptographic audit signing."
relationships:
  - source: "UI Layer & State Manager"
    destination: "Offline Local Store"
    description: "Communicates via in-memory method calls to read and cache data"
  - source: "UI Layer & State Manager"
    destination: "API Client & Sync Engine"
    description: "Communicates via in-memory method calls to trigger network synchronization"
  - source: "API Client & Sync Engine"
    destination: "API Gateway"
    description: "Communicates via HTTPS / gRPC-Web (JSON/Protobuf over HTTP/2)"
  - source: "Local Consent & Session Manager"
    destination: "Regional Identity Providers"
    description: "Authenticates via OAuth 2.0 with PKCE"