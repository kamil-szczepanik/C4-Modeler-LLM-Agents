level: component
scope: "Component diagram for the Regional Data Storage & Audit Layer container"
parentContainer:
  name: "Regional Data Storage & Audit Layer"
elements:
  - type: "component"
    name: "Transactional Database"
    technology: "Cloud SQL for PostgreSQL"
    description: "Enforces Row-Level Security and JSONB indexing for regional transactional data and FHIR resources."
  - type: "component"
    name: "Audit & Traceability Engine"
    technology: "BigQuery"
    description: "Partitioned and clustered for high-performance compliance reporting and immutable AI audit trails."
  - type: "component"
    name: "Data Sync & Residency Enforcer"
    technology: "Cloud Dataflow / Pub/Sub"
    description: "Manages asynchronous regional data replication and strict residency enforcement."
  - type: "component"
    name: "Data Access Layer"
    technology: "gRPC API"
    description: "Provides secure internal gRPC read API for querying audit trails and patient data."
relationships:
  - source: "Core Telehealth Service"
    destination: "Transactional Database"
    description: "Persists patient records, consents, and session states via gRPC/JDBC over VPC Service Controls"
  - source: "AI Symptom Checker Service"
    destination: "Audit & Traceability Engine"
    description: "Appends immutable AI recommendation logs via BigQuery Storage Write API over VPC Service Controls"
  - source: "E-Prescription Integrator"
    destination: "Transactional Database"
    description: "Persists prescription audit logs via gRPC/JDBC over VPC Service Controls"
  - source: "Compliance Officers"
    destination: "Data Access Layer"
    description: "Queries audit trails and patient data via secure internal gRPC read API"