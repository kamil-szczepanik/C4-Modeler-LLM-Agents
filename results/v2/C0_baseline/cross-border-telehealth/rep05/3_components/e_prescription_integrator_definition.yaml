level: component
scope: "Component diagram for the E-Prescription Integrator container"
parentContainer:
  name: "E-Prescription Integrator"
elements:
  - type: "component"
    name: "Prescription Dispatcher Controller"
    technology: "Java / Spring Boot"
    description: "Handles incoming gRPC requests for regional prescription dispatch from the Core Telehealth Service."
  - type: "component"
    name: "Enterprise Message Router"
    technology: "Java / Spring Integration"
    description: "Routes and transforms prescription payloads for international pharmacy networks using HL7 FHIR and national EU formats."
  - type: "component"
    name: "Pharmacy Circuit Breaker Service"
    technology: "Resilience4j"
    description: "Provides fault tolerance, circuit breakers, bulkheads, and rate-limiting for unstable regional pharmacy endpoints."
  - type: "component"
    name: "Security & Token Validator"
    technology: "Spring Security / OAuth2 / JWT"
    description: "Validates OAuth2/JWT tokens and manages mTLS certificates via GCP Secret Manager for secure communication."
  - type: "component"
    name: "Audit Log & Storage Connector"
    technology: "Java / Spring Data JDBC"
    description: "Persists immutable audit logs to the Regional Data Storage & Audit Layer using VPC Service Controls."
  - type: "component"
    name: "DLQ Error Buffer"
    technology: "GCP Pub/Sub"
    description: "Buffers failed prescription transmission payloads using AES-256 encryption."
relationships:
  - source: "Prescription Dispatcher Controller"
    destination: "Enterprise Message Router"
    description: "Passes validated prescription payload [Java method invocation]"
  - source: "Enterprise Message Router"
    destination: "Pharmacy Circuit Breaker Service"
    description: "Invokes external dispatch through resilience wrapper [mTLS]"
  - source: "Security & Token Validator"
    destination: "Prescription Dispatcher Controller"
    description: "Validates incoming tokens [OAuth2/JWT]"
  - source: "Enterprise Message Router"
    destination: "Audit Log & Storage Connector"
    description: "Sends transaction audit trails [VPC Service Controls]"
  - source: "Pharmacy Circuit Breaker Service"
    destination: "DLQ Error Buffer"
    description: "Forwards failed payloads on persistent errors [AES-256 encrypted]"