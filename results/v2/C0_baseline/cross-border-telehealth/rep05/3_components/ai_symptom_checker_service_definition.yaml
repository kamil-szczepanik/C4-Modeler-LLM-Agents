level: component
scope: "Component diagram for the AI Symptom Checker Service container"
parentContainer:
  name: "AI Symptom Checker Service"
elements:
  - type: "component"
    name: "Intake & Normalization Component"
    technology: "Python / FastAPI on Cloud Run"
    description: "Handles initial intake of patient symptoms and normalizes data for processing."
  - type: "component"
    name: "Inference & Explainability Engine"
    technology: "Vertex AI"
    description: "Performs ML inference and provides explainability for symptom checks."
  - type: "component"
    name: "Audit & Traceability Component"
    technology: "Python / FastAPI on Cloud Run"
    description: "Manages audit logging and traceability for medical safety and compliance."
  - type: "component"
    name: "Handoff Formatter Component"
    technology: "Python / FastAPI on Cloud Run"
    description: "Formats session data and symptom check results for clinician handoff."
relationships:
  - source: "Intake & Normalization Component"
    destination: "Inference & Explainability Engine"
    description: "Sends normalized patient data for ML inference [gRPC]"
  - source: "Inference & Explainability Engine"
    destination: "Audit & Traceability Component"
    description: "Records inference decisions for compliance and tracking"
  - source: "Audit & Traceability Component"
    destination: "Handoff Formatter Component"
    description: "Passes audited and formatted data for final clinician handoff"