level: component
scope: "Component diagram for the Core Telehealth Service container"
parentContainer:
  name: "Core Telehealth Service"
elements:
  - type: "component"
    name: "Telehealth API Handler"
    technology: "Go / gRPC"
    description: "Handles incoming gRPC requests routed from the API Gateway and exposes core endpoints."
  - type: "component"
    name: "Consent & Policy Engine"
    technology: "Go / Open Policy Agent (OPA)"
    description: "Enforces granular consent and regional compliance policies for every transaction."
  - type: "component"
    name: "Session & Prescription Orchestrator"
    technology: "Go / gRPC"
    description: "Coordinates interactions with the Video Session Manager and E-Prescription Integrator."
relationships:
  - source: "Telehealth API Handler"
    destination: "Consent & Policy Engine"
    description: "Evaluates requests against access and data residency policies"
  - source: "Telehealth API Handler"
    destination: "Session & Prescription Orchestrator"
    description: "Delegates session coordination and prescription workflows"
  - source: "Session & Prescription Orchestrator"
    destination: "AI Symptom Checker Service"
    description: "Communicates internally via mTLS-secured gRPC"
  - source: "Session & Prescription Orchestrator"
    destination: "E-Prescription Integrator"
    description: "Communicates internally via mTLS-secured gRPC"
  - source: "Session & Prescription Orchestrator"
    destination: "Regional Data Storage & Audit Layer"
    description: "Persists transactional data and audit logs within VPC Service Controls"