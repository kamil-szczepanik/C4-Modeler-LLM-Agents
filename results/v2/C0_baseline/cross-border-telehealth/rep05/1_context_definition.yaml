level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides secure video consultations, e-prescriptions, and an AI symptom checker for patients across the EU and US, bridging fragmented regional healthcare markets."
elements:
  - type: "person"
    name: "Patients (EU/US)"
    description: "External actors accessing video consultations, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "External actors conducting consultations and issuing treatments."
  - type: "person"
    name: "Pharmacies & Compliance Officers"
    description: "External actors handling fulfillment and regulatory audits."
  - type: "externalSystem"
    name: "Regional Pharmacy Networks"
    description: "External systems for processing prescription fulfillment."
  - type: "externalSystem"
    name: "Third-Party Video Infrastructure"
    description: "External video infrastructure providing video consultation capabilities."
  - type: "externalSystem"
    name: "Regional Identity Providers"
    description: "External identity providers handling authentication via OAuth 2.0 / OIDC."
relationships:
  - source: "Patients (EU/US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "TLS 1.3 over HTTPS, WebRTC, short-lived JWTs"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Conducts consultations and issues treatments"
    technology: "TLS 1.3 over HTTPS, WebRTC, short-lived JWTs"
  - source: "Pharmacies & Compliance Officers"
    destination: "Cross-Border Telehealth Platform"
    description: "Handles fulfillment and regulatory audits"
    technology: "HTTPS, mTLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Regional Pharmacy Networks"
    description: "Sends prescription fulfillment details"
    technology: "mTLS, HL7 FHIR over HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Third-Party Video Infrastructure"
    description: "Streams video consultations"
    technology: "WebRTC, HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Regional Identity Providers"
    description: "Authenticates users via OAuth 2.0 / OIDC with step-up MFA"
    technology: "OAuth 2.0 / OIDC, HTTPS"