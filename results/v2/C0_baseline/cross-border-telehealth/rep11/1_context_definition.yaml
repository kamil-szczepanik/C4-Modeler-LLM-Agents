level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides secure video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US, enforcing strict regional data residency and compliance using Google Cloud Platform."
elements:
  - type: "person"
    name: "Patients (EU and US)"
    description: "Patients seeking secure video consultations, e-prescriptions, and AI symptom checks."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals providing consultations and prescriptions across borders."
  - type: "externalSystem"
    name: "External Pharmacies"
    description: "EU national e-prescription networks and US pharmacy systems."
  - type: "externalSystem"
    name: "Regional Payment Gateways"
    description: "Stripe and regional processors handling transactions."
  - type: "externalSystem"
    name: "Health Authorities & Auditors"
    description: "FDA, EMA, and national ministries auditing the platform."
  - type: "externalSystem"
    name: "Identity Providers"
    description: "eIDAS for EU and OAuth2/OIDC for US federated authentication and access control."
relationships:
  - source: "Patients (EU and US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS, WebRTC (SRTP/DTLS-SRTP)"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Conducts video consultations and manages patient care"
    technology: "HTTPS, WebRTC (SRTP/DTLS-SRTP)"
  - source: "Cross-Border Telehealth Platform"
    destination: "External Pharmacies"
    description: "Sends and manages e-prescriptions"
    technology: "REST, HL7 FHIR"
  - source: "Cross-Border Telehealth Platform"
    destination: "Regional Payment Gateways"
    description: "Processes payments for services"
    technology: "HTTPS REST API"
  - source: "Health Authorities & Auditors"
    destination: "Cross-Border Telehealth Platform"
    description: "Performs zero-trust read-only audits"
    technology: "HTTPS via zero-trust audit proxies"
  - source: "Identity Providers"
    destination: "Cross-Border Telehealth Platform"
    description: "Authenticates users and manages consent-driven access"
    technology: "OAuth2 / OIDC / eIDAS"