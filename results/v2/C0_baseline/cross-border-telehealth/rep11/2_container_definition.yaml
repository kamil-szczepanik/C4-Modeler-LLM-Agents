level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU and US)"
    description: "Patients seeking secure video consultations, e-prescriptions, and AI symptom checks."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals providing consultations and prescriptions across borders."
  - type: "person"
    name: "Platform Administrators / Compliance Officers"
    description: "Personnel overseeing platform security, compliance, and auditing."
  - type: "externalSystem"
    name: "External Pharmacies"
    description: "EU national e-prescription networks and US pharmacy systems."
  - type: "externalSystem"
    name: "Regional Payment Gateways"
    description: "Stripe and regional processors handling transactions."
  - type: "externalSystem"
    name: "Health Authorities & Auditors"
    description: "FDA, EMA, and national ministries auditing the platform."
  - type: "externalSystem"
    name: "Identity Providers"
    description: "eIDAS for EU and OAuth2/OIDC for US federated authentication and access control."
  - type: "container"
    name: "Web App & Mobile App"
    technology: "React / Flutter"
    description: "Cross-platform client applications providing user interfaces for patients and clinicians with degraded video handling."
  - type: "container"
    name: "API Gateway"
    technology: "Cloud Endpoints / Envoy"
    description: "Entry point managing external and internal routing and ingress traffic."
  - type: "container"
    name: "Identity & Access Management (IAM) / Consent Service"
    technology: "OAuth2 / OIDC / Google Secret Manager"
    description: "Manages user authentication, authorization, and consent-driven access."
  - type: "container"
    name: "Core Services Container"
    technology: "Spring Boot / Java"
    description: "Handles core business logic, e-prescriptions, and platform operations."
  - type: "container"
    name: "AI Symptom Checker Container"
    technology: "Python / FastAPI / PyTorch / MLflow"
    description: "Provides AI-driven symptom checking and traceability."
  - type: "container"
    name: "SFU Video Container"
    technology: "LiveKit / Janus"
    description: "Manages real-time WebRTC video consultations."
  - type: "container"
    name: "Async Event Broker"
    technology: "Google Cloud Pub/Sub"
    description: "Handles asynchronous messaging and event distribution with Dead Letter Queues."
  - type: "container"
    name: "Data Storage"
    technology: "Cloud SQL PostgreSQL / Cloud Storage / CMEK"
    description: "Persists structured data and files with regional data isolation and CMEK encryption."
relationships:
  - source: "Patients (EU and US)"
    destination: "Web App & Mobile App"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS/JSON and WebRTC (Video)"
  - source: "Licensed Clinicians"
    destination: "Web App & Mobile App"
    description: "Conducts video consultations and manages patient care"
    technology: "HTTPS/JSON and WebRTC (Video)"
  - source: "Platform Administrators / Compliance Officers"
    destination: "Web App & Mobile App"
    description: "Manages compliance and platform configurations"
    technology: "HTTPS/TLS 1.3"
  - source: "Web App & Mobile App"
    destination: "API Gateway"
    description: "Sends API requests and route traffic"
    technology: "HTTPS/TLS 1.3"
  - source: "API Gateway"
    destination: "Core Services Container"
    description: "Routes requests to core business logic"
    technology: "gRPC with mTLS (Istio/Anthos)"
  - source: "API Gateway"
    destination: "AI Symptom Checker Container"
    description: "Routes requests for AI symptom analysis"
    technology: "gRPC with mTLS (Istio/Anthos)"
  - source: "API Gateway"
    destination: "Identity & Access Management (IAM) / Consent Service"
    description: "Authenticates users and validates consent"
    technology: "gRPC with mTLS (Istio/Anthos)"
  - source: "Core Services Container"
    destination: "Async Event Broker"
    description: "Publishes and consumes asynchronous events"
    technology: "AMQP/Pub/Sub protocols"
  - source: "Core Services Container"
    destination: "Data Storage"
    description: "Reads and writes transactional data"
    technology: "Secure database connections with CMEK encryption"
  - source: "AI Symptom Checker Container"
    destination: "Data Storage"
    description: "Logs model artifacts and telemetry"
    technology: "Secure database connections with CMEK encryption"
  - source: "Async Event Broker"
    destination: "External Pharmacies"
    description: "Sends e-prescriptions and messaging"
    technology: "Encrypted HTTPS"
  - source: "Core Services Container"
    destination: "Regional Payment Gateways"
    description: "Processes billing and transactions"
    technology: "HTTPS REST API"
  - source: "Identity & Access Management (IAM) / Consent Service"
    destination: "Identity Providers"
    description: "Federates authentication"
    technology: "OAuth2 / OIDC / eIDAS"
  - source: "Health Authorities & Auditors"
    destination: "API Gateway"
    description: "Performs audit logging and compliance checks"
    technology: "HTTPS via zero-trust audit proxies"