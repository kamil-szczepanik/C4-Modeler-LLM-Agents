level: component
scope: "Component diagram for the Async Event Broker container"
parentContainer:
  name: "Async Event Broker"
elements:
  - type: "component"
    name: "Ingest Router"
    technology: "Google Cloud Pub/Sub"
    description: "Ingests domain events published by core services via gRPC with mTLS."
  - type: "component"
    name: "Regional Topic Manager"
    technology: "Google Cloud Pub/Sub"
    description: "Routes validated payloads across regional topics and dispatches downstream tasks."
  - type: "component"
    name: "DLQ Manager"
    technology: "Google Cloud Pub/Sub Subscription Rules"
    description: "Offloads poison-pill messages to ensure system reliability and resilience."
relationships:
  - source: "Ingest Router"
    destination: "Regional Topic Manager"
    description: "Routes validated payloads [Internal GCP Pub/Sub API]"
  - source: "Regional Topic Manager"
    destination: "DLQ Manager"
    description: "Offloads poison-pill messages [Pub/Sub subscription rules]"