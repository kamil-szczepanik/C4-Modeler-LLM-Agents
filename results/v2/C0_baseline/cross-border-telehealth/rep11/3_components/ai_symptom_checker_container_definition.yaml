level: component
scope: "Component diagram for the AI Symptom Checker Container container"
parentContainer:
  name: "AI Symptom Checker Container"
elements:
  - type: "component"
    name: "Input Sanitization & Validation Engine"
    technology: "Pydantic / FastAPI"
    description: "Validates raw payloads, performs input sanitization, and provides adversarial input defense."
  - type: "component"
    name: "Inference Engine"
    technology: "PyTorch"
    description: "Executes the local symptom-checking model and passes sanitized features into raw recommendations."
  - type: "component"
    name: "Disclaimer & Localization Formatter"
    technology: "Python / FastAPI"
    description: "Applies disclaimers and localization formatting to raw recommendations."
  - type: "component"
    name: "Audit & Telemetry Logger"
    technology: "MLflow Tracking Client"
    description: "Triggers telemetry records and persists immutable logs via SQL/REST with CMEK."
relationships:
  - source: "Input Sanitization & Validation Engine"
    destination: "Inference Engine"
    description: "Passes sanitized features [In-process]"
  - source: "Inference Engine"
    destination: "Disclaimer & Localization Formatter"
    description: "Passes raw recommendation [In-process]"
  - source: "Disclaimer & Localization Formatter"
    destination: "Audit & Telemetry Logger"
    description: "Triggers telemetry record [Async Queue]"