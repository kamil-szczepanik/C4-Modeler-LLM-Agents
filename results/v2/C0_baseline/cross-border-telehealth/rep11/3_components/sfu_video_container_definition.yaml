level: component
scope: "Component diagram for the SFU Video Container container"
parentContainer:
  name: "SFU Video Container"
elements:
  - type: "component"
    name: "WebRTC Media Router"
    technology: "LiveKit Server / Go"
    description: "Manages secure, real-time WebRTC video consultations with adaptive streaming."
  - type: "component"
    name: "Adaptive Bitrate Controller"
    technology: "LiveKit Egress/Ingress SDK / Go"
    description: "Handles adaptive streaming and publishes degradation metrics."
  - type: "component"
    name: "Session Signaling Handler"
    technology: "WebSockets / gRPC"
    description: "Handles session signaling for real-time video consultations."
  - type: "component"
    name: "TURN/STUN Relay Service"
    technology: "Coturn"
    description: "Provides regional NAT and firewall traversal."
  - type: "person"
    name: "Patients"
    technology: "WebRTC / SRTP"
    description: "EU and US patients using video consultations."
  - type: "person"
    name: "Licensed Clinicians"
    technology: "WebRTC / SRTP"
    description: "Clinicians conducting consultations."
  - type: "container"
    name: "Core Services Container"
    technology: "gRPC with mTLS"
    description: "Backend core services container."
  - type: "system"
    name: "Google Cloud Pub/Sub"
    technology: "Google Cloud Pub/Sub over TLS"
    description: "Asynchronous telemetry and event publishing."
relationships:
  - source: "Patients"
    destination: "WebRTC Media Router"
    description: "Connects via WebRTC (UDP/TCP) using SRTP"
  - source: "Licensed Clinicians"
    destination: "WebRTC Media Router"
    description: "Connects via WebRTC (UDP/TCP) using SRTP"
  - source: "Session Signaling Handler"
    destination: "Core Services Container"
    description: "Communicates via gRPC with mTLS"
  - source: "Adaptive Bitrate Controller"
    destination: "Google Cloud Pub/Sub"
    description: "Publishes degradation metrics over TLS"