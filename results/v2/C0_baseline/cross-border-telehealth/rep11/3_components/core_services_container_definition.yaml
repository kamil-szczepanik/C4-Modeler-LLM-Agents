level: component
scope: "Component diagram for the Core Services Container container"
parentContainer:
  name: "Core Services Container"
elements:
  - type: "component"
    name: "Patient Management & Consent Component"
    technology: "Spring Boot / Java"
    description: "Handles patient profiles, onboarding, and strict consent tracking for GDPR and HIPAA compliance."
  - type: "component"
    name: "E-Prescription Routing Component"
    technology: "Spring Boot / Java"
    description: "Routes electronic prescriptions securely to regional fulfillment partners."
  - type: "component"
    name: "Clinical Documentation Component"
    technology: "Spring Boot / Java"
    description: "Manages immutable clinical notes and consultation records."
  - type: "component"
    name: "Interoperability & Translation Component"
    technology: "Spring Boot / Java"
    description: "Translates data formats and securely communicates with external pharmacies."
  - type: "component"
    name: "Data Storage"
    technology: "Cloud SQL PostgreSQL with CMEK"
    description: "Stores encrypted relational data with region-locked constraints."
  - type: "component"
    name: "Async Event Broker"
    technology: "Google Cloud Pub/Sub with DLQ"
    description: "Manages reliable asynchronous messaging and dead-letter queues."
  - type: "component"
    name: "External Pharmacies"
    technology: "HTTPS REST/SOAP with mTLS"
    description: "External systems receiving transmitted prescriptions."
relationships:
  - source: "Patient Management & Consent Component"
    destination: "Data Storage"
    description: "Reads and writes encrypted relational data using CMEK"
  - source: "E-Prescription Routing Component"
    destination: "Async Event Broker"
    description: "Publishes asynchronous prescription events via AMQP/Pub/Sub"
  - source: "Interoperability & Translation Component"
    destination: "External Pharmacies"
    description: "Transmits prescriptions via outbound HTTPS REST/SOAP with mTLS and circuit breaking"