level: component
scope: "Component diagram for the Data Storage container"
parentContainer:
  name: "Data Storage"
elements:
  - type: "component"
    name: "Relational Database Instance"
    technology: "Cloud SQL PostgreSQL"
    description: "Persists structured healthcare data and enforces patient consent via row-level security."
  - type: "component"
    name: "Object Storage Bucket"
    technology: "Google Cloud Storage"
    description: "Persists unstructured audit logs, model artifacts, and telemetry."
  - type: "component"
    name: "Key Management Service"
    technology: "Cloud KMS / CMEK"
    description: "Manages localized Customer-Managed Encryption Keys for cryptographic data isolation."
  - type: "component"
    name: "Data Access Proxy"
    technology: "Envoy / PostgREST"
    description: "Evaluates patient consent and executes queries via PostgreSQL row-level security."
  - type: "component"
    name: "Change Data Capture"
    technology: "Google Cloud Datastream"
    description: "Publishes transactional deltas for offline delta-sync payloads."
relationships:
  - source: "Data Access Proxy"
    destination: "Relational Database Instance"
    description: "Evaluates patient consent and executes queries via PostgreSQL row-level security"
  - type: "Change Data Capture"
    destination: "Google Cloud Pub/Sub"
    description: "Publishes transactional deltas for offline delta-sync payloads"