level: component
scope: "Component diagram for the Identity & Access Management (IAM) / Consent Service container"
parentContainer:
  name: "Identity & Access Management (IAM) / Consent Service"
elements:
  - type: "component"
    name: "Authentication Component"
    technology: "Spring Security / OIDC"
    description: "Manages user authentication and federates with external identity providers."
  - type: "component"
    name: "Consent Engine"
    technology: "Spring Boot / Domain Model"
    description: "Handles granular consent-driven access and business logic."
  - type: "component"
    name: "Consent Ledger"
    technology: "Cloud SQL PostgreSQL per region"
    description: "Persists immutable consent logs ensuring strict regional data residency."
  - type: "component"
    name: "Policy Enforcement Interceptor"
    technology: "gRPC / Envoy Filter"
    description: "Enforces regional data residency and regulatory compliance by intercepting and validating requests."
  - type: "component"
    name: "Revocation Cache Component"
    technology: "Google Cloud Memorystore Redis"
    description: "Provides low-latency revocation checks without cross-region leaks."
  - type: "component"
    name: "External Identity Providers"
    technology: "eIDAS, OAuth2/OIDC IdPs"
    description: "External systems used for federating authentication."
  - type: "component"
    name: "Google Secret Manager"
    technology: "Google Cloud Secret Manager"
    description: "Manages secure credentials and OIDC client secrets with automated rotation."
relationships:
  - source: "API Gateway"
    destination: "Policy Enforcement Interceptor"
    description: "Validates requests [gRPC with mTLS via Istio/Anthos]"
  - source: "Authentication Component"
    destination: "External Identity Providers"
    description: "Federates authentication [OAuth2 / OIDC / eIDAS]"
  - source: "Policy Enforcement Interceptor"
    destination: "Revocation Cache Component"
    description: "Checks consent state [gRPC with mTLS]"
  - source: "Consent Engine"
    destination: "Consent Ledger"
    description: "Persists immutable logs [PostgreSQL with CMEK]"