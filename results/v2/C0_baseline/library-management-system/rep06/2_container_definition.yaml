level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "End-users accessing self-service search and borrowing portals."
  - type: "person"
    name: "Librarians / Circulation Staff"
    description: "Users managing daily cataloguing and circulation."
  - type: "person"
    name: "Library Administrators"
    description: "Users handling reporting, analytics, and system inventory."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system for authentication and MFA."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system for processing fines and fees."
  - type: "externalSystem"
    name: "EU Cloud/CDN Provider"
    description: "Edge infrastructure for content delivery and latency reduction."
  - type: "container"
    name: "Web Application (SPA)"
    technology: "React / TypeScript"
    description: "Frontend single-page application providing user interfaces for patrons, staff, and administrators."
  - type: "container"
    name: "API Gateway (Nginx / Kong)"
    technology: "Nginx / Kong"
    description: "Handles routing, rate limiting, and JWT validation."
  - type: "container"
    name: "Catalogue & Search Service"
    technology: "Spring Boot / Node.js with OpenSearch"
    description: "Provides high-performance search and cataloging capabilities."
  - type: "container"
    name: "Circulation Service"
    technology: "Spring Boot"
    description: "Manages circulation workflows and borrowing operations."
  - type: "container"
    name: "Notification Service"
    technology: "Python / Celery with Sendinblue/Brevo EU"
    description: "Handles asynchronous email and SMS notifications."
  - type: "container"
    name: "Analytics & Reporting Service"
    technology: "Spring Boot / ClickHouse"
    description: "Processes and provides system analytics and reporting."
  - type: "container"
    name: "Event Broker"
    technology: "Apache Kafka / AWS EventBridge EU"
    description: "Enables asynchronous messaging and event-driven workflows across services."
  - type: "container"
    name: "OpenTelemetry Collector & Audit Logging Service"
    technology: "OpenTelemetry"
    description: "Collects telemetry data and provides audit logging."
  - type: "container"
    name: "Managed Databases"
    technology: "PostgreSQL Multi-AZ, Read Replica / ClickHouse"
    description: "Stores relational data and search indexes securely within EU managed cloud services."
relationships:
  - source: "Library Patrons"
    destination: "Web Application (SPA)"
    description: "Interacts with self-service portals"
    technology: "HTTPS (TLS 1.3)"
  - source: "Librarians / Circulation Staff"
    destination: "Web Application (SPA)"
    description: "Manages circulation and cataloging"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Administrators"
    destination: "Web Application (SPA)"
    description: "Accesses analytics and reports"
    technology: "HTTPS (TLS 1.3)"
  - source: "Web Application (SPA)"
    destination: "API Gateway (Nginx / Kong)"
    description: "Sends client requests"
    technology: "HTTPS (TLS 1.3)"
  - source: "API Gateway (Nginx / Kong)"
    destination: "Catalogue & Search Service"
    description: "Routes search and catalog queries"
    technology: "gRPC and internal REST"
  - source: "API Gateway (Nginx / Kong)"
    destination: "Circulation Service"
    description: "Routes circulation requests"
    technology: "gRPC and internal REST"
  - source: "API Gateway (Nginx / Kong)"
    destination: "Analytics & Reporting Service"
    description: "Routes reporting requests"
    technology: "gRPC and internal REST"
  - source: "Catalogue & Search Service"
    destination: "Managed Databases"
    description: "Queries and persists catalogue data and search indexes"
    technology: "private VPC"
  - source: "Circulation Service"
    destination: "Managed Databases"
    description: "Queries and persists circulation data"
    technology: "private VPC"
  - source: "Catalogue & Search Service"
    destination: "Event Broker"
    description: "Publishes and consumes asynchronous events"
    technology: "Kafka / EventBridge protocol"
  - source: "Circulation Service"
    destination: "Event Broker"
    description: "Publishes and consumes asynchronous events"
    technology: "Kafka / EventBridge protocol"
  - source: "Notification Service"
    destination: "Event Broker"
    description: "Consumes notification events"
    technology: "Kafka / EventBridge protocol"
  - source: "Notification Service"
    destination: "EU Cloud/CDN Provider"
    description: "Sends EU-compliant emails and SMS"
    technology: "Sendinblue/Brevo EU API"
  - source: "API Gateway (Nginx / Kong)"
    destination: "Identity Provider (IdP)"
    description: "Validates user authentication and MFA"
    technology: "OAuth 2.0 / OIDC"
  - source: "Circulation Service"
    destination: "Payment Gateway"
    description: "Processes fines and fees"
    technology: "REST APIs over TLS 1.3"