level: component
scope: "Component diagram for the Circulation Service container"
parentContainer:
  name: "Circulation Service"
elements:
  - type: "component"
    name: "Circulation API Controller"
    technology: "Spring @RestController"
    description: "Exposes REST endpoints for patron self-service and staff requests, enforcing JWT-based RBAC."
  - type: "component"
    name: "Loan Management Component"
    technology: "Spring @Service"
    description: "Executes business logic for borrowing workflows and renewals."
  - type: "component"
    name: "Fine & Fee Component"
    technology: "Spring @Service"
    description: "Manages fine processing and interfaces with external payment gateways."
  - type: "component"
    name: "Data Access Repository"
    technology: "Spring Data JPA"
    description: "Queries and persists transactional data to the managed PostgreSQL database."
  - type: "component"
    name: "Event Publisher/Consumer"
    technology: "Spring Cloud Stream / Kafka"
    description: "Publishes and consumes domain events asynchronously."
  - type: "component"
    name: "Notification Event Adapter"
    technology: "Spring @Component"
    description: "Adapts notification events for downstream messaging."
  - type: "component"
    name: "API Gateway"
    technology: "Nginx / Kong"
    description: "Routes patron self-service and staff requests using gRPC and internal REST over mTLS."
  - type: "component"
    name: "Managed PostgreSQL Database"
    technology: "PostgreSQL"
    description: "Stores transactional data with AES-256 encryption in a private VPC."
  - type: "component"
    name: "External Payment Gateway"
    technology: "REST APIs over TLS 1.3"
    description: "Processes fine payments and tokenized references."
  - type: "component"
    name: "Event Broker"
    technology: "Apache Kafka"
    description: "Handles asynchronous domain event messaging."
relationships:
  - source: "API Gateway"
    destination: "Circulation API Controller"
    description: "Routes patron self-service and staff requests [gRPC and internal REST over mTLS]"
  - source: "Circulation API Controller"
    destination: "Loan Management Component"
    description: "Executes business logic with JWT-based RBAC enforcement"
  - source: "Circulation API Controller"
    destination: "Fine & Fee Component"
    description: "Executes business logic with JWT-based RBAC enforcement"
  - source: "Data Access Repository"
    destination: "Managed PostgreSQL Database"
    description: "Queries and persists transactional data [private VPC with AES-256 encryption]"
  - source: "Fine & Fee Component"
    destination: "External Payment Gateway"
    description: "Processes fine payments and tokenized references [REST APIs over TLS 1.3 with Resilience4j circuit breakers]"
  - source: "Event Publisher/Consumer"
    destination: "Event Broker"
    description: "Publishes domain events [Kafka protocol with acks=all and W3C Trace Context headers]"