level: component
scope: "Component diagram for the Event Broker container"
parentContainer:
  name: "Event Broker"
elements:
  - type: "component"
    name: "Kafka Brokers"
    technology: "Apache Kafka"
    description: "Handles ingestion and storage of asynchronous events for high throughput and zero message loss."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry"
    description: "Validates event schemas for catalogue and circulation services."
  - type: "component"
    name: "Access Control & Auth Manager"
    technology: "SASL/SCRAM / mTLS"
    description: "Manages access control and authentication within the event broker."
  - type: "component"
    name: "OpenTelemetry Interceptor"
    technology: "OpenTelemetry"
    description: "Intercepts event streams to capture traces and metrics."
  - type: "component"
    name: "DLQ Manager"
    technology: "Kafka DLQ"
    description: "Manages dead-letter queues for handling failed message processing."
  - type: "component"
    name: "Metrics Exporter"
    technology: "Prometheus Exporter"
    description: "Exports metrics from the event broker to observability tools."
  - type: "component"
    name: "MirrorMaker2 Replication Controller"
    technology: "Kafka MirrorMaker2"
    description: "Handles cross-cluster replication and synchronization."
relationships:
  - source: "Kafka Brokers"
    destination: "OpenTelemetry Interceptor"
    description: "Passes event telemetry data"
  - source: "Schema Registry"
    destination: "Kafka Brokers"
    description: "Validates event schemas during ingestion"