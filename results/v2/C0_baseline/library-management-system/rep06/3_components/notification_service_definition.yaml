level: component
scope: "Component diagram for the Notification Service container"
parentContainer:
  name: "Notification Service"
elements:
  - type: "component"
    name: "Notification Consumer"
    technology: "Python / Celery Worker"
    description: "Consumes notification events and handles asynchronous task orchestration for high throughput."
  - type: "component"
    name: "Preference Manager"
    technology: "Python / FastAPI or Django"
    description: "Manages patron preferences and communication settings."
  - type: "component"
    name: "Dispatch Adapter"
    technology: "Sendinblue/Brevo EU API Client"
    description: "Sends outbound notifications ensuring strict EU-only data residency."
  - type: "component"
    name: "Template Engine"
    technology: "Jinja2"
    description: "Sandboxed template engine for localized, multi-language rendering and unsubscribe headers."
  - type: "component"
    name: "Audit & Metrics Publisher"
    technology: "OpenTelemetry SDK"
    description: "Emits structured logs and traces for audit logging and delivery tracking."
  - type: "component"
    name: "Redis"
    technology: "Redis"
    description: "State store and deduplication cache for caching and idempotency tracking with encryption at rest for PII protection."
  - type: "component"
    name: "Event Broker"
    technology: "Apache Kafka / AWS EventBridge EU"
    description: "Publishes and routes notification events to consumers."
relationships:
  - source: "Event Broker"
    destination: "Notification Consumer"
    description: "Consumes notification events [Kafka/AMQP protocol]"
  - source: "Notification Consumer"
    destination: "Template Engine"
    description: "Renders localized messages [Internal Function Call]"
  - source: "Template Engine"
    destination: "Dispatch Adapter"
    description: "Sends formatted payload [Internal Function Call]"
  - source: "Dispatch Adapter"
    destination: "Sendinblue/Brevo EU"
    description: "Sends outbound notifications [HTTPS API, TLS 1.3]"
  - source: "Audit & Metrics Publisher"
    destination: "OpenTelemetry Collector"
    description: "Emits structured logs and traces [OTLP over gRPC]"