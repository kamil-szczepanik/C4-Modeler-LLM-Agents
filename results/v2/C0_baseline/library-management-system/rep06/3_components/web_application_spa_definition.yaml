level: component
scope: "Component diagram for the Web Application (SPA) container"
parentContainer:
  name: "Web Application (SPA)"
elements:
  - type: "component"
    name: "Authentication & Session Manager"
    technology: "react-oidc-context"
    description: "In-memory token management using Authorization Code Flow with PKCE."
  - type: "component"
    name: "Role-Based UI Router"
    technology: "React Router"
    description: "Manages persona-specific routing for patrons, librarians, and administrators."
  - type: "component"
    name: "API Client Layer"
    technology: "TanStack Query / Axios"
    description: "Client-side data fetching and caching to meet sub-800ms search targets."
  - type: "component"
    name: "Localization & Accessibility Engine"
    technology: "react-i18next"
    description: "Provides multi-language support and ensures WCAG 2.1 AA accessibility compliance."
  - type: "component"
    name: "Offline & State Persistence Manager"
    technology: "IndexedDB with Zustand"
    description: "Secure, non-PII offline state caching for patchy Wi-Fi degradation."
relationships:
  - source: "Role-Based UI Router"
    destination: "Authentication & Session Manager"
    description: "Validates user session and roles"
  - source: "API Client Layer"
    destination: "Authentication & Session Manager"
    description: "Injects access tokens into API requests"
  - source: "Offline & State Persistence Manager"
    destination: "API Client Layer"
    description: "Syncs cached state with server responses"