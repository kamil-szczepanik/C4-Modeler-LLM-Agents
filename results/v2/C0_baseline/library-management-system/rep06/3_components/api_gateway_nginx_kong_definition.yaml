level: component
scope: "Component diagram for the API Gateway (Nginx / Kong) container"
parentContainer:
  name: "API Gateway (Nginx / Kong)"
elements:
  - type: "component"
    name: "SSL/TLS Termination & Routing Engine"
    technology: "Nginx core"
    description: "Handles ingress traffic and internal gRPC/mTLS dispatch."
  - type: "component"
    name: "Auth & Security Plugin"
    technology: "OAuth 2.0 / OIDC / JWT"
    description: "Validates JWTs, enforces RBAC, and interacts with the Identity Provider (IdP)."
  - type: "component"
    name: "Rate Limiting & Throttling Filter"
    technology: "Kong / Nginx module"
    description: "Protects backend services and enforces request quotas."
  - type: "component"
    name: "Telemetry & Audit Interceptor"
    technology: "OpenTelemetry"
    description: "Injects W3C Trace Context headers to the OpenTelemetry Collector."
  - type: "component"
    name: "Redis Cache"
    technology: "Redis (Local/Cluster)"
    description: "Caches JWT tokens and session data via RESP over TLS."
relationships:
  - source: "Web Application (SPA)"
    destination: "SSL/TLS Termination & Routing Engine"
    description: "Client requests via HTTPS [TLS 1.3]"
  - source: "Auth & Security Plugin"
    destination: "Identity Provider (IdP)"
    description: "Token validation and introspection via HTTPS/OIDC"
  - source: "SSL/TLS Termination & Routing Engine"
    destination: "Catalogue & Search Service"
    description: "Internal routing via gRPC over mTLS"
  - source: "SSL/TLS Termination & Routing Engine"
    destination: "Circulation Service"
    description: "Internal routing via gRPC over mTLS"
  - source: "Auth & Security Plugin"
    destination: "Redis Cache"
    description: "Token and session verification via RESP over TLS"