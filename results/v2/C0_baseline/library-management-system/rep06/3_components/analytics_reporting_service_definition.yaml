level: component
scope: "Component diagram for the Analytics & Reporting Service container"
parentContainer:
  name: "Analytics & Reporting Service"
elements:
  - type: "component"
    name: "Analytics REST Controller"
    technology: "Spring MVC"
    description: "Routes reporting requests received from the API Gateway."
  - type: "component"
    name: "Dashboard Widget Provider"
    technology: "Spring MVC / REST"
    description: "Provides real-time operational widgets for administrators and librarians."
  - type: "component"
    name: "Report Query Engine"
    technology: "Spring Data JPA / ClickHouse JDBC"
    description: "Executes compliant batch reports and analytical queries against ClickHouse."
  - type: "component"
    name: "Data Anonymization Module"
    technology: "Java"
    description: "Enforces strict GDPR data anonymization."
  - type: "component"
    name: "Export Scheduler"
    technology: "Spring Scheduler / Apache POI & OpenCSV"
    description: "Handles asynchronous generation of CSV and PDF report exports."
  - type: "component"
    name: "Query Caching Layer"
    technology: "Spring Cache / Caffeine"
    description: "Checks and stores aggregated metrics to protect the ClickHouse database from high-volume dashboard polling."
  - type: "component"
    name: "Managed Databases"
    technology: "ClickHouse"
    description: "High-performance columnar database for analytics and reporting."
relationships:
  - source: "Analytics REST Controller"
    destination: "Report Query Engine"
    description: "Delegates queries [In-process]"
  - source: "Analytics REST Controller"
    destination: "Dashboard Widget Provider"
    description: "Delegates queries [In-process]"
  - source: "Dashboard Widget Provider"
    destination: "Query Caching Layer"
    description: "Checks/stores aggregated metrics [In-process]"
  - source: "Query Caching Layer"
    destination: "Report Query Engine"
    description: "Fallback for cache misses [In-process]"
  - source: "Report Query Engine"
    destination: "Managed Databases"
    description: "Executes analytical queries [TCP / Native Protocol, TLS]"