level: component
scope: "Component diagram for the OpenTelemetry Collector & Audit Logging Service container"
parentContainer:
  name: "OpenTelemetry Collector & Audit Logging Service"
elements:
  - type: "component"
    name: "OTel Collector Core"
    technology: "OpenTelemetry (otelcol-contrib)"
    description: "Low-overhead telemetry ingestion, PII scrubbing, and core data routing."
  - type: "component"
    name: "Audit Log Processor Component"
    technology: "Go"
    description: "Custom audit log processor implementation for handling security logs."
  - type: "component"
    name: "Audit Log Exporter"
    technology: "OpenTelemetry Exporter"
    description: "Exports processed audit logs to persistent storage."
  - type: "component"
    name: "Audit Query API Component"
    technology: "Go / REST or gRPC"
    description: "Handles query requests for audit data."
  - type: "component"
    name: "Managed Databases"
    technology: "PostgreSQL Multi-AZ & Read Replicas"
    description: "EU-compliant immutable audit storage and query offloading."
relationships:
  - source: "Microservices"
    destination: "OTel Collector Core"
    description: "Sends telemetry via gRPC (Port 4317) with mTLS"
  - source: "OTel Collector Core"
    destination: "Audit Log Processor Component"
    description: "Forwards logs for processing and PII scrubbing"
  - source: "Audit Log Processor Component"
    destination: "Audit Log Exporter"
    description: "Sends processed logs"
  - source: "Audit Log Exporter"
    destination: "Managed Databases"
    description: "Persists audit logs via PostgreSQL wire protocol over TLS"
  - source: "API Gateway"
    destination: "Audit Query API Component"
    description: "Queries audit data via TLS 1.3"
  - source: "Audit Query API Component"
    destination: "Managed Databases"
    description: "Offloads queries to PostgreSQL Read Replicas via TLS"