level: component
scope: "Component diagram for the Managed Databases container"
parentContainer:
  name: "Managed Databases"
elements:
  - type: "component"
    name: "PostgreSQL Primary Node"
    technology: "AWS RDS / Cloud SQL EU-Central, PostgreSQL Multi-AZ"
    description: "Provides secure, highly available data persistence for transactional data with EU-only data residency, automated backups, and CMEK encryption."
  - type: "component"
    name: "PostgreSQL Read Replica"
    technology: "PostgreSQL"
    description: "Handles read-only queries to separate read traffic from the primary node."
  - type: "component"
    name: "ClickHouse Cluster"
    technology: "ClickHouse"
    description: "Delivers dedicated, isolated columnar performance for administrative analytics and reporting."
  - type: "component"
    name: "PgBouncer Connection Pooling Proxies"
    technology: "PgBouncer"
    description: "Provides connection pooling to prevent thread exhaustion during traffic spikes."
  - type: "component"
    name: "Customer-Managed Encryption Keys (CMEK)"
    technology: "EU-region KMS"
    description: "Enforces robust security and encryption for data persistence."
relationships:
  - source: "Circulation Service"
    destination: "PgBouncer Connection Pooling Proxies"
    description: "Transactions [TCP/6432, TLS]"
  - source: "Catalogue & Search Service"
    destination: "PgBouncer Connection Pooling Proxies"
    description: "Read-only queries [TCP/6432, TLS]"
  - source: "Analytics & Reporting Service"
    destination: "ClickHouse Cluster"
    description: "Columnar data ingestion/queries [TCP/9000, TLS]"