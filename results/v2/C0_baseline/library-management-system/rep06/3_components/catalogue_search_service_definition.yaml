level: component
scope: "Component diagram for the Catalogue & Search Service container"
parentContainer:
  name: "Catalogue & Search Service"
elements:
  - type: "component"
    name: "Search Controller & Query Optimizer"
    technology: "Spring Boot, Project Reactor"
    description: "Handles search requests and optimizes queries for high-performance patron searches."
  - type: "component"
    name: "Catalog Management Component"
    technology: "Spring Boot"
    description: "Manages catalog assets, metadata, and circulation records."
  - type: "component"
    name: "OpenSearch Indexing & Sync Engine"
    technology: "OpenSearch Engine"
    description: "Synchronizes domain events asynchronously for search index updates."
  - type: "component"
    name: "Data Access Repository"
    technology: "Spring Data JPA, PostgreSQL"
    description: "Interacts with managed databases via private VPC for transactional and search data."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Apache Kafka, Resilience4j"
    description: "Publishes catalog changes and telemetry using Kafka with fault-tolerant circuit breaking."
relationships:
  - source: "Search Controller & Query Optimizer"
    destination: "Data Access Repository"
    description: "Queries transactional data and search indexes via private VPC"
  - source: "Catalog Management Component"
    destination: "Data Access Repository"
    description: "Persists and retrieves catalog metadata"
  - source: "OpenSearch Indexing & Sync Engine"
    destination: "Data Access Repository"
    description: "Updates search indexes"
  - source: "Event Publisher Component"
    destination: "Event Broker (Apache Kafka)"
    description: "Publishes catalog changes and telemetry using Kafka protocol"
  - source: "OpenSearch Indexing & Sync Engine"
    destination: "Event Broker (Apache Kafka)"
    description: "Consumes domain events for asynchronous index synchronization"