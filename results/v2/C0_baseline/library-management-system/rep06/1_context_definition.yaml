level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A comprehensive platform for public and academic libraries to catalogue physical and digital items, manage circulation, and provide self-service portals with strict EU-only data residency and sub-second search performance."
elements:
  - type: "person"
    name: "Library Patrons"
    description: "End-users accessing self-service search and borrowing portals."
  - type: "person"
    name: "Librarians / Circulation Staff"
    description: "Users managing daily cataloguing and circulation."
  - type: "person"
    name: "Library Administrators"
    description: "Users handling reporting, analytics, and system inventory."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system for authentication and MFA."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system for processing fines and fees."
  - type: "externalSystem"
    name: "EU Cloud/CDN Provider"
    description: "Edge infrastructure for content delivery and latency reduction."
relationships:
  - source: "Library Patrons"
    destination: "Library Management System"
    description: "Accesses self-service search and borrowing portals"
    technology: "HTTPS over Web/Mobile UI"
  - source: "Librarians / Circulation Staff"
    destination: "Library Management System"
    description: "Manages daily cataloguing and circulation"
    technology: "HTTPS over Web/Mobile UI"
  - source: "Library Administrators"
    destination: "Library Management System"
    description: "Handles reporting, analytics, and system inventory"
    technology: "HTTPS over Web/Mobile UI"
  - source: "Library Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users and handles MFA"
    technology: "OAuth 2.0 / OpenID Connect over TLS 1.3"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Processes fines and fees"
    technology: "REST APIs over TLS 1.3"