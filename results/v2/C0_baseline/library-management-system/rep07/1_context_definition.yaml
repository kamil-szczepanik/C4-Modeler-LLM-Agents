level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A EU-compliant platform designed for public and academic libraries to catalogue physical and digital items, manage circulation, and provide self-service portals, guaranteeing strict data residency and high-performance search capabilities."
elements:
  - type: "person"
    name: "Library Patrons"
    description: "End users who use self-service portals to access and borrow physical and digital library items."
  - type: "person"
    name: "Librarians / Circulation Staff"
    description: "Staff members responsible for managing item circulation and day-to-day library operations."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators who configure and manage the Library Management System."
  - type: "person"
    name: "Third-Party Vendors / Digital Content Providers"
    description: "External providers supplying digital content and items to the library system."
  - type: "externalSystem"
    name: "EU Payment Gateway"
    description: "External payment processing system for financial transactions."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External service used for sending notifications to users."
relationships:
  - source: "Library Patrons"
    destination: "Library Management System"
    description: "Accesses self-service portals for circulation and catalog tasks"
    technology: "HTTPS (TLS 1.3), OAuth 2.0 / OIDC"
  - source: "Librarians / Circulation Staff"
    destination: "Library Management System"
    description: "Manages library items and circulation"
    technology: "HTTPS (TLS 1.3), OAuth 2.0 / OIDC"
  - source: "Library Administrators"
    destination: "Library Management System"
    description: "Configures and administers the platform"
    technology: "HTTPS (TLS 1.3), OAuth 2.0 / OIDC"
  - source: "Third-Party Vendors / Digital Content Providers"
    destination: "Library Management System"
    description: "Provides digital content and items ingestion"
    technology: "SFTP / HTTPS REST webhooks"
  - source: "Library Management System"
    destination: "EU Payment Gateway"
    description: "Processes payments securely"
    technology: "HTTPS/REST protocols"
  - source: "Library Management System"
    destination: "Notification Service"
    description: "Sends asynchronous notifications"
    technology: "HTTPS/SMTP protocols via message broker"