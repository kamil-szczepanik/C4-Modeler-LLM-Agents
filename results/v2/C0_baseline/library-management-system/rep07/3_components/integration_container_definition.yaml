level: component
scope: "Component diagram for the Integration Container container"
parentContainer:
  name: "Integration Container"
elements:
  - type: "component"
    name: "Webhook Handler Component"
    technology: "Node.js/Express"
    description: "Receives secure financial webhooks from the EU Payment Gateway with HMAC verification."
  - type: "component"
    name: "Vendor Ingestion Service"
    technology: "Node.js/TypeScript with Zod"
    description: "Ingests digital content from Third-Party Vendors and provides strict schema validation."
  - type: "component"
    name: "Outbox Dispatcher Component"
    technology: "Node.js/TypeScript"
    description: "Publishes events reliably to the Async Event Broker."
  - type: "component"
    name: "Audit Logging Component"
    technology: "Node.js/Winston or Pino"
    description: "Persists immutable audit trails to the Core Domain Container."
  - type: "component"
    name: "Third-Party Vendors / Digital Content Providers"
    technology: "HTTPS / SFTP with TLS 1.3"
    description: "External providers of digital content."
  - type: "component"
    name: "EU Payment Gateway"
    technology: "HTTPS with HMAC verification"
    description: "External secure payment processing gateway."
  - type: "component"
    name: "Async Event Broker"
    technology: "Apache Kafka/RabbitMQ"
    description: "Handles asynchronous event publishing using SASL/SCRAM and mTLS."
  - type: "component"
    name: "Core Domain Container"
    technology: "PostgreSQL, EU-hosted"
    description: "Persists immutable audit trails and core library management data within an EU-isolated VPC."
relationships:
  - source: "Third-Party Vendors / Digital Content Providers"
    destination: "Vendor Ingestion Service"
    description: "Ingests digital content [HTTPS / SFTP with TLS 1.3]"
  - source: "EU Payment Gateway"
    destination: "Webhook Handler Component"
    description: "Sends secure financial webhooks [HTTPS with HMAC verification]"
  - source: "Outbox Dispatcher Component"
    destination: "Async Event Broker"
    description: "Publishes events reliably [SASL/SCRAM, mTLS]"
  - source: "Audit Logging Component"
    destination: "Core Domain Container"
    description: "Persists immutable audit trails [gRPC/REST over TLS within EU-isolated VPC]"