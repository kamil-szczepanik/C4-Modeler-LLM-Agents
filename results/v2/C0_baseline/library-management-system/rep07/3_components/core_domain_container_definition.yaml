level: component
scope: "Component diagram for the Core Domain Container container"
parentContainer:
  name: "Core Domain Container"
elements:
  - type: "component"
    name: "Cataloguing Component"
    technology: "Spring Data JPA"
    description: "Handles item cataloguing and data management within the core domain."
  - type: "component"
    name: "Circulation Component"
    technology: "Domain-Driven Design / Spring Transaction"
    description: "Manages circulation logic and transactional data processing."
  - type: "component"
    name: "Outbox Pattern Component"
    technology: "Debezium / JDBC Poller"
    description: "Ensures reliable event publishing via the transactional outbox pattern."
  - type: "component"
    name: "Audit and Compliance Component"
    technology: "Spring Data Envers / append-only tables"
    description: "Enforces compliance and maintains append-only audit data."
  - type: "component"
    name: "Security and Context Propagation Component"
    technology: "Spring Security, OAuth2/OIDC JWT"
    description: "Handles authentication, JWT validation, and context propagation."
relationships:
  - source: "Cataloguing Component"
    destination: "Audit and Compliance Component"
    description: "Logs cataloguing changes and audit data"
  - source: "Circulation Component"
    destination: "Outbox Pattern Component"
    description: "Publishes domain events via outbox"
  - source: "Security and Context Propagation Component"
    destination: "Circulation Component"
    description: "Propagates security context for requests"