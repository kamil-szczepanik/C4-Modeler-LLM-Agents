level: component
scope: "Component diagram for the Async Event Broker container"
parentContainer:
  name: "Async Event Broker"
elements:
  - type: "component"
    name: "Apache Kafka"
    technology: "Append-only log architecture / KRaft"
    description: "Acts as the async event broker providing event sourcing and partition-level ordering across 3 EU availability zones."
  - type: "component"
    name: "Strimzi Operator"
    technology: "Kubernetes Operator"
    description: "Manages deployment, KRaft consensus, and lifecycle management for the broker."
  - type: "component"
    name: "KRaft Metadata Quorum"
    technology: "KRaft"
    description: "Replaces ZooKeeper for broker state management and consensus."
  - type: "component"
    name: "Confluent Schema Registry"
    technology: "Avro / Confluent Schema Registry"
    description: "Co-located within the Strimzi footprint for Avro schema validation and contract compatibility."
relationships:
  - source: "Strimzi Operator"
    destination: "Apache Kafka"
    description: "Manages deployment and KRaft consensus"
  - source: "Apache Kafka"
    destination: "Apache Kafka"
    description: "Inter-broker communication secured via Internal mTLS"