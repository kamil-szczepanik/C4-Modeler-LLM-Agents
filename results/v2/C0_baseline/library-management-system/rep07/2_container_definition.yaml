level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "End users who use self-service portals to access and borrow physical and digital library items."
  - type: "person"
    name: "Librarians/Circulation Staff"
    description: "Staff members responsible for managing item circulation and day-to-day library operations."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators who configure and manage the Library Management System."
  - type: "person"
    name: "Third-Party Vendors/Digital Content Providers"
    description: "External providers supplying digital content and items to the library system."
  - type: "externalSystem"
    name: "EU Payment Gateway"
    description: "External EU-compliant payment processing system for financial transactions."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External service used for sending notifications to users."
  - type: "container"
    name: "Single Page Application (SPA)"
    technology: "React/TypeScript, Nginx"
    description: "User interface providing an intuitive single-page application experience for patrons and staff."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx or Spring Cloud Gateway"
    description: "Manages and routes incoming requests to the appropriate backend containers securely."
  - type: "container"
    name: "Core Domain Container"
    technology: "Java/Spring Boot, PostgreSQL (EU-hosted)"
    description: "Handles robust cataloguing, circulation logic, and transactional data storage."
  - type: "container"
    name: "Search Container"
    technology: "Elasticsearch"
    description: "Dedicated search engine ensuring sub-800ms search performance for library items."
  - type: "container"
    name: "Integration Container"
    technology: "Node.js/TypeScript"
    description: "Manages external APIs, third-party content, and payment handling."
  - type: "container"
    name: "Async Event Broker"
    technology: "Apache Kafka or RabbitMQ"
    description: "Decoupled event-driven messaging broker handling domain events and asynchronous notifications."
relationships:
  - source: "Library Patrons"
    destination: "Single Page Application (SPA)"
    description: "Interacts with the self-service portal"
    technology: "HTTPS/REST"
  - source: "Librarians/Circulation Staff"
    destination: "Single Page Application (SPA)"
    description: "Manages circulation and library items via UI"
    technology: "HTTPS/REST"
  - source: "Library Administrators"
    destination: "Single Page Application (SPA)"
    description: "Configures and administers the system via UI"
    technology: "HTTPS/REST"
  - source: "Third-Party Vendors/Digital Content Providers"
    destination: "Integration Container"
    description: "Ingests digital content and external data"
    technology: "HTTPS / SFTP"
  - source: "Single Page Application (SPA)"
    destination: "API Gateway"
    description: "Sends user requests to backend services"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "Core Domain Container"
    description: "Routes domain and circulation requests"
    technology: "gRPC or REST over TLS within EU-isolated VPC"
  - source: "API Gateway"
    destination: "Search Container"
    description: "Routes search queries"
    technology: "gRPC or REST over TLS within EU-isolated VPC"
  - source: "API Gateway"
    destination: "Integration Container"
    description: "Routes integration and external requests"
    technology: "gRPC or REST over TLS within EU-isolated VPC"
  - source: "Core Domain Container"
    destination: "EU-hosted PostgreSQL"
    description: "Persists transactional data with encryption-at-rest"
    technology: "Database protocol over TLS"
  - source: "Core Domain Container"
    destination: "Async Event Broker"
    description: "Publishes domain events"
    technology: "SASL/SCRAM, mTLS"
  - source: "Integration Container"
    destination: "Async Event Broker"
    description: "Asynchronously consumes events with DLQs"
    technology: "SASL/SCRAM, mTLS"
  - source: "Integration Container"
    destination: "EU Payment Gateway"
    description: "Processes secure financial transactions"
    technology: "HTTPS"
  - source: "Integration Container"
    destination: "Notification Service"
    description: "Triggers notifications"
    technology: "HTTPS"