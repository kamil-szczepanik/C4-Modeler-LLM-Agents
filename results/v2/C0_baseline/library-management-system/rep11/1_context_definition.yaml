level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A comprehensive platform designed for public and academic libraries to catalogue physical and digital items, manage circulation, and provide self-service portals with strict EU data residency and high-performance search capabilities."
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Members of the library accessing the self-service portal to browse, borrow, and manage items."
  - type: "person"
    name: "Librarians"
    description: "Circulation staff managing day-to-day library operations, loans, and inventory."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators managing system configurations, users, and overall library policies."
  - type: "externalSystem"
    name: "EU Identity Provider"
    description: "Keycloak or Auth0 handling authentication via OIDC/OAuth2."
  - type: "externalSystem"
    name: "EU Payment Gateway"
    description: "Stripe EU or regional APIs handling secure financial transactions via REST API with mTLS."
  - type: "externalSystem"
    name: "EU Notification Service"
    description: "Service providing asynchronous notifications over HTTPS with mTLS."
  - type: "externalSystem"
    name: "EU Cloud Region Provider"
    description: "AWS Frankfurt/Ireland or OVHcloud providing EU-compliant cloud infrastructure and storage encryption (AES-256)."
  - type: "externalSystem"
    name: "Central Logging & Monitoring SIEM"
    description: "System for non-blocking audit logging and infrastructure telemetry."
  - type: "externalSystem"
    name: "Web Application Firewall (WAF)"
    description: "Security layer protecting incoming web traffic using TLS 1.3."
relationships:
  - source: "Library Patrons"
    destination: "Library Management System"
    description: "Accesses self-service portal and circulation features"
    technology: "HTTPS (TLS 1.3) via WAF"
  - source: "Librarians"
    destination: "Library Management System"
    description: "Manages circulation and library items"
    technology: "HTTPS (TLS 1.3) via WAF"
  - source: "Library Administrators"
    destination: "Library Management System"
    description: "Configures and administers the platform"
    technology: "HTTPS (TLS 1.3) via WAF"
  - source: "Library Management System"
    destination: "EU Identity Provider"
    description: "Authenticates users"
    technology: "OIDC/OAuth2 over HTTPS"
  - source: "Library Management System"
    destination: "EU Payment Gateway"
    description: "Processes membership and overdue fees"
    technology: "REST API over HTTPS with mTLS"
  - source: "Library Management System"
    destination: "EU Notification Service"
    description: "Sends automated alerts and notifications"
    technology: "Asynchronous REST API over HTTPS with mTLS"
  - source: "Library Management System"
    destination: "EU Cloud Region Provider"
    description: "Hosts data and ensures EU data residency compliance"
    technology: "AWS / OVHcloud infrastructure with AES-256"
  - source: "Library Management System"
    destination: "Central Logging & Monitoring SIEM"
    description: "Sends audit logs and infrastructure telemetry"
    technology: "Non-blocking event-driven logging"