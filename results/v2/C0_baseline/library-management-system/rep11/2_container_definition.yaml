level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Members of the library accessing the self-service portal to browse, borrow, and manage items."
  - type: "person"
    name: "Librarians"
    description: "Circulation staff managing day-to-day library operations, loans, and inventory."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators managing system configurations, users, and overall library policies."
  - type: "externalSystem"
    name: "EU Identity Provider"
    description: "Keycloak or Auth0 handling authentication via OIDC/OAuth2."
  - type: "externalSystem"
    name: "EU Payment Gateway"
    description: "Stripe EU or regional APIs handling secure financial transactions."
  - type: "externalSystem"
    name: "EU Notification Service"
    description: "Service providing asynchronous notifications over HTTPS."
  - type: "externalSystem"
    name: "EU Cloud Region Provider"
    description: "AWS Frankfurt/Ireland or OVHcloud providing EU-compliant cloud infrastructure."
  - type: "externalSystem"
    name: "Central Logging & Monitoring SIEM"
    description: "System for non-blocking audit logging and infrastructure telemetry."
  - type: "externalSystem"
    name: "Web Application Firewall (WAF)"
    description: "Security layer protecting incoming web traffic using TLS 1.3."
  - type: "container"
    name: "Patron Self-Service Portal"
    technology: "React / TypeScript SPA"
    description: "Single page application served via CDN for rapid patron engagement."
  - type: "container"
    name: "Librarian Workbench"
    technology: ".NET Core"
    description: "Modular monolith for librarians and administrators to manage system operations."
  - type: "container"
    name: "Catalog API & Search Service"
    technology: ".NET Core"
    description: "API and search service handling catalogue operations and high-performance search."
  - type: "container"
    name: "Asynchronous Processing Worker"
    technology: ".NET Core Worker Service"
    description: "Worker service handling background tasks and decoupled asynchronous processing."
  - type: "container"
    name: "Integration Gateway"
    technology: "Kong / Envoy API Gateway"
    description: "API Gateway routing and securing external and internal traffic."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL with GIN indexes"
    description: "Database storing relational data and utilizing built-in full-text search."
  - type: "container"
    name: "Message Broker"
    technology: "Redis / RabbitMQ"
    description: "Message broker supporting asynchronous processing with Dead Letter Queues."
relationships:
  - source: "Library Patrons"
    destination: "Web Application Firewall (WAF)"
    description: "Accesses patron portal via secure web traffic"
    technology: "HTTPS / TLS 1.3"
  - source: "Librarians"
    destination: "Web Application Firewall (WAF)"
    description: "Accesses librarian workbench via secure web traffic"
    technology: "HTTPS / TLS 1.3"
  - source: "Library Administrators"
    destination: "Web Application Firewall (WAF)"
    description: "Accesses administrative interfaces via secure web traffic"
    technology: "HTTPS / TLS 1.3"
  - source: "Web Application Firewall (WAF)"
    destination: "Integration Gateway"
    description: "Forwards sanitized traffic to internal integration gateway"
    technology: "HTTPS / REST over TLS 1.3"
  - source: "Patron Self-Service Portal"
    destination: "Integration Gateway"
    description: "Sends API requests to backend services"
    technology: "HTTPS / REST over TLS 1.3"
  - source: "Integration Gateway"
    destination: "Catalog API & Search Service"
    description: "Routes authenticated API requests"
    technology: "gRPC over mTLS with OAuth2/OIDC token validation"
  - source: "Librarian Workbench"
    destination: "Catalog API & Search Service"
    description: "Communicates with catalog and search services"
    technology: "gRPC over mTLS"
  - source: "Catalog API & Search Service"
    destination: "Database"
    description: "Queries and updates catalogue and operational data"
    technology: "SQL query over encrypted connections within EU availability zones"
  - source: "Asynchronous Processing Worker"
    destination: "Message Broker"
    description: "Consumes and produces asynchronous messages"
    technology: "AMQP/TCP with message-level encryption"
  - source: "Patron Self-Service Portal"
    destination: "Central Logging & Monitoring SIEM"
    description: "Sends structured JSON logs and Prometheus metrics"
    technology: "OpenTelemetry (with PII sanitization)"
  - source: "Librarian Workbench"
    destination: "Central Logging & Monitoring SIEM"
    description: "Sends structured JSON logs and Prometheus metrics"
    technology: "OpenTelemetry (with PII sanitization)"
  - source: "Catalog API & Search Service"
    destination: "Central Logging & Monitoring SIEM"
    description: "Sends structured JSON logs and Prometheus metrics"
    technology: "OpenTelemetry (with PII sanitization)"
  - source: "Asynchronous Processing Worker"
    destination: "Central Logging & Monitoring SIEM"
    description: "Sends structured JSON logs and Prometheus metrics"
    technology: "OpenTelemetry (with PII sanitization)"
  - source: "Integration Gateway"
    destination: "Central Logging & Monitoring SIEM"
    description: "Sends structured JSON logs and Prometheus metrics"
    technology: "OpenTelemetry (with PII sanitization)"
  - source: "Database"
    destination: "Central Logging & Monitoring SIEM"
    description: "Sends structured JSON logs and Prometheus metrics"
    technology: "OpenTelemetry (with PII sanitization)"
  - source: "Message Broker"
    destination: "Central Logging & Monitoring SIEM"
    description: "Sends structured JSON logs and Prometheus metrics"
    technology: "OpenTelemetry (with PII sanitization)"
  - source: "Integration Gateway"
    destination: "EU Identity Provider"
    description: "Validates user identities and tokens"
    technology: "OIDC/OAuth2 over HTTPS"
  - source: "Librarian Workbench"
    destination: "EU Payment Gateway"
    description: "Processes library fees and payments"
    technology: "REST API over HTTPS with mTLS"
  - source: "Asynchronous Processing Worker"
    destination: "EU Notification Service"
    description: "Triggers automated patron notifications"
    technology: "Asynchronous REST API over HTTPS with mTLS"
  - source: "Catalog API & Search Service"
    destination: "EU Cloud Region Provider"
    description: "Deploys data storage with AES-256 encryption-at-rest"
    technology: "Cloud Infrastructure Storage"