level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Message Broker Container"
    technology: "RabbitMQ 3-node quorum queue cluster, Kubernetes StatefulSets"
    description: "Provides asynchronous message processing via a secure, EU-resident message broker to ensure scalable, non-blocking user journeys."
  - type: "component"
    name: "Exchange Router"
    technology: "AMQP"
    description: "Routes incoming messages using AMQP."
  - type: "component"
    name: "Queue Manager"
    technology: "RabbitMQ, Durable Queues, DLQ, AES-256 Storage Classes"
    description: "Manages durable queues, Dead Letter Queues (DLQ), and persistent storage."
  - type: "component"
    name: "Telemetry Exporter"
    technology: "OpenTelemetry over HTTPS"
    description: "Strips PII and pushes metrics/logs via OpenTelemetry."
  - type: "component"
    name: "Management API / Exporter"
    technology: "HTTPS, OAuth2/JWT RBAC"
    description: "Exposes queue metadata to the Librarian Workbench."
  - type: "component"
    name: "Catalog API & Search Service"
    technology: "External System"
    description: "Publishes asynchronous events to the Message Broker."
  - type: "component"
    name: "Asynchronous Processing Worker"
    technology: "External System"
    description: "Consumes and processes tasks dispatched from the message queue."
  - type: "component"
    name: "Librarian Workbench"
    technology: "External System"
    description: "Inspects queue status and triggers DLQ replays."
  - type: "component"
    name: "Central Logging & Monitoring SIEM"
    technology: "External System"
    description: "Receives metrics and structured logs with PII sanitization."
relationships:
  - source: "Catalog API & Search Service"
    destination: "Exchange Router"
    description: "Publishes asynchronous events [AMQP/TLS with mTLS and SCRAM-SHA-512]."
  - source: "Exchange Router"
    destination: "Queue Manager"
    description: "Routes messages to durable queues [AMQP over TLS]."
  - source: "Queue Manager"
    destination: "Asynchronous Processing Worker"
    description: "Dispatches tasks [AMQP/TLS]."
  - source: "Librarian Workbench"
    destination: "Management API / Exporter"
    description: "Inspects queue status and triggers DLQ replays [HTTPS/mTLS with OAuth2/JWT RBAC]."
  - source: "Telemetry Exporter"
    destination: "Central Logging & Monitoring SIEM"
    description: "Pushes metrics and structured logs [OpenTelemetry over HTTPS with PII sanitization]."