level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Primary Database Instance"
    technology: "PostgreSQL, GIN indexes, pgAudit, pg_stat_statements"
    description: "Handles relational data, full-text search, compliance logging, and performance monitoring."
  - type: "component"
    name: "Read Replica"
    technology: "Asynchronous PostgreSQL replica"
    description: "Executes institutional reporting queries and receives streamed WAL data for asynchronous replication."
  - type: "component"
    name: "Core Domain Schema"
    technology: "PostgreSQL Schema"
    description: "Stores core relational data and GIN indices for catalogue circulation and searches."
  - type: "component"
    name: "Audit Log Schema"
    technology: "PostgreSQL Schema"
    description: "Stores immutable override transactions for compliance."
  - type: "component"
    name: "Archival Schema"
    technology: "PostgreSQL Schema"
    description: "Handles long-term data archival."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer Connection Pooler"
    description: "Manages connection pooling to prevent resource exhaustion."
  - type: "component"
    name: "Cloud Native PG operator"
    technology: "Cloud Native PG"
    description: "Manages automated multi-AZ high availability and failover."
relationships:
  - source: "Catalog API & Search Service"
    destination: "Core Domain Schema"
    description: "Queries/updates relational data and GIN indices [TCP/SSL via Npgsql]"
  - source: "Librarian Workbench"
    destination: "Audit Log Schema"
    description: "Writes immutable override transactions [TCP/SSL]"
  - source: "Librarian Workbench"
    destination: "Read Replica"
    description: "Executes institutional reporting queries [TCP/SSL]"
  - source: "Primary Database Instance"
    destination: "Read Replica"
    description: "Streams WAL data for asynchronous replication [TCP/SSL via mTLS]"