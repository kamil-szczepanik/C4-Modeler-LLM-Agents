level: component
scope: "Component diagram for the Patron Self-Service Portal container"
parentContainer:
  name: "Patron Self-Service Portal"
elements:
  - type: "component"
    name: "Catalogue Search Component"
    technology: "React / TypeScript SPA"
    description: "Provides a highly responsive search experience meeting the <800ms performance requirement for cataloguing items."
  - type: "component"
    name: "Account & Loan Management Component"
    technology: "React / TypeScript SPA"
    description: "Enables EU library patrons to manage active loans and view account details."
  - type: "component"
    name: "Fine Payment Component"
    technology: "React / TypeScript SPA & Client-side SDK"
    description: "Handles fine settlement via direct client-side SDK tokenization to isolate PCI-DSS scope."
  - type: "component"
    name: "Session State Coordinator"
    technology: "OIDC/OAuth2 Client"
    description: "Coordinates session state and authentication via OIDC/OAuth2 with HttpOnly, SameSite=Strict cookies."
  - type: "component"
    name: "ErrorBoundary Wrapper"
    technology: "React / TypeScript SPA"
    description: "Catches runtime errors within the portal and ensures robust error handling."
relationships:
  - source: "Fine Payment Component"
    destination: "EU Payment Gateway"
    description: "Direct client-side SDK tokenization for payments"
  - source: "Session State Coordinator"
    destination: "EU Identity Provider"
    description: "Authentication via OIDC/OAuth2 with HttpOnly, SameSite=Strict cookies"
  - source: "Patron Self-Service Portal"
    destination: "Integration Gateway"
    description: "API requests and payment tokens via HTTPS / REST over TLS 1.3"
  - source: "Patron Self-Service Portal"
    destination: "Central Logging & Monitoring SIEM"
    description: "Structured JSON logs and metrics via OpenTelemetry"