level: component
scope: "Component diagram for the Asynchronous Processing Worker container"
parentContainer:
  name: "Asynchronous Processing Worker"
elements:
  - type: "component"
    name: "Message Consumer Component"
    technology: "MassTransit [.NET]"
    description: "Pulls asynchronous jobs from the message broker and handles message consumption, retry policies, and dead-letter queue handling."
  - type: "component"
    name: "Workflow Orchestrator Component"
    technology: "C# domain logic"
    description: "Invokes task handlers and orchestrates backend business logic."
  - type: "component"
    name: "Notification Dispatcher Component"
    technology: "HttpClient with Polly"
    description: "Triggers patron alerts and forwards outbound requests with resilience patterns."
  - type: "component"
    name: "Audit Logging Interceptor Component"
    technology: "Serilog with structured enrichment"
    description: "Dispatches domain events for structured logging and PII-sanitized audit trails."
  - type: "component"
    name: "Message Broker"
    technology: "RabbitMQ / Redis"
    description: "Provides message queueing and brokering services."
  - type: "component"
    name: "Integration Gateway"
    technology: "Kong / Envoy"
    description: "Proxies and secures outbound requests."
  - type: "component"
    name: "EU Notification Service"
    technology: "External Service"
    description: "Receives patron notifications while adhering to EU-only data residency constraints."
  - type: "component"
    name: "Central Logging & Monitoring SIEM"
    technology: "SIEM"
    description: "Collects structured audit payloads and centralized logs."
relationships:
  - source: "Message Consumer Component"
    destination: "Message Broker"
    description: "Pulls asynchronous jobs [AMQP/TCP with payload encryption and SCRAM-SHA-512/mTLS]"
  - source: "Message Consumer Component"
    destination: "Workflow Orchestrator Component"
    description: "Invokes task handlers [In-Memory]"
  - source: "Workflow Orchestrator Component"
    destination: "Notification Dispatcher Component"
    description: "Triggers patron alerts [In-Memory]"
  - source: "Notification Dispatcher Component"
    destination: "Integration Gateway"
    description: "Forwards outbound requests [HTTPS/REST with mTLS and Polly circuit breaker]"
  - source: "Workflow Orchestrator Component"
    destination: "Audit Logging Interceptor Component"
    description: "Dispatches domain events [In-Memory Event Bus]"
  - source: "Audit Logging Interceptor Component"
    destination: "Central Logging & Monitoring SIEM"
    description: "Ships structured audit payloads [OTLP/gRPC over TLS 1.3]"
  - source: "Integration Gateway"
    destination: "EU Notification Service"
    description: "Routes notification payloads to the external service [HTTPS]"