level: component
scope: "Component diagram for the Librarian Workbench container"
parentContainer:
  name: "Librarian Workbench"
elements:
  - type: "component"
    name: "Inventory Management Module"
    technology: ".NET Core / C#"
    description: "Manages library inventory and cataloging functions."
  - type: "component"
    name: "Payment & Fee Module"
    technology: ".NET Core / C#"
    description: "Handles library fees, fines, and payment processing."
  - type: "component"
    name: "Audit & Compliance Module"
    technology: ".NET Core / C#"
    description: "Enforces audit trails and EU-only data residency compliance."
  - type: "component"
    name: "Notification & Messaging Module"
    technology: ".NET Core / C#"
    description: "Manages messaging and notifications for librarians and patrons."
  - type: "component"
    name: "ASP.NET Core Razor Pages / Blazor UI Layer"
    technology: "ASP.NET Core Razor Pages / Blazor"
    description: "Provides the user interface for the Librarian Workbench."
relationships:
  - source: "ASP.NET Core Razor Pages / Blazor UI Layer"
    destination: "Inventory Management Module"
    description: "Invokes inventory operations"
  - source: "ASP.NET Core Razor Pages / Blazor UI Layer"
    destination: "Payment & Fee Module"
    description: "Processes payments and fees"
  - source: "ASP.NET Core Razor Pages / Blazor UI Layer"
    destination: "Audit & Compliance Module"
    description: "Triggers audit checks"
  - source: "ASP.NET Core Razor Pages / Blazor UI Layer"
    destination: "Notification & Messaging Module"
    description: "Sends notifications"