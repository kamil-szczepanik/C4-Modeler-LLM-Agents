level: component
scope: "Component diagram for the Catalog API & Search Service container"
parentContainer:
  name: "Catalog API & Search Service"
elements:
  - type: "component"
    name: "Search Controller"
    technology: ".NET Core"
    description: "Handles cataloging physical and digital items and routes search requests."
  - type: "component"
    name: "Search Engine Client"
    technology: ".NET Core"
    description: "Executes search queries against the OpenSearch engine."
  - type: "component"
    name: "Catalogue Repository"
    technology: ".NET Core"
    description: "Mutates operational catalog data."
  - type: "component"
    name: "Ranking & Personalization Service"
    technology: ".NET Core"
    description: "Provides high-performance search ranking and personalization."
  - type: "component"
    name: "OpenSearch Engine"
    technology: "OpenSearch (EU Cloud Region)"
    description: "Dedicated search engine for faceted search and typo-tolerance."
  - type: "component"
    name: "Redis Cache Layer"
    technology: "Redis"
    description: "In-memory cache for auto-complete and popular queries."
  - type: "component"
    name: "Asynchronous Processing Worker"
    technology: ".NET Core Worker Service"
    description: "Synchronizes data to the search engine using the outbox event pattern."
relationships:
  - source: "Search Controller"
    destination: "Redis Cache Layer"
    description: "Checks cached auto-complete/queries [RESP over TLS]"
  - source: "Search Controller"
    destination: "Search Engine Client"
    description: "Executes search queries [Internal RPC]"
  - source: "Search Engine Client"
    destination: "OpenSearch Engine"
    description: "Queries catalog indexes [HTTPS / TLS 1.3]"
  - source: "Catalogue Repository"
    destination: "PostgreSQL"
    description: "Mutates operational data [Encrypted SQL]"
  - source: "Asynchronous Processing Worker"
    destination: "OpenSearch Engine"
    description: "Synchronizes data [Outbox Event Pattern]"