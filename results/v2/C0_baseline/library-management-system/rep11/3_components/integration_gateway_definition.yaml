level: component
scope: "Component diagram for the Integration Gateway container"
parentContainer:
  name: "Integration Gateway"
elements:
  - type: "component"
    name: "API Router Component"
    technology: "Kong/Envoy Core"
    description: "Routes, secures, and manages all ingress and egress traffic for public and academic library portals."
  - type: "component"
    name: "Authentication & Authorization Plugin Component"
    technology: "Kong/Envoy Plugin"
    description: "Validates OAuth2/OIDC tokens and handles authentication and authorization for incoming requests."
  - type: "component"
    name: "Data Residency Enforcement Plugin"
    technology: "Kong/Envoy Plugin"
    description: "Enforces strict EU data residency constraints on all data traffic."
  - type: "component"
    name: "Transformation & Header Injection Component"
    technology: "Kong/Envoy Plugin"
    description: "Transforms payloads and injects required headers for downstream and upstream communication."
  - type: "component"
    name: "Circuit Breaker & Resilience Component"
    technology: "Kong/Envoy Plugin"
    description: "Protects backend search performance and downstream services from cascading failures."
relationships:
  - source: "API Router Component"
    destination: "Authentication & Authorization Plugin Component"
    description: "Delegates request validation"
  - source: "API Router Component"
    destination: "Data Residency Enforcement Plugin"
    description: "Checks data residency compliance"
  - source: "API Router Component"
    destination: "Transformation & Header Injection Component"
    description: "Transforms and enriches requests"
  - source: "API Router Component"
    destination: "Circuit Breaker & Resilience Component"
    description: "Applies resilience patterns to outbound calls"