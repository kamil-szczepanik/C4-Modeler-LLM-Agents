level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Member (Patron)"
    description: "Patron using self-service portals and library services."
  - type: "person"
    name: "Librarian/Staff"
    description: "Staff managing circulation and library operations."
  - type: "person"
    name: "Library Administrator"
    description: "Administrator managing the system."
  - type: "externalSystem"
    name: "EU Identity Provider"
    description: "External provider handling authentication."
  - type: "externalSystem"
    name: "EU Payment Gateway"
    description: "External gateway handling financial transactions."
  - type: "externalSystem"
    name: "EU-hosted Log & Telemetry Aggregator"
    description: "Aggregator collecting Prometheus metrics and sanitized JSON logs."
  - type: "container"
    name: "API Gateway"
    technology: "NGINX / Envoy"
    description: "Handles edge routing and TLS termination."
  - type: "container"
    name: "Patron Web App"
    technology: "React / TypeScript, NGINX"
    description: "Provides self-service portals for patrons."
  - type: "container"
    name: "Catalog & Search Service"
    technology: "Kotlin / Spring Boot"
    description: "Manages cataloging and high-performance search workloads."
  - type: "container"
    name: "Circulation & Payments Service"
    technology: "Java 17 / Spring Boot"
    description: "Manages circulation and processes payments."
  - type: "container"
    name: "Admin & Reporting Service"
    technology: "Python / FastAPI"
    description: "Manages administrative tasks and reporting workloads."
  - type: "container"
    name: "PostgreSQL"
    technology: "PostgreSQL (EU-hosted)"
    description: "Stores transactional data."
  - type: "container"
    name: "Elasticsearch"
    technology: "Elasticsearch"
    description: "Provides search indexing and capabilities."
relationships:
  - source: "Library Member (Patron)"
    destination: "API Gateway"
    description: "Accesses portals and services"
    technology: "HTTPS (TLS 1.3)"
  - source: "Librarian/Staff"
    destination: "API Gateway"
    description: "Accesses circulation and library operations"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Administrator"
    destination: "API Gateway"
    description: "Accesses administrative functions"
    technology: "HTTPS (TLS 1.3)"
  - source: "Patron Web App"
    destination: "API Gateway"
    description: "Communicates with internal microservices"
    technology: "gRPC over a private network"
  - source: "API Gateway"
    destination: "Catalog & Search Service"
    description: "Routes catalog and search requests"
    technology: "gRPC / mTLS (Istio)"
  - source: "API Gateway"
    destination: "Circulation & Payments Service"
    description: "Routes circulation and payment requests"
    technology: "gRPC / mTLS (Istio)"
  - source: "API Gateway"
    destination: "Admin & Reporting Service"
    description: "Routes admin and reporting requests"
    technology: "gRPC / mTLS (Istio)"
  - source: "Circulation & Payments Service"
    destination: "EU Payment Gateway"
    description: "Connects to process payments"
    technology: "HTTPS/REST"
  - source: "Catalog & Search Service"
    destination: "Elasticsearch"
    description: "Queries search index"
    technology: "Database Protocol"
  - source: "Circulation & Payments Service"
    destination: "PostgreSQL"
    description: "Reads and writes transactional data"
    technology: "Database Protocol"
  - source: "Admin & Reporting Service"
    destination: "PostgreSQL"
    description: "Reads transactional data for reports"
    technology: "Database Protocol"
  - source: "Catalog & Search Service"
    destination: "EU-hosted Log & Telemetry Aggregator"
    description: "Ships Prometheus metrics and sanitized JSON logs"
    technology: "TLS"
  - source: "Circulation & Payments Service"
    destination: "EU-hosted Log & Telemetry Aggregator"
    description: "Ships Prometheus metrics and sanitized JSON logs"
    technology: "TLS"
  - source: "Admin & Reporting Service"
    destination: "EU-hosted Log & Telemetry Aggregator"
    description: "Ships Prometheus metrics and sanitized JSON logs"
    technology: "TLS"