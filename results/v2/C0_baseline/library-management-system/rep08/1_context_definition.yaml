level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Provides cataloging, circulation management, and self-service portals with high performance and strict EU-only data residency compliance."
elements:
  - type: "person"
    name: "Library Member (Patron)"
    description: "Patron using self-service portals and library services."
  - type: "person"
    name: "Librarian / Staff"
    description: "Staff managing circulation and library operations with mandatory MFA."
  - type: "person"
    name: "Library Administrator"
    description: "Administrator managing the system with mandatory MFA."
  - type: "externalSystem"
    name: "EU Identity Provider"
    description: "SaaS provider handling authentication via OAuth2/OIDC."
  - type: "externalSystem"
    name: "EU Payment Gateway"
    description: "External payment gateway handling financial transactions via REST / HTTPS."
  - type: "externalSystem"
    name: "EU-hosted Log & Telemetry Aggregator"
    description: "Aggregator collecting logs and telemetry data via Syslog / TLS."
relationships:
  - source: "Library Member (Patron)"
    destination: "Library Management System"
    description: "Accesses portals and services"
    technology: "HTTPS (TLS 1.3)"
  - source: "Librarian / Staff"
    destination: "Library Management System"
    description: "Manages circulation and library operations"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Administrator"
    destination: "Library Management System"
    description: "Performs system administration"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Management System"
    destination: "EU Identity Provider"
    description: "Authenticates users"
    technology: "OIDC / HTTPS"
  - source: "Library Management System"
    destination: "EU Payment Gateway"
    description: "Processes payments"
    technology: "REST / HTTPS with asynchronous queueing"
  - source: "Library Management System"
    destination: "EU-hosted Log & Telemetry Aggregator"
    description: "Sends logs and telemetry"
    technology: "Syslog / TLS"