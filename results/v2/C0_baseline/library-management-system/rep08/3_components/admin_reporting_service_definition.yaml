level: component
scope: "Component diagram for the Admin & Reporting Service container"
parentContainer:
  name: "Admin & Reporting Service"
elements:
  - type: "component"
    name: "Admin API Controller"
    technology: "Python / FastAPI"
    description: "Routes and handles incoming admin requests, enforcing role-based access control."
  - type: "component"
    name: "Audit Log Processor"
    technology: "Python / Celery"
    description: "Processes and ships compliance logs to the EU-hosted Log & Telemetry Aggregator."
  - type: "component"
    name: "Reporting Engine"
    technology: "Python / ReportLab / Pandas"
    description: "Performs data aggregation and generates CSV/PDF scheduled reports."
  - type: "component"
    name: "Query Caching Layer"
    technology: "Redis"
    description: "Caches analytical KPIs to prevent database starvation."
  - type: "component"
    name: "API Gateway"
    technology: "Gateway"
    description: "External entry point routing requests to the admin controllers."
  - type: "component"
    name: "PostgreSQL"
    technology: "PostgreSQL (EU-hosted)"
    description: "Relational data store with column-level PII encryption."
  - type: "component"
    name: "EU-hosted Object Storage"
    technology: "MinIO / AWS S3 EU-Central"
    description: "Stores generated analytical reports and exports."
  - type: "component"
    name: "Celery Broker"
    technology: "Redis / AMQP"
    description: "Message broker for dispatching asynchronous report tasks."
  - type: "component"
    name: "EU-hosted Log & Telemetry Aggregator"
    technology: "Telemetry Aggregator"
    description: "Receives shipped audit and telemetry logs."
relationships:
  - source: "API Gateway"
    destination: "Admin API Controller"
    description: "Routes admin requests [gRPC / mTLS]"
  - source: "Admin API Controller"
    destination: "Query Caching Layer"
    description: "Reads cached KPIs [Redis Protocol / TLS]"
  - source: "Admin API Controller"
    destination: "Celery Broker"
    description: "Dispatches report tasks [AMQP / TLS]"
  - source: "Reporting Engine"
    destination: "PostgreSQL"
    description: "Executes analytical queries [Database Protocol]"
  - source: "Reporting Engine"
    destination: "EU-hosted Object Storage"
    description: "Stores exports [TLS]"
  - source: "Audit Log Processor"
    destination: "EU-hosted Log & Telemetry Aggregator"
    description: "Ships logs [TLS]"