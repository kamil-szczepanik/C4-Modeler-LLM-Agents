level: component
scope: "Component diagram for the Patron Web App container"
parentContainer:
  name: "Patron Web App"
elements:
  - type: "component"
    name: "Search & Discovery UI"
    technology: "React"
    description: "Enables library members to execute searches and discover items."
  - type: "component"
    name: "Account & Circulation Manager"
    technology: "React"
    description: "Allows users to manage circulation and account details, processing fines and payments."
  - type: "component"
    name: "Localization & Accessibility Engine"
    technology: "React"
    description: "Ensures compliance with public library accessibility and localization mandates."
  - type: "component"
    name: "BFF Security & Session Manager"
    technology: "Node.js"
    description: "Manages secure server-side session state and HttpOnly cookies to mitigate XSS risks."
  - type: "component"
    name: "API Gateway"
    technology: "NGINX / Envoy"
    description: "Routes requests between the BFF and backend services securely."
  - type: "component"
    name: "EU Identity Provider"
    technology: "External"
    description: "Authenticates users via OIDC/OAuth 2.0 authorization code flow with PKCE."
  - type: "component"
    name: "EU Payment Gateway"
    technology: "External"
    description: "Processes fines and payments securely."
relationships:
  - source: "Patron Web App"
    destination: "API Gateway"
    description: "Communicates via gRPC over a private network"
  - source: "Patron Web App"
    destination: "EU Identity Provider"
    description: "Authenticates users via OIDC/OAuth 2.0 authorization code flow with PKCE"
  - source: "Account & Circulation Manager"
    destination: "EU Payment Gateway"
    description: "Processes fines and payments securely via the API Gateway"