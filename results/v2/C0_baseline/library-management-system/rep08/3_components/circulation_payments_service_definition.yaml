level: component
scope: "Component diagram for the Circulation & Payments Service container"
parentContainer:
  name: "Circulation & Payments Service"
elements:
  - type: "component"
    name: "Circulation REST Controller Component"
    technology: "Java 17 / Spring Boot"
    description: "Handles incoming HTTP/REST requests related to circulation and payments."
  - type: "component"
    name: "Circulation Engine Component"
    technology: "Java 17 / Spring Boot"
    description: "Manages library item borrowing, returns, holds, and business logic."
  - type: "component"
    name: "Payment Processing Component"
    technology: "Java 17 / Spring Boot / Resilience4j"
    description: "Processes fine payments and interacts with external payment gateways."
  - type: "component"
    name: "Transactional Outbox Publisher Component"
    technology: "Java 17 / Spring Boot / Spring Data JPA"
    description: "Publishes domain events to Kafka using the Transactional Outbox Pattern."
relationships:
  - source: "Circulation REST Controller Component"
    destination: "Circulation Engine Component"
    description: "Invokes methods via In-process / Java Method Calls"
  - source: "Circulation REST Controller Component"
    destination: "Payment Processing Component"
    description: "Invokes methods via In-process / Java Method Calls"
  - source: "Payment Processing Component"
    destination: "EU Payment Gateway"
    description: "Processes transactions via HTTPS/REST"
  - source: "Circulation Engine Component"
    destination: "PostgreSQL"
    description: "Persists transactional state via JDBC"
  - source: "Payment Processing Component"
    destination: "PostgreSQL"
    description: "Persists transactional state via JDBC"
  - source: "Transactional Outbox Publisher Component"
    destination: "Apache Kafka"
    description: "Publishes domain events via Kafka Protocol / TLS"
  - source: "Circulation & Payments Service"
    destination: "EU-hosted Log & Telemetry Aggregator"
    description: "Ships Prometheus metrics and sanitized JSON logs via TLS"