level: component
scope: "Component diagram for the Elasticsearch container"
parentContainer:
  name: "Elasticsearch"
elements:
  - type: "component"
    name: "REST API / Transport Layer"
    technology: "HTTP/2 over TLS, Port 9200"
    description: "Handles incoming REST requests and JSON payloads from the Catalog & Search Service."
  - type: "component"
    name: "Query DSL & Search Engine"
    technology: "Elasticsearch Query DSL"
    description: "Processes search queries, executes optimized querying, and handles replica routing to meet strict latency requirements."
  - type: "component"
    name: "Index & Storage Engine"
    technology: "Lucene"
    description: "Underlying storage and indexing engine providing high-performance search capabilities."
  - type: "component"
    name: "Index Lifecycle Management (ILM) Engine"
    technology: "Elasticsearch ILM"
    description: "Manages index tiering and lifecycle policies to support performance and data retention."
  - type: "component"
    name: "Cluster Coordination & Node Management"
    technology: "Elasticsearch 8.x Cluster"
    description: "Manages multi-zone deployment across 3 availability zones in an EU cloud region."
relationships:
  - source: "REST API / Transport Layer"
    destination: "Query DSL & Search Engine"
    description: "Forwards requests for query parsing and execution"
  - source: "Query DSL & Search Engine"
    destination: "Index & Storage Engine"
    description: "Retrieves and indexes search data"
  - source: "Index Lifecycle Management (ILM) Engine"
    destination: "Index & Storage Engine"
    description: "Applies lifecycle and tiering policies to indices"
  - source: "Cluster Coordination & Node Management"
    destination: "REST API / Transport Layer"
    description: "Manages node health and routing across the cluster"