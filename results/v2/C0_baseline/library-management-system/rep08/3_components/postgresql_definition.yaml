level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "Primary Database"
    technology: "PostgreSQL 15+"
    description: "Primary transactional datastore for ACID compliance and structured catalog/user data."
  - type: "component"
    name: "Read Replica"
    technology: "PostgreSQL 15+ Read Replica"
    description: "Handles heavy reporting queries isolated from write-heavy transactional workloads."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Connection pooling to prevent worker exhaustion."
  - type: "component"
    name: "pgaudit Extension"
    technology: "pgaudit"
    description: "In-process auditing extension for GDPR compliance."
  - type: "component"
    name: "CloudNativePG Operator"
    technology: "CloudNativePG Kubernetes Operator"
    description: "Provides high availability, automated failover (<30s RTO), and multi-AZ EU deployment."
relationships:
  - source: "PgBouncer"
    destination: "Primary Database"
    description: "Routes transactional queries via mTLS and native Postgres wire protocol"
  - source: "PgBouncer"
    destination: "Read Replica"
    description: "Routes read-only reporting queries via mTLS"
  - source: "CloudNativePG Operator"
    destination: "Primary Database"
    description: "Manages lifecycle, automated failover, and high availability"
  - source: "pgaudit Extension"
    destination: "Primary Database"
    description: "Audits database activities for GDPR compliance"
  - source: "Primary Database"
    destination: "Read Replica"
    description: "Replicates transactional data"