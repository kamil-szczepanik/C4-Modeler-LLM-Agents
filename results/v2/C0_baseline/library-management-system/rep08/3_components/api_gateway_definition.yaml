level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge TLS Terminator & Router Component"
    technology: "Envoy Proxy"
    description: "Serves as the secure, high-performance edge entry point handling TLS 1.3 termination and routing."
  - type: "component"
    name: "JWT Authentication & RBAC Filter Component"
    technology: "Envoy native envoy.filters.http.jwt_authn"
    description: "Validates JSON Web Tokens from the EU Identity Provider and enforces Role-Based Access Control."
  - type: "component"
    name: "Request Validation & Versioning Filter Component"
    technology: "Envoy Filter"
    description: "Validates incoming request structures and handles API versioning."
  - type: "component"
    name: "Rate Limiting Filter Component"
    technology: "Envoy Filter & Redis Cluster"
    description: "Evaluates traffic quotas using a token bucket algorithm backed by an EU-hosted Redis Cluster to protect SLAs."
relationships:
  - source: "Edge TLS Terminator & Router Component"
    destination: "JWT Authentication & RBAC Filter Component"
    description: "Forwards requests"
  - source: "JWT Authentication & RBAC Filter Component"
    destination: "Request Validation & Versioning Filter Component"
    description: "Passes validated claims"
  - source: "Request Validation & Versioning Filter Component"
    destination: "Rate Limiting Filter Component"
    description: "Evaluates quotas"