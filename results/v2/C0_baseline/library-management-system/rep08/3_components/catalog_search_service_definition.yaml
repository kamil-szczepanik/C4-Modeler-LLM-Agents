level: component
scope: "Component diagram for the Catalog & Search Service container"
parentContainer:
  name: "Catalog & Search Service"
elements:
  - type: "component"
    name: "Search Controller"
    technology: "Kotlin / Spring Boot (@RestController)"
    description: "Handles incoming search and catalog requests via gRPC / mTLS."
  - type: "component"
    name: "Catalog Management Controller"
    technology: "Kotlin / Spring Boot (@RestController)"
    description: "Handles item record mutations via JDBC."
  - type: "component"
    name: "Search Service"
    technology: "Kotlin / Spring Boot (@Service)"
    description: "Executes in-process validation, query handling, typo tolerance, and scoring."
  - type: "component"
    name: "Catalog Data Synchronizer"
    technology: "Kotlin / Spring Boot (@Component)"
    description: "Asynchronously indexes data via CDC."
  - type: "component"
    name: "Elasticsearch Client"
    technology: "Kotlin / Spring Boot (RestHighLevelClient / ElasticsearchRestTemplate)"
    description: "Executes in-process query building and aggregation against Elasticsearch."
relationships:
  - source: "Search Controller"
    destination: "Search Service"
    description: "In-process validation and query handling"
  - source: "Search Service"
    destination: "Elasticsearch Client"
    description: "In-process query building and aggregation"
  - source: "Catalog Management Controller"
    destination: "PostgreSQL"
    description: "Mutates item records via JDBC"
  - source: "Catalog Data Synchronizer"
    destination: "Elasticsearch Client"
    description: "Asynchronously indexes data via CDC"
  - source: "Catalog & Search Service"
    destination: "EU-hosted Log & Telemetry Aggregator"
    description: "Ships Prometheus metrics and sanitized JSON logs via TLS"