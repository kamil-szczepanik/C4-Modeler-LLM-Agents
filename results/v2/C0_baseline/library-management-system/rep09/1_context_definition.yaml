level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A comprehensive platform designed for public and academic libraries to catalogue physical and digital items, manage circulation, and provide self-service portals."
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Patrons who use the self-service portals to access digital and physical library items."
  - type: "person"
    name: "Librarians/Circulation Staff"
    description: "Staff members who manage daily circulation workflows and patron assistance."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators responsible for overseeing the library management system configuration and reports."
  - type: "externalSystem"
    name: "EU Identity Provider (IdP)"
    description: "Handles user authentication and Multi-Factor Authentication (MFA)."
  - type: "externalSystem"
    name: "EU Payment Gateway"
    description: "Processes financial transactions and payments securely (e.g., Adyen EU or Stripe EU)."
  - type: "externalSystem"
    name: "EU Notification Service"
    description: "Handles notifications and communications via HTTPS/SMTP."
  - type: "externalSystem"
    name: "EU Cloud Infrastructure"
    description: "AWS Frankfurt/Ireland or OVHcloud providing hardware-level data residency."
  - type: "externalSystem"
    name: "Centralized Log & Metrics Aggregator"
    description: "Datadog EU or Grafana Cloud EU for observability and distributed tracing."
  - type: "externalSystem"
    name: "API Gateway"
    description: "Manages perimeter access, routing, and rate-limiting."
relationships:
  - source: "Library Patrons"
    destination: "Library Management System"
    description: "Interacts via self-service portal"
    technology: "HTTPS/TLS 1.3"
  - source: "Librarians/Circulation Staff"
    destination: "Library Management System"
    description: "Manages circulation workflows"
    technology: "HTTPS/TLS 1.3"
  - source: "Library Administrators"
    destination: "Library Management System"
    description: "Administers system configurations"
    technology: "HTTPS/TLS 1.3"
  - source: "Library Management System"
    destination: "EU Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OIDC/OAuth2 over HTTPS"
  - source: "Library Management System"
    destination: "EU Payment Gateway"
    description: "Processes payments"
    technology: "REST/HTTPS"
  - source: "Library Management System"
    destination: "EU Notification Service"
    description: "Sends notifications"
    technology: "HTTPS/SMTP"