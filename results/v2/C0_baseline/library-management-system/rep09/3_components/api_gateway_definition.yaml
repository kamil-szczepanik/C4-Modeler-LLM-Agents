level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing & Dispatcher Component"
    technology: "Nginx core, Lua scripts, gRPC/HTTPS"
    description: "Handles TLS termination, internal mTLS, and gRPC/HTTPS dispatch."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Kong Plugin, OIDC"
    description: "Validates OIDC tokens from the EU Identity Provider."
  - type: "component"
    name: "Claims Transformation Component"
    technology: "Lua scripts"
    description: "Strips bearer tokens and injects signed internal headers."
  - type: "component"
    name: "Rate Limiting & Caching Component"
    technology: "Redis, Kong Plugin"
    description: "Redis-backed engine enforcing tiered limits and search caching."
  - type: "component"
    name: "WAF & Threat Protection Plugin"
    technology: "Kong Plugin"
    description: "Mitigates OWASP Top 10 injection risks."
  - type: "component"
    name: "Fluentbit Sidecar"
    technology: "Fluentbit"
    description: "Streams logs asynchronously to the Centralized Log & Metrics Aggregator."
relationships:
  - source: "External Clients"
    destination: "Routing & Dispatcher Component"
    description: "Sends encrypted traffic via TLS 1.3"
  - source: "Rate Limiting & Caching Component"
    destination: "Redis"
    description: "Stores and retrieves search results for low-latency access"
  - source: "Routing & Dispatcher Component"
    destination: "Core Services Container"
    description: "Forwards requests with cryptographically signed claims [mTLS via gRPC/HTTPS]"
  - source: "Fluentbit Sidecar"
    destination: "Centralized Log & Metrics Aggregator"
    description: "Streams access, security audit, and W3C trace-context logs [TLS via Fluentbit]"