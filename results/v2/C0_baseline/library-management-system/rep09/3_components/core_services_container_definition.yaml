level: component
scope: "Component diagram for the Core Services Container container"
parentContainer:
  name: "Core Services Container"
elements:
  - type: "component"
    name: "API Controller"
    technology: "Spring MVC / REST"
    description: "Exposes RESTful endpoints for library patrons, circulation staff, and administrators."
  - type: "component"
    name: "Authentication & Security Module"
    technology: "Spring Security & OAuth2"
    description: "Validates JWTs, handles OIDC/OAuth2 integration with the EU Identity Provider, and enforces RBAC."
  - type: "component"
    name: "Catalog & Circulation Service"
    technology: "Java / Spring Boot"
    description: "Manages business logic for item cataloging, patron accounts, and loan circulation."
  - type: "component"
    name: "Payment Integration Client"
    technology: "Spring Cloud OpenFeign & Resilience4j"
    description: "Processes financial transactions via the EU Payment Gateway with circuit breaker protection."
  - type: "component"
    name: "Data Access Repository"
    technology: "Spring Data JPA / Hibernate"
    description: "Handles relational data persistence and queries against the Database Container using parameterized queries."
  - type: "component"
    name: "Search Indexer Client"
    technology: "HTTP/REST Client"
    description: "Executes catalog search queries against the Search Container to meet sub-800ms performance requirements."
  - type: "component"
    name: "Event Publisher"
    technology: "Message Broker / Queue Client"
    description: "Publishes asynchronous events to the Async Worker Container."
relationships:
  - source: "API Controller"
    destination: "Authentication & Security Module"
    description: "Delegates request authentication and token validation"
  - source: "API Controller"
    destination: "Catalog & Circulation Service"
    description: "Invokes business logic for operations"
  - source: "Catalog & Circulation Service"
    destination: "Data Access Repository"
    description: "Queries relational data [JDBC]"
  - source: "Catalog & Circulation Service"
    destination: "Search Indexer Client"
    description: "Queries catalog search index [HTTP/REST]"
  - source: "Catalog & Circulation Service"
    destination: "Event Publisher"
    description: "Publishes asynchronous events"
  - source: "Catalog & Circulation Service"
    destination: "Payment Integration Client"
    description: "Processes financial transactions [REST/HTTPS]"
  - source: "Authentication & Security Module"
    destination: "EU Identity Provider"
    description: "Authenticates users and validates tokens [OIDC/OAuth2 over HTTPS]"
  - source: "Payment Integration Client"
    destination: "EU Payment Gateway"
    description: "Sends payment requests [REST/HTTPS]"