level: component
scope: "Component diagram for the Search Container container"
parentContainer:
  name: "Search Container"
elements:
  - type: "component"
    name: "Search API Controller"
    technology: "Java / Spring Boot"
    description: "Handles incoming synchronous search queries and routes them to the index engine."
  - type: "component"
    name: "Index & Query Engine (Elasticsearch Core)"
    technology: "Elasticsearch 8.x, Lucene indices"
    description: "Multi-node cluster for distributed inverted-index lookups, faceted search, and zero-downtime aliasing."
  - type: "component"
    name: "Catalog Indexer Component"
    technology: "Java / Spring Boot"
    description: "Manages indexes and handles bulk updates for catalogue discovery."
  - type: "component"
    name: "Search Analytics Publisher"
    technology: "Java / Spring Boot"
    description: "Streams anonymized telemetry to centralized logging and metrics aggregators."
relationships:
  - source: "Core Services Container"
    destination: "Search API Controller"
    description: "Synchronous queries [HTTP/REST, mTLS]"
  - source: "Search API Controller"
    destination: "Index & Query Engine (Elasticsearch Core)"
    description: "Executes queries [Internal HTTP]"
  - source: "Catalog Indexer Component"
    destination: "Index & Query Engine (Elasticsearch Core)"
    description: "Manages indexes and bulk updates [Internal HTTP]"
  - source: "Search Analytics Publisher"
    destination: "Centralized Log & Metrics Aggregator"
    description: "Streams anonymized telemetry [HTTPS]"