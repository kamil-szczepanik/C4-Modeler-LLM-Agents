level: component
scope: "Component diagram for the Async Worker Container container"
parentContainer:
  name: "Async Worker Container"
elements:
  - type: "component"
    name: "Task Dispatcher / Consumer"
    technology: "Python, Celery with Redis/RabbitMQ client"
    description: "Consumes background tasks and routes them internally."
  - type: "component"
    name: "Notification Handler Component"
    technology: "Python"
    description: "Dispatches alerts and reminders to external notification services."
  - type: "component"
    name: "Circulation Processor Component"
    technology: "Python"
    description: "Manages background loan and inventory states via database connection pooling."
  - type: "component"
    name: "DLQ Publisher Component"
    technology: "Python, Celery retry hooks"
    description: "Emits failure events for librarian review via the message broker."
  - type: "component"
    name: "Message Broker"
    technology: "RabbitMQ / Redis"
    description: "Handles reliable event publishing and consumer queue management."
  - type: "component"
    name: "Centralized Log & Metrics Aggregator"
    technology: "Prometheus, OpenTelemetry"
    description: "Provides distributed tracing, task execution latency tracking, and metric aggregation."
relationships:
  - source: "Task Dispatcher / Consumer"
    destination: "Notification Handler Component"
    description: "Routes tasks internally [In-memory]"
  - source: "Task Dispatcher / Consumer"
    destination: "Circulation Processor Component"
    description: "Routes tasks internally [In-memory]"
  - source: "Notification Handler Component"
    destination: "EU Notification Service"
    description: "Dispatches alerts and reminders [HTTPS]"
  - source: "Circulation Processor Component"
    destination: "Database Container"
    description: "Manages background loan and inventory states [TCP/Postgres, PgBouncer]"
  - source: "DLQ Publisher Component"
    destination: "Core Services Container"
    description: "Emits failure events for librarian review [AMQP]"