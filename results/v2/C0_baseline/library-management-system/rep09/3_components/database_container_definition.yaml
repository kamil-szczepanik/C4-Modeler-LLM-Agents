level: component
scope: "Component diagram for the Database Container container"
parentContainer:
  name: "Database Container"
elements:
  - type: "component"
    name: "Relational Storage Engine"
    technology: "PostgreSQL Primary"
    description: "Provides robust ACID guarantees for circulation management and relational data persistence."
  - type: "component"
    name: "Read-Replica Instance"
    technology: "PostgreSQL Read-Only Engine"
    description: "Routes analytical and reporting queries."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Manages client connections in transaction pooling mode to handle peak traffic."
  - type: "component"
    name: "Audit Logging Extension"
    technology: "pg_audit"
    description: "Captures DDL and DML operations synchronously for GDPR compliance and audit reporting."
  - type: "component"
    name: "Replication Manager"
    technology: "Patroni / PostgreSQL Streaming Replication"
    description: "Manages high availability, automated failover, and streaming replication across EU availability zones."
relationships:
  - source: "Relational Storage Engine"
    destination: "Read-Replica Instance"
    description: "Streaming replication over TCP within EU availability zones"
  - source: "Relational Storage Engine"
    destination: "Audit Logging Extension"
    description: "Internal hooks capturing DDL and DML operations"