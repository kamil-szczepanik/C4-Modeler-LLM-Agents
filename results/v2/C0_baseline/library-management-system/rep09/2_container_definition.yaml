level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Patrons who use the self-service portals to access digital and physical library items."
  - type: "person"
    name: "Librarians/Circulation Staff"
    description: "Staff members who manage daily circulation workflows and patron assistance."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators responsible for overseeing the library management system configuration and reports."
  - type: "externalSystem"
    name: "EU Identity Provider (IdP)"
    description: "Handles user authentication and Multi-Factor Authentication (MFA)."
  - type: "externalSystem"
    name: "EU Payment Gateway"
    description: "Processes financial transactions and payments securely."
  - type: "externalSystem"
    name: "EU Notification Service"
    description: "Handles notifications and communications via HTTPS/SMTP."
  - type: "externalSystem"
    name: "EU Cloud Infrastructure"
    description: "Provides hardware-level data residency and Kubernetes deployment environment."
  - type: "externalSystem"
    name: "Centralized Log & Metrics Aggregator"
    description: "For observability and distributed tracing."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx / Kong"
    description: "Manages perimeter access, routing, and mTLS enforcement."
  - type: "container"
    name: "Web App / Admin Portal"
    technology: "React, Node.js SSR"
    description: "Provides responsive web applications and admin portals."
  - type: "container"
    name: "Core Services Container"
    technology: "Java / Spring Boot"
    description: "Handles core business logic and service orchestration."
  - type: "container"
    name: "Search Container"
    technology: "Elasticsearch"
    description: "Provides sub-second catalog discovery and search capabilities."
  - type: "container"
    name: "Database Container"
    technology: "PostgreSQL"
    description: "Stores relational data persistence strictly within EU regions."
  - type: "container"
    name: "Async Worker Container"
    technology: "Python / Celery or Java"
    description: "Handles asynchronous task processing and event consumption."
relationships:
  - source: "Library Patrons"
    destination: "Web App / Admin Portal"
    description: "Accesses self-service portals via HTTPS"
    technology: "HTTPS/TLS 1.3"
  - source: "Librarians/Circulation Staff"
    destination: "Web App / Admin Portal"
    description: "Manages circulation workflows via HTTPS"
    technology: "HTTPS/TLS 1.3"
  - source: "Library Administrators"
    destination: "Web App / Admin Portal"
    description: "Administers system configurations via HTTPS"
    technology: "HTTPS/TLS 1.3"
  - source: "API Gateway"
    destination: "Web App / Admin Portal"
    description: "Routes traffic to Web App"
    technology: "mTLS via gRPC/HTTPS"
  - source: "API Gateway"
    destination: "Core Services Container"
    description: "Routes traffic to Core Services"
    technology: "mTLS via gRPC/HTTPS"
  - source: "Core Services Container"
    destination: "Database Container"
    description: "Queries relational data synchronously"
    technology: "Database Protocol"
  - source: "Core Services Container"
    destination: "Search Container"
    description: "Queries catalog search index synchronously"
    technology: "HTTP/REST"
  - source: "Core Services Container"
    destination: "Async Worker Container"
    description: "Publishes checkout and notification events asynchronously"
    technology: "Message Broker / Queue"
  - source: "Core Services Container"
    destination: "EU Identity Provider (IdP)"
    description: "Authenticates users and validates tokens"
    technology: "OIDC/OAuth2 over HTTPS"
  - source: "Core Services Container"
    destination: "EU Payment Gateway"
    description: "Processes financial transactions"
    technology: "REST/HTTPS"
  - source: "Async Worker Container"
    destination: "EU Notification Service"
    description: "Sends asynchronous notifications"
    technology: "HTTPS/SMTP"
  - source: "Core Services Container"
    destination: "Centralized Log & Metrics Aggregator"
    description: "Sends logs and metrics for observability"
    technology: "HTTPS"