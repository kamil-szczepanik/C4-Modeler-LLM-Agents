level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Patrons who use the self-service portal for cataloguing, circulation, and account management."
  - type: "person"
    name: "Library Staff"
    description: "Staff members who use the dashboard for administrative and circulation tasks."
  - type: "externalSystem"
    name: "Third-Party Identity Provider"
    description: "External authentication provider handling OAuth2/OIDC and JWTs."
  - type: "externalSystem"
    name: "Digital Content Providers"
    description: "External systems providing access to digital media and resources."
  - type: "externalSystem"
    name: "Interlibrary Loan Network"
    description: "External network for borrowing items across different library systems."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service for processing user payments and fines."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External service for delivering alerts and messages to patrons."
  - type: "externalSystem"
    name: "Centralized Observability & SIEM Platform"
    description: "Platform for centralized logging, monitoring, and security information management."
  - type: "externalSystem"
    name: "Backup & Disaster Recovery Storage"
    description: "EU-resident object storage used for backups and disaster recovery."
  - type: "container"
    name: "Patron Portal"
    technology: "React / TypeScript SPA"
    description: "Web application providing self-service capabilities for library patrons."
  - type: "container"
    name: "Staff Dashboard"
    technology: "React / TypeScript SPA"
    description: "Web application enabling library staff to manage circulation, cataloguing, and system administration."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx / Envoy"
    description: "Entry point managing and routing incoming traffic from frontends."
  - type: "container"
    name: "Core Business Service"
    technology: "Java / Spring Boot"
    description: "Handles primary business logic, cataloguing, and circulation workflows."
  - type: "container"
    name: "Search Service"
    technology: "Elasticsearch / OpenSearch"
    description: "Provides sub-800ms search responses for library catalogues."
  - type: "container"
    name: "Integration Service"
    technology: "Node.js / TypeScript"
    description: "Manages integrations with external systems like payment gateways and content providers."
  - type: "container"
    name: "Notification & Audit Service"
    technology: "Python / FastAPI"
    description: "Processes domain events for auditing, logging, and dispatching notifications."
  - type: "container"
    name: "Relational DB"
    technology: "PostgreSQL"
    description: "Primary transactional data store hosted exclusively in EU regions."
  - type: "container"
    name: "Message Broker"
    technology: "Kafka / RabbitMQ"
    description: "Handles asynchronous messaging and event streaming between services."
  - type: "container"
    name: "Secrets Manager"
    technology: "HashiCorp Vault"
    description: "Secures and manages sensitive credentials and configuration data."
relationships:
  - source: "Library Patrons"
    destination: "Patron Portal"
    description: "Interacts with via web browser"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Staff"
    destination: "Staff Dashboard"
    description: "Interacts with via web browser"
    technology: "HTTPS (TLS 1.3)"
  - source: "Patron Portal"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS (TLS 1.3)"
  - source: "Staff Dashboard"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS (TLS 1.3)"
  - source: "API Gateway"
    destination: "Core Business Service"
    description: "Routes traffic via service mesh"
    technology: "gRPC/REST over mTLS (Istio)"
  - source: "Core Business Service"
    destination: "Relational DB"
    description: "Reads and writes transactional data"
    technology: "SQL / JDBC"
  - source: "Core Business Service"
    destination: "Search Service"
    description: "Syncs data asynchronously"
    technology: "AMQP/Kafka"
  - source: "Core Business Service"
    destination: "Message Broker"
    description: "Publishes domain events"
    technology: "Kafka / AMQP"
  - source: "Integration Service"
    destination: "Message Broker"
    description: "Consumes domain events"
    technology: "Kafka / RabbitMQ"
  - source: "Notification & Audit Service"
    destination: "Message Broker"
    description: "Consumes domain events"
    technology: "Kafka / RabbitMQ"
  - source: "Integration Service"
    destination: "Payment Gateway"
    description: "Processes transactions"
    technology: "TLS 1.3"
  - source: "Integration Service"
    destination: "Digital Content Providers"
    description: "Retrieves digital content metadata"
    technology: "TLS 1.3"
  - source: "API Gateway"
    destination: "Third-Party Identity Provider"
    description: "Validates authentication and tokens"
    technology: "OAuth2/OIDC with JWTs"
  - source: "Core Business Service"
    destination: "Secrets Manager"
    description: "Retrieves secrets and keys"
    technology: "HashiCorp Vault API"
  - source: "Integration Service"
    destination: "Secrets Manager"
    description: "Retrieves secrets and keys"
    technology: "HashiCorp Vault API"