level: component
scope: "Component diagram for the Core Business Service container"
parentContainer:
  name: "Core Business Service"
elements:
  - type: "component"
    name: "API Controller Layer"
    technology: "Java / Spring Boot"
    description: "Handles incoming HTTP/gRPC requests routed from the API Gateway."
  - type: "component"
    name: "Cataloguing & Inventory Component"
    technology: "Java / Spring Boot, Spring Data JPA"
    description: "Manages library items, cataloguing data, and real-time inventory validation."
  - type: "component"
    name: "Circulation & Loan Engine Component"
    technology: "Java / Spring Boot"
    description: "Manages patron checkouts, returns, renewals, and loan policies."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Kafka / AMQP"
    description: "Publishes domain events asynchronously to the message broker."
  - type: "component"
    name: "Vault Integration Component"
    technology: "HashiCorp Vault API"
    description: "Retrieves dynamic secrets and credentials securely."
relationships:
  - source: "API Controller Layer"
    destination: "Cataloguing & Inventory Component"
    description: "Invokes catalog operations"
  - source: "API Controller Layer"
    destination: "Circulation & Loan Engine Component"
    description: "Invokes loan and circulation logic"
  - source: "Cataloguing & Inventory Component"
    destination: "Event Publisher Component"
    description: "Triggers inventory synchronization events"
  - source: "Circulation & Loan Engine Component"
    destination: "Event Publisher Component"
    description: "Publishes circulation events"
  - source: "Vault Integration Component"
    destination: "Secrets Manager"
    description: "Retrieves dynamic secrets [HashiCorp Vault API]"