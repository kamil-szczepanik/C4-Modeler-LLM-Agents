# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing & Load Balancing Engine"
    technology: "Envoy C++ Core"
    description: "Manages, secures, and routes all incoming ingress traffic across multiple Availability Zones."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Envoy WASM/Lua Plugin"
    description: "Validates incoming requests, verifies JWTs, and handles data residency filtering."
  - type: "component"
    name: "Rate Limiting & Traffic Shaping Module"
    technology: "Envoy Rate Limit Service"
    description: "Enforces rate-limiting and geo-compliance to ensure high-performance public and staff portals."
  - type: "component"
    name: "Caching & Response Compression Component"
    technology: "Envoy HTTP Cache Filter"
    description: "Evaluates cache policies backed by Redis for rapid retrieval of public catalogue metadata."
  - type: "component"
    name: "Response Transformation Component"
    technology: "Envoy Transformation Filter"
    description: "Transforms outgoing responses at the ingress boundary."
relationships:
  - source: "Patron Portal"
    destination: "Authentication & Authorization Filter"
    description: "Validates incoming requests [HTTPS (TLS 1.3)]"
  - source: "Staff Dashboard"
    destination: "Authentication & Authorization Filter"
    description: "Validates incoming requests [HTTPS (TLS 1.3)]"
  - source: "Routing & Load Balancing Engine"
    destination: "Core Business Service"
    description: "Forwards upstream traffic [gRPC/mTLS (Istio)]"
  - source: "Routing & Load Balancing Engine"
    destination: "Search Service"
    description: "Forwards upstream traffic [gRPC/mTLS (Istio)]"
  - source: "Routing & Load Balancing Engine"
    destination: "Caching & Response Compression Component"
    description: "Evaluates cache policies [Internal Memory/Redis]"
  - source: "Authentication & Authorization Filter"
    destination: "Third-Party Identity Provider"
    description: "Verifies JWTs [OAuth2/OIDC]"
  - source: "API Gateway"
    destination: "Centralized Observability & SIEM Platform"
    description: "Exports metrics and traces [Prometheus / OpenTelemetry]"