level: component
scope: "Component diagram for the Relational DB container"
parentContainer:
  name: "Relational DB"
elements:
  - type: "component"
    name: "Transactional Engine"
    technology: "PostgreSQL core"
    description: "Ensures ACID compliance and zero-tolerance for double-booked loans."
  - type: "component"
    name: "Audit & Compliance Schema"
    technology: "pgAudit"
    description: "Database extension for logging administrative actions to satisfy GDPR tracking mandates."
  - type: "component"
    name: "Replication & High Availability Module"
    technology: "Patroni / Streaming Replication (etcd/Consul)"
    description: "Manages automated high availability and sub-30-second failover restricted to EU regions."
  - type: "component"
    name: "Connection Pooling Proxy"
    technology: "PgBouncer"
    description: "Connection pooling proxy configured in transaction mode to handle peak portal traffic."
relationships:
  - source: "Connection Pooling Proxy"
    destination: "Transactional Engine"
    description: "Forwards pooled queries [TCP / internal encryption]"
  - type: "component"
    name: "Relational DB"
    destination: "Backup & Disaster Recovery Storage"
    description: "Streams write-ahead logs (WAL) for point-in-time recovery [Encrypted SSH/S3 API]"