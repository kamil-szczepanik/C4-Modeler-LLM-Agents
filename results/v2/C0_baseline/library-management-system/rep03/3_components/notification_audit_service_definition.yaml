level: component
scope: "Component diagram for the Notification & Audit Service container"
parentContainer:
  name: "Notification & Audit Service"
elements:
  - type: "component"
    name: "Event Consumer Component"
    technology: "Python / FastAPI Background Worker"
    description: "Consumes domain events from the message broker via mTLS."
  - type: "component"
    name: "Audit Processor Component"
    technology: "Python / FastAPI"
    description: "Handles compliance and generates tamper-evident audit logs."
  - type: "component"
    name: "Notification Dispatcher Component"
    technology: "Python / FastAPI"
    description: "Multi-channel gateway for dispatching alerts."
  - type: "component"
    name: "Preference Repository Access Component"
    technology: "Python / FastAPI"
    description: "Queries user settings and notification preferences."
  - type: "component"
    name: "Message Broker"
    technology: "Kafka / RabbitMQ"
    description: "External message broker for domain events."
  - type: "component"
    name: "Centralized Observability & SIEM Platform"
    technology: "SIEM / TLS Syslog"
    description: "External platform for centralized audit log forwarding."
  - type: "component"
    name: "Payment Gateway and Notification Service"
    technology: "HTTPS / REST (TLS 1.3)"
    description: "External service for dispatching alerts."
  - type: "component"
    name: "Relational DB"
    technology: "PostgreSQL"
    description: "Stores user preferences."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "Vault"
    description: "Dynamic secret injection and encryption key management."
relationships:
  - source: "Event Consumer Component"
    destination: "Message Broker"
    description: "Consumes domain events [Kafka / RabbitMQ] via mTLS"
  - source: "Audit Processor Component"
    destination: "Centralized Observability & SIEM Platform"
    description: "Forwards audit logs via TLS/Syslog"
  - source: "Notification Dispatcher Component"
    destination: "Payment Gateway and Notification Service"
    description: "Dispatches alerts via HTTPS/REST (TLS 1.3)"
  - source: "Preference Repository Access Component"
    destination: "Relational DB"
    description: "Queries user preferences via JDBC/SQL over mTLS"