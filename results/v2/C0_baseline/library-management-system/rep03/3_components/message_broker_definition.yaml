level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Apache Kafka"
    technology: "Apache Kafka, Strimzi Kubernetes Operator"
    description: "Distributed event streaming platform serving as the core event router and broker."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry / Apicurio"
    description: "Manages and validates event schemas across the system."
  - type: "component"
    name: "Dead-Letter Queue Topics"
    technology: "Apache Kafka DLQ Topics"
    description: "Routes and isolates failed consumption events for later inspection and replay."
  - type: "component"
    name: "Event Replay and Administration Tooling"
    technology: "Kafka-UI / Custom Admin CLI"
    description: "Enables event replay and administrative operations from the DLQ."
  - type: "component"
    name: "Secrets Manager Integration"
    technology: "HashiCorp Vault"
    description: "Provides centralized secret management for mTLS certificates, RBAC, and encryption keys."
relationships:
  - source: "Core Business Service"
    destination: "Apache Kafka"
    description: "Publishes raw domain events via gRPC / Kafka Protocol"
  - source: "Integration Service"
    destination: "Dead-Letter Queue Topics"
    description: "Routes failed consumption events via Kafka Protocol"
  - source: "Event Replay and Administration Tooling"
    destination: "Apache Kafka"
    description: "Re-publishes corrected events from DLQ via Kafka Protocol"
  - source: "Notification & Audit Service"
    destination: "Apache Kafka"
    description: "Consumes sanitized events via Kafka Consumer API"