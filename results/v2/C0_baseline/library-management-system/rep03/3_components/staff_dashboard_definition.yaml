level: component
scope: "Component diagram for the Staff Dashboard container"
parentContainer:
  name: "Staff Dashboard"
elements:
  - type: "component"
    name: "Authentication & Session Component"
    technology: "React Context / OIDC Client"
    description: "Manages user authentication, session state, and secure token lifecycle."
  - type: "component"
    name: "Circulation Workspace"
    technology: "React Module with IndexedDB and Web Crypto API"
    description: "Handles circulation tasks with client-side offline buffering and encrypted local storage for PII."
  - type: "component"
    name: "Cataloguing & Inventory Module"
    technology: "React Module"
    description: "Provides interface for heavy cataloguing and inventory workflows."
  - type: "component"
    name: "Administration & Audit Panel"
    technology: "React Module with Chart.js reporting widget"
    description: "Enables system administration and displays operational reporting visualizations."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios / Fetch + TypeScript Interceptors"
    description: "Manages outgoing API requests and injects OIDC tokens."
  - type: "component"
    name: "Quick Actions Hotkey Manager"
    technology: "Global React Context"
    description: "Manages global keyboard shortcuts for rapid staff navigation."
relationships:
  - source: "Staff Dashboard"
    destination: "API Gateway"
    description: "Sends API requests and OIDC tokens [HTTPS (TLS 1.3)]"
  - source: "Staff Dashboard"
    destination: "S3 + CloudFront"
    description: "Fetches static assets and content delivery [HTTPS (TLS 1.3)]"
  - source: "Authentication & Session Component"
    destination: "API Client Layer"
    description: "Provides OIDC tokens for requests"
  - source: "Circulation Workspace"
    destination: "API Client Layer"
    description: "Sends circulation data requests"
  - source: "Cataloguing & Inventory Module"
    destination: "API Client Layer"
    description: "Sends cataloguing data requests"
  - source: "Administration & Audit Panel"
    destination: "API Client Layer"
    description: "Sends administrative and audit requests"