level: component
scope: "Component diagram for the Integration Service container"
parentContainer:
  name: "Integration Service"
elements:
  - type: "component"
    name: "Event Consumer Component"
    technology: "Node.js / TypeScript / Kafka.js"
    description: "Consumes domain events from the message broker."
  - type: "component"
    name: "Payment Adapter Component"
    technology: "Node.js / TypeScript / Axios / Opossum"
    description: "Processes transactions, handles callbacks, and fetches API keys securely."
  - type: "component"
    name: "Content Provider Adapter Component"
    technology: "Node.js / TypeScript / Axios"
    description: "Retrieves metadata and licenses from digital content providers."
  - type: "component"
    name: "Retry & DLQ Manager Component"
    technology: "Node.js / TypeScript / Kafka.js"
    description: "Manages failed messages, publishes to DLQ, and triggers alerts."
  - type: "component"
    name: "Notification Dispatcher Component"
    technology: "Node.js / TypeScript / Axios"
    description: "Dispatches notifications and triggers alerts on persistent failures."
  - type: "component"
    name: "Observability Exporter Component"
    technology: "Node.js / TypeScript / prom-client"
    description: "Ships anonymized metrics and logs to the centralized observability platform."
relationships:
  - source: "Event Consumer Component"
    destination: "Message Broker"
    description: "Consumes domain events [Kafka Protocol]"
  - source: "Payment Adapter Component"
    destination: "Payment Gateway"
    description: "Processes transactions and handles callbacks [TLS 1.3 / HMAC-SHA256]"
  - source: "Content Provider Adapter Component"
    destination: "Digital Content Providers"
    description: "Retrieves metadata and licenses [TLS 1.3]"
  - source: "Payment Adapter Component"
    destination: "Secrets Manager"
    description: "Fetches API keys and manages tokens [HashiCorp Vault API / mTLS]"
  - source: "Retry & DLQ Manager Component"
    destination: "Message Broker"
    description: "Publishes failed messages to DLQ [Kafka Protocol]"
  - source: "Retry & DLQ Manager Component"
    destination: "Notification Dispatcher Component"
    description: "Triggers alerts on persistent failure [Internal Async Call]"
  - source: "Observability Exporter Component"
    destination: "Centralized Observability & SIEM Platform"
    description: "Ships anonymized metrics and logs [HTTPS / TLS 1.3]"