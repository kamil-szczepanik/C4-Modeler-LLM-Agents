level: component
scope: "Component diagram for the Search Service container"
parentContainer:
  name: "Search Service"
elements:
  - type: "component"
    name: "Search API Controller"
    technology: "Java / Spring WebFlux"
    description: "Asynchronous non-blocking control for low-latency queries, handling HTTP/2 REST requests."
  - type: "component"
    name: "Indexing Consumer"
    technology: "Java / Spring Kafka"
    description: "Consumes Kafka events for near-real-time inventory indexing and performs partial document updates."
  - type: "component"
    name: "Query Builder & Ranking Engine"
    technology: "Java"
    description: "Builds complex search queries and handles ranking for catalogue discovery."
  - type: "component"
    name: "Search Data Store"
    technology: "OpenSearch"
    description: "Distributed EU-hosted search cluster meeting the sub-800ms performance SLA."
  - type: "component"
    name: "API Gateway"
    technology: "Nginx / Envoy"
    description: "Entry point routing HTTP/2 REST traffic to the Search API Controller."
  - type: "component"
    name: "Message Broker"
    technology: "Kafka"
    description: "Asynchronous event ingestion backbone for inventory indexing."
  - type: "component"
    name: "Secrets Manager"
    technology: "HashiCorp Vault"
    description: "Dynamic runtime injection of mTLS certificates and credentials."
relationships:
  - source: "API Gateway"
    destination: "Search API Controller"
    description: "HTTP/2 REST"
  - source: "Search API Controller"
    destination: "Search Data Store"
    description: "HTTP/JSON with Connection Pooling"
  - source: "Message Broker"
    destination: "Indexing Consumer"
    description: "Kafka Events"
  - source: "Indexing Consumer"
    destination: "Search Data Store"
    description: "Partial Document Updates"
  - source: "Search API Controller"
    destination: "Secrets Manager"
    description: "mTLS / Runtime Secret Injection via HashiCorp Vault"