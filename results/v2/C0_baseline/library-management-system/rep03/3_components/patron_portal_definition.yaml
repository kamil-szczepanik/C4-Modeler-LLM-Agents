level: component
scope: "Component diagram for the Patron Portal container"
parentContainer:
  name: "Patron Portal"
elements:
  - type: "component"
    name: "Search & Discovery Component"
    technology: "React / TypeScript"
    description: "Enables public and academic library patrons to autonomously discover items."
  - type: "component"
    name: "Account & Fines Component"
    technology: "React / TypeScript"
    description: "Enables patrons to manage accounts and view fines."
  - type: "component"
    name: "Digital Content Reader Component"
    technology: "React / TypeScript"
    description: "Provides access to digital content for patrons."
  - type: "component"
    name: "Accessibility & Localization Layer"
    technology: "React Context"
    description: "Ensures WCAG 2.1 AA compliance to meet universal public and academic accessibility mandates."
  - type: "component"
    name: "API Client Service"
    technology: "Axios / TypeScript with RUM telemetry"
    description: "Centralizes communication, error handling, and RUM telemetry integration."
  - type: "component"
    name: "Health Check & Feature Flag Service"
    technology: "React / TypeScript"
    description: "Polls lightweight dependency status endpoints."
  - type: "component"
    name: "CDN Deployment"
    technology: "AWS S3 + CloudFront"
    description: "Delivers static assets globally with strict cache-control and automated invalidation."
relationships:
  - source: "Library Patrons"
    destination: "Patron Portal"
    description: "Interacts via web browser [HTTPS (TLS 1.3)]"
  - source: "Patron Portal"
    destination: "API Gateway"
    description: "Sends API requests and receives HTTP-only cookies [HTTPS (TLS 1.3)]"
  - source: "API Client Service"
    destination: "Centralized Observability & SIEM Platform"
    description: "Sends scrubbed performance and error metrics [HTTPS (TLS 1.3)]"
  - source: "Health Check & Feature Flag Service"
    destination: "API Gateway"
    description: "Polls lightweight dependency status endpoints [HTTPS (TLS 1.3)]"