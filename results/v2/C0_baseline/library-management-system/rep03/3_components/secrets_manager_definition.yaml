level: component
scope: "Component diagram for the Secrets Manager container"
parentContainer:
  name: "Secrets Manager"
elements:
  - type: "component"
    name: "Secrets Engine Component"
    technology: "HashiCorp Vault KV/Transit Secrets Engine"
    description: "Encrypted credential storage and envelope encryption."
  - type: "component"
    name: "Access Control & Authentication Component"
    technology: "HashiCorp Vault AppRole, OIDC with MFA, RBAC"
    description: "Zero-trust authorization, automated service authentication, and administrator Single Sign-On."
  - type: "component"
    name: "Audit Logging Component"
    technology: "Vault Audit Device"
    description: "Streaming security and failure events."
  - type: "component"
    name: "Secret Rotation Component"
    technology: "Vault Automated Rotation / Consul Template"
    description: "Lifecycle management and automated rotation of credentials."
  - type: "component"
    name: "Backup & Disaster Recovery Component"
    technology: "Encrypted snapshotting with Shamir's Secret Sharing"
    description: "Break-glass procedures and encrypted snapshot generation."
relationships:
  - source: "System Administrators / DevOps Engineers"
    destination: "Access Control & Authentication Component"
    description: "Manages policies, reviews audit logs, and authenticates [HTTPS / Vault CLI/UI with OIDC/MFA]."
  - source: "Core Business Service / Integration Service"
    destination: "Access Control & Authentication Component"
    description: "Authenticates using short-lived tokens [Vault AppRole / mTLS]."
  - source: "Core Business Service"
    destination: "Secrets Engine Component"
    description: "Fetches operational credentials [Vault REST API over TLS 1.3]."
  - source: "Audit Logging Component"
    destination: "Centralized Observability & SIEM Platform"
    description: "Streams audit trails and failure events [Syslog/HTTPS via TLS 1.3]."
  - source: "Backup & Disaster Recovery Component"
    destination: "Backup & Disaster Recovery Storage"
    description: "Periodically pushes encrypted snapshots [Regional EU endpoints]."