level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A cloud-native platform designed for public and academic libraries to catalogue physical and digital items, manage circulation, and provide self-service portals with strict EU data residency compliance."
elements:
  - type: "person"
    name: "Library Patrons and Library Staff"
    description: "Primary users who interact with the system via web and mobile UI for circulation and cataloguing."
  - type: "externalSystem"
    name: "Third-Party Identity Providers"
    description: "External authentication providers supporting eIDAS and SAML/OIDC."
  - type: "externalSystem"
    name: "Digital Content Providers/Vendors and Interlibrary Loan (ILL) Network"
    description: "External networks and vendors providing digital content and interlibrary loan services."
  - type: "externalSystem"
    name: "Payment Gateway and Notification Service"
    description: "External services handling payments and sending notifications and alerts."
  - type: "externalSystem"
    name: "Centralized Observability & SIEM Platform"
    description: "Platform for centralized logging, monitoring, and security information event management."
  - type: "externalSystem"
    name: "Backup & Disaster Recovery Storage"
    description: "EU-resident object storage used for backup and disaster recovery."
relationships:
  - source: "Library Patrons and Library Staff"
    destination: "Library Management System"
    description: "Interact with the system for self-service portals and management"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Management System"
    destination: "Third-Party Identity Providers"
    description: "Authenticate users securely"
    technology: "OAuth 2.0 / OIDC and MFA"
  - source: "Library Management System"
    destination: "Digital Content Providers/Vendors and Interlibrary Loan (ILL) Network"
    description: "Integrate for digital content and interlibrary loans"
    technology: "REST/GraphQL over HTTPS with mTLS and OAuth 2.0"
  - source: "Library Management System"
    destination: "Payment Gateway and Notification Service"
    description: "Process payments and send alerts"
    technology: "REST/GraphQL / HTTPS / Webhooks"
  - source: "Library Management System"
    destination: "Centralized Observability & SIEM Platform"
    description: "Forward logs and telemetry data"
    technology: "HTTPS"
  - source: "Library Management System"
    destination: "Backup & Disaster Recovery Storage"
    description: "Store backups and disaster recovery data"
    technology: "Encrypted EU-resident object storage"