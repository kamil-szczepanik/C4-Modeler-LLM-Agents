level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons, Librarians, and Administrators"
    description: "Users who interact with the system via self-service portals and management interfaces."
  - type: "externalSystem"
    name: "External Identity Provider (IdP)"
    description: "External service handling authentication and identity management."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service processing payments for fines, fees, and services."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External service handling email and message notifications to patrons and staff."
  - type: "container"
    name: "Web App / SPA"
    technology: "React/TypeScript, CDN"
    description: "Provides patron and librarian portals for catalog browsing, circulation, and self-service."
  - type: "container"
    name: "API Gateway"
    technology: "Envoy/Kong"
    description: "Routes incoming traffic, enforces OAuth2/OIDC, and applies cross-cutting security policies."
  - type: "container"
    name: "Core Services Container"
    technology: "Java/Spring Boot"
    description: "Modular monolith implementing core library logic and role-based access control (RBAC)."
  - type: "container"
    name: "Search Container"
    technology: "Elasticsearch"
    description: "Provides low-latency queries for catalog and items meeting the sub-800ms SLA."
  - type: "container"
    name: "Audit Container"
    technology: "Go"
    description: "Consumes security and audit events to ensure compliance and tracking."
  - type: "container"
    name: "Message Broker"
    technology: "Apache Kafka/RabbitMQ"
    description: "Handles asynchronous events and message distribution across services."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL"
    description: "Persists transactional library data with EU hosting and encryption at rest."
relationships:
  - source: "Library Patrons, Librarians, and Administrators"
    destination: "Web App / SPA"
    description: "Accesses portal interfaces and management tools"
    technology: "HTTPS"
  - source: "Web App / SPA"
    destination: "API Gateway"
    description: "Communicates with backend APIs"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Core Services Container"
    description: "Routes traffic and API requests"
    technology: "gRPC/REST over mTLS"
  - source: "Core Services Container"
    destination: "Search Container"
    description: "Queries item and catalog data"
    technology: "mTLS"
  - source: "Core Services Container"
    destination: "Database"
    description: "Reads and writes transactional data"
    technology: "mTLS"
  - source: "Core Services Container"
    destination: "Message Broker"
    description: "Publishes asynchronous events"
    technology: "mTLS"
  - source: "Audit Container"
    destination: "Message Broker"
    description: "Consumes security events"
    technology: "mTLS"
  - source: "Core Services Container"
    destination: "External Identity Provider (IdP)"
    description: "Authenticates users and validates sessions"
    technology: "OIDC/OAuth2 over HTTPS"
  - source: "Core Services Container"
    destination: "Payment Gateway"
    description: "Processes financial transactions"
    technology: "HTTPS/REST"
  - source: "Core Services Container"
    destination: "Notification Service"
    description: "Dispatches notifications and alerts"
    technology: "HTTPS/SMTP"