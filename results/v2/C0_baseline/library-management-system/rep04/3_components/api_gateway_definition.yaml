level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Authentication Filter"
    technology: "Envoy Filter (envoy.filters.http.oauth2)"
    description: "Manages security and validates OAuth2/OIDC tokens with the external Identity Provider."
  - type: "component"
    name: "Rate Limiting Filter"
    technology: "Redis token-bucket"
    description: "Protects against abuse by tracking and limiting request rates."
  - type: "component"
    name: "Request Transformation Filter"
    technology: "Envoy HTTP Filter"
    description: "Modifies incoming requests and injects trusted identity headers."
  - type: "component"
    name: "W3C Trace Injector"
    technology: "Envoy Tracing Extension"
    description: "Injects W3C Trace Context for distributed tracing across services."
  - type: "component"
    name: "Routing & Upstream Cluster Manager"
    technology: "Envoy Cluster Manager with Circuit Breaker"
    description: "Manages routing to core services and ensures high availability via circuit breaking."
  - type: "component"
    name: "OpenAPI Schema Validation Filter"
    technology: "Envoy Validation Filter"
    description: "Enforces OpenAPI schema validation on incoming API requests."
relationships:
  - source: "Authentication Filter"
    destination: "External Identity Provider (IdP)"
    description: "Validates OAuth2/OIDC tokens [HTTPS]"
  - source: "Routing & Upstream Cluster Manager"
    destination: "Core Services Container"
    description: "Routes traffic, API requests, and injects trusted identity headers [gRPC/REST over mTLS]"
  - source: "Routing & Upstream Cluster Manager"
    destination: "Audit Container"
    description: "Emits Prometheus metrics and structured access logs [gRPC]"