level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Relational Engine - Primary"
    technology: "PostgreSQL"
    description: "Primary relational storage providing transactional storage with Write-Ahead Logging (WAL) for durability and point-in-time recovery."
  - type: "component"
    name: "Relational Engine - Read Replica"
    technology: "PostgreSQL"
    description: "Read replica relational storage handling read queries to separate workloads and improve performance."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Manages connection pools and routing targets to prevent thread exhaustion."
  - type: "component"
    name: "Replication Manager"
    technology: "Patroni/Stolon"
    description: "Automates High Availability and failover across EU availability zones."
  - type: "component"
    name: "Audit Container"
    technology: "Go"
    description: "Streams and processes audit logs (`pgaudit`) for GDPR and compliance adherence."
relationships:
  - source: "Core Services Container"
    destination: "Connection Pooler"
    description: "Read queries [TCP/mTLS] routed to Read Replica"
  - source: "Core Services Container"
    destination: "Connection Pooler"
    description: "Writes and transactions [TCP/mTLS] routed to Primary"
  - source: "Relational Engine - Primary"
    destination: "Audit Container"
    description: "Stream audit logs (pgaudit) [mTLS sidecar]"