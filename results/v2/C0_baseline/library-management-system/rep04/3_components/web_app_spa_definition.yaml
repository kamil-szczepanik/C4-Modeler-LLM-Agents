level: component
scope: "Component diagram for the Web App / SPA container"
parentContainer:
  name: "Web App / SPA"
elements:
  - type: "component"
    name: "Routing & Authentication Module"
    technology: "React Router, OIDC client"
    description: "Handles application routing and authenticates users via OIDC/OAuth2 protocols."
  - type: "component"
    name: "Catalog Discovery Component"
    technology: "React, TanStack Query"
    description: "Provides catalog search and discovery capabilities with optimized caching."
  - type: "component"
    name: "Self-Service Circulation Component"
    technology: "React"
    description: "Enables library patrons to self-manage checkouts, returns, and renewals."
  - type: "component"
    name: "Librarian Management Dashboard"
    technology: "React"
    description: "Delivers administrative and circulation management interfaces for library staff."
  - type: "component"
    name: "State & Caching Layer"
    technology: "TanStack Query / Zustand"
    description: "Manages in-memory state, caching, and offline resilience."
relationships:
  - source: "Routing & Authentication Module"
    destination: "External Identity Provider"
    description: "OIDC/OAuth2 authentication [HTTPS]"
  - source: "Catalog Discovery Component"
    destination: "State & Caching Layer"
    description: "In-memory state management [Direct Function Call]"
  - source: "Self-Service Circulation Component"
    destination: "State & Caching Layer"
    description: "In-memory state management [Direct Function Call]"
  - source: "Librarian Management Dashboard"
    destination: "State & Caching Layer"
    description: "In-memory state management [Direct Function Call]"
  - source: "State & Caching Layer"
    destination: "API Gateway"
    description: "REST/JSON and WebSockets [HTTPS]"