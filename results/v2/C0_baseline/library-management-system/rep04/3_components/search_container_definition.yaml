level: component
scope: "Component diagram for the Search Container container"
parentContainer:
  name: "Search Container"
elements:
  - type: "component"
    name: "Search API Handler"
    technology: "Java / Spring MVC"
    description: "Exposes REST endpoints with built-in RBAC, input sanitization, and query analytics."
  - type: "component"
    name: "Indexing Service"
    technology: "Java"
    description: "Consumes catalog updates from the message broker to synchronize search indices."
  - type: "component"
    name: "Elasticsearch Cluster"
    technology: "Elasticsearch"
    description: "Core distributed data store providing multi-lingual, fuzzy search and inverted index capabilities."
  - type: "component"
    name: "Message Broker"
    technology: "Apache Kafka"
    description: "Distributes asynchronous catalog update and analytics events."
  - type: "component"
    name: "Audit Container"
    technology: "Go"
    description: "Receives security and authentication telemetry."
  - type: "component"
    name: "Core Services Container"
    technology: "Software System / Container"
    description: "Queries item and catalog data via HTTP/JSON over mTLS."
relationships:
  - source: "Core Services Container"
    destination: "Search API Handler"
    description: "Queries item and catalog data via HTTP/JSON over mTLS (TLS 1.3)"
  - source: "Message Broker"
    destination: "Indexing Service"
    description: "Feeds catalog update events using the Kafka Consumer Protocol"
  - source: "Search API Handler"
    destination: "Message Broker"
    description: "Dispatches asynchronous zero-result search analytics events"
  - source: "Search API Handler"
    destination: "Audit Container"
    description: "Forwards failed authentication and unauthorized query attempts"
  - source: "Indexing Service"
    destination: "Elasticsearch Cluster"
    description: "Synchronizes search indices"
  - source: "Search API Handler"
    destination: "Elasticsearch Cluster"
    description: "Queries search index data"