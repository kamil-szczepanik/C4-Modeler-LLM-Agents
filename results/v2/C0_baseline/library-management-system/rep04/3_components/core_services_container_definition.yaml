level: component
scope: "Component diagram for the Core Services Container container"
parentContainer:
  name: "Core Services Container"
elements:
  - type: "component"
    name: "Security & RBAC Module"
    technology: "Spring Security"
    description: "Handles local JWT validation and least-privilege checks."
  - type: "component"
    name: "Catalog & Circulation Module"
    technology: "Spring Data JPA / HikariCP"
    description: "Manages items, loans, and HikariCP connection pools."
  - type: "component"
    name: "Audit & Event Dispatcher"
    technology: "Spring Events / Kafka Client"
    description: "Emits signed audit and domain events."
  - type: "component"
    name: "Database"
    technology: "PostgreSQL"
    description: "Stores transactional data with column-level PII encryption."
  - type: "component"
    name: "API Gateway"
    technology: "API Gateway"
    description: "Routes API traffic to the core services container."
  - type: "component"
    name: "External IdP"
    technology: "Identity Provider"
    description: "Provides cached public keys for local JWT validation."
  - type: "component"
    name: "Search Container"
    technology: "Search Service"
    description: "Indexes and searches catalog data."
  - type: "component"
    name: "Message Broker"
    technology: "Message Broker"
    description: "Receives published signed audit and domain events."
  - type: "component"
    name: "Payment Gateway"
    technology: "Payment Service"
    description: "Processes financial transactions."
  - type: "component"
    name: "Notification Service"
    technology: "Notification Service"
    description: "Dispatches alerts."
relationships:
  - source: "API Gateway"
    destination: "Core Services Container"
    description: "Routes API traffic [gRPC/REST over mTLS]"
  - source: "Security & RBAC Module"
    destination: "External IdP"
    description: "Fetches cached public keys for local JWT validation [HTTPS]"
  - source: "Catalog & Circulation Module"
    destination: "Database"
    description: "Executes transactional reads/writes [JDBC over mTLS with sslmode=verify-full]"
  - source: "Core Services Container"
    destination: "Search Container"
    description: "Queries catalog index [mTLS]"
  - source: "Audit & Event Dispatcher"
    destination: "Message Broker"
    description: "Publishes signed audit and domain events [TCP/mTLS]"
  - source: "Core Services Container"
    destination: "Payment Gateway"
    description: "Processes financial transactions [HTTPS/REST with certificate pinning]"
  - source: "Core Services Container"
    destination: "Notification Service"
    description: "Dispatches alerts [HTTPS/SMTP]"