level: component
scope: "Component diagram for the Audit Container container"
parentContainer:
  name: "Audit Container"
elements:
  - type: "component"
    name: "Event Consumer"
    technology: "Go, Kafka Protocol"
    description: "Consumes security events from the message broker via mTLS and SASL/SCRAM."
  - type: "component"
    name: "WORM Storage Manager"
    technology: "Go, TCP/SQL, TLS 1.3"
    description: "Persists append-only WORM records to the Audit Database."
  - type: "component"
    name: "Log Forwarder"
    technology: "Go, Syslog/HTTPS"
    description: "Forwards audit logs to the SIEM / Log Forwarder for compliance reporting."
  - type: "component"
    name: "Metrics Exporter"
    technology: "Go, HTTP, Prometheus"
    description: "Exposes Prometheus health metrics for ingestion uptime and monitoring."
relationships:
  - source: "Event Consumer"
    destination: "WORM Storage Manager"
    description: "Passes processed security events for persistence [Internal]"
  - source: "WORM Storage Manager"
    destination: "Audit Database"
    description: "Persists append-only WORM records via TLS 1.3 [TCP/SQL]"
  - source: "Log Forwarder"
    destination: "SIEM / Log Forwarder"
    description: "Forwards audit logs for compliance reporting [Syslog/HTTPS]"
  - source: "Metrics Exporter"
    destination: "Admin Dashboard"
    description: "Exposes Prometheus health metrics for ingestion uptime [HTTP]"