level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Library users who access the system via self-service portals."
  - type: "person"
    name: "Librarians/Circulation Staff"
    description: "Staff members who manage circulation and library operations."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators who configure and manage the library management system."
  - type: "externalSystem"
    name: "EU Identity Provider"
    description: "External provider handling authentication via OAuth2/OIDC."
  - type: "externalSystem"
    name: "EU Payment Gateway"
    description: "External payment service for handling transactions."
  - type: "externalSystem"
    name: "EU Notification Service"
    description: "External service for sending notifications."
  - type: "container"
    name: "API Gateway"
    technology: "Kong/Envoy"
    description: "Centralized OAuth 2.0 / OIDC JWT validation and routing."
  - type: "container"
    name: "Self-Service Portal"
    technology: "React/Nginx"
    description: "Frontend SPA for public library patrons."
  - type: "container"
    name: "Staff Management Console"
    technology: "React/Nginx"
    description: "Frontend SPA for librarians and staff."
  - type: "container"
    name: "Circulation Management"
    technology: "Backend Service"
    description: "Manages book and resource checkouts, returns, and patron accounts."
  - type: "container"
    name: "Catalogue Service"
    technology: "Backend Service"
    description: "Manages the inventory of physical and digital library items."
  - type: "container"
    name: "Search Engine"
    technology: "ElasticSearch"
    description: "Provides sub-800ms search capabilities for the catalogue."
  - type: "container"
    name: "Audit Logging"
    technology: "Kafka/Fluentbit"
    description: "Handles asynchronous event-driven audit logging."
  - type: "container"
    name: "Notification Worker"
    technology: "Go"
    description: "Processes and sends notifications asynchronously."
relationships:
  - source: "Library Patrons"
    destination: "Self-Service Portal"
    description: "Accesses via HTTPS/JSON REST through the API Gateway"
    technology: "HTTPS"
  - source: "Librarians/Circulation Staff"
    destination: "Staff Management Console"
    description: "Accesses via HTTPS/REST through the API Gateway"
    technology: "HTTPS"
  - source: "Self-Service Portal"
    destination: "API Gateway"
    description: "Routes requests to backend containers"
    technology: "HTTPS/JSON REST"
  - source: "Staff Management Console"
    destination: "API Gateway"
    description: "Routes requests to backend containers"
    technology: "HTTPS/REST"
  - source: "Catalogue Service"
    destination: "Search Engine"
    description: "Queries catalogue items"
    technology: "gRPC/TCP"
  - source: "Notification Worker"
    destination: "EU Notification Service"
    description: "Sends external notifications"
    technology: "HTTPS"