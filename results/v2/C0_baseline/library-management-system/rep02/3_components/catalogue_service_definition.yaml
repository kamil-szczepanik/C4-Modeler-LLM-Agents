level: component
scope: "Component diagram for the Catalogue Service container"
parentContainer:
  name: "Catalogue Service"
elements:
  - type: "component"
    name: "Catalogue API Controller"
    technology: "Java / Spring Boot"
    description: "Manages physical and digital library item inventories and metadata via REST/JSON."
  - type: "component"
    name: "Item Domain Model & Business Logic Component"
    technology: "Java"
    description: "Encapsulates item domain model and business logic."
  - type: "component"
    name: "Data Access Repository"
    technology: "PostgreSQL with JPA"
    description: "Ensures ACID compliance for transactional inventory updates."
  - type: "component"
    name: "Search Synchronizer Component"
    technology: "Java"
    description: "Synchronizes data with the search engine and publishes asynchronous events."
  - type: "component"
    name: "Search Engine"
    technology: "ElasticSearch"
    description: "Provides high-performance discovery to meet the <800ms SLA."
  - type: "component"
    name: "Usage Analytics & Telemetry Hook"
    technology: "Java"
    description: "Publishes asynchronous telemetry and analytics events."
  - type: "component"
    name: "Cache Layer"
    technology: "Redis"
    description: "Caches frequently accessed metadata with strict memory encryption and TTLs."
  - type: "component"
    name: "API Gateway"
    technology: "Gateway"
    description: "External entry point routing requests to the API controller."
  - type: "component"
    name: "Audit Logging/Kafka"
    technology: "Apache Kafka"
    description: "Decouples write operations from indexing and telemetry."
relationships:
  - source: "API Gateway"
    destination: "Catalogue API Controller"
    description: "REST/JSON over HTTPS with JWT validation"
  - source: "Catalogue API Controller"
    destination: "Item Domain Model & Business Logic Component"
    description: "Direct Java method invocation"
  - source: "Item Domain Model & Business Logic Component"
    destination: "Data Access Repository"
    description: "JDBC/JPA over mTLS"
  - source: "Item Domain Model & Business Logic Component"
    destination: "Cache Layer"
    description: "Encrypted caching with strict TTLs"
  - source: "Search Synchronizer Component"
    destination: "Search Engine"
    description: "gRPC/TCP"
  - source: "Search Synchronizer Component"
    destination: "Audit Logging/Kafka"
    description: "Asynchronous event publishing"
  - source: "Usage Analytics & Telemetry Hook"
    destination: "Audit Logging/Kafka"
    description: "Asynchronous event publishing"