level: component
scope: "Component diagram for the Audit Logging container"
parentContainer:
  name: "Audit Logging"
elements:
  - type: "component"
    name: "Library Administrators & Compliance Officers"
    technology: "User"
    description: "Users who access compliance reports and audit logs."
  - type: "component"
    name: "System Auditors & Security Analysts"
    technology: "User"
    description: "Analysts who review audit trails in the SIEM and compliance dashboard."
  - type: "component"
    name: "API Gateway (Kong/Envoy) & Backend Services"
    technology: "Kong/Envoy, Go"
    description: "Capture and emit audit events asynchronously."
  - type: "component"
    name: "Audit Agent (Fluentbit sidecar)"
    technology: "Fluentbit"
    description: "Lightweight log shipping and payload sanitization/masking agent."
  - type: "component"
    name: "Event Broker"
    technology: "Managed Apache Kafka / EU-hosted"
    description: "Durable event broker with cross-AZ replication and disk-buffering."
  - type: "component"
    name: "Audit Consumer Worker"
    technology: "Go"
    description: "Processes and consumes events from the Event Broker."
  - type: "component"
    name: "Audit Storage"
    technology: "PostgreSQL with TimescaleDB WORM storage"
    description: "PostgreSQL-based immutable storage supporting automated retention, tiering, and cryptographic hash-chaining with AES-256 encryption at rest."
  - type: "component"
    name: "Compliance Query Service"
    technology: "Go/REST"
    description: "High-performance service for querying audit data."
  - type: "component"
    name: "Compliance Reporting Dashboard"
    technology: "React"
    description: "Lightweight UI for the Compliance Reporting Dashboard."
  - type: "component"
    name: "EU-hosted SIEM"
    technology: "SIEM"
    description: "Receives encrypted syslog feeds for centralized security monitoring."
relationships:
  - source: "API Gateway (Kong/Envoy) & Backend Services"
    destination: "Event Broker"
    description: "gRPC/TCP, async event ingestion, mTLS"
  - source: "Event Broker"
    destination: "Audit Consumer Worker"
    description: "Kafka Protocol, mTLS"
  - source: "Audit Consumer Worker"
    destination: "Audit Storage"
    description: "SQL/TLS, AES-256 encryption at rest, EU KMS"
  - source: "Compliance Reporting Dashboard"
    destination: "Compliance Query Service"
    description: "HTTPS/REST, mTLS"
  - source: "Compliance Query Service"
    destination: "Audit Storage"
    description: "SQL/TLS, read-only restricted role, strict query guardrails"
  - source: "Audit Storage"
    destination: "EU-hosted SIEM"
    description: "Encrypted syslog/TLS"