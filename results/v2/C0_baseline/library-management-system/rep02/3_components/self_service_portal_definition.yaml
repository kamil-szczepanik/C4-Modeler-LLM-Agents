level: component
scope: "Component diagram for the Self-Service Portal container"
parentContainer:
  name: "Self-Service Portal"
elements:
  - type: "component"
    name: "Library Patrons and Anonymous Visitors"
    technology: "Human User"
    description: "Patrons and visitors accessing the library system."
  - type: "component"
    name: "Routing & Layout Core Component"
    technology: "React Router"
    description: "Manages shared application state, global navigation, and WCAG 2.1 AA accessibility compliance."
  - type: "component"
    name: "Catalogue Explorer Component"
    technology: "React"
    description: "Enables patrons to catalogue and explore items."
  - type: "component"
    name: "Patron Dashboard Component"
    technology: "React"
    description: "Enables patrons to manage loans."
