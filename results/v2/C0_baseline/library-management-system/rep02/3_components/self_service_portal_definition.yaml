  - source: "Routing & Layout Core Component"
    destination: "Patron Dashboard Component"
    description: "Dynamically renders components [HTTPS]"
  - source: "Routing & Layout Core Component"
    destination: "Account & Fines Manager Component"
    description: "Dynamically renders components [HTTPS]"
  - source: "State & API Client Module"
    destination: "API Gateway"
    description: "Routes requests using HttpOnly cookies [HTTPS/JSON REST]"
  - source: "API Gateway"
    destination: "EU Identity Provider & EU Payment Gateway"
    description: "Handles OAuth2/PKCE and fine settlements [HTTPS]"