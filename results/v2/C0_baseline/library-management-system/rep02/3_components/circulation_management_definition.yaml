level: component
scope: "Component diagram for the Circulation Management container"
parentContainer:
  name: "Circulation Management"
elements:
  - type: "component"
    name: "Checkout Engine Component"
    technology: "Spring Boot / Java"
    description: "Handles self-service checkout workflows and business logic."
  - type: "component"
    name: "Patron Account Manager Component"
    technology: "Spring Boot / Java"
    description: "Manages patron accounts and staff management console requests."
  - type: "component"
    name: "Circulation Data Access Component"
    technology: "JPA / PostgreSQL 15"
    description: "Provides relational state storage with required EU-region data residency enforcement."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Spring Cloud Stream / Kafka"
    description: "Enables decoupled asynchronous messaging and audit event publishing."
relationships:
  - source: "Checkout Engine Component"
    destination: "Circulation Data Access Component"
    description: "Accesses via internal package-private boundaries"
  - source: "Patron Account Manager Component"
    destination: "Circulation Data Access Component"
    description: "Accesses via internal package-private boundaries"
  - source: "Event Publisher Component"
    destination: "Kafka"
    description: "Publishes asynchronous audit and notifications via TCP"