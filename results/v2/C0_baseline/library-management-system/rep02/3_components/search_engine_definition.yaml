level: component
scope: "Component diagram for the Search Engine container"
parentContainer:
  name: "Search Engine"
elements:
  - type: "component"
    name: "Query Processor"
    technology: "Java / Elasticsearch DSL"
    description: "Handles incoming search requests with linguistic analysis and facets."
  - type: "component"
    name: "Index Manager"
    technology: "Elasticsearch"
    description: "Manages index lifecycles, mappings, and bulk ingestion."
  - type: "component"
    name: "Data Synchronizer"
    technology: "Kafka"
    description: "Consumes CDC events from the Catalogue Service for eventual consistency."
  - type: "component"
    name: "Analytics Aggregator"
    technology: "Elasticsearch Transform API"
    description: "Produces anonymized query metrics and zero-result logs."
  - type: "component"
    name: "Elasticsearch Cluster"
    technology: "Elasticsearch"
    description: "Core storage and search engine deployed within EU-region availability zones."
relationships:
  - source: "Catalogue Service"
    destination: "Query Processor"
    description: "Queries catalogue items [gRPC/TCP with mTLS]"
  - source: "Catalogue Service"
    destination: "Data Synchronizer"
    description: "Publishes catalogue changes [Kafka topics with TLS 1.3]"
  - source: "Analytics Aggregator"
    destination: "Audit Logging Container"
    description: "Publishes aggregated trending metrics [Kafka]"