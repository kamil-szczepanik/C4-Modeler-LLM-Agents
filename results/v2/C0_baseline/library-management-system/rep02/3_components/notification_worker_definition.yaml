level: component
scope: "Component diagram for the Notification Worker container"
parentContainer:
  name: "Notification Worker"
elements:
  - type: "component"
    name: "Consumer / Event Listener"
    technology: "Go"
    description: "Consumes events from the Message Broker."
  - type: "component"
    name: "Template Engine"
    technology: "Go"
    description: "Processes and templates alert payloads."
  - type: "component"
    name: "Dispatch Router"
    technology: "Go"
    description: "Forwards messages and delegates dispatch with fallback."
  - type: "component"
    name: "Provider Adapters"
    technology: "Go"
    description: "Sends external alerts to the EU Notification Service."
relationships:
  - source: "Consumer / Event Listener"
    destination: "Message Broker (Kafka/RabbitMQ)"
    description: "Consumes events [AMQP/Kafka via mTLS]"
  - source: "Consumer / Event Listener"
    destination: "Template Engine"
    description: "Passes payloads [Go structs]"
  - source: "Template Engine"
    destination: "Dispatch Router"
    description: "Forwards messages [Go structs]"
  - source: "Dispatch Router"
    destination: "Provider Adapters"
    description: "Delegates dispatch with fallback [Go interfaces]"
  - source: "Provider Adapters"
    destination: "EU Notification Service (External)"
    description: "Sends external alerts [HTTPS/REST with TLS 1.3]"