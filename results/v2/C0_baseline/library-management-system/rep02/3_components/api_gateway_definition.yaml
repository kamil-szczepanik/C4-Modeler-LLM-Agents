level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing and Proxy Engine"
    technology: "Kong/Envoy"
    description: "Routes incoming requests from the Self-Service Portal and Staff Management Console to backend services using gRPC/HTTP2."
  - type: "component"
    name: "Authentication and Authorization Middleware"
    technology: "Kong/Envoy Plugin with Redis"
    description: "Validates OIDC tokens against the EU Identity Provider, fetches and caches JWKS using local Redis, and handles rate limiting."
  - type: "component"
    name: "Observability and Security Agent"
    technology: "OpenTelemetry, WAF, Kafka/Fluentbit"
    description: "Handles distributed tracing, Prometheus metrics for latency tracking, WAF protection, and PII-scrubbed audit logging."
relationships:
  - source: "Routing and Proxy Engine"
    destination: "Authentication and Authorization Middleware"
    description: "Validates tokens and enforces rate limits [HTTPS/gRPC]"
  - source: "Routing and Proxy Engine"
    destination: "Catalogue Service"
    description: "Routes traffic [gRPC/HTTP2]"
  - source: "Routing and Proxy Engine"
    destination: "Search Engine"
    description: "Routes traffic [gRPC/HTTP2]"
  - source: "Authentication and Authorization Middleware"
    destination: "EU Identity Provider"
    description: "Validates OIDC tokens and fetches JWKS [HTTPS]"