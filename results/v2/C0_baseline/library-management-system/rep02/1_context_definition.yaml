level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Provides cataloguing, circulation management, and self-service portals for public and academic libraries within an EU-only data residency boundary."
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Library users who access the system via self-service portals."
  - type: "person"
    name: "Librarians/Circulation Staff"
    description: "Staff members who manage circulation, cataloguing, and library operations."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators who configure and manage the library management system."
  - type: "externalSystem"
    name: "EU Identity Provider"
    description: "External provider handling authentication via OAuth2/OIDC."
  - type: "externalSystem"
    name: "EU Payment Gateway"
    description: "External payment service for handling transactions."
  - type: "externalSystem"
    name: "EU Notification Service"
    description: "External service for sending notifications."
relationships:
  - source: "Library Patrons"
    destination: "Library Management System"
    description: "Interacts with Web and Mobile Clients"
    technology: "HTTPS"
  - source: "Librarians/Circulation Staff"
    destination: "Library Management System"
    description: "Interacts with Web and Mobile Clients"
    technology: "HTTPS"
  - source: "Library Administrators"
    destination: "Library Management System"
    description: "Interacts with Web and Mobile Clients"
    technology: "HTTPS"
  - source: "Library Management System"
    destination: "EU Identity Provider"
    description: "Integrates for secure role-based access control"
    technology: "OAuth2/OIDC"
  - source: "Library Management System"
    destination: "EU Payment Gateway"
    description: "Integrates for payment processing"
    technology: "REST and mTLS"
  - source: "Library Management System"
    destination: "EU Notification Service"
    description: "Integrates for sending notifications"
    technology: "REST and mTLS"