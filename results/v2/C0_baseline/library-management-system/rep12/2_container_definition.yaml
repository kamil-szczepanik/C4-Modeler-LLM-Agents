level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Public or academic library users who access the system via the patron portal."
  - type: "person"
    name: "Library Staff"
    description: "Circulation staff and administrators who manage the system via the staff portal."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system used to charge fees."
  - type: "externalSystem"
    name: "Identity Provider / SSO"
    description: "External system used for authentication and federated academic SSO."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External system used to send alerts."
  - type: "externalSystem"
    name: "Logging & APM"
    description: "External system used for observability and monitoring."
  - type: "container"
    name: "Patron Web Application"
    technology: "React / TypeScript"
    description: "Frontend web application for library patrons served via CDN."
  - type: "container"
    name: "Staff Administration Portal"
    technology: "Angular / TypeScript"
    description: "Frontend web application for library staff and administrators."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx / Spring Cloud Gateway"
    description: "Single reverse proxy enforcing TLS 1.3 and JWT authentication."
  - type: "container"
    name: "Core Domain Services"
    technology: "Node.js / NestJS"
    description: "Modular monolith core domain services."
  - type: "container"
    name: "Search Engine"
    technology: "Elasticsearch"
    description: "Dedicated search engine ensuring sub-800ms P99 response times."
  - type: "container"
    name: "Relational Database"
    technology: "PostgreSQL"
    description: "Relational database for transactional consistency with AES-256 encryption."
  - type: "container"
    name: "Async Event Bus"
    technology: "RabbitMQ / Apache Kafka"
    description: "Async event bus for decoupled event-driven architecture."
  - type: "container"
    name: "Notification Worker"
    technology: "Node.js / NestJS"
    description: "Background worker handling notifications."
relationships:
  - source: "Library Patrons"
    destination: "Patron Web Application"
    description: "Accesses self-service portal"
    technology: "HTTPS"
  - source: "Library Staff"
    destination: "Staff Administration Portal"
    description: "Accesses administration portal"
    technology: "HTTPS"
  - source: "Patron Web Application"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS/REST"
  - source: "Staff Administration Portal"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Core Domain Services"
    description: "Routes requests"
    technology: "mTLS"
  - source: "Core Domain Services"
    destination: "Relational Database"
    description: "Reads and writes transactional data"
    technology: "mTLS"
  - source: "Core Domain Services"
    destination: "Search Engine"
    description: "Performs search queries"
    technology: "mTLS"
  - source: "Core Domain Services"
    destination: "Async Event Bus"
    description: "Publishes domain events"
    technology: "mTLS"
  - source: "Notification Worker"
    destination: "Notification Service"
    description: "Sends notifications"
    technology: "HTTPS/API Keys"
  - source: "Core Domain Services"
    destination: "Identity Provider / SSO"
    description: "Authenticates users"
    technology: "SAML/OIDC"
  - source: "Core Domain Services"
    destination: "Payment Gateway"
    description: "Processes fee payments"
    technology: "HTTPS/REST"
  - source: "Core Domain Services"
    destination: "Logging & APM"
    description: "Sends telemetry and logs"
    technology: "HTTPS"