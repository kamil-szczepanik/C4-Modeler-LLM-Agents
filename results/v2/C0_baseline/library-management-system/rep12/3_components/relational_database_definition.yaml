level: component
scope: "Component diagram for the Relational Database container"
parentContainer:
  name: "Relational Database"
elements:
  - type: "component"
    name: "PostgreSQL 16 Primary Storage Engine"
    technology: "PostgreSQL 16"
    description: "Handles ACID-compliant circulation states and financial audit logs via WAL."
  - type: "component"
    name: "Read-Only Replica"
    technology: "PostgreSQL 16"
    description: "Offloads administrative reporting queries from library staff."
  - type: "component"
    name: "Patroni and etcd"
    technology: "Patroni / etcd"
    description: "Manages high availability, multi-zone clustering, and automated failover."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Provides connection pooling at the container boundary."
  - type: "component"
    name: "Barman / pgBackRest"
    technology: "pgBackRest"
    description: "Executes continuous WAL archiving for Point-in-Time Recovery (PITR)."
  - type: "component"
    name: "pgaudit"
    technology: "pgaudit"
    description: "Extension for logging DDL, DML, and privileged actions."
relationships:
  - source: "Core Domain Services"
    destination: "PostgreSQL 16 Primary Storage Engine"
    description: "Executes transactional writes and critical reads using PostgreSQL Protocol over mTLS."
  - source: "Core Domain Services"
    destination: "Read-Only Replica"
    description: "Executes non-blocking analytical reads and reporting queries using PostgreSQL Protocol over mTLS."
  - source: "PostgreSQL 16 Primary Storage Engine"
    destination: "Read-Only Replica"
    description: "Streams replication data using encrypted mTLS connections."