level: component
scope: "Component diagram for the Notification Worker container"
parentContainer:
  name: "Notification Worker"
elements:
  - type: "component"
    name: "Event Consumer Component"
    technology: "AMQP"
    description: "Consumes notification triggers via AMQP with TLS and HMAC signature validation."
  - type: "component"
    name: "Template Engine Component"
    technology: "ICU message syntax"
    description: "Handles multi-language message formatting and templating."
  - type: "component"
    name: "Dispatch Router & Adapter Components"
    technology: "Circuit breaker, mTLS"
    description: "Dispatches alerts externally with resilience patterns and secure transport."
  - type: "component"
    name: "Delivery Status Tracker Component"
    technology: "Node.js / NestJS"
    description: "Tracks and updates the delivery status of dispatched notifications."
  - type: "component"
    name: "Notification Query Service Component"
    technology: "RBAC, tenant isolation"
    description: "Queries aggregated notification histories for staff administration with tenant isolation."
relationships:
  - source: "Async Event Bus"
    destination: "Event Consumer Component"
    description: "Consumes notification triggers via AMQP with TLS and HMAC signature validation"
  - source: "Event Consumer Component"
    destination: "Template Engine Component"
    description: "Passes raw events for message formatting"
  - source: "Template Engine Component"
    destination: "Dispatch Router & Adapter Components"
    description: "Sends formatted messages for routing and delivery"
  - source: "Dispatch Router & Adapter Components"
    destination: "External Notification Service"
    description: "Dispatches alerts via HTTPS using mTLS and short-lived vault credentials"
  - source: "Dispatch Router & Adapter Components"
    destination: "Delivery Status Tracker Component"
    description: "Reports delivery outcomes"
  - source: "Delivery Status Tracker Component"
    destination: "PostgreSQL"
    description: "Records delivery outcomes and metrics"
  - source: "Staff Administration Portal"
    destination: "Notification Query Service Component"
    description: "Queries aggregated notification histories via API Gateway using read-replicas"