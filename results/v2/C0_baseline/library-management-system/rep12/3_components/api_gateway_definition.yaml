level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing Filter / Route Locator"
    technology: "Spring Cloud Gateway"
    description: "Directs traffic and prioritizes low-latency search paths."
  - type: "component"
    name: "JWT Validation Filter"
    technology: "Spring Cloud Gateway Filter"
    description: "Validates tokens locally using cached public keys with Redis-backed revocation blacklisting."
  - type: "component"
    name: "Rate Limiting Filter"
    technology: "Spring Cloud Gateway Filter / Redis"
    description: "Enforces quotas using a distributed Redis cache co-located in the EU."
  - type: "component"
    name: "RBAC Enforcement Filter"
    technology: "Spring Cloud Gateway Filter"
    description: "Evaluates route-level permissions to block unauthorized access."
  - type: "component"
    name: "Tracing Interceptor"
    technology: "Spring Cloud Gateway Interceptor"
    description: "Injects W3C traceparent headers for distributed tracing."
  - type: "component"
    name: "Context Propagation Interceptor"
    technology: "Spring Cloud Gateway Interceptor"
    description: "Propagates X-User-Id and X-User-Roles headers."
relationships:
  - source: "Patron Web Application"
    destination: "API Gateway"
    description: "Sends API requests [HTTPS/REST]"
  - source: "Staff Administration Portal"
    destination: "API Gateway"
    description: "Sends API requests [HTTPS]"
  - source: "API Gateway"
    destination: "Core Domain Services"
    description: "Routes requests and propagates trace headers [mTLS]"
  - source: "API Gateway"
    destination: "Identity Provider / SSO"
    description: "Fetches JWT validation keys [HTTPS/REST]"
  - source: "API Gateway"
    destination: "Redis (EU region)"
    description: "Checks rate limits and token revocation [RESP/TCP]"
  - source: "API Gateway"
    destination: "Logging & APM"
    description: "Exports metrics and traces [OTLP/gRPC]"