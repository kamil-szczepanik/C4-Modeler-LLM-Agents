level: component
scope: "Component diagram for the Search Engine container"
parentContainer:
  name: "Search Engine"
elements:
  - type: "component"
    name: "Query Processing Component"
    technology: "Elasticsearch Analysis & Query DSL, Synonym Token Filter, Aggregation Engine"
    description: "Provides instant, secure catalogue discovery, faceted navigation, and processes search queries with promotional boosting rules."
  - type: "component"
    name: "Indexing & Synchronization Component"
    technology: "AMQP/Kafka Consumer"
    description: "Consumes asynchronous catalogue updates to keep the search index synchronized."
  - type: "component"
    name: "Search Analytics & Logging Component"
    technology: "HTTPS/TLS"
    description: "Flushes search telemetry, zero-result events, and audit logs."
relationships:
  - source: "Core Domain Services"
    destination: "Query Processing Component"
    description: "Delivers search queries, faceted results, and promotional boosting rules [mTLS/REST]"
  - source: "Async Event Bus"
    destination: "Indexing & Synchronization Component"
    description: "Consumes asynchronous catalogue updates [SASL/SCRAM over TLS]"
  - source: "Search Analytics & Logging Component"
    destination: "Logging & APM System"
    description: "Flushes search telemetry, zero-result events, and audit logs [HTTPS/TLS]"