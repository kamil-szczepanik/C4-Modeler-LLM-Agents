level: component
scope: "Component diagram for the Core Domain Services container"
parentContainer:
  name: "Core Domain Services"
elements:
  - type: "component"
    name: "Catalog Component"
    technology: "Node.js / NestJS, TypeScript"
    description: "Manages cataloging items and inventory within the modular monolith."
  - type: "component"
    name: "Circulation Component"
    technology: "Node.js / NestJS, TypeScript"
    description: "Handles item checkout, checkin, renewals, and patron circulation rules."
  - type: "component"
    name: "Billing Component"
    technology: "Node.js / NestJS, TypeScript, Opossum Circuit Breaker"
    description: "Processes fee payments and communicates with the external Payment Gateway."
  - type: "component"
    name: "Search Integration Component"
    technology: "Node.js / NestJS, TypeScript, Elasticsearch"
    description: "Interfaces with the Search Engine to meet high-performance search queries."
  - type: "component"
    name: "Audit & Compliance Component"
    technology: "Node.js / NestJS, TypeScript"
    description: "Ensures strict EU-only data residency and handles telemetry, logs, and audit trails."
relationships:
  - source: "Catalog Component"
    destination: "Relational Database"
    description: "Reads/writes catalog data via [mTLS] and [PgBouncer]"
  - source: "Circulation Component"
    destination: "Relational Database"
    description: "Reads/writes circulation data via [mTLS] and [PgBouncer]"
  - source: "Billing Component"
    destination: "Payment Gateway"
    description: "Processes fee payments via [HTTPS/REST] with [Circuit Breaker]"
  - source: "Search Integration Component"
    destination: "Search Engine"
    description: "Performs high-performance search queries via [mTLS]"
  - source: "Catalog Component"
    destination: "Async Event Bus"
    description: "Publishes domain events via [mTLS]"
  - source: "Circulation Component"
    destination: "Async Event Bus"
    description: "Publishes domain events via [mTLS]"
  - source: "Billing Component"
    destination: "Async Event Bus"
    description: "Publishes domain events via [mTLS]"
  - source: "Audit & Compliance Component"
    destination: "Logging & APM"
    description: "Sends telemetry, logs, and audit trails via [HTTPS]"
  - source: "Core Domain Services"
    destination: "Identity Provider / SSO"
    description: "Authenticates users via [SAML/OIDC]"