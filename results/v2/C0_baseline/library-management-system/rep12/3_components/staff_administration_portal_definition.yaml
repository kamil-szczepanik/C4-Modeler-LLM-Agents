level: component
scope: "Component diagram for the Staff Administration Portal container"
parentContainer:
  name: "Staff Administration Portal"
elements:
  - type: "component"
    name: "Circulation Management Module"
    technology: "Angular / TypeScript, IndexedDB with Web Crypto API (AES-GCM)"
    description: "Handles check-ins, check-outs, and patron account updates with offline resilience."
  - type: "component"
    name: "Administration & Reporting Module"
    technology: "Angular / TypeScript"
    description: "Manages library operations reporting and administrative tasks."
  - type: "component"
    name: "Core State & Auth Service"
    technology: "Angular / TypeScript, OAuth2/OIDC"
    description: "Manages application state, route guards, and OIDC/OAuth2 authentication."
  - type: "component"
    name: "Client-Side Caching & Offline Fallback Service"
    technology: "IndexedDB / Web Crypto API"
    description: "Provides encrypted offline caching for circulation workflows."
  - type: "person"
    name: "Frontline Librarians & Library Administrators"
    technology: "Human"
    description: "Primary users accessing the system with role-based access control."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx / Spring Cloud Gateway"
    description: "Entry point for backend integration communicating via HTTPS/REST and WebSockets."
  - type: "system"
    name: "Identity Provider / SSO"
    technology: "OIDC/OAuth2"
    description: "Manages authentication and issues tokens."
relationships:
  - source: "Frontline Librarians & Library Administrators"
    destination: "Circulation Management Module"
    description: "Accesses via HTTPS"
  - source: "Frontline Librarians & Library Administrators"
    destination: "Administration & Reporting Module"
    description: "Accesses via HTTPS"
  - source: "Circulation Management Module"
    destination: "API Gateway"
    description: "Communicates via HTTPS/REST and WebSockets with circuit breakers and IndexedDB fallback"
  - source: "Administration & Reporting Module"
    destination: "API Gateway"
    description: "Communicates via HTTPS/REST"
  - source: "Core State & Auth Service"
    destination: "Identity Provider / SSO"
    description: "Authenticates via OIDC/OAuth2 over HTTPS"
  - source: "Circulation Management Module"
    destination: "Client-Side Caching & Offline Fallback Service"
    description: "Uses for encrypted offline caching"