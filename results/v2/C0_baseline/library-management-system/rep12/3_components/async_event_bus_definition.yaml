level: component
scope: "Component diagram for the Async Event Bus container"
parentContainer:
  name: "Async Event Bus"
elements:
  - type: "component"
    name: "Event Broker Cluster"
    technology: "Apache Kafka Brokers"
    description: "Managing distributed commit logs for high-throughput event streaming."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry"
    description: "Enforcing Avro/JSON payloads, payload governance, and backward compatibility."
  - type: "component"
    name: "Topic Manager / ACL Enforcer"
    technology: "Custom / Kafka Native"
    description: "Handles topic creation and role-based access control via TLS client certificates."
  - type: "component"
    name: "Kafka Connect"
    technology: "Confluent Kafka Connect"
    description: "Streaming data to external sinks such as the Search Engine."
  - type: "component"
    name: "MirrorMaker 2"
    technology: "Apache Kafka MirrorMaker 2"
    description: "Implements automated cross-AZ mirroring for disaster recovery."
relationships:
  - source: "Event Broker Cluster"
    destination: "Kafka Connect"
    description: "Streams domain changes via TLS"
  - source: "Schema Registry"
    destination: "Event Broker Cluster"
    description: "Provides schema governance and validation for event payloads"