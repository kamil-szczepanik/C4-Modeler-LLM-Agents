level: component
scope: "Component diagram for the Patron Web Application container"
parentContainer:
  name: "Patron Web Application"
elements:
  - type: "component"
    name: "Search & Discovery Component"
    technology: "React / TypeScript"
    description: "Queries catalogue and handles high-frequency search rendering."
  - type: "component"
    name: "Account & Circulation Component"
    technology: "React / TypeScript"
    description: "Manages loans, holds, and state-heavy circulation logic."
  - type: "component"
    name: "Authentication Boundary Component"
    technology: "React / TypeScript / OIDC Client"
    description: "Authenticates patrons and ensures robust in-memory token security."
  - type: "component"
    name: "Digital Checkout & Reader Component"
    technology: "React / TypeScript / PDF.js"
    description: "Streams and renders digital media securely within volatile browser memory."
  - type: "component"
    name: "Notification & Feedback Component"
    technology: "React / TypeScript"
    description: "Receives live alerts and real-time patron notifications."
relationships:
  - source: "Search & Discovery Component"
    destination: "API Gateway"
    description: "Queries catalogue [HTTPS / REST]"
  - source: "Account & Circulation Component"
    destination: "API Gateway"
    description: "Manages loans and holds [HTTPS / REST]"
  - source: "Digital Checkout & Reader Component"
    destination: "API Gateway"
    description: "Streams digital assets [HTTPS / REST]"
  - source: "Notification & Feedback Component"
    destination: "API Gateway"
    description: "Receives live alerts [WebSocket / WSS]"
  - source: "Authentication Boundary Component"
    destination: "Identity Provider"
    description: "Authenticates patrons [HTTPS / OIDC]"