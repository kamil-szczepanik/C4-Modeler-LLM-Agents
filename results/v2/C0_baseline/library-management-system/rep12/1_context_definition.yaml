level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A cloud-hosted SaaS platform designed for public and academic libraries to catalogue physical and digital items, manage circulation, and provide self-service portals with strict EU-only data residency."
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Public or academic library users who access the system via the Self-Service Portal."
  - type: "person"
    name: "Library Staff"
    description: "Circulation staff and administrators who manage the system via the Admin/Staff Portal."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system used to charge fees."
  - type: "externalSystem"
    name: "Identity Provider / SSO"
    description: "External system used for authentication and federated academic SSO."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External system used to send alerts."
  - type: "externalSystem"
    name: "Logging & APM"
    description: "External system (Datadog/Prometheus) used for observability and monitoring."
relationships:
  - source: "Library Patrons"
    destination: "Library Management System"
    description: "uses Self-Service Portal"
    technology: "HTTPS"
  - source: "Library Staff"
    destination: "Library Management System"
    description: "manages Admin/Staff Portal"
    technology: "HTTPS"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "charges fees"
    technology: "HTTPS/REST (Async via Message Queue)"
  - source: "Library Management System"
    destination: "Identity Provider / SSO"
    description: "authenticates via"
    technology: "SAML/OIDC"
  - source: "Library Management System"
    destination: "Notification Service"
    description: "sends alerts"
    technology: "HTTPS/REST (Async via Message Queue)"