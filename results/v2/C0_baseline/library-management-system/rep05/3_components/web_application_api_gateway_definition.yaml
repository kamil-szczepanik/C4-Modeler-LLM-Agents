level: component
scope: "Component diagram for the Web Application / API Gateway container"
parentContainer:
  name: "Web Application / API Gateway"
elements:
  - type: "component"
    name: "Next.js SSR Client"
    technology: "Next.js / React / TypeScript"
    description: "Server-side rendering for fast initial loads, SEO, and accessibility (WCAG 2.1 AA)."
  - type: "component"
    name: "API Router & Proxy Middleware"
    technology: "Node.js / Express"
    description: "Scalable API Gateway runtime for routing and middleware execution."
  - type: "component"
    name: "gRPC/REST Client SDKs"
    technology: "gRPC over HTTP/2"
    description: "Low-latency communication for performance-critical catalog searches."
  - type: "component"
    name: "Edge Feature Flag Evaluator"
    technology: "TypeScript / Zod"
    description: "Strict payload sanitization, input validation at the edge, and feature flag evaluation."
  - type: "component"
    name: "Telemetry & Trace Context Injector"
    technology: "OpenTelemetry"
    description: "End-to-end distributed tracing with W3C trace context injection."
relationships:
  - source: "Next.js SSR Client"
    destination: "API Router & Proxy Middleware"
    description: "Routes client requests [HTTPS]"
  - source: "API Router & Proxy Middleware"
    destination: "Edge Feature Flag Evaluator"
    description: "Validates and sanitizes payloads [Zod]"
  - source: "API Router & Proxy Middleware"
    destination: "gRPC/REST Client SDKs"
    description: "Invokes backend services [gRPC over HTTP/2, mTLS]"
  - source: "API Router & Proxy Middleware"
    destination: "Telemetry & Trace Context Injector"
    description: "Injects trace context [OpenTelemetry / W3C Trace Context]"