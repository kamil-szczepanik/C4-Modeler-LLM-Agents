level: component
scope: "Component diagram for the Elasticsearch container"
parentContainer:
  name: "Elasticsearch"
elements:
  - type: "component"
    name: "Query Parsing & Routing Engine"
    technology: "Elasticsearch Internal Module"
    description: "Parses incoming search queries and routes them internally via IPC."
  - type: "component"
    name: "Distributed Inverted Index"
    technology: "Lucene-based Distributed Inverted Index"
    description: "Delivers sub-800ms P99 search latency by indexing and searching catalogue data."
  - type: "component"
    name: "Cluster Coordinator"
    technology: "Elasticsearch Cluster Coordination"
    description: "Manages cluster state, node discovery, and self-healing operations within the EU cloud."
  - type: "component"
    name: "Faceted Aggregation Engine"
    technology: "Elasticsearch Aggregations Module"
    description: "Computes analytic facets and aggregations for search results."
  - type: "component"
    name: "Fuzzy Matcher"
    technology: "Elasticsearch Fuzzy Search"
    description: "Handles approximate string matching and typo-tolerant search queries."
relationships:
  - source: "Query Parsing & Routing Engine"
    destination: "Distributed Inverted Index"
    description: "Routes parsed queries via internal IPC"
  - source: "Query Parsing & Routing Engine"
    destination: "Faceted Aggregation Engine"
    description: "Routes aggregation requests via internal IPC"
  - source: "Query Parsing & Routing Engine"
    destination: "Fuzzy Matcher"
    description: "Routes fuzzy match requests via internal IPC"