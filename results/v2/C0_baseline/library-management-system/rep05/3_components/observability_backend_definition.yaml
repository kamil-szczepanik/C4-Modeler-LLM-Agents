level: component
scope: "Component diagram for the Observability Backend container"
parentContainer:
  name: "Observability Backend"
elements:
  - type: "component"
    name: "OpenTelemetry Collector"
    technology: "Go"
    description: "Standardized, polyglot telemetry collection and built-in edge PII scrubbing."
  - type: "component"
    name: "Time-Series Metrics Database"
    technology: "VictoriaMetrics / Prometheus - C++"
    description: "Efficient, high-cardinality metrics storage supporting R-05 search latency tracking."
  - type: "component"
    name: "Distributed Trace Store"
    technology: "Grafana Tempo - Go"
    description: "Cost-effective, object-storage-backed distributed trace analysis."
  - type: "component"
    name: "Visualization UI & Alerting Engine"
    technology: "Grafana - TypeScript/Go"
    description: "Unified visualization, RBAC dashboarding, and threshold-based alerting."
relationships:
  - source: "Web Application / API Gateway"
    destination: "OpenTelemetry Collector"
    description: "Exports traces/metrics [OTLP/gRPC with mTLS]"
  - source: "OpenTelemetry Collector"
    destination: "Time-Series Metrics Database"
    description: "Writes metrics [Prometheus Remote Write]"
  - source: "OpenTelemetry Collector"
    destination: "Distributed Trace Store"
    description: "Writes spans [OTLP/gRPC]"
  - source: "Visualization UI & Alerting Engine"
    destination: "Time-Series Metrics Database"
    description: "Queries data [PromQL with OIDC RBAC]"
  - source: "Visualization UI & Alerting Engine"
    destination: "Distributed Trace Store"
    description: "Queries data [TraceQL with OIDC RBAC]"
  - source: "Visualization UI & Alerting Engine"
    destination: "External Notification Gateway"
    description: "Dispatches incident alerts [HTTPS/REST with HMAC]"