level: component
scope: "Component diagram for the Circulation Service container"
parentContainer:
  name: "Circulation Service"
elements:
  - type: "component"
    name: "Loan Management Component"
    technology: "Spring Boot Java"
    description: "Enforces lending policies and manages loans, persisting transaction history."
  - type: "component"
    name: "Fine & Fee Component"
    technology: "Spring Boot Java"
    description: "Processes fines and fees via a third-party payment processor."
  - type: "component"
    name: "Policy Engine Component"
    technology: "Spring Boot Java"
    description: "Enforces circulation and lending policies."
  - type: "component"
    name: "Notification Dispatcher Component"
    technology: "Spring Boot Java"
    description: "Dispatches internal domain events and publishes notification-bound events."
  - type: "component"
    name: "PostgreSQL"
    technology: "PostgreSQL"
    description: "Persists transaction history securely within the EU region with AES-256 PII encryption."
  - type: "component"
    name: "Third-Party Payment Processor"
    technology: "HTTPS/REST, OAuth2, mTLS"
    description: "Processes fine payments."
  - type: "component"
    name: "Event Bus"
    technology: "Apache Kafka / RabbitMQ"
    description: "Publishes notification-bound events."
  - type: "component"
    name: "Web Application / API Gateway"
    technology: "gRPC / REST"
    description: "Routes circulation queries and commands."
  - type: "component"
    name: "Observability Backend"
    technology: "OpenTelemetry"
    description: "Exports distributed traces."
relationships:
  - source: "Web Application / API Gateway"
    destination: "Circulation Service"
    description: "Routes circulation queries and commands [gRPC / REST]"
  - source: "Loan Management Component"
    destination: "PostgreSQL"
    description: "Persists transaction history [JDBC, TLS 1.3, EU region]"
  - source: "Fine & Fee Component"
    destination: "Third-Party Payment Processor"
    description: "Processes fine payments [HTTPS/REST, OAuth2, mTLS, Certificate Pinning]"
  - source: "Loan Management Component"
    destination: "Notification Dispatcher Component"
    description: "Dispatches internal domain events [Spring Application Events]"
  - source: "Notification Dispatcher Component"
    destination: "Event Bus"
    description: "Publishes notification-bound events [AMQP / Kafka, mTLS, Application-level Envelope Encryption]"
  - source: "Circulation Service"
    destination: "Observability Backend"
    description: "Exports distributed traces [OpenTelemetry]"