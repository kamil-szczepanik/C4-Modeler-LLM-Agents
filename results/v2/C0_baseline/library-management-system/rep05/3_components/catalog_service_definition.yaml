level: component
scope: "Component diagram for the Catalog Service container"
parentContainer:
  name: "Catalog Service"
elements:
  - type: "component"
    name: "Catalog Controller"
    technology: "Spring Boot Java"
    description: "Handles incoming catalog queries and commands from the API Gateway and delegates digital retrieval requests."
  - type: "component"
    name: "Catalog Management Service"
    technology: "Spring Boot Java"
    description: "Manages catalog metadata business logic, persists to relational storage, and publishes mutation events."
  - type: "component"
    name: "Search & Indexing Engine"
    technology: "Spring Boot Java / Elasticsearch Client"
    description: "Executes low-latency full-text searches against the search engine."
  - type: "component"
    name: "Content Sync Client"
    technology: "Spring Boot Java"
    description: "Synchronizes content data across services."
  - type: "component"
    name: "Digital Access Coordinator"
    technology: "Spring Boot Java"
    description: "Delegates digital retrieval requests and interacts with external digital content providers."
relationships:
  - source: "Catalog Controller"
    destination: "Digital Access Coordinator"
    description: "Delegates digital retrieval requests [gRPC]"
  - source: "Catalog Management Service"
    destination: "PostgreSQL"
    description: "Persists relational catalog metadata [JDBC / Spring Data JPA]"
  - source: "Search & Indexing Engine"
    destination: "Elasticsearch"
    description: "Executes low-latency full-text searches [Elasticsearch REST Client]"
  - source: "Catalog Management Service"
    destination: "Event Bus (Apache Kafka / RabbitMQ)"
    description: "Publishes metadata mutation events via Transactional Outbox Pattern [Spring Kafka / AMQP]"
  - source: "Digital Access Coordinator"
    destination: "Digital Content Providers"
    description: "Requests access tokens and streaming links [HTTPS / OAuth2]"