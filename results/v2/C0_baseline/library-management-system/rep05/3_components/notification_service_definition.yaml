level: component
scope: "Component diagram for the Notification Service container"
parentContainer:
  name: "Notification Service"
elements:
  - type: "component"
    name: "Event Consumer Component"
    technology: "Python FastAPI Container / Background Tasks"
    description: "Consumes domain events asynchronously from the Event Bus."
  - type: "component"
    name: "Template Engine Component"
    technology: "Jinja2"
    description: "Handles localized template rendering within the EU cloud boundary."
  - type: "component"
    name: "Dispatcher Component"
    technology: "Python FastAPI"
    description: "Coordinates message routing and dispatching logic."
  - type: "component"
    name: "Channel Adapters Component"
    technology: "Python / REST / SMTP / HTTPS"
    description: "Adapts messages for delivery through external notification gateways."
  - type: "component"
    name: "Preference Cache Component"
    technology: "Redis"
    description: "Read-optimized preference caching with AOF persistence."
  - type: "component"
    name: "Status Tracker Component"
    technology: "Python FastAPI"
    description: "Tracks delivery statuses and receives webhooks from external gateways."
  - type: "component"
    name: "Internal API Component"
    technology: "Python FastAPI / HTTP / JSON with JWT"
    description: "Exposes endpoints for retrieving notification logs and internal communication."
  - type: "component"
    name: "External Notification Gateway"
    technology: "External Service / REST / SMTP / HTTPS"
    description: "External gateway responsible for final message delivery."
  - type: "component"
    name: "Event Bus"
    technology: "Apache Kafka / RabbitMQ"
    description: "Reliable message transport with Dead-Letter Queues (DLQ)."
relationships:
  - source: "Event Bus"
    destination: "Event Consumer Component"
    description: "Consumes domain events [AMQP / Kafka]"
  - source: "Channel Adapters Component"
    destination: "External Notification Gateway"
    description: "Delivers messages [REST / SMTP / HTTPS]"
  - source: "External Notification Gateway"
    destination: "Status Tracker Component"
    description: "Sends delivery webhooks [HTTPS]"
  - source: "Web Application"
    destination: "Internal API Component"
    description: "Retrieves notification logs [HTTP / JSON with JWT]"
  - source: "Event Bus"
    destination: "Preference Cache Component"
    description: "Syncs user preferences [AMQP / Kafka]"