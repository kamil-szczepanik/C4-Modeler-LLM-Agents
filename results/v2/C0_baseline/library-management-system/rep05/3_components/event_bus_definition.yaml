level: component
scope: "Component diagram for the Event Bus container"
parentContainer:
  name: "Event Bus"
elements:
  - type: "component"
    name: "Broker Engine"
    technology: "Apache Kafka, Strimzi Operator"
    description: "Event-driven decoupling mechanism providing log retention, high throughput, and native stream-processing deployed on Kubernetes."
  - type: "component"
    name: "Schema Registry"
    technology: "Avro, JSON Schema"
    description: "Enforces strict contract validation at the broker boundary over HTTP/TLS."
  - type: "component"
    name: "Topic Partition Manager"
    technology: "Kafka Native Partition Assignment and Replication"
    description: "Manages partition assignment and replication with min. ISR = 2 for reliability."
  - type: "component"
    name: "Dead Letter Queue (DLQ) Handler"
    technology: "Encrypted Restricted Access Storage"
    description: "Captures poisoned messages with encrypted, restricted access."
  - type: "component"
    name: "Event Stream Compaction Engine"
    technology: "Kafka State-Based Topic Management"
    description: "Manages state-based topics and audit trails."
relationships:
  - source: "Catalog Service"
    destination: "Schema Registry"
    description: "Validate event schemas over HTTP/TLS"
  - source: "Circulation Service"
    destination: "Schema Registry"
    description: "Validate event schemas over HTTP/TLS"
  - source: "Producers"
    destination: "Broker Engine"
    description: "Publish events via Kafka protocol over TLS 1.3 with mTLS, SASL/SCRAM-512, and idempotent producers"
  - source: "Broker Engine"
    destination: "Notification Service"
    description: "Push-based consumer delivery using Kafka consumer groups"
  - source: "Broker Engine"
    destination: "OpenTelemetry Backend"
    description: "Export metrics via Prometheus exporters and tracing headers (W3C Trace Context)"