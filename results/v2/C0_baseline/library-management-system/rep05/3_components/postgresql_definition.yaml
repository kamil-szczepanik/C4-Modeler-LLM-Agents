level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "Primary Database Engine"
    technology: "PostgreSQL v15+"
    description: "Primary relational database engine ensuring robust ACID compliance, zero data loss, and transactional integrity."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Prevents connection exhaustion under heavy load from Spring Boot services."
  - type: "component"
    name: "Failover Manager"
    technology: "Patroni"
    description: "Automated high-availability clustering and failover management."
  - type: "component"
    name: "Schema Migration Manager"
    technology: "Flyway / Liquibase"
    description: "Utilized for version-controlled, zero-downtime database schema migrations."
  - type: "component"
    name: "Audit Logger"
    technology: "pgaudit"
    description: "Enabled for comprehensive DDL, DCL, and data access logging to achieve audit readiness."
relationships:
  - source: "Connection Pooler"
    destination: "Primary Database Engine"
    description: "Routes encrypted database connections via local UNIX domain sockets or loopback TCP with strict RBAC."
  - type: "Failover Manager"
    destination: "Primary Database Engine"
    description: "Manages automated primary-replica failover."
  - type: "Schema Migration Manager"
    destination: "Primary Database Engine"
    description: "Applies version-controlled database schema migrations."
  - type: "Audit Logger"
    destination: "Primary Database Engine"
    description: "Logs DDL, DCL, and data access events."