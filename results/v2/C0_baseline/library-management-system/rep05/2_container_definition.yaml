level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patron & Library Staff"
    description: "Users who interact with the system to catalogue items, manage circulation, and use self-service portals."
  - type: "externalSystem"
    name: "External Identity Provider"
    description: "Handles delegated authentication and tiered identity federation using OAuth2/OIDC."
  - type: "externalSystem"
    name: "Digital Content Providers"
    description: "Provide digital content via REST APIs."
  - type: "externalSystem"
    name: "Third-Party Payment Processor"
    description: "Processes payments securely."
  - type: "externalSystem"
    name: "External Notification Gateway"
    description: "Handles communications via SMTP/Push API and Webhooks."
  - type: "externalSystem"
    name: "EU-certified Cloud Provider Infrastructure"
    description: "Provides EU-hosted cloud region infrastructure enforcing strict data residency constraints."
  - type: "container"
    name: "Web Application / API Gateway"
    technology: "Next.js / Node.js TypeScript"
    description: "Fast, scalable API gateway and client entry point."
  - type: "container"
    name: "Catalog Service"
    technology: "Spring Boot Java"
    description: "Robust enterprise service for catalog management."
  - type: "container"
    name: "Circulation Service"
    technology: "Spring Boot Java"
    description: "Robust enterprise service for circulation management."
  - type: "container"
    name: "Notification Service"
    technology: "Python FastAPI"
    description: "Lightweight service for notification handling."
  - type: "container"
    name: "PostgreSQL"
    technology: "PostgreSQL"
    description: "Primary relational database for persistent storage."
  - type: "container"
    name: "Elasticsearch"
    technology: "Elasticsearch"
    description: "Search engine enabling sub-800ms search capability."
  - type: "container"
    name: "Event Bus"
    technology: "Apache Kafka / RabbitMQ"
    description: "Event-driven decoupling and asynchronous processing with Dead Letter Queues."
  - type: "container"
    name: "Observability Backend"
    technology: "OpenTelemetry"
    description: "Polyglot distributed tracing and observability backend."
relationships:
  - source: "Library Patron & Library Staff"
    destination: "Web Application / API Gateway"
    description: "Accesses self-service portals and system features"
    technology: "HTTPS (TLS 1.3, OAuth2/OIDC)"
  - source: "Web Application / API Gateway"
    destination: "Catalog Service"
    description: "Routes catalog queries and commands"
    technology: "gRPC / REST"
  - source: "Web Application / API Gateway"
    destination: "Circulation Service"
    description: "Routes circulation queries and commands"
    technology: "gRPC / REST"
  - source: "Catalog Service"
    destination: "Digital Content Providers"
    description: "Retrieves digital content"
    technology: "HTTPS"
  - source: "Circulation Service"
    destination: "Event Bus"
    description: "Publishes circulation events"
    technology: "AMQP / Kafka (mTLS, Payload Encryption)"
  - source: "Event Bus"
    destination: "Notification Service"
    description: "Consumes events to trigger notifications"
    technology: "AMQP / Kafka"
  - source: "Event Bus"
    destination: "Circulation Service"
    description: "Consumes asynchronous events"
    technology: "AMQP / Kafka"
  - source: "Web Application / API Gateway"
    destination: "Observability Backend"
    description: "Sends telemetry and trace data"
    technology: "OpenTelemetry"