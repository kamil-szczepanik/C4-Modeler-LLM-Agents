level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A comprehensive digital solution for public and academic libraries designed to catalogue items, manage circulation, and provide self-service portals with strict EU-only data residency."
elements:
  - type: "person"
    name: "Library Patron & Library Staff"
    description: "Users who interact with the system to catalogue items, manage circulation, and use self-service portals."
  - type: "externalSystem"
    name: "External Identity Provider"
    description: "Handles delegated authentication and tiered identity federation using OAuth2/OIDC."
  - type: "externalSystem"
    name: "Digital Content Providers"
    description: "Provide digital content via REST APIs."
  - type: "externalSystem"
    name: "Third-Party Payment Processor"
    description: "Processes payments securely."
  - type: "externalSystem"
    name: "External Notification Gateway"
    description: "Handles communications via SMTP/Push API and Webhooks."
  - type: "externalSystem"
    name: "EU-certified Cloud Provider Infrastructure"
    description: "Provides EU-hosted cloud region infrastructure enforcing strict data residency constraints."
relationships:
  - source: "Library Patron & Library Staff"
    destination: "Library Management System"
    description: "Interacts with the system for cataloguing, circulation, and self-service portals"
    technology: "HTTPS / TLS 1.3"
  - source: "Library Management System"
    destination: "External Identity Provider"
    description: "Integrates for delegated authentication and identity federation"
    technology: "OAuth 2.0 / OIDC"
  - source: "Library Management System"
    destination: "Digital Content Providers"
    description: "Calls for digital content integration"
    technology: "REST APIs"
  - source: "Library Management System"
    destination: "Third-Party Payment Processor"
    description: "Connects to process payments securely"
    technology: "HTTPS"
  - source: "Library Management System"
    destination: "External Notification Gateway"
    description: "Communicates to send notifications"
    technology: "REST / Webhooks"