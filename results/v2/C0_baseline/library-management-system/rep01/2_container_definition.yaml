level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "End-users accessing self-service portals."
  - type: "person"
    name: "Librarians"
    description: "Internal users managing inventory and circulation."
  - type: "person"
    name: "Library Administrators"
    description: "Internal users handling system reporting and oversight."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External EU-hosted Identity Provider for authentication."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processor for fees and fines."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External notification service for notices."
  - type: "externalSystem"
    name: "Observability Platform"
    description: "External observability platform for metrics and traces."
  - type: "container"
    name: "Frontend Container"
    technology: "React, TypeScript, EU CDN"
    description: "Single Page Application hosted on an EU CDN for responsive self-service and administrative UIs."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx, Kong"
    description: "Reverse proxy managing ingress, rate-limiting, and JWT validation."
  - type: "container"
    name: "Catalog & Search Service"
    technology: "Node.js, Go, Elasticsearch"
    description: "Core container handling catalogue and high-performance search."
  - type: "container"
    name: "Circulation & Core Service"
    technology: "Java, Spring Boot, PostgreSQL"
    description: "Core container handling circulation workflows and transactional integrity."
  - type: "container"
    name: "Notification Dispatcher"
    technology: "Python, FastAPI, RabbitMQ/Kafka"
    description: "Core container for asynchronous message distribution and dispatching."
  - type: "container"
    name: "Audit Logging Container"
    technology: "Node.js"
    description: "Core container handling audit logging and compliance."
relationships:
  - source: "Library Patrons"
    destination: "Frontend Container"
    description: "Accesses self-service portal"
    technology: "HTTPS over TLS 1.3"
  - source: "Librarians"
    destination: "Frontend Container"
    description: "Accesses management UI"
    technology: "HTTPS over TLS 1.3"
  - source: "Library Administrators"
    destination: "Frontend Container"
    description: "Accesses administrative UI"
    technology: "HTTPS over TLS 1.3"
  - source: "Frontend Container"
    destination: "API Gateway"
    description: "Sends requests to backend services"
    technology: "HTTPS / REST APIs"
  - source: "API Gateway"
    destination: "Catalog & Search Service"
    description: "Routes search and catalog queries"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Circulation & Core Service"
    description: "Routes circulation and transactional operations"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Notification Dispatcher"
    description: "Routes notification tasks"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Audit Logging Container"
    description: "Routes audit logs"
    technology: "gRPC over mTLS"
  - source: "Notification Dispatcher"
    destination: "Notification Service"
    description: "Dispatches notifications asynchronously"
    technology: "TLS-secured AMQP/MQTT"
  - source: "Catalog & Search Service"
    destination: "Identity Provider"
    description: "Authenticates via IdP"
    technology: "OIDC / HTTPS"
  - source: "Circulation & Core Service"
    destination: "Payment Gateway"
    description: "Processes fees and fines"
    technology: "REST over mTLS (TLS 1.3)"
  - source: "Catalog & Search Service"
    destination: "Observability Platform"
    description: "Streams metrics and traces"
    technology: "OpenTelemetry Protocol (OTLP) over TLS"
  - source: "Circulation & Core Service"
    destination: "Observability Platform"
    description: "Streams metrics and traces"
    technology: "OpenTelemetry Protocol (OTLP) over TLS"
  - source: "Notification Dispatcher"
    destination: "Observability Platform"
    description: "Streams metrics and traces"
    technology: "OpenTelemetry Protocol (OTLP) over TLS"
  - source: "Audit Logging Container"
    destination: "Observability Platform"
    description: "Streams metrics and traces"
    technology: "OpenTelemetry Protocol (OTLP) over TLS"