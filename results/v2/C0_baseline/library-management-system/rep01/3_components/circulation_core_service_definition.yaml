level: component
scope: "Component diagram for the Circulation & Core Service container"
parentContainer:
  name: "Circulation & Core Service"
elements:
  - type: "component"
    name: "Circulation Engine Component"
    technology: "Java, Spring Boot"
    description: "Manages checkouts, renewals, and holds."
  - type: "component"
    name: "Fine & Fee Manager Component"
    technology: "Java, Spring Boot"
    description: "Handles financial ledgers and payment integrations."
  - type: "component"
    name: "Patron Account Coordinator Component"
    technology: "Java, Spring Boot"
    description: "Manages circulation blocks and account states."
  - type: "component"
    name: "PostgreSQL (EU Instance)"
    technology: "Relational Database"
    description: "EU-hosted relational database with primary-replica streaming."
  - type: "component"
    name: "Payment Gateway"
    technology: "External System"
    description: "External system for processing fines and fees."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Python, FastAPI"
    description: "Notification Dispatcher service via RabbitMQ/Kafka."
  - type: "component"
    name: "Audit Logging Container"
    technology: "Node.js"
    description: "Container for immutable audit trails."
relationships:
  - source: "Circulation Engine Component"
    destination: "PostgreSQL (EU Instance)"
    description: "Persists transactional loan states via JDBC over TLS 1.3 (strict ACID)."
  - source: "Fine & Fee Manager Component"
    destination: "Payment Gateway"
    description: "Processes financial settlements via REST over mTLS (TLS 1.3)."
  - source: "Fine & Fee Manager Component"
    destination: "Notification Dispatcher"
    description: "Publishes asynchronous outbox events via AMQP/Kafka over TLS."
  - source: "Patron Account Coordinator Component"
    destination: "Audit Logging Container"
    description: "Dispatches immutable audit trails via gRPC over mTLS."