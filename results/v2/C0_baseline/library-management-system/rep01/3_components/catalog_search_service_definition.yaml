level: component
scope: "Component diagram for the Catalog & Search Service container"
parentContainer:
  name: "Catalog & Search Service"
elements:
  - type: "component"
    name: "Search API Controller"
    technology: "Go"
    description: "Exposes endpoints for multi-faceted search and discovery workflows."
  - type: "component"
    name: "Indexing Worker"
    technology: "Go"
    description: "Consumes catalog change events to update Elasticsearch indices."
  - type: "component"
    name: "Event Consumer Worker"
    technology: "Go"
    description: "Processes inventory events from the message broker."
  - type: "component"
    name: "Local Availability Cache Component"
    technology: "Go/BigCache"
    description: "Stores real-time branch availability in-memory."
  - type: "component"
    name: "Elasticsearch Cluster"
    technology: "Elasticsearch"
    description: "Backs multi-faceted queries and catalogue metadata storage."
relationships:
  - source: "API Gateway"
    destination: "Search API Controller"
    description: "Routes incoming queries [gRPC over mTLS]."
  - source: "Search API Controller"
    destination: "Elasticsearch Cluster"
    description: "Executes search queries [HTTP/REST over TCP]."
  - source: "Search API Controller"
    destination: "Local Availability Cache Component"
    description: "Performs local status lookups [In-memory lookup, <5ms]."
  - source: "Event Consumer Worker"
    destination: "Local Availability Cache Component"
    description: "Updates inventory states [In-memory write]."
  - source: "Indexing Worker"
    destination: "Elasticsearch Cluster"
    description: "Syncs metadata [HTTP with HMAC/mTLS]."
  - source: "Catalog & Search Service"
    destination: "Observability Platform"
    description: "Streams Prometheus metrics and traces [OTLP over TLS]."