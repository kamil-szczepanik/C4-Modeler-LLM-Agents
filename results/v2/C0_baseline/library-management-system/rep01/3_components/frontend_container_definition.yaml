level: component
scope: "Component diagram for the Frontend Container container"
parentContainer:
  name: "Frontend Container"
elements:
  - type: "component"
    name: "Routing & Auth Module"
    technology: "React Router, OIDC Client"
    description: "Handles navigation and authentication using Authorization Code Flow with PKCE."
  - type: "component"
    name: "Catalog UI Component"
    technology: "React, TypeScript"
    description: "Renders item searches and filtering."
  - type: "component"
    name: "Circulation UI Component"
    technology: "React, TypeScript"
    description: "Manages self-service checkouts, renewals, and admin workflows."
  - type: "component"
    name: "API Client Service"
    technology: "Axios/Fetch wrapper"
    description: "Dispatches backend requests and injects correlation IDs and observability hooks."
relationships:
  - source: "Routing & Auth Module"
    destination: "External Identity Provider"
    description: "Authenticates users [Authorization Code Flow with PKCE, OIDC]"
  - source: "Catalog UI Component"
    destination: "API Client Service"
    description: "Dispatches UI actions [Internal TypeScript calls]"
  - source: "Circulation UI Component"
    destination: "API Client Service"
    description: "Dispatches UI actions [Internal TypeScript calls]"
  - source: "API Client Service"
    destination: "API Gateway"
    description: "Sends backend requests [HTTPS / REST APIs]"
  - source: "Frontend Container"
    destination: "EU CDN"
    description: "Serves static assets [HTTPS, Subresource Integrity (SRI)]"