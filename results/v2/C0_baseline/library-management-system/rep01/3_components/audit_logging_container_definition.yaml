level: component
scope: "Component diagram for the Audit Logging Container container"
parentContainer:
  name: "Audit Logging Container"
elements:
  - type: "component"
    name: "Audit Ingestion API"
    technology: "Express/gRPC"
    description: "Express/gRPC handler with mTLS authentication."
  - type: "component"
    name: "Event Normalizer"
    technology: "TypeScript"
    description: "TypeScript component enforcing cryptographic hash-chaining."
  - type: "component"
    name: "Local Buffer Manager"
    technology: "SQLite with WAL"
    description: "SQLite with Write-Ahead Logging (WAL) on encrypted storage."
  - type: "component"
    name: "Compliance Storage Writer"
    technology: "PostgreSQL/TimescaleDB"
    description: "PostgreSQL/TimescaleDB with write-only roles and TDE."
  - type: "component"
    name: "Compliance Query Service"
    technology: "REST/GraphQL API"
    description: "REST/GraphQL API protected by JWT/OAuth2 RBAC."
  - type: "component"
    name: "Telemetry Exporter"
    technology: "OpenTelemetry SDK"
    description: "OpenTelemetry SDK."
relationships:
  - source: "API Gateway"
    destination: "Audit Ingestion API"
    description: "Ingests audit logs [gRPC over mTLS]"
  - source: "Audit Ingestion API"
    destination: "Event Normalizer"
    description: "Passes raw events [In-memory]"
  - source: "Event Normalizer"
    destination: "Local Buffer Manager"
    description: "Buffers hash-chained events [Local Disk / SQLite WAL over dm-crypt]"
  - source: "Local Buffer Manager"
    destination: "Compliance Storage Writer"
    description: "Flushes batched records [SQL over TLS]"
  - source: "Compliance Storage Writer"
    destination: "PostgreSQL/TimescaleDB"
    description: "Persists immutable records [SQL over TLS with TDE]"
  - source: "Compliance Officers"
    destination: "Compliance Query Service"
    description: "Exports audit trails [HTTPS]"
  - source: "Compliance Query Service"
    destination: "Compliance Storage Writer"
    description: "Reads immutable logs [SQL over TLS]"
  - source: "Telemetry Exporter"
    destination: "Observability Platform"
    description: "Streams traces and metrics [OTLP over TLS]"