level: component
scope: "Component diagram for the Notification Dispatcher container"
parentContainer:
  name: "Notification Dispatcher"
elements:
  - type: "component"
    name: "Ingress Controller"
    technology: "Python, FastAPI"
    description: "Ingests notification tasks routed from the API Gateway."
  - type: "component"
    name: "Preference & Policy Engine"
    technology: "Python, Pydantic"
    description: "Evaluates embedded preferences and validates transient payloads for GDPR compliance."
  - type: "component"
    name: "Template Renderer"
    technology: "Jinja2"
    description: "Renders localized messages with auto-escaping enabled for SSTI prevention."
  - type: "component"
    name: "Dispatch Worker"
    technology: "Celery, Python"
    description: "Manages background tasks for resilient, retry-enabled message delivery and handles DLQ failures."
  - type: "component"
    name: "Message Broker"
    technology: "RabbitMQ / Kafka"
    description: "Features Dead Letter Queues (DLQ) and queue-depth HPA metrics for asynchronous queuing."
  - type: "component"
    name: "Notification Service"
    technology: "External System"
    description: "Receives formatted alerts."
  - type: "component"
    name: "Audit Logging Container"
    technology: "External System"
    description: "Receives unrecoverable DLQ failures."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Secures and dynamically retrieves API keys and mTLS certificates."
relationships:
  - source: "API Gateway"
    destination: "Ingress Controller"
    description: "Routes notification tasks [gRPC over mTLS]"
  - source: "Ingress Controller"
    destination: "Preference & Policy Engine"
    description: "Passes validated tasks [Internal Async]"
  - source: "Dispatch Worker"
    destination: "Notification Service"
    description: "Forwards formatted alerts [TLS-secured AMQP]"
  - source: "Dispatch Worker"
    destination: "Audit Logging Container"
    description: "Forwards unrecoverable DLQ failures [Async via RabbitMQ]"
  - source: "Dispatch Worker"
    destination: "HashiCorp Vault"
    description: "Retrieves API keys and mTLS certificates [REST/HTTPS]"