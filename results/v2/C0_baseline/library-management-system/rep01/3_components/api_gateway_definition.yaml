level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "WAF & Threat Protection"
    technology: "Coraza / ModSecurity plugin with OWASP Core Rule Set"
    description: "Enforces injection defense and sanitizes incoming payloads."
  - type: "component"
    name: "JWT Validator"
    technology: "Kong / Nginx Lua plugin"
    description: "Validates token signatures against the External Identity Provider via OIDC."
  - type: "component"
    name: "Access Control (ACL)"
    technology: "Kong / Nginx Lua plugin"
    description: "Enforces security boundaries and user authorization."
  - type: "component"
    name: "Rate Limiting"
    technology: "Kong / Nginx plugin backed by Redis Cluster"
    description: "Tracks distributed rate-limit counters with sub-5ms latency."
  - type: "component"
    name: "Routing & Load Balancer"
    technology: "Kong / Nginx reverse proxy"
    description: "Routes requests to downstream services using gRPC over mTLS."
relationships:
  - source: "WAF & Threat Protection"
    destination: "JWT Validator"
    description: "Evaluates sanitized payloads"
  - source: "JWT Validator"
    destination: "External Identity Provider"
    description: "Validates token signatures [HTTPS / OIDC]"
  - source: "Rate Limiting"
    destination: "Redis Cluster"
    description: "Tracks distributed rate-limit counters [TCP / RESP over TLS]"
  - source: "Routing & Load Balancer"
    destination: "Catalog & Search Service"
    description: "Routes search queries [gRPC over mTLS]"
  - source: "Routing & Load Balancer"
    destination: "Circulation & Core Service"
    description: "Routes transactions [gRPC over mTLS]"
  - source: "Routing & Load Balancer"
    destination: "Observability Platform"
    description: "Streams logs and distributed traces [Fluentbit / W3C Trace Context]"