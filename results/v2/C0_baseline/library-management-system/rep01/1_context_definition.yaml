level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A cloud-native platform for public and academic libraries to catalogue physical and digital items, manage circulation, and provide self-service portals while enforcing strict EU data residency."
elements:
  - type: "person"
    name: "Library Patrons"
    description: "End-users accessing self-service portals."
  - type: "person"
    name: "Librarians"
    description: "Internal users managing inventory and circulation."
  - type: "person"
    name: "Library Administrators"
    description: "Internal users handling system reporting and oversight."
  - type: "externalSystem"
    name: "External Identity Provider"
    description: "EU-hosted IdP for authentication."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "EU region payment processor for fees and fines."
  - type: "externalSystem"
    name: "Notification Service"
    description: "EU instance for loan reminders and notices."
  - type: "externalSystem"
    name: "Observability Platform"
    description: "EU-hosted telemetry and monitoring system."
relationships:
  - source: "Library Patrons"
    destination: "Library Management System"
    description: "Interacts with self-service portals"
    technology: "HTTPS (TLS 1.3)"
  - source: "Librarians"
    destination: "Library Management System"
    description: "Manages inventory and circulation"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Administrators"
    destination: "Library Management System"
    description: "Handles system reporting and oversight"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Management System"
    destination: "External Identity Provider"
    description: "Authenticates users"
    technology: "OpenID Connect (OIDC)"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Integrates for processing fees and fines"
    technology: "REST over mTLS (TLS 1.3)"
  - source: "Library Management System"
    destination: "Notification Service"
    description: "Integrates for loan reminders and notices"
    technology: "REST over mTLS (TLS 1.3)"
  - source: "Library Management System"
    destination: "Observability Platform"
    description: "Forwards telemetry and monitoring data"
    technology: "OpenTelemetry Protocol (OTLP) over TLS"