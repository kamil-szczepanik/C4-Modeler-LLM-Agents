level: component
scope: "Component diagram for the Patron Web App & API container"
parentContainer:
  name: "Patron Web App & API"
elements:
  - type: "component"
    name: "Patron UI Component"
    technology: "Next.js SSR/React"
    description: "Powers SSR and frontend UI components for optimal performance and frictionless user experiences."
  - type: "component"
    name: "Patron API Controller"
    technology: "Node.js/Express"
    description: "Handles backend API logic, request validation, and orchestrates requests."
  - type: "component"
    name: "Patron Profile & Preferences Component"
    technology: "TypeScript/React Hook Form"
    description: "Manages patron profiles and preferences with type safety."
  - type: "component"
    name: "Payment Client"
    technology: "TypeScript SDK/HTTPS"
    description: "Isolates payment processing to reduce PCI-DSS security scope and communicate with the external payment gateway."
  - type: "component"
    name: "Notification Event Publisher"
    technology: "Node.js Kafka Client"
    description: "Streams asynchronous notification events to decouple tasks from real-time patron actions."
  - type: "component"
    name: "Database Client"
    technology: "Prisma/TypeORM"
    description: "Manages secure database queries ensuring data residency compliance."
  - type: "container"
    name: "API Gateway"
    technology: "Kong/Envoy"
    description: "Routes traffic via gRPC over mTLS."
  - type: "container"
    name: "Search Engine"
    technology: "Managed OpenSearch/Elasticsearch, EU-hosted"
    description: "Queries catalog data to meet high-performance search requirements."
  - type: "container"
    name: "Database"
    technology: "Managed PostgreSQL, EU-hosted, AES-256 encrypted"
    description: "Provides encrypted, EU-resident persistence."
  - type: "container"
    name: "Integration/Messaging Container"
    technology: "Managed Apache Kafka / Amazon MQ, EU-hosted"
    description: "Handles asynchronous messaging and event streaming."
  - type: "system"
    name: "External Payment Gateway"
    technology: "External Service"
    description: "Processes payments securely."
  - type: "system"
    name: "External Identity Provider (IdP)"
    technology: "OIDC / OAuth 2.0"
    description: "Handles user authentication."
relationships:
  - source: "API Gateway"
    destination: "Patron Web App & API"
    description: "Routes traffic via gRPC over mTLS"
  - source: "Patron UI Component"
    destination: "Patron API Controller"
    description: "Internal HTTP/RPC"
  - source: "Patron Profile & Preferences Component"
    destination: "Patron API Controller"
    description: "Internal HTTP/RPC"
  - source: "Patron API Controller"
    destination: "Payment Client"
    description: "Delegates payment processing"
  - source: "Payment Client"
    destination: "External Payment Gateway"
    description: "Processes payments via HTTPS/REST"
  - source: "Patron API Controller"
    destination: "Notification Event Publisher"
    description: "Publishes notification events"
  - source: "Notification Event Publisher"
    destination: "Integration/Messaging Container"
    description: "Streams events via Kafka Protocol over TLS"
  - source: "Patron API Controller"
    destination: "Database Client"
    description: "Executes data queries"
  - source: "Database Client"
    destination: "Database"
    description: "Reads/writes data via PostgreSQL Protocol over TLS 1.3"
  - source: "Patron Web App & API"
    destination: "Search Engine"
    description: "Queries catalog via HTTPS/REST"
  - source: "Patron Web App & API"
    destination: "External Identity Provider (IdP)"
    description: "Authenticates via OIDC / OAuth 2.0"