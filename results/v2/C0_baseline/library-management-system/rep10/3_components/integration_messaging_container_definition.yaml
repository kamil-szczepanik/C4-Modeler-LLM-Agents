level: component
scope: "Component diagram for the Integration/Messaging Container container"
parentContainer:
  name: "Integration/Messaging Container"
elements:
  - type: "component"
    name: "circulation.events"
    technology: "Apache Kafka Topic"
    description: "Handles asynchronous circulation events for the library system."
  - type: "component"
    name: "catalog.events"
    technology: "Apache Kafka Topic"
    description: "Handles asynchronous catalog update events."
  - type: "component"
    name: "circulation.dlq"
    technology: "Apache Kafka Dead-Letter Queue"
    description: "Captures failed circulation events for manual resolution and troubleshooting."
relationships:
  - source: "Staff Management API"
    destination: "circulation.events"
    description: "Produces domain events [Kafka TCP binary protocol, mTLS, SASL/SCRAM-512]"
  - source: "Staff Management API"
    destination: "catalog.events"
    description: "Produces domain events [Kafka TCP binary protocol, mTLS, SASL/SCRAM-512]"
  - source: "circulation.events"
    destination: "Notification Dispatcher"
    description: "Consumes notification events [Kafka Consumer Group, TCP, mTLS]"
  - source: "catalog.events"
    destination: "Search Engine"
    description: "Feeds catalogue updates [Kafka Connect Sink connector, TCP]"
  - source: "circulation.dlq"
    destination: "Staff Management API"
    description: "Exposes manual resolution interface [HTTP REST]"