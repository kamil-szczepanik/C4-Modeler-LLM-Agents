level: component
scope: "Component diagram for the Staff Management API container"
parentContainer:
  name: "Staff Management API"
elements:
  - type: "component"
    name: "Circulation Controller & Service"
    technology: "Java / Spring Boot"
    description: "Handles loans, fines, and fast-path check-outs."
  - type: "component"
    name: "Catalog Management Service"
    technology: "Java / Spring Boot"
    description: "Manages physical and digital item cataloging and bulk imports."
  - type: "component"
    name: "Payment & ILL Client Adapters"
    technology: "Java / Spring Boot, Resilience4j"
    description: "Encapsulates outbound traffic to external systems and implements circuit breakers."
  - type: "component"
    name: "Data Masking Component"
    technology: "Java / Spring Boot"
    description: "Strips or pseudonymizes patron PII for cross-border transit."
  - type: "component"
    name: "Bulk Processing & Asynchronous Worker Component"
    technology: "Java / Spring Boot, Managed Apache Kafka"
    description: "Offloads heavy tasks to messaging brokers."
  - type: "component"
    name: "API Gateway"
    technology: "gRPC over mTLS"
    description: "External system routing staff traffic to the Staff Management API."
  - type: "component"
    name: "Managed PostgreSQL"
    technology: "PostgreSQL Protocol, Spring Data JPA"
    description: "Stores transactional data with AES-256 encryption hosted exclusively in the EU."
  - type: "component"
    name: "Managed Apache Kafka"
    technology: "AMQP/Kafka protocols"
    description: "Enables asynchronous decoupling for high-throughput bulk catalog operations."
  - type: "component"
    name: "External Payment Gateway"
    technology: "REST/JSON over TLS 1.3"
    description: "Processes library payments."
  - type: "component"
    name: "External Identity Provider (IdP)"
    technology: "OpenID Connect (OIDC) / OAuth 2.0"
    description: "Authenticates staff."
  - type: "component"
    name: "Interlibrary Loan (ILL) Network"
    technology: "HTTPS/REST"
    description: "Performs cross-border searches."
  - type: "component"
    name: "Observability Platform & SIEM"
    technology: "OpenTelemetry / Prometheus over TLS"
    description: "Streams metrics and traces."
relationships:
  - source: "API Gateway"
    destination: "Circulation Controller & Service"
    description: "Routes staff traffic via gRPC over mTLS"
  - source: "Circulation Controller & Service"
    destination: "Managed PostgreSQL"
    description: "Reads and writes transactional data using PostgreSQL Protocol and Spring Data JPA"
  - source: "Catalog Management Service"
    destination: "Managed Apache Kafka"
    description: "Publishes asynchronous events using AMQP/Kafka protocols"
  - source: "Payment & ILL Client Adapters"
    destination: "External Payment Gateway"
    description: "Processes library payments via REST/JSON over TLS 1.3"
  - source: "Circulation Controller & Service"
    destination: "External Identity Provider (IdP)"
    description: "Authenticates staff using OpenID Connect (OIDC) / OAuth 2.0"
  - source: "Payment & ILL Client Adapters"
    destination: "Interlibrary Loan (ILL) Network"
    description: "Performs cross-border searches via HTTPS/REST"
  - source: "Bulk Processing & Asynchronous Worker Component"
    destination: "Observability Platform & SIEM"
    description: "Streams metrics and traces using OpenTelemetry / Prometheus over TLS"
  - source: "Data Masking Component"
    destination: "Payment & ILL Client Adapters"
    description: "Strips or pseudonymizes patron PII for cross-border transit"