level: component
scope: "Component diagram for the Search Engine container"
parentContainer:
  name: "Search Engine"
elements:
  - type: "component"
    name: "Query Parser & Router"
    technology: "Java/Spring"
    description: "Translates REST queries, enforces RBAC, Document-Level Security (DLS), OAuth2/JWT validation, and query sanitization."
  - type: "component"
    name: "Index Management Service"
    technology: "Java"
    description: "Handles bulk indexing, schema updates, zero-downtime index aliasing, and Synonym/Linguistic Analysis pipelines."
  - type: "component"
    name: "Search Storage Node"
    technology: "Managed OpenSearch Cluster, EU-hosted"
    description: "Core index store with AES-256 encryption at rest and automated EU-only geo-redundant snapshots."
  - type: "component"
    name: "Patron Web App & API / Staff Management API"
    technology: "Upstream Client"
    description: "Upstream clients querying the search engine."
  - type: "component"
    name: "Integration/Messaging Container"
    technology: "Managed Apache Kafka"
    description: "Streams catalogue updates."
  - type: "component"
    name: "Observability Platform & SIEM"
    technology: "Observability/SIEM"
    description: "Receives scrubbed query logs, audit trails, and performance metrics."
relationships:
  - source: "Patron Web App & API / Staff Management API"
    destination: "Query Parser & Router"
    description: "Queries catalogue [HTTPS/REST with mTLS and OAuth2/JWT]"
  - source: "Integration/Messaging Container"
    destination: "Index Management Service"
    description: "Consumes catalogue update events [Kafka Protocol]"
  - source: "Query Parser & Router"
    destination: "Search Storage Node"
    description: "Executes search DSL [Transport Protocol over TLS 1.3]"
  - source: "Query Parser & Router"
    destination: "Observability Platform & SIEM"
    description: "Forwards audit logs and slow-query metrics [HTTPS/Syslog]"