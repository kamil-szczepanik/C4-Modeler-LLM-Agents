level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Connection Pooler Component"
    technology: "PgBouncer"
    description: "Manages queries and connection management."
  - type: "component"
    name: "PostgreSQL Database Engine Component"
    technology: "Managed PostgreSQL, AES-256 encrypted, Logical schemas (patron_data, inventory, transactions)"
    description: "Relational storage handling data persistence and proxies authenticated traffic."
  - type: "component"
    name: "Audit Logging & Security Component"
    technology: "PostgreSQL pgcrypto"
    description: "Handles pgcrypto encryption and telemetry."
relationships:
  - source: "Connection Pooler Component"
    destination: "PostgreSQL Database Engine Component"
    description: "Proxies authenticated traffic [TCP/IP]"
  - source: "PostgreSQL Database Engine Component"
    destination: "Observability Platform & SIEM"
    description: "Forwards audit logs and metrics [Syslog/TLS]"