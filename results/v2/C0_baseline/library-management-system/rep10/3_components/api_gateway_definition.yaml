level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "TLS Termination & Routing Plugin Component"
    technology: "Kong/Envoy"
    description: "Handles ingress routing and TLS termination for incoming requests."
  - type: "component"
    name: "Authentication & Authorization Filter Component"
    technology: "Kong/Envoy with Redis-backed token cache"
    description: "Validates tokens via external IdP and uses Redis for local token-caching to reduce dependency and maintain sub-second latency."
  - type: "component"
    name: "Rate Limiting & Throttling Module Component"
    technology: "Kong/Envoy"
    description: "Enforces rate limiting and throttling on incoming traffic."
  - type: "component"
    name: "Analytics & Telemetry Emitter Component"
    technology: "OpenTelemetry (OTel) / Prometheus over TLS"
    description: "Streams telemetry asynchronously to maintain performance SLAs."
relationships:
  - source: "Library Patrons / Staff / Administrators"
    destination: "TLS Termination & Routing Plugin Component"
    description: "Access via [HTTPS/REST]"
  - source: "TLS Termination & Routing Plugin Component"
    destination: "Authentication & Authorization Filter Component"
    description: "Authenticates requests"
  - source: "Authentication & Authorization Filter Component"
    destination: "External Identity Provider (IdP)"
    description: "Validates tokens via [HTTPS]"
  - source: "Authentication & Authorization Filter Component"
    destination: "Rate Limiting & Throttling Module Component"
    description: "Passes authorized traffic"
  - source: "Rate Limiting & Throttling Module Component"
    destination: "Patron Web App & API"
    description: "Routes traffic via [gRPC over mTLS]"
  - source: "Rate Limiting & Throttling Module Component"
    destination: "Staff Management API"
    description: "Routes traffic via [gRPC over mTLS]"
  - source: "Analytics & Telemetry Emitter Component"
    destination: "Observability Platform & SIEM"
    description: "Streams telemetry via [OpenTelemetry (OTel) / Prometheus over TLS]"