level: component
scope: "Component diagram for the Notification Dispatcher container"
parentContainer:
  name: "Notification Dispatcher"
elements:
  - type: "component"
    name: "Event Consumer Worker"
    technology: "Go, segmentio/kafka-go"
    description: "Consumes events via Kafka Protocol with SASL/SCRAM-512 & mTLS."
  - type: "component"
    name: "Notification Router & Template Engine"
    technology: "Go, in-process logic"
    description: "Routes payloads via in-process Go function calls."
  - type: "component"
    name: "DLQ Handler / Retry Interceptor"
    technology: "Go middleware"
    description: "Routes poisoned messages to Kafka DLQ Topic with PII sanitization."
  - type: "component"
    name: "Dispatch Client"
    technology: "Go, net/http with gofeature/gobreaker"
    description: "Dispatches alerts via REST/JSON over TLS 1.3 with certificate pinning."
  - type: "component"
    name: "Telemetry Exporter"
    technology: "Go, OpenTelemetry Go SDK"
    description: "Streams metrics via OpenTelemetry (OTel) / Prometheus over TLS."
  - type: "component"
    name: "Configuration & Secrets Manager Client"
    technology: "Go"
    description: "Manages configuration and secrets for the worker service."
  - type: "component"
    name: "Integration/Messaging Container"
    technology: "Managed Apache Kafka, EU-hosted"
    description: "External messaging container for event-driven messaging."
  - type: "component"
    name: "External Notification Service"
    technology: "External Service"
    description: "Receives dispatched alerts and notifications."
  - type: "component"
    name: "Observability Platform & SIEM"
    technology: "OpenTelemetry / Prometheus"
    description: "Collects telemetry and security information."
relationships:
  - source: "Integration/Messaging Container"
    destination: "Event Consumer Worker"
    description: "Consumes events via Kafka Protocol with SASL/SCRAM-512 & mTLS"
  - source: "Event Consumer Worker"
    destination: "Notification Router & Template Engine"
    description: "Passes events via in-process Go function calls"
  - source: "Notification Router & Template Engine"
    destination: "Dispatch Client"
    description: "Routes payload via in-process calls"
  - source: "Dispatch Client"
    destination: "External Notification Service"
    description: "Dispatches alerts via REST/JSON over TLS 1.3 with certificate pinning"
  - source: "DLQ Handler / Retry Interceptor"
    destination: "Integration/Messaging Container"
    description: "Routes poisoned messages to Kafka DLQ Topic with PII sanitization"
  - source: "Telemetry Exporter"
    destination: "Observability Platform & SIEM"
    description: "Streams metrics via OpenTelemetry (OTel) / Prometheus over TLS"