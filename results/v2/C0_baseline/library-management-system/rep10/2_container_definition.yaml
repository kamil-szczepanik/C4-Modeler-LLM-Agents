# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public citizens who use the self-service portals for catalog searches and library services."
  - type: "person"
    name: "Librarians and Circulation Staff"
    description: "Staff members who manage circulation, cataloging, and day-to-day library operations."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators responsible for managing the system and configuration."
  - type: "externalSystem"
    name: "External Notification Service"
    description: "EU-hosted service for sending notifications to patrons and staff."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "EU-compliant gateway for processing library payments and financial records."
  - type: "externalSystem"
    name: "External Identity Provider (IdP)"
    description: "Handles centralized authentication and OIDC/OAuth 2.0 token issuance."
  - type: "externalSystem"
    name: "Interlibrary Loan (ILL) Network"
    description: "External network used for cross-library catalog searches and loans."
  - type: "externalSystem"
    name: "Observability Platform & SIEM"
    description: "Collects security events, logs, and telemetry data."
  - type: "container"
    name: "API Gateway"
    technology: "Kong/Envoy"
    description: "Handles TLS termination, JWT validation, and rate limiting."
  - type: "container"
    name: "Patron Web App & API"
    technology: "Node.js/Next.js"
    description: "Provides cataloging, circulation, and self-service portals for library patrons."
  - type: "container"
    name: "Staff Management API"
    technology: "Java/Spring Boot"
    description: "Manages circulation, cataloging, and day-to-day library operations for staff."
  - type: "container"
    name: "Search Engine"
    technology: "Managed OpenSearch/Elasticsearch (EU-hosted)"
    description: "Provides sub-800ms catalog and data search performance."
  - type: "container"
    name: "Database"
    technology: "Managed PostgreSQL (EU-hosted, AES-256 encrypted)"
    description: "Persists transactional data with strict EU-only data residency."
  - type: "container"
    name: "Integration/Messaging Container"
    technology: "Managed Apache Kafka / Amazon MQ (EU-hosted)"
    description: "Handles asynchronous decoupling and message brokering."
  - type: "container"
    name: "Notification Dispatcher"
    technology: "Go/Worker service"
    description: "Dispatches notifications to external services asynchronously."
relationships:
  - source: "Library Patrons"
    destination: "API Gateway"
    description: "Accesses self-service portal and catalog searches"
    technology: "HTTPS/REST"
  - source: "Librarians and Circulation Staff"
    destination: "API Gateway"
    description: "Accesses staff management tools"
    technology: "HTTPS/REST"
  - source: "Library Administrators"
    destination: "API Gateway"
    description: "Accesses administration features"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "Patron Web App & API"
    description: "Routes patron traffic via mTLS"
    technology: "gRPC via mTLS"
  - source: "API Gateway"
    destination: "Staff Management API"
    description: "Routes staff traffic via mTLS"
    technology: "gRPC via mTLS"
  - source: "Patron Web App & API"
    destination: "Search Engine"
    description: "Queries library catalog and data"
    technology: "HTTPS/REST"
  - source: "Patron Web App & API"
    destination: "Database"
    description: "Reads and writes patron data"
    technology: "PostgreSQL Protocol"
  - source: "Staff Management API"
    destination: "Database"
    description: "Reads and writes staff and inventory data"
    technology: "PostgreSQL Protocol"
  - source: "Staff Management API"
    destination: "Integration/Messaging Container"
    description: "Publishes asynchronous events"
    technology: "AMQP / Kafka protocol"
  - source: "Integration/Messaging Container"
    destination: "Notification Dispatcher"
    description: "Consumes notification events"
    technology: "AMQP / Kafka protocol"
  - source: "Notification Dispatcher"
    destination: "External Notification Service"
    description: "Dispatches external notifications"
    technology: "REST/JSON over TLS 1.3"
  - source: "Staff Management API"
    destination: "External Payment Gateway"
    description: "Processes library payments"
    technology: "REST/JSON over TLS 1.3"
  - source: "Patron Web App & API"
    destination: "External Identity Provider (IdP)"
    description: "Authenticates users and validates tokens"
    technology: "OpenID Connect (OIDC) / OAuth 2.0"
  - source: "Staff Management API"
    destination: "External Identity Provider (IdP)"
    description: "Authenticates staff and validates tokens"
    technology: "OpenID Connect (OIDC) / OAuth 2.0"
  - source: "Staff Management API"
    destination: "Interlibrary Loan (ILL) Network"
    description: "Performs cross-library searches and loans"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "Observability Platform & SIEM"
    description: "Streams telemetry and metrics"
    technology: "OpenTelemetry (OTel) / Prometheus over TLS"
  - source: "Patron Web App & API"
    destination: "Observability Platform & SIEM"
    description: "Streams telemetry and metrics"
    technology: "OpenTelemetry (OTel) / Prometheus over TLS"
  - source: "Staff Management API"
    destination: "Observability Platform & SIEM"
    description: "Streams telemetry and metrics"
    technology: "OpenTelemetry (OTel) / Prometheus over TLS"
  - source: "Notification Dispatcher"
    destination: "Observability Platform & SIEM"
    description: "Streams telemetry and metrics"
    technology: "OpenTelemetry (OTel) / Prometheus over TLS"