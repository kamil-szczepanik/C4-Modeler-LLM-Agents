level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Provides cataloging, circulation management, and self-service portals for public and academic libraries, ensuring EU-only data residency and strict performance SLAs for patron searches."
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public users accessing self-service portals."
  - type: "person"
    name: "Librarians / Circulation Staff"
    description: "Internal users managing inventory and daily circulation."
  - type: "person"
    name: "Library Administrators"
    description: "Internal users managing reporting and system access."
  - type: "externalSystem"
    name: "Notification Gateway"
    description: "External system for automated overdue and borrowing alerts."
  - type: "externalSystem"
    name: "External ILS / Book Supplier Integration"
    description: "External system for automated catalog updates."
  - type: "externalSystem"
    name: "Reporting & Analytics System"
    description: "Engine for tracking circulation trends and ROI."
  - type: "externalSystem"
    name: "Centralized Logging & SIEM Service"
    description: "Observability service for telemetry and security audits."
relationships:
  - source: "Library Patrons"
    destination: "Library Management System"
    description: "Interact with self-service portals with rate-limiting and MFA."
    technology: "HTTPS over TLS 1.3"
  - source: "Librarians / Circulation Staff"
    destination: "Library Management System"
    description: "Authenticate to manage inventory and daily circulation."
    technology: "Enterprise SSO with RBAC"
  - source: "Library Administrators"
    destination: "Library Management System"
    description: "Authenticate to manage reporting and system access."
    technology: "Enterprise SSO with RBAC"
  - source: "Library Management System"
    destination: "Notification Gateway"
    description: "Dispatches automated digital alerts."
    technology: "API"
  - source: "Library Management System"
    destination: "External ILS / Book Supplier Integration"
    description: "Connects for automated catalog updates with cryptographically signed payloads."
    technology: "Mutual TLS (mTLS) with JWT/HMAC"
  - source: "Library Management System"
    destination: "Reporting & Analytics System"
    description: "Streams asynchronous, pseudonymized operational telemetry and audit logs."
    technology: "Asynchronous Data Pipeline"
  - source: "Library Management System"
    destination: "Centralized Logging & SIEM Service"
    description: "Streams asynchronous operational telemetry and security audit logs."
    technology: "Asynchronous Data Pipeline"