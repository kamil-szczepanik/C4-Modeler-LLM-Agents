level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public users accessing self-service portals."
  - type: "person"
    name: "Librarians / Circulation Staff"
    description: "Internal users managing inventory and daily circulation."
  - type: "person"
    name: "Library Administrators"
    description: "Internal users managing reporting and system access."
  - type: "externalSystem"
    name: "Notification Gateway"
    description: "External system for automated overdue and borrowing alerts."
  - type: "externalSystem"
    name: "External ILS / Book Supplier Integration"
    description: "External system for automated catalog updates."
  - type: "externalSystem"
    name: "Reporting & Analytics System"
    description: "Engine for tracking circulation trends and ROI."
  - type: "externalSystem"
    name: "Centralized Logging & SIEM Service"
    description: "Observability service for telemetry and security audits."
  - type: "container"
    name: "Self-Service Portal"
    technology: "Public Trust Zone / DMZ"
    description: "Provides portal interface for patrons and staff."
  - type: "container"
    name: "API Gateway"
    technology: "OAuth2/OIDC, JWT"
    description: "Manages authentication, authorization, and routing."
  - type: "container"
    name: "Search Container"
    technology: "Elasticsearch / OpenSearch"
    description: "Horizontally scalable search engine for low-latency search."
  - type: "container"
    name: "Audit & Compliance Container"
    technology: "Kubernetes, EU-localized HSM"
    description: "Enforces strict EU data residency and GDPR compliance."
  - type: "container"
    name: "User Analytics & Feedback Container"
    technology: "Kafka / Fluentbit sidecars"
    description: "Ingests telemetry via asynchronous message queues."
relationships:
  - source: "Library Patrons"
    destination: "Self-Service Portal"
    description: "Interact with the self-service portal."
    technology: "HTTPS / TLS 1.3"
  - source: "Librarians / Circulation Staff"
    destination: "Self-Service Portal"
    description: "Interact with the self-service portal."
    technology: "HTTPS / TLS 1.3"
  - source: "Library Administrators"
    destination: "Self-Service Portal"
    description: "Interact with the self-service portal."
    technology: "HTTPS / TLS 1.3"
  - source: "Self-Service Portal"
    destination: "API Gateway"
    description: "Routes requests to core containers."
    technology: "mTLS via SPIFFE/SPIRE"
  - source: "API Gateway"
    destination: "Search Container"
    description: "Routes search requests."
    technology: "mTLS via SPIFFE/SPIRE"
  - source: "API Gateway"
    destination: "Audit & Compliance Container"
    description: "Routes audit requests."
    technology: "mTLS via SPIFFE/SPIRE"
  - source: "API Gateway"
    destination: "User Analytics & Feedback Container"
    description: "Routes analytics requests."
    technology: "mTLS via SPIFFE/SPIRE"
  - source: "Search Container"
    destination: "Search Container"
    description: "Receives data via asynchronous Change-Data-Capture (CDC) pipelines."
    technology: "Asynchronous CDC"
  - source: "User Analytics & Feedback Container"
    destination: "User Analytics & Feedback Container"
    description: "Ingests telemetry via asynchronous message queues."
    technology: "Kafka / Fluentbit sidecars"
  - source: "Library Management System"
    destination: "Notification Gateway"
    description: "Dispatches automated digital alerts."
    technology: "API"
  - source: "Library Management System"
    destination: "External ILS / Book Supplier Integration"
    description: "Connects for automated catalog updates."
    technology: "Mutual TLS (mTLS) with JWT/HMAC"
  - source: "Library Management System"
    destination: "Reporting & Analytics System"
    description: "Streams asynchronous operational telemetry."
    technology: "Asynchronous Data Pipeline"
  - source: "Library Management System"
    destination: "Centralized Logging & SIEM Service"
    description: "Streams asynchronous security audit logs."
    technology: "Asynchronous Data Pipeline"