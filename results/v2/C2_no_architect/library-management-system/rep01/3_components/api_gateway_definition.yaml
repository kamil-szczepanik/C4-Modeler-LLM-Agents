level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "OAuth2/OIDC Token Validator"
    technology: "JWT Processing Engine"
    description: "Handles OAuth2/OIDC token validation and JWT processing for incoming requests."
  - type: "component"
    name: "WAF Input Sanitizer"
    technology: "Security Middleware"
    description: "Performs Web Application Firewall input sanitization and strict CORS/security header enforcement."
  - type: "component"
    name: "OpenAPI Validator & Rate Limiter"
    technology: "API Governance Engine"
    description: "Validates requests against OpenAPI schemas and applies rate limiting to ensure high performance (<800ms p99 search response)."
  - type: "component"
    name: "mTLS Routing Engine"
    technology: "SPIFFE/SPIRE Integration"
    description: "Routes requests securely using mTLS via SPIFFE/SPIRE with W3C Trace Context injection."
relationships:
  - source: "OAuth2/OIDC Token Validator"
    destination: "WAF Input Sanitizer"
    description: "Passes authenticated identity for sanitization"
  - source: "WAF Input Sanitizer"
    destination: "OpenAPI Validator & Rate Limiter"
    description: "Passes sanitized payload for schema validation and rate checking"
  - source: "OpenAPI Validator & Rate Limiter"
    destination: "mTLS Routing Engine"
    description: "Forwards validated requests for secure internal routing"
  - source: "mTLS Routing Engine"
    destination: "Search Container"
    description: "Routes search requests using mTLS via SPIFFE/SPIRE with W3C Trace Context injection"
  - source: "mTLS Routing Engine"
    destination: "Audit & Compliance Container"
    description: "Routes audit requests using mTLS via SPIFFE/SPIRE"
  - source: "mTLS Routing Engine"
    destination: "User Analytics & Feedback Container"
    description: "Routes analytics requests using mTLS via SPIFFE/SPIRE"