level: component
scope: "Component diagram for the Search Container container"
parentContainer:
  name: "Search Container"
elements:
  - type: "component"
    name: "Search Indexer"
    technology: "Elasticsearch / OpenSearch"
    description: "Horizontally scalable search engine for low-latency search (<800 ms R-05 requirement) and asynchronous Change-Data-Capture (CDC) data ingestion."
  - type: "component"
    name: "Search API Handler"
    technology: "OpenSearch REST API / mTLS"
    description: "Receives routed search requests from the API Gateway via mTLS and enforces document-level access controls."
  - type: "component"
    name: "Telemetry Sidecar"
    technology: "Fluentbit"
    description: "Asynchronous sidecar for routing user telemetry and piping metrics/audit logs without impacting disk I/O."
relationships:
  - source: "Search API Handler"
    destination: "Search Indexer"
    description: "Queries and retrieves catalog data"
  - source: "Search Indexer"
    destination: "Telemetry Sidecar"
    description: "Pipes metrics, audit logs, and routes user telemetry"