level: component
scope: "Component diagram for the Self-Service Portal container"
parentContainer:
  name: "Self-Service Portal"
elements:
  - type: "component"
    name: "Web UI and Accessibility Layer"
    technology: "React with WCAG 2.1 AA accessibility standards and axe-core"
    description: "Provides the user interface for library patrons, librarians, and administrators with strict accessibility and client-side error boundaries."
  - type: "component"
    name: "Session and Authentication Handler"
    technology: "OAuth2/OIDC with PKCE, httpOnly/secure/SameSite=Strict cookies"
    description: "Manages user authentication, secure session cookies, and Content Security Policy (CSP) headers."
  - type: "component"
    name: "API Proxy Client"
    technology: "HTTPS / TLS 1.3 with mTLS via SPIFFE/SPIRE"
    description: "Routes authenticated user actions and requests from the portal to the downstream API Gateway."
relationships:
  - source: "Web UI and Accessibility Layer"
    destination: "Session and Authentication Handler"
    description: "Validates session and authenticates user actions"
  - source: "Session and Authentication Handler"
    destination: "API Proxy Client"
    description: "Passes authenticated requests"
  - source: "API Proxy Client"
    destination: "API Gateway"
    description: "Routes requests securely [mTLS via SPIFFE/SPIRE]"