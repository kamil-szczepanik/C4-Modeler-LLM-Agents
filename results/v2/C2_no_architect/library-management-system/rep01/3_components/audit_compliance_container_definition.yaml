level: component
scope: "Component diagram for the Audit & Compliance Container container"
parentContainer:
  name: "Audit & Compliance Container"
elements:
  - type: "component"
    name: "Data Protection Officers (DPOs) / Compliance Auditors"
    technology: "Human / Dashboard UI"
    description: "Primary compliance stakeholders accessing audit logs and reports."
  - type: "component"
    name: "System Administrators"
    technology: "Human / Operations Tooling"
    description: "Operations stakeholders responsible for security forensics and system oversight."
  - type: "component"
    name: "Audit & Compliance Container"
    technology: "Kubernetes Container"
    description: "Core container managing audit ingestion, storage, and reporting."
  - type: "component"
    name: "EU-localized HSM"
    technology: "Hardware Security Module"
    description: "Provides cryptographic log signing and envelope encryption."
  - type: "component"
    name: "WORM Storage"
    technology: "Write-Once-Read-Many Storage"
    description: "Immutable, long-term log retention storage."
  - type: "component"
    name: "API Gateway"
    technology: "mTLS and OAuth2/OIDC"
    description: "Entry point mediating traffic."
  - type: "component"
    name: "Centralized Logging & SIEM Service"
    technology: "External SIEM"
    description: "Receives security and tamper alerts."
  - type: "component"
    name: "LUKS"
    technology: "Linux Unified Key Setup"
    description: "Encrypts local spillover disks for secure asynchronous log buffering during outages."
  - type: "component"
    name: "Prometheus"
    technology: "Monitoring"
    description: "Collects metrics on HSM response times, log ingestion lag, and certificate rotation."
  - type: "component"
    name: "Merkle Tree Structure"
    technology: "Cryptographic Data Structure"
    description: "Cryptographically ensures log tamper-evidence prior to WORM storage streaming."
relationships:
  - source: "API Gateway"
    destination: "Audit & Compliance Container"
    description: "Routes audit requests and compliance queries via mTLS using SPIFFE/SPIRE."
  - source: "Audit & Compliance Container"
    destination: "EU-localized HSM"
    description: "Performs cryptographic log signing and envelope encryption via local cloud region connectivity."
  - source: "Audit & Compliance Container"
    destination: "WORM Storage"
    description: "Streams encrypted, Merkle-tree-structured audit logs for immutable retention."
  - source: "Audit & Compliance Container"
    destination: "Centralized Logging & SIEM Service"
    description: "Sends automated alerts for tampering, queue saturation, or disk exhaustion."