level: component
scope: "Component diagram for the Self-Service Web/Mobile Portal container"
parentContainer:
  name: "Self-Service Web/Mobile Portal"
elements:
  - type: "component"
    name: "Web and Mobile Frontend Assets"
    technology: "EU-hosted CDN, HTML/JS, Subresource Integrity (SRI), Content Security Policy (CSP)"
    description: "Serves patrons and librarians with secure access, robust accessibility, and geo-pinned EU data residency."
  - type: "component"
    name: "Authentication Manager"
    technology: "OAuth2/OIDC with PKCE, HTTP-only Secure SameSite=Strict cookies, Secure Enclaves"
    description: "Handles secure authentication, token management, and session security."
  - type: "component"
    name: "Observability and RUM Agent"
    technology: "Real User Monitoring (RUM)"
    description: "Tracks latency to meet the <800ms non-functional requirement."
relationships:
  - source: "Web and Mobile Frontend Assets"
    destination: "Authentication Manager"
    description: "Authenticates users via [OAuth2/OIDC, PKCE, HTTP-only cookies]"
  - source: "Web and Mobile Frontend Assets"
    destination: "Observability and RUM Agent"
    description: "Reports performance metrics for [<800ms NFR tracking]"