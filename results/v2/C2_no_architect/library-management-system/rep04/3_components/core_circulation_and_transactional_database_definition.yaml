level: component
scope: "Component diagram for the Core Circulation and Transactional Database container"
parentContainer:
  name: "Core Circulation and Transactional Database"
elements:
  - type: "component"
    name: "Transaction Manager"
    technology: "PostgreSQL with Raft/Patroni"
    description: "Handles core circulation transactions and ensures strong consistency."
  - type: "component"
    name: "Change Data Capture Publisher"
    technology: "Debezium"
    description: "Reads from the database write-ahead log (WAL) to publish domain events."
relationships:
  - source: "Transaction Manager"
    destination: "Change Data Capture Publisher"
    description: "Publishes domain events via Write-Ahead Log [Debezium, WAL, JWE]"