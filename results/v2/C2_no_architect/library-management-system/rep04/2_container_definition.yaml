level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons (Members)"
    description: "Access self-service portals to search catalogues and manage loans."
  - type: "person"
    name: "Librarians"
    description: "Utilize circulation and cataloguing tools for inventory management."
  - type: "person"
    name: "Library Administrators"
    description: "Handle reporting and user management."
  - type: "externalSystem"
    name: "Inter-Library Loan (ILL) Partners"
    description: "External library systems for resource sharing."
  - type: "externalSystem"
    name: "Payment Gateway and Notification Service"
    description: "External integration for processing fines and alerts."
  - type: "container"
    name: "Self-Service Web/Mobile Portal"
    technology: "Web/Mobile"
    description: "Allows patrons and staff to interact with the system."
  - type: "container"
    name: "API Gateway"
    technology: "Kubernetes, OAuth2/OIDC, mTLS"
    description: "Routes traffic to backend containers and enforces security."
  - type: "container"
    name: "Core Circulation and Transactional Database"
    technology: "Kubernetes, EU-region clusters"
    description: "Manages core circulation and transactional data."
  - type: "container"
    name: "Read-optimized Search Index"
    technology: "Elasticsearch, EU-hosted"
    description: "Provides high-performance search capabilities."
  - type: "container"
    name: "Admin/Reporting Container"
    technology: "Kubernetes"
    description: "Handles reporting and administrative workloads."
relationships:
  - source: "Library Patrons (Members)"
    destination: "Self-Service Web/Mobile Portal"
    description: "Interacts with the portal"
    technology: "HTTPS (TLS 1.3)"
  - source: "Librarians"
    destination: "Self-Service Web/Mobile Portal"
    description: "Interacts with the portal"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Administrators"
    destination: "Admin/Reporting Container"
    description: "Accesses administrative and reporting tools"
    technology: "HTTPS (TLS 1.3)"
  - source: "Self-Service Web/Mobile Portal"
    destination: "API Gateway"
    description: "Sends requests"
    technology: "HTTPS (TLS 1.3), OAuth2/OIDC"
  - source: "API Gateway"
    destination: "Core Circulation and Transactional Database"
    description: "Routes traffic to core services"
    technology: "mTLS"
  - source: "API Gateway"
    destination: "Read-optimized Search Index"
    description: "Routes search requests"
    technology: "mTLS"
  - source: "API Gateway"
    destination: "Admin/Reporting Container"
    description: "Routes admin requests"
    technology: "mTLS"
  - source: "Core Circulation and Transactional Database"
    destination: "Read-optimized Search Index"
    description: "Queries search index for catalogue searches"
    technology: "Internal Network"
  - source: "API Gateway"
    destination: "Payment Gateway and Notification Service"
    description: "Integrates with external services using egress boundary payload filtering"
    technology: "HTTPS with Egress Filtering"
  - source: "API Gateway"
    destination: "Inter-Library Loan (ILL) Partners"
    description: "Integrates with external ILL partner systems"
    technology: "HTTPS"