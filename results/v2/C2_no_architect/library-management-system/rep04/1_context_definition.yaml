level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Provides cataloguing, circulation, and self-service portals for public and academic libraries while strictly adhering to EU-only data residency constraints for GDPR compliance."
elements:
  - type: "person"
    name: "Library Patrons (Members)"
    description: "Access self-service portals to search catalogues and manage loans."
  - type: "person"
    name: "Librarians / Library Staff"
    description: "Utilize circulation and cataloguing tools for inventory management."
  - type: "person"
    name: "Library Administrators"
    description: "Handle reporting and user management."
  - type: "externalSystem"
    name: "Inter-Library Loan (ILL) Partners"
    description: "External library systems for resource sharing."
  - type: "externalSystem"
    name: "Payment Gateways & Notification Services"
    description: "External SaaS for processing fines and alerts."
relationships:
  - source: "Library Patrons (Members)"
    destination: "Library Management System"
    description: "Accesses self-service portals and searches catalogues"
    technology: "HTTPS with TLS 1.3"
  - source: "Librarians / Library Staff"
    destination: "Library Management System"
    description: "Utilizes circulation and cataloguing tools for inventory management"
    technology: "HTTPS with TLS 1.3"
  - source: "Library Administrators"
    destination: "Library Management System"
    description: "Handles reporting and user management"
    technology: "HTTPS with TLS 1.3"
  - source: "Library Management System"
    destination: "Inter-Library Loan (ILL) Partners"
    description: "Integrates for resource sharing"
    technology: "NCIP/ISO 18626 APIs using mTLS"
  - source: "Library Management System"
    destination: "Payment Gateways & Notification Services"
    description: "Communicates for processing fines and alerts"
    technology: "Secure webhooks protected by mTLS"