level: component
scope: "Component diagram for the Analytics/Reporting Container container"
parentContainer:
  name: "Analytics/Reporting Container"
elements:
  - type: "component"
    name: "Event Ingestion Engine"
    technology: "Kubernetes, OpenTelemetry"
    description: "Ingests and processes asynchronous analytics events streamed from the message broker under EU data residency constraints."
  - type: "component"
    name: "Aggregation and Reporting Service"
    technology: "OpenTelemetry, ClickHouse / PostgreSQL"
    description: "Processes batch workloads, isolates heavy reporting tasks, and protects real-time search performance."
  - type: "component"
    name: "Dashboard and Export Controller"
    technology: "HTTPS, JWT-based RBAC, mTLS"
    description: "Delivers customized dashboards, scheduled reports, and exports aggregated data via webhooks."
relationships:
  - source: "Event Ingestion Engine"
    destination: "Aggregation and Reporting Service"
    description: "Persists and processes events [ClickHouse / PostgreSQL read-replica]"
  - source: "Aggregation and Reporting Service"
    destination: "Dashboard and Export Controller"
    description: "Supplies aggregated data and reports"