# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Circulation Management Container container"
parentContainer:
  name: "Circulation Management Container"
elements:
  # Components within the parent container's boundary
  - type: "component"
    name: "Circulation Logic Engine"
    technology: "Kubernetes-hosted microservice / Java / Spring Boot"
    description: "Executes check-outs, returns, renewals, and loan policy enforcement ensuring high-performance and EU-compliant library operations."
  - type: "component"
    name: "API Gateway"
    technology: "OAuth2/OIDC JWT / Istio mTLS"
    description: "Entry point issuing OAuth2/OIDC JWTs and routing external traffic securely."
  - type: "component"
    name: "Catalogue Database & Read-Replica"
    technology: "Multi-zone replicated data store / TLS 1.3"
    description: "Stores and manages items and loans with connection pooling and circuit-breaking."
  - type: "component"
    name: "Message Broker"
    technology: "Kafka / RabbitMQ / TLS 1.3"
    description: "Publishes asynchronous domain events for circulation operations."
  - type: "component"
    name: "Cloud KMS / Vault"
    technology: "AES-256 / Kubernetes Secrets"
    description: "Provides secret management and encryption key services for PII and data-at-rest."
relationships:
  - source: "API Gateway"
    destination: "Circulation Logic Engine"
    description: "Routes validated requests via Istio mTLS."
  - source: "Circulation Logic Engine"
    destination: "Catalogue Database & Read-Replica"
    description: "Executes queries and updates using TLS 1.3 with connection pooling and circuit-breaking."
  - source: "Circulation Logic Engine"
    destination: "Message Broker"
    description: "Publishes asynchronous domain events over TLS 1.3."