level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "OAuth2/OIDC Validator"
    technology: "OAuth2, OIDC, JWT"
    description: "Validates incoming short-lived JWTs for authentication and authorization."
  - type: "component"
    name: "Redis Cache"
    technology: "Redis"
    description: "Provides caching for session and request data to enhance performance."
  - type: "component"
    name: "WAF"
    technology: "Web Application Firewall"
    description: "Ensures perimeter security and protects against malicious traffic."
relationships:
  - source: "OAuth2/OIDC Validator"
    destination: "Redis Cache"
    description: "Checks session and token state"