level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Event Ingestion Engine"
    technology: "Kafka / RabbitMQ, Strimzi operator"
    description: "Handles incoming asynchronous events from the Circulation Management Container using TLS 1.3 and mTLS & SCRAM-SHA-512."
  - type: "component"
    name: "Event Streaming Dispatcher"
    technology: "Kafka / RabbitMQ, 3-broker cluster"
    description: "Streams events securely to the Analytics/Reporting Container with a replication factor of 2."
  - type: "component"
    name: "Dead Letter Queue (DLQ) Handler"
    technology: "Kafka / RabbitMQ DLQ"
    description: "Routes malformed or unprocessable events securely away from the main event stream."
relationships:
  - source: "Event Ingestion Engine"
    destination: "Event Streaming Dispatcher"
    description: "Forwards validated asynchronous events"
  - source: "Event Ingestion Engine"
    destination: "Dead Letter Queue (DLQ) Handler"
    description: "Routes malformed or unprocessable events"