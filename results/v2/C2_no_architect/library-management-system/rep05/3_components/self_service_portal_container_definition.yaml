# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Self-Service Portal Container container"
parentContainer:
  name: "Self-Service Portal Container"
elements:
  - type: "component"
    name: "Discovery Controller"
    technology: "Kubernetes, Istio"
    description: "Handles patron-facing discovery and catalogue search requests."
  - type: "component"
    name: "Account Workflow Manager"
    technology: "Kubernetes, Istio"
    description: "Manages autonomous account workflows and user sessions."
  - type: "component"
    name: "Asset Delivery Handler"
    technology: "CDN, HTTPS"
    description: "Delivers localized static assets to patrons."
relationships:
  - source: "Discovery Controller"
    destination: "Distributed Cache (Redis)"
    description: "Offloads frequent catalogue queries [In-cluster]"
  - source: "Discovery Controller"
    destination: "Read-Replica Data Store"
    description: "Queries catalogue data [TLS 1.3]"
  - source: "Asset Delivery Handler"
    destination: "Content Delivery Network (CDN)"
    description: "Delivers localized static assets [HTTPS]"