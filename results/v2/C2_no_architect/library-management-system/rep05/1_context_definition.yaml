# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Provides self-service portals and circulation management for academic and public libraries, ensuring strict EU-only data residency and high-performance search capabilities."
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public citizens who use self-service portals."
  - type: "person"
    name: "Librarians / Circulation Staff"
    description: "Staff members managing library operations and circulation."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators managing the Library Management System."
  - type: "externalSystem"
    name: "Catalogue Database"
    description: "Transactional and Read Replica database for catalogue data."
  - type: "externalSystem"
    name: "External Institutional BI Tools / Municipal Dashboards"
    description: "External tools and dashboards for institutional analytics."
relationships:
  - source: "Library Patrons"
    destination: "Library Management System"
    description: "Accesses self-service portals"
    technology: "HTTPS (TLS 1.3)"
  - source: "Librarians / Circulation Staff"
    destination: "Library Management System"
    description: "Manages circulation and library operations"
    technology: "OAuth2/OIDC with MFA"
  - source: "Library Administrators"
    destination: "Library Management System"
    description: "Administers the system"
    technology: "OAuth2/OIDC with MFA"
  - source: "Library Management System"
    destination: "Catalogue Database"
    description: "Queries and updates catalogue data"
    technology: "AES-256 encrypted connections"
  - source: "Library Management System"
    destination: "External Institutional BI Tools / Municipal Dashboards"
    description: "Pushes pseudonymized data for analytics"
    technology: "mTLS API push"