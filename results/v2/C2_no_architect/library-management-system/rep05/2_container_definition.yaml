level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public citizens who use self-service portals."
  - type: "person"
    name: "Librarians"
    description: "Staff members managing library operations and circulation."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators managing the Library Management System and analytics."
  - type: "externalSystem"
    name: "Catalogue Database and Read-Replica Data Store"
    description: "Database storing library catalogue data with read-replicas."
  - type: "externalSystem"
    name: "External Institutional BI Tools and Municipal Dashboards"
    description: "External systems receiving aggregated data from analytics."
  - type: "container"
    name: "API Gateway"
    technology: "OAuth2/OIDC, JWT"
    description: "Entry point for authentication, RBAC, and routing."
  - type: "container"
    name: "Self-Service Portal Container"
    technology: "Kubernetes, Istio"
    description: "Provides self-service portals for library patrons."
  - type: "container"
    name: "Circulation Management Container"
    technology: "Kubernetes, Istio"
    description: "Manages circulation and library operations."
  - type: "container"
    name: "Analytics/Reporting Container"
    technology: "Kubernetes, OpenTelemetry"
    description: "Processes asynchronous events and provides aggregated reporting."
  - type: "container"
    name: "Message Broker"
    technology: "Kafka / RabbitMQ"
    description: "Handles asynchronous event ingestion for analytics."
relationships:
  - source: "Library Patrons"
    destination: "API Gateway"
    description: "Interacts with self-service portals"
    technology: "HTTPS via OAuth2/OIDC with short-lived JWTs"
  - source: "Librarians"
    destination: "API Gateway"
    description: "Interacts with circulation management"
    technology: "HTTPS via OAuth2/OIDC with short-lived JWTs"
  - source: "Library Administrators"
    destination: "API Gateway"
    description: "Interacts with system administration and analytics"
    technology: "HTTPS via OAuth2/OIDC with short-lived JWTs"
  - source: "API Gateway"
    destination: "Self-Service Portal Container"
    description: "Routes requests"
    technology: "mTLS via Istio"
  - source: "API Gateway"
    destination: "Circulation Management Container"
    description: "Routes requests"
    technology: "mTLS via Istio"
  - source: "Self-Service Portal Container"
    destination: "Catalogue Database and Read-Replica Data Store"
    description: "Queries and reads catalogue data"
    technology: "TLS 1.3"
  - source: "Circulation Management Container"
    destination: "Catalogue Database and Read-Replica Data Store"
    description: "Queries and updates catalogue data"
    technology: "TLS 1.3"
  - source: "Circulation Management Container"
    destination: "Message Broker"
    description: "Publishes events asynchronously"
    technology: "Kafka / RabbitMQ protocol over TLS 1.3"
  - source: "Message Broker"
    destination: "Analytics/Reporting Container"
    description: "Streams events for analytics"
    technology: "Kafka / RabbitMQ protocol over TLS 1.3"
  - source: "Analytics/Reporting Container"
    destination: "External Institutional BI Tools and Municipal Dashboards"
    description: "Provides aggregated data"
    technology: "HTTPS / TLS 1.3"
  - source: "Analytics/Reporting Container"
    destination: "Library Administrators"
    description: "Provides aggregated reporting data"
    technology: "HTTPS"