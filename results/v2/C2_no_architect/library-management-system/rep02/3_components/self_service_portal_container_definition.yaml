level: component
scope: "Component diagram for the Self-Service Portal Container container"
parentContainer:
  name: "Self-Service Portal Container"
elements:
  - type: "component"
    name: "Catalog Search Component"
    technology: "Kubernetes, Envoy"
    description: "Provides high-performance catalog search capabilities with sub-800ms response times under heavy loads."
  - type: "component"
    name: "Circulation Management Component"
    technology: "Kubernetes"
    description: "Manages book lending, returns, and library patron account operations."
  - type: "component"
    name: "Self-Service Portal Frontend"
    technology: "HTTPS (TLS 1.3)"
    description: "Provides the web interface for library patrons to access cataloging and circulation features."
relationships:
  - source: "Self-Service Portal Frontend"
    destination: "Catalog Search Component"
    description: "Executes catalog searches [Internal API]"
  - source: "Self-Service Portal Frontend"
    destination: "Circulation Management Component"
    description: "Manages checkouts and accounts [Internal API]"