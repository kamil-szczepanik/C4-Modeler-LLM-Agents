level: component
scope: "Component diagram for the Notification Container container"
parentContainer:
  name: "Notification Container"
elements:
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Kubernetes / Asynchronous Consumer"
    description: "Asynchronously consumes messages, handles backpressure, and dispatches alerts to external providers."
  - type: "component"
    name: "Preference Manager"
    technology: "Internal Preference Database / AES-256"
    description: "Manages multi-channel patron and staff preferences with EU-restricted, encrypted storage."
  - type: "component"
    name: "Retry and DLQ Handler"
    technology: "Apache Kafka / AWS SQS"
    description: "Manages retries and dead-letter queues to prevent cascading failures during dispatches."
relationships:
  - source: "Notification Dispatcher"
    destination: "Preference Manager"
    description: "Queries multi-channel notification preferences [Internal secure access]"
  - source: "Notification Dispatcher"
    destination: "Retry and DLQ Handler"
    description: "Routes failed deliveries for retry or dead-letter processing [Kafka/SQS]"