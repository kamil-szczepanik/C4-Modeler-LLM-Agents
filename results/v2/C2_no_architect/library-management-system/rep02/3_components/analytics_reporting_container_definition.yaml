level: component
scope: "Component diagram for the Analytics/Reporting Container container"
parentContainer:
  name: "Analytics/Reporting Container"
elements:
  - type: "component"
    name: "ETL Pipeline Engine"
    technology: "Apache Spark, dbt"
    description: "Executes scheduled off-peak ETL pipelines, data transformations, and pseudonymization for compliance audits."
  - type: "component"
    name: "Reporting API Controller"
    technology: "Kubernetes, OAuth2/OIDC"
    description: "Provides secure, anonymized data access and enforces Role-Based Access Control and Dynamic Row-Level Security."
  - type: "component"
    name: "Export Generation Worker"
    technology: "Apache Kafka / AWS SQS"
    description: "Decouples asynchronous export generation and message queuing for circulation insights."
relationships:
  - source: "Reporting API Controller"
    destination: "ETL Pipeline Engine"
    description: "Queries analytical data asynchronously"
  - source: "Export Generation Worker"
    destination: "Reporting API Controller"
    description: "Processes queued export tasks"