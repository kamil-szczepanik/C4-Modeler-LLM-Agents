# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public members who use the self-service portals."
  - type: "person"
    name: "Librarians"
    description: "Staff members who manage circulation and day-to-day library operations via the staff dashboard."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators responsible for system configuration and management."
  - type: "externalSystem"
    name: "External Identity Provider (SSO)"
    description: "External authentication service providing SSO capabilities."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "External service processing financial transactions and payments."
  - type: "externalSystem"
    name: "Interlibrary Loan (ILL) Network"
    description: "External network connecting libraries for resource sharing."
  - type: "externalSystem"
    name: "External SMS/Email Providers"
    description: "External communication services for sending notifications."
  - type: "container"
    name: "Self-Service Portal Container"
    technology: "Kubernetes, EU-hosted"
    description: "Provides cataloging, circulation management, and self-service portals for patrons."
  - type: "container"
    name: "Staff Dashboard Container"
    technology: "Kubernetes, EU-hosted"
    description: "Provides staff interfaces for managing circulation and operations."
  - type: "container"
    name: "Notification Container"
    technology: "Kubernetes, Kafka/SQS, EU-hosted"
    description: "Manages notification backpressure and dispatches alerts."
  - type: "container"
    name: "Analytics/Reporting Container"
    technology: "Kubernetes, EU-hosted"
    description: "Handles reporting and analytics processing within data residency boundaries."
relationships:
  - source: "Library Patrons"
    destination: "Self-Service Portal Container"
    description: "Accesses self-service portal features"
    technology: "HTTPS (TLS 1.3)"
  - source: "Librarians"
    destination: "Staff Dashboard Container"
    description: "Manages library operations"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Administrators"
    destination: "Staff Dashboard Container"
    description: "Configures and administers the system"
    technology: "HTTPS (TLS 1.3)"
  - source: "Self-Service Portal Container"
    destination: "External Payment Gateway"
    description: "Processes payments for fines and services"
    technology: "HTTPS"
  - source: "Staff Dashboard Container"
    destination: "External Payment Gateway"
    description: "Processes administrative financial transactions"
    technology: "HTTPS"
  - source: "Self-Service Portal Container"
    destination: "Notification Container"
    description: "Triggers notifications"
    technology: "mTLS (Service Mesh / SPIFFE/SPIRE)"
  - source: "Staff Dashboard Container"
    destination: "Notification Container"
    description: "Triggers notifications"
    technology: "mTLS (Service Mesh / SPIFFE/SPIRE)"
  - source: "Self-Service Portal Container"
    destination: "Analytics/Reporting Container"
    description: "Sends usage data for analytics"
    technology: "mTLS (Service Mesh / SPIFFE/SPIRE)"
  - source: "Notification Container"
    destination: "External SMS/Email Providers"
    description: "Sends messages to patrons and staff"
    technology: "Egress-controlled HTTPS"