level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Provides cataloguing, circulation, and self-service portals for public and academic libraries with strict EU-only data residency and high-performance search capabilities."
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Students and public members who use the self-service portals."
  - type: "person"
    name: "Librarians / Circulation Staff"
    description: "Staff members who manage circulation and day-to-day library operations."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators responsible for system configuration and management."
  - type: "externalSystem"
    name: "External Identity Provider (SSO)"
    description: "External authentication service providing SSO capabilities."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "External service processing financial transactions and payments."
  - type: "externalSystem"
    name: "Interlibrary Loan (ILL) Network"
    description: "External network connecting libraries for resource sharing."
relationships:
  - source: "Library Patrons"
    destination: "Library Management System"
    description: "Interact with self-service portals"
    technology: "HTTPS, TLS 1.3, OAuth 2.0 / OpenID Connect"
  - source: "Librarians / Circulation Staff"
    destination: "Library Management System"
    description: "Manage circulation and system operations"
    technology: "HTTPS, TLS 1.3, OAuth 2.0 / OpenID Connect"
  - source: "Library Administrators"
    destination: "Library Management System"
    description: "Administer the system and configure settings"
    technology: "HTTPS, TLS 1.3, OAuth 2.0 / OpenID Connect"
  - source: "Library Management System"
    destination: "External Identity Provider (SSO)"
    description: "Authenticate users and manage sessions"
    technology: "Automated secrets management within EU perimeter"
  - source: "Library Management System"
    destination: "External Payment Gateway"
    description: "Process payments and financial transactions"
    technology: "Automated secrets management within EU perimeter"
  - source: "Library Management System"
    destination: "Interlibrary Loan (ILL) Network"
    description: "Exchange interlibrary loans and resource sharing data"
    technology: "Mutual TLS (mTLS), API signature validation, circuit breakers"