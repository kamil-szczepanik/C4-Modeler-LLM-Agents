# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Patrons who use the self-service portal to access library services."
  - type: "person"
    name: "Library Staff"
    description: "Staff members who manage circulation and cataloguing tools."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators who manage the system with advanced privileges and MFA."
  - type: "externalSystem"
    name: "External Identity Provider (IdP)"
    description: "External system responsible for user authentication and identity management."
  - type: "externalSystem"
    name: "EU Cloud Infrastructure Boundary"
    description: "EU-hosted cloud providers ensuring EU-only data residency and compliance."
  - type: "externalSystem"
    name: "In-Region APM and Log Aggregation Pipeline"
    description: "In-region telemetry and performance tracking."
  - type: "externalSystem"
    name: "Audit and Compliance Trust Zone"
    description: "Zone featuring compliance controls and automated retention limits."
  - type: "container"
    name: "API Gateway Container"
    technology: "Kubernetes, OAuth2/OIDC, TLS 1.3"
    description: "Manages ingress authentication and routes traffic to internal microservices."
  - type: "container"
    name: "Patron Self-Service Portal Container"
    technology: "Kubernetes, Web Frontend"
    description: "Provides cataloguing and self-service portals for library patrons."
  - type: "container"
    name: "Staff Circulation & Cataloguing Container"
    technology: "Kubernetes, Microservice"
    description: "Provides circulation and cataloguing tools for library staff."
  - type: "container"
    name: "Admin & Reporting Container"
    technology: "Kubernetes, Microservice"
    description: "Manages administrative functions, reporting, and isolated sensitive operations."
  - type: "container"
    name: "Notification Service Container"
    technology: "Kubernetes, Microservice"
    description: "Handles system notifications and messaging for users."
relationships:
  - source: "Library Patrons"
    destination: "API Gateway Container"
    description: "Communicates via HTTPS to access library services"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Staff"
    destination: "API Gateway Container"
    description: "Communicates via HTTPS to access staff tools"
    technology: "HTTPS (TLS 1.3)"
  - source: "Library Administrators"
    destination: "API Gateway Container"
    description: "Communicates via HTTPS to manage administrative tasks"
    technology: "HTTPS (TLS 1.3)"
  - source: "API Gateway Container"
    destination: "External Identity Provider (IdP)"
    description: "Validates OAuth2/OIDC tokens"
    technology: "OAuth2/OIDC"
  - source: "API Gateway Container"
    destination: "Patron Self-Service Portal Container"
    description: "Routes patron requests"
    technology: "mTLS over internal Kubernetes network policies"
  - source: "API Gateway Container"
    destination: "Staff Circulation & Cataloguing Container"
    description: "Routes staff requests"
    technology: "mTLS over internal Kubernetes network policies"
  - source: "API Gateway Container"
    destination: "Admin & Reporting Container"
    description: "Routes administrative requests"
    technology: "mTLS over internal Kubernetes network policies"
  - source: "API Gateway Container"
    destination: "Notification Service Container"
    description: "Triggers notifications"
    technology: "mTLS over internal Kubernetes network policies"
  - source: "Patron Self-Service Portal Container"
    destination: "In-Region APM and Log Aggregation Pipeline"
    description: "Streams encrypted metrics via OpenTelemetry sidecars"
    technology: "OpenTelemetry"
  - source: "Staff Circulation & Cataloguing Container"
    destination: "In-Region APM and Log Aggregation Pipeline"
    description: "Streams encrypted metrics via OpenTelemetry sidecars"
    technology: "OpenTelemetry"
  - source: "Admin & Reporting Container"
    destination: "In-Region APM and Log Aggregation Pipeline"
    description: "Streams encrypted metrics via OpenTelemetry sidecars"
    technology: "OpenTelemetry"
  - source: "Notification Service Container"
    destination: "In-Region APM and Log Aggregation Pipeline"
    description: "Streams encrypted metrics via OpenTelemetry sidecars"
    technology: "OpenTelemetry"