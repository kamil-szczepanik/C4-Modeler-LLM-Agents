level: component
scope: "Component diagram for the Staff Circulation & Cataloguing Container container"
parentContainer:
  name: "Staff Circulation & Cataloguing Container"
elements:
  - type: "component"
    name: "Staff Request Controller"
    technology: "Kubernetes Microservice REST Endpoint"
    description: "Handles and validates staff requests routed via mTLS from the API Gateway, validating signed JWTs for RBAC/ABAC permissions."
  - type: "component"
    name: "Circulation & Cataloguing Engine"
    technology: "Business Logic Service"
    description: "Ensures secure, high-throughput item check-outs, returns, and catalog management meeting the 2-second transaction SLA via connection pooling and read replicas."
  - type: "component"
    name: "Batch Worker Pods"
    technology: "Dedicated Batch Worker Pods"
    description: "Asynchronously decouples and processes bulk MARC/ONIX metadata ingestion."
  - type: "component"
    name: "Telemetry Sidecar"
    technology: "OpenTelemetry Sidecar"
    description: "Streams encrypted metrics to the In-Region APM and Log Aggregation Pipeline."
  - type: "component"
    name: "Audit Event Streamer"
    technology: "Compliance Logging Module"
    description: "Streams immutable audit events for check-outs, returns, and catalog modifications to the Audit and Compliance Trust Zone."
relationships:
  - source: "Staff Request Controller"
    destination: "Circulation & Cataloguing Engine"
    description: "Delegates verified staff circulation and cataloguing operations"
  - source: "Circulation & Cataloguing Engine"
    destination: "Batch Worker Pods"
    description: "Offloads bulk MARC/ONIX metadata ingestion asynchronously"
  - source: "Circulation & Cataloguing Engine"
    destination: "Telemetry Sidecar"
    description: "Sends encrypted performance metrics"
  - source: "Circulation & Cataloguing Engine"
    destination: "Audit Event Streamer"
    description: "Forwards immutable audit trails for check-outs, returns, and modifications"