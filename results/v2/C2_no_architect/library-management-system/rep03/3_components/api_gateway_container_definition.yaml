level: component
scope: "Component diagram for the API Gateway Container container"
parentContainer:
  name: "API Gateway Container"
elements:
  - type: "component"
    name: "Routing and Proxy Engine"
    technology: "Envoy / Istio"
    description: "Routes inbound traffic securely to backend containers using mTLS and Kubernetes network policies."
  - type: "component"
    name: "Authentication and Authorization Handler"
    technology: "OAuth2/OIDC, JWT, TLS 1.3"
    description: "Validates OAuth2/OIDC tokens, fetches JWKS from the external IdP, and performs local JWT validation."
  - type: "component"
    name: "Rate Limiting and Circuit Breaker"
    technology: "Envoy, Redis"
    description: "Enforces distributed rate-limiting tiers within the EU region and manages circuit breaking for resilience."
  - type: "component"
    name: "Telemetry Collector"
    technology: "OpenTelemetry, Asynchronous Sidecar"
    description: "Streams logs and metrics to the in-region APM and log aggregation pipeline."
relationships:
  - source: "Routing and Proxy Engine"
    destination: "Authentication and Authorization Handler"
    description: "Authenticates incoming requests using tokens"
  - source: "Routing and Proxy Engine"
    destination: "Rate Limiting and Circuit Breaker"
    description: "Checks rate limits and enforces thresholds"
  - source: "Routing and Proxy Engine"
    destination: "Patron Self-Service Portal Container"
    description: "Routes traffic securely via mTLS"
  - source: "Routing and Proxy Engine"
    destination: "Staff Circulation & Cataloguing Container"
    description: "Routes traffic securely via mTLS"
  - source: "Routing and Proxy Engine"
    destination: "Admin & Reporting Container"
    description: "Routes traffic securely via mTLS"
  - source: "Routing and Proxy Engine"
    destination: "Notification Service Container"
    description: "Routes traffic securely via mTLS"
  - source: "Routing and Proxy Engine"
    destination: "In-Region APM and Log Aggregation Pipeline"
    description: "Streams logs and OpenTelemetry metrics asynchronously"
  - source: "Authentication and Authorization Handler"
    destination: "External Identity Provider (IdP)"
    description: "Validates OAuth2/OIDC tokens and fetches JWKS"