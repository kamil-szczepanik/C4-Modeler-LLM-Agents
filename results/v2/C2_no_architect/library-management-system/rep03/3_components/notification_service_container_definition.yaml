level: component
scope: "Component diagram for the Notification Service Container container"
parentContainer:
  name: "Notification Service Container"
elements:
  - type: "component"
    name: "Notification Controller"
    technology: "Kubernetes Microservice API Endpoint"
    description: "Receives notification triggers from the API Gateway via mTLS and JWT claims."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Queue-driven Worker with SPIFFE/SPIRE"
    description: "Manages queue-driven horizontal autoscaling and sends external messages to the EU-Hosted Email/SMS Gateway."
  - type: "component"
    name: "Audit and Compliance Logger"
    technology: "OpenTelemetry / Encrypted Transport"
    description: "Emits tamper-evident audit logs and delivery statuses to the Audit and Compliance Trust Zone."
  - type: "component"
    name: "Telemetry & PII Scrubber"
    technology: "OpenTelemetry & W3C Trace Context"
    description: "Streams scrubbed metrics and traces with automated PII masking to the In-Region APM and Log Aggregation Pipeline."
  - type: "component"
    name: "Dead Letter Queue Manager"
    technology: "Encrypted Persistent Volumes"
    description: "Manages the persistent Dead Letter Queue (DLQ) enforcing EU data residency for failed deliveries."
relationships:
  - source: "Notification Controller"
    destination: "Notification Dispatcher"
    description: "Queues notification tasks for bulk processing [Queue-driven HPA]"
  - source: "Notification Dispatcher"
    destination: "Dead Letter Queue Manager"
    description: "Persists failed messages [Encrypted Persistent Volumes]"
  - source: "Notification Dispatcher"
    destination: "Audit and Compliance Logger"
    description: "Sends delivery statuses and audit records [Encrypted network transport]"
  - source: "Notification Dispatcher"
    destination: "Telemetry & PII Scrubber"
    description: "Forwards metrics and traces for scrubbing [OpenTelemetry]"