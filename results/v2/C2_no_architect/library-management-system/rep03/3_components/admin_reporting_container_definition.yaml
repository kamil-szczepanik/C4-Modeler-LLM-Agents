level: component
scope: "Component diagram for the Admin & Reporting Container container"
parentContainer:
  name: "Admin & Reporting Container"
elements:
  - type: "component"
    name: "Admin & Reporting Container"
    technology: "Kubernetes, Microservice"
    description: "Manages administrative functions, reporting, and sensitive analytical workloads within the EU data residency boundary."
  - type: "component"
    name: "Library Administrators"
    technology: "Primary Persona"
    description: "Primary persona interacting with administrative functions."
  - type: "component"
    name: "API Gateway Container"
    technology: "Kubernetes, OAuth2/OIDC, TLS 1.3"
    description: "Routes administrative requests."
  - type: "component"
    name: "In-Region APM and Log Aggregation Pipeline"
    technology: "External System"
    description: "Receives streamed encrypted metrics via OpenTelemetry sidecars."
  - type: "component"
    name: "Audit and Compliance Trust Zone"
    technology: "External System"
    description: "Receives cryptographically signed audit logs."
  - type: "component"
    name: "Ephemeral Object Storage"
    technology: "AWS S3 / compatible object store"
    description: "Stores generated export files using HTTPS with Customer-Managed Keys."
  - type: "component"
    name: "Background Worker Queue"
    technology: "Celery / Temporal workflows"
    description: "Manages asynchronous batch processing for resource-intensive reports and exports."
relationships:
  - source: "API Gateway Container"
    destination: "Admin & Reporting Container"
    description: "Routes administrative requests [mTLS over internal Kubernetes network policies]"
  - source: "Admin & Reporting Container"
    destination: "In-Region APM and Log Aggregation Pipeline"
    description: "Streams encrypted metrics [OpenTelemetry sidecars]"
  - source: "Admin & Reporting Container"
    destination: "Audit and Compliance Trust Zone"
    description: "Streams cryptographically signed audit logs [TLS 1.3]"
  - source: "Admin & Reporting Container"
    destination: "Ephemeral Object Storage"
    description: "Streams generated export files [HTTPS with Customer-Managed Keys]"