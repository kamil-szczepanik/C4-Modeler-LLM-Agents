level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A solution for public and academic libraries to catalogue physical and digital items, manage circulation, and provide self-service portals with strict EU-only data residency and high-performance search capabilities."
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Patrons who use the self-service portal to access library services."
  - type: "person"
    name: "Library Staff"
    description: "Staff members who manage circulation and cataloguing tools."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators who manage the system with advanced privileges and MFA."
  - type: "externalSystem"
    name: "External Identity Provider (IdP)"
    description: "External system responsible for user authentication and identity management."
  - type: "externalSystem"
    name: "EU Cloud Infrastructure Boundary"
    description: "EU-hosted cloud providers (AWS Frankfurt/Ireland) ensuring EU-only data residency and compliance."
  - type: "externalSystem"
    name: "In-Region APM and Log Aggregation Pipeline"
    description: "Prometheus/Grafana or EU-hosted ELK for in-region telemetry and performance tracking."
  - type: "externalSystem"
    name: "Audit and Compliance Trust Zone"
    description: "Zone featuring WORM storage controls and automated retention limits for compliance."
relationships:
  - source: "Library Patrons"
    destination: "Library Management System"
    description: "Accesses self-service portal for library functions"
    technology: "HTTPS (TLS 1.3) and OAuth 2.0 / OIDC"
  - source: "Library Staff"
    destination: "Library Management System"
    description: "Uses circulation and cataloguing tools"
    technology: "TLS 1.3 and OAuth 2.0 / OIDC with MFA"
  - source: "Library Administrators"
    destination: "Library Management System"
    description: "Manages system settings and administrative tasks"
    technology: "TLS 1.3 and OAuth 2.0 / OIDC with MFA"
  - source: "Library Management System"
    destination: "External Identity Provider (IdP)"
    description: "Authenticates users via identity protocols"
    technology: "OAuth 2.0 / OIDC"
  - source: "Library Management System"
    destination: "In-Region APM and Log Aggregation Pipeline"
    description: "Sends system telemetry via encrypted local pipelines"
    technology: "Encrypted local pipelines"
  - source: "Library Management System"
    destination: "Audit and Compliance Trust Zone"
    description: "Enforces audit logs and compliance controls"
    technology: "WORM storage controls"