level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Provides self-service portals and circulation management for public and academic libraries within an EU-only data residency constraint, cataloguing physical and digital items with a 99th-percentile search response under 800ms."
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Library members who access self-service portals."
  - type: "person"
    name: "Librarians/Circulation Staff"
    description: "Staff members who manage circulation and library operations."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators who configure and manage the library management system."
  - type: "externalSystem"
    name: "EU-hosted Identity Provider (IdP)"
    description: "Authenticates users via OpenID Connect (OIDC) with multi-factor authentication (MFA)."
  - type: "externalSystem"
    name: "CDN/WAF Edge Services"
    description: "Provides edge services, TLS 1.3 termination, and perimeter defense."
  - type: "externalSystem"
    name: "Digital Content Vendors / Third-Party E-Resource Providers"
    description: "External providers of digital content integrated via OAuth2 and mTLS."
relationships:
  - source: "Library Patrons"
    destination: "CDN/WAF Edge Services"
    description: "Accesses portals"
    technology: "TLS 1.3"
  - source: "Librarians/Circulation Staff"
    destination: "CDN/WAF Edge Services"
    description: "Accesses portals"
    technology: "TLS 1.3"
  - source: "Library Administrators"
    destination: "CDN/WAF Edge Services"
    description: "Accesses portals"
    technology: "TLS 1.3"
  - source: "CDN/WAF Edge Services"
    destination: "Library Management System"
    description: "Forwards traffic"
    technology: "mutual TLS (mTLS)"
  - source: "Library Management System"
    destination: "EU-hosted Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OpenID Connect (OIDC)"
  - source: "Library Management System"
    destination: "Digital Content Vendors / Third-Party E-Resource Providers"
    description: "Integrates for e-resource access"
    technology: "OAuth2 bearer tokens and mTLS"