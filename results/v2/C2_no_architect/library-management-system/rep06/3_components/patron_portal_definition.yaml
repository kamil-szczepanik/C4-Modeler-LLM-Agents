level: component
scope: "Component diagram for the Patron Portal container"
parentContainer:
  name: "Patron Portal"
elements:
  - type: "component"
    name: "Web Frontend"
    technology: "JavaScript / TypeScript"
    description: "Provides the self-service user interface for library patrons."
  - type: "component"
    name: "Backend Service"
    technology: "Node.js / Java"
    description: "Handles business logic, API orchestration, and routing."
  - type: "component"
    name: "Search Client"
    technology: "REST/TCP Client"
    description: "Queries catalogue search data using CQRS pattern from Elasticsearch."
  - type: "component"
    name: "Auth Handler"
    technology: "OAuth2/OIDC Client"
    description: "Authenticates users via short-lived signed JWTs and manages vendor token exchange."
relationships:
  - source: "Web Frontend"
    destination: "Backend Service"
    description: "Sends user requests"
  - source: "Backend Service"
    destination: "Search Client"
    description: "Executes catalogue queries"
  - source: "Backend Service"
    destination: "Auth Handler"
    description: "Manages authentication and token exchange"