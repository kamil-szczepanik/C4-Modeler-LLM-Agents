level: component
scope: "Component diagram for the PostgreSQL Database (Primary/Read Replica) container"
parentContainer:
  name: "PostgreSQL Database (Primary/Read Replica)"
elements:
  - type: "component"
    name: "Primary Database"
    technology: "PostgreSQL"
    description: "Relational storage for transactional circulation and catalog data, serving writes."
  - type: "component"
    name: "Read Replica"
    technology: "PostgreSQL"
    description: "Read-only replica serving account history and holds queries."
  - type: "component"
    name: "Patroni"
    technology: "Patroni"
    description: "Automated failover manager with synchronous replication."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Connection pooler managing traffic spikes."
  - type: "component"
    name: "pgaudit"
    technology: "pgaudit"
    description: "Extension for compliance-driven audit logging."
relationships:
  - source: "Primary Database"
    destination: "Read Replica"
    description: "Synchronously replicates data to"
  - source: "Patroni"
    destination: "Primary Database"
    description: "Manages failover and high availability for"
  - source: "PgBouncer"
    destination: "Primary Database"
    description: "Routes connection traffic to"