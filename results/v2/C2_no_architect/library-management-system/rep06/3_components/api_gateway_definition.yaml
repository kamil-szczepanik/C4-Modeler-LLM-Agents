level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Istio Service Mesh Routing Handler"
    technology: "Kubernetes Gateway / Istio Service Mesh"
    description: "Handles centralized routing, traffic-splitting, and API versioning."
  - type: "component"
    name: "mTLS and Security Enforcer"
    technology: "Istio mTLS"
    description: "Enforces secure mTLS communication and perimeter security."
  - type: "component"
    name: "OAuth2/OIDC Authentication Engine"
    technology: "OAuth2/OIDC with JWT"
    description: "Performs centralized authentication, token exchange, and claims enrichment."
  - type: "component"
    name: "Global Rate Limiter"
    technology: "Redis"
    description: "Acts as the backend for distributed global rate-limiting."
relationships:
  - source: "Istio Service Mesh Routing Handler"
    destination: "mTLS and Security Enforcer"
    description: "Secures routed traffic"
  - source: "Istio Service Mesh Routing Handler"
    destination: "OAuth2/OIDC Authentication Engine"
    description: "Validates tokens for incoming requests"
  - source: "Istio Service Mesh Routing Handler"
    destination: "Global Rate Limiter"
    description: "Checks rate limits for requests"