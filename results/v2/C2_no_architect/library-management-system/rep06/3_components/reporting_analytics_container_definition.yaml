level: component
scope: "Component diagram for the Reporting/Analytics Container container"
parentContainer:
  name: "Reporting/Analytics Container"
elements:
  - type: "component"
    name: "Dashboard Controller"
    technology: "Node.js / Express"
    description: "Delivers operational dashboards and strategic executive reports for library administrators and compliance officers."
  - type: "component"
    name: "Analytics Event Consumer"
    technology: "Apache Kafka / Redpanda Consumer"
    description: "Processes event streams to provide business intelligence while maintaining strict EU data residency and privacy compliance."
  - type: "component"
    name: "Report Generation Worker"
    technology: "Redis / Kafka Background Worker"
    description: "Backs asynchronous worker queues for heavy PDF/CSV report generation, driven by metric-based autoscaling via KEDA."
  - type: "component"
    name: "Data Archival Service"
    technology: "HTTPS/TLS 1.3 Client"
    description: "Archives raw event logs via automated data tiering to S3-compatible EU Object Storage."
relationships:
  - source: "Analytics Event Consumer"
    destination: "Dashboard Controller"
    description: "Populates analytics data via event streams [Internal API]"
  - source: "Dashboard Controller"
    destination: "Report Generation Worker"
    description: "Streams report generation and data export events [Internal API]"
  - source: "Dashboard Controller"
    destination: "ClickHouse / OLAP Database"
    description: "Queries aggregated metrics [TCP/SQL]"
  - source: "Data Archival Service"
    destination: "EU Object Storage"
    description: "Archives raw event logs via automated data tiering [HTTPS/TLS 1.3]"