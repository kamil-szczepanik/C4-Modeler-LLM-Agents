level: component
scope: "Component diagram for the Circulation & Cataloguing Container container"
parentContainer:
  name: "Circulation & Cataloguing Container"
elements:
  - type: "component"
    name: "Circulation Controller"
    technology: "Java Microservice, Spring MVC"
    description: "Handles incoming routing traffic from the API Gateway and exposes REST endpoints for circulation and cataloguing."
  - type: "component"
    name: "Business Logic Service"
    technology: "Java Microservice, Resilience4j"
    description: "Implements business logic, connection pooling via HikariCP, and circuit breakers for resilience."
  - type: "component"
    name: "Data Access Component"
    technology: "Java Microservice, SQL"
    description: "Manages read and write operations to the PostgreSQL Database for transactional data."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Java Microservice, Kafka Protocol"
    description: "Publishes audit and sync events with encryption-in-transit and payload signing to the event streaming platform."
relationships:
  - source: "Circulation Controller"
    destination: "Business Logic Service"
    description: "Delegates requests [Method Invocation]"
  - source: "Business Logic Service"
    destination: "Data Access Component"
    description: "Executes queries and transactions [SQL]"
  - source: "Business Logic Service"
    destination: "Event Publisher Component"
    description: "Triggers domain events [Method Invocation]"