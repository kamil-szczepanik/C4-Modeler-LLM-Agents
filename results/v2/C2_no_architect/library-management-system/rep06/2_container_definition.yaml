level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons"
    description: "Library members who access self-service portals."
  - type: "person"
    name: "Librarians/Circulation Staff"
    description: "Staff members who manage circulation and library operations."
  - type: "person"
    name: "Library Administrators"
    description: "Administrators who configure and manage the library management system."
  - type: "externalSystem"
    name: "EU-hosted Identity Provider (IdP)"
    description: "Authenticates users via OpenID Connect (OIDC) with multi-factor authentication (MFA)."
  - type: "externalSystem"
    name: "CDN/WAF Edge Services"
    description: "Provides edge services, TLS 1.3 termination, and perimeter defense."
  - type: "externalSystem"
    name: "Digital Content Vendors / Third-Party E-Resource Providers"
    description: "External providers of digital content integrated via OAuth2 and mTLS."
  - type: "container"
    name: "API Gateway"
    technology: "Istio Service Mesh / Kubernetes Gateway"
    description: "Routes incoming traffic to internal containers using mTLS."
  - type: "container"
    name: "Patron Portal"
    technology: "Web Frontend / Backend Service"
    description: "Provides self-service portals for patrons, querying Elasticsearch via CQRS."
  - type: "container"
    name: "Circulation & Cataloguing Container"
    technology: "Java / Microservice"
    description: "Manages cataloging and circulation transactional data."
  - type: "container"
    name: "Elasticsearch Container"
    technology: "Elasticsearch"
    description: "Provides sub-second search performance."
  - type: "container"
    name: "Kafka/Redpanda Event Streaming Container"
    technology: "Apache Kafka / Redpanda"
    description: "Streams operational and transactional events."
  - type: "container"
    name: "Audit & Event Tracking Container"
    technology: "Microservice"
    description: "Consumes audit and event streams to track system activity."
  - type: "container"
    name: "Reporting/Analytics Container"
    technology: "Analytics Service"
    description: "Provides reporting and analytics data populated from event streams."
  - type: "container"
    name: "PostgreSQL Database (Primary/Read Replica)"
    technology: "PostgreSQL"
    description: "Stores relational transactional data with primary and read replica setup."
relationships:
  - source: "Library Patrons"
    destination: "CDN/WAF Edge Services"
    description: "Accesses portals"
    technology: "HTTPS/TLS 1.3"
  - source: "Librarians/Circulation Staff"
    destination: "CDN/WAF Edge Services"
    description: "Accesses portals"
    technology: "HTTPS/TLS 1.3"
  - source: "Library Administrators"
    destination: "CDN/WAF Edge Services"
    description: "Accesses portals"
    technology: "HTTPS/TLS 1.3"
  - source: "CDN/WAF Edge Services"
    destination: "API Gateway"
    description: "Routes traffic"
    technology: "HTTPS/TLS 1.3 and OAuth2/OIDC (JWT)"
  - source: "API Gateway"
    destination: "Patron Portal"
    description: "Routes traffic"
    technology: "mTLS"
  - source: "API Gateway"
    destination: "Circulation & Cataloguing Container"
    description: "Routes traffic"
    technology: "mTLS"
  - source: "Circulation & Cataloguing Container"
    destination: "PostgreSQL Database (Primary/Read Replica)"
    description: "Writes transactional data"
    technology: "SQL"
  - source: "Circulation & Cataloguing Container"
    destination: "Kafka/Redpanda Event Streaming Container"
    description: "Publishes events"
    technology: "Kafka Protocol"
  - source: "Patron Portal"
    destination: "Elasticsearch Container"
    description: "Queries search data using CQRS"
    technology: "REST/TCP"
  - source: "Kafka/Redpanda Event Streaming Container"
    destination: "Audit & Event Tracking Container"
    description: "Consumes events"
    technology: "Kafka Protocol"
  - source: "Audit & Event Tracking Container"
    destination: "Reporting/Analytics Container"
    description: "Populates analytics"
    technology: "Internal API"