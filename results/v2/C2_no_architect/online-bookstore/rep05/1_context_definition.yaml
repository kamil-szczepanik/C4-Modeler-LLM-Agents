level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "A globally distributed, Amazon-style e-commerce platform designed to support physical and electronic book sales, personalized recommendations, and reviews while handling 1M MAU globally."
elements:
  - type: "person"
    name: "Customers"
    description: "End-users browsing catalogues, managing carts, and purchasing books."
  - type: "person"
    name: "Authors/Publishers"
    description: "Secondary users accessing sales analytics and review feedback."
  - type: "person"
    name: "Store Administrators"
    description: "Back-office staff managing catalogues, moderation, and fulfillment."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processors like Stripe/PayPal for secure payment handling."
  - type: "externalSystem"
    name: "Third-Party Shipping Provider APIs"
    description: "External shipping services for order fulfillment and tracking."
relationships:
  - source: "Customers"
    destination: "Online Bookstore System"
    description: "Interacts via Edge/CDN and HTTPS/TLS 1.3 to browse, cart, and purchase."
    technology: "HTTPS / TLS 1.3"
  - source: "Authors/Publishers"
    destination: "Online Bookstore System"
    description: "Accesses sales analytics and review feedback."
    technology: "HTTPS"
  - source: "Store Administrators"
    destination: "Online Bookstore System"
    description: "Manages catalogues, moderation, and fulfillment."
    technology: "HTTPS"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Integrates via Tokenized Client-Side SDKs for payment processing."
    technology: "Tokenized Client-Side SDKs / TLS 1.3"
  - source: "Online Bookstore System"
    destination: "Third-Party Shipping Provider APIs"
    description: "Integrates for shipping and fulfillment operations."
    technology: "HTTPS"