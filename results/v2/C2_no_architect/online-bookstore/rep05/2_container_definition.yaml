level: container
scope: "Container diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
elements:
  - type: "person"
    name: "Casual Browsers"
    description: "End-users browsing catalogues and viewing books."
  - type: "person"
    name: "Intentional Buyers"
    description: "End-users managing carts and executing secure checkouts."
  - type: "person"
    name: "Authors/Publishers"
    description: "Content creators and partners accessing reports and analytics."
  - type: "person"
    name: "Store Administrators"
    description: "Back-office staff managing catalogues, moderation, and store operations."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processor for handling secure transactions."
  - type: "externalSystem"
    name: "Third-Party Shipping Provider APIs"
    description: "External shipping services for order fulfillment and tracking."
  - type: "container"
    name: "Web Frontend SPA/SSR"
    technology: "React / Node.js"
    description: "Single Page Application and Server-Side Rendered frontend serving users via Edge/CDN."
  - type: "container"
    name: "Catalogue Service"
    technology: "AWS ECS/EKS, REST, gRPC"
    description: "Handles product browsing, search, and catalogue data management."
  - type: "container"
    name: "Secure Checkout & Payment Service"
    technology: "AWS ECS/EKS, REST, gRPC"
    description: "Manages shopping carts, orders, and secure payment integrations."
  - type: "container"
    name: "Recommendation Engine"
    technology: "AWS ECS/EKS, gRPC"
    description: "Provides personalized book recommendations to users."
  - type: "container"
    name: "Admin & Reporting Service"
    technology: "AWS ECS/EKS, REST"
    description: "Provides administrative capabilities, analytics, and reporting for authors and store admins."
relationships:
  - source: "Casual Browsers"
    destination: "Web Frontend SPA/SSR"
    description: "Browses book catalogue and reviews."
    technology: "HTTPS (TLS 1.3)"
  - source: "Intentional Buyers"
    destination: "Web Frontend SPA/SSR"
    description: "Manages cart and performs secure checkouts."
    technology: "HTTPS (TLS 1.3)"
  - source: "Authors/Publishers"
    destination: "Web Frontend SPA/SSR"
    description: "Accesses analytics and reports."
    technology: "HTTPS (TLS 1.3)"
  - source: "Store Administrators"
    destination: "Web Frontend SPA/SSR"
    description: "Manages store settings and catalogue data."
    technology: "HTTPS (TLS 1.3)"
  - source: "Web Frontend SPA/SSR"
    destination: "Catalogue Service"
    description: "Requests catalogue and product data."
    technology: "REST and gRPC over mTLS"
  - source: "Web Frontend SPA/SSR"
    destination: "Secure Checkout & Payment Service"
    description: "Submits orders and checkout requests."
    technology: "REST and gRPC over mTLS"
  - source: "Web Frontend SPA/SSR"
    destination: "Recommendation Engine"
    description: "Fetches personalized recommendations."
    technology: "REST and gRPC over mTLS"
  - source: "Web Frontend SPA/SSR"
    destination: "Admin & Reporting Service"
    description: "Sends administrative and reporting queries."
    technology: "REST and gRPC over mTLS"
  - source: "Secure Checkout & Payment Service"
    destination: "Payment Gateway"
    description: "Processes secure payments."
    technology: "HTTPS / TLS 1.3 API integration"
  - source: "Secure Checkout & Payment Service"
    destination: "Third-Party Shipping Provider APIs"
    description: "Coordinates order fulfillment and tracking."
    technology: "HTTPS REST API integrations"