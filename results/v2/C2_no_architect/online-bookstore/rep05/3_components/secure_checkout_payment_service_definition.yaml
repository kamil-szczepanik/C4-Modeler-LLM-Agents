level: component
scope: "Component diagram for the Secure Checkout & Payment Service container"
parentContainer:
  name: "Secure Checkout & Payment Service"
elements:
  - type: "component"
    name: "Checkout Controller"
    technology: "AWS ECS/EKS container REST/gRPC API"
    description: "Handles incoming checkout requests and route operations via mTLS and JWTs."
  - type: "component"
    name: "Payment Processor"
    technology: "AWS ECS/EKS container HTTPS/TLS 1.3"
    description: "Processes secure tokenized payments with the External Payment Gateway."
  - type: "component"
    name: "Order & Fulfillment Manager"
    technology: "AWS ECS/EKS container"
    description: "Coordinates order fulfillment with Third-Party Shipping Provider APIs via HMAC-verified webhooks."
  - type: "component"
    name: "Messaging & Resiliency Handler"
    technology: "AWS SQS Dead Letter Queues"
    description: "Manages asynchronous messaging, webhook/payment failures, and circuit-breaker handling."
relationships:
  - source: "Checkout Controller"
    destination: "Payment Processor"
    description: "Delegates tokenized payment requests"
  - source: "Payment Processor"
    destination: "Messaging & Resiliency Handler"
    description: "Sends failed payment transactions to Dead Letter Queues"
  - source: "Order & Fulfillment Manager"
    destination: "Messaging & Resiliency Handler"
    description: "Handles asynchronous webhook failures and retry queues"