level: component
scope: "Component diagram for the Recommendation Engine container"
parentContainer:
  name: "Recommendation Engine"
elements:
  - type: "component"
    name: "Inference Service"
    technology: "AWS ECS/EKS Container"
    description: "Handles real-time gRPC inference for personalized book recommendations."
  - type: "component"
    name: "Model Ingestion Module"
    technology: "AWS S3 and sigstore/Notation"
    description: "Ingests and verifies cryptographically signed model weights across multi-region buckets."
  - type: "component"
    name: "Fallback and Cache Handler"
    technology: "Redis and Edge CDN"
    description: "Serves cached public trending fallback payloads to anonymous or unauthenticated users and provides circuit breaking."
  - type: "component"
    name: "Compliance and Security Module"
    technology: "mTLS, JWT, AWS X-Ray, Automated TTL"
    description: "Enforces security, token validation, distributed tracing, and automated GDPR/CCPA data purges."
relationships:
  - source: "Inference Service"
    destination: "Model Ingestion Module"
    description: "Fetches verified model weights"
  - source: "Inference Service"
    destination: "Fallback and Cache Handler"
    description: "Falls back to cached payloads for unauthenticated users"