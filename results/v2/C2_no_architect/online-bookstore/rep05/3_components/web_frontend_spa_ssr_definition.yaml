level: component
scope: "Component diagram for the Web Frontend SPA/SSR container"
parentContainer:
  name: "Web Frontend SPA/SSR"
elements:
  - type: "component"
    name: "Router & Controller"
    technology: "React and Node.js"
    description: "Handles incoming HTTP requests, route matching, and hybrid rendering (SPA/SSR)."
  - type: "component"
    name: "Catalogue Client"
    technology: "REST / gRPC over mTLS"
    description: "Communicates with the Catalogue Service to fetch product data and book listings."
  - type: "component"
    name: "Checkout Client"
    technology: "REST / gRPC over mTLS"
    description: "Submits secure checkout requests and handles payment interactions."
  - type: "component"
    name: "Recommendation Client"
    technology: "REST / gRPC over mTLS"
    description: "Fetches personalized book recommendations for users."
  - type: "component"
    name: "Admin Client"
    technology: "REST / gRPC over mTLS"
    description: "Sends administrative and reporting queries to the backend."
relationships:
  - source: "Router & Controller"
    destination: "Catalogue Client"
    description: "Delegates product data requests"
  - source: "Router & Controller"
    destination: "Checkout Client"
    description: "Delegates checkout submissions"
  - source: "Router & Controller"
    destination: "Recommendation Client"
    description: "Delegates recommendation requests"
  - source: "Router & Controller"
    destination: "Admin Client"
    description: "Delegates administrative queries"
  - source: "Catalogue Client"
    destination: "Catalogue Service"
    description: "Requests product data via REST and gRPC over mTLS"
  - source: "Checkout Client"
    destination: "Secure Checkout & Payment Service"
    description: "Submits checkout requests via REST and gRPC over mTLS"
  - source: "Recommendation Client"
    destination: "Recommendation Engine"
    description: "Fetches recommendations via REST and gRPC over mTLS"
  - source: "Admin Client"
    destination: "Admin & Reporting Service"
    description: "Sends administrative queries via REST and gRPC over mTLS"