level: component
scope: "Component diagram for the Catalogue Service container"
parentContainer:
  name: "Catalogue Service"
elements:
  - type: "component"
    name: "Catalogue REST and gRPC API Controller"
    technology: "Node.js / Express / gRPC"
    description: "Handles incoming REST and gRPC requests over mTLS from the Web Frontend for product browsing and search."
  - type: "component"
    name: "Administration API Controller"
    technology: "Node.js / Express with OIDC/JWT, RBAC, and MFA"
    description: "Processes authenticated administrative requests for inventory updates and catalogue metadata changes."
  - type: "component"
    name: "Product Catalogue Manager"
    technology: "TypeScript / Business Logic Layer"
    description: "Executes business logic for catalogue data management, pricing, and multi-currency support."
  - type: "component"
    name: "Inventory Transaction Service"
    technology: "TypeScript / SQL Driver"
    description: "Manages transactional write operations for inventory and metadata changes directly against Amazon RDS."
  - type: "component"
    name: "Read-Aside Caching Manager"
    technology: "Node.js Redis Client with Circuit-Breaker"
    description: "Handles high-concurrency read queries using Amazon ElastiCache (Redis) with TLS 1.3 encryption and resilience patterns."
  - type: "component"
    name: "Search Query Resolver"
    technology: "OpenSearch Client"
    description: "Interfaces with AWS OpenSearch to execute low-latency faceted keyword searches."
  - type: "component"
    name: "Event Publisher"
    technology: "AWS EventBridge / Kafka SDK"
    description: "Emits real-time inventory change events to the event bus for asynchronous CQRS synchronization."
relationships:
  - source: "Catalogue REST and gRPC API Controller"
    destination: "Read-Aside Caching Manager"
    description: "Retrieves cached product and catalogue data"
  - source: "Catalogue REST and gRPC API Controller"
    destination: "Search Query Resolver"
    description: "Executes low-latency search and browsing queries"
  - source: "Administration API Controller"
    destination: "Product Catalogue Manager"
    description: "Passes validated administrative metadata and pricing changes"
  - source: "Product Catalogue Manager"
    destination: "Inventory Transaction Service"
    description: "Initiates transactional database writes"
  - source: "Inventory Transaction Service"
    destination: "Event Publisher"
    description: "Triggers event emission for state changes"