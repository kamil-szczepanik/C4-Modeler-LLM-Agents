level: component
scope: "Component diagram for the Admin & Reporting Service container"
parentContainer:
  name: "Admin & Reporting Service"
elements:
  - type: "component"
    name: "Admin & Reporting Service REST API Container"
    technology: "AWS ECS / EKS Container, REST and gRPC"
    description: "Handles administrative and reporting queries, enforces JWT-based RBAC and Row-Level Security."
  - type: "component"
    name: "AWS ECS / EKS Worker Pool & Fargate Spot Tasks"
    technology: "AWS ECS, EKS, Fargate Spot, AWS SQS"
    description: "Processes heavy asynchronous batch report generation without impacting synchronous APIs."
  - type: "component"
    name: "AWS Redshift / OLAP Data Warehouse & Read Replicas"
    technology: "AWS Redshift, SQL over TLS 1.3"
    description: "Stores analytical data and decouples analytical queries from primary transactional databases."
  - type: "component"
    name: "AWS S3 Report Export Buckets"
    technology: "AWS S3, AWS SDK, SSE-KMS"
    description: "Persists scheduled and on-demand report exports securely."
relationships:
  - source: "Web Frontend SPA/SSR"
    destination: "Admin & Reporting Service REST API Container"
    description: "Sends administrative and reporting queries using REST and gRPC over mTLS"
  - source: "Admin & Reporting Service REST API Container"
    destination: "AWS Redshift / OLAP Data Warehouse & Read Replicas"
    description: "Queries analytical data using SQL over TLS 1.3"
  - source: "Admin & Reporting Service REST API Container"
    destination: "AWS S3 Report Export Buckets"
    description: "Persists scheduled and on-demand report exports using AWS SDK with SSE-KMS"
  - source: "Admin & Reporting Service REST API Container"
    destination: "AWS ECS / EKS Worker Pool & Fargate Spot Tasks"
    description: "Queues asynchronous batch export jobs"