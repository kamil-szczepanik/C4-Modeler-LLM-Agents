# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Online Bookstore Core System"
system:
  name: "Online Bookstore Core System"
elements:
  - type: "person"
    name: "Customers"
    description: "End users browsing catalogs, purchasing books, and writing reviews."
  - type: "person"
    name: "Catalog Administrators"
    description: "Administrators managing the bookstore catalog."
  - type: "person"
    name: "Registered Reviewers / Authors"
    description: "Users providing reviews and interacting with platform content."
  - type: "externalSystem"
    name: "Amazon CloudFront"
    description: "Content Delivery Network for edge caching and static asset delivery."
  - type: "externalSystem"
    name: "Amazon Route 53"
    description: "Global Traffic Management and Anycast DNS service."
  - type: "externalSystem"
    name: "Third-Party Payment Gateway"
    description: "External service handling secure payments."
  - type: "externalSystem"
    name: "Shipping Provider"
    description: "Third-party service handling order fulfillment and delivery."
  - type: "externalSystem"
    name: "Recommendation Engine"
    description: "Engine providing personalized recommendations."
  - type: "container"
    name: "API Gateway Container"
    technology: "AWS ECS / EKS"
    description: "Routes external traffic to internal microservices via App Mesh."
  - type: "container"
    name: "Browse & Search Container"
    technology: "AWS ECS / EKS"
    description: "Handles book catalog browsing and search functionality."
  - type: "container"
    name: "Shopping Cart & Checkout Container"
    technology: "AWS ECS / EKS"
    description: "Manages shopping carts, orders, and secure checkout flows."
  - type: "container"
    name: "Reviews & Ratings Container"
    technology: "AWS ECS / EKS"
    description: "Manages customer reviews, ratings, and author interactions."
  - type: "container"
    name: "Recommendations Container"
    technology: "AWS ECS / EKS"
    description: "Delivers personalized product recommendations to users."
relationships:
  - source: "Customers"
    destination: "Amazon CloudFront"
    description: "Access platform via secure global routing and CDN"
    technology: "HTTPS (TLS 1.3)"
  - source: "Customers"
    destination: "Amazon Route 53"
    description: "Resolve domain and route traffic globally"
    technology: "DNS"
  - source: "Amazon CloudFront"
    destination: "API Gateway Container"
    description: "Forwards traffic to core services"
    technology: "HTTPS"
  - source: "API Gateway Container"
    destination: "Browse & Search Container"
    description: "Routes browse and search requests via service mesh"
    technology: "mTLS (AWS App Mesh)"
  - source: "API Gateway Container"
    destination: "Shopping Cart & Checkout Container"
    description: "Routes cart and checkout requests via service mesh"
    technology: "mTLS (AWS App Mesh)"
  - source: "API Gateway Container"
    destination: "Reviews & Ratings Container"
    description: "Routes review requests via service mesh"
    technology: "mTLS (AWS App Mesh)"
  - source: "API Gateway Container"
    destination: "Recommendations Container"
    description: "Routes recommendation requests via service mesh"
    technology: "mTLS (AWS App Mesh)"
  - source: "Shopping Cart & Checkout Container"
    destination: "Third-Party Payment Gateway"
    description: "Processes secure payments and tokenization"
    technology: "HTTPS / TLS 1.3"
  - source: "Shopping Cart & Checkout Container"
    destination: "Shipping Provider"
    description: "Coordinates order fulfillment"
    technology: "HTTPS"
  - source: "Recommendations Container"
    destination: "Recommendation Engine"
    description: "Fetches personalized recommendations"
    technology: "HTTPS"