level: context
scope: "System Context diagram for Online Bookstore Core System"
system:
  name: "Online Bookstore Core System"
  description: "An Amazon-style e-commerce platform for physical and electronic book sales, providing catalog browsing, secure checkout, reviews, and personalized recommendations."
elements:
  - type: "person"
    name: "Customers (Shoppers)"
    description: "End users browsing catalogs, purchasing physical and electronic books, and writing reviews."
  - type: "person"
    name: "Catalog Administrators"
    description: "Administrators managing the bookstore catalog and system configurations."
  - type: "person"
    name: "Registered Reviewers / Authors"
    description: "Users who provide reviews and interact with the platform content."
  - type: "externalSystem"
    name: "Amazon CloudFront"
    description: "Content Delivery Network (CDN) for edge caching and static asset delivery."
  - type: "externalSystem"
    name: "Amazon Route 53"
    description: "Global Traffic Management and Anycast DNS service."
  - type: "externalSystem"
    name: "Third-Party Payment Gateway"
    description: "External service handling secure payments via tokenization."
  - type: "externalSystem"
    name: "Shipping Provider"
    description: "Third-party service handling order fulfillment and delivery."
  - type: "externalSystem"
    name: "Recommendation Engine"
    description: "Third-party engine providing personalized recommendations using anonymized identifiers."
  - type: "externalSystem"
    name: "AWS CloudWatch / OpenTelemetry"
    description: "Observability platforms for cross-region monitoring and metrics."
  - type: "externalSystem"
    name: "AWS IAM Identity Center"
    description: "Identity and access management service for administrative security."
relationships:
  - source: "Customers (Shoppers)"
    destination: "Amazon CloudFront"
    description: "Interact via global traffic management and edge caching"
    technology: "HTTPS (TLS 1.3)"
  - source: "Catalog Administrators"
    destination: "AWS IAM Identity Center"
    description: "Access administrative functions via private VPC endpoints"
    technology: "HTTPS"
  - source: "Online Bookstore Core System"
    destination: "Third-Party Payment Gateway"
    description: "Integrates for secure payments using tokenization"
    technology: "Tokenized API"
  - source: "Online Bookstore Core System"
    destination: "Shipping Provider"
    description: "Connects for order fulfillment and shipping"
    technology: "Secure APIs"
  - source: "Online Bookstore Core System"
    destination: "Recommendation Engine"
    description: "Exchanges anonymized identifiers via circuit breakers"
    technology: "Secure API"