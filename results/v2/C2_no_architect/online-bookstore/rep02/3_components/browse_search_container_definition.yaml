level: component
scope: "Component diagram for the Browse & Search Container container"
parentContainer:
  name: "Browse & Search Container"
elements:
  - type: "component"
    name: "Search Controller"
    technology: "AWS ECS / EKS Container Component"
    description: "Handles incoming catalog browse and search requests from the API Gateway."
  - type: "component"
    name: "Catalog Search Service"
    technology: "Business Logic Component"
    description: "Executes search queries, processes catalog metadata, and interacts with caching layers."
relationships:
  - source: "Search Controller"
    destination: "Catalog Search Service"
    description: "Forwards browse and search requests"