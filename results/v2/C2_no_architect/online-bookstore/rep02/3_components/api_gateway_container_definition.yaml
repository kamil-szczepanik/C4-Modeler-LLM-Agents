level: component
scope: "Component diagram for the API Gateway Container container"
parentContainer:
  name: "API Gateway Container"
elements:
  - type: "component"
    name: "API Router and Dispatcher"
    technology: "AWS API Gateway / Nginx"
    description: "Routes incoming user traffic and API requests to appropriate backend microservices."
  - type: "component"
    name: "Authentication and Security Filter"
    technology: "OAuth2 / JWT Validator"
    description: "Enforces security policies, validates tokens, and integrates with AWS IAM Identity Center."
  - type: "component"
    name: "Service Mesh Proxy Integration"
    technology: "AWS App Mesh Envoy Sidecar"
    description: "Manages mTLS encryption and distributed tracing for outgoing requests to backend containers."
relationships:
  - source: "API Router and Dispatcher"
    destination: "Authentication and Security Filter"
    description: "Validates request authentication"
  - source: "API Router and Dispatcher"
    destination: "Service Mesh Proxy Integration"
    description: "Forwards routed requests via mTLS"