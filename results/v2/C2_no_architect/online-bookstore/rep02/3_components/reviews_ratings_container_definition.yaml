level: component
scope: "Component diagram for the Reviews & Ratings Container container"
parentContainer:
  name: "Reviews & Ratings Container"
elements:
  - type: "component"
    name: "Reviews & Ratings Microservice"
    technology: "AWS ECS / EKS microservice"
    description: "Manages reviews, ratings, badges, and author responses, driving user-generated content, trust, and conversion rates."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL with Read Replicas and AWS KMS (AES-256)"
    description: "Provides data persistence for transactional reads/writes and isolated query workloads."
  - type: "component"
    name: "Amazon ElastiCache Redis"
    technology: "Amazon ElastiCache Redis"
    description: "Caching layer for vote deduplication, caching top reviews, badges, and low-latency read caching."
  - type: "component"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Messaging and queueing for asynchronous moderation and decoupled database writes."
  - type: "component"
    name: "AWS CloudWatch"
    technology: "AWS CloudWatch and OpenTelemetry"
    description: "Handles observability and auditing by streaming operational logs, metrics, and immutable audit trails."
relationships:
  - source: "Reviews & Ratings Microservice"
    destination: "Amazon Aurora PostgreSQL"
    description: "Executes transactional reads/writes via JDBC/TLS"
  - source: "Reviews & Ratings Microservice"
    destination: "Amazon ElastiCache Redis"
    description: "Handles write-through caching and vote deduplication via RESP protocol"
  - source: "Reviews & Ratings Microservice"
    destination: "Amazon SQS"
    description: "Offloads asynchronous moderation events and batch vote persistence"
  - source: "Reviews & Ratings Microservice"
    destination: "AWS CloudWatch"
    description: "Streams operational logs, metrics, and immutable audit trails"