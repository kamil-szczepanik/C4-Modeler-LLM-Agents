level: component
scope: "Component diagram for the Recommendations Container container"
parentContainer:
  name: "Recommendations Container"
elements:
  - type: "component"
    name: "Recommendations Container (AWS ECS / EKS)"
    technology: "AWS ECS / EKS, Fluent Bit Sidecar, AWS App Mesh"
    description: "Delivers personalized book suggestions and curated bestsellers to active shoppers within the Online Bookstore platform."
  - type: "component"
    name: "External Recommendation Engine"
    technology: "HTTPS with Resilience4j circuit breakers"
    description: "External service providing personalized recommendations."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache (Redis) with AWS KMS encryption"
    description: "Caches fallback lists and frequent recommendations for rapid delivery."
  - type: "component"
    name: "Amazon Kinesis Data Streams"
    technology: "Amazon Kinesis Data Streams with AWS KMS encryption"
    description: "Ingests clickstream events and emits asynchronous telemetry."
  - type: "component"
    name: "API Gateway Container"
    technology: "mTLS (AWS App Mesh)"
    description: "Routes recommendation requests to the Recommendations Container."
relationships:
  - source: "API Gateway Container"
    destination: "Recommendations Container (AWS ECS / EKS)"
    description: "Routes recommendation requests via service mesh [mTLS (AWS App Mesh)]"
  - source: "Recommendations Container (AWS ECS / EKS)"
    destination: "External Recommendation Engine"
    description: "Fetches personalized recommendations [HTTPS with Resilience4j circuit breakers]"
  - source: "Recommendations Container (AWS ECS / EKS)"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches fallback lists and frequent recommendations [Encrypted in-transit and at-rest via AWS KMS]"
  - source: "Recommendations Container (AWS ECS / EKS)"
    destination: "Amazon Kinesis Data Streams"
    description: "Ingests clickstream events and emits asynchronous telemetry [Encrypted via AWS KMS]"