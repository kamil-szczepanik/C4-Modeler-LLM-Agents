level: container
scope: "Container diagram for Online Bookstore Platform"
system:
  name: "Online Bookstore Platform"
elements:
  - type: "person"
    name: "Book Buyer"
    description: "Customer who browses the catalogue, manages cart, and completes checkout."
  - type: "person"
    name: "Book Reviewer"
    description: "User who interacts with the platform to write and manage reviews."
  - type: "person"
    name: "Store Administrator"
    description: "User responsible for managing store operations and configurations."
  - type: "person"
    name: "Support Agent"
    description: "User who handles customer support inquiries and issues."
  - type: "externalSystem"
    name: "Third-Party Payment Gateway"
    description: "Processes tokenized payments securely."
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "Handles shipping and fulfillment operations."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway / TLS 1.3"
    description: "Routes validated REST/gRPC traffic with TLS 1.3 edge termination."
  - type: "container"
    name: "Cart & Checkout Container"
    technology: "Amazon ECS/EKS / Transactional Outbox"
    description: "Manages shopping cart and order checkout using the Transactional Outbox pattern."
  - type: "container"
    name: "Catalog & Search Container"
    technology: "Amazon ECS/EKS"
    description: "Manages book catalog, physical and electronic inventory, and search capabilities."
  - type: "container"
    name: "Personalization Engine Container"
    technology: "Amazon ECS/EKS"
    description: "Provides recommendations and personalized user experiences."
  - type: "container"
    name: "Localization & Compliance Container"
    technology: "Amazon ECS/EKS"
    description: "Ensures compliance with GDPR, CCPA, and regional localization requirements."
  - type: "container"
    name: "Admin & Support Container"
    technology: "Amazon ECS/EKS"
    description: "Provides administrative tooling and customer support capabilities."
  - type: "container"
    name: "AWS Aurora Database"
    technology: "AWS Aurora (Multi-Region)"
    description: "Multi-region relational database providing stateless container persistence."
  - type: "container"
    name: "AWS ElastiCache"
    technology: "Amazon ElastiCache"
    description: "Provides low-latency caching for fast retrieval."
  - type: "container"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Handles asynchronous event messaging and payload envelope encryption."
relationships:
  - source: "Book Buyer"
    destination: "API Gateway"
    description: "Browses catalog, manages cart, and completes checkout"
    technology: "HTTPS (TLS 1.3)"
  - source: "Book Reviewer"
    destination: "API Gateway"
    description: "Submits and manages reviews"
    technology: "HTTPS (TLS 1.3)"
  - source: "Store Administrator"
    destination: "API Gateway"
    description: "Manages store operations"
    technology: "HTTPS (TLS 1.3)"
  - source: "Support Agent"
    destination: "API Gateway"
    description: "Handles customer support inquiries"
    technology: "HTTPS (TLS 1.3)"
  - source: "API Gateway"
    destination: "Cart & Checkout Container"
    description: "Routes checkout traffic"
    technology: "mTLS inside AWS VPC"
  - source: "API Gateway"
    destination: "Catalog & Search Container"
    description: "Routes catalog and search requests"
    technology: "mTLS inside AWS VPC"
  - source: "API Gateway"
    destination: "Personalization Engine Container"
    description: "Routes recommendation requests"
    technology: "mTLS inside AWS VPC"
  - source: "API Gateway"
    destination: "Localization & Compliance Container"
    description: "Routes compliance and localization requests"
    technology: "mTLS inside AWS VPC"
  - source: "API Gateway"
    destination: "Admin & Support Container"
    description: "Routes administration and support requests"
    technology: "mTLS inside AWS VPC"
  - source: "Cart & Checkout Container"
    destination: "Third-Party Payment Gateway"
    description: "Processes tokenized payments"
    technology: "HTTPS REST API (Tokenization)"
  - source: "Cart & Checkout Container"
    destination: "Third-Party Shipping APIs"
    description: "Sends fulfillment and shipping data"
    technology: "HTTPS REST API"
  - source: "Cart & Checkout Container"
    destination: "Amazon SQS"
    description: "Queues asynchronous events"
    technology: "AWS SDK (Payload envelope encryption)"
  - source: "Localization & Compliance Container"
    destination: "AWS Aurora Database"
    description: "Reads and writes compliance data"
    technology: "Encrypted SQL connection (AES-256)"
  - source: "Cart & Checkout Container"
    destination: "AWS Aurora Database"
    description: "Persists transactional order data"
    technology: "Encrypted SQL connection (AES-256)"
  - source: "Catalog & Search Container"
    destination: "AWS Aurora Database"
    description: "Queries catalog and book data"
    technology: "Encrypted SQL connection (AES-256)"
  - source: "Catalog & Search Container"
    destination: "AWS ElastiCache"
    description: "Retrieves cached catalog data"
    technology: "Encrypted connection"