# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Online Bookstore Platform"
system:
  name: "Online Bookstore Platform"
  description: "A global e-commerce platform designed to sell physical and electronic books with integrated recommendations and reviews, supporting 1M MAU across multiple currencies and regions."
elements:
  - type: "person"
    name: "Book Buyer"
    description: "Customer who browses the catalogue, manages cart, and completes checkout."
  - type: "person"
    name: "Book Reviewer"
    description: "User who interacts with the platform to write and manage reviews."
  - type: "person"
    name: "Store Administrator"
    description: "User responsible for managing store operations and configurations."
  - type: "person"
    name: "Support Agent"
    description: "User who handles customer support inquiries and issues."
  - type: "container"
    name: "AWS API Gateway"
    description: "Routes validated REST/gRPC traffic across internal trust boundaries."
    technology: "AWS API Gateway"
  - type: "container"
    name: "Web Frontend"
    description: "Delivers global content and user interface performance via CloudFront."
    technology: "AWS CloudFront / Web Frontend"
  - type: "container"
    name: "Backend Microservices"
    description: "Processes business logic, transactional data, and integrations."
    technology: "REST/gRPC"
  - type: "container"
    name: "Recommendations Engine"
    description: "Provides integrated book recommendations."
    technology: "Microservices"
  - type: "container"
    name: "PostgreSQL Database"
    description: "Stores persistent relational data with AES-256 encryption."
    technology: "PostgreSQL"
  - type: "container"
    name: "Redis Cache"
    description: "Provides low-latency caching for transactional and shipping states."
    technology: "Redis"
  - type: "container"
    name: "AWS SQS Message Queue"
    description: "Asynchronously queues shipping handoffs and event data."
    technology: "AWS SQS"
  - type: "externalSystem"
    name: "Third-Party Payment Gateway"
    description: "Processes tokenized payments securely."
    technology: "Secure REST endpoints"
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "Handles shipping and fulfillment operations."
    technology: "Secure REST endpoints"
relationships:
  - source: "Book Buyer"
    destination: "Online Bookstore Platform"
    description: "Browses catalogue, manages cart, and completes checkout"
    technology: "HTTPS/TLS 1.3 using OAuth 2.0 / OIDC with JWTs"
  - source: "AWS API Gateway"
    destination: "Backend Microservices"
    description: "Routes validated REST/gRPC traffic across internal trust boundaries"
    technology: "REST/gRPC"
  - source: "Backend Microservices"
    destination: "PostgreSQL Database"
    description: "Reads and writes transactional data"
    technology: "Encrypted connections"
  - source: "Backend Microservices"
    destination: "Redis Cache"
    description: "Reads and writes cached shipping states"
    technology: "Encrypted connections"
  - source: "Backend Microservices"
    destination: "AWS SQS Message Queue"
    description: "Asynchronously queues shipping handoffs and event data"
    technology: "AWS SQS"
  - source: "Backend Microservices"
    destination: "Third-Party Payment Gateway"
    description: "Processes tokenized payments"
    technology: "Secure REST endpoints"
  - source: "Backend Microservices"
    destination: "Third-Party Shipping APIs"
    description: "Manages fulfillment and shipping operations"
    technology: "Secure REST endpoints"