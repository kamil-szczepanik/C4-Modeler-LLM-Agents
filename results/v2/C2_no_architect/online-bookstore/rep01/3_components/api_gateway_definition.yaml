level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Edge Termination Component"
    technology: "AWS API Gateway with TLS 1.3"
    description: "Manages secure edge routing, TLS 1.3 termination, and latency-based multi-region routing via Route 53."
  - type: "component"
    name: "Security & WAF Component"
    technology: "AWS WAF"
    description: "Provides OWASP Top-10 mitigation and edge security for incoming global traffic."
  - type: "component"
    name: "Authentication & Authorization Component"
    technology: "JWT/OAuth2 Validator"
    description: "Validates JSON Web Tokens and OAuth2 credentials for incoming buyer, reviewer, administrator, and support requests."
relationships:
  - source: "Security & WAF Component"
    destination: "Edge Termination Component"
    description: "Filters and inspects incoming traffic"
  - source: "Edge Termination Component"
    destination: "Authentication & Authorization Component"
    description: "Passes terminated requests for credential validation"
  - source: "Authentication & Authorization Component"
    destination: "Cart & Checkout Container"
    description: "Routes validated traffic via mTLS"