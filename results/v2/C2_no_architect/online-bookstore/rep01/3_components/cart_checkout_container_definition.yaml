level: component
scope: "Component diagram for the Cart & Checkout Container container"
parentContainer:
  name: "Cart & Checkout Container"
elements:
  - type: "component"
    name: "Cart & Checkout Container"
    technology: "Amazon ECS/EKS"
    description: "Manages shopping cart sessions, secure payment processing, and order fulfillment."
  - type: "component"
    name: "Book Buyer"
    technology: "Web / Mobile Client"
    description: "Primary user submitting shopping and checkout requests."
  - type: "component"
    name: "API Gateway"
    technology: "AWS API Gateway"
    description: "Routes validated checkout traffic securely via mTLS."
  - type: "component"
    name: "AWS Aurora Database"
    technology: "AWS Aurora Database (Multi-Region)"
    description: "Persists transactional data and PII with AES-256 encryption."
  - type: "component"
    name: "Amazon SQS"
    technology: "Amazon SQS (DLQ enabled)"
    description: "Publishes asynchronous order and abandoned cart events."
  - type: "component"
    name: "Third-Party Payment Gateway"
    technology: "HTTPS REST API"
    description: "Processes tokenized payments."
  - type: "component"
    name: "Third-Party Shipping APIs"
    technology: "HTTPS REST API with Resilience4j"
    description: "Handles fulfillment data with circuit breaker fallbacks."
  - type: "component"
    name: "AWS Secrets Manager"
    technology: "AWS Secrets Manager"
    description: "Manages database credentials and API tokens with auto-rotation."
  - type: "component"
    name: "AWS X-Ray"
    technology: "AWS X-Ray"
    description: "Provides distributed tracing with PII and token redaction."
relationships:
  - source: "Book Buyer"
    destination: "API Gateway"
    description: "Submits shopping and checkout requests [HTTPS / TLS 1.3]"
  - source: "API Gateway"
    destination: "Cart & Checkout Container"
    description: "Routes validated checkout traffic [mTLS within AWS VPC]"
  - source: "Cart & Checkout Container"
    destination: "Third-Party Payment Gateway"
    description: "Processes tokenized payments [HTTPS REST API]"
  - source: "Cart & Checkout Container"
    destination: "Third-Party Shipping APIs"
    description: "Sends fulfillment data with circuit breaker fallbacks [HTTPS REST API]"
  - source: "Cart & Checkout Container"
    destination: "Amazon SQS"
    description: "Publishes asynchronous order and abandoned cart events [AWS SDK with payload encryption]"
  - source: "Cart & Checkout Container"
    destination: "AWS Aurora Database"
    description: "Persists transactional data and PII [Encrypted SQL / AES-256]"