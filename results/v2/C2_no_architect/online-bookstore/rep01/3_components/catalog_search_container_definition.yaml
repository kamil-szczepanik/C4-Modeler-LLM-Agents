level: component
scope: "Component diagram for the Catalog & Search Container container"
parentContainer:
  name: "Catalog & Search Container"
elements:
  - type: "component"
    name: "Search and Browse Controller"
    technology: "Amazon ECS/EKS, Spring Boot"
    description: "Handles incoming search, browse, and facet requests routed via the API Gateway."
  - type: "component"
    name: "Inventory and Catalog Service"
    technology: "Amazon ECS/EKS, Java"
    description: "Manages book inventory, real-time availability, and multi-currency pricing logic."
  - type: "component"
    name: "Telemetry Publisher"
    technology: "Amazon ECS/EKS, AWS SDK"
    description: "Publishes sanitized, anonymized search telemetry asynchronously for personalization."
relationships:
  - source: "Search and Browse Controller"
    destination: "Inventory and Catalog Service"
    description: "Delegates search and facet queries"
  - source: "Inventory and Catalog Service"
    destination: "AWS Aurora Global Database"
    description: "Queries and updates catalog records using encrypted SQL (AES-256)"
  - source: "Inventory and Catalog Service"
    destination: "Amazon ElastiCache"
    description: "Retrieves cached catalog data and manages real-time availability via Redis Pub/Sub"
  - source: "Telemetry Publisher"
    destination: "Amazon SQS"
    description: "Publishes sanitized telemetry signals asynchronously"