level: component
scope: "Component diagram for the Amazon SQS container"
parentContainer:
  name: "Amazon SQS"
elements:
  - type: "component"
    name: "Queue Management Interface"
    technology: "AWS SDK with TLS 1.3"
    description: "Handles asynchronous fulfillment event queuing and message ingestion with 14-day maximum retention."
  - type: "component"
    name: "Dead-Letter Queue Handler"
    technology: "AWS SQS DLQ"
    description: "Manages failed message routing and business continuity for unprocessable fulfillment events."
  - type: "component"
    name: "Encryption Service"
    technology: "AWS KMS"
    description: "Provides Server-Side Encryption (SSE) using customer-managed keys for queue data protection."
relationships:
  - source: "Queue Management Interface"
    destination: "Dead-Letter Queue Handler"
    description: "Routes failed messages upon processing exhaustion"
  - source: "Queue Management Interface"
    destination: "Encryption Service"
    description: "Encrypts and decrypts queue payloads using customer-managed keys"