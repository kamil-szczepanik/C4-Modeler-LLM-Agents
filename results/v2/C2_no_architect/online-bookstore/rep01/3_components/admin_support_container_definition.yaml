level: component
scope: "Component diagram for the Admin & Support Container container"
parentContainer:
  name: "Admin & Support Container"
elements:
  - type: "component"
    name: "Admin & Support Controller"
    technology: "Node.js / Express"
    description: "Handles secure administration, catalogue moderation, and dispute resolution requests routed via mTLS."
  - type: "component"
    name: "Compliance Processing Service"
    technology: "Node.js Worker"
    description: "Manages GDPR/CCPA data processing and offloads deletion requests asynchronously."
  - type: "component"
    name: "Audit Logging Service"
    technology: "Node.js / AWS SDK"
    description: "Ships cryptographically signed immutable audit logs to storage."
relationships:
  - source: "Admin & Support Controller"
    destination: "Compliance Processing Service"
    description: "Triggers asynchronous GDPR/CCPA deletion tasks"
  - source: "Compliance Processing Service"
    destination: "Amazon SQS"
    description: "Offloads asynchronous GDPR/CCPA deletion requests [IAM]"
  - source: "Audit Logging Service"
    destination: "Amazon S3 Object Lock"
    description: "Ships cryptographically signed immutable audit logs [HTTPS/TLS 1.3]"
  - source: "Admin & Support Controller"
    destination: "Audit Logging Service"
    description: "Sends audit events for operations"