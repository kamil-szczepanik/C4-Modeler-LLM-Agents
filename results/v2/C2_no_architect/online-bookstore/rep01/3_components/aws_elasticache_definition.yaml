level: component
scope: "Component diagram for the AWS ElastiCache container"
parentContainer:
  name: "AWS ElastiCache"
elements:
  - type: "component"
    name: "Catalog Caching Component"
    technology: "Redis Cluster Mode Enabled"
    description: "Retrieves and serves cached catalog data for low-latency page loads."
  - type: "component"
    name: "Recommendation Namespace Component"
    technology: "Redis Namespace"
    description: "Maintains isolated recommendation data for the personalization engine."
  - type: "component"
    name: "Cart Namespace Component"
    technology: "Redis Namespace"
    description: "Maintains isolated session and cart namespaces for active users."
relationships:
  - source: "Catalog Caching Component"
    destination: "Recommendation Namespace Component"
    description: "Isolates cache data using Redis namespaces"
  - source: "Catalog Caching Component"
    destination: "Cart Namespace Component"
    description: "Isolates cache data using Redis namespaces"