level: component
scope: "Component diagram for the AWS Aurora Database container"
parentContainer:
  name: "AWS Aurora Database"
elements:
  - type: "component"
    name: "Compliance Data Access Component"
    technology: "SQL / AES-256"
    description: "Handles reading and writing of compliance data via encrypted SQL connection."
  - type: "component"
    name: "Transactional Order Data Component"
    technology: "SQL / AES-256"
    description: "Persists transactional order data securely."
  - type: "component"
    name: "Catalog and Book Data Component"
    technology: "SQL / AES-256"
    description: "Queries catalog and book information for users and search features."
relationships:
  - source: "Localization & Compliance Container"
    destination: "Compliance Data Access Component"
    description: "Reads and writes compliance data via encrypted SQL connection (AES-256)"
  - source: "Cart & Checkout Container"
    destination: "Transactional Order Data Component"
    description: "Persists transactional order data via encrypted SQL connection (AES-256)"
  - source: "Catalog & Search Container"
    destination: "Catalog and Book Data Component"
    description: "Queries catalog and book data via encrypted SQL connection (AES-256)"