level: component
scope: "Component diagram for the Personalization Engine Container container"
parentContainer:
  name: "Personalization Engine Container"
elements:
  - type: "component"
    name: "Personalization Engine Service"
    technology: "Amazon ECS/EKS"
    description: "Core recommendation service delivering real-time 'Customers also bought' recommendations and enforcing privacy compliance."
  - type: "component"
    name: "Data Ingestion Handler"
    technology: "Amazon SQS"
    description: "Ingests asynchronous user behavior telemetry."
  - type: "component"
    name: "Cache & Profile Manager"
    technology: "Amazon ElastiCache"
    description: "Reads cached user affinity profiles and fallback bestsellers."
  - type: "component"
    name: "Model Loader & Verifier"
    technology: "AWS KMS and S3"
    description: "Loads and cryptographically verifies ML models with AES-256 encryption."
  - type: "component"
    name: "Traffic & Security Manager"
    technology: "AWS API Gateway / AWS App Mesh"
    description: "Manages incoming traffic via mTLS and circuit breakers."
relationships:
  - source: "Traffic & Security Manager"
    destination: "Personalization Engine Service"
    description: "Invokes recommendation endpoints via mTLS inside AWS VPC"
  - source: "Personalization Engine Service"
    destination: "Cache & Profile Manager"
    description: "Reads cached affinity profiles and fallback bestsellers via TCP"
  - source: "Personalization Engine Service"
    destination: "Data Ingestion Handler"
    description: "Ingests asynchronous user behavior telemetry via HTTPS/TLS 1.3"
  - source: "Personalization Engine Service"
    destination: "Model Loader & Verifier"
    description: "Loads cryptographically verified ML models via HTTPS/TLS 1.3 with AWS KMS"