level: component
scope: "Component diagram for the Localization & Compliance Container container"
parentContainer:
  name: "Localization & Compliance Container"
elements:
  - type: "component"
    name: "Localization Controller"
    technology: "AWS ECS/EKS REST API Endpoint"
    description: "Routes regional localization and compliance requests, handling currency conversion and geo-lookup data."
  - type: "component"
    name: "Compliance Manager"
    technology: "AWS ECS/EKS Service Worker"
    description: "Ensures strict adherence to GDPR, CCPA, and multi-currency requirements across international markets."
  - type: "component"
    name: "Data Purge Publisher"
    technology: "AWS SQS Client"
    description: "Publishes asynchronous GDPR/CCPA deletion requests securely."
relationships:
  - source: "Localization Controller"
    destination: "Compliance Manager"
    description: "Validates and processes regional compliance and localization requests [mTLS inside AWS VPC]"
  - source: "Compliance Manager"
    destination: "Data Purge Publisher"
    description: "Sends asynchronous GDPR/CCPA deletion requests [Encrypted TLS / AWS KMS]"