level: component
scope: "Component diagram for the Notification Container container"
parentContainer:
  name: "Notification Container"
elements:
  - type: "component"
    name: "Notification Workers"
    technology: "Amazon ECS/EKS"
    description: "Orchestrates containerized notification workers with auto-scaling based on SQS queue depth."
  - type: "component"
    name: "Message Consumer & Dispatcher"
    technology: "AWS SQS / SNS"
    description: "Manages asynchronous message delivery with Dead Letter Queues (DLQ) for fault tolerance."
  - type: "component"
    name: "Consent & Preference Validator"
    technology: "Amazon ElastiCache / Redis"
    description: "Provides low-latency caching for real-time user preference and GDPR/CCPA consent validation."
  - type: "component"
    name: "Security & Secrets Manager"
    technology: "AWS KMS & AWS Secrets Manager"
    description: "Secures PII encryption at rest and dynamic provider API credentials."
  - type: "component"
    name: "Tracing Module"
    technology: "AWS X-Ray / OpenTelemetry"
    description: "Enables distributed tracing across event pipelines."
  - type: "component"
    name: "Book Buyer & Author/Publisher Partner"
    technology: "External User / Partner"
    description: "Recipients of dispatched asynchronous order updates, shipping notifications, and alerts."
  - type: "component"
    name: "Third-Party Shipping & Notification APIs"
    technology: "HTTPS / TLS 1.3"
    description: "External APIs for dispatching fulfillment updates and alerts."
relationships:
  - source: "Checkout/Payment Container"
    destination: "Message Consumer & Dispatcher"
    description: "Publishes cryptographically signed messages [AWS SNS/SQS]"
  - source: "Consent & Preference Validator"
    destination: "Notification Workers"
    description: "Validates real-time user consent [TCP/In-Memory]"
  - source: "Notification Workers"
    destination: "Third-Party Shipping & Notification APIs"
    description: "Dispatches fulfillment updates and alerts [HTTPS / TLS 1.3]"
  - source: "Notification Workers"
    destination: "Security & Secrets Manager"
    description: "Fetches dynamic provider API credentials [AWS API]"