level: component
scope: "Component diagram for the Catalog & Search container"
parentContainer:
  name: "Catalog & Search"
elements:
  - type: "component"
    name: "Search Controller"
    technology: "Amazon ECS/EKS REST API"
    description: "Handles incoming catalog browsing and search requests routed from CloudFront & WAF."
  - type: "component"
    name: "Search Engine Connector"
    technology: "Private VPC Networking, OpenSearch Client"
    description: "Executes catalog and keyword queries against OpenSearch on AWS."
  - type: "component"
    name: "Telemetry Emitter"
    technology: "FluentBit, Amazon Kinesis Data Firehose"
    description: "Streams asynchronous search telemetry and PII-masked search analytics."
relationships:
  - source: "Search Controller"
    destination: "Search Engine Connector"
    description: "Queries index"
  - source: "Search Controller"
    destination: "Telemetry Emitter"
    description: "Streams search telemetry"