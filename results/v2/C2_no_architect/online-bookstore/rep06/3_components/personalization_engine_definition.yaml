level: component
scope: "Component diagram for the Personalization Engine container"
parentContainer:
  name: "Personalization Engine"
elements:
  - type: "component"
    name: "AWS CloudFront & WAF"
    technology: "AWS Edge Security & Content Delivery"
    description: "Routes recommendation requests via HTTPS and enforces edge security."
  - type: "component"
    name: "Lambda@Edge"
    technology: "AWS Lambda@Edge"
    description: "Enables low-latency localized inference at the edge and queries user vectors."
  - type: "component"
    name: "ECS/EKS Services"
    technology: "Amazon ECS/EKS"
    description: "Orchestrates containerized recommendation and inference workloads."
  - type: "component"
    name: "Amazon ElastiCache / Redis"
    technology: "Amazon ElastiCache (Redis)"
    description: "Provides high-performance, low-latency in-memory caching for user profiles and trending fallbacks."
  - type: "component"
    name: "Amazon Kinesis / SQS"
    technology: "Amazon Kinesis / SQS"
    description: "Decouples interaction tracking to handle high-frequency write spikes asynchronously."
  - type: "component"
    name: "AWS App Mesh"
    technology: "AWS App Mesh & mTLS"
    description: "Enforces zero-trust internal service-to-service communication."
  - type: "component"
    name: "Amazon CloudWatch & AWS X-Ray"
    technology: "Amazon CloudWatch & AWS X-Ray"
    description: "Publishes telemetry, KPI dashboards, and system metrics for observability and monitoring."
relationships:
  - source: "AWS CloudFront & WAF"
    destination: "Lambda@Edge"
    description: "Routes recommendation requests via HTTPS / mTLS over AWS App Mesh"
  - source: "Lambda@Edge"
    destination: "Amazon ElastiCache / Redis"
    description: "Queries localized user vectors and cached trending best-sellers"
  - source: "ECS/EKS Services"
    destination: "Amazon Kinesis / SQS"
    description: "Streams pseudonymized user interactions asynchronously"
  - source: "ECS/EKS Services"
    destination: "Amazon CloudWatch & AWS X-Ray"
    description: "Publishes telemetry, KPI dashboards, and system metrics"