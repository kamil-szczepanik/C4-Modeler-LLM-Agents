level: component
scope: "Component diagram for the Localization/Currency container"
parentContainer:
  name: "Localization/Currency"
elements:
  - type: "component"
    name: "Localization/Currency Container"
    technology: "Amazon ECS/EKS"
    description: "Core backend component managing currency logic, localized content support, and user-explicit preference overrides."
  - type: "component"
    name: "Book Buyer"
    technology: "Web Browser / Mobile"
    description: "End-user interacting with the store and currency selectors."
  - type: "component"
    name: "AWS CloudFront & WAF"
    technology: "AWS Edge Service"
    description: "Edge service handling Geo-IP resolution via viewer headers and routing."
  - type: "component"
    name: "AWS Lambda@Edge"
    technology: "AWS Lambda"
    description: "Edge compute for initial request localization and header processing."
  - type: "component"
    name: "AWS ElastiCache (Redis)"
    technology: "Redis"
    description: "Distributed cache storing synced exchange rates globally via Global Datastores."
  - type: "component"
    name: "AWS EventBridge & Lambda"
    technology: "AWS EventBridge & Lambda"
    description: "Background worker pipeline for periodic exchange rate synchronization."
  - type: "component"
    name: "AWS Secrets Manager"
    technology: "AWS Secrets Manager"
    description: "Secure storage for third-party exchange rate API keys."
  - type: "component"
    name: "External Exchange Rate APIs"
    technology: "HTTPS REST API"
    description: "Third-party services providing market exchange rates."
relationships:
  - source: "AWS CloudFront & WAF"
    destination: "Localization/Currency Container"
    description: "Routes requests via HTTPS / mTLS over AWS App Mesh."
  - source: "AWS EventBridge & Lambda"
    destination: "External Exchange Rate APIs"
    description: "Fetches market rates periodically via HTTPS."
  - source: "Localization/Currency Container"
    destination: "AWS ElastiCache (Redis)"
    description: "Reads cached exchange rates via Redis protocol."
  - source: "Localization/Currency Container"
    destination: "AWS Secrets Manager"
    description: "Retrieves API credentials securely using AWS SDK."