level: component
scope: "Component diagram for the Checkout/Payment container"
parentContainer:
  name: "Checkout/Payment"
elements:
  - type: "component"
    name: "Cart Session Manager"
    technology: "Amazon ECS/EKS Container"
    description: "Manages shopping carts and session data."
  - type: "component"
    name: "Payment Orchestrator"
    technology: "Amazon ECS/EKS Container"
    description: "Handles payment orchestration, idempotency, and client-side tokenization with gateways."
  - type: "component"
    name: "Fulfillment Integration Service"
    technology: "Amazon ECS/EKS Container"
    description: "Interfaces with third-party shipping APIs to retrieve rates and dispatch orders."
relationships:
  - source: "Cart Session Manager"
    destination: "Payment Orchestrator"
    description: "Passes cart and session details for transaction processing [Internal REST/gRPC]"
  - source: "Payment Orchestrator"
    destination: "Fulfillment Integration Service"
    description: "Triggers order dispatch upon successful payment authorization [Internal REST/gRPC]"