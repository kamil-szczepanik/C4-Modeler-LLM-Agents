level: container
scope: "Container diagram for Global E-Commerce Book Platform"
system:
  name: "Global E-Commerce Book Platform"
elements:
  - type: "person"
    name: "Book Buyer"
    description: "Primary customer interacting via web/mobile frontends for catalogue browsing, checkout, and reviews."
  - type: "person"
    name: "Store Administrator & Author/Publisher Partner"
    description: "Administrative users managing catalogues, permissions, and analytics."
  - type: "externalSystem"
    name: "Third-Party Payment Gateways"
    description: "External systems handling payment processing."
  - type: "externalSystem"
    name: "Third-Party Shipping APIs"
    description: "External systems handling order shipping and fulfillment."
  - type: "container"
    name: "AWS CloudFront & WAF"
    technology: "AWS CloudFront, AWS WAF"
    description: "Edge caching, CDN, and security boundary."
  - type: "container"
    name: "Catalog & Search"
    technology: "Amazon ECS/EKS"
    description: "Handles product catalog and search operations."
  - type: "container"
    name: "Personalization Engine"
    technology: "Amazon ECS/EKS, AWS Lambda@Edge"
    description: "Provides personalized recommendations for users."
  - type: "container"
    name: "Checkout/Payment"
    technology: "Amazon ECS/EKS"
    description: "Manages secure checkout and payment processing."
  - type: "container"
    name: "Localization/Currency"
    technology: "Amazon ECS/EKS"
    description: "Handles multi-currency support and localization."
  - type: "container"
    name: "Notification Container"
    technology: "Amazon ECS/EKS, AWS SQS/SNS"
    description: "Sends notifications and asynchronous messages."
relationships:
  - source: "Book Buyer"
    destination: "AWS CloudFront & WAF"
    description: "Accesses the platform securely via edge"
    technology: "HTTPS (TLS 1.3)"
  - source: "Store Administrator & Author/Publisher Partner"
    destination: "AWS CloudFront & WAF"
    description: "Manages catalogues and platform administration"
    technology: "HTTPS"
  - source: "AWS CloudFront & WAF"
    destination: "Catalog & Search"
    description: "Routes requests to core services"
    technology: "HTTPS / mTLS over AWS App Mesh"
  - source: "AWS CloudFront & WAF"
    destination: "Personalization Engine"
    description: "Routes recommendation requests"
    technology: "HTTPS / mTLS over AWS App Mesh"
  - source: "AWS CloudFront & WAF"
    destination: "Checkout/Payment"
    description: "Routes secure checkout requests"
    technology: "HTTPS / mTLS over AWS App Mesh"
  - source: "AWS CloudFront & WAF"
    destination: "Localization/Currency"
    description: "Routes localization requests"
    technology: "HTTPS / mTLS over AWS App Mesh"
  - source: "Checkout/Payment"
    destination: "Third-Party Payment Gateways"
    description: "Processes secure transactions"
    technology: "Secure REST APIs"
  - source: "Checkout/Payment"
    destination: "Third-Party Shipping APIs"
    description: "Dispatches shipping and fulfillment orders"
    technology: "HTTPS"
  - source: "Notification Container"
    destination: "Third-Party Shipping APIs"
    description: "Sends fulfillment and notification updates"
    technology: "HTTPS"