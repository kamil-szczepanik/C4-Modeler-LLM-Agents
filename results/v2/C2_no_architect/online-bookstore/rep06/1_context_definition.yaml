level: context
scope: "System Context diagram for Global E-Commerce Book Platform"
system:
  name: "Global E-Commerce Book Platform"
  description: "An Amazon-style global e-commerce platform designed to sell physical and electronic books with integrated reviews, recommendations, and multi-currency support."
elements:
  - type: "person"
    name: "Book Buyer"
    description: "Primary customer interacting via web/mobile frontends for catalogue browsing, checkout, and reviews."
  - type: "person"
    name: "Store Administrator & Author/Publisher Partner"
    description: "Administrative users managing catalogues, permissions, and analytics."
  - type: "externalSystem"
    name: "Third-Party Payment Gateways"
    description: "External systems handling payment processing."
  - type: "externalSystem"
    name: "Shipping APIs"
    description: "External systems handling order shipping and fulfillment."
  - type: "externalSystem"
    name: "AWS CloudFront & WAF"
    description: "Edge caching and security boundary."
relationships:
  - source: "Book Buyer"
    destination: "Global E-Commerce Book Platform"
    description: "HTTPS for catalogue browsing, checkout, and reviews"
    technology: "HTTPS (TLS 1.3)"
  - source: "Store Administrator & Author/Publisher Partner"
    destination: "Global E-Commerce Book Platform"
    description: "Manages catalogues, permissions, and analytics"
    technology: "HTTPS"
  - source: "Global E-Commerce Book Platform"
    destination: "Third-Party Payment Gateways"
    description: "Processes payments with client-side tokenization"
    technology: "HTTPS (TLS 1.2+)"
  - source: "Global E-Commerce Book Platform"
    destination: "Shipping APIs"
    description: "Asynchronous messaging for shipping and fulfillment"
    technology: "Amazon SQS and HTTPS"