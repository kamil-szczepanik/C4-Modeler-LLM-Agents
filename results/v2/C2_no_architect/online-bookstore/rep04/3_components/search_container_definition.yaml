level: component
scope: "Component diagram for the Search Container container"
parentContainer:
  name: "Search Container"
elements:
  - type: "component"
    name: "Search Controller"
    technology: "Amazon ECS on AWS Fargate (Java/Spring Boot)"
    description: "Receives search requests from the Application Load Balancer, handles input validation, and coordinates cache checks and OpenSearch queries."
  - type: "component"
    name: "Cache Service"
    technology: "Amazon ElastiCache (Redis Client)"
    description: "Checks and populates the Redis caching layer for frequent search queries."
  - type: "component"
    name: "Search Service"
    technology: "Amazon OpenSearch Client"
    description: "Queries the managed AWS OpenSearch cluster for product catalogues and facets."
  - type: "component"
    name: "Telemetry Emitter"
    technology: "AWS SDK / SQS & SNS Client"
    description: "Emits anonymous search telemetry and zero-result events asynchronously to the SQS/SNS pipeline."
  - type: "component"
    name: "Security Manager"
    technology: "AWS Secrets Manager & AWS KMS SDK"
    description: "Retrieves secrets and decrypts data securely for compliance and authentication."
relationships:
  - source: "Search Controller"
    destination: "Cache Service"
    description: "Checks cache for frequent search queries [Redis Protocol / TLS]"
  - source: "Search Controller"
    destination: "Search Service"
    description: "Forwards cache-miss search requests and queries product catalogue [HTTPS]"
  - source: "Search Service"
    destination: "Telemetry Emitter"
    description: "Triggers telemetry emission for zero-result and search events"
  - source: "Search Controller"
    destination: "Security Manager"
    description: "Retrieves secrets and decrypts data [HTTPS]"