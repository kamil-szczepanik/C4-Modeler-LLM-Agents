level: component
scope: "Component diagram for the Checkout Container container"
parentContainer:
  name: "Checkout Container"
elements:
  - type: "component"
    name: "Checkout Container"
    technology: "Amazon ECS on AWS Fargate"
    description: "Executes secure payment flows, localized tax calculations, and cart recovery event dispatching."
  - type: "person"
    name: "Book Buyer"
    technology: "User"
    description: "Primary user executing secure, multi-currency transactions."
  - type: "container"
    name: "Application Load Balancer (ALB)"
    technology: "AWS ALB"
    description: "Routes incoming requests to the Checkout Container via mTLS."
  - type: "system"
    name: "External Payment Gateways & Shipping Providers"
    technology: "Third-party APIs"
    description: "Third-party APIs processing financial transactions and physical fulfillment."
  - type: "container"
    name: "Amazon SQS/SNS with DLQs"
    technology: "Amazon SQS / SNS"
    description: "Asynchronous messaging backbone for cart recovery and failed fulfillment retries."
  - type: "container"
    name: "AWS Secrets Manager & AWS KMS"
    technology: "AWS Secrets Manager, AWS KMS"
    description: "Manages encryption keys and injects runtime secrets."
relationships:
  - source: "Application Load Balancer (ALB)"
    destination: "Checkout Container"
    description: "Routes encrypted checkout requests [gRPC / mTLS over AWS App Mesh / ECS Service Connect]."
  - source: "Checkout Container"
    destination: "External Payment Gateways & Shipping Providers"
    description: "Transmits tokenized payment payloads and fulfillment data [HTTPS / TLS 1.3 with circuit breakers]."
  - source: "Checkout Container"
    destination: "Amazon SQS/SNS with DLQs"
    description: "Dispatches asynchronous cart recovery and failed fulfillment events [AWS SDK / HTTPS]."
  - source: "Checkout Container"
    destination: "AWS Secrets Manager & AWS KMS"
    description: "Retrieves runtime secrets and performs envelope encryption [HTTPS]."