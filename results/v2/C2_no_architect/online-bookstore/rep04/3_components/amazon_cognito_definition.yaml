    name: "User Pool Manager"
    technology: "Amazon Cognito User Pools"
    description: "Manages user identities, directories, and profiles for book buyers and site administrators."
  - type: "component"
    name: "Federation and Identity Provider"
    technology: "OIDC / SAML / OAuth 2.0"
    description: "Handles federated identity and social logins to support cross-region availability."
  - type: "component"
    name: "Adaptive MFA Handler"
    technology: "Amazon Cognito Advanced Security"
    description: "Provides adaptive multi-factor authentication to secure user sessions."
relationships:
  - source: "Federation and Identity Provider"
    destination: "User Pool Manager"
    description: "Authenticates users and maps tokens to"
  - source: "User Pool Manager"
    destination: "Adaptive MFA Handler"
    description: "Triggers security challenges via"