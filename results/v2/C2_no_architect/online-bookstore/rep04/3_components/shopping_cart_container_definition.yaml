level: component
scope: "Component diagram for the Shopping Cart Container container"
parentContainer:
  name: "Shopping Cart Container"
elements:
  - type: "component"
    name: "Shopping Cart Controller"
    technology: "AWS Fargate / ECS / gRPC over TLS"
    description: "Manages ingress requests routed from the Application Load Balancer, handling cart operations and user interactions."
  - type: "component"
    name: "Cart Business Logic & Merging Service"
    technology: "Node.js / Python Container Service"
    description: "Handles cart state business logic, guest-to-authenticated cart merging, and compliance rules for GDPR and CCPA."
  - type: "component"
    name: "Redis State Persistence Handler"
    technology: "Amazon ElastiCache (Redis) Client & Lua Scripts"
    description: "Executes atomic Redis Lua scripts for fast state persistence, retrieval, and multi-AZ replication."
  - type: "component"
    name: "Event Publisher"
    technology: "Amazon SQS/SNS Client with AWS KMS"
    description: "Publishes pseudonymized asynchronous cart update and abandonment events to the event broker."
relationships:
  - source: "Shopping Cart Controller"
    destination: "Cart Business Logic & Merging Service"
    description: "Delegates validated ingress requests for processing [gRPC over TLS]"
  - source: "Cart Business Logic & Merging Service"
    destination: "Redis State Persistence Handler"
    description: "Persists and merges cart state using atomic operations [In-transit TLS]"
  - source: "Cart Business Logic & Merging Service"
    destination: "Event Publisher"
    description: "Triggers asynchronous cart and abandonment events [Encrypted AWS KMS channels]"