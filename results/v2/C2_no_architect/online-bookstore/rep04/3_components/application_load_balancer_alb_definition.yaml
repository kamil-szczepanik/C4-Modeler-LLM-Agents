level: component
scope: "Component diagram for the Application Load Balancer (ALB) container"
parentContainer:
  name: "Application Load Balancer (ALB)"
elements:
  - type: "component"
    name: "TLS Termination & Routing Engine"
    technology: "AWS ALB"
    description: "Handles TLS termination using AWS ACM (TLS 1.3), performs header-based routing, and manages traffic flow."
  - type: "component"
    name: "Authentication Offloader"
    technology: "Amazon Cognito Integration"
    description: "Offloads JWT validation and handles OIDC/OAuth 2.0 identity verification."
  - type: "component"
    name: "Header Injector"
    technology: "ALB Native Middleware"
    description: "Forwards validated identity claims via injected headers such as X-User-ID and X-User-Roles to backend services."
relationships:
  - source: "TLS Termination & Routing Engine"
    destination: "Authentication Offloader"
    description: "Delegates token validation"
  - source: "Authentication Offloader"
    destination: "Header Injector"
    description: "Passes validated claims"