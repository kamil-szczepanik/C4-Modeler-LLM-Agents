# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "A scaled-down Amazon-style e-commerce system designed to provide scalable book browsing, secure checkout, recommendations, and reviews."
elements:
  - type: "person"
    name: "Book Buyer"
    description: "Customer who browses the catalogue, makes purchases, leaves reviews, and receives recommendations."
  - type: "person"
    name: "Site Administrator"
    description: "Moderator who manages content and system administration."
  - type: "externalSystem"
    name: "Payment Gateway & Shipping Provider API"
    description: "External APIs for processing payments and managing product shipments."
  - type: "externalSystem"
    name: "Book Publishers & Distributors"
    description: "Suppliers who provide inventory feeds asynchronously."
  - type: "externalSystem"
    name: "Analytics & CDP System"
    description: "System that receives pseudonymized telemetry with client-side consent gating."
  - type: "externalSystem"
    name: "Global CDN/WAF & AWS Multi-Region Infrastructure"
    description: "Infrastructure providing global content delivery, web application firewalling, and multi-region deployment."
relationships:
  - source: "Book Buyer"
    destination: "Global CDN/WAF & AWS Multi-Region Infrastructure"
    description: "Accesses catalogue and system via Global CDN/WAF"
    technology: "HTTPS/TLS 1.3"
  - source: "Online Bookstore"
    destination: "Payment Gateway & Shipping Provider API"
    description: "Integrates for payment processing and shipping fulfillment"
    technology: "mTLS and asynchronous queuing"
  - source: "Book Publishers & Distributors"
    destination: "Online Bookstore"
    description: "Supplies inventory feeds asynchronously"
    technology: "Amazon EventBridge"
  - source: "Online Bookstore"
    destination: "Analytics & CDP System"
    description: "Sends pseudonymized telemetry data"
    technology: "Client-side consent gating / HTTPS"