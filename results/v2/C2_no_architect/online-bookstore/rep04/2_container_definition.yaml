level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Book Buyer"
    description: "Customer who browses the catalogue and makes purchases."
  - type: "person"
    name: "Site Administrator"
    description: "Moderator who manages content and system administration."
  - type: "externalSystem"
    name: "Global CDN & AWS WAF"
    description: "Global content delivery network and web application firewall."
  - type: "externalSystem"
    name: "External Payment Gateways, Shipping Providers, and Book Publishers"
    description: "External services for processing payments, managing shipments, and receiving publisher data."
  - type: "container"
    name: "Global CDN & AWS WAF"
    technology: "AWS WAF / CloudFront"
    description: "Provides global content delivery and web application firewall protection."
  - type: "container"
    name: "Application Load Balancer (ALB)"
    technology: "AWS ALB"
    description: "Routes incoming traffic to backend ECS containers."
  - type: "container"
    name: "Search Container"
    technology: "Amazon ECS on AWS Fargate"
    description: "Supports scalable book discovery and search functionality."
  - type: "container"
    name: "Recommendations Container"
    technology: "Amazon ECS on AWS Fargate"
    description: "Provides book recommendations to users."
  - type: "container"
    name: "Checkout Container"
    technology: "Amazon ECS on AWS Fargate"
    description: "Handles secure multi-currency checkout workflows."
  - type: "container"
    name: "Shopping Cart Container"
    technology: "Amazon ECS on AWS Fargate"
    description: "Manages user shopping cart items and state."
  - type: "container"
    name: "Amazon Cognito"
    technology: "Amazon Cognito (OIDC / OAuth 2.0)"
    description: "Handles authentication and session management."
  - type: "container"
    name: "Amazon SQS/SNS with DLQs"
    technology: "Amazon SQS / SNS"
    description: "Handles asynchronous event messaging with Dead-Letter Queues."
  - type: "container"
    name: "AWS Secrets Manager & AWS KMS"
    technology: "AWS Secrets Manager / AWS KMS"
    description: "Manages runtime credentials and encryption keys."
relationships:
  - source: "Book Buyer"
    destination: "Global CDN & AWS WAF"
    description: "Accesses catalogue and system"
    technology: "HTTPS"
  - source: "Site Administrator"
    destination: "Global CDN & AWS WAF"
    description: "Accesses administration system"
    technology: "HTTPS"
  - source: "Global CDN & AWS WAF"
    destination: "Application Load Balancer (ALB)"
    description: "Forwards verified traffic"
    technology: "HTTPS"
  - source: "Application Load Balancer (ALB)"
    destination: "Search Container"
    description: "Routes search requests"
    technology: "HTTP/REST"
  - source: "Application Load Balancer (ALB)"
    destination: "Recommendations Container"
    description: "Routes recommendation requests"
    technology: "HTTP/REST"
  - source: "Application Load Balancer (ALB)"
    destination: "Checkout Container"
    description: "Routes checkout requests"
    technology: "gRPC"
  - source: "Application Load Balancer (ALB)"
    destination: "Shopping Cart Container"
    description: "Routes shopping cart requests"
    technology: "gRPC"
  - source: "Checkout Container"
    destination: "External Payment Gateways, Shipping Providers, and Book Publishers"
    description: "Processes payments and shipping fulfillment"
    technology: "HTTPS with circuit breakers"
  - source: "Search Container"
    destination: "AWS Secrets Manager & AWS KMS"
    description: "Retrieves secrets and encryption keys"
    technology: "HTTPS"
  - source: "Checkout Container"
    destination: "AWS Secrets Manager & AWS KMS"
    description: "Retrieves secrets and encryption keys"
    technology: "HTTPS"
  - source: "Shopping Cart Container"
    destination: "Amazon SQS/SNS with DLQs"
    description: "Publishes asynchronous events"
    technology: "Encrypted AWS KMS channels"