level: component
scope: "Component diagram for the Catalog Container container"
parentContainer:
  name: "Catalog Container"
elements:
  - type: "component"
    name: "Catalog Controller"
    technology: "Amazon EKS / Microservices"
    description: "Handles incoming catalog and product metadata HTTP/HTTPS requests from the API Gateway."
  - type: "component"
    name: "Search Query Processor"
    technology: "AWS OpenSearch Integration"
    description: "Queries AWS OpenSearch for high-performance product metadata and pre-calculated regional pricing."
  - type: "component"
    name: "Recommendation Data Consumer"
    technology: "Microservice Internal API"
    description: "Consumes and supplies catalog data for the Recommendation Engine Container via mTLS."
relationships:
  - source: "Catalog Controller"
    destination: "Search Query Processor"
    description: "Fetches product metadata and pricing"
  - source: "Recommendation Data Consumer"
    destination: "Catalog Controller"
    description: "Retrieves catalog data via mTLS"