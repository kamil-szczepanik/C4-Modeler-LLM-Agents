level: component
scope: "Component diagram for the Recommendation Engine Container container"
parentContainer:
  name: "Recommendation Engine Container"
elements:
  - type: "component"
    name: "Recommendation Engine Core"
    technology: "Amazon EKS Microservice"
    description: "Core microservice that delivers personalized, privacy-compliant book recommendations."
  - type: "component"
    name: "Redis Sidecar"
    technology: "Redis"
    description: "Caches pre-computed recommendations and user affinity profiles for sub-200ms response times."
  - type: "component"
    name: "Istio Service Mesh"
    technology: "Istio"
    description: "Manages mTLS, traffic routing, and circuit breaking for the container."
relationships:
  - source: "Istio Service Mesh"
    destination: "Recommendation Engine Core"
    description: "Routes internal inference requests via mTLS"
  - source: "Recommendation Engine Core"
    destination: "Redis Sidecar"
    description: "Retrieves cached recommendations [TCP / AES-256]"