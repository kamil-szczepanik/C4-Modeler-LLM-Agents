level: component
scope: "Component diagram for the Checkout/Payment Container container"
parentContainer:
  name: "Checkout/Payment Container"
elements:
  - type: "component"
    name: "Payment Controller"
    technology: "Spring Web / REST"
    description: "Handles incoming checkout and payment initiation requests from the API Gateway."
  - type: "component"
    name: "Transaction Engine"
    technology: "Java / Microservice Component"
    description: "Processes secure transactions, ensures idempotency, and manages multi-currency logic."
  - type: "component"
    name: "Payment Gateway Client"
    technology: "HTTPS Client with Circuit Breakers"
    description: "Authorizes payments and communicates securely with external Third-Party Payment APIs."
  - type: "component"
    name: "Localization Integration Component"
    technology: "gRPC / REST Client"
    description: "Retrieves localized pricing and tax calculations from the Currency Localization Container."
  - type: "component"
    name: "Secrets Manager Client"
    technology: "AWS SDK with IRSA / IAM"
    description: "Fetches encrypted API credentials dynamically from AWS Secrets Manager."
relationships:
  - source: "Payment Controller"
    destination: "Transaction Engine"
    description: "Delegates checkout requests and transactional payloads"
  - source: "Transaction Engine"
    destination: "Payment Gateway Client"
    description: "Initiates payment authorization"
  - source: "Transaction Engine"
    destination: "Localization Integration Component"
    description: "Requests localized totals and taxes"
  - source: "Transaction Engine"
    destination: "Secrets Manager Client"
    description: "Fetches runtime credentials securely"