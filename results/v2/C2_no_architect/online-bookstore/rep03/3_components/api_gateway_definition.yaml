level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Ingress Router"
    technology: "Istio / AWS App Mesh Ingress"
    description: "Manages ingress routing, edge geo-routing, and incoming HTTPS requests."
  - type: "component"
    name: "Rate Limiter"
    technology: "Istio Service Mesh / AWS WAF Integration"
    description: "Enforces rate limiting and filters web traffic to protect downstream services."
  - type: "component"
    name: "Authentication & Token Verifier"
    technology: "AWS KMS / Istio Security"
    description: "Verifies and signs cryptographic JWS tokens for internal identity propagation."
relationships:
  - source: "Ingress Router"
    destination: "Rate Limiter"
    description: "Forwards web traffic for inspection and rate limiting [HTTPS]"
  - source: "Rate Limiter"
    destination: "Authentication & Token Verifier"
    description: "Delegates token verification for sanitized requests [Internal AWS API]"