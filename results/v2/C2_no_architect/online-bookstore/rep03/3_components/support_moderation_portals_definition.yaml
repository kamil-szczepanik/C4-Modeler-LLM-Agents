level: component
scope: "Component diagram for the Support/Moderation Portals container"
parentContainer:
  name: "Support/Moderation Portals"
elements:
  - type: "component"
    name: "Customer Support Agent"
    technology: "Human User"
    description: "Accesses portal via HTTPS with Zero-Trust VPN/MFA to manage user disputes, reviews, and GDPR/CCPA data requests."
  - type: "component"
    name: "Content Moderator"
    technology: "Human User"
    description: "Accesses portal via HTTPS with Zero-Trust VPN/MFA to moderate user content and reviews."
  - type: "component"
    name: "Support/Moderation Portals Container"
    technology: "Amazon EKS"
    description: "Provides isolated container deployment for internal support and moderation services."
  - type: "component"
    name: "Internal Application Load Balancer"
    technology: "AWS ALB"
    description: "Routes internal staff traffic securely to the portals."
  - type: "component"
    name: "AWS IAM Identity Center"
    technology: "OIDC/SAML"
    description: "Delivers authentication and step-up MFA."
  - type: "component"
    name: "AWS KMS"
    technology: "AWS KMS"
    description: "Handles field-level encryption at rest for PII."
  - type: "component"
    name: "AWS Systems Manager Session Manager"
    technology: "AWS SSM"
    description: "Enables ephemeral, JIT break-glass access."
  - type: "component"
    name: "Istio Service Mesh"
    technology: "Istio"
    description: "Enforces zero-trust microsegmentation, mTLS communication, and regional data isolation."
relationships:
  - source: "Customer Support Agent"
    destination: "Internal Application Load Balancer"
    description: "Accesses portal via HTTPS with Zero-Trust VPN/MFA"
  - source: "Content Moderator"
    destination: "Internal Application Load Balancer"
    description: "Accesses portal via HTTPS with Zero-Trust VPN/MFA"
  - source: "Internal Application Load Balancer"
    destination: "Support/Moderation Portals Container"
    description: "Routes internal staff traffic"
  - source: "Support/Moderation Portals Container"
    destination: "Istio Service Mesh"
    description: "Enforces mTLS and regional data isolation"