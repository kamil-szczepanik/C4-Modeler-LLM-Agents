level: component
scope: "Component diagram for the Currency Localization Container container"
parentContainer:
  name: "Currency Localization Container"
elements:
  - type: "component"
    name: "Currency Localization Container"
    technology: "Amazon EKS, Container"
    description: "Core microservice handling currency conversion logic, geo-IP fallback, and multi-currency pricing."
  - type: "component"
    name: "Global Shopper"
    technology: "Web Browser / Client"
    description: "End-user browsing catalogue and executing secure checkouts."
  - type: "component"
    name: "Site Administrator"
    technology: "Secure Portal / Web UI"
    description: "Manages exchange-rate overrides and operational configurations."
  - type: "component"
    name: "API Gateway"
    technology: "API Gateway / Istio service mesh"
    description: "Routes internal requests via mTLS."
  - type: "component"
    name: "Redis Cache"
    technology: "Redis, In-memory cache"
    description: "Low-latency store for cached exchange rates and geo-IP mapping data."
  - type: "component"
    name: "Third-Party Financial APIs"
    technology: "External REST API"
    description: "External providers supplying daily exchange rates."
  - type: "component"
    name: "AWS KMS"
    technology: "AWS KMS"
    description: "Encryption service for securing data at rest."
relationships:
  - source: "API Gateway"
    destination: "Currency Localization Container"
    description: "Routes internal requests via mTLS [Istio service mesh]."
  - source: "Currency Localization Container"
    destination: "Redis Cache"
    description: "Retrieves and caches exchange rates [TCP]."
  - source: "Currency Localization Container"
    destination: "Third-Party Financial APIs"
    description: "Fetches daily exchange rates [TLS 1.3 with egress filtering]."
  - source: "Site Administrator"
    destination: "Currency Localization Container"
    description: "Executes administrative overrides via secure portal [HTTPS/JWT]."