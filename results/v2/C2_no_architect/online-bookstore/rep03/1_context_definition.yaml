level: context
scope: "System Context diagram for Global E-Commerce Platform"
system:
  name: "Global E-Commerce Platform"
  description: "An Amazon-style global e-commerce platform for purchasing physical and electronic books, supporting multi-currency transactions, personalized recommendations, and reviews."
elements:
  - type: "person"
    name: "Customer (Shopper)"
    description: "End user who browses, purchases physical and electronic books, and leaves reviews."
  - type: "person"
    name: "Site Administrator"
    description: "Internal user who manages workflows, administration, and platform operations."
  - type: "externalSystem"
    name: "Warehouse / Fulfillment Partner"
    description: "Third-party partner responsible for physical book shipping and fulfillment."
  - type: "externalSystem"
    name: "Third-Party Payment APIs"
    description: "External systems handling multi-currency financial transactions and payments."
  - type: "externalSystem"
    name: "AWS CloudFront"
    description: "CDN with Lambda@Edge providing global edge caching and performance."
  - type: "externalSystem"
    name: "AWS WAF"
    description: "Web Application Firewall protecting incoming customer traffic."
  - type: "externalSystem"
    name: "AWS ECS / EKS"
    description: "Microservices container platform deployed across multiple regions."
  - type: "externalSystem"
    name: "AWS KMS"
    description: "Key Management Service for data-at-rest encryption and compliance."
relationships:
  - source: "Customer (Shopper)"
    destination: "Global E-Commerce Platform"
    description: "Interacts via HTTPS through AWS CloudFront and AWS WAF"
    technology: "HTTPS (TLS 1.3)"
  - source: "Site Administrator"
    destination: "Global E-Commerce Platform"
    description: "Accesses internal workflows via secure endpoints"
    technology: "RBAC and MFA-secured HTTPS"
  - source: "Global E-Commerce Platform"
    destination: "Warehouse / Fulfillment Partner"
    description: "Connects asynchronously via encrypted AWS queues for shipping"
    technology: "Encrypted AWS Queues / Third-Party APIs"
  - source: "Global E-Commerce Platform"
    destination: "Third-Party Payment APIs"
    description: "Processes multi-currency transactions securely"
    technology: "HTTPS / REST APIs"