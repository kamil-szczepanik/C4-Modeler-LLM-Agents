level: container
scope: "Container diagram for Global E-Commerce Platform"
system:
  name: "Global E-Commerce Platform"
elements:
  - type: "person"
    name: "Customer (Shopper)"
    description: "End user who browses the catalogue and executes secure checkout."
  - type: "person"
    name: "Site Administrator"
    description: "Internal user who manages site administration."
  - type: "person"
    name: "Content Moderator"
    description: "Internal user who moderates content on the platform."
  - type: "person"
    name: "Customer Support Agent"
    description: "Internal user who handles customer support inquiries."
  - type: "externalSystem"
    name: "Warehouse / Fulfillment Partner"
    description: "Third-party partner responsible for shipping and fulfillment."
  - type: "externalSystem"
    name: "Third-Party Payment APIs"
    description: "External systems handling financial transactions and payments."
  - type: "externalSystem"
    name: "AWS CloudFront"
    description: "CDN providing global edge caching and performance."
  - type: "externalSystem"
    name: "AWS WAF"
    description: "Web Application Firewall protecting incoming customer traffic."
  - type: "container"
    name: "API Gateway"
    description: "Routes internal requests using mTLS via service mesh."
    technology: "Istio / AWS App Mesh"
  - type: "container"
    name: "Catalog Container"
    description: "Manages the product and book catalog workloads."
    technology: "Amazon EKS / Microservices"
  - type: "container"
    name: "Recommendation Engine Container"
    description: "Provides personalized book recommendations to users."
    technology: "Amazon EKS / Microservices"
  - type: "container"
    name: "Checkout/Payment Container"
    description: "Handles sensitive payment and checkout processes."
    technology: "Amazon EKS / Microservices"
  - type: "container"
    name: "Currency Localization Container"
    description: "Handles multi-currency conversions and localization."
    technology: "Amazon EKS / Microservices"
  - type: "container"
    name: "Support/Moderation Portals"
    description: "Provides interfaces for customer support and content moderation."
    technology: "Amazon EKS / Web Portals"
relationships:
  - source: "Customer (Shopper)"
    destination: "AWS CloudFront"
    description: "Browses catalogue and executes secure checkout"
    technology: "HTTPS"
  - source: "AWS CloudFront"
    destination: "API Gateway"
    description: "Forwards regional traffic using HTTPS"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Catalog Container"
    description: "Routes internal requests"
    technology: "mTLS via service mesh"
  - source: "API Gateway"
    destination: "Recommendation Engine Container"
    description: "Routes internal requests"
    technology: "mTLS via service mesh"
  - source: "API Gateway"
    destination: "Checkout/Payment Container"
    description: "Routes internal requests"
    technology: "mTLS via service mesh"
  - source: "API Gateway"
    destination: "Currency Localization Container"
    description: "Routes internal requests"
    technology: "mTLS via service mesh"
  - source: "API Gateway"
    destination: "Support/Moderation Portals"
    description: "Routes internal requests"
    technology: "mTLS via service mesh"
  - source: "Checkout/Payment Container"
    destination: "Third-Party Payment APIs"
    description: "Integrates with payment APIs using circuit breakers"
    technology: "HTTPS with circuit breakers"
  - source: "Catalog Container"
    destination: "Warehouse / Fulfillment Partner"
    description: "Integrates with shipping partners"
    technology: "HTTPS with circuit breakers"