level: component
scope: "Component diagram for the PostgreSQL/MySQL Hybrid Databases container"
parentContainer:
  name: "PostgreSQL/MySQL Hybrid Databases"
elements:
  - type: "component"
    name: "Patroni/Orchestrator Replication Manager"
    technology: "Patroni / Orchestrator"
    description: "Manages semi-synchronous replication and automated failover for the database instances."
  - type: "component"
    name: "PgBouncer Connection Pooler"
    technology: "PgBouncer"
    description: "Handles connection pooling to optimize database performance and concurrency."
  - type: "component"
    name: "Audit Logger"
    technology: "pgaudit / Syslog"
    description: "Generates and streams database audit logs to WORM-compliant storage."
relationships:
  - source: "Patroni/Orchestrator Replication Manager"
    destination: "PgBouncer Connection Pooler"
    description: "Maintains high availability across database nodes serving connections"
  - source: "PgBouncer Connection Pooler"
    destination: "Audit Logger"
    description: "Transmits database transaction and access records"