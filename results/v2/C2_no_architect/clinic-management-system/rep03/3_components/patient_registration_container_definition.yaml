level: component
scope: "Component diagram for the Patient Registration Container container"
parentContainer:
  name: "Patient Registration Container"
elements:
  - type: "component"
    name: "Registration API Controller"
    technology: "Kubernetes Microservice / REST"
    description: "Manages patient admissions, onboarding, and demographic data capture requests from front-end users."
  - type: "component"
    name: "Registration Service"
    technology: "Business Logic Engine"
    description: "Enforces HIPAA and GDPR compliance, handling registration workflows and separating patient registration from downstream clinical workflows."
  - type: "component"
    name: "Audit Logging Client"
    technology: "gRPC/TLS"
    description: "Sends asynchronous audit logs to WORM-compliant log storage."
relationships:
  - source: "Registration API Controller"
    destination: "Registration Service"
    description: "Processes workflows and validates demographic data"
  - source: "Registration Service"
    destination: "Audit Logging Client"
    description: "Dispatches compliance and audit events asynchronously"