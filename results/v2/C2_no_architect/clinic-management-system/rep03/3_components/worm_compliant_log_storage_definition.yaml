level: component
scope: "Component diagram for the WORM-Compliant Log Storage container"
parentContainer:
  name: "WORM-Compliant Log Storage"
elements:
  - type: "component"
    name: "Metadata Indexing Layer"
    technology: "PostgreSQL/MySQL Hybrid Databases"
    description: "Indexes audit log metadata for efficient querying and reporting while maintaining immutability guarantees."
  - type: "component"
    name: "Local-Buffering Proxy"
    technology: "Edge-Buffering Proxy with TPM/HSM-backed edge encryption"
    description: "Buffers asynchronous audit logs locally during intermittent network disconnections before forwarding securely."
relationships:
  - source: "Local-Buffering Proxy"
    destination: "Metadata Indexing Layer"
    description: "Indexes incoming asynchronous audit logs [gRPC/TLS with mTLS]"