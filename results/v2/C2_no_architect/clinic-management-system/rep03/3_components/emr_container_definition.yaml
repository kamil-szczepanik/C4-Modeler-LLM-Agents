level: component
scope: "Component diagram for the EMR Container container"
parentContainer:
  name: "EMR Container"
elements:
  - type: "component"
    name: "EMR API Controller"
    technology: "Spring Boot / REST"
    description: "Exposes endpoints for electronic medical records management and patient history retrieval."
  - type: "component"
    name: "EMR Business Logic Service"
    technology: "Java / Microservice"
    description: "Handles core clinical logic, medical record validation, and data processing."
  - type: "component"
    name: "Encryption & Persistence Module"
    technology: "Hibernate / AES-256"
    description: "Manages secure data encryption and communication with the hybrid databases."
relationships:
  - source: "EMR API Controller"
    destination: "EMR Business Logic Service"
    description: "Delegates request processing"
  - source: "EMR Business Logic Service"
    destination: "Encryption & Persistence Module"
    description: "Persists and retrieves encrypted medical records"