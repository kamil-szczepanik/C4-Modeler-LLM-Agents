level: component
scope: "Component diagram for the HL7 FHIR Interoperability Engine container"
parentContainer:
  name: "HL7 FHIR Interoperability Engine"
elements:
  - type: "component"
    name: "FHIR API Router"
    technology: "Node.js / Express with SMART-on-FHIR"
    description: "Routes incoming HL7 FHIR REST API requests and validates OAuth 2.0 / SMART-on-FHIR tokens."
  - type: "component"
    name: "mTLS Communication Handler"
    technology: "Istio Service Mesh / Envoy Proxy"
    description: "Manages secure mutual TLS (mTLS) connections for exchanging diagnostic and imaging data with external systems."
  - type: "component"
    name: "Data Transformation Service"
    technology: "TypeScript / FHIR Validator Library"
    description: "Transforms internal data models into standardized HL7 FHIR resources for clinical interoperability."
relationships:
  - source: "FHIR API Router"
    destination: "Data Transformation Service"
    description: "Forwards validated payloads for mapping"
  - source: "Data Transformation Service"
    destination: "mTLS Communication Handler"
    description: "Dispatches standardized FHIR resources"
  - source: "mTLS Communication Handler"
    destination: "External Lab Systems"
    description: "Exchanges diagnostic data via HTTPS/HL7 FHIR REST APIs with mTLS"
  - source: "mTLS Communication Handler"
    destination: "External Imaging Systems"
    description: "Exchanges imaging data via HTTPS/HL7 FHIR REST APIs with mTLS"