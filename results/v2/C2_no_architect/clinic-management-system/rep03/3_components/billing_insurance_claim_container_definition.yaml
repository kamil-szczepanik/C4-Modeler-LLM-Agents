level: component
scope: "Component diagram for the Billing & Insurance Claim Container container"
parentContainer:
  name: "Billing & Insurance Claim Container"
elements:
  - type: "component"
    name: "Claim Validation Controller"
    technology: "Microservice REST API / OpenAPI"
    description: "Handles incoming HTTP requests, validates claim schemas, and enforces RBAC for billing officers."
  - type: "component"
    name: "Claim Processing Service"
    technology: "Business Logic Microservice"
    description: "Core logic for processing financial transactions, managing claim submissions, and integrating with external clearinghouses."
  - type: "component"
    name: "Encryption Manager"
    technology: "HashiCorp Vault / AWS KMS"
    description: "Handles envelope encryption and AES-256 data protection at rest and message-level encryption."
relationships:
  - source: "Claim Validation Controller"
    destination: "Claim Processing Service"
    description: "Delegates validated claims for processing"
  - source: "Claim Processing Service"
    destination: "Encryption Manager"
    description: "Requests cryptographic operations for data and messages"