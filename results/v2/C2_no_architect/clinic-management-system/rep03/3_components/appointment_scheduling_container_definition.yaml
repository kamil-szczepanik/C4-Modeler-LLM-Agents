level: component
scope: "Component diagram for the Appointment Scheduling Container container"
parentContainer:
  name: "Appointment Scheduling Container"
elements:
  - type: "component"
    name: "Appointment Controller"
    technology: "Spring REST Controller"
    description: "Handles incoming HTTP requests for appointment scheduling and routes authenticated traffic."
  - type: "component"
    name: "Scheduling Service"
    technology: "Java / Spring Boot"
    description: "Contains business logic for scheduling appointments and performs distributed locking checks."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Async Event Publisher"
    description: "Publishes asynchronous messages for SMS and email reminders to the message broker."
relationships:
  - source: "Appointment Controller"
    destination: "Scheduling Service"
    description: "Invokes business logic for schedule creation and validation"
  - source: "Scheduling Service"
    destination: "Redis Redlock"
    description: "Performs distributed locking for concurrent multi-resource clash checks"
  - source: "Scheduling Service"
    destination: "Kafka/RabbitMQ Message Broker"
    description: "Asynchronously decouples SMS/email reminders"
  - source: "Scheduling Service"
    destination: "WORM-Compliant Log Storage"
    description: "Streams audit logs asynchronously via Fluentbit sidecar"