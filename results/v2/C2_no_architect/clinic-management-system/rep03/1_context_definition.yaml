level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "Manages patient admissions, electronic medical records, scheduling, and billing for medium-sized hospitals and clinics, delivering high availability, regulatory compliance, and sub-second clinical workflows."
elements:
  - type: "person"
    name: "Front Desk Staff"
    description: "Manages patient admissions and registration workflows."
  - type: "person"
    name: "Clinicians"
    description: "Accesses and updates electronic medical records and patient workflows."
  - type: "person"
    name: "Billing Officers"
    description: "Handles financial and billing operations."
  - type: "person"
    name: "Patients"
    description: "Receives care and interacts with hospital services."
  - type: "person"
    name: "Patient Portal Users"
    description: "Interacts with portal services for health records and scheduling."
  - type: "externalSystem"
    name: "Lab Systems"
    description: "External laboratory systems for processing and retrieving test results."
  - type: "externalSystem"
    name: "Imaging Systems"
    description: "External imaging systems for storing and retrieving diagnostic scans."
  - type: "container"
    name: "On-Premises Kubernetes Cluster"
    description: "Local clinic operations infrastructure ensuring sub-second EMR performance."
    technology: "Kubernetes"
  - type: "container"
    name: "Cloud Environment"
    description: "Cloud environment deployed in eu-central-1 for data replication and storage."
    technology: "AWS (eu-central-1)"
  - type: "component"
    name: "Patient Registration Service"
    description: "Handles patient admission and onboarding."
    technology: "Microservice"
  - type: "component"
    name: "Scheduling Engine"
    description: "Manages appointments and clinical schedules."
    technology: "Microservice"
  - type: "component"
    name: "EMR Service"
    description: "Processes and stores electronic medical records."
    technology: "Microservice"
  - type: "component"
    name: "Billing Service"
    description: "Processes financial transactions and billing."
    technology: "Microservice"
  - type: "component"
    name: "Event Bus"
    description: "Implements asynchronous, event-driven data pipelines."
    technology: "Apache Kafka / Debezium"
  - type: "component"
    name: "Encrypted Gateways"
    description: "Secures hybrid boundary traffic and transit data."
    technology: "TLS 1.3 & mTLS"
relationships:
  - source: "Front Desk Staff"
    destination: "Clinic Management System"
    description: "Interacts for patient admissions and registration"
    technology: "TLS 1.3 and Multi-Factor Authentication (MFA)"
  - source: "Clinicians"
    destination: "Clinic Management System"
    description: "Interacts for clinical workflows and EMR access"
    technology: "TLS 1.3 and Multi-Factor Authentication (MFA)"
  - source: "Billing Officers"
    destination: "Clinic Management System"
    description: "Interacts for billing and financial operations"
    technology: "TLS 1.3 and Multi-Factor Authentication (MFA)"
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Interacts for care and hospital services"
    technology: "TLS 1.3 and Multi-Factor Authentication (MFA)"
  - source: "Patient Portal Users"
    destination: "Clinic Management System"
    description: "Accesses portal services"
    technology: "TLS 1.3 and Multi-Factor Authentication (MFA)"
  - source: "Clinic Management System"
    destination: "Lab Systems"
    description: "Integrates for lab data exchange"
    technology: "HL7 FHIR APIs over encrypted protocols"
  - source: "Clinic Management System"
    destination: "Imaging Systems"
    description: "Integrates for imaging data exchange"
    technology: "HL7 FHIR APIs over encrypted protocols"
  - source: "On-Premises Kubernetes Cluster"
    destination: "Cloud Environment"
    description: "Replicates asynchronously with field-level encryption for PHI"
    technology: "Kafka/Debezium with AES-256 Envelope Encryption"