level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Front Desk Staff"
    description: "Manages patient admissions and registration workflows."
  - type: "person"
    name: "Clinicians"
    description: "Accesses and updates electronic medical records and patient workflows."
  - type: "person"
    name: "Billing Officers"
    description: "Handles financial and billing operations."
  - type: "person"
    name: "Patients"
    description: "Receives care and interacts with hospital services."
  - type: "person"
    name: "Patient Portal Users"
    description: "Interacts with portal services for health records and scheduling."
  - type: "externalSystem"
    name: "External Lab Systems"
    description: "External laboratory systems for processing and retrieving test results."
  - type: "externalSystem"
    name: "External Imaging Systems"
    description: "External imaging systems for storing and retrieving diagnostic scans."
  - type: "container"
    name: "Ingress Controller"
    description: "Manages incoming traffic with OAuth2/OIDC and MFA enforcement."
    technology: "Kubernetes Ingress / Istio"
  - type: "container"
    name: "Patient Registration Container"
    description: "Handles patient admission and onboarding."
    technology: "Microservice / Kubernetes"
  - type: "container"
    name: "Appointment Scheduling Container"
    description: "Manages appointments and clinical schedules."
    technology: "Microservice / Kubernetes"
  - type: "container"
    name: "EMR Container"
    description: "Processes and stores electronic medical records with asynchronous audit trails."
    technology: "Microservice / Kubernetes"
  - type: "container"
    name: "Billing & Insurance Claim Container"
    description: "Processes financial transactions and insurance claims."
    technology: "Microservice / Kubernetes"
  - type: "container"
    name: "HL7 FHIR Interoperability Engine"
    description: "Facilitates data exchange with external lab and imaging systems."
    technology: "HL7 FHIR REST APIs"
  - type: "container"
    name: "PostgreSQL/MySQL Hybrid Databases"
    description: "Stores relational data securely with AES-256 encryption."
    technology: "PostgreSQL/MySQL (AES-256)"
  - type: "container"
    name: "WORM-Compliant Log Storage"
    description: "Stores immutable audit logs for compliance."
    technology: "WORM Storage"
relationships:
  - source: "Front Desk Staff"
    destination: "Ingress Controller"
    description: "Interacts for patient admissions and registration"
    technology: "HTTPS (TLS 1.3)"
  - source: "Clinicians"
    destination: "Ingress Controller"
    description: "Interacts for clinical workflows and EMR access"
    technology: "HTTPS (TLS 1.3)"
  - source: "Billing Officers"
    destination: "Ingress Controller"
    description: "Interacts for billing and financial operations"
    technology: "HTTPS (TLS 1.3)"
  - source: "Patients"
    destination: "Ingress Controller"
    description: "Interacts for care and hospital services"
    technology: "HTTPS (TLS 1.3)"
  - source: "Patient Portal Users"
    destination: "Ingress Controller"
    description: "Accesses portal services"
    technology: "HTTPS (TLS 1.3)"
  - source: "Ingress Controller"
    destination: "Patient Registration Container"
    description: "Routes authenticated traffic"
    technology: "mTLS (Istio Service Mesh)"
  - source: "Ingress Controller"
    destination: "Appointment Scheduling Container"
    description: "Routes authenticated traffic"
    technology: "mTLS (Istio Service Mesh)"
  - source: "Ingress Controller"
    destination: "EMR Container"
    description: "Routes authenticated traffic"
    technology: "mTLS (Istio Service Mesh)"
  - source: "Ingress Controller"
    destination: "Billing & Insurance Claim Container"
    description: "Routes authenticated traffic"
    technology: "mTLS (Istio Service Mesh)"
  - source: "EMR Container"
    destination: "PostgreSQL/MySQL Hybrid Databases"
    description: "Persists and retrieves encrypted medical records"
    technology: "TCP/AES-256"
  - source: "Patient Registration Container"
    destination: "PostgreSQL/MySQL Hybrid Databases"
    description: "Persists patient registration data"
    technology: "TCP/AES-256"
  - source: "HL7 FHIR Interoperability Engine"
    destination: "External Lab Systems"
    description: "Exchanges lab data"
    technology: "HTTPS/HL7 FHIR REST APIs"
  - source: "HL7 FHIR Interoperability Engine"
    destination: "External Imaging Systems"
    description: "Exchanges imaging data"
    technology: "HTTPS/HL7 FHIR REST APIs"
  - source: "EMR Container"
    destination: "WORM-Compliant Log Storage"
    description: "Sends asynchronous audit logs"
    technology: "gRPC/TLS"
  - source: "Patient Registration Container"
    destination: "WORM-Compliant Log Storage"
    description: "Sends asynchronous audit logs"
    technology: "gRPC/TLS"