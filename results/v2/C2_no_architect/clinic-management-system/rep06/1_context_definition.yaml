level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "Manages patient admissions, electronic medical records, scheduling, and billing for medium-sized hospitals and clinics across a hybrid infrastructure."
elements:
  - type: "person"
    name: "Patient"
    description: "Books appointments and views bills."
  - type: "person"
    name: "Clinician / Doctor"
    description: "Manages electronic medical records with sub-second latency."
  - type: "person"
    name: "Receptionist / Admin"
    description: "Handles administrative tasks and patient admissions within the clinic."
  - type: "person"
    name: "Billing Specialist"
    description: "Submits insurance claims and manages billing."
  - type: "person"
    name: "Compliance Officer"
    description: "Ensures strict HIPAA and GDPR compliance."
  - type: "externalSystem"
    name: "Insurance / Payer System"
    description: "External system for processing insurance claims."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "External systems providing clinical laboratory and imaging data."
  - type: "container"
    name: "On-Premises Kubernetes Cluster"
    description: "Local infrastructure for uninterrupted edge operations during network partitions."
  - type: "container"
    name: "AWS Cloud (eu-central-1)"
    description: "Cloud infrastructure providing scalability for high-availability database replication."
  - type: "container"
    name: "Istio Service Mesh"
    description: "Handles service-to-service authorization and edge termination."
  - type: "container"
    name: "Active-Active Databases"
    description: "Database tier providing high availability and replication."
  - type: "component"
    name: "Patient Registration Module"
    description: "Handles patient admissions and registration data."
  - type: "component"
    name: "Appointment Scheduler"
    description: "Manages scheduling for clinics and hospitals."
  - type: "component"
    name: "EMR Engine"
    description: "Manages electronic medical records with sub-second latency (R-07)."
  - type: "component"
    name: "Billing & Claims Processor"
    description: "Processes billing and submits insurance claims."
  - type: "component"
    name: "Audit Log Service"
    description: "Maintains WORM audit logs and compliance data."
relationships:
  - source: "Patient"
    destination: "Clinic Management System"
    description: "Books appointments and views bills"
    technology: "HTTPS/TLS 1.3"
  - source: "Clinician / Doctor"
    destination: "EMR Engine"
    description: "Manages medical records with sub-second latency"
    technology: "Internal API"
  - source: "Billing Specialist"
    destination: "Billing & Claims Processor"
    description: "Submits insurance claims"
    technology: "OAuth 2.0 and signed JWTs"
  - source: "Clinic Management System"
    destination: "Insurance / Payer System"
    description: "Submits claims via asynchronous queues"
    technology: "Asynchronous Queues / Circuit Breakers"
  - source: "Clinic Management System"
    destination: "Lab & Imaging Systems"
    description: "Integrates using HL7 FHIR APIs"
    technology: "HL7 FHIR over mTLS"