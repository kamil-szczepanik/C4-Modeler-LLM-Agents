level: component
scope: "Component diagram for the on-prem-k8s cluster container"
parentContainer:
  name: "on-prem-k8s cluster"
elements:
  - type: "component"
    name: "Web Frontend"
    technology: "Web Technologies"
    description: "Provides the user interface for clinicians, receptionists, billing specialists, and compliance officers."
  - type: "component"
    name: "Patient Portal / Mobile App"
    technology: "Mobile and Web Technologies"
    description: "Allows patients to access their health records, appointments, and billing information."
  - type: "component"
    name: "API Gateway"
    technology: "OAuth2/OIDC, ABAC"
    description: "Manages incoming traffic, handling authentication and authorization."
  - type: "component"
    name: "EMR Service"
    technology: "gRPC/REST over mTLS, SPIFFE/SPIRE"
    description: "Manages electronic medical records and patient data securely."
  - type: "component"
    name: "Billing / Claims Service"
    technology: "gRPC/REST over mTLS, SPIFFE/SPIRE"
    description: "Handles patient billing, invoicing, and insurance claims processing."
  - type: "component"
    name: "OpenTelemetry sidecars"
    technology: "OpenTelemetry, Prometheus, Grafana"
    description: "Collects and exports telemetry data for SLO-based observability."
  - type: "component"
    name: "Audit Logging sidecars"
    technology: "WORM Storage"
    description: "Captures and securely stores immutable audit logs for compliance."
  - type: "component"
    name: "Dynamic Secrets Manager"
    technology: "HashiCorp Vault, AES-256"
    description: "Manages and provides dynamic secrets and encryption keys."
relationships:
  - source: "Web Frontend"
    destination: "API Gateway"
    description: "Sends HTTPS requests for user interactions"
  - source: "Patient Portal / Mobile App"
    destination: "API Gateway"
    description: "Sends HTTPS requests for patient access"
  - source: "API Gateway"
    destination: "EMR Service"
    description: "Routes authenticated requests using OAuth2/OIDC"
  - source: "API Gateway"
    destination: "Billing / Claims Service"
    description: "Routes billing-related requests"
  - source: "EMR Service"
    destination: "Billing / Claims Service"
    description: "Communicates internally via gRPC/REST over mTLS with SPIFFE/SPIRE"
  - source: "EMR Service"
    destination: "Dynamic Secrets Manager"
    description: "Retrieves secrets and encryption keys"
  - source: "Billing / Claims Service"
    destination: "Dynamic Secrets Manager"
    description: "Retrieves secrets and encryption keys"
  - source: "EMR Service"
    destination: "OpenTelemetry sidecars"
    description: "Emits telemetry metrics and traces"
  - source: "Billing / Claims Service"
    destination: "OpenTelemetry sidecars"
    description: "Emits telemetry metrics and traces"
  - source: "EMR Service"
    destination: "Audit Logging sidecars"
    description: "Writes compliance audit logs"
  - source: "Billing / Claims Service"
    destination: "Audit Logging sidecars"
    description: "Writes compliance audit logs"