level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Ingress Router"
    technology: "Kubernetes Ingress / Envoy"
    description: "Manages ingress routing, TLS 1.3 termination, and entry point for web and mobile clients."
  - type: "component"
    name: "Security Enforcement Module"
    technology: "OAuth2/OIDC & JWT"
    description: "Handles edge authentication, token validation, and security enforcement."
  - type: "component"
    name: "Routing & Dispatcher"
    technology: "gRPC / REST Client"
    description: "Forwards internal requests securely to downstream microservices using mTLS."
  - type: "component"
    name: "Authorization Evaluator"
    technology: "Open Policy Agent (OPA) Sidecar"
    description: "Evaluates Attribute-Based Access Control (ABAC) policies locally via OPA."
relationships:
  - source: "Ingress Router"
    destination: "Security Enforcement Module"
    description: "Passes incoming client requests for token validation"
  - source: "Security Enforcement Module"
    destination: "Authorization Evaluator"
    description: "Queries ABAC policies for request authorization"
  - source: "Authorization Evaluator"
    destination: "Routing & Dispatcher"
    description: "Approves request flow upon successful policy evaluation"
  - source: "Routing & Dispatcher"
    destination: "EMR Service"
    description: "Forwards clinical requests via gRPC/REST over mTLS (SPIFFE/SPIRE)"
  - source: "Routing & Dispatcher"
    destination: "Billing / Claims Service"
    description: "Forwards billing requests via gRPC/REST over mTLS (SPIFFE/SPIRE)"