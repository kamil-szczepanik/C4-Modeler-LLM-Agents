level: component
scope: "Component diagram for the Patient Portal / Mobile App container"
parentContainer:
  name: "Patient Portal / Mobile App"
elements:
  - type: "component"
    name: "Self-Registration Component"
    technology: "React Native / Flutter"
    description: "Handles patient onboarding and profile creation."
  - type: "component"
    name: "Appointment Booking Component"
    technology: "React Native / Flutter"
    description: "Manages scheduling and viewing of clinic appointments."
  - type: "component"
    name: "EMR Access Component"
    technology: "React Native / Flutter with local SQLite (AES-256)"
    description: "Provides secure access to patient medical records and mobile data storage."
relationships:
  - source: "Self-Registration Component"
    destination: "API Gateway"
    description: "Sends registration requests via HTTPS/TLS"
  - source: "Appointment Booking Component"
    destination: "API Gateway"
    description: "Sends scheduling requests via HTTPS/TLS"
  - source: "EMR Access Component"
    destination: "API Gateway"
    description: "Retrieves EMR data via HTTPS/TLS with W3C Trace Context headers"