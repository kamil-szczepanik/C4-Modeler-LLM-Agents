level: component
scope: "Component diagram for the Dynamic Secrets Manager (HashiCorp Vault) container"
parentContainer:
  name: "Dynamic Secrets Manager (HashiCorp Vault)"
elements:
  - type: "component"
    name: "Distributed Raft Storage"
    technology: "Multi-region Distributed Raft Storage"
    description: "Provides multi-region storage backend with encrypted inter-node traffic for high availability."
  - type: "component"
    name: "Secrets Engine"
    technology: "HashiCorp Vault Secrets Engine"
    description: "Generates dynamic, short-lived credentials to minimize leak blast radiuses for workloads."
  - type: "component"
    name: "Auth Method Engine"
    technology: "AppRole and Kubernetes Service Account JWT via mTLS"
    description: "Handles workload authentication using AppRole and Kubernetes Service Account JWT over mTLS (SPIFFE/SPIRE)."
  - type: "component"
    name: "Unseal Integration"
    technology: "AWS KMS / On-prem HSM"
    description: "Connects to AWS KMS or On-prem HSM for automated cluster unsealing via encrypted transport channels."
  - type: "component"
    name: "Telemetry Exporter"
    technology: "OpenTelemetry"
    description: "Exports Vault telemetry metrics to the OpenTelemetry pipeline for availability monitoring."
  - type: "component"
    name: "Audit Logging Sidecar"
    technology: "WORM audit sidecar"
    description: "Writes immutable audit logs for break-glass and access events."
relationships:
  - source: "Auth Method Engine"
    destination: "Secrets Engine"
    description: "Authenticates workloads to issue dynamic credentials"
  - source: "Distributed Raft Storage"
    destination: "Secrets Engine"
    description: "Persists encrypted backend data"
  - source: "Unseal Integration"
    destination: "Distributed Raft Storage"
    description: "Provides automated unsealing keys"
  - source: "Telemetry Exporter"
    destination: "OpenTelemetry sidecars"
    description: "Exports metrics for availability monitoring"
  - source: "Audit Logging Sidecar"
    destination: "Audit Logging sidecars"
    description: "Writes immutable audit events"