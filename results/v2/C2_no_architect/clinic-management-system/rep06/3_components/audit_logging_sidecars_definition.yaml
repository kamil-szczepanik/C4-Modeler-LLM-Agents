level: component
scope: "Component diagram for the Audit Logging sidecars container"
parentContainer:
  name: "Audit Logging sidecars"
elements:
  - type: "component"
    name: "Audit Logging sidecars"
    technology: "Logging / WORM"
    description: "Enforce immutable compliance, audit tracking, and zero-loss queuing while ingesting log streams locally via Unix domain sockets."
  - type: "component"
    name: "Fluentbit / Logstash Daemonsets"
    technology: "Asynchronous log ingestion and parsing pipelines"
    description: "Offload heavy payload processing and avoid application-side latency, streaming logs asynchronously using TLS."
  - type: "component"
    name: "AWS S3 Object Lock"
    technology: "Immutable external storage tier"
    description: "Immutable, WORM-compliant storage enforcing 10-year retention policies."
  - type: "component"
    name: "Compliance Officers"
    technology: "Internal users / HTTPS"
    description: "Review security dashboards and investigate audit trails over HTTPS."
  - type: "component"
    name: "Application Containers"
    technology: "Co-located EMR and billing microservices"
    description: "Communicate via local Unix domain sockets and stream logs locally."
  - type: "component"
    name: "SPIFFE/SPIRE"
    technology: "Identity management framework"
    description: "Issues short-lived SVIDs for zero-trust, automated workload identity and mTLS authentication."
relationships:
  - source: "Application Containers"
    destination: "Audit Logging sidecars"
    description: "Ingests log streams locally via Unix domain sockets."
  - source: "Audit Logging sidecars"
    destination: "Fluentbit / Logstash Daemonsets"
    description: "Streams logs asynchronously using TLS."
  - source: "Fluentbit / Logstash Daemonsets"
    destination: "AWS S3 Object Lock"
    description: "Forwards logs for permanent storage using mTLS authenticated via SPIFFE/SPIRE SVIDs."
  - source: "Compliance Officers"
    destination: "Audit Logging sidecars"
    description: "Accesses searchable compliance dashboards over HTTPS."