level: component
scope: "Component diagram for the OpenTelemetry sidecars container"
parentContainer:
  name: "OpenTelemetry sidecars"
elements:
  - type: "component"
    name: "OpenTelemetry Collector"
    technology: "OpenTelemetry Collector, C++, Go"
    description: "Collects, processes, and exports distributed tracing telemetry and performance metrics without impacting core clinical workflows."
  - type: "component"
    name: "mTLS Handler"
    technology: "SPIFFE/SPIRE, gRPC"
    description: "Handles secure communication using mTLS transport and SPIFFE/SPIRE identities across hybrid boundaries."
relationships:
  - source: "OpenTelemetry Collector"
    destination: "mTLS Handler"
    description: "Transmits OTLP telemetry securely over mTLS"