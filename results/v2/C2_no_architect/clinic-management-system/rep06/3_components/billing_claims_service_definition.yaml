level: component
scope: "Component diagram for the Billing / Claims Service container"
parentContainer:
  name: "Billing / Claims Service"
elements:
  - type: "component"
    name: "Claims Processor Component"
    technology: "Java / Spring Boot"
    description: "Handles the business logic for processing billing requests, submitting insurance claims, and real-time eligibility checks."
  - type: "component"
    name: "Vault Integration Client"
    technology: "HashiCorp Vault SDK"
    description: "Fetches dynamic encryption keys via mTLS for AES-256 field-level encryption."
  - type: "component"
    name: "Archive Manager Component"
    technology: "AWS SDK"
    description: "Archives closed claims to cold object storage using immutable WORM policies."
relationships:
  - source: "Claims Processor Component"
    destination: "Insurance / Payer System"
    description: "Submits insurance claims and real-time eligibility checks via Secure HTTPS with DLQ and TLS 1.3"
  - source: "Vault Integration Client"
    destination: "HashiCorp Vault"
    description: "Fetches dynamic encryption keys via mTLS"
  - source: "Archive Manager Component"
    destination: "Cold Object Storage"
    description: "Archives closed claims using immutable WORM policies"