level: component
scope: "Component diagram for the AWS (eu-central-1) container"
parentContainer:
  name: "AWS (eu-central-1)"
elements:
  - type: "component"
    name: "Amazon EKS"
    technology: "Kubernetes"
    description: "Pre-provisioned container compute fleets for stateless services supporting warm-standby disaster recovery."
  - type: "component"
    name: "Amazon Route 53"
    technology: "AWS DNS"
    description: "Handles DNS traffic management and automated health-check failover between on-prem and AWS."
  - type: "component"
    name: "AWS KMS"
    technology: "AWS Key Management Service"
    description: "Provides Customer-Managed Keys (CMKs) with annual rotation for data encryption using AES-256."
  - type: "component"
    name: "AWS CloudTrail & Amazon GuardDuty"
    technology: "AWS Security & Auditing"
    description: "Handles immutable audit logging and runtime threat detection."
  - type: "component"
    name: "HashiCorp Vault"
    technology: "HashiCorp Vault"
    description: "Acts as a dynamic secrets manager for ephemeral injection via mTLS sidecars."
relationships:
  - source: "Amazon Route 53"
    destination: "Amazon EKS"
    description: "Automated health-check based traffic routing during failover events."
  - source: "Amazon EKS"
    destination: "AWS KMS"
    description: "Performs cryptographic operations using AES-256 for data at rest."
  - source: "AWS CloudTrail & Amazon GuardDuty"
    destination: "Amazon EKS"
    description: "Synchronizes immutable security and access logs."