level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patient"
    description: "Books appointments and views bills."
  - type: "person"
    name: "Clinician / Doctor"
    description: "Manages electronic medical records with sub-second latency."
  - type: "person"
    name: "Receptionist / Admin"
    description: "Handles administrative tasks and patient admissions within the clinic."
  - type: "person"
    name: "Billing Specialist"
    description: "Submits insurance claims and manages billing."
  - type: "person"
    name: "Compliance Officer"
    description: "Ensures strict HIPAA and GDPR compliance."
  - type: "externalSystem"
    name: "Insurance / Payer System"
    description: "External system for processing insurance claims."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "External systems providing clinical laboratory and imaging data."
  - type: "container"
    name: "Web Frontend"
    technology: "Web / HTTPS"
    description: "Web interface for users accessing the platform."
  - type: "container"
    name: "Patient Portal / Mobile App"
    technology: "Mobile / HTTPS"
    description: "Mobile and portal interface for patients."
  - type: "container"
    name: "API Gateway"
    technology: "OAuth2/OIDC & ABAC"
    description: "Manages ingress, authentication, and authorization with OAuth2/OIDC and ABAC."
  - type: "container"
    name: "EMR Service"
    technology: "gRPC/REST over mTLS, SPIFFE/SPIRE"
    description: "Manages electronic medical records and clinical interactions."
  - type: "container"
    name: "Billing / Claims Service"
    technology: "gRPC/REST over mTLS, SPIFFE/SPIRE"
    description: "Handles billing and insurance claims processing."
  - type: "container"
    name: "OpenTelemetry sidecars"
    technology: "OpenTelemetry"
    description: "Provides distributed tracing and performance monitoring."
  - type: "container"
    name: "Audit Logging sidecars"
    technology: "Logging / WORM"
    description: "Maintains immutable compliance and audit logs."
  - type: "container"
    name: "Dynamic Secrets Manager (HashiCorp Vault)"
    technology: "HashiCorp Vault"
    description: "Manages dynamic secret management with short-lived credentials."
  - type: "container"
    name: "on-prem-k8s cluster"
    technology: "Kubernetes"
    description: "On-premises Kubernetes orchestration cluster."
  - type: "container"
    name: "AWS (eu-central-1)"
    technology: "AWS Cloud"
    description: "Cloud infrastructure for active-active high availability and hybrid replication."
relationships:
  - source: "Patient"
    destination: "Web Frontend"
    description: "Accesses system via browser"
    technology: "HTTPS/TLS via API Gateway"
  - source: "Patient"
    destination: "Patient Portal / Mobile App"
    description: "Accesses portal and mobile application"
    technology: "HTTPS/TLS via API Gateway"
  - source: "Clinician / Doctor"
    destination: "Web Frontend"
    description: "Accesses EMR and clinical tools"
    technology: "HTTPS/TLS via API Gateway"
  - source: "Receptionist / Admin"
    destination: "Web Frontend"
    description: "Manages patient admissions and administration"
    technology: "HTTPS/TLS via API Gateway"
  - source: "Billing Specialist"
    destination: "Web Frontend"
    description: "Manages billing and claims"
    technology: "HTTPS/TLS via API Gateway"
  - source: "Compliance Officer"
    destination: "Web Frontend"
    description: "Reviews compliance and audit logs"
    technology: "HTTPS/TLS via API Gateway"
  - source: "Web Frontend"
    destination: "API Gateway"
    description: "Routes requests through gateway"
    technology: "HTTPS/TLS"
  - source: "Patient Portal / Mobile App"
    destination: "API Gateway"
    description: "Routes requests through gateway"
    technology: "HTTPS/TLS"
  - source: "API Gateway"
    destination: "EMR Service"
    description: "Forwards internal requests"
    technology: "gRPC/REST over mTLS"
  - source: "API Gateway"
    destination: "Billing / Claims Service"
    description: "Forwards billing requests"
    technology: "gRPC/REST over mTLS"
  - source: "EMR Service"
    destination: "Lab & Imaging Systems"
    description: "Integrates clinical data"
    technology: "HL7 FHIR APIs"
  - source: "Billing / Claims Service"
    destination: "Insurance / Payer System"
    description: "Submits claims with persistent encrypted queues"
    technology: "Secure HTTPS with DLQ"
  - source: "on-prem-k8s cluster"
    destination: "AWS (eu-central-1)"
    description: "Cross-region replication and hybrid synchronization"
    technology: "Anycast DNS and Traffic Managers"