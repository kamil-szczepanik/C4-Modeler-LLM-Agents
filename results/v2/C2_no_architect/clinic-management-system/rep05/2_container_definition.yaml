level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients using the self-service portal for registration, demographic capture, and appointment scheduling."
  - type: "person"
    name: "Clinical Staff (Doctors/Nurses)"
    description: "Clinical staff accessing electronic medical records and clinical workflows."
  - type: "person"
    name: "Administrative & Billing Staff"
    description: "Staff managing billing, insurance, and administrative operations."
  - type: "person"
    name: "Clinic Administrators/Compliance Officers"
    description: "Administrators ensuring compliance, system configuration, and audit reviews."
  - type: "externalSystem"
    name: "Lab and Imaging Systems"
    description: "External clinical systems exchanging medical data via HL7 FHIR APIs."
  - type: "container"
    name: "API Gateway"
    technology: "Istio Service Mesh, Envoy"
    description: "Routes, secures, and throttles incoming traffic to the appropriate microservices using OAuth2/OIDC."
  - type: "container"
    name: "Patient Portal"
    technology: "React, Web"
    description: "Frontend application allowing patients to manage appointments, view records, and handle self-service tasks."
  - type: "container"
    name: "EMR & Billing Containers"
    technology: "Java, Spring Boot, PostgreSQL, PgBouncer"
    description: "Manages electronic medical records, patient admissions, and billing workflows securely with AES-256 encryption."
  - type: "container"
    name: "Analytics & Audit Reporting Container"
    technology: "Python, OpenTelemetry, Datadog/Prometheus"
    description: "Handles heavy reporting, compliance logging, and payload scrubbing without impacting core EMR performance."
  - type: "container"
    name: "Patient Notification Microservice"
    technology: "Node.js"
    description: "Dispatches automated patient notifications, reminders, and alerts."
relationships:
  - source: "Patients"
    destination: "API Gateway"
    description: "Interacts via HTTPS for patient portal workflows"
    technology: "HTTPS / OAuth2 / OIDC"
  - source: "Clinical Staff (Doctors/Nurses)"
    destination: "API Gateway"
    description: "Accesses clinical workflows and medical records"
    technology: "HTTPS / OAuth2 / OIDC"
  - source: "Administrative & Billing Staff"
    destination: "API Gateway"
    description: "Manages billing and administrative tasks"
    technology: "HTTPS / OAuth2 / OIDC"
  - source: "Clinic Administrators/Compliance Officers"
    destination: "API Gateway"
    description: "Performs system administration and compliance monitoring"
    technology: "HTTPS / OAuth2 / OIDC"
  - source: "API Gateway"
    destination: "Patient Portal"
    description: "Routes requests to the patient portal frontend"
    technology: "gRPC / HTTPS with mTLS"
  - source: "API Gateway"
    destination: "EMR & Billing Containers"
    description: "Routes EMR and billing transactions"
    technology: "gRPC / HTTPS with mTLS"
  - source: "API Gateway"
    destination: "Analytics & Audit Reporting Container"
    description: "Routes audit and reporting requests"
    technology: "gRPC / HTTPS with mTLS"
  - source: "API Gateway"
    destination: "Patient Notification Microservice"
    description: "Triggers notification dispatch workflows"
    technology: "gRPC / HTTPS with mTLS"
  - source: "EMR & Billing Containers"
    destination: "Lab and Imaging Systems"
    description: "Integrates clinical data exchange"
    technology: "HL7 FHIR APIs over mTLS"