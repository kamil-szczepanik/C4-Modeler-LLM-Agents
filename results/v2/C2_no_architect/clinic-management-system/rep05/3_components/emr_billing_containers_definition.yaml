level: component
scope: "Component diagram for the EMR & Billing Containers container"
parentContainer:
  name: "EMR & Billing Containers"
elements:
  - type: "component"
    name: "EMR & Billing Controller"
    technology: "Java, Spring Boot"
    description: "Handles incoming gRPC / HTTPS transactions from the API Gateway and exposes endpoints for patient admissions, electronic medical records, and billing."
  - type: "component"
    name: "Clinical Transaction Service"
    technology: "Java, Spring Boot"
    description: "Executes business logic for clinical workflows, ensuring ACID compliance and robust transactional integrity."
  - type: "component"
    name: "HL7 FHIR Integration Service"
    technology: "Java, Spring Boot"
    description: "Integrates and exchanges clinical data with external Lab and Imaging Systems via HL7 FHIR APIs over mTLS."
  - type: "component"
    name: "Data Access Layer"
    technology: "Java, Spring Boot, PostgreSQL, PgBouncer"
    description: "Manages persistent patient and billing records utilizing TLS connections, connection pooling, column-level encryption, and Row-Level Security."
relationships:
  - source: "EMR & Billing Controller"
    destination: "Clinical Transaction Service"
    description: "Delegates request processing and transaction workflows"
  - source: "Clinical Transaction Service"
    destination: "HL7 FHIR Integration Service"
    description: "Triggers external lab and imaging data exchanges"
  - source: "Clinical Transaction Service"
    destination: "Data Access Layer"
    description: "Persists and retrieves patient and billing records"