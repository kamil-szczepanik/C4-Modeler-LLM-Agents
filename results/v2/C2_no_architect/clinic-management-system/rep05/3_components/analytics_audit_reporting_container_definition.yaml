# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Analytics & Audit Reporting Container container"
parentContainer:
  name: "Analytics & Audit Reporting Container"
elements:
  - type: "component"
    name: "API Handler"
    technology: "Python, Envoy / Istio Service Mesh"
    description: "Receives audit and reporting requests routed via gRPC / HTTPS with mTLS from the API Gateway."
  - type: "component"
    name: "Data Aggregator & Scrubber"
    technology: "Python, OpenTelemetry"
    description: "Performs PII/PHI scrubbing and aggregates data for compliance reporting and operational analytics."
  - type: "component"
    name: "Task Scheduler & Worker Manager"
    technology: "Celery, Celery Beat, Redis, KEDA"
    description: "Offloads heavy PDF/CSV export generation and dynamically scales worker pods based on queue depth."
  - type: "component"
    name: "Compliance Audit Logger"
    technology: "Python, WORM Storage"
    description: "Streams immutable audit logs directly to tamper-proof storage to satisfy HIPAA, GDPR, and retention mandates."
  - type: "component"
    name: "Report Storage Manager"
    technology: "Python, Encrypted Object Storage (S3/MinIO)"
    description: "Manages securely generated reports accessed via short-lived pre-signed URLs."
relationships:
  - source: "API Handler"
    destination: "Data Aggregator & Scrubber"
    description: "Passes sanitized reporting and audit requests."
  - source: "Data Aggregator & Scrubber"
    destination: "Task Scheduler & Worker Manager"
    description: "Offloads resource-intensive data processing and export generation."
  - source: "Task Scheduler & Worker Manager"
    destination: "Report Storage Manager"
    description: "Saves generated PDF and CSV exports to object storage."
  - source: "Compliance Audit Logger"
    destination: "Data Aggregator & Scrubber"
    description: "Receives processed telemetry and audit events for immutable logging."