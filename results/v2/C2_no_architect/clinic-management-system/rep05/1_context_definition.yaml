level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed for medium-sized hospitals and clinics to manage patient admissions, electronic medical records (EMR), appointments, and billing with high availability and strict HIPAA/GDPR compliance."
elements:
  - type: "person"
    name: "Patients"
    description: "Patients using the self-service portal for registration, demographic capture, and appointment scheduling."
  - type: "person"
    name: "Clinical Staff (Doctors/Nurses)"
    description: "Clinical staff accessing electronic medical records and clinical workflows."
  - type: "person"
    name: "Administrative & Billing Staff"
    description: "Staff managing billing, insurance, and administrative operations."
  - type: "person"
    name: "Clinic Administrators/Compliance Officers"
    description: "Administrators ensuring compliance, system configuration, and audit reviews."
  - type: "externalSystem"
    name: "Lab/Imaging Systems"
    description: "External clinical systems exchanging medical data via HL7 FHIR APIs."
relationships:
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Registration, demographic capture, and appointment scheduling"
    technology: "HTTPS / TLS 1.3"
  - source: "Clinical Staff (Doctors/Nurses)"
    destination: "Clinic Management System"
    description: "Secure EMR access"
    technology: "FIDO2/WebAuthn MFA and short-lived JWTs (OAuth2/OIDC)"
  - source: "Administrative & Billing Staff"
    destination: "Clinic Management System"
    description: "Billing and administrative access"
    technology: "FIDO2/WebAuthn MFA and short-lived JWTs (OAuth2/OIDC)"
  - source: "Clinic Administrators/Compliance Officers"
    destination: "Clinic Management System"
    description: "System administration and compliance monitoring"
    technology: "FIDO2/WebAuthn MFA and short-lived JWTs (OAuth2/OIDC)"
  - source: "Clinic Management System"
    destination: "Lab/Imaging Systems"
    description: "Clinical data exchange"
    technology: "HL7 FHIR APIs over mTLS"