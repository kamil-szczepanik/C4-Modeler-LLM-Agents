level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "End users who access the clinic management system for their medical records and appointments."
  - type: "person"
    name: "Receptionists"
    description: "Staff members who manage patient admissions and scheduling."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals who access and update electronic medical records."
  - type: "person"
    name: "Billing Specialists"
    description: "Personnel who manage financial transactions and billing processes."
  - type: "person"
    name: "Hospital Administrators"
    description: "Management users who oversee system administration and operations."
  - type: "externalSystem"
    name: "Insurance Payers/Clearinghouses"
    description: "External financial systems connected via secure HTTPS with dead-letter queues."
  - type: "externalSystem"
    name: "External Labs and Imaging Systems"
    description: "External medical diagnostic systems integrated via HL7 FHIR APIs."
  - type: "container"
    name: "Patient Portal"
    technology: "HTTPS, OAuth2"
    description: "Web interface allowing patients to access medical records and appointments."
  - type: "container"
    name: "API Gateway"
    technology: "Istio, WAF"
    description: "Routes traffic to internal containers using mTLS and handles ingress security."
  - type: "container"
    name: "Clinical Core"
    technology: "EMR, Scheduling, Billing Reconciliation, Kubernetes"
    description: "Core backend managing electronic medical records, scheduling, and billing reconciliation."
  - type: "container"
    name: "Notification & Reminder Container"
    technology: "Hybrid Cloud"
    description: "Handles system notifications and patient reminders."
relationships:
  - source: "Patients"
    destination: "Patient Portal"
    description: "Accesses patient portal"
    technology: "HTTPS/OAuth2"
  - source: "Receptionists"
    destination: "API Gateway"
    description: "Routes traffic for admissions and scheduling"
    technology: "HTTPS, mTLS via Istio"
  - source: "Clinicians"
    destination: "API Gateway"
    description: "Routes traffic for EMR and clinical workflows"
    technology: "HTTPS, mTLS via Istio"
  - source: "Billing Specialists"
    destination: "API Gateway"
    description: "Routes traffic for billing and financial operations"
    technology: "HTTPS, mTLS via Istio"
  - source: "Hospital Administrators"
    destination: "API Gateway"
    description: "Routes traffic for system administration"
    technology: "HTTPS, mTLS via Istio"
  - source: "API Gateway"
    destination: "Patient Portal"
    description: "Routes traffic"
    technology: "mTLS via Istio"
  - source: "API Gateway"
    destination: "Clinical Core"
    destination_description: "Routes traffic"
    destination: "Clinical Core"
    description: "Routes traffic to internal clinical core services"
    technology: "mTLS via Istio"
  - source: "API Gateway"
    destination: "Notification & Reminder Container"
    description: "Routes notification traffic"
    technology: "mTLS via Istio"
  - source: "Clinical Core"
    destination: "External Labs and Imaging Systems"
    description: "Communicates with labs and imaging systems"
    technology: "HL7 FHIR APIs"
  - source: "Clinical Core"
    destination: "Insurance Payers/Clearinghouses"
    description: "Interfaces for billing reconciliation"
    technology: "Secure HTTPS with dead-letter queues"