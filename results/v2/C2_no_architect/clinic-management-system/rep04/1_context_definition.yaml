level: context
scope: "System Context diagram for Clinical IT Environment"
system:
  name: "Clinical IT Environment"
  description: "Manages patient admissions, electronic medical records (EMR), scheduling, and billing for clinical IT environments with a hybrid architecture ensuring HIPAA/GDPR compliance and 99.99% high availability."
elements:
  - type: "person"
    name: "Patients"
    description: "End users who access the clinical IT environment for their medical records and appointments."
  - type: "person"
    name: "Receptionists"
    description: "Staff members who manage patient admissions and scheduling using internal protocols."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals who access and update electronic medical records using internal protocols."
  - type: "person"
    name: "Billing Specialists"
    description: "Personnel who manage financial transactions and billing processes."
  - type: "person"
    name: "Hospital Administrators"
    description: "Management users who oversee system administration and operations."
  - type: "externalSystem"
    name: "Insurance Payers/Clearinghouses"
    description: "External systems connected via asynchronous queue-based buffering and Dead Letter Queues (DLQs) for billing and claims."
  - type: "externalSystem"
    name: "External Labs and Imaging Systems"
    description: "External medical diagnostic systems integrated via HL7 FHIR APIs secured with Mutual TLS (mTLS)."
relationships:
  - source: "Patients"
    destination: "Clinical IT Environment"
    description: "Accesses system services via HTTPS"
    technology: "HTTPS, OAuth 2.0 / OIDC, MFA"
  - source: "Receptionists"
    destination: "Clinical IT Environment"
    description: "Manages patient admissions and scheduling"
    technology: "HTTPS, REST/gRPC"
  - source: "Clinicians"
    destination: "Clinical IT Environment"
    description: "Interacts with EMR and scheduling"
    technology: "HTTPS, REST/gRPC"
  - source: "Billing Specialists"
    destination: "Clinical IT Environment"
    description: "Manages financial billing operations"
    technology: "HTTPS, OAuth 2.0 / OIDC"
  - source: "Hospital Administrators"
    destination: "Clinical IT Environment"
    description: "Administers system configurations and oversight"
    technology: "HTTPS, OAuth 2.0 / OIDC, ABAC"
  - source: "External Labs and Imaging Systems"
    destination: "Clinical IT Environment"
    description: "Integrates lab and imaging data"
    technology: "HL7 FHIR APIs, Mutual TLS (mTLS)"
  - source: "Insurance Payers/Clearinghouses"
    destination: "Clinical IT Environment"
    description: "Processes insurance claims and payments"
    technology: "Asynchronous Message Queues, DLQs"