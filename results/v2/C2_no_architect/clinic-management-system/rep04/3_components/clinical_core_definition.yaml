    name: "EMR"
    technology: "HL7 FHIR, Java/Spring"
    description: "Handles electronic medical records and clinical workflows."
  - type: "component"
    name: "Scheduling"
    technology: "Java/Spring"
    description: "Manages patient appointments and scheduling."
