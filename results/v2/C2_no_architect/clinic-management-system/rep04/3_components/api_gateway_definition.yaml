level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Istio Ingress Gateway"
    technology: "Istio Service Mesh"
    description: "Handles secure ingress traffic routing and mTLS termination."
  - type: "component"
    name: "Web Application Firewall (WAF)"
    technology: "Integrated WAF"
    description: "Inspects incoming HTTP/HTTPS traffic to block web exploits and enforce security rules."
  - type: "component"
    name: "OAuth2 / MFA Enforcer"
    technology: "OAuth2, JWT, SPIFFE"
    description: "Authenticates users and external systems, issuing short-lived tokens for zero-trust access."
  - type: "component"
    name: "HL7 FHIR Validator"
    technology: "Schema Validation Engine"
    description: "Validates incoming data schemas from external systems like insurance payers and labs."
relationships:
  - source: "Istio Ingress Gateway"
    destination: "Web Application Firewall (WAF)"
    description: "Inspects ingress traffic"
  - source: "Web Application Firewall (WAF)"
    destination: "OAuth2 / MFA Enforcer"
    description: "Authenticates requests"
  - source: "OAuth2 / MFA Enforcer"
    destination: "HL7 FHIR Validator"
    description: "Validates schema for external payloads"