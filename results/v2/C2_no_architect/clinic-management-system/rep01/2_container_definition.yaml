# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who interact with the system via web or mobile frontends."
  - type: "person"
    name: "Receptionists"
    description: "Staff members handling patient admissions and scheduling."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals managing electronic medical records and patient care."
  - type: "person"
    name: "Billing Specialists"
    description: "Personnel managing financial records and insurance claims."
  - type: "person"
    name: "Hospital Administrators"
    description: "Management overseeing overall system operations and compliance."
  - type: "externalSystem"
    name: "Insurance Clearinghouses"
    description: "External systems processing billing claims via secure REST APIs."
  - type: "externalSystem"
    name: "External Labs/Imaging Vendors"
    description: "External diagnostic systems integrating via HL7 FHIR protocols."
  - type: "container"
    name: "WAF Container"
    technology: "Web Application Firewall"
    description: "Inspects and filters incoming HTTP/HTTPS traffic for security threats."
  - type: "container"
    name: "API Gateway"
    technology: "Kubernetes Ingress / Gateway API"
    description: "Routes incoming requests and enforces security policies."
  - type: "container"
    name: "Patient Portal Container"
    technology: "Web / Mobile Frontend"
    description: "Provides interface for patients to access portals, scheduling, and records."
  - type: "container"
    name: "EMR Container"
    technology: "Microservice / REST / gRPC"
    description: "Manages electronic medical records and clinical data storage."
  - type: "container"
    name: "Scheduling Container"
    technology: "Microservice / REST / gRPC"
    description: "Handles appointment scheduling and resource allocation."
  - type: "container"
    name: "Billing Container"
    technology: "Microservice / REST / gRPC"
    description: "Manages financial records, billing, and insurance claim integration."
  - type: "container"
    name: "Notification Container"
    technology: "Microservice / REST / gRPC"
    description: "Sends notifications and alerts to users and external entities."
  - type: "container"
    name: "Analytics & Reporting Container"
    technology: "Microservice / Data Processing"
    description: "Handles data analysis, reporting, and audit compliance logs."
  - type: "container"
    name: "PostgreSQL Databases"
    technology: "PostgreSQL with Patroni/etcd"
    description: "Active-passive clustered relational databases with field-level PHI encryption."
  - type: "container"
    name: "Event Broker"
    technology: "Apache Kafka / RabbitMQ"
    description: "Asynchronous message broker for decoupled event-driven integration."
  - type: "container"
    name: "Immutable Audit Storage Sink"
    technology: "Secure Storage"
    description: "Stores immutable audit logs for regulatory compliance."
  - type: "container"
    name: "HashiCorp Vault"
    technology: "Secrets Management / AES-256"
    description: "Hardware-backed key management and secrets storage."
relationships:
  - source: "Patients"
    destination: "WAF Container"
    description: "Accesses system via secure HTTPS requests"
    technology: "HTTPS (TLS 1.3), OAuth2/OIDC, MFA"
  - source: "Receptionists"
    destination: "WAF Container"
    description: "Accesses system via secure HTTPS requests"
    technology: "HTTPS (TLS 1.3), OAuth2/OIDC, MFA"
  - source: "Clinicians"
    destination: "WAF Container"
    description: "Accesses system via secure HTTPS requests"
    technology: "HTTPS (TLS 1.3), OAuth2/OIDC, MFA"
  - source: "Billing Specialists"
    destination: "WAF Container"
    description: "Accesses system via secure HTTPS requests"
    technology: "HTTPS (TLS 1.3), OAuth2/OIDC, MFA"
  - source: "Hospital Administrators"
    destination: "WAF Container"
    description: "Accesses system via secure HTTPS requests"
    technology: "HTTPS (TLS 1.3), OAuth2/OIDC, MFA"
  - source: "WAF Container"
    destination: "API Gateway"
    description: "Forwards filtered traffic to"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Patient Portal Container"
    description: "Routes client requests to"
    technology: "HTTPS, mTLS via SPIFFE/SPIRE"
  - source: "API Gateway"
    destination: "EMR Container"
    description: "Routes client requests to"
    technology: "HTTPS, mTLS via SPIFFE/SPIRE"
  - source: "API Gateway"
    destination: "Scheduling Container"
    description: "Routes client requests to"
    technology: "HTTPS, mTLS via SPIFFE/SPIRE"
  - source: "API Gateway"
    destination: "Billing Container"
    description: "Routes client requests to"
    technology: "HTTPS, mTLS via SPIFFE/SPIRE"
  - source: "API Gateway"
    destination: "Analytics & Reporting Container"
    description: "Routes client requests to"
    technology: "HTTPS, mTLS via SPIFFE/SPIRE"
  - source: "EMR Container"
    destination: "Event Broker"
    description: "Publishes and consumes events asynchronously"
    technology: "Apache Kafka / RabbitMQ"
  - source: "Scheduling Container"
    destination: "Event Broker"
    description: "Publishes and consumes events asynchronously"
    technology: "Apache Kafka / RabbitMQ"
  - source: "Billing Container"
    destination: "Event Broker"
    description: "Publishes and consumes events asynchronously"
    technology: "Apache Kafka / RabbitMQ"
  - source: "Notification Container"
    destination: "Event Broker"
    description: "Consumes events to trigger notifications"
    technology: "Apache Kafka / RabbitMQ"
  - source: "Analytics & Reporting Container"
    destination: "Event Broker"
    description: "Consumes events for analytics processing"
    technology: "Apache Kafka / RabbitMQ"
  - source: "EMR Container"
    destination: "PostgreSQL Databases"
    description: "Reads and writes clinical data with field-level encryption"
    technology: "Active-Passive Replication, SQL"
  - source: "Scheduling Container"
    destination: "PostgreSQL Databases"
    description: "Reads and writes scheduling data"
    technology: "Active-Passive Replication, SQL"
  - source: "Billing Container"
    destination: "PostgreSQL Databases"
    description: "Reads and writes financial data"
    technology: "Active-Passive Replication, SQL"
  - source: "Billing Container"
    destination: "Insurance Clearinghouses"
    description: "Processes claims via secure APIs"
    technology: "Secure HTTPS REST APIs"
  - source: "EMR Container"
    destination: "External Labs/Imaging Vendors"
    description: "Exchanges lab results and imaging data"
    technology: "HL7 FHIR protocols, HTTPS"
  - source: "Analytics & Reporting Container"
    destination: "Immutable Audit Storage Sink"
    description: "Writes long-term compliance audit records"
    technology: "Secure Storage Sink"
  - source: "EMR Container"
    destination: "HashiCorp Vault"
    description: "Retrieves encryption keys and secrets"
    technology: "AES-256 Key Management"
  - source: "Billing Container"
    destination: "HashiCorp Vault"
    description: "Retrieves encryption keys and secrets"
    technology: "AES-256 Key Management"