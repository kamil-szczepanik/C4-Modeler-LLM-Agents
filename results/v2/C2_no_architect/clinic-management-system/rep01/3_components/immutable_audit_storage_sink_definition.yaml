level: component
scope: "Component diagram for the Immutable Audit Storage Sink container"
parentContainer:
  name: "Immutable Audit Storage Sink"
elements:
  - type: "component"
    name: "Audit Ingestion Engine"
    technology: "Golang, S3 API"
    description: "Receives compliance and audit records securely via mTLS and ingests them into storage."
  - type: "component"
    name: "WORM Storage Controller"
    technology: "AWS S3 Object Lock, MinIO"
    description: "Enforces 10-year Write-Once-Read-Many (WORM) retention policies on audit logs."
  - type: "component"
    name: "Compliance Query API"
    technology: "REST, TLS"
    description: "Provides secure, read-only query capabilities for compliance officers using ephemeral credentials."
relationships:
  - source: "Audit Ingestion Engine"
    destination: "WORM Storage Controller"
    description: "Writes immutable compliance records to"
  - source: "Compliance Query API"
    destination: "WORM Storage Controller"
    description: "Queries stored audit logs from"