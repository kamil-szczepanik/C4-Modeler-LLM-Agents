level: component
scope: "Component diagram for the PostgreSQL Databases container"
parentContainer:
  name: "PostgreSQL Databases"
elements:
  - type: "component"
    name: "Patroni/etcd Clustering Engine"
    technology: "Patroni, etcd"
    description: "Provides high-availability active-passive clustering with automated failover for PostgreSQL."
  - type: "component"
    name: "PgBouncer Connection Pooler"
    technology: "PgBouncer"
    description: "Manages and pools database connections to prevent starvation under heavy concurrent clinical usage."
  - type: "component"
    name: "pgaudit Module"
    technology: "pgaudit"
    description: "Captures tamper-evident audit logs of DDL and DML operations on PHI tables."
relationships:
  - source: "PgBouncer Connection Pooler"
    destination: "Patroni/etcd Clustering Engine"
    description: "Routes pooled SQL queries to the active PostgreSQL database instance."
  - source: "Patroni/etcd Clustering Engine"
    destination: "pgaudit Module"
    description: "Generates audit logs for database transactions processed by the storage engine."