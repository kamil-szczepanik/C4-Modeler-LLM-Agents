level: component
scope: "Component diagram for the EMR Container container"
parentContainer:
  name: "EMR Container"
elements:
  - type: "component"
    name: "EMR Service Controller"
    technology: "REST / gRPC"
    description: "Manages incoming clinical record requests and routes them to core business logic."
  - type: "component"
    name: "Clinical Data Manager"
    technology: "Go / Java"
    description: "Handles electronic medical records, clinical data processing, and enforcement of row-level security."
  - type: "component"
    name: "FHIR Interoperability Adapter"
    technology: "HL7 FHIR over HTTPS"
    description: "Exchanges lab and imaging data securely with external vendors."
relationships:
  - source: "EMR Service Controller"
    destination: "Clinical Data Manager"
    description: "Delegates core business logic and clinical data operations"
  - source: "Clinical Data Manager"
    destination: "FHIR Interoperability Adapter"
    description: "Sends and receives standardized healthcare data for external exchange"