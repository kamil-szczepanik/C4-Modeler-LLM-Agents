level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Ingress Router"
    technology: "Kubernetes Ingress / Gateway API"
    description: "Routes client requests via HTTPS with mTLS and enforces OWASP top 10 guardrails."
  - type: "component"
    name: "Auth Validator"
    technology: "OAuth2/OIDC & SPIFFE/SPIRE"
    description: "Performs token validation, OAuth2/OIDC validation, and persona-based rate limiting."
  - type: "component"
    name: "Gateway Cache Client"
    technology: "Redis Client"
    description: "Performs local authorization caching and token validation."
  - type: "component"
    name: "Secrets Manager Integration"
    technology: "HashiCorp Vault & cert-manager"
    description: "Retrieves secrets and manages automated TLS lifecycles."
relationships:
  - source: "Ingress Router"
    destination: "Auth Validator"
    description: "Delegates token validation and rate limiting"
  - source: "Auth Validator"
    destination: "Gateway Cache Client"
    description: "Performs local authorization caching"
  - source: "Ingress Router"
    destination: "Secrets Manager Integration"
    description: "Retrieves secrets and manages TLS"