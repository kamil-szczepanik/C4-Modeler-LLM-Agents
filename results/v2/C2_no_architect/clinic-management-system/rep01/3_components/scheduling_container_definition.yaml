level: component
scope: "Component diagram for the Scheduling Container container"
parentContainer:
  name: "Scheduling Container"
elements:
  - type: "component"
    name: "Scheduling Controller"
    technology: "gRPC and REST APIs"
    description: "Handles incoming routing requests from the API Gateway and routes HTTPS and mTLS requests."
  - type: "component"
    name: "Reservation Service"
    technology: "Active-Active Consensus"
    description: "Executes atomic reservation locks and SQL reads/writes against the PostgreSQL Databases."
  - type: "component"
    name: "Event Publisher"
    technology: "Apache Kafka / RabbitMQ"
    description: "Publishes and consumes asynchronous events with the Event Broker."
relationships:
  - source: "Scheduling Controller"
    destination: "Reservation Service"
    description: "Invokes atomic reservation logic"
  - source: "Reservation Service"
    destination: "Event Publisher"
    description: "Triggers asynchronous event publication"