level: component
scope: "Component diagram for the Notification Container container"
parentContainer:
  name: "Notification Container"
elements:
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Stateless Microservice / REST / gRPC"
    description: "Dispatches multi-channel alerts to third-party SMS, Email, and Push gateway APIs."
  - type: "component"
    name: "Event Consumer"
    technology: "Apache Kafka / RabbitMQ Consumer"
    description: "Consumes clinical and operational events from the Event Broker."
  - type: "component"
    name: "Audit Logger"
    technology: "Secure Protocol"
    description: "Emits delivery receipts to the Immutable Audit Storage Sink for 10-year retention."
  - type: "component"
    name: "Secrets Manager Client"
    technology: "mTLS / API"
    description: "Dynamically fetches provider API keys and secrets from HashiCorp Vault."
relationships:
  - source: "Event Consumer"
    destination: "Notification Dispatcher"
    description: "Passes consumed clinical and operational events for processing [Apache Kafka / RabbitMQ]"
  - source: "Notification Dispatcher"
    destination: "Third-party SMS, Email, and Push Gateway APIs"
    description: "Dispatches multi-channel alerts [TLS 1.3, HTTPS]"
  - source: "Notification Dispatcher"
    destination: "Audit Logger"
    description: "Triggers emission of delivery receipts"
  - source: "Audit Logger"
    destination: "Immutable Audit Storage Sink"
    description: "Emits delivery receipts for 10-year retention [Secure Protocol]"
  - source: "Secrets Manager Client"
    destination: "HashiCorp Vault"
    description: "Dynamically fetches provider API keys and secrets [mTLS / API]"