level: component
scope: "Component diagram for the Event Broker container"
parentContainer:
  name: "Event Broker"
elements:
  - type: "component"
    name: "Message Ingestion Handler"
    technology: "Apache Kafka / RabbitMQ"
    description: "Ingests asynchronous events from microservices via mTLS."
  - type: "component"
    name: "Schema Registry Validator"
    technology: "Avro/JSON Schema Registry"
    description: "Validates incoming event payloads against defined schemas."
  - type: "component"
    name: "Event Routing Engine"
    technology: "Apache Kafka / RabbitMQ Core"
    description: "Routes and distributes asynchronous messages to appropriate consuming microservices."
relationships:
  - source: "Message Ingestion Handler"
    destination: "Schema Registry Validator"
    description: "Validates message payloads"
  - source: "Schema Registry Validator"
    destination: "Event Routing Engine"
    description: "Forwards validated events for routing"