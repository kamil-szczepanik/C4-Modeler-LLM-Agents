level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform managing patient admissions, electronic medical records, scheduling, and billing for medium-sized hospitals with high availability, HIPAA/GDPR compliance, and sub-second EMR performance."
elements:
  - type: "person"
    name: "Patients"
    description: "Individuals receiving care who interact with the system via web or mobile frontends."
  - type: "person"
    name: "Receptionists"
    description: "Staff members handling patient admissions and scheduling."
  - type: "person"
    name: "Clinicians"
    description: "Medical professionals managing electronic medical records and patient care."
  - type: "person"
    name: "Billing Specialists"
    description: "Personnel managing financial records and insurance claims."
  - type: "person"
    name: "Hospital Administrators"
    description: "Management overseeing overall system operations and compliance."
  - type: "externalSystem"
    name: "Insurance Clearinghouses"
    description: "External systems processing billing claims via secure REST APIs with OAuth 2.1 authentication."
  - type: "externalSystem"
    name: "External Labs/Imaging Vendors"
    description: "External diagnostic systems integrating via HL7 FHIR APIs over TLS 1.3."
relationships:
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Interacts via web/mobile frontends for admissions, scheduling, and records"
    technology: "HTTPS, TLS 1.3"
  - source: "Receptionists"
    destination: "Clinic Management System"
    description: "Interacts via web/mobile frontends for patient admissions and scheduling"
    technology: "HTTPS, TLS 1.3"
  - source: "Clinicians"
    destination: "Clinic Management System"
    description: "Interacts via web/mobile frontends for EMR and clinical management"
    technology: "HTTPS, TLS 1.3"
  - source: "Billing Specialists"
    destination: "Clinic Management System"
    description: "Interacts via web/mobile frontends for billing and financial operations"
    technology: "HTTPS, TLS 1.3"
  - source: "Hospital Administrators"
    destination: "Clinic Management System"
    description: "Interacts via web/mobile frontends for administration and monitoring"
    technology: "HTTPS, TLS 1.3"
  - source: "Insurance Clearinghouses"
    destination: "Clinic Management System"
    description: "Integrates for claim processing and billing workflows"
    technology: "Secure REST APIs, OAuth 2.1"
  - source: "External Labs/Imaging Vendors"
    destination: "Clinic Management System"
    description: "Integrates for lab results and imaging data exchange"
    technology: "HL7 FHIR APIs, TLS 1.3"