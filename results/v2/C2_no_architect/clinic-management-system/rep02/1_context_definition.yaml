level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "Streamlines patient admissions, electronic medical records, scheduling, and billing for medium-sized hospitals and clinics, ensuring high availability and strict regulatory compliance across a hybrid cloud infrastructure."
elements:
  - type: "person"
    name: "Patient"
    description: "End-user interacting with the frontend to manage appointments, view records, and handle billing."
  - type: "person"
    name: "Clinic Receptionist/Staff"
    description: "Administrative personnel managing patient admissions, check-ins, and front-desk scheduling."
  - type: "person"
    name: "Clinician/Doctor"
    description: "Medical professional accessing and updating electronic medical records and patient schedules."
  - type: "person"
    name: "Billing Specialist"
    description: "Financial staff handling invoicing, payments, and insurance claims processing."
  - type: "person"
    name: "Compliance/IT Administrator"
    description: "System administrator managing security, access controls, infrastructure, and regulatory compliance."
  - type: "externalSystem"
    name: "Insurance/Third-Party Payer Gateway"
    description: "External financial gateway for processing insurance claims and third-party payments."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External medical diagnosis systems providing lab results and imaging data."
  - type: "container"
    name: "API Gateway"
    description: "Entry point for all incoming traffic, handling routing, security validation, and rate limiting."
    technology: "Kubernetes Ingress / Istio"
  - type: "container"
    name: "Web/Mobile Frontend"
    description: "Client-facing applications providing user interfaces for patients and staff."
    technology: "React / React Native"
  - type: "container"
    name: "Core Microservices"
    description: "Set of microservices handling Patient, Scheduling, EMR, and Billing domains."
    technology: "Java / Go, Spring Boot, Kubernetes"
  - type: "container"
    name: "Database Cluster"
    description: "Persistent storage cluster providing encrypted relational and transactional data storage."
    technology: "PostgreSQL / MySQL, AES-256"
  - type: "container"
    name: "WORM Archive Storage"
    description: "Write-Once-Read-Many immutable storage for long-term regulatory compliance and archiving."
    technology: "Object Storage with Object Lock"
  - type: "component"
    name: "OAuth2/OIDC Token Validator"
    description: "Authenticates and authorizes incoming requests using tokens and MFA."
    technology: "Keycloak / OpenID Connect"
  - type: "component"
    name: "Break-Glass Access Controller"
    description: "Provides emergency override access to sensitive medical records under strict auditing."
    technology: "Custom Access Control Service"
  - type: "component"
    name: "HL7 FHIR Integration Engine"
    description: "Parses and translates clinical messages for interoperability with external lab and imaging systems."
    technology: "HAPI FHIR / Java"
relationships:
  - source: "Patient"
    destination: "Clinic Management System"
    description: "Accesses appointments, records, and billing via web/mobile interface"
    technology: "HTTPS, TLS 1.3, OAuth2/OIDC tokens, MFA"
  - source: "Clinic Receptionist/Staff"
    destination: "Clinic Management System"
    description: "Manages patient admissions and scheduling"
    technology: "HTTPS, TLS 1.3, OAuth2/OIDC tokens, MFA"
  - source: "Clinician/Doctor"
    destination: "Clinic Management System"
    description: "Accesses and updates electronic medical records"
    technology: "HTTPS, TLS 1.3, OAuth2/OIDC tokens, MFA"
  - source: "Billing Specialist"
    destination: "Clinic Management System"
    description: "Manages invoices, billing, and claims"
    technology: "HTTPS, TLS 1.3, OAuth2/OIDC tokens, MFA"
  - source: "Compliance/IT Administrator"
    destination: "Clinic Management System"
    description: "Manages infrastructure, security policies, and system configuration"
    technology: "HTTPS, TLS 1.3, OAuth2/OIDC tokens, MFA"
  - source: "Clinic Management System"
    destination: "Insurance/Third-Party Payer Gateway"
    description: "Submits and processes insurance claims asynchronously"
    technology: "mTLS, asynchronous message queues"
  - source: "External Lab & Imaging Systems"
    destination: "Clinic Management System"
    description: "Sends lab results and medical imaging data"
    technology: "HL7 FHIR APIs"
  - source: "API Gateway"
    destination: "Web/Mobile Frontend"
    description: "Serves frontend assets and routes API calls"
    technology: "HTTPS, REST/GraphQL"
  - source: "Web/Mobile Frontend"
    destination: "API Gateway"
    description: "Sends client requests through secure channels"
    technology: "HTTPS, TLS 1.3"
  - source: "API Gateway"
    destination: "Core Microservices"
    description: "Routes authenticated requests to internal services"
    technology: "gRPC / HTTP, Istio mTLS"
  - source: "Core Microservices"
    destination: "Database Cluster"
    description: "Reads and writes transactional clinic and patient data"
    technology: "Encrypted TCP, AES-256"
  - source: "Core Microservices"
    destination: "WORM Archive Storage"
    description: "Archives immutable records for compliance"
    technology: "HTTPS / S3 API"