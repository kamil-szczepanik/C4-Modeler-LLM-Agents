# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Perimeter Router"
    technology: "Kubernetes Ingress / Istio"
    description: "Handles perimeter routing, TLS termination, and WAF."
  - type: "component"
    name: "Token Exchange Service"
    technology: "OAuth2/OIDC & JWT/PASETO"
    description: "Manages perimeter token exchange and fine-grained ABAC claims enforcement."
relationships:
  - source: "Perimeter Router"
    destination: "Token Exchange Service"
    description: "Forwards requests for token validation and exchange [HTTPS with MFA and ABAC]"