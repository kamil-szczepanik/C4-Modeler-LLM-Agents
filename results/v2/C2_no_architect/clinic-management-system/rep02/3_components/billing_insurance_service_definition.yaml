level: component
scope: "Component diagram for the Billing & Insurance Service container"
parentContainer:
  name: "Billing & Insurance Service"
elements:
  - type: "component"
    name: "Billing Controller"
    technology: "Spring Boot / REST API"
    description: "Handles incoming HTTP requests for financial operations, claims submission, and patient self-service ledgers."
  - type: "component"
    name: "Claims Service"
    technology: "Spring Boot / Service Layer"
    description: "Manages insurance claims processing and asynchronous retries."
  - type: "component"
    name: "Payment Processor"
    technology: "Spring Boot / Service Layer"
    description: "Tokenizes and processes payments securely via external payment gateways."
  - type: "component"
    name: "Billing Database Repository"
    technology: "Spring Data JPA / AES-256"
    description: "Handles transactional data queries and routes analytics to read replicas with encrypted storage."
relationships:
  - source: "Billing Controller"
    destination: "Claims Service"
    description: "Delegates claims submission and status tracking requests [Internal Method Invocation]"
  - source: "Billing Controller"
    destination: "Payment Processor"
    description: "Delegates payment tokenization and processing requests [Internal Method Invocation]"
  - source: "Claims Service"
    destination: "Billing Database Repository"
    description: "Persists and queries claim and ledger transactions [JPA / JDBC]"
  - source: "Payment Processor"
    destination: "Billing Database Repository"
    description: "Persists payment and tokenization records [JPA / JDBC]"