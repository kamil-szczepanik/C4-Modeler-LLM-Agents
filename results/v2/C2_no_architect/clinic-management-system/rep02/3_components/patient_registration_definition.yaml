level: component
scope: "Component diagram for the Patient Registration container"
parentContainer:
  name: "Patient Registration"
elements:
  - type: "component"
    name: "Admission Controller"
    technology: "Spring Boot Controller"
    description: "Handles public and internal patient admission requests routed from the API Gateway."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Spring Boot Service"
    description: "Dispatches asynchronous OTP and notification messages to external messaging brokers."
  - type: "component"
    name: "Session and Rate Limiter"
    technology: "Spring Boot Component"
    description: "Interacts with Redis to enforce rate-limiting and manage user sessions during registration."
relationships:
  - source: "Admission Controller"
    destination: "Session and Rate Limiter"
    description: "Validates sessions and enforces rate-limiting"
  - source: "Admission Controller"
    destination: "Notification Dispatcher"
    description: "Triggers asynchronous notifications"