level: component
scope: "Component diagram for the Appointment Scheduling container"
parentContainer:
  name: "Appointment Scheduling"
elements:
  - type: "component"
    name: "Appointment Controller"
    technology: "Spring Boot REST Controller"
    description: "Handles incoming appointment booking and scheduling requests from the API Gateway."
  - type: "component"
    name: "Appointment Service"
    technology: "Spring Boot Service"
    description: "Contains business logic for appointment management and coordinates distributed locking."
  - type: "component"
    name: "Event Publisher"
    technology: "Spring Kafka / AMQP Client"
    description: "Publishes asynchronous appointment events to the notification dispatcher."
relationships:
  - source: "Appointment Controller"
    destination: "Appointment Service"
    description: "Delegates validated booking requests via [Java Method Invocation]"
  - source: "Appointment Service"
    destination: "Event Publisher"
    description: "Triggers async event publishing via [Kafka / AMQP]"