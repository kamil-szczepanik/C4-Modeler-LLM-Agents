level: component
scope: "Component diagram for the EMR Service container"
parentContainer:
  name: "EMR Service"
elements:
  - type: "component"
    name: "EMR API Controller"
    technology: "Spring Boot / REST"
    description: "Exposes clinical endpoints to handle patient electronic medical records requests securely."
  - type: "component"
    name: "FHIR Integration Client"
    technology: "Spring Boot / HL7 FHIR"
    description: "Exchanges clinical data and lab results with external lab and imaging systems."
  - type: "component"
    name: "Encryption and Audit Service"
    technology: "AES-256 / OpenTelemetry / FluentBit"
    description: "Enforces field-level encryption for PHI and handles asynchronous sidecar audit logging."
relationships:
  - source: "EMR API Controller"
    destination: "Encryption and Audit Service"
    description: "Enforces field-level encryption and logs requests"
  - source: "EMR API Controller"
    destination: "FHIR Integration Client"
    description: "Delegates clinical data exchange"