level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patient"
    description: "End-user interacting to manage appointments, view records, and handle billing."
  - type: "person"
    name: "Clinic Receptionist/Staff"
    description: "Administrative personnel managing patient admissions, check-ins, and front-desk scheduling."
  - type: "person"
    name: "Clinician/Doctor"
    description: "Medical professional accessing and updating electronic medical records and patient schedules."
  - type: "person"
    name: "Billing Specialist"
    description: "Financial staff handling invoicing, payments, and insurance claims processing."
  - type: "person"
    name: "Compliance/IT Administrator"
    description: "System administrator managing security, access controls, infrastructure, and regulatory compliance."
  - type: "externalSystem"
    name: "Insurance/Third-Party Payer Gateway"
    description: "External financial gateway for processing insurance claims and third-party payments."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External medical diagnosis systems providing lab results and imaging data."
  - type: "container"
    name: "API Gateway"
    technology: "Kubernetes Ingress / Istio"
    description: "Entry point for all incoming traffic, handling routing, security validation, and rate limiting."
  - type: "container"
    name: "Patient Registration"
    technology: "Spring Boot / Kubernetes"
    description: "Manages patient admissions and registration workflows."
  - type: "container"
    name: "Appointment Scheduling"
    technology: "Spring Boot / Kubernetes"
    description: "Handles booking, rescheduling, and management of clinical appointments."
  - type: "container"
    name: "EMR Service"
    technology: "Spring Boot / Kubernetes"
    description: "Manages Electronic Medical Records, clinical notes, and patient history."
  - type: "container"
    name: "Billing & Insurance Service"
    technology: "Spring Boot / Kubernetes"
    description: "Handles invoicing, payments, and insurance claims integration."
relationships:
  - source: "Patient"
    destination: "API Gateway"
    description: "Interacts with the system via web or mobile interface"
    technology: "HTTPS with MFA and ABAC"
  - source: "Clinic Receptionist/Staff"
    destination: "API Gateway"
    description: "Manages patient admissions and scheduling"
    technology: "HTTPS with MFA and ABAC"
  - source: "Clinician/Doctor"
    destination: "API Gateway"
    description: "Accesses and updates electronic medical records"
    technology: "HTTPS with MFA and ABAC"
  - source: "Billing Specialist"
    destination: "API Gateway"
    description: "Manages billing and claims processing"
    technology: "HTTPS with MFA and ABAC"
  - source: "Compliance/IT Administrator"
    destination: "API Gateway"
    description: "Manages security policies and infrastructure configurations"
    technology: "HTTPS with MFA and ABAC"
  - source: "API Gateway"
    destination: "Patient Registration"
    description: "Routes patient registration requests"
    technology: "Istio mTLS"
  - source: "API Gateway"
    destination: "Appointment Scheduling"
    description: "Routes scheduling requests"
    technology: "Istio mTLS"
  - source: "API Gateway"
    destination: "EMR Service"
    description: "Routes EMR requests"
    technology: "Istio mTLS"
  - source: "API Gateway"
    destination: "Billing & Insurance Service"
    description: "Routes billing requests"
    technology: "Istio mTLS"
  - source: "Billing & Insurance Service"
    destination: "Insurance/Third-Party Payer Gateway"
    description: "Sends claims and billing information"
    technology: "HL7 FHIR APIs and secure asynchronous retry queues"
  - source: "EMR Service"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical data and lab results"
    technology: "HL7 FHIR APIs and secure asynchronous retry queues"