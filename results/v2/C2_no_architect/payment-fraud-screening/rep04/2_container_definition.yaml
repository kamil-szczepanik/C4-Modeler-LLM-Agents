level: container
scope: "Container diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Human actors reviewing suspicious payments."
  - type: "person"
    name: "Risk Managers"
    description: "Human actors managing risk rules."
  - type: "person"
    name: "Compliance Officers"
    description: "Human actors ensuring regulatory compliance."
  - type: "person"
    name: "Shoppers/End-Consumers"
    description: "End-consumers initiating card-not-present transactions."
  - type: "externalSystem"
    name: "Payment Gateway / Shoppers"
    description: "External system routing payment authorization requests."
  - type: "container"
    name: "Real-Time Scoring Engine"
    description: "Screens authorizations in real-time with memory-cached models."
    technology: "AWS ECS Fargate, ECS Service Connect"
  - type: "container"
    name: "Case Management Service"
    description: "Manages queues and cases for suspicious payments."
    technology: "AWS ECS Fargate, AWS Cognito (OIDC/OAuth2)"
  - type: "container"
    name: "Tokenization Proxy"
    description: "Reduces PCI-DSS scope by tokenizing sensitive data."
    technology: "AWS ECS Fargate"
  - type: "container"
    name: "Audit & Cryptographic Signer Sidecar"
    description: "Ensures 7-year tamper-evident auditability."
    technology: "AWS ECS Fargate, AWS CloudHSM, AWS KMS"
  - type: "container"
    name: "Model Management Service"
    description: "Manages and updates fraud scoring models."
    technology: "AWS ECS Fargate"
relationships:
  - source: "Payment Gateway / Shoppers"
    destination: "Real-Time Scoring Engine"
    description: "Sends payment authorizations for fraud screening"
    technology: "HTTPS/TLS 1.3"
  - source: "Real-Time Scoring Engine"
    destination: "Tokenization Proxy"
    description: "Tokenizes sensitive payment data"
    technology: "gRPC"
  - source: "Real-Time Scoring Engine"
    destination: "Audit & Cryptographic Signer Sidecar"
    description: "Sends audit logs for tamper-evident signing"
    technology: "IPC / Local gRPC"
  - source: "Fraud Analysts"
    destination: "Case Management Service"
    description: "Reviews suspicious payments and manages cases"
    technology: "HTTPS (OIDC/OAuth2 via AWS Cognito)"
  - source: "Audit & Cryptographic Signer Sidecar"
    destination: "Amazon S3 WORM Bucket"
    description: "Stores immutable 7-year audit logs"
    technology: "AWS SDK (HTTPS)"