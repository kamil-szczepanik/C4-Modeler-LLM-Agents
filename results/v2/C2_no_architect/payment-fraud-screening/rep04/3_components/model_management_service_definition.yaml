level: component
scope: "Component diagram for the Model Management Service container"
parentContainer:
  name: "Model Management Service"
elements:
  - type: "component"
    name: "Model Promotion Controller"
    technology: "AWS ECS Fargate Container / Python Flask"
    description: "Enables self-service model promotion and rollback for risk managers."
  - type: "component"
    name: "Explainability Previewer"
    technology: "AWS ECS Fargate Container / Python"
    description: "Provides explainability previews for fraud scoring models."
  - type: "component"
    name: "Performance Dashboard API"
    technology: "AWS ECS Fargate Container / AWS CloudWatch integration"
    description: "Serves metrics and performance dashboards to risk managers."
relationships:
  - source: "Model Promotion Controller"
    destination: "Audit & Cryptographic Signer Sidecar"
    description: "Sends model promotion and rollback audit logs via gRPC/Internal Network"
  - source: "Model Promotion Controller"
    destination: "AWS S3"
    description: "Stores model artifact storage and version manifests via HTTPS"
  - source: "Explainability Previewer"
    destination: "AWS S3"
    description: "Retrieves model artifacts for explainability previews via HTTPS"
  - source: "Performance Dashboard API"
    destination: "AWS CloudWatch"
    description: "Queries metrics and performance data"