level: component
scope: "Component diagram for the Real-Time Scoring Engine container"
parentContainer:
  name: "Real-Time Scoring Engine"
elements:
  - type: "component"
    name: "Scoring Gateway Controller"
    technology: "AWS ECS Fargate, HTTPS/TLS 1.3"
    description: "Receives payment authorizations for fraud screening from the Payment Gateway."
  - type: "component"
    name: "Fraud Evaluation Processor"
    technology: "AWS ECS Fargate"
    description: "Evaluates transactions in real-time under 50 milliseconds."
  - type: "component"
    name: "Tokenization Client"
    technology: "gRPC over mTLS"
    description: "Communicates with the Tokenization Proxy to tokenize payment data."
  - type: "component"
    name: "Audit Dispatcher"
    technology: "Local IPC / Unix domain sockets"
    description: "Sends audit logs and attribution bitmasks to the Audit & Cryptographic Signer Sidecar."
relationships:
  - source: "Scoring Gateway Controller"
    destination: "Fraud Evaluation Processor"
    description: "Passes payment authorization data for evaluation"
  - source: "Fraud Evaluation Processor"
    destination: "Tokenization Client"
    description: "Requests tokenization of payment data"
  - source: "Fraud Evaluation Processor"
    destination: "Audit Dispatcher"
    description: "Sends audit logs and attribution bitmasks"