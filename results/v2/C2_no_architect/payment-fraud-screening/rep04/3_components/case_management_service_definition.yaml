level: component
scope: "Component diagram for the Case Management Service container"
parentContainer:
  name: "Case Management Service"
elements:
  - type: "component"
    name: "Web Interface"
    technology: "Secure Web Interface"
    description: "Provides a secure web UI for fraud analysts and risk managers to review suspicious payment authorizations and manage queues."
  - type: "component"
    name: "Authentication & RBAC Manager"
    technology: "AWS Cognito (OIDC/OAuth2)"
    description: "Manages user authentication and role-based access control ensuring PCI-DSS compliant session security."
  - type: "component"
    name: "Queue Manager"
    technology: "Amazon Redis"
    description: "Handles low-latency priority queue management using sorted sets without database locks."
  - type: "component"
    name: "Audit Trail Storage Manager"
    technology: "Amazon S3 with Object Lock (S3 Glacier Instant Retrieval)"
    description: "Secures tamper-evident 7-year audit storage and case history using the AWS SDK."
  - type: "component"
    name: "Observability Agent"
    technology: "AWS X-Ray"
    description: "Provides distributed tracing for system observability."
relationships:
  - source: "Web Interface"
    destination: "Authentication & RBAC Manager"
    description: "Authenticates users via OIDC/OAuth2 over HTTPS."
  - source: "Web Interface"
    destination: "Queue Manager"
    description: "Reads and writes priority queue states via TCP."
  - source: "Web Interface"
    destination: "Audit Trail Storage Manager"
    description: "Stores audit trails and case history via AWS SDK."
  - source: "Web Interface"
    destination: "Observability Agent"
    description: "Sends distributed tracing data for monitoring."