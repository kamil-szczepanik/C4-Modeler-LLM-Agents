level: component
scope: "Component diagram for the Audit & Cryptographic Signer Sidecar container"
parentContainer:
  name: "Audit & Cryptographic Signer Sidecar"
elements:
  - type: "component"
    name: "Audit Sidecar"
    technology: "AWS ECS Fargate, Local encrypted tmpfs/EBS buffer"
    description: "Receives logs via local gRPC over mTLS, buffers them securely for the 1-minute failover window, generates cryptographic signatures via AWS KMS, and seals log batches."
relationships:
  - source: "Audit Sidecar"
    destination: "AWS KMS"
    description: "Generates cryptographic signatures and seals log batches [AWS SDK (HTTPS)]"
  - source: "Audit Sidecar"
    destination: "Amazon S3 WORM Bucket"
    description: "Stores immutable audit logs [AWS SDK (HTTPS)]"