level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
  description: "Evaluates card-not-present payment authorizations for fraud, providing sub-50ms decisions and case management for analysts with PCI-DSS Level 1 compliance."
elements:
  - type: "person"
    name: "Fraud Analysts & Risk Managers"
    description: "Human actors reviewing suspicious payments and managing rules."
  - type: "externalSystem"
    name: "Payment Gateway / Shoppers"
    description: "External systems and end-users sending transaction authorizations."
relationships:
  - source: "Payment Gateway / Shoppers"
    destination: "Real-Time Payment Fraud Screening"
    description: "Sends authorization requests"
    technology: "REST API over TLS 1.3"
  - source: "Fraud Analysts & Risk Managers"
    destination: "Real-Time Payment Fraud Screening"
    description: "Accesses case queues and manages rules"
    technology: "HTTPS with strict RBAC"