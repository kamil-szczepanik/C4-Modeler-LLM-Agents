level: container
scope: "Container diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
elements:
  - type: "person"
    name: "Cardholder / End Customer"
    description: "Sends payment authorizations for e-commerce transactions."
  - type: "person"
    name: "Fraud Operations Analyst"
    description: "Accesses Case Management UI to review and manage fraud cases."
  - type: "person"
    name: "Risk Manager / Quant"
    description: "Updates fraud models in the screening engine."
  - type: "person"
    name: "Fraud Ops Team Lead / Administrator"
    description: "Manages administrative settings and system operations."
  - type: "container"
    name: "Application Load Balancer"
    description: "Routes incoming traffic to internal services and containers."
    technology: "AWS ALB"
  - type: "container"
    name: "Scoring Container"
    description: "Performs real-time fraud scoring on card-not-present payment authorizations."
    technology: "AWS ECS Fargate"
  - type: "container"
    name: "Case Management Container"
    description: "Provides interface and backend for fraud analysts and operations teams."
    technology: "AWS ECS Fargate"
  - type: "container"
    name: "Amazon Aurora Serverless"
    description: "Relational database scaling dynamically for case management and transaction data."
    technology: "Amazon Aurora Serverless"
  - type: "container"
    name: "Amazon S3 with Object Lock"
    description: "Tamper-evident 7-year audit log storage satisfying regulatory compliance."
    technology: "Amazon S3, Object Lock"
  - type: "container"
    name: "AWS KMS"
    description: "Customer-managed keys securing decision logs and data at rest."
    technology: "AWS KMS"
  - type: "container"
    name: "AWS IAM Identity Center"
    description: "Provides hardware-backed MFA authentication for analysts and risk managers."
    technology: "AWS IAM Identity Center"
relationships:
  - source: "Cardholder / End Customer"
    destination: "Application Load Balancer"
    description: "Submits payment authorizations"
    technology: "HTTPS/TLS 1.3"
  - source: "Application Load Balancer"
    destination: "Scoring Container"
    description: "Routes traffic to scoring container"
    technology: "ECS service connect / mTLS"
  - source: "Scoring Container"
    destination: "Amazon Aurora Serverless"
    description: "Queries for transaction context"
    technology: "Internal TCP/TLS"
  - source: "Scoring Container"
    destination: "Amazon S3 with Object Lock"
    description: "Streams decision logs"
    technology: "AWS SDK / AWS KMS"
  - source: "Fraud Operations Analyst"
    destination: "AWS IAM Identity Center"
    description: "Authenticates via MFA"
    technology: "HTTPS"
  - source: "Fraud Operations Analyst"
    destination: "Application Load Balancer"
    description: "Accesses Case Management Container"
    technology: "HTTPS"
  - source: "Application Load Balancer"
    destination: "Case Management Container"
    description: "Routes case management traffic"
    technology: "Internal TLS"
  - source: "Case Management Container"
    destination: "Amazon Aurora Serverless"
    description: "Reads and writes case data"
    technology: "Internal TCP/TLS"