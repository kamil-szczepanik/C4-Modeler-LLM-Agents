level: component
scope: "Component diagram for the Amazon S3 with Object Lock container"
parentContainer:
  name: "Amazon S3 with Object Lock"
elements:
  - type: "component"
    name: "Object Storage Engine"
    technology: "AWS S3 Service"
    description: "Stores decision logs and provides tamper-evident storage."
  - type: "component"
    name: "Object Lock Manager"
    technology: "AWS S3 Compliance Mode"
    description: "Enforces 7-year retention and prevents deletion or modification of audit logs."
relationships:
  - source: "Object Storage Engine"
    destination: "Object Lock Manager"
    description: "Applies retention policies to stored logs"