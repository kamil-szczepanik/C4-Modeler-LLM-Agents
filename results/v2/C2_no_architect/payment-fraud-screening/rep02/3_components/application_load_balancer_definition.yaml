level: component
scope: "Component diagram for the Application Load Balancer container"
parentContainer:
  name: "Application Load Balancer"
elements:
  - type: "component"
    name: "AWS WAF"
    technology: "AWS WAF Managed Rules"
    description: "Inspects requests for volumetric and injection attacks using in-line filtering."
  - type: "component"
    name: "Path-Based Routing Engine"
    technology: "AWS ALB Routing Rules"
    description: "Routes payment traffic and analyst UI traffic with priority rules and weighted target groups."
  - type: "component"
    name: "TLS Termination"
    technology: "AWS ALB TLS 1.3"
    description: "Terminates incoming HTTPS / TLS 1.3 connections from Cardholders and Fraud Operations Analysts."
relationships:
  - source: "AWS WAF"
    destination: "Path-Based Routing Engine"
    description: "Forwards inspected requests [In-line filtering]"
  - source: "Path-Based Routing Engine"
    destination: "Scoring Container"
    description: "Routes payment traffic [ECS Service Connect / mTLS]"
  - source: "Path-Based Routing Engine"
    destination: "Case Management Container"
    description: "Routes analyst UI traffic [Internal TLS]"
  - source: "Path-Based Routing Engine"
    destination: "Amazon S3 with Object Lock"
    description: "Streams access logs [HTTPS / S3 API]"