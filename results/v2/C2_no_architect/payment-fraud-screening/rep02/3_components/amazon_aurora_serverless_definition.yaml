level: component
scope: "Component diagram for the Amazon Aurora Serverless container"
parentContainer:
  name: "Amazon Aurora Serverless"
elements:
  - type: "component"
    name: "Transaction Context Processor"
    technology: "PostgreSQL Engine / SQL"
    description: "Processes queries from the Scoring Container to retrieve transaction context for real-time fraud screening."
  - type: "component"
    name: "Case Data Repository"
    technology: "PostgreSQL Engine / SQL"
    description: "Reads and writes case data for analysts using case management tools."
  - type: "component"
    name: "Audit and Metrics Exporter"
    technology: "CloudWatch and S3 Integration"
    description: "Streams audit logs and performance metrics to Amazon CloudWatch and exports backups and audit trails to Amazon S3 with Object Lock."
relationships:
  - source: "Scoring Container"
    destination: "Transaction Context Processor"
    description: "Queries transaction context via Internal TCP/TLS (Port 5432/3306)"
  - source: "Case Management Container"
    destination: "Case Data Repository"
    description: "Reads and writes case data via Internal TCP/TLS (Port 5432/3306)"
  - source: "Audit and Metrics Exporter"
    destination: "Amazon CloudWatch"
    description: "Streams audit logs and performance metrics"
  - source: "Audit and Metrics Exporter"
    destination: "Amazon S3 with Object Lock"
    description: "Exports backups and audit trails for long-term retention"