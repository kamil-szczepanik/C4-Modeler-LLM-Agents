level: component
scope: "Component diagram for the Case Management Container container"
parentContainer:
  name: "Case Management Container"
elements:
  - type: "component"
    name: "Case Router"
    technology: "AWS ECS Fargate / Web Server"
    description: "Routes incoming case management traffic and handles HTTP requests."
  - type: "component"
    name: "Case Data Handler"
    technology: "AWS ECS Fargate / Application Logic"
    description: "Processes and manages case data read and write operations."
  - type: "component"
    name: "Audit Log Emitter"
    technology: "AWS SDK"
    description: "Emits signed audit logs to tamper-evident S3 storage."
relationships:
  - source: "Case Router"
    destination: "Case Data Handler"
    description: "Forwards traffic and API requests [Internal]"
  - source: "Case Data Handler"
    destination: "Audit Log Emitter"
    description: "Triggers emission of signed audit logs [HTTPS]"