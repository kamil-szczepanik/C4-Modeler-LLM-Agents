# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the AWS IAM Identity Center container"
parentContainer:
  name: "AWS IAM Identity Center"
elements:
  # Components within the parent container's boundary
  - type: "component"
    name: "Authentication Manager"
    technology: "AWS IAM Identity Center / SAML 2.0 / FIDO2"
    description: "Handles hardware-backed MFA and federated authentication for analysts, risk managers, team leads, and engineers."
  - type: "component"
    name: "SCIM Provisioning Engine"
    technology: "SCIM Protocol"
    description: "Synchronizes user identities and group memberships from the enterprise identity provider."
  - type: "component"
    name: "Access Control & Role Mapper"
    technology: "AWS IAM / Terraform"
    description: "Enforces role-based access control and administrative guardrails via AWS Organizations SCPs."
relationships:
  - source: "Authentication Manager"
    destination: "SCIM Provisioning Engine"
    description: "Federates authentication and user synchronization [SAML 2.0 / SCIM]"
  - source: "Authentication Manager"
    destination: "Access Control & Role Mapper"
    description: "Maps authenticated users to specific AWS roles and permissions"