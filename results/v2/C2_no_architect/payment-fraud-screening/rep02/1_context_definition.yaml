level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
  description: "Screens card-not-present payment authorizations for fraud at 3,000 TPS while maintaining PCI-DSS Level 1 compliance, providing real-time scoring, audit logging, and case management."
elements:
  - type: "person"
    name: "Cardholder / End Customer"
    description: "Sends payment authorizations for e-commerce transactions."
  - type: "person"
    name: "Fraud Operations Analyst"
    description: "Accesses Case Management UI to review and manage fraud cases."
  - type: "person"
    name: "Risk Manager / Quant"
    description: "Updates fraud models in the screening engine."
  - type: "person"
    name: "Fraud Ops Team Lead / Administrator"
    description: "Manages administrative settings and system operations."
  - type: "container"
    name: "API Gateway (AWS API Gateway + WAF)"
    description: "Edge routing and DDoS/bot mitigation at 3,000 TPS."
    technology: "AWS API Gateway, AWS WAF"
  - type: "container"
    name: "Fraud Screening Engine"
    description: "Containerized engine performing real-time fraud scoring using ONNX runtimes."
    technology: "AWS ECS Fargate, ONNX Runtimes"
  - type: "container"
    name: "Case Management Web UI"
    description: "Provides interface for fraud analysts and operations teams."
    technology: "Web UI, OIDC, OAuth2"
  - type: "container"
    name: "Event Streaming (AWS Managed Kafka - MSK)"
    description: "Handles asynchronous event streams and messaging."
    technology: "AWS MSK"
  - type: "container"
    name: "Audit Storage (AWS S3 with Object Lock and KMS)"
    description: "Tamper-evident 7-year audit logging for regulatory compliance."
    technology: "AWS S3, AWS KMS, Object Lock"
relationships:
  - source: "Cardholder / End Customer"
    destination: "API Gateway (AWS API Gateway + WAF)"
    description: "Sends payment authorizations"
    technology: "HTTPS/TLS 1.3"
  - source: "API Gateway (AWS API Gateway + WAF)"
    destination: "Fraud Screening Engine"
    description: "Routes authorization payloads"
    technology: "Internal TLS/AWS VPC"
  - source: "Fraud Screening Engine"
    destination: "Audit Storage (AWS S3 with Object Lock and KMS)"
    description: "Publishes decision audit logs"
    technology: "AWS SDK"
  - source: "Fraud Operations Analyst"
    destination: "Case Management Web UI"
    description: "Accesses case management interface"
    technology: "HTTPS with OIDC/OAuth2"
  - source: "Risk Manager / Quant"
    destination: "Fraud Screening Engine"
    description: "Updates fraud models"
    technology: "Internal API"