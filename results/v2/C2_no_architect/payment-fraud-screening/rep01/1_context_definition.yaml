level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
  description: "Screens card-not-present payment authorizations for fraud at 3,000 TPS while routing suspicious cases to analysts, providing sub-50ms fraud decisions and case management while maintaining PCI-DSS Level 1 compliance and 7-year tamper-evident auditability."
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Reviews and manages suspicious payment cases routed by the system."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "Sends payment authorizations for real-time fraud screening."
  - type: "externalSystem"
    name: "GitHub Actions"
    description: "CI/CD deployment pipeline for automated blue/green deployments."
relationships:
  - source: "External Payment Gateway"
    destination: "Real-Time Payment Fraud Screening"
    description: "Sends payment authorizations for screening"
    technology: "HTTPS / mTLS"
  - source: "Fraud Analyst"
    destination: "Real-Time Payment Fraud Screening"
    description: "Manages and reviews suspicious cases"
    technology: "HTTPS (OAuth2/OIDC, WebAuthn MFA)"
  - source: "GitHub Actions"
    destination: "Real-Time Payment Fraud Screening"
    description: "Deploys container updates and models"
    technology: "AWS API"