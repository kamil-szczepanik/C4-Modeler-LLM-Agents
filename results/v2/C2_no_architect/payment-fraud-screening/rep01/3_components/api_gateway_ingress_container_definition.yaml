level: component
scope: "Component diagram for the API Gateway / Ingress Container container"
parentContainer:
  name: "API Gateway / Ingress Container"
elements:
  - type: "component"
    name: "Ingress Router"
    technology: "AWS ECS Fargate / Envoy"
    description: "Terminates mTLS, validates TLS 1.3, and handles incoming payment authorizations from the External Payment Gateway."
  - type: "component"
    name: "Auth and WAF Filter"
    technology: "AWS WAF / Custom Middleware"
    description: "Enforces edge security, request validation, and PCI-DSS Level 1 compliance checks."
  - type: "component"
    name: "Routing Controller"
    technology: "Node.js / Go REST Handler"
    description: "Routes validated scoring requests over the internal VPC to the Scoring Engine Container."
relationships:
  - source: "Ingress Router"
    destination: "Auth and WAF Filter"
    description: "Forwards raw requests for security inspection"
  - source: "Auth and WAF Filter"
    destination: "Routing Controller"
    description: "Passes sanitized requests for internal routing"
  - source: "Routing Controller"
    destination: "Scoring Engine Container"
    description: "Routes scoring requests [REST over internal VPC]"