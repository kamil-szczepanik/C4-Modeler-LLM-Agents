level: component
scope: "Component diagram for the Scoring Engine Container container"
parentContainer:
  name: "Scoring Engine Container"
elements:
  - type: "component"
    name: "Fraud Scoring Controller"
    technology: "AWS ECS Fargate / Python REST API"
    description: "Receives incoming scoring requests from the API Gateway and coordinates the evaluation pipeline."
  - type: "component"
    name: "Model Inference Client"
    technology: "AWS SDK"
    description: "Invokes the SageMaker Real-Time Endpoint over VPC interface endpoints to execute fraud scoring logic."
  - type: "component"
    name: "Audit Log Dispatcher"
    technology: "AWS SDK with AWS KMS"
    description: "Offloads decision logs asynchronously to Amazon SQS with encryption to guarantee 7-year auditability."
relationships:
  - source: "Fraud Scoring Controller"
    destination: "Model Inference Client"
    description: "Invokes model inference [AWS SDK over VPC interface endpoints]"
  - source: "Fraud Scoring Controller"
    destination: "Audit Log Dispatcher"
    description: "Offloads audit logs asynchronously [AWS SDK with AWS KMS encryption]"