level: component
scope: "Component diagram for the Case Management Container container"
parentContainer:
  name: "Case Management Container"
elements:
  - type: "component"
    name: "Fraud Analyst"
    technology: "Human (OIDC/OAuth2 MFA)"
    description: "Reviews suspicious transactions and audits scoring decisions securely."
  - type: "component"
    name: "Case Management Service"
    technology: "AWS ECS Fargate Container"
    description: "Hosts containerized application with service auto-scaling, enforcing PCI-DSS Level 1 compliance and low-latency analyst workflows."
  - type: "component"
    name: "Amazon Aurora Serverless"
    technology: "Database Container"
    description: "Stores review cases and event-driven projections for query performance."
  - type: "component"
    name: "Amazon SQS"
    technology: "Message Queue Container"
    description: "Handles asynchronous dead-letter queues to prevent data loss during outages."
  - type: "component"
    name: "Amazon QLDB / S3 Object Lock"
    technology: "Immutable Ledger System"
    description: "Writes cryptographically signed analyst actions and overrides for 7-year auditability."
  - type: "component"
    name: "AWS Secrets Manager"
    technology: "Security Service"
    description: "Secures database credentials and OIDC secrets with automated rotation."
relationships:
  - source: "Fraud Analyst"
    destination: "Case Management Service"
    description: "Accesses review cases and audit trails via HTTPS with OIDC/OAuth2 MFA"
  - source: "Case Management Service"
    destination: "Amazon Aurora Serverless"
    description: "Reads and writes review cases and read-optimized audit projections using Database Protocol"
  - source: "Case Management Service"
    destination: "Amazon SQS"
    description: "Routes failed audit logs or feedback events to a Dead-Letter Queue using AWS SDK / SQS Protocol"
  - source: "Case Management Service"
    destination: "Amazon QLDB / S3 Object Lock"
    description: "Writes cryptographically signed analyst actions and overrides using AWS SDK / HTTPS"
  - source: "Case Management Service"
    destination: "AWS Secrets Manager"
    description: "Fetches database credentials and OIDC secrets using AWS SDK / HTTPS"