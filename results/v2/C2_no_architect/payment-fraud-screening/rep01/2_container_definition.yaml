level: container
scope: "Container diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Reviews and manages suspicious payment cases routed by the system."
  - type: "person"
    name: "Risk Operations Manager"
    description: "Manages risk operations and analyst workflows."
  - type: "person"
    name: "Fraud Data Scientist"
    description: "Updates and manages fraud detection machine learning models."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "Sends payment authorizations for real-time fraud screening."
  - type: "container"
    name: "API Gateway / Ingress Container"
    technology: "AWS ECS Fargate"
    description: "Routes incoming requests and handles ingress traffic."
  - type: "container"
    name: "Scoring Engine Container"
    technology: "AWS ECS Fargate"
    description: "Executes fraud scoring logic and interacts with the inference service and tamper-evident storage."
  - type: "container"
    name: "Case Management Container"
    technology: "AWS ECS Fargate"
    description: "Manages analyst reviews and review cases."
  - type: "container"
    name: "AWS SageMaker Serverless Inference"
    technology: "AWS SageMaker"
    description: "Provides serverless machine learning model inference for fraud scoring."
  - type: "container"
    name: "Amazon Aurora Serverless"
    technology: "Amazon Aurora"
    description: "Stores review cases and persistent application data."
  - type: "container"
    name: "QLDB / S3 Object Lock"
    technology: "Amazon QLDB / Amazon S3"
    description: "Provides tamper-evident storage for audit logs."
relationships:
  - source: "External Payment Gateway"
    destination: "API Gateway / Ingress Container"
    description: "Sends payment authorizations for real-time fraud screening"
    technology: "HTTPS (TLS 1.3)"
  - source: "API Gateway / Ingress Container"
    destination: "Scoring Engine Container"
    description: "Routes scoring requests"
    technology: "REST over internal VPC"
  - source: "Scoring Engine Container"
    destination: "AWS SageMaker Serverless Inference"
    description: "Invokes model inference"
    technology: "AWS SDK"
  - source: "Scoring Engine Container"
    destination: "QLDB / S3 Object Lock"
    description: "Writes tamper-evident decision logs"
    technology: "AWS SDK"
  - source: "Fraud Analyst"
    destination: "Case Management Container"
    description: "Accesses review cases"
    technology: "HTTPS with OIDC/OAuth2 MFA"
  - source: "Case Management Container"
    destination: "Amazon Aurora Serverless"
    description: "Reads and writes review cases"
    technology: "Database Protocol"