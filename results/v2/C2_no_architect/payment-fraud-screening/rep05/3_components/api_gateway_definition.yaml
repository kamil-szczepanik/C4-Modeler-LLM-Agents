# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  # Components within the parent container's boundary
  - type: "component"
    name: "AWS WAF Filter"
    technology: "AWS WAF"
    description: "Inspects incoming HTTPS traffic for common web attacks and enforces rate limiting for PCI-DSS compliance."
  - type: "component"
    name: "HTTP API Router"
    technology: "AWS API Gateway HTTP API"
    description: "Routes incoming payment authorization requests and analyst review requests to the appropriate internal ECS Fargate containers."
  - type: "component"
    name: "Auth Validator"
    technology: "AWS Cognito and JWT"
    description: "Validates JSON Web Tokens (JWT) for analyst review requests coming from the case management interface."
relationships:
  - source: "AWS WAF Filter"
    destination: "HTTP API Router"
    description: "Passes filtered and rate-limited requests"
  - source: "HTTP API Router"
    destination: "Auth Validator"
    description: "Delegates token validation for analyst requests"