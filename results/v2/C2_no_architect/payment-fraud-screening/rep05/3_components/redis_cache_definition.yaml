level: component
scope: "Component diagram for the Redis Cache container"
parentContainer:
  name: "Redis Cache"
elements:
  - type: "component"
    name: "Redis Master Node"
    technology: "Amazon ElastiCache Redis OSS (cache.m6g.large)"
    description: "Handles write operations and primary caching for active fallback rulesets with TLS in transit."
  - type: "component"
    name: "Redis Replica Node"
    technology: "Amazon ElastiCache Redis OSS (cache.m6g.large)"
    description: "Provides multi-AZ read redundancy to ensure high availability and sub-50ms latency for scoring queries."
relationships:
  - source: "Redis Master Node"
    destination: "Redis Replica Node"
    description: "Replicates fallback ruleset data asynchronously across availability zones"