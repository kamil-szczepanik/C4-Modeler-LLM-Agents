level: component
scope: "Component diagram for the Case Management Container container"
parentContainer:
  name: "Case Management Container"
elements:
  - type: "component"
    name: "Review Interface Controller"
    technology: "Node.js / React"
    description: "Provides the secure review interface and API backend for fraud analysts and managers to investigate suspicious transactions."
  - type: "component"
    name: "Audit Logger"
    technology: "AWS SDK / Python"
    description: "Generates and sends immutable audit trails and tamper-evident decision logs to storage."
  - type: "component"
    name: "Queue Manager"
    technology: "Node.js"
    description: "Manages SLA-driven case queues and state synchronization."
relationships:
  - source: "Review Interface Controller"
    destination: "Queue Manager"
    description: "Updates and retrieves case queue data"
  - source: "Review Interface Controller"
    destination: "Audit Logger"
    description: "Dispatches review decisions for immutable logging"