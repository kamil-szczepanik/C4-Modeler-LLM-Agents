# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Scoring Engine Container container"
parentContainer:
  name: "Scoring Engine Container"
elements:
  - type: "component"
    name: "Scoring Controller"
    technology: "AWS ECS Fargate / REST API"
    description: "Receives real-time scoring requests from the API Gateway via mTLS."
  - type: "component"
    name: "Fraud Evaluation Service"
    technology: "Python / Core Processing"
    description: "Evaluates card-not-present payment authorizations against fraud rules."
  - type: "component"
    name: "Fallback Rule Manager"
    technology: "Python / Redis Client"
    description: "Queries cached fallback ruleset during outages via isolated VPC subnet."
  - type: "component"
    name: "Audit Logger"
    technology: "AWS KMS / S3 SDK"
    description: "Writes cryptographically signed audit logs using AWS KMS envelope encryption."
relationships:
  - source: "Scoring Controller"
    destination: "Fraud Evaluation Service"
    description: "Invokes fraud evaluation logic"
  - source: "Fraud Evaluation Service"
    destination: "Fallback Rule Manager"
    description: "Queries cached fallback rules"
  - source: "Fraud Evaluation Service"
    destination: "Audit Logger"
    description: "Sends audit logs for secure storage"