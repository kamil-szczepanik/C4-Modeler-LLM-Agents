level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening Platform"
system:
  name: "Real-Time Payment Fraud Screening Platform"
  description: "A real-time payment fraud screening platform that evaluates card-not-present authorizations, manages fraud analyst reviews, and ensures PCI-DSS Level 1 compliance with 7-year tamper-evident auditability."
elements:
  - type: "person"
    name: "Cardholder"
    description: "End customer initiating transactions."
  - type: "person"
    name: "Fraud Analyst"
    description: "Internal analyst who reviews suspicious payments via the Case Management UI without accessing raw PAN data."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External client submitting payment authorizations."
relationships:
  - source: "Cardholder"
    destination: "Payment Gateway"
    description: "Initiates payment transactions"
    technology: "HTTPS"
  - source: "Payment Gateway"
    destination: "Real-Time Payment Fraud Screening Platform"
    description: "Submits authorization requests via HTTPS"
    technology: "HTTPS (TLS 1.3)"
  - source: "Fraud Analyst"
    destination: "Real-Time Payment Fraud Screening Platform"
    description: "Reviews suspicious payments via Case Management UI"
    technology: "HTTPS, OIDC/OAuth2, Hardware-backed MFA"