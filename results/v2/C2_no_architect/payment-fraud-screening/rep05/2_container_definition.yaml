level: container
scope: "Container diagram for Real-Time Payment Fraud Screening Platform"
system:
  name: "Real-Time Payment Fraud Screening Platform"
elements:
  - type: "person"
    name: "Cardholder"
    description: "End customer initiating transactions."
  - type: "person"
    name: "Fraud Analyst"
    description: "Internal analyst who reviews suspicious payments via the Case Management UI without accessing raw PAN data."
  - type: "person"
    name: "Risk/Fraud Operations Manager"
    description: "Manager overseeing operational metrics and fraud review workflows."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External client submitting payment authorizations."
  - type: "container"
    name: "API Gateway"
    technology: "AWS ECS (Fargate)"
    description: "Routes incoming scoring requests and secures API traffic."
  - type: "container"
    name: "Scoring Engine Container"
    technology: "AWS ECS (Fargate)"
    description: "Evaluates payment authorizations for fraud in real-time."
  - type: "container"
    name: "Case Management Container"
    technology: "AWS ECS (Fargate), AWS Cognito"
    description: "Provides review UI and operational metrics for fraud analysts and managers."
  - type: "container"
    name: "Redis Cache"
    technology: "AWS ElastiCache Serverless"
    description: "Powers the degraded-mode fallback cache for rules during outages."
  - type: "container"
    name: "S3 Glacier Object Lock Storage"
    technology: "AWS S3 Glacier with Object Lock, AWS KMS"
    description: "Stores tamper-evident 7-year audit logs using envelope encryption."
relationships:
  - source: "Cardholder"
    destination: "Payment Gateway"
    description: "Initiates payment transactions"
    technology: "HTTPS"
  - source: "Payment Gateway"
    destination: "API Gateway"
    description: "Sends payment authorization requests"
    technology: "HTTPS, mTLS, TLS 1.3"
  - source: "API Gateway"
    destination: "Scoring Engine Container"
    description: "Routes scoring requests"
    technology: "Internal VPC Networking"
  - source: "Scoring Engine Container"
    destination: "Redis Cache"
    description: "Queries cached fallback ruleset during outages"
    technology: "Isolated VPC Subnet"
  - source: "Scoring Engine Container"
    destination: "S3 Glacier Object Lock Storage"
    description: "Writes cryptographically signed audit logs"
    technology: "AWS KMS Envelope Encryption"
  - source: "Fraud Analyst"
    destination: "Case Management Container"
    description: "Accesses review UI and operational metrics"
    technology: "HTTPS, OAuth2/OIDC, AWS Cognito"
  - source: "Risk/Fraud Operations Manager"
    destination: "Case Management Container"
    description: "Accesses review UI and operational metrics"
    technology: "HTTPS, OAuth2/OIDC, AWS Cognito"