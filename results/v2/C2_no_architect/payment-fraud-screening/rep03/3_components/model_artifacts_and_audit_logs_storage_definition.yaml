level: component
scope: "Component diagram for the Model Artifacts and Audit Logs Storage container"
parentContainer:
  name: "Model Artifacts and Audit Logs Storage"
elements:
  - type: "component"
    name: "Model Artifacts Repository"
    technology: "Amazon S3 with Object Lock"
    description: "Stores cryptographically verified machine learning model artifacts with WORM compliance."
  - type: "component"
    name: "Audit Logs Storage"
    technology: "Amazon S3 with Object Lock and AWS KMS"
    description: "Stores immutable decision logs and inputs for 7-year tamper-evident auditability."
  - type: "component"
    name: "Analytics Query Engine"
    technology: "Amazon Athena and Lake Formation"
    description: "Enables secure, read-only analytics queries over S3 audit and model data with column-level controls."
relationships:
  - source: "Scoring Engine"
    destination: "Model Artifacts Repository"
    description: "Downloads cryptographically verified ML model artifacts [TLS 1.3]"
  - source: "Scoring Engine"
    destination: "Audit Logs Storage"
    description: "Persists decision logs and inputs into WORM storage via Amazon Kinesis Data Firehose [AWS KMS Encryption]"
  - source: "Risk Managers / Data Scientists"
    destination: "Model Artifacts Repository"
    description: "Deploys model artifacts [AWS CodePipeline]"
  - source: "Risk Managers / Data Scientists"
    destination: "Analytics Query Engine"
    description: "Queries historical logs [Amazon Athena]"