level: component
scope: "Component diagram for the Scoring Engine container"
parentContainer:
  name: "Scoring Engine"
elements:
  - type: "component"
    name: "Inference Controller"
    technology: "AWS ECS Fargate on AWS Graviton2"
    description: "Receives inbound payment authorization requests and coordinates real-time fraud scoring."
  - type: "component"
    name: "Model Runner"
    technology: "Python, AWS ECS Fargate"
    description: "Executes ML models using downloaded cryptographically verified model artifacts."
  - type: "component"
    name: "Audit Logger"
    technology: "AWS KMS, AWS QLDB, Amazon S3"
    description: "Persists tamper-evident decision logs, feature weights, and inputs into WORM storage."
relationships:
  - source: "Inference Controller"
    destination: "Model Runner"
    description: "Dispatches transaction payloads for ML inference [Internal VPC protocols]"
  - source: "Model Runner"
    destination: "Audit Logger"
    description: "Sends decision logs and feature weights for persistence [AWS KMS Encryption]"