level: component
scope: "Component diagram for the Security and Management Services container"
parentContainer:
  name: "Security and Management Services"
elements:
  - type: "component"
    name: "AWS IAM"
    technology: "AWS Identity and Access Management"
    description: "Manages fine-grained access control and permissions for users, services, and resources."
  - type: "component"
    name: "AWS Secrets Manager"
    technology: "AWS Secrets Manager"
    description: "Secures, manages, and rotates database credentials and API keys."
  - type: "component"
    name: "AWS KMS"
    technology: "AWS Key Management Service"
    description: "Handles cryptographic operations with client-side key caching to encrypt/decrypt cardholder data and audit logs."
  - type: "component"
    name: "AWS CodePipeline"
    technology: "AWS CodePipeline"
    description: "Automates zero-downtime deployments and model updates."
  - type: "component"
    name: "AWS CloudWatch"
    technology: "Amazon CloudWatch"
    description: "Monitors system health and logs performance metrics using tail-based sampling."
  - type: "component"
    name: "AWS X-Ray"
    technology: "AWS X-Ray"
    description: "Provides distributed tracing for microservices requests."
  - type: "component"
    name: "Amazon Inspector"
    technology: "Amazon Inspector"
    description: "Performs automated vulnerability scanning during CI/CD pipelines."
  - type: "component"
    name: "AWS Signer"
    technology: "AWS Signer"
    description: "Provides integrated artifact signing for secure deployments."
relationships:
  - source: "AWS CodePipeline"
    destination: "AWS Signer"
    description: "Signs deployment artifacts"
  - source: "AWS CodePipeline"
    destination: "Amazon Inspector"
    description: "Scans artifacts for vulnerabilities"
  - source: "AWS CloudWatch"
    destination: "AWS X-Ray"
    description: "Aggregates telemetry and traces"