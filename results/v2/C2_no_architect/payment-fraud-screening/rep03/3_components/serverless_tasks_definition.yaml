level: component
scope: "Component diagram for the Serverless Tasks container"
parentContainer:
  name: "Serverless Tasks"
elements:
  - type: "component"
    name: "Model and Rule Sync Function"
    technology: "AWS Lambda"
    description: "Executes asynchronous tasks to fetch fraud models from Amazon S3."
  - type: "component"
    name: "Audit and Compliance Dispatch Function"
    technology: "AWS Lambda with DLQ"
    description: "Dispatches audit logs and compliance data asynchronously to AWS QLDB."
relationships:
  - source: "Model and Rule Sync Function"
    destination: "Model Artifacts and Audit Logs Storage"
    description: "Fetches fraud models via HTTPS/TLS 1.3"
  - source: "Audit and Compliance Dispatch Function"
    destination: "Ledger Database"
    description: "Sends audit logs with DLQ support via HTTPS/TLS 1.3"