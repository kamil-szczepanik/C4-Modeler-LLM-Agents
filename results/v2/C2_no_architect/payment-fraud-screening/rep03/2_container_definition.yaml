level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Cardholders"
    description: "End-users initiating card-not-present payment transactions."
  - type: "person"
    name: "Fraud Analysts"
    description: "Internal users reviewing flagged transactions and case management queues."
  - type: "person"
    name: "Risk Managers / Data Scientists"
    description: "Internal users updating rules and deploying machine learning models."
  - type: "person"
    name: "Compliance & Audit Officers"
    description: "Internal users auditing tamper-evident transaction logs and WORM storage."
  - type: "externalSystem"
    name: "Payment Gateway / Processing Engine"
    description: "External payment system submitting payment authorization requests."
  - type: "container"
    name: "Amazon API Gateway and ALB"
    description: "Ingress point handling TLS 1.3, mTLS, and routing traffic to internal containers within private subnets."
    technology: "AWS API Gateway, Application Load Balancer (ALB)"
  - type: "container"
    name: "Scoring Engine"
    description: "Core container evaluating payment authorization requests in real-time using ML models and heuristic fallbacks."
    technology: "AWS ECS Fargate"
  - type: "container"
    name: "Case Management UI & Backend"
    description: "Interface and backend supporting fraud analysts with tokenized, masked PAN data for case reviews."
    technology: "AWS ECS Fargate"
  - type: "container"
    name: "Serverless Tasks"
    description: "Performs asynchronous tasks and backend processing operations."
    technology: "AWS Lambda"
  - type: "container"
    name: "Model Artifacts and Audit Logs Storage"
    description: "Stores cryptographically verified ML model artifacts and WORM audit logs with Object Lock."
    technology: "Amazon S3"
  - type: "container"
    name: "Ledger Database"
    description: "Maintains tamper-evident, immutable transaction decision logs and feature weights."
    technology: "AWS QLDB"
  - type: "container"
    name: "Security and Management Services"
    description: "Manages access control, secrets, encryption keys, CI/CD pipelines, and observability."
    technology: "AWS IAM, AWS Secrets Manager, AWS KMS, AWS CodePipeline, AWS CloudWatch & X-Ray"
relationships:
  - source: "Payment Gateway / Processing Engine"
    destination: "Amazon API Gateway and ALB"
    description: "Forwards payment authorization requests"
    technology: "HTTPS / TLS 1.3 and mTLS"
  - source: "Amazon API Gateway and ALB"
    destination: "Scoring Engine"
    description: "Routes traffic over mTLS to internal containers"
    technology: "Internal VPC protocols, mTLS"
  - source: "Scoring Engine"
    destination: "Model Artifacts and Audit Logs Storage"
    description: "Downloads cryptographically verified ML model artifacts"
    technology: "TLS 1.3"
  - source: "Scoring Engine"
    destination: "Ledger Database"
    description: "Persists tamper-evident decision logs and feature weights"
    technology: "AWS KMS Encryption"
  - source: "Scoring Engine"
    destination: "Model Artifacts and Audit Logs Storage"
    description: "Persists decision logs and inputs into WORM storage"
    technology: "AWS KMS Encryption"
  - source: "Fraud Analysts"
    destination: "Case Management UI & Backend"
    description: "Interacts with case management for reviews"
    technology: "HTTPS (OIDC/MFA authenticated)"
  - source: "Risk Managers / Data Scientists"
    destination: "Model Artifacts and Audit Logs Storage"
    description: "Deploys and updates model artifacts"
    technology: "AWS CodePipeline"
  - source: "AWS CodePipeline"
    destination: "Scoring Engine"
    description: "Deploys zero-downtime model updates and container rollouts"
    technology: "AWS ECS Deployment"