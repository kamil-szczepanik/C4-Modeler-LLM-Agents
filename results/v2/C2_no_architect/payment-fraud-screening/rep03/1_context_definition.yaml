level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "A real-time payment fraud screening system that evaluates card-not-present transactions for a mid-size payment processor and provides case management for fraud analysts, ensuring PCI-DSS Level 1 compliance, sub-50ms P99 latency, and 7-year tamper-evident auditability."
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Internal user reviewing suspicious transactions via case management UI."
  - type: "person"
    name: "Risk Manager / Data Scientist"
    description: "Internal user updating rules and models without downtime."
  - type: "person"
    name: "Compliance & Audit Officer"
    description: "Internal user auditing 7-year tamper-evident transaction logs."
  - type: "externalSystem"
    name: "Payment Gateway / Processing Engine"
    description: "External system submitting payment authorizations via mTLS."
  - type: "container"
    name: "API Gateway / ALB"
    description: "Ingress point handling OAuth2/OIDC token validation and TLS 1.3."
    technology: "AWS ALB / API Gateway"
  - type: "container"
    name: "Scoring Engine"
    description: "Core container evaluating transactions with cached heuristic fallback."
    technology: "AWS ECS Fargate"
  - type: "container"
    name: "Case Management UI"
    description: "Interface for fraud analysts with strict data masking."
    technology: "Web UI"
  - type: "container"
    name: "Audit & Ledger Storage"
    description: "AWS QLDB and Amazon S3 Glacier for 7-year retention."
    technology: "AWS QLDB / Amazon S3 Glacier"
relationships:
  - source: "Payment Gateway / Processing Engine"
    destination: "API Gateway / ALB"
    description: "Submits payment authorization requests"
    technology: "mTLS and HTTPS (TLS 1.3)"
  - source: "API Gateway / ALB"
    destination: "Scoring Engine"
    description: "Routes authorization scoring requests"
    technology: "Internal VPC protocols"
  - source: "Scoring Engine"
    destination: "Audit & Ledger Storage"
    description: "Writes cryptographically secured decision logs"
    technology: "AWS KMS and Amazon QLDB"
  - source: "Fraud Analyst"
    destination: "Case Management UI"
    description: "Accesses case management"
    technology: "HTTPS with OIDC/SAML and hardware-token MFA"
  - source: "Risk Manager / Data Scientist"
    destination: "Scoring Engine"
    description: "Updates fraud models and rules"
    technology: "Secure administrative APIs"