level: container
scope: "Container diagram for Real-Time Payment Fraud Screening Platform"
system:
  name: "Real-Time Payment Fraud Screening Platform"
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Internal user reviewing suspicious transactions via case management UI."
  - type: "person"
    name: "Risk Manager / Data Scientist"
    description: "Internal user updating scoring models and rules with zero downtime."
  - type: "person"
    name: "Merchant Support"
    description: "Internal user accessing read-only audit logs for dispute resolution."
  - type: "externalSystem"
    name: "Merchant / Payment Gateway System"
    description: "External system submitting payment authorization requests via REST API."
  - type: "container"
    name: "Scoring Engine Container"
    technology: "AWS ECS on Fargate, gRPC, HTTPS, TLS 1.3"
    description: "Processes card-not-present payment authorizations in real-time, executing fraud scoring within the CDE private subnet."
  - type: "container"
    name: "Case Management Container"
    technology: "AWS ECS on Fargate, REST, mTLS"
    description: "Provides analyst case management isolated in an external subnet."
relationships:
  - source: "Merchant / Payment Gateway System"
    destination: "Scoring Engine Container"
    description: "Submits payment authorization requests"
    technology: "gRPC/HTTPS with TLS 1.3"
  - source: "Fraud Analyst"
    destination: "Case Management Container"
    description: "Reviews flagged transactions"
    technology: "HTTPS (OAuth 2.0 / OIDC JWT)"
  - source: "Case Management Container"
    destination: "Scoring Engine Container"
    description: "Queries and manages case details"
    technology: "internal REST/mTLS APIs"