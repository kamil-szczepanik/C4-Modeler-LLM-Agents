level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening Platform"
system:
  name: "Real-Time Payment Fraud Screening Platform"
  description: "A real-time payment fraud screening platform that evaluates card-not-present payment authorizations within 50 milliseconds, providing automated scoring, case management, and immutable audit logs."
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Internal user reviewing suspicious transactions via case management UI."
  - type: "person"
    name: "Risk Manager / Data Scientist"
    description: "Internal user updating scoring models and rules with zero downtime."
  - type: "person"
    name: "Merchant Support"
    description: "Internal user accessing read-only audit logs for dispute resolution."
  - type: "externalSystem"
    name: "Merchant / Payment Gateway System"
    description: "External system submitting payment authorization requests via REST API."
relationships:
  - source: "Merchant / Payment Gateway System"
    destination: "Real-Time Payment Fraud Screening Platform"
    description: "Submits authorization requests"
    technology: "HTTPS, TLS 1.3, mTLS, API keys"
  - source: "Fraud Analyst"
    destination: "Real-Time Payment Fraud Screening Platform"
    description: "Reviews flagged transactions"
    technology: "HTTPS, OIDC, MFA"
  - source: "Risk Manager / Data Scientist"
    destination: "Real-Time Payment Fraud Screening Platform"
    description: "Deploys updated models and rules with zero downtime"
    technology: "CI/CD pipelines"
  - source: "Merchant Support"
    destination: "Real-Time Payment Fraud Screening Platform"
    description: "Accesses read-only audit logs for dispute resolution"
    technology: "HTTPS"