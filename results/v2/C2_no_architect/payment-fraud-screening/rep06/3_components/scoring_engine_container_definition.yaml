level: component
scope: "Component diagram for the Scoring Engine Container container"
parentContainer:
  name: "Scoring Engine Container"
elements:
  - type: "component"
    name: "API Ingestion Handler"
    technology: "gRPC / HTTPS with TLS 1.3"
    description: "Receives real-time payment authorization requests from payment gateways with sub-50ms P99 latency."
  - type: "component"
    name: "Real-Time Scoring Engine"
    technology: "AWS ECS on Fargate"
    description: "Evaluates transactions against fraud detection models and manages cryptographic signing of decisions."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "AWS SDK / AWS S3 Object Lock"
    description: "Stores cryptographically signed decisions and immutable audit logs for 7-year tamper-evident compliance."
relationships:
  - source: "API Ingestion Handler"
    destination: "Real-Time Scoring Engine"
    description: "Forwards payment authorization requests for real-time fraud scoring."
  - source: "Real-Time Scoring Engine"
    destination: "Audit & Compliance Logger"
    description: "Sends signed decisions and audit logs for WORM storage."