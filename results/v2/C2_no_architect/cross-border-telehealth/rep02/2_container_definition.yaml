level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients accessing video consultations, e-prescriptions, and the AI symptom checker via Web/Mobile Clients."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals conducting consultations and issuing e-prescriptions via Web/Mobile Clients."
  - type: "externalSystem"
    name: "Local Pharmacy Networks"
    description: "Local pharmacy networks integrating via HL7 FHIR and national EU e-prescription standards."
  - type: "container"
    name: "API Gateway Container"
    technology: "GCP GKE, OPA (Open Policy Agent), Istio"
    description: "Handles ingress traffic and dynamic, policy-based access control with OPA."
  - type: "container"
    name: "Consent & Identity Management Container"
    technology: "GCP GKE, Istio"
    description: "Manages consent and identity enforcement for EU and US patients."
  - type: "container"
    name: "Video Streaming Container"
    technology: "WebRTC, Prometheus/Grafana, GCP GKE"
    description: "Provides real-time video consultations supporting adaptive bitrate for degraded modes."
  - type: "container"
    name: "AI Symptom Checker Container"
    technology: "GCP GKE, Cloud KMS"
    description: "Provides AI-driven symptom analysis with cryptographically signed audit logging."
  - type: "container"
    name: "Local Pharmacy Integration Containers"
    technology: "GCP GKE, HL7 FHIR"
    description: "Integrates with local pharmacy networks using national EU e-prescription standards and HL7 FHIR."
  - type: "container"
    name: "Regional WORM Storage Buckets"
    technology: "GCP Cloud Storage WORM"
    description: "Stores cryptographically signed audit logs and AI outputs ensuring EU MDR traceability."
relationships:
  - source: "Patients"
    destination: "API Gateway Container"
    description: "Accesses consultations, e-prescriptions, and AI symptom checker"
    technology: "HTTPS/WSS"
  - source: "Licensed Clinicians"
    destination: "API Gateway Container"
    description: "Manages patient interactions and clinical workflows"
    technology: "HTTPS/WSS"
  - source: "API Gateway Container"
    destination: "Consent & Identity Management Container"
    description: "Validates consent and identity via service mesh"
    technology: "Istio Service Mesh (mTLS)"
  - source: "API Gateway Container"
    destination: "Video Streaming Container"
    description: "Routes video consultation requests"
    technology: "Istio Service Mesh (mTLS)"
  - source: "API Gateway Container"
    destination: "AI Symptom Checker Container"
    description: "Routes requests to the AI symptom checker"
    technology: "Istio Service Mesh (mTLS)"
  - source: "API Gateway Container"
    destination: "Local Pharmacy Integration Containers"
    description: "Routes e-prescription requests"
    technology: "Istio Service Mesh (mTLS)"
  - source: "Video Streaming Container"
    destination: "Patients"
    description: "Streams video consultations with adaptive bitrate"
    technology: "WebRTC"
  - source: "Video Streaming Container"
    destination: "Licensed Clinicians"
    description: "Streams video consultations with adaptive bitrate"
    technology: "WebRTC"
  - source: "AI Symptom Checker Container"
    destination: "Regional WORM Storage Buckets"
    description: "Persists AI outputs and audit trails"
    technology: "HTTPS (TLS 1.3)"
  - source: "Local Pharmacy Integration Containers"
    destination: "Local Pharmacy Networks"
    description: "Sends e-prescriptions to pharmacy networks"
    technology: "HL7 FHIR and national EU e-prescription standards"