level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients across the EU and US while guaranteeing strict regulatory compliance, data residency, and low-bandwidth support."
elements:
  - type: "person"
    name: "Patients"
    description: "Rural and urban patients accessing video consultations, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals conducting consultations and issuing e-prescriptions."
  - type: "person"
    name: "Platform Administrators"
    description: "Administrators managing the platform using FIDO2/WebAuthn hardware tokens."
  - type: "person"
    name: "Regional Health Authorities/Auditors"
    description: "External authorities auditing system compliance and immutable audit logs."
  - type: "externalSystem"
    name: "Local Pharmacy Networks"
    description: "EU national standards and US HL7 FHIR endpoints for fulfilling e-prescriptions."
  - type: "container"
    name: "Regional API Gateways"
    description: "GCP-hosted gateways handling ingress traffic for the EU and US regions."
    technology: "HTTPS/TLS 1.3, mTLS"
  - type: "container"
    name: "Video Consultation Service"
    description: "Handles real-time video consultations with adaptive bitrate streaming."
    technology: "WebRTC, Cloud CDN/Media CDN"
  - type: "container"
    name: "AI Symptom Checker Service"
    description: "Provides AI-driven symptom analysis for patients."
    technology: "GCP"
  - type: "container"
    name: "Consent Management Engine"
    description: "Decentralized consent management enforcing regional data policies."
    technology: "Scoped OAuth 2.0 / OpenID Connect"
  - type: "container"
    name: "Immutable Audit Logging Pipeline"
    description: "Maintains immutable audit trails for compliance and traceability."
    technology: "GCP Cloud Logging, OpenTelemetry"
relationships:
  - source: "Patients"
    destination: "Regional API Gateways"
    description: "Accesses video consultations, AI symptom checker, and e-prescriptions"
    technology: "HTTPS/TLS 1.3 and mTLS"
  - source: "Licensed Clinicians"
    destination: "Regional API Gateways"
    description: "Conducts consultations and manages patient interactions"
    technology: "HTTPS/TLS 1.3 and mTLS"
  - source: "Regional API Gateways"
    destination: "Local Pharmacy Networks"
    description: "Sends e-prescriptions to regional pharmacy endpoints"
    technology: "REST/HL7 FHIR (US) and national e-prescription APIs (EU)"
  - source: "Video Consultation Service"
    destination: "Patients"
    description: "Streams video consultations with adaptive bitrate"
    technology: "WebRTC (<300 kbit/s connections)"
  - source: "Immutable Audit Logging Pipeline"
    destination: "Regional Health Authorities/Auditors"
    description: "Provides compliance and audit data"
    technology: "Dedicated read-only API gateways"