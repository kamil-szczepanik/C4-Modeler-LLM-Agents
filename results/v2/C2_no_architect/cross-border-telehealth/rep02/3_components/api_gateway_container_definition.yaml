level: component
scope: "Component diagram for the API Gateway Container container"
parentContainer:
  name: "API Gateway Container"
elements:
  - type: "component"
    name: "Request Router"
    technology: "GCP GKE, Istio, WAF"
    description: "Inspects incoming HTTPS/WSS traffic, applies Web Application Firewall rules, and routes requests to appropriate backend containers."
  - type: "component"
    name: "Policy Enforcement Engine"
    technology: "Open Policy Agent (OPA)"
    description: "Evaluates dynamic data residency, access control, and purpose-based consent rules at runtime."
  - type: "component"
    name: "Security & TLS Terminator"
    technology: "Istio Service Mesh, TLS 1.3"
    description: "Terminates external TLS 1.3 connections and establishes secure mTLS tunnels for internal service-to-service communication."
relationships:
  - source: "Request Router"
    destination: "Policy Enforcement Engine"
    description: "Validates incoming request compliance [OPA evaluation]"
  - source: "Request Router"
    destination: "Security & TLS Terminator"
    description: "Offloads cryptographic operations and establishes internal mTLS [Istio Service Mesh (mTLS)]"