level: component
scope: "Component diagram for the Video Streaming Container container"
parentContainer:
  name: "Video Streaming Container"
elements:
  - type: "component"
    name: "WebRTC Media Server"
    technology: "WebRTC over DTLS-SRTP, GCP GKE"
    description: "Streams real-time video with adaptive bitrate and end-to-end encryption supporting unstable connections."
  - type: "component"
    name: "Session Consent Verifier"
    technology: "gRPC, Istio"
    description: "Verifies active session consent with the Consent & Identity Management Container."
  - type: "component"
    name: "Telemetry and Monitoring Agent"
    technology: "Prometheus, Grafana"
    description: "Tracks telemetry for Quality of Experience (QoE) metrics and clinical reliability."
relationships:
  - source: "WebRTC Media Server"
    destination: "Session Consent Verifier"
    description: "Verifies active session consent [gRPC]"
  - source: "WebRTC Media Server"
    destination: "Telemetry and Monitoring Agent"
    description: "Sends telemetry and QoE metrics"