level: component
scope: "Component diagram for the AI Symptom Checker Container container"
parentContainer:
  name: "AI Symptom Checker Container"
elements:
  - type: "component"
    name: "Triage Controller"
    technology: "Python, FastAPI, Server-Sent Events/SSE"
    description: "Handles incoming sanitized requests from the API Gateway and streams triage results over unstable rural internet connections."
  - type: "component"
    name: "AI Inference Engine"
    technology: "Confidential VMs with AMD SEV-SNP, GCP Binary Authorization"
    description: "Executes symptom checking models in memory securely, protecting patient health data and verifying model weights cryptographically."
  - type: "component"
    name: "Audit Logger"
    technology: "HTTPS TLS 1.3, GCP Cloud Storage WORM APIs"
    description: "Persists immutable audit logs and versioned inputs to regional WORM storage buckets for compliance."
relationships:
  - source: "Triage Controller"
    destination: "AI Inference Engine"
    description: "Invokes inference on sanitized inputs [In-Memory Confidential Computing]"
  - source: "AI Inference Engine"
    destination: "Audit Logger"
    description: "Persists immutable audit logs and versioned inputs [HTTPS TLS 1.3]"