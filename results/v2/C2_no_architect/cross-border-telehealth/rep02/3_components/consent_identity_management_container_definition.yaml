level: component
scope: "Component diagram for the Consent & Identity Management Container container"
parentContainer:
  name: "Consent & Identity Management Container"
elements:
  - type: "component"
    name: "Identity Verification & OAuth 2.0 Engine"
    technology: "OAuth 2.0 with FAPI Profiles & JWTs"
    description: "Handles secure authentication, issues FAPI-compliant JWTs, and verifies user identity for patients, clinicians, and administrators."
  - type: "component"
    name: "Fine-Grained Consent Manager"
    technology: "Open Policy Agent (OPA) & Istio Service Mesh"
    description: "Manages fine-grained data sharing consent claims, enforcing zero-trust access policies across regional boundaries."
  - type: "component"
    name: "Audit Log Emitter"
    technology: "Apache Kafka"
    description: "Asynchronously streams immutable, encrypted audit logs and consent events to Regional WORM Storage Buckets."
relationships:
  - source: "Identity Verification & OAuth 2.0 Engine"
    destination: "Fine-Grained Consent Manager"
    description: "Validates user tokens and evaluates identity claims"
  - source: "Fine-Grained Consent Manager"
    destination: "Audit Log Emitter"
    description: "Publishes consent and access decisions"
  - source: "Audit Log Emitter"
    destination: "Regional WORM Storage Buckets"
    description: "Streams immutable audit logs asynchronously"