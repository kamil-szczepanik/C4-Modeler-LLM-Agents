level: component
scope: "Component diagram for the Regional WORM Storage Buckets container"
parentContainer:
  name: "Regional WORM Storage Buckets"
elements:
  - type: "component"
    name: "Immutable Object Store"
    technology: "GCP Cloud Storage WORM"
    description: "Stores immutable AI outputs, consent-backed audit events, and compliance reports with Object Lock in compliance mode."
  - type: "component"
    name: "Encryption Manager"
    technology: "GCP Cloud KMS"
    description: "Applies Customer-Managed Encryption Keys (CMEK) and Multi-Party Authorization (MPA) for strict regional data residency."
relationships:
  - source: "Encryption Manager"
    destination: "Immutable Object Store"
    description: "Enforces encryption and decryption control [HTTPS (TLS 1.3)]"