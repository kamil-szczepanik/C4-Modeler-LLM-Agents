level: component
scope: "Component diagram for the Local Pharmacy Integration Containers container"
parentContainer:
  name: "Local Pharmacy Integration Containers"
elements:
  - type: "component"
    name: "Prescription Router"
    technology: "Istio Service Mesh and Envoy"
    description: "Routes e-prescription requests to local pharmacy networks using mTLS."
  - type: "component"
    name: "FHIR Adapter"
    technology: "HL7 FHIR (US) and national EU standards"
    description: "Transforms payloads to meet local pharmacy network transmission standards."
  - type: "component"
    name: "Event Publisher"
    technology: "GCP Pub/Sub Client"
    description: "Publishes state-change events and manages retries via dead-letter queues."
  - type: "component"
    name: "Audit Logger"
    technology: "GCP Cloud Storage WORM Client"
    description: "Immutably logs transmission payloads and ACK/NACK responses."
relationships:
  - source: "Prescription Router"
    destination: "FHIR Adapter"
    description: "Transforms e-prescription payloads"
  - source: "FHIR Adapter"
    destination: "Event Publisher"
    description: "Publishes state-change events"
  - source: "Event Publisher"
    destination: "Audit Logger"
    description: "Triggers immutable logging of transmission payloads"