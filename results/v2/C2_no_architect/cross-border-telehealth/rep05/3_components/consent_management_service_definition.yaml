level: component
scope: "Component diagram for the Consent Management Service container"
parentContainer:
  name: "Consent Management Service"
elements:
  - type: "component"
    name: "Consent Controller"
    technology: "Istio Service Mesh / REST"
    description: "Enforces granular data-sharing consents and handles incoming API requests."
  - type: "component"
    name: "Compliance Engine"
    technology: "Python / Go"
    description: "Enforces regional compliance for GDPR and HIPAA requirements."
  - type: "component"
    name: "Token Validator"
    technology: "OAuth 2.0 / OIDC / JWT"
    description: "Validates short-lived (<60s) cryptographically signed tokens for instant consent revocation."
  - type: "component"
    name: "Audit Logger"
    technology: "Encrypted gRPC"
    description: "Streams immutable audit logs and consent history to Cloud Storage WORM."
relationships:
  - source: "Consent Controller"
    destination: "Token Validator"
    description: "Validates user authentication and token exchange [mTLS / OAuth 2.0 / OIDC]"
  - source: "Consent Controller"
    destination: "Compliance Engine"
    description: "Checks regional compliance rules"
  - source: "Compliance Engine"
    destination: "Audit Logger"
    description: "Streams immutable audit logs and consent history [Encrypted gRPC]"