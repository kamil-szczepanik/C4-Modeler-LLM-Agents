level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Regional Istio Ingress Gateways"
    technology: "Istio Ingress with SPIFFE/SPIRE"
    description: "Enforces strict data residency boundaries, geo-aware routing, circuit breaking, and mTLS in europe-west3 and us-central1."
  - type: "component"
    name: "Edge Routing & WebRTC SFU Containers"
    technology: "WebRTC SFU / TLS 1.3"
    description: "Handles edge routing and video containers for secure consultations."
  - type: "component"
    name: "Multi-region Web/Mobile Clients"
    technology: "Web / Mobile Clients"
    description: "End users including patients and licensed clinicians accessing the platform."
  - type: "component"
    name: "Consent Management Service"
    technology: "OAuth 2.0 / OIDC"
    description: "Manages authentication, authorization, and consent."
  - type: "component"
    name: "AI Symptom Checker Container"
    technology: "AI/ML Runtime"
    description: "Processes AI-driven symptom checking requests with model version headers."
  - type: "component"
    name: "E-Prescription Routing Container"
    technology: "GCP Pub/Sub & Cryptographic Digital Signatures"
    description: "Routes e-prescriptions securely via GCP Pub/Sub."
relationships:
  - source: "Multi-region Web/Mobile Clients"
    destination: "Regional Istio Ingress Gateways"
    description: "HTTPS, WRTC/TLS 1.3"
  - source: "Regional Istio Ingress Gateways"
    destination: "Consent Management Service"
    description: "OAuth 2.0 / OIDC"
  - source: "Regional Istio Ingress Gateways"
    destination: "AI Symptom Checker Container"
    description: "mTLS with model version headers and request signing"
  - source: "Regional Istio Ingress Gateways"
    destination: "E-Prescription Routing Container"
    description: "mTLS via GCP Pub/Sub"