level: component
scope: "Component diagram for the E-Prescription Routing Container container"
parentContainer:
  name: "E-Prescription Routing Container"
elements:
  - type: "component"
    name: "Stateless Routing Workers"
    technology: "GCP GKE / Horizontal Pod Autoscaling (HPA)"
    description: "Processes and dispatches digitally signed e-prescriptions with autoscaling based on queue depth."
  - type: "component"
    name: "Messaging and Queue Manager"
    technology: "GCP Pub/Sub & DLQs"
    description: "Handles asynchronous queuing, retries, and dead-letter queue management for unstable legacy endpoints."
  - type: "component"
    name: "Security and Key Manager"
    technology: "GCP Cloud KMS & Cloud HSM"
    description: "Manages customer-managed encryption (CMEK) and hardware-backed signing keys for data protection and non-repudiation."
  - type: "component"
    name: "Telemetry and Monitoring"
    technology: "OpenTelemetry & Prometheus"
    description: "Delivers distributed tracing and fine-grained metrics for queue lag and circuit breaker monitoring."
relationships:
  - source: "Stateless Routing Workers"
    destination: "Messaging and Queue Manager"
    description: "Queues and dispatches payloads with cryptographic digital signatures"
  - source: "Stateless Routing Workers"
    destination: "Security and Key Manager"
    description: "Manages CMEK encryption and clinician signing keys"
  - source: "Stateless Routing Workers"
    destination: "Telemetry and Monitoring"
    description: "Reports traces and fine-grained metrics"