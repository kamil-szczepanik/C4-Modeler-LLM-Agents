level: component
scope: "Component diagram for the AI Symptom Checker Container container"
parentContainer:
  name: "AI Symptom Checker Container"
elements:
  - type: "component"
    name: "Symptom Analysis API Handler"
    technology: "Python, FastAPI"
    description: "Receives and validates incoming symptom analysis requests from the API Gateway."
  - type: "component"
    name: "ML Inference Engine"
    technology: "Containerized ML Runtime, TensorFlow/PyTorch"
    description: "Processes patient symptoms to provide preliminary triage and recommendations."
  - type: "component"
    name: "Session State Manager"
    technology: "Regional Redis Cache Client"
    description: "Manages session state and ensures offline resilience using AES-256 encryption."
  - type: "component"
    name: "Audit Logger"
    technology: "Fluentbit, GCP BigQuery Client"
    description: "Streams immutable audit logs and feedback securely into GCP BigQuery."
relationships:
  - source: "Symptom Analysis API Handler"
    destination: "ML Inference Engine"
    description: "Passes sanitized symptom data for evaluation [Internal gRPC]"
  - source: "ML Inference Engine"
    destination: "Session State Manager"
    description: "Reads and writes session state data [AES-256]"
  - source: "ML Inference Engine"
    destination: "Audit Logger"
    description: "Streams execution logs and feedback [Secure GCP VPC]"