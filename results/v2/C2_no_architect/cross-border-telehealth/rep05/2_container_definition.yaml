level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients in the EU and US seeking secure video consultations and symptom checking over low-bandwidth connections."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals conducting consultations and issuing e-prescriptions."
  - type: "person"
    name: "Support Staff"
    description: "Personnel managing platform operations with JIT privileged access."
  - type: "person"
    name: "Compliance/Legal Officers"
    description: "Officers ensuring adherence to GDPR, HIPAA, and EU MDR regulations."
  - type: "person"
    name: "Pharmacy Partners"
    description: "Partners fulfilling e-prescriptions."
  - type: "person"
    name: "System Administrators/ML Engineers"
    description: "Administrators and engineers managing platform infrastructure and machine learning models."
  - type: "externalSystem"
    name: "Local Pharmacy Networks"
    description: "External pharmacy systems receiving e-prescriptions."
  - type: "externalSystem"
    name: "National Health Authorities"
    description: "External regulatory and health authority systems."
  - type: "container"
    name: "Multi-region Web/Mobile Clients"
    description: "Client applications providing access for users across multiple regions."
    technology: "Web / Mobile"
  - type: "container"
    name: "Edge Routing & WebRTC SFU Containers"
    description: "Containers handling edge routing and WebRTC selective forwarding for video consultations."
    technology: "WebRTC SFU / TLS 1.3"
  - type: "container"
    name: "API Gateway"
    description: "Gateway handling routing and security for regional microservices."
    technology: "Istio Service Mesh (mTLS)"
  - type: "container"
    name: "E-Prescription Routing Container"
    description: "Container routing e-prescriptions to national health authorities and pharmacy networks."
    technology: "GCP Pub/Sub / Cryptographic Digital Signatures"
  - type: "container"
    name: "AI Symptom Checker Container"
    description: "Container providing AI-driven symptom analysis."
    technology: "AI/ML Runtime"
  - type: "container"
    name: "Consent Management Service"
    description: "Service managing user consent and regulatory compliance."
    technology: "OAuth 2.0 / OIDC"
relationships:
  - source: "Patients"
    destination: "Multi-region Web/Mobile Clients"
    description: "Interacts with the platform for video consultations and symptom checking"
    technology: "HTTPS / WebRTC"
  - source: "Licensed Clinicians"
    destination: "Multi-region Web/Mobile Clients"
    description: "Conducts consultations and issues e-prescriptions"
    technology: "HTTPS"
  - source: "Support Staff"
    destination: "Multi-region Web/Mobile Clients"
    description: "Manages platform operations"
    technology: "HTTPS"
  - source: "Compliance/Legal Officers"
    destination: "Multi-region Web/Mobile Clients"
    description: "Reviews compliance and audit logs"
    technology: "HTTPS"
  - source: "Pharmacy Partners"
    destination: "Multi-region Web/Mobile Clients"
    description: "Accesses prescription information"
    technology: "HTTPS"
  - source: "System Administrators/ML Engineers"
    destination: "Multi-region Web/Mobile Clients"
    description: "Manages system infrastructure and ML models"
    technology: "HTTPS"
  - source: "Multi-region Web/Mobile Clients"
    destination: "Edge Routing & WebRTC SFU Containers"
    description: "Connects for video streaming and consultations"
    technology: "WebRTC / TLS 1.3"
  - source: "Edge Routing & WebRTC SFU Containers"
    destination: "API Gateway"
    description: "Forwards requests to backend microservices"
    technology: "mTLS (Service Mesh)"
  - source: "API Gateway"
    destination: "E-Prescription Routing Container"
    description: "Routes e-prescription data"
    technology: "mTLS"
  - source: "API Gateway"
    destination: "AI Symptom Checker Container"
    description: "Sends requests for symptom analysis"
    technology: "mTLS"
  - source: "API Gateway"
    destination: "Consent Management Service"
    description: "Validates user consent and authentication"
    technology: "OAuth 2.0 / OIDC"
  - source: "E-Prescription Routing Container"
    destination: "National Health Authorities"
    description: "Sends e-prescriptions securely via regional Pub/Sub queues"
    technology: "Regional Pub/Sub / Cryptographic Signatures"
  - source: "E-Prescription Routing Container"
    destination: "Local Pharmacy Networks"
    description: "Dispatches e-prescriptions to pharmacy networks"
    technology: "Regional Pub/Sub / Cryptographic Signatures"
  - source: "AI Symptom Checker Container"
    destination: "Multi-region Web/Mobile Clients"
    description: "Returns symptom check results"
    technology: "mTLS"