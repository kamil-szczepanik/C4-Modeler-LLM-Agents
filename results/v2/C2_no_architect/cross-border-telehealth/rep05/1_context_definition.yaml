level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides secure video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US while ensuring strict regional data residency and regulatory compliance."
elements:
  - type: "person"
    name: "Patients"
    description: "Patients in the EU and US seeking secure video consultations and symptom checking over low-bandwidth connections."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals conducting consultations and issuing e-prescriptions."
  - type: "person"
    name: "Support Staff"
    description: "Personnel managing platform operations with JIT privileged access."
  - type: "person"
    name: "Compliance/Legal Officers"
    description: "Officers ensuring adherence to GDPR, HIPAA, and EU MDR regulations."
  - type: "externalSystem"
    name: "Local Pharmacy Networks"
    description: "External pharmacy systems receiving e-prescriptions."
  - type: "externalSystem"
    name: "National Health Authorities"
    description: "External regulatory and health authority systems."
  - type: "container"
    name: "GCP Regional Deployments"
    description: "Isolated regional deployments in europe-west3 and us-central1 for strict data residency."
    technology: "GCP (europe-west3, us-central1)"
  - type: "container"
    name: "Zero-Trust API Gateways"
    description: "Gateways handling secure interoperability and mTLS APIs."
    technology: "Zero-Trust API Gateway"
  - type: "container"
    name: "WebRTC Signaling Servers"
    description: "Servers handling video consultations with dynamic codec adaptation."
    technology: "WebRTC (SRTP/DTLS)"
  - type: "container"
    name: "Edge CDN"
    description: "Edge content delivery network for low-bandwidth connectivity."
    technology: "CDN"
  - type: "component"
    name: "AI Symptom Checker Service"
    description: "Service providing symptom analysis with model version logging."
    technology: "gRPC"
  - type: "component"
    name: "Consent Management Service"
    description: "Service managing user consent and regulatory compliance."
    technology: "OAuth 2.0 / OIDC"
  - type: "component"
    name: "E-Prescription Router"
    description: "Router sending e-prescriptions via national standards and HL7 FHIR."
    technology: "mTLS APIs"
  - type: "component"
    name: "Immutable Audit Logger"
    description: "Logger providing cryptographic hashing and tamper-proof storage."
    technology: "GCP Cloud Logging"
relationships:
  - source: "Patients"
    destination: "Cross-Border Telehealth Platform"
    description: "Video consultations via WebRTC (SRTP/DTLS) with dynamic codec adaptation below 300 kbit/s"
    technology: "WebRTC"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "E-prescriptions sent via national standards (EU) and HL7 FHIR (US) over mTLS APIs"
    technology: "mTLS"
  - source: "Support Staff"
    destination: "Cross-Border Telehealth Platform"
    description: "Just-In-Time (JIT) privileged access governed by break-glass controls"
    technology: "OAuth 2.0 / OIDC"
  - source: "AI Symptom Checker Service"
    destination: "Immutable Audit Logger"
    description: "Inputs and model versions logged with cryptographic hashing via internal gRPC"
    technology: "gRPC"