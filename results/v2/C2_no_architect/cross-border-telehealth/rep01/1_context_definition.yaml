level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "A cross-border telehealth platform providing video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US, ensuring strict data residency, regulatory compliance, and low-bandwidth availability."
elements:
  - type: "person"
    name: "Patients (EU & US)"
    description: "End-users managing consent, video calls, and AI triage."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals conducting consultations and issuing e-prescriptions."
  - type: "person"
    name: "Compliance & QA Officers"
    description: "Regulators monitoring EU MDR and HIPAA compliance."
  - type: "externalSystem"
    name: "Pharmacies (EU & US)"
    description: "External systems receiving e-prescription fulfillments."
relationships:
  - source: "Patients (EU & US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Manages consent, conducts video calls, and uses AI triage"
    technology: "HTTPS / WebRTC"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Conducts consultations and issues e-prescriptions"
    technology: "HTTPS / WebRTC"
  - source: "Compliance & QA Officers"
    destination: "Cross-Border Telehealth Platform"
    description: "Monitors EU MDR and HIPAA compliance"
    technology: "HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Pharmacies (EU & US)"
    description: "Sends e-prescription fulfillments"
    technology: "mTLS / OAuth 2.0 / HL7 FHIR"