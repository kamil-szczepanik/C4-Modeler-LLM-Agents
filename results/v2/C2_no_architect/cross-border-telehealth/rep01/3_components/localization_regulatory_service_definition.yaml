level: component
scope: "Component diagram for the Localization & Regulatory Service container"
parentContainer:
  name: "Localization & Regulatory Service"
elements:
  - type: "component"
    name: "Regional Data Residency Enforcer"
    technology: "Google Cloud Platform (GCP), VPC Service Controls"
    description: "Enforces strict regional data isolation for EU and US patients to guarantee GDPR and HIPAA compliance."
  - type: "component"
    name: "Granular Consent Manager"
    technology: "Kubernetes, Istio"
    description: "Manages patient consent and authorization workflows within the zero-trust service mesh."
  - type: "component"
    name: "Audit Traceability Worker"
    technology: "Cloud Pub/Sub, Cloud Run"
    description: "Handles asynchronous processing and compliance exports for audit logging."
  - type: "component"
    name: "Crypto-Shredding Manager"
    technology: "Cloud KMS"
    description: "Performs envelope encryption and per-patient crypto-shredding."
relationships:
  - source: "Regional Data Residency Enforcer"
    destination: "Granular Consent Manager"
    description: "Validates consent against regional compliance rules [mTLS via Istio]"
  - source: "Granular Consent Manager"
    destination: "Crypto-Shredding Manager"
    description: "Manages encryption keys and patient data protection [Cloud KMS]"
  - source: "Audit Traceability Worker"
    destination: "Audit Traceability Worker"
    description: "Publishes and processes compliance export events [Cloud Pub/Sub & Cloud Run]"