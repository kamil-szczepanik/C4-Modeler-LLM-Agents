level: component
scope: "Component diagram for the AI Symptom Checker Container container"
parentContainer:
  name: "AI Symptom Checker Container"
elements:
  - type: "component"
    name: "Triage Controller"
    technology: "gRPC / HTTPS"
    description: "Invokes triage functions via HTTPS/TLS and gRPC with JWT authentication."
  - type: "component"
    name: "Session Manager"
    technology: "Redis"
    description: "Persists ephemeral session state via encrypted connections."
  - type: "component"
    name: "Audit Logger"
    technology: "gRPC"
    description: "Writes audit logs and inputs to Cloud Logging via gRPC."
relationships:
  - source: "Triage Controller"
    destination: "Session Manager"
    description: "Persists ephemeral session state via encrypted connections"
  - source: "Triage Controller"
    destination: "Audit Logger"
    description: "Sends audit logs and inputs"