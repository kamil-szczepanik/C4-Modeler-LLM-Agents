level: component
scope: "Component diagram for the Clinician Dashboard & Handoff Container container"
parentContainer:
  name: "Clinician Dashboard & Handoff Container"
elements:
  - type: "component"
    name: "Licensed Clinicians"
    technology: "Web Browser / Secure Client"
    description: "Primary users who manage patient consultations, review AI symptom checker outputs, and dispatch e-prescriptions."
  - type: "component"
    name: "Regional GKE Clusters"
    technology: "Google Kubernetes Engine (europe-west3, us-central1)"
    description: "Orchestrates regional container deployments ensuring cross-border regulatory compliance."
  - type: "component"
    name: "Patient Engagement & Notification Gateway Container"
    technology: "Container Service"
    description: "Handles patient communications and notifications."
  - type: "component"
    name: "Localization & Regulatory Service"
    technology: "Microservice"
    description: "Verifies regional consent and data access for GDPR and HIPAA compliance."
  - type: "component"
    name: "AI Symptom Checker Container"
    technology: "Container Service"
    description: "Provides AI urgency recommendations and clinical inputs."
  - type: "component"
    name: "External Pharmacies"
    technology: "External EU & US Pharmacy Systems"
    description: "Receives national e-prescriptions."
relationships:
  - source: "Clinician Dashboard & Handoff Container"
    destination: "Patient Engagement & Notification Gateway Container"
    description: "Dispatches e-prescriptions [HTTPS/TLS]"
  - source: "Clinician Dashboard & Handoff Container"
    destination: "AI Symptom Checker Container"
    description: "Retrieves AI urgency recommendations and inputs [gRPC/mTLS]"
  - source: "Clinician Dashboard & Handoff Container"
    destination: "Localization & Regulatory Service"
    description: "Verifies regional consent and data access [HTTPS/mTLS]"
  - source: "Clinician Dashboard & Handoff Container"
    destination: "External Pharmacies"
    description: "Submits national e-prescriptions [HTTPS/TLS]"