level: component
scope: "Component diagram for the Regional GKE Clusters container"
parentContainer:
  name: "Regional GKE Clusters"
elements:
  - type: "component"
    name: "Istio Service Mesh & Envoy Gateways"
    technology: "Istio, Envoy"
    description: "Enforces mandatory mTLS, authorization policies for all intra-cluster traffic, and optimizes ingress for unstable rural connections."
  - type: "component"
    name: "Localization & Regulatory Service"
    technology: "Microservice, SQL/TLS, CMEK"
    description: "Manages consent data and ensures adherence to regional data boundaries and regulatory compliance."
  - type: "component"
    name: "WebRTC Media Server Containers (SFUs)"
    technology: "WebRTC Containers"
    description: "Handles video consultations and real-time media streaming for patients and clinicians."
  - type: "component"
    name: "AI Symptom Checker Container"
    technology: "Containerized AI Service"
    description: "Provides automated symptom checking functionality and generates MDR traceability logs."
  - type: "component"
    name: "Fluent Bit & Google Cloud Logging"
    technology: "Fluent Bit, Google Cloud Logging"
    description: "Performs edge log-forwarding and PII stripping for regulatory compliance."
relationships:
  - source: "Istio Service Mesh & Envoy Gateways"
    destination: "WebRTC Media Server Containers (SFUs)"
    description: "Routes secure ingress and enforces mTLS"
  - source: "Istio Service Mesh & Envoy Gateways"
    destination: "AI Symptom Checker Container"
    description: "Routes traffic and enforces authorization policies"
  - source: "Istio Service Mesh & Envoy Gateways"
    destination: "Localization & Regulatory Service"
    description: "Routes requests and enforces security policies"
  - source: "WebRTC Media Server Containers (SFUs)"
    destination: "Fluent Bit & Google Cloud Logging"
    description: "Forwards logs for monitoring and PII stripping"
  - source: "AI Symptom Checker Container"
    destination: "Fluent Bit & Google Cloud Logging"
    description: "Forwards AI audit logs for traceability"