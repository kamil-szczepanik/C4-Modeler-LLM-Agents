level: component
scope: "Component diagram for the Patient Engagement & Notification Gateway Container container"
parentContainer:
  name: "Patient Engagement & Notification Gateway Container"
elements:
  - type: "component"
    name: "Notification & Dispatch Controller"
    technology: "Google Kubernetes Engine (GKE)"
    description: "Core service handling notifications, e-prescription dispatches, and consent enforcement across regional deployments."
  - type: "component"
    name: "Async Queue & Retry Manager"
    technology: "GCP Pub/Sub"
    description: "Manages asynchronous message dispatches, retries, and failed message isolation via Dead Letter Queues (DLQs) for unstable connections."
  - type: "component"
    name: "Security & Encryption Manager"
    technology: "GCP Cloud KMS & Secret Manager"
    description: "Provides regional customer-managed encryption keys and secure API credential storage to enforce GDPR and HIPAA data residency mandates."
relationships:
  - source: "Notification & Dispatch Controller"
    destination: "Async Queue & Retry Manager"
    description: "Publishes async delivery status feedback events and queues pending messages"
  - source: "Notification & Dispatch Controller"
    destination: "Security & Encryption Manager"
    description: "Retrieves cryptographic keys and API credentials for secure, consent-validated message delivery"