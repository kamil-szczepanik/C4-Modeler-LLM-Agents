level: component
scope: "Component diagram for the WebRTC Media Server Containers (SFUs) container"
parentContainer:
  name: "WebRTC Media Server Containers (SFUs)"
elements:
  - type: "component"
    name: "SFU Core Engine"
    technology: "Jitsi/Mediasoup SFU"
    description: "Handles video streams, simulcast, and dynamic bitrate scaling for unstable connections (<300 kbit/s)."
  - type: "component"
    name: "Security & Encryption Handler"
    technology: "DTLS-SRTP & JWT"
    description: "Secures media stream encryption and session authorization."
  - type: "component"
    name: "Telemetry Exporter"
    technology: "Prometheus & Grafana"
    description: "Provides real-time observability of WebRTC transport metrics."
  - type: "component"
    name: "Mesh Proxy"
    technology: "Istio Service Mesh"
    description: "Enforces regional mTLS for inter-pod communication."
relationships:
  - source: "SFU Core Engine"
    destination: "Security & Encryption Handler"
    description: "Secures media streams using"
  - source: "SFU Core Engine"
    destination: "Telemetry Exporter"
    description: "Reports transport metrics to"
  - source: "SFU Core Engine"
    destination: "Mesh Proxy"
    description: "Communicates with internal microservices via"