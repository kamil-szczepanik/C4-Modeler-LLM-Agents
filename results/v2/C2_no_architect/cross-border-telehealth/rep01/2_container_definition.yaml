level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU & US)"
    description: "End-users managing consent, video calls, and AI triage."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Medical professionals conducting consultations and issuing e-prescriptions."
  - type: "person"
    name: "Compliance & QA Officers"
    description: "Regulators monitoring EU MDR and HIPAA compliance."
  - type: "externalSystem"
    name: "External Pharmacies (EU & US)"
    description: "External systems receiving e-prescription fulfillments."
  - type: "container"
    name: "Regional GKE Clusters"
    technology: "Google Cloud Platform (europe-west3, us-central1), Kubernetes, Istio"
    description: "Regional cloud infrastructure enforcing strict data residency and container orchestration with mTLS."
  - type: "container"
    name: "Localization & Regulatory Service"
    technology: "Container, SQL/TLS, GCP VPC Service Controls, Cloud KMS"
    description: "Manages regional data residency, consent management, and regulatory compliance (GDPR/HIPAA)."
  - type: "container"
    name: "WebRTC Media Server Containers (SFUs)"
    technology: "Jitsi/Mediasoup SFU, WebRTC"
    description: "Provides low-bandwidth WebRTC video streaming for video consultations."
  - type: "container"
    name: "AI Symptom Checker Container"
    technology: "Container, gRPC"
    description: "Provides AI symptom checking and sends audit logs to Cloud Logging."
  - type: "container"
    name: "Clinician Dashboard & Handoff Container"
    technology: "Container, HTTPS/TLS"
    description: "Provides clinician interface and handles e-prescription dispatch via the notification gateway."
  - type: "container"
    name: "Patient Engagement & Notification Gateway Container"
    technology: "Container, HTTPS/TLS"
    description: "Handles patient notifications and e-prescription dispatches."
relationships:
  - source: "Patients (EU & US)"
    destination: "WebRTC Media Server Containers (SFUs)"
    description: "Participates in video consultations"
    technology: "WebRTC/mTLS"
  - source: "AI Symptom Checker Container"
    destination: "Regional GKE Clusters"
    description: "Sends audit logs"
    technology: "gRPC"
  - source: "Localization & Regulatory Service"
    destination: "Regional GKE Clusters"
    description: "Manages consent data in regional databases"
    technology: "SQL/TLS"
  - source: "Clinician Dashboard & Handoff Container"
    destination: "Patient Engagement & Notification Gateway Container"
    description: "Dispatches e-prescriptions"
    technology: "HTTPS/TLS"