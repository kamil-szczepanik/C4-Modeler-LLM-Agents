level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Envoy Edge Router"
    technology: "Envoy Proxy / Istio"
    description: "Enforces regional data residency, rate-limiting, circuit breaking, and mTLS enforcement at the network edge."
  - type: "component"
    name: "Routing and mTLS Enforcer"
    technology: "Istio Service Mesh with SPIFFE IDs"
    description: "Routes filtered incoming traffic to microservices using Istio mTLS."
relationships:
  - source: "Envoy Edge Router"
    destination: "Routing and mTLS Enforcer"
    description: "Passes filtered traffic for secure microservices routing"