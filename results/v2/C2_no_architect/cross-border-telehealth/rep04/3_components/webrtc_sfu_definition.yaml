level: component
scope: "Component diagram for the WebRTC SFU container"
parentContainer:
  name: "WebRTC SFU"
elements:
  - type: "component"
    name: "Mediasoup SFU Core"
    technology: "Node.js / C++ Mediasoup library"
    description: "Handles selective forwarding unit (SFU) media routing, streaming, and real-time media mixing for video consultations."
  - type: "component"
    name: "coturn NAT Traversal"
    technology: "coturn STUN/TURN server"
    description: "Provides NAT traversal and relay services for WebRTC media streams, supporting unstable rural connections."
  - type: "component"
    name: "JWT Auth Validator"
    technology: "Node.js / WebRTC Signaling Handler"
    description: "Validates short-lived JSON Web Tokens (JWTs) issued by the API Gateway to authorize session access."
  - type: "component"
    name: "Prometheus Telemetry Sidecar"
    technology: "Prometheus Sidecar exporter"
    description: "Exports real-time WebRTC metrics and telemetry data to Grafana dashboards."
relationships:
  - source: "JWT Auth Validator"
    destination: "Mediasoup SFU Core"
    description: "Authorizes session access"
  - source: "Mediasoup SFU Core"
    destination: "coturn NAT Traversal"
    description: "Relays media streams via"
  - source: "Prometheus Telemetry Sidecar"
    destination: "Mediasoup SFU Core"
    description: "Monitors and scrapes metrics from"