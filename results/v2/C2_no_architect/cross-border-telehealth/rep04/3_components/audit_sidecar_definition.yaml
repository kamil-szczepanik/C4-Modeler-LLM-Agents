level: component
scope: "Component diagram for the Audit Sidecar container"
parentContainer:
  name: "Audit Sidecar"
elements:
  - type: "component"
    name: "Audit Log Collector"
    technology: "Python / Go"
    description: "Receives clinical inputs and operational logs from the AI Symptom Checker container over secured localhost."
  - type: "component"
    name: "Cryptographic Chaining Engine"
    technology: "Python Cryptography Library"
    description: "Applies cryptographic hashing to chain audit logs together sequentially for tamper-proof traceability."
  - type: "component"
    name: "Storage Writer"
    technology: "Google Cloud Storage Client Library"
    description: "Writes encrypted, hash-chained audit logs to regional WORM Cloud Storage via HTTPS using Cloud KMS for envelope encryption."
relationships:
  - source: "Audit Log Collector"
    destination: "Cryptographic Chaining Engine"
    description: "Passes collected logs for cryptographic hashing and sequencing."
  - source: "Cryptographic Chaining Engine"
    destination: "Storage Writer"
    description: "Transfers hash-chained audit logs for secure persistence."