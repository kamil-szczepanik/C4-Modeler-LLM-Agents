level: component
scope: "Component diagram for the AI Symptom Checker Container container"
parentContainer:
  name: "AI Symptom Checker Container"
elements:
  - type: "component"
    name: "Symptom Analysis Controller"
    technology: "Python, TensorFlow"
    description: "Orchestrates incoming AI symptom analysis requests and model inference."
  - type: "component"
    name: "Audit Logger"
    technology: "Python, gRPC"
    description: "Sends immutable audit logs to WORM Cloud Storage."
  - type: "component"
    name: "Async Submission Handler"
    technology: "Python, Google Cloud Pub/Sub"
    description: "Handles failed asynchronous store-and-forward submissions via Dead Letter Queue."
relationships:
  - source: "Symptom Analysis Controller"
    destination: "Audit Logger"
    description: "Sends immutable audit logs [gRPC/HTTPS]"
  - source: "Symptom Analysis Controller"
    destination: "Async Submission Handler"
    description: "Routes failed asynchronous submissions [Encrypted TLS 1.3]"