level: component
scope: "Component diagram for the Frontend Container container"
parentContainer:
  name: "Frontend Container"
elements:
  - type: "component"
    name: "Web UI Controller"
    technology: "Web / Distroless"
    description: "Serves the user interface for patients and clinicians, managing session state and UI interactions."
  - type: "component"
    name: "Session Management Service"
    technology: "Backend-for-Frontend (BFF)"
    description: "Manages user authentication sessions and coordinates secure requests to the API Gateway."
relationships:
  - source: "Web UI Controller"
    destination: "Session Management Service"
    description: "Delegates session requests and API calls"