level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU & US)"
    description: "Patients located in the EU and US seeking secure video consultations, e-prescriptions, and symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Healthcare professionals conducting secure video consultations and issuing e-prescriptions."
  - type: "person"
    name: "Compliance Officers"
    description: "Officers overseeing regulatory compliance under GDPR and HIPAA."
  - type: "person"
    name: "Local Pharmacy Partners"
    description: "Local pharmacy partners fulfilling regional prescriptions."
  - type: "externalSystem"
    name: "External Pharmacies (EU/US)"
    description: "External pharmacies receiving encrypted prescriptions via HL7 FHIR and national standards."
  - type: "container"
    name: "API Gateway"
    description: "Manages incoming traffic, API routing, and security enforcement."
    technology: "Istio Service Mesh / Envoy"
  - type: "container"
    name: "Frontend Container"
    description: "Delivers user interfaces for patients and clinicians."
    technology: "Web / Distroless Container"
  - type: "container"
    name: "WebRTC SFU"
    description: "Handles real-time video consultations and media streaming."
    technology: "Mediasoup / coturn"
  - type: "container"
    name: "AI Symptom Checker Container"
    description: "Provides AI-driven symptom analysis with audit sidecar."
    technology: "Python / TensorFlow / Distroless"
  - type: "container"
    name: "Audit Sidecar"
    description: "Captures immutable audit logs for AI recommendations and transactions."
    technology: "Sidecar Container"
  - type: "container"
    name: "Regional GKE Clusters"
    description: "Hosts regional workloads across europe-west3 and us-central1 ensuring data residency."
    technology: "Google Kubernetes Engine (GKE)"
  - type: "container"
    name: "Cloud WAF"
    description: "Protects web applications against threats and attacks."
    technology: "Google Cloud WAF"
  - type: "container"
    name: "WORM Cloud Storage"
    description: "Stores immutable audit logs securely."
    technology: "Google Cloud Storage (WORM)"
relationships:
  - source: "Patients (EU & US)"
    destination: "API Gateway"
    description: "Sends HTTPS requests and establishes WebRTC connections"
    technology: "HTTPS/TLS 1.3, WebRTC (UDP/TCP)"
  - source: "Licensed Clinicians"
    destination: "API Gateway"
    description: "Sends HTTPS requests and establishes WebRTC connections"
    technology: "HTTPS/TLS 1.3, WebRTC (UDP/TCP)"
  - source: "API Gateway"
    destination: "Regional GKE Clusters"
    description: "Routes traffic to regional microservices via service mesh"
    technology: "Istio Service Mesh (mTLS with SPIFFE IDs)"
  - source: "AI Symptom Checker Container"
    destination: "WORM Cloud Storage"
    description: "Sends immutable audit logs"
    technology: "gRPC/HTTPS"
  - source: "Regional GKE Clusters"
    destination: "External Pharmacies (EU/US)"
    description: "Transmits electronic prescriptions"
    technology: "HL7 FHIR (US) and national standards (EU)"