level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides secure video consultations, e-prescriptions, and an AI symptom checker for patients across the EU and the US with strict regional data residency and regulatory compliance under GDPR, HIPAA, and EU MDR."
elements:
  - type: "person"
    name: "Patients (EU & US)"
    description: "Patients located in the EU and US seeking secure video consultations, e-prescriptions, and symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Healthcare professionals conducting secure video consultations and issuing e-prescriptions."
  - type: "externalSystem"
    name: "External Pharmacies (EU/US)"
    description: "Pharmacies receiving encrypted FHIR and national e-prescription standards."
  - type: "person"
    name: "Compliance & Regulatory Officers"
    description: "Officers overseeing regulatory compliance under GDPR, HIPAA, and EU MDR."
  - type: "container"
    name: "Patient Consent Portal"
    description: "Portal for managing patient consent using Zero Trust MFA."
  - type: "container"
    name: "AI Symptom Checker Container"
    description: "Containerized AI symptom checker with cryptographically signed version logging."
  - type: "container"
    name: "Video Gateway Containers"
    description: "Containers handling real-time video communication optimized for low-bandwidth connections."
relationships:
  - source: "Patients (EU & US)"
    destination: "Video Gateway Containers"
    description: "Connects for secure video consultations via WebRTC"
    technology: "WebRTC (TLS 1.3, adaptive <300 kbit/s bandwidth degradation)"
  - source: "Patients (EU & US)"
    destination: "Patient Consent Portal"
    description: "Authenticates and manages consent via Zero Trust MFA"
    technology: "HTTPS/TLS 1.3 (BeyondCorp Enterprise)"
  - source: "Licensed Clinicians"
    destination: "Patient Consent Portal"
    description: "Authenticates and manages consent via Zero Trust MFA"
    technology: "HTTPS/TLS 1.3 (BeyondCorp Enterprise)"
  - source: "AI Symptom Checker Container"
    destination: "Cloud Storage"
    description: "Logs cryptographically signed version data"
    technology: "gRPC/TLS 1.3"
  - source: "Cross-Border Telehealth Platform"
    destination: "External Pharmacies (EU/US)"
    description: "Transmits prescriptions securely"
    technology: "mTLS and encrypted FHIR/national e-prescription standards"