level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU/US)"
    description: "End-users accessing care via a PWA container."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Healthcare providers using the Clinical Workspace container."
  - type: "person"
    name: "Platform Administrators / Compliance Officers"
    description: "Users managing audits, credentials, and compliance."
  - type: "externalSystem"
    name: "Vertex AI"
    description: "External system providing AI symptom-checker recommendations."
  - type: "externalSystem"
    name: "Local Pharmacies"
    description: "External regional systems receiving e-prescriptions."
  - type: "container"
    name: "Patient Portal Container (PWA)"
    technology: "PWA container with regional Redis for sync"
    description: "Edge interface supporting offline resilience and async workflows."
  - type: "container"
    name: "Clinical Workspace Container"
    technology: "Web interface with LiveKit WebRTC SFU"
    description: "Interface managing video consultations and e-prescription routing."
  - type: "container"
    name: "Consent & Compliance Container"
    technology: "Microservice with Istio service mesh and WORM BigQuery"
    description: "Microservice enforcing granular consent and immutable AI audit logging."
relationships:
  - source: "Patients (EU/US)"
    destination: "Patient Portal Container (PWA)"
    description: "Accesses telehealth platform and symptom checker"
    technology: "HTTPS, WebRTC, OAuth2/OIDC via Identity-Aware Proxy (IAP)"
  - source: "Licensed Clinicians"
    destination: "Clinical Workspace Container"
    description: "Manages video consultations and e-prescriptions"
    technology: "HTTPS, WebRTC, OAuth2/OIDC via Identity-Aware Proxy (IAP)"
  - source: "Platform Administrators / Compliance Officers"
    destination: "Consent & Compliance Container"
    description: "Manages audits, credentials, and compliance"
    technology: "HTTPS, OAuth2 token validation at API Gateway"
  - source: "Patient Portal Container (PWA)"
    destination: "Consent & Compliance Container"
    description: "Validates consent and logs activities"
    technology: "mTLS inside GKE via Istio and OAuth2"
  - source: "Clinical Workspace Container"
    destination: "Consent & Compliance Container"
    description: "Enforces granular consent and immutable audit logging"
    technology: "mTLS inside GKE via Istio and OAuth2"
  - source: "Clinical Workspace Container"
    destination: "Vertex AI"
    description: "Requests AI symptom-checker inferences"
    technology: "gRPC/REST over mTLS"
  - source: "Clinical Workspace Container"
    destination: "Local Pharmacies"
    description: "Routes e-prescriptions"
    technology: "REST APIs using HL7 FHIR (US) and national e-prescription standards (EU)"