level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US while strictly enforcing regional data residency and healthcare regulations."
elements:
  - type: "person"
    name: "Patients (EU and US)"
    description: "Patients seeking video consultations, e-prescriptions, and AI symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Clinicians conducting video consultations and issuing e-prescriptions."
  - type: "externalSystem"
    name: "Local Pharmacies"
    description: "Pharmacies receiving e-prescriptions via national standards (EU) and HL7 FHIR (US)."
  - type: "externalSystem"
    name: "Vertex AI"
    description: "AI service used by the AI Symptom Checker."
relationships:
  - source: "Patients (EU and US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker"
    technology: "TLS 1.3 / mTLS"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Conducts video consultations and manages e-prescriptions"
    technology: "TLS 1.3 / mTLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "Local Pharmacies"
    description: "Sends e-prescriptions"
    technology: "Secure REST APIs (EU standards / HL7 FHIR US)"
  - source: "Cross-Border Telehealth Platform"
    destination: "Vertex AI"
    description: "Performs AI inference via LLM Security Gateway"
    technology: "Secure API"