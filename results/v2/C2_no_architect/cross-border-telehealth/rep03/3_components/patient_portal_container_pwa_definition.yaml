level: component
scope: "Component diagram for the Patient Portal Container (PWA) container"
parentContainer:
  name: "Patient Portal Container (PWA)"
elements:
  - type: "component"
    name: "Offline Storage Manager"
    technology: "IndexedDB with Web Crypto API"
    description: "Secures cached local health data and consent states using PIN or biometric-derived keys."
  - type: "component"
    name: "Telehealth Interface"
    technology: "Progressive Web App (PWA) / HTTPS"
    description: "Provides video consultations and user access for patients across the EU and US."
  - type: "component"
    name: "AI Symptom Checker Client"
    technology: "HTTPS / OAuth2/OIDC"
    description: "Sends symptom checker inputs to external AI services with logged model versions."
relationships:
  - source: "Telehealth Interface"
    destination: "Offline Storage Manager"
    description: "Reads and writes encrypted local health data and consent states"
  - source: "Telehealth Interface"
    destination: "AI Symptom Checker Client"
    description: "Submits patient symptom inputs for processing"