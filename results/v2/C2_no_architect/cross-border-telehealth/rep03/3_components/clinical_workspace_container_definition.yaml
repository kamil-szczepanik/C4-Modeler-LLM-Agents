level: component
scope: "Component diagram for the Clinical Workspace Container container"
parentContainer:
  name: "Clinical Workspace Container"
elements:
  - type: "component"
    name: "Web Interface & Video Module"
    technology: "GKE container web interface and LiveKit WebRTC SFU with UDP-optimized ingress"
    description: "Manages secure video consultations and real-time communication for clinicians."
  - type: "component"
    name: "E-Prescription Controller"
    technology: "GKE container microservice"
    description: "Handles the creation and routing of e-prescriptions."
  - type: "component"
    name: "AI Symptom Checker Client"
    technology: "gRPC/REST over mTLS client"
    description: "Requests AI symptom-checker inferences from Vertex AI."
relationships:
  - source: "Web Interface & Video Module"
    destination: "E-Prescription Controller"
    description: "Invokes e-prescription workflows"
  - source: "E-Prescription Controller"
    destination: "Consent & Compliance Container"
    description: "Enforces granular consent and immutable audit logging via mTLS inside GKE via Istio and OAuth2"
  - source: "AI Symptom Checker Client"
    destination: "Vertex AI"
    description: "Requests AI symptom-checker inferences via gRPC/REST over mTLS"
  - source: "E-Prescription Controller"
    destination: "Google Cloud Pub/Sub"
    description: "Publishes async e-prescription events with regional message encryption"
  - source: "E-Prescription Controller"
    destination: "Local Pharmacies"
    description: "Routes e-prescriptions using REST APIs with HL7 FHIR (US) and national e-prescription standards (EU)"