level: component
scope: "Component diagram for the Consent & Compliance Container container"
parentContainer:
  name: "Consent & Compliance Container"
elements:
  - type: "component"
    name: "Istio Service Mesh"
    technology: "Istio"
    description: "Enforces mTLS and manages secure communication boundaries."
  - type: "component"
    name: "OPA Sidecars"
    technology: "Open Policy Agent (OPA)"
    description: "Enforces fine-grained access control and policy validation."
  - type: "component"
    name: "Audit Logger"
    technology: "Container Service"
    description: "Captures and formats compliance and audit logs for storage."
relationships:
  - source: "Istio Service Mesh"
    destination: "OPA Sidecars"
    description: "Routes requests for policy validation via mTLS"
  - source: "OPA Sidecars"
    destination: "Audit Logger"
    description: "Triggers immutable logging for authorized actions"