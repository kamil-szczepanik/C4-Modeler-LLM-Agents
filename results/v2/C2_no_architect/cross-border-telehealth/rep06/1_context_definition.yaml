level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "A cross-border telehealth platform providing video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US."
elements:
  - type: "person"
    name: "Patients"
    description: "Patients in the EU and US using the platform for video consultations, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed medical professionals providing video consultations and managing prescriptions."
  - type: "person"
    name: "Platform Administrators"
    description: "Administrators managing the platform operations and configurations."
  - type: "person"
    name: "Compliance Auditors"
    description: "Auditors reviewing system compliance and WORM audit logs."
  - type: "externalSystem"
    name: "External Pharmacies"
    description: "External pharmacies receiving e-prescriptions via regional message queues."
  - type: "externalSystem"
    name: "National Health Authorities"
    description: "National health authorities interacting with the platform via REST APIs."
  - type: "externalSystem"
    name: "WORM Audit Logs"
    description: "Write Once Read Many storage for immutable audit logs accessed by auditors."
relationships:
  - source: "Patients"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker via Web/Mobile apps"
    technology: "HTTPS, TLS 1.3"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Manages consultations and prescriptions via Web UI"
    technology: "mTLS, OAuth2/OIDC, MFA"
  - source: "Platform Administrators"
    destination: "Cross-Border Telehealth Platform"
    description: "Manages platform infrastructure and operations"
    technology: "OAuth2/OIDC, ABAC"
  - source: "Compliance Auditors"
    destination: "WORM Audit Logs"
    description: "Reads immutable audit logs via read-only encrypted tunnels with explicit consent verification"
    technology: "Encrypted Tunnels, Explicit Consent verification"
  - source: "Cross-Border Telehealth Platform"
    destination: "External Pharmacies"
    description: "Delivers asynchronous e-prescriptions via regional message queues"
    technology: "GCP Pub/Sub, mTLS, payload signatures"
  - source: "Cross-Border Telehealth Platform"
    destination: "National Health Authorities"
    description: "Interoperates with health authorities for regulatory standards"
    technology: "REST APIs, Circuit Breaker, mTLS, HL7 FHIR / EU national standards"