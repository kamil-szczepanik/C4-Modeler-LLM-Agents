level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients"
    description: "Patients in the EU and US using the platform for video consultations, e-prescriptions, and the AI symptom checker."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Licensed medical professionals providing video consultations and managing prescriptions."
  - type: "person"
    name: "Platform Administrators"
    description: "Administrators managing the platform operations and configurations."
  - type: "person"
    name: "Compliance Auditors"
    description: "Auditors reviewing system compliance and WORM audit logs."
  - type: "externalSystem"
    name: "External Pharmacies"
    description: "External pharmacies receiving e-prescriptions via national standards and HL7 FHIR."
  - type: "externalSystem"
    name: "National Health Authorities"
    description: "National health authorities interacting with the platform via REST APIs."
  - type: "externalSystem"
    name: "WORM Audit Logs"
    description: "Write Once Read Many storage for immutable audit logs."
  - type: "container"
    name: "Regional GKE Clusters"
    technology: "Google Kubernetes Engine (GKE), Binary Authorization,europe-west3, us-central1"
    description: "Regional container orchestration ensuring data residency and isolation."
  - type: "container"
    name: "API Gateway Container"
    technology: "Istio Service Mesh, Consent Management, ABAC, OAuth2/OIDC JWT"
    description: "Routes traffic and enforces consent, zero-trust networking, and authentication."
  - type: "container"
    name: "WebRTC SFU Media Servers"
    technology: "WebRTC"
    description: "Handles real-time video consultations for patients and clinicians."
  - type: "container"
    name: "AI Symptom Checker Container"
    technology: "Signed execution manifests, OpenTelemetry"
    description: "Provides AI symptom checking with traceable logs and signed execution."
  - type: "container"
    name: "GCP Cloud Armor and Cloud CDN"
    technology: "GCP Cloud Armor, Cloud CDN"
    description: "Provides edge security, WAF inspection, and asset caching."
  - type: "container"
    name: "Google Cloud Logging and Monitoring"
    technology: "Google Cloud Logging, Monitoring, OpenTelemetry"
    description: "Centralized regional telemetry and region-bound log sinks."
relationships:
  - source: "Patients"
    destination: "GCP Cloud Armor and Cloud CDN"
    description: "Accesses video consultations, e-prescriptions, and AI symptom checker via edge security"
    technology: "HTTPS (TLS 1.3), WebRTC"
  - source: "Licensed Clinicians"
    destination: "GCP Cloud Armor and Cloud CDN"
    description: "Interacts with the platform for consultations and prescriptions"
    technology: "HTTPS (TLS 1.3), WebRTC"
  - source: "Platform Administrators"
    destination: "API Gateway Container"
    description: "Manages platform configuration and operations"
    technology: "OAuth2/OIDC, ABAC"
  - source: "Compliance Auditors"
    destination: "WORM Audit Logs"
    description: "Reviews immutable audit logs"
    technology: "Encrypted Tunnels"
  - source: "GCP Cloud Armor and Cloud CDN"
    destination: "API Gateway Container"
    description: "Routes inspected and cached traffic to the API Gateway"
    technology: "HTTPS, Istio mTLS"
  - source: "API Gateway Container"
    destination: "WebRTC SFU Media Servers"
    description: "Connects authenticated users for video consultations"
    technology: "WebRTC, Istio mTLS"
  - source: "API Gateway Container"
    destination: "AI Symptom Checker Container"
    description: "Routes symptom checking requests"
    technology: "Istio mTLS"
  - source: "AI Symptom Checker Container"
    destination: "Google Cloud Logging and Monitoring"
    description: "Logs inputs and model versions using OpenTelemetry"
    technology: "OpenTelemetry, Region-bound log sinks"
  - source: "Regional GKE Clusters"
    destination: "External Pharmacies"
    description: "Sends e-prescriptions via national standards and HL7 FHIR"
    technology: "EU e-prescription standards, HL7 FHIR"
  - source: "Regional GKE Clusters"
    destination: "National Health Authorities"
    description: "Interoperates with health authorities"
    technology: "REST APIs, mTLS"