level: component
scope: "Component diagram for the API Gateway Container container"
parentContainer:
  name: "API Gateway Container"
elements:
  - type: "component"
    name: "Istio Service Mesh Enforcer"
    technology: "Istio Service Mesh"
    description: "Enforces mTLS, regional data residency, traffic routing, circuit breaking, and liveness probes at the perimeter."
  - type: "component"
    name: "Consent Management and ABAC Module"
    technology: "Attribute-Based Access Control (ABAC)"
    description: "Manages user consent scopes and regional data residency constraints."
  - type: "component"
    name: "OAuth2/OIDC JWT Authenticator"
    technology: "OAuth2/OIDC with DPoP/MTLS"
    description: "Secures user authentication and token binding."
  - type: "component"
    name: "Token Blacklist Validator"
    technology: "Localized Redis Token Blacklist Cache"
    description: "Validates token blacklists and consent states with sub-second latency."
relationships:
  - source: "Istio Service Mesh Enforcer"
    destination: "Consent Management and ABAC Module"
    description: "Evaluates attributes and consent policies for incoming requests"
  - source: "Istio Service Mesh Enforcer"
    destination: "OAuth2/OIDC JWT Authenticator"
    description: "Validates JSON Web Tokens and secures authentication"
  - source: "OAuth2/OIDC JWT Authenticator"
    destination: "Token Blacklist Validator"
    description: "Checks token revocation status against the localized cache"