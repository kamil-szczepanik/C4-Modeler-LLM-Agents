level: component
scope: "Component diagram for the AI Symptom Checker Container container"
parentContainer:
  name: "AI Symptom Checker Container"
elements:
  - type: "component"
    name: "Symptom Assessment API Handler"
    technology: "Python, FastAPI"
    description: "Receives incoming symptom checking requests via Istio mTLS and validates input payloads."
  - type: "component"
    name: "AI Inference Engine"
    technology: "TensorRT, PyTorch, Regional GKE"
    description: "Executes region-locked, immutable AI model weights to generate diagnoses and confidence scores."
  - type: "component"
    name: "Audit and Telemetry Emitter"
    technology: "OpenTelemetry, Region-bound log sinks"
    description: "Captures and exports structured audit logs including inputs, model versions, and confidence scores for EU MDR compliance."
relationships:
  - source: "Symptom Assessment API Handler"
    destination: "AI Inference Engine"
    description: "Passes validated clinical inputs to the inference pipeline"
  - source: "AI Inference Engine"
    destination: "Audit and Telemetry Emitter"
    description: "Sends model version, inference outputs, and confidence scores for compliance logging"