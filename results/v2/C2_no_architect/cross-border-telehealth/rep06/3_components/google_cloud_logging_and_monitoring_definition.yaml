level: component
scope: "Component diagram for the Google Cloud Logging and Monitoring container"
parentContainer:
  name: "Google Cloud Logging and Monitoring"
elements:
  - type: "component"
    name: "Log Sink and Audit Trail Manager"
    technology: "Google Cloud Logging, CMEK, WORM storage"
    description: "Enforces region-bound log sinks, CMEK encryption, and WORM immutability for regional audit trails."
  - type: "component"
    name: "Cloud DLP Sanitizer"
    technology: "Cloud DLP API, Pub/Sub"
    description: "Asynchronously scans and sanitizes log streams to prevent PHI/PII leakage from operational metrics."
  - type: "component"
    name: "Telemetry Collector"
    technology: "OpenTelemetry, Google Cloud Monitoring"
    description: "Receives immutable structured logs and OpenTelemetry traces from microservices and AI components."
relationships:
  - source: "Regional GKE Clusters"
    destination: "Cloud DLP Sanitizer"
    description: "Exports sanitized operational metrics and region-bound audit trails [Cloud DLP, Pub/Sub, mTLS]"
  - source: "AI Symptom Checker Container"
    destination: "Telemetry Collector"
    description: "Sends immutable structured logs and OpenTelemetry traces [mTLS, OpenTelemetry]"