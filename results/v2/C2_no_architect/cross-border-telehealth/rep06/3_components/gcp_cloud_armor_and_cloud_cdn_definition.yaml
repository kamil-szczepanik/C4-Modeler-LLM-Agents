level: component
scope: "Component diagram for the GCP Cloud Armor and Cloud CDN container"
parentContainer:
  name: "GCP Cloud Armor and Cloud CDN"
elements:
  - type: "component"
    name: "Cloud Armor Edge WAF"
    technology: "GCP Cloud Armor"
    description: "Provides edge WAF inspection, OWASP Top 10 rules, adaptive DDoS protection, and rate-limiting."
  - type: "component"
    name: "Cloud CDN Cache"
    technology: "Google Cloud CDN"
    description: "Caches static frontend assets and WebRTC client shell to support low-bandwidth users, strictly excluding PHI."
relationships:
  - source: "Cloud Armor Edge WAF"
    destination: "API Gateway Container"
    description: "Routes inspected traffic via [HTTPS, Istio mTLS]"
  - source: "Cloud Armor Edge WAF"
    destination: "Google Cloud Logging and Monitoring"
    description: "Streams security telemetry, WAF logs, and cache metrics via [OpenTelemetry, Google Cloud Logging API]"