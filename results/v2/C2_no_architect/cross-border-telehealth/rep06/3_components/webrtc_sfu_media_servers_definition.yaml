level: component
scope: "Component diagram for the WebRTC SFU Media Servers container"
parentContainer:
  name: "WebRTC SFU Media Servers"
elements:
  - type: "component"
    name: "SFU Media Controller"
    technology: "WebRTC SFU Container"
    description: "Manages real-time video consultations, adaptive bitrate streaming, and audio-first fallback for unstable connections."
  - type: "component"
    name: "TURN/STUN Credential Handler"
    technology: "JWT Authentication Module"
    description: "Validates short-lived TURN/STUN credentials issued by the API Gateway."
  - type: "component"
    name: "Telemetry Exporter"
    technology: "OpenTelemetry & WebRTC RTCStats"
    description: "Streams real-time telemetry and metrics to Google Cloud Monitoring while stripping PII."
relationships:
  - source: "SFU Media Controller"
    destination: "TURN/STUN Credential Handler"
    description: "Verifies session access [JWT]"
  - source: "SFU Media Controller"
    destination: "Telemetry Exporter"
    description: "Streams real-time telemetry [OpenTelemetry, WebRTC RTCStats]"