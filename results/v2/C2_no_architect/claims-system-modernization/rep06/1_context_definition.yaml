level: context
scope: "System Context diagram for Hybrid Insurance Claims Modernization Platform"
system:
  name: "Hybrid Insurance Claims Modernization Platform"
  description: "A hybrid insurance claims modernization platform that gradually migrates claim types from a legacy COBOL/DB2 mainframe to a modern Azure cloud environment, maintaining continuous claims processing while delivering a fast, secure web application."
elements:
  - type: "person"
    name: "Policyholders"
    description: "Customers who submit online claims and interact with the platform."
  - type: "person"
    name: "Insurance Brokers"
    description: "Brokers who assist with claims and interact with the platform."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff who process claims and access the web application."
  - type: "person"
    name: "Operations Managers"
    description: "Internal managers who oversee operations and access the web application."
  - type: "externalSystem"
    name: "COBOL/DB2 Mainframe"
    description: "System of Record running on-premise for legacy insurance data and batch processing."
  - type: "externalSystem"
    name: "On-Premise Active Directory / Entra ID"
    description: "Directory service used for authentication and identity management."
  - type: "container"
    name: "Azure API Gateway / WAF"
    description: "Secures and routes incoming HTTPS/TLS 1.3 traffic from users."
    technology: "Azure API Gateway, WAF"
  - type: "container"
    name: "Azure App Service"
    description: "Hosts the web application for claims processing using Managed PaaS."
    technology: "Azure App Service"
  - type: "container"
    name: "Managed Redis Cache"
    description: "Provides fast data caching to support performance requirements."
    technology: "Managed Redis Cache"
  - type: "container"
    name: "Azure SQL Database"
    description: "Stores relational operational data in the cloud."
    technology: "Azure SQL Database"
  - type: "component"
    name: "Azure Application Insights"
    description: "Provides distributed tracing and hybrid error tracking."
    technology: "Azure Application Insights, OpenTelemetry"
  - type: "component"
    name: "Azure Key Vault"
    description: "Manages secrets, keys, and certificates securely."
    technology: "Azure Key Vault"
relationships:
  - source: "Policyholders"
    destination: "Azure API Gateway / WAF"
    description: "Online claim submission and web application interaction"
    technology: "HTTPS / TLS 1.3"
  - source: "Insurance Brokers"
    destination: "Azure API Gateway / WAF"
    description: "Online claim submission and web application interaction"
    technology: "HTTPS / TLS 1.3"
  - source: "Claims Adjusters"
    destination: "Azure App Service"
    description: "Authenticates via OpenID Connect/OAuth 2.0 and accesses the web application"
    technology: "HTTPS, OpenID Connect / OAuth 2.0"
  - source: "Operations Managers"
    destination: "Azure App Service"
    description: "Authenticates via OpenID Connect/OAuth 2.0 and accesses the web application"
    technology: "HTTPS, OpenID Connect / OAuth 2.0"
  - source: "Azure App Service"
    destination: "Managed Redis Cache"
    description: "Data retrieval and caching for fast UI performance"
    technology: "TCP"
  - source: "Azure App Service"
    destination: "Azure SQL Database"
    description: "Relational data persistence and retrieval"
    technology: "T-SQL / HTTPS"
  - source: "Azure App Service"
    destination: "COBOL/DB2 Mainframe"
    description: "Hybrid claim synchronization and batch processing during the 23:00-05:00 window"
    technology: "mTLS, TLS 1.3"
  - source: "Azure App Service"
    destination: "Azure Key Vault"
    description: "Retrieves secrets and keys securely"
    technology: "HTTPS"
  - source: "Azure App Service"
    destination: "Azure Application Insights"
    description: "Sends telemetry, metrics, and error logs"
    technology: "HTTPS / OpenTelemetry"