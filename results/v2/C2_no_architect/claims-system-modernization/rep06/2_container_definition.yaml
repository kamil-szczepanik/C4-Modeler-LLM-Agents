level: container
scope: "Container diagram for Hybrid Insurance Claims Modernization Platform"
system:
  name: "Hybrid Insurance Claims Modernization Platform"
elements:
  - type: "person"
    name: "Policyholders"
    description: "External users submitting online claims."
  - type: "person"
    name: "Insurance Brokers"
    description: "External users submitting claims on behalf of policyholders."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users handling claims via the web application."
  - type: "person"
    name: "Operations Managers"
    description: "Users monitoring claim migration and rollbacks."
  - type: "externalSystem"
    name: "COBOL/DB2 Mainframe"
    description: "On-premise legacy system of record for hybrid fallback processing."
  - type: "container"
    name: "Azure API Gateway & WAF"
    description: "Provides Web Application Firewall and ingress routing for incoming requests."
    technology: "Azure Web Application Firewall, API Gateway"
  - type: "container"
    name: "Azure Container Apps / App Service"
    description: "Hosts the adjuster and portal containers."
    technology: "Azure Container Apps, App Service"
  - type: "container"
    name: "Azure SQL Database"
    description: "Modern platform database with automated snapshots."
    technology: "Azure SQL Database"
  - type: "container"
    name: "Azure Active Directory / Entra ID"
    description: "Handles Identity and Access Management."
    technology: "Azure AD, Entra ID, OAuth 2.0, OIDC"
  - type: "container"
    name: "Azure Application Insights"
    description: "Provides distributed tracing with PII masking."
    technology: "Azure Application Insights"
  - type: "container"
    name: "Azure Key Vault"
    description: "Manages secrets securely using Managed Identities."
    technology: "Azure Key Vault"
relationships:
  - source: "Policyholders"
    destination: "Azure API Gateway & WAF"
    description: "Online claim submission"
    technology: "HTTPS (TLS 1.3)"
  - source: "Insurance Brokers"
    destination: "Azure API Gateway & WAF"
    description: "Online claim submission"
    technology: "HTTPS (TLS 1.3)"
  - source: "Claims Adjusters"
    destination: "Azure Container Apps / App Service"
    description: "Claim management and interaction"
    technology: "HTTPS, OAuth 2.0, OIDC"
  - source: "Operations Managers"
    destination: "Azure Container Apps / App Service"
    description: "Monitoring claim migration and rollbacks"
    technology: "HTTPS, OAuth 2.0, OIDC"
  - source: "Azure API Gateway & WAF"
    destination: "Azure SQL Database"
    description: "Data persistence"
    technology: "TLS"
  - source: "Azure Container Apps / App Service"
    destination: "COBOL/DB2 Mainframe"
    description: "Legacy claim fallback processing"
    technology: "Hybrid VPN, mTLS"
  - source: "Azure Application Insights"
    destination: "Azure Container Apps / App Service"
    description: "Distributed tracing telemetry"
    technology: "HTTPS"
  - source: "Azure Key Vault"
    destination: "Azure Container Apps / App Service"
    description: "Secret management"
    technology: "Managed Identities"