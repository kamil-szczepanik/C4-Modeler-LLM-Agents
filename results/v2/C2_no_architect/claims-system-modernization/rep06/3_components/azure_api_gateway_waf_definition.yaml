level: component
scope: "Component diagram for the Azure API Gateway & WAF container"
parentContainer:
  name: "Azure API Gateway & WAF"
elements:
  - type: "component"
    name: "Web Application Firewall"
    technology: "Azure WAF"
    description: "Inspects incoming HTTPS traffic, enforces rate-limiting, and prevents OWASP Top 10 attacks for hybrid entries."
  - type: "component"
    name: "API Routing Engine"
    technology: "Azure API Gateway"
    description: "Handles edge routing, reverse proxy capabilities, and forwards requests to backend microservices via mTLS."
  - type: "component"
    name: "Token Validation Validator"
    technology: "OAuth 2.0 / OIDC Middleware"
    description: "Validates single sign-on tokens against Entra ID for authenticated policyholders, brokers, and adjusters."
relationships:
  - source: "Web Application Firewall"
    destination: "API Routing Engine"
    description: "Forwards inspected and filtered traffic [HTTPS]"
  - source: "API Routing Engine"
    destination: "Token Validation Validator"
    description: "Delegates token validation [OAuth 2.0, OIDC]"