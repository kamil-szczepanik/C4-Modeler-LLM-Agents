level: component
scope: "Component diagram for the Azure Key Vault container"
parentContainer:
  name: "Azure Key Vault"
elements:
  - type: "component"
    name: "Secrets Management Engine"
    technology: "Azure Key Vault (Standard/Premium SKU)"
    description: "Centralized secret, certificate, and key management with soft-delete and purge protection enabled."
  - type: "component"
    name: "Access Control & Authentication Manager"
    technology: "Managed Identities, Azure RBAC, & PIM"
    description: "Enforces least-privilege access (*Key Vault Secrets User*) and passwordless authentication eliminating hardcoded credentials."
  - type: "component"
    name: "Network Isolation & Private Link Service"
    technology: "Azure Private Endpoints & Virtual Network"
    description: "Secures hybrid integration points by disabling public access to the Key Vault via network isolation."
  - type: "component"
    name: "Telemetry & Security Monitoring"
    technology: "Application Insights & Azure Defender for Key Vault"
    description: "Emits diagnostic logs, metric alerts, security telemetry, and monitors access patterns for anomaly detection."
relationships:
  - source: "Secrets Management Engine"
    destination: "Access Control & Authentication Manager"
    description: "Authenticates requests using Managed Identities and Azure RBAC rules"
  - source: "Secrets Management Engine"
    destination: "Network Isolation & Private Link Service"
    description: "Routes inbound and outbound traffic securely through Private Endpoints"
  - source: "Secrets Management Engine"
    destination: "Telemetry & Security Monitoring"
    description: "Emits diagnostic logs, metric alerts, and security telemetry to Application Insights and Defender"
  - source: "Access Control & Authentication Manager"
    destination: "Network Isolation & Private Link Service"
    description: "Applies least-privilege policies over private network connections"