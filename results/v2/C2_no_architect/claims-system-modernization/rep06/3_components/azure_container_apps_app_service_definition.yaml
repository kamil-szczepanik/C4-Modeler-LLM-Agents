level: component
scope: "Component diagram for the Azure Container Apps / App Service container"
parentContainer:
  name: "Azure Container Apps / App Service"
elements:
  - type: "component"
    name: "Claim Management Controller"
    technology: "ASP.NET Core API"
    description: "Handles online claim submission and adjuster interaction via HTTPS."
  - type: "component"
    name: "Migration & Rollback Router"
    technology: "Microservice Traffic Router"
    description: "Manages traffic splitting, gradual migration, and instant rollbacks."
  - type: "component"
    name: "Legacy Integration Adapter"
    technology: "gRPC / REST Client"
    description: "Interfaces with the COBOL/DB2 Mainframe via hybrid VPN and mTLS for fallback processing."
  - type: "component"
    name: "Autoscaling Coordinator"
    technology: "KEDA Scaler"
    description: "Maintains minimum replicas on Azure Container Apps to prevent cold starts."
relationships:
  - source: "Claim Management Controller"
    destination: "Migration & Rollback Router"
    description: "Forwards requests for processing [HTTPS]"
  - source: "Migration & Rollback Router"
    destination: "Legacy Integration Adapter"
    description: "Routes legacy claims and fallback requests [mTLS, Hybrid VPN]"