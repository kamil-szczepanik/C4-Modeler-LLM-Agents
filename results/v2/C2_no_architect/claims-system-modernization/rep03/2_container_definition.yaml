level: container
scope: "Container diagram for Insurance Claims Modernization system"
system:
  name: "Insurance Claims Modernization system"
elements:
  - type: "person"
    name: "Customer"
    description: "Submits claims online."
  - type: "person"
    name: "Broker"
    description: "Submits claims on behalf of customers."
  - type: "person"
    name: "Claims Adjuster"
    description: "Accesses adjuster screens to manage and process claims."
  - type: "person"
    name: "Business Operations Manager"
    description: "Manages business operations and views analytics."
  - type: "person"
    name: "Migration Administrator"
    description: "Administers incremental claim-type migrations."
  - type: "externalSystem"
    name: "COBOL/DB2 Mainframe System of Record"
    description: "Legacy on-premises system of record."
  - type: "container"
    name: "Modern Web Application"
    technology: "React, ASP.NET Core"
    description: "Customer/broker portal and adjuster UI for online claim submissions and workflows."
  - type: "container"
    name: "API Gateway / Ingress Controller"
    technology: "Azure Application Gateway / NGINX"
    description: "Routes external traffic to internal containerized services."
  - type: "container"
    name: "Azure Service Bus"
    technology: "Azure Service Bus"
    description: "Asynchronous message broker for buffering and isolating mainframe latency."
  - type: "container"
    name: "Azure Cache / Local Caching Layer"
    technology: "Azure Cache for Redis"
    description: "Provides performance isolation and fast data retrieval."
  - type: "container"
    name: "Business/Migration Analytics Container"
    technology: "Python, Azure Analytics"
    description: "Handles business and migration analytics."
  - type: "container"
    name: "Data Sync & Reconciliation Jobs"
    technology: "Azure Container Instances / Functions"
    description: "Synchronizes data and reconciles state with the legacy mainframe."
relationships:
  - source: "Customer"
    destination: "API Gateway / Ingress Controller"
    description: "Submits claims and interacts with portal"
    technology: "HTTPS/OAuth2"
  - source: "Broker"
    destination: "API Gateway / Ingress Controller"
    description: "Submits claims on behalf of customers"
    technology: "HTTPS/OAuth2"
  - source: "Claims Adjuster"
    destination: "API Gateway / Ingress Controller"
    description: "Interacts with adjuster UI"
    technology: "HTTPS, RBAC, Azure AD SSO"
  - source: "Business Operations Manager"
    destination: "API Gateway / Ingress Controller"
    description: "Accesses business dashboards"
    technology: "HTTPS"
  - source: "Migration Administrator"
    destination: "API Gateway / Ingress Controller"
    description: "Manages migrations"
    technology: "HTTPS"
  - source: "API Gateway / Ingress Controller"
    destination: "Modern Web Application"
    description: "Forwards HTTP requests"
    technology: "HTTP/REST"
  - source: "Modern Web Application"
    destination: "Azure Service Bus"
    description: "Publishes asynchronous messages"
    technology: "AMQP / Azure Service Bus Protocol"
  - source: "Modern Web Application"
    destination: "Azure Cache / Local Caching Layer"
    description: "Reads and writes cached data"
    technology: "TCP / Redis Protocol"
  - source: "Data Sync & Reconciliation Jobs"
    destination: "COBOL/DB2 Mainframe System of Record"
    description: "Syncs data across hybrid trust boundary"
    technology: "mTLS with certificate pinning"
  - source: "Azure Service Bus"
    destination: "Data Sync & Reconciliation Jobs"
    description: "Triggers sync and processing queues"
    technology: "AMQP"