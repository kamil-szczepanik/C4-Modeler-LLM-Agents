level: context
scope: "System Context diagram for Hybrid Cloud Claims System"
system:
  name: "Hybrid Cloud Claims System"
  description: "Modern hybrid cloud platform replacing a 30-year-old COBOL/DB2 mainframe claims system, enabling online claim submission and adjuster workflows while maintaining legacy operations."
elements:
  - type: "person"
    name: "Customer"
    description: "Submits claims online."
  - type: "person"
    name: "Broker"
    description: "Submits claims on behalf of customers."
  - type: "person"
    name: "Claims Adjuster"
    description: "Accesses adjuster screens to manage and process claims."
  - type: "person"
    name: "Business Operations Manager"
    description: "Manages business operations via the dashboard."
  - type: "externalSystem"
    name: "COBOL/DB2 Mainframe System of Record"
    description: "Legacy on-premise system maintaining core records and nightly batch processing."
relationships:
  - source: "Customer"
    destination: "Hybrid Cloud Claims System"
    description: "Submit claims"
    technology: "HTTPS/TLS 1.3"
  - source: "Broker"
    destination: "Hybrid Cloud Claims System"
    description: "Submit claims"
    technology: "HTTPS/TLS 1.3"
  - source: "Claims Adjuster"
    destination: "Hybrid Cloud Claims System"
    description: "Access adjuster screens and workflows"
    technology: "HTTPS, OpenID Connect, OAuth 2.0"
  - source: "Business Operations Manager"
    destination: "Hybrid Cloud Claims System"
    description: "Access business operations dashboard"
    technology: "HTTPS"
  - source: "Hybrid Cloud Claims System"
    destination: "COBOL/DB2 Mainframe System of Record"
    description: "Route traffic securely and execute legacy operations"
    technology: "mTLS, HMAC"