level: component
scope: "Component diagram for the API Gateway / Ingress Controller container"
parentContainer:
  name: "API Gateway / Ingress Controller"
elements:
  - type: "component"
    name: "Traffic Splitter and Router"
    technology: "Azure Application Gateway / NGINX"
    description: "Handles dynamic traffic splitting between the modern cloud application and the legacy mainframe system."
  - type: "component"
    name: "Circuit Breaker"
    technology: "NGINX / Envoy"
    description: "Protects downstream services and manages failures during legacy mainframe communications."
  - type: "component"
    name: "Edge JWT Validator"
    technology: "Azure Active Directory SSO / OAuth2"
    description: "Validates JSON Web Tokens at the edge and enforces security policies."
relationships:
  - source: "Traffic Splitter and Router"
    destination: "Circuit Breaker"
    description: "Routes filtered traffic through"
  - source: "Edge JWT Validator"
    destination: "Traffic Splitter and Router"
    description: "Authenticates incoming requests before routing"