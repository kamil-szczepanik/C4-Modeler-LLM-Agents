level: component
scope: "Component diagram for the Business/Migration Analytics Container container"
parentContainer:
  name: "Business/Migration Analytics Container"
elements:
  - type: "component"
    name: "Dashboard UI Service"
    technology: "Python, Azure Analytics"
    description: "Serves migration dashboards and financial risk reports to Business Operations Managers and Migration Leads."
  - type: "component"
    name: "Migration Telemetry Ingestion Engine"
    technology: "Python"
    description: "Ingests event streams from Azure Service Bus to process migration telemetry without direct mainframe polling."
  - type: "component"
    name: "Dry-Run Simulation & Analytics Processor"
    technology: "Python"
    description: "Processes data for migration velocity, zero-loss reconciliation, rollback readiness, and dry-run simulation results."
relationships:
  - source: "Dashboard UI Service"
    destination: "Migration Telemetry Ingestion Engine"
    description: "Queries processed migration metrics"
  - source: "Migration Telemetry Ingestion Engine"
    destination: "Dry-Run Simulation & Analytics Processor"
    description: "Passes ingested event streams for analysis"