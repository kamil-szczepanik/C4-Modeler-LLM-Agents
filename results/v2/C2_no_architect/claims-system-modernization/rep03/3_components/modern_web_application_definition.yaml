level: component
scope: "Component diagram for the Modern Web Application container"
parentContainer:
  name: "Modern Web Application"
elements:
  - type: "component"
    name: "Claim Submission and Management Controller"
    technology: "ASP.NET Core Controller"
    description: "Handles HTTP requests from customers and brokers for submitting and managing claims."
  - type: "component"
    name: "Adjuster Dashboard Controller"
    technology: "ASP.NET Core Controller"
    description: "Serves the React frontend UI and handles API calls for claims adjusters."
  - type: "component"
    name: "Legacy Integration Service"
    technology: "ASP.NET Core Service"
    description: "Manages REST and Batch API communication with the COBOL/DB2 mainframe system."
  - type: "component"
    name: "Caching Manager"
    technology: "Azure Cache for Redis Client"
    description: "Manages low-latency caching to meet sub-2-second load times."
  - type: "component"
    name: "Messaging Dispatcher"
    technology: "Azure Service Bus Client"
    description: "Publishes and consumes asynchronous messages for reliable hybrid integration."
relationships:
  - source: "Claim Submission and Management Controller"
    destination: "Legacy Integration Service"
    description: "Delegates mainframe operations"
  - source: "Adjuster Dashboard Controller"
    destination: "Caching Manager"
    description: "Retrieves cached UI data"
  - source: "Legacy Integration Service"
    destination: "Messaging Dispatcher"
    description: "Sends asynchronous hybrid integration events"