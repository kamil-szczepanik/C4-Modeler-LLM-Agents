level: component
scope: "Component diagram for the Data Sync & Reconciliation Jobs container"
parentContainer:
  name: "Data Sync & Reconciliation Jobs"
elements:
  - type: "component"
    name: "Data Sync & Reconciliation Jobs"
    technology: "Azure Container Apps (Jobs)"
    description: "Synchronizes data and reconciles state between the modern Azure platform and the legacy on-premise mainframe, guaranteeing zero data loss or duplication."
  - type: "component"
    name: "COBOL/DB2 Mainframe System of Record"
    technology: "COBOL / DB2"
    description: "Legacy on-premise system of record for insurance claims processing."
  - type: "component"
    name: "Azure Service Bus & Dead-Letter Queues (DLQ)"
    technology: "Azure Service Bus (AMQP)"
    description: "Enables reliable asynchronous messaging and dead-letter queueing for failed events."
  - type: "component"
    name: "Azure Key Vault & Managed Identities"
    technology: "Azure Key Vault & Managed Identities (HTTPS)"
    description: "Secures credentials and retrieves database credentials dynamically without hardcoding secrets."
  - type: "component"
    name: "Azure Monitor & Azure Sentinel"
    technology: "Azure Monitor (HTTPS)"
    description: "Streams drift metrics and reconciliation logs."
relationships:
  - source: "Azure Service Bus & Dead-Letter Queues (DLQ)"
    destination: "Data Sync & Reconciliation Jobs"
    description: "Triggers sync and processing queues [AMQP]"
  - source: "Data Sync & Reconciliation Jobs"
    destination: "COBOL/DB2 Mainframe System of Record"
    description: "Syncs data and reconciles state across hybrid boundary [mTLS with certificate pinning]"
  - source: "Data Sync & Reconciliation Jobs"
    destination: "Azure Key Vault & Managed Identities"
    description: "Retrieves database credentials dynamically [HTTPS / Managed Identity]"
  - source: "Data Sync & Reconciliation Jobs"
    destination: "Azure Monitor & Azure Sentinel"
    description: "Streams drift metrics and reconciliation logs [HTTPS]"