level: context
scope: "System Context diagram for Modern Azure-Hosted Claims Platform"
system:
  name: "Modern Azure-Hosted Claims Platform"
  description: "Gradually replaces a 30-year-old COBOL/DB2 mainframe claims system with a modern Azure-hosted platform while maintaining uninterrupted processing, enabling online claim submission, rapid adjuster workflows, and incremental claim-type migration."
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "External users who interact with the platform for online claim submission."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users who use the platform for rapid adjuster workflows."
  - type: "person"
    name: "Business Operations Managers and System Administrators"
    description: "Personnel responsible for managing business operations and system administration."
  - type: "externalSystem"
    name: "On-Premises COBOL/DB2 Mainframe System of Record"
    description: "Legacy 30-year-old mainframe system handling core processing and historical records."
  - type: "externalSystem"
    name: "Azure AD (Entra ID)"
    description: "Identity and Access Management system providing authentication and role-based access control."
relationships:
  - source: "Customers and Brokers"
    destination: "Modern Azure-Hosted Claims Platform"
    description: "Interact with the Azure Web Application for online claim submission"
    technology: "HTTPS / TLS 1.3"
  - source: "Claims Adjusters"
    destination: "Modern Azure-Hosted Claims Platform"
    description: "Use the Azure Web Application for claims processing"
    technology: "OIDC / OAuth 2.0 / HTTPS"
  - source: "Modern Azure-Hosted Claims Platform"
    destination: "On-Premises COBOL/DB2 Mainframe System of Record"
    description: "Communicates via integration patterns for data synchronization and processing"
    technology: "mTLS / Asynchronous Outbox / Hybrid Network"
  - source: "Modern Azure-Hosted Claims Platform"
    destination: "Azure AD (Entra ID)"
    description: "Authenticates users and validates access tokens"
    technology: "OAuth 2.0 / OIDC"