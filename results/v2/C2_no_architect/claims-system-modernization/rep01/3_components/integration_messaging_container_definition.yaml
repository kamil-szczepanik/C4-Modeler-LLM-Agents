level: component
scope: "Component diagram for the Integration/Messaging Container container"
parentContainer:
  name: "Integration/Messaging Container"
elements:
  - type: "component"
    name: "Message Publisher"
    technology: "Azure Service Bus SDK"
    description: "Publishes asynchronous claim messages received from the API Gateway to the message queue."
  - type: "component"
    name: "Message Consumer & Router"
    technology: "Azure Container Apps Background Service"
    description: "Consumes messages from Azure Service Bus, handling retries, dead-letter queues, and exponential backoff."
  - type: "component"
    name: "Mainframe Sync Adapter"
    technology: "Custom .NET Core Worker Service over Azure ExpressRoute"
    description: "Synchronizes processed claim data securely with the on-premises COBOL/DB2 mainframe system of record."
relationships:
  - source: "Message Publisher"
    destination: "Message Consumer & Router"
    description: "Queues and dispatches asynchronous messages [Azure Service Bus Protocol]"
  - source: "Message Consumer & Router"
    destination: "Mainframe Sync Adapter"
    description: "Triggers data synchronization for mainframe processing [Internal Messaging]"