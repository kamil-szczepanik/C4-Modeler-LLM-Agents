level: component
scope: "Component diagram for the Operations Portal Container container"
parentContainer:
  name: "Operations Portal Container"
elements:
  - type: "component"
    name: "Migration Dashboard UI"
    technology: "Azure Container Apps (Frontend)"
    description: "Provides management oversight, migration dashboards, and SLA metrics to Business Operations Managers."
  - type: "component"
    name: "Administration & Rollback Controller"
    technology: "Azure Container Apps (Backend)"
    description: "Executes emergency rollbacks and manages system configurations for System Administrators."
  - type: "component"
    name: "Telemetry & Audit Service"
    technology: "Azure Container Apps (Background Service)"
    description: "Forwards telemetry, traces, and anonymized audit logs to Azure Application Insights."
relationships:
  - source: "Migration Dashboard UI"
    destination: "Azure SQL Database"
    description: "Queries in-flight claim data and audit logs via TDS over TLS 1.3 using Azure Managed Identities"
  - source: "Administration & Rollback Controller"
    destination: "On-Premises COBOL/DB2 Mainframe"
    description: "Fetches legacy system metrics and batch status via secure VPN/ExpressRoute with circuit breakers"
  - source: "Telemetry & Audit Service"
    destination: "Azure Application Insights & Azure Monitor"
    description: "Forwards telemetry, traces, and anonymized audit logs via HTTPS"