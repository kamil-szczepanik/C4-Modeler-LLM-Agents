level: component
scope: "Component diagram for the Audit & Reconciliation Container container"
parentContainer:
  name: "Audit & Reconciliation Container"
elements:
  - type: "component"
    name: "Transaction Log Reader"
    technology: "Azure Container Apps Jobs"
    description: "Continuously reads transaction logs from the on-premises COBOL/DB2 mainframe to ensure state consistency."
  - type: "component"
    name: "State Comparator"
    technology: "Azure Container Apps Jobs"
    description: "Queries Azure SQL and compares state against mainframe transaction logs."
  - type: "component"
    name: "Exception Handler"
    technology: "Azure Container Apps Jobs"
    description: "Processes drift alerts and handles manual exception-resolution workflows triggered by the Operations Portal."
  - type: "component"
    name: "Audit Logger"
    technology: "Azure Storage with WORM & Azure Diagnostics"
    description: "Ships audit logs, drift alerts, and WORM immutability data to Azure Monitor and Sentinel."
relationships:
  - source: "Transaction Log Reader"
    destination: "State Comparator"
    description: "Passes extracted transaction state for comparison"
  - source: "State Comparator"
    destination: "Exception Handler"
    description: "Triggers reconciliation exceptions upon state drift"
  - source: "Transaction Log Reader"
    destination: "Audit Logger"
    description: "Sends logs and drift data"
  - source: "State Comparator"
    destination: "Audit Logger"
    description: "Sends comparison and audit results"