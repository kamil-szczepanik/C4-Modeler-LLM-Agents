level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Traffic Router"
    technology: "Azure Container Apps Native Traffic Splitting"
    description: "Dynamically routes claims traffic between Azure Microservices and the legacy on-premises mainframe based on migration status."
  - type: "component"
    name: "Security & Validation Engine"
    technology: "OpenAPI / JSON Schema Validation & Azure WAF Integration"
    description: "Enforces payload sanitization, WAF rules, and mitigates OWASP Top 10 threats at the gateway layer."
  - type: "component"
    name: "Authentication Handler"
    technology: "Azure Active Directory / Entra ID & JWT"
    description: "Validates JWT tokens and handles Single Sign-On (SSO) and mTLS with Managed Identities for internal users."
relationships:
  - source: "Security & Validation Engine"
    destination: "Traffic Router"
    description: "Forwards sanitized and authenticated traffic"
  - source: "Authentication Handler"
    destination: "Traffic Router"
    description: "Provides validated security context for routing"