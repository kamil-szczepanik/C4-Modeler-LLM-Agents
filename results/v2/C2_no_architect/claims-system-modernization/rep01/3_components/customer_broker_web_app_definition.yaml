level: component
scope: "Component diagram for the Customer/Broker Web App container"
parentContainer:
  name: "Customer/Broker Web App"
elements:
  - type: "component"
    name: "Claim Submission Controller"
    technology: "Azure Container Apps / Web Framework"
    description: "Handles incoming HTTP requests from customers and brokers for submitting and tracking claims."
  - type: "component"
    name: "Photo Upload Handler"
    technology: "Azure Container Apps / SAS Token Generator"
    description: "Manages direct photo uploads to Azure Blob Storage using SAS tokens."
  - type: "component"
    name: "Draft Claims Manager"
    technology: "Azure Container Apps / Entity Framework"
    description: "Persists and retrieves draft claims using Azure SQL Database."
  - type: "component"
    name: "Messaging Publisher"
    technology: "Azure Service Bus SDK"
    description: "Publishes asynchronous messages to the Integration/Messaging Container."
relationships:
  - source: "Claim Submission Controller"
    destination: "API Gateway"
    description: "Routes requests [mTLS / Azure Entra Managed Identities]"
  - source: "Photo Upload Handler"
    destination: "Azure Blob Storage"
    description: "Uploads accident photos [HTTPS / SAS Tokens]"
  - source: "Draft Claims Manager"
    destination: "Azure SQL Database"
    description: "Persists draft claims [TDS / TLS 1.3]"
  - source: "Messaging Publisher"
    destination: "Integration/Messaging Container"
    description: "Publishes async messages [Azure Service Bus Protocol]"
  - source: "Claim Submission Controller"
    destination: "Azure Active Directory (Entra ID)"
    description: "Authenticates users [OAuth 2.0 / OIDC]"