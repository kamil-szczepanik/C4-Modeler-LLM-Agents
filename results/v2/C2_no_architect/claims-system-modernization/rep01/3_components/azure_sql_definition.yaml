level: component
scope: "Component diagram for the Azure SQL container"
parentContainer:
  name: "Azure SQL"
elements:
  - type: "component"
    name: "Relational Storage Engine"
    technology: "Azure SQL Database Engine"
    description: "Manages core transactional storage with Transparent Data Encryption (TDE)."
  - type: "component"
    name: "PII Encryption Service"
    technology: "Always Encrypted with Column-Level Encryption"
    description: "Protects sensitive customer and claim data using Customer-Managed Keys in Azure Key Vault."
  - type: "component"
    name: "Dynamic Data Masking Engine"
    technology: "SQL Dynamic Data Masking"
    description: "Obfuscates sensitive data for unauthorized or non-privileged users in real time."
  - type: "component"
    name: "Readable Secondary Replica"
    technology: "Azure SQL Secondary Replica"
    description: "Isolates analytical workloads and operations metrics reporting from transactional processing."
relationships:
  - source: "Relational Storage Engine"
    destination: "PII Encryption Service"
    description: "Applies column-level PII encryption and decryption"
  - source: "Relational Storage Engine"
    destination: "Dynamic Data Masking Engine"
    description: "Applies data masking rules to result sets"
  - source: "Relational Storage Engine"
    destination: "Readable Secondary Replica"
    description: "Replicates transactional data for analytics"