level: component
scope: "Component diagram for the Claims Adjuster Web App container"
parentContainer:
  name: "Claims Adjuster Web App"
elements:
  - type: "component"
    name: "Claims Adjuster UI Controller"
    technology: "Azure Container Apps / Modern Web Frontend"
    description: "Provides a modern interface for claims handlers to process policies and access adjuster workflows."
  - type: "component"
    name: "Authentication & Authorization Manager"
    technology: "Azure Active Directory (Entra ID) / JWT / RBAC"
    description: "Validates OIDC / OAuth 2.0 authentication tokens and handles fine-grained application-level authorization based on adjuster permissions."
  - type: "component"
    name: "Claims Processing Router"
    technology: "HTTPS / mTLS / Azure Entra Managed Identities"
    description: "Routes claims processing requests securely to the API Gateway."
  - type: "component"
    name: "Event Publisher"
    technology: "Azure Service Bus Protocol"
    description: "Publishes asynchronous claim events to the Integration/Messaging Container."
  - type: "component"
    name: "Audit Logger"
    technology: "HTTPS / TLS 1.3 / OpenTelemetry"
    description: "Streams tamper-evident audit logs and handles distributed tracing via Azure Application Insights."
relationships:
  - source: "Claims Adjuster UI Controller"
    destination: "Authentication & Authorization Manager"
    description: "Validates authentication tokens and verifies permissions via [HTTPS / OAuth 2.0]"
  - source: "Claims Adjuster UI Controller"
    destination: "Claims Processing Router"
    description: "Routes claims processing requests via [mTLS / Azure Entra Managed Identities]"
  - source: "Claims Adjuster UI Controller"
    destination: "Event Publisher"
    description: "Publishes asynchronous claim events via [Azure Service Bus Protocol]"
  - source: "Claims Adjuster UI Controller"
    destination: "Audit Logger"
    description: "Streams tamper-evident audit logs via [HTTPS / TLS 1.3]"