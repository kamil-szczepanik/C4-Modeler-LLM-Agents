level: container
scope: "Container diagram for Modern Azure-Hosted Claims Platform"
system:
  name: "Modern Azure-Hosted Claims Platform"
elements:
  - type: "person"
    name: "Customers"
    description: "External users who submit insurance claims online."
  - type: "person"
    name: "Brokers"
    description: "External intermediaries who submit and manage claims on behalf of customers."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users who execute rapid adjuster workflows."
  - type: "person"
    name: "Business Operations Managers"
    description: "Personnel responsible for managing business operations via the operations portal."
  - type: "person"
    name: "System Administrators"
    description: "Personnel responsible for system administration and monitoring."
  - type: "externalSystem"
    name: "On-Premises COBOL/DB2 Mainframe System of Record"
    description: "Legacy on-premises mainframe system handling core operations and historical records."
  - type: "externalSystem"
    name: "Azure Active Directory (Entra ID)"
    description: "Identity and Access Management system providing authentication and role-based access control."
  - type: "container"
    name: "Customer/Broker Web App"
    technology: "Azure Container Apps"
    description: "Web application allowing customers and brokers to submit claims online."
  - type: "container"
    name: "Claims Adjuster Web App"
    technology: "Azure Container Apps"
    description: "Web application enabling claims adjusters to perform rapid claims processing."
  - type: "container"
    name: "API Gateway"
    technology: "Azure Container Apps"
    description: "Entry point managing and routing incoming API requests."
  - type: "container"
    name: "Integration/Messaging Container"
    technology: "Azure Service Bus"
    description: "Asynchronously synchronizes data between Azure and the legacy mainframe."
  - type: "container"
    name: "Operations Portal Container"
    technology: "Azure Container Apps"
    description: "Provides management and operational insights for business managers."
  - type: "container"
    name: "Audit & Reconciliation Container"
    technology: "Azure Container Apps"
    description: "Continuously verifies state consistency against the DB2 mainframe."
  - type: "container"
    name: "Azure SQL"
    technology: "Azure SQL Database with TDE and column-level PII encryption"
    description: "Managed relational storage for application data."
relationships:
  - source: "Customers"
    destination: "Customer/Broker Web App"
    description: "Accesses for online claim submission"
    technology: "HTTPS / OpenID Connect / OAuth2"
  - source: "Brokers"
    destination: "Customer/Broker Web App"
    description: "Accesses for online claim submission and management"
    technology: "HTTPS / OpenID Connect / OAuth2"
  - source: "Customers"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS / OpenID Connect / OAuth2"
  - source: "Brokers"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS / OpenID Connect / OAuth2"
  - source: "Claims Adjusters"
    destination: "Claims Adjuster Web App"
    description: "Interacts for claims workflows with identity delegated to Azure AD"
    technology: "HTTPS"
  - source: "Business Operations Managers"
    destination: "Operations Portal Container"
    description: "Accesses for business operations management"
    technology: "HTTPS"
  - source: "System Administrators"
    destination: "Operations Portal Container"
    description: "Accesses for system administration"
    technology: "HTTPS"
  - source: "Customer/Broker Web App"
    destination: "API Gateway"
    description: "Routes requests through"
    technology: "mTLS / Azure Entra Managed Identities"
  - source: "Claims Adjuster Web App"
    destination: "API Gateway"
    description: "Routes requests through"
    technology: "mTLS / Azure Entra Managed Identities"
  - source: "API Gateway"
    destination: "Azure SQL"
    description: "Reads and writes relational data"
    technology: "TDS / Encrypted Connection"
  - source: "Customer/Broker Web App"
    destination: "Integration/Messaging Container"
    description: "Publishes asynchronous messages"
    technology: "Azure Service Bus Protocol"
  - source: "Claims Adjuster Web App"
    destination: "Integration/Messaging Container"
    description: "Publishes asynchronous messages"
    technology: "Azure Service Bus Protocol"
  - source: "Integration/Messaging Container"
    destination: "On-Premises COBOL/DB2 Mainframe System of Record"
    description: "Synchronizes data asynchronously"
    technology: "Azure ExpressRoute with IPSec encryption"
  - source: "Audit & Reconciliation Container"
    destination: "On-Premises COBOL/DB2 Mainframe System of Record"
    description: "Continuously verifies state consistency"
    technology: "Azure ExpressRoute with IPSec encryption"
  - source: "Audit & Reconciliation Container"
    destination: "Azure SQL"
    description: "Verifies state consistency against database"
    technology: "Encrypted Connection"
  - source: "Claims Adjuster Web App"
    destination: "Azure Active Directory (Entra ID)"
    description: "Authenticates users"
    technology: "OAuth 2.0 / OIDC"
  - source: "Customer/Broker Web App"
    destination: "Azure Active Directory (Entra ID)"
    description: "Authenticates users"
    technology: "OAuth 2.0 / OIDC"