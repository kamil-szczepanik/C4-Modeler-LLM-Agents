level: component
scope: "Component diagram for the Backend-For-Frontend (BFF) Container container"
parentContainer:
  name: "Backend-For-Frontend (BFF) Container"
elements:
  - type: "component"
    name: "API Controller"
    technology: "Node.js / REST / HTTPS"
    description: "Exchanges tokens and data via REST/HTTPS with OAuth2 Token Exchange and serves incoming traffic."
  - type: "component"
    name: "Session and Cache Manager"
    technology: "Azure Redis"
    description: "Handles encrypted caching layer for session and claim data."
  - type: "component"
    name: "Configuration Client"
    technology: "Azure App Configuration"
    description: "Retrieves centralized feature flag management for incremental migration."
  - type: "component"
    name: "Secret Manager Client"
    technology: "Azure Key Vault / Managed Identities"
    description: "Retrieves secrets securely via Managed Identities and HTTPS."
  - type: "component"
    name: "Messaging Publisher"
    technology: "Azure Service Bus (AMQP)"
    description: "Exchanges asynchronous events via AMQP messaging."
  - type: "component"
    name: "Legacy Integration Client"
    technology: "Node.js / mTLS / OpenTelemetry"
    description: "Interacts across hybrid boundary with the COBOL/DB2 Mainframe using mTLS, circuit breakers, and OpenTelemetry."
relationships:
  - source: "API Controller"
    destination: "Session and Cache Manager"
    description: "Caches session and claim data"
  - source: "API Controller"
    destination: "Configuration Client"
    description: "Fetches feature flags"
  - source: "API Controller"
    destination: "Secret Manager Client"
    description: "Retrieves secrets securely"
  - source: "API Controller"
    destination: "Messaging Publisher"
    description: "Publishes asynchronous events"
  - source: "API Controller"
    destination: "Legacy Integration Client"
    description: "Delegates legacy requests"