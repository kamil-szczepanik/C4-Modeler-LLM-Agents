level: component
scope: "Component diagram for the Routing Container container"
parentContainer:
  name: "Routing Container"
elements:
  - type: "component"
    name: "Routing Service"
    technology: "Go"
    description: "Handles high-performance network routing of claims traffic and low memory footprint operations."
  - type: "component"
    name: "mTLS Enforcer"
    technology: "mTLS / Azure Key Vault"
    description: "Enforces strict bidirectional TLS with certificate pinning and secures private keys for hybrid bridging."
  - type: "component"
    name: "GitOps Sync Agent"
    technology: "ArgoCD / Git"
    description: "Synchronizes routing tables via GitOps configuration pipeline for rapid claim type rollbacks."
relationships:
  - source: "Routing Service"
    destination: "mTLS Enforcer"
    description: "Secures traffic sent to the COBOL/DB2 Mainframe"
  - source: "GitOps Sync Agent"
    destination: "Routing Service"
    description: "Updates routing configuration"