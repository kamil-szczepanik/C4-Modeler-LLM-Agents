# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the ArgoCD container"
parentContainer:
  name: "ArgoCD"
elements:
  - type: "component"
    name: "GitOps Reconciliation Engine"
    technology: "ArgoCD Core"
    description: "Standardizes container rollouts and enables 1-day rollbacks for cloud-inexperienced teams."
  - type: "component"
    name: "External Secrets Operator"
    technology: "Kubernetes Operator"
    description: "Injects secrets securely at runtime from Azure Key Vault."
  - type: "component"
    name: "Configuration Synchronizer"
    technology: "In-cluster API"
    description: "Synchronizes routing configurations and feature flags to the Routing Container."
relationships:
  - source: "GitOps Reconciliation Engine"
    destination: "Azure Key Vault"
    description: "Injects secrets securely at runtime [External Secrets Operator]"
  - source: "GitOps Reconciliation Engine"
    destination: "Routing Container"
    description: "Synchronizes routing configurations and feature flags [In-cluster API]"
  - source: "GitOps Reconciliation Engine"
    destination: "Azure Monitor"
    description: "Ships audit logs and application health metrics [HTTPS]"