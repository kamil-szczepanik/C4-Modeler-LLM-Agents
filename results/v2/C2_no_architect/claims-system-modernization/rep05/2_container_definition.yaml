level: container
scope: "Container diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "External users submitting claims online."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users managing claims in the new web application."
  - type: "person"
    name: "Business Operations / Compliance Officers"
    description: "Internal users monitoring compliance and operations."
  - type: "person"
    name: "IT Administrators"
    description: "Internal staff managing operational tooling, feature flags, and rollbacks."
  - type: "externalSystem"
    name: "COBOL/DB2 Mainframe"
    description: "On-premises system of record claims mainframe."
  - type: "externalSystem"
    name: "Azure Active Directory / Entra ID"
    description: "Identity provider used for Single Sign-On (SSO) and RBAC."
  - type: "externalSystem"
    name: "Azure Key Vault"
    description: "Secret management service using Managed Identities."
  - type: "container"
    name: "Customer Portal"
    technology: "React / HTTPS"
    description: "Allows customers and brokers to submit claims online."
  - type: "container"
    name: "Adjuster Web Application"
    technology: "React / OAuth2 / OIDC"
    description: "High-performance web interface for adjusters."
  - type: "container"
    name: "Backend-For-Frontend (BFF) Container"
    technology: "Node.js / REST / HTTPS"
    description: "Serves the adjuster web application and provides caching layer."
  - type: "container"
    name: "Routing Container"
    technology: "Go / mTLS"
    description: "Routes traffic and integrates with the on-premises mainframe."
  - type: "container"
    name: "Azure Service Bus"
    technology: "Azure Messaging"
    description: "Handles asynchronous event publishing and message queuing."
  - type: "container"
    name: "ArgoCD"
    technology: "GitOps"
    description: "Standardizes container rollouts and enables 1-day rollbacks."
relationships:
  - source: "Customers and Brokers"
    destination: "Customer Portal"
    description: "Accesses online claim submission"
    technology: "HTTPS/TLS 1.3"
  - source: "Claims Adjusters"
    destination: "Adjuster Web Application"
    description: "Manages claims via web interface"
    technology: "OAuth2/OIDC Single Sign-On"
  - source: "Adjuster Web Application"
    destination: "Backend-For-Frontend (BFF) Container"
    description: "Communicates and exchanges tokens"
    technology: "REST/HTTPS with OAuth2 Token Exchange (RFC 8693)"
  - source: "Backend-For-Frontend (BFF) Container"
    destination: "COBOL/DB2 Mainframe"
    description: "Interacts across hybrid boundary"
    technology: "mTLS and circuit breakers"
  - source: "Routing Container"
    destination: "COBOL/DB2 Mainframe"
    description: "Routes claims traffic to legacy system"
    technology: "mTLS"
  - source: "Adjuster Web Application"
    destination: "Azure Active Directory / Entra ID"
    description: "Authenticates users"
    technology: "OAuth2/OIDC"
  - source: "Backend-For-Frontend (BFF) Container"
    destination: "Azure Service Bus"
    description: "Exchanges asynchronous events"
    technology: "AMQP / Messaging"
  - source: "IT Administrators"
    destination: "ArgoCD"
    description: "Manages container rollouts and rollbacks"
    technology: "GitOps"
  - source: "Backend-For-Frontend (BFF) Container"
    destination: "Azure Key Vault"
    description: "Retrieves secrets securely"
    technology: "Managed Identities / HTTPS"