level: context
scope: "System Context diagram for Modern Claims Platform"
system:
  name: "Modern Claims Platform"
  description: "A hybrid cloud platform that gradually replaces a legacy COBOL/DB2 mainframe claims system, enabling online claim submissions and adjuster processing while maintaining the legacy mainframe as the system of record."
elements:
  - type: "person"
    name: "Customers and Brokers"
    description: "External users submitting claims online."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users managing claims in the new web application."
  - type: "person"
    name: "IT Administrators"
    description: "Internal staff managing operational tooling, feature flags, and rollbacks."
  - type: "externalSystem"
    name: "Legacy System"
    description: "On-premise COBOL/DB2 mainframe claims system acting as the system of record."
  - type: "externalSystem"
    name: "Azure Active Directory (Entra ID)"
    description: "Identity provider used for single sign-on (SSO)."
relationships:
  - source: "Customers and Brokers"
    destination: "Modern Claims Platform"
    description: "Submit claims online"
    technology: "HTTPS (REST API)"
  - source: "Claims Adjusters"
    destination: "Modern Claims Platform"
    description: "Manage claims in the web application"
    technology: "HTTPS (OAuth 2.0 / OIDC)"
  - source: "IT Administrators"
    destination: "Modern Claims Platform"
    description: "Manage operational tooling, feature flags, and rollbacks"
    technology: "Azure App Configuration / HTTPS"
  - source: "Modern Claims Platform"
    destination: "Legacy System"
    description: "Synchronize claims data and maintain system of record"
    technology: "mTLS and asynchronous messaging"
  - source: "Modern Claims Platform"
    destination: "Azure Active Directory (Entra ID)"
    description: "Authenticate users via SSO"
    technology: "OAuth 2.0 / OIDC"