level: component
scope: "Component diagram for the Claims Web App container"
parentContainer:
  name: "Claims Web App"
elements:
  - type: "component"
    name: "React Frontend"
    technology: "React, Azure Static Web Apps"
    description: "Responsive user interface enabling online claim submission and processing for policyholders, brokers, adjusters, and branch agents."
  - type: "component"
    name: "ASP.NET Core API Backend"
    technology: "ASP.NET Core, Azure Container Apps"
    description: "Microservices runtime providing high-performance request handling, RBAC authorization, and hybrid integration."
  - type: "component"
    name: "Azure API Gateway"
    technology: "Azure API Gateway"
    description: "Routes validated traffic from the frontend to the backend securely."
  - type: "component"
    name: "Azure Cache for Redis"
    technology: "Azure Cache for Redis"
    description: "In-memory cache for secure UI state and session management."
  - type: "component"
    name: "Azure Service Bus"
    technology: "Azure Service Bus"
    description: "Asynchronous message queueing for reliable claim event delivery."
  - type: "component"
    name: "Azure App Configuration"
    technology: "Azure App Configuration"
    description: "Centralized management of runtime feature flags for rapid mainframe fallback."
  - type: "component"
    name: "Mainframe Integration Adapter"
    technology: "Polly, HTTPS/MQ"
    description: "Handles resilient communication and synchronization with the on-premises COBOL/DB2 Mainframe."
relationships:
  - source: "React Frontend"
    destination: "Azure API Gateway"
    description: "Forwards API requests [HTTPS, OpenID Connect/OAuth2]"
  - source: "Azure API Gateway"
    destination: "ASP.NET Core API Backend"
    description: "Routes validated traffic [HTTPS, mTLS]"
  - source: "ASP.NET Core API Backend"
    destination: "Azure Cache for Redis"
    description: "Caches UI state and session data [TCP, TLS]"
  - source: "ASP.NET Core API Backend"
    destination: "Azure Service Bus"
    description: "Queues asynchronous claim submissions [AMQP]"
  - source: "ASP.NET Core API Backend"
    destination: "Mainframe Integration Adapter"
    description: "Synchronizes legacy claims processing"
  - source: "ASP.NET Core API Backend"
    destination: "Azure App Configuration"
    description: "Fetches real-time feature flags and fallback states [HTTPS]"