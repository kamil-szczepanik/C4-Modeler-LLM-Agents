level: component
scope: "Component diagram for the Integration Service container"
parentContainer:
  name: "Integration Service"
elements:
  - type: "component"
    name: "Mainframe Connector"
    technology: ".NET / mTLS 1.3"
    description: "Handles hybrid data exchange and legacy queries with the COBOL/DB2 Mainframe using certificate pinning."
  - type: "component"
    name: "Messaging Publisher"
    technology: ".NET / AMQP / Azure SDK"
    description: "Publishes messages and manages dead-letter queues via Azure Service Bus."
  - type: "component"
    name: "Cache Manager"
    technology: ".NET / Redis Protocol over TLS"
    description: "Caches transit data using Azure Cache for Redis with customer-managed keys."
  - type: "component"
    name: "Configuration Client"
    technology: ".NET / HTTPS"
    description: "Retrieves dynamic feature flags for claim type rollbacks from Azure App Configuration."
  - type: "component"
    name: "Secrets Manager"
    technology: ".NET / CSI secret drivers"
    description: "Retrieves mainframe client certificates and credentials from Azure Key Vault."
  - type: "component"
    name: "Audit Logger"
    technology: ".NET / Syslog / Azure Diagnostics"
    description: "Forwards audit and authorization logs to Azure Sentinel."
relationships:
  - source: "Mainframe Connector"
    destination: "COBOL/DB2 Mainframe"
    description: "Hybrid data exchange and legacy queries [mTLS 1.3 with certificate pinning]"
  - source: "Messaging Publisher"
    destination: "Azure Service Bus"
    description: "Publishes messages and dead-letter queues [AMQP / Azure SDK]"
  - source: "Cache Manager"
    destination: "Azure Cache for Redis"
    description: "Caches transit data with customer-managed keys [Redis Protocol over TLS]"
  - source: "Configuration Client"
    destination: "Azure App Configuration"
    description: "Dynamic feature flags for claim type rollbacks [HTTPS]"
  - source: "Secrets Manager"
    destination: "Azure Key Vault"
    description: "Retrieves mainframe client certificates and credentials via CSI secret drivers [HTTPS]"
  - source: "Audit Logger"
    destination: "Azure Sentinel"
    description: "Forwards audit and authorization logs [Syslog / Azure Diagnostics]"