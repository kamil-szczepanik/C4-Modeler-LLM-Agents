level: component
scope: "Component diagram for the Claim Reconciliation Service container"
parentContainer:
  name: "Claim Reconciliation Service"
elements:
  - type: "component"
    name: "Reconciliation Worker"
    technology: ".NET / Azure AKS"
    description: "Executes asynchronous state verification between the modern Azure platform and the legacy mainframe via read-replicas and CDC."
  - type: "component"
    name: "Event Publisher"
    technology: ".NET / Azure Service Bus"
    description: "Publishes discrepancy events to Azure Service Bus using TLS 1.3."
  - type: "component"
    name: "Audit Trail Generator"
    technology: ".NET / Azure Blob Storage"
    description: "Writes cryptographically signed, PII-masked audit trails to immutable WORM storage via HTTPS."
relationships:
  - source: "Reconciliation Worker"
    destination: "COBOL/DB2 Mainframe"
    description: "Asynchronous state verification via read-replicas/CDC [mTLS]"
  - source: "Event Publisher"
    destination: "Azure Service Bus"
    description: "Publishes discrepancy events [TLS 1.3]"
  - source: "Reconciliation Worker"
    destination: "Audit Trail Generator"
    description: "Passes reconciliation results for secure logging"
  - source: "Audit Trail Generator"
    destination: "Azure Blob Storage"
    description: "Writes cryptographically signed, PII-masked audit trails [HTTPS]"