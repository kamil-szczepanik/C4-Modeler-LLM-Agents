# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Azure Redis container"
parentContainer:
  name: "Azure Redis"
elements:
  - type: "component"
    name: "UI Acceleration Cache"
    technology: "Azure Cache for Redis"
    description: "Caches reference data and supports UI acceleration to maintain sub-2-second response times."
  - type: "component"
    name: "Session Management Store"
    technology: "Azure Cache for Redis"
    description: "Manages secure user sessions for claims adjusters interacting with the Claims Web App."
relationships:
  - source: "Claims Web App"
    destination: "UI Acceleration Cache"
    description: "Reads reference data and UI caches [TLS 1.2 / TCP]"
  - source: "Claims Web App"
    destination: "Session Management Store"
    description: "Manages user sessions [TLS 1.2 / TCP]"