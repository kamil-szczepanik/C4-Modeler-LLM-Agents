# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Hybrid Insurance Claims Modernization Platform"
system:
  name: "Hybrid Insurance Claims Modernization Platform"
elements:
  - type: "person"
    name: "Policyholders"
    description: "External users who submit claims online."
  - type: "person"
    name: "Brokers"
    description: "External users who submit and manage claims on behalf of policyholders."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users of the new web application handling claims."
  - type: "person"
    name: "Compliance and Audit Officers"
    description: "Internal users monitoring immutable audit trails."
  - type: "externalSystem"
    name: "COBOL/DB2 Mainframe"
    description: "On-premises legacy system of record."
  - type: "externalSystem"
    name: "Azure Active Directory / Entra ID"
    description: "Identity and Access Management providing SSO."
  - type: "container"
    name: "API Gateway"
    technology: "Azure API Gateway"
    description: "Entry point for incoming requests, routing traffic to internal services."
  - type: "container"
    name: "Claims Web App"
    technology: "Azure AKS, ASP.NET Core / React"
    description: "Web application providing the user interface for policyholders, brokers, and adjusters."
  - type: "container"
    name: "Integration Service"
    technology: "Azure AKS, .NET"
    description: "Handles integration and communication with the legacy mainframe system."
  - type: "container"
    name: "Claim Reconciliation Service"
    technology: "Azure AKS, .NET"
    description: "Performs audit data verification and state synchronization with the mainframe."
  - type: "container"
    name: "Azure Redis"
    technology: "Azure Cache for Redis"
    description: "In-memory caching for UI acceleration."
  - type: "container"
    name: "Azure Service Bus"
    technology: "Azure Service Bus"
    description: "Asynchronous message queueing for claim submissions."
relationships:
  - source: "Policyholders"
    destination: "API Gateway"
    description: "Accesses the platform for claim submissions"
    technology: "HTTPS / TLS 1.3 via OAuth2/OIDC Single Sign-On"
  - source: "Brokers"
    destination: "API Gateway"
    description: "Accesses the platform for claim submissions"
    technology: "HTTPS / TLS 1.3 via OAuth2/OIDC Single Sign-On"
  - source: "Claims Adjusters"
    destination: "API Gateway"
    description: "Interacts with the claims system"
    technology: "HTTPS / TLS 1.3 via OAuth2/OIDC Single Sign-On"
  - source: "Compliance and Audit Officers"
    destination: "API Gateway"
    description: "Monitors audit data and logs"
    technology: "HTTPS / TLS 1.3 via OAuth2/OIDC Single Sign-On"
  - source: "API Gateway"
    destination: "Claims Web App"
    description: "Routes user traffic"
    technology: "HTTPS"
  - source: "Claims Web App"
    destination: "Azure Redis"
    description: "In-memory caching for UI acceleration"
    technology: "TCP"
  - source: "Claims Web App"
    destination: "Azure Service Bus"
    description: "Asynchronous message queueing for claim submissions"
    technology: "AMQP"
  - source: "Integration Service"
    destination: "COBOL/DB2 Mainframe"
    description: "Hybrid integration for data exchange"
    technology: "mTLS (TLS 1.3) with certificate pinning"
  - source: "Claim Reconciliation Service"
    destination: "COBOL/DB2 Mainframe"
    description: "Audit data verification and state synchronization"
    technology: "mTLS"