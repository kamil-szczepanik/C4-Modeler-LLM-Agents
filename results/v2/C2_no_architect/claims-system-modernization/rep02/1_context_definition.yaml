level: context
scope: "System Context diagram for Hybrid Insurance Claims Modernization Platform"
system:
  name: "Hybrid Insurance Claims Modernization Platform"
  description: "A hybrid insurance claims modernization platform that gradually migrates claim types from a legacy mainframe to Azure while maintaining business continuity, data consistency, and a responsive web interface."
elements:
  - type: "person"
    name: "Policyholders and Brokers"
    description: "External users who submit claims online."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users of the new web application handling claims."
  - type: "person"
    name: "Compliance and Audit Officers"
    description: "Internal users monitoring immutable audit trails."
  - type: "externalSystem"
    name: "COBOL/DB2 Mainframe"
    description: "On-premises legacy system of record."
  - type: "externalSystem"
    name: "Azure Active Directory / Entra ID"
    description: "Identity and Access Management providing SSO."
relationships:
  - source: "Policyholders and Brokers"
    destination: "Hybrid Insurance Claims Modernization Platform"
    description: "Submit claims online"
    technology: "HTTPS (TLS 1.3, OpenID Connect/OAuth2)"
  - source: "Claims Adjusters"
    destination: "Hybrid Insurance Claims Modernization Platform"
    description: "Interact with the adjuster web application for sub-second UI responses"
    technology: "HTTPS"
  - source: "Compliance and Audit Officers"
    destination: "Hybrid Insurance Claims Modernization Platform"
    description: "Monitor immutable audit trails"
    technology: "HTTPS"
  - source: "Hybrid Insurance Claims Modernization Platform"
    destination: "COBOL/DB2 Mainframe"
    description: "Communicates asynchronously for data synchronization and processing"
    technology: "Azure Service Bus, Azure ExpressRoute / IPsec VPN (mTLS)"
  - source: "Hybrid Insurance Claims Modernization Platform"
    destination: "Azure Active Directory / Entra ID"
    description: "Federates for Single Sign-On and user authentication"
    technology: "OAuth2 / OpenID Connect"