level: component
scope: "Component diagram for the Adjuster Workspace Container & Backend-For-Frontend (BFF) container"
parentContainer:
  name: "Adjuster Workspace Container & Backend-For-Frontend (BFF)"
elements:
  - type: "component"
    name: "Workspace UI Controller"
    technology: "Node.js / Express / OpenID Connect"
    description: "Enforces OIDC Single Sign-On, RBAC at the BFF boundary, and serves the web interface for claims adjusters."
  - type: "component"
    name: "Claim State & Caching Service"
    technology: "Node.js Service Module"
    description: "Reads cached claim states and session data from Azure Cache for Redis to meet sub-2-second screen load requirements."
  - type: "component"
    name: "Integration Routing Service"
    technology: "Node.js Service Module"
    description: "Routes microservice requests to the Azure API Gateway / Integration Container over internal Azure VNets."
  - type: "component"
    name: "Audit & Telemetry Logger"
    technology: "Node.js SDK / Azure Monitor"
    description: "Streams tamper-evident audit logs to WORM-enabled Azure Storage and sends distributed tracing data to Application Insights."
  - type: "component"
    name: "Secrets Management Client"
    technology: "Azure Managed Identities SDK"
    description: "Retrieves secrets and credentials securely from Azure Key Vault."
relationships:
  - source: "Workspace UI Controller"
    destination: "Claim State & Caching Service"
    description: "Queries cached claim states [Redis Protocol over TLS]"
  - source: "Workspace UI Controller"
    destination: "Integration Routing Service"
    description: "Dispatches backend API requests [Internal Azure VNets]"
  - source: "Claim State & Caching Service"
    destination: "Azure Cache for Redis"
    description: "Reads/Writes session data and claim states [Redis Protocol over TLS]"
  - source: "Integration Routing Service"
    destination: "Azure API Gateway / Integration Container"
    description: "Routes microservice requests [Internal Azure VNets]"
  - source: "Secrets Management Client"
    destination: "Azure Key Vault"
    description: "Retrieves secrets and credentials [Azure Managed Identities]"
  - source: "Audit & Telemetry Logger"
    destination: "Azure Storage"
    description: "Streams tamper-evident audit logs [HTTPS/TLS 1.3]"