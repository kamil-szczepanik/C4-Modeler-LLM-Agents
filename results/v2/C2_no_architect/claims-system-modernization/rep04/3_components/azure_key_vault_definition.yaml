level: component
scope: "Component diagram for the Azure Key Vault container"
parentContainer:
  name: "Azure Key Vault"
elements:
  - type: "component"
    name: "Secrets Management Engine"
    technology: "Azure Key Vault Service"
    description: "Stores and manages sensitive configuration, connection strings, and API keys."
  - type: "component"
    name: "Cryptographic Keys Manager"
    technology: "Azure Key Vault HSM"
    description: "Manages encryption keys used for data protection across the Hybrid Insurance Claims Modernization Platform."
  - type: "component"
    name: "Access Control and Audit Service"
    technology: "Azure RBAC & Azure Monitor"
    description: "Handles authentication, authorization, and logging for all secret and key retrieval requests."
relationships:
  - source: "Secrets Management Engine"
    destination: "Cryptographic Keys Manager"
    description: "Utilizes keys for envelope encryption of secrets"
  - source: "Access Control and Audit Service"
    destination: "Secrets Management Engine"
    description: "Validates permissions before granting access"