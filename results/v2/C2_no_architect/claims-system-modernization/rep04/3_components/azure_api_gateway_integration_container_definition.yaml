level: component
scope: "Component diagram for the Azure API Gateway / Integration Container container"
parentContainer:
  name: "Azure API Gateway / Integration Container"
elements:
  - type: "component"
    name: "Strangler Fig Router"
    technology: "Azure API Gateway Policy / Routing Engine"
    description: "Routes traffic between the modern cloud environment and the legacy mainframe, executing the strangler fig pattern for gradual claim migration."
  - type: "component"
    name: "Anti-Corruption Layer (ACL)"
    technology: "Integration Container / Middleware"
    description: "Translates modern domain models and requests into legacy-compatible formats for the on-premises mainframe."
  - type: "component"
    name: "Security and Authentication Enforcer"
    technology: "OAuth 2.0 / OIDC / mTLS"
    description: "Enforces OAuth 2.0 / OIDC authentication for incoming requests and secures outgoing traffic to the mainframe using mTLS and TLS 1.3."
relationships:
  - source: "Strangler Fig Router"
    destination: "Anti-Corruption Layer (ACL)"
    description: "Forwards legacy-bound traffic for model translation"
  - source: "Security and Authentication Enforcer"
    destination: "Strangler Fig Router"
    description: "Authenticates and authorizes incoming requests before routing"