level: component
scope: "Component diagram for the Customer & Broker Portal Container container"
parentContainer:
  name: "Customer & Broker Portal Container"
elements:
  - type: "component"
    name: "Portal UI & API Controller"
    technology: "Azure Container Apps (ACA)"
    description: "Handles incoming HTTPS requests from end customers and brokers for claim submissions and draft management."
  - type: "component"
    name: "Draft & Session Manager"
    technology: "Azure Cache for Redis"
    description: "Manages temporary claim drafts and session tokens using secure, isolated ephemeral storage."
  - type: "component"
    name: "Async Queue Publisher"
    technology: "Azure Service Bus & AMQP"
    description: "Asynchronously queues claim submissions to decouple portal submissions from legacy mainframe latency."
  - type: "component"
    name: "Integration Gateway Connector"
    technology: "Internal Azure VNets"
    description: "Routes requests from the portal to internal microservices via the Azure API Gateway / Integration Container."
  - type: "component"
    name: "Secrets Management Client"
    technology: "Azure Key Vault & Azure Managed Identities"
    description: "Retrieves cryptographic secrets securely for authentication and service connections."
relationships:
  - source: "Portal UI & API Controller"
    destination: "Draft & Session Manager"
    description: "Store temporary claim drafts and session tokens [TLS 1.3 / VNet Integration]"
  - source: "Portal UI & API Controller"
    destination: "Async Queue Publisher"
    description: "Asynchronously queue claim submissions [AMQP / Azure Managed Identities]"
  - source: "Portal UI & API Controller"
    destination: "Integration Gateway Connector"
    description: "Route requests to internal microservices [Internal Azure VNets]"
  - source: "Portal UI & API Controller"
    destination: "Secrets Management Client"
    description: "Retrieve cryptographic secrets [Azure Managed Identities]"