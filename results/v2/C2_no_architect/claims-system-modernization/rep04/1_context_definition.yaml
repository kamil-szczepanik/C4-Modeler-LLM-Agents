level: context
scope: "System Context diagram for Hybrid Insurance Claims Modernization Platform"
system:
  name: "Hybrid Insurance Claims Modernization Platform"
  description: "A hybrid insurance claims modernization platform that gradually replaces a legacy COBOL/DB2 mainframe with a modern Azure-hosted application while ensuring zero data loss and maintaining the legacy system of record."
elements:
  - type: "person"
    name: "End Customers & Brokers"
    description: "Users submitting claims online."
  - type: "person"
    name: "Claims Adjusters"
    description: "Users managing claims via the new web application."
  - type: "person"
    name: "Operations & Finance Teams"
    description: "Users monitoring regulatory compliance and consistency."
  - type: "externalSystem"
    name: "On-Premises COBOL/DB2 Mainframe"
    description: "System of record during the 3-year migration."
relationships:
  - source: "End Customers & Brokers"
    destination: "Hybrid Insurance Claims Modernization Platform"
    description: "Submit claims online"
    technology: "HTTPS/TLS 1.3"
  - source: "Claims Adjusters"
    destination: "Hybrid Insurance Claims Modernization Platform"
    description: "Manage claims via the new web application"
    technology: "HTTPS/TLS 1.3"
  - source: "Operations & Finance Teams"
    destination: "Hybrid Insurance Claims Modernization Platform"
    description: "Monitor regulatory compliance and consistency"
    technology: "HTTPS"
  - source: "Hybrid Insurance Claims Modernization Platform"
    destination: "On-Premises COBOL/DB2 Mainframe"
    description: "Process legacy claims and integrate with system of record"
    technology: "mTLS over hybrid VPN/ExpressRoute"