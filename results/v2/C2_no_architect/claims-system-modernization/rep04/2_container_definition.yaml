level: container
scope: "Container diagram for Hybrid Insurance Claims Modernization Platform"
system:
  name: "Hybrid Insurance Claims Modernization Platform"
elements:
  - type: "person"
    name: "End Customers & Brokers"
    description: "Users submitting claims online."
  - type: "person"
    name: "Claims Adjusters"
    description: "Users managing claims via the new web application."
  - type: "person"
    name: "Operations & Finance Teams"
    description: "Users monitoring regulatory compliance and consistency."
  - type: "externalSystem"
    name: "On-Premises COBOL/DB2 Mainframe"
    description: "System of record during the 3-year migration."
  - type: "container"
    name: "Azure API Gateway / Integration Container"
    technology: "Azure API Gateway"
    description: "Anti-Corruption Layer that manages hybrid routing, OAuth 2.0 / OIDC authentication, and the strangler fig pattern."
  - type: "container"
    name: "Customer & Broker Portal Container"
    technology: "Azure Container Apps (ACA) / Managed Kubernetes (AKS)"
    description: "Provides online claim submissions for end customers and brokers."
  - type: "container"
    name: "Adjuster Workspace Container & Backend-For-Frontend (BFF)"
    technology: "Azure Container Apps (ACA) / Managed Kubernetes (AKS)"
    description: "Fast adjuster workflows and backend-for-frontend supporting adjuster screens."
  - type: "container"
    name: "Azure Cache for Redis"
    technology: "Azure Cache for Redis (PaaS)"
    description: "Offloads session state and read-heavy caching to meet low-latency requirements."
  - type: "container"
    name: "Azure Key Vault"
    technology: "Azure Key Vault"
    description: "Secures secrets and configuration data accessed via Azure Managed Identities."
relationships:
  - source: "End Customers & Brokers"
    destination: "Customer & Broker Portal Container"
    description: "Submit claims online"
    technology: "HTTPS/TLS 1.3"
  - source: "Claims Adjusters"
    destination: "Adjuster Workspace Container & Backend-For-Frontend (BFF)"
    description: "Manage claims via adjuster workspace"
    technology: "HTTPS/TLS 1.3"
  - source: "Operations & Finance Teams"
    destination: "Azure API Gateway / Integration Container"
    description: "Monitor regulatory compliance and system operations"
    technology: "HTTPS"
  - source: "Customer & Broker Portal Container"
    destination: "Azure API Gateway / Integration Container"
    description: "Routes requests to internal microservices"
    technology: "Internal Azure Virtual Networks (VNets)"
  - source: "Adjuster Workspace Container & Backend-For-Frontend (BFF)"
    destination: "Azure API Gateway / Integration Container"
    description: "Routes requests to internal microservices"
    technology: "Internal Azure Virtual Networks (VNets)"
  - source: "Adjuster Workspace Container & Backend-For-Frontend (BFF)"
    destination: "Azure Cache for Redis"
    description: "Queries for read-heavy caching and session state"
    technology: "Redis Protocol"
  - source: "Azure API Gateway / Integration Container"
    destination: "On-Premises COBOL/DB2 Mainframe"
    description: "Integrates with legacy system of record"
    technology: "mTLS and TLS 1.3"
  - source: "Customer & Broker Portal Container"
    destination: "Azure Key Vault"
    description: "Authenticates and retrieves secrets"
    technology: "Azure Managed Identities"
  - source: "Adjuster Workspace Container & Backend-For-Frontend (BFF)"
    destination: "Azure Key Vault"
    description: "Authenticates and retrieves secrets"
    technology: "Azure Managed Identities"