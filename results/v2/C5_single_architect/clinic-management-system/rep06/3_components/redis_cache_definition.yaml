level: component
scope: "Component diagram for the Redis Cache container"
parentContainer:
  name: "Redis Cache"
elements:
  - type: "component"
    name: "Redis Master Node"
    technology: "Redis v7.x"
    description: "Handles write operations, caching frequent EMR queries, and distributed appointment locks using Redlock."
  - type: "component"
    name: "Redis Replica Nodes"
    technology: "Redis v7.x"
    description: "Handles read scaling and high availability replication from the master node."
  - type: "component"
    name: "Distributed Lock Manager"
    technology: "Redlock"
    description: "Manages distributed locks for scheduling concurrency."
relationships:
  - source: "Redis Master Node"
    destination: "Redis Replica Nodes"
    description: "Handles high availability replication [RESP / TCP]"
  - source: "Distributed Lock Manager"
    destination: "Redis Master Node"
    description: "Acquires distributed locks [RESP / TLS over TCP]"