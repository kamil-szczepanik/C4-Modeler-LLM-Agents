level: component
scope: "Component diagram for the Event Broker container"
parentContainer:
  name: "Event Broker"
elements:
  - type: "component"
    name: "Ingestion & Routing Engine"
    technology: "Apache Kafka Brokers"
    description: "Handles ingestion and routing of asynchronous domain events."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry / Apicurio"
    description: "Validates event payloads."
  - type: "component"
    name: "Audit Log Interceptor"
    technology: "Custom Kafka Streams / Log Compaction"
    description: "Intercepts events to maintain immutable audit trails."
  - type: "component"
    name: "Replication & Mirroring Agent"
    technology: "Apache Kafka MirrorMaker 2 / Confluent Cluster Linking"
    description: "Streams cross-site replication data."
relationships:
  - source: "Core Clinic Service"
    destination: "Ingestion & Routing Engine"
    description: "Publishes asynchronous domain events via TCP / Kafka Protocol"
  - source: "Billing Service"
    destination: "Ingestion & Routing Engine"
    description: "Publishes asynchronous domain events via AMQP / Kafka protocol"
  - source: "Ingestion & Routing Engine"
    destination: "Schema Registry"
    description: "Validates event payloads via HTTP/REST"
  - source: "Integration Service"
    destination: "Ingestion & Routing Engine"
    description: "Consumes clinical events for HL7 FHIR export via Kafka Protocol"
  - source: "Ingestion & Routing Engine"
    destination: "Replication & Mirroring Agent"
    description: "Streams cross-site replication data via TCP / Kafka Protocol"
  - source: "Audit Log Interceptor"
    destination: "PostgreSQL Database"
    description: "Persists immutable event audit trails via JDBC / TLS"