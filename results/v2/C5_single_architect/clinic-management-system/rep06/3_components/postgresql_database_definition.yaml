level: component
scope: "Component diagram for the PostgreSQL Database container"
parentContainer:
  name: "PostgreSQL Database"
elements:
  - type: "component"
    name: "Relational Engine"
    technology: "PostgreSQL v15+"
    description: "Core relational database engine for robust transactional data management."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Connection pooler to prevent connection exhaustion from multiple microservices."
  - type: "component"
    name: "Replication & HA Manager"
    technology: "Patroni / etcd"
    description: "Replication and high availability manager for automated failover and 99.99% uptime."
  - type: "component"
    name: "Encryption & Audit Extension"
    technology: "pgcrypto & pgaudit"
    description: "Database extensions for AES-256 encryption at rest and compliance audit logging."
relationships:
  - source: "Core Clinic Service"
    destination: "Connection Pooler"
    description: "Queries data [TCP / SQL over TLS 1.3]"
  - source: "Billing Service"
    destination: "Connection Pooler"
    description: "Queries data [TCP / SQL over TLS 1.3]"
  - source: "Connection Pooler"
    destination: "Relational Engine"
    description: "Forwards validated client queries [TCP / Local Socket]"
  - source: "Relational Engine"
    destination: "Replication & HA Manager"
    description: "Synchronizes transaction logs [TCP]"
  - source: "Replication & HA Manager"
    destination: "Relational Engine"
    description: "Synchronizes transaction logs [TCP]"
  - source: "Relational Engine"
    destination: "Encryption & Audit Extension"
    description: "Writes audit trails and applies AES-256 encryption [Internal SPI]"