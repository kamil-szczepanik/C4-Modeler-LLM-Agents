level: component
scope: "Component diagram for the Integration Service container"
parentContainer:
  name: "Integration Service"
elements:
  - type: "component"
    name: "API Gateway"
    technology: "NGINX / Envoy"
    description: "Routes incoming requests."
  - type: "component"
    name: "Integration Service"
    technology: "Apache Camel / Spring Integration"
    description: "Handles HL7 FHIR translations and powers routing and integration patterns."
  - type: "component"
    name: "FHIR Router & Validator Component"
    technology: "Java / Spring"
    description: "Validates payloads against US Core FHIR profiles."
  - type: "component"
    name: "HL7 v2/v3 Translation Engine Component"
    technology: "HAPI FHIR / HAPI HL7"
    description: "Converts domain events to legacy HL7 messages."
  - type: "component"
    name: "Outbound Dispatcher Component"
    technology: "Resilience4j"
    description: "Manages retries and circuit breaking."
  - type: "component"
    name: "Integration Audit & DLQ Component"
    technology: "Java / Spring"
    description: "Captures failed payloads for compliance auditing and reconciliation."
  - type: "component"
    name: "PostgreSQL Database"
    technology: "PostgreSQL with AES-256 encryption"
    description: "Stores transactional and audit data."
relationships:
  - source: "API Gateway"
    destination: "Integration Service"
    description: "Routes requests via gRPC over mTLS."
  - source: "FHIR Router & Validator Component"
    destination: "HL7 v2/v3 Translation Engine Component"
    description: "Transforms message formats in-memory."
  - source: "Outbound Dispatcher Component"
    destination: "External Lab & Imaging Systems"
    description: "Transmits diagnostics via HL7 FHIR / v2 over HTTPS/TLS 1.3."
  - source: "Outbound Dispatcher Component"
    destination: "Integration Audit & DLQ Component"
    description: "Forwards failed delivery payloads via asynchronous messaging."
  - source: "Integration Audit & DLQ Component"
    destination: "PostgreSQL Database"
    description: "Stores failed transaction logs via JDBC over TLS 1.3."