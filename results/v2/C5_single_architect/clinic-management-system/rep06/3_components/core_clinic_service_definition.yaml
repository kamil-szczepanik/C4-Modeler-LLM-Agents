level: component
scope: "Component diagram for the Core Clinic Service container"
parentContainer:
  name: "Core Clinic Service"
elements:
  - type: "component"
    name: "PatientController"
    technology: "Spring MVC"
    description: "Handles patient-related HTTP requests and routing within the Core Clinic Service."
  - type: "component"
    name: "ClinicalRecordManager"
    technology: "Spring Service"
    description: "Manages business logic for clinical records and coordinates encryption and data access."
  - type: "component"
    name: "DataAccessor"
    technology: "Spring Data JPA / Hibernate"
    description: "Handles data persistence and retrieval operations for the PostgreSQL Database."
  - type: "component"
    name: "EncryptionEngine"
    technology: "Spring Component"
    description: "Encrypts and decrypts PHI payloads using cryptographic controls."
relationships:
  - source: "PatientController"
    destination: "ClinicalRecordManager"
    description: "Method calls"
  - source: "ClinicalRecordManager"
    destination: "EncryptionEngine"
    description: "Encrypts/decrypts PHI payloads"
  - source: "ClinicalRecordManager"
    destination: "DataAccessor"
    description: "Transactions"
  - source: "ClinicalRecordManager"
    destination: "Event Broker"
    description: "Publishes EMRUpdatedEvent"