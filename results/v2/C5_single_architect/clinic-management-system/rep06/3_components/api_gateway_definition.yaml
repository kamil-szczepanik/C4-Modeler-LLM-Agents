level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Listener & TLS Termination"
    technology: "Envoy"
    description: "Handles incoming network traffic and terminates TLS connections."
  - type: "component"
    name: "Auth & Authz Filter"
    technology: "Envoy Filter"
    description: "Validates authentication and authorization for incoming requests."
  - type: "component"
    name: "Rate Limiting & Throttling Component"
    technology: "Envoy Rate Limit"
    description: "Controls traffic flow and prevents abuse through rate limiting and throttling."
  - type: "component"
    name: "Routing & Load Balancing Component"
    technology: "Envoy Router"
    description: "Routes requests to appropriate downstream services and balances load."
  - type: "component"
    name: "Audit Logging & Telemetry Filter"
    technology: "Envoy Telemetry"
    description: "Captures audit logs and telemetry data for monitoring and compliance."
relationships:
  - source: "Listener & TLS Termination"
    destination: "Auth & Authz Filter"
    description: "Passes decrypted traffic"
  - source: "Auth & Authz Filter"
    destination: "Rate Limiting & Throttling Component"
    description: "Forwards authenticated requests"
  - source: "Rate Limiting & Throttling Component"
    destination: "Routing & Load Balancing Component"
    description: "Passes cleared requests"
  - source: "Routing & Load Balancing Component"
    destination: "Audit Logging & Telemetry Filter"
    description: "Triggers logging and metrics collection"