level: component
scope: "Component diagram for the Web Application container"
parentContainer:
  name: "Web Application"
elements:
  - type: "component"
    name: "Routing & Shell Component"
    technology: "React / TypeScript"
    description: "Handles navigation and overall application layout."
  - type: "component"
    name: "Authentication & Session Manager"
    technology: "OAuth2 / OIDC, MFA"
    description: "Authenticates users via Identity Provider (IdP)."
  - type: "component"
    name: "Clinical Workflows Module"
    technology: "React / TypeScript"
    description: "Manages patient admissions, EMRs, and clinical functions."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios / Fetch"
    description: "Handles secure API communication with enforced headers."
  - type: "component"
    name: "Real-Time Notification Client"
    technology: "WSS"
    description: "Connects for instant updates via WebSocket."
  - type: "component"
    name: "State Management Store"
    technology: "Zustand / Redux Toolkit"
    description: "Manages in-memory state safely without triggering excessive re-renders."
relationships:
  - source: "Authentication & Session Manager"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users via [OAuth2 / OIDC, MFA]"
  - source: "Real-Time Notification Client"
    destination: "API Gateway"
    description: "Connects for instant updates via [WSS]"