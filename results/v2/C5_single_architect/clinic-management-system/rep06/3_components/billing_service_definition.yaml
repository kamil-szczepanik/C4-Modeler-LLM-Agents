level: component
scope: "Component diagram for the Billing Service container"
parentContainer:
  name: "Billing Service"
elements:
  - type: "component"
    name: "Billing API Controller"
    technology: "Express.js"
    description: "Processes clinical billing operations and insurance claim submissions."
  - type: "component"
    name: "Claim Processing Engine"
    technology: "Node.js"
    description: "Handles core business logic for claim processing and coordination."
  - type: "component"
    name: "Gateway Integration Client"
    technology: "Node.js with Opossum Circuit Breaker"
    description: "Manages communication with external insurance payment gateways."
  - type: "component"
    name: "Idempotency Manager"
    technology: "Node.js"
    description: "Verifies transactions and ensures idempotency for requests."
  - type: "component"
    name: "Billing Data Repository"
    technology: "TypeORM"
    description: "Handles data persistence supporting AES-256 data encryption at rest."
  - type: "component"
    name: "Redis Cache"
    technology: "Redis"
    description: "In-memory store for session caching, rate limiting, and idempotency checks."
  - type: "component"
    name: "PostgreSQL Database"
    technology: "PostgreSQL"
    description: "Relational database for storing billing and clinical data."
  - type: "component"
    name: "Insurance Payment Gateways"
    technology: "External REST API"
    description: "Third-party payment gateways for processing claims."
relationships:
  - source: "Billing API Controller"
    destination: "Claim Processing Engine"
    description: "In-process direct function calls"
  - source: "Claim Processing Engine"
    destination: "Idempotency Manager"
    description: "In-process transaction verification"
  - source: "Claim Processing Engine"
    destination: "Gateway Integration Client"
    description: "In-process direct function calls"
  - source: "Claim Processing Engine"
    destination: "Billing Data Repository"
    description: "TCP/Postgres Driver over TLS"
  - source: "Billing Data Repository"
    destination: "PostgreSQL Database"
    description: "Persists data"
  - source: "Gateway Integration Client"
    destination: "Insurance Payment Gateways"
    description: "HTTPS / JSON"
  - source: "Gateway Integration Client"
    destination: "Redis Cache"
    description: "RESP over TLS"