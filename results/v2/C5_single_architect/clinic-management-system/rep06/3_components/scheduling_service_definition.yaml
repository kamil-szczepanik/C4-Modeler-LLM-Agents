level: component
scope: "Component diagram for the Scheduling Service container"
parentContainer:
  name: "Scheduling Service"
elements:
  - type: "component"
    name: "Appointment API Handler"
    technology: "Go"
    description: "Receives gRPC requests from the API Gateway."
  - type: "component"
    name: "Conflict Detection Engine"
    technology: "Go"
    description: "Business logic component for resource clash checks."
  - type: "component"
    name: "Calendar Storage Repository"
    technology: "Go"
    description: "Database interface managing persistence."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Go"
    description: "Handles asynchronous event consumption."
  - type: "component"
    name: "Redis Cache"
    technology: "Redis"
    description: "External cache managing distributed scheduling locks."
  - type: "component"
    name: "PostgreSQL Database"
    technology: "PostgreSQL"
    description: "Persistent storage with AES-256 encryption."
  - type: "component"
    name: "Apache Kafka"
    technology: "Apache Kafka"
    description: "Event broker for domain events."
  - type: "component"
    name: "SMS / Notification Gateway"
    technology: "HTTPS/REST"
    description: "External service for patient reminders."
relationships:
  - source: "API Gateway"
    destination: "Appointment API Handler"
    description: "Routes requests via gRPC over mTLS."
  - source: "Appointment API Handler"
    destination: "Conflict Detection Engine"
    description: "Invokes business rules via direct function calls."
  - source: "Conflict Detection Engine"
    destination: "Redis Cache"
    description: "Acquires distributed locks via Redis Protocol over TLS."
  - source: "Conflict Detection Engine"
    destination: "PostgreSQL Database"
    description: "Persists confirmed appointments via PostgreSQL wire protocol using TLS and AES-256."
  - source: "Conflict Detection Engine"
    destination: "Apache Kafka"
    description: "Publishes AppointmentScheduled events via Kafka Protocol over TLS."
  - source: "Notification Dispatcher"
    destination: "SMS / Notification Gateway"
    description: "Sends appointment reminders via HTTPS/REST."