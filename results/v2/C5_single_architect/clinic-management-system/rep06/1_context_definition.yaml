level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A distributed clinical IT platform managing patient admissions, EMRs, scheduling, and billing while ensuring HIPAA/GDPR compliance, 99.99% uptime, and interoperability across hybrid cloud environments."
elements:
  - type: "person"
    name: "Patient / User"
    description: "Internal actor accessing the portal and managing personal medical and billing details."
  - type: "person"
    name: "Clinician / Staff"
    description: "Internal actor accessing EMRs, scheduling, and clinical workflows via the system."
  - type: "person"
    name: "Hospital Administrator"
    description: "Internal actor managing administrative tasks, billing, and system operations."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing diagnostic results and imaging data to the CMS."
  - type: "externalSystem"
    name: "Insurance Payment Gateways"
    description: "Third-party financial processors handling insurance claims and payments."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system enforcing multi-factor authentication and user identity management."
  - type: "externalSystem"
    name: "SMS / Notification Gateway"
    description: "External service delivering alerts, notifications, and MFA codes."
  - type: "externalSystem"
    name: "Regulatory Compliance / Auditing Authority"
    description: "External entity receiving statutory reports and auditing data."
relationships:
  - source: "Patient / User"
    destination: "Clinic Management System"
    description: "Accesses portal, EMR, and billing"
    technology: "HTTPS (TLS 1.3)"
  - source: "Clinician / Staff"
    destination: "Clinic Management System"
    description: "Accesses portal, EMR, and clinical workflows"
    technology: "HTTPS (TLS 1.3)"
  - source: "Hospital Administrator"
    destination: "Clinic Management System"
    description: "Accesses administrative and billing functions"
    technology: "HTTPS (TLS 1.3)"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges medical data and diagnostics"
    technology: "HL7 FHIR (REST/JSON over mTLS)"
  - source: "Clinic Management System"
    destination: "Insurance Payment Gateways"
    description: "Submits insurance claims"
    technology: "HTTPS/REST"
  - source: "Clinic Management System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users and enforces MFA"
    technology: "OIDC/SAML 2.0"
  - source: "Clinic Management System"
    destination: "SMS / Notification Gateway"
    description: "Sends alerts and notifications"
    technology: "SMPP / HTTPS REST"
  - source: "Clinic Management System"
    destination: "Regulatory Compliance / Auditing Authority"
    description: "Performs secure batch export for compliance"
    technology: "SFTP/HTTPS"