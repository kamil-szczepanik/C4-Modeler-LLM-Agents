level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patient / User"
    description: "Internal actor accessing the portal and managing personal medical and billing details."
  - type: "person"
    name: "Clinician / Staff"
    description: "Internal actor accessing EMRs, scheduling, and clinical workflows via the system."
  - type: "person"
    name: "Hospital Administrator"
    description: "Internal actor managing administrative tasks, billing, and system operations."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems providing diagnostic results and imaging data to the CMS."
  - type: "externalSystem"
    name: "Insurance Payment Gateways"
    description: "Third-party financial processors handling insurance claims and payments."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system enforcing multi-factor authentication and user identity management."
  - type: "externalSystem"
    name: "SMS / Notification Gateway"
    description: "External service delivering alerts, notifications, and MFA codes."
  - type: "externalSystem"
    name: "Regulatory Compliance / Auditing Authority"
    description: "External entity receiving statutory reports and auditing data."
  - type: "container"
    name: "API Gateway"
    technology: "NGINX / Envoy"
    description: "Handling TLS termination, rate limiting, and JWT validation."
  - type: "container"
    name: "Web Application"
    technology: "React / TypeScript"
    description: "Single Page Application served via NGINX for user interfaces."
  - type: "container"
    name: "Core Clinic Service"
    technology: "Java / Spring Boot"
    description: "Managing patient registration and EMR audit trails."
  - type: "container"
    name: "Scheduling Service"
    technology: "Go"
    description: "Handling appointment scheduling and resource clash checks."
  - type: "container"
    name: "Billing Service"
    technology: "Node.js"
    description: "Managing billing and insurance claim submissions."
  - type: "container"
    name: "Integration Service"
    technology: "Apache Camel / Spring Integration"
    description: "Handling HL7 FHIR translations."
  - type: "container"
    name: "Event Broker"
    technology: "Apache Kafka / RabbitMQ"
    description: "For asynchronous domain events."
  - type: "container"
    name: "PostgreSQL Database"
    technology: "PostgreSQL with AES-256"
    description: "Transactional data store with AES-256 encryption at rest."
  - type: "container"
    name: "Redis Cache"
    technology: "Redis"
    description: "Used for scheduling locks and high-speed caching."
relationships:
  - source: "Patient / User"
    destination: "Web Application"
    description: "Accesses portal and medical details"
    technology: "HTTPS"
  - source: "Clinician / Staff"
    destination: "Web Application"
    description: "Accesses EMRs and clinical workflows"
    technology: "HTTPS"
  - source: "Hospital Administrator"
    destination: "Web Application"
    description: "Accesses administrative and billing functions"
    technology: "HTTPS"
  - source: "Web Application"
    destination: "API Gateway"
    description: "Sends web traffic and API requests"
    technology: "HTTPS / WSS"
  - source: "API Gateway"
    destination: "Core Clinic Service"
    description: "Routes requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Scheduling Service"
    description: "Routes requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Billing Service"
    description: "Routes requests"
    technology: "gRPC over mTLS"
  - source: "API Gateway"
    destination: "Integration Service"
    description: "Routes requests"
    technology: "gRPC over mTLS"
  - source: "Core Clinic Service"
    destination: "Event Broker"
    description: "Publishes asynchronous domain events"
    technology: "AMQP / Kafka protocol"
  - source: "Billing Service"
    destination: "Event Broker"
    description: "Publishes asynchronous domain events"
    technology: "AMQP / Kafka protocol"
  - source: "Integration Service"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges medical data and diagnostics"
    technology: "HL7 FHIR over HTTPS"
  - source: "Billing Service"
    destination: "Insurance Payment Gateways"
    description: "Submits insurance claims"
    technology: "HTTPS"
  - source: "Core Clinic Service"
    destination: "PostgreSQL Database"
    description: "Reads and writes transactional data"
    technology: "JDBC / SQL"
  - source: "Scheduling Service"
    destination: "Redis Cache"
    description: "Manages scheduling locks"
    technology: "Redis Protocol"
  - source: "Billing Service"
    destination: "PostgreSQL Database"
    description: "Reads and writes billing data"
    technology: "SQL"