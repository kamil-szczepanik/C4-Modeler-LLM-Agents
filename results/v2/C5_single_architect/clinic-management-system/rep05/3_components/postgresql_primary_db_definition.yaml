level: component
scope: "Component diagram for the PostgreSQL Primary DB container"
parentContainer:
  name: "PostgreSQL Primary DB"
elements:
  - type: "component"
    name: "Relational Storage Engine"
    technology: "PostgreSQL 15+ with Citus"
    description: "Core relational storage engine with horizontal scaling capabilities."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Connection pooler for handling high-volume client traffic."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "pgAudit"
    description: "Extension for comprehensive DDL/DML auditing to satisfy HIPAA/GDPR."
  - type: "component"
    name: "Backup & Archival Daemon"
    technology: "Barman"
    description: "Backup and recovery daemon for continuous WAL archiving."
relationships:
  - source: "Connection Pooler"
    destination: "Relational Storage Engine"
    description: "Pooled connections via TCP/IP."
  - source: "Relational Storage Engine"
    destination: "Backup & Archival Daemon"
    description: "WAL streaming over TLS."