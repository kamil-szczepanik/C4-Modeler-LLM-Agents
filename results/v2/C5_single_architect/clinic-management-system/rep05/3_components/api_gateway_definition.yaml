level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "TLS Termination & Routing Proxy"
    technology: "Kong / Nginx"
    description: "Handles incoming HTTPS traffic, performs TLS termination, and routes requests to appropriate backend services."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Kong / Nginx Security Filter / OAuth2/OIDC"
    description: "Validates OAuth2/OIDC tokens by communicating with the Enterprise Identity Provider."
  - type: "component"
    name: "Rate Limiting & Threat Protection Module"
    technology: "Kong / Nginx Module"
    description: "Protects the system by enforcing rate limits and mitigating security threats."
  - type: "component"
    name: "FHIR Protocol & Audit Translation Filter"
    technology: "Kong / Nginx Custom Filter"
    description: "Translates and processes HL7 FHIR APIs for external interoperability and audit logging."
relationships:
  - source: "TLS Termination & Routing Proxy"
    destination: "Authentication & Authorization Filter"
    description: "Passes incoming requests for token validation"
  - source: "Authentication & Authorization Filter"
    destination: "Rate Limiting & Threat Protection Module"
    description: "Forwards authenticated requests for traffic management"
  - source: "Rate Limiting & Threat Protection Module"
    destination: "FHIR Protocol & Audit Translation Filter"
    description: "Routes valid requests for protocol translation or internal routing"