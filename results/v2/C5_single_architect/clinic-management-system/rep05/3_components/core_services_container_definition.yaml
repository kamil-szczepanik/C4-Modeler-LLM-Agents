level: component
scope: "Component diagram for the Core Services Container container"
parentContainer:
  name: "Core Services Container"
elements:
  - type: "component"
    name: "Patient Management Component"
    technology: "Spring MVC / Data"
    description: "Manages patient admissions and records within the Core Services Container."
  - type: "component"
    name: "Scheduling Engine Component"
    technology: "Spring Service"
    description: "Manages clinical scheduling and operations."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Spring Cloud Stream / Kafka"
    description: "Publishes domain events asynchronously."
  - type: "component"
    name: "FHIR Interoperability Component"
    technology: "Spring WebFlux"
    description: "Handles interoperability via reactive HL7 FHIR APIs."
  - type: "component"
    name: "Security & Audit Interceptor Component"
    technology: "Spring AOP / Security"
    description: "Provides centralized access control and streams audit trails."
  - type: "container"
    name: "API Gateway"
    technology: "Reverse Proxy / Gateway"
    description: "Routes internal and external requests to appropriate components."
  - type: "container"
    name: "PostgreSQL Primary DB"
    technology: "PostgreSQL"
    description: "Stores primary relational data securely."
  - type: "container"
    name: "Async Message Broker"
    technology: "Apache Kafka"
    description: "Handles reliable asynchronous event-driven messaging."
  - type: "container"
    name: "EMR & Audit Service"
    technology: "External Service"
    description: "Receives audit trails and clinical records."
relationships:
  - source: "API Gateway"
    destination: "Patient Management Component"
    description: "Routes internal requests [gRPC over TLS]"
  - source: "API Gateway"
    destination: "Scheduling Engine Component"
    description: "Routes internal requests [gRPC over TLS]"
  - source: "API Gateway"
    destination: "FHIR Interoperability Component"
    description: "Routes external requests [REST/HTTPS]"
  - source: "Patient Management Component"
    destination: "PostgreSQL Primary DB"
    description: "Reads and writes data [JDBC over TLS]"
  - source: "Scheduling Engine Component"
    destination: "PostgreSQL Primary DB"
    description: "Reads and writes data [JDBC over TLS]"
  - source: "Event Publisher Component"
    destination: "Async Message Broker"
    description: "Publishes domain events [Kafka Protocol]"
  - source: "Security & Audit Interceptor Component"
    destination: "EMR & Audit Service"
    description: "Streams audit trails [Kafka Protocol]"