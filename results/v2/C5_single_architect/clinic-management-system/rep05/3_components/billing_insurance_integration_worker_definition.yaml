level: component
scope: "Component diagram for the Billing & Insurance Integration Worker container"
parentContainer:
  name: "Billing & Insurance Integration Worker"
elements:
  - type: "component"
    name: "Claim Consumer Component"
    technology: "Node.js with KafkaJS"
    description: "Consumes claims events from the async message broker."
  - type: "component"
    name: "Claim Transformation Component"
    technology: "TypeScript"
    description: "Transforms raw payload into formatted claims."
  - type: "component"
    name: "Clearinghouse Adapter Component"
    technology: "Axios with Opossum circuit breaker"
    description: "Submits encrypted claims to the payment gateway or insurance clearinghouse."
  - type: "component"
    name: "Audit & Reconciliation Logger Component"
    technology: "Node.js / SQL with TLS"
    description: "Emits audit logs from integration operations."
relationships:
  - source: "Claim Consumer Component"
    destination: "Claim Transformation Component"
    description: "Passes raw payload [In-memory]"
  - source: "Claim Transformation Component"
    destination: "Clearinghouse Adapter Component"
    description: "Passes formatted claim [HTTPS]"
  - source: "Clearinghouse Adapter Component"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Submits encrypted claims [HTTPS / REST, TLS 1.3]"
  - source: "Claim Consumer Component"
    destination: "Audit & Reconciliation Logger Component"
    description: "Emits audit logs [SQL / TLS]"
  - source: "Claim Transformation Component"
    destination: "Audit & Reconciliation Logger Component"
    description: "Emits audit logs [SQL / TLS]"
  - source: "Clearinghouse Adapter Component"
    destination: "Audit & Reconciliation Logger Component"
    description: "Emits audit logs [SQL / TLS]"
  - source: "Async Message Broker"
    destination: "Claim Consumer Component"
    description: "Consumes claims events [AMQP / Kafka]"