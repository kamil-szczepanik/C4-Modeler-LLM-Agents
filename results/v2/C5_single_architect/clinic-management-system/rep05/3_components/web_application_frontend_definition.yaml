level: component
scope: "Component diagram for the Web Application Frontend container"
parentContainer:
  name: "Web Application Frontend"
elements:
  - type: "component"
    name: "Authentication & Session Manager"
    technology: "React / TypeScript, OAuth2/OIDC"
    description: "Manages user authentication, session state, and coordinates MFA redirect flows."
  - type: "component"
    name: "EMR View Controller"
    technology: "React / TypeScript, TanStack Table"
    description: "Handles electronic medical records display and clinical data interactions."
  - type: "component"
    name: "Scheduling Calendar Module"
    technology: "React / TypeScript, FullCalendar"
    description: "Provides scheduling calendar capabilities for doctors, nurses, and receptionists."
  - type: "component"
    name: "Billing & Claims Dashboard"
    technology: "React / TypeScript"
    description: "Manages billing operations and claims tracking for billing specialists."
  - type: "component"
    name: "Audit Logging Middleware"
    technology: "React / TypeScript, HTTPS"
    description: "Captures and sends audit telemetry for user actions to the backend."
relationships:
  - source: "Authentication & Session Manager"
    destination: "Enterprise Identity Provider"
    description: "Coordinates OAuth2/OIDC redirect flows for MFA via [HTTPS]"
  - source: "Web Application Frontend"
    destination: "API Gateway"
    description: "Sends centralized REST/GraphQL requests and audit telemetry via [HTTPS]"