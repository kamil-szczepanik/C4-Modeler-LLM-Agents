# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the WORM-compliant storage container"
parentContainer:
  name: "WORM-compliant storage"
elements:
  # Components within the parent container's boundary
  - type: "component"
    name: "Ingestion & Validation Engine"
    technology: "Java / Node.js"
    description: "Ingests and validates incoming audit logs and clinical data records before WORM storage."
  - type: "component"
    name: "Object Lock Manager"
    technology: "Java Service"
    description: "Enforces 10-year retention policies and WORM compliance rules on stored objects."
  - type: "component"
    name: "Encryption & Key Service"
    technology: "PKCS#11 / AWS KMS API"
    description: "Handles AES-256 encryption and key management using Enterprise HSM and AWS KMS."
  - type: "component"
    name: "MinIO (On-Prem)"
    technology: "MinIO Object Storage"
    description: "Provides on-premise object storage with S3 API compatibility and Object Lock."
  - type: "component"
    name: "AWS S3 (Cloud)"
    technology: "AWS S3 with Object Lock"
    description: "Provides cloud-based object storage supporting WORM compliance and high availability."
relationships:
  - source: "Ingestion & Validation Engine"
    destination: "Object Lock Manager"
    description: "Passes validated records for retention locking"
  - source: "Object Lock Manager"
    destination: "Encryption & Key Service"
    description: "Requests encryption for stored objects"
  - source: "Object Lock Manager"
    destination: "MinIO (On-Prem)"
    description: "Stores locked objects on-premise via S3 API over TLS 1.3"
  - source: "Object Lock Manager"
    destination: "AWS S3 (Cloud)"
    description: "Stores locked objects in the cloud via S3 API over TLS 1.3"
  - source: "Encryption & Key Service"
    destination: "MinIO (On-Prem)"
    description: "Applies AES-256 encryption keys"
  - source: "Encryption & Key Service"
    destination: "AWS S3 (Cloud)"
    description: "Applies AES-256 encryption keys"