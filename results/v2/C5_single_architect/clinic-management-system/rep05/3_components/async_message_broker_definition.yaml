level: component
scope: "Component diagram for the Async Message Broker container"
parentContainer:
  name: "Async Message Broker"
elements:
  - type: "component"
    name: "Event Ingestion & Routing Engine"
    technology: "Apache Kafka"
    description: "Handles incoming domain events and routes them to appropriate topics."
  - type: "component"
    name: "Schema Registry"
    technology: "Kafka Schema Registry"
    description: "Manages and validates event schemas to ensure data consistency."
  - type: "component"
    name: "Consumer Offset Manager"
    technology: "Apache Kafka"
    description: "Tracks message consumption progress for consumers."
  - type: "component"
    name: "Access Control & Audit Interceptor"
    technology: "Kafka ACLs / Java"
    description: "Persists broker audit logs and ACL metadata while enforcing security policies."
  - type: "component"
    name: "Replication & Mirroring Agent (MirrorMaker 2)"
    technology: "Kafka MirrorMaker 2"
    description: "Handles cross-region replication and mirroring of event streams."
relationships:
  - source: "Access Control & Audit Interceptor"
    destination: "PostgreSQL Primary DB"
    description: "Persists broker audit logs and ACL metadata [JDBC / TLS]"