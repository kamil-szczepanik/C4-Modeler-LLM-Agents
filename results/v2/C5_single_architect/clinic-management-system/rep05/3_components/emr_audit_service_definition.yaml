level: component
scope: "Component diagram for the EMR & Audit Service container"
parentContainer:
  name: "EMR & Audit Service"
elements:
  - type: "component"
    name: "EMR Management Controller / Service"
    technology: "Java Spring Boot"
    description: "Handles clinical data and core EMR management operations."
  - type: "component"
    name: "HL7 FHIR Interoperability Adapter"
    technology: "HAPI FHIR library"
    description: "Exchanges test results and handles healthcare data interoperability."
  - type: "component"
    name: "Audit Trail Interceptor"
    technology: "Spring AOP"
    description: "Provides transparent, non-invasive audit logging for compliance."
  - type: "component"
    name: "WORM Storage Exporter"
    technology: "Async Java worker"
    description: "Archives immutable logs asynchronously to WORM storage."
  - type: "component"
    name: "EMR Cache Layer"
    technology: "Redis"
    description: "In-memory distributed cache for rapid read performance."
relationships:
  - source: "API Gateway"
    destination: "EMR Management Controller / Service"
    description: "Routes EMR requests [Internal gRPC/REST over TLS 1.3]"
  - source: "EMR Management Controller / Service"
    destination: "EMR Cache Layer"
    description: "Reads patient records [Redis Protocol over TLS]"
  - source: "EMR Management Controller / Service"
    destination: "PostgreSQL Primary DB"
    description: "Reads/writes clinical data [JDBC / TLS 1.3]"
  - source: "Audit Trail Interceptor"
    destination: "Async Message Broker"
    description: "Publishes audit events [Apache Kafka]"
  - source: "HL7 FHIR Interoperability Adapter"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges test results [HL7 FHIR APIs]"
  - source: "WORM Storage Exporter"
    destination: "WORM-compliant storage"
    description: "Archives immutable logs [HTTPS / S3 Object Lock API]"