# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Doctors"
    description: "Medical professionals who manage patient admissions, electronic medical records, and clinical workflows."
  - type: "person"
    name: "Nurses"
    description: "Healthcare staff who assist with patient care, scheduling, and updating medical records."
  - type: "person"
    name: "Receptionists"
    description: "Administrative staff who handle patient scheduling, front-desk admissions, and initial registration."
  - type: "person"
    name: "Billing Specialists"
    description: "Financial staff who manage patient billing, payments, and insurance claims."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "Third-party clinical systems providing laboratory and imaging data."
  - type: "externalSystem"
    name: "Payment Gateway / Insurance Clearinghouse"
    description: "External financial processors handling claims and billing payments."
  - type: "externalSystem"
    name: "Enterprise Identity Provider"
    description: "Handles multi-factor authentication and single sign-on via OAuth2/OIDC."
  - type: "externalSystem"
    name: "Third-Party Notification Service"
    description: "Manages patient SMS and email reminders."
  - type: "container"
    name: "Web Application Frontend"
    technology: "React / TypeScript, served via CDN/Nginx"
    description: "Delivers sub-second UI performance for users accessing the clinic platform."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / Nginx"
    description: "Handles TLS termination, multi-factor access enforcement, and routes incoming traffic."
  - type: "container"
    name: "Core Services Container"
    technology: "Node.js / Java Spring Boot"
    description: "Executes modular microservices for clinical operations, scheduling, and publishes events."
  - type: "container"
    name: "EMR & Audit Service"
    technology: "Java Spring Boot"
    description: "Manages electronic medical records and audit trails, ensuring HIPAA and GDPR compliance."
  - type: "container"
    name: "Billing & Insurance Integration Worker"
    technology: "Node.js / Java"
    description: "Consumes messages from the message broker to transmit claims to payment gateways."
  - type: "container"
    name: "Async Message Broker"
    technology: "Apache Kafka / RabbitMQ"
    description: "Provides decoupled, resilient asynchronous messaging between microservices."
  - type: "container"
    name: "PostgreSQL Primary DB"
    technology: "PostgreSQL with multi-region active-active setup and AES-256 encryption"
    description: "Primary relational database for transactional data storage."
  - type: "container"
    name: "WORM-compliant storage"
    technology: "WORM-compliant storage"
    description: "Secure archive store to meet the 10-year data retention mandate and compliance requirements."
relationships:
  - source: "Doctors"
    destination: "Web Application Frontend"
    description: "Accesses clinical operations and EMR"
    technology: "HTTPS"
  - source: "Nurses"
    destination: "Web Application Frontend"
    description: "Accesses patient admissions and records"
    technology: "HTTPS"
  - source: "Receptionists"
    destination: "Web Application Frontend"
    description: "Handles patient scheduling and admissions"
    technology: "HTTPS"
  - source: "Billing Specialists"
    destination: "Web Application Frontend"
    description: "Manages patient billing and claims"
    technology: "HTTPS"
  - source: "Web Application Frontend"
    destination: "API Gateway"
    description: "Calls API endpoints via HTTPS"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Enterprise Identity Provider"
    description: "Enforces OAuth2/OIDC authentication"
    technology: "OAuth2/OIDC over HTTPS"
  - source: "API Gateway"
    destination: "Core Services Container"
    description: "Routes requests"
    technology: "Internal gRPC/REST"
  - source: "API Gateway"
    destination: "EMR & Audit Service"
    description: "Routes EMR requests"
    technology: "Internal gRPC/REST"
  - source: "EMR & Audit Service"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical data and test results"
    technology: "HL7 FHIR APIs"
  - source: "Core Services Container"
    destination: "Async Message Broker"
    description: "Publishes domain events"
    technology: "AMQP / Kafka protocol"
  - source: "Billing & Insurance Integration Worker"
    destination: "Async Message Broker"
    description: "Consumes claims events"
    technology: "AMQP / Kafka protocol"
  - source: "Billing & Insurance Integration Worker"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Transmits claims and billing data"
    technology: "HTTPS/REST"
  - source: "Core Services Container"
    destination: "PostgreSQL Primary DB"
    description: "Reads and writes transactional data"
    technology: "SQL over TLS"
  - source: "EMR & Audit Service"
    destination: "WORM-compliant storage"
    description: "Stores audit logs and archived records"
    technology: "Secure Storage Protocol"