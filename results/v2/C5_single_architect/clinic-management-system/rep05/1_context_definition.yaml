level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform designed to manage patient admissions, electronic medical records, scheduling, and billing for healthcare facilities while ensuring HIPAA and GDPR compliance."
elements:
  - type: "person"
    name: "Doctors"
    description: "Medical professionals who manage patient admissions, electronic medical records, and clinical workflows."
  - type: "person"
    name: "Nurses"
    description: "Healthcare staff who assist with patient care, scheduling, and updating medical records."
  - type: "person"
    name: "Receptionists"
    description: "Administrative staff who handle patient scheduling, front-desk admissions, and initial registration."
  - type: "person"
    name: "Billing Specialists"
    description: "Financial staff who manage patient billing, payments, and insurance claims."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "Third-party clinical systems providing laboratory and imaging data."
  - type: "externalSystem"
    name: "Payment Gateway / Insurance Clearinghouse"
    description: "External financial processors handling claims and billing payments."
  - type: "externalSystem"
    name: "Enterprise Identity Provider"
    description: "Handles multi-factor authentication and single sign-on via OAuth2/OIDC."
  - type: "externalSystem"
    name: "Third-Party Notification Service"
    description: "Manages patient SMS and email reminders."
relationships:
  - source: "Doctors"
    destination: "Clinic Management System"
    description: "Accesses admissions, EMR, and scheduling"
    technology: "HTTPS with mandatory multi-factor authentication"
  - source: "Nurses"
    destination: "Clinic Management System"
    description: "Accesses patient records and scheduling"
    technology: "HTTPS with mandatory multi-factor authentication"
  - source: "Receptionists"
    destination: "Clinic Management System"
    description: "Manages patient admissions and scheduling"
    technology: "HTTPS with mandatory multi-factor authentication"
  - source: "Billing Specialists"
    destination: "Clinic Management System"
    description: "Processes patient billing and financials"
    technology: "HTTPS with mandatory multi-factor authentication"
  - source: "Clinic Management System"
    destination: "Enterprise Identity Provider"
    description: "Authenticates users and manages identity"
    technology: "OpenID Connect over HTTPS"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges clinical data and test results"
    technology: "HL7 FHIR APIs over TLS/REST"
  - source: "Clinic Management System"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Processes claims and billing transactions"
    technology: "HTTPS/REST"
  - source: "Clinic Management System"
    destination: "Third-Party Notification Service"
    description: "Sends patient SMS and email alerts"
    technology: "HTTPS/REST"