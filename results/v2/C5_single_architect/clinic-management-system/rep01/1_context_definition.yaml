# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid clinical IT platform that manages patient admissions, EMRs, scheduling, and billing, ensuring HIPAA/GDPR compliance, 99.99% uptime, and interoperability for medium-sized hospitals and clinics."
elements:
  - type: "person"
    name: "Patients"
    description: "End-users accessing the Web/Mobile Portal for registration and appointments."
  - type: "person"
    name: "Medical Staff"
    description: "Doctors, nurses, and receptionists managing EMRs, scheduling, and billing."
  - type: "externalSystem"
    name: "External IdP"
    description: "Azure AD / Okta handling Multi-Factor Authentication."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service processing patient billing and credit cards."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "Third-party medical systems communicating via HL7 FHIR APIs."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Twilio/SendGrid gateway for SMS/Email reminders."
relationships:
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Interact with via Web/Mobile UI"
    technology: "HTTPS/REST"
  - source: "Medical Staff"
    destination: "Clinic Management System"
    description: "Manage clinical and billing workflows"
    technology: "HTTPS/REST"
  - source: "Clinic Management System"
    destination: "External IdP"
    description: "Authenticates users"
    technology: "OIDC/SAML 2.0"
  - source: "Clinic Management System"
    destination: "Payment Gateway"
    description: "Processes payments"
    technology: "HTTPS/REST"
  - source: "Clinic Management System"
    destination: "Lab & Imaging Systems"
    description: "Exchanges clinical data"
    technology: "HL7 FHIR REST APIs"
  - source: "Clinic Management System"
    destination: "Notification Service"
    description: "Dispatches alerts and reminders"
    technology: "HTTPS/REST"