level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "PostgreSQL Container"
    technology: "PostgreSQL"
    description: "Primary relational data store providing robust ACID compliance and data integrity."
  - type: "component"
    name: "PgBouncer"
    technology: "PgBouncer"
    description: "Connection pooler for handling microservice traffic spikes and sustaining sub-second P95 EMR load performance."
  - type: "component"
    name: "Patroni & etcd"
    technology: "Patroni / etcd"
    description: "Replication manager for automated failover, health checks, and guaranteeing 99.99% high availability."
  - type: "component"
    name: "Barman"
    technology: "Barman"
    description: "Backup manager for point-in-time recovery, encrypted archival backups, and satisfying 10+ year data retention."
  - type: "component"
    name: "Security Modules"
    technology: "pgcrypto & pgaudit"
    description: "Provides AES-256 encryption at rest and comprehensive HIPAA/GDPR audit logging trails."
relationships:
  - source: "PgBouncer"
    destination: "PostgreSQL Container"
    description: "Routed database queries via [TCP/SQL]"
  - source: "PostgreSQL Container"
    destination: "Patroni & etcd"
    description: "Health checks and replication state via [TCP]"
  - source: "PostgreSQL Container"
    destination: "Barman"
    description: "Encrypted archival backups via [TCP/SSH]"