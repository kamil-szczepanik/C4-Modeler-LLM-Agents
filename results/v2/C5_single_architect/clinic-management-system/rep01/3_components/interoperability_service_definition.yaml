level: component
scope: "Component diagram for the Interoperability Service container"
parentContainer:
  name: "Interoperability Service"
elements:
  - type: "component"
    name: "Kafka Event Consumer Component"
    technology: "Apache Camel kafka module"
    description: "Consumes and routes domain events from the messaging backbone."
  - type: "component"
    name: "Data Transformer Component"
    technology: "Camel-fhir and Jackson"
    description: "Transforms domain events into standardized HL7 FHIR payloads."
  - type: "component"
    name: "FHIR Outbound Connector Component"
    technology: "HTTPS/REST client with mTLS"
    description: "Pushes HL7 FHIR payloads to external medical systems."
  - type: "component"
    name: "Dead Letter Channel Component"
    technology: "Retry routing queue"
    description: "Handles failed message routing and retry mechanisms."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Asynchronous compliance logger"
    description: "Sends and records audit event payloads for compliance."
  - type: "component"
    name: "Circuit Breaker Component"
    technology: "Resilience4j wrapper"
    description: "Guards outbound calls to prevent cascading failures."
  - type: "component"
    name: "Lab & Imaging Systems"
    technology: "HTTPS/REST + mTLS & OAuth2"
    description: "External medical systems receiving standardized HL7 FHIR payloads."
relationships:
  - source: "Kafka Event Consumer Component"
    destination: "Data Transformer Component"
    description: "Consumes and routes domain events [Direct Protocol]"
  - source: "Data Transformer Component"
    destination: "Audit Logger Component"
    description: "Sends audit event payload [Direct Protocol]"
  - source: "Data Transformer Component"
    destination: "FHIR Outbound Connector Component"
    description: "Enriched FHIR payload [Direct Protocol]"
  - source: "FHIR Outbound Connector Component"
    destination: "Circuit Breaker Component"
    description: "Guards outbound calls [Resilience4j / Direct Protocol]"
  - source: "FHIR Outbound Connector Component"
    destination: "Lab & Imaging Systems"
    description: "Pushes HL7 FHIR payloads [HTTPS/REST + mTLS & OAuth2]"