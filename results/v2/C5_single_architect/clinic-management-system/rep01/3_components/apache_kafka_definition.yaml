# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Apache Kafka container"
parentContainer:
  name: "Apache Kafka"
elements:
  - type: "component"
    name: "Kafka Broker"
    technology: "Apache Kafka"
    description: "Provides the core event-driven messaging backbone for publishing and consuming domain events over TCP using mutual TLS (mTLS)."
  - type: "component"
    name: "KRaft Controller Quorum"
    technology: "KRaft"
    description: "Manages metadata and consensus for the Kafka cluster, eliminating ZooKeeper overhead for low latency and high availability."
  - type: "component"
    name: "Kafka Connect"
    technology: "Kafka Connect"
    description: "Handles integration and data streaming between Kafka and external data stores or systems."
  - type: "component"
    name: "Schema Registry"
    technology: "Confluent Schema Registry"
    description: "Validates event schemas on produce via HTTP/REST over TLS."
  - type: "component"
    name: "Kafka Tiered Storage"
    technology: "Apache Kafka Tiered Storage"
    description: "Archives historical segments to S3-compatible object storage using S3 API over TLS to support long-term data retention."
relationships:
  - source: "Kafka Broker"
    destination: "Schema Registry"
    description: "Validates event schemas on produce via HTTP/REST over TLS."
  - source: "Kafka Broker"
    destination: "Kafka Tiered Storage"
    description: "Archives historical segments to object storage using S3 API over TLS."