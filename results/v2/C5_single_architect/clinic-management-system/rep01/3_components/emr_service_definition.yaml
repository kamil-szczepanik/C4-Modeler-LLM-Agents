level: component
scope: "Component diagram for the EMR Service container"
parentContainer:
  name: "EMR Service"
elements:
  - type: "component"
    name: "EMR Controller"
    technology: "Spring MVC / Spring WebFlux"
    description: "Handles incoming HTTP/gRPC requests and routes them to business logic."
  - type: "component"
    name: "Clinical Record Manager"
    technology: "Spring Service / DDD"
    description: "Manages core clinical record business logic and domain rules."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Spring AOP / SLF4J"
    description: "Isolates compliance and audit logging without cluttering core domain logic."
  - type: "component"
    name: "EMR Data Access Repository"
    technology: "Spring Data JPA / Hibernate"
    description: "Persists and retrieves records from the underlying database."
  - type: "component"
    name: "Clinical Cache Component"
    technology: "Spring Cache / Redis Client"
    description: "Checks and updates cached data to deliver fast EMR screen loads."
relationships:
  - source: "EMR Controller"
    destination: "Clinical Record Manager"
    description: "Invokes business logic [Java Method Calls]"
  - source: "Clinical Record Manager"
    destination: "Audit Logger Component"
    description: "Dispatches audit events [Internal Event]"
  - source: "Clinical Record Manager"
    destination: "EMR Data Access Repository"
    description: "Persists records [JDBC / SQL via TLS]"
  - source: "Clinical Record Manager"
    destination: "Clinical Cache Component"
    description: "Checks/updates cache [Lettuce / In-memory]"