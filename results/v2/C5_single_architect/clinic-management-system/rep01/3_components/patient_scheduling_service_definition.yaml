level: component
scope: "Component diagram for the Patient & Scheduling Service container"
parentContainer:
  name: "Patient & Scheduling Service"
elements:
  - type: "component"
    name: "PatientController"
    technology: "REST/gRPC (Java/Spring Boot)"
    description: "REST/gRPC endpoint handler for incoming API Gateway requests."
  - type: "component"
    name: "SchedulingEngine"
    technology: "Java/Spring Boot Domain Component"
    description: "Domain component executing appointment booking and resource clash checks."
  - type: "component"
    name: "PatientRepository"
    technology: "Spring Data JPA/JDBC"
    description: "Data access component using Spring Data JPA/JDBC."
  - type: "component"
    name: "CacheManager"
    technology: "Redis Protocol"
    description: "Component interacting with Redis for schedule and availability caching."
  - type: "component"
    name: "AuditLogger"
    technology: "Spring AOP"
    description: "Spring AOP component generating immutable, cryptographically signed audit logs."
  - type: "component"
    name: "KafkaEventPublisher"
    technology: "Transactional Outbox Pattern"
    description: "Component using the transactional outbox pattern to emit events."
relationships:
  - source: "API Gateway / BFF"
    destination: "PatientController"
    description: "Routes internal requests [gRPC]"
  - source: "PatientController"
    destination: "AuditLogger"
    description: "Intercepts calls for auditing [In-process / Aspect]"
  - source: "SchedulingEngine"
    destination: "AuditLogger"
    description: "Intercepts calls for auditing [In-process / Aspect]"
  - source: "SchedulingEngine"
    destination: "PatientRepository"
    description: "Persists data [JDBC/SQL]"
  - source: "SchedulingEngine"
    destination: "CacheManager"
    description: "Retrieves cached slots [Redis Protocol]"
  - source: "KafkaEventPublisher"
    destination: "Apache Kafka"
    description: "Publishes domain events [Kafka Protocol / TCP]"