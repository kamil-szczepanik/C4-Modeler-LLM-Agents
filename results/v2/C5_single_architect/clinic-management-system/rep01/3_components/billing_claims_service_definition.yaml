level: component
scope: "Component diagram for the Billing & Claims Service container"
parentContainer:
  name: "Billing & Claims Service"
elements:
  - type: "component"
    name: "Claims Processor Component"
    technology: ".NET Core / C#"
    description: "Managing adjudication and clearinghouse formatting."
  - type: "component"
    name: "Payment Integration Component"
    technology: ".NET Core / C#"
    description: "Handling secure tokenization and payment processing."
  - type: "component"
    name: "Billing API Facade Component"
    technology: "ASP.NET Web API"
    description: "Exposing endpoints and handling event publication."
  - type: "component"
    name: "Financial Audit & Archive Component"
    technology: ".NET Core / C#"
    description: "Managing immutable, encrypted audit logs."
relationships:
  - source: "Billing API Facade Component"
    destination: "Apache Kafka"
    description: "Publishes domain events like ClaimSubmitted [TLS / Kafka Protocol]"
  - source: "Claims Processor Component"
    destination: "PostgreSQL"
    description: "Reads and writes transactional ledger data [TCP/SQL]"
  - source: "Payment Integration Component"
    destination: "Payment Gateway"
    description: "Processes secure financial transactions [HTTPS / REST]"
  - source: "Financial Audit & Archive Component"
    destination: "Apache Kafka"
    description: "Consumes domain events for audit logging [TLS]"