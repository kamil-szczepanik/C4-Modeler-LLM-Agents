level: component
scope: "Component diagram for the API Gateway / BFF container"
parentContainer:
  name: "API Gateway / BFF"
elements:
  - type: "component"
    name: "Ingress Router"
    technology: "Kong"
    description: "Accesses portal and workflows via HTTPS/JSON with MFA."
  - type: "component"
    name: "Auth Enforcement Filter"
    technology: "Plugin Hook"
    description: "Validates tokens and enforces security."
  - type: "component"
    name: "Patient BFF"
    technology: "Node.js / Express"
    description: "Handles persona-specific orchestration for patients."
  - type: "component"
    name: "Staff BFF"
    technology: "Node.js / Express"
    description: "Handles persona-specific orchestration for medical staff."
  - type: "component"
    name: "Audit & Compliance Interceptor"
    technology: "Interceptor Service"
    description: "Intercepts requests to publish audit logs for HIPAA and GDPR compliance."
relationships:
  - source: "Ingress Router"
    destination: "Auth Enforcement Filter"
    description: "Validates tokens [Plugin Hook]"
  - source: "Auth Enforcement Filter"
    destination: "Patient BFF"
    description: "Forwards session context [HTTP/JSON]"
  - source: "Auth Enforcement Filter"
    destination: "Staff BFF"
    description: "Forwards session context [HTTP/JSON]"
  - source: "Patient BFF"
    destination: "Audit & Compliance Interceptor"
    description: "Intercepts requests [Async Event / Function Hook]"
  - source: "Staff BFF"
    destination: "Audit & Compliance Interceptor"
    description: "Intercepts requests [Async Event / Function Hook]"