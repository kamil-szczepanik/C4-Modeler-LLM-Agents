level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients"
    description: "End-users accessing the Web/Mobile Portal for registration and appointments."
  - type: "person"
    name: "Medical Staff"
    description: "Doctors, nurses, and receptionists managing EMRs, scheduling, and billing."
  - type: "externalSystem"
    name: "External IdP"
    description: "Azure AD / Okta handling Multi-Factor Authentication."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service processing patient billing and credit cards."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "Third-party medical systems communicating via HL7 FHIR APIs."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Twilio/SendGrid gateway for SMS/Email reminders."
  - type: "container"
    name: "API Gateway / BFF"
    technology: "Kong / Node.js"
    description: "API Gateway for ingress, rate limiting, and routing."
  - type: "container"
    name: "Patient & Scheduling Service"
    technology: "Spring Boot / Java"
    description: "Core backend service for patient scheduling and business logic."
  - type: "container"
    name: "EMR Service"
    technology: "Spring Boot / Java"
    description: "Electronic Medical Records service ensuring robust clinical data management."
  - type: "container"
    name: "Billing & Claims Service"
    technology: ".NET Core"
    description: "Handles billing, claims, and payment processing integrations."
  - type: "container"
    name: "Interoperability Service"
    technology: "Apache Camel / Python"
    description: "Interoperability service for data translation and pushing HL7 FHIR payloads."
  - type: "container"
    name: "Apache Kafka"
    technology: "Apache Kafka"
    description: "Event bus for asynchronous, decoupled inter-service communication."
  - type: "container"
    name: "PostgreSQL"
    technology: "PostgreSQL"
    description: "Primary data store with AES-256 encryption at rest for PHI."
  - type: "container"
    name: "Redis"
    technology: "Redis"
    description: "Caching layer for scheduling and session management."
relationships:
  - source: "Patients"
    destination: "API Gateway / BFF"
    description: "Accesses portal and scheduling features"
    technology: "HTTPS/JSON with MFA"
  - source: "Medical Staff"
    destination: "API Gateway / BFF"
    description: "Accesses EMR, scheduling, and billing workflows"
    technology: "HTTPS/JSON with MFA"
  - source: "API Gateway / BFF"
    destination: "Patient & Scheduling Service"
    description: "Routes requests internally"
    technology: "gRPC"
  - source: "API Gateway / BFF"
    destination: "EMR Service"
    description: "Routes requests internally"
    technology: "gRPC"
  - source: "API Gateway / BFF"
    destination: "Billing & Claims Service"
    description: "Routes requests internally"
    technology: "gRPC"
  - source: "EMR Service"
    destination: "Apache Kafka"
    description: "Publishes domain events"
    technology: "TLS"
  - source: "Billing & Claims Service"
    destination: "Apache Kafka"
    description: "Publishes domain events"
    technology: "TLS"
  - source: "Interoperability Service"
    destination: "Apache Kafka"
    description: "Consumes Kafka events"
    technology: "Kafka Consumer"
  - source: "Interoperability Service"
    destination: "Lab & Imaging Systems"
    description: "Pushes HL7 FHIR payloads"
    technology: "HTTPS/REST"
  - source: "Billing & Claims Service"
    destination: "Payment Gateway"
    description: "Communicates for payment processing"
    technology: "HTTPS"
  - source: "Patient & Scheduling Service"
    destination: "PostgreSQL"
    description: "Reads and writes patient data"
    technology: "JDBC/SQL"
  - source: "EMR Service"
    destination: "PostgreSQL"
    description: "Reads and writes EMR data"
    technology: "JDBC/SQL"
  - source: "Billing & Claims Service"
    destination: "PostgreSQL"
    description: "Reads and writes billing data"
    technology: "JDBC/SQL"
  - source: "Patient & Scheduling Service"
    destination: "Redis"
    description: "Caches scheduling and session data"
    technology: "Redis Protocol"