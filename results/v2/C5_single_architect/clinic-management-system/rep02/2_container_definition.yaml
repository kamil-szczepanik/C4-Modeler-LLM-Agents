level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patient"
    description: "Patient using the platform for admissions, scheduling, and medical records."
  - type: "person"
    name: "Clinician / Receptionist"
    description: "Clinician or Receptionist managing clinical workflows, scheduling, and billing."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems for clinical diagnostics and imaging."
  - type: "externalSystem"
    name: "Payment Gateway / Insurance Clearinghouse"
    description: "External financial systems for processing payments and insurance claims."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External service for sending notifications and alerts."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / NGINX"
    description: "Handles reverse proxy, rate limiting, and mTLS termination."
  - type: "container"
    name: "Patient & Scheduling Service"
    technology: "Spring Boot (Java), Redis"
    description: "Manages patient admissions, scheduling logic, and scheduling locks."
  - type: "container"
    name: "EMR Service"
    technology: "Spring Boot (Java), PostgreSQL"
    description: "Manages electronic medical records and core clinical data."
  - type: "container"
    name: "Billing & Claims Service"
    technology: "Node.js"
    description: "Manages billing, invoicing, and insurance claims."
  - type: "container"
    name: "Integration Service (FHIR Adapter)"
    technology: "Apache Camel / Spring Integration"
    description: "Ensures interoperability with external healthcare systems via HL7 FHIR."
  - type: "container"
    name: "Audit Service"
    technology: "Elasticsearch / WORM storage"
    description: "Maintains immutable audit logs for security and compliance."
  - type: "container"
    name: "Apache Kafka"
    technology: "Apache Kafka"
    description: "Fault-tolerant, durable asynchronous message broker for event-driven messaging."
  - type: "container"
    name: "PostgreSQL"
    technology: "PostgreSQL with AES-256"
    description: "Primary relational database for patient and EMR data."
  - type: "container"
    name: "Redis"
    technology: "Redis"
    description: "Caching and session state storage, and scheduling locks."
  - type: "container"
    name: "Elasticsearch / WORM storage"
    technology: "Elasticsearch / WORM"
    description: "Storage for audit logs."
relationships:
  - source: "Patient"
    destination: "API Gateway"
    description: "Accesses patient admissions and scheduling"
    technology: "HTTPS / REST, OAuth2 / MFA over TLS 1.3"
  - source: "Clinician / Receptionist"
    destination: "API Gateway"
    description: "Manages EMR, scheduling, and billing"
    technology: "HTTPS / REST, OAuth2 / MFA over TLS 1.3"
  - source: "External Lab & Imaging Systems"
    destination: "Integration Service (FHIR Adapter)"
    description: "Exchanges clinical and imaging data"
    technology: "HL7 FHIR over TLS 1.3"
  - source: "API Gateway"
    destination: "Patient & Scheduling Service"
    description: "Routes patient and scheduling requests"
    technology: "gRPC"
  - source: "API Gateway"
    destination: "EMR Service"
    description: "Routes electronic medical record requests"
    technology: "gRPC"
  - source: "API Gateway"
    destination: "Billing & Claims Service"
    description: "Routes billing and claims requests"
    technology: "gRPC"
  - source: "Billing & Claims Service"
    destination: "Apache Kafka"
    description: "Publishes asynchronous billing events"
    technology: "mTLS over Apache Kafka"
  - source: "Integration Service (FHIR Adapter)"
    destination: "Apache Kafka"
    description: "Publishes asynchronous integration events"
    technology: "mTLS over Apache Kafka"
  - source: "Patient & Scheduling Service"
    destination: "PostgreSQL"
    description: "Reads and writes patient data"
    technology: "Encrypted database protocols with AES-256"
  - source: "Patient & Scheduling Service"
    destination: "Redis"
    description: "Uses for caching and locks"
    technology: "Encrypted database protocols with AES-256"
  - source: "EMR Service"
    destination: "PostgreSQL"
    description: "Reads and writes EMR data"
    technology: "Encrypted database protocols with AES-256"
  - source: "Billing & Claims Service"
    destination: "PostgreSQL"
    description: "Reads and writes billing data"
    technology: "Encrypted database protocols with AES-256"
  - source: "Audit Service"
    destination: "Elasticsearch / WORM storage"
    description: "Persists immutable audit logs"
    technology: "Encrypted database protocols with AES-256"