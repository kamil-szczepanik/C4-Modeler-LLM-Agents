level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A distributed enterprise platform that manages patient admissions, electronic medical records, scheduling, and billing for medium-sized hospitals and clinics."
elements:
  - type: "person"
    name: "Patient"
    description: "Actor using the Patient Portal via Web/Mobile for scheduling and viewing records."
  - type: "person"
    name: "Clinician / Receptionist"
    description: "Actors using the Clinic Management System Web interface for admissions, EMR, and scheduling."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems"
    description: "External systems for clinical diagnostics."
  - type: "externalSystem"
    name: "Payment Gateway / Insurance Clearinghouse"
    description: "External financial systems for billing and claims."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External SMS and email gateway (Twilio/SendGrid)."
  - type: "externalSystem"
    name: "On-Premise K8s / AWS Infrastructure"
    description: "Hybrid cloud infrastructure spanning on-premise Kubernetes and AWS eu-central-1."
relationships:
  - source: "Patient"
    destination: "Clinic Management System"
    description: "Interacts for authentication and scheduling"
    technology: "HTTPS (Web/Mobile) / OAuth 2.0 / OpenID Connect"
  - source: "Clinician / Receptionist"
    destination: "Clinic Management System"
    description: "Interacts for admissions, EMR, and scheduling"
    technology: "HTTPS with multi-factor authentication"
  - source: "Clinic Management System"
    destination: "External Lab & Imaging Systems"
    description: "Integrates for clinical diagnostics"
    technology: "HL7 FHIR over REST/TLS"
  - source: "Clinic Management System"
    destination: "Payment Gateway / Insurance Clearinghouse"
    description: "Integrates for claims submission and billing"
    technology: "HTTPS/REST"
  - source: "Clinic Management System"
    destination: "Notification Service"
    description: "Integrates for 2FA challenges and appointment reminders"
    technology: "HTTPS/REST"
  - source: "Clinic Management System"
    destination: "On-Premise K8s / AWS Infrastructure"
    description: "Synchronizes data across hybrid cloud environment"
    technology: "Encrypted VPN/Direct Connect"