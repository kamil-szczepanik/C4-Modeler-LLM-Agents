level: component
scope: "Component diagram for the Integration Service (FHIR Adapter) container"
parentContainer:
  name: "Integration Service (FHIR Adapter)"
elements:
  - type: "component"
    name: "FHIR Ingress/Egress Router"
    technology: "Apache Camel / Spring Integration"
    description: "Manages transport routing and HTTP/REST endpoints; exchanges clinical and imaging data with external systems."
  - type: "component"
    name: "Data Transformation & Mapping Engine"
    technology: "HAPI FHIR library"
    description: "Delegates payload parsing and serialization; converts internal domain models to standard HL7 FHIR R4 resources."
  - type: "component"
    name: "Kafka Event Publisher Component"
    technology: "In-memory"
    description: "Hands off normalized event records for asynchronous domain event publishing."
  - type: "component"
    name: "Audit & Compliance Interceptor"
    technology: "Spring AOP / Camel Interceptor"
    description: "Intercepts requests for PII sanitization and audit logging; forwards raw payloads for compliance logging."
  - type: "component"
    name: "External Lab & Imaging Systems"
    technology: "External System"
    description: "Exchanges clinical and imaging data."
  - type: "component"
    name: "Apache Kafka"
    technology: "Message Broker"
    description: "Handles asynchronous event streaming securely via mTLS."
  - type: "component"
    name: "Audit Service"
    technology: "Microservice"
    description: "Receives secure audit trails via gRPC."
relationships:
  - source: "External Lab & Imaging Systems"
    destination: "FHIR Ingress/Egress Router"
    description: "Exchanges clinical and imaging data [HL7 FHIR over TLS 1.3]"
  - source: "FHIR Ingress/Egress Router"
    destination: "Data Transformation & Mapping Engine"
    description: "Delegates payload parsing and serialization [In-memory Java API]"
  - source: "Data Transformation & Mapping Engine"
    destination: "Kafka Event Publisher Component"
    description: "Hands off normalized event records [In-memory]"
  - source: "Kafka Event Publisher Component"
    destination: "Apache Kafka"
    description: "Publishes asynchronous domain events [mTLS over TCP]"
  - source: "FHIR Ingress/Egress Router"
    destination: "Audit & Compliance Interceptor"
    description: "Forwards raw payloads for compliance logging [In-memory]"
  - source: "Audit & Compliance Interceptor"
    destination: "Audit Service"
    description: "Streams secure audit trails [gRPC over TLS 1.3]"