level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Kong / NGINX Plugin (Lua)"
    description: "Validates incoming tokens and enforces OAuth2 / MFA access control."
  - type: "component"
    name: "Routing & Load Balancing Engine"
    technology: "Kong / OpenResty"
    description: "Routes incoming requests to the appropriate backend microservices and balances traffic."
  - type: "component"
    name: "Rate Limiting & Threat Protection Plugin"
    technology: "Kong / Redis-backed Plugin"
    description: "Prevents abuse and protects against security threats by enforcing rate limits."
  - type: "component"
    name: "mTLS & Audit Logging Interceptor"
    technology: "Kong Plugin / NGINX"
    description: "Ensures secure mTLS communication and logs request metadata for auditing."
  - type: "component"
    name: "FHIR Request Transformer"
    technology: "Kong Plugin / Lua"
    description: "Transforms incoming external lab and imaging system data into structured FHIR requests."
relationships:
  - source: "Authentication & Authorization Filter"
    destination: "Routing & Load Balancing Engine"
    description: "Passes authenticated requests"
  - source: "Routing & Load Balancing Engine"
    destination: "Patient & Scheduling Service"
    description: "Routes internal requests [gRPC over TLS]"
  - source: "Routing & Load Balancing Engine"
    destination: "EMR Service"
    description: "Routes internal requests [gRPC over TLS]"
  - source: "Routing & Load Balancing Engine"
    destination: "Billing & Claims Service"
    description: "Routes internal requests [gRPC over TLS]"
  - source: "FHIR Request Transformer"
    destination: "Integration Service (FHIR Adapter)"
    description: "Forwards FHIR bundles [gRPC over TLS]"