level: component
scope: "Component diagram for the Apache Kafka container"
parentContainer:
  name: "Apache Kafka"
elements:
  - type: "component"
    name: "Kafka Broker"
    technology: "Apache Kafka"
    description: "Handles fault-tolerant event-driven messaging and publishes asynchronous clinical and billing events."
  - type: "component"
    name: "KRaft Controller"
    technology: "KRaft Mode"
    description: "Manages metadata and consensus without ZooKeeper overhead."
  - type: "component"
    name: "Kafka Connect"
    technology: "Kafka Connect"
    description: "Syncs audit logs and clinical data securely to Elasticsearch and WORM storage."
  - type: "component"
    name: "Kafka Schema Registry"
    technology: "Schema Registry"
    description: "Enforces Avro/Protobuf schema validation and validates message schemas."
  - type: "component"
    name: "Kafka Security Interceptor Module"
    technology: "Security Interceptor"
    description: "Enforces fine-grained ACLs and mTLS for HIPAA-compliant PHI data transit."
relationships:
  - source: "Billing & Claims Service"
    destination: "Kafka Schema Registry"
    description: "Validates message schemas [HTTPS]"
  - source: "Kafka Broker"
    destination: "Kafka Schema Registry"
    description: "Fetches schemas [HTTP/REST]"
  - source: "Kafka Connect"
    destination: "Elasticsearch / WORM storage"
    description: "Syncs audit logs and clinical data securely [TLS]"