level: component
scope: "Component diagram for the Elasticsearch / WORM storage container"
parentContainer:
  name: "Elasticsearch / WORM storage"
elements:
  - type: "component"
    name: "Ingest Node / REST API Gateway"
    technology: "Elasticsearch REST API"
    description: "Accepts and validates incoming audit records via REST over HTTPS."
  - type: "component"
    name: "Index Lifecycle Management (ILM) Engine"
    technology: "Elasticsearch ILM"
    description: "Manages index lifecycles, migrating and locking indexes to WORM storage."
  - type: "component"
    name: "WORM Storage Engine"
    technology: "AWS S3 Object Lock"
    description: "Provides immutable, secure long-term storage for audit data."
  - type: "component"
    name: "Audit Data Node Cluster"
    technology: "Elasticsearch Lucene Engine"
    description: "Indexes validated records and offloads older indices to WORM storage."
  - type: "component"
    name: "Access Control & RBAC Component"
    technology: "OAuth2/OIDC, RBAC"
    description: "Handles secure queries and authorization for audit trails."
relationships:
  - source: "Audit Service"
    destination: "Ingest Node / REST API Gateway"
    description: "Streams audit events via REST over HTTPS, TLS 1.3, Mutual TLS"
  - source: "Ingest Node / REST API Gateway"
    destination: "Audit Data Node Cluster"
    description: "Indexes validated records via Internal Transport Protocol over TCP, TLS 1.3"
  - source: "Index Lifecycle Management (ILM) Engine"
    destination: "WORM Storage Engine"
    description: "Migrates and locks indexes via S3 API with Object Lock"
  - source: "Audit Data Node Cluster"
    destination: "WORM Storage Engine"
    description: "Offloads older indices via S3 API, TLS 1.3"
  - source: "Compliance Officer"
    destination: "Access Control & RBAC Component"
    description: "Queries audit trails via HTTPS, RBAC, OAuth2/OIDC"