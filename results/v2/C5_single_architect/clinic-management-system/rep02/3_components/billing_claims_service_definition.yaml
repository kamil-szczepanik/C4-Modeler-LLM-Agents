level: component
scope: "Component diagram for the Billing & Claims Service container"
parentContainer:
  name: "Billing & Claims Service"
elements:
  - type: "component"
    name: "BillingController"
    technology: "Spring Boot (Java)"
    description: "Handles incoming billing and claims HTTP/gRPC requests."
  - type: "component"
    name: "InvoiceManager"
    technology: "Spring Boot (Java)"
    description: "Manages invoice generation and lifecycle."
  - type: "component"
    name: "ClaimsProcessor"
    technology: "Spring Boot (Java)"
    description: "Processes medical claims for insurance clearinghouses."
  - type: "component"
    name: "PaymentAdapter"
    technology: "Spring Boot (Java)"
    description: "Adapts and communicates with external payment gateways and clearinghouses."
  - type: "component"
    name: "BillingRepository"
    technology: "Spring Data JPA / JDBC"
    description: "Persists billing and claims data to PostgreSQL."
  - type: "component"
    name: "CircuitBreakerMiddleware"
    technology: "Opossum / Spring Cloud Circuit Breaker"
    description: "Provides resilience and fault tolerance for external calls."
  - type: "component"
    name: "AuditInterceptor"
    technology: "Spring Interceptor / AOP"
    description: "Intercepts requests for auditing and compliance tracking."
relationships:
  - source: "BillingController"
    destination: "InvoiceManager"
    description: "Delegates invoice processing"
  - source: "BillingController"
    destination: "ClaimsProcessor"
    description: "Delegates claims processing"
  - source: "ClaimsProcessor"
    destination: "PaymentAdapter"
    description: "Transmits claims"
  - source: "InvoiceManager"
    destination: "BillingRepository"
    description: "Persists invoice data"
  - source: "ClaimsProcessor"
    destination: "BillingRepository"
    description: "Persists claim data"
  - source: "BillingController"
    destination: "CircuitBreakerMiddleware"
    description: "Protects outgoing calls"
  - source: "BillingController"
    destination: "AuditInterceptor"
    description: "Triggers audit logging"