level: component
scope: "Component diagram for the Patient & Scheduling Service container"
parentContainer:
  name: "Patient & Scheduling Service"
elements:
  - type: "component"
    name: "Patient Registration Controller & Service"
    technology: "Spring Boot (Java)"
    description: "Manages patient admissions and demographic capture."
  - type: "component"
    name: "Scheduling Engine"
    technology: "Spring Boot (Java)"
    description: "Executes appointment scheduling and resource clash checks."
  - type: "component"
    name: "Cache & Lock Manager"
    technology: "Redis"
    description: "Interfaces with Redis for distributed locking."
  - type: "component"
    name: "Data Access Repository"
    technology: "PostgreSQL, JDBC over TLS"
    description: "Handles persistent storage interactions with PostgreSQL."
  - type: "component"
    name: "Event Publisher"
    technology: "Apache Kafka, SASL_SSL"
    description: "Dispatches domain events to Apache Kafka."
  - type: "component"
    name: "API Gateway"
    technology: "gRPC"
    description: "External entry point routing ingress traffic."
  - type: "component"
    name: "Apache Kafka"
    technology: "Apache Kafka"
    description: "Message broker for publishing state changes."
relationships:
  - source: "API Gateway"
    destination: "Patient Registration Controller & Service"
    description: "Routes ingress traffic [gRPC]"
  - source: "Patient Registration Controller & Service"
    destination: "Cache & Lock Manager"
    description: "Acquires distributed locks [Redis RESP over TLS]"
  - source: "Scheduling Engine"
    destination: "Cache & Lock Manager"
    description: "Acquires distributed locks [Redis RESP over TLS]"
  - source: "Scheduling Engine"
    destination: "Data Access Repository"
    description: "Persists state [JDBC over TLS with AES-256]"
  - source: "Scheduling Engine"
    destination: "Event Publisher"
    description: "Dispatches domain events [Internal method call]"
  - source: "Patient Registration Controller & Service"
    destination: "Event Publisher"
    description: "Dispatches domain events [Internal method call]"
  - source: "Event Publisher"
    destination: "Apache Kafka"
    description: "Publishes state changes [TCP/SASL_SSL]"