level: component
scope: "Component diagram for the EMR Service container"
parentContainer:
  name: "EMR Service"
elements:
  - type: "component"
    name: "EMR API Controller"
    technology: "Spring MVC / gRPC"
    description: "Manages incoming requests for electronic medical records."
  - type: "component"
    name: "Clinical Record Manager"
    technology: "Spring @Service"
    description: "Core service managing clinical record business logic."
  - type: "component"
    name: "FHIR Transformer Component"
    technology: "Apache Camel / HAPI FHIR"
    description: "Translates domain models to HL7 FHIR standards for external lab interoperability."
  - type: "component"
    name: "Audit Trail Interceptor"
    technology: "Spring AOP"
    description: "Intercepts operations to generate audit trails for compliance."
  - type: "component"
    name: "EMR Cache Component"
    technology: "Spring Cache / Redis"
    description: "Caches active patient charts to meet sub-second P95 performance constraints."
  - type: "component"
    name: "EMR Data Access Repository"
    technology: "Spring Data JPA"
    description: "Provides persistence access for core clinical data."
relationships:
  - source: "EMR API Controller"
    destination: "Clinical Record Manager"
    description: "Invokes [In-process]"
  - source: "Clinical Record Manager"
    destination: "EMR Cache Component"
    description: "Queries/Updates [Redis Client, TLS]"
  - source: "Clinical Record Manager"
    destination: "EMR Data Access Repository"
    description: "Reads/Writes [JPA/JDBC, TLS]"
  - source: "Clinical Record Manager"
    destination: "Audit Trail Interceptor"
    description: "Publishes audit events [Async Event / Apache Kafka]"
  - source: "EMR Cache Component"
    destination: "PostgreSQL"
    description: "Fallback Read [Encrypted JDBC]"