level: component
scope: "Component diagram for the Audit Service container"
parentContainer:
  name: "Audit Service"
elements:
  - type: "component"
    name: "Audit API Controller"
    technology: "Spring Boot / Java"
    description: "Receives audit requests and publishes events."
  - type: "component"
    name: "Event Normalizer & Processor"
    technology: "Spring Boot / Java"
    description: "Normalizes and processes audit event streams."
  - type: "component"
    name: "WORM Storage Writer"
    technology: "Spring Boot / Java"
    description: "Writes immutable audit logs to secure storage."
  - type: "component"
    name: "Retention Enforcement Manager"
    technology: "Spring Boot / Java"
    description: "Manages 10-year data retention and compliance policies."
relationships:
  - source: "Audit API Controller"
    destination: "Event Normalizer & Processor"
    description: "Passes raw events for processing"
  - source: "Event Normalizer & Processor"
    destination: "WORM Storage Writer"
    description: "Sends normalized events for immutable storage"
  - source: "Retention Enforcement Manager"
    destination: "WORM Storage Writer"
    description: "Enforces retention policies on"