level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Manages incoming TCP/IP connections from microservices."
  - type: "component"
    name: "Primary Database Instance"
    technology: "PostgreSQL 15+"
    description: "Handles read/write transactions for EMR and patient records."
  - type: "component"
    name: "High Availability Replica"
    technology: "Patroni / PostgreSQL Streaming Replication"
    description: "Active standby instance for automated failover."
  - type: "component"
    name: "Read-Only Replica"
    technology: "PostgreSQL Streaming Replication"
    description: "Offloads read traffic to improve performance."
  - type: "component"
    name: "Audit Logging Engine"
    technology: "pgaudit"
    description: "Captures DDL/DML statements for HIPAA-compliant auditing."
  - type: "component"
    name: "Backup & Archival Agent"
    technology: "Barman / pgBackRest"
    description: "Manages point-in-time recovery and long-term data retention."
relationships:
  - source: "Connection Pooler"
    destination: "Primary Database Instance"
    description: "Forwards write operations and dynamic queries."
  - source: "Primary Database Instance"
    destination: "High Availability Replica"
    description: "Synchronizes data in real-time via Streaming Replication [TCP/IP, TLS 1.3]."
  - source: "Primary Database Instance"
    destination: "Read-Only Replica"
    description: "Feeds read-only data for scaling."
  - source: "Backup & Archival Agent"
    destination: "Primary Database Instance"
    description: "Performs backups via Encrypted File System / API."