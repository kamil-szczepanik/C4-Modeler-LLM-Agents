level: component
scope: "Component diagram for the Redis container"
parentContainer:
  name: "Redis"
elements:
  - type: "component"
    name: "Redis Master Node"
    technology: "Redis Enterprise / Open Source Redis 7.x"
    description: "Stores encrypted key-values, caching, session state, and scheduling locks."
  - type: "component"
    name: "Redis Replica Nodes"
    technology: "Redis Enterprise / Open Source Redis 7.x"
    description: "Provides data replication for high availability."
  - type: "component"
    name: "TLS 1.3 Proxy"
    technology: "TLS 1.3"
    description: "Secures transport layer communication."
  - type: "component"
    name: "Client-Side Encryption/Decryption Middleware"
    technology: "Encryption Middleware"
    description: "Handles client-side encryption and decryption of serialized PII/PHI."
relationships:
  - source: "Client-Side Encryption/Decryption Middleware"
    destination: "Redis Master Node"
    description: "Stores encrypted key-values [RESP protocol over TLS 1.3]"
  - source: "Redis Master Node"
    destination: "Redis Replica Nodes"
    description: "Data replication [RESP]"