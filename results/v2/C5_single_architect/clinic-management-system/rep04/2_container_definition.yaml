level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patients and Clinical & Administrative Staff"
    description: "Users interacting with the system for admissions, EMRs, scheduling, and billing."
  - type: "externalSystem"
    name: "External Lab & Imaging Systems, Payment Gateways, and Insurance Clearinghouses"
    description: "External systems for diagnostic tests, payments, and insurance claims."
  - type: "container"
    name: "Nginx / Envoy API Gateway"
    technology: "Nginx / Envoy"
    description: "Handles TLS termination, OAuth2/OIDC MFA validation, and rate limiting."
  - type: "container"
    name: "React / TypeScript Web Application"
    technology: "React / TypeScript"
    description: "Provides high-performance responsive client-side UI rendering."
  - type: "container"
    name: "Patient & EMR Service"
    technology: "Spring Boot"
    description: "Manages patient data and electronic medical records."
  - type: "container"
    name: "Scheduling Service"
    technology: "Node.js / Go"
    description: "Handles high-concurrency appointment scheduling and resource clash checks."
  - type: "container"
    name: "Billing & Integration Service"
    technology: "Spring Boot with Apache Camel"
    description: "Processes billing and integrates with external healthcare systems using HL7 FHIR."
  - type: "container"
    name: "Redis Enterprise Distributed Cache"
    technology: "Redis Enterprise"
    description: "Provides active-active caching for fast data access."
  - type: "container"
    name: "Apache Kafka Event Broker"
    technology: "Apache Kafka"
    description: "Handles asynchronous event-driven decoupling between services."
  - type: "container"
    name: "PostgreSQL Primary Database"
    technology: "PostgreSQL with AES-256 encryption"
    description: "Primary relational database ensuring ACID compliance and secure data storage."
  - type: "container"
    name: "Immutable Audit Log Store"
    technology: "Encrypted Storage"
    description: "Stores immutable audit logs for security and compliance."
relationships:
  - source: "Patients and Clinical & Administrative Staff"
    destination: "React / TypeScript Web Application"
    description: "Accesses via web browser"
    technology: "HTTPS/REST"
  - source: "React / TypeScript Web Application"
    destination: "Nginx / Envoy API Gateway"
    description: "Sends API requests"
    technology: "HTTPS/REST"
  - source: "Nginx / Envoy API Gateway"
    destination: "Patient & EMR Service"
    description: "Routes requests"
    technology: "gRPC and HTTPS/REST"
  - source: "Nginx / Envoy API Gateway"
    destination: "Scheduling Service"
    description: "Routes requests"
    technology: "gRPC and HTTPS/REST"
  - source: "Nginx / Envoy API Gateway"
    destination: "Billing & Integration Service"
    description: "Routes requests"
    technology: "gRPC and HTTPS/REST"
  - source: "Patient & EMR Service"
    destination: "PostgreSQL Primary Database"
    description: "Reads and writes patient and EMR data"
    technology: "SQL/TCP"
  - source: "Patient & EMR Service"
    destination: "Redis Enterprise Distributed Cache"
    description: "Caches frequently accessed data"
    technology: "RESP"
  - source: "Scheduling Service"
    destination: "Billing & Integration Service"
    description: "Sends scheduling and billing events"
    technology: "Apache Kafka (AMQP/Kafka)"
  - source: "Billing & Integration Service"
    destination: "External Lab & Imaging Systems, Payment Gateways, and Insurance Clearinghouses"
    description: "Exchanges billing, integration, and health data"
    technology: "HL7 FHIR over HTTPS"