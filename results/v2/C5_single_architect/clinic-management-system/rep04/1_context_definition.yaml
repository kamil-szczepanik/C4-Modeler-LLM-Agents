level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid healthcare platform managing patient admissions, EMRs, scheduling, and billing, ensuring high availability, strict regulatory compliance, and seamless interoperability for medium-sized hospitals and clinics."
elements:
  - type: "person"
    name: "Patients"
    description: "External actors accessing the web/mobile portal for scheduling and billing."
  - type: "person"
    name: "Clinical & Administrative Staff"
    description: "Users such as doctors, nurses, and receptionists managing patient care and records."
  - type: "externalSystem"
    name: "Lab & Imaging Systems"
    description: "External diagnostic systems integrated for medical tests and imaging results."
  - type: "externalSystem"
    name: "Payment Gateway & Insurance Clearinghouses"
    description: "External financial systems processing payments and insurance claims."
relationships:
  - source: "Patients"
    destination: "Clinic Management System"
    description: "Accesses portal for scheduling and billing"
    technology: "HTTPS (TLS 1.3)"
  - source: "Clinical & Administrative Staff"
    destination: "Clinic Management System"
    description: "Manages patient care and records with mandatory MFA"
    technology: "HTTPS (TLS 1.3) with MFA"
  - source: "Clinic Management System"
    destination: "Lab & Imaging Systems"
    description: "Exchanges diagnostic and healthcare data"
    technology: "RESTful HL7 FHIR APIs over HTTPS"
  - source: "Clinic Management System"
    destination: "Payment Gateway & Insurance Clearinghouses"
    description: "Processes financial transactions and insurance claims"
    technology: "Secure HTTPS/TLS 1.3"