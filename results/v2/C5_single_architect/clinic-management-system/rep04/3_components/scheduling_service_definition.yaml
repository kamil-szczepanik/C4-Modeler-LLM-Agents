level: component
scope: "Component diagram for the Scheduling Service container"
parentContainer:
  name: "Scheduling Service"
elements:
  - type: "component"
    name: "API Handler / Controller"
    technology: "Go standard library / gRPC-go"
    description: "Routes requests and handles inbound HTTPS/REST and gRPC traffic."
  - type: "component"
    name: "Appointment Manager"
    technology: "Go domain logic"
    description: "Manages high-concurrency patient appointment scheduling domain logic."
  - type: "component"
    name: "Resource Conflict Detector"
    technology: "Go with in-memory locks"
    description: "Performs resource clash checks using in-memory synchronization."
  - type: "component"
    name: "Cache Repository"
    technology: "Go Redis Client"
    description: "Interacts with distributed caching for real-time availability checks."
  - type: "component"
    name: "Database Repository"
    technology: "Go pgx driver"
    description: "Persists appointment state to the primary database."
  - type: "component"
    name: "Event Publisher"
    technology: "Segmentio Kafka-go"
    description: "Dispatches domain events asynchronously."
  - type: "component"
    name: "Nginx / Envoy API Gateway"
    technology: "Nginx / Envoy"
    description: "External API Gateway routing requests to the service."
  - type: "component"
    name: "Redis Enterprise"
    technology: "Redis"
    description: "Provides distributed caching for real-time availability checks."
  - type: "component"
    name: "Apache Kafka"
    technology: "Kafka"
    description: "Asynchronous event broker for cross-service integration."
  - type: "component"
    name: "PostgreSQL Primary Database"
    technology: "PostgreSQL with AES-256"
    description: "Ensures ACID compliance and durable storage with AES-256 encryption."
relationships:
  - source: "Nginx / Envoy API Gateway"
    destination: "API Handler / Controller"
    description: "Routes requests [HTTPS/REST and gRPC]"
  - source: "API Handler / Controller"
    destination: "Appointment Manager"
    description: "Delegates requests [In-process Go interfaces]"
  - source: "Appointment Manager"
    destination: "Resource Conflict Detector"
    description: "Validates availability [In-process]"
  - source: "Resource Conflict Detector"
    destination: "Cache Repository"
    description: "Checks availability [TCP / Redis Protocol]"
  - source: "Cache Repository"
    destination: "Redis Enterprise"
    description: "Connects to distributed cache"
  - source: "Appointment Manager"
    destination: "Database Repository"
    description: "Persists state [In-process Go interfaces]"
  - source: "Database Repository"
    destination: "PostgreSQL Primary Database"
    description: "Stores appointments [TCP / PostgreSQL Wire Protocol with AES-256]"
  - source: "Appointment Manager"
    destination: "Event Publisher"
    description: "Dispatches events [In-process]"
  - source: "Event Publisher"
    destination: "Apache Kafka"
    description: "Publishes domain events [TCP / Kafka Protocol]"