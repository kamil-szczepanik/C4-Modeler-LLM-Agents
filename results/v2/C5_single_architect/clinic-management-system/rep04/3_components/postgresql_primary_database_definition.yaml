level: component
scope: "Component diagram for the PostgreSQL Primary Database container"
parentContainer:
  name: "PostgreSQL Primary Database"
elements:
  - type: "component"
    name: "PgBouncer"
    technology: "Connection Pooler"
    description: "Manages and optimizes database connection pooling to maintain P95 performance."
  - type: "component"
    name: "PostgreSQL Relational Engine"
    technology: "PostgreSQL 15+"
    description: "ACID-compliant relational data storage engine."
  - type: "component"
    name: "Streaming Replication Module"
    technology: "PostgreSQL Module"
    description: "Handles replication of data to standby nodes."
  - type: "component"
    name: "TDE / SSL Module"
    technology: "AES-256 / TLS"
    description: "Provides Transparent Data Encryption and secure transport encryption."
  - type: "component"
    name: "pgAudit"
    technology: "PostgreSQL Extension"
    description: "Tracks comprehensive DDL/DML for HIPAA and GDPR audit compliance."
relationships:
  - source: "PgBouncer"
    destination: "PostgreSQL Relational Engine"
    description: "Routes SQL queries over TCP"
  - type: "component"
    name: "PostgreSQL Relational Engine"
    destination: "Streaming Replication Module"
    description: "Replicates data streams"
  - type: "component"
    name: "PostgreSQL Relational Engine"
    destination: "TDE / SSL Module"
    description: "Secures stored data"
  - type: "component"
    name: "PostgreSQL Relational Engine"
    destination: "pgAudit"
    description: "Logs audit events"