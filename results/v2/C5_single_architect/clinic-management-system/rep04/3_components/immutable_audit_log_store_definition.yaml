level: component
scope: "Component diagram for the Immutable Audit Log Store container"
parentContainer:
  name: "Immutable Audit Log Store"
elements:
  - type: "component"
    name: "Audit Ingestion API"
    technology: "gRPC"
    description: "Ingests streaming audit logs from Apache Kafka via TLS 1.3 gRPC."
  - type: "component"
    name: "Log Normalizer & Enricher"
    technology: "Microservice Processing Engine"
    description: "Normalizes and enriches incoming audit log events for compliance."
  - type: "component"
    name: "WORM Storage Engine"
    technology: "S3 Object Lock / MinIO WORM mode"
    description: "Ensures tamper-proof 10-year data retention for HIPAA and GDPR compliance."
  - type: "component"
    name: "Retention Policy Manager"
    technology: "Policy Enforcement Engine"
    description: "Manages the 10-year data retention lifecycle policies."
  - type: "component"
    name: "Audit Query Interface"
    technology: "API / Query Service"
    description: "Provides secure access interfaces for querying audit logs."
  - type: "component"
    name: "Cryptographic Verifier Component"
    technology: "Cryptographic Merkle Tree Verifier"
    description: "Performs cryptographic verification using Merkle trees to ensure log integrity."
relationships:
  - source: "Audit Ingestion API"
    destination: "Log Normalizer & Enricher"
    description: "Passes raw events for normalization"
  - source: "Log Normalizer & Enricher"
    destination: "WORM Storage Engine"
    description: "Stores processed logs"
  - source: "Retention Policy Manager"
    destination: "WORM Storage Engine"
    description: "Enforces retention rules"
  - source: "Cryptographic Verifier Component"
    destination: "WORM Storage Engine"
    description: "Verifies log integrity and tamper-resistance"
  - source: "Audit Query Interface"
    destination: "WORM Storage Engine"
    description: "Queries stored logs"