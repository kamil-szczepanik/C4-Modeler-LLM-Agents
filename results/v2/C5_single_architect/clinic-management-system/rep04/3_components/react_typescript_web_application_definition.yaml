level: component
scope: "Component diagram for the React / TypeScript Web Application container"
parentContainer:
  name: "React / TypeScript Web Application"
elements:
  - type: "component"
    name: "Router / State Management Component"
    technology: "React Router, Redux Toolkit"
    description: "Manages scalable client-side state and navigation."
  - type: "component"
    name: "Authentication & Authorization Component"
    technology: "OpenID Connect/OAuth2 SDK"
    description: "Secures communications and enforces MFA/JWT handling."
  - type: "component"
    name: "EMR & Scheduling UI Module"
    technology: "React"
    description: "Provides the user interface for EMR and scheduling."
  - type: "component"
    name: "API Client Component"
    technology: "Axios"
    description: "Handles API requests to the API Gateway."
  - type: "component"
    name: "Client-Side Cache & Offline Storage Component"
    technology: "IndexedDB"
    description: "Provides local client-side caching to meet sub-second EMR load times."
relationships:
  - source: "EMR & Scheduling UI Module"
    destination: "API Client Component"
    description: "Invokes API operations [TypeScript Method Calls]"
  - source: "EMR & Scheduling UI Module"
    destination: "Client-Side Cache & Offline Storage Component"
    description: "Reads/writes cached state [TypeScript Method Calls]"
  - source: "API Client Component"
    destination: "Nginx / Envoy API Gateway"
    description: "Sends API requests [HTTPS/REST]"