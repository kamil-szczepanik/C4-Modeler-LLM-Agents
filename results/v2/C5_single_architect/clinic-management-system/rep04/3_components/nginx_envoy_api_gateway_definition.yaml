level: component
scope: "Component diagram for the Nginx / Envoy API Gateway container"
parentContainer:
  name: "Nginx / Envoy API Gateway"
elements:
  - type: "component"
    name: "TLS Termination & Ingress Listener"
    technology: "Envoy/Nginx Core"
    description: "Handles edge TLS 1.3 termination and mTLS zero-trust transport."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Lua/Wasm with OAuth2/OIDC"
    description: "Executes low-latency multi-factor authentication and token validation."
  - type: "component"
    name: "Rate Limiting & Threat Protection Engine"
    technology: "Envoy Rate Limit Service & Redis"
    description: "Enforces API rate limits and protects against volumetric attacks."
  - type: "component"
    name: "Dynamic Routing & Load Balancing Engine"
    technology: "Envoy RDS & gRPC/HTTP2"
    description: "Manages high-performance dynamic routing across backend microservices."
relationships:
  - source: "TLS Termination & Ingress Listener"
    destination: "Authentication & Authorization Filter"
    description: "Envoy Filter Chain, In-Memory"
  - source: "Authentication & Authorization Filter"
    destination: "Rate Limiting & Threat Protection Engine"
    description: "gRPC over Unix Domain Socket"
  - source: "Rate Limiting & Threat Protection Engine"
    destination: "Dynamic Routing & Load Balancing Engine"
    description: "Envoy Filter Chain, In-Memory"
  - source: "Dynamic Routing & Load Balancing Engine"
    destination: "Patient & EMR Service"
    description: "gRPC / HTTP/2 over mTLS"
  - source: "Dynamic Routing & Load Balancing Engine"
    destination: "Scheduling Service"
    description: "gRPC / HTTP/2 over mTLS"
  - source: "Dynamic Routing & Load Balancing Engine"
    destination: "Billing & Integration Service"
    description: "gRPC / HTTP/2 over mTLS"