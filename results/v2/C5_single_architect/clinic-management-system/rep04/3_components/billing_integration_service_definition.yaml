level: component
scope: "Component diagram for the Billing & Integration Service container"
parentContainer:
  name: "Billing & Integration Service"
elements:
  - type: "component"
    name: "Billing Controller"
    technology: "Spring REST Controller"
    description: "Handles incoming financial and billing API requests."
  - type: "component"
    name: "FHIR Integration Camel Route"
    technology: "Apache Camel"
    description: "Executes enterprise integration patterns for HL7 FHIR transformations and exchanges health data."
  - type: "component"
    name: "Claim Processing Engine"
    technology: "Spring Service"
    description: "Processes insurance claims and manages external integrations."
  - type: "component"
    name: "Kafka Event Consumer"
    technology: "Spring Kafka Listener"
    description: "Consumes billing events from the event broker."
  - type: "component"
    name: "Data Access Repository"
    technology: "Spring Data JPA"
    description: "Manages database persistence with encryption support for transactional billing data."
  - type: "component"
    name: "Circuit Breaker & Outbound Gateway"
    technology: "Resilience4j"
    description: "Implements circuit breaker and retry patterns to protect outbound HTTP calls."
  - type: "component"
    name: "PostgreSQL Primary Database"
    technology: "PostgreSQL"
    description: "Stores encrypted transactional billing data securely."
  - type: "component"
    name: "Apache Kafka Event Broker"
    technology: "Apache Kafka"
    description: "Broker for asynchronous messaging and event distribution."
relationships:
  - source: "Nginx / Envoy API Gateway"
    destination: "Billing Controller"
    description: "Routes API requests via gRPC/HTTPS"
  - source: "Apache Kafka Event Broker"
    destination: "Kafka Event Consumer"
    description: "Consumes billing events via Kafka protocol"
  - source: "FHIR Integration Camel Route"
    destination: "External Lab & Imaging Systems"
    description: "Exchanges health data via HTTPS (HL7 FHIR)"
  - source: "Claim Processing Engine"
    destination: "Payment Gateway & Insurance Clearinghouses"
    description: "Submits claims via Resilience4j and HTTPS"
  - source: "Data Access Repository"
    destination: "PostgreSQL Primary Database"
    description: "Persists records via JDBC with AES-256"