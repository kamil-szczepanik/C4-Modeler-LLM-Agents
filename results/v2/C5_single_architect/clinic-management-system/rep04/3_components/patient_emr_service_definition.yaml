level: component
scope: "Component diagram for the Patient & EMR Service container"
parentContainer:
  name: "Patient & EMR Service"
elements:
  - type: "component"
    name: "Patient Registry Component"
    technology: "Spring Boot"
    description: "Manages patient admissions and demographic records."
  - type: "component"
    name: "EMR Management Component"
    technology: "Spring Boot"
    description: "Manages electronic medical records, interacting with database, cache, and audit components."
  - type: "component"
    name: "Audit Trail Interceptor"
    technology: "Spring AOP"
    description: "Triggers audit events for compliance tracking."
  - type: "component"
    name: "FHIR Interoperability Adapter"
    technology: "HAPI FHIR JPA"
    description: "Exchanges standardized healthcare data with external lab and imaging systems."
  - type: "component"
    name: "EMR Caching Proxy Component"
    technology: "Spring Data Redis"
    description: "Handles reads and writes for hot patient data."
relationships:
  - source: "EMR Management Component"
    destination: "EMR Caching Proxy Component"
    description: "Reads/writes hot patient data [RESP]"
  - source: "EMR Management Component"
    destination: "PostgreSQL Primary Database"
    description: "Reads and writes clinical records [JPA/SQL]"
  - source: "EMR Management Component"
    destination: "Audit Trail Interceptor"
    description: "Triggers audit events [In-memory]"
  - source: "Audit Trail Interceptor"
    destination: "Immutable Audit Log Store"
    description: "Persists compliance records [HTTPS/TLS]"
  - source: "FHIR Interoperability Adapter"
    destination: "Lab & Imaging Systems"
    description: "Exchanges health data [HL7 FHIR / HTTPS]"