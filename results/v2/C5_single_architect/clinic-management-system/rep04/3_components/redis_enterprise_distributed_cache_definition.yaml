level: component
scope: "Component diagram for the Redis Enterprise Distributed Cache container"
parentContainer:
  name: "Redis Enterprise Distributed Cache"
elements:
  - type: "component"
    name: "In-Memory Data Store Engine"
    technology: "C++ core"
    description: "Core engine for low-latency in-memory data storage and management."
  - type: "component"
    name: "Active-Active CRDT Sync Module"
    technology: "Conflict-free Replicated Data Types (CRDT)"
    description: "Handles cross-region state replication via encrypted TLS mesh."
  - type: "component"
    name: "Cluster Manager & Proxy"
    technology: "Golang proxy"
    description: "Manages cluster operations and routes RESP over TLS traffic."
  - type: "component"
    name: "Security & Encryption Enforcer"
    technology: "OpenSSL"
    description: "Enforces security policies and encryption for data access and replication."
relationships:
  - source: "Cluster Manager & Proxy"
    destination: "In-Memory Data Store Engine"
    description: "Routes read/write requests"
  - source: "Active-Active CRDT Sync Module"
    destination: "External Region Replicas"
    description: "Cross-region state replication via Encrypted TLS Mesh"
  - source: "Security & Encryption Enforcer"
    destination: "Cluster Manager & Proxy"
    description: "Secures communication channels"