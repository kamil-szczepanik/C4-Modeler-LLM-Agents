level: component
scope: "Component diagram for the Apache Kafka Event Broker container"
parentContainer:
  name: "Apache Kafka Event Broker"
elements:
  - type: "component"
    name: "Partition Manager & Replication Engine"
    technology: "Kraft / ZooKeeper Consensus, Java"
    description: "Handles leader election and In-Sync Replicas (ISR) for cluster coordination."
  - type: "component"
    name: "Kafka Request Handler & Produce/Consume API"
    technology: "Java TCP Sockets, Java NIO"
    description: "Processes binary messaging and handles produce/consume requests."
  - type: "component"
    name: "Storage & Log Compaction Engine"
    technology: "OS Page Cache, Java NIO, AES-256"
    description: "Manages encrypted event retention and storage log compaction."
  - type: "component"
    name: "MirrorMaker 2.0 Replication Agent"
    technology: "Kafka Connect, Java"
    description: "Facilitates cross-site hybrid replication for active-active multi-region disaster recovery."
relationships:
  - source: "Patient & EMR Service"
    destination: "Kafka Request Handler & Produce/Consume API"
    description: "Publishes EMR events via TCP / Kafka Protocol (SASL/TLS)."
  - source: "Billing & Integration Service"
    destination: "Kafka Request Handler & Produce/Consume API"
    description: "Consumes billing triggers via TCP / Kafka Protocol (SASL/TLS)."
  - source: "Partition Manager & Replication Engine"
    destination: "MirrorMaker 2.0 Replication Agent"
    description: "Synchronizes state across regions via TCP / Kafka Protocol (TLS)."