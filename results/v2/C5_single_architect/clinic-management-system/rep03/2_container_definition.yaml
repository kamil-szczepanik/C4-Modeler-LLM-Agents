level: container
scope: "Container diagram for Clinic Management System"
system:
  name: "Clinic Management System"
elements:
  - type: "person"
    name: "Patient"
    description: "Accesses the system to manage patient admissions, electronic medical records, and scheduling."
  - type: "person"
    name: "Clinician/Staff"
    description: "Accesses the system for clinical workflows and medical records management."
  - type: "person"
    name: "Hospital Administrator"
    description: "Accesses the system to oversee hospital administration and management."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Handles user authentication and token validation."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Handles insurance claims and payment processing."
  - type: "externalSystem"
    name: "External Labs & Imaging Systems"
    description: "Exchanges medical and laboratory data."
  - type: "externalSystem"
    name: "Regulatory Archiving / Audit Storage"
    description: "Stores long-term audit logs and compliance records."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / Nginx"
    description: "Entry point for client requests, handling token validation, TLS termination, and OAuth2/MFA."
  - type: "container"
    name: "Patient & Scheduling Service"
    technology: "NestJS / Node.js"
    description: "Manages patient registrations, profiles, and appointment scheduling."
  - type: "container"
    name: "EMR Service"
    technology: "Spring Boot / Java"
    description: "Handles Electronic Medical Records and audit trails with high-performance P95 loads."
  - type: "container"
    name: "Billing Service"
    technology: "FastAPI / Python"
    description: "Handles payment processing and medical claims."
  - type: "container"
    name: "FHIR Integration Broker"
    technology: "Apache Camel / Node.js"
    description: "Ensures HL7 FHIR interoperability with external healthcare systems."
  - type: "container"
    name: "Audit & Compliance Worker"
    technology: "Go"
    description: "Handles asynchronous audit logging and compliance tasks."
  - type: "container"
    name: "Database Cluster"
    technology: "PostgreSQL"
    description: "Primary multi-region active-active database with AES-256 encryption at rest."
  - type: "container"
    name: "Message Broker"
    technology: "RabbitMQ / Kafka"
    description: "Enables reliable asynchronous event processing and message streaming."
relationships:
  - source: "Patient"
    destination: "API Gateway"
    description: "Accesses patient admissions and scheduling"
    technology: "HTTPS / gRPC"
  - source: "Clinician/Staff"
    destination: "API Gateway"
    description: "Accesses EMR and clinical workflows"
    technology: "HTTPS / gRPC"
  - source: "Hospital Administrator"
    destination: "API Gateway"
    description: "Accesses administrative features"
    technology: "HTTPS / gRPC"
  - source: "API Gateway"
    destination: "Identity Provider"
    description: "Validates tokens and user authentication"
    technology: "HTTPS / OAuth2"
  - source: "API Gateway"
    destination: "Patient & Scheduling Service"
    description: "Routes client requests"
    technology: "mTLS"
  - source: "API Gateway"
    destination: "EMR Service"
    description: "Routes EMR requests"
    technology: "mTLS"
  - source: "API Gateway"
    destination: "Billing Service"
    description: "Routes billing requests"
    technology: "mTLS"
  - source: "API Gateway"
    destination: "FHIR Integration Broker"
    description: "Routes integration requests"
    technology: "mTLS"
  - source: "Patient & Scheduling Service"
    destination: "Database Cluster"
    description: "Reads and writes patient/scheduling data"
    technology: "PostgreSQL protocol"
  - source: "EMR Service"
    destination: "Database Cluster"
    description: "Reads and writes EMR data"
    technology: "PostgreSQL protocol"
  - source: "Billing Service"
    destination: "Database Cluster"
    description: "Reads and writes billing data"
    technology: "PostgreSQL protocol"
  - source: "Billing Service"
    destination: "Payment Gateway"
    description: "Processes claims and payments"
    technology: "AMQP / REST"
  - source: "FHIR Integration Broker"
    destination: "External Labs & Imaging Systems"
    description: "Exchanges lab and imaging data"
    technology: "HL7 FHIR over HTTPS"
  - source: "Audit & Compliance Worker"
    destination: "Regulatory Archiving / Audit Storage"
    description: "Streams audit logs for 10-year retention"
    technology: "AMQP / Kafka"
  - source: "EMR Service"
    destination: "Message Broker"
    description: "Publishes asynchronous audit events"
    technology: "RabbitMQ / Kafka"
  - source: "Audit & Compliance Worker"
    destination: "Message Broker"
    description: "Consumes audit events"
    technology: "RabbitMQ / Kafka"