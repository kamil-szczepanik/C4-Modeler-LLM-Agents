level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Event Ingestion Router"
    technology: "Apache Kafka"
    description: "Accepts published audit and domain events and routes them within the message broker."
  - type: "component"
    name: "Commit Log Partition Manager"
    technology: "Apache Kafka"
    description: "Persists validated streams to disk using immutable distributed commit logs for 10-year data retention."
  - type: "component"
    name: "Consumer Group Coordinator"
    technology: "Apache Kafka"
    description: "Manages consumer group offsets and load balancing for message consumption."
  - type: "component"
    name: "Schema Registry"
    technology: "Avro / JSON Schema"
    description: "Validates message schemas and guarantees message compatibility and data contracts across microservices."
relationships:
  - source: "EMR Service"
    destination: "Schema Registry"
    description: "Validates message schemas [HTTP/REST]"
  - source: "EMR Service"
    destination: "Event Ingestion Router"
    description: "Publishes audit and domain events [TCP / Kafka Producer API]"
  - source: "Event Ingestion Router"
    destination: "Commit Log Partition Manager"
    description: "Persists validated streams to disk [Internal Binary Protocol]"
  - source: "Audit & Compliance Worker"
    destination: "Commit Log Partition Manager"
    description: "Consumes event streams [TCP / Kafka Consumer API]"