level: component
scope: "Component diagram for the EMR Service container"
parentContainer:
  name: "EMR Service"
elements:
  - type: "component"
    name: "EMR Controller Layer"
    technology: "Spring MVC REST Controllers"
    description: "Handles incoming clinical HTTPS requests."
  - type: "component"
    name: "Clinical Record Manager"
    technology: "Spring Boot Domain Service"
    description: "Core domain service managing patient charts, progress notes, and diagnostics."
  - type: "component"
    name: "Audit Trail Interceptor"
    technology: "AOP Component"
    description: "Captures immutable access logs asynchronously."
  - type: "component"
    name: "Encryption & Data Access Layer"
    technology: "Spring Data JPA / Hibernate, AES-256"
    description: "Manages database interactions utilizing column-level AES-256 encryption."
  - type: "component"
    name: "FHIR Transformer Component"
    technology: "Mapping Engine / Apache Camel"
    description: "Converts internal models to HL7 FHIR resources."
  - type: "component"
    name: "Message Broker"
    technology: "RabbitMQ / Kafka"
    description: "Enables asynchronous, decoupled audit event publishing."
  - type: "component"
    name: "Database Cluster"
    technology: "PostgreSQL"
    description: "Stores clinical data and audit trails."
relationships:
  - source: "EMR Controller Layer"
    destination: "Clinical Record Manager"
    description: "In-process method call"
  - source: "Clinical Record Manager"
    destination: "Encryption & Data Access Layer"
    description: "In-process JPA / PostgreSQL protocol"
  - source: "Clinical Record Manager"
    destination: "FHIR Transformer Component"
    description: "In-process method call"
  - source: "Audit Trail Interceptor"
    destination: "Message Broker"
    description: "AMQP / Kafka, async"
  - source: "FHIR Transformer Component"
    destination: "Database Cluster"
    description: "Read-only queries via JPA"