level: component
scope: "Component diagram for the Audit & Compliance Worker container"
parentContainer:
  name: "Audit & Compliance Worker"
elements:
  - type: "component"
    name: "Event Consumer Component"
    technology: "Go, segmentio/kafka-go"
    description: "Consumes raw security and access events."
  - type: "component"
    name: "Compliance Normalizer Component"
    technology: "Go"
    description: "Validates, sanitizes, and structures event payloads against HIPAA/GDPR schemas."
  - type: "component"
    name: "Retention Policy Enforcer Component"
    technology: "Go"
    description: "Applies data immutability flags and tagging."
  - type: "component"
    name: "Archival Exporter Component"
    technology: "Go, AWS SDK"
    description: "Batches and streams processed audit packages to long-term storage."
  - type: "component"
    name: "DLQ Handler Component"
    technology: "Go"
    description: "Catches malformed or failed events to prevent audit data loss."
relationships:
  - source: "Event Consumer Component"
    destination: "Message Broker"
    description: "reads [Kafka Protocol]"
  - source: "Compliance Normalizer Component"
    destination: "Retention Policy Enforcer Component"
    description: "passes data [In-memory Go channels]"
  - source: "Compliance Normalizer Component"
    destination: "DLQ Handler Component"
    description: "routes failures [In-memory Go channels]"
  - source: "Archival Exporter Component"
    destination: "Regulatory Archiving / Audit Storage"
    description: "writes [HTTPS / S3 API]"
  - source: "DLQ Handler Component"
    destination: "Message Broker"
    description: "publishes retry/alert [Kafka Protocol]"