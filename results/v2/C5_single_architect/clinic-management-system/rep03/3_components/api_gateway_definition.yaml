level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "TLS Termination & Routing Engine"
    technology: "Kong / Nginx"
    description: "Handles high-performance routing and TLS termination for incoming client requests."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Kong / Nginx Plugin"
    description: "Validates tokens and user authentication interacting with the Identity Provider."
  - type: "component"
    name: "Rate Limiting & Threat Protection Plugin"
    technology: "Kong / Nginx Plugin"
    description: "Protects the system by enforcing rate limits and providing threat protection."
  - type: "component"
    name: "Audit Logging Interceptor"
    technology: "Kong / Nginx Plugin"
    description: "Intercepts requests to log audit data."
  - type: "component"
    name: "PHI Redaction & Header Injector"
    technology: "Kong / Nginx Plugin"
    description: "Redacts Protected Health Information and injects headers before dispatching sanitized access events."
relationships:
  - source: "PHI Redaction & Header Injector"
    destination: "Audit & Compliance Worker"
    description: "Dispatches sanitized access events [AMQP / Kafka over TLS]"