level: component
scope: "Component diagram for the Patient & Scheduling Service container"
parentContainer:
  name: "Patient & Scheduling Service"
elements:
  - type: "component"
    name: "Patient Registration Controller & Service"
    technology: "NestJS component"
    description: "Handles patient admissions and demographics."
  - type: "component"
    name: "Scheduling Engine & Resource Validator"
    technology: "NestJS component"
    description: "Manages appointment scheduling and validates resources."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "NestJS component"
    description: "Dispatches notifications regarding appointments."
  - type: "component"
    name: "Patient Consent & Privacy Manager"
    technology: "NestJS component"
    description: "Manages patient consent and privacy compliance."
  - type: "component"
    name: "Database Cluster"
    technology: "PostgreSQL"
    description: "Relational storage for encrypted patient and scheduling data ensuring durability."
  - type: "component"
    name: "Message Broker"
    technology: "Apache Kafka"
    description: "Event broker for reliable asynchronous messaging and notifications."
  - type: "component"
    name: "In-Memory Cache"
    technology: "Redis"
    description: "In-memory cache utilizing distributed locking (Redlock) for atomic appointment clash checks."
  - type: "component"
    name: "API Gateway"
    technology: "Gateway"
    description: "Routes client requests via mTLS."
relationships:
  - source: "API Gateway"
    destination: "Patient Registration Controller & Service"
    description: "Routes client requests [mTLS]"
  - type: "component"
    source: "Patient Registration Controller & Service"
    destination: "Patient Consent & Privacy Manager"
    description: "Validates consent metadata [Internal TypeScript Function Call]"
  - type: "component"
    source: "Patient Registration Controller & Service"
    destination: "Database Cluster"
    description: "Persists demographics [TypeORM / PostgreSQL protocol]"
  - type: "component"
    source: "Scheduling Engine & Resource Validator"
    destination: "In-Memory Cache"
    description: "Performs slot-locking and clash checks [Redis Protocol]"
  - type: "component"
    source: "Scheduling Engine & Resource Validator"
    destination: "Database Cluster"
    description: "Persists appointments and audit logs [TypeORM / PostgreSQL protocol]"
  - type: "component"
    source: "Scheduling Engine & Resource Validator"
    destination: "Message Broker"
    description: "Emits AppointmentBooked events [Kafka protocol]"