level: component
scope: "Component diagram for the Billing Service container"
parentContainer:
  name: "Billing Service"
elements:
  - type: "component"
    name: "Billing API Controller"
    technology: "FastAPI Router"
    description: "Handles incoming payment processing and insurance claims requests."
  - type: "component"
    name: "Audit Logging Interceptor"
    technology: "FastAPI Middleware"
    description: "Performs HIPAA-compliant audit logging for security and tracking."
  - type: "component"
    name: "Claim Processing Engine"
    technology: "Python Domain Service"
    description: "Processes insurance claims and core billing business logic."
  - type: "component"
    name: "Claims Transformer Component"
    technology: "Pydantic-based Schema Validator"
    description: "Validates and maps schemas for clinical and financial data integrity."
  - type: "component"
    name: "Payment Gateway Integration Client"
    technology: "HTTPS/REST Outbound Adapter"
    description: "Submits claims and processes payments via external payment gateways."
  - type: "component"
    name: "Billing Data Repository"
    technology: "SQLAlchemy ORM with asyncpg"
    description: "Executes persistent data storage operations with AES-256 encryption."
relationships:
  - source: "API Gateway"
    destination: "Billing API Controller"
    description: "Routes incoming financial and claim requests via mTLS"
  - source: "Audit Logging Interceptor"
    destination: "Message Broker (Kafka)"
    description: "Publishes immutable audit events asynchronously via AMQP/Kafka protocol"
  - source: "Claim Processing Engine"
    destination: "Claims Transformer Component"
    description: "Passes domain models for format mapping (X12 / HL7)"
  - source: "Payment Gateway Integration Client"
    destination: "External Payment Gateway"
    description: "Submits claims and processes payments via HTTPS/REST with TLS 1.3"
  - source: "Billing Data Repository"
    destination: "PostgreSQL Database Cluster"
    description: "Executes persistent data storage operations via PostgreSQL protocol with AES-256 encryption"