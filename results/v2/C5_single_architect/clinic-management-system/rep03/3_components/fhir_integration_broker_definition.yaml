level: component
scope: "Component diagram for the FHIR Integration Broker container"
parentContainer:
  name: "FHIR Integration Broker"
elements:
  - type: "component"
    name: "FHIR Route Mediator"
    technology: "Apache Camel"
    description: "Powers enterprise integration routing and mediation patterns for FHIR resource requests."
  - type: "component"
    name: "HL7/FHIR Validator Component"
    technology: "Java"
    description: "Performs internal synchronous validation of healthcare data."
  - type: "component"
    name: "Data Anonymization & Security Filter"
    technology: "Java"
    description: "Strictly enforces HIPAA and GDPR compliance requirements."
  - type: "component"
    name: "FHIR Event Consumer"
    technology: "Apache Camel JMS/Kafka Consumer"
    description: "Consumes asynchronous clinical domain events from the message broker."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / Nginx"
    description: "Forwards FHIR resource requests via mTLS / HTTPS."
  - type: "system"
    name: "External Labs & Imaging Systems"
    technology: "HL7 FHIR REST over HTTPS"
    description: "External systems receiving standardized bundles."
  - type: "container"
    name: "Message Broker"
    technology: "Kafka"
    description: "Enables asynchronous, decoupled clinical event processing for high availability."
  - type: "container"
    name: "Database Cluster"
    technology: "PostgreSQL"
    description: "Provides secure transactional audit log persistence via JDBC over TLS."
relationships:
  - source: "API Gateway"
    destination: "FHIR Route Mediator"
    description: "Forwards FHIR resource requests [mTLS / HTTPS]"
  - source: "FHIR Route Mediator"
    destination: "HL7/FHIR Validator Component"
    description: "Internal synchronous validation [Direct Java Route]"
  - source: "HL7/FHIR Validator Component"
    destination: "FHIR Route Mediator"
    description: "Internal synchronous validation [Direct Java Route]"
  - source: "FHIR Route Mediator"
    destination: "External Labs & Imaging Systems"
    description: "Dispatches standardized bundles [HL7 FHIR REST over HTTPS]"
  - source: "Message Broker"
    destination: "FHIR Event Consumer"
    description: "Consumes asynchronous clinical domain events [AMQP / Kafka Protocol]"
  - source: "FHIR Event Consumer"
    destination: "HL7/FHIR Validator Component"
    description: "Internal validation [Direct Java Route]"
  - source: "FHIR Route Mediator"
    destination: "Database Cluster"
    description: "Persists transaction audit logs [JDBC over TLS]"