level: component
scope: "Component diagram for the Database Cluster container"
parentContainer:
  name: "Database Cluster"
elements:
  - type: "component"
    name: "Primary Write Node"
    technology: "PostgreSQL 16 with Citus"
    description: "Executes ACID transactions and writes."
  - type: "component"
    name: "Read Replica Nodes"
    technology: "PostgreSQL 16"
    description: "Offloads non-blocking read queries."
  - type: "component"
    name: "Encryption & Key Manager Agent"
    technology: "PKCS#11 / Vault API"
    description: "Injects envelope keys for TDE at rest."
  - type: "component"
    name: "Distributed Consensus Manager"
    technology: "Patroni / etcd"
    description: "Handles heartbeating and state coordination."
relationships:
  - source: "Primary Write Node"
    destination: "Distributed Consensus Manager"
    description: "Heartbeating and state coordination [TCP/gRPC]"
  - source: "Distributed Consensus Manager"
    destination: "Primary Write Node"
    description: "Heartbeating and state coordination [TCP/gRPC]"
  - source: "Encryption & Key Manager Agent"
    destination: "Primary Write Node"
    description: "Injects envelope keys for TDE at rest [PKCS#11 / Vault API over TLS 1.3]"
  - source: "Encryption & Key Manager Agent"
    destination: "Read Replica Nodes"
    description: "Injects envelope keys for TDE at rest [PKCS#11 / Vault API over TLS 1.3]"