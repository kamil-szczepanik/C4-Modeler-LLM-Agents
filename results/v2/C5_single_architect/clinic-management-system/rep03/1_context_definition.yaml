level: context
scope: "System Context diagram for Clinic Management System"
system:
  name: "Clinic Management System"
  description: "A hybrid cloud platform that securely manages patient admissions, electronic medical records, scheduling, and billing for clinical environments while ensuring strict regulatory compliance, high availability, and interoperability."
elements:
  - type: "person"
    name: "Patient"
    description: "Accesses the system via Web or Mobile to manage admissions, scheduling, and records."
  - type: "person"
    name: "Clinician/Staff"
    description: "Accesses the system via Web to manage electronic medical records and clinical workflows."
  - type: "person"
    name: "Hospital Administrator"
    description: "Accesses the system via Web to oversee administration and system management."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Handles user authentication via OIDC/SAML with multi-factor authentication."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Processes billing and insurance claims."
  - type: "externalSystem"
    name: "External Labs & Imaging Systems"
    description: "Exchanges medical data using HL7 FHIR."
  - type: "externalSystem"
    name: "Regulatory Archiving / Audit Storage"
    description: "Replicates audit logs and records for 10-year retention."
relationships:
  - source: "Patient"
    destination: "Clinic Management System"
    description: "Accesses features via Web/Mobile"
    technology: "HTTPS"
  - source: "Clinician/Staff"
    destination: "Clinic Management System"
    description: "Accesses features via Web"
    technology: "HTTPS"
  - source: "Hospital Administrator"
    destination: "Clinic Management System"
    description: "Accesses features via Web"
    technology: "HTTPS"
  - source: "Clinic Management System"
    destination: "Identity Provider"
    description: "Authenticates users via OIDC/SAML with multi-factor auth"
    technology: "OIDC/SAML, HTTPS"
  - source: "Clinic Management System"
    destination: "Payment Gateway"
    description: "Submits billing and insurance claims"
    technology: "REST/TLS"
  - source: "Clinic Management System"
    destination: "External Labs & Imaging Systems"
    description: "Exchanges medical data"
    technology: "HL7 FHIR over TLS"
  - source: "External Labs & Imaging Systems"
    destination: "Clinic Management System"
    description: "Exchanges medical data"
    technology: "HL7 FHIR over TLS"
  - source: "Clinic Management System"
    destination: "Regulatory Archiving / Audit Storage"
    description: "Replicates audit logs and records for 10-year retention"
    technology: "HTTPS/TLS 1.3"