level: component
scope: "Component diagram for the Customer Portal container"
parentContainer:
  name: "Customer Portal"
elements:
  - type: "component"
    name: "Claim Submission UI"
    technology: "Vue.js/React, Azure Static Web Apps"
    description: "Renders multi-step claim forms and client-side validation."
  - type: "component"
    name: "Authentication Handler"
    technology: "OIDC Client Library"
    description: "Manages user sessions and JWT tokens."
  - type: "component"
    name: "API Client"
    technology: "Axios/Fetch wrapper"
    description: "Manages outgoing HTTP requests with retry interceptors."
  - type: "component"
    name: "Local Session Cache"
    technology: "IndexedDB / localStorage"
    description: "Persists draft submissions locally."
  - type: "person"
    name: "Customers & Brokers"
    technology: "Web Browser"
    description: "Users submitting insurance claims online."
  - type: "system"
    name: "Active Directory"
    technology: "Identity Provider"
    description: "Authenticates users via OIDC/OAuth2."
  - type: "container"
    name: "Migration Router"
    technology: "Hybrid Cloud Modernization Platform"
    description: "Routes claim requests to downstream systems."

relationships:
  - source: "Customers & Brokers"
    destination: "Claim Submission UI"
    description: "Claim submission [HTTPS]"
  - source: "Authentication Handler"
    destination: "Active Directory"
    description: "User authentication [OIDC/OAuth2]"
  - source: "API Client"
    destination: "Migration Router"
    description: "Routes claim requests [HTTPS/REST]"
  - source: "Claim Submission UI"
    destination: "Local Session Cache"
    description: "Persists draft data [Browser API]"
  - source: "API Client"
    destination: "Authentication Handler"
    description: "Attaches bearer tokens [In-Memory/JWT]"