level: component
scope: "Component diagram for the Integration Gateway & Sync Worker container"
parentContainer:
  name: "Integration Gateway & Sync Worker"
elements:
  - type: "component"
    name: "Mainframe Adapter Component"
    technology: "C# Azure Functions"
    description: "Forwards unmigrated claim traffic to legacy endpoints."
  - type: "component"
    name: "Sync Orchestrator Component"
    technology: "Azure Durable Functions"
    description: "Manages bulk data synchronization and batch reconciliation."
  - type: "component"
    name: "Outbox Processor Component"
    technology: "C# Azure Functions"
    description: "Publishes transactional messages to the message broker."
  - type: "component"
    name: "Circuit Breaker & Fallback Handler Component"
    technology: "C# Azure Functions"
    description: "Delegates outbound legacy calls with resilience policies."
relationships:
  - source: "Mainframe Adapter Component"
    destination: "Circuit Breaker & Fallback Handler Component"
    description: "Delegates outbound legacy calls [HTTPS/SOAP]"
  - source: "Outbox Processor Component"
    destination: "Azure Service Bus"
    description: "Publishes transactional messages [AMQP]"
  - source: "Circuit Breaker & Fallback Handler Component"
    destination: "Legacy Mainframe"
    description: "Invokes legacy endpoints with resilience policies [HTTPS/SOAP]"
  - source: "Sync Orchestrator Component"
    destination: "Legacy Mainframe"
    description: "Bulk data synchronization and batch reconciliation [DB2 Direct / SFTP]"