level: component
scope: "Component diagram for the Claims Core API container"
parentContainer:
  name: "Claims Core API"
elements:
  - type: "component"
    name: "Claim Management Controller"
    technology: "Spring MVC"
    description: "Spring MVC REST endpoints receiving payloads from the Adjuster Workspace and Migration Router."
  - type: "component"
    name: "Claim Domain Service"
    technology: "Spring Data Domain Service"
    description: "Enforces R-04 consistency constraints using CQRS (Write Model Handler and Read Model Projections)."
  - type: "component"
    name: "Legacy Anti-Corruption Layer (ACL)"
    technology: "Spring Integration"
    description: "Translates domain models for unmigrated claim types."
  - type: "component"
    name: "Claim Repository"
    technology: "Spring Data JPA"
    description: "Manages transactional persistence in Azure SQL."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Spring Cloud Stream"
    description: "Emits domain events to Azure Service Bus."
relationships:
  - source: "Claim Management Controller"
    destination: "Claim Domain Service"
    description: "Delegates request processing and payloads"
  - source: "Claim Domain Service"
    destination: "Claim Repository"
    description: "JDBC persistence calls to Azure SQL"
  - source: "Claim Domain Service"
    destination: "Legacy Anti-Corruption Layer (ACL)"
    description: "Internal method delegation for unmigrated types"
  - source: "Event Publisher Component"
    destination: "Azure Service Bus"
    description: "Asynchronous event publishing using AMQP"