level: component
scope: "Component diagram for the Adjuster Workspace container"
parentContainer:
  name: "Adjuster Workspace"
elements:
  - type: "component"
    name: "UI Controller / BFF Router"
    technology: "Node.js/Express"
    description: "Lightweight handling of HTTP requests, routing, and session management."
  - type: "component"
    name: "Claims Presentation Service"
    technology: "TypeScript/React"
    description: "Type-safe rendering of adjuster user interface views."
  - type: "component"
    name: "Local Cache & Read Model"
    technology: "Azure Cache for Redis"
    description: "In-memory storage for materialized views to bypass slow legacy latency."
  - type: "component"
    name: "Sync Consumer"
    technology: "Node.js worker"
    description: "Asynchronous background processing for cache synchronization via Azure Service Bus."
  - type: "component"
    name: "Mainframe Adapter Component"
    technology: "Node.js client module"
    description: "Adapts and communicates with legacy backend services."
relationships:
  - source: "UI Controller / BFF Router"
    destination: "Claims Presentation Service"
    description: "In-memory / Function call"
  - source: "Claims Presentation Service"
    destination: "Local Cache & Read Model"
    description: "TCP / Redis Protocol"
  - source: "Sync Consumer"
    destination: "Local Cache & Read Model"
    description: "TCP / Redis Protocol"
  - source: "UI Controller / BFF Router"
    destination: "Mainframe Adapter Component"
    description: "In-process"
  - source: "Mainframe Adapter Component"
    destination: "Migration Router"
    description: "HTTPS / REST"