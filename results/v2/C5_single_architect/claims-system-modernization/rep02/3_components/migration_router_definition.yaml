level: component
scope: "Component diagram for the Migration Router container"
parentContainer:
  name: "Migration Router"
elements:
  - type: "component"
    name: "Routing Controller"
    technology: "Spring Boot/Java"
    description: "Evaluates incoming claim types against the routing registry."
  - type: "component"
    name: "Feature Flag Manager"
    technology: "Redis Cache"
    description: "Enables instant fallback switchbacks to the mainframe within one day."
  - type: "component"
    name: "ACL Mapper"
    technology: "MapStruct"
    description: "Translates modern JSON payloads to legacy formats."
  - type: "component"
    name: "Audit & Failover Logger"
    technology: "Azure Cosmos DB"
    description: "Captures failed routing decisions and transient timeouts."
  - type: "container"
    name: "Claims Core API"
    technology: "Azure Services"
    description: "Modern backend services handling migrated claim types."
  - type: "container"
    name: "Integration Gateway & Sync Worker"
    technology: "Legacy Connector"
    description: "Mediates legacy mainframe requests."
relationships:
  - source: "Routing Controller"
    destination: "Feature Flag Manager"
    description: "Queries active routing rules [In-process/Jedis]"
  - source: "Routing Controller"
    destination: "ACL Mapper"
    description: "Transforms unrouted payloads [In-process]"
  - source: "Routing Controller"
    destination: "Claims Core API"
    description: "Forwards migrated types [gRPC over HTTP/2]"
  - source: "Routing Controller"
    destination: "Audit & Failover Logger"
    description: "Records routing telemetry and fallback events [gRPC/Queue]"
  - source: "Migration Router"
    destination: "Integration Gateway & Sync Worker"
    description: "Mediates legacy mainframe requests [HTTPS/SOAP]"