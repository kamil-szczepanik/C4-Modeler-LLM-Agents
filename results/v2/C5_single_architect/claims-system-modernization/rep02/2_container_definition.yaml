level: container
scope: "Container diagram for Insurance Claims Modernization Platform"
system:
  name: "Insurance Claims Modernization Platform"
elements:
  - type: "person"
    name: "Customers & Brokers"
    description: "External users submitting claims online."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users managing claims via the new web application."
  - type: "externalSystem"
    name: "Active Directory"
    description: "Enterprise identity provider for authentication."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premises COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "Azure Service Bus"
    description: "Enterprise messaging middleware for decoupled communication."
  - type: "container"
    name: "Customer Portal"
    technology: "Vue.js/React, Azure Static Web Apps"
    description: "Frontend for online claim submissions."
  - type: "container"
    name: "Adjuster Workspace"
    technology: "Node.js/Java BFF, Azure App Service"
    description: "Application handling claims processing for adjusters."
  - type: "container"
    name: "Migration Router"
    technology: "Azure Container Apps"
    description: "Anti-corruption layer for dynamic claim routing and rollbacks."
  - type: "container"
    name: "Claims Core API"
    technology: "Azure Container Apps, Azure SQL"
    description: "Microservices backed by transactional storage for migrated claims."
  - type: "container"
    name: "Integration Gateway & Sync Worker"
    technology: "Azure Functions"
    description: "Handles mainframe mediation and batch reconciliation."
relationships:
  - source: "Customers & Brokers"
    destination: "Customer Portal"
    description: "Claim submission"
    technology: "HTTPS"
  - source: "Claims Adjusters"
    destination: "Adjuster Workspace"
    description: "Claim processing with SSO"
    technology: "HTTPS / Active Directory SSO"
  - source: "Customer Portal"
    destination: "Migration Router"
    description: "Routes claim requests"
    technology: "HTTPS/REST"
  - source: "Adjuster Workspace"
    destination: "Migration Router"
    description: "Routes claim requests"
    technology: "HTTPS/REST"
  - source: "Migration Router"
    destination: "Claims Core API"
    description: "Internal communication for migrated claims"
    technology: "Internal REST/gRPC"
  - source: "Migration Router"
    destination: "Integration Gateway & Sync Worker"
    description: "Mediates legacy mainframe requests"
    technology: "HTTPS/SOAP"
  - source: "Integration Gateway & Sync Worker"
    destination: "Legacy Mainframe"
    description: "Data synchronization and batch processing"
    technology: "DB2/Batch protocols"
  - source: "Adjuster Workspace"
    destination: "Active Directory"
    description: "Authentication"
    technology: "HTTPS"