level: container
scope: "Container diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization"
elements:
  - type: "person"
    name: "Customer / Broker"
    description: "External actors submitting claims online."
  - type: "person"
    name: "Claims Adjuster"
    description: "Internal users handling claims."
  - type: "externalSystem"
    name: "Legacy Mainframe System"
    description: "On-premises COBOL/DB2 system."
  - type: "externalSystem"
    name: "Active Directory & Integration Gateway"
    description: "On-premises enterprise services and identity provider."
  - type: "container"
    name: "Web App Portal"
    technology: "React, Azure App Service"
    description: "Delivers sub-2s UI loads independently of backend latency."
  - type: "container"
    name: "Claims API Gateway / BFF"
    technology: ".NET Core, Azure API Management"
    description: "Provides robust API orchestration and security."
  - type: "container"
    name: "Core Claims Service"
    technology: ".NET Core, Azure Container Apps"
    description: "Serverless Kubernetes abstraction mitigating the team's low cloud experience."
  - type: "container"
    name: "Integration & Sync Service"
    technology: "Azure Service Bus, Azure Functions"
    description: "Asynchronous messaging guarantees transactional consistency and respects batch windows."
  - type: "container"
    name: "Feature Flag / Routing Service"
    technology: ".NET Core middleware, Azure App Configuration"
    description: "Enables the 1-day rollback requirement per claim type."
  - type: "container"
    name: "Claims Database"
    technology: "Azure SQL Database"
    description: "ACID compliance ensures no data loss during incremental migration."
relationships:
  - source: "Customer / Broker"
    destination: "Web App Portal"
    description: "Accesses portal to submit claims"
    technology: "HTTPS"
  - source: "Claims Adjuster"
    destination: "Web App Portal"
    description: "Accesses portal for claim workflows"
    technology: "HTTPS"
  - source: "Web App Portal"
    destination: "Claims API Gateway / BFF"
    description: "Communicates with API gateway"
    technology: "HTTPS"
  - source: "Claims API Gateway / BFF"
    destination: "Active Directory & Integration Gateway"
    description: "Authenticates users via Active Directory"
    technology: "OIDC/OAuth2"
  - source: "Claims API Gateway / BFF"
    destination: "Feature Flag / Routing Service"
    description: "Routes requests dynamically"
    technology: "gRPC/HTTPS"
  - source: "Feature Flag / Routing Service"
    destination: "Core Claims Service"
    description: "Directs claim traffic"
    technology: "gRPC/HTTPS"
  - source: "Feature Flag / Routing Service"
    destination: "Integration & Sync Service"
    description: "Directs claim traffic"
    technology: "gRPC/HTTPS"
  - source: "Core Claims Service"
    destination: "Claims Database"
    description: "Persists and retrieves data"
    technology: "TDS/ADO.NET"
  - source: "Integration & Sync Service"
    destination: "Active Directory & Integration Gateway"
    description: "Communicates with on-premises Integration Gateway"
    technology: "AMQP and HTTPS"
  - source: "Integration & Sync Service"
    destination: "Legacy Mainframe System"
    description: "Synchronizes data with legacy system"
    technology: "AMQP and HTTPS"