level: component
scope: "Component diagram for the Feature Flag / Routing Service container"
parentContainer:
  name: "Feature Flag / Routing Service"
elements:
  - type: "component"
    name: "Routing Engine Component"
    technology: ".NET Core"
    description: "Dynamically directs claim traffic between a modern Azure platform and an on-premise mainframe."
  - type: "component"
    name: "Configuration Cache Component"
    technology: "Azure App Configuration SDK with local JSON fallback"
    description: "Provides fast flag evaluation and offline resilience for dynamic rules."
  - type: "component"
    name: "Audit & Telemetry Component"
    technology: ".NET Core / Application Insights"
    description: "Emits telemetry asynchronously and tracks routing audit trails."
  - type: "component"
    name: "Circuit Breaker Component"
    technology: ".NET Polly"
    description: "Provides automated circuit breaking and failover."
  - type: "component"
    name: "Claims API Gateway / BFF"
    technology: "External System / BFF"
    description: "Invokes routing via gRPC/HTTPS."
  - type: "component"
    name: "Core Claims Service / Integration & Sync Service"
    technology: "External Services"
    description: "Receives directed claim traffic via gRPC/HTTPS."
  - type: "component"
    name: "Legacy Mainframe System"
    technology: "On-Premise Mainframe"
    description: "Receives rerouted traffic on failure via HTTPS."
relationships:
  - source: "Claims API Gateway / BFF"
    destination: "Routing Engine Component"
    description: "Invokes routing via gRPC/HTTPS"
  - source: "Routing Engine Component"
    destination: "Configuration Cache Component"
    description: "Reads dynamic rules via in-memory lookup"
  - source: "Routing Engine Component"
    destination: "Audit & Telemetry Component"
    description: "Emits telemetry asynchronously via .NET Channel/Queue"
  - source: "Routing Engine Component"
    destination: "Core Claims Service / Integration & Sync Service"
    description: "Directs claim traffic via gRPC/HTTPS"
  - source: "Circuit Breaker Component"
    destination: "Legacy Mainframe System"
    description: "Reroutes traffic on failure via HTTPS"