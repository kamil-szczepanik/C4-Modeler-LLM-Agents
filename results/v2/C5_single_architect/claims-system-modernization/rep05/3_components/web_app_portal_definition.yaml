level: component
scope: "Component diagram for the Web App Portal container"
parentContainer:
  name: "Web App Portal"
elements:
  - type: "component"
    name: "Authentication Wrapper"
    technology: "MSAL.js"
    description: "Authenticates users via SSO using OIDC/OAuth2 against Active Directory."
  - type: "component"
    name: "Claim Submission & Routing Module"
    technology: "React SPA"
    description: "Enables customers and brokers to submit claims online."
  - type: "component"
    name: "Adjuster Workspace Module"
    technology: "React SPA"
    description: "Provides claim workflows for claims adjusters."
  - type: "component"
    name: "Feature Flag Client"
    technology: "Azure App Configuration SDK"
    description: "Manages dynamic feature toggles and claim-type migrations."
relationships:
  - source: "Authentication Wrapper"
    destination: "Active Directory"
    description: "Authenticates users via SSO [OIDC/OAuth2]"
  - source: "Claim Submission & Routing Module"
    destination: "Claims API Gateway / BFF"
    description: "Communicates with backend APIs [HTTPS/REST]"
  - source: "Adjuster Workspace Module"
    destination: "Claims API Gateway / BFF"
    description: "Communicates with backend APIs [HTTPS/REST]"
  - source: "Feature Flag Client"
    destination: "Azure App Configuration"
    description: "Fetches dynamic configurations and feature flags"