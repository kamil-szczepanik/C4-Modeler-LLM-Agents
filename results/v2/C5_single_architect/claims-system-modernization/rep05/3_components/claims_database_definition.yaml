level: component
scope: "Component diagram for the Claims Database container"
parentContainer:
  name: "Claims Database"
elements:
  - type: "component"
    name: "Claim Repository Component"
    technology: ".NET Entity Framework Core"
    description: "Invokes data access and executes queries against the Azure SQL Storage Engine."
  - type: "component"
    name: "Audit & Reconciliation Component"
    technology: "Azure SQL Stored Procedures/Change Tracking"
    description: "Reads state snapshots from the claim repository for audit and reconciliation."
  - type: "component"
    name: "Migration Schema Versioning Component"
    technology: "FluentMigrator"
    description: "Manages migration schema versioning for the database."
  - type: "component"
    name: "Temporal History & Rollback Component"
    technology: "Azure SQL System-Versioned Temporal Tables"
    description: "Manages row versions and historical data for rollbacks."
relationships:
  - source: "Claim Repository Component"
    destination: "Temporal History & Rollback Component"
    description: "Manages row versions [In-Process / T-SQL]"
  - source: "Audit & Reconciliation Component"
    destination: "Claim Repository Component"
    description: "Reads state snapshots [In-Process / LINQ]"