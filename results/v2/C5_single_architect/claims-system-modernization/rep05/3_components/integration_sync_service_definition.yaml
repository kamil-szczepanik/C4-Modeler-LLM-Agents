level: component
scope: "Component diagram for the Integration & Sync Service container"
parentContainer:
  name: "Integration & Sync Service"
elements:
  - type: "component"
    name: "Sync Orchestrator Function"
    technology: ".NET 8 isolated durable functions"
    description: "Coordinating claim state synchronization."
  - type: "component"
    name: "Mainframe Adapter Component"
    technology: ".NET 8 component"
    description: "Managing protocol translation."
  - type: "component"
    name: "Outbox Event Publisher"
    technology: ".NET 8 component"
    description: "Consuming Azure Service Bus topics."
  - type: "component"
    name: "Idempotency & Deduplication Filter"
    technology: ".NET 8 middleware"
    description: "Validating message uniqueness against Azure SQL."
  - type: "component"
    name: "Integration Gateway"
    technology: "On-premises gateway"
    description: "Interfacing with the legacy mainframe."
relationships:
  - source: "Sync Orchestrator Function"
    destination: "Outbox Event Publisher"
    description: "Dispatches messages via Azure Service Bus [AMQP]"
  - source: "Sync Orchestrator Function"
    destination: "Idempotency & Deduplication Filter"
    description: "Validates message uniqueness via In-memory / gRPC"
  - source: "Mainframe Adapter Component"
    destination: "Integration Gateway"
    description: "Sends transactional payloads via HTTPS [REST/JSON] using mutual TLS (mTLS)"