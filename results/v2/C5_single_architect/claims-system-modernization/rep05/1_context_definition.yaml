# C4 Model: Level 1 - System Context
level: context
scope: "System Context diagram for Insurance Claims Modernization"
system:
  name: "New Claims Platform (Azure)"
  description: "Modern cloud platform gradually replacing a legacy COBOL/DB2 mainframe claims system, enabling online claim submission and adjuster workflows."
elements:
  - type: "person"
    name: "Customer / Broker"
    description: "External actors submitting claims online."
  - type: "person"
    name: "Claims Adjuster"
    description: "Internal users handling claims via the new web application."
  - type: "externalSystem"
    name: "Legacy Mainframe System (On-Premises)"
    description: "30-year-old COBOL/DB2 system of record maintained during the transition period."
  - type: "externalSystem"
    name: "Active Directory"
    description: "On-premises identity provider used for authentication."
  - type: "externalSystem"
    name: "Integration Gateway"
    description: "Anti-Corruption Layer managing communication boundaries and asynchronous messaging."
relationships:
  - source: "Customer / Broker"
    destination: "New Claims Platform (Azure)"
    description: "Submits claims online"
    technology: "HTTPS"
  - source: "Claims Adjuster"
    destination: "New Claims Platform (Azure)"
    description: "Handles claims via adjuster web UI workflows"
    technology: "HTTPS"
  - source: "New Claims Platform (Azure)"
    destination: "Active Directory"
    description: "Authenticates users via Single Sign-On"
    technology: "OIDC / SAML"
  - source: "New Claims Platform (Azure)"
    destination: "Legacy Mainframe System (On-Premises)"
    description: "Exchanges claims data asynchronously"
    technology: "Asynchronous SFTP, file drops, and message queues"