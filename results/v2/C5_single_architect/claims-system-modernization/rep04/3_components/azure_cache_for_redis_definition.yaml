level: component
scope: "Component diagram for the Azure Cache for Redis container"
parentContainer:
  name: "Azure Cache for Redis"
elements:
  - type: "component"
    name: "Redis Cache Engine"
    technology: "Azure Cache for Redis"
    description: "In-memory data store engine providing high-throughput and low-latency access for performance optimization."
  - type: "component"
    name: "Distributed Output Cache Provider"
    technology: ".NET Core Distributed Caching"
    description: "Provides distributed output caching support to accelerate response times across API endpoints."
  - type: "component"
    name: "Claim State Cache Manager"
    technology: ".NET Core Caching Service"
    description: "Manages transient claim state caching to ensure fast retrieval during active adjuster workflows."
relationships:
  - source: "Distributed Output Cache Provider"
    destination: "Redis Cache Engine"
    description: "Reads and writes cached HTTP outputs via RESP over TCP/TLS"
  - source: "Claim State Cache Manager"
    destination: "Redis Cache Engine"
    description: "Stores and invalidates claim session states via RESP over TCP/TLS"