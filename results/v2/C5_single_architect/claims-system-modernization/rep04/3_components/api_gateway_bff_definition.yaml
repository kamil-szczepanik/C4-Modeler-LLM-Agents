level: component
scope: "Component diagram for the API Gateway / BFF container"
parentContainer:
  name: "API Gateway / BFF"
elements:
  - type: "component"
    name: "Routing & Aggregation Controller"
    technology: ".NET Core / ASP.NET Web API"
    description: "Handles routing and aggregation of domain requests, forwarding to the migration router and interacting with Redis cache."
  - type: "component"
    name: "Authentication Middleware"
    technology: ".NET Core / Microsoft.Identity.Web"
    description: "Validates user sessions and authenticates against Active Directory using OIDC/OAuth2."
  - type: "component"
    name: "Response Caching & Transformation Service"
    technology: ".NET Core"
    description: "Transforms responses and provides caching mechanisms to meet performance requirements."
  - type: "component"
    name: "Async Polling / WebSocket Notifier"
    technology: ".NET Core / SignalR"
    description: "Dispatches async job statuses and sends background updates to clients via WebSockets."
relationships:
  - source: "Claims Web Application"
    destination: "Authentication Middleware"
    description: "validates session via [HTTPS/OIDC]"
  - source: "Claims Web Application"
    destination: "Async Polling / WebSocket Notifier"
    description: "receives background updates via [WebSockets/WSS]"
  - source: "Routing & Aggregation Controller"
    destination: "Azure Cache for Redis"
    description: "reads/writes UI state via [RESP]"
  - source: "Routing & Aggregation Controller"
    destination: "Migration Router / Anti-Corruption Layer"
    description: "forwards domain requests via [HTTPS/REST]"
  - source: "Routing & Aggregation Controller"
    destination: "Async Polling / WebSocket Notifier"
    description: "dispatches async job statuses via [Internal Channel]"
  - source: "API Gateway / BFF"
    destination: "Active Directory"
    description: "authenticates against [OIDC/OAuth2]"