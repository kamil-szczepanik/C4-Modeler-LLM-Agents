level: component
scope: "Component diagram for the Mainframe Integration Adapter container"
parentContainer:
  name: "Mainframe Integration Adapter"
elements:
  - type: "component"
    name: "Message Listener Component"
    technology: ".NET Background Service"
    description: "Listens for asynchronous messages from Azure Service Bus."
  - type: "component"
    name: "Translation & Mapping Engine"
    technology: "AutoMapper, C# Domain Logic"
    description: "Transforms payloads between modern formats and legacy copybooks."
  - type: "component"
    name: "Legacy Protocol Client"
    technology: "IBM MQ .NET Client"
    description: "Handles communication with the legacy mainframe using TCP/IBM MQ."
  - type: "component"
    name: "Resiliency & Circuit Breaker Component"
    technology: "Polly"
    description: "Provides resilience and circuit breaking for fault tolerance."
  - type: "component"
    name: "Audit & Reconciliation Logger"
    technology: "Entity Framework Core"
    description: "Logs audits and reconciliation data to the database."
relationships:
  - source: "Message Listener Component"
    destination: "Translation & Mapping Engine"
    description: "Passes messages for transformation"
  - source: "Translation & Mapping Engine"
    destination: "Legacy Protocol Client"
    description: "Sends mapped requests"
  - source: "Legacy Protocol Client"
    destination: "Legacy Mainframe (COBOL/DB2)"
    description: "Communicates via TCP/IBM MQ"
  - source: "Translation & Mapping Engine"
    destination: "Audit & Reconciliation Logger"
    description: "Sends execution details"
  - source: "Audit & Reconciliation Logger"
    destination: "Azure SQL Managed Instance"
    description: "Persists logs via T-SQL"