    name: "Claim Submission Module"
    technology: "React"
    description: "React wizard-style forms for online submissions."
  - type: "component"
    name: "Adjuster Dashboard & Case Workspace"
    technology: "React"
    description: "React UI for claims handling."
  - type: "component"
    name: "Optimistic UI / Cache State Manager"
