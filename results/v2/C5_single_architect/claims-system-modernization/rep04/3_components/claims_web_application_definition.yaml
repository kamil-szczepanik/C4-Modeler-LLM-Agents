    name: "Offline Draft Storage"
    technology: "React / IndexedDB via Dexie.js"
    description: "Persistent local draft saves and offline resilience."
relationships:
  - source: "Claim Submission Module"
    destination: "Optimistic UI / Cache State Manager"
    description: "Updates state via"
  - source: "Adjuster Dashboard & Case Workspace"
    destination: "Optimistic UI / Cache State Manager"
    description: "Fetches and updates data via"
  - source: "Auth Client"
    destination: "Active Directory"
    description: "Authenticate via [OIDC/OAuth2]"
  - source: "Claims Web Application"
    destination: "API Gateway / BFF"
    description: "Interacts via [HTTPS/REST]"