level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Claim Entity Store"
    technology: "Azure SQL Managed Instance"
    description: "Stores core claim entity data providing strong ACID guarantees and transactional consistency."
  - type: "component"
    name: "Migration Sync Tracker"
    technology: "Azure SQL Managed Instance"
    description: "Tracks synchronization state between the legacy mainframe and the modern Azure platform."
  - type: "component"
    name: "Audit Log Store"
    technology: "Azure SQL Managed Instance"
    description: "Maintains immutable audit logs for compliance and traceability."
  - type: "component"
    name: "Outbox Store"
    technology: "Azure SQL Managed Instance"
    description: "Implements the transactional outbox pattern for reliable message dispatch."
  - type: "component"
    name: "Outbox Publisher"
    technology: ".NET Core"
    description: "Dispatches events from the Outbox Store to Azure Service Bus."
relationships:
  - source: "Outbox Publisher"
    destination: "Azure Service Bus"
    description: "Dispatches events via [AMQP]"