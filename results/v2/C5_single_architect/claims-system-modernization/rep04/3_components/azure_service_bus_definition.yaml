level: component
scope: "Component diagram for the Azure Service Bus container"
parentContainer:
  name: "Azure Service Bus"
elements:
  - type: "component"
    name: "Claim Submission Topic"
    technology: "Azure Service Bus Topic"
    description: "Receives published claim events from the Migration Router via AMQP/TLS and handles routing filter rules."
  - type: "component"
    name: "Mainframe Relay Queues"
    technology: "Azure Service Bus Queue"
    description: "Queues messages to forward them to the Mainframe Integration Adapter via AMQP/HTTPS."
  - type: "component"
    name: "Dead-Letter Subsystems"
    technology: "Azure Service Bus Dead-Letter Queue"
    description: "Captures and isolates undeliverable messages to ensure zero data loss requirements (R-04)."
  - type: "component"
    name: "Routing Filter Rules"
    technology: "Azure Service Bus Filters"
    description: "Evaluates and directs messages to appropriate downstream queues based on claim type and migration status."
relationships:
  - source: "Claim Submission Topic"
    destination: "Mainframe Relay Queues"
    description: "Forwards messages"
  - source: "Claim Submission Topic"
    destination: "Dead-Letter Subsystems"
    description: "Routes failed messages"
  - source: "Routing Filter Rules"
    destination: "Claim Submission Topic"
    description: "Applies routing logic"