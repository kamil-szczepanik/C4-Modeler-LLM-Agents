level: context
scope: "System Context diagram for Insurance Claims Modernization Platform"
system:
  name: "Insurance Claims Modernization Platform"
  description: "A hybrid microservices platform deployed on Azure West Europe that gradually replaces a legacy COBOL/DB2 mainframe system, enabling online claim submission and adjuster workflows."
elements:
  - type: "person"
    name: "Customers & Brokers"
    description: "External users submitting claims online via web interfaces."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff handling claims via the new web application."
  - type: "externalSystem"
    name: "Legacy Mainframe (COBOL/DB2)"
    description: "On-premises system of record."
  - type: "externalSystem"
    name: "Active Directory"
    description: "Enterprise identity provider for authentication."
  - type: "externalSystem"
    name: "Azure API Management"
    description: "Integration gateway acting as an anti-corruption layer."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External supporting system for payment processing."
  - type: "externalSystem"
    name: "Document Management System"
    description: "On-premises supporting system for document handling."
relationships:
  - source: "Customers & Brokers"
    destination: "Insurance Claims Modernization Platform"
    description: "interact with the Modernization Platform for claim submission"
    technology: "HTTPS"
  - source: "Claims Adjusters"
    destination: "Insurance Claims Modernization Platform"
    description: "access the Modernization Platform for claim management"
    technology: "HTTPS"
  - source: "Insurance Claims Modernization Platform"
    destination: "Active Directory"
    description: "authenticates users against Active Directory"
    technology: "OpenID Connect / SAML"
  - source: "Insurance Claims Modernization Platform"
    destination: "Legacy Mainframe (COBOL/DB2)"
    description: "integrates with the Legacy Mainframe via asynchronous messaging and batch interfaces"
    technology: "Asynchronous Messaging / Batch"
  - source: "Insurance Claims Modernization Platform"
    destination: "Payment Gateway"
    description: "connects to the Payment Gateway"
    technology: "HTTPS / REST"
  - source: "Insurance Claims Modernization Platform"
    destination: "Document Management System"
    description: "connects to the Document Management System"
    technology: "gRPC"