level: container
scope: "Container diagram for Insurance Claims Modernization Platform"
system:
  name: "Insurance Claims Modernization Platform"
elements:
  - type: "person"
    name: "Customers & Brokers"
    description: "External users submitting claims online."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff handling claims workflows."
  - type: "externalSystem"
    name: "Legacy Mainframe (COBOL/DB2)"
    description: "On-premise legacy system of record."
  - type: "externalSystem"
    name: "Active Directory"
    description: "Identity Provider for authentication."
  - type: "container"
    name: "Claims Web Application"
    technology: "React, Azure Static Web Apps"
    description: "Modern web frontend for online claim submission and adjuster workflows."
  - type: "container"
    name: "API Gateway / BFF"
    technology: "Azure Container Apps, .NET Core"
    description: "Backend for frontend handling client requests and routing."
  - type: "container"
    name: "Migration Router / Anti-Corruption Layer"
    technology: "Azure Container Apps, .NET Core"
    description: "Isolates legacy mainframe constraints and routes incremental claim migrations."
  - type: "container"
    name: "Mainframe Integration Adapter"
    technology: "Azure Container Apps, .NET Core"
    description: "Adapts modern messages for legacy mainframe integration."
  - type: "container"
    name: "Azure Service Bus"
    technology: "Messaging Container"
    description: "Decouples systems and buffers messages."
  - type: "container"
    name: "Azure Cache for Redis"
    technology: "Caching Container"
    description: "Caches slow data for sub-2s adjuster screen loads."
  - type: "container"
    name: "Database"
    technology: "Azure SQL Managed Instance"
    description: "Stores modern claim data with strong consistency guarantees."
relationships:
  - source: "Customers & Brokers"
    destination: "Claims Web Application"
    description: "interact with"
    technology: "HTTPS"
  - source: "Claims Adjusters"
    destination: "Claims Web Application"
    description: "interact with"
    technology: "HTTPS"
  - source: "Claims Web Application"
    destination: "API Gateway / BFF"
    description: "interacts with"
    technology: "HTTPS/REST"
  - source: "API Gateway / BFF"
    destination: "Azure Cache for Redis"
    description: "interacts with"
    technology: "RESP"
  - source: "API Gateway / BFF"
    destination: "Migration Router / Anti-Corruption Layer"
    description: "interacts with"
    technology: "HTTPS/REST"
  - source: "Migration Router / Anti-Corruption Layer"
    destination: "Database"
    description: "interacts with"
    technology: "TDS"
  - source: "Migration Router / Anti-Corruption Layer"
    destination: "Azure Service Bus"
    description: "interacts with"
    technology: "AMQP/HTTPS"
  - source: "Azure Service Bus"
    destination: "Mainframe Integration Adapter"
    description: "interacts with"
    technology: "AMQP/HTTPS"
  - source: "Mainframe Integration Adapter"
    destination: "Legacy Mainframe (COBOL/DB2)"
    description: "interacts with"
    technology: "TCP/MQ or SFTP"
  - source: "Claims Web Application"
    destination: "Active Directory"
    description: "authenticate against"
    technology: "OIDC/OAuth2"
  - source: "API Gateway / BFF"
    destination: "Active Directory"
    description: "authenticate against"
    technology: "OIDC/OAuth2"