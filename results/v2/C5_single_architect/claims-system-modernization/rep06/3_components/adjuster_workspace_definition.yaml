level: component
scope: "Component diagram for the Adjuster Workspace container"
parentContainer:
  name: "Adjuster Workspace"
elements:
  - type: "component"
    name: "SPA Frontend"
    technology: "React and TypeScript"
    description: "Responsive single-page web application running in the browser for claims adjusters."
  - type: "component"
    name: "Workspace API Controller"
    technology: ".NET Core"
    description: "Backend handling orchestration and API requests."
  - type: "component"
    name: "Claim Cache Service"
    technology: "Azure Cache for Redis (Standard Tier)"
    description: "Low-latency state storage for fast data retrieval."
  - type: "component"
    name: "Auth Handler"
    technology: ".NET Core middleware"
    description: "Handles authentication and token validation."
  - type: "component"
    name: "Claims Anti-Corruption Layer / Core Domain Service"
    technology: "Azure Container Apps"
    description: "Handles domain logic and communication with core systems."
  - type: "component"
    name: "Integration & Sync Engine"
    technology: "Azure Service Bus and Azure Functions"
    description: "Manages data synchronization and cache invalidation events."
relationships:
  - source: "SPA Frontend"
    destination: "Workspace API Controller"
    description: "REST over HTTPS/JSON"
  - source: "Workspace API Controller"
    destination: "Claim Cache Service"
    description: "In-memory TCP reads/writes"
  - source: "Workspace API Controller"
    destination: "Claims Anti-Corruption Layer / Core Domain Service"
    description: "REST/gRPC over HTTPS"
  - source: "Integration & Sync Engine"
    destination: "Claim Cache Service"
    description: "Cache invalidation events via AMQP (Azure Service Bus)"
  - source: "Auth Handler"
    destination: "Insurer's Active Directory"
    description: "Token validation via OpenID Connect (HTTPS)"