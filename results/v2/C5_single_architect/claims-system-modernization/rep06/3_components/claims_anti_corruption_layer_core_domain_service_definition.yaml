level: component
scope: "Component diagram for the Claims Anti-Corruption Layer / Core Domain Service container"
parentContainer:
  name: "Claims Anti-Corruption Layer / Core Domain Service"
elements:
  - type: "component"
    name: "Claim Domain Model Component"
    technology: ".NET Core / C#"
    description: "Encapsulates the core business logic and domain model for claims processing."
  - type: "component"
    name: "ACL Translator Component"
    technology: ".NET Core / C#"
    description: "Translates modern domain models to and from legacy mainframe data formats."
  - type: "component"
    name: "Mainframe Adapter Component"
    technology: ".NET Core / C#"
    description: "Handles communication and resilient retries with the legacy mainframe."
  - type: "component"
    name: "Repository Component"
    technology: "EF Core"
    description: "Manages relational persistence of claim data in the Azure SQL Database."
  - type: "component"
    name: "Outbox Pattern Component"
    technology: "EF Core"
    description: "Ensures reliable message publishing and consistency using the outbox pattern."
relationships:
  - source: "Claim Domain Model Component"
    destination: "Repository Component"
    description: "Persists and retrieves data via"
  - source: "Claim Domain Model Component"
    destination: "Outbox Pattern Component"
    description: "Queues messages for integration via"
  - source: "ACL Translator Component"
    destination: "Claim Domain Model Component"
    description: "Maps data to and from"
  - source: "Mainframe Adapter Component"
    destination: "ACL Translator Component"
    description: "Sends translated data to"