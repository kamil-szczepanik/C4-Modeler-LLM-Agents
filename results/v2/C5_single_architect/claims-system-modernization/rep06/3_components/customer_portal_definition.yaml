level: component
scope: "Component diagram for the Customer Portal container"
parentContainer:
  name: "Customer Portal"
elements:
  - type: "component"
    name: "Claim Frontend UI"
    technology: "React"
    description: "React single-page application rendering dynamic claim forms."
  - type: "component"
    name: "Authentication Middleware"
    technology: "Node.js / OpenID Connect / Azure App Service Easy Auth"
    description: "Node.js module handling OpenID Connect and SSO integration."
  - type: "component"
    name: "Claim Submission Controller"
    technology: "Node.js / Express"
    description: "Node.js Backend-for-Frontend managing claim payload validation and routing."
  - type: "component"
    name: "Claim Type Configuration Client"
    technology: "JavaScript / React"
    description: "Component fetching dynamic claim-type schemas at runtime."
relationships:
  - source: "Claim Frontend UI"
    destination: "Authentication Middleware"
    description: "Authenticates user session [HTTPS]"
  - source: "Claim Frontend UI"
    destination: "Claim Submission Controller"
    description: "Submits claim data [HTTPS/JSON]"
  - source: "Claim Frontend UI"
    destination: "Claims Anti-Corruption Layer"
    description: "Fetches dynamic claim form schemas [HTTPS/REST]"
  - source: "Claim Submission Controller"
    destination: "Claims Anti-Corruption Layer"
    description: "Forwards validated claims [HTTPS/REST]"
  - source: "API Gateway"
    destination: "Customer Portal"
    description: "Routes incoming external traffic [HTTPS]"