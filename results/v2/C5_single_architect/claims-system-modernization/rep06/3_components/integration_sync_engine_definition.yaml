level: component
scope: "Component diagram for the Integration & Sync Engine container"
parentContainer:
  name: "Integration & Sync Engine"
elements:
  - type: "component"
    name: "Inbound Event Consumer"
    technology: "Azure Function"
    description: "Consumes inbound events via Azure Service Bus and processes them."
  - type: "component"
    name: "Mainframe Batch Staging Repository"
    technology: "Azure SQL / Cosmos DB"
    description: "Acts as a local buffer to decouple real-time events from the rigid mainframe batch window."
  - type: "component"
    name: "Outbound Sync Orchestrator"
    technology: "Azure Function / Durable Functions"
    description: "Orchestrates outbound synchronization to the legacy mainframe."
  - type: "component"
    name: "Reconciliation & Dead Letter Monitor"
    technology: "Azure Function / Timer Trigger"
    description: "Monitors dead letters and performs reconciliation between systems."
  - type: "component"
    name: "Legacy Mainframe"
    technology: "COBOL/DB2, On-Premises"
    description: "Legacy on-premises mainframe system."
  - type: "component"
    name: "Core Domain Service"
    technology: "Azure Container Apps"
    description: "Core domain services running in Azure Container Apps."
relationships:
  - source: "Core Domain Service"
    destination: "Inbound Event Consumer"
    description: "AMQP / Azure Service Bus"
  - source: "Inbound Event Consumer"
    destination: "Mainframe Batch Staging Repository"
    description: "Entity Framework Core / SQL"
  - source: "Outbound Sync Orchestrator"
    destination: "Mainframe Batch Staging Repository"
    description: "Entity Framework Core / SQL"
  - source: "Outbound Sync Orchestrator"
    destination: "Legacy Mainframe"
    description: "SFTP / IBM MQ"
  - source: "Reconciliation & Dead Letter Monitor"
    destination: "Mainframe Batch Staging Repository"
    description: "SQL"
  - source: "Reconciliation & Dead Letter Monitor"
    destination: "Legacy Mainframe"
    description: "SFTP/Query - Read-Only"