level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing & Aggregation Component"
    technology: "Azure API Management"
    description: "Routes requests to appropriate backend services and aggregates responses."
  - type: "component"
    name: "Authentication & Authorization Component"
    technology: "Azure API Management / OAuth2 / OpenID Connect"
    description: "Authenticates users via SSO with the Insurer's Active Directory."
  - type: "component"
    name: "Rate Limiting & Throttling Component"
    technology: "Azure API Management"
    description: "Protects backend systems by limiting and throttling incoming request rates."
  - type: "component"
    name: "Request Transformation Component"
    technology: "Azure API Management"
    description: "Transforms request formats between clients and internal services."
  - type: "component"
    name: "Monitoring & Analytics Component"
    technology: "Azure API Management / Azure Application Insights"
    description: "Monitors traffic, performance, and tracks latency against constraints."
relationships:
  - source: "Routing & Aggregation Component"
    destination: "Customer Portal"
    description: "Routes requests to customer portal [HTTPS]"
  - source: "Routing & Aggregation Component"
    destination: "Adjuster Workspace"
    description: "Routes requests to adjuster workspace [HTTPS]"
  - source: "Authentication & Authorization Component"
    destination: "Insurer's Active Directory"
    description: "Authenticates users via SSO [OAuth2 / OpenID Connect]"
  - source: "Routing & Aggregation Component"
    destination: "Claims Anti-Corruption Layer"
    description: "Routes direct API traffic for migrated claim types [HTTPS / REST]"
  - source: "Routing & Aggregation Component"
    destination: "Integration & Sync Engine"
    description: "Forwards asynchronous event triggers [HTTPS / AMQP]"