level: context
scope: "System Context diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization"
  description: "Gradually replaces a legacy COBOL/DB2 mainframe with a cloud-native Azure platform while maintaining dual-system operations for online claims submission and adjuster workflows."
elements:
  - type: "person"
    name: "Customer/Broker"
    description: "Submits online claims and interacts with the customer portal."
  - type: "person"
    name: "Claims Adjuster"
    description: "Manages claims and performs adjuster workflows using the web application."
  - type: "externalSystem"
    name: "Insurer's Active Directory"
    description: "Provides SSO authentication for users."
  - type: "externalSystem"
    name: "Legacy Mainframe (COBOL/DB2, On-Premises)"
    description: "On-premises legacy mainframe handling backend data and batch processing."
  - type: "container"
    name: "Customer Portal"
    description: "Web portal for online claim submission."
    technology: "HTTPS/REST"
  - type: "container"
    name: "Adjuster Web Application"
    description: "Web application for claim management by adjusters."
    technology: "HTTPS"
  - type: "container"
    name: "Claims Core Service"
    description: "Core service for processing claims on the modern platform."
    technology: "Azure Cloud-Native"
  - type: "container"
    name: "Enterprise ESB / Integration Middleware"
    description: "Integration middleware for messaging and connectivity between systems."
    technology: "On-Premises Middleware"
  - type: "container"
    name: "Data Synchronization & Routing Service"
    description: "Anti-Corruption Layer for data consistency and routing."
    technology: "Azure Integration"
relationships:
  - source: "Customer/Broker"
    destination: "Customer Portal"
    description: "Online claim submission"
    technology: "HTTPS/REST"
  - source: "Claims Adjuster"
    destination: "Adjuster Web Application"
    description: "Claim management"
    technology: "HTTPS"
  - source: "Adjuster Web Application"
    destination: "Insurer's Active Directory"
    description: "SSO authentication"
    technology: "HTTPS"
  - source: "Claims Core Service"
    destination: "Enterprise ESB / Integration Middleware"
    description: "Asynchronous messaging and REST APIs"
    technology: "REST APIs / Asynchronous messaging"
  - source: "Enterprise ESB / Integration Middleware"
    destination: "Legacy Mainframe (COBOL/DB2, On-Premises)"
    description: "Batch files and DB2 integration during the 23:00-05:00 window"
    technology: "Batch files / DB2 integration"