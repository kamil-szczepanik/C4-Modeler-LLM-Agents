level: container
scope: "Container diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization"
elements:
  - type: "person"
    name: "Customer / Broker"
    description: "Submits online claims and interacts with the customer portal."
  - type: "person"
    name: "Claims Adjuster"
    description: "Manages claims and performs adjuster workflows using the workspace."
  - type: "externalSystem"
    name: "Insurer's Active Directory"
    description: "Provides SSO authentication and security directory services."
  - type: "externalSystem"
    name: "Legacy Mainframe COBOL/DB2"
    description: "On-premises legacy mainframe handling core backend data."
  - type: "container"
    name: "API Gateway"
    technology: "Azure API Management"
    description: "Single HTTPS entry point for security, rate limiting, and SSO."
  - type: "container"
    name: "Customer Portal"
    technology: "Azure App Service - React/Node.js"
    description: "Web portal enabling online claim submission."
  - type: "container"
    name: "Adjuster Workspace"
    technology: "Azure App Service - React/.NET Core API"
    description: "Workspace application for claims adjusters."
  - type: "container"
    name: "Claims Anti-Corruption Layer / Core Domain Service"
    technology: "Azure Container Apps - .NET Core"
    description: "Runs the Anti-Corruption Layer with manageable abstractions."
  - type: "container"
    name: "Integration & Sync Engine"
    technology: "Azure Service Bus + Azure Functions"
    description: "Provides reliable messaging for zero claim loss and data synchronization."
relationships:
  - source: "Customer / Broker"
    destination: "API Gateway"
    description: "Submits online claims and interacts"
    technology: "HTTPS"
  - source: "Claims Adjuster"
    destination: "API Gateway"
    description: "Processes claims and interacts"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Customer Portal"
    description: "Routes requests to customer portal"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Adjuster Workspace"
    description: "Routes requests to adjuster workspace"
    technology: "HTTPS"
  - source: "Customer Portal"
    destination: "Claims Anti-Corruption Layer / Core Domain Service"
    description: "Sends claim data for processing"
    technology: "HTTPS"
  - source: "Adjuster Workspace"
    destination: "Claims Anti-Corruption Layer / Core Domain Service"
    description: "Sends and retrieves claim data"
    technology: "HTTPS"
  - source: "Claims Anti-Corruption Layer / Core Domain Service"
    destination: "Integration & Sync Engine"
    description: "Publishes integration and sync messages"
    technology: "AMQP / Azure Service Bus"
  - source: "API Gateway"
    destination: "Insurer's Active Directory"
    description: "Authenticates users via SSO"
    technology: "OAuth2 / OpenID Connect"
  - source: "Integration & Sync Engine"
    destination: "Legacy Mainframe COBOL/DB2"
    description: "Synchronizes data and transfers files"
    technology: "Batch/File Transfer"