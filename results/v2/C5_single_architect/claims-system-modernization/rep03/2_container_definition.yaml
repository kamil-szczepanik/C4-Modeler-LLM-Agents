level: container
scope: "Container diagram for Insurance Claims Modernization"
system:
  name: "Modern Claims Platform"
elements:
  - type: "person"
    name: "Customer / Broker"
    description: "External actors submitting claims online."
  - type: "person"
    name: "Claims Adjuster"
    description: "Internal users handling claims via the new web application."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premises COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "Anti-Corruption Layer (ACL)"
    description: "Isolation layer mitigating mainframe schema volatility."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Microsoft Entra ID / OpenID Connect handling authentication."
  - type: "container"
    name: "Customer Portal"
    technology: "Azure Static Web Apps / React"
    description: "Enables online claims submission for customers and brokers."
  - type: "container"
    name: "Adjuster Workspace"
    technology: "Azure Container Apps / .NET Core"
    description: "Allows internal users to handle claims via the new web application."
  - type: "container"
    name: "API Gateway"
    technology: "Azure Container Apps / .NET Yit"
    description: "Routes client requests to internal services and orchestrates communication."
  - type: "container"
    name: "Claims Core Service"
    technology: "Azure Container Apps / .NET Core"
    description: "Handles core business logic and claims processing."
  - type: "container"
    name: "Integration Message Broker"
    technology: "Azure Service Bus"
    description: "Ensures reliable at-least-once asynchronous message delivery."
  - type: "container"
    name: "Database"
    technology: "Azure SQL Database / EF Core"
    description: "Relational storage supporting CQRS read models."
relationships:
  - source: "Customer / Broker"
    destination: "Customer Portal"
    description: "Submits claims online"
    technology: "HTTPS"
  - source: "Claims Adjuster"
    destination: "Adjuster Workspace"
    description: "Handles claims workflows"
    technology: "HTTPS/WSS"
  - source: "Customer Portal"
    destination: "API Gateway"
    description: "API requests"
    technology: "HTTPS/WSS"
  - source: "Adjuster Workspace"
    destination: "API Gateway"
    description: "API requests"
    technology: "HTTPS/WSS"
  - source: "API Gateway"
    destination: "Claims Core Service"
    description: "Routes claims requests"
    technology: "gRPC/HTTP"
  - source: "API Gateway"
    destination: "Adjuster Workspace"
    description: "Direct routing or callbacks"
    technology: "gRPC/HTTP"
  - source: "API Gateway"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OpenID Connect"
  - source: "Identity Provider"
    destination: "API Gateway"
    description: "Token validation"
    technology: "OpenID Connect"
  - source: "Claims Core Service"
    destination: "Integration Message Broker"
    description: "Publishes and consumes messages"
    technology: "AMQP"
  - source: "Integration Message Broker"
    destination: "Claims Core Service"
    description: "Delivers messages"
    technology: "AMQP"
  - source: "Integration Message Broker"
    destination: "Anti-Corruption Layer (ACL)"
    description: "Forwards integration events"
    technology: "AMQP"
  - source: "Anti-Corruption Layer (ACL)"
    destination: "Legacy Mainframe"
    description: "Synchronizes data with system of record"
    technology: "MQ/File Transfer"
  - source: "Claims Core Service"
    destination: "Database"
    description: "Reads and writes claim data"
    technology: "EF Core / TDS"