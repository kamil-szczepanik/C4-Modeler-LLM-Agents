level: context
scope: "System Context diagram for Insurance Claims Modernization"
system:
  name: "Modern Claims Platform"
  description: "Azure-hosted system replacing a 30-year-old COBOL/DB2 mainframe to enable online claims submission and adjuster workflows while ensuring continuous legacy operation and strict data consistency."
elements:
  - type: "person"
    name: "Customer / Broker"
    description: "External actors submitting claims online."
  - type: "person"
    name: "Claims Adjuster"
    description: "Internal users handling claims via the new web application."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premises COBOL/DB2 system of record."
  - type: "externalSystem"
    name: "Anti-Corruption Layer (ACL)"
    description: "Isolation layer mitigating mainframe schema volatility."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Insurer Active Directory / Azure AD handling authentication."
relationships:
  - source: "Customer / Broker"
    destination: "Modern Claims Platform"
    description: "Claim submission"
    technology: "HTTPS/REST"
  - source: "Claims Adjuster"
    destination: "Modern Claims Platform"
    description: "Web application access under 2s"
    technology: "HTTPS"
  - source: "Modern Claims Platform"
    destination: "Anti-Corruption Layer (ACL)"
    description: "Internal communication for claims data sync"
    technology: "Internal REST/Messaging"
  - source: "Anti-Corruption Layer (ACL)"
    destination: "Legacy Mainframe"
    description: "Asynchronous state synchronization"
    technology: "HTTPS/REST and MQ"
  - source: "Modern Claims Platform"
    destination: "Identity Provider"
    description: "Single Sign-On authentication"
    technology: "OpenID Connect / SAML"