level: component
scope: "Component diagram for the Claims Core Service container"
parentContainer:
  name: "Claims Core Service"
elements:
  - type: "component"
    name: "Claim Submission Controller"
    technology: ".NET Core API"
    description: "Handles incoming claim submission requests."
  - type: "component"
    name: "Claims Router / Strategy Selector"
    technology: ".NET Core"
    description: "Evaluates and routes claims to either modern workflows or the mainframe."
  - type: "component"
    name: "Claim Workflow Engine"
    technology: ".NET Core / Workflow Core"
    description: "Executes modern claim workflows and manages complex state transitions."
  - type: "component"
    name: "Data Access Repository"
    technology: "Entity Framework Core"
    description: "Persists state and domain models using Azure SQL Database."
  - type: "component"
    name: "Mainframe Sync Publisher"
    technology: ".NET Core"
    description: "Synchronizes state with the legacy mainframe system."
  - type: "component"
    name: "Outbox Processor"
    technology: ".NET Core Background Service"
    description: "Processes transactional outbox events to ensure reliable messaging."
  - type: "component"
    name: "Mainframe Anti-Corruption Client"
    technology: ".NET Core"
    description: "Forwards unmigrated claims to the legacy mainframe."
relationships:
  - source: "API Gateway"
    destination: "Claim Submission Controller"
    description: "Routes incoming requests [gRPC]"
  - source: "Claim Submission Controller"
    destination: "Claims Router / Strategy Selector"
    description: "Forwards requests for evaluation [In-Memory]"
  - source: "Claims Router / Strategy Selector"
    destination: "Claim Workflow Engine"
    description: "Executes modern claim workflows [In-Memory]"
  - source: "Claims Router / Strategy Selector"
    destination: "Mainframe Anti-Corruption Client"
    description: "Forwards unmigrated claims [HTTP/AMQP]"
  - source: "Claim Workflow Engine"
    destination: "Data Access Repository"
    description: "Persists state and domain models [EF Core / TDS]"
  - source: "Data Access Repository"
    destination: "Outbox Processor"
    description: "Stores transactional outbox events [EF Core / TDS]"
  - source: "Outbox Processor"
    destination: "Integration Message Broker"
    description: "Publishes reliable domain events [AMQP]"
  - source: "Mainframe Sync Publisher"
    destination: "Integration Message Broker"
    description: "Synchronizes state with legacy system [AMQP]"