level: component
scope: "Component diagram for the Adjuster Workspace container"
parentContainer:
  name: "Adjuster Workspace"
elements:
  - type: "component"
    name: "UI Shell"
    technology: "React SPA"
    description: "Modern client-side rendering enabling claims adjusters to process claims efficiently."
  - type: "component"
    name: "BFF API Controller"
    technology: ".NET Core"
    description: "Backend-for-Frontend API controller that isolates the user interface from high-latency backend systems."
  - type: "component"
    name: "Event-Driven Sync Worker"
    technology: ".NET Core Background Service"
    description: "Background service that consumes claim events and updates cached view models."
  - type: "component"
    name: "Async View Model Cache"
    technology: "Azure Cache for Redis"
    description: "Caches pre-aggregated claim states for sub-millisecond read performance."
  - type: "component"
    name: "ACL Integration Client"
    technology: ".NET Core / gRPC"
    description: "Handles integration and secure inter-service communication."
relationships:
  - source: "UI Shell"
    destination: "BFF API Controller"
    description: "API requests [HTTPS/REST]"
  - source: "BFF API Controller"
    destination: "Async View Model Cache"
    description: "Read/Write pre-aggregated claim states [TCP]"
  - source: "BFF API Controller"
    destination: "API Gateway"
    description: "Outbound commands [gRPC/HTTPS]"
  - source: "Integration Message Broker"
    destination: "Event-Driven Sync Worker"
    description: "Consume claim events [AMQP]"
  - source: "Event-Driven Sync Worker"
    destination: "Async View Model Cache"
    description: "Update cached view models [TCP]"