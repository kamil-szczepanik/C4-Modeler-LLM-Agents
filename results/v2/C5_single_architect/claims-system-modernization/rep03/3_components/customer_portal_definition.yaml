level: component
scope: "Component diagram for the Customer Portal container"
parentContainer:
  name: "Customer Portal"
elements:
  - type: "component"
    name: "Authentication Controller"
    technology: "TypeScript / MSAL.js Component"
    description: "Authenticates via Single Sign-On with the Identity Provider."
  - type: "component"
    name: "Claim Submission UI"
    technology: "React / Formik Component"
    description: "Powers dynamic, type-specific claim forms and delegates payload validation."
  - type: "component"
    name: "Claim Tracker Component"
    technology: "React Component"
    description: "Handles asynchronous command execution and real-time claim status tracking."
  - type: "component"
    name: "API Client Service"
    technology: "Axios / OpenAPI Generated Component"
    description: "Delegates payload validation and sends API requests and receives real-time updates."
relationships:
  - source: "Authentication Controller"
    destination: "Identity Provider"
    description: "Authenticates via Single Sign-On [OIDC/HTTPS]"
  - source: "Claim Submission UI"
    destination: "API Client Service"
    description: "Delegates payload validation and invocation [TypeScript Function Call]"
  - source: "API Client Service"
    destination: "API Gateway"
    description: "Sends API requests and receives real-time updates [HTTPS/JSON, WSS]"
  - source: "Customer / Broker"
    destination: "Customer Portal"
    description: "Submits claims online [HTTPS]"