level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Claim Write Model Component"
    technology: "Azure SQL Database / EF Core"
    description: "Handles write operations and domain data persistence for claims."
  - type: "component"
    name: "Claim Read Model Component"
    technology: "Azure SQL Database / EF Core"
    description: "Optimized read storage supporting the adjuster workspace and fast queries."
  - type: "component"
    name: "Migration & Audit Log Component"
    technology: "Azure SQL Database / Temporal Tables"
    description: "Maintains audit logs and supports historical tracking and migration."
  - type: "component"
    name: "Integration Staging Component"
    technology: "Azure SQL Database / Stored Procedures"
    description: "Stages and transforms payloads for integration with the legacy mainframe."
relationships:
  - source: "Claim Write Model Component"
    destination: "Migration & Audit Log Component"
    description: "Records audit logs for write operations"
  - source: "Claims Core Service"
    destination: "Claim Write Model Component"
    description: "Reads and writes domain data [EF Core / TDS]"
  - source: "Claims Core Service"
    destination: "Integration Staging Component"
    description: "Transforms staged payloads [Stored Procedures / TDS]"