level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing Engine"
    technology: ".NET YARP"
    description: "Handles incoming API requests and directs them to appropriate backend services."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: ".NET Middleware"
    description: "Validates user tokens and secures API routes."
  - type: "component"
    name: "Rate Limiting & Resiliency Policy Middleware"
    technology: ".NET Polly"
    description: "Applies rate limiting and transient fault handling policies for slow responses."
  - type: "component"
    name: "Transformation & Protocol Bridge"
    technology: ".NET Core"
    description: "Translates and bridges protocols between incoming requests and backend services."
relationships:
  - source: "Routing Engine"
    destination: "Transformation & Protocol Bridge"
    description: "Passes raw requests [In-memory]"