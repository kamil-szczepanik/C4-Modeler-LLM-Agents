level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing & SSL Termination"
    technology: "Azure Front Door / Azure Application Gateway"
    description: "Secures ingress, terminates SSL, and routes hybrid boundary traffic."
  - type: "component"
    name: "Authentication & Authorization Component"
    technology: "Azure Active Directory / OpenID Connect"
    description: "Validates incoming tokens and implements centralized Single Sign-On."
  - type: "component"
    name: "Token Exchange & Transformation"
    technology: "Internal Gateway Service"
    description: "Transforms and passes validated requests internally."
relationships:
  - source: "Routing & SSL Termination"
    destination: "Authentication & Authorization Component"
    description: "Validates incoming tokens [HTTPS / OIDC]"
  - source: "Routing & SSL Termination"
    destination: "Token Exchange & Transformation"
    description: "Passes validated requests [Internal HTTP/2]"