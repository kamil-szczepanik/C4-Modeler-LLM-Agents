level: component
scope: "Component diagram for the Migrated Claims Database container"
parentContainer:
  name: "Migrated Claims Database"
elements:
  - type: "component"
    name: "Claim Aggregate Store"
    technology: "PostgreSQL tables with JSONB"
    description: "Persists claims data for flexible claim types and transactional consistency."
  - type: "component"
    name: "Migration Sync Ledger"
    technology: "PostgreSQL relational tables"
    description: "Manages sync state during the hybrid migration phase."
  - type: "component"
    name: "Audit & Fallback Log"
    technology: "PostgreSQL append-only tables"
    description: "Provides append-only logging for audit trails and rapid rollbacks."
  - type: "component"
    name: "Outbox Event Publisher"
    technology: "PostgreSQL Debezium / Logical Decoding"
    description: "Implements the Transactional Outbox pattern for reliable asynchronous event publishing."
relationships:
  - source: "Claims Core Engine"
    destination: "Claim Aggregate Store"
    description: "Persisting claims data [JDBC over TLS]"
  - source: "Claims Core Engine"
    destination: "Migration Sync Ledger"
    description: "Managing sync state [JDBC over TLS]"
  - source: "Outbox Event Publisher"
    destination: "Integration Layer"
    description: "Publishing domain events [AMQP over TLS]"