level: component
scope: "Component diagram for the Claims Core Engine container"
parentContainer:
  name: "Claims Core Engine"
elements:
  - type: "component"
    name: "Claim Domain Service"
    technology: "Java/Spring"
    description: "Encapsulates core claims processing business logic using Domain-Driven Design."
  - type: "component"
    name: "Adapter Router"
    technology: "Java/Spring Integration"
    description: "Dynamically routes requests between the modern database and legacy mainframe."
  - type: "component"
    name: "Anti-Corruption Layer (ACL)"
    technology: "Java / Resilience4j"
    description: "Translates data models and insulates the system from mainframe latency and schema quirks."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Apache Camel"
    description: "Handles asynchronous event dispatching for dual-run state synchronization."
relationships:
  - source: "Adjuster Workspace"
    destination: "Claim Domain Service"
    description: "Executes commands and reads claims data via gRPC."
  - source: "Claim Domain Service"
    destination: "Migrated Claims Database"
    description: "Persists modern claim records via JDBC over TLS."
  - source: "Claim Domain Service"
    destination: "Adapter Router"
    description: "Delegates legacy fallback calls via in-process Java method calls."
  - source: "Adapter Router"
    destination: "Anti-Corruption Layer (ACL)"
    description: "Transforms data structures for legacy compatibility."
  - source: "Anti-Corruption Layer (ACL)"
    destination: "Integration Layer"
    description: "Synchronizes events and bridges mainframe data via AMQP over Azure Event Hubs."