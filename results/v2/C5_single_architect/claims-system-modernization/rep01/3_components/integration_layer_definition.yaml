level: component
scope: "Component diagram for the Integration Layer container"
parentContainer:
  name: "Integration Layer"
elements:
  - type: "component"
    name: "Routing Mediator"
    technology: "Apache Camel"
    description: "Routes claim events and orchestrates message flow within the integration layer."
  - type: "component"
    name: "Protocol Translator"
    technology: "Java / Apache Camel"
    description: "Transforms payloads and maps canonical events to legacy schemas."
  - type: "component"
    name: "Idempotency & Replay Manager"
    technology: "Azure Redis Cache"
    description: "Provides state storage for idempotency, ensuring zero data loss during nightly batch windows."
  - type: "component"
    name: "Mainframe ACL"
    technology: "Integration Layer / Mainframe ACL"
    description: "Anti-Corruption Layer that interfaces directly with the legacy mainframe system."
relationships:
  - source: "Routing Mediator"
    destination: "Protocol Translator"
    description: "Transforms payload for legacy [In-memory Camel EIP]"
  - source: "Protocol Translator"
    destination: "Mainframe ACL"
    description: "Maps canonical events to legacy schemas [Java / Apache Camel]"