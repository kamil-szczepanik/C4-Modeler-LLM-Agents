level: component
scope: "Component diagram for the Adjuster Workspace container"
parentContainer:
  name: "Adjuster Workspace"
elements:
  - type: "component"
    name: "Routing Controller"
    technology: "Express.js"
    description: "Handles lightweight routing and fast I/O handling for the web interface."
  - type: "component"
    name: "Workflow Orchestrator"
    technology: "Node.js"
    description: "Orchestrates UI workflows, uses local caching and asynchronous integration adapters to guarantee sub-2-second UI load times."
  - type: "component"
    name: "Engine Client"
    technology: "gRPC / Protobuf"
    description: "Enables high-performance, low-latency synchronous communication with the Claims Core Engine."
  - type: "component"
    name: "Event Publisher"
    technology: "Azure Event Hubs SDK"
    description: "Facilitates scalable, asynchronous event streaming and decoupled messaging."
  - type: "component"
    name: "Integration Adapter"
    technology: "Apache Camel / Node SDK"
    description: "Handles asynchronous in-process dispatch to publish/subscribe messaging."
relationships:
  - source: "Routing Controller"
    destination: "Workflow Orchestrator"
    description: "In-process function calls [HTTPS / OpenID Connect]"
  - source: "Workflow Orchestrator"
    destination: "Engine Client"
    description: "Remote procedure calls [gRPC]"
  - source: "Engine Client"
    destination: "Claims Core Engine"
    description: "Secure remote procedure calls [gRPC over TLS]"
  - source: "Workflow Orchestrator"
    destination: "Integration Adapter"
    description: "Asynchronous in-process dispatch [Internal]"
  - source: "Integration Adapter"
    destination: "Integration Layer"
    description: "Publish/subscribe messaging [AMQP / Azure Event Hubs]"