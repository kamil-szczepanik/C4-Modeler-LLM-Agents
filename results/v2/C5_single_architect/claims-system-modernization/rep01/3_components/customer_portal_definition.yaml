level: component
scope: "Component diagram for the Customer Portal container"
parentContainer:
  name: "Customer Portal"
elements:
  - type: "component"
    name: "Authentication Module"
    technology: "MSAL.js"
    description: "Implements single sign-on authentication via OIDC/OAuth2 to meet security requirements."
  - type: "component"
    name: "Claim Submission Form"
    technology: "Formik/Yup"
    description: "Handles online claim submission inputs and validation."
  - type: "component"
    name: "Claim Status Tracker"
    technology: "React Component"
    description: "Polls for updates via HTTPS/REST to track claim statuses."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios"
    description: "Manages HTTP requests, responses, and interceptors for routing requests."
relationships:
  - source: "Authentication Module"
    destination: "Azure Active Directory"
    description: "Authenticates users via OIDC/OAuth2"
  - source: "Claim Submission Form"
    destination: "API Client Layer"
    description: "Sends claim data"
  - source: "Claim Status Tracker"
    destination: "API Gateway"
    description: "Polling for updates via HTTPS/REST"
  - source: "API Client Layer"
    destination: "API Gateway"
    description: "Routing requests via HTTPS using OpenID Connect"