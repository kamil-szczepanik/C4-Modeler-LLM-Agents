level: context
scope: "System Context diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization"
  description: "Gradually replaces a 30-year-old COBOL/DB2 mainframe with a modern Azure-hosted platform, ensuring seamless hybrid operations while the legacy system remains the system of record."
elements:
  - type: "person"
    name: "Customers"
    description: "End users who interact with the system to submit and manage claims."
  - type: "person"
    name: "Brokers"
    description: "Intermediaries who interact with the system on behalf of customers."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal staff who access the platform to review and process claims."
  - type: "externalSystem"
    name: "On-premises Active Directory"
    description: "Provides identity and authentication services integrated with the cloud platform."
  - type: "externalSystem"
    name: "Legacy Mainframe (COBOL/DB2)"
    description: "The 30-year-old backend system acting as the system of record."
  - type: "container"
    name: "Customer Portal"
    description: "Web application hosted on Azure App Service for customer interactions."
    technology: "Azure App Service"
  - type: "container"
    name: "Adjuster Web App"
    description: "Web application hosted on Azure App Service for claims adjusters."
    technology: "Azure App Service"
  - type: "container"
    name: "Anti-Corruption Layer"
    description: "Service implemented using Azure Functions to isolate mainframe dependencies."
    technology: "Azure Functions"
  - type: "container"
    name: "State Database"
    description: "Database storing migrated claim data with transactional integrity."
    technology: "Azure SQL Database"
  - type: "container"
    name: "Azure Event Hubs"
    description: "Messaging system managing asynchronous communication and decoupling."
    technology: "Azure Event Hubs"
relationships:
  - source: "Customers"
    destination: "Customer Portal"
    description: "Interacts with the portal to manage claims"
    technology: "HTTPS/REST"
  - source: "Brokers"
    destination: "Customer Portal"
    description: "Interacts with the portal on behalf of customers"
    technology: "HTTPS/REST"
  - source: "Claims Adjusters"
    destination: "Adjuster Web App"
    description: "Accesses the web application to process claims"
    technology: "HTTPS/REST"
  - source: "Adjuster Web App"
    destination: "State Database"
    description: "Communicates for data persistence and retrieval"
    technology: "TDS/TCP"
  - source: "Adjuster Web App"
    destination: "Anti-Corruption Layer"
    description: "Requests data from the legacy system"
    technology: "HTTPS/REST"
  - source: "Anti-Corruption Layer"
    destination: "Legacy Mainframe (COBOL/DB2)"
    description: "Retrieves legacy data"
    technology: "HTTPS/REST"
  - source: "Insurance Claims Modernization"
    destination: "Legacy Mainframe (COBOL/DB2)"
    description: "Integrates asynchronously to update records"
    technology: "AMQP/Azure Event Hubs"
  - source: "Insurance Claims Modernization"
    destination: "On-premises Active Directory"
    description: "Authenticates users"
    technology: "OIDC/OAuth2"