level: container
scope: "Container diagram for Insurance Claims Modernization"
system:
  name: "Insurance Claims Modernization"
elements:
  - type: "person"
    name: "Customers"
    description: "External users submitting claims online."
  - type: "person"
    name: "Brokers"
    description: "External users submitting claims online."
  - type: "person"
    name: "Claims Adjusters"
    description: "Internal users handling claims via the web application."
  - type: "externalSystem"
    name: "Active Directory"
    description: "On-premises identity provider for Single Sign-On."
  - type: "externalSystem"
    name: "Legacy Mainframe"
    description: "On-premises COBOL/DB2 system of record."
  - type: "container"
    name: "API Gateway"
    technology: "Azure Front Door / App Gateway"
    description: "Managing HTTPS routing."
  - type: "container"
    name: "Customer Portal"
    technology: "React SPA on Azure Static Web Apps"
    description: "Modern UI delivery for customer interactions."
  - type: "container"
    name: "Adjuster Workspace"
    technology: "Node.js Backend-for-Frontend on Azure App Service"
    description: "Backend-for-Frontend handling adjuster workflows."
  - type: "container"
    name: "Claims Core Engine"
    technology: "Java Spring Boot on Azure Container Apps"
    description: "Robust domain logic for claims processing."
  - type: "container"
    name: "Integration Layer"
    technology: "Azure Event Hubs with Apache Camel"
    description: "Low operational overhead and protocol translation."
  - type: "container"
    name: "Migrated Claims Database"
    technology: "Azure Database for PostgreSQL"
    description: "Transactional consistency for claims data."
relationships:
  - source: "Customers"
    destination: "Customer Portal"
    description: "Submitting claims online"
    technology: "HTTPS"
  - source: "Brokers"
    destination: "Customer Portal"
    description: "Submitting claims online"
    technology: "HTTPS"
  - source: "Customer Portal"
    destination: "API Gateway"
    description: "Routing requests"
    technology: "HTTPS using OpenID Connect"
  - source: "Adjuster Workspace"
    destination: "API Gateway"
    description: "Routing requests"
    technology: "HTTPS using OpenID Connect"
  - source: "API Gateway"
    destination: "Adjuster Workspace"
    description: "Routing requests"
    technology: "HTTPS"
  - source: "Adjuster Workspace"
    destination: "Claims Core Engine"
    description: "Communicating for claims processing"
    technology: "gRPC"
  - source: "Claims Core Engine"
    destination: "Migrated Claims Database"
    description: "Persisting claims data"
    technology: "JDBC over TLS"
  - source: "Claims Core Engine"
    destination: "Integration Layer"
    description: "Synchronizing events"
    technology: "Apache Camel and Azure Event Hubs"
  - source: "Legacy Mainframe"
    destination: "Integration Layer"
    description: "Synchronizing records"
    technology: "Apache Camel and Azure Event Hubs"