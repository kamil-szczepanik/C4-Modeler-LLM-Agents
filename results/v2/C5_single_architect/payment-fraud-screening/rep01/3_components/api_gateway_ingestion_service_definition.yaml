level: component
scope: "Component diagram for the API Gateway / Ingestion Service container"
parentContainer:
  name: "API Gateway / Ingestion Service"
elements:
  - type: "component"
    name: "HTTP/gRPC Router Component"
    technology: "Go"
    description: "Forwards raw payload internally."
  - type: "component"
    name: "Tokenization Proxy Component"
    technology: "Go"
    description: "Strips PANs and tokenizes card data."
  - type: "component"
    name: "Scoring Orchestrator Component"
    technology: "Go"
    description: "Invokes fraud scoring with a 35ms timeout."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Go, AWS SDK"
    description: "Publishes transaction and decision payloads."
relationships:
  - source: "HTTP/gRPC Router Component"
    destination: "Tokenization Proxy Component"
    description: "Forwards raw payload [Internal Memory]"
  - source: "Tokenization Proxy Component"
    destination: "Tokenization / Vault Provider"
    description: "Strips PANs and tokenizes card data [mTLS / HTTPS]"
  - source: "Scoring Orchestrator Component"
    destination: "Fraud Scoring Engine"
    description: "Invokes fraud scoring with 35ms timeout [gRPC]"
  - source: "Event Publisher Component"
    destination: "AWS SQS / SNS"
    description: "Publishes transaction and decision payloads [AWS SDK batching over HTTPS]"
  - source: "API Gateway / Ingestion Service"
    destination: "Audit & Decision Store"
    description: "Persists decisions [PostgreSQL protocol]"