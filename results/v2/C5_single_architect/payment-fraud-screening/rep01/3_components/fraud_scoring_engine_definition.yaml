level: component
scope: "Component diagram for the Fraud Scoring Engine container"
parentContainer:
  name: "Fraud Scoring Engine"
elements:
  - type: "component"
    name: "Scoring API Controller"
    technology: "Rust (tonic gRPC)"
    description: "Managing incoming requests."
  - type: "component"
    name: "Rule Execution Engine"
    technology: "Rust compiled evaluation component"
    description: "For deterministic fraud rules."
  - type: "component"
    name: "Model Ingestion & Hot-Swap Coordinator"
    technology: "Rust (arc-swap, ONNX Runtime via ort)"
    description: "For zero-downtime model updates."
  - type: "component"
    name: "Feature Assembler"
    technology: "Rust (tokio async)"
    description: "Coordinating parallel data gathering."
  - type: "component"
    name: "In-Memory Feature Cache Client"
    technology: "Rust (redis-rs)"
    description: "For low-latency feature retrieval."
  - type: "component"
    name: "Decision Publisher"
    technology: "Rust (aws-sdk-sqs)"
    description: "For asynchronous event dispatch."
  - type: "system"
    name: "AWS SQS"
    technology: "AWS SQS"
    description: "Enqueues audit logs."
relationships:
  - source: "Scoring API Controller"
    destination: "Feature Assembler"
    description: "Gathers context [in-process async]"
  - source: "Feature Assembler"
    destination: "In-Memory Feature Cache Client"
    description: "Fetches velocity features [TCP/RESP]"
  - source: "Rule Execution Engine"
    destination: "Model Ingestion & Hot-Swap Coordinator"
    description: "Evaluates rules against active models [in-process lock-free read]"
  - source: "Scoring API Controller"
    destination: "Decision Publisher"
    description: "Dispatches audit events [async channel]"
  - source: "Decision Publisher"
    destination: "AWS SQS"
    description: "Enqueues audit logs [HTTPS/AWS API]"