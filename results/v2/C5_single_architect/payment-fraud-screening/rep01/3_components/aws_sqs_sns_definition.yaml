level: component
scope: "Component diagram for the AWS SQS / SNS container"
parentContainer:
  name: "AWS SQS / SNS"
elements:
  - type: "component"
    name: "Amazon SNS Audit Topic"
    technology: "AWS SNS"
    description: "Publishes raw events asynchronously for auditing and notification."
  - type: "component"
    name: "Amazon SQS Case Routing Queue"
    technology: "AWS SQS"
    description: "Queues review-required cases for downstream processing with SSE-KMS."
  - type: "component"
    name: "Dead-Letter Queues (DLQ)"
    technology: "AWS SQS"
    description: "Captures failed messages for error handling and analysis."
relationships:
  - source: "API Gateway / Ingestion Service"
    destination: "Amazon SNS Audit Topic"
    description: "Publishes raw events asynchronously via AWS SDK (HTTPS/TLS 1.3)."
  - source: "Amazon SNS Audit Topic"
    destination: "Audit & Decision Store (PostgreSQL)"
    description: "Persists immutable audit logs via AWS Lambda (HTTPS)."
  - source: "Fraud Scoring Engine"
    destination: "Amazon SQS Case Routing Queue"
    description: "Pushes review-required cases using AWS SDK (SQS SendMessage) with SSE-KMS."
  - source: "Amazon SQS Case Routing Queue"
    destination: "Case Management Backend"
    description: "Consumes messages using AWS SDK (SQS Long Polling)."