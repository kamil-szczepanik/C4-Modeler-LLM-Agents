level: component
scope: "Component diagram for the Case Management Backend container"
parentContainer:
  name: "Case Management Backend"
elements:
  - type: "component"
    name: "Case API Controller"
    technology: "Spring Boot"
    description: "Exposes REST endpoints for the Fraud Analyst UI."
  - type: "component"
    name: "Workflow Orchestrator"
    technology: "Java"
    description: "Manages state transitions for open, under review, escalated, and resolved cases."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Java"
    description: "Records analyst actions and case mutations durably."
  - type: "component"
    name: "Queue Consumer Service"
    technology: "Java / AWS SDK"
    description: "Consumes flagged cases from message queues."
  - type: "component"
    name: "Tokenization Filter / Redaction Component"
    technology: "Java"
    description: "Scrubs and masks sensitive cardholder data."
relationships:
  - source: "Fraud Analyst UI"
    destination: "Case API Controller"
    description: "Communicates via HTTPS/REST."
  - source: "Queue Consumer Service"
    destination: "Workflow Orchestrator"
    description: "Triggers new cases via In-Memory Java Method Calls."
  - source: "Workflow Orchestrator"
    destination: "Tokenization Filter / Redaction Component"
    description: "Passes payloads via In-Memory calls."
  - source: "Tokenization Filter / Redaction Component"
    destination: "Audit & Decision Store"
    description: "Persists sanitized data via PostgreSQL protocol."
  - source: "Queue Consumer Service"
    destination: "AWS SQS"
    description: "Ingests queue messages using AWS SDK."