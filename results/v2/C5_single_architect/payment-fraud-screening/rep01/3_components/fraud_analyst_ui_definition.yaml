level: component
scope: "Component diagram for the Fraud Analyst UI container"
parentContainer:
  name: "Fraud Analyst UI"
elements:
  - type: "component"
    name: "Tokenization Masking Component"
    technology: "[e.g., JavaScript / React]"
    description: "Masks sensitive cardholder data to satisfy PCI-DSS Level 1 compliance."
  - type: "component"
    name: "WebSocket Client Component"
    technology: "WSS / HTTPS"
    description: "Streams real-time alert notifications from the Case Management Backend."
  - type: "component"
    name: "Case Queue Router Component"
    technology: "React Router"
    description: "Handles routing and navigation for payment analyst case reviews."
  - type: "component"
    name: "Decision Action Form Component"
    technology: "React SPA"
    description: "Allows payment analysts to submit case actions and decisions."
  - type: "component"
    name: "Rule Management Panel Component"
    technology: "React SPA"
    description: "Provides an interface for updating and managing fraud detection rules."
relationships:
  - source: "Tokenization Masking Component"
    destination: "Case Management Backend"
    description: "Sends securely masked data [HTTPS/REST]"
  - source: "WebSocket Client Component"
    destination: "Case Management Backend"
    description: "Receives real-time alert notifications [WSS / HTTPS]"
  - source: "Decision Action Form Component"
    destination: "Case Management Backend"
    description: "Submits case actions and fetches queues [HTTPS/REST]"
  - source: "Rule Management Panel Component"
    destination: "Case Management Backend"
    description: "Updates rules [HTTPS/REST]"