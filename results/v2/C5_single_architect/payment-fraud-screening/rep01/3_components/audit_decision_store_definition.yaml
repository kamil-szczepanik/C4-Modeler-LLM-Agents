level: component
scope: "Component diagram for the Audit & Decision Store container"
parentContainer:
  name: "Audit & Decision Store"
elements:
  - type: "component"
    name: "Data Access Layer"
    technology: "Go / pgx"
    description: "Handles database interactions and provides access for reading and writing decision logs."
  - type: "component"
    name: "Audit & Cryptographic Service"
    technology: "Go"
    description: "Ensures tamper-evidence using application-level HMAC and Merkle-tree chaining."
  - type: "component"
    name: "Retention & Archival Worker"
    technology: "Go / AWS Lambda"
    description: "Archives cold partitions to meet the 7-year retention policy."
  - type: "component"
    name: "Partition Manager"
    technology: "Go"
    description: "Manages database partitions for performance and data lifecycle management."
  - type: "component"
    name: "Amazon RDS PostgreSQL"
    technology: "Amazon RDS PostgreSQL"
    description: "Provides reliable ACID compliance and standard relational storage."
  - type: "component"
    name: "Fraud Scoring Engine"
    technology: "External System / Container"
    description: "Reads and writes decision logs."
  - type: "component"
    name: "Case Management Backend"
    technology: "External System / Container"
    description: "Accesses decision and audit records."
  - type: "component"
    name: "Amazon S3 Glacier"
    technology: "AWS S3 Glacier"
    description: "Minimizes long-term storage costs for cold data archives."
relationships:
  - source: "Fraud Scoring Engine"
    destination: "Data Access Layer"
    description: "Reads and writes decision logs [PostgreSQL protocol]"
  - source: "Case Management Backend"
    destination: "Data Access Layer"
    description: "Accesses decision and audit records [PostgreSQL protocol]"
  - source: "Audit & Cryptographic Service"
    destination: "Partition Manager"
    description: "Writes chained audit records to active partitions [Internal Go Interface]"
  - source: "Retention & Archival Worker"
    destination: "Amazon S3 Glacier"
    description: "Archives cold partitions [AWS SDK / HTTPS]"