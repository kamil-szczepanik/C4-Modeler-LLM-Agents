level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Evaluates card-not-present payment authorizations, provides case management for fraud analysts, and ensures PCI-DSS compliance, <50ms P99 latency at 3,000 TPS, and tamper-evident 7-year auditability on AWS eu-west-1."
elements:
  - type: "person"
    name: "Payment Analysts"
    description: "Users performing manual case reviews and accessing case management via Web UI."
  - type: "person"
    name: "Compliance Auditors"
    description: "Users accessing 7-year audit logs for regulatory compliance."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "External system sending authorization requests."
  - type: "externalSystem"
    name: "Card Networks / Issuers"
    description: "External systems providing chargeback feedback."
  - type: "externalSystem"
    name: "Tokenization / Vault Provider"
    description: "External service handling cardholder data and token resolution."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Sends real-time authorization requests for scoring"
    technology: "gRPC over HTTP/2"
  - type: "Real-Time Payment Fraud Screening System"
    destination: "Tokenization / Vault Provider"
    description: "Resolves tokens for secure card data processing"
    technology: "HTTPS with mutual TLS"
  - source: "Payment Analysts"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Performs case management and reviews via Web UI"
    technology: "HTTPS (TLS 1.3)"
  - source: "Card Networks / Issuers"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Sends asynchronous chargeback ingestion"
    technology: "HTTPS"