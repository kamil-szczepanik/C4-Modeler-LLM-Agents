level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Payment Analysts"
    description: "Users reviewing suspicious transactions via the UI."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "External system submitting authorization requests."
  - type: "externalSystem"
    name: "Tokenization / Vault Provider"
    description: "External system handling secure card data storage and tokenization."
  - type: "container"
    name: "API Gateway / Ingestion Service"
    technology: "Go"
    description: "Container handling incoming requests via HTTPS/gRPC."
  - type: "container"
    name: "Fraud Scoring Engine"
    technology: "Rust"
    description: "Container executing fraud rules and models."
  - type: "container"
    name: "Case Management Backend"
    technology: "Node.js / Java"
    description: "Container managing analyst review workflows."
  - type: "container"
    name: "Fraud Analyst UI"
    technology: "React, AWS S3 + CloudFront"
    description: "Single Page Application hosted on AWS S3 + CloudFront for fraud analysts."
  - type: "container"
    name: "Audit & Decision Store"
    technology: "PostgreSQL on AWS RDS"
    description: "Provides tamper-evident storage for audit and decision logs."
  - type: "container"
    name: "AWS SQS / SNS"
    technology: "AWS Serverless Messaging"
    description: "Serverless messaging service for asynchronous audit logging and case routing."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "API Gateway / Ingestion Service"
    description: "Sends authorization requests"
    technology: "HTTPS/gRPC"
  - source: "API Gateway / Ingestion Service"
    destination: "Fraud Scoring Engine"
    description: "Invokes fraud scoring"
    technology: "internal gRPC/REST"
  - source: "API Gateway / Ingestion Service"
    destination: "AWS SQS / SNS"
    description: "Publishes events"
    technology: "AWS SDK"
  - source: "Fraud Scoring Engine"
    destination: "Audit & Decision Store"
    description: "Reads and writes tamper-evident decision logs"
    technology: "PostgreSQL protocol"
  - source: "Fraud Analyst UI"
    destination: "Case Management Backend"
    description: "Communicates with backend services"
    technology: "HTTPS/REST"
  - source: "Case Management Backend"
    destination: "Audit & Decision Store"
    description: "Interacts with database"
    technology: "PostgreSQL protocol"
  - source: "Case Management Backend"
    destination: "AWS SQS / SNS"
    description: "Consumes queue messages"
    technology: "AWS SDK"
  - source: "Payment Analysts"
    destination: "Fraud Analyst UI"
    description: "Reviews suspicious transactions"
    technology: "HTTPS"