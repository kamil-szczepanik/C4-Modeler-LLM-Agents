level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL container"
parentContainer:
  name: "Amazon Aurora PostgreSQL"
elements:
  - type: "component"
    name: "Case Management Schema"
    technology: "PostgreSQL tables"
    description: "PostgreSQL tables storing analyst reviews and case states."
  - type: "component"
    name: "Audit Log Vault"
    technology: "pg_audit and append-only tables"
    description: "pg_audit extension and append-only tables capturing immutable decision logs."
  - type: "component"
    name: "Row-Level Security (RLS) Enforcer"
    technology: "PostgreSQL RLS policies"
    description: "PostgreSQL RLS policies enforcing PCI-DSS data segregation."
  - type: "component"
    name: "Data Masking & Tokenization Engine"
    technology: "PostgreSQL functions and pgcrypto"
    description: "PostgreSQL functions and pgcrypto dynamically masking primary account numbers (PANs)."
relationships:
  - source: "Case Management Backend"
    destination: "Case Management Schema"
    description: "Reads and writes case data [SQL/TCP]"
  - source: "Fraud Scoring Engine"
    destination: "Audit Log Vault"
    description: "Appends immutable decision logs [SQL/TCP]"
  - source: "Case Management Schema"
    destination: "Data Masking & Tokenization Engine"
    description: "Sanitizes card data on read [PL/pgSQL]"