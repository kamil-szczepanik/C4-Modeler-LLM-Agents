level: component
scope: "Component diagram for the Amazon S3 with Object Lock and AWS KMS container"
parentContainer:
  name: "Amazon S3 with Object Lock and AWS KMS"
elements:
  - type: "component"
    name: "S3 Bucket (Compliance Audit Store)"
    technology: "Amazon S3 with Object Lock"
    description: "Stores immutable audit logs with compliance mode ensuring 7-year tamper-evident retention."
  - type: "component"
    name: "Key Management Service (Audit Encryption Key)"
    technology: "AWS KMS"
    description: "Provides envelope encryption keys to secure compliance audit payloads."
  - type: "component"
    name: "S3 Lifecycle Component"
    technology: "AWS S3 Lifecycle"
    description: "Transitions audit logs to Amazon S3 Glacier for cost-optimized long-term retention."
  - type: "component"
    name: "Bucket Policy & Access Controller"
    technology: "AWS IAM & S3 Bucket Policies"
    description: "Enforces strict access controls and immutability rules on the compliance audit store."
relationships:
  - source: "S3 Bucket (Compliance Audit Store)"
    destination: "Key Management Service (Audit Encryption Key)"
    description: "Encrypts/Decrypts payloads [AWS internal API via AWS KMS VPC Endpoint]"
  - source: "S3 Lifecycle Component"
    destination: "S3 Bucket (Compliance Audit Store)"
    description: "Transitions older audit logs to Glacier storage tier [AWS internal API]"
  - source: "Bucket Policy & Access Controller"
    destination: "S3 Bucket (Compliance Audit Store)"
    description: "Applies security policies and prevents unauthorized modifications [IAM Policy Engine]"