level: component
scope: "Component diagram for the Case Management Backend container"
parentContainer:
  name: "Case Management Backend"
elements:
  - type: "component"
    name: "API Router / Controller"
    technology: "Go / Rust"
    description: "Routes incoming API requests and handles controller logic."
  - type: "component"
    name: "Masking & Sanitization Middleware"
    technology: "Go / Rust"
    description: "Sanitizes incoming requests to maintain security and compliance."
  - type: "component"
    name: "Case Service"
    technology: "Go / Rust"
    description: "Core business logic service for managing cases."
  - type: "component"
    name: "Audit Logger"
    technology: "Go / Rust"
    description: "Emits audit events for strict compliance and tracking."
  - type: "component"
    name: "Data Repository"
    technology: "Go / Rust"
    description: "Handles data persistence interactions for case state."
relationships:
  - source: "API Router / Controller"
    destination: "Masking & Sanitization Middleware"
    description: "Sanitizes incoming requests [In-Process]"
  - source: "Masking & Sanitization Middleware"
    destination: "Case Service"
    description: "Forwards clean payload [In-Process]"
  - source: "API Router / Controller"
    destination: "Case Service"
    description: "Method calls [In-Process]"
  - source: "Case Service"
    destination: "Data Repository"
    description: "Reads/Writes case state [SQL over TCP]"
  - source: "Case Service"
    destination: "Audit Logger"
    description: "Emits audit events [In-Process]"