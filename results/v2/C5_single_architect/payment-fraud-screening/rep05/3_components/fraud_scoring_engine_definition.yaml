level: component
scope: "Component diagram for the Fraud Scoring Engine container"
parentContainer:
  name: "Fraud Scoring Engine"
elements:
  - type: "component"
    name: "API Handler Component"
    technology: "Go / Fiber"
    description: "Handles I/O-bound requests and ensures high-throughput request handling."
  - type: "component"
    name: "Feature Aggregator Component"
    technology: "Go"
    description: "Performs sub-millisecond feature lookup and coordinates with Redis."
  - type: "component"
    name: "Scoring Engine Core"
    technology: "Rust"
    description: "Executes CPU-bound scoring to meet strict performance and memory safety constraints."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Go"
    description: "Handles tamper-evident auditing and async logging."
  - type: "component"
    name: "Rule & Model Loader Component"
    technology: "Rust"
    description: "Manages zero-downtime model updates and rule loading."
  - type: "component"
    name: "Redis"
    technology: "Redis"
    description: "Provides low-latency storage for real-time feature lookups."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Stores persistent transactional and case management data."
  - type: "component"
    name: "Amazon S3 with Object Lock and AWS KMS"
    technology: "Amazon S3, AWS KMS"
    description: "Ensures tamper-evident, 7-year compliant audit storage."
relationships:
  - source: "API Handler Component"
    destination: "Feature Aggregator Component"
    description: "In-process Function Call"
  - source: "Feature Aggregator Component"
    destination: "Scoring Engine Core"
    description: "In-process Function Call"
  - source: "Scoring Engine Core"
    destination: "Audit Logger Component"
    description: "Channel / Async Queue"
  - source: "Rule & Model Loader Component"
    destination: "Scoring Engine Core"
    description: "In-process Shared Memory / Atomic Swap"
  - source: "Feature Aggregator Component"
    destination: "Redis"
    description: "TCP"
  - source: "Scoring Engine Core"
    destination: "Amazon Aurora PostgreSQL"
    description: "TCP"
  - source: "Audit Logger Component"
    destination: "Amazon S3 with Object Lock and AWS KMS"
    description: "AWS SDK"