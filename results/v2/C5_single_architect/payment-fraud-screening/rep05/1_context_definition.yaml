level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Screens card-not-present payment authorizations for a mid-size payment processor and provides case management for fraud analysts."
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "User reviewing suspicious transactions."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "External system sending authorization requests."
  - type: "externalSystem"
    name: "Card Networks & Fraud Intelligence Feeds"
    description: "External systems providing risk signals and blacklists."
  - type: "externalSystem"
    name: "Archival / Compliance Storage"
    description: "External AWS S3 and KMS services for 7-year auditability."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Sends authorization requests for real-time scoring"
    technology: "HTTPS / gRPC"
  - source: "Fraud Analyst"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Reviews suspicious transactions and performs case management"
    technology: "HTTPS (TLS 1.3)"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Archival / Compliance Storage"
    description: "Stores WORM audit logs for 7-year auditability"
    technology: "AWS SDK (TLS)"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Archival / Compliance Storage"
    description: "Handles card data tokenization and envelope encryption"
    technology: "HTTPS"