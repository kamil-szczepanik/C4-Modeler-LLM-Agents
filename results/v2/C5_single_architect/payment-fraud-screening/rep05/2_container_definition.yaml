level: container
scope: "Container diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "User reviewing suspicious transactions."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer"
    description: "External system sending authorization requests."
  - type: "externalSystem"
    name: "Card Networks & Fraud Intelligence Feeds"
    description: "External systems providing risk signals and blacklists."
  - type: "externalSystem"
    name: "Archival / Compliance Storage"
    description: "External AWS S3 and KMS services for 7-year auditability."
  - type: "container"
    name: "AWS Network Load Balancer"
    technology: "AWS NLB"
    description: "Low-latency ingress routing without API Gateway overhead."
  - type: "container"
    name: "Fraud Scoring Engine"
    technology: "Go / Rust, Amazon ECS on AWS Fargate"
    description: "Evaluates card-not-present payment authorizations to detect fraud."
  - type: "container"
    name: "Case Management Backend"
    technology: "Go / Rust, Amazon ECS on AWS Fargate"
    description: "Manages suspicious cases for fraud analysts."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Relational database for transactional case management data."
  - type: "container"
    name: "Redis"
    technology: "Redis"
    description: "In-memory store for low-latency feature lookup."
  - type: "container"
    name: "Amazon S3 with Object Lock and AWS KMS"
    technology: "Amazon S3, AWS KMS"
    description: "Immutable, tamper-evident storage for 7-year compliance audit logs."
relationships:
  - source: "Payment Gateway / Acquirer"
    destination: "AWS Network Load Balancer"
    description: "Calls ingress at 3,000 TPS"
    technology: "HTTPS/TCP"
  - source: "AWS Network Load Balancer"
    destination: "Fraud Scoring Engine"
    description: "Routes requests to scoring engine"
    technology: "TCP"
  - source: "Fraud Scoring Engine"
    destination: "Amazon Aurora PostgreSQL"
    description: "Queries transactional data"
    technology: "TCP"
  - source: "Fraud Scoring Engine"
    destination: "Redis"
    description: "Performs low-latency feature lookup"
    technology: "TCP"
  - source: "Fraud Analyst"
    destination: "Case Management Backend"
    description: "Accesses case management features"
    technology: "HTTPS"
  - source: "Case Management Backend"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes transactional case management data"
    technology: "TCP"
  - source: "Fraud Scoring Engine"
    destination: "Amazon S3 with Object Lock and AWS KMS"
    description: "Streams audit logs"
    technology: "AWS SDK"
  - source: "Case Management Backend"
    destination: "Amazon S3 with Object Lock and AWS KMS"
    description: "Streams audit logs"
    technology: "AWS SDK"