level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Fraud Screening System"
  description: "Evaluates card-not-present payment authorizations for fraud prior to approval and provides a case management interface for fraud analysts."
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Internal persona reviewing flagged transactions and suspicious payments using a secure Web UI."
  - type: "externalSystem"
    name: "Payment Gateway / Core Ledger"
    description: "External system submitting tokenized payment authorizations."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Manages analyst authentication using OIDC/OAuth2."
  - type: "externalSystem"
    name: "Audit Archival Storage"
    description: "External system for long-term compliance storage using AWS S3 with Object Lock for WORM storage."
  - type: "container"
    name: "Fraud Screening System (Container)"
    description: "Core processing engine handling real-time scoring and case management."
    technology: "AWS (eu-west-1)"
relationships:
  - source: "Payment Gateway / Core Ledger"
    destination: "Fraud Screening System"
    description: "Sends payment authorizations and receives approval, decline, or review decisions"
    technology: "Synchronous gRPC/REST over TLS 1.3"
  - source: "Fraud Analyst"
    destination: "Fraud Screening System"
    description: "Reviews suspicious payments using a secure Web UI"
    technology: "HTTPS"
  - source: "Fraud Screening System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates analysts"
    technology: "OIDC/OAuth2 / AWS Cognito / IAM"
  - source: "Fraud Screening System"
    destination: "Audit Archival Storage"
    description: "Exports decision inputs, model versions, and explanations asynchronously"
    technology: "AWS S3 with Object Lock"