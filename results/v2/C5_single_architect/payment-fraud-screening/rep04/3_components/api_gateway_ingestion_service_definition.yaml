level: component
scope: "Component diagram for the API Gateway / Ingestion Service container"
parentContainer:
  name: "API Gateway / Ingestion Service"
elements:
  - type: "component"
    name: "Routing & Rate Limiting Filter"
    technology: "Go component"
    description: "Filters, routes, and applies rate limits to incoming requests."
  - type: "component"
    name: "Data Sanitization & Tokenization Masking Component"
    technology: "Go component"
    description: "Sanitizes and tokenizes sensitive payload data for PCI-DSS compliance."
  - type: "component"
    name: "Internal gRPC Client Router"
    technology: "Go component"
    description: "Routes sanitized payloads to internal services via gRPC."
  - type: "component"
    name: "Audit Logger & Telemetry Interceptor"
    technology: "Go component"
    description: "Emits telemetry and logs asynchronously to the audit and event bus."
relationships:
  - source: "Payment Gateway / Core Ledger"
    destination: "API Gateway / Ingestion Service"
    description: "Sends authorization requests [HTTPS/REST (TLS 1.3)]"
  - source: "Routing & Rate Limiting Filter"
    destination: "Data Sanitization & Tokenization Masking Component"
    description: "Hands off validated payloads [In-memory function call]"
  - source: "Data Sanitization & Tokenization Masking Component"
    destination: "Internal gRPC Client Router"
    description: "Forwards sanitized payloads [In-memory function call]"
  - source: "API Gateway / Ingestion Service"
    destination: "Scoring Engine"
    description: "Forwards requests for fraud evaluation [gRPC over mTLS]"
  - source: "Audit Logger & Telemetry Interceptor"
    destination: "Audit & Event Bus"
    description: "Emits telemetry and logs asynchronously [Kafka Protocol]"