level: component
scope: "Component diagram for the Transactional Data Store container"
parentContainer:
  name: "Transactional Data Store"
elements:
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Provides managed relational capabilities, high availability, native feature support, pgcrypto, and append-only tables for tamper-evident storage."
  - type: "component"
    name: "RDS Proxy"
    technology: "AWS RDS Proxy"
    description: "Provides managed connection pooling and resilience against traffic spikes."
  - type: "component"
    name: "Case Repository Component"
    technology: "PostgreSQL Tables"
    description: "Manages reliable persistence and case management for fraud analyst workflows."
  - type: "component"
    name: "Audit Ledger Component"
    technology: "PostgreSQL Append-Only Tables & pgcrypto"
    description: "Provides secure, tamper-evident 7-year audit logging satisfying strict compliance."
  - type: "component"
    name: "Database Migration Component"
    technology: "Flyway"
    description: "Executes automated, zero-downtime database schema updates."
relationships:
  - source: "Case Management Backend"
    destination: "RDS Proxy"
    description: "Routes database traffic [PostgreSQL Wire Protocol]"
  - source: "RDS Proxy"
    destination: "Case Repository Component"
    description: "Forwards pooled queries [PostgreSQL Wire Protocol]"
  - source: "RDS Proxy"
    destination: "Audit Ledger Component"
    description: "Forwards pooled queries [PostgreSQL Wire Protocol]"
  - source: "Audit Ledger Component"
    destination: "Audit Archival Storage"
    description: "Streams append-only logs [HTTPS]"
  - source: "CI/CD Pipeline"
    destination: "Database Migration Component"
    description: "Executes schema updates [HTTPS]"