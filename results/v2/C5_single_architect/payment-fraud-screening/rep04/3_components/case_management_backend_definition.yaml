level: component
scope: "Component diagram for the Case Management Backend container"
parentContainer:
  name: "Case Management Backend"
elements:
  - type: "component"
    name: "Case API Handler"
    technology: "Go (chi router)"
    description: "Handles HTTP requests from Fraud Analysts reviewing flagged transactions and managing cases."
  - type: "component"
    name: "Workflow Service"
    technology: "Go"
    description: "Orchestrates the business logic and workflow state transitions for case management."
  - type: "component"
    name: "Audit Publisher"
    technology: "Go"
    description: "Publishes case resolution audit trails to the audit and event infrastructure."
relationships:
  - source: "Case API Handler"
    destination: "Workflow Service"
    description: "Delegates request processing and case actions"
  - source: "Workflow Service"
    destination: "Audit Publisher"
    description: "Triggers audit event generation on case resolution"
  - source: "Audit Publisher"
    destination: "Audit & Event Bus"
    description: "Publishes case resolution audit trails [TCP / Kafka Protocol]"