level: component
scope: "Component diagram for the Audit & Event Bus container"
parentContainer:
  name: "Audit & Event Bus"
elements:
  - type: "component"
    name: "Kafka Cluster"
    technology: "Amazon MSK with KRaft"
    description: "Manages streaming event logs and publishes real-time decision events and review cases."
  - type: "component"
    name: "Event Producer"
    technology: "Go / Kafka Producer Client"
    description: "Publishes scoring decision events from the Scoring Engine into the Kafka event bus."
  - type: "component"
    name: "Event Consumer Group"
    technology: "Node.js / Java / AWS Lambda"
    description: "Consumes events from the MSK cluster to route review cases and trigger archival processing."
relationships:
  - source: "Scoring Engine"
    destination: "Kafka Cluster"
    description: "Publishes decision events [TCP / Kafka Protocol]"
  - source: "Kafka Cluster"
    destination: "Audit Archival Worker"
    description: "Invokes archival processing [AWS Internal Event Source Mapping]"
  - source: "Kafka Cluster"
    destination: "Case Management Backend"
    description: "Broadcasts review cases [TCP / Kafka Protocol]"