level: component
scope: "Component diagram for the Feature Store container"
parentContainer:
  name: "Feature Store"
elements:
  - type: "component"
    name: "Feature API Client Library"
    technology: "Embedded Go / AWS SDK"
    description: "Allows the Scoring Engine to query for real-time feature lookups."
  - type: "component"
    name: "Feature Aggregator Worker"
    technology: "AWS Lambda with Go"
    description: "Consumes transaction event streams and persists sliding-window aggregates."
relationships:
  - source: "Scoring Engine"
    destination: "Feature API Client Library"
    description: "Queries for real-time feature lookups via embedded client library [AWS SDK / HTTPS]"
  - source: "Feature Aggregator Worker"
    destination: "Feature Store"
    description: "Persists sliding-window aggregates [AWS SDK / NoSQL API]"