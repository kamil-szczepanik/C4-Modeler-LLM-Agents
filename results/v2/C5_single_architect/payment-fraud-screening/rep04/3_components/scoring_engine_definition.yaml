level: component
scope: "Component diagram for the Scoring Engine container"
parentContainer:
  name: "Scoring Engine"
elements:
  - type: "component"
    name: "API Router"
    technology: "Go"
    description: "Go service handling incoming gRPC requests."
  - type: "component"
    name: "Feature Aggregator"
    technology: "Go"
    description: "Go concurrent routine orchestrator for feature store lookups and local caching."
  - type: "component"
    name: "Model Evaluator"
    technology: "Go / WebAssembly (WASM)"
    description: "Go execution engine processing compiled rules and lightweight machine learning models."
  - type: "component"
    name: "In-Memory Model Registry"
    technology: "Go / In-Memory"
    description: "Component managing zero-downtime hot-swapping of compiled WebAssembly models."
  - type: "component"
    name: "Audit Payload Builder"
    technology: "Go"
    description: "Go component constructing tamper-evident decision records."
  - type: "component"
    name: "Feature Store"
    technology: "Amazon DynamoDB"
    description: "Amazon DynamoDB storing real-time user and card velocity vectors."
  - type: "component"
    name: "Audit & Event Bus"
    technology: "Amazon MSK (Apache Kafka)"
    description: "Amazon MSK (Apache Kafka) for asynchronous event publishing."
relationships:
  - source: "API Router"
    destination: "Feature Aggregator"
    description: "Delegates feature retrieval via Go internal function call"
  - source: "Feature Aggregator"
    destination: "Feature Store"
    description: "Fetches velocity vectors via DynamoDB API (<10ms)"
  - source: "Model Evaluator"
    destination: "In-Memory Model Registry"
    description: "Reads active scoring models via in-memory pointer reference, zero-allocation"
  - source: "Model Evaluator"
    destination: "Audit Payload Builder"
    description: "Passes decision context via Go internal channel"
  - source: "Audit Payload Builder"
    destination: "Audit & Event Bus"
    description: "Publishes tamper-evident payloads via Kafka Protocol, asynchronous batching"