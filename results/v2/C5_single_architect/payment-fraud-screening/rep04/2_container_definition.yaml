level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Internal persona reviewing flagged transactions and suspicious payments using a secure Web UI."
  - type: "externalSystem"
    name: "Payment Gateway / Core Ledger"
    description: "External system submitting tokenized payment authorizations."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External system managing analyst authentication using OIDC/OAuth2."
  - type: "externalSystem"
    name: "Audit Archival Storage"
    description: "Amazon S3 with WORM storage for 7-year tamper-evident audit retention."
  - type: "container"
    name: "API Gateway / Ingestion Service"
    technology: "AWS API Gateway / ECS Fargate with Go"
    description: "Ingests payment authorization requests securely and routes them internally."
  - type: "container"
    name: "Scoring Engine"
    technology: "AWS ECS Fargate with Go and in-memory model caching"
    description: "Evaluates card-not-present payment authorizations to detect fraud prior to approval with sub-50ms latency."
  - type: "container"
    name: "Case Management Backend"
    technology: "ECS Fargate with Node.js/Java"
    description: "Provides case management workflows for human analysts and handles transactional case data."
  - type: "container"
    name: "Audit & Event Bus"
    technology: "Amazon MSK / Kafka"
    description: "Provides reliable asynchronous event streaming for decision events and audit logs."
  - type: "container"
    name: "Feature Store"
    technology: "Amazon DynamoDB"
    description: "Ensures predictable single-digit millisecond reads for real-time feature lookups."
  - type: "container"
    name: "Transactional Data Store"
    technology: "Amazon Aurora PostgreSQL"
    description: "Stores transactional case data for the case management backend."
relationships:
  - source: "Payment Gateway / Core Ledger"
    destination: "API Gateway / Ingestion Service"
    description: "Sends authorization requests"
    technology: "HTTPS/REST (TLS 1.3)"
  - source: "API Gateway / Ingestion Service"
    destination: "Scoring Engine"
    description: "Forwards requests for fraud evaluation"
    technology: "gRPC over mTLS"
  - source: "Scoring Engine"
    destination: "Feature Store"
    description: "Queries for real-time feature lookups"
    technology: "AWS SDK / NoSQL API"
  - source: "Scoring Engine"
    destination: "Audit & Event Bus"
    description: "Publishes decision events"
    technology: "Apache Kafka Protocol / Amazon MSK"
  - source: "Fraud Analyst"
    destination: "Case Management Backend"
    description: "Reviews flagged transactions and manages cases"
    technology: "HTTPS"
  - source: "Case Management Backend"
    destination: "Transactional Data Store"
    description: "Reads and writes transactional case data"
    technology: "PostgreSQL Wire Protocol"
  - source: "Audit & Event Bus"
    destination: "Audit Archival Storage"
    description: "Writes decision payloads for compliance"
    technology: "AWS SDK / S3 API with WORM"
  - source: "Case Management Backend"
    destination: "Identity Provider"
    description: "Authenticates analysts"
    technology: "OIDC/OAuth2"