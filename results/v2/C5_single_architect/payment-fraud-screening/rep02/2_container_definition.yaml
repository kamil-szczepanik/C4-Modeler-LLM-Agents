level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Accesses case management interface for fraud analysis and reviewing flagged transactions."
  - type: "externalSystem"
    name: "Payment Gateway / Core Processing Platform"
    description: "Sends card-not-present payment authorizations to be screened for fraud."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Authenticates fraud analysts."
  - type: "externalSystem"
    name: "AWS Key Management Service (KMS) / HSM"
    description: "Provides cryptographic keys for envelope encryption and tamper-evident audit logs."
  - type: "container"
    name: "API Gateway / Application Load Balancer"
    technology: "AWS API Gateway / ALB"
    description: "Routes incoming traffic to internal services using TLS 1.3."
  - type: "container"
    name: "Fraud Scoring Engine"
    technology: "Go or Rust, AWS ECS Fargate"
    description: "Screens payment authorizations in real time to meet sub-50ms latency requirements."
  - type: "container"
    name: "Case Management Service"
    technology: "Node.js / TypeScript, AWS ECS Fargate"
    description: "Provides case management and audit log archiving capabilities for fraud analysts."
  - type: "container"
    name: "Amazon ElastiCache Redis"
    technology: "Amazon ElastiCache Redis"
    description: "Stores feature stores and rule caching for low-latency access."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Stores transactional case data and audit logs."
  - type: "container"
    name: "Amazon S3 Immutable Vault"
    technology: "Amazon S3 with Object Lock in Compliance Mode"
    description: "Archives audit logs and case data in a tamper-evident manner."
  - type: "container"
    name: "Amazon SQS / SNS"
    technology: "Amazon SQS / SNS"
    description: "Handles asynchronous event publishing and consumption between services."
relationships:
  - source: "Payment Gateway / Core Processing Platform"
    destination: "API Gateway / Application Load Balancer"
    description: "Invokes payment authorization requests"
    technology: "HTTPS using TLS 1.3"
  - source: "API Gateway / Application Load Balancer"
    destination: "Fraud Scoring Engine"
    description: "Calls fraud scoring logic"
    technology: "gRPC over HTTP/2"
  - source: "Fraud Scoring Engine"
    destination: "Amazon ElastiCache Redis"
    description: "Reads/writes from feature stores and rule cache"
    technology: "Redis Protocol"
  - source: "Fraud Scoring Engine"
    destination: "Amazon Aurora PostgreSQL"
    description: "Queries transactional data"
    technology: "PostgreSQL Wire Protocol"
  - source: "Fraud Scoring Engine"
    destination: "Amazon SQS / SNS"
    description: "Publishes asynchronous events"
    technology: "AWS SDK / SQS/SNS API"
  - source: "Case Management Service"
    destination: "Amazon SQS / SNS"
    description: "Consumes asynchronous events"
    technology: "AWS SDK / SQS API"
  - source: "Case Management Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads/writes transactional case data"
    technology: "PostgreSQL Wire Protocol"
  - source: "Case Management Service"
    destination: "Amazon S3 Immutable Vault"
    description: "Archives audit logs and case data"
    technology: "AWS SDK / S3 API"
  - source: "Fraud Analyst"
    destination: "Case Management Service"
    description: "Accesses case management interface"
    technology: "HTTPS"
  - source: "Fraud Analyst"
    destination: "Identity Provider"
    description: "Authenticates for system access"
    technology: "HTTPS / OIDC"