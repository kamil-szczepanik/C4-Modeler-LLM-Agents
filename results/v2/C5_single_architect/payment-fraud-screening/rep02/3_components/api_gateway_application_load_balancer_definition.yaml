level: component
scope: "Component diagram for the API Gateway / Application Load Balancer container"
parentContainer:
  name: "API Gateway / Application Load Balancer"
elements:
  - type: "component"
    name: "TLS Termination Engine"
    technology: "AWS ALB TLS Termination Engine"
    description: "Terminates incoming HTTPS connections using TLS 1.3 for payment authorizations and analyst commands."
  - type: "component"
    name: "Listener Rules"
    technology: "AWS ALB Listener Rules"
    description: "Evaluates and routes incoming traffic to the Fraud Scoring Engine or Case Management Service."
relationships:
  - source: "TLS Termination Engine"
    destination: "Listener Rules"
    description: "Decrypts and forwards traffic"