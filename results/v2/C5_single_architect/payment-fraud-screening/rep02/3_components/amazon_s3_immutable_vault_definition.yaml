level: component
scope: "Component diagram for the Amazon S3 Immutable Vault container"
parentContainer:
  name: "Amazon S3 Immutable Vault"
elements:
  - type: "component"
    name: "Vault Ingestion Interceptor"
    technology: "Go on AWS Lambda"
    description: "Submits immutable audit logs and case artifacts"
  - type: "component"
    name: "S3 Object Lock Manager"
    technology: "AWS S3 Configuration"
    description: "Stores objects with retention policies"
  - type: "component"
    name: "Audit Verification Worker"
    technology: "Python on AWS Lambda"
    description: "Reads and verifies payload hashes"
  - type: "component"
    name: "Access Control Enforcer"
    technology: "AWS IAM / S3 Bucket Policies"
    description: "Enforces strict least-privilege access control"
relationships:
  - source: "Vault Ingestion Interceptor"
    destination: "S3 Object Lock Manager"
    description: "Stores objects with retention policies [S3 API]"
  - source: "Audit Verification Worker"
    destination: "S3 Object Lock Manager"
    description: "Reads and verifies payload hashes [S3 API (Read-Only)]"