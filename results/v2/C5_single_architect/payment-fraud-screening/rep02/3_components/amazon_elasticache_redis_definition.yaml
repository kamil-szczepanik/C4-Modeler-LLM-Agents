level: component
scope: "Component diagram for the Amazon ElastiCache Redis container"
parentContainer:
  name: "Amazon ElastiCache Redis"
elements:
  - type: "component"
    name: "Feature Store Component"
    technology: "In-Memory Hash/Sorted Sets"
    description: "Reads/writes sliding-window aggregates and velocity metrics."
  - type: "component"
    name: "Rule Cache Component"
    technology: "In-Memory KV"
    description: "Reads active fraud rules and model thresholds."
  - type: "component"
    name: "Session State Component"
    technology: "In-Memory KV"
    description: "Reads/writes analyst session states and workspace locks."
relationships:
  - source: "Feature Store Component"
    destination: "Rule Cache Component"
    description: "Operates within the shared ElastiCache Redis cluster."