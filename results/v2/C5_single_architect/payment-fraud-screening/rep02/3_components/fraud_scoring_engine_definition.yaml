level: component
scope: "Component diagram for the Fraud Scoring Engine container"
parentContainer:
  name: "Fraud Scoring Engine"
elements:
  - type: "component"
    name: "API Handler Component"
    technology: "Tonic gRPC framework, Rust"
    description: "Ingests authorization requests via gRPC over HTTP/2."
  - type: "component"
    name: "Scoring Engine Core Component"
    technology: "Native Rust async tasks"
    description: "Executes scoring logic via in-memory function calls."
  - type: "component"
    name: "Feature Aggregator Component"
    technology: "Tokio async I/O with Redis-rs, Rust"
    description: "Fetches velocity features concurrently within the latency budget."
  - type: "component"
    name: "Data Access Component"
    technology: "Rust, PostgreSQL Wire Protocol"
    description: "Queries reference data from the database."
  - type: "component"
    name: "Audit Logger Component"
    technology: "AWS SDK for Rust, aws-sdk-sqs"
    description: "Dispatches tamper-evident payloads to SQS."
relationships:
  - source: "API Handler Component"
    destination: "Scoring Engine Core Component"
    description: "Executes scoring logic [In-memory function call]"
  - source: "Feature Aggregator Component"
    destination: "Amazon ElastiCache Redis"
    description: "Fetches velocity features [Redis Protocol via TLS]"
  - source: "Data Access Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "Queries reference data [PostgreSQL Wire Protocol]"
  - source: "Audit Logger Component"
    destination: "Amazon SQS / SNS"
    description: "Dispatches tamper-evident payloads [AWS SDK / SQS API]"