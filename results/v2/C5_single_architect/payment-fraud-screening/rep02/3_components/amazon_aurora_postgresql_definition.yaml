level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL container"
parentContainer:
  name: "Amazon Aurora PostgreSQL"
elements:
  - type: "component"
    name: "Database Engine"
    technology: "Amazon Aurora PostgreSQL 15"
    description: "Manages ACID-compliant case data, transaction logs, and multi-AZ replication."
  - type: "component"
    name: "PgBouncer Connection Pooler"
    technology: "PgBouncer"
    description: "Handles high concurrency, manages persistent connections, and prevents database connection exhaustion."
relationships:
  - source: "PgBouncer Connection Pooler"
    destination: "Database Engine"
    description: "Forwards pooled client queries and transactions [PostgreSQL Wire Protocol]"