level: component
scope: "Component diagram for the Case Management Service container"
parentContainer:
  name: "Case Management Service"
elements:
  - type: "component"
    name: "Case API Controller"
    technology: "Express.js/Fastify"
    description: "Handles incoming HTTP requests from fraud analysts and provides secure case workflows."
  - type: "component"
    name: "Case Domain Service"
    technology: "Node.js / TypeScript"
    description: "Contains business logic for managing investigative cases and orchestrates domain operations."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Node.js / TypeScript"
    description: "Ensures tamper-evident 7-year auditability by logging transactions and archiving logs."
  - type: "component"
    name: "Tokenization / Masking Proxy Component"
    technology: "AWS KMS SDK / Custom Tokenization Utility"
    description: "Sanitizes input payloads and performs PAN masking and deterministic hashing for PCI-DSS compliance."
  - type: "component"
    name: "Fraud Analyst"
    technology: "External User"
    description: "External user who accesses the case management interface to investigate suspicious payment authorizations."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Stores transactional case data and transactional audit logs."
  - type: "component"
    name: "Amazon S3 Immutable Vault"
    technology: "Amazon S3 with Object Lock"
    description: "Archives audit logs to ensure compliance and immutability."
  - type: "component"
    name: "Amazon SQS / SNS"
    technology: "AWS SQS / SNS"
    description: "Publishes asynchronous log batches."
relationships:
  - source: "Fraud Analyst"
    destination: "Case API Controller"
    description: "Accesses case management interface [HTTPS]"
  - source: "Case API Controller"
    destination: "Tokenization / Masking Proxy Component"
    description: "Sanitizes input payload [In-process function call]"
  - source: "Tokenization / Masking Proxy Component"
    destination: "Case Domain Service"
    description: "Forwards scrubbed payloads [In-process function call]"
  - source: "Case Domain Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads/writes transactional case data [PostgreSQL Wire Protocol via TypeORM/Prisma]"
  - source: "Audit Logger Component"
    destination: "Amazon Aurora PostgreSQL"
    description: "Writes transactional audit logs [PostgreSQL Wire Protocol]"
  - source: "Audit Logger Component"
    destination: "Amazon SQS / SNS"
    description: "Publishes asynchronous log batches [AWS SDK / SQS API]"
  - source: "Audit Logger Component"
    destination: "Amazon S3 Immutable Vault"
    description: "Archives audit logs [AWS SDK / S3 API with Object Lock]"