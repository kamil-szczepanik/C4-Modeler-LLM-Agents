level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Screens card-not-present payment authorizations for a mid-size payment processor and provides case management for fraud analysts."
elements:
  - type: "person"
    name: "Fraud Analyst"
    description: "Interacts with the system for case management and fraud analysis, authenticating securely via an Identity Provider."
  - type: "externalSystem"
    name: "Payment Gateway / Core Processing Platform"
    description: "Sends payment authorization requests to be screened for fraud."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "Authenticates fraud analysts via OIDC/SAML."
  - type: "externalSystem"
    name: "AWS Key Management Service (KMS) / HSM"
    description: "Provides cryptographic signing and envelope encryption for tamper-evident audit logs."
relationships:
  - source: "Payment Gateway / Core Processing Platform"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Sends authorization requests for fraud screening"
    technology: "REST/gRPC over HTTPS with mTLS"
  - source: "Fraud Analyst"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Interacts with the system via Web UI for case management"
    technology: "HTTPS"
  - source: "Fraud Analyst"
    destination: "Identity Provider (IdP)"
    description: "Authenticates against the identity provider"
    technology: "OIDC/SAML"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "AWS Key Management Service (KMS) / HSM"
    description: "Connects for cryptographic signing and envelope encryption"
    technology: "AWS PrivateLink and HTTPS"