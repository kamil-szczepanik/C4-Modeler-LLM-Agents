level: container
scope: "Container diagram for Real-Time Payment Fraud Screening System"
system:
  name: "Real-Time Payment Fraud Screening System"
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Internal actors reviewing suspicious transactions and case management."
  - type: "person"
    name: "Regulatory / Compliance Auditors"
    description: "External actors verifying tamper-evident audit logs."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer Systems"
    description: "External actor submitting card-not-present payment authorizations."
  - type: "container"
    name: "AWS API Gateway"
    technology: "AWS API Gateway (REST)"
    description: "Entry point for authorization requests and client traffic."
  - type: "container"
    name: "Scoring Engine"
    technology: "Go, AWS ECS Fargate"
    description: "Microservice providing real-time sub-50ms P99 latency fraud scoring."
  - type: "container"
    name: "Case Management Backend"
    technology: "Node.js/Go, AWS ECS Fargate"
    description: "Handles analyst case reviews and management workflows."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Provides low-latency rule/model state and data storage."
  - type: "container"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Relational data store for structured application data."
  - type: "container"
    name: "Amazon Kinesis Data Firehose"
    technology: "Amazon Kinesis Data Firehose"
    description: "Streams audit logs from the scoring engine."
  - type: "container"
    name: "Amazon S3 Object Lock"
    technology: "Amazon S3 with Object Lock"
    description: "Tamper-evident storage for 7-year immutable audit log retention."
relationships:
  - source: "Payment Gateway / Acquirer Systems"
    destination: "AWS API Gateway"
    description: "Submits authorization requests"
    technology: "HTTPS/JSON"
  - source: "Fraud Analysts"
    destination: "Case Management Backend"
    description: "Performs case reviews"
    technology: "HTTPS"
  - source: "AWS API Gateway"
    destination: "Scoring Engine"
    description: "Routes authorization requests for scoring"
    technology: "Internal HTTP/REST"
  - source: "Scoring Engine"
    destination: "Amazon DynamoDB"
    description: "Reads and writes rule/model state"
    technology: "AWS SDK"
  - source: "Scoring Engine"
    destination: "Amazon Kinesis Data Firehose"
    description: "Sends audit logs"
    technology: "HTTPS"
  - source: "Amazon Kinesis Data Firehose"
    destination: "Amazon S3 Object Lock"
    description: "Persists immutable audit logs"
    technology: "AWS S3 API"
  - source: "Case Management Backend"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads and writes case data"
    technology: "SQL / AWS SDK"