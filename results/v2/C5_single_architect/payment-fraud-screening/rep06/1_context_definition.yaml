level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening System"
  description: "Evaluates card-not-present payment authorizations for fraud prior to approval and provides a case management workflow for fraud analysts."
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Internal actors reviewing suspicious transactions."
  - type: "person"
    name: "Regulatory / Compliance Auditors"
    description: "External actors verifying 7-year audit logs."
  - type: "externalSystem"
    name: "Payment Gateway / Acquirer Systems"
    description: "External actor submitting payment authorizations."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system managing authentication and RBAC."
  - type: "externalSystem"
    name: "External Tokenization/Vault Service"
    description: "External system handling card data."
relationships:
  - source: "Payment Gateway / Acquirer Systems"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Submits authorizations"
    technology: "gRPC/REST over TLS"
  - source: "Fraud Analysts"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Reviews payments"
    technology: "HTTPS"
  - source: "Regulatory / Compliance Auditors"
    destination: "Real-Time Payment Fraud Screening System"
    description: "Accesses audit records"
    technology: "secure export/audit portal"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "OAuth2/OIDC over HTTPS"
  - source: "Real-Time Payment Fraud Screening System"
    destination: "External Tokenization/Vault Service"
    description: "Resolves payment tokens"
    technology: "gRPC/mTLS"