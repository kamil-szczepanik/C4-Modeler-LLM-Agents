level: component
scope: "Component diagram for the Amazon DynamoDB container"
parentContainer:
  name: "Amazon DynamoDB"
elements:
  - type: "component"
    name: "FraudRulesTable"
    technology: "Amazon DynamoDB (Single-table design with composite primary keys RuleType, RuleID)"
    description: "Stores rule and model state for sub-50ms rule retrieval by the Scoring Engine."
  - type: "component"
    name: "CaseManagementTable"
    technology: "Amazon DynamoDB"
    description: "Stores analyst workflow state accessed by the Case Management Backend."
relationships:
  - source: "Scoring Engine"
    destination: "FraudRulesTable"
    description: "Reads and writes rule/model state via AWS SDK / HTTPS (TCP 443) using Consistent Read"
  - source: "Case Management Backend"
    destination: "CaseManagementTable"
    description: "Reads and writes analyst workflow state via AWS SDK / HTTPS (TCP 443)"