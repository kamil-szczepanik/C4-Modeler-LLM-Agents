# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the AWS API Gateway container"
parentContainer:
  name: "AWS API Gateway"
elements:
  - type: "component"
    name: "Request Validator"
    technology: "AWS API Gateway native Request Validator"
    description: "Validates incoming JSON schema for payment authorization requests."
  - type: "component"
    name: "Authorizer"
    technology: "AWS API Gateway Authorizer (mTLS)"
    description: "Handles mTLS authorization for external payment gateway and acquirer systems."
  - type: "component"
    name: "HTTP Proxy Integration"
    technology: "VPC Link / HTTP Proxy"
    description: "Routes validated requests to the Scoring Engine over internal VPC Links."
relationships:
  - source: "Request Validator"
    destination: "Authorizer"
    description: "Validates request payloads after authorization"
  - source: "Authorizer"
    destination: "HTTP Proxy Integration"
    description: "Passes authenticated requests for routing"