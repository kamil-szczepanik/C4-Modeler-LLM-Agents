level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL container"
parentContainer:
  name: "Amazon Aurora PostgreSQL"
elements:
  - type: "component"
    name: "Case Management Schema"
    technology: "PostgreSQL, Row-Level Security"
    description: "Stores case data for fraud analysts."
  - type: "component"
    name: "Audit Log & Tamper-Evident Ledger"
    technology: "PostgreSQL, pgaudit"
    description: "Appends immutable compliance logs for auditability."
  - type: "component"
    name: "Model Registry Schema"
    technology: "PostgreSQL"
    description: "Stores active rule and model metadata."
relationships:
  - source: "Scoring Engine"
    destination: "Model Registry Schema"
    description: "Polls active rule and model metadata via [TCP / PostgreSQL Wire Protocol]"
  - source: "Case Management Backend"
    destination: "Case Management Schema"
    description: "Reads and writes case data via [TCP / PostgreSQL Wire Protocol]"
  - source: "Case Management Backend"
    destination: "Audit Log & Tamper-Evident Ledger"
    description: "Appends immutable compliance logs via [TCP / PostgreSQL Wire Protocol]"