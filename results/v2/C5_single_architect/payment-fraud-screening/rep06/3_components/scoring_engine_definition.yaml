level: component
scope: "Component diagram for the Scoring Engine container"
parentContainer:
  name: "Scoring Engine"
elements:
  - type: "component"
    name: "HTTP Handler / Router Component"
    technology: "Go (net/http)"
    description: "Receives inbound routing requests from the AWS API Gateway."
  - type: "component"
    name: "Rule Evaluator Component"
    technology: "In-memory AST"
    description: "Evaluates rules using an in-memory abstract syntax tree for rapid transaction assessment."
  - type: "component"
    name: "Model Scoring Component"
    technology: "Embedded ONNX Runtime / compiled decision trees"
    description: "Executes embedded model scoring to meet sub-50ms P99 latency requirements."
  - type: "component"
    name: "Audit Dispatcher Component"
    technology: "Worker pools"
    description: "Asynchronously dispatches audit logs without impacting real-time performance."
relationships:
  - source: "HTTP Handler / Router Component"
    destination: "Rule Evaluator Component"
    description: "Invokes rule evaluation for inbound transactions"
  - source: "HTTP Handler / Router Component"
    destination: "Model Scoring Component"
    description: "Invokes model scoring for transaction evaluation"
  - source: "HTTP Handler / Router Component"
    destination: "Audit Dispatcher Component"
    description: "Dispatches asynchronous audit logs"
  - source: "Audit Dispatcher Component"
    destination: "Amazon Kinesis Data Firehose"
    description: "Sends asynchronous audit logs [HTTPS]"
  - source: "Audit Dispatcher Component"
    destination: "Amazon S3 Object Lock"
    description: "Stores tamper-evident immutable audit trails [AWS SDK over HTTPS]"
  - source: "Rule Evaluator Component"
    destination: "Amazon Aurora PostgreSQL / Amazon DynamoDB"
    description: "Reads compiled rule definitions and model state [AWS SDK / pgx pool over TLS]"
  - source: "Model Scoring Component"
    destination: "Amazon Aurora PostgreSQL / Amazon DynamoDB"
    description: "Reads model state and configuration [AWS SDK / pgx pool over TLS]"