level: component
scope: "Component diagram for the Amazon Kinesis Data Firehose container"
parentContainer:
  name: "Amazon Kinesis Data Firehose"
elements:
  - type: "component"
    name: "Firehose Buffer Manager"
    technology: "Amazon Kinesis Data Firehose Native"
    description: "Batches incoming audit logs before sending them for transformation."
  - type: "component"
    name: "Firehose Data Transformer"
    technology: "AWS Lambda"
    description: "Sanitizes audit logs natively before persistence."
  - type: "component"
    name: "S3 Delivery Stream Writer"
    technology: "Amazon Kinesis Data Firehose Native"
    description: "Writes immutable log batches to storage."
relationships:
  - source: "Firehose Buffer Manager"
    destination: "Firehose Data Transformer"
    description: "Invokes record transformation"
  - source: "S3 Delivery Stream Writer"
    destination: "Amazon S3 Object Lock"
    description: "Writes immutable log batches with SSE-KMS"