level: component
scope: "Component diagram for the Case Management Backend container"
parentContainer:
  name: "Case Management Backend"
elements:
  - type: "component"
    name: "Fraud Analysts"
    technology: "External User"
    description: "External users reviewing suspicious payments."
  - type: "component"
    name: "Case API Handler"
    technology: "Node.js/Express"
    description: "Manages incoming analyst HTTP requests."
  - type: "component"
    name: "Case Workflow Engine"
    technology: "Go"
    description: "Executes state transitions and business logic."
  - type: "component"
    name: "Data Access Repository"
    technology: "Go"
    description: "Enforces data masking and queries the database."
  - type: "component"
    name: "Audit Logger Component"
    technology: "Go"
    description: "Generates and exports tamper-evident compliance trails."
  - type: "component"
    name: "Amazon Aurora PostgreSQL"
    technology: "Amazon Aurora PostgreSQL"
    description: "Stores case data."
  - type: "component"
    name: "Amazon S3 Object Lock"
    technology: "Amazon S3 Object Lock"
    description: "Stores immutable audit logs."
relationships:
  - source: "Fraud Analysts"
    destination: "Case API Handler"
    description: "Manages cases [HTTPS/REST]"
  - source: "Case API Handler"
    destination: "Case Workflow Engine"
    description: "Invokes business logic [Internal Function Call / gRPC]"
  - source: "Case Workflow Engine"
    destination: "Data Access Repository"
    description: "Persists case state [In-memory / Go interfaces]"
  - source: "Data Access Repository"
    destination: "Amazon Aurora PostgreSQL"
    description: "Reads/writes masked case data [SQL/TCP]"
  - source: "Case Workflow Engine"
    destination: "Audit Logger Component"
    description: "Dispatches audit events [Internal Async / Channel]"
  - source: "Audit Logger Component"
    destination: "Amazon S3 Object Lock"
    description: "Persists tamper-evident audit logs [AWS SDK / HTTPS]"