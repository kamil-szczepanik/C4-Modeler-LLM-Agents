level: component
scope: "Component diagram for the Amazon S3 Object Lock container"
parentContainer:
  name: "Amazon S3 Object Lock"
elements:
  - type: "component"
    name: "S3 Bucket with Object Lock"
    technology: "AWS S3 Bucket with Object Lock (Compliance Mode)"
    description: "Stores immutable audit logs enforcing 7-year retention."
  - type: "component"
    name: "Bucket Lifecycle Policy Manager"
    technology: "AWS S3 Lifecycle"
    description: "Manages object lifecycle and retention policies."
  - type: "component"
    name: "AWS KMS Encryption Key"
    technology: "AWS KMS"
    description: "Provides encryption and decryption for audit objects."
relationships:
  - source: "S3 Bucket with Object Lock"
    destination: "AWS KMS Encryption Key"
    description: "Encrypts and decrypts audit objects"
  - source: "Bucket Lifecycle Policy Manager"
    destination: "S3 Bucket with Object Lock"
    description: "Applies retention and lifecycle rules"