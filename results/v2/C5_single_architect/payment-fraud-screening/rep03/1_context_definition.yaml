level: context
scope: "System Context diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
  description: "Screens card-not-present payment authorizations for fraud prior to approval and provides a web interface for fraud analysts to review suspicious transactions."
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Internal users accessing the system via Web UI for case management and reviewing suspicious transactions."
  - type: "externalSystem"
    name: "Payment Switch / Core Processing"
    description: "External system sending transaction streams and receiving decisions (approve, decline, review)."
  - type: "externalSystem"
    name: "Merchant / Payment Gateway"
    description: "External users initiating payment authorizations via API."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External system providing OAuth2/OIDC authentication for analysts."
  - type: "externalSystem"
    name: "Model Training Environment (ML Pipeline)"
    description: "Decoupled environment pushing updated scoring models via S3."
  - type: "container"
    name: "Fraud Screening Core"
    description: "Container handling real-time authorization scoring."
    technology: "Container, gRPC, HTTPS"
  - type: "container"
    name: "Case Management Service"
    description: "Container managing analyst reviews."
    technology: "Container, HTTPS"
  - type: "container"
    name: "Audit & Compliance Archive"
    description: "AWS S3 with Object Lock for 7-year tamper-evident storage."
    technology: "AWS S3"
relationships:
  - source: "Merchant / Payment Gateway"
    destination: "Real-Time Payment Fraud Screening"
    description: "Initiates payment authorizations"
    technology: "REST/gRPC over TLS"
  - source: "Payment Switch / Core Processing"
    destination: "Real-Time Payment Fraud Screening"
    description: "Sends transaction streams and receives decisions"
    technology: "gRPC/HTTP over TLS"
  - source: "Fraud Analysts"
    destination: "Real-Time Payment Fraud Screening"
    description: "Accesses system for case management and review"
    technology: "HTTPS/TLS"
  - source: "Case Management Service"
    destination: "Identity Provider (IdP)"
    description: "Authenticates analysts"
    technology: "OAuth2/OIDC over HTTPS"
  - source: "Fraud Screening Core"
    destination: "Audit & Compliance Archive"
    description: "Writes tamper-evident decision logs"
    technology: "AWS SDK/IAM"
  - source: "Model Training Environment (ML Pipeline)"
    destination: "Fraud Screening Core"
    description: "Pushes updated scoring models"
    technology: "S3 bucket synchronization"