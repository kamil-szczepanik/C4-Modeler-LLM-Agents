level: component
scope: "Component diagram for the Data Store container"
parentContainer:
  name: "Data Store"
elements:
  - type: "component"
    name: "Transactional Database"
    technology: "Amazon Aurora PostgreSQL"
    description: "Stores core transactional data for payment authorizations and review cases."
  - type: "component"
    name: "Audit Ledger"
    technology: "Amazon Aurora PostgreSQL"
    description: "Maintains cryptographic hash-chaining to satisfy 7-year tamper-evident auditability requirements."
  - type: "component"
    name: "Model and Feature Store Schema"
    technology: "Amazon Aurora PostgreSQL"
    description: "Houses feature store schemas and model metadata for real-time fraud scoring."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer / Aurora Proxy"
    description: "Prevents connection exhaustion under 3,000 TPS load by managing database connections."
relationships:
  - source: "Scoring Engine"
    destination: "Connection Pooler"
    description: "Writes decisions and audit logs via TCP (PostgreSQL Wire Protocol)."
  - source: "Case Management API"
    destination: "Connection Pooler"
    description: "Manages review cases via TCP (PostgreSQL Wire Protocol)."
  - source: "Connection Pooler"
    destination: "Transactional Database"
    description: "Routes queries and transactions."
  - source: "Connection Pooler"
    destination: "Audit Ledger"
    description: "Routes audit logs and hash-chaining updates."
  - source: "Connection Pooler"
    destination: "Model and Feature Store Schema"
    description: "Routes feature store queries and model data lookups."