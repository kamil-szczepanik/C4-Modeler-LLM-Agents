level: component
scope: "Component diagram for the Scoring Engine container"
parentContainer:
  name: "Scoring Engine"
elements:
  - type: "component"
    name: "API Handler"
    technology: "Go"
    description: "Manages inbound gRPC requests from the API Gateway."
  - type: "component"
    name: "Token Sanitizer"
    technology: "Go"
    description: "Redacts and tokenizes raw Primary Account Numbers (PAN)."
  - type: "component"
    name: "Rule Engine"
    technology: "Go"
    description: "Evaluates deterministic business rules in-memory."
  - type: "component"
    name: "Model Runner"
    technology: "Go, ONNX Runtime"
    description: "Executes compiled machine learning models locally."
  - type: "component"
    name: "Audit Logger"
    technology: "Go"
    description: "Asynchronously generates and persists tamper-evident decision logs."
  - type: "component"
    name: "Data Store"
    technology: "Amazon Aurora PostgreSQL"
    description: "Stores transactional data and audit logs."
  - type: "component"
    name: "API Gateway"
    technology: "AWS API Gateway"
    description: "Routes authorization requests via gRPC to the API Handler."
relationships:
  - source: "API Gateway"
    destination: "API Handler"
    description: "Routes authorization requests via gRPC"
  - source: "API Handler"
    destination: "Token Sanitizer"
    description: "Passes raw requests via synchronous in-process calls"
  - source: "Token Sanitizer"
    destination: "Rule Engine"
    description: "Forwards sanitized feature vectors via synchronous in-process calls"
  - source: "Token Sanitizer"
    destination: "Model Runner"
    description: "Forwards sanitized feature vectors via synchronous in-process calls"
  - source: "Rule Engine"
    destination: "Audit Logger"
    description: "Dispatches event data via Go channels"
  - source: "Model Runner"
    destination: "Audit Logger"
    description: "Dispatches event data via Go channels"
  - source: "Audit Logger"
    destination: "Data Store"
    description: "Writes audit logs via TCP"