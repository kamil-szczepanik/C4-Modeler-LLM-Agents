level: component
scope: "Component diagram for the Case Management API container"
parentContainer:
  name: "Case Management API"
elements:
  - type: "component"
    name: "Fraud Analysts"
    technology: "Web UI"
    description: "External users reviewing suspicious payment cases via web UI."
  - type: "component"
    name: "Case Controller"
    technology: "Node.js / Express / TypeScript"
    description: "Node.js/Express service exposing REST endpoints for analyst workflows."
  - type: "component"
    name: "Audit & Evidence Service"
    technology: "TypeScript / Node.js"
    description: "Component capturing analyst decisions with cryptographically verifiable hashes."
  - type: "component"
    name: "Case Repository"
    technology: "Prisma / Amazon Aurora PostgreSQL"
    description: "Data access layer interacting with Amazon Aurora PostgreSQL."
  - type: "component"
    name: "Masking & Tokenization Proxy"
    technology: "Axios Interceptors"
    description: "Interceptor middleware ensuring card numbers are redacted."
relationships:
  - source: "Fraud Analysts"
    destination: "Case Controller"
    description: "HTTPS/JSON"
  - source: "Case Controller"
    destination: "Audit & Evidence Service"
    description: "In-process Function Call"
  - source: "Case Controller"
    destination: "Case Repository"
    description: "TCP/PostgreSQL Protocol"
  - source: "Case Repository"
    destination: "Masking & Tokenization Proxy"
    description: "In-process Middleware"