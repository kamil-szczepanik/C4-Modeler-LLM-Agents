level: container
scope: "Container diagram for Real-Time Payment Fraud Screening"
system:
  name: "Real-Time Payment Fraud Screening"
elements:
  - type: "person"
    name: "Fraud Analysts"
    description: "Internal users accessing the case management interface to review suspicious transactions."
  - type: "externalSystem"
    name: "Payment Gateway / External Systems"
    description: "Inbound traffic source and core processing systems sending payment authorizations."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway (REST/HTTP)"
    description: "Handles inbound traffic from the payment gateway."
  - type: "container"
    name: "Scoring Engine"
    technology: "Go, AWS ECS Fargate, Embedded Model Runtime"
    description: "Microservice that screens payment authorizations in real-time to detect fraud."
  - type: "container"
    name: "Case Management API"
    technology: "Node.js / Python, AWS ECS Fargate"
    description: "Service powering fraud analyst workflows and case management."
  - type: "container"
    name: "Data Store"
    technology: "Amazon Aurora PostgreSQL"
    description: "Stores transactional data and tamper-evident audit logs."
  - type: "container"
    name: "Event Stream"
    technology: "Amazon SQS"
    description: "Decouples events asynchronously off the critical path."
relationships:
  - source: "Payment Gateway / External Systems"
    destination: "API Gateway"
    description: "Sends payment authorizations"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "Scoring Engine"
    description: "Routes authorization requests for fraud scoring"
    technology: "gRPC"
  - source: "Scoring Engine"
    destination: "Data Store"
    description: "Reads and writes transactional data and logs"
    technology: "TCP"
  - source: "Scoring Engine"
    destination: "Event Stream"
    description: "Publishes asynchronous events"
    technology: "AWS SDK/HTTPS"
  - source: "Fraud Analysts"
    destination: "Case Management API"
    description: "Accesses case management workflows"
    technology: "HTTPS"