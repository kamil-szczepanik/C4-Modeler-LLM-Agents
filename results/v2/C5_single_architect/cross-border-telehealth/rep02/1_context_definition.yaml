level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides secure video consultations, e-prescriptions, and AI symptom checks for patients in the EU and US while ensuring GDPR, HIPAA, and EU MDR compliance."
elements:
  - type: "person"
    name: "Patients (EU/US)"
    description: "End-users accessing telehealth services via web or mobile applications."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Healthcare providers conducting video consultations and issuing prescriptions."
  - type: "externalSystem"
    name: "AI Symptom Checker Service"
    description: "Isolated cognitive service providing urgency recommendations."
  - type: "externalSystem"
    name: "National e-Prescription Gateways (EU) & Pharmacy Systems (US)"
    description: "External systems for dispatching prescriptions."
  - type: "externalSystem"
    name: "Third-party Video Infrastructure"
    description: "WebRTC-based service handling real-time consultations."
relationships:
  - source: "Patients (EU/US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Access telehealth services via web or mobile applications"
    technology: "HTTPS with TLS encryption"
  - source: "Licensed Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Conduct video consultations and issue prescriptions"
    technology: "HTTPS with TLS encryption"
  - source: "Cross-Border Telehealth Platform"
    destination: "Third-party Video Infrastructure"
    description: "Handle real-time consultations supporting degraded connections"
    technology: "WebRTC"
  - source: "Cross-Border Telehealth Platform"
    destination: "AI Symptom Checker Service"
    description: "Send inference requests with immutable request logging"
    technology: "gRPC over TLS"
  - source: "Cross-Border Telehealth Platform"
    destination: "National e-Prescription Gateways (EU) & Pharmacy Systems (US)"
    description: "Dispatch prescriptions securely"
    technology: "Secure API gateways using TLS and mTLS (HL7 FHIR / national standards)"