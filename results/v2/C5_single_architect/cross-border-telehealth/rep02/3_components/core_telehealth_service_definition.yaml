level: component
scope: "Component diagram for the Core Telehealth Service container"
parentContainer:
  name: "Core Telehealth Service"
elements:
  - type: "component"
    name: "Consultation Management"
    technology: "Go"
    description: "Manages business logic for cross-border video consultations."
  - type: "component"
    name: "Consent Ledger"
    technology: "Go"
    description: "Manages user consent and evaluates permissions."
  - type: "component"
    name: "Audit & Traceability"
    technology: "Go"
    description: "Handles audit logging for compliance and traceability."
  - type: "component"
    name: "Prescription Dispatcher"
    technology: "Go"
    description: "Handles prescription routing and dispatching."
relationships:
  - source: "Consultation Management"
    destination: "Prescription Dispatcher"
    description: "Internal execution via Go interfaces"
  - source: "Consultation Management"
    destination: "Cloud SQL PostgreSQL"
    description: "Persists relational data using pgx driver over TLS 1.3"
  - source: "Audit & Traceability"
    destination: "Cloud SQL PostgreSQL"
    description: "Persists audit logs using pgx driver over TLS 1.3"
  - source: "Consent Ledger"
    destination: "Memorystore Redis"
    description: "Evaluates permissions using Redis RESP3 over TLS 1.3"