level: component
scope: "Component diagram for the AI Symptom Checker Orchestrator container"
parentContainer:
  name: "AI Symptom Checker Orchestrator"
elements:
  - type: "component"
    name: "Inference Controller"
    technology: "FastAPI, Python"
    description: "Exposing REST/gRPC endpoints and enforcing region isolation headers."
  - type: "component"
    name: "Consent & Policy Enforcer"
    technology: "Python Middleware"
    description: "Validating patient consent and geographic compliance before processing."
  - type: "component"
    name: "Region-Aware AI Gateway Client"
    technology: "gRPC Client, Python"
    description: "Routing requests securely to regional AI services via gRPC."
  - type: "component"
    name: "Audit & Traceability Logger"
    technology: "Python SDK"
    description: "Capturing exact inputs, model versions, and outputs for EU MDR compliance."
  - type: "component"
    name: "Cloud SQL PostgreSQL"
    technology: "SQLAlchemy, PostgreSQL, TLS 1.3"
    description: "Regional database storing versioned audit logs and persistent data."
relationships:
  - source: "Inference Controller"
    destination: "Consent & Policy Enforcer"
    description: "Validates regional consent [In-memory]"
  - source: "Consent & Policy Enforcer"
    destination: "Region-Aware AI Gateway Client"
    description: "Authorizes request dispatch [In-memory]"
  - source: "Inference Controller"
    destination: "Region-Aware AI Gateway Client"
    description: "Invokes inference [In-memory]"
  - source: "Inference Controller"
    destination: "Audit & Traceability Logger"
    description: "Dispatches audit payloads [Asyncio Queue]"
  - source: "Audit & Traceability Logger"
    destination: "Cloud SQL PostgreSQL"
    description: "Writes versioned audit logs [SQLAlchemy via TLS 1.3]"