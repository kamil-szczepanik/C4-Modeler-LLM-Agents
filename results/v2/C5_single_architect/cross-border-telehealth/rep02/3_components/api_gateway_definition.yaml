level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Geo-Routing & Region Enforcer"
    technology: "Envoy Proxy / Google Cloud API Gateway"
    description: "Handles geo-routing and region enforcement for application traffic."
  - type: "component"
    name: "Rate Limiting & Degradation Handler"
    technology: "Envoy Proxy"
    description: "Manages rate limiting and degradation handling for filtered traffic."
  - type: "component"
    name: "Authentication & Consent Verifier"
    technology: "Envoy Proxy with custom Lua filters"
    description: "Verifies tokens, authentication, and consent."
  - type: "component"
    name: "Protocol & Payload Translator"
    technology: "Envoy Proxy"
    description: "Translates protocols and payloads."
relationships:
  - source: "Web App / Mobile App"
    destination: "Geo-Routing & Region Enforcer"
    description: "Sends application traffic and real-time signaling [HTTPS and WSS]"
  - source: "Geo-Routing & Region Enforcer"
    destination: "Rate Limiting & Degradation Handler"
    description: "Routes filtered traffic [Internal gRPC]"
  - source: "Rate Limiting & Degradation Handler"
    destination: "Authentication & Consent Verifier"
    description: "Verifies tokens and consent [Internal gRPC]"
  - source: "Authentication & Consent Verifier"
    destination: "Core Telehealth, AI, & E-Prescription Services"
    description: "Forwards authorized requests [gRPC over GCP VPC]"
  - source: "API Gateway"
    destination: "Media Relay & Signaling Service"
    description: "Routes media and signaling traffic [gRPC over GCP VPC]"