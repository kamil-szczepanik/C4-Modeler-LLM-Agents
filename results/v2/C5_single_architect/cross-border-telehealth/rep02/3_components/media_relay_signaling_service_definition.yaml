level: component
scope: "Component diagram for the Media Relay & Signaling Service container"
parentContainer:
  name: "Media Relay & Signaling Service"
elements:
  - type: "component"
    name: "Signaling Controller"
    technology: "Node.js / Go"
    description: "Handles session signaling and orchestrates media tracks."
  - type: "component"
    name: "SFU Media Router"
    technology: "LiveKit / WebRTC SFU"
    description: "Selective Forwarding Unit for multi-party video routing and congestion control."
  - type: "component"
    name: "TURN/STUN Relay Module"
    technology: "Coturn / LiveKit Egress"
    description: "Provides NAT traversal and media relay fallback for restricted networks."
  - type: "component"
    name: "Bandwidth Adaptation Monitor"
    technology: "Go"
    description: "Monitors packet metrics and adjusts Simulcast/SVC layers for unstable connections."
relationships:
  - source: "Signaling Controller"
    destination: "SFU Media Router"
    description: "Orchestrate tracks [gRPC]"
  - source: "SFU Media Router"
    destination: "Bandwidth Adaptation Monitor"
    description: "Track packet metrics [Goroutines/Channels]"
  - source: "Bandwidth Adaptation Monitor"
    destination: "SFU Media Router"
    description: "Adjust Simulcast/SVC layers [In-memory Go calls]"