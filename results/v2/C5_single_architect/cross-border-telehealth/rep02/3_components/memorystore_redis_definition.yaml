level: component
scope: "Component diagram for the Memorystore Redis container"
parentContainer:
  name: "Memorystore Redis"
elements:
  - type: "component"
    name: "Session Cache Component"
    technology: "Google Cloud Memorystore (Redis)"
    description: "Manages authentication tokens and active session states."
  - type: "component"
    name: "Distributed Rate Limiter Component"
    technology: "Google Cloud Memorystore (Redis)"
    description: "Enforces API quotas and protects backend services."
  - type: "component"
    name: "Pub/Sub Broker Component"
    technology: "Google Cloud Memorystore (Redis)"
    description: "Handles real-time signaling synchronization for video sessions."
  - type: "component"
    name: "Idempotency Store Component"
    technology: "Google Cloud Memorystore (Redis)"
    description: "Prevents duplicate e-prescription submissions during retries."
relationships:
  - source: "Core Telehealth Service"
    destination: "Session Cache Component"
    description: "Reads/writes session data via RESP3 over TLS 1.3."
  - source: "API Gateway"
    destination: "Distributed Rate Limiter Component"
    description: "Evaluates request rates via RESP3 over TLS 1.3."
  - source: "Media Relay & Signaling Service"
    destination: "Pub/Sub Broker Component"
    description: "Publishes signaling events via RESP3 Pub/Sub over TLS 1.3."
  - source: "E-Prescription Integration Service"
    destination: "Idempotency Store Component"
    description: "Checks transaction keys via RESP3 over TLS 1.3."