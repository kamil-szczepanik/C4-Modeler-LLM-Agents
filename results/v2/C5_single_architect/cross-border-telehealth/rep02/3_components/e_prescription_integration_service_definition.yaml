level: component
scope: "Component diagram for the E-Prescription Integration Service container"
parentContainer:
  name: "E-Prescription Integration Service"
elements:
  - type: "component"
    name: "Prescription Router Component"
    technology: "Node.js / Express"
    description: "Dispatches normalized prescription data to regional adapters."
  - type: "component"
    name: "EU National Gateway Adapter Component"
    technology: "Node.js / TypeScript"
    description: "Adapts prescription data for EU national gateways."
  - type: "component"
    name: "US HL7 FHIR Adapter Component"
    technology: "Node.js / TypeScript"
    description: "Adapts prescription data for US HL7 FHIR systems."
  - type: "component"
    name: "Audit & Compliance Logger Component"
    technology: "Node.js / TypeScript"
    description: "Emits compliance audit logs."
relationships:
  - source: "Prescription Router Component"
    destination: "EU National Gateway Adapter Component"
    description: "Dispatches normalized prescription data [In-process function calls]"
  - source: "Prescription Router Component"
    destination: "US HL7 FHIR Adapter Component"
    description: "Dispatches normalized prescription data [In-process function calls]"
  - source: "EU National Gateway Adapter Component"
    destination: "Audit & Compliance Logger Component"
    description: "Emits compliance audit logs"
  - source: "US HL7 FHIR Adapter Component"
    destination: "Audit & Compliance Logger Component"
    description: "Emits compliance audit logs"