# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU/US)"
    description: "End-users accessing telehealth services via web or mobile applications."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Healthcare providers conducting video consultations and issuing prescriptions."
  - type: "externalSystem"
    name: "AI Symptom Checker Service"
    description: "Isolated cognitive service providing urgency recommendations."
  - type: "externalSystem"
    name: "National e-Prescription Gateways (EU) & Pharmacy Systems (US)"
    description: "External systems for dispatching prescriptions."
  - type: "externalSystem"
    name: "Third-party Video Infrastructure"
    description: "WebRTC-based service handling real-time consultations."
  - type: "container"
    name: "Web Application & Mobile App"
    technology: "Flutter / React"
    description: "Provides user interfaces for patients and clinicians across web and mobile platforms."
  - type: "container"
    name: "API Gateway"
    technology: "Google Cloud API Gateway / Envoy"
    description: "Handles edge routing, traffic management, and protocol translation."
  - type: "container"
    name: "Core Telehealth Service"
    technology: "Go / Spring Boot"
    description: "Manages core business logic for video consultations and platform operations."
  - type: "container"
    name: "AI Symptom Checker Orchestrator"
    technology: "Python / FastAPI"
    description: "Orchestrates traceable AI symptom checks and inference requests."
  - type: "container"
    name: "E-Prescription Integration Service"
    technology: "Node.js / Java"
    description: "Handles integration with national e-prescription standards and HL7 FHIR for external systems."
  - type: "container"
    name: "Media Relay & Signaling Service"
    technology: "WebRTC / LiveKit"
    description: "Enables resilient video consultations with adaptive bitrate control for low-bandwidth connections."
  - type: "container"
    name: "Cloud SQL PostgreSQL"
    technology: "PostgreSQL"
    description: "Stores relational data across regional instances adhering to GDPR and HIPAA data residency."
  - type: "container"
    name: "Memorystore Redis"
    technology: "Redis"
    description: "Provides fast in-memory data storage for caching and session management."
relationships:
  - source: "Patients (EU/US)"
    destination: "Web Application & Mobile App"
    description: "Access telehealth services"
    technology: "HTTPS and WSS"
  - source: "Licensed Clinicians"
    destination: "Web Application & Mobile App"
    description: "Conduct consultations and manage patient care"
    technology: "HTTPS and WSS"
  - source: "Web Application & Mobile App"
    destination: "API Gateway"
    description: "Sends application traffic and real-time signaling"
    technology: "HTTPS and WSS"
  - source: "API Gateway"
    destination: "Core Telehealth Service"
    description: "Routes internal traffic"
    technology: "gRPC over GCP VPC"
  - source: "API Gateway"
    destination: "AI Symptom Checker Orchestrator"
    description: "Routes AI inference requests"
    technology: "gRPC over GCP VPC"
  - source: "API Gateway"
    destination: "E-Prescription Integration Service"
    description: "Routes prescription integration requests"
    technology: "gRPC over GCP VPC"
  - source: "API Gateway"
    destination: "Media Relay & Signaling Service"
    description: "Routes media and signaling traffic"
    technology: "gRPC over GCP VPC"
  - source: "Core Telehealth Service"
    destination: "Cloud SQL PostgreSQL"
    description: "Reads and writes relational data"
    technology: "TLS 1.3"
  - source: "Core Telehealth Service"
    destination: "Memorystore Redis"
    description: "Caches session and application data"
    technology: "TLS 1.3"
  - source: "AI Symptom Checker Orchestrator"
    destination: "Cloud SQL PostgreSQL"
    description: "Persists symptom check logs and data"
    technology: "TLS 1.3"
  - source: "E-Prescription Integration Service"
    destination: "National e-Prescription Gateways (EU) & Pharmacy Systems (US)"
    description: "Dispatches prescriptions using HL7 FHIR and national standards"
    technology: "Secure API gateways using TLS and mTLS"
  - source: "Media Relay & Signaling Service"
    destination: "Third-party Video Infrastructure"
    description: "Relays real-time video consultations supporting degraded connections"
    technology: "WebRTC"