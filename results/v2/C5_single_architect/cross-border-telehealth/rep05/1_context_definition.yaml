level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients across the EU and US with strict regional data residency and resilient low-bandwidth connectivity."
elements:
  - type: "person"
    name: "Patients (EU/US)"
    description: "End-users accessing services via mobile and web clients for video consultations and symptom checking."
  - type: "person"
    name: "Clinicians"
    description: "Healthcare providers conducting consultations and issuing e-prescriptions."
  - type: "externalSystem"
    name: "AI Symptom Checker"
    description: "Component providing traceable care urgency recommendations."
  - type: "externalSystem"
    name: "Identity & Consent Provider"
    description: "Third-party/federated service managing OAuth2/OIDC authentication and consent ledgers."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways"
    description: "External system for EU e-prescription standards integration."
  - type: "externalSystem"
    name: "US Surescripts/Pharmacy Clearinghouses"
    description: "External system for US pharmacy clearinghouse integration using HL7 FHIR."
  - type: "externalSystem"
    name: "AI Model Registry"
    description: "External registry for symptom analysis and model version logging."
relationships:
  - source: "Patients (EU/US)"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses video consultations and platform services"
    technology: "HTTPS / WebRTC (STUN/TURN)"
  - source: "Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Conducts consultations and issues e-prescriptions"
    technology: "HTTPS / WebRTC (STUN/TURN)"
  - source: "Cross-Border Telehealth Platform"
    destination: "EU National E-Prescription Gateways"
    description: "Transmits e-prescriptions using national standards"
    technology: "REST"
  - source: "Cross-Border Telehealth Platform"
    destination: "US Surescripts/Pharmacy Clearinghouses"
    description: "Transmits e-prescriptions and health records"
    technology: "REST / HL7 FHIR"
  - source: "Cross-Border Telehealth Platform"
    destination: "AI Model Registry"
    description: "Performs symptom analysis and model version logging"
    technology: "gRPC / REST"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity & Consent Provider"
    description: "Authenticates users and manages consent"
    technology: "OAuth2 / OIDC over HTTPS"