level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients (EU and US)"
    description: "End-users accessing services via mobile and web clients for video consultations and symptom checking."
  - type: "person"
    name: "Licensed Clinicians"
    description: "Healthcare providers conducting consultations and issuing e-prescriptions."
  - type: "externalSystem"
    name: "Identity & Consent Provider"
    description: "Third-party/federated service managing OAuth2/OIDC authentication and consent ledgers."
  - type: "externalSystem"
    name: "EU National E-Prescription Gateways"
    description: "External system for EU e-prescription standards integration."
  - type: "externalSystem"
    name: "US Surescripts"
    description: "External system for US pharmacy clearinghouse integration using HL7 FHIR."
  - type: "externalSystem"
    name: "AI Model Registry"
    description: "External registry for symptom analysis and model version logging."
  - type: "container"
    name: "API Gateway & Routing Layer"
    technology: "Google Cloud Load Balancing, Apigee"
    description: "Routes traffic regionally to GKE containers in europe-west3 and us-central1."
  - type: "container"
    name: "Core Telehealth Service"
    technology: "Go on GKE"
    description: "Handles primary telehealth business logic, reading and writing to regional datastores."
  - type: "container"
    name: "Video Media Server"
    technology: "WebRTC SFU on GKE"
    description: "Streams WebRTC video between participants, supporting adaptive bitrate."
  - type: "container"
    name: "AI Inference Wrapper"
    technology: "Python on Vertex AI"
    description: "Powers the AI symptom checker and logs inputs and model versions."
  - type: "container"
    name: "Integration Service"
    technology: "Go / Camel-K on GKE"
    description: "Communicates with EU National E-Prescription Gateways and US Surescripts using HL7 FHIR and national standards."
  - type: "container"
    name: "Audit & Traceability Ledger"
    technology: "Cloud Pub/Sub, BigQuery"
    description: "Provides immutable logging for EU MDR traceability and audit data."
  - type: "container"
    name: "Datastores"
    technology: "Cloud SQL PostgreSQL"
    description: "Secures relational data with regional partitioning per region."
relationships:
  - source: "Patients (EU and US)"
    destination: "API Gateway & Routing Layer"
    description: "Interacts via HTTPS and WebRTC"
    technology: "HTTPS / WebRTC"
  - source: "Licensed Clinicians"
    destination: "API Gateway & Routing Layer"
    description: "Interacts via HTTPS and WebRTC"
    technology: "HTTPS / WebRTC"
  - source: "API Gateway & Routing Layer"
    destination: "Core Telehealth Service"
    description: "Routes regional traffic"
    technology: "gRPC / HTTP"
  - source: "API Gateway & Routing Layer"
    destination: "Video Media Server"
    description: "Routes WebRTC video traffic"
    technology: "WebRTC"
  - source: "API Gateway & Routing Layer"
    destination: "AI Inference Wrapper"
    description: "Routes AI symptom checker requests"
    technology: "gRPC / HTTP"
  - source: "Core Telehealth Service"
    destination: "Datastores"
    description: "Reads and writes regional data"
    technology: "PostgreSQL Protocol"
  - source: "Video Media Server"
    destination: "Patients (EU and US)"
    description: "Streams video consultations"
    technology: "WebRTC"
  - source: "Video Media Server"
    destination: "Licensed Clinicians"
    description: "Streams video consultations"
    technology: "WebRTC"
  - source: "AI Inference Wrapper"
    destination: "Audit & Traceability Ledger"
    description: "Logs inputs and model versions"
    technology: "Cloud Pub/Sub"
  - source: "Integration Service"
    destination: "EU National E-Prescription Gateways"
    description: "Communicates e-prescriptions using national standards"
    technology: "HL7 FHIR / REST"
  - source: "Integration Service"
    destination: "US Surescripts"
    description: "Communicates e-prescriptions using HL7 FHIR"
    technology: "HL7 FHIR / REST"
  - source: "API Gateway & Routing Layer"
    destination: "Identity & Consent Provider"
    description: "Authenticates users and verifies consent"
    technology: "OAuth2 / OIDC over HTTPS"
  - source: "AI Inference Wrapper"
    destination: "AI Model Registry"
    description: "Fetches models and logs version details"
    technology: "gRPC / REST"
  - source: "Audit & Traceability Ledger"
    destination: "Datastores"
    description: "Persists audit and traceability data"
    technology: "SQL / BigQuery API"