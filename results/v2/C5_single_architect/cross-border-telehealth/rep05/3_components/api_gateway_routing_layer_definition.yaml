level: component
scope: "Component diagram for the API Gateway & Routing Layer container"
parentContainer:
  name: "API Gateway & Routing Layer"
elements:
  - type: "component"
    name: "Geo-Routing Policy Engine"
    technology: "Google Cloud Load Balancing & Apigee"
    description: "Handles regional geo-routing, TLS termination, and directs EU and US traffic to appropriate regional clusters."
  - type: "component"
    name: "WebRTC Signaling Router"
    technology: "Envoy"
    description: "Routes SDP offers and manages real-time session negotiation for video consultations."
  - type: "component"
    name: "JWT Validation & Consent Enforcement Filter"
    technology: "Apigee Policy Filter"
    description: "Validates tokens and verifies patient/clinician consent before requests reach core services."
relationships:
  - source: "Geo-Routing Policy Engine"
    destination: "WebRTC Signaling Router"
    description: "Routes real-time signaling [TCP / WebRTC]"
  - source: "JWT Validation & Consent Enforcement Filter"
    destination: "Geo-Routing Policy Engine"
    description: "Enforces policies on incoming requests [HTTPS]"