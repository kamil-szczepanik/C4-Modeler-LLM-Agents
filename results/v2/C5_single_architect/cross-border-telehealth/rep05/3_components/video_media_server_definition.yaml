level: component
scope: "Component diagram for the Video Media Server container"
parentContainer:
  name: "Video Media Server"
elements:
  - type: "component"
    name: "SFU Core Router"
    technology: "Pion WebRTC / Go"
    description: "Routes media streams between participants during video consultations."
  - type: "component"
    name: "ABR Controller"
    technology: "Go"
    description: "Manages adaptive bitrate streaming for unstable network connections."
  - type: "component"
    name: "TURN/STUN Relay Module"
    technology: "Coturn"
    description: "Handles NAT traversal and relaying of media streams."
  - type: "component"
    name: "Media Recording & Compliance Logger"
    technology: "GStreamer / Go"
    description: "Records session media and forwards RTP streams for compliance."
relationships:
  - source: "SFU Core Router"
    destination: "APIs & Signaling Service"
    description: "Session setup [gRPC / Protobuf]"
  - source: "SFU Core Router"
    destination: "Media Recording & Compliance Logger"
    description: "Forwards RTP streams [Internal gRPC/RTP]"
  - source: "Media Recording & Compliance Logger"
    destination: "Datastores (Cloud SQL PostgreSQL / Cloud Storage)"
    description: "Persists encrypted media chunks [HTTPS / GCP IAM]"