level: component
scope: "Component diagram for the Datastores container"
parentContainer:
  name: "Datastores"
elements:
  - type: "component"
    name: "Primary Operational DB"
    technology: "Cloud SQL PostgreSQL per region"
    description: "Manages regional operational data, user profiles, and encrypted metadata."
  - type: "component"
    name: "AI Audit Store"
    technology: "BigQuery per region"
    description: "Maintains tamper-evident, append-only logs for AI traceability and audits."
  - type: "component"
    name: "Consent & Encryption Key Store"
    technology: "Cloud KMS / Secret Manager per region"
    description: "Handles regional envelope encryption and consent mappings."
relationships:
  - source: "Primary Operational DB"
    destination: "Consent & Encryption Key Store"
    description: "Validates patient revocation flags [Internal gRPC]"