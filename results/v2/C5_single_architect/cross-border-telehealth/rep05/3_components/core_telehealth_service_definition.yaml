level: component
scope: "Component diagram for the Core Telehealth Service container"
parentContainer:
  name: "Core Telehealth Service"
elements:
  - type: "component"
    name: "Consultation Session Manager"
    technology: "Go"
    description: "Coordinates media stream parameters and manages video consultation sessions."
  - type: "component"
    name: "Prescription Coordinator"
    technology: "Go"
    description: "Routes prescription payloads to the integration service."
  - type: "component"
    name: "Consent Enforcement Engine"
    technology: "Go"
    description: "Executes localized queries and enforces data residency and consent policies."
  - type: "component"
    name: "Symptom Checker Orchestrator"
    technology: "Go"
    description: "Requests triage urgency from the AI inference wrapper."
  - type: "component"
    name: "Telemetry & Audit Interceptor"
    technology: "Go"
    description: "Publishes immutable audit logs to the audit and traceability ledger."
relationships:
  - source: "Consultation Session Manager"
    destination: "Video Media Server"
    description: "Coordinates media stream parameters [gRPC]"
  - source: "Prescription Coordinator"
    destination: "Integration Service"
    description: "Routes prescription payloads [gRPC / REST]"
  - source: "Consent Enforcement Engine"
    destination: "Datastores"
    description: "Executes localized queries [SQL]"
  - source: "Symptom Checker Orchestrator"
    destination: "AI Inference Wrapper"
    description: "Requests triage urgency [gRPC]"
  - source: "Telemetry & Audit Interceptor"
    destination: "Audit & Traceability Ledger"
    description: "Publishes immutable audit logs [Cloud Pub/Sub]"