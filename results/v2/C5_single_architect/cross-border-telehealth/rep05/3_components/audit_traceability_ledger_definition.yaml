level: component
scope: "Component diagram for the Audit & Traceability Ledger container"
parentContainer:
  name: "Audit & Traceability Ledger"
elements:
  - type: "component"
    name: "Ingest Router"
    technology: "Go / gRPC"
    description: "Publishes and routes incoming audit events via Cloud Pub/Sub."
  - type: "component"
    name: "Compliance & Residency Enforcer"
    technology: "Go"
    description: "Enforces regional data residency and compliance, writing region-locked records to BigQuery."
  - type: "component"
    name: "Ledger Storage Adapter"
    technology: "BigQuery Storage API"
    description: "Interfaces with BigQuery with WORM policies for immutable audit ledgers."
  - type: "component"
    name: "Audit Query API"
    technology: "gRPC over mTLS"
    description: "Provides an interface for authorized auditors to query compliance logs securely."
relationships:
  - source: "AI Inference Wrapper"
    destination: "Ingest Router"
    description: "Publishes audit events via gRPC over Cloud Pub/Sub"
  - source: "Compliance & Residency Enforcer"
    destination: "BigQuery"
    description: "Writes region-locked audit records via BigQuery Storage API (HTTPS/gRPC)"
  - source: "Authorized Auditors"
    destination: "Audit Query API"
    description: "Queries compliance logs via gRPC over mTLS (HTTPS)"