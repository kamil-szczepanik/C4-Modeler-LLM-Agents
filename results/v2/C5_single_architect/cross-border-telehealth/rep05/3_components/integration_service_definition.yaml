level: component
scope: "Component diagram for the Integration Service container"
parentContainer:
  name: "Integration Service"
elements:
  - type: "component"
    name: "E-Prescription Router Component"
    technology: "Go"
    description: "Orchestrates and routes prescription payloads."
  - type: "component"
    name: "Data Residency Guard Component"
    technology: "Go"
    description: "Validates regional routing rules and prevents cross-region data leaks."
  - type: "component"
    name: "EU Adapter Component"
    technology: "Go"
    description: "Translates models to National e-Prescription Standards."
  - type: "component"
    name: "US Adapter Component"
    technology: "Go"
    description: "Formats messages into HL7 FHIR."
  - type: "component"
    name: "EU National E-Prescription Gateways"
    technology: "REST / HTTPS"
    description: "External EU National E-Prescription Gateways."
  - type: "component"
    name: "US Surescripts / Pharmacy Clearinghouses"
    technology: "HL7 FHIR / HTTPS"
    description: "External US Surescripts and Pharmacy Clearinghouses."
  - type: "component"
    name: "Audit & Traceability Ledger"
    technology: "Cloud Pub/Sub and BigQuery"
    description: "Emits and stores routing audit events."
relationships:
  - source: "E-Prescription Router Component"
    destination: "Data Residency Guard Component"
    description: "Validates regional routing rules [In-memory function call]"
  - source: "Data Residency Guard Component"
    destination: "EU Adapter Component"
    description: "Dispatches EU-bound payloads [In-memory]"
  - source: "Data Residency Guard Component"
    destination: "US Adapter Component"
    description: "Dispatches US-bound payloads [In-memory]"
  - source: "Data Residency Guard Component"
    destination: "Audit & Traceability Ledger"
    description: "Emits routing audit events [Cloud Pub/Sub]"
  - source: "EU Adapter Component"
    destination: "EU National E-Prescription Gateways"
    description: "Sends prescriptions [HTTPS / REST]"
  - source: "US Adapter Component"
    destination: "US Surescripts / Pharmacy Clearinghouses"
    description: "Submits e-prescriptions [HL7 FHIR / HTTPS]"