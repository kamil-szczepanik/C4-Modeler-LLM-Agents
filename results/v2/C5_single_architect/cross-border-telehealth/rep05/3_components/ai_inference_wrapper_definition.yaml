level: component
scope: "Component diagram for the AI Inference Wrapper container"
parentContainer:
  name: "AI Inference Wrapper"
elements:
  - type: "component"
    name: "Inference Controller"
    technology: "Python, FastAPI"
    description: "Manages incoming inference requests, routing them through sanitization and execution, and triggering audit logs."
  - type: "component"
    name: "Regional Data Sanitizer"
    technology: "Python, Pandas"
    description: "Enforces regional data isolation and sanitizes input data to comply with GDPR and HIPAA mandates."
  - type: "component"
    name: "Model Execution Engine"
    technology: "Python, PyTorch, Vertex AI SDK"
    description: "Executes the AI symptom-checker model and interacts with the external AI Model Registry."
  - type: "component"
    name: "Audit & Logging Interceptor"
    technology: "Python middleware"
    description: "Captures audit and traceability logs asynchronously for regulatory compliance and AI output tracking."
relationships:
  - source: "Inference Controller"
    destination: "Regional Data Sanitizer"
    description: "Passes input data for regional sanitization [In-memory Python call]"
  - source: "Regional Data Sanitizer"
    destination: "Model Execution Engine"
    description: "Passes sanitized data for model execution [In-memory Python call]"
  - source: "Inference Controller"
    destination: "Audit & Logging Interceptor"
    description: "Dispatches audit logs [Async queue]"