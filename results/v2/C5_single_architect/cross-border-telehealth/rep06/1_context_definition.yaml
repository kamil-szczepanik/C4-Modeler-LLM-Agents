level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US while ensuring strict regional data residency, regulatory compliance, and low-bandwidth availability."
elements:
  - type: "person"
    name: "Patients & Clinicians"
    description: "External users interacting with the platform for video consultations, e-prescriptions, and symptom checking."
  - type: "externalSystem"
    name: "National Pharmacy Networks (EU) & US Pharmacy Systems"
    description: "External systems for processing e-prescriptions."
  - type: "externalSystem"
    name: "AI Model Provider / LLM API"
    description: "External service for powering the AI symptom checker."
  - type: "externalSystem"
    name: "Third-Party Identity Providers & Payment Gateways"
    description: "External systems providing authentication and cross-border billing capabilities."
relationships:
  - source: "Patients & Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Interacts with the platform for video consultations and platform features"
    technology: "HTTPS and WebSockets with adaptive bitrate streaming"
  - source: "Cross-Border Telehealth Platform"
    destination: "AI Model Provider / LLM API"
    description: "Sends requests to the AI model for symptom checking with immutable logging"
    technology: "Secure HTTPS REST APIs"
  - source: "Cross-Border Telehealth Platform"
    destination: "National Pharmacy Networks (EU) & US Pharmacy Systems"
    description: "Submits e-prescriptions securely segregated by region"
    technology: "TLS-encrypted REST and HL7 FHIR APIs"
  - source: "Cross-Border Telehealth Platform"
    destination: "Third-Party Identity Providers & Payment Gateways"
    description: "Processes cross-border billing and authentication"
    technology: "HTTPS webhooks"