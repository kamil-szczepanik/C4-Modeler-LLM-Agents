level: component
scope: "Component diagram for the AI Orchestrator container"
parentContainer:
  name: "AI Orchestrator"
elements:
  - type: "component"
    name: "Prompt Router"
    technology: "Python, FastAPI"
    description: "Passes sanitized, region-validated payloads to the Model Gateway."
  - type: "component"
    name: "Model Gateway"
    technology: "Python, FastAPI"
    description: "Executes external inference requests and emits immutable audit events."
  - type: "component"
    name: "Traceability Logger"
    technology: "Python, FastAPI"
    description: "Emits and persists immutable audit events to region-locked storage."
relationships:
  - source: "Prompt Router"
    destination: "Model Gateway"
    description: "Passes sanitized, region-validated payloads [In-process async function calls]."
  - source: "Model Gateway"
    destination: "Traceability Logger"
    description: "Emits immutable audit events [In-process Python Queue]."