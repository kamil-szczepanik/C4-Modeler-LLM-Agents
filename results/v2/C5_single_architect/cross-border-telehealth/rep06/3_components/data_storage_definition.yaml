level: component
scope: "Component diagram for the Data Storage container"
parentContainer:
  name: "Data Storage"
elements:
  - type: "component"
    name: "Regional Relational DB"
    technology: "Cloud SQL for PostgreSQL"
    description: "Stores user profiles, appointments, and granular consent records with CMEK encryption-at-rest for HIPAA/GDPR compliance."
  - type: "component"
    name: "Regional Object Store"
    technology: "Google Cloud Storage"
    description: "Stores e-prescription documents and encrypted consultation media in region-partitioned buckets."
  - type: "component"
    name: "Audit & Traceability Store"
    technology: "Cloud Bigtable"
    description: "Maintains append-only immutable logs for AI symptom-checker recommendations, ensuring medical device traceability (EU MDR)."
relationships:
  - source: "Core Telehealth Service"
    destination: "Regional Relational DB"
    description: "Read/Write patient data and consent via PostgreSQL wire protocol (TCP/5432)."
  - source: "AI Orchestrator"
    destination: "Audit & Traceability Store"
    description: "Append-only writes for AI traceability logs via Bigtable API (gRPC)."
  - source: "E-Prescription Integrator"
    destination: "Regional Object Store"
    description: "Secure storage and retrieval of e-prescription artifacts via HTTPS (REST API/GCP SDK)."