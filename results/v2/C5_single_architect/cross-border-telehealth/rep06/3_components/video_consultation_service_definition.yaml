level: component
scope: "Component diagram for the Video Consultation Service container"
parentContainer:
  name: "Video Consultation Service"
elements:
  - type: "component"
    name: "Signaling Controller"
    technology: "Golang, WebSockets"
    description: "Coordinates peer sessions and joins consultation rooms."
  - type: "component"
    name: "SFU Media Router"
    technology: "Golang / LiveKit SDK"
    description: "Handles scalable media routing for video consultations."
  - type: "component"
    name: "Bandwidth Adaptation Engine"
    technology: "Golang"
    description: "Dynamically adjusts bitrates for low-bandwidth resilience."
  - type: "component"
    name: "NAT Traversal Manager"
    technology: "Golang, Pion TURN"
    description: "Allocates UDP relay ports for network traversal."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "Golang"
    description: "Persists localized session telemetry and compliance logs."
relationships:
  - source: "Signaling Controller"
    destination: "SFU Media Router"
    description: "Coordinates peer sessions [In-memory Go channels]"
  - source: "SFU Media Router"
    destination: "NAT Traversal Manager"
    description: "Allocates UDP relay ports [ICE/TURN protocol]"
  - source: "Bandwidth Adaptation Engine"
    destination: "SFU Media Router"
    description: "Dynamically adjusts bitrates [In-memory Go function calls]"