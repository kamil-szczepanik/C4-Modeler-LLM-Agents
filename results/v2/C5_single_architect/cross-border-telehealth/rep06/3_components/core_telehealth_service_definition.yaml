level: component
scope: "Component diagram for the Core Telehealth Service container"
parentContainer:
  name: "Core Telehealth Service"
elements:
  - type: "component"
    name: "Profile & Consent Manager"
    technology: "Node.js / TypeScript"
    description: "Manages user profiles and consents with regional data isolation and row-level security."
  - type: "component"
    name: "Appointment & Scheduling Engine"
    technology: "Node.js / TypeScript"
    description: "Handles booking, scheduling, and management of telehealth appointments."
  - type: "component"
    name: "Audit Logger"
    technology: "Node.js / TypeScript"
    description: "Collects and publishes asynchronous event logs for system traceability."
  - type: "component"
    name: "Sync & State Manager"
    technology: "Node.js / TypeScript"
    description: "Ensures resilience and state synchronization for unstable network connections."
relationships:
  - source: "Profile & Consent Manager"
    destination: "Regional Cloud SQL (PostgreSQL)"
    description: "Stores user profiles and consent data using TypeORM via SSL with row-level security"
  - source: "All Internal Components"
    destination: "Audit Logger"
    description: "Publishes asynchronous events via GCP Pub/Sub"
  - source: "Sync & State Manager"
    destination: "Appointment & Scheduling Engine"
    description: "Communicates via internal asynchronous message queue"