level: component
scope: "Component diagram for the E-Prescription Integrator container"
parentContainer:
  name: "E-Prescription Integrator"
elements:
  - type: "component"
    name: "Routing & Consent Validator"
    technology: "Spring Cloud Gateway"
    description: "Validating patient consent and routing payloads by region (EU vs. US)."
  - type: "component"
    name: "US FHIR Translator"
    technology: "HAPI FHIR"
    description: "Mapping domain models to HL7 FHIR for US pharmacies."
  - type: "component"
    name: "EU National Adapter Engine"
    technology: "Apache Camel / Spring Integration"
    description: "Housing pluggable adapters for national EU e-prescription standards."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "Java / Spring Boot"
    description: "Records transaction hashes to ensure accountability."
  - type: "component"
    name: "Regional Outbox Dispatcher"
    technology: "Spring Batch / Debezium"
    description: "Ensuring transactional outbox execution for regional data locality."
  - type: "component"
    name: "API Gateway/BFF"
    technology: "Gateway"
    description: "Inbound dispatching system."
  - type: "component"
    name: "National Pharmacy Networks (EU)"
    technology: "REST/SOAP over mTLS"
    description: "External EU national pharmacy networks."
  - type: "component"
    name: "US Pharmacy Systems"
    technology: "HL7 FHIR over HTTPS"
    description: "External US pharmacy systems."
  - type: "component"
    name: "Data Storage (Cloud SQL)"
    technology: "Cloud SQL (PostgreSQL), JDBC/HikariCP"
    description: "Regional databases deployed in europe-west3 and us-central1 ensuring strict data segregation."
relationships:
  - source: "API Gateway/BFF"
    destination: "Routing & Consent Validator"
    description: "Inbound dispatch via gRPC."
  - type: "EU National Adapter Engine"
    destination: "National Pharmacy Networks (EU)"
    description: "Transmits prescriptions via REST/SOAP over mTLS."
  - source: "US FHIR Translator"
    destination: "US Pharmacy Systems"
    description: "Transmits prescriptions via HL7 FHIR over HTTPS."
  - source: "US FHIR Translator"
    destination: "Data Storage (Cloud SQL)"
    description: "Persists audit states and outbox events via JDBC/HikariCP using regional endpoints (europe-west3, us-central1)."
  - source: "EU National Adapter Engine"
    destination: "Data Storage (Cloud SQL)"
    description: "Persists audit states and outbox events via JDBC/HikariCP using regional endpoints (europe-west3, us-central1)."