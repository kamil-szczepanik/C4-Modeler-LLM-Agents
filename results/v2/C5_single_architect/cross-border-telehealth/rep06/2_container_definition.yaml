level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients & Clinicians"
    description: "External users interacting with the platform for video consultations, e-prescriptions, and symptom checking."
  - type: "externalSystem"
    name: "National Pharmacy Networks (EU) & US Pharmacy Systems"
    description: "External systems for processing e-prescriptions."
  - type: "externalSystem"
    name: "AI Model Provider / LLM API"
    description: "External service for powering the AI symptom checker."
  - type: "externalSystem"
    name: "Third-Party Identity Providers & Payment Gateways"
    description: "External systems providing authentication and cross-border billing capabilities."
  - type: "container"
    name: "Global Load Balancer with Cloud Armor"
    technology: "Google Cloud Global Load Balancer & Cloud Armor"
    description: "Routes traffic, enforces regional pinning, and provides DDoS protection."
  - type: "container"
    name: "API Gateway / BFF"
    technology: "Go, gRPC/REST"
    description: "Handles regional boundary checks, client routing, and exposes APIs to clients."
  - type: "container"
    name: "Core Telehealth Service"
    technology: "Node.js / TypeScript"
    description: "Manages user profiles, appointments, and consent (R-04)."
  - type: "container"
    name: "Video Consultation Service"
    technology: "Golang / WebRTC SFU (LiveKit)"
    description: "Manages real-time video with low-bandwidth degradation."
  - type: "container"
    name: "AI Orchestrator"
    technology: "Python, FastAPI"
    description: "Integrates with external LLMs and handles traceability for symptom checking."
  - type: "container"
    name: "E-Prescription Integrator"
    technology: "Java / Spring Boot"
    description: "Translates data for national EU standards and US HL7 FHIR."
  - type: "container"
    name: "Data Storage"
    technology: "Cloud SQL (PostgreSQL), Cloud Storage, Cloud Bigtable"
    description: "Provides region-locked primary databases, object storage, and immutable audit logs."
relationships:
  - source: "Patients & Clinicians"
    destination: "Global Load Balancer with Cloud Armor"
    description: "Accesses platform features and video consultations"
    technology: "HTTPS and WebSockets with geo-routing"
  - source: "Global Load Balancer with Cloud Armor"
    destination: "API Gateway / BFF"
    description: "Routes regional traffic"
    technology: "HTTPS"
  - source: "API Gateway / BFF"
    destination: "Core Telehealth Service"
    description: "Manages user profiles and appointments"
    technology: "gRPC over mTLS via Istio"
  - source: "API Gateway / BFF"
    destination: "Video Consultation Service"
    description: "Connects clients for real-time video"
    technology: "gRPC over mTLS via Istio"
  - source: "API Gateway / BFF"
    destination: "AI Orchestrator"
    description: "Sends requests for AI symptom analysis"
    technology: "gRPC over mTLS via Istio"
  - source: "API Gateway / BFF"
    destination: "E-Prescription Integrator"
    description: "Requests e-prescription processing"
    technology: "gRPC over mTLS via Istio"
  - source: "Core Telehealth Service"
    destination: "Data Storage"
    description: "Reads and writes user data and consent"
    technology: "PostgreSQL / Cloud SQL"
  - source: "AI Orchestrator"
    destination: "AI Model Provider / LLM API"
    description: "Queries external LLM for symptom analysis"
    technology: "HTTPS/REST"
  - source: "AI Orchestrator"
    destination: "Data Storage"
    description: "Writes AI traceability logs"
    technology: "Cloud Bigtable"
  - source: "E-Prescription Integrator"
    destination: "National Pharmacy Networks (EU) & US Pharmacy Systems"
    description: "Submits e-prescriptions securely segregated by region"
    technology: "HL7 FHIR (US) and national standards (EU)"
  - source: "Cross-Border Telehealth Platform"
    destination: "Third-Party Identity Providers & Payment Gateways"
    description: "Processes authentication and cross-border billing"
    technology: "HTTPS webhooks"