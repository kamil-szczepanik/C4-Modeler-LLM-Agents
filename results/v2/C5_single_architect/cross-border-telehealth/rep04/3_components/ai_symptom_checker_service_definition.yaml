level: component
scope: "Component diagram for the AI Symptom Checker Service container"
parentContainer:
  name: "AI Symptom Checker Service"
elements:
  - type: "component"
    name: "API Router & Validator"
    technology: "Python / FastAPI"
    description: "High-performance framework for rapid API routing and payload validation using Pydantic for strict data schema validation ensuring compliance with healthcare data formats."
  - type: "component"
    name: "Region-Aware Orchestrator"
    technology: "Python"
    description: "Orchestrates regional data routing, enforces strict payload minimization, and manages the flow between validation, LLM integration, and auditing."
  - type: "component"
    name: "Audit & Traceability Logger"
    technology: "Python / SQLAlchemy / Structured Logging"
    description: "Captures immutable audit trails for MDR and HIPAA compliance."
  - type: "component"
    name: "LLM Integration Client"
    technology: "Python / HTTPX"
    description: "Asynchronous HTTP client providing robust LLM API communication with circuit breakers."
  - type: "component"
    name: "AI Model Provider / LLM API"
    technology: "External System"
    description: "External system providing LLM-based symptom analysis."
  - type: "component"
    name: "Cloud SQL PostgreSQL"
    technology: "Database"
    description: "Regional relational database for secure, structured writes."
relationships:
  - source: "API Router & Validator"
    destination: "Region-Aware Orchestrator"
    description: "In-memory function call with Pydantic models"
  - source: "Region-Aware Orchestrator"
    destination: "LLM Integration Client"
    description: "Asynchronous method call"
  - source: "LLM Integration Client"
    destination: "AI Model Provider / LLM API"
    description: "HTTPS / REST with TLS 1.3"
  - source: "Region-Aware Orchestrator"
    destination: "Audit & Traceability Logger"
    description: "Local asynchronous event emission"
  - source: "Audit & Traceability Logger"
    destination: "Cloud SQL PostgreSQL"
    description: "SQLAlchemy / SQL over secure TCP"