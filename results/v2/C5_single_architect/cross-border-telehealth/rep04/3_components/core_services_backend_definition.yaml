level: component
scope: "Component diagram for the Core Services Backend container"
parentContainer:
  name: "Core Services Backend"
elements:
  - type: "component"
    name: "Patient & Clinician Management Component"
    technology: "Go, Gin/Fiber"
    description: "Manages patient and clinician profiles and operations."
  - type: "component"
    name: "Consultation Coordinator Component"
    technology: "Go"
    description: "Orchestrates consultations and persists booking states."
  - type: "component"
    name: "Prescription Management Component"
    technology: "Go"
    description: "Manages prescriptions and dispatches payloads."
  - type: "component"
    name: "Audit & Traceability Component"
    technology: "Go"
    description: "Writes tamper-evident audit trails for medical traceability."
  - type: "component"
    name: "Region-Aware Data Router Component"
    technology: "Go"
    description: "Delegates and executes region-isolated transactional queries to ensure data residency compliance."
  - type: "component"
    name: "Cloud SQL PostgreSQL"
    technology: "GCP Database, PostgreSQL"
    description: "Relational database deployed regionally for data residency compliance."
  - type: "component"
    name: "Interoperability Adapter"
    technology: "Node.js/TypeScript"
    description: "External adapter for dispatching prescription payloads via gRPC."
relationships:
  - source: "Consultation Coordinator Component"
    destination: "Cloud SQL PostgreSQL"
    description: "Persists booking states [TCP/SQL]"
  - source: "Prescription Management Component"
    destination: "Interoperability Adapter"
    description: "Dispatches prescription payloads [gRPC]"
  - source: "Audit & Traceability Component"
    destination: "Cloud SQL PostgreSQL"
    description: "Writes tamper-evident audit trails [TCP/SQL]"
  - source: "Patient & Clinician Management Component"
    destination: "Region-Aware Data Router Component"
    description: "Delegates persistence operations [In-process Go interface]"
  - source: "Consultation Coordinator Component"
    destination: "Region-Aware Data Router Component"
    description: "Delegates persistence operations [In-process Go interface]"
  - source: "Prescription Management Component"
    destination: "Region-Aware Data Router Component"
    description: "Delegates persistence operations [In-process Go interface]"
  - source: "Region-Aware Data Router Component"
    destination: "Cloud SQL PostgreSQL"
    description: "Executes region-isolated transactional queries [TCP/SQL]"