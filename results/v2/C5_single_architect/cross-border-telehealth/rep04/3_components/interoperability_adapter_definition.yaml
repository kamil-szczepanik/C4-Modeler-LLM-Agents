level: component
scope: "Component diagram for the Interoperability Adapter container"
parentContainer:
  name: "Interoperability Adapter"
elements:
  - type: "component"
    name: "Regional Routing Enforcer"
    technology: "TypeScript"
    description: "Routes payloads based on jurisdiction."
  - type: "component"
    name: "FHIR Translation Engine"
    technology: "TypeScript/HAPI FHIR JS"
    description: "Translates payloads into validated US FHIR resources."
  - type: "component"
    name: "EU National Standard Transformer"
    technology: "TypeScript"
    description: "Transforms payloads into localized EU standard formats."
  - type: "component"
    name: "Outbound Integration Dispatcher"
    technology: "TypeScript/Axios"
    description: "Dispatches payloads securely to external health systems and registries."
relationships:
  - source: "Regional Routing Enforcer"
    destination: "FHIR Translation Engine"
    description: "Routes payloads based on jurisdiction [In-memory]"
  - source: "Regional Routing Enforcer"
    destination: "EU National Standard Transformer"
    description: "Routes payloads based on jurisdiction [In-memory]"
  - source: "FHIR Translation Engine"
    destination: "Outbound Integration Dispatcher"
    description: "Passes validated US FHIR resources [In-memory]"
  - source: "EU National Standard Transformer"
    destination: "Outbound Integration Dispatcher"
    description: "Passes localized EU payloads [In-memory]"