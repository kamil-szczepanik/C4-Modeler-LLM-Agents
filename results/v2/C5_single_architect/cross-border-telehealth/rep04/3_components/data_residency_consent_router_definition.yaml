level: component
scope: "Component diagram for the Data Residency & Consent Router container"
parentContainer:
  name: "Data Residency & Consent Router"
elements:
  - type: "component"
    name: "Geo-Routing Policy Engine"
    technology: "Go"
    description: "Evaluates inbound client requests against regional data residency policies."
  - type: "component"
    name: "Consent Interceptor Middleware"
    technology: "Go"
    description: "Intercepts requests to validate patient consent and queries regional consent state."
  - type: "component"
    name: "Audit Logger"
    technology: "Go"
    description: "Logs compliance events and requests for auditing purposes."
  - type: "component"
    name: "Regional Proxy Dispatcher"
    technology: "Go"
    description: "Triggers inter-region dispatch upon verified consent to forward requests to region-pinned instances."
relationships:
  - source: "Geo-Routing Policy Engine"
    destination: "Consent Interceptor Middleware"
    description: "Passes validated regional context [In-memory Go struct]."
  - source: "Consent Interceptor Middleware"
    destination: "Regional Proxy Dispatcher"
    description: "Triggers inter-region dispatch upon verified consent [In-memory]."
  - source: "Consent Interceptor Middleware"
    destination: "Cloud SQL PostgreSQL"
    description: "Queries regional consent state [pgx / gRPC]."