level: component
scope: "Component diagram for the Video Streaming Server container"
parentContainer:
  name: "Video Streaming Server"
elements:
  - type: "component"
    name: "Signaling Component"
    technology: "LiveKit WebRTC SFU / Go"
    description: "Handles signaling and configures media tracks for video consultations."
  - type: "component"
    name: "SFU Media Router"
    technology: "LiveKit WebRTC SFU"
    description: "Routes and transmits adaptive media streams to clients."
  - type: "component"
    name: "Recording & Audit Sidecar"
    technology: "Go"
    description: "Manages recording and auditing for video sessions."
  - type: "component"
    name: "Media Policy & Token Enforcer"
    technology: "Go"
    description: "Validates regional access tokens and verifies patient consent state."
relationships:
  - source: "Signaling Component"
    destination: "Media Policy & Token Enforcer"
    description: "Validates regional access tokens [In-memory function call]"
  - source: "Media Policy & Token Enforcer"
    destination: "Data Residency & Consent Router"
    description: "Verifies patient consent state [gRPC over TLS]"
  - source: "Signaling Component"
    destination: "SFU Media Router"
    description: "Configures media tracks [Internal gRPC]"
  - source: "SFU Media Router"
    destination: "Web/Mobile Client SPA/PWA"
    description: "Transmits adaptive media streams [WebRTC over UDP/ICE/DTLS]"