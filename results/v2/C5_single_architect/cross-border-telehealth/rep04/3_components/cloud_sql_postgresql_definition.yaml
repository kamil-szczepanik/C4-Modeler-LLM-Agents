level: component
scope: "Component diagram for the Cloud SQL PostgreSQL container"
parentContainer:
  name: "Cloud SQL PostgreSQL"
elements:
  - type: "component"
    name: "Regional Database Instances"
    technology: "PostgreSQL 15"
    description: "Regional database instances (`europe-west3` and `us-central1`) for data residency compliance."
  - type: "component"
    name: "Database Schema & Partitioning Layer"
    technology: "PostgreSQL Row-Level Security"
    description: "Database schema and partitioning layer utilizing PostgreSQL Row-Level Security for tenant isolation."
  - type: "component"
    name: "Audit Logging Extension"
    technology: "pgAudit"
    description: "Database extension for comprehensive logging to satisfy AI traceability and accountability (R-07)."
  - type: "component"
    name: "Connection Pooling & Encryption Component"
    technology: "Cloud SQL Auth Proxy & GCP Cloud KMS"
    description: "Secure connection management and Customer-Managed Encryption Keys (CMEK) for data privacy."
relationships:
  - source: "Connection Pooling & Encryption Component"
    destination: "Regional Database Instances"
    description: "Forwards authenticated queries to regional databases"