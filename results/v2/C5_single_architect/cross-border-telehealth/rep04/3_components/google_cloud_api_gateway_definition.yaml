level: component
scope: "Component diagram for the Google Cloud API Gateway container"
parentContainer:
  name: "Google Cloud API Gateway"
elements:
  - type: "component"
    name: "API Router & Regional Dispatcher"
    technology: "Envoy / Go"
    description: "Routes incoming requests and dispatches payloads to regional destinations."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Envoy Filter"
    description: "Validates security tokens for incoming requests."
  - type: "component"
    name: "Rate Limiting & Resiliency Policy Enforcer"
    technology: "Envoy Extension"
    description: "Enforces rate limits and resiliency policies across regional networks."
  - type: "component"
    name: "Audit & Telemetry Logger"
    technology: "Cloud Pub/Sub / gRPC"
    description: "Streams request metadata and audit logs for compliance."
relationships:
  - source: "API Router & Regional Dispatcher"
    destination: "Authentication & Authorization Filter"
    description: "Validates tokens [Internal gRPC]"
  - source: "API Router & Regional Dispatcher"
    destination: "Data Residency & Consent Router"
    description: "Forwards regional payloads [gRPC]"
  - source: "API Router & Regional Dispatcher"
    destination: "Audit & Telemetry Logger"
    description: "Streams request metadata [Cloud Pub/Sub / gRPC]"