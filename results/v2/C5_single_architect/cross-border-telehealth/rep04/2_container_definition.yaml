level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patient"
    description: "End-user utilizing mobile and web clients for video consultations, symptom checks, and consent management."
  - type: "person"
    name: "Clinician"
    description: "Licensed medical professional conducting consultations and issuing prescriptions."
  - type: "externalSystem"
    name: "External Pharmacy Systems"
    description: "Receives e-prescriptions via regional protocols."
  - type: "externalSystem"
    name: "AI Model Provider / LLM API"
    description: "External service powering the symptom checker."
  - type: "externalSystem"
    name: "National Identity Providers"
    description: "External authentication systems using eIDAS and Login.gov for user authentication and jurisdictional verification."
  - type: "externalSystem"
    name: "National Health Registries"
    description: "Country-specific health data exchanges and US HIEs for patient history and audit compliance."
  - type: "container"
    name: "Web/Mobile Client SPA/PWA"
    technology: "Flutter/React"
    description: "Provides user interface for patients and clinicians."
  - type: "container"
    name: "Google Cloud API Gateway"
    technology: "GCP API Gateway"
    description: "Entry point for client requests."
  - type: "container"
    name: "Data Residency & Consent Router"
    technology: "Go"
    description: "Enforces data residency boundaries and routes requests based on region and consent."
  - type: "container"
    name: "Core Services Backend"
    technology: "Go/Spring Boot"
    description: "Handles core platform business logic and services."
  - type: "container"
    name: "AI Symptom Checker Service"
    technology: "Python/FastAPI"
    description: "Powers the AI symptom checker using ML libraries."
  - type: "container"
    name: "Video Streaming Server"
    technology: "LiveKit WebRTC SFU on GKE"
    description: "Supports adaptive video streaming below 300 kbit/s."
  - type: "container"
    name: "Interoperability Adapter"
    technology: "Node.js/TypeScript"
    description: "Handles FHIR/JSON manipulation for cross-border integration."
  - type: "container"
    name: "Cloud SQL PostgreSQL"
    technology: "PostgreSQL"
    description: "Stores partitioned regional transactional data."
relationships:
  - source: "Patient"
    destination: "Web/Mobile Client SPA/PWA"
    description: "Interacts with platform via mobile or web client."
    technology: "HTTPS/WSS"
  - source: "Clinician"
    destination: "Web/Mobile Client SPA/PWA"
    description: "Interacts with platform via client applications."
    technology: "HTTPS/WSS"
  - source: "Web/Mobile Client SPA/PWA"
    destination: "Google Cloud API Gateway"
    description: "Sends API requests and handles communications."
    technology: "HTTPS/WSS"
  - source: "Google Cloud API Gateway"
    destination: "Data Residency & Consent Router"
    description: "Routes inbound requests."
    technology: "gRPC"
  - source: "Data Residency & Consent Router"
    destination: "Core Services Backend"
    description: "Forwards validated requests to core services."
    technology: "gRPC"
  - source: "Core Services Backend"
    destination: "Cloud SQL PostgreSQL"
    description: "Persists and queries transactional health data."
    technology: "TCP/SQL"
  - source: "Video Streaming Server"
    destination: "Web/Mobile Client SPA/PWA"
    description: "Provides video consultations."
    technology: "WebRTC over UDP/TCP"
  - source: "AI Symptom Checker Service"
    destination: "AI Model Provider / LLM API"
    description: "Queries external LLM API for symptom analysis."
    technology: "HTTPS"
  - type: "container"
    source: "Core Services Backend"
    destination: "Interoperability Adapter"
    description: "Exchanges health data with external registries and systems."
    technology: "REST/FHIR"
  - type: "container"
    source: "Interoperability Adapter"
    destination: "External Pharmacy Systems"
    description: "Dispatches e-prescriptions."
    technology: "REST/FHIR"
  - type: "container"
    source: "Interoperability Adapter"
    destination: "National Health Registries"
    description: "Synchronizes patient history and audit logs."
    technology: "REST/FHIR"
  - type: "container"
    source: "Data Residency & Consent Router"
    destination: "National Identity Providers"
    description: "Authenticates users and verifies jurisdictions."
    technology: "OIDC/SAML"