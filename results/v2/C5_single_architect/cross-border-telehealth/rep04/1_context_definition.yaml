level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and US, ensuring strict data residency, regulatory compliance, and interoperability across international healthcare networks."
elements:
  - type: "person"
    name: "Patient"
    description: "End-user utilizing mobile and web clients for video consultations, symptom checks, and consent management."
  - type: "person"
    name: "Clinician"
    description: "Licensed medical professional conducting consultations and issuing prescriptions."
  - type: "externalSystem"
    name: "External Pharmacy Systems"
    description: "Receives e-prescriptions via regional protocols."
  - type: "externalSystem"
    name: "AI Model Provider / LLM API"
    description: "External service powering the symptom checker."
  - type: "externalSystem"
    name: "National Identity Providers"
    description: "External authentication systems using eIDAS and Login.gov for user authentication and jurisdictional verification."
  - type: "externalSystem"
    name: "National Health Registries"
    description: "Country-specific health data exchanges and US HIEs for patient history and audit compliance."
relationships:
  - source: "Patient"
    destination: "Cross-Border Telehealth Platform"
    description: "Video consultations, symptom checks, and consent management."
    technology: "HTTPS/WebRTC"
  - source: "Clinician"
    destination: "Cross-Border Telehealth Platform"
    description: "Consultations and prescription authoring."
    technology: "HTTPS"
  - source: "Cross-Border Telehealth Platform"
    destination: "External Pharmacy Systems"
    description: "E-prescription dispatch."
    technology: "REST/FHIR"
  - source: "Cross-Border Telehealth Platform"
    destination: "National Identity Providers"
    description: "User authentication and jurisdictional verification."
    technology: "OIDC/SAML"
  - source: "Cross-Border Telehealth Platform"
    destination: "National Health Registries"
    description: "Patient history and audit compliance."
    technology: "REST/FHIR"