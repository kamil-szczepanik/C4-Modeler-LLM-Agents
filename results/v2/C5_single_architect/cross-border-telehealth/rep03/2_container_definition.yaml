level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients and Clinicians"
    description: "Users accessing video consultations, e-prescriptions, and AI symptom checker."
  - type: "externalSystem"
    name: "External National E-Prescription Networks and US Pharmacy Systems"
    description: "External networks and pharmacy systems for handling cross-border prescriptions."
  - type: "container"
    name: "Web/Mobile Frontend App"
    technology: "Flutter/React"
    description: "Provides local caching and user interface for degraded connections."
  - type: "container"
    name: "API Gateway"
    technology: "Envoy/GCP API Gateway"
    description: "Manages incoming HTTPS and WSS traffic and routes requests."
  - type: "container"
    name: "Core Telehealth Service"
    technology: "Go/Spring Boot"
    description: "Handles core business logic for telehealth consultations."
  - type: "container"
    name: "WebRTC SFU Video Service"
    technology: "Mediasoup"
    description: "Adapts and routes video streaming for unstable rural internet."
  - type: "container"
    name: "AI Inference Service"
    technology: "Python/FastAPI"
    description: "Implements traceable symptom checking with immutable audit logs."
  - type: "container"
    name: "E-Prescription Integrator"
    technology: "Node.js"
    description: "Integrates asynchronous e-prescription messaging with external networks."
  - type: "container"
    name: "FHIR Event Bus"
    technology: "GCP Pub/Sub"
    description: "Decouples asynchronous messaging using HL7 FHIR."
  - type: "container"
    name: "Regional Data Stores"
    technology: "GCP Cloud SQL/Spanner"
    description: "Stores partitioned regional data to satisfy GDPR and HIPAA mandates."
relationships:
  - source: "Patients and Clinicians"
    destination: "Web/Mobile Frontend App"
    description: "Interacts with the platform"
    technology: "HTTPS and WSS"
  - source: "Web/Mobile Frontend App"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS and WSS"
  - source: "API Gateway"
    destination: "Core Telehealth Service"
    description: "Routes API requests"
    technology: "gRPC"
  - source: "API Gateway"
    destination: "AI Inference Service"
    description: "Routes symptom check requests"
    technology: "gRPC"
  - source: "Core Telehealth Service"
    destination: "WebRTC SFU Video Service"
    description: "Establishes video sessions"
    technology: "WebRTC/UDP"
  - source: "Core Telehealth Service"
    destination: "FHIR Event Bus"
    description: "Publishes e-prescription events"
    technology: "GCP Pub/Sub (HL7 FHIR)"
  - source: "FHIR Event Bus"
    destination: "E-Prescription Integrator"
    description: "Consumes e-prescription events"
    technology: "GCP Pub/Sub (HL7 FHIR)"
  - source: "E-Prescription Integrator"
    destination: "External National E-Prescription Networks and US Pharmacy Systems"
    description: "Sends e-prescriptions"
    technology: "REST/SOAP"
  - source: "Core Telehealth Service"
    destination: "Regional Data Stores"
    description: "Reads and writes regional data"
    technology: "SQL"