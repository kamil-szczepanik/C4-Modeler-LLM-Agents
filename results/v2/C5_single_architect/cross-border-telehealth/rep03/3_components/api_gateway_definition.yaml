level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Envoy Authz/Lua"
    description: "Validates bearer tokens and handles security checks for incoming client requests."
  - type: "component"
    name: "Region Routing Router"
    technology: "Envoy Route Configuration"
    description: "Routes validated traffic regionally to core services and AI inference."
  - type: "component"
    name: "Rate Limiting & Resilience Component"
    technology: "Envoy Rate Limit Service"
    description: "Enforces rate limiting and resilience patterns for platform stability."
  - type: "component"
    name: "Audit & Telemetry Interceptor"
    technology: "Envoy Access Log Service"
    description: "Emits request traces and audit events for compliance and monitoring."
relationships:
  - source: "Web/Mobile Frontend App"
    destination: "Authentication & Authorization Filter"
    description: "Sends requests with bearer tokens [HTTPS and WSS]"
  - source: "Authentication & Authorization Filter"
    destination: "Region Routing Router"
    description: "Forwards validated requests internally [gRPC]"
  - source: "Region Routing Router"
    destination: "Core Telehealth Service & AI Inference Service"
    description: "Routes traffic regionally [gRPC over mTLS]"
  - source: "Region Routing Router"
    destination: "Audit & Telemetry Interceptor"
    description: "Emits request traces and audit events [gRPC]"
  - source: "Audit & Telemetry Interceptor"
    destination: "Regional Data Stores"
    description: "Persists compliance logs regionally [gRPC]"