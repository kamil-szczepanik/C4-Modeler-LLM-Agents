level: component
scope: "Component diagram for the Web/Mobile Frontend App container"
parentContainer:
  name: "Web/Mobile Frontend App"
elements:
  - type: "component"
    name: "UI Presentation Layer"
    technology: "Flutter"
    description: "Standardizes cross-platform mobile and web user interface presentation."
  - type: "component"
    name: "Local State & Storage Manager"
    technology: "SQLite/Hive with SQLCipher"
    description: "Enables encrypted offline data caching for degraded rural internet connections."
  - type: "component"
    name: "API Client & Sync Engine"
    technology: "HTTPS/WSS"
    description: "Sends API requests, consent payloads, and symptom-checker inputs with session telemetry."
  - type: "component"
    name: "WebRTC Media Client"
    technology: "WebRTC, DTLS, SRTP"
    description: "Streams media directly for consultations, delivering low-latency, resilient video streaming."
  - type: "component"
    name: "Regional Region-Routing / Config Module"
    technology: "HTTPS"
    description: "Pins app instance to correct regional endpoint."
relationships:
  - source: "Regional Region-Routing / Config Module"
    destination: "Regional Region-Routing / Config Module"
    description: "Pins app instance to correct regional endpoint [HTTPS]"
  - source: "API Client & Sync Engine"
    destination: "API Gateway"
    description: "Sends API requests, consent payloads, and symptom-checker inputs with session telemetry [HTTPS and WSS using TLS 1.3]"
  - source: "WebRTC Media Client"
    destination: "WebRTC SFU Video Service"
    description: "Streams media directly for consultations [WebRTC / ICE / DTLS / SRTP]"