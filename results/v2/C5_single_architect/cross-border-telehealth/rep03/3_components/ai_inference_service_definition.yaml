level: component
scope: "Component diagram for the AI Inference Service container"
parentContainer:
  name: "AI Inference Service"
elements:
  - type: "component"
    name: "API Controller"
    technology: "FastAPI"
    description: "Exposes endpoints for symptom check requests and coordinates AI processing."
  - type: "component"
    name: "Consent & Policy Enforcer"
    technology: "Python middleware component"
    description: "Intercepts requests for consent validation and enforces compliance."
  - type: "component"
    name: "Model Orchestrator"
    technology: "PyTorch / Hugging Face component"
    description: "Delegates inference tasks and runs region-locked symptom checker models."
  - type: "component"
    name: "Audit & Lineage Logger"
    technology: "SQLAlchemy component"
    description: "Persists inputs, outputs, and model versions for traceability."
relationships:
  - source: "API Controller"
    destination: "Consent & Policy Enforcer"
    description: "Intercepts requests for consent validation [In-process middleware]"
  - source: "Consent & Policy Enforcer"
    destination: "Regional Data Stores"
    description: "Reads active patient consent flags [SQL]"
  - source: "API Controller"
    destination: "Model Orchestrator"
    description: "Delegates inference tasks [In-process Python calls]"
  - source: "Model Orchestrator"
    destination: "Audit & Lineage Logger"
    description: "Persists inputs, outputs, and model versions [SQL]"
  - source: "API Controller"
    destination: "Audit & Lineage Logger"
    description: "Persists inputs, outputs, and model versions [SQL]"