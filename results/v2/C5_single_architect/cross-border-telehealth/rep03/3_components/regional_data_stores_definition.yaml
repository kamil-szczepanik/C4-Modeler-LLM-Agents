level: component
scope: "Component diagram for the Regional Data Stores container"
parentContainer:
  name: "Regional Data Stores"
elements:
  - type: "component"
    name: "EU Data Store Instance"
    technology: "GCP Cloud SQL (PostgreSQL)"
    description: "PostgreSQL database in europe-west3 managing partitioned EU patient health data."
  - type: "component"
    name: "US Data Store Instance"
    technology: "GCP Cloud SQL (PostgreSQL with FHIR schema)"
    description: "PostgreSQL database in us-central1 managing partitioned US patient health data with FHIR schema."
  - type: "component"
    name: "Audit & Traceability Logger"
    technology: "PostgreSQL Append-Only Schema"
    description: "Append-only schema component within each instance streaming compliance and consent logs asynchronously."
  - type: "component"
    name: "Consent Enforcement Proxy"
    technology: "Access Control Middleware, gRPC"
    description: "Access control middleware protecting both database instances and validating patient consent scopes."
relationships:
  - source: "Core Telehealth Service"
    destination: "Consent Enforcement Proxy"
    description: "Validates patient consent scopes via gRPC"
  - source: "Consent Enforcement Proxy"
    destination: "EU Data Store Instance"
    description: "Executes scoped database queries via SQL over TLS 1.3"
  - source: "Consent Enforcement Proxy"
    destination: "US Data Store Instance"
    description: "Executes scoped database queries via SQL over TLS 1.3"
  - source: "Audit & Traceability Logger"
    destination: "Cloud Logging (GCP)"
    description: "Streams compliance and consent logs asynchronously via gRPC"