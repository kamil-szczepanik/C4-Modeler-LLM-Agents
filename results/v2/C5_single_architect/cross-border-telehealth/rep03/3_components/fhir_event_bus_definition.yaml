level: component
scope: "Component diagram for the FHIR Event Bus container"
parentContainer:
  name: "FHIR Event Bus"
elements:
  - type: "component"
    name: "Event Router"
    technology: "GCP Pub/Sub"
    description: "Publishes and routes regional FHIR bundles."
  - type: "component"
    name: "FHired Schema Validator"
    technology: "HL7 FHIR"
    description: "Validates schema compliance of event payloads."
  - type: "component"
    name: "Audit Ledger Sink"
    technology: "Go / GCP Pub/Sub"
    description: "Forwards event metadata for tracing and audit purposes."
  - type: "component"
    name: "Regional Isolation Enforcer"
    technology: "Go"
    description: "Validates data residency before queuing events."
relationships:
  - source: "Event Router"
    destination: "Regional Isolation Enforcer"
    description: "Validates residency before queuing [Internal function call]"
  - source: "Event Router"
    destination: "Audit Ledger Sink"
    description: "Forwards event metadata for tracing [Internal gRPC]"