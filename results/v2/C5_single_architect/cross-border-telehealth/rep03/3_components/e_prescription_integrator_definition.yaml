level: component
scope: "Component diagram for the E-Prescription Integrator container"
parentContainer:
  name: "E-Prescription Integrator"
elements:
  - type: "component"
    name: "FHIR Event Consumer Component"
    technology: "Node.js/TypeScript"
    description: "Consumes prescription events from the FHIR Event Bus."
  - type: "component"
    name: "Jurisdiction Routing Guard Component"
    technology: "Node.js/TypeScript"
    description: "Routes events and dispatches regionally compliant payloads."
  - type: "component"
    name: "US Pharmacy Adapter Component"
    technology: "Node.js/TypeScript"
    description: "Sends prescriptions to US Pharmacy Systems."
  - type: "component"
    name: "EU National Gateway Adapter Component"
    technology: "Node.js/TypeScript"
    description: "Sends prescriptions to External National E-Prescription Networks (EU)."
  - type: "component"
    name: "Prescription Status Tracker Component"
    technology: "Node.js/TypeScript"
    description: "Reports delivery status."
relationships:
  - source: "FHIR Event Consumer Component"
    destination: "Jurisdiction Routing Guard Component"
    description: "Routes event [In-Memory]"
  - source: "Jurisdiction Routing Guard Component"
    destination: "US Pharmacy Adapter Component"
    description: "Dispatches regionally compliant payloads [In-Memory]"
  - source: "Jurisdiction Routing Guard Component"
    destination: "EU National Gateway Adapter Component"
    description: "Dispatches regionally compliant payloads [In-Memory]"
  - source: "US Pharmacy Adapter Component"
    destination: "Prescription Status Tracker Component"
    description: "Reports delivery status [gRPC]"
  - source: "EU National Gateway Adapter Component"
    destination: "Prescription Status Tracker Component"
    description: "Reports delivery status [gRPC]"