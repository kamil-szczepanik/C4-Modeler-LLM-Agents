level: component
scope: "Component diagram for the Core Telehealth Service container"
parentContainer:
  name: "Core Telehealth Service"
elements:
  - type: "component"
    name: "Consultation Manager"
    technology: "Go / Spring Boot"
    description: "Manages telehealth consultation sessions between patients and clinicians."
  - type: "component"
    name: "Consent & Privacy Enforcement"
    technology: "Go / Spring Boot"
    description: "Validates patient consent and enforces privacy compliance."
  - type: "component"
    name: "Prescription Coordinator"
    technology: "Go / Spring Boot"
    description: "Coordinates e-prescriptions across regional networks."
  - type: "component"
    name: "Symptom Assessment Logger"
    technology: "Go / Spring Boot"
    description: "Logs and persists symptom assessment details and audit trails."
relationships:
  - source: "Consultation Manager"
    destination: "Consent & Privacy Enforcement"
    description: "Validates patient consent [In-memory function call]"