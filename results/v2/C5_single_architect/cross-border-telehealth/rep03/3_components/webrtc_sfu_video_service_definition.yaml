    name: "Signaling & Room Manager"
    technology: "Node.js / TypeScript"
    description: "Manages signaling via gRPC and controls room sessions and tracks."
  - type: "component"
    name: "Media Router Node"
    technology: "Mediasoup Worker in C++ / Node.js"
    description: "Powers selective forwarding and simulcast stream adaptation."
  - type: "component"
    name: "Bandwidth Adaptation Controller"
    technology: "C++"
    description: "Guarantees resilient, degraded-mode consultations for unstable rural connections by processing media telemetry."
relationships:
  - source: "Signaling & Room Manager"
    destination: "Media Router Node"
    description: "Controls media tracks via IPC (Local Pipe)"
  - source: "Media Router Node"
    destination: "Bandwidth Adaptation Controller"
    description: "Feeds telemetry via Internal Function Call"