level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and AI symptom checking for patients across the EU and US while enforcing strict regional data residency."
elements:
  - type: "person"
    name: "Patients & Clinicians"
    description: "End-users accessing the platform via Mobile and Web Applications for video consultations, e-prescriptions, and AI symptom checking."
  - type: "externalSystem"
    name: "National E-Prescription Networks (EU)"
    description: "External systems utilizing country-specific standards (e.g., eHDSI/NCPeH) for European e-prescriptions."
  - type: "externalSystem"
    name: "Pharmacy Systems (US)"
    description: "External systems utilizing HL7 FHIR for US pharmacy integrations."
  - type: "externalSystem"
    name: "Identity Providers & Gateways"
    description: "External OAuth2/OIDC IdPs, Payment Gateways, and SMS Notification Gateways."
relationships:
  - source: "Patients & Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses application logic and video consultations"
    technology: "HTTPS (REST) and WebRTC"
  - source: "Cross-Border Telehealth Platform"
    destination: "National E-Prescription Networks (EU)"
    description: "Sends and receives European e-prescriptions"
    technology: "Mutual TLS (mTLS) and national standards (e.g., eHDSI/NCPeH)"
  - source: "Cross-Border Telehealth Platform"
    destination: "Pharmacy Systems (US)"
    description: "Sends and receives US e-prescriptions and pharmacy data"
    technology: "HL7 FHIR over HTTPS (REST)"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity Providers & Gateways"
    description: "Authenticates users, processes payments, and sends notifications"
    technology: "OAuth2/OIDC, HTTPS REST, SMPP/APNs"