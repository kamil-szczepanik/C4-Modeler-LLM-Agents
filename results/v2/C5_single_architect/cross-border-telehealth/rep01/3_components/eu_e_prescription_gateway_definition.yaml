level: component
scope: "Component diagram for the EU E-Prescription Gateway container"
parentContainer:
  name: "EU E-Prescription Gateway"
elements:
  - type: "component"
    name: "Prescription Orchestrator"
    technology: "Spring Batch/Core"
    description: "Component managing workflow state."
  - type: "component"
    name: "National Adapter Engine"
    technology: "Spring Integration"
    description: "Component hosting pluggable protocol adapters."
  - type: "component"
    name: "Audit & Compliance Logger"
    technology: "Java / Spring Boot"
    description: "Component recording translation and dispatch actions."
  - type: "component"
    name: "Consent Enforcement Interceptor"
    technology: "Spring Security / Aspect"
    description: "Component validating patient consent."
relationships:
  - source: "Consent Enforcement Interceptor"
    destination: "National Adapter Engine"
    description: "Internal dispatch after consent validation."
  - source: "Prescription Orchestrator"
    destination: "Cloud SQL PostgreSQL"
    description: "Persists region-specific data via JDBC (SQL/TCP, encrypted)."
  - source: "National Adapter Engine"
    destination: "External Pharmacy Systems"
    description: "Integrates with national standards via mTLS, SOAP, and REST."