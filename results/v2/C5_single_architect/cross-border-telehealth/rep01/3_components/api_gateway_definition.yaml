level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing & Regional Dispatcher"
    technology: "Go / Envoy Proxy"
    description: "High-performance regional routing and dispatching of internal requests."
  - type: "component"
    name: "JWT & mTLS Termination Filter"
    technology: "Envoy Proxy Filter / Security Component"
    description: "Terminates incoming encrypted HTTPS/mTLS traffic and handles JWT authentication."
  - type: "component"
    name: "Rate Limiting & Circuit Breaker"
    technology: "Envoy Proxy / Traffic Management Component"
    description: "Protects backend services by managing traffic rates and failing fast over unstable networks."
  - type: "component"
    name: "Compliance Audit Logger"
    technology: "Go / Logging Component"
    description: "Logs routing telemetry and sends compliance data for auditing."
relationships:
  - source: "JWT & mTLS Termination Filter"
    destination: "Routing & Regional Dispatcher"
    description: "Passes authenticated and decrypted traffic [Internal]"
  - source: "Routing & Regional Dispatcher"
    destination: "Compliance Audit Logger"
    description: "Sends routing telemetry [Internal gRPC]"