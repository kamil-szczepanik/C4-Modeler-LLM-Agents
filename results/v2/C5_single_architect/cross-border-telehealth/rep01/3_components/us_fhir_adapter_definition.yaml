level: component
scope: "Component diagram for the US FHIR Adapter container"
parentContainer:
  name: "US FHIR Adapter"
elements:
  - type: "component"
    name: "FHIR Router"
    technology: "Node.js / TypeScript / NestJS"
    description: "Provides native dependency injection and strict DTO validation, routing integration requests."
  - type: "component"
    name: "FHIR Mapping Engine"
    technology: "Node.js / TypeScript"
    description: "Handles data transformation for HL7 FHIR standards."
  - type: "component"
    name: "Pharmacy Integration Client"
    technology: "Node.js / TypeScript"
    description: "Sends e-prescriptions to external pharmacy systems."
  - type: "component"
    name: "US Persistence Repository"
    technology: "Node.js / TypeScript"
    description: "Persists US-specific data and enforces mandatory access logging."
  - type: "component"
    name: "Audit Logger"
    technology: "Node.js / TypeScript"
    description: "Emits and logs audit events to enforce compliance."
relationships:
  - source: "FHIR Router"
    destination: "FHIR Mapping Engine"
    description: "Delegates transformation [In-process function calls]"
  - source: "FHIR Router"
    destination: "Audit Logger"
    description: "Emits audit events [In-process event emitter]"
  - source: "US Persistence Repository"
    destination: "Audit Logger"
    description: "Enforces mandatory access logging [In-process]"
  - source: "US Persistence Repository"
    destination: "Cloud SQL PostgreSQL & Cloud Storage"
    description: "Persists US-specific data [SQL / TCP, locked to us-central1]"
  - source: "Pharmacy Integration Client"
    destination: "External Pharmacy Systems"
    description: "Sends e-prescriptions [HTTPS/REST]"