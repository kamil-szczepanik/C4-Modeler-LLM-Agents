level: component
scope: "Component diagram for the Single-Patient / Mobile App container"
parentContainer:
  name: "Single-Patient / Mobile App"
elements:
  - type: "component"
    name: "UI Layer / Presentation Components"
    technology: "Flutter / Dart"
    description: "Provides the user interface and presentation components for cross-platform mobile interaction."
  - type: "component"
    name: "Local Sync & State Management Component"
    technology: "Hive/SQLite with SQLCipher"
