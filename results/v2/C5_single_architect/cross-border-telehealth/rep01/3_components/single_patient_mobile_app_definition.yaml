    name: "API Client & Gateway Adapter Component"
    technology: "Flutter / Dart"
    description: "Communicates backend requests securely via HTTPS/mTLS and gRPC-Web."
  - type: "component"
    name: "WebRTC Client Component"
    technology: "LiveKit SDK"
    description: "Handles media streams, adaptive bitrate streaming, and degraded network recovery."
  - type: "component"
    name: "Security & Cryptography Component"
    technology: "flutter_secure_storage"
    description: "Secures local storage for OAuth tokens and credentials."
  - type: "component"
    name: "Consent Enforcement Component"
    technology: "Flutter / Dart"
    description: "Queries consent flags prior to dispatch to ensure regional data sovereignty."
relationships:
  - source: "UI Layer / Presentation Components"
    destination: "Consent Enforcement Component"
    description: "Queries consent flags prior to dispatch"
  - source: "API Client & Gateway Adapter Component"
    destination: "Consent Enforcement Component"
    description: "Queries consent flags prior to dispatch"
  - source: "Local Sync & State Management Component"
    destination: "SQLCipher"
    description: "Secures encrypted local caching"
  - source: "Single-Patient / Mobile App"
    destination: "API Gateway"
    description: "Communicates backend requests [HTTPS/mTLS and gRPC-Web]"
  - source: "Single-Patient / Mobile App"
    destination: "LiveKit SFU Media Server"
    description: "Handles media streams [WebRTC/UDP]"