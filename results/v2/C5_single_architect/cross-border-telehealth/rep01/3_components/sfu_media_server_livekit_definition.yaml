level: component
scope: "Component diagram for the SFU Media Server / LiveKit container"
parentContainer:
  name: "SFU Media Server / LiveKit"
elements:
  - type: "component"
    name: "SFU Room & Session Manager"
    technology: "Go, LiveKit Core"
    description: "Manages room lifecycles and session coordination."
  - type: "component"
    name: "Media Forwarding Engine"
    technology: "Go, WebRTC"
    description: "Forwards real-time audio and video streams using WebRTC."
  - type: "component"
    name: "TURN / ICE Relay Service"
    technology: "Coturn, LiveKit Egress"
    description: "Provides NAT traversal for restricted rural networks."
  - type: "component"
    name: "Recording & Egress Service"
    technology: "LiveKit Egress, Go"
    description: "Archives session media."
relationships:
  - source: "SFU Room & Session Manager"
    destination: "Core Telehealth Service"
    description: "Validates room entry via gRPC"
  - source: "Media Forwarding Engine"
    destination: "Recording & Egress Service"
    description: "Triggers media archiving via gRPC"
  - source: "Recording & Egress Service"
    destination: "Cloud Storage (GCP)"
    description: "Persists encrypted recordings via HTTPS/TLS"