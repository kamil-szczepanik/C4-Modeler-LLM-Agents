level: component
scope: "Component diagram for the Cloud SQL PostgreSQL & Cloud Storage container"
parentContainer:
  name: "Cloud SQL PostgreSQL & Cloud Storage"
elements:
  - type: "component"
    name: "Regional Database Instances"
    technology: "Cloud SQL PostgreSQL 15"
    description: "Persists and retrieves regional data with strict physical separation in europe-west3 and us-central1."
  - type: "component"
    name: "Encrypted Blob Storage"
    technology: "Google Cloud Storage & Cloud KMS"
    description: "Stores secure media and prescriptions using Customer-Managed Encryption Keys."
  - type: "component"
    name: "Audit & Compliance Ledger"
    technology: "PostgreSQL extensions, triggers, and RLS"
    description: "Writes immutable symptom-checker logs and consent states."
  - type: "component"
    name: "Backup & Retention Manager"
    technology: "Cloud Storage Lifecycle Rules with object locks"
    description: "Manages data retention and backup compliance."
  - type: "component"
    name: "Database Migration Manager"
    technology: "Flyway / Go"
    description: "Handles database schema migration and management."
relationships:
  - source: "Cloud SQL PostgreSQL & Cloud Storage"
    destination: "Encrypted Blob Storage"
    description: "Reference secure object URIs for media and prescriptions [Internal GCP API]"
  - source: "Core Telehealth Service"
    destination: "Regional Database Instances"
    description: "Persist and retrieve regional data [PostgreSQL wire protocol / TLS 1.3]"
  - source: "US FHIR Adapter"
    destination: "Regional Database Instances"
    description: "Persist and retrieve regional data [PostgreSQL wire protocol / TLS 1.3]"
  - source: "EU E-Prescription Gateway"
    destination: "Regional Database Instances"
    description: "Persist and retrieve regional data [PostgreSQL wire protocol / TLS 1.3]"
  - source: "Core Telehealth Service"
    destination: "Audit & Compliance Ledger"
    description: "Write immutable symptom-checker logs and consent states [SQL / TLS 1.3]"