level: component
scope: "Component diagram for the AI Inference Wrapper container"
parentContainer:
  name: "AI Inference Wrapper"
elements:
  - type: "component"
    name: "AI Inference Wrapper"
    technology: "Python / FastAPI"
    description: "Wraps AI symptom check requests and coordinates inference workflows."
  - type: "component"
    name: "Inference Router"
    technology: "Python / FastAPI"
    description: "Routes internal inference operations, dispatches audit logs, and validates consent tokens."
  - type: "component"
    name: "Model Client Adapter"
    technology: "Python / LangChain / HTTPX"
    description: "Manages reliable model client communication and payload sanitization."
  - type: "component"
    name: "Audit & Traceability Logger"
    technology: "Python / Google Cloud Logging & SQLAlchemy"
    description: "Logs immutable audit data and ensures traceability."
  - type: "component"
    name: "Consent Enforcement Interceptor"
    technology: "Python Middleware"
    description: "Enforces patient consent tokens for requests."
relationships:
  - source: "AI Inference Wrapper"
    destination: "Inference Router"
    description: "Delegates requests [gRPC and HTTPS]"
  - source: "Inference Router"
    destination: "Model Client Adapter"
    description: "Internal function calls [Python]"
  - source: "Inference Router"
    destination: "Audit & Traceability Logger"
    description: "Asynchronous event dispatch [Google Cloud Pub/Sub]"
  - source: "Inference Router"
    destination: "Consent Enforcement Interceptor"
    description: "Validates patient consent tokens [gRPC]"