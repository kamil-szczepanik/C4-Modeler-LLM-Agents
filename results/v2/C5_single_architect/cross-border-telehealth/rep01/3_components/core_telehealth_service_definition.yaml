level: component
scope: "Component diagram for the Core Telehealth Service container"
parentContainer:
  name: "Core Telehealth Service"
elements:
  - type: "component"
    name: "Consultation Manager"
    technology: "Go"
    description: "Handles scheduling, session lifecycle, and real-time coordination."
  - type: "component"
    name: "Prescription Coordinator"
    technology: "Go"
    description: "Manages e-prescription workflows routed to regional integration gateways."
  - type: "component"
    name: "Consent & Policy Engine"
    technology: "Go"
    description: "Enforces GDPR/HIPAA data residency and verifies purpose-based patient consents."
  - type: "component"
    name: "Audit & Traceability Logger"
    technology: "Go"
    description: "Captures cryptographically signed audit trails for AI recommendations and cross-region data access."
  - type: "component"
    name: "Symptom Checker Orchestrator"
    technology: "Go"
    description: "Manages secure interactions with the AI Inference Wrapper and ensures model version logging."
relationships:
  - source: "Consultation Manager"
    destination: "LiveKit SFU Media Server"
    description: "Coordinates video rooms via [gRPC]"
  - source: "Prescription Coordinator"
    destination: "US FHIR Adapter & EU E-Prescription Gateway"
    description: "Dispatches prescriptions via [gRPC]"
  - source: "Symptom Checker Orchestrator"
    destination: "AI Inference Wrapper"
    description: "Requests urgency recommendations via [gRPC/HTTPS]"
  - source: "Consultation Manager"
    destination: "Cloud SQL PostgreSQL & Cloud Storage"
    description: "Persists transactional and audit data via [SQL/TCP]"
