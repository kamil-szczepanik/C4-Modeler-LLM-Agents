level: context
scope: "System Context diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
  description: "Provides video consultations, e-prescriptions, and an AI symptom checker for patients in the EU and the US while ensuring strict regional data residency and regulatory compliance."
elements:
  - type: "person"
    name: "Patients & Clinicians"
    description: "External users accessing the platform via web and mobile applications for video consultations, e-prescriptions, and symptom checking."
  - type: "externalSystem"
    name: "Identity Providers (IdP)"
    description: "External OAuth2/OIDC systems handling regional user authentication."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service (e.g., Stripe) for processing consultation payments."
  - type: "externalSystem"
    name: "External Pharmacy Systems"
    description: "National EU e-prescription gateways and US pharmacy networks."
  - type: "externalSystem"
    name: "AI Symptom Checker"
    description: "Integrated AI engine for urgency recommendations with strict version logging."
relationships:
  - source: "Patients & Clinicians"
    destination: "Cross-Border Telehealth Platform"
    description: "Accesses video consultations and platform features"
    technology: "HTTPS and WebRTC"
  - source: "Cross-Border Telehealth Platform"
    destination: "Identity Providers (IdP)"
    description: "Authenticates users"
    technology: "HTTPS (OIDC)"
  - source: "Cross-Border Telehealth Platform"
    destination: "Payment Gateway"
    description: "Processes consultation billing"
    technology: "HTTPS/REST"
  - source: "Cross-Border Telehealth Platform"
    destination: "External Pharmacy Systems"
    description: "Submits e-prescriptions"
    technology: "HTTPS (HL7 FHIR & national standards)"
  - source: "Cross-Border Telehealth Platform"
    destination: "AI Symptom Checker"
    description: "Requests urgency recommendations and AI analysis"
    technology: "gRPC/HTTPS"