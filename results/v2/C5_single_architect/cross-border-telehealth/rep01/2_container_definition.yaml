level: container
scope: "Container diagram for Cross-Border Telehealth Platform"
system:
  name: "Cross-Border Telehealth Platform"
elements:
  - type: "person"
    name: "Patients & Clinicians"
    description: "Users accessing the platform via web and mobile applications for video consultations, e-prescriptions, and symptom checking."
  - type: "externalSystem"
    name: "Identity Providers (IdP)"
    description: "External OAuth2/OIDC systems handling regional user authentication."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service for processing consultation payments."
  - type: "externalSystem"
    name: "External Pharmacy Systems"
    description: "National EU e-prescription gateways and US pharmacy networks."
  - type: "container"
    name: "Single-Patient / Mobile App"
    technology: "Flutter / TypeScript"
    description: "Cross-platform client applications for users to interact with the platform."
  - type: "container"
    name: "API Gateway"
    technology: "Cloud API Gateway"
    description: "Routes and manages incoming traffic to internal microservices."
  - type: "container"
    name: "Core Telehealth Service"
    technology: "Go / gRPC"
    description: "Implements high-performance core business logic for telehealth consultations."
  - type: "container"
    name: "AI Inference Wrapper"
    technology: "Python / FastAPI"
    description: "Manages AI Symptom Checker inference and traceability logging."
  - type: "container"
    name: "SFU Media Server / LiveKit"
    technology: "LiveKit (GKE)"
    description: "Provides SFU media streaming with adaptive bitrate for consultations and rural connections."
  - type: "container"
    name: "US FHIR Adapter"
    technology: "Node.js / TypeScript"
    description: "Handles regional interoperability and integrates with US pharmacy systems."
  - type: "container"
    name: "EU E-Prescription Gateway"
    technology: "Java / Spring Boot"
    description: "Handles regional interoperability and integrates with national e-prescription standards."
  - type: "container"
    name: "Cloud SQL PostgreSQL & Cloud Storage"
    technology: "PostgreSQL, Cloud Storage (GCP)"
    description: "Secures partitioned regional data storage ensuring data residency."
relationships:
  - source: "Patients & Clinicians"
    destination: "Single-Patient / Mobile App"
    description: "Interacts via video consultations, e-prescriptions, and symptom checking"
    technology: "HTTPS and WebSockets"
  - source: "Single-Patient / Mobile App"
    destination: "API Gateway"
    description: "Communicates requests to backend services"
    technology: "HTTPS/mTLS"
  - source: "API Gateway"
    destination: "Core Telehealth Service"
    description: "Routes core telehealth requests"
    technology: "gRPC and HTTPS"
  - source: "API Gateway"
    destination: "AI Inference Wrapper"
    description: "Routes AI symptom check requests"
    technology: "gRPC and HTTPS"
  - source: "API Gateway"
    destination: "US FHIR Adapter"
    description: "Routes US-specific integration requests"
    technology: "gRPC and HTTPS"
  - source: "API Gateway"
    destination: "EU E-Prescription Gateway"
    description: "Routes EU-specific integration requests"
    technology: "gRPC and HTTPS"
  - source: "Single-Patient / Mobile App"
    destination: "SFU Media Server / LiveKit"
    description: "Handles peer-to-peer and relayed video streams for consultations"
    technology: "WebRTC/UDP"
  - source: "US FHIR Adapter"
    destination: "External Pharmacy Systems"
    description: "Integrates with US pharmacy systems"
    technology: "HTTPS/REST"
  - source: "EU E-Prescription Gateway"
    destination: "External Pharmacy Systems"
    description: "Integrates with national e-prescription standards"
    technology: "mTLS, SOAP, and REST"
  - source: "Core Telehealth Service"
    destination: "Cloud SQL PostgreSQL & Cloud Storage"
    description: "Persists and retrieves consultation data"
    technology: "SQL / TCP"
  - source: "US FHIR Adapter"
    destination: "Cloud SQL PostgreSQL & Cloud Storage"
    description: "Persists US region-specific data"
    technology: "SQL / TCP"
  - source: "EU E-Prescription Gateway"
    destination: "Cloud SQL PostgreSQL & Cloud Storage"
    description: "Persists EU region-specific data"
    technology: "SQL / TCP"
  - source: "Single-Patient / Mobile App"
    destination: "Identity Providers (IdP)"
    description: "Authenticates users"
    technology: "HTTPS (OIDC)"
  - source: "Single-Patient / Mobile App"
    destination: "Payment Gateway"
    description: "Processes consultation billing"
    technology: "HTTPS/REST"