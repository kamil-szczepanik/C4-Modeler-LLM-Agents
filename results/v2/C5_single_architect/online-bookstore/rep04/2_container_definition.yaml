level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Customer"
    description: "End-user browsing books, managing cart, and purchasing via web/mobile browsers."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Handles secure checkout and multi-currency transactions."
  - type: "externalSystem"
    name: "Shipping Provider API"
    description: "Manages logistics, shipping labels, and tracking."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Manages secure customer authentication."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Sends transactional emails and SMS for order confirmations and resets."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "Calculates regional taxes for compliance during checkout."
  - type: "container"
    name: "Single Page Application"
    technology: "React / TypeScript, AWS S3/CloudFront"
    description: "Provides the user interface for catalog browsing, recommendations, and reviews."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway"
    description: "Centralizes entry point, JWT validation, and OWASP rate limiting."
  - type: "container"
    name: "Catalog Service"
    technology: "Go, PostgreSQL (RDS)"
    description: "Manages book catalog and product information."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Node.js, PostgreSQL (RDS)"
    description: "Handles shopping cart, checkout, and order fulfillment processes."
  - type: "container"
    name: "Recommendation Service"
    technology: "Python FastAPI, Vector DB"
    description: "Provides personalized book recommendations using AI."
  - type: "container"
    name: "Review Service"
    technology: "Java Spring Boot, MongoDB"
    description: "Manages customer reviews and ratings."
  - type: "container"
    name: "Background Worker"
    technology: "AWS ECS/Lambda, AWS SQS/SNS"
    description: "Handles asynchronous event-driven decoupling for shipping, notifications, and background tasks."
  - type: "container"
    name: "Cache"
    technology: "Redis, Amazon ElastiCache"
    description: "Provides fast in-memory caching for core services."
relationships:
  - source: "Customer"
    destination: "Single Page Application"
    description: "Browses bookstore, manages cart, and views recommendations"
    technology: "HTTPS"
  - source: "Single Page Application"
    destination: "API Gateway"
    description: "Makes API requests for catalog, orders, recommendations, and reviews"
    technology: "HTTPS / WSS"
  - source: "API Gateway"
    destination: "Catalog Service"
    description: "Routes catalog queries"
    technology: "gRPC / HTTP"
  - source: "API Gateway"
    destination: "Order & Checkout Service"
    description: "Routes checkout and order requests"
    technology: "gRPC / HTTP"
  - source: "API Gateway"
    destination: "Recommendation Service"
    description: "Routes recommendation queries"
    technology: "gRPC / HTTP"
  - source: "API Gateway"
    destination: "Review Service"
    description: "Routes review queries and submissions"
    technology: "gRPC / HTTP"
  - source: "Catalog Service"
    destination: "Cache"
    description: "Reads and writes cached catalog data"
    technology: "TCP"
  - source: "Order & Checkout Service"
    destination: "Cache"
    description: "Reads and writes cached session and order data"
    technology: "TCP"
  - source: "Recommendation Service"
    destination: "Cache"
    description: "Reads and writes cached recommendation data"
    technology: "TCP"
  - source: "Review Service"
    destination: "Cache"
    description: "Reads and writes cached review data"
    technology: "TCP"
  - source: "Order & Checkout Service"
    destination: "Background Worker"
    description: "Publishes asynchronous events for shipping and notifications"
    technology: "AWS SQS (AWS SDK)"
  - source: "Order & Checkout Service"
    destination: "Payment Gateway"
    description: "Processes secure payments and transactions"
    technology: "HTTPS"
  - source: "Order & Checkout Service"
    destination: "Shipping Provider API"
    description: "Requests fulfillment and shipping labels"
    technology: "HTTPS"
  - source: "Order & Checkout Service"
    destination: "Tax Calculation Service"
    description: "Queries regional tax rates"
    technology: "HTTPS"
  - source: "Background Worker"
    destination: "Notification Service"
    description: "Dispatches transactional emails and SMS"
    technology: "HTTPS"