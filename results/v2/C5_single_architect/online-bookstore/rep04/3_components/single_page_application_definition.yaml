# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Single Page Application container"
parentContainer:
  name: "Single Page Application"
elements:
  - type: "component"
    name: "Router and Navigation"
    technology: "React Router"
    description: "Manages client-side routing and view navigation within the Single Page Application."
  - type: "component"
    name: "State Management Store"
    technology: "Zustand"
    description: "Manages global application state including user session, cart data, and UI preferences."
  - type: "component"
    name: "Catalog and Search UI"
    technology: "React and TypeScript"
    description: "Renders book catalog browsing, filtering, and search interfaces."
  - type: "component"
    name: "Checkout and Cart"
    technology: "React and TypeScript"
    description: "Handles shopping cart management and checkout workflows for physical and electronic books."
  - type: "component"
    name: "Recommendations and Reviews"
    technology: "React and TypeScript"
    description: "Displays personalized book recommendations and customer reviews."
  - type: "component"
    name: "Auth and Consent Manager"
    technology: "React and TypeScript"
    description: "Manages user authentication state and GDPR/CCPA compliance consent preferences."
  - type: "component"
    name: "API Client"
    technology: "Axios / Fetch"
    description: "Handles secure HTTPS/WSS communication with the backend API Gateway."
relationships:
  - source: "Router and Navigation"
    destination: "Catalog and Search UI"
    description: "Navigates to"
  - source: "Router and Navigation"
    destination: "Checkout and Cart"
    description: "Navigates to"
  - source: "Router and Navigation"
    destination: "Recommendations and Reviews"
    description: "Navigates to"
  - source: "Checkout and Cart"
    destination: "State Management Store"
    description: "Reads and updates cart state"
  - source: "Catalog and Search UI"
    destination: "API Client"
    description: "Fetches catalog and search data via"
  - source: "Checkout and Cart"
    destination: "API Client"
    description: "Submits orders via"
  - source: "Recommendations and Reviews"
    destination: "API Client"
    description: "Fetches recommendations and reviews via"
  - source: "Auth and Consent Manager"
    destination: "API Client"
    description: "Sends authentication and consent data via"