level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "API Router"
    technology: "FastAPI Router (Python)"
    description: "Handling incoming requests."
  - type: "component"
    name: "Recommendation Engine"
    technology: "Scikit-learn / PyTorch Light (Python)"
    description: "For inference and similarity computation."
  - type: "component"
    name: "Feature Store Client"
    technology: "Redis Client (Python)"
    description: "Fetching user interaction history."
  - type: "component"
    name: "Vector DB Repository"
    technology: "Pinecone / pgvector client (Python)"
    description: "Querying book embeddings."
  - type: "component"
    name: "Embedding Sync Worker"
    technology: "Celery / Python Background Task (Python)"
    description: "Updating item embeddings asynchronously."
relationships:
  - source: "API Gateway"
    destination: "API Router"
    description: "Routes recommendation queries [gRPC / HTTP]"
  - source: "API Router"
    destination: "Recommendation Engine"
    description: "Delegates scoring logic [In-process / Python function calls]"
  - source: "Recommendation Engine"
    destination: "Feature Store Client"
    description: "Retrieves user context [TCP / Redis Protocol]"
  - source: "Recommendation Engine"
    destination: "Vector DB Repository"
    description: "Queries book embeddings [gRPC]"
  - source: "Background Worker"
    destination: "Embedding Sync Worker"
    description: "Publishes catalog change events [AWS SQS / AMQP]"
  - source: "Embedding Sync Worker"
    destination: "Vector DB Repository"
    description: "Upserts book embeddings [gRPC]"