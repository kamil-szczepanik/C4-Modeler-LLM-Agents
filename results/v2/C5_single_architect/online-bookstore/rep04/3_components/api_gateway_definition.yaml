level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "JWT Authorizer"
    technology: "AWS API Gateway Authorizer"
    description: "Validates JSON Web Tokens for incoming requests."
  - type: "component"
    name: "Rate Limiter & WAF"
    technology: "AWS WAF"
    description: "Provides rate limiting and OWASP Top-10 mitigations."
  - type: "component"
    name: "HTTP Proxy Router"
    technology: "AWS API Gateway Proxy"
    description: "Routes incoming HTTP and gRPC requests to appropriate backend services."
  - type: "component"
    name: "Request Transformation & Enrichment"
    technology: "AWS API Gateway Mapping Templates"
    description: "Enriches payloads and transforms request structures."
  - type: "component"
    name: "Response Caching"
    technology: "Amazon ElastiCache (Redis)"
    description: "Checks and stores cached responses for fast retrieval."
relationships:
  - source: "JWT Authorizer"
    destination: "HTTP Proxy Router"
    description: "Forwards authenticated requests [Internal]"
  - source: "HTTP Proxy Router"
    destination: "Request Transformation & Enrichment"
    description: "Enriches payloads [Internal]"
  - source: "Request Transformation & Enrichment"
    destination: "Response Caching"
    description: "Checks and stores cache [Internal / Amazon ElastiCache]"
  - source: "Response Caching"
    destination: "Catalog Service"
    description: "Fallback origin fetch [gRPC over AWS VPC Link]"
  - source: "Response Caching"
    destination: "Recommendation Service"
    description: "Fallback origin fetch [gRPC over AWS VPC Link]"
  - source: "HTTP Proxy Router"
    destination: "Order & Checkout Service"
    description: "Routes checkout requests [gRPC / HTTP]"
  - source: "HTTP Proxy Router"
    destination: "Review Service"
    description: "Routes review queries [gRPC / HTTP]"