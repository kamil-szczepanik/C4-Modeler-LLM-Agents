level: component
scope: "Component diagram for the Background Worker container"
parentContainer:
  name: "Background Worker"
elements:
  - type: "component"
    name: "Event Consumer"
    technology: "AWS Lambda / Python"
    description: "Polls message queues to process decoupled asynchronous tasks."
  - type: "component"
    name: "Shipping Integrator"
    technology: "Python / AWS SDK"
    description: "Communicates with external shipping APIs for order fulfillment."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Python / AWS SDK"
    description: "Dispatches transactional emails and alerts."
  - type: "component"
    name: "Outbox Processor"
    technology: "Python / AWS ECS task"
    description: "Scans transaction tables to reliably publish domain events and prevent dual-write issues."
  - type: "component"
    name: "AWS SQS"
    technology: "AWS SQS"
    description: "Asynchronous message queuing backbone."
  - type: "component"
    name: "Order & Checkout Database"
    technology: "RDS PostgreSQL"
    description: "Stores relational data and utilizes the transactional outbox pattern."
  - type: "component"
    name: "Shipping Provider API"
    technology: "HTTPS (REST)"
    description: "External API for order fulfillment."
  - type: "component"
    name: "Notification Service"
    technology: "HTTPS"
    description: "External service for dispatching alerts."
relationships:
  - source: "Order & Checkout Database"
    destination: "Outbox Processor"
    description: "Queries unpublished outbox events via SQL/TCP"
  - source: "Outbox Processor"
    destination: "Event Consumer"
    description: "Relays reliable message payloads via AWS SQS"
  - source: "Shipping Integrator"
    destination: "Shipping Provider API"
    description: "Submits fulfillment requests via HTTPS (REST)"
  - source: "Notification Dispatcher"
    destination: "Notification Service"
    description: "Dispatches alerts via HTTPS"