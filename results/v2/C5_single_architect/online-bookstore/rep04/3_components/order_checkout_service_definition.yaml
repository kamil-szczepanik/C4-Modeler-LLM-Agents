level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Cart Controller & Manager"
    technology: "Node.js"
    description: "Manages shopping cart operations and user cart state."
  - type: "component"
    name: "Checkout Orchestrator"
    technology: "Node.js / Saga / State Machine"
    description: "Orchestrates the checkout process and distributed transactions."
  - type: "component"
    name: "Fulfillment Adapter"
    technology: "Node.js"
    description: "Adapts and communicates with external shipping providers."
  - type: "component"
    name: "Domain Event Publisher"
    technology: "Node.js / AWS SDK"
    description: "Publishes asynchronous events to AWS SQS / SNS."
  - type: "component"
    name: "Order Repository"
    technology: "Node.js"
    description: "Handles data persistence for orders in PostgreSQL."
relationships:
  - source: "Checkout Orchestrator"
    destination: "Payment Gateway"
    description: "Processes secure payments [HTTPS]"
  - source: "Checkout Orchestrator"
    destination: "Tax Calculation Service"
    description: "Queries regional tax rates [HTTPS]"
  - source: "Fulfillment Adapter"
    destination: "Shipping Provider API"
    description: "Requests fulfillment and shipping labels [HTTPS]"
  - source: "Domain Event Publisher"
    destination: "AWS SQS / SNS"
    description: "Publishes asynchronous events via AWS SDK"
  - source: "Order Repository"
    destination: "PostgreSQL (RDS)"
    description: "Reads and writes order transactional data"