level: component
scope: "Component diagram for the Catalog Service container"
parentContainer:
  name: "Catalog Service"
elements:
  - type: "component"
    name: "Catalog API Controller"
    technology: "Go"
    description: "Handles incoming gRPC and HTTP requests from the API Gateway."
  - type: "component"
    name: "Catalog Domain"
    technology: "Go modules"
    description: "Encapsulates business logic for browsing, keyword searching, and inventory status."
  - type: "component"
    name: "Product Repository"
    technology: "database/sql, pq driver"
    description: "Manages persistence and SQL query generation."
  - type: "component"
    name: "Search Adapter"
    technology: "Go client packages"
    description: "Interfaces with text-search indices for complex keyword queries."
  - type: "component"
    name: "Cache Container"
    technology: "Amazon ElastiCache Redis"
    description: "Provides product caching."
  - type: "component"
    name: "Product Database"
    technology: "PostgreSQL (RDS)"
    description: "Stores relational product data."
relationships:
  - source: "API Gateway"
    destination: "Catalog API Controller"
    description: "Routes catalog queries via gRPC and HTTP."
  - source: "Catalog API Controller"
    destination: "Catalog Domain"
    description: "Invokes business logic via in-memory function calls."
  - source: "Catalog Domain"
    destination: "Product Repository"
    description: "Reads and writes product data via PostgreSQL Wire Protocol over TCP."
  - source: "Catalog Domain"
    destination: "Cache Container"
    description: "Checks and populates product cache via Redis Protocol over TCP."
  - source: "Catalog Domain"
    destination: "Search Adapter"
    description: "Queries product indices via HTTP over TCP."