level: component
scope: "Component diagram for the Review Service container"
parentContainer:
  name: "Review Service"
elements:
  - type: "component"
    name: "ReviewController"
    technology: "Spring REST endpoint handler"
    description: "REST endpoint handler for review queries and submissions."
  - type: "component"
    name: "ReviewServiceBean"
    technology: "Java Spring Boot"
    description: "Core business logic processor."
  - type: "component"
    name: "ReviewRepository"
    technology: "MongoDB Java Driver"
    description: "Data access layer for review documents."
  - type: "component"
    name: "RatingAggregator"
    technology: "Asynchronous event listener"
    description: "Asynchronous event listener and rating calculator."
  - type: "component"
    name: "ModerationClient"
    technology: "Spring Cloud OpenFeign"
    description: "Spring Cloud OpenFeign client for NLP content moderation."
relationships:
  - source: "ReviewServiceBean"
    destination: "ModerationClient"
    description: "Sends review text for NLP checks via REST / HTTPS."
  - source: "ReviewRepository"
    destination: "MongoDB (Document DB)"
    description: "Reads and writes review documents via TCP."
  - source: "RatingAggregator"
    destination: "Amazon ElastiCache (Redis)"
    description: "Invalidates and updates cached review data via TCP."