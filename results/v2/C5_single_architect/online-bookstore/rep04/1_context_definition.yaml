level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "A scaled-down Amazon-style e-commerce platform for purchasing physical and electronic books, providing catalogue browsing, secure checkout, reviews, and personalized recommendations."
elements:
  - type: "person"
    name: "Customer"
    description: "End-user browsing books, managing cart, and purchasing via web/mobile browsers."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Handles secure checkout and multi-currency transactions (USD, EUR, GBP)."
  - type: "externalSystem"
    name: "Shipping Provider API"
    description: "Manages logistics, shipping labels, and tracking."
  - type: "externalSystem"
    name: "Identity Provider / OAuth"
    description: "Manages secure customer authentication."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Sends transactional emails and SMS for order confirmations and resets."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "Calculates regional taxes for compliance during checkout."
relationships:
  - source: "Customer"
    destination: "Online Bookstore"
    description: "Browses catalogue, manages cart, and completes checkout"
    technology: "HTTPS"
  - source: "Online Bookstore"
    destination: "Payment Gateway"
    description: "Processes secure multi-currency payments"
    technology: "HTTPS / REST"
  - source: "Online Bookstore"
    destination: "Shipping Provider API"
    description: "Requests fulfillment and tracks shipments"
    technology: "HTTPS / REST"
  - source: "Online Bookstore"
    destination: "Identity Provider / OAuth"
    description: "Authenticates users securely"
    technology: "OIDC / OAuth2 over HTTPS"
  - source: "Online Bookstore"
    destination: "Notification Service"
    description: "Dispatches transactional alerts"
    technology: "HTTPS / REST"
  - source: "Online Bookstore"
    destination: "Tax Calculation Service"
    description: "Queries regional tax rates during checkout"
    technology: "HTTPS / REST"