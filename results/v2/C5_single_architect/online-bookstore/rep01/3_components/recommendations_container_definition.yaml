level: component
scope: "Component diagram for the Recommendations Container container"
parentContainer:
  name: "Recommendations Container"
elements:
  - type: "component"
    name: "Recommendation API Router"
    technology: "FastAPI / Python"
    description: "Provides high-performance asynchronous API endpoints for real-time recommendation delivery."
  - type: "component"
    name: "Recommendation Service"
    technology: "Python"
    description: "Orchestrates recommendation scoring, caching, and data retrieval workflows."
  - type: "component"
    name: "Collaborative Filtering Engine"
    technology: "Python / NumPy & SciPy"
    description: "Enables efficient computation of collaborative filtering and recommendation vectors."
  - type: "component"
    name: "Cache & Persistence Access Layer"
    technology: "SQLAlchemy / Boto3"
    description: "Manages persistence access to Amazon Aurora PostgreSQL and Amazon DynamoDB securely over TLS."
  - type: "component"
    name: "In-Memory Cache"
    technology: "Redis / Amazon ElastiCache"
    description: "Caches pre-computed vectors and lists to ensure low-latency responses under high concurrency."
  - type: "component"
    name: "Amazon Aurora PostgreSQL & Amazon DynamoDB"
    technology: "SQL / NoSQL"
    description: "Persistent storage for recommendation data and user metrics."
relationships:
  - source: "Recommendation API Router"
    destination: "Recommendation Service"
    description: "Direct function calls (In-memory) [gRPC over TLS]"
  - source: "Recommendation Service"
    destination: "Collaborative Filtering Engine"
    description: "Invokes recommendation scoring algorithms [In-memory]"
  - source: "Recommendation Service"
    destination: "In-Memory Cache"
    description: "Reads cached recommendation payloads [RESP over TCP / TLS]"
  - source: "Recommendation Service"
    destination: "Cache & Persistence Access Layer"
    description: "Orchestrates data retrieval [In-memory]"
  - source: "Cache & Persistence Access Layer"
    destination: "Amazon Aurora PostgreSQL & Amazon DynamoDB"
    description: "Reads and writes recommendation data [SQL / NoSQL over TLS]"
  - source: "Cache & Persistence Access Layer"
    destination: "In-Memory Cache"
    description: "Fallback population on cache misses [RESP over TCP]"