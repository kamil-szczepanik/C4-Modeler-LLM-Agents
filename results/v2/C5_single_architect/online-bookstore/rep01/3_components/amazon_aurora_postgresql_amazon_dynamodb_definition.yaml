level: component
scope: "Component diagram for the Amazon Aurora PostgreSQL & Amazon DynamoDB container"
parentContainer:
  name: "Amazon Aurora PostgreSQL & Amazon DynamoDB"
elements:
  - type: "component"
    name: "Catalog & User Relational DB"
    technology: "Amazon Aurora PostgreSQL Multi-Region"
    description: "Stores structured book, review data, and provides ACID compliance for financial orders."
  - type: "component"
    name: "Cart & Session NoSQL Store"
    technology: "Amazon DynamoDB Global Tables"
    description: "Delivers low-latency storage for shopping carts and sessions."
relationships:
  - source: "Catalog & Search Container"
    destination: "Catalog & User Relational DB"
    description: "Queries structured book/review data [JDBC/SQL over TLS]."
  - source: "Order & Checkout Container"
    destination: "Cart & Session NoSQL Store"
    description: "Reads/writes cart data [AWS SDK / HTTPS]."