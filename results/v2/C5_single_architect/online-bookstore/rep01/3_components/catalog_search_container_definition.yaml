level: component
scope: "Component diagram for the Catalog & Search Container container"
parentContainer:
  name: "Catalog & Search Container"
elements:
  - type: "component"
    name: "Catalog Controller"
    technology: "Spring Web/gRPC"
    description: "Component acting as the entry point."
  - type: "component"
    name: "Search Service"
    technology: "Elasticsearch/AWS OpenSearch"
    description: "Component for full-text indexing and queries."
  - type: "component"
    name: "Inventory Manager"
    technology: "Spring Data JPA"
    description: "Component for stock and metadata."
  - type: "component"
    name: "Recommendation Ingestion Component"
    technology: "Spring Batch"
    description: "Component for interaction data."
  - type: "component"
    name: "ML Inference Bridge"
    technology: "AWS SDK / SageMaker Runtime"
    description: "Component for model invocation."
  - type: "component"
    name: "Amazon Aurora PostgreSQL & Amazon DynamoDB"
    technology: "Relational and NoSQL datastores"
    description: "Relational and NoSQL datastores."
  - type: "component"
    name: "Amazon SageMaker"
    technology: "Managed machine learning service"
    description: "Managed machine learning service."
relationships:
  - source: "API Gateway"
    destination: "Catalog Controller"
    description: "Routes catalog requests [gRPC over TLS]."
  - source: "Catalog Controller"
    destination: "Search Service"
    description: "Queries product indices [Internal REST/HTTP over TLS]."
  - source: "Catalog Controller"
    destination: "ML Inference Bridge"
    description: "Fetches recommendations [gRPC]."
  - source: "Search Service"
    destination: "Amazon OpenSearch"
    description: "Indexes and retrieves catalog items [HTTPS]."
  - source: "Inventory Manager"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists book data [JDBC over TLS]."
  - source: "Recommendation Ingestion Component"
    destination: "Amazon DynamoDB"
    description: "Reads aggregated history [NoSQL over TLS]."
  - source: "ML Inference Bridge"
    destination: "Amazon SageMaker"
    description: "Invokes models [HTTPS over TLS]."