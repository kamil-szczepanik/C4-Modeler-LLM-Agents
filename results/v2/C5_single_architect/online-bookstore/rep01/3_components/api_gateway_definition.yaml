level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing & Dispatcher"
    technology: "AWS API Gateway Routing"
    description: "Routes API requests to the appropriate backend microservices."
  - type: "component"
    name: "Auth Filter"
    technology: "AWS API Gateway Auth Filter"
    description: "Validates tokens and handles authentication for incoming requests."
  - type: "component"
    name: "Rate Limiter"
    technology: "AWS API Gateway Rate Limiter"
    description: "Limits request rates to ensure availability and prevent abuse."
  - type: "component"
    name: "Request Transformation/Caching"
    technology: "AWS API Gateway Transformation & Cache"
    description: "Transforms payloads and caches responses for low-latency page loads."
relationships:
  - source: "Auth Filter"
    destination: "Routing & Dispatcher"
    description: "Validates tokens and proxies payloads [Internal Memory]"