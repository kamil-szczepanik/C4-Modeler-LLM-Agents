level: component
scope: "Component diagram for the Notification Service container"
parentContainer:
  name: "Notification Service"
elements:
  - type: "component"
    name: "Notification Router Component"
    technology: "Go"
    description: "Handles incoming gRPC requests and domain events."
  - type: "component"
    name: "Template Engine Component"
    technology: "Go"
    description: "Compiles localized templates using Amazon DynamoDB."
  - type: "component"
    name: "Dispatcher Worker Pool Component"
    technology: "Go"
    description: "Concurrent Go workers executing third-party API dispatches."
  - type: "component"
    name: "Delivery Status Tracker Component"
    technology: "Go"
    description: "Records audit logs to Amazon Aurora PostgreSQL."
  - type: "component"
    name: "Event Consumer Component"
    technology: "Go"
    description: "Subscribes to the async event bus."
relationships:
  - source: "Notification Router Component"
    destination: "Template Engine Component"
    description: "Invokes rendering via in-memory function calls."
  - source: "Template Engine Component"
    destination: "Dispatcher Worker Pool Component"
    description: "Passes payloads via Go channels."