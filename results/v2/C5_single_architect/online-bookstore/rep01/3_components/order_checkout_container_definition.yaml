level: component
scope: "Component diagram for the Order & Checkout Container container"
parentContainer:
  name: "Order & Checkout Container"
elements:
  - type: "component"
    name: "API Gateway"
    technology: "AWS API Gateway"
    description: "AWS API Gateway entry point routing external requests."
  - type: "component"
    name: "Checkout Orchestrator Component"
    technology: "TypeScript, In-memory state machine"
    description: "TypeScript domain service coordinating workflows and saga patterns via an in-memory state machine."
  - type: "component"
    name: "Cart Management Component"
    technology: "TypeScript, Express Router, Amazon DynamoDB"
    description: "TypeScript Express Router managing ephemeral and persistent cart state via Amazon DynamoDB."
  - type: "component"
    name: "Payment Client Component"
    technology: "TypeScript, Axios, Circuit Breakers"
    description: "TypeScript Axios client encapsulating Third-Party Payment Gateway integrations with circuit breakers."
  - type: "component"
    name: "Order Persistence Component"
    technology: "TypeScript, Prisma ORM, Amazon Aurora PostgreSQL"
    description: "TypeScript Prisma ORM managing transactional writes to Amazon Aurora PostgreSQL."
  - type: "component"
    name: "Third-Party Payment Gateway"
    technology: "External Service, HTTPS"
    description: "External system for authorizing and processing charges."
  - type: "component"
    name: "Async Event Bus"
    technology: "Amazon EventBridge / Amazon MSK"
    description: "Event bus for emitting asynchronous events such as OrderPlaced."
relationships:
  - source: "API Gateway"
    destination: "Checkout Orchestrator Component"
    description: "Routes order and cart requests [gRPC over TLS]"
  - source: "Checkout Orchestrator Component"
    destination: "Cart Management Component"
    description: "Fetches and updates shopping cart items [In-process / NoSQL over TLS]"
  - source: "Checkout Orchestrator Component"
    destination: "Payment Client Component"
    description: "Requests secure payment processing [In-process function calls]"
  - source: "Payment Client Component"
    destination: "Third-Party Payment Gateway"
    description: "Authorizes and processes charges [HTTPS (TLS)]"
  - source: "Checkout Orchestrator Component"
    destination: "Order Persistence Component"
    description: "Persists finalized order data [Prisma ORM via SQL over TLS]"
  - source: "Checkout Orchestrator Component"
    destination: "Async Event Bus"
    description: "Emits `OrderPlaced` events [AWS SDK over TLS]"