level: component
scope: "Component diagram for the Single Page Application (SPA) container"
parentContainer:
  name: "Single Page Application (SPA)"
elements:
  - type: "component"
    name: "Router / Shell"
    technology: "React Router, Context API"
    description: "Manages client-side routing, global context, and layouts."
  - type: "component"
    name: "Catalog & Search View"
    technology: "React, TanStack Query"
    description: "Renders book grids, filters, and keyword search."
  - type: "component"
    name: "Cart & Checkout View"
    technology: "React, Zustand"
    description: "Manages shopping cart state and checkout workflows."
  - type: "component"
    name: "Reviews & Ratings Widget"
    technology: "React"
    description: "Handles 5-star submissions and reviews display."
  - type: "component"
    name: "State Hydration / Caching Manager"
    technology: "TanStack Query, Zustand persist"
    description: "Handles local storage persistence, JWT memory management, and optimistic UI updates."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios, Fetch API"
    description: "Centralized HTTP client managing requests and token injection."
  - type: "component"
    name: "API Gateway"
    technology: "REST, GraphQL, HTTPS"
    description: "External entry point for backend microservices."
relationships:
  - source: "Catalog & Search View"
    destination: "API Gateway"
    description: "Fetches catalog and search data via HTTPS"
  - source: "Cart & Checkout View"
    destination: "API Gateway"
    description: "Submits cart and checkout orders via HTTPS"
  - source: "Catalog & Search View"
    destination: "API Client Layer"
    description: "Executes network requests via internal function calls"
  - source: "Cart & Checkout View"
    destination: "API Client Layer"
    description: "Executes network requests via internal function calls"
  - source: "Reviews & Ratings Widget"
    destination: "API Client Layer"
    description: "Executes network requests via internal function calls"
  - source: "Router / Shell"
    destination: "API Client Layer"
    description: "Executes network requests via internal function calls"
  - source: "Catalog & Search View"
    destination: "State Hydration / Caching Manager"
    description: "Persists state and caches data locally"
  - source: "Cart & Checkout View"
    destination: "State Hydration / Caching Manager"
    description: "Persists state and caches data locally"
  - source: "Reviews & Ratings Widget"
    destination: "State Hydration / Caching Manager"
    description: "Persists state and caches data locally"
  - source: "Router / Shell"
    destination: "State Hydration / Caching Manager"
    description: "Persists state and caches data locally"