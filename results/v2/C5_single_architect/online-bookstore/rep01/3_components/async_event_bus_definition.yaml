level: component
scope: "Component diagram for the Async Event Bus container"
parentContainer:
  name: "Async Event Bus"
elements:
  - type: "component"
    name: "Event Router / Ingestion Engine"
    technology: "Amazon EventBridge Rules / Kafka Brokers"
    description: "Decouples microservices and routes events based on schema rules."
  - type: "component"
    name: "Event Topic / Stream Partition Manager"
    technology: "Amazon MSK Topics"
    description: "Provides distributed event ingestion and ordered event log streaming."
  - type: "component"
    name: "Dead Letter Queue (DLQ) Handler"
    technology: "Amazon SQS + Lambda"
    description: "Implements Dead Letter Queues for fault-tolerant failure recovery."
  - type: "component"
    name: "Outbound Dispatcher"
    technology: "AWS Lambda / EventBridge API Destinations"
    description: "Triggers external integrations and outbound message dispatching."
  - type: "component"
    name: "Schema Registry"
    technology: "AWS Glue Schema Registry"
    description: "Enforces strict JSON/Avro schemas to validate event payloads."
  - type: "component"
    name: "Order & Checkout Container"
    technology: "Container"
    description: "Publishes domain events to the event bus."
  - type: "component"
    name: "Notification Service"
    technology: "Service"
    description: "Streams domain events for customer alerts."
  - type: "component"
    name: "Third-Party Shipping Provider"
    technology: "External System"
    description: "Receives fulfillment requests via webhooks and HTTPS APIs."
relationships:
  - source: "Order & Checkout Container"
    destination: "Event Router / Ingestion Engine"
    description: "Publishes events [JSON over TLS]"
  - source: "Event Router / Ingestion Engine"
    destination: "Schema Registry"
    description: "Validates event payloads [Internal gRPC/HTTPS]"
  - source: "Event Router / Ingestion Engine"
    destination: "Event Topic / Stream Partition Manager"
    description: "Routes events based on schema rules [Internal broker protocol]"
  - source: "Event Topic / Stream Partition Manager"
    destination: "Outbound Dispatcher"
    description: "Triggers external integrations [Internal polling/push]"
  - source: "Event Topic / Stream Partition Manager"
    destination: "Notification Service"
    description: "Streams domain events for customer alerts [SASL/SCRAM over TLS]"
  - source: "Async Event Bus"
    destination: "Third-Party Shipping Provider"
    description: "Sends fulfillment requests [Webhooks / HTTPS APIs]"