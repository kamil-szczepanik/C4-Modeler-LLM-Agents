# C4 Model: Level 2 - Container
level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Customer"
    description: "End-user accessing the platform via web or mobile to browse, purchase, and review physical and electronic books."
  - type: "externalSystem"
    name: "Third-Party Payment Gateway"
    description: "External system for secure checkout and transaction processing."
  - type: "externalSystem"
    name: "Third-Party Shipping Provider"
    description: "External system for order fulfillment and tracking."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External system for authentication and identity management."
  - type: "externalSystem"
    name: "Currency Exchange Rate Service"
    description: "External system providing live multi-currency conversion rates."
  - type: "container"
    name: "Single Page Application (SPA)"
    technology: "React / TypeScript on Amazon S3 + CloudFront"
    description: "Provides the user interface for browsing books, managing carts, and viewing orders."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway"
    description: "Handles rate limiting, auth validation, and routing requests to backend containers."
  - type: "container"
    name: "Catalog & Search Container"
    technology: "Spring Boot, Amazon SageMaker"
    description: "Manages book inventory, search capabilities, and AI/ML recommendations."
  - type: "container"
    name: "Order & Checkout Container"
    technology: "Node.js / Express"
    description: "Handles order processing, cart management, and payment orchestration."
  - type: "container"
    name: "Recommendations Container"
    technology: "Python / FastAPI"
    description: "Computes and serves personalized book recommendations."
  - type: "container"
    name: "Notification Service"
    technology: "Go"
    description: "Sends notifications and alerts to customers."
  - type: "container"
    name: "Async Event Bus"
    technology: "Amazon EventBridge / Amazon MSK"
    description: "Facilitates asynchronous event-driven decoupling between microservices."
  - type: "container"
    name: "Amazon Aurora PostgreSQL & Amazon DynamoDB"
    technology: "Amazon Aurora PostgreSQL, Amazon DynamoDB"
    description: "Persistent storage for relational data, carts, and sessions."
relationships:
  - source: "Customer"
    destination: "Single Page Application (SPA)"
    description: "Interacts with the platform"
    technology: "HTTPS / WSS"
  - source: "Single Page Application (SPA)"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS (REST/GraphQL)"
  - source: "API Gateway"
    destination: "Catalog & Search Container"
    description: "Routes catalog requests"
    technology: "gRPC over TLS (VPC private subnets)"
  - source: "API Gateway"
    destination: "Order & Checkout Container"
    description: "Routes order requests"
    technology: "gRPC over TLS (VPC private subnets)"
  - source: "API Gateway"
    destination: "Recommendations Container"
    description: "Routes recommendation requests"
    technology: "gRPC over TLS (VPC private subnets)"
  - source: "API Gateway"
    destination: "Notification Service"
    description: "Routes notification requests"
    technology: "gRPC over TLS (VPC private subnets)"
  - source: "Order & Checkout Container"
    destination: "Third-Party Payment Gateway"
    description: "Processes payments"
    technology: "HTTPS (TLS)"
  - source: "Order & Checkout Container"
    destination: "Async Event Bus"
    description: "Publishes OrderPlaced events"
    technology: "Publishes via TLS"
  - source: "Async Event Bus"
    destination: "Third-Party Shipping Provider"
    description: "Sends fulfillment requests"
    technology: "Webhooks / HTTPS APIs"
  - source: "Catalog & Search Container"
    destination: "Amazon Aurora PostgreSQL & Amazon DynamoDB"
    description: "Reads and writes relational and inventory data"
    technology: "SQL / NoSQL over TLS"
  - source: "Order & Checkout Container"
    destination: "Amazon Aurora PostgreSQL & Amazon DynamoDB"
    description: "Reads and writes order and cart data"
    technology: "SQL / NoSQL over TLS"
  - source: "Recommendations Container"
    destination: "Amazon Aurora PostgreSQL & Amazon DynamoDB"
    description: "Reads and writes recommendation data"
    technology: "SQL / NoSQL over TLS"
  - source: "Notification Service"
    destination: "Amazon Aurora PostgreSQL & Amazon DynamoDB"
    description: "Accesses database records"
    technology: "SQL / NoSQL over TLS"