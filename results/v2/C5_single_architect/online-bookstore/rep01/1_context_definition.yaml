level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "A scaled-down Amazon-style e-commerce platform for purchasing physical and electronic books with integrated reviews and recommendations, operating globally with multi-currency support and GDPR/CCPA compliance."
elements:
  - type: "person"
    name: "Customer"
    description: "End-user accessing the platform via web or mobile to browse, purchase, review books, and authenticate."
  - type: "externalSystem"
    name: "Third-Party Payment Gateway"
    description: "External system (Stripe/PayPal) for secure checkout and transaction processing."
  - type: "externalSystem"
    name: "Third-Party Shipping Provider"
    description: "External system (FedEx/DHL) for order fulfillment and tracking."
  - type: "externalSystem"
    name: "Identity Provider / Auth Service"
    description: "External system (Auth0/AWS Cognito) for authentication and identity management using OIDC/OAuth2."
  - type: "externalSystem"
    name: "Currency Exchange Rate Service"
    description: "External system providing live multi-currency conversion rates (USD, EUR, GBP)."
relationships:
  - source: "Customer"
    destination: "Online Bookstore System"
    description: "Browses, purchases, and leaves reviews"
    technology: "HTTPS"
  - source: "Customer"
    destination: "Online Bookstore System"
    description: "Authenticates using OIDC"
    technology: "HTTPS / OIDC"
  - source: "Online Bookstore System"
    destination: "Third-Party Payment Gateway"
    description: "Processes transactions"
    technology: "HTTPS/REST"
  - source: "Online Bookstore System"
    destination: "Third-Party Shipping Provider"
    description: "Requests fulfillment"
    technology: "HTTPS/REST"
  - source: "Online Bookstore System"
    destination: "Currency Exchange Rate Service"
    description: "Fetches live rates"
    technology: "HTTPS/REST"