level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Customer"
    description: "End-user browsing, purchasing, and reviewing books."
  - type: "person"
    name: "Store Administrator"
    description: "Manages catalogue, inventory, and system oversight."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processing system."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "External fulfillment and shipping services."
  - type: "externalSystem"
    name: "Email/Notification Service"
    description: "External service for alerts and emails."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "External service for automated tax compliance."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "External identity provider for authentication."
  - type: "container"
    name: "Single Page App (SPA)"
    technology: "React, TypeScript, Amazon CloudFront, S3"
    description: "Delivers client-side interface for customers and administrators."
  - type: "container"
    name: "API Gateway"
    technology: "Amazon API Gateway (REST/GraphQL)"
    description: "Routes client requests and handles API routing."
  - type: "container"
    name: "Catalog Service"
    technology: "Go, Amazon ECS / AWS Fargate"
    description: "Manages book catalogs and search capabilities."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Node.js, Express, Amazon ECS / AWS Fargate"
    description: "Handles ACID-compliant transactions, shopping carts, and order processing."
  - type: "container"
    name: "Recommendation Service"
    technology: "Python, FastAPI, Amazon ECS / AWS Fargate"
    description: "Delivers real-time personalized recommendations."
  - type: "container"
    name: "Database (DynamoDB)"
    technology: "Amazon DynamoDB"
    description: "Provides catalogue search speed and scalable NoSQL storage."
  - type: "container"
    name: "Database (Aurora PostgreSQL)"
    technology: "Amazon Aurora PostgreSQL"
    description: "Provides ACID-compliant relational data storage."
  - type: "container"
    name: "Cache (ElastiCache Redis)"
    technology: "Amazon ElastiCache (Redis)"
    description: "Provides real-time caching for recommendations and sessions."
  - type: "container"
    name: "Message Broker"
    technology: "Amazon SQS, Amazon SNS, Amazon EventBridge"
    description: "Handles asynchronous event-driven workflows and messaging."
relationships:
  - source: "Customer"
    destination: "Single Page App (SPA)"
    description: "Browses books, places orders, and manages account"
    technology: "HTTPS via Amazon CloudFront"
  - source: "Store Administrator"
    destination: "Single Page App (SPA)"
    description: "Manages inventory and catalogue"
    technology: "HTTPS via Amazon CloudFront"
  - source: "Single Page App (SPA)"
    destination: "API Gateway"
    description: "Sends API requests and queries"
    technology: "HTTPS / GraphQL / REST"
  - source: "API Gateway"
    destination: "Catalog Service"
    description: "Routes catalogue and search queries"
    technology: "gRPC / HTTPS over internal VPC"
  - source: "API Gateway"
    destination: "Order & Checkout Service"
    description: "Routes order and checkout actions"
    technology: "gRPC / HTTPS over internal VPC"
  - source: "API Gateway"
    destination: "Recommendation Service"
    description: "Routes recommendation queries"
    technology: "gRPC / HTTPS over internal VPC"
  - source: "Catalog Service"
    destination: "Database (DynamoDB)"
    description: "Reads and writes catalogue data"
    technology: "DynamoDB Protocol"
  - source: "Order & Checkout Service"
    destination: "Database (Aurora PostgreSQL)"
    description: "Persists transactions and orders"
    technology: "PostgreSQL Protocol"
  - source: "Recommendation Service"
    destination: "Cache (ElastiCache Redis)"
    description: "Reads and writes recommendation cache"
    technology: "Redis Protocol"
  - source: "Order & Checkout Service"
    destination: "Message Broker"
    description: "Publishes and consumes asynchronous events"
    technology: "AWS VPC messaging protocols"
  - source: "Order & Checkout Service"
    destination: "Payment Gateway"
    description: "Processes payment transactions"
    technology: "HTTPS webhooks and APIs"
  - source: "Order & Checkout Service"
    destination: "Shipping Provider APIs"
    description: "Arranges order fulfillment"
    technology: "HTTPS webhooks and APIs"
  - source: "Order & Checkout Service"
    destination: "Tax Calculation Service"
    description: "Calculates order taxes"
    technology: "HTTPS webhooks and APIs"
  - source: "Order & Checkout Service"
    destination: "Email/Notification Service"
    description: "Sends order confirmations and alerts"
    technology: "HTTPS webhooks and APIs"
  - source: "Single Page App (SPA)"
    destination: "Identity Provider (IdP)"
    description: "Authenticates users"
    technology: "HTTPS / OIDC"