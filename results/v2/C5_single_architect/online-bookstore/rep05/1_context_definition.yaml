level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore"
  description: "A cloud-native multi-region e-commerce system built to handle book sales, customer reviews, and personalized recommendations while maintaining compliance, high availability, and performance."
elements:
  - type: "person"
    name: "Customer"
    description: "End-user browsing, purchasing, and reviewing books."
  - type: "person"
    name: "Store Administrator"
    description: "Manages catalogue, inventory, and system oversight."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe or PayPal processing transactions."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "FedEx, UPS, or DHL for order fulfillment."
  - type: "externalSystem"
    name: "Email/Notification Service"
    description: "Amazon SES or SendGrid for alerts."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "Avalara or TaxJar for automated tax compliance."
  - type: "externalSystem"
    name: "Identity Provider (IdP)"
    description: "AWS Cognito or Auth0 for authentication."
relationships:
  - source: "Customer"
    destination: "Online Bookstore"
    description: "Interacts with the Online Bookstore via Web/Mobile"
    technology: "HTTPS"
  - source: "Store Administrator"
    destination: "Online Bookstore"
    description: "Interacts with the Online Bookstore for system oversight and management"
    technology: "HTTPS"
  - source: "Customer"
    destination: "Identity Provider (IdP)"
    description: "Authenticates against Identity Provider"
    technology: "OIDC over HTTPS"
  - source: "Store Administrator"
    destination: "Identity Provider (IdP)"
    description: "Authenticates against Identity Provider"
    technology: "OIDC over HTTPS"
  - source: "Online Bookstore"
    destination: "Payment Gateway"
    description: "Processes transactions during checkout"
    technology: "REST/TLS 1.3"
  - source: "Online Bookstore"
    destination: "Tax Calculation Service"
    description: "Calculates automated taxes during checkout"
    technology: "REST/TLS 1.3"
  - source: "Online Bookstore"
    destination: "Shipping Provider APIs"
    description: "Integrates for order fulfillment"
    technology: "REST/TLS 1.3"
  - source: "Online Bookstore"
    destination: "Email/Notification Service"
    description: "Utilizes for order confirmations and alerts"
    technology: "SMTP/HTTPS"