level: component
scope: "Component diagram for the Cache (ElastiCache Redis) container"
parentContainer:
  name: "Cache (ElastiCache Redis)"
elements:
  - type: "component"
    name: "Recommendation Cache Component"
    technology: "Redis, ElastiCache"
    description: "Caches book recommendations for fast retrieval by the Recommendation Service."
  - type: "component"
    name: "Session Store Component"
    technology: "Redis, ElastiCache"
    description: "Stores user session data for authentication and state management."
relationships:
  - source: "Recommendation Service"
    destination: "Recommendation Cache Component"
    description: "Reads and writes recommendation data via Redis Protocol."
  - source: "Message Broker"
    destination: "Recommendation Cache Component"
    description: "Triggers cache invalidation via AMQP/SNS topics."