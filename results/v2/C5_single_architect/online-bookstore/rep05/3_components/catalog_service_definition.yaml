level: component
scope: "Component diagram for the Catalog Service container"
parentContainer:
  name: "Catalog Service"
elements:
  - type: "component"
    name: "Catalog API Controller"
    technology: "Go, net/http"
    description: "Handles catalogue and search queries routed from the API Gateway."
  - type: "component"
    name: "Catalog Domain Manager"
    technology: "Go"
    description: "Manages business logic, record persistence, cache interactions, and index synchronization."
  - type: "component"
    name: "Search & Indexing Engine"
    technology: "Go, Amazon OpenSearch Service"
    description: "Handles high-performance keyword searches and full-text search indexing."
  - type: "component"
    name: "Cache Aside Proxy"
    technology: "Go, go-redis"
    description: "Performs in-memory lookups to cache hot-spot read requests and minimize latency."
  - type: "component"
    name: "API Gateway"
    technology: "API Gateway"
    description: "External system routing catalogue and search queries."
  - type: "component"
    name: "Database (DynamoDB)"
    technology: "Amazon DynamoDB"
    description: "Scalable NoSQL storage for catalogue metadata."
  - type: "component"
    name: "Message Broker (Amazon SQS)"
    technology: "Amazon SQS"
    description: "Message broker providing inventory updates."
relationships:
  - source: "API Gateway"
    destination: "Catalog API Controller"
    description: "Routes catalogue and search queries [gRPC / HTTPS]"
  - source: "Catalog Domain Manager"
    destination: "Database (DynamoDB)"
    description: "Persists records [DynamoDB Go SDK]"
  - source: "Catalog Domain Manager"
    destination: "Cache Aside Proxy"
    description: "In-memory lookups [TCP / Redis RESP]"
  - source: "Catalog Domain Manager"
    destination: "Search & Indexing Engine"
    description: "Index synchronization [AWS SDK / Async]"
  - source: "Message Broker (Amazon SQS)"
    destination: "Catalog Domain Manager"
    description: "Subscribes to inventory updates [SQS Protocol]"