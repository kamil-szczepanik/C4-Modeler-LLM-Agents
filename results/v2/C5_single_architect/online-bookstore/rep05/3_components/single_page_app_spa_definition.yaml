level: component
scope: "Component diagram for the Single Page App (SPA) container"
parentContainer:
  name: "Single Page App (SPA)"
elements:
  - type: "component"
    name: "Routing & Shell Component"
    technology: "React Router, React & TypeScript"
    description: "Handles client-side routing, layout shells, and lazy loading for the application."
  - type: "component"
    name: "Catalog & Search View"
    technology: "React & TypeScript"
    description: "Displays book browsing, search interfaces, and catalog data to customers."
  - type: "component"
    name: "Cart & Checkout Module"
    technology: "React & TypeScript"
    description: "Manages shopping cart state, secure checkout flows, and order submission."
  - type: "component"
    name: "Recommendation & Review Widget"
    technology: "React & TypeScript"
    description: "Renders personalized recommendations and customer product reviews."
  - type: "component"
    name: "Auth & State Management Client"
    technology: "React & TypeScript"
    description: "Manages user authentication sessions with the Identity Provider (IdP) via OIDC."
  - type: "component"
    name: "Client-Side Cache & API Client"
    technology: "TanStack Query, Axios, React & TypeScript"
    description: "Handles data fetching, request deduplication, optimistic updates, and caching."
relationships:
  - source: "Routing & Shell Component"
    destination: "Client-Side Cache & API Client"
    description: "Data fetching and state updates [In-memory / Function Calls]"
  - source: "Catalog & Search View"
    destination: "Client-Side Cache & API Client"
    description: "Data fetching and state updates [In-memory / Function Calls]"
  - source: "Cart & Checkout Module"
    destination: "Client-Side Cache & API Client"
    description: "Data fetching and state updates [In-memory / Function Calls]"
  - source: "Recommendation & Review Widget"
    destination: "Client-Side Cache & API Client"
    description: "Data fetching and state updates [In-memory / Function Calls]"
  - source: "Auth & State Management Client"
    destination: "Identity Provider (IdP)"
    description: "User authentication [HTTPS / OIDC]"
  - source: "Client-Side Cache & API Client"
    destination: "API Gateway"
    description: "Fetches data and submits orders [HTTPS / REST & GraphQL]"