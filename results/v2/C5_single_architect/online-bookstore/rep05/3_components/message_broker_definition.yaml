level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Event Router"
    technology: "Amazon EventBridge"
    description: "Amazon EventBridge for content-based domain event routing."
  - type: "component"
    name: "Notification Dispatcher"
    technology: "Amazon SNS"
    description: "Amazon SNS for broadcasting fan-out messages."
  - type: "component"
    name: "Task Queue Manager"
    technology: "Amazon SQS"
    description: "Amazon SQS for durable queue management and decoupling."
  - type: "component"
    name: "DLQ Monitor"
    technology: "Amazon CloudWatch and AWS Lambda"
    description: "Amazon CloudWatch and AWS Lambda for alerting on unprocessable messages."
relationships:
  - source: "Order & Checkout Service"
    destination: "Event Router"
    description: "Publishes domain events [HTTPS / AWS SDK]"
  - source: "Event Router"
    destination: "Task Queue Manager"
    description: "Dispatches asynchronous tasks [AWS internal routing]"
  - source: "Task Queue Manager"
    destination: "Recommendation Service"
    description: "Delivers payloads [HTTP / SQS Long Polling]"
  - source: "Task Queue Manager"
    destination: "DLQ Monitor"
    description: "Forwards unprocessable messages [Amazon SQS Redrive Policy]"
  - source: "DLQ Monitor"
    destination: "Store Administrator"
    description: "Sends operational alerts [Amazon SNS / Email]"