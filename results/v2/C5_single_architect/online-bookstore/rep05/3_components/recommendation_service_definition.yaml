level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "Recommendation API Controller"
    technology: "Python FastAPI"
    description: "Endpoint handling incoming recommendation requests."
  - type: "component"
    name: "Recommendation Engine"
    technology: "Python NumPy/Scikit-learn"
    description: "Core logic implementing collaborative filtering and recommendation algorithms."
  - type: "component"
    name: "Model Ingestion Worker"
    technology: "Python Celery"
    description: "Worker handling asynchronous model updates."
  - type: "component"
    name: "Cache Repository"
    technology: "Python Redis-py"
    description: "Interface for high-performance caching."
  - type: "component"
    name: "Database Repository"
    technology: "Python SQLAlchemy/Boto3"
    description: "Data access layer for persistence."
relationships:
  - source: "API Gateway"
    destination: "Recommendation API Controller"
    description: "Routes recommendation queries via gRPC / HTTPS over internal VPC."
  - source: "Recommendation API Controller"
    destination: "Recommendation Engine"
    description: "Executes in-process Python function calls."
  - source: "Recommendation Engine"
    destination: "Cache Repository"
    description: "Reads and writes pre-computed vectors using Redis Protocol."
  - source: "Recommendation Engine"
    destination: "Database Repository"
    description: "Fetches fallback catalog metadata via In-process / HTTPS."
  - source: "Model Ingestion Worker"
    destination: "Database Repository"
    description: "Persists computed recommendation weights via In-process calls."
  - source: "Amazon SQS"
    destination: "Model Ingestion Worker"
    description: "Consumes user interaction events via Polling / HTTPS."