level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Checkout Controller"
    technology: "Express.js"
    description: "Express.js component for request routing, input validation, and rate-limiting."
  - type: "component"
    name: "Order Management Service"
    technology: "Node.js / TypeScript"
    description: "Domain logic component for cart processing, order state transitions, and multi-currency pricing."
  - type: "component"
    name: "Transaction Coordinator"
    technology: "Prisma ORM"
    description: "Prisma ORM-backed component managing ACID database transactions."
  - type: "component"
    name: "Idempotency Manager"
    technology: "Amazon ElastiCache (Redis)"
    description: "Redis-backed component deduplicating checkout requests to prevent double-charging."
  - type: "component"
    name: "Integration Facade"
    technology: "Opossum"
    description: "Opossum-protected component handling external HTTPS integrations."
  - type: "component"
    name: "Event Publisher"
    technology: "AWS SDK for JavaScript v3"
    description: "AWS SDK v3 component for asynchronous messaging."
relationships:
  - source: "Checkout Controller"
    destination: "Order Management Service"
    description: "Direct TypeScript function calls [In-Memory]"
  - source: "Order Management Service"
    destination: "Transaction Coordinator"
    description: "Direct TypeScript function calls [In-Memory]"
  - source: "Transaction Coordinator"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists transactions and orders [PostgreSQL Protocol over TCP]"
  - source: "Checkout Controller"
    destination: "Idempotency Manager"
    description: "Validates request tokens [Redis Protocol over TCP]"
  - source: "Integration Facade"
    destination: "Payment Gateway"
    description: "Processes external workflows [HTTPS REST APIs & webhooks]"
  - source: "Integration Facade"
    destination: "Shipping Provider APIs"
    description: "Processes external workflows [HTTPS REST APIs & webhooks]"
  - source: "Integration Facade"
    destination: "Tax Calculation Service"
    description: "Processes external workflows [HTTPS REST APIs & webhooks]"
  - source: "Integration Facade"
    destination: "Email/Notification Service"
    description: "Processes external workflows [HTTPS REST APIs & webhooks]"
  - source: "Event Publisher"
    destination: "Amazon SNS/SQS"
    description: "Publishes domain events [AWS SDK v3 over AWS VPC Endpoints]"