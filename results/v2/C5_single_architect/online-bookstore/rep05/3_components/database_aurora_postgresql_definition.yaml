level: component
scope: "Component diagram for the Database (Aurora PostgreSQL) container"
parentContainer:
  name: "Database (Aurora PostgreSQL)"
elements:
  - type: "component"
    name: "Order Schema"
    technology: "Amazon Aurora PostgreSQL"
    description: "Manages ACID-compliant transactions, cart states, and immutable order history."
  - type: "component"
    name: "Catalog & Inventory Schema"
    technology: "Amazon Aurora PostgreSQL"
    description: "Handles book metadata, multi-currency pricing (USD, EUR, GBP), and stock levels."
  - type: "component"
    name: "Customer & Review Schema"
    technology: "Amazon Aurora PostgreSQL with Row-Level Security"
    description: "Stores user profiles and 5-star ratings with Row-Level Security for GDPR and CCPA compliance."
relationships:
  - source: "Order & Checkout Service"
    destination: "Order Schema"
    description: "Persists transactional order data via PostgreSQL Protocol."
  - source: "Catalog Service"
    destination: "Catalog & Inventory Schema"
    description: "Reads/writes book and pricing data via PostgreSQL Protocol."
  - source: "Recommendation Service"
    destination: "Catalog & Inventory Schema"
    description: "Queries metadata and order history via PostgreSQL Protocol."