level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing & Dispatcher"
    technology: "Amazon API Gateway HTTP APIs (v2) & AWS VPC Links"
    description: "Manages client traffic routing, ingress, and dispatches proxied requests to downstream microservices."
  - type: "component"
    name: "JWT Auth Filter"
    technology: "AWS Lambda Authorizers"
    description: "Performs custom security validation logic and JWT verification at the edge."
  - type: "component"
    name: "Rate Limiting & Throttling"
    technology: "Amazon API Gateway HTTP APIs"
    description: "Controls traffic rates and throttles incoming requests to protect backend services."
  - type: "component"
    name: "Request/Response Transformation"
    technology: "Amazon API Gateway HTTP APIs"
    description: "Sanitizes and transforms request and response payloads."
  - type: "component"
    name: "API Analytics & Logging"
    technology: "Amazon CloudWatch"
    description: "Captures and publishes real-time request metrics, latency percentiles, and access logs."
relationships:
  - source: "Routing & Dispatcher"
    destination: "Catalog Service"
    description: "Routes proxied requests [gRPC / HTTPS via AWS VPC Links]"
  - source: "Routing & Dispatcher"
    destination: "Order & Checkout Service"
    description: "Routes proxied requests [gRPC / HTTPS via AWS VPC Links]"
  - source: "Routing & Dispatcher"
    destination: "Recommendation Service"
    description: "Routes proxied requests [gRPC / HTTPS via AWS VPC Links]"
  - source: "Routing & Dispatcher"
    destination: "Customer & Review Service"
    description: "Routes proxied requests [gRPC / HTTPS via AWS VPC Links]"
  - source: "JWT Auth Filter"
    destination: "Identity Provider / SSO Service"
    description: "Validates user tokens [HTTPS / OIDC]"
  - source: "API Analytics & Logging"
    destination: "Amazon CloudWatch"
    description: "Publishes access logs and metrics [AWS SDK / HTTPS]"