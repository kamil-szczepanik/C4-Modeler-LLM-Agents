level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "Recommendation API Controller"
    technology: "Python FastAPI"
    description: "Handles incoming API requests for book suggestions."
  - type: "component"
    name: "Recommendation Engine Core"
    technology: "Python"
    description: "Provides high-performance book suggestions."
  - type: "component"
    name: "Cache Repository"
    technology: "Python, redis-py"
    description: "Manages in-memory caching and data lookup."
  - type: "component"
    name: "Event Consumer"
    technology: "Python, Celery / SQS Worker"
    description: "Pulls order completion events and invalidates or updates the cache."
  - type: "component"
    name: "Async Model Updater"
    technology: "Python, Celery Worker"
    description: "Performs bulk updates of pre-computed results."
  - type: "component"
    name: "API Gateway"
    technology: "External"
    description: "Routes requests to the Recommendation API Controller."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "External"
    description: "In-memory caching for sub-2-second page load performance."
  - type: "component"
    name: "Amazon SQS"
    technology: "External"
    description: "Asynchronous messaging queue for order completion events."
relationships:
  - source: "API Gateway"
    destination: "Recommendation API Controller"
    description: "Routes requests [gRPC over HTTP/2]"
  - source: "Recommendation API Controller"
    destination: "Recommendation Engine Core"
    description: "In-process function calls"
  - source: "Recommendation Engine Core"
    destination: "Cache Repository"
    description: "Data lookup [TCP / Redis protocol]"
  - source: "Amazon SQS"
    destination: "Event Consumer"
    description: "Pulls order completion events [HTTPS / SQS SDK]"
  - source: "Event Consumer"
    destination: "Cache Repository"
    description: "Invalidates and updates cache [TCP / Redis protocol]"
  - source: "Async Model Updater"
    destination: "Cache Repository"
    description: "Bulk updates pre-computed results [TCP / Redis protocol]"