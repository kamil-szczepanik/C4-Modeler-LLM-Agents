level: component
scope: "Component diagram for the Customer & Review Service container"
parentContainer:
  name: "Customer & Review Service"
elements:
  - type: "component"
    name: "Review Management Component"
    technology: "Node.js, Express/NestJS"
    description: "Manages 5-star reviews, publishes review events, and handles review operations."
  - type: "component"
    name: "Customer Profile Component"
    technology: "Node.js, Express/NestJS"
    description: "Manages user profiles and triggers compliance cascades."
  - type: "component"
    name: "Review Moderation Component"
    technology: "Node.js, Express/NestJS"
    description: "Handles review moderation workflows and consumes moderation failure events."
  - type: "component"
    name: "Data Privacy / Compliance Component"
    technology: "Node.js, Express/NestJS"
    description: "Enforces regulatory standards like GDPR and CCPA through compliance cascades."
  - type: "component"
    name: "MongoDB Atlas"
    technology: "MongoDB Atlas, Mongoose ODM"
    description: "Offers flexible, semi-structured document storage for reviews and user profiles."
  - type: "component"
    name: "Amazon SNS & SQS"
    technology: "Amazon SNS & SQS"
    description: "Manages decoupled, asynchronous event-driven messaging for scalability."
relationships:
  - source: "Review Management Component"
    destination: "MongoDB Atlas"
    description: "Persists documents [TLS / MongoDB Protocol]"
  - source: "Customer Profile Component"
    destination: "MongoDB Atlas"
    description: "Persists documents [TLS / MongoDB Protocol]"
  - source: "Review Management Component"
    destination: "Amazon SNS"
    description: "Publishes review events [HTTPS / MQTT]"
  - source: "Review Management Component"
    destination: "Amazon SQS"
    description: "Consumes moderation failure events [HTTPS]"
  - source: "Customer Profile Component"
    destination: "Data Privacy / Compliance Component"
    description: "Triggers compliance cascades [Internal Function Calls]"