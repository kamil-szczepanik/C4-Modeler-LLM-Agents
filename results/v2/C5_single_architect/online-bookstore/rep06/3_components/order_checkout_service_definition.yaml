level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Checkout Controller"
    technology: "Spring Boot"
    description: "Handles secure checkout requests and entry points."
  - type: "component"
    name: "Order Management Service"
    technology: "Spring Boot"
    description: "Manages order orchestration, domain logic, and publishes asynchronous events."
  - type: "component"
    name: "Payment Coordinator"
    technology: "Spring Boot"
    description: "Coordinates payment processing with external gateways using idempotency keys."
  - type: "component"
    name: "Fulfillment Adapter"
    technology: "Spring Boot Adapter"
    description: "Integrates with external shipping provider APIs for fulfillment."
  - type: "component"
    name: "Order Repository"
    technology: "Spring Data JPA"
    description: "Persists order data to Amazon Aurora PostgreSQL ensuring ACID compliance."
  - type: "component"
    name: "Cart Domain Component"
    technology: "Spring Boot"
    description: "Encapsulates shopping cart logic and domain state."
relationships:
  - source: "Checkout Controller"
    destination: "Order Management Service"
    description: "In-memory Java method calls"
  - source: "Payment Coordinator"
    destination: "Payment Gateway"
    description: "Processes payments with idempotency keys [HTTPS / REST]"
  - source: "Fulfillment Adapter"
    destination: "Shipping Provider APIs"
    description: "Arranges shipping and fulfillment [HTTPS / REST]"
  - source: "Order Management Service"
    destination: "Amazon SNS / Messaging & Workers"
    description: "Publishes asynchronous events [Async / JSON]"
  - source: "Order Repository"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists order data [TCP / PostgreSQL protocol]"