level: component
scope: "Component diagram for the Messaging & Workers container"
parentContainer:
  name: "Messaging & Workers"
elements:
  - type: "component"
    name: "Event Publisher Component"
    technology: "AWS SNS (Simple Notification Service)"
    description: "Publishes domain events and enables scalable pub/sub fan-out messaging."
  - type: "component"
    name: "Task Queue Coordinator"
    technology: "Amazon SQS (Simple Queue Service)"
    description: "Provides robust message buffering and decoupling."
  - type: "component"
    name: "Background Worker Pool"
    technology: "AWS ECS Fargate tasks running Python/Celery"
    description: "Delivers serverless execution for long-running asynchronous tasks and third-party shipping integrations."
  - type: "component"
    name: "Dead Letter Queue (DLQ)"
    technology: "Amazon SQS DLQ"
    description: "Ensures fault tolerance by capturing poison pills and failed requests."
relationships:
  - source: "Order & Checkout Service"
    destination: "Event Publisher Component"
    description: "Publishes domain events [HTTPS / SNS API]"
  - source: "Event Publisher Component"
    destination: "Task Queue Coordinator"
    description: "Forwards events to queues [SNS-to-SQS subscription]"
  - source: "Task Queue Coordinator"
    destination: "Background Worker Pool"
    description: "Polls and processes tasks [Long-polling / SQS API]"
  - source: "Background Worker Pool"
    destination: "Dead Letter Queue (DLQ)"
    description: "Offloads failed messages after max retries [SQS API]"