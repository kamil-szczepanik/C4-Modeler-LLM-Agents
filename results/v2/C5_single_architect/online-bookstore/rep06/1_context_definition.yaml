level: context
scope: "System Context diagram for Online Bookstore"
system:
  name: "Online Bookstore Software System"
  description: "A scaled-down Amazon-style e-commerce platform for purchasing physical and electronic books with integrated reviews and recommendations, providing global catalogue browsing, secure multi-currency checkout, and fulfillment tracking for 1M MAU across AWS regions."
elements:
  - type: "person"
    name: "Customer"
    description: "End-user browsing books, managing cart, and submitting reviews."
  - type: "person"
    name: "Admin / Support Staff"
    description: "Back-office users managing catalogue and fulfillment."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe/PayPal processing secure checkouts via REST/TLS."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "FedEx/UPS managing order fulfillment tracking via REST/JSON."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "Avalara handling multi-region tax compliance (USD, EUR, GBP)."
  - type: "externalSystem"
    name: "Identity Provider / SSO Service"
    description: "Auth0 or AWS Cognito managing customer identity and sessions via OAuth2/OIDC."
relationships:
  - source: "Customer"
    destination: "Online Bookstore Software System"
    description: "Interacts for browsing, cart management, and reviews"
    technology: "HTTPS (Web/Mobile App)"
  - source: "Admin / Support Staff"
    destination: "Online Bookstore Software System"
    description: "Interacts for back-office management"
    technology: "HTTPS"
  - source: "Online Bookstore Software System"
    destination: "Payment Gateway"
    description: "Processes secure checkout"
    technology: "REST/TLS"
  - source: "Online Bookstore Software System"
    destination: "Shipping Provider APIs"
    description: "Manages order fulfillment tracking"
    technology: "REST/JSON"
  - source: "Online Bookstore Software System"
    destination: "Tax Calculation Service"
    description: "Handles multi-region tax compliance"
    technology: "REST/TLS"
  - source: "Online Bookstore Software System"
    destination: "Identity Provider / SSO Service"
    description: "Manages authentication and sessions"
    technology: "OAuth2/OIDC over TLS"