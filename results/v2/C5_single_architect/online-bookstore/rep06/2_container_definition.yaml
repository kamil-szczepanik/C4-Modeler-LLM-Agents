level: container
scope: "Container diagram for Online Bookstore Software System"
system:
  name: "Online Bookstore Software System"
elements:
  - type: "person"
    name: "Customer & Admin/Support Staff"
    description: "End users browsing books, managing cart, submitting reviews, and operators managing the system."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system processing secure checkouts."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "External system managing order fulfillment and tracking."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "External system handling tax compliance."
  - type: "externalSystem"
    name: "Identity Provider / SSO"
    description: "External system managing customer identity and authentication."
  - type: "container"
    name: "Single Page Application (SPA)"
    technology: "React, Amazon S3, Amazon CloudFront"
    description: "Frontend user interface hosted on S3 and distributed via CloudFront."
  - type: "container"
    name: "API Gateway"
    technology: "Amazon API Gateway"
    description: "Manages REST/GraphQL routing and JWT security."
  - type: "container"
    name: "Catalog Service"
    technology: "Go, Amazon Aurora PostgreSQL"
    description: "Microservice managing book catalog data."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Spring Boot, Amazon Aurora PostgreSQL"
    description: "Microservice managing orders and checkout processing."
  - type: "container"
    name: "Recommendation Service"
    technology: "Python FastAPI, Amazon ElastiCache (Redis)"
    description: "Microservice providing book recommendations and caching."
  - type: "container"
    name: "Customer & Review Service"
    technology: "Node.js, MongoDB"
    description: "Microservice managing customer profiles and reviews."
  - type: "container"
    name: "Messaging & Workers"
    technology: "Amazon SQS, Amazon SNS"
    description: "Asynchronous event-driven decoupling for reliable processing."
relationships:
  - source: "Customer & Admin/Support Staff"
    destination: "Single Page Application (SPA)"
    description: "Browses, manages cart, and interacts with the store"
    technology: "HTTPS / HTML / JS"
  - source: "Single Page Application (SPA)"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS / JSON (JWT authenticated)"
  - source: "API Gateway"
    destination: "Catalog Service"
    description: "Routes catalog requests"
    technology: "gRPC / HTTPS"
  - source: "API Gateway"
    destination: "Order & Checkout Service"
    description: "Routes order and checkout requests"
    technology: "gRPC / HTTPS"
  - source: "API Gateway"
    destination: "Recommendation Service"
    description: "Routes recommendation requests"
    technology: "gRPC / HTTPS"
  - source: "API Gateway"
    destination: "Customer & Review Service"
    description: "Routes customer and review requests"
    technology: "gRPC / HTTPS"
  - source: "Order & Checkout Service"
    destination: "Payment Gateway"
    description: "Processes payments"
    technology: "HTTPS / REST"
  - source: "Order & Checkout Service"
    destination: "Shipping Provider APIs"
    description: "Arranges shipping and fulfillment"
    technology: "HTTPS / REST"
  - source: "Order & Checkout Service"
    destination: "Messaging & Workers"
    description: "Publishes asynchronous events"
    technology: "Async / JSON"
  - source: "Catalog Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists catalog data"
    technology: "TCP / PostgreSQL protocol"
  - source: "Order & Checkout Service"
    destination: "Amazon Aurora PostgreSQL"
    description: "Persists order data"
    technology: "TCP / PostgreSQL protocol"
  - source: "Recommendation Service"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches and retrieves recommendation data"
    technology: "TCP / Redis protocol"
  - source: "Customer & Review Service"
    destination: "MongoDB"
    description: "Persists customer review data"
    technology: "TCP / MongoDB protocol"