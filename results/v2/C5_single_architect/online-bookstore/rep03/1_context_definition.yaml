level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "A scaled-down Amazon-style e-commerce platform designed for purchasing physical and electronic books with recommendations, reviews, multi-currency support, and global retail capabilities."
elements:
  - type: "person"
    name: "Customer"
    description: "End-user browsing catalogues, purchasing items, and leaving reviews."
  - type: "person"
    name: "Administrator"
    description: "Manages inventory, pricing, and content moderation."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Stripe or PayPal for secure checkout and multi-currency transactions."
  - type: "externalSystem"
    name: "Shipping Provider APIs"
    description: "Third-party logistics for fulfillment tracking."
  - type: "externalSystem"
    name: "Email Service"
    description: "Sendgrid or AWS SES for transactional notifications."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "Auth0 or AWS Cognito for authentication and compliance."
  - type: "externalSystem"
    name: "Tax Calculation Service"
    description: "Avalara or TaxJar for regional tax calculations."
relationships:
  - source: "Customer"
    destination: "Online Bookstore System"
    description: "Browses catalogues, purchases items, and leaves reviews"
    technology: "HTTPS"
  - source: "Administrator"
    destination: "Online Bookstore System"
    description: "Manages inventory, pricing, and content moderation"
    technology: "HTTPS"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "Processes secure checkout and multi-currency transactions"
    technology: "REST/TLS"
  - source: "Online Bookstore System"
    destination: "Shipping Provider APIs"
    description: "Handles fulfillment tracking"
    technology: "REST/JSON"
  - source: "Online Bookstore System"
    destination: "Identity Provider"
    description: "Performs user authentication and identity management"
    technology: "OIDC/OAuth2/HTTPS"
  - source: "Online Bookstore System"
    destination: "Tax Calculation Service"
    description: "Computes dynamic regional taxes"
    technology: "REST/TLS"
  - source: "Online Bookstore System"
    destination: "Email Service"
    description: "Sends transactional notifications"
    technology: "REST/HTTPS"