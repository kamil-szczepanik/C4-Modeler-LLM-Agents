level: component
scope: "Component diagram for the Amazon OpenSearch container"
parentContainer:
  name: "Amazon OpenSearch"
elements:
  - type: "component"
    name: "Catalog Search Index"
    technology: "Amazon OpenSearch Managed Index"
    description: "Stores and indexes book catalog data for fast retrieval and full-text search."
  - type: "component"
    name: "OpenSearch REST API Engine"
    technology: "OpenSearch REST API"
    description: "Handles incoming search and synchronization queries from the Catalog Service."
  - type: "component"
    name: "Index Management & Ingestion Service"
    technology: "OpenSearch Ingestion Service"
    description: "Manages data ingestion pipelines and index lifecycles."
  - type: "component"
    name: "Search Analytics & Suggestions Engine"
    technology: "OpenSearch Analytics Engine"
    description: "Powers search auto-complete suggestions and search analytics for the platform."
relationships:
  - source: "OpenSearch REST API Engine"
    destination: "Catalog Search Index"
    description: "Queries and synchronizes product data"
  - source: "Search Analytics & Suggestions Engine"
    destination: "Catalog Search Index"
    description: "Fetches indexing data for auto-complete suggestions"