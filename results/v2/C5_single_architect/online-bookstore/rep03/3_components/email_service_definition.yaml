level: component
scope: "Component diagram for the Email Service container"
parentContainer:
  name: "Email Service"
elements:
  - type: "component"
    name: "Email API Controller"
    technology: "NestJS"
    description: "NestJS controller for synchronous REST triggers."
  - type: "component"
    name: "Event Consumer"
    technology: "Node.js"
    description: "Background worker consuming asynchronous domain events."
  - type: "component"
    name: "Template Engine"
    technology: "Handlebars or EJS"
    description: "Component utilizing Handlebars or EJS for rendering localized email bodies."
  - type: "component"
    name: "Notification Preference Manager"
    technology: "Node.js"
    description: "Component checking user communication opt-outs."
  - type: "component"
    name: "Email Dispatcher"
    technology: "Node.js"
    description: "Service integrating with external email providers."
  - type: "component"
    name: "Email Audit Logger"
    technology: "TypeORM / Node.js"
    description: "Component recording delivery metadata."
  - type: "component"
    name: "API Gateway"
    technology: "AWS API Gateway"
    description: "Routes email notification triggers."
  - type: "component"
    name: "Amazon SQS"
    technology: "Amazon SQS"
    description: "Delivers asynchronous events."
  - type: "component"
    name: "AWS SES / SMTP"
    technology: "AWS SES / SMTP"
    description: "Delivers final emails."
  - type: "component"
    name: "Amazon RDS (PostgreSQL)"
    technology: "PostgreSQL"
    description: "Stores audit metadata."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "Queries opt-out preferences."
relationships:
  - source: "API Gateway"
    destination: "Email API Controller"
    description: "Routes email notification triggers [HTTP]."
  - source: "Amazon SQS"
    destination: "Event Consumer"
    description: "Delivers asynchronous events [SQS]."
  - source: "Event Consumer"
    destination: "Notification Preference Manager"
    description: "Validates user consent [In-memory]."
  - source: "Email API Controller"
    destination: "Notification Preference Manager"
    description: "Validates user consent [In-memory]."
  - source: "Event Consumer"
    destination: "Template Engine"
    description: "Renders messages [In-memory]."
  - source: "Email API Controller"
    destination: "Template Engine"
    description: "Renders messages [In-memory]."
  - source: "Template Engine"
    destination: "Email Dispatcher"
    description: "Sends rendered payloads [In-memory]."
  - source: "Email Dispatcher"
    destination: "AWS SES / SMTP"
    description: "Delivers final emails [HTTPS / SMTP]."
  - source: "Email Dispatcher"
    destination: "Email Audit Logger"
    description: "Persists delivery logs [TypeORM]."
  - source: "Email Audit Logger"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Stores audit metadata [SQL]."
  - source: "Notification Preference Manager"
    destination: "Amazon DynamoDB"
    description: "Queries opt-out preferences [NoSQL]."