level: component
scope: "Component diagram for the Amazon ElastiCache (Redis) container"
parentContainer:
  name: "Amazon ElastiCache (Redis)"
elements:
  - type: "component"
    name: "SessionStore"
    technology: "Redis"
    description: "Stores user session data for the Order & Checkout Service."
  - type: "component"
    name: "RecommendationCache"
    technology: "Redis"
    description: "Caches recommendation data for the Recommendation Service."
  - type: "component"
    name: "CatalogCache"
    technology: "Redis"
    description: "Caches catalog data for the Catalog Service."
relationships:
  - source: "Order & Checkout Service"
    destination: "SessionStore"
    description: "Reads and writes session data [Redis Protocol / TCP]"
  - source: "Catalog Service"
    destination: "CatalogCache"
    description: "Reads and writes catalog cache [Redis Protocol / TCP]"
  - source: "Recommendation Service"
    destination: "RecommendationCache"
    description: "Reads and writes recommendation cache [Redis Protocol / TCP]"