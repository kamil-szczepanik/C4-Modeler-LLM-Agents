level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "CheckoutController"
    technology: "NestJS Controller"
    description: "Entry point handling API requests, workflow orchestration, and request idempotency."
  - type: "component"
    name: "CheckoutFacade"
    technology: "NestJS Facade"
    description: "Handles workflow orchestration."
  - type: "component"
    name: "IdempotencyGuard"
    technology: "NestJS Interceptor / Redis"
    description: "Interceptor leveraging Redis to prevent double-charging on retries."
  - type: "component"
    name: "OrderManager"
    technology: "NestJS Service"
    description: "Manages the order state machine and transactional database persistence."
  - type: "component"
    name: "PaymentClient"
    technology: "NestJS Client / Circuit Breaker"
    description: "Integrates securely with external payment gateways using circuit breakers."
  - type: "component"
    name: "FulfillmentClient"
    technology: "NestJS Client"
    description: "Coordinates third-party shipping provider APIs and regional tax calculations."
  - type: "component"
    name: "EventPublisher"
    technology: "NestJS Event Publisher"
    description: "Publishes asynchronous domain events for downstream processing."
  - type: "component"
    name: "Amazon RDS (PostgreSQL)"
    technology: "PostgreSQL"
    description: "Relational database utilizing SERIALIZABLE isolation for ACID order consistency."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Redis"
    description: "In-memory data store for high-performance idempotency locking."
  - type: "component"
    name: "AWS EventBridge & SQS"
    technology: "AWS EventBridge"
    description: "Event bus for reliable, asynchronous message delivery."
  - type: "component"
    name: "Payment Gateway"
    technology: "HTTPS / REST"
    description: "External service that processes secure charges."
  - type: "component"
    name: "Shipping Provider & Tax API"
    technology: "HTTPS / REST"
    description: "External services coordinating shipping and tax."
relationships:
  - source: "CheckoutController"
    destination: "OrderManager"
    description: "In-process TypeScript method calls"
  - source: "OrderManager"
    destination: "PaymentClient"
    description: "In-process coordination"
  - source: "OrderManager"
    destination: "FulfillmentClient"
    description: "In-process coordination"
  - source: "EventPublisher"
    destination: "AWS EventBridge & SQS"
    description: "Publishes OrderPlaced events [AWS SDK / HTTPS]"
  - source: "OrderManager"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Persists transactional state [PostgreSQL Protocol]"
  - source: "PaymentClient"
    destination: "Payment Gateway"
    description: "Processes secure charges [HTTPS / REST]"
  - source: "FulfillmentClient"
    destination: "Shipping Provider & Tax API"
    description: "Coordinates shipping and tax [HTTPS / REST]"
  - source: "IdempotencyGuard"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches request keys for deduplication [Redis Protocol]"