level: component
scope: "Component diagram for the Amazon DynamoDB container"
parentContainer:
  name: "Amazon DynamoDB"
elements:
  - type: "component"
    name: "Request Router"
    technology: "AWS DynamoDB Internal"
    description: "Routes incoming requests to the appropriate partition nodes."
  - type: "component"
    name: "Partition Router"
    technology: "AWS DynamoDB Internal"
    description: "Determines which partition stores the requested data based on primary keys."
  - type: "component"
    name: "Storage Node"
    technology: "AWS DynamoDB Internal"
    description: "Persists the actual data items on solid-state storage."
  - type: "component"
    name: "Replication Manager"
    technology: "AWS DynamoDB Internal"
    description: "Manages data replication across multiple availability zones for durability and high availability."
  - type: "component"
    name: "Streams Processor"
    technology: "AWS DynamoDB Streams"
    description: "Captures time-ordered sequence of item-level changes in tables."
  - type: "component"
    name: "Global Secondary Index (GSI) Manager"
    technology: "AWS DynamoDB GSI"
    description: "Manages indexes that allow querying data using an alternate partition and sort key, such as book reviews and ratings sorted by date or score."
relationships:
  - source: "Catalog Service"
    destination: "Request Router"
    description: "Sends read and write requests for customer reviews and ratings [DynamoDB API]"
  - source: "Catalog Service"
    destination: "Global Secondary Index (GSI) Manager"
    description: "Queries book reviews and ratings sorted by date or score [DynamoDB API]"