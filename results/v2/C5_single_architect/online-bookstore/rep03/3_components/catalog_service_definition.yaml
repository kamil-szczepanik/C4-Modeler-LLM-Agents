level: component
scope: "Component diagram for the Catalog Service container"
parentContainer:
  name: "Catalog Service"
elements:
  - type: "component"
    name: "CatalogController"
    technology: "NestJS Controller"
    description: "Exposes RESTful endpoints for browsing, search, and reviews."
  - type: "component"
    name: "SearchService"
    technology: "NestJS Service"
    description: "Encapsulates query logic for high-performance keyword searches."
  - type: "component"
    name: "ReviewService"
    technology: "NestJS Service"
    description: "Manages business logic for customer reviews and 5-star ratings."
  - type: "component"
    name: "CacheManager"
    technology: "NestJS Service"
    description: "Handles caching of hot catalog data to reduce database load."
  - type: "component"
    name: "CatalogRepository"
    technology: "NestJS Repository"
    description: "Handles core book metadata persistence."
  - type: "component"
    name: "Amazon OpenSearch"
    technology: "Search Engine"
    description: "External system providing keyword search indexing."
  - type: "component"
    name: "Amazon DynamoDB"
    technology: "NoSQL Database"
    description: "NoSQL database for customer reviews and ratings."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "In-memory Cache"
    description: "In-memory cache for frequently accessed book details and search results."
relationships:
  - source: "CatalogController"
    destination: "SearchService"
    description: "In-process method calls [TypeScript]"
  - source: "CatalogController"
    destination: "ReviewService"
    description: "In-process method calls [TypeScript]"
  - source: "CatalogController"
    destination: "CacheManager"
    description: "In-process method calls [TypeScript]"
  - source: "SearchService"
    destination: "Amazon OpenSearch"
    description: "Performs keyword search [HTTPS / REST]"
  - source: "ReviewService"
    destination: "Amazon DynamoDB"
    description: "Reads and writes reviews [TCP / DynamoDB API]"
  - source: "CacheManager"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches hot catalog data [TCP / Redis Protocol]"