level: component
scope: "Component diagram for the Single-Page App (SPA) container"
parentContainer:
  name: "Single-Page App (SPA)"
elements:
  - type: "component"
    name: "Router & View Controller"
    technology: "React Router"
    description: "Manages client-side routing, view rendering, and navigation across different pages of the bookstore."
  - type: "component"
    name: "Global State Store"
    technology: "Redux Toolkit"
    description: "Manages global application state, user sessions, shopping cart data, and caching for fast rendering."
  - type: "component"
    name: "API Client Service"
    technology: "Axios / Fetch API"
    description: "Handles HTTP requests and communication with the backend API Gateway."
relationships:
  - source: "Router & View Controller"
    destination: "Global State Store"
    description: "Reads and updates application state"
  - source: "Router & View Controller"
    destination: "API Client Service"
    description: "Triggers API calls on user interaction"
  - source: "API Client Service"
    destination: "Global State Store"
    description: "Stores fetched data"