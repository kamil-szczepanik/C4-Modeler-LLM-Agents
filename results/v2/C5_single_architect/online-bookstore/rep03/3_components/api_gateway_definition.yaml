level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing & Dispatcher Component"
    technology: "AWS API Gateway Routing"
    description: "Dispatches sanitized payloads to downstream services."
  - type: "component"
    name: "Authentication & Authorization Component"
    technology: "AWS API Gateway Auth"
    description: "Validates tokens and forwards identity context."
  - type: "component"
    name: "Rate Limiting & Throttling Component"
    technology: "AWS API Gateway Throttling"
    description: "Manages edge rate-limiting."
  - type: "component"
    name: "Request Transformation & Validation Component"
    technology: "AWS API Gateway Validation"
    description: "Validates and transforms incoming requests."
relationships:
  - source: "Authentication & Authorization Component"
    destination: "Request Transformation & Validation Component"
    description: "Forwards identity context [Internal]"
  - source: "Request Transformation & Validation Component"
    destination: "Routing & Dispatcher Component"
    description: "Dispatches sanitized payloads [Internal]"