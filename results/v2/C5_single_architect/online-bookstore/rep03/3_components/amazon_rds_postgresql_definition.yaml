level: component
scope: "Component diagram for the Amazon RDS (PostgreSQL) container"
parentContainer:
  name: "Amazon RDS (PostgreSQL)"
elements:
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer / RDS Proxy"
    description: "Manages and pools database connections to mitigate exhaustion under high concurrency."
  - type: "component"
    name: "Relational Schema"
    technology: "PostgreSQL"
    description: "ACID-compliant relational data storage for core transactional data."
  - type: "component"
    name: "Read Replica"
    technology: "PostgreSQL Read Replica"
    description: "Handles read-heavy workloads through asynchronous replication."
  - type: "component"
    name: "Audit Component"
    technology: "pgAudit"
    description: "Provides detailed session and object audit logging for GDPR/CCPA compliance."
  - type: "component"
    name: "PITR Component"
    technology: "AWS Automated Backups"
    description: "Enables Point-In-Time Recovery for data protection and disaster recovery."
relationships:
  - source: "Connection Pooler"
    destination: "Relational Schema"
    description: "TCP Local / Unix Domain Sockets"
  - source: "Relational Schema"
    destination: "Read Replica"
    description: "Asynchronous replication"