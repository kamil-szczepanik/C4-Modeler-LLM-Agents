level: component
scope: "Component diagram for the AWS EventBridge & SQS container"
parentContainer:
  name: "AWS EventBridge & SQS"
elements:
  - type: "component"
    name: "AWS EventBridge Event Bus"
    technology: "AWS EventBridge"
    description: "Publishes and routes domain events based on pattern rules."
  - type: "component"
    name: "Amazon SQS Queues"
    technology: "Amazon SQS"
    description: "Queues messages routed from EventBridge for asynchronous processing."
  - type: "component"
    name: "SQS Dead Letter Queues (DLQs)"
    technology: "Amazon SQS DLQ"
    description: "Captures failed messages for error handling and debugging."
relationships:
  - source: "AWS EventBridge Event Bus"
    destination: "Amazon SQS Queues"
    description: "Routes messages based on pattern rules [SQS Queue Policy / AWS internal API]"
  - source: "Amazon SQS Queues"
    destination: "SQS Dead Letter Queues (DLQs)"
    description: "Forwards failed messages after max receive count is exceeded"