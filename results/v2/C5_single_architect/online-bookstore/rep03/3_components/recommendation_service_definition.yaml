level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "Recommendation Controller"
    technology: "NestJS REST Controller"
    description: "Serves real-time recommendations to maintain high performance under scale."
  - type: "component"
    name: "Event Consumer Worker"
    technology: "NestJS Background Service"
    description: "Processes asynchronous order events."
  - type: "component"
    name: "Recommendation Engine Core"
    technology: "TypeScript Domain Service"
    description: "Generates personalized 'Customers also bought' suggestions."
  - type: "component"
    name: "Model Cache Manager"
    technology: "NestJS Provider"
    description: "Manages precomputed cache for low-latency lookups."
  - type: "component"
    name: "Data Access Repository"
    technology: "NestJS Provider"
    description: "Handles data access operations."
  - type: "component"
    name: "Amazon ElastiCache (Redis)"
    technology: "Redis Protocol"
    description: "Enables low-latency caching to meet sub-2s page load constraints."
  - type: "component"
    name: "Amazon OpenSearch"
    technology: "HTTPS/REST"
    description: "Powers fast vector and catalog lookups for recommendations."
  - type: "component"
    name: "API Gateway"
    technology: "API Gateway"
    description: "Routes inbound requests."
  - type: "component"
    name: "SQS"
    technology: "AWS SQS"
    description: "Delivers asynchronous domain events."
relationships:
  - source: "API Gateway"
    destination: "Recommendation Controller"
    description: "Routes inbound requests [HTTP/REST]"
  - source: "SQS"
    destination: "Event Consumer Worker"
    description: "Consumes asynchronous domain events [SQS/Polling]"
  - source: "Recommendation Engine Core"
    destination: "Model Cache Manager"
    description: "Checks precomputed cache [Function Call]"
  - source: "Model Cache Manager"
    destination: "Amazon ElastiCache (Redis)"
    description: "Reads/writes cached payloads [Redis Protocol]"
  - source: "Recommendation Engine Core"
    destination: "Amazon OpenSearch"
    description: "Queries product metadata and vectors [HTTPS/REST]"