level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Customer"
    description: "External actor interacting via web browsers to browse, purchase physical and electronic books, view ratings, and receive recommendations."
  - type: "person"
    name: "Administrator"
    description: "External actor interacting via web browsers to manage inventory, pricing, and system administration."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External payment processing service for secure checkout."
  - type: "externalSystem"
    name: "Shipping Provider"
    description: "External shipping provider API for fulfillment tracking."
  - type: "externalSystem"
    name: "Tax API"
    description: "External tax calculation API for regional tax computations."
  - type: "container"
    name: "Single-Page App (SPA)"
    technology: "React, AWS S3, CloudFront"
    description: "Frontend application hosted globally for fast page loads and user interaction."
  - type: "container"
    name: "API Gateway"
    technology: "AWS API Gateway"
    description: "Manages entry points, routing, and rate-limiting for backend communication."
  - type: "container"
    name: "Catalog Service"
    technology: "Node.js, NestJS, Amazon ECS/Fargate"
    description: "Microservice managing book catalog data and keyword search."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Node.js, NestJS, Amazon ECS/Fargate"
    description: "Microservice handling purchases, orders, and publishing events."
  - type: "container"
    name: "Recommendation Service"
    technology: "Node.js, NestJS, Amazon ECS/Fargate"
    description: "Microservice generating personalized book recommendations."
  - type: "container"
    name: "Email Service"
    technology: "Node.js, NestJS, Amazon ECS/Fargate"
    description: "Microservice handling transactional and notification emails."
  - type: "container"
    name: "Amazon RDS (PostgreSQL)"
    technology: "Amazon RDS, PostgreSQL"
    description: "ACID-compliant relational storage for orders and user data."
  - type: "container"
    name: "Amazon OpenSearch"
    technology: "Amazon OpenSearch"
    description: "Dedicated search engine for catalog keyword search."
  - type: "container"
    name: "Amazon DynamoDB"
    technology: "Amazon DynamoDB"
    description: "NoSQL storage for high-throughput customer reviews and ratings."
  - type: "container"
    name: "Amazon ElastiCache (Redis)"
    technology: "Amazon ElastiCache, Redis"
    description: "In-memory caching for sessions and recommendations."
  - type: "container"
    name: "AWS EventBridge & SQS"
    technology: "AWS EventBridge, Amazon SNS/SQS"
    description: "Event-driven decoupling layer for asynchronous microservice communication."
relationships:
  - source: "Customer"
    destination: "Single-Page App (SPA)"
    description: "Browses books, manages cart, and performs checkout"
    technology: "HTTPS / TLS 1.3"
  - source: "Administrator"
    destination: "Single-Page App (SPA)"
    description: "Manages store administration"
    technology: "HTTPS / TLS 1.3"
  - source: "Single-Page App (SPA)"
    destination: "API Gateway"
    description: "Sends frontend-to-backend requests"
    technology: "HTTPS / JSON"
  - source: "API Gateway"
    destination: "Catalog Service"
    description: "Routes catalog requests"
    technology: "HTTP / gRPC"
  - source: "API Gateway"
    destination: "Order & Checkout Service"
    description: "Routes order and checkout requests"
    technology: "HTTP / gRPC"
  - source: "API Gateway"
    destination: "Recommendation Service"
    description: "Routes recommendation requests"
    technology: "HTTP / gRPC"
  - source: "API Gateway"
    destination: "Email Service"
    description: "Routes email notification triggers"
    technology: "HTTP / gRPC"
  - source: "Order & Checkout Service"
    destination: "AWS EventBridge & SQS"
    description: "Publishes OrderPlaced events"
    technology: "AMQP / JSON over HTTPS"
  - source: "AWS EventBridge & SQS"
    destination: "Recommendation Service"
    description: "Delivers asynchronous events via SQS queues"
    technology: "SQS"
  - source: "AWS EventBridge & SQS"
    destination: "Email Service"
    description: "Delivers asynchronous events via SQS queues"
    technology: "SQS"
  - source: "Order & Checkout Service"
    destination: "Amazon RDS (PostgreSQL)"
    description: "Reads and writes order and user data"
    technology: "PostgreSQL Protocol"
  - source: "Catalog Service"
    destination: "Amazon OpenSearch"
    description: "Performs catalog keyword search"
    technology: "REST/HTTP"
  - source: "Catalog Service"
    destination: "Amazon DynamoDB"
    description: "Reads and writes customer reviews and ratings"
    technology: "DynamoDB API"
  - source: "Recommendation Service"
    destination: "Amazon ElastiCache (Redis)"
    description: "Caches and retrieves recommendation data"
    technology: "Redis Protocol"
  - source: "Order & Checkout Service"
    destination: "Payment Gateway"
    description: "Processes payments"
    technology: "HTTPS / REST"
  - source: "Order & Checkout Service"
    destination: "Shipping Provider"
    description: "Coordinates fulfillment tracking"
    technology: "HTTPS / REST"
  - source: "Order & Checkout Service"
    destination: "Tax API"
    description: "Calculates regional taxes"
    technology: "HTTPS / REST"