level: context
scope: "System Context diagram for Online Bookstore System"
system:
  name: "Online Bookstore System"
  description: "Cloud-native e-commerce system built to sell physical and electronic books with recommendations, reviews, and secure global checkout."
elements:
  - type: "person"
    name: "Customer"
    description: "End-user accessing the system via Web Browser or Mobile App."
  - type: "person"
    name: "Store Administrator"
    description: "Internal user managing inventory and pricing via Web Browser."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External Stripe/PayPal system handling secure checkout and multi-currency transactions."
  - type: "externalSystem"
    name: "Third-Party Shipping Provider API"
    description: "External service calculating shipping rates and tracking."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External AWS SES/Twilio system dispatching alerts."
  - type: "externalSystem"
    name: "Identity Provider / OAuth 2.0 Service"
    description: "External Auth0 or AWS Cognito service managing authentication."
  - type: "externalSystem"
    name: "Currency Exchange Rate Service"
    description: "External API fetching daily conversion rates."
relationships:
  - source: "Customer"
    destination: "Online Bookstore System"
    description: "interacts via Web/Mobile for browsing, recommendations, reviews, and checkout"
    technology: "HTTPS/REST"
  - source: "Store Administrator"
    destination: "Online Bookstore System"
    description: "manages inventory and pricing"
    technology: "HTTPS/REST"
  - source: "Online Bookstore System"
    destination: "Payment Gateway"
    description: "handles secure checkout and multi-currency transactions"
    technology: "HTTPS/REST"
  - source: "Online Bookstore System"
    destination: "Third-Party Shipping Provider API"
    description: "calculates shipping rates and tracking"
    technology: "HTTPS/REST"
  - source: "Online Bookstore System"
    destination: "Notification Service"
    description: "dispatches transactional alerts"
    technology: "SMTP/APIs"
  - source: "Online Bookstore System"
    destination: "Identity Provider / OAuth 2.0 Service"
    description: "authenticates users"
    technology: "OIDC/HTTPS"
  - source: "Online Bookstore System"
    destination: "Currency Exchange Rate Service"
    description: "fetches daily conversion rates for USD, EUR, and GBP"
    technology: "HTTPS/REST"