level: container
scope: "Container diagram for Online Bookstore"
system:
  name: "Online Bookstore"
elements:
  - type: "person"
    name: "Customer"
    description: "Primary user purchasing physical and electronic books, reading reviews, and receiving recommendations."
  - type: "person"
    name: "Store Administrator"
    description: "Primary user managing store operations and inventory."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system handling payment processing."
  - type: "externalSystem"
    name: "Third-Party Shipping API"
    description: "External system handling order fulfillment and shipping."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External system dispatching alerts and notifications."
  - type: "externalSystem"
    name: "OAuth 2.0 Identity Provider"
    description: "External system managing authentication and identity."
  - type: "externalSystem"
    name: "Currency Exchange Rate Service"
    description: "External system providing currency conversion rates."
  - type: "container"
    name: "Single Page Application (SPA)"
    technology: "React, TypeScript, Amazon S3, Amazon CloudFront"
    description: "Frontend user interface providing client-side routing, catalog browsing, and user interactions."
  - type: "container"
    name: "API Gateway"
    technology: "Amazon API Gateway"
    description: "Manages routing, SSL termination, and rate limiting for incoming traffic."
  - type: "container"
    name: "Catalog Service"
    technology: "Go, Amazon Aurora, Amazon OpenSearch"
    description: "Manages book catalog data and keyword search functionality."
  - type: "container"
    name: "Order & Checkout Service"
    technology: "Node.js, Amazon Aurora, Amazon ElastiCache"
    description: "Manages shopping carts, orders, and checkout processing."
  - type: "container"
    name: "Recommendation Service"
    technology: "Python, FastAPI, Amazon DocumentDB"
    description: "Generates personalized book recommendations for customers."
  - type: "container"
    name: "Customer Review Service"
    technology: "Node.js, Amazon Aurora"
    description: "Manages customer ratings and reviews for books."
  - type: "container"
    name: "Message Broker"
    technology: "Amazon SQS / SNS"
    description: "Handles asynchronous event publishing and decoupling between internal services."
relationships:
  - source: "Customer"
    destination: "Single Page Application (SPA)"
    description: "Interacts for browsing, recommendations, reviews, and purchases"
    technology: "HTTPS / REST / GraphQL"
  - source: "Store Administrator"
    destination: "Single Page Application (SPA)"
    description: "Manages store administration and catalog"
    technology: "HTTPS / REST / GraphQL"
  - source: "Single Page Application (SPA)"
    destination: "API Gateway"
    description: "Sends client requests for backend operations"
    technology: "HTTPS / JSON"
  - source: "API Gateway"
    destination: "Catalog Service"
    description: "Routes catalog and search requests"
    technology: "HTTPS / REST / gRPC"
  - source: "API Gateway"
    destination: "Order & Checkout Service"
    description: "Routes order and checkout requests"
    technology: "HTTPS / REST / gRPC"
  - source: "API Gateway"
    destination: "Recommendation Service"
    description: "Routes recommendation requests"
    technology: "HTTPS / REST / gRPC"
  - source: "API Gateway"
    destination: "Customer Review Service"
    description: "Routes review requests"
    technology: "HTTPS / REST / gRPC"
  - source: "Order & Checkout Service"
    destination: "Payment Gateway"
    description: "Processes secure payments"
    technology: "HTTPS"
  - source: "Order & Checkout Service"
    destination: "Third-Party Shipping API"
    description: "Coordinates shipment and tracking"
    technology: "HTTPS"
  - source: "Catalog Service"
    destination: "Message Broker"
    description: "Publishes asynchronous catalog events"
    technology: "Amazon SQS / SNS"
  - source: "Order & Checkout Service"
    destination: "Message Broker"
    description: "Publishes asynchronous order events"
    technology: "Amazon SQS / SNS"
  - source: "Customer Review Service"
    destination: "Message Broker"
    description: "Publishes asynchronous review events"
    technology: "Amazon SQS / SNS"