level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Event Topic Router"
    technology: "Amazon SNS"
    description: "Fan-out routing for published events."
  - type: "component"
    name: "Execution Queues"
    technology: "Amazon SQS"
    description: "Holds asynchronous events for consumption by downstream services."
  - type: "component"
    name: "Dead Letter Queue Handler"
    technology: "Amazon SQS DLQ"
    description: "Handles failed messages and execution anomalies."
  - type: "component"
    name: "Event Schema Validator"
    technology: "JSON Schema"
    description: "Validates published payloads from services."
  - type: "component"
    name: "Message Retry & Backoff Controller"
    technology: "SQS Native Attributes"
    description: "Manages redrive policies and retry backoff."
relationships:
  - source: "Event Topic Router"
    destination: "Execution Queues"
    description: "Fan-out routing [AWS SNS to SQS subscription, HTTPS]."
  - source: "Execution Queues"
    destination: "Message Retry & Backoff Controller"
    description: "Manages redrive policies [SQS Native Config]."