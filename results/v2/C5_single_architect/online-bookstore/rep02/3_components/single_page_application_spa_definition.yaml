level: component
scope: "Component diagram for the Single Page Application (SPA) container"
parentContainer:
  name: "Single Page Application (SPA)"
elements:
  - type: "component"
    name: "Router Component"
    technology: "React Router"
    description: "Handles client-side routing and renders views for catalog, checkout, and recommendations."
  - type: "component"
    name: "State Management Component"
    technology: "Zustand/Redux Toolkit"
    description: "Manages in-memory global state to mitigate XSS vulnerabilities."
  - type: "component"
    name: "API Client Component"
    technology: "Axios/Fetch wrapper"
    description: "Sends backend requests via HTTPS/JSON with Accept-Currency headers."
  - type: "component"
    name: "Localization/Currency Component"
    technology: "React-i18next & Intl API"
    description: "Formats prices locally and provides client-side internationalization."
  - type: "component"
    name: "Catalog & Search UI Component"
    technology: "React & TypeScript"
    description: "Enables seamless catalog browsing and search."
  - type: "component"
    name: "Checkout & Cart UI Component"
    technology: "React & TypeScript"
    description: "Handles secure checkout and cart operations."
  - type: "component"
    name: "Recommendations & Reviews UI Component"
    technology: "React & TypeScript"
    description: "Displays personalized recommendations and reviews."
relationships:
  - source: "Customer & Store Administrator"
    destination: "Single Page Application (SPA)"
    description: "Interacts via [HTTPS / REST / GraphQL]"
  - source: "API Client Component"
    destination: "Amazon API Gateway"
    description: "Sends backend requests via [HTTPS / JSON] with Accept-Currency headers"
  - source: "UI Components"
    destination: "Localization/Currency Component"
    description: "Formats prices locally via [JavaScript function calls]"
  - source: "Router Component"
    destination: "Catalog, Checkout, and Recommendations UI Components"
    description: "Renders views via [Client-side routing]"