level: component
scope: "Component diagram for the Recommendation Service container"
parentContainer:
  name: "Recommendation Service"
elements:
  - type: "component"
    name: "Recommendation API Controller"
    technology: "Python, FastAPI"
    description: "Exposes endpoints via HTTPS / REST / gRPC to serve personalized book recommendations."
  - type: "component"
    name: "Scoring Engine"
    technology: "Python, NumPy, Pandas"
    description: "Computes recommendation weights and collaborative filtering heuristics using batch data from the data store."
  - type: "component"
    name: "Model Cache Manager"
    technology: "Python, Redis Client"
    description: "Manages in-memory caching using Amazon ElastiCache to achieve sub-50ms latency."
  - type: "component"
    name: "Data Access Repository"
    technology: "Python, PyMongo"
    description: "Handles database operations interacting with Amazon DocumentDB (NoSQL database)."
  - type: "component"
    name: "Message Consumer Component"
    technology: "Python, Celery/SQS worker"
    description: "Consumes asynchronous messages from Amazon SQS for real-time model updates based on domain events."
relationships:
  - source: "Recommendation API Controller"
    destination: "Model Cache Manager"
    description: "Queries cached recommendation models [In-process / Redis Protocol]"
  - source: "Model Cache Manager"
    destination: "Data Access Repository"
    description: "Fetches data on cache miss [Async / MongoDB Wire Protocol]"
  - source: "Scoring Engine"
    destination: "Data Access Repository"
    description: "Retrieves pre-computed user/item affinity matrices [Batch / MongoDB Wire Protocol]"
  - source: "Message Consumer Component"
    destination: "Data Access Repository"
    description: "Updates data store on incoming domain events [In-process / PyMongo]"