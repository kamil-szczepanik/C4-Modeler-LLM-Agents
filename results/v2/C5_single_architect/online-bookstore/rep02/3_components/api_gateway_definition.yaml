level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "SSL Terminator & WAF"
    technology: "AWS WAF / Amazon API Gateway"
    description: "Provides OWASP Top-10 mitigations, SSL termination, and handles incoming client requests securely."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Amazon API Gateway Custom Authorizer"
    description: "Validates JWT signatures and scopes against the Identity Provider."
  - type: "component"
    name: "Rate Limiter & Throttler"
    technology: "Amazon API Gateway / Amazon ElastiCache (Redis)"
    description: "Maintains token buckets and counters for distributed rate-limiting."
  - type: "component"
    name: "Request Router"
    technology: "Amazon API Gateway Routing"
    description: "Forwards traffic to backend microservices including Catalog Service, Order & Checkout Service, Recommendation Service, and Customer Review Service."
relationships:
  - source: "SSL Terminator & WAF"
    destination: "Authentication & Authorization Filter"
    description: "Passes sanitized HTTPS requests"
  - source: "Authentication & Authorization Filter"
    destination: "Rate Limiter & Throttler"
    description: "Checks rate limits for authenticated requests"
  - source: "Rate Limiter & Throttler"
    destination: "Request Router"
    description: "Routes allowed requests"
  - source: "Request Router"
    destination: "Catalog Service"
    description: "Forwards traffic [HTTP/2 / gRPC]"
  - source: "Request Router"
    destination: "Order & Checkout Service"
    description: "Forwards traffic [HTTP/2 / gRPC]"
  - source: "Request Router"
    destination: "Recommendation Service"
    description: "Forwards traffic [HTTP/2 / gRPC]"
  - source: "Request Router"
    destination: "Customer Review Service"
    description: "Forwards traffic [HTTP/2 / gRPC]"