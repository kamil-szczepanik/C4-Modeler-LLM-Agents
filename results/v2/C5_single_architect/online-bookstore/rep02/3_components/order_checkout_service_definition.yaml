level: component
scope: "Component diagram for the Order & Checkout Service container"
parentContainer:
  name: "Order & Checkout Service"
elements:
  - type: "component"
    name: "Cart Component"
    technology: "Node.js / TypeScript"
    description: "Manages temporary shopping cart state."
  - type: "component"
    name: "Checkout Orchestrator"
    technology: "Node.js / TypeScript"
    description: "Manages state machines for multi-step checkout processes."
  - type: "component"
    name: "Payment Adapter"
    technology: "Node.js / TypeScript"
    description: "Encapsulates external payment gateway communication."
  - type: "component"
    name: "Shipping Adapter"
    technology: "Node.js / TypeScript"
    description: "Encapsulates third-party shipping API integration."
  - type: "component"
    name: "Order Repository"
    technology: "Node.js / TypeScript, Prisma ORM"
    description: "Persists finalized orders and transactional ledger data."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Node.js / TypeScript, AWS SDK"
    description: "Triggers domain events upon successful database commits."
  - type: "component"
    name: "Amazon ElastiCache"
    technology: "Amazon ElastiCache (Redis)"
    description: "Low-latency in-memory store for high-performance shopping cart persistence."
  - type: "component"
    name: "Message Broker"
    technology: "Amazon SQS / SNS"
    description: "Managed message broker for reliable asynchronous domain event distribution."
relationships:
  - source: "Checkout Orchestrator"
    destination: "Payment Adapter"
    description: "Processes secure payments [HTTPS / REST]"
  - source: "Checkout Orchestrator"
    destination: "Shipping Adapter"
    description: "Coordinates shipment and tracking [HTTPS / REST]"
  - source: "Cart Component"
    destination: "Amazon ElastiCache"
    description: "Reads and writes cart state [Redis Protocol]"
  - source: "Checkout Orchestrator"
    destination: "Order Repository"
    description: "Persists finalized transactions [Prisma ORM / SQL via TLS]"
  - source: "Order Repository"
    destination: "Event Publisher Component"
    description: "Triggers domain events post-commit [Internal Function Call]"
  - source: "Event Publisher Component"
    destination: "Message Broker"
    description: "Publishes OrderPlaced events [AWS SDK / HTTPS]"