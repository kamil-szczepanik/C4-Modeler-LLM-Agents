level: component
scope: "Component diagram for the Catalog Service container"
parentContainer:
  name: "Catalog Service"
elements:
  - type: "component"
    name: "Catalog API Controller"
    technology: "Go (net/http)"
    description: "Component handling incoming REST and gRPC requests."
  - type: "component"
    name: "Book Management Component"
    technology: "Go"
    description: "Component managing CRUD operations and local caching."
  - type: "component"
    name: "Search & Discovery Component"
    technology: "Go"
    description: "Component executing complex keyword queries and faceting."
  - type: "component"
    name: "Catalog Event Publisher"
    technology: "Go"
    description: "Component emitting asynchronous domain events."
  - type: "component"
    name: "Local In-Memory Cache"
    technology: "In-process TTL cache"
    description: "In-process TTL cache for frequent read queries."
  - type: "component"
    name: "Amazon Aurora"
    technology: "Relational Database / Postgres"
    description: "Relational database for persistent book metadata."
  - type: "component"
    name: "Amazon OpenSearch"
    technology: "Search Engine"
    description: "Search engine for catalog keyword indexing."
  - type: "component"
    name: "Amazon SQS / SNS"
    technology: "Message Broker / AWS SDK"
    description: "Message broker for asynchronous event distribution."
relationships:
  - source: "Catalog API Controller"
    destination: "Book Management Component"
    description: "Delegates requests [In-process / Go interfaces]"
  - source: "Catalog API Controller"
    destination: "Search & Discovery Component"
    description: "Delegates requests [In-process / Go interfaces]"
  - source: "Book Management Component"
    destination: "Local In-Memory Cache"
    description: "Reads/writes frequent book data [In-process]"
  - source: "Book Management Component"
    destination: "Amazon Aurora"
    description: "Persists core book entities [TCP / Postgres Protocol]"
  - source: "Search & Discovery Component"
    destination: "Amazon OpenSearch"
    description: "Queries index [TCP / HTTPS]"
  - source: "Catalog Event Publisher"
    destination: "Amazon SQS / SNS"
    description: "Publishes domain events [HTTPS / AWS SDK]"