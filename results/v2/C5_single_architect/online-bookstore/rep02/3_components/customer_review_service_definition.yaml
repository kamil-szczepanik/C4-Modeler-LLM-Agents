level: component
scope: "Component diagram for the Customer Review Service container"
parentContainer:
  name: "Customer Review Service"
elements:
  - type: "component"
    name: "Review API Controller"
    technology: "Node.js, Express, REST, gRPC"
    description: "Node.js and Express interface handling incoming HTTP/REST/gRPC endpoints."
  - type: "component"
    name: "Review Domain Service"
    technology: "TypeScript"
    description: "TypeScript core containing business logic, rating aggregation, and validation."
  - type: "component"
    name: "Moderation Client"
    technology: "Node.js"
    description: "Content safety and text filtering module for GDPR compliance."
  - type: "component"
    name: "Review Data Access Repository"
    technology: "Node.js, pg driver"
    description: "Node.js pg driver managing relational persistence."
  - type: "component"
    name: "Event Publisher Component"
    technology: "AWS SDK v3, JavaScript"
    description: "AWS SDK v3 JavaScript module for event dispatch."
  - type: "component"
    name: "Amazon Aurora"
    technology: "PostgreSQL"
    description: "Relational database for review records and indices."
  - type: "component"
    name: "Amazon SNS / SQS"
    technology: "AWS SNS/SQS"
    description: "Message broker for asynchronous event fan-out."
  - type: "component"
    name: "API Gateway"
    technology: "API Gateway"
    description: "Routes incoming review requests."
relationships:
  - source: "API Gateway"
    destination: "Review API Controller"
    description: "Routes incoming review requests [HTTPS / REST / JSON]"
  - source: "Review API Controller"
    destination: "Review Domain Service"
    description: "Delegates requests [Direct TypeScript Function Calls]"
  - source: "Review Domain Service"
    destination: "Moderation Client"
    description: "Validates text content [Internal Module Call]"
  - source: "Review Domain Service"
    destination: "Review Data Access Repository"
    description: "Queries and persists review data [SQL / TCP]"
  - source: "Review Data Access Repository"
    destination: "Amazon Aurora"
    description: "Stores and retrieves relational records [PostgreSQL Wire Protocol / TCP]"
  - source: "Review Domain Service"
    destination: "Event Publisher Component"
    description: "Triggers event publishing [Internal Module Call]"
  - source: "Event Publisher Component"
    destination: "Amazon SNS / SQS"
    description: "Publishes ReviewCreated and ReviewDeleted events [HTTPS / AWS SDK v3]"