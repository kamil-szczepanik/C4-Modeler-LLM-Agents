level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A comprehensive platform designed for public and academic libraries to catalogue items, manage circulation, and provide self-service portals, ensuring EU-only data residency and high-performance catalog searches."
elements:
  - type: "person"
    name: "Library Patron"
    description: "External user interacting via the Self-Service Portal to browse, borrow, and manage their library account."
  - type: "person"
    name: "Librarian / Library Staff"
    description: "External user interacting via the Admin Portal to manage cataloging, circulation, and library operations."
  - type: "externalSystem"
    name: "Identity Provider / IdS"
    description: "External system for authentication that enforces EU-only data residency for user identities."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system for fine processing, handling PCI-DSS scope outside the core boundary."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External system for Email/SMS alerts via SendGrid/Twilio."
  - type: "externalSystem"
    name: "Digital Content Repository / DRM Provider"
    description: "External system providing e-books and audiobooks."
relationships:
  - source: "Library Patron"
    destination: "Library Management System"
    description: "Accesses the Self-Service Portal"
    technology: "HTTPS"
  - source: "Librarian / Library Staff"
    destination: "Library Management System"
    description: "Accesses the Admin Portal"
    technology: "HTTPS"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Processes fines"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "Notification Service"
    description: "Sends Email/SMS alerts"
    technology: "HTTPS/REST API"
  - source: "Library Management System"
    destination: "Digital Content Repository / DRM Provider"
    description: "Retrieves e-books, audiobooks, and verifies licenses"
    technology: "HTTPS/REST and LTI/OAuth"