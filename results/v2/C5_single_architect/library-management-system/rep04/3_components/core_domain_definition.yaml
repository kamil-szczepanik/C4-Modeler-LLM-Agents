level: component
scope: "Component diagram for the Core Domain container"
parentContainer:
  name: "Core Domain"
elements:
  - type: "component"
    name: "Catalog Management Component"
    technology: "Spring Boot / Spring Data JPA"
    description: "Handles physical and digital item cataloguing (R-01)."
  - type: "component"
    name: "Circulation Engine Component"
    technology: "Spring Boot / Spring TX"
    description: "Manages loans, reservations, and business invariants."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Spring AMQP"
    description: "Asynchronously emits domain events using Spring AMQP."
  - type: "component"
    name: "Search Synchronizer Component"
    technology: "Spring Boot"
    description: "Updates the search index to achieve < 800 ms search responses (R-05)."
  - type: "component"
    name: "PostgreSQL Database"
    technology: "PostgreSQL"
    description: "Stores transactional domain data locally."
  - type: "component"
    name: "Search Engine"
    technology: "Elasticsearch"
    description: "Externalized index providing fast catalog queries."
  - type: "component"
    name: "Message Broker"
    technology: "AMQP Broker"
    description: "Handles asynchronous message distribution."
relationships:
  - source: "Catalog Management Component"
    destination: "PostgreSQL Database"
    description: "Reads and writes transactional data via native TCP drivers over TLS enforcing EU-only data residency."
  - source: "Circulation Engine Component"
    destination: "PostgreSQL Database"
    description: "Reads and writes transactional data via native TCP drivers over TLS enforcing EU-only data residency."
  - source: "Circulation Engine Component"
    destination: "Event Publisher Component"
    description: "Communicates via in-process Spring Beans and direct method calls."
  - source: "Event Publisher Component"
    destination: "Message Broker"
    description: "Publishes domain events via AMQP over TLS."
  - source: "Catalog Management Component"
    destination: "Search Synchronizer Component"
    description: "Triggers indexing updates via direct method calls."
  - source: "Search Synchronizer Component"
    destination: "Search Engine"
    description: "Updates indices via native TCP drivers over TLS."