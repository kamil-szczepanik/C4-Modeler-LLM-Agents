level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing & Proxy Engine"
    technology: "Kong/NGINX Core"
    description: "Proxies internal traffic to core domain and search engine."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Lua/OpenResty, JWT"
    description: "Validates requests and enforces authentication."
  - type: "component"
    name: "Rate Limiting & Throttling Module"
    technology: "Redis-backed"
    description: "Handles rate limiting and throttling for API requests."
  - type: "component"
    name: "SSL/TLS Termination & Security Headers Module"
    technology: "OpenSSL/NGINX"
    description: "Entry point for traffic, handles SSL/TLS termination and security headers."
  - type: "component"
    name: "Request Transformation & Analytics Filter"
    technology: "Lua/Go"
    description: "Transforms requests and collects analytics."
relationships:
  - source: "SSL/TLS Termination & Security Headers Module"
    destination: "Authentication & Authorization Filter"
    description: "Forwards decrypted traffic"
  - source: "Authentication & Authorization Filter"
    destination: "Routing & Proxy Engine"
    description: "Forwards validated requests"