level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Exchange Router"
    technology: "RabbitMQ Direct/Topic Exchanges"
    description: "Directs incoming messages using RabbitMQ Direct/Topic Exchanges."
  - type: "component"
    name: "Queue Manager"
    technology: "RabbitMQ Quorum Queues"
    description: "Manages durable message queues via RabbitMQ Quorum Queues."
  - type: "component"
    name: "Connection & Security Manager"
    technology: "TLS 1.3, x.509/PLAIN auth"
    description: "Handles authentication and TLS termination using TLS 1.3 and x.509/PLAIN auth."
  - type: "component"
    name: "Dead Letter Handler"
    technology: "RabbitMQ Dead Letter Exchanges (DLX)"
    description: "Captures failed messages using RabbitMQ Dead Letter Exchanges (DLX)."
relationships:
  - source: "Core Domain"
    destination: "Exchange Router"
    description: "Publishes domain events [AMQP 0-9-1 over TLS]."
  - source: "Exchange Router"
    destination: "Queue Manager"
    description: "Routes events to queues [AMQP internal]."
  - source: "Queue Manager"
    destination: "Integration Worker"
    description: "Delivers messages for processing [AMQP 0-9-1 over TLS]."
  - source: "Queue Manager"
    destination: "Dead Letter Handler"
    description: "Forwards failed messages [AMQP internal]."
  - source: "Dead Letter Handler"
    destination: "PostgreSQL Database"
    description: "Persists failed messages for audit/replay [JDBC over TLS]."