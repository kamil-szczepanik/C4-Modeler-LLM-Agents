level: component
scope: "Component diagram for the Integration Worker container"
parentContainer:
  name: "Integration Worker"
elements:
  - type: "component"
    name: "Message Consumer"
    technology: "Node.js with TypeScript, BullMQ"
    description: "Subscribes to events from the Message Broker."
  - type: "component"
    name: "Payment Integrator"
    technology: "Node.js with TypeScript, HTTPS/REST"
    description: "Communicates with the Payment Gateway."
  - type: "component"
    name: "Notification Integrator"
    technology: "Node.js with TypeScript, HTTPS/REST"
    description: "Handles payload mapping and delivery to the Notification Service."
  - type: "component"
    name: "Retry & Dead-Letter Handler"
    technology: "Node.js with TypeScript, BullMQ"
    description: "Manages transient failures and unprocessable messages."
  - type: "component"
    name: "Webhook Receiver"
    technology: "Node.js with TypeScript, HTTPS/REST"
    description: "Ingests asynchronous callbacks from external systems."
relationships:
  - source: "Message Consumer"
    destination: "Message Broker"
    description: "Subscribes to events [AMQP]"
  - source: "Payment Integrator"
    destination: "Payment Gateway"
    description: "Processes fine payments [HTTPS/REST]"
  - source: "Notification Integrator"
    destination: "Notification Service"
    description: "Sends alerts [HTTPS/REST]"
  - source: "Webhook Receiver"
    destination: "Payment Gateway"
    description: "Ingests callbacks [HTTPS/REST]"