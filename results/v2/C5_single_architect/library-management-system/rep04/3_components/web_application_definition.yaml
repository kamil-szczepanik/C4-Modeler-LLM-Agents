# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Web Application container"
parentContainer:
  name: "Web Application"
elements:
  - type: "component"
    name: "Routing & Shell Component"
    technology: "React, TypeScript"
    description: "Delegates views and provides structured SPA navigation and shell layout."
  - type: "component"
    name: "Catalog & Search Component"
    technology: "React, TypeScript, TanStack Query"
    description: "Handles catalog discovery and search with client-side caching and input debouncing."
  - type: "component"
    name: "Circulation & Self-Service Component"
    technology: "React, TypeScript"
    description: "Manages circulation and self-service portal interactions for patrons and librarians."
  - type: "component"
    name: "API Client Service"
    technology: "Axios, Fetch, WebSockets"
    description: "Handles HTTP transport and streams real-time notifications via WebSockets."
relationships:
  - source: "Routing & Shell Component"
    destination: "Catalog & Search Component"
    description: "Delegates views [HTTPS]"
  - source: "Routing & Shell Component"
    destination: "Circulation & Self-Service Component"
    description: "Delegates views [HTTPS]"
  - source: "Catalog & Search Component"
    destination: "API Client Service"
    description: "Fetches data [HTTPS/REST]"
  - source: "Circulation & Self-Service Component"
    destination: "API Client Service"
    description: "Communicates with backend [HTTPS/REST and WebSockets]"