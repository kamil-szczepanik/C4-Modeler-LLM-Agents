level: component
scope: "Component diagram for the PostgreSQL Database container"
parentContainer:
  name: "PostgreSQL Database"
elements:
  - type: "component"
    name: "Relational Schema Engine"
    technology: "PostgreSQL"
    description: "Houses relational data and performs asynchronous bulk updates."
  - type: "component"
    name: "Full-Text Search Index"
    technology: "pg_trgm"
    description: "Provides fast exact-match lookups and search capabilities."
  - type: "component"
    name: "Audit & Data Residency Enforcement Module"
    technology: "PostgreSQL Module"
    description: "Ensures strict compliance with EU-only data residency constraints."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Manages database connection limits to sustain peak transactional throughput."
relationships:
  - source: "Core Domain"
    destination: "Connection Pooler"
    description: "Manages pooled SQL transactions via JDBC over TLS 1.3."
  - source: "Integration Worker"
    destination: "Relational Schema Engine"
    description: "Performs asynchronous bulk updates via native PostgreSQL wire protocol."
  - source: "Core Domain"
    destination: "PostgreSQL Database"
    description: "Reads and writes transactional data using native TCP drivers over TLS."