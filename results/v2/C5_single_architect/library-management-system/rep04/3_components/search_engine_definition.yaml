level: component
scope: "Component diagram for the Search Engine container"
parentContainer:
  name: "Search Engine"
elements:
  - type: "component"
    name: "Query Parser"
    technology: "Elasticsearch Java Client / Elasticsearch Query DSL"
    description: "Sanitizes and translates search requests using Elasticsearch Query DSL."
  - type: "component"
    name: "Indexing Worker"
    technology: "Elasticsearch"
    description: "Consumes synchronization events to update the index."
  - type: "component"
    name: "Search Index (Storage Node)"
    technology: "Lucene / LUKS"
    description: "Lucene-based storage node enforcing EU data residency with disk encryption at rest."
  - type: "component"
    name: "Ranking & Relevance Tuner"
    technology: "Internal Lucene API"
    description: "Applies custom scoring scripts and synonym mappings."
relationships:
  - source: "Core Domain"
    destination: "Query Parser"
    description: "Submits search requests [HTTP/JSON over TLS via Elasticsearch Java Client]"
  - source: "Message Broker"
    destination: "Indexing Worker"
    description: "Streams catalog sync events [AMQP]"
  - source: "Query Parser"
    destination: "Ranking & Relevance Tuner"
    description: "Applies custom scoring and boosts [Internal Lucene API]"
  - source: "Query Parser"
    destination: "Search Index (Storage Node)"
    description: "Executes low-latency index lookups [Internal Java Transport / Lucene API]"