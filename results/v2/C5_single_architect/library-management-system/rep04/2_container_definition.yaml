level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patron"
    description: "External user interacting via the Self-Service Portal to browse, borrow, and manage their library account."
  - type: "person"
    name: "Librarian / Library Staff"
    description: "External user interacting via the Admin Portal to manage cataloging, circulation, and library operations."
  - type: "externalSystem"
    name: "Identity Provider / IdS"
    description: "External system for authentication that enforces EU-only data residency for user identities."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system for fine processing, handling PCI-DSS scope outside the core boundary."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External system for Email/SMS alerts via SendGrid/Twilio."
  - type: "externalSystem"
    name: "Digital Content Repository / DRM Provider"
    description: "External system providing e-books and audiobooks."
  - type: "container"
    name: "Web Application"
    technology: "React, TypeScript"
    description: "Powers the frontend web application container for users."
  - type: "container"
    name: "API Gateway"
    technology: "Kong or NGINX"
    description: "API Gateway for secure routing, SSL termination, and rate limiting."
  - type: "container"
    name: "Core Domain"
    technology: "Java, Spring Boot"
    description: "Implements the reliable Core Domain container logic."
  - type: "container"
    name: "Search Engine"
    technology: "Elasticsearch"
    description: "Dedicated engine to meet the sub-800ms search latency requirement."
  - type: "container"
    name: "Integration Worker"
    technology: "Node.js / Python"
    description: "Handles external integrations and asynchronous tasks."
  - type: "container"
    name: "Message Broker"
    technology: "RabbitMQ"
    description: "Asynchronous message broker to decouple workflows and integrations."
  - type: "container"
    name: "PostgreSQL Database"
    technology: "PostgreSQL"
    description: "EU-hosted relational database for transactional data integrity."
relationships:
  - source: "Library Patron"
    destination: "Web Application"
    description: "Accesses Self-Service Portal"
    technology: "HTTPS"
  - source: "Librarian / Library Staff"
    destination: "Web Application"
    description: "Accesses Admin Portal"
    technology: "HTTPS"
  - source: "Web Application"
    destination: "API Gateway"
    description: "Routes requests"
    technology: "HTTPS/REST and WebSockets"
  - source: "API Gateway"
    destination: "Core Domain"
    description: "Proxies internal requests"
    technology: "gRPC and internal REST"
  - source: "Core Domain"
    destination: "PostgreSQL Database"
    description: "Reads and writes transactional data"
    technology: "native TCP drivers over TLS"
  - source: "Core Domain"
    destination: "Search Engine"
    description: "Queries catalog data"
    technology: "native TCP drivers over TLS"
  - source: "Core Domain"
    destination: "Message Broker"
    description: "Publishes and consumes messages"
    technology: "AMQP over TLS"
  - source: "Integration Worker"
    destination: "Payment Gateway"
    description: "Processes fine payments"
    technology: "HTTPS/REST"
  - source: "Integration Worker"
    destination: "Notification Service"
    description: "Sends alerts and notifications"
    technology: "HTTPS/REST"