level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Patrons"
    description: "Library members who use the self-service portal."
  - type: "person"
    name: "Librarians"
    description: "Staff members who manage cataloguing and circulation."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system used for processing payments."
  - type: "externalSystem"
    name: "e-Book Vendors"
    description: "External vendors providing digital content and e-books."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External service used for sending automated notifications."
  - type: "externalSystem"
    name: "Enterprise Search Service"
    description: "External subsystem providing specialized search capabilities."
  - type: "container"
    name: "Web Application"
    technology: "React, TypeScript"
    description: "Frontend web application for responsive user interfaces."
  - type: "container"
    name: "API Gateway"
    technology: "Kong / Nginx"
    description: "Entry point managing routing and security for incoming requests."
  - type: "container"
    name: "Core Business Service"
    technology: "Java, Spring Boot"
    description: "Robust backend handling core cataloguing and circulation business logic."
  - type: "container"
    name: "Search Service"
    technology: "Elasticsearch"
    description: "Dedicated search engine ensuring sub-800ms search performance."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL"
    description: "Primary relational database restricted to EU infrastructure."
  - type: "container"
    name: "Redis Cache"
    technology: "Redis"
    description: "In-memory cache to reduce database load."
  - type: "container"
    name: "Notification Worker"
    technology: "Node.js"
    description: "Asynchronous background worker for decoupled notification processing."
relationships:
  - source: "Patrons"
    destination: "Web Application"
    description: "Accesses cataloguing, circulation, and self-service portals"
    technology: "HTTPS/JSON"
  - source: "Librarians"
    destination: "Web Application"
    description: "Manages library cataloguing and system operations"
    technology: "HTTPS/JSON"
  - source: "Web Application"
    destination: "API Gateway"
    description: "Sends requests to backend services"
    technology: "HTTPS/JSON"
  - source: "API Gateway"
    destination: "Core Business Service"
    description: "Routes business requests"
    technology: "gRPC/REST"
  - source: "API Gateway"
    destination: "Search Service"
    description: "Routes search queries"
    technology: "gRPC/REST"
  - source: "Core Business Service"
    destination: "Database"
    description: "Reads and writes persistent data"
    technology: "TCP"
  - source: "Core Business Service"
    destination: "Redis Cache"
    description: "Caches frequently accessed data"
    technology: "TCP/RESP"
  - source: "Core Business Service"
    destination: "Payment Gateway"
    description: "Processes financial transactions"
    technology: "HTTPS"
  - source: "Notification Worker"
    destination: "Notification Service"
    description: "Dispatches automated alerts"
    technology: "HTTPS/AMQP"