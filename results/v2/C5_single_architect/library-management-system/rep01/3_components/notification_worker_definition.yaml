level: component
scope: "Component diagram for the Notification Worker container"
parentContainer:
  name: "Notification Worker"
elements:
  - type: "component"
    name: "Queue Consumer Component"
    technology: "Node.js, amqplib"
    description: "Node.js worker consuming background jobs."
  - type: "component"
    name: "Template Engine Component"
    technology: "Handlebars"
    description: "Handlebars-based rendering engine."
  - type: "component"
    name: "Compliance Sanitizer Component"
    technology: "TypeScript"
    description: "TypeScript-based PII masking engine."
  - type: "component"
    name: "Dispatcher Client Component"
    technology: "Axios"
    description: "Axios-based HTTP client."
  - type: "component"
    name: "Retry & Dead-Letter Handler Component"
    technology: "Node.js"
    description: "Exception and backoff manager."
  - type: "component"
    name: "Notification Service"
    technology: "External Service"
    description: "External notification service receiving alerts."
relationships:
  - source: "Queue Consumer Component"
    destination: "Template Engine Component"
    description: "Passes raw event payloads [In-memory function call]"
  - source: "Template Engine Component"
    destination: "Compliance Sanitizer Component"
    description: "Passes rendered payload [In-memory function call]"
  - source: "Compliance Sanitizer Component"
    destination: "Dispatcher Client Component"
    description: "Sends sanitized payload [In-memory function call]"
  - source: "Dispatcher Client Component"
    destination: "Notification Service"
    description: "Sends alerts [HTTPS]"
  - source: "Queue Consumer Component"
    destination: "Retry & Dead-Letter Handler Component"
    description: "Handles processing exceptions [AMQP]"