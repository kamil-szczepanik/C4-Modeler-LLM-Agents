level: component
scope: "Component diagram for the Core Business Service container"
parentContainer:
  name: "Core Business Service"
elements:
  - type: "component"
    name: "Catalog Management Component"
    technology: "Spring Data JPA"
    description: "Manages catalog items and synchronizes item metadata with the search service, while caching hot items."
  - type: "component"
    name: "Circulation Component"
    technology: "Spring Transactions"
    description: "Handles library circulation logic and persists transaction states to the database."
  - type: "component"
    name: "Payment Integration Component"
    technology: "Spring Cloud OpenFeign"
    description: "Processes library fines by communicating with the external payment gateway."
  - type: "component"
    name: "Search Integration Component"
    technology: "Spring WebClient"
    description: "Integrates with search capabilities to support search requirements."
relationships:
  - source: "Catalog Management Component"
    destination: "Redis Cache"
    description: "Caches hot catalog items [TCP/Lettuce]"
  - source: "Circulation Component"
    destination: "Database"
    description: "Persists transaction states [TCP/JDBC]"
  - source: "Payment Integration Component"
    destination: "External Payment Gateway"
    description: "Processes fines [HTTPS/JSON]"
  - source: "Catalog Management Component"
    destination: "Search Service"
    description: "Synchronizes item metadata [HTTP/REST]"