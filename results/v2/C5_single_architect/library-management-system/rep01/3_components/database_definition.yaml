level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Relational Storage Engine"
    technology: "PostgreSQL 15"
    description: "Core relational engine for ACID-compliant storage of patrons, items, and transactions within EU infrastructure."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Connection pooler to manage concurrent connections and meet performance NFRs."
  - type: "component"
    name: "Audit Logging Extension"
    technology: "pgAudit"
    description: "Extension for strict database-level activity logging to satisfy EU compliance."
  - type: "component"
    name: "Full-Text Search Index"
    technology: "PostgreSQL GIN Indexes"
    description: "Native full-text search index for fast metadata filtering."
relationships:
  - source: "Connection Pooler"
    destination: "Relational Storage Engine"
    description: "Proxied client connections [TCP, local socket]"
  - source: "Relational Storage Engine"
    destination: "Audit Logging Extension"
    description: "Writes security and data access event logs [Internal PostgreSQL Hook]"