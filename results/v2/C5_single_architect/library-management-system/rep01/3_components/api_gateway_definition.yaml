level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "SSL/TLS Termination Component"
    technology: "OpenSSL / Nginx"
    description: "Terminates inbound HTTPS traffic and handles perimeter security enforcing EU data residency."
  - type: "component"
    name: "Authentication & Authorization Component"
    technology: "Kong JWT Plugin & OAuth2"
    description: "Validates credentials and offloads edge-based authentication."
  - type: "component"
    name: "Routing & Load Balancing Component"
    technology: "Kong / Nginx & Lua"
    description: "Forwards authenticated traffic and search queries to backend services."
  - type: "component"
    name: "Rate Limiting & Throttling Component"
    technology: "Redis"
    description: "Backs rate limiting and throttling to protect search performance SLAs."
relationships:
  - source: "SSL/TLS Termination Component"
    destination: "Authentication & Authorization Component"
    description: "Passes decrypted requests [Internal]"
  - source: "Authentication & Authorization Component"
    destination: "Routing & Load Balancing Component"
    description: "Forwards validated requests [Internal]"
  - source: "Routing & Load Balancing Component"
    destination: "Core Business Service"
    description: "Forwards authenticated traffic [gRPC]"
  - source: "Routing & Load Balancing Component"
    destination: "Search Service"
    description: "Forwards search queries [gRPC]"
  - source: "Routing & Load Balancing Component"
    destination: "Redis Cache"
    description: "Checks rate limits [RESP/TCP]"