level: component
scope: "Component diagram for the Redis Cache container"
parentContainer:
  name: "Redis Cache"
elements:
  - type: "component"
    name: "Cache Data Store"
    technology: "Redis In-Memory Engine"
    description: "Manages internal Redis memory operations and stores cached data."
  - type: "component"
    name: "Eviction & TTL Manager"
    technology: "Redis"
