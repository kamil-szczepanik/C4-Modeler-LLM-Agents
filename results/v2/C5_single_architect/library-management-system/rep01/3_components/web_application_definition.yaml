level: component
scope: "Component diagram for the Web Application container"
parentContainer:
  name: "Web Application"
elements:
  - type: "component"
    name: "Router / Layout"
    technology: "React Router"
    description: "Manages navigation and layouts for the web application."
  - type: "component"
    name: "Authentication"
    technology: "Auth Context / OAuth2 SDK"
    description: "Handles authentication and role-based access."
  - type: "component"
    name: "Catalogue & Search"
    technology: "React, TypeScript, React Query / SWR"
    description: "Provides catalogue and search functionalities with client-side result caching."
  - type: "component"
    name: "Circulation & Self-Service"
    technology: "React, TypeScript"
    description: "Manages circulation and self-service portals for patrons and staff."
relationships:
  - source: "Router / Layout"
    destination: "Authentication"
    description: "Uses [HTTPS]"
  - source: "Catalogue & Search"
    destination: "API Gateway"
    description: "Queries search and catalogue data via [HTTPS/JSON]"
  - source: "Circulation & Self-Service"
    destination: "API Gateway"
    description: "Executes transactions via [HTTPS/JSON]"
  - source: "Web Application"
    destination: "API Gateway"
    description: "Sends requests to backend services [HTTPS/JSON]"