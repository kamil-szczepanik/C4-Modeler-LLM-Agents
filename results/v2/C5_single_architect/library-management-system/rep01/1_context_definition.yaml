level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Enterprise platform designed for public and academic libraries to catalogue physical and digital items, manage circulation, and provide self-service portals with strict EU-only data residency."
elements:
  - type: "person"
    name: "Patrons / Library Members"
    description: "Library members who use the self-service portals to access and borrow physical and digital items."
  - type: "person"
    name: "Librarians / Staff"
    description: "Staff members who manage the library catalogue, circulation, and system operations."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "External system used for processing payments."
  - type: "externalSystem"
    name: "Digital Content Providers / e-Book Vendors"
    description: "External vendors providing digital content and e-books."
  - type: "externalSystem"
    name: "Notification Service"
    description: "External service used for sending automated alerts and notifications."
  - type: "externalSystem"
    name: "External Enterprise Search Service"
    description: "Subsystem providing high-performance search capabilities."
relationships:
  - source: "Patrons / Library Members"
    destination: "Library Management System"
    description: "Accesses self-service portals and manages circulation"
    technology: "HTTPS/WSS"
  - source: "Librarians / Staff"
    destination: "Library Management System"
    description: "Manages library operations and cataloguing"
    technology: "HTTPS/WSS"
  - source: "Library Management System"
    destination: "External Payment Gateway"
    description: "Processes financial transactions"
    technology: "REST/TLS"
  - source: "Library Management System"
    destination: "Digital Content Providers / e-Book Vendors"
    description: "Retrieves and manages digital content"
    technology: "REST/OAuth2"
  - source: "Library Management System"
    destination: "Notification Service"
    description: "Sends automated alerts and notifications"
    technology: "HTTPS/SMTP"