level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "API Gateway"
    technology: "Spring Cloud Gateway (Java, Spring WebFlux)"
    description: "Manages secure, non-blocking routing and edge security for all ingress traffic."
  - type: "component"
    name: "Authentication & Authorization Filter"
    technology: "Spring Security / OAuth2"
    description: "Validates JWT tokens for secure authentication and dispatches audit events."
  - type: "component"
    name: "SSL Termination & CORS Handler"
    technology: "Nginx / Spring Cloud Gateway"
    description: "Handles ingress traffic over HTTPS/JSON."
relationships:
  - source: "SSL Termination & CORS Handler"
    destination: "API Gateway"
    description: "Routes verified ingress traffic [HTTPS/JSON]"
  - source: "API Gateway"
    destination: "Search Service"
    description: "Routes search queries [gRPC]"
  - source: "API Gateway"
    destination: "Core Domain Service"
    description: "Routes circulation requests [gRPC]"
  - source: "API Gateway"
    destination: "Redis Cache"
    description: "Evaluates rate limits [Redis Protocol]"
  - source: "Authentication & Authorization Filter"
    destination: "Notification Service"
    description: "Dispatches audit events [HTTPS/JSON]"