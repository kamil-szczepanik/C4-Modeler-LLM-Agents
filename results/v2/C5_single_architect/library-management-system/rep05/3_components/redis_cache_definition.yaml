level: component
scope: "Component diagram for the Redis Cache container"
parentContainer:
  name: "Redis Cache"
elements:
  - type: "component"
    name: "Session Store Module"
    technology: "Redis 7.x Module"
    description: "Validates tokens and retrieves user state for the Core Domain Service."
  - type: "component"
    name: "Catalogue Query Cache Module"
    technology: "Redis 7.x Module"
    description: "Executes cache-aside pattern for frequent catalogue queries from the Search Service."
  - type: "component"
    name: "Cache Eviction & Expiry Manager"
    technology: "Redis 7.x volatile-lru policies & TTLs"
    description: "Enforces strict memory management for EU-only data residency constraints."
relationships:
  - source: "Core Domain Service"
    destination: "Session Store Module"
    description: "Validates tokens and retrieves user state [RESP3/TCP]"
  - source: "Search Service"
    destination: "Catalogue Query Cache Module"
    description: "Executes cache-aside pattern for frequent catalogue queries [RESP3/TCP]"
  - source: "Core Domain Service & Search Service"
    destination: "Redis Cache"
    description: "Accesses cache for sessions and queries [TCP]"