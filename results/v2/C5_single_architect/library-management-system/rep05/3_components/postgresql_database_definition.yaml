level: component
scope: "Component diagram for the PostgreSQL Database container"
parentContainer:
  name: "PostgreSQL Database"
elements:
  - type: "component"
    name: "Relational Storage Engine"
    technology: "PostgreSQL container"
    description: "Enforces strict EU-only data residency and stores transactional data."
  - type: "component"
    name: "PgBouncer Connection Pooler"
    technology: "PgBouncer"
    description: "Manages and isolates connection management for database queries."
  - type: "component"
    name: "Database Migration Manager"
    technology: "Flyway / Liquibase"
    description: "Handles schema migrations for the PostgreSQL database."
relationships:
  - source: "PgBouncer Connection Pooler"
    destination: "Relational Storage Engine"
    description: "Routes and pools TCP connections"
  - source: "Database Migration Manager"
    destination: "Relational Storage Engine"
    description: "Applies schema migrations"