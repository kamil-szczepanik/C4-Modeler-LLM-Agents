level: component
scope: "Component diagram for the Web Application container"
parentContainer:
  name: "Web Application"
elements:
  - type: "component"
    name: "UI Router and Views"
    technology: "React 18, TypeScript, Vite"
    description: "Provides page routing and view rendering for self-service portals and the Admin UI."
  - type: "component"
    name: "State Management and Caching"
    technology: "TanStack Query, Zustand, React Context"
    description: "Manages server state, client-side caching, global UI states, roles, and localization to meet performance requirements."
  - type: "component"
    name: "HTTP API Client"
    technology: "Fetch / Axios"
    description: "Communicates securely with the API Gateway via HTTPS/JSON."
relationships:
  - source: "UI Router and Views"
    destination: "State Management and Caching"
    description: "Reads and writes UI and server state"
  - source: "State Management and Caching"
    destination: "HTTP API Client"
    description: "Triggers data fetching and mutations"
  - source: "HTTP API Client"
    destination: "API Gateway"
    description: "Calls backend APIs [HTTPS/JSON]"