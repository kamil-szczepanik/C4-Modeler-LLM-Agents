level: component
scope: "Component diagram for the Background Worker Service container"
parentContainer:
  name: "Background Worker Service"
elements:
  - type: "component"
    name: "Task Dispatcher"
    technology: "Python with Celery"
    description: "Dispatches and coordinates asynchronous tasks and background jobs."
  - type: "component"
    name: "Maintenance Job Scheduler"
    technology: "Python"
    description: "Schedules and executes periodic maintenance jobs and circulation updates."
relationships:
  - source: "Maintenance Job Scheduler"
    destination: "PostgreSQL Database"
    description: "Updates circulations [TCP/Postgres]"
  - source: "Task Dispatcher"
    destination: "Redis"
    description: "Consumes messages [TCP]"
  - source: "Task Dispatcher"
    destination: "Notification Service"
    description: "Sends notifications [HTTPS/JSON]"
  - source: "Task Dispatcher"
    destination: "DRM Provider"
    description: "Provisions digital rights [HTTPS/JSON]"