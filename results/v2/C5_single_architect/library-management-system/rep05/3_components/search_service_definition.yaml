level: component
scope: "Component diagram for the Search Service container"
parentContainer:
  name: "Search Service"
elements:
  - type: "component"
    name: "Search Controller"
    technology: "FastAPI routing layer"
    description: "Handles incoming queries and routes search requests."
  - type: "component"
    name: "Query Builder"
    technology: "Python"
    description: "Translates search parameters into Elasticsearch Query DSL."
  - type: "component"
    name: "Index Synchronizer"
    technology: "Python"
    description: "Listens for domain events to maintain index consistency."
  - type: "component"
    name: "Elasticsearch Client"
    technology: "Python transport layer"
    description: "Interfacing with the search cluster."
  - type: "component"
    name: "Elasticsearch Cluster"
    technology: "Elasticsearch"
    description: "Storage and execution engine for catalog searches."
  - type: "component"
    name: "RabbitMQ / Kafka"
    technology: "Message Broker"
    description: "Internal message broker for domain events."
  - type: "component"
    name: "PostgreSQL Database"
    technology: "PostgreSQL"
    description: "Primary relational data store."
  - type: "component"
    name: "Redis Cache"
    technology: "Redis"
    description: "Accesses frequent queries."
relationships:
  - source: "API Gateway"
    destination: "Search Controller"
    description: "Routes search queries [gRPC]"
  - source: "RabbitMQ / Kafka"
    destination: "Index Synchronizer"
    description: "Consumes domain events [AMQP/TCP]"
  - source: "Index Synchronizer"
    destination: "PostgreSQL Database"
    description: "Queries initial data [TCP/JDBC]"
  - source: "Search Controller"
    destination: "Query Builder"
    description: "Executes internal method calls [In-process]"
  - source: "Query Builder"
    destination: "Elasticsearch Client"
    description: "Translates Query DSL [HTTP/JSON]"
  - source: "Elasticsearch Client"
    destination: "Elasticsearch Cluster"
    description: "Transports queries [TCP/REST]"
  - source: "Search Service"
    destination: "Redis Cache"
    description: "Accesses frequent queries [TCP]"