level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "Core platform providing cataloging, circulation management, and self-service portals with EU-only data residency compliance."
elements:
  - type: "person"
    name: "Library Patron"
    description: "End-user utilizing self-service portals."
  - type: "person"
    name: "Librarian / Staff"
    description: "Internal user managing the catalogue and desk operations."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Third-party processor for fines and fees."
  - type: "externalSystem"
    name: "Notification Service"
    description: "EU-hosted provider for email and SMS alerts."
  - type: "externalSystem"
    name: "Digital Rights Management (DRM) Provider"
    description: "Manages licensing and access control for digital assets."
relationships:
  - source: "Library Patron"
    destination: "Library Management System"
    description: "Accesses self-service portals"
    technology: "HTTPS via Web/Mobile UI"
  - source: "Librarian / Staff"
    destination: "Library Management System"
    description: "Manages cataloging and circulation via Admin UI"
    technology: "HTTPS"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Processes transactions for fines and fees"
    technology: "HTTPS/REST API"
  - source: "Library Management System"
    destination: "Notification Service"
    description: "Sends email and SMS alerts using EU-hosted endpoints"
    technology: "SMTP and HTTPS APIs"
  - source: "Library Management System"
    destination: "Digital Rights Management (DRM) Provider"
    description: "Manages digital asset licensing and access control"
    technology: "HTTPS/REST API with OAuth 2.0"