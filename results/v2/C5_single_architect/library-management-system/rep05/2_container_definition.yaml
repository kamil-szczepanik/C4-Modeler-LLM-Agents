level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patron"
    description: "End-user utilizing self-service portals."
  - type: "person"
    name: "Librarian / Staff"
    description: "Internal user managing the catalogue and desk operations."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Third-party processor for fines and fees."
  - type: "externalSystem"
    name: "Notification Service"
    description: "EU-hosted provider for email and SMS alerts."
  - type: "externalSystem"
    name: "DRM Provider"
    description: "Manages licensing and access control for digital assets."
  - type: "container"
    name: "Web Application"
    technology: "React, TypeScript, Nginx"
    description: "Powers the responsive single-page Web Application."
  - type: "container"
    name: "API Gateway"
    technology: "Spring Cloud Gateway / Kong"
    description: "Manages secure API entry routing."
  - type: "container"
    name: "Core Domain Service"
    technology: "Java, Spring Boot"
    description: "Implements robust Core Domain business logic."
  - type: "container"
    name: "Search Service"
    technology: "Python, FastAPI, Elasticsearch"
    description: "Delivers high-performance search to meet <800ms response targets."
  - type: "container"
    name: "Background Worker Service"
    technology: "Python/Celery or Java/Spring Batch"
    description: "Handles asynchronous background jobs."
  - type: "container"
    name: "PostgreSQL Database"
    technology: "PostgreSQL"
    description: "Guarantees compliance with EU-only data residency constraints."
  - type: "container"
    name: "Redis Cache"
    technology: "Redis"
    description: "Accelerates frequent catalogue queries and session management."
relationships:
  - source: "Library Patron"
    destination: "Web Application"
    description: "Accesses self-service portals"
    technology: "HTTPS"
  - source: "Librarian / Staff"
    destination: "Web Application"
    description: "Manages cataloging and circulation via Admin UI"
    technology: "HTTPS"
  - source: "Web Application"
    destination: "API Gateway"
    description: "Calls API Gateway"
    technology: "HTTPS/JSON"
  - source: "API Gateway"
    destination: "Search Service"
    description: "Routes search queries"
    technology: "gRPC"
  - source: "Core Domain Service"
    destination: "Redis Cache"
    description: "Accesses cache for session management"
    technology: "TCP"
  - source: "Search Service"
    destination: "Redis Cache"
    description: "Accesses cache for frequent catalogue queries"
    technology: "TCP"
  - source: "Core Domain Service"
    destination: "PostgreSQL Database"
    description: "Persists EU-hosted data"
    technology: "Database Protocol"
  - source: "Background Worker Service"
    destination: "Notification Service"
    description: "Sends notifications"
    technology: "HTTPS/JSON"
  - source: "Background Worker Service"
    destination: "DRM Provider"
    description: "Communicates with DRM Provider"
    technology: "HTTPS/JSON"