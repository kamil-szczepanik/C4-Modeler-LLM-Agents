level: component
scope: "Component diagram for the Search Service container"
parentContainer:
  name: "Search Service"
elements:
  - type: "component"
    name: "API Controller"
    technology: "Spring MVC / Spring WebFlux"
    description: "Exposes endpoints for search requests."
  - type: "component"
    name: "Query Sanitizer Component"
    technology: "In-memory Java"
    description: "Sanitizes inputs to ensure compliance with EU data residency rules."
  - type: "component"
    name: "Search Orchestrator"
    technology: "Java Service Bean"
    description: "Orchestrates the search process and query handling."
  - type: "component"
    name: "Elasticsearch Repository"
    technology: "Spring Data Elasticsearch"
    description: "Executes queries against the search engine."
  - type: "component"
    name: "Catalogue Sync Listener"
    technology: "Spring AMQP / Kafka Listener"
    description: "Consumes item events from the message broker for synchronization."
relationships:
  - source: "API Controller"
    destination: "Query Sanitizer Component"
    description: "Sanitizes inputs"
  - source: "Query Sanitizer Component"
    destination: "Search Orchestrator"
    description: "Passes clean queries"
  - source: "Search Orchestrator"
    destination: "Elasticsearch Repository"
    description: "Executes queries"