level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Primary PostgreSQL Instance"
    technology: "PostgreSQL"
    description: "Primary relational OLTP data management system ensuring strict EU-only data residency."
  - type: "component"
    name: "PostgreSQL Read Replicas"
    technology: "PostgreSQL"
    description: "Read replicas providing optimized read performance for catalogue searches."
  - type: "component"
    name: "PgBouncer Connection Pooler"
    technology: "PgBouncer"
    description: "Manages and pools database connections efficiently under high concurrency."
  - type: "component"
    name: "Audit Logging Subsystem"
    technology: "pgAudit"
    description: "Provides native audit logging to ensure strict EU data governance compliance."
  - type: "component"
    name: "Fuzzy-Text Search Extension"
    technology: "pg_trgm Extension"
    description: "Enabled in PostgreSQL to support fast fuzzy-text searches and meet performance requirements."
relationships:
  - source: "PgBouncer Connection Pooler"
    destination: "Primary PostgreSQL Instance"
    description: "Routes write queries and transactions [PostgreSQL Native Protocol over TLS]"
  - source: "PgBouncer Connection Pooler"
    destination: "PostgreSQL Read Replicas"
    description: "Routes read queries [PostgreSQL Native Protocol over TLS]"