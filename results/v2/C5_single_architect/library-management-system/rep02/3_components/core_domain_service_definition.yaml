level: component
scope: "Component diagram for the Core Domain Service container"
parentContainer:
  name: "Core Domain Service"
elements:
  - type: "component"
    name: "Catalog Management Component"
    technology: "Spring MVC/Data"
    description: "Handling physical and digital items."
  - type: "component"
    name: "Circulation & Fines Component"
    technology: "Spring Boot"
    description: "Manages loans, returns, and payment processing."
  - type: "component"
    name: "Event Publisher Component"
    technology: "Spring AMQP"
    description: "Dispatching domain events."
  - type: "component"
    name: "Registry Integration Component"
    technology: "Spring Cloud OpenFeign"
    description: "Synchronizing metadata."
  - type: "component"
    name: "Security Context & Auth Component"
    technology: "Spring Security"
    description: "Validating tokens locally."
relationships:
  - source: "Catalog Management Component"
    destination: "Circulation & Fines Component"
    description: "Interacts with"
  - source: "Event Publisher Component"
    destination: "Registry Integration Component"
    description: "Coordinates with"