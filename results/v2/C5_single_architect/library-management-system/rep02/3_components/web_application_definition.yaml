level: component
scope: "Component diagram for the Web Application container"
parentContainer:
  name: "Web Application"
elements:
  - type: "component"
    name: "Auth Controller"
    technology: "TypeScript / OIDC Client Library"
    description: "Handles authentication and security flow."
  - type: "component"
    name: "Catalog UI Module"
    technology: "React Components / TanStack Query"
    description: "Provides library cataloging interface and data fetching."
  - type: "component"
    name: "Circulation Module"
    technology: "React Components"
    description: "Provides library circulation and self-service portal features."
  - type: "component"
    name: "API Client"
    technology: "Axios / Fetch API"
    description: "Invokes backend API requests."
  - type: "component"
    name: "State Management Store"
    technology: "Zustand / Redux Toolkit"
    description: "Manages local application state and caching."
  - type: "component"
    name: "Router Component"
    technology: "React Router"
    description: "Handles client-side navigation and lazy-loading."
relationships:
  - source: "Router Component"
    destination: "Catalog UI Module"
    description: "Lazy-loads views [In-process]"
  - source: "Router Component"
    destination: "Circulation Module"
    description: "Lazy-loads views [In-process]"
  - source: "Auth Controller"
    destination: "State Management Store"
    description: "Manages state [In-process]"
  - source: "Catalog UI Module"
    destination: "State Management Store"
    description: "Manages state [In-process]"
  - source: "Circulation Module"
    destination: "State Management Store"
    description: "Manages state [In-process]"
  - source: "Auth Controller"
    destination: "API Client"
    description: "Invokes requests [In-process]"
  - source: "Catalog UI Module"
    destination: "API Client"
    description: "Invokes requests [In-process]"
  - source: "API Client"
    destination: "API Gateway"
    description: "Forwards authenticated requests [HTTPS/REST]"