level: component
scope: "Component diagram for the Notification Worker container"
parentContainer:
  name: "Notification Worker"
elements:
  - type: "component"
    name: "Message Consumer"
    technology: "Node.js / amqplib"
    description: "Consumes events from the message broker and passes deserialized events."
  - type: "component"
    name: "Notification Router"
    technology: "TypeScript"
    description: "Routes deserialized events and sends formatted payloads."
  - type: "component"
    name: "Delivery Client"
    technology: "Axios"
    description: "Sends notifications and forwards failed requests to the retry coordinator."
  - type: "component"
    name: "Retry Coordinator"
    technology: "TypeScript / Bottleneck"
    description: "Manages exponential backoff, rate limiting, and retries failed requests."
  - type: "component"
    name: "Dead Letter Handler"
    technology: "TypeScript"
    description: "Routes poison messages to the Dead Letter Queue."
  - type: "component"
    name: "Message Broker"
    technology: "RabbitMQ / Apache Kafka"
    description: "External message broker for consuming events and routing DLQ messages."
  - type: "component"
    name: "External Notification Service"
    technology: "HTTPS Service"
    description: "External third-party service that receives notifications."
relationships:
  - source: "Message Consumer"
    destination: "Message Broker"
    description: "Consumes events [AMQP]"
  - source: "Message Consumer"
    destination: "Notification Router"
    description: "Passes deserialized events [In-memory function call]"
  - source: "Notification Router"
    destination: "Delivery Client"
    description: "Sends formatted payload [In-memory function call]"
  - source: "Delivery Client"
    destination: "Retry Coordinator"
    description: "Forwards failed requests [In-memory function call]"
  - source: "Delivery Client"
    destination: "External Notification Service"
    description: "Sends notifications [HTTPS]"
  - source: "Retry Coordinator"
    destination: "External Notification Service"
    description: "Retries requests [HTTPS]"
  - source: "Dead Letter Handler"
    destination: "Message Broker"
    description: "Routes poison messages to DLQ [AMQP]"