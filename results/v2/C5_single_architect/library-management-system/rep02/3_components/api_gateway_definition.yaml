level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing & Load Balancing Component"
    technology: "Spring Cloud Gateway"
    description: "Handles native reactive routing, dynamic service discovery, and load balancing."
  - type: "component"
    name: "JWT Validation Filter"
    technology: "Spring Cloud Gateway Filter with WebClient"
    description: "Validates incoming tokens and performs non-blocking reactive key caching."
  - type: "component"
    name: "Rate Limiting & Throttling Component"
    technology: "Spring Cloud Gateway"
    description: "Enforces rate limits and throttles excessive requests to protect downstream services."
  - type: "component"
    name: "Circuit Breaker Component"
    technology: "Resilience4j"
    description: "Protects search endpoints and prevents cascading failures."
relationships:
  - source: "Routing & Load Balancing Component"
    destination: "Core Domain Service"
    description: "Routes validated commands/queries [gRPC]"
  - source: "Circuit Breaker Component"
    destination: "Search Service"
    description: "Protects search endpoints [gRPC]"
  - source: "JWT Validation Filter"
    destination: "Identity Provider"
    description: "Validates tokens [HTTPS/REST]"