level: component
scope: "Component diagram for the Message Broker container"
parentContainer:
  name: "Message Broker"
elements:
  - type: "component"
    name: "Exchange Component"
    technology: "RabbitMQ Exchange"
    description: "Routes incoming messages from the Core Domain Service to appropriate queues."
  - type: "component"
    name: "notification-queue"
    technology: "RabbitMQ Queue"
    description: "Queues notification tasks for asynchronous processing by the Notification Worker."
  - type: "component"
    name: "audit-event-queue"
    technology: "RabbitMQ Queue"
    description: "Stores audit event messages to maintain compliance and activity logs."
  - type: "component"
    name: "Data Policy Enforcement Component"
    technology: "RabbitMQ Policy Engine"
    description: "Enforces EU-only data residency and local storage policies."
relationships:
  - source: "Exchange Component"
    destination: "notification-queue"
    description: "Routes notification messages"
  - source: "Exchange Component"
    destination: "audit-event-queue"
    description: "Routes audit messages"