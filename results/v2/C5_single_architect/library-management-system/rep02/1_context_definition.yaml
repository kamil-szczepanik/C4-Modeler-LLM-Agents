level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A cloud-hosted SaaS solution that enables public and academic libraries to catalogue physical and digital items, manage circulation, and provide self-service portals while enforcing strict EU-only data residency."
elements:
  - type: "person"
    name: "Library Patrons and Library Staff"
    description: "Users who interact with the system for cataloguing, circulation, and self-service portal access."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Third-party financial service (Stripe/Adyen) pinned to EU-region endpoints for fine processing."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Third-party messaging service (SendGrid/Twilio) pinned to EU-region endpoints for alerts."
  - type: "externalSystem"
    name: "National Library Registry"
    description: "EU-hosted REST API used for metadata synchronization."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "OAuth2/OIDC service for standardized single sign-on authentication."
relationships:
  - source: "Library Patrons and Library Staff"
    destination: "Library Management System"
    description: "UI interaction"
    technology: "HTTPS"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Fine processing"
    technology: "HTTPS"
  - source: "Library Management System"
    destination: "Notification Service"
    description: "Alerts"
    technology: "HTTPS"
  - source: "Library Management System"
    destination: "National Library Registry"
    description: "Metadata synchronization"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "Identity Provider"
    description: "Authentication"
    technology: "OIDC"