level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patrons and Library Staff"
    description: "Users who interact with the system for cataloguing, circulation, and self-service portal access."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "Third-party financial service (Stripe/Adyen) pinned to EU-region endpoints for fine processing."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Third-party messaging service (SendGrid/Twilio) pinned to EU-region endpoints for alerts."
  - type: "externalSystem"
    name: "National Library Registry"
    description: "EU-hosted REST API used for metadata synchronization."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "OAuth2/OIDC service for standardized single sign-on authentication."
  - type: "container"
    name: "Web Application"
    technology: "React/TypeScript SPA"
    description: "Powers the user-facing Single Page Application via CDN."
  - type: "container"
    name: "API Gateway"
    technology: "Nginx / Spring Cloud Gateway"
    description: "Manages edge routing, TLS termination, and rate limiting."
  - type: "container"
    name: "Core Domain Service"
    technology: "Java/Spring Boot"
    description: "Implements reliable business logic for the Core Domain Service."
  - type: "container"
    name: "Search Service"
    technology: "Java with Elasticsearch"
    description: "Powers high-performance catalog searches."
  - type: "container"
    name: "Notification Worker"
    technology: "Node.js"
    description: "Consumes events from Message Broker and calls external Notification Service."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL"
    description: "Stores relational data, pinned strictly to an EU region for compliance."
  - type: "container"
    name: "Message Broker"
    technology: "RabbitMQ / Apache Kafka"
    description: "Handles asynchronous event-driven messaging via AMQP."
relationships:
  - source: "Library Patrons and Library Staff"
    destination: "Web Application"
    description: "Interacts with the user interface"
    technology: "HTTPS"
  - source: "Web Application"
    destination: "API Gateway"
    description: "Calls API Gateway"
    technology: "HTTPS/REST"
  - source: "API Gateway"
    destination: "Core Domain Service"
    description: "Routes requests"
    technology: "gRPC/REST"
  - source: "API Gateway"
    destination: "Search Service"
    description: "Routes search requests"
    technology: "gRPC/REST"
  - source: "Core Domain Service"
    destination: "Database"
    description: "Reads/writes relational data"
    technology: "JDBC over TLS"
  - source: "Core Domain Service"
    destination: "Message Broker"
    description: "Publishes domain events"
    technology: "AMQP"
  - source: "Notification Worker"
    destination: "Message Broker"
    description: "Consumes events"
    technology: "AMQP"
  - source: "Notification Worker"
    destination: "Notification Service"
    description: "Sends notifications"
    technology: "HTTPS"
  - source: "Core Domain Service"
    destination: "Payment Gateway"
    description: "Processes fines"
    technology: "HTTPS"
  - source: "Core Domain Service"
    destination: "National Library Registry"
    description: "Synchronizes metadata"
    technology: "HTTPS/REST"
  - source: "Core Domain Service"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "OIDC"