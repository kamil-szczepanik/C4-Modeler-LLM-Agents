level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Library Patron"
    description: "End-user accessing self-service portals."
  - type: "person"
    name: "Library Staff"
    description: "Administrators managing inventory and desk operations."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "Third-party service for fines and fee transactions."
  - type: "externalSystem"
    name: "Digital Content Provider"
    description: "External APIs for digital catalog items."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Third-party or enterprise email/SMS provider for alerts."
  - type: "container"
    name: "Web Application"
    technology: "React, TypeScript"
    description: "Powers the frontend Single-Page Application for responsive user interactions."
  - type: "container"
    name: "API Gateway"
    technology: "Spring Cloud Gateway / Envoy"
    description: "Routes and manages incoming requests to internal microservices."
  - type: "container"
    name: "Catalogue Service"
    technology: "Java, Spring Boot"
    description: "Manages library items and catalog data."
  - type: "container"
    name: "Circulation Service"
    technology: "Java, Spring Boot"
    description: "Manages item borrowing, returns, and payment integrations."
  - type: "container"
    name: "Digital Content Proxy Service"
    technology: "Java, Spring Boot"
    description: "Proxies requests to external digital content providers."
  - type: "container"
    name: "Notification Worker"
    technology: "Node.js"
    description: "Processes asynchronous message queues for notifications."
  - type: "container"
    name: "PostgreSQL"
    technology: "PostgreSQL"
    description: "Provides primary relational data persistence restricted to an EU region for compliance."
  - type: "container"
    name: "Redis"
    technology: "Redis"
    description: "Caches frequent reads and user sessions to optimize performance."
  - type: "container"
    name: "Elasticsearch"
    technology: "Elasticsearch"
    description: "Delivers high-speed search capabilities meeting the <800ms P99 performance requirement."
  - type: "container"
    name: "RabbitMQ"
    technology: "RabbitMQ"
    description: "Manages asynchronous message queuing for notifications."
relationships:
  - source: "Library Patron"
    destination: "Web Application"
    description: "Accesses self-service portal"
    technology: "HTTPS"
  - source: "Library Staff"
    destination: "Web Application"
    description: "Manages system via UI"
    technology: "HTTPS"
  - source: "Web Application"
    destination: "API Gateway"
    description: "Sends API requests"
    technology: "HTTPS/JSON"
  - source: "API Gateway"
    destination: "Catalogue Service"
    description: "Routes catalog requests"
    technology: "gRPC over TLS"
  - source: "API Gateway"
    destination: "Circulation Service"
    description: "Routes circulation requests"
    technology: "gRPC over TLS"
  - source: "API Gateway"
    destination: "Digital Content Proxy Service"
    description: "Routes digital content requests"
    technology: "gRPC over TLS"
  - source: "Circulation Service"
    destination: "External Payment Gateway"
    description: "Processes fines and fees"
    technology: "REST/HTTPS"
  - source: "Digital Content Proxy Service"
    destination: "Digital Content Provider"
    description: "Fetches digital assets"
    technology: "HTTPS"
  - source: "Notification Worker"
    destination: "Notification Service"
    description: "Dispatches alerts"
    technology: "AMQP/RabbitMQ"
  - source: "Catalogue Service"
    destination: "Elasticsearch"
    description: "Queries search index"
    technology: "TCP"
  - source: "Catalogue Service"
    destination: "PostgreSQL"
    description: "Reads and writes catalogue data"
    technology: "TCP"
  - source: "Circulation Service"
    destination: "PostgreSQL"
    description: "Reads and writes circulation data"
    technology: "TCP"
  - source: "Web Application"
    destination: "Redis"
    description: "Caches session and frequent reads"
    technology: "TCP"
  - source: "Notification Worker"
    destination: "RabbitMQ"
    description: "Consumes messages"
    technology: "AMQP"