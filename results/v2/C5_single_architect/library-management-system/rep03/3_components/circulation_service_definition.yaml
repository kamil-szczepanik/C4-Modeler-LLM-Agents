level: component
scope: "Component diagram for the Circulation Service container"
parentContainer:
  name: "Circulation Service"
elements:
  - type: "component"
    name: "Circulation Controller"
    technology: "Spring MVC / Spring gRPC"
    description: "Endpoint receiver that handles incoming circulation requests."
  - type: "component"
    name: "Loan Management Component"
    technology: "Java Spring Boot"
    description: "Manages item borrowing, returns, loan rules, and publishes domain events."
  - type: "component"
    name: "Fine Management Component"
    technology: "Java Spring Boot"
    description: "Triggers fine assessments and manages financial penalties."
  - type: "component"
    name: "Payment Integration Client"
    technology: "Spring WebClient"
    description: "Handles outbound REST calls to process fine payments via the External Payment Gateway."
  - type: "component"
    name: "Data Access Repository"
    technology: "Spring Data JPA"
    description: "Manages transactional persistence to PostgreSQL."
  - type: "component"
    name: "Compliance Audit Component"
    technology: "Spring Aspect / Service"
    description: "Intercepts writes for GDPR compliance and enforces EU data residency requirements."
relationships:
  - source: "Circulation Controller"
    destination: "Loan Management Component"
    description: "Invokes business rules [In-memory method call]"
  - source: "Loan Management Component"
    destination: "Fine Management Component"
    description: "Triggers fine assessments [In-memory]"
  - source: "Fine Management Component"
    destination: "Payment Integration Client"
    description: "Requests fine processing [REST/HTTPS]"
  - source: "Loan Management Component"
    destination: "Data Access Repository"
    description: "Persists state [JPA/TCP]"
  - source: "Fine Management Component"
    destination: "Data Access Repository"
    description: "Persists state [JPA/TCP]"
  - source: "Loan Management Component"
    destination: "RabbitMQ"
    description: "Publishes LoanCreated and ItemReturned events [AMQP over TLS]"
  - source: "Compliance Audit Component"
    destination: "Data Access Repository"
    description: "Intercepts writes for GDPR compliance [In-memory aspect]"