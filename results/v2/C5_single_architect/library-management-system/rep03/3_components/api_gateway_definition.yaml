level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Spring Cloud Gateway Router"
    technology: "Spring Cloud Gateway, Project Reactor"
    description: "Routes incoming requests from the Web Application to downstream microservices using reactive routing."
  - type: "component"
    name: "Authentication & Authorization Component"
    technology: "Spring Security, Redis"
    description: "Validates tokens and enforces rate limits in conjunction with Redis."
  - type: "component"
    name: "Resilience Handler"
    technology: "Resilience4j"
    description: "Implements circuit breaking and retries natively to isolate downstream services from traffic surges."
relationships:
  - source: "Spring Cloud Gateway Router"
    destination: "Authentication & Authorization Component"
    description: "Validates tokens and rate limits [TCP]"
  - source: "Spring Cloud Gateway Router"
    destination: "Resilience Handler"
    description: "Applies circuit breaking and retry patterns"