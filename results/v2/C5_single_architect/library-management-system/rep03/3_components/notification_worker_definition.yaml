level: component
scope: "Component diagram for the Notification Worker container"
parentContainer:
  name: "Notification Worker"
elements:
  - type: "component"
    name: "Queue Consumer Component"
    technology: "TypeScript, amqplib"
    description: "Ingests messages from RabbitMQ."
  - type: "component"
    name: "Template Engine Component"
    technology: "Nunjucks"
    description: "Renders localized message bodies."
  - type: "component"
    name: "Data Sanitizer Component"
    technology: "Custom TypeScript module"
    description: "Strips PII from payloads."
  - type: "component"
    name: "Dispatch Adapter Component"
    technology: "Axios, Node.js HTTPS"
    description: "Handles external integration for alert delivery."
  - type: "component"
    name: "RabbitMQ"
    technology: "Message broker container"
    description: "Message broker container."
  - type: "component"
    name: "Notification Service"
    technology: "External system"
    description: "External system for final alert delivery."
relationships:
  - source: "Queue Consumer Component"
    destination: "RabbitMQ"
    description: "Consumes messages [AMQP]"
  - source: "Queue Consumer Component"
    destination: "Template Engine Component"
    description: "Passes raw payload [In-Memory Function Call]"
  - source: "Template Engine Component"
    destination: "Data Sanitizer Component"
    description: "Passes rendered payload [In-Memory Function Call]"
  - source: "Data Sanitizer Component"
    destination: "Dispatch Adapter Component"
    description: "Forwards sanitized payload [In-Memory Function Call]"
  - source: "Dispatch Adapter Component"
    destination: "Notification Service"
    description: "Delivers alerts [HTTPS/REST]"
  - source: "Notification Worker"
    destination: "Notification Service"
    description: "Dispatches alerts [AMQP/RabbitMQ]"