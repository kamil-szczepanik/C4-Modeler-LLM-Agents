level: component
scope: "Component diagram for the Elasticsearch container"
parentContainer:
  name: "Elasticsearch"
elements:
  - type: "component"
    name: "Query DSL Engine"
    technology: "Elasticsearch"
    description: "Processes incoming search queries using Elasticsearch Query DSL."
  - type: "component"
    name: "Indexing & Lucene Core"
    technology: "Apache Lucene"
    description: "Manages inverted indices and document storage using Apache Lucene."
  - type: "component"
    name: "Cluster Coordination Module"
    technology: "Elasticsearch Zen Discovery/Raft"
    description: "Handles node discovery, shard allocation, and cluster state using Elasticsearch Zen Discovery/Raft."
  - type: "component"
    name: "Document Routing & Shard Manager"
    technology: "Elasticsearch Routing Module"
    description: "Directs operations to appropriate shards using the Elasticsearch Routing Module."
  - type: "component"
    name: "Catalogue Service"
    technology: "REST / HTTP, JSON over TCP"
    description: "Executes search and index requests."
relationships:
  - source: "Catalogue Service"
    destination: "Query DSL Engine"
    description: "Executes search and index requests via REST / HTTP, JSON over TCP."
  - source: "Query DSL Engine"
    destination: "Document Routing & Shard Manager"
    description: "Resolves shard locations via Internal JVM Method."
  - source: "Document Routing & Shard Manager"
    destination: "Indexing & Lucene Core"
    description: "Executes segment-level operations via Apache Lucene API."