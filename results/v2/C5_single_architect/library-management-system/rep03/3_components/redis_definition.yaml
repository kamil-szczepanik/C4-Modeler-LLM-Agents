level: component
scope: "Component diagram for the Redis container"
parentContainer:
  name: "Redis"
elements:
  - type: "component"
    name: "Session Management Component"
    technology: "In-memory data store"
    description: "Handles user session states."
  - type: "component"
    name: "Catalog Read-Through Cache Component"
    technology: "In-memory data store"
    description: "Stores frequently accessed bibliographic records."
  - type: "component"
    name: "Rate Limiter Component"
    technology: "In-memory data store"
    description: "Backs API Gateway traffic throttling."
relationships:
  - source: "API Gateway"
    destination: "Rate Limiter Component"
    description: "Throttles traffic using RESP3 over TCP with TLS."
  - source: "Catalogue Service"
    destination: "Catalog Read-Through Cache Component"
    description: "Caches frequent reads using RESP3 over TCP with TLS."