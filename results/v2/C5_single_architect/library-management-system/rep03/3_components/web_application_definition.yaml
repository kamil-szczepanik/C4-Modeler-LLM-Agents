level: component
scope: "Component diagram for the Web Application container"
parentContainer:
  name: "Web Application"
elements:
  - type: "component"
    name: "Router / State Management Component"
    technology: "React Router, Redux Toolkit"
    description: "Manages application routing and global state."
  - type: "component"
    name: "Authentication & Session Manager Component"
    technology: "React Context / OIDC client"
    description: "Handles user authentication and session management."
  - type: "component"
    name: "Feature Modules Component"
    technology: "React"
    description: "Implements core feature functionality for patrons and staff."
  - type: "component"
    name: "API Client Component"
    technology: "Axios"
    description: "Handles HTTP communication with the backend API Gateway."
  - type: "component"
    name: "UI Component Library"
    technology: "Tailwind CSS, Radix UI"
    description: "Provides styled and accessible UI primitives."
relationships:
  - source: "Feature Modules Component"
    destination: "API Client Component"
    description: "Internal Function Call"
  - source: "API Client Component"
    destination: "API Gateway"
    description: "HTTPS/JSON"