level: component
scope: "Component diagram for the RabbitMQ container"
parentContainer:
  name: "RabbitMQ"
elements:
  - type: "component"
    name: "Exchange Router"
    technology: "RabbitMQ"
    description: "Routes catalog and circulation events to appropriate queues."
  - type: "component"
    name: "Notification Queue"
    technology: "RabbitMQ"
    description: "Enqueues pending notification tasks for asynchronous processing."
  - type: "component"
    name: "Dead Letter Exchange & Queue (DLX/DLQ)"
    technology: "RabbitMQ"
    description: "Handles poisoned messages and failed notifications."
relationships:
  - source: "Catalogue Service"
    destination: "Exchange Router"
    description: "Publishes catalog events [AMQP]"
  - source: "Circulation Service"
    destination: "Exchange Router"
    description: "Publishes loan/circulation events [AMQP]"
  - source: "Exchange Router"
    destination: "Notification Queue"
    description: "Enqueues notification tasks [AMQP]"
  - source: "Notification Queue"
    destination: "Notification Worker"
    description: "Dispatches pending notification tasks [AMQP]"
  - source: "Notification Worker"
    destination: "Exchange Router"
    description: "Routes poisoned messages to DLX on failure [AMQP]"