level: component
scope: "Component diagram for the Catalogue Service container"
parentContainer:
  name: "Catalogue Service"
elements:
  - type: "component"
    name: "Catalogue Controller"
    technology: "Spring MVC"
    description: "Exposes endpoints and translates gRPC requests."
  - type: "component"
    name: "Item Management Service"
    technology: "Spring Service"
    description: "Encapsulates core cataloging business logic."
  - type: "component"
    name: "Search Indexing Service"
    technology: "Spring Service"
    description: "Manages dual-write synchronization and query building."
  - type: "component"
    name: "Catalogue Repository"
    technology: "Spring Data JPA"
    description: "Handles transactional persistence."
  - type: "component"
    name: "Digital Asset Adapter"
    technology: "Spring Component"
    description: "Integrates with external content providers."
  - type: "component"
    name: "PostgreSQL"
    technology: "PostgreSQL"
    description: "Primary data store for item metadata."
  - type: "component"
    name: "Elasticsearch"
    technology: "Elasticsearch"
    description: "Search index engine for fast querying."
  - type: "component"
    name: "API Gateway"
    technology: "API Gateway"
    description: "Routes incoming traffic."
  - type: "component"
    name: "Digital Content Provider"
    technology: "External System"
    description: "External system for digital assets."
relationships:
  - source: "API Gateway"
    destination: "Catalogue Controller"
    description: "Routes catalog requests [gRPC over TLS]"
  - source: "Catalogue Controller"
    destination: "Item Management Service"
    description: "Method calls [In-process]"
  - source: "Item Management Service"
    destination: "Catalogue Repository"
    description: "JPA/Hibernate [JDBC over TCP]"
  - source: "Item Management Service"
    destination: "Search Indexing Service"
    description: "Spring Application Events [In-process]"
  - source: "Item Management Service"
    destination: "Digital Asset Adapter"
    description: "Method calls [In-process]"
  - source: "Search Indexing Service"
    destination: "Elasticsearch"
    description: "Jest/Spring Data Elasticsearch [TCP]"
  - source: "Catalogue Repository"
    destination: "PostgreSQL"
    description: "Reads and writes data [JDBC over TCP]"
  - source: "Digital Asset Adapter"
    destination: "Digital Content Provider"
    description: "Imports metadata [REST/HTTPS over TLS]"