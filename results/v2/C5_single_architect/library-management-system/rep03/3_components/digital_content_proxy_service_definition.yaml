level: component
scope: "Component diagram for the Digital Content Proxy Service container"
parentContainer:
  name: "Digital Content Proxy Service"
elements:
  - type: "component"
    name: "Proxy Controller"
    technology: "Java, Spring MVC"
    description: "Component handling incoming gRPC requests."
  - type: "component"
    name: "Entitlement Validator"
    technology: "Java, Spring Security/Service"
    description: "Component verifying user access and patron loans."
  - type: "component"
    name: "Content Orchestrator"
    technology: "Java, Spring Service"
    description: "Component managing streaming logic and caching."
  - type: "component"
    name: "Provider Client"
    technology: "Java, Spring WebClient, Resilience4j"
    description: "Component handling outbound HTTPS calls."
  - type: "component"
    name: "Cache Manager"
    technology: "Spring Data Redis, Caffeine"
    description: "Component interfacing with shared Redis."
relationships:
  - source: "API Gateway"
    destination: "Proxy Controller"
    description: "Routes requests [gRPC over TLS]"
  - source: "Proxy Controller"
    destination: "Entitlement Validator"
    description: "Validates access [In-memory Method Call]"
  - source: "Entitlement Validator"
    destination: "Circulation Service"
    description: "Verifies active loans [gRPC over TLS]"
  - source: "Entitlement Validator"
    destination: "Content Orchestrator"
    description: "Proceeds with content fetch [In-memory Method Call]"
  - source: "Content Orchestrator"
    destination: "Cache Manager"
    description: "Checks/stores metadata and tokens [RESP over TCP]"
  - source: "Content Orchestrator"
    destination: "Provider Client"
    description: "Initiates asset fetch [In-memory Method Call]"
  - source: "Provider Client"
    destination: "Digital Content Provider"
    description: "Streams content [HTTPS]"