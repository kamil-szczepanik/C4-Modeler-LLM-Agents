level: component
scope: "Component diagram for the PostgreSQL container"
parentContainer:
  name: "PostgreSQL"
elements:
  - type: "component"
    name: "Connection Pool & Auth Manager (PgBouncer)"
    technology: "PgBouncer"
    description: "Manages connection pooling and authentication for PostgreSQL."
  - type: "component"
    name: "Query Planner & Execution Engine"
    technology: "PostgreSQL Core"
    description: "Routes authenticated queries and executes query execution plans."
  - type: "component"
    name: "Relational Storage Engine"
    technology: "PostgreSQL Storage"
    description: "Accesses data blocks and manages underlying relational storage."
  - type: "component"
    name: "Row-Level Security Policy Enforcer"
    technology: "PostgreSQL RLS"
    description: "Enforces row-level security policies for data access."
  - type: "component"
    name: "Write-Ahead Log (WAL) Manager"
    technology: "PostgreSQL WAL"
    description: "Manages write-ahead logging to guarantee ACID compliance."
relationships:
  - source: "Connection Pool & Auth Manager"
    destination: "Query Planner & Execution Engine"
    description: "Routes authenticated queries via Internal IPC"
  - source: "Query Planner & Execution Engine"
    destination: "Relational Storage Engine"
    description: "Accesses data blocks via Internal IPC"