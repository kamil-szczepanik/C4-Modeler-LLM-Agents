level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A comprehensive platform for public and academic libraries designed to catalogue physical and digital items, manage circulation, and provide self-service portals with strict EU data residency."
elements:
  - type: "person"
    name: "Library Patron"
    description: "End-user accessing self-service portals."
  - type: "person"
    name: "Library Staff"
    description: "Administrators managing inventory and desk operations."
  - type: "externalSystem"
    name: "External Payment Gateway"
    description: "Third-party service for fines and fee transactions."
  - type: "externalSystem"
    name: "Digital Content Provider"
    description: "External APIs for digital catalog items."
  - type: "externalSystem"
    name: "Notification Service"
    description: "Third-party or enterprise email/SMS provider for alerts."
relationships:
  - source: "Library Patron"
    destination: "Library Management System"
    description: "Interacts via self-service portals"
    technology: "HTTPS"
  - source: "Library Staff"
    destination: "Library Management System"
    description: "Interacts for catalog management and desk operations"
    technology: "HTTPS"
  - source: "Library Management System"
    destination: "External Payment Gateway"
    description: "Integrates for fines and fee transactions"
    technology: "REST/TLS"
  - source: "Library Management System"
    destination: "Digital Content Provider"
    description: "Fetches assets from digital catalog"
    technology: "REST/TLS"
  - source: "Library Management System"
    destination: "Notification Service"
    description: "Sends alerts and notifications"
    technology: "SMTP/REST/TLS"