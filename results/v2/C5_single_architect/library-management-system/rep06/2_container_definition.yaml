level: container
scope: "Container diagram for Library Management System"
system:
  name: "Library Management System"
elements:
  - type: "person"
    name: "Patron"
    description: "End-user interacting with the system."
  - type: "person"
    name: "Librarian/Staff"
    description: "End-user interacting with the system."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External system for handling payments."
  - type: "externalSystem"
    name: "Notification Provider"
    description: "External system for delivering notifications."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External system for authentication and identity management."
  - type: "externalSystem"
    name: "Digital Content Provider"
    description: "External system for federated digital content and catalogs."
  - type: "container"
    name: "Web Application (SPA)"
    technology: "React, TypeScript, Nginx"
    description: "Frontend interface for patrons and staff."
  - type: "container"
    name: "API Gateway"
    technology: "Spring Cloud Gateway, Envoy"
    description: "Handles routing and security."
  - type: "container"
    name: "Core Domain Service"
    technology: "Java, Spring Boot"
    description: "Manages business logic and circulation."
  - type: "container"
    name: "Search Service"
    technology: "Python, FastAPI, Elasticsearch"
    description: "Provides high-performance querying and search capabilities."
  - type: "container"
    name: "Async Event Broker"
    technology: "Apache Kafka"
    description: "Managed EU instance for decoupled messaging."
  - type: "container"
    name: "Background Worker"
    technology: "Python, Celery"
    description: "Processes asynchronous tasks."
  - type: "container"
    name: "Database"
    technology: "PostgreSQL"
    description: "Managed EU instance for relational persistence."
relationships:
  - source: "Patron"
    destination: "Web Application (SPA)"
    description: "Interacts with the application"
    technology: "HTTPS"
  - source: "Librarian/Staff"
    destination: "Web Application (SPA)"
    description: "Interacts with the application"
    technology: "HTTPS"
  - source: "Web Application (SPA)"
    destination: "API Gateway"
    description: "Sends requests"
    technology: "HTTPS"
  - source: "API Gateway"
    destination: "Core Domain Service"
    description: "Routes requests"
    technology: "gRPC/REST"
  - source: "API Gateway"
    destination: "Search Service"
    description: "Routes search requests"
    technology: "gRPC/REST"
  - source: "Core Domain Service"
    destination: "Database"
    description: "Persists and queries data"
    technology: "JDBC"
  - source: "Core Domain Service"
    destination: "Async Event Broker"
    description: "Publishes domain events"
    technology: "TCP/Kafka Protocol"
  - source: "Async Event Broker"
    destination: "Search Service"
    description: "Consumes events to update indices"
    technology: "TCP/Kafka Protocol"
  - source: "Core Domain Service"
    destination: "Payment Gateway"
    description: "Processes payments"
    technology: "HTTPS"
  - source: "Core Domain Service"
    destination: "Notification Provider"
    description: "Sends notifications"
    technology: "HTTPS"
  - source: "Core Domain Service"
    destination: "Identity Provider"
    description: "Authenticates users"
    technology: "HTTPS"
  - source: "Core Domain Service"
    destination: "Digital Content Provider"
    description: "Accesses digital content"
    technology: "HTTPS"
  - source: "Background Worker"
    destination: "Payment Gateway"
    description: "Processes asynchronous payment tasks"
    technology: "HTTPS"
  - source: "Background Worker"
    destination: "Notification Provider"
    description: "Sends asynchronous notifications"
    technology: "HTTPS"
  - source: "Background Worker"
    destination: "Identity Provider"
    description: "Handles identity tasks"
    technology: "HTTPS"
  - source: "Background Worker"
    destination: "Digital Content Provider"
    description: "Syncs digital content"
    technology: "HTTPS"