level: context
scope: "System Context diagram for Library Management System"
system:
  name: "Library Management System"
  description: "A cloud-hosted platform for public and academic libraries to catalogue items, manage circulation, and provide self-service portals with EU-only data residency."
elements:
  - type: "person"
    name: "Patron"
    description: "End-user accessing the Self-Service Portal to manage borrows, searches, and digital content."
  - type: "person"
    name: "Librarian / Staff"
    description: "Library employee accessing the Administration Dashboard to manage inventory and circulation."
  - type: "externalSystem"
    name: "Payment Gateway"
    description: "External service (Stripe/Adyen) for handling financial transactions and fines."
  - type: "externalSystem"
    name: "Notification Provider"
    description: "External service (SendGrid/Twilio) for sending alerts, reminders, and notifications."
  - type: "externalSystem"
    name: "Identity Provider"
    description: "External service (Auth0/Keycloak) for managing standardized SSO authentication."
  - type: "externalSystem"
    name: "Digital Content Provider"
    description: "External ILS Federation and content services (OverDrive, OCLC) for external digital catalogs."
relationships:
  - source: "Patron"
    destination: "Library Management System"
    description: "Accesses self-service portal to browse and manage library items"
    technology: "HTTPS"
  - source: "Librarian / Staff"
    destination: "Library Management System"
    description: "Manages catalog, circulation, and administrative tasks"
    technology: "HTTPS"
  - source: "Library Management System"
    destination: "Payment Gateway"
    description: "Processes fines and transactions"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "Notification Provider"
    description: "Sends automated notifications and alerts"
    technology: "HTTPS/REST"
  - source: "Library Management System"
    destination: "Identity Provider"
    description: "Authenticates users via SSO"
    technology: "OIDC"
  - source: "Library Management System"
    destination: "Digital Content Provider"
    description: "Federates digital content and catalogs"
    technology: "HTTPS/REST"