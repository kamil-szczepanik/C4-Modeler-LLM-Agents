# C4 Model: Level 3 - Component
level: component
scope: "Component diagram for the Database container"
parentContainer:
  name: "Database"
elements:
  - type: "component"
    name: "Relational Data Store"
    technology: "PostgreSQL 15"
    description: "Robust ACID compliant data store for secure relational persistence."
  - type: "component"
    name: "Connection Pooler"
    technology: "PgBouncer"
    description: "Manages connection spikes and prevents thread exhaustion."
relationships:
  - source: "Connection Pooler"
    destination: "Relational Data Store"
    description: "Forwards pooled queries [PostgreSQL Wire Protocol]"