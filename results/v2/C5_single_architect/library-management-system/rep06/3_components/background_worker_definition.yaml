level: component
scope: "Component diagram for the Background Worker container"
parentContainer:
  name: "Background Worker"
elements:
  - type: "component"
    name: "Task Dispatcher / Consumer"
    technology: "Python, Celery Worker Core"
    description: "Processes asynchronous tasks and core task dispatching."
  - type: "component"
    name: "Notification Task Handler"
    technology: "Python, Celery"
    description: "Handles notification tasks and interacts with external providers."
  - type: "component"
    name: "Payment Processor Worker"
    technology: "Python, Celery"
    description: "Processes payment-related background tasks and communicates with payment gateways."
  - type: "component"
    name: "Content Sync Worker"
    technology: "Python, Celery"
    description: "Synchronizes digital content with external providers."
  - type: "component"
    name: "Data Maintenance Worker"
    technology: "Python, Celery"
    description: "Performs data maintenance and interacts with the Search Service."
  - type: "component"
    name: "Database Maintenance & Analytics Worker"
    technology: "Python, Celery"
    description: "Executes database maintenance and analytics processing."
  - type: "component"
    name: "Redis"
    technology: "Redis"
    description: "Acts as Celery task state and result backend with strict persistence for EU data residency."
  - type: "component"
    name: "Apache Kafka"
    technology: "Apache Kafka"
    description: "Asynchronous event ingestion via secure TCP with TLS."
  - type: "component"
    name: "Notification Provider"
    technology: "HTTPS Service"
    description: "External notification provider."
  - type: "component"
    name: "Payment Gateway"
    technology: "HTTPS Service"
    description: "External payment gateway."
  - type: "component"
    name: "Digital Content Provider"
    technology: "HTTPS Service"
    description: "External digital content provider."
  - type: "component"
    name: "Search Service"
    technology: "Internal API / Database"
    description: "Search service for high-performance search SLAs."
  - type: "component"
    name: "PostgreSQL"
    technology: "PostgreSQL"
    description: "Primary persistent data store."
relationships:
  - source: "Apache Kafka"
    destination: "Task Dispatcher / Consumer"
    description: "Secure TCP with TLS"
  - source: "Notification Task Handler"
    destination: "Notification Provider"
    description: "HTTPS"
  - source: "Payment Processor Worker"
    destination: "Payment Gateway"
    description: "HTTPS"
  - source: "Content Sync Worker"
    destination: "Digital Content Provider"
    description: "HTTPS"
  - source: "Data Maintenance Worker"
    destination: "Search Service"
    description: "Internal API / Database queries"
  - source: "Task Dispatcher / Consumer"
    destination: "PostgreSQL"
    description: "Reads/Writes data"
  - source: "Notification Task Handler"
    destination: "PostgreSQL"
    description: "Reads/Writes data"
  - source: "Payment Processor Worker"
    destination: "PostgreSQL"
    description: "Reads/Writes data"
  - source: "Content Sync Worker"
    destination: "PostgreSQL"
    description: "Reads/Writes data"
  - source: "Data Maintenance Worker"
    destination: "PostgreSQL"
    description: "Reads/Writes data"
  - source: "Database Maintenance & Analytics Worker"
    destination: "PostgreSQL"
    description: "Reads/Writes data"