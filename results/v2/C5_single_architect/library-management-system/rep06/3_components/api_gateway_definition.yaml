level: component
scope: "Component diagram for the API Gateway container"
parentContainer:
  name: "API Gateway"
elements:
  - type: "component"
    name: "Routing Engine"
    technology: "Spring Cloud Gateway (Java)"
    description: "Routes incoming sanitized requests to the Core Domain Service and Search Service."
  - type: "component"
    name: "Auth & Token Relay Filter"
    technology: "Spring Cloud Gateway (Java), HTTPS/OIDC"
    description: "Introspects and validates JSON Web Tokens (JWTs) against the Identity Provider."
  - type: "component"
    name: "Rate Limiter / Throttler"
    technology: "Spring Cloud Gateway (Java), Redis"
    description: "Checks request quotas against the Redis database."
  - type: "component"
    name: "Request Transformation & Logging Filter"
    technology: "Spring Cloud Gateway (Java)"
    description: "Transforms and logs incoming requests before forwarding."
relationships:
  - source: "Auth & Token Relay Filter"
    destination: "Identity Provider"
    description: "Introspects/Validates JWTs [HTTPS/OIDC]"
  - source: "Rate Limiter / Throttler"
    destination: "Redis Database"
    description: "Checks request quotas [RESP/TCP]"
  - source: "Routing Engine"
    destination: "Core Domain Service"
    description: "Forwards sanitized requests [gRPC]"
  - source: "Routing Engine"
    destination: "Search Service"
    description: "Forwards sanitized requests [gRPC]"