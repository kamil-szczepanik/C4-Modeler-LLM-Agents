level: component
scope: "Component diagram for the Web Application (SPA) container"
parentContainer:
  name: "Web Application (SPA)"
elements:
  - type: "component"
    name: "Routing & Layout Manager"
    technology: "React Router"
    description: "Manages application routing and layout structure."
  - type: "component"
    name: "Authentication State Module"
    technology: "React Context, Zustand, OIDC Client"
    description: "Manages client-side state and authentication via OpenID Connect / OAuth 2.0 without persistent local PII storage."
  - type: "component"
    name: "Catalogue & Search Module"
    technology: "React UI components"
    description: "Provides catalog management and search interface for library patrons and staff."
  - type: "component"
    name: "Circulation & Self-Service Portal"
    technology: "React workflows"
    description: "Provides self-service workflows for loans, renewals, and fines."
  - type: "component"
    name: "API Client Layer"
    technology: "Axios, Fetch API, TanStack Query"
    description: "Handles HTTP request caching, retry logic, deduplication, and communication with backend services."
  - type: "person"
    name: "Patron / Librarian & Staff"
    technology: "Browser"
    description: "Interacts with the application."
  - type: "system"
    name: "Identity Provider"
    technology: "OpenID Connect / OAuth 2.0"
    description: "Authenticates users and issues tokens."
  - type: "container"
    name: "API Gateway"
    technology: "REST/JSON"
    description: "Routes requests from the API client layer to backend services."
relationships:
  - source: "Patron / Librarian & Staff"
    destination: "Web Application (SPA)"
    description: "Interacts with the application [HTTPS]"
  - source: "Authentication State Module"
    destination: "Identity Provider"
    description: "OpenID Connect / OAuth 2.0 [HTTPS]"
  - source: "Catalogue & Search Module"
    destination: "API Client Layer"
    description: "Invokes queries and mutations [In-memory / TypeScript imports]"
  - source: "Circulation & Self-Service Portal"
    destination: "API Client Layer"
    description: "Invokes queries and mutations [In-memory / TypeScript imports]"
  - source: "API Client Layer"
    destination: "API Gateway"
    description: "REST/JSON [HTTPS]"