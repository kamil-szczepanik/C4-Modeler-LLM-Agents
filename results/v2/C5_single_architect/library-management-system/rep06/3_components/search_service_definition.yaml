level: component
scope: "Component diagram for the Search Service container"
parentContainer:
  name: "Search Service"
elements:
  - type: "component"
    name: "Search API Controller"
    technology: "Python, FastAPI, Pydantic"
    description: "Routes search requests and handles request validation and serialization."
  - type: "component"
    name: "Query Builder Component"
    technology: "Python"
    description: "Delegates request parsing and compiles queries."
  - type: "component"
    name: "Index Synchronizer Component"
    technology: "aiokafka"
    description: "Consumes CDC and domain events to update indices."
  - type: "component"
    name: "Search Client Component"
    technology: "elasticsearch-py async client"
    description: "Executes compiled queries and bulk updates."
  - type: "component"
    name: "Elasticsearch"
    technology: "External Database"
    description: "External database for low-latency indexing and complex query capabilities."
  - type: "component"
    name: "API Gateway"
    technology: "API Gateway"
    description: "Routes incoming search requests."
  - type: "component"
    name: "Async Event Broker"
    technology: "Apache Kafka"
    description: "Broker for CDC and domain events."
relationships:
  - source: "API Gateway"
    destination: "Search API Controller"
    description: "Routes search requests [gRPC/REST]"
  - source: "Async Event Broker"
    destination: "Index Synchronizer Component"
    description: "Consumes CDC and domain events [TCP/Kafka Protocol]"
  - source: "Search API Controller"
    destination: "Query Builder Component"
    description: "Delegates request parsing [In-process]"
  - source: "Query Builder Component"
    destination: "Search Client Component"
    description: "Executes compiled queries [In-process]"
  - source: "Index Synchronizer Component"
    destination: "Search Client Component"
    description: "Updates indices [In-process]"
  - source: "Search Client Component"
    destination: "Elasticsearch"
    description: "Executes queries and bulk updates [TCP/HTTP, port 9200]"