level: component
scope: "Component diagram for the Async Event Broker container"
parentContainer:
  name: "Async Event Broker"
elements:
  - type: "component"
    name: "Event Router / Topic Manager"
    technology: "Apache Kafka"
    description: "Manages topics and routes events across the event-driven architecture."
  - type: "component"
    name: "Producer Ingress Handler"
    technology: "Apache Kafka"
    description: "Handles incoming events produced by services like the Core Domain Service."
  - type: "component"
    name: "Consumer Egress Dispatcher"
    technology: "Apache Kafka"
    description: "Dispatches events to consumers such as the Search Service."
  - type: "component"
    name: "Schema Registry"
    technology: "Apache Avro"
    description: "Enforces schema validation and contract compatibility for events."
relationships:
  - source: "Producer Ingress Handler"
    destination: "Schema Registry"
    description: "Validates event schemas via HTTP/REST"
  - source: "Consumer Egress Dispatcher"
    destination: "Schema Registry"
    description: "Validates event schemas via HTTP/REST"