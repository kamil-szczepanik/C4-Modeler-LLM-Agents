# ATAM quality-attribute scenarios for the Clinic Management System brief (v2).
scenarios:
  - id: PERF-01
    quality_attribute: Performance
    stimulus: 500 clinicians open patient EMR screens at the same time during morning rounds
    environment: normal operation
    response: EMR screens are rendered with current data
    response_measure: P95 load time below 1 s
  - id: PERF-02
    quality_attribute: Performance
    stimulus: the lab system sends 10,000 HL7 FHIR results within 5 minutes
    environment: peak load
    response: results are ingested and become visible in the EMR
    response_measure: ingestion within 10 minutes while EMR screens keep P95 below 1 s
  - id: AVAIL-01
    quality_attribute: Availability
    stimulus: the cloud site (eu-central-1) becomes unavailable
    environment: normal operation
    response: traffic is served by the on-premises site
    response_measure: no data loss and service restored within 1 minute
  - id: AVAIL-02
    quality_attribute: Availability
    stimulus: a database node crashes while insurance claims are being submitted
    environment: normal operation
    response: in-flight claims are completed or safely retried
    response_measure: no lost or duplicated claims; recovery within 30 s
  - id: MOD-01
    quality_attribute: Modifiability
    stimulus: a new insurance clearinghouse must be integrated for claim submission
    environment: development
    response: the integration is added
    response_measure: changes confined to one integration component; EMR unchanged
  - id: MOD-02
    quality_attribute: Modifiability
    stimulus: a regulation requires a new audited field in patient demographics
    environment: development
    response: data model, user interface and audit trail are updated
    response_measure: at most three components changed; delivered within one sprint
  - id: SEC-01
    quality_attribute: Security
    stimulus: an attacker logs in with a stolen clinician password
    environment: normal operation
    response: access is denied without the second factor and the attempt is recorded
    response_measure: no access without MFA; security alert within 1 minute
  - id: SEC-02
    quality_attribute: Security
    stimulus: a user opens the record of a patient they are not treating
    environment: normal operation
    response: the access is checked against policy and written to a tamper-evident audit trail
    response_measure: 100% of EMR reads audited; audit retained for at least 10 years
