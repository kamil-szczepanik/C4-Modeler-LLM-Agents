# ATAM quality-attribute scenarios for the Cross-Border Telehealth Platform brief (v2).
scenarios:
  - id: PERF-01
    quality_attribute: Performance
    stimulus: 5,000 concurrent video consultations in the EU during flu season
    environment: peak load
    response: consultations start and run
    response_measure: joining a consultation takes less than 10 s
  - id: PERF-02
    quality_attribute: Performance
    stimulus: 50,000 patients per hour use the symptom checker
    environment: peak load
    response: urgency recommendations are returned
    response_measure: response below 3 s for 95% of requests
  - id: AVAIL-01
    quality_attribute: Availability
    stimulus: a patient's connection drops to 200 kbit/s during a consultation
    environment: normal operation
    response: the consultation continues in degraded mode
    response_measure: no dropped consultation and no loss of clinical notes
  - id: AVAIL-02
    quality_attribute: Availability
    stimulus: the US region fails
    environment: normal operation
    response: US patients are served again without moving their data to the EU
    response_measure: data residency preserved; service restored within 1 hour
  - id: MOD-01
    quality_attribute: Modifiability
    stimulus: a new EU country with its own national e-prescription standard is added
    environment: development
    response: e-prescriptions work in the new country
    response_measure: changes confined to one adapter
  - id: MOD-02
    quality_attribute: Modifiability
    stimulus: a new version of the symptom-checker model is released
    environment: runtime
    response: the new version is used and its recommendations remain traceable
    response_measure: rollback possible; every recommendation linked to its model version
  - id: SEC-01
    quality_attribute: Security
    stimulus: an EU clinician requests the records of a US patient
    environment: normal operation
    response: access is denied unless the patient consented, and the request is logged
    response_measure: no cross-region access without consent
  - id: SEC-02
    quality_attribute: Security
    stimulus: a patient withdraws consent for sharing data for research
    environment: normal operation
    response: the data is no longer shared
    response_measure: sharing stops within 24 hours and this can be verified
