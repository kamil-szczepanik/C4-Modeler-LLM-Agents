# ATAM quality-attribute scenarios for the Library Management System brief (v2).
scenarios:
  - id: PERF-01
    quality_attribute: Performance
    stimulus: 2,000 concurrent catalogue searches at the start of the semester
    environment: peak load
    response: search results are returned
    response_measure: P99 search response below 800 ms
  - id: PERF-02
    quality_attribute: Performance
    stimulus: bulk import of one million catalogue records
    environment: normal operation
    response: records are imported and become searchable
    response_measure: import completes overnight; search P99 stays below 800 ms
  - id: AVAIL-01
    quality_attribute: Availability
    stimulus: a node of the search index fails
    environment: normal operation
    response: searching and circulation continue
    response_measure: no interruption longer than 1 minute; no lost loan transactions
  - id: AVAIL-02
    quality_attribute: Availability
    stimulus: the network link between a branch library and the central system is lost
    environment: normal operation
    response: self-service checkout continues at the branch
    response_measure: loans recorded locally and synchronized after recovery without loss
  - id: MOD-01
    quality_attribute: Modifiability
    stimulus: a new e-book provider must be added to the digital catalogue
    environment: development
    response: the provider's items appear in the catalogue
    response_measure: changes confined to one integration component
  - id: MOD-02
    quality_attribute: Modifiability
    stimulus: an academic library needs loan rules different from public libraries
    environment: runtime
    response: the rules are changed
    response_measure: change made by configuration, without redeploying code
  - id: SEC-01
    quality_attribute: Security
    stimulus: a component would store or process patron data outside the EU
    environment: development and operation
    response: the data flow is prevented by design
    response_measure: all patron data stored and processed in EU regions only
  - id: SEC-02
    quality_attribute: Security
    stimulus: a patron tries to read another patron's loan history through the self-service portal
    environment: normal operation
    response: access is denied and recorded
    response_measure: no unauthorized disclosure; attempt logged
