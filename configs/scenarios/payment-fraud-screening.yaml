# ATAM quality-attribute scenarios for the Real-Time Payment Fraud Screening brief (v2).
scenarios:
  - id: PERF-01
    quality_attribute: Performance
    stimulus: 3,000 authorization requests per second at peak
    environment: peak load
    response: each request receives a decision
    response_measure: P99 decision latency below 50 ms
  - id: PERF-02
    quality_attribute: Performance
    stimulus: analysts load the review queue and case details during peak payment traffic
    environment: peak load
    response: case screens are served without slowing scoring
    response_measure: scoring P99 stays below 50 ms; case screens below 2 s
  - id: AVAIL-01
    quality_attribute: Availability
    stimulus: the scoring service crashes
    environment: peak load
    response: payments are decided by a fallback path
    response_measure: no payment blocked longer than 1 minute; every fallback decision audited
  - id: AVAIL-02
    quality_attribute: Availability
    stimulus: the audit store becomes slow or unavailable
    environment: normal operation
    response: decisions continue and audit records are preserved
    response_measure: no audit record lost; decision latency P99 stays below 50 ms
  - id: MOD-01
    quality_attribute: Modifiability
    stimulus: data scientists deploy a new version of the scoring model
    environment: runtime
    response: the new version takes over traffic
    response_measure: zero downtime; rollback within 5 minutes; decisions reference the model version
  - id: MOD-02
    quality_attribute: Modifiability
    stimulus: fraud analysts add a new rule (e.g. a velocity check) to the screening logic
    environment: runtime
    response: the rule takes effect and decisions based on it can be explained
    response_measure: no downtime; rule active within one hour; every decision names the rules applied
  - id: SEC-01
    quality_attribute: Security
    stimulus: an analyst account is compromised
    environment: normal operation
    response: the attacker cannot obtain card numbers and the access is detected
    response_measure: no clear-text card numbers reachable; anomalous access alerted within 15 minutes
  - id: SEC-02
    quality_attribute: Security
    stimulus: a regulator asks for the explanation of a decision made six years ago
    environment: normal operation
    response: inputs, model version and explanation of the decision are reproduced
    response_measure: answer within one working day from tamper-evident records
