# ATAM quality-attribute scenarios for the Insurance Claims Modernization brief (v2, draft).
scenarios:
  - id: PERF-01
    quality_attribute: Performance
    stimulus: an adjuster opens a claim whose data partly lives on the mainframe
    environment: normal operation
    response: the claim screen is shown
    response_measure: load time below 2 s although the mainframe answers in up to 5 s
  - id: PERF-02
    quality_attribute: Performance
    stimulus: online claim submissions rise to five times normal at month end
    environment: peak load
    response: all submissions are accepted
    response_measure: no impact on the mainframe nightly batch window
  - id: AVAIL-01
    quality_attribute: Availability
    stimulus: the mainframe is unavailable during the nightly batch window
    environment: batch window
    response: online submissions continue and are forwarded later
    response_measure: no lost submissions; forwarded after the window
  - id: AVAIL-02
    quality_attribute: Availability
    stimulus: synchronization between the new platform and the mainframe fails half-way
    environment: normal operation
    response: the state is reconciled
    response_measure: no claim lost or processed twice
  - id: MOD-01
    quality_attribute: Modifiability
    stimulus: the next claim type (motor) is migrated to the new platform
    environment: development
    response: motor claims are handled by the new platform
    response_measure: at most one small mainframe interface change; switch-back within one day
  - id: MOD-02
    quality_attribute: Modifiability
    stimulus: at the end of the program the mainframe is switched off
    environment: development
    response: the new platform becomes the system of record
    response_measure: no rewrite of the adjuster and customer user interfaces
  - id: SEC-01
    quality_attribute: Security
    stimulus: a broker tries to open claims of another broker's customers
    environment: normal operation
    response: access is denied and recorded
    response_measure: no unauthorized access in either system
  - id: SEC-02
    quality_attribute: Security
    stimulus: an adjuster leaves the company
    environment: normal operation
    response: access is revoked through Active Directory
    response_measure: access to both systems removed within 15 minutes
