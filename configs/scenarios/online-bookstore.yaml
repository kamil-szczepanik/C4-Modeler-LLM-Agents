# ATAM quality-attribute scenarios for the Online Bookstore brief (v2).
scenarios:
  - id: PERF-01
    quality_attribute: Performance
    stimulus: Black Friday traffic at ten times the normal load
    environment: peak load
    response: catalogue and product pages are served
    response_measure: page load below 2 s on 3G for 95% of requests
  - id: PERF-02
    quality_attribute: Performance
    stimulus: recommendations are recomputed for all users while customers keep browsing
    environment: normal operation
    response: browsing is not affected
    response_measure: page load stays below 2 s on 3G
  - id: AVAIL-01
    quality_attribute: Availability
    stimulus: a third-party shipping API is down during checkout
    environment: normal operation
    response: checkout completes and the shipping request is handled later
    response_measure: no order fails because of the outage
  - id: AVAIL-02
    quality_attribute: Availability
    stimulus: the AWS region us-east-1 fails
    environment: normal operation
    response: traffic fails over to another region
    response_measure: 99.95% monthly availability kept; no lost orders
  - id: MOD-01
    quality_attribute: Modifiability
    stimulus: a new currency (JPY) must be supported
    environment: development
    response: prices, checkout and payments work in the new currency
    response_measure: changes limited to pricing and payment components or configuration
  - id: MOD-02
    quality_attribute: Modifiability
    stimulus: the recommendation algorithm is replaced
    environment: development
    response: the new algorithm is used for "Customers also bought"
    response_measure: no change outside the recommendation component
  - id: SEC-01
    quality_attribute: Security
    stimulus: an attacker submits SQL injection and cross-site scripting payloads in search and reviews
    environment: normal operation
    response: the attacks are blocked and logged
    response_measure: no successful injection (OWASP Top-10 mitigations in place)
  - id: SEC-02
    quality_attribute: Security
    stimulus: a California customer requests deletion of their personal data
    environment: normal operation
    response: the data is deleted in all services that hold it
    response_measure: completed and verifiable within 30 days (CCPA/GDPR)
