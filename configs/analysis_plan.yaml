# Pre-registered analysis of the v2 experiments.
# Read by scripts/analyze.py; the reasoning is in revision_notes/analysis_plan.md of the paper repository.
# "{judge}" is replaced by the main judge model (column prefix in runs.csv).

reference: C0_baseline
judge: gemini-3.8-flash
control_judge: gemini-3.6-flash
retest_tag: retest
alpha: 0.05
n_permutations: 10000
n_bootstrap: 10000
seed: 20261019

canonical_briefs: [clinic-management-system, library-management-system, online-bookstore]
complex_briefs: [payment-fraud-screening, claims-system-modernization, cross-border-telehealth]

# Confirmatory, primary: every comparison below on both metrics; Holm correction over the
# ten comparisons, separately for each primary metric. Two-sided tests.
primary_metrics:
  - c4_sc
  - "{judge}__iso_mean"

comparisons:
  ablation: [C1_no_product_owner, C2_no_architect, C3_no_devops, C4_no_security, C5_single_architect, C6_four_architects]
  order: [C7_architect_first, C8_security_first]
  specialization: [C9_generic_team]
  memory: [C10_glossary_memory]

# Confirmatory, secondary: role-specific hypotheses with an expected direction.
# Two-sided tests; Holm correction over this list; "supported" = significant and in the expected direction.
# No hypothesis on l2_l3_consistency: it was 1.0 in all nine pilot runs of C0 (no room for a memory effect).
targeted_hypotheses:
  - {id: H1, condition: C1_no_product_owner, metric: "{judge}__req_coverage", expected: lower,
     rationale: "the Product Owner represents user needs and requirement coverage"}
  - {id: H2, condition: C1_no_product_owner, metric: "{judge}__iso_usability", expected: lower,
     rationale: "without the user perspective, user groups are served less well"}
  - {id: H3, condition: C2_no_architect, metric: c4_sc_strict, expected: lower,
     rationale: "the Software Architect is responsible for element and relationship structure"}
  - {id: H4, condition: C2_no_architect, metric: "{judge}__iso_maintainability", expected: lower,
     rationale: "decomposition quality depends on the architect"}
  - {id: H5, condition: C3_no_devops, metric: "{judge}__iso_reliability", expected: lower,
     rationale: "the DevOps Specialist contributes availability and failure handling"}
  - {id: H6, condition: C4_no_security, metric: "{judge}__iso_security", expected: lower,
     rationale: "the Security Specialist contributes security controls"}
  - {id: H7, condition: C5_single_architect, metric: "{judge}__req_coverage", expected: lower,
     rationale: "a single perspective covers fewer requirements than a team"}
  - {id: H8, condition: C6_four_architects, metric: "{judge}__iso_usability", expected: lower,
     rationale: "a homogeneous team of architects lacks the user perspective"}
  - {id: H9, condition: C7_architect_first, metric: "{judge}__req_coverage", expected: lower,
     rationale: "solution-first discussions explore requirements less than problem-first ones"}
  - {id: H10, condition: C9_generic_team, metric: "{judge}__iso_security", expected: lower,
     rationale: "generic engineers lack specialised security attention"}
  - {id: H11, condition: C10_glossary_memory, metric: l1_l2_jaccard, expected: higher,
     rationale: "the shared glossary keeps people and external systems consistent from L1 to L2"}

# Exploratory (reported descriptively with unadjusted tests, labelled as exploratory).
secondary_metrics:
  - c4_sc_strict
  - compilation
  - abstraction_adherence
  - completeness
  - l1_l2_jaccard
  - l2_l3_consistency
  - "{judge}__atam_ri"
  - "{judge}__req_coverage"

# Smallest effects of practical interest: a difference is called negligible only if its
# 95% CI lies entirely within +/- this value.
sesoi:
  c4_sc: 0.10
  "{judge}__iso_mean": 0.25

# Sensitivity analysis: effects on primary metrics adjusted for model size (brief fixed effects + log elements).
size_covariate: total_elements

# Descriptive only (model size and discussion length per condition).
descriptive_extras: [total_relationships, n_containers, n_turns, discussion_words]
