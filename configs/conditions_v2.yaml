# Experimental conditions for the journal revision (v2).
# The team list is the speaking order. Persona keys refer to masc4.prompts.PERSONAS.
# Every study compares its conditions with the shared baseline C0.
# Lean design (decision of 13 Oct 2026): the devops-first, mixed-team and reduced-diversity conditions of
# the preliminary design were dropped and the remaining conditions numbered C0-C10 (pilot runs used the
# earlier ids C9_security_first, C10_generic_team, C12_glossary_memory for C8, C9, C10); the diversity
# question (homogeneous vs heterogeneous team) is answered by C6 vs C0.

generation:
  model: gemini-3.5-flash-lite
  temperature: 0.5
  rounds: 2            # discussion rounds per level (every agent speaks once per round)

conditions:
  - id: C0_baseline
    studies: [ablation, order, specialization, memory]
    description: Four specialized roles, Product Owner speaks first, no shared memory
    team: [product_owner, software_architect, devops, security]
    memory: none

  # Study 1: role ablation
  - id: C1_no_product_owner
    studies: [ablation]
    description: Baseline without the Product Owner
    team: [software_architect, devops, security]
    memory: none
  - id: C2_no_architect
    studies: [ablation]
    description: Baseline without the Software Architect
    team: [product_owner, devops, security]
    memory: none
  - id: C3_no_devops
    studies: [ablation]
    description: Baseline without the DevOps Specialist
    team: [product_owner, software_architect, security]
    memory: none
  - id: C4_no_security
    studies: [ablation]
    description: Baseline without the Security Specialist
    team: [product_owner, software_architect, devops]
    memory: none
  - id: C5_single_architect
    studies: [ablation]
    description: A single Software Architect agent
    team: [software_architect]
    memory: none
  - id: C6_four_architects
    studies: [ablation]
    description: Four identical Software Architect agents
    team: [software_architect, software_architect, software_architect, software_architect]
    memory: none

  # Study 2: interaction order (rotations of the baseline cycle)
  - id: C7_architect_first
    studies: [order]
    description: Rotation of the baseline order starting with the Software Architect
    team: [software_architect, devops, security, product_owner]
    memory: none
  - id: C8_security_first
    studies: [order]
    description: Rotation of the baseline order starting with the Security Specialist
    team: [security, product_owner, software_architect, devops]
    memory: none

  # Study 3: role specialization
  - id: C9_generic_team
    studies: [specialization]
    description: Four generic Software Engineer agents
    team: [generic_engineer, generic_engineer, generic_engineer, generic_engineer]
    memory: none

  # Study 4: shared memory
  - id: C10_glossary_memory
    studies: [memory]
    description: Baseline team with the Glossary Agent maintaining the shared knowledge context K (built after L1 and L2, injected into L2 and L3)
    team: [product_owner, software_architect, devops, security]
    memory: glossary
