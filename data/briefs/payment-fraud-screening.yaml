title: Real-Time Payment Fraud Screening
description: >
  Screens card-not-present payment authorizations of a mid-size payment processor
  for fraud before they are approved, and lets fraud analysts review suspicious payments.
domain: Finance / Payments
constraints:
  - "PCI-DSS Level 1 compliance"
  - "Every decision must be explainable and auditable for 7 years"
  - "Fixed infrastructure budget of at most 25,000 EUR per month"
  - "Operated by a team of three engineers"
functional_requirements:
  - id: R-01
    desc: "Score every authorization request and return approve, decline or review"
  - id: R-02
    desc: "Case management for analysts reviewing payments routed to review"
  - id: R-03
    desc: "Update fraud rules and scoring models without downtime"
nonfunctional_requirements:
  - id: R-04
    quality: Performance
    desc: "Decision latency below 50 ms at P99 at 3,000 authorizations per second"
  - id: R-05
    quality: Security
    desc: "Card data encrypted and tokenized; analysts never see full card numbers"
  - id: R-06
    quality: Auditability
    desc: "Each decision stores its inputs, model version and explanation in tamper-evident form"
  - id: R-07
    quality: Availability
    desc: "If scoring is unavailable, payments must not be blocked for more than 1 minute"
target_cloud:
  provider: AWS
  regions:
    - eu-west-1
