title: Insurance Claims Modernization
description: >
  Gradually replaces the 30-year-old mainframe claims system of a regional insurer
  with a modern platform while the legacy system keeps processing claims.
domain: Insurance / Claims
constraints:
  - "The COBOL/DB2 mainframe stays the system of record for at least 3 years of the migration"
  - "The nightly batch window (23:00-05:00) cannot be extended"
  - "Mainframe changes are expensive: at most one small interface change per quarter"
  - "The team has little cloud experience"
functional_requirements:
  - id: R-01
    desc: "Online claim submission for customers and brokers"
  - id: R-02
    desc: "Claims adjusters handle claims in a new web application"
  - id: R-03
    desc: "Claim types are migrated one by one from the mainframe to the new platform"
nonfunctional_requirements:
  - id: R-04
    quality: Consistency
    desc: "No claim may be lost or processed twice during the migration"
  - id: R-05
    quality: Performance
    desc: "Adjuster screens load in under 2 s although mainframe responses take up to 5 s"
  - id: R-06
    quality: Maintainability
    desc: "Each migrated claim type can be switched back to the mainframe within one day"
  - id: R-07
    quality: Security
    desc: "Single sign-on with the insurer's Active Directory"
target_cloud:
  provider: Hybrid
  regions:
    - on-prem-mainframe
    - azure-westeurope
