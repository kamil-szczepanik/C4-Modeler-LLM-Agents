title: Cross-Border Telehealth Platform
description: >
  Video consultations, e-prescriptions and an AI symptom checker for patients
  in the EU and the US, offered by a single provider.
domain: Healthcare / Telemedicine
constraints:
  - "GDPR (EU) and HIPAA (US) compliance"
  - "Health data of EU patients stays in the EU; data of US patients stays in the US"
  - "The AI symptom checker may be a medical device under the EU MDR; its outputs must be traceable"
  - "Patients in rural areas have unstable internet connections"
functional_requirements:
  - id: R-01
    desc: "Video consultations between patients and licensed clinicians"
  - id: R-02
    desc: "E-prescriptions sent to pharmacies in the patient's country"
  - id: R-03
    desc: "AI symptom checker that recommends the urgency of care"
  - id: R-04
    desc: "Patients manage consent for data sharing per purpose"
nonfunctional_requirements:
  - id: R-05
    quality: Privacy
    desc: "Data residency enforced per region; cross-region access only with consent"
  - id: R-06
    quality: Availability
    desc: "Consultations continue in degraded mode on connections below 300 kbit/s"
  - id: R-07
    quality: Accountability
    desc: "Every symptom-checker recommendation is logged with its inputs and model version"
  - id: R-08
    quality: Interoperability
    desc: "HL7 FHIR in the US; national e-prescription standards in EU countries"
target_cloud:
  provider: GCP
  regions:
    - europe-west3
    - us-central1
