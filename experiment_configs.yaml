# Enhanced Experiment Configurations for Journal Extension
# Defines the new experimental conditions for studying collaboration dynamics

experiments:
  # Experiment 1: Role Ablation Study
  role_ablation:
    name: "Role Ablation Study"
    description: "Remove one expert role and evaluate impact on C4 model quality"
    purpose: "Determine which roles are most critical for architectural quality"
    conditions:
      - id: "baseline"
        name: "Full Team (Baseline)"
        roles: ["Product Owner", "Architect", "DevOps Engineer", "Security Expert"]
        description: "4-agent team with all specialized roles"
      
      - id: "no_product_owner" 
        name: "Without Product Owner"
        roles: ["Architect", "DevOps Engineer", "Security Expert"]
        description: "3-agent team missing business perspective"
      
      - id: "no_security"
        name: "Without Security Expert"
        roles: ["Product Owner", "Architect", "DevOps Engineer"] 
        description: "3-agent team missing security expertise"
      
      - id: "no_devops"
        name: "Without DevOps Engineer"
        roles: ["Product Owner", "Architect", "Security Expert"]
        description: "3-agent team missing operational expertise"
      
      - id: "architect_only"
        name: "Only Architect (Homogeneous)"
        roles: ["Architect", "Architect", "Architect", "Architect"]
        description: "4 identical architect agents"
    
    metrics_focus:
      - "ISO_Functional_Suitability"
      - "ISO_Security" 
      - "ISO_Maintainability"
      - "ATAM_Scenario_Responsiveness"
      - "Coupling_Density"
      - "Semantic_Completeness"
    
    hypothesis: "Removing domain-oriented roles (PO) reduces functional suitability; removing technical roles reduces reliability and security"

  # Experiment 2: Role Interaction Order (Turn Scheduling)
  interaction_order:
    name: "Role Interaction Order Study"
    description: "Vary the speaking order to study influence of early perspectives"
    purpose: "Understand how conversation sequencing affects architectural outcomes"
    conditions:
      - id: "architect_first"
        name: "Architect-First Order"
        roles: ["Product Owner", "Architect", "DevOps Engineer", "Security Expert"]
        speaking_order: ["Architect", "Product Owner", "DevOps Engineer", "Security Expert"]
        description: "Technical-first discussion pattern"
      
      - id: "product_owner_first"  
        name: "Product Owner-First Order"
        roles: ["Product Owner", "Architect", "DevOps Engineer", "Security Expert"]
        speaking_order: ["Product Owner", "Architect", "DevOps Engineer", "Security Expert"]
        description: "Business-first discussion pattern"
      
      - id: "security_first"
        name: "Security-First Order" 
        roles: ["Product Owner", "Architect", "DevOps Engineer", "Security Expert"]
        speaking_order: ["Security Expert", "Architect", "Product Owner", "DevOps Engineer"]
        description: "Risk-first discussion pattern"
      
      - id: "devops_first"
        name: "DevOps-First Order"
        roles: ["Product Owner", "Architect", "DevOps Engineer", "Security Expert"]
        speaking_order: ["DevOps Engineer", "Product Owner", "Architect", "Security Expert"] 
        description: "Operations-first discussion pattern"
    
    metrics_focus:
      - "ISO_Functional_Suitability"
      - "ISO_Maintainability"
      - "Abstraction_Coherence"
      - "Coupling_Density"
      - "ATAM_Modifiability_Scenarios"
    
    hypothesis: "Architect-first yields higher structural validity but lower semantic completeness; PO-first yields richer functional mapping"

  # Experiment 3: Role Reassignment (Persona Neutralization)
  role_specialization:
    name: "Role Specialization vs. Generic Study"
    description: "Compare specialized personas against generic software engineers"
    purpose: "Test whether role specialization adds meaningful diversity"
    conditions:
      - id: "specialized_team"
        name: "Specialized Expert Team"
        roles: ["Product Owner", "Architect", "DevOps Engineer", "Security Expert"]
        persona_type: "specialized"
        description: "Each agent has detailed role-specific persona and expertise"
      
      - id: "generic_team"
        name: "Generic Engineer Team" 
        roles: ["Software Engineer", "Software Engineer", "Software Engineer", "Software Engineer"]
        persona_type: "generic"
        description: "Four identical generic software engineer agents"
      
      - id: "mixed_team"
        name: "Mixed Specialization Team"
        roles: ["Product Owner", "Software Engineer", "Software Engineer", "Security Expert"]
        persona_type: "mixed"
        description: "Partial specialization with core domain expertise"
    
    metrics_focus:
      - "ISO_Functional_Suitability"
      - "ISO_Usability" 
      - "ISO_Maintainability"
      - "Semantic_Completeness"
      - "Emergent_Naming_Consistency"
    
    hypothesis: "Specialized teams outperform generic ones on functional suitability and semantic completeness"

  # Experiment 4: Shared Memory/Glossary Agent
  shared_memory:
    name: "Shared Memory and Glossary Study"
    description: "Evaluate impact of persistent shared knowledge on consistency"
    purpose: "Test whether shared glossary improves architectural consistency"
    conditions:
      - id: "no_shared_memory"
        name: "No Shared Memory (Baseline)"
        roles: ["Product Owner", "Architect", "DevOps Engineer", "Security Expert"]
        memory_type: "none"
        description: "Agents rely only on conversation context"
      
      - id: "glossary_agent"
        name: "Shared Glossary Agent"
        roles: ["Product Owner", "Architect", "DevOps Engineer", "Security Expert"]
        memory_type: "glossary"
        description: "Dedicated glossary agent maintains naming consistency"
        additional_agents: ["Glossary Agent"]
      
      - id: "persistent_memory" 
        name: "Persistent Shared Memory"
        roles: ["Product Owner", "Architect", "DevOps Engineer", "Security Expert"]
        memory_type: "persistent"
        description: "All agents share persistent memory of entities and decisions"
      
      - id: "hierarchical_memory"
        name: "Hierarchical Memory Structure"
        roles: ["Product Owner", "Architect", "DevOps Engineer", "Security Expert"]
        memory_type: "hierarchical" 
        description: "Memory organized by C4 abstraction levels"
    
    metrics_focus:
      - "ISO_Maintainability"
      - "ISO_Compatibility"
      - "Emergent_Naming_Consistency"
      - "Abstraction_Coherence"
      - "ATAM_Modifiability_Scenarios"
    
    hypothesis: "Glossary-based collaboration significantly improves naming consistency and cross-level traceability"

  # Experiment 5: Cross-Level Consistency and Role Diversity
  role_diversity:
    name: "Role Diversity and Cross-Level Consistency Study" 
    description: "Examine how team heterogeneity affects C4 level coherence"
    purpose: "Quantify how diversity of expertise contributes to structural consistency"
    conditions:
      - id: "heterogeneous_baseline"
        name: "Heterogeneous Expert Team"
        roles: ["Product Owner", "Architect", "DevOps Engineer", "Security Expert"]
        diversity_level: "high"
        description: "Maximum role diversity baseline"
      
      - id: "homogeneous_architects"
        name: "Homogeneous Architect Team"
        roles: ["Architect", "Architect", "Architect", "Architect"] 
        diversity_level: "none"
        description: "No role diversity - all architects"
      
      - id: "reduced_diversity"
        name: "Reduced Diversity Team"
        roles: ["Architect", "Architect", "Product Owner", "Security Expert"]
        diversity_level: "medium"
        description: "Partial diversity with architect emphasis"
      
      - id: "domain_focused"
        name: "Domain-Focused Team"
        roles: ["Product Owner", "Product Owner", "Business Analyst", "Domain Expert"]
        diversity_level: "domain"
        description: "High diversity within business domain"
    
    metrics_focus:
      - "ISO_Compatibility"
      - "ISO_Functional_Suitability" 
      - "Abstraction_Coherence"
      - "Layering_Violations"
      - "Cross_Level_Consistency"
    
    hypothesis: "Diverse teams yield higher abstraction coherence but may have more redundancy"

# Experimental Protocol Configuration
protocol:
  datasets:
    - "clinic-management-system"
    - "library-management-system" 
    - "nextgen-pos"
    - "online-bookstore"
    - "student-information-system"
  
  rounds_per_condition: 3
  c4_levels: ["context", "containers", "components"]
  
  evaluation_layers:
    legacy:
      - "compilation_success"
      - "abstraction_adherence" 
      - "definitional_consistency"
      - "cross_level_consistency"
      - "semantic_consistency"
      - "emergent_naming_consistency"
      - "qualitative_rubric"
      - "architect_critique"
      - "security_assessment"
    
    iso_25010:
      - "functional_suitability"
      - "reliability"
      - "performance_efficiency"
      - "maintainability"
      - "security"
      - "usability"
      - "compatibility"
    
    atam_scenarios:
      - "performance_responsiveness"
      - "modifiability_responsiveness" 
      - "security_responsiveness"
      - "overall_responsiveness"
    
    soundness_metrics:
      - "coupling_density"
      - "abstraction_coherence"
      - "layering_violations"
      - "semantic_completeness"

  statistical_analysis:
    - "anova_across_conditions"
    - "correlation_analysis" 
    - "effect_size_calculation"
    - "significance_testing"

# Quality Attribute Scenarios for ATAM Evaluation
quality_scenarios:
  performance:
    - id: "PERF-01"
      stimulus: "Normal operational load (100 concurrent users)"
      response: "System responds within 2 seconds for 95% of requests"
      measure: "Response time under load"
    
    - id: "PERF-02" 
      stimulus: "Database query complexity increases"
      response: "Query performance remains under 500ms"
      measure: "Database response time"
  
  modifiability:
    - id: "MOD-01"
      stimulus: "Developer replaces database engine (MySQL to PostgreSQL)"
      response: "Changes isolated to data access layer only"
      measure: "Number of components affected"
    
    - id: "MOD-02"
      stimulus: "New authentication method added (OAuth2)"
      response: "Integration requires minimal component changes"
      measure: "Implementation effort and coupling"
  
  security:
    - id: "SEC-01"
      stimulus: "Attacker attempts SQL injection"
      response: "System prevents injection and logs attempt"
      measure: "Security mechanism effectiveness"
    
    - id: "SEC-02"
      stimulus: "Unauthorized access attempt to sensitive data" 
      response: "Access denied, audit trail created"
      measure: "Access control robustness"

# Metric Definitions and Scaling
metric_definitions:
  iso_25010_scale:
    description: "0-5 point scale for ISO/IEC 25010 attributes"
    levels:
      0: "Poor - Major deficiencies"
      1: "Below Average - Significant issues"
      2: "Average - Some issues present"
      3: "Good - Minor issues only" 
      4: "Very Good - Minimal issues"
      5: "Excellent - No significant issues"
  
  responsiveness_index:
    description: "ATAM responsiveness calculation"
    formula: "RI = Coverage_Score × (1 - Impact_Size)"
    range: "0.0 to 1.0 (higher is better)"
  
  coupling_density:
    description: "Architectural coupling measurement"
    formula: "CD = relationships / components²"
    interpretation: "Lower values indicate better modularity"
